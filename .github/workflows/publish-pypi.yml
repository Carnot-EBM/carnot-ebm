# PyPI Trusted Publishing workflow for carnot-ebm
#
# Configured 2026-05-08 per operator directive: PyPI pending publisher
# established with PyPI project name "carnot-ebm", owner "Carnot-EBM",
# repo "carnot-ebm", workflow filename "publish-pypi.yml", environment
# "pypi". This workflow uses OIDC trusted publishing per CLAUDE.md
# Phase 1 ship discipline + sovereignty Rule 3 (mirroring) — no
# long-lived secrets stored anywhere.
#
# Trigger: a tag matching v* (e.g., v0.1.0). Tag → build sdist + wheel
# → publish to PyPI via OIDC.
#
# To cut a release:
#   git tag v0.1.0 -m "Phase 1 ship: initial PyPI release"
#   git push origin v0.1.0
#
# Prerequisites verified:
#   - PyPI pending publisher configured
#   - GitHub Environment "pypi" exists with appropriate protection rules
#   - python/carnot/ source tree is shippable
#
# Reference: https://docs.pypi.org/trusted-publishers/

name: Publish carnot-ebm to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history for version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Show built artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/carnot-ebm
    permissions:
      id-token: write  # mandatory for OIDC trusted publishing
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` needed — OIDC handles auth via the configured
        # pending publisher on PyPI side.
