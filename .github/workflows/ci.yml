name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    name: Rust Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude carnot-python -- -D warnings

      - name: Build
        run: cargo build --workspace --exclude carnot-python

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace --exclude carnot-python

  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install deps
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          source .venv/bin/activate
          ruff check python/ tests/

      - name: Ruff format check
        run: |
          source .venv/bin/activate
          ruff format --check python/ tests/

      - name: Mypy strict type check
        run: |
          source .venv/bin/activate
          mypy python/carnot

  python-test:
    name: Python Tests (100% coverage)
    runs-on: ubuntu-latest
    # DELIBERATELY NOT `needs: python-lint` (removed 2026-08-24).
    #
    # python-lint has been failing continuously, so this job returned SKIPPED
    # rather than failed on every recent run. Skipped reads as "nothing to see"
    # in the UI, so nobody noticed the suite had stopped reporting at all. A
    # 2026-04-14 commit had already abandoned the conductor's own full-suite
    # branch on the grounds that "Full suite runs via CI" -- which this made
    # false. The project was left with no full-suite reporter anywhere.
    #
    # Lint health and test health are independent signals. A formatting
    # violation should not hide whether 57,013 tests pass. Gating them together
    # means the cheaper signal can silence the expensive one, which is exactly
    # what happened.
    #
    # Restoring the dependency is fine ONCE lint is green. As of 2026-08-24 that
    # is 3,953 ruff errors, 5,437 files needing reformatting, and one blocking
    # mypy error in the vendored thrml tree -- deliberate work, not a side
    # effect of this change. See ops/known-issues.md.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install deps
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run tests with 100% coverage
        run: |
          source .venv/bin/activate
          PYTHONPATH=python:$PYTHONPATH pytest tests/python -v -n auto \
            --cov=python/carnot \
            --cov-report=term-missing \
            --cov-fail-under=100

  pyo3-check:
    name: PyO3 Bindings Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pyo3-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pyo3-

      - name: Check PyO3 bindings compile
        run: cargo check -p carnot-python

  spec-coverage:
    name: Spec Traceability
    runs-on: ubuntu-latest
    needs: [rust-test, python-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check all tests trace to specs
        run: python3 scripts/check_spec_coverage.py

  tech-report-sync:
    # Catches the case where docs/technical-report.md was edited but the
    # corresponding docs/technical-report.html (served by GitHub Pages at
    # carnot-ebm.org) was not regenerated.  The pre-commit hook
    # tech-report-html-sync handles this locally, but the hook is per-clone
    # state and gets bypassed by fresh clones, --no-verify commits, and
    # the conductor's automated commits.  This CI job is the durable gate.
    #
    # If this job fails on a PR, run locally:
    #   python scripts/build_technical_report.py
    #   git add docs/technical-report.html
    #   git commit --amend  (or new commit)
    name: Technical Report HTML in sync with MD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install markdown renderer
        run: pip install markdown

      - name: Verify docs/technical-report.html is up-to-date
        run: python3 scripts/build_technical_report.py --check
