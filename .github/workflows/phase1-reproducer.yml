name: Phase 1 Independent Reproducer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Carnot-EBM
        run: pip install -e .

      - name: Run verify
        run: carnot verify --code 'def add(a, b): return a - b' --func add --test "(2,3):5"
