repos:
  # Secret scanning — gitleaks v8.x scans staged file diffs for high-
  # confidence API-key / private-key / cloud-credential patterns before
  # they get committed. Runs `gitleaks protect --staged` which only
  # inspects the diff going into the commit (not full history), so the
  # hook is fast (<1 s on typical commits).  Allowlist for
  # tests/python/test_ebm_cot_calibrator_v*.py JAX-PRNG-key false
  # positives lives in `.gitleaks.toml` at the repo root.
  #
  # A full-history scan across the 2542-commit record was run 2026-04-23
  # and produced only those 3 allowlisted false positives — this hook
  # exists to keep that clean-state invariant from drifting.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Rust formatting
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: rustfmt
        args: ["--", "--check"]
      - id: cargo-check
        name: cargo check
        args: ["--workspace", "--exclude", "carnot-python"]

  # Rust linting
  - repo: local
    hooks:
      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --exclude carnot-python -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Rust test coverage enforcement
      - id: rust-test-coverage
        name: rust tests
        entry: cargo test --workspace --exclude carnot-python
        language: system
        types: [rust]
        pass_filenames: false

  # Python formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Python type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy python/carnot
        language: system
        types: [python]
        pass_filenames: false

      # Python test coverage enforcement
      - id: pytest-coverage
        name: pytest (100% coverage)
        entry: pytest tests/python --cov=python/carnot --cov-report=term-missing --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false

      # Spec coverage: every test must reference a REQ-* or SCENARIO-*
      - id: spec-coverage
        name: spec coverage check
        entry: python scripts/check_spec_coverage.py
        language: system
        types_or: [python, rust]
        pass_filenames: false

      # Batching enforcement: prevent new sequential question loops in experiment scripts
      # (RETRO-045) — documentation alone (Exp 481, 77 violations) did not prevent new
      # violations; this hook makes enforcement automatic at commit time.
      - id: batching-check
        name: Batching enforcement (BatchedInferenceRunner required)
        entry: python scripts/batching_precommit_check.py
        language: system
        types: [python]
        pass_filenames: false

      # Technical report HTML sync: regenerate docs/technical-report.html
      # whenever docs/technical-report.md changes, so GitHub Pages never
      # lags behind the Markdown source of truth. Before this hook the HTML
      # drifted three milestones behind the MD (stuck at "473 experiments /
      # 22 milestones" while the MD read "500+ / 25"). The hook runs
      # scripts/build_technical_report.py, stages the regenerated HTML, and
      # lets the commit proceed with both files included in the same commit.
      - id: tech-report-html-sync
        name: technical-report.html sync from .md
        entry: python scripts/precommit_sync_technical_report.py
        language: system
        files: '^docs/technical-report\.md$'
        pass_filenames: false
