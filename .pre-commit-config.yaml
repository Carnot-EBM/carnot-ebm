repos:
  # Secret scanning — gitleaks v8.x scans staged file diffs for high-
  # confidence API-key / private-key / cloud-credential patterns before
  # they get committed. Runs `gitleaks protect --staged` which only
  # inspects the diff going into the commit (not full history), so the
  # hook is fast (<1 s on typical commits).  Allowlist for
  # tests/python/test_ebm_cot_calibrator_v*.py JAX-PRNG-key false
  # positives lives in `.gitleaks.toml` at the repo root.
  #
  # A full-history scan across the 2542-commit record was run 2026-04-23
  # and produced only those 3 allowlisted false positives — this hook
  # exists to keep that clean-state invariant from drifting.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Rust formatting
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: rustfmt
        args: ["--", "--check"]
      - id: cargo-check
        name: cargo check
        args: ["--workspace", "--exclude", "carnot-python"]

  # Rust linting
  - repo: local
    hooks:
      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --exclude carnot-python -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Rust test coverage enforcement
      - id: rust-test-coverage
        name: rust tests
        entry: cargo test --workspace --exclude carnot-python
        language: system
        types: [rust]
        pass_filenames: false

  # Python formatting and linting
  # Pinned to match the .venv ruff (0.15.9) — the older pre-commit pin
  # (v0.8.6) didn't recognize newer rule codes like UP045 added in our
  # per-file ignores, causing TOML parse errors at hook time.
  #
  # CHECK-ONLY mode (2026-05-03 fail-forward fix): the hooks below run
  # in non-modifying mode so pre-commit never needs to stash-and-restore
  # the working tree. The stash-restore cycle silently lost 5+ files
  # during the .94 milestone when the restore patch failed to apply
  # cleanly. By making hooks check-only the working tree is never
  # touched, eliminating the data-loss path entirely. Operators run
  # `.venv/bin/ruff check --fix` and `.venv/bin/ruff format` manually
  # before staging if they want auto-fixes.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: ["--no-fix"]
      - id: ruff-format
        args: ["--check"]

  # Python type checking
  - repo: local
    hooks:
      # Hook entries below use .venv/bin/<tool> rather than bare names so
      # they work without the operator activating the venv before each
      # commit. Pre-commit's `language: system` doesn't activate the venv
      # by itself; bare `mypy`/`pytest` require those binaries on $PATH,
      # which is fragile across operator clones and the conductor's
      # automated commit pipeline. Activated 2026-04-26 after the audit
      # found these hooks were silently broken on this clone.
      - id: mypy
        name: mypy
        # --ignore-missing-imports: many runtime deps (optax, z3, sklearn,
        #   pynvml, mlir_aie, etc.) lack PEP-561 type-stub markers; mypy's
        #   default behaviour is to error on each. We don't gain much from
        #   stub-installing every transitive — strict typing inside our
        #   own modules is what matters.
        # --explicit-package-bases: avoids "Source file found twice" when
        #   mypy walks both `python/carnot/` (the package source) and any
        #   accidentally-discovered alternate import path.
        entry: .venv/bin/mypy --ignore-missing-imports --explicit-package-bases python/carnot
        language: system
        types: [python]
        pass_filenames: false

      # Python test coverage enforcement — manual stage only.
      #
      # Originally ran on every commit, but the .73 milestone surfaced
      # the conductor-incompatibility: each conductor commit blocks for
      # 10+ min on this hook, and pytest-xdist's multiprocessing leaves
      # zombie workers if it's killed mid-run (contributed to the
      # 2026-04-26 swap-saturation incident — see
      # `openspec/change-proposals/conductor-process-isolation.md`).
      #
      # Coverage is now CI-only — see `.github/workflows/ci.yml`'s
      # `python-test` job. Run locally with:
      #   pre-commit run --hook-stage manual pytest-coverage
      # or
      #   .venv/bin/pytest tests/python --cov=python/carnot --cov-fail-under=100
      - id: pytest-coverage
        name: pytest (100% coverage) — manual / CI-only
        stages: [manual]
        entry: .venv/bin/pytest tests/python --cov=python/carnot --cov-report=term-missing --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false

      # Spec coverage: every test must reference a REQ-* or SCENARIO-*
      # Staged-only scope (pass_filenames: true) — catches NEW untraceable
      # tests at commit time. Whole-repo audits run via:
      #   .venv/bin/python scripts/check_spec_coverage.py
      # (no args). Switched to staged-only on 2026-04-28 after the .80
      # rescue blocker — the previous whole-repo scope blocked unrelated
      # commits on 41 pre-existing untraceable conductor-generated tests.
      - id: spec-coverage
        name: spec coverage check
        entry: .venv/bin/python scripts/check_spec_coverage.py
        language: system
        types_or: [python, rust]
        pass_filenames: true

      # Batching enforcement: prevent new sequential question loops in experiment scripts
      # (RETRO-045) — documentation alone (Exp 481, 77 violations) did not prevent new
      # violations; this hook makes enforcement automatic at commit time.
      - id: batching-check
        name: Batching enforcement (BatchedInferenceRunner required)
        entry: .venv/bin/python scripts/batching_precommit_check.py
        language: system
        types: [python]
        pass_filenames: false

      # Technical report HTML sync: regenerate docs/technical-report.html
      # whenever docs/technical-report.md changes, so GitHub Pages never
      # lags behind the Markdown source of truth. Before this hook the HTML
      # drifted three milestones behind the MD (stuck at "473 experiments /
      # 22 milestones" while the MD read "500+ / 25"). The hook runs
      # scripts/build_technical_report.py, stages the regenerated HTML, and
      # lets the commit proceed with both files included in the same commit.
      - id: tech-report-html-sync
        name: technical-report.html sync from .md
        entry: .venv/bin/python scripts/precommit_sync_technical_report.py
        language: system
        files: '^docs/technical-report\.md$'
        pass_filenames: false
