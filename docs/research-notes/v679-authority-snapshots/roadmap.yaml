    6. Bind qualified checkpoint and protocol hashes. Use constrained_set, constrained_mlp and local_logistic with identical exposed source bytes and output semantics. Verify decisions match direct current model outputs before timing; a fast wrong service is disqualified.
    7. Time ingestion, byte handling, view construction, features, energy, calibration, bank lookup, typed decision and serialization. Use batch sizes 1/8/32, ten warmups and thirty paired timed blocks per size. Randomize arm order within each block. Report cold start separately from steady state, and include all censored calls.
