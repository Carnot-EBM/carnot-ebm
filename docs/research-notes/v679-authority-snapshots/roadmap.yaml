    3. Add task-owned REQ-* and SCENARIO-* requirements to the relevant capability spec before code. Freeze the complete affected module/test closure and exact validation argv before implementation. Write meaningful failing tests first. Keep all original assertions; no skip, xfail or weakened tests. Use authentic historical fixtures independent of the mutable roadmap.
    4. Use a task-owned current dispatcher whose complete affected test/module closure and exact argv are frozen in a new REQ-* before code. Reuse low-level primitives, never historical experiment mains. Required commands include all affected consumers, changed-code coverage, static checks, task E2E and cold replay. Test the REAL CLI dispatcher with a recording child executor: its command names, argv and required/diagnostic classification must equal the frozen manifest byte for byte, including commands appended after helper calls. Reject undeclared children. Run broader repository health as an explicitly diagnostic bounded command; record nonzero/timeout unchanged, never claim a full-suite pass. Do not remove an inherited required check; invoking an old entrypoint retains its entire old contract. A new scope needs an explicit prospective rationale and complete dependency inventory, not a relabeled failure. Give each run and command a unique private root; create every pytest basetemp parent before launch. Wait for child exit and closed log handles, then copy bytes once to an attempt-specific content-addressed durable path. Hash that final path, never a live or reused /tmp log. Never rewrite a log referenced by a result. Execute cold replay after receipt sealing. Test a later retry, a missing parent and a one-byte log mutation. Preserve historical artifacts and their hashes.
