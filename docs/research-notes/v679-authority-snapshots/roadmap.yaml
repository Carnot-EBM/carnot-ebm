    TASK:
    Bind the V679 authority and write docs/research-notes/v679-method-map.md. Register adopted literature, causal contrasts and validation ownership without rerunning science.
    Deliverable: {project_root}/results/experiment_7809_v679_contract_methods.json.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print a flushed start line. Check named input paths, digests, schemas, exact gate fields and required resources before compute. Distinguish a science producer from a conductor pre-gate receipt. Missing external inputs yield complete_blocked_* with verdict_class=blocked and the failed operand. No simulated substitute.
    1. Print a flushed progress line at each phase boundary, and before and after every model load, generation, benchmark and subprocess. Include elapsed seconds and completed units. Emit status inside long loops and while supervising children at least every 60 seconds. Keep every silence gap below 600 seconds. Kill only owned children at their timeout. Never pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Bound each tool call; poll long commands at most 60 seconds apart. File-writing silence also triggers the stall rule.
    3. Add task-owned REQ-* and SCENARIO-* requirements to the relevant capability spec before code. Freeze the complete affected module/test closure and exact validation argv before implementation. Write meaningful failing tests first. Keep all original assertions; no skip, xfail or weakened tests. Use authentic historical fixtures independent of the mutable roadmap.
    4. Use a task-owned current dispatcher whose complete affected test/module closure and exact argv are frozen in a new REQ-* before code. Reuse low-level primitives, never historical experiment mains. Required commands include all affected consumers, changed-code coverage, static checks, task E2E and cold replay. Test the REAL CLI dispatcher with a recording child executor: its command names, argv and required/diagnostic classification must equal the frozen manifest byte for byte, including commands appended after helper calls. Reject undeclared children. Run broader repository health as an explicitly diagnostic bounded command; record nonzero/timeout unchanged, never claim a full-suite pass. Do not remove an inherited required check; invoking an old entrypoint retains its entire old contract. A new scope needs an explicit prospective rationale and complete dependency inventory, not a relabeled failure. Give each run and command a unique private root; create every pytest basetemp parent before launch. Wait for child exit and closed log handles, then copy bytes once to an attempt-specific content-addressed durable path. Hash that final path, never a live or reused /tmp log. Never rewrite a log referenced by a result. Execute cold replay after receipt sealing. Test a later retry, a missing parent and a one-byte log mutation. Preserve historical artifacts and their hashes.
    5. CHANGE FROM PRIOR FAILURE: V678 contract reader works. Bind the newly authored V679 table/YAML and immutable authority; add phase-specific command manifests and a literature map. The contract remains independent of science gates.
    6. Compare the literal design table, embedded V679 JSON and matching staged or active YAML. Require fourteen tasks Exp7809 through Exp7822 in order. Validate titles, phases, outputs, models, substrates and gates independently. Store exact YAML and design bytes under docs/research-notes/v679-authority-snapshots/. A later roadmap must not replace historical authority.
    7. Run unchanged schema, exclusion, prior-failure, gate, harness-fit, ARC-floor and overdue-priority readers. Challenge private copies with missing tasks, reordered IDs, stale designs, changed models, misspelled producer fields and incomplete prior_failures. Confirm each is rejected.
    8. Write the method map from the completed V679 research review. Register the CoEV text deletion diagnostic, CCHD matched augmentation, Memoir write timing, delayed-feedback capacity and the September noisy-constraint paper's worst-window diagnostic. Keep visual-domain results, vendor efficiency estimates and exposed local measurements separate.
    9. Preserve the V678 failure ledger and the oracle-distinct corrigendum. Require task-local prospective validation for new entrypoints; inherited full-suite obligations remain unmet. This contract result cannot qualify any scientific producer.
    10. Run the frozen affected unit suite and require 100% statement coverage of all new or changed modules and CLI paths. Use private coverage shards with identical branch settings and explicit include paths. Preserve all shard exits before combining. Use PYTHONPATH=python:. with pytest -n 0 -o addopts= --no-cov. Run scoped Ruff check/format, mypy, and scripts/check_spec_coverage.py on explicit test files. Fix owned failures before measurement.
    11. Run the task-specific real entrypoint E2E and applicable ops/e2e-test-plan.md checks. Reduce raw rows in a fresh process. Run scripts/adversarial_verify.py on the exact candidate and scripts/verdict_row_consistency_lint.py --strict. Save validation argv, exits and durable log hashes. Test fixtures and pytest basetemp stay outside results/. Copy completed validation logs to task-owned raw storage before hashing. Failed required validation sets every readiness field to 0 and verdict_class=disqualified.
    12. Write the exact deliverable atomically after validation. Preserve null, rejected, censored and unstarted rows. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Apply same-verdict retirement to listed priors. Do not activate, publish, change production defaults, rewrite historical artifacts, or modify guards.

    13. Prefer existing pure readers with explicit input paths. Add source only for a demonstrated missing behavior. For a documentation-only reduction, validate inputs, output schema, private negative mutations and raw-to-summary equality; do not create another large framework solely to write this result.

    14. Record the actual V678 failures: candidate_roster_mismatch, five stale receipt hashes, Ruff formatting, terminated broad-suite readiness and missing pytest parent. Map each to its specific current repair and a negative test. Do not mark those fixes shipped in this contract artifact.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, milestone, run_date: Bind this task, 2026.09.679 and {date}. principle: Each result has one owner.
    - honest_verdict: Terminal complete_* string; complete_blocked_* for external missing inputs. principle: External incompleteness cannot be fixed by retrying owned work.
    - verdict_class: One of positive | circular_positive | null | blocked | disqualified | partial. Partial means incomplete owned work only. principle: Claim strength travels with the record.
    - flagged_adversarial: Actual terminal-reader boolean. principle: Invalid evidence cannot open a gate.
    - gate_check_summary: Failed checks with upstream id, exact path/hash, field, operator, expected and observed values; [] when none fail. principle: Missing evidence differs from a scientific null.
    - rows: Per-independent-family/game/seed/arm or per-check records, including raw provenance and metrics. principle: Recompute every comparison from its units.
    - acceptance_gate_results: Separate validity, readiness, probability_quality, decision_benefit, retention and efficiency; unmeasured values are null. principle: A working fixture proves no scientific gain.
    - duration_s, phase_spans: Measured monotonic elapsed times. principle: Duration reflects actual work.
    - random_seed, reproducibility_checksum: Exact code, inputs, roles, configuration and seed digests. principle: Replay requires identical inputs.
    - sample_size_budget: Intended, eligible, started, completed, excluded, censored and independent N. principle: Views and seeds are not new families.
    - source_artifact_hashes: Paths, digests, dates, imported fields and eligibility. principle: Old files cannot replace missing current producers.
    - preconditions_checked: Actual input, custody, backend and resource checks. principle: Cheap failures precede compute.
    - validation_receipts: Frozen affected scope, commands, exits, log hashes, coverage, E2E and cold readers. principle: Every required check must pass.
    - verifier_is_oracle, claim_scope: Exact-authority/fixture success is circular_positive. All 640 source families are exposed development data. principle: No hidden generalization or oracle-distinct benefit follows from fixture truth.
    - field_principles: Preserve the rationale for every field and gate. principle: Evidence requirements must stay understandable.
    - inference_substrate, inference_substrate_class: aggregation_from_upstream_artifacts, aggregation. Record planned versus actual class if blocked before compute. principle: Floors follow invoked work.
    - MODEL_SPECS, model_specs, model_invocation_counts: []; record actual loaded-file hashes, calls and tokens. principle: Citing a model is not invoking it.
    - contract_ready_score: 1 only after table/JSON/YAML and unchanged-reader checks pass. principle: Administrative agreement is not scientific benefit.
    - authority_snapshot_paths, method_map_path: Durable immutable files with hashes. principle: Rollover must not invalidate past tests.

    - validation_command_manifest_path, validation_command_manifest_sha256, observed_child_commands, repository_health: Prospective required/diagnostic scope and actual dispatch receipts. principle: A renamed runner must not silently change its obligations.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7809_v679_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
