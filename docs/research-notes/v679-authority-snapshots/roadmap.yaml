    Produce one evidence-bound row for each attached board and an acquisition decision based on qualified whole-service cost. This is an unconditional document/evidence audit; no hardware probe or integration runs.
    Deliverable: {project_root}/results/experiment_7820_v679_hardware_evidence.json.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print a flushed start line. Check named input paths, digests, schemas, exact gate fields and required resources before compute. Distinguish a science producer from a conductor pre-gate receipt. Missing external inputs yield complete_blocked_* with verdict_class=blocked and the failed operand. No simulated substitute.
    1. Print a flushed progress line at each phase boundary, and before and after every model load, generation, benchmark and subprocess. Include elapsed seconds and completed units. Emit status inside long loops and while supervising children at least every 60 seconds. Keep every silence gap below 600 seconds. Kill only owned children at their timeout. Never pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Bound each tool call; poll long commands at most 60 seconds apart. File-writing silence also triggers the stall rule.
    3. Add task-owned REQ-* and SCENARIO-* requirements to the relevant capability spec before code. Freeze the complete affected module/test closure and exact validation argv before implementation. Write meaningful failing tests first. Keep all original assertions; no skip, xfail or weakened tests. Use authentic historical fixtures independent of the mutable roadmap.
    4. Use a task-owned current dispatcher whose complete affected test/module closure and exact argv are frozen in a new REQ-* before code. Reuse low-level primitives, never historical experiment mains. Required commands include all affected consumers, changed-code coverage, static checks, task E2E and cold replay. Test the REAL CLI dispatcher with a recording child executor: its command names, argv and required/diagnostic classification must equal the frozen manifest byte for byte, including commands appended after helper calls. Reject undeclared children. Run broader repository health as an explicitly diagnostic bounded command; record nonzero/timeout unchanged, never claim a full-suite pass. Do not remove an inherited required check; invoking an old entrypoint retains its entire old contract. A new scope needs an explicit prospective rationale and complete dependency inventory, not a relabeled failure. Give each run and command a unique private root; create every pytest basetemp parent before launch. Wait for child exit and closed log handles, then copy bytes once to an attempt-specific content-addressed durable path. Hash that final path, never a live or reused /tmp log. Never rewrite a log referenced by a result. Execute cold replay after receipt sealing. Test a later retry, a missing parent and a one-byte log mutation. Preserve historical artifacts and their hashes.
    5. CHANGE FROM PRIOR FAILURE: Reproduce Exp7806 missing basetemp-parent failure in a private root; create unique parent directories before pytest, retain independent command exits and seal logs. Reuse immutable historical board evidence with service absence recorded terminally.
    6. Authenticate original board transcripts from immutable content hashes or Git blobs. Never run prior hardware qualification mains. Preserve every historic verdict. Resolve KV260 fabric evidence only at k_max<=5 and PolarFire as Linux CPU dispatch unless an actual fabric transcript exists.
    7. Keep GateMate blocked on the unchanged 0xffffffff physical/JTAG observation. Record the next prerequisite as dated operator evidence of changed cable, port, power or wiring. Do not repeat detection, flash storage, install SDKs or buy hardware.
    8. If Exp7819 is valid, recompute its host-stage fraction and acceleration bound. Map CPU counters, Rust batching and FPGA predicate matching to measured stages. List expected preparation, transfer and readout costs as unknown unless measured. Vendor Z1T estimates cannot become local latency or power numbers.
    9. If current service evidence is missing or disqualified, finish once with complete_blocked_missing_service_evidence and exact gate_check_summary. Retain all three board rows and known next prerequisites. Keep NPU/TSU local access unqualified. Update the hardware wishlist only with evidence-backed status changes; no repeated status rewrite is needed.
    10. Cold-reduce transcript hashes and private wrong-venue/wrong-digest cases. The audit can preserve terminal board evidence without claiming terminal service acceleration. No fixture success or old SSH reachability may open a scientific benefit gate.
    11. Run the frozen affected unit suite and require 100% statement coverage of all new or changed modules and CLI paths. Use private coverage shards with identical branch settings and explicit include paths. Preserve all shard exits before combining. Use PYTHONPATH=python:. with pytest -n 0 -o addopts= --no-cov. Run scoped Ruff check/format, mypy, and scripts/check_spec_coverage.py on explicit test files. Fix owned failures before measurement.
    12. Run the task-specific real entrypoint E2E and applicable ops/e2e-test-plan.md checks. Reduce raw rows in a fresh process. Run scripts/adversarial_verify.py on the exact candidate and scripts/verdict_row_consistency_lint.py --strict. Save validation argv, exits and durable log hashes. Test fixtures and pytest basetemp stay outside results/. Copy completed validation logs to task-owned raw storage before hashing. Failed required validation sets every readiness field to 0 and verdict_class=disqualified.
