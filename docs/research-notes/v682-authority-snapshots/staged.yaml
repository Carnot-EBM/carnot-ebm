    Work in {project_root} on {date} for milestone 2026.09.682. Exp7846 was cascade-blocked before cost measurement. A qualified current fitted service now supplies real inputs; bank-service fixtures and optional learned commits have separate provenance, and accelerator headroom includes host orchestration.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/python/carnot/verify/source_projection.py
    - {project_root}/python/carnot/verify/training_runtime.py
    - {project_root}/python/carnot/reporting/constraint_bank_protocol.py
    - {project_root}/research-hardware-wishlist.md

    TASK:
    Measure complete CPU verification service and bounded hardware acceleration headroom.
    Deliverable: {project_root}/results/experiment_7861_v682_service_cost.json.

    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Check exact source paths, hashes, schema versions, resource ownership and gate operands before compute. Missing or disqualified external inputs produce verdict_class=blocked and gate_check_summary, never partial. A conductor skip receipt is not a science producer.
    2. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess. Include elapsed seconds and completed units. Emit inside long loops and supervise owned children with a heartbeat at least every 60 seconds; keep every silence gap below 600 seconds and every tool wait at most 60 seconds. Enforce owned-child deadlines; never pad runtime or stop unrelated processes.
    3. Write every file over about 200 lines in several tool calls of at most 150 lines, with a progress message between calls. Keep all tool calls bounded. Checkpoint completed units by input/configuration hash; resume without discarding unfavorable rows.
    4. Before implementation, add task-owned REQ-* and SCENARIO-* to the relevant existing capability spec and write meaningful failing tests. Freeze the affected source, tests, consumed-library closure and exact validation argv/deadlines/classifications before measurement. Retain every historical required failure. Do not change a required check into a diagnostic after seeing its outcome.
    5. Reuse small library functions and current_work_receipt. Keep fixture-only helpers out of natural-data paths. Do not call historical experiment main/run/validation dispatchers. If legacy orchestration is reused, its original required obligations still apply. Use private pytest basetemp, CLI candidates, coverage and child output roots under /tmp, outside results/. Keep atomic temporary and destination files in the same private directory. Do not disable the child-results guard. Emit nonempty JSON resolved_imports with actual worktree module __file__ paths.
    6. Consume qualified Exp7855 checkpoints and the public source manifest. Measure the complete CPU service: byte projection, both layouts, normalized energy, calibration, typed policy, serialization and durable audit write. Record CPU identity, thread count, clocks where observable, cache policy and actual filesystem. Do not infer production latency from an isolated matrix multiply.
    7. Use all 64 evaluation-role inputs without label access, paired cache-off and cache-on conditions and three repeat orders fixed by hash. Record cold startup/JIT separately from warm request p50/p95 and failures. Verify identical emitted probabilities and decisions across cache conditions; a changed decision disqualifies a speed claim.
    8. Measure a qualified bank commit and restart through the Exp7853 protocol as a clearly labeled service conformance input, including fsync, bytes written and load/replay cost. If Exp7858 provides eligible current natural commits, measure those separately; their absence must not block the base service benchmark or become a fake learning receipt.
    9. Report total and per-component service time, memory peak, cache hit rate and bytes. Compute an explicit Amdahl upper bound using the measured eligible component fraction for hypothetical 2x/10x/infinite accelerator speed and measured host overhead. Mark every bound as a projection. Compare observed tiers against the PRD microsecond/millisecond targets without claiming those targets were met.
    10. Complete one cold read-source-to-durable-decision CLI E2E and a restart replay. Cap the owned benchmark at 1800 seconds with per-repeat heartbeats. Recommend optimization only for the measured dominant cost; introduce no Rust, FPGA or model changes merely to make the target look closer.
    11. Run the frozen affected tests with PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov for ordinary runs. Require 100% changed-code statement coverage, including the real CLI and its error routes; combine explicitly named completed coverage files with identical settings. Use coverage report --fail-under=100 at the CLI, or explicitly compare the Python API percentage; Coverage.report(fail_under=...) is invalid. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py on the affected tests. Do not skip, xfail, weaken assertions or remove failures.
    12. Execute a private real CLI and cold replay, plus the task-specific E2E and applicable ops/e2e-test-plan.md checks; document inapplicable checks before execution. Seal child logs only after exit and closed handles at immutable content-addressed paths. Cold-reduce primitive rows independently. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the exact candidate. Preserve censored, excluded, failed and unstarted units.
    13. Run one separately named repository_health_180s diagnostic with a 180-second owned-process deadline and heartbeat. Report timeout/failure as failed health, never as a full-suite pass. Historical full-suite requirements remain failed until actually satisfied. No implicit bare all-tests command belongs in the new required list.
    14. Atomically publish the exact terminal deliverable after owned validation. Use complete_* for terminal honest_verdict and its correct verdict_class; if owned work is retryably unfinished use partial_* with class partial. External incompleteness is blocked; failed required checks are disqualified and zero readiness. Use a pending private candidate rather than a success-prefixed partial artifact. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Retire only the listed repeated scope on an identical verdict. Preserve old artifacts and production defaults; no activation or publication.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date: Numeric experiment_id, exact task_id, 2026.09.682, and {date}. principle: Identity must distinguish current producers from legacy aliases.
    - honest_verdict, verdict_class: Terminal complete_* plus positive | circular_positive | null | blocked | disqualified | partial. Partial is only unfinished owned work and uses partial_*. principle: External blocks terminate once; qualification is not scientific benefit.
    - flagged_adversarial: Actual boolean derived from terminal verification, never hardcoded. principle: Flagged evidence cannot open a gate.
    - gate_check_summary: List failed checks with upstream id, path/hash, artifact_field, op, expected and observed; required for every blocked verdict. principle: Missing fields and failed values are different causes.
    - rows, sample_size_budget: Per-unit primitive metrics, arm, source family, seed, status and intended/eligible/started/completed/censored/excluded/independent counts. principle: Pooled numbers must be reproducible; seeds and source views are not independent samples.
    - acceptance_gate_results: Separate validity, readiness, probability_quality, decision_benefit, retention and efficiency, with null for unmeasured values. principle: Fixture success cannot become a benefit claim.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Measured monotonic spans and hashes of code, inputs, configuration and seeds. principle: Runtime and reproducibility must be observed.
    - source_artifact_hashes, preconditions_checked: Exact paths, hashes, dates, observed values, source roles and exposure status. Never hash this output as its own input. principle: Historical and current evidence have different authority.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, repository_health: Frozen argv, classes, exits, durable logs, coverage and cold checks; include historical obligations separately. principle: A new wrapper cannot erase an old failed check.
    - verifier_is_oracle, claim_scope: True for deterministic fixture/oracle agreement with class circular_positive; human-labeled natural evidence remains exposed-development only. principle: Learned risk is not a truth certificate or fresh generalization.
    - field_principles: Persist a reason for every artifact field and acceptance gate. principle: A future reader must know why a check exists.
    - inference_substrate, inference_substrate_class: Use cpu_no_pretrained_model, no_model_load; record planned and actual classes on a pre-compute block. principle: The duration floor must match actual work.
    - MODEL_SPECS, model_specs, model_invocation_counts: []; record actual loads, calls, tokens and model-file hashes. Zero model calls for no-LLM tasks. principle: Fixture and historical calls cannot become current inference.
    - service_evidence_ready_score: 1 for complete timed work, correctness parity and durable logs. principle: A fast incomplete path is not a service benchmark.
    - service_rows, component_rows, memory_rows, durable_write_rows: Per-family and per-repeat measured times and bytes. principle: Include orchestration and persistence in cost.
    - acceleration_bounds, target_tier_results: Explicit measured fractions, assumptions and unmet targets. principle: A host-side projection is not a hardware result.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7861_v682_service_cost.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
