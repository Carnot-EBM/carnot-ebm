    - {project_root}/scripts/harness_fit_lint.py
    - {project_root}/python/carnot/experiment_7739_v674_contract_methods.py
    - {project_root}/results/experiment_7752_v674_capstone.json
    - {project_root}/python/carnot/experiment_7753_v675_contract_methods.py
    - {project_root}/results/experiment_7766_v675_capstone.json
    - {project_root}/openspec/change-proposals/research-roadmap-v675-preserved-20260927.md

    TASK:
    Bind fourteen tasks and register scoped current-work validation without changing any old determination. Ingest the adopted methods and freeze their claim limits.
    Deliverable: {project_root}/results/experiment_7767_v676_contract_methods.json.

    CONCRETE STEPS:
    1. Print a flushed progress line at every phase boundary. Print before and after every model load, generation call, benchmark and subprocess. Include phase, elapsed seconds and completed units. Emit a real progress or supervised-child status line at least every 60 seconds inside long loops. Keep every silence gap below 600 seconds. Poll long children and terminate only owned processes at their declared timeout; never sleep-pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Keep each tool invocation bounded; poll running commands at intervals of at most 60 seconds. A long file-generation call can stall even with no shell command running.
    3. Check declared paths, schemas, hashes, resources and exact upstream fields first. Record each failed check and observed value. Distinguish a missing declared producer from its separate conductor pre-gate receipt. External missing or disqualified prerequisites are terminal blocked, not partial. Freeze the affected-file validation manifest before implementation.
    4. Add the task REQ-* and SCENARIO-* specification before implementation. Write meaningful failing tests first. Reuse qualified modules. Keep numerical logic, orchestration and thin CLI code separately testable. Fixtures write only to private temporary directories. Create every nested pytest basetemp parent before launching pytest; test that setup with a real child process.
    5. Freeze every changed module, direct test and transitive consumer before editing. For this new experiment, affected tests, complete changed-module coverage, scoped static checks, real entrypoint E2E and terminal readers are required. Broad repository collection is a separate diagnostic; preserve its failures. Do not reclassify historical artifacts or remove a failing affected test. Keep temporary pytest and coverage paths outside results/. Snapshot mutable documents or resolve historical Git blobs before hashing them.
    6. Reuse Exp7753 contract code. Resolve matching staged .676 or matching active .676 only. Compare the design table, JSON contract and YAML for exactly fourteen tasks Exp7767 through Exp7780. Preserve the V675 design at openspec/change-proposals/research-roadmap-v675-preserved-20260927.md.
    7. Register new V676 validation specifications. The old V675 full-suite contracts remain unmet. Check the import and consumer closure for each proposed scope before classifying collection errors as unrelated. Keep repository_collection_healthy=false until an actual clean collection proves otherwise. No guard change, test suppression or historical verdict rewrite is allowed.
    8. Write docs/research-notes/v676-method-map.md from the V676 reference review. Read method sections for CCHD, corrected confidence elicitation arXiv:2608.10008v3, evidence sufficiency 2608.00585, and delayed feedback 2606.11711. Record exact versions and access limits. Use sequential bounded requests, not a research-agent fan-out.
    9. Run unchanged schema, prior-failure, exclusion, gate, harness-fit, ARC-floor and overdue-priority readers. In private copies reject dropped/reordered tasks, title drift, unknown producers, gate-field typos, a wrong substrate and each missing prior subfield. The contract task does not gate science.
    10. Inventory prior scientific producers separately from conductor pre-gate receipts. Missing evidence cannot be repaired with a guessed filename. Resolve all EXISTING CODE paths. Prove gate fields occur in their producer REQUIRED ARTIFACT FIELDS.
    11. Run focused unit tests, 100% statement coverage over every new or changed implementation module, scoped Ruff check and format, scoped mypy, and scripts/check_spec_coverage.py with explicit affected test file paths. Use PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov with private basetemp. Resolve worktree imports. Fix owned defects, including formatting, before capture. Record unrelated repository debt separately; never lower gates or omit affected files.
    12. Run the applicable ops/e2e-test-plan.md checks and the task-specific real entrypoint check below. Independently reduce raw rows in a fresh process. Run scripts/adversarial_verify.py on the exact candidate and scripts/verdict_row_consistency_lint.py with its supported strict mode. Keep commands, exits and log hashes. Failed required validation disqualifies the result and sets readiness to 0; do not publish a positive claim.
    13. Write the exact deliverable atomically after validation. Record per-unit rows even for null, rejected, censored or unstarted units. Reconcile the affected OpenSpec capability, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve old artifacts and verdicts. Retire matching failed scope if the same prior verdict recurs; do not edit conductor or guards.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, milestone, run_date: Bind this task and {date} to 2026.09.676. principle: An artifact must have a unique current owner.
    - honest_verdict: Use a terminal complete_* string. External blocks use complete_blocked_*. principle: A terminal record must not waste attempts on unchanged inputs.
    - verdict_class: One of positive | circular_positive | null | blocked | disqualified | partial. Partial means only unfinished owned work that a retry can finish. principle: The claim class travels with the evidence.
    - flagged_adversarial: Actual boolean from the terminal reader. principle: Invalid evidence must not open downstream gates.
    - gate_check_summary: List every failed check with upstream id, artifact path/hash, field, expected, observed and operator; use [] when none fail. Required for every blocked verdict. principle: Missing producers and failed scientific thresholds are different causes.
    - rows: Per-family/game/seed/arm or per-check rows with raw paths, metrics, labels where evaluator-authorized, exclusions and censoring. principle: Aggregates must be recomputable without rerunning science.
    - acceptance_gate_results: Separate validity, readiness, probability_quality, decision_benefit, retention and efficiency; unmeasured values are null. principle: A working protocol is not evidence of benefit.
    - duration_s, phase_spans: Measured monotonic total and phase times, including validation and cold replay. principle: Duration must describe actual work without padding.
    - random_seed, reproducibility_checksum: Record seeds and hash exact inputs, code, roles and parameters. principle: A third party needs the same experiment inputs.
    - sample_size_budget: Intended, eligible, started, completed, excluded, censored and effective independent N. principle: Repeated views and seeds do not increase independent family count.
    - source_artifact_hashes: List exact source paths, hashes, dates, imported fields and eligibility. principle: A missing producer cannot be replaced with a convenient old result.
    - preconditions_checked: Actual path, custody, backend and resource observations. principle: Access and validity must be established before expensive work.
    - validation_receipts: Frozen affected scope, command argv, exit, log hash, coverage, real E2E, cold replay and terminal-reader results. principle: All registered checks must pass before readiness opens.
    - verifier_is_oracle, claim_scope: Mark fixture or exact-authority success circular_positive. Natural annotation comparisons remain exposed-development evidence. principle: Execution truth and independent semantic verification are distinct claims.
    - field_principles: Echo these principles and the rationale for each gate. principle: Downstream readers need the purpose of each check.
    - inference_substrate, inference_substrate_class: Declare aggregation_from_upstream_artifacts and aggregation for actual work. Record planned and actual classes separately if blocked before compute. principle: Duration floors must match the invoked substrate.
    - MODEL_SPECS, model_specs, model_invocation_counts: []; record actual calls, tokens and loaded files. Empty means no LLM load. principle: A cited upstream model is not a current model invocation.
    - contract_ready_score: 1 only after independent agreement and registered reader success. principle: Readiness certifies executable instructions, not science.
    - method_map_path: docs/research-notes/v676-method-map.md with URLs, review depth, transfer and deferrals. principle: External work must inform a falsifiable local question.
    - repository_collection_healthy, scope_closure_rows: Explicit dependency evidence and unresolved broad collection status. principle: A narrower current contract cannot imply repository-wide health.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7767_v676_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
