  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.676. V675 completed ten producers and four pre-gate skips. Seven producers were disqualified; one service artifact was blocked. The contract reader qualified. The online fixture reported readiness despite its failed original full-suite requirement; current requalification is mandatory. Queue completion established no new scientific benefit.

