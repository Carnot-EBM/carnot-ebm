# Verifier Registry — the single, diffable source of truth for Carnot's verifiers.
#
# WHY: a verifier's value is that it improves over time and expands to new domains
# (the Phase-3 self-improving-verifier program). Persisting that lineage needs three
# layers (see ops/known-issues.md + decentralization rule 3):
#   code + schemas        -> git (python/carnot/verify/, scripts/)
#   provenance/registry   -> git (THIS file — small, diffable, never-pruned)
#   weights + big data    -> HuggingFace (Carnot-EBM/*) + IPFS (content-addressed by CID),
#                            NEVER git. (The conductor once committed 17GB of weights and a
#                            765MB .pt that had to be purged with git-filter-repo 2026-06-03;
#                            results/*.{pt,safetensors,bin,gguf} are now gitignored.)
#
# THIS FILE binds the three: each entry maps a verifier version to its code commit, its
# weights' HF id + IPFS CID + sha256, the data it learned from, and its eval score — so a
# third party can reproduce and verify integrity by hash (the FoVer reproduction-runbook
# discipline). Versions ACCUMULATE (never-prune); the git history of this file IS the
# verifier's evolution over time. Retired entries stay with status: retired.
#
# PERSISTENCE LOOP (the conductor pattern, extended to the verifier lifecycle):
#   train -> eval -> push weights to HF + IPFS -> add/update entry here -> commit -> tag.
#
# SCHEMA (one entry per verifier/domain version):
#   - verifier_id:        stable slug
#     domain:             math_reasoning | code | facts | arc_agi3_<...> | constraint | ...
#     version:            int (increments; lineage below)
#     kind:               ensemble | outcome_head | process_verifier | abstraction_library
#     code_commit:        git sha defining/loading it (python/carnot/verify/...)
#     code_path:          the module
#     weights_hf:         HuggingFace repo id (null if pure-code/symbolic, no weights)
#     weights_cid:        IPFS CID (content-address; integrity + mirror)
#     weights_sha256:     hash of the artifact
#     training_data_ref:  ipfs://... or a results/ corpus path (what it learned from)
#     label_source:       self_consistency | formal_oracle | teacher_llm | human | gold
#     eval:               {metric: value, n: int, eval_artifact: results/...json}
#     lineage:            {from: <version|seed>, change: "<one line>"}
#     status:             active | candidate | retired
#     notes:              free text

verifiers:
  # ---- Production deployed verifier (the headline, G2-reproduced) ----
  - verifier_id: fover_production_ensemble
    domain: math_reasoning
    version: 4
    kind: ensemble                 # the k=15 Tier0r/Tier0u/FR-11 production aggregation
    code_commit: HEAD              # TODO: pin to the exact commit on next reconcile
    code_path: python/carnot/eval/verifier_error_independence_scissor_at_scale.py
    weights_hf: null               # text/structural verifiers + FR-11 memory (mostly code+data)
    weights_cid: null              # TODO: pin FR-11 memory index CID once externalized
    weights_sha256: null
    training_data_ref: data/fover_corpus_v4.json
    label_source: gold
    eval: {metric: "fover_dual_condition_auroc", value: 0.9131, n: 6548,
           eval_artifact: results/experiment_2850_fover_dual_condition_integrity_v4.json}
    lineage: {from: v3, change: "5-seed dual-condition rescue; CI-reproduced (G2, run 26725185125)"}
    status: active
    notes: "The deployed cross-domain verifier; headline. G1-G4 met; frozen 0.9131."

  # ---- Candidate: learned outcome-verifier (the self-improvement-reward path) ----
  - verifier_id: outcome_verifier_math_proc_plus_sc
    domain: math_reasoning
    version: 1
    kind: outcome_head             # learned: process features + self-consistency -> outcome
    code_commit: HEAD
    code_path: scripts/experiments/outcome_verifier_learn_derisk_draft.py
    weights_hf: null               # de-risk only; logistic head, not yet a published artifact
    weights_cid: null
    weights_sha256: null
    training_data_ref: data/p01_gsm8k_generations.jsonl
    label_source: gold             # trained on gold-outcomes; self-consistency as a feature
    eval: {metric: "heldout_outcome_auroc", value: 0.949, n: 720,
           eval_artifact: results/outcome_verifier_learn_derisk.json}
    lineage: {from: seed, change: "de-risk: process-only 0.739 + self-consistency -> 0.949"}
    status: candidate
    notes: "DO NOT PROMOTE — causal RFT test came back NEGATIVE (clean, 2026-06-08). The powered
            3-seed 4096-eval on-policy RFT (truncation-valid, gold-control passing) returned
            no_clear_lift: gold +0.271 (robust, teaches) but process_weighted +0.033+/-0.081
            (seed2 went -0.06, lower-1sigma below zero) and it does NOT beat self-consistency
            (sc_weighted +0.042, lower variance). The seed-0 '+0.08 beats SC' signal did NOT
            survive 3 clean seeds -> the MOAT claim is refuted FOR THE RFT-REWARD use in MATH.
            Consistent with the inference-selector framing (de-risk 0.949 vs SC-alone 0.927 =
            verifier +0.02 only). ROOT CAUSE: math is self-consistency-NEAR-CEILING (no headroom
            for the verifier to add value) — see [[verifier-domain-bound-math-only]]. The
            verifier's real, large value is on ARC (arc_grid_combined_verifier v2 prunes content
            errors) where SC is NOT near-ceiling. Preserved per never-prune; flagged 1024 run at
            results/process_reward_weighted_sft_onpolicy_*_maxnew1024.json, clean run at
            results/process_reward_weighted_sft_onpolicy_powered.json."

  # ---- Code domain (stage-2 expansion via formal oracle) — DOMAIN-COVERAGE FINDING ----
  - verifier_id: code_outcome_verifier_formal_oracle
    domain: code
    version: 1
    kind: outcome_head             # cheap static/text features + math-ensemble transfer
    code_commit: HEAD
    code_path: scripts/experiments/code_verifier_formal_oracle_derisk_draft.py
    weights_hf: null
    weights_cid: null
    weights_sha256: null
    training_data_ref: data/code_verification_corpus_v2.jsonl  # + v1; labels = test execution
    label_source: formal_oracle    # test-suite execution (HumanEval/MBPP), precomputed
    eval: {metric: "heldout_outcome_auroc_balanced_semantic_v2", value: 0.4462, n: 60,
           syntactic_baseline_v1_auroc: 0.9451, syntactic_baseline_n: 320,
           eval_artifact: results/code_verifier_formal_oracle_derisk.json}
    lineage: {from: seed, change: "stage-2: formal-oracle gold -> cheap-verifier transfer test"}
    status: candidate
    notes: "DOMAIN-COVERAGE FINDING (not a deployable verifier yet). Cheap static/text
            features are EXECUTION-BOUND on SEMANTIC code: balanced HumanEval (failures all
            parse) -> learned held-out AUROC 0.446 ~= chance, every single feature ~0.5.
            SYNTACTIC failures ARE cheaply caught (v1 ast_parse_ok 0.80, learned 0.945 =
            working positive control). So the harness router should escalate semantic-code
            verification to the EXECUTION oracle, use the cheap verifier only for syntax.
            UNTESTED next step: Carnot's DEDICATED code verifiers (ast_structure_verifier,
            nsvif_z3_extractor, code curry_howard/sat) — may or may not move the semantic
            AUROC. Mirrors math being self-consistency-bound (the honest domain map).
            2026-06-08 UPDATE: dedicated SHIPPED ASTStructureVerifier ALSO ~chance on v2
            semantic (single-feature AUROC ~0.5) -> static code verification is
            execution-bound on semantics BY DESIGN (targets structure/signature, which
            semantic failures preserve). Caveat closed for static verifiers."

  # ---- ARC domain (the north-star domain) — first cheap grid verifier, stage-2/3 prep ----
  - verifier_id: arc_grid_structural_pruner
    domain: arc_agi1_grid
    version: 1
    kind: process_verifier         # rule-based structural-consistency PRUNER (no induction)
    code_commit: HEAD
    code_path: scripts/experiments/arc_grid_verifier_discriminator_draft.py
    weights_hf: null
    weights_cid: null
    weights_sha256: null
    training_data_ref: /home/ianblenke/trm_src/kaggle/combined (ARC-AGI-1 public, gold solutions)
    label_source: gold             # gold ARC solutions + cheap deterministic distractors
    eval: {metric: "easy_discrimination_auroc", value: 0.743, n: 416,
           structurally_malformed_separation: {wrong_task_gold: 0.947, random: 0.889, wrong_dim: 0.863},
           content_error_separation: {perturbed_gold: 0.006, transposed: 0.293, blank: 0.135, color_swap: 0.384},
           combined_top1: 0.0072,
           eval_artifact: results/arc_grid_verifier_discriminator.json}
    lineage: {from: seed, change: "first ARC-domain verifier: structural-consistency discriminator"}
    status: candidate
    notes: "PRUNER, NOT SELECTOR (combined_top1 ~0.7% — cannot pick gold uniquely because
            near-miss distractors preserve all coarse invariants). Cheap dims/palette/bg
            checks cleanly reject STRUCTURALLY-malformed candidates (wrong-task 0.95,
            random 0.89, wrong-dim 0.86) but are BLIND to CONTENT errors that preserve
            structure (perturbed-gold 0.006, transpose 0.29, blank 0.14). This is the
            north-star division of labor on the actual ARC domain: verifier PRUNES
            structural errors (the efficiency axis — fewer generator actions), generator
            INDUCES content (the accuracy axis). SUPERSEDED by v2 below, which lifts the
            content ceiling. Dimension is the only v1 feature with real signal (AUROC 0.64)."

  # ---- ARC domain v2: content ceiling LIFTED (7 invariant families combined) ----
  - verifier_id: arc_grid_combined_verifier
    domain: arc_agi1_grid
    version: 2
    kind: process_verifier         # v1 dims/palette/bg + 7 relational invariant families
    code_commit: HEAD
    code_path: scripts/experiments/arc_grid_verifier_invariants_v2_combined.py
    weights_hf: null
    weights_cid: null
    weights_sha256: null
    training_data_ref: /home/ianblenke/trm_src/kaggle/combined (ARC-AGI-1 public, gold solutions)
    label_source: gold             # gold ARC solutions + cheap deterministic distractors
    eval: {metric: "combined_gold_strictly_better_rate_hard_distractors", n: 416,
           perturbed_gold: 0.922, color_swap_gold: 0.845, transposed_gold: 0.729, wrong_dim_gold: 0.954,
           v1_baseline: {perturbed_gold: 0.006, color_swap_gold: 0.384, transposed_gold: 0.293, wrong_dim_gold: 0.863},
           combiner: "applicability-flagged mean (and CV out-of-fold logistic, agrees)",
           eval_artifact: results/arc_grid_verifier_invariants_v2.json}
    lineage: {from: arc_grid_structural_pruner (v1),
              change: "added 7 relational invariant families (object_count, palette_histogram,
                       delta_pattern, content_overlap, color_mapping, symmetry, tiling_scaling);
                       gold-blind family_score (no leak, verified by re-run); CV out-of-fold"}
    status: candidate
    notes: "CONTENT CEILING LIFTED. A cheap, NON-INDUCING, gold-blind, cross-validated combined
            verifier rejects ALL FOUR hard content distractors >=0.73 (v1 was near-chance on 3
            of them): perturbed 0.006->0.92, color_swap 0.38->0.85, transpose 0.29->0.73,
            wrong_dim 0.86->0.95. Strongest single families: object_count (perturbation),
            palette_histogram (color-swap). IRREDUCIBLE RESIDUAL = SQUARE-grid transpose
            (ambiguous without the rule) + variable-dim non-positional tasks -> these need
            genuine rule-INDUCTION (the generator's job), so the verifier-prunes/generator-
            induces boundary holds but the verifier's prune-able share is now MUCH larger
            (efficiency-axis win for the ARC harness: cheaply reject most wrong candidate
            outputs, not just malformed ones). Adversarially verified: family_score gold-blind
            (execution-checked), combined numbers reproduce independently, abstain-convention
            confound handled via per-task applicability flags. docs/research-notes/
            arc-grid-verifier-content-ceiling.md. NEXT: wire into the interactive harness as
            the candidate-output pruner; test on ARC-2 (harder) to check the ceiling holds."

  # ---- ARC-AGI-2 domain: program-induction stack (DEPLOY step, exp4001, 2026-06-10) ----
  - verifier_id: gap4_program_induction_stack
    domain: arc_agi2_grid
    version: 1
    kind: process_verifier         # tiered program-induction selector: snap > fresh-chain > vote
    code_commit: HEAD
    code_path: python/carnot/agentic/gap4_program_induction_stack.py
    weights_hf: null               # pure-code verifier; programs are the "weights"
    weights_cid: null
    weights_sha256: null
    training_data_ref: results/arc3_gap4_arc2_chain_ensemble.json
    label_source: gold-posthoc     # gold used post-hoc for scoring only; not leaked to inducer
    eval: {metric: "pass_at_1",
           arc2_pass_at_1: 0.6129, arc2_n: 31, arc2_gold: 19, arc2_eval_artifact: "results/arc3_gap4_arc2_chain_ensemble.json",
           arc1_demo_perfect_coverage: 0.9032, arc1_n: 31, arc1_gold: 28, arc1_eval_artifact: "results/arc3_gap4_induced_programs.json",
           arc2_offline_reproduced: true, arc1_offline_reproduced: true,
           eval_exp: "results/experiment_4001_gap4_registration_offline_eval.json"}
    lineage: {from: arc_grid_combined_verifier (v2),
              change: "ARC-2 domain; program-induction stack replaces invariant-family pruner;
                       tiered policy: T1 snap tau<=0.005 > T2 promote-first-FRESH-demo-perfect >
                       T3 vote; agreement = confidence label only (fresh arms only, never a gate)"}
    status: candidate
    notes: "GAP-4 DEPLOY step (exp4001, 2026-06-10). Tiered policy from the chain-arms adversarial
            review synthesis (results/arc3_gap4_chain_arms_adversarial_verify.json, 5/5 CONFIRMS).
            ARC-2 pass@1 19/31=0.6129 vs banked vote 1/31=0.0323 (16 wins/0 losses, sign p=2e-5);
            ARC-1 sanity 28/31=0.9032. Numbers reproduced bit-exact offline from saved artifacts
            (zero new generator calls). CAVEATS (MANDATORY — per harness_recommendation):
            (1) rerank numbers ride on an oracle-degenerate 4/31 pool for ARC-2;
            (2) agreement precision n<=10, not significant vs 0.52 or vs fresh-arm base 0.73;
            (3) chain coverage measured only on 12 probe-chain-feasible tasks;
            (4) ARC-1 numbers carry a probable-pretraining-contamination caveat;
            (5) CLOSED-WEIGHT gpt-5.5 inducer at this tier; the local-GGUF arm is exp4002;
            (6) task-level unanimity-with-abstention (post-hoc 5/5 gold) stays OUT of the
                harness until its pre-registered fresh confirmation lands (conductor follow-up #2).
            Cost line (corrected per all-5-reviewer audit): 45 calls / 3780.0 codex-s / 1156.5s wall
            (the earlier summary '40 calls/4747.6s' was wrong; the artifact and all reviewers
            independently re-derived 45/3780.0 — see ops/changelog.md 2026-06-10 entry)."
