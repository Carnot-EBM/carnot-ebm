- verifier_id: outcome_verifier_math_proc_plus_sc
  domain: math_reasoning
  version: 1
  kind: outcome_head
  code_commit: HEAD
  code_path: scripts/experiments/outcome_verifier_learn_derisk_draft.py
  weights_hf: null
  weights_cid: null
  weights_sha256: null
  training_data_ref: data/p01_gsm8k_generations.jsonl
  label_source: gold
  eval:
    metric: heldout_outcome_auroc
    value: 0.949
    n: 720
    eval_artifact: results/outcome_verifier_learn_derisk.json
  lineage:
    from: seed
    change: 'de-risk: process-only 0.739 + self-consistency -> 0.949'
  status: candidate
  notes: "DO NOT PROMOTE \u2014 causal RFT test came back NEGATIVE (clean, 2026-06-08).\
    \ The powered 3-seed 4096-eval on-policy RFT (truncation-valid, gold-control passing)\
    \ returned no_clear_lift: gold +0.271 (robust, teaches) but process_weighted +0.033+/-0.081\
    \ (seed2 went -0.06, lower-1sigma below zero) and it does NOT beat self-consistency\
    \ (sc_weighted +0.042, lower variance). The seed-0 '+0.08 beats SC' signal did\
    \ NOT survive 3 clean seeds -> the MOAT claim is refuted FOR THE RFT-REWARD use\
    \ in MATH. Consistent with the inference-selector framing (de-risk 0.949 vs SC-alone\
    \ 0.927 = verifier +0.02 only). ROOT CAUSE: math is self-consistency-NEAR-CEILING\
    \ (no headroom for the verifier to add value) \u2014 see [[verifier-domain-bound-math-only]].\
    \ The verifier's real, large value is on ARC (arc_grid_combined_verifier v2 prunes\
    \ content errors) where SC is NOT near-ceiling. Preserved per never-prune; flagged\
    \ 1024 run at results/process_reward_weighted_sft_onpolicy_*_maxnew1024.json,\
    \ clean run at results/process_reward_weighted_sft_onpolicy_powered.json."
- verifier_id: code_outcome_verifier_formal_oracle
  domain: code
