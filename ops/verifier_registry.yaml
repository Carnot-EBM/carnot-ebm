  lineage:
    from: seed
    change: 'stage-2: formal-oracle gold -> cheap-verifier transfer test'
  status: candidate
  notes: "DOMAIN-COVERAGE FINDING (not a deployable verifier yet). Cheap static/text\
    \ features are EXECUTION-BOUND on SEMANTIC code: balanced HumanEval (failures\
    \ all parse) -> learned held-out AUROC 0.446 ~= chance, every single feature ~0.5.\
    \ SYNTACTIC failures ARE cheaply caught (v1 ast_parse_ok 0.80, learned 0.945 =\
    \ working positive control). So the harness router should escalate semantic-code\
    \ verification to the EXECUTION oracle, use the cheap verifier only for syntax.\
    \ UNTESTED next step: Carnot's DEDICATED code verifiers (ast_structure_verifier,\
    \ nsvif_z3_extractor, code curry_howard/sat) \u2014 may or may not move the semantic\
    \ AUROC. Mirrors math being self-consistency-bound (the honest domain map). 2026-06-08\
    \ UPDATE: dedicated SHIPPED ASTStructureVerifier ALSO ~chance on v2 semantic (single-feature\
    \ AUROC ~0.5) -> static code verification is execution-bound on semantics BY DESIGN\
    \ (targets structure/signature, which semantic failures preserve). Caveat closed\
    \ for static verifiers."
- verifier_id: arc_grid_structural_pruner
  domain: arc_agi1_grid
