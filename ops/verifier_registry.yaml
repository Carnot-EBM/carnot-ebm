    change: 'de-risk: process-only 0.739 + self-consistency -> 0.949'
  status: candidate
  notes: "DO NOT PROMOTE \u2014 causal RFT test came back NEGATIVE (clean, 2026-06-08).\
    \ The powered 3-seed 4096-eval on-policy RFT (truncation-valid, gold-control passing)\
    \ returned no_clear_lift: gold +0.271 (robust, teaches) but process_weighted +0.033+/-0.081\
