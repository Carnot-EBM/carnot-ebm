    than a consumed color (an L4 surprise). Pre-placed solid items already
    sitting inside subframes DO count in the DFS sequence at their position;
    pre-placed hollow items are branch connectives only. THE PUZZLE KEY: a
    mismatch between slot count and legend length means some subframe is
    visited more than once (multiple branch items pointing at the same
    subframe, or -- at the finale -- mutual recursion with the root itself).
    Escalations: L5 has two branch items to the SAME subframe (consumed
    twice); L6 has three parallel subframes each with a pre-placed in-sequence
    item; L7 chains root->subframe->subframe to depth 3; L8 (the finale) adds
    a branch of the ROOT ITSELF inside a child frame, creating an
    infinite-periodic mutually-recursive traversal stream, satisfied by a
    two-row 12-entry legend matching its first 12 elements. Click coordinates
    must always come from the CURRENT frame render -- tray item positions
    shift between levels, and stale coordinates silently miss (clicks on
    empty tray gaps are harmless no-ops, which can mask the miss).'
