    and report live first-win or efficiency lift before any solve claim. Exp
    4617's graduated SpatialValueNet live path was a characterized null, so this
    persists the compute-cost fix that made the offline value-head win reusable
    without repeating the heavy value_weight=5 regression. This is ranking/routing
    scaffolding, not a win oracle; new levels still count only through
    arc_solver_kit.reproduce().
  transfer_dead_ends:
  - If the generated candidate set lacks a level-up/win candidate, the bridge fix
      can only reorder non-winning candidates; candidate generation remains the
      residual bottleneck.
  - If the target candidate is already first in baseline order, decision-point
      value ranking is an honest efficiency null for that game.
