- id: primitive_approach_dispatcher_operator
  operator: approach_dispatcher_operator
  derived_from_games:
  - exp4592_generation_completeness_wiring
  note: >-
    Exp 4596 persists the A1 approach-dispatcher as reusable live-solver
    scaffolding: take the mechanic-class route from early-play routing, select
    and execute the generated candidate for the routed toolkit approach, keep
    the no-wiring default_graph_explore candidate as the fallback/control, and
    report winner-generated or win-reached value only after verifier/reproduce
    evidence. This is candidate-generation/selection wiring, not a win oracle;
    new levels still count only through arc_solver_kit.reproduce().
  transfer_dead_ends:
  - A routed approach with no generated candidate remains a candidate-generation
      null; the dispatcher cannot promote a winner that was never proposed.
  - Existing reproduced candidates can demonstrate cross-game selection value,
      but they do not increment reproducible_total_levels unless this run banks
      a strictly new offline-reproduced level.
