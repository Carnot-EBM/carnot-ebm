- id: primitive_persistent_action_effect_memory_operator
  operator: persistent_action_effect_memory_operator
  derived_from_games:
  - exp4568_clickability_action_effect_predictor
  - exp4629_graduate_action_effect_predictor_live
  note: >-
    Exp 4573 persists A1's action-effect predictor as a reusable PersistentAEM
    operator: build a leave-one-game cross-game memory from cached frame/action
    effects, rank compatible action candidates by predicted effect with stable
    original-order tie-breaking, and report actions-to-first-levelup deltas
    before any solve claim. Exp 4632 extends the same primitive with the 4629
    live action-effect ranker signal (`persistent_aem_plus_optional_cnn`) so the
    scored E3 action-pruner reuses the target-excluded memory/scorer path rather
    than re-deriving action effects. A CNN predictor forward pass is not live
    LLM inference; the persisted operator can also run from cached action-effect
    rows without invoking the CNN. New levels still count only through
    arc_solver_kit.reproduce().
  transfer_dead_ends:
  - If the winning action is absent from the candidate group, PersistentAEM can
    only reorder generated candidates; candidate generation remains the residual
    bottleneck.
  - Leave-one-game transfer can be value-null when the held-out game's effective
    action family is not represented in the cached memory features.
  - The 4629/4632 live ranker adds action-efficiency value only when the winning
    target action is already in the generated candidate group; richer candidate
    generation remains the residual bottleneck when all target candidates are
    absent or equivalent under cached frame-change features.
