  - The target blocks movement until shape/color/rotation all match.
  - 'L3-L4 mechanic set (2026-07-11, claude-fable-5, independently re-verified
    by the outer loop): LAUNCHER STRIPS (1px color-1 bars embedded in wall
    edges) auto-slide the player to the corridor end the instant the
    adjacent floor cell is ENTERED (arrival, not a press) -- free, no extra
    counter cost, and slides do not chain through other pad cells; L4 is
    built from eight of these forming a one-way expressway maze. PINWHEEL
    tiles cycle player COLOR one step per entry in a fixed order
    (C->9->E->8->C), entry direction irrelevant. DOTTED PADS morph the
    SHAPE/rotation state each entry -- a pure 90-degree-CW rotator on L3, a
    shape-cycler on L4 (plan exactly one entry from the fresh state to hit
    the target shape). The bottom-HUD step counter drains per action
    (level-specific rate: 2/move on L3, 1/move on L4; blocked moves drain
    too); at 0 the NEXT action restarts the level (fresh counter/rings/
    color/shape/position) and consumes one of three life tokens (tokens
    restore on level-up). Genuine B-ring pickups reset the counter to 42 --
    but a visually similar ring at the bottom of L4 did NOT reset it when
    stepped on (unknown function; do not assume every ring-shaped object is
    a real counter reset). L4''s winning line has near-zero counter slack --
    the final ring must be collected on the LAST approach, not early.'
  - 'L5 progress round 2 (2026-07-11, gpt-5.6-sol via codex, post-wa30 breadth
    campaign): L5 splits shape/rotation control across two distinct tiles --
    the upper black-dot tile cycles shape while a small blue/black tile in
