schema_version: 1
updated: '2026-06-19'
general_gotchas:
- id: offline_is_a_simulator
  note: Arcade(OFFLINE, environment_files) = deterministic sim, all 25 games, zero
    quota.
- id: level_on_frame_not_game
  note: level = frame.levels_completed; env._game has no levels_completed.
- id: deepcopy_injection_unreliable
  note: env._game=deepcopy(state) works for lp85, BROKEN for sc25; use replay-from-reset.
- id: first_step_after_reset_consumed
  note: first env.step after reset is a no-op (sc25); warm up after reset.
- id: discover_coords_never_hardcode
  note: live-coupled hardcoded coords miss the offline layout; discover from env.
- id: state_dependent_controls_and_animations
  note: tank-controls facing + multi-frame animations; include facing/phase in the
    dedup key and resolve animations before win-check.
- id: non_idempotent_reset
  note: 'gotcha #7 (tu93): env.reset() is NOT idempotent -- it leaves a parity-toggling
    hidden state (same path, 6 reset+replays -> levels [1,2,1,2,1,2]). A reuse-one-env
    replay/deepcopy search detects parity-CONTINGENT wins that fail the fresh-env
    reproduction gate (gate correctly rejects -- no false claim). Fix: OfflineSolver
    branch_mode=''fresh_env'' (a brand-new env per candidate eval) so each evaluation
    sees the same pristine parity-0 the gate uses. Detect by replaying ONE path on
    N fresh envs vs 1 env reset N times: if levels differ, reset is non-idempotent.'
- id: same_action_next_level
  note: Some config/toggle games call next_level() in the same action that creates
    the winning arrangement, so the returned frame is already the next level and the
    pre-win grid is not externally observable. Ground the win predicate on execution
    state immediately before next_level, then count only the reproduce() level advance.
