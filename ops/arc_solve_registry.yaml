    MOVE-PROGRAM (vkuvtkaerv); each slot holds a command code (tn36.py:2171 okllwtboml:
    0=settle,1=left,2=right,3=down,33=up,5/6/7/16=rotate,8/9=scale+/-,14/15/63=property).
    Step CSPOIQWER=4. TOOL PALETTE = a 6-BIT code editor per slot: bit b''s toggle-button
    is at (slot_x, slot_y_top + 3*b) for b=0..5 (values 1,2,4,8,16,32), so ANY code
    = sum of its set bits (down 3=bit0+bit1; up 33=bit0+bit5; scale+ 8=bit3; rotate+90
    5=bit0+bit2). Slot positions ARE READABLE (controller.pfyayhyovw[i].{x,y}) and
    RE-LAY-OUT per level (L1: 5 slots; L2: 4 slots; different x/y) -> DISCOVER, don''t
    hardcode. RUN by clicking the object sub-button sxhtkytekm (center, discovered).
    L1: program [3,3,3,3,3]=5 downs->y13->33. L2: [33,33,33,33]=4 ups->y24->8.'
  reproduce: "scripts/arc3_tn36_offline_solver.py \u2014 GENERAL from-scratch solver:\
    \ reads obj/target deltas + the per-level button layout (pfyayhyovw), computes\
    \ the move-program (down/up/left/right + scale/rotate), edits slots via bit-toggle\
    \ clicks, runs, and CHAINS levels. Reproduces L1-L3 (reproduced=True claimed_level=3,\
    \ 25 clicks). PATH-ROUTING: some levels have wall OBSTACLES (bizgpiltwm) with\
    \ a gap; cwtesiybfx (tn36.py:2269) reverts a move that collides, so the move ORDER\
    \ must route the object through the gap. The solver computes the move MULTISET\
    \ from deltas then searches orderings (the game is the path oracle) until one\
    \ wins -> two-pass (discover winning order per level, then clean minimal replay\
    \ on a fresh env, since env.reset() does NOT rewind an advanced episode). L3:\
    \ gap at y[16,20) between walls at x45; winning order [33,2,2,2,33,2]. L4: SCALE<->collision\
    \ interaction -- the object box changes size when scaled, so the SCALE-down move\
    \ must be interleaved at the right point (straight [3,3,3,3,1,9] LOSES; winner\
    \ e.g. [3,9,3,1,3,3]); the ordering search finds it. GOTCHA: a FRESH env is required\
    \ per ordering attempt -- accumulating failed runs on one env trips the game's\
    \ LOSS condition and resets the whole episode to L0 (was masking L4). L5: rotation\
    \ (270->0=code5) + scale-up (code8) + PROPERTY change (sjmtdfxdrc 11->15 = code\
    \ 63). PROPERTY codes DECODED 2026-06-17 (set sjmtdfxdrc absolutely): code14->9,\
    \ code15->8, code63->15 (PROP_CODE map; code 63 = all 6 bits set). L6: MULTI-RUN\
    \ MAZE -- the collision-free path (8 moves) exceeds the 6 slots, so it uses the\
    \ CHECKPOINT mechanic (wgzwawbgew): a run that ENDS on a checkpoint advances the\
    \ object's base (mnvoffrbex), so progress carries across runs. Solver reads box/obstacles/checkpoints\
    \ from internal state, BFS-plans a path start->checkpoint->target with each leg\
    \ <= n moves, runs the legs in sequence. L6: leg1 [2,2,2,2,33,33]->checkpoint(49,20),\
    \ leg2 [1,1,33,33,33,1]->target. Reproduces L1-L6 (reproduced=True claimed_level=6,\
    \ 74 clicks). Frozen trajectory at results/arc_explore_trajectory_tn36.json."
