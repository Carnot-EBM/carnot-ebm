- game: r11l
  reproducibility: reproduced
  levels_reproduced: 4
  mechanic_class: click_template_handle_average
  win_condition: >-
    L1 click-to-template placement plus L2 handle-average placement: each
    non-dirwzt roefwu piece must collide with its flkdtg template; pieces with
    multiple roefwulewcui handles move to the average of handle centers. L3
    (2026-07-11, claude-fable-5): two pieces (2 handles and 4 handles) must
    each reach a dotted template via handle-average positioning; win is
    template OVERLAP, not exact centering. See gotcha below for the full
    handle-physics model and the RESET-based recovery discipline.
  action_model: >-
    ACTION6 click-only. Clicking a handle selects it; clicking elsewhere moves
    the selected handle to the click minus half-handle size, and grouped pieces
    recompute from the average of their handle centers. L3+: handle moves are
    radius-8-Euclidean teleports onto open cells (hopping over walls is legal;
    only the destination is checked).
  solver: 'L1-L2: GameAdapter _r11l in python/carnot/agentic/arc_game_adapters.py
    + scripts/arc_loop_solve.py; results/arc_loop_solve_r11l.json 24-label L2
    reproduction gate. L3: results/outer_loop_fable5_r11l_probe.json
    action_sequence (82-label full sequence: the same 24-label L1-L2 prefix +
    58 clicks solving L3, the third of three exploration episodes -- the
    first two ended in diagnosed, RESET-recovered GAME_OVERs and are NOT
    included in this clean sequence), claude-fable-5, 2026-07-11. Self-run
    reproduction gate (reached_level=3, reproduced=True) AND independently
    re-verified by the outer loop (5x fresh env.reset() + reproduce()).'
  reproduce: >-
    Exp4862 results/experiment_4862_levelup_attempt.json re-gates
    results/arc_loop_solve_r11l.json offline_reproduced=True,
    reached_level=2, banked +1 over the prior L1 registry row.
  gotchas:
  - Existing models/arc_verifier_r11l.json is a stale 4-feature checkpoint from
    the L1 first-contact path; _r11l intentionally sets featurize=None so the
    standing loop uses the hand verifier instead of loading the mismatched head.
  - L2 has grouped pieces controlled by multiple handles; moving a handle to the
    template corner is not enough because the piece origin is the average of all
    handle centers.
  - 'L3 HANDLE-PHYSICS + RESET-RECOVERY mechanic (2026-07-11, claude-fable-5,
    independently re-verified by the outer loop): the black diamond shown on
    a handle is just its SELECTION highlight, not a special/locked handle. A
    handle move is a radius-8-EUCLIDEAN teleport to any open destination cell
    (hopping over walls in between is legal -- only the destination matters);
    a move is silently rejected (click consumed, no move) if the destination
    is >8 away, on a wall, has a footprint clipping a wall/template dot, or
    lands within Chebyshev distance 2 of ANY other handle (including the
    other piece''s). After every handle move the piece recomputes to
    floor(mean(handle centers)) -- if THAT position overlaps wall terrain it
    is an INSTANT GAME_OVER, so the piece''s trajectory must be planned, not
    just the handles''. A col-0 stripe is a 64-click per-level budget
    (selects, rejected clicks, and no-op moves all count) that causes
    GAME_OVER at zero. GameAction.RESET (not env.reset()) is the safe
    recovery from BOTH mid-level trouble and GAME_OVER -- it restarts the
    CURRENT level cleanly (fresh budget, pieces reset, levels_completed
    preserved); env.reset() after a GAME_OVER leaves a broken state and must
    not be used for recovery. Wires (color-1 lines linking handles to their
    piece) occupy and block cells but redraw as things move, so a blocked
    destination often clears after moving something else first.'
  - 'L4 SOLVED round 2 (2026-07-11, gpt-5.6-sol via codex, post-wa30 breadth
    campaign): three movable multicolor pieces controlled by SEVEN handles
    (2/3/2 split, not six as guessed in the preview below) -- each piece must
    touch its uniquely color-matched dotted socket, while five ADDITIONAL
    unmatched dotted glyphs are real landing blockers/decoys (not just
    template noise). Solved on a clean 59-click attempt. Independently
    re-verified by the outer loop: 5x fresh env.reset() + replay via the
    fixed resolver, all 5 confirmed reached_level=4,
    state=GameState.NOT_FINISHED. L5 was substantially scouted (three
    explorations) but not won: introduces two black CARRIER pieces (2 and 3
    purple-centered handles) that pick up partially-colored black cargo on
    overlap, after which the payload moves with the carrier; complementary
    solid halves must be FUSED first (orange+maroon, cyan+tan) before
    delivery to a matching two-color dotted template -- the orange/maroon
    pair was successfully fused and delivered (consuming six dots of each
    color) and the cyan/tan pair was fused and routed toward its
    upper-right template, but the final optimized attempt exhausted L5''s
    hard 60-click meter during the last delivery. No L5 win this session;
    the frontier stays at level 4.'
  - 'L4 (previewed in a PRIOR session, not attempted at the time -- solved by
    the entry above): a much bigger jump -- THREE pieces with 2-3 colors each,
    six handles total (revised to seven, see above), and multiple
    color-matched templates (the handle-color-to-piece-color assignment
    guess was roughly right). The L3 choreography tooling (an offline
    simulator, a greedy+noise planner, and a beam-searched endgame) did
    transfer to the L4 attempt as predicted.'
  dead_ends:
  - 'Exp4862 first standing-loop attempt with _r11l featurize enabled failed
    before search: the stale models/arc_verifier_r11l.json checkpoint expected
    4 features while the new adapter exposed 6. The banked run disables learned
    checkpoint loading for this adapter.'
