    -- solve with Gaussian elimination, not greedy clicking. A wrong
    flip-model batch is recoverable without a reset: the mismatch pattern
    between predicted and actual post-click state uniquely identifies the
    true mask, letting a correct re-solve proceed from the live state (this
    is exactly how L6 was won, after an initial 11-click batch assumed the
    wrong mask and produced 9 mismatches).'
