        drift_recovered: true
        existing_reproduced_level: 1
        offline_reproduced_new_level: false
      ft09:
        drift_recovered: true
        existing_reproduced_level: 1
        offline_reproduced_new_level: false
      sb26:
        drift_recovered: true
        existing_reproduced_level: 1
        offline_reproduced_new_level: false
    offline_reproduced_new_level: false
    residual_dead_end: Transfer value is drift-recovery over cached symbolic click
