  - game: tn36
    reproducibility: reproduced   # SOLVED 2026-06-17 via program-editor RE (L1-L6, reproduction-gated)
    mechanic_class: program_editor  # strategy-router class (arc_strategy_router): routes to the frame-only program-editor model + SKIPS the goal-distance heuristic portfolio (a category error here — blind clicks can't drive 5-attribute alignment)
    levels_reproduced: 7
    win_condition: "MATCH a movable object to a target on FIVE attributes simultaneously: x, y, scale, rotation, and sjmtdfxdrc (a 5th property). Source: tn36.py:2153 vklyonlcrw = (obj.x==tgt.x and obj.y==tgt.y and obj.scale==tgt.scale and obj.rotation==tgt.rotation and obj.sjmtdfxdrc==tgt.sjmtdfxdrc). L1 at reset: obj=(x30,y13,s1,r0,sj11) tgt=(x30,y33,s1,r0,sj11) -> ONLY y is wrong (move down 20). Internal state is readable: env._game.fdksqlmpki.bzirenxmrg.{htntnzkbzu(obj),aqszntqeae(tgt)}."
    solver: "PROGRAM-EDITOR mechanic (FULLY RE'd 2026-06-17). The object runs an N-slot MOVE-PROGRAM (vkuvtkaerv); each slot holds a command code (tn36.py:2171 okllwtboml: 0=settle,1=left,2=right,3=down,33=up,5/6/7/16=rotate,8/9=scale+/-,14/15/63=property). Step CSPOIQWER=4. TOOL PALETTE = a 6-BIT code editor per slot: bit b's toggle-button is at (slot_x, slot_y_top + 3*b) for b=0..5 (values 1,2,4,8,16,32), so ANY code = sum of its set bits (down 3=bit0+bit1; up 33=bit0+bit5; scale+ 8=bit3; rotate+90 5=bit0+bit2). Slot positions ARE READABLE (controller.pfyayhyovw[i].{x,y}) and RE-LAY-OUT per level (L1: 5 slots; L2: 4 slots; different x/y) -> DISCOVER, don't hardcode. RUN by clicking the object sub-button sxhtkytekm (center, discovered). L1: program [3,3,3,3,3]=5 downs->y13->33. L2: [33,33,33,33]=4 ups->y24->8."
    reproduce: "scripts/arc3_tn36_offline_solver.py — GENERAL from-scratch solver: reads obj/target deltas + the per-level button layout (pfyayhyovw), computes the move-program (down/up/left/right + scale/rotate), edits slots via bit-toggle clicks, runs, and CHAINS levels. Reproduces L1-L3 (reproduced=True claimed_level=3, 25 clicks). PATH-ROUTING: some levels have wall OBSTACLES (bizgpiltwm) with a gap; cwtesiybfx (tn36.py:2269) reverts a move that collides, so the move ORDER must route the object through the gap. The solver computes the move MULTISET from deltas then searches orderings (the game is the path oracle) until one wins -> two-pass (discover winning order per level, then clean minimal replay on a fresh env, since env.reset() does NOT rewind an advanced episode). L3: gap at y[16,20) between walls at x45; winning order [33,2,2,2,33,2]. L4: SCALE<->collision interaction -- the object box changes size when scaled, so the SCALE-down move must be interleaved at the right point (straight [3,3,3,3,1,9] LOSES; winner e.g. [3,9,3,1,3,3]); the ordering search finds it. GOTCHA: a FRESH env is required per ordering attempt -- accumulating failed runs on one env trips the game's LOSS condition and resets the whole episode to L0 (was masking L4). L5: rotation (270->0=code5) + scale-up (code8) + PROPERTY change (sjmtdfxdrc 11->15 = code 63). PROPERTY codes DECODED 2026-06-17 (set sjmtdfxdrc absolutely): code14->9, code15->8, code63->15 (PROP_CODE map; code 63 = all 6 bits set). L6: MULTI-RUN MAZE -- the collision-free path (8 moves) exceeds the 6 slots, so it uses the CHECKPOINT mechanic (wgzwawbgew): a run that ENDS on a checkpoint advances the object's base (mnvoffrbex), so progress carries across runs. Solver reads box/obstacles/checkpoints from internal state, BFS-plans a path start->checkpoint->target with each leg <= n moves, runs the legs in sequence. L6: leg1 [2,2,2,2,33,33]->checkpoint(49,20), leg2 [1,1,33,33,33,1]->target. Reproduces L1-L6 (reproduced=True claimed_level=6, 74 clicks). Frozen trajectory at results/arc_explore_trajectory_tn36.json."
    next: "L7 CORRECTED DIAGNOSIS (2026-06-17): it is NOT transforms-during-maze (the prior note misdiagnosed it). L7 is a TIMED SPIKE-TRAP puzzle. ekdwmirldx = blinking spike obstacles at y[16,20) x[37,61) (two: (37,16,14,4),(47,16,14,4)), initially invisible. jmwdvdqntf (tn36.py:2350) toggles their visibility every 3 moves (when oocupkguhu%3==2, i.e. AFTER moves 2,5,8...). cwtesiybfx/adjust_scale (tn36.py:2277) call htntnzkbzu.qobvpoiega() = DISABLE the object (byqkqlmkfo=False, brvmvgfchj stuck) if it moves into OR is caught on a VISIBLE spike. Confirmed: straight 5-ups from (41,28) reaches (41,16) at move 2, the toggle turns spikes visible, object on the spike row -> DISABLED -> run fails. The y[16,20) band is fully walled (static (33,16,4,4) at x[33,37) + spikes at x[37,61)); the ONLY safe crossing is x[37,61) during a spikes-invisible window, exiting to y<=12 by the toggle move. Timing analysis: the object must be at y=24 at a run-start with spikes invisible, then [up,up,up] exits to y=12 by move 2 (toggle finds it safe at y12). No checkpoint sits at the needed y=24/x in [37,61), so a SINGLE run cannot both descend to y24 and cross; a solution needs a TIMED-STATE multi-run planner that models (position, run-move-index, spike-visibility-parity) across the maze+checkpoints. SOLVED 2026-06-17 (reproduced=True L7, 102 clicks): the timed planner (carnot.agentic.arc_maze_planner.timed_trap_plan) does waypoint BFS over checkpoints where each leg is a BFS over (position, run-slot-index) respecting the spike schedule (invisible slots 0-2, visible 3-5, death on the post-slot-2 toggle + residual hidden hitbox olbuwgbgyz). Winning plan: leg1 [up,up,right,right,right,down]->checkpoint(53,24); leg2 [up*4]->checkpoint(53,8); leg3 [down,left,left,left,up]->target(41,8). Validated against the real env + reproduction-gated."
    action_model: "ACTION6 click; data schema IS {x,y} and display->grid is 1:1 (camera.display_to_grid(30,13)==(30,13)). Clicks register (121/121 change the grid). Control is a PROGRAM/transform EDITOR, not direct steering: dispatch (tn36.py:2500) routes a click to a tool-palette (miytdaqzei, EMPTY at reset) else mvqheosngn(apply/2nd-object) else bzirenxmrg(the object); the object carries a move-program vkuvtkaerv=[3,0,3,0,0]; clicking it runs mmmdksslmq()->olrpupaury(). The exact EDIT->EXECUTE semantics that drive obj.y 13->33 are not yet cracked (directly invoking mmmdksslmq did NOT move the object; palette empty)."
    gotchas:
      - "CORRECTION (2026-06-17, deep RE): the prior 'ACTION6 schema is NOT {x,y} / KeyError x / explorer ERRORED' note is STALE/WRONG. {x,y} works; the KeyError only fires for data=None. rich_action_candidates emits {x,y} and graph_explore_solve_v2 runs CLEAN on tn36 (no error) — it just NO-ADVANCEs because the win needs the program-editor mechanic, not blind clicks."
      - "tn36 is a multi-attribute alignment puzzle (move+scale+rotate+property to match a target), far harder than lp85's +1,+1 position-match — blind graph-explore can't drive 5 attributes onto a target."
    next: "Crack the program-editor control: how is the object's vkuvtkaerv move-sequence EDITED (the palette miytdaqzei is empty at reset — find what populates it) and EXECUTED so obj.y goes 13->33. CLUE: the object's real clickable sub-button is sxhtkytekm, a 9x9 target at grid (32,51) [center ~(36,55)] — clicking the object's BOX is a no-op; this button (object.rawolunrbj only returns True when sxhtkytekm is hit) is the control. Executing the move-program via mmmdksslmq/ujhjvxuwae did NOT move the object, so [3,0,3,0,0] is not a direct move-sequence. Then build an adapter with hand_verifier=vklyonlcrw + goal_distance=sum of the 5 attribute mismatches (read from internal state), state_key=(x,y,scale,rotation,sjmtdfxdrc)."

