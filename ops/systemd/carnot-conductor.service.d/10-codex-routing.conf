# git history continuity; current routing is gemini.
EnvironmentFile=
Environment=AGENT_TYPE=gemini
Environment=AGENT_MODEL=gemini-3.1-pro-preview
Environment=AGENT_TYPE_PLANNER=gemini
Environment=AGENT_TYPE_RETRO=gemini
Environment=AGENT_MODEL_PLANNER=gemini-3.1-pro-preview
Environment=AGENT_MODEL_RETRO=gemini-3.1-pro-preview
Environment=CARNOT_FORCE_LIVE=1
Environment=CARNOT_MODE=research
