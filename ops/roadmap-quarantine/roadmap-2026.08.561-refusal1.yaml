milestone: "2026.08.561"
milestone_title: "Certified Structural Search and Continual Branch Advice"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6502-v560-retirement-v561-lineage-lock
    milestone: "2026.08.561"
    deliverable: results/experiment_6502_v560_retirement_v561_lineage_lock.json
    title: "V560 retirement ledger and V561 exact-structural lineage lock"
    priority: critical
    track: research-governance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 20
    estimated_wall_time_min: 30
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6490-leakage-neutral-trajectory-energy-baselines
        verdict: "disqualified: shortcut control survived held trajectory comparison"
        addressed_by: "This task does not repair or rerun learned trajectory energy; it freezes that retirement and permits only solver-native structural advice on a new certified distribution."
        retire_if_same_verdict: true
      - experiment_id: exp6493-gated-decomposed-trajectory-energy-ab
        verdict: "blocked_gate_check_failed"
        addressed_by: "This task closes the decomposed-energy chain and forbids V561 tasks from requiring it; the new branch starts from exact structural labels."
        retire_if_same_verdict: true
      - experiment_id: exp6496-chronological-continuous-factor-learning
        verdict: "complete_null: chronological replay is row-complete, but held-future learning readiness did not open"
        addressed_by: "This task retires factor-pool learning and permits only fixed-feature branch-weight updates after a new held structural signal clears."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V560 completed Exp6488-Exp6501. Its capstone made trajectory-energy, continuous-learning, ARC-policy, and hardware claims ineligible. The handoff retires learned trajectory energy and the current factor chain, defers ARC policy and hardware acceleration, and permits a fresh exact structural signal on a new task distribution. V561 must freeze that boundary before any implementation. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6501_v560_capstone.json
      - {project_root}/results/experiment_6490_trajectory_energy_baselines.json
      - {project_root}/results/experiment_6492_factor_causal_replay.json
      - {project_root}/results/experiment_6496_continuous_factor_learning.json
      - {project_root}/results/experiment_6498_csl_independent_audit.json
      - {project_root}/results/experiment_6499_arc_energy_progress_alignment.json
      - {project_root}/ops/exclusion_manifest.yaml, {project_root}/research-complete.yaml, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build a row-recomputed V560 retirement ledger and a fail-closed V561 lineage lock. Preserve reusable exact solvers and lifecycle controls. Forbid every retired scientific scope and define the one allowed exact structural branch.

      CONCRETE STEPS
      0. Record git status, protected-file hashes, input artifact hashes, exclusion-manifest state, and all compute or network preconditions before work.
      1. Add or confirm REQ-* and SCENARIO anchors for milestone retirement, changed-scope authorization, and protected-file checks. Write focused tests first.
      2. Recompute every V560 claim gate and gap row from Exp6488-Exp6501 per-unit evidence. Do not trust capstone aggregates alone.
      3. Emit one decision row per V560 branch with source artifact, observed field, verdict, disposition, retirement status, and allowed reuse.
      4. Freeze learned trajectory energy, factor causal value, decomposed energy, checker routing, factor-pool learning, and ARC energy-policy work.
      5. Permit only a new exact SAT/CSP distribution, solver-native structural advice, exact branch counterfactual labels, fixed-feature weight updates, and fixed-width mapping.
      6. Attack renamed scopes, hidden dependencies on retired task IDs, post-hoc corpus repair, answer generation, NL-to-ConstraintIR reprompting, ARC policy edits, and hardware claims.
      7. Set v561_lineage_lock_ready_score=1.0 only when every row recomputes and every forbidden reuse fails closed.
      8. Emit the artifact. Run focused tests, spec coverage, row consistency lint, adversarial verification, applicable documentation checks, and git status. Reconcile specs, traceability, status, and changelog only after validation.

      Required deliverable: {project_root}/results/experiment_6502_v560_retirement_v561_lineage_lock.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Records the terminal ledger state."
        verdict_class: "Closed enum: positive | circular_positive | null | blocked | disqualified | partial."
        v560_artifact_receipts: "Binds every V560 input to a path and hash."
        decision_rows: "Provides one recheckable row per prior claim surface."
        aggregate_row_recomputation: "Shows that capstone decisions derive from rows."
        retired_scope_definition: "Names the exact methods V561 cannot reuse."
        allowed_v561_lineage: "Defines the fresh structural-search scope."
        forbidden_reuse_attack_matrix: "Tests rename, dependency, repair, and claim-laundering attacks."
        v561_lineage_lock_ready_score: "Same-roadmap gate for the allowed lineage."
        per_unit_rows: "Carries decision and attack results for each unit."
        gate_check_summary: "Names any failed precondition and observed value for blocked_* verdicts."
        preconditions_checked: "Records artifact, manifest, repository, compute, and network checks."
        protected_files_unchanged: "Proves the active roadmap and conductor stayed unchanged."
        inference_substrate: "Declares independent artifact reduction with no LLM."
        verifier_is_oracle: "True only for deterministic hash and row recomputation."
        field_principles: "Explains why each evidence field exists."
        field_provenance: "Maps fields to artifact paths, JSON pointers, and reducer functions."
        random_seed: "Fixes attack ordering."
        duration_s: "Records measured wall time."
        tests_run: "Records commands and exit codes."
        reproducibility_checksum: "Hashes inputs, decisions, attacks, and outputs."
        honest_verdict: "Uses complete_* for a valid ledger or blocked_* with gate_check_summary."
      ACCEPTANCE GATES:
        - condition: "v561_lineage_lock_ready_score == 1.0."
        - condition: "No V561 task depends on a retired upstream experiment ID."
      Set inference_substrate=independent_v560_artifact_replay_no_llm. Set verifier_is_oracle=true only for deterministic row and hash recomputation.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6502_v560_retirement_v561_lineage_lock --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6503-v561-source-delta-method-contract
    milestone: "2026.08.561"
    deliverable: results/experiment_6503_v561_source_delta_method_contract.json
    title: "V561 source delta and exact-structural method preregistration"
    priority: high
    track: research-ingestion
    requires_gpu: false
    per_unit_rows: true
    max_turns: 20
    estimated_wall_time_min: 40
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6502-v560-retirement-v561-lineage-lock
        artifact_field: v561_lineage_lock_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      The planner refresh in research-references.md promotes symbolic certification, initial branch ranking, clause advice, and exact-repair LNS. Execution must pin those sources and turn them into a frozen local comparison contract before data generation. Paper and product claims are context, not local evidence. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/research-references.md, and the V561 roadmap document
      - {project_root}/results/experiment_6502_v560_retirement_v561_lineage_lock.json
      - {project_root}/scripts/experiment_template.py
      - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/e2e-test-plan.md
      - existing exact SAT, CSP, graph, KAN, and sampler modules under {project_root}/python/carnot/

      TASK
      Recheck the V561 research sources, record stable receipts, and preregister the exact benchmark, branch-advice, learned-ranker, LNS, continual-learning, and mapping comparisons. Add no new runtime dependency unless the local stack lacks a required exact primitive.

      CONCRETE STEPS
      0. Evaluate the Exp6502 gate. Record its path, hash, field, expected value, observed value, network state, and protected-file hashes in gate_check_summary and preconditions_checked.
      1. Add or confirm REQ-* and SCENARIO anchors for source receipts, claim boundaries, and method preregistration. Write focused tests first.
      2. Recheck arXiv 2608.14569, 2603.07176, 2603.20801, OpenReview xvcqXxw4Le, Semantic Scholar EBT and ARM-EBM records, Hugging Face Papers, GitHub, Extropic, and Logical Intelligence.
      3. Store title, stable URL, access date, available version, source class, and bounded Carnot implication for each receipt. Do not copy long source text.
      4. Freeze benchmark families, shift axes, minimum held cell size, exact authorities, solver metrics, structural features, branch checkpoints, model controls, statistical rules, and failure conditions.
      5. Freeze the rule that neural advice may order search but cannot accept, label, or release a solution.
      6. Record no-delta findings honestly. Set method_contract_ready_score=1.0 only when every promoted method has a local test and every product claim has a no-local-evidence boundary.
      7. Emit one row per source, method, control, metric, and boundary. Hash the contract before downstream data work.
      8. Run focused tests, spec coverage, row lint, adversarial verification, documentation checks, and git status. Reconcile required docs after validation.

      Required deliverable: {project_root}/results/experiment_6503_v561_source_delta_method_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Records source-ingestion completion."
        verdict_class: "Closed enum: positive | circular_positive | null | blocked | disqualified | partial."
        upstream_gate_receipt: "Binds the Exp6502 gate and observed value."
        source_receipt_rows: "Records one stable receipt per checked source."
        source_delta_rows: "Separates new, unchanged, unavailable, and superseded findings."
        method_contract: "Freezes benchmark, advice, learning, LNS, continual, and mapping methods."
        authority_boundary: "Keeps exact solvers above all learned signals."
        dependency_decision_rows: "Explains why each dependency is reused, added, or rejected."
        method_contract_ready_score: "Same-roadmap gate for the frozen method contract."
        per_unit_rows: "Carries source, method, metric, and boundary rows."
        aggregate_row_recomputation: "Recomputes readiness from required receipts."
        gate_check_summary: "Names any failed gate or source precondition and observed value."
        preconditions_checked: "Records gate, network, source, repository, and tool checks."
        protected_files_unchanged: "Proves protected files stayed unchanged."
        inference_substrate: "Declares source retrieval and local artifact synthesis with no inference model."
        verifier_is_oracle: "False because source synthesis is not an execution oracle."
        field_principles: "Explains each receipt and boundary field."
        field_provenance: "Maps each finding to a URL, access receipt, and local contract row."
        random_seed: "Fixes deterministic source and attack ordering."
        duration_s: "Records measured wall time."
        tests_run: "Records commands and exit codes."
        reproducibility_checksum: "Hashes source receipts and the frozen contract."
        honest_verdict: "Uses complete_* when the contract is valid or blocked_* with gate_check_summary."
      ACCEPTANCE GATES:
        - condition: "method_contract_ready_score == 1.0."
        - condition: "Every promoted paper maps to a bounded local test, not a copied claim."
      Set inference_substrate=source_receipts_and_local_method_preregistration_no_llm. Set verifier_is_oracle=false.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6503_v561_source_delta_method_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6504-exact-structural-benchmark-commitment
    milestone: "2026.08.561"
    deliverable: results/experiment_6504_exact_structural_benchmark_commitment.json
    title: "Immutable exact SAT/CSP structural benchmark commitment"
    priority: critical
    track: data-and-evidence
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6502-v560-retirement-v561-lineage-lock
        artifact_field: v561_lineage_lock_ready_score
        op: "=="
        value: 1.0
      - upstream: exp6503-v561-source-delta-method-contract
        artifact_field: method_contract_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      V560 permits a new task distribution after a fresh leakage-resistant commitment. V561 needs exact structural instances before any ranker or SOTA mutation sees held rows. The benchmark must separate solver hardness from surface difficulty and must include enough held units for per-cell comparisons. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/_bmad/architecture.md, and the V561 roadmap document
      - {project_root}/results/experiment_6502_v560_retirement_v561_lineage_lock.json
      - {project_root}/results/experiment_6503_v561_source_delta_method_contract.json
      - {project_root}/results/experiment_6489_solver_trajectory_commitment.json
      - exact solver and benchmark modules under {project_root}/python/carnot/
      - relevant tests, capability specs, exclusion manifest, and ops/e2e-test-plan.md

      TASK
      Create and seal a procedural exact SAT/CSP benchmark with train, development, and held shifts. Commit raw instances, exact labels, solver receipts, strata, split rules, leakage attacks, and checksums before learned work.

      CONCRETE STEPS
      0. Evaluate both structured gates. Record paths, hashes, fields, expected and observed values, solver availability, CPU/RAM/disk, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for exact benchmark generation, immutable splits, exact labels, family balance, and leakage rejection. Write tests first.
      2. Generate versioned random and pseudo-industrial 3-CNF, Tseitin, pigeonhole, graph-coloring, and small scheduling instances. Use only deterministic local generators and fixed seeds.
      3. Obtain SAT/UNSAT, feasible/infeasible, model, proof, and validity receipts from installed exact backends. Quarantine disagreements. Never hand-correct a label.
      4. Freeze family, scale, surface relabeling, density, proof family, source, and solver-effort strata. Do not use solver effort as a model-difficulty proxy.
      5. Commit train, development, and held splits by base-instance lineage before feature extraction. Require at least 30 held units in every planned headline cell.
      6. Attack unit identity, row order, serialization length, generator seed, family, duplicate lineage, label balance, solver backend, and split leakage.
      7. Emit raw instance rows and one receipt per label, proof/model check, split, stratum, and attack. Set base_structural_benchmark_ready_score=1.0 only if exact replay and every commitment invariant pass.
      8. Run focused tests, full new-module coverage, lint, spec coverage, row consistency lint, adversarial verification, exact-solver E2E checks, and git status. Reconcile specs and ops docs.

      Required deliverable: {project_root}/results/experiment_6504_exact_structural_benchmark_commitment.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Records the terminal benchmark state."
        verdict_class: "Closed enum: positive | circular_positive | null | blocked | disqualified | partial."
        upstream_gate_receipts: "Bind both same-roadmap gates and observed values."
        benchmark_schema: "Versions instances, labels, proofs, models, strata, and splits."
        raw_instance_rows: "Preserves every formal instance before feature extraction."
        exact_label_rows: "Provides solver-certified labels and authority receipts."
        exact_replay_rows: "Checks every accepted label with a deterministic replay."
        split_commitment: "Freezes lineage-separated train, development, and held sets."
        stratum_balance_rows: "Records family, scale, surface, hardness, source, and label counts."
        minimum_held_cell_size: "Enforces at least 30 units for percentage comparisons."
        leakage_attack_matrix: "Tests identity, order, length, seed, family, duplicate, backend, and split shortcuts."
        base_structural_benchmark_ready_score: "Same-roadmap gate for the base benchmark."
        per_unit_rows: "Carries instance, label, replay, split, stratum, and attack rows."
        aggregate_row_recomputation: "Recomputes counts and readiness from raw rows."
        gate_check_summary: "Names any failed gate, solver, cell-size, or replay check and observed value."
        preconditions_checked: "Records gates, solver tools, resources, repository, and storage checks."
        protected_files_unchanged: "Proves protected files stayed unchanged."
        inference_substrate: "Declares procedural generators and exact local solvers with no LLM."
        verifier_is_oracle: "True only for exact solver labels and executable validity checks."
        field_principles: "Explains why each commitment field exists."
        field_provenance: "Maps rows to generators, seeds, solver commands, and hashes."
        random_seed: "Records all generator and split seeds."
        duration_s: "Records measured wall time."
        tests_run: "Records commands and exit codes."
        reproducibility_checksum: "Hashes instances, labels, splits, strata, and attacks."
        honest_verdict: "Uses complete_* when the commitment is valid or blocked_* with gate_check_summary."
      ACCEPTANCE GATES:
        - condition: "base_structural_benchmark_ready_score == 1.0."
        - condition: "Every accepted label replays under an exact backend and every planned held cell has at least 30 units."
      Set inference_substrate=procedural_formal_instances_and_exact_solver_labels_no_llm. Set verifier_is_oracle=true only for exact labels and executable validity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6504_exact_structural_benchmark_commitment --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6505-sota-formal-challenge-mutations
    milestone: "2026.08.561"
    deliverable: results/experiment_6505_sota_formal_challenge_mutations.json
    title: "Local-SOTA one-shot formal challenge mutation stream"
    priority: high
    track: local-sota-evaluation
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6504-exact-structural-benchmark-commitment
        artifact_field: base_structural_benchmark_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp5813-split-budget-sota-canary
        verdict: "complete: answer_channel_not_ready_split_budget_sota_canary"
        addressed_by: "Models do not answer tasks or emit finite IDs; they propose one-shot edit scripts for already formal instances, and exact solvers create all labels."
        retire_if_same_verdict: true
      - experiment_id: exp5923-sota-schema-supported-constraintir-ab
        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "This task performs no natural-language-to-ConstraintIR translation; it applies bounded syntactic edits to an existing formal DSL and may reject every model row without changing the procedural benchmark."
        retire_if_same_verdict: true
      - experiment_id: exp6463-sota-fixed-policy-candidate-corpus-v2
        verdict: "complete: fixed-policy corpus v2 finished but readiness gate stayed closed"
        addressed_by: "The deliverable is a challenge-instance mutation stream, not an answer-policy candidate corpus; models never see held labels or produce release decisions."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V561 must use current local SOTA models without reopening generated-answer or semantic-translation failures. Models may propose formal challenge mutations only. Exact parsing and solving decide whether a mutation enters the challenge pool. The base procedural benchmark remains valid even if all model proposals fail. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py, including cached_sota_pair() and GGUF tokenizer guidance
      - {project_root}/research-program.md and the V561 roadmap document
      - {project_root}/results/experiment_6504_exact_structural_benchmark_commitment.json
      - {project_root}/results/experiment_5813_split_budget_sota_canary.json
      - {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
      - {project_root}/results/experiment_6463_sota_fixed_policy_candidate_corpus_v2.json
      - existing llama_cpp runtime, exact parser, solver, and receipt modules under {project_root}/python/carnot/
      - relevant tests, model cache rules, exclusion manifest, and ops/e2e-test-plan.md

      TASK
      Build a one-shot challenge mutation stream with the three mandated local GGUF families. Each model receives a development formal instance and a bounded edit grammar. Persist raw bytes and runtime receipts. Exact local tools accept, label, or reject each mutation.

      CONCRETE STEPS
      0. Evaluate the Exp6504 gate. Check model cache paths, file sizes, llama_cpp CUDA support, GPU inventory, free VRAM, disk, and protected-file hashes before loading a model. Record failures exactly.
      1. Add or confirm REQ-* and SCENARIO anchors for one-shot mutation, no-answer boundaries, exact mutation admission, model provenance, and GPU receipts. Write tests first.
      2. Define MODEL_SPECS with unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Load one at a time through llama_cpp and each GGUF's embedded tokenizer. Do not use AutoTokenizer.
      3. Freeze a small edit DSL for bounded clause, edge, color, job, precedence, coefficient, and relabel operations. The prompt must forbid answers, labels, solver advice, free-form semantic translation, and release decisions.
      4. Select development-only source instances before generation. Issue one request per source/model pair. Do not retry until parse or acceptance. Persist exact request and response bytes before parsing.
      5. Parse each edit script. Apply syntactically valid edits to a copy. Run exact satisfiability, feasibility, model/proof, and validity checks. Quarantine invalid, duplicate, unchanged, or label-ambiguous outputs.
      6. Compare valid-yield, novelty, family, scale, label, edit type, truncation, parser, and runtime cells across model families. A model-family comparison requires one row for each request.
      7. Set challenge_generation_complete_score=1.0 when all precommitted requests have terminal receipts, even if valid yield is zero. Set challenge_pool_ready_score separately and never block the base benchmark on model quality.
      8. Emit the artifact. Run focused tests, full new-module coverage, lint, spec coverage, row lint, adversarial verification, local-inference E2E checks, and git status. Reconcile specs and ops docs.

      Required deliverable: {project_root}/results/experiment_6505_sota_formal_challenge_mutations.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Records terminal generation and admission state."
        verdict_class: "Closed enum: positive | circular_positive | null | blocked | disqualified | partial."
        upstream_gate_receipt: "Binds the base benchmark gate and observed value."
        model_specs: "Lists all three mandated GGUF repositories, files, quantization, and roles."
        model_runtime_receipts: "Records llama_cpp backend, tokenizer, offload, VRAM, and timing per model."
        mutation_grammar: "Freezes the bounded formal edit language."
        source_selection_receipt: "Proves all sources are development-only and chosen before generation."
        raw_request_response_receipts: "Preserves exact bytes and hashes before parsing."
        rows: "Provides one request, parse, edit, exact-check, and disposition row per unit."
        exact_admission_rows: "Records parse, replay, label, proof/model, novelty, and quarantine outcomes."
        model_family_results: "Reports valid yield and failure modes separately for each SOTA family."
        challenge_generation_complete_score: "Same-roadmap gate for complete request accounting."
        challenge_pool_ready_score: "Separates useful valid mutations from execution completeness."
        prohibited_output_attack_matrix: "Tests answers, labels, heuristics, semantic translation, retries, held access, and model identity shortcuts."
        per_unit_rows: "Carries every request and exact admission result."
        aggregate_row_recomputation: "Recomputes all yields, counts, and scores from rows."
        gate_check_summary: "Names any failed benchmark, cache, CUDA, GPU, parse, or runtime check and observed value."
        preconditions_checked: "Records gate, cache, GPU, runtime, tokenizer, disk, and repository checks."
        protected_files_unchanged: "Proves protected files stayed unchanged."
        inference_substrate: "Declares local llama_cpp GGUF generation plus exact CPU parsing and solving."
        verifier_is_oracle: "True only for exact formal admission checks; models are not oracles."
        field_principles: "Explains each generation, admission, and boundary field."
        field_provenance: "Maps rows to model files, raw hashes, parser functions, and solver receipts."
        random_seed: "Records source selection and generation seeds."
        duration_s: "Records measured wall time."
        tests_run: "Records commands and exit codes."
        reproducibility_checksum: "Hashes specs, raw bytes, parses, admissions, and rows."
        honest_verdict: "Uses complete_* for complete accounting, complete_null for zero useful yield, or blocked_* with gate_check_summary for unmet execution preconditions."
      ACCEPTANCE GATES:
        - condition: "challenge_generation_complete_score == 1.0 after every precommitted request has one terminal receipt."
        - condition: "No accepted row contains a model-generated answer, label, semantic translation, or release decision."
      Set inference_substrate=local_llama_cpp_three_family_formal_mutation_generation_plus_exact_solver_admission. Set verifier_is_oracle=true only for exact parsing, solving, and validity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6505_sota_formal_challenge_mutations --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.
