- id: exp7078-gpu-lease-journal-migration
  title: GPU lease journal schema migration and stale-owner recovery
  track: infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.620
  deliverable: results/experiment_7078_v620_gpu_lease_migration.json
  prompt: |
    CONTEXT:
    Exp7065 found two released terminal GPU lease journals that declare schema
    v1 but lack `lease_id`. The current strict reader must fail closed on those
    bytes. V620 needs an explicit legacy migration path, not relaxed validation
    and not deletion of unknown ownership evidence.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_7065_v619_three_family_entrance_bank.json
    - {project_root}/python/carnot/gpu_lease_phase_journal.py
    - {project_root}/python/carnot/experiment_7065_v619_three_family_entrance_bank.py
    - {project_root}/python/carnot/experiment_6973_lease_aware_gguf_runtime.py
    - {project_root}/tests/python/test_gpu_lease_phase_journal.py
    - {project_root}/tests/python/test_experiment_6633_gpu_lease_phase_journal.py
    - {project_root}/scripts/run_stop_authority.py
    - {project_root}/openspec/capabilities/inference/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Implement a fail-closed migration for legacy same-schema lease journals
    that lack `lease_id`. Preserve original bytes and provenance. Migrate only
    proven released terminal journals with no live owner or held device lock.

    CONCRETE STEPS:
    0. PRECONDITIONS: inspect exact journal paths, kernel locks, device UUIDs,
       process identities, and GPU processes read-only first. If any journal is
       unreleased, nonterminal, checksum-invalid, live-owned, lock-held, or
       device-mismatched, write terminal `blocked` with gate_check_summary. Do
       not signal, kill, unlink, or overwrite that owner.
    1. Add REQ-INFRA-7078 and RED tests before implementation. Test valid
       legacy terminal input, bad checksum, missing owner fields, live PID,
       reused PID, held lock, wrong UUID, nonterminal phase, repeated migration,
       atomic-write interruption, and current-schema no-op.
    2. Define the exact legacy schema fingerprint. Do not accept an arbitrary
       missing-field document. Verify its legacy checksum and complete phase
       history before migration.
    3. Acquire the device kernel lock nonblocking. Recheck owner liveness and
       current bytes after lock acquisition to close time-of-check races.
    4. Preserve the original bytes under a content-addressed recovery path.
       Write a migration receipt that binds source hash, target hash, device,
       old task, generated lease ID, reason, and timestamps.
    5. Publish a current valid terminal-released journal by atomic replace.
       The new lease ID must be explicit and marked as migrated evidence. A
       second run must be idempotent.
    6. Run the Exp7065 lease preflight logic without model inference and prove
       both target devices classify as available.
    7. Set gpu_lease_compatibility_ready_score=1 only when all real and
       synthetic migration rows validate, preserved bytes are readable, no
       signal was sent, and current journals remain strict.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, scoped spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (deterministic_os_lease_recovery_no_llm);
       duration_s; source_artifact_hashes; rows; discovered_journal_rows;
       legacy_validation_rows; owner_liveness_rows; kernel_lock_rows;
       gpu_process_rows; migration_rows; preserved_source_rows;
       atomic_publish_rows; idempotence_rows; strict_reader_rows;
       post_migration_preflight_rows; signals_sent; files_removed (empty);
       gpu_lease_compatibility_ready_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7078_v620_gpu_lease_migration.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7079-gpu-lease-fresh-process-audit
