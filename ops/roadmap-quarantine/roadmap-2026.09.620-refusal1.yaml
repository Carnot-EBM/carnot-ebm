    - {project_root}/scripts/run_gpu_guard.py
    - {project_root}/scripts/run_stop_authority.py
    - {project_root}/openspec/capabilities/inference/spec.md

    TASK:
    Audit lease compatibility in fresh competing processes on both visible
    RTX 3090 devices. Prove same-device exclusion, independent-device progress,
    ordered phases, crash recovery, and terminal release without model load.

    CONCRETE STEPS:
    0. PRECONDITIONS: require gpu_lease_compatibility_ready_score=1, matching
       upstream hash, exactly two idle RTX 3090 UUIDs, no unattributed GPU
       process, clean stop authority, and writable isolated audit paths. If a
       foreign or unknown owner appears, block and send no signal.
    1. Add REQ-INFRA-7079 and RED tests before implementation. Test stale
       upstream hashes, one-GPU and reordered topology, same-device races,
       cross-device independence, owner mismatch, crash, expiry, phase skips,
