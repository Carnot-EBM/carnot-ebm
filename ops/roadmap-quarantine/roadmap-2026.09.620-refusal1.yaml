       authority.
    3. Start fresh processes on different devices. Require both to acquire and
       advance independently through a short no-model phase sequence.
    4. Exercise a controlled crashed owner in an isolated runtime directory.
       Require kernel-release proof, PID-start mismatch protection, preserved
       recovery evidence, and a safe new owner.
    5. On both real device UUIDs, acquire task-owned leases, execute the full
