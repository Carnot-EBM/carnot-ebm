      op: ==
      value: 1
  prompt: |
    CONTEXT:
    Exp7078 supplies strict readable lease journals and a preserved legacy
    migration receipt. The entrance run needs an independent fresh-process
    proof that leases remain exclusive, recoverable, and released on both GPUs.
    This task does not load a model.

