  - id: exp6569-source-span-proof-obligation-extractor
    milestone: "2026.08.569"
    deliverable: results/experiment_6569_source_span_proof_obligation_extractor.json
    title: "Source-span proof-obligation extraction with exact certification"
    priority: critical
    track: extraction-verification
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 420
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp5909-sota-constraint-synthesis-ab
        verdict: "complete_null: structured prompt arms did not improve exact synthesis"
        addressed_by: "Exp5909 asked models to synthesize a complete structured constraint object. Exp6569 binds atomic relations to immutable source byte spans and lets a deterministic local compiler create each proof obligation."
        retire_if_same_verdict: true
      - experiment_id: exp5910-verification-guided-constraint-repair
        verdict: "complete_null: exact diagnostics did not beat matched repair controls"
        addressed_by: "Exp5910 repaired generated text after verifier feedback. Exp6569 performs one frozen extraction pass, exact certification, and abstention; it does not reprompt or rewrite a failed formal object."
        retire_if_same_verdict: true
      - experiment_id: exp5923-sota-schema-supported-constraintir-ab
        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "Exp5923 treated schema-supported full ConstraintIR generation as the mechanism. Exp6569 forbids full generated ConstraintIR and requires source offsets, whitelisted atomic relations, compiler-owned obligations, and exact release checks."
        retire_if_same_verdict: true
      - experiment_id: exp6562-constraint-saturation-independent-audit-v2
        verdict: "disqualified_constraint_saturation_independent_audit_v2: fixture, live provenance, exact replay, release, harm, or cost evidence is non-recomputable"
        addressed_by: "Exp6569 consumes the new immutable Exp6568 raw lineage, emits all model and arm rows before aggregation, and stores exact release, harm, and charged-cost receipts."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6568-immutable-source-span-claim-stream
        artifact_field: immutable_live_claim_stream_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Carnot's largest PRD gap is natural-language extraction. Full generated ConstraintIR, schema reprompting, and verification-guided text repair are retired. Exp6568 supplies a new immutable raw source and response stream. This task tests a different mechanism: source-span-bound atomic relations compiled locally into exact proof obligations. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V569 roadmap document
      - {project_root}/results/experiment_6566_proof_obligation_and_graph_potts_method_contract.json and {project_root}/results/experiment_6568_immutable_source_span_claim_stream.json
      - immutable Exp6568 JSONL shards, raw response files, split manifest, checker receipts, and cost rows
      - current extractor/parser/abstain code, constraint AST, compiler, Z3 bridge, witness and counterexample code, and their tests
      - Exp5909, Exp5910, and Exp5923 implementations and artifacts only to preserve the retirement boundary
      - relevant extraction, constraint, verifier, model, artifact, and exact-replay specs plus exclusions, traceability, and E2E plan

      TASK
      Implement and compare a source-span proof-obligation extractor against the frozen current parser-and-abstain control. Every accepted atomic claim must point to source bytes and compile deterministically into an exact check. Unsupported text must abstain.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      All three families need separate held rows. Small legacy models are smoke-only.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate the structured gate; record upstream path, hash, expected and observed value; record stream, compiler, checker, model, tokenizer, GPU, CPU, RAM, disk, journal, timer, and protected-file receipts.
      1. Add or confirm REQ-* and SCENARIO anchors for exact byte spans, typed variables, whitelisted atomic relations, deterministic compilation, abstention, exact certification, counterexamples, held comparison, and atomic output. Write tests first.
      2. Freeze the current parser-and-abstain control from existing code. Do not improve it after held results exist. Reuse the same Exp6568 raw responses and unit order.
      3. Implement the new extractor so a proposal contains source hash, start/end byte offsets, typed variable bindings, whitelisted relation, and optional witness reference. It must not emit a full ConstraintIR or perform schema-only reprompting.
      4. Make the local compiler the only component that constructs executable obligations. Record compiler version, normalized obligation, hash, determinism replay, Z3 result, witness or counterexample, and release or abstain action.
      5. Run all three models and both arms on matched units, seeds, prompts, and budgets. Store per-claim and per-unit rows before aggregates.
      6. Measure exact-certified precision, exact-certified coverage, unsupported abstention, false accept, false reject, unsafe release, counterexample yield, tokens, retries, solver calls, wall time, and censoring by model and held family.
      7. Attack invalid UTF-8 offsets, source mutation, overlapping spans, entity and row-order leakage, relation smuggling, schema-valid semantic errors, compiler nondeterminism, verifier self-labeling, hidden retries, zero-headroom cells, and aggregate tampering.
      8. Set proof_carrying_extractor_execution_ready_score=1.0 when rows, provenance, compilation, and exact replay close. Set proof_carrying_extractor_candidate_score=1.0 only when the preregistered held coverage improvement, noninferior precision, zero unsafe release, and charged-cost gates all pass across required model families.
      9. Write one terminal artifact atomically. Run focused tests with full new-module coverage, lint, spec coverage, gate audit, row consistency lint, adversarial verification, extraction-to-exact-replay E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6569_source_span_proof_obligation_extractor.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state distinguishes a full comparison from setup-only compiler work."
        honest_verdict:
          principle: "The verdict states provenance, exact-certified coverage, precision, release safety, and cost."
        verdict_class:
          principle: "A closed class preserves null, blocked, disqualified, partial, and positive outcomes."
        upstream_gate_receipt:
          principle: "The comparison identifies the immutable live claim stream that authorized it."
        MODEL_SPECS:
          principle: "All three mandated GGUF families are explicit."
        frozen_control_and_method_contract:
          principle: "The control and changed mechanism are fixed before held results."
        source_span_claim_rows:
          principle: "Every proposal carries source hash, byte bounds, variables, relation, and action."
        compiler_and_exact_obligation_rows:
          principle: "Deterministic compiler and solver receipts support every accepted or rejected claim."
        per_unit_rows:
          principle: "Every model, arm, seed, unit, and metric remains recheckable."
        exact_certified_precision_and_coverage:
          principle: "Coverage cannot be promoted without precision and held-family detail."
        unsafe_release_and_abstention_rows:
          principle: "No aggregate gain may hide one invalid released claim."
        charged_cost_rows:
          principle: "Tokens, retries, solver calls, time, and censoring are part of the claim."
        shortcut_attack_matrix:
          principle: "Span, leakage, relation, compiler, retry, and aggregate attacks test the mechanism."
        proof_carrying_extractor_execution_ready_score:
          principle: "A binary field states whether the comparison executed with complete evidence."
        proof_carrying_extractor_candidate_score:
          principle: "A separate field requires coverage, precision, safety, and cost gates."
        aggregate_row_recomputation:
          principle: "All headlines derive from emitted claim and unit rows."
        gate_check_summary:
          principle: "A blocked verdict names the failed stream, compiler, runtime, or row check and value."
        preconditions_checked:
          principle: "Stream, runtime, compiler, and resource receipts distinguish block from null."
        protected_files_unchanged:
          principle: "The experiment preserves protected orchestration files."
        inference_substrate:
          principle: "The artifact declares live three-family extraction over immutable raw responses."
        verifier_is_oracle:
          principle: "Held exact targets are independent authority, not the learned extractor being evaluated."
        field_provenance:
          principle: "Every result points to source bytes, raw output, compiler row, exact row, and reducer."
        random_seed:
          principle: "Frozen seeds make matched inference and attack order repeatable."
        duration_s:
          principle: "Monotonic duration includes model, compiler, exact, and persistence work."
        tests_run:
          principle: "Named tests and E2E commands show the whole comparison ran."
        reproducibility_checksum:
          principle: "A final content hash protects the comparison."
      Set inference_substrate=live_three_family_source_span_atomic_relation_extraction_with_compiler_owned_exact_obligations and verifier_is_oracle=false. A gate-passing result may use verdict_class=positive. Use null for a clean non-win, partial for usable incomplete evidence, blocked for missing prerequisites, and disqualified for leakage, false provenance, or unsafe release.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6569_source_span_proof_obligation_extractor --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6570-proof-obligation-independent-audit
    milestone: "2026.08.569"
    deliverable: results/experiment_6570_proof_obligation_independent_audit.json
    title: "Independent source-span proof-obligation evidence audit"
    priority: critical
    track: independent-audit
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    model: sonnet
    prior_failures:
      - experiment_id: exp6562-constraint-saturation-independent-audit-v2
        verdict: "disqualified_constraint_saturation_independent_audit_v2: fixture, live provenance, exact replay, release, harm, or cost evidence is non-recomputable"
        addressed_by: "Exp6570 audits a new content-addressed raw lineage and independently reconstructs model provenance, source spans, compiler obligations, exact releases, harm, and costs. It never imports the disqualified saturation headline."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6568 and Exp6569 create a new raw-response and proof-obligation lineage. V568 showed why a headline is unusable when provenance, exact release replay, harm, or cost cannot be reconstructed. This audit always runs and performs no new model generation. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V569 roadmap document
      - {project_root}/results/experiment_6568_immutable_source_span_claim_stream.json and all referenced immutable shards
      - {project_root}/results/experiment_6569_source_span_proof_obligation_extractor.json and all referenced claim, compiler, exact, attack, and cost rows
      - source-byte indexer, compiler, Z3 checker, witness and counterexample reducers, receipt validators, and tests
      - {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/verdict_row_consistency_lint.py, relevant specs, exclusions, traceability, and E2E plan

      TASK
      Independently audit the source-span proof-obligation evidence from checked-in rows. Recompute model provenance, span validity, compiler determinism, exact outcomes, releases, abstentions, harm, costs, and promotion gates without new LLM inference.

      CONCRETE STEPS
      0. PRECONDITIONS: record existence, paths, hashes, byte sizes, and mtimes for upstream artifacts, shards, raw responses, model files without loading them, compiler, checker, reducers, CPU, RAM, disk, Python, Z3, timer, audit seed, and protected files.
      1. Add or confirm REQ-* and SCENARIO anchors for independent raw receipt validation, byte-span replay, compiler replay, exact replay, paired recomputation, harm, cost, attacks, missing input, and atomic output. Write tests first.
      2. Validate commands, PIDs, times, GPU samples, token hashes, raw output hashes, exits, unloads, source hashes, and prompt hashes. Reject self-reported or stale receipts.
      3. Re-read source bytes and independently validate every span boundary, UTF-8 boundary, variable binding, relation, overlap rule, and source identity.
      4. Recompile every obligation in a clean process. Compare normalized bytes and hashes. Rerun Z3 or the executable checker and compare result, witness, counterexample, release, and abstention.
      5. Recompute held precision, coverage, false accepts, false rejects, unsafe releases, model and family effects, paired arm deltas, tokens, retries, solver calls, wall time, and censoring from rows only.
      6. Attack missing and duplicate cells, unequal arms, hidden retries, zero-headroom wins, model and family shortcuts, source mutation, relation smuggling, compiler nondeterminism, invalid release, and aggregate tampering.
      7. Set proof_carrying_extractor_audit_ready_score=1.0 only when raw provenance, span replay, compiler replay, exact replay, row closure, harm, cost, and attacks all close. Set proof_carrying_extractor_promotion_score=1.0 only when the independent reducer confirms every preregistered scientific gate.
      8. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, row lint, adversarial verification, independent exact-replay E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6570_proof_obligation_independent_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "An always-run audit needs a terminal state for clean, missing, invalid, and non-recomputable evidence."
        honest_verdict:
          principle: "The verdict separately states provenance, spans, compiler, exact release, harm, cost, and promotion."
        verdict_class:
          principle: "An independent audit cannot turn its own replay into positive science."
        input_existence_and_hash_receipts:
          principle: "The audit identifies every artifact, shard, raw response, compiler, checker, and reducer used."
        independent_live_provenance_rows:
          principle: "Model, process, GPU, token, output, exit, and unload receipts are independently validated."
        independent_source_span_rows:
          principle: "Each byte bound and typed binding is replayed against immutable source bytes."
        independent_compiler_and_exact_replay_rows:
          principle: "Clean-process compilation and exact checks reproduce obligations, witnesses, counterexamples, and actions."
        independent_paired_metric_rows:
          principle: "Coverage, precision, releases, abstentions, and deltas are recomputed by model and family."
        harmful_release_and_cost_audit:
          principle: "No promotion can hide one unsafe release or unrecomputable cost."
        shortcut_attack_matrix:
          principle: "Independent attacks cover cells, retries, leakage, mutation, compilers, releases, and aggregates."
        proof_carrying_extractor_audit_ready_score:
          principle: "One binary field gates the downstream learning study on usable audited evidence."
        proof_carrying_extractor_promotion_score:
          principle: "A separate field carries the independently confirmed scientific disposition."
        per_unit_rows:
          principle: "Every audit decision has row-level evidence."
        aggregate_row_recomputation:
          principle: "Audit readiness and promotion derive only from independent rows."
        gate_check_summary:
          principle: "A blocked audit names every missing or failed check and observed value."
        preconditions_checked:
          principle: "Input and tool receipts distinguish blocked audit work from null science."
        protected_files_unchanged:
          principle: "The audit must not repair upstream evidence or mutate protected files."
        inference_substrate:
          principle: "The audit replays checked-in evidence and performs no new GGUF generation."
        verifier_is_oracle:
          principle: "Independent executable replay is audit authority, so the audit class is non-positive."
        field_provenance:
          principle: "Each disposition points to immutable rows, hashes, commands, and reducers."
        random_seed:
          principle: "A fixed audit and attack order makes the result repeatable."
        duration_s:
          principle: "Monotonic time exposes skipped receipt or replay work."
        tests_run:
          principle: "Named tests and E2E commands prove independent checks ran."
        reproducibility_checksum:
          principle: "A final hash protects the audit trail."
      Set inference_substrate=independent_checked_in_raw_span_compiler_exact_release_and_cost_replay_no_new_llm and verifier_is_oracle=true. Use verdict_class=null for a clean audit, partial for incomplete but usable evidence, blocked for missing inputs, and disqualified for false provenance, invalid spans, nondeterministic compilation, or unsafe release.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6570_proof_obligation_independent_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.
