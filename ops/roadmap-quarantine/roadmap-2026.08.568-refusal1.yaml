milestone: "2026.08.568"
milestone_title: "Audited Promotion and Adaptive Continuous Learning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6561-v568-evidence-gate-contract
    milestone: "2026.08.568"
    deliverable: results/experiment_6561_v568_evidence_gate_contract.json
    title: "V568 evidence eligibility, exclusion, model, and gate contract"
    priority: critical
    track: infrastructure-governance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 90
    model: opus
    prompt: |
      CONTEXT
      V567 completed Exp6548 through Exp6560. It produced reusable production, memory, saturation, and ARC assets. It also produced blocked CSL, saturation-audit, and GateMate records. V568 needs one additive evidence contract before it extends any lane. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6548_v567_evidence_eligibility_contract.json through {project_root}/results/experiment_6560_v567_independent_capstone.json
      - {project_root}/research-complete.yaml, {project_root}/research-references.md, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/conductor-log.md
      - {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/conductor_gates.py, and {project_root}/scripts/roadmap_schema.py
      - {project_root}/_bmad/prd.md, {project_root}/_bmad/architecture.md, relevant capability specs, {project_root}/_bmad/traceability.md, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build the additive V568 evidence and gate contract. Import V567 artifacts only by immutable path and hash. Freeze every V568 gate field, prior-failure entry, model requirement, and hardware boundary.

      CONCRETE STEPS
      0. PRECONDITIONS: record git status, CPU, RAM, disk, Python, Rust, PyO3, Z3, artifact paths and hashes, protected-file hashes, architecture freshness, and network status. This task performs no LLM load and no hardware command.
      1. Add or confirm REQ-* and SCENARIO anchors for immutable evidence import, closed verdict classes, exact gate spelling, prior-failure completeness, model policy, hardware boundaries, and atomic terminal output. Write focused tests first.
      2. Run live adversarial verification and row-consistency checks on Exp6548 through Exp6560. Record one eligibility row per artifact, including verifier version, exit status, stamped flags, live flags, and reason.
      3. Mark Exp6557 as a conductor pre-gate block, not as a scientific audit. Mark Exp6553 and Exp6554 as blocked infrastructure evidence, not null science. Preserve the Exp6559 zero-command receipt.
      4. Freeze all V568 task IDs, deliverables, readiness fields, gates, required artifact fields, sample floors, MODEL_SPECS, sequential-load rule, ARC no-solve rule, and zero-command hardware rule.
      5. Confirm that each gate names a task in this roadmap and an identically spelled required field. Confirm that every scope-matched failed or retired task has all four prior-failure fields and that no `requires` chain uses a retired ID.
      6. Attack missing artifacts, hash aliases, aggregate-only claims, stamped-versus-live verifier disagreement, missing gate fields, legacy-model substitution, impossible VRAM thresholds, retired-scope reuse, and protected-file mutation.
      7. Set v568_evidence_contract_ready_score=1.0 only when the artifact, gate, prior-failure, model, hardware, and protected-file contracts all close. Set production_v567_evidence_ready_score=1.0 only when Exp6549 through Exp6551 remain eligible for a workload canary.
      8. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, exclusion-manifest lint, roadmap schema validation, row lint, adversarial verification, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6561_v568_evidence_gate_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state prevents a bootstrap record from posing as a completed evidence contract."
        honest_verdict:
          principle: "The verdict must state the eligible evidence boundary and use a terminal prefix."
        verdict_class:
          principle: "A closed class carries blocked, partial, null, and disqualified status into downstream aggregation."
        v567_artifact_eligibility_rows:
          principle: "One row per V567 artifact makes every import decision recheckable."
        v568_gate_contract_rows:
          principle: "Every downstream gate needs an in-roadmap task and an identically spelled upstream field."
        prior_failure_contract_rows:
          principle: "Each scope-matched failure needs experiment ID, verdict, changed method, and retirement signal."
        model_and_sequential_runtime_contract:
          principle: "The three mandated GGUF identities and actual-load rule must be frozen before outcomes exist."
        hardware_claim_boundary:
          principle: "The contract prevents unchanged GateMate commands and unauthenticated TSU claims."
        v568_evidence_contract_ready_score:
          principle: "One binary field gates tasks that need the complete V568 contract."
        production_v567_evidence_ready_score:
          principle: "The production canary needs a separate clean Exp6549-Exp6551 evidence gate."
        per_unit_rows:
          principle: "Artifact-level rows prevent one failed input from hiding inside an aggregate."
        aggregate_row_recomputation:
          principle: "Readiness fields must derive from emitted eligibility and contract rows."
        gate_check_summary:
          principle: "A blocked verdict must name the failed check and observed value."
        preconditions_checked:
          principle: "Resource and input receipts distinguish missing prerequisites from evidence failure."
        protected_files_unchanged:
          principle: "The task must not mutate research-roadmap.yaml or scripts/research_conductor.py."
        inference_substrate:
          principle: "The artifact must declare immutable evidence aggregation with no new LLM inference."
        verifier_is_oracle:
          principle: "Artifact validation is audit authority and not oracle-distinct science."
        field_provenance:
          principle: "Every headline field must identify source rows, hashes, and reducers."
        duration_s:
          principle: "Monotonic wall time exposes skipped verifier and contract checks."
        tests_run:
          principle: "Named commands and exit codes make contract validation reproducible."
        reproducibility_checksum:
          principle: "A final content hash detects mutation of the terminal record."
      Set inference_substrate=immutable_v567_artifact_gate_and_scope_audit_no_llm and verifier_is_oracle=true. A clean contract uses verdict_class=null, a usable subset uses partial, a missing input uses blocked, and false provenance uses disqualified.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6561_v568_evidence_gate_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6562-constraint-saturation-independent-audit-v2
    milestone: "2026.08.568"
    deliverable: results/experiment_6562_constraint_saturation_independent_audit_v2.json
    title: "Independent V567 constraint-saturation audit from checked-in rows"
    priority: critical
    track: infrastructure-audit
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6556-sota-constraint-saturation-intervention-ab
        verdict: "complete_sota_constraint_saturation_intervention_positive: phase curve, bounded exact fallback benefit beyond longer flat, zero harmful intervention, charged cost, and receipts close"
        addressed_by: "Exp6556 made the live comparative claim. This task performs no new generation and independently checks raw response provenance, model and GPU receipts, fixture proofs, exact clause and joint replay, pairing, harm, and charged cost from immutable rows."
        retire_if_same_verdict: true
      - experiment_id: exp6557-constraint-saturation-independent-audit
        verdict: "blocked_gate_check_failed"
        addressed_by: "Exp6557 never ran because the conductor rejected its missing prior-failure contract. This task includes complete prior-failure entries, has no structured gate, and audits the checked-in Exp6555 and Exp6556 evidence directly."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6556 reports a positive constraint-saturation intervention. Exp6557 did not audit it because the conductor blocked the task before execution. The V567 capstone names this independent replay as the safe next experiment. This task must run before any new model inference. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V568 roadmap document
      - {project_root}/results/experiment_6555_proof_preserving_constraint_saturation_fixture.json and {project_root}/results/fixtures/v567_constraint_saturation.jsonl
      - {project_root}/results/experiment_6556_sota_constraint_saturation_intervention_ab.json and {project_root}/results/checkpoints/experiment_6556_sota_constraint_saturation_intervention_ab.json
      - {project_root}/python/carnot/experiment_6555_proof_preserving_constraint_saturation_fixture.py and {project_root}/python/carnot/experiment_6556_sota_constraint_saturation_intervention_ab.py
      - exact fixture, clause, joint, response, model, GPU, token, cost, and reducer code plus their tests
      - {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/verdict_row_consistency_lint.py, relevant specs, exclusions, traceability, and E2E plan

      TASK
      Independently audit the V567 saturation claim from checked-in evidence. Perform no new LLM generation. Rule separately on fixture validity, live model provenance, exact results, phase curves, paired interventions, harm, and cost.

      CONCRETE STEPS
      0. PRECONDITIONS: record input existence, paths and hashes, raw-response and checkpoint paths, model-file hashes without loading weights, checker hashes, Python and Z3 versions, CPU, RAM, disk, audit seed, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for independent fixture proof, live-receipt validation, clause replay, joint replay, paired recomputation, harm, charged cost, missing inputs, and atomic output. Write tests first.
      2. Replay every equivalent and hardened fixture row against the source exact solver. Confirm constraint count, clause identity, interaction, surface, lineage, and intended proof relation.
      3. Validate each model file hash, process command, PID, start and end time, GPU sample, token count, response hash, exit status, and raw response. A loader smoke flag or self-reported process ID is not enough. Reject synthetic response text, constant fake GPU samples, stale outputs, and impossible timing.
      4. Replay every clause and joint result. Confirm that every decomposition preserves every clause and that every released result passed the exact joint checker.
      5. Recompute per-model and pooled phase curves, matched flat-versus-long-flat effects, decomposition and fallback effects, recoveries, regressions, harmful interventions, tokens, solver calls, retries, wall time, timeouts, and censoring from rows only.
      6. Attack missing and duplicate rows, unequal cells, hidden retries, zero-headroom wins, aggregate tampering, post-held thresholds, model identity shortcuts, invalid releases, and circular exact authority.
      7. Set constraint_saturation_independent_audit_ready_score=1.0 only when fixture, live provenance, row closure, exact replay, pairing, harm, cost, and verdict recomputation all pass. Set constraint_saturation_policy_audited_score=1.0 only when the independent audit confirms the bounded policy claim.
      8. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, row lint, adversarial verification, exact-replay E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6562_constraint_saturation_independent_audit_v2.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "An always-run audit needs a terminal state for clean, missing, invalid, and non-recomputable evidence."
        honest_verdict:
          principle: "The verdict must state fixture, live provenance, exact replay, harm, cost, and policy dispositions with a terminal prefix."
        verdict_class:
          principle: "A closed class prevents an audit record from becoming unbounded positive science."
        input_existence_and_hash_receipts:
          principle: "The audit must identify the exact artifacts, checkpoints, raw responses, and checkers it used."
        independent_fixture_proof_rows:
          principle: "The model comparison is ineligible if the proof-preserving variants do not replay."
        independent_live_provenance_rows:
          principle: "Commands, PIDs, GPU samples, tokens, and response hashes must prove actual flagship inference."
        independent_clause_and_joint_replay_rows:
          principle: "Every credited success and release needs a separate executable replay."
        independent_phase_curve_rows:
          principle: "Constraint-load collapse must be recomputed by model, count, type, interaction, and surface."
        independent_paired_intervention_rows:
          principle: "Every claimed benefit needs matched rows against flat and longer-flat controls."
        harmful_intervention_and_release_audit:
          principle: "No aggregate gain can hide regressions or one invalid release."
        charged_cost_audit:
          principle: "Tokens, retries, solver calls, and time must recompute from raw receipts."
        constraint_saturation_independent_audit_ready_score:
          principle: "One binary field states whether the V567 saturation evidence is independently usable."
        constraint_saturation_policy_audited_score:
          principle: "A separate field distinguishes clean null evidence from a confirmed promotable policy."
        per_unit_rows:
          principle: "Every audit conclusion needs unit-level recomputation rows."
        aggregate_row_recomputation:
          principle: "The audit verdict must derive only from independent rows."
        gate_check_summary:
          principle: "A blocked audit must name every missing or failed check and observed value."
        preconditions_checked:
          principle: "Input and replay receipts distinguish blocked audit work from null science."
        protected_files_unchanged:
          principle: "The audit must not repair upstream evidence or mutate protected orchestration files."
        inference_substrate:
          principle: "The audit replays stored evidence and performs no new GGUF generation."
        verifier_is_oracle:
          principle: "Independent executable replay is audit authority, so a clean audit uses a non-positive class."
        field_provenance:
          principle: "Each disposition must point to immutable rows, receipts, and reducers."
        random_seed:
          principle: "A fixed audit order makes attacks and samples repeatable."
        duration_s:
          principle: "Monotonic time exposes an audit that skipped receipt or replay work."
        tests_run:
          principle: "Named tests and E2E commands show independent checks executed."
        reproducibility_checksum:
          principle: "A final hash protects the independent determination trail."
      Set inference_substrate=independent_checked_in_sota_receipt_and_exact_constraint_replay_no_new_llm and verifier_is_oracle=true. Use verdict_class=null for a clean audit, partial for incomplete but usable evidence, blocked for missing inputs, or disqualified for false provenance, invalid variants, missing clauses, or non-recomputable claims.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6562_constraint_saturation_independent_audit_v2 --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6563-production-safety-net-workload-canary
    milestone: "2026.08.568"
    deliverable: results/experiment_6563_production_safety_net_workload_canary.json
    title: "Production Safety-Net canary on measured verification workloads"
    priority: critical
    track: production-integration
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6551-production-safety-net-independent-audit
        verdict: "complete_production_safety_net_independent_audit_null: null disposition; independent rows prove disabled identity, enabled exact equality, Python/Rust parity, fallback, immutability, and rollback"
        addressed_by: "Exp6551 established structural safety but used experiment-local costs and reached a null scientific disposition. This task uses current production-shaped workloads and direct wall-time, checker-call, serialization, persistence, fallback, and rollback receipts."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6561-v568-evidence-gate-contract
        artifact_field: production_v567_evidence_ready_score
        op: "=="
        value: 1.0
        principle: "The real workload canary may use the adapter only after the clean production evidence gate passes."
    prompt: |
      CONTEXT
      V567 proved that the default-off Safety-Net adapter preserves exact behavior and rollback. It did not prove a benefit on current production-shaped workloads. V568 must replace synthetic adapter cost units with measured work before it considers a default flip. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/_bmad/prd.md, {project_root}/_bmad/architecture.md, and the V568 roadmap document
      - {project_root}/results/experiment_6561_v568_evidence_gate_contract.json
      - {project_root}/results/experiment_6549_production_safety_net_adapter.json, {project_root}/results/experiment_6550_rust_pyo3_safety_net_parity.json, and {project_root}/results/experiment_6551_production_safety_net_independent_audit.json
      - {project_root}/python/carnot/pipeline/production_safety_net_adapter.py, {project_root}/python/carnot/pipeline/safety_net_abi.py, and {project_root}/python/carnot/pipeline/verify_repair.py
      - current pipeline regression fixtures, workload manifests, exact verifier code, relevant tests, specs, traceability, exclusions, status, changelog, and E2E plan

      TASK
      Run a native, disabled-adapter, enabled-adapter, forced-abstain, forced-fallback, and rollback canary on production-shaped verification workloads. Measure actual work and exact outputs.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate the structured gate and record expected and observed values, upstream path and hash, fixture hashes, Python and Z3 versions, CPU, RAM, disk, process isolation, timer resolution, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for real-workload identity, measured cost, candidate preservation, abstention, fallback, persistence, restart, rollback, and atomic output. Write tests first.
      2. Freeze a family-blind production workload matrix before execution. Include normal, empty, malformed, unsupported, fallback-heavy, exception, restart, and rollback strata. Use current checked-in fixtures only.
      3. Compare native, disabled, enabled, forced-abstain, forced-fallback, and rollback conditions with identical requests, candidate order, warm-up, seeds, process placement, and exact checks.
      4. Record request bytes, route, abstention, candidate set and order, exact result, checker calls, serialization bytes, persistence bytes, process time, monotonic wall time, fallback reason, and rollback state for every unit.
      5. Exclude synthetic adapter cost units from the headline. Report them only as a diagnostic. Use direct receipts for work and latency claims.
      6. Attack outcome leakage, model or family identity, source IDs, entity names, row order, exception writes, candidate deletion, hidden retries, unreachable fallback, timer bias, cache imbalance, and rollback drift.
      7. Set production_workload_canary_ready_score=1.0 only when disabled identity, exact equality, candidate preservation, fallback, restart, and rollback all pass with complete rows. Set production_workload_promotion_candidate_score=1.0 only when enabled routing improves preregistered measured work or latency without a safety, tail-latency, or invalid-release regression.
      8. Write one terminal artifact atomically. Run focused tests with full new-module coverage, lint, spec coverage, row lint, gate audit, adversarial verification, pipeline E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6563_production_safety_net_workload_canary.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state distinguishes a measured workload canary from setup-only adapter work."
        honest_verdict:
          principle: "The verdict must state identity, exact equality, measured benefit, fallback, and rollback with a terminal prefix."
        verdict_class:
          principle: "A closed class prevents incomplete or unsafe workload evidence from becoming positive."
        upstream_gate_receipt:
          principle: "The canary must identify the eligible V567 production evidence that authorized execution."
        frozen_workload_and_timing_contract:
          principle: "Workloads, warm-up, pairing, timers, and thresholds must be fixed before outcomes exist."
        per_unit_rows:
          principle: "Every workload, seed, and adapter condition needs request, decision, exact, and cost metrics."
        disabled_identity_rows:
          principle: "Native-versus-disabled bytes expose any supposedly inert behavior change."
        enabled_route_and_fallback_rows:
          principle: "Every route, abstention, exception, and fallback must remain visible."
        exact_output_and_candidate_receipt:
          principle: "Promotion requires exact accepted outputs and complete candidate preservation."
        measured_work_and_latency_rows:
          principle: "Direct checker, serialization, persistence, process, and wall-time receipts replace synthetic units."
        restart_and_rollback_receipts:
          principle: "A production route needs exact recovery after process and configuration changes."
        shortcut_attack_matrix:
          principle: "Identity, leakage, retry, timing, and fallback attacks test the actual production boundary."
        production_workload_canary_ready_score:
          principle: "One binary field states whether the canary is complete and safe."
        production_workload_promotion_candidate_score:
          principle: "A separate score gates default promotion on measured benefit and safety."
        aggregate_row_recomputation:
          principle: "Every headline must derive from emitted workload rows."
        gate_check_summary:
          principle: "A blocked run must name the failed upstream, workload, timer, or runtime check and value."
        preconditions_checked:
          principle: "Resource and fixture receipts separate blocked execution from null production value."
        protected_files_unchanged:
          principle: "The canary must preserve active orchestration files."
        inference_substrate:
          principle: "The artifact must declare production pipeline and exact verification with no LLM inference."
        verifier_is_oracle:
          principle: "The learned route is not authority; the native exact verifier remains separate."
        field_provenance:
          principle: "Each benefit and safety field must point to raw workload rows and reducers."
        random_seed:
          principle: "Fixed order and tie seeds make the paired canary repeatable."
        duration_s:
          principle: "Monotonic wall time exposes omitted workload or rollback work."
        tests_run:
          principle: "Named unit and E2E receipts prove the production path executed."
        reproducibility_checksum:
          principle: "A final hash detects mutation after the verdict."
      Set inference_substrate=production_verify_repair_workload_canary_exact_verifier_no_llm and verifier_is_oracle=false. Use verdict_class=positive only for a measured enabled-path benefit with exact identity and safety; use null for no benefit, partial for narrow support, blocked for failed prerequisites, or disqualified for leakage or changed accepted outputs.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6563_production_safety_net_workload_canary --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6564-rust-pyo3-safety-net-nfr01
    milestone: "2026.08.568"
    deliverable: results/experiment_6564_rust_pyo3_safety_net_nfr01.json
    title: "Rust/PyO3 Safety-Net batched hot-path NFR01 benchmark"
    priority: critical
    track: cross-language-core
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6563-production-safety-net-workload-canary
        artifact_field: production_workload_canary_ready_score
        op: "=="
        value: 1.0
        principle: "NFR01 must benchmark the exact workload contract that already passed the production canary."
    prompt: |
      CONTEXT
      Exp6550 proved Python and Rust/PyO3 decision parity. The PRD also requires the Rust hot path to reach at least ten-times Python throughput. V568 needs a direct scalar and batched benchmark on the workload contract frozen by Exp6563. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/_bmad/prd.md, {project_root}/_bmad/architecture.md, and the V568 roadmap document
      - {project_root}/results/experiment_6563_production_safety_net_workload_canary.json
      - {project_root}/results/experiment_6550_rust_pyo3_safety_net_parity.json and {project_root}/python/carnot/pipeline/safety_net_abi.py
      - {project_root}/crates/carnot-python/src/safety_net.rs, {project_root}/crates/carnot-python/src/lib.rs, Cargo manifests, PyO3 build files, and parity tests
      - current benchmark utilities, relevant specs, traceability, exclusions, status, changelog, and E2E plan

      TASK
      Implement the smallest batched Rust/PyO3 Safety-Net decision API if needed. Benchmark pure Python scalar, PyO3 scalar, and PyO3 batch paths with identical request bytes and exact decision parity.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate the structured gate and record its receipt, CPU model and governor, core placement, RAM, Rust and cargo versions, compiler flags, extension hash, Python version, timer resolution, thermal state, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for versioned batch ABI, scalar parity, batch parity, errors, warm-up, allocation accounting, NFR01, tail latency, and rollback. Write Rust and Python tests first.
      2. Add only the batch boundary required to amortize PyO3 and JSON overhead. Preserve the V567 scalar ABI and error semantics. Do not move Z3, LLM inference, or natural-language extraction into Rust.
      3. Freeze identical request bytes for Python scalar, PyO3 scalar, and PyO3 batch. Cover supported, abstain, fallback, exception, malformed, and unsupported conditions.
      4. Run release builds with fixed core placement, warm-up, repeated blocks, multiple batch sizes, and randomized condition order. Record operations, bytes, allocations, process time, wall time, p50, p95, p99, and errors per unit.
      5. Confirm byte-identical decisions, ordering, error class, fallback reason, and exact downstream result for every request. Charge batch construction, serialization, copies, and Python conversion.
      6. Attack compiler or debug mismatch, hidden preprocessing, unequal request counts, discarded errors, warm-cache bias, timer granularity, one-outlier medians, uncharged batch assembly, and aggregate-only speedups.
      7. Set rust_pyo3_nfr01_ready_score=1.0 only when steady-state median batched throughput is at least 10.0 times pure Python scalar on the preregistered workload, every decision is exact, p99 is within the frozen bound, and no work is omitted. A parity-only result is null, not positive.
      8. Write one terminal artifact atomically. Run cargo tests, focused Python tests, lint, spec coverage, row lint, gate audit, adversarial verification, PyO3 import and pipeline E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6564_rust_pyo3_safety_net_nfr01.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state distinguishes a completed release benchmark from a build-only artifact."
        honest_verdict:
          principle: "The verdict must state parity, throughput, tail latency, and NFR01 with a terminal prefix."
        verdict_class:
          principle: "A closed class prevents parity-only or biased timing evidence from becoming positive."
        upstream_gate_receipt:
          principle: "The benchmark must identify the exact production workload contract it measures."
        abi_schema_and_build_receipts:
          principle: "Version, compiler, extension, and release hashes make the measured Rust path identifiable."
        frozen_benchmark_contract:
          principle: "Requests, batch sizes, warm-up, repetitions, affinity, and thresholds must precede timing."
        per_unit_rows:
          principle: "Every implementation, block, batch size, and condition needs parity and timing metrics."
        scalar_and_batch_parity_rows:
          principle: "Speed is ineligible unless request, decision, error, order, and fallback bytes match."
        throughput_and_latency_rows:
          principle: "Operations, p50, p95, p99, and wall time expose throughput-tail tradeoffs."
        allocation_and_copy_rows:
