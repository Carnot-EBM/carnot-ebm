    5. Ingest the V641 reference refresh. Recheck at most four selected primary URLs with 20-second limits and record implement/adapt/defer dispositions for source freshness, fixed-budget hypothesis mixtures, SQLite journals, and deferred KAN/TSU work. Preserve publication/version dates, access failures and retired overlap. A failed fetch is a source observation, not an unrelated science blocker.
    6. Run schema, prior-failure, exclusion, prompt-path and gate-field checks. For every real gate invoke scripts.conductor_gates.evaluate_gates on isolated temporary passing, false, missing-field, missing-file and quarantined inputs. Also prove contract count, ID, deliverable and gate-field mutations fail. Reuse shipped validators; do not clone a large historical experiment module.
