    CONTEXT:
    V640 completed its execution roster, but Exp7274 disqualified the stale V636 design. The planner now supplies a rewritten V641 document and fourteen-task YAML. Authenticate both independently. This advisory task gates no science. Ingest the dated literature refresh and preserve the distinction between external claims and local evidence.

    Work at {project_root}. Execution date {date}. Milestone 2026.09.641, phase 1.

