    8. Run focused pytest for the new test file and explicitly affected suites, scoped 100% coverage, Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on those exact tests. Use -n 0, -o addopts= or --no-cov for noncoverage runs, with a private --basetemp; never bare pytest or repository-wide inherited helpers. Independently reduce raw rows. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py on the measured terminal candidate under results/raw/; preserve failures. Atomically write the declared terminal artifact only after actual validation. Reconcile the driving OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve historical tests/results; no weakening tests, publication, upload, submission, external messages, production-default changes or edits to research-roadmap.yaml.

    9. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Version the artifact; retain ordinary top-level experiment_id and milestone."
       - status: principle: "Use a terminal complete or blocked record; unfinished own work belongs in separate checkpoints."
       - run_date: principle: "Use {date}, real UTC start/end and monotonic timing."
       - field_principles: principle: "Store explanations here while consumer values remain ordinary top-level values."
       - preconditions_checked: principle: "Hash actual inputs, authority boundaries, resource ownership and failed checks."
       - MODEL_SPECS: principle: "Actual executable local model identities; keep historical models in hashed sidecars."
       - model_invoked: principle: "True for any actual attempted model load or generation, including failed and unusable work."
       - invocation_counts: principle: "Separate attempted/completed/failed loads and generation; retain in-flight events on timeout."
       - inference_substrate: principle: "Use the recognized literal for actual computation; never infer from intended task."
       - inference_substrate_class: principle: "Full generation60s, bounded10s, load-only2s, or actual no-LLM class; never pad elapsed time."
       - execution_venue: principle: "Host is host; identify actual GPU/native/device execution separately."
       - duration_s: principle: "Measured monotonic elapsed and disjoint phase spans, including failures and initialization."
       - random_seed: principle: "Freeze development and independent evaluation seeds before observing outcomes."
       - reproducibility_checksum: principle: "Bind code, config, inputs, model identity if any and immutable raw evidence."
       - source_artifact_hashes: principle: "Keep exact producer identities, terminal classes, retirement and quarantine state."
       - rows: principle: "Every comparative unit/arm/seed with metric, cost, error, abstention and censoring; no aggregate-only claim."
       - sample_size_budget: principle: "Planned, attempted, complete and censored units plus the frozen stopping rule."
       - acceptance_gate_results: principle: "Each completeness/value check names expected, observed, passed and principle."
       - gate_check_summary: principle: "Every blocked_* verdict names upstream/check, exact field, observed and expected value."
       - verifier_is_oracle: principle: "Expose shared verifier/evaluator authority; same-authority mechanics are not learned correctness."
       - honest_verdict: principle: "Complete findings start complete_ or complete:; external absence starts blocked_; state the actual finding."
       - verdict_class: principle: "Exactly positive | circular_positive | null | blocked | disqualified | partial. Oracle=true forbids positive; failed efficacy gates forbid positive. Only own unfinished work is partial; unchanged external failure is terminal blocked."
       - validation_receipts: principle: "Command, exit code, elapsed time and log hash; preserve actual failures."
       - contract_complete_score: principle: "One only for an independently matched, valid fourteen-row contract; advisory only."
       - contract_rows: principle: "Literal ordered IDs, titles, phases, deliverables and structured gates from both files."
       - source_dispositions: principle: "Primary URL, version/date, observed access, adapted mechanism, falsifier and deferred boundary."
       - gate_control_rows: principle: "All five independent control outcomes per actual gate, including exact diagnostic values."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7288_v641_source_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
