    Produce results/experiment_7288_v641_source_contract.json. Create scripts/experiments/experiment_7288_v641_source_contract.py as a thin entrypoint and tests/python/test_experiment_7288_v641_source_contract.py for meaningful new behavior. Reuse existing modules; add python/carnot/experiment_7288_v641_source_contract.py only when reusable implementation is needed. Same-milestone dependencies are the declared upstream deliverables below, created by earlier tasks. External absent, quarantined or retired prerequisites are terminal blocked with gate_check_summary; partial is reserved for this task's own unfinished work.

    CONCRETE STEPS:
    1. Print and flush immediately. Authenticate inputs and declared output paths. Ensure the driving capability has REQ-*; write the specific requirement and meaningful failing tests before implementation. Reuse shipped modules and thin entrypoints. New experiment paths under TASK and same-milestone inputs are future outputs, not existing prerequisites. Put scratch work in /tmp, checkpoints in results/checkpoints/ and raw evidence in results/raw/. Never write a success-shaped placeholder.
    2. Print a flushed progress line at EVERY phase boundary and BEFORE AND AFTER each model load, generation, benchmark and subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed at least every 60 seconds. Stream unbuffered child output; for blocking calls run a truthful heartbeat reporting the outstanding call and elapsed time at most every 60 seconds, including authoring and tests. Keep EVERY gap below 600 seconds: silence can kill at1200s, while continued progress permits the4800s hard cap. Bound work as well as silence; never sleep to meet a duration floor.
