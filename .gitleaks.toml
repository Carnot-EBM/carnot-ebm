# gitleaks configuration for the Carnot project.
#
# Why this file exists:
#   A full `gitleaks detect` run across the 2542-commit history produced 3
#   findings, all in tests/python/test_ebm_cot_calibrator_v3.py and all
#   traceable to JAX PRNG key handling — specifically the pattern
#   `key_before = v3_calibrator._key` and `key_after = v3_calibrator._key`.
#   Gitleaks' `generic-api-key` rule matches on `key_` + high-entropy RHS;
#   JAX PRNG keys (`jnp.ndarray` of uint32) have enough entropy in their
#   repr to trigger the rule, but they are not secrets — they're
#   deterministic pseudo-random state.
#
#   Rather than rewrite test code to avoid the English word "key" (which
#   would make the JAX PRNG API impossible to exercise), we narrowly
#   allowlist the file where JAX PRNG tests live.
#
# Extending this file:
#   When gitleaks finds a real secret, DO NOT allowlist it here — rotate
#   the secret, purge it from history (git filter-repo / BFG), and push
#   the rewritten history.  Allowlists here are ONLY for verified false
#   positives.

# Extend the default ruleset (do not replace) so every standard rule
# (AWS, GitHub, Stripe, private keys, etc.) stays active.
[extend]
useDefault = true

# Global allowlist applied to every rule.
[[allowlists]]
description = "JAX PRNG key handling in EBM CoT calibrator tests"
# Commit + file + rule + line fingerprints from the 2026-04-23 full-history
# scan.  These reference JAX `jnp.ndarray` PRNG state, not API credentials.
stopwords = []
paths = [
    '''tests/python/test_ebm_cot_calibrator_v[0-9]+\.py''',
]
# Tighter scoping: only the generic-api-key rule is exempted for this
# file, so if a real `AKIA...` or `ghp_...` ever lands here, it still
# trips.
targetRules = ["generic-api-key"]

# RETRO label "RETRO-HF-SOPS-CREDENTIAL-INJECTION" — gitleaks'
# generic-api-key rule fires on the literal string because the
# CREDENTIAL keyword + uppercase-with-dashes shape passes the rule's
# heuristics. The label tracks Exp 933's work to wire SOPS-encrypted
# HF_TOKEN injection into the conductor commit pipeline; the string
# itself is metadata, not a secret.
#
# Tightly scoped to the generic-api-key rule and to the file paths
# where this RETRO label legitimately appears, so a real HF token
# (`hf_` + alphanumeric) still trips its dedicated rule and any
# other generic-api-key match outside these paths still fires.
[[allowlists]]
description = "RETRO-HF-SOPS-CREDENTIAL-INJECTION label is not a credential"
stopwords = []
regexes = ['''RETRO-HF-SOPS-CREDENTIAL-INJECTION''']
paths = [
    '''ops/known-issues\.md''',
    '''results/operational_retro_2026_04_.*\.json''',
    '''results/experiment_.*_preflight_.*\.json''',
    '''results/experiment_.*_milestone_retro.*\.json''',
]
targetRules = ["generic-api-key"]
