hydra:
  run:
    dir: /home/ianblenke/github.com/ianblenke/carnot/results/trm_runs/curve_run_hydra
  sweep:
    dir: ${paths.log_dir}/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${task_name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/home/ianblenke/github.com/ianblenke/carnot/results/trm_runs/curve_run_hydra
    - hydra.mode=RUN
    task:
    - experiment=trm_sudoku_extreme_1k_aug_1k
    - logger=csv
    - save_dir=null
    - append_wandb_name_to_save_dir=false
    - seed=4108
    - data.data_dir=./data/sudoku_extreme_1k_aug_1k
    - ckpt_path=/home/ianblenke/github.com/ianblenke/carnot/results/trm_runs/sudoku_extreme_baseline/last-v1.ckpt
    - +trainer.max_time=00:12:00:00
    - callbacks.model_checkpoint.dirpath=/home/ianblenke/github.com/ianblenke/carnot/results/trm_runs/curve_run
    - callbacks.model_checkpoint.save_last=true
    - callbacks.model_checkpoint.save_top_k=1
    - callbacks.model_checkpoint.monitor=val/exact_accuracy
    - callbacks.model_checkpoint.mode=max
    - callbacks.model_checkpoint.auto_insert_metric_name=false
  job:
    name: train
    chdir: null
    override_dirname: +trainer.max_time=00:12:00:00,append_wandb_name_to_save_dir=false,callbacks.model_checkpoint.auto_insert_metric_name=false,callbacks.model_checkpoint.dirpath=/home/ianblenke/github.com/ianblenke/carnot/results/trm_runs/curve_run,callbacks.model_checkpoint.mode=max,callbacks.model_checkpoint.monitor=val/exact_accuracy,callbacks.model_checkpoint.save_last=true,callbacks.model_checkpoint.save_top_k=1,ckpt_path=/home/ianblenke/github.com/ianblenke/carnot/results/trm_runs/sudoku_extreme_baseline/last-v1.ckpt,data.data_dir=./data/sudoku_extreme_1k_aug_1k,experiment=trm_sudoku_extreme_1k_aug_1k,logger=csv,save_dir=null,seed=4108
    id: ???
    num: ???
    config_name: train.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/ianblenke/github.com/ianblenke/carnot/nano-trm
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ianblenke/github.com/ianblenke/carnot/nano-trm/src/nn/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ianblenke/github.com/ianblenke/carnot/results/trm_runs/curve_run_hydra
    choices:
      debug: null
      local: default
      experiment: trm_sudoku_extreme_1k_aug_1k
      hydra: default
      extras: default
      paths: default
      trainer: gpu
      logger: csv
      callbacks: default
      model: trm
      data: sudoku_extreme_1k_aug1k
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
