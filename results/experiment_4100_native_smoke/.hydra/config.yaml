task_name: train
tags:
- trm
- sudoku
- 4x4
ckpt_path: null
save_dir: null
seed: 4100
sweep_mode: false
append_wandb_name_to_save_dir: false
timekeeping:
  max_epochs: 26
  batch_size: 4
  num_workers: 0
data:
  _target_: src.nn.data.SudokuDataModule
  _recursive_: false
  batch_size: ${timekeeping.batch_size}
  num_workers: ${timekeeping.num_workers}
  num_train_puzzles: 32
  num_val_puzzles: 8
  num_test_puzzles: 0
  grid_size: 4
  max_grid_size: 4
  min_givens: null
  max_givens: null
  seed: 42
  data_dir: null
  pad_value: 0
model:
  _target_: src.nn.models.trm.TRMModule
  _recursive_: false
  ffn_expansion: ${model_tuning.ffn_expansion}
  hidden_size: ${model_tuning.hidden_size}
  num_layers: ${model_tuning.num_layers}
  N_supervision: ${model_tuning.N_supervision}
  N_supervision_val: ${model_tuning.N_supervision_val}
  learning_rate: ${model_tuning.learning_rate}
  H_cycles: ${model_tuning.H_cycles}
  L_cycles: ${model_tuning.L_cycles}
  learning_rate_emb: ${model_tuning.learning_rate_emb}
  weight_decay: ${model_tuning.weight_decay}
  halt_exploration_prob: ${model_tuning.halt_exploration_prob}
  warmup_steps: ${model_tuning.warmup_steps}
  num_heads: ${model_tuning.num_heads}
  puzzle_emb_dim: ${model_tuning.puzzle_emb_dim}
  puzzle_emb_len: ${model_tuning.puzzle_emb_len}
  rope_theta: ${model_tuning.rope_theta}
  pos_emb_type: ${model_tuning.pos_emb_type}
  lr_min_ratio: ${model_tuning.lr_min_ratio}
  use_mlp_t: ${model_tuning.use_mlp_t}
  use_conv_swiglu: ${model_tuning.use_conv_swiglu}
  use_board_swiglu: ${model_tuning.use_board_swiglu}
  use_muon: ${model_tuning.use_muon}
  output_dir: None
  num_puzzles: 0
  batch_size: 0
  pad_value: 0
  max_grid_size: 0
  vocab_size: 0
  seq_len: 0
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: /home/ianblenke/github.com/ianblenke/carnot/results/experiment_4100_native_smoke/checkpoints
    filename: smoke_step
    monitor: null
    verbose: false
    save_last: true
    save_top_k: -1
    mode: max
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: 50
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: null
  ema:
    _target_: src.nn.callbacks.ema.EMACallback
    decay: 0.999
    use_ema_for_validation: true
    use_ema_for_test: true
  exp4100_progress:
    _target_: carnot.agentic.arc_exp4100_trm_verifier_rft_conditional.NanoTrmProgressPrinter
    every_n_steps: 1
logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv/
    prefix: ''
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  min_epochs: 1
  max_epochs: 26
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 10
  deterministic: false
  precision: 32
  max_steps: 200
  num_sanity_val_steps: 0
  limit_val_batches: 1
  log_every_n_steps: 1
paths:
  log_dir: .
  output_dir: ${hydra:runtime.output_dir}
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
model_tuning:
  learning_rate: 0.0001
  learning_rate_emb: 0.0001
  warmup_steps: 2000
  weight_decay: 1.0
  lr_min_ratio: 0.01
  num_heads: 4
  halt_exploration_prob: 0.1
  N_supervision: 1
  N_supervision_val: 1
  H_cycles: 1
  L_cycles: 1
  num_layers: 1
  puzzle_emb_dim: 0
  puzzle_emb_len: 0
  hidden_size: 64
  ffn_expansion: 2
  rope_theta: 10000
  pos_emb_type: null
  use_mlp_t: true
  use_conv_swiglu: false
  use_board_swiglu: false
  use_muon: false
