    8. Run focused pytest for new behavior and explicitly affected suites with worktree PYTHONPATH, -n 0, -o addopts=, --no-cov, and a private --basetemp. Separately run 100% coverage on changed modules, scoped Ruff check/format, changed-module mypy, and scripts/check_spec_coverage.py on those exact tests. For a read-only reducer reuse relevant existing tests; do not invent implementation-mirroring tests. Do not invoke historical full-suite validation helpers. Preserve known repository-wide failures in repository_health with original log hashes; this does not waive a failing affected test. Run the task's stated E2E. Validate the measured terminal candidate with scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict; retain failures. Atomically write the declared terminal result. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md, and ops/changelog.md. No publication, upload, submission, external messages, production-default changes, or changes to research-roadmap.yaml.

    9. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Version the record while keeping ordinary top-level experiment_id and milestone."
       - status: principle: "Write the terminal result only after the work and checks; checkpoints remain separate."
       - run_date: principle: "Use {date} with actual UTC start/end and monotonic phase timing."
       - preconditions_checked: principle: "Hash real inputs and record actual availability and failed checks."
       - MODEL_SPECS: principle: "Actual current executable model identities; historical identities remain in sidecars."
       - model_invoked: principle: "True for any attempted model load or generation, even when output is unusable."
       - invocation_counts: principle: "Separate attempted, completed, failed, cancelled, and in-flight loads and generations."
       - inference_substrate: principle: "Describe actual computation with a recognized literal, not intended work."
       - inference_substrate_class: principle: "Full generation has a 60s floor; bounded generation 10s; load-only 2s. Never pad time."
       - execution_venue: principle: "Record actual host/device work; a CPU replay is not GPU or FPGA execution."
       - duration_s: principle: "Measure total elapsed and disjoint phase spans including failed work."
       - random_seed: principle: "Seal development and independent evaluation seeds before seeing outcomes."
       - reproducibility_checksum: principle: "Bind code, inputs, config, model when used, and raw evidence."
       - source_artifact_hashes: principle: "Authenticate producer identity, terminal class, and quarantine state."
       - rows: principle: "Record every comparative unit/arm with metrics, costs, errors, abstentions, and censoring."
       - sample_size_budget: principle: "Keep planned, attempted, complete, and censored counts with the frozen stopping rule."
       - acceptance_gate_results: principle: "Every check has expected, observed, passed, and a one-line principle explaining its purpose."
       - gate_check_summary: principle: "Every blocked_* names upstream/check, exact field, observed value, and expected value."
       - verifier_is_oracle: principle: "Shared evaluator authority permits circular_positive only, not positive scientific value."
       - honest_verdict: principle: "Completed findings start complete_ or complete:; external failure starts blocked_. State the finding."
       - verdict_class: principle: "Exactly positive | circular_positive | null | blocked | disqualified | partial. Only unfinished own work is partial; unchanged external failure is blocked."
       - validation_receipts: principle: "Record exact commands, scope, exit codes, elapsed time, and log hashes; retain failures."
       - contract_complete_score: principle: "One only for the literal fourteen-row contract and all metadata checks; advisory."
       - contract_rows: principle: "Exact ordered values from both authorities allow independent comparison."
       - source_dispositions: principle: "URLs, version dates, access outcomes, adaptations, and falsifiers distinguish evidence from hypotheses."
       - gate_control_rows: principle: "All five input conditions per gate expose broken producer/consumer contracts."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7302_v642_source_contract.py --date {date}
