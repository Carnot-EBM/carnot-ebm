    Produce results/experiment_7302_v642_source_contract.json. Create scripts/experiments/experiment_7302_v642_source_contract.py as the thin entrypoint. Add reusable behavior under python/carnot/experiment_7302_v642_source_contract.py only when needed. Tests for new behavior belong in tests/python/test_experiment_7302_v642_source_contract.py.
    SAME-MILESTONE INPUTS (future outputs of earlier tasks):
    None. Historical files are authenticated evidence, not same-milestone pre-gates.
    Reject missing, quarantined, or disqualified dependencies even if a numeric field is one. External failure is terminal blocked. Preserve the exact check in gate_check_summary.

    CONCRETE STEPS:
    1. Print and flush immediately. Authenticate inputs and output paths. Before implementation, ensure the named capability contains the specific REQ-* and SCENARIO-*; write meaningful failing tests first. Reuse shipped code with thin entrypoints. Put scratch files in /tmp, raw data in results/raw/, and checkpoints in results/checkpoints/. Never emit a success-shaped placeholder.
    2. Print a flushed progress line at EVERY phase boundary and BEFORE AND AFTER each model load, generation, benchmark, or subprocess that can take minutes. Inside long loops emit completed units and monotonic elapsed at least every 60 seconds. Stream unbuffered child output. For blocking calls emit a truthful outstanding-call heartbeat every 60 seconds. Keep EVERY silence gap below 600 seconds, including authoring and tests. Silence can end a task at 1200 seconds; progress permits the 4800-second hard cap. Bound the work as well as silence. Never sleep to meet a duration floor.
    3. No current LLM work: MODEL_SPECS=[], model_invoked=false, and zero current load/generation counters. inference_substrate=aggregation_from_upstream_artifacts; inference_substrate_class=aggregation; execution_venue=host. Keep all historical and injected invocation payloads in hash-bound sidecars. If implementation adds actual computation, declare that actual substrate; do not call a model for a receipt.
    4. Select the staged YAML only when its milestone is 2026.09.642; after activation select the active YAML with that milestone. Parse the Markdown contract independently. Require exactly 14 ordered tasks, exp7302 through exp7315, with identical IDs, titles, phases, deliverables, and gates. Hash original bytes. Do not activate, archive, or alter either roster.
    5. Run the existing schema, prior-failure, exclusion, prompt-path, and gate audits on the selected file. Mutation-check count, order, ID, output path, and gate field using temporary copies. Exercise the actual conductor gate reader with passing, false, absent-file, absent-field, and quarantined fixtures. Fixture details belong in sidecars; this task has zero current model calls.
    6. Ingest the V642 source table with implement/adapt/defer decisions. Recheck at most four primary URLs with 20-second request limits and one request at a time. Include batch prompting, batch interference, constraint substructure recovery, and a selected EBT citation. Record dates and failed access. Do not invoke a deep-research fan-out.
