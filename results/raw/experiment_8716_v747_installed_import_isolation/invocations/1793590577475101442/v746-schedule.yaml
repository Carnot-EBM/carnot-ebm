    4. Bind this task to the V746 full-object contract, visible table and canonical
    digest using the existing roadmap reader. Preserve V745 authority in research-roadmap-v745-preserved-20261101.md.
    Independently authenticate this branch''s original inputs and registered method
    values; do not use Exp8681 readiness, rebuild a stack of historical report wrappers,
    or count future same-roadmap outputs as existing files. Historical failures remain
    failures. Branch-local qualification has the same original assertions and authority
    requirements, not weaker gates.


    5. Declare inference_substrate_class=no_model_load, MODEL_SPECS=[] and zero language-model
    calls. Use aggregation_from_upstream_artifacts for readers, deterministic_verifier
    for constructed checks, or verifier_ensemble_against_cached_candidates for numerical-head
    evaluation. Authenticate numerical checkpoints separately. CPU fixed-point arithmetic
    is not physical FPGA execution.


    6. Reproduce Exp8681''s exact failure from validation.json and per-child custody
    files:77 original nodes were collected; child retention receipts had SQLite references;
    the final original_coverage_retention had none and original_rejection_line_executed
    was false. Write an integration regression with two real coverage children, intervening
