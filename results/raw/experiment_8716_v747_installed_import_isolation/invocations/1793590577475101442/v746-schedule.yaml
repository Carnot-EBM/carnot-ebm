    SQLite, source hashes, JUnit, commands, actual exits and durations per child before
    combining copies. A killed child fails qualification. Preserve original test nodes
    and assertions; consumer coverage cannot qualify a producer. Do not run recursive
    historical controllers or the entire repository suite.


    11. Cold-replay immutable primitives in a fresh bounded process. Reject missing
