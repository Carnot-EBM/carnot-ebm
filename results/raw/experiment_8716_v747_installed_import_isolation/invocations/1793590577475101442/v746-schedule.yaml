    contract_ready_score and learning_authority_ready_score only after exact owned
    qualification. Keep the V744 objective_updates, objective_audit, cohort partition
    and original head/data bytes unchanged. Do not introduce a global gate on extraction,
    installed batching, numerical lifecycle or ARC closure; each must independently
    validate the same current contract and its own original input authority.


    10. Run focused unit tests and actual private CLI success/rejection paths, Ruff
    check and format, strict mypy on owned modules, and scripts/check_spec_coverage.py
    --files <owned-test-files>. Run applicable ops/e2e-test-plan.md checks, including
    private E2E-018/021 for authority/publication changes. Require100 percent newly
    owned statement coverage, including actual child and rejection paths. Collect
