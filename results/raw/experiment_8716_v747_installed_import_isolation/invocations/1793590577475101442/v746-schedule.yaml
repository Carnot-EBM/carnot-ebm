    scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py
    --strict <private-candidate>. Preserve actual severities and historical flags.
    Validate final bytes before atomic publication. Owned failed checks disqualify;
    unchanged external incompleteness is blocked, never partial. Reconcile openspec/,
    _bmad/traceability.md, ops/status.md and ops/changelog.md with measured outcomes.


    REQUIRED ARTIFACT FIELDS:

    experiment_id, task_id, milestone, run_date, invocation_id: principle: Bind each
    claim to its actual task and invocation.

    honest_verdict, verdict_class: principle: Use complete_ terminal prefixes. verdict_class
    is positive | circular_positive | null | blocked | disqualified | partial. Only
    retryable incomplete owned work is partial; unchanged external failure is blocked.

    gate_check_summary: principle: Every blocked_* or complete_blocked_* identifies
    upstream, check, path/hash, exact field, operator, expected and observed; distinguish
    absence from zero.

    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts,
    target_model, historical_model_provenance: principle: Separate current LLM calls,
    authenticated numerical heads and historical provenance.

    rows, intended_count, completed_count, failed_count, censored_count, excluded_count,
    independent_count, sample_size_budget: principle: Retain a status/metric per intended
    unit and arm. Seeds, siblings, views and repeats do not multiply independent questions.

    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score:
    principle: Oracle-dependent wins are circular_positive. Constructed or exposed
    data cannot establish independent generalization.

    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts,
    terminal_validation_sidecar_path, adversarial_findings: principle: Failed acceptance
    gates forbid positive claims; readiness is separate from benefit.

    preconditions_checked, duration_s, started_at_utc, ended_at_utc, phase_spans,
    random_seed, reproducibility_checksum: principle: Use actual clocks, measured
