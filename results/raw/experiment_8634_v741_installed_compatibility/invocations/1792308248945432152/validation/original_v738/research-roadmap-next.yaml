    10. Read only the supplied ops/cuda-runtime-repair-receipt.json through the existing Exp8410 reader within 60 seconds. Require causal changed environment/library hashes and real context/copy evidence for runtime_repair_ready_score=1. Do not run a device or model probe. Optional canary failure cannot lower methods_ready_score or either CPU input score. Seal a bounded MedExpert audit plan and an ARC V737-only receipt manifest with unchanged refinement support thresholds.
    11. Run scoped unit tests, real private CLI checks, Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Run applicable ops/e2e-test-plan.md checks, including private E2E-018 and E2E-021 for authority/publication consumers. Require 100 percent newly owned statement coverage including real children and rejection paths. Collect original node IDs before disjoint bounded children and retain the exact union and original authority. Use -n 0 -o addopts= --no-cov. Never run the full repository suite or nested historical validation controllers. A killed child fails validation. Retain commands, exits, durations and log hashes.
