    TASK:
    Bind thirteen tasks and ingest long-context evidence and serving methods. Deliver results/experiment_8602_v739_contract_methods.json. Create thin runner scripts/experiments/experiment_8602_v739_contract_methods.py. Store primitives under results/raw/experiment_8602_v739_contract_methods/ and notes in docs/research-notes/v739-contract-methods.md. Same-roadmap outputs are future dependencies.
    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Authenticate actual input paths, original authority, hashes, tools, memory and writable disk-backed scratch. Record missing required inputs in gate_check_summary. Optional GPU and board absence cannot block independent CPU branches.
    2. Print a flushed progress line at every phase boundary and before and after each model load, generation, benchmark and subprocess that can take minutes. Use unbuffered output. Print completed/pending counts inside long loops. Supervise children and emit status at least every60seconds. Keep every gap under600seconds. Write any file over about200lines in several tool calls of at most150lines, with a progress message between calls. Keep each tool call bounded; poll long work in calls of at most60seconds. Stop measurement by3600seconds and reserve900seconds for validation within the4800-second hard cap. Never pad duration.
    3. Spec first: confirm the relevant capability spec contains REQ-* and SCENARIO-* before implementation. Add focused failing tests first. Preserve original scientific assertions and historical evidence. Accept --date {date}. Put runners in scripts/experiments/, tests in tests/python/, and scratch in /var/tmp. Do not modify research-roadmap.yaml, shared validators, generator weights or external services.
    4. Declare inference_substrate_class=no_model_load and MODEL_SPECS=[]. Record zero current language-model calls. Imported generator names belong in historical_model_provenance. Identify any actual small energy head and checkpoint in target_model; no_model_load does not mean absence of numerical inference.
    5. Compare exactly thirteen complete task dictionaries, Exp8602 through Exp8614, across staged or authentically activated V739 YAML, the visible table, embedded full JSON, canonical_tasks_sha256 and end marker. Test count/order/ID/title/phase/deliverable/model/substrate/gate/prompt/retirement/end-marker mutations. Active V738 is not V739 authority before activation. Do not require future task artifacts.
    6. Create openspec/change-proposals/v739-methods-protocol.json before measurements. Inherit objective_updates, objective_audit and evidence_canary from authenticated V738 by value and hash. Preserve head, corpus, temperatures, capacities, seeds, intervals and costs. Seal new producer mappings separately. Keep old readers pinned to old authority.
    7. Ingest the dated V739 references and full methods for Trivia+2605.11330, Calibeating2603.22167, delayed capacity2606.11711, online KAN2602.02056 and Ising review2610.03972. Use low-concurrency primary-source retrieval. Record equations, assumptions, hashes and use/defer decisions; mark ingested leads in research-studying.md. This is the reserved SOTA-ingestion task.
    8. Authenticate Exp8580 validator, Exp8581 accounting, Exp8431 original head and Exp8554 historical union through original readers. Authenticate Exp8593 provenance and Exp8596 cost independently. Emit learning_inputs_ready_score and resident_inputs_ready_score separately. Revalidate only affected dependencies; no global gate may disable an unrelated qualified branch.
    9. Register Trivia+ internal-only eligibility and extraction coverage. Fix first128 normalized question clusters by SHA256(seed7398607 || question_hash) from official test before labels. Include all siblings. Preserve complete source bytes. No qwen p2 probability exists in this release; do not feed invented q into the nine-input head. This study evaluates extractor reach and lexical signals only.
    10. Register the lean-worker2x2 comparison: legacy/lean import path crossed with Python/native arithmetic. Keep original64 requests, lengths1/4/16, batches1/8, ten paired repeats and original resident statistical rules. Primary remains L16/B1; secondary cells are descriptive. Register action-observer horizon120 and separate legacy resolved_by_levelup from bounded no-progress/censored evidence; no policy refinement is authorized.
    11. Use the existing CUDA evidence reader once, with no context/device probe. Require a supplied causal library/environment repair receipt and current validator custody for runtime_repair_ready_score=1. Missing or unchanged evidence yields zero; the structured canary gate then skips all model work. Preserve board evidence for the later unconditional operation reader.
    12. Run scoped unit tests, private CLI checks, Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Run applicable ops/e2e-test-plan.md checks, including private E2E-018/021 for authority/publication readers. Require100percent newly owned statement coverage, including actual children and rejection paths. Collect original node IDs before bounded disjoint test children; retain the exact union and original authority. Use -n 0 -o addopts= --no-cov. Never run the whole repository suite or nested historical validation controllers. A killed child fails validation. Keep commands, exits, durations and log hashes.
    13. Cold-replay immutable primitives in a fresh bounded process. Test missing inputs, owned failures and self-consistently rehashed tampering. Run primary_publication, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Preserve actual findings and downstream acceptance. Validate final bytes before atomic publication. Required owned-check failure is disqualified. Unchanged external blockage is blocked, never partial. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md without rewriting history.
