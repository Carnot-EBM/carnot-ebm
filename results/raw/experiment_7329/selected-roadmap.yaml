- id: exp7329-contract
  title: Bind V644 sources and the exact fourteen-task contract
  phase: 1
  track: reporting
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.644
  deliverable: results/experiment_7329_v644_contract.json
  model: opus
  prompt: |
    CONTEXT:
    V643 completed all thirteen tasks. The archive ends at V642, so use exact V643 terminal artifacts. Bind the new sources and task contract without making an advisory receipt a scientific prerequisite.
    Work at {project_root}. Execution date {date}. Milestone 2026.09.644, phase 1.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/python/carnot/experiment_7316_v643_contract.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_consumer_checks.py
    - {project_root}/results/experiment_7328_v643_capstone.json
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7329_v644_contract.json. Create scripts/experiments/experiment_7329_v644_contract.py as a thin runnable entrypoint. Put reusable behavior in python/carnot/experiment_7329_v644_contract.py only when needed, and meaningful tests in tests/python/test_experiment_7329_v644_contract.py. New implementation requires REQ-* and SCENARIO-* in the named existing capabilities before code changes.
    SAME-MILESTONE INPUTS (future outputs, read only after their tasks finish):
    None. Historical files are diagnostic evidence, not current readiness gates.
    Reject absent, quarantined, disqualified, blocked or partial producers before consuming scores. Retain canonical failed-gate records; never invent an upstream output.

    CONCRETE STEPS:
    1. Print and flush immediately. Read the required paths and check actual prerequisites. Write or extend the named capability requirements, then meaningful failing tests, before implementation. Reuse shipped functions and thin entrypoints. Scratch files belong in /tmp. Keep raw evidence and checkpoints in this task-owned results area; never write a success-shaped placeholder.
    2. Print a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Inside EVERY long loop print completed units and monotonic elapsed at least every 60 seconds. Stream child output unbuffered; for blocking calls emit a truthful pending-operation heartbeat every 60 seconds. Keep EVERY silence gap under 600 seconds during authoring and validation as well as execution. Silence can kill a task at 1200 seconds; continuing progress permits the 4800-second hard cap. Checkpoint completed work and bound workload; never pad elapsed time.
    3. No current LLM work: MODEL_SPECS=[], model_invoked=false and zero current invocation counts. Declare inference_substrate=aggregation_from_upstream_artifacts, inference_substrate_class=aggregation, execution_venue=host. Keep historical or scripted model-shaped evidence in labeled hash-bound sidecars. If actual work changes, declare the actual substrate.
    4. Select research-roadmap-next.yaml only when its milestone is 2026.09.644; otherwise require a matching active file. Hash-copy the selected YAML and the Markdown before either can change. Compare exactly 14 tasks exp7329 through exp7342, in order, including titles, phases, substrate classes, paths, and gates. Do not archive or activate a milestone.
    5. Reuse the independent Markdown/YAML parser approach from Exp7316. In this task-owned parser support the closed in operator with a JSON list for terminal classes. Do not import an old evaluate_contract with fixed V643 identifiers. Test missing task, reordered ID, stale milestone, changed phase/path/title/field and malformed operator mutations; each must fail.
    6. Run the real conductor gate reader in a private temporary tree on every edge: passing score, zero score, missing file, missing field, missing verdict_class, and disqualified score-one. Each adverse case must fail. Gate fields must appear verbatim in the producer REQUIRED ARTIFACT FIELDS. No science task gates on this receipt.
    7. Ingest the V644 reference section. Make a focused bounded primary-source check of CCA, Memoir, Solver-Hard, and AMTFV; map each method to the task that tests it. Record 429/browser challenges as access outcomes. Mark ingested entries in research-studying.md without a broad fan-out or invented citation counts.
    8. Run schema, prior-failure, exclusion, path and gate audits against the selected file. Set contract_complete_score=1 only after parity and all negative controls pass. A source access failure must remain visible but cannot be called a model or scientific result.
    9. Use the shipped Exp7303 scoped validation runner with explicit test files and changed modules. Tests must import worktree code. Run pytest -n 0 -o addopts= --no-cov with a private --basetemp; separately require 100% changed-module coverage, scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on the exact affected tests. For Rust changes run focused cargo tests, formatting and clippy on affected crates. Reuse existing tests for unchanged reducers. Never invoke a historical full-suite launcher, weaken a test or erase an unrelated repository-health failure.
    10. Run the declared entrypoint end to end, reload the measured terminal candidate and independently reduce raw rows. Apply the relevant checks from ops/e2e-test-plan.md stated above; for a read-only reporting task the applicable E2E is real files -> parser/gate reader -> terminal JSON, with no model or board invocation. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the candidate. Keep failures. Zero readiness/value/promotion on blocked or disqualified output; a disposition-complete score is accounting only. Atomically write the terminal deliverable after checks. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Do not change research-roadmap.yaml, production defaults, publication surfaces or historical determinations.

    11. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Version the artifact while preserving ordinary top-level experiment_id and milestone."
       - status: principle: "Publish a terminal result only after current work and affected validation."
       - run_date: principle: "Use {date} and retain actual UTC timestamps."
       - preconditions_checked: principle: "Name input identity, availability and each failed check before work."
       - MODEL_SPECS: principle: "List actual intended/current executable identities; any LLM task includes unsloth/Qwen3.8-27B-GGUF."
       - model_invoked: principle: "True when any real load or generation is attempted, even if no usable answer arrives."
       - invocation_counts: principle: "Separate attempted, completed, failed, cancelled and in-flight loads and generations."
       - inference_substrate: principle: "Declare actual computation; historical model evidence is not a current invocation."
       - inference_substrate_class: principle: "Declare the real duration class; small fixed-token runs are model_bounded_generation."
       - execution_venue: principle: "Use host; old board receipts never imply current board execution."
       - duration_s: principle: "Measure real monotonic elapsed time; never pad a duration floor."
       - phase_spans: principle: "Disjoint stage spans, completed units, checkpoint positions and pending operations explain cost."
       - random_seed: principle: "Freeze development, evaluation and resampling seeds before outcomes."
       - reproducibility_checksum: principle: "Bind code, settings, public inputs, evaluator identity and raw evidence."
       - source_artifact_hashes: principle: "Authenticate exact producers rather than similarly named older results."
       - rows: principle: "Every comparative unit and arm carries metrics, costs, abstentions, failures and censoring."
       - sample_size_budget: principle: "Record planned, attempted, completed and censored units with a fixed stopping rule."
       - acceptance_gate_results: principle: "Each gate records expected, observed and passed; separate completion from value."
       - gate_check_summary: principle: "Every blocked_* must identify upstream, failed check, artifact field, expected and observed value."
       - verifier_is_oracle: principle: "True whenever the execution authority defines correctness; independent code alone does not remove circularity."
       - honest_verdict: principle: "Completed findings start complete_ or complete:; external absence starts blocked_ and names the check."
       - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. Only unfinished own work is partial; external absence is blocked."
       - validation_receipts: principle: "Record exact command, affected scope, exit code, duration and log hash including failures."
       - repository_health: principle: "Keep unrelated repository failures as dated observations, separate from affected required checks."
       - field_principles: principle: "Explain each field without wrapping executable scores or ordinary dictionaries."
       - contract_complete_score: principle: "One means the exact fourteen-task contract and its adverse gate controls pass; it authorizes no science."
       - source_dispositions: principle: "Each source has URL, date, access outcome, adopted method, task mapping and limits."
       - contract_rows: principle: "Keep one independently compared row per exact task plus mutation and actual-gate-reader rows."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7329_v644_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
