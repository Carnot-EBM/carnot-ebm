    12. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Version this artifact; keep ordinary top-level experiment_id and milestone."
       - status: principle: "Write terminal output only after current work and required validation."
       - run_date: principle: "Use {date}; preserve actual UTC timestamps and monotonic phase spans."
       - preconditions_checked: principle: "Record input identities, availability, and the exact failed check."
       - MODEL_SPECS: principle: "Current executable identities only; every LLM task includes unsloth/Qwen3.8-27B-GGUF."
       - model_invoked: principle: "True for any actual attempted load or generation, including unusable results."
       - invocation_counts: principle: "Separate attempted, completed, failed, cancelled, and in-flight loads and generations."
       - inference_substrate: principle: "Describe actual computation using the recognized substrate literal."
       - inference_substrate_class: principle: "Use model_full_generation, model_bounded_generation, model_load_no_generation, cpu_exact_solver_or_simulator, or aggregation as actually exercised."
       - execution_venue: principle: "Use host for this milestone; historical board work is not current board execution."
       - duration_s: principle: "Measure real elapsed time; never sleep or inflate counts to satisfy a floor."
       - phase_spans: principle: "Record disjoint elapsed spans, units, checkpoint boundaries, and pending operations."
       - random_seed: principle: "Seal independent development and evaluation seeds before observing results."
       - reproducibility_checksum: principle: "Bind code, public inputs, private evaluator identity, settings, and raw evidence."
       - source_artifact_hashes: principle: "Authenticate exact producers; historical diagnostic evidence cannot authorize readiness."
       - rows: principle: "Emit every comparative unit and arm with metrics, costs, failures, abstentions, and censoring."
       - sample_size_budget: principle: "Record planned, attempted, complete, and censored counts and the frozen stopping rule."
       - acceptance_gate_results: principle: "Each check has expected, observed, passed, and a short principle."
       - gate_check_summary: principle: "Every blocked_* names upstream, check, artifact field, expected value, and observed value."
       - verifier_is_oracle: principle: "Declare shared executor authority; true forbids a positive scientific class."
       - honest_verdict: principle: "Completed findings start complete_ or complete:; external absence starts blocked_. State the actual result."
       - verdict_class: principle: "Closed enum: positive | circular_positive | null | blocked | disqualified | partial. Only unfinished own work is partial; unchanged external failure is blocked."
       - validation_receipts: principle: "Keep exact commands, scopes, exit codes, elapsed times, and log hashes, including failures."
       - repository_health: principle: "Preserve dated unrelated failures as observations, never as passed required checks."
       - field_principles: principle: "Explain why each field exists without wrapping executable scalars or ordinary dictionaries."
       - contract_complete_score: principle: "One only for the exact thirteen-row contract and passing metadata checks."
       - contract_rows: principle: "Both independently parsed authorities retain every compared field."
       - source_dispositions: principle: "Cite dates, URLs, access results, implementation choices, and falsifiers."
       - gate_control_rows: principle: "Actual file-to-reader tests preserve the expected and observed result."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7316_v643_contract.py --date {date}
