    CONCRETE STEPS:
    1. Print and flush immediately. Authenticate paths and inputs. Before implementation, ensure the named capability contains specific REQ-* and SCENARIO-* requirements. Write meaningful failing tests first. Reuse shipped functions with thin entrypoints. Scratch files belong in /tmp; raw data and checkpoints stay in their task-owned results directories. Never write a success-shaped placeholder.
    2. Print a flushed progress line at EVERY phase boundary and BEFORE AND AFTER any model load, generation, benchmark, or subprocess that can take minutes. Inside every long loop print completed units and monotonic elapsed at least every 60 seconds. Stream child output unbuffered. For blocking calls emit a truthful pending-operation heartbeat every 60 seconds. Keep EVERY silence gap below 600 seconds, including authoring and validation. Silence can terminate a task at 1200 seconds; regular progress permits the 4800-second hard cap. Bound work as well as silence. Never pad elapsed time.
    3. No current LLM work: MODEL_SPECS=[], model_invoked=false, and zero current model load/generation counts. Declare inference_substrate=aggregation_from_upstream_artifacts, inference_substrate_class=aggregation, execution_venue=host. Keep historical and injected model evidence in hash-bound sidecars. If actual work changes, declare the real substrate; never invoke a model to decorate a receipt.
    4. Select the staged YAML only if it exists and names 2026.09.643. Otherwise select the active YAML only if it names that milestone. Resolve this once. Hash its bytes and the design document. Never activate or archive a roster.
    5. Parse the Markdown table independently of YAML. Require 13 ordered tasks, exp7316 through exp7328. Compare exact IDs, titles, phases, output paths, and structured gates. Copy both authorities to task-owned raw sidecars before later documents can change.
    6. Run schema, both prior-failure checks, exclusion lint, gate audit, and prompt-path checks against the selected YAML. The staging path is optional after activation. Do not present a removed staging file as a required existing input. In /tmp test count, order, title, phase, path, and gate mutations.
    7. Exercise the actual conductor gate reader using temporary files for every declared gate. Include passing, false, missing-file, missing-field, and disqualified-with-score-one cases. Check the combined score and verdict gates. Keep fixture model evidence in sidecars.
    8. Ingest the V643 references into source_dispositions. Recheck at most four primary URLs, sequentially, with a 20-second request limit. Include 2604.13283, 2608.27038, 2503.15551, and the EBT primary page. Preserve rate limits and unavailable pages. Mark adopted ideas in research-studying.md. Do not create a literature fan-out.
    9. Reuse parser and reducer functions only. Do not inherit old milestone constants, validators, or full-suite launchers. contract_complete_score is one only when the literal and metadata checks pass. A mismatch is disqualified. Literature access failure is a recorded source disposition.
    10. Use the shipped Exp7303 scoped validation runner for these new entrypoints. Pass explicit test files and changed modules. Required tests must import worktree code. Use pytest -n 0 -o addopts= --no-cov and a private --basetemp; separately require 100% changed-module coverage, scoped Ruff check/format, changed-module mypy, and scripts/check_spec_coverage.py on exact affected tests. Reuse existing tests for unchanged read-only reducers. Do not call a historical full-suite validation helper. Preserve existing repository-wide failures in repository_health; a failing affected check still disqualifies the current result. Never edit or weaken a guard or test to obtain a pass.
