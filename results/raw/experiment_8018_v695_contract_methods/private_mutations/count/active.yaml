  prompt: 'CONTEXT:

    Work in {project_root} on {date}. The V694 conditioned heads were fitted, but
    post-hoc calibration never qualified because one admitted source lacked a complete
    target. V695 preregisters the usable label cohort before fitting. Under-convergence
    remains a hypothesis to test.

