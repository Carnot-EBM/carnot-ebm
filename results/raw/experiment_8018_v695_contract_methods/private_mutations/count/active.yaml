    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md;
    scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py;
    python/carnot/reporting/primary_publication.py; python/carnot/experiment_8008_v694_conditioned_energy_fit.py;
    python/carnot/verify/sparse_energy_7996.py; python/carnot/verify/qwen_energy_calibration_7972.py;
    results/experiment_8008_v694_conditioned_energy_fit.json; results/experiment_8019_v695_eligible_targets.json;
    research-references.md V695 scan; openspec/capabilities/constraint-verification/spec.md

    TASK:

    Use the existing small conditional spline energy and converged baselines with
    the new qualified calibration mask. Train coefficients on fit only, select hyperparameters
    on tune only and calibrate on the sealed complete-label calibration set. Keep
    stream and retention outcomes out of every optimizer. Deliver results/experiment_8020_v695_qualified_energy_fit.json,
    raw evidence under results/raw/experiment_8020_v695_qualified_energy_fit/ and
    a thin runnable scripts/experiments/experiment_8020_v695_qualified_energy_fit.py.

