    and acceptance gates before measurement. Reuse working readers and runners; do
    not duplicate validation orchestration. Preserve historical results and their
    failure logs.

    3. Gate on Exp8019 fit and calibration fields using the exact immutable manifests.
    Run a private small-data training/serialization/CLI fixture before natural fitting.
    Pin original code, objective, scaling and configuration in durable custody; historical
    hash drift does not authorize rewriting the old receipt.

    4. Compare the conditioned 110-parameter spline energy, its exactly equivalent
    sigmoid representation, converged linear classifier, scalar-Qwen affine/isotonic
    and intercept-only baselines, and historical fixed-200-step residual control.
    All comparable heads get identical public features and labels. Keep parameters,
    optimization budgets and five seeds 17/29/43/71/101 explicit; duplicate sigmoid
    is an identity check, never another independent method.

    5. Train with the existing convergent optimizer, at most 2000 steps or 600 fitting
    seconds per complete task. Log objective, gradient norm, condition estimates and
    active coefficient count at least every 50 iterations. Freeze fit-selected coefficients
    before calibration access. Calibrate using the Exp8019 eligible set with the same
