- id: exp8018-contract-methods
  title: Freeze thirteen tasks and qualify immutable terminal readers
  phase: 1
  track: infra
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 25
  per_unit_rows: true
  milestone: 2026.10.695
  deliverable: results/experiment_8018_v695_contract_methods.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  agent_type: claude
  model: opus
  prior_failures:
  - experiment_id: exp7992-contract-methods
    verdict: complete_blocked_authority
    addressed_by: Use the complete V695 table, JSON and full-task digest with the
      already qualified parameterized authority reader.
    retire_if_same_verdict: true
  - experiment_id: exp8017-capstone
    verdict: complete_disqualified_v694_owned_checks
    addressed_by: Resolve exact saved reader failures in private fixtures and freeze
      configuration bytes before validation; preserve the original disqualification.
    retire_if_same_verdict: true
  prompt: 'CONTEXT:

    Work in {project_root} on {date}. V694 matched its task contract, but its capstone
    failed owned checks and detected mutable configuration bytes. V695 preserves the
    historical design and gives each invocation immutable authority; qualification
    is administrative.

    EXISTING CODE TO READ FIRST:

    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md;
    scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py;
    python/carnot/reporting/primary_publication.py; python/carnot/reporting/v690_authority.py;
    python/carnot/reporting/v685_authority_lifecycle.py; python/carnot/reporting/roadmap_contract.py;
    python/carnot/reporting/v694_capstone.py; scripts/roadmap_schema.py; scripts/exclusion_manifest_lint.py;
    results/experiment_8005_v694_contract_methods.json; results/experiment_8017_v694_capstone.json;
    openspec/change-proposals/research-roadmap-v694-preserved-20261002.md

    TASK:

    Bind count=13 and first_id=8018 to the visible table, full JSON and canonical
    task digest. Reuse the parameterized authority reader. Qualify terminal readers
    against private valid, blocked, null and tampered inputs before science; keep
    authority readiness independent of scientific branch gates. Deliver results/experiment_8018_v695_contract_methods.json,
    raw evidence under results/raw/experiment_8018_v695_contract_methods/ and a thin
    runnable scripts/experiments/experiment_8018_v695_contract_methods.py.

    CONCRETE STEPS:

    1. Emit a flushed progress line at every phase boundary and before and after every
    model load, generation, benchmark and subprocess. Use PYTHONUNBUFFERED=1 and print(...,
    flush=True). Emit elapsed time, completed units and pending work inside long loops
    and every 60 seconds while a child is running; keep every output gap below 600
    seconds. Keep each tool call bounded. Write any file over about 200 lines in several
    tool calls of at most about 150 lines, with a progress message between calls.
    Record real work; never pad duration or invent heartbeat evidence.

    2. Read the named inputs and verify prerequisites before expensive work. Add task-specific
    REQ-* and SCENARIO-* to the relevant capability spec before implementation, then
    write failing traced tests. Freeze methods, source roles, exclusions, budgets
    and acceptance gates before measurement. Reuse working readers and runners; do
    not duplicate validation orchestration. Preserve historical results and their
    failure logs.

    3. Compare ordered IDs, titles, phases, deliverables, prompts, MODEL_SPECS, substrate
    classes, gates and prior_failures. Verify every gate names an earlier task and
    a verbatim upstream REQUIRED ARTIFACT FIELD. Run existing schema, failure-ledger
    and exclusion checks. Record historical active V694 separately from staged V695
    until activation; never manufacture consumed staging bytes.

    4. Freeze content-addressed copies of design, YAML, method configuration and original
    failure receipts. After activation bind the active V695 task digest. Parameterize
    historical fixture inputs so rollover and UTC-midnight changes cannot alter old
    tests. Trace Exp8017''s failed owned commands to their saved logs; reproduce and
    fix only a demonstrated reader defect, preserving original assertions.

    5. Exercise missing table/JSON/digest, gate-field typo, configuration byte drift,
    staged/active mismatch and negative cold replay. Run the existing twelve authority
    mutations and private direct CLI paths. Freeze the statistical choices in the
    design, including endpoint directions and three primary comparisons. Contract
    readiness does not imply qualified labels or a verifier improvement.

    6. Run scoped unit and consumer tests, Ruff check and format, strict mypy and
    scripts/check_spec_coverage.py; measure 100% changed-code statement coverage including
    direct CLI branches. Keep tests, coverage files and child scratch outside results/
    with the artifact guard enabled. Freeze command argv, exit codes and log hashes.
    Separate a bounded repository-health diagnostic from required owned checks; preserve
    failed assertions. If producer code or configuration changes after measurement,
    rerun affected measurements and terminal readers. Applicable E2E: E2E-018 private
    authority lifecycle CLI and mutations; run a task-owned private terminal capstone
    reader fixture. Do not republish a historical primary.

    7. Cold-reduce durable raw rows and checkpoints in a fresh process. Run scripts/adversarial_verify.py
    on the exact candidate and scripts/verdict_row_consistency_lint.py --strict, then
    publish final bytes using the existing publication helper and recheck the published
    result. Store all published checkpoint references under the durable raw directory,
    never only /tmp. Reconcile openspec, _bmad/traceability.md, ops/status.md and
    ops/changelog.md. Missing or unchanged external inputs are terminal blocked, never
    retryable partial. Do not change production defaults or externally publish.

    REQUIRED ARTIFACT FIELDS:

    - experiment_id, task_id, milestone, run_date={date}, schema, claim_scope: principle:
    identify current work and its limits.

    - honest_verdict: terminal complete_* string; verdict_class: positive | circular_positive
    | null | blocked | disqualified | partial. principle: positive requires all claim
    gates; partial means unfinished owned work only. Oracle success is circular_positive.

    - gate_check_summary: upstream ID, path/hash, exact artifact_field, expected,
    observed and passed for each failed prerequisite. principle: missing fields are
    contract errors; zero is a failed gate. Emit for any blocked verdict, including
    blocked_*.

    - rows or per_game_results, sample_size_budget, random_seed, reproducibility_checksum:
    principle: every intended source/arm/seed/condition keeps its metric, numerator,
    denominator, exclusion/failure/censor reason; counts include intended, eligible,
    started, completed, excluded, failed, censored and independent. Seeds and duplicates
    do not enlarge independent n.

    - verifier_is_oracle, acceptance_gate_results, genuine_headroom, positive_control_results,
    generalized_learning_benefit_score=0: principle: fixtures, exposed-development
    replay and natural deployment evidence carry distinct claims.

    - cited_upstream_artifacts, raw_shard_hashes, code_config_hashes, checkpoint_references,
    validation_receipts, coverage_statement_counts, terminal_validation_sidecar_path,
    flagged_adversarial, field_principles: principle: imported values bind original
    bytes; every claim field explains its evidential purpose.

    - inference_substrate=aggregation_from_upstream_artifacts, inference_substrate_class=no_model_load,
    MODEL_SPECS=[], model_specs, model_invocation_counts, trained_head_specs, duration_s,
    phase_spans: principle: current pretrained-model calls differ from CPU small-head
    training and imported history.

    - contract_ready_score: integer 0 or 1. principle: exact downstream field; readiness
    requires valid complete measurement and owned checks, not scientific benefit.
    Blocked/disqualified inputs cannot qualify.

    - authority_snapshots, canonical_tasks_sha256, contract_rows, mutation_rows, method_freeze,
    lineage_rows, historical_reader_failure_rows: principle: full executable authority
    and original failed operands stay independently inspectable.

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu .venv/bin/python
    -u scripts/experiments/experiment_8018_v695_contract_methods.py --date {date}

    Do NOT push. Do NOT modify scripts/research_conductor.py.

    '
