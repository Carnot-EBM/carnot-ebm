    never self-clear a critical flag.
    - service_measurement_ready_score, branch_eligibility, rows, complete_service_cost, cached_service_cost:
    principle: Valid branches retain their real cost boundary.
    - update_touch_rows, durable_write_rows, paired_latency_intervals, measurement_code_snapshot: principle:
    Connect sparsity to actual work and final measured code.
    - missing_cost_components, acquisition_receipt_joins, load_amortization: principle: Unknown or historical
    acquisition costs cannot masquerade as current whole-service speed.
    - service_measurement_ready_score: principle: Exact downstream readiness field. Set 1 only after complete
    valid execution and owned checks. A scientific null may be ready; blocked or disqualified work is 0.
