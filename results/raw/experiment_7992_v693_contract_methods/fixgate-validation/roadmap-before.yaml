    in an evaluator. Choose one temperature per arm from 0.5/1/2 by calibration Brier, ties favor 1 then 0.5 then
    2. Do not refit coefficients. Use y=1 for unsupported content. Costs are accept=5*y, reject=1-y and
    escalate=0.25. Choose the minimum expected-cost action; ties escalate. Equivalent thresholds are accept below
    0.05 and reject above 0.75.
    5. Record frozen-arm predictions for every stream slot before its label is read by the evaluator. Store
    evaluation targets outside the predictor package. Write one per-source/arm/seed row; count failures as
    escalation where y exists and separately bound unknown-label cost in [0,5]. Never drop failed requests from
    all-intended reporting. Do not read retention targets.
    6. Compare the primary sparse head with same-information logistic and MLP controls using paired source-group
    resampling with 10000 draws. Require at least 192 eligible independent stream groups and 20 per class.
    Holm-adjust the two primary cost tests. A decision benefit requires cost gain at least 0.02 with positive 95%
    lower bounds and adjusted p<0.05 against both controls, no extra false accepts, automation at least 0.50, and
    Brier-degradation upper bound at most 0.01. Report AUROC and reliability descriptively. Existing scalar/raw-q
    comparisons are secondary.
    7. Exercise known-benefit and no-headroom fixtures before natural evaluation. Their oracle labels stay
    separate and circular. Verify independently reduced row totals, disjoint role hashes, unchanged checkpoint
    hashes, censored-slot bounds and equivalent-classifier identity. Run E2E-019 private custody tests and private
    real CLI cold replay. A powered null closes this static method in this development scope; an underpowered
    result cannot refute it.
    8. Run affected unit tests and direct consumers. Require nonempty 100% changed-statement coverage, including
    private real CLI success, blocked, and cold-replay paths. Run scoped Ruff check/format, strict mypy, and
    explicit-path scripts/check_spec_coverage.py. Run the named E2E checks with private outputs. Preserve
    historical repository-health failures as diagnostics; never relabel them as current passing checks or weaken a
    required owned check.
    9. Write primitive rows and a candidate in private scratch. Check its actual bytes with
    scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict. Check both conductor
    artifact readers against the exact deliverable. Publish only the checked primary after final code/tests are
    frozen; retain validator output in a sidecar. After any fix, regenerate receipts and revalidate. Do not alter
    a validator merely to pass this experiment.
    10. Append findings and limitations to ops/status.md, ops/changelog.md, and _bmad/traceability.md. Reconcile
    the affected OpenSpec requirements. A missing external prerequisite is terminal blocked with
    gate_check_summary, not partial. A failed owned check is disqualified with readiness zero. A complete valid
    underpowered result is null. Partial is only for unfinished own work.
    
