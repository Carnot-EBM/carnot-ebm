    budget. Save the probability-equivalent sigmoid implementation with identical spline coefficients and no extra
    fit; it must agree within 1e-10. This identity is a control against normalization claims, not a competitor the
    energy must beat. Keep the existing scalar head as a frozen comparator.
    7. Implement sparse one-example gradients touching at most four basis coefficients per feature plus the
    intercept. Test dense/sparse gradient parity, zero-step identity, sign direction, finite differences, knot
    boundaries, saturated inputs and save/load parity. Loss increases must be reported, not hidden by a selected
    seed. Record coefficient touches and state bytes. CPU sparse updates supply the hardware path; no FPGA speed
