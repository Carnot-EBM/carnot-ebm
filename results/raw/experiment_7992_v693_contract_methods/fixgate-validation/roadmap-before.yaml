  prompt: |
    CONTEXT
    Work in {project_root} on {date}. Milestone 2026.10.693. The milestone must end with thirteen truthful
    dispositions. V692 capstone failed owned verification and several upstream tasks were skipped. Preserve that
    record. V693 distinguishes development evidence, finite replay benefit, protocol readiness, and deployment
    generalization.
    
    EXISTING CODE TO READ FIRST
    CLAUDE.md; CODEX.md; research-program.md; ops/exclusion_manifest.yaml; scripts/experiment_template.py;
    python/carnot/reporting/current_work_receipt.py; openspec/capabilities/research-reporting/spec.md;
    openspec/capabilities/verification/spec.md; openspec/capabilities/self-learning/spec.md; ops/e2e-test-plan.md;
    python/carnot/reporting/v692_contract_methods.py; python/carnot/reporting/v692_contract_validation.py;
    scripts/experiments/experiment_7991_v692_capstone.py; scripts/publication_gate.py;
    scripts/summarize_artifact.py; scripts/recurring_blocker_ledger.py;
    results/experiment_7991_v692_capstone.json; ops/north-star.md
    
    TASK
    Independently decide verifier learning and deployment gaps. Deliver
    results/experiment_8004_v693_capstone.json. Implement scripts/experiments/experiment_8004_v693_capstone.py.
    MODEL_SPECS: []. SUBSTRATE CLASS: no_model_load. Use aggregation_from_upstream_artifacts for audits or
    verifier_ensemble_against_cached_candidates for numerical work. Invoke no pretrained model. Declare small
    fitted heads separately.
    
    CONCRETE STEPS
    1. Print a flushed progress line at each phase boundary and before and after each model load, generation,
    benchmark, and subprocess. Emit progress inside long loops. Supervise silent children with elapsed-time lines
    at most 60 seconds apart. Keep every output gap below 600 seconds. Use waits of at most 60 seconds. Never pad
    measured duration.
    2. Keep each tool call small. Write every file over about 200 lines in chunks of at most 150 lines across
    several tool calls. Send a progress message between calls. Bound searches and output; checkpoint long
    numerical work and each completed model request.
    3. Read the listed code and relevant REQ-* requirements. Extend the capability spec before behavior changes.
    Write failing tests before implementation. Freeze this task configuration and its validation commands before
    measurements. Use private scratch outside the checkout and keep the artifact guard enabled. Preserve
    historical results and all existing assertions.
    4. Read all thirteen tasks from frozen V693 authority. For the twelve earlier tasks collect exact primaries,
    sidecars and conductor skip receipts. Record this capstone as the thirteenth terminal disposition after
    validation; do not recursively hash a final artifact into itself. Never substitute an arbitrary glob match for
    a missing declared producer.
    5. Independently reconstruct the static cost comparisons, causal update effects, retention, confidence
    diagnostics and full-service costs from primitive rows. Do not import producer acceptance functions. Exclude
    blocked, disqualified, flagged and circular results from independent verifier claims. Keep qualified nulls and
    all failures in the disposition table.
    6. Decide the three PRD gaps: useful oracle-distinct decisions, durable self-learning, and validated
    affordable deployment. Source-disjoint development observations cannot close out-of-distribution or
    hidden-game gaps. generalized_learning_benefit_score stays zero. Historical G1-G4 from
    scripts/publication_gate.py --json remain a separate paper_ready field. Do not redefine publication gates or
    infer new science readiness from them.
    7. Compare all prior_failures entries with new terminal verdicts. A repeat exact verdict with
    retire_if_same_verdict=true appends the narrow failed scope and reopening condition to
    ops/exclusion_manifest.yaml. Preserve all previous entries. Distinguish repeated failure from a different
    experiment sharing the generic word null. Missing external upstream work makes the capstone blocked once, not
    partial; its own failing checks make it disqualified.
    8. Use the qualified parameterized authority/reduction path with private fixtures instead of copying the
    failed capstone validation stack. Cover expected-negative replay, malformed input, missing producer and
    publication failure before execution. Run E2E-018 private tests, terminal adversarial and strict row checks,
    both readers and independent cold replay. Publish the final table and explicit next-action/reopen conditions.
    No new model call, experiment rerun, paper submission or live-default change is allowed.
    9. Run affected unit tests and direct consumers. Require nonempty 100% changed-statement coverage, including
    private real CLI success, blocked, and cold-replay paths. Run scoped Ruff check/format, strict mypy, and
    explicit-path scripts/check_spec_coverage.py. Run the named E2E checks with private outputs. Preserve
    historical repository-health failures as diagnostics; never relabel them as current passing checks or weaken a
    required owned check.
    10. Write primitive rows and a candidate in private scratch. Check its actual bytes with
    scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict. Check both conductor
    artifact readers against the exact deliverable. Publish only the checked primary after final code/tests are
    frozen; retain validator output in a sidecar. After any fix, regenerate receipts and revalidate. Do not alter
    a validator merely to pass this experiment.
    11. Append findings and limitations to ops/status.md, ops/changelog.md, and _bmad/traceability.md. Reconcile
    the affected OpenSpec requirements. A missing external prerequisite is terminal blocked with
    gate_check_summary, not partial. A failed owned check is disqualified with readiness zero. A complete valid
    underpowered result is null. Partial is only for unfinished own work.
    
    REQUIRED ARTIFACT FIELDS
    - honest_verdict, verdict_class: principle: Use complete_* terminal verdicts. verdict_class is exactly
    positive | circular_positive | null | blocked | disqualified | partial. A failed benefit gate forbids
    positive; circular fixtures use circular_positive.
    - gate_check_summary: principle: Every blocked verdict names upstream ID, exact path/hash, field, operator,
    expected value, and observed value. Missing fields are contract errors, not observed zeros.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_specs, model_invocation_counts,
    trained_head_specs: principle: Describe current work separately from cited historical inference. Cache
    reduction has zero current pretrained calls. Planned models do not assert a blocked invocation occurred.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: principle: Bind timing and deterministic
    reconstruction to this invocation.
    - cited_upstream_artifacts, code_config_hashes, raw_shard_hashes, execution_date: principle: Record imported
    fields and immutable producer bytes with each producer's own date. Never compare historical code hashes to
    today's mutable files as if they were the producer.
    - rows, sample_size_budget: principle: Save one row per source/arm/seed/event or audit check with raw
    numerator, denominator, eligibility, failure and censor status. Report intended, eligible, started, completed,
    excluded, failed, censored, independent counts. Seeds never multiply independent sources.
    - verifier_is_oracle, claim_scope, acceptance_gate_results, positive_control_results: principle: Distinguish
    protocol fixtures, fallible human source-support annotations, and independent natural-data evidence. A null
    needs a working positive control and genuine headroom.
    - preconditions_checked, validation_command_manifest_path, validation_receipts, coverage_statement_counts:
    principle: Required checks need actual commands, exit codes, logs and nonempty denominators.
    - flagged_adversarial, terminal_validation_sidecar_path: principle: Preserve final-byte validator results;
    never self-clear a critical flag.
    - capstone_execution_ready_score, task_dispositions, independent_reduction_rows, historical_failure_rows:
    principle: All thirteen outcomes stay visible, including the validated capstone itself.
    - gap_decisions, science_ready, paper_ready, g1, g2, g3, g4, unmet_gates: principle: Keep old publication
    evidence distinct from new science.
    - retirement_rows, reopen_conditions, generalized_learning_benefit_score: principle: A finite replay or
    administrative repair cannot establish deployment generalization.
    - capstone_execution_ready_score: principle: Exact downstream readiness field. Set 1 only after complete valid
    execution and owned checks. A scientific null may be ready; blocked or disqualified work is 0.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu .venv/bin/python -u
    scripts/experiments/experiment_8004_v693_capstone.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
