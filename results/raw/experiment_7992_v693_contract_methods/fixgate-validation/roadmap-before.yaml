    CONTEXT
    Work in {project_root} on {date}. Milestone 2026.10.693. The new cohort measures response support on disjoint
    development sources. Exp7981 exposed a provenance serialization failure after real work. Build one current
    invocation ledger from actual calls. Exp7993 is independent historical recovery and is not a prerequisite for
    this new capture.
    
    EXISTING CODE TO READ FIRST
    CLAUDE.md; CODEX.md; research-program.md; ops/exclusion_manifest.yaml; scripts/experiment_template.py;
    python/carnot/reporting/current_work_receipt.py; openspec/capabilities/research-reporting/spec.md;
    openspec/capabilities/verification/spec.md; openspec/capabilities/self-learning/spec.md; ops/e2e-test-plan.md;
    python/carnot/verify/qwen_calibration_capture_7969.py; python/carnot/verify/qwen_response_risk_7958.py;
    python/carnot/verify/qwen_stream_capture_7981.py; python/carnot/inference/sota_models.py;
    scripts/experiment_template.py; results/experiment_7969_v691_qwen_calibration_capture.json;
    results/experiment_7981_v692_qwen_stream_capture.json; results/experiment_7994_v693_development_cohort.json
    
    TASK
    Capture bounded Qwen judgments with owned call receipts. Deliver
    results/experiment_7995_v693_qwen_development_capture.json. Implement
    scripts/experiments/experiment_7995_v693_qwen_development_capture.py. MODEL_SPECS:
    ['unsloth/Qwen3.8-27B-GGUF']. SUBSTRATE CLASS: model_bounded_generation. Use live_llm_inference,
    inference_mode=live_gpu, and the 10-second bounded-generation floor. Load the exact cached GGUF via llama.cpp.
    Fixed small token budgets are bounded generation, even when the entire cohort takes minutes.
    
    CONCRETE STEPS
    1. Print a flushed progress line at each phase boundary and before and after each model load, generation,
    benchmark, and subprocess. Emit progress inside long loops. Supervise silent children with elapsed-time lines
    at most 60 seconds apart. Keep every output gap below 600 seconds. Use waits of at most 60 seconds. Never pad
    measured duration.
    2. Keep each tool call small. Write every file over about 200 lines in chunks of at most 150 lines across
    several tool calls. Send a progress message between calls. Bound searches and output; checkpoint long
    numerical work and each completed model request.
    3. Read the listed code and relevant REQ-* requirements. Extend the capability spec before behavior changes.
    Write failing tests before implementation. Freeze this task configuration and its validation commands before
    measurements. Use private scratch outside the checkout and keep the artifact guard enabled. Preserve
    historical results and all existing assertions.
    4. Use the sealed Exp7994 roster and successful full-source response-support prompt/grammar from Exp7969.
    MODEL_SPECS must include unsloth/Qwen3.8-27B-GGUF. Resolve the exact cached GGUF, revision and quantization.
    Use its embedded tokenizer via llama.cpp; never AutoTokenizer on the GGUF repository. Keep generator weights
    and live ARC defaults fixed.
    5. Acquire an owned free CUDA allocation without stopping another service. Record model hash, server identity,
    llama.cpp GPU-offload support, actual offloaded layers and before/resident/after GPU memory. Verify the server
    reports the required model, not another resident model. A missing allocation or identity blocks once with
    exact diagnostics; no CPU or simulated substitute.
    6. Before natural calls, exercise a private four-call transcript through the final serializer and actual
    adversarial provenance classifier. Current aggregate counts must equal current raw invocation rows; historical
    protocol references carry no current zero-count dictionaries. Test zero-call blocked, interrupted, resumed and
    mixed-scope cases without changing the validator. Freeze code before capture.
    7. Attempt at most 384 calls, one per selected response, 96 output tokens each, 6000 input tokens, 120 seconds
    per call, 300 seconds per load and 3000 seconds total measured work. Reserve at most 36864 output tokens. Log
    a started record before transport; checkpoint completion immediately. Never retry an uncertain started call or
    replace invalid rows. Emit heartbeat lines during model load and calls. Keep roles independent.
    8. Recompute role counts from requests and raw responses. Set capture_ready_score for an authenticated
    finished capture with every intended slot accounted for, even with explicit censoring. Emit
    calibration_capture_ready_score for at least 48 usable calibration groups, stream_capture_ready_score for at
    least 224 usable stream groups, and retention_capture_ready_score for at least 48 usable retention groups.
    These are input support gates, not class-balance or benefit claims. Publish all fields, including zeros, after
    owned terminal checks pass.
    9. Run private direct CLI success/blocked/replay tests, E2E-015 and provenance mutations. Clean up only owned
    processes and allocations. Freeze the original call-receipt subtree independently of later validation code
    changes. A failed current validation disqualifies all current readiness fields without fabricating missing
    calls.
    10. Run affected unit tests and direct consumers. Require nonempty 100% changed-statement coverage, including
    private real CLI success, blocked, and cold-replay paths. Run scoped Ruff check/format, strict mypy, and
    explicit-path scripts/check_spec_coverage.py. Run the named E2E checks with private outputs. Preserve
    historical repository-health failures as diagnostics; never relabel them as current passing checks or weaken a
    required owned check.
    11. Write primitive rows and a candidate in private scratch. Check its actual bytes with
    scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict. Check both conductor
    artifact readers against the exact deliverable. Publish only the checked primary after final code/tests are
    frozen; retain validator output in a sidecar. After any fix, regenerate receipts and revalidate. Do not alter
    a validator merely to pass this experiment.
    12. Append findings and limitations to ops/status.md, ops/changelog.md, and _bmad/traceability.md. Reconcile
    the affected OpenSpec requirements. A missing external prerequisite is terminal blocked with
    gate_check_summary, not partial. A failed owned check is disqualified with readiness zero. A complete valid
    underpowered result is null. Partial is only for unfinished own work.
    
    REQUIRED ARTIFACT FIELDS
    - honest_verdict, verdict_class: principle: Use complete_* terminal verdicts. verdict_class is exactly
    positive | circular_positive | null | blocked | disqualified | partial. A failed benefit gate forbids
    positive; circular fixtures use circular_positive.
    - gate_check_summary: principle: Every blocked verdict names upstream ID, exact path/hash, field, operator,
    expected value, and observed value. Missing fields are contract errors, not observed zeros.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_specs, model_invocation_counts,
    trained_head_specs: principle: Describe current work separately from cited historical inference. Cache
    reduction has zero current pretrained calls. Planned models do not assert a blocked invocation occurred.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: principle: Bind timing and deterministic
    reconstruction to this invocation.
    - cited_upstream_artifacts, code_config_hashes, raw_shard_hashes, execution_date: principle: Record imported
    fields and immutable producer bytes with each producer's own date. Never compare historical code hashes to
    today's mutable files as if they were the producer.
    - rows, sample_size_budget: principle: Save one row per source/arm/seed/event or audit check with raw
    numerator, denominator, eligibility, failure and censor status. Report intended, eligible, started, completed,
    excluded, failed, censored, independent counts. Seeds never multiply independent sources.
    - verifier_is_oracle, claim_scope, acceptance_gate_results, positive_control_results: principle: Distinguish
    protocol fixtures, fallible human source-support annotations, and independent natural-data evidence. A null
    needs a working positive control and genuine headroom.
    - preconditions_checked, validation_command_manifest_path, validation_receipts, coverage_statement_counts:
    principle: Required checks need actual commands, exit codes, logs and nonempty denominators.
    - flagged_adversarial, terminal_validation_sidecar_path: principle: Preserve final-byte validator results;
    never self-clear a critical flag.
    - capture_ready_score, calibration_capture_ready_score, stream_capture_ready_score,
    retention_capture_ready_score: principle: Each role can be assessed without silently treating a missing role
    as ready.
    - request_rows, raw_response_shards, role_completion_counts, censor_rows, generated_tokens: principle: All
    intended slots remain in the denominator.
    - model_identity_receipt, gguf_sha256, model_revision, protocol_fingerprint, gpu_lease_receipt,
    offload_evidence, cleanup: principle: Prove the mandated model ran on owned CUDA hardware.
    - current_invocation_ledger, original_capture_code_snapshot: principle: Tie typed counts and time spans to
    actual calls before any terminal repair.
    - capture_ready_score: principle: Exact downstream readiness field. Set 1 only after complete valid execution
    and owned checks. A scientific null may be ready; blocked or disqualified work is 0.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu CARNOT_FORCE_LIVE=1 .venv/bin/python -u
    scripts/experiments/experiment_7995_v693_qwen_development_capture.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
