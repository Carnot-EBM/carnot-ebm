  prompt: 'CONTEXT:

    Work in {project_root} on {date} for milestone 2026.09.685. Exp7890 failed on
    consumed staging authority, mutable historical fixtures and an E2E-016 replay
    missing --date. V685 uses the design task digest plus actual activation snapshots,
    private versioned fixtures and explicit CLI arguments. Missing science remains
    blocked once, not a partial retry.


    EXISTING CODE TO READ FIRST:

    - {project_root}/CLAUDE.md

    - {project_root}/CODEX.md

    - {project_root}/research-program.md

    - {project_root}/ops/exclusion_manifest.yaml

    - {project_root}/ops/e2e-test-plan.md

    - {project_root}/scripts/experiment_template.py

    - {project_root}/python/carnot/reporting/current_work_receipt.py

    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py

    - {project_root}/openspec/capabilities/research-reporting/spec.md

    - {project_root}/python/carnot/reporting/roadmap_contract.py

    - {project_root}/python/carnot/reporting/v684_capstone.py

    - {project_root}/python/carnot/reporting/v683_independent_audit.py

    - {project_root}/tests/python/test_experiment_7890_v684_capstone.py

    - {project_root}/tests/python/test_experiment_7877_v683_independent_audit.py

    - {project_root}/tests/python/test_experiment_7878_v683_capstone.py

    - {project_root}/scripts/publication_gate.py

    - {project_root}/scripts/audit_roadmap_gates.py

    - {project_root}/scripts/adversarial_verify.py

    - {project_root}/scripts/verdict_row_consistency_lint.py

    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md

    - {project_root}/ops/verifier_gaps.md

    - {project_root}/ops/north-star.md


    TASK:

    Independently reduce twelve outcomes and decide the PRD gaps.

    Deliverable: {project_root}/results/experiment_7902_v685_capstone.json.

    Actual compute: aggregation_from_upstream_artifacts; inference_substrate_class=no_model_load;
    MODEL_SPECS=[]; execution_venue=host.


    CONCRETE STEPS:

    1. Print a flushed start line. Validate the exact input paths, hashes, roles and
    gate operands before compute. Missing external prerequisites end as complete_blocked_*
    with verdict_class=blocked and gate_check_summary. Never use partial for unchanged
    external work.

    2. Print a flushed progress line at each phase boundary and before and after every
    model load, generation, benchmark and subprocess. Include elapsed time and completed
    units. Print inside long loops. Supervise owned children with a heartbeat every
    60 seconds or less. Keep every output gap below 600 seconds and tool waits at
    most 60 seconds. Silence can end work at 1200 seconds; continued output permits
    the 4800-second hard cap. Never pad measured duration.

    3. Write any file over about 200 lines in several tool calls of at most 150 lines.
    Send a progress message between calls. Keep all tool calls bounded, including
    analysis and file generation. Use hash-bound checkpoints. Put throwaway scripts
    in /tmp and real experiments in scripts/experiments/.

    4. Before implementation, add task-owned REQ-* and SCENARIO-* requirements to
    the applicable capability spec. Write failing tests first. Freeze the exact affected
    dependency closure, regression paths, command argv, expected exit semantics, deadlines
    and coverage includes before results. Preserve assertions, required checks, QA
    guards and historical artifacts. Do not manufacture a pass by removing a failing
    path.

    5. Reuse existing numerical and receipt primitives. Keep new entrypoints small;
    do not copy a historical experiment dispatcher or synthesize commands by replacing
    experiment numbers. Pass explicit input/output paths. Tests use private fixtures
    and output roots; they cannot read mutable live roadmap authority or overwrite
    results. Required affected validation is separate from predeclared repository-health
    diagnostics. Retain historical required failures. Read the V685 validation contract
    before selecting commands.

    6. Read actual V685 authority through the Exp7891 lifecycle mechanism or independently
    reconstruct the same design-digest check if that administrative artifact is absent.
    Never require research-roadmap-next.yaml after activation consumed it. Validate
    exactly twelve task identities and deliverables, including this capstone as an
    administrative self-row without inventing a prior result. Reject wrong IDs, hashes,
    class, model, gate spelling and incomplete per-unit accounting.

    7. For each available scientific artifact, independently recompute probabilities,
    Brier, cost, false accepts, cluster denominators and confidence intervals from
    primitive rows. Audit Exp7897 feedback timestamps, bank writes and later decisions.
    Audit Exp7898 buffer separation and monotone transform claims. Do not call the
    producer reducer to validate itself. Keep missing, flagged, disqualified and null
    evidence separate. Fixture results cannot close the oracle-distinct gap.

    8. Test reduction on private twelve-task fixtures covering absent upstream, external
    block, disqualified owned validation, valid null and inconsistent positive. Use
    historical immutable fixtures for V683 consumer regressions. Evaluate expected
    failure receipts with their declared reason, not exit_code==0 for every command.
    Run E2E-015, E2E-016 with --date {date} on BOTH routes, and E2E-017 when reducing
    those branches. Complete all required affected checks; preserve repository-wide
    debt separately.

    9. Compute stable G1-G4 using scripts/publication_gate.py --json. Emit paper_ready
    as their conjunction and unmet_gates, with no external publication. Write docs/research-notes/experiment_7902_v685_capstone.md.
    Decide each PRD gap as advanced, measured-null, blocked or disqualified from actual
    evidence. Audit every prior_failures entry and retire only identical eligible
    failure scopes without altering old artifacts. If source qualification still fails,
    recommend finishing that owned repair before another science roadmap; do not disguise
    a cascade as scientific progress. An external-only incomplete milestone gives
    complete_blocked_missing_science and verdict_class=blocked; owned check failure
    is disqualified.

    10. Run every frozen affected unit and consumer-regression command with PYTHONPATH=python:.
    and pytest -n 0 -o addopts= --no-cov. Measure unit plus real CLI success, expected-failure
    and cold-replay paths with explicit coverage data files and identical includes.
    Require nonempty measured statements and 100 percent combined coverage for every
    changed module and CLI. An expected nonzero negative-test exit passes only when
    its asserted failure reason matches. Run scoped Ruff check/format, strict mypy
    and scripts/check_spec_coverage.py on the affected files. Do not repeat an unchanged
    repository-wide diagnostic already sealed in this milestone.

    11. Run the assigned ops/e2e-test-plan.md checks. Pass --date {date} on BOTH E2E-016
    fixture and replay invocations. Declare unrelated E2Es inapplicable before running.
    Cold-reduce all claims from primitive rows with an independent reader. Preserve
    intended, completed, failed, censored and excluded units. Seal logs after child
    exit at durable hash-addressed paths; /tmp logs must be copied before publication.
    Keep raw shards below 50 MiB and tracked files below 90 MB.

    12. Validate the exact terminal candidate with scripts/adversarial_verify.py --json
    and scripts/verdict_row_consistency_lint.py --strict. Read the real reports. Required
    owned failures imply disqualified and readiness zero. Validate the resulting final
    bytes again if the verdict changes. Store validator reports as sidecars bound
    to candidate hashes. Publish only the checked bytes atomically. Never turn fixture/oracle
    agreement into independent scientific benefit.

    13. Use complete_* honest_verdict for terminal positive, circular_positive, null,
    blocked or disqualified classes. Use partial_* and partial only for unfinished
    owned work that another attempt can finish. A valid null can be ready. Reconcile
    OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve
    all historical determinations. Apply retire_if_same_verdict to an identical prior
    failure. Do not activate a roadmap, change production defaults or publish externally.


    REQUIRED ARTIFACT FIELDS:

    - experiment_id, task_id, milestone, run_date: Exact numeric ID, YAML task ID,
    2026.09.685 and {date}. Principle: Current evidence belongs to its current producer.

    - honest_verdict, verdict_class: Closed enum positive | circular_positive | null
    | blocked | disqualified | partial with matching complete_* or partial_* prefix.
    Principle: External incompleteness is terminal blocked.

    - flagged_adversarial: Boolean from exact terminal validation. Principle: Flagged
    evidence cannot open gates.

    - gate_check_summary: Every blocked_* or complete_blocked_* result names upstream
    ID, artifact path/hash, field, op, expected and observed values. Principle: Distinguish
    absent evidence, absent fields and failed values.

    - rows, sample_size_budget: Primitive family/unit/arm/seed metrics and intended,
    eligible, started, completed, failed, censored, excluded and independent counts.
    Principle: Aggregates must be recomputable without rerunning.

    - acceptance_gate_results: Separate validity, readiness, probability quality,
    decision benefit, retention and efficiency; use null when unmeasured. Principle:
    Working mechanics do not prove benefit.

    - duration_s, phase_spans, random_seed, reproducibility_checksum: Real monotonic
    timings and code/configuration/data hashes. Principle: Authenticate actual work
    without padding.

    - source_artifact_hashes, preconditions_checked, resolved_imports: Exact paths,
    hashes, exposure roles and fully qualified import locations. Principle: Preserve
    input and implementation custody.

    - validation_receipts, validation_command_manifest_path, observed_child_commands,
    historical_required_failures, repository_health: Real argv, classification, expected
    exit, actual exit, deadline, sealed log hashes and measured files. Principle:
    New evidence does not erase old failures.

    - verifier_is_oracle, claim_scope: Oracle or fixture agreement requires circular_positive;
    natural-data work remains exposed_development. Principle: Development evidence
    is not independent generalization.

    - inference_substrate, inference_substrate_class, execution_venue: Use the TASK
    declaration and host for host CPU/GPU work. When blocked_no_run, retain planned
    class separately. Principle: Actual compute determines the duration floor.

    - MODEL_SPECS, model_specs, target_model, model_invocation_counts, trained_head_specs:
    Actual pretrained models, loads/calls/tokens, or empty lists and zero calls on
    CPU tasks. Describe fitted small heads separately. Principle: Citing an LLM is
    not invoking it.

    - field_principles: Explain each task-owned field and gate. Principle: Preserve
    the reason for the contract.

    - capstone_execution_ready_score: 1 for a correct independently checked reduction
    even when science is externally blocked; else 0 for owned failure. Principle:
    Complete diagnosis and scientific success differ.

    - outcome_rows, independent_reduction_rows, gap_decisions, retirement_decisions,
    G1, G2, G3, G4, paper_ready, unmet_gates, report_path: Twelve dispositions and
    stable publication gates. Principle: Never summarize unexecuted science as evidence.


    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:.
    .venv/bin/python -u scripts/experiments/experiment_7902_v685_capstone.py --date
    {date}

    Do NOT push. Do NOT modify scripts/research_conductor.py.

