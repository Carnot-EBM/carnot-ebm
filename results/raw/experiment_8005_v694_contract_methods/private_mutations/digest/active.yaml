    labels. Reuse existing helpers and keep the implementation small.

    3. Check current primary sources for ADOWIP arXiv:2606.25068, spline locality
    2602.02056, multicalibration 2604.19592, EBT 2507.02092 and ARM-EBM 2512.15605.
    Record accessible sections, dates, implementation changes, limitations and retirement
    conflicts. Update research-studying.md and research-references.md with deduplicated
    deltas; no agent fan-out.

    4. Read V693 raw capture/checkpoint references through primary_publication readers
    and materialize durable verified copies. Preserve historical fit/tune, 64 calibration,
    256 stream and 64 retention slot IDs. Known eligible counts are 62/254/63 for
    the last three roles. All are exposed development data, not untouched validation.
    Do not reselect slots or impute missing q values.

    5. On fit/tune only, measure gradient norm, loss decrease, raw-logit distribution,
    target support, coefficient scale and decision-threshold distances. Compare the
    fixed-step baseline with an intercept-only converged diagnostic and a known responsive
    synthetic control. Evaluation-label statistics already published may be described,
    never used to tune an optimizer or roster.

    6. Freeze costs: unsupported accept=5, supported reject=1, escalate=0.5, correct
    decisions=0. Hence accept for p<0.1, reject for p>0.5 and escalate otherwise,
    with ties escalated. Freeze Brier plus decision loss as primary outcomes, 10,000
    source/block bootstrap draws, Holm correction and minimum class/group support.
    Determine whether saturation, no signal or inadequate support remains unresolved;
