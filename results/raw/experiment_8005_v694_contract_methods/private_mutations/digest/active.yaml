  gated_on: []
  agent_type: claude
  model: sonnet
  prior_failures:
  - experiment_id: exp7999-learning-causal-audit
    verdict: complete_null_learning_causal_audit
    addressed_by: Zero decision transitions now motivate a fit/tune-only conditioning
      diagnosis and a new post-release update scheduler rather than unchanged acquisition
      replay.
    retire_if_same_verdict: true
  prompt: 'CONTEXT:

    Work in {project_root} on {date}. Exp7999 measured zero selectable action changes
    in every V693 learning arm despite durable coefficient updates. Exp7996 uses a
    fixed raw-Qwen logit offset and only 200 gradient steps. Under-convergence is
    a hypothesis, not an established root cause.

    EXISTING CODE TO READ FIRST:

    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md;
    scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py;
    python/carnot/reporting/primary_publication.py; research-references.md V694 scan;
    research-studying.md; python/carnot/verify/sparse_energy_7996.py; python/carnot/verify/typed_development_7997.py;
    python/carnot/verify/qwen_energy_calibration_7972.py; results/experiment_7995_v693_qwen_development_capture.json;
    results/experiment_7999_v693_learning_causal_audit.json; scripts/sweep_clusters.py;
    scripts/sweep_semscholar.py

    TASK:

    Produce an evidence-backed conditioning diagnostic and a SOTA-to-method map before
    new fitting. Freeze the existing development cohort and roles; diagnose saturation,
    optimizer convergence and decision thresholds without selecting on evaluation
    outcomes. Deliver results/experiment_8007_v694_conditioning_diagnosis.json and
    its raw evidence under results/raw/experiment_8007_v694_conditioning_diagnosis/.
    Reuse existing implementation and validation helpers; add only a thin runnable
    entry point scripts/experiments/experiment_8007_v694_conditioning_diagnosis.py.
    Persist published raw evidence at durable paths; temporary test paths must not
    become the only checkpoint references.

