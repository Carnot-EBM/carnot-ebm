- id: exp8008-conditioned-energy-fit
  title: Train converged energy heads with explicit saturation controls
  phase: 2
  track: science
  priority: high
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 45
  per_unit_rows: true
  milestone: 2026.10.694
  deliverable: results/experiment_8008_v694_conditioned_energy_fit.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on:
  - upstream: exp8007-conditioning-diagnosis
    artifact_field: methods_ready_score
    op: ==
    value: 1
  - upstream: exp8007-conditioning-diagnosis
    artifact_field: flagged_adversarial
    op: ==
    value: false
  - upstream: exp8007-conditioning-diagnosis
    artifact_field: verdict_class
    op: in
    value:
    - positive
    - 'null'
    - circular_positive
  agent_type: claude
  model: sonnet
  prior_failures:
  - experiment_id: exp7996-sparse-energy-training
    verdict: complete_null_sparse_training
    addressed_by: Compare bounded converged optimization and centered/calibrated initialization
      with the fixed raw-logit residual baseline; freeze roles and retain equal-information
      controls.
    retire_if_same_verdict: true
  prompt: 'CONTEXT:

    Work in {project_root} on {date}. The V693 learner changed coefficients but no
    audited typed actions. This experiment tests optimizer conditioning and a calibrated
    initialization on the same information, with no new generator weights or evaluator
    inputs.

    EXISTING CODE TO READ FIRST:

    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md;
    scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py;
    python/carnot/reporting/primary_publication.py; python/carnot/verify/sparse_energy_7996.py;
    python/carnot/verify/qwen_energy_calibration_7972.py; python/carnot/verify/multivariate_energy_7982.py;
    python/carnot/models/gibbs/__init__.py; python/carnot/training/nce.py; results/experiment_8007_v694_conditioning_diagnosis.json

    TASK:

    Fit a compact binary conditional energy with centered logit input and an explicit
    calibrated intercept, then local spline residuals. Compare frozen V693, converged
    linear, intercept-only, isotonic and equal-information spline controls. Trainability
    alone does not establish benefit. Deliver results/experiment_8008_v694_conditioned_energy_fit.json
    and its raw evidence under results/raw/experiment_8008_v694_conditioned_energy_fit/.
    Reuse existing implementation and validation helpers; add only a thin runnable
    entry point scripts/experiments/experiment_8008_v694_conditioned_energy_fit.py.
