milestone: 2026.10.694
milestone_title: Decision-sensitive energy learning with bounded update budgets
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp8005-contract-methods
  title: Bind all thirteen tasks to complete immutable planning authority
  phase: 1
  track: infra
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 25
  per_unit_rows: true
  milestone: 2026.10.694
  deliverable: results/experiment_8005_v694_contract_methods.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  agent_type: claude
  model: opus
  prior_failures:
  - experiment_id: exp7992-contract-methods
    verdict: complete_blocked_authority
    addressed_by: Missing design components are supplied and locally parsed before
      activation; negative authority tests and a full-task digest replace the incomplete
      V693 document.
    retire_if_same_verdict: true
  - experiment_id: exp7940-contract-methods
    verdict: complete_blocked_authority
    addressed_by: Validate complete new V694 table, full JSON and digest; preserve
      the blocked historical authority without reconstructing it.
    retire_if_same_verdict: true
  prompt: 'CONTEXT:

    Work in {project_root} on {date}. V693 contract readiness was zero because its
    design omitted the task table, machine contract and digest. This plan supplies
    all three; the active V693 roadmap remains historical authority until normal conductor
    activation.

    EXISTING CODE TO READ FIRST:

    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md;
    scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py;
    python/carnot/reporting/primary_publication.py; python/carnot/reporting/v690_authority.py;
    python/carnot/reporting/v686_contract_methods.py; python/carnot/reporting/v685_authority_lifecycle.py;
    python/carnot/reporting/roadmap_contract.py; scripts/roadmap_schema.py; scripts/exclusion_manifest_lint.py;
    results/experiment_7992_v693_contract_methods.json; results/experiment_8004_v693_capstone.json

    TASK:

    Use the existing parameterized authority reader to bind V694 count=13, first_id=8005,
    complete task JSON and full-task digest. Freeze statistical methods and historical
    failures. This is an administrative qualification, not science. Deliver results/experiment_8005_v694_contract_methods.json
    and its raw evidence under results/raw/experiment_8005_v694_contract_methods/.
    Reuse existing implementation and validation helpers; add only a thin runnable
    entry point scripts/experiments/experiment_8005_v694_contract_methods.py. Persist
    published raw evidence at durable paths; temporary test paths must not become
    the only checkpoint references.

    CONCRETE STEPS:

    1. Emit a flushed progress line at each phase boundary and before and after model
    load, generation, every benchmark and every subprocess. Print elapsed time, unit
    counts and pending work inside long loops and at least every 60 seconds while
    children run; keep every output gap below 600 seconds. Use PYTHONUNBUFFERED=1
    and print(..., flush=True). Keep tool calls bounded; write any file over about
    200 lines in several tool calls of at most about 150 lines, with a progress message
    between calls. Do not synthesize heartbeat evidence or pad measured durations.

    2. Read the named inputs. Add task-specific REQ-* and SCENARIO-* to the relevant
    capability spec before implementation, then write failing traced tests. Freeze
    methods, role hashes, budgets and acceptance gates before exposing evaluation
    labels. Reuse existing helpers and keep the implementation small.

    3. Read the visible table, embedded JSON and staged or activated YAML independently.
    Compare exact ordered IDs, titles, phases, deliverables, MODEL_SPECS, substrate
    classes, all gates, prompts and prior_failures. Run the failure-ledger and exclusion
    readers. Do not invent staging bytes after activation; bind the active digest
    and record consumed staging as absent.

    4. Store immutable copies of the V693 design, V693 producer evidence and V694
    authority. Preserve V693 blocked verdicts. Exercise all twelve existing authority
    mutations, missing table/JSON/digest, exact gate-name mutations, direct CLI imports
    and negative cold replay in private fixtures.

    5. Preregister the fixed cost matrix, source-role exposure, class support, headroom
    tests, update budgets and multiple-comparison family specified in this design.
    A passing contract sets contract_ready_score=1 and circular_positive; it does
    not gate every science branch.

    6. Run scoped unit and consumer tests, Ruff check and format, strict mypy, and
    scripts/check_spec_coverage.py for each changed Python module; measure 100% changed-code
    statement coverage including real CLI branches. Use private output and coverage
    directories outside results/ during tests. Run the applicable E2E checks below.
    Preserve original failing assertions. Freeze actual command argv, exit codes and
    log hashes; keep any bounded repository-wide health diagnostic separate from required
    owned checks. If producer code changes after measurement, rerun affected measurement
    and terminal readers before publication. Applicable checks: E2E-018 authority
    lifecycle private CLI and mutation tests.

    7. Cold-reduce raw rows and checkpoints in a fresh process, run scripts/adversarial_verify.py
    on the exact candidate and scripts/verdict_row_consistency_lint.py --strict, then
    publish only final bytes through the existing publication helper and recheck the
    published file. Keep fixture claims circular and separate from natural evidence.
    Reconcile the relevant openspec spec, _bmad/traceability.md, ops/status.md and
    ops/changelog.md. Preserve historical primaries and failure logs; record corrections
    under this new experiment ID.

    REQUIRED ARTIFACT FIELDS:

    - experiment_id, task_id, milestone, run_date={date}, schema, claim_scope: principle:
    identify this invocation and its limits.

    - honest_verdict: use a terminal complete_* string; verdict_class: positive |
    circular_positive | null | blocked | disqualified | partial. principle: positive
    needs all claim gates; partial is only unfinished owned work, never unchanged
    external blockers.

    - gate_check_summary: list of upstream ID, path/hash, exact artifact_field, expected,
    observed and check result for every blocked prerequisite. principle: missing fields
    are contract errors; zero values are failed gates.

    - inference_substrate=aggregation_from_upstream_artifacts, inference_substrate_class=no_model_load,
    MODEL_SPECS=[], model_specs, model_invocation_counts, trained_head_specs, duration_s,
    phase_spans: principle: current calls and trained small heads differ from historical
    citations. Change inference_substrate to verifier_ensemble_against_cached_candidates
    for actual CPU scoring/training; keep no_model_load for pretrained-model-free
    work.

    - rows or per_game_results: every intended source/game/seed/condition with ID,
    arm, metric, numerator, denominator, status, exclusion and censor reason. sample_size_budget:
    intended, eligible, started, completed, excluded, failed, censored, independent;
    random_seed and reproducibility_checksum. principle: seeds and duplicated rows
    do not enlarge independent sample size.

    - verifier_is_oracle, acceptance_gate_results, genuine_headroom, positive_control_results,
    field_principles: principle: exact-oracle success is circular, and mechanism readiness
    differs from scientific benefit.

    - cited_upstream_artifacts with imported fields and hashes, raw_shard_hashes,
    code_config_hashes, checkpoint references, validation_receipts, coverage_statement_counts,
    terminal_validation_sidecar_path, flagged_adversarial: principle: preserve custody,
    actual checks and final-byte validation.

    - contract_ready_score: integer 0 or 1. principle: exact consumer field; 1 requires
    complete valid measurement and owned checks, not a positive scientific result.
    Blocked or disqualified is 0.

    - contract_rows, authority_snapshots, canonical_tasks_sha256, mutation_rows, method_freeze,
    lineage_rows: principle: inspect all thirteen executable tasks and preserve exact
    authority.

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu .venv/bin/python
    -u scripts/experiments/experiment_8005_v694_contract_methods.py --date {date}

    Do NOT push. Do NOT modify scripts/research_conductor.py.

    '
