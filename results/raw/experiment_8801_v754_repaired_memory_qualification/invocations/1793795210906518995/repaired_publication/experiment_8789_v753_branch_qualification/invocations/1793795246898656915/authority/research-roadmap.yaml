    private trees. Accept only the established literal-brace activation transformation.
    Reject mutations of prompt, gate, model, routing, prior, count, order and deliverable.
    Do not certify the old 39+25-node learning union.

    5. Freeze the NEW memory estimand before its prototype: 30 independent streams
    of 32 new canonical worlds, three nested training seeds, five arms and a fixed
    delay of eight decisions. Reset learned state between streams. Reserve 12 disjoint
    retention worlds per stream. Development is 40 fit plus 20 tuning worlds from
    exposed material. Require disjoint structural hashes and no label access before
