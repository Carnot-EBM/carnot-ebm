    TASK:
    Bind twelve tasks and freeze independent learning and verifier-transfer methods. Deliver results/experiment_8737_v749_contract_methods.json. Use thin runner scripts/experiments/experiment_8737_v749_contract_methods.py, raw evidence results/raw/experiment_8737_v749_contract_methods/ and notes docs/research-notes/v749-contract-methods.md. No LLM is needed or authorized by this task. If a new model operation is necessary, report that changed prerequisite rather than substitute a model.

    CONCRETE STEPS:
    1. Print a flushed progress line at every phase boundary, before and after each model load, generation, benchmark or subprocess that can take minutes. Emit inner-loop counts and a parent heartbeat at least every 60 seconds during long calls; keep every silence gap below 600 seconds. Poll long processes in tool calls of at most 60 seconds. Write any file over about 200 lines in several tool calls, with a progress message between calls; do not compose one huge file in one tool call. A silent task can die at 1200 seconds despite the 4800-second cap.
    2. Read the listed sources, authenticate prior evidence and check the exclusion manifest. Write or extend the task REQ-* and SCENARIO-* requirements and failing tests before implementation. Reuse existing mechanisms and thin runners. Freeze methods before looking at new outcomes; distinguish old execution evidence from new science.
    3. Bind all twelve complete task objects, visible table, deliverable paths and canonical JSON digest to this design. Accept only the existing conductor literal-brace encoding of an otherwise identical task; substantive prompt, gate, routing, omission and reorder mutations must fail. Preserve V748 historical bindings. Do not activate or rewrite the active queue.
    4. Authenticate Exp8723 collection authority and Exp8724 raw successful children separately from its failed deadline smoke. The contract task does not authorize learning. Freeze the unchanged V744 nine-input, 109-coefficient causal protocol, original 64-node execution inventory, 27 runner nodes, 83 statement anchors, and current source dependencies. learning_protocol_ready_score=1 requires complete method/input custody, not successful execution.
    5. Ingest RT4CHART v2, VerifierBench and delayed OCO 2606.11711 from the V749 reference scan. Record which assumptions transfer. Freeze two existing five-call schedules without tuning them on new defects. Specify a new constructed panel: 60 worlds, 20 each for role binding, temporal order and two-premise composition; six variants per world (correct, three legacy defects, two new composition defects). Seal 30 development and 30 evaluation worlds before results; the two new defect families never select probes. Retain answer spans, all supporting premises and true/false/unknown outcomes. Implement an independent truth enumerator, not a call to the tested verifier. Correct alternatives include reordered independent records and bijective entity renaming.
    6. Freeze five-call no-early-exit execution for both schedules, ten timed repetitions per deterministic cell, and world-cluster analysis. Intended scientific units are 60 worlds, 720 world/variant/arm rows and 3600 unique probe invocations; timing repetitions do not multiply sample size. Evaluation has 150 defective units per arm across 30 worlds, including 60 new-family units. verifier_transfer_methods_ready_score=1 requires schema, truth independence and complete predeclared roster. This method field is independent of learning readiness.
    7. Authenticate the observed resident durability limit and installed profile before locking the bounded cost and feature-reuse comparisons described in Exp8743–8745. Keep branch-specific readiness fields independent. Use private E2E-018/021 contract readers, original rejection controls and fresh full-task mutations. Stop by 1800 seconds of owned work to leave validation time.
    8. Run scoped unit tests, Ruff lint/format, strict types, relevant spec coverage and the named applicable E2E checks. Require genuine 100% coverage of new executable statements and retain real child/JUnit/coverage evidence; do not weaken tests, skip original assertions, synthesize coverage or edit shared validators to pass. Use private artifact roots for tests and inspect git status afterward. Publish only terminal validated bytes; run adversarial_verify.py, verdict_row_consistency_lint.py --strict and fresh-process cold replay against those bytes. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md with measured outcomes. Do not alter active research-roadmap.yaml, the exclusion manifest, generator weights, or the ARC policy.

    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date, invocation_id: principle: Bind a claim to its actual producer.
    honest_verdict, verdict_class: principle: Start honest_verdict with complete_; verdict_class is positive | circular_positive | null | blocked | disqualified | partial. Only incomplete owned work that a retry can finish is partial; missing or retired external inputs are blocked.
    gate_check_summary: principle: Every blocked result names the upstream, path/hash, failed check, field, operator, expected and observed values; distinguish missing file, missing field and measured zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts: principle: These tasks use no_model_load, MODEL_SPECS=[], zero LLM calls. Declare cached-verifier scoring or upstream aggregation as actually performed; record numerical training separately. Never claim GPU inference from a model name.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count: principle: Store each intended unit and arm, raw metrics, denominators and cost; repeats and siblings do not multiply independent cases.
    verifier_is_oracle, exposure_scope, independent_generalization_score: principle: Oracle-dependent positives are circular_positive; constructed or exposed data do not prove natural or hidden-game generalization.
    acceptance_gates, required_checks_passed, flagged_adversarial, validation_receipts, terminal_validation_sidecar_path: principle: Execution readiness differs from scientific benefit; a failed acceptance_gate_* cannot yield a positive verdict_class.
    preconditions_checked, started_at_utc, ended_at_utc, duration_s, phase_spans, random_seed, reproducibility_checksum: principle: Retain current invocation clocks and actual measured time, never old monotonic epochs or padding sleeps.
    source_artifact_hashes, code_config_hashes, raw_shard_hashes, cited_upstream_artifacts, field_principles: principle: Bind imported fields to exact bytes and identify numerical kernels, source versions and raw observations.
    contract_ready_score, learning_protocol_ready_score, verifier_transfer_methods_ready_score, full_task_objects, canonical_tasks_sha256, contract_mutation_rows, learning_protocol_reference, verifier_transfer_protocol_reference, literature_method_rows: principle: Freeze complete methods and independent branch gates; administrative success is not scientific evidence.

