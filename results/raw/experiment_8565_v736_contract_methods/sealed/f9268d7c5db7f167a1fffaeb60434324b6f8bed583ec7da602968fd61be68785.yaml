    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count, sample_size_budget: principle: Preserve each unit's metrics and missing reason; repeated measurements do not multiply independent evidence.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Exposed/oracle-dependent results are at most circular_positive; generalization scores remain zero.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path, adversarial_findings: principle: Qualification is separate from benefit. Failed acceptance gates forbid positive classes.
    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes: principle: Preserve real clocks and immutable operands.
    cited_upstream_artifacts, field_principles: principle: Identify original producers and explain every added metric and gate.
    current_contract_ready_score, methods_ready_score, learning_inputs_ready_score, native_inputs_ready_score, canary_inputs_ready_score, runtime_repair_ready_score, canonical_tasks_sha256, methods_protocol_reference, historical_family_receipts, closed_comparisons: principle: Each branch gets its own exact readiness field; optional resources cannot disable CPU science.
    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8565_v736_contract_methods.py --date {date}
