    4. Declare inference_substrate_class=no_model_load and MODEL_SPECS=[]. Record zero current LLM calls. Use actual CPU arithmetic or aggregation_from_upstream_artifacts as appropriate; historical generator names belong only in historical_model_provenance.
    5. Compare exactly 14 complete task objects, Exp8565 through Exp8578, between activated YAML, visible table, embedded JSON and canonical_tasks_sha256. Require full dictionary equality, including prompts, routes, gates and retirement flags. Test count/order/ID/title/phase/deliverable/model/substrate/gate/prompt/retirement/end-marker mutations. Reuse authentic activation evidence if staging was consumed.
    6. Create openspec/change-proposals/v736-methods-protocol.json before measurements. Bind preserved V735 design SHA256 f198170ac62aeb1074482f9b35dd71995f9c8f6ada4235b831958124a7dbfd15. Copy objective_updates, objective_audit, evidence_canary and arc_capability_mask numerical operands exactly from V735. Keep source-null and original native-cost protocols closed. Add separately versioned count-evidence and resident-session protocols; never rewrite historical authority.
    7. Authenticate original Exp8431 head/scaler/temperature and Exp8554 exact 158-node receipt by hashes. Reuse qualified family receipts; rerun only affected families when their source/test/dependency hashes change. Emit learning_inputs_ready_score, native_inputs_ready_score and canary_inputs_ready_score independently. Missing original authority cannot be replaced by the current roadmap.
    8. Seal the resident-session protocol: 64 stable-order test answers, batches 1 and 8, session lengths 1/4/16 panels, ten alternating paired repeats. A panel means all 64 requests. Compare process-per-panel Python/native with resident Python/native. Include launch through clean shutdown, transport, parsing, features and serialization. Session length16/batch1 is primary; other cells are descriptive. Fixed slowdown limit is 1.05 for p95 latency. No test-dependent workload choice.
    9. Read only supplied ops/cuda-runtime-repair-receipt.json through the Exp8410 reader, capped at 60 seconds. runtime_repair_ready_score=1 requires changed causal library/environment operands and real context/copy evidence. No model/device command. Keep optional runtime and board absence separate from methods_ready_score. Bind the October16 literature scan and independent historical branch receipts.
    10. Run scoped unit tests, real private CLI checks, Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Run applicable ops/e2e-test-plan.md checks, including private E2E-018 and E2E-021 for authority/publication consumers. Require 100 percent newly owned statement coverage including genuine children and rejection paths. Collect original node IDs before disjoint bounded children; retain their exact union and original authority. Use -n 0 -o addopts= --no-cov. Never run the full repository suite or a nested historical validation controller. A killed child fails validation. Retain commands, exits, durations and log hashes.
    11. Cold-replay immutable primitives in a fresh bounded process. Test absent inputs, owned failures and self-consistently rehashed tampering. Run primary_publication, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Retain all findings. Validate final bytes before atomic publication and exercise the actual downstream consumer. Do not clear old quarantines. Owned required-check failure means disqualified; unchanged external blockage means blocked, never partial. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md.
