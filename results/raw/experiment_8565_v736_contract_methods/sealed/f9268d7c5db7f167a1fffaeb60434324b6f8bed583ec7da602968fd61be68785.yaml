    TASK:
    Bind fourteen tasks and seal changed validation and resident-serving protocols. Deliver results/experiment_8565_v736_contract_methods.json. Create thin runner scripts/experiments/experiment_8565_v736_contract_methods.py, primitive evidence under results/raw/experiment_8565_v736_contract_methods/, and docs/research-notes/v736-contract-methods.md. Same-roadmap outputs are future dependencies.
    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Authenticate input hashes, original authority, tools, writable disk-backed scratch, memory and deadlines. Record missing resources in gate_check_summary. Optional CUDA and board absence must not block independent CPU work.
    2. Print a flushed progress line at every phase boundary and before and after each model load, generation, benchmark and subprocess that can take minutes. Use unbuffered output. Print completed/pending counts inside long loops. Supervise long children with status output at least every 60 seconds. Keep every gap under 600 seconds. Write files over about 200 lines in several tool calls of at most 150 lines, with a progress message between calls. Bound every tool call. Stop measurements by 3600 seconds; reserve 900 seconds for validation within the 4800-second cap. Never pad duration.
