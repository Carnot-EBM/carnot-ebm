    experiment_id, task_id, milestone, run_date: principle: Bind evidence to this invocation.
    honest_verdict, verdict_class: principle: Terminal verdicts start complete_; verdict_class is exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished owned work that a retry can finish.
