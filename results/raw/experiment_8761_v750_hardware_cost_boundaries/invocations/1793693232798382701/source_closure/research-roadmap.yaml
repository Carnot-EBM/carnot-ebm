    TASK:
    Bind fourteen tasks and isolate historical authority from the moving roadmap. Deliver results/experiment_8749_v750_archive_bound_contract.json. Use thin runner scripts/experiments/experiment_8749_v750_archive_bound_contract.py, raw evidence results/raw/experiment_8749_v750_archive_bound_contract/ and notes docs/research-notes/v750-archive-bound-contract.md. This task needs no LLM. A new model need is a changed prerequisite, not permission to substitute a model.

    CONCRETE STEPS:
    1. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark or subprocess that can take minutes. Print inner-loop counts and a parent heartbeat at least every 60 seconds during long calls. Keep every silence gap below 600 seconds. Poll long processes in tool calls of at most 60 seconds. Write any file over about 200 lines in several tool calls, with a progress message between calls. Do not compose a huge file in one tool call. Silence can end a task at 1200 seconds despite the 4800-second hard cap.
    2. Read the listed sources and check failure lineage. Confirm the task REQ-* and SCENARIO-* requirements before implementation. Write failing tests first. Freeze source, method, test-node and input hashes before measurement. Reuse existing numerical code and thin runners. Check writable private scratch, required input hashes and local tool availability before launching. External absence is blocked; owned validation failure is disqualified.
    3. Bind the visible fourteen-task table, complete JSON task objects, YAML and independent canonical SHA-256. Compare every task field, including prompts, routing, prior failures and gates. Bind each branch separately; contract readiness is administrative. Preserve V749 and V748 archives byte-for-byte.
    4. Reproduce the Exp8737 child 5 failure using private V748 fixtures and the actual original tests. Supply historical DESIGN/ACTIVE/STAGED dependencies through an isolated archived-root fixture. Keep all original assertions and the fixed V748 digest. Do not point old production readers at V750 or edit historical artifact pins. Prove tests pass with vNEXT containing V750 and reject V748 prompt, gate, route, path and hash mutations.
    5. Use the already specified distinction between scoped qualification and bounded repository health. New V750 wrappers must require all original branch test nodes, real coverage, consumer tests and E2Es. They must not inherit an all(receipts) dependency on an unrelated timed-out full-suite run. Keep its exact failure receipt under repository_health_reference. Preserve shared publishers, validators and old verdicts. Test that a failing OWNED node still zeros readiness while unrelated global health stays separately red.
    6. Freeze unchanged learning methods, partitions and statistical criteria from v744-methods-protocol.json. Freeze a reusable archived-root validation recipe. Release learning_protocol_ready_score only for complete method/source custody. Return per-branch failures separately; verifier and cost tasks authenticate their own inputs. Run private E2E-018/021 and full-object mutation controls.
    7. Run scoped unit and consumer tests, Ruff lint/format, strict mypy, explicit spec coverage and the named applicable E2E checks. Require actual 100 percent coverage of new executable statements, including real CLI children. Preserve original assertions, negative controls and shared validators. Keep tests in private artifact roots. Retain actual argv, exit codes, JUnit, coverage and full log hashes. Record existing repository-wide health separately; do not promote a failed old producer or fabricate a full-suite pass. Publish only terminal bytes after unchanged adversarial_verify.py, verdict_row_consistency_lint.py --strict and fresh-process cold replay. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Do not edit active research-roadmap.yaml, ops/exclusion_manifest.yaml, generator weights or the ARC policy.

    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date, invocation_id: principle: Bind evidence to one actual producer.
    honest_verdict, verdict_class: principle: Use complete_ as the terminal verdict prefix. The closed class is positive | circular_positive | null | blocked | disqualified | partial. Only unfinished owned work that a retry can finish is partial. Missing or retired external inputs are blocked.
    gate_check_summary: principle: Every blocked result names upstream, path/hash, failed check, field, operator, expected and observed value. Distinguish missing file, missing field, observed zero and rejected producer.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts: principle: These tasks use no_model_load, MODEL_SPECS=[] and zero LLM calls. Use aggregation_from_upstream_artifacts or verifier_ensemble_against_cached_candidates as actually performed. Record numerical training separately.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count: principle: Keep every intended unit, arm, raw metric and denominator. Seeds, siblings, representations and timing repeats do not multiply independent cases.
    verifier_is_oracle, exposure_scope, independent_generalization_score: principle: Oracle-dependent positives are circular_positive. Constructed or exposed data do not establish natural or hidden-game generalization.
    acceptance_gates, required_checks_passed, flagged_adversarial, validation_receipts, terminal_validation_sidecar_path: principle: Failed execution checks suppress readiness. A scientific null can be a completed valid measurement. Keep scientific promotion criteria separate from execution acceptance.
    preconditions_checked, started_at_utc, ended_at_utc, duration_s, phase_spans, random_seed, reproducibility_checksum: principle: Record resources, real current-invocation clocks and reproducible inputs. Do not reuse old monotonic epochs or pad duration floors.
    source_artifact_hashes, code_config_hashes, raw_shard_hashes, cited_upstream_artifacts, field_principles: principle: Bind imported fields and derived results to exact source bytes.
    repository_health_reference, scoped_validation_scope: principle: A separate historical bounded health diagnostic neither proves a full-suite pass nor overrides complete required scoped tests.
    contract_ready_score, learning_protocol_ready_score, archived_authority_ready_score, full_task_objects, canonical_tasks_sha256, historical_fixture_rows, owned_failure_controls, branch_method_references: principle: Versioned authority must survive a new roadmap without weakening any original check.

    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8749_v750_archive_bound_contract.py --date {date}

    Do NOT push. Do NOT modify scripts/research_conductor.py.
