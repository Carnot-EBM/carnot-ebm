    TASK:
    Bind twelve tasks and preserve the source null and original scientific protocols. Deliver results/experiment_8540_v734_contract_methods.json. Create thin runner scripts/experiments/experiment_8540_v734_contract_methods.py, primitive evidence under results/raw/experiment_8540_v734_contract_methods/, and docs/research-notes/v734-contract-methods.md. Same-roadmap outputs are future dependencies.
    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Authenticate original inputs, tool availability, writable disk-backed scratch, memory and deadlines before work. Record missing resources in gate_check_summary. Use original sealed historical dates and authority. Optional CUDA or board absence must not block independent CPU work.
    2. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark or subprocess that can take minutes. Use unbuffered output. Print completed and pending counts inside long loops. Supervise each child with a status line at least every 60 seconds. Keep every output gap under 600 seconds. Write any file over about 200 lines in several tool calls of at most about 150 lines, with a progress message between calls. Bound each tool call. Stop measurements by 3600 seconds and reserve at least 900 seconds for validation inside the 4800-second hard cap. Never pad duration.
    3. Spec first: ensure the relevant capability spec contains REQ-* and SCENARIO-* before implementation. Write focused failing tests first. Preserve existing tests, assertions, numerical thresholds and historical result bytes. Reuse shipped modules through explicit small adapters. Place runners in scripts/experiments/ and tests in tests/python/. Put scratch under /var/tmp. Accept --date {date}. Do not change the active roadmap, conductor, validation gates, generator weights or external services.
    4. Declare inference_substrate_class=no_model_load, MODEL_SPECS=[]. Record zero current LLM calls. Use aggregation_from_upstream_artifacts as inference_substrate. Put cached generator identities only in historical_model_provenance.
    5. Compare exactly 12 complete task objects Exp8540 through Exp8551 across the visible table, embedded JSON, canonical_tasks_sha256 and activated YAML. Require full dictionary equality, including prompts, routing, gates and retirement flags. Exercise count, order, ID, title, phase, deliverable, model, substrate, gate, prompt, retirement-flag and missing-end-marker mutations. Reuse authentic activation evidence if staging was consumed.
    6. Create openspec/change-proposals/v734-methods-protocol.json before any experiment. Preserve V733 design SHA256 cbcc949d69842d869c5516e076aaa960a010925b02bc244587eb6bd10a76e270. Copy objective_updates, objective_audit, nine_input_native_inference, evidence_canary and arc_capability_mask numerical operands exactly. Change only task bindings and separately documented validation mechanics. Preserve all original question roles, heads, thresholds, seeds and budgets.
    7. Authenticate original V726 learning heads and streams, V733 comparator inputs and original ARC qualification separately. Emit learning_inputs_ready_score, nine_input_inputs_ready_score and canary_inputs_ready_score independently. Close unchanged exposed source tuning after Exp8529; require new information or disjoint independently adjudicated questions to reopen. FaithBench is already exposed. Do not create a fresh split or fit another source head.
    8. Inspect only a supplied ops/cuda-runtime-repair-receipt.json through the shipped Exp8410 reader, at most 60 seconds. runtime_repair_ready_score=1 requires causal changed library/environment hashes plus actual context/copy evidence. No device commands, runtime rebuild or model load. Missing evidence cheaply pre-gates the canary.
    9. Bind the V734 references section and map Calibeating, delayed-capacity learning, spline locality and Z1T operation exclusions to named tasks. Keep deferred papers explicit. Read archive lag honestly: research-complete.yaml currently ends at V732, so use authenticated V733 primaries, pre-gates and conductor outcomes without modifying the archive.
    10. Run scoped unit tests, actual private CLI checks, Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Run applicable ops/e2e-test-plan.md checks, including private E2E-018 and E2E-021 for authority/publication consumers. Require 100 percent newly owned statement coverage, including real children and rejection paths. Collect original test node IDs before sharding. Preserve their exact union in disjoint bounded pytest children using -n 0 -o addopts= --no-cov. Use suite-specific original authority. Never launch a nested full historical validation runner or the full repository suite. A killed child fails validation. Preserve commands, terminal node outcomes, exit codes, durations and log hashes.
    11. Cold-replay primitive rows in a fresh bounded process. Test absent inputs, owned failures and self-consistently rehashed tampering. Run unchanged primary_publication, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Keep every finding. Validate final bytes, publish atomically, bind the terminal sidecar and exercise the actual downstream consumer. A new artifact cannot clear old flags. Owned required-check failure is disqualified. Unchanged external blockage is blocked, never partial. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md.
    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Bind evidence to this invocation.
    honest_verdict, verdict_class: principle: Terminal verdicts start complete_; the class is exactly positive | circular_positive | null | blocked | disqualified | partial. Reserve partial for unfinished owned work another attempt can complete.
    gate_check_summary: principle: Every blocked_* or complete_blocked_* outcome names check, upstream, path/hash, field, operator, expected and observed. Missing differs from zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, historical_model_provenance: principle: Separate actual model calls from imported historical outputs.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count, sample_size_budget: principle: Emit each question, arm, seed, episode or repeat metric and missing reason. Repeats do not multiply independent evidence.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle fixtures and exposed-history benefits are at most circular_positive; generalization scores remain zero for this plan.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path, adversarial_findings: principle: Qualification and scientific benefit are separate. Failed required checks forbid positive classes.
    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes: principle: Preserve real work and immutable primitive operands.
    cited_upstream_artifacts, field_principles: principle: Identify original producer hashes and explain every extra metric and gate.
    current_contract_ready_score, methods_ready_score, learning_inputs_ready_score, nine_input_inputs_ready_score, canary_inputs_ready_score, runtime_repair_ready_score, methods_protocol_reference, canonical_tasks_sha256, historical_family_receipts, closed_source_comparison, literature_mapping: principle: Independent readiness gates must not depend on favorable science or optional hardware.
    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8540_v734_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
