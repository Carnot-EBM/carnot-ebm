    TASK:

    Reconcile fourteen outcomes and decide graph and natural-evidence continuations.
    Deliver results/experiment_8984_v767_capstone.json. Add a thin runner scripts/experiments/experiment_8984_v767_capstone.py
    with --date support. Store primitives under results/raw/experiment_8984_v767_capstone/.
    Same-roadmap outputs are future dependencies, not files claimed to exist now.


    CONCRETE STEPS:

    1. PRECONDITIONS: Emit a flushed start line. Work in {project_root} on {date}.
    Read REQ-REPORT-8984 / SCENARIO-REPORT-8984-V767. Authenticate required inputs
    and declared gate fields before costly work. Check Python dependencies, writable
    disk and memory. Missing resources produce complete_blocked_<reason>, verdict_class=blocked
    and exact gate_check_summary. Optional hardware cannot block CPU branches. Historical
    inputs never become runtime requires on retired IDs.

    2. Emit a flushed progress line at each phase boundary and before and after every
    model load, generation, benchmark or subprocess that can take minutes. Use python
    -u and print(..., flush=True); forward child output. Emit completed/pending counts
    inside long loops and a parent heartbeat every 60 seconds. Keep every silence
    gap below 600 seconds, including between tool calls. Finish measurements by 3600
    seconds; reserve 900 seconds for checks within the 4800-second hard cap. Never
    pad duration.

    3. Bound every tool call and poll running commands within 60 seconds. Write any
    file over about 200 lines in several tool calls of at most 150-200 lines. Emit
    a progress message between calls. Put runners in scripts/experiments/, tests in
    tests/python/, and scratch in /tmp or /var/tmp. Never write scratch scripts to
    the repository root.

    4. Declare inference_substrate=aggregation_from_upstream_artifacts, inference_substrate_class=no_model_load,
    MODEL_SPECS=[] and zero current LLM calls. Retain historical Qwen provenance only
    under cited input references. Numerical head work has separate counters.

    5. Run unconditionally. Account for all fourteen task slots in the exact design/YAML
    order, including scheduler gate skips, absent primaries, quarantines and scientific
    nulls. Use exact producer identities, retained references and conductor gate_check_summary.
    Do not guess filenames or require a positive upstream verdict to record a terminal
    outcome.

    6. Recompute each reported detector, learning, cost and label-eligibility conclusion
    from qualified rows. Separate methods readiness, development admission, fresh
    scientific benefit, operational costs and natural-evidence access. Do not turn
    a development gate into a confirmatory result.

    7. Preserve V766:1024 answers/719 errors; all five energy bounds failed; scalar
    updates failed all three future bounds and passed retention. Archive lag, Exp8969
    scheduler skip and absent Exp8970 primary are different states. Add any later
    authenticated receipt without inventing completion evidence.

    8. If the common-feature prototype fails, close collection and explain which fixed
    method failed. If fresh energy or online gates fail, close only their exact registered
    scopes. A natural-label access block requires changed authorized source access;
    it is not a reason to retry unchanged. Do not edit the exclusion manifest from
    this task.

    9. Run scripts/publication_gate.py --json and retain G1-G4, paper_ready and unmet_gates
    with scope. The historic publication gate does not certify this milestone. Check
    the fresh literature mapping and list the strongest next experiment only where
    evidence changes prior odds. No publication, activation, purchase or push.

    10. Set reconciliation_ready_score from complete truthful accounting. Missing
    external science yields complete_blocked_<reason>, verdict_class=blocked, once;
    only unfinished owned accounting can be partial. Preserve usable independent branch
    findings even when another branch blocks.

    11. Before implementation, extend the named REQ/SCENARIO and write failing tests.
    Reuse existing helpers. Run scoped pytest with 100-percent newly owned unit and
    actual child statement coverage, with zero exclusions. Run Ruff check, Ruff format
    --check, strict mypy on owned modules, and scripts/check_spec_coverage.py with
    positional owned test paths. Run applicable private E2E-018/021 CLI publication,
    cold replay and rehashed-tamper refusal. Preserve original test assertions. Record
    unrelated global debt separately; it cannot waive a failed owned check.

    12. Recompute from immutable primitive rows in a fresh process. Run unchanged
    primary_publication, adversarial_verify.py and verdict_row_consistency_lint.py
    --strict against private candidate bytes. Preserve actual findings. Validate before
    atomic publication. Reconcile openspec/, _bmad/traceability.md, ops/status.md
    and ops/changelog.md from actual outcomes. Do not edit historical primaries, shared
    validators, active research-roadmap.yaml or the exclusion manifest.


    REQUIRED ARTIFACT FIELDS:

    experiment_id, task_id, milestone, run_date: principle: Bind results to this task
    and invocation.

    honest_verdict, verdict_class: principle: Use complete_ terminal verdicts. verdict_class
    is positive | circular_positive | null | blocked | disqualified | partial. Only
    unfinished owned work that another attempt can finish is partial. Unchanged missing,
    rejected or blocked external inputs are blocked.

    gate_check_summary: principle: Every blocked_* or complete_blocked_* names upstream,
    check, path/hash, field, operator, expected and observed. Distinguish missing
    file, missing field, zero and changed bytes.

    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts,
    numerical_training_calls: principle: Declare current work. Small-head fitting
    and historical generator provenance are separate from current LLM calls.

    rows, intended_count, completed_count, failed_count, censored_count, excluded_count,
    independent_count: principle: Keep a metric and status row for every intended
    unit and arm. Seeds, views and repeated timings are not independent questions.
    Counts must reconcile.

    verifier_is_oracle, exposure_scope, independent_generalization_score: principle:
    Oracle-backed positives are circular_positive. Exposed development results and
    graph truth cannot establish the no-cheap-oracle claim.

    acceptance_gates, field_principles, required_checks_passed, flagged_adversarial,
    owned_statement_coverage, validation_receipts: principle: Explain each field and
    acceptance gate. Failed scientific gates forbid positive classes; readiness is
    separate from benefit. Owned failures disqualify.

    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum:
    principle: Use actual clocks and reproducible inputs, never mtime estimates or
    invented work.

    source_artifact_hashes, code_config_hashes, raw_shard_hashes, cited_upstream_artifacts:
    principle: Retain original bytes with experiment_id, fields_imported and sha256
    for each imported result. Do not inherit mutable current authority.

    reconciliation_ready_score, slot_rows, actual_task_order, gate_edge_rows, branch_outcomes,
    retirement_scope_rows, continuation_evidence, publication_gate, G1, G2, G3, G4,
    paper_ready, unmet_gates: principle: Scheduling completion, historical publication
    readiness and new scientific success are different claims.


