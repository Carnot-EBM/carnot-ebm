    CLAUDE.md; CODEX.md; ops/north-star.md; ops/e2e-test-plan.md; ops/exclusion_manifest.yaml; research-references.md (V778 scan); openspec/change-proposals/research-roadmap-vNEXT.md; openspec/capabilities/research-reporting/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; python/carnot/reporting/current_work_receipt.py; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/v777_contract.py; python/carnot/reporting/v777_capstone.py; results/experiment_9110_v777_contract.json; results/experiment_9111_v777_forward_evidence.json; results/experiment_9123_v777_capstone.json; openspec/change-proposals/research-roadmap-v777-preserved-20261116.md; openspec/change-proposals/research-roadmap-v777-preserved-20261116-queue.yaml
    TASK:
    Bind fourteen tasks and preserve V777 failures. Deliver results/experiment_9124_v778_contract.json. Implement scripts/experiments/experiment_9124_v778_contract.py using existing library code. MODEL_SPECS: []. Requested inference_substrate_class: no_model_load.
    Do not load an LLM. Record current_llm_invocations=0 and generated_tokens=0. Cached upstream model evidence is historical provenance. Small numerical energy training is CPU work, not an LLM invocation.
    CONCRETE STEPS:
    1. Emit a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess that can take minutes. Emit progress inside long loops. Supervise blocking calls with flushed heartbeats every 60 seconds; keep every gap below 600 seconds. Write any file over about 200 lines in several tool calls of at most 200 lines, with a progress message between calls. Never make one huge writing call.
    2. PRECONDITIONS: Authenticate the declared upstream fields and immutable source bytes before dependent work. Check resource, import and disk limits. Missing external evidence is terminal blocked with gate_check_summary naming upstream, exact field, expected and observed values. Distinguish missing_file, missing_field and observed zero. Do not replace historical producer pins with mutable checkout hashes.
    3. Before implementation, inspect callers with rg. Confirm REQ-REPORT-9124-V778 and SCENARIO-REPORT-9124-V778. Extend the relevant specification, then write failing controls before implementation. Freeze formulas, unit rosters, exclusions and validation scope before measurement. Never change a gate or denominator after outcomes.
    4. Compare all fourteen full task objects with the visible table and embedded JSON. Require Exp9124 through Exp9137 in this order, unique first-50-character title keys, unallocated IDs and exactly declared upstream fields. Accept the existing literal-brace normalization only. Before activation compare the staged queue; afterward authenticate the active V778 queue. Never demand V778 equality from the still-active V777 queue.
    5. Authenticate Exp9110 source closure back through Exp9097 and the original producer snapshots. Preserve all 900 answers/300 qids, TRAIN150/CAL50/TEST100, three siblings, actual A2 labels and original exposure status. Freeze inference-only text/token views separately from evaluator labels. Keep all historical source roles; do not rehash changed producers to manufacture validity.
    6. Retain all fourteen V777 outcome rows, including alternate scheduler filenames and absent canonical primaries. Copy the inherited raw-logit formulas and original online roster/donor map into immutable V778 protocol references. New online input and sixth temperature arm are a separate declared study; the embedding and graph studies keep their original bounds.
    7. Freeze the owned validation manifest and source/shard rosters. Contract readiness and source readiness are separate. Carry the original receipt failure, embedding padding null, source exposure, graph custody block and hardware limits forward. Do not edit historical primaries or clear quarantine.
    8. Validate owned changes with meaningful unit tests and 100 percent owned statement coverage, including actual subprocess coverage, with zero exclusions. Run Ruff check/format, strict mypy and explicit-path scripts/check_spec_coverage.py. Run private real CLI success, refusal, tamper and cold replay outside the checkout without PYTHONPATH (E2E-018/021). Learning or recovery changes also require E2E-020. Preserve the original assertion set. Separate unrelated global-health failures from affected failures; affected failures disqualify readiness.
    9. Stop measurement by 3300 seconds and reserve 1200 seconds for verification within the 4800-second cap. Retain unfinished units and honest censor reasons. Recompute headlines from rows. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict under heartbeat supervision. Publish through primary_publication with real checker receipts; never suppress a flag or fabricate a pass. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve old primaries and exclusions. Do not activate a roadmap or publish externally.
    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: complete_*; verdict_class: positive | circular_positive | null | blocked | disqualified | partial. Only unfinished owned work is partial; unchanged absent, retired or gate-blocked inputs are blocked. Fixtures are not scientific positives. Exact-oracle gains use circular_positive.
    - gate_check_summary: check, upstream, path, sha256, artifact_field, op, expected, observed, passed; mandatory for every blocked verdict.
    - rows: unit_id, qid/group, sibling, arm/condition, seed, absolute metric, numerator, denominator, status and exclusion/censor reason. Include intended/attempted/completed/failed/censored counts, sample_size_budget and effective_independent_groups. Siblings, bootstrap draws and repeated retention are not independent new questions.
    - verifier_is_oracle, claim_scope, exposure_scope, independent_generalization_score=0. This exposed human development panel cannot close GAP-ORACLE-DISTINCT or GAP-DETECTOR-AUROC-4208. No ARC level solve is claimed.
    - MODEL_SPECS, requested_inference_substrate_class, inference_substrate_class, inference_substrate, current_llm_invocations, model_invocation_counts, generated_tokens, duration_s, random_seed, reproducibility_checksum, code_config_hashes, source_references, current_work_receipts, validation_receipts, required_checks_passed, acceptance_gates, field_principles. Explain the distinct scientific principle each important field protects.
    - contract_ready_score, source_ready_score: integer 0/1; full_task_objects, canonical_task_hash, previous_outcome_rows, source_manifest_reference, evaluator_label_reference, static_protocol_reference, online_roster_reference, shard_a_roster_reference, shard_b_roster_reference, archive_lag, closed_scope_rows.
    Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_9124_v778_contract.py --date {date}
