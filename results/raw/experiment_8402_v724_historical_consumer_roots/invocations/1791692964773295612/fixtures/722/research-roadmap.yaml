tasks:
- id: exp8374-contract-methods
  title: Freeze direct-service methods and bind fourteen task contracts
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 45
  per_unit_rows: true
  milestone: 2026.10.722
  deliverable: results/experiment_8374_v722_contract_methods.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V721 records eight executed producers, two pre-gate receipts and four absent primaries. Exp8361 qualified H1=-0.00390625 and H2=0 on exposed development data. Those frozen utility procedures are closed. Exp8362 has an analytic spline bound but no universal SciPy expit contract: actual fast-path fraction=0. Exp8368 qualified typed readers but CUDA has no authenticated change. Preserve historical results and V717/V721 protocol bytes. V722 measures a direct-evaluation service independently of the unqualified table route. Numerical parity is not semantic benefit.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; ops/exclusion_manifest.yaml; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; openspec/change-proposals/research-roadmap-vNEXT.md; openspec/change-proposals/research-roadmap-v721-preserved-20261010.md; research-references.md; research-studying.md; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/v685_authority_lifecycle.py; results/experiment_8361_v721_utility_audit_qualification.json; results/experiment_8362_v721_threshold_guard.json; results/experiment_8373_v721_capstone.json; results/experiment_8334_v719_sentence_spline_fit.json; results/experiment_8347_v720_local_consumer_qualification.json; results/experiment_8348_v720_continuous_local_learning.json; openspec/change-proposals/v717-local-learning-protocol.json
    TASK:
    Freeze direct-service methods and bind fourteen task contracts. Deliver results/experiment_8374_v722_contract_methods.json. Create thin runner scripts/experiments/experiment_8374_v722_contract_methods.py. Keep primitive evidence in results/raw/experiment_8374_v722_contract_methods/. Future producer paths are dependencies, not existing inputs.
    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Authenticate this task and each input hash. Check private disk-backed scratch, tool availability, memory and time budgets. Put missing external inputs in gate_check_summary. Never fabricate missing observations.
    2. Print a flushed progress line at every phase boundary and before and after every model load, generation, benchmark and subprocess. Print completed/pending counts inside long loops. Poll owned children at least every 60 seconds. Keep every output gap below 600 seconds, including synthesis. Use unbuffered output and bounded child deadlines within the 4800-second cap. Write any file over about 200 lines in several tool calls of at most about 150 lines. Send a progress message between calls. Never issue one huge file-writing call or pad elapsed time.
    3. Spec first: add the relevant REQ-* and SCENARIO-* before implementation. Write focused failing tests first. Preserve old assertions and validation thresholds. Reuse existing modules through small adapters. Place runners in scripts/experiments/ and throwaway probes in /tmp. Freeze validation commands before measurement. Do not modify research-roadmap.yaml.
    4. Declare no_model_load, MODEL_SPECS=[] and zero current LLM calls. Use aggregation_from_upstream_artifacts for readers, verifier_ensemble_against_cached_candidates for numeric heads, or the explicitly named no-LLM ARC runtime substrate. Small numeric training is not an LLM load.
    5. Check fourteen visible task rows, full JSON objects, canonical digest and staged YAML. Bind active authority only after activation. Authenticate the original qualified heads, direct kernel and delayed trajectory separately. Do not rerun closed H1/H2 or treat missing downstream artifacts as measured nulls.
    6. Read the V722 scan and full online KAN and KANELE methods. Record versions, URLs, hashes, assumptions and adoption limits in docs/research-notes/v722-method-ingestion.md and research-studying.md. Inspect the October Extropic research-agent update. Separate execution correctness from benefit. No generator training or vendor speedup adoption.
    7. Freeze openspec/change-proposals/v722-direct-service-protocol.json before measurements. Retain spline34 coefficients, temperature, knots, direct SciPy probability and strict .25/.75 actions. Retain the V717 learning algorithm and delay8 only for service-fidelity testing. Treat existing H1/H2 as closed exposed-development findings. No table or sigmoid certificate gates direct serving.
    8. Freeze 4096 label-free vectors, knots, threshold witnesses and nextafter neighbors; seeds11/22/33; natural96 slots including22 missing; retention windows0/32/64/96. Freeze batches1/8/32 and predictions-per-update1/8/64. Use one warmup and five distinct measured repeats. Select batch1/ratio8 natural replay as the sole primary NFR-01 cost cell. Timings and confidence intervals describe this host and workload.
    9. Freeze complete transaction stages: validation, snapshot pinning, direct scoring, delayed release, coefficient update, serialization, file and directory fsync, publication and response. Exclude model acquisition explicitly. For the separate numerical prototype freeze action thresholds at the exact binary64 value 0x1.193ea7aad030bp+0 and its negative; never call this the unchanged SciPy policy. Run private E2E-018 equality and mutation controls.
    10. Run relevant unit and consumer tests. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Require 100 percent newly owned statements, including real CLI, child and failure paths. Use pytest -n 0 -o addopts= with private disk-backed scratch. Run the applicable private E2E checks named above. Record commands, exits, durations and log hashes. Keep global repository health separate.
    11. Cold-replay primitive rows in a fresh process. Exercise valid, missing-input, deliberate-error and self-consistently rehashed tamper controls. Run unchanged primary_publication checks, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Keep every finding. Only the existing typed consumer may resolve independently recomputed informational findings. Unknown, warning and critical findings block readiness. Do not modify validators or exemptions. Publish checked terminal bytes atomically. Use disqualified for owned validation failure and blocked for unchanged external absence; partial is only retryable unfinished owned work. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. Do not update generator weights or publish externally.
    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Bind results to this exact invocation and task authority.
    honest_verdict, verdict_class: principle: Use a complete_ terminal verdict. The closed class is positive | circular_positive | null | blocked | disqualified | partial. External absence is blocked, never partial.
    gate_check_summary: principle: For every blocked_* or complete_blocked_* verdict, name the check, upstream, path/hash, field, operator, expected value and observed value. Distinguish absent from zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, historical_model_provenance: principle: Distinguish current calls from cached observations and small numeric heads.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count, sample_size_budget: principle: Preserve every intended unit and arm with its metric and missing reason. Repeated timings are not independent examples.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle-checked positives use circular_positive. Exposed, constructed and feasibility work keeps both generalization scores zero.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path, adversarial_findings: principle: Successful execution cannot imply scientific benefit.
    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes: principle: Every measurement must be reproducible from sealed operands.
    cited_upstream_artifacts, field_principles: principle: List imported fields with producer hashes. Explain every added result field.
    current_contract_ready_score, direct_inputs_ready_score, canonical_tasks_sha256: principle: Authority and numerical inputs qualify separately from historical utility.
    protocol_path, protocol_sha256, methods_manifest, historical_dispositions: principle: Freeze decisions before measurement and preserve closed scientific scopes.
    Run command: cd {project_root} && PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8374_v722_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
  - experiment_id: exp8318-contract-replay
    verdict: complete_disqualified_contract_replay
    addressed_by: Reuse qualified direct operands and immutable source aliases; bind a new direct-service contract
      without repeating failed recursive history replay.
    retire_if_same_verdict: true
  model: opus
