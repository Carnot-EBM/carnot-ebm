  priority: high
  prompt: 'CONTEXT:

    Work in {project_root} on {date}. Collect only V775 shard A,512 newly frozen identities.
    V773 A is exposed/incompletely logged and V773 B has no complete invocation inventory.
    Neither can substitute for new first-attempt evidence. A and B have distinct dispatch
    keys and independent production manifests.

    EXISTING CODE TO READ FIRST:

    CLAUDE.md; CODEX.md; research-program.md; ops/north-star.md; ops/e2e-test-plan.md;
    ops/exclusion_manifest.yaml; research-references.md (2026-11-14 V775 scan); openspec/capabilities/research-reporting/spec.md;
    scripts/experiment_template.py; python/carnot/reporting/primary_publication.py;
    python/carnot/reporting/current_work_receipt.py; python/carnot/reporting/fresh_corpus_a_9058.py;
    python/carnot/reporting/fresh_corpus_runner_9058.py; python/carnot/inference/graph_corpus_runtime_8961.py;
    python/carnot/reporting/graph_source_8931.py; python/carnot/inference/sota_models.py;
    results/experiment_9083_v775_prospective_custody.json; results/experiment_9058_v773_fresh_corpus_a.json

    TASK:

    Collect first-attempt graph shard A under custody. Deliver results/experiment_9085_v775_collect_a.json;
    implement scripts/experiments/experiment_9085_v775_collect_a.py with reusable
    library code. MODEL_SPECS: [{"hf_id": "unsloth/Qwen3.8-27B-GGUF", "quantization":
    "Q4_K_M"}]. Use cached_sota_pair() and the exact local GGUF with llama.cpp embedded
    tokenizer; pin GGUF/runtime hashes and count actual calls/tokens. Conductor owns
    GPU 0 only; GPU 1 remains reserved. No generator weight updates. Declare model_full_generation;
    duration floor is 60 seconds for real full generation; record actual time and
    never pad. Legacy small models are CPU smoke only.

    CONCRETE STEPS:

    1. PRECONDITIONS: Authenticate declared sources, producer hashes, private storage
    and exact gate fields before dependent work. Missing external inputs produce complete_blocked_<check>,
    verdict_class=blocked and gate_check_summary; never fabricate data or retry an
    unchanged external failure. Ungated accounting tasks record unavailable operands
    and continue their independent work.

    2. Emit a flushed progress line at every phase boundary and before and after any
    model load, generation, benchmark or subprocess that can take minutes. Print inside
    long loops and supervise long calls with a flushed heartbeat at least every 60
    seconds, keeping every silent gap below 600 seconds. Write files over about 200
    lines in several tool calls of at most 200 lines, with a progress message between
    calls; never send one huge file-writing call.

    3. Before implementation, use rg to inspect callers, confirm REQ-REPORT-9085-V775
    and SCENARIO-REPORT-9085-V775, extend the relevant capability spec and write failing
    tests first. Reuse existing code; preserve historical producer/test bytes, assertions
    and artifacts. Use private output roots and immutable invocation receipts. Do
    not edit the exclusion manifest or tune acceptance criteria after observing outcomes.

    4. Require custody_ready_score=1 and roster_ready_score=1 with authenticated bytes,
    not only scalar values. Verify the exact512 shard IDs,64 CAL/64 TEST/384 online,
    producer settings and unused request slots. Preflight GGUF cache, GPU0 lease/memory
    and the exact llama.cpp path before issuing any request; do not use GPU1 or silently
    fall back to CPU or another model.

    5. Use Exp9058 frozen graph question serialization, decoding seed/settings and
    token cap, changing only predeclared new identities and custody paths. Register/fsync
    every request before generation; one response per identity. Preserve exact prompts,
    raw responses, parse outcomes, actual model-load/generation/token counts, device
    telemetry and request/response hashes. Empty, invalid, timed-out and interrupted
    responses remain rows with the frozen missing-answer/error rules; never replace
    a hard sample or retry a started slot.

    6. Collect in bounded batches with progress per request and a supervisor heartbeat
    during model calls. Keep full raw graph/answer bytes in the custodian only; scorer-facing
    rows contain the frozen numeric feature schema and public opaque identity. No
    labels or generator-derived correctness claims reach scorers. Stop measurement
    at3300 seconds; seal a censored prefix without inventing the remaining rows.

    7. On restart resume only manifest slots with no authenticated start event; a
    started request without a response is terminal censored. Emit the ready score
    only when all512 intended slots and their access/invocation coverage are complete
    and the current validation passes. Otherwise preserve a terminal blocked/censored
    result and exact denominator; do not merge new requests into a historical primary.

    8. Freeze owned/direct-consumer validation commands before measurement. Run scoped
    pytest with 100 percent newly owned statements and zero exclusions, scoped Ruff
    check/format, strict mypy, explicit-path spec coverage, private actual CLI success/block/tamper/cold
    replay outside the checkout without PYTHONPATH, and applicable E2E-018/021; learning/recovery
    also runs E2E-020. Reserve 1200 seconds for validation; stop measurement by 3300
    seconds within the 4800-second cap. Preserve broader historical failures separately;
    a failed current affected-consumer check disqualifies.

    9. Retain primitive per-unit rows and hashed raw receipts; recompute headlines
    from those rows. Run unchanged adversarial_verify.py and strict verdict_row_consistency_lint.py
    under heartbeat supervision. Publish via primary_publication only after owned
    checks pass, zero readiness on failed checks, and reconcile openspec/, _bmad/traceability.md,
    ops/status.md and ops/changelog.md. No roadmap activation or external publication.

    REQUIRED ARTIFACT FIELDS:

    - honest_verdict: complete_*; verdict_class: positive | circular_positive | null
    | blocked | disqualified | partial. Only unfinished owned work may be partial;
    unchanged external failure is terminal blocked.

    - gate_check_summary: list of check/upstream/path/sha256/artifact_field/op/expected/observed/passed;
    distinguish missing_file, missing_field and observed zero; required for every
    blocked result.

    - verifier_is_oracle, claim_scope, exposure_scope, independent_generalization_score=0.
    Exact graph labels imply verifier_is_oracle=true and any graph success is circular_positive.
    Human LPHB remains exposed development; no independent/generalized claim.

    - rows: per-unit identity, arm/condition, family/group, seed, absolute metric,
    numerator, denominator, status, censor/exclusion reason; intended/attempted/completed/failed/censored
    counts and effective independent groups. Seeds, repeats and predictions do not
    multiply independent units.

    - MODEL_SPECS, inference_substrate_class, current_llm_invocations, code_config_hashes,
    source_references, current_work_receipts, duration_s, validation_receipts, required_checks_passed,
    acceptance_gates, field_principles. Readiness is an integer 0/1 qualified by actual
    checks, never a renamed score.

    - a_collection_ready_score, source_shard="A", request_manifest_reference, response_manifest_reference,
    authenticated_access_manifest_reference, invocation_inventory_reference, roster_reference,
    raw_response_references, first_attempt_count, emitted_tokens, actual_gpu_layers,
    gpu_lease_reference.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_9085_v775_collect_a.py
    --date {date}

    Do NOT push. Do NOT modify scripts/research_conductor.py.'
  requires_gpu: true
  title: 'Exp9085: Collect first-attempt graph shard A under custody'
  track: research
