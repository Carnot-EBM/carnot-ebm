    CLAUDE.md; CODEX.md; ops/north-star.md; ops/e2e-test-plan.md; ops/exclusion_manifest.yaml; research-references.md (2026-11-16 V780 scan); openspec/change-proposals/research-roadmap-vNEXT.md; openspec/capabilities/research-reporting/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; python/carnot/reporting/current_work_receipt.py; python/carnot/reporting/v778_contract.py; python/carnot/reporting/v778_capstone.py; python/carnot/reporting/logit_methods_9126.py; python/carnot/reporting/online_methods_9132.py; results/experiment_9124_v778_contract.json; results/experiment_9125_v778_receipt_qualification.json; results/experiment_9126_v778_logit_methods.json; results/experiment_9132_v778_online_methods.json; results/experiment_9137_v778_capstone.json; openspec/change-proposals/research-roadmap-v778-preserved-20261116.md; python/carnot/reporting/v779_contract.py; python/carnot/reporting/v779_capstone.py; results/experiment_9138_v779_contract.json; results/experiment_9139_v779_validation_schedule.json; results/experiment_9140_v779_forward_qualification.json; results/experiment_9141_v779_human_contrast_audit.json; results/experiment_9151_v779_capstone.json; openspec/change-proposals/research-roadmap-v779-preserved-20261116.md; openspec/change-proposals/research-roadmap-v779-queue-preserved-20261116.yaml
    TASK:
    Bind fourteen tasks and preserve qualified human methods. Deliver results/experiment_9152_v780_contract.json. Implement scripts/experiments/experiment_9152_v780_contract.py using the existing library paths. MODEL_SPECS: []. Requested inference_substrate_class: no_model_load.
    Do not load an LLM. Record current_llm_invocations=0 and generated_tokens=0. Small numerical energy fitting is CPU work. Historical model provenance stays in source_references.
    CONTINUATION BOUNDARY:
    The V780 continuation changes validation cost accounting and execution partition size only. Keep original historical authority and scientific thresholds. All model runs use frozen unsloth/Qwen3.8-27B-GGUF; no generator weight updates.
    CONCRETE STEPS:
    1. Emit a flushed progress line at each phase boundary. Emit before and after every model load, generation, benchmark and subprocess that can take minutes. Print progress inside long loops. Supervise blocking calls with flushed heartbeats every 60 seconds. Keep every silence gap below 600 seconds. Write any file over about 200 lines in several tool calls of at most 200 lines. Send a progress message between writing calls. Never use one huge tool call.
    2. PRECONDITIONS: Authenticate required artifacts and their exact gate fields before dependent work. Check imports, resource limits and private disk space. Keep missing_file, missing_field and observed zero distinct. Missing external inputs produce terminal blocked evidence with gate_check_summary. Never repin historical evidence to mutable checkout code.
    3. Before implementation, inspect all callers with rg. Confirm REQ-REPORT-9152-V780 and SCENARIO-REPORT-9152-V780. Extend the specification first. Write failing controls before code. Freeze units, formulas, exclusions and validation scope before outcomes.
    4. Bind exactly fourteen full task objects, Exp9152 through Exp9165, in design and YAML order. Hash prompts, gates, deliverables and model metadata. Authenticate preserved V779 design and queue bytes. Distinguish completion-archive lag from absent scientific evidence. Do not activate either queue.
    5. Authenticate original human authority: 900 answers, 300 qids, TRAIN150/CAL50/TEST100, three siblings each. Preserve labels in evaluator-only views. Replace only execution partitions: three lexical100-qid rosters, A indices0:100, B100:200, C200:300, all siblings. Prove their disjoint union equals both original shards. Retain exposed-development status and independent_generalization_score=0.
    6. Reuse Exp9126 static and Exp9132 online qualification under original producer authority. Reuse Exp9141 human-mask and contrast protocol without rerunning its analysis. Keep all five static arms, six online arms, two static bounds and seven learning bounds. Emit separate source_ready_score, static_methods_ready_score and online_methods_ready_score. Freeze the V780 scale/ranking diagnostic before outcomes. Administrative contract readiness does not certify science.
    7. Preserve failed primaries and quarantines. Retire the exact sum-of-ceilings schedule, never its original test obligations. Record 621 original nodes plus53 V779 additions, of which Exp9140 completed only23 newly owned nodes. Unknown slow-child cost stays unknown. New authority must bind measured durations separately from watchdog limits and cannot reinterpret historical receipts.
    8. Run meaningful owned unit tests and actual child-process coverage with 100 percent owned statements and zero exclusions. Preserve original assertions. Run Ruff check/format, strict mypy and explicit-path scripts/check_spec_coverage.py. Execute private real CLI success, refusal, tamper and cold replay outside the checkout without PYTHONPATH, following E2E-018/021. Learning/recovery changes also require E2E-020. Separate unrelated repository health from affected failures. Affected failures disqualify readiness.
    9. Stop measurement by 3300 seconds. Reserve 1200 seconds for final verification and300 seconds for publication within the4800-second hard cap. Count each required check once; separate actual elapsed time from its watchdog ceiling. Save unfinished units and censor reasons. Recompute claims from rows. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict with heartbeats. Publish only through primary_publication after actual checker receipts pass. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve historical primaries, quarantines and exclusions. Do not activate a roadmap or publish externally.
    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: complete_*; principle: A terminal prefix records the actual outcome without inducing a spurious retry.
    - verdict_class: positive | circular_positive | null | blocked | disqualified | partial; principle: Only unfinished owned work uses partial. Absent, retired or blocked external inputs use blocked. Fixtures never establish scientific benefit.
    - gate_check_summary: list of check, upstream, path, sha256, artifact_field, op, expected, observed, passed; principle: Every blocked verdict names the failed operand. Missing files and fields are contract failures, distinct from observed zero.
    - rows: unit_id, qid/group, sibling, arm/condition, seed, absolute metric, numerator, denominator, status, exclusion_reason and censor_reason; principle: Every comparison can be recomputed at its actual independent unit.
    - sample_size_budget: intended, attempted, completed, failed, censored and effective_independent_groups; principle: Siblings, repeated retention and resamples cannot inflate the sample size.
    - verifier_is_oracle: boolean; principle: Executable truth reused as the verifier is circular_positive, never an independent verifier win.
    - claim_scope: include exposure_scope and independent_generalization_score=0; principle: This exposed human panel cannot close GAP-ORACLE-DISTINCT or GAP-DETECTOR-AUROC-4208. No ARC solve is claimed.
    - MODEL_SPECS: actual requested model list with invocation status; principle: Named upstream models cannot masquerade as current inference.
    - inference_substrate_class: actual work class plus requested_inference_substrate_class; principle: No-load refusals use blocked_no_run. A failed attempted load is still an attempted load. No artificial duration padding.
    - inference_substrate: operation-accurate declaration; principle: Cached reduction, live forward work and generation have different evidentiary costs.
    - model_invocation_counts: current_llm_invocations, loads attempted/completed/failed, forward calls and generated_tokens; principle: Current compute counters must agree with operation-specific receipts.
    - duration_s: measured wall time; principle: Real process timing bounds throughput claims and detects invented compute.
    - random_seed: fixed before measurement; principle: Seeds make the planned comparisons reproducible.
    - reproducibility_checksum: input and configuration digest; principle: Changed evidence must not pass as the same experiment.
    - source_references: producer path, SHA256 and imported fields; principle: Original evidence authority survives mutable checkout changes.
    - code_config_hashes: owned implementation, tests and configuration references; principle: Validation qualifies the exact executed revision.
    - current_work_receipts: actual operation-specific receipts; principle: Scripted counters and historical work cannot qualify a current model run.
    - validation_receipts: commands, logs, exit status and coverage references; principle: Readiness depends on executed checks, not self-reported success.
    - required_checks_passed: boolean; principle: Incomplete or failing affected checks cannot produce readiness.
    - acceptance_gates: fixed conditions with one-line principle annotations; principle: Outcome-dependent thresholds cannot manufacture success.
    - contract_ready_score: integer 0/1; principle: Complete task equality is independent of data availability.
    - source_ready_score: integer 0/1; principle: Original labels and all question roles must authenticate.
    - static_methods_ready_score: integer 0/1; principle: Static methods can be reused only under original authority.
    - online_methods_ready_score: integer 0/1; principle: Reuse must retain all six arms and exact delayed-update semantics.
    - full_task_objects: include canonical_task_hash and previous_outcome_rows; principle: Scheduling completion cannot be confused with scientific success.
    - protocol_references: source_manifest_reference, evaluator_label_reference, static_protocol_reference, online_protocol_reference and shard roster references; principle: Consumers share immutable, identically named inputs.
    - diagnostic_protocol_reference: inherited Exp9141 masks plus V780 scale/ranking definitions; principle: Descriptive analysis must be fixed before inspecting predictions.
    - shard_c_roster_reference: lexical qids200:300, all siblings; principle: Smaller execution units preserve the original full population.
    Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_9152_v780_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
