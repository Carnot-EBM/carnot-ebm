    - publication_gate: G1,G2,G3,G4,paper_ready,unmet_gates,publication_scope,current_science_paper_ready=false; principle: Historical publication readiness cannot certify this new science.
    - continuation_decisions: retirements, exact changed prerequisites and open gaps; principle: An unchanged failure cannot become another experiment.
