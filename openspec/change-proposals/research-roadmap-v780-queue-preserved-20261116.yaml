tasks:
- id: exp9152-contract
  title: 'Exp9152: Bind fourteen tasks and preserve qualified human methods'
  phase: 1
  track: research
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 55
  per_unit_rows: true
  milestone: 2026.11.780
  deliverable: results/experiment_9152_v780_contract.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V779 qualified source and method reuse plus human-label diagnostics. Exp9140 refused a 27880.142389-second sum of safety ceilings; it did not measure complete runtime. V779 collected no logit corpus. Preserve its exact retired schedule scope.
