    Milestone .594 blocked before science. Exp6802 named the nonexistent capability path
    openspec/capabilities/agentic-verification/spec.md. Exp6803 then honored the false readiness
    field, and the conductor skipped Exp6804 through Exp6809. The design document also described
    five tasks that were absent from the active YAML. Repair the owned contracts and prove that the
    V595 design, active manifest, gate fields, and deliverables agree. This is infrastructure
    evidence only.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md and {project_root}/_bmad/prd.md, FR11 and FR12
