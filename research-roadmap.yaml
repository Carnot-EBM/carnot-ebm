- id: exp377-fix-retro015-gpu-session-startup
  milestone: 2026.06.03
  deliverable: results/experiment_377_gpu_session_fix.json
  title: 'Exp 377: Fix RETRO-015 — session_startup.sh auto-sources GPU env, LiveGPUGate'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-015 is the highest-priority item in Carnot\
    \ history — FOUR consecutive\nmilestones (2026.05.06, 2026.05.13, 2026.05.20, 2026.05.27) produced zero live GPU\nresults because CARNOT_FORCE_LIVE=1 was never exported into conductor subprocess\nenvironments.\
    \ The hardware has been confirmed ready since Exp 352 (is_live_capable=True).\nExp 365 created scripts/conductor_gpu_env.sh with \"export CARNOT_FORCE_LIVE=1\" but never\nwired it into the conductor\
    \ launch sequence.\n\nThe fix strategy:\n1. Create scripts/session_startup.sh — sourced at conductor session start. This script:\n   - Sources scripts/conductor_gpu_env.sh (which exports CARNOT_FORCE_LIVE=1)\n\
    \   - Exports CARNOT_FORCE_LIVE=1 directly as a belt-and-suspenders measure\n   - Prints a human-readable confirmation line: \"[session_startup] CARNOT_FORCE_LIVE=1 exported\"\n2. Implement LiveGPUGate\
    \ in python/carnot/pipeline/live_gpu_gate.py — a hard gate that\n   ALL GPU experiments call at their start. If CARNOT_FORCE_LIVE != \"1\" or GPU is not\n   confirmed live, it raises RuntimeError immediately.\
    \ This makes failures loud and fast.\n3. Implement a subprocess propagation test: spawn a subprocess, verify the env var inherits.\n   This is the PROOF that the fix actually works, not just that the\
    \ script exists.\n\nEXISTING CODE TO READ FIRST:\n- scripts/conductor_gpu_env.sh — the env script from Exp 365\n- python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu() (Exp 352)\n- python/carnot/pipeline/smoke_test.py\
    \ — SmokeTestResult (Exp 353)\n- scripts/experiment_template.py — ExperimentTemplate patterns\n- results/experiment_365_retro_close.json — RETRO-012 close status\n\nTASK: Fix RETRO-015 by creating session_startup.sh\
    \ and LiveGPUGate.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-INFRA-017 (session startup must export CARNOT_FORCE_LIVE=1 before GPU experiments),\n   REQ-INFRA-018 (LiveGPUGate must be called\
    \ at start of any GPU experiment),\n   SCENARIO-INFRA-019/020/021 to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Write tests FIRST (100% coverage required) for:\n   - LiveGPUGate: check_env_var()\
    \ → bool; check_gpu_live() → bool;\n     require_live(model_ids=[]) → None (raises RuntimeError if either check fails)\n   - LiveGPUGate.require_live_or_blocked(tmpl, model_ids) → dict | None:\n   \
    \  returns blocked artifact dict if not live (for experiments that prefer blocked to raising)\n   - verify_subprocess_env_propagation(env_var=\"CARNOT_FORCE_LIVE\") → bool:\n     spawns subprocess with\
    \ current env, checks var is present\n   - build_session_startup_script(project_root) → str: returns the shell script content\n   - check_session_startup_exists(project_root) → bool\n4. Implement scripts/session_startup.sh:\n\
    \   #!/usr/bin/env bash\n   # Source this at the start of a conductor session to propagate GPU env variables.\n   # RETRO-015 fix: ensures CARNOT_FORCE_LIVE=1 is inherited by all subprocesses.\n   set\
    \ -euo pipefail\n   SCRIPT_DIR=\"$(cd \"$(dirname \"$({BASH_SOURCE[0])}\")\" && pwd)\"\n   if [ -f \"$SCRIPT_DIR/conductor_gpu_env.sh\" ]; then\n     source \"$SCRIPT_DIR/conductor_gpu_env.sh\"\n  \
    \ fi\n   export CARNOT_FORCE_LIVE=1\n   echo \"[session_startup] CARNOT_FORCE_LIVE=1 exported at $(date -u +%Y-%m-%dT%H:%M:%SZ)\"\n5. Implement python/carnot/pipeline/live_gpu_gate.py:\n   - LiveGPUGate\
    \ dataclass or class (stateless — all methods are static/class methods)\n   - check_env_var() → bool: returns True iff os.environ.get(\"CARNOT_FORCE_LIVE\") == \"1\"\n   - check_gpu_live() → bool: calls\
    \ diagnose_live_gpu() from Exp 352; returns is_live_capable\n   - require_live(model_ids=[]) → None: calls check_env_var() + check_gpu_live(); raises\n     RuntimeError(\"LiveGPUGate: CARNOT_FORCE_LIVE\
    \ not set — source scripts/session_startup.sh\")\n     if env var missing; RuntimeError(\"LiveGPUGate: GPU not live — is_live_capable=False\") if GPU\n     not ready. model_ids optionally used by check_gpu_live\
    \ for model-loadability check.\n   - require_live_or_blocked(tmpl, model_ids) → dict | None: calls require_live();\n     on RuntimeError, returns tmpl.build_result(({)}, status=\"blocked\",\n     blocked_reason=str(e))\
    \ so the caller can write the artifact and exit cleanly.\n   - verify_subprocess_env_propagation(env_var=\"CARNOT_FORCE_LIVE\") → bool:\n     runs subprocess.run([\"python3\", \"-c\", f\"import os;\
    \ print(os.environ.get('({env_var)}', ''))\"],\n     env=os.environ, capture_output=True, text=True); returns \"1\" in result.stdout\n6. Export LiveGPUGate from carnot.pipeline.__init__.\n7. Write scripts/experiment_377_gpu_session_fix.py\
    \ using ExperimentTemplate(377):\n   a. CPU-only experiment. No GPU needed (testing env propagation, not inference).\n   b. Read scripts/conductor_gpu_env.sh — verify CARNOT_FORCE_LIVE=1 present.\n\
    \   c. Read scripts/session_startup.sh — verify it sources conductor_gpu_env.sh.\n   d. Call LiveGPUGate.check_env_var() — records whether var is currently set.\n   e. Call LiveGPUGate.verify_subprocess_env_propagation()\
    \ — subprocess inherits env.\n   f. Call diagnose_live_gpu() — records is_live_capable (hardware state, not this fix).\n   g. Record: env_var_set, subprocess_inherits_env, session_startup_exists,\n\
    \      conductor_gpu_env_exists, is_live_capable, retro_015_infrastructure_fixed.\n   h. retro_015_infrastructure_fixed = env_var_set AND subprocess_inherits_env\n      AND session_startup_exists AND\
    \ conductor_gpu_env_exists\n      (Note: is_live_capable may be False in CI — that is not a failure of this fix)\n   i. Build artifact: schema=\"carnot.gpu_session_fix.v1\", all fields above, honest_verdict:\n\
    \      \"infrastructure_fixed\" when retro_015_infrastructure_fixed=True;\n      \"env_propagation_failed\" when subprocess_inherits_env=False;\n      \"scripts_missing\" when session_startup_exists=False\
    \ or conductor_gpu_env_exists=False\n   j. Output: results/experiment_377_gpu_session_fix.json\n8. Write tests/python/test_experiment_377_gpu_session_fix.py (100% coverage required).\n9. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n10. Reconcile: update ops/conductor-log.md with RETRO-015 status,\n    ops/changelog.md, ops/status.md. Mark RETRO-015 CLOSED if infrastructure_fixed=True.\nRun:\
    \ JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"
- id: exp378-cikan-reimplementation
  milestone: 2026.06.03
  deliverable: python/carnot/models/cikan_energy.py
  title: 'Exp 378: Fix RETRO-018 — CIKANEnergy proper Python implementation'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-018 — Exp 375 created python/carnot/models/cikan_energy.py\
    \ but it contains\nJSON artifact data, not Python code. The file must be completely replaced with a proper\nPython implementation of the CIKAN (Constraint-Informed KAN) energy tier.\n\narXiv 2412.03710\
    \ (CIKAN): Extends KAN with hard constraint priors baked into spline\nactivations. Instead of learning arbitrary spline shapes, CIKAN seeds each edge's spline\nwith known constraint boundaries — regions\
    \ that violate constraints have infinite energy.\n\narXiv 2602.07518 (Physical Analog KAN): Shows that KAN spline activations can be\nimplemented in silicon using Reconfigurable Nonlinear-Processing\
    \ Units (RNPUs). Each\nConstraintBoundary maps to one RNPU saturation voltage: crossing the boundary drives output\nto saturation (effectively infinite energy). System-level result: ~250 pJ/inference,\n\
    ~600 ns latency — 10^2-10^3x cheaper than GPU MLP.\n\nWHY THIS MATTERS: CIKAN is the first Carnot energy tier with a documented path from\nPython → FPGA LUT saturation points → aKAN silicon RNPU. This\
    \ is the Phase 2 hardware\npath and the Tier 4 adaptive structure mechanism.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/models/kan.py — KANEnergy, KANSpline, KANLayer (existing KAN tier)\n- python/carnot/verify/energy.py\
    \ — ConstraintTerm protocol, ComposedEnergy\n- python/carnot/models/__init__.py — model exports\n- tests/python/test_kan.py — KAN test patterns to follow\n- python/carnot/models/cikan_energy.py — CURRENT\
    \ FILE (contains JSON, must be rewritten)\n\nTASK: Re-implement CIKANEnergy as a constrained KAN subclass.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-ENERGY-010 (CIKAN energy tier with constraint-seeded\
    \ splines),\n   REQ-ENERGY-011 (constraint boundaries produce infinite energy barrier at boundary crossing),\n   REQ-ENERGY-012 (CIKANEnergy.energy() is always non-negative),\n   SCENARIO-ENERGY-015/016/017\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Write tests FIRST (100% coverage required) for:\n   - ConstraintBoundary: dataclass (variable_idx: int, boundary_value: float,\n     boundary_type:\
    \ Literal[\"lower_bound\", \"upper_bound\", \"equality\"])\n   - seed_spline_from_constraint(spline: KANSpline, boundary: ConstraintBoundary) → KANSpline:\n     places a knot at boundary_value; energy\
    \ approaches +inf as activation crosses boundary\n     (saturation behavior); returns modified spline with same interface\n   - CIKANEnergy(n_vars: int, n_hidden: int, constraint_boundaries: list[ConstraintBoundary])\n\
    \   - CIKANEnergy inherits KANEnergy OR wraps it (pick the approach with less coupling)\n   - CIKANEnergy.energy(x) → float: always >= 0 (test: energy on 1000 random configs >= 0)\n   - CIKANEnergy.from_constraints(constraints:\
    \ list[ConstraintTerm]) → CIKANEnergy:\n     classmethod that extracts variable indices and boundary values from arithmetic constraints\n   - CIKANEnergy._boundary_penalty(x: jnp.ndarray) → float: returns\
    \ sum of penalties for\n     each boundary crossing: penalty = (crossing_amount)^2 * 1e6 (large but finite)\n   - CIKANEnergy.energy_separation_ratio(satisfying, violating) → float:\n     mean_energy(violating)\
    \ / max(mean_energy(satisfying), 1e-6)\n   - CIKANEnergy.save(path) / load(path) via safetensors\n   - HARDWARE DOCSTRING: Each ConstraintBoundary maps to one RNPU saturation voltage in\n     Physical\
    \ Analog KAN silicon (arXiv 2602.07518). FPGA compilation: each boundary\n     becomes a LUT saturation point. Hardware cannot output configurations crossing boundaries.\n4. Implement python/carnot/models/cikan_energy.py\
    \ (complete rewrite):\n   - ConstraintBoundary dataclass with validation\n   - seed_spline_from_constraint — modifies KANSpline knot placement\n   - CIKANEnergy class with energy(), from_constraints(),\
    \ _boundary_penalty(), save(), load()\n   - energy_separation_ratio() convenience method\n   - Verbose docstrings explaining WHY (not just what)\n   - Do NOT preserve any of the existing JSON content\n\
    5. Export CIKANEnergy, ConstraintBoundary from carnot.models.__init__.\n6. Write scripts/experiment_378_cikan_energy.py using ExperimentTemplate(378):\n   a. Create arithmetic constraint: x0 + x1 =\
    \ x2 (carry-check style, boundary at exact sum)\n   b. Instantiate CIKANEnergy.from_constraints([arithmetic_constraint])\n   c. Sample 100 satisfying configs (x0+x1 == x2) and 100 violating (x0+x1 !=\
    \ x2)\n   d. Compute mean_energy_satisfying, mean_energy_violating, energy_separation_ratio\n   e. Instantiate standard KANEnergy with same n_vars, n_hidden, compare separation ratio\n   f. cikan_vs_kan_ratio\
    \ = cikan_separation / max(kan_separation, 1e-6)\n   g. Build artifact: schema=\"carnot.cikan_energy.v1\",\n      n_satisfying=100, n_violating=100, mean_energy_satisfying, mean_energy_violating,\n\
    \      energy_separation_ratio, cikan_vs_kan_ratio, n_constraint_boundaries_used,\n      hardware_path_note=\"Each ConstraintBoundary → 1 RNPU saturation point (arXiv 2602.07518)\"\n   h. honest_verdict=\"\
    structural_prevention\" when separation_ratio > 5.0;\n      \"partial_separation\" when 1.0 < ratio <= 5.0; \"no_separation\" when ratio <= 1.0\n   i. Output: results/experiment_378_cikan_energy.json\n\
    7. Write tests/python/test_cikan_energy.py (100% coverage required).\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n9. Reconcile: update ops/conductor-log.md with CIKAN status (RETRO-018\
    \ CLOSED),\n   ops/changelog.md, ops/status.md, _bmad/architecture.md (CIKANEnergy in model tiers).\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"
- id: exp379-precision-pipeline-live-execute
  milestone: 2026.06.03
  deliverable: results/experiment_379_precision_execute.json
  title: 'Exp 379: Live precision pipeline execution — 200 GSM8K, 5 variants, 2 models'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code style requirements.\nToday's date: {date}.\n\nCONTEXT: scripts/experiment_368_precision_live.py is a complete,\
    \ tested benchmark script\n(74 tests pass) that runs 200 GSM8K questions across 5 pipeline variants × 2 models with\na hard CARNOT_FORCE_LIVE=1 gate. It was blocked in milestone 2026.05.27 because the\
    \ env\nvar was never set. Exp 377 (this milestone) fixed the session startup to set the env var.\n\nThis experiment EXECUTES the Exp 368 pipeline logic as a new experiment with a new\ndeliverable path.\
    \ It does NOT rewrite the script — it reads the existing code, creates a\nthin wrapper that sources the GPU env and runs the existing pipeline modules, then validates\nthe output.\n\nThe 5 pipeline\
    \ variants: BASELINE, CONFIDENCE_ONLY, CONFIDENCE_ADAPTIVE,\nCONFIDENCE_ADAPTIVE_VERGE, FULL_STACK.\nModels: Gemma4-E4B-it (GPU0), Qwen3.5-0.8B (GPU1).\n\nIMPORTANT: If CARNOT_FORCE_LIVE=1 is not set,\
    \ produce a blocked artifact and stop.\nDo not fall through to simulated mode. Blocked is better than fake numbers.\n\nEXISTING CODE TO READ FIRST:\n- scripts/experiment_368_precision_live.py — the\
    \ existing pipeline script (READ CAREFULLY)\n- python/carnot/pipeline/precision_benchmark.py — PrecisionStackResult, PipelineVariant\n- python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate (from Exp\
    \ 377)\n- python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu()\n- scripts/experiment_template.py — ExperimentTemplate.setup_gpu()\n- results/experiment_377_gpu_session_fix.json — confirms\
    \ env fix status\n\nTASK: Execute the precision pipeline benchmark with live GPU.\n1. Read CLAUDE.md spec-first workflow.\n2. No new spec changes needed (REQ-BENCH-003, SCENARIO-BENCH-007/008/009 from\
    \ Exp 340\n   cover this; SCENARIO-BENCH-020 from Exp 368 covers the live_gpu_confirmed criterion).\n3. Write tests FIRST (100% coverage required) for any NEW helper functions in this script.\n   Do\
    \ not rewrite Exp 368 tests. Test the wrapper functions only.\n4. Implement scripts/experiment_379_precision_execute.py:\n   a. ExperimentTemplate(379, \"Live precision pipeline execution\",\n     \
    \ \"results/experiment_379_precision_execute.json\", requires_gpu=True)\n   b. tmpl.setup()\n   c. blocked = LiveGPUGate.require_live_or_blocked(tmpl, [\"google/gemma-4-E4B-it\",\n      \"Qwen/Qwen3.5-0.8B\"\
    ])\n      If blocked is not None: write blocked artifact, exit.\n   d. gpu_status = tmpl.setup_gpu([({\"name\": \"Gemma4-E4B-it\", \"hf_id\": \"google/gemma-4-E4B-it\",\n      \"gpu\": 0)}, ({\"name\"\
    : \"Qwen3.5-0.8B\", \"hf_id\": \"Qwen/Qwen3.5-0.8B\", \"gpu\": 1)}])\n      If not gpu_status[\"all_healthy\"]: write blocked artifact, exit.\n   e. Import and call the precision benchmark pipeline\
    \ code from experiment_368 modules\n      (do NOT call subprocess — import the functions directly):\n      - from python.carnot.pipeline.precision_benchmark import (\n          PipelineVariant, PrecisionStackResult,\
    \ build_precision_benchmark_artifact)\n      - Run 200 GSM8K questions per model per variant (BatchedInferenceRunner, batch_size=8)\n      - Checkpoint every 50 questions via tmpl.checkpoint_save()\n\
    \   f. Use LLMExtractor (from Exp 366) with live Qwen3.5-0.8B as extractor for IT-format\n      variants (replaces ArithmeticExtractor for Gemma4-E4B-it outputs)\n   g. Build artifact: schema=\"carnot.precision_benchmark.v2\"\
    ,\n      n_questions=200, n_models=2, n_variants=5,\n      per_variant_results (list of PrecisionStackResult),\n      headline_result (FULL_STACK on Gemma4-E4B-it: baseline_accuracy, stack_accuracy,\n\
    \      signed_improvement), inference_mode (must be \"live_gpu\"),\n      honest_verdict: \"live_improvement\" only when inference_mode==\"live_gpu\" AND\n      signed_improvement > 0; \"live_no_improvement\"\
    \ when live but improvement <= 0;\n      \"blocked\" when not live\n   h. Output: results/experiment_379_precision_execute.json\n5. Write tests/python/test_experiment_379_precision_execute.py (100%\
    \ coverage required).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile: update ops/conductor-log.md with live result or blocked status.\n   If honest_verdict=\"live_improvement\"\
    : document the headline number in ops/status.md\n   and ops/changelog.md. This is Carnot's first credible precision stack number.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push.\
    \ Do NOT modify scripts/research_conductor.py.\n"
- id: exp380-humaneval-live-execute
  milestone: 2026.06.03
  deliverable: results/experiment_380_humaneval_execute.json
  title: 'Exp 380: Live HumanEval code verification execution — 50 problems, CodeExtractor + PBT'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code style requirements.\nToday's date: {date}.\n\nCONTEXT: scripts/experiment_369_humaneval_live.py is a complete,\
    \ tested benchmark script\n(69 tests pass) for HumanEval code verification with CodeExtractor + PBT. It was blocked\nin milestone 2026.05.27 because CARNOT_FORCE_LIVE was never set. Exp 226 showed +3.0pp\n\
    (19/164 → 24/164) on a prior live run. Code verification uses EXECUTION not regex — it\nshould work on instruction-tuned models (unlike arithmetic extraction).\n\nThis is Carnot's most reliable result\
    \ domain: CodeExtractor verifies via execution, not\npattern matching. The PBT pass catches bugs that official tests miss.\n\nEXISTING CODE TO READ FIRST:\n- scripts/experiment_369_humaneval_live.py\
    \ — the existing benchmark script (READ CAREFULLY)\n- python/carnot/pipeline/extract.py — CodeExtractor\n- python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate (Exp 377)\n- scripts/experiment_template.py\
    \ — ExperimentTemplate.setup_gpu()\n- results/experiment_369_humaneval_live.json — prior blocked result (for schema reference)\n\nTASK: Execute live HumanEval code verification benchmark.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. No new spec changes needed (SCENARIO-BENCH-021 from Exp 369 covers this).\n3. Write tests FIRST (100% coverage) for any NEW helper functions only.\n4. Implement scripts/experiment_380_humaneval_execute.py:\n\
    \   a. ExperimentTemplate(380, \"Live HumanEval code verification\",\n      \"results/experiment_380_humaneval_execute.json\", requires_gpu=True)\n   b. tmpl.setup()\n   c. blocked = LiveGPUGate.require_live_or_blocked(tmpl,\
    \ [\"google/gemma-4-E4B-it\"])\n      If blocked is not None: write blocked artifact, exit.\n   d. gpu_status = tmpl.setup_gpu([({\"name\": \"Gemma4-E4B-it\",\n      \"hf_id\": \"google/gemma-4-E4B-it\"\
    , \"gpu\": 0)}])\n      If not gpu_status[\"all_healthy\"]: write blocked artifact, exit.\n   e. Load 50 HumanEval problems (official human_eval package → 50-problem manual fallback)\n   f. Generate\
    \ code with Gemma4-E4B-it (BatchedInferenceRunner, batch_size=8)\n   g. For each solution: run official tests (subprocess, 10s timeout)\n   h. For FAILED solutions: run CodeExtractor + VerifyRepairPipeline\n\
    \   i. Re-run tests on repaired solutions; also run PBT on solutions that pass official tests\n   j. pass_at_1_before = fraction passing before repair\n      pass_at_1_after = fraction passing after\
    \ repair\n      signed_improvement = pass_at_1_after - pass_at_1_before (no clamping)\n   k. Build artifact: schema=\"carnot.humaneval_benchmark.v2\",\n      inference_mode=\"live_gpu\", n_problems=50,\
    \ pass_at_1_before, pass_at_1_after,\n      signed_improvement, pbt_bugs_found,\n      honest_verdict: \"code_verification_positive\" only when inference_mode==\"live_gpu\"\n      AND signed_improvement\
    \ > 0\n   l. Output: results/experiment_380_humaneval_execute.json\n5. Write tests/python/test_experiment_380_humaneval_execute.py (100% coverage).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\n7. Reconcile: update ops/conductor-log.md. If positive: document improvement vs Exp 226\n   baseline (+3.0pp) in ops/changelog.md and ops/status.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"
- id: exp381-adversarial-gsm8k-live-execute
  milestone: 2026.06.03
  deliverable: results/experiment_381_adversarial_execute.json
  title: 'Exp 381: Live adversarial GSM8K execution — Carnot''s headline credibility experiment'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code style requirements.\nToday's date: {date}.\n\nCONTEXT: THIS IS CARNOT'S HEADLINE CREDIBILITY EXPERIMENT.\
    \ Apple researchers (arXiv\n2410.05229) showed frontier LLMs drop up to 65% accuracy when one irrelevant sentence\nis appended to GSM8K math problems. Even o1-preview drops 92.7% → 77.4%.\n\nCarnot's\
    \ hypothesis: constraint verification (LLMExtractor + Ising energy) is INVARIANT\nto irrelevant context — it parses verifiable claims regardless of surrounding text. So\nverify-repair should maintain\
    \ accuracy on adversarial variants, showing improvement LARGER\nthan on standard variants.\n\nscripts/experiment_370_adversarial_live.py is a complete, tested script (23 tests pass)\nwith a hard CARNOT_FORCE_LIVE=1\
    \ gate. It was blocked in milestone 2026.05.27 because the\nenv var was never set. Exp 377 fixed this.\n\nThe three conditions: standard (original GSM8K), adversarial (original + irrelevant sentence),\n\
    repaired_adversarial (adversarial + verify-repair with LLMExtractor).\n\nEXISTING CODE TO READ FIRST:\n- scripts/experiment_370_adversarial_live.py — the existing benchmark script (READ CAREFULLY)\n\
    - python/carnot/pipeline/adversarial_gsm8k.py — AdversarialGSMQuestion, harness (Exp 354)\n- python/carnot/pipeline/llm_extractor.py — LLMExtractor (Exp 366)\n- python/carnot/pipeline/live_gpu_gate.py\
    \ — LiveGPUGate (Exp 377)\n- results/experiment_354_adversarial_gsm8k_harness.json — harness validation\n\nTASK: Execute the live adversarial GSM8K benchmark.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. No new spec changes needed (SCENARIO-BENCH-022 from Exp 370 covers this).\n3. Write tests FIRST (100% coverage) for any NEW helper functions only.\n4. Implement scripts/experiment_381_adversarial_execute.py:\n\
    \   a. ExperimentTemplate(381, \"Live adversarial GSM8K — Carnot credibility\",\n      \"results/experiment_381_adversarial_execute.json\", requires_gpu=True)\n   b. tmpl.setup()\n   c. blocked = LiveGPUGate.require_live_or_blocked(tmpl,\
    \ [\"google/gemma-4-E4B-it\",\n      \"Qwen/Qwen3.5-0.8B\"])\n      If blocked is not None: write blocked artifact, exit.\n      This experiment MUST NOT silently fall back to simulated mode.\n   d.\
    \ gpu_status = tmpl.setup_gpu([({\"name\": \"Gemma4-E4B-it\",\n      \"hf_id\": \"google/gemma-4-E4B-it\", \"gpu\": 0)},\n      ({\"name\": \"Qwen3.5-0.8B\", \"hf_id\": \"Qwen/Qwen3.5-0.8B\", \"gpu\"\
    : 1)}])\n      If not gpu_status[\"all_healthy\"]: write blocked artifact, exit.\n   e. Load 50 GSM8K questions (HuggingFace gsm8k test split → synthetic fallback)\n   f. build_adversarial_questions(original_questions,\
