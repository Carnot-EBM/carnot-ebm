  - id: exp2600
    milestone: "2026.05.249"
    deliverable: "results/experiment_2600_safety_corpus_verifier.json"
    title: "Safety Corpus 200 Pairs + Tier0xSafetyVerifier"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: safety_classifier

    prior_failures:
      - experiment_id: exp416-safety-kan-classifier
        verdict: "complete: early safety KAN classifier exploration"
        addressed_by: "exp416 explored KAN-based safety classification (early milestone). This implements Tier0xSafetyVerifier using Ising pattern energy (token-level Shannon entropy features) on a fresh 200-pair corpus. Different architecture, different corpus, different milestone scope."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      The Tier B Safety/Jailbreak Classifier is the next commercially viable product.
      Carnot's energy infrastructure (Ising sampler, verifier API, conformal calibration) exists.
      This task adds the safety domain corpus and a first safety verifier.

      Safety corpus: 200 (prompt, response) pairs — 100 safe, 100 unsafe.
      Sources (prefer real over synthetic, NO closed-weight API calls):
        1. HuggingFace cached datasets: allenai/wildguard, walledai/OffComms
        2. Local data/ directory: any *safety*, *jailbreak* corpus files
        3. Fallback: generate 200 synthetic pairs via simple templates

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/
      - python/carnot/models/ising.py

      TASK: Build 200-pair safety corpus and implement Tier0xSafetyVerifier.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds
         b. `python -c "import sklearn"` succeeds
         If precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Attempt to load real safety corpus (cached HF or local data/).
         If real corpus found: corpus_source="real".
         Else: generate 200 synthetic pairs via templates — corpus_source="synthetic".
         Log: n_corpus, corpus_source.

      2. Compute per-pair features (5 total):
         - mean_entropy: mean token-level Shannon entropy H(t) for response (unigram LM)
         - min_entropy: minimum H(t) in response
         - std_entropy: std dev of H(t)
         - compliance_run_length: length of longest span with H < mean_entropy * 0.5
         - response_length: whitespace-split token count

      3. Split 80/20 train/test stratified by label.
         Train LogisticRegression(C=1.0, random_state=42).
         Evaluate: AUROC, AUPRC, F1 on test split.

      4. If AUROC > 0.60:
         safety_verifier_viable=True
         Serialize model to python/carnot/verify/tier0x_safety_verifier.pkl.
         Write stub python/carnot/verify/tier0x_safety_verifier.py with
         Tier0xSafetyVerifier(BaseVerifier) and .score(prompt, response) -> float.

      5. Write results/experiment_2600_safety_corpus_verifier.json with required fields.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
      - safety_verifier_viable: bool — True iff safety_auroc > 0.60 (gate for exp2601)
      - safety_auroc: float — primary metric
      - n_corpus: int — corpus size (must be >= 100)
      - corpus_source: str — "real", "synthetic", or "mixed"
      - random_seed: 42
      - duration_s: float — wall-clock time
      - preconditions_checked: list of {{resource, available, check}}

      Run: `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"`.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


