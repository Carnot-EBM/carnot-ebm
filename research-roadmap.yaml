e bitstream)\n  find {project_root}/output -name '*.bit' 2>/dev/null | head -3 (locate KV260 bitstream)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. GateMate bitstream:\n        ls {project_root}/rtl/gatemate_ising_n16.cfg\n        If not found: write gatemate_bitstream_path_not_found; note but continue to KV260.\n     b. openFPGALoader available:\n        command -v openFPGALoader && openFPGALoader --version | head -1 || echo 'not found'\n        If not found: write gatemate_openFPGALoader_not_found; note but continue to KV260.\n     c. DirtyJTAG USB device:\n        lsusb | grep -i '1209:c0ca\\|DirtyJTAG' || echo 'not detected'\n        Set gatemate_jtag_detected=(found or not).\n     d. KV260 SD card devices:\n        ls /dev/sda /dev/sdb /dev/mmcblk* 2>/dev/null | head -5\n        Set kv260_sd_devices=(list or empty).\n\n  1. GateMate physical flash:\n     If gatemate_bitstream_path_not_found or gatemate_openFPGALoader_not_found:\n       Set gatemate_flash_attempted=False; document reason.\n     Elif gatemate_jtag_detected=False:\n       Set gatemate_flash_attempted=True;\n       Set gatemate_flash_result='blocked_dirtyjtag_not_detected'\n     Else:\n       Run: openFPGALoader -c dirtyJtag -b olimex_gatemateevb {project_root}/rtl/gatemate_ising_n16.cfg 2>&1\n       Capture output. Set gatemate_bitstream_flashed=(exit_code == 0).\n       If flashed: run Ising smoke test (read back device status if possible).\n\n  2. KV260 SD card flash:\n     Read operator_commands from exp2538 artifact.\n     Check SD device writable: dd if=/dev/zero of=/dev/sda bs=512 count=1 status=progress 2>&1 (ONLY IF SD IS NOT system disk — verify first with lsblk)\n     Try downloading PYNQ image:\n       URLs to try (in order):\n         https://github.com/Xilinx/PYNQ/releases/download/v3.0.2/kv260-starter-kit-3.0.2.img.zip\n         https://github.com/Xilinx/PYNQ/releases/download/v3.0.1/kv260-starter-kit-3.0.1.img.zip\n         https://github.com/Xilinx/PYNQ/releases/download/v3.0/kv260-starter-kit-3.0.img.zip\n       wget -q --timeout=30 --spider <URL> && echo 'reachable' || echo 'unreachable'\n     If reachable: wget <URL> -O /tmp/pynq_kv260.img.zip && unzip ...\n     If still unreachable: document alternative_url_found=False; update operator_commands.\n\n  3. Write deliverable with full hardware status.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required (complete:, blocked_*, or success:). blocked_* verdicts are valid for missing hardware.\"\n  - gatemate_flash_attempted:\n      principle: \"True if openFPGALoader command was executed.\"\n  - gatemate_bitstream_flashed:\n      principle: \"True if openFPGALoader returned exit code 0. GateMate terminal state requires this.\"\n  - gatemate_smoke_test_result:\n      principle: \"On-board Ising sampler response if flash succeeded — required for terminal state graduation.\"\n  - kv260_sd_devices:\n      principle: \"List of detected SD devices — confirms physical hardware is present.\"\n  - kv260_pynq_url_reachable:\n      principle: \"Whether any PYNQ image URL was reachable. Documents progress toward operator-flash.\"\n  - kv260_flash_attempted:\n      principle: \"True if dd or similar write was attempted on an SD device.\"\n  - kv260_flash_result:\n      principle: \"Outcome of KV260 flash attempt.\"\n  - operator_commands_updated:\n      principle: \"True if operator_commands were updated with any new URL or path discovered.\"\n  - preconditions_checked:\n      principle: \"Records which tools and devices were verified.\"\n  - duration_s:\n      principle: \"Wall-clock. Hardware flash operations take >60s minimum for a real board write.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"gatemate_flash_attempted == true OR kv260_flash_attempted == true OR (gatemate_flash_attempted == false AND kv260_flash_attempted == false AND preconditions_checked IS NOT NULL)\"\n    principle: \"Hardware continuity discipline: forward motion on at least one board, or honest documentation of why neither could proceed. Either physical progress or documented operator path.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

