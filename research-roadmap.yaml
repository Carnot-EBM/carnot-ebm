milestone: 2026.06.392
milestone_title: "STRENGTHEN THE ORACLE-DISTINCT VERIFIER -- the .391 beats-vote gate RAN and TIED vote (verifier@1-vote@1 = -0.0714, CI95 [-0.214, 0.0], CLEAN/un-flagged), but on n=14 held-out tasks with a per-candidate LOGISTIC REGRESSION trained on only 14 ACCEPTED / 1782 REJECTED rows (base-rate 0.008, off-fold AUROC 0.779). The null is diagnosably under-powered + isolated-scoring + imbalance-collapsed -- NOT a settled refutation. .392 attacks all three causes with the .391-flagged SOTA: a CROSS-CANDIDATE SET-ENCODER AGGREGATOR (Set-Encoder 2404.06912 / MSV 2603.03417 / AggLM 2509.06870) + a CALIBRATED imbalance-aware loss (2509.19681) on a GROWN labeled pool (>=30 held-out) + a MARGIN-TRIGGERED ARBITER override (2606.04323), on ARC AND a higher-power, less-imbalanced CODE replication (learned pass-predictor, NO execution -> still oracle-distinct). Plus the OWED verifier-as-reward (re-scoped to FIT THE WINDOW with a real-training assertion + auto-retire), monotonic ARC +1 (->18), and the live-env accuracy probe."
milestone_doc: openspec/change-proposals/research-roadmap-v392.md
milestone_overview: |
  .391 did the right thing: it finally RAN the oracle-distinct beats-vote gate (the 2026-06-14 P0
  directive), with the .390 infra blockers fixed. The honest read is a clean TIES-VOTE-NULL (exp4221,
  un-flagged): on a held-out ARC split a LEARNED oracle-distinct verifier (verifier_is_oracle=false)
  scored verifier@1 - vote@1 = -0.0714, bootstrap CI95 [-0.214, 0.0] -- it did not beat vote. But this is
  NOT a settled refutation; it is an under-powered, weakly-built first read with THREE separable causes:
  (1) the verifier was a per-candidate LOGISTIC REGRESSION that scored each candidate in ISOLATION (blind
  to the competing candidate set / vote basin / cross-candidate agreement); (2) it trained on 14 ACCEPTED
  / 1782 REJECTED rows (base-rate 0.008) -- an extreme imbalance that collapses a binary discriminator
  (off-fold AUROC 0.779); (3) the held-out gate was n=14 tasks (below the CLT floor). The detector-vs-
  selector divergence (exp4208, carried) shows detection AUROC ~1.0 on math/sudoku/code but SELECTION
  headroom only on ARC (0.129) and code (0.18) -- the two domains where a beats-vote win is even possible.
  The verifier-as-reward (Phase B) failed a 4th/5th time on infra (exp4222 smoke 14s / exp4223 3-arm 36.7s,
  both DURATION_TOO_SHORT-flagged -- the live LoRA training short-circuited to a fake-short "progress"
  artifact instead of training), reaching the operator's own accumulate-floor.

  .392 is DEPTH, not churn: it STRENGTHENS the oracle-distinct verifier to the strongest build the
  literature offers, at power, then RE-TESTS the same decisive gate. Every Phase-A task changes the
  TECHNIQUE / LOSS / CORPUS / OVERRIDE that caused the .391 null.
    PHASE A -- THE ORACLE-DISTINCT HEADLINE (STRENGTHEN + re-test at power): A1 (exp4231) BUILD a
      CROSS-CANDIDATE set-encoder aggregator (Set-Encoder 2404.06912 / MSV 2603.03417 / AggLM 2509.06870)
      with a CALIBRATED imbalance-aware loss (2509.19681) on a GROWN labeled ARC pool (target >=30 held-out
      tasks), out-of-fold, verifier_is_oracle=false. A2 (exp4232, gated_on A1 aggregator_trained) MEASURE
      does the aggregator BEAT vote off-oracle vs a MATCHED control + a MARGIN-TRIGGERED override
      (2606.04323) + oracle@K positive control, CI95-excl-0 -- THE HEADLINE. A3 (exp4233) the SAME
      cross-candidate aggregator on CODE candidates (learned pass-predictor, NO execution at inference) --
      a higher-power, less-imbalanced replication that disambiguates "the .391 ARC null was data-sparsity"
      from "the oracle-distinct selection thesis is bounded."
    PHASE B -- OWED verifier-as-reward + self-learning (FR-11), HARNESS-FIRST + WINDOW-BOXED: B1 (exp4234)
      a harness smoke that asserts REAL training (duration floor + loss-moved) so it CANNOT short-circuit to
      a fake-short progress artifact. B2 (exp4235, gated_on B1 harness_smoke_passed) the de-confounded
      3-arm A-vs-B, window-boxed to a bounded deterministic step budget, retire_if_same_verdict (5th
      no-usable window -> auto-retire the live-LoRA path); verifier_is_oracle=true (HONEST reward axis).
    PHASE C -- ARC NORTH STAR: C1 (exp4236) monotonic ARC +1 (total_levels>=18); C2 (exp4237) the live-env
      ACCURACY probe with the MARGIN-TRIGGERED override applied to goal-predicate induction, NO leaderboard
      submission.
    PHASE D -- reserved: D1 (exp4238) SOTA-ingestion (cross-candidate aggregator track), D2 (exp4239)
      registry+gaps hygiene (GAP-4 regression guard + record .392 outcomes; declare methodology fields),
      D3 (exp4240) hardware continuity, D4 (exp4241) capstone .392.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227, SIGTERM'd) and the conductor stays
  stood-down. NO task may launch TRM training, run pkill/kill against train.py, or WRITE
  results/trm_runs/sudoku_extreme_baseline/. Phase B trains a SEPARATE small NON-Qwen SOTA base via LoRA on
  the RTX 3090 -- it does NOT touch the TRM checkpoint. Qwen is FORBIDDEN as the TRAINED base
  (Spurious-Rewards confound); Qwen GGUF as an off-policy teacher / certifier reference is fine.
  DiffusionGemma stays GATED (STILL-PENDING; activate ONLY on an oracle-distinct win with a matched
  control). Every verifier-value task MUST declare verifier_is_oracle honestly (Circularity Discipline).

