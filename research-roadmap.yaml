        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification + Sample-Size Rigor", "Missing-Verifier Gap Logging"

      TASK: build a cross-DOMAIN router + per-domain set-encoder; run the held-out-DOMAIN beats-vote gate; run the label-ablation.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any analysis):
           a. The ARC-families pool, the exp4291 ARC-GEN pool, AND a FoVer-step/math selection pool all load. CPU
              sufficient; no GGUF/GPU. If a domain pool is missing -> use the available domains and SAY which (>=3
