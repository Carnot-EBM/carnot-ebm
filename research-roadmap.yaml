    2. IMPLEMENT SOSKANEnergyV3 in python/carnot/models/sos_kan.py:
       - Replace the fixed V·V^T with a learned Gram matrix G = head_network(x) · head_network(x)^T
       - head_network: small 2-layer MLP (hidden_dim=32) that maps input x to a low-rank factor
         F ∈ R^(k×rank) where k = constraint dimension, rank = 8 (low-rank approximation)
       - G = F·F^T (guaranteed PSD) → f(x) = tr(G) (trace-form SOS energy)
