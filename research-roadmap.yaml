#   5. BARE field emission: every REQUIRED ARTIFACT FIELD value is a bare scalar; the principle:
#      lines guide the agent, NOT a {{value,principle}} wrapper (exp3871 bug).
#
# ROUTING: all tasks codex + requires_codex + gpt-5.5 (anti-wipeout; gemini crashes GPU
