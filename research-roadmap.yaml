      verdict: blocked
      addressed_by: "Earlier SOTA live paths blocked before useful inference. This task writes artifact first and distinguishes headline, blocked, and smoke-only modes."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    .99 failed to measure SOTA certificate parse rate at all. This task reruns the
    triggered certificate idea with complete failure metadata, grammar backend gate,
    SOTA cache gate, and answer-stability gate. It must compare raw trigger, grammar-only,
    and draft-conditioned constrained decoding when feasible.

    MODEL_SPECS REQUIREMENT:
    This experiment needs an LLM. Use cached_sota_pair(gpu_indices=(0, 1)) first
    and record exact MODEL_SPECS and models_used. MODEL_SPECS must include at least
    one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
