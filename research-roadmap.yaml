milestone: "2026.08.578"
milestone_title: "Execution-Qualified Verification and Support-Preserving Self-Learning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6619-v578-activation-contract
    milestone: "2026.08.578"
    deliverable: results/experiment_6619_v578_activation_contract.json
    title: "Complete V578 activation and gate-ownership contract"
    priority: critical
    track: execution-integrity
    requires_gpu: false
    max_turns: 100
    estimated_wall_time_min: 90
    model: opus
    prior_failures:
      - experiment_id: exp6616-v577-execution-contract
        verdict: "blocked_roadmap_contract_incomplete: expected Exp6616-Exp6628 YAML contracts are not all present"
        addressed_by: "V578 pre-stages all Exp6619-Exp6632 YAML contracts before this task runs and validates document-to-YAML equality as the activation root."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V577 completed with a fail-closed execution-contract result: its roadmap document promised thirteen tasks while the active YAML contained only three. Exp6616 blocked, Exp6617 gate-blocked, and Exp6618 was skipped after upstream retirement. V578 must prove that its full document, YAML, gates, model policy, and artifact contracts agree before scientific work starts. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/research-roadmap-next.yaml, {project_root}/research-roadmap.yaml, and {project_root}/results/experiment_6616_v577_execution_contract.json
      - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md, {project_root}/ops/exclusion_manifest.yaml, {project_root}/ops/known-issues.md, and the V578 section of research-references.md
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/exclusion_manifest_lint.py, {project_root}/scripts/conductor_gates.py, and their focused tests
      - relevant research-reporting, evidence, model-tier, training-inference, verifiable-reasoning, continuous-learning, and safety capability specs; _bmad/traceability.md; ops/status.md; ops/changelog.md; and ops/e2e-test-plan.md

      TASK
      Implement and run a V578 activation-contract validator. It must prove that Exp6619-Exp6632 exist in one execution order with unique IDs and deliverables, valid gates, exact gate-field ownership, complete prior-failure metadata, mandated-model policy, required artifact fields, protected files, and exact prompt endings. Do not implement science, load an LLM, activate the roadmap, or edit the conductor.

      CONCRETE STEPS
      0. PRECONDITIONS: hash both roadmap files, the milestone document, Exp6616, schemas, exclusion manifest, and protected files; record dirty-worktree state, Python, PyYAML, Pydantic, CPU, RAM, disk, and the no-LLM substrate.
      1. Add REQ-* and SCENARIO-* anchors for complete activation units, document-to-YAML equality, unique identity, exact gate ownership, prior failures, model policy, principles, prompt endings, protected files, atomic artifacts, and fail-closed verdicts. Write focused tests first.
      2. Parse research-roadmap-next.yaml and emit one task_contract_rows entry for every Exp6619-Exp6632 task. Include order, ID, title, deliverable, track, GPU need, model routing, prior failures, gates, gate owners, expected fields, and prompt terminator.
      3. Compare the document experiment list, dependency graph, gate table, deliverables, model list, and hardware flags with the YAML. Reject omissions, extras, stale milestone values, duplicates, or order drift.
      4. Confirm each gated_on owner is an earlier task in this roadmap and declares the identical artifact field in its own REQUIRED ARTIFACT FIELDS. Reject forward, circular, missing, misspelled, and retired-upstream gates.
      5. Confirm every prior_failures entry has experiment_id, the honest prior verdict, a concrete changed condition, and retire_if_same_verdict=true. Run schema, prior-failure, and exclusion-manifest validation.
      6. Confirm every LLM prompt declares MODEL_SPECS with at least one mandated repo ID, exact model identity and hash receipts, GGUF metadata tokenizer behavior, no silent fallback, and legacy smoke-only treatment.
      7. Confirm every task declares verdict_class, gate_check_summary for blocked outcomes, inference_substrate, verifier_is_oracle, field provenance, tests, checksum, and protected-file hashes. Comparative tasks must declare per_unit_rows and a row list.
      8. Attack missing tasks, missing owner fields, duplicate deliverables, bad gate ops, wrong model IDs, incomplete prior failures, missing principles, missing prompt endings, and protected-file mutation.
      9. Set activation_contract_ready_score=1.0 only when every contract and focused test passes. A ready contract is null infrastructure. Write the artifact atomically and run applicable roadmap, gate, spec, artifact, adversarial, and E2E validation.

      Required deliverable: {project_root}/results/experiment_6619_v578_activation_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status: {{principle: "The task ends terminally and never hides an activation block."}}
        honest_verdict: {{principle: "The verdict reports contract readiness without claiming scientific benefit."}}
        verdict_class: {{principle: "Use positive, circular_positive, null, blocked, disqualified, or partial; a ready contract is null."}}
        gate_check_summary: {{principle: "Any blocked result names the failed contract check and observed value."}}
        task_contract_rows: {{principle: "Every Exp6619-Exp6632 task has one replayable contract row."}}
        document_yaml_diff: {{principle: "The document and YAML task, gate, model, hardware, and deliverable sets are compared exactly."}}
        gate_owner_rows: {{principle: "Every gate binds an earlier task and an identically spelled required field."}}
        prior_failure_dispositions: {{principle: "Every matching rerun records the prior verdict, changed condition, and retirement signal."}}
        model_policy_receipts: {{principle: "Every LLM task binds a mandated GGUF and forbids headline fallback."}}
        validation_receipts: {{principle: "Schema, exclusion, gate, milestone, prompt, principle, and protection checks retain commands and exits."}}
        activation_contract_ready_score: {{principle: "This exact binary field gates Exp6620 and Exp6627 only when the full activation unit passes."}}
        attack_rows: {{principle: "Omission, identity, gate, model, prior-failure, principle, ending, and mutation attacks fail closed."}}
        preconditions_checked: {{principle: "Roadmaps, document, prior artifact, schemas, manifests, versions, resources, and hashes are explicit."}}
        protected_files_unchanged: {{principle: "research-roadmap.yaml and scripts/research_conductor.py retain original hashes."}}
        inference_substrate: {{principle: "The task declares roadmap and evidence validation with no LLM."}}
        verifier_is_oracle: {{principle: "Exact schema and contract checks are authoritative; no science is evaluated."}}
        field_provenance: {{principle: "Every field names source paths, parsers, hashes, schemas, and validation functions."}}
        duration_s: {{principle: "Monotonic duration covers replay, attacks, and validation."}}
        tests_run: {{principle: "Focused, roadmap, gate, spec, artifact, adversarial, and applicable E2E commands include exits."}}
        reproducibility_checksum: {{principle: "A final content hash detects artifact mutation."}}
      Set inference_substrate=v578_complete_activation_contract_no_llm and verifier_is_oracle=true. A ready result uses verdict_class=null. A genuine block uses blocked_* and gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6619_v578_activation_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6620-gpu-lease-phase-receipts
    milestone: "2026.08.578"
    deliverable: results/experiment_6620_gpu_lease_phase_receipts.json
    title: "Task-scoped GPU lease and phase receipt implementation"
    priority: critical
    track: execution-integrity
    requires_gpu: false
    max_turns: 100
    estimated_wall_time_min: 150
    model: opus
    gated_on:
      - upstream: exp6619-v578-activation-contract
        artifact_field: activation_contract_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6617-gpu-lease-phase-receipts
        verdict: "blocked_gate_check_failed"
        addressed_by: "The complete V578 activation root now exists in the same roadmap, so the implementation can run instead of failing on the missing V577 contract."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6619 owns the complete V578 activation contract. V577 never implemented its planned lease because the upstream manifest was incomplete. V576 also showed that post-hoc GPU ownership and process reconstruction are not adequate model evidence. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V578 roadmap, and Exp6619's artifact and tests
      - Exp6605, Exp6607, Exp6615, Exp6616, and Exp6617 artifacts and conductor receipts
      - current GPU admission, process ownership, heartbeat, timeout, checkpoint, cache-lock, atomic-write, phase, and protected-file helpers plus tests
      - {project_root}/python/carnot/inference/sota_models.py, {project_root}/python/carnot/pipeline/gemma4_quantized_loader.py, and {project_root}/scripts/experiment_template.py
      - relevant execution, model-tier, training-inference, evidence, research-reporting, and safety specs; traceability; status; changelog; and E2E plan

      TASK
      Implement a reusable task-scoped GPU lease and phase journal outside scripts/research_conductor.py. Prove ownership, phase, failure, restart, and tamper behavior with mocks and bounded subprocess fixtures. Do not load an LLM.

      CONCRETE STEPS
      0. PRECONDITIONS: verify Exp6619's structured gate; hash protected files; record existing helpers, CUDA and nvidia-smi only as diagnostics, process APIs, runtime paths, CPU, RAM, disk, and the no-LLM substrate.
      1. Add REQ-* and SCENARIO-* anchors for atomic lease acquisition, device UUID binding, PID-start defense, phase transitions, heartbeat, expiry, model identity, VRAM receipts, unload, recovery, atomic journals, and fail-closed status. Write focused tests first.
      2. Bind each lease to task ID, opaque token, device UUID, PID and start time, expected model identity, acquisition and expiry, heartbeat, phase, and journal checksum.
      3. Implement allowed phases: preflight, admitted, loading, resident, inferencing, unloading, validating, terminal_complete, and terminal_blocked. Reject skips, reversals, second terminal states, and non-owner writes.
      4. Add readiness checks for free VRAM, conflicting CUDA process, stale receipt, expected model files, time budget, disk, and protected hashes. Diagnostics must not kill or steal another process.
      5. Retain executable, argv digest, PID start, task, device, VRAM before/resident/after, model hashes, offload, heartbeat, exit, unload, and residual VRAM.
      6. Test same-device races, independent devices, PID reuse, owner crash, stale heartbeat, wrong token, wrong model, wrong device, timeout, missing unload, partial journal, checksum tamper, and restart recovery.
      7. Set gpu_lease_scheduler_ready_score=1.0 only when ownership, phases, recovery, tests, and protected files pass. Write atomically and run focused, repository, spec, artifact, adversarial, and applicable E2E checks.

      Required deliverable: {project_root}/results/experiment_6620_gpu_lease_phase_receipts.json.
      REQUIRED ARTIFACT FIELDS:
        status: {{principle: "The implementation ends terminally or names the exact block."}}
        honest_verdict: {{principle: "The verdict distinguishes execution readiness from model quality."}}
        verdict_class: {{principle: "Use the closed enum; a ready scheduler is null infrastructure."}}
        gate_check_summary: {{principle: "Any block names the failed upstream, lease, phase, recovery, test, hash, or protection check and value."}}
        lease_api_receipts: {{principle: "Acquire, heartbeat, status, release, timeout, and recovery bind owner, token, device, PID start, and time."}}
        phase_transition_rows: {{principle: "Allowed and rejected transitions retain expected and observed states."}}
        process_fixture_rows: {{principle: "Race, reuse, crash, stale, token, model, device, timeout, unload, and restart fixtures are replayable."}}
        accelerator_receipt_examples: {{principle: "Device, process, model, VRAM, offload, heartbeat, exit, and unload evidence share one owner."}}
        gpu_lease_scheduler_ready_score: {{principle: "This exact binary field gates Exp6621 only after ownership, recovery, and tests pass."}}
        attack_rows: {{principle: "Race, theft, reuse, stale, tamper, timeout, partial-write, and mutation attacks fail closed."}}
        preconditions_checked: {{principle: "Upstream contract, helpers, APIs, resources, paths, versions, and hashes are explicit."}}
        protected_files_unchanged: {{principle: "research-roadmap.yaml and scripts/research_conductor.py retain original hashes."}}
        inference_substrate: {{principle: "The task declares synthetic and bounded process-fixture validation with no LLM."}}
        verifier_is_oracle: {{principle: "Process and receipt invariants are authoritative; no model quality is evaluated."}}
        field_provenance: {{principle: "Every field points to schemas, journals, fixtures, hashes, and validation functions."}}
        duration_s: {{principle: "Monotonic duration covers implementation, attacks, and tests."}}
        tests_run: {{principle: "Focused, repository, spec, artifact, adversarial, and applicable E2E commands include exits."}}
        reproducibility_checksum: {{principle: "A final content hash detects evidence mutation."}}
      Set inference_substrate=task_scoped_gpu_lease_phase_process_fixtures_no_llm and verifier_is_oracle=true. A ready result uses verdict_class=null. A genuine block uses blocked_* and gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6620_gpu_lease_phase_receipts --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6621-mandated-model-admission
    milestone: "2026.08.578"
    deliverable: results/experiment_6621_mandated_model_admission.json
    title: "Independent mandated-model CUDA admission canaries"
    priority: critical
    track: model-admission
    requires_gpu: true
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 120
    model: opus
    gated_on:
      - upstream: exp6620-gpu-lease-phase-receipts
        artifact_field: gpu_lease_scheduler_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6618-mandated-model-admission
        verdict: "blocked_upstream_retired"
        addressed_by: "The V578 activation contract and implemented lease now precede three independent fresh-process canaries in the same roadmap."
        retire_if_same_verdict: true
      - experiment_id: exp6605-qwen36-direct-headroom
        verdict: "blocked_gpu_process_receipts: direct baseline integrity did not complete"
        addressed_by: "This bounded canary proves lease, process, phase, model, and unload identity before any benchmark rows are attempted."
        retire_if_same_verdict: true
      - experiment_id: exp6606-gemma4-31b-direct-headroom
        verdict: "blocked_gate_check_failed"
        addressed_by: "The canary includes complete prior-failure metadata and reports Gemma 31B readiness independently of other families."
        retire_if_same_verdict: true
      - experiment_id: exp6607-gemma4-26b-direct-headroom
        verdict: "blocked_gpu_ownership: expected True, observed False"
        addressed_by: "Device and process ownership are established before load and unload evidence is written by the same lease owner."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6620 owns the task-scoped lease. This task validates actual local CUDA execution independently for each mandated family before benchmark science. A failure in one family must not erase valid receipts for another. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V578 roadmap, and Exp6619-Exp6620 artifacts, implementation, and focused tests
      - Exp6605-Exp6607 and Exp6618 evidence, including process, model, gate, and protection failures
      - {project_root}/scripts/experiment_template.py and cached_sota_pair(); {project_root}/python/carnot/inference/sota_models.py; {project_root}/python/carnot/pipeline/gemma4_quantized_loader.py
      - current GGUF resolver, metadata tokenizer, chat template, llama.cpp CUDA, identity, lease, timeout, raw-output, checkpoint, unload, atomic-write, and protection helpers plus tests
      - relevant model-tier, training-inference, evidence, reporting, and safety specs; traceability; status; changelog; and E2E plan

      TASK
      Run one short fresh-process CUDA admission canary for each mandated GGUF family. Bind each run to an Exp6620 lease and emit independent readiness. Do not compare model quality or run the benchmark corpus.

      CONCRETE STEPS
      0. PRECONDITIONS: verify Exp6620's gate; record protected hashes, both RTX UUIDs and availability, model cache paths and hashes, llama.cpp build and CUDA backend, CPU, RAM, disk, timeout, and evidence budget.
      1. Define MODEL_SPECS with exact repo IDs unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Use cached_sota_pair() style resolution. Derive tokenizer and chat template from each GGUF. Refuse silent substitution.
      2. Add REQ-* and SCENARIO-* anchors for independent family admission, exact identity, fresh process, lease ownership, phase receipts, bounded output, raw retention, timeout, unload, partial readiness, and atomic artifacts. Write focused tests first.
      3. For each family, acquire a lease, launch a fresh llama.cpp CUDA process, load the selected local quant, run one deterministic canary, preserve raw output and command digest, unload, and close the phase journal.
      4. Emit one rows entry per family with repo, file, hashes, metadata, device, PID start, offload layers, VRAM before/resident/after, phases, output, timeout, exit, unload, and readiness reason.
      5. Set qwen_admission_ready_score, gemma31_admission_ready_score, and gemma26_admission_ready_score independently. Legacy Qwen3.5-0.8B and Gemma-4-E4B-it are optional CPU smoke only and can never set a readiness score.
      6. Attack wrong repo, wrong quant, tokenizer substitution, stale lease, PID mismatch, zero offload, truncated output, timeout, missing unload, and family-result coupling.
      7. Write atomically and run focused, model-tier, lease, spec, artifact, adversarial, and applicable GPU E2E checks.

      Required deliverable: {project_root}/results/experiment_6621_mandated_model_admission.json.
      REQUIRED ARTIFACT FIELDS:
        status: {{principle: "All three family attempts end terminally and partial readiness remains visible."}}
        honest_verdict: {{principle: "The verdict reports admission only and does not claim benchmark quality."}}
        verdict_class: {{principle: "Use the closed enum; admission infrastructure is null unless blocked or partial."}}
        gate_check_summary: {{principle: "Any blocked result names the failed upstream, model, lease, process, phase, output, unload, test, or hash check."}}
        rows: {{principle: "Each mandated family retains one full model, process, accelerator, output, and readiness row."}}
        model_specs: {{principle: "All three exact mandated repo IDs and selected local quant files are explicit."}}
        qwen_admission_ready_score: {{principle: "This exact binary field gates Qwen benchmark and live-policy tasks only after Qwen receipts pass."}}
        gemma31_admission_ready_score: {{principle: "Gemma 31B readiness is independent and cannot be inferred from another family."}}
        gemma26_admission_ready_score: {{principle: "Gemma 26B readiness is independent and cannot be inferred from another family."}}
        attack_rows: {{principle: "Identity, tokenizer, lease, process, offload, output, timeout, unload, and coupling attacks fail closed."}}
        preconditions_checked: {{principle: "Lease, devices, models, runtime, resources, budgets, versions, and hashes are explicit."}}
        protected_files_unchanged: {{principle: "research-roadmap.yaml and scripts/research_conductor.py retain original hashes."}}
        inference_substrate: {{principle: "The task declares fresh-process local llama.cpp CUDA inference on named GGUF files."}}
        verifier_is_oracle: {{principle: "Receipt checks establish admission only; the model does not verify itself."}}
        field_provenance: {{principle: "Every field points to model files, metadata, commands, processes, leases, raw outputs, and checks."}}
        duration_s: {{principle: "Monotonic duration covers all family attempts and unloads."}}
        tests_run: {{principle: "Focused, model, lease, spec, artifact, adversarial, and applicable E2E commands include exits."}}
        reproducibility_checksum: {{principle: "A final content hash detects admission-evidence mutation."}}
      Set inference_substrate=independent_mandated_gguf_fresh_process_llamacpp_cuda_canaries and verifier_is_oracle=false. A completed canary task normally uses verdict_class=null or partial. A genuine block uses blocked_* and gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6621_mandated_model_admission --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6622-qwen36-direct-headroom
    milestone: "2026.08.578"
    deliverable: results/experiment_6622_qwen36_direct_headroom.json
    title: "Bounded Qwen3.6 direct-headroom requalification"
    priority: critical
    track: constrained-decoding
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    gated_on:
      - upstream: exp6621-mandated-model-admission
        artifact_field: qwen_admission_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6605-qwen36-direct-headroom
        verdict: "blocked_gpu_process_receipts: direct baseline integrity did not complete"
        addressed_by: "Exp6622 runs only after a task-scoped lease and independent Qwen admission canary, preserving phase and unload receipts beside every raw row."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V576's Qwen direct baseline was scientifically ineligible because process receipts failed. Exp6621 now gates this retry on independent Qwen admission. This task measures only the direct arm so treatment design cannot change baseline eligibility. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V578 roadmap, and Exp6619-Exp6621 artifacts and tests
      - {project_root}/results/experiment_6604_exact_two_level_plan_corpus.json, Exp6605, Exp6608, Exp6615, and the raw V576 corpus and checker
      - {project_root}/scripts/experiment_template.py and cached_sota_pair(); sota model resolver; GGUF metadata tokenizer; CUDA runtime; lease; phase; raw-row; checkpoint; and atomic-write helpers
      - relevant constrained-decoding, model-tier, training-inference, exact-verification, evidence, reporting, and safety specs; traceability; status; changelog; and E2E plan

      TASK
      Requalify one bounded Qwen3.6 direct-generation baseline on the exact V576 corpus. Preserve complete per-attempt evidence and preregistered candidate-budget support. Do not implement syntax or semantic constraint treatments.

      CONCRETE STEPS
      0. PRECONDITIONS: verify qwen_admission_ready_score=1.0; hash the corpus, exact checker, model, quant, runtime, prompts, protected files, and configuration; record device, lease, CPU, RAM, disk, timeout, and evidence budget.
      1. Define MODEL_SPECS with exact repo ID unsloth/Qwen3.6-35B-A3B-GGUF using cached_sota_pair() style resolution. Use GGUF tokenizer and chat-template metadata. Refuse fallback.
      2. Add REQ-* and SCENARIO-* anchors for frozen direct generation, matched seeds, complete raw rows, exact syntax and semantic checks, candidate budgets, support, lease and phase receipts, timeout, checkpoint, unload, and fail-closed eligibility. Write focused tests first.
      3. Freeze prompts, seeds, decoding parameters, stop rules, budgets, exact checker, and one selected local quant before inference. Run direct generation only in a fresh leased CUDA process.
      4. Emit one rows entry per prompt, seed, attempt, and candidate budget with raw output, parse result, exact constraint result, error class, latency, tokens, model identity, lease, phase, process, and unload linkage.
      5. Compute exact success, syntax failure, semantic failure, best-at-k, any-success support, and headroom from rows. Do not discard timeouts, malformed outputs, or nulls.
      6. Set baseline_rows_complete_score=1.0 only when the preregistered matrix, identity, process, phase, raw output, exact check, and unload evidence are complete. A complete baseline may honestly be null.
      7. Attack row drops, duplicate rows, aggregate-row mismatch, seed drift, checker substitution, model drift, non-CUDA execution, stale lease, timeout loss, and missing unload.
      8. Write atomically and run focused, exact-checker, model, lease, spec, row-consistency, artifact, adversarial, and applicable GPU E2E checks.

      Required deliverable: {project_root}/results/experiment_6622_qwen36_direct_headroom.json.
      REQUIRED ARTIFACT FIELDS:
        status: {{principle: "Every preregistered direct attempt is terminal or the missing evidence is named."}}
        honest_verdict: {{principle: "The verdict reports direct eligibility and headroom without treatment benefit."}}
        verdict_class: {{principle: "Use the closed enum and preserve a null or blocked baseline honestly."}}
        gate_check_summary: {{principle: "Any block names the failed upstream, row, model, process, phase, exact, unload, test, or hash check."}}
        rows: {{principle: "Every prompt, seed, attempt, and budget retains raw output and exact outcome."}}
        model_specs: {{principle: "The exact Qwen3.6 repo, quant, hashes, metadata, and no-fallback policy are explicit."}}
        baseline_metrics: {{principle: "Exact success, failure categories, best-at-k, support, latency, and tokens derive only from rows."}}
        baseline_rows_complete_score: {{principle: "This exact binary field gates Exp6623 only when the full direct evidence matrix replays."}}
        attack_rows: {{principle: "Drop, duplicate, mismatch, drift, substitution, substrate, lease, timeout, and unload attacks fail closed."}}
        preconditions_checked: {{principle: "Gate, corpus, checker, model, runtime, device, resources, budgets, versions, and hashes are explicit."}}
        protected_files_unchanged: {{principle: "research-roadmap.yaml and scripts/research_conductor.py retain original hashes."}}
        inference_substrate: {{principle: "The task declares leased fresh-process Qwen3.6 local llama.cpp CUDA inference."}}
        verifier_is_oracle: {{principle: "The exact executable checker is authority; the tested model only proposes."}}
        field_provenance: {{principle: "Every field points to corpus rows, raw outputs, checker calls, model files, leases, phases, and reducers."}}
        duration_s: {{principle: "Monotonic duration covers admission, inference, validation, and unload."}}
        tests_run: {{principle: "Focused, exact, model, lease, spec, row, artifact, adversarial, and E2E commands include exits."}}
        reproducibility_checksum: {{principle: "A final content hash detects baseline-evidence mutation."}}
      Set inference_substrate=qwen36_direct_fresh_process_llamacpp_cuda_exact_plan_corpus and verifier_is_oracle=false. Exact checker outputs are authoritative. A genuine block uses blocked_* and gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6622_qwen36_direct_headroom --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6623-headroom-support-reducer
    milestone: "2026.08.578"
    deliverable: results/experiment_6623_headroom_support_reducer.json
    title: "Independent direct-headroom and recoverable-support reducer"
    priority: critical
    track: constrained-decoding
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 60
    gated_on:
      - upstream: exp6622-qwen36-direct-headroom
