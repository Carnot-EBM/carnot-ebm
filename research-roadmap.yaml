  - id: exp3164-duration-corrected-authenticity-contract-v2
    milestone: "2026.05.294"
    deliverable: "results/experiment_3164_duration_corrected_authenticity_contract_v2.json"
    title: "Duration-corrected live authenticity contract v2"
    priority: critical
    max_turns: 30
    estimated_wall_time_min: 35
    track: "verification"
    inference_substrate: "aggregation_and_contract"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3151-live-inference-authenticity-preflight
        verdict: "blocked_duration_too_short: preflight_passed=false; live_call_count=1; duration_s below fixed 60s floor"
        addressed_by: "Changes the preflight contract from an arbitrary fixed duration floor to measured-work evidence with token-scaled plausibility and repeated-call controls."
        retire_if_same_verdict: true
      - experiment_id: exp3139-live-sota-verifier-rerun-v7
        verdict: "flagged_adversarial: preflight said no model loaded while artifact claimed six live calls"
        addressed_by: "Keeps model-load evidence mandatory and adds replayable transcript hashes before another rerun can unlock repair."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .293 proved that a mandated local GGUF can load and answer, but the fixed 60s duration plausibility floor rejected the artifact. This task repairs the contract before any further live verifier rerun.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-references.md
      - scripts/experiment_template.py
      - results/experiment_3150_adversarial_verifier_evidence_corrigendum_v1.json
      - results/experiment_3151_live_inference_authenticity_preflight_v1.json
      - results/experiment_3162_capstone_v293.json

      TASK
      Define a duration-corrected live-inference authenticity contract v2 that rejects fake evidence without rejecting legitimate fast local calls solely because they are under an arbitrary 60s floor.

      CONCRETE STEPS
      1. Load exp3151 and extract model-load wall time, generation wall time, token counts, model path, selected model ID, command hash, worker hash, transcript hash availability, and substrate evidence.
      2. Define v2 pass criteria: path existence, model-load proof, repeated smoke calls or token-scaled work budget, transcript hashes, prompt hashes, token counts, random_seed, reproducibility_checksum, and controlled subprocess return codes.
      3. Define v2 rejection criteria: no model loaded, missing transcript hashes, no seed/checksum, impossible token throughput, reused stale transcript hash, mismatch between selected model and local path, and wall-clock claims not supported by command output.
      4. Preserve the fixed 60s rule only as an optional warning for large panels, not as the sole pass/fail criterion for a one-prompt smoke.
      5. Write a reusable contract artifact for exp3165 and exp3167.

      REQUIRED ARTIFACT FIELDS:
      - duration_corrected_authenticity_contract_v2_ready: bool (principle: live reruns need an explicit contract)
      - old_fixed_duration_rule_retired_as_hard_gate: bool (principle: failed heuristics must not remain load-bearing)
      - measured_work_requirements: list (principle: authenticity should be tied to observed work)
      - token_scaled_duration_policy: dict (principle: duration plausibility should scale with prompt and completion work)
      - repeated_call_policy: dict (principle: replay should catch stale or fabricated transcripts)
      - required_preflight_fields: list (principle: downstream tasks need machine-checkable fields)
      - fake_evidence_rejection_criteria: list (principle: adversarial failure modes must stay explicit)
      - headline_claim_policy: dict (principle: smoke tests should not become headline evidence)
      - source_artifacts: list (principle: contract must trace to prior failure)
      - inference_substrate: dict (principle: aggregation work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3165-live-sota-authenticity-replay-v2
    milestone: "2026.05.294"
    deliverable: "results/experiment_3165_live_sota_authenticity_replay_v2.json"
    title: "Live SOTA authenticity replay v2"
    priority: critical
    model: opus
    max_turns: 100
    estimated_wall_time_min: 90
    track: "verification"
    inference_substrate: "local_sota_preflight_or_blocked"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3151-live-inference-authenticity-preflight
        verdict: "blocked_duration_too_short: preflight_passed=false; live_call_count=1"
        addressed_by: "Replays the same preflight family under the v2 measured-work contract instead of the fixed 60s hard gate."
        retire_if_same_verdict: true
      - experiment_id: exp3123-sota-cache-preconditions-manifest-v2
        verdict: "complete: cache manifest ready; only unsloth/gemma-4-26B-A4B-it-GGUF locally present among mandated SOTA models"
        addressed_by: "Refreshes local model availability and records unavailable mandated models separately from authenticity failure."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. This task may run a small local SOTA smoke if a mandated GGUF is already available. It must not download new models.

      PRECONDITIONS
      0. Read exp3164 first. If no mandated local SOTA GGUF is usable, write a complete blocked artifact with preflight_passed=false, live_call_count=0, and headline_claim_allowed=false.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
      - unsloth/gemma-4-31B-it-GGUF (flagship dense)
      - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE)
      Legacy small models may be recorded only as CPU smoke-tests and must not headline results.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3164_duration_corrected_authenticity_contract_v2.json
      - results/experiment_3151_live_inference_authenticity_preflight_v1.json
      - results/experiment_3123_sota_cache_preconditions_manifest_v2.json

      TASK
      Replay the local SOTA authenticity preflight under the duration-corrected v2 contract and decide whether live verifier reruns may proceed.

      CONCRETE STEPS
      1. Inspect local HuggingFace cache paths for the three mandated SOTA GGUF IDs without downloading new models.
      2. If a mandated model is locally usable, run the smallest safe repeated-call smoke required by exp3164, recording load command, command hash, model path, substrate, load wall time, generation wall time, prompt hashes, transcript hashes, token counts, random_seed, and reproducibility_checksum.
      3. Apply the v2 measured-work policy, token-scaled duration policy, and fake-evidence rejection criteria.
      4. Set preflight_passed=true only if all required evidence fields are present and internally consistent.
      5. Write a complete blocked artifact if any precondition fails; do not leave a bootstrap-only artifact.

      REQUIRED ARTIFACT FIELDS:
      - live_sota_authenticity_replay_v2_ready: bool (principle: downstream rerun needs a completed preflight artifact)
      - model_specs: list (principle: mandated local model policy must be visible)
      - locally_usable_model_ids: list (principle: actual availability must be auditable)
      - selected_model_ids: list (principle: any smoke call must identify selected models)
      - unavailable_model_ids: list (principle: comparative gaps must stay visible)
      - preflight_passed: bool (principle: downstream gates need one conservative field)
      - live_call_count: int (principle: live evidence must not be inferred)
      - model_load_evidence: dict (principle: claimed inference requires load evidence)
      - prompt_hashes: list (principle: prompts must be replay-identifiable)
      - transcript_hashes: list (principle: outputs must be replay-identifiable)
      - token_counts: dict (principle: duration plausibility requires measured work)
      - measured_work_policy_passed: bool (principle: fast calls need a principled pass criterion)
      - fake_evidence_rejection_passed: bool (principle: authenticity checks must be adversarial)
      - headline_claim_allowed: bool (principle: smoke tests do not create headline evidence)
      - blocked_reason: str (principle: blocked preflights must be actionable)
      - random_seed: int (principle: methodology completeness must be explicit)
      - reproducibility_checksum: str (principle: rerun provenance must be checkable)
      - source_artifacts: list (principle: preflight must trace to the v2 contract)
      - inference_substrate: dict (principle: GPU/model/live status must be explicit)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3166-verifier-invariance-token-suspicion-audit
    milestone: "2026.05.294"
    deliverable: "results/experiment_3166_verifier_invariance_token_suspicion_audit_v1.json"
    title: "Verifier invariance and token-suspicion audit"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 55
    track: "verification"
    inference_substrate: "aggregation_and_diagnostic"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3150-adversarial-verifier-evidence-corrigendum
        verdict: "complete: adversarial_corrigendum_v1_ready=true; live_verifier_evidence_trusted=False"
        addressed_by: "Adds controlled-invariance and token-suspicion diagnostics before trusting another live verifier rerun."
        retire_if_same_verdict: true
      - experiment_id: exp3139-live-sota-verifier-rerun-v7
        verdict: "flagged_adversarial: false_accept_rate=0.0 but live evidence failed authenticity/methodology checks"
        addressed_by: "Checks whether metrics depend on answer artifacts or trace artifacts instead of exact authority."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Recent hallucination-detector work recommends controlled invariance checks because detectors can read superficial answer artifacts. Token-level signals are useful triage, not acceptance authority.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-references.md
      - results/experiment_3150_adversarial_verifier_evidence_corrigendum_v1.json
      - results/experiment_3151_live_inference_authenticity_preflight_v1.json
      - results/experiment_3165_live_sota_authenticity_replay_v2.json if present
      - results/experiment_3136_false_accept_root_cause_autopsy_v1.json
      - results/experiment_3137_exact_safe_accept_abstain_contract_v1.json
      - results/experiment_3138_canonical_answer_vericot_grounding_pilot_v1.json

      TASK
      Build a controlled-invariance and token-suspicion audit for the clean verifier rerun. The audit should route exact checks, not authorize acceptance.

      CONCRETE STEPS
      1. Collect trusted exact rows from exp3136, exp3137, and exp3138 plus any transcript hashes from exp3165.
      2. Define Force, Remove, shuffled-trace, answer-only, and trace-only controls that can be run on available transcripts or exact rows.
      3. Define token-level and first-token suspicion fields that are allowed to triage rows but not accept them.
      4. Mark which diagnostics can be computed from existing artifacts and which require future live logprob/token telemetry.
      5. Write an audit artifact with explicit downstream policy for exp3167.

      REQUIRED ARTIFACT FIELDS:
      - verifier_invariance_token_suspicion_audit_ready: bool (principle: rerun evidence needs artifact-sensitivity checks)
      - controlled_invariance_checks: list (principle: detector shortcuts must be tested)
      - computed_checks: list (principle: distinguish computed evidence from proposed checks)
      - blocked_checks: list (principle: missing token/logprob telemetry must stay visible)
      - token_suspicion_fields: list (principle: triage signals must be explicitly scoped)
      - acceptance_authority_fields: list (principle: exact authority must stay separate from suspicion signals)
      - diagnostics_allowed_to_gate_repair: list (principle: repair gates need conservative fields)
      - diagnostics_not_allowed_to_accept: list (principle: token/trace signals must not become acceptance authority)
      - source_artifacts: list (principle: audit must trace to exact rows and preflight evidence)
      - inference_substrate: dict (principle: aggregation work must declare no new live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3167-clean-live-sota-verifier-rerun-v9
    milestone: "2026.05.294"
    deliverable: "results/experiment_3167_clean_live_sota_verifier_rerun_v9.json"
    title: "Preconditioned clean live SOTA verifier rerun v9"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 120
    track: "verification"
    inference_substrate: "local_sota_or_complete_gated_skip"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3152-clean-live-sota-verifier-rerun-v8
        verdict: "gated_skipped_missing_artifact: upstream preflight_passed=false or retired"
        addressed_by: "Always writes a full clean-rerun or gated-skip artifact instead of relying on a structural conductor gate."
        retire_if_same_verdict: true
      - experiment_id: exp3139-live-sota-verifier-rerun-v7
        verdict: "flagged_adversarial: false_accept_rate=0.0 but live evidence failed authenticity/methodology checks"
        addressed_by: "Runs only under the v2 authenticity contract and controlled-invariance audit."
        retire_if_same_verdict: true
      - experiment_id: exp3124-difficulty-stratified-live-sota-verifier-panel-v6
        verdict: "complete_blocked_false_accept: false_accept_rate=0.5; live_call_count=6; headline_claim_allowed=false"
        addressed_by: "Keeps the known false-accept rows as mandatory regression rows under the exact-safe contract."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. This task is allowed to write a full gated-skip artifact. Do not rely on structural conductor gating because matrix v27 already counted missing clean-rerun artifacts as blockers.

      PRECONDITIONS
      0. Read exp3165 and exp3166 first. If preflight_passed is false, the invariance audit is not ready, or no mandated local model is usable, write a complete gated-skip artifact with live_call_count=0, false_accept_gate_passed=false, flagged_adversarial=false, headline_claim_allowed=false, and gated_skip_reason set.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
      - unsloth/gemma-4-31B-it-GGUF (flagship dense)
      - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE)
      Legacy small models may be recorded only as CPU smoke-tests and must not headline results.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3164_duration_corrected_authenticity_contract_v2.json
      - results/experiment_3165_live_sota_authenticity_replay_v2.json
      - results/experiment_3166_verifier_invariance_token_suspicion_audit_v1.json
      - results/experiment_3136_false_accept_root_cause_autopsy_v1.json
      - results/experiment_3137_exact_safe_accept_abstain_contract_v1.json
      - results/experiment_3138_canonical_answer_vericot_grounding_pilot_v1.json
      - results/experiment_3150_adversarial_verifier_evidence_corrigendum_v1.json

      TASK
      Produce the clean live SOTA verifier rerun v9, or a complete gated-skip artifact if the evidence preconditions are not met.

      CONCRETE STEPS
      1. Build the rerun set from known false-accept regression rows plus balanced exact fixtures across arithmetic, SMT, satisfiable drift, contradiction, and fragment-code families.
      2. Use only mandated local SOTA GGUF models for headline evidence.
      3. If preconditions pass, run bounded live calls and record model-load evidence, prompt hashes, transcript hashes, token counts, random_seed, and reproducibility_checksum.
      4. Apply the exact-safe contract, canonical grounding, and controlled-invariance diagnostics.
      5. Compute false_accept_rate, false_reject_rate, abstention_rate, verifier_gain_delta, false_accept_gate_passed, flagged_adversarial, and headline_claim_allowed.
      6. If preconditions fail, do not call a model; write the same required fields with explicit gated-skip values.

      REQUIRED ARTIFACT FIELDS:
      - clean_live_verifier_rerun_v9_ready: bool (principle: repair gate needs a complete rerun artifact)
      - gated_skip: bool (principle: matrix should distinguish skipped from missing)
      - gated_skip_reason: str (principle: blocked reruns must be actionable)
      - model_specs: list (principle: mandated local model policy must be visible)
      - selected_model_ids: list (principle: actual model use must be auditable)
      - unavailable_model_ids: list (principle: comparative gaps must stay visible)
      - live_call_count: int (principle: live evidence must not be inferred)
      - model_load_evidence: dict (principle: claimed inference requires load evidence)
      - prompt_hashes: list (principle: prompts must be replay-identifiable)
      - transcript_hashes: list (principle: outputs must be replay-identifiable)
      - token_counts: dict (principle: measured-work evidence must be visible)
      - exact_ground_truth_count: int (principle: verifier scores need exact labels)
      - regression_rows_included: bool (principle: known failures must be retested)
      - controlled_invariance_passed: bool (principle: artifact shortcuts must not pass as verifier gain)
      - false_accept_rate: float (principle: false accepts are the central blocker)
      - false_reject_rate: float (principle: over-rejection can erase utility)
      - abstention_rate: float (principle: safety/coverage tradeoff must be visible)
      - verifier_gain_delta: float (principle: lift must be measured against exact baselines)
      - false_accept_gate_passed: bool (principle: downstream gate must be machine-readable)
      - flagged_adversarial: bool (principle: downstream gate must reject tainted evidence)
      - headline_claim_allowed: bool (principle: live claims require all evidence gates)
      - random_seed: int (principle: methodology completeness must be explicit)
      - reproducibility_checksum: str (principle: rerun provenance must be checkable)
      - source_artifacts: list (principle: claims must trace to concrete files)
      - inference_substrate: dict (principle: GPU/model/live inference status must be explicit)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3168-repair-gate-decision-v3
    milestone: "2026.05.294"
    deliverable: "results/experiment_3168_repair_gate_decision_v3.json"
    title: "Repair gate decision v3 materialized"
    priority: critical
    max_turns: 30
    estimated_wall_time_min: 35
    track: "repair"
    inference_substrate: "aggregation_and_policy"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3153-repair-gate-unlock-decision-v2
        verdict: "blocked_gate_check_failed"
        addressed_by: "Always writes a full decision artifact instead of being structurally skipped by the clean-rerun gate."
        retire_if_same_verdict: true
      - experiment_id: exp3140-repair-gate-unlock-decision
        verdict: "blocked_other: exp3139 flagged_adversarial=true"
        addressed_by: "Consumes the v9 rerun and v2 authenticity contract, and refuses to unlock if any adversarial evidence remains."
        retire_if_same_verdict: true
      - experiment_id: exp3115-explicit-repair-gate-micro-panel-v4
        verdict: "complete: repair_success_delta=0.0; false_repair_accept_rate=0.0; intent_preservation_rate=0.0"
        addressed_by: "Makes no repair claim; it only decides whether evidence is clean enough to spend repair calls."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .293 produced a thin blocked_gate_check_failed repair decision. This task must always write a complete repair gate decision artifact.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3167_clean_live_sota_verifier_rerun_v9.json
      - results/experiment_3166_verifier_invariance_token_suspicion_audit_v1.json
      - results/experiment_3137_exact_safe_accept_abstain_contract_v1.json
      - results/experiment_3138_canonical_answer_vericot_grounding_pilot_v1.json
      - results/experiment_3153_repair_gate_unlock_decision_v2.json
      - results/experiment_3140_repair_gate_unlock_decision_v1.json

      TASK
      Write a conservative repair gate decision v3. It may unlock only if the clean v9 verifier artifact is complete, unflagged, exact-authority backed, and false-accept safe.

      CONCRETE STEPS
      1. Load the v9 verifier rerun if present. If missing, write a complete blocked decision with repair_gate_state=blocked_missing_clean_rerun.
      2. Apply gate criteria: clean_live_verifier_rerun_v9_ready=true, gated_skip=false, false_accept_rate <= 0.10, false_accept_gate_passed=true, flagged_adversarial=false, regression_rows_included=true, exact labels present, controlled_invariance_passed=true, and headline_claim_allowed=true.
      3. Set repair_gate_state to unblocked, blocked_false_accept, blocked_flagged_verifier, blocked_missing_live_model, blocked_missing_exact_labels, blocked_invariance_failure, blocked_gated_skip, blocked_missing_clean_rerun, or blocked_other.
      4. If unblocked, list repair rows and exact authority constraints; if blocked, list exact blockers and avoid calling models.
      5. Write only the decision artifact.

      REQUIRED ARTIFACT FIELDS:
      - repair_gate_decision_v3_ready: bool (principle: repair execution must be explicitly gated)
      - repair_gate_state: str (principle: downstream tasks need one machine-readable field)
      - clean_rerun_artifact_present: bool (principle: missing clean evidence must block repair)
      - false_accept_rate: float (principle: central blocker must be carried forward)
      - false_accept_gate_passed: bool (principle: repair cannot run if false accepts remain high)
      - flagged_adversarial: bool (principle: tainted verifier evidence must block repair)
      - controlled_invariance_passed: bool (principle: artifact shortcuts must block repair)
      - exact_authority_ready: bool (principle: repair needs exact tests/solvers)
      - selected_repair_rows: list (principle: repair denominator must be explicit)
