- id: exp386-jitrl-constraint-memory
  milestone: 2026.06.03
  deliverable: python/carnot/pipeline/jitrl_memory.py
  title: 'Exp 386: JitRL constraint memory — non-parametric threshold modulation, no gradients'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2601.18510 (JitRL) introduces Just-In-Time\
    \ Reinforcement Learning: continual\nlearning WITHOUT gradient updates. Instead of training, JitRL maintains a dynamic non-parametric\nmemory of (state, action, advantage) triples. At inference time,\
    \ it retrieves the k most similar\ntriples and uses their advantages to directly modulate the output policy via a KL-constrained\nlogit adjustment. Proven to be the closed-form solution to KL-constrained\
    \ policy optimization.\n\nWHY THIS MATTERS FOR CARNOT: Exp 134 showed that precision-based constraint REWEIGHTING\ndoes not improve accuracy — the weights update but repair decisions don't change because\n\
    the decision is binary (violated or not). JitRL suggests the correct fix: instead of\nreweighting constraints, maintain a memory of (question_type, constraint_type, outcome)\ntriples and use them to\
    \ MODULATE THE ENERGY THRESHOLD at inference time.\n\nSpecifically: when Carnot has seen that \"rate problems\" trigger carry_check incorrectly 8/10\ntimes, raise the energy threshold for carry_check\
    \ on rate-type questions. This is logit\nmodulation on the verification decision, not constraint reweighting.\n\nThe memory is instant-update (no training), sub-microsecond retrieval (CPU k-NN over\
    \ small\nstore), and provably optimal under KL constraints.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline, extractor integration\n- python/carnot/pipeline/case_memory.py\
    \ — CaseMemory patterns (Exp 136)\n- python/carnot/training/adaptive_weights.py — PerModelFPTracker (Exp 132/134)\n- python/carnot/pipeline/constraint_templates.py — ConstraintTemplateLibrary (Exp 343)\n\
    - tests/python/test_adaptive_weights.py — test patterns for self-learning components\n\nTASK: Implement JitRL-style constraint memory with threshold modulation.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-LEARN-028 (JitRL memory modulates verification threshold without gradient updates),\n   REQ-LEARN-029 (modulation is the closed-form KL-constrained optimal policy update),\n   SCENARIO-LEARN-051/052/053\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Write tests FIRST (100% coverage required) for:\n   - ConstraintTriple: dataclass (question_type: str, constraint_type: str,\n     energy_value:\
    \ float, repair_outcome: Literal[\"fixed\", \"not_fixed\", \"false_positive\"],\n     question_embedding: list[float] | None = None)\n   - JitRLConstraintMemory(k: int = 5, kl_budget: float = 0.1, max_size:\
    \ int = 1000)\n   - JitRLConstraintMemory.record(triple: ConstraintTriple) → None: adds to memory store\n   - JitRLConstraintMemory.retrieve(question: str, constraint_type: str, k=5)\n     → list[ConstraintTriple]:\
    \ retrieves k most similar triples\n     Similarity: exact match on constraint_type first; then text-similarity on question\n     (simple bag-of-words cosine, no LLM embedding needed for CPU speed)\n\
    \   - JitRLConstraintMemory.compute_threshold_adjustment(triples) → float:\n     returns delta_threshold (positive = raise threshold, negative = lower).\n     Formula: delta = kl_budget * mean([1 if\
    \ t.repair_outcome==\"false_positive\" else -1\n     for t in triples]). This is the JitRL logit adjustment mapped to energy threshold space.\n   - JitRLConstraintMemory.get_adjusted_threshold(base_threshold,\
    \ question, constraint_type)\n     → float: applies threshold adjustment from retrieved triples\n   - JitRLConstraintMemory.save(path) / load(path): JSON serialization\n   - Wire into VerifyRepairPipeline\
    \ as OPTIONAL jitrl_memory param (additive, no breaking changes)\n4. Implement python/carnot/pipeline/jitrl_memory.py with all above classes.\n   Include verbose docstrings explaining WHY JitRL works\
    \ (KL-constrained policy optimization)\n   and the hardware path (memory fits on CPU; retrieval is O(log n) with sorted index).\n5. Export JitRLConstraintMemory, ConstraintTriple from carnot.pipeline.__init__.\n\
    6. Write scripts/experiment_386_jitrl_memory.py using ExperimentTemplate(386):\n   a. Create JitRLConstraintMemory()\n   b. Record 50 synthetic triples: 25 false_positive (carry_check on rate problems),\n\
    \      25 fixed (carry_check on arithmetic problems)\n   c. Query for a new \"rate problem\" with carry_check:\n      expected: threshold raised (positive adjustment)\n   d. Query for a new \"arithmetic\
    \ problem\" with carry_check:\n      expected: threshold lowered or unchanged (negative adjustment)\n   e. Measure: mean_threshold_adjustment_rate_problems, mean_threshold_adjustment_arith_problems\n\
    \   f. Run 100 simulated verify-repair decisions with and without JitRL modulation:\n      simulated_baseline_fp_rate, simulated_jitrl_fp_rate, fp_reduction_pct\n   g. Build artifact: schema=\"carnot.jitrl_memory.v1\"\
    ,\n      n_triples_recorded, mean_adjustment_rate, mean_adjustment_arith,\n      simulated_fp_reduction_pct, threshold_modulation_works\n      (threshold_modulation_works = mean_adjustment_rate > mean_adjustment_arith)\n\
    \   h. Output: results/experiment_386_jitrl_memory.json\n7. Write tests/python/test_jitrl_memory.py (100% coverage required).\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n9. Reconcile:\
    \ update ops/conductor-log.md, ops/changelog.md, ops/status.md,\n   _bmad/architecture.md (add JitRL memory to self-learning stack).\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT\
    \ push. Do NOT modify scripts/research_conductor.py.\n"
