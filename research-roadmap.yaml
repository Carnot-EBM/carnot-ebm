# claude + opus + requires_claude_verified. ARC solve (exp4060) is INCREMENTAL (+1) per the rule.
#
# OPERATOR REVIEW: G1 (exp4056/4057) is the operator's literal TOP PRIORITY -- .374 diagnosed WHY it
# has not closed (saturated corpus), and the fix (EvalPlus + resume-accumulate) is concrete. G3
# (exp4058/4059) executes the operator's explicit resume-not-restart directive. Adjust freely.
