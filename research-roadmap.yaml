  - id: exp6611-live-arc-invariant-projection
    milestone: "2026.08.576"
    deliverable: results/experiment_6611_live_arc_invariant_projection.json
    title: "Live-path invariant projection on archived world-model transitions"
    priority: critical
    track: arc-live-generalization
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 180
    model: opus
    prompt: |
      CONTEXT
      Exp6595 found a bounded held benefit for invariant projection on frozen continuous fixtures. The mechanism is not reachable from Carnot's live ARC policy. This task must extract a reusable default-off projector and evaluate it through the real make_carnot_agent to E3AgentPolicy import closure on immutable archived live-agent world-model transitions. It must not solve a game for the agent or claim a level. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V576 roadmap, Exp6595 artifact, implementation, tests, and capability anchors
      - {project_root}/python/carnot/agentic/arc_competition_agent.py, arc_executable_world_model.py, arc_execution_guided_world_model.py, arc_trajectory_supervisor.py, and arc_world_model_trust_energy.py
