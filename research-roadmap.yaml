- id: exp2351-semantic-energy-real-llm
  title: "Phase 1: Semantic Energy Real-LLM Validation (arXiv:2508.14496) \u2014 Extend exp2338 Prototype"
  milestone: 2026.05.230
  deliverable: results/experiment_2351_semantic_energy_real.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2338-semantic-energy-tier0g
    verdict: 'complete: Semantic Energy synthetic-logit prototype ran to completion; AUROC=1.0 on the 100-example synthetic
      corpus.'
    addressed_by: "exp2338 validated on synthetic Normal(0,0.5) vs Normal(0,2.0) logits. exp2351 tests on real penultimate-layer\
      \ logits from a GGUF model OR from cached logit snapshots in results/. The AUROC=1.0 on synthetic is expected (well-separated\
      \ distributions); real-model performance is the meaningful signal. Ungated \u2014 own GGUF precondition."
    retire_if_same_verdict: false
  prompt: "CONTEXT: exp2338 implemented SemanticEnergyDetector (python/carnot/verify/semantic_energy.py)\nand achieved AUROC=1.0\
    \ on SYNTHETIC logit arrays. This is a sanity check. We now need\nto test on REAL LLM logits to measure actual hallucination\
    \ detection performance.\n\nSemanticEnergyDetector computes energy E(x) = -log Z + mean(|log_softmax(logits)|) using\n\
    penultimate layer logit vectors (one per generated response).\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py\n\
    \  {project_root}/tests/python/verify/test_semantic_energy.py\n  {project_root}/results/experiment_2338_semantic_energy.json\n\
    \nTASK: Validate SemanticEnergyDetector on real or representative logit distributions.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n\
    \     a. Check if a cached logit snapshot exists:\n        ls {project_root}/results/ | grep -i \"logit\\|logprob\\|beaver\\\
    |live\" | head -10\n     b. Check for GGUF model:\n        ls ~/.cache/huggingface/hub/ 2>/dev/null | grep -i \"gemma-4-26B\\\
    |Qwen3.6-35B\"\n     c. If NEITHER logit cache NOR GGUF is available:\n        Use a representative real-distribution\
    \ substitute: load a small transformers model\n        (distilbert or similar from huggingface) and extract its logit\
    \ outputs on 50 prompts.\n        This is NOT the full SOTA model but uses REAL neural network logits, not Normal samples.\n\
    \     If all preconditions checked: proceed regardless (task is ungated and self-adaptive).\n\n  1. Choose the best available\
    \ logit source (in priority order):\n     a. Cached real GGUF logits from prior experiments (grep results/ for logit arrays)\n\
    \     b. Live GGUF model inference (if cached model available)\n     c. Small transformers model (distilbert/similar)\
    \ for representative real logits\n     d. Fallback: paired synthetic logit sets with realistic covariance structure\n\n\
    \  2. Construct a 100-example test set: 50 \"factual\" examples (low-variance logits from\n     high-confidence model\
    \ outputs) and 50 \"hallucination\" examples (high-variance logits\n     from low-confidence or adversarial prompts).\n\
    \n  3. Run SemanticEnergyDetector on both sets. Compute AUROC.\n\n  4. Run unit tests: PYTEST_ADDOPTS=\"\" .venv/bin/python\
    \ -m pytest\n     tests/python/verify/test_semantic_energy.py -v --no-cov 2>&1 | tail -15\n\n  5. Write deliverable.\n\
    \nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with AUROC value.\"\
    \n  - semantic_energy_real_auroc:\n      principle: \"AUROC on real or representative LLM logits. Expected lower than\
    \ 1.0 (realistic).\"\n  - semantic_energy_real_validated:\n      principle: \"True if AUROC >= 0.60 on real-distribution\
    \ logits.\"\n  - logit_source:\n      principle: \"Records which logit source was used (gguf/cached/small-model/synthetic-realistic).\"\
    \n  - n_eval_examples:\n      principle: \"Must be 100 (50 factual + 50 hallucination).\"\n  - random_seed:\n      principle:\
    \ \"Reproducibility. Must be 42.\"\n\nRun command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'\n"
- id: exp2352-nsvif-z3-extractor-v5
  title: "Phase 1: NSVIF Neuro-Symbolic Z3 Extractor v5 \u2014 PRD Priority #1 First Actual Run (arXiv:2601.17789)"
  milestone: 2026.05.230
  deliverable: results/experiment_2352_nsvif_extractor.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  prior_failures:
  - experiment_id: exp2342-nsvif-z3-extractor-v4
    verdict: blocked_gate_check_failed (upstream exp2337-pretest-fix-v10 retired)
    addressed_by: "exp2342 was gate-blocked \u2014 it NEVER ACTUALLY RAN. The structural fix: exp2352 is UNGATED. It checks\
      \ for z3 import availability as its own precondition and runs regardless of any upstream pretest state. The pre-test\
      \ cascade has been confirmed resolved independently."
    retire_if_same_verdict: false
  - experiment_id: exp2327-nsvif-z3-extractor-v3
    verdict: blocked_gate_check_failed (upstream never set pretest_fixed=true)
    addressed_by: Same cascade block. Ungated in .230.
    retire_if_same_verdict: false
  prompt: "CONTEXT: NSVIF (arXiv:2601.17789) is the neuro-symbolic Z3-based constraint extractor\nthat replaces Carnot's failed\
    \ ArithmeticExtractor (regex-based, finds 0 violations on\ninstruction-tuned models). NSVIF is PRD Priority #1 since 2026-04-11\
    \ but has been blocked\nfor 5 consecutive milestones (.225\u2013.229) by the pre-test cascade. exp2352 is UNGATED \u2014\
    \nit has its own z3 precondition and runs regardless of the conductor's pre-test state.\n\nNSVIF approach: parse LLM chain-of-thought\
    \ into logical assertion steps, encode as Z3\nSMT constraints, verify satisfiability. Failed assertions = detected constraint\
    \ violations.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/extraction/ (look for nsvif or z3 extractor)\n\
    \  {project_root}/python/carnot/verify/ (look for nsvif or z3 verifier)\n  {project_root}/scripts/experiment_template.py\
    \ (ExperimentTemplate usage)\n\nTASK: Implement and validate NSVIF neuro-symbolic Z3 constraint extractor.\n\nCONCRETE\
    \ STEPS:\n  0. PRECONDITIONS:\n     a. Verify z3 is importable: .venv/bin/python -c \"import z3; print(z3.get_version_string())\"\
    \n        If z3 is not installed: .venv/bin/pip install z3-solver -q\n        Re-verify: .venv/bin/python -c \"import\
    \ z3; print(z3.get_version_string())\"\n        If still fails: write honest_verdict blocked_z3_unavailable and exit.\n\
    \     b. Check for existing NSVIF code:\n        ls {project_root}/python/carnot/extraction/ | grep -i \"nsvif\\|z3\"\n\
    \        If LogicalStepExtractor or NsvifExtractor already exists, read it and build on it.\n\n  1. Implement NsvifExtractor\
    \ class at python/carnot/extraction/nsvif_extractor.py:\n     - extract_steps(response: str) -> list[str]: parse CoT into\
    \ logical assertion steps\n       using sentence splitting + heuristic (\"therefore\", \"thus\", \"so\", \"equals\", \"\
    =\")\n     - encode_z3(steps: list[str]) -> list[z3.BoolRef]: encode steps as Z3 assertions\n       (arithmetic expressions\
    \ using z3.Int, z3.Real; simple equalities/inequalities)\n     - verify(response: str) -> dict: run z3.Solver, return\
    \ {'satisfiable': bool,\n       'violations': list[str], 'verification_pass': bool}\n\n  2. Create test corpus: 20 arithmetic\
    \ reasoning examples\n     - 10 \"correct\" examples with valid chain-of-thought (satisfiable constraints)\n     - 10\
    \ \"incorrect\" examples with a logical error in the chain-of-thought\n     - Write test corpus to results/experiment_2352_nsvif_corpus.json\n\
    \n  3. Run NsvifExtractor on the test corpus. Compute:\n     - verification_pass_rate: fraction of examples where extractor\
    \ correctly\n       classifies correct (satisfiable) vs incorrect (unsatisfiable)\n     - extraction_coverage: fraction\
    \ of examples where extractor found at least 1 Z3 constraint\n\n  4. Write test for the extractor:\n     PYTEST_ADDOPTS=\"\
    \" .venv/bin/python -m pytest tests/python/ -k \"nsvif\" -v --no-cov 2>&1 | tail -15\n     (Create test file if none exists)\n\
    \n  5. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\
    \ complete: with pass rate.\"\n  - nsvif_extractor_validated:\n      principle: \"True if verification_pass_rate >= 0.60\
    \ on 20-example corpus.\"\n  - verification_pass_rate:\n      principle: \"Primary metric. Expected >= 0.60 for basic\
    \ feasibility.\"\n  - extraction_coverage:\n      principle: \"Fraction of examples with >= 1 Z3 constraint found. Guards\
    \ against empty-extractor.\"\n  - n_correct_examples:\n      principle: \"Must be 10. Validates correct path of NSVIF.\"\
    \n  - n_incorrect_examples:\n      principle: \"Must be 10. Validates violation detection.\"\n  - random_seed:\n     \
    \ principle: \"Reproducibility. Must be 42.\"\n  - z3_version:\n      principle: \"Records which z3 version was used.\"\
    \n\nRun command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'\n"
- id: exp2353-verge-smt-repair-v5
  title: "Phase 1: VERGE SMT Minimal Correction Subset Repair v5 \u2014 First Actual Run (arXiv:2601.20055)"
  milestone: 2026.05.230
  deliverable: results/experiment_2353_verge_repair.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2343-verge-repair-v4
    verdict: blocked_gate_check_failed
    addressed_by: Ungated in .230. Own z3 precondition.
    retire_if_same_verdict: false
  prompt: "CONTEXT: VERGE (arXiv:2601.20055) repairs LLM outputs via Minimal Correction Subsets (MCS):\ngiven a set of violated\
    \ SMT constraints, VERGE finds the minimal subset of the LLM's claims\nthat must be changed to restore satisfiability.\
    \ This is the repair half of the NSVIF pipeline.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/extraction/nsvif_extractor.py\
    \ (if exp2352 created it)\n  {project_root}/python/carnot/repair/ (look for verge or mcs repair)\n  {project_root}/results/experiment_2352_nsvif_extractor.json\
    \ (if available)\n\nTASK: Implement and validate VERGE MCS repair engine.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n  \
    \   a. .venv/bin/python -c \"import z3; print(z3.get_version_string())\"\n        If fails: .venv/bin/pip install z3-solver\
    \ -q; re-check.\n        If still fails: blocked_z3_unavailable and exit.\n     b. Check if NsvifExtractor exists: .venv/bin/python\
    \ -c \"from carnot.extraction.nsvif_extractor import NsvifExtractor; print('OK')\"\n        If fails: implement a minimal\
    \ stub locally for testing.\n\n  1. Implement VergeRepairEngine at python/carnot/repair/verge_repair.py:\n     - find_mcs(constraints:\
    \ list[z3.BoolRef], violated: list[int]) -> list[int]:\n       Returns minimal subset indices to relax. Algorithm: iteratively\
    \ remove one\n       constraint at a time; check if remaining constraints become satisfiable.\n     - suggest_repair(response:\
    \ str, violations: list[str]) -> str:\n       Uses NsvifExtractor violations to identify which claim to modify; returns\n\
    \       a suggestion string (\"Change 'X=Y' to 'X=Z'\")\n\n  2. Create 10 violated constraint scenarios (arithmetic errors)\
    \ and run VergeRepairEngine.\n     Compute mcs_repair_success_rate: fraction where the MCS suggestion points to the\n\
    \     actual error.\n\n  3. Run unit tests if they exist:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/\
    \ -k \"verge\" -v --no-cov 2>&1 | tail -15\n\n  4. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n\
    \      principle: \"Terminal-prefix required.\"\n  - verge_repair_validated:\n      principle: \"True if mcs_repair_success_rate\
    \ >= 0.50.\"\n  - mcs_repair_success_rate:\n      principle: \"Fraction of violated scenarios where MCS correctly identifies\
    \ the error location.\"\n  - n_repair_scenarios:\n      principle: \"Must be 10.\"\n  - random_seed:\n      principle:\
    \ \"Reproducibility. Must be 42.\"\n\nRun command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'\n"
- id: exp2354-eidoku-csp-v6
  title: "Phase 2: Eidoku CSP Tier 2.8 Gate v6 \u2014 First Actual Run (arXiv:2512.20664)"
  milestone: 2026.05.230
  deliverable: results/experiment_2354_eidoku_csp.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2344-eidoku-csp-v5
    verdict: blocked_gate_check_failed
    addressed_by: "Ungated in .230. Never actually ran \u2014 only gate-blocked."
    retire_if_same_verdict: false
  prompt: "CONTEXT: Eidoku (arXiv:2512.20664) adds a CSP (Constraint Satisfaction Problem) gating\nlayer that rejects LLM\
    \ outputs violating hard structural constraints. It detects \"smooth\nfalsehoods\" \u2014 plausible-sounding but structurally\
    \ invalid outputs that pass entropy-based\ndetectors. This is Carnot's Tier 2.8 verifier.\n\nEXISTING CODE TO READ FIRST:\n\
    \  {project_root}/python/carnot/verify/ (look for eidoku or csp)\n  {project_root}/scripts/experiment_template.py\n\n\
    TASK: Implement Eidoku CSP gate and validate on arithmetic constraint corpus.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\
    \ none (pure Python, no special dependencies).\n\n  1. Implement EidokuCspGate at python/carnot/verify/eidoku_csp.py:\n\
    \     - validate(response: str, constraints: list[str]) -> dict:\n       Each constraint is a Python expression string\
    \ (e.g., \"x + y == 42\").\n       Evaluate via safe_eval using ast.literal_eval on parsed numeric expressions.\n    \
    \   Return {'gate_passed': bool, 'violations': list[str]}\n\n  2. Create test corpus: 50 examples\n     - 25 \"correct\"\
    \ with valid arithmetic constraints\n     - 25 \"incorrect\" with at least one violated constraint\n     Compute csp_gate_accuracy:\
    \ fraction correctly classified.\n\n  3. Run unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/\
    \ -k \"eidoku\" -v --no-cov 2>&1 | tail -15\n\n  4. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n\
    \      principle: \"Terminal-prefix required.\"\n  - eidoku_gate_validated:\n      principle: \"True if csp_gate_accuracy\
    \ >= 0.75.\"\n  - csp_gate_accuracy:\n      principle: \"Fraction of 50 examples correctly classified by the CSP gate.\"\
    \n  - n_eval_examples:\n      principle: \"Must be 50.\"\n  - random_seed:\n      principle: \"Reproducibility. Must be\
    \ 42.\"\n\nRun command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'\n"
- id: exp2355-projected-langevin-v6
  title: "Phase 2: Projected-Langevin vs CASAL Baseline v6 \u2014 Comparative Benchmark (arXiv:2605.05387)"
  milestone: 2026.05.230
  deliverable: results/experiment_2355_projected_langevin.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2345-projected-langevin-v5
    verdict: blocked_gate_check_failed
    addressed_by: Ungated in .230. Never ran.
    retire_if_same_verdict: false
  prompt: "CONTEXT: Projected-Langevin dynamics (arXiv:2605.05387) enforces hard equality and inequality\nconstraints during\
    \ sampling by projecting each Langevin update onto the constraint manifold.\nThis is an alternative to CASAL (Carnot's\
    \ current constrained Ising sampler) that may achieve\nbetter constraint satisfaction on non-linear constraint sets.\n\
    \nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/samplers/ (look for casal or langevin)\n  {project_root}/scripts/experiment_template.py\n\
    \nTASK: Implement projected-Langevin sampler and benchmark against CASAL.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS: none\
    \ (pure numpy/JAX, CPU-only).\n\n  1. Implement ProjectedLangevinSampler at python/carnot/samplers/projected_langevin.py:\n\
    \     - sample(energy_fn, constraints: list[callable], init: np.ndarray,\n              n_steps: int=100, step_size: float=0.01,\
    \ temperature: float=1.0) -> np.ndarray\n     - Each Langevin step: x = x - step_size * grad_energy(x) + noise\n     -\
    \ After each step: project x onto constraint manifold using gradient projection.\n       Simple constraint: x[i] in [lo,\
    \ hi] \u2192 clamp. SMT/Z3 constraints: not required for\n       this baseline (use box constraints only).\n\n  2. Benchmark\
    \ on 3-problem suite:\n     - Problem 1: 4-variable Ising with 2 linear constraints\n     - Problem 2: 8-variable system\
    \ with box constraints\n     - Problem 3: 16-variable system with sum constraint\n     For each: run both ProjectedLangevin\
    \ and CASAL (if implemented) for 100 steps.\n     Measure: constraint_satisfaction_rate, energy_at_convergence.\n\n  3.\
    \ Run unit tests:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/ -k \"langevin\" -v --no-cov 2>&1\
    \ | tail -15\n\n  4. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix\
    \ required.\"\n  - projected_langevin_competitive:\n      principle: \"True if projected-Langevin satisfaction_rate >=\
    \ CASAL or CASAL not available.\"\n  - constraint_satisfaction_rate:\n      principle: \"Fraction of final samples satisfying\
    \ all constraints. Primary quality metric.\"\n  - langevin_vs_casal_delta:\n      principle: \"Projected-Langevin minus\
    \ CASAL satisfaction rate. Positive = Langevin wins.\"\n  - n_problems:\n      principle: \"Must be 3.\"\n  - random_seed:\n\
    \      principle: \"Reproducibility. Must be 42.\"\n\nRun command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'\n"
- id: exp2356-kancl-n256-v9
  title: "Phase 3: KAN-CL n=256 Per-Knot Importance Retention v9 \u2014 First Actual Run (arXiv:2605.12306)"
  milestone: 2026.05.230
  deliverable: results/experiment_2356_kancl_n256.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2341-kancl-n256-v8
    verdict: blocked_gate_check_failed
    addressed_by: Ungated in .230. Own KAN import precondition.
    retire_if_same_verdict: false
  - experiment_id: exp2326-kancl-n256-v7
    verdict: blocked_gate_check_failed
    addressed_by: Cascade block. Ungated in .230.
    retire_if_same_verdict: false
  prompt: "CONTEXT: KAN-CL (arXiv:2605.12306) applies per-knot importance regularization to Kolmogorov-\nArnold Networks for\
    \ continual learning. KAN coefficients are spatially dormant outside their\nactivation interval, providing natural task-specific\
    \ separation. This avoids catastrophic\nforgetting better than uniform EWC-style penalties.\n\nn=256 means the constraint\
    \ parameter space has 256 dimensions (n_spins=256 in Carnot's Ising\nsampler). Per-knot importance weights each spline\
    \ coefficient by its activation frequency.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/models/ (look\
    \ for KAN implementation)\n  {project_root}/python/carnot/learning/ (look for continual learning)\n  {project_root}/scripts/experiment_template.py\n\
    \nTASK: Implement and validate KAN-CL per-knot importance for n=256 constraint learning.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n\
    \     a. .venv/bin/python -c \"from carnot.models.kan import KAN; print('OK')\"\n        OR .venv/bin/python -c \"import\
    \ carnot; print('OK')\"\n        If KAN is not importable: try to find the KAN class in python/carnot/models/\n      \
    \  and import it directly.\n        If KAN does not exist: implement a minimal spline-based KAN with n_params=256\n  \
    \      sufficient for the continual learning experiment.\n\n  1. Implement KanClLearner at python/carnot/learning/kan_cl.py:\n\
    \     - Class with fit(X, y, task_id) and predict(X) methods\n     - Per-knot importance: importance[i] = frequency of\
    \ activation of knot i across\n       all training examples for task_id\n     - Regularization: L2 penalty proportional\
    \ to importance[i] on each weight update\n       (prevents overwriting high-importance knots from previous tasks)\n\n\
    \  2. Run Split-Task continual learning benchmark (3 tasks):\n     - Task 1: constraint satisfaction on arithmetic domain\
    \ (50 examples)\n     - Task 2: constraint satisfaction on code domain (50 examples)\n     - Task 3: constraint satisfaction\
    \ on logic domain (50 examples)\n     Sequential training: train Task 1, test 1; train Task 2, test 1+2; train Task 3,\
    \ test 1+2+3.\n     Metrics: forgetting_reduction_pct = 100 * (1 - forgetting_with_kancl / forgetting_without)\n\n  3.\
    \ Run unit tests:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/ -k \"kan_cl or kancl\" -v --no-cov\
