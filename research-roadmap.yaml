- id: exp1533-117-completion-archive-118-activation
  milestone: 2026.04.118
  deliverable: results/experiment_1533_117_completion_archive_118_activation.json
  title: ".117 Completion Archive + .118 Activation Manifest"
  agent_type: codex
  model: gpt-5.5
  max_turns: 20
  estimated_wall_time_min: 25
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1519-116-completion-archive-117-activation
      verdict: prior_milestone_activation_manifest_scope
      addressed_by: "This is expected per-milestone activation bookkeeping for .118; it archives .117 completion and exposes same-roadmap gate fields for automata/SAT contracts, FR-11, claim isolation, and THRML stress."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Milestone .117 completed all 14 planned tasks. It proved runtime-contract
    E2E closure over 458 cases, live local SOTA repair wiring, CDG root-cause
    efficiency gain, product-line rescue on a bounded benchmark, FR-11 safe
    promotion with zero soundness mistakes but zero utility gain, claim
    isolation with explicit budget cost, and THRML/Carnot software parity
    through n=128 plus diverse n=32 topologies. It also exposed the planner
    orphan-test wedge that must be closed in .118. Use {project_root} as the
    project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - research-roadmap.yaml
    - research-complete.yaml
    - research-references.md
    - ops/known-issues.md
    - ops/conductor-log.md
    - ops/changelog.md
    - ops/status.md
    - results/experiment_1532_milestone_117_retro.json
    - results/experiment_1520_runtime_contract_e2e_harness.json
    - results/experiment_1521_live_sota_contract_guided_repair.json
    - results/experiment_1522_cdg_root_cause_repair.json
    - results/experiment_1523_product_line_rescue_or_retire.json
    - results/experiment_1524_fr11_live_policy_promotion.json
    - results/experiment_1525_claim_isolation_ablation.json
    - results/experiment_1530_thrml_carnot_parity_n128.json
    - results/experiment_1531_thrml_diverse_topology_parity_n32.json

    TASK:
    Write the .117 completion archive and .118 activation manifest. Do not
    modify research-roadmap.yaml or scripts/research_conductor.py.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - predecessor_milestone
    - predecessor_criteria_met
    - predecessor_criteria_total
    - activation_manifest_complete
    - prior_runtime_contract_e2e_ready
    - prior_live_sota_repair_ready
    - prior_cdg_ready
    - prior_product_line_ready
    - prior_fr11_promotion_ready
    - prior_claim_isolation_ready
    - prior_thrml_n128_ready
    - prior_thrml_diverse_ready
    - prior_orphan_test_incident_recorded
    - research_complete_has_117_entry
    - mandated_sota_models
    - continuous_self_learning_required
    - allowed_118_tracks
    - gated_118_tracks
    - retired_headline_signals
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1533_117_completion_archive_118_activation.json immediately with status="in_progress".
    2. Read exp1532, the .117 task artifacts, conductor log entries for exp1519 through exp1532, ops/status.md, ops/changelog.md, ops/known-issues.md, and research-complete.yaml.
    3. Verify that exp1532 reports 14 of 14 criteria met. Record whether research-complete.yaml already has a 2026.04.117 entry.
    4. Write ops/milestone_118_activation_manifest.md with allowed tracks: orphan-test guard, automata/XGrammar/ABS contract decoding, SATQuest CNF benchmark, BEAVER-lite prefix-risk audit, residual-drift ledger, external-feedback FR-11 skill graph, product-line scale, claim-isolation uncertainty routing, ARM/EBT soft-value diagnostics, THRML n=256/n=64-diverse stress, Extropic Z1 readiness packet, and milestone retro.
    5. Expose same-roadmap gate fields. Set prior_runtime_contract_e2e_ready=true only if exp1520 is ready with false_accept_rate=0.0. Set prior_live_sota_repair_ready=true only if exp1521 used a mandated SOTA model. Set prior_cdg_ready=true only if exp1522 produced cdg_root_cause_repair_ready=true. Set prior_product_line_ready=true only if exp1523 rescued or explicitly retired the branch. Set prior_fr11_promotion_ready=true only if exp1524 had soundness_mistakes=0 and no_model_weight_mutation=true. Set prior_claim_isolation_ready=true only if exp1525 reported deterministic outcomes and budget metrics. Set prior_thrml_n128_ready=true and prior_thrml_diverse_ready=true from exp1530 and exp1531 respectively.
    6. Record prior_orphan_test_incident_recorded=true if ops/known-issues.md or ops/conductor-log.md documents the .117 orphan-test wedge.
    7. Preserve blocks on legacy small-model headline claims, BEAVER/logprob acceptance authority, ARM/EBT soft-value acceptance authority, Extropic TSU/Z1 hardware execution claims, KV260 board claims, and model-weight mutation.
    8. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.
    9. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1533_117_completion_archive_118_activation.json')); print(d.get('activation_manifest_complete'), d.get('prior_runtime_contract_e2e_ready'), d.get('prior_fr11_promotion_ready'), d.get('prior_thrml_n128_ready'), d.get('prior_orphan_test_incident_recorded'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1534-planner-orphan-test-discipline-guard
  milestone: 2026.04.118
  deliverable: results/experiment_1534_planner_orphan_test_guard.json
  title: "Planner Orphan-Test Discipline Guard - Gated on Exp1533 Orphan Incident"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 45
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  gated_on:
    - upstream: exp1533-117-completion-archive-118-activation
      artifact_field: prior_orphan_test_incident_recorded
      op: "=="
      value: true
  prior_failures:
    - experiment_id: exp1532-milestone-117-retro
      verdict: planner_orphan_test_wedge_carry_forward
      addressed_by: "This task adds a concrete import-target/orphan-test guard before downstream .118 experiments run, instead of relying on manual outer-loop deletion."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    .117 initially wedged because a generated pytest imported a non-existent
    module, carnot.reporting.milestone_117_activation_manifest. The conductor
    only recovered after the orphan test was deleted manually. .118 must add a
    planner/test audit so future generated tests import only existing modules
    or explicitly declared deliverables. Use {project_root} as the project root
    and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - ops/known-issues.md
    - ops/conductor-log.md
    - scripts/validate_prior_failures.py
    - scripts/audit_roadmap_gates.py
    - scripts/roadmap_schema.py
    - tests/
    - results/experiment_1533_117_completion_archive_118_activation.json

    TASK:
    Add or update a lightweight guard that audits generated roadmap tests for
    orphan imports and non-existent implementation targets. Do not modify
    scripts/research_conductor.py.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - orphan_test_guard_ready
    - audit_script_path
    - roadmaps_audited
    - tests_audited
    - import_targets_checked
    - orphan_imports_detected
    - declared_deliverable_imports_allowed
    - focused_tests_passed
    - conductor_modified
    - active_roadmap_modified
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1534_planner_orphan_test_guard.json immediately with status="in_progress".
    2. Inspect the existing roadmap/gate validators and test layout before adding code.
    3. Add the smallest guard needed, preferably as a new script under scripts/ or a focused extension to an existing audit script, that can parse generated tests and flag imports whose top-level package/module path does not exist and is not listed as a declared deliverable artifact.
    4. Add a focused unit test or self-test fixture covering the .117 failure shape: a test importing a non-existent carnot.reporting.milestone_117_activation_manifest module must fail the guard.
    5. Run the focused guard/test command and record counts for roadmaps/tests/import targets/orphan imports.
    6. Confirm scripts/research_conductor.py and research-roadmap.yaml are unchanged.
    7. Write the final artifact with orphan_test_guard_ready=true if the guard passes its focused checks, otherwise complete honestly with orphan_test_guard_ready=false and blocker details.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1534_planner_orphan_test_guard.json')); print(d.get('orphan_test_guard_ready'), d.get('orphan_imports_detected'), d.get('focused_tests_passed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

