      Recheck the requested 2025-2026 sources and write a primary-source receipt. Verify the latest arXiv release, EBT and ARM-EBM citation trails, OpenReview, Hugging Face Papers, GitHub, Extropic, Logical Intelligence, and the rendered ARC leaderboard. Do not make an execution claim for unavailable products or hardware.

