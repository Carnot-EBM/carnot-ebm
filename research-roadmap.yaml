        - tests/python/

      TASK:
        Implement a narrow RecMem-style recurrence-triggered consolidation
        prototype for FR-11 using existing offline traces. This is the mandatory
        continuous self-learning task for milestone 2026.05.272. Do not call a
        live LLM; use deterministic summaries or existing verifier metadata.

      CONCRETE STEPS:
        1. cd {project_root}
        2. Confirm the relevant OpenSpec capability spec exists before editing
           memory or pipeline implementation code.
        3. Load the `.271` offline recurrence backend and replay artifact.
