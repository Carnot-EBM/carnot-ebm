#      best-of-N coverage beat the 0.2581 12B ceiling (latent -> distillation viable) or stay flat
#      (absent -> Invisible Leash holds, need a bigger base)? Clean replacement for flagged exp4022.
#      Distillation is correctly SEQUENCED for after a base shows latent support, not run blind here.
#
# ROUTING: Codex-Default v2 (gemini BANNED). All experiment tasks codex/gpt-5.5. The two
# many-GGUF-call experiments (off-ARC transfer exp4031/4032, decentralization exp4036/4037) are
