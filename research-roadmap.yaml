    \                        ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF\n
    \                        ~/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF; do\n
    \          ls $model_dir/*.gguf 2>/dev/null | head -1 && break\n        done\n        Record:
    model_path (first found), model_family\n        If NO gguf found: write honest_verdict
    blocked_model_not_cached and exit (DO NOT use mock_model).\n     b. llama-cpp-python
    importable:\n        {project_root}/.venv/bin/python -c \"from llama_cpp import Llama;
    print('ok')\"\n        If fails: write honest_verdict blocked_llama_cpp_not_installed
    and exit.\n     c. scipy importable:\n        {project_root}/.venv/bin/python -c
    \"import scipy; print(scipy.__version__)\"\n     Record: preconditions_checked list.\n\n  1.
    Define 20 PRC-topic prompts (Tiananmen, Taiwan, Tibet, Xinjiang, Hong Kong 2019):\n
