       duration_s; source_artifact_hashes; rows; fixture_rows;
       capstone_reference_rows; accepted_upstreams; rejected_upstream_rows;
       excluded_flagged_upstreams; missing_run_date_rows;
       malformed_run_date_rows; exp7108_exp7099_regression_row;
       historical_artifacts_rewritten (false); evidence_ingress_helper_path;
