    policy ("Revenue must exceed expenses to claim profitability"), auto-translate to SMT-LIB
    (`(assert (> revenue expenses))`) and use Z3 to verify LLM responses comply with the policy.

    This extends Carnot's NSVIF (step-level Z3 verification) to POLICY-LEVEL verification:
    the policy is pre-encoded once, then any LLM response about the policy domain is checked
    against the pre-compiled SMT-LIB assertions.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/extraction/nsvif_extractor.py
      {project_root}/results/experiment_2373_nsvif_compliance.json (compliance domain baseline)
      {project_root}/results/experiment_2366_nsvif_verge_real.json (real-data NSVIF baseline)

    TASK: Implement NSVIF SMT-LIB policy formalization pipeline and evaluate on 3 policy domains.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Verify NSVIF importable:
            .venv/bin/python -c "from carnot.extraction.nsvif_extractor import NsvifExtractor; print('OK')"
            If fails: write honest_verdict blocked_nsvif_not_implemented and exit.
         b. Verify z3:
            .venv/bin/python -c "import z3; print(z3.get_version_string())"
         c. CPU-only.

      1. Implement NsvifPolicyEncoder at python/carnot/extraction/nsvif_policy.py:
         - encode_policy(policy_description: str) -> list[str]:
             Translate natural language policy into SMT-LIB assertion strings.
             Use simple template matching for common patterns:
               "X must exceed Y" → "(assert (> X Y))"
               "X equals Y" → "(assert (= X Y))"
               "X is at most Y" → "(assert (<= X Y))"
               "X is at least Y" → "(assert (>= X Y))"
         - verify_response_against_policy(response: str, smt_assertions: list[str]) -> dict:
             Extract numerical claims from response (using regex for numbers).
             Build Z3 model with smt_assertions + extracted values.
             Return {policy_satisfied: bool, violations: list[str], smt_assertions_count: int}

      2. Define 3 policy domains (distinct from exp2373 financial compliance):
         Policy A: "All users must be >= 18 years old to access premium features"
           → SMT: (assert (>= user_age 18))
           Test 5 LLM responses: 3 correct (cite age >= 18), 2 violating (cite underage access)
         Policy B: "Delivery time must not exceed 3 business days for express shipping"
           → SMT: (assert (<= delivery_days 3))
           Test 5 LLM responses
         Policy C: "The sum of all component costs must equal the total project cost"
           → SMT: (assert (= (+ cost_A cost_B cost_C) total_cost))
           Test 5 LLM responses

      3. Run policy verification on all 15 test responses:
         Compute:
           - policy_compliance_rate: fraction correctly classified (compliant vs violating)
           - policy_extraction_coverage: fraction where SMT assertions successfully built
           - smt_lib_assertions_per_policy: mean count of Z3 assertions per policy

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with policy_compliance_rate."
      - nsvif_policy_validated:
          principle: "True if SMT-LIB policy encoding ran on all 3 domains."
      - policy_compliance_rate:
          principle: "Fraction of test responses correctly classified by policy verification."
      - policy_extraction_coverage:
          principle: "Fraction where SMT assertions built. Zero means encoder failed entirely."
      - n_policy_domains:
          principle: "Must be 3."
      - n_test_responses:
          principle: "Must be 15."
      - random_seed:
          principle: "Reproducibility. Must be 42."
      - duration_s:
          principle: "Guards against fabrication."

    ACCEPTANCE GATES:
      - condition: "nsvif_policy_validated == true"
        principle: "SMT-LIB policy encoding must run on all 3 domains."

    Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

- id: exp2388-phase1-ship-gate-check
  title: 'Phase 4: Phase 1 Ship Gate Audit — PyPI + HF Mirror + CLI + MCP + External Reproducer'
  milestone: 2026.05.232
  deliverable: results/experiment_2388_phase1_ship_gate.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 20
  prior_failures:
  - experiment_id: exp-none
    verdict: 'no prior ship gate check'
    addressed_by: "First formal Phase 1 ship gate audit. CLAUDE.md defines 5 criteria:
      (1) PyPI package carnot-ebm published, (2) HF mirror at huggingface.co/Carnot-EBM,
      (3) MCP server documentation, (4) CLI documentation, (5) external reproducer.
      exp2388 checks each criterion and records pass/fail per criterion."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: CLAUDE.md defines Phase 1 ship gate criteria (all must be met before Phase 1
    is declared complete):
      1. PyPI package carnot-ebm published and installable
      2. HF mirror: at least one model artifact at huggingface.co/Carnot-EBM
      3. MCP server documentation (README with examples)
      4. CLI documentation (help text + usage guide)
      5. External reproducer (could be CI run, teammate, or external user)

    This is the first formal audit against this checklist. Record pass/fail per criterion
    and what specific action is needed for any failing criterion.

    EXISTING CODE TO READ FIRST:
      {project_root}/README.md
      {project_root}/docs/ (look for MCP server and CLI docs)
      {project_root}/python/carnot/mcp/server.py (MCP server code)
      {project_root}/setup.py or pyproject.toml (PyPI package config)
      {project_root}/.github/workflows/publish-pypi.yml (if exists)

    TASK: Check all 5 Phase 1 ship gate criteria and write audit artifact.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Verify pip available:
            .venv/bin/pip --version
         b. Verify git available:
            git --version
         c. Network check (for PyPI/HF queries):
            curl -sf -o /dev/null https://pypi.org/simple/carnot-ebm/ && echo "PyPI reachable" || echo "PyPI unreachable"
            curl -sf -o /dev/null https://huggingface.co/Carnot-EBM && echo "HF reachable" || echo "HF unreachable"

      1. Criterion 1: PyPI package published
         .venv/bin/pip index versions carnot-ebm 2>&1 || pip3 index versions carnot-ebm 2>&1
         Record: pypi_versions_available (list), pypi_criterion_passed (bool)

      2. Criterion 2: HF mirror
         curl -sf "https://huggingface.co/api/models?author=Carnot-EBM" 2>/dev/null | head -200 || echo "API check failed"
         Record: hf_models_available (count), hf_criterion_passed (bool)

      3. Criterion 3: MCP server documentation
         ls {project_root}/docs/mcp* {project_root}/README.md | head -5
         grep -l "MCP" {project_root}/docs/*.md 2>/dev/null || echo "no MCP docs"
         grep -c "mcp\|MCP" {project_root}/README.md 2>/dev/null || echo "0"
         Record: mcp_docs_found (bool), mcp_readme_mentions (int), mcp_criterion_passed (bool)

      4. Criterion 4: CLI documentation
         .venv/bin/python -m carnot --help 2>&1 | head -20 || echo "CLI not found"
         grep -c "cli\|CLI\|command" {project_root}/README.md 2>/dev/null || echo "0"
         Record: cli_help_works (bool), cli_criterion_passed (bool)

      5. Criterion 5: External reproducer
         Check git log for external contributor commits or CI artifacts indicating external use.
         grep -r "reproducer\|external.*user\|independent.*verif" {project_root}/ops/*.md 2>/dev/null | head -5
         Record: external_reproducer_found (bool), external_reproducer_evidence (str or null)

      6. Compute: n_criteria_passed (0-5), all_ship_criteria_met (true only if all 5 pass)
         For each failing criterion: record action_needed string.

      7. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: n_criteria_passed=N/5."
      - n_criteria_passed:
          principle: "Count of the 5 Phase 1 ship criteria that are met."
      - all_ship_criteria_met:
          principle: "True only if all 5 criteria pass. Phase 1 ship gate."
      - pypi_criterion_passed:
          principle: "carnot-ebm on PyPI and installable."
      - hf_criterion_passed:
          principle: "HF mirror has >= 1 model artifact."
      - mcp_criterion_passed:
          principle: "MCP server has documentation."
      - cli_criterion_passed:
          principle: "CLI help works and is documented."
      - external_reproducer_found:
          principle: "At least one independent reproducer exists."
      - actions_needed:
          principle: "List of actions required for failing criteria. Empty if all pass."
      - duration_s:
          principle: "Guards against fabrication."

    ACCEPTANCE GATES:
      - condition: "honest_verdict.startswith('complete:')"
        principle: "Ship gate check must complete (even if criteria fail — we need the honest audit)."

    Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

