    reasoning: correct CoT steps → low energy, incorrect steps → high energy.
    The energy function calibrates latent thoughts toward logically consistent
    regions. Carnot's KAN energy tier already implements low=correct/high=incorrect
    semantics. Applying EBM-CoT's loss function to Carnot's KAN training on
    FoVer verified pairs could improve the calibration of energy predictions
