- id: exp780-preflight-v12-gpu-zombie-killer
  milestone: 2026.04.60
  deliverable: results/experiment_780_preflight_v12_gpu_zombie_killer.json
  title: 'Exp 780: Pre-flight v12 — GPU Zombie Killer + Kill-Before-Load (MANDATORY FIRST)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Milestone .59 retro confirmed two related open RETROs from OOM failures:
    RETRO-028 (Gemma4 14.89 GiB allocation fails with 15 GiB already in use) and
    RETRO-SOTA-GGUF-TIMEOUT (Exp 769 timed out — same GPU OOM root cause). Both blockers
    share a common root cause: GPU memory occupied by zombie processes before model load.
    The fix mirrors apply_env_autofix() (RETRO-022 workaround): a mandatory systemic function
    kill_gpu_zombies() that ALL GPU experiments must call before any model load attempt.
    This experiment implements kill_gpu_zombies() in ExperimentTemplate, validates it clears
    GPU memory, updates the pre-flight manifest, and tests that the function works safely
    on a clean GPU (no-op) and on a zombie-occupied GPU (kills zombies).

    EXISTING CODE TO READ FIRST:
    - scripts/research_conductor.py — confirm kill_gpu_zombies call site pattern (do NOT modify)
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() pattern to follow exactly
    - scripts/experiment_template.py — ExperimentTemplate.setup_gpu() — add kill_gpu_zombies() call
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog
    - results/operational_retro_2026_04_59.json — RETRO-028 and RETRO-SOTA-GGUF-TIMEOUT details
    - scripts/experiment_template.py — ExperimentTemplate class structure

    TASK: Implement kill_gpu_zombies() in python/carnot/pipeline/gpu_zombie_killer.py.
    Wire into ExperimentTemplate.setup_gpu() as mandatory call. Validate on current GPU state.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-INFRA-054 (kill_gpu_zombies() MUST be called before any model load in
       ExperimentTemplate.setup_gpu() when CARNOT_FORCE_LIVE=1; MUST use subprocess to
       kill all PIDs holding GPU memory except the current process and system processes),
       REQ-INFRA-055 (kill_gpu_zombies() MUST be a no-op when no GPU zombies exist;
       MUST NOT kill the calling process itself),
       SCENARIO-INFRA-063/064 to openspec/capabilities/pipeline/spec.md.
    3. Implement python/carnot/pipeline/gpu_zombie_killer.py:
       a. GPUZombieResult dataclass:
          - gpu_index (int), pids_found (list[int]), pids_killed (list[int]),
          - vram_before_mb (float), vram_after_mb (float), vram_freed_mb (float),
          - kill_attempted (bool), honest_verdict (str)
       b. get_gpu_memory_pids(gpu_index: int) -> list[int]:
          - Run: nvidia-smi --query-compute-apps=pid --format=csv,noheader,nounits -i (gpu_index)
          - Parse output: list of integer PIDs.
          - Return [] if nvidia-smi unavailable or no processes.
       c. kill_gpu_zombies(gpu_index: int = 0, exclude_pids: list[int] | None = None) -> GPUZombieResult:
          - exclude_pids defaults to [os.getpid()] — never kill the calling process.
          - Get vram_before_mb via: nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits -i (gpu_index)
          - Get pids_found = get_gpu_memory_pids(gpu_index).
          - For each PID in pids_found that is NOT in exclude_pids:
            * Try: os.kill(pid, signal.SIGKILL). Record in pids_killed.
            * Wait 2 seconds after all kills for GPU to release memory.
          - Get vram_after_mb.
          - honest_verdict:
            * "zombies_killed_vram_freed" if pids_killed and vram_freed_mb > 100
            * "zombies_killed_vram_unclear" if pids_killed and vram_freed_mb <= 100
            * "no_zombies_found" if pids_found == []
            * "nvidia_smi_unavailable" if nvidia-smi not found
       d. Export kill_gpu_zombies / GPUZombieResult from carnot.pipeline.__init__
    4. Wire kill_gpu_zombies() into ExperimentTemplate.setup_gpu():
       a. In setup_gpu(), BEFORE any model load: if CARNOT_FORCE_LIVE is set:
          result = kill_gpu_zombies(gpu_index=0)
          log result.honest_verdict (INFO level)
       b. Record result in setup_gpu() return dict: zombie_kill_result=result.honest_verdict
    5. GPU state check for this experiment:
       a. Run `nvidia-smi` to read current GPU state.
       b. Record: gpu0_vram_used_mb, gpu0_pids (from nvidia-smi).
       c. Call kill_gpu_zombies(0). Record result.
       d. Read vram_used_mb after kill. Confirm no-op if no zombies, freed if zombies present.
    6. Create scripts/experiment_780_preflight_v12_gpu_zombie_killer.py:
       a. ExperimentTemplate(780) + ExperimentTimeoutWatchdog(780, timeout_minutes=30).
       b. apply_env_autofix() FIRST.
       c. Implement steps 5 (GPU state check + kill test).
       d. honest_verdict:
          - "gpu_zombie_killer_deployed" if kill_gpu_zombies implemented AND wired in setup_gpu
          - "no_zombies_on_this_run" if honest_verdict == "no_zombies_found" (clean GPU)
          - "zombies_killed_successfully" if zombies found and killed
          - "nvidia_smi_unavailable" if GPU tools not present
       e. artifact: gpu0_vram_used_mb_before, gpu0_pids_before, zombie_kill_result,
          gpu0_vram_used_mb_after, vram_freed_mb, setup_gpu_wired (bool), honest_verdict.
    7. Write tests/python/test_experiment_780_preflight_v12_gpu_zombie_killer.py with 100% coverage:
       - test kill_gpu_zombies() returns no_zombies_found on empty GPU (mock nvidia-smi → no PIDs).
       - test kill_gpu_zombies() excludes calling process PID from kill list.
       - test GPUZombieResult.vram_freed_mb = vram_before - vram_after.
       - test honest_verdict maps correctly to pids_killed and vram_freed_mb.
       Each test traces to REQ-INFRA-054/055.
    8. Reconcile:
       - ops/status.md: "Pre-flight v12 (GPU zombie killer): honest_verdict=X. zombie_kill
         deployed in ExperimentTemplate.setup_gpu(). RETRO-028 root-cause addressed."
       - ops/changelog.md: one-line with honest_verdict.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp781-jepa-v20-data-collection
  milestone: 2026.04.60
  deliverable: results/experiment_781_jepa_v20_data_collection.json
  title: 'Exp 781: JEPA v20 Live Data Collection — 100q Qwen3.5-0.8B GSM8K (GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA v19 (Exp 770) achieved ood_auc=0.5667 < 0.75 gate because only 57 real
    labeled CoT steps were available (Exp 442). Research diagnosis: 57 pairs from a single
    live run produce a training corpus that is not diverse enough to generalize OOD.
    The fix: run a second live benchmark collecting 100 questions with Qwen3.5-0.8B
    (known to work reliably on RTX 3090), extract CoT steps, apply FOVER Z3 annotation,
    and write a second real labeled corpus. Combined with Exp 442's 57 pairs, this triples
    the training data to ~137+ real pairs covering more diverse arithmetic step patterns.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/gpu_zombie_killer.py — kill_gpu_zombies() (Exp 780 output).
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() pattern.
    - python/carnot/pipeline/fover_live.py — LiveFOVERResult, build_live_fover_artifact().
    - python/carnot/pipeline/fover_annotator.py — FOVERAnnotator.annotate_corpus().
    - results/experiment_442_fover_live_annotation.json — 57-pair baseline to read.
    - results/fover_labeled_steps_live.json — existing labeled steps (do NOT overwrite).
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline for inference.
    - python/carnot/pipeline/long_run_executor.py — LongRunBenchmarkExecutor (checkpoint).
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Run 100 GSM8K questions live with Qwen3.5-0.8B. Extract CoT steps. Apply FOVER
    Z3 annotation. Write results/fover_labeled_steps_live_v2.json (NEW file, do NOT modify
    fover_labeled_steps_live.json). Target: n_labeled >= 80 new real pairs.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-048 (live data collection MUST use kill_gpu_zombies() before model load;
       MUST write new labeled pairs to fover_labeled_steps_live_v2.json without modifying
       fover_labeled_steps_live.json), REQ-LEARN-049 (n_labeled MUST be reported honestly;
       labeling_rate = n_labeled / n_steps_found; target n_labeled >= 80),
       SCENARIO-LEARN-092/093 to openspec/capabilities/self_learning/spec.md.
    3. apply_env_autofix() FIRST. Then kill_gpu_zombies(gpu_index=0).
    4. If CARNOT_FORCE_LIVE not set: write artifact honest_verdict="blocked_no_live_gpu" and exit.
    5. setup_gpu([("name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0)]).
    6. Load 100 GSM8K questions (seed=9999 to avoid overlap with Exps 439/742/781).
       Use LongRunBenchmarkExecutor (batch_size=10) for checkpoint-resume.
    7. For each batch of 10 questions:
       a. Run VerifyRepairPipeline.verify_and_repair(question). Record: response, cot_text.
       b. Checkpoint batch to results/exp781_ckpt.json.
    8. After all 100 questions:
       a. Pool all 100 responses. Run FOVERAnnotator.annotate_corpus(responses).
       b. Extract: n_steps_found, n_labeled, n_correct, n_incorrect.
       c. Write labeled pairs to results/fover_labeled_steps_live_v2.json
          (SEPARATE from fover_labeled_steps_live.json — do NOT merge or overwrite).
       d. labeling_rate = n_labeled / n_steps_found.
    9. Create scripts/experiment_781_jepa_v20_data_collection.py:
       a. ExperimentTemplate(781, requires_gpu=True) + ExperimentTimeoutWatchdog(781, 90min).
       b. Implement steps 3-8.
       c. honest_verdict:
          - "real_data_collected_sufficient" if n_labeled >= 80 AND inference_mode="live_gpu"
          - "real_data_collected_insufficient" if 20 <= n_labeled < 80 AND live_gpu
          - "real_data_below_threshold" if n_labeled < 20 AND live_gpu
          - "blocked_no_live_gpu" if CARNOT_FORCE_LIVE not set
       d. artifact: n_questions, n_steps_found, n_labeled, n_correct, n_incorrect,
          labeling_rate, labeled_file="fover_labeled_steps_live_v2.json",
          inference_mode, honest_verdict.
    10. Write tests/python/test_experiment_781_jepa_v20_data_collection.py with 100% coverage:
        - test kill_gpu_zombies() is called before setup_gpu().
        - test labeled pairs written to fover_labeled_steps_live_v2.json (separate file).
        - test honest_verdict requires live_gpu AND n_labeled >= 80 for "sufficient".
        Each test traces to REQ-LEARN-048/049.
    11. Reconcile:
        - ops/status.md: "JEPA v20 data collection: n_labeled=X (target>=80).
          inference_mode=live_gpu. Corpus: fover_labeled_steps_live_v2.json."
        - ops/changelog.md: one-line with honest_verdict.
    12. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0. kill_gpu_zombies() BEFORE model load.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp782-edu-prm-step-selection
  milestone: 2026.04.60
  deliverable: results/experiment_782_edu_prm_step_selection.json
  title: 'Exp 782: EDU-PRM Uncertainty Step Selection — Diversified JEPA Training Corpus (arXiv 2503.22233)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2503.22233 "EDU-PRM: Entropy-Driven Uncertainty for Process Reward Modeling"
    (March 2025) shows entropy-based uncertainty selection achieves full-corpus performance with
    only 1.5% of training data. The key insight: steps near the decision boundary (high model
    prediction variance across bootstrap samples) contribute the most discriminative signal;
    clear-cut correct/incorrect steps add little information. Applying this to Carnot's JEPA
    training: select the 30% highest-variance steps from the pooled FoVer corpus to focus
    JEPA v20 training on difficult examples.

    JEPA v19 (Exp 770) failed OOD because it trained on all 57 steps uniformly, including
    many trivially correct steps that added no discriminative information. EDU-PRM selection
    should improve OOD generalization by concentrating training on the hard cases.

    EXISTING CODE TO READ FIRST:
    - results/fover_labeled_steps_live.json — 57 original labeled steps (Exp 442).
    - results/fover_labeled_steps_live_v2.json — new labeled steps from Exp 781 (load if exists).
    - python/carnot/samplers/jepa_v19.py — MultiStepJEPAv19 architecture (reference).
    - python/carnot/pipeline/fover_annotator.py — FOVERAnnotator step structure.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement EDUPRMStepSelector. Pool all real FoVer labeled steps. Select top 30%
    highest-variance steps. Write selected corpus to results/fover_edu_prm_selected.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-050 (EDUPRMStepSelector MUST compute prediction variance over N_BOOTSTRAP=10
       bootstrap samples of a TF-IDF + logistic classifier; MUST select top 30% by variance),
       REQ-LEARN-051 (selected corpus MUST be written to fover_edu_prm_selected.json; MUST
       report uncertainty_selected_pct and diversity_score vs uniform selection),
       SCENARIO-LEARN-094/095 to openspec/capabilities/self_learning/spec.md.
    3. Implement python/carnot/pipeline/edu_prm_selector.py:
       a. EDUPRMConfig(n_bootstrap=10, selection_pct=0.30).
       b. EDUPRMStepSelector(config: EDUPRMConfig):
          fit_bootstrap(step_texts: list[str], labels: list[int]) -> None:
            - For each of N_BOOTSTRAP=10 bootstrap iterations:
              * Resample training data with replacement (same size).
              * Fit TF-IDF (128-dim) + LogisticRegression on bootstrap sample.
              * Record predictions on FULL corpus.
            - Compute variance of predictions across bootstrap models per step.
          select(step_texts: list[str], labels: list[int]) -> list[int]:
            - Fit bootstrap models.
            - Compute variance per step (uncertainty score).
            - Select indices with variance in top selection_pct fraction.
            - Return selected indices.
          diversity_score(selected_labels: list[int]) -> float:
            - Returns positive_fraction (fraction of label=1) in selected set.
            - Ideal: near 0.5 (balanced hard examples).
    4. Pool labeled steps:
       a. Load results/fover_labeled_steps_live.json (57 steps).
       b. Load results/fover_labeled_steps_live_v2.json (Exp 781 steps, if exists).
       c. Pool: step_texts, labels. Record: n_total_before_selection.
    5. Apply EDUPRMStepSelector.select(step_texts, labels).
       Record: selected_indices, n_selected, uncertainty_selected_pct.
    6. Write results/fover_edu_prm_selected.json:
       Selected (step_text, label) pairs in same format as fover_labeled_steps_live.json.
       Record: diversity_score (positive_fraction of selected labels).
    7. Compute diversity improvement:
       uniform_diversity = positive_fraction(all labels)
       selected_diversity = positive_fraction(selected labels)
       diversity_delta = abs(selected_diversity - 0.5) < abs(uniform_diversity - 0.5)
       (True = selection is more balanced than uniform, i.e., harder examples are more balanced)
    8. Create scripts/experiment_782_edu_prm_step_selection.py:
       a. ExperimentTemplate(782) + ExperimentTimeoutWatchdog(782, timeout_minutes=20).
       b. Implement steps 4-7.
       c. honest_verdict:
          - "edu_prm_selected_diverse" if uncertainty_selected_pct >= 0.30 AND diversity_delta=True
          - "edu_prm_selected_uniform" if uncertainty_selected_pct >= 0.30 AND diversity_delta=False
          - "edu_prm_insufficient_data" if n_total_before_selection < 30
          - "edu_prm_selection_failed" if any exception
       d. artifact: n_total_before_selection, n_selected, uncertainty_selected_pct,
          uniform_diversity, selected_diversity, diversity_delta (bool),
          selected_corpus_path="fover_edu_prm_selected.json", honest_verdict.
    9. Write tests/python/test_experiment_782_edu_prm_step_selection.py with 100% coverage:
       - test EDUPRMStepSelector.select() returns top selection_pct fraction by variance.
       - test diversity_score = positive_fraction of selected labels.
       - test fit_bootstrap runs N_BOOTSTRAP=10 iterations and stores N_BOOTSTRAP predictions.
       Each test traces to REQ-LEARN-050/051.
    10. Reconcile:
        - ops/status.md: "EDU-PRM step selection (arXiv 2503.22233): n_selected=X from N=Y.
          diversity_delta=Z. Selected corpus: fover_edu_prm_selected.json."
        - ops/changelog.md: one-line with honest_verdict.
    11. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp783-jepa-v20-retrain
  milestone: 2026.04.60
  deliverable: results/experiment_783_jepa_v20_retrain.json
  title: 'Exp 783: JEPA v20 Retrain — Pooled Real Data + EDU-PRM Selection (Target OOD AUC > 0.75)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA v19 (Exp 770) ood_auc=0.5667 — below the 0.75 gate for Tier 3.5 deployment.
    Root cause: 57 training pairs insufficient for OOD generalization (RETRO-JEPA-OOD-V19).
    JEPA v20 addresses this with three improvements:
    1. More data: Exp 781 collected 80+ new real labeled pairs (fover_labeled_steps_live_v2.json)
    2. Better selection: Exp 782 applied EDU-PRM uncertainty selection to focus on hard examples
    3. Same MultiStepJEPAv19 architecture (n_steps=3) but retrained on the expanded corpus

    If ood_auc > 0.75: Exp 784 deploys JEPA v20 as Tier 3.5 (closing FR-11 Tier 3 loop).
    If 0.60 < ood_auc <= 0.75: improvements noted, RETRO-JEPA-OOD-V19 stays open.
    If ood_auc <= 0.60: regression from v19 — investigate training bug.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_v19.py — MultiStepJEPAv19 architecture to reuse/extend.
    - results/jepa_v19_model.npz — v19 model weights as baseline (load if exists).
    - results/fover_labeled_steps_live.json — 57 original pairs (Exp 442).
    - results/fover_labeled_steps_live_v2.json — new pairs from Exp 781 (load if exists).
    - results/fover_edu_prm_selected.json — EDU-PRM selected corpus from Exp 782 (load if exists).
    - results/experiment_770_jepa_v19_predictive.json — v19 baseline: ood_auc=0.5667.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Train JEPA v20 on pooled EDU-PRM selected real data. Target OOD AUC > 0.75.
    If OOD AUC > 0.75: save model to results/jepa_v20_model.npz. Gate Exp 784.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-052 (JEPA v20 MUST be trained exclusively on real accumulated data from
       live GPU experiments; EDU-PRM selected corpus MUST be preferred over uniform sampling;
       synthetic injection NOT allowed), REQ-LEARN-053 (JEPA v20 OOD AUC MUST exceed 0.75
       to gate Tier 3.5 deployment in Exp 784; if OOD AUC <= 0.75, file RETRO-JEPA-OOD-V20),
       SCENARIO-LEARN-096/097 to openspec/capabilities/self_learning/spec.md.
    3. Collect training data:
       a. Load results/fover_edu_prm_selected.json — use if available (n_selected steps).
       b. If not available: load both fover_labeled_steps_live.json AND fover_labeled_steps_live_v2.json,
          pool all pairs as training data (fallback).
       c. Record: n_training_pairs, data_source (edu_prm_selected / pooled_raw / single_file).
    4. Create python/carnot/samplers/jepa_v20.py:
       - MultiStepJEPAv20 inherits from MultiStepJEPAv19 (import from jepa_v19.py).
       - Override: n_steps=3, n_epochs=300 (more training), lr=5e-4 (tuned for smaller datasets).
       - Add: class-weight balancing (weight_positive = n_negative / n_positive in BCE loss).
         Rationale: EDU-PRM selected corpus may be imbalanced; class weighting corrects for it.
       - Keep same TF-IDF embedding + 2-layer MLP architecture.
    5. Train MultiStepJEPAv20 on training data with class-weight balancing.
    6. Evaluate:
       a. In-distribution AUC: 80/20 split of training data.
       b. OOD AUC: GSM8K questions 800-999 (same as Exp 770 OOD test set).
          Generate synthetic step sequences from GSM8K text.
          Label by FOVER annotation (Z3 arithmetic check).
    7. Compare: ood_auc (v20) vs v19 baseline=0.5667. delta = v20 - v19.
    8. Save model if ood_auc > 0.75: results/jepa_v20_model.npz
    9. Create scripts/experiment_783_jepa_v20_retrain.py:
       a. ExperimentTemplate(783) + ExperimentTimeoutWatchdog(783, timeout_minutes=45).
       b. Implement steps 3-8.
       c. honest_verdict:
          - "jepa_v20_ood_viable" if ood_auc > 0.75 (Tier 3.5 gate unlocked)
          - "jepa_v20_improving" if 0.60 < ood_auc <= 0.75 (above v19 baseline)
          - "jepa_v20_below_v19" if ood_auc <= 0.5667 (regression — investigate)
          - "jepa_v20_insufficient_data" if n_training_pairs < 30
       d. artifact: n_training_pairs, data_source, in_dist_auc, ood_auc,
          ood_auc_delta_vs_v19 (= ood_auc - 0.5667), model_saved_path (str or None),
          class_weight_used (bool), honest_verdict.
    10. Write tests/python/test_experiment_783_jepa_v20_retrain.py with 100% coverage:
        - test MultiStepJEPAv20 applies class-weight balancing in BCE loss.
        - test data_source is "edu_prm_selected" when fover_edu_prm_selected.json exists.
        - test model saved to jepa_v20_model.npz when ood_auc > 0.75.
        - test ood_auc_delta_vs_v19 = ood_auc - 0.5667.
        Each test traces to REQ-LEARN-052/053.
    11. Reconcile:
        - ops/status.md: "JEPA v20 retrain: ood_auc=X (target > 0.75, v19=0.5667).
          ood_auc_delta=Y. Tier 3.5: VIABLE/NOT YET. honest_verdict=X."
          If ood_auc > 0.75: "RETRO-JEPA-OOD-V19 CLOSED. Run Exp 784 for cascade."
        - ops/changelog.md: one-line with honest_verdict.
    12. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp784-jepa-v20-cascade-deploy
  milestone: 2026.04.60
  deliverable: results/experiment_784_jepa_v20_cascade_deploy.json
  title: 'Exp 784: JEPA v20 Cascade Deploy — Tier 3.5 Predictive Verification (GATED on Exp 783 OOD AUC > 0.75)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: GATED on Exp 783 (JEPA v20 retrain). Read results/experiment_783_jepa_v20_retrain.json FIRST.
    - If honest_verdict="jepa_v20_ood_viable" (OOD AUC > 0.75): proceed with cascade deployment.
    - If any other verdict: write artifact honest_verdict="blocked_ood_auc_below_gate" and exit.

    This is a direct retry of Exp 778 (which was blocked because Exp 770 ood_auc=0.5667 < 0.75).
    JEPA v20 with OOD AUC > 0.75 is the minimum viable Tier 3.5 predictor. Deploying it closes
    FR-11 Tier 3 self-learning loop: "Train a model to predict constraint violations BEFORE the
    LLM finishes. Input: partial response → predict which constraints will be violated."

    EXISTING CODE TO READ FIRST:
