- id: exp6811-operational-obligation-automaton-v3
  title: Typed operational-obligation automaton v3
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.08.595
  deliverable: results/experiment_6811_operational_obligation_automaton_v3.json
  gated_on:
    - upstream: exp6810-v595-contract-manifest-preflight
      artifact_field: v595_contract_map_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6802 passed its deterministic source checks but blocked on a nonexistent spec path. Exp6810
    maps this scope to real OpenSpec owners. CEDAR (arXiv:2608.27797) and constraint-weakening work
    support a typed event automaton. Recover the original science. Do not claim a live benefit.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6810_v595_contract_manifest_preflight.json
    - {project_root}/results/experiment_6802_operational_obligation_automaton_v2.json
    - {project_root}/python/carnot/agentic/arc_trajectory_supervisor.py
    - {project_root}/python/carnot/experiment_6656_arc_trace_automaton_live_loo.py
    - {project_root}/results/experiment_6681_arc_post_redirect_outcomes.json
    - {project_root}/openspec/capabilities/agentic-harness/spec.md
    - {project_root}/openspec/capabilities/constraint-verification/spec.md
    - {project_root}/ops/arc_solve_registry.yaml

    TASK:
    Add a backward-compatible v3 operational-obligation contract to the existing supervisor. Each
    obligation carries prerequisite, authority, fallback, execution consequence, and hard, binding,
    or soft priority. Compile records into a deterministic event automaton and lexicographic exact
    energy. Use frozen source-free traces and no LLM.

    CONCRETE STEPS:
    0. PRECONDITIONS: require v595_contract_map_ready=true. Hash the owned REQ anchors, v1
       supervisor, Exp6656, Exp6681, and registry. On failure write complete_blocked_operational_
       obligation_automaton_v3 with gate_check_summary and stop.
    1. Write tests first. Define canonical bytes and preserve v1 reads. Reject unknown priorities,
       absent authority, missing fallback, ambiguous prerequisites, consequence deletion, duplicate
       IDs, unbounded cycles, and non-canonical serialization.
    2. Compile hard feasibility before binding authority order and soft progress. A finite soft
       score may never compensate for a hard violation. Emit no-candidate and no-op certificates.
    3. Reuse source-free runtime events from Exp6656 and Exp6681. Add mutations for priority
       inversion, stale prerequisite, authority spoof, fallback loss, consequence weakening,
       duplicate events, and replay reorder.
    4. Rebuild in a fresh process. Require byte-identical states, legal action sets, selected
       actions, conflict certificates, and hashes.
    5. Emit one row per trace and mutation. Set operational_automaton_fixture_ready from complete
       schema, compiler, replay, compatibility, and attack coverage. This field is consumed by
       Exp6812 and Exp6819.
    6. Run focused tests, ruff, OpenSpec coverage, applicable ARC E2E checks, adversarial
       verification, artifact convention audit, and verdict-row consistency lint.
    7. REQUIRED ARTIFACT FIELDS AND PRINCIPLES: field_principles (principle per field);
       inference_substrate (deterministic CPU automaton, no LLM); duration_s (measured wall time);
       random_seed (fixed mutation seed); reproducibility_checksum (bind inputs and outputs);
       source_artifact_hashes (bind frozen evidence); obligation_schema (canonical five-part
       contract); priority_order (hard before binding before soft); compiler_manifest (owned code
       and REQ); canonical_byte_receipts (fresh-process identity); backward_compatibility_receipts
       (v1 remains readable); rows (every trace and attack); attack_results (fail-closed outcomes);
       hard_violation_count (must be zero for accepted actions); operational_automaton_fixture_ready
       (exact downstream field); solve_claim (false, no level claim); solve_provenance
       (development_proxy, source-free fixture only); gate_check_summary (blocked diagnostic);
       verifier_is_oracle (false, exact interface is external authority); verdict_class (closed enum:
       positive | circular_positive | null | blocked | disqualified | partial); honest_verdict
       (terminal and row-supported).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6811_operational_obligation_automaton_v3.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6802-operational-obligation-automaton-v2
      verdict: 'complete_blocked_operational_obligation_automaton'
      addressed_by: 'Exp6810 ships and validates the missing owned REQ map first; v3 reads only existing spec paths and keeps the same deterministic source-free technique.'
