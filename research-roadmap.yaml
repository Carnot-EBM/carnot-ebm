      - research-roadmap-next.yaml
      - results/experiment_3024_cross_corpus_matrix_v17.json
      - results/experiment_3025_capstone_v283.json
      - ops/status.md
      - ops/changelog.md

      TASK
      Archive the completed .283 milestone state and activate the .284 planning artifact without modifying research-roadmap.yaml or scripts/research_conductor.py.

      CONCRETE STEPS
      1. Confirm results/experiment_3025_capstone_v283.json exists and reports capstone_ready=true.
      2. Summarize .283 clean, flagged, blocked, gated-skipped, projection-only, pilot-only, missing, and paper_ready status from exp3024/exp3025.
      3. Confirm research-roadmap-next.yaml targets milestone 2026.05.284 and points to openspec/change-proposals/research-roadmap-vNEXT.md.
      4. Write an activation artifact that records forbidden files unchanged, staged milestone metadata, carry-forward blockers, and next execution order.
      5. Do not rename files, do not modify research-roadmap.yaml, and do not edit scripts/research_conductor.py.

      REQUIRED ARTIFACT FIELDS:
      - milestone_archived: bool (principle: completed milestones must have an explicit terminal record)
      - next_milestone: str (principle: conductor activation must be auditable)
      - next_roadmap_path: str (principle: staged roadmap identity must be explicit)
      - capstone_ready: bool (principle: archive depends on terminal capstone evidence)
      - previous_paper_ready: bool (principle: paper readiness must not be inferred)
      - carry_forward_blockers: list (principle: unresolved work must not disappear)
      - protected_files_unchanged: bool (principle: planning must not mutate conductor or active roadmap)
      - inference_substrate: dict (principle: aggregation artifacts must declare aggregation and must not claim live inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

