      2. No code changes needed.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1683-self-play-constraint-discovery
    title: "Exp 1683: Self-Play Constraint Discovery Prototype"
    deliverable: python/carnot/pipeline/self_play_discovery.py
    prompt: |
      CONTEXT: The FR-11 ledger requires autonomous constraint generation.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/nsvif_sota.py
      TASK: Implement a self-play loop that identifies logical failures in LLM outputs using EBCN and transpiles them into NSVIF DSL constraints.
      CONCRETE STEPS:
      1. Write `SelfPlayConstraintDiscoverer` in `python/carnot/pipeline/self_play_discovery.py`.
      2. Ensure it can ingest failing traces, extract root conflict, and output valid NSVIF DSL.
      3. Write `{project_root}/results/experiment_1683_self_play.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1684-fr11-ledger-integration
    title: "Exp 1684: gated on Exp 1683: Integrate Self-Play with FR-11 Ledger"
    deliverable: results/experiment_1684_fr11_integration.json
    gated_on:
      - upstream: exp1683-self-play-constraint-discovery
        artifact_field: status
        op: "=="
        value: "success"
    prompt: |
      CONTEXT: Integrate the discovered constraints from Exp 1683 into the FR-11 CerCE ledger.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/self_play_discovery.py
      TASK: Wire the `SelfPlayConstraintDiscoverer` to `CerCELedger` to dynamically update the FR-11 policy.
      CONCRETE STEPS:
      1. Modify FR-11 update logic to securely append discovered NSVIF constraints.
      2. Write `{project_root}/results/experiment_1684_fr11_integration.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1685-live-sota-self-play
    title: "Exp 1685: Live evaluation of Self-Play FR-11 on mandated SOTA GGUFs"
    deliverable: results/experiment_1685_live_sota.json
    prompt: |
      CONTEXT: Validate the autonomous constraint discovery loop on real LLM models.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/self_play_discovery.py
      TASK: Run a live evaluation against mandated SOTA GGUFs.
      CONCRETE STEPS:
      1. Use `unsloth/Qwen3.6-35B-A3B-GGUF` or `unsloth/gemma-4-31B-it-GGUF`.
      2. Generate 10 math reasoning traces, identify a hallucination, auto-generate a constraint, and re-evaluate to confirm repair.
      3. Write `{project_root}/results/experiment_1685_live_sota.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1686-pwa-karat
    title: "Exp 1686: PWA (Piecewise Affine) Abstractions for KArAt Attention"
    deliverable: python/carnot/models/pwa_karat.py
    prompt: |
      CONTEXT: To formally verify KArAt attention, we must convert it to a PWA representation (arXiv:2602.06737).
      EXISTING CODE TO READ FIRST: python/carnot/models/pwa_kan.py
      TASK: Implement `PWAKArAtAttention` that approximates the B-splines of KArAt with optimal PWA segments.
      CONCRETE STEPS:
      1. Create `python/carnot/models/pwa_karat.py`.
      2. Implement conversion logic.
      3. Write `{project_root}/results/experiment_1686_pwa_karat.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1687-milp-karat-verification
    title: "Exp 1687: gated on Exp 1686: Certify KArAt Bounds via MILP"
    deliverable: results/experiment_1687_milp_karat.json
    agent_type: codex
    gated_on:
      - upstream: exp1686-pwa-karat
        artifact_field: status
        op: "=="
        value: "success"
    prompt: |
      CONTEXT: Use MILP (via Z3 or similar) to verify the Lipschitz bounds of the PWA KArAt block.
      EXISTING CODE TO READ FIRST: python/carnot/models/pwa_karat.py
      TASK: Write a verifier that takes a `PWAKArAtAttention` and proves upper bounds on its output divergence.
      CONCRETE STEPS:
      1. Encode the PWA forward pass as a MILP constraint problem.
      2. Verify a small synthetic bound.
      3. Write `{project_root}/results/experiment_1687_milp_karat.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1688-cikan-regularization
    title: "Exp 1688: Constraint-Informed KAN (CIKAN) Monotonicity Regularization"
    deliverable: python/carnot/models/cikan_reg.py
    prompt: |
      CONTEXT: Enhance splines by enforcing physics/logic constraints directly on coefficients.
      EXISTING CODE TO READ FIRST: python/carnot/models/cikan_reg.py (if exists, else create)
      TASK: Implement a CIKAN regularizer to force B-spline monotonic behavior.
      CONCRETE STEPS:
      1. Write `CIKANRegularizer` in `python/carnot/models/cikan_reg.py`.
      2. Apply it to a small test spline to verify monotonicity.
      3. Write `{project_root}/results/experiment_1688_cikan.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

