- id: exp897-lagrange-forgetting-curve
  milestone: 2026.04.69
  deliverable: results/experiment_897_lagrange_forgetting_curve.json
  title: 'Exp 897: Constraint Memory Forgetting — FOREVER-Inspired Lagrange Weight Decay (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The Lagrange adaptive weight updater (Exp 866 / .66 milestone) accumulates
    constraint weights indefinitely. In long sessions, early constraints from the first
    few questions dominate the energy landscape even when they are no longer contextually
    relevant. This causes the constraint memory to grow unboundedly, increasing energy
    computation time and potentially creating stale constraint interference.

    Inspired by arXiv 2601.03938 (FOREVER: Forgetting curve learning for continual learning):
    - Each constraint has an age_t (steps since it was added)
    - Weight decays: w_t = w_0 * exp(-lambda * age_t)
    - Before fully forgetting: replay high-violation constraints at high frequency
      (FOREVER-style memory rehearsal to prevent catastrophic forgetting of important constraints)
    - This creates a natural constraint lifecycle: learn -> strengthen -> gradually forget
      -> replay if still relevant -> eventually expire

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/lagrange_updater.py — LagrangeAdaptiveUpdater (current accumulator)
    - results/experiment_888_fr11_tier3_relay.json — Tier 3 relay result (constraint_addition_rate)
    - python/carnot/pipeline/three_tier_pipeline.py — pipeline integration point
    - openspec/change-proposals/research-roadmap-v69.md — .69 Phase 3 Exp 897

    TASK: Add forgetting curve to LagrangeAdaptiveUpdater. Benchmark constraint precision
    with vs without forgetting over 10-session relay.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Extend python/carnot/pipeline/lagrange_updater.py:
       Add to LagrangeAdaptiveUpdater:
         constraint_ages: dict[str, int] = {}  # constraint_id -> steps since addition
         forgetting_lambda: float = 0.05       # decay rate (tunable)
         replay_threshold: float = 0.8         # replay constraints above this violation rate
       Add methods:
         tick(step: int) -> None:
           # Increment age for all constraints, apply decay, mark expired constraints
           for cid in list(self.constraint_weights.keys()):
             self.constraint_ages[cid] = self.constraint_ages.get(cid, 0) + 1
             age = self.constraint_ages[cid]
             self.constraint_weights[cid] *= math.exp(-self.forgetting_lambda)
             if self.constraint_weights[cid] < 1e-4:  # effectively zero
               del self.constraint_weights[cid]
               del self.constraint_ages[cid]
         get_replay_candidates(violation_rates: dict[str, float]) -> list[str]:
           # Return constraint IDs that are aging out but still have high violation rates
           # These should be re-reinforced (weight reset to w_0) before forgetting
           candidates = []
           for cid, weight in self.constraint_weights.items():
             if weight < 0.1 and violation_rates.get(cid, 0.0) > self.replay_threshold:
               candidates.append(cid)
           return candidates
    3. Add spec entries: REQ-FR11-007 (forgetting curve for constraint memory),
       SCENARIO-FR11-007 (aged constraints decay; high-violation constraints replayed).
    4. Benchmark: run a 10-session relay (20 questions per session, same GSM8K subset):
       Session baseline (no forgetting): run LagrangeAdaptiveUpdater without decay.
         Collect: constraint_count_s10 (total constraints after 10 sessions),
                  constraint_precision_s10 (fraction of active constraints with recent violations)
       Session with forgetting (forgetting_lambda=0.05): run same relay with tick() called.
         Collect: same metrics.
       Also try forgetting_lambda in {0.01, 0.05, 0.1, 0.2} — report best.
    5. Compute:
       - constraint_precision_no_forget: float
       - constraint_precision_with_forget: float
       - memory_size_no_forget: int (constraint count at session 10)
       - memory_size_with_forget: int
       - forgetting_rate_best_lambda: float
       - replay_events: int (how many times replay_candidates fired)
    6. honest_verdict:
       - "forgetting_improves_precision" if constraint_precision_with_forget > constraint_precision_no_forget
       - "forgetting_neutral" if difference < 0.02
       - "forgetting_hurts_precision" if constraint_precision_with_forget < constraint_precision_no_forget
    7. Write tests: test tick() applies exponential decay. Test expiry at weight < 1e-4.
       Test get_replay_candidates returns correct IDs. Traces to REQ-FR11-007.
    8. Update ops/changelog.md, ops/status.md.
    9. tmpl.assert_deliverable_written() as final line.
    10. Write results/experiment_897_lagrange_forgetting_curve.json.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_897_lagrange_forgetting_curve.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

