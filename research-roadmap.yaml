         If model_load_time_s < 5.0: this is suspicious (real GGUF load takes >= 30s).
         Write methodology_note if fast.

      2. Generate N=30 live responses (random_seed=42):
         - 10 math reasoning prompts: "What is 47 + 38?" / "If a train travels 60mph for 2 hours..."
         - 10 factual prompts: "What is the capital of France?" / "Who wrote Hamlet?"
         - 10 coding prompts: "Write a function to reverse a string in Python."
         For each: `llm(prompt, max_tokens=200, temperature=0.7)["choices"][0]["text"]`
         Record: n_responses (int = 30), inference_responses (list of str — first 100 chars each).

      3. Run verifier on all 30 examples:
         import sys; sys.path.insert(0, 'python')
         from carnot.pipeline.verify_repair import VerifyRepairPipeline
         pipeline = VerifyRepairPipeline()
         energy_values = [pipeline.verify(prompt, response) for prompt, response in examples]
         verifier_discriminative = (
           sum(1 for e in energy_values if e > 0.0) >= 10 AND
           (max(energy_values) - min(energy_values)) > 0.1 AND
           statistics.stdev(energy_values) > 0.01
