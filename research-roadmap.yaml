      Use the exact Exp6228-qualified file and supervisor. Legacy models contribute zero rows.

      Required deliverable: {project_root}/results/experiment_6229_arc_gemma31_think_determination.json.
      REQUIRED ARTIFACT FIELDS: status, registry_precheck_and_hash_before_after, solve_provenance, prior_run_paths_hashes_and_cell_validity, preregistered_game_seed_arm_matrix, reused_completed_cell_count, resumed_cell_count, missing_or_failed_cells, model_specs, supervised_runtime_receipts, explicit_think_routing_receipts, matched_arm_configuration, treatment_fire_and_reasoning_tag_counts, raw_prompt_output_engine_and_replay_hashes, heldout_exact_admission_by_arm_game, paired_clustered_interval, discordant_game_exact_sign_test, token_wall_and_failure_costs, harmful_regressions, aa_control, source_bfs_adapter_hidden_state_registry_access_counts, level_depth_observations, registry_update_count, think_configuration_decision, think_configuration_frozen_score, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. solve_provenance must be live_agent_self_discovery. Registry updates and forbidden accesses must be bare 0.

      CONCRETE STEPS
      0. PRECONDITIONS: hash the registry and prior partial files, validate completed cells, confirm dense runtime ownership, and freeze the remaining matrix and deadline.
      1. Add REQ-ARC-WMTE-6229 and scenarios before implementation and trace focused tests.
      2. Reject contaminated cells where both arms resolved to think-on or where raw receipts are incomplete. Never count a borrowed or partial row as complete.
      3. Resume only missing cells through the canonical live policy and supervised native server. Enter through make_carnot_agent/E3AgentPolicy.
