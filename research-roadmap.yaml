    9. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1392_test_suite_hygiene_v2.json')); print(d.get('collection_errors_before'), d.get('collection_errors_after'), d.get('test_suite_collection_clean'), d.get('honest_verdict'))"
