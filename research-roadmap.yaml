- id: exp2400-fr11-nsvif-online-v2
  title: 'Phase 2: FR-11 NSVIF Online Self-Learning v2 — Mandatory Continuous Self-Learning Task'
  milestone: 2026.05.233
  deliverable: results/experiment_2400_fr11_nsvif_online.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  continuous_self_learning_task: true
  prior_failures:
  - experiment_id: exp2383-fr11-nsvif-online
    verdict: codex_cli_error_failed
    addressed_by: "exp2383 failed 3 times with Codex CLI error in .232. exp2393 repaired
      the Codex CLI infrastructure. FR-11 NSVIF online scope unchanged: implement online
      constraint learning from live NSVIF Z3 verification outcomes. FR-11 is MANDATORY per
      CLAUDE.md (at least one continuous_self_learning_task per milestone)."
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT: FR-11 (Autonomous Self-Learning Loop) is a MANDATORY functional requirement.
    Every milestone must have at least one continuous_self_learning_task experiment.

    NSVIF Online Learning: Carnot's NSVIF Z3 extractor (exp2352, exp2366) extracts SMT-LIB
    constraints from instruction text. When Z3 returns UNSAT (constraint violated) or SAT
    (constraint satisfied), this verdict can be used as a training signal to improve future
    constraint extraction. This closes the self-learning loop: verify → extract feedback →
    update constraint patterns → verify again.

    The approach:
      1. Run NSVIF Z3 verification on 20 telemetry entries
      2. For each UNSAT verdict: mark the constraint extraction as "needs refinement"
      3. Update a lightweight constraint dictionary (JSON file) with refined patterns
      4. Re-verify the same entries with updated constraints
      5. Measure cross_domain_retention_rate: fraction of SAT verdicts that remain SAT

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/nsvif_z3_extractor.py (existing NSVIF)
      {project_root}/results/experiment_2375_fr11_real_data.json (FR-11 baseline from .231)
      {project_root}/results/experiment_2366_nsvif_real.json (NSVIF real-data baseline)

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. z3-solver importable: .venv/bin/python -c "import z3; print(z3.get_version_string())"
            If missing: .venv/bin/pip install z3-solver -q
         b. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         c. NSVIF extractor importable:
            .venv/bin/python -c "from carnot.verify.nsvif_z3_extractor import NSVIFExtractor; print('OK')"
            If missing: write honest_verdict blocked_nsvif_not_importable and exit.

      1. Run initial NSVIF verification on 20 telemetry entries.
         Record initial_sat_count, initial_unsat_count, initial_sat_rate.

      2. For each UNSAT entry: extract the constraint that failed. Add a "negation-hedge"
         pattern to a constraint_patterns.json file (create if not exists):
         {{"pattern": extracted_constraint, "hedge": "may not be required", "confidence": 0.5}}

      3. Re-verify the same 20 entries with updated constraint patterns.
         Record updated_sat_rate.

      4. Compute:
         cross_domain_retention_rate: fraction of initially-SAT entries still SAT after update.
         self_learning_improvement: updated_sat_rate - initial_sat_rate.

      5. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "nsvif" -v --no-cov 2>&1 | tail -15

      6. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required."
      - fr11_nsvif_online_passed:
          principle: "True if self-learning loop ran (verify → update → re-verify)."
      - cross_domain_retention_rate:
          principle: "Fraction of SAT verdicts retained after constraint update. FR-11 gate."
      - self_learning_improvement:
          principle: "updated_sat_rate - initial_sat_rate. Positive = learning worked."
      - initial_sat_rate:
          principle: "Baseline before self-learning update."
      - updated_sat_rate:
          principle: "After self-learning update."
      - n_eval_examples:
          principle: "Must be 20."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records z3, telemetry, nsvif checks."

    ACCEPTANCE GATES:
      - condition: "fr11_nsvif_online_passed == true"
        principle: "FR-11 mandatory: self-learning loop must complete at least one iteration."
      - condition: "cross_domain_retention_rate >= 0.50"
        principle: "Self-learning must not degrade previously-correct SAT verdicts catastrophically."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

