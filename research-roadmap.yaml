  - id: exp6525-gatemate-changed-state-continuity
    milestone: "2026.08.564"
    deliverable: results/experiment_6525_gatemate_changed_state_continuity.json
    title: "GateMate post-receipt changed-state continuity closure"
    priority: high
    track: hardware
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 30
    model: opus
    prior_failures:
      - experiment_id: exp6121-gatemate-changed-state-gate-v530
        verdict: "blocked_physical_action: unchanged GateMate cable/port/power/board/DirtyJTAG state; no JTAG command run; operator must change physical state and record a dated receipt"
        addressed_by: "This task preserves the no-command changed-state gate and searches only for a dated post-Exp6325 operator receipt; without one it closes continuity as documentation rather than repeating JTAG."
