  - id: exp2586
    title: "IPFS Mirror: Pin arXiv Preprint Package + Generate CID"
    agent_type: codex
    model: gpt-5.5
    max_turns: 25
    track: publication_distribution

    context: |
      Rule 3 (Distribution Mirroring) requires: "Trained weights, model cards, datasets,
      and Python packages must be published through at least two independent channels."
      Preferred: HuggingFace as primary + IPFS as secondary (content-addressed, genuinely
      decentralized per CLAUDE.md operator directive 2026-05-08).

      The arXiv submission package (LaTeX + figures) was prepared by exp2558. This task
      pins that package to IPFS to generate a CID that can be included in the model card
      and README before the operator submits to arXiv.

    existing_code_to_read:
      - docs/arxiv-submission/
      - README.md

    concrete_steps: |
      0. PRECONDITIONS:
         a. `command -v ipfs` succeeds OR `command -v kubo` succeeds (IPFS daemon available)
         b. arXiv submission package directory exists: `ls docs/arxiv-submission/` non-empty
         c. Network connectivity: `curl -sf -o /dev/null https://ipfs.io` succeeds
