- id: exp433-spilled-energy-integration
  milestone: 2026.04.32
  deliverable: results/experiment_433_spilled_energy.json
  title: 'Exp 433: Spilled Energy pre-filter — logit-discrepancy hallucination detection (arXiv 2602.18671)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2602.18671 (Spilled Energy, 2026-02,\
    \ ICLR 2026) shows that 'spilled energy' — the discrepancy between per-token logit energy\
    \ (pre-softmax intensity) and output probability energy (post-softmax) — is a robust hallucination\
    \ signal. When a model hallucinates, its logit energy is HIGH but its output distribution assigns\
    \ normal probability — the energy 'spills out' of the top-k token probabilities.\n\nThis is\
    \ DIFFERENT from semantic entropy (post-hoc, after full response) and SemanticEnergyScorer\
    \ (Exp 417, which uses pre-softmax logits of the full response). Spilled Energy is a per-token\
    \ signal measurable during streaming generation — no full response needed.\n\nMathematically:\
    \ SpilledEnergy(t) = log(sum_j exp(logit_j/T)) - log(sum_j p_j * logit_j)\n\
    Where logit_j are raw pre-softmax logits at token position t and p_j = softmax(logit_j/T).\n\
    High SpilledEnergy(t) → the token distribution is \"overconfident\" relative to raw logits\
    \ → potential hallucination ahead.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST)\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog (Exp 425)\n\
    - python/carnot/pipeline/semantic_energy_scorer.py — SemanticEnergyScorer (Exp 417)\n\
    - python/carnot/pipeline/sink_probe.py — SinkProbe (Exp 348) — fast-path pattern\n\
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline integration point\n\
    \nTASK: Implement SpilledEnergyDetector.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-VERIFY-092 (SpilledEnergyDetector: per-token logit-discrepancy hallucination signal),\n\
    \   REQ-VERIFY-093 (CI-safe mode uses deterministic hash of response text as energy proxy),\n\
    \   SCENARIO-VERIFY-123/124/125.\n\
    3. Write tests FIRST (100% coverage) for:\n\
    \   - SpilledEnergyToken(position: int, token_id: int, spilled_energy: float)\n\
    \   - compute_spilled_energy(logits: jnp.ndarray, temperature: float = 1.0) -> float:\n\
    \     logit_energy = log(sum(exp(logits / temperature)))  # log-sum-exp\n\
    \     probs = softmax(logits / temperature)\n\
    \     output_energy = sum(probs * logits)  # expected logit value\n\
    \     return logit_energy - output_energy  # spilled = intensity lost to softmax\n\
    \   - SpilledEnergyResult(mean_spilled: float, max_spilled: float,\n\
    \     high_spill_fraction: float, should_verify: bool)\n\
    \   - SpilledEnergyDetector(spill_threshold: float = 2.0, high_spill_fraction_threshold: float = 0.2):\n\
    \     score(logits_per_token: jnp.ndarray) -> SpilledEnergyResult:\n\
    \       Compute per-token spilled energy. should_verify=True if high_spill_fraction > threshold.\n\
    \     score_from_text(response_text: str) -> SpilledEnergyResult (CI-safe: hash-based proxy)\n\
    \   - Test: uniform logits → spilled_energy ≈ 0 (no uncertainty)\n\
    \   - Test: peaked logits → high spilled energy (model overconfident)\n\
    \   - Test: CI text mode returns valid result without GPU\n\
    4. Implement python/carnot/pipeline/spilled_energy.py.\n\
    \   Export SpilledEnergyDetector, SpilledEnergyResult, compute_spilled_energy from carnot.pipeline.__init__.\n\
    \   Verbose docstrings: WHY spilled energy detects hallucination (logit intensity lost during\n\
    \   softmax normalization is the 'evidence discarded'), WHY per-token signal enables streaming\n\
    \   detection (no full response needed), theoretical basis (arXiv 2602.18671 + ARM-EBM bijection\n\
    \   2512.15605), hardware path (logit operations are native GPU tensor ops, ~0.01ms per token).\n\
    5. ADDITIVE: Add SpilledEnergyDetector as Tier 0 pre-filter in ThreeTierPipeline:\n\
    \   Before SinkProbe, run SpilledEnergyDetector.score_from_text(response).\n\
    \   If NOT should_verify: fast-path skip (same as SinkProbe skip path).\n\
    \   Track tier0_spilled_skip in ThreeTierPipelineResult.\n\
    6. Write scripts/experiment_433_spilled_energy.py:\n\
    \   a. Call apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(433, timeout_minutes=20)\n\
    \   c. ExperimentTemplate(433) CPU mode (no GPU needed for CI-safe text mode)\n\
    \   d. Run SpilledEnergyDetector on 100 synthetic responses:\n\
    \      50 'correct' (low variance logit proxies) + 50 'hallucinated' (high variance proxies)\n\
    \   e. Compare skip_rate, FN_rate (missed hallucinations), FP_rate (unnecessary verifications)\n\
    \   f. Compare vs SinkProbe metrics (if data available from prior experiments)\n\
    \   g. Build artifact: schema='carnot.spilled_energy.v1'\n\
    \      skip_rate, fn_rate, fp_rate, vs_sink_probe_comparison\n\
    \      honest_verdict: 'spilled_energy_viable' if skip_rate > 0.20 AND fn_rate < 0.05;\n\
    \        else 'insufficient_signal'\n\
    \      Output: results/experiment_433_spilled_energy.json\n\
    7. Write tests/python/test_spilled_energy.py and test_experiment_433_spilled_energy.py (100%).\n\
    8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    9. Reconcile: update ops/conductor-log.md, ops/changelog.md, _bmad/architecture.md\n\
    \   (add SpilledEnergyDetector to Tier 0 pre-filter row).\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

