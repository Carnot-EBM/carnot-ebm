      exact_backtracking: 1.0}} and every difficulty tier = 1.0, with pt_swap_acceptance_rate=0.0
      (tempering was inert; duration 0.49s = tiny instances). So the "1.00 vs AR 0.50" only proves
      greedy-AR has a known Brooks'-theorem ordering pathology — ANY non-greedy method (even vanilla
      descent) wins. NOT headline-eligible. The graph-coloring phase-transition literature gives the
      fix: the onset of LOCAL-SEARCH hardness tracks the FREEZING transition (a finite fraction of
      variables forced to one color in every solution within a cluster), so instances with average
      degree tuned just below the freezing threshold are HARD for vanilla descent yet remain solvable
      (a planted solution exists). References: arXiv:2408.01503 (physics-inspired GNN coloring,
      planted solutions + symmetry breaking), the random-graph-coloring clustering-vs-freezing
      literature (arXiv:0704.1269, cond-mat/0309518), DIFUSCO arXiv:2302.08224 (graph-CSP non-AR
      solver precedent), arXiv:2410.14157 (discrete-diffusion-beats-AR across CSPs).

      EXISTING CODE TO READ FIRST:
        - scripts/experiment_3518_p01_second_csp_energy_vs_ar_generalization_v1.py (REUSE its encoding + optimizer ladder structure; HARDEN the corpus + ADD a strong non-AR baseline + FIX the PT ladder)
        - results/experiment_3518_p01_second_csp_energy_vs_ar_generalization_v1.json (the ceiling-saturated result + pt_swap=0.0 anomaly)
