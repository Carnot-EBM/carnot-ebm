  - id: exp2727
    milestone: "2026.05.259"
    deliverable: "results/experiment_2727_verifier_energy_debug_v1.json"
    title: "Live GGUF Verifier Energy Debug v1: Trace Zero-Energy Collapse on Qwen3.6-35B"
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    track: evaluation

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .259 — exp2715 (.258) found that running VerifyRepairPipeline.verify()
      on 50 live Qwen3.6-35B-A3B-GGUF outputs produces energy_score_distribution=all-zero
      (mean=std=min=max=0.0, fast_path_rate=0.0). This is a degenerate verifier output.

      Root cause hypotheses (from capstone exp2724):
        H1: verify() computes energy=0 because FoVer TF-IDF features do NOT transfer to Qwen3.6 format
        H2: The verifier Tier 0 models compute score=0 because Qwen3.6 responses fall outside the training distribution
        H3: There is a bug in verify() that short-circuits to 0 for any input not in the FoVer corpus

      MODEL_SPECS (mandatory per CLAUDE.md SOTA GGUF requirement — PRECONDITIONS gated):
        - name: Qwen3.6-35B-A3B-GGUF
          hf_id: unsloth/Qwen3.6-35B-A3B-GGUF
          role: diagnostic_inference

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (verify(), should_verify(), score_candidates())
      - python/carnot/verify/ (list all tier0* modules — check for FoVer-dependency in feature extraction)
      - data/fover_corpus.jsonl (FoVer corpus format — compare to live GGUF response format)
      - results/experiment_2715_sota_gguf_live_eval_v3.json (fast_path_rate, energy_score_distribution)

      TASK: Diagnose why verify() returns zero energy on live GGUF outputs. Produce a verified non-zero
      energy on at least 5 examples by fixing the root cause.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Check Qwen3.6-35B-A3B-GGUF cached:
            `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/ 2>/dev/null | head -3`
            Record: qwen_cached (bool).
         b. `.venv/bin/python -c "import sys; sys.path.insert(0, 'python'); import carnot.pipeline"` — importable.
            If fails: write honest_verdict 'blocked_carnot_pipeline_not_importable' and exit.
         c. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0` — FoVer corpus.
            Record: fover_corpus_lines (int).
         d. `nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null`
            Record: cuda_available (bool), gpu_names (list).
         Record: preconditions_checked.

      1. DIAGNOSTIC: Load one FoVer example (correct answer) and one live synthetic Qwen-format response.
         Run verify() on both and compare intermediate feature vectors.
         a. FoVer example: read first entry from data/fover_corpus.jsonl.
            Run: pipeline.verify(fover_example.question, fover_example.correct)
            Record: fover_energy (float), fover_n_verifiers_active (int).
         b. Synthetic Qwen3.6-format response (short markdown response like "**Answer:** 5"):
            Run: pipeline.verify("What is 2+3?", "**Answer:** 5")
            Record: synthetic_energy (float), synthetic_n_verifiers_active (int).
         If both are zero: hypothesis H1 or H3 confirmed — proceed to Step 2.
         If FoVer non-zero but synthetic=zero: H1 confirmed (format mismatch). Proceed to Step 3.

      2. TRACE: Read verify() source. For each tier0* verifier called:
         a. Check if it applies TF-IDF or learned features that require FoVer vocab to be non-empty
         b. Check if it has a trivial fast-path that returns 0.0 for unknown inputs
         c. Check if TF-IDF vectorizer was fit on FoVer corpus at module import time
         Record: root_cause_hypothesis (str), root_cause_confirmed (bool), root_cause_code_location (str).

      3. FIX: Based on root cause, apply the minimal targeted fix:
         - If TF-IDF vocab missing: re-fit on FoVer corpus and save model
         - If fast-path short-circuit: add logging to distinguish fast-path vs genuine zero-energy
         - If format mismatch: add text normalizer that strips markdown/code-block formatting before feature extraction
         Record: fix_applied (str), fix_description (str).

      4. VERIFY FIX: Re-run verify() on 5 test inputs (2 FoVer, 3 synthetic Qwen-format):
         Record: n_non_zero_energies (int), energy_values (list of float — 5 values).
         verifier_discriminative = (n_non_zero_energies >= 3 AND max(energy_values) - min(energy_values) > 0.01).

      5. If qwen_cached AND cuda_available: run 10 real GGUF examples (random_seed=42, batch_size=2):
         Record: live_gguf_energy_mean (float), live_gguf_energy_std (float).
         live_gguf_discriminative = live_gguf_energy_std > 0.01.
         smoke_only = false.
         Else: smoke_only = true.

      6. Write results/experiment_2727_verifier_energy_debug_v1.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - root_cause_hypothesis: str
        principle: "Names the verified root cause of zero-energy collapse — prevents rerun without fix."
      - root_cause_confirmed: bool
        principle: "True if root cause was traced to specific code location; false if still ambiguous."
      - fix_applied: str
        principle: "Describes what was changed in the codebase to fix the degenerate output."
      - verifier_discriminative: bool
        principle: "Primary gate: True if verify() produces non-zero energy on >= 3 of 5 test inputs."
      - n_non_zero_energies: int
        principle: "Confirms verifier produces meaningful scores after fix."
      - energy_values: list of float
        principle: "Adversarial check: all-zero means fix failed; variance > 0.01 means non-degenerate."
      - fover_energy: float
        principle: "FoVer diagnostic baseline — should be non-zero if feature extraction works."
      - synthetic_energy: float
        principle: "Format-mismatch diagnostic: zero on synthetic = format problem, not data problem."
      - random_seed: int — 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Diagnostic reads + fix + 5-example verify: expected >= 10s; < 3s suspicious."
      - preconditions_checked: list of {{resource, available, check}}
        principle: "Anti-fabrication: records GGUF cache + pipeline import + FoVer corpus."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2728
    milestone: "2026.05.259"
    deliverable: "results/experiment_2728_otv_fast_path.json"
    title: "OTV One-Token Verification Fast Path (arXiv:2603.01025): KV-Cache Probe for Cheap Routing"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: pipeline

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .259 — no prior failures for this specific scope.

      arXiv:2603.01025 "One-Token Verification for Reasoning Correctness Estimation" (Mar 2026):
      Probes the model's key-value cache with a single verification token to produce a soft correctness
      probability without additional generation. 90% token reduction vs full verification. AUROC 0.75+
      on MATH and HumanEval CoT.

      Carnot context: exp2720 added ODAR free-energy routing (fast/deliberative path). OTV can serve as
      an ultra-cheap PRE-SCREEN before ODAR: if OTV's KV probe says "high confidence", skip ODAR entirely.
      Two-tier architecture: OTV → (if uncertain) → ODAR → (if deliberative) → full ensemble.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (should_verify(), odar_route() from exp2720)
      - python/carnot/verify/ (existing tier0* modules)

      TASK: Implement OTV-style single-token verification probe for fast-path routing.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sys; sys.path.insert(0, 'python'); import carnot.pipeline"` — importable.
            If fails: write honest_verdict 'blocked_carnot_pipeline_not_importable' and exit.
         b. `grep -c 'def odar_route' python/carnot/pipeline/verify_repair.py 2>/dev/null || echo 0`
            Record: odar_route_exists (bool).
         Record: preconditions_checked.

      1. Implement OTV probe (without requiring actual GGUF inference — use TF-IDF proxy):
         Add otv_probe(prompt: str, response: str) -> float to VerifyRepairPipeline:
         """OTV-style one-token verification: computes a soft correctness probability
         from response features without additional generation.

         Proxy implementation (no KV cache available without transformer inference):
         - TF-IDF of response (reuse existing feature extraction)
         - Dot product with a "correctness direction" vector (trained on FoVer correct/incorrect pairs)
         - Sigmoid to produce probability in [0, 1]
         Returns: confidence float in [0, 1]. High = likely correct. Low = uncertain.
         """
         Record: otv_probe_added (bool).

      2. Train correctness direction on FoVer corpus (80/20 split, random_seed=42):
         a. Load FoVer corpus
         b. TF-IDF features for correct and incorrect answers
         c. Logistic regression weight vector as correctness direction
         d. Save to results/otv_correctness_probe.pkl
         Record: probe_trained (bool), probe_auroc (float on eval split).
         otv_fast_path_viable = probe_auroc >= 0.65.

      3. Add two-tier routing to VerifyRepairPipeline:
         route(prompt: str, response: str, otv_threshold=0.8, odar_threshold=0.3) -> str:
         """Two-tier routing:
         Step 1: OTV probe — if confidence >= otv_threshold: return 'fast_path_otv'
         Step 2: ODAR route — if F < odar_threshold: return 'fast_path_odar'
         Step 3: return 'deliberative_path'
         """
         Record: two_tier_routing_added (bool).

      4. Test on 20 synthetic examples (10 correct / 10 incorrect, random_seed=42):
         n_otv_skipped: examples where otv probe confidence >= 0.8 (OTV fast path)
         n_odar_skipped: remaining examples where ODAR fast path fires
         n_deliberative: remaining requiring full ensemble
         total_savings_pct = (n_otv_skipped + n_odar_skipped) / 20 * 100
         Record: n_otv_skipped, n_odar_skipped, n_deliberative, total_savings_pct.

      5. Write results/experiment_2728_otv_fast_path.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - otv_probe_added: bool
        principle: "Primary deliverable: OTV probe method in VerifyRepairPipeline."
      - probe_auroc: float
        principle: "OTV accuracy: arXiv:2603.01025 claims 0.75+; validate on FoVer."
      - otv_fast_path_viable: bool
        principle: "Gate for two-tier routing deployment: True if probe_auroc >= 0.65."
      - two_tier_routing_added: bool
        principle: "Confirms OTV + ODAR two-tier routing is wired in pipeline."
      - total_savings_pct: float
        principle: "Routing efficiency: fraction of examples that skip full ensemble via fast paths."
      - n_otv_skipped: int
        principle: "Attribution: how many saves from OTV first tier."
      - n_odar_skipped: int
        principle: "Attribution: how many saves from ODAR second tier."
      - random_seed: int — 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Logistic train + 20-example routing test: expected >= 3s."
      - preconditions_checked: list of {{resource, available, check}}
        principle: "Anti-fabrication: records pipeline import + odar_route existence."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


