- id: exp516-gsm-symbolic-adversarial-v5
  milestone: 2026.04.39
  deliverable: results/experiment_516_gsm_symbolic_adversarial_v5.json
  title: 'Exp 516: GSM-Symbolic Adversarial v5 — RETRO-039 fifth attempt, robustness thesis'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-039\
    \ (GSM-Symbolic adversarial, Apple arXiv 2410.05229) has missed FOUR consecutive\
    \ milestones. The thesis: Carnot's improvement should be LARGER under adversarial\
    \ conditions because Ising constraint verification is independent of surface form.\
    \ A symbolic substitution that changes the problem's phrasing while preserving\
    \ the arithmetic constraints does not fool the Ising sampler. Expected: Carnot\
    \ degrades less than baseline under adversarial perturbations.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/adversarial_gsm8k.py — AdversarialGSMQuestion, build_adversarial_questions (Exp 354)\n\
    - python/carnot/pipeline/jit_vram_check.py — JITVRAMCheck (Exp 513)\n\
    - results/experiment_479_gsm_symbolic_adversarial_live.json — prior attempt result\n\
    - python/carnot/pipeline/long_run_executor.py — LongRunBenchmarkExecutor\n\
    - scripts/experiment_template.py — ExperimentTemplate\n\
    - ops/known-issues.md — RETRO-039\n\nTASK: Run the GSM-Symbolic adversarial benchmark.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add SCENARIO-BENCH-037/038 (adversarial robustness: Carnot degrades less than\
    \ baseline) to spec.\n\
    4. Write tests FIRST (100% coverage) for new helpers:\n\
    \   - compute_robustness_delta(baseline_std, baseline_adv, pipeline_std, pipeline_adv) -> float:\n\
    \     return (baseline_std - baseline_adv) - (pipeline_std - pipeline_adv);\
    \ positive = Carnot degrades less\n\
    \   - build_adversarial_v5_artifact(results, inference_mode) -> Dict\n\
    5. Write scripts/experiment_516_gsm_symbolic_adversarial_v5.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(516, timeout_minutes=120)\n\
    \   c. ExperimentTemplate(516, 'GSM-Symbolic Adversarial v5',\n\
    \      'results/experiment_516_gsm_symbolic_adversarial_v5.json', requires_gpu=True)\n\
    \   d. DeliverableGuard\n\
    \   e. GPUVRAMGateV2 + JITVRAMCheck before each model load\n\
    \   f. Load 50 standard GSM8K questions + 50 adversarial variants\n\
    \      (irrelevant sentence injection + number swap variants, from Exp 354 patterns)\n\
    \   g. For each condition (standard, adversarial) x variant (baseline, pipeline):\n\
    \      run inference, record accuracy\n\
    \   h. compute_robustness_delta: positive = thesis confirmed (Carnot more robust)\n\
    \   i. Build artifact: schema='carnot.adversarial_v5.v1'\n\
    \      baseline_standard_accuracy, baseline_adversarial_accuracy\n\
    \      pipeline_standard_accuracy, pipeline_adversarial_accuracy\n\
    \      robustness_delta (positive = thesis confirmed)\n\
    \      retro_039_confirmed=(robustness_delta > 0 and inference_mode=='live_gpu')\n\
    \      honest_verdict='thesis_confirmed' if retro_039_confirmed\n\
    \        else 'thesis_rejected' if inference_mode=='live_gpu'\n\
    \        else 'gpu_required'\n\
    \   j. Call tmpl.assert_deliverable_written() as FINAL LINE\n\
    6. Run tests, reconcile docs.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp517-dual-gpu-controlled-test
  milestone: 2026.04.39
  deliverable: results/experiment_517_dual_gpu_controlled_test.json
  title: 'Exp 517: Controlled DualGPU Parallel Execution Test — RETRO-052 diagnosis'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-052:\
    \ the DualGPU sweep (Exp 505) found n_scripts_found=0, n_scripts_patched=0,\
    \ yet GPU 1 is still at 0% compute utilization. Either all scripts were already\
    \ patched (and something else is the problem), or the sweep's detection pattern\
    \ missed eligible scripts. This experiment definitively answers: does forward-pass\
    \ compute actually run on GPU 1? Load one model on each GPU simultaneously,\
    \ measure nvmlDeviceGetUtilizationRates() during inference.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/jit_vram_check.py — JITVRAMCheck (Exp 513)\n\
    - python/carnot/pipeline/gpu_vram_gate_v2.py — GPUVRAMGateV2 (Exp 487)\n\
    - python/carnot/pipeline/gemma4_quantized_loader.py — Gemma4QuantizedLoader\n\
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu()\n\
    - ops/known-issues.md — RETRO-052\n\nTASK: Controlled DualGPU test.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-INFRA-057 (DualGPU test: GPU 1 compute measured during inference),\
    \ SCENARIO-INFRA-065/066 to spec.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - DualGPUTestResult(gpu0_compute_pct, gpu1_compute_pct, n_samples_run,\
    \ inference_mode, honest_verdict)\n\
    \   - sample_gpu_utilization(device_ids: List[int], n_samples: int, interval_s: float)\
    \ -> Dict[int, float]: poll nvmlDeviceGetUtilizationRates() n_samples times,\
    \ return mean per device; CI stub returns {0: 0.0, 1: 0.0}\n\
    \   - run_dual_inference(model_a, model_b, prompts) -> Tuple[List[str], List[str]]:\
    \ run models on their respective GPUs in threads\n\
    5. Write scripts/experiment_517_dual_gpu_controlled_test.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(517, timeout_minutes=30)\n\
    \   c. ExperimentTemplate(517, 'Controlled DualGPU Test',\n\
    \      'results/experiment_517_dual_gpu_controlled_test.json', requires_gpu=True)\n\
    \   d. DeliverableGuard\n\
    \   e. If not CARNOT_FORCE_LIVE: emit gpu_required artifact, exit\n\
    \   f. JITVRAMCheck(0).gate_model_load('gemma4-int4', 10.0)\n\
    \   g. Load Gemma4QuantizedLoader with device_map={'': 'cuda:0'}\n\
    \   h. JITVRAMCheck(1).gate_model_load('qwen3.5-0.8b', 1.5)\n\
    \   i. Load Qwen3.5-0.8B with device_map={'': 'cuda:1'}\n\
    \   j. Start utilization sampling thread: sample_gpu_utilization([0,1], n_samples=20, interval_s=0.5)\n\
    \   k. Simultaneously run 10 inference passes on each model in parallel threads\n\
    \   l. Record gpu0_compute_pct, gpu1_compute_pct from sampling\n\
    \   m. Build artifact: schema='carnot.dual_gpu_test.v1'\n\
    \      gpu0_compute_pct, gpu1_compute_pct\n\
    \      gpu1_utilization_verified=(gpu1_compute_pct > 10.0)\n\
    \      retro_052_status='CLOSED' if gpu1_utilization_verified else 'DEEPER_FIX_NEEDED'\n\
    \      honest_verdict='gpu1_active' if gpu1_utilization_verified\n\
    \        else 'gpu1_idle' if inference_mode=='live_gpu'\n\
