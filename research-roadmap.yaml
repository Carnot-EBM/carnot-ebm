  - id: exp2757
    milestone: "2026.05.261"
    deliverable: "results/experiment_2757_conformal_selective_acting.json"
    title: "Conformal Selective Acting Tier 0x (arXiv:2605.20270): Anytime-Valid Risk Control Routing"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 40
    track: pipeline

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .261 — no prior failures for this specific scope.

      arXiv:2605.20270 "Conformal Selective Acting: Anytime-Valid Risk Control for RLVR-Trained LLMs"
      (Khosravi, Huo, May 2026):
      Introduces anytime-valid conformal prediction for selective task engagement. Key property:
      anytime-valid coverage guarantees hold across time/queries without requiring held-out calibration
      data. Unlike standard conformal prediction (which requires a calibration set), anytime-valid
      guarantees work on the streaming sequence of queries itself.

      Carnot context: exp2745 (.260) implemented weak-strong routing but had inverted thresholds
      (t_low=0.184 > t_high=0.107) because Platt calibration with few examples can be unstable.
      Anytime-valid conformal prediction avoids this instability by deriving coverage guarantees
      directly from the stream of examples seen so far — no held-out calibration set required.

      Implementation for Carnot routing:
      - For each response, compute verifier energy e (weak signal)
      - Maintain running quantile estimate Q_alpha(e) at level alpha=0.10 (allow 10% miss rate)
      - ACCEPT if e <= Q_alpha: verifier energy is low enough to be in the low-risk set
      - ROUTE TO FULL ENSEMBLE if e > Q_alpha
      - The quantile Q_alpha updates with each new example (anytime-valid property)

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (existing routing: odar_route, route)
      - data/fover_corpus.jsonl (FoVer corpus for evaluation)
      - results/experiment_2745_weak_strong_verification_policy.json (t_low, t_high — baseline)

      TASK: Implement anytime-valid conformal routing. Compare to weak-strong policy and ODAR.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; import sys; sys.path.insert(0,'python'); import carnot.pipeline"`
            Record: pipeline_importable (bool).
            If false: write honest_verdict 'blocked_carnot_not_importable' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Implement AnytimeValidConformlRouter:
         class AnytimeValidConformalRouter:
           def __init__(self, alpha=0.10):
             self.alpha = alpha
             self.energy_history = []
           def route(self, energy):
             self.energy_history.append(energy)
             # Running quantile at level (1-alpha) of observed energies
             Q = np.quantile(self.energy_history, 1 - self.alpha)
             if energy <= Q:
               return 'accept'
             else:
               return 'full_ensemble'
         Record: conformal_router_implemented (bool).

      2. Evaluate on FoVer (N=100, random_seed=42, sequential order):
         router = AnytimeValidConformalRouter(alpha=0.10)
         For each example in order: route(energy_i)
         n_accepted = count 'accept' decisions
         n_full = count 'full_ensemble' decisions
         false_negative_rate = accepted examples that were incorrect / n_accepted
         conformal_savings_pct = n_accepted / 100 * 100
         anytime_valid_guarantee = (false_negative_rate <= 0.10)  # within alpha tolerance
         Record: n_accepted (int), n_full (int), conformal_savings_pct (float),
         false_negative_rate (float), anytime_valid_guarantee (bool).
         conformal_routing_viable = (conformal_savings_pct >= 20.0 AND anytime_valid_guarantee).

      3. Compare to weak-strong policy (exp2745 baseline):
