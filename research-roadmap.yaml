    - python/carnot/pipeline/embedding_constraint_store.py — EmbeddingConstraintStore (Exp 800)
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (Exp 812 modified)
    - python/carnot/pipeline/self_learning_relay.py — SelfLearningRelay (Exp 361)
    - openspec/capabilities/autoresearch/spec.md — FR-11, REQ-LEARN entries

