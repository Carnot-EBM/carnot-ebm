Y add Group D; leave Group A/B/C unchanged.\n  2. Run calibration with 10 verifiers across 4 groups, 5 seeds.\n  3. Compute ensemble_v7b_auroc (mean across 5 seeds) and ensemble_v7b_auroc_std.\n  4. Compare: ensemble_v6_baseline=0.9750, ensemble_v7_regression=0.9607.\n  5. Set regression_resolved = (ensemble_v7b_auroc >= 0.975).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - ensemble_v7b_auroc:\n      principle: \"Primary metric — must be >= 0.970 to unblock adaptive conformal (exp2547). >= 0.975 to restore cite-safe headline.\"\n  - ensemble_v7b_auroc_std:\n      principle: \"Multi-seed std — required for paper-v6 cite-safe reporting.\"\n  - ensemble_v6_baseline:\n      principle: \"Explicitly records 0.9750 baseline for regression detection.\"\n  - ensemble_v7_regression:\n      principle: \"Explicitly records 0.9607 regression from exp2521 so delta is unambiguous.\"\n  - regression_resolved:\n      principle: \"True if ensemble_v7b_auroc >= 0.975. Key success flag.\"\n  - tier0r_group_assignment:\n      principle: \"Must be 'Group D (proof-path)'. Documents that Group C was not modified.\"\n  - n_seeds:\n      principle: \"Must be >= 3 for meaningful std.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Base random seed — set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"ensemble_v7b_auroc >= 0.970\"\n    principle: \"Minimum gate for adaptive conformal (exp2547). >= 0.975 would fully restore cite-safe headline AUROC.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

