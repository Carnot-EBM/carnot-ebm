         If total_elapsed < 30:
           Update stub with honest_verdict='blocked_suspicious_duration_too_short',
           duration_s=total_elapsed and exit.
         Record: duration_s = total_elapsed.
         reproducibility_checksum = md5(gguf_path + "n=5" + "seed=42" + str(round(energy_mean, 6)))

      5. Write FINAL results/experiment_2765_verifier_live_gpu_v4.json (overwrite stub).

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_' or 'partial_started'
        principle: "Stub-first protocol: partial_started is acceptable as minimum viable artifact; blocked_* if any hard gate fails; complete: if all steps succeed."
      - verifier_discriminative: bool
        principle: "PRIMARY GATE: True clears 3-milestone adversarial-flag chain. any(energy>0) AND (max-min)>0.01."
      - energy_values: list of float (5 values)
        principle: "Adversarial audit: all-zero = verifier still broken; variance > 0.01 = non-degenerate."
      - energy_mean: float
        principle: "Population mean: non-zero confirms verifier produces meaningful scores."
      - energy_std: float
        principle: "Population std > 0.01 = discriminative."
      - model_loaded: bool
        principle: "Confirms gemma-4-26B-A4B-it-GGUF was actually loaded via llama_cpp."
      - model_load_time_s: float
        principle: "Real GGUF load: expected >= 30s; < 5s = model not loaded (adversarial gate)."
      - model_specs: dict with {name, hf_id, quantization, n_gpu_layers}
        principle: "Methodology field required by adversarial_verify.py METHODOLOGY_MISSING check."
      - stub_written_at: str
        principle: "Confirms stub-first protocol executed (anti-absent-artifact discipline)."
      - random_seed: int — 42
        principle: "Reproducibility anchor."
      - reproducibility_checksum: str
        principle: "Content-addressed hash of run inputs."
      - cuda_available: bool
        principle: "Confirms GPU was available (not CPU-only fallback)."
      - duration_s: float — MUST be >= 30 for complete: verdict
        principle: "GATE against adversarial fabrication: GGUF load + 5 inferences cannot be < 30s."
      - preconditions_checked: list of {resource, available, check}
