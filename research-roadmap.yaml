      - Quantifies hallucinations through "Semantic Energy" derived from NLI contradiction scores
      - Achieves AUROC 0.70+ on fact verification benchmarks WITHOUT external knowledge bases
      - The energy scoring is: E(response) = NLI_contradiction_score(premise, response) * temperature_weight

