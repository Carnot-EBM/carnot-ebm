      Recompute Exp6115's transport and semantic metrics from immutable raw rows; attribute empty, truncated, channel-fragment, terminal-field, parse, and method failures to observable causes; inspect the pinned GGUF chat-template surface; freeze one minimal v2 serialization/canary contract; and write results/experiment_6126_phase_d_exp6115_transport_forensics.json without live inference.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash Exp6114/Exp6115 artifacts, raw rows, generator script, GGUF metadata, tokenizer/chat-template metadata, exclusions, output path, protected files, and dirty worktree. Require all 720 row identities or report incompleteness.
