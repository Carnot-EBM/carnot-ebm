    Note: ThinkPRM backbone is a small supervised model (not a generative GGUF).
    Use 0.8B as backbone for the PRM head (this is a classification task, not generation).

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/thinkprm_probe.py (ThinkPRMProbe architecture)
    - data/step_level_prm_training.jsonl (7349 training examples — check first 5 entries)
    - data/fover_corpus_v4.json (evaluation corpus for final AUROC measurement)
    - results/experiment_1033_thinkprm_v4.json (baseline: AUROC=0.9885, training_data_size)

    TASK:
    1. Load data/step_level_prm_training.jsonl (7349 step-level labeled examples).
       Verify format: {question, step, label, energy_score} or similar.
       Split: 80% train (5879 examples), 20% eval (1470 examples).

    2. Initialize ThinkPRM backbone:
