- id: exp965-triple-integration
  milestone: 2026.04.75
  deliverable: results/experiment_965_triple_integration.json
  title: "Triple Integration — SC-Energy + SpilledEnergy + ThinkPRM into ThreeTierPipeline"
  prompt: |
    CONTEXT:
    Exp 955 (Triple Integration) was blocked in .74 by missing prior_failures. This retry
    provides complete prior_failures documentation. The integration task itself is unchanged:
    wire three validated probes into ThreeTierPipeline as production Tier components.

    SC-Energy (Exp 944, AUROC=0.9017), SpilledEnergy (Exp 949, AUROC=1.0), and ThinkPRM
    (Exp 945, AUROC=0.99) are all implemented and working. None are wired into production
    ThreeTierPipeline. This experiment connects them.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py (ThreeTierPipeline integration point)
    - python/carnot/models/sc_energy.py (SCEnergyModel, from Exp 944)
    - python/carnot/pipeline/extract.py (SpilledEnergyDetector, from Exp 949)
    - scripts/experiment_944_sc_energy_v2.py (SC-Energy training/loading pattern)

    TASK:
    Wire three probes into ThreeTierPipeline as production tiers:
    - SpilledEnergy as Tier 0 fast reject (training-free, logit-based, no GPU needed)
    - ThinkPRM as Tier 2.9 CoT step verifier (generative, medium cost)
    - SC-Energy as Tier 3 set-level consistency energy (energy-based, higher cost)

    Integration architecture cascade:
      Tier 0 (SpilledEnergy) -> fast, runs on every response, rejects obvious errors
      Tier 2.9 (ThinkPRM) -> medium, runs when Tier 0 uncertain, verifies reasoning steps
      Tier 3 (SC-Energy) -> slow, runs when Tier 2.9 uncertain, energy-based set consistency

    Required: end-to-end integration test with synthetic input showing all three tiers activate
    in cascade. Write honest_verdict = "triple_integration_viable" if all three wire without
    import errors and the cascade test passes.

    Write results/experiment_965_triple_integration.json with schema:
      tier0_wired: bool
      tier29_wired: bool
      tier3_wired: bool
      cascade_test_passed: bool
      honest_verdict: str

    Run: python scripts/experiment_965_triple_integration.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: high
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 60
