- id: exp590-carnot-force-live-assertion
  milestone: 2026.04.45
  deliverable: results/experiment_590_live_assertion.json
  title: 'Exp 590: Import-Time CARNOT_FORCE_LIVE Assertion Module (RETRO-062 Final Fix)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-062 has\
    \ caused three consecutive milestone failures (Live 50q A blocked in .42, .43,\
    \ and partially in .44). Root cause: CARNOT_FORCE_LIVE not set at session start.\
    \ The current EnvironmentAutoFix (env_autofix.py) injects CARNOT_FORCE_LIVE=1 when\
    \ GPU is detected, but experiments still sometimes run without it. This experiment\
    \ creates a hard import-time assertion that makes it impossible for a live GPU\
    \ experiment to silently fall back to synthetic mode.\n\nEXISTING CODE TO READ\
    \ FIRST:\n- python/carnot/pipeline/env_autofix.py — EnvironmentAutoFix, apply_env_autofix()\n\
    - python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate.require_live_or_blocked()\n\
    - python/carnot/pipeline/__init__.py — current exports\n\nTASK: Create live_assertion.py\
    \ module with import-time CARNOT_FORCE_LIVE enforcement.\n1. Read CLAUDE.md spec-first\
    \ workflow.\n2. Add REQ-INFRA-082 (assert_live_gpu_available enforces CARNOT_FORCE_LIVE\
    \ at import time), SCENARIO-INFRA-087/088 to spec.\n3. Create python/carnot/pipeline/live_assertion.py:\n\
    \   a. assert_live_gpu_available() function:\n      - Tries import torch. If ImportError:\
    \ return (no GPU possible).\n      - If torch.cuda.is_available() is False: return\
    \ (no GPU, assertion does not apply).\n      - If torch.cuda.is_available() is\
    \ True AND os.environ.get('CARNOT_FORCE_LIVE') != '1':\n        raise RuntimeError('CARNOT_FORCE_LIVE\
    \ must be set to 1 for live GPU experiments.\\n'\n            'Run: source scripts/session_startup.sh\\\
    n'\n            'Or: export CARNOT_FORCE_LIVE=1')\n   b. assert_live_or_ci_skip()\
    \ function (softer variant for test suites):\n      - If CARNOT_IS_CI=1 in env:\
    \ return without checking (CI environments skip GPU).\n      - Otherwise: calls\
    \ assert_live_gpu_available().\n   c. Export both from carnot.pipeline.__init__.\n\
    4. Write scripts/experiment_590_live_assertion.py:\n   a. apply_env_autofix() FIRST.\n\
    \   b. ExperimentTimeoutWatchdog(590, timeout_minutes=10).\n   c. ExperimentTemplate(590,\
    \ 'CARNOT_FORCE_LIVE Assertion Module',\n      'results/experiment_590_live_assertion.json',\
    \ requires_gpu=False).\n   d. Verify module exists, both functions importable.\n\
    \   e. Test logic: with CARNOT_FORCE_LIVE='1' set, assert_live_gpu_available()\
    \ should NOT raise.\n   f. Test logic: with CARNOT_FORCE_LIVE='0', if torch.cuda.is_available()\
    \ would return True, function raises RuntimeError.\n   g. Verify exports are present\
    \ in carnot.pipeline.\n   h. Build artifact: schema='carnot.live_assertion.v1',\n\
    \      module_created=True,\n      assert_live_gpu_available_exported=True,\n \
    \     assert_live_or_ci_skip_exported=True,\n      retro_062_prevention_mechanism='import_time_assertion_raises_before_model_load',\n\
    \      honest_verdict='assertion_module_ready'.\n   i. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_live_assertion.py (100% coverage on\
    \ live_assertion.py):\n   a. Test assert_live_gpu_available() returns cleanly when\
    \ CUDA not available (mock torch.cuda.is_available=False).\n   b. Test raises RuntimeError\
    \ when cuda available and CARNOT_FORCE_LIVE != '1' (mock both).\n   c. Test does\
    \ not raise when CARNOT_FORCE_LIVE='1' and CUDA available (mock both).\n   d. Test\
    \ assert_live_or_ci_skip() skips when CARNOT_IS_CI=1.\n   e. 100% coverage.\n\
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile: ops/conductor-log.md,\
    \ ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp591-coace-v3-live-calibrated
  milestone: 2026.04.45
  deliverable: results/experiment_591_coace_v3_live.json
  title: 'Exp 591: CoACEExtractorV3 — Live-Corpus Calibration (RETRO-066 CRITICAL PATH)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-066 CRITICAL\
    \ — CoACEExtractorV2 achieves 86.7% recall on Exp 565's synthetic offline corpus\
    \ but only 5.9% recall on live FOVER production responses (Exp 581). The offline\
    \ test set used curated responses with simple 'A op B = C' patterns. Real IT-model\
    \ outputs use narrative arithmetic: 'Adding 47 to 28 gives us 76', cumulative totals\
    \ ('bringing the total to 150'), percentage-of word problems, and multi-paragraph\
    \ derivations where the error is three steps removed from the stated equation.\
    \ At 5.9% live recall, RETRO-033 cannot be resolved. CoACEV3 must be calibrated\
    \ against real live model outputs from Exp 578.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/extraction/coace_extractor.py — CoACEExtractor v1\n- python/carnot/extraction/coace_extractor_v2.py\
    \ — CoACEExtractorV2 (examine all patterns — identify why they miss live data)\n\
    - results/experiment_581_coace_recall_diagnostic_v2.json — v2_detail: per_question_flags\
    \ showing which responses have FN=True (READ ALL false negative entries)\n- results/live_pairs_578.json\
    \ — 100 live pairs from Qwen3.5-0.8B and Gemma4-E4B-it (READ FIRST to understand\
    \ what live IT-model arithmetic prose actually looks like)\n- results/fover_corpus_v3.json\
    \ — merged FOVER corpus (if exists) or results/fover_corpus_v2.json\n- python/carnot/extraction/__init__.py\
    \ — add CoACEExtractorV3 export\n\nTASK: Implement CoACEExtractorV3 calibrated\
    \ on live model outputs.\n1. Read CLAUDE.md spec-first workflow.\n2. Read results/live_pairs_578.json.\
    \ For each incorrect response (is_correct=False), manually inspect the text and\
    \ identify the arithmetic error pattern. Build a catalog of at least 5 distinct\
    \ live pattern types not covered by CoACE v2.\n3. Add REQ-EXTRACT-040 (CoACEV3:\
    \ live-corpus calibrated patterns), REQ-EXTRACT-041 (CoACEV3: narrative quantity\
    \ chains), REQ-EXTRACT-042 (CoACEV3: causal faithfulness signal), SCENARIO-EXTRACT-075/076/077/078\
    \ to spec.\n4. Create python/carnot/extraction/coace_extractor_v3.py:\n   a. Import\
    \ CoACEExtractorV2 (reuse all v2 patterns).\n   b. _parse_narrative_arithmetic(text:\
    \ str) -> list[ArithmeticEquation]:\n      - Pattern: 'X [plus|added to|and] Y\
    \ [gives|equals|is|=] Z' → eval X+Y vs Z.\n      - Pattern: 'bringing [the] [total|count|sum]\
    \ to Z' where context has running_total: verify Z matches accumulated sum.\n  \
    \    - Pattern: 'total of A + B + C + ... = Z' (long additive chains up to 6 terms)\
    \ → eval sum vs Z.\n      - Pattern: 'after [adding|subtracting|multiplying] X\
    \ [from|to|by] Y, [we get|resulting in|the result is] Z' → eval operation vs Z.\n\
    \   c. _parse_percentage_word_problem(text: str) -> list[ArithmeticEquation]:\n\
    \      - Pattern: 'N percent[age] of M [is|equals|gives|totals|amounts to|or]\
    \ P' → eval N/100*M vs P.\n      - Pattern: 'M at N% [discount|markup|interest]\
    \ [is|leaves|becomes] P' → eval M*(1+-N/100) vs P.\n      - Pattern: 'out of M\
    \ total, N percent attended, meaning P people' → eval M*N/100 vs P.\n   d. _parse_unit_conversion(text:\
    \ str) -> list[ArithmeticEquation]:\n      - Hours to minutes: 'X hours [is|equals|converts\
    \ to] Y minutes' → eval X*60 vs Y.\n      - Days to hours: 'X days [is|equals]\
    \ Y hours' → eval X*24 vs Y.\n      - Km to meters: 'X km[s] [is|=] Y meter[s]'\
    \ → eval X*1000 vs Y.\n      - (Add 3+ unit conversion rules from live corpus analysis.)\n\
    \   e. _parse_running_total_chain(text: str) -> list[ArithmeticEquation]:\n  \
    \    - Build a running total as the CoT progresses. Detect when a stated subtotal\
    \ diverges from the accumulated computation. Track 'first X, then Y, then Z, so\
    \ total is W' → eval X+Y+Z vs W.\n   f. CoACEExtractorV3 class:\n      - Inherits\
    \ from CoACEExtractorV2.\n      - Override extract(self, response: str) -> CoACEResult:\n\
    \          Call v2 extract(), plus _parse_narrative_arithmetic(), _parse_percentage_word_problem(),\n\
    \          _parse_unit_conversion(), _parse_running_total_chain(). Deduplicate.\n\
    \      - Export CoACEExtractorV3 from carnot.extraction.__init__.\n5. Write scripts/experiment_591_coace_v3_live.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. from python.carnot.pipeline.live_assertion\
    \ import assert_live_or_ci_skip; assert_live_or_ci_skip()\n   c. ExperimentTimeoutWatchdog(591,\
    \ timeout_minutes=30).\n   d. ExperimentTemplate(591, 'CoACEExtractorV3 Live Calibration',\n\
    \      'results/experiment_591_coace_v3_live.json', requires_gpu=False).\n   e.\
    \ Load 25 live incorrect responses from results/experiment_581_coace_recall_diagnostic_v2.json\
    \ (per_question_flags, is_correct=False entries) as the test set.\n   f. If Exp\
    \ 581 per_question_flags has no raw response text: load results/live_pairs_578.json,\
    \ take first 25 incorrect (is_correct=False) responses.\n   g. Run run_extractor_diagnostic(CoACEExtractorV3(),\
    \ test_set) → v3_tp, v3_fp, v3_recall, v3_precision.\n   h. Run run_extractor_diagnostic(CoACEExtractorV2(),\
    \ test_set) → v2_recall (baseline).\n   i. Compute gate: gate_open = v3_recall\
    \ >= 0.30.\n   j. Build artifact: schema='carnot.coace_v3.v1',\n      n_responses=<int>,\n\
    \      v2_recall=<float>, v3_recall=<float>,\n      recall_improvement=v3_recall-v2_recall,\n\
    \      v3_tp_rate=<float>, v3_fp_rate=<float>, v3_precision=<float>,\n      gate_open=<bool>,\n\
    \      retro_066_partial=(v3_recall > 0.10),\n      retro_066_resolved=(v3_recall\
    \ >= 0.30),\n      honest_verdict='recall_breakthrough' if v3_recall>=0.30 else\
    \ 'recall_improved' if v3_recall>0.10 else 'recall_no_improvement'.\n   k. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n6. Write tests/python/test_coace_extractor_v3.py (100% coverage\
    \ on coace_extractor_v3.py).\n7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\n8. Reconcile: _bmad/traceability.md (new REQ rows), ops/conductor-log.md\
    \ (RETRO-066), ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp592-dsvd-live-validation
  milestone: 2026.04.45
  deliverable: results/experiment_592_dsvd_live_val.json
  title: 'Exp 592: DSVD Live Validation + OTV Lightweight Verifier (Tier 2.5 Wire-In)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Exp 587 implemented\
    \ DSVDAdapter (arXiv 2503.03149) achieving dsvd_auc=0.976 and honest_verdict=tier_2_5_viable.\
    \ However, AUC was measured on a corpus that may include synthetic pairs. To wire\
    \ DSVDAdapter into the production cascade as Tier 2.5, we need AUC validation on\
    \ LIVE pairs only (from Exps 578-579 with inference_mode='live_gpu'). Also: Exp\
    \ 592 tests OTV (arXiv 2603.01025) — a one-token verifier LoRA head that could\
    \ replace EORM (55M params, Tier 2) with a near-zero-cost alternative. Gate: dsvd_live_auc\
    \ >= 0.80 opens Exp 595 (Live VR DSVD).\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/dsvd_adapter.py\
    \ — DSVDAdapter, DSVDResult (from Exp 587)\n- results/experiment_587_dsvd_adapter.json\
    \ — dsvd_auc=0.976 result, check corpus_type field\n- results/live_pairs_578.json\
    \ — 100 live pairs (inference_mode='live_gpu')\n- results/fover_corpus_v3.json\
    \ (or fover_corpus_v2.json) — merged corpus\n- python/carnot/pipeline/three_tier_pipeline.py\
    \ — ThreeTierPipeline (add Tier 2.5 slot)\n\nTASK: Validate DSVD on live pairs\
    \ and wire as Tier 2.5. Test OTV as lightweight Tier 2 alternative.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Add REQ-VERIFY-115 (DSVDAdapter Tier 2.5: live_auc validation),\
    \ REQ-VERIFY-116 (OTV one-token verifier as lightweight Tier 2), SCENARIO-VERIFY-145/146/147\
    \ to spec.\n3. Create python/carnot/pipeline/otv_verifier.py:\n   a. OTVVerificationToken\
    \ dataclass: token_logit (float), verification_score (float), is_correct_pred (bool).\n\
    \   b. OTVVerifier class:\n      - __init__(self, embed_dim: int = 128): linear\
    \ layer (embed_dim → 1) as the verification token projection.\n      - score(self,\
    \ hidden_state: jnp.ndarray) -> float: linear projection → sigmoid → verification\
    \ score.\n      - train(self, pairs: list[tuple[jnp.ndarray, bool]], n_epochs: int\
    \ = 50): SGD on binary cross-entropy. Uses assert_live_or_ci_skip() guard.\n  \
    \    - predict(self, hidden_state: jnp.ndarray) -> OTVVerificationToken.\n   c.\
    \ Export OTVVerifier, OTVVerificationToken from carnot.pipeline.__init__.\n4. Write\
    \ scripts/experiment_592_dsvd_live_val.py:\n   a. apply_env_autofix() FIRST; from\
    \ python.carnot.pipeline.live_assertion import assert_live_or_ci_skip; assert_live_or_ci_skip().\n\
    \   b. ExperimentTimeoutWatchdog(592, timeout_minutes=30).\n   c. ExperimentTemplate(592,\
    \ 'DSVD Live Validation + OTV Verifier',\n      'results/experiment_592_dsvd_live_val.json',\
    \ requires_gpu=False).\n   d. Load live_pairs_578.json. Isolate pairs where inference_mode='live_gpu'.\n\
    \   e. If no live pairs found: use fover_corpus_v3.json with is_simulated=False\
    \ filter. If still empty: use all FOVER pairs and set corpus_type='mixed_fallback'.\n\
    \   f. Run DSVDAdapter.score() on each response. Collect (score, is_correct) pairs.\n\
    \   g. Compute dsvd_live_auc = roc_auc_score(is_correct_labels, dsvd_scores).\n\
    \   h. Build OTVVerifier (embed_dim=128). Train on hidden_state stubs (jnp.zeros((128,))\
    \ for correct, jnp.ones((128,)) for incorrect — synthetic, just validate API).\n\
    \   i. Compute gate_open = dsvd_live_auc >= 0.80.\n   j. Wire Tier 2.5: if gate_open,\
    \ add DSVDAdapter to ThreeTierPipeline between Tier 2 (EORM) and Tier 3 (Ising).\n\
    \   k. Build artifact: schema='carnot.dsvd_live_val.v1',\n      dsvd_live_auc=<float>,\n\
    \      dsvd_synthetic_auc=0.976,\n      corpus_type=<str>,\n      n_live_pairs=<int>,\n\
    \      gate_open=<bool>,\n      tier_2_5_wired=<bool>,\n      otv_api_validated=True,\n\
    \      honest_verdict='dsvd_validated_wired' if (gate_open and tier_2_5_wired)\
    \ else 'dsvd_not_validated' if not gate_open else 'dsvd_wiring_failed'.\n   l.\
    \ tmpl.assert_deliverable_written() as FINAL LINE.\n5. Write tests/python/test_dsvd_live_val.py\
    \ (100% coverage on otv_verifier.py new code).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n7. Reconcile: _bmad/architecture.md (Tier 2.5 table), ops/conductor-log.md,\
    \ ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp593-jepa-v12-live-retrain
  milestone: 2026.04.45
  deliverable: results/experiment_593_jepa_v12_retrain.json
  title: 'Exp 593: JEPA v12 Live Corpus Retrain — CPMI + PROGRS on 100 Real Pairs (FR-11 Mandatory)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: JEPA v11 (Exp\
    \ 580) achieved AUC=1.0 on 9 synthetic pairs — almost certainly overfitting. The\
    \ CPMI contrastive architecture (arXiv 2604.10660) is correct, but the training\
    \ corpus was too small. Exp 578 now provides 100 live pairs (GSM8K 0-49, both\
    \ Qwen3.5-0.8B and Gemma4-E4B-it) with inference_mode='live_gpu'. This experiment\
    \ trains JEPA v12 on the full live corpus using CPMI + PROGRS outcome-conditioned\
    \ centering (arXiv 2604.02341) to prevent reward hacking. Target: val_auc >= 0.70\
    \ on a held-out 20% split (20 real live pairs).\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/inference/jepa_cpmi_pairs.py — JEPACPMIPairBuilder, CPMIContrastiveLoss\
    \ (from Exp 577)\n- python/carnot/inference/jepa_predictor.py — JEPAPredictor\
    \ architecture\n- results/experiment_577_jepa_cpmi_pairs.json — n_real_pairs=<check>,\
    \ pair quality\n- results/experiment_580_jepa_v11_retrain.json — v11_auc=1.0,\
    \ corpus size\n- results/live_pairs_578.json — 100 live pairs (READ to understand\
    \ structure)\n- results/fover_corpus_v3.json (or v2) — merged corpus with all\
    \ sources\n\nTASK: Retrain JEPA v12 on live pairs with PROGRS outcome-centering.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-LEARN-060 (JEPA v12: live-corpus\
    \ CPMI retrain >= 100 real pairs), REQ-LEARN-061 (PROGRS outcome-conditioned centering\
    \ for contrastive stability, arXiv 2604.02341), SCENARIO-LEARN-095/096/097 to\
    \ autoresearch/spec.md.\n3. Update python/carnot/inference/jepa_cpmi_pairs.py:\n\
    \   a. Add PROGRSCentering class:\n      - __init__(self): no params.\n      -\
    \ center_pairs(self, pairs: list[JEPACPMIPair], model: JEPAPredictor) -> list[JEPACPMIPair]:\n\
    \          * For each question_id group: compute mean energy gap = mean(E_incorrect\
    \ - E_correct) across all pairs in group.\n          * Subtract group mean from\
    \ each pair's energy gap before computing loss.\n          * Returns same pairs\
    \ with adjusted weights for loss computation.\n      - compute_centered_loss(self,\
    \ model, pairs, margin=1.0) -> float:\n          * Apply PROGRS centering, then\
