      verdict: hinge_only_confirmed_positive_calibration_but_variance_worsened
      addressed_by: "exp1401 produced calibration_auroc_delta=+0.1857 but variance_worsened=true. arXiv:2604.07172 suggests scalar temperature scaling as a post-hoc calibration fix."
      retire_if_same_verdict: false
