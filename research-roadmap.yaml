        3. Run the reproduction gate (arc_solver_kit.reproduce). Only on reproduced=True, update ops/arc_solve_registry.yaml (win condition, action model, gotchas, dead-ends, solver module) + bump reproducible_total_levels.
        4. Record DEAD-ENDS (a search approach that stalled + why) in the registry entry so the next attempt skips them.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
