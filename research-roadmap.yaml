- id: exp529-gpu1-routing-fix
  milestone: 2026.04.40
  deliverable: results/experiment_529_gpu1_routing_fix.json
  title: 'Exp 529: GPU1 Explicit Routing Fix — RETRO-052 closure, cuda:1 utilization verified'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-052:\
    \ Exp 517 (controlled DualGPU test) confirmed gpu1_compute_pct=0.0 even in\
    \ live_gpu mode with explicit device_map=('': 'cuda:1'). The build_zombie_fix_strategy()\
    \ wired in ExperimentTemplate.setup_gpu() assigns device maps, but transformers\
    \ may be overriding this at the model load level. This experiment writes a\
    \ minimal standalone harness that loads ONLY Qwen3.5-0.8B with an explicit\
    \ cuda:1 constraint at every level (device_map, model.to(), tensor device\
    \ assertions) and measures nvmlDeviceGetUtilizationRates() on cuda:1 during 20\
    \ inference passes. If GPU 1 utilization > 10%, the routing is working. If\
    \ still 0%, capture the exact transformers device_map override path.\n\n\
    EXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/jit_vram_check.py — JITVRAMCheck\n\
    - python/carnot/pipeline/gpu_vram_gate_v2.py — GPUVRAMGateV2\n\
    - scripts/experiment_517_dual_gpu_controlled_test.py — prior diagnosis (read\
    \ for device_map patterns tried)\n\
    - results/experiment_517_dual_gpu_controlled_test.json — result (gpu1_compute_pct=0.0)\n\
    - python/carnot/pipeline/gpu_zombie_fix.py — build_zombie_fix_strategy()\n\
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu()\n\
    - ops/known-issues.md — RETRO-052\n\nTASK: Fix and verify GPU 1 forward-pass routing.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-INFRA-060 (Qwen3.5-0.8B loads and runs inference on cuda:1),\
    \ REQ-INFRA-061 (gpu1_compute_pct > 10 during inference), SCENARIO-INFRA-070/071\
    \ to spec.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - GPU1RoutingResult(device_used, gpu1_compute_pct_during_inference,\
    \ routing_verified, honest_verdict)\n\
    \   - force_cuda1_device_map(model_id) -> Dict: returns device_map\
    \ that FORCES all layers to cuda:1 (not auto)\n\
    \   - verify_model_on_device(model, expected_device_id: int) -> bool:\
    \ check model.device or first parameter device\n\
    5. Write scripts/experiment_529_gpu1_routing_fix.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(529, timeout_minutes=30)\n\
    \   c. ExperimentTemplate(529, 'GPU1 Routing Fix',\n\
    \      'results/experiment_529_gpu1_routing_fix.json', requires_gpu=True)\n\
    \   d. DeliverableGuard\n\
    \   e. If not live GPU: emit gpu_required artifact, exit\n\
    \   f. JITVRAMCheck(1).gate_model_load('qwen3.5-0.8b', required_gb=1.5)\n\
    \   g. Load Qwen3.5-0.8B with THREE explicit cuda:1 constraints:\n\
    \      i.  device_map=('': 'cuda:1') in from_pretrained()\n\
    \      ii. torch_dtype=torch.float16\n\
    \      iii. After load: model = model.to('cuda:1') (belt-and-suspenders)\n\
    \   h. verify_model_on_device(model, expected_device_id=1); if False log WARNING\n\
    \   i. Start nvml sampling thread: poll nvmlDeviceGetUtilizationRates()\
    \ for gpu_id=1 every 0.25s\n\
    \   j. Run 20 inference passes on 20 short prompts ('Answer: 2+2=', etc.)\n\
    \   k. Stop nvml thread; compute mean gpu1_compute_pct\n\
    \   l. Build artifact: schema='carnot.gpu1_routing_fix.v1'\n\
    \      device_used, gpu1_compute_pct_during_inference\n\
    \      routing_verified=(gpu1_compute_pct > 10.0)\n\
    \      model_on_device=(verify_model_on_device result)\n\
    \      retro_052_closed=routing_verified\n\
    \      honest_verdict='gpu1_active' if routing_verified\n\
    \        else 'gpu1_still_idle' if inference_mode=='live_gpu'\n\
    \        else 'gpu_required'\n\
    \   m. If routing_verified: update ExperimentTemplate.setup_gpu() docstring\
    \ to note that model.to() belt-and-suspenders is required after from_pretrained().\n\
    \   n. Call tmpl.assert_deliverable_written() as FINAL LINE\n\
    6. Run tests, reconcile docs (RETRO-052 status).\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp530-pipeline-tiers-wiring
  milestone: 2026.04.40
  deliverable: results/experiment_530_pipeline_tiers_wired.json
  title: 'Exp 530: Wire NUP Probe v4 + Hallucination Basin Detector into ThreeTierPipeline'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Milestone .39\
    \ produced two production-ready verification components that are CPU-validated\
    \ but not wired into the live verification cascade:\n  (1) NUP Probe v4 (AUC=1.0,\
    \ contrastive training, Exp 523) — qualifies for Tier 0c promotion.\n  (2) Hallucination\
    \ Basin Detector (viable_tier0d, Exp 521) — new detection modality via latent-space\
    \ basin depth.\nWiring these into ThreeTierPipeline makes them available in every\
    \ live verify-repair call without changing external API.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline (existing\
    \ Tier 1/2/3 structure)\n- python/carnot/pipeline/nup_probe_v4.py — NUPProbeV4,\
    \ ContrastivePairLoss (Exp 523)\n- python/carnot/pipeline/hallucination_basin.py\
    \ — HallucinationBasinDetector, BasinEstimate (Exp 521)\n- python/carnot/pipeline/spilled_energy.py\
    \ — SpilledEnergyDetector (Tier 0b, for pattern)\n- python/carnot/pipeline/verify_repair.py\
    \ — VerifyRepairPipeline (main API)\n- python/carnot/pipeline/think_probe.py —\
    \ CarnotThinkProbe (Tier 0a, for optional-tier pattern)\n- _bmad/architecture.md\
    \ — Verification Pipeline Tiers table\n- scripts/experiment_template.py —\
    \ ExperimentTemplate\n\nTASK: Wire NUP Probe v4 as Tier 0c and HallucinationBasinDetector\
    \ as Tier 0d into ThreeTierPipeline.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-VERIFY-100 (NUP Probe v4 wired as Tier 0c: if probe score > threshold,\
    \ skip Tiers 1-3), REQ-VERIFY-101 (Hallucination Basin Detector wired as Tier 0d),\
    \ SCENARIO-VERIFY-135/136/137 to spec.\n\
    3. In python/carnot/pipeline/three_tier_pipeline.py:\n\
    \   a. Add optional nup_probe_v4: Optional[NUPProbeV4] = None param to __init__.\n\
    \   b. Add optional basin_detector: Optional[HallucinationBasinDetector] = None param.\n\
    \   c. In run() or verify(), after Tier 0b (SpilledEnergy) and before Tier 1 (SinkProbe):\n\
    \      - If nup_probe_v4 is not None: call score = nup_probe_v4.score(response)\n\
    \        if score <= nup_probe_threshold: increment tier0c_skip counter and return\
    \ early (same pattern as spilled_energy early return)\n\
    \      - If basin_detector is not None: call estimate = basin_detector.detect(hidden_states)\n\
    \        if estimate.basin_risk_score <= basin_threshold: increment tier0d_skip\
    \ and return early\n\
    \   d. Add tier0c_skip_count and tier0d_skip_count to ThreeTierPipelineResult.\n\
    4. Write new tests in tests/python/test_three_tier_pipeline.py (100% coverage\
    \ of new wiring paths):\n\
    \   - test: nup_probe_v4=None → no Tier 0c step (unchanged behavior)\n\
    \   - test: nup_probe_v4 with mock score > threshold → tier0c_skip_count increments,\
