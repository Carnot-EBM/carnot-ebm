- id: exp6761-procedural-memory-stream
  title: Capacity-controlled procedural memory stream
  track: continuous-self-learning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.08.589
  deliverable: results/experiment_6761_procedural_memory_stream.json
  prompt: |
    CONTEXT:
    Exp6748 proved transactional mechanics, but Exp6749 and Exp6750 recorded zero commits and zero
    rejects. The branch therefore did not exercise continuous self-learning. When Continual Learning
    Moves to Memory (arXiv 2604.27003) finds that procedural abstractions transfer more reliably
    than detailed trajectories and that hard cases suffer the most negative transfer. Memoir
    (arXiv 2607.20792) supports read-only active episodes and between-episode updates.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md, Continuous Self-Learning section
    - {project_root}/results/experiment_6748_transactional_constraint_memory_fixture.json
    - {project_root}/results/experiment_6749_prospective_support_preserving_csl_ab.json
    - {project_root}/results/experiment_6750_csl_durability_support_poison_audit.json
    - {project_root}/python/carnot/training/online.py and
      {project_root}/python/carnot/training/online_updater.py
    - {project_root}/python/carnot/pipeline/case_memory.py and atomic journal helpers
    - Primary sources arXiv 2604.27003 and 2607.20792 and code at
      https://github.com/RightNow-AI/Memoir.

    TASK:
    Build a chronological, non-saturating constraint stream that guarantees known exact-admissible
    accept and reject opportunities without leaking future answers. Represent each reusable event
    both as a detailed trace and as an abstract procedural constraint lesson under equal capacity.

    CONCRETE STEPS:
    0. PRECONDITIONS: require the Exp6748 transaction fixture, exact authority, atomic storage,
       restart, and rollback helpers. If unavailable write complete_blocked_procedural_stream with
       gate_check_summary.
    1. Confirm or add narrow REQ-* anchors in
       openspec/capabilities/continuous-learning/spec.md and research-reporting specs. Write stream,
       chronology, capacity, transaction, and poison tests first.
    2. Generate at least six preregistered chronological orders across reusable procedure families,
       naive distractors, held families, hard cases, retention anchors, contradictions, stale
       lessons, duplicates, and poison candidates. Keep the stream below ceiling for all arms.
    3. For each reusable event, create a detailed trajectory record and a procedural lesson that
       states an abstract constraint, applicability scope, and repair procedure without current or
       future answer content. Bind both to the same evidence hash.
    4. Freeze equal storage bytes, top-k retrieval, context tokens, TTL policy, update opportunities,
       and exact authority for the later memory arms. Do not optimize the stream for one arm.
    5. Keep every active episode read-only. Transactions occur only after the exact result closes
       the episode. Each transaction includes parent hash, evidence hash, representation type,
       scope, TTL, admission reason, inverse patch, and atomic restart receipt.
    6. Prove by exact dry replay that each order has at least 12 eligible accepts and 12 eligible
       rejects, while no future event is visible. Poison, contradiction, duplicate, stale, and
       provenance-loss cases must be rejected for the intended reason.
    7. Emit one rows entry per order and event with eligibility, representation pair, difficulty,
       family, chronology, expected transaction class, evidence hash, and capacity cost. Derive
       all counts from rows.
    8. Set procedural_memory_stream_ready only if chronology, non-saturation, nonzero accept and
       reject opportunity, capacity equality, restart, rollback, and poison gates pass.
    9. Run focused tests, lint, spec coverage, adversarial verification, and row consistency.
    10. REQUIRED ARTIFACT FIELDS: field_principles, inference_substrate (deterministic exact-labeled
        chronological stream, no LLM), duration_s, random_seed, reproducibility_checksum,
        stream_manifest, rows (one row per order and event), order_count,
        eligible_accepts_by_order, eligible_rejects_by_order, hard_cases_by_order,
        representation_pair_receipts, capacity_contract, read_only_episode_enforced,
        transaction_schema, poison_fixture_receipts, restart_receipts, rollback_receipts,
        future_evidence_violations, procedural_memory_stream_ready (all-gates boolean),
        gate_check_summary (failed check and observed value for blocked_*), verifier_is_oracle
        (false; exact authority labels admissions but is not a learned verifier claim),
        verdict_class (positive | circular_positive | null | blocked | disqualified | partial), and
        honest_verdict (allowed complete/success/passed/shipped prefix; use
        complete_blocked_<reason> for task-owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6761_procedural_memory_stream.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
