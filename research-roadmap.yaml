- id: exp1311-sota-constraintbench-satquest-answer-stability
  milestone: 2026.04.102
  deliverable: results/experiment_1311_sota_constraintbench_satquest_answer_stability.json
  title: "SOTA Answer Stability on ConstraintBench/SATQuest Micro-Slice"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 70
  priority: critical
  requires_gpu: true
  gated_on:
    - upstream: exp1310-sota-gguf-llamacpp-smoke-load
      artifact_field: headline_result_possible
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1298-sota-answer-stability-falcon-audit
      verdict: blocked_gate_check_failed
      addressed_by: "Run only after exp1310 proves local SOTA smoke-load readiness."
      retire_if_same_verdict: true
    - experiment_id: exp1284-ars-uqlm-answer-stability-sota-audit
      verdict: gated_missing_sota_cache
      addressed_by: "Replace missing-cache gating with the repaired resolver and actual smoke-load readiness."
      retire_if_same_verdict: true
    - experiment_id: exp1271-triggered-certificate-extraction-sota-gguf
      verdict: blocked_gate_check_failed
      addressed_by: "Measure answer stability before attempting certificate extraction."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The first SOTA science task should be a small, verifier-backed stability
    audit before attempting certificate extraction. The planning sweep added
    ConstraintBench and SATQuest as relevant 2025-2026 sources for constraint
    reasoning and satisfiability tasks. Use {project_root} as the project root
    and {date} as the run date in artifact metadata.

    MODEL_SPECS:
    Use cached_sota_pair(gpu_indices=(0, 1)) from python/carnot/inference/sota_models.py.
    At least one headline model must be from:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models may only be CPU smoke tests with headline_result_allowed=false.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - research-references.md
    - results/experiment_1310_sota_gguf_llamacpp_smoke_load.json
    - results/experiment_1283_certificate_grammar_backend_bakeoff.json
    - tests/

    TASK:
    Build and run a tiny deterministic micro-slice inspired by ConstraintBench
    and SATQuest. The task should measure whether local SOTA answers are stable,
    whether disagreements are meaningful, and whether PySAT/Z3-style labels can
    verify the outputs.

    REQUIRED ARTIFACT FIELDS:
    - status
    - answer_stability_score
    - cross_model_disagreement_rate
    - constraintbench_items
    - satquest_items
    - pysat_verified_rate
    - feasibility_rate
    - unknown_or_abstain_rate
    - headline_result_allowed
    - models_used
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1311_sota_constraintbench_satquest_answer_stability.json immediately with status="in_progress".
    2. Resolve MODEL_SPECS and abort to a terminal non-headline blocker if no mandated local SOTA model can run.
    3. Build 8-16 deterministic items: include satisfiable, unsatisfiable, ambiguous/unknown, and compact-encoding cases. Use local generated fixtures if external datasets are not cached.
    4. For each model and item, collect two deterministic perturbations or seeds with a tiny token budget.
    5. Verify final answers with existing constraint tooling where available. Add a small PySAT/Z3 verifier helper only if the repo already depends on it or the dependency is available.
    6. Compute answer_stability_score, cross_model_disagreement_rate, pysat_verified_rate, feasibility_rate, unknown_or_abstain_rate, and item counts.
    7. Write headline_result_allowed=true only when mandated SOTA models produced the headline data and verification is not smoke-test-only.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1311_sota_constraintbench_satquest_answer_stability.json')); print(d.get('answer_stability_score'), d.get('pysat_verified_rate'), d.get('headline_result_allowed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1312-triggered-certificate-extraction-dccd-gbnf
  milestone: 2026.04.102
  deliverable: results/experiment_1312_triggered_certificate_extraction_dccd_gbnf.json
  title: "Triggered Certificate Extraction v4 - DCCD + GBNF + Truthfulness"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 75
  priority: critical
  requires_gpu: true
  gated_on:
    - upstream: exp1311-sota-constraintbench-satquest-answer-stability
      artifact_field: answer_stability_score
      op: '>='
      value: 0.6
  prior_failures:
    - experiment_id: exp1299-triggered-certificate-extraction-v3
      verdict: missing_gated_artifact
      addressed_by: "Run only after exp1311 proves a minimum SOTA answer-stability score."
      retire_if_same_verdict: true
    - experiment_id: exp1285-triggered-certificate-extraction-gbnf-falcon
      verdict: gated_missing_sota_cache
      addressed_by: "Use exp1309/exp1310 resolver and smoke-load gates instead of assuming cache readiness."
      retire_if_same_verdict: true
    - experiment_id: exp1271-triggered-certificate-extraction-sota-gguf
      verdict: blocked_gate_check_failed
      addressed_by: "Compare triggered, GBNF, DCCD-style compact encoding, and repair paths after answer stability is measured."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Carnot has selected llama.cpp GBNF as a certificate grammar backend, but it
    has not measured certificate parse rate and truthfulness on fresh local SOTA
    outputs. Compact Constraint Encoding and DCCD-style ideas should be tested
    against raw triggered and grammar-only paths. Use {project_root} as the
    project root and {date} as the run date in artifact metadata.

    MODEL_SPECS:
    Use cached_sota_pair(gpu_indices=(0, 1)) from python/carnot/inference/sota_models.py.
    Headline models must be drawn from:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models may only be CPU smoke tests with headline_result_allowed=false.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - results/experiment_1283_certificate_grammar_backend_bakeoff.json
    - results/experiment_1311_sota_constraintbench_satquest_answer_stability.json
    - research-references.md
    - openspec/capabilities/pipeline/spec.md
    - tests/

    TASK:
    Implement and run a small triggered certificate extraction comparison over
    the exp1311 item set or equivalent local fixtures. Compare raw-trigger,
    GBNF-constrained, compact-encoding/DCCD-style, and repaired certificate
    paths.

    REQUIRED ARTIFACT FIELDS:
    - status
    - certificate_parse_rate
    - certificate_truthfulness_rate
    - dccd_delta_over_grammar_only
    - grammar_projection_tax_proxy
    - repair_success_rate
    - models_used
    - headline_result_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1312_triggered_certificate_extraction_dccd_gbnf.json immediately with status="in_progress".
    2. Load exp1311 and abort to a terminal blocker if answer_stability_score is below the gate or no headline SOTA outputs exist.
    3. Reuse the existing grammar backend. Add only small, local code needed for compact certificate encoding or schema projection.
    4. For each test item, run raw-trigger, GBNF, compact-encoding/DCCD-style, and repair variants where feasible.
    5. Parse certificates, verify their truthfulness against available labels/verifiers, and measure grammar/projection overhead with a simple proxy such as retries, rejected tokens, or extra prompt length.
    6. Report certificate_parse_rate, certificate_truthfulness_rate, dccd_delta_over_grammar_only, grammar_projection_tax_proxy, repair_success_rate, models_used, headline_result_allowed, status, and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1312_triggered_certificate_extraction_dccd_gbnf.json')); print(d.get('certificate_parse_rate'), d.get('certificate_truthfulness_rate'), d.get('headline_result_allowed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1313-constrainprompt-nsvif-semantic-validator-mus-repair
  milestone: 2026.04.102
  deliverable: results/experiment_1313_constrainprompt_nsvif_semantic_validator_mus_repair.json
  title: "ConstrainPrompt/NSVIF Semantic Validator + MUS Repair"
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  estimated_wall_time_min: 50
  priority: high
  requires_gpu: false
  gated_on:
    - upstream: exp1312-triggered-certificate-extraction-dccd-gbnf
      artifact_field: certificate_parse_rate
      op: '>='
      value: 0.75
  prior_failures:
    - experiment_id: exp1300-semantic-routing-v2
      verdict: blocked_gate_check_failed
      addressed_by: "Activate only after exp1312 proves parseable certificates, then compile validators instead of routing syntax-only claims."
      retire_if_same_verdict: true
    - experiment_id: exp1276-scone-semantic-routing
      verdict: routing_not_backed_by_fresh_sota_certificates
      addressed_by: "Use fresh exp1312 certificate artifacts and add executable semantic validators."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Parseable certificates are not enough. The new literature sweep highlights
    ConstrainPrompt, NSVIF, and MUS-repair/residual-drift work as better
    patterns: compile constraints, execute validators, repair minimal
    unsatisfied subsets, and preserve unknown states. Use {project_root} as the
    project root and {date} as the run date in artifact metadata.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1312_triggered_certificate_extraction_dccd_gbnf.json
    - research-references.md
    - openspec/capabilities/pipeline/spec.md
    - tests/
    - python/carnot/

    TASK:
    Compile parsed certificates from exp1312 into executable semantic validators
    for the tiny constraint corpus. Add MUS-style repair hints for failed
    constraints and record residual-drift cases. This task should not run fresh
    SOTA LLM inference unless absolutely necessary.

    REQUIRED ARTIFACT FIELDS:
    - status
    - compiled_validator_count
    - validator_execution_pass_rate
    - semantic_violation_reduction
    - mus_repair_hint_count
    - residual_drift_cases
    - unknown_or_abstain_rate
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1313_constrainprompt_nsvif_semantic_validator_mus_repair.json immediately with status="in_progress".
    2. Load exp1312 and abort to a terminal blocker if certificate_parse_rate is below 0.75 or parsed certificates are unavailable.
    3. Identify existing verifier/constraint modules that can execute SAT, graph, arithmetic, or schema constraints.
    4. Build a small compiler from certificate claims into validator calls or structured validator inputs.
    5. For failures, compute minimal unsatisfied constraint hints when feasible; otherwise record the smallest available failed constraint set.
    6. Measure validator_execution_pass_rate, semantic_violation_reduction against raw certificate acceptance, residual_drift_cases, unknown_or_abstain_rate, and mus_repair_hint_count.
    7. Add focused tests for at least one validator compiler path if new code is introduced.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1313_constrainprompt_nsvif_semantic_validator_mus_repair.json')); print(d.get('compiled_validator_count'), d.get('validator_execution_pass_rate'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

