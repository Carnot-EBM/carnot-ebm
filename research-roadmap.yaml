  - id: exp4119-carnot-verifier-graft-sudoku
    milestone: 2026.06.381
    title: "GRAFT the Carnot Sudoku verifier on the reproducing baseline (DEFERRED if not yet faithful). DEFENSIVE read of exp4118: IF matches_published_087 (or val>=0.85), graft the EXECUTABLE Sudoku verifier (row/col/box validity) as (A) reranker over TRM candidate solutions and (B) reward for verifier-cert vs vote-cert RFT (A-vs-B de-confound); measure held-out exact-accuracy lift. IF the baseline has not converged, DEFER the graft honestly and report the baseline status for .382."
    priority: high
    track: verifier-as-reward
    max_turns: 110
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-12: graft the Carnot verifier on a reproducing nano-trm baseline — false-positive scope-match vs retired exp4089/exp4100/.380 exp4109; forward difference = built on a RESUMABLE-trained reproducing baseline + on SUDOKU (executable verifier, addressing .379 exp4099's ARC-grid anti-discrimination), defensive-deferred until the baseline is faithful."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4119_carnot_verifier_graft_sudoku.json
    prompt: |
      CONTEXT: Test verifier-as-reward where the verifier has executable teeth (Sudoku validity is an
      exact check), on a faithful reproducing TRM baseline. exp4099 showed the verifier anti-
      discriminates on non-executable ARC grids; Sudoku is the opposite.

      CONCRETE STEPS:
        0. PRECONDITIONS: read results/experiment_4118_*.json for matches_published_087 + stable_checkpoint_path. CUDA available.
        1. BRANCH:
           IF the baseline is faithful (matches_published_087 True OR val>=0.85):
             - RERANK arm: sample K candidate solutions per held-out puzzle from the TRM; rerank by the executable Sudoku verifier; measure pass@1 lift vs TRM-vote and vs oracle, bootstrap CI.
             - RFT arm (de-confound): A=verifier-certified corpus vs B=vote-certified, N-matched, same TRM; resume-train each via nano-trm (bounded <=60 min); measure held-out exact-accuracy. LOAD-BEARING contrast A vs B, CI95 excl 0.
           ELSE (baseline not yet converged):
             - DEFER the graft. Report `graft_deferred: true` + the current baseline val + the estimated passes-to-converge, so .382 continues the resume lineage then grafts. Do NOT fabricate a graft on a non-faithful baseline.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An honest 'graft_deferred -- baseline at val=0.NN' is a COMPLETE verdict; so is an A~=B null."
        graft_deferred:
          principle: "Bare bool: True if the baseline was not faithful enough to graft. Prevents a meaningless graft on a 0.02 baseline being dressed as a result."
        rerank_lift_vs_vote:
          principle: "pass@1 lift from verifier-reranking (if grafted); confirms the executable Sudoku verifier discriminates (the contrast to .379's ARC-grid anti-discrimination)."
        rft_vs_ablation_delta:
          principle: "The de-confounded A-vs-B held-out delta with CI (if grafted): isolates the verifier LABEL's training contribution."
        verifier_value_added:
          principle: "Bare bool: did the verifier graft beat the vote ablation? The headline answer on verifier-as-reward, ONLY meaningful when graft_deferred is False."
        preconditions_checked:
          principle: "Records the baseline checkpoint + CUDA verified; pre-empts silent-missing-resource fabrication."
      ACCEPTANCE GATE:
        - condition: "graft_deferred True with baseline status reported, OR (grafted: rerank_lift + rft_vs_ablation_delta reported with CI)"
          principle: "Either an honest deferral (no faithful baseline yet) or a real graft measurement is decision-grade; a graft on a non-faithful baseline is the anti-pattern."

