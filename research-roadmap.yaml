- id: exp2421-codex-cli-diagnostic-v2
  title: "Phase 0: Codex CLI Infrastructure Diagnostic v2 \u2014 Complexity-Graded Health Check"
  milestone: 2026.05.235
  deliverable: results/experiment_2421_codex_diagnostic_v2.json
  requires_claude: true
  max_turns: 30
  prior_failures:
  - experiment_id: exp2393-codex-cli-diagnostic
    verdict: complete_codex_cli_healthy_232_was_transient_backend_error
    addressed_by: exp2393 in .233 diagnosed the .232 failure as a transient OpenAI backend error that resolved naturally.
      However the SAME pattern recurred in .234 (all 13 tasks failed). This v2 diagnostic runs a complexity-graded health
      check (simple + medium + complex) to detect whether the backend issue affects all task complexity levels or only complex
      tasks. Also checks Codex CLI version and quota status.
    retire_if_same_verdict: false
  prompt: "CONTEXT: Milestone .234 failed with 0/13 tasks producing artifacts \u2014 all failed with\n\"Codex CLI error: you\
    \ finish the real work inside 10 minutes, that is correct\".\nThis is the SECOND time this pattern has occurred (.232\
    \ was the first, diagnosed in\n.233 as a transient backend error). This diagnostic v2 uses a COMPLEXITY-GRADED test\n\
    to determine:\n  a) Is Codex CLI working at all?\n  b) Is it working for simple tasks but failing for complex ones?\n\
    \  c) What is the reliability threshold?\n\nREQUIRES_CLAUDE JUSTIFICATION: (1) Claude must run Codex to test whether Codex\
    \ works \u2014\na Codex task cannot diagnose Codex's own failure. (2) Requires multi-step orchestration:\nlaunch 3 Codex\
    \ subprocess invocations with increasing complexity, interpret output,\nclassify failure mode, write a structured diagnostic\
    \ artifact. (3) Open-ended judgment:\ninterpreting partial Codex output to distinguish \"transient backend\" from \"capability\n\
    threshold\" is ambiguous and cannot be reduced to deterministic gate checks.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n\
    \     a. Check Codex version: codex --version 2>/dev/null || echo \"codex_not_found\"\n        Record codex_version.\n\
    \     b. Check conductor config for Codex routing:\n        grep -n \"codex\" {project_root}/scripts/research_conductor.py\
    \ | head -20\n\n  1. TEST LEVEL 1 \u2014 Simple (2-sentence math answer):\n     timeout 60 codex exec --color never --model\
    \ gpt-5.5 --ephemeral - <<'EOF'\n     What is 17 + 25? Reply with just the number.\n     EOF\n     Record level1_exit_code,\
    \ level1_stdout_first_100_chars, level1_success (true if\n     exit code 0 AND output contains \"42\").\n\n  2. TEST LEVEL\
    \ 2 \u2014 Medium (read a file, write a JSON artifact):\n     Create /tmp/codex_test_input.txt with content \"Test input:\
    \ EBM verification.\"\n     timeout 120 codex exec --color never --model gpt-5.5 --ephemeral - <<'EOF'\n     Read the\
    \ file /tmp/codex_test_input.txt. Then write a JSON file at\n     /tmp/codex_test_output.json containing {{\"read_content\"\
    : \"<content>\",\n     \"status\": \"ok\", \"experiment\": \"codex_level2_test\"}}.\n     Write the file then say Done.\n\
    \     EOF\n     Record level2_exit_code, level2_success (true if /tmp/codex_test_output.json\n     exists and contains\
    \ \"status\": \"ok\").\n\n  3. TEST LEVEL 3 \u2014 Complex (multi-step Python script + JSON result):\n     timeout 180\
    \ codex exec --color never --model gpt-5.5 --ephemeral - <<'EOF'\n     Write a Python script at /tmp/codex_test_complex.py\
    \ that:\n       1. Imports json, time, random\n       2. Computes random.seed(42); values = [random.random() for _ in\
    \ range(10)]\n       3. Writes {{\"values\": values, \"mean\": sum(values)/len(values), \"status\": \"ok\"}}\n         \
    \ to /tmp/codex_test_complex.json\n       4. Prints \"Done.\"\n     Then run the script: python3 /tmp/codex_test_complex.py\n\
    \     Then read and print the output JSON.\n     EOF\n     Record level3_exit_code, level3_success (true if /tmp/codex_test_complex.json\n\
    \     exists and \"status\" == \"ok\").\n\n  4. Classify failure mode:\n     - If all 3 levels pass: codex_cli_healthy=true,\
    \ complexity_threshold=3\n     - If level1 passes but level2 fails: codex_cli_healthy=false,\n       complexity_threshold=1,\
    \ failure_mode=\"medium_complexity_failure\"\n     - If level1+2 pass but level3 fails: codex_cli_healthy=false,\n   \
    \    complexity_threshold=2, failure_mode=\"complex_task_failure\"\n     - If level1 fails: codex_cli_healthy=false, complexity_threshold=0,\n\
    \       failure_mode=\"complete_backend_failure\"\n\n  5. Failure signature check: look for the exact string \"you finish\
    \ the real work\n     inside 10 minutes, that is correct\" in any level's stdout. If found:\n       failure_signature_matched=true,\
    \ root_cause_hypothesis=\"transient_backend_echo\"\n\n  6. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n\
    \      principle: \"Terminal-prefix required. complete: with codex_cli_healthy boolean.\"\n  - codex_cli_healthy:\n  \
    \    principle: \"True only if ALL 3 levels pass \u2014 conservative gate for downstream tasks.\"\n  - codex_version:\n\
    \      principle: \"Version string for reproducibility / regression detection.\"\n  - complexity_threshold:\n      principle:\
    \ \"Max complexity level (0-3) Codex handles reliably. 3 = fully healthy.\"\n  - failure_mode:\n      principle: \"Classification\
    \ of failure type \u2014 guides future diagnostic efforts.\"\n  - failure_signature_matched:\n      principle: \"True\
    \ if the .232/.234 prompt-echo signature is observed \u2014 confirms recurring pattern.\"\n  - level1_success:\n     \
    \ principle: \"Codex can answer trivial questions \u2014 baseline health check.\"\n  - level2_success:\n      principle:\
    \ \"Codex can read files and write JSON \u2014 conductor-task-level health.\"\n  - level3_success:\n      principle: \"\
    Codex can execute multi-step Python \u2014 full-task-level health.\"\n  - duration_s:\n      principle: \"Guards against\
    \ fabrication.\"\n\nACCEPTANCE GATES:\n  - condition: \"codex_cli_healthy != null\"\n    principle: \"Must produce a definitive\
    \ health boolean \u2014 even false is a valid result.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."
- id: exp2422-hive-full-4verifier-v4
  title: "Phase 1: Full HIVE 4-Verifier Ensemble v4 (Tier 0f+0g+0h+0j) \u2014 Target AUROC > 0.90"
  milestone: 2026.05.235
  deliverable: results/experiment_2422_hive_full_v4.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2408-hive-full-4verifier-v3
    verdict: codex_cli_error_failed
    addressed_by: "exp2408 in .234 failed x3 with Codex CLI error (same backend pattern as .232). exp2421 (Codex diagnostic\
      \ v2) gates this task \u2014 only runs if Codex is confirmed healthy at complexity level 3."
    retire_if_same_verdict: true
  - experiment_id: exp2398-hive-4verifier-ensemble-v2
    verdict: complete_only_3_verifiers_fused
    addressed_by: exp2398 in .233 fused only 3 verifiers (AUROC=0.8539) because Tier 0f (FreqAwareAttn, exp2397) was available
      but not read. This v4 explicitly reads exp2397 artifact and fuses all 4 Tier 0 verifiers with calibrated abstention.
    retire_if_same_verdict: false
  prompt: "CONTEXT: HIVE (arXiv:2604.26139) achieves AUROC=0.9236 via 4-verifier soft-voting.\n.233's HIVE ensemble (exp2398)\
    \ achieved 0.8539 using only 3 verifiers \u2014 Tier 0f\n(FreqAwareAttn, AUROC=0.7045) was available but NOT included.\
    \ .234's attempt\n(exp2408) failed via Codex CLI error. This v4 attempt is gated on the Codex\ndiagnostic confirming healthy\
    \ CLI.\n\nAvailable .233 verifier artifacts:\n  Tier 0f: results/experiment_2397_freq_aware_attn.json (freq_attn_auroc=0.7045)\n\
    \  Tier 0g: results/experiment_2351_semantic_energy_real.json (AUROC=0.6852)\n  Tier 0h: results/experiment_2368_laab_k17.json\
    \ (LaaB logical consistency)\n  Tier 0j: results/experiment_2394_halt_tier0j.json (halt_k19j_auroc=0.8539)\n\nEXISTING\
    \ CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/hive_ensemble.py (from exp2398 if present)\n  {project_root}/python/carnot/verify/freq_aware_attention.py\
    \ (Tier 0f)\n  {project_root}/python/carnot/verify/halt_probe.py (Tier 0j)\n  {project_root}/python/carnot/verify/semantic_energy.py\
    \ (Tier 0g)\n  {project_root}/python/carnot/verify/laab_verifier.py (Tier 0h)\n  {project_root}/results/experiment_2397_freq_aware_attn.json\
    \ (Tier 0f scores)\n  {project_root}/results/experiment_2394_halt_tier0j.json (Tier 0j scores)\n  {project_root}/results/experiment_2398_hive_ensemble.json\
    \ (.233 ensemble baseline)\n\nTASK: Implement HiveEnsembleV4 fusing all 4 Tier 0 verifiers with calibrated abstention.\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. sklearn importable: .venv/bin/python -c \"import sklearn; print(sklearn.__version__)\"\
    \n        If missing: .venv/bin/pip install scikit-learn -q\n     b. Telemetry manifest present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n     c. Count available Tier 0\
    \ verifier modules:\n        .venv/bin/python -c \"\n        count = 0\n        for mod in ['carnot.verify.freq_aware_attention',\
    \ 'carnot.verify.semantic_energy',\n                    'carnot.verify.laab_verifier', 'carnot.verify.halt_probe']:\n\
    \            try: __import__(mod); count += 1; print(f'OK: {{mod}}')\n            except Exception as e: print(f'MISSING:\
    \ {{mod}}: {{e}}')\n        print(f'{{count}} verifiers available')\n        \"\n        If count < 3: write honest_verdict\
    \ blocked_insufficient_verifiers and exit.\n\n  1. Load verifier scores for all 36 telemetry entries used in exp2351:\n\
    \     a. For each of the 4 Tier 0 verifiers, call verify(entry) to get a score.\n     b. Build feature matrix X (n=36,\
    \ d=4) and label vector y (ground truth labels).\n\n  2. Implement HiveEnsembleV4 at python/carnot/verify/hive_ensemble_v4.py:\n\
    \     a. Learn soft-vote weights via LogisticRegression with 5-fold CV\n        (CalibratedClassifierCV for probability\
    \ calibration \u2014 HALT-RAG abstention pattern).\n     b. Calibrated abstention: when ensemble confidence < 0.6 (neither\
    \ P(halluc)\n        nor P(clean) exceeds 0.6), set verdict = \"uncertain\" and score = 0.5.\n     c. AUROC computed on\
    \ ALL 36 examples including uncertain ones.\n\n  3. Compute:\n     - hive_v4_auroc: AUROC on 36 examples\n     - hive_v4_vs_v2_delta:\
    \ hive_v4_auroc - 0.8539 (.233 HIVE v2 baseline)\n     - ensemble_auroc_improved: hive_v4_auroc > 0.8539\n     - abstention_rate:\
    \ fraction flagged \"uncertain\"\n     - n_verifiers_fused: must be 4\n     - verifier_weights: soft-vote weights per\
    \ verifier\n\n  4. Run unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/verify/ -k \"hive_v4\
    \ or hive_ensemble_v4\" -v --no-cov 2>&1 | tail -15\n     Create test if none exists.\n\n  5. Write deliverable.\n\nREQUIRED\
    \ ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with ensemble AUROC.\"\
    \n  - hive_v4_auroc:\n      principle: \"Primary metric. Target > 0.9236 (HIVE peer). Honest result.\"\n  - hive_v4_vs_v2_delta:\n\
    \      principle: \"hive_v4_auroc - 0.8539. Positive = improvement over .233 ensemble.\"\n  - ensemble_auroc_improved:\n\
    \      principle: \"True if hive_v4_auroc > 0.8539 (.233 HIVE v2 baseline). Gate for capstone.\"\n  - n_verifiers_fused:\n\
    \      principle: \"Must be 4 \u2014 all Tier 0 verifiers included.\"\n  - verifier_weights:\n      principle: \"Soft-vote\
    \ weights per verifier \u2014 reproducibility.\"\n  - abstention_rate:\n      principle: \"Fraction of uncertain examples.\
    \ HALT-RAG calibration signal.\"\n  - n_eval_examples:\n      principle: \"Must be 36.\"\n  - random_seed:\n      principle:\
    \ \"Must be 42.\"\n  - duration_s:\n      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n   \
    \   principle: \"Records verifier count, sklearn, telemetry checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"ensemble_auroc_improved\
    \ == true\"\n    principle: \"v4 must beat v2 baseline 0.8539 \u2014 4-verifier fusion improves over 3.\"\n  - condition:\
    \ \"n_verifiers_fused == 4\"\n    principle: \"All 4 Tier 0 verifiers must be fused \u2014 key change vs .233.\"\n\nDo\
    \ NOT push. Do NOT modify scripts/research_conductor.py."
- id: exp2423-hierarchical-logcons-v2
  title: "Phase 1: Hierarchical Alignment LogCons v2 (arXiv:2604.09075) \u2014 Z3 Instruction Hierarchy"
  milestone: 2026.05.235
  deliverable: results/experiment_2423_hierarchical_logcons_v2.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2409-hierarchical-logcons
    verdict: codex_cli_error_failed
    addressed_by: "exp2409 in .234 failed x3 with Codex CLI error. Gated on exp2421 Codex diagnostic \u2014 only runs when\
      \ Codex is confirmed healthy."
    retire_if_same_verdict: true
  prompt: "CONTEXT: Hierarchical Alignment via Logical Consistency (arXiv:2604.09075, April 2026)\nenforces hierarchical instruction\
    \ compliance via Z3 partial-order constraint checking.\nAchieves 91% adherence vs 67% baseline in nested instruction scenarios.\
    \ This is a new\nscope \u2014 no HierarchicalLogCons exists in the codebase. Baseline: FregeLogic AUROC=0.8831.\nNote:\
    \ Also integrate TruncProof grammar grounding (arXiv:2605.13076) as a structural\npre-check for syntactic validity before\
    \ passing claims to Z3.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/fregelogic_hybrid.py (architecture\
    \ reference)\n  {project_root}/python/carnot/verify/nsvif_z3_extractor.py (Z3 encoding reference)\n  {project_root}/results/experiment_2395_fregelogic.json\
    \ (AUROC=0.8831 baseline)\n\nTASK: Implement HierarchicalLogConsVerifier and evaluate on 36 telemetry entries.\n\nCONCRETE\
    \ STEPS:\n  0. PRECONDITIONS:\n     a. z3-solver importable: .venv/bin/python -c \"import z3; print(z3.get_version_string())\"\
    \n        If missing: .venv/bin/pip install z3-solver -q\n     b. Telemetry manifest present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n     c. Inspect telemetry for\
    \ instruction fields:\n        .venv/bin/python -c \"\n        import json\n        with open('{project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl')\
    \ as f:\n            row = json.loads(f.readline())\n        instr_fields = [k for k in row.keys() if any(x in k.lower()\
    \ for x in\n                        ['instruction', 'prompt', 'system', 'task', 'question'])]\n        print('instruction-like\
    \ fields:', instr_fields)\n        \"\n\n  1. Implement HierarchicalLogConsVerifier at python/carnot/verify/hierarchical_logcons.py:\n\
    \     Priority model:\n       Level 0 (highest): system-level constraints (safety, format)\n       Level 1: user-level\
    \ instructions\n       Level 2: task-level requirements\n     TruncProof structural pre-check (arXiv:2605.13076):\n  \
    \     Parse response for structural validity markers (balanced brackets, complete sentences).\n       If structural_valid=False:\
    \ add structural_penalty=0.3 to logcons_score.\n     Consistency check via Z3:\n       Z3 assertion: claimed_level >=\
    \ required_level (higher priority first).\n       If UNSAT: hierarchy_violation=True \u2192 hallucination signal.\n  \
    \   Fallback (when hierarchy not detectable): use FregeLogic's Z3 verification with\n       priority_consistency_bonus\
    \ based on sentence-level logical flow.\n     Output: logcons_score, hierarchy_violation, priority_level_used.\n\n  2.\
    \ Evaluate on 36 entries (same split as exp2351):\n     logcons_auroc, logcons_vs_fregelogic_delta (baseline 0.8831),\n\
    \     hierarchy_violation_rate.\n\n  3. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/verify/\
    \ -k \"logcons\" -v --no-cov 2>&1 | tail -15\n\n  4. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n\
    \      principle: \"Terminal-prefix required.\"\n  - logcons_auroc:\n      principle: \"Primary metric. Compare with FregeLogic\
    \ 0.8831. Honest result.\"\n  - logcons_vs_fregelogic_delta:\n      principle: \"LogCons - FregeLogic delta. Positive\
    \ = improvement.\"\n  - hierarchy_violation_rate:\n      principle: \"Fraction of examples with detected hierarchy violations.\"\
    \n  - z3_encoding_used:\n      principle: \"Whether Z3 partial-order was used or fallback.\"\n  - truncproof_structural_checks:\n\
    \      principle: \"Number of examples where structural pre-check fired.\"\n  - n_eval_examples:\n      principle: \"\
    Must be 36.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n      principle: \"Guards against\
    \ fabrication.\"\n  - preconditions_checked:\n      principle: \"Records z3, telemetry, instruction-field checks.\"\n\n\
    ACCEPTANCE GATES:\n  - condition: \"logcons_auroc != null AND n_eval_examples >= 30\"\n    principle: \"Must produce valid\
    \ AUROC on sufficient data.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."
- id: exp2424-halt-rag-nli-v2
  title: "Phase 1: HALT-RAG Calibrated NLI Ensemble v2 (arXiv:2509.07475) \u2014 Precision via Abstention"
  milestone: 2026.05.235
  deliverable: results/experiment_2424_halt_rag_nli_v2.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2410-halt-rag-nli-ensemble
    verdict: codex_cli_error_failed
    addressed_by: "exp2410 in .234 failed x3 with Codex CLI error. Gated on exp2421 Codex diagnostic \u2014 only runs when\
      \ Codex is confirmed healthy."
    retire_if_same_verdict: true
  prompt: "CONTEXT: HALT-RAG (arXiv:2509.07475) combines frozen NLI model ensembles with\nfeature-based abstention for RAG\
    \ hallucination detection. When ensemble confidence\n< threshold, system abstains rather than making a low-confidence\
    \ prediction.\nThis improves calibration and AUROC by removing lowest-confidence (highest-noise)\nexamples from the scored\
    \ set.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/nsvif_z3_extractor.py (logical consistency)\n\
    \  {project_root}/python/carnot/verify/semantic_energy.py (logit-based score)\n  {project_root}/results/experiment_2395_fregelogic.json\
    \ (AUROC=0.8831 baseline)\n\nTASK: Implement HaltRagNliDetector v2 with calibrated abstention. Evaluate on 36 entries.\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Telemetry manifest present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n     b. sklearn importable: .venv/bin/python\
    \ -c \"import sklearn; print(sklearn.__version__)\"\n     c. scipy importable: .venv/bin/python -c \"import scipy; print(scipy.__version__)\"\
    \n\n  1. Implement HaltRagNliDetector at python/carnot/verify/halt_rag_nli.py:\n     NLI proxy (without pretrained NLI\
    \ model):\n       Signal 1: SemanticEnergy score (logit variance proxy)\n       Signal 2: FreqAwareAttn score (stopword-frequency\
    \ proxy)\n       Signal 3: HALT probe score (logprob kurtosis proxy)\n       Ensemble via CalibratedClassifierCV (sklearn)\
    \ for probability calibration.\n     Abstention threshold: if max(P(halluc), P(clean)) < 0.65, abstain.\n     Output:\
    \ halt_rag_score, abstained (bool), confidence, nli_signals_used.\n\n  2. Evaluate on 36 entries:\n     halt_rag_auroc_full:\
    \ AUROC including abstained examples (score=0.5).\n     halt_rag_auroc_confident: AUROC on non-abstained examples only.\n\
