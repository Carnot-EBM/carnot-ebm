  title: 'Exp 608: NUP Probe v6 — CAPO Calibration-Aware Retrain on Live Corpus (RETRO-049)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-049 —\
    \ NUP Probe v5 (Exp 599) achieved AUC=0.739, below the 0.80 deployment threshold\
    \ for Tier 0c. The probe must cross 0.80 to be wired into the production cascade.\
    \ Strategy: retrain on the expanded fover_corpus_v4 (from Exps 578/579/602) AND\
    \ apply CAPO calibration-aware training (arXiv 2604.12632) — add a calibration\
    \ loss term that penalizes overconfident predictions. This prevents the AUC=1.0\
    \ overfitting pattern seen in JEPA v11 while maximizing discrimination.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/nup_probe_v4.py (or nup_probe.py) — NUP Probe v4 (AUC=1.0\
    \ synthetic)\n- results/experiment_523_nup_probe_v4.json — v4 architecture\n- results/experiment_599_vivado_grpo_nup.json\
    \ — nup_v5_auc=0.739\n- results/nup_probe_v5.safetensors (if exists) — v5 weights\n\
    - results/fover_corpus_v4.json (else live_pairs_578.json + 579 + 602)\n\nTASK:\
    \ Retrain NUP Probe v6 with CAPO calibration loss on expanded live corpus.\n1.\
    \ Read CLAUDE.md spec-first workflow.\n2. Add REQ-VERIFY-140 (NUP Probe v6:\
    \ CAPO calibration-aware retrain on live corpus v4), REQ-VERIFY-141 (AUC-surrogate\
    \ calibration loss per arXiv 2604.12632), SCENARIO-VERIFY-170/171/172 to spec.\n\
    3. Create python/carnot/pipeline/capo_calibration.py:\n   a. CAPOCalibrationLoss\
    \ class:\n      - __init__(self, lambda_cal: float = 0.1).\n      - compute_loss(self,\
    \ scores: jnp.ndarray, labels: jnp.ndarray) -> float:\n          * Contrastive\
    \ margin loss: sum_i max(0, margin - (score_incorrect_i - score_correct_i)).\n\
    \          * Calibration loss (AUC surrogate): Wilcoxon-Mann-Whitney U statistic\
    \ approximation:\n            for each (correct, incorrect) pair: calibration_loss\
    \ += (score_correct - score_incorrect + 0.5)^2 when |score_correct - score_incorrect|\
    \ < 0.3.\n          * total_loss = margin_loss + lambda_cal * calibration_loss.\n\
    \          * The calibration term penalizes extreme confidence gaps that signal overfitting.\n\
    \   b. Export CAPOCalibrationLoss from carnot.pipeline.__init__.\n4. Write scripts/experiment_608_nup_probe_v6.py:\n\
    \   a. apply_env_autofix() FIRST; from python.carnot.pipeline.live_assertion\
    \ import assert_live_or_ci_skip; assert_live_or_ci_skip().\n   b. ExperimentTimeoutWatchdog(608,\
    \ timeout_minutes=40).\n   c. ExperimentTemplate(608, 'NUP Probe v6 CAPO Retrain',\n\
    \      'results/experiment_608_nup_probe_v6.json', requires_gpu=False).\n   d. Load\
