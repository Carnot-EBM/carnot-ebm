          - "full_manifest_coverage_achieved" if full_coverage AND n_excluded_total >= 27
          - "partial_coverage_remaining_sites" if NOT full_coverage (some sites unguarded)
          - "manifest_updated_coverage_unknown" if patch applied but coverage_pct uncalculated
       d. artifact: total_dequeue_sites, guarded_sites_before_patch, guarded_sites_after_patch,
