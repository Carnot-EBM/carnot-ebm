- id: exp1200-online-constraint-reweighting-v2-addition
  milestone: 2026.04.93
  deliverable: results/experiment_1200_online_constraint_reweighting_v2_addition.json
  title: "Self-Learning Tier 1 v2 — Constraint ADDITION from Memory Patterns (Not Just Reweighting)"
  agent_type: claude
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 30
  priority: high
  requires_gpu: false
  prompt: |
    CONTEXT:
    Research-program.md Tier 1 (Online Constraint Learning) is the simplest and most
    immediate self-learning mechanism: track which constraints fire on wrong responses,
    upweight constraints that catch real errors.

    Exp 134 showed that precision-based REWEIGHTING doesn't improve accuracy: the system
    tracked which constraints fired and reweighted them, but accuracy stayed flat
    (fixed=adaptive across 500 questions). The root cause: the constraint SET was fixed.
    Reweighting existing constraints doesn't help if the right constraint isn't in the set.

    The fix (from research-program.md): constraint ADDITION. When memory detects that
    "arithmetic carry errors occur in 60% of wrong responses," ADD a carry-check constraint
    to the active constraint set — don't just upweight the existing arithmetic constraint
    (which already fires on carry errors but with insufficient specificity).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/extract.py (ConstraintExtractor, existing constraint types)
    - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline — constraint tracking)
    - python/carnot/inference/constraint_models.py (ConstraintStateMachine from Exp 125)

    TASK:
    1. Read the ConstraintStateMachine implementation. Understand how it tracks constraint
       firing patterns across queries within a session.

    2. Implement a ConstraintAdditionAgent that:
       a. Observes ConstraintStateMachine state after each verification
       b. Detects pattern: if constraint X fires in >60% of wrong responses but <20% of
          correct ones (high precision pattern), ADD a new specialized constraint Y derived
          from X's firing context (e.g., if arithmetic[+] fires often → add carry-check-digit)
       c. The new constraint Y is added to VerifyRepairPipeline's active constraint list
       d. After N queries (e.g., N=50), evaluate: does the added constraint improve precision?

    3. Test on 100 FoVer corpus samples (50 as learning set, 50 as holdout):
       a. Learning phase (50 samples): run Tier 1 with constraint addition enabled
          Record: which constraints were added, how many additions
       b. Holdout evaluation (50 samples): run with and without learned additions
          Measure: precision_before, precision_after, false_positive_rate change

    4. Compare vs Exp 134's reweighting-only approach:
       - Exp 134: accuracy flat (reweighting = no improvement)
       - This experiment: does constraint ADDITION give any lift?

    5. Write results artifact.

