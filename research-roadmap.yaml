  title: 'Exp 480: Harness DualGPURunner Enforcement — wire cuda:1 into all dual-model benchmarks'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: GPU 1 (24GB RTX\
    \ 3090) has been at 0% utilization for three consecutive milestones. DualGPURunner\
