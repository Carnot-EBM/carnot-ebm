- id: exp511-amd-xdna-npu-probe
  milestone: 2026.04.38
  deliverable: results/experiment_511_amd_npu_probe.json
  title: 'Exp 511: AMD XDNA NPU NUP Probe Inference — first NPU acceleration of Carnot component (arXiv 2504.03083)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2504.03083\
    \ (April 2025) demonstrates LLM fine-tuning on AMD Ryzen AI XDNA NPU via the\
    \ IRON tool-flow. The AMD Ryzen AI NPU on this machine is unused: zero NPU\
    \ inference has ever run in Carnot. NUP Probe v3 (Exp 507) computes per-token\
    \ softmax entropy over vocabulary at each generation step — this is pure\
    \ parallel arithmetic (50k softmax per token) that is NPU-native. If NPU\
    \ entropy computation latency is < 5ms/token, it can pipeline with LLM\
    \ generation on GPU — enabling zero-overhead Tier 0c filtering at inference\
    \ speed. The experiment attempts NPU deployment via ONNX Runtime + VitisAI\
    \ backend. If VitisAI is not installed, emit honest_verdict='npu_not_available'\
    \ with step-by-step setup instructions — do NOT fail silently. Self-contained:\
    \ no GPU required.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/nup_probe_v3.py\
    \ — CLAPFeatureExtractor, NUPProbeV3 (Exp 507)\n- python/carnot/samplers/backend.py\
    \ — SamplerBackend protocol (hardware abstraction pattern)\n- python/carnot/pipeline/env_autofix.py\
    \ — apply_env_autofix()\n- python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\n\
    - research-hardware-wishlist.md — AMD XDNA NPU section\n\nTASK: Implement NPUEntropyProbe\
    \ and benchmark latency vs CPU.\n1. Read CLAUDE.md spec-first workflow.\n2.\
    \ Call apply_env_autofix() FIRST.\n3. Add REQ-INFRA-058 (NPUEntropyProbe exports\
    \ per-token entropy computation to ONNX and loads via onnxruntime VitisAI\
    \ execution provider), REQ-INFRA-059 (NPUEntropyProbe.benchmark() measures\
    \ latency in ms/token on NPU vs CPU baseline), REQ-INFRA-060 (NPUEntropyProbe\
    \ emits honest_verdict='npu_not_available' with setup_instructions when VitisAI\
    \ EP is not installed), SCENARIO-INFRA-067/068/069 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - NPUBenchmarkResult(npu_latency_ms: float\
    \ | None, cpu_latency_ms: float,\n     npu_available: bool, speedup_ratio: float\
    \ | None):\n     - npu_viable: bool (npu_available and speedup_ratio >= 2.0)\n\
    \     - to_dict(): dict\n   - NPUEntropyProbe(seq_len: int = 64, vocab_size:\
    \ int = 50000):\n     - export_onnx(path: str) -> bool: export softmax entropy\
    \ op to ONNX\n     - load_vitisai(onnx_path: str) -> bool: load via VitisAI EP\n\
    \     - compute_entropy(activations: np.ndarray) -> np.ndarray (per-token entropy)\n\
    \     - benchmark(n_trials: int = 100) -> NPUBenchmarkResult\n   - Test: NPUBenchmarkResult.npu_viable=False\
    \ when npu_available=False\n   - Test: NPUBenchmarkResult.speedup_ratio=None\
    \ when npu_available=False\n   - Test: export_onnx creates file at given path\n\
    5. Implement python/carnot/pipeline/npu_entropy_probe.py with NPUEntropyProbe\
    \ + NPUBenchmarkResult.\n   CI stub: if onnxruntime.get_device() != 'VitisAI',\
    \ return NPUBenchmarkResult(npu_available=False, npu_latency_ms=None,\
    \ cpu_latency_ms=<measured>, speedup_ratio=None).\n   Verbose docstring: WHY\
    \ NPU for entropy (per-token entropy = softmax(logits) + H(p) = sum(-p*log(p));\
    \ this is O(vocab_size) = 50k floating-point ops per token; on GPU it's a single\
    \ kernel; on NPU the spatial array of AI Engines can compute it in a single\
    \ pass across the vocabulary dimension; if NPU latency < 5ms/token and LLM\
    \ generates at 20-100 tokens/sec (5-50ms/token), entropy probe runs ahead of\
    \ generation and adds zero latency to the pipeline — Tier 0c becomes truly\
    \ zero-overhead).\n   Export NPUEntropyProbe, NPUBenchmarkResult from\
    \ carnot.pipeline.__init__.\n6. Write scripts/experiment_511_amd_npu_probe.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(511, timeout_minutes=25)\
    \ as context manager\n   c. ExperimentTemplate(511, 'AMD XDNA NPU Probe',\n \
    \     'results/experiment_511_amd_npu_probe.json')\n   d. DeliverableGuard('results/experiment_511_amd_npu_probe.json')\n\
    \   e. NPUEntropyProbe(seq_len=64, vocab_size=50000)\n   f. export_onnx('results/npu_entropy_probe.onnx')\n\
    \   g. load_vitisai('results/npu_entropy_probe.onnx')\n   h. result = probe.benchmark(n_trials=100)\n\
    \   i. Build artifact: schema='carnot.npu_entropy_probe.v1'\n      npu_available=result.npu_available\n\
    \      npu_latency_ms=result.npu_latency_ms\n      cpu_latency_ms=result.cpu_latency_ms\n\
    \      speedup_ratio=result.speedup_ratio\n      npu_viable=result.npu_viable\n\
    \      setup_instructions=<str if not npu_available else None>\n      honest_verdict='npu_viable'\
    \ if result.npu_viable\n        else 'npu_measured_no_speedup' if result.npu_available\n\
    \        else 'npu_not_available'\n   j. Call tmpl.assert_deliverable_written()\
    \ as FINAL LINE\n   k. Output: results/experiment_511_amd_npu_probe.json\n7.\
    \ Write tests/python/test_npu_entropy_probe.py (100% coverage on npu_entropy_probe.py).\n\
    8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n9. Reconcile: update\
