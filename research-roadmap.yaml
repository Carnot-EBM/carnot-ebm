- id: exp573-energy-per-token-eorm-calibration
  milestone: 2026.04.43
  deliverable: results/experiment_573_energy_per_token_calibration.json
  title: 'Exp 573: Energy-per-Token EORM Hardware Calibration (arXiv 2603.20224)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2603.20224\
    \ (filed in research-references.md, March 2026) shows that hardware-measured energy-per-token\
    \ (joules/token via RAPL or nvml) correlates with reasoning difficulty — hard steps\
    \ (long attention, large activations) cost 3-8x more hardware energy than easy\
    \ steps. Carnot's EORM energy scores are learned proxies for reasoning quality.\
    \ Hypothesis: hardware energy and EORM energy correlate, because hard reasoning\
    \ steps (where EORM should be high) also require more compute. If r > 0.5, hardware\
    \ energy is a FREE calibration signal for EORM training — no labeling needed,\
    \ just a power meter. AMD Ryzen AI 9 HX 370 has RAPL (Running Average Power Limit)\
    \ accessible via /sys/class/powercap/intel-rapl or pyRAPL. CPU-only.\n\nEXISTING\
    \ CODE TO READ FIRST:\n- python/carnot/models/eorm_model.py — EORMModel.score()\
    \ (what EORM energy looks like)\n- python/carnot/pipeline/fover_annotator.py\
    \ — FOVERAnnotator (step-by-step CoT processing)\n- results/fover_corpus_v2.json\
    \ — 132-pair corpus (use for EORM energy computation)\n\nTASK: Measure correlation\
    \ between hardware power draw and EORM energy during inference.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Add REQ-LEARN-054 (hardware energy as EORM calibration\
    \ signal: RAPL power trace correlation), SCENARIO-LEARN-087/088/089 to autoresearch/spec.md.\n\
    3. Create python/carnot/pipeline/hardware_energy_probe.py:\n   a. HardwareEnergyReading\
    \ dataclass: timestamp_ns (int), joules (float), source (str: 'rapl'/'nvml'/'mock').\n\
    \   b. HardwareEnergyProbe class:\n      - __init__(self)\n      - _try_rapl()\
    \ -> float | None: read /sys/class/powercap/intel-rapl:0/energy_uj (Linux RAPL);\
    \ return joules or None if unavailable.\n      - _try_pyrapl() -> float | None:\
    \ try import pyRAPL; if available, read package energy.\n      - read() -> HardwareEnergyReading:\
    \ try RAPL → pyRAPL → mock(0.0) with source label.\n      - measure_segment(fn:\
    \ callable) -> tuple[any, float]: call read() before and after fn(); return (result,\
    \ delta_joules).\n   c. EORMHardwareCorrelation dataclass: n_steps (int), pearson_r\
    \ (float), p_value (float), hardware_energies (list[float]), eorm_energies (list[float]),\
    \ calibration_viable (bool).\n   d. compute_eorm_hardware_correlation(probe: HardwareEnergyProbe,\
    \ eorm_model, cot_steps: list[str]) -> EORMHardwareCorrelation:\n      - For each\
    \ step: measure hardware energy during EORM scoring + record EORM score.\n    \
    \  - Compute Pearson r and p-value using scipy.stats.pearsonr.\n      - calibration_viable\
    \ = r > 0.5 AND p_value < 0.05.\n   e. Export HardwareEnergyProbe, EORMHardwareCorrelation\
    \ from carnot.pipeline.__init__.\n4. Write scripts/experiment_573_energy_per_token_calibration.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. ExperimentTimeoutWatchdog(573, timeout_minutes=20).\n\
    \   c. ExperimentTemplate(573, 'Energy-per-Token EORM Calibration',\n      'results/experiment_573_energy_per_token_calibration.json',\
    \ requires_gpu=False).\n   d. Load 30 CoT steps from fover_corpus_v2.json (15\
    \ correct, 15 incorrect).\n   e. Instantiate HardwareEnergyProbe.\n   f. Load\
    \ EORM model (from results/jepa_predictor_v10.safetensors if available, else fresh\
    \ init).\n   g. Compute EORMHardwareCorrelation on all 30 steps.\n   h. If probe.source=='mock':\
    \ note 'RAPL_unavailable' in artifact.\n   i. Build artifact: schema='carnot.energy_per_token_calibration.v1',\n\
    \      n_steps=30, hardware_source=<str>,\n      pearson_r=<float>, p_value=<float>,\n\
    \      calibration_viable=<bool>,\n      rapl_available=<hardware_source != 'mock'>,\n\
    \      honest_verdict='calibration_viable' if calibration_viable else 'rapl_unavailable'\
    \ if not rapl_available else 'correlation_too_low'.\n   j. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_hardware_energy_probe.py (100% coverage\
    \ on hardware_energy_probe.py):\n   a. Test _try_rapl() returns None on CI (file\
    \ not present).\n   b. Test read() returns mock source when RAPL unavailable.\n\
    \   c. Test measure_segment() returns (result, delta_joules) tuple.\n   d. 100%\
    \ coverage.\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile:\
    \ _bmad/traceability.md, ops/conductor-log.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

