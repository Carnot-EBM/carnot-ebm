- id: exp1187-latent-grpo-energy-reward
  milestone: 2026.04.92
  deliverable: results/experiment_1187_latent_grpo_energy_reward.json
  title: "Latent-GRPO Energy Reward Integration — Invalid-Sample Masking + One-Sided Noise (arXiv 2604.27998)"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 30
  priority: medium
  requires_gpu: true
  prompt: |
    CONTEXT:
    arXiv 2604.27998 (Latent-GRPO) proposes two improvements to standard GRPO training:
    1. Invalid-sample masking: filter out rollouts where the reward signal is undefined or
       degenerate (e.g., all-same logprob distribution, empty response, verifier crash)
       BEFORE computing the GRPO policy gradient update. Standard GRPO includes invalid
       rollouts with negative rewards, which corrupts the gradient.
    2. One-sided noise injection: add noise only to the positive-reward side to prevent
       reward hacking (the model learns to generate nonsense that avoids the negative-reward
       boundary rather than learning to generate correct answers).

    Latent-GRPO achieved +7.86pp on low-difficulty FoVer questions vs standard GRPO.
    Carnot can apply the same masking to invalid energy verifier outputs (degenerate energy =
    NaN, inf, or E < 0 for all verifiers in the k=5 ensemble).

    EXISTING CODE TO READ FIRST:
    - python/carnot/training/grpo_v4.py (base GRPO implementation to extend)
    - python/carnot/verify/pipeline.py (verifier pipeline, to detect degenerate outputs)
    - results/experiment_1164_grpo_v4_structural_warmup.json (v4 baseline: +10.0pp)
    - data/fover_corpus.jsonl (evaluation corpus; use first 100 low-difficulty pairs)

    TASK:
    1. Implement python/carnot/training/latent_grpo.py with:
       a. mask_invalid_samples(rollouts, energies):
          - A rollout is "invalid" if: energy is NaN or inf, or all k=5 verifiers return
            degenerate energy (all zeros or all same value).
          - Returns: filtered_rollouts (list), mask_rate (float = n_masked / n_total).
       b. one_sided_noise_injection(rollout, noise_scale=0.01):
          - If rollout.reward > 0: add Gaussian noise N(0, noise_scale^2) to reward.
          - If rollout.reward <= 0: no noise (leave negative rewards exact to prevent escape).
       c. LatentGRPOTrainer(base_grpo_trainer) wrapper that applies (a) + (b) before each
          gradient update.

    2. Run evaluation on 100-question low-difficulty FoVer subset:
       - Baseline: standard GRPO v4 (use saved v4 model + eval harness from exp1164)
       - Latent-GRPO: same setup + masking + one-sided noise
       - Compare: latent_grpo_delta_pp vs grpo_v4_baseline on same 100 questions
       - Record: mask_rate (what fraction of rollouts were masked as invalid)

    3. Write tests/python/training/test_latent_grpo.py (coverage of masking + noise functions).

    4. Write results artifact.

    CONCRETE STEPS:
