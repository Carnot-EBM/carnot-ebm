  - id: exp3640-build-factual-corpus-v3-real-evidence-dataset
    prior_failures:
      - experiment_id: exp3625-build-factual-corpus-v3-real-evidence-dataset
        verdict: fail_gemini_cli_quota_exhaustion_crash_never_ran
        addressed_by: "exp3625 (the .333 version) NEVER RAN -- it crashed on the gemini-cli quota-429 wipeout (.js:345500:14), not on any data problem. This re-attempt is routed to codex (requires_codex bypasses GEMINI_FORCE_EXPERIMENTS=1) on a verified-working backend. Identical scientific scope; the blocker was the dead gemini backend and is cleared."
        retire_if_same_verdict: false
      - experiment_id: exp3612-validate-factual-corpus-v2
        verdict: complete_factual_corpus_degenerate_confidence_out_of_band_or_evidence_leaks_facts_row_blocked
        addressed_by: "exp3612 found the existing v2 corpus genuinely DEGENERATE (confidence AUROC 0.4509 < 0.50). Validating v2 is a dead end. This task BUILDS a fresh corpus v3 by FETCHING a real evidence-bearing labeled hallucination dataset (HaluEval QA knowledge / FELM / RAGTruth / Mu-SHROOM) and gates on confidence AUROC in (0.5,0.95) with held-out evidence independent of the label. New data source + headroom gate = a usable corpus, not a re-validation of a degenerate one."
        retire_if_same_verdict: false
    milestone: "2026.06.334"
    title: "Build factual corpus v3 from a REAL evidence-bearing labeled dataset (HaluEval QA knowledge / FELM / RAGTruth / Mu-SHROOM) — confidence AUROC in (0.5,0.95), held-out evidence independent of label, BARE gated fields"
    priority: critical
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # gemini quota exhausted crashed the .333 version (exp3625); codex 0.135.0 verified working; requires_codex bypasses GEMINI_FORCE_EXPERIMENTS=1
    estimated_wall_time_min: 18
    track: evidence
    inference_substrate: aggregation_from_upstream_artifacts
    requires_gpu: false
    deliverable: results/experiment_3640_build_factual_corpus_v3.json
    prompt: |
      CONTEXT: the facts row has been blocked 5x. The existing v2 corpus is genuinely degenerate (exp3612:
      confidence AUROC 0.4509). This task makes the facts apparatus REAL by building a v3 corpus from a real
      evidence-bearing labeled hallucination dataset, where model confidence is an IMPERFECT detector (AUROC in
      (0.5,0.95)) so a grounding verifier has headroom to add value, and where the evidence passage is held-out
      and independent of the label so the grounding verifier cannot leak (the exp3587 'H'-token leak).
      EXISTING CODE TO READ FIRST: results/experiment_3612 (the v2 degeneracy diagnosis) +
      data/realistic_factual_corpus_v2.jsonl (what NOT to reuse) via scripts/summarize_artifact.py;
      research-references.md "HalluSearch / Mu-SHROOM" entries (arXiv:2504.10168) for the recipe;
      scripts/experiment_template.py + cached_sota_pair usage.
      PRECONDITIONS (step 0, check BEFORE building):
        a. Network: `curl -sf -o /dev/null https://huggingface.co/api/datasets`. If down AND no local
           evidence-bearing dataset is on disk -> honest_verdict "complete: blocked_no_evidence_dataset".
        b. At least one of: HaluEval QA split (has `knowledge` evidence + right/hallucinated answer), FELM,
           RAGTruth, or Mu-SHROOM is fetchable or already cached under data/ or ~/.cache/huggingface/.
      CONCRETE STEPS:
        1. Fetch/load a real evidence-bearing labeled dataset. Build data/realistic_factual_corpus_v3.jsonl with
           records {question, answer (the MODEL/candidate answer), is_hallucination (0/1), evidence_passage
           (held-out reference text), model_confidence (sequence logprob or a real confidence signal)}. >= 200
           records, both classes present. REJECT any placeholder tokens (^[RHQ]\d+$) -- those are the toy tokens
           that produced the .330 AUROC=1.0 leak and the v2 degeneracy.
        2. SANITY GATE A (headroom): confidence AUROC on the corpus MUST be in (0.50, 0.95). <=0.50
           (anti-correlated, the v2 failure) or >=0.95 (no headroom) -> report honestly, facts_corpus_validated
           =false, try the next dataset before giving up.
        3. SANITY GATE B (evidence independence): assert evidence_passage is present for BOTH classes and does
           not trivially flag the label (no substring of the label/gold answer leaks via the evidence).
        4. Emit the validated corpus path + class balance with BARE gated fields.
      ANTI-POISON TEST DISCIPLINE (MANDATORY): if you ship a pytest for this script, it MUST parametrize over
      the script's HONEST verdicts (validated / degenerate / blocked) for the synthetic fixtures you construct;
      build fixtures with REAL factual-looking strings (NOT Q1/R1/H1 placeholder tokens the script rejects);
      NEVER hard-assert a single success-verdict string against the real on-disk corpus. A test that fails
      against your own script's honest output poisons the milestone pre-test gate (the .332 exp3612 cascade).
      Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; facts_corpus_validated and facts_corpus_has_evidence
      MUST be stored as BARE top-level booleans, NOT {value,principle} dicts):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "aggregation_from_upstream_artifacts (principle: fetches + validates a labeled dataset; no live LLM generation in the headline path)."
        corpus_path_used:
          principle: "Which corpus the downstream rows must score (v3) -- single source of truth."
        corpus_source:
          principle: "Provenance: DATASET name + split + evidence field + URL -- audit trail back to a real measurement."
        n_examples:
          principle: "Sample-size rigor; >=200 for a percentage-point AUROC claim downstream."
        n_hallucinated:
          principle: "Class balance -- an AUROC on a 99/1 split is uninformative."
        n_correct:
          principle: "Class balance."
        confidence_baseline_auroc_on_corpus:
          principle: "THE realism gate: must be in (0.5,0.95) so verifiers have headroom AND confidence is not anti-correlated noise (the v2 0.4509 failure)."
        evidence_independent_of_label:
          principle: "True iff the evidence passage does not leak the gold answer/label -- prevents the exp3587 AUROC=1.0 leak from recurring."
        placeholder_tokens_rejected:
          principle: "Confirms the toy R1/H1/Q1 tokens that produced the .330 leak and the v2 degeneracy are absent."
        facts_corpus_has_evidence:
          principle: "BARE bool. True iff every record carries an independent held-out evidence passage. STORE AS BARE true/false (gates the grounding-verifier path in exp3642)."
        facts_corpus_validated:
          principle: "BARE bool. True iff confidence AUROC in (0.5,0.95) AND evidence_independent_of_label AND no placeholder tokens. STORE AS BARE true/false."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection across replications."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "n_examples >= 200 AND facts_corpus_has_evidence == true AND facts_corpus_validated == true"
          principle: "A fair factual corpus is defined by independent held-out evidence AND confidence headroom; without both, the downstream grounding test repeats the .329-.333 contamination."
      TERMINAL VERDICTS: "complete: factual_corpus_v3_built_real_evidence_dataset_confidence_headroom_confirmed_bare_fields_emitted" /
      "complete: factual_corpus_v3_built_but_confidence_out_of_band_facts_row_degenerate" /
      "complete: blocked_no_evidence_dataset"
      Run: cd {project_root} && python scripts/experiment_3640_build_factual_corpus_v3.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

