- id: exp2504-curry-howard-formal-verification-tier0r
  title: 'Phase 5: Curry-Howard Formal Verification Tier 0r (arXiv:2510.01069 ICLR 2026) -- Soft Typed Proof-Path Verifier'
  milestone: 2026.05.241
  deliverable: results/experiment_2504_curry_howard_tier0r.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  prior_failures:
  - experiment_id: exp2451-fr11-soundness-completeness-v5
    verdict: 'complete: fr11_v5_passed=True'
    addressed_by: "exp2451 was an FR-11 NSVIF soundness/completeness tracking task (NLP-based
      logical extraction). exp2504 implements a DIFFERENT formal method from arXiv:2510.01069
      (ICLR 2026): Curry-Howard soft constraint verification using types-as-propositions to
      check proof-path consistency across reasoning steps. Different formal system (type theory
      vs first-order NLP), different implementation (proof-term type checking vs NLP
      constraint extraction), different verifier class (Tier 0r typed-proof vs Tier 2
      NSVIF-based)."
    retire_if_same_verdict: false
  prompt: "CONTEXT: arXiv:2510.01069 (ICLR 2026) proposes a Curry-Howard framework for LLM
    reasoning verification.\nSoft constraints outperform hard grammar enforcement by 20.9pp on
    GSM8K, MATH, FOLIO benchmarks.\nKey idea: map reasoning steps to proof terms; verify that
    type signatures are consistent across steps.\nA 'soft' type violation assigns a continuous
    penalty (not binary flag), making it compatible with\nCarnot's Fisher conformal ensemble
    (nonconformity score from type-violation degree).\n\nEXISTING CODE TO READ FIRST:\n
    \ {project_root}/python/carnot/verify/ (existing verifier implementations for interface)\n
    \  {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl (first 3 lines
    — check for cot_steps or reasoning_steps fields)\n\nTASK: Implement Tier 0r soft Curry-Howard
    type-violation verifier; evaluate on hallucination corpus.\n\nCONCRETE STEPS:\n  0.
    PRECONDITIONS:\n     a. Python environment:\n        {project_root}/.venv/bin/python -c
    \"import numpy; print(numpy.__version__)\"\n     b. Telemetry manifest present:\n
    \       ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n     c.
    Check for reasoning steps in manifest:\n        {project_root}/.venv/bin/python -c \"\nimport
    json\nwith open('{project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl')
    as f:\n    entry = json.loads(f.readline())\nprint('step_fields:', [k for k in entry.keys()
    if 'step' in k.lower() or 'chain' in k.lower() or 'cot' in k.lower()])\"\n        Record:
    cot_step_field (str or None)\n     Record: preconditions_checked.\n\n  1. Implement a
    minimal SoftCurryHowardVerifier:\n     Core idea: decompose a response into reasoning steps
    (sentence-level or CoT-marked).\n     For each step pair (step_i, step_{i+1}):\n       If
    step_i concludes a quantity X, and step_{i+1} uses X with a different type\n       (e.g.,
    'X is a rate' vs 'X is used as an absolute count') → type violation.\n     Soft violation
    score = count of type mismatches / n_step_pairs (normalized to [0,1])\n     If no CoT
    structure detected, use sentence-level NLP: extract noun phrases and check\n     whether
    the same noun phrase is used with contradictory predicates across sentences.\n\n  2. Apply
    SoftCurryHowardVerifier to the 36 telemetry corpus examples:\n     For each example:
    score = verifier.score(response)\n     Record: {idx, label, curry_howard_score}\n\n  3.
    Evaluate as a verifier:\n     from sklearn.metrics import roc_auc_score\n     tier0r_auroc
    = roc_auc_score(labels, curry_howard_scores)\n     tier0r_viable = (tier0r_auroc > 0.65)\n
    \    Save score array to results/experiment_2504_tier0r_scores.json for future ensemble use.\n\n
    \  4. Write SoftCurryHowardVerifier to python/carnot/verify/curry_howard.py.\n     Write
    deliverable. Validate JSON before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - tier0r_auroc:\n
    \     principle: \"AUROC of soft Curry-Howard type-violation score as hallucination verifier.
    > 0.65 = viable Tier 0r candidate for future ensemble integration.\"\n  - tier0r_viable:\n
    \     principle: \"True if tier0r_auroc > 0.65. Gates inclusion in the group-conditional
    ensemble in .242+ milestones.\"\n  - n_type_violations_detected:\n      principle:
    \"Total type mismatches found across 36 examples. 0 = verifier never fired (likely no CoT
    structure in telemetry).\"\n  - honest_verdict:\n      principle: \"Terminal-prefix required.
    complete: with tier0r_auroc and tier0r_viable.\"\n\nACCEPTANCE GATES:\n  - condition:
    \"tier0r_auroc > 0.0\"\n    principle: \"Ensures the verifier ran and computed scores (not
    all-zero degeneracy).\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

