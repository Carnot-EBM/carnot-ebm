    Exp1401 showed EBM-CoT hinge-only training improves calibration AUROC by
    about +0.186 but worsens paraphrase energy variance. arXiv:2604.07172
    reports that scalar temperature scaling can improve semantic uncertainty
    calibration and discrimination. Apply a post-hoc T* calibration to EBM-CoT
    scores and preserve AUROC. Use {project_root} as the project root and {date}
    as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - results/experiment_1401_ebm_cot_v2_hinge_only.json
    - research-references.md
    - python/carnot/models/
    - python/carnot/verify/
    - openspec/capabilities/verification/spec.md

    TASK:
    Add or run a post-hoc temperature calibration pass for EBM-CoT scores,
    measuring variance before and after and verifying AUROC is preserved.

    REQUIRED ARTIFACT FIELDS:
    - status
    - temperature_scaling_applied
    - best_temperature
    - calibration_auroc_delta_before
    - calibration_auroc_delta_after
    - paraphrase_energy_variance_before_temp_scaling
    - paraphrase_energy_variance_after_temp_scaling
    - variance_worsened
    - auroc_preserved
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1416_ebm_cot_v3_temperature_calibration.json immediately with status="in_progress".
    2. Reuse exp1401 scores or regenerate only the minimal deterministic dataset needed.
    3. Fit scalar T* on a validation split, not the test split.
    4. Report AUROC before and after temperature scaling.
    5. Report paraphrase energy variance before and after.
    6. Set variance_worsened=false only if after <= before within measured tolerance.
    7. Preserve exp1401's positive AUROC delta; set auroc_preserved accordingly.
    8. Write all required fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1416_ebm_cot_v3_temperature_calibration.json')); print(d.get('temperature_scaling_applied'), d.get('variance_worsened'), d.get('auroc_preserved'), d.get('honest_verdict'))"
