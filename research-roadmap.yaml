    Exp6813 compares selective exact arbitration with flat retry on authentic frozen proposals. A
    fresh implementation must test authority, safety, utility, and false-intervention claims. The
    completion gate is independent of the effect sign.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6811_operational_obligation_automaton_v3.json
