  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-028 opened in milestone 2026.04.33:\
    \ Exp 439 reported Gemma4-E4B-it baseline accuracy of 0.0% on GSM8K. Root cause: llama.cpp\
    \ tokenizer bug (GitHub issue llama.cpp#21516) causes the model to emit infinite <unused8>\
    \ tokens (token ID 14) instead of valid text. The model NEVER ran — the 0% result is a false\
    \ negative. Published Gemma4 accuracy on GSM8K is 75-80%. The fix: use HuggingFace transformers\
    \ library directly (AutoModelForCausalLM.from_pretrained) instead of any llama.cpp backend.\n\
    \nThis is a CPU-diagnostic experiment. It verifies the loader fix, NOT a full benchmark run.\
    \ GPU is required only if transformers loads the model to GPU automatically — the experiment\
    \ itself uses 10 GSM8K questions to verify the model produces valid text.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST)\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog\n\
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu() pattern\n\
    - results/experiment_439_live_precision_micro.json — RETRO-028 evidence (0% accuracy)\n\
    - ops/known-issues.md — RETRO-028 entry\n\n\
    TASK: Implement GemmaTransformersLoader and verify Gemma4-E4B-it produces valid text.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST (before any import).\n\
    3. Add REQ-LOADER-001 (GemmaTransformersLoader uses HuggingFace transformers,\n\
    \   not llama.cpp, for Gemma4 models), REQ-LOADER-002 (loader validates that generated\n\
    \   text does not consist entirely of <unused> tokens), SCENARIO-LOADER-001/002 to\n\
    \   openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - GemmaTransformersLoader(model_id: str, device: str = 'auto'):\n\
    \     - load() -> None: loads model via AutoModelForCausalLM.from_pretrained\n\
    \     - generate(prompt: str, max_new_tokens: int = 512) -> str\n\
    \     - is_valid_output(text: str) -> bool: returns False if text is all <unused> tokens\n\
    \   - Test: is_valid_output('<unused><unused><unused>') returns False\n\
    \   - Test: is_valid_output('The answer is 42.') returns True\n\
    \   - Test: loader raises ValueError if model_id does not contain 'gemma' or 'Gemma'\n\
    5. Implement python/carnot/pipeline/gemma_loader.py.\n\
