  - id: exp362-saver-multi-turn-verification
    milestone: "2026.05.20"
    deliverable: python/carnot/pipeline/saver_verifier.py
    title: "Exp 362: SAVeR multi-turn verification — constraint state propagation across agent steps (arXiv 2604.08401)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: SAVeR (arXiv 2604.08401) implements Self-Auditing Verification and Repair for
      multi-turn agent reasoning. The two-turn structure: (1) agent proposes action with
      chain-of-thought, (2) auditor checks action against accumulated constraint state from
      previous steps, (3) if constraint violated: repair and recommit before proceeding.
      This is research-program.md Goal #4 (multi-turn agentic verification).

      Carnot's ConstraintStateMachine (Exp 125) and SessionMemory (Exp 345) provide the
      constraint state persistence. The missing piece is the auditor-before-commit loop:
      a wrapper that intercepts each agent action, runs VerifyRepairPipeline on the action's
      reasoning, and requires the action to satisfy accumulated constraints before it can
      proceed to the next step.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
      - python/carnot/pipeline/session_memory.py — SessionMemory (Exp 345)
      - python/carnot/pipeline/constraint_template_library.py — ConstraintTemplateLibrary (Exp 343)
      - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline (Exp 360)

      TASK: Implement SAVeR-style multi-turn verification wrapper.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-AGENT-001 (multi-turn constraint state propagation), REQ-AGENT-002 (commit-gate),
         SCENARIO-AGENT-001/002/003 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - AgentStep: dataclass (step_id, question, proposed_action, action_cot,
           constraint_violations, repaired_action, committed: bool, repair_attempts)
         - ConstraintState: dataclass (step_id, active_constraints, accumulated_facts,
           facts_established, model_id)
         - SAVeRVerifier(pipeline, max_repair_attempts=3)
         - SAVeRVerifier.propose_step(question, action_cot, constraint_state)
           → (AgentStep, ConstraintState)
         - SAVeRVerifier.propose_step: runs VerifyRepairPipeline on action_cot;
           if violations: repair and update constraint_state; if still failing after
           max_repair_attempts: commit=False (action blocked)
         - SAVeRVerifier.run_chain(steps, initial_state) → list[AgentStep]
           Runs multi-step reasoning, each step gated by accumulated constraint state
         - SAVeRVerifier.compute_faithfulness(steps) → float: fraction of steps committed
         - CI-safe: when pipeline is None, use stub that approves all steps
         - build_saver_artifact(steps, faithfulness): schema="carnot.saver_verifier.v1"
      4. Implement python/carnot/pipeline/saver_verifier.py:
         - AgentStep, ConstraintState, SAVeRVerifier
         - Export from python/carnot/pipeline/__init__.py
      5. Write scripts/experiment_362_saver_multi_turn.py using ExperimentTemplate(362):
         a. Define 5 multi-step reasoning chains (math word problems requiring 3-5 steps each)
         b. Instantiate SAVeRVerifier with ThreeTierPipeline (or CI-safe stub)
         c. Run each chain with SAVeRVerifier.run_chain()
         d. Measure: faithfulness (% steps committed), n_repairs_per_chain,
            n_blocked_steps (violated even after max_repair_attempts)
         e. Compare: chain accuracy with SAVeR vs without SAVeR (unchecked)
         f. Build artifact: schema="carnot.saver_verifier.v1", n_chains, mean_faithfulness,
            mean_repairs_per_chain, n_blocked_steps, accuracy_with_saver,
            accuracy_without_saver, improvement_delta
