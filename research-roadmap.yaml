      CONTEXT. exp3833 (results/experiment_3833_ldt_gap_ensemble_as_sound_lattice.json) measured the
      k=15 ensemble as an LDT-style abstraction-lattice operator and landed LATTICE_VIABLE:
      informativeness_at_soundness_0_99 = 0.591 (removes 59% of wrong candidates at <1% false-elim),
      false_elimination 0.007. BUT ensemble_vs_random_soundness_margin = 0.010 — a razor-thin edge over
      a COUNT-matched random elimination operator. A count-matched random control is WEAK: it ignores
      the score distribution. The sharper question: does the ensemble preferentially SPARE correct
      candidates beyond what a control with the SAME score-distribution (stratified/score-matched
      random elimination) would, with a bootstrap CI on the margin so we know if 0.010 is signal or noise?

      EXISTING CODE TO READ FIRST:
        - results/experiment_3833_ldt_gap_ensemble_as_sound_lattice.json + its script (the soundness/
          informativeness curve method + the count-matched random control — reuse, then EXTEND).
        - data/fover_test_v4.json (the cached candidate set exp3833 used; N=1308).

      CONCRETE STEPS:
        0. PRECONDITIONS: `import carnot.verify` succeeds AND the exp3833 corpus + script reproduce one
           candidate score. Else `blocked_<resource>`, EXIT.
        1. Reproduce exp3833's sound-elimination curve (sanity: informativeness_at_soundness_0_99 ~ 0.59).
        2. Build a SCORE-MATCHED random control: stratify candidates into score bins; the control
           eliminates the SAME number of candidates per bin as the ensemble does, but RANDOMLY within
           each bin. Its soundness at matched per-bin counts is the sharper chance baseline (it has the
           ensemble's score distribution but none of its per-candidate discrimination).
        3. Compute ensemble_vs_score_matched_margin = ensemble soundness - score-matched-control soundness
           at matched elimination, with a BOOTSTRAP CI95 (>=1000 resamples).
        4. Apply the gate -> terminal verdict.

      REQUIRED ARTIFACT FIELDS (each with a `principle` note):
        ensemble_vs_score_matched_margin: { principle: "THE sharpened number — the ensemble's edge over a control that already has its score distribution. Materially >0 => real per-candidate discrimination (genuine lattice power); ~0 => exp3833's 0.010 was the score distribution, not deductive power." }
        margin_ci95: { principle: "Bootstrap CI95 on the margin — if the lower bound is <=0, the lattice edge is within noise (downgrades exp3833's LATTICE_VIABLE to MARGINAL)." }
        informativeness_at_soundness_0_99_reproduced: { principle: "Sanity replication of exp3833's 0.59 — confirms the curve is stable across runs." }
        count_matched_margin_reproduced: { principle: "exp3833's 0.010 count-matched margin, reproduced — anchors the comparison to the original weak control." }
        n_candidates, random_seed, reproducibility_checksum, preconditions_checked,
        inference_substrate, duration_s:
          principle: "Adversarial-Verify + Inference-Substrate; verifier-scoring substrate, determinism for the stratified control." }

      ACCEPTANCE GATE:
        - LATTICE_REAL: margin_ci95 lower bound > 0 (the ensemble beats a score-matched control).
          honest_verdict: `complete: ldt_margin_LATTICE_REAL_scorematched_margin<M>_ci<lo>-<hi>_genuine_deductive_power`
        - LATTICE_MARGINAL: margin_ci95 lower bound <= 0 (the 0.010 was the score distribution, not discrimination).
          honest_verdict: `complete: ldt_margin_LATTICE_MARGINAL_scorematched_margin<M>_ci_includes_zero_edge_is_score_dist_not_deductive`
        - honest_verdict MUST start with a terminal prefix or `blocked_<resource>`.

      DISCIPLINE: re-score cached candidates (no GPU). Do NOT move the frozen 0.9131 (this is a lattice
      LENS, not an AUROC re-measurement). Report REAL duration.
      Run: cd {project_root} && .venv/bin/python scripts/experiments/experiment_3853_ldt_lattice_margin_sharpening.py
