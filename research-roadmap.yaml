- id: exp937-symbolic-kan-constraint-verifier
  milestone: 2026.04.72
  deliverable: results/experiment_937_symbolic_kan_constraint_verifier.json
  max_turns: 50
  prior_failures:
    - experiment_id: exp910-kan-tier4-seed
      verdict: synthetic_autoknots_validated
      addressed_by: "Exp 910 used standard KAN splines with adaptive knot placement. This experiment is fundamentally different: Symbolic-KAN adds DISCRETE SYMBOLIC LABELS to each spline node (ADD, MUL, CMP, EQ) drawn from a predefined vocabulary. The symbolic labels make the energy function interpretable — each node corresponds to a known constraint type. Paper: arXiv 2603.23854."
      retire_if_same_verdict: false
  title: 'Exp 937: Symbolic-KAN Constraint Verifier — Discrete Symbolic Structure for Interpretability (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2603.23854 (Symbolic-KAN, April 2026) augments KAN splines with discrete
    symbolic node labels from a predefined vocabulary. Each activation function is constrained
    to follow its symbolic label's behavior (ADD: f(x,y) ≈ x+y; MUL: f(x,y) ≈ x*y;
    CMP: f(x,y) ≈ sign(x-y); EQ: f(x,y) ≈ |x-y|<ε). This makes the learned constraint
    function interpretable: "node 3 checks equality, node 7 checks comparison direction."
    For Carnot's arithmetic constraint verification, symbolic KAN should improve AUC by
    enforcing that the energy function uses mathematically correct constraint types.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/kan.py — standard KAN implementation
    - python/carnot/pipeline/arithmetic_extractor.py — constraint types already identified
    - results/experiment_910_kan_tier4_seed.json — KAN AUC baseline on synthetic data
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Implement Symbolic-KAN with 4 node types (ADD, MUL, CMP, EQ), train on synthetic
    arithmetic violations, measure AUC vs standard KAN. Target: AUC > 0.70.

    CONCRETE STEPS:
    1. Read CLAUDE.md. Read arXiv 2603.23854 description above carefully.
    2. Write python/carnot/models/symbolic_kan.py:
       a. Class SymbolicKAN(nn.Module) with a vocabulary of 4 symbolic operations:
          VOCAB = ('ADD': lambda x,y: x+y, 'MUL': lambda x,y: x*y,
                   'CMP': lambda x,y: torch.sign(x-y), 'EQ': lambda x,y: (x-y).abs())
       b. Each layer has symbolic_labels: list[str] of length n_nodes, initialized randomly.
       c. Forward pass: apply the symbolic function for each node's label, plus a learnable
          residual spline correction (small amplitude to start).
       d. Training: standard energy loss (E_correct < E_incorrect); update spline residuals via
          backprop; optionally update symbolic labels via discrete search (argmin over VOCAB).
       e. Add spec entries: REQ-MODEL-030 (SymbolicKAN node vocabulary), SCENARIO-MODEL-015
          (symbolic label assignment and residual correction).
    3. Write scripts/experiment_937_symbolic_kan_constraint_verifier.py:
       a. ExperimentTemplate(937, ...) — CPU, no GPU.
       b. Generate synthetic arithmetic violations: 200 (question, correct_CoT, halluc_CoT) pairs.
       c. Train SymbolicKAN on 160, evaluate on 40 held-out pairs.
       d. Compare: standard KAN (Exp 910 baseline) vs SymbolicKAN AUC.
       e. Report: auc_standard (from Exp 910), auc_symbolic, delta_auc,
                  top_symbolic_labels (which node labels were most used),
                  interpretability_examples (3 examples of what each top node checks).
       f. honest_verdict: 'symbolic_kan_viable' if auc_symbolic > 0.70,
                          'symbolic_kan_marginal' if 0.60 < auc_symbolic <= 0.70,
                          'symbolic_kan_no_improvement' otherwise.
    4. Write tests (100% coverage). 100% spec coverage: all tests reference REQ-MODEL-030 or
       SCENARIO-MODEL-015.
    5. Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_937_symbolic_kan_constraint_verifier.py
    6. Update research-references.md: add Symbolic-KAN entry (arXiv 2603.23854).
    7. Update ops/changelog.md.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_937_symbolic_kan_constraint_verifier.py
