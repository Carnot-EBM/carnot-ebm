# Carnot Research Roadmap - Milestone 2026.04.17
# "Calibrated Verification, Spec-Grounded Code Repair, and Self-Learning"
#
# CONTEXT: Milestone 2026.04.16 established that:
# - PBT code verification is the only strong live result (+3.0pp on full Gemma HumanEval)
# - Qwen transfer is flat without better spec grounding
# - Live semantic verification has parse coverage but still too many false positives
# - Live trace memory reduces false positives but does not yet improve held-out accuracy
# - The KV260 FPGA path has a stable software contract but no board-level evidence
#
# This milestone calibrates the semantic verifier, grounds code verification in
# explicit specs, then turns those verified traces into a tighter self-learning loop.

milestone: "2026.04.17"
milestone_title: "Calibrated Verification, Spec-Grounded Code Repair, and Self-Learning"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"

tasks:
  # -- Phase 75: Calibrate Live Semantic Verification --
  - id: exp232-semantic-calibration-corpus
    milestone: "2026.04.17"
    deliverable: data/research/semantic_calibration_corpus_232.jsonl
    title: "Exp 232: Semantic verifier calibration corpus from live false positives"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: Exp 219 reached 100% parse coverage on live GSM8K semantic verification,
      but verify-only still harmed accuracy because false positives outran useful
      detections. Exp 222 and Exp 223 showed the next bottleneck is retrieval quality,
      not lack of traces. Recent work like Semantic Energy, MARCH, $V_1$, and Weaver
      all point toward claim-level evidence and calibrated confidence instead of
      monolithic free-form judgments. Use {date} as the run date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - openspec/capabilities/verifiable-reasoning/spec.md
      - results/experiment_219_results.json
      - results/experiment_221_results.json
      - data/research/semantic_failure_corpus_214.jsonl
      - python/carnot/pipeline/semantic_grounding.py
      - python/carnot/pipeline/live_trace_memory.py

      TASK: Create data/research/semantic_calibration_corpus_232.jsonl

      CONCRETE STEPS:
      1. Create a checked-in script that builds a calibration corpus from existing live artifacts, not synthetic-only examples.
      2. Include true positives, false positives, false negatives, and true negatives from the checked-in semantic and prompt-side artifacts, plus targeted follow-up items only where coverage is missing.
      3. Label each row with violation family, answer-target alignment, premise coverage, claim granularity, repairability hint, and provenance back to the source artifact.
      4. Ensure the corpus is useful for confidence calibration, not just classifier training: add fields needed for threshold sweeps and precision-recall analysis.
      5. Write or update tests first for corpus shape, provenance fields, and deterministic artifact generation.
      6. Write a short results summary artifact that reports label counts and source breakdown.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_232_semantic_calibration_corpus.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp233-output-policy-refresh
    milestone: "2026.04.17"
    deliverable: results/experiment_233_results.json
    title: "Exp 233: Structured-output policy refresh on a JSONSchemaBench-style slice"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: Exp 213's policy was derived from a small 11-example slice and
      correctly concluded that structure should be used selectively. Recent work like
      JSONSchemaBench and PSC suggests the real question is not "JSON or not?" but
      "which minimal schema, with what retry budget, on which task slice?" Refresh
      the policy using only Qwen/Qwen3.5-0.8B and google/gemma-4-E4B-it. Use {date}
      as the run date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - openspec/capabilities/verifiable-reasoning/spec.md
      - results/experiment_213_results.json
      - results/monitorability_policy_213.json
      - scripts/experiment_213_monitorability_audit.py
      - python/carnot/pipeline/structured_reasoning.py
      - scripts/experiment_218_live_dual_model_suite.py

      TASK: Create results/experiment_233_results.json

      CONCRETE STEPS:
      1. Create a new benchmark script that evaluates at least four output modes: free_form_reasoning, answer_only_terse, minimal_json, and grammar_gated_json.
      2. Use a mixed slice that includes semantic GSM8K items, prompt-side constraint items, and code/spec items already in-tree.
      3. Measure parse success, retry rate, answer quality, exact or partial satisfaction, claim coverage, token cost, and repair usefulness for both target models.
      4. Emit a refreshed machine-readable policy artifact alongside the main results file so later experiments can consume it directly.
      5. Keep the schema minimal and task-gated; do not force JSON onto slices where Exp 213 already showed it hurts.
      6. Write or update tests first for mode routing, metric aggregation, and deterministic artifact generation.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu CARNOT_FORCE_LIVE=1 .venv/bin/python scripts/experiment_233_output_policy_refresh.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp234-semantic-verifier-v2
    milestone: "2026.04.17"
    deliverable: python/carnot/pipeline/semantic_verifier_v2.py
    title: "Exp 234: Calibrated semantic verifier v2"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: The current semantic grounding path can detect real semantic
      failures, but it is still too coarse and too eager. The next step is a
      claim-isolated verifier with calibrated confidence and an explicit abstain
      path, using the new calibration corpus and refreshed output policy. This is
      the main implementation task that turns Exp 232 and Exp 233 into a better
      live verifier. Use {date} as the run date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - openspec/capabilities/verifiable-reasoning/spec.md
      - data/research/semantic_calibration_corpus_232.jsonl
      - results/experiment_233_results.json
      - python/carnot/pipeline/semantic_grounding.py
      - python/carnot/pipeline/typed_reasoning.py
      - python/carnot/pipeline/structured_reasoning.py
      - python/carnot/pipeline/verify_repair.py

      TASK: Create python/carnot/pipeline/semantic_verifier_v2.py

      CONCRETE STEPS:
      1. Add or update the relevant spec requirements before implementation if the current verifiable-reasoning spec does not already cover calibrated claim-level semantic verification.
      2. Implement a verifier that isolates claims, scores answer-target coverage, checks premise support, and returns calibrated confidence rather than a forced yes or no on weak evidence.
      3. Add an explicit abstain path so uncertain cases do not automatically become false positives.
      4. Keep the new verifier additive: it should consume existing typed reasoning and structured output helpers instead of breaking the current pipeline contracts.
      5. Integrate the new path into VerifyRepairPipeline behind a clear entry point and structured result object.
      6. Write tests first for calibration thresholds, abstain behavior, additive integration, and deterministic serialization.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_semantic_verifier_v2.py -q --no-cov -n0
      Do NOT push. Do NOT modify scripts/research_conductor.py.

