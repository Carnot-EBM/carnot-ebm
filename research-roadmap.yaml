milestone: "2026.06.342"
milestone_title: "PHASE-3 THESIS A — RECOVER FROM A FALSE-NEGATIVE, THEN RUN THE GENUINE KILL-GATE. .341's recorded kill-gate part-(a) FAIL ('energy-as-generator bounded at small scale') is an INFRASTRUCTURE FALSE-NEGATIVE, not a scientific finding. The positive control PASSED: exp3726's single-step smoke trained a 38M EBT that fits one 3090 at 1283MB with loss finite AND monotonically decreasing. But exp3728 (the bounded training run) bailed at 0 steps in 65.5s because its precondition check evaluated ebt_vendored=false and smoke_passed=false -- BOTH demonstrably wrong (exp3725 importable=true, exp3726 result on disk) -- a cwd/import-path bug, NOT a divergence. exp3729 then mislabeled that infra-block as a mechanism bound. Per CLAUDE.md FALSE_NEGATIVE_RISK + Reading-Results disciplines, a null claim with NO positive-control bounded run is unsupported. .342 (a) CLEANLY corrects the record, (b) FIXES the harness bug and runs the GENUINE bounded checkpointed training of the tiny EBT + a matched tiny AR baseline (with the EBT-paper stability recipe: random-alpha + replay buffer + Langevin noise + grad-clip + the KL-term CD fix arXiv:2012.01316), (c) renders the REAL part-(a) verdict superseding exp3729, and (d) IF stable, runs the matched-COMPUTE comparison (EBT energy-descent vs AR best-of-N at EQUAL inference FLOPs via the exp3727 harness) -- kill-gate part (b), the actual thesis test. CRITICAL discipline carried from P0.1: matched-COMPUTE, never matched-params (a params-matched 'win' is just extra inference FLOPs). INVARIANTS: paper_ready stays TRUE (G1-G4 closed 2026-05-31); frozen FoVer 0.9131 stays frozen; P0.1 / energy-SELECTION stays settled-bounded (this tests GENERATION, a different mechanism). Banking the verifier product is unaffected -- this is a venture bet with a knife to its own throat."
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md

# OUTER-LOOP / OPERATOR PRE-STAGED ROADMAP (2026-06-02, Claude Opus 4.8). PROVENANCE:
# The .341 planner staged the Thesis-A bring-up after the operator seeded energy-as-generator
# (docs/research-notes/phase3-alternative-thesis-menu.md). .341 ran but its kill-gate verdict was
# a same-day infrastructure FALSE-NEGATIVE (exp3728 cwd/import bug -> exp3729 mislabel). .342 is the
# direct, gated continuation: correct the record, run the GENUINE kill-gate. This is NOT breadth churn
# (north-star sec-1) -- it recovers an operator-seeded mechanism test from a harness bug and produces
# the first genuine empirical signal on the route.
#
# ROUTING (current backend reality): gemini still CRASHES real GPU workloads (exp3703, exp3714 v6
# probe), so the cheap-default is CODEX (requires_codex), not gemini, for these REAL GPU workloads.
# The two open-ended training-debug tasks (exp3734 fix+driver+train, exp3735 resume+stabilize) are
# requires_claude+opus per the standing operator directive 2026-06-02 (EBT training is finicky;
# divergence diagnosis meets the multi-file-choreography + open-ended-judgment-under-ambiguity bar).
# The GPU EVAL tasks (exp3737 generation smoke, exp3738 matched-compute) are codex+requires_codex+gpu:
# running the trained models through the already-built+unit-tested exp3727 harness is mechanical with
# a deterministic FLOP-accounting criterion. Everything else is codex+requires_codex (aggregation/CPU).
#
# KILL-GATE (the GENUINE one this time): part (a) a tiny EBT trains to STABLE convergence within the
# bounded 3090 budget (re-run with the bug fixed; exp3736 verdict supersedes the false-negative exp3729).
# part (b) [gated on part-a stable] at EQUAL inference compute the EBT beats matched AR on held-out
# reasoning accuracy AND/OR the gap narrows with 2x training (exp3739 verdict). An honest NEGATIVE at
# part (b) is a real finding that bounds the route cheaply -- as valuable as a positive.
#
# GATING: gated_on is used ONLY on the expensive GPU tasks (exp3735/3737/3738) against BARE-value
# upstream fields (per feedback_gated_fields_must_be_bare -- a {value,principle} dict breaks the gate;
# every gated upstream field is emitted as a bare scalar). Verdict/aggregation/self-learning/hardware/
# capstone tasks carry NO gated_on and read upstream with a graceful disk-presence fallback (the .340
# proven-safe pattern: read if present, else record an honest 'not-run', never crash on a None read).
#
# INVARIANTS: paper_ready stays TRUE (do NOT regress); frozen FoVer 0.9131 stays frozen; P0.1 /
# energy-SELECTION stays honest-negative-bounded. The agent never edits ops/north-star.md, never
# triggers a CI run, never pushes. Vendored EBT is Apache-2.0 (license-compatible; commit pinned).

