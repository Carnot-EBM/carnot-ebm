    6. Add REQ-REPORT-7122 tests for source classification, duplicate removal,
       date bounds, URL fields, model rows, and append markers.
    7. Run focused tests, artifact validation, adversarial verification, row
       consistency, scoped spec coverage, and root-clutter checks.
