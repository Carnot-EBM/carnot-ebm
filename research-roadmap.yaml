# ============================================================
# Phase 0 — Infrastructure (2 tasks, MANDATORY, unconditional)
# exp1178: pytest memory watchdog stops OOM swap spikes.
# exp1179: llama.cpp GPU offload fix unblocks GRPO v5 (exp1184).
# ============================================================

- id: exp1178-pytest-memory-watchdog
  milestone: 2026.04.92
  deliverable: results/experiment_1178_pytest_memory_watchdog.json
  title: "Pytest Memory Watchdog — Per-Test RSS Monitoring + Session Cumulative Limit"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 20
  priority: infrastructure
  requires_gpu: false
  prompt: |
    CONTEXT:
    The Carnot conductor consistently observes 5 swap-saturation spikes per session
    (documented in ops/known-issues.md as MANDATORY-NEXT-MILESTONE PRIORITY). These spikes
    happen when a test leaks a large JAX array or llama.cpp model handle and pytest accumulates
    RSS across the session without gc. The spikes cause OOM kills, process restarts, and
    conductor interruptions that corrupt result artifacts.

    This is an infrastructure task — no machine learning, no experiments, just a pytest
    plugin that monitors memory and kills runaway tests before they exhaust system RAM.

    EXISTING CODE TO READ FIRST:
    - tests/python/ (understand existing conftest.py and test structure)
    - python/carnot/ (understand module structure to know what might leak)
    - ops/known-issues.md lines 1-50 (swap spike documentation)

    TASK:
    1. Read tests/python/conftest.py (or create it if not present).
    2. Add a pytest plugin with these hooks:
       - `pytest_runtest_setup(item)`: record RSS_before = resource.getrusage(RUSAGE_SELF).ru_maxrss
       - `pytest_runtest_teardown(item, nextitem)`: record RSS_after; compute RSS_delta_mb.
         If RSS_delta_mb > 500, mark the test as FAILED with message "Memory leak: +{delta}MB".
       - `pytest_sessionfinish(session, exitstatus)`: if cumulative RSS > 8192 MB, emit a
         warning with top-5 RSS-delta tests and write results/pytest_memory_{timestamp}.log.
    3. Write tests/python/test_memory_watchdog.py with at least 3 tests:
       - test_watchdog_records_baseline: verify RSS_before is captured
       - test_watchdog_detects_leak: allocate > 500 MB, verify watchdog fires
       - test_watchdog_cleanup: verify cleanup after test
    4. Run pytest tests/python/test_memory_watchdog.py -v and verify all 3 pass.
    5. Run the full test suite with the watchdog active:
       pytest tests/python/ --co -q 2>&1 | head -30  (collection only, no execution)
    6. Write results artifact.

    CONCRETE STEPS:
    - python3 -c "import resource; print(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)" 2>&1
    - cat tests/python/conftest.py 2>/dev/null || echo "no conftest yet"
    - Implement conftest.py memory watchdog hooks
    - pytest tests/python/test_memory_watchdog.py -v 2>&1 | tail -20
    - Write results/experiment_1178_pytest_memory_watchdog.json

    REQUIRED ARTIFACT FIELDS:
    - watchdog_operational: bool (True if plugin loaded and hooks registered)
    - per_test_rss_tracked: bool
    - session_cumulative_limit_mb: int (should be 8192)
    - per_test_leak_threshold_mb: int (should be 500)
    - sample_test_run_passed: bool (3 watchdog tests pass)
    - no_regression_in_existing_tests: bool (existing tests still pass)
    - honest_verdict: "watchdog_operational" | "partial_implementation" | "failed"

    Run: pytest tests/python/test_memory_watchdog.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1179-llama-cpp-gpu-offload-fix
  milestone: 2026.04.92
  deliverable: results/experiment_1179_llama_cpp_gpu_offload_fix.json
  title: "llama.cpp GPU Offload Fix — Rebuild with LLAMA_CUDA=1 for GRPO v5 Unblock"
  agent_type: claude
  model: opus
  max_turns: 45
  estimated_wall_time_min: 35
  priority: critical
  requires_gpu: true
  prompt: |
    CONTEXT:
    GRPO v5 has failed twice (exp1139, exp1173) due to llama.cpp lacking GPU offload support.
    exp1173 confirmed: honest_verdict=training_wall_hit, training_completed=False.
    The root cause (documented in ops/known-issues.md): llama.cpp was built without CUDA support,
    so --n-gpu-layers 83 silently falls back to CPU. 35B model CPU inference takes ~45s/token,
    causing the 2400s grace period to expire with < 20 tokens generated.

    This is a one-time infrastructure fix. Once llama.cpp is rebuilt with CUDA support,
    EVERY subsequent GRPO experiment (v5 and beyond) runs at GPU speed.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1173_grpo_v5_tinyv_fn_correction.json (confirmed root cause)
    - Locate llama.cpp in the vendor/ or scripts/ directory: find . -name "llama.cpp" -type d 2>/dev/null | head -5
    - Check current llama.cpp build: ldd $(which llama-server 2>/dev/null || find . -name "llama-server" 2>/dev/null | head -1) 2>&1 | head -20

    TASK:
    1. Locate the llama.cpp installation used by the conductor:
       - Check vendor/llama.cpp/, third_party/, or ~/.local/
       - If llama.cpp is a pip package (llama-cpp-python), check if GPU variant is installed:
         python3 -c "from llama_cpp import Llama; print(Llama._cuda_available())" 2>&1
    2. Rebuild or reinstall with CUDA support. Preferred paths in order:
       a. If llama-cpp-python pip package: pip install llama-cpp-python --upgrade --force-reinstall
          --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu124
       b. If vendor/llama.cpp source: LLAMA_CUDA=1 make -j$(nproc) in that directory
       c. If neither: pip install llama-cpp-python[cuda] and document the path used
    3. Verify GPU offload works:
       - Load a small GGUF (any locally available model) with --n-gpu-layers 10
       - Time token generation for 20 tokens
       - Confirm throughput >= 50 tokens/sec (any model; this proves GPU is active)
    4. Verify the 35B model path works at reduced layers:
       - If unsloth/Qwen3.6-35B-A3B-GGUF is cached: test with --n-gpu-layers 5 (partial offload)
       - Record: model_path, layers_on_gpu, throughput_tokens_per_sec
    5. Document the verified command that GRPO v5 (exp1184) should use.
    6. Write results artifact.

    CONCRETE STEPS:
    - find . -name "*.gguf" 2>/dev/null | head -5  (find any cached GGUF for testing)
    - python3 -c "from llama_cpp import Llama; print(dir(Llama))" 2>&1 | head -20
    - pip install llama-cpp-python --upgrade --force-reinstall \
        --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu124 2>&1 | tail -20
    - python3 -c "
      from llama_cpp import Llama
      import time
      # Use any available GGUF
      import glob
      ggufs = glob.glob('**/*.gguf', recursive=True)
      if not ggufs: print('NO GGUF FOUND'); exit(1)
      m = Llama(ggufs[0], n_gpu_layers=10, verbose=False)
      t0 = time.time()
      out = m('Hello world', max_tokens=20)
      dt = time.time() - t0
      toks = out['usage']['completion_tokens']
      print(f'throughput: {toks/dt:.1f} tok/s, n_gpu_layers=10, model={ggufs[0]}')
      " 2>&1
    - Write results/experiment_1179_llama_cpp_gpu_offload_fix.json

    REQUIRED ARTIFACT FIELDS:
    - llama_cpp_version: str (e.g., "0.3.x")
    - cuda_support_compiled: bool
    - install_method: str ("pip-cu124" | "source-make" | "other")
    - test_model_path: str (path to GGUF used for verification)
    - layers_on_gpu: int (n_gpu_layers used in test)
    - throughput_tokens_per_sec: float (must be >= 50.0 to pass)
    - llama_cpp_gpu_offload_verified: bool (True iff throughput >= 50.0)
    - grpo_v5_recommended_command: str (the exact --n-gpu-layers flag for 35B model)
    - honest_verdict: "gpu_offload_verified" | "partial_offload_only" | "gpu_offload_failed"

    Run: python3 scripts/experiment_1179_llama_cpp_gpu_offload_fix.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

