- id: exp6904-sealed-self-learning-support-audit
  title: Sealed independent self-learning utility and support audit
  track: self-learning
  priority: critical
  agent_type: claude
  model: sonnet
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.09.604
