  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2604.04384\
    \ (April 2026) demonstrates that logit energy fields in transformers are\
    \ low-rank: 90% of total variance is captured in only 2-11 singular components\
    \ (SVD of the logit matrix). KAEMEnergy (Exp 447) operates on the full-dimensional\
    \ energy space. A rank-k KAEMEnergy with k=11 is sufficient for 90%+ accuracy\
    \ at 10-100x fewer KAN spline computations. This is a direct efficiency win\
    \ for the KAN fast-path tier (Tier 2 in the verification cascade) and for the\
    \ FPGA hardware path (rank-k splines have fewer parameters to store on-chip).\n\n\
    EXISTING CODE TO READ FIRST:\n\
    - python/carnot/models/kaem_energy.py — KAEMEnergy, UnivariateKAEMLayer (Exp 447)\n\
    - python/carnot/models/cikan_energy.py — CIKANEnergy (Exp 519, constraint-boundary splines)\n\
