        5. Measure `repair_success_rate` across 20 synthetic constraints.

      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3356_fr11_cx_repair.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

