      count mismatch.
    retire_if_same_verdict: true
  model: opus
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V710 activated only Exp8218 and Exp8219. Its design claimed fourteen tasks. Exp8218 is complete_disqualified_original_code_bytes; Exp8219 has utility_protocol_ready_score=1. The archive currently stops at V709.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/v685_authority_lifecycle.py; python/carnot/reporting/v709_qualification.py; results/experiment_8218_v710_contract_replay_qualification.json; results/experiment_8219_v710_utility_patch_methods.json; openspec/change-proposals/research-roadmap-v710-preserved-20261006.md
    TASK:
    Bind fourteen current tasks and preserve the two actual V710 outcomes. Deliver results/experiment_8220_v711_current_contract.json. Create the thin runner scripts/experiments/experiment_8220_v711_current_contract.py. Store primitive evidence under results/raw/experiment_8220_v711_current_contract/. Keep execution readiness separate from benefit.
    CONCRETE STEPS:
    0. PRECONDITIONS: Emit a flushed start line. Authenticate named inputs, schemas, writable private scratch and resources. Record actual commands and exits. Missing external evidence yields complete_blocked_<operand> with verdict_class=blocked. Do not fabricate inputs or substitute missing rows.
    1. Emit a flushed progress line at every phase boundary. Emit lines before and after each model load, generation, benchmark and subprocess. Print completed/pending counts inside long loops. Emit a heartbeat at least every 60 seconds while a child runs. Keep every output gap below 600 seconds. Use unbuffered output, bounded child deadlines and process-group cleanup. Write any file over about 200 lines in several tool calls of at most about 150 lines. Send a progress message between file-writing calls. Split long work into resumable batches; no single huge tool call. Do not pad runtime.
    2. Extend the relevant REQ-* and SCENARIO-* before implementation. Write focused failing tests first. Exercise real CLI and failure paths. Keep original tests and assertions. Reuse qualified helpers. Keep scratch outside the repository root and fixture outputs outside results/. Follow the V711 design. No generator weight changes or external publication.
    3. Declare no_model_load, MODEL_SPECS=[] and zero current LLM calls. Use aggregation_from_upstream_artifacts for reductions, or verifier_ensemble_against_cached_candidates for numerical fitting/scoring. Declare trained_head_specs separately. Historical Qwen provenance is not a current invocation.
    4. Bind V711 with first_id=8220 and count=14. Compare visible table, complete JSON, canonical digest and staged YAML. After activation compare the real active YAML. Never copy the staged YAML into the active slot to claim activation. Test count, order, prompt, title, gate, model and digest mutations using private fixtures.
    5. Snapshot current owned source/config bytes before validation and replay. Record V710 as two scheduled outcomes and twelve unexecuted design entries. Preserve Exp8218 original-code failures and Exp8219 registered, unmeasured H1/H2. Do not attempt another archive-wide reconstruction of unavailable original code.
    6. Qualify only the current authority CLI and receipt reader on valid, tampered and externally blocked private cases. Missing historical originals remain unavailable evidence, separate from current authority readiness. Do not upgrade historical dispositions. Store current snapshots for the capstone; this administrative result is not a science-branch gate.
    7. Run applicable private E2E-018 from ops/e2e-test-plan.md using private fixtures. Freeze exact owned commands before measurement. Run relevant unit/consumer tests, measured 100% changed-code coverage including real CLI/child statements, scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Preserve argv, expected/actual exits, full stdout/stderr hashes and clocks. Keep bounded repository-health diagnostics separate; existing failures do not become a global pass.
    8. Cold-replay primitives in a fresh process. Validate a private candidate through unchanged primary_publication terminal checks, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Publish atomically to results/experiment_8220_v711_current_contract.json only after normal exit and required checks. Preserve historical primary bytes. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. Do not modify research-roadmap.yaml.
    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Bind evidence to the actual invocation.
    honest_verdict, verdict_class: principle: Use complete_* terminal verdicts and exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished owned work only. Unchanged external blocks are blocked.
    gate_check_summary: principle: Each blocked result names upstream/path/hash, exact field, operator, expected and observed value. Missing differs from measured zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts: principle: Actual current operations determine duration floors; cached provenance is not a model call.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count: principle: Preserve every unit/arm/condition and metric with its numerator, denominator and missing status. Seeds and repeats do not add independent sources.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle-defined success is circular_positive. Reused development data cannot prove independent generalization; both generalization scores stay zero here.
    flagged_adversarial, required_checks_passed, acceptance_gates, validation_receipts, terminal_validation_sidecar_path: principle: Failed owned checks disqualify and set readiness to zero. Readiness alone is not scientific benefit.
    preconditions_checked, duration_s, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes, phase_spans: principle: Preserve actual work clocks and independently checkable input bytes.
    cited_upstream_artifacts, field_principles: principle: Name imported fields and their hashes. Explain each added field.
    current_contract_ready_score: principle: One means the actual current contract and its owned checks agree, not that missing historical bytes were recovered.
    historical_dispositions, unexecuted_v710_design_entries, canonical_tasks_sha256, current_code_snapshots: principle: Prevent promises and current bytes from impersonating executed history.
    Run command: cd {project_root} && PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8220_v711_current_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
