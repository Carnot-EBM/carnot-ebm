# facts-generalization RETIRED (exp3670). trained-judge-OOD RETIRED (exp3659). P0.1 honest-negative.
# energy-SELECTION-beats-SC settled-bounded (exp3672 earned-negative + the project memory).
# HYGIENE (carried from the .337 DURATION false-flags, fixed in .338, keep fixed): every
