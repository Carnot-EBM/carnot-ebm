  - id: exp3220-hermetic-cuda-runtime-repair-ledger-v1
    milestone: "2026.05.298"
    deliverable: "results/experiment_3220_hermetic_cuda_runtime_repair_ledger_v1.json"
    title: "Hermetic CUDA runtime repair ledger for selected Python and isolated CUDA venv"
    priority: critical
    model: opus
    max_turns: 100
    estimated_wall_time_min: 55
    track: "runtime"
    inference_substrate: "cuda_runtime_repair_forensics"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3206-cuda-env-forensics-ledger-v1
        verdict: "blocked_selected_python_torch_cuda: cuda_env_diagnosed=true; cuda_init_clean=false"
        addressed_by: "This attempt compares the selected .venv against a hermetic CUDA-only runtime and records a repair ledger instead of repeating the same one-path forensics."
        retire_if_same_verdict: true
      - experiment_id: exp3207-llama-cpp-cuda-rebuild-clean-subprocess-v1
        verdict: "blocked_selected_python_torch_cuda: selected_python_torch_cuda_unavailable"
        addressed_by: "This task fixes the upstream selected Python CUDA precondition before any llama.cpp rebuild or receipt attempt."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      `.297` proved that `nvidia-smi` sees an RTX 3090, but the selected repo `.venv` Python cannot initialize PyTorch CUDA and `llama_cpp` reports `ggml_cuda_init: failed to initialize CUDA: unknown error`. You are working in {project_root} on {date}. This is a runtime repair/forensics task, not a model-quality experiment.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3206_cuda_env_forensics_ledger_v1.json
      - results/experiment_3207_llama_cpp_cuda_rebuild_clean_subprocess_v1.json
      - scripts/experiment_template.py
      - scripts/conductor_gates.py
      - research-hardware-wishlist.md
      - research-references.md

      TASK
      Produce a hermetic CUDA runtime repair ledger that determines whether CUDA failure is specific to the selected `.venv`, the system driver/runtime boundary, import order, llama.cpp linkage, or environment-variable pollution.

      CONCRETE STEPS
      1. Re-run a minimal selected-Python CUDA probe in a clean subprocess with explicit `CUDA_VISIBLE_DEVICES=0` and record PyTorch CUDA availability, device count, stderr, and import order.
      2. Record `nvidia-smi`, driver version, CUDA version, visible devices, and GPU memory state.
      3. Compare the selected `.venv` against a hermetic CUDA-only Python environment when safe under the repo's dependency workflow. If you create a temporary environment, keep it outside protected source paths and record exact commands and package versions.
      4. Detect ROCm/XDNA/CUDA path pollution by recording `PATH`, `LD_LIBRARY_PATH`, `CUDA_HOME`, `CUDA_VISIBLE_DEVICES`, `PYTHONPATH`, `CMAKE_ARGS`, and `FORCE_CMAKE`.
      5. Do not load a SOTA GGUF and do not claim model receipt in this task.
      6. Set `cuda_receipt_ready_candidate=true` only if a clean subprocess can initialize CUDA and identify a GPU through PyTorch or an equivalent CUDA runtime probe.
      7. Write `results/experiment_3220_hermetic_cuda_runtime_repair_ledger_v1.json`.

      REQUIRED ARTIFACT FIELDS:
      - schema_version: string
      - experiment_id: string
      - milestone: string
      - selected_python: string
      - selected_python_cuda_ok_before: bool
      - selected_python_cuda_ok_after: bool
      - isolated_cuda_venv_created: bool
      - isolated_cuda_venv_cuda_ok: bool
      - cuda_visible_devices: string|null
      - nvidia_smi_available: bool
      - gpu_count_nvidia_smi: int|null
      - driver_version: string|null
      - torch_version_selected: string|null
      - torch_cuda_version_selected: string|null
      - environment_pollution_findings: list
      - repair_actions_attempted: list
      - cuda_receipt_ready_candidate: bool
      - recommended_next_action: string
      - inference_substrate: string
      - conductor_file_modified: bool
      - active_roadmap_modified: bool
      - honest_verdict: string

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

