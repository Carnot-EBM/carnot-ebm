- id: exp740-preflight-v9
  milestone: 2026.04.57
  deliverable: results/experiment_740_preflight_v9.json
  title: 'Exp 740: Pre-flight v9 + Exp 527 Mandatory Retirement + DualGPU Fix (MANDATORY FIRST)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Milestone .56 closed with two critical outstanding items. (1) Exp 527
    (live 100q precision inference) appeared in the slowest-5 for the THIRD consecutive
    milestone — per established governance (Exp 308/309 precedent) this mandates mandatory
    retirement. The exclusion manifest must be updated NOW. (2) The DualGPU parallelization
    for the Exp 383 class (EORM+JEPA retrain) has been available since milestone .52
    (validated in Exp 685 at 2.0175x speedup) but has NOT been applied for ELEVEN consecutive
    milestones. GPU 1 was confirmed idle throughout .56 (42C, 0% util, 5MB VRAM). This
    experiment fixes both items and confirms manifest enforcement.

    EXISTING CODE TO READ FIRST:
    - scripts/conductor_exclusion_manifest.json — current exclusion list; read before adding.
    - python/carnot/pipeline/exclusion_manifest.py — ExclusionManifest class.
    - scripts/conductor_pre_flight.py — pre-flight runner (incremental mode).
    - results/manifest_fix_patch.txt — the patch written by Exp 731; read to understand
      where the manifest enforcement gap is in research_conductor.py.
    - results/experiment_731_zombie_kill_preflight_v8.json — v8 baseline.
    - python/carnot/pipeline/eorm_model.py (or equivalent) — EORM model class.
    - python/carnot/samplers/jepa_reasoner_probe.py — JEPAReasonerProbe class.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Kill zombie GPUs. Add Exp 527 to exclusion manifest. Implement DualGPU
    ThreadPoolExecutor for EORM+JEPA retrain. Confirm incremental test selection.
    Verify manifest enforcement status.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-INFRA-048 (Exp 527 class MUST be in exclusion manifest before .57 dequeue;
       governance mandates retirement after 3 consecutive slowest-5 appearances),
       REQ-INFRA-049 (EORM+JEPA retrain MUST use ThreadPoolExecutor with EORM on cuda:0
       and JEPA on cuda:1 when both GPUs are available; sequential-GPU training is retired),
       SCENARIO-INFRA-057/058 to openspec/capabilities/pipeline/spec.md.
    3. GPU health check:
       a. Run `nvidia-smi` to confirm both GPUs at <100MB VRAM / 0% util.
       b. If any GPU has zombie process: `import os, signal; os.kill(pid, signal.SIGKILL)`.
       c. Record gpu0_vram_mb, gpu1_vram_mb, gpu0_util, gpu1_util.
    4. Add Exp 527 to exclusion manifest:
       a. Read scripts/conductor_exclusion_manifest.json.
       b. Add entry: {"experiment_id": "exp527", "reason": "3rd consecutive slowest-5
          appearance; RETRO-033 resolved by Exp 720; no remaining research mandate",
          "retired_in_milestone": "2026.04.57", "governance_rule": "3-consecutive-mandatory"}.
       c. Write updated manifest back to scripts/conductor_exclusion_manifest.json.
    5. Implement DualGPU fix for EORM+JEPA retrain:
       a. Locate the EORM and JEPA retrain functions (likely in python/carnot/pipeline/ or
          scripts/). Read results/experiment_685_dualgpu_retrain.json for the validated
          ThreadPoolExecutor pattern (speedup=2.0175x).
       b. Create python/carnot/pipeline/dualgpu_retrain.py:
          Class DualGPURetrain:
          - retrain_parallel(eorm_model, jepa_model, train_data, eorm_device="cuda:0",
            jepa_device="cuda:1") -> (eorm_result, jepa_result)
          - Uses ThreadPoolExecutor(max_workers=2): submit eorm retrain on cuda:0,
            submit jepa retrain on cuda:1, await both.
          - Falls back to sequential if only one GPU available.
          - Returns (eorm_loss, jepa_loss, wall_time_s, speedup_vs_sequential).
       c. Write a fast benchmark: run 1 epoch EORM on cuda:0 sequential vs parallel.
          Confirm speedup >= 1.5x (conservative target given GPU overhead).
    6. Validate incremental test selection:
       a. Run incremental selector on current clean diff.
       b. Expected: 0 tests selected (clean repo, new files from this exp trigger selection).
       c. Log: incremental_mode, tests_selected.
    7. Manifest enforcement check:
       a. Search conductor-log.md for "manifest_excluded" entries from .57 cycle start.
       b. If NOT found: record manifest_enforcement_applied=False, note "human action
          still required: apply results/manifest_fix_patch.txt to research_conductor.py".
       c. If found: record manifest_enforcement_applied=True.
    8. Create scripts/experiment_740_preflight_v9.py:
       a. ExperimentTemplate(740) + ExperimentTimeoutWatchdog(740, timeout_minutes=45).
       b. Implement steps 3-7.
