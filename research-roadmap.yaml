  # -- Phase 76: Ground Code Verification in Explicit Specs --
  - id: exp236-code-spec-corpus
    milestone: "2026.04.17"
    deliverable: data/research/code_spec_corpus_236.jsonl
    title: "Exp 236: Code intent / spec corpus from live HumanEval traces"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: Exp 226 proved that PBT can improve full HumanEval on Gemma, and
      Exp 227 proved that transfer to Qwen is not automatic. The next step is to
      make prompt intent explicit: preconditions, postconditions, invariants,
      mutation constraints, and oracle hints that the verifier can reason about
      directly. Recent formal-spec papers suggest this is the strongest bridge from
      code verification into broader verifiable reasoning. Use {date} as the run
      date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - openspec/capabilities/code-verification/spec.md
      - results/experiment_226_results.json
      - results/experiment_227_results.json
      - python/carnot/pipeline/pbt_code_verifier.py
      - python/carnot/pipeline/code_learning.py
      - python/carnot/pipeline/humaneval_live_benchmark.py

      TASK: Create data/research/code_spec_corpus_236.jsonl

      CONCRETE STEPS:
      1. Create a checked-in script that converts a seeded HumanEval-style cohort into explicit specs: preconditions, postconditions, invariants, mutation rules, and oracle hints.
      2. Seed the corpus with checked-in Exp 226 and Exp 227 failures and repairs so the spec layer reflects real live behavior rather than only prompt reading.
      3. Keep the schema compact and deterministic so later verifier code can consume it directly.
      4. Write a short summary artifact with counts by spec family and source trace.
      5. Write or update tests first for schema shape, deterministic generation, and provenance links back to the source benchmark artifacts.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_236_code_spec_corpus.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

