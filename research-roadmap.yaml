  prior_failures:
    - experiment_id: exp605-extractor-diagnostic-v4
      verdict: gate_closed_recall_below_threshold
      addressed_by: "FALSE-POSITIVE SCOPE MATCH. exp605 was about LLM-output extractor recall (does the extractor catch all numeric answers in model responses?). exp1090 is about adding alpha_t / KL / null-space measurement instrumentation as a shared library (python/carnot/eval/diagnostics.py). Different code path, different data, different failure mode. Conductor's name-similarity matcher tripped on the keyword 'diagnostic' alone."
