        - project_q12_hypothesis_b_and_dark_room + project_zenil_alpha_grounding (memory) — the theory

      TASK: Run ONE full FR-11 closed loop to N>=200 on a NON-DEGENERATE corpus under TWO arms:
        - Arm DEPLOY (conservative-default beta from exp3521): expected to PREVENT collapse AND preserve quality.
        - Arm CONTROL (beta=0): expected to COLLAPSE.
      Track DISTINCT metrics (output entropy, top-mode mass, verifier-PASS rate, TRUE ground-truth
      accuracy — ASSERT pass_rate and true_accuracy are different arrays). The corpus MUST have a
      non-trivial starting true accuracy (Step 0 gate) so quality-maintenance is measurable.

