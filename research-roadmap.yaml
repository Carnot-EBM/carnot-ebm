      TASK
      Build a calibration-only three-family raw-code envelope canary using the immutable Exp6186 task bank. Test preregistered 512, 1024, and 1536 output-token ceilings on fixed tasks, store raw bytes before interpretation, and freeze one per-family envelope from finish reason, extraction, compilation, and public sample-run evidence only. Private tests and hidden correctness are forbidden during configuration choice.

