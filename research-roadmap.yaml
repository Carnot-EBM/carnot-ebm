    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4525_levelup_attempt.json
    prompt: |
      CONTEXT ({date}, ARC sprint LEVEL-UP ATTEMPT GUARANTEE -- CLAUDE.md mandates >=1 task per roadmap
      that actually BANKS a new reproducible level). reproducible_total_levels must grow monotonically.

      EXISTING CODE TO READ FIRST:
        - {project_root}/ops/arc_solve_registry.yaml (current reproducible levels; UNSOLVED public games; general_gotchas)
        - {project_root}/scripts/arc_loop_solve.py (the STANDING entrypoint: transfer-route -> verifier-routed solve -> reproduction gate -> registry update)
        - {project_root}/python/carnot/agentic/arc_solver_kit.py (reusable primitives + reproduce gate)
        - {project_root}/python/carnot/agentic/arc_solve_learning.py (recommend_approach -> route a NEW game to the closest solved recipe)

      TASK: bank a NEW level -- gate: offline_reproduced=true AND reproduced_levels>=1. Either first-contact
      an UNSOLVED public game (a new-level attempt), or +1 deeper on a solved one. For an un-adaptered game,
      call recommend_approach first, reverse-engineer ONLY the win/action/state DELTA, register a GameAdapter,
      then run arc_loop_solve. For an adaptered game, +1 deeper. Only OFFLINE-REPRODUCED levels count.

      CONCRETE STEPS:
        0. PRECONDITIONS: `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0. Missing -> blocked_<resource>, EXIT.
        1. Pick the target (prefer an UNSOLVED public game per the rotation; else deepen a shallow one). Run `.venv/bin/python scripts/arc_loop_solve.py --game <target>` (or --auto).
