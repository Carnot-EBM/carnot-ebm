  - id: exp6460-v556-terminal-handoff-and-queue-integrity
    operator_override: "2026-05-29 operator directive (standing): routine milestone-transition work matches prior handoffs by construction. This task hands off V555 and validates the new V556 queue."
    milestone: "2026.08.556"
    deliverable: results/experiment_6460_v556_terminal_handoff_and_queue_integrity.json
    title: "V555 terminal handoff and V556 queue integrity"
    priority: critical
    track: infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 45
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6448-v555-terminal-handoff-and-queue-integrity
        verdict: "complete_blocked_v555_queue_integrity_failed: V554 terminal facts are preserved but a V555 queue contract failed"
        addressed_by: "This handoff targets a new milestone and directly adds the prior-failure declarations that Exp6448 found missing. It validates 13 V556 tasks and a different staged roadmap hash."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V555 completed its activated queue. Exp6448 found missing prior-failure declarations. Exp6450 produced an ineligible corpus. Exp6457 invalidated the nominal CSL claims. Exp6458 regressed one ARC safety game. V556 has 13 tasks and independent corpus, CSL, and ARC branches. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/_bmad/prd.md, and {project_root}/_bmad/architecture.md
      - {project_root}/research-roadmap.yaml, {project_root}/research-roadmap-next.yaml, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6448_v555_terminal_handoff_and_queue_integrity.json through {project_root}/results/experiment_6459_v555_adversarial_capstone.json where present
      - {project_root}/ops/conductor-log.md, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/known-issues.md
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/exclusion_manifest_lint.py, and {project_root}/scripts/conductor_gates.py
      - {project_root}/scripts/adversarial_verify.py and {project_root}/ops/e2e-test-plan.md

      TASK
      Freeze the terminal V555 evidence and validate the staged V556 queue. Do not repair V555. Validate task count, IDs, deliverables, gates, prior-failure blocks, model policy, prompt endings, and exclusions. No science task depends on this readiness score.

      CONCRETE STEPS
      0. Resolve the repository, git state, protected files, V555 artifacts, active and staged roadmap hashes, and exclusion manifest. Record missing and zero-byte artifacts.
      1. Add or confirm narrow infrastructure REQ-* and SCENARIO-* entries. Write focused tests first.
      2. Emit one terminal row per V555 task with path, bytes, status, honest_verdict, gate summary, readiness, and eligibility.
      3. Validate research-roadmap-next.yaml with the schema, prior-failure validator, exclusion linter, structured gate checker, and duplicate checks.
      4. Require exactly 13 ordered tasks, 13 unique IDs, 13 unique JSON deliverables, milestone 2026.08.556 on every task, and no retired ID or dependency.
      5. Confirm every gate producer exists in this roadmap and declares the exact artifact field in its own REQUIRED ARTIFACT FIELDS.
      6. Confirm every comparative task has per_unit_rows=true. Confirm every blocked contract uses gate_check_summary. Confirm all matching reruns have all four prior-failure fields.
      7. Confirm each live-LLM task declares at least one mandatory GGUF, cached local resolution, embedded tokenizers, and no headline legacy model.
      8. Run focused tests, schema validation, prior-failure validation, exclusion lint, artifact convention checks, and root-clutter checks.
      9. Set v556_queue_integrity_score=1.0 only if every check passes. Otherwise name every failed check and keep a terminal artifact.

      Required deliverable: {project_root}/results/experiment_6460_v556_terminal_handoff_and_queue_integrity.json.
      REQUIRED ARTIFACT FIELDS:
      status, v555_terminal_rows, active_roadmap_hash, staged_roadmap_hash, task_count, task_ids_in_order, unique_id_and_deliverable_check, milestone_consistency_check, schema_validation, prior_failure_validation, exclusion_manifest_validation, structured_gate_validation, gate_producer_contract_rows, model_policy_validation, per_unit_rows, prompt_terminal_line_validation, protected_files_unchanged, v556_queue_integrity_score, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=false. A blocked_* verdict requires gate_check_summary with the failed check, expected value, observed value, and evidence path.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6460_v556_terminal_handoff_and_queue_integrity --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6461-v556-primary-source-freshness-receipt
