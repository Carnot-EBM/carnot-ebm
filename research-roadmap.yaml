- id: exp1261-wopr-kakuro-v3
  milestone: 2026.04.98
  deliverable: results/experiment_1261_wopr_kakuro_v3.json
  title: "WOPR Kakuro Puzzle Cartridge v3 — Integer Sum Constraints, E=0 at Valid Solution"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 20
  priority: high
  requires_gpu: false
  skip_pre_test: false
  prior_failures:
    - experiment_id: exp1240-wopr-kakuro-cartridge
      verdict: blocked_gate_check_failed
      addressed_by: "exp1240 gate-blocked (missing prior_failures). Scope: Kakuro is a distinct puzzle not matching any prior completed WOPR cartridge."
      retire_if_same_verdict: false
    - experiment_id: exp1243-wopr-kakuro-cartridge-v2
      verdict: in_progress
      addressed_by: "exp1243 stale skeleton — agent wrote STEP 0 then stopped. This v3 reduces scope: smaller puzzle (3x3 grid with 2 runs), simpler energy function, tests reduced to 3."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Implement Kakuro puzzle cartridge for the WOPR games gallery.
