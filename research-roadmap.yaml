    - preconditions_checked: principle: "Record inputs and resource observations before measurement."
    - MODEL_SPECS: principle: "Also emit model_specs with resolved file/hash/quantization/runtime for actual model work; no-load work uses []."
    - model_invoked: principle: "Record typed invocation_counts for attempted/completed/failed/cancelled current loads, forwards and generations; keep historical calls separate."
    - inference_substrate_class: principle: "Actual work sets the floor: model_full_generation 60s, model_bounded_generation 10s, model_load_no_generation 2s; never pad time."
    - inference_substrate: principle: "Use aggregation_from_upstream_artifacts for aggregation; option forwards use live_llm_embedding_extraction and readout_kind=option_logits with zero generated tokens."
    - execution_venue: principle: "Use legal value host; record CPU or GPU device identity separately, never host_cpu."
    - duration_s: principle: "Measure monotonic current work, phase_spans and process identity; separate validation and historical time."
    - random_seed: principle: "Freeze model, fitting, ordering and bootstrap seeds before outcomes."
    - reproducibility_checksum: principle: "Bind source_artifact_hashes, input roles, code, settings, raw evidence and current model identity."
    - rows: principle: "Every compared source, event, arm, game or trial retains its absolute metric and disposition. Missing is not zero."
    - sample_size_budget: principle: "Record planned, attempted, completed, excluded, failed, censored and unstarted independent units."
    - acceptance_gate_results: principle: "Every gate records expected, observed, op, passed, category and principle. Completion is not benefit."
    - gate_check_summary: principle: "Blocked verdicts identify the failed check, exact upstream/path/field, expected and observed values, including absence."
    - honest_verdict: principle: "Use complete_ terminal prefixes including complete_blocked_; preserve literal historical verdicts."
    - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. External absence is blocked, never partial."
    - verifier_is_oracle: principle: "Oracle-defined fixture gains are at most circular_positive. Probabilistic energy does not certify source truth."
    - flagged_adversarial: principle: "Preserve actual flags and corrections; never erase a determination to open a gate."
    - validation_receipts: principle: "Record exact scopes, exit codes, output hashes, cold replay and independent reductions."
    - field_principles: principle: "Annotate every emitted field and acceptance gate with the failure it prevents."
    - contract_ready_score: principle: "Bare 0/1 needs exact agreement in both activation states and rejected private mutations."
