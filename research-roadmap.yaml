- id: exp1216-precommit-staged-files-only-fix
  milestone: 2026.04.95
  deliverable: results/experiment_1216_precommit_staged_files_only_fix.json
  title: "Pre-Commit staged_files_only + batching-check Fix — Eliminate Silent Data Loss"
  agent_type: claude
  model: opus
  max_turns: 40
  estimated_wall_time_min: 35
  priority: critical
  requires_gpu: false
  prompt: |
    CONTEXT:
    CRITICAL data-loss pattern identified 2026-05-03: the pre-commit `staged_files_only` plugin
    stashes unstaged changes before running hooks, then restores the stash. When the stash patch
    fails to apply cleanly (base files have shifted), working-tree changes are permanently lost.
    5+ files were lost during the .94 session this way. The `batching-check` hook also
    incorrectly flags GRPO sequential training loops, causing `--no-verify` workarounds.

    Both issues originate in:
    - .pre-commit-config.yaml (staged_files_only setting)
    - scripts/batching_precommit_check.py (exemption mechanism missing)

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write this to results/experiment_1216_precommit_staged_files_only_fix.json NOW:
    {
      "experiment": "1216_precommit_staged_files_only_fix",
      "status": "in_progress",
      "precommit_fail_forward_enabled": false,
      "batching_check_exemption_added": false,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - .pre-commit-config.yaml (find staged_files_only setting per hook)
    - scripts/batching_precommit_check.py (find where exemptions could be added)
    - ops/known-issues.md lines ~295-355 (the data-loss incident description)

    TASK:
    1. Write skeleton artifact (STEP 0).

    2. Fix staged_files_only (data-loss prevention):
       Read .pre-commit-config.yaml to understand the current hook configuration.
       Option A (preferred): set `fail_fast: false` and disable `staged_files_only` for
       the problematic hooks, or globally via the config.
       Option B: add `pass_filenames: false` and `always_run: true` for hooks that
       cause stash conflicts.
       Apply whichever option cleanly prevents the stash-restore data-loss pattern.
       Verify: after change, `pre-commit run --all-files` should NOT stash working-tree changes.

    3. Fix batching-check exemption:
       Read scripts/batching_precommit_check.py.
       Add exemption mechanism: if a line contains `# batching-check: exempt-{reason}`,
       the script skips that block.
       Test: add the marker to a dummy sequential loop, verify the hook passes.
       Apply the marker to any existing GRPO sequential training scripts that fail the hook.

    4. Document the --no-verify policy in ops/known-issues.md:
       Add a brief note under the "staged_files_only" section saying the fix is applied.
       Do NOT remove the existing content (CLAUDE.md no-pruning policy).

    5. Run pre-commit on a representative file to verify no regression:
       pre-commit run --all-files 2>&1 | tail -20

    6. Update artifact with results.

    CONCRETE STEPS:
    - Write skeleton to results/experiment_1216_precommit_staged_files_only_fix.json
    - cat .pre-commit-config.yaml 2>&1
    - cat scripts/batching_precommit_check.py 2>&1
    - [Apply staged_files_only fix to .pre-commit-config.yaml]
    - [Add exemption mechanism to batching_precommit_check.py]
    - pre-commit run --all-files 2>&1 | tail -20
    - python3 -m pytest tests/python --no-cov -q 2>&1 | tail -10
    - Update results/experiment_1216_precommit_staged_files_only_fix.json

    REQUIRED ARTIFACT FIELDS:
    - precommit_config_modified: bool (True if .pre-commit-config.yaml changed)
    - staged_files_only_disabled: bool (True if stash-and-restore pattern eliminated)
    - batching_check_exemption_added: bool (True if exemption marker mechanism added)
    - batching_check_exemption_marker: str (e.g. "# batching-check: exempt-sequential-grpo")
    - precommit_exit_code: int (0 = hooks pass)
    - precommit_fail_forward_enabled: bool (staged_files_only_disabled AND precommit_exit_code == 0)
    - known_issues_updated: bool
    - honest_verdict: "data_loss_fixed" | "partial_fix_stash_still_active" | "blocked"

    Run: pre-commit run --all-files 2>&1 | tail -10
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1217-auto-populate-prior-failures
  milestone: 2026.04.95
  deliverable: results/experiment_1217_auto_populate_prior_failures.json
  title: "Auto-Populate prior_failures from Failure-Ledger at Plan Time — Eliminate DOOMED_RERUN_BLOCK False-Positives"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 25
  priority: critical
  requires_gpu: false
  prompt: |
    CONTEXT:
    7+ DOOMED_RERUN_BLOCK false-positives per milestone because tasks that BUILD ON successful
    prior experiments get flagged by the failure-ledger as "scope-overlapping with prior failures."
    The failure-ledger correctly detects the overlap but misclassifies successful upstreams as
    prior failures. Each false-positive requires ~5 min of operator intervention.

    The fix: a script that runs AFTER the planner generates research-roadmap-next.yaml and BEFORE
    the conductor activates. It:
    1. Reads research-roadmap-next.yaml
    2. For each task, queries scripts/failure_ledger.py for matching_priors
    3. Generates prior_failures stub entries with:
       - prior experiment ID and verdict
       - auto-generated addressed_by text (classification: "successful_upstream" vs "true_failure")
    4. Writes the annotated YAML back to research-roadmap-next.yaml

    EXISTING CODE TO READ FIRST:
    - scripts/failure_ledger.py (FailureLedger class, matching_priors method, query API)
    - research-roadmap-next.yaml (format of prior_failures field — see current milestone tasks)
    - results/experiment_1215_milestone_retro_94.json (confirms 13/13 criteria met)

    TASK:
    1. Write skeleton artifact:
    {
      "experiment": "1217_auto_populate_prior_failures",
      "status": "in_progress",
      "autofill_script_exists": false,
      "honest_verdict": "in_progress"
    }

    2. Read scripts/failure_ledger.py to understand the FailureLedger API.

    3. Write scripts/conductor_priors_autofill.py:
       ```python
       #!/usr/bin/env python3
       """Auto-populate prior_failures stubs in research-roadmap-next.yaml.

       Reads the YAML, queries the failure-ledger for each task's scope, generates
       prior_failures entries to prevent DOOMED_RERUN_BLOCK false-positives.

       Usage: python3 scripts/conductor_priors_autofill.py [--yaml research-roadmap-next.yaml]
       """
       ```
       The script must:
       - Load the roadmap YAML (default: research-roadmap-next.yaml)
       - For each task: query FailureLedger().matching_priors(task_id, task_title)
       - Skip tasks that already have prior_failures populated
       - For priors with verdict in ['PASS', 'complete', 'success', ...]: classify as
         "successful_upstream" with addressed_by: "Prior exp{id} succeeded — this task builds on it."
       - For priors with failure verdicts: classify as "true_failure" with addressed_by stub
         requiring human review: "REVIEW NEEDED: prior exp{id} failed with {verdict}."
       - Write annotated YAML back (preserving all existing content)
       - Print a summary: N tasks scanned, M stubs generated, K already populated

    4. Test the script on research-roadmap-next.yaml:
       python3 scripts/conductor_priors_autofill.py --dry-run 2>&1 | head -30

    5. Write tests in tests/python/test_conductor_priors_autofill.py:
       - test_script_reads_yaml
       - test_script_skips_already_populated
       - test_script_classifies_successful_upstream
       - test_script_writes_back_cleanly

    6. Run tests:
       python3 -m pytest tests/python/test_conductor_priors_autofill.py -v 2>&1 | tail -15

    7. Update artifact with results.

    CONCRETE STEPS:
    - Write skeleton artifact to results/experiment_1217_auto_populate_prior_failures.json
    - cat scripts/failure_ledger.py | head -80 2>&1
    - [Write scripts/conductor_priors_autofill.py]
    - python3 scripts/conductor_priors_autofill.py --help 2>&1
    - python3 scripts/conductor_priors_autofill.py --dry-run 2>&1 | head -30
    - python3 -m pytest tests/python/test_conductor_priors_autofill.py -v 2>&1 | tail -15
    - Update results/experiment_1217_auto_populate_prior_failures.json

    REQUIRED ARTIFACT FIELDS:
    - autofill_script_path: str ("scripts/conductor_priors_autofill.py")
    - autofill_script_exists: bool
    - test_file_path: str ("tests/python/test_conductor_priors_autofill.py")
    - n_tests_pass: int (must be >= 4)
    - n_tests_fail: int (must be 0)
    - dry_run_tasks_scanned: int
    - dry_run_stubs_generated: int
    - honest_verdict: "autofill_script_shipped" | "partial_no_tests" | "blocked"

    Run: python3 scripts/conductor_priors_autofill.py --dry-run
    Do NOT push. Do NOT modify scripts/research_conductor.py.

