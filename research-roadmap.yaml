           + wall-clock + a FLOPs/token proxy + an estimated $/1k-selections. Report the iso-FLOPs accuracy curve
           (accuracy vs total FLOPs for verifier and judge).
        3. Report accuracy_energy_verifier, accuracy_best_judge (the higher of the run judges), accuracy_delta_ci95
           (energy minus best judge, bootstrap >=2000 resamples), cost_ratio (energy cost / best-judge cost). Emit
           efficiency_pareto_holds BARE bool := (energy accuracy within/above the best-prompted judge's bootstrap CI --
           i.e. not significantly worse -- AND cost_ratio <= 0.1). Run adversarial_verify.py (clean;
           verifier_is_oracle=false). Declare random_seed + reproducibility_checksum + model_specs (the judge GGUF ids +
           the stronger prompt + the energy verifier + the cost-accounting). Plausible duration (live judge inference).
