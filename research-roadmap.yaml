        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp6128 is not a transport failure: 720/720 rows were parseable and method-valid with effective K 7.9889, all-wrong 0.10, oracle@K 0.90, tuned SC 0.6889, and aggregate headroom 0.2111. Its readiness still failed because aggregate per-candidate accuracy was 0.723611, while family results were radically non-exchangeable: `finite_domain_scheduling=1.0`, `logic_grid=1.0`, and `typed_finite_choice=0.170833` below its enumerated 0.25 floor. arXiv:2608.02966 shows that wrong-option identity can expose fallback and position behavior hidden by binary accuracy. This diagnostic runs on immutable rows only. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/ops/known-issues.md
