- id: exp957-fr
  milestone: 2026.04.74
  deliverable: results/experiment_957_fr.json
  title: "FR-11 JEPA v23 \u2014 SC-Energy Coherence Labels as Training Signal"
  prompt: "FR-11 (autonomous self-learning loop) JEPA has stalled below OOD AUC=0.75 across\nv17-v22 (6\
    \ consecutive milestones). Root cause: self-supervised loss lacks\ndiscriminative gradient toward\
    \ OOD boundary.\nJEPA v23 approach:\n  1. Load JEPA v22 checkpoint as starting point\n  2. Compute\
    \ SC-Energy coherence scores for training examples (from Exp 944 model)\n  3. Add auxiliary classification\
    \ loss: predict SC-Energy coherence bucket (high/low)\n     from JEPA latent representation. Loss\
    \ weight: 0.3 (auxiliary) / 0.7 (world model)\n  4. Train for 50 epochs on JAX with CPU\n  5. Evaluate\
    \ OOD AUC on held-out set (same protocol as v17-v22)\nIf OOD AUC > 0.75: honest_verdict = jepa_v23_ood_viable.\
    \ Close FR-11 RETRO.\nIf OOD AUC <= 0.75 (same verdict as v17-v22): honest_verdict = jepa_retired.\n\
    \  Add JEPA-v17-v22-all-ooe-below-target to exclusion manifest.\n  Write FR-11 status: \"JEPA approach\
    \ to OOD detection not viable after 7 attempts.\n  Alternative: use SC-Energy directly as the OOD\
    \ detector (AUROC=0.9017).\"\nUse JAX_PLATFORMS=cpu for reproducibility (per CLAUDE.md).\n\n\nExpected\
    \ result schema:\nauxiliary_loss_weight: float\nepochs_trained: int\nhonest_verdict: str\nood_auc:\
    \ float\n"
  priority: medium
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
