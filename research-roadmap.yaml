    verdict: complete_null_restricted_action_methods
    addressed_by: Keep the acceptance mask, but replace unchanged radial fitting with finite utility-residual patches
      and equally patched simple controls.
    retire_if_same_verdict: true
  - experiment_id: exp8212-memory-benefit-audit
    verdict: complete_null_independent_memory_benefit_audit
    addressed_by: Replace error-selected center growth with released-feedback group corrections and a global-only
      control.
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V709 energy versus restricted logistic gained only 0.00390625 cost per intended slot; its lower bound was negative. Center growth also lost to fixed centers. Utility-calibration patching offers a different measurable correction mechanism.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; research-references.md; python/carnot/verify/restricted_action_methods_8207.py; python/carnot/verify/restricted_energy_8208.py; python/carnot/verify/calibrated_memory_methods_8180.py; openspec/change-proposals/v707-calibrated-memory-protocol.json; openspec/change-proposals/v709-restricted-action-protocol.json; results/experiment_8208_v709_restricted_energy_fit.json; results/experiment_8212_v709_memory_benefit_audit.json
    TASK:
    Freeze utility witnesses and matched energy correction controls. Deliver results/experiment_8219_v710_utility_patch_methods.json. Create the thin runner scripts/experiments/experiment_8219_v710_utility_patch_methods.py and primitive evidence under results/raw/experiment_8219_v710_utility_patch_methods/. Keep scientific benefit separate from execution readiness.
