        addressed_by: "exp4258 blocked because the grown pool's gap3_stage2 task_ids carried no recoverable game/family identity. This task does NOT re-run the blocked cross-game TEST; it FIXES the root cause first -- it recovers per-row family/game provenance by joining raw_task_id/source_id back to the source ARC tasks + the ARC-TGI family taxonomy (2603.05099) + the 25-game survey, and materializes an explicit provenance manifest (Reliability Gap 2606.03305). The cross-family test then runs in exp4271/exp4272 ON the recovered manifest."
