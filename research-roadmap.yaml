    prompt: |
      CONTEXT: The previous milestone (.187) cascade-failed because the test harness is currently broken, blocking all downstream autonomous research.
      EXISTING CODE TO READ FIRST: `tests/python/`, `ops/conductor-log.md`
      TASK: Execute a deep debugging pass to identify and resolve the failing Python pretests.
      CONCRETE STEPS:
      1. Run `python scripts/check_spec_coverage.py` and `pytest tests/python --cov=python/carnot`.
      2. Identify the root cause of the failing tests reported in `.187` conductor log.
      3. Implement the fixes ensuring 100% test coverage and compliance with `_bmad/traceability.md`.
      4. Write deliverable to `results/experiment_1798_pretest_fix.json`

      Current date is {date}. Project root is {project_root}.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

