    prompt: |
      CONTEXT
      Exp6420 correctly nullified the V552 CSL claim. V553 must not trust new positive summaries from Exp6430 through Exp6432. This audit is deliberately ungated so missing, skipped, blocked, null, flagged, and underpowered upstream states remain visible. It must recompute from immutable rows with an independent implementation and preserve every historical determination. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6420_csl_authenticity_safety_audit.json, source, and tests
      - {project_root}/results/experiment_6430_prospective_write_once_memory_capacity_frontier.json and sidecars if present
      - {project_root}/results/experiment_6431_controlled_memory_interference_ab.json if present
