  - id: exp3584-diagnose-329-null-positive-control-audit
    milestone: "2026.05.330"
    title: "Diagnose the .329 null — confirm corpus degeneracy + verifier inertia, enumerate per-domain APPLICABLE verifiers (positive-control audit)"
    priority: critical
    max_turns: 40
    agent_type: gemini
    estimated_wall_time_min: 14
    track: evidence
    inference_substrate: aggregation_from_upstream_artifacts
    requires_gpu: false
    deliverable: results/experiment_3584_diagnose_329_null_positive_control.json
    prompt: |
      CONTEXT: a null result ("verifier does not generalize") is NOT a finding unless a positive control
      passed (CLAUDE.md FALSE_NEGATIVE_RISK). .329's cross-domain null must be diagnosed before it can be
      trusted OR refuted. This task establishes WHY it is contaminated and what a fair test requires.
      EXISTING CODE TO READ FIRST: results/experiment_3573_verifier_code_bug_error_detection.json +
      results/experiment_3574_verifier_factual_hallucination_error_detection.json (read via
      scripts/summarize_artifact.py AND raw); the verifier inventory under python/carnot/verify/ —
      especially the factual-applicable set (semantic_energy.py, nla_verifier_v3.py,
      canonical_answer_vericot_grounding_pilot_v1.py, suppressed_retrieval_probe.py,
      tier0u_logical_consistency.py, tier0v_set_consistency.py, tier0w_paraphrase_consistency.py,
      fover_semantic_calibration.py) and the code-applicable set (ast_structure_verifier.py,
      code_structural_dependency_verifier.py, controlled_invariance_executor_v2.py,
      executable_monitor_runtime_adapter.py); data/qa_dataset_1000.json (the .329 factual corpus).
      CONCRETE STEPS:
        1. Confirm the two contamination signals quantitatively: (a) the .329 model-confidence baseline
           AUROCs (1.0 facts, 0.8992 code) — characterize WHY (are the negatives trivially separable? is
           qa_dataset_1000.json's incorrect-answer construction degenerate, e.g. random/empty/format-broken
           strings, so confidence trivially wins?); (b) the per-verifier inertia (every per-verifier AUROC
           == 0.5 in exp3574) — confirm which verifiers were actually in the .329 ensemble vs which
           factual/code-applicable verifiers were OMITTED.
        2. Enumerate, per domain (facts, code), the verifiers that are STRUCTURALLY APPLICABLE (could fire)
           vs STRUCTURALLY INERT (constraint verifiers on facts cannot fire by construction). Output the
           applicable-verifier set that a fair .330 test must use.
        3. State the positive-control requirement: a fair test needs (i) a corpus where confidence AUROC is
           materially < 1.0 (real headroom), and (ii) the per-domain applicable verifier set.
      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict: {{principle: "Terminal prefix for reconciler classification."}}
        inference_substrate: {{value: aggregation_from_upstream_artifacts, principle: "Reads .329 artifacts + source files; no live inference."}}
        confidence_baseline_degenerate: {{principle: "A confidence AUROC of 1.0 means no headroom; flags the corpus as the contamination source, not the verifier as domain-bound."}}
        qa_corpus_degeneracy_cause: {{principle: "Names the concrete construction flaw so .330's corpus build avoids it."}}
        per_verifier_inertia_confirmed: {{principle: "Confirms per-verifier=0.5 == verifiers never fired, distinguishing 'lost a fair fight' from 'was never in the fight'."}}
        applicable_verifiers_facts: {{principle: "The factual-applicable verifier set a fair test must score — the .329 omission this milestone repairs."}}
        applicable_verifiers_code: {{principle: "The execution-applicable verifier set for the code re-test."}}
        positive_control_requirements: {{principle: "The two conditions (real headroom + applicable verifiers) that make a cross-domain null trustworthy."}}
        random_seed: {{principle: "Determinism precondition."}}
        reproducibility_checksum: {{principle: "Drift detection."}}
        duration_s: {{principle: "Plausibility floor."}}
      ACCEPTANCE GATE:
        - condition: "confidence_baseline_degenerate present AND applicable_verifiers_facts present AND applicable_verifiers_code present"
          principle: "The milestone cannot proceed to a fair re-test without naming the contamination cause and the per-domain applicable verifier sets."
      TERMINAL VERDICTS: "complete: diagnosed_329_null_contaminated_confidence_degenerate_verifiers_inert_applicable_sets_enumerated" /
      "complete: diagnosed_329_null_actually_valid_positive_control_held_math_only_earned"
      Run: cd {project_root} && python scripts/experiment_3584_diagnose_329_null_positive_control.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3585-build-realistic-factual-hallucination-corpus
    milestone: "2026.05.330"
    title: "Build a REALISTIC factual hallucination corpus where model-confidence is NOT a perfect detector (TruthfulQA-style / Mu-SHROOM, fact-level labels)"
    priority: critical
    max_turns: 60
    agent_type: gemini
    estimated_wall_time_min: 30
    track: evidence
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: results/experiment_3585_realistic_factual_corpus.json
    prompt: |
      CONTEXT: .329's factual test used data/qa_dataset_1000.json, where model-confidence scored AUROC 1.0 —
      a degenerate corpus with no headroom. A fair generalization test needs a REALISTIC corpus where
      confidence is a MEDIOCRE detector (TruthfulQA reports >50% baseline hallucination; the SOTA detection
      recipe per Mu-SHROOM/HalluSearch combines retrieval + NLI BECAUSE confidence alone is weak). Build
      that corpus.
      EXISTING CODE TO READ FIRST: results/experiment_3584 (the diagnosis — qa corpus degeneracy cause);
      scripts/experiment_template.py (cached_sota_pair() + BatchedInferenceRunner pattern);
      data/qa_dataset_1000.json (the corpus to AVOID replicating); data/llm_failure_exemplars.jsonl.
      PRECONDITIONS (step 0, check BEFORE any generation):
        a. PREFER an existing realistic labeled corpus: if a TruthfulQA / Mu-SHROOM / SHROOM / FELM /
           HaluEval file is already on disk OR fetchable via `curl -sf` to a public dataset URL, use it.
           Check `curl -sf -o /dev/null https://huggingface.co/api/datasets` for network.
        b. ELSE generate one: verify a SOTA GGUF is cached —
           `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/` (or gemma-4-31B-it-GGUF /
           gemma-4-26B-A4B-it-GGUF) returns non-empty. If neither a corpus nor a cached model is available
           -> honest_verdict "complete: blocked_no_realistic_corpus_and_no_cached_sota_model".
        c. CUDA/llama.cpp loadable for generation:
           `python -c "from carnot.inference.sota_models import cached_sota_pair; assert cached_sota_pair(gpu_indices=(0,1))"`.
           If not -> "complete: blocked_sota_model_not_loadable".
      CONCRETE STEPS:
        1. Assemble >= 200 (question, answer, is_hallucination) triples with fact-level labels. If
           generating: use a mandated SOTA GGUF (MODEL_SPECS MUST include at least one of
           unsloth/Qwen3.6-35B-A3B-GGUF / unsloth/gemma-4-31B-it-GGUF / unsloth/gemma-4-26B-A4B-it-GGUF via
           cached_sota_pair) to produce answers to open-domain factual questions; label correctness against
           a reference (the dataset's gold answers / retrieval). Include genuinely-confident-but-wrong
           hallucinations (NOT random/empty strings) — that is what makes confidence a weak detector.
        2. SANITY GATE (the whole point): compute the model-confidence / sequence-logprob AUROC on this
           corpus. It MUST be materially < 0.95 (real headroom). If it comes out ~1.0, the corpus is still
           degenerate — report that honestly and explain why (do not ship a degenerate corpus as realistic).
        3. Persist the corpus to data/realistic_factual_corpus_v1.jsonl with class balance recorded.
      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict: {{principle: "Terminal prefix for reconciler classification."}}
        inference_substrate: {{value: live_llm_inference, principle: "Declares live SOTA generation (60s floor) if generated; honest about compute used."}}
        preconditions_checked: {{principle: "Records which resources were verified before generation — pre-empts fabrication-when-resource-missing."}}
        corpus_source: {{principle: "Provenance: fetched dataset name+URL or generated-by-MODEL — audit trail for the corpus."}}
        n_examples: {{principle: "Sample-size rigor; >=200 for a percentage-point AUROC claim downstream."}}
        n_hallucinated: {{principle: "Class balance — an AUROC on a 99/1 split is uninformative."}}
        n_correct: {{principle: "Class balance."}}
        confidence_baseline_auroc_on_corpus: {{principle: "THE realism gate: must be < 0.95 so verifiers have headroom to demonstrate value; a 1.0 here means the corpus is still degenerate."}}
        corpus_is_realistic: {{value: bool, principle: "True iff confidence AUROC < 0.95 — the positive-control precondition for every downstream domain test."}}
        model_specs: {{principle: "Names the SOTA GGUF actually invoked (or the dataset) — methodology traceability."}}
        random_seed: {{principle: "Determinism precondition."}}
        reproducibility_checksum: {{principle: "Drift detection across replications."}}
        duration_s: {{principle: "Plausibility floor — live 35B generation cannot complete in <60s."}}
      ACCEPTANCE GATE:
        - condition: "n_examples >= 200 AND confidence_baseline_auroc_on_corpus present AND corpus_is_realistic == True"
          principle: "A realistic corpus is defined by confidence NOT being a near-perfect detector; without that headroom the downstream null is uninformative (the .329 failure mode)."
      TERMINAL VERDICTS: "complete: realistic_factual_corpus_built_confidence_auroc_FF_headroom_confirmed" /
      "complete: corpus_still_degenerate_confidence_near_perfect_realistic_factual_test_blocked" /
      "complete: blocked_<resource>"
      Run: cd {project_root} && python scripts/experiment_3585_realistic_factual_corpus.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3586-score-factual-applicable-verifiers
    prior_failures:
      - experiment_id: exp3574-verifier-ensemble-factual-hallucination-error-detection
        verdict: complete_verifier_ensemble_factual_auroc_at_baseline_ensemble_is_constraint_domain_bound
        addressed_by: "exp3574 scored only 2 verifiers (SemanticConsistencyVerifier, IsingVerifier), BOTH inert at AUROC=0.5, on a degenerate corpus (confidence AUROC=1.0). This task is DIFFERENT: it scores the FULL factual-APPLICABLE verifier set enumerated by exp3584 (semantic_energy, nla_verifier_v3, canonical_answer_vericot_grounding_pilot, suppressed_retrieval_probe, tier0u/v/w) on the REALISTIC corpus (exp3585, confidence AUROC<0.95). New verifier set + new non-degenerate corpus = a fair positive-control test, not a re-run."
        retire_if_same_verdict: false
    milestone: "2026.05.330"
    title: "Score the factual-APPLICABLE verifiers on the realistic corpus — which actually FIRE (per-verifier AUROC > 0.5)?"
    priority: critical
    max_turns: 50
    agent_type: gemini
    estimated_wall_time_min: 22
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    gated_on:
      - upstream: exp3585-build-realistic-factual-hallucination-corpus
        artifact_field: corpus_is_realistic
        op: '=='
        value: true
    deliverable: results/experiment_3586_score_factual_applicable_verifiers.json
    prompt: |
      CONTEXT: the .329 factual ensemble was inert (per-verifier=0.5) because only 2 non-applicable verifiers
      were scored. This task scores the FACTUAL-APPLICABLE verifier set (per exp3584) on the realistic corpus
      (exp3585) to answer: is the ensemble inert by COMPOSITION (fixable — wrong verifiers) or genuinely
      DOMAIN-BOUND (no semantic/grounding verifier carries factual signal even when applicable)?
      EXISTING CODE TO READ FIRST: results/experiment_3584 (applicable_verifiers_facts) +
      results/experiment_3585 (the realistic corpus path) via scripts/summarize_artifact.py;
      python/carnot/verify/semantic_energy.py, nla_verifier_v3.py,
      canonical_answer_vericot_grounding_pilot_v1.py, suppressed_retrieval_probe.py,
      tier0u_logical_consistency.py, tier0v_set_consistency.py, tier0w_paraphrase_consistency.py,
      fover_semantic_calibration.py; the ensemble composition / scoring harness used in exp2837.
      PRECONDITIONS (step 0):
        a. data/realistic_factual_corpus_v1.jsonl present and corpus_is_realistic==True from exp3585. If not
           -> "complete: blocked_realistic_corpus_unavailable".
        b. The factual-applicable verifiers importable. If a verifier errors on import, record it inert and
           continue (do not fabricate a score).
      CONCRETE STEPS:
        1. Score EACH factual-applicable verifier individually on the corpus; compute per-verifier
           error-detection AUROC (label = is-hallucination), >= 3 seeds, bootstrap CI.
        2. Score the AND/OR/energy-sum ensemble of the applicable verifiers; compute ensemble AUROC + CI.
        3. Compare to the model-confidence baseline AUROC (from exp3585, < 0.95).
        4. Identify which verifiers FIRE (AUROC CI excludes 0.5) vs which remain inert.
      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict: {{principle: "Terminal prefix for reconciler classification."}}
        inference_substrate: {{value: verifier_ensemble_against_cached_candidates, principle: "Scores verifiers against the cached labeled corpus; does NOT load the LLM (1s floor)."}}
        per_verifier_auroc: {{principle: "Which verifiers carry factual signal — distinguishes composition-inertia from genuine domain-boundedness."}}
        verifiers_that_fire: {{principle: "The set whose AUROC CI excludes 0.5 — the non-inert factual signal, if any."}}
        applicable_ensemble_auroc: {{principle: "The fair-composition ensemble score — the number the .329 test should have produced."}}
        confidence_baseline_auroc: {{principle: "Strong baseline; the verifier must beat or augment it to add value."}}
        ensemble_minus_confidence_delta: {{principle: "Signed value of the ensemble over a strong baseline, with CI — the core comparison."}}
        n_examples: {{principle: "Sample-size rigor (>=200)."}}
        ensemble_non_inert: {{value: bool, principle: "True iff applicable_ensemble_auroc CI excludes 0.5 — the positive control for 'verifiers can fire on facts at all'."}}
        random_seed: {{principle: "Determinism precondition."}}
        reproducibility_checksum: {{principle: "Drift detection."}}
        duration_s: {{principle: "Plausibility floor (>=1s for ensemble scoring)."}}
      ACCEPTANCE GATE:
        - condition: "per_verifier_auroc present AND applicable_ensemble_auroc present AND confidence_baseline_auroc present"
          principle: "A fair domain test reports the applicable ensemble vs a strong baseline with per-verifier attribution — an inert result HERE (with the right verifiers + a real corpus) is the EARNED domain-bound finding."
      TERMINAL VERDICTS: "complete: factual_applicable_verifiers_fire_ensemble_non_inert_composition_was_the_329_bug" /
      "complete: factual_applicable_verifiers_still_inert_on_realistic_corpus_domain_bound_earned" /
      "complete: blocked_realistic_corpus_unavailable"
      Run: cd {project_root} && python scripts/experiment_3586_score_factual_applicable_verifiers.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3587-prototype-retrieval-nli-factual-grounding-verifier
    milestone: "2026.05.330"
    title: "Prototype a retrieval/NLI atomic-claim factual-grounding verifier (the Mu-SHROOM/HalluSearch SOTA recipe) + eval vs confidence"
    priority: high
    max_turns: 60
    agent_type: gemini
    estimated_wall_time_min: 30
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3587_retrieval_nli_factual_grounding_verifier.json
    prompt: |
      CONTEXT: if exp3586 shows the EXISTING factual verifiers are inert even on a realistic corpus, the gap
      is that Carnot has NO verifier implementing the SOTA factual-detection recipe: decompose the answer
      into atomic claims -> retrieve evidence -> NLI entailment (DeBERTa-class) of each claim vs evidence ->
      energy = fraction of unentailed/contradicted claims. This task prototypes that grounding verifier and
      tests whether it gives the ensemble a real factual signal. (If exp3586 ALREADY found a firing verifier,
      this task still adds the grounding verifier as a complementary axis and measures the combined lift.)
      VERIFIER AUTHENTICITY (CLAUDE.md): the implementation MUST match its docstring. If it claims NLI, it
      MUST invoke a real entailment model (a small DeBERTa/MiniLM NLI checkpoint via transformers, or an
      honest text-statistical proxy with the gap DISCLOSED in the docstring per the pcib_probe.py pattern).
      NO np.random features, NO sleep-padding, NO score-capping. Name it for what it does
      (RetrievalNLIGroundingVerifier), not a fake model name.
      EXISTING CODE TO READ FIRST: python/carnot/verify/canonical_answer_vericot_grounding_pilot_v1.py
      (the existing grounding pilot — extend it, don't duplicate), suppressed_retrieval_probe.py,
      semantic_energy.py; results/experiment_3585 + 3586; CLAUDE.md "Verifier Authenticity Discipline".
      PRECONDITIONS (step 0):
        a. data/realistic_factual_corpus_v1.jsonl present (exp3585). If not -> "complete: blocked_realistic_corpus_unavailable".
        b. An NLI checkpoint is loadable OR a disclosed text-statistical entailment proxy is used. If the
           task intends a model-based NLI but no checkpoint is cached and none is fetchable, FALL BACK to the
           disclosed-proxy implementation (document the gap) rather than fabricating — and record which path
           was taken in nli_substrate.
      CONCRETE STEPS:
        1. Implement python/carnot/verify/retrieval_nli_grounding_verifier.py: atomic-claim split ->
           evidence (the corpus's reference/gold context, or a simple retrieval over it) -> per-claim
           entailment -> aggregate energy. Honest docstring matching the implementation.
        2. Score it on the realistic corpus; error-detection AUROC + >=3 seeds + CI.
        3. Compare vs (a) model-confidence baseline, (b) the best EXISTING factual verifier (exp3586).
        4. Measure the ensemble WITH the new verifier added vs the ensemble WITHOUT it.
      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict: {{principle: "Terminal prefix for reconciler classification."}}
        inference_substrate: {{value: verifier_ensemble_against_cached_candidates, principle: "Scores against the cached corpus; the NLI model is a verifier component, not the FoVer LLM."}}
        nli_substrate: {{principle: "Declares model-based NLI vs disclosed text-statistical proxy — verifier-authenticity honesty (implementation matches docstring)."}}
        grounding_verifier_auroc: {{principle: "The new verifier's standalone factual signal + CI."}}
        confidence_baseline_auroc: {{principle: "Strong baseline to beat or augment."}}
        best_existing_factual_verifier_auroc: {{principle: "Shows whether the new build adds signal the existing verifiers lacked."}}
        ensemble_with_grounding_auroc: {{principle: "Ensemble incl. the new verifier — the additive-value test."}}
        ensemble_without_grounding_auroc: {{principle: "Ablation baseline — isolates the grounding verifier's contribution."}}
        grounding_adds_factual_signal: {{value: bool, principle: "True iff the grounding verifier's AUROC CI excludes 0.5 AND ensemble_with > ensemble_without — the core build-success signal."}}
        n_examples: {{principle: "Sample-size rigor (>=200)."}}
        random_seed: {{principle: "Determinism precondition."}}
        reproducibility_checksum: {{principle: "Drift detection."}}
        duration_s: {{principle: "Plausibility floor."}}
      ACCEPTANCE GATE:
        - condition: "grounding_verifier_auroc present AND ensemble_with_grounding_auroc present AND ensemble_without_grounding_auroc present"
          principle: "The build is judged by whether a domain-applicable verifier (retrieval+NLI) gives the ensemble factual signal it structurally lacked — measured as an ablation, not asserted."
      TERMINAL VERDICTS: "complete: retrieval_nli_grounding_verifier_adds_factual_signal_ensemble_generalizes_to_facts" /
      "complete: retrieval_nli_grounding_verifier_built_but_factual_signal_weak_facts_remain_hard" /
      "complete: blocked_realistic_corpus_unavailable"
      Run: cd {project_root} && python scripts/experiment_3587_retrieval_nli_factual_grounding_verifier.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3588-corrected-cross-domain-remeasurement
    prior_failures:
      - experiment_id: exp3576-verifier-cross-domain-synthesis
        verdict: complete_verifier_cross_domain_synthesis_value_generalizes_math_only_domain_bound
        addressed_by: "exp3576 synthesized a 'math-only' verdict from the contaminated .329 tests (degenerate corpora + inert/wrong verifier sets). This task re-measures cross-domain generalization with the FAIR test: realistic corpora (exp3585) + per-domain APPLICABLE verifier sets (exp3584/3586) + the new grounding verifier (exp3587) + execution-applicable verifiers re-scored on code. New corpora + new verifier composition + a valid positive control = a fair re-measurement, not a re-run of the contaminated test."
        retire_if_same_verdict: false
    milestone: "2026.05.330"
    title: "Corrected cross-domain re-measurement — math (0.9131) | code | facts with APPLICABLE verifiers + realistic corpora + strong confidence baseline"
    priority: high
    max_turns: 50
    agent_type: gemini
    estimated_wall_time_min: 22
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    gated_on:
      - upstream: exp3586-score-factual-applicable-verifiers
        artifact_field: applicable_ensemble_auroc
        op: '>='
        value: 0.0
    deliverable: results/experiment_3588_corrected_cross_domain_remeasurement.json
    prompt: |
