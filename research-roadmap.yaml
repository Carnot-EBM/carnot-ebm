        verdict: "complete: accepted 1 non-duplicate actionable V511 source delta; no roadmap ID or gate change"
        addressed_by: "This starts strictly after the V512 planner marker, treats zero findings as complete, forbids compute-duration claims, and maps only genuinely new evidence to the already allocated graph."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      The V512 planner already indexes Generative Compilation, Gate-Zero Growth, SMC-ES, Campaign Diagrams, Bridge Evidence, verified DPLL transitions, KAN cost evidence, and the photonic-Ising boundary. This bounded freshness pass must not silently redesign the graph or claim benchmark compute from web search. Today is {date}.

