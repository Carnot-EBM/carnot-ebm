    1. Write tests first for finite-gain residual updates, raw accumulation, stale-pressure release,
       equal capacity, read-only active episodes, post-outcome commit, canonical bytes, support
       rollback, restart, and future-feature denial.
    2. Freeze capacity, gains, decay, operation proposals, update cadence, eviction, seeds, and five
       event orders. Fit public constants on development rows only. All arms receive the same
       candidates, exact checks, state budget, and work allowance.
    3. At each event select from the immutable decision snapshot. Reveal the exact receipt after the
       action. The residual arm updates toward projected constraint pressure with finite gain. The
       raw arm accumulates signed violations without residual control. Random updates remain valid.
    4. Before commit, check current utility, retention anchors, hard cases, and sealed held-future
       best-at-k support through the allowed post-event audit. Reject or roll back threshold harm.
