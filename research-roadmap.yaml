        retire_if_same_verdict: true
      - experiment_id: exp2865
        verdict: "complete: cross-corpus matrix used two clean rows but did not decompose HaluEval/FEVER error modes"
        addressed_by: "This audit adds data-driven vs reasoning-driven buckets and localization metrics before matrix v6."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        HaluEval/FEVER is now a clean non-FoVer row, but its scalar AUROC is weak.
        Recent LaaB, VERGE, EBCN, and HalluGuard work suggests measuring whether
        verifier outputs localize errors and whether label-consistency signals
        separate data-driven from reasoning-driven failures.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - CODEX.md
        - research-references.md
        - results/experiment_2864_halueval_fever_full_calibration_v3.json
        - results/experiment_2865_cross_corpus_matrix_v5.json
