        actions_delta_ci:
          principle: "bootstrap CI on the actions delta; an efficiency claim requires the CI to exclude the baseline (FALSE_NEGATIVE_RISK guard against a small-sample artifact)."
        efficiency_score_min_human_agent_sq:
          principle: "min(human/agent,1)^2 with the human baseline from the replay corpus -- the literal leaderboard scoring term this lever moves."
        generic_transfer_rate_with_predictor:
          principle: "held-out variant transfer WITH the predictor vs the 0.04 baseline -- the second leaderboard-relevant signal."
        solve_rate_preserved:
          principle: "HARD gate -- the efficiency win must NOT drop solve-rate (a faster explorer that gives up is worse)."
        positive_control_passed:
          principle: "the learnable-clickability game where predictor-ranking must beat blind; a null is valid only if this passed (guards a broken/no-op predictor -- the .421 A1 trap)."
        false_negative_risk_checked:
          principle: "a no-value null is valid only if the positive control passed."
        null_delta_methodology_note:
          principle: "present when actions_delta==0.0 -- states the equality is an honest no-gain null, not a measurement bug."
        chosen_submitted_config:
