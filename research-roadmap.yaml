- id: exp731-zombie-kill-preflight-v8
  milestone: 2026.04.56
  deliverable: results/experiment_731_zombie_kill_preflight_v8.json
  title: 'Exp 731: GPU Zombie Kill + Pre-flight v8 + Manifest Enforcement Audit (MANDATORY FIRST)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Milestone .55 closed dirty for the first time in 14 milestones. PID 368449
    holds 24082MB on GPU 1 at 0% utilization (zombie from Exp 724 or 726). Until killed,
    dual-GPU experiments cannot allocate GPU 1. Additionally, the conductor projection vs
    actual wall-time gap in .55 was 787 minutes — root cause: the conductor_exclusion_manifest
    is written at text level but never enforced at dispatch. Legacy experiments re-enter the
    queue. This experiment cannot modify scripts/research_conductor.py (user constraint), but
    it MUST document exactly what code change is needed (file path + line number + diff) and
    implement a validate_manifest_at_dequeue() helper for the conductor to call.

    EXISTING CODE TO READ FIRST:
    - scripts/conductor_exclusion_manifest.json — current exclusion list.
    - python/carnot/pipeline/exclusion_manifest.py — ExclusionManifest class.
    - scripts/conductor_pre_flight.py — pre-flight runner (incremental mode from Exp 716).
    - scripts/research_conductor.py — read-only; find dequeue dispatch point, document it.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - results/experiment_716_preflight_v7.json — v7 baseline (incremental_mode=True).

    TASK: Kill GPU 1 zombie process. Confirm incremental test selection is operational.
    Document manifest enforcement gap with exact diff. Implement validate_manifest_at_dequeue().

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-INFRA-046 (conductor dispatch MUST call validate_manifest_at_dequeue(task_id)
       before starting any experiment; retired tasks MUST be silently skipped),
       REQ-INFRA-047 (GPU VRAM must be < 100MB on all devices at start of each milestone),
       SCENARIO-INFRA-055/056 to openspec/capabilities/pipeline/spec.md.
    3. Kill zombie GPU process:
       a. Run `nvidia-smi` to confirm PID 368449 still holds VRAM on GPU 1.
       b. If still present: import os, signal; os.kill(368449, signal.SIGKILL).
       c. Re-run `nvidia-smi` to confirm GPU 1 VRAM < 100MB.
       d. If PID 368449 not found: log "zombie_already_cleared".
    4. Validate incremental test selection:
       a. Re-run incremental selector on current clean diff.
       b. Expected: 0 tests selected (clean repo → no changed modules).
       c. Log: incremental_mode=True, tests_selected count, confirmation=True/False.
    5. Audit manifest enforcement gap:
       a. Read scripts/research_conductor.py (read-only).
       b. Find the dequeue/dispatch loop — identify exact file path + line number where
          tasks are dispatched to execution.
       c. Write results/manifest_fix_patch.txt with the required diff as a human-action
          item. Format: file, line_range, what to insert (call to
          validate_manifest_at_dequeue(task_id)).
    6. Implement scripts/conductor_manifest_validator.py:
       a. Function validate_manifest_at_dequeue(task_id: str) -> bool.
       b. Load scripts/conductor_exclusion_manifest.json.
