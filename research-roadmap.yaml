       SCENARIO-LEARN-075/076/077 to spec.md.
    3. Create python/carnot/training/fover_z3_labeler.py:
       a. Z3StepVerifier: uses z3 Python library.
          try: import z3; z3_available=True
          except: z3_available=False
       b. extract_arithmetic_claim(step_text: str) -> z3.BoolRef | None:
          Extract arithmetic equation from step text. Convert to Z3 expression.
          Example: "47 + 28 = 75" → z3.Int("lhs") == 47 + 28 → z3.Assert(75 == 47+28).
          Return None if no parseable arithmetic.
       c. verify_step_z3(prior_steps: list[str], current_step: str) -> str:
          Build Z3 solver. Add prior arithmetic as premises. Check if current_step
          follows. Return: "correct" | "violation" | "unparseable".
