    \ was not met. Root cause analysis: KAEM was benchmarked at n_vars ≤ 100, where MCMC\
    \ mixing time is still manageable. The crossover point where KAEM beats MCMC decisively\
    \ is expected at n_vars > 200, where MCMC mixing time grows super-linearly due to the\
    \ curse of dimensionality in the Ising lattice.\n\n\
    KAEM (arXiv 2506.14167) uses inverse-transform sampling without MCMC — constant-time\
    \ sampling per variable regardless of the correlation structure. Published claim: 1.29x\
    \ at n_vars=100 but the crossover is at n_vars~200 based on scaling analysis.\n\n\
    This experiment profiles KAEMEnergy at n_vars = (50, 100, 200, 500, 1000) and finds\
