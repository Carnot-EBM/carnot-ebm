    11. Run scoped unit tests, real private CLI checks, Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Run applicable ops/e2e-test-plan.md checks, including private E2E-018 and E2E-021 for authority/publication consumers. Require 100 percent newly owned statement coverage, including genuine children and rejection paths. Collect original test node IDs before disjoint bounded children. Retain their exact union and original authority. Use -n 0 -o addopts= --no-cov. Never run the full repository suite or a nested historical validation controller. A killed child fails validation. Retain commands, exits, durations and log hashes.
