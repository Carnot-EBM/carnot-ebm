- id: exp1031-energy-ssd-v3
  milestone: 2026.04.80
  deliverable: results/experiment_1031_energy_ssd_v3.json
  title: "Energy-Selection SSD v3 — FR-11 Mandatory Self-Learning Experiment (Standalone)"
  prompt: |
    CONTEXT:
    This is the MANDATORY continuous self-learning experiment for milestone .80 per
    research-program.md FR-11 (Autonomous Self-Learning Loop). Energy-Selection SSD has been
    blocked for 3 consecutive milestones: Exp 733 (below_baseline, synthetic data only),
    Exp 1006 (.78, DOOMED_RERUN_BLOCK — missing prior_failures), Exp 1015 (.79, blocked because
    preflight never ran). This experiment is STANDALONE — it does NOT gate on preflight.

    Core idea: use Carnot's energy function as the selection filter for self-distillation.
    Generate N candidate outputs from a SOTA LLM; keep only outputs where energy(output) <
    energy_threshold (high confidence = low energy = correct). Train a small student on the
    filtered set. Compare to temperature-only SSD baseline (no energy filtering).

    Inspired by arXiv 2604.01193 (SSD: Self-Distillation without a Teacher) and arXiv 2601.18734
    (Self-Distilled Reasoner). SSD's key finding: models improve by training on their own
    high-confidence outputs (bottom 25% temperature) without any external teacher.
    Carnot's energy function is a better confidence proxy than temperature for reasoning tasks.

    EXISTING CODE TO READ FIRST:
