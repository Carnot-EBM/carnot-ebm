- id: exp7064-exact-entrance-constraint-fixture
  title: Exact source-grouped entrance constraint fixture
  track: constraint-energy
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.09.619
  deliverable: results/experiment_7064_v619_exact_entrance_fixture.json
  prior_failures:
    - experiment_id: exp5708-sota-exact-constraint-canary
      verdict: "blocked: parse_failures"
      addressed_by: "Exp7064 builds deterministic exhaustive entrance labels and replayed witnesses before any model output, instead of depending on a live model parser."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V618 did not execute its planned entrance fixture. Entrance locking and
    SymStep suggest that first-branch support and atomic constraint propagation
    should be measured before an energy selector. The exact solver is label
    authority only. It must not become a learned feature.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md section "V619 Planner Refresh"
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/python/carnot/verify
    - {project_root}/python/carnot/phase3
    - {project_root}/python/carnot/experiment_5963_exact_atom_pair_fixture.py
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/verification/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build an immutable source-grouped Countdown-style entrance fixture. Define
    an entrance as an unordered first operand pair plus its first arithmetic
    operator. Exhaustively label every legal entrance and freeze calibration
    and held groups before model output exists.

    CONCRETE STEPS:
    0. PRECONDITIONS: require the deterministic arithmetic solver stack,
       writable code, tests, result, and fixture paths, and no pre-existing
       V619 proposal output. On failure write terminal `blocked` and exact
       gate_check_summary.
    1. Add REQ-VERIFY-7064 and RED tests before implementation. Test operand
       multiplicity, commutative canonicalization, legal division, exhaustive
       reachability, witness replay, source grouping, and mutation rejection.
    2. Create at least 96 units across at least 12 frozen source groups. Hash
       the ordered unit IDs and split manifest before any LLM task runs.
    3. Enumerate every legal first branch. Record whether the residual numbers
       can reach the target and one exact continuation witness when reachable.
    4. Retain only units with both reachable and unreachable legal entrances.
       Mark a diversity subset of at least 48 units with at least two reachable
       entrance families.
    5. Add a deterministic MRV score based only on prompt-visible residual
       domain sizes. Do not read reachability labels when computing MRV.
    6. Serialize a model-visible view that contains only numbers, target, unit
       ID, and formatting rules. Prove by field allowlist that exact labels,
       witnesses, and solver-derived reachability are absent.
    7. Set entrance_fixture_ready_score=1 only when counts, exhaustive labels,
       witnesses, frozen groups, hashes, and leakage checks all pass. A ready
       fixture uses verdict_class=circular_positive because the exact solver is
       its construction oracle; never use positive.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, scoped spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (deterministic_verifier); duration_s;
       source_artifact_hashes; rows; unit_rows; entrance_rows;
       source_group_rows; split_manifest; split_manifest_hash;
       model_visible_schema; model_visible_rows_hash; operator_semantics;
       exhaustive_enumerator_receipt; witness_replay_rows; mrv_rows;
       diversity_subset_ids; unit_count; source_group_count;
       entrance_fixture_ready_score; random_seed; reproducibility_checksum;
       gate_check_summary with failed check, expected value, and observed value
       for any blocked verdict; verifier_is_oracle (true); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7064_v619_exact_entrance_fixture.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7065-three-family-entrance-proposal-bank
  title: Three-family SOTA entrance proposal bank
  track: local-inference
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: true
  max_turns: 100
  estimated_wall_time_min: 480
  per_unit_rows: true
  milestone: 2026.09.619
  deliverable: results/experiment_7065_v619_three_family_entrance_bank.json
  gated_on:
    - upstream: exp7064-exact-entrance-constraint-fixture
      artifact_field: entrance_fixture_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp6200-three-family-raw-code-transport-canary
      verdict: "complete_partial: Exp6200 coverage=18/18 cells; ready_families=[]"
      addressed_by: "Exp7065 uses short structured entrance proposals, all cached mandated GGUFs, matched llama.cpp transport, raw-first checkpoints, and exact post-generation parsing."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7064 freezes the exact entrance panel. This task measures proposal
    support from all three mandated local GGUF families under matched budgets.
    It acquires data only. It does not fit or select an energy model.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md section "V619 Planner Refresh"
    - {project_root}/results/experiment_7064_v619_exact_entrance_fixture.json
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/scripts/experiment_template.py cached_sota_pair() pattern
    - {project_root}/python/carnot/inference
    - {project_root}/scripts/run_gpu_guard.py
    - {project_root}/scripts/run_stop_authority.py
    - {project_root}/openspec/capabilities/inference/spec.md
    - {project_root}/openspec/capabilities/verification/spec.md

    TASK:
    Run the three mandated SOTA GGUF families on the frozen entrance panel.
    Collect short first-branch proposals and a bounded forced-prefix
    continuation panel. Preserve raw output and token scores before exact
    labeling. Use no remote model and no legacy-small headline fallback.

    CONCRETE STEPS:
    0. PRECONDITIONS: require entrance_fixture_ready_score=1 and recompute the
       source hash. Require owned idle RTX 3090 leases, CUDA llama.cpp, clean
       stop authority, writable checkpoints, and all three cached GGUFs. If an
       unattributed server owns a needed resource, block and do not kill it.
       On failure write terminal `blocked` and exact gate_check_summary.
    1. Add REQ-INFRA-7065 and REQ-VERIFY-7065 with RED tests before
       implementation. Test model ordering, cache misses, identity mismatch,
       prompt mismatch, resume, raw-first writes, cleanup, and blocked paths.
    2. MODEL_SPECS must resolve through cached_sota_pair() and execute exactly
       `unsloth/Qwen3.6-35B-A3B-GGUF`,
       `unsloth/gemma-4-31B-it-GGUF`, and
       `unsloth/gemma-4-26B-A4B-it-GGUF`. Load GGUF paths with llama.cpp. Never
       call AutoTokenizer on a GGUF repo.
    3. Match prompt bytes, unit order, seeds, temperature, top-p, context, and
       completion budget across models. Use at least four proposal seeds per
       held unit. Randomize model and arm order reproducibly.
    4. Request only a first arithmetic branch in the proposal pass. Store raw
       text, token log probabilities when available, timings, and hashes before
       parsing or exact labeling.
    5. On at least 24 frozen diversity units per model, give one reachable but
       initially unselected entrance prefix. Measure continuation success under
       the same remaining budget. The exact prefix label stays outside the
       original proposal prompt.
    6. Label proposals after generation with the Exp7064 enumerator. Record
       legal, reachable, duplicate, parse-failure, and continuation outcomes.
    7. Set entrance_proposal_bank_complete_score=1 only when all three model
       shards, all required units and seeds, raw hashes, CUDA evidence, identity
       evidence, and cleanup pass. This field means complete data, not quality.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, scoped spec coverage, GPU cleanup checks, and the
       applicable live-model checks from ops/e2e-test-plan.md.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (live_llm_inference); duration_s;
       source_artifact_hashes; cited_upstream_artifacts; upstream_gate_rows;
       rows; per_game_results; MODEL_SPECS; model_specs; models_used;
       selected_model_specs; model_identity_rows; model_file_hash_rows;
       runner_build_rows; gpu_lease_rows; port_lease_rows; gpu_sample_rows;
       cuda_layer_offload_confirmed; prompt_template; prompt_hash;
       matched_budget_contract; proposal_rows; forced_prefix_rows;
       raw_output_manifest; raw_output_hashes; checkpoint_rows; cleanup_rows;
       model_family_count; entrance_proposal_bank_complete_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7065_v619_three_family_entrance_bank.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7066-entrance-bank-independent-audit
  title: Cold recomputation of entrance-bank support
  track: evaluation
  priority: critical
  agent_type: claude
  model: sonnet
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 150
  per_unit_rows: true
  milestone: 2026.09.619
  deliverable: results/experiment_7066_v619_entrance_bank_audit.json
  gated_on:
    - upstream: exp7065-three-family-entrance-proposal-bank
      artifact_field: entrance_proposal_bank_complete_score
      op: ==
      value: 1
  prompt: |
    CONTEXT:
    Exp7065 creates an expensive three-family proposal bank. Before selection,
    a fresh process must prove that the bank is authentic, matched, leak-free,
    and nontrivial. Bank validity and selector headroom are separate facts.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_7064_v619_exact_entrance_fixture.json
    - {project_root}/results/experiment_7065_v619_three_family_entrance_bank.json
    - {project_root}/python/carnot/experiment_5963_exact_atom_pair_fixture.py
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/openspec/capabilities/verification/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Recompute the entrance labels and all support aggregates in a fresh
    subprocess. Audit source isolation, model identity, prompt parity, raw
    hashes, parsing, continuation accounting, and solver invisibility. Decide
    whether valid held selector headroom exists.

    CONCRETE STEPS:
    0. PRECONDITIONS: require entrance_proposal_bank_complete_score=1, readable
       upstream raw files, matching source hashes, importable exact enumerator,
       and writable result paths. On failure write terminal `blocked` and exact
       gate_check_summary. Do not use `partial` for an upstream block.
    1. Add REQ-VERIFY-7066 and RED tests before implementation. Freeze compact
       positive fixtures. Test label changes, group leakage, prompt drift,
       missing seeds, raw mutation, model swaps, parse drift, and aggregate
       contradictions.
    2. Start a fresh subprocess with no imported parent state. Re-enumerate all
       legal entrances and replay every recorded continuation witness.
    3. Recompute raw hashes, model identities, prompt hashes, budgets, seed
       coverage, order randomization, parse status, and exact outcomes.
    4. Prove with a field allowlist and prompt-byte scan that exact labels,
       witnesses, and solver-derived fields were absent from model inputs.
    5. Report support by unit, model, seed, and source group. Separate legal
       proposal coverage, reachable-family coverage, duplicate rate, parse
       rate, forced-prefix success, and strongest base-control quality.
    6. Set entrance_support_audit_ready_score=1 only when every authenticity,
       recomputation, parity, and leakage check passes.
    7. Set entrance_selector_headroom_ready_score=1 only when at least 30 held
       units contain both a reachable and unreachable proposed entrance and no
       non-oracle base control selects a reachable entrance on every such unit.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, scoped spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (deterministic_verifier_plus_replay); duration_s;
       source_artifact_hashes; cited_upstream_artifacts; upstream_gate_rows;
       rows; per_game_results; fresh_process_rows; label_recomputation_rows;
       witness_replay_rows; source_isolation_rows; model_identity_rows;
       prompt_parity_rows; budget_parity_rows; seed_coverage_rows;
       raw_hash_rows; parse_audit_rows; leakage_attack_rows;
       support_metric_rows; headroom_rows; headroom_unit_count;
       entrance_support_audit_ready_score;
       entrance_selector_headroom_ready_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (true); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7066_v619_entrance_bank_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7067-hopfield-entrance-energy-selection
  title: Hopfield-style entrance energy selection comparison
  track: constraint-energy
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 210
  per_unit_rows: true
  milestone: 2026.09.619
  deliverable: results/experiment_7067_v619_entrance_energy_selection.json
  gated_on:
    - upstream: exp7066-entrance-bank-independent-audit
      artifact_field: entrance_support_audit_ready_score
      op: ==
      value: 1
    - upstream: exp7066-entrance-bank-independent-audit
      artifact_field: entrance_selector_headroom_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp1006-energy-selection-ssd
      verdict: blocked_gate_check_failed
      addressed_by: "Exp7067 first requires an independently audited fixed proposal bank with measured held headroom, then compares a new Hopfield-style entrance energy against MRV, logits, frequency, uniform, and shuffled controls."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7066 supplies a valid fixed proposal bank with measured selector
    headroom. ERM motivates explicit Hopfield energy for candidate selection.
    SymStep motivates MRV as a strong deterministic control. The exact solver
    may label calibration outcomes and score a choice after selection. It may
    not appear in held inference features.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md section "V619 Planner Refresh"
    - {project_root}/results/experiment_7064_v619_exact_entrance_fixture.json
    - {project_root}/results/experiment_7065_v619_three_family_entrance_bank.json
    - {project_root}/results/experiment_7066_v619_entrance_bank_audit.json
    - {project_root}/python/carnot/models/ising
    - {project_root}/python/carnot/verify/ising.py
    - {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/openspec/capabilities/ising-backend/spec.md
    - {project_root}/openspec/capabilities/verification/spec.md

    TASK:
    Fit a small explicit Hopfield-style structural energy on calibration groups
    only. Compare held entrance selection with MRV, target log probability,
    proposal frequency, uniform legal choice, and shuffled energy. Measure
    oracle-distinct selection and continuation value under matched budgets.

    CONCRETE STEPS:
    0. PRECONDITIONS: require both Exp7066 gate fields equal one, recomputed
       upstream hashes, at least 30 headroom units, and writable code, tests,
       checkpoints, and artifact paths. On failure write terminal `blocked`
       and exact gate_check_summary.
    1. Add REQ-ISING-7067 and REQ-VERIFY-7067 with RED tests before
       implementation. Test split leakage, label access, arm identity,
       shuffled controls, tie policy, abstention, and aggregate recomputation.
    2. Freeze features before fitting. Allowed features are prompt-visible
       numbers, target, operator, residual magnitude, operand reuse flags,
       proposal frequency, and model token scores. Held reachability, exact
       witnesses, and post-selection outcomes are forbidden features.
    3. Fit an additive pairwise binary energy on calibration source groups.
       Record its full equation, parameters, feature normalization, optimizer,
       and seed. Keep it exactly translatable to bounded QUBO and Ising form.
    4. On held groups compare learned energy, MRV, target-log-probability,
       proposal-frequency, uniform-legal, and shuffled-energy arms. Use the
       same proposal set, tie rule, abstention option, and selection budget.
    5. Score reachable entrance rate, unique reachable-family coverage,
       forced-prefix continuation success, final exact success, abstention,
       selection time, and total budget. Report by model and source group.
    6. Include an exact-oracle upper bound in diagnostic rows only. Set
       verifier_is_oracle=false for the learned selector. Any held-time oracle
       access disqualifies the result.
    7. Set entrance_energy_comparison_complete_score=1 when all valid arms and
       rows complete, including an honest null. Set
       entrance_energy_value_ready_score=1 only if learned energy beats the
       strongest non-oracle control by at least 5 percentage points in final
       exact success, the paired 95% bootstrap lower bound is above zero, and
       neither abstention nor total budget hides the gain.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, scoped spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (deterministic_verifier_plus_replay); duration_s;
       source_artifact_hashes; cited_upstream_artifacts; upstream_gate_rows;
       rows; per_game_results; split_manifest_hash; allowed_feature_schema;
       forbidden_feature_scan; energy_equation; energy_parameter_rows;
       calibration_rows; held_selection_rows; arm_definitions; arm_order_rows;
       mrv_control_rows; shuffled_energy_rows; oracle_diagnostic_rows;
       per_model_rows; per_source_group_rows; paired_bootstrap_rows;
       reachable_rate_by_arm; exact_success_rate_by_arm;
       strongest_non_oracle_control; delta_over_strongest_control;
       entrance_energy_comparison_complete_score;
       entrance_energy_value_ready_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7067_v619_entrance_energy_selection.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7068-hierarchical-branch-fidelity-control
  title: Lossless categorical mass-rebalancing evaluation
  track: constrained-decoding
  priority: high
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.619
  deliverable: results/experiment_7068_v619_hierarchical_branch_control.json
  gated_on:
    - upstream: exp7066-entrance-bank-independent-audit
      artifact_field: entrance_support_audit_ready_score
      op: ==
      value: 1
  prompt: |
    CONTEXT:
    The frozen proposal bank contains branch distributions from three local
    models. Hierarchical Speculative Decoding supplies a lossless mass-
