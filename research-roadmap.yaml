- id: exp494-gpu-thermal-gate
  milestone: 2026.04.37
  deliverable: results/experiment_494_gpu_thermal_gate.json
  title: 'Exp 494: GPU Thermal Gate — RETRO-046 third attempt, actually implement it'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-046 has\
    \ been open for three consecutive milestones (.34, .35, .36) without implementation.\
    \ The thermal gate is simple: check GPU temperature before loading models; if temperature\
    \ > 85°C, wait with exponential backoff until it drops below 80°C; if it doesn't\
    \ drop within 5 minutes, defer with honest_verdict='gpu_thermal_throttle'. GPU\
    \ thermal throttling silently reduces throughput by 20-40% — the conductor doesn't\
    \ know experiments are running slow because the GPU is overheating. This is a\
    \ 50-line module. CPU-only experiment (thermal check can be done without GPU dependency).\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/gpu_vram_gate_v2.py —\
    \ GPUVRAMGateV2 (Exp 487, reference for GPU detection pattern)\n- python/carnot/pipeline/env_autofix.py\
    \ — apply_env_autofix()\n- python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\n\
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu()\n- ops/known-issues.md\
    \ — RETRO-046\n\nTASK: Implement GPUThermalGate and wire into ExperimentTemplate.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3.\
    \ Add REQ-INFRA-054 (GPUThermalGate.check_temperature(gpu_index) returns current\
    \ GPU temperature in Celsius via pynvml; returns None when pynvml unavailable or\
    \ no GPU), REQ-INFRA-055 (GPUThermalGate.wait_for_cool(gpu_index) blocks with\
    \ exponential backoff until temperature < cool_threshold_c or max_wait_seconds\
    \ exceeded; returns bool), REQ-INFRA-056 (ExperimentTemplate.setup_gpu() calls\
    \ GPUThermalGate before model load when requires_gpu=True), SCENARIO-INFRA-062/063/064\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n4. Write tests FIRST\
    \ (100% coverage) for:\n   - ThermalStatus(gpu_index: int, temperature_c: float\
    \ | None, is_safe: bool):\n     - is_throttling: bool (temperature_c > 85 if temperature_c\
    \ is not None else False)\n   - GPUThermalGate(hot_threshold_c: float = 85.0,\
    \ cool_threshold_c: float = 80.0,\n     max_wait_seconds: int = 300, backoff_base_seconds:\
    \ float = 15.0):\n     - check_temperature(gpu_index: int) -> ThermalStatus\n\
    \     - wait_for_cool(gpu_index: int) -> bool: True if cooled within max_wait_seconds\n\
    \     - __enter__() / __exit__(): raises GPUThermalThrottleError if wait_for_cool\
    \ returns False\n   - GPUThermalThrottleError(gpu_index, temperature_c, max_wait_seconds)\n\
    \   - Test: GPUThermalGate on CPU-only machine (no pynvml) is a no-op\n   - Test:\
    \ check_temperature returns ThermalStatus with is_throttling=True when temperature\
    \ > 85\n   - Test: wait_for_cool returns True immediately when temperature < 80\n\
    \   - Test: GPUThermalThrottleError raised when temperature stays hot\n5. Implement\
    \ python/carnot/pipeline/gpu_thermal_gate.py (GPUThermalGate, ThermalStatus, GPUThermalThrottleError).\n\
    \   Update scripts/experiment_template.py: in setup_gpu(), add GPUThermalGate check\
    \ before model load.\n   Export from carnot.pipeline.__init__.\n   Verbose docstrings:\
    \ WHY thermal gate (GPU thermal throttling reduces clock speed silently — an RTX\
    \ 3090 at 90°C runs at 50-70% of peak clock; benchmark times are unreliable because\
    \ throttle state varies experiment-to-experiment; the gate ensures all benchmark\
    \ results are obtained at normal operating temperature), WHY 85°C threshold (RTX\
    \ 3090 thermal limit=93°C; throttling starts at 83-85°C; 85°C trigger gives 3°C\
    \ headroom before actual throttle cutoff), WHY exponential backoff (GPU cooling\
    \ is not linear — first 5°C drop in 15s, next 5°C in 30s; exponential backoff\
    \ avoids unnecessary polling while still catching the inflection point).\n6. Write\
    \ scripts/experiment_494_gpu_thermal_gate.py:\n   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(494, timeout_minutes=20) as context manager\n\
    \   c. ExperimentTemplate(494, 'GPU Thermal Gate',\n      'results/experiment_494_gpu_thermal_gate.json')\n\
    \   d. DeliverableGuard('results/experiment_494_gpu_thermal_gate.json')\n   e.\
    \ Test GPUThermalGate on current machine: check_temperature for all available GPUs\n\
    \   f. Test wait_for_cool with mocked temperature above threshold\n   g. Verify\
    \ ExperimentTemplate.setup_gpu() now calls GPUThermalGate\n   h. Build artifact:\
    \ schema='carnot.thermal_gate.v1'\n      thermal_gate_implemented=True\n      template_wired=True\n\
    \      n_gpus_detected=<int>\n      current_temperatures=<list[float]> (or empty\
    \ if no GPU)\n      retro_046_closed=True\n      honest_verdict='thermal_gate_operational'\n\
    \   i. Call tmpl.assert_deliverable_written() as FINAL LINE\n   j. Output: results/experiment_494_gpu_thermal_gate.json\n\
    7. Write tests/python/test_gpu_thermal_gate.py (100% coverage).\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: update ops/conductor-log.md\
