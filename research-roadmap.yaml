      (l2_perception_goal_no_deepening_residual_alignment_under_determined): on lp85''s real post-L1 frame the
      detector returns goal_count=42 (every solid-2x2 same-color component classified a goal sprite),
      aligned_piece_count=0 -> the piece->sprite pairing is under-determined -> the goal is never satisfiable.
