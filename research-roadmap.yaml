    \ a CHEAPER approach: add a structured suffix to the MODEL PROMPT. The model reasons freely\
    \ (IT format), then produces a structured CLAIM block. ONE LLM call instead of TWO.\n\n\
    EXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/deliverable_validator.py — DeliverableContentValidator\
    \ (Exp 404)\n- python/carnot/pipeline/extract.py — ArithmeticExtractor, ConstraintExtractor\
