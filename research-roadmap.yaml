tasks:
  - id: exp1854-vl-proxy
    title: "Exp 1854: Implement Verification Learning (VL) proxy for continuous self-learning"
    deliverable: "results/experiment_1854_vl_proxy.json"
    agent_type: "codex"
    prompt: |
      CONTEXT: We are addressing FR-11 continuous self-learning by implementing a Verification Learning (VL) loss proxy based on arXiv:2503.12917.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/, tests/python/
      TASK: Implement a Verification Learning proxy that scores constraint satisfaction natively without labeled targets.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/verification_learning.py`.
      2. Implement a constraint-based loss function that operates on unlabelled data.
      3. Write `tests/python/test_verification_learning.py` ensuring 100% coverage.
      4. Save output to `{project_root}/results/experiment_1854_vl_proxy.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1855-fr11-loop
    title: "Exp 1855: Run FR-11 continuous self-learning loop with VL proxy on unsloth/gemma-4-31B-it-GGUF"
    deliverable: "results/experiment_1855_fr11_loop.json"
    gated_on:
      - upstream: exp1854-vl-proxy
        artifact_field: "status"
        op: "=="
        value: "success"
    prompt: |
      CONTEXT: We must execute a continuous self-learning loop using our SOTA models.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verification_learning.py
      TASK: Run a self-learning loop using `unsloth/gemma-4-31B-it-GGUF`.
      CONCRETE STEPS:
      1. Ensure MODEL_SPECS includes `unsloth/gemma-4-31B-it-GGUF`.
      2. Run the VL proxy on a subset of unlabelled constraints.
      3. Track the retention and learning curve.
      4. Save output to `{project_root}/results/experiment_1855_fr11_loop.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1856-ltlzinc-eval
