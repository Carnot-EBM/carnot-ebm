        verdict: "blocked_structured_protocol_clean_false: parse/schema/semantic/final JSON rates clean, unsafe_false_accepts=0, but methodology_duration_s=19.445366 below required 60"
        addressed_by: "This task targets the actual failed clean-gate field by producing a >=60s live receipt before any downstream constraint-tax rerun."
        retire_if_same_verdict: true
      - experiment_id: exp5284-sota-offload-cpu-only-path
        verdict: "retired_cpu_only_offload_path"
        addressed_by: "This task requires a non-retired GPU/offload receipt or writes an honest blocked artifact; CPU-only GGUF can only be smoke-test evidence."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5366 showed that the grammar-budgeted local SOTA protocol can produce clean parse/schema/semantic/final-JSON rates, but the structured_protocol_clean gate remained false because methodology_duration_s was only 19.445366. This task must repair the receipt itself, not broaden the benchmark.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/results/experiment_5366_live_grammar_budgeted_sota_protocol_v489.json
      - {project_root}/results/experiment_5365_grammar_budget_protocol_preflight_v489.json
      - {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/python/carnot/
      - {project_root}/tests/python/

      TASK:
      Produce a clean methodology-duration and runtime receipt for the live structured SOTA protocol using mandated local GGUF models. Fail closed if the local runtime cannot provide headline-eligible GPU/offload evidence.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify CUDA/GPU visibility and GGUF runtime availability. If only a CPU-only path is available for headline SOTA, write a blocked artifact and stop.
      1. Reuse the Exp5365 grammar budget and Exp5366 structured protocol fixtures without changing the acceptance thresholds.
      2. MODEL_SPECS for headline-eligible local runs must include:
         - unsloth/Qwen3.6-35B-A3B-GGUF
         - unsloth/gemma-4-31B-it-GGUF
         - unsloth/gemma-4-26B-A4B-it-GGUF
      3. Use llama.cpp/GGUF-compatible loading only. Do not use AutoTokenizer or AutoModel directly on a -GGUF repository.
      4. Run at least one mandated SOTA model long enough that methodology_duration_s is >=60, or write an honest blocked artifact explaining the missing precondition.
      5. Preserve the structured acceptance fields from Exp5366: parse_success_rate, schema_success_rate, final_json_extraction_rate, semantic_success_rate, unsafe_false_accepts, truncation failures, and completion slack.
      6. Write {project_root}/results/experiment_5378_structured_methodology_duration_receipt_v490.json.

      REQUIRED ARTIFACT FIELDS:
      - status: principle: complete only if live local SOTA inference ran; blocked if runtime preconditions fail.
      - live_sota_receipt_ready: principle: true only if a mandated SOTA GGUF produced non-retired live evidence with methodology_duration_s>=60.
      - grammar_budget_protocol_ready: principle: copied or recomputed from the .489 preflight.
      - MODEL_SPECS: principle: list containing all mandated local GGUF model specs considered for headline results.
      - selected_model_spec: principle: exact model spec used for headline measurements.
      - inference_substrate: principle: concrete runtime path, GPU/offload status, and GGUF loader family.
      - gpu_or_offload_receipt: principle: machine-readable evidence that this was not the retired CPU-only headline path.
      - no_autotokenizer_used: principle: must be true for GGUF repositories.
      - prompt_count: principle: number of live prompts evaluated.
      - parse_success_rate: principle: fraction of responses with parseable JSON.
      - schema_success_rate: principle: fraction of responses satisfying the schema.
      - final_json_extraction_rate: principle: fraction with unambiguous final JSON extraction.
      - semantic_success_rate: principle: fraction satisfying task semantics after schema validity.
      - truncation_failure_rate: principle: fraction classified as token-budget truncation failures.
      - completion_slack_min_tokens: principle: minimum JSON completion slack observed.
      - unsafe_false_accepts: principle: count of invalid/unsafe outputs accepted as valid.
      - methodology_duration_s: principle: live measurement duration excluding planning prose; must be >=60 for ready.
      - active_roadmap_modified: principle: must be false.
      - conductor_modified: principle: must be false.
      - honest_verdict: principle: one-line ready/block verdict.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

