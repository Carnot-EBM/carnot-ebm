    CONTEXT:
    Milestone 2026.04.74 had 7 experiments blocked by missing prior_failures fields in the YAML.
    Additionally, Exp 954 (Fast-Path Probe Live GPU) produced no result file — it appears the
    conductor never launched it. Exp 906 (IterativeSelfRepair 50q) appeared for the 2nd consecutive
    milestone in the slowest-5 at 35 min with no root-cause diagnosis — 1 milestone from mandatory
    gate. This preflight addresses all three issues before any .75 GPU experiments run.

    EXISTING FILES TO READ FIRST:
    - results/experiment_906_*.json (Exp 906 root cause diagnosis)
    - results/experiment_952_preflight_v23.json (confirm manifest state)
    - ops/exclusion_manifest.yaml (verify 786/627/603/641 present)

