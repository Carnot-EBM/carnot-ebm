    prompt: |
      CONTEXT
      This clean verifier task is gated on exp3222 `clean_rerun_allowed=true`. You are working in {project_root} on {date}. The goal is a real local SOTA verifier result over exact fixtures, not a CPU fallback or synthetic model claim.

