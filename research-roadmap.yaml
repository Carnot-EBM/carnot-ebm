  - id: exp297-semantic-energy-varentropy
    milestone: "2026.04.22"
    deliverable: python/carnot/pipeline/semantic_energy_extractor.py
    title: "Exp 297: SemanticEnergyExtractor + VarEntropyProbe (confident-wrong + entropy variance)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: SpilledEnergyExtractor (Exp 285, REQ-VERIFY-076) detects high-entropy (uncertain)
      outputs. The complementary detector is Semantic Energy (arXiv 2508.14496): catches
      confident-but-WRONG outputs where entropy is LOW but factual content is wrong. Together
      with VarEntropy (arXiv 2603.24929 — variance of per-token entropy), they form a 3-signal
      extraction-free detection system that covers the full uncertainty spectrum:
        - Spilled Energy: high entropy outputs (model is uncertain → likely wrong)
        - Semantic Energy: low entropy but wrong (model is confident → may still be wrong)
        - VarEntropy: high entropy VARIANCE (model alternates certain/uncertain → likely hallucinating)

      None of these require constraint extraction, regex, or knowledge bases.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/spilled_energy_extractor.py — SpilledEnergyExtractor (pattern to follow)
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (additive integration point)
      - python/carnot/pipeline/__init__.py — current exports

      TASK: Implement SemanticEnergyExtractor and VarEntropyProbe.
      1. Read CLAUDE.md spec-first workflow
      2. Add REQ-VERIFY-078 (SemanticEnergyExtractor), REQ-VERIFY-079 (VarEntropyProbe),
         and SCENARIO-VERIFY-097–100 to openspec/capabilities/verifiable-reasoning/spec.md
      3. Write tests FIRST (100% coverage required) for:
         - SemanticEnergyResult: dataclass with energy_score, is_confident_wrong, threshold_exceeded
         - compute_semantic_energy(logits): Boltzmann energy = -log(softmax(logit/T).max()) across tokens
         - temperature sensitivity: higher T → lower energy (more uniform distribution)
         - confident-wrong detection: peaked logits (low entropy) + high semantic energy → flag
         - VarEntropyResult: dataclass with varentropy, mean_entropy, threshold_exceeded
         - compute_varentropy(logits): var(per_token_entropy) across sequence
         - high varentropy flag: tokens alternating certain/uncertain
         - pipeline integration: VerifyRepairPipeline.verify_semantic_energy(logits_path, threshold)
         - pipeline integration: VerifyRepairPipeline.verify_varentropy(logits_path, threshold)
         - __init__.py exports
         - edge cases: single token, uniform logits, NaN/Inf handling
      4. Implement python/carnot/pipeline/semantic_energy_extractor.py:
         - SemanticEnergyResult(energy_score, mean_token_energy, max_token_energy, is_confident_wrong,
           threshold_exceeded, n_tokens)
         - compute_semantic_energy(logits, temperature=1.0): Boltzmann energy from logit distribution
           per token, aggregated across sequence. Based on arXiv 2508.14496.
         - compute_varentropy(logits): variance of per-token Shannon entropy across sequence.
           Based on arXiv 2603.24929.
         - VarEntropyResult(varentropy, mean_entropy, max_token_entropy, threshold_exceeded, n_tokens)
         - SemanticEnergyExtractor class with extract() and extract_from_file() methods
         - VarEntropyProbe class with probe() and probe_from_file() methods
      5. Add additive integration to VerifyRepairPipeline:
         - verify_semantic_energy(logits_path, threshold=0.5) → SemanticEnergyResult
         - verify_varentropy(logits_path, threshold=0.3) → VarEntropyResult
      6. Export from python/carnot/pipeline/__init__.py
      7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      8. Reconcile: update ops/changelog.md and ops/status.md
      9. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp298-prefill-uncertainty-probe
    milestone: "2026.04.22"
    deliverable: python/carnot/pipeline/prefill_uncertainty_probe.py
    title: "Exp 298: PrefillUncertaintyProbe — pre-generation hallucination risk (arXiv 2603.19562)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Neural Uncertainty Principle (arXiv 2603.19562, Mar 2026) proves that
      adversarial vulnerability and hallucination share a geometric origin — input and
      loss-gradient are conjugate observables with an irreducible uncertainty bound
      (analogous to Heisenberg). Key insight: a prefill-stage probe can detect hallucination
      RISK before any tokens are generated, using only the input representation.

      This is complementary to SpilledEnergyExtractor (post-generation) and SemanticEnergyExtractor:
      - PrefillUncertaintyProbe: fires BEFORE generation (fast, no tokens needed)
      - SpilledEnergyExtractor: fires AFTER generation (needs logits)
      Together they cover the full verify cycle: pre-generation gate + post-generation check.

      The implementation: embed the input prompt using the LLM's input layer, compute the
      uncertainty bound from the input representation norm and gradient norm. High uncertainty
      → likely hallucination → trigger full Ising verification. Low uncertainty → fast path skip.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/spilled_energy_extractor.py — module structure to follow
      - python/carnot/pipeline/verify_repair.py — additive integration point
      - python/carnot/pipeline/__init__.py — current exports

      TASK: Implement PrefillUncertaintyProbe.
      1. Read CLAUDE.md spec-first workflow
      2. Add REQ-VERIFY-080 (PrefillUncertaintyProbe) and SCENARIO-VERIFY-101/102 to spec
      3. Write tests FIRST (100% coverage required) for:
         - PrefillUncertaintyResult: dataclass with uncertainty_score, conjugate_bound,
           high_risk, threshold_exceeded
         - compute_input_uncertainty(input_embeddings): uncertainty from embedding norm variance
         - compute_conjugate_bound(input_norm, gradient_norm): |⟨x, ∇L⟩|² ≤ ||x||² · ||∇L||²
         - high_risk detection: uncertainty_score > threshold
         - compute_prompt_uncertainty(prompt_tokens, model_fn): compute from token probabilities
           when full model not available (simulated gradient via finite differences on logits)
         - pipeline integration: VerifyRepairPipeline.check_prefill_uncertainty(prompt, model_fn)
         - fast-path skip: returns (skip_verification=True, reason="low_uncertainty") when safe
         - edge cases: empty prompt, single token, all-same embeddings
      4. Implement python/carnot/pipeline/prefill_uncertainty_probe.py:
         - PrefillUncertaintyResult(uncertainty_score, conjugate_bound, high_risk,
           threshold_exceeded, n_tokens, computation_method)
         - compute_input_uncertainty(embeddings): variance of embedding norms = uncertainty proxy
         - compute_conjugate_bound(input_norm, gradient_norm): Cauchy-Schwarz bound
         - compute_prompt_uncertainty(logits_first_pass, threshold): from first-pass token probs
           (no full gradient needed — approximate via entropy of first-token distribution)
         - PrefillUncertaintyProbe.probe(logits_first_pass, threshold) → PrefillUncertaintyResult
         - Note: full gradient-based version requires white-box model access. Implement
           entropy-based approximation that works with any logit output (black-box friendly).
      5. Add VerifyRepairPipeline.check_prefill_uncertainty(logits_first_pass, threshold=0.5)
      6. Export from __init__.py
      7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      8. Reconcile: update ops/changelog.md and ops/status.md
      9. Do NOT push. Do NOT modify scripts/research_conductor.py.

