       b. PSVSelfPlayLoop class:
          __init__(self, n_iterations: int, n_questions_per_iter: int,
                   constraint_memory: JitRLConstraintMemory):
          run_iteration(self, questions: list[str], inference_fn, verify_fn) -> PSVIteration:
            'One PSV iteration. inference_fn: str -> str (LLM call or synthetic).
