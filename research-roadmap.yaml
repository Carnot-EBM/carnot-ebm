    - critical_issues_before_audit
    - critical_issues_after_audit
    - sections_updated
    - certificate_result_integrated
    - semantic_repair_result_integrated
    - self_learning_result_integrated
    - kan_formal_result_integrated
    - diffutruth_result_integrated
