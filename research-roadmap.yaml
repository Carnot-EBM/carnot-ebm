- id: exp1398-ngrpo-theory-probe
  milestone: 2026.04.108
  deliverable: results/experiment_1398_ngrpo_theory_probe.json
  title: "NGRPO Theory Probe — Advantage Calibration Simulation on exp1383 Rollout Data"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 30
  priority: medium
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1398-ngrpo-theory-probe
