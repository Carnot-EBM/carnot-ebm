- id: exp1189-phase4-stronger-baseline-10x10
  milestone: 2026.04.92
  deliverable: results/experiment_1189_phase4_stronger_baseline_10x10.json
  title: "Phase 4 Active Inference — Stronger BFS Baseline + 10x10 Grid + Full Energy Traces (ISSUE-9 Fix)"
  agent_type: claude
  model: opus
  max_turns: 45
  estimated_wall_time_min: 40
  priority: high
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1165-phase4-active-inference-pilot-v1
      verdict: phase4_better_than_baseline
      addressed_by: "exp1165 used random-legal-greedy as the baseline (98% solve rate revealed
                     trivially easy puzzles). Paper ISSUE-9 requires a non-trivial baseline.
                     exp1189 implements BFS-to-goal as the baseline (optimal for small grids,
                     guaranteed solution if tractable), tests on 10x10 grids (harder than 5x5),
                     and captures full free_energy_values traces for all 10 puzzles."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    exp1165 (Phase 4 active inference pilot) showed 74.7% action reduction vs random-legal-greedy
    baseline. The paper ISSUE-9 (paper-v5-integrity-remediation.md) requires a non-trivial baseline:
    "The 98%-solve baseline reveals the puzzles are too easy. ALSO: capture full free_energy_values
    trace across all 10 puzzles."

    BFS-to-goal is the appropriate non-trivial baseline:
    - BFS is guaranteed to find the shortest path to the goal if the puzzle is tractable
    - BFS action count = theoretical optimum for deterministic puzzles
    - If Phase 4 CANNOT beat BFS: Phase 4 adds no value over tree search (honest finding)
    - If Phase 4 CAN match BFS on harder 10x10 grids: the result is publishable

    NOTE: We expect Phase 4 to lose to BFS on easy 5x5 puzzles (BFS is optimal), but the
    interesting comparison is on harder 10x10 grids where BFS may hit exponential branching.

    EXISTING CODE TO READ FIRST:
    - python/carnot/phase3/active_inference_pilot.py (ARC3PuzzleEnv, ActiveInferencePilot from exp1165)
    - results/experiment_1165_phase4_active_inference_pilot_v1.json (pilot results)
    - python/carnot/samplers/phase4_sampler.py (BlockedGibbsSampler)

    TASK:
    1. Extend ARC3PuzzleEnv to support 10x10 grids:
       - Modify ARC3PuzzleEnv to accept grid_size parameter (default 5, also support 10)
       - Scale puzzle complexity: on 10x10, use 5-8 legal actions per step (vs 3-5 on 5x5)
       - Create 10 new 10x10 puzzles: pattern_copy_10x10, row_rotate_10x10, etc.

    2. Implement BFS baseline:
       - BFSBaseline class: uses Python's deque-based BFS over the puzzle state space
       - bfs_solve(puzzle) → (action_sequence, n_states_explored)
       - If BFS exceeds 100,000 states without finding solution: mark as "BFS_intractable"
         and exclude from comparison (document which puzzles are BFS-intractable)

    3. Run comparison on 10 puzzles at both grid sizes:
       a. 5x5 puzzles: Phase 4 vs BFS (expect BFS to win; this is the honest baseline)
       b. 10x10 puzzles: Phase 4 vs BFS (BFS may hit intractability; Phase 4 should shine here)
       c. Record full free_energy_values trace for all 10 puzzles (fixes ISSUE-9)

    4. Compute summary:
       - phase4_vs_bfs_action_ratio: Phase4_actions / BFS_actions per puzzle (< 1.0 = Phase 4 better)
       - phase4_better_than_bfs_n: count of puzzles where Phase 4 beats BFS
       - bfs_intractable_n: count of 10x10 puzzles where BFS hits 100k state limit

    5. Write results artifact with narrative suitable for paper inclusion.

    CONCRETE STEPS:
    - python3 -c "from python.carnot.phase3.active_inference_pilot import ARC3PuzzleEnv; print('import ok')" 2>&1
    - JAX_PLATFORMS=cpu python scripts/experiment_1189_phase4_stronger_baseline_10x10.py 2>&1 | tail -40
    - Write results/experiment_1189_phase4_stronger_baseline_10x10.json

    REQUIRED ARTIFACT FIELDS:
    - bfs_baseline_implemented: bool
    - grid_sizes_tested: list[int] ([5, 10])
    - n_5x5_puzzles: int (10)
    - n_10x10_puzzles: int (10)
    - phase4_5x5_action_ratio: float (Phase4/BFS on 5x5; expected: > 1.0 = BFS wins)
    - phase4_10x10_action_ratio: float (Phase4/BFS on 10x10; expected: <= 1.0 = Phase 4 competitive)
    - phase4_better_than_bfs_5x5: int (puzzles where Phase 4 beats BFS at 5x5; expected: 0-2)
    - phase4_better_than_bfs_10x10: int (puzzles where Phase 4 beats BFS at 10x10)
    - bfs_intractable_10x10: int (10x10 puzzles exceeding 100k BFS states)
    - free_energy_values_all_puzzles: bool (True iff all 10 puzzles have full energy traces)
    - stronger_baseline_implemented: bool
    - paper_narrative: str (3-4 sentence result description for paper inclusion)
    - honest_verdict: "phase4_beats_bfs_on_hard_puzzles" | "phase4_tied_with_bfs" |
                     "phase4_loses_to_bfs_all_sizes" | "bfs_mostly_intractable"

