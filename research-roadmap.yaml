    \ accuracy on adversarial variants because Ising verifies arithmetic constraints\
    \ independently of irrelevant context injected by the adversarial template. If\
    \ Carnot's improvement is LARGER on adversarial than standard GSM8K, this is the\
    \ headline result: we fix the failure mode that breaks all other approaches. The\
    \ GPUVRAMGate (Exp 474) prevents the zombie VRAM issue.\n\nDepends on: Exp 474\
    \ (GPUVRAMGate), Exp 476 (IntegratedExtractor).\nHardware: 2x RTX 3090 (CARNOT_FORCE_LIVE=1).\n\
