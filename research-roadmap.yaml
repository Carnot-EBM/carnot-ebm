- id: exp1224-phase5c-adversarial-probe
  milestone: 2026.04.95
  deliverable: results/experiment_1224_phase5c_adversarial_probe.json
  title: "Phase 5-C — Adversarial Probe: 3 Attack Classes vs In-Situ Training Defense (exp_NEXT_C)"
  agent_type: claude
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 35
  priority: high
  requires_gpu: false
  gated_on:
    - upstream: exp1223-phase5b-insitu-training-loop
      artifact_field: phase5b_stability_confirmed
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    This is exp_NEXT_C from openspec/change-proposals/in-situ-training-phase5-derisking.md.
    The Phase 5-A+B prototype has passed acceptance and 1000-query stability gates.
    Now run a hostile-reviewer round to find ways the prototype could pass those gates
    without actually working.

    Three attack classes per Q9 spec:
    1. Single-verifier gaming: find inputs that score high on Z3MathVerifier alone,
       without actually being valid puzzle solutions.
    2. Pairwise verifier correlation exploitation: find inputs where P(V_i passes | V_j passes)
       is anomalously high — indicating correlated blind spots between verifiers.
    3. Joint null-space attack: gradient search for latent z that minimizes energy on ALL
       k=3 verifiers simultaneously without being a valid puzzle solution.

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write to results/experiment_1224_phase5c_adversarial_probe.json:
    {
      "experiment": "1224_phase5c_adversarial_probe",
      "status": "in_progress",
      "adversarial_probe_complete": false,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - python/carnot/phase5/insitu_prototype.py (prototype from exp1222)
    - results/experiment_1223_phase5b_insitu_training_loop.json (stability results)
    - openspec/change-proposals/in-situ-training-phase5-derisking.md (exp_NEXT_C spec)

    TASK:
    1. Write skeleton artifact (STEP 0).
    2. Confirm exp1223.phase5b_stability_confirmed == true. If false, write blocked artifact.
    3. Run 3 attack classes (budget: 200 random/gradient queries each):

       ATTACK 1 — Single-verifier gaming:
       - Generate 200 random 5×5 inputs
       - For each: compute Z3MathVerifier score vs composite k=3 score
       - Gaming detected: Z3 score > 0.9 AND k=3 composite score < 0.5 (single-verifier gamed)
       - gaming_rate_attack1 = fraction with Z3>0.9 AND composite<0.5

       ATTACK 2 — Pairwise correlation exploitation:
       - From exp1223's acceptance log, extract the conditional acceptance probability matrix
         P(V_i passes | V_j passes) for all i,j pairs
       - Compute: max off-diagonal correlation (above 0.7 = correlated blind spot)
       - Attack success: find input that exploits the highest-correlation pair
       - pairwise_max_correlation = max(P(V_i|V_j)) for i≠j

       ATTACK 3 — Joint null-space attack:
       - Start with 20 random invalid puzzle states
       - For each: gradient-ascend on k=3 composite score (maximize joint acceptance) for 50 steps
       - Joint gaming rate: fraction of gradient-attacked inputs that achieve k=3 composite > 0.8
         while verifier oracle says "invalid"
       - joint_gaming_rate = fraction gaming joint null space

    4. Defense verdict:
       - attack1_blocked: gaming_rate_attack1 < 0.10 (less than 10% single-verifier gaming)
       - attack2_blocked: pairwise_max_correlation < 0.70 (no correlated blind spots)
       - attack3_blocked: joint_gaming_rate < 0.05 (less than 5% joint null-space gaming)
       - all_attacks_blocked = attack1_blocked AND attack2_blocked AND attack3_blocked

    5. If any attack succeeds: document the specific failure mode + architectural revision needed.

    CONCRETE STEPS:
    - Write skeleton artifact (STEP 0)
    - python3 -c "import json; d=json.load(open('results/experiment_1223_phase5b_insitu_training_loop.json')); print('stable:', d.get('phase5b_stability_confirmed'))" 2>&1
    - [Load Phase 5-A prototype from python/carnot/phase5/insitu_prototype.py]
    - [Run Attack 1: single-verifier gaming]
    - [Run Attack 2: pairwise correlation]
    - [Run Attack 3: joint null-space gradient search]
    - Update results/experiment_1224_phase5c_adversarial_probe.json

    REQUIRED ARTIFACT FIELDS:
    - gaming_rate_attack1: float
    - pairwise_max_correlation: float
    - joint_gaming_rate: float
    - attack1_blocked: bool
    - attack2_blocked: bool
