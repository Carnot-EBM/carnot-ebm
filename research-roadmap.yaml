      Set hardware_speedup_claim=false. Set verdict_class=blocked when no new receipt or the one action fails, partial for an authenticated nonterminal forward step, circular_positive at most for a same-run hardware self-check, or disqualified for an unauthorized command. Set inference_substrate=hardware_smoke only if a command runs; otherwise use dated_hardware_receipt_audit_no_command_no_llm. Set verifier_is_oracle=true only for device and bitstream identity checks; never use positive.

