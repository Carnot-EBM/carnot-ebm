      9. Run focused unit/coverage, cached_sota_pair, GPU-offload, chat-template, sealed-answer, parser, exact-validator, failure-taxonomy, split-leakage, candidate-completeness, checkpoint/resume, positive/negative control, schema/adversarial, gate-replay, spec-coverage, and root-clutter tests.
