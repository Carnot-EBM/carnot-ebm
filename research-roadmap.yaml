- id: exp778-jepa-v19-cascade-deploy
  milestone: 2026.04.59
  deliverable: results/experiment_778_jepa_v19_cascade_deploy.json
  title: 'Exp 778: JEPA v19 Cascade Deploy — Tier 3.5 Predictive Verification (GATED on Exp 770 OOD AUC > 0.75)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: GATED on Exp 770 (JEPA v19 real data training). Read
    results/experiment_770_jepa_v19_predictive.json FIRST.
    - If honest_verdict="jepa_v19_ood_viable" (OOD AUC > 0.75): proceed with cascade deployment.
    - If any other verdict: write artifact honest_verdict="blocked_ood_auc_below_gate" and exit cleanly.

    The Tier 3 self-learning vision (research-program.md):
    "Train a model to predict constraint violations BEFORE the LLM finishes generating.
    Input: partial response (first N tokens) → predict which constraints will be violated.
    Enables preemptive guided decoding: steer away from violations before they happen."

    JEPA v19 with OOD AUC > 0.75 is the minimum viable predictor. Deploying it as Tier 3.5
    in the pipeline closes the Tier 3 self-learning loop (FR-11). The deployment adds a
    fast-path: if JEPA v19 predicts low violation probability (< 0.3) from the first 50
    tokens, skip Ising verification (Tier 3); otherwise run full Ising. This reduces Tier 3
    load for clearly-correct responses while maintaining accuracy.

    EXISTING CODE TO READ FIRST:
    - results/experiment_770_jepa_v19_predictive.json — PRIMARY INPUT: ood_auc, model_saved_path.
    - python/carnot/samplers/jepa_v19.py — MultiStepJEPAv19 (created by Exp 770).
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline; add Tier 3.5.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; add fast-path.
    - _bmad/architecture.md — update verification pipeline table.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Wire MultiStepJEPAv19 as Tier 3.5 in the cascade. Validate: fast-path skip rate
    and false-negative rate (correct responses wrongly sent to Ising). Deploy if FN rate < 5%.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_770_jepa_v19_predictive.json.
       If OOD AUC <= 0.75: write artifact honest_verdict="blocked_ood_auc_below_gate" and exit.
    3. Add REQ-LEARN-046 (JEPA v19 Tier 3.5 MUST load MultiStepJEPAv19 from model_saved_path;
       MUST apply fast-path skip when predicted_violation_prob < 0.30; MUST NOT skip Ising
       when predicted_violation_prob >= 0.30), REQ-LEARN-047 (false_negative_rate MUST be <
       0.05; if FN rate >= 0.05, lower the skip threshold until satisfied),
       SCENARIO-LEARN-090/091 to openspec/capabilities/self_learning/spec.md.
    4. Load MultiStepJEPAv19 from model_saved_path (read from Exp 770 artifact).
    5. Implement Tier 3.5 integration in ThreeTierPipeline:
       a. Add Tier35Result(predicted_violation_prob, skip_ising) to pipeline.
       b. In ThreeTierPipeline.verify(): after Tier 3 Ising check, add Tier 3.5:
          - Extract first 50 tokens of response (or all tokens if < 50).
          - Split into 3-token steps (for n_steps=3 pooling).
          - Call jepa_v19.predict(steps) → predicted_violation_prob.
          - If predicted_violation_prob < 0.30: set skip_ising=True, skip Tier 3.
          - If predicted_violation_prob >= 0.30: run Tier 3 Ising normally.
       c. Record for each question: skipped_ising (bool), predicted_prob.
    6. Validate on 50 synthetic GSM8K-style questions (mix of correct and incorrect):
       a. Run pipeline with Tier 3.5 active.
       b. For each skipped question: check if it was actually a violation (ground truth).
          If skipped AND violation: false negative.
       c. false_negative_rate = n_false_negatives / n_skipped.
       d. fast_path_skip_rate = n_skipped / 50.
       e. If false_negative_rate >= 0.05: lower threshold to 0.20 and rerun.
    7. Create scripts/experiment_778_jepa_v19_cascade_deploy.py:
       a. ExperimentTemplate(778) + ExperimentTimeoutWatchdog(778, timeout_minutes=30).
       b. Implement steps 4-6.
       c. honest_verdict:
          - "tier35_deployed" if false_negative_rate < 0.05 AND fast_path_skip_rate > 0.10
          - "tier35_deployed_conservative_threshold" if deployed with threshold=0.20
          - "tier35_too_many_fn" if false_negative_rate >= 0.05 even at threshold=0.20
          - "blocked_ood_auc_below_gate" if jepa_v19 OOD AUC <= 0.75
       d. artifact: jepa_v19_ood_auc (from Exp 770), skip_threshold, fast_path_skip_rate,
          false_negative_rate, tier35_deployed (bool), honest_verdict.
    8. If tier35_deployed: update _bmad/architecture.md:
       a. Add Tier 3.5 row to the Verification Pipeline Tiers table.
       b. Update "Last Reconciled" date.
    9. Write tests/python/test_experiment_778_jepa_v19_cascade_deploy.py with 100% coverage:
        - test Tier 3.5 skips Ising when predicted_prob < threshold.
        - test Tier 3.5 runs Ising when predicted_prob >= threshold.
        - test false_negative_rate = n_skipped_violations / n_skipped.
        Each test traces to REQ-LEARN-046/047.
    10. Reconcile:
        - ops/status.md: "JEPA v19 Tier 3.5 cascade: tier35_deployed=X. skip_rate=Y.
          fn_rate=Z. Self-learning Tier 3: DEPLOYED/BLOCKED."
          If deployed: "FR-11 Tier 3 self-learning loop CLOSED."
        - ops/changelog.md: one-line with honest_verdict.
    11. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

