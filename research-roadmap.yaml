  # ---------------------------------------------------------------------------
  # PHASE 2 — CONTINUOUS SELF-LEARNING: TIER-4 (the one untried tier)
  # ---------------------------------------------------------------------------
  - id: exp3838-fr11-v22-tier4-adaptive-structure
    milestone: "2026.06.353"
    title: "FR-11 continuous self-learning v22 — Tier-4 ADAPTIVE-STRUCTURE on the live verifier (the one untried tier; v17 was Tier-1 reweight, v18 Tier-2 memory, v19/v20/v21 Tier-3 predict). Across the FoVer corpus, accumulate per-verifier marginal contribution and PRUNE verifiers whose contribution is below a threshold, while FLAGGING residual error regions no verifier catches — confirm the pruned structure holds the frozen 0.9131 within CI while shrinking the active verifier set (compute saving)."
    priority: high
    track: research
    max_turns: 50
    agent_type: claude
    model: sonnet
    requires_claude: true   # judgment: Tier-4 changes the STRUCTURE of the energy function (which verifiers are active), not just weights — designing the prune/flag policy + interpreting whether the shrunk structure preserves the moat is open-ended architecture work, not a deterministic gate. CPU so gemini crashes nothing, but mis-designs the structural policy; codex acceptable fallback.
    requires_gpu: false
    estimated_wall_time_min: 35
    inference_substrate: verifier_ensemble_against_cached_candidates
    prompt: |
      CONTEXT. research-program.md defines four self-learning tiers. The FR-11 lineage has done
      Tier-1 (online per-verifier precision reweighting, v17/exp3772), Tier-2 (constraint-memory
      consolidation, v18/exp3778), and Tier-3 (predictive verification + fast-path gate,
      v19/v20/v21/exp3788/3803/3813). The ONE untried tier is Tier-4: ADAPTIVE STRUCTURE — the
      energy function's structure evolves (add/prune constraint TYPES), not just its weights.
      This task prototypes Tier-4 on the live FoVer verifier: prune marginal verifiers + flag
      uncovered residual regions, and confirm the shrunk structure preserves the frozen 0.9131.
      (Methods peers: VDS-TTT arXiv:2505.19475; Prune-as-You-Generate arXiv:2603.24840; KAN
      abstraction arXiv:2602.06737 — see research-references.md '.353 additions'.)

      EXISTING CODE TO READ FIRST:
        - scripts/experiment_3772_fr11_self_learning_v17_verifier_precision_tracker.py (Tier-1 — the per-verifier precision state this builds on).
        - python/carnot/learn/constraint_memory.py (Tier-2 state store).
        - results/experiment_3826_fover_ablation_faithful.json (the verifier partition + aggregation).
        - research-program.md "Tier 4: Adaptive Energy Landscapes".

      TASK. Adaptive-structure prototype: marginal-contribution pruning + residual-region flagging.

      CONCRETE STEPS:
        0. PRECONDITIONS (on failure write blocked_<resource> + EXIT): import carnot.verify;
           corpus present; the per-verifier scores are obtainable individually.
        1. Score the corpus with each active verifier individually + the full aggregation (frozen 0.9131).
        2. Compute each verifier's MARGINAL contribution = drop in ensemble AUROC when it is removed
           (leave-one-out). This is the structural-importance signal.
        3. PRUNE policy: drop verifiers whose marginal contribution is below a small threshold
           (e.g. < 0.002 AUROC), accumulating the decision in a persisted Tier-4 structure-state
           file (CPU; the Tier-4 hardware path is graph reconfiguration). Re-score with the pruned set.
        4. FLAG residual regions: identify gold-incorrect candidates that NO active verifier catches
           (the both-wrong set) and record them as the structural-gap signal for a FUTURE verifier
           ADD (do NOT add one this milestone — flag only).
        5. CONFIRM the pruned structure holds the frozen 0.9131 within CI (pruned_auroc within
           [0.903, 0.923]) — i.e. structure shrank without moat loss. Report the compute saving
           (fraction of per-candidate verifier evaluations removed).
        6. Persist the Tier-4 structure-state; emit terminal verdict.

      REQUIRED ARTIFACT FIELDS (field_provenance block):
        per_verifier_marginal_contribution (principle: "leave-one-out AUROC drop — the structural-importance signal that drives prune/keep");
        pruned_verifier_set (principle: "which verifiers Tier-4 dropped — the adaptive STRUCTURE change, not a weight change");
        pruned_ensemble_auroc (principle: "MUST stay within the frozen 0.9131 CI [0.903,0.923] or the prune damaged the moat and must revert");
        compute_saving_fraction (principle: "fraction of per-candidate verifier evaluations removed by the structural prune — the Tier-4 efficiency payoff");
        residual_gap_regions_flagged (principle: "both-wrong candidates flagged for a FUTURE verifier ADD — the structural-growth signal (flag only, not added this milestone)");
        tier4_structure_state_path (principle: "persisted structure-state — the Tier-4 learning artifact, distinct from Tier-1 weights / Tier-2 memory");
        n_candidates_scored, preconditions_checked, cited_upstream_artifacts,
