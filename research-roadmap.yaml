- id: exp6766-thermalizer-independent-trajectory-audit
  title: Independent Thermalizer factor-to-trajectory audit
  track: hardware-portability
  priority: high
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.08.589
  deliverable: results/experiment_6766_thermalizer_independent_trajectory_audit.json
  prompt: |
    CONTEXT:
    Exp6751 reported that context matching reduced mean trajectory total variation on bounded
    simulator circuits. Its artifact also set verifier_is_oracle=true and verdict_class=positive,
    which the live adversarial check correctly flags as a circularity-class mismatch. Extropic's
    public 2026 update still targets Z1 early access for 2027. This task asks only whether the local
    compiler-fidelity result survives a separately implemented exact enumerator and direct sampler.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6751_thermalizer_factor_trajectory_fidelity.json
    - {project_root}/python/carnot/experiment_6751_thermalizer_factor_trajectory_fidelity.py
    - {project_root}/tests/python/test_experiment_6751_thermalizer_factor_trajectory_fidelity.py
    - {project_root}/python/carnot/backends/torx_backend.py and installed THRML/Torx interfaces
    - {project_root}/scripts/adversarial_verify.py and
      {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/research-references.md, V589 Extropic entry
    - Primary sources arXiv 2608.01615 and 2608.01612 and
      https://extropic.ai/writing/from-one-to-one-billion.

    TASK:
    Cold-audit Exp6751 with an evaluator that does not import its factor-normalization, enumeration,
    sampling, trajectory, or reducer functions. Recompute conditional KL and trajectory total
    variation per factor, depth, and seed. Determine whether the compiler under test is genuinely
    distinct from the evaluation authority and classify the evidence accordingly.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6751 to parse, retain all raw rows and frozen topology, precision,
       seed, factor, and trajectory receipts. Verify exact enumeration is bounded and the independent
       implementation can be isolated. On failure write complete_blocked_thermalizer_audit with
       gate_check_summary.
    1. Confirm or add narrow REQ-* anchors in hardware-portability and research-reporting specs.
       Write independent enumeration, normalization, sampling, metric, circularity, and reducer
       tests first.
    2. Implement the evaluator in a separate module without importing Exp6751 normalization,
       exact-enumeration, direct-sampling, trajectory, or aggregation functions. It may consume only
       serialized typed factors, compiler outputs, frozen seeds, and documented schemas.
    3. Recompute normalization, conditional distributions, conditional KL, short trajectory
       distributions, and total variation for independent factor fitting, context matching, and
       trajectory refinement at depths 1, 2, 4, and 8.
    4. Add direct sampling with frozen seeds as a second independent check. If installed Torx or
       THRML is invoked, record exact version and API path, but do not require it and do not treat an
       internal simulator as physical hardware.
    5. Emit one rows entry per factor, method, precision, topology, depth, seed, and evaluator path.
       Recompute means, intervals, and paired differences only from those rows.
    6. Verify compiler and evaluator module identity, dependency graph, code hashes, and shared
       functions. If the tested method consumes the same exact evaluator outcome as its mechanism,
       set verifier_is_oracle=true and verdict_class=circular_positive at best. If implementations
       are distinct and exact evaluation is only held-out measurement, set verifier_is_oracle=false.
    7. Set independent_trajectory_audit_completed when all planned cold rows and cross-checks are
       attributable. A positive non-circular result requires the preregistered trajectory reduction
       to reproduce with a paired interval excluding zero and evaluator_distinct=true.
    8. Run focused tests, lint, spec coverage, adversarial verification, and row consistency.
    9. REQUIRED ARTIFACT FIELDS: field_principles, inference_substrate (local simulator/compiler
       cold audit; no physical TSU), duration_s, random_seed, reproducibility_checksum,
       source_artifact_sha256, compiler_provenance, evaluator_provenance, dependency_graph_receipt,
       evaluator_distinct (boolean), rows (every factor-method-precision-topology-depth-seed-evaluator
       unit), conditional_kl_by_factor, trajectory_tv_by_depth, paired_trajectory_deltas,
       direct_sampler_crosscheck, normalization_mismatches, topology_mismatches,
       precision_mismatches, independent_trajectory_audit_completed, claim_boundary (simulator-only;
       no speed, power, X0, Z1, FPGA, or physical-hardware claim), gate_check_summary (failed check
       and observed value for blocked_*), verifier_is_oracle (row-derived circularity boolean),
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial), and
       honest_verdict (allowed complete/success/passed/shipped prefix; use
       complete_blocked_<reason> for task-owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6766_thermalizer_independent_trajectory_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6751-thermalizer-factor-trajectory-fidelity
      verdict: 'complete: context matching reduced exact mean trajectory total variation; simulator-only compiler evidence'
      addressed_by: 'A separately implemented enumerator, direct sampler, reducer, dependency receipt, and correct circularity class now audit the existing result instead of trusting its shared exact path and positive self-classification.'
      retire_if_same_verdict: true

- id: exp6767-v589-branch-disposition
  title: V589 branch disposition and PRD gap update
  track: synthesis
  priority: critical
  agent_type: codex
  model: gpt-5.5
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 90
  per_unit_rows: true
