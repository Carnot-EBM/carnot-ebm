    TASK:
    V683 contract and frozen methods.
    Deliverable: {project_root}/results/experiment_7865_v683_contract_methods.json.
    Actual compute: verifier_ensemble_against_cached_candidates; inference_substrate_class=no_model_load; MODEL_SPECS=[].

    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Verify input paths, hashes, schemas, source roles, required programs and current gate operands before compute. Preserve external missing or disqualified inputs as complete_blocked_* with verdict_class=blocked and gate_check_summary. A skip receipt is not a scientific producer.
    2. Print a flushed progress line at each phase boundary, and before and after every model load, generation, benchmark and subprocess. Include elapsed time and completed units. Print inside long loops and supervise owned children with a heartbeat at least every 60 seconds. Keep every output gap below 600 seconds and tool waits at most 60 seconds. Silence can end the task at 1200 seconds; progress permits the 4800-second hard cap. Do not pad duration.
    3. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Keep every tool call bounded. Use hash-bound checkpoints to resume completed units without dropping unfavorable rows. Store scratch work under /tmp, never the repository root.
    4. Before implementation, add task-owned REQ-* and SCENARIO-* requirements to the applicable capability spec. Write failing tests for changed behavior. Freeze the complete affected source/test closure, exact validation argv, classifications and deadlines before measurement. Preserve historical required failures. Do not reclassify a failed required check as diagnostic or omit it through a renamed wrapper.
    5. Use small existing library functions and current_work_receipt. Do not invoke a historical experiment main/run/validation dispatcher. Use private pytest basetemp, coverage files and CLI output roots under /tmp, outside results/. Keep atomic temporary files beside their destination. Preserve the child-results guard. Import receipts must contain nonempty resolved_imports keyed by fully qualified module name and actual __file__ paths.
    6. Snapshot the design, staged YAML and genuinely activated roadmap bytes in an immutable directory. Verify milestone 2026.09.683, exactly 14 tasks exp7865 through exp7878, order, titles, phases, deliverables, model/substrate declarations and gates against the visible table and embedded JSON. Before activation, emit blocked_pending_activation rather than pretending V682 is V683.
    7. Exercise count/order/ID/title/phase/path/model/class/gate mutations through the existing compare_contract library with explicit milestone, first_id=7865 and count=14. Check all current gate fields exist in upstream REQUIRED ARTIFACT FIELDS; prior failures have all four subfields; no gate references a retired or later task. Run schema, gate, exclusion and prior-failure lints on the staged file.
    8. Freeze the exposed 640-family development cohort roles, nine-arm/three-seed training, decision costs, family-level uncertainty and separate source-sufficiency estimand from the design. Freeze future E2E and affected-validation scopes. Do not run models or create another broad harness. Emit exactly one contract row per task plus separate mutation rows.
    9. Run the frozen affected pytest commands with PYTHONPATH=python:. and -n 0 -o addopts= --no-cov for ordinary runs. Require 100% changed-code statement coverage, including actual CLI success and failure paths. Combine explicitly named completed coverage files with identical settings. Use coverage report --fail-under=100, never Coverage.report(fail_under=...). Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py. Never skip tests, weaken assertions or edit QA guards to obtain a pass.
    10. Run a private real CLI, cold replay and the task-specific E2E checks. Apply the relevant ops/e2e-test-plan.md checks; record inapplicable checks before execution. Seal logs only after child exit and closed handles, at immutable hash-addressed paths. Limit raw shards to 50 MiB and keep every tracked file below 90 MB. Recompute metrics from primitive per-unit rows independently.
    11. Validate the exact terminal candidate with scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict. Set flagged_adversarial from the actual reports. Inspect final bytes after all required validation, not only a provisional candidate. Failed required checks imply disqualified and zero readiness. Retain private pending artifacts as partial_pending_* until owned work finishes; never use a complete prefix with class partial.
    12. Atomically publish the terminal deliverable. Use complete_* honest_verdict with positive | circular_positive | null | blocked | disqualified, or partial_* with partial only for retryably unfinished owned work. External incomplete evidence is blocked. Keep validity, readiness and benefit separate; null measurement can be ready. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve historical artifacts, production defaults and the active roadmap. Retire only an unchanged failed scope on its identical prior verdict. Do not activate or publish anything.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date: Numeric experiment_id; exact task_id, 2026.09.683 and {date}. principle: Identity separates current measurements from historical aliases.
    - honest_verdict, verdict_class: Terminal complete_* with positive | circular_positive | null | blocked | disqualified; unfinished owned work uses partial_* and partial. principle: External blocks terminate once; qualification is not benefit.
    - flagged_adversarial: Boolean derived from terminal verification. principle: Flagged evidence cannot open a gate.
    - gate_check_summary: Every failed check with upstream ID, path/hash, artifact_field, op, expected and observed. Required on every blocked verdict. principle: Missing input, missing field and failed value are distinct failures.
    - rows, sample_size_budget: Per-unit primitive metrics, arm, family, seed, status; intended/eligible/started/completed/censored/excluded/independent counts. principle: Aggregates must be recomputable; views, repeated calls and seeds are not independent families.
    - acceptance_gate_results: Separate validity, readiness, probability_quality, decision_benefit, retention and efficiency; null if unmeasured. principle: A successful fixture cannot establish a scientific benefit.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Measured monotonic timing plus hashes of inputs, code, configuration and seeds. principle: Authenticity follows observed work, not estimated duration.
    - source_artifact_hashes, preconditions_checked: Exact paths, dates, hashes, fields, exposure and authority roles. Do not hash this output as its own input. principle: Historical evidence has different authority from a current run.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, repository_health: Frozen argv/class/deadline, real exits and durable logs; retain inherited required failures. principle: A new driver must not conceal an old failed obligation.
    - verifier_is_oracle, claim_scope: True for deterministic fixture/oracle agreement and circular_positive class; natural human labels remain exposed development evidence. principle: A learned risk is not a truth certificate or fresh generalization.
    - field_principles: Persist the reason for each field and acceptance gate. principle: Auditors must know which failure a requirement prevents.
    - inference_substrate, inference_substrate_class, execution_venue: Record the specified substrate/class and host venue; use blocked_no_run before compute and retain the planned class separately. principle: Where work ran and what work ran are distinct facts.
    - MODEL_SPECS, model_specs, target_model, model_invocation_counts: Record only current LLM invocations with loads/calls/tokens/file hashes. For CPU work use empty model lists, explicit target_model=none (no pretrained model), and zero LLM calls. Small trained energy heads belong in trained_head_specs. principle: A cited Qwen model is not a current model invocation.
    - contract_ready_score: 1 only after all actual three-authority checks and required tests pass; otherwise 0. principle: Contract readiness is administrative.
    - contract_rows, mutation_rows, authority_snapshots, methods_manifest: 14 task rows, mutation outcomes, immutable copies and hashes, pre-registered budgets and analysis. principle: A visible table and execution file must have the same meaning.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7865_v683_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
