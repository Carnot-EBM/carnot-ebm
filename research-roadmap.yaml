- id: exp1377-pretest-fix-106-retro-closeout
  milestone: 2026.04.107
  deliverable: results/experiment_1377_pretest_fix_106_retro_closeout.json
  title: "Pre-test Suite Fix + Milestone .106 Retro Closeout"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 35
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
