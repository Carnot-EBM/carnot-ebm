- id: exp896-svamp-estimation-verifier
  milestone: 2026.04.69
  deliverable: results/experiment_896_svamp_estimation_verifier.json
  depends_on:
    - experiment_id: exp893-svamp-root-cause
      condition: labeling_mismatch_confirmed == True
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-SVAMP-ZERO-AUC: svamp_auc=0.125 (Exps 872, 883). Root cause confirmed
    by Exp 893: FoVer step-labeling is inapplicable to SVAMP single-step word problems
    (mean CoT depth < 2 vs GSM8K's > 4). This experiment implements EstimationVerifier
    (arXiv 2509.18565 approach): for word problems, verify by checking if the answer is
    within a plausible arithmetic range, not by step-by-step CoT labeling.

    GATE CHECK: Read results/experiment_893_svamp_root_cause.json.
    If labeling_mismatch_confirmed=False: write blocked artifact and exit.

    prior_failures:
      - experiment_id: exp883
        verdict: svamp_auc=0.125
        addressed_by: "Root cause confirmed by Exp 893. EstimationVerifier labels replace
                       FoVer CoT labels — checks if answer is in arithmetic plausibility range
                       rather than requiring multi-step intermediate steps."
      - experiment_id: exp872
        verdict: svamp_auc=0.125
        addressed_by: "Same root cause; same fix."
        retire_if_same_verdict: true

    EXISTING CODE TO READ FIRST:
    - results/experiment_893_svamp_root_cause.json — confirmed diagnosis
    - python/carnot/pipeline/vjepa_predictor.py — VariationalJEPAPredictor (for retraining)
    - python/carnot/verify/fover_labeler.py — FoVer (to understand labeling contract)
    - python/carnot/models/kan.py — KAN (used in energy computation)
    - openspec/change-proposals/research-roadmap-v69.md — .69 Phase 1 Exp 896

    TASK: Implement EstimationVerifier. Generate SVAMP-format synthetic labeled pairs.
    Retrain VariationalJEPAPredictor (VJEPA v3) on SVAMP labels. Target svamp_auc > 0.60.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Implement python/carnot/verify/estimation_verifier.py:
       class EstimationVerifier:
         verify(question: str, response: str) -> dict:
           a. Extract all numbers from question (regex: r'\d+\.?\d*')
           b. Identify operation type from question keywords:
              add: {"more", "total", "sum", "combined", "together"}
              subtract: {"left", "remaining", "fewer", "difference", "less"}
              multiply: {"times", "each", "per", "product"}
              divide: {"split", "each", "share", "per", "average"}
           c. Compute plausible answer range:
              add:      [min(numbers), sum(numbers) * 2]
              subtract: [0, max(numbers)]
              multiply: [min(numbers), max(numbers)**2]
              divide:   [0, max(numbers)]
           d. Extract numerical answer from response (regex for trailing number or
              "= X", "answer is X", "result is X" patterns)
           e. Return:
              {
                extracted_numbers: list,
                operation_type: str,
                plausible_range: [float, float],
                extracted_answer: float or null,
                in_range: bool,
                confidence: float  (1.0 if extracted_answer found, 0.5 if null)
              }
         label_pair(question: str, response: str, ground_truth: float = None) -> int:
           result = self.verify(question, response)
           If ground_truth provided: return 1 if abs(extracted_answer - ground_truth) < 0.01 else 0
           Else: return 1 if result["in_range"] else 0
    3. Add spec entries: REQ-VER-085 (EstimationVerifier), SCENARIO-VER-085.
    4. Generate synthetic labeled pairs for VJEPA v3:
       a. Load same 20 SVAMP questions from Exp 893.
       b. Also generate 80 additional synthetic single-step arithmetic word problems:
          Use template: "{name} has {N} {objects}. {verb_phrase} {M}. How many {objects} remain/total?"
          with varied names, objects, operations. Target 80 problems across add/sub/mult/div.
       c. For each: run Qwen3.5-0.8B to generate responses.
       d. Label with EstimationVerifier.label_pair().
