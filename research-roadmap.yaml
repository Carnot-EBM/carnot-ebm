          principle: "True iff a clean operator re-freeze package was re-emitted for the WINNING candidate (not the prior dependency-aware-only package)."
        operator_checklist:
          principle: "The ordered OPERATOR-ACTION steps (north-star sec-1 edit, CI-workflow update, trigger run) for the winner -- the re-freeze is operator-only."
        adversarial_verify_clean:
          principle: "True iff the artifact passes adversarial_verify with no critical flag."
        north_star_unmodified_assert:
          principle: "Asserts ops/north-star.md was NOT edited (operator-curated)."
        frozen_headline_unchanged_assert:
          principle: "Asserts the publication gate still reads 0.9131 and paper_ready is unchanged -- no silent substitution."
        n_seeds:
          principle: "Replication count (>=5)."
        n_examples:
          principle: "Sample-size rigor (FoVer n>=1000)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "dependency_aware_auroc present AND external_comparator_auroc present AND fusion_auroc present AND winner_vs_runnerup_delta_ci present AND adversarial_verify_clean == true AND north_star_unmodified_assert == true AND frozen_headline_unchanged_assert == true"
          principle: "A trustworthy re-freeze disambiguation requires all three candidates measured under the identical frozen protocol with the paired ranking CI, adversarial-clean, and the operator-curated headline + frozen number untouched -- otherwise the operator re-freezes to a candidate that is not actually the strongest."
      TERMINAL VERDICTS: "complete: refreeze_disambiguated_winner_<candidate>_beats_frozen_clean_package_reemitted_frozen_headline_unchanged" /
      "complete: refreeze_disambiguated_no_candidate_beats_frozen_headline_stays_0_9131" /
      "complete: blocked_fover_corpus_or_baselines_unavailable"
      Run: cd {project_root} && python scripts/experiment_3704_refreeze_disambiguate_dependency_vs_external_vs_fusion.py
