  - id: exp4220-oracle-distinct-arc-verifier-build-labeled
    milestone: 2026.06.391
    title: "PHASE A1 (HEADLINE BUILD; the de-risked retry) -- BUILD the labeled ARC candidate pool + train the ORACLE-DISTINCT learned ARC verifier. The .390 build (exp4209) blocked because it read per-candidate is_correct labels from the WRONG file (arc3_trm_verifier_rerank.json = rerank summaries). FIX: this task OWNS label construction -- reuse scripts/exp_verifier_detector_auroc.py:load_arc_rows() over arc3_gap3_stage2_eval_pool.json.gz + arc3_gap4_induced_programs.json (label = candidate grid == GAP-4 induced pred_grid; the SAME path that yielded 8,041 labeled candidates + AUROC 0.90 in exp4208). Stratify to WRONG-MAJORITY tasks (oracle@K > vote -- the ARBITER 2605.26172 / AggLM 2509.06870 headroom). Train the V-STaR class (exp4176, accepted+rejected -> correctness boundary) / an AggLM-style aggregator on ORACLE-DISTINCT features (NO demo execution at inference) OUT-OF-FOLD. Report off-fold AUROC + selector_trained + learned_verifier_path + wrong_majority_n. verifier_is_oracle=false. Honest build-null (AUROC~0.5 or too-few-positives) is COMPLETE and still persists the artifact for A2."
    priority: high
    track: verifier-oracle-distinct
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct learned ARC verifier is MANDATED by the 2026-06-14 P0 directive (HEADLINE = an oracle-distinct learned verifier closing GAP-3-ties-vote-on-ARC) -- false-positive scope-match vs retired GAP-3 content-EBMs / prior V-STaR (exp4176); forward difference = this attempt OWNS label construction via the proven load_arc_rows path (the .390 wrong-file block cannot recur), stratifies to wrong-majority tasks, verifier_is_oracle=false."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4220_oracle_distinct_arc_verifier_build_labeled.json
    prior_failures:
      - experiment_id: exp4209-oracle-distinct-arc-verifier-build
        verdict: blocked_arc_pool_no_candidate_labels
        addressed_by: "exp4209 read per-candidate is_correct labels from results/arc3_trm_verifier_rerank.json (rerank summaries, no training rows) -> accepted=0/rejected=0/total=0. This attempt OWNS label construction by reusing scripts/exp_verifier_detector_auroc.py:load_arc_rows() over arc3_gap3_stage2_eval_pool.json.gz + arc3_gap4_induced_programs.json -- the SAME path that produced 8,041 labeled ARC candidates + an oracle-distinct detection AUROC of 0.9016 in exp4208. The 'no labels' block is structurally impossible because the task builds the labels."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: The 2026-06-14 P0 HEADLINE, de-risked. Carnot's verifier wins everywhere it can EXECUTE but
      those are CIRCULAR (verifier == executable oracle). The deep, defensible, UNPROVEN claim is an
      ORACLE-DISTINCT verifier: a LEARNED scorer that captures the discriminating signal WITHOUT executing.
      .390 PROVED the signal exists (exp4208 oracle-distinct ARC detection AUROC 0.9016) but the SELECTOR
      build blocked on a wrong-file label lookup. This task builds the labels the proven way, then trains
      the learned ARC verifier; A2 measures whether it beats vote.

      EXISTING CODE TO READ FIRST:
        - scripts/exp_verifier_detector_auroc.py (load_arc_rows + arc_rows_from_entries -- the WORKING ARC label path; reuse it)
        - results/arc3_gap3_stage2_eval_pool.json.gz (entries[].candidates[]) + results/arc3_gap4_induced_programs.json (programs[] with demo_fit + pred_grid)
        - results/experiment_4176_vstar_learned_selector.json + results/experiment_4176_vstar_selector_model.json (the V-STaR accepted+rejected class + trainer to reuse)
        - results/experiment_4208_verifier_as_detector_auroc.json (the ARC detector: AUROC 0.9016, base_rate 0.0024 -- the imbalance to handle by stratifying to wrong-majority tasks)
        - research-references.md ".391 planning sweep" (AggLM 2509.06870 aggregator-beats-vote, AgentAuditor 2602.09341, ARBITER 2605.26172 wrong-majority, SCOPE 2512.15146 per-region features, MSV 2603.03417 cross-candidate features)
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline" (verifier_is_oracle), "Principle-Annotated Artifact Fields"

      TASK: build the labeled ARC pool + train the oracle-distinct verifier out-of-fold; report off-fold AUROC + artifact path.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE training): the GAP-4 pools load
           (`python3 -c "import json,gzip; json.load(gzip.open('results/arc3_gap3_stage2_eval_pool.json.gz')); json.load(open('results/arc3_gap4_induced_programs.json'))"`)
           AND scripts/exp_verifier_detector_auroc.py imports. If either missing -> honest_verdict
           `blocked_arc_gap4_pools_missing` and STOP. CPU is sufficient (small selector); no GGUF/GPU needed.
        1. BUILD the labeled pool: reuse load_arc_rows() / arc_rows_from_entries() to construct per-candidate
           rows {{task_id, features, is_correct}}. is_correct = candidate grid matches the GAP-4 induced
           pred_grid (the same execution-grounded label exp4208 used -- it is the TRAINING TARGET only; the
           learned verifier must NOT call the execution verifier at inference). Features are ORACLE-DISTINCT
           (computable without executing demos): vote_weight, self_consistency margin across the task's
           candidate set (MSV 2603.03417), per-region/per-cell confidence (SCOPE 2512.15146), grid stats
           (height/width/cells/color_count/nonzero_frac/entropy), program_length/digit_fraction.
        2. STRATIFY to WRONG-MAJORITY tasks: keep tasks with >=2 candidates AND >=1 correct candidate (the
           ARBITER/AggLM headroom -- where the correct answer is present but vote may miss it). Report
           wrong_majority_n (tasks where oracle@K > vote@1). If after stratification fewer than ~30 positive
           candidates remain, that is an honest sparsity finding -- proceed but flag it.
        3. Train the V-STaR selector (accepted+rejected) / an AggLM-style aggregator OUT-OF-FOLD (k-fold or
           held-out-TASK split so no task leaks train->test). Report off-fold detection AUROC + bootstrap
           CI95. Persist the learned verifier (weights/artifact path) for A2. Set selector_trained=true and
           verifier_is_oracle=false. If off-fold AUROC is ~0.5 (no learnable oracle-distinct signal beyond
           the detector) OR positives are too few to train, report
           honest_verdict `complete_oracle_distinct_arc_verifier_no_learnable_signal_auroc<x>` and STILL set
           the artifact path (A2 reads the null).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed (complete:/success:/passed:/shipped:). A trained off-fold verifier OR an honest 'no learnable oracle-distinct signal / too-few-positives' is COMPLETE -- both feed A2."
        selector_trained:
          principle: "BARE bool: A2's gate compares this raw value (gated-fields-must-be-bare); true iff a learned ARC verifier artifact was persisted out-of-fold."
        oracle_distinct_auroc:
          principle: "BARE float: off-fold detection AUROC of the LEARNED verifier vs is_correct -- the oracle-distinct discrimination the GAP-3 content energies lacked; >0.5 CI95-excl is the precondition for an A2 beats-vote win."
        wrong_majority_n:
          principle: "BARE int: count of stratified tasks where oracle@K > vote@1 -- the ARBITER/AggLM headroom the learned verifier targets; A2 measures vote-beating ON these."
        learned_verifier_path:
          principle: "The persisted artifact A2 loads to rerank held-out ARC candidates; the build deliverable."
        verifier_is_oracle:
          principle: "BARE bool=false -- the learned verifier scores WITHOUT executing the demos (Circularity Discipline); this is what makes an A2 win headline/gate-eligible, unlike the circular execution verifier."
        model_specs:
          principle: "The V-STaR/aggregator probe architecture + the oracle-distinct feature set; required methodology."
        random_seed:
          principle: "Determinism precondition; the fold split + probe init seeded so the AUROC is reproducible."
        reproducibility_checksum:
          principle: "Hash of the ARC pools + fold split + features; catches silent pool/feature drift before A2 measures."
      ACCEPTANCE GATE:
        - condition: "selector_trained true with oracle_distinct_auroc + learned_verifier_path + wrong_majority_n reported AND verifier_is_oracle=false, OR an honest no-learnable-signal / blocked_* verdict"
          principle: "A2 needs a persisted oracle-distinct verifier (or an honest null); a learned off-fold AUROC>0.5 on wrong-majority strata is the precondition for testing whether it beats vote."

      Run: `python3 {project_root}/results/experiment_4220_oracle_distinct_arc_verifier_build_labeled.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4221-oracle-distinct-arc-verifier-beats-vote
    milestone: 2026.06.391
    title: "PHASE A2 (THE HEADLINE GATE, gated_on A1 selector_trained) -- does the ORACLE-DISTINCT learned ARC verifier BEAT majority vote OFF-ORACLE? On a HELD-OUT ARC split (disjoint from A1 folds), rerank with the A1 learned verifier (verifier_is_oracle=false; does NOT execute demos) vs majority-vote vs a MATCHED no-verifier control (same candidates/budget) vs oracle@K (the positive-control ceiling) vs an ARBITER conservative-override arm (keep vote unless the learned margin clears a fixed threshold, arXiv:2605.26172 / AggLM 2509.06870). The LOAD-BEARING gate: verifier@1 - vote@1, bootstrap CI95 EXCLUDES 0 AND headroom exists. YES -> the first oracle-distinct verifier win (closes GAP-3-ties-vote; informs the DiffusionGemma gate). TIE-with-headroom -> honest null. No-headroom -> uninformative (FALSE_NEGATIVE_RISK, not a verifier failure)."
    priority: high
    track: verifier-oracle-distinct
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct beats-vote measurement is MANDATED by the 2026-06-14 P0 directive (HEADLINE; verifier_is_oracle=false + MATCHED control + CI95-excl-0) -- false-positive scope-match vs retired GAP-3 rerank/selector exps; forward difference = a LEARNED oracle-distinct verifier (A1, built on the now-fixed label path) + an ARBITER conservative-override arm, the matched-control de-confound the prior circular wins lacked."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4221_oracle_distinct_arc_verifier_beats_vote.json
    gated_on:
      - upstream: exp4220-oracle-distinct-arc-verifier-build-labeled
        artifact_field: selector_trained
        op: '=='
        value: true
    prior_failures:
      - experiment_id: exp4210-oracle-distinct-arc-verifier-beats-vote
        verdict: blocked_gate_check_failed
        addressed_by: "exp4210 gate-blocked because exp4209.selector_trained was False (the upstream build blocked on a wrong-file label lookup). This attempt is gated on exp4220, which OWNS label construction via the proven load_arc_rows path so selector_trained=true is achievable; the gate therefore actually runs on a built oracle-distinct verifier with a matched control + ARBITER conservative-override arm."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: THE .391 headline gate. A1 (exp4220) built an oracle-distinct learned ARC verifier
      (verifier_is_oracle=false) on the now-fixed label path. Now measure whether it BEATS majority vote on
      a HELD-OUT ARC pool -- the deep, defensible claim the circular execution wins cannot make. ARBITER
      (arXiv:2605.26172) names the headroom: "wrong-majority failures" -- sampled trajectories cluster into
      basins and vote picks the LARGEST basin, not the most accurate, so the correct answer is in the pool
      but loses. AggLM (2509.06870) shows a LEARNED aggregator recovers exactly those. The MATCHED
      no-verifier control (same candidates/budget) is the de-confound the prior circular wins lacked.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4220_oracle_distinct_arc_verifier_build_labeled.json (learned_verifier_path, oracle_distinct_auroc, wrong_majority_n, verifier_is_oracle=false)
        - scripts/exp_verifier_detector_auroc.py:load_arc_rows (build the HELD-OUT split the SAME way, disjoint from A1's folds)
        - scripts/adversarial_verify.py (run it on the artifact -- check_circular_moat_overclaim must stay clean since verifier_is_oracle=false), scripts/summarize_artifact.py
        - research-references.md ".391 sweep" (AggLM 2509.06870 aggregator beats vote; ARBITER 2605.26172 conservative-override; AgentAuditor 2602.09341 beats vote AND LLM-judge)
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline" + "Adversarial Artifact Verification" (FALSE_NEGATIVE_RISK positive control)

      TASK: held-out ARC rerank -- learned verifier vs vote vs matched control vs ARBITER-override vs oracle@K; the decisive CI95 gate.

      CONCRETE STEPS:
        0. PRECONDITIONS: A1 reported selector_trained=true with a readable learned_verifier_path. If
           missing/false -> honest_verdict `complete_oracle_distinct_arc_gate_deferred_no_built_verifier`
           and STOP.
        1. On a HELD-OUT ARC split (disjoint from A1 folds; N as large as the pool allows; if N<30 note the
           CLT-floor caveat), compute per-task: vote@1 (majority candidate), verifier@1 (candidate maximizing
           the A1 LEARNED score -- NO demo execution at inference), oracle@K (any candidate exactly correct =
           the POSITIVE CONTROL), a MATCHED no-verifier control (same budget, random/first selection), and an
           ARBITER conservative-override arm (keep the vote candidate unless the learned-score margin between
           top-1 and the vote candidate clears a fixed pre-registered threshold).
        2. POSITIVE CONTROL FIRST: if oracle@K ~= vote@1 (no recoverable headroom) the corpus is
           ceiling-saturated -> the null is UNINFORMATIVE (FALSE_NEGATIVE_RISK) -> report
           `complete_oracle_distinct_arc_no_headroom_uninformative`, do NOT claim the verifier fails.
        3. THE GATE: verifier_minus_vote = verifier@1 - vote@1, task-level bootstrap CI95 (>=2000 resamples).
           Also report arbiter_override_minus_vote. Emit oracle_distinct_beats_vote BARE bool := (CI95
           excludes 0 AND delta>0 AND headroom exists). Run adversarial_verify.py (it must NOT raise
           CIRCULAR_MOAT_OVERCLAIM). Honest headline: one of
           {{oracle_distinct_verifier_beats_vote, oracle_distinct_verifier_ties_vote_with_headroom,
           oracle_distinct_arc_no_headroom_uninformative}}.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A clean beats-vote win, a clean ties-vote-with-headroom null, and an honest no-headroom-uninformative are ALL COMPLETE -- the first clean read on the oracle-distinct frontier either way (this time the gate RAN)."
        oracle_distinct_beats_vote:
          principle: "BARE bool: verifier@1 - vote@1 CI95 excludes 0 AND delta>0 AND headroom exists -- the de-confounded oracle-distinct win (GAP-3-ties-vote closed); NOT a circular execution result."
        verifier_minus_vote_delta:
          principle: "verifier@1 - vote@1 on held-out ARC -- the oracle-distinct lift; recovers the wrong-majority-failure answers (ARBITER/AggLM) a flat vote discards."
        verifier_minus_vote_ci95:
          principle: "Task-level bootstrap CI95 of the delta -- excluding 0 is what distinguishes a real oracle-distinct win from noise."
        arbiter_override_minus_vote:
          principle: "Conservative-override (keep vote unless high learned margin) minus vote -- the ARBITER 2605.26172 deployment pattern; can win where a flat rerank loses by overriding only on confident cases."
        oracle_at_k:
