        verdict: "blocked_live_recurrence_backend: continuous self-learning was tied to live model/runtime readiness"
        addressed_by: "This attempt is offline and recurrence-triggered, so live runtime is not a prerequisite."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        FR-11 continuous self-learning is central to the PRD. `.271` proved an
        offline replay can lower energy without forgetting on a tiny set, but it
        did not improve correctness and used eager replay writes. The RecMem
        paper suggests consolidating only after sustained recurrence.

      EXISTING CODE TO READ FIRST:
