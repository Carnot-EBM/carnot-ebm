      6548 items, only 114 incorrect). This task assembles a >=150-incorrect,
      ~balanced, IN-DISTRIBUTION corpus and PROVES the ensemble discriminates
      (AUROC>=0.65) before it is handed to the scissor.

      EXISTING CODE/DATA TO READ FIRST:
        - data/fover_corpus_v4.json (6548 items; 114 incorrect — keys question_id, step_text, label, confidence)
        - data/fover_corpus_v3.json (216 items; 114 incorrect, 102 correct)
        - data/fover_corpus_expanded.json (85 items; 38 incorrect)
