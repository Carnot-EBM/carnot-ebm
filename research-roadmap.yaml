    experiment_id, task_id, milestone, run_date: principle: Identify the invocation and exact execution authority.
    honest_verdict, verdict_class: principle: honest_verdict starts complete_; class is positive | circular_positive | null | blocked | disqualified | partial. Partial means retryable unfinished owned work only.
    gate_check_summary: principle: Each block names upstream, path/hash, exact field, operator, expected and observed values. Missing evidence differs from zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, historical_model_provenance: principle: Count only current model work and retain imported provenance separately.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count, sample_size_budget: principle: Preserve every intended unit and condition; repetitions do not create independent sources.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Constructed oracle success is circular_positive. Exposed development keeps both generalization scores zero.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path, adversarial_findings: principle: Readiness requires complete byte-bound validation; it never requires a scientific win.
    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes: principle: Bind each conclusion to actual work and replayable configuration.
    cited_upstream_artifacts, field_principles: principle: Record imported fields and hashes; explain the evidentiary purpose of every added field.
    current_contract_ready_score, history_reader_ready_score, cached_support_ready_score, canonical_tasks_sha256: principle: Current authority, valid historical readers and sufficient cached data are separate gates.
    protocol_path, protocol_sha256, methods_manifest, authority_snapshots, first_reduction_mismatch, historical_dispositions: principle: Preserve old outcomes and bind the changed execution contract.
    finding_consumer_policy, finding_dispositions, policy_negative_controls: principle: A finding is resolved by evidence, never by deleting it or ignoring a failing command.
