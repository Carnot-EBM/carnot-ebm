        op: "=="
        value: "success"
    deliverable: "results/experiment_3354_ebt_sidecar.json"
    prompt: |
      CONTEXT: The ARM-as-EBM premise (arXiv:2512.15605) requires comparing EBT sequence-level energy scoring vs AR logits.
      EXISTING CODE TO READ FIRST:
        - `python/carnot/pipeline/energy_descent.py`
      TASK: Implement an auditable energy-budget diagnostic over exact fixtures.
      CONCRETE STEPS:
        1. Parse the outputs from the live constrained generation.
        2. Score the generated traces using an energy formulation ($E = -\log P$).
        3. Correlate the prefix energy with the final exact verdict from Z3/sympy.
        4. Report the bound/approximation gap in the artifact.

      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3354_ebt_sidecar.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3355-verifier-guided-backtracking-ladder
    milestone: "2026.05.310"
    title: "Verifier-guided backtracking (VGB) repair ladder for GSM8K"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 15
    track: live-model
    inference_substrate: live_generation
    requires_gpu: true
    deliverable: "results/experiment_3355_vgb_repair_ladder.json"
    prompt: |
      CONTEXT: Repair should not be a single candidate pass. We need a multi-turn code/constraint repair ladder (like ReVeal/TraceFix) where tests are the only authority.
      EXISTING CODE TO READ FIRST:
        - `python/carnot/pipeline/verify_repair.py`
      TASK: Create a multi-turn generation-verification repair loop.
      CONCRETE STEPS:
        1. Load a SOTA GGUF model.
        2. Pick 10 failed GSM8K examples from the baseline.
        3. Feed the exact solver counterexamples back into the model prompt and retry generation.
        4. Loop up to 3 times per problem.
        5. Measure the repair lift (how many are fixed) and the satisfiable drift.

      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3355_vgb_repair_ladder.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

