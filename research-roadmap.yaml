      Read CLAUDE.md, especially the "Verifier Authenticity Discipline"
      that shipped 2026-05-21.

      CONTEXT: exp2727 (.259) diagnosed the Tier 0s fast-path returning
      0.0 for non-arithmetic inputs. The .260+ v2-v5 chain produced
