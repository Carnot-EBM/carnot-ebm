       (a) SOTA model download overhead within timed experiment
       (b) repair loop iteration overrun (too many repair attempts)
       (c) 50q scale × per-question latency
       Record diagnosis in honest_verdict field.
       Apply fix: add CARNOT_EXPERIMENT_TIMEOUT_MINUTES=40 to Exp 906's ExperimentTemplate
