    \   - build_precision_v8_artifact(results, inference_mode, cot_pairs_path) -> Dict\n\
    5. Write scripts/experiment_527_live_100q_precision_v8.py:\n\
    \   a. apply_env_autofix() FIRST (confirm final_env_value != '0')\n\
    \   b. ExperimentTimeoutWatchdog(527, timeout_minutes=120)\n\
    \   c. ExperimentTemplate(527, 'Live 100q Precision v8',\n\
    \      'results/experiment_527_live_100q_precision_v8.json', requires_gpu=True)\n\
    \   d. DeliverableGuard('results/experiment_527_live_100q_precision_v8.json')\n\
    \   e. GPUVRAMGateV2(min_free_gb=5.0, kill_first=True).__enter__()\n\
    \   f. JITVRAMCheck(0).gate_model_load('gemma4-int4', required_gb=10.0); if not\
    \ cleared emit deferred artifact\n\
    \   g. JITVRAMCheck(1).gate_model_load('qwen3.5-0.8b', required_gb=1.5); if\
    \ not cleared emit deferred artifact\n\
    \   h. Load 100 GSM8K questions\n\
    \   i. LongRunBenchmarkExecutor(batch_size=25,\
    \ checkpoint_path='results/exp527_ckpt')\n\
    \   j. For each question: baseline inference → VeriCoT+VPRM+CRANE extraction\
    \ → repair if violations found → record baseline_correct, pipeline_correct\n\
    \   k. Compute Wilson 95% CI for baseline and pipeline accuracy\n\
    \   l. Write CoT pairs to results/exp527_cot_pairs.json (FOVER format, same as\
