  - id: exp3045-fr11-governed-self-learning-boundary
    milestone: "2026.05.285"
    deliverable: "results/experiment_3045_fr11_governed_self_learning_boundary_v1.json"
    title: "FR-11 governed self-learning boundary"
    priority: high
    max_turns: 30
    estimated_wall_time_min: 25
    track: "self_learning"
    inference_substrate: "aggregation"
    requires_gpu: false
    continuous_self_learning_task: true
    prior_failures:
      - experiment_id: exp3033-fr11-nonforgetting-negative-control-stress
        verdict: "complete: promotion_decision=controller_only_promotable; heldout_delta_after_update=0.875; prior_retention_delta=0.0; shuffled_control_delta=-2.125"
        addressed_by: "Adds governed self-improvement boundaries, rollback metrics, family contradiction rate, and delayed-regression requirements before any stronger FR-11 claim."
        retire_if_same_verdict: true
      - experiment_id: exp3020-dvi-verifier-feedback-self-learning-controller
        verdict: "complete: DVI controller self-learning evidence ready but bounded"
        addressed_by: "Converts the controller-only result into a governed protocol instead of expanding claims by wording."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. FR-11 is controller-only promotable after .284. Governed self-improvement work suggests contradiction graphs, edit rights, rollback, and non-regression metrics before stronger self-learning claims.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-program.md
      - _bmad/prd.md
      - results/experiment_3032_fr11_heldout_dvi_replay_v2.json
      - results/experiment_3033_fr11_nonforgetting_negative_control_stress_v1.json
      - research-references.md

      TASK
      Produce a governance artifact defining exactly what `.285` FR-11 self-learning may and may not claim, and what exp3046 must measure.

      CONCRETE STEPS
      1. Load exp3032 and exp3033 and summarize the controller-only evidence and its limits.
      2. Define allowed edit targets: controller weights, trace memory, validator thresholds, KAN/locality anchors, model weights. Mark model weights out of scope unless an experiment actually trains them.
      3. Define required metrics for exp3046: family holdout delta, prior retention delta, no-feedback delta, shuffled-control delta, contradiction graph size/rate, rollback count, delayed-regression delta, and source-trace completeness.
      4. Define automatic non-promotion criteria for tautology, self-confirming labels, family leakage, and missing negative controls.
      5. Set fr11_governance_ready=true only if the protocol is complete enough for a gated self-learning experiment.

      REQUIRED ARTIFACT FIELDS:
      - fr11_governance_ready: bool (principle: self-learning experiments must gate on explicit promotion rules)
      - allowed_edit_targets: list (principle: controller-side and model-weight learning must be separated)
      - forbidden_claims: list (principle: capstone wording must not outrun evidence)
      - required_metrics: list (principle: downstream self-learning must be measurable)
      - non_promotion_criteria: list (principle: failure modes must be predeclared)
      - prior_evidence_summary: dict (principle: governance must trace to exp3032/exp3033)
      - continuous_self_learning_scope: str (principle: FR-11 scope must be explicit)
      - inference_substrate: dict (principle: aggregation work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

