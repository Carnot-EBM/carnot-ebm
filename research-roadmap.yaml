  - id: exp5323-native-gguf-backend-flag-bisect-v486
    milestone: "2026.07.486"
    title: "Exp 5323: Native GGUF backend and flag bisect for mandated SOTA models"
    priority: critical
    track: infrastructure
    deliverable: results/experiment_5323_native_gguf_backend_flag_bisect_v486.json
    requires_gpu: true
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 90
    prior_failures:
      - experiment_id: exp5309-sota-runtime-timeout-rootcause-matrix-v485
        verdict: "blocked_sota_runtime_unblocked_false: no_mandated_model_completed_load_first_token_and_8_tokens:generation_incomplete,generation_incomplete,generation_incomplete"
        addressed_by: "Different from Exp5309: this task specifically bisects backend binaries and flags, including llama-completion/server alternatives, unsupported conversation flags, and batch/context settings found in the .485 logs."
        retire_if_same_verdict: true
      - experiment_id: exp5297-changed-runtime-sota-substrate-gate-v484
        verdict: "blocked_preconditions: changed_runtime_sota_ready=false flagship_moe:blocked_native_cli_timeout:offload=True"
        addressed_by: "Different from Exp5297: this is not another changed-substrate gate; it records per-backend command variants and first-token root cause for the mandated model set."
        retire_if_same_verdict: true
      - experiment_id: exp5284-sota-runtime-offload-receipt-repair-v483
        verdict: "blocked_preconditions: sota_offload_ready=false flagship_moe:blocked_no_gpu_offload_evidence:offload=False"
        addressed_by: "Different from Exp5284: it uses native llama.cpp CLI/server binaries with fresh GPU receipts, not the retired CPU-only Python binding offload path."
        retire_if_same_verdict: true
      - experiment_id: exp5274-solver-constraint-extraction-retry-gated-v482
        verdict: "blocked_preconditions: llama_cpp_gpu_offload_unavailable; retry was unmeasured"
        addressed_by: "Different from Exp5274: this task performs runtime diagnosis only and does not attempt solver extraction or quality measurement."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Run from {project_root} on {date}. Exp5309 produced GPU/offload evidence but failed to complete load plus first token plus 8-token generation for any mandated SOTA GGUF model. It also exposed concrete root causes: an unsupported `--no-conversation` flag on `llama-cli` and a Gemma MoE batch/context assertion. This experiment repairs command form before any quality task runs.

      EXISTING CODE TO READ FIRST:
      - CODEX.md
      - CLAUDE.md
      - scripts/experiment_template.py
      - results/experiment_5309_sota_runtime_timeout_rootcause_matrix_v485.json
      - results/experiment_5297_changed_runtime_sota_substrate_gate_v484.json
      - results/experiment_5284_sota_runtime_offload_receipt_repair_v483.json
      - ops/changelog.md
      - ops/status.md
      - research-hardware-wishlist.md

      TASK:
      Bisect native llama.cpp backend binaries, generation modes, and flags until either at least one mandated SOTA GGUF model has a usable bounded generation receipt or the next blocking root cause is precise. Do not claim model quality.

      CONCRETE STEPS:
      0. PRECONDITIONS: record GPU visibility, `nvidia-smi`, CUDA/driver version when available, llama.cpp binary paths and versions, free disk, free VRAM, and whether model files are already cached. If a compute-bound precondition is absent, write a blocked artifact instead of faking a run.
      1. Define MODEL_SPECS in the artifact:
         - unsloth/Qwen3.6-35B-A3B-GGUF
         - unsloth/gemma-4-31B-it-GGUF
         - unsloth/gemma-4-26B-A4B-it-GGUF
      2. Use llama.cpp-compatible GGUF loading or the repo's cached SOTA helper pattern. Do not load GGUF repositories with Hugging Face `AutoTokenizer`.
      3. Compare available native paths such as `llama-cli`, `llama-completion`, and `llama-server`/completion API where present. Remove unsupported flags and test batch/context settings that avoid the `.485` assertion.
      4. For each attempted mandated model, record command, model path, context, batch, ubatch, GPU layers, tensor split if used, prompt, n_predict, timeout, GPU memory delta, offload evidence, first-token time, and 8-token completion status.
      5. Set `sota_backend_candidate_ready` true only if at least one mandated model completes load, first token, and bounded 8-token generation with authenticated GPU offload. Otherwise set it false and record the next root cause.
      6. Run focused runtime checks only. Do not run SOTA quality benchmarks.

      REQUIRED ARTIFACT FIELDS:
      - experiment_id with principle.
      - milestone with principle.
      - status with principle.
      - honest_verdict with terminal prefix `complete:` or `blocked_`.
      - inference_substrate with principle; expected value is local_native_llama_cpp_gguf_backend_bisect.
      - MODEL_SPECS with principle and the three mandated GGUF model ids.
      - preconditions_checked with principle.
      - backend_matrix with principle.
      - per_model_runtime_matrix with principle.
      - best_backend_command with principle.
      - timeout_or_crash_root_cause with principle.
      - sota_backend_candidate_ready with bare boolean value for downstream gates.
      - runtime_unblocked_min_one_mandated with bare boolean value.
      - no_quality_claim with bare boolean value; must be true.
      - tests_run with principle.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

