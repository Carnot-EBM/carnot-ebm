      TASK:
      Build a sealed chronological multi-turn constraint stream from all three mandated SOTA GGUF families, classify exact failure modes independently, write the main artifact plus results/experiment_5772_sota_constraint_drift_stream.rows.jsonl, and do not implement learning.

      CONCRETE STEPS:
      0. PRECONDITIONS: enforce all Exp5771 gates; verify the three mandated GGUF files, llama-server/CUDA support, real GPU offload via VRAM before/after, model chat templates, exact Z3/finite-domain validators, seeds, free VRAM/RAM/disk, and checkpoint/resume paths. Emit a terminal blocked artifact if real offload or any flagship model is unavailable; tiny legacy models may run smoke tests only and cannot populate headline rows.
      1. Add/extend benchmark/verification REQ-* before implementation. Freeze at least three domains (scheduling, finite-domain CSP, and logic-grid), a chronological multi-turn session protocol, development/science split, candidate sets, protected immutable facts, mutable constraint additions/retractions, and row hashes before generation.
      2. Define `MODEL_SPECS` from `cached_sota_pair()` and require these exact headline hub IDs: `unsloth/Qwen3.6-35B-A3B-GGUF`, `unsloth/gemma-4-31B-it-GGUF`, and `unsloth/gemma-4-26B-A4B-it-GGUF`. Record exact GGUF paths, quantization, GPU, context, chat template, tokens, latency, and `models_used`.
      3. Reuse the sealed finite-choice channel: each turn exposes a preregistered set of full candidate assignments and the model returns one candidate ID. Preserve raw text, parsed ID, token counts, finish reason, and retries. Do not let model prose define a constraint or ground truth.
      4. For every turn, independently label parser failure, maintained-ledger contradiction, satisfiable answer drift, protected-fact distortion, exact answer validity, candidate-domain completeness, and validator disagreement. A satisfiable ledger with an answer that violates it is drift, not contradiction.
      5. Keep exact ground truth and science labels hidden from generation. Build non-degenerate positive/negative controls, permutation controls, model-identity canaries, truncation/echo/repetition controls, and at least 60 evaluable science turns per model family unless the preregistered power calculation justifies more.
      6. `stream_ready_score=1.0` only when every expected headline cell ran with real SOTA offload, parser failures and validator disagreements are zero, candidate domains are complete, splits are disjoint, protected facts are separately hashed, and at least one exact-error/drift event provides nonzero learning headroom. Otherwise block downstream learning honestly.
