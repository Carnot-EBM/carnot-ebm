        addressed_by: "exp2534 implemented ACSE (Adaptive Conformal Score Estimation). BB-UCP (Bootstrap-Based Uncertainty-Calibrated Prediction) per arXiv:2509.23002 is a different algorithm: it bootstraps calibration intervals WITHOUT labeled test data by leveraging the ensemble's internal score distribution. Different paper, different technique (bootstrap vs. adaptive threshold), different data requirement (label-free)."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
