tasks:
  - id: exp6448-v555-terminal-handoff-and-queue-integrity
    operator_override: '2026-05-29 operator directive (standing): routine milestone-transition work scope-matches prior handoffs by construction. This task hands off V554 and validates the new V555 queue; no previous task could validate this milestone.'
    milestone: "2026.08.555"
    deliverable: results/experiment_6448_v555_terminal_handoff_and_queue_integrity.json
    title: "V554 terminal handoff and V555 queue integrity"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 45
    agent_type: codex
    model: gpt-5.5
    prompt: |
      CONTEXT
      Milestone 2026.08.554 reached terminal state with 9 activated tasks although its design document expected 12. Exp6436 detected the mismatch and set v554_queue_ready_score=0.0. Exp6437, Exp6440, and Exp6442 are gate-block artifacts. Exp6441 and Exp6443 have no science artifacts. Exp6444 correctly left CSL ineligible. V555 has 12 tasks and deliberately keeps its science branches independent of this queue audit. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/_bmad/prd.md, and {project_root}/_bmad/architecture.md
      - {project_root}/research-roadmap.yaml and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/research-complete.yaml, {project_root}/research-references.md, and {project_root}/research-hardware-wishlist.md
      - {project_root}/results/experiment_6436_v554_terminal_handoff_and_queue_preflight.json through {project_root}/results/experiment_6444_csl_lifecycle_recomputation_audit.json where present
      - {project_root}/results/experiment_6435_v553_adversarial_capstone.json
      - {project_root}/ops/conductor-log.md, {project_root}/ops/status.md, {project_root}/ops/changelog.md, and {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/exclusion_manifest_lint.py, and {project_root}/scripts/conductor_gates.py
      - {project_root}/scripts/adversarial_verify.py and {project_root}/ops/e2e-test-plan.md

      TASK
      Freeze the terminal V554 evidence and validate the activated V555 queue. Do not repair or rerun V554. Validate exact task count, IDs, deliverables, milestones, gates, prior-failure contracts, model declarations, prompt endings, and exclusion rules. Produce an audit artifact even when a check fails. No downstream task depends on this readiness score.

      CONCRETE STEPS
      0. PRECONDITIONS: resolve the repository root, active milestone, git state, active roadmap hash, V554 artifacts, exclusion manifest, roadmap schema, and protected files. Record missing and zero-byte files without changing them.
      1. Add or confirm the narrow infrastructure REQ-* and SCENARIO-* before implementation. Write focused tests first.
      2. Freeze one terminal row for each activated V554 task. Record task ID, path, byte count, status, honest_verdict, readiness fields, gate summary, current adversarial findings, and final claim eligibility.
      3. Validate research-roadmap.yaml with the Pydantic schema, prior-failure validator, exclusion-manifest linter, structured gate checker, duplicate ID and deliverable checks, and prompt terminal-line checks.
      4. Require exactly 12 tasks in conductor order, milestone 2026.08.555 on every task, 12 unique result paths, no retired ID, and no dependency on a retired task.
      5. For every gated task, confirm that its upstream task exists in this roadmap and that the upstream prompt declares the exact artifact_field in REQUIRED ARTIFACT FIELDS.
      6. Confirm every LLM task declares a mandatory GGUF, cached_sota_pair() or the same cache resolver, an embedded tokenizer, and no headline AutoTokenizer path.
      7. Confirm every comparative task has per_unit_rows=true and requires row emission. Confirm every blocked artifact contract requires gate_check_summary.
      8. Confirm every matching rerun has experiment_id, verdict, addressed_by, and retire_if_same_verdict=true. Confirm the Exp6448 operator override is nonempty and cites the standing transition directive.
      9. Run focused tests, schema validation, gate validation, exclusion lint, artifact convention checks, determination preservation, and root-clutter checks.
      10. Set v555_queue_integrity_score=1.0 only when all checks pass. Otherwise use a terminal blocked verdict and name every failed check.

      Required deliverable: {project_root}/results/experiment_6448_v555_terminal_handoff_and_queue_integrity.json.
      REQUIRED ARTIFACT FIELDS:
      status, v554_terminal_rows, v554_activated_task_count, v554_missing_zero_byte_or_blocked_artifacts, v554_terminal_claim_determinations, active_roadmap_hash, task_count, task_ids_in_order, unique_id_and_deliverable_check, milestone_consistency_check, schema_validation, prior_failure_validation, exclusion_manifest_validation, structured_gate_validation, gate_producer_contract_rows, model_policy_validation, per_unit_row_contract_validation, prompt_terminal_line_validation, protected_files_unchanged, v555_queue_integrity_score, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=false. field_principles must map every required field and every readiness condition. field_provenance must classify each required field as measured, derived, constant, or upstream. A blocked_* verdict requires gate_check_summary with failed check, expected condition, observed value, and evidence path. Otherwise use a terminal complete_, success_, passed_, or shipped_ prefix.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6448_v555_terminal_handoff_and_queue_integrity --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6449-generation-to-verdict-path-receipt-contract
    milestone: "2026.08.555"
    deliverable: results/experiment_6449_generation_to_verdict_path_receipt_contract.json
    title: "Ungated generation-to-verdict path receipt contract"
    priority: critical
    track: infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 90
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6437-generation-to-verdict-receipt-replay-contract
        verdict: "blocked_gate_check_failed"
        addressed_by: "This task is ungated, runs directly on immutable nonzero V553 fixtures, and validates identity, injected-boundary, and restored-boundary controls without depending on queue readiness."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6437 never exercised its receipt mechanism because the V554 queue gate failed. QuoteBench shows that the same raw model reply can produce a different exact result after an added parser or wrapper. V555 needs an immutable receipt from raw bytes through typed facts, energy input, checker transport, checker output, and final verdict. This task is intentionally ungated. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6437_generation_to_verdict_receipt_replay_contract.json
      - {project_root}/results/experiment_6426_task_scoped_runtime_receipt_contract.json and source
      - {project_root}/results/experiment_6427_fresh_constraint_saturation_factor_corpus.json and source
      - existing atomic-write, hash-chain, subprocess, exact-checker, and receipt helpers under {project_root}/python/carnot
      - {project_root}/scripts/experiment_template.py, {project_root}/scripts/adversarial_verify.py, and {project_root}/scripts/verdict_row_consistency_lint.py
      - {project_root}/openspec/capabilities/verification/spec.md, {project_root}/_bmad/traceability.md, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build a reusable versioned path receipt that binds raw generation bytes, parse output, typed facts, energy input, checker request, checker response, and final verdict. Prove boundary localization with matched identity, injected-wrapper, and restored-wrapper replay controls. Use existing immutable fixture bytes. Do not call an LLM.

      CONCRETE STEPS
      0. PRECONDITIONS: require readable nonzero fixture artifacts, an exact deterministic checker, atomic local storage, a monotonic clock, and new output paths. Record any failed condition in a terminal artifact.
      1. Add path-receipt REQ-* and SCENARIO-* before implementation. Write focused tests first.
      2. Define a versioned receipt with stage name, parent hash, input hash, output hash, code hash, configuration hash, monotonic timing, and terminal exact outcome.
      3. Reject missing stages, duplicate stage IDs, parent-hash breaks, stage reordering, silent input mutation, unknown code hash, and a final verdict that does not recompute from checker output.
      4. Run at least 24 independent fixture units through three matched controls: identity path, one disclosed injected transport wrapper, and the restored path.
      5. Emit per_unit_rows for each unit and control with every stage hash, changed boundary, expected verdict, observed verdict, localization result, and replay timing.
      6. Require the injected control to change only its declared boundary and the restored control to reproduce the identity terminal hash and verdict.
      7. Attack wrapper insertion, parser substitution, stale checker response, missing stage, reordered stage, replayed raw bytes under another unit ID, forged parent hash, and aggregate-row mismatch.
      8. Run focused tests, targeted 100% coverage for new source, spec coverage, relevant E2E checks, row consistency, current adversarial verification, determination preservation, and root-clutter checks.
      9. Set path_receipt_ready_score=1.0 only if every control localizes correctly, all identity and restore rows replay, all attacks are detected, and critical findings are zero.

      Required deliverable: {project_root}/results/experiment_6449_generation_to_verdict_path_receipt_contract.json.
      REQUIRED ARTIFACT FIELDS:
      status, receipt_schema_and_version, fixture_manifest_and_hashes, code_and_configuration_hashes, control_precommitment, per_unit_rows, identity_replay_results, injected_boundary_results, restored_boundary_results, stage_chain_validation, terminal_verdict_recomputation, attack_matrix, current_adversarial_findings, aggregate_row_recomputation, path_receipt_ready_score, protected_files_unchanged, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for the deterministic fixture checker and row arithmetic. per_unit_rows must contain every unit and control. field_principles must map every required field and every path_receipt_ready_score condition. A blocked_* verdict requires gate_check_summary. Otherwise use a terminal success prefix.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6449_generation_to_verdict_path_receipt_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6450-sota-fixed-policy-candidate-corpus
    milestone: "2026.08.555"
    deliverable: results/experiment_6450_sota_fixed_policy_candidate_corpus.json
    title: "Fresh SOTA fixed-policy candidate corpus"
    priority: critical
    track: sota-ingestion
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 480
    agent_type: codex
    model: gpt-5.5
    prompt: |
      CONTEXT
      V555 needs fresh matched candidate bytes before it can test typed grounding, objective replacement, held budget allocation, or constraint-energy selection. The corpus must avoid the retired finite-ID MMLU answer-transport lane. It uses executable fixed-policy tool-use environments with typed actions and an exact local simulator. It must preserve three sealed partitions and real selection headroom. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py and the cached_sota_pair() example
      - {project_root}/python/carnot/inference/sota_models.py and the authenticated Exp6413 runtime receipts
      - {project_root}/results/experiment_6426_task_scoped_runtime_receipt_contract.json and source
      - {project_root}/results/experiment_6427_fresh_constraint_saturation_factor_corpus.json and source
      - fixed policy, tool-call, simulator, exact checker, atomic write, and checkpoint helpers under {project_root}/python/carnot
      - {project_root}/ops/exclusion_manifest.yaml, especially the finite-ID generated-answer retirement
      - relevant verification, benchmark, and training-inference OpenSpec files and {project_root}/ops/e2e-test-plan.md

      TASK
      Build a fresh corpus of fixed-policy tool-use problems and matched candidate action plans from all three mandated local GGUF families. Seal development, allocation-held, and selection-held partitions before inference. Use a fixed parser and exact simulator. Preserve raw bytes, task-scoped CUDA receipts, path receipts, and per-candidate exact labels. Do not make a model-ranking claim.

      CONCRETE STEPS
      0. PRECONDITIONS: require both RTX 3090 GPUs, cached mandatory model files, sufficient free VRAM, the embedded GGUF tokenizers, exact simulator imports, enough disk and wall time, new raw-output paths, and a sealed pre-run manifest. Fail closed before inference if any condition fails.
      1. Add corpus and runtime-receipt REQ-* and SCENARIO-* before code. Write focused tests first.
      2. Define MODEL_SPECS with unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF through cached_sota_pair() or the same cache resolver. Use GGUF-embedded tokenizers. Never call AutoTokenizer for a GGUF.
      3. Seal 36 independent policy problems. Each problem has fixed entities, observable facts, fixed rule clauses, protected clauses, a typed tool-action schema, and a deterministic final-state checker.
      4. Freeze 12 development, 12 allocation-held, and 12 selection-held problems by hash before generation. Do not expose held labels or change partition membership later.
      5. Generate at least three candidate action plans per problem and model with frozen prompts, decoding settings, budgets, and seeds. Use fresh raw bytes. Legacy small models may run a smoke test only and must be excluded from headline rows.
      6. Parse with one fixed parser. Record parse failures as outcomes. Do not reprompt, add a grammar retry, or convert structural validity into semantic success.
      7. Run the exact simulator on each parsed plan. Store legality, protected-clause result, goal result, exact success, checker work, and path-stage hashes.
      8. Emit per_unit_rows for every problem, partition, model, candidate, seed, parse result, exact result, raw hash, runtime receipt, and timing.
      9. Check raw-output uniqueness, model-file hashes, embedded-tokenizer hashes, CUDA device samples, CPU fallback count, pre-run path nonexistence, partition sealing, and row-derived headroom.
      10. Attack output reuse, model-name substitution, hidden CPU fallback, parser repair, held-label leakage, partition reassignment, duplicate candidates, exact-veto bypass, and aggregate-row mismatch.
      11. Run live inference, focused tests, E2E checks, spec coverage, row consistency, current adversarial verification, determination preservation, and root-clutter checks.
      12. Set sota_corpus_ready_score=1.0 only if all three model families have authenticated eligible rows, raw hashes are unique, partitions stayed sealed, exact labels recompute, each partition has mixed exact outcomes and candidate-selection headroom, duration passes live-model checks, and critical findings are zero.

      Required deliverable: {project_root}/results/experiment_6450_sota_fixed_policy_candidate_corpus.json.
      REQUIRED ARTIFACT FIELDS:
      status, MODEL_SPECS, models_used, cached_sota_pair_receipts, model_file_and_embedded_tokenizer_hashes, autotokenizer_usage_count, device_and_runner_receipts, sealed_problem_and_partition_manifest, preexistence_and_freshness_receipts, fixed_action_schema_and_parser_hash, exact_simulator_and_checker_hashes, raw_output_manifest, per_unit_rows, eligible_rows_by_model_and_partition, parse_failures_by_model, exact_outcomes_by_model_and_partition, candidate_headroom_by_partition, raw_output_uniqueness_and_reuse_count, cpu_fallback_count, aggregate_row_recomputation, attack_matrix, current_adversarial_findings, sota_corpus_ready_score, protected_files_unchanged, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for the deterministic local simulator and final-state checker. The model and parser are not oracles. per_unit_rows must contain every candidate. field_principles must map every field and every sota_corpus_ready_score condition. A blocked_* verdict requires gate_check_summary. Otherwise use a terminal success prefix.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6450_sota_fixed_policy_candidate_corpus --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6451-typed-fact-grounding-fixed-policy-logic-ab
    milestone: "2026.08.555"
    deliverable: results/experiment_6451_typed_fact_grounding_fixed_policy_logic_ab.json
    title: "Gated on Exp6450 corpus readiness: typed fact grounding into fixed policy logic"
    priority: critical
    track: verification
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 360
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6450-sota-fixed-policy-candidate-corpus
        artifact_field: sota_corpus_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp5923-sota-schema-supported-constraintir-ab
        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "This task fills a fixed predeclared predicate inventory and executes a fixed rule program; it does not generate ConstraintIR, a schema, a solver, or a finite answer channel, and it scores exact semantics rather than structural validity."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Policy-as-logic (arXiv:2608.11905) separates LLM fact extraction from exact rule execution. Carnot previously retired a different mechanism in which an LLM generated a schema-supported ConstraintIR and achieved zero exact semantic success. V555 tests only fixed typed predicate slots and a fixed rule program. Exp6450 supplies fresh policy problems, candidate bytes, and exact simulator labels. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6450_sota_fixed_policy_candidate_corpus.json and source
      - {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json and its retirement record
      - the V555 Policy-as-logic entry in {project_root}/research-references.md
      - fixed predicate, policy, ASP or exact rule execution, simulator, and checker code under {project_root}/python/carnot
      - {project_root}/scripts/experiment_template.py, cached_sota_pair(), and embedded-tokenizer helpers
      - relevant verification and constraint OpenSpec files, {project_root}/_bmad/traceability.md, and {project_root}/ops/e2e-test-plan.md

      TASK
      Compare policy-as-prompt, policy-as-code, fixed-slot policy-as-logic, and a gold-fact upper bound on the Exp6450 development split. The LLM may only ground observed text into a fixed predicate inventory. It may not synthesize rules, code, a solver, or a new schema. The exact rule executor and simulator remain authoritative.

      CONCRETE STEPS
      0. PRECONDITIONS: require sota_corpus_ready_score=1.0, all three authenticated model receipts, readable development rows, a frozen predicate inventory, fixed rule program, exact simulator, sufficient GPU resources, new output paths, and sealed arm and analysis manifests.
      1. Add fixed-grounding REQ-* and SCENARIO-* before implementation. Write focused tests first.
      2. Define MODEL_SPECS with all three mandated GGUFs from cached_sota_pair() or the same resolver. Use embedded tokenizers and never AutoTokenizer.
      3. Freeze the predicate names, types, entity domains, allowed values, missing-value behavior, contradiction behavior, and rule program before any call. Reject unknown predicates and invalid bindings.
      4. Run matched arms on the 12 development problems: policy-as-prompt using Exp6450 plans; policy-as-code with the same text and budget; policy-as-logic with LLM-filled fixed slots plus exact execution; and gold facts as a non-deployment upper bound.
      5. Hold source text, model, decoding, candidate budget, and final simulator fixed. Count every parse or grounding failure. Do not retry failed structured output.
      6. Emit per_unit_rows for each problem, model, arm, predicate, grounded value, support span hash, rule result, selected action, exact outcome, false accept, abstention, token count, and timing.
      7. Recompute grounding precision and recall, exact task success, protected-clause success, false accepts, abstentions, and cost from rows with paired uncertainty over distinct problems.
      8. Attack unknown predicates, value coercion, unsupported facts, negation, revoked facts, binding swaps, contradictory facts, prompt-only leakage, gold-fact leakage, solver substitution, exact-veto bypass, and aggregate-row mismatch.
      9. Run live CUDA work, focused tests, E2E checks, spec coverage, row consistency, current adversarial verification, determination preservation, and root-clutter checks.
      10. Set typed_grounding_ready_score=1.0 only if policy-as-logic improves row-derived exact success over policy-as-prompt on at least one eligible model without a false-accept increase, grounding metrics meet the preregistered floor, gold facts retain headroom, all three models have eligible rows, and critical findings are zero.

      Required deliverable: {project_root}/results/experiment_6451_typed_fact_grounding_fixed_policy_logic_ab.json.
      REQUIRED ARTIFACT FIELDS:
      status, MODEL_SPECS, models_used, cached_sota_pair_receipts, model_and_embedded_tokenizer_hashes, autotokenizer_usage_count, device_and_runner_receipts, upstream_corpus_hash_and_gate_value, frozen_predicate_inventory_and_rule_program_hashes, arm_and_analysis_precommitment, per_unit_rows, grounding_metrics_by_model, exact_outcomes_by_arm_and_model, protected_clause_outcomes, false_accepts_and_abstentions, effects_and_uncertainty, checker_calls_tokens_and_timing, aggregate_row_recomputation, attack_matrix, current_adversarial_findings, typed_grounding_ready_score, protected_files_unchanged, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for the fixed rule executor, exact simulator, and row arithmetic. per_unit_rows must contain every problem, model, arm, and predicate decision. field_principles must map every field and gate condition. A blocked_* verdict requires gate_check_summary with the Exp6450 gate or failed precondition. Otherwise use a terminal success prefix.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6451_typed_fact_grounding_fixed_policy_logic_ab --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6452-representation-objective-causal-ab
    milestone: "2026.08.555"
    deliverable: results/experiment_6452_representation_objective_causal_ab.json
    title: "Gated on Exp6451 grounding readiness: representation-versus-objective causal A/B"
    priority: critical
    track: energy-verification
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6451-typed-fact-grounding-fixed-policy-logic-ab
        artifact_field: typed_grounding_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      The Objective Is the Bottleneck (arXiv:2608.12959) shows that a useful representation can look ineffective when the planner optimizes the wrong objective. Carnot needs the same separation for grounded constraints. Exp6451 supplies frozen predicate rows and exact outcomes. This task changes only the ranking objective and uses no LLM calls. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6451_typed_fact_grounding_fixed_policy_logic_ab.json and source
      - {project_root}/results/experiment_6450_sota_fixed_policy_candidate_corpus.json and immutable development rows
      - the V555 Objective Is the Bottleneck entry in {project_root}/research-references.md
      - constraint energy, factor, objective, candidate selection, exact simulator, and bootstrap helpers under {project_root}/python/carnot
      - relevant energy, verification, and constraints OpenSpec files and {project_root}/ops/e2e-test-plan.md

      TASK
      Freeze grounded representations and candidate bytes. Compare the current scalar violation objective, a reachability-aware lexicographic constraint energy, a clause-ablated version, and a shuffled placebo. Determine whether the objective, not representation absence, controls exact candidate selection.

      CONCRETE STEPS
      0. PRECONDITIONS: require typed_grounding_ready_score=1.0, readable immutable rows, at least two candidates per eligible problem, mixed exact outcomes, a deterministic simulator, a frozen objective specification, and new output paths.
      1. Add objective-intervention REQ-* and SCENARIO-* before implementation. Write focused tests first.
      2. Freeze candidate bytes, grounded facts, rule results, model IDs, partitions, and exact labels. Generate no new candidates and call no LLM.
      3. Predeclare four objectives: scalar count of active violations; lexicographic protected-constraint then reachability energy; sequential clause ablation; and shuffled-energy placebo. Use deterministic tie breaks.
      4. Score every candidate with every objective. Keep the exact final-state checker hidden from the scoring functions.
      5. Emit per_unit_rows for each problem, model, candidate, objective, clause energy, protected energy, reachability term, rank, selected candidate, exact outcome, and timing.
      6. Recompute selection accuracy, protected success, active-versus-ablated causal delta, placebo delta, rank correlation, false accepts, abstentions, and cost with paired uncertainty.
      7. Include representation-quality controls that hold objective fixed and objective-quality controls that hold representation fixed. Do not infer usefulness from a probe score alone.
      8. Attack exact-label leakage, objective tuning on selected outcomes, candidate mutation, tie-break drift, hidden clause deletion, protected-clause demotion, placebo non-randomness, and aggregate-row mismatch.
      9. Run focused tests, targeted coverage, E2E checks, spec coverage, row consistency, current adversarial verification, determination preservation, and root-clutter checks.
      10. Set objective_causal_ready_score=1.0 only if the new objective improves exact selection over the scalar objective, the active-versus-ablated effect is positive, the shuffled placebo does not reproduce the gain, protected success does not regress, aggregates recompute, and critical findings are zero.

      Required deliverable: {project_root}/results/experiment_6452_representation_objective_causal_ab.json.
      REQUIRED ARTIFACT FIELDS:
