- id: exp5157-deepen-warmstart-replay-ablation-v473
  milestone: 2026.07.473
  title: PHASE A1 multi-level deepening -- transition-slice warm-start replay ablation (exp5155 proposal #1, highest signal / lowest effort)
  priority: critical
  track: arc
  deliverable: results/experiment_5157_deepen_warmstart_replay_ablation_v473.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 90
  prompt: |
    CONTEXT:
    Executes exp5155's #1-ranked, highest-signal, lowest-effort falsifiable proposal (
    results/experiment_5155_multilevel_belief_state_scoping_v472.json, field proposed_experiments[0]).
    This is the operator's explicit fresh direction (2026-07-02): "we want to continue down this energy
    based models path for ARC-AGI-3, and tackle the multi-level capable live agent." exp5155 code-verified
    that the live agent's E3AgentPolicy cold-restarts its online world-model/belief induction at every
    level boundary: arc_competition_agent.py's _begin_level_goal_episode() resets
    _episode_transition_start = len(self.transitions), and _active_transitions()/_active_dsl_transitions()
    return only the post-boundary suffix that feeds arc_live_ttt.py's gated_engine_from_transitions()
    (which builds a FRESH LiveTTTWorldModel per induction attempt). 22 of 24 registry games are
    "deepened_but_stuck" at levels_reproduced >= 2 (ops/arc_solve_registry.yaml) with a recurring
    mechanic_class that persists across their own levels (e.g. ar25=reflection_mirror_object_alignment,
    bp35=goal_directed_navigation_local_obstacle_clear, cd82=palette_region_fill) -- exactly the situation
    where level-N's learned transition model plausibly still applies at level N+1.

    HYPOTHESIS (verbatim from exp5155): "Warm-starting the N+1 online TTT/DSL induction with level-N
    transition and energy statistics improves next-level held-out changed-cell value accuracy versus the
    current cold post-boundary slice."

    THIS IS AN OFFLINE REPLAY ABLATION, NOT a live solve attempt or full build -- exp5155 explicitly scoped
    it as "small: offline replay ablation over existing registry trajectories." A live level-up attempt
    based on this result is the SEPARATE, gated sibling task exp5159 (this milestone).

    LITERATURE-GROUNDED MECHANISM (outer-loop SOTA ingestion, 2026-07-02, see research-references.md "V473
    Outer-Loop Planner References" for full citations -- verified real arXiv IDs, do not re-search these):
    implement the WARM-START arm using the ReDRAW pattern (arXiv:2504.02252, "Adapting World Models with
    Latent-State Dynamics Residuals"): FREEZE level N's fitted LiveTTTWorldModel/DSL as a base model, and
    fit only a SMALL RESIDUAL CORRECTION using level N+1's post-boundary transitions, instead of calling
    gated_engine_from_transitions() fresh on the post-boundary suffix alone. This is specifically designed
    for the low-data regime a fresh level starts in (a handful of transitions), which matches this
    problem exactly. If time permits, also compare against the DynaMITE-RL pattern (arXiv:2402.15957):
    condition level N+1's induction on level N's terminal latent/belief state as a Bayesian prior rather
    than fitting a residual -- report which of the two warm-start designs (residual vs. conditioned-prior)
    performs better if you implement both, or just the ReDRAW residual design if only one fits the budget.

    EXISTING CODE TO READ FIRST:
    - research-references.md "V473 Outer-Loop Planner References" section (ReDRAW/DynaMITE-RL/BAM/ASR
      citations with Carnot-specific hooks -- read this before designing your carryover mechanism)
    - results/experiment_5155_multilevel_belief_state_scoping_v472.json in full (per_game_characterization,
      learning_gaps_verified_against_code, proposed_experiments[0])
    - python/carnot/agentic/arc_competition_agent.py (_begin_level_goal_episode, _active_transitions,
      _active_dsl_transitions, _induce_and_plan -- lines ~2244-2760)
    - python/carnot/agentic/arc_live_ttt.py (LiveTTTWorldModel class, gated_engine_from_transitions())
    - ops/arc_solve_registry.yaml (per-game `reproduce`/`solver` fields cite the artifacts holding recorded
      transition traces for each banked level -- this is your source of "existing registry trajectories")
    - python/carnot/agentic/arc_solver_kit.py (reproduce() -- reference for what a rigorous offline replay
      harness looks like in this codebase)

    PRECONDITIONS (check BEFORE any subsequent step):
      a. Confirm at least 6 registry games with levels_reproduced >= 2 have recoverable per-level
         transition traces (via their `reproduce`/`solver` registry fields or the cited experiment
         artifacts). If fewer than 6 are recoverable, honest_verdict blocked_insufficient_transition_traces
         and report which games WERE recoverable rather than fabricating a result on fewer than 6.

    CONCRETE STEPS:
    1. For each of >=6 registry games with levels_reproduced >= 2, extract the recorded transitions
       spanning at least one within-game level boundary (level N -> level N+1) from the cited artifacts.
    2. Build the CONTROL: replay level N+1's induction using ONLY the current cold _active_transitions()
       post-boundary suffix (matches today's live behavior exactly).
    3. Build the WARM-START arm: replay level N+1's induction with level N's transition and energy
       statistics carried forward (concretely: seed gated_engine_from_transitions with the pre-boundary
       transitions/DSL tuples as prior evidence, not just the post-boundary suffix -- design the exact
       carryover mechanism yourself, but it must be a genuine extension of the existing induction call, not
       a new parallel mechanism).
    4. Score both arms on HELD-OUT changed-cell value accuracy for level N+1 (predict a held-out action's
       resulting grid delta from the induced model; score against the real recorded outcome) and on
       actions-to-replay-to-next-level where recoverable.
    5. Apply exp5155's own falsifiable gate verbatim: warm-start beats cold-slice control by >=0.10 median
       changed-cell value accuracy OR >=20% fewer replayed actions to the next level, across >=6
       transitions; otherwise the gate FAILS and this is a genuine, valuable null.
    6. Report the per-game, per-transition breakdown, not just the aggregate -- a gate that passes on
       average but fails on most individual games is a different, weaker finding than a uniform win.
    7. Report HONESTLY either way. A null here is real information: it would mean the deepen-wall is not
       fixable by transition-model warm-starting alone, redirecting effort toward the register/hazard
       carryover probe (exp5155 proposal #3, queued for a future milestone) or the representation-level
       gaps named in project_arc_live_agent_learning_gaps.

    REQUIRED ARTIFACT FIELDS:
      games_tested:
        value: "list of {{game, n_level_transitions_tested}}"
        principle: "The gate requires >=6 transitions; this field lets a reviewer verify the sample size."
      warmstart_vs_cold_delta_median:
        value: float
        principle: "The exact quantity exp5155's falsifiable_gate is defined over."
      actions_saved_pct_median:
        value: float
      gate_passed:
        value: bool
        principle: "Apply exp5155's own falsifiable_gate verbatim -- do not redefine the threshold post hoc."
      per_transition_breakdown:
        value: "list of {{game, level_from, level_to, cold_accuracy, warmstart_accuracy, actions_cold, actions_warmstart}}"
        principle: "An aggregate-only report can hide a result that only holds for one or two games."
      solve_provenance:
        value: development_proxy
        principle: "This is offline replay over already-banked registry trajectories, not a live hidden-game solve."
      offline_reproduced:
        value: false
        principle: "No new level is claimed by this task -- it is a mechanism ablation feeding exp5159's live attempt."
      verifier_is_oracle:
        value: false
      random_seed:
        value: int
      reproducibility_checksum:
        value: string
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_ AND state plainly whether the
          gate passed or failed -- do not bury a null in qualifiers."

    Do not push. Do not modify scripts/research_conductor.py.
- id: exp5158-deepen-goal-energy-ranker-replay-v473
  milestone: 2026.07.473
  title: PHASE A2 multi-level deepening -- cross-level goal-energy ranker replay (exp5155 proposal #2)
  priority: high
  track: arc
  deliverable: results/experiment_5158_deepen_goal_energy_ranker_replay_v473.json
  prior_failures:
  - experiment_id: exp509-ppsebm-energy-magnitude-replay
    verdict: energy_magnitude_wins
    addressed_by: exp509 is an unrelated FR-11 self-learning experiment (PPSEBM Energy-Magnitude Replay,
      RETRO-050 fix replacing LLM-surprise with EBM energy priority in a general verify-repair replay-
      memory context) -- it shares only the generic keywords "energy" and "replay" with this task's title.
      This task is ARC-domain, within-game cross-LEVEL frontier ranking carryover, an entirely different
      mechanism, corpus, and scope. Flagging honestly per the Exclusion-Manifest Cross-Check discipline
      rather than assuming the scope-matcher's keyword overlap is a real prior failure.
    retire_if_same_verdict: false
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 90
  prompt: |
    CONTEXT:
    Executes exp5155's #2-ranked falsifiable proposal (
    results/experiment_5155_multilevel_belief_state_scoping_v472.json, field proposed_experiments[1]),
    the sibling to exp5157 (this milestone) in the operator's fresh "tackle the multi-level capable live
    agent" direction. Where exp5157 tests warm-starting the TRANSITION/DSL model, this task tests
    warm-starting the GOAL-DIRECTED RANKING signal: does a per-game online energy model fit to level-N
    win/near-win states rank level-N+1's frontier candidates closer to the eventual level-up than the
    current cold Exp4020-goal-energy-only bias?

    HYPOTHESIS (verbatim from exp5155): "A per-game online energy model fit to level-N win/near-win states
    ranks level-N+1 frontier candidates closer to the eventual level-up than the cold Exp4020-only bias."

    LITERATURE-GROUNDED MECHANISM (outer-loop SOTA ingestion, 2026-07-02, see research-references.md "V473
    Outer-Loop Planner References" -- verified real arXiv IDs): use the DynaMITE-RL pattern
    (arXiv:2402.15957, "Dynamic Model for Improved Temporal Meta-RL"): treat each level as a "session"
    sharing a fixed latent task/dynamics variable, and condition level N+1's frontier-ranking prior on
    level N's TERMINAL latent/energy state (a Bayesian carryover of the fitted energy model's parameters),
    rather than re-initializing the goal-energy ranker fresh at each level. If BAM (arXiv:2202.02405,
    "Bayes with Adaptive Memory") style adaptive evidence-weighting is easy to add on top (weight level-N
    win/near-win states by whether the game's mechanic_class recurs at level N+1, rather than using them
    uniformly), report that as a secondary ablation arm -- but the DynaMITE-RL conditioning is the primary,
    required mechanism.

    Distinct from exp5157: this is a RANKING/prioritization signal over the search frontier, not a
    transition-model induction signal. Distinct from exp5154 (energy-as-fitness generation, .472): exp5154
    tested first-CONTACT candidate generation on an unsolved game via QD exploration; this task tests
    within-game level-N-to-level-N+1 RANKING carryover on ALREADY-adaptered, already-deepened games. Also
    distinct from the retired selection/value-head axis (ops/known-issues.md "ARC VALUE-HEAD ENERGY
    DISTILLATION -- RETRACTED/CLOSED 2026-07-01", 5 sub-hypotheses nulled): that axis tested a
    cross-GAME learned value head for candidate SELECTION; this tests a per-GAME online energy model for
    within-game cross-LEVEL frontier RANKING carryover -- a different signal, a different scope, and it
    does not reuse arc_value_learner.py's cross-game value head.

    THIS IS AN OFFLINE REPLAY ABLATION over the SAME 3 named games exp5155 specified (lp85, sc25, tr87 --
    the three deepest-solved games, levels_reproduced 5/5/6, giving the most level-transition data to
    replay over), NOT a live solve attempt.

    EXISTING CODE TO READ FIRST:
    - results/experiment_5155_multilevel_belief_state_scoping_v472.json (proposed_experiments[1])
    - python/carnot/experiment_4020_goal_induction_separation.py (the Exp4020 graded goal-satisfaction
      energy already reused as the fitness signal in exp5154 -- results/experiment_4020_goal_induction_separation.json
      documents the exact energy formula)
    - python/carnot/agentic/arc_competition_agent.py (wherever the current goal bias / frontier ranking is
      applied during search -- grep for "goal_bias", "dsl_energy", "frontier")
    - ops/arc_solve_registry.yaml entries for lp85, sc25, tr87 (their `reproduce`/`solver` fields cite the
      artifacts with recorded level-transition traces)
    - CLAUDE.md "Circularity / Oracle-Distinctness Discipline" (verifier_is_oracle must be declared false)

    CONCRETE STEPS:
    1. For lp85, sc25, and tr87, extract recorded level-N win/near-win states and level-N+1 frontier
       candidates from their cited registry artifacts.
    2. Build the CONTROL: rank level-N+1 frontier candidates using only the cold, current Exp4020 goal-bias
       (no cross-level memory).
    3. Build the WARM-START arm: fit a per-game online energy model to level-N's win/near-win states, and
       use it (combined with or in place of the cold Exp4020 bias -- justify your combination choice) to
       rank level-N+1's frontier candidates.
    4. Score both arms via target-prefix reciprocal rank (how close to rank-1 does the eventual level-up
       action sequence's prefix land) against the real recorded level-up trajectory for level N+1.
    5. Apply exp5155's own falsifiable gate verbatim: target-prefix reciprocal rank improves on >=2/3 of
       {{lp85, sc25, tr87}} with no regression in level reached; otherwise the gate FAILS and carryover
       goal-energy value is rejected for this mechanism.
    6. Report HONESTLY either way, with the same per-game precision exp5157 uses.

    REQUIRED ARTIFACT FIELDS:
      games_tested:
        value: "list of {{game, n_level_transitions_tested}}, must include lp85, sc25, tr87"
      reciprocal_rank_cold:
        value: "dict of game -> float"
      reciprocal_rank_warmstart:
        value: "dict of game -> float"
      games_improved_count:
        value: int
        principle: "The gate requires >=2/3 -- this field is the exact count the gate is evaluated against."
      gate_passed:
        value: bool
        principle: "Apply exp5155's own falsifiable_gate verbatim -- do not redefine the threshold post hoc."
      energy_signal_source:
        value: "which specific energy computation was used (Exp4020 graded goal-satisfaction energy, extended how)"
        principle: "Must be a genuine Carnot energy quantity, matching the ARC Live-Path Reachability
          Discipline's provenance bar."
      solve_provenance:
        value: development_proxy
        principle: "Offline replay over already-banked registry trajectories, not a live hidden-game solve."
      verifier_is_oracle:
        value: false
      random_seed:
        value: int
      reproducibility_checksum:
        value: string
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_ AND state plainly whether the
          gate passed or failed."

    Do not push. Do not modify scripts/research_conductor.py.
- id: exp5159-deepen-live-levelup-attempt-v473
  milestone: 2026.07.473
  title: PHASE A3 multi-level deepening -- wire the winning warm-start mechanism into the live path and attempt real level-ups
  priority: high
  track: arc
  deliverable: results/experiment_5159_deepen_live_levelup_attempt_v473.json
  gated_on:
  - upstream: exp5157-deepen-warmstart-replay-ablation-v473
    artifact_field: gate_passed
    op: '=='
    value: true
  agent_type: codex
  model: gpt-5.5
  max_turns: 80
  estimated_wall_time_min: 150
  prompt: |
    CONTEXT:
    This task only proceeds if exp5157's (this milestone) offline warm-start replay ablation gate PASSED
    -- the conductor's gated_on check enforces this. If exp5157 nulled, this task should not have been
    launched by the conductor; if it somehow runs anyway, verify exp5157's gate_passed field yourself
    first and STOP with honest_verdict blocked_upstream_gate_not_passed if it did not pass (do not attempt
    a live wire-in of a mechanism that already failed its offline test).

    If exp5157 passed: wire the validated warm-start mechanism into the LIVE E3AgentPolicy path (not a
    standalone offline script -- per CLAUDE.md "ARC Live-Path Reachability Discipline", a mechanism the
    live agent cannot reach produces no live capability) and attempt REAL level-up progress on 2-3
    currently-stuck games. This is this milestone's ARC Level-Up Attempt Guarantee floor (>=1 task whose
    acceptance gate requires actually banking a new reproducible level) AND is the direct, concrete
    instantiation of the operator's "tackle the multi-level capable live agent" directive -- carrying
    learned state across a level boundary and USING it to reach a level the agent was previously stuck at.

    Also incorporate exp5158's (this milestone, sibling task) goal-energy-ranker result if it is available
    and passed by the time this task runs -- combine both warm-start signals if both are validated; use
    only exp5157's if exp5158 is unavailable or nulled.

    EXISTING CODE TO READ FIRST:
    - results/experiment_5157_deepen_warmstart_replay_ablation_v473.json (the validated mechanism -- read
      its exact carryover design, do not re-derive from scratch)
    - results/experiment_5158_deepen_goal_energy_ranker_replay_v473.json IF PRESENT
    - python/carnot/agentic/arc_competition_agent.py (_begin_level_goal_episode, _active_transitions,
      _induce_and_plan -- this is where the wiring goes)
    - python/carnot/agentic/arc_hazard_pruner.py (the precedent for a validated offline mechanism
      correctly wired into the live search path as a reusable component -- follow this integration pattern)
    - python/carnot/agentic/arc_solver_kit.py (reproduce() -- the reproduction gate any claimed new level
      MUST pass)
    - ops/arc_solve_registry.yaml (current per-game levels_reproduced -- confirm your targets' CURRENT
      depth before attempting, so your delta is measured against a known baseline)
    - scripts/arc_orphan_solver_lint.py (run before declaring done)

    PRECONDITIONS (check BEFORE any subsequent step):
      a. Re-verify exp5157's gate_passed == true from its artifact directly (do not trust a stale
         assumption).
      b. Registry-precheck each target game's CURRENT levels_reproduced via ops/arc_solve_registry.yaml
         immediately before attempting -- per ARC Live-Path Reachability Discipline, do not re-attempt a
         level the live mechanism already reaches.

    CONCRETE STEPS:
    1. Select 2-3 target games from the "deepened_but_stuck" set characterized in exp5155
       (candidates: ar25 L3->L4, bp35 L2->L3, cd82 L2->L3, cn04 L3->L4, dc22 L2->L3, ft09 L3->L4 -- pick
       based on which have the clearest per-game warm-start signal in exp5157/exp5158's per-game
       breakdown, not arbitrarily).
    2. Wire the validated warm-start mechanism into arc_competition_agent.py's level-boundary handling so
       the LIVE E3AgentPolicy path carries level-N state forward into level-N+1 induction (a genuine code
       change to the live path, not a copy into a new offline-only module).
    3. Run the live agent (via the offline arcade / environment_files sim, per the standing
       arc_loop_solve.py entrypoint pattern) on each target game and attempt to reach the next level.
    4. Run scripts/arc_orphan_solver_lint.py -- any new solver-like module must be in the live agent's
       import closure, not orphaned.
    5. For any level genuinely reached, run it through arc_solver_kit.reproduce() before counting it --
       this task's acceptance gate is real, per the ARC Level-Up Attempt Guarantee: a level counts ONLY
       when offline_reproduced=true AND reproduced_levels>=1 (a genuine +1 deeper level on an
       already-solved game). A live attempt that does not clear this gate is a null, not a partial credit.
    6. Declare solve_provenance honestly: live_agent_self_discovery ONLY if the live E3AgentPolicy path
       itself made the discovery at runtime using the wired-in mechanism (not an outer-loop hand-tuned
       trajectory).
    7. Report HONESTLY either way -- a null here (the offline ablation win does not transfer to a live
       level-up) is still a valuable, real finding about the gap between offline replay signal and live
       search behavior.

    REQUIRED ARTIFACT FIELDS:
      target_games:
        value: "list of {{game, level_before, level_attempted}}"
      levels_banked:
        value: "list of {{game, new_level, offline_reproduced: bool, reproducibility_checksum}}"
        principle: "Only reproduce()-confirmed levels count -- per ARC Solve Reproducibility + Solver-Reuse Discipline."
      reproducible_levels_delta:
        value: int
        principle: "The load-bearing metric per CLAUDE.md's no-churn ethos and the ARC Level-Up Attempt
          Guarantee -- must move reproducible_total_levels or honestly report zero."
      live_path_reachable:
        value: bool
        principle: "Confirmed via arc_orphan_solver_lint.py -- a solver the live agent can't call produces
          no live capability regardless of any offline result."
      warmstart_mechanism_used:
        value: "exp5157 / exp5158 / both"
      solve_provenance:
        principle: "live_agent_self_discovery only if the live E3AgentPolicy path made the discovery at runtime."
      verifier_is_oracle:
        value: false
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_ AND state plainly how many
          levels were banked, if any -- do not bury a null."

    Do not push. Do not modify scripts/research_conductor.py.
