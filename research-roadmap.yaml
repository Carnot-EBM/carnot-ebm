  - id: exp2772
    milestone: "2026.05.262"
    deliverable: "results/experiment_2772_cp_router_integration.json"
    title: "CP-Router Uncertainty Routing: Entropy-Aware Conformal Thresholds (arXiv:2505.19970)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 30
    track: research

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      exp2757 (.261) implemented conformal selective acting (anytime-valid, 84% savings, 1.2% FNR).
      arXiv:2505.19970 (CP-Router, May 2026) proposes a complementary approach: entropy-aware
      conformal routing that uses prediction entropy to select between a lightweight LLM and a
      larger reasoning model. Key difference from exp2757: CP-Router uses entropy thresholds
      (model uncertainty) while conformal selective acting uses coverage guarantees.

      For Carnot's architecture, CP-Router maps to: low entropy (confident response) → skip verifier;
      high entropy (uncertain response) → run full verifier ensemble. This is a fast-path routing
      layer that precedes ODAR and conformal selective acting.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (pipeline routing entry points)
      - results/experiment_2757_conformal_selective_acting.json (conformal_savings_pct, false_negative_rate)
      - results/experiment_2720_odar_routing_t2_vegas.json (odar_routing_added, optimal_k)

      TASK: Implement a CP-Router-style entropy-aware routing layer for VerifyRepairPipeline.
      Measure routing savings vs. conformal selective acting. Evaluate if entropy routing and
      conformal routing are complementary or redundant.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sys; sys.path.insert(0,'python'); from carnot.pipeline.verify_repair import VerifyRepairPipeline; print('ok')"` succeeds
            Record: pipeline_importable (bool).
         b. `wc -l data/fover_corpus.jsonl`
            Record: fover_n (int).
         Record: preconditions_checked.

      1. Implement entropy-based router:
         ```python
         # CP-Router-inspired entropy gating for Carnot.
         # WHY: When a response has low entropy (all verifiers agree on energy level),
         # we don't need expensive full ensemble evaluation — the consensus is reliable.
         # When entropy is high (verifiers disagree), we invoke the full ensemble.
         # This maps CP-Router's LLM/LRM routing to Carnot's fast/full verification.
         def compute_ensemble_entropy(energy_values: list[float]) -> float:
             # Treat energy values as an unnormalized distribution
             # Entropy = -sum(p * log(p)) where p = softmax(-energy)
             ...
         entropy_threshold = 0.5  # tuned on calibration set
         def cp_router_gate(energy_values) -> bool:
             # True = run full ensemble; False = accept current result
             return compute_ensemble_entropy(energy_values) > entropy_threshold
         ```

      2. Calibrate entropy_threshold on FoVer corpus (first half):
         For each calibration example, compute ensemble entropy and ground-truth correctness.
         Find threshold minimizing FNR while achieving >= 70% routing savings.
         Record: calibrated_threshold (float), calibration_savings_pct (float).

      3. Evaluate on FoVer corpus (second half, held-out):
         cp_router_savings_pct = fraction of examples routed away from full ensemble
         cp_router_fnr = fraction of violations missed by entropy gating
         Record: cp_router_savings_pct (float), cp_router_fnr (float).

      4. Compare with exp2757 conformal results:
         complementary = (cp_router achieves different savings profile than conformal)
         Record: comparison_notes (str).

      5. Write results/experiment_2772_cp_router_integration.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix."
      - cp_router_viable: bool
        principle: "True if entropy gating achieves >= 50% savings with FNR < 0.05."
      - calibrated_threshold: float
        principle: "Entropy threshold found during calibration."
      - cp_router_savings_pct: float
        principle: "Fraction of full-ensemble evaluations avoided by entropy gating."
      - cp_router_fnr: float
        principle: "False negative rate: violations missed by entropy gating."
      - comparison_notes: str
        principle: "How CP-Router compares to conformal selective acting (exp2757) — complementary or redundant?"
      - duration_s: float
        principle: "Implement + calibrate + evaluate: expected > 2s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication."

