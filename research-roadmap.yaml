        verifier_is_oracle:
          principle: "BARE bool=false -- this is a data-provenance recovery for the learned selector, not an executable oracle."
        random_seed:
          principle: "Determinism precondition; the fold assignment must be reproducible."
        reproducibility_checksum:
          principle: "Hash of the pool + join sources + manifest; lets a third party re-derive the provenance."
        model_specs:
          principle: "The join sources (ARC-TGI taxonomy / 25-game survey / source pools) + the fallback-unit policy; required methodology."
      ACCEPTANCE GATE:
        - condition: "family_split_feasible + distinct_family_n + per_family_task_count + provenance_manifest_path reported AND verifier_is_oracle=false, OR an honest blocked_arc_source_taxonomy_unavailable verdict"
          principle: "exp4258 blocked for lack of family provenance; recovering it (or honestly finding the pool too concentrated) is the precondition for the held-out-family OOD test that gates the whole milestone."

      Run: `python3 {project_root}/results/experiment_4270_arc_family_provenance_recovery.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4271-arc-cross-family-transfer-existing-pool
    milestone: 2026.06.395
    title: "PHASE A2 (DEPTH; THE real OOD test; gated_on A1 family_split_feasible==true) -- CROSS-FAMILY transfer on the EXISTING pool. Using the recovered provenance manifest, train the set-encoder on a SUBSET of task-families and test the beats-vote gate on candidates from HELD-OUT families (NO family in both train and test) -- the real OOD test the within-pool .393 split did not run. Report cross_family_delta (set_encoder@1 - vote@1 on held-out families) + task-level bootstrap CI95 (>=2000 resamples) + held_out_family_n + held_out_task_n + within_minus_cross_gap (how much the win shrinks vs the within-pool +0.4423) + oracle@K positive control. Include a STATIC vs ONLINE-ADAPTED arm. GENERALIZES (cross_family_delta>0 AND CI95-excl-0) = a GENERAL selection signal (north-star-grade -> opens the DiffusionGemma gate). COLLAPSES = per-family-basin memorization (decision-grade -> scope the headline to within-pool). verifier_is_oracle=false."
    priority: critical
    track: verifier-oracle-distinct
    max_turns: 80
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct ARC verifier is MANDATED by the 2026-06-14 P0 directive + the .394 capstone left cross-game generalization as the SOLE reason hardened_win=False -- false-positive scope-match vs retired GAP-3 content-EBM lineage / the .393 ARC gate (exp4245); forward difference = the held-out-FAMILY OOD test on the A1-recovered provenance manifest (the test exp4258 could not run). verifier_is_oracle=false."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4271_arc_cross_family_transfer_existing_pool.json
    gated_on:
      - upstream: exp4270-arc-family-provenance-recovery
        artifact_field: family_split_feasible
        op: '=='
        value: true
    prior_failures:
      - experiment_id: exp4258-arc-oracle-distinct-cross-game-transfer
        verdict: blocked_arc_game_ids_unrecoverable
        addressed_by: "exp4258 blocked because family/game ids were unrecoverable. This attempt runs ON the A1 (exp4270) provenance manifest that recovers them; gated_on family_split_feasible==true so it only runs when a powered family-disjoint split exists. The root cause (no recoverable disjoint unit) is fixed upstream by A1."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: gated_on A1's recovered provenance (family_split_feasible==true). This is THE decision-grade test:
      a within-pool +44pp could be per-family-basin memorization, not a general selection signal. Carnot's own
      GAP-4 ARC-1->ARC-2 probe collapsed (induction 0.93->0.57, project_gap3_verifier_program); the ARC survey
      (arXiv:2603.13372) frames cross-task transfer as THE unresolved ARC frontier. Train on some families, test
      on UNSEEN families. Corroborator for the verifier-transfer framing: TrajAD (arXiv:2602.06443) runs exactly
      this cross-domain-under-OOD test to ask whether a learned verifier learns universal logic or domain-specific
      patterns.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4270_arc_family_manifest.json (the per-row family/game/fold manifest from A1)
        - results/experiment_4270_arc_family_provenance_recovery.json (family_split_feasible + distinct_family_n)
        - results/experiment_4245_arc_set_encoder_beats_vote.json (the within-pool win + gate protocol to extend)
        - results/experiment_4244_arc_set_encoder_aggregator_build.json + _model.json (the set-encoder to retrain per family-split)
        - results/experiment_4243_arc_candidate_pool_grow_pool.json.gz (the grown pool candidates)
        - scripts/exp_verifier_detector_auroc.py, scripts/adversarial_verify.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification"

      TASK: train the set-encoder on a subset of FAMILIES, test the beats-vote gate on HELD-OUT families.

      CONCRETE STEPS:
        0. PRECONDITIONS: A1 family_split_feasible==true (the conductor gate enforces this; if reached anyway and
           false -> honest_verdict `complete_arc_cross_family_deferred_pool_infeasible` and STOP). The manifest +
           grown pool load. CPU sufficient.
        1. Partition the pool BY FAMILY into train-families vs held-out-families (leave-one-family-out or a
           family-disjoint k-fold; report held_out_family_n + held_out_task_n). NO family in both train and test.
        2. Train the set-encoder on train-family candidates only; on held-out-FAMILY candidates compute
           set_encoder@1, vote@1, oracle@K, matched control. Report cross_family_delta + task-level bootstrap
           CI95 (>=2000 resamples), within_minus_cross_gap (vs the within-pool +0.4423), and the positive control
           (oracle@K vs vote -- if oracle@K~=vote on held-out families the null is uninformative, FALSE_NEGATIVE_RISK).
        3. ONLINE-ADAPT arm: alongside the STATIC selector, report an online-reweighted selector cross_family_delta
           (the same Tier-1 mechanism A4 studies in depth) so the static-vs-adaptive comparison is in this artifact too.
        4. Emit cross_family_win_holds BARE bool := (static cross_family_delta>0 AND its CI95 excludes 0). Run
           adversarial_verify.py (clean; verifier_is_oracle=false). Declare random_seed + reproducibility_checksum +
           model_specs. HONEST read: cross_family_generalizes / within_pool_only / no_headroom.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A cross-family win, a within-pool-only collapse, and a no-headroom are ALL COMPLETE and decision-grade."
        cross_family_win_holds:
          principle: "BARE bool: the capstone reads this as the OOD verdict (gated-fields-must-be-bare); true iff the held-out-family set_encoder@1 - vote@1 > 0 AND CI95-excl-0 -- the real generalization signal."
        cross_family_delta:
          principle: "BARE float: set_encoder@1 - vote@1 on HELD-OUT FAMILIES -- the load-bearing OOD lift (compare to the within-pool +0.4423)."
        cross_family_ci95:
          principle: "Task-level bootstrap CI95 of the cross-family delta -- excluding 0 means the verifier generalizes to unseen families."
        within_minus_cross_gap:
          principle: "The within-pool +0.4423 minus cross_family_delta -- quantifies how much of the win was per-family-basin memorization."
        held_out_family_n:
          principle: "BARE int: number of families never seen in training -- the OOD breadth; report with held_out_task_n for power."
        oracle_at_k:
          principle: "Positive-control ceiling on held-out families -- if ~=vote the cross-family null is uninformative, not a verifier failure."
