tasks:
  - id: exp307-jepa-real-training
    milestone: "2026.04.29"
    deliverable: results/experiment_307_jepa_real_training.json
    title: "Exp 307: JEPA train on real Apple adversarial logits from Exps 294/295"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: The JEPA violation predictor (Exp 291/299) was trained on synthetic data only.
      Real Apple adversarial logit files now exist at data/research/logits_294_*.npy and
      data/research/logits_295_*.npy. These contain partial-response logit arrays at 25/50/75/100%
      prefix fractions for both Qwen3.5-0.8B and Gemma4-E4B-it on standard, number_swap,
      and irrelevant_sentence variants.

      The LLM-JEPA paper (arXiv 2509.14252) provides the training objective: encode a partial
      response embedding, predict the full-response embedding, measure prediction error as energy.
      High energy = violation likely. This is directly applicable to (partial_logits, final_violation)
      training pairs extractable from the Apple adversarial logit files.

      EXISTING CODE TO READ FIRST:
      - results/experiment_291_jepa_results.json — existing JEPA architecture and hyperparameters
      - results/experiment_299_jepa_results.json — synthetic retrain baseline
      - scripts/experiment_291_jepa_retrain.py — existing JEPA training script (base this on)
      - python/carnot/inference/jepa_energy.py — JEPA energy function
      - data/research/ — list what logit files exist (logits_294_*.npy, logits_295_*.npy)
      - results/experiment_294_results.json — Apple baseline results (correct/incorrect per question)
      - results/experiment_295_results.json — Apple verify-repair results (violation_detected per question)

      TASK: Extract (partial_logits, final_violation) training pairs and retrain JEPA.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-JEPA-004 (JEPA trained on real logits, not synthetic) and
         SCENARIO-JEPA-008/009 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - extract_training_pairs(logit_dir, results_json): returns list of (partial_logits, label)
           where label=1 if violation_detected=True in Exp 295 for that question
         - minimum pair count check: raises ValueError if fewer than 50 pairs found
         - 80/20 train/val split: val set is held out, not seen during training
         - train_jepa_on_pairs(pairs, epochs, lr): returns training_metrics dict with
           train_loss, val_loss, val_tp, val_fp per epoch
         - convergence check: val_loss at epoch N < val_loss at epoch 1 (model improves)
         - ONNX export: saved to results/jepa_predictor_307.onnx, loadable with onnxruntime
         - artifact schema: experiment=307, training_source="real_logits", n_pairs, split used
         - honest fallback: if logit files missing, emit blocked artifact with exact missing paths
      4. Implement scripts/experiment_307_jepa_real_training.py using ExperimentTemplate:
         a. [SETUP] Call ExperimentTemplate(307, ..., requires_gpu=True).setup()
         b. [LOGIT DISCOVERY] Scan data/research/ for logits_294_*.npy and logits_295_*.npy.
            If missing: emit blocked artifact. List all found paths.
         c. [PAIR EXTRACTION] For each logit file (25%/50%/75% fractions):
            - Load partial logit array (shape [n_questions, n_tokens, vocab_size])
            - Look up violation_detected from Exp 295 results (per question, per variant)
            - Build (partial_logit_mean, violation_label) pair (mean across vocab dim)
            - Target: ≥ 500 pairs across all logit files
         d. [TRAIN] 80/20 train/val split. Train 3-layer MLP JEPA predictor:
            - Input: mean logit vector (vocab_size-dim) at partial fraction
            - Hidden: 128-dim, ReLU
            - Output: single energy scalar
            - Loss: BCE(sigmoid(energy), violation_label)
            - 50 epochs, lr=1e-3, Adam; checkpoint every 10 epochs
         e. [EVALUATE] On val set: compute TP, FP, skip_rate at threshold=0.5
         f. [EXPORT] torch.onnx.export → results/jepa_predictor_307.onnx
         g. [ARTIFACT] build_result with training_source="real_logits", n_pairs, val_tp, val_fp,
            skip_rate, onnx_path; status="success" or "blocked" with reason
         h. Output: results/experiment_307_jepa_real_training.json
         i. inference_mode: "live_gpu" if GPU available, "cpu_training" otherwise
      5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      6. Reconcile: update ops/changelog.md and ops/status.md
      7. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp308-jepa-fast-path-gate
    milestone: "2026.04.29"
    deliverable: results/experiment_308_jepa_gate_benchmark.json
    title: "Exp 308: JEPA fast-path gate integration and latency benchmark"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 307 trained the JEPA predictor on real Apple adversarial logits and exported
      results/jepa_predictor_307.onnx. This experiment integrates that model as a live fast-path
      gate in VerifyRepairPipeline. The gate design:
        - After LLM generation, run JEPA(partial_logits) → energy scalar
        - If energy < threshold: SKIP full Ising verification (fast path)
        - If energy >= threshold: run full Ising verification (slow path)
      The goal: reduce pipeline latency by 15-30% by skipping Ising on low-risk queries, while
      maintaining TP rate (don't skip queries that have real violations).

      EXISTING CODE TO READ FIRST:
      - results/experiment_307_jepa_real_training.json — JEPA model training results
      - results/jepa_predictor_307.onnx — trained JEPA model (check if exists)
      - results/jepa_predictor_291.onnx — previous JEPA model (fallback if 307 blocked)
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (integration point)
      - python/carnot/pipeline/__init__.py — current exports
      - python/carnot/inference/jepa_energy.py — existing JEPA energy function

      TASK: Wire JEPA gate into VerifyRepairPipeline and benchmark latency.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-JEPA-005 (JEPA gate reduces Ising invocations by ≥30% at TP≥0.85) and
         SCENARIO-JEPA-010/011 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - JepaGate dataclass: onnx_path, threshold, enabled; predict(logits) → float
         - JepaGate.predict(): loads ONNX session lazily; returns sigmoid(energy)
         - gate disabled: predict() returns 1.0 (always run Ising)
         - gate below threshold: should_skip returns True
         - gate above threshold: should_skip returns False
         - VerifyRepairPipeline.verify_with_gate(): accepts jepa_gate kwarg; skips Ising
           when gate says skip; records gate_decision in result
         - gate_decision field: "skip" or "verify" in per-question result
         - skip_rate metric: fraction of questions where gate said "skip"
         - TP rate: of questions with verified violations, what fraction did gate NOT skip
         - latency benchmark: 50-question batch with gate vs without gate, reports speedup
      4. Implement python/carnot/pipeline/jepa_fast_path.py:
         - JepaGate(onnx_path, threshold=0.5, enabled=True)
         - predict(logit_mean: np.ndarray) → float: energy prediction via ONNX Runtime
         - should_skip(logit_mean) → bool: return True if energy < threshold
         - to_dict() for artifact serialization
      5. Add to VerifyRepairPipeline (additive, no regressions):
         - verify_with_gate(question, response, domain, jepa_gate=None, threshold=0.8)
         - When gate says "skip": return VerifyResult(violations=[], gate_decision="skip",
           gate_energy=energy, ising_skipped=True)
         - When gate says "verify": run full Ising, tag result with gate_decision="verify"
      6. Export JepaGate from python/carnot/pipeline/__init__.py
      7. Implement scripts/experiment_308_jepa_gate_benchmark.py using ExperimentTemplate:
         a. Load jepa_predictor_307.onnx (fallback to 291.onnx if 307 not present)
         b. Build JepaGate with threshold sweep [0.3, 0.5, 0.7]
         c. Run 50-question benchmark from Exp 302 simulated corpus (or live GPU if available)
         d. For each threshold: measure skip_rate, TP_rate, pipeline_time_with_gate,
            pipeline_time_without_gate, speedup_factor
         e. Primary metric: does any threshold achieve skip_rate ≥ 30% AND TP_rate ≥ 0.85?
         f. Output: results/experiment_308_jepa_gate_benchmark.json with threshold_sweep results
      8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      9. Reconcile: update ops/changelog.md and ops/status.md
      10. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp309-tier3-pipeline-endtoend
    milestone: "2026.04.29"
    deliverable: results/experiment_309_tier3_pipeline.json
    title: "Exp 309: Tier 3 end-to-end self-learning — real logits → JEPA gate → verify/skip → accuracy"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exps 307 (JEPA trained on real data) and 308 (JEPA gate integrated) have
      established the Tier 3 predictive verification infrastructure. This experiment measures
      the full Tier 3 continuous self-learning loop on a live 50-question benchmark:
        1. Run baseline (no gate) — record verify-repair accuracy and pipeline latency
        2. Run with JEPA gate at the best threshold from Exp 308 — record accuracy + latency
        3. After each batch of 10, the JEPA model's skip_rate feedback updates its threshold
           (online learning: if FP rate > 5%, increase threshold; if skip_rate < 10%, decrease)
        4. Report: accuracy_without_gate vs accuracy_with_gate, latency improvement, threshold drift

      This is the CONTINUOUS SELF-LEARNING target from research-program.md Tier 3: "Train a
      model to predict constraint violations BEFORE the LLM finishes."

      EXISTING CODE TO READ FIRST:
      - results/experiment_308_jepa_gate_benchmark.json — best threshold from Exp 308
      - python/carnot/pipeline/jepa_fast_path.py — JepaGate (from Exp 308)
      - python/carnot/pipeline/verify_repair.py — verify_with_gate()
      - scripts/experiment_302_self_learning_benchmark.py — Tier 1+2 benchmark (base this on)
      - results/experiment_302_results.json — Tier 1+2 baseline for comparison
      - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner

      TASK: Run Tier 3 continuous self-learning end-to-end benchmark.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-LEARN-012 (Tier 3 online threshold adaptation) and
         SCENARIO-LEARN-019/020 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - ThresholdAdapter(initial, fp_threshold, min_skip): adapt(fp_rate, skip_rate) → float
         - adapt() increases threshold when fp_rate > fp_threshold
         - adapt() decreases threshold when skip_rate < min_skip
         - adapt() clamps result to [0.1, 0.9]
         - Tier3Benchmark: run_batch() with gate, record gate_decision per question
         - improvement_delta: accuracy_batch2 - accuracy_batch1 (signed)
         - latency_reduction: (time_no_gate - time_with_gate) / time_no_gate
         - artifact: includes threshold_history (list of per-batch threshold values)
