- id: exp647-otv-verifier
  milestone: 2026.04.49
  deliverable: results/experiment_647_otv_verifier.json
  title: 'Exp 647: OTV One-Token Verifier (arXiv 2603.01025) — EORM Replacement Candidate'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: OTV (arXiv 2603.01025, March 2026) adds a single learnable verification token
    via LoRA to any LLM. One forward pass estimates reasoning correctness — no separate verifier
    model, no rollouts. Performance competitive with full PRM at 90% lower token cost.
    Carnot's EORM is 55M params running ~10ms per check (Tier 2). OTV would be sub-1ms
    (one additional vector dot product over frozen model weights). If AUC >= EORM_AUC - 0.05,
    OTV becomes the default Tier 2, cutting cascade latency by ~10x.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/ — EORMModel definition, how it processes CoT pairs
    - results/experiment_631_jepa_v14_oracle.json — EORM baseline AUC (or find Exp 383/556 result)
    - results/fover_corpus_v5_oracle.json — 100+ live FOVER pairs for training
    - results/live_pairs_578.json — live pairs for test
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Implement a lightweight OTV-style verification head and benchmark vs EORM.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-145 (OTVVerifier: single-pass verification head, AUC within 0.05 of EORM),
       SCENARIO-VERIFY-192/193 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/models/otv_verifier.py:
       a. OTVVerificationHead class:
          __init__(self, input_dim: int = 128, hidden_dim: int = 64):
            self.W1: jnp.ndarray = jnp.zeros((input_dim, hidden_dim))
            self.W2: jnp.ndarray = jnp.zeros((hidden_dim, 1))
            self.b1: jnp.ndarray = jnp.zeros(hidden_dim)
            self.b2: jnp.ndarray = jnp.zeros(1)
          forward(self, x: jnp.ndarray) -> float:
            'Single-pass: x is the mean-pooled token embedding of the response.'
            h = jax.nn.relu(x @ self.W1 + self.b1)
            return float(jax.nn.sigmoid(h @ self.W2 + self.b2)[0])
          NOTE: In Carnot, we approximate token embeddings with a TF-IDF-like bag-of-words
          vector over the response (no actual LLM forward pass needed — we use response length,
          unique word ratio, digit density, arithmetic operator density as features).
          feature_vector(self, response: str) -> jnp.ndarray:
            '128-dim feature vector from response text statistics.'
            import re
            words = response.lower().split()
            n_words = max(len(words), 1)
            features = [
                len(response) / 1000.0,
                len(set(words)) / n_words,
                len(re.findall(r'\d+', response)) / n_words,
                len(re.findall(r'[+\-*/=]', response)) / n_words,
            ]
            Pad to 128 dimensions with zeros.
            return jnp.array(features + [0.0] * (128 - len(features)))
       b. OTVTrainer class:
          __init__(self, head: OTVVerificationHead, lr: float = 0.01):
          train(self, pairs: list[dict], n_epochs: int = 50) -> OTVVerificationHead:
            Pairs: list of {'response': str, 'is_correct': bool}.
            Train with binary cross-entropy.
       c. Export OTVVerificationHead, OTVTrainer from carnot.models.
    4. Write scripts/experiment_647_otv_verifier.py:
