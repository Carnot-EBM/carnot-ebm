- id: exp877-vjepa-predictor
  milestone: 2026.04.67
  deliverable: results/experiment_877_vjepa_predictor.json
  title: 'Exp 877: VariationalJEPAPredictor — Tier 3 Seed (arXiv 2601.14354) (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA (Tier 2) predicts violation scores for complete responses.
    Tier 3 (Ising) verifies them post-hoc. The missing link is PREDICTIVE
    VERIFICATION: given the first N tokens/steps of a response, predict which
    constraints will be violated BEFORE generation ends.

    arXiv 2601.14354 (VJEPA) provides the theoretical framework:
    - Encoder q(z_t | x_t): encodes current CoT prefix into latent z_t
    - Prior p(z_t | c_{t-1}): predicts next violation state from context
    - Variational lower bound: L = E[log p(z_t | c_{t-1})] - KL[q(z_t | x_t) || p(z_t | c_{t-1})]
    The KL term PREVENTS collapse to a trivial constant predictor (the root cause
    of JEPA's OOD failures). The encoder produces uncertainty estimates.

    Hardware path: encoder q is a 2-layer MLP (128->64->32), prior p is a GRU cell.
    Both are NPU-native (GEMM + ReLU). Training: 100 epochs on FoVer corpus.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/jepa_predictor.py — current deterministic JEPA predictor
    - results/fover_labeled_steps_live.json — training corpus (57 real pairs)
    - results/experiment_865_constraint_memory_compression.json — compressed bank
    - python/carnot/phase3/continuous_ebm.py — Phase 3 seed pattern
    - openspec/change-proposals/research-roadmap-v67.md — .67 Phase 4

    TASK: Implement VariationalJEPAPredictor with encoder q, prior p, and
    variational lower bound loss. Train on FoVer corpus. Measure OOD AUC.
    This is the Tier 3 seed — not deployed to production yet, just proven viable.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Implement python/carnot/models/vjepa_predictor.py:
       a. VariationalEncoder(in_dim, latent_dim=32):
          - MLP: in_dim -> 128 -> 64 -> (mu: 32, log_var: 32)
          - reparameterize(mu, log_var) -> z using z = mu + eps * exp(0.5 * log_var)
          - encode(x) -> (z, mu, log_var)
       b. VariationalPrior(context_dim, latent_dim=32):
          - GRU cell: context_dim -> 64 -> (prior_mu: 32, prior_log_var: 32)
          - predict(context) -> (prior_mu, prior_log_var)
       c. VariationalJEPAPredictor(in_dim, context_dim=64, latent_dim=32):
          - encoder: VariationalEncoder
          - prior: VariationalPrior
          - classifier: Linear(32 -> 1) with sigmoid
          - vjepa_loss(x, labels, context):
              z, mu, log_var = self.encoder.encode(x)
              prior_mu, prior_log_var = self.prior.predict(context)
              kl = -0.5 * sum(1 + log_var - prior_log_var - (mu - prior_mu)^2 /
                               exp(prior_log_var) - exp(log_var) / exp(prior_log_var))
              recon_loss = BCE(self.classifier(z), labels)
              return recon_loss + 0.1 * kl
          - predict(x, context) -> violation_probability (float in [0,1])
          - train(corpus, n_epochs=100)
    3. Add spec entries: REQ-VERIFY-141 (VariationalJEPAPredictor interface),
       REQ-VERIFY-142 (KL regularization prevents OOD collapse),
       SCENARIO-VERIFY-167/168.
    4. Create training data:
       Load FoVer corpus from results/fover_labeled_steps_live.json.
       For each step: feature = simple bag-of-words TF-IDF vector (in_dim=50).
       Context = mean of prior step features (context_dim=50).
       Label = 1 if step is "incorrect" else 0.
    5. Train VariationalJEPAPredictor for 100 epochs.
       Monitor: vjepa_loss convergence, KL term magnitude.
    6. Evaluate:
       - in_dist_auc: AUC on held-out GSM8K steps (80% train / 20% test split)
       - ood_auc: AUC on ARC-style steps (different domain, zero training examples)
       - kl_magnitude: mean KL term (should be > 0; =0 means collapsed)
       - uncertainty_calibration: correlation(prediction_entropy, error_rate)
    7. honest_verdict:
       - "tier3_seed_viable" if ood_auc > 0.55 AND kl_magnitude > 0.01
       - "in_dist_only" if in_dist_auc > 0.65 AND ood_auc <= 0.55
       - "vjepa_collapsed" if kl_magnitude < 0.01 (KL vanished — same failure as JEPA)
       - "training_failed" if final loss is NaN or not converging
    8. Build artifact and write results/experiment_877_vjepa_predictor.json.
       Include: in_dist_auc, ood_auc, kl_magnitude, uncertainty_calibration,
                model_path, n_training_steps, honest_verdict.
    9. Write tests with 100% coverage.
       Test VariationalEncoder reparameterization: z samples should differ per call.
       Test KL term > 0 for non-trivial distributions.
       Test vjepa_loss gradient flows (no NaN).
       Traces to REQ-VERIFY-141/142, SCENARIO-VERIFY-167/168.
    10. Reconcile: ops/changelog.md, ops/status.md, _bmad/architecture.md
        (add "Tier 3.5: VariationalJEPAPredictor — seed implemented, Exp 877").
    11. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_877_vjepa_predictor.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp878-hallusae-v2
  milestone: 2026.04.67
  deliverable: results/experiment_878_hallusae_v2.json
  title: 'Exp 878: HalluSAE v2 — Temporal Feature Velocity (RETRO-HALLUSAE-AUC-BELOW-THRESHOLD) (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-HALLUSAE-AUC-BELOW-THRESHOLD: Exp 863 (HalluSAEGeometricProbe)
    achieved AUC=0.6144, below the 0.65 threshold for Tier 0j advisory status.
    Root cause diagnosed: static geometry snapshot (single energy value per step)
    misses the dynamics of hallucination. Hallucinations ACCELERATE feature energy
    (second derivative is positive), not just increase it.

    Fix: add temporal feature velocity and acceleration to the feature vector.
    - feature_energy[t]: current SAE geometry energy (from Exp 863)
    - feature_velocity[t] = feature_energy[t] - feature_energy[t-1]
    - feature_accel[t] = feature_velocity[t] - feature_velocity[t-1]
    Hallucinating CoT: energy increases AND velocity is positive AND acceleration > 0.
    Correct CoT: energy varies but velocity oscillates (no persistent positive trend).

    prior_failure: exp863, verdict: marginal_below_threshold,
    addressed_by: "temporal velocity + acceleration features orthogonal to static geometry"
    retire_if_same_verdict: true (if AUC still < 0.65 after this change, retire HalluSAE)

    EXISTING CODE TO READ FIRST:
    - results/experiment_863_hallusae_geometric_probe.json — v1 result (AUC=0.6144)
    - python/carnot/verify/hallusae_probe.py — HalluSAEGeometricProbe (from Exp 863)
    - openspec/change-proposals/research-roadmap-v67.md — .67 Phase 5

    TASK: Extend HalluSAEGeometricProbe with temporal velocity features.
    Retrain on same 50 synthetic CoT pairs. Target AUC >= 0.65.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/verify/hallusae_probe.py. Note feature extraction.
       Note: v1 computes per-step feature energy as a scalar (bigram dot product magnitude).
    3. Extend to HalluSAEGeometricProbeV2:
       a. Add method compute_trajectory_features(step_energies: list[float]) -> np.ndarray:
          - velocity: [0] + [e[t] - e[t-1] for t in 1..T]  (length T)
          - accel: [0, 0] + [v[t] - v[t-1] for t in 2..T]  (length T)
          - peak_energy: max(step_energies)
          - velocity_mean: mean(velocity)
          - accel_mean: mean(accel)
          - monotone_increase_fraction: fraction of steps where velocity > 0
          Feature vector: [energy_mean, energy_std, peak_energy, velocity_mean,
                           accel_mean, monotone_increase_fraction]  (6 features)
       b. HalluSAEGeometricProbeV2(feature_dim=6) inherits from v1 but uses
          trajectory features instead of single-step energy.
       c. train_trajectory(pos_corpus, neg_corpus) trains a logistic regression
          classifier on 6-feature vectors.
       d. detect_trajectory(step_texts: list[str]) -> dict with
          is_unstable_v2, trajectory_auc, feature_importances.
    4. Add spec entries: REQ-VERIFY-143 (temporal velocity in SAE probe),
       SCENARIO-VERIFY-169/170.
    5. Retrain on the same 50 synthetic CoT pairs used in Exp 863:
       25 correct chains (energy oscillates), 25 hallucinating (energy trends up).
