  - id: exp4568-a1
    milestone: 2026.06.422
    title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY; HEADLINE) -- ACTION EFFICIENCY: the
      leaderboard #1 lever. Train a small CNN clickability/action-effect predictor predict(frame)->(click_heatmap,
