- id: exp1109-kv260-ising-sampler-v3-sequential
  milestone: 2026.04.86
  deliverable: results/experiment_1109_kv260_ising_sampler_v3_sequential.json
  title: "KV260 Ising Sampler v3 — Sequential Single-Site Updates (fix KL=3.07 detailed balance violation)"
  model: opus
  max_turns: 100
  estimated_wall_time_min: 80
  priority: high
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1094-phase2a-sampler-correctness-audit
      verdict: fpga_sampler_distribution_mismatch_confirmed
      addressed_by: "exp1094 empirically confirmed: KL(FPGA||Gibbs)=3.07 (threshold 0.05), root cause is synchronous parallel Glauber dynamics on frustrated antiferromagnetic J — violates detailed balance. Two new papers (arXiv 2603.25910: Finite-Time Observability of Synchronous p-bit Oscillations; arXiv 2604.01564: Unified Performance-Cost Landscape of Parallel p-bit Ising Machines) confirm the mechanism and provide the fix: sequential single-site updates (round-robin sweep order) maintain ergodicity and detailed balance. Time-multiplexed p-bit reuse (arXiv 2604.01564) achieves stable synchronous operation at lower hardware cost. exp1109 redesigns hardware/kv260/ising_sampler_v3.v with sequential single-site updates and validates KL < 0.05 via Python simulation before hardware deployment."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    exp1094 (.85) empirically confirmed: KL(FPGA Glauber parallel || CPU Gibbs) = 3.07.
    Root cause (from arXiv 2603.25910): synchronous parallel Glauber dynamics on frustrated
    antiferromagnetic ring induces period-2 oscillations — violates detailed balance.

    This is a GENUINE SCIENTIFIC FINDING (Phase 2a), not an implementation bug. The KV260
    bitstream hardware/kv260/ising_sampler_v1.v (and v2.v) used synchronous parallel updates
    where all spins update simultaneously. This violates detailed balance on frustrated topologies.

    FIX: Sequential single-site updates (round-robin sweep order):
    Each clock cycle, update EXACTLY ONE spin i (cycling i=0,1,...,N-1,0,1,...).
    The energy computation for spin i uses the CURRENT values of all other spins.
    This is provably ergodic and satisfies detailed balance (Metropolis-Hastings guarantee).

    ALTERNATIVE (arXiv 2604.01564): Time-multiplexed p-bit reuse —
    Divide N spins into non-conflicting groups; update groups sequentially within each clock
    cycle. Achieves comparable KL while using less hardware area than fully asynchronous designs.
    Achieves < 0.01 KL on frustrated topologies at 3-4 bit DAC resolution.

    EXISTING CODE TO READ FIRST:
    - hardware/kv260/ising_sampler_v1.v (current parallel synchronous design)
    - hardware/kv260/ising_sampler_v2.v (if it exists — synchronous v2)
    - hardware/kv260/ising_sampler_v3.v (if it exists from exp1098 Potts work)
    - python/carnot/hardware/kv260_sampler.py (Python interface to KV260)
    - results/experiment_1094_phase2a_sampler_correctness_audit.json
      (KL=3.07, board_reachable=True at 192.168.51.98, phase2a_finding2_confirmed=True)
    - python/carnot/eval/diagnostics.py (KLDivergenceEstimator — use for validation)

    TASK PART 1 — VERILOG REDESIGN:
    Create hardware/kv260/ising_sampler_v3.v implementing sequential single-site updates:

    Key design changes:
    1. Add spin_select counter: reg [$clog2(N_SPINS)-1:0] spin_select;
    2. Each clock cycle: update ONLY spin_select spin using current neighbor values
    3. Increment spin_select (mod N_SPINS) each cycle
    4. The energy computation is local: E_i = J[i,:] · s (dot product with all spins)
    5. Gibbs probability: p(s_i=+1) = sigmoid(-β * ΔE_i) where ΔE_i = E(s_i=-1) - E(s_i=+1)
    6. Use LFSR for random bit (same as existing design)
    7. AXI-Lite interface stays identical to v1/v2 (backward compatible)

    TASK PART 2 — PYTHON SIMULATION VALIDATION:
    Before hardware deployment, validate in Python simulation:
    Implement SynchronousIsingSamplerV3 in python/carnot/hardware/sampler_sim.py:
    - Uses exact same sequential sweep order as Verilog
    - Runs on the same frustrated antiferromagnetic ring used in exp1094
      (N=8 spins, antiferromagnetic J = -1 for all adjacent pairs, periodic boundary)
    - Runs 10,000 steps, collects spin configuration histogram
    - Computes KL(sim_v3 || true_Gibbs) using KLDivergenceEstimator

    Target: KL(v3_sim || Gibbs) < 0.05 (vs current parallel 3.07)

    TASK PART 3 — HARDWARE DEPLOYMENT (if KV260 reachable):
    If board at 192.168.51.98 is reachable AND Vivado is installed:
    - Synthesize ising_sampler_v3.bit (use existing TCL script, update RTL path)
    - Deploy to KV260 via dfx-mgr-client
    - Run hardware validation: measure KL(hardware_v3 || Gibbs) on 10,000 samples
    If board unreachable OR Vivado unavailable: report kv260_deployed=False,
    python_sim_validated=True — simulation result is the primary deliverable.

    STRETCH GOAL — Potts v2 sequential:
    If the base Ising v3 sequential design validates (KL < 0.05), also update
    hardware/kv260/potts_sampler_v2.v to use sequential updates (same fix pattern).

    WRITE TESTS (at least 4):
    tests/python/test_kv260_v3_sequential.py:
    - sequential_sampler_updates_one_spin_per_step
    - sequential_sampler_kl_below_005_on_frustrated_ring
    - sequential_vs_parallel_kl_comparison_sequential_is_lower
    - verilog_v3_file_exists_and_has_spin_select_counter

    CONCRETE STEPS:
    - cat hardware/kv260/ising_sampler_v1.v | head -80  (understand current design)
    - ping -c 1 192.168.51.98 || echo "KV260 unreachable"
    - which vivado || echo "Vivado not on PATH"
    - (implement ising_sampler_v3.v with sequential updates)
    - (implement SynchronousIsingSamplerV3 Python sim)
    - JAX_PLATFORMS=cpu python -c "from python.carnot.eval.diagnostics import KLDivergenceEstimator; print('KLDiv OK')"
    - (run Python simulation, compute KL)
    - (hardware deployment if board reachable + Vivado available)
    - JAX_PLATFORMS=cpu pytest tests/python/test_kv260_v3_sequential.py -v
    - Write results/experiment_1109_kv260_ising_sampler_v3_sequential.json

    REQUIRED ARTIFACT FIELDS:
    - verilog_v3_written: bool
    - verilog_v3_path: str ("hardware/kv260/ising_sampler_v3.v")
    - uses_sequential_updates: bool (True if spin_select counter present)
    - python_sim_validated: bool (True if sim KL < 0.05)
    - kl_sim_v3_vs_gibbs: float (target: < 0.05)
    - kl_parallel_v1_vs_gibbs: float (reference: 3.07 from exp1094)
