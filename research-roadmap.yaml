- id: exp8123-contract-custody
  title: Bind thirteen tasks with the exact authority-reader format
  phase: 1
  track: science
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 25
  per_unit_rows: true
  milestone: 2026.10.703
  deliverable: results/experiment_8123_v703_contract_custody.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prior_failures:
  - experiment_id: exp8110-contract-custody
    verdict: complete_blocked_design_exact_task_contract
    addressed_by: The design now uses the exact existing parser heading and full JSON/digest; planning tests the
      real reader before staging.
    retire_if_same_verdict: true
  - experiment_id: exp8083-contract-custody
    verdict: complete_disqualified_research-roadmap-vNEXT_md
    addressed_by: Generate the table and complete JSON from all thirteen actual YAML tasks; preserve historical
      design bytes.
    retire_if_same_verdict: true
  agent_type: claude
  model: opus
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V702 closed thirteen scheduled tasks. Nine primaries exist and four tasks were gate-skipped. Exp8110 and Exp8122 failed design_exact_task_contract because the design lacked the exact parser heading. The archive currently ends at V701; reconcile from the active roadmap and conductor log without inventing an archived V702 record.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py; python/carnot/reporting/primary_publication.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/v685_authority_lifecycle.py; scripts/experiments/experiment_8110_v702_contract_custody.py; tests/python/test_contract_custody_8110.py; tests/python/test_experiment_7891_v685_authority_lifecycle.py; results/experiment_8122_v702_capstone.json; openspec/change-proposals/research-roadmap-v702-preserved-20261004.md
    TASK:
    Bind thirteen tasks with the exact authority-reader format. Deliver results/experiment_8123_v703_contract_custody.json, primitive evidence under results/raw/experiment_8123_v703_contract_custody/ and runnable scripts/experiments/experiment_8123_v703_contract_custody.py.
    CONCRETE STEPS:
    1. Emit a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess. Set PYTHONUNBUFFERED=1 and use print(..., flush=True). Report real completed/pending counts inside long loops and child waits at least every 60 seconds. Keep every silence gap below 600 seconds. Poll children in calls of at most 60 seconds. Write any file over about 200 lines in several tool calls of at most about 150 lines. Send a progress message between calls. Do not pad runtime or invent progress.
    2. Check exact input paths, hashes, model/runtime prerequisites and named test paths with bounded calls. Read historical results with scripts/summarize_artifact.py before citing them. Preserve failed primaries. An unchanged external block is terminal complete_blocked_<check>, verdict_class=blocked. Record the actual failing operand in gate_check_summary. Use tests/python/test_primary_publication_7928.py; test_primary_publication.py does not exist.
    3. Extend the applicable REQ-* and SCENARIO-* before implementation. Write failing tests first. Reuse qualified modules with a thin script-path CLI. Keep fixtures and validation outputs in private temporary directories outside results/. Preserve original assertions. Resolve imports when the CLI runs outside the checkout without PYTHONPATH.
    4. Load no LLM. Declare inference_substrate_class=no_model_load and MODEL_SPECS=[]. Use aggregation_from_upstream_artifacts for read-only reductions, or verifier_ensemble_against_cached_candidates for actual CPU feature/head evaluation. Put historical Qwen provenance under cited_upstream_artifacts. Describe small trained heads in trained_head_specs, not as current generator invocations.
    5. Use the literal heading ## Exact task contract, a five-column table and V703_TASK_CONTRACT_START JSON. Bind all thirteen full task dictionaries, including prompts, gates and failure history, to the canonical tasks_digest. Do not weaken parse_design or normalize a malformed heading after the fact.
    6. Exercise staging, activation, staging disappearance and immutable snapshots through the existing parameterized authority lifecycle. During planning, simulate activation only in a private temporary directory. During conductor execution, compare the actual activated V703 authority. Never modify research-roadmap.yaml from this task.
    7. Preserve the original V702 design and its activation snapshot separately; the current document has changed since activation. Reconstruct all thirteen dispositions from exact primaries, alternate blocked records and conductor skips. No completion count is a science result. Reuse each qualified historical input independently of the failed V702 administrative receipt.
    8. Run E2E-018 private authority CLI and mutations. Reject missing/extra/reordered tasks, changed prompts, changed gate fields, stale digests and overwritten snapshots. Export contract readiness only after all authority checks pass.
    9. Freeze validation argv before measurement. Run scoped unit and consumer tests, Ruff check and format, strict mypy, 100% changed-code statement coverage and scoped spec coverage. Execute applicable E2E private CLI success, external block, mutation and cold-replay routes. Capture argv, expected and actual exits, normal exit, log hash and duration. If Rust changes, run cargo test, fmt, clippy and the loaded binding. Keep existing global health failures separate; an unrelated full-suite rerun is not a science prerequisite.
    10. Save primitive rows, raw transcripts and source/code/config hashes. Independently recompute reductions. Run unmodified scripts/adversarial_verify.py and strict scripts/verdict_row_consistency_lint.py through a heartbeat wrapper. Require normal validator exit; a timeout is not a pass. Publish through primary_publication only after passing owned validation. Owned failures disqualify the result and set readiness fields to 0. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md without deleting history. Do not edit operator-curated publication pages or submit externally.
    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: complete_* terminal string; principle: a completed null or external block is recorded once.
    - verdict_class: positive | circular_positive | null | blocked | disqualified | partial; principle: partial means unfinished owned work that another attempt can finish, never an unchanged external block.
    - verifier_is_oracle, claim_scope, exposure_scope; principle: fixture truth is circular_positive, never a positive natural-data result.
    - independent_generalization_score: 0; generalized_learning_benefit_score: 0; principle: exposed development data cannot establish independent generalization.
    - required_checks_passed, flagged_adversarial, validation_receipts, terminal_validation_sidecar_path; principle: normal owned checks precede publication.
    - gate_check_summary: list of check/upstream/path/hash/artifact_field/op/expected/observed/passed; principle: blocked verdicts identify the actual failing operand.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, call_ledger, trained_head_specs; principle: current execution remains distinct from historical model provenance.
    - rows: unit_id/source_cluster_id/arm/condition/metric/numerator/denominator/status/exclusion_reason; principle: each comparative headline reduces from individual units, with missing units retained.
    - intended_count, eligible_count, independent_count, completed_count, excluded_count, censored_count, failed_count, sample_size_budget; principle: repetitions and seeds do not create independent sources.
    - run_date, duration_s, random_seed, reproducibility_checksum, source_artifact_hashes, raw_shard_hashes, code_config_hashes, phase_spans; principle: each claim binds real work to exact bytes.
    - acceptance_gates, field_principles, cited_upstream_artifacts; principle: explain each threshold and imported field so readers can detect unsupported conclusions.
    - contract_ready_score: 0|1; principle: complete authority agreement is administrative readiness, not scientific benefit.
    - task_contract, canonical_tasks_sha256, authority_snapshots, historical_dispositions; principle: each scheduled task and historical failure stays auditable.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_8123_v703_contract_custody.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
