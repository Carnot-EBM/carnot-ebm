- id: exp1015-energy-selection-ssd-v2
  milestone: 2026.04.79
  deliverable: results/experiment_1015_energy_selection_ssd_v2.json
  title: "Energy-Selection SSD v2 — FR-11 Mandatory Self-Learning (Self-Distilled Reasoner Integration)"
  prompt: |
    CONTEXT:
    Energy-Selection SSD is the MANDATORY self-learning experiment for Milestone 2026.04.79.
    FR-11 (Continuous Self-Learning) has not been advanced since Milestone .33 (46 milestones
    ago). Exp 1006 (.78) was DOOMED_RERUN_BLOCKed because the planning agent forgot to add
    prior_failures to the YAML (conductor found 4 prior experiments matching "self-distillation"
    scope). This v2 includes proper prior_failures documentation.

    Two research inspirations:
    1. SSD (arXiv 2604.01193, Apple Research): sample model's own outputs, filter by
       temperature/truncation, apply SFT. +12.9pp LiveCodeBench from self-distillation alone.
    2. Self-Distilled Reasoner (arXiv 2601.18734): teacher conditioned on verified reasoning
       traces, student learns from them. Only 1% of process labels needed vs RLVR.

    Carnot's version (Energy-Selection SSD): use the energy function as the SSD filter
    instead of temperature/truncation. Low-energy outputs = high-confidence-correct =
    better training signal. Also test combined approach: energy filter + FoVer step labels.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline — energy scoring)
    - python/carnot/models/kaem_energy.py (KAEMEnergy — energy scorer for filtering)
    - openspec/capabilities/verifiable-reasoning/spec.md (FR-11 requirements)
    - results/fover_labeled_steps_live.json (57 real CoT pairs — step labels for conditioning)
    - scripts/experiment_template.py (ExperimentTemplate, build_result pattern)
    - results/experiment_862_lagrange_self_learning.json (prior FR-11 attempt, no_improvement)

    TASK:
    1. IMPLEMENT EnergySSDv2 in python/carnot/pipeline/energy_ssd.py:
       class EnergySSDv2:
           def score_responses(responses, questions, energy_scorer):
               # Score each response with energy_scorer.energy(text)
               # Returns list of (response, energy_score) sorted by energy ascending
           def filter_by_energy(scored, threshold_pct=50):
               # Keep responses below threshold_pct percentile of energy scores
               # Returns (kept, rejected, stats)
           def filter_by_labels(scored, fover_pairs):
               # Keep responses whose steps match FoVer labels as "correct"
               # Returns (kept, rejected, stats)
           def simulate_self_distillation(questions, energy_scorer, n_rounds=3,
                                          mode="energy" | "labels" | "combined"):
               # Simulate 3 rounds of SSD filtering
               # Round 0: all responses kept (baseline)
               # Round i: filter to top-quality subset per mode, track quality improvement
               # Returns dict: round -> {n_kept, threshold, precision_estimate, improvement}
    2. ADD REQ-LEARN-050/051/052 + SCENARIO-LEARN-070/071/072 to spec.
    3. BENCHMARK all three modes on 30 synthetic GSM8K questions:
       Mode A: energy-only filter (SSD paper's approach but with Carnot energy)
       Mode B: label-conditioned filter (Self-Distilled Reasoner's approach)
       Mode C: combined (energy threshold + label conditioning)
       Track precision_estimate per round for each mode.
    4. COMPARE to temperature-SSD baseline (filter by top-50% token probability).
    5. DETERMINE which mode closes FR-11:
       self_learning_closed = (best_mode_round3_precision > round0_precision) by > 0.05
    6. Write 100% coverage tests for energy_ssd.py.
    7. WRITE results/experiment_1015_energy_selection_ssd_v2.json (try/finally):
       - mode_a_precision_r0: float (baseline)
       - mode_a_precision_r3: float (energy-only after 3 rounds)
       - mode_b_precision_r3: float (label-conditioned after 3 rounds)
       - mode_c_precision_r3: float (combined after 3 rounds)
       - temperature_ssd_precision_r3: float (comparison baseline)
       - best_mode: str ("energy" | "labels" | "combined" | "temperature_ssd")
       - self_learning_closed: bool (best_mode_r3 > r0 by > 0.05)
       - fr11_tier: "tier2_online" (cross-session confirmed) if self_learning_closed else "partial"
       - honest_verdict: "energy_ssd_improves" | "energy_ssd_parity" | "energy_ssd_no_improvement"

    CONCRETE STEPS:
    - python3 -c "from python.carnot.models.kaem_energy import KAEMEnergy; m=KAEMEnergy(10); print('KAEMEnergy ok')"
    - python3 -c "import json; d=json.load(open('results/fover_labeled_steps_live.json')); print(len(d), 'pairs')"
    - grep -n "FR-11\|REQ-LEARN" openspec/capabilities/verifiable-reasoning/spec.md | tail -20

    Run: python scripts/experiment_1015_energy_selection_ssd_v2.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: high
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 20
  prior_failures:
  - experiment_id: exp1006-energy-selection-ssd
    verdict: blocked_doomed_rerun_no_prior_failures
    addressed_by: "Exp 1006 (.78) was DOOMED_RERUN_BLOCKed because the planning agent failed to add prior_failures field to the YAML (conductor found 4 prior matching-scope experiments). Exp 1015 v2 includes this prior_failures documentation. The experiment scope is intentionally similar to prior self-learning experiments but uses a DIFFERENT mechanism: energy-threshold filtering, not weight reweighting."
    retire_if_same_verdict: false
  - experiment_id: exp862-lagrange-self-learning
