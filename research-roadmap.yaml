  - id: exp2596
    milestone: "2026.05.249"
    deliverable: "results/experiment_2596_tier0s_real_retrain.json"
    title: "tier0s Real-Corpus Retrain: Logistic Regression on FoVer Pairs"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: verifier_recovery

    prior_failures:
      - experiment_id: exp2509-tier0s-halluguard-ntk
        verdict: "complete: synthetic AUROC=1.0; real-corpus AUROC=0.3758 (near-random)"
        addressed_by: "exp2509 trained on synthetic NTK-proxy pairs; NTK features do not generalize to natural FoVer text. This trains on real FoVer corpus (n~6548 labeled pairs) using logistic regression on TF-IDF features — different technique and different training data."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      tier0s (HalluGuard NTK-proxy verifier) achieves real-corpus AUROC=0.3758 on FoVer
      natural-text pairs — near-random, wasting calibration signal in ensemble v7b (AUROC=0.9857).
      Root cause: tier0s was trained on synthetic NTK-proxy pairs; NTK features do not generalize
      to natural FoVer text. Target: real-corpus AUROC > 0.65.

      FoVer corpus location (try in order):
        python/carnot/verify/foVer_corpus.jsonl
        data/foVer_corpus.jsonl
        (glob: find {project_root} -name '*foVer*corpus*' -o -name '*fover*corpus*' | head -1)
      Each entry: {{context, claim, label}}  where label ∈ {{hallucination, correct}}.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/tier0s_halluguard.py
      - results/experiment_2509_tier0s_halluguard_ntk.json

      TASK: Retrain tier0s on real FoVer corpus using TF-IDF logistic regression.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `python -c "import sklearn; print(sklearn.__version__)"` succeeds
         b. FoVer corpus discoverable via the paths above (non-empty file)
         c. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds
         If any precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus. Split 80/20 train/test stratified by label.
         Log: n_train, n_test, label_distribution.

      2. Build feature matrix (n_samples, ~5003):
         - TF-IDF unigrams+bigrams on claim text (max_features=5000, random_state=42)
         - cosine_similarity(context_tfidf, claim_tfidf) per sample
         - claim length (whitespace-split tokens)
         - overlap_coefficient = |context_tokens ∩ claim_tokens| / min(|context|, |claim|)
         - Jaccard similarity between context and claim token sets

      3. Train sklearn LogisticRegression(C=1.0, max_iter=1000, random_state=42).
         Evaluate on test split: AUROC (roc_auc_score), AUPRC, F1 (threshold=0.5).

      4. If test AUROC > 0.3758: serialize pipeline (TfidfVectorizer + LR) via joblib to
         python/carnot/verify/tier0s_real_model.pkl.
         Update tier0s_halluguard.py to load this pkl when present (fallback to NTK if absent).
         Set tier0s_improved=True.

      5. Write results/experiment_2596_tier0s_real_retrain.json with all required fields.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
      - tier0s_real_auroc: float — primary gate metric (must exceed 0.3758)
      - tier0s_real_auprc: float — secondary metric for imbalanced corpus
      - tier0s_improved: bool — True iff tier0s_real_auroc > 0.3758 (gate for exp2604)
      - n_train: int — training split size for reproducibility
      - n_test: int — test split size (must be >= 100 for statistical validity)
      - random_seed: 42 — required for reproducibility
      - feature_description: str — documents TF-IDF + cosine approach
      - model_path: str — path to serialized pkl (or 'not_saved_auroc_below_baseline')
      - duration_s: float — wall-clock time (fabrication signal if < 1.0s for real sklearn training)
      - preconditions_checked: list of {{resource, available, check}}

      Run: `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` to confirm no import regressions.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2597
    milestone: "2026.05.249"
    deliverable: "results/experiment_2597_tier0u_real_fix.json"
    title: "tier0u TF-IDF NLI-Proxy Fix: Real-Text Self-Consistency"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: verifier_recovery

    prior_failures:
      - experiment_id: exp2535-tier0u-logical-consistency
        verdict: "complete: synthetic AUROC=0.96; real-corpus AUROC=0.5360 (near-random)"
        addressed_by: "exp2535 trained on synthetic self-consistency pairs with template-predictable structure. This uses TF-IDF cosine overlap between (context, claim) pairs — a technique that generalizes to natural text (does not require template structure). Different scoring AND different training source."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      tier0u (Logical Consistency verifier) achieves real-corpus AUROC=0.5360 on FoVer
      natural-text pairs — near-random. Root cause: the self-consistency score was designed
      for synthetic pairs with template-predictable structure; it fails on natural text.

      Replace the scoring with TF-IDF cosine overlap between (context, claim) pairs as a proxy
      for "does the claim use concepts present in the context?" This generalizes to natural text.
      Target: real-corpus AUROC > 0.60.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/tier0u_logical_consistency.py
      - results/experiment_2535_tier0u_logical_consistency.json

      TASK: Retrain tier0u using TF-IDF cosine NLI-proxy on real FoVer corpus.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `python -c "import sklearn"` succeeds
         b. FoVer corpus discoverable (same paths as exp2596)
         c. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds
         If any precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus. Split 80/20 train/test stratified by label.

      2. Fit TfidfVectorizer(analyzer='word', ngram_range=(1,2), max_features=10000, random_state=42)
         on combined train context+claim text. Per-sample features (5 total):
         - cosine_similarity(context_tfidf, claim_tfidf)
         - claim length (tokens)
         - context length (tokens)
         - overlap_coefficient = |context ∩ claim tokens| / min(|context|, |claim|)
         - Jaccard similarity between context and claim token sets

      3. Train LogisticRegression(C=1.0, max_iter=1000, random_state=42) on 5 features.
         Evaluate on test split: AUROC, AUPRC, F1.

      4. If test AUROC > 0.5360: serialize pipeline to python/carnot/verify/tier0u_real_model.pkl.
         Update tier0u_logical_consistency.py to load pkl when present.
         Set tier0u_improved=True.

      5. Write results/experiment_2597_tier0u_real_fix.json with all required fields.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
      - tier0u_real_auroc: float — primary gate metric (must exceed 0.5360)
      - tier0u_real_auprc: float — secondary metric
      - tier0u_improved: bool — True iff tier0u_real_auroc > 0.5360
      - n_train: int — training split size
      - n_test: int — must be >= 100
      - random_seed: 42
      - feature_description: str — documents TF-IDF cosine approach
      - model_path: str — path to pkl or 'not_saved_auroc_below_baseline'
      - duration_s: float — wall-clock time
      - preconditions_checked: list of {{resource, available, check}}

      Run: `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"`.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


