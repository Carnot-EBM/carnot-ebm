    2. Read results/experiment_911_drift_probe_tier0i.json. Extract ood_auc_drift (baseline).
    3. Read python/carnot/verify/drift_probe.py. Understand current single-probe structure.
    4. Create python/carnot/verify/drift_probe_ensemble.py:
       class DRIFTProbEnsemble:
         __init__(self, model_runner, layers: list[int] = None):
           layers default to last 4 layers of model
           self.per_layer_probes: list[LogisticRegression] = []  # one per adjacent pair
           self.ensemble_weights: np.ndarray | None = None  # learned α
         fit(self, correct_examples, hallucinated_examples) -> None:
           For each layer pair (L, L+1):
             compute cosine drift for all examples
             train LogisticRegression on (drift, label)
           self.per_layer_probes = trained probes
           # Learn ensemble weights via grid search on held-out split:
           # α* = argmin_α accuracy(α-weighted-sum of per_layer_probs on held-out)
           # Use scipy.optimize.minimize or simple grid search (20 candidates)
           self.ensemble_weights = α*
         predict_violation_prob(self, hidden_states) -> float:
           per_layer_probs = [probe.predict_proba(drift_i)[1] for probe, drift_i in zip(...)]
           return np.dot(self.ensemble_weights, per_layer_probs)
    5. Update spec: REQ-TIER0-006 (DRIFTProbe ensemble multi-layer hallucination detection),
       SCENARIO-TIER0-006 (ensemble AUC > 0.65 on GSM8K hallucination pairs).
