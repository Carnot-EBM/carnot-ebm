    representation (free-form induction ~0.12, structured ProductWorldModel identity-null, TTA) all hit the
    same change-VALUE ceiling. So A1 CHANGES THE REPRESENTATION CLASS.

    THE METHOD (arXiv:2606.25421 Agent-Authored World Modeling). Instead of supervising/adapting an
    executable-code engine on generic exact transitions (which captures change-LOCATION but not change-VALUE),
    the agent AUTHORS DECISION-NEED targets -- the decision-relevant dynamics facts it needs before acting --
    as a NON-code representation, fit/prompted from the agent's OWN cold-start transitions. For ARC, author per
    held-out engine miss a decision-need target such as: per-object ACTION-EFFECT (applying action a to object
    O changes its cells to value V), object PERSISTENCE (which objects survive/move under a), or hidden-REGISTER
    deltas (a step-counter / selection-index change). Build a non-code target TABLE and score whether predicting
    change-VALUE via this table beats the code engine.

    THE GPU FIX (load-bearing -- the 2026-06-27 operator GPU-allocation directive; the .450 A1 already used it
    correctly). Offline induction must NOT iGPU-pin or hard-reject CUDA_VISIBLE_DEVICES. Accept the conductor's
    GPU-0 CUDA llama-server (CUDA_VISIBLE_DEVICES=0, CARNOT_ARC_GENERATOR_CUDA_GPU=0, card >=13GB free -- both
    3090s idle) OR the iGPU HIP server; health-check via _ensure_server(). REUSE exp4882's
    generator_available() precondition (it ran 168s on gpu0_cuda).

    THE A1 GRADED METRIC + HELD-OUT SPLIT (load-bearing -- reuse exp4882 EXACTLY so the comparison is fair).
    For each held-out off-path (s,a,s') transition:
      - cell_recall: fraction of the cells that ACTUALLY changed (s -> s') that the representation predicts as
        changed (the change-LOCATION floor; tu93 must be NON-degenerate here -- cell_recall > 0).
      - changed_cell_value_accuracy: of the cells predicted-changed AND actually-changed, the fraction whose
        predicted VALUE matches s' (the change-VALUE signal A1 attacks).
    Use exp4882's SAME held-out games (cd82, cn04, ls20, m0r0, r11l, sk48, sp80, su15, wa30), tu93 positive
    control, and held-out split.

    THE INTERVENTION (Phase-Prototype+Validation -- baseline then intervention then positive control):
