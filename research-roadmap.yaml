      artifact_field: relation_canary_ready_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Exp6899 is a fail-fast authenticity and parser canary. This task scales only that frozen protocol
    and exact model/runtime configuration. It compares three required GGUF proposal arms with the
    pinned Enoki encoder and a lexical rule control. Acquisition completeness is independent of
    held semantic quality. No arm may approve its own proposals.

    Work at {project_root}. The execution date is {date}.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V604 Planner Refresh
    - {project_root}/results/experiment_6886_enoki_exact_relation_fixture.json
    - {project_root}/results/experiment_6887_three_family_relation_proposal_corpus.json
    - {project_root}/results/experiment_6888_independent_relation_qualification.json
    - {project_root}/results/experiment_6899_live_relation_acquisition_canary.json
    - {project_root}/scripts/experiments/experiment_6887_three_family_relation_proposal_corpus.py
    - {project_root}/scripts/experiment_template.py, cached_sota_pair() pattern
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/inference/llama_cpp_process.py
    - {project_root}/openspec/capabilities/llm-ebm-inference/spec.md
    - {project_root}/openspec/capabilities/constraint-verification/spec.md

    TASK:
    Acquire a balanced, authentic proposal corpus with all three MODEL_SPECS, Enoki, and the lexical
    rule control. Reuse the exact canary prompt, parser, model files, tokenizer settings, and server
    lifecycle. Preserve every raw response, relation, malformed line, abstention, empty output,
    timeout, and truncation. Keep all held labels, ASP programs, answer sets, and solver receipts
    sealed for Exp6901.

    CONCRETE STEPS:
    0. PRECONDITIONS: require `relation_canary_ready_score=1`, matching canary hashes, all three
       authenticated GGUF paths, pinned Enoki assets, task-owned GPU leases, and zero held-sidecar
       access. On failure, write complete_blocked_authentic_anchored_relation_corpus with
       gate_check_summary.
    1. Add REQ-INFERENCE-6900 and focused tests first. Cover gate mismatch, prompt/parser drift,
       model or tokenizer drift, row duplication, empty-output masking, partial resume, stale PID,
       timeout, truncation, server crash, and sidecar access.
    2. Freeze at least 100 group-balanced source records per arm, with at least 20 records from each
       of graph coloring, scheduling, non-monotonic defaults, contradictions, and cardinality.
    3. Run all MODEL_SPECS with native llama.cpp tokenization and CUDA offload. Never use
       AutoTokenizer on a GGUF repository. Match prompt, seed matrix, output budget, and stop policy.
    4. Run Enoki and the lexical rule control on the same source IDs. Keep each arm's provenance and
       resource cost separate.
    5. Preserve raw bytes and hashes before parsing. Parse source spans and tuple fields only. Do not
       use a grammar, schema-constrained decoder, repair prompt, model judge, text scorer, held label,
       compiler result, or solver result during acquisition.
    6. Emit terminal rows for malformed, unsupported, duplicate, abstain, empty, timeout, and
       truncated cells. Never replace a failed cell with a fixture or control output.
    7. Record model/process/tokenizer/GPU/VRAM/latency/stop/teardown receipts per GGUF cell and exact
       revision receipts for Enoki and the rule arm.
    8. Set `relation_corpus_complete_score=1` only from authentic acquisition, complete arm-family
       denominators, raw-row integrity, clean lifecycle receipts, duration at least 60 seconds, and
       zero held-sidecar access. Do not make this score depend on semantic correctness.
    9. Run focused tests, Ruff, OpenSpec coverage, E2E-006, cache/GPU authenticity checks,
       adversarial verification, artifact-convention audit, verdict-row consistency lint, and
       root-clutter checks.
    10. REQUIRED ARTIFACT FIELDS: field_principles with one principle per required field and the
       incoming and outgoing gate fields; preconditions_checked; inference_substrate
       (live_local_sota_gguf_cuda_plus_pinned_enoki_encoder); duration_s; source_artifact_hashes;
       model_specs (all three exact MODEL_SPECS); models_used; model_artifact_hashes;
       tokenizer_receipts; llama_cpp_receipts; gpu_lease_rows; server_lifecycle_rows;
       enoki_asset_receipts; deterministic_rule_receipts; prompt_manifest; rows (one arm, seed,
       source record, relation, or failed cell per row); raw_request_manifest; raw_output_manifest;
       parse_failure_rows; abstention_rows; empty_rows; truncation_rows; timeout_rows;
       per_arm_family_counts; held_sidecar_access_count (zero); model_weight_mutation_count (zero);
       external_text_scorer_call_count (zero); constrained_schema_decode_count (zero); random_seed;
       reproducibility_checksum; relation_corpus_complete_score; gate_check_summary with failed
       check, expected value, and observed value for any blocked verdict; verifier_is_oracle (false);
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6900_authentic_anchored_relation_corpus.py --date {date}
