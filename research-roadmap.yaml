           from exp3640) loadable. If only math is available -> train on math, report
           "complete: blocked_no_ood_eval_corpus" honestly (do NOT fabricate an OOD number).
        b. A small trainable model substrate (a tiny ranking head / small EBM / a SOTA-GGUF embedding via
           cached_sota_pair) available. If none -> "complete: blocked_no_trainable_substrate".
      CONCRETE STEPS:
        1. Train a SMALL ranking/energy judge on the in-domain (math) reasoning-validity labels -- minimal
           prototype, document the recipe (features, loss, epochs). This is a PROTOTYPE, not a production model.
        2. Evaluate the trained judge's error-detection AUROC on (i) in-domain math (sanity), (ii) the OOD
           domain(s) it was NOT trained on (code/facts). >=3 seeds + CI.
        3. ADVERSARIAL CHECK (mandatory): could the judge be learning a degenerate length/format prior rather
           than reasoning-validity? Add a shuffled-label control and a confidence-only baseline; the trained
           judge must beat both on OOD to claim transfer.
        4. Compare: does the TRAINED judge transfer OOD better than Carnot's FIXED ensemble did (the .329-.333
           math-only result)? Report the cross-domain delta of trained-judge vs fixed-ensemble.
      ANTI-POISON TEST DISCIPLINE (MANDATORY): any pytest you ship MUST parametrize over the script's honest
      verdicts (transfers / does-not-transfer / blocked) for synthetic fixtures; NEVER hard-assert one success
      string. Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; store the VALUE):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: trains a small head on cached labels + scores cached corpora; declare GPU use)."
        judge_recipe:
          principle: "The trained judge's features/loss/epochs -- reproducibility of the prototype."
        in_domain_judge_auroc:
          principle: "Sanity: the trained judge must work in-domain before any OOD claim is meaningful."
        ood_judge_auroc:
          principle: "The core number: does the trained judge detect errors in a domain it was NOT trained on?"
        ood_domains_tested:
          principle: "Which OOD domains (code/facts) were evaluated -- scopes the transfer claim."
        shuffled_label_control_auroc:
          principle: "Adversarial control: a near-0.5 here confirms the judge is not learning a degenerate prior."
        trained_judge_vs_fixed_ensemble_ood_delta:
          principle: "Does TRAINING the judge buy the OOD transfer the fixed ensemble (.329-.333) lacked -- the foundation-model-path signal."
        trained_judge_transfers_ood:
          principle: "True iff the trained judge beats both confidence-only and shuffled-control on OOD -- the falsifiable transfer claim."
        n_examples_per_domain:
          principle: "Sample-size rigor."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor (a real train+eval takes minutes, not seconds)."
      ACCEPTANCE GATE:
        - condition: "in_domain_judge_auroc present AND shuffled_label_control_auroc present AND ood_judge_auroc present"
          principle: "An OOD-transfer claim requires an in-domain sanity pass AND a shuffled-label adversarial control -- without both the OOD number could be a degenerate-prior artifact."
      TERMINAL VERDICTS: "complete: trained_ebm_judge_transfers_ood_fixed_ensemble_was_the_bottleneck" /
      "complete: trained_ebm_judge_also_math_only_transfer_not_a_training_artifact" /
      "complete: blocked_no_ood_eval_corpus" / "complete: blocked_no_trainable_substrate"
      Run: cd {project_root} && python scripts/experiment_3646_trained_ebm_judge_ood_counterpoint_v2.py
