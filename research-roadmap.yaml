  - id: exp355-apple-adversarial-gsm8k-benchmark
    milestone: "2026.05.20"
    deliverable: results/experiment_355_adversarial_gsm8k_benchmark.json
    title: "Exp 355: Apple adversarial GSM8K benchmark — live GPU execution on Gemma4-E4B-it + Qwen3.5-0.8B"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 354 built the adversarial GSM8K harness. This experiment executes it on
      live GPU. Target: 100 standard + 100 adversarial GSM8K questions × 2 models
      (Gemma4-E4B-it + Qwen3.5-0.8B). Measure: accuracy drop (standard → adversarial) and
      verify-repair recovery on adversarial variants.

      This is Carnot's headline credibility experiment. If verify-repair maintains accuracy
      on adversarial inputs where the model drops, that proves structural constraint
      verification is robust to the kind of irrelevant-sentence noise that breaks all
      prompt-based approaches.

      If live GPU is unavailable (honest_verdict from Exp 353 is not "live_confirmed"),
      run with CI-safe simulated mode but label all results explicitly as "SIMULATED — not
      credible" and set honest_verdict="blocked_simulated". Do NOT report simulated results
      as headline claims.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/adversarial_gsm8k.py — AdversarialGSMQuestion, harness (Exp 354)
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
      - python/carnot/pipeline/extract.py — ArithmeticExtractor, AutoExtractor
      - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner
      - results/experiment_354_adversarial_gsm8k_harness.json — harness output
      - results/experiment_353_live_gpu_smoke_test.json — live GPU status

      TASK: Execute adversarial GSM8K benchmark on live GPU.
      1. Read CLAUDE.md spec-first workflow.
      2. Add SCENARIO-BENCH-017/018/019 to
         openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - run_adversarial_benchmark(model_id, questions, pipeline, batch_size=8)
           → AdversarialBenchmarkResult
         - CI-safe: when CARNOT_FORCE_LIVE not set, use precomputed synthetic results
         - Verify that honest_verdict is "improvement_positive" only when
           repair_improvement > 0 AND inference_mode == "live_gpu"
         - Verify that honest_verdict is "blocked_simulated" when inference_mode != "live_gpu"
      4. Write scripts/experiment_355_adversarial_gsm8k_benchmark.py using ExperimentTemplate(355):
         a. Check results/experiment_353_live_gpu_smoke_test.json for live GPU status
         b. Load 100 questions from official gsm8k test split (or hardcoded 100-question set)
         c. Build adversarial variants using build_adversarial_questions()
         d. Run DualGPURunner: Gemma4-E4B-it on GPU 0, Qwen3.5-0.8B on GPU 1
         e. For each model: batch inference on standard questions → record accuracy
         f. For each model: batch inference on adversarial questions → record accuracy
         g. For each model: run verify-repair on adversarial questions → record repaired accuracy
         h. Compute: accuracy_drop = standard_accuracy - adversarial_accuracy
            repair_improvement = repaired_adversarial_accuracy - adversarial_accuracy
         i. Build artifact: schema="carnot.adversarial_gsm8k.v1",
            per_model_results (list), headline_result, inference_mode, honest_verdict
            IMPORTANT: honest_verdict = "improvement_positive" only if
              repair_improvement > 0 AND inference_mode == "live_gpu"
         j. Output: results/experiment_355_adversarial_gsm8k_benchmark.json
      5. Write tests/python/test_experiment_355_adversarial_benchmark.py (100% targeted coverage).
      6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      7. Reconcile: update ops/conductor-log.md with adversarial benchmark result,
         ops/changelog.md, ops/status.md (preserve all existing content — add new sections).
         If honest_verdict == "improvement_positive": add result to _bmad/traceability.md
         as first live-GPU-confirmed positive result.
      8. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp356-llm-as-extractor
    milestone: "2026.05.20"
    deliverable: python/carnot/pipeline/llm_extractor.py
    title: "Exp 356: LLMExtractor — second LLM call extracts structured arithmetic claims from free-form IT model output"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: ArithmeticExtractor uses regex (`a + b = c` patterns) and found ZERO violations
      on Gemma4-E4B-it (0/20 questions, including 4 wrong answers). This is research-program.md
      Goal #1b: "LLM-as-extractor — use a second LLM call to extract verifiable claims from
      the response." The second LLM call converts free-form instruction-tuned output into
      parseable claim triples that the existing Ising/Z3 pipeline can verify.

      MathAgent (arXiv 2604.11188) informs the output format: instead of raw regex matches,
      LLMExtractor produces a constraint graph — (variable_name, value, operation, result) triples
      that map directly to IsingConstraint construction.

      The extractor must:
      1. Accept any LLM response text (including instruction-tuned formats with markdown, lists)
      2. Make a second small LLM call with a structured extraction prompt
      3. Parse the LLM's JSON output into ArithmeticConstraint objects
      4. CI-safe: when no LLM available, extract from a hardcoded test corpus

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/extract.py — ArithmeticExtractor, ConstraintExtractor protocol
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline integration pattern
      - python/carnot/pipeline/nl2z3_extractor.py — LLM-call pattern for extraction (Exp 310)
      - python/carnot/pipeline/verge_refiner.py — LLM-call pattern for repair (Exp 334)

      TASK: Implement LLMExtractor as a new ConstraintExtractor.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-EXTRACT-017 (LLM-as-extractor), REQ-EXTRACT-018 (constraint graph output),
         SCENARIO-EXTRACT-036/037/038 to
         openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - ArithmeticClaimTriple: dataclass (lhs_expr, operator, rhs_expr, claimed_result,
           confidence, source_text)
         - LLMExtractor(llm_caller, model_id, extraction_prompt_template, fallback_to_regex=True)
         - LLMExtractor.extract(question, response) → list[Constraint]
         - LLMExtractor.extract: calls llm_caller with extraction_prompt; parses JSON response
         - LLMExtractor.extract: on JSON parse failure, fallback_to_regex=True calls
           ArithmeticExtractor.extract()
         - LLMExtractor: CI-safe — when llm_caller is None, returns hardcoded test extractions
         - EXTRACTION_PROMPT_TEMPLATE: "(response)\n\nList all arithmetic claims above as JSON:
