         grid_size: int  # N (5 for default)
         solution: ndarray[N,N]  # solution grid with values {1..N}
         inequalities: list[tuple[int,int,int,int,str]]  # (r1,c1,r2,c2,"<" or ">")
         @classmethod
         def generate(cls, n=5, n_inequalities=6) -> FutoshikiPuzzle

       class FutoshikiIsingEBM:
         energy(values: ndarray[N,N]) -> float:
           """E = latin_energy + inequality_energy.
           Latin energy: penalty for duplicate values in any row or column.
           Inequality energy: penalty for violated < or > constraints.
           E=0 iff all constraints satisfied."""

       class FutoshikiSolver:
         solve(puzzle, max_iter=1000) -> ndarray[N,N]: # via ParallelIsingSampler

