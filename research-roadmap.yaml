        - n_samples_justification: "Consolidated audit; n is milestone
          count."
        - audit_outcomes: dict
        - corrigenda_added: list
        - per_prong_status: dict prong -> {{status, evidence, date,
          next_action}}
        - phase_1_ship_percentage: int (0-100)
        - operator_action_items: list
        - dashboard_word_count: int
        - dashboard_has_emojis: false
        - bash_failure_window_observations: str (any SKIP-cascade
          or DOOMED_RERUN patterns since 2026-05-16T06:40Z)
        - acceptance_gate_passed: bool (6 milestones audited +
          dashboard written + status.md linked + emoji-free)
        - acceptance_gate_criteria: "6 milestones audited; dashboard
          accurate; status honest (no inflation of pending → shipped)."
        - methodology_note: "PyPI = shipped-pending-operator-approval
          is NOT 'shipped'. Honest semantics."
        - optimization_direction: "neither — audit/synthesis"
        - honest_verdict: MUST start with `complete:` / `complete_` /
          `success:` / `success_` / `passed:` / `passed_` / `shipped:` /
          `shipped_` per CLAUDE.md Verdict Terminal-Prefix Discipline.

