        verdict: "blocked_missing_receipt: no newer dated GateMate physical receipt exists; zero hardware commands run and Exp3866 remains excluded"
        addressed_by: "The new task checks the later Exp6325 receipt boundary and the current exclusion state, permits at most one bounded action after a genuinely newer physical-state receipt, and otherwise performs zero hardware commands."
        retire_if_same_verdict: true
      - experiment_id: exp6325-gatemate-dated-receipt-single-detect
        verdict: "blocked_detect_failed: one authorized DirtyJTAG detect returned a tool failure; stopped without retry"
        addressed_by: "This task cannot retry the failed detect unless an operator records a physical state change after Exp6325; it stops at one terminal action and never repeats an unchanged probe."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      GateMate remains below its terminal hardware state. Exp6325 used one authorized detect and stopped on failure. Hardware continuity still requires a slot, but scope-reduction and rerun discipline forbid another unchanged probe. This task is a changed-state gate with zero commands unless a new dated operator receipt exists. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
