- id: exp487-gpu-vram-gate-v2
  milestone: 2026.04.37
  deliverable: results/experiment_487_gpu_vram_gate_v2.json
  title: 'Exp 487: GPUVRAMGateV2 — kill zombies BEFORE checking VRAM (RETRO-044 root cause fix)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-044 is\
    \ the master blocker for four consecutive milestones. GPUVRAMGate (Exp 474) checks\
    \ free VRAM first, then kills zombies if the check fails, then rechecks. This order\
    \ is wrong: GPU driver holds zombie contexts for 5-15 seconds after SIGKILL while\
    \ draining queued operations. The recheck fires during this drain window, sees VRAM\
    \ still above threshold, and defers the experiment unnecessarily. Root cause confirmed\
    \ by retro .36: Exps 476, 478, 479 all hit gpu_vram_insufficient despite GPUVRAMGate\
    \ firing. The fix: kill zombies FIRST, sleep 15 seconds (driver drain time), THEN\
    \ check VRAM. This single reorder eliminates the race condition.\n\nEXISTING CODE\
    \ TO READ FIRST:\n- python/carnot/pipeline/gpu_vram_gate.py — GPUVRAMGate, VRAMStatus,\
    \ GPUVRAMInsufficientError (Exp 474)\n- python/carnot/pipeline/env_autofix.py —\
    \ apply_env_autofix()\n- python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\
    \ (Exp 462)\n- scripts/experiment_template.py — ExperimentTemplate, setup_gpu()\n\
    - ops/known-issues.md — RETRO-044\n\nTASK: Implement GPUVRAMGateV2 and replace\
    \ GPUVRAMGate in ExperimentTemplate.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n3. Add REQ-INFRA-049 (GPUVRAMGateV2 kills zombie\
    \ processes before checking free VRAM, with zombie_drain_sleep_seconds=15 to allow\
    \ GPU driver to flush pending operations), REQ-INFRA-050 (GPUVRAMGateV2 replaces\
    \ GPUVRAMGate in ExperimentTemplate.setup_gpu() when requires_gpu=True), REQ-INFRA-051\
    \ (ExperimentTemplate.setup_gpu() imports GPUVRAMGateV2 and uses kill_first=True\
    \ by default), SCENARIO-INFRA-057/058/059 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - GPUVRAMGateV2(min_free_gb: float\
    \ = 8.0, wait_seconds: int = 60, zombie_drain_sleep_seconds: int = 15,\n     kill_first:\
    \ bool = True):\n     - check_vram(gpu_index: int) -> VRAMStatus: uses existing\
    \ VRAMStatus\n     - kill_zombies(gpu_index: int) -> int: returns count killed\n\
    \     - ensure_vram_available(gpu_index: int) -> bool:\n       If kill_first=True:\
    \ kill_zombies() → sleep(zombie_drain_sleep_seconds) → check_vram()\n       If\
    \ still below threshold: wait_seconds loop → check_vram() again\n       If kill_first=False:\
    \ old behavior (check first, kill if needed)\n     - __enter__() / __exit__():\
    \ context manager; raises GPUVRAMInsufficientError if ensure_vram_available returns False\n\
    \   - Test: kill_first=True calls kill_zombies() BEFORE first check_vram() call\n\
    \   - Test: kill_first=False calls check_vram() BEFORE kill_zombies() (backward compat)\n\
    \   - Test: GPUVRAMGateV2 on CPU-only machine (n_gpus=0) is a no-op\n   - Test:\
    \ drain sleep is called with zombie_drain_sleep_seconds after kill_zombies()\n \
    \  - Test: GPUVRAMGateV2 raises GPUVRAMInsufficientError when ensure_vram_available\
    \ returns False\n5. Implement python/carnot/pipeline/gpu_vram_gate_v2.py\
    \ (GPUVRAMGateV2).\n   Reuse VRAMStatus and GPUVRAMInsufficientError from\
    \ gpu_vram_gate.py — do not duplicate them.\n   Update scripts/experiment_template.py:\
    \ in setup_gpu(), replace GPUVRAMGate with GPUVRAMGateV2(kill_first=True).\n  \
    \ Export GPUVRAMGateV2 from carnot.pipeline.__init__.\n   Verbose docstrings: WHY\
    \ kill-first order (GPU driver holds zombie VRAM context during SIGKILL drain —\
    \ 5-15s window; original GPUVRAMGate checked DURING this window, saw VRAM still\
    \ held, deferred; four consecutive milestones lost to this race condition), WHY\
    \ 15-second drain (RTX 3090 driver drains CUDA contexts within 10-15s after SIGKILL\
    \ based on benchmark observations from retro .35/.36), WHY kill_first default=True\
    \ (no reason to check before kill — if zombies exist they will fail the check;\
    \ always kill first eliminates the race).\n6. Write scripts/experiment_487_gpu_vram_gate_v2.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(487, timeout_minutes=20)\
    \ as context manager\n   c. ExperimentTemplate(487, 'GPUVRAMGateV2', 'results/experiment_487_gpu_vram_gate_v2.json')\n\
    \   d. DeliverableGuard('results/experiment_487_gpu_vram_gate_v2.json')\n   e.\
    \ Verify ExperimentTemplate.setup_gpu() now uses GPUVRAMGateV2(kill_first=True)\n\
    \   f. Test kill_first=True: mock GPU with zombies, verify kill called before check\n\
    \   g. Test kill_first=False backward compat: check called before kill\n   h. Test\
    \ CI mode (n_gpus=0): no-op, no error\n   i. Build artifact: schema='carnot.gpu_vram_gate.v2'\n\
    \      kill_first_implemented=True\n      zombie_drain_sleep_seconds=15\n     \
    \ template_updated=True\n      backward_compat_preserved=True\n      retro_044_root_cause_fixed=True\n\
    \      honest_verdict='vram_gate_v2_operational'\n   j. Call tmpl.assert_deliverable_written()\
    \ as FINAL LINE\n   k. Output: results/experiment_487_gpu_vram_gate_v2.json\n7.\
    \ Write tests/python/test_gpu_vram_gate_v2.py (100% coverage).\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: update ops/conductor-log.md\
    \ (RETRO-044 root cause fix shipped), ops/status.md, ops/changelog.md, _bmad/traceability.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"

