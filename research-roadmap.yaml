tasks:
  - id: exp3012-archive-v282-activate-v283
    milestone: "2026.05.283"
    deliverable: "results/experiment_3012_archive_v282_activate_v283.json"
    title: "Archive .282 and activate .283"
    priority: critical
    max_turns: 20
    estimated_wall_time_min: 10
    track: "archive"
    inference_substrate: "aggregation_from_upstream_artifacts"
    prior_failures:
      - experiment_id: exp3000-archive-v281-activate-v282
        verdict: "complete: archive_ready=true; archived_milestone=2026.05.281; activated_milestone=2026.05.282; status_updates_written=false"
        addressed_by: "Same archive pattern applied to the completed .282 artifact chain and .283 staged roadmap, with explicit carry-forward of flagged, blocked, gated-skipped, and false-positive aggregation rows."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Project root placeholder: {project_root}. Run date placeholder: {date}. The current milestone 2026.05.282 has completed. The authority artifact is results/experiment_3011_capstone_v282.json, and the next staged milestone is 2026.05.283. Treat missing, flagged, blocked, gated-skipped, and adversarially flagged .282 artifacts honestly; do not repair historical results.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - CODEX.md
      - research-roadmap.yaml
      - research-roadmap-next.yaml
      - research-complete.yaml
      - scripts/experiment_template.py
      - scripts/research_conductor.py for archive behavior only; do not modify it
      - ops/status.md
      - ops/changelog.md
      - results/experiment_3010_cross_corpus_matrix_v16.json
      - results/experiment_3011_capstone_v282.json

      TASK:
      Archive milestone 2026.05.282 into research-complete.yaml, update ops/status.md and ops/changelog.md with the activation result, and emit a terminal archive artifact for .283 activation. Do not alter research-roadmap.yaml.

      CONCRETE STEPS:
      1. Confirm research-roadmap-next.yaml declares milestone 2026.05.283 and has non-empty tasks.
      2. Read all .282 result artifacts referenced by exp3011 and summarize clean, flagged, blocked, gated-skipped, projection-only, pilot-only, missing, and adversarially flagged counts.
      3. Append the completed .282 task list and capstone outcome to research-complete.yaml using the existing archive style.
      4. Update ops/status.md and ops/changelog.md with a concise .282 archive/.283 activation note.
      5. Write results/experiment_3012_archive_v282_activate_v283.json with inference_substrate=aggregation_from_upstream_artifacts and no top-level model_specs.
      6. Run YAML parsing and the relevant roadmap/pre-activation validation commands available in scripts/.

      REQUIRED ARTIFACT FIELDS:
      - archive_ready: bool (principle: activation must be explicit and machine-checkable)
      - archived_milestone: str (principle: archive target must be unambiguous)
      - activated_milestone: str (principle: next milestone must match research-roadmap-next.yaml)
      - research_complete_updated: bool (principle: completed experiments must be discoverable by future planners)
      - status_updates_written: bool (principle: ops docs must reflect milestone state)
      - n_tasks_archived: int (principle: archive completeness must be countable)
      - blocked_or_flagged_rows_carried_forward: list (principle: unresolved work must not be hidden)
      - adversarial_flags_carried_forward: list (principle: false-positive and true-positive audit flags must remain visible)
      - inference_substrate: str (principle: aggregation must not masquerade as live inference)
      - validation_commands: list (principle: validation claims must name the commands run)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped:/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3013-sota-gguf-logprob-telemetry-preflight
    milestone: "2026.05.283"
    deliverable: "results/experiment_3013_sota_gguf_logprob_telemetry_preflight_v1.json"
    title: "SOTA GGUF logprob telemetry preflight"
    priority: critical
    model: opus
    requires_claude: true
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 75
    track: "infrastructure"
    inference_substrate: "live_llm_inference"
    prior_failures:
      - experiment_id: exp3001-sota-gguf-cache-carry-forward-checksum-refresh
        verdict: "success: at least one mandated headline SOTA GGUF produced a live transcript"
        addressed_by: "Extends the successful cache refresh with logprob/top-k telemetry capability checks needed for Cactus-style acceptance; it does not broaden headline model claims."
        retire_if_same_verdict: true
      - experiment_id: exp2989-sota-gguf-cache-provenance-preflight
        verdict: "success: at least one mandated headline SOTA GGUF produced a live transcript"
        addressed_by: "Keeps SOTA runtime evidence isolated as an upstream gate, now with explicit telemetry capability fields before repair reruns."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Project root placeholder: {project_root}. Run date placeholder: {date}. Exp3001 proved at least one mandated local SOTA GGUF can run live. Exp3016 needs not only transcript readiness but also honest telemetry about whether the local loader exposes top-k/logprob data for Cactus-style constrained acceptance.

      MODEL_SPECS:
      - headline_models:
        - unsloth/Qwen3.6-35B-A3B-GGUF
        - unsloth/gemma-4-31B-it-GGUF
        - unsloth/gemma-4-26B-A4B-it-GGUF
      - smoke_only_models:
        - Qwen/Qwen3.5-0.8B
        - unsloth/gemma-4-E4B-it-GGUF
      - Use python/carnot/inference/sota_models.py and the cached_sota_pair() pattern when applicable.
      - A headline SOTA result requires at least one headline model to produce a real transcript with cache/provenance fields.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - scripts/experiment_template.py
      - scripts/experiment_3001_sota_gguf_cache_carry_forward_checksum_refresh_v1.py
      - python/carnot/inference/sota_models.py
      - python/carnot/inference/
      - results/experiment_3001_sota_gguf_cache_carry_forward_checksum_refresh_v1.json
      - research-references.md

      TASK:
      Refresh SOTA GGUF readiness and determine whether top-k/logprob telemetry is available from the current local loader path. Emit a terminal blocked artifact if no headline model can run. Do not substitute legacy small models for headline readiness.

      CONCRETE STEPS:
      0. PRECONDITIONS: record CUDA/GPU availability, free VRAM if available, repo commit, Python environment, cache paths, and checksum feasibility before any model load. If no mandated headline model can load, write honest_verdict blocked_sota_headline_model_unavailable and stop.
      1. Add a focused exp3013 script under scripts/ following scripts/experiment_template.py.
      2. Attempt the mandated headline models with conservative prompts and timeouts.
      3. For each attempted model, record exact model id, local cache path, checksum evidence when available, load status, generation status, duration, transcript path/hash, and whether logits/top-k/logprobs are exposed.
      4. If top-k/logprob telemetry is unavailable but transcript generation works, set sota_headline_ready=true and sota_logprob_ready=false; do not fabricate telemetry.
      5. If no headline model runs, optionally run a legacy small smoke test but label it smoke_only and set headline fields false.
      6. Write the JSON artifact and run the new script plus any relevant import checks.

      REQUIRED ARTIFACT FIELDS:
      - sota_headline_ready: bool (principle: downstream headline tasks must gate on real SOTA availability)
      - sota_logprob_ready: bool (principle: Cactus-style acceptance must know whether token telemetry exists)
      - preconditions_checked: bool (principle: compute-bound failures must distinguish environment from method failure)
      - model_specs: dict (principle: model identity must be explicit)
      - headline_models_attempted: list (principle: failed availability must be auditable)
      - headline_models_available: list (principle: successful availability must be auditable)
      - telemetry_capabilities: dict (principle: logprob/top-k claims must be tied to observed loader behavior)
      - cache_paths: dict (principle: model provenance must be local and inspectable)
      - model_checksums: dict (principle: repeated runs must be tied to exact artifacts when feasible)
      - live_transcript_paths: list (principle: live inference claims require replayable output evidence)
      - legacy_smoke_only_used: bool (principle: small models must not become headline evidence)
      - inference_substrate: str (principle: substrate claims must match actual execution)
      - duration_s: float (principle: impossible-duration artifacts must be catchable)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped:/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3014-repair-syntax-schema-failure-taxonomy
    milestone: "2026.05.283"
    deliverable: "results/experiment_3014_repair_syntax_schema_failure_taxonomy_v1.json"
    title: "Repair syntax and schema failure taxonomy"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 50
    estimated_wall_time_min: 45
    track: "code_repair"
    inference_substrate: "verifier_ensemble_against_cached_candidates"
    prior_failures:
      - experiment_id: exp3003-gated-sota-repair-metamorphic-false-accept-rerun
        verdict: "flagged: metamorphic repair rerun did not clear gates"
        addressed_by: "Diagnoses syntax/schema regression root causes before another live rerun, separating prompt, parser, oracle, and model-output failure modes."
        retire_if_same_verdict: true
      - experiment_id: exp3002-metamorphic-repair-oracle-audit
        verdict: "flagged: metamorphic oracle ready; downstream repair promotion must rerun against it"
        addressed_by: "Uses the oracle as an audit substrate while making its gate role explicit and non-headline."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Project root placeholder: {project_root}. Run date placeholder: {date}. Exp3003 improved pass rate but raised syntax_failure_rate_delta and schema_failure_rate_delta by 0.5. Before rerunning live repair, classify the failures precisely. HalluGuard's data-driven versus reasoning-driven split may be used as taxonomy language only; do not claim NTK/HalluGuard implementation.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - research-references.md
      - scripts/experiment_3002_metamorphic_repair_oracle_audit_v1.py
      - scripts/experiment_3003_gated_sota_repair_metamorphic_false_accept_rerun_v1.py
      - results/experiment_3002_metamorphic_repair_oracle_audit_v1.json
      - results/experiment_3003_gated_sota_repair_metamorphic_false_accept_rerun_v1.json
      - datasets/repair_hard/manifest_v1.jsonl if present
      - python/carnot/
      - tests/

      TASK:
      Build a deterministic repair-failure taxonomy for exp3003 candidates and validators. Classify syntax, schema, false-accept, tautology, oracle, and intent-preservation failures without running live LLM inference.

      CONCRETE STEPS:
      1. Add a focused exp3014 script following scripts/experiment_template.py.
      2. Load exp3002/exp3003 manifests, candidate transcripts, verifier logs, and any cached patches.
      3. Re-run deterministic parsers and validators over cached candidates only.
      4. Classify failures by root cause: prompt-format pressure, parser/schema mismatch, invalid patch shape, oracle ambiguity, intent drift, false accept, or tautology.
      5. Produce a minimal fix plan for exp3015/exp3016 acceptance gates; do not edit production repair code unless a tiny parser fixture is needed for deterministic reproduction.
      6. Write the artifact and any taxonomy table under results/ or datasets/repair_hard/.

      REQUIRED ARTIFACT FIELDS:
      - repair_failure_taxonomy_ready: bool (principle: downstream controller must gate on diagnosed failure modes)
      - taxonomy_table_path: str (principle: failure classifications must be inspectable)
      - n_cached_candidates_audited: int (principle: sample size must be explicit)
      - syntax_failure_count: int (principle: syntax regressions must be counted)
      - schema_failure_count: int (principle: schema regressions must be counted)
      - false_accept_count: int (principle: verifier safety regressions must be counted)
      - tautology_failure_count: int (principle: vacuous wins must be counted)
      - intent_drift_count: int (principle: repair must preserve user intent)
      - recommended_acceptance_rules: list (principle: exp3015 needs concrete rules)
      - halluguard_ntk_claim_made: bool (principle: taxonomy reuse must not become dishonest NTK naming)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped:/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3015-cactus-style-repair-acceptance-controller
    milestone: "2026.05.283"
    deliverable: "results/experiment_3015_cactus_style_repair_acceptance_controller_v1.json"
    title: "Cactus-style repair acceptance controller"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 50
    estimated_wall_time_min: 60
    track: "code_repair"
    inference_substrate: "verifier_ensemble_against_cached_candidates"
    gated_on:
      - upstream: exp3014-repair-syntax-schema-failure-taxonomy
        artifact_field: repair_failure_taxonomy_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3003-gated-sota-repair-metamorphic-false-accept-rerun
        verdict: "flagged: metamorphic repair rerun did not clear gates"
        addressed_by: "Builds an offline constrained-acceptance controller before rerunning live repair, explicitly targeting syntax/schema regressions and false accepts."
        retire_if_same_verdict: true
      - experiment_id: exp2991-gated-sota-intent-preserving-repair-hard-set
        verdict: "flagged: hard-set repair did not clear promotion gates"
        addressed_by: "Adds Cactus-style bounded acceptance over verifier outcomes instead of accepting every schema-shaped candidate."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Project root placeholder: {project_root}. Run date placeholder: {date}. Cactus frames acceptance as constrained optimization: accept more candidate tokens only under controlled divergence from the verifier distribution. Carnot's use is narrower: accept or reject repair candidates using cached deterministic verifier evidence, not speculative decoding throughput.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - research-references.md
      - results/experiment_3014_repair_syntax_schema_failure_taxonomy_v1.json
      - results/experiment_3003_gated_sota_repair_metamorphic_false_accept_rerun_v1.json
      - results/experiment_3002_metamorphic_repair_oracle_audit_v1.json
      - scripts/experiment_3003_gated_sota_repair_metamorphic_false_accept_rerun_v1.py
      - python/carnot/
      - tests/

      TASK:
      Build an offline repair-candidate acceptance controller over cached exp3003 candidates and metamorphic variants. The controller should reject candidates that improve pass rate only by increasing syntax/schema failures, false accepts, or tautology exposure.

      CONCRETE STEPS:
      1. Add a focused exp3015 script following scripts/experiment_template.py.
      2. Load cached candidates, taxonomy rows, verifier outcomes, and metamorphic oracle results.
      3. Define acceptance features from deterministic evidence: syntax/schema validity, false-accept probe result, tautology probe result, intent drift class, pass/fail on original and metamorphic variants, and optional telemetry if present.
      4. Fit or grid-search a tiny transparent accept/reject rule; no black-box LLM judge is allowed.
      5. Evaluate against baseline accept-all and conservative accept-only-clean policies.
      6. Write controller config, rejected-candidate table, and artifact with promotion gate fields.

      REQUIRED ARTIFACT FIELDS:
      - acceptance_controller_ready: bool (principle: live rerun must gate on a usable controller)
      - controller_config_path: str (principle: accept/reject policy must be inspectable)
      - n_candidates_evaluated: int (principle: sample size must be explicit)
      - false_accept_delta_offline: float (principle: controller must not increase false accepts)
      - syntax_failure_delta_offline: float (principle: controller must not promote syntax regressions)
      - schema_failure_delta_offline: float (principle: controller must not promote schema regressions)
      - pass_at_1_delta_offline: float (principle: usefulness must be measured against baseline)
      - rejected_candidate_table_path: str (principle: rejection decisions must be auditable)
      - llm_judge_used: bool (principle: LLM judgments must not become verifier authority)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped:/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3016-sota-repair-rerun-with-acceptance-controller
    milestone: "2026.05.283"
    deliverable: "results/experiment_3016_sota_repair_rerun_with_acceptance_controller_v1.json"
    title: "SOTA repair rerun with acceptance controller"
    priority: critical
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 120
    track: "code_repair"
    inference_substrate: "live_llm_inference"
    gated_on:
      - upstream: exp3013-sota-gguf-logprob-telemetry-preflight
        artifact_field: sota_logprob_ready
        op: "=="
        value: true
      - upstream: exp3015-cactus-style-repair-acceptance-controller
        artifact_field: acceptance_controller_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3003-gated-sota-repair-metamorphic-false-accept-rerun
        verdict: "flagged: metamorphic repair rerun did not clear gates"
        addressed_by: "Reruns only after SOTA telemetry and offline acceptance-controller gates pass, with syntax/schema deltas treated as first-class blockers."
        retire_if_same_verdict: true
      - experiment_id: exp2991-gated-sota-intent-preserving-repair-hard-set
        verdict: "flagged: hard-set repair did not clear promotion gates"
        addressed_by: "Uses a controller built from exp3014/exp3015 instead of repeating the same hard-set acceptance policy."
        retire_if_same_verdict: true
      - experiment_id: exp2977-sota-intent-preserving-code-repair
        verdict: "blocked_cached_sota_pair_unavailable_cpu_smoke_only"
        addressed_by: "Uses exp3013 as a structured SOTA telemetry gate so CPU smoke cannot become headline evidence."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Project root placeholder: {project_root}. Run date placeholder: {date}. This is the .283 live repair claim-repair attempt. It may run only after exp3013 reports SOTA telemetry readiness and exp3015 reports an acceptance controller. Promotion requires clean false-accept, tautology, syntax/schema, and provenance evidence.

      MODEL_SPECS:
      - headline_models:
        - unsloth/Qwen3.6-35B-A3B-GGUF
        - unsloth/gemma-4-31B-it-GGUF
        - unsloth/gemma-4-26B-A4B-it-GGUF
      - smoke_only_models:
        - Qwen/Qwen3.5-0.8B
        - unsloth/gemma-4-E4B-it-GGUF
      - Use cached_sota_pair() or the current repo-local SOTA cache helper.
      - At least one headline model must produce live results for headline_result=true.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - scripts/experiment_3003_gated_sota_repair_metamorphic_false_accept_rerun_v1.py
      - python/carnot/inference/sota_models.py
      - results/experiment_3013_sota_gguf_logprob_telemetry_preflight_v1.json
      - results/experiment_3015_cactus_style_repair_acceptance_controller_v1.json
      - results/experiment_3014_repair_syntax_schema_failure_taxonomy_v1.json
      - results/experiment_3003_gated_sota_repair_metamorphic_false_accept_rerun_v1.json
      - datasets/repair_hard/manifest_v1.jsonl if present

      TASK:
      Rerun local SOTA GGUF repair on the hard set and metamorphic variants using the acceptance controller. Compute pass@1/pass@k, syntax/schema failure, false-accept, and tautology deltas. If gates or preconditions fail, emit a terminal blocked artifact.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify exp3013.sota_logprob_ready=true, exp3015.acceptance_controller_ready=true, CUDA/cache status, model checksum availability, controller config availability, and hard-set integrity. If any precondition fails, write a blocked_* artifact and stop.
      1. Add a focused exp3016 script following scripts/experiment_template.py.
      2. Load the original hard-set manifest, metamorphic manifest, and acceptance-controller config; run baseline validators before live LLM repair.
      3. Generate repair candidates with at least one mandated headline model; preserve prompt, draft intent, failing trace, final patch, duration, transcript hash, and telemetry if available.
      4. Apply the acceptance controller before final promotion; execute deterministic tests for every accepted and rejected candidate.
      5. Compute deltas against baseline, exp3003, and accept-all where comparable, keeping small-model smoke data separate.
      6. Set repair_controller_clean=false if false accepts rise, tautology probes pass vacuously, schema/syntax failures rise, n_tasks is too small, or only smoke models ran.
      7. Write candidate patches, verifier logs, transcripts, telemetry summaries, and the JSON artifact.

      REQUIRED ARTIFACT FIELDS:
      - repair_controller_clean: bool (principle: the repair row must be machine-gated)
      - headline_result: bool (principle: SOTA claim must be separate from smoke evidence)
      - preconditions_checked: bool (principle: compute-bound failures must distinguish setup from method failure)
      - n_tasks: int (principle: sample size must be explicit)
      - n_metamorphic_variants: int (principle: methodology amplification must be explicit)
      - model_specs: dict (principle: model identities must match mandated GGUFs)
      - headline_models_used: list (principle: SOTA evidence requires actual headline models)
      - model_checksums: dict (principle: live model identity must be durable)
      - acceptance_controller_config_path: str (principle: acceptance policy must be auditable)
      - pass_at_1_delta: float (principle: usefulness must be measured against baseline)
      - pass_at_k_delta: float (principle: multiple candidates must not hide pass@1 regression)
      - false_accept_delta: float (principle: verifier safety must not regress)
      - tautology_gate_clean: bool (principle: vacuous wins must not promote)
      - syntax_failure_rate_delta: float (principle: repair must not trade correctness for parse failures)
      - schema_failure_rate_delta: float (principle: repair must not trade correctness for schema failures)
      - live_transcript_paths: list (principle: live inference claims require replayable output)
      - verifier_log_paths: list (principle: correctness claims require executable evidence)
      - inference_substrate: str (principle: live inference must be explicit)
      - duration_s: float (principle: live model runs must report wall-clock duration)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped:/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3017-nsvif-instruction-validator-tree-expansion
    milestone: "2026.05.283"
    deliverable: "results/experiment_3017_nsvif_instruction_validator_tree_expansion_v1.json"
    title: "NSVIF instruction validator-tree expansion"
    priority: high
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 50
    estimated_wall_time_min: 60
    track: "solver_verification"
    inference_substrate: "verifier_ensemble_against_cached_candidates"
    prior_failures:
      - experiment_id: exp3005-solver-to-validator-tree-expansion
        verdict: "ready: expanded deterministic validator-tree corpus exact-checked"
        addressed_by: "Expands the clean validator-tree line into instruction-following constraints, keeping exact validators as authority."
        retire_if_same_verdict: true
      - experiment_id: exp2994-prompt-validator-dialogue-schema
        verdict: "complete: prompt-validator dialogue protocol ready with deterministic exact checks"
        addressed_by: "Moves from protocol readiness to NSVIF-style instruction constraint coverage with concrete validator trees."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Project root placeholder: {project_root}. Run date placeholder: {date}. NSVIF models instruction-following verification as constraint satisfaction. Carnot should test a small instruction-validator expansion using exact checks where possible and explicit semantic-boundary labels where exact checks are not possible.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - research-references.md
      - scripts/experiment_3005_solver_to_validator_tree_expansion_v1.py
      - scripts/experiment_2994_prompt_validator_dialogue_schema_v1.py
      - results/experiment_3005_solver_to_validator_tree_expansion_v1.json
      - results/experiment_2994_prompt_validator_dialogue_schema_v1.json
      - python/carnot/
      - tests/

      TASK:
      Expand the deterministic validator-tree corpus with at least 20 small instruction-following items. Use Z3/runtime/string/AST validators when possible; do not use LLM-as-judge labels as verifier authority.

      CONCRETE STEPS:
      1. Add a focused exp3017 script following scripts/experiment_template.py.
      2. Select or synthesize instruction-following items with explicit constraints: required fields, forbidden tokens, ordering constraints, numeric bounds, simple transformations, and code/runtime invariants.
      3. Build validator trees with exact-check nodes and mark any semantic-only node as non-authoritative.
      4. Execute all validators and save transcripts/hashes.
      5. Reject items with ambiguous instructions, nondeterministic validators, or LLM-only labels.
      6. Write the artifact and any manifest files with clear paths.

      REQUIRED ARTIFACT FIELDS:
      - instruction_validator_tree_ready: bool (principle: downstream frontier certificate must gate on a real corpus)
      - validator_manifest_path: str (principle: expanded corpus must be inspectable)
      - n_instruction_items: int (principle: sample size must be explicit)
      - n_validator_trees: int (principle: tree count must be explicit)
      - exact_check_coverage: float (principle: semantic-only labels must not be hidden)
      - all_authoritative_nodes_exact_checked: bool (principle: verifier authority must be executable)
