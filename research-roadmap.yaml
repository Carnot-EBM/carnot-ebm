           sweep coverage 100%->0%, plot selective risk (error among the kept) vs coverage; compute AURC +
           risk at fixed coverages (e.g. 50%, 80%, 90%) + the coverage achievable at a target risk (e.g.
           5% error). 5 seeds, CI.
        2. Build the SAME risk-coverage curve for the entropy / self-certainty baseline on the SAME corpus.
