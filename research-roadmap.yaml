  prompt: "CONTEXT: arXiv submission has been unblocked by two changes this milestone:\n  1. exp2544: Phase 4 §4 honest negative subsection written (phase4_honest_negative_documented=True)\n  2. exp2536 (prior milestone): LaTeX compiles; abstract 205 words.\n\nGATE-3 REDEFINITION (per .245 planning doc):\n  Old gate-3: phase4_validated_any == True\n  New gate-3: phase4_resolved = (phase4_validated_any == True OR phase4_honest_negative_documented == True)\n  Rationale: a fully documented honest negative result satisfies the scientific standard. Per\n  CLAUDE.md Adversarial Artifact Verification: negative results with methodology documentation\n  are paper-citable findings.\n\nFOUR GATES (as redefined for .245):\n  gate_1_phase1_ship: True (PyPI package shipped, Apache-2.0)\n  gate_2_audit: True (paper integrity audit passed exp2468 + exp2479)\n  gate_3_phase4_resolved: True IF phase4_honest_negative_documented=True (from exp2544)\n  gate_4_auroc_adversarially_verified: True (0.9750 from exp2498, replicated 5 seeds)\n\nFULL OPERATOR-ONLY SUBMISSION RULE: This task PREPARES the package and produces a checklist\nfor OPERATOR to submit. Per CLAUDE.md Operator-Only External Publication rule, this task\nNEVER runs 'arxiv submit' or equivalent. Submission is OPERATOR-ONLY.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/docs/arxiv-paper/main.tex\n  {project_root}/results/experiment_2544_phase4_option_b.json (phase4_honest_negative_documented)\n  {project_root}/results/experiment_2536_latex_compile_fix.json (latex_compile_success, abstract_word_count)\n  {project_root}/results/experiment_2552_paper_writethrough.json (paper_updated)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. ls {project_root}/docs/arxiv-paper/main.tex\n        If not found: write honest_verdict 'blocked_paper_not_found' and exit.\n     b. Check tectonic/pdflatex available:\n        command -v tectonic || command -v pdflatex\n  1. Read phase4_honest_negative_documented from exp2544 artifact.\n     Compute gate_3_phase4_resolved = (phase4_honest_negative_documented == True).\n  2. Compile paper:\n     If tectonic available: cd {project_root}/docs/arxiv-paper && tectonic main.tex\n     Elif pdflatex available: cd {project_root}/docs/arxiv-paper && pdflatex -interaction=nonstopmode main.tex\n     Set latex_compile_success=(exit_code == 0).\n  3. Count abstract words:\n     python3 -c \"import re; t=open('docs/arxiv-paper/main.tex').read(); ab=re.search(r'\\\\\\\\begin\\{{abstract\\}}(.+?)\\\\\\\\end\\{{abstract\\}}',t,re.DOTALL); print(len(ab.group(1).split()) if ab else 'not_found')\"\n     Set abstract_word_count.\n  4. Compute arxiv_ready = (latex_compile_success AND abstract_word_count <= 250 AND\n        gate_1_phase1_ship AND gate_2_audit AND gate_3_phase4_resolved AND\n        gate_4_auroc_adversarially_verified).\n  5. Set submission_package_ready = arxiv_ready.\n  6. Produce operator_submission_checklist:\n     - [ ] Review the 4/delta citation in §3 (arXiv:2512.02080)\n     - [ ] Confirm §4 Phase 4 honest negative accurately represents experiments exp2486/exp2508/exp2519/exp2532\n     - [ ] Confirm best_AUROC=0.9750 in abstract and results section\n     - [ ] Confirm author list and affiliation are correct\n     - [ ] Submit to arXiv at arxiv.org/submit (category: cs.AI, cs.LG)\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - arxiv_ready:\n      principle: \"True if all 4 gates satisfied. This is the PRIMARY output of the entire .240-.245 research track.\"\n  - submission_package_ready:\n      principle: \"True if mechanically ready for operator submission. Distinct from arxiv_ready (mechanical vs gate-based).\"\n  - gate_3_phase4_resolved:\n      principle: \"True if phase4_validated_any OR phase4_honest_negative_documented. Redefined gate for Option B path.\"\n  - latex_compile_success:\n      principle: \"Must be True — arXiv's LaTeX compiler is strict.\"\n  - abstract_word_count:\n      principle: \"Must be <= 250 for arXiv.\"\n  - operator_submission_checklist:\n      principle: \"Concrete operator action items before submission — prevents accidental submission without review.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"arxiv_ready == true\"\n    principle: \"The primary milestone success criterion. If all 4 gates met including the redefined gate-3, the paper is ready for operator submission.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

