  - id: exp1697-glorokan-robustness
    title: "Exp 1697: GloroKAN B-spline local Lipschitz bounds for KArAt"
    deliverable: python/carnot/models/kan/glorokan_robustness.py
    agent_type: codex
    prompt: >
      CONTEXT: The recent ICLR 2026 GloroKAN paper shows KANs can achieve provable robustness using B-spline properties.
      EXISTING CODE TO READ FIRST: `python/carnot/models/kan/karat.py`
      TASK: Implement a GloroKAN-style forward-pass local Lipschitz bound calculator for our KArAt model.
      CONCRETE STEPS:
      1. Implement `GloroKANBounder` in `python/carnot/models/kan/glorokan_robustness.py`.
      2. Add a test suite.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1698-glorokan-ablation
    title: "Exp 1698: Ablation study of GloroKAN robustness vs MILP bounds"
    deliverable: results/experiment_1698_glorokan.json
    gated_on:
      - upstream: exp1697-glorokan-robustness
        artifact_field: test_coverage
        op: '>='
        value: 0.9
    prompt: >
      CONTEXT: We need to compare the new GloroKAN bounds against the MILP bounds from milestone .130.
      EXISTING CODE TO READ FIRST: `python/carnot/models/kan/glorokan_robustness.py`
      TASK: Run an ablation over 50 cases comparing bounding speed and tightness.
      CONCRETE STEPS:
      1. Write an evaluation script using both bounders.
      2. Output `{project_root}/results/experiment_1698_glorokan.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

