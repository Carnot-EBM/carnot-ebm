    track: research
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3718_risk_coverage_abstention_characterization.json
    prompt: |
      CONTEXT: Carnot's verifier ensemble has PROVEN per-step DISCRIMINATION (FoVer AUROC 0.9131, frozen
      headline). The SELECTION conversion (best-of-N argmax beats self-consistency) is settled-NEGATIVE and
      the diagnosis is CLOSED (exp3707) -- DO NOT re-run a selection experiment. This task tests the OTHER
      conversion: discrimination -> SELECTIVE PREDICTION / ABSTENTION. The shipped "second pair of eyes"
      detector is now math-only-with-abstain (exp3706); its deployable value is "flag/abstain on
      likely-wrong steps", which is the project's on-mission goal (escape hallucinations). The right metric
      is the RISK-COVERAGE curve (AURC) and risk@coverage operating points, NOT a single AUROC and NOT
      best-of-N. arXiv:2603.21172 ("Entropy Alone is Insufficient for Safe Selective Prediction") shows
      entropy/uncertainty heuristics FAIL as selective-prediction signals -- so the open question is
      whether the ENERGY signal is a BETTER selective-prediction signal than entropy / self-certainty on
      the SAME FoVer step corpus. This is genuinely new (never characterized) and explicitly NOT the closed
      selection question. FORWARD DIFF vs exp3684 (which found the detector's product value robust over
      self-certainty on math): exp3684 was a single win/lose product-value comparison; THIS task measures
      the full risk-coverage OPERATING ENVELOPE (AURC + risk@coverage curve), which exp3684 never produced
      — a deployable abstention envelope, not a single comparison point.
      EXISTING CODE TO READ FIRST: results/experiment_2850_fover_dual_condition_integrity_v4.json +
      results/experiment_2837 (the frozen 0.9131 discriminator + per-step scores) and results/experiment_3706
      (the shipped math-only-with-abstain detector + its math operating point) and results/experiment_3684
      (the self-certainty baseline comparison) via scripts/summarize_artifact.py;
      python/carnot/pipeline/second_pair_detector.py; research-references.md "Entropy Alone is Insufficient
      (arXiv:2603.21172)" + "SelectLLM ... AURC" + "I-CALM (arXiv:2604.03904)" + "Conformal Abstention
      Policies (arXiv:2502.06884)".
      PRECONDITIONS (step 0): the FoVer per-step verifier scores + labels loadable (cached); a per-step
      entropy / self-certainty baseline computable on the SAME corpus. If the per-step scores are not on
      disk -> "complete: blocked_fover_perstep_scores_unavailable".
      INFERENCE-SUBSTRATE HYGIENE: verifier_ensemble_against_cached_candidates; NO GGUF/CUDA marker;
      adversarial_verify clean. LEAK-GUARD: if the energy AURC implies an AUROC >= 0.99 on n>=1000, treat
