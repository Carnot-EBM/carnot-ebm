      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    NGRPO (arXiv:2509.18851, Negative-enhanced GRPO) introduces Advantage
    Calibration via a virtual max-reward sample. When all rollouts in a group
    receive the same reward (e.g., all UNKNOWN → reward=0), ResZero produces
    zero-mean advantage and no gradient signal. NGRPO injects a virtual sample
    with reward=max_reward to break the symmetry. This CPU-only theory probe
    simulates NGRPO on the actual rollout data from exp1383 (all rollouts UNKNOWN,
    all rewards=0) to verify that Advantage Calibration would have produced
    non-zero advantage gradients — providing theoretical validation before the
    DualGPU run in exp1393. Use {project_root} as the project root and
    {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - results/experiment_1383_grpo_v7_jury_rl_formal_verifier_rewards.json

    TASK:
    Simulate NGRPO Advantage Calibration on the exp1383 rollout data (all UNKNOWN).
    Verify that virtual max-reward sample injection produces non-zero advantages.
    CPU-only mathematical simulation — no model inference.

    REQUIRED ARTIFACT FIELDS:
    - status
    - exp1383_rollout_data_used
    - original_resZero_advantage_variance
    - ngrpo_virtual_sample_reward
    - ngrpo_augmented_advantage_variance
    - ngrpo_advantage_calibration_verified
    - ngrpo_expected_gradient_magnitude
