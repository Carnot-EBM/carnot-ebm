      - experiment_id: exp2952
        verdict: "complete: taxonomy-guided repair delta passed; pass@1_delta=0.25, syntax_failure_rate_delta=-0.0625, false_accept_delta=-0.125"
        addressed_by: "The prior small-N positive result is treated as seed evidence only; the new protocol pre-registers n>=20 and trace-backed gates."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Run from {project_root} on {date}. .279 proved DCCD infrastructure but
        the live repair rerun regressed. The post-.279 research sweep found
        AdapTrack, TraceCoder, Thinking Before Constraining, and backtracking
        constrained-decoding ideas that directly address this failure mode.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (SOTA Local Models; Failed-Experiment Rerun Discipline)
        - CODEX.md
        - research-program.md (Continuous Self-Learning)
        - research-references.md (2026-05-24 Post-.279 Planning Sweep)
        - scripts/experiment_template.py (cached_sota_pair docstring)
        - results/experiment_2963_dccd_repair_protocol_manifest_v1.json
        - results/experiment_2964_sota_dccd_repair_replication_v1.json
        - results/experiment_2952_sota_taxonomy_guided_code_repair_eval_v1.json
        - results/experiment_2953_code_verifier_threshold_policy_v1.json

      TASK:
        Build a pre-registered intent-preserving code-repair protocol for the
        downstream SOTA rerun. It must keep the model's draft intent, apply
        constraints with repair/backtracking, collect runtime traces, and define
        deterministic acceptance gates that prevent the .279 schema-collapse
        failure from being mistaken for progress.

      CONCRETE STEPS:
        0. PRECONDITIONS: .279 repair artifacts exist and research-references.md
           contains the post-.279 sweep entries.
        1. Compare exp2963 and exp2964 to identify which DCCD fields correlated
           with schema failures, syntax failures, false accepts, and pass-rate
           regression.
        2. Design a repair manifest schema with draft_intent, constrained_patch,
           backtracking_steps, execution_trace, verifier_result,
           schema_result, syntax_result, false_accept_audit, and acceptance_reason.
        3. Define a downstream evaluation plan over at least 20 repair tasks:
           baseline, schema-only DCCD, intent-preserving DCCD, and trace-aware
           repair.
        4. Include mandatory MODEL_SPECS guidance: call cached_sota_pair() first
           and require at least one of unsloth/Qwen3.6-35B-A3B-GGUF,
           unsloth/gemma-4-31B-it-GGUF, or
           unsloth/gemma-4-26B-A4B-it-GGUF for headline results. Legacy small
           models are CPU smoke tests only.
        5. Write the protocol artifact with clear pass/fail gates for exp2977.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        intent_preserving_repair_protocol_ready: bool
        trace_execution_plan_ready: bool
        downstream_min_tasks: int
        required_model_specs: list
        mandatory_headline_model_ids: list
        legacy_model_policy: str
        baseline_conditions: list
