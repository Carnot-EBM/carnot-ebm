        addressed_by: "exp3602 blocked because no labeled code corpus was loadable and the execution-applicable verifiers never scored. This task BUILDS the labeled code corpus from the EXISTING results/experiment_1999_code_verification_humaneval.json (per-candidate correctness labels) and explicitly WIRES the four execution-applicable verifiers to score completions, asserting n_scored>0 and score-variance>0 BEFORE reporting any transfer number. New corpus + new verifier wiring + a headroom check = a runnable test."
        retire_if_same_verdict: false
    milestone: "2026.06.334"
    title: "Build the labeled CODE corpus from exp1999 + make the execution-applicable verifiers actually FIRE + math->code PRM-transfer stress-test (arXiv:2506.00027 vs ThinkPRM arXiv:2504.16828)"
    priority: critical
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # gemini quota exhausted crashed the .333 version (exp3626); multi-file verifier wiring; codex 0.135.0 verified working; requires_codex bypasses GEMINI_FORCE
    estimated_wall_time_min: 24
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3641_code_corpus_verifiers_fire_transfer_v3.json
    prompt: |
      CONTEXT: the code row has never produced a real result -- no labeled corpus, verifiers inert. This task
      makes the code apparatus REAL and runs the literature's positive control: arXiv:2506.00027 found
      math-trained PRMs transfer to code AS WELL AS OR BETTER than code-trained PRMs (HumanEval+ best-of-8:
      PRM-Math 91.5% vs PRM-Code 89.0%); ThinkPRM (arXiv:2504.16828) is the counter-hypothesis (discriminative
      verifiers are OOD-fragile). Does the FoVer-math-derived verifier signal transfer to CODE on Carnot?
      VERIFIER AUTHENTICITY (CLAUDE.md -- MANDATORY): the execution-applicable verifiers must actually
      execute/parse the candidate code, not return a constant. NULL DISCIPLINE (FALSE_NEGATIVE_RISK): a "does
      not transfer" verdict is only trustworthy if the corpus has headroom (confidence/SC baseline materially
      < 1.0) AND the verifiers fired (n_scored>0, variance>0).
      EXISTING CODE TO READ FIRST: results/experiment_1999_code_verification_humaneval.json + its corpus
      (baseline 0.66 -> repair 0.84) via scripts/summarize_artifact.py; the four code-applicable verifiers under
      python/carnot/verify/ -- controlled_invariance_executor_v2.py, executable_monitor_runtime_adapter.py,
      ast_structure_verifier.py, code_structural_dependency_verifier.py.
      PRECONDITIONS (step 0):
        a. results/experiment_1999_code_verification_humaneval.json present with per-candidate correctness
           labels (or MBPP/LiveCodeBench if on disk). If none -> "complete: blocked_no_labeled_code_corpus".
        b. The four code-applicable verifiers importable; record any import-inert verifier and continue.
      CONCRETE STEPS:
        1. Assemble the labeled code corpus from exp1999 (>= 50 candidates with correctness labels). Persist
           data/code_verification_corpus_v1.jsonl with {candidate_code, label, test_outcome}.
        2. Score the four execution-applicable verifiers on each candidate. ASSERT they fired: code_verifiers_
           fire = (n_scored > 0 AND score variance > 0). If they do not fire, DIAGNOSE why (interface mismatch?
           sandbox?) and report code_verifiers_fire=false honestly -- do NOT fabricate scores.
        3. Score the FoVer-math-derived verifier signal on the SAME corpus; error-detection AUROC + >=3 seeds +
           CI. Compute the confidence/SC baseline AUROC (the headroom check).
        4. Report the transfer delta vs the +4-8pt arXiv:2506.00027 anchor and which hypothesis it supports.
      ANTI-POISON TEST DISCIPLINE (MANDATORY): any pytest you ship MUST parametrize over the script's honest
      verdicts (fires/inert/transfer/no-transfer) for synthetic fixtures; NEVER hard-assert one success string
      against the real on-disk corpus. Run your own test green BEFORE finishing. A test that fails against your
      own script poisons the milestone pre-test gate (the .332 exp3612 cascade).
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; code_verifiers_fire MUST be a BARE top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores the cached code corpus; no LLM load)."
        code_corpus_path:
          principle: "Where the labeled code corpus lives -- the apparatus exp3642 reuses for the code row."
        code_corpus_name:
          principle: "Which labeled code benchmark was scored -- provenance."
        n_examples:
          principle: "Sample-size rigor (>=50 candidates with labels)."
        code_verifiers_fire:
          principle: "BARE bool. True iff the execution-applicable verifiers scored (n_scored>0, variance>0) -- distinguishes 'transfer failed' from 'verifiers never ran'. STORE AS BARE true/false."
        execution_verifier_auroc:
          principle: "The execution-applicable verifiers' standalone code-error signal + CI."
        math_signal_code_auroc:
          principle: "The transferred FoVer-math verifier signal on code -- the core transfer number."
        code_confidence_baseline_auroc:
          principle: "Headroom check: a baseline near 1.0 means no room to discriminate, so a null is uninformative."
        transfer_delta_vs_literature:
          principle: "Signed comparison to the +4-8pt arXiv:2506.00027 anchor -- contextualizes Carnot vs the published positive control."
        hypothesis_supported:
          principle: "'transfer' (2506.00027) or 'discriminative_fragility' (2504.16828) -- the falsifiable mechanism."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "n_examples >= 50 AND code_verifiers_fire == true AND code_confidence_baseline_auroc present"
          principle: "A code transfer verdict requires the verifiers actually fired on a headroom-bearing labeled corpus; a null without that is a wiring failure, not evidence."
      TERMINAL VERDICTS: "complete: code_corpus_built_verifiers_fire_math_signal_transfers_to_code" /
      "complete: code_corpus_built_verifiers_fire_math_signal_does_not_transfer_discriminative_fragility" /
