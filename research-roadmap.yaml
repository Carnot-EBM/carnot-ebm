        value: "reachable/unreachable + workload hash"
      polarfire_status:
        value: "reachable/unreachable + workload hash; polarfire_workload_validated bool"
      gatemate_status:
        value: "blocked_gatemate_dirtyjtag_idcode_unresolved_v475 (if still blocked) or resolved (with the
          fix that worked)"
      gatemate_diagnostic_narrowed_to:
        value: "usb_level | jtag_protocol_level | permissions | clock_rate | firmware_version | unknown"
        principle: "Even an unresolved GateMate issue is progress if the failure mode is narrowed -- this
          field is the load-bearing deliverable if the IDCODE issue is not actually fixed this milestone."
      boards_reachable_count:
        value: "int, out of 3"
      preconditions_checked:
        value: "list of {board, resource, available}"
      random_seed:
        value: int
      reproducibility_checksum:
        value: string
      inference_substrate:
        value: hardware_smoke
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_, and must not claim a hardware
          speedup or latency win -- KV260/PolarFire/GateMate continuity smokes are reachability +
          correctness checks, not performance claims, per CLAUDE.md's hardware precondition tables."

