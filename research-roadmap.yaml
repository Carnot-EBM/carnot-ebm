- id: exp1027-conductor-supervisor
  milestone: 2026.04.80
  deliverable: results/experiment_1027_conductor_supervisor.json
  title: "Conductor Supervisor v1 — External Watchdog + Orphan Reap + Log-Handle Reset (MANDATORY INFRASTRUCTURE)"
  prior_failures:
    - experiment_id: exp1027-conductor-supervisor-prior-block
      verdict: blocked_doomed_rerun_no_root_cause
      addressed_by: |
        The first attempt (2026-04-28 17:28Z) was DOOMED_RERUN_BLOCKed because the
        planner Sonnet emitted this task without a prior_failures field. The
        supervisor proposal has been pending since .77 (1 prior matching scope from
        the .77 deferral). Manual rescue 2026-04-28: added this prior_failures
        block, deleted the prior block-artifact. No design change — the planner's
        miss was operator-layer, not experiment-design-layer.
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    This is a MANDATORY infrastructure experiment per CLAUDE.md forcing function (3+ milestones
    overdue). The conductor-supervisor.md change proposal has been pending since .77. The incidents
    in .77-.79 included log-handle severance, orphan subagent accumulation, and conductor state
    drift where claimed-running experiments had no artifact. An external supervisor process (no
    LLM calls) that watches the conductor would have caught and self-healed each of these.

    EXISTING CODE TO READ FIRST:
    - openspec/change-proposals/conductor-supervisor.md (full spec — read entirely)
    - scripts/research_conductor.py (understand what state files it writes: ops/conductor-heartbeat.json,
      ops/conductor-state.json, which log it writes to)
    - ops/conductor-log.md (understand log format)

    TASK:
    Implement scripts/conductor_supervisor.py — ~300 LOC pure Python, no LLM calls.
    The supervisor is a standalone daemon that can be started independently of the conductor.

    1. HEARTBEAT MONITOR: Every 30 seconds, read ops/conductor-heartbeat.json.
       - If file doesn't exist OR last_beat timestamp > 90s ago: write alert to
         ops/supervisor-alerts.json (append-mode, JSONL format with timestamp+alert_type+detail).
       - Also attempt log-handle reset (see step 4).
    2. ORPHAN REAPER: Every 60 seconds:
       - Read ops/conductor-state.json to get the conductor's PID.
       - Run `pgrep -f 'research_conductor'` to find all matching PIDs.
       - Any PID matching 'research_conductor' that is NOT the conductor's claimed PID:
         send SIGTERM (not SIGKILL — give it 5s to clean up, then SIGKILL if still alive).
       - Log reap events to ops/supervisor-alerts.json.
    3. STATE RECONCILER: Every 120 seconds:
       - Read ops/conductor-state.json for claimed current_experiment and start_time.
       - Check if results/experiment_(claimed_id)_*.json exists.
       - If claimed start_time > estimated_wall_time_min * 1.5 minutes ago AND artifact
         doesn't exist: write stale_experiment alert.
    4. LOG-HANDLE RESET: When heartbeat alert fires:
       - Copy ops/conductor-log.md to ops/conductor-log-archive-(timestamp).md
       - Truncate ops/conductor-log.md (open in 'w' mode and close immediately)
       - Write reset event to ops/supervisor-alerts.json
    5. PID FILE: Write ops/conductor-supervisor.pid on startup. Check for existing PID on
       startup — if supervisor already running, exit with message "supervisor already running".
    6. GRACEFUL SHUTDOWN: Handle SIGTERM by writing shutdown event to alerts log and cleaning
       up PID file.

    Also create tests/python/test_conductor_supervisor.py with at least 4 tests:
    - supervisor starts, writes PID file, stops on SIGTERM
    - heartbeat alert fires when heartbeat file is stale
    - orphan detection works when pgrep finds extra PIDs
    - log-handle reset creates archive and truncates working log

    CONCRETE STEPS:
    - Read openspec/change-proposals/conductor-supervisor.md fully
    - Check what state files research_conductor.py actually writes: grep -n "conductor-heartbeat\|conductor-state\|supervisor" scripts/research_conductor.py | head -30
    - Write scripts/conductor_supervisor.py
    - Write tests/python/test_conductor_supervisor.py
    - pytest tests/python/test_conductor_supervisor.py -v
    - python scripts/conductor_supervisor.py --dry-run 2>&1 | head -20 (verify starts cleanly)
    - Write results/experiment_1027_conductor_supervisor.json

    ARTIFACT FIELDS:
    - supervisor_running: bool (true if --dry-run exits 0)
    - heartbeat_interval_s: int (30)
    - orphan_reap_interval_s: int (60)
    - state_reconcile_interval_s: int (120)
    - test_results: dict (test_name -> pass/fail)
    - honest_verdict: "supervisor_complete" | "partial" | "failed"

    Run: python scripts/experiment_1027_conductor_supervisor.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

