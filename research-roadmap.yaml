- id: exp1193-paper-v5-critical-issues-retry
  milestone: 2026.04.93
  deliverable: results/experiment_1193_paper_v5_critical_issues_retry.json
  title: "Paper v5 Critical ISSUE-1 to ISSUE-5 — Retry with Minimal-First Strategy"
  agent_type: claude
  model: opus
  max_turns: 60
  estimated_wall_time_min: 50
  priority: critical
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1180-paper-v5-critical-issues-1-5
      verdict: MISSING
      addressed_by: "exp1180 timed out at 55 turns before producing an artifact. This attempt uses 60 turns and a minimal-first strategy: ISSUE-1 (fig3) is fixed by dropping the figure entirely if honest speedup is <2x (which exp1094 data implies), not by rewriting the figure script. Issues 2-5 are text substitutions taking <5 turns each. The figure_integrity_audit.py script ships AFTER the fixes, not as a prerequisite."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    This is the CRITICAL unresolved blocker for arXiv submission. The 2026-05-02 integrity
    audit found 18 issues. exp1180 (the .92 critical-fix attempt) produced a MISSING
    artifact — it timed out at 55 turns without completing any of the 5 critical fixes.

    Strategy change for this retry: MINIMAL FIRST. Do the smallest possible valid fix
    for each issue rather than the ideal fix. For ISSUE-1 (fig3): drop the figure entirely
    if the honest speedup is <2x. Do not attempt to rewrite the figure script — just remove
    the \includegraphics and update the text. For ISSUE-2/3/4/5: text substitutions only.

    The 4-test framework applies to every fix:
    1. SOURCE-ARTIFACT: every number traces to a specific results/ JSON field
    2. SAME-BASIS: speedup comparisons use same measurement basis both sides
    3. PROMINENT CAVEATS: extrapolated claims carry equally-prominent caveats
    4. NO HALLUCINATED CITES: every \cite{} is real published work

    EXISTING CODE TO READ FIRST:
    - docs/arxiv-paper/main.tex (the paper to fix)
    - docs/arxiv-paper/carnot.bib (bibliography)
    - openspec/change-proposals/paper-v5-integrity-remediation.md (full remediation spec)
    - results/experiment_1068_ising_sampler_v3_fpga.json (FPGA latency measurements)
    - results/experiment_1094_fpga_cpu_benchmark.json (if exists; CPU baseline)
    - results/experiment_1147_hardnet_constraint_verification.json (117µs measurement)

    TASK:

    ISSUE-1 (fig3 11680x fabricated speedup) — MINIMAL FIX: DROP THE FIGURE:
    - python3 -c "import json; d=json.load(open('results/experiment_1068_ising_sampler_v3_fpga.json')); print({k:v for k,v in d.items() if any(x in k.lower() for x in ['latency','time','speed','throughput'])})" 2>&1
    - Check if exp1094 JSON exists and what the measured CPU latency is.
    - If honest_speedup < 2x (very likely): remove the \begin{figure}...\end{figure} block
      containing fig3 from main.tex entirely. Replace the in-text reference with:
      "The FPGA achieves {fpga_latency_us:.2f} µs per sweep (exp1068); a rigorous
      CPU comparison requires matching N and per-sample basis and will be reported
      in follow-up work."
    - grep -n "fig3\|fpga_latency\|11680\|11,680" docs/arxiv-paper/main.tex | head -20

    ISSUE-2 (KL=3.07 software-proxy framing):
    - grep -n "KL=3\.07\|KL = 3\.07\|3\.07.*kl\|kl.*3\.07" docs/arxiv-paper/main.tex
    - For each hit: replace "FPGA KL=3.07" with
      "software-proxy KL=3.07 (exp1094 simulation; bitstream on-board KL not yet measured)"
    - Verify 0 instances of "FPGA KL=3.07" remain after substitution.

    ISSUE-3 (15.6x hand-typed CPU baseline):
    - grep -n "15\.6x\|15\.6-fold\|15\.6 x" docs/arxiv-paper/main.tex
    - Replace each with: "exp1094's measured CPU latency (details in supplemental)"
    - Do NOT introduce a specific speedup ratio without a measured artifact to back it.

    ISSUE-4 (76,130x HardNet apples-to-oranges):
    - grep -n "76.130\|76130\|76,130" docs/arxiv-paper/main.tex
    - Replace with: "117 µs per case vs 8.9 s prompt repair (exp1147); the two approaches
      address different failure modes and are not directly comparable on a single metric."
    - Verify 0 instances of "76,130" or "76130" remain.

    ISSUE-5 (SOSKANEnergyV3 OOD collapse hidden):
    - grep -n "exp1121\|0\.3333\|AUROC.*0\.33\|0\.9545\|SOSKANEnergy" docs/arxiv-paper/main.tex | head -20
    - Find where exp1121 is cited. Add immediately after:
      "On the FoVer training corpus, SOSKANEnergyV3 achieves AUROC=0.9545 (exp1072). On
      the production evaluation corpus (exp1121), the same verifier drops to AUROC=0.3333 —
      a stark example of the out-of-distribution energy-inversion pattern. This motivates
      multi-verifier AND-composition: no single verifier's OOD failure dominates the ensemble."

    SHIP figure_integrity_audit.py:
    After fixing all 5 issues, write scripts/figure_integrity_audit.py:
    - Reads docs/figures/*.py
    - For each python file: extract numerical constants (regex r'\b(\d+\.?\d+)\b')
    - For each constant: search results/*.json for a field with matching value
    - Flag any constant that traces to no artifact field
    - Exit code 1 if any untraced constants; print PASS if all traced.
    Run it and include the output in the artifact.

    CONCRETE STEPS:
    - grep -n "11680\|76130\|76,130\|15\.6x\|KL=3\.07\|KL = 3" docs/arxiv-paper/main.tex 2>&1
    - python3 -c "import json,glob; files=glob.glob('results/experiment_1068*.json')+glob.glob('results/experiment_1094*.json'); [print(f,json.load(open(f)).keys()) for f in files]" 2>&1
    - [Apply ISSUE-1 minimal fix: drop fig3 block]
    - [Apply ISSUE-2 KL text substitution]
    - [Apply ISSUE-3 15.6x removal]
    - [Apply ISSUE-4 76,130x removal]
    - [Apply ISSUE-5 OOD collapse narrative]
    - grep -n "11680\|76130\|15\.6x\|KL=3\.07" docs/arxiv-paper/main.tex 2>&1
    - python3 scripts/figure_integrity_audit.py 2>&1 | tail -20
    - Write results/experiment_1193_paper_v5_critical_issues_retry.json

    REQUIRED ARTIFACT FIELDS:
    - issue_1_fig3_handled: bool (fig3 dropped OR honest speedup used)
    - issue_1_strategy: str ("dropped" | "rewritten_with_honest_ratio")
    - issue_2_kl_instances_remaining: int (must be 0)
    - issue_3_15p6x_removed: bool (no "15.6x" in main.tex)
    - issue_4_76130x_removed: bool (no "76,130" or "76130" in main.tex)
    - issue_5_ood_narrative_added: bool
    - figure_integrity_script_shipped: bool
    - figure_integrity_untraced_constants: int (0 = clean)
    - critical_issues_fixed: int (must be 5 to unblock exp1194)
    - honest_verdict: "all_5_critical_resolved" | "partial_4_of_5" | "partial_3_of_5" | "blocked"

    Run: python3 scripts/figure_integrity_audit.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

