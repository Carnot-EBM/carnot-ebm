  - id: exp2264-capstone-v223
    title: "Phase 6: Capstone E2E Real-Scale Live Generation (.223) — FST + ODAR + CASAL + KAN-CL"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2264_capstone.json"
    model: "opus"
    max_turns: 100
    gated_on:
      - upstream: exp2255-fst-real-scale-live-gen
        artifact_field: fst_live_validated
        op: "=="
        value: true
      - upstream: exp2258-kancl-n256-clean-reattempt
        artifact_field: kancl_n256_validated
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2251-capstone-v222
        verdict: complete
        addressed_by: "exp2251 was the .222 capstone with a one-token GGUF probe as live evidence. This .223 capstone requires full answer generation (mean_answer_length_tokens >= 50 per exp2255's gate), KAN-CL n=256 importance weights active (from exp2258), and a verified_repair_rate >= 0.3 — three materially harder acceptance criteria than exp2251."
    prompt: |
      CONTEXT: Milestone 2026.05.223 capstone. Validate that the full .223 stack —
      FST+ODAR+CASAL (from .222) plus KAN-CL n=256 importance weighting (exp2258) —
      interoperates correctly in an end-to-end verify-repair pass with REAL FULL ANSWER
      GENERATION on a SOTA GGUF model. This experiment must NOT rely on a single-token
      probe as 'live evidence.'
      All upstream gate fields (fst_live_validated, kancl_n256_validated) must be true for
      this gate to open.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/python/carnot/pipeline/odar_router.py
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/python/carnot/models/substrate_kan.py
        {project_root}/scripts/experiment_template.py
      TASK: Run 10 full verify-repair passes on multi-step math reasoning problems with SOTA GGUF.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. python/carnot/pipeline/odar_router.py imports — else blocked_odar_missing.
           b. python/carnot/training/fast_slow.py imports — else blocked_fst_missing.
           c. python/carnot/samplers/casal.py imports — else blocked_casal_missing.
           d. ls ~/.cache/huggingface/hub/ | grep -i "gemma-4-26B\|Qwen3.6-35B\|gemma-4-31B" returns non-empty —
              else blocked_model_not_cached. Do NOT fabricate GPU inference.
        1. MODEL_SPECS must include at least one of:
           - unsloth/Qwen3.6-35B-A3B-GGUF
           - unsloth/gemma-4-31B-it-GGUF
           - unsloth/gemma-4-26B-A4B-it-GGUF
        2. Select 10 multi-step arithmetic reasoning problems (e.g., two-step word problems).
        3. For each problem:
           a. Generate a FULL ANSWER (>= 50 tokens) using the GGUF model.
           b. Run ODAR routing to decide verification tier.
           c. Run FST context preparation (fast-weight summary from prior repairs).
           d. Run CASAL constraint enforcement on arithmetic equalities in the answer.
           e. If violation found: attempt repair and record repair success.
        4. Measure:
           - mean_answer_length_tokens (MUST be >= 50 — not a token probe)
           - n_violations_found
           - verified_repair_rate: n_repaired / n_violations_found (if n_violations > 0, else 0)
           - total_compute_reduction_pct vs no-routing baseline
           - mean_constraint_violation_after_repair
        5. Set capstone_passed: true if mean_answer_length_tokens >= 50 AND
           (n_violations_found == 0 OR verified_repair_rate >= 0.3).
        6. Write deliverable to results/experiment_2264_capstone.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required. complete: if capstone_passed is true."
        capstone_passed:
          principle: "Boolean. True only when answers are full-length AND repair rate >= 0.3 (or zero violations — honest finding)."
        mean_answer_length_tokens:
          principle: "Must be >= 50 to distinguish from single-token probes. CRITICAL gate for anti-fabrication."
        n_violations_found:
          principle: "Records how many problems had detectable constraint violations; 0 is an honest finding."
        verified_repair_rate:
          principle: "Measures repair pipeline effectiveness; 0.3 threshold allows for honest partial success."
        total_compute_reduction_pct:
          principle: "ODAR's contribution in the integrated stack vs uniform cascade."
        models_used:
          principle: "Records which SOTA GGUF ran so claims are model-specific."
        preconditions_checked:
          principle: "Lists all resource checks performed; MANDATORY per Pre-Launch Preconditions Discipline."
        duration_s:
          principle: "Real compute takes wall-clock time; < 30s for 10 problems with a 26B model flags fabrication."
        random_seed:
          principle: "Reproducibility for the 10-problem run."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

