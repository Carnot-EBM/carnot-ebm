milestone: "2026.05.185"
milestone_title: "Continuous Self-Learning Integration, Fast-Slow Scaling, and KAN Verification"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
scope_reduction_compliance:
  rationale: ".184 successfully prototyped the Fast-Slow Variant (arXiv:2605.12484) and completed the thermodynamic metric comparison. .185 scales the Fast-Slow variant to mandated local SOTA GGUF models and integrates Token-Level Energy (arXiv:2605.14558) to resolve the action bottleneck in FR-11 continual learning. It also pushes the Phase 2 formal verification goal via KAN PWA abstractions (arXiv:2602.06737)."
  carry_forwards_addressed: ["Continuous Self-Learning Stability", "SOTA GGUF Fast-Slow Evaluation", "KAN PWA Verification", "KV260 E-MVL Sparse RTL Accounting"]
authored_by: outer-loop-claude

tasks:
  - id: exp1766-token-level-energy-telemetry
    title: "Exp 1766: Token-Level Energy Telemetry for Agentic Reinforcement (arXiv:2605.14558)"
    deliverable: results/experiment_1766_token_level_energy.json
    max_turns: 50
    priority: critical
    prior_failures: []
    prompt: |
      CONTEXT: arXiv:2605.14558 (May 2026) demonstrates that token-level energy metrics resolve the action bottleneck in agentic RL. Carnot needs this fine-grained signal to inform the Fast-Slow continuous learning loop without relying on coarse string-matching.

      EXISTING CODE TO READ FIRST:
        - python/carnot/inference/composite_scorer.py
        - results/experiment_1761_fast_slow_variant.json (if exists)

      TASK: Implement token-level energy telemetry for the SOTA GGUF runtime.

      CONCRETE STEPS:
        0. PRECONDITIONS: `unsloth/gemma-4-31B-it-GGUF` or `unsloth/Qwen3.6-35B-A3B-GGUF` models are cached locally.
        1. Write a telemetry adapter that hooks into llama.cpp/GGUF logprobs to extract top-k logits per token.
        2. Compute the token-level energy (negative log sum of top-k probabilities).
        3. Evaluate on 50 samples from the FoVer dataset, logging the token-level energy trace alongside deterministic validator pass/fail labels.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.token_level_energy.v1"
        - experiment: 1766
        - run_date: "{date}"
        - duration_s: int
        - model_specs: {{target_model: "unsloth/gemma-4-31B-it-GGUF"}}
        - n_samples: 50
        - auroc_token_energy_vs_validator: float
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

