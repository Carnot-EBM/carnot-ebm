      addressed_by: "exp1214 is a SUCCESSFUL upstream (Nonogram cartridge shipped). This task implements a DIFFERENT game (Futoshiki inequality constraints vs Nonogram run-length constraints) — not a retry of Nonogram. The 7 WOPR cartridge predecessors listed in failure-ledger are all successful upstreams that this task builds on, not failures."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    WOPR is Carnot's game cartridge gallery. Existing cartridges: Hex (exp1188), Connect Four
    (exp1175), Hashi (exp1124), N-Queens (exp1097), Slitherlink (exp1141), Nonogram (exp1214).

    Futoshiki: NxN grid (N=5..9) where:
    - Each row and column contains exactly the values {1..N} (Latin square constraint)
    - Inequality arrows between adjacent cells: cell_a < cell_b or cell_a > cell_b
    - E_total = Σ_i E_latin_i + Σ_j E_inequality_j; E=0 iff all constraints satisfied

    Good FPGA target: Latin uniqueness is XOR/hash, inequality is a comparator — pure
    combinational logic, sub-nanosecond on FPGA.

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write to results/experiment_1227_wopr_futoshiki_cartridge.json:
