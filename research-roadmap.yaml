      - results/experiment_3030_validator_frontier_corrigendum_v2.json
      - results/experiment_3033_fr11_nonforgetting_negative_control_stress_v1.json
      - python/carnot/verification if present
      - python/carnot/pipeline if present
      - tests/python relevant to verifier/tree behavior
      - research-references.md

      TASK
      Add or prototype an exact SMT/SAT validator-tree upgrade that reports verified, irrelevant, unresolved, fallback-only, and correction-set rows. Keep the scope tiny and testable.

      CONCRETE STEPS
      0. SPEC FIRST: before editing implementation code, confirm the relevant openspec capability spec exists and contains REQ-* requirements. If no relevant spec exists, add/update the minimal spec before code.
      1. Identify the narrowest existing validator-tree or pipeline module that can host a solver-backed check without broad refactor.
      2. Add a tiny exact-check path or standalone experiment script for SAT/SMT-style constraints with deterministic fixtures.
      3. Add focused tests or a self-check that proves verified, unsat/unresolved, irrelevant, fallback-only, and correction-set classifications are distinguishable.
      4. Run the relevant tests or a local smoke command and record the command/output summary in the artifact.
      5. Set validator_tree_exactness_ready=true only if the exact path and evidence file are present.

