- id: exp819-injection-field-fix
  milestone: 2026.04.63
  deliverable: results/experiment_819_injection_field_fix.json
  title: 'Exp 819: IsingEBM External Field Fix (RETRO-ISING-INJECTION-NO-DISCRIMINATION)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 812 (milestone .62) produced honest_verdict=injection_negative_delta — energy
    DECREASES when a constraint violation fires. This is a fundamental physics bug that cascaded
    into 4 failed experiments (.62 Exps 813, 814, 817). Root cause: IsingConstraintInjector
    .inject_into_coupling_matrix() adds the constraint projection to the DIAGONAL of coupling
    matrix J. In Ising energy E = -0.5 * s^T J s, diagonal terms are -0.5 * J[i,i] * s_i^2
    = -0.5 * J[i,i] (constant, since s_i^2 = 1 for ±1 spins). Adding positive values to the
    diagonal uniformly LOWERS energy for ALL spin configurations — it does not discriminate
    between correct and violated responses. This is RETRO-ISING-INJECTION-NO-DISCRIMINATION.

    Fix: Replace diagonal injection with external field injection:
      E_total = -0.5 * s^T J s - h^T s
    Where h = project_to_spin_bias(constraint_embeddings) is a per-spin external field.
    When constraint fires: h[i] > 0, spin s_i = +1 (violation encodes as +1)
      → field_energy = -h[i] * s_i = -h[i] < 0 → total energy INCREASES (higher = worse).
    For correct responses: s_i = -1
      → field_energy = -h[i] * (-1) = h[i] > 0 → energy DECREASES (lower = better).
    Net: violations get HIGHER energy, correct responses get LOWER energy. Discriminating.

    EXISTING CODE TO READ FIRST:
    - results/experiment_812_ising_constraint_injection.json — root cause details
    - python/carnot/pipeline/ising_constraint_injector.py — IsingConstraintInjector class
    - python/carnot/verify/ising_ebm.py — IsingEBM energy computation
    - openspec/capabilities/pipeline/spec.md — look for REQ-VERIFY entries
    - openspec/capabilities/autoresearch/spec.md — look for REQ-LEARN entries

    TASK: Implement external field energy method, validate it discriminates correct from incorrect
    responses, write results/experiment_819_injection_field_fix.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/pipeline/spec.md:
       - REQ-VERIFY-141: IsingConstraintInjector MUST support external field injection via
         compute_energy_with_external_field(J, spins, constraint_embeddings) where
         E_total = -0.5 * s^T J s - h^T s and h = project_to_spin_bias(constraint_embeddings).
       - REQ-VERIFY-142: For a ±1 spin configuration encoding a constraint violation (s_i = +1),
         external field injection MUST produce E_total(violation) > E_total(correct) when
         h[i] > 0. The legacy diagonal injection method MUST remain available as
         inject_into_coupling_matrix() for backwards compatibility.
       - SCENARIO-VERIFY-170: 10 arithmetic error responses encoded as +1 spins; 10 correct
         responses encoded as -1 spins; energy(error) > energy(correct) for >= 8/10 pairs.
       - SCENARIO-VERIFY-171: compute_energy_with_external_field with zero constraint embeddings
         (h=0) returns E_total == E_ising (no external field contribution). Backward compatibility.
    3. Implement in python/carnot/pipeline/ising_constraint_injector.py:
       a. Add method compute_energy_with_external_field(J, spins, constraint_embeddings):
          - project_to_spin_bias(constraint_embeddings): projects embedding to per-spin scalar
            h = embedding_matrix @ constraint_embeddings.mean(axis=0), clipped to [0, +inf].
          - Compute E_ising = -0.5 * float(spins @ J @ spins)
          - Compute E_field = -float(h @ spins)
          - Return E_total = E_ising + E_field (namedtuple: E_total, E_ising, E_field, h_norm)
       b. Add helper project_to_spin_bias(constraint_embeddings, n_spins) -> np.ndarray:
          - Creates a random projection matrix W of shape (n_spins, embedding_dim) on first call.
          - Returns W @ constraint_embeddings.mean(axis=0), clipped to [0, +inf].
          - W is seeded with np.random.default_rng(42) for reproducibility.
       c. Export compute_energy_with_external_field from carnot.pipeline.__init__.
    4. Create scripts/experiment_819_injection_field_fix.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(819) + ExperimentTimeoutWatchdog(819, timeout_minutes=30).
       c. Load IsingEBM(n_spins=16) with J initialized to identity (baseline).
       d. Generate synthetic test cases:
          - 10 violation encodings: spins = np.array([+1 if i in violation_indices else -1 ...])
            where violation_indices are the first 4 spins. Use fixed constraint_embeddings (zero
            mean normal, seed=42).
          - 10 correct encodings: same constraint_embeddings but spins all -1 (no violations).
       e. For each pair: compute compute_energy_with_external_field(J, spins_violation, embeddings)
          and compute_energy_with_external_field(J, spins_correct, embeddings).
          Record: E_violation, E_correct, discriminating (E_violation > E_correct).
       f. Compute: n_discriminating = sum(discriminating), discrimination_rate = n_discriminating/10.
       g. Also verify legacy: for same inputs, inject_into_coupling_matrix returns constant shift
          (record: legacy_delta = E_legacy_violation - E_legacy_correct, expected ~= 0.0).
       h. Artifact fields: n_discriminating, discrimination_rate, legacy_delta,
          external_field_implemented, retro_injection_closed (=True if rate >= 0.8),
          honest_verdict.
       i. honest_verdict:
          - "injection_field_fixed" if discrimination_rate >= 0.8
          - "injection_partial" if 0.5 <= discrimination_rate < 0.8
          - "injection_still_wrong" if discrimination_rate < 0.5
       j. If retro_injection_closed=True: update python/carnot/pipeline/ising_constraint_injector.py
          docstring to mark RETRO-ISING-INJECTION-NO-DISCRIMINATION as CLOSED (date: {date}).
    5. Write tests/python/test_experiment_819_injection_field_fix.py with 100% coverage:
       - test compute_energy_with_external_field returns E_total > E_total_correct for h > 0
       - test compute_energy_with_external_field with h=0 returns same energy as legacy
       - test project_to_spin_bias output is non-negative (clipping works)
       - test legacy inject_into_coupling_matrix diagonal delta ~= 0.0 (constant shift confirmed)
       Each test traces to REQ-VERIFY-141/142 and SCENARIO-VERIFY-170/171.
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_819_injection_field_fix.py -v
    7. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict.
       - ops/status.md: "Exp 819: external field injection implemented. RETRO-ISING-INJECTION-NO-DISCRIMINATION status: <verdict>."
       - _bmad/architecture.md: update IsingConstraintInjector note to reflect external field fix.
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_819_injection_field_fix.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp820-gguf-import-fix-code-repair-v5
  milestone: 2026.04.63
  deliverable: results/experiment_820_gguf_import_fix_code_repair_v5.json
  title: 'Exp 820: GGUF Import Fix + Code Repair v5 (RETRO-GGUF-CACHE-IMPORT, GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-028 is CLOSED (Exp 810: Gemma4 OOM fixed). The new gate for live code repair
    is RETRO-GGUF-CACHE-IMPORT: Exp 811 produced honest_verdict=blocked_model_load_failed due to
    a Python ImportError when loading the GGUF loader. This has blocked every code repair
    experiment since milestone .58. RETRO-028 resolution shifted the blocker from OOM to import
    error. The fix is: diagnose the exact ImportError, repair the import (pip install/reinstall),
    verify "from llama_cpp import Llama" succeeds, then run 20 HumanEval problems.
    Even code_no_improvement is a valid honest_verdict — the project needs a live GPU result,
    not a simulation. This experiment requires GPU (CARNOT_FORCE_LIVE=1).
    Use Qwen3.5-0.8B (GGUF: unsloth/Qwen3.5-0.8B-GGUF) as the base model for affordability.
    Use google/gemma-4-E4B-it as a second smoke-test model.

    EXISTING CODE TO READ FIRST:
    - results/experiment_811_sota_gguf_code_repair_v4.json — exact traceback of ImportError
    - results/experiment_810_gemma4_oom_fix_v5.json — RETRO-028 closure details
    - python/carnot/inference/gguf_loader.py — GGUFModelLoader class
    - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner
    - openspec/capabilities/pipeline/spec.md — REQ-REPAIR entries

    TASK: Diagnose and fix GGUF import error, run live 20-question HumanEval benchmark,
    write results/experiment_820_gguf_import_fix_code_repair_v5.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/pipeline/spec.md:
       - REQ-REPAIR-056: The GGUF model loader MUST succeed `from llama_cpp import Llama`
         before any inference experiment proceeds. If ImportError is raised at load time,
         the experiment MUST diagnose the error and attempt auto-repair via pip install.
       - SCENARIO-REPAIR-089: GGUF loader import fails; diagnostic module detects missing
         or incompatible llama-cpp-python; installs correct version; import succeeds;
         experiment proceeds with live inference.
    3. Create scripts/experiment_820_gguf_import_fix_code_repair_v5.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(820) + ExperimentTimeoutWatchdog(820, timeout_minutes=120).
       c. Read results/experiment_811_sota_gguf_code_repair_v4.json — extract traceback.
       d. Attempt import diagnostic:
          try:
            from llama_cpp import Llama
            import_ok = True
          except ImportError as e:
            import_ok = False
            import_error_msg = str(e)
       e. If import_ok=False:
          - Log import_error_msg.
          - Attempt auto-repair: subprocess.run(["pip", "install", "--upgrade", "llama-cpp-python"])
          - Re-attempt import. If still fails: write blocked artifact with
            import_repair_attempted=True, import_repair_succeeded=False,
            honest_verdict="still_blocked_import".
       f. If import_ok=True (either directly or after repair):
          - Setup GPU: tmpl.setup_gpu(MODEL_SPECS) where MODEL_SPECS includes:
            {"name": "Qwen3.5-0.8B", "hf_id": "unsloth/Qwen3.5-0.8B-GGUF", "gpu": 0}
          - If GPU not healthy: write blocked artifact with gpu_health_status.
          - Load 20 HumanEval problems (from datasets["openai_humaneval"] or local cache).
          - For each problem: generate solution with Qwen3.5-0.8B, test with exec() in sandbox.
          - Baseline: run same 20 problems without Carnot repair (pass@1 baseline).
          - Repair: run VerifyRepairPipeline.verify_and_repair() on failed solutions.
          - Compute: n_baseline_pass, n_repair_pass, repair_delta = n_repair_pass - n_baseline_pass.
       g. Artifact fields: import_repair_attempted, import_repair_succeeded, n_problems=20,
          n_baseline_pass, n_repair_pass, repair_delta, honest_verdict.
       h. honest_verdict:
          - "import_fixed_repair_positive" if import_ok AND repair_delta > 0
          - "import_fixed_no_improvement" if import_ok AND repair_delta <= 0
          - "still_blocked_import" if import fails even after repair attempt
    4. Write tests/python/test_experiment_820_gguf_import_fix_code_repair_v5.py with 100% coverage:
       - test import diagnostic detects ImportError and logs error message
       - test auto-repair subprocess call with mocked subprocess.run
       - test HumanEval result struct has correct fields when import succeeds (mocked Llama)
       Each test traces to REQ-REPAIR-056 and SCENARIO-REPAIR-089.
    5. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict and repair_delta.
       - ops/status.md: "Exp 820: GGUF import status: <verdict>. repair_delta=<value>."
       - If honest_verdict != "still_blocked_import": update RETRO-GGUF-CACHE-IMPORT status.
    6. tmpl.assert_deliverable_written() as final line.

    Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu python scripts/experiment_820_gguf_import_fix_code_repair_v5.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp821-constraint-addition-live-v2
  milestone: 2026.04.63
  deliverable: results/experiment_821_constraint_addition_live_v2.json
  title: 'Exp 821: Constraint Addition Live v2 (RETRO-CONSTRAINT-ZERO-DELTA, gated on Exp 819)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: This experiment is GATED on Exp 819 honest_verdict=injection_field_fixed.
    Read results/experiment_819_injection_field_fix.json first. If honest_verdict is NOT
    "injection_field_fixed", write a blocked artifact and stop.

    RETRO-CONSTRAINT-ZERO-DELTA: Exp 813 (milestone .62) was blocked by injection_not_wired
    (gated on the same injection fix). The goal is to measure whether adding constraints to
    EmbeddingConstraintStore actually IMPROVES verification precision on live GPU over 3 sessions.
    This is the core FR-11 Tier 1 hypothesis: more constraints → higher energy for violations.
    The fix (external field injection from Exp 819) enables real measurement for the first time.

    EXISTING CODE TO READ FIRST:
    - results/experiment_819_injection_field_fix.json — gate check (must be injection_field_fixed)
    - results/experiment_813_constraint_addition_live.json — prior blocked attempt details
    - python/carnot/pipeline/embedding_constraint_store.py — EmbeddingConstraintStore
    - python/carnot/pipeline/ising_constraint_injector.py — external field method (from Exp 819)
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN entries

    TASK: Run 30 GSM8K questions × 3 sessions with live constraint accumulation; measure
    precision delta per session; write results/experiment_821_constraint_addition_live_v2.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Check gate: read results/experiment_819_injection_field_fix.json. If
       honest_verdict != "injection_field_fixed": write blocked artifact
       {"blocked": true, "gate": "exp819_injection_not_fixed", "honest_verdict": "blocked_gate"}.
    3. Add to openspec/capabilities/autoresearch/spec.md:
       - REQ-LEARN-046: After applying the external field fix (REQ-VERIFY-141), constraint
         addition to EmbeddingConstraintStore MUST produce a measurable increase in verification
         precision (delta_overall > 0) over at least 3 live sessions on >= 30 GSM8K questions.
       - SCENARIO-LEARN-058: Session 1 with empty store; session 2 with constraints from session 1;
         session 3 with constraints from sessions 1-2. Precision non-decreasing across sessions.
    4. Setup: tmpl.setup_gpu(MODEL_SPECS) for Qwen3.5-0.8B (CARNOT_FORCE_LIVE=1 required).
    5. Load 30 GSM8K questions from local cache or datasets["gsm8k"].
    6. Create EmbeddingConstraintStore() with empty store.
    7. For each session s in [1, 2, 3]:
       a. Run VerifyRepairPipeline.verify() on all 30 questions using current store.
          Use compute_energy_with_external_field for Ising scoring.
       b. Compute precision_s = TP / (TP + FP) using GSM8K ground truth answers.
       c. For each failed verification: extract constraint and add to store.
          n_constraints_added_s = number of constraints added this session.
       d. Record: precision_s, n_constraints_store_after_s, n_constraints_added_s.
    8. Compute: delta_s1_to_s3 = precision_3 - precision_1.
       delta_overall = max(precision_1, precision_2, precision_3) - precision_1.
       retro_constraint_zero_delta_closed = (delta_overall > 0).
    9. Artifact fields: sessions=[{session, precision, n_constraints_store, n_added}],
       delta_s1_to_s3, delta_overall, retro_constraint_zero_delta_closed, honest_verdict.
    10. honest_verdict:
        - "constraint_addition_works_live" if delta_overall > 0
        - "constraint_addition_no_delta_live" if delta_overall <= 0
        - "blocked_gate" if gate fails
    11. Write tests/python/test_experiment_821_constraint_addition_live_v2.py with 100% coverage:
        - test session loop accumulates constraints across sessions (mocked pipeline)
        - test delta_overall computed correctly from session precision list
        - test gate check logic reads exp819 result and blocks correctly
        Each test traces to REQ-LEARN-046 and SCENARIO-LEARN-058.
    12. Reconcile:
        - ops/changelog.md: one-line entry with honest_verdict and delta_overall.
        - ops/status.md: "Exp 821: constraint accumulation live delta=<value>. RETRO-CONSTRAINT-ZERO-DELTA: <status>."
    13. tmpl.assert_deliverable_written() as final line.

    Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu python scripts/experiment_821_constraint_addition_live_v2.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp822-arbiter-fix-v2-agent-auditor
  milestone: 2026.04.63
  deliverable: results/experiment_822_arbiter_fix_v2_agent_auditor.json
  title: 'Exp 822: Multi-Agent Arbiter Fix v2 + AgentAuditor Consensus (gated on Exp 819, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: This experiment is GATED on Exp 819 honest_verdict=injection_field_fixed.
    Read results/experiment_819_injection_field_fix.json first. If not fixed: blocked artifact.

    RETRO-ARBITER-FLAT-ENERGY: Exp 817 (milestone .62) produced arbiter_accuracy=0.3333 because
    ALL agent energies were 0.0 (downstream of the Exp 812 injection sign bug). With the
    external field fix from Exp 819, energies will now be discriminating. Additionally, arXiv
    2602.09341 (AgentAuditor) provides a consensus detection mechanism: when multiple agents
    agree on the same wrong answer (adversarial scenario), energy-only ranking fails because
    the majority answer has a lower average energy. AgentAuditor introduces a consensus penalty:
    agents sharing the majority response pattern get an energy bump, forcing the arbiter to
    consider minority viewpoints.

    EXISTING CODE TO READ FIRST:
    - results/experiment_819_injection_field_fix.json — gate check (must be injection_field_fixed)
    - results/experiment_817_multi_agent_arbiter.json — prior failure details (arbiter_accuracy=0.33)
    - python/carnot/inference/multi_agent_arbiter.py — MultiAgentArbiter class
    - python/carnot/pipeline/ising_constraint_injector.py — external field method (from Exp 819)
    - research-references.md — AgentAuditor section (arXiv 2602.09341)
    - openspec/capabilities/pipeline/spec.md — REQ-VERIFY entries

    TASK: Rebuild MultiAgentArbiter with external field scoring and AgentAuditor consensus
    penalty; test on 12 scenarios (6 standard + 6 adversarial majority-wrong); write
    results/experiment_822_arbiter_fix_v2_agent_auditor.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Check gate: read results/experiment_819_injection_field_fix.json. If
       honest_verdict != "injection_field_fixed": write blocked artifact.
    3. Add to openspec/capabilities/pipeline/spec.md:
       - REQ-VERIFY-143: MultiAgentArbiter MUST use compute_energy_with_external_field for
         scoring agent responses. Legacy constant-shift diagonal scoring MUST NOT be used.
       - REQ-VERIFY-144: When agent energy variance is < 0.01 (consensus cluster), MultiAgentArbiter
         MUST apply an AgentAuditor consensus penalty of +0.1 to all agents sharing the majority
         response cluster, breaking ties in favor of minority dissenting agents (arXiv 2602.09341).
       - SCENARIO-VERIFY-172: 6 standard scenarios (correct answer is minority); arbiter selects
         correct with probability >= 0.80. SCENARIO-VERIFY-173: 6 adversarial consensus scenarios
         (wrong answer is majority); arbiter with consensus penalty selects correct >= 0.70.
    4. Implement in python/carnot/inference/multi_agent_arbiter.py:
       a. Update score_agents(responses, constraint_embeddings) to call
          compute_energy_with_external_field for each agent response.
       b. Add detect_consensus(energies, threshold=0.01) -> bool: True if max(energies) -
          min(energies) < threshold.
       c. Add apply_consensus_penalty(energies, responses, penalty=0.1) -> np.ndarray:
          cluster majority responses by exact-match; add penalty to all agents in the majority
          cluster. Return adjusted energies.
       d. Update arbitrate(responses, constraint_embeddings) to call detect_consensus and
          apply_consensus_penalty before selecting min-energy agent.
    5. Create scripts/experiment_822_arbiter_fix_v2_agent_auditor.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(822) + ExperimentTimeoutWatchdog(822, timeout_minutes=45).
       c. Generate 12 synthetic test scenarios (CPU only, no GPU):
          - 6 standard: 3 agents disagree; 1 correct agent has lowest energy after fix.
          - 6 adversarial: 2 agents agree on wrong answer (consensus); 1 agent has correct answer.
          Use fixed random seed (42) for synthetic energy assignments.
       d. For each scenario: run arbitrate() with and without consensus penalty.
          Record: arbiter_choice, is_correct, used_consensus_penalty.
       e. Compute: accuracy_standard (6 scenarios), accuracy_adversarial (6 scenarios),
          accuracy_overall (12 scenarios).
       f. Artifact fields: accuracy_standard, accuracy_adversarial, accuracy_overall,
          consensus_penalty_triggered_n, honest_verdict.
       g. honest_verdict:
          - "arbiter_correct" if accuracy_overall >= 0.80
          - "arbiter_partial" if 0.60 <= accuracy_overall < 0.80
          - "arbiter_still_wrong" if accuracy_overall < 0.60
          - "blocked_gate" if gate fails
    6. Write tests/python/test_experiment_822_arbiter_fix_v2_agent_auditor.py with 100% coverage:
       - test detect_consensus returns True when energy variance < 0.01
       - test apply_consensus_penalty adds penalty to majority cluster agents
       - test arbitrate selects min-energy agent after consensus adjustment
       Each test traces to REQ-VERIFY-143/144.
    7. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict and accuracy_overall.
       - ops/status.md: "Exp 822: arbiter accuracy=<value>. RETRO-ARBITER-FLAT-ENERGY: <status>."
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_822_arbiter_fix_v2_agent_auditor.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp823-fr11-tier1-live-relay-v2
  milestone: 2026.04.63
  deliverable: results/experiment_823_fr11_tier1_live_relay_v2.json
  title: 'Exp 823: FR-11 Tier 1 Live Relay v2 (FR-11 mandatory, gated on Exp 821, GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: This experiment is GATED on Exp 821 honest_verdict=constraint_addition_works_live.
    Read results/experiment_821_constraint_addition_live_v2.json first. If not
    "constraint_addition_works_live": write blocked artifact.

    FR-11 (REQ-LEARN-*) requires a live self-learning relay: verification results from session N
    are fed back as constraints into session N+1, producing a measurable precision increase.
    Exp 814 (milestone .62) was blocked_no_delta because the injection was broken. Exp 821 has
    now confirmed that constraint addition produces delta_overall > 0 on live GPU. Exp 823
    closes the loop: run 5 sessions × 10 questions with the full relay pipeline, using
    capacity-constrained update (arXiv 2507.21479) — update only the top-K=3 highest-variance
    constraint types per session to avoid constraint store bloat.

    EXISTING CODE TO READ FIRST:
    - results/experiment_821_constraint_addition_live_v2.json — gate check (must be works_live)
    - results/experiment_814_fr11_tier1_live_relay.json — prior blocked attempt details
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
    - python/carnot/pipeline/embedding_constraint_store.py — EmbeddingConstraintStore
    - _bmad/prd.md — FR-11 requirement definition
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN entries

    TASK: Run 5-session live relay pipeline, measure precision trend per session, write
    results/experiment_823_fr11_tier1_live_relay_v2.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Check gate: read results/experiment_821_constraint_addition_live_v2.json. If
       honest_verdict != "constraint_addition_works_live": write blocked artifact.
    3. Add to openspec/capabilities/autoresearch/spec.md:
       - REQ-LEARN-047: The FR-11 Tier 1 relay MUST enforce capacity-constrained updates:
         per session, add constraints only from the top-K=3 highest-variance constraint types
         (by embedding cosine variance across all session failures).
       - SCENARIO-LEARN-059: 5 sessions × 10 questions. Session 1 uses empty store. Sessions
         2-5 use inherited constraints. Precision MUST be non-decreasing from session 1 to 5.
         delta_s1_to_s5 MUST be > 0 for honest_verdict=tier1_relay_works_live.
    4. Implement capacity-constrained update in python/carnot/pipeline/embedding_constraint_store.py:
       a. Add method add_top_k_constraints(failures, k=3) -> int:
          - Cluster failure embeddings by cosine similarity (3 clusters via k-means).
          - For each cluster: compute intra-cluster variance. Select top-k=3 highest-variance clusters.
          - Add one representative constraint per selected cluster. Return n_added.
    5. Create scripts/experiment_823_fr11_tier1_live_relay_v2.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(823) + ExperimentTimeoutWatchdog(823, timeout_minutes=90).
       c. GPU setup: CARNOT_FORCE_LIVE=1, tmpl.setup_gpu(MODEL_SPECS) for Qwen3.5-0.8B.
       d. Load 10 GSM8K questions × 5 sessions (same 50 questions shuffled per session, seed per session).
       e. Create fresh EmbeddingConstraintStore(capacity=30).
       f. For each session s in [1..5]:
          - Run VerifyRepairPipeline.verify() on 10 questions with current store.
          - Compute precision_s using ground truth answers.
          - Collect failures. Add top-3 constraints via add_top_k_constraints(failures).
          - Checkpoint: tmpl.checkpoint_save({session_results: [...]}, step=s).
       g. Compute: delta_s1_to_s5 = precision_5 - precision_1.
          precision_non_decreasing = all(p[i] >= p[i-1] - 0.02 for i in 1..4) (2pp tolerance).
       h. Artifact fields: sessions=[{session, precision, n_constraints_store, n_added}],
          delta_s1_to_s5, precision_non_decreasing, fr11_tier1_relay_deployed, honest_verdict.
       i. honest_verdict:
          - "tier1_relay_works_live" if delta_s1_to_s5 > 0 AND precision_non_decreasing
          - "tier1_relay_partial" if delta_s1_to_s5 > 0 but not non-decreasing
          - "tier1_plateau_persists_live" if delta_s1_to_s5 <= 0
          - "blocked_gate" if gate fails
       j. If tier1_relay_works_live: update _bmad/traceability.md FR-11 row to "deployed".
    6. Write tests/python/test_experiment_823_fr11_tier1_live_relay_v2.py with 100% coverage:
       - test add_top_k_constraints clusters and selects top-k by variance (mocked embeddings)
       - test session relay loop precision trend computed correctly
       - test gate check reads exp821 and blocks correctly
       Each test traces to REQ-LEARN-046/047 and SCENARIO-LEARN-059.
    7. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict and delta_s1_to_s5.
       - ops/status.md: "Exp 823: FR-11 Tier 1 relay live delta=<value>. Status: <verdict>."
    8. tmpl.assert_deliverable_written() as final line.

