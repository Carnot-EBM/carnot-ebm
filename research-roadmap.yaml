- id: exp1090-diagnostic-instrumentation-library
  milestone: 2026.04.85
  deliverable: results/experiment_1090_diagnostic_instrumentation_library.json
  title: "Diagnostic Instrumentation Library — α_t tracking, KL divergence, null-space estimation (cross-cutting infrastructure)"
  model: opus
  # 2026-05-01 operator patch: planner's failure-ledger audit missed
  # this task. The conductor's name-similarity heuristic matched 2
  # prior failures via the keyword "diagnostic" — but neither is in
  # actual scope. exp605 was about LLM-output extractor recall;
  # exp706 was about Gemma-4 VR (visual-reasoning) prompt diagnostics.
  # exp1090's scope is alpha_t / KL / null-space measurement
