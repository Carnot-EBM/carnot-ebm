    4. Use no_model_load, inference_substrate=aggregation_from_upstream_artifacts, MODEL_SPECS=[] and zero model calls. Compare the V718 staged table, complete JSON tasks and YAML. Bind activated authority only after conductor activation. Preserve the V717 design snapshot and frozen protocol bytes.
    5. Read the V718 reference scan and full methods for2602.02056v4 and2606.11711v1. Write docs/research-notes/v718-method-ingestion.md. Update research-studying.md. Separate paper assumptions, local adaptations and deferred ideas. Freeze a methods manifest binding the unchanged V717 science plus the separate capacity protocol in this design.
