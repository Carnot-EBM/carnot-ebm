  - id: exp2295-pypi-escalation-fix-claude
    title: "Phase 0: Fix carnot.pypi_escalation Missing Symbols — Claude Escalation (5th Attempt)"
    milestone: "2026.05.226"
    deliverable: "results/experiment_2295_pypi_escalation_fix.json"
    requires_claude: true
    max_turns: 40
    prior_failures:
      - experiment_id: exp2281-pypi-escalation-fix
        verdict: "blocked_no_deliverable"
        addressed_by: "exp2281 used codex gpt-5.5 (max_turns: 30) and produced no deliverable — the codex agent failed to write results/experiment_2281_pypi_escalation_fix.json. This is the 5th consecutive milestone where this fix has been attempted and failed. codex gpt-5.5 is demonstrably insufficient for this multi-file Python debugging task. This attempt uses requires_claude: true (Sonnet + C+E Opus escalation, max_turns: 40), matching the approach that succeeded for EnvPropagationGuard repair in milestone .83 (exp~300, also a multi-file Python debugging task requiring cross-file context). Meets all three requires_claude criteria: (1) codex demonstrably failed at this exact task across two milestones (.224 exp2267 + .225 exp2281), (2) requires multi-file read/write choreography (reading test file, reading module, writing new symbols, running pytest), (3) debugging requires multi-step reasoning under ambiguity — the function signatures must be inferred from test assertions."
      - experiment_id: exp2267-dualgpu-import-fix
        verdict: "blocked_full_pretest_import_error"
        addressed_by: "exp2267 fixed DualGPU exports but discovered the pypi_escalation missing-symbol root cause without fixing it. Root cause confirmed: tests/python/test_pypi_escalation.py imports check_pypi_escalation and run_escalation from carnot.pypi_escalation, but python/carnot/pypi_escalation.py only defines generate_escalation_report and main."
    prompt: |
      CONTEXT: The pre-test cascade has blocked ALL experiments for 5 consecutive milestones
      (.221–.225). The root cause: tests/python/test_pypi_escalation.py imports
      check_pypi_escalation and run_escalation from carnot.pypi_escalation, but
      python/carnot/pypi_escalation.py only defines generate_escalation_report and main.
      This ImportError causes the conductor's system-wide pre-test check to fail, labeling
      ALL tasks as SKIP or blocked_gate_check_failed — even tasks with no structured gate.

      PRIOR ATTEMPTS:
      - exp2267 (.224, codex): fixed DualGPU exports, missed pypi_escalation root cause.
      - exp2281 (.225, codex gpt-5.5, max_turns 30): aimed directly at pypi_escalation,
        produced NO deliverable file. codex approach is demonstrably insufficient.

      This attempt uses Claude Sonnet with C+E Opus escalation (requires_claude: true,
      max_turns: 40), matching the approach that succeeded on equivalent multi-file Python
      debugging tasks in milestone .83 (EnvPropagationGuard repair).

      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pypi_escalation.py
        {project_root}/tests/python/test_pypi_escalation.py
      TASK: Add the missing check_pypi_escalation and run_escalation functions to
      python/carnot/pypi_escalation.py and verify the full pre-test suite passes.
      CONCRETE STEPS:
        1. Read tests/python/test_pypi_escalation.py in FULL. Understand EXACTLY what
           signature check_pypi_escalation and run_escalation must have:
           what arguments they accept, what they return, what assertions the tests make.
        2. Read python/carnot/pypi_escalation.py in FULL. Note existing function names,
           module structure, imports, and any docstrings that hint at missing functions.
        3. Add check_pypi_escalation(experiment_id: int, ...) to python/carnot/pypi_escalation.py.
           The function MUST accept the exact arguments that test_pypi_escalation.py passes
           and return a dict matching the test's assertions.
        4. Add run_escalation(...) to python/carnot/pypi_escalation.py following the same
           approach — match what the tests expect exactly.
        5. Run: cd {project_root} && .venv/bin/python -m pytest tests/python/test_pypi_escalation.py
           -x -q --no-cov -p no:cacheprovider 2>&1 | tail -15
           Record: pypi_test_errors, pypi_test_failures. If failures: iterate (fix and re-run)
           until zero failures OR max_turns reached.
        6. Run the FULL pre-test check: cd {project_root} && .venv/bin/python -m pytest tests/python
           -x -q --no-cov -p no:cacheprovider 2>&1 | tail -10
           Record: full_pretest_errors, full_pretest_failures.
        7. Set pretest_fixed: true ONLY if full_pretest_errors == 0 AND full_pretest_failures == 0.
        8. Write deliverable to results/experiment_2295_pypi_escalation_fix.json.
           CRITICAL: You MUST write this file even if the tests still fail — use
           honest_verdict "complete: partial_fix" with pretest_fixed: false and record
           which tests still fail and why. Producing NO file is the worst outcome.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if pretest_fixed is true. complete: partial_fix if the pypi tests pass but full suite still has failures. NEVER omit the file — an absent deliverable is worse than an honest blocked verdict."
        - pretest_fixed:
            principle: "Primary gate for ALL Phase 1–3 tasks. True only when the full pytest suite has zero errors and zero failures — not just the pypi_escalation test file alone."
        - pypi_test_errors:
            principle: "Records pypi_escalation-specific errors; confirms the new symbols fix the ImportError."
        - pypi_test_failures:
            principle: "Records pypi_escalation test failures; confirms the added functions satisfy assertions."
        - full_pretest_errors:
            principle: "Full-suite error count post-fix; must be 0 for pretest_fixed=true."
        - full_pretest_failures:
            principle: "Full-suite failure count post-fix; must be 0 for pretest_fixed=true."
        - symbols_added:
            principle: "Lists the function names added to pypi_escalation.py so reviewers can verify completeness."
        - iterations_required:
            principle: "Records how many fix-test cycles were needed; informs future estimates for debugging tasks."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2296-fst-live-gen-v6
    title: "Phase 1: FST+ODAR+CASAL Real-Scale Live Generation v6 (>50 tokens)"
    milestone: "2026.05.226"
    deliverable: "results/experiment_2296_fst_live_gen.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 50
    gated_on:
      - upstream: exp2295-pypi-escalation-fix-claude
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2282-fst-real-scale-live-gen
        verdict: blocked_gate_check_failed
        addressed_by: "exp2282 was blocked because exp2281.pretest_fixed was false (codex produced no deliverable). exp2295 uses Claude Sonnet + Opus escalation to fix the cascade root cause. This attempt is identical in scope to exp2282 and runs only when exp2295.pretest_fixed=true."
      - experiment_id: exp2268-fst-real-scale-live-gen
        verdict: blocked_gate_check_failed
        addressed_by: "exp2268 was blocked because exp2267.pretest_fixed=false (DualGPU issue fixed but pypi_escalation not yet targeted). 3rd consecutive milestone this live gen attempt has been blocked by exogenous cascades."
    prompt: |
      CONTEXT: The .224 capstone (exp2251) demonstrated FST+ODAR+CASAL interoperate, but live
      hardware evidence was limited to a one-token GGUF probe on GPU 0, not full live answer
      generation. exp2282 and exp2268 were both blocked by the pre-test cascade root cause.
      Now that exp2295 has fixed that cascade, this task runs the benchmark with FULL ANSWER
      GENERATION (minimum 50 tokens per answer, not a single-token probe).
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/python/carnot/pipeline/odar_router.py
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/scripts/experiment_template.py
      TASK: Run 20 full generate+verify passes on a cached SOTA GGUF, generating complete answers.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. python/carnot/pipeline/odar_router.py imports without error — else blocked_odar_missing.
           b. python/carnot/training/fast_slow.py imports without error — else blocked_fst_missing.
           c. python/carnot/samplers/casal.py imports without error — else blocked_casal_missing.
           d. ls ~/.cache/huggingface/hub/ | grep -i "gemma-4-26B\|Qwen3.6-35B\|gemma-4-31B" returns
              non-empty — else blocked_model_not_cached. Do NOT fabricate GPU inference.
        1. MODEL_SPECS must include at least one of:
           - unsloth/Qwen3.6-35B-A3B-GGUF
           - unsloth/gemma-4-31B-it-GGUF
           - unsloth/gemma-4-26B-A4B-it-GGUF
        2. Construct 20 math/reasoning prompts (multi-step arithmetic, simple logic).
        3. For each prompt: generate a FULL ANSWER (minimum 50 tokens, not just next-token).
           Record the full generated text.
        4. For each answer: run ODAR routing; if deliberative, run FST context prep +
           CASAL constraint enforcement.
        5. Measure:
           - n_violations_found: count of answers where a constraint violation was detected
           - n_violations_repaired: count where repair reduced energy
           - mean_answer_length_tokens: must be >= 50 (not a one-token probe)
           - odar_fast_path_fraction: fraction routed to fast path
        6. Set fst_live_validated: true if n_violations_found >= 1 AND
           mean_answer_length_tokens >= 50.
        7. Write deliverable to results/experiment_2296_fst_live_gen.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if fst_live_validated is true."
        - fst_live_validated:
            principle: "Primary gate for exp2297 and exp2306. True only when violations were found in FULL answers (not token probes). Load-bearing anti-fabrication gate."
        - mean_answer_length_tokens:
            principle: "Must be >= 50 to distinguish from single-token probes. Value < 50 indicates the benchmark did not test full generation."
        - n_violations_found:
            principle: "At least 1 required to demonstrate the pipeline actually runs verification, not just pass-through generation."
        - n_violations_repaired:
            principle: "Records repair effectiveness; 0 is acceptable as an honest finding."
        - models_used:
            principle: "Records which SOTA GGUF ran so claims are model-specific and not hallucinated."
        - preconditions_checked:
            principle: "Lists which resources were verified before inference; pre-empts fabrication mode."
        - duration_s:
            principle: "Real compute with a 26B model takes minutes; < 60s for 20 problems flags fabrication."
        - random_seed:
            principle: "Reproducibility for the 20-example corpus."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2297-fr11-fst-multidomain-v3
    title: "Phase 1: FR-11 FST Multi-Domain Retention v3"
    milestone: "2026.05.226"
    deliverable: "results/experiment_2297_fr11_multidomain.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2295-pypi-escalation-fix-claude
        artifact_field: pretest_fixed
        op: "=="
        value: true
      - upstream: exp2296-fst-live-gen-v6
        artifact_field: fst_live_validated
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2283-fr11-fst-multidomain
        verdict: blocked_gate_check_failed
        addressed_by: "exp2283 was blocked because its upstream exp2282 (fst_live_validated) was itself blocked by the pre-test cascade. exp2295 fixes the cascade root cause. exp2296 now runs first. This attempt is identical in scope to exp2283 and runs only when exp2296.fst_live_validated=true."
      - experiment_id: exp2269-fr11-fst-multidomain
        verdict: blocked_gate_check_failed
        addressed_by: "exp2269 was blocked because exp2268 (fst_live_validated) was blocked by the pre-test cascade. 3rd consecutive milestone this FR-11 task has been blocked."
    prompt: |
      CONTEXT: FR-11 continuous self-learning mandate (PRD requirement). exp2241 (.222) proved
      FST achieves 4x sample efficiency on a single-domain synthetic corpus. This task validates
      that FST fast-weight updates generalize across domains: fast weights learned on math
      problems should partially help with code and logic problems. This is the mandatory
      continuous-self-learning experiment for milestone 2026.05.226.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/scripts/experiment_template.py
        {project_root}/results/experiment_2296_fst_live_gen.json
      TASK: Validate FST fast-weight retention across 3 reasoning domains.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/training/fast_slow.py imports without error — else blocked_fst_missing.
        1. Create 3 domain corpora (10 examples each, synthetic, no external LLM calls):
           Domain A: arithmetic (a + b = c style)
           Domain B: code constraints (loop bounds, array indices)
           Domain C: logic propositions (if P then Q style)
        2. Run FST learning in sequence: Domain A -> Domain B -> Domain C.
        3. After Domain C training, evaluate fast-weight performance on held-out Domain A examples.
        4. Measure:
           - cross_domain_retention_rate: accuracy on Domain A after Domain C / accuracy after Domain A
           - per_domain_utility_delta: energy reduction per domain
        5. Set fr11_multidomain_passed: true if cross_domain_retention_rate >= 0.75.
        6. Write deliverable with continuous_self_learning_task: true.
        7. Write deliverable to results/experiment_2297_fr11_multidomain.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if fr11_multidomain_passed is true."
        - continuous_self_learning_task:
            principle: "Must be true — FR-11 mandate requires at least one CSL task per milestone."
        - fr11_multidomain_passed:
            principle: "Boolean gate. True only when cross-domain retention >= 0.75; below means FST overfits per-domain."
        - cross_domain_retention_rate:
            principle: "Primary FR-11 multi-domain gate; computed as accuracy-on-A-after-C / accuracy-on-A-after-A."
        - per_domain_utility_delta:
            principle: "Per-domain energy reduction records whether FST helps each domain independently."
        - n_corpus_per_domain:
            principle: "Must be >= 10 per domain for the retention claim to be statistically non-trivial."
        - preconditions_checked:
            principle: "Lists FST module availability check; pre-empts fabrication on missing module."
        - random_seed:
            principle: "Reproducibility for the sequential domain training."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2298-kancl-n256-v5
    title: "Phase 1: KAN-CL n=256 Per-Knot Retention v5"
    milestone: "2026.05.226"
    deliverable: "results/experiment_2298_kancl_n256.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2295-pypi-escalation-fix-claude
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2284-kancl-n256-clean
        verdict: blocked_gate_check_failed
        addressed_by: "exp2284 had blocked_gate_check_failed because exp2281.pretest_fixed was false (codex produced no deliverable). exp2295 fixes that root cause. This attempt is identical in scope to exp2284 and runs only when exp2295.pretest_fixed=true."
      - experiment_id: exp2270-kancl-n256-clean-reattempt
        verdict: blocked_gate_check_failed
        addressed_by: "exp2270 had blocked_gate_check_failed because exp2267.pretest_fixed=false. Root cause: carnot.pypi_escalation missing symbols. 5th consecutive milestone where exogenous cascades have blocked n=256 validation."
    prompt: |
      CONTEXT: KAN-CL per-knot importance regularization was proven at small n in .221 (exp2231).
      Attempts at n=256 in .222 (exp2247, THRML contamination), .223 (exp2258, DualGPU
      ImportError), .224 (exp2270, pypi_escalation cascade), and .225 (exp2284, cascade again)
      have all failed for exogenous reasons. COOL (Springer 2026) demonstrated 20us update
      latency with KANs on n=256-class tasks. This task is a CLEAN re-attempt with NO THRML
      parity, NO bounded_kl metric — purely per-knot importance regularization and retention
      across sequential constraint domains at n=256 spin Ising scale.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/models/substrate_kan.py
        {project_root}/python/carnot/samplers/parallel_ising.py
        {project_root}/scripts/experiment_template.py
      TASK: Validate KAN-CL per-knot importance at n=256 without THRML parity measurement.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/models/substrate_kan.py imports without error — else blocked_kan_missing.
        1. Construct an Ising model with n=256 spins (random J and h, random_seed=42).
        2. Define 3 sequential constraint domains:
           Domain 1: ferromagnetic coupling (J_ij = +1 for nearest neighbors)
           Domain 2: antiferromagnetic coupling (J_ij = -1 for nearest neighbors)
           Domain 3: random sparse coupling (random J, 20% non-zero)
        3. Train KAN-CL with per-knot importance enabled for each domain in sequence.
        4. After Domain 3 training, evaluate accuracy on held-out Domain 1 test instances.
        5. Measure:
           - n256_retention_rate: accuracy on Domain 1 after Domain 3 / accuracy after Domain 1
           - per_knot_update_latency_us: mean update time per step in microseconds
           - n_active_knots: count of importance-weighted active knots after Domain 3
        6. Set kancl_n256_validated: true if n256_retention_rate >= 0.85.
        7. Write deliverable to results/experiment_2298_kancl_n256.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if n256_retention_rate >= 0.85."
        - kancl_n256_validated:
            principle: "Boolean gate for exp2306 (capstone). True only if retention >= 0.85 at n=256 scale. Closes the 5-milestone carry-forward."
        - n256_retention_rate:
            principle: "Primary COOL-parity gate; >= 0.85 means per-knot importance prevents catastrophic forgetting at this scale."
        - per_knot_update_latency_us:
            principle: "Records whether COOL's 20us budget is achievable; informs hardware feasibility story."
        - n_active_knots:
            principle: "Sparsity metric; fewer active knots = more efficient; records importance mask effectiveness."
        - n_spins:
            principle: "Must be 256 to confirm this is the n=256 scale experiment, not a smaller surrogate."
        - random_seed:
            principle: "Must be 42 for reproducibility of the sequential domain training."
        - preconditions_checked:
            principle: "Lists KAN module availability check."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2299-eidoku-csp-v2
    title: "Phase 2: Eidoku CSP Tier 2.8 Gate — First Actual Run (arXiv:2512.20664)"
    milestone: "2026.05.226"
    deliverable: "results/experiment_2299_eidoku_csp.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2295-pypi-escalation-fix-claude
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2289-eidoku-csp-gate
        verdict: not_run
        addressed_by: "exp2289 was one of 4 ungated tasks in .225 that still did not run — the conductor's system-wide pre-test check SKIP'd all tasks before they could execute. exp2295 fixes the pre-test cascade root cause. This attempt is now gated on exp2295.pretest_fixed so the pre-test is confirmed clean before activation."
    prompt: |
      CONTEXT: Eidoku (arXiv:2512.20664) reformulates LLM reasoning verification as a
      Constraint Satisfaction Problem (CSP) that operates independently of generation
      likelihood. The key mechanism: a lightweight System-2 gate that rejects candidates
      exceeding a context-calibrated cost threshold derived from the intrinsic statistics
      of the context, not a learned threshold. This catches "smooth falsehoods" — statements
      that are highly probable but structurally disconnected from the context.
      This is a natural Tier 2.8 verifier for Carnot's cascade, between Tier 2.7
      (CausalReasoningVerifier) and Tier 3 (Ising full verification).
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/verify/
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/scripts/experiment_template.py
      TASK: Implement a minimal EidokuCSPGate verifier and evaluate on 50 synthetic examples.
      CONCRETE STEPS:
        1. Create python/carnot/verify/eidoku_csp.py implementing:
           class EidokuCSPGate:
             - Takes (context: str, candidate: str) as input
             - Extracts structural constraints from context (entities, quantitative claims,
               logical connectives)
             - Formulates a cost function over how well candidate satisfies those constraints
             - Uses context-calibrated threshold (mean + k*sigma of cost over context sentences)
             - Returns: is_violation: bool, cost: float, constraint_violations: list[str]
        2. Write focused unit tests in tests/python/verify/test_eidoku_csp.py
           (at least 2 tests: one smooth-falsehood rejection, one correct-answer acceptance).
        3. Run the unit tests; record n_tests_passed.
        4. Evaluate on 50 synthetic examples (25 correct answers, 25 smooth falsehoods):
           - correct answers: rephrasings of context sentences (should NOT be rejected)
           - smooth falsehoods: plausible-sounding but structurally disconnected claims
        5. Measure:
           - csp_false_positive_rate: correct answers rejected / 25
           - csp_true_positive_rate: smooth falsehoods caught / 25
        6. Set eidoku_gate_validated: true if csp_true_positive_rate >= 0.60 AND
           csp_false_positive_rate <= 0.20.
        7. Write deliverable to results/experiment_2299_eidoku_csp.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if implementation produced a runnable module (a low TPR is an honest research finding, not a run failure)."
        - eidoku_gate_validated:
            principle: "Boolean. True when TPR >= 0.60 AND FPR <= 0.20 — practical operating point for a cascade verifier where false positives are more costly."
        - csp_true_positive_rate:
            principle: "Measures smooth-falsehood detection rate; Eidoku's CSP-based checking claims to catch this class that entropy methods miss."
        - csp_false_positive_rate:
            principle: "Guards against rejecting correct answers; a high FPR makes the gate useless as a cascade step."
        - n_tests_passed:
            principle: "Records unit test pass count; tests must pass for the implementation to be production-quality."
        - module_path:
            principle: "Records where the verifier was written; enables integration into verify_repair.py cascade."
        - n_eval_examples:
            principle: "Must be 50 (25+25) for the FPR/TPR claims to be statistically meaningful."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2300-projected-langevin-v2
    title: "Phase 2: Projected-Langevin vs CASAL Baseline — First Actual Run (arXiv:2605.05387)"
    milestone: "2026.05.226"
