    CONTEXT:
    Exp1490 showed partial-trace localization on injected failures but did not
    intervene during generation. The post-.114 sweep added interwhen:
    periodically poll reasoning traces, extract verifiable intermediate state,
    run asynchronous monitors, and interrupt only when an error is detected.
