  - id: exp6287-asp-continuous-relaxation
    milestone: "2026.08.542"
    deliverable: results/experiment_6287_asp_continuous_relaxation.json
    title: "Exact-vertex bounded continuous relaxation of ASP energy"
    priority: critical
    track: energy_reasoning
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 180
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6286-v541-evidence-eligibility-ledger
    prior_failures:
      - experiment_id: exp6274-asp-energy-semantic-compiler
        verdict: "complete: bounded ASP energy compiler matches clingo oracle on trusted fixtures"
        addressed_by: "This task preserves the exact discrete compiler and adds a bounded multilinear extension with vertex equality, analytic gradients, and explicit fractional-trap controls."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6274 supplies a trusted discrete ASP energy on bounded grounded programs. Carnot now needs a small bridge from exact discrete semantics to editable continuous state. Use the multilinear extension of the finite discrete energy. This guarantees equality on binary vertices. It does not establish a learned Kona model or a diffusion language model.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md V542 architecture-cue section
      - {project_root}/results/experiment_6274_asp_energy_semantic_compiler.json
      - {project_root}/results/experiment_6274_asp_energy_fixture_manifest.json
      - {project_root}/python/carnot/asp_energy.py
      - {project_root}/python/carnot/experiment_6274_asp_energy_semantic_compiler.py
      - {project_root}/tests/python/test_asp_energy_semantic_compiler_6274.py
      - {project_root}/openspec/capabilities/constraint-verification/spec.md
      - {project_root}/openspec/capabilities/phase3-kona/spec.md
      - {project_root}/ops/e2e-test-plan.md

      TASK
      Implement a bounded continuous relaxation for the exact discrete ASP energy. Use a multilinear extension over atom probabilities in [0,1]. Prove energy equality on every binary vertex of every eligible fixture. Implement analytic gradients and finite-difference checks. Compare blank, random, and partial-state starts under fixed step and restart budgets. Report fractional stationary points and rounding failures. Keep Clingo and cold exact enumeration as oracle controls.

      Required deliverable: {project_root}/results/experiment_6287_asp_continuous_relaxation.json.
      REQUIRED ARTIFACT FIELDS: status, upstream_compiler_path_hash_and_terminal_class, relaxation_definition_and_claim_boundary, source_paths_and_hashes, eligible_fixture_manifest_path_and_hash, fixture_count, atom_count_and_vertex_count_by_fixture, exact_vertex_energy_parity_by_fixture, parity_failure_count, analytic_gradient_definition, finite_difference_gradient_checks, refinement_optimizer_and_fixed_budgets, blank_random_and_partial_start_manifest, refinement_outcomes_by_start_fixture_and_seed, fractional_stationary_points_by_fixture, rounding_failures_by_fixture, exact_completion_controls, cold_start_controls, unsupported_size_and_syntax_controls, oracle_claim_boundary, asp_continuous_relaxation_ready_score, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, random_seeds, reproducibility_checksum, honest_verdict. parity_failure_count must be bare 0 for readiness. verifier_is_oracle must be true. Readiness requires exact vertex parity and gradient checks, not a positive refinement result. honest_verdict must begin with a terminal prefix. field_principles must give one short principle for every required field.

      CONCRETE STEPS
      0. PRECONDITIONS: freeze compiler and fixture hashes, maximum atom count, vertex budget, tolerances, optimizer budgets, seeds, and protected hashes.
      1. Add REQ-KONA-6287 and scenarios to openspec/capabilities/phase3-kona/spec.md before implementation. Update traceability.
      2. Add the smallest relaxation module under python/carnot/. Reject fixtures above the preregistered bounded state limit.
      3. Enumerate every binary vertex. Require exact equality with the Exp6274 energy decomposition.
      4. Implement analytic gradients. Check them against central finite differences away from the box boundary.
      5. Run blank, random, and partial-state starts with fixed budgets. Report success, final energy, restarts, and exact work separately.
      6. Add adversarial controls for fractional traps, rounding harm, label permutation, sign reversal, malformed bounds, and unsupported size.
      7. Run focused tests, spec coverage, applicable e2e checks, and adversarial verification. Record git status after tests.

      Run command: .venv/bin/python -m carnot.experiment_6287_asp_continuous_relaxation --date {date}
