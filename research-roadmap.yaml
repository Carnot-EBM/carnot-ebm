        - results/experiment_4231_oracle_distinct_arc_aggregator_model.json (the .392 pool stats to beat: 20 accepted/28399 rejected, wrong_majority_n 5; held_out_task_n 52)
        - results/experiment_4236_arc_incremental_progress.json + python/carnot/agentic/arc_agi3_world_model.py (the OFFLINE explore-induce-verify solver for a BOUNDED candidate top-up)
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Pre-Launch Preconditions", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: assemble the maximal cached ARC labeled pool (+ a bounded solver top-up if positives are short), grow wrong-majority + positive counts, persist the pool for A2.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any generation):
           a. The GAP-4 pools load: `python3 -c "import json,gzip; json.load(gzip.open('results/arc3_gap3_stage2_eval_pool.json.gz')); json.load(open('results/arc3_gap4_induced_programs.json'))"`.
