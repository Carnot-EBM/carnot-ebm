  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: Boltzmann-GPT (arXiv 2601.17094,\
    \ January 2026) separates world modeling (Deep Boltzmann Machine) from language generation\
    \ (frozen LLM). The DBM learns latent structure; an adapter projects DBM latent samples to\
    \ LLM embedding space. Carnot's IsingEBM is a specialized DBM (discrete, sparse, constraint-shaped).\
    \ BoltzmannRepairBridge applies this insight: when IsingEBM finds a low-energy configuration,\
    \ project it into the LLM's embedding space to generate a constraint-satisfying repair suggestion.\
    \ This replaces the current 'ask LLM to fix error' step with an energy-guided alternative.\n\n\
    CPU-only. Always produces a result JSON.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST)\n\
