- id: exp649-dualgpu-13b-v2
  milestone: 2026.04.49
  deliverable: results/experiment_649_dualgpu_13b_v2.json
  title: 'Exp 649: DualGPU 13B Proof v2 — Pre-Downloaded Weights, RETRO-071 Closure (GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-071: DualGPU 13B proof failed in Exp 632 because model weights for
    Qwen2.5-14B-Instruct (or 7B) were not cached locally, causing a model_load_failed result.
    Both RTX 3090s (48GB VRAM total) are available. This experiment re-runs the proof with
    explicit pre-download verification before attempting the split-GPU load.

    EXISTING CODE TO READ FIRST:
    - results/experiment_632_dualgpu_13b_proof.json — failed attempt, n_gpus=2,
      blocked_reason='model_load_failed' (read full result for diagnostics)
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Pre-verify HF cache, load 7B model across 2 GPUs, prove GPU-1 utilization.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-INFRA-092 (DualGPU 13B: model split across 2 RTX 3090s with GPU-1
       utilization > 50% during inference), SCENARIO-INFRA-099/100 to spec.
    3. Write scripts/experiment_649_dualgpu_13b_v2.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(649, timeout_minutes=60).
       c. ExperimentTemplate(649, 'DualGPU 13B Proof v2',
          'results/experiment_649_dualgpu_13b_v2.json', requires_gpu=True).
       d. GPU detection:
          import torch
          n_gpus = torch.cuda.device_count()
          if n_gpus < 2:
              write artifact with dualgpu_available=False, blocked_reason='only_one_gpu' and exit.
          vram_0_gb = torch.cuda.get_device_properties(0).total_memory / (1024**3)
          vram_1_gb = torch.cuda.get_device_properties(1).total_memory / (1024**3)
       e. HF cache pre-check:
          import os
          hf_home = os.environ.get('HF_HOME', os.path.expanduser('~/.cache/huggingface'))
          Check if any of these model dirs exist in hf_home:
            'Qwen/Qwen2.5-7B-Instruct', 'Qwen/Qwen2.5-14B-Instruct'
          cached_models = [m for m in candidates if cache_exists(m)]
          preferred_model = cached_models[0] if cached_models else None
          If no cached model:
              write artifact with model_loaded=False, blocked_reason='model_not_cached_HF_weights_required',
              action_required='Run: huggingface-cli download Qwen/Qwen2.5-7B-Instruct --local-dir ~/.cache/huggingface/hub/models--Qwen--Qwen2.5-7B-Instruct'
              and exit.
       f. If cached model found:
          from transformers import AutoModelForCausalLM, AutoTokenizer
          Layer split: 7B has 28 layers → cuda:0 gets layers 0-13, cuda:1 gets 14-27 + lm_head
          device_map = {f'model.layers.{i}': 'cuda:0' for i in range(14)}
          device_map.update({f'model.layers.{i}': 'cuda:1' for i in range(14, 28)})
          device_map.update({'model.embed_tokens': 'cuda:0',
                             'model.norm': 'cuda:1', 'lm_head': 'cuda:1'})
          model = AutoModelForCausalLM.from_pretrained(preferred_model, device_map=device_map,
              torch_dtype=torch.float16, low_cpu_mem_usage=True)
          tokenizer = AutoTokenizer.from_pretrained(preferred_model)
       g. Utilization measurement:
          import pynvml; pynvml.nvmlInit()
          baseline_util_1 = [pynvml.nvmlDeviceGetUtilizationRates(handle_1).gpu for _ in range(3)]
          Run 10 forward passes (batch_size=1, max_new_tokens=20, prompt='1+1='):
              For each: util_1 = pynvml.nvmlDeviceGetUtilizationRates(handle_1).gpu
          peak_gpu1_util = max(util_1_measurements)
          sustained_gpu1_fraction = sum(u > 10 for u in util_1_measurements) / 10
          del model; torch.cuda.empty_cache()
       h. Build artifact: schema='carnot.dualgpu_13b_v2.v1',
          n_gpus=<int>, vram_0_gb=<float>, vram_1_gb=<float>,
          model_loaded=<bool>, model_name=<str>,
          peak_gpu1_util=<float>, sustained_gpu1_fraction=<float>,
          dualgpu_proven=(peak_gpu1_util > 50 or sustained_gpu1_fraction > 0.5),
          retro_071_resolved=<bool>,
          honest_verdict='dualgpu_proven' if (model_loaded and peak_gpu1_util > 50)
            else 'dualgpu_loaded_low_util' if model_loaded
            else 'model_not_cached'.
       i. tmpl.assert_deliverable_written() as FINAL LINE.
    4. Write tests/python/test_experiment_649_dualgpu.py (100% coverage, mock torch.cuda).
    5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    6. Reconcile: ops/conductor-log.md (RETRO-071 status), ops/changelog.md.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
