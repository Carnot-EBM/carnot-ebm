        oracle_bestofn_accuracy:
          principle: "Upper bound -- must materially exceed SC for selectable headroom to exist (the positive control)."
        flip_count:
          principle: "How many selections the ensemble changes vs SC -- flip_count==0 means the test is degenerate (FALSE_NEGATIVE_RISK)."
        ensemble_selection_accuracy:
          principle: "Best-of-N accuracy selecting by ensemble energy -- the core number."
        confidence_selection_accuracy:
          principle: "Best-of-N by confidence -- the baseline the ensemble must beat."
        ensemble_vs_sc_delta_ci:
          principle: "Paired selection-accuracy delta + CI + McNemar vs SC -- the selection-value magnitude + significance."
        positive_control_valid:
          principle: "True iff oracle > SC AND flip_count > 0 -- without it a null is uninformative (the P0.1 lesson)."
        ensemble_adds_selection_value_sc_weak:
          principle: "BARE bool. True iff, on a headroom-bearing SC-weak corpus, ensemble selection materially beats both SC and confidence (delta CI excludes 0) -- the NEW-direction result. STORE AS BARE true/false."
        n_examples:
          principle: "Sample-size rigor (>=50 multi-candidate items)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "sc_accuracy present AND oracle_bestofn_accuracy present AND positive_control_valid == true"
          principle: "A selection-value verdict in the SC-weak regime requires a valid positive control (real headroom + nonzero flips) -- otherwise the result repeats the P0.1 degenerate-test trap."
      TERMINAL VERDICTS: "complete: ensemble_adds_selection_value_where_sc_weak_new_direction_positive" /
