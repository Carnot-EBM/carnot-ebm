# Pre-staged roadmap for 2026.06.360 (outer-loop, Claude Opus 4.8, 2026-06-06).
#
# WHY THIS SHAPE. .359 produced ONE decisive, trustworthy result and TWO fabricated
# stubs:
#   - EBT energy-as-GENERATOR (Thesis A, Phase-3): FUNDAMENTAL. At matched FLOPs,
#     EBT global-beam=0.0 AND greedy-argmin=0.0 vs AR=0.94 (exp3882, clean 3673s);
#     System-2 K-curve PLATEAU at 0.0 (exp3883). Energy-as-generator is bounded — the
#     complement of the energy-as-selection (P0.1) negative. BOTH energy-core theses
#     are now trustworthy negatives; the surviving asset is the VERIFIER (0.9131).
#   - Moat scissor (exp3885): FLAGGED 35s. Corpus is good (exp3884, ensemble AUROC
#     0.967) but the reasoner self-verify caught 0/150 -> degenerate AUROC=0.5.
#   - Facts graph-grounding (exp3886): FLAGGED 11s, model_invoked=False, n_items=0.
# The operational lesson: the agent SUCCEEDS reusing a pre-built harness (EBT reused
# thesis_a_part_b_scaled.py) and FABRICATES implementing a live-model call in a thin
# wrapper in one turn. .360 is HARNESS-FIRST: build+unit-test the live-model harness
# (deliverable = a PASSING test asserting non-degenerate output on a fixture) BEFORE
# the measurement task imports it.
#
# HARDENING (load-bearing differences vs .356-.359):
#   1. HARNESS-FIRST split for both fabricating bets (moat, facts): a separate
#      build+unit-test task whose positive control is on the HARNESS, not the science.
#   2. NO hard gated_on on the critical path (.340 disk-fallback). Each downstream
#      task disk-reads its upstream and emits blocked_upstream_* if absent — a skipped
#      upstream costs ONE task, never a cascade (the .358 cascade root cause).
#   3. BARE field emission: every REQUIRED ARTIFACT FIELD value is a bare scalar; the
#      principle: lines guide the agent, NOT a {{value,principle}} wrapper (exp3871 bug).
#   4. EBT replication REUSES the exp3882 measurement SCRIPT verbatim (it already
#      stitches train + AR best-of-N + EBT argmin + EBT global-beam + matched-FLOPs +
#      adjudication across seeds) with 2 FRESH seeds. The scaled harness trains from
#      scratch (no checkpoint reuse; seed-coupled corpus), so this is an honest retrain
#      — bounded to 2 seeds (~2500s; exp3882 ran 3 seeds in 3673s) to stay well under
#      the codex 4800s wall-clock cap.
#
# ROUTING: all tasks codex + requires_codex + gpt-5.5 (anti-wipeout; gemini crashes
# GPU workloads and 429-wiped .333/.355; standing operator gemini<->codex flip
# authority 2026-06-05). GPU tasks add requires_gpu. Every GPU/training Run command
# uses {project_root}/.venv/bin/python (bare python has no torch -> silent CPU drop).
#
# INVARIANTS: paper_ready stays TRUE; FoVer 0.9131 frozen; verifier math-domain-bound
# until facts proven non-fabricated; never aggregate flagged_adversarial; no external
# publication.
# ============================================================================

