- id: exp1136-wopr-slitherlink-cartridge
  milestone: 2026.04.88
  deliverable: results/experiment_1136_wopr_slitherlink_cartridge.json
  title: "WOPR Slitherlink Puzzle Cartridge — Loop Constraint Ising Encoding"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 20
  priority: low
  requires_gpu: false
  prompt: |
    CONTEXT:
    The WOPR games gallery has: Sudoku, GTW (Go-style Territory War), Lights Out, Hashi.
    Each game is a Slitherlink puzzle encoded as an Ising EBM where E=0 iff the solution is valid.

    Slitherlink is a Nikoli logic puzzle. Rules:
    - Grid of NxM cells, each with a clue digit (0, 1, 2, 3) or blank
    - Connect grid dots with horizontal/vertical edges to form a single closed loop
    - The digit in each cell = how many of its 4 edges are part of the loop
    - No branching, no dead ends, exactly one loop

    Ising encoding:
    - Spins: one spin per grid edge (1=in loop, -1=not in loop)
    - For a 3x3 grid: 12 horizontal edges + 12 vertical edges = 24 spins (binary)
    - Energy terms:
      a. CLUE_PENALTY: for each clued cell, |actual_edge_count - clue|^2 (penalizes wrong count)
      b. CONTINUITY_PENALTY: at each dot, if degree != 0 and degree != 2: penalty
         (each dot must have 0 or 2 edges; branching/dead-ends cost energy)
      c. LOOP_COMPLETENESS: if sum of all spins == 0: massive penalty (no edges at all)

    EXISTING CODE TO READ FIRST:
    - spaces/wopr-games/games/hashi.py (most recent cartridge — use as template)
    - spaces/wopr-games/games/lights_out.py (another example)
    - spaces/wopr-games/app.py (understand how cartridges are loaded)

    TASK:
    1. Create spaces/wopr-games/games/slitherlink.py following the Hashi cartridge template.
    2. Implement SlitherinkCartridge class with:
       - __init__(self, clues: list[list[int | None]], grid_size: tuple[int,int]):
         parse clues, initialize edge spins
       - energy(self, spins: np.ndarray) -> float: compute total energy from 3 penalty terms
       - sample(self, n_steps: int = 5000, beta_schedule: list = None) -> np.ndarray:
         run Gibbs sampling; return spins with lowest energy seen
       - to_display(self, spins: np.ndarray) -> str: ASCII display of the loop on the grid
    3. Implement and test a canonical 3x3 puzzle with known solution:
       Clues: [[None, 2, None],
               [2,   None, 2],
               [None, 2, None]]
       (This generates a diamond-shape loop — solvable with E=0)
    4. Add pytest tests:
       - test_energy_at_solution_is_zero()
       - test_energy_at_empty_is_nonzero()
       - test_clue_violation_adds_energy()
       - test_degree_violation_adds_energy()
    5. Verify: SlitherinkCartridge(clues, (3,3)).sample() achieves E=0 within 5000 steps

    CONCRETE STEPS:
    - cat spaces/wopr-games/games/hashi.py
    - (Implement slitherlink.py following the hashi.py pattern)
    - python3 -m pytest spaces/wopr-games/tests/test_slitherlink.py -v
    - python3 -c "
      from spaces.wopr_games.games.slitherlink import SlitherinkCartridge
      clues = [[None,2,None],[2,None,2],[None,2,None]]
      c = SlitherinkCartridge(clues, (3,3))
      spins = c.sample(n_steps=5000)
      print('E at convergence:', c.energy(spins))
      assert c.energy(spins) == 0.0
      "
    - Write results/experiment_1136_wopr_slitherlink_cartridge.json

    REQUIRED ARTIFACT FIELDS:
    - cartridge_file: str ("spaces/wopr-games/games/slitherlink.py")
    - cartridge_file_written: bool
    - n_spins: int (24 for 3x3 grid)
    - canonical_puzzle_e_at_convergence: float (target: 0.0)
    - n_iterations_to_convergence: int
    - slitherlink_cartridge_shipped: bool
    - tests_passing: int
    - honest_verdict: "e0_achieved" | "e_near_zero_below_01" | "e_above_threshold"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1136_wopr_slitherlink_cartridge.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

