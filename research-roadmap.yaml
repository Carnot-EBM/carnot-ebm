- id: exp1235-grpo-v6-fspo-vps-extended
  milestone: 2026.04.96
  deliverable: results/experiment_1235_grpo_v6_fspo_vps_extended.json
  title: "GRPO v6 — FSPO Per-Token Factuality Weighting + VPS (Extended 1200s Budget, DualGPU MANDATORY)"
  agent_type: codex
  model: gpt-5.5
  max_turns: 80
  estimated_wall_time_min: 90
  priority: high
  requires_gpu: true
  grace_period_s: 2400
  prior_failures:
    - experiment_id: exp1221-grpo-v6-fspo-vps-combined
      verdict: insufficient_logprob_coverage
      addressed_by: "exp1221 exhausted 480s wall budget at 848s elapsed; only 9 questions evaluated. This retry uses wall_budget_s=1200 (2.5x) to allow full evaluation. Also adds token regulation (arXiv 2511.00066) to weight high-logprob tokens more heavily, addressing the logprob coverage gap."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    GRPO v6 combines FSPO per-token factuality weighting (arXiv 2505.24630) with GRPO-VPS
    step-level process supervision (exp1220: vps_training_beats_v4). exp1221 failed because
    wall_budget_s=480 was exhausted at 848s elapsed; only 9 questions got full evaluation.

    Root cause (from exp1221): llama.cpp inference on Qwen3.6-35B-A3B at 35B scale takes
    ~90s per question × n_completions=4. At 9 questions that's 810s for just inference,
    plus overhead. Fix: wall_budget_s=1200 allows ~13 questions per training cycle.

    Also incorporate token regulation (arXiv 2511.00066): weight GRPO advantage by token
    log-probability so high-confidence tokens contribute more to the gradient signal.
    This directly addresses "insufficient_logprob_coverage" — token regulation focuses
    training on tokens where the model has meaningful signal.

    VPS baseline (exp1220): beats v4 +10pp floor.
    Target for v6: beats VPS alone by any positive margin (any delta > 0).

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    {{
      "experiment": "1235_grpo_v6_fspo_vps_extended",
      "status": "in_progress",
      "wall_budget_s": 1200,
      "grpo_v6_training_completed": false,
      "grpo_v6_improvement_pp": null,
      "honest_verdict": "in_progress"
    }}

    EXISTING CODE TO READ FIRST:
    - results/experiment_1221_grpo_v6_fspo_vps_combined.json (what went wrong: vps_baseline_accuracy=0.95, elapsed=848s)
    - results/experiment_1220_grpo_vps_full_training.json (VPS floor to beat)
    - python/carnot/training/latent_grpo.py (GRPO implementation)
    - python/carnot/pipeline/verify_repair.py (CausalReasoningVerifier, Z3MathVerifier)

    TASK:
    1. Write skeleton artifact (STEP 0).

    2. VERIFY PREREQUISITES:
       - GPU count: python3 -c "import torch; print(torch.cuda.device_count())"
       - GGUF model: find /home -name "*.gguf" 2>/dev/null | grep -i qwen3.6 | head -2
       - llama.cpp GPU: python3 -c "from llama_cpp import llama_cpp; print(llama_cpp.llama_supports_gpu_offload())"

    3. IMPLEMENT GRPO-VPS+FSPO WITH TOKEN REGULATION:
       a. VPS step reward (same as exp1220):
          For each reasoning step S: step_reward[S] = causal_score + z3_score
       b. FSPO factuality weighting (arXiv 2505.24630):
          For each token T in step S:
            factuality_weight[T] = max(0, causal_score(S))  # from CausalReasoningVerifier
            advantage[T] = step_reward[S] * factuality_weight[T]
       c. TOKEN REGULATION (arXiv 2511.00066):
          adjusted_advantage[T] = advantage[T] * softmax(log_prob[T])
          (high-probability tokens get full weight, low-probability tokens are down-weighted)
       d. Training loop: same 300s structural warm-up + 900s VPS+FSPO mix

    4. RUN TRAINING (wall_budget_s=1200):
       Training set: GSM8K questions 1800-2000 (fresh range)
       n_completions: 4 (reduced from 8 to allow more questions per budget)
       batch_size: 2 questions per GRPO update step

    5. EVALUATE on holdout (GSM8K 600-800):
       - fraction_correct_before and fraction_correct_after
       - grpo_v6_improvement_pp = 100 * (after - before)
       - beats_vps_floor = improvement > vps_baseline_improvement

    6. MEASURE logprob coverage quality:
       - mean_token_logprob (should be > -3.0 with token regulation)
       - fspo_coverage_fraction (fraction of steps with non-zero FSPO weight)

    CONCRETE STEPS:
    - python3 -c "import json; d={{'experiment':'1235_grpo_v6_fspo_vps_extended','status':'in_progress','wall_budget_s':1200,'grpo_v6_training_completed':False,'grpo_v6_improvement_pp':None,'honest_verdict':'in_progress'}}; open('results/experiment_1235_grpo_v6_fspo_vps_extended.json','w').write(json.dumps(d,indent=2))" 2>&1
