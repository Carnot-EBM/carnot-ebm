  - id: exp4167-outerloop-training-monitor
    milestone: 2026.06.386
    title: "OUTER-LOOP TRAINING MONITOR (READ-ONLY; the conductor's replacement for its retired continuation-training slot). Report the outer-loop contiguous run's status: stable-checkpoint val_exact_accuracy + mtime, train PID alive?, latest val from the contiguous_run metrics CSV, and whether val has crossed 0.85. LAUNCH NO TRAINING, run NO pkill/kill, WRITE NOTHING under the stable checkpoint dir."
    priority: high
    track: trm-baseline
    max_turns: 40
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-13 operator decision A: READ-ONLY monitor of the outer-loop-owned training — false-positive scope-match vs prior training tasks; forward difference = it does NOT train (the outer-loop owns training); it only reports status, preventing the .385 collision."
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4167_outerloop_training_monitor.json
    prompt: |
      CONTEXT: The OUTER-LOOP owns the TRM contiguous training. This task ONLY reports its status.
      It MUST NOT launch any training (no `uv run python src/nn/train.py`), MUST NOT run pkill/kill
      against train.py, and MUST NOT write anything under results/trm_runs/sudoku_extreme_baseline/.

      CONCRETE STEPS (all READ-ONLY):
        1. Read results/trm_runs/sudoku_extreme_baseline/last.ckpt mtime (torch.load -> epoch; do NOT modify).
        2. Read results/trm_runs/contiguous_run.pid; check if that PID is alive (`ps -o etime= -p <pid>`).
        3. Read the latest val_exact_accuracy from the contiguous_run metrics CSV (find results/trm_runs/contiguous_run_hydra -name metrics.csv).
        4. Report the trajectory + whether val has crossed 0.85 (faithful threshold for the graft).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A status report is COMPLETE; this task never fails on the science (it does not run any)."
        outerloop_train_alive:
          principle: "Bare bool: is the outer-loop training process running? Lets the graft know whether the checkpoint is stable (safe to read) or being written."
        current_val_exact_accuracy:
          principle: "Latest val from the outer-loop run; the convergence signal toward 0.87."
        baseline_faithful:
          principle: "Bare bool: val >= 0.85 AND train process NOT running -> the checkpoint is faithful + stable -> the graft may run."
        checkpoint_mtime:
          principle: "Stable-checkpoint mtime; advancing past Jun-13-00:41 confirms the outer-loop run is saving real progress."
      ACCEPTANCE: a read-only status report; NO training launched, NO pkill, NO checkpoint write.

  - id: exp4168-decisive-verifier-graft-defensive
    milestone: 2026.06.386
    title: "THE DECISIVE verifier graft — DEFENSIVE, gated on (val>=0.85 AND outer-loop train STOPPED). Reads (never writes/trains) the stable checkpoint. IF faithful+stable: rerank (verifier vs TRM-vote, pass@1 lift CI) + verifier-cert-vs-vote-cert RFT de-confound on a COPY of the checkpoint. IF not: DEFER honestly (outer-loop still training / not yet 0.85). Resolves the moat question + the DiffusionGemma gate when it fires."
    priority: high
    track: verifier-as-reward
    max_turns: 110
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-13: decisive verifier graft on the outer-loop-trained faithful baseline — false-positive scope-match vs prior graft attempts; forward difference = gated on (val>=0.85 AND train STOPPED) so it never collides with or reads-during-write the outer-loop run; operates on a COPY."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4168_decisive_verifier_graft_defensive.json
    prompt: |
      CONTEXT: The decisive verifier-as-reward test on the OUTER-LOOP-trained baseline. To avoid the
      .385 collision and read-during-write races, this task is DEFENSIVE and NON-DESTRUCTIVE.

      CONCRETE STEPS:
        0. PRECONDITIONS: read results/experiment_4167_*.json (or recompute): require baseline_faithful
           == True, i.e. val>=0.85 AND the outer-loop train PID is NOT alive. If NOT -> honest_verdict
           `graft_deferred_outerloop_training` + current val, and STOP (do NOT train, do NOT pkill the
           outer-loop run).
        1. COPY the stable checkpoint to a task-local path (never train/write the stable dir).
        2. RERANK arm: sample K candidate solutions per held-out puzzle from the copied checkpoint;
           rerank by the executable Sudoku verifier; pass@1 lift vs TRM-vote + vs oracle, bootstrap CI.
        3. RFT arm (de-confound): A=verifier-cert vs B=vote-cert corpus, N-matched; train each from the
           COPY (mode=default, max_time=cumulative+budget) -- NOT the stable checkpoint. Held-out
           exact-accuracy; load-bearing A vs B, CI95 excl 0.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An honest deferral, an A>B win, or an A~=B null are all COMPLETE."
        graft_deferred:
          principle: "Bare bool: True if the baseline was not faithful+stable -> deferred. Prevents an uninformative graft + a collision with the outer-loop run."
        rerank_lift_vs_vote:
          principle: "pass@1 lift from verifier-reranking (if grafted); the executable-verifier discrimination signal."
        rft_vs_ablation_delta:
          principle: "The de-confounded A-vs-B held-out delta with CI -- THE moat measurement."
        verifier_value_added:
          principle: "Bare bool: did the graft beat the vote ablation? Resolves the moat question + the DiffusionGemma gate."
      ACCEPTANCE GATE:
        - condition: "graft_deferred True (baseline not faithful/stable), OR a real graft on a COPY with rerank_lift + rft_vs_ablation_delta + verifier_value_added (CI95)"
          principle: "Either an honest deferral or a real graft on a copy; NEVER train/pkill the outer-loop-owned run (the .385 collision is forbidden)."

