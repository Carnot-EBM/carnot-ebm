           [0.3, 0.6]. If you cannot assemble a corpus with starting true accuracy >= 0.3 ->
           complete: blocked_cannot_assemble_nondegenerate_corpus (report the candidates' true accuracies).
           Do NOT run on a true_acc~0 corpus — that is the exp3533 artifact.

      CONCRETE STEPS:
        1. Assemble the non-degenerate corpus; verify starting true accuracy in [0.3, 0.6] (Step 0c).
           Build a FRESH grounding config; compute its verifier decision covariance + lambda_min +
           effective_k for the record.
        2. Run the FR-11 loop to N>=200 under Arm DEPLOY (conservative-default beta) and Arm CONTROL
           (beta=0). Track entropy, top-mode mass, pass_rate, true_accuracy (distinct arrays — runtime
           assert). collapse_detected = entropy below threshold / top-mode mass above threshold.
           PRINT one flushed progress line per arm every ~20 steps — defeats idle-timeout.
        3. Report collapse_detected per arm; deployment success = Arm DEPLOY prevents collapse to
           N>=200 while Arm CONTROL collapses.
        4. CONFIRM the deployed rule maintains output quality: Arm DEPLOY final true_accuracy NOT
           materially below the loop's starting accuracy. quality_maintained =
           (deploy_final_true_accuracy >= 0.9 * initial_true_accuracy).
