- id: exp430-fover-z3-step-labels
  milestone: 2026.04.32
  deliverable: results/experiment_430_fover_z3_labels.json
  title: 'Exp 430: FOVER-style Z3 step annotation — automatic CoT step labels for EORM training (arXiv 2505.15960)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: FR-11 (autonomous self-learning) has\
    \ missed 6 consecutive milestones because all EORM/JEPA retrains ran on synthetic data only.\
    \ The missing training signal is real (step, correct/incorrect) labels from live LLM inference.\n\n\
    FoVer (arXiv 2505.15960) shows that Z3/Isabelle can automatically annotate CoT reasoning steps\
    \ with correctness labels WITHOUT human annotation. Carnot's LLMz3Formalizer (Exp 357) already\
    \ has the Z3 machinery. This experiment builds the annotation pipeline: parse live CoT responses\
    \ from Exp 427 into steps, verify each step with Z3, produce (step_text, correct/incorrect) pairs\
    \ for EORM training.\n\nCONTEXT (VPRM, arXiv 2601.17223): Carnot's Ising/KAN tier IS a Verifiable\
    \ Process Reward Model — it assigns scores to reasoning steps using deterministic constraint checks.\
    \ The FOVER labels are the training targets for this PRM.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST)\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog (Exp 425)\n\
    - python/carnot/pipeline/llm_z3_formalizer.py — LLMz3Formalizer, _exec_z3_snippet (Exp 357)\n\
    - python/carnot/pipeline/extractor_comparison.py — ExtractionBenchmarkResult (Exp 358)\n\
    - results/experiment_427_precision_live_confirmed.json — live CoT pairs (if available)\n\
    - scripts/experiment_422_vprm_step_labels.py — prior attempt (read for context)\n\
    \nTASK: Implement FOVER-style Z3 step annotation pipeline.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-LEARN-030 (FOVERAnnotator: parse CoT steps, annotate each with Z3 labels),\n\
