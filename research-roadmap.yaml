- id: exp1390-arxiv-submission-sword-api
  milestone: 2026.04.108
  deliverable: results/experiment_1390_arxiv_submission_sword_api.json
  title: "arXiv Submission via SWORD API or Manual Upload Instructions"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 30
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1380-arxiv-bundle-v11-submission
      verdict: submission_attempted_false_arxiv_upload_cli_missing
      addressed_by: "exp1380 created the bundle (results/arxiv_bundle_v11.tar.gz) and confirmed arxiv_submission_ready=true from exp1379 audit (critical_issues_after_audit=0). The blocker was the arxiv_upload CLI not being installed. This task uses the arXiv SWORD/APP Deposit API (requests-based, no CLI dependency) or produces a complete step-by-step manual submission checklist with the ready bundle."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    The Carnot arXiv paper is ready to submit. The paper integrity audit
    (exp1379) found critical_issues_after_audit=0 and arxiv_submission_ready=true.
    The arXiv bundle v11 was created at results/arxiv_bundle_v11.tar.gz
    (exp1380). The only blocker was the arxiv_upload CLI being absent. This
    task submits the paper using the arXiv SWORD/APP Deposit API (HTTP requests
    via Python's requests library — no CLI needed) or, if API credentials are
    unavailable, produces a complete step-by-step manual upload checklist with
    the ready bundle so the operator can complete submission in < 5 minutes.
    Use {project_root} as the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - results/experiment_1380_arxiv_bundle_v11_submission.json
    - results/experiment_1379_paper_integrity_audit_v2.json
    - ops/server.md

    TASK:
    Attempt programmatic arXiv submission via the SWORD/APP Deposit API.
    If API credentials are not available, produce a complete manual submission
    checklist with the ready bundle path and all required metadata.

    REQUIRED ARTIFACT FIELDS:
    - status
    - bundle_path
    - submission_attempted
    - submission_method
    - arxiv_id_if_submitted
    - submission_result
    - manual_checklist_generated
    - manual_checklist_path
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1390_arxiv_submission_sword_api.json immediately with status="in_progress".
    2. Verify results/arxiv_bundle_v11.tar.gz exists and is non-empty.
    3. Check ops/server.md for any arXiv API credentials or submission configuration.
    4. Attempt SWORD/APP Deposit submission:
       a. POST to https://arxiv.org/sword/deposit with bundle and metadata.
       b. Required metadata: title, abstract, authors (ian@blenke.com), category cs.LG, license CC-BY-4.0.
       c. If credential missing, generate docs/arxiv-manual-submission-checklist.md with:
          - Exact URL to upload: https://arxiv.org/submit
          - Bundle path: results/arxiv_bundle_v11.tar.gz
          - All required metadata fields pre-filled
          - Step-by-step screenshot-style instructions
    5. Record submission_attempted=true if API call was made (regardless of result).
    6. Record arxiv_id_if_submitted if returned by API.
    7. Record submission_result with API response or "manual_checklist_generated" if no credentials.
    8. Set manual_checklist_generated=true if checklist was written.
    9. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1390_arxiv_submission_sword_api.json')); print(d.get('submission_attempted'), d.get('submission_result'), d.get('arxiv_id_if_submitted'), d.get('honest_verdict'))"
