    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement EBRM baseline. Train on FoVer labeled steps. Compare AUROC to EORM baseline.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-EBRM-001 (EBRM implementation MUST model energy as E(response, reward)
       using a 2-layer MLP trained with negative log-likelihood; MUST be compared to EORM
       on same FoVer v2 test split), REQ-EBRM-002 (EORM vs EBRM comparison MUST report
       both in-distribution and OOD AUC; if EORM > EBRM on step-level tasks, log as
       architectural_advantage=True), SCENARIO-EBRM-001/002 to
       openspec/capabilities/self_learning/spec.md.
    3. Implement python/carnot/pipeline/ebrm_baseline.py:
       a. EBRMEnergy(feature_dim=128, hidden_dim=64):
          energy(response_features, reward_scalar) -> float:
            - Concatenate response TF-IDF embedding with reward scalar.
            - 2-layer MLP → scalar energy value.
          log_prob(response_features, reward_scalar) -> float:
            - Return -energy(response_features, reward_scalar) (unnormalized).
          score(response_text) -> float:
            - Compute TF-IDF embedding of response.
            - Estimate reward = 1.0 if labeled correct, 0.0 if incorrect (from training).
            - Return -energy(embedding, reward).
       b. EBRMTrainer(model: EBRMEnergy):
          train(step_texts: list[str], labels: list[int],
                n_epochs=200, lr=1e-3) -> None:
            - For positive samples (label=1): minimize energy(features, reward=1.0).
            - For negative samples (label=0): maximize energy(features, reward=0.0).
