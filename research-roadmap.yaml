      retire_if_same_verdict: false
  title: 'Exp 923: DRIFTProbe Ensemble — Multi-Layer Weighted Ensemble (arXiv 2604.13386) (GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
