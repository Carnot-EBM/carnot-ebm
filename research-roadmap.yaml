  - id: exp3001-sota-gguf-cache-carry-forward-checksum-refresh
    milestone: "2026.05.282"
    deliverable: "results/experiment_3001_sota_gguf_cache_carry_forward_checksum_refresh_v1.json"
    title: "SOTA GGUF cache carry-forward and checksum refresh"
    priority: critical
    model: opus
    requires_claude: true
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 60
    track: "infrastructure"
    inference_substrate: "live_llm_inference"
    prior_failures:
      - experiment_id: exp2989-sota-gguf-cache-provenance-preflight
        verdict: "success: at least one mandated headline SOTA GGUF produced a live transcript"
        addressed_by: "Refreshes the same local SOTA cache with checksum and transcript evidence before any .282 live LLM task runs."
        retire_if_same_verdict: true
      - experiment_id: exp2977-sota-intent-preserving-code-repair
        verdict: "blocked_cached_sota_pair_unavailable_cpu_smoke_only"
        addressed_by: "Keeps model availability isolated as a prerequisite gate rather than discovering cache failure inside repair."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp 2989 proved at least one mandated headline SOTA GGUF could produce a live transcript, but .282 live tasks still need fresh cache, checksum, duration, and transcript evidence. This task is the upstream gate for all .282 live local LLM claims.

      MODEL_SPECS:
      - headline_models:
        - unsloth/Qwen3.6-35B-A3B-GGUF
        - unsloth/gemma-4-31B-it-GGUF
        - unsloth/gemma-4-26B-A4B-it-GGUF
      - smoke_only_models:
        - Qwen/Qwen3.5-0.8B
        - unsloth/gemma-4-E4B-it-GGUF
      - Use python/carnot/inference/sota_models.py and the cached_sota_pair() pattern when applicable.
      - A headline SOTA result requires at least one headline model to produce a real transcript with cache/provenance fields.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - scripts/experiment_template.py
      - scripts/experiment_2989_sota_gguf_cache_provenance_preflight_v1.py
      - python/carnot/inference/sota_models.py
      - python/carnot/inference/
      - results/experiment_2989_sota_gguf_cache_provenance_preflight_v1.json
      - research-hardware-wishlist.md

      TASK:
      Refresh the mandated local SOTA GGUF cache evidence for .282. Emit a terminal blocked artifact if no headline model can run. Do not substitute legacy small models for headline readiness.

      CONCRETE STEPS:
      0. PRECONDITIONS: record CUDA/GPU availability, free VRAM if available, repo commit, Python environment, cache paths, and checksum feasibility before any model load.
      1. Add a focused exp3001 script under scripts/ following scripts/experiment_template.py.
      2. Attempt the mandated headline models in MODEL_SPECS with conservative prompts and timeouts.
      3. For each attempted model, record exact model id, local cache path, file/checksum evidence when available, load status, generation status, duration, and transcript path/hash.
      4. If no headline model runs, optionally run a legacy small smoke test but label it smoke_only and set sota_headline_ready=false.
      5. Write the JSON artifact and ensure honest_verdict is terminal and explicit.
      6. Run the new script and any relevant unit/import checks.

      REQUIRED ARTIFACT FIELDS:
      - sota_headline_ready: bool (principle: downstream headline tasks must gate on real SOTA availability)
      - preconditions_checked: bool (principle: compute-bound failures must distinguish environment from method failure)
      - model_specs: dict (principle: model identity must be explicit)
      - sota_models_attempted: list (principle: failed availability must be auditable)
      - sota_models_available: list (principle: successful availability must be auditable)
      - cache_paths: dict (principle: model provenance must be local and inspectable)
      - model_checksums: dict (principle: repeated runs must be tied to exact artifacts when feasible)
      - live_transcript_paths: list (principle: live inference claims require replayable output evidence)
      - legacy_smoke_only_used: bool (principle: small models must not become headline evidence)
      - inference_substrate: str (principle: substrate claims must match actual execution)
      - duration_seconds: float (principle: impossible-duration artifacts must be catchable)
      - honest_verdict: str (principle: terminal verdict must state ready or blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3002-metamorphic-repair-oracle-audit
    milestone: "2026.05.282"
    deliverable: "results/experiment_3002_metamorphic_repair_oracle_audit_v1.json"
    title: "Metamorphic repair-oracle audit for hard-set repair"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 50
    estimated_wall_time_min: 60
    track: "code_repair"
    inference_substrate: "verifier_ensemble_against_cached_candidates"
    prior_failures:
      - experiment_id: exp2991-gated-sota-intent-preserving-repair-hard-set
        verdict: "flagged: hard-set repair did not clear promotion gates"
        addressed_by: "Adds metamorphic variants, tautology checks, and false-accept provenance before another live repair rerun."
        retire_if_same_verdict: true
      - experiment_id: exp2964-sota-dccd-repair-replication
        verdict: "complete: DCCD repair replication did not clear promotion gates; pass@1_delta=-0.2, syntax_failure_rate_delta=0.30000000000000004, false_accept_delta=-0.05"
        addressed_by: "Audits the repair oracle and false-accept path instead of tightening output format alone."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp 2991 produced a positive hard-set repair delta but remained flagged because methodology, tautology, and false-accept provenance did not clear promotion gates. Recent metamorphic-testing work in research-references.md suggests relation-preserving variants are the right next methodology repair.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - research-references.md
      - scripts/experiment_2991_gated_sota_intent_preserving_repair_hard_set_v1.py
      - results/experiment_2991_gated_sota_intent_preserving_repair_hard_set_v1.json
      - datasets/repair_hard/manifest_v1.jsonl if present
      - tests/
      - python/carnot/

      TASK:
      Build and run a deterministic metamorphic oracle audit for the hard-set repair benchmark. Produce relation-preserving variants, false-accept probes, and tautology checks. Do not run live LLM repair in this task.

      CONCRETE STEPS:
      1. Add a focused exp3002 script following scripts/experiment_template.py.
      2. Load the exp2991 hard-set manifest or reconstruct the item list from exp2991 artifacts if the manifest path moved.
      3. Define conservative metamorphic relation types such as alpha-renaming, equivalent boundary cases, input permutation where order is irrelevant, and oracle-preserving refactors.
      4. Generate a small bounded set of variants for each eligible source item and reject variants that change the intended semantics.
      5. Run executable validators on original and variant cases against reference, baseline, and any cached exp2991 repair candidates.
      6. Produce false-accept and tautology probes: tests that would pass an overfit repair but fail the independent verifier, or constraints that are satisfied vacuously.
      7. Write the artifact with manifest paths, rejected variants, verifier logs, and promotion readiness.

      REQUIRED ARTIFACT FIELDS:
      - metamorphic_oracle_ready: bool (principle: downstream repair must gate on a usable oracle)
      - hard_set_manifest_path: str (principle: benchmark source must be inspectable)
      - metamorphic_manifest_path: str (principle: generated variants must be inspectable)
      - n_source_items: int (principle: source sample size must be explicit)
      - n_metamorphic_variants: int (principle: amplification size must be explicit)
      - relation_types: list (principle: oracle logic must be auditable)
      - false_accept_probe_ready: bool (principle: repair promotion must account for false accepts)
      - tautology_probe_ready: bool (principle: repair promotion must reject vacuous wins)
      - rejected_variants: list (principle: invalid generated cases must not be hidden)
      - verifier_transcript_paths: list (principle: oracle evidence must be replayable)
      - honest_verdict: str (principle: terminal verdict must state ready, flagged, or blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3003-gated-sota-repair-metamorphic-false-accept-rerun
    milestone: "2026.05.282"
    deliverable: "results/experiment_3003_gated_sota_repair_metamorphic_false_accept_rerun_v1.json"
