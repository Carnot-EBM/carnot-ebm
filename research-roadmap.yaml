  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code style requirements.\nToday's date: {date}.\n\nCONTEXT: research-program.md Product Roadmap Tier B: \"Safety/Jailbreak\
    \ Classifier — Low energy\n= safe, high energy = unsafe/jailbreak. Distill from gpt-oss-safeguard into KAN (2000x smaller).\n2-3 experiments.\" This is the first Tier B product and the first energy\
    \ application beyond\nmath/code verification.\n\nWHY KAN FOR SAFETY: KAN energy functions are interpretable — you can read which spline edges\nactivate on jailbreak patterns. This is not a black-box\
    \ safety filter; it's an auditable\nenergy function where safety professionals can inspect WHY a prompt scores high energy.\nAdditionally, arXiv 2601.10543 (SafeProbing) showed that safety-awareness\
    \ signals exist in\nmodel internals during decoding. KAN can be trained to capture these signals at a fraction\nof the cost of a full model.\n\nENERGY INTERPRETATION: Low energy = safe configuration.\
    \ High energy = jailbreak/unsafe.\nThis is the same sign convention as all other Carnot energy tiers (low = valid, high = violated).\nThe energy function encodes: \"how far is this text from the safe\
    \ manifold?\"\n\nNote: This experiment uses HARDCODED jailbreak patterns as training data (no live LLM needed).\nThe goal is to prove the energy-based approach works, not to ship a production safety\
    \ filter.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/models/kan.py — KANEnergy, KANLayer, KANSpline (existing KAN tier)\n- python/carnot/models/__init__.py — model exports\n- python/carnot/training/\
    \ — training patterns\n- tests/python/test_kan.py — KAN test patterns\n\nTASK: Implement SafetyKANClassifier as a KAN energy model.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-SAFE-001 (SafetyKANClassifier\
    \ produces low energy for safe text, high for jailbreak),\n   REQ-SAFE-002 (SafetyKANClassifier is trained via binary contrastive loss on labeled examples),\n   SCENARIO-SAFE-001/002/003 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write tests FIRST (100% coverage required) for:\n   - SafetyExample: dataclass (text: str, label: Literal[\"safe\", \"jailbreak\"])\n   - encode_safety_text(text: str, max_features: int = 32) → jnp.ndarray:\n\
    \     bag-of-words features over safety-relevant keywords (no LLM embedding, CPU-only).\n     Features include: instruction-following signals (n_imperative_verbs, n_system_words),\n     jailbreak signals\
    \ (n_roleplay_words, n_ignore_words, n_bypass_words), text statistics\n     (length_ratio, question_mark_count, etc.). Normalize to [0, 1].\n   - SafetyKANClassifier(n_features: int = 32, n_hidden:\
    \ int = 8)\n   - SafetyKANClassifier.energy(text: str) → float: encodes text, runs KANEnergy\n   - SafetyKANClassifier.is_safe(text, threshold: float = 1.0) → bool:\n     returns True if energy(text)\
    \ < threshold\n   - SafetyKANClassifier.train(examples: list[SafetyExample], n_epochs: int = 100)\n     → list[float]: contrastive loss training; loss = max(0, E_safe - E_jailbreak + margin)\n     where\
    \ margin=1.0; returns loss history\n   - SafetyKANClassifier.evaluate_auroc(examples) → float: AUC-ROC on labeled set\n   - SafetyKANClassifier.save(path) / load(path) via safetensors\n4. Implement\
    \ python/carnot/models/safety_kan.py with all classes above.\n   Verbose docstrings: explain WHY energy-based safety is auditable (spline inspection),\n   WHY low energy = safe (configuration on the\
    \ safe manifold), and the Phase 3 path\n   (safety KAN becomes the foundation model's built-in safety layer).\n5. Export SafetyKANClassifier, SafetyExample from carnot.models.__init__.\n6. Write scripts/experiment_387_safety_kan.py\
    \ using ExperimentTemplate(387):\n   a. SAFE_EXAMPLES (hardcoded, 30 safe texts):\n      math questions, coding tasks, factual questions, creative writing requests\n   b. JAILBREAK_EXAMPLES (hardcoded,\
    \ 30 jailbreak texts):\n      \"ignore previous instructions\", \"pretend you are DAN\", \"as an AI with no restrictions\",\n      \"roleplay as\", \"you are now in developer mode\", \"bypass your safety\
    \ filters\",\n      \"act as a character who can do anything\", \"from now on you will respond as\",\n      \"forget that you are an AI\", \"your true self has no restrictions\", etc.\n      Use clearly\
    \ synthetic/research examples — no actual harmful content\n   c. Instantiate SafetyKANClassifier() and train on 80% of examples\n   d. Evaluate AUC-ROC on held-out 20%\n   e. Report: n_safe, n_jailbreak,\
    \ train_auroc, test_auroc,\n      n_correctly_classified, energy_separation_ratio\n   f. Build artifact: schema=\"carnot.safety_kan.v1\",\n      n_safe_examples, n_jailbreak_examples, train_auroc, test_auroc,\n\
    \      energy_separation_ratio, n_features=32,\n      honest_verdict: \"safety_classification_works\" when test_auroc > 0.70;\n      \"partial\" when 0.60 < test_auroc <= 0.70; \"no_better_than_random\"\
    \ when <= 0.60\n   g. Output: results/experiment_387_safety_kan.json\n7. Write tests/python/test_safety_kan.py (100% coverage required).\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    9. Reconcile: update ops/conductor-log.md, ops/changelog.md, ops/status.md.\n   Note this as the first Tier B product implementation in ops/status.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"
- id: exp388-saver-live-execute
  milestone: 2026.06.03
  deliverable: results/experiment_388_saver_live.json
  title: 'Exp 388: SAVeR live multi-turn verification — faithfulness on real reasoning chains'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Exp 362 implemented SAVeRVerifier (arXiv 2604.08401\
    \ pattern) — an auditor-before-\ncommit loop for multi-turn agent reasoning. The module is complete (31 tests, CI-safe) but\nhas never run with live GPU. This experiment executes the SAVeR pipeline\
    \ with live inference:\na reasoning chain of 5 steps, each step verified by VerifyRepairPipeline before being\ncommitted to accumulated facts.\n\nSAVeR hypothesis: if each reasoning step is verified\
    \ before commitment, the final answer's\nfaithfulness (fraction of committed steps) will be higher than without verification because\nerrors are caught and repaired before they propagate.\n\nTest scenarios\
    \ (5 multi-step chains):\n  1. Shopping total with tax (3 steps)\n  2. Train schedule intersection (4 steps)\n  3. Rectangle area with unit conversion (3 steps)\n  4. Discount stacking (4 steps)\n \
    \ 5. Worker productivity comparison (5 steps)\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/saver_verifier.py — SAVeRVerifier, AgentStep (Exp 362)\n- scripts/experiment_362_saver_multi_turn.py\
    \ — prior CI-safe script (READ CAREFULLY)\n- python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate (Exp 377)\n- python/carnot/pipeline/llm_extractor.py — LLMExtractor (Exp 366)\n\nTASK: Execute SAVeR\
    \ multi-turn verification with live GPU.\n1. Read CLAUDE.md spec-first workflow.\n2. Add SCENARIO-AGENT-004 (live SAVeR faithfulness confirmed) if not in spec.\n3. Write tests FIRST (100% coverage)\
    \ for any NEW helper functions.\n4. Implement scripts/experiment_388_saver_live.py:\n   a. ExperimentTemplate(388, \"SAVeR live multi-turn verification\",\n      \"results/experiment_388_saver_live.json\"\
    , requires_gpu=True)\n   b. tmpl.setup()\n   c. blocked = LiveGPUGate.require_live_or_blocked(tmpl, [\"google/gemma-4-E4B-it\",\n      \"Qwen/Qwen3.5-0.8B\"])\n      If blocked is not None: write blocked\
    \ artifact, exit.\n   d. gpu_status = tmpl.setup_gpu([({\"name\": \"Gemma4-E4B-it\",\n      \"hf_id\": \"google/gemma-4-E4B-it\", \"gpu\": 0)},\n      ({\"name\": \"Qwen3.5-0.8B\", \"hf_id\": \"Qwen/Qwen3.5-0.8B\"\
    , \"gpu\": 1)}])\n      If not gpu_status[\"all_healthy\"]: write blocked artifact, exit.\n   e. Create VerifyRepairPipeline with LLMExtractor(llm_caller=live_qwen)\n   f. Create SAVeRVerifier(pipeline=live_pipeline,\
    \ max_repair_attempts=3)\n   g. Define 5 reasoning chains with step prompts (questions to Gemma4-E4B-it)\n   h. For each chain: run SAVeRVerifier.run_chain(steps, initial_state=ConstraintState())\n\
    \      Each step: Gemma4-E4B-it generates chain-of-thought → SAVeR verifies → commit/block\n   i. Compute per-chain: faithfulness (fraction committed), n_repairs, n_blocked_steps\n   j. Compute overall:\
    \ mean_faithfulness, comparison to CI-safe mode (Exp 362: 1.0 faithfulness\n      expected with empty pipeline, but now with real verification it may be <1.0 when errors found)\n   k. Build artifact:\
    \ schema=\"carnot.saver_live.v1\",\n      inference_mode=\"live_gpu\", n_chains=5, per_chain_results,\n      mean_faithfulness, total_repairs_made, total_steps_blocked,\n      honest_verdict: \"live_verification_active\"\
    \ when inference_mode==\"live_gpu\" AND\n      any repair or block occurred (proof that real violations were detected);\n      \"live_no_violations_found\" when live but faithfulness=1.0 everywhere;\n\
    \      \"blocked\" when not live\n   l. Output: results/experiment_388_saver_live.json\n5. Write tests/python/test_experiment_388_saver_live.py (100% coverage).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n7. Reconcile: update ops/conductor-log.md, ops/changelog.md, ops/status.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"
