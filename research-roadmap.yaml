  - id: exp5727-arc-generalization-live-oracle-gap-v511
    milestone: "2026.07.511"
    title: "First ARC-AGI-3 Generalization-Testing Floor task: fresh live-vs-oracle gap sweep across the fully-cleared 25-game registry"
    priority: critical
    track: arc-live
    deliverable: results/experiment_5727_arc_generalization_live_oracle_gap_v511.json
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    estimated_wall_time_min: 240
    prior_failures:
      - experiment_id: exp4258-arc-oracle-distinct-cross-game-transfer
        verdict: "blocked_arc_game_ids_unrecoverable (held_out_game_n=0, held_out_task_n=0 -- the run never
          recovered real held-out game data; an infrastructure/data-recovery block, not a substantive
          research negative)"
        addressed_by: "exp5727 does not repeat exp4258's game-ID-recovery mechanism at all. It uses a
          completely different, already-proven-working harness (scripts/arc_leaderboard_eval.py --games
          oracle), which already ran successfully on at least one game on 2026-07-16
          (results/arc_live_oracle_gap.json) -- i.e. the precondition that blocked exp4258 does not apply
          here. This task extends that already-functioning harness to a full 25-game sweep (now that all
          25 public games are registry-cleared, per the 2026-07-17 Generalization-Testing Floor) rather
          than re-attempting exp4258's blocked cross-game-transfer approach."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      CLAUDE.md's "ARC-AGI-3 Generalization-Testing Floor" (2026-07-17) replaces the retired public-game-solving floor: all 25 public survey games now show full_game_clear=true (183/183 levels; ops/arc_solve_registry.yaml reproducible_total_games=25 — bp35 and lf52, the last two, were both solved 2026-07-17). This is task class 1 of that floor: held-out/leave-one-game-out live-path measurement. The REAL shipped scored agent is E3AgentPolicy (make_carnot_agent(Agent, cascade=True), the competition default). It never imports arc_game_adapters.py and never calls load_solutions() -- it is ALREADY frame-only, adapter-free, and banked-solution-free by construction (verified this session: grepping arc_competition_agent.py for GameAdapter/get_adapter returns nothing; only the retired cascade=False CarnotAgentPolicy path, explicitly documented as "useless on the hidden eval", touches load_solutions()). The measurement harness scripts/arc_leaderboard_eval.py --games oracle already runs exactly this comparison (fresh E3AgentPolicy vs the offline-dev oracle ceiling read live from the registry) but has never been run as a full 25-game sweep, and its last run (results/arc_live_oracle_gap.json, 2026-07-16) covered only 1 game and predates today's bp35 (8->9) and lf52 (7->10) wins. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md ("ARC-AGI-3 Generalization-Testing Floor" section, and "ARC Live-Path Reachability Discipline")
      - {project_root}/ops/arc_solve_registry.yaml
      - {project_root}/ops/verifier_gaps.md
      - {project_root}/scripts/arc_leaderboard_eval.py
      - {project_root}/python/carnot/agentic/arc_competition_agent.py
      - {project_root}/python/carnot/agentic/arc_solver_kit.py
      - {project_root}/results/arc_live_oracle_gap.json

      TASK:
      Run a fresh, full-registry live-vs-oracle gap measurement using the REAL shipped E3AgentPolicy cascade at a submission-faithful action budget, then honestly characterize (do NOT attempt to fix) the 3 worst gaps with evidence grounded in the actual run, and emit results/experiment_5727_arc_generalization_live_oracle_gap_v511.json.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any run; on any failure write the matching honest_verdict and stop, do not proceed or fabricate):
         a. Confirm the frozen live generator GGUF (Qwen3.5-9B-MTP) is locally cached -- E3AgentPolicy's tier-3 escalation lazily loads it only on a tier-1 stall (arc_competition_agent.py's `_proposer()`). Missing -> honest_verdict=blocked_qwen35_9b_gguf_not_cached.
         b. Confirm `ops/arc_solve_registry.yaml` currently shows `reproducible_total_games: 25` -- the premise this task is built on. If a game has regressed or the registry has changed since this task was drafted -> honest_verdict=blocked_registry_premise_stale; do not proceed with a mismatched baseline.
         c. Per the documented GGUF outer-loop GPU-pinning gotcha, any LocalGGUFProposer instantiation this run triggers must use CARNOT_ARC_GENERATOR_CUDA_GPU set correctly and a non-default port, so tier-3 induction cannot silently fall back to the slow iGPU or attach to a stale server on the conductor's default port.
      1. Run `python3 scripts/arc_leaderboard_eval.py --games oracle --policy e3 --budget 400`. Use --budget 400, NOT the harness's default of 20000: 400 matches the real submission's MAX_ACTIONS cap in arc_competition_agent.py's CarnotAgent class, so the resulting live number is directly comparable to what the actually-shipped agent could achieve in the real scored eval, not an inflated unbounded-exploration number. This overwrites results/arc_live_oracle_gap.json with a fresh sweep covering every one of the 25 registry-cleared games.
      2. Read the resulting per-game gap list. Select the 3 games with the largest `gap_vs_oracle` (break ties toward games whose registry win used development_proxy solve_provenance over live_agent_self_discovery, since whether source-assisted offline wins transfer worse to the frame-only live path than pure-live wins is the more informative comparison). For each, investigate using ONLY the public frames/logs/diagnostics the harness and policy already recorded during this run (navigation_diagnostics, the frame sequence, any induction trace the policy exposes) -- do NOT read the game's source, do NOT hand-solve it, do NOT build any per-game fix. Characterize the stall honestly as one of: PERCEPTION (the agent never correctly identifies the key objects/mechanics visible in the frames), SEARCH/BUDGET (it identifies the right structure but the 400-action budget or search strategy doesn't reach the needed depth), INDUCTION QUALITY (the world-model proposer's hypotheses are wrong, too shallow, or never fire), or a different class you observe directly in the trace -- name it precisely rather than forcing it into one of these three if the evidence doesn't fit.
      3. Cross-reference each of the 3 characterizations against `ops/verifier_gaps.md`'s existing entries (per CLAUDE.md's "Missing-Verifier Gap Logging" discipline). If a characterization reveals a genuinely NEW missing-discriminator gap not already logged there, append an entry (using that file's existing schema) naming the failure mode, the missing discriminator a new verifier would need, a candidate design, and a priority by headroom. If it matches an existing entry, cite that entry's id instead of duplicating it.
      4. Do NOT attempt to close any gap in this task -- that is task class 2 of the Generalization-Testing Floor, reserved for a future milestone once a specific fix is well-scoped from this characterization. Do NOT claim any new registry credit for this task. If step 1's run happens to genuinely reach a level beyond the game's current registry entry for some game, report it honestly (this would be a real live_agent_self_discovery finding worth flagging), but do not fabricate, round up, or infer a level from anything other than the harness's own `frame.levels_completed` reads.
      5. REQUIRED ARTIFACT FIELDS, each with a `principle:` note under `field_provenance`: `harness_used=scripts/arc_leaderboard_eval.py`, `policy_kind=e3`, `budget_per_game=400` -- principle: exact reproducibility of the measurement, and the budget choice is what makes the number submission-faithful rather than optimistic. `oracle_source_registry_hash`, `games_measured` (should be 25 -- if fewer, name exactly which were skipped and why, per the project's no-silent-caps ethos), `live_levels_total`, `oracle_levels_total`, `gap_total` -- principle: the north-star generalization metric this floor exists to measure and, across future milestones, shrink. `per_game_gap` (list of objects: game, live_levels, oracle_levels, gap, oracle_win_solve_provenance) -- principle: a per-game breakdown is what makes this actionable rather than one opaque number, and carrying oracle_win_solve_provenance lets a future reader test the source-assisted-vs-pure-live-generalization hypothesis directly against real data. `worst_gap_games` (the 3 selected in step 2, each with stall_class, grounded_evidence citing the specific frames/diagnostics actually read, and an explicit "not attempted to fix" note) -- principle: an uncharacterized gap number is not actionable, and citing evidence prevents a future reader from trusting an unfounded stall-class guess. `verifier_gaps_entries_added` (list, may be empty) -- principle: connects this measurement to the project's own build backlog per Missing-Verifier Gap Logging. `any_new_level_found` (bool; almost certainly false at budget=400, but must be checked honestly, not assumed) and, only if true, full reproduction-gate evidence per the ARC Solve Reproducibility discipline before any credit is claimed. `inference_substrate` (declare `offline_sim_no_quota_frame_only_live_agent` for games where tier-3 LLM escalation never fired; separately note per-game which games DID escalate to real Qwen3.5-9B-MTP inference, since those specific game-runs used a different, real-compute substrate). `preconditions_checked`, `random_seed`, `reproducibility_checksum`, `honest_verdict` (terminal-prefixed per CLAUDE.md's Verdict Terminal-Prefix Discipline).
      6. Run scripts/adversarial_verify.py on the emitted artifact before finishing; fix any real flag it raises rather than just noting it.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py. Do NOT modify ops/arc_solve_registry.yaml unless step 4 genuinely and reproducibly found a new level with full reproduction-gate evidence.'

