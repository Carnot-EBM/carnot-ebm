    \      n_scripts_scanned=<int>\n      n_violations_found=<int>\n      n_high_severity=<int>\n\
    \      batch_size_standards=('gsm8k': 8, 'humaneval': 4, 'default': 8)\n      retro_041_batching_resolved=True\n\
    \      honest_verdict='batching_standards_documented'\n   g. Call tmpl.assert_deliverable_written()\
