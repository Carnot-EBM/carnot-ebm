    TASK (ISSUE-6 through ISSUE-10):

    ISSUE-6 (GRPO confidence intervals missing):
    - Find every GRPO delta_pp claim in main.tex (grep for "+8.51pp\|+10.0pp\|+4pp\|+2.86pp").
    - For each claim, add inline sample size: "(n=25, 95% CI: [X, Y])".
    - Binomial CI for n=25, p=0.085 (8.5pp): use Clopper-Pearson; likely CI spans near zero.
    - Add a footnote at the first GRPO table/figure: "GRPO delta estimates are computed on
      small evaluation sets (n=25-47); binomial CIs are wide and these results should be
      treated as preliminary indicators, not definitive accuracy claims."

    ISSUE-7 (HumanEval 0.0% harness failure):
    - grep -n "0\.0%\|0\.00\|HumanEval" docs/arxiv-paper/main.tex | head -20
    - Find the 0.0% claim; rewrite to: "HumanEval pass@1=0.0% is a harness extraction failure
      (standard pass@1 harness expects code blocks that the base model doesn't produce). After
      applying the extraction fix, pass@1 improved by +36pp. This is reported in the anomaly
      appendix rather than the headline results."
    - Move the relevant row or sentence to an anomaly/limitations section if not already there.

    ISSUE-8 (alpha_t 24/100 rejection rate not disclosed):
    - grep -n "alpha_t\|α_t\|0\.38\|alpha.*t" docs/arxiv-paper/main.tex | head -20
    - Find the alpha_t=0.38 claim; add immediately after: "Of 100 sampled responses, 24 that
      Carnot rejected were actually ground-truth-correct (false rejection rate 24%). The
      positivity condition α_t > 0 is satisfied (38% of samples accepted), but calibration
      to ground truth requires further work."

    ISSUE-9 (Phase-4 pilot trivial greedy baseline):
    - grep -n "74\.7%\|action.*reduct\|Phase.4.*action\|baseline.*action" docs/arxiv-paper/main.tex | head -20
    - Rewrite the Phase-4 pilot result framing: "On 10 synthetic 5×5 puzzles, Phase 4's
      Blocked Gibbs free-energy minimization reduced action count by 74.7% vs random-legal-greedy
      baseline (Phase 4: 2.1 steps vs greedy: 8.3 steps). Note: the random-legal-greedy baseline
      is intentionally weak; results against a stronger BFS-to-goal baseline are in exp1189."
    - Add a forward reference to exp1189 in this section.

    ISSUE-10 (Seed IQ confirmed=false not disclosed):
    - grep -n "Seed.IQ\|seediq\|0\.95" docs/arxiv-paper/main.tex | head -20
    - Add footnote to the table or paragraph where Seed IQ is cited:
      "\\footnote{Seed IQ score cited from published announcement; not independently re-fetched
      or verified in this work (exp1166: seed_iq_score_confirmed=false). Included as documented
      external reference, not as a reproduced result.}"

    CONCRETE STEPS:
