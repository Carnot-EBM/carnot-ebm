    - {project_root}/python/carnot/agents/carnot_agent.py
    - {project_root}/python/carnot/agents/model_runtime.py
    - {project_root}/scripts/experiment_template.py cached_sota_pair pattern
    - {project_root}/scripts/gpu_lease.py
    - {project_root}/openspec/capabilities/research-harnesses/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Repair and measure bounded ARC local-generation liveness for the real E3
    request path. Execute exactly one instrumented request per required model,
    preserve request-to-action receipts, and stop before game-level evaluation.

    CONCRETE STEPS:
    0. PRECONDITIONS: require cached, loadable MODEL_SPECS paths, healthy GPUs,
       GPU leases, readable E3 runtime, writable trace/artifact paths, and no
       model download. If unavailable, write terminal `blocked`,
       `inference_substrate_class=blocked_no_run`, and exact gate_check_summary.
    1. Add REQ-REPORT-7113 and RED tests before implementation. Cover zero
       generations, parser rejection, timeout, model/path mismatch, synthetic
       action leakage, missing telemetry, and duration/substrate mismatch.
    2. Define MODEL_SPECS with `unsloth/Qwen3.8-27B-GGUF` as the current ARC
       generator and mandated `unsloth/Qwen3.6-35B-A3B-GGUF` as a SOTA headline
       cell. Record repo, exact resolved file, quantization, size, and hash.
       Legacy-small models may smoke-test transport only and cannot satisfy the
       gate or headline.
    3. Acquire leases, snapshot nvidia-smi before/after each request, load one
       model at a time, and execute exactly one bounded prompt through the real
       E3 model runtime. Never download or substitute a model.
    4. Capture prompt hash, token counts, finish reason, raw output hash,
       parse status, proposed action, action-schema validity, timings, PID, and
       GPU telemetry. Keep bulky raw text outside `results/`.
    5. Label actual successful runs `model_bounded_generation`; a process load
       without generation is `model_load_no_generation`; missing prerequisites
       are `blocked_no_run`. Do not claim `model_full_generation`.
    6. Set arc_generation_liveness_ready_score=1 only when both required models
       have nonzero generated tokens and parseable schema-valid actions with
       complete telemetry. Otherwise emit terminal null, disqualified, or
       blocked according to observed evidence, never `partial` for an unchanged
       external gap.
    7. Declare solve_provenance=development_proxy, offline_reproduced=false,
       and arc_registry_delta=0. Do not read game source or modify the registry.
    8. Run focused tests, GPU cleanup assertions, artifact validation,
       adversarial verification, row-consistency lint, scoped spec coverage,
       and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific principle
       for every field below; preconditions_checked; run_date; MODEL_SPECS;
       inference_substrate (two bounded local E3 generation requests);
       inference_substrate_class (model_bounded_generation,
       model_load_no_generation, or blocked_no_run); execution_venue (host);
       duration_s; source_artifact_hashes; rows; per_model_request_rows;
       model_repo_ids; resolved_model_paths; resolved_model_hashes;
