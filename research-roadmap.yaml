  - id: exp352-live-gpu-inference-diagnostic
    milestone: "2026.05.20"
    deliverable: results/experiment_352_live_gpu_diagnostic.json
    title: "Exp 352: Live GPU inference root-cause diagnostic — trace why CARNOT_FORCE_LIVE=1 falls back to simulated"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: CRITICAL — Two consecutive milestones (2026.05.06 and 2026.05.13) produced
      zero live GPU inference. All four "live GPU" benchmark experiments (Exps 340, 341,
      346, 347) ran in simulated mode despite CARNOT_FORCE_LIVE=1. Both RTX 3090s were idle.
      The pipeline silently falls through to simulated mode rather than failing explicitly.
      Without this fixed, every benchmark in this milestone will be meaningless.

      The failure could be in any of these layers:
      1. Model loading: transformers/torch fails to load Gemma4-E4B-it or Qwen3.5-0.8B
      2. Device detection: CARNOT_FORCE_LIVE check doesn't propagate into ExperimentTemplate
      3. BatchedInferenceRunner: inference_fn raises exception, catches silently, uses simulated
      4. GPU driver: CUDA not visible in conductor subprocess environment
      5. Model path: model not cached, HuggingFace download fails silently

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_template.py — ExperimentTemplate.setup_gpu(), inference fallback path
      - python/carnot/pipeline/verify_repair.py — simulated fallback logic
      - results/experiment_340_live_precision_benchmark.json — last live GPU attempt (simulated)
      - results/experiment_341_live_humaneval.json — last HumanEval attempt (simulated)
      - scripts/experiment_340_live_precision_benchmark.py — the failing script

      TASK: Diagnose and fix the live GPU inference failure path.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-INFRA-014 (live GPU failure must be explicit, not silent fallback),
         SCENARIO-INFRA-014/015 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - LiveGPUDiagnostic: dataclass (cuda_visible, torch_available, model_loadable,
           carnot_force_live_set, failure_reason, is_live_capable)
         - diagnose_live_gpu() → LiveGPUDiagnostic: checks each layer in sequence,
           reports first failure point; CI-safe (never raises, returns diagnostic)
         - check_cuda_visible(): subprocess nvidia-smi, returns bool
         - check_torch_cuda(): import torch; torch.cuda.is_available(); returns bool
         - check_carnot_force_live(): os.environ check; returns bool
         - check_model_loadable(model_id): attempt AutoTokenizer.from_pretrained with
           timeout=30s; returns (loadable: bool, error_msg: str)
      4. Implement python/carnot/pipeline/live_gpu_diagnostic.py:
         - LiveGPUDiagnostic dataclass
         - check_cuda_visible(), check_torch_cuda(), check_carnot_force_live()
         - check_model_loadable(model_id, timeout_s=30)
         - diagnose_live_gpu(model_ids=None) → LiveGPUDiagnostic
         - IMPORTANT: ExperimentTemplate should call diagnose_live_gpu() when
           CARNOT_FORCE_LIVE=1. If not is_live_capable, raise RuntimeError with
           failure_reason instead of silently falling back to simulated.
      5. Update scripts/experiment_template.py (additive): in setup_gpu(), when
         CARNOT_FORCE_LIVE=1 and setup fails, call diagnose_live_gpu() and raise
         RuntimeError("Live GPU required but unavailable: (failure_reason)") instead
         of falling through to simulated mode.
      6. Write scripts/experiment_352_live_gpu_diagnostic.py using ExperimentTemplate(352):
         a. Call diagnose_live_gpu(model_ids=["Qwen/Qwen3.5-0.8B", "google/gemma-4-E4B-it"])
         b. Report each check: cuda_visible, torch_cuda, carnot_force_live, model_loadable
         c. Report failure_reason if not is_live_capable
         d. Build artifact: schema="carnot.live_gpu_diagnostic.v1", is_live_capable,
            failure_reason, checks_passed (list), checks_failed (list)
         e. Output: results/experiment_352_live_gpu_diagnostic.json
      7. Write tests/python/test_live_gpu_diagnostic.py (100% coverage required).
      8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      9. Reconcile: update ops/conductor-log.md with diagnostic findings and fix applied,
         ops/changelog.md, ops/status.md.
      10. Do NOT push. Do NOT modify scripts/research_conductor.py.

