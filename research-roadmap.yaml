    - ops/known-issues.md lines 452-495 (8 failure mode list)

    TASK:
    1. Write skeleton artifact (STEP 0).

    2. SCALE UP THE SUBSTRATE (100-300M params, d=128):
       a. Encoder: MLP with hidden dims [512, 512, 256, 128], ~100M params
          Input: 1024-dim token embedding (from llama-cpp or local embedding model)
          Output: 128-dim latent z in [-1, 1]^128
       b. Ising energy on latent: J matrix (128x128 sparse coupling), B biases
       c. Refiner (decoder): MLP with hidden dims [128, 256, 512, 1024], ~100M params
          Input: 128-dim latent z
          Output: 1024-dim repaired embedding
       d. Use DualGPU: model.to('cuda:0'), run encoder on GPU 0, energy on CPU (Ising is fast)

