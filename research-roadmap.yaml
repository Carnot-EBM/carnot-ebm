         b. JEPA checkpoint file exists at the path recorded in exp2565 artifact
         c. `python -c "import carnot.pipeline.verify_repair"` succeeds
         d. `python -c "import carnot.models.jepa_fast_path_predictor"` succeeds (or equivalent)
         If checkpoint missing: write honest_verdict blocked_jepa_checkpoint_not_found and exit.
         If other precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load JEPA checkpoint in JEPAFastPathPredictor. Verify forward pass produces
         a prediction vector of expected shape. Log checkpoint_loaded=True.

      2. Add online_update(context, claim, label) method to JEPAFastPathPredictor:
         - Single-sample gradient step on the real observation
         - Learning rate: 1e-5 (conservative for online setting)
         - Gradient clipped to norm <= 1.0

      3. Wire predictor into VerifyRepairPipeline.verify():
         - Before returning verification result, call predictor.predict(context, claim)
         - Append JEPA fast-path score to the verification output dict as jepa_fast_path_score
         - If pipeline is configured with jepa_online_update=True, call
           predictor.online_update(context, claim, label) after human feedback is available

      4. Write a 10-example integration test in tests/python/test_jepa_online_integration.py
         that: loads the checkpoint, runs verify() on 10 FoVer examples, asserts jepa score present.

      5. Write results/experiment_2589_jepa_v3_online.json with all required fields.

    required_artifact_fields:
      honest_verdict:
        format: "MUST start with complete: or complete_"
        principle: "Terminal prefix required."
      checkpoint_loaded:
        type: bool
        principle: "Confirms the trained checkpoint was actually used — not a random-init predictor."
      online_update_implemented:
        type: bool
        principle: "Confirms FR-11 Tier 3 requirement is satisfied."
      integration_test_passes:
        type: bool
        principle: "Confirms the integration is live end-to-end, not just stub code."
      jepa_pipeline_auroc_delta:
        type: float
        description: "AUROC change from adding JEPA score to the ensemble (can be 0.0 if no change)"
        principle: "Measures whether online JEPA adds value; 0.0 is acceptable for a first integration."
      preconditions_checked:
        type: list
        principle: "Records verified resources."

    acceptance_gates:
      - condition: "checkpoint_loaded == true AND online_update_implemented == true"
        principle: "FR-11 Tier 3 gate: both load AND update must be live, not just stubs."
      - condition: "integration_test_passes == true"
        principle: "End-to-end test prevents silent breakage of the pipeline."


  - id: exp2590
    title: "KV260 Hardware Continuity (Flash or Prep Script Update)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 30
    track: hardware
    # Hardware-Task Continuity Discipline (CLAUDE.md): KV260 is the only remaining
    # mandatory board after GateMate A1-EVB-2M reached TERMINAL state in .247.

    context: |
      KV260 is NOT at terminal state. State entering .248:
        - SD card: ABSENT (operator has not inserted)
        - PYNQ URL: unreachable (confirmed in exp2580 capstone)
        - Operator docs: produced in exp2560 (.246)
        - Terminal state definition: board-level latency transcript landed in a
          non-fabricated artifact + kv260_synthesis_succeeded: true

      This task has two branches based on a precondition check:
        Branch A (SD card available): run flash sequence per operator docs.
        Branch B (SD card absent): update prep script with latest working PYNQ URLs
          and add USB enumeration verification step.

    existing_code_to_read:
      - results/experiment_2560_kv260_operator_docs.json
      - ops/hardware-bringup-prep.md
      - scripts/kv260_prep.sh

    concrete_steps: |
      0. PRECONDITIONS:
         a. Check USB enumeration for KV260: `lsusb | grep -i "xilinx\|kv260\|2100:1004"`
            OR check for /dev/ttyUSB* from KV260.
         b. Check if PYNQ image available locally: `ls /tmp/pynq_kv260*.img* 2>/dev/null`
         c. Read ops/hardware-bringup-prep.md to determine current SD card status.

         If KV260 USB device NOT detected AND /dev/ttyUSB* NOT present:
           → Branch B: prep script update only.
         If KV260 USB device IS detected:
           → Branch A: attempt flash sequence.
         In either case, proceed (no early exit) — document branch taken in artifact.

      1. BRANCH A (KV260 USB detected):
         a. Download PYNQ image if not cached (check PYNQ project for latest KV260 URL).
         b. Flash SD card: `sudo dd if=pynq_kv260.img of=/dev/sdX bs=4M status=progress`
         c. Boot KV260, wait for SSH availability: `ssh -o ConnectTimeout=30 kv260 'uname -a'`
         d. If SSH connects: log kv260_ssh_connected=True.
         SKIP to step 3 if Branch A succeeds.

      2. BRANCH B (no USB / no SD card):
         a. Fetch current PYNQ KV260 download page: `curl -s <pynq-url>` to find latest image URL.
         b. Update scripts/kv260_prep.sh with the verified working URL.
         c. Add `lsusb | grep -i xilinx` check at script start with clear error message.
         d. Log branch_taken="prep_script_update", pynq_url_updated=True.

      3. Update ops/hardware-bringup-prep.md with current state and timestamp.

      4. Write results/experiment_2590_kv260_continuity.json with all required fields.

    required_artifact_fields:
      honest_verdict:
        format: "MUST start with complete: or complete_"
        principle: "Terminal prefix required."
      branch_taken:
        type: str
        values: ["flash_attempt", "prep_script_update"]
        principle: "Records which branch was taken so future tasks know current board state."
      kv260_terminal:
        type: bool
        principle: "True only if board-level latency transcript confirmed — prevents premature graduation."
      kv260_ssh_connected:
        type: bool
        principle: "Only meaningful in Branch A; confirms board is alive after flash."
      pynq_url_updated:
        type: bool
        principle: "Only meaningful in Branch B; confirms prep script has working URLs."
      preconditions_checked:
        type: list
        principle: "Records USB enumeration result that determined branch selection."

    acceptance_gates:
      - condition: "branch_taken in ['flash_attempt', 'prep_script_update']"
        principle: "Guard against silent skip — one of the two branches must execute."


  - id: exp2591
    title: "Ensemble v9: Replace Weak tier0s/tier0u with Real-Corpus-Validated Versions"
    agent_type: codex
    model: gpt-5.5
    max_turns: 45
    track: ensemble
    gated_on: "exp2583.tier0s_real_auroc > 0.3758 OR exp2584.tier0u_real_auroc > 0.5360"

    prior_failures:
      - experiment_id: exp2563
        verdict: "complete: ensemble v8 adds Group E (tier0t/0v/0w); AUROC=0.9857"
        addressed_by: >
          exp2563 added new verifiers (Group E addition). This substitutes weak verifiers
          (tier0s/tier0u) with real-corpus-validated replacements — a different structural
          change (substitution vs addition). Different from exp2563.
        retire_if_same_verdict: false

    context: |
      Ensemble v7b achieves AUROC=0.9857. Two verifiers (tier0s, tier0u) are near-random
      on real corpus (0.3758 / 0.5360). Removing them or replacing them with real-corpus-
      validated versions may improve calibration without hurting headline AUROC.

      Gated on: at least one of exp2583 or exp2584 showing real-corpus improvement.
      If neither shows improvement (both tier0s and tier0u remain near-random after
      retraining), proceed with ensemble v9 = v7b with tier0s/tier0u REMOVED entirely
      (they add noise, not signal).

    existing_code_to_read:
      - python/carnot/verify/ensemble.py
      - results/experiment_2563_ensemble_v8.json
      - results/experiment_2583_tier0s_real_retrain.json
      - results/experiment_2584_tier0u_real_fix.json

    concrete_steps: |
      0. PRECONDITIONS:
         a. results/experiment_2583_tier0s_real_retrain.json exists
         b. results/experiment_2584_tier0u_real_fix.json exists
         c. `python -c "import carnot.verify.ensemble"` succeeds
         Check if exp2583.tier0s_real_auroc > 0.3758 AND exp2584.tier0u_real_auroc > 0.5360.
         If neither improved: set replacement_strategy="remove_both" (not "replace").
         If only one improved: set replacement_strategy="replace_improved_remove_other".
         If both improved: set replacement_strategy="replace_both".

      1. Update ensemble.py:
         - If replacement_strategy includes "replace": load real-corpus model from
           tier0s_real_model.pkl and/or tier0u_real_model.pkl; wire as the verifier's scorer.
         - If replacement_strategy includes "remove": exclude tier0s and/or tier0u from
           calibration groups.
         Log n_active_verifiers (should be 15 minus removed + replaced).

      2. Re-evaluate ensemble on FoVer real corpus test split (use same 20% split as exp2583/2584
         for consistency). Compute ensemble v9 AUROC, AUPRC, F1.

      3. Run 5-seed evaluation (random_seed in [42, 137, 271, 512, 999]) to confirm AUROC stability.
         Log auroc_mean_5seed, auroc_std_5seed.

      4. If ensemble v9 AUROC >= 0.9857 (no regression) AND tier0s/tier0u contribution improved:
         ensemble_v9_headline=True. If AUROC regresses below 0.9800: revert to v7b, set
         ensemble_v9_headline=False, log regression_detected=True.

      5. Write results/experiment_2591_ensemble_v9.json with all required fields.

    required_artifact_fields:
      honest_verdict:
        format: "MUST start with complete: or complete_"
        principle: "Terminal prefix required."
      ensemble_v9_auroc:
        type: float
        principle: "Primary metric — must not regress below ensemble v7b baseline of 0.9857."
      auroc_mean_5seed:
        type: float
        principle: "5-seed mean confirms stability, not a lucky single-seed result."
      auroc_std_5seed:
        type: float
        principle: "Standard deviation across seeds — high variance signals instability."
      replacement_strategy:
        type: str
        principle: "Documents the exact substitution/removal decision for reproducibility."
      ensemble_v9_headline:
        type: bool
        principle: "Operator-facing signal: is v9 the new paper-v6 headline result?"
      n_active_verifiers:
        type: int
        principle: "Records final ensemble size after substitution/removal."
      random_seed:
        value: 42
        principle: "Primary seed for reproducibility."
      preconditions_checked:
        type: list
        principle: "Records verified resources."

    acceptance_gates:
      - condition: "ensemble_v9_auroc >= 0.9800"
        principle: "Regression guard — ensemble update must not degrade below 98% of v7b AUROC."
      - condition: "auroc_mean_5seed >= 0.9800"
        principle: "5-seed stability gate — single lucky seed is not a credible claim."
      - condition: "n_active_verifiers >= 10"
        principle: "Sanity check — removing too many verifiers degrades ensemble diversity."


