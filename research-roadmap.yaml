- id: exp1039-conductor-fastpath-gate-coercion
  milestone: 2026.04.81
  deliverable: results/experiment_1039_conductor_fastpath_gate_coercion.json
  title: "Conductor Fastpath Bootstrap Skip + Gate Coercion Fix (MANDATORY INFRASTRUCTURE)"
  model: opus
  prior_failures:
    - experiment_id: exp1028-preflight-v30
      verdict: wedge_bootstrap_stub_not_overwritten
      addressed_by: "Root cause: _deliverable_exists() treated status:'running' stub as completed. Fix already implemented in scripts/research_conductor.py (status-aware fast-path, 12 tests in test_conductor_deliverable_status.py). This experiment closes out that change: merges the fix, replays the .80 wedge scenario, and retires exp1030's GATE_BLOCK history."
      retire_if_same_verdict: true
    - experiment_id: exp1030-triple-integration-v6
      verdict: gate_coercion_string_vs_bool
      addressed_by: "Root cause: gate evaluator read YAML 'True' (string) as bool comparison against True (bool) — coercion failure. Fix: normalize gate value to bool before comparison (handle 'True'/'true'/'1'/True/1 as bool True; 'False'/'false'/'0'/False/0 as bool False)."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    This is a MANDATORY infrastructure experiment for milestone .81. Two root causes wedged .80:
    1. _deliverable_exists() in scripts/research_conductor.py treated bootstrap-only artifacts
       (status: "running") as completed deliverables, preventing retry. The fix is already
       implemented in scripts/research_conductor.py + tests/python/test_conductor_deliverable_status.py
       (12 tests) per openspec/change-proposals/conductor-fastpath-bootstrap-skip.md.
    2. Gate evaluator compared YAML string "True" against Python bool True — they are NOT equal,
       causing GATE_BLOCK when the upstream actually wrote True. This blocked exp1030 3 times in .80.

    EXISTING CODE TO READ FIRST:
    - openspec/change-proposals/conductor-fastpath-bootstrap-skip.md (full spec — read entirely)
    - scripts/research_conductor.py (find _deliverable_exists() and _evaluate_gate() — current state)
    - tests/python/test_conductor_deliverable_status.py (12 tests — verify they exist and pass)
    - results/experiment_1028_preflight_v30.json (contains status:"success", pre_test_fixed:true)
    - results/experiment_1030_triple_integration_v6.json (if it exists — check what happened)

    TASK:
    1. VERIFY FASTPATH FIX IS PRESENT: Read scripts/research_conductor.py and find _deliverable_exists().
       Check: does it inspect status field? If not, the fix was not applied yet — implement it now:
       A "running" artifact (status == "running") is NOT a completed deliverable and must be retried.
       A "success" or "partial" artifact IS completed.
    2. VERIFY GATE COERCION FIX: Find _evaluate_gate() or equivalent gate-check logic in
       scripts/research_conductor.py. Check: does it normalize string "True"/"true"/"1" to Python True?
       If not, implement normalization:
         def _coerce_gate_value(v):
             if isinstance(v, bool): return v
             if isinstance(v, str): return v.lower() in ('true', '1', 'yes')
             if isinstance(v, (int, float)): return bool(v)
             return bool(v)
       Apply this before the gate comparison. Write gate_coercion_fixed=True in artifact.
    3. RUN EXISTING TESTS:
       pytest tests/python/test_conductor_deliverable_status.py -v 2>&1 | head -40
       All 12 tests must pass. If tests fail, investigate and fix.
    4. WEDGE REPLAY: Simulate the .80 wedge scenario to verify the fix:
       a. Create a temp file results/experiment_WEDGE_TEST.json with status:"running"
       b. Run: python -c "
          import sys; sys.path.insert(0, '.')
          from scripts.research_conductor import ResearchConductor
          rc = ResearchConductor.__new__(ResearchConductor)
          result = rc._deliverable_exists('results/experiment_WEDGE_TEST.json')
          print('bootstrap stub treated as done:', result)
          assert result == False, 'FAIL: bootstrap stub incorrectly treated as completed'
          print('PASS: bootstrap stub correctly not treated as completed')
          " 2>&1
       c. Delete the temp file.
    5. GATE COERCION REPLAY: Test that string "True" evaluates equal to bool True:
       python -c "
       import sys; sys.path.insert(0, '.')
       from scripts.research_conductor import ResearchConductor
       rc = ResearchConductor.__new__(ResearchConductor)
       # Create mock gate spec
       result = rc._coerce_gate_value('True')
       assert result == True, 'FAIL: string True did not coerce to bool True'
       result2 = rc._coerce_gate_value('true')
       assert result2 == True, 'FAIL: string true did not coerce to bool True'
       print('PASS: gate coercion works correctly')
       " 2>&1
       (If _coerce_gate_value does not exist as a method, adapt to however the fix was implemented.)
    6. Write results/experiment_1039_conductor_fastpath_gate_coercion.json with final results.

    CONCRETE STEPS:
    - Read openspec/change-proposals/conductor-fastpath-bootstrap-skip.md fully first
    - grep -n "_deliverable_exists\|_evaluate_gate\|status.*running" scripts/research_conductor.py | head -30
    - pytest tests/python/test_conductor_deliverable_status.py -v 2>&1 | head -40
    - (implement fixes if not present, verify if present)
    - (run wedge replay)
    - (run gate coercion test)
    - Write results/experiment_1039_conductor_fastpath_gate_coercion.json

    ARTIFACT FIELDS:
    - fastpath_fix_present: bool (True if _deliverable_exists inspects status field)
    - gate_coercion_fixed: bool (True if gate comparison normalizes string/bool)
    - deliverable_status_tests_passing: int (should be 12)
    - wedge_replay_clean: bool (bootstrap stub not treated as completed)
    - gate_coercion_replay_clean: bool (string "True" evaluates to bool True)
    - honest_verdict: "both_fixes_deployed" | "fastpath_only" | "gate_only" | "neither_fixed" | "failed"

    Run: python scripts/experiment_1039_conductor_fastpath_gate_coercion.py
    Do NOT push. Do NOT modify scripts/research_conductor.py beyond the two targeted fixes.

