    5. Write tests FIRST (100% coverage) for:\n   - CurriculumStageResult(stage: int,\
    \ n_pairs: int, n_epochs: int, auc_after: float):\n     - auc_improved: bool (only\
    \ meaningful for stage >= 2)\n   - JEPACurriculumTrainer(n_stage1_epochs=100,\
    \ n_stage2_epochs=100, n_stage3_epochs=100,\n     high_conf_threshold=0.85):\n\
    \     - train(pairs: list[dict]) -> list[CurriculumStageResult]\n     - get_final_auc(held_out_pairs:\
    \ list[dict]) -> float\n   - JEPARetrainV3Result(n_pairs_raw, curriculum_stages,\
    \ before_auc, after_auc):\n     - auc_improvement: float\n     - target_met: bool\
    \ (after_auc > 0.600)\n     - regression_recovered: bool (after_auc > 0.400)\n\
    \   - Test: stage1 only trains on pairs with label_confidence >= 0.85\n   - Test:\
    \ stage2 trains on all pairs (no filter)\n   - Test: JEPARetrainV3Result.regression_recovered=True\
    \ when after_auc > 0.400\n6. Implement python/carnot/models/jepa_curriculum_trainer.py\
    \ (JEPACurriculumTrainer, CurriculumStageResult, JEPARetrainV3Result).\n   Export\
    \ from carnot.models.__init__.\n   Verbose docstrings: WHY three-stage curriculum\
    \ (easy-first learning: anchor on high-confidence examples before exposing to full\
    \ noise; prevents majority-class collapse that caused 0.281 regression; arXiv 2509.14252\
    \ LLM-JEPA shows JEPA embedding stability improves under curriculum ordering), WHY\
    \ high_conf_threshold=0.85 (more conservative than Exp 477's 0.70 filter — 0.85\
    \ guarantees stage 1 corpus is genuinely high-quality, not just 'not obviously bad'),\
    \ WHY stage2 uses ALL pairs (information loss from filtering is the root cause of\
    \ regression — stage2 recovers the lost information after the model has a stable\
    \ anchor from stage1).\n7. Write scripts/experiment_492_jepa_curriculum_retrain_v3.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(492, timeout_minutes=60)\
    \ as context manager\n   c. ExperimentTemplate(492, 'JEPA Curriculum Retrain v3',\n\
    \      'results/experiment_492_jepa_curriculum_retrain_v3.json')\n   d. DeliverableGuard('results/experiment_492_jepa_curriculum_retrain_v3.json')\n\
