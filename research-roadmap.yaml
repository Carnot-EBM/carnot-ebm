        verifier_is_oracle:
          principle: "MUST be false -- the trust energy is oracle-DISTINCT (ranks held-out generalization), NOT the executable win-check; a circular win does not count (Circularity / Oracle-Distinctness Discipline)."
        core_efficiency_baseline:
          principle: "2.0074 -- the per-level metric control."
