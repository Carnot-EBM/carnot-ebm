- id: exp2508-phase4-step-level-arm-ebm-v2
  title: 'Phase 4: Step-Level ARM-EBM Bijection v2 (FREIA FEP Grounding) -- CPU-Only from Telemetry Manifest'
  milestone: 2026.05.242
  deliverable: results/experiment_2508_phase4_step_level_arm_ebm.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  prior_failures:
  - experiment_id: exp2474-phase4-odar-routing
    verdict: 'complete: pearson_r=0.19, phase4_validated=False (ODAR proxy too indirect)'
    addressed_by: "exp2474 used ODAR routing prediction as a proxy for Phase 4 correlation.
      This task uses raw token logprob fields at per-CoT-step granularity (E_step = -sum(log_p(token_i)))
      which is the direct ARM-EBM formula, not a routing proxy. Structurally distinct."
    retire_if_same_verdict: false
  - experiment_id: exp2486-phase4-arm-ebm-bijection
    verdict: 'complete: pearson_r=0.108, phase4_validated=False (SemanticEnergy embedding proxy, not raw logprobs)'
    addressed_by: "exp2486 used SemanticEnergy EMBEDDINGS as a proxy for E_ising rather
      than the raw token logprobs from the telemetry manifest. The ARM-EBM bijection
      formula E=-log_p requires raw token-level log probabilities, not semantic embedding
      distances. This task reads token logprob fields directly from the .241 telemetry
      manifest and applies E_step=-sum(log_p(token_i)) per CoT step — a fundamentally
      different energy proxy."
    retire_if_same_verdict: true
  - experiment_id: exp2487-phase4-qwen-prc-divergence-test
    verdict: 'complete: phase4_validated_via_prc=False (mock_model methodology gap)'
    addressed_by: "exp2487 was a PRC censorship test using mock_model — different methodology.
      This task is ARM-EBM correlation, not PRC divergence."
    retire_if_same_verdict: false
  - experiment_id: exp2496-phase4-qwen-prc-v3-real-gguf
    verdict: 'MISSING (resource/quota blocked at precondition)'
    addressed_by: "exp2496 was a PRC methodology, not ARM-EBM. This task is ARM-EBM
      correlation from existing telemetry — CPU-only, no GGUF required."
    retire_if_same_verdict: false
  - experiment_id: exp2497-spilled-energy-tier0q
    verdict: 'complete: pearsonr_spilled=-0.022, auroc_spilled=0.4903 (noise floor, Tier 0q retired)'
    addressed_by: "exp2497 tested the Spilled Energy metric from arXiv:2602.18671 which
      uses logit distribution entropy as the energy signal. This task uses the ARM-EBM
      formula E=-log_p(token_i) from the ARM-EBM paper (arXiv:2512.15605) applied at
      per-CoT-step granularity — a different energy metric from spilled energy."
    retire_if_same_verdict: false
  prompt: "CONTEXT: arXiv operator hold requires phase4_validated_any=True. Five Phase
    4 paths have been tried:\n- exp2474: ODAR proxy, pearson_r=0.19 — FAILED\n- exp2486:
    ARM-EBM via SemanticEnergy EMBEDDINGS (wrong proxy), pearson_r=0.108 — FAILED\n-
    exp2487: Qwen PRC mock_model — METHODOLOGY GAP\n- exp2496: Qwen PRC real GGUF —
    MISSING (resource blocked)\n- exp2497: Spilled Energy (logit entropy) — pearson_r=-0.022,
    REFUTED\n\nTHEORETICAL GROUNDING (arXiv:2605.04065 FREIA; arXiv:2512.15605 ARM-EBM):\nFREIA
    shows step-level free energy E_t = -log p(action_t | state_t) measures epistemic
    uncertainty at each inference step. ARM-EBM bijection: E_ising approx= -sum(log_p(token_i))
    per CoT step. The .241 telemetry manifest contains token_logprobs fields from prior
    model runs — these are the exact raw values needed. No GGUF required.\n\nKEY DISTINCTION
    FROM exp2486: exp2486 used python/carnot/verify/semantic_energy.py embedding distances
    as E_ising proxy. THIS task reads raw token logprob fields from the telemetry manifest
    and applies E_step = -sum(log_p(token_i)) directly (ARM-EBM formula). Different
    energy metric.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py
    (IsingVerifier.energy() method)\n  {project_root}/results/ (find any files named
    *telemetry* or *manifest* from .241)\n  {project_root}/scripts/experiment_template.py
    (ExperimentTemplate boilerplate)\n\nTASK: Test Phase 4 ARM-EBM bijection hypothesis
    at step-level granularity.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS (check ALL before
    any computation — failure exits with blocked_* verdict):\n     a. Find .241 telemetry
    manifest: ls {project_root}/results/*telemetry* 2>/dev/null OR\n        ls {project_root}/results/*manifest*
    2>/dev/null\n        Must contain files with token_logprob fields OR step-level
    logprob fields.\n        If no telemetry manifest found: write honest_verdict blocked_no_telemetry_manifest
    and exit.\n     b. Verify IsingVerifier energy callable:\n        python3 -c \"from
    carnot.verify.semantic_energy import SemanticEnergy; print('ok')\"\n        If import
    fails: write honest_verdict blocked_carnot_import_failed and exit.\n     c. Verify
    sample size: count available step pairs in telemetry.\n        If n_step_pairs <
    100: write honest_verdict blocked_insufficient_step_pairs_n={{n}} and exit.\n  1.
    Load telemetry manifest. Extract per-CoT-step token logprob sequences.\n  2. For
    each CoT step with token_logprobs available:\n     E_step = -sum(log_p(token_i))
    for token_i in step (ARM-EBM formula)\n  3. For each CoT step, compute IsingVerifier.energy()
    on the step text (or closest available energy proxy).\n     If IsingVerifier step-level
    energy is not available, document in methodology_note and use\n     response-level
    energy from the closest available artifact as fallback — but flag as\n     step_granularity_achieved=False
    in the artifact.\n  4. Compute pearson_r(E_step_arm, E_step_ising) across all step
    pairs.\n  5. Compute p-value (scipy.stats.pearsonr or equivalent).\n  6. Record
    n_step_pairs, pearson_r, p_value, step_granularity_achieved.\n  7. Set phase4_validated_step_level
    = (abs(pearson_r) > 0.30 AND p_value < 0.05 AND n_step_pairs >= 100).\n\nREQUIRED
    ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required
    (complete:/success:/passed:/shipped:). start with 'complete:' even for negative results.\"\n
    \ - n_step_pairs:\n      principle: \"Sample size for pearson_r claim — must be
    >= 100 for statistical credibility per CLAUDE.md Sample-Size Rigor.\"\n  - pearson_r:\n
    \     principle: \"The core Phase 4 bijection test value. Negative is informative
    (refutation); near-zero is noise floor; > 0.30 with p < 0.05 is the acceptance
    threshold.\"\n  - p_value:\n      principle: \"Statistical significance of pearson_r.
    Required alongside the correlation to prevent noise-floor acceptance.\"\n  - step_granularity_achieved:\n
    \     principle: \"True if energy was computed per-CoT-step; False if response-level
    fallback was used. Affects paper-v6 claim strength.\"\n  - phase4_validated_step_level:\n
    \     principle: \"True only if |pearson_r| > 0.30 AND p < 0.05 AND n >= 100.
    This is the Gate 3 candidate result for arXiv readiness.\"\n  - energy_proxy_used:\n
    \     principle: \"Documents which energy metric was used (arm_ebm_raw_logprobs vs
    semantic_energy_fallback). Critical for paper-v6 methodology section.\"\n  - preconditions_checked:\n
    \     principle: \"Records which resources were verified before launching — pre-empts
    fabrication mode.\"\n  - duration_s:\n      principle: \"Real compute takes wall-clock
    time. CPU computation on 100+ step pairs takes > 1.0s minimum.\"\n  - random_seed:\n
    \     principle: \"Reproducibility — if any stochastic element, seed must be set.\"\n\nACCEPTANCE
    GATES:\n  - condition: \"phase4_validated_step_level == true (|pearson_r| > 0.30
    AND p < 0.05 AND n_step_pairs >= 100)\"\n    principle: \"The three-condition gate
    guards against noise-floor acceptance (p threshold), implausibly-tiny effect sizes
    (0.30 floor), and under-powered claims (n >= 100 minimum per CLAUDE.md).\"\n\nNEGATIVE
    RESULT PROTOCOL: If gate fails (|pearson_r| <= 0.30 OR p >= 0.05):\n  - Set honest_verdict
    = 'complete: phase4_step_level_correlation_below_threshold'\n  - Document pearson_r,
    p_value, n_step_pairs\n  - This triggers retire_if_same_verdict=true for the exp2486
    prior_failure entry above\n  - The conductor will use this result to evaluate whether
    arXiv proceed-without-phase4 path is warranted\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2509-halluguard-tier0s-prototype
  title: 'Phase 2a: HalluGuard NTK-Based Tier 0s Verifier Prototype (arXiv:2601.18753 ICLR 2026)'
  milestone: 2026.05.242
  deliverable: results/experiment_2509_halluguard_tier0s.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  prior_failures:
  - experiment_id: exp658-specguard-step-verifier
    verdict: 'complete: step-verifier approach — different methodology'
    addressed_by: "exp658 implemented a step-level speculative guard verifier, not an
      NTK-based hallucination classifier. HalluGuard Tier 0s is a fundamentally different
      technique: NTK (Neural Tangent Kernel) gradient alignment signal from arXiv:2601.18753
      ICLR 2026. No prior Tier 0s NTK verifier has been attempted in Carnot."
    retire_if_same_verdict: false
  prompt: "CONTEXT: The Carnot verifier ensemble currently has 9 active Tier 0 verifiers
    in group-conditional calibration giving AUROC=0.975. HalluGuard (arXiv:2601.18753
    ICLR 2026) proposes an NTK (Neural Tangent Kernel) based unified hallucination detector
    that distinguishes data-driven hallucinations (factual gaps) from reasoning-driven
    hallucinations (logical errors). This is a theoretically complementary signal to
    the current ensemble's logprob/semantic/logic groups.\n\nTASK: Prototype a Tier
    0s NTK-based verifier and evaluate AUROC on the .241 corpus.\n\nEXISTING CODE TO
    READ FIRST:\n  {project_root}/python/carnot/verify/ (existing verifier interface)\n
    \ {project_root}/python/carnot/verify/semantic_energy.py (BaseVerifier pattern)\n
    \ {project_root}/scripts/experiment_template.py (ExperimentTemplate boilerplate)\n\nCONCRETE
    STEPS:\n  0. PRECONDITIONS:\n     a. Find .241 evaluation corpus:\n        ls {project_root}/results/*eval*
    2>/dev/null OR ls {project_root}/data/*corpus* 2>/dev/null\n        Must contain
    labeled (response, label) pairs for AUROC evaluation.\n        If no corpus found:
    write honest_verdict blocked_no_eval_corpus and exit.\n     b. Verify carnot.verify
    import:\n        python3 -c \"from carnot.verify.semantic_energy import SemanticEnergy;
    print('ok')\"\n        If fails: write honest_verdict blocked_carnot_import_failed
    and exit.\n  1. Implement halluguard_ntk_score(response: str) -> float based on
    arXiv:2601.18753 Section 3:\n     NTK-based score = approximation of kernel gradient
    alignment between response and training distribution.\n     Practical approximation:
    compute gradient norm of log p(response) wrt embedding weights if available,\n     or
    use Fisher Information trace approximation from token logprob variance as NTK proxy.\n
    \    Document methodology_note with which approximation was used.\n  2. Write Tier0sVerifier
    class in python/carnot/verify/tier0s_halluguard.py following BaseVerifier interface.\n
    \ 3. Evaluate on .241 corpus: compute AUROC(tier0s_scores, labels).\n  4. Report
    tier0s_auroc, n_eval, tier0s_viable (AUROC > 0.70).\n\nREQUIRED ARTIFACT FIELDS:\n
    \ - honest_verdict:\n      principle: \"Terminal-prefix required (complete:/success:/passed:/shipped:).\"\n
    \ - tier0s_auroc:\n      principle: \"Primary viability metric — must exceed 0.70
    to qualify for ensemble inclusion.\"\n  - tier0s_viable:\n      principle: \"Explicit
    viability flag gates exp2510 ensemble integration. True only if AUROC > 0.70.\"\n
    \ - n_eval:\n      principle: \"Sample size for AUROC claim — must be >= 30 per
    CLAUDE.md Sample-Size Rigor.\"\n  - methodology_note:\n      principle: \"Documents
    which NTK approximation was used — required because exact NTK is intractable at
    inference time; paper must disclose approximation.\"\n  - preconditions_checked:\n
    \     principle: \"Records which resources were verified before launching.\"\n  -
    duration_s:\n      principle: \"Wall-clock measurement guards against fabrication.\"\n
    \ - random_seed:\n      principle: \"Determinism for reproducibility.\"\n\nACCEPTANCE
    GATES:\n  - condition: \"tier0s_viable == true (tier0s_auroc > 0.70)\"\n    principle:
    \"0.70 floor prevents adding noise-floor verifiers that would dilute the group-conditional
    calibration signal (same bar as existing excluded verifiers Tier 0h=0.678, Tier
    0i=0.558).\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2510-tier0r-integration-ensemble-v7
  title: 'Phase 2a: Tier 0r Integration + Conformal Ensemble v7 (10 Verifiers)'
  milestone: 2026.05.242
  deliverable: results/experiment_2510_ensemble_v7.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  prior_failures:
  - experiment_id: exp2473-calibrated-conformal-ensemble-v4
    verdict: 'complete: group_conditional_auroc=0.9351 (TAUTOLOGY later confirmed by exp2484)'
    addressed_by: "exp2473 produced ensemble v4 using a code artifact (same variable referenced
      twice yielding 0.9351 TAUTOLOGY). exp2484 confirmed the TAUTOLOGY and retired
      0.9351. exp2498 adversarially verified 0.9750 as the true group-conditional AUROC.
      This task (exp2510) is ensemble v7 with Tier 0r integration — the 10-verifier
      extension of the already-verified v6 ensemble. Different task: integration of
      a new verifier, not calibration de-duplication."
    retire_if_same_verdict: false
  prompt: "CONTEXT: Tier 0r (Curry-Howard soft-typed proof-path, arXiv:2510.01069 ICLR
    2026) proved viable in exp2504 with AUROC=0.9123 on the .241 corpus. It is NOT
    yet integrated into the group-conditional conformal ensemble (currently v6, 9 verifiers,
    AUROC=0.975). This task integrates Tier 0r as the 10th verifier and re-runs group-conditional
    calibration to produce ensemble v7.\n\nTASK: Integrate Tier 0r into group-conditional
    calibration. Report ensemble v7 AUROC.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/
    (existing verifier interface — find Tier0r implementation from exp2504)\n  {project_root}/results/experiment_2504*.json
    (Tier 0r prototype results)\n  {project_root}/python/carnot/pipeline/group_conditional_calibration.py
    (if exists) OR locate group-conditional calibration code from exp2498\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE
    STEPS:\n  0. PRECONDITIONS:\n     a. Verify Tier 0r implementation exists:\n        python3
    -c \"from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('ok')\"\n
    \       If not found: search {project_root}/python/carnot/verify/ for tier0r files.\n
    \       If still not found: write honest_verdict blocked_tier0r_not_implemented and
    exit.\n     b. Find group-conditional calibration code:\n        grep -r 'group_conditional'
    {project_root}/python/ --include='*.py' -l\n        If not found: write honest_verdict
    blocked_group_conditional_code_not_found and exit.\n     c. Find .241 evaluation
    corpus:\n        ls {project_root}/results/*eval* OR ls {project_root}/data/*corpus*\n
    \       If not found: write honest_verdict blocked_no_eval_corpus and exit.\n  1.
    Determine which group (A=logprob-class, B=semantic-class, C=logic-class) Tier 0r
    belongs to.\n     Curry-Howard proof-path is logic-class — assign to Group C alongside
    Tier 0d and Tier 0h.\n  2. Re-run group-conditional calibration with 10 verifiers
    (add Tier 0r to Group C).\n  3. Compute ensemble v7 AUROC over 5 seeds.\n  4. Compare
    to baseline: ensemble_v6_auroc=0.975. Report delta.\n  5. If tier0s_viable=True
    from exp2509: also produce ensemble v7b with HalluGuard Tier 0s added (11 verifiers).\n
    \  6. Write updated group-conditional calibration artifact.\n\nREQUIRED ARTIFACT
    FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required (complete:/success:/passed:/shipped:).\"\n
    \ - ensemble_v7_auroc:\n      principle: \"Primary metric — must be >= 0.970 to
    confirm no regression from ensemble v6 baseline. A new verifier should not degrade
    the calibrated ensemble.\"\n  - ensemble_v7_auroc_std:\n      principle: \"Multi-seed
    std captures stability of the calibration — required for paper-v6 cite-safe reporting.\"\n
    \ - ensemble_v6_baseline:\n      principle: \"Explicitly records the .241 baseline
    (0.9750) so regression detection is unambiguous.\"\n  - tier0r_group_assignment:\n
    \     principle: \"Documents which calibration group Tier 0r was assigned to — required
    for paper-v6 methodology section.\"\n  - n_seeds:\n      principle: \"Must be >=
    3 for multi-seed std to be meaningful per CLAUDE.md sample-size discipline.\"\n  -
    preconditions_checked:\n      principle: \"Records which resources were verified
    before launching.\"\n  - duration_s:\n      principle: \"Wall-clock measurement
    guards against fabrication.\"\n  - random_seed:\n      principle: \"Base random
    seed for 5-seed sweep — other seeds are base+k.\"\n\nACCEPTANCE GATES:\n  - condition:
    \"ensemble_v7_auroc >= 0.970\"\n    principle: \"Floor prevents accepting a new
    verifier that degrades the cite-safe headline AUROC below the HIVE peer gap (+0.0464
    at 0.970 vs 0.9236).\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2511-adaptive-conformal-v2
  title: 'Phase 2b: Adaptive Conformal Prediction v2 (arXiv:2604.13991) -- Prompt-Adaptive Calibration'
  milestone: 2026.05.242
  deliverable: results/experiment_2511_adaptive_conformal.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  prior_failures:
  - experiment_id: exp2485-group-conditional-conformal-v5
    verdict: 'complete: group_conditional_auroc_mean=0.975, hive_peer_breached=True'
    addressed_by: "exp2485 implemented fixed group-conditional calibration (3 static
      groups: logprob, semantic, logic). This task extends to PROMPT-ADAPTIVE calibration
      per arXiv:2604.13991: the calibration set selection varies dynamically based on
      prompt type. Different methodology — not a rerun of group-conditional. First attempt
      at prompt-adaptive calibration in the Carnot pipeline."
    retire_if_same_verdict: false
  prompt: "CONTEXT: The current group-conditional calibration uses fixed calibration
    sets per group (logprob, semantic, logic). arXiv:2604.13991 'Adaptive Conformal
    Prediction for Improving Factuality of LLM Generations' proposes prompt-adaptive
    calibration: the calibration set selection varies based on prompt type, improving
    coverage on distribution-shifted prompts.\n\nTASK: Prototype prompt-adaptive calibration
    as an enhancement to ensemble v7 (from exp2510). Compare AUROC to fixed group-conditional
    baseline.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/pipeline/group_conditional_calibration.py
    (or wherever calibration code was located by exp2510)\n  {project_root}/results/experiment_2510_ensemble_v7.json
    (baseline to compare against)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE
    STEPS:\n  0. PRECONDITIONS:\n     a. Verify exp2510 deliverable exists and reports
    ensemble_v7_auroc:\n        ls {project_root}/results/experiment_2510_ensemble_v7.json\n
    \       python3 -c \"import json; d=json.load(open('results/experiment_2510_ensemble_v7.json'));
    assert 'ensemble_v7_auroc' in d\"\n        If not found or malformed: write honest_verdict
    blocked_ensemble_v7_not_available and exit.\n     b. Find .241 evaluation corpus
    with prompt-type labels or features:\n        If no prompt-type metadata: use response-length
    percentile as proxy for prompt complexity tier.\n  1. Implement prompt_type_classifier(prompt:
    str) -> str returning one of [factual, reasoning, creative, code].\n     Use simple
    heuristic rules (keyword presence, question structure) — no GGUF needed.\n  2. Re-run
    group-conditional calibration with prompt-type-conditional calibration set selection.\n
    \ 3. Compute adaptive_conformal_auroc over 5 seeds.\n  4. Compare to baseline from
