- id: exp1186-dot-ebm-diffusion-redesign
  milestone: 2026.04.92
  deliverable: results/experiment_1186_dot_ebm_diffusion_redesign.json
  title: "DoT EBM-Diffusion Redesign — Sequence-Level Noise Injection + Score-Function Guided Denoising"
  agent_type: claude
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 30
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1171-diffusion-of-thought-inference-v1
      verdict: non_monotone_diminishing_returns
      addressed_by: "exp1171 produced AUROC=0.5 at ALL diffusion temperatures (random-level
                     signal). Root cause diagnosed: sequence-level EBM has flat gradients at
                     token level, so token-level masking finds no signal. exp1186 redesigns
                     using EBM-diffusion formulation (arXiv 2410.21357): noise injection at
                     the sequence embedding level, EBM score function ∇_z E(z) guides denoising.
                     This is a fundamentally different architecture, not a parameter sweep."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    exp1171 (Diffusion of Thought v1) produced AUROC=0.5 at all diffusion temperatures —
    completely random, no discriminative signal. The root cause: the original DoT design
    applied per-token energy masking using the gradient of a sequence-level EBM. But sequence-
    level EBMs have flat gradients at the single-token level; the gradient is effectively zero,
    making the masking uninformative.

    arXiv 2410.21357 (Energy-Based Diffusion Language Models) provides the correct architecture:
    - Forward process: inject isotropic Gaussian noise at the SEQUENCE EMBEDDING level (not token)
    - Reverse process: use EBM score function ∇_z log p(z) ≈ -∇_z E(z) for guided denoising
    - Verification: evaluate whether the denoised embedding has lower energy than the noisy one

    This redesign bypasses the flat-gradient problem entirely by operating in embedding space.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1171_diffusion_of_thought_inference_v1.json (failure evidence)
    - python/carnot/inference/diffusion_of_thought.py (current broken DoT implementation)
    - python/carnot/models/sos_kan_metacluster.py (EBM with ∇_z E access)

    TASK:
    1. Diagnose the flat-gradient root cause:
       - Load the k=5 ensemble.
       - For 10 FoVer examples: compute token-level energy gradient norms ‖∂E/∂token_i‖.
       - Confirm: are these gradients near-zero? (Expected: yes, confirming root cause.)

    2. Implement EBM-diffusion redesign in python/carnot/inference/diffusion_of_thought_v2.py:
       - DiffusionDoT class:
         - forward_diffuse(embedding, t, sigma): add Gaussian noise N(0, sigma^2 * t) to embedding
         - reverse_denoise(noisy_embedding, n_steps): iteratively subtract alpha * ∇_z E(z)
           where alpha is a step size (start with 0.01)
         - score_verification(clean_embedding, noisy_embedding): compute E(clean) vs E(noisy);
           if E(clean) < E(noisy): verification passes (lower energy = more valid)

    3. Evaluate redesigned DoT on 200-pair FoVer subset:
       - For each pair: diffuse, denoise, compute score_verification result
       - Compute AUROC against ground truth labels
       - If AUROC <= 0.55: retire DoT from future milestones (set retire_dot=True in artifact)

    4. Write tests/python/inference/test_diffusion_of_thought_v2.py (coverage of new code).

    5. Write results artifact.

    CONCRETE STEPS:
    - python3 -c "import json; d=json.load(open('results/experiment_1171_diffusion_of_thought_inference_v1.json')); print({k:v for k,v in d.items() if 'auroc' in k.lower() or 'verdict' in k.lower()})" 2>&1
    - cat python/carnot/inference/diffusion_of_thought.py 2>&1 | head -50
    - JAX_PLATFORMS=cpu python scripts/experiment_1186_dot_ebm_diffusion_redesign.py 2>&1 | tail -30
    - Write results/experiment_1186_dot_ebm_diffusion_redesign.json

    REQUIRED ARTIFACT FIELDS:
    - token_gradient_norms_near_zero: bool (root cause confirmed if True)
    - mean_token_gradient_norm: float (expected: << 0.01)
    - redesign_implemented: bool (v2 DiffusionDoT class exists)
    - redesigned_dot_auroc: float (on 200-pair FoVer subset)
