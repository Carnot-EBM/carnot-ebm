    - Uses a separate git worktree to avoid conflicts with the main claude conductor
    - Per-worktree state file: ops/conductor-state_gemini.json
    - Systemctl user service: carnot-conductor-gemini.service

    The existing agent_type: gemini routing already works for sequential dispatch
    (exp1075 used it). This experiment adds PARALLEL dispatch via a second worktree.

    EXISTING CODE TO READ FIRST:
    - openspec/change-proposals/parallel-multi-agent-conductor.md (FULL spec — read completely)
    - scripts/research_conductor.py (find dispatch logic — look for "claude -p" or agent dispatch)
    - ops/conductor-state.json (current state file format — use same format for gemini state)

