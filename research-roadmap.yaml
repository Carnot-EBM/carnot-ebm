    - {project_root}/python/carnot/experiment_6787_group_aware_soft_fixed_point.py
    - {project_root}/python/carnot/experiment_6788_soft_fixed_point_structural_control_ab.py
    - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md, REQ-VERIFY-6787 through REQ-VERIFY-6789
    - {project_root}/scripts/verdict_row_consistency_lint.py

    TASK:
    Run a paired zero-shot comparison of the frozen grouped fixed-point recipe and its parameter-
    matched flat recurrent control on the real-output probe fixture. Report effects by transformation,
    source model, family, case, and seed. Test whether group structure helps restructuring rather than
    merely exploiting identity or easier refinement.

    CONCRETE STEPS:
    0. PRECONDITIONS: require the exact upstream readiness field, source hashes, complete paired probe
       grid, Exp6786 training split, Exp6787/6788 hyperparameters, legal feature contract, five frozen
       seeds, matched budgets, and planned CPU wall budget. On failure write complete_blocked_*
       with gate_check_summary and stop. Do not fit a smaller or different model.
    1. Add a REQ-* real-output transfer comparison with scenarios for train isolation, matched arms,
       exact post-proposal authority, clustered inference, checkpoint/resume, and blocked behavior.
       Write tests first.
    2. Reconstruct both arms only from the frozen Exp6786 train split, original seeds, initialization,
       optimizer, steps, unroll, iteration cap, candidate count, features, and decoder. Reproduce the
       preregistered V592 candidate hashes before evaluating Exp6799.
    3. Freeze both arms. Prohibit Exp6799 graphs, source model IDs, exact labels, valid sets, held
       outcomes, and parser diagnoses from fitting, early stopping, threshold selection, convergence,
       or decoding.
    4. Run every model/family/case/transformation/seed/arm cell with matched parameter count, proposal
       iterations, candidate budget, legal observations, and wall envelope. Use the Exp6785 durable
       checkpoint and resume contract.
    5. After each proposal, call the independent exact checker. Record exact validity, dependency
       violation, nearest-valid distance, support, convergence, residual, candidate work, and runtime.
    6. Compute case-clustered paired intervals for grouped minus flat by refinement and restructuring.
       Positive requires a restructuring exact-valid lower bound above zero with no preregistered
       refinement, support, convergence, or work harm. Completion is independent of effect sign.
    7. Run group-ID permutation, dependency-edge removal, source-model identity removal, surface
       relabeling, identical-arm, and hard-negative controls. Aggregates must derive from rows.
    8. Run focused tests, ruff, spec coverage, adversarial verification, artifact convention audit,
       and verdict-row consistency lint.
    9. REQUIRED ARTIFACT FIELDS: field_principles; inference_substrate (CPU PyTorch frozen recipe,
       no LLM invocation); duration_s; random_seed; reproducibility_checksum; source_artifact_hashes;
       training_isolation_receipts; v592_reproduction_receipts; frozen_arm_definitions;
       parameter_counts_by_arm; optimization_steps_by_arm; candidate_budget_by_arm;
       feature_allowlist; feature_denylist; metrics_by_transformation_model_family;
       paired_exact_valid_deltas; clustered_confidence_intervals; support_contraction;
       convergence_harm; work_matching; destructive_control_results; rows (every paired unit);
       model_output_fixed_point_comparison_completed (exact field, true when the full grid completes
       regardless of effect); gate_check_summary; verifier_is_oracle (false); verdict_class (closed
       enum); and honest_verdict (terminal prefix).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6800_real_output_fixed_point_transfer_ab.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
