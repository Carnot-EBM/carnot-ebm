        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Milestone 2026.05.283 has completed. The authority artifact is results/experiment_3025_capstone_v283.json, and the staged next milestone is 2026.05.284. Do not repair historical results; carry forward flagged, blocked, gated-skipped, projection-only, pilot-only, missing, and adversarially flagged rows honestly.

