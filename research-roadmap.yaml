    \ Exp 489 got gpu_vram_insufficient in .37 — same root cause as RETRO-033.\
    \ Gemma4 INT4 quantization (Exp 500) resolves the VRAM budget. A\
    \ statistically significant result here (Wilson 95% CI lower bound > 0) is\
    \ the FIRST publishable claim Carnot can make publicly. Write 200 CoT pairs\
    \ to results/exp503_cot_pairs.json for JEPA retraining (Exp 510).\n\nDepends\
    \ on: Exp 500 (Gemma4QuantizedLoader), Exp 502 (CoT pairs pattern). Hardware:\
    \ 2x RTX 3090 (CARNOT_FORCE_LIVE=1). Expected duration: 150 min.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/gemma4_quantized_loader.py — Gemma4QuantizedLoader (Exp 500)\n\
    - python/carnot/pipeline/gpu_vram_gate_v2.py — GPUVRAMGateV2 (Exp 487)\n- python/carnot/pipeline/vram_budget_ledger.py\
    \ — VRAMBudgetLedger (Exp 501)\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/deliverable_guard.py — DeliverableGuard (Exp 462)\n- python/carnot/pipeline/dual_gpu_harness.py\
    \ — DualGPUHarness (Exp 480)\n- python/carnot/extraction/vericot_validator.py\
    \ — VeriCoTStepValidator (Exp 453)\n- python/carnot/extraction/vprm_verifier.py\
    \ — VPRMArithmeticVerifier (Exp 454)\n- python/carnot/pipeline/long_run_executor.py\
    \ — LongRunBenchmarkExecutor (Exp 437)\n- scripts/experiment_489_live_200q_vericot_vprm_v3.py\
    \ — prior harness (deferred)\n- ops/known-issues.md — RETRO-038\n\nTASK: Run\
    \ 200q GSM8K live benchmark with quantized Gemma4.\n1. Read CLAUDE.md spec-first\
    \ workflow.\n2. Call apply_env_autofix() FIRST.\n3. Add REQ-BENCH-043 (200q v4\
    \ uses Gemma4QuantizedLoader and GPUVRAMGateV2), REQ-BENCH-044 (200q v4 reports\
    \ Wilson 95% CI and is_statistically_positive flag when CI lower bound > 0),\
    \ REQ-BENCH-045 (200q v4 writes CoT pairs to results/exp503_cot_pairs.json with\
    \ at least 100 pairs per model for JEPA retraining), SCENARIO-BENCH-062/063/064\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n4. Write tests FIRST\
