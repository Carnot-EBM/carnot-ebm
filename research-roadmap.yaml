- id: exp7123-adapter-withheld-arc-loo-shard-a
  title: Adapter-withheld ARC leave-one-game-out shard A
  track: arc
  priority: critical
  model: opus
  requires_gpu: true
  max_turns: 100
  estimated_wall_time_min: 65
  per_unit_rows: true
  milestone: 2026.09.625
  deliverable: results/experiment_7123_v625_arc_loo_shard_a.json
  prior_failures:
    - experiment_id: exp7100-adapter-withheld-arc-loo-measurement
      verdict: blocked_gate_check_failed
      addressed_by: "Exp7123 removes the structured preflight gate, fixes zero-utilization parsing, limits scope to registry eligibility rank one and one SOTA model, and performs inline runtime checks."
      retire_if_same_verdict: true
    - experiment_id: exp7114-adapter-withheld-arc-loo-measurement
      verdict: blocked_gate_check_failed
      addressed_by: "Exp7123 writes a terminal artifact before model setup and runs a 65-minute single-game shard without depending on Exp7113 or any other preflight artifact."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V623 and V624 never measured adapter-withheld ARC value. Both measurements
    were blocked by upstream gates. The V624 precondition also treated valid
    zero-percent GPU utilization as missing. The operator requires V625 to drop
    that gate, check runtime prerequisites inline, cap each shard below 70
    minutes, and accept zero reached levels.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md ARC section
    - {project_root}/ops/status.md
    - {project_root}/ops/known-issues.md
    - {project_root}/ops/arc_solve_registry.yaml
    - {project_root}/results/experiment_7113_v624_arc_generation_liveness.json
    - {project_root}/results/experiment_7114_adapter_withheld_arc_loo_measurement.json
    - {project_root}/python/carnot/agentic/arc_competition_agent.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/scripts/experiment_template.py cached_sota_pair pattern
    - {project_root}/python/carnot/agentic/arc_live_runner_capability_lease.py
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Run one bounded adapter-withheld leave-one-game-out ARC measurement through
    the scored E3 action path. Use eligibility rank one, one mandated model, and
    a separately isolated adapter-visible control. Do not claim or register a
    game-level solve.

    CONCRETE STEPS:
    0. Read the registry only. Freeze a deterministic eligibility predicate and
       select rank one. Reject any game already reached by the same live generic
       mechanism. Do not inspect game source, adapters, or saved game recipes.
    1. Create the final artifact immediately with run_date, blocked-ready
       fields, field principles, and the selected output paths. Update it
       atomically after each phase. Do not create hundreds of source lines
       before this artifact exists.
    2. Add REQ-REPORT-7123 and RED tests. Cover zero-utilization parsing,
       missing cache files, lease failure, forbidden imports, source access,
       rank drift, invalid output, time cap, provenance loss, and registry
       mutation.
    3. Define MODEL_SPECS with headline repo
       unsloth/Qwen3.6-35B-A3B-GGUF. Resolve one cached quantized file through
       cached_sota_pair. Record path, quantization, size, and hash. Never
       download or substitute. Legacy-small models may only smoke-test setup.
    4. Check both GPUs and leases inline. Parse a numeric zero as zero. Start the
       pinned CUDA llama.cpp runtime and record process and telemetry receipts.
       If any prerequisite fails, write blocked_no_run and gate_check_summary.
    5. Run the real generic E3 policy for at most 16 model requests or 25
       environment actions. The generic branch must execute proposed actions.
       It cannot only recommend them. Stop the task at 60 measured minutes.
    6. Run a separately isolated adapter-visible control with the same game,
       model, seed, request limit, action limit, prompt budget, and ordering.
       Prove the withheld process did not import or read the adapter.
    7. Store prompt, output, parse, action, transition, forecast, verifier,
       signal-consumption, level, token, timing, process, and hash receipts per
       attempt. Keep bulky raw traces outside results and reference their hashes.
    8. Set arc_loo_shard_complete_score=1 only when both arms have complete
       receipts. Report zero as terminal null. Use blocked for runtime absence,
       disqualified for leakage or malformed evidence, and partial only for
       recoverable unfinished work.
    9. Declare solve_provenance=development_proxy, offline_reproduced=false,
       headline_solve_eligible=false, and arc_registry_delta=0. Preserve the
       registry hash. Do not add a solve.
    10. Run focused tests, GPU cleanup checks, artifact validation, adversarial
       verification, row consistency, scoped spec coverage, and root-clutter
       checks.
    11. REQUIRED ARTIFACT FIELDS: field_principles for every field below;
       preconditions_checked; run_date; MODEL_SPECS; inference_substrate
       (bounded local E3 generation and environment actions);
       inference_substrate_class (model_bounded_generation or blocked_no_run);
       execution_venue (host); duration_s; source_artifact_hashes; rows;
       per_game_results; adapter_withheld_rows; adapter_visible_control_rows;
       paired_delta_rows; game_selection_rows; registry_precheck_rows;
       attempt_receipt_rows; prompt_hash_rows; output_hash_rows; parse_rows;
       action_rows; transition_rows; forecast_rows; verifier_rows;
       signal_consumption_rows; level_rows; token_rows; timing_rows;
       process_rows; gpu_telemetry_rows; raw_trace_receipts; isolation_rows;
       forbidden_access_rows; time_cap_rows; MODEL_SPECS_rows;
       resolved_model_paths; resolved_model_hashes; solve_provenance
       (development_proxy); offline_reproduced (false);
       headline_solve_eligible (false); arc_registry_hash_before;
       arc_registry_hash_after; arc_registry_delta (0);
       arc_loo_shard_complete_score; adapter_withheld_any_level_score;
       random_seed; reproducibility_checksum; gate_check_summary with failed
       check, expected value, and observed value whenever honest_verdict starts
       blocked_; verifier_is_oracle (false); verdict_class (positive |
       circular_positive | null | blocked | disqualified | partial);
       honest_verdict consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7123_v625_arc_loo_shard_a.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
