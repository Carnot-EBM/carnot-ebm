      verdict: auroc_below_target
      addressed_by: "v1 used a fixed V·V^T decomposition with only ~200 FoVer pairs and reached AUROC 0.6042. v3 replaces V·V^T with a learned small-transformer Gram matrix (head_network(x)·head_network(x)^T) and trains on the 6,548-pair FoVer v4 corpus from Exp 1055 (30x more data). Both the architecture and the training set are different — this is genuinely new scope, not a rerun."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    arXiv 2510.13444 (Neural Sum-of-Squares) proves that a transformer can parameterize a Gram
    matrix G such that the polynomial f(x) = x^T G x is certifiably nonnegative (G is PSD ↔ f is SOS).
    SOS-KAN v1 (Exp 1047) used a fixed V·V^T decomposition. v3 replaces V·V^T with a learned
    small-transformer Gram matrix — more expressive while maintaining the SOS certificate.

    The FoVer corpus now has 6,548 Z3-confirmed pairs (Exp 1055). Previous SOS-KAN v1 had only
    ~200 pairs. This 30x data increase should dramatically improve AUROC.

