- id: exp1284-ars-uqlm-answer-stability-sota-audit
  milestone: 2026.04.100
  deliverable: results/experiment_1284_ars_uqlm_answer_stability_sota_audit.json
  title: "ARS/UQLM Answer-Stability Audit on SOTA GGUF - Gated on Cache Ready"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 60
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  gated_on:
    - upstream: exp1282-sota-gguf-cache-provenance-preflight
      artifact_field: cached_sota_ready
      op: "=="
      value: true
  prompt: |
    CONTEXT:
    This is the first SOTA GGUF gate after .99. Before certificate extraction,
    measure whether answers are stable under prompt/certificate-boundary perturbations.
    ARS suggests answer stability is a trust signal; PCC/UQLM-style certainty and
    Finch-Zk-style cross-model consistency sharpen that signal.

    MODEL_SPECS REQUIREMENT:
    This experiment needs an LLM. Use cached_sota_pair(gpu_indices=(0, 1)) first
    and record exact MODEL_SPECS and models_used. MODEL_SPECS must include at least
    one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy Qwen3.5-0.8B or gemma-4-E4B-it may only be CPU smoke-test fallbacks
    with headline_result_allowed=false.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1282_sota_gguf_cache_provenance_preflight.json
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - results/fover_corpus_v5.json
    - python/carnot/pipeline/fover_annotator.py

    TASK:
    Run a small answer-stability audit on 20-30 FoVer/GSM8K-style prompts using cached
    SOTA GGUF models. Do not attempt certificate tails yet.

    CONCRETE STEPS:
    1. Create the deliverable artifact immediately with status="in_progress".
    2. Load cached_sota_pair() MODEL_SPECS and set up GPU via ExperimentTemplate.setup_gpu.
    3. Sample 20-30 prompts and generate variants: normal answer, answer with certificate-boundary instruction, and semantically equivalent prompt.
    4. Measure answer_stability_score, equivalent_prompt_disagreement_rate, cross_model_consistency_delta, certainty_consistency_score, optional uqlm_uncertainty_score, and verifier_rubric_sensitivity.
    5. Record formalizer_failure_modes if structured/certificate-boundary instructions degrade answers.
    6. Write status="complete" with headline_result_allowed=true only for mandated SOTA GGUF outputs; otherwise blocked/smoke-only honestly.

    Run: python3 -c "import json; d=json.load(open('results/experiment_1284_ars_uqlm_answer_stability_sota_audit.json')); print(d.get('honest_verdict'), d.get('answer_stability_score'), d.get('headline_result_allowed'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1285-triggered-certificate-extraction-v2
