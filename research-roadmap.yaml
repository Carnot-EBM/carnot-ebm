- id: exp553-fover-corpus-v2-diversity
  milestone: 2026.04.42
  deliverable: results/experiment_553_fover_corpus_v2.json
  title: 'Exp 553: FOVER Corpus v2 — Merge, Diversity Audit, Balanced Dataset'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-056 and\
    \ RETRO-058. Exp 543 JEPA retrained on 24 pairs (88% carry violations) produced\
    \ AUC=0.444 — below random. The corpus was too small and too biased. This experiment\
    \ merges ALL available real pairs (Exp 442: 57 pairs, Exp 538: 25q, Exps 551-552:\
    \ 100q) and applies a diversity audit to ensure constraint_type_entropy >= 1.5\
    \ bits. This is the gating deliverable for Exps 556, 557, 558, 561.\n\nEXISTING\
    \ CODE TO READ FIRST:\n- python/carnot/pipeline/fover_annotator.py — FOVERAnnotator,\
    \ FOVERCoTStep, parse_cot_into_steps\n- python/carnot/pipeline/fover_live.py\
    \ — LiveFOVERResult\n- results/fover_labeled_steps_live.json — 57 pairs from\
    \ Exp 442\n- results/live_pairs_551.json — 50q pairs from Exp 551\n- results/live_pairs_552.json\
    \ — 50q pairs from Exp 552\n- results/experiment_538_live_25q_precision_v9.json\
    \ — check if it has CoT pairs\n- results/experiment_543_jepa_v8_retrain.json\
    \ — RETRO-056 context (see corpus_size=24, carry_pct=0.88)\n\nTASK: Build diverse\
    \ FOVER corpus v2 (>=100 pairs, entropy>=1.5 bits).\n1. Read CLAUDE.md spec-first\
    \ workflow.\n2. Add REQ-DATA-003 (FOVER corpus diversity gate: entropy >= 1.5\
    \ bits before model retraining), REQ-DATA-004 (atomic corpus write to results/fover_corpus_v2.json),\
    \ SCENARIO-DATA-007/008/009 to spec.\n3. Create python/carnot/pipeline/fover_corpus.py:\n\
    \   a. FOVERCorpusEntry dataclass: question, response, model_id, is_correct, constraint_types,\
    \ cot_steps.\n   b. merge_fover_sources(sources: list[str]) -> list[FOVERCorpusEntry]:\
    \ load from each JSON file, deduplicate by (question, model_id).\n   c. compute_corpus_diversity(entries:\
    \ list[FOVERCorpusEntry]) -> dict: returns constraint_type_counts, constraint_type_entropy\
    \ (Shannon entropy in bits), carry_pct, correct_pct, n_labeled.\n   d. balance_corpus(entries,\
    \ target_entropy=1.5) -> list[FOVERCorpusEntry]: if carry_pct > 0.6, downsample\
    \ carry violations to bring entropy up. Return balanced subset.\n   e. Exported\
    \ from carnot.pipeline.__init__.\n4. Write scripts/experiment_553_fover_corpus_v2.py:\n\
    \   a. subprocess kill FIRST, apply_env_autofix() SECOND.\n   b. ExperimentTimeoutWatchdog(553,\
    \ timeout_minutes=20).\n   c. ExperimentTemplate(553, 'FOVER Corpus v2 Diversity',\n\
    \      'results/experiment_553_fover_corpus_v2.json', requires_gpu=False).\n \
    \  d. Merge sources: ['results/fover_labeled_steps_live.json', 'results/live_pairs_551.json',\
    \ 'results/live_pairs_552.json'] (plus Exp 538 CoT if available).\n   e. Compute\
    \ diversity BEFORE balancing.\n   f. Balance corpus (target_entropy=1.5).\n  \
    \ g. Compute diversity AFTER balancing.\n   h. Write results/fover_corpus_v2.json\
    \ (AtomicResultWriter) with all balanced entries.\n   i. Build artifact: schema='carnot.fover_corpus.v2',\n\
    \      n_sources_merged=<count>,\n      n_pairs_before_balance=<count>,\n    \
    \  n_pairs_after_balance=<count>,\n      constraint_type_entropy_before=<float>,\n\
    \      constraint_type_entropy_after=<float>,\n      carry_pct_before=<float>,\n\
    \      carry_pct_after=<float>,\n      corpus_file='results/fover_corpus_v2.json',\n\
    \      retro_058_data_ready=<True if n_pairs_after_balance>=100 and entropy_after>=1.5>,\n\
    \      honest_verdict='corpus_ready' if retro_058_data_ready else 'corpus_partial'.\n\
    \   j. tmpl.assert_deliverable_written() as FINAL LINE.\n5. Write tests/python/test_fover_corpus.py\
    \ (100% coverage on fover_corpus.py).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n7. Update _bmad/traceability.md and ops docs.\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp554-extraction-diagnostic
  milestone: 2026.04.42
  deliverable: results/experiment_554_extraction_diagnostic.json
  title: 'Exp 554: VeriCoT+VPRM Extraction Diagnostic on Exp 538 Live Responses'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Exp 538 ran\
    \ live 25 questions and produced honest_verdict='live_no_improvement_25q' (RETRO-033\
    \ miss #10). The root cause is UNKNOWN. Three hypotheses: (1) VeriCoT/VPRM produces\
    \ false positives on correct IT-model responses, causing repair of valid answers;\
    \ (2) violations detected correctly but repair generates wrong fixes; (3) scoring\
    \ bug. This experiment loads Exp 538's 25 live responses with known labels and\
    \ runs VeriCoT + VPRM separately to measure FP and TP rates per extractor.\n\n\
    EXISTING CODE TO READ FIRST:\n- python/carnot/extraction/vericot_step_validator.py\
    \ — VeriCoTStepValidator\n- python/carnot/extraction/vprm_verifier.py — VPRMArithmeticVerifier\n\
    - results/experiment_538_live_25q_precision_v9.json — Exp 538 result (see per_question_results\
    \ if present)\n- python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline\n\
    - python/carnot/pipeline/live_precision_result.py — LivePrecisionResult\n\nTASK:\
    \ Diagnostic — measure per-extractor FP and TP rates on known-labeled responses.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-EXTRACT-030 (per-extractor\
    \ FP/TP rate measurement on labeled live responses), SCENARIO-EXTRACT-055/056/057\
    \ to spec.\n3. Create python/carnot/extraction/extraction_diagnostic.py:\n   a.\
    \ ExtractionDiagnosticResult dataclass: extractor_name, n_tested, n_violations_found,\
