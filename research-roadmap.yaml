  - id: exp3682-discrimination-vs-selection-gap-diagnosis
    prior_failures:
      - experiment_id: exp3672-ensemble-selection-value-where-sc-weak
        verdict: complete_ensemble_no_selection_value_even_with_headroom_sc_weak_earned_negative
        addressed_by: "exp3672 measured that ensemble best-of-N selection (argmax energy within a question) is WORSE than SC even with valid headroom -- an earned-negative. This task is NOT a rerun of that selection test: it DIAGNOSES WHY (the discrimination-vs-selection decoupling is a known phenomenon per arXiv:2512.23067) and TESTS FIXES the prior task never tried -- per-question energy normalization / z-scoring, a pairwise within-question ranking calibration, and a stronger free confidence baseline (self-certainty, arXiv:2502.18581). Different question (why + is it fixable), different method (per-question recalibration + ranking objective), retire_if_same only if NO fix recovers any selection value."
        retire_if_same_verdict: true
    milestone: "2026.06.337"
    title: "Diagnose + try to CLOSE the discrimination-vs-selection gap (exp3672: ensemble AUROC 0.93 but selection < SC) — is the decoupling fixable for an energy verifier via per-question normalization / a within-question ranking calibration / a stronger self-certainty baseline (arXiv:2502.18581), or is it fundamental as arXiv:2512.23067 suggests?"
    priority: high
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # anti-wipeout codex routing for .337
    estimated_wall_time_min: 26
    track: research
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3682_discrimination_vs_selection_gap.json
    prompt: |
      CONTEXT: exp3672 earned that the verifier ensemble DISCRIMINATES well (per-candidate AUROC ~0.93) but
      SELECTS worse than self-consistency (ensemble selection 0.344 < SC 0.459) even where headroom exists (oracle
      0.607, flips 28). arXiv:2512.23067 ("Reward Model Selection Crisis") documents this exact decoupling between
      discriminative ranking and downstream selection utility (Kendall tau 0.08-0.31). The open question for an
      ENERGY-based verifier: is the gap a fixable CALIBRATION/NORMALIZATION artifact (energy is calibrated for
      cross-question discrimination, not within-question ranking) or fundamental? This task DIAGNOSES the gap and
      tests fixes the prior task never tried. NULL/FALSE_NEGATIVE DISCIPLINE: only meaningful where the positive
      control holds (oracle > SC, flips > 0); a "nothing fixes it" verdict requires that at least one fix was
      actually applied and could in principle have changed selections.
      EXISTING CODE TO READ FIRST: results/experiment_3672 (the selection negative + the multi-candidate corpus)
      and results/experiment_2837 (the verifiers + FoVer) via scripts/summarize_artifact.py;
      research-references.md "The Reward Model Selection Crisis (arXiv:2512.23067)" + "Scalable Best-of-N via
      Self-Certainty (arXiv:2502.18581)" entries; project_orthogonality_stall memory.
      PRECONDITIONS (step 0): the exp3672 multi-candidate corpus (per-candidate energy + correctness labels)
      loadable. If not -> "complete: blocked_no_multi_candidate_corpus".
      CONCRETE STEPS:
        1. DIAGNOSE: confirm the decoupling on the exp3672 corpus -- per-candidate AUROC (cross-question
           discrimination) vs within-question selection accuracy; report the rank correlation between energy
           ordering and correctness WITHIN each question (this is the Kendall-tau-style decoupling measure).
        2. FIX A -- per-question normalization: z-score / min-max the ensemble energy WITHIN each question before
           argmax; re-measure selection accuracy + paired delta vs SC + McNemar.
        3. FIX B -- within-question ranking calibration: fit a simple monotone/pairwise calibration of energy to
           within-question correctness on a train split, evaluate selection on held-out.
        4. FIX C -- stronger baseline: implement self-certainty (arXiv:2502.18581) as the confidence signal and
           re-run BoN selection (SC vs self-certainty vs ensemble vs ensemble+self-certainty fusion).
        5. POSITIVE CONTROL: confirm oracle > SC and flips > 0 throughout; honest verdict -- does ANY fix make
           ensemble (or ensemble+self-certainty) selection beat SC with a delta CI excluding 0, or is the
           decoupling fundamental on this corpus?
      ANTI-POISON TEST DISCIPLINE (MANDATORY): parametrize any pytest over the honest outcomes
      (fix_recovers_selection_value / decoupling_fundamental_no_fix_helps / blocked) on synthetic fixtures;
      NEVER hard-assert one success string. Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; selection_gap_closed MUST be a BARE top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: best-of-N over cached candidates; no LLM generation)."
        per_candidate_auroc:
          principle: "Cross-question discrimination -- confirms the ensemble discriminates (the half that works)."
        within_question_rank_corr:
          principle: "Energy-vs-correctness rank correlation WITHIN questions -- the decoupling measure (arXiv:2512.23067)."
        sc_selection_accuracy:
          principle: "Majority-vote SC baseline accuracy -- the bar."
        oracle_bestofn_accuracy:
          principle: "Upper bound; must exceed SC for the positive control (selectable headroom)."
        flip_count:
          principle: "Selections changed by the best fix vs SC -- flip_count==0 means a degenerate test (FALSE_NEGATIVE_RISK)."
        selection_accuracy_per_question_normalized:
          principle: "FIX A: selection after within-question energy normalization."
        selection_accuracy_ranking_calibrated:
          principle: "FIX B: selection after a within-question ranking calibration (held-out)."
        self_certainty_selection_accuracy:
          principle: "FIX C baseline: self-certainty BoN selection (arXiv:2502.18581) -- the stronger free baseline."
        best_fix_vs_sc_delta_ci:
          principle: "Paired delta + bootstrap CI + McNemar of the BEST fix vs SC -- the gap-closure magnitude + significance."
        positive_control_valid:
          principle: "True iff oracle > SC AND flips > 0 -- without it the null is uninformative (the P0.1 lesson)."
        selection_gap_closed:
          principle: "BARE bool. True iff at least one fix makes ensemble (or ensemble+self-certainty) selection beat SC with the delta CI excluding 0, positive-control-valid -- the diagnosis verdict. STORE AS BARE true/false."
        n_examples:
          principle: "Sample-size rigor (>=50 multi-candidate items)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "per_candidate_auroc present AND within_question_rank_corr present AND positive_control_valid == true AND flip_count > 0"
          principle: "A selection-gap verdict requires the discrimination measure, the within-question decoupling measure, a valid positive control and a fix that actually changed selections -- otherwise it repeats the degenerate-test trap."
      TERMINAL VERDICTS: "complete: selection_gap_closed_per_question_calibration_recovers_value" /
      "complete: selection_gap_fundamental_no_fix_beats_sc_discrimination_decoupled_as_2512_23067" /
      "complete: blocked_no_multi_candidate_corpus"
      Run: cd {project_root} && python scripts/experiment_3682_discrimination_vs_selection_gap.py
