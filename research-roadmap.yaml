- id: exp1393-grpo-v8-ngrpo-zero-reward-fix
  milestone: 2026.04.108
  deliverable: results/experiment_1393_grpo_v8_ngrpo_zero_reward_fix.json
  title: "GRPO v8 NGRPO — Advantage Calibration via Virtual Max-Reward Sample"
  agent_type: codex
  model: gpt-5.5
  max_turns: 60
  estimated_wall_time_min: 90
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1383-grpo-v7-jury-rl-formal-verifier-rewards
      verdict: grpo_v7_improvement_pp_0.0_all_rollouts_unknown_zero_gradient
      addressed_by: "exp1383's root cause: all rollouts returned UNKNOWN from Carnot's semantic verifier. ResZero produced zero-mean advantage redistribution, resulting in zero gradient. NGRPO (arXiv:2509.18851) solves this via Advantage Calibration: inject a virtual max-reward sample into the group before computing advantages. The virtual sample breaks the zero-mean symmetry even when all real rollouts are UNKNOWN. retire_if_same_verdict=true: if NGRPO also produces 0.0pp improvement with UNKNOWN-group rollouts, the FoVer corpus is fundamentally incompatible with JURY-RL and must be replaced with a more structured reward corpus."
      retire_if_same_verdict: true
    - experiment_id: exp1235-grpo-v6-fspo-vps
      verdict: grpo_v6_wall_budget_exhausted_848s_vs_480s_budget
      addressed_by: "wall_budget_s=3600 (4x over exp1235's exhausted budget of 848s). NGRPO is more sample-efficient than FSPO+VPS because it doesn't require the second model pass for VPS."
      retire_if_same_verdict: true
    - experiment_id: exp1208-grpo-v5-tinyv2-dualgpu
      verdict: blocked_gate_check_failed_llama_cpp_gpu_offload_not_verified
      addressed_by: "llama.cpp GPU offload confirmed working in exp1366 (parse_rate=1.0) and exp1388 (fresh_verified_sample_count=59 via GPU path). The GPU gate that blocked exp1208 is resolved."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    GRPO training has been attempted 7+ times across 6 experiments with 0.0pp
    improvement in all cases. The root cause of exp1383 (the most recent attempt):
    all rollouts returned UNKNOWN from Carnot's semantic verifier, causing ResZero
    to produce zero-mean advantage redistribution — no gradient signal, no learning.
    NGRPO (arXiv:2509.18851, Negative-enhanced GRPO) solves this via Advantage
    Calibration: inject a virtual max-reward sample (reward=max_reward_in_group)
    into the group BEFORE computing advantages. The virtual sample breaks the
    zero-mean ResZero symmetry: real rollouts with reward=0 now have negative
    advantage relative to the virtual max-reward sample, providing a learning
    signal even when no real rollout is formally confirmed by the verifier.
    DualGPU MANDATORY: tensor_split=[0.5, 0.5] across both RTX 3090s.
    wall_budget_s=3600.
    Use {project_root} as the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - python/carnot/
    - research-references.md
    - results/experiment_1383_grpo_v7_jury_rl_formal_verifier_rewards.json
    - results/experiment_1388_fr11_self_learning_v4_dvi_grpo_integration.json

    TASK:
    Run GRPO v8 with NGRPO Advantage Calibration using both RTX 3090s.
    Apply the virtual max-reward sample technique from arXiv:2509.18851.
    If all rollouts are still UNKNOWN after NGRPO, emit retire_if_same_verdict=true
    and retire this experiment from future milestones.

    Every headline LLM generation MUST use MODEL_SPECS from
    cached_sota_pair(gpu_indices=(0, 1)). MODEL_SPECS must include at least one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF

    REQUIRED ARTIFACT FIELDS:
    - status
    - grpo_version
    - reward_mechanism
    - ngrpo_advantage_calibration_applied
    - virtual_max_reward_sample_injected
    - models_used
    - wall_budget_s
    - wall_time_used_s
    - training_steps_completed
    - jury_acceptance_rate
    - formal_reward_pass_rate
    - unknown_rollout_rate
    - grpo_v8_improvement_pp
    - wall_budget_exhausted
    - terminal_blocker
    - headline_result_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1393_grpo_v8_ngrpo_zero_reward_fix.json immediately with status="in_progress".
    2. Read exp1383 artifact to understand the exact failure: formal_reward_pass_rate=0.0, unknown_rollout_rate=1.0.
    3. Resolve MODEL_SPECS via cached_sota_pair(gpu_indices=(0, 1)) with tensor_split=[0.5, 0.5].
    4. Implement NGRPO Advantage Calibration:
       a. For each group of N=4 rollouts from JURY-RL, compute rewards using Carnot's semantic verifier.
       b. If all rollouts are UNKNOWN (reward=0): inject a virtual sample with reward=max_possible_reward (e.g., 1.0).
       c. Compute advantages using the augmented group (real rollouts + virtual sample).
       d. Real rollouts with reward=0 now have negative advantage relative to the virtual sample — gradient flows.
    5. Run GRPO training with NGRPO advantages. wall_budget_s=3600.
    6. Record training_steps_completed, jury_acceptance_rate, formal_reward_pass_rate, unknown_rollout_rate.
    7. Measure grpo_v8_improvement_pp vs pre-GRPO baseline on held-out FoVer split.
    8. If grpo_v8_improvement_pp == 0.0 AND unknown_rollout_rate >= 0.95: set terminal_blocker="ngrpo_still_zero_reward_fover_incompatible_with_jury_rl"; write retire_if_same_verdict=true in artifact.
    9. Set headline_result_allowed=true only if grpo_v8_improvement_pp > 0.
    10. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1393_grpo_v8_ngrpo_zero_reward_fix.json')); print(d.get('ngrpo_advantage_calibration_applied'), d.get('grpo_v8_improvement_pp'), d.get('unknown_rollout_rate'), d.get('headline_result_allowed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1394-dvi-v2-secl-combined
  milestone: 2026.04.108
  deliverable: results/experiment_1394_dvi_v2_secl_combined.json
  title: "DVI v2 + SECL Combined — 59 Fresh Cases, Discriminative Self-Calibration"
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  estimated_wall_time_min: 50
  priority: high
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1381-dvi-discriminative-verifier-training-v1
      verdict: dvi_auroc_delta_0.003486_only_4_fresh_cases
      addressed_by: "exp1381 trained DVI on only 4 fresh verified cases (dvi_auroc_delta=0.003486). 59 fresh cases are now available from exp1388 (fresh_verified_sample_count=59). Using 59 cases instead of 4 should produce a substantially larger delta. Additionally, exp1386 confirmed SECL is viable for DVI (secl_viable_for_dvi=true, ece_reduction_pct=34.96%). This task combines DVI training with SECL discriminative self-calibration."
      retire_if_same_verdict: false
    - experiment_id: exp1386-secl-discriminative-self-calibration
      verdict: secl_viable_for_dvi_true_ece_reduction_34pct
      addressed_by: "exp1386 confirmed SECL reduces ECE by 34.96% and secl_viable_for_dvi=true. This task integrates SECL directly into the DVI training loop as the calibration step after discriminative fine-tuning."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    DVI (Discriminative Verifier Improvement) fine-tunes the verifier checkpoint
    on fresh verified positive cases. Exp1381 used only 4 fresh cases and produced
    dvi_auroc_delta=0.003486 — barely above noise. Exp1388 produced
    fresh_verified_sample_count=59 via the DVI-only replay path. Using 59 cases
    should produce a substantially larger AUROC delta. Additionally, exp1386
    confirmed SECL (arXiv:2604.09624) reduces ECE by 34.96% and is viable for
    DVI (secl_viable_for_dvi=true). This task runs DVI v2 with 59 fresh cases
    and combines it with SECL discriminative self-calibration for maximum
    verifier improvement. CPU-only. Use {project_root} as the project root
    and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - python/carnot/verify/
    - python/carnot/models/
    - scripts/experiment_template.py
    - results/experiment_1381_dvi_discriminative_verifier_training_v1.json
    - results/experiment_1386_secl_discriminative_self_calibration.json
    - results/experiment_1388_fr11_self_learning_v4_dvi_grpo_integration.json

    TASK:
    Run DVI v2 using the 59 fresh cases from exp1388. Apply SECL discriminative
    self-calibration after DVI fine-tuning. Deploy the combined checkpoint.

    REQUIRED ARTIFACT FIELDS:
    - status
    - fresh_cases_used
    - dvi_v2_baseline_auroc
    - dvi_v2_trained_auroc
    - dvi_v2_auroc_delta
    - secl_ece_before
    - secl_ece_after
    - secl_ece_reduction_pct
    - dvi_v2_deployed
    - checkpoint_path
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1394_dvi_v2_secl_combined.json immediately with status="in_progress".
    2. Read exp1388 to locate the 59 fresh verified cases (fresh_verified_sample_count=59).
    3. Load the current verifier checkpoint from python/carnot/verify/ (the checkpoint deployed by exp1381).
    4. Run DVI fine-tuning on the 59 fresh cases. Use the same discriminative loss as exp1381 (fresh positive examples).
    5. Measure dvi_v2_baseline_auroc before fine-tuning and dvi_v2_trained_auroc after.
    6. Apply SECL discriminative self-calibration (from exp1386 recipe) to the DVI v2 checkpoint.
    7. Measure secl_ece_before and secl_ece_after to confirm ECE reduction.
    8. Deploy the combined DVI v2 + SECL checkpoint to python/carnot/verify/.
    9. Set dvi_v2_deployed=true and record checkpoint_path.
    10. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1394_dvi_v2_secl_combined.json')); print(d.get('fresh_cases_used'), d.get('dvi_v2_auroc_delta'), d.get('dvi_v2_deployed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

