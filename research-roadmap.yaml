    - {project_root}/scripts/experiment_template.py cached_sota_pair pattern
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Refresh the 2025-2026 source and model state. Map only decision-changing
    methods to V625 tasks. Append a dated execution delta to
    research-references.md and write a reproducible JSON artifact.

    CONCRETE STEPS:
    0. Check network access, readable planning sources, model cache metadata,
       and writable reference and artifact paths. On failure, write terminal
       blocked evidence and exact gate_check_summary.
    1. Search arXiv for EBM reasoning, neural constraint satisfaction, Ising,
       hallucination mitigation, KANs, constrained decoding, accelerated
       sampling, and continual learning. Restrict new claims to 2025-2026.
    2. Check current OpenReview EBM work, Extropic writing, Hugging Face Papers,
