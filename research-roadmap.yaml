    \   e. Build (bigram_feature, is_correct) pairs for NUP Probe training.\n   f.\
    \ 80/20 train/val split (stratified by is_correct).\n   g. Train NUP Probe v6:\
    \ same architecture as v4 (bigram dot product projection), but use CAPOCalibrationLoss\
    \ with lambda_cal=0.1. n_epochs=200, lr=1e-3.\n   h. Checkpoint every 50 epochs;\
    \ keep best by val_auc.\n   i. v6_val_auc = roc_auc_score(val_labels, val_scores).\n\
    \   j. Save to results/nup_probe_v6.safetensors if v6_val_auc >= 0.80.\n   k. Compare:\
    \ v5_auc=0.739, v6_val_auc=<measured>. Calibration improvement noted.\n   l. Build\
