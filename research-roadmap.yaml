      orthogonal to the existing k=19 ensemble (which uses Ising/KAN/semantic energy), not
      NLI-based diffusion energy. A new Tier 0bb based on NLI contradiction scores would
      complement the ensemble with a formally-grounded hallucination energy signal.

      NOTE: We do NOT need a full diffusion model. The key insight is the NLI score as energy proxy.
      Use a lightweight NLI approach (HuggingFace transformers cross-encoder or sentence-transformers
      if available, otherwise TF-IDF based contradiction heuristic).

      EXISTING CODE TO READ FIRST:
