- id: exp1365-eidoku-csp-neuro-symbolic-verification-probe
  milestone: 2026.04.106
  deliverable: results/experiment_1365_eidoku_csp_neuro_symbolic_verification_probe.json
  title: "Eidoku CSP Neuro-Symbolic Verification Probe — Grammar-Free Alternative"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 45
  priority: high
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1342-chopchop-nsvif-semantic-validator-gated
      verdict: blocked_gate_check_failed_certificate_parse_rate_0_below_0_75
      addressed_by: "Eidoku CSP is grammar-free and does not depend on the certificate parse gate; it verifies structural/geometric/symbolic properties from free-text model output."
      retire_if_same_verdict: false
    - experiment_id: exp1341-halluguard-certificate-failure-split
      verdict: diagnostic_no_universal_detector_claim_allowed
      addressed_by: "Eidoku's three-proxy CSP cost function provides measurable per-proxy pass rates, not a universal detector claim."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Carnot's certificate grammar approach has failed for multiple milestones
    because thinking-mode LLMs emit <think> tokens before the structural tag.
    arXiv:2512.20664 (Eidoku) provides a completely grammar-free alternative:
    it reformulates LLM reasoning verification as a CSP using three proxy costs
    (structural graph connectivity, geometric feature-space consistency, and
    symbolic logical entailment). This maps directly to Carnot's three tiers:
    Ising (structural), KAN (geometric energy), and Z3/NSVIF (symbolic).
    Use {project_root} as the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - python/carnot/
    - openspec/capabilities/verification/spec.md
    - openspec/capabilities/pipeline/spec.md
    - results/experiment_1364_105_carryforward_thinking_mode_blocker_audit.json
    - scripts/experiment_template.py

    TASK:
    Implement and run an Eidoku-style CSP neuro-symbolic verification probe on
    existing FoVer corpus cases. Do not call SOTA GGUF models. Use only local
    Python, existing corpus, Carnot verifiers, and Z3 (if available).

    REQUIRED ARTIFACT FIELDS:
    - status
    - corpus_cases_used
    - structural_violation_cost_mean
    - geometric_consistency_rate
    - symbolic_entailment_rate
    - csp_feasibility_rate
    - eidoku_auroc_proxy
    - ising_correlation
    - kan_correlation
    - eidoku_csp_viable
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1365_eidoku_csp_neuro_symbolic_verification_probe.json immediately with status="in_progress".
    2. Read research-references.md Eidoku entry and understand the three proxy cost functions.
    3. Load FoVer corpus cases from available corpus files (python/carnot/ or results/).
    4. For structural cost: extract reasoning step graph (steps as nodes, logical dependencies as edges); compute connectivity metric.
    5. For geometric cost: compute embedding similarity between consecutive reasoning steps using a lightweight local embedder (sentence-transformers or Carnot's existing embedding layer).
    6. For symbolic cost: extract extractable claims and run local Z3 check where possible; otherwise use a conservative rule-based path.
    7. Compute CSP feasibility rate: cases where all three proxy costs are below threshold.
    8. Compute eidoku_auroc_proxy using FoVer labels if available.
    9. Compute ising_correlation and kan_correlation: correlation of CSP feasibility with existing Ising/KAN energy scores on the same cases.
    10. Set eidoku_csp_viable=true if CSP feasibility rate > 0.5 and AUROC proxy > 0.55.
    11. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1365_eidoku_csp_neuro_symbolic_verification_probe.json')); print(d.get('corpus_cases_used'), d.get('csp_feasibility_rate'), d.get('eidoku_csp_viable'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1366-certificate-v8-tag-first-prefix-injection-crane
  milestone: 2026.04.106
  deliverable: results/experiment_1366_certificate_v8_tag_first_prefix_injection_crane.json
  title: "Certificate v8 — Tag-First Prefix Injection + CRANE Alternating Pattern on SOTA GGUF"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 90
  priority: critical
  requires_gpu: true
  gated_on:
    - upstream: exp1364-105-carryforward-thinking-mode-blocker-audit
      artifact_field: terminal_certificate_required
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1353-triggered-certificate-v7-truncproof-sota
      verdict: sota_triggered_certificate_v7_measured_parse_0_missing_structural_tag
      addressed_by: "Use tag-first prefix injection: supply the structural branch-selector tag as the first token(s) of the assistant turn so thinking-mode tokens cannot precede it. The grammar constraint is active from generation token 0."
      retire_if_same_verdict: true
    - experiment_id: exp1340-trigger-before-constrain-certificate-v6-sota
      verdict: missing_terminal_artifact_after_gate_order_failure
      addressed_by: "Terminal negative evidence from exp1353 confirms the trigger-before-constrain approach fails for thinking models; prefix injection replaces it."
      retire_if_same_verdict: true
    - experiment_id: exp1325-triggered-certificate-extraction-v5-runtime-fixed-dccd-gbnf
      verdict: stale_in_progress_after_disk_quota_failures
      addressed_by: "Environment and preflight issues were fixed in .104/.105; the root cause for .106 is the thinking-mode tag-emission failure, addressed by prefix injection."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    exp1353 confirmed that Qwen3/Gemma4-it thinking-mode generation emits
    <think>...</think> tokens before the structural certificate tag, producing
    trigger_token_hit_rate=0.0 and certificate_parse_rate=0.0. The fix is
    tag-first prefix injection: force the structural branch-selector tag as
    the FIRST token of the assistant response by including it as a partial
    assistant prefix before generation begins. This prevents thinking-mode
    tokens from appearing before the certificate branch selector. Combined
    with CRANE's alternating pattern (arXiv:2502.09061): an unconstrained
    reasoning section (token-budget capped) followed immediately by a
    prefix-injected constrained certificate section. Use {project_root} as
    the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - research-references.md
    - results/experiment_1352_truncproof_xgrammar_certificate_completion_preflight.json
    - results/experiment_1353_triggered_certificate_v7_truncproof_sota.json
    - results/experiment_1364_105_carryforward_thinking_mode_blocker_audit.json
    - python/carnot/
    - openspec/capabilities/pipeline/spec.md
    - openspec/capabilities/verification/spec.md

    TASK:
    Run a tag-first prefix injection certificate extraction experiment using the
    CRANE alternating pattern. Produce a terminal artifact (positive or retire).
    If prefix injection cannot be implemented, document the blocker and retire
    the trigger-before-constrain branch with retire_if_same_verdict=true evidence.

    Every headline LLM generation MUST use MODEL_SPECS from
    cached_sota_pair(gpu_indices=(0, 1)) when available. MODEL_SPECS must
    include at least one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models (Qwen3.5-0.8B, gemma-4-E4B-it) are allowed only as
    CPU smoke tests with headline_result_allowed=false.

    REQUIRED ARTIFACT FIELDS:
    - status
    - models_used
    - prefix_injection_method
    - prefix_injection_supported
    - certificate_case_count
    - trigger_token_hit_rate
    - certificate_parse_rate
    - certificate_truthfulness_rate
    - unknown_preservation_rate
    - parse_rate_delta_over_exp1353
    - crane_reasoning_budget_tokens_used
    - terminal_blocker
    - retire_trigger_before_constrain
    - headline_result_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1366_certificate_v8_tag_first_prefix_injection_crane.json immediately with status="in_progress".
    2. Read exp1352 (preflight), exp1353 (prior failure), exp1364 (audit) to inherit thresholds and confirm the thinking-mode blocker.
    3. Resolve MODEL_SPECS via cached_sota_pair(gpu_indices=(0,1)); record hf_id, quantization, GPU assignment.
    4. Implement tag-first prefix injection: in the llama.cpp call, supply the structural branch-selector tag (e.g., "CERTIFICATE_SAT", "CERTIFICATE_UNSAT", "CERTIFICATE_UNKNOWN", or "CERTIFICATE_REPAIR") as the first token(s) of the assistant prefix before generation starts. Use the grammar constraint active from position 0 of the constrained block.
    5. Use CRANE alternating pattern: (a) unconstrained reasoning section, token-budget capped at 256 tokens; (b) forced-prefix constrained certificate section after reasoning completes.
    6. Build a bounded certificate suite with SAT, UNSAT, UNKNOWN, and repair cases.
    7. Measure trigger_token_hit_rate (1.0 if prefix injection forces tag), certificate_parse_rate, certificate_truthfulness_rate, unknown_preservation_rate.
    8. Compute parse_rate_delta_over_exp1353 against the exp1353 baseline of 0.0.
    9. Set retire_trigger_before_constrain=true and write terminal_blocker if prefix injection cannot be implemented or if parse_rate is again 0.0.
    10. Set headline_result_allowed=true only if at least one mandated SOTA GGUF produced parse_rate >= 0.75.
    11. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1366_certificate_v8_tag_first_prefix_injection_crane.json')); print(d.get('certificate_parse_rate'), d.get('prefix_injection_supported'), d.get('retire_trigger_before_constrain'), d.get('headline_result_allowed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1367-diffutruth-energy-of-falsehood-probe
  milestone: 2026.04.106
  deliverable: results/experiment_1367_diffutruth_energy_of_falsehood_probe.json
  title: "DiffuTruth Energy-of-Falsehood Probe — Non-Equilibrium Complement to Ising/KAN"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 40
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp103-kan-energy-tier
      verdict: "OK (audit-script scope-match false positive: exp103 is KAN energy tier prototype; exp1367 is DiffuTruth diffusion reconstruction energy for hallucination detection — entirely different technique and domain)"
      addressed_by: "Different scope: exp103 built the KAN energy tier architecture; exp1367 implements arXiv:2602.11364 DiffuTruth non-equilibrium reconstruction energy as a CPU-only hallucination probe. No prior failure to address; this note satisfies the audit script's fuzzy title-match check."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    arXiv:2602.11364 (DiffuTruth) proposes an unsupervised hallucination
    detection framework based on non-equilibrium thermodynamics: factual truths
    act as stable attractors on a generative manifold while hallucinations are
    unstable. The Generative Stress Test corrupts a claim with noise and
    reconstructs it using a discrete text diffusion model, then measures
    Semantic Energy via an NLI critic. DiffuTruth achieves AUROC 0.725 on
    FEVER. This is a non-equilibrium energy signal complementary to Carnot's
    Ising/KAN equilibrium energy tiers. Use {project_root} as the project
    root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - python/carnot/
    - openspec/capabilities/verification/spec.md
    - scripts/experiment_template.py

    TASK:
    Implement a feasibility probe of the DiffuTruth Generative Stress Test
    approach using a local perturbation proxy (full discrete diffusion is not
    required for a CPU feasibility probe). Measure whether reconstruction
    energy correlates with Carnot's existing Ising/KAN energy scores on FoVer
    corpus cases.

    REQUIRED ARTIFACT FIELDS:
    - status
    - corpus_cases_used
    - perturbation_method
    - reconstruction_method
    - diffutruth_energy_delta_mean
    - ising_correlation
    - kan_correlation
    - detection_auroc_proxy
    - hallucination_energy_rate
    - viable_as_complement
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1367_diffutruth_energy_of_falsehood_probe.json immediately with status="in_progress".
    2. Read research-references.md DiffuTruth entry and understand the Generative Stress Test.
    3. Load FoVer corpus cases with existing Ising/KAN energy scores from available result files.
    4. Implement a local perturbation proxy: corrupt each claim by replacing key tokens with synonyms or random tokens (character-level or word-level), then compute semantic similarity (cosine or NLI score) between original and corrupted-then-back-paraphrased claim.
    5. Compute diffutruth_energy_delta_mean: mean difference in semantic similarity between factual and hallucinated cases.
    6. Compute Pearson correlation between diffutruth proxy energy and existing Ising energy scores (ising_correlation).
    7. Compute Pearson correlation between diffutruth proxy energy and KAN energy scores (kan_correlation).
    8. Compute detection_auroc_proxy using FoVer labels.
    9. Set viable_as_complement=true if detection_auroc_proxy > 0.55 and ising_correlation or kan_correlation shows alignment (positive or negative, as long as interpretable).
    10. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1367_diffutruth_energy_of_falsehood_probe.json')); print(d.get('corpus_cases_used'), d.get('detection_auroc_proxy'), d.get('viable_as_complement'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

