  - id: exp3982-arcmemo-solve-transfer
    operator_override: >
      2026-06-09 operator directive (standing self-learning MANDATE, research-program.md): versioned
      continuation of the SUCCESSFUL exp3970 ArcMemo transfer win with a STATED forward difference (test
      SOLVE-transfer, not just induction-cost) — false-positive scope-match vs exp3970/exp3958. exp3970
      SUCCEEDED (transfer_win), so this is not a doomed rerun; it extends the win to the solve loop.
    milestone: "2026.06.368"
    title: "ArcMemo SOLVE-transfer (self-learning MANDATE; extends exp3970's induction-cost transfer win to the SOLVE loop): exp3970 showed NL concept-memory reuse cuts INDUCTION cost across games. This tests whether the SAME concept memory makes a NEW game's SOLVE cheaper — does retrieving the banked solved-game concepts ('select-then-place' r11l, 'permute-set' lp85, 'pattern-match-then-navigate' sc25, + the 4th game from exp3981) reduce the ACTIONS/ATTEMPTS to solve the 4th game vs a cold-start solver with no memory? Two arms at equal perception: (A) cold-start, (B) concept-memory-seeded. This is Tier-2 constraint memory (research-program.md) in the SOLVE loop, the self-learning datum that compounds across games. POSITIVE CONTROL: the sequence must share structure (>=2 select/place-family games) or transfer is impossible by construction (FALSE_NEGATIVE_RISK)."
    priority: high
    track: research
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    inference_substrate: offline_arc_agi3_perception_planner_real_env_confirmed
    deliverable: results/experiment_3982_arcmemo_solve_transfer.json
    prompt: |
      CONTEXT. research-program.md MANDATES a self-learning experiment each milestone. exp3970 showed
      ArcMemo NL concept-memory reuse cuts INDUCTION cost (transfer_win, reused 2 concepts). This extends
      the win to the SOLVE loop: does the concept memory make SOLVING a new game cheaper (fewer real-env
      actions/attempts), not just inducing a model? This is Tier-2 constraint memory (the persistent
      GameGraph + concept memory = the CPU+memory hardware path) compounding across games.

      EXISTING CODE TO READ:
        - results/experiment_3970_cross_game_arcmemo_transfer.json (the induction-cost transfer win + the concept memory schema)
        - results/experiment_3946/3954/3966_*.json (the solved mechanics = the seed concepts: select-then-place, permute-set, pattern-match-then-navigate)
        - results/experiment_3981_fourth_game_first_solve.json (the 4th game to solve cold vs memory-seeded; if absent, use sc25 as the held-out target)
        - scripts/experiments/experiment_3946_r11l_first_solve.py (the solver to instrument for action-counting)
        - python/carnot/agentic/arc_agi3_world_model.py (GameGraph — the persistent memory substrate)

      CONCRETE STEPS:
        0. PRECONDITIONS: offline env loads (the Arcade OFFLINE check). Else honest_verdict
           blocked_arc_offline_env_unavailable and EXIT.
        1. Build the concept memory seeded with the banked solved-game concepts (NL/structured records:
           {{name, when_it_applies, effect}}). POSITIVE CONTROL: ensure >=2 games share a concept family
           (else transfer is impossible by construction — report and STOP).
        2. Solve a held-out target game (the 4th game, or a re-held-out solved game) in TWO arms at equal
           perception: (A) cold-start (no memory), (B) concept-memory-seeded (retrieve+try relevant concepts
           first). Count REAL env.step actions + reset attempts to the first level-up in each arm.
        3. Measure: does arm B solve with FEWER actions/attempts than arm A — and record WHICH concept was
           retrieved+reused (concrete transfer evidence, not assumed).

      REQUIRED ARTIFACT FIELDS: (BARE scalars; principle: lines guide YOU)
        solve_transfer_win: principle "BARE BOOL — does concept-memory-seeded solving use FEWER actions/attempts than cold-start (the self-learning claim extended to the solve loop)."
        actions_cold_start, actions_with_memory: principle "Real env.step actions to first solve in each arm — the cost axis (memory should cut it)."
        attempts_cold_start, attempts_with_memory: principle "Reset/retry attempts in each arm — the search-efficiency axis."
        concept_reused: principle "Which banked concept was retrieved+applied on the new game (concrete transfer evidence; null if none applied)."
        positive_control_shared_structure: principle "BARE BOOL — the game sequence shares >=2 same-family concepts (transfer is possible by construction; FALSE_NEGATIVE_RISK gate)."
        real_env_confirmed: principle "BARE BOOL — both arms' solves confirmed by the real env's levels_completed (no fabrication)."
        random_seed, honest_verdict, duration_s, inference_substrate: principle "Reproducibility + terminal-prefix verdict + the real-env substrate."

      honest_verdict MUST start with `complete:`/`success:` or `blocked_<resource>`. A solve-transfer win is
      `success: arcmemo_solve_transfer_<a_cold>to<a_mem>_actions`. No win (with a passing positive control)
      is an honest `complete: arcmemo_solve_no_transfer_<reason>` (concept memory helps induction but not the
      solve loop — a real, bounded finding).
      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_3982_arcmemo_solve_transfer.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

