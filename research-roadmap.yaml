milestone: "2026.06.336"
milestone_title: "Advance the headline (clean up the dependency-aware weighting lead that BEAT Carnot 0.9326 vs 0.919, de-tautologized + held-out validated, arXiv:1903.05844 / Weaver arXiv:2506.18203), stress the FACTS earned-negative on a REAL hallucination benchmark (RAGTruth arXiv:2401.00396 vs the .335 synthetic corpus, with the complementary catch-rate lens not just AUROC), SHIP the second-pair-of-eyes detector into the Phase-1 product surface (math-validated + balanced-code operating points), open the NEW direction of ensemble selection value where self-consistency is WEAK (flip the answered P0.1 premise), continue FR-11 self-learning + hardware continuity. paper_ready MUST stay TRUE (G1-G4); P0.1 stays honest-negative; trained-judge-OOD is RETIRED."
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md

# OUTER-LOOP / OPERATOR PRE-STAGED ROADMAP (2026-06-01, Claude Opus 4.8). RATIONALE:
# .335 made the FACTS row REAL (exp3654/3655: facts is domain-bound even with a real NLI verifier,
# grounding 0.744 ~= confidence 0.745) BUT on a SYNTHETIC corpus, and a complementary catch-signal exists
# (McNemar p=0.0003, ~40% catch-at-fixed-FPR). The single most exciting lead: dependency-aware ensemble
# weighting BEAT Carnot (exp3656: 0.9326 vs 0.919) -- but that artifact was TAUTOLOGY-flagged (false
# positive: same AUROC stored under two field names). .336 PRIORITIES: (1) clean up the dependency-aware
# weighting lead so it can advance the headline (de-tautologize, multi-seed, DeLong, held-out validate);
# (2) stress the facts negative on a REAL benchmark (RAGTruth) -- is "facts domain-bound" a corpus artifact
# or genuine?; (3) SHIP the second-pair-of-eyes detector (exp3657) into the Phase-1 surface; (4) open a NEW
# direction -- ensemble SELECTION value where self-consistency is WEAK (P0.1 failed because SC was
# near-optimal; flip the premise). INVARIANTS: paper_ready=true (G1-G4 closed 2026-05-31; do NOT regress;
# headline FoVer 0.9131 stays frozen -- a dependency-aware win is a CANDIDATE for a future re-freeze, not a
# silent substitution). P0.1 stays honest-negative. Trained-judge-as-cross-domain-fix is RETIRED (exp3659
# same-verdict) -- do NOT re-propose. Every gated_on is a BARE scalar (feedback_gated_fields_must_be_bare).
# NO poison tests (.325/.326/.332 cascade): parametrize pytests over honest verdicts on realistic synthetic
# fixtures; never hard-assert one success string against a real corpus; never use Q/R/H-number placeholders.
# BACKEND: exp3653 reported gemini RECOVERED (single probe), but .333 was a total gemini-crash wipeout and
# codex ran 28/28 clean across .334+.335. Asymmetric risk -> keep codex+requires_codex for ONE more
# milestone while exp3666 confirms gemini stable across a 2nd consecutive probe; .337 may then flip to
# gemini-default. Operator may override to gemini-default if quota preservation outweighs the wipeout risk.

