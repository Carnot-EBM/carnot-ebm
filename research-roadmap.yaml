      - {project_root}/results/experiment_5922_gguf_schema_decoder_bridge.json
      - {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
      - {project_root}/python/carnot/constraint_ir_replay.py
      - {project_root}/python/carnot/constraint_store.py
      - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
      - {project_root}/openspec/capabilities/verification/spec.md

      TASK:
      Implement and independently qualify a generic high-recall ConstraintIR atom universe, non-pruning candidate-support protocol, deterministic paraphrase/entity-permutation view transforms, exact subset-completion engine, and included/excluded-pool audit contract over sealed held families; write results/experiment_5935_non_pruning_atomic_constraint_support.json without invoking an LLM or reopening schema reprompting.

      CONCRETE STEPS:
      0. PRECONDITIONS: replay and hash Exp5908, Exp5921, Exp5922, exact Python/Z3 authorities, schemas, held splits, output paths, exclusions, and protected files. Verify disk/RAM and atomic JSON/JSONL output.
      1. Add REQ-* atom-universe, non-pruning, independent-view, exact-completion, excluded-pool, label-secrecy, and tamper-rejection requirements plus failing tests before implementation.
      2. Define a versioned atom schema over declarations, typed relations, comparisons, domains, cardinalities, and compositions. Derive legal atom shapes mechanically from the open operation/type schema. Enumerating complete answers, per-case solution IDs, or a hidden-reference token list is forbidden.
      3. For each sealed case, derive a model-visible atom vocabulary from entities/types and a hidden exact reference set from the fixture. Keep those paths separate and hash both. The proposal contract accepts overcomplete atom sets, records provenance per atom, and may rank but never hard-delete a legal atom before the union is sealed.
      4. Implement deterministic meaning-preserving paraphrase and entity-permutation transforms with inverse maps. Prove exact reference invariance, no answer leakage, and transform independence from model output.
      5. Implement bounded exact subset completion over the sealed union. Python/Z3 agreement and certificate replay own acceptance. Test injected missing atoms, spurious atoms, contradictions, duplicates, type/scope failures, empty supports, support saturation, and candidate-order permutations.
      6. Define preregistered included/excluded pools and audit strata before labels are opened. The exact reference set labels atom relevance; accepted-pool-only recall claims must be rejected mechanically.
      7. Report whether exact completion recovers injected cases only when the true atoms remain in support; demonstrate that search cannot manufacture a deleted required atom.
