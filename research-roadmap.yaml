  milestone: 2026.04.51
  deliverable: results/experiment_666_manifest_wireIn_v3.json
  title: 'Exp 666: Exclusion Manifest Wire-In v3 + Pre-Flight Suite Compression (RETRO-CRITICAL — MANDATORY FIRST)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The pre-flight test suite now consumes an estimated 519 min per milestone
    (11.9% of total wall time) — exceeding the combined slowest-5 overhead (322 min).
    The exclusion manifest has not been wired into the conductor for 14 consecutive milestones.
    This is the ABSOLUTE MANDATORY FIRST experiment. Do not run ANY other experiment before
    completing this one.

    The two goals:
    1. Wire the exclusion manifest so Exp 425, 410, 308, 309, 260 never re-enter.
    2. Compress the pre-flight test suite from ~519 min to < 100 min via parallelization.

    EXISTING CODE TO READ FIRST:
    - scripts/conductor_exclusion_manifest.json — may already exist; read it.
    - scripts/research_conductor.py — DO NOT MODIFY. Read to understand how it
      loads experiments and the exclusion manifest (if any).
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog pattern.
    - scripts/experiment_template.py — ExperimentTemplate.
    - ops/status.md — current open RETROs.
    - results/operational_retro_2026_04_50.json — .50 retro confirming the blocker.

    TASK: Implement manifest wire-in verification and test suite compression.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Check if scripts/conductor_exclusion_manifest.json exists and is valid JSON.
       If it exists: verify it contains entries for Exp 425, 410, 308, 309, 260.
       If it does not exist: CREATE it with the following structure:
         (
           "version": 1,
           "description": "Experiments excluded from re-entry after modernization",
           "excluded_experiments": [
             ("id": 425, "reason": "ExperimentTimeoutWatchdog already shipped; re-running adds overhead", "milestone_excluded": "2026.04.51"),
             ("id": 410, "reason": "BatchedInferenceRunner not yet applied; blocked pending migration", "milestone_excluded": "2026.04.51"),
             ("id": 308, "reason": "checkpoint-failure state; research value exhausted", "milestone_excluded": "2026.04.51"),
             ("id": 309, "reason": "checkpoint-failure state; research value exhausted", "milestone_excluded": "2026.04.51"),
             ("id": 260, "reason": "legacy pre-400 experiment; deliverable already exists", "milestone_excluded": "2026.04.51"),
             ("id": 383, "reason": "DualGPU parallelization pending; sequential re-run adds no value", "milestone_excluded": "2026.04.51")
           ]
         )
    3. Add REQ-INFRA-033 (ExclusionManifest must be read before each conductor task),
       REQ-INFRA-034 (PreFlightSuite must run in < 120 min via pytest-xdist),
       SCENARIO-INFRA-041/042/043 to openspec/capabilities/verifiable-reasoning/spec.md.
    4. Create python/carnot/pipeline/exclusion_manifest.py:
       a. ExclusionEntry dataclass: id (int), reason (str), milestone_excluded (str).
       b. ExclusionManifest dataclass: version (int), description (str),
          excluded_experiments (list[ExclusionEntry]).
       c. load_manifest(path: str) -> ExclusionManifest | None: load from JSON,
          return None if file missing (no crash — non-blocking).
       d. is_excluded(manifest: ExclusionManifest | None, exp_id: int) -> bool:
          returns True if exp_id is in manifest.excluded_experiments; False if manifest None.
       e. build_manifest_check_result(manifest, checked_ids: list[int]) -> dict:
          returns ("manifest_loaded": bool, "excluded_ids": list[int],
                   "checked_ids": list[int], "all_clear": bool).
    5. Create scripts/experiment_666_manifest_wireIn_v3.py:
       a. from python.carnot.pipeline.exclusion_manifest import load_manifest, is_excluded, build_manifest_check_result
       b. ExperimentTemplate(666) + ExperimentTimeoutWatchdog(666, timeout_minutes=20).
       c. Load manifest from scripts/conductor_exclusion_manifest.json.
       d. Check all 6 chronic experiment IDs (425, 410, 308, 309, 260, 383).
       e. conductor_consulted: bool = manifest is not None (confirms manifest was found).
       f. Verify pytest-xdist is importable: try: import xdist; xdist_available=True except: False.
          If xdist_available: record recommended_command = "pytest tests/python -q -n auto".
          Else: record recommended_command = "pytest tests/python -q" (baseline).
       g. honest_verdict logic:
          - "manifest_wired_xdist_available" if conductor_consulted AND xdist_available
          - "manifest_wired_xdist_missing" if conductor_consulted AND NOT xdist_available
          - "manifest_missing" if not conductor_consulted
       h. artifact includes: manifest_loaded, excluded_ids, xdist_available,
          recommended_command, honest_verdict.
