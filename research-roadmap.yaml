      the deciding same-run paired control resolving feedback-chain vs iid-resampling. Execution-based
      follow-up — false-positive scope-match vs the RETIRED GAP-3 lineage and the failed DSL-only exp3975;
      a NEW mechanism-deciding control, never a doomed rerun.
    milestone: "2026.06.369"
    title: "GAP-4 conductor_followup #3 — FEEDBACK-VS-REDRAW DECIDING CONTROL (same-run paired design): per task, arm A = one <=3-iteration FEEDBACK chain vs arm B = 3 INDEPENDENT singles, SAME 600s budget, INTERLEAVED within ONE codex run (the measured 2.2x between-run variance forbids cross-run comparison — all controls must be same-run). Exact McNemar/Fisher on paired task outcomes. Resolves whether feedback CONTENT beats iid resampling (current evidence ambiguous: post-feedback per-call 9/21=0.4286 ~ iter0 0.4583; iid 3-redraw predicts 0.841 vs 0.833 observed). Either outcome is a publishable mechanism finding — does the chain's feedback add value, or is it just 3 draws? Honest verdict required."
    priority: high
    track: research
    max_turns: 80
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    inference_substrate: codex_program_induction_executed_consistency_vs_cached_arc_pool
    deliverable: results/experiment_3989_gap4_feedback_vs_redraw.json
    prompt: |
      CONTEXT. The GAP-4 chain harness uses a <=3-iteration FEEDBACK chain (each iter sees the prior
      program's demo failures). It is unresolved whether that feedback beats simply drawing 3 INDEPENDENT
      programs (iid resampling): post-feedback per-call 0.4286 ~ iter0 0.4583, and iid-3-redraw predicts
      0.841 vs the 0.833 observed — ambiguous. conductor_followup #3 is the deciding same-run paired control.
      The result tells us whether to deploy feedback chains (expensive) or cheaper independent redraws.

      EXISTING CODE/EVIDENCE TO READ FIRST:
        - results/arc3_gap4_chain_arms_adversarial_verify.json (synthesis.conductor_followups[2] — the
          VERBATIM spec + the 2.2x between-run variance finding that forces same-run interleaving)
        - results/arc3_gap4_arc2_chain_ensemble.json (the feedback-chain harness to fork into A vs B)
        - results/arc3_gap4_arc2_eval_pool.json.gz (the chain-feasible tasks for the paired control)

      CONCRETE STEPS:
        0. PRECONDITIONS: `command -v codex` succeeds; the eval pool loads. Else honest_verdict
           blocked_codex_unavailable / blocked_eval_pool_unreadable and EXIT.
        1. For each chain-feasible task, run arm A = one <=3-iter FEEDBACK chain AND arm B = 3 INDEPENDENT
           singles, SAME 600s budget, INTERLEAVED within ONE codex run (do NOT compare across runs — the
           2.2x between-run variance invalidates that). Archive transcripts; leak-audit.
        2. Score each arm's demo-perfect + gold (post-hoc). Build the paired contingency table (task-level:
           A-correct/B-correct, A-correct/B-wrong, etc.).
        3. Exact McNemar (paired) / Fisher: does feedback CONTENT beat iid resampling at equal budget?

      REQUIRED ARTIFACT FIELDS: (BARE scalars; principle: lines guide YOU)
