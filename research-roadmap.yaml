milestone: 2026.06.425
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-23) -- ADOPTS the pre-staged .425 design doc (Pre-Staged
  Roadmap Convention; the pre-staged outer-loop session had the deeper root-cause context) and enriches it
  with the demonstrated .424 TAUTOLOGY-quarantine fix + the verified ARC-AGI-3 SOTA literature. The .424
  capstone (exp4602) closed at reproducible_total_levels=55 (A2 banked ft09 L1->L2), live_submittable=55
  (beats the standing 33-level submitted scorecard), ready_for_operator_submit=True. TWO decisive facts the
  .425 plan is built on: (1) the GENERATION wall is EXHAUSTED -- five consecutive nulls (.421 re-rank, .422
  verifier-expansion regressed, .423 router, .424 A1 wiring [TAUTOLOGY-quarantined], .424 A3 energy-prior);
  the two .424 generation levers carried retire_if_same_verdict and are RETIRED scopes (do NOT re-propose).
  (2) Per docs/research-notes/arc-008-wall-root-cause-2026-06-21.md the 0.08 Kaggle ceiling has a SINGLE
  binding cause -- the SCORED E3AgentPolicy is gated out of every world-model path by the degenerate
  exact-full-grid-match WorldModelVerifier (TTT 0/5, e3 LLM induction 0/6) and falls back to the bare-explorer
  0.08 floor; AND it ships value_weight=0.0, SUBMITTED_TARGET_LEVELS=1, and NEVER imports the strategy router
  or the transfer-validated 0.674 cross_game_features_v3 verifier -- so the 55 reproduced levels are "largely a
  leaderboard mirage." So .425 PIVOTS from the exhausted generation side to the VERIFIER / WORLD-MODEL side
  (Carnot's actual moat + the scored deliverable): A1 fixes the degenerate world-model trust gate (change-
  weighted + held-out trust ENERGY -- the documented 0.08-wall fix); A2 wires the 0.674 verifier + router +
  higher target_levels + forward-edge nav into the SCORED agent (GAP-LIVE-INTEGRATION). The DEMONSTRATED infra
  bug is folded in: the .424 A1 generation WIN (winner_generated 1/25->2/25) + A6/B1 were CRITICAL-quarantined
  by a TAUTOLOGY false-positive (small-sample k/25 rate metrics collide by construction) -- B2 adds the carve-out
  so incremental wins stop being invisible. verifier_is_oracle: false on every value claim. Submission stays
  operator-only.
milestone_title: 'VERIFIER / WORLD-MODEL PIVOT -- generation is exhausted (5 nulls, scopes retired); fix the degenerate WorldModelVerifier trust gate that caps the SCORED agent at the 0.08 floor (A1 change-weighted + held-out TRUST ENERGY) and wire the transfer-validated 0.674 discriminative verifier + strategy router into the SCORED E3AgentPolicy (A2 GAP-LIVE-INTEGRATION); bank +1 level via self-play (A3, 55->56+); keep the 55-level package operator-resubmit-ready (beat 33); fix the TAUTOLOGY false-positive that quarantined .424''s real generation win'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  THE 55 LEVELS ARE A LEADERBOARD MIRAGE -- the SCORED agent does not use Carnot's verifier and is gated out of
  every world-model path by a degenerate trust gate, so it sits at the 0.08 floor. .425 HEADLINE (A1): replace
  the exact-full-grid-match / binary-accuracy<0.5 WorldModelVerifier with a CHANGE-WEIGHTED consistency score
  (grid-CHANGING transitions only; >=1 correctly-predicted real change required) + a learned/calibrated TRUST
  ENERGY that ranks induced world-models by HELD-OUT (not prefix) misprediction -- the operator's energy-augmented
  graft #3, the documented 0.08-wall fix, oracle-distinct. HIGHEST MANDATORY (A2; GAP-LIVE-INTEGRATION): import
  the 0.674 cross_game_features_v3 DiscriminativeVerifier + the strategy router + raise SUBMITTED_TARGET_LEVELS +
  forward-edge nav into the SCORED E3AgentPolicy (NOTE: a naive value_weight=5 already REGRESSED -- wire the value
  as a TIE-BREAKER + router, not a heavy A* weight). CAPABILITY (A3): the standing self-play loop banks +1 NEW
  reproducible level (55->56+) + trains the learned verifier EVERY milestone. SCORE (A4): keep the refreshed
  package operator-resubmit-ready (beat 33). Plus self-learning persist+transfer (A5), integration (A6), 2 infra
  (B1 world_model_trust_pass_rate co-headline metric / B2 adversarial_verify hardening = TAUTOLOGY small-sample
  carve-out [the demonstrated .424 quarantine fix] + degenerate-world-model-trust guard), 1 hardware (C), 1
  SOTA-ingestion (D), capstone (E). verifier_is_oracle: false on every value claim. Submission stays operator-only.
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC; >=1 level-up
  attempt that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A3); 2 reserved infra (B1/B2); 1
  per-board hardware (C); 1 SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus.
  7 days to deadline. The frozen live generator is Qwen3.5-9B-MTP on the iGPU (NEVER the 3090s)."

