    After=network.target

    [Service]
    Type=simple
    WorkingDirectory={project_root}
    Environment=AGENT_TYPE=gemini
    Environment=CONDUCTOR_STATE_FILE=ops/conductor-state_gemini.json
    ExecStart=/usr/bin/python3 {project_root}/scripts/research_conductor.py
    Restart=on-failure
