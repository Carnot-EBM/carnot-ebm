  - id: exp289-fpga-backend-implementation
    milestone: "2026.04.21"
    deliverable: python/carnot/samplers/fpga_backend.py
    title: "Exp 289: FpgaBackend with quantum-inspired sparse Ising (arXiv 2604.04606)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 288 validated the KV260 bring-up (or recorded the blocker).
      This experiment implements the full FpgaBackend as a SamplerBackend (Exp 71 protocol).
      The quantum-inspired sparse Ising paper (arXiv 2604.04606) provides a directly
      applicable design: sparse connectivity (matches Carnot's clause-graph masking from
      Exp 61), quantum-inspired annealing schedule achieving 6× SA speedup.
      LagONN (arXiv 2505.07179) provides escape from infeasible local minima.
      KANELÉ (arXiv 2512.12850) is noted as future extension (KAN LUT on FPGA).

      EXISTING CODE TO READ FIRST:
      - python/carnot/samplers/backend.py — SamplerBackend protocol
      - python/carnot/samplers/fpga_ising.py — FPGAIsingSampler (Exp 228)
      - python/carnot/samplers/parallel_ising.py — CPU reference implementation
      - docs/fpga-ising-design.md — Q8.8 register map design
      - results/experiment_288_results.json — KV260 bring-up status

      TASK: Implement FpgaBackend with quantum-inspired sparse Ising.
      1. Read CLAUDE.md spec-first workflow
      2. Add REQ-SAMPLE-009, SCENARIO-SAMPLE-016, SCENARIO-SAMPLE-017 to spec.md
      3. Write tests first covering: Q8.8 quantization round-trip, sparsification
         (max_degree ≤ 32), quantum-inspired β-schedule (log-linear, monotone increasing),
         hardware/software dispatch based on CARNOT_KV260_BITFILE, LagONN penalty term,
         register map serialization (matches Exp 228 design), SamplerBackend protocol
         compliance (implements sample(), energy(), name())
      4. Implement python/carnot/samplers/fpga_backend.py:
         - FpgaBackend class implementing SamplerBackend protocol
         - quantize_to_q88(matrix: np.ndarray) → np.ndarray  (Q8.8 fixed-point)
         - sparsify_coupling(J: np.ndarray, max_degree: int = 32) → sparse matrix
           (keep top-K couplings by magnitude per spin, matching arXiv 2604.04606)
         - quantum_annealing_schedule(T: int, beta_min: float, beta_max: float) → list[float]
           β(t) = β_min × (β_max/β_min)^(t/T) — log-linear warmup from arXiv 2604.04606
         - serialize_to_axi(J_sparse, h, beta) → dict  (AXI-Lite register map from Exp 228)
         - dispatch(J, h, n_samples, n_steps) → np.ndarray:
           if CARNOT_KV260_BITFILE set → PYNQ AXI dispatch + readback
           else → ParallelIsingSampler CPU fallback with quantum-inspired schedule
         - use_lagrangian_penalty: bool flag (arXiv 2505.07179) adds penalty for infeasible minima
         - Add comment referencing KANELÉ (arXiv 2512.12850) as future extension for KAN LUT eval
         - Register in python/carnot/samplers/backend.py get_backend("fpga") → FpgaBackend
