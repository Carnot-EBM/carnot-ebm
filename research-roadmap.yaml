  - id: exp3672-ensemble-selection-value-where-sc-is-weak
    operator_override: "2026-06-01 outer-loop directive: NEW research direction sanctioned by north-star sec-1 (resume breadth toward NEW directions — the verifier ensemble's discriminating value where self-consistency is NOT near-optimal). P0.1 (exp3312) is RETIRED/answered (energy-descent GENERATION bounded because SC was near-optimal on math/CSP); this FLIPS the premise — it tests ensemble candidate SELECTION on a corpus engineered so SC is WEAK — a structurally different question, not a P0.1 rerun."
    milestone: "2026.06.336"
    title: "NEW direction — verifier-ensemble SELECTION value where self-consistency is WEAK: build/identify a corpus where majority-vote SC is near-chance (high answer entropy / ambiguous problems) and test whether the ensemble adds real best-of-N selection value confidence/SC cannot (flips the answered P0.1 near-optimal-SC premise)"
    priority: high
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # anti-wipeout codex routing for .336
    estimated_wall_time_min: 26
    track: research
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3672_ensemble_selection_where_sc_weak.json
    prompt: |
      CONTEXT: P0.1 (the energy-descent existential test) is an earned honest-negative because self-consistency
      was already near-optimal on the tested math/CSP corpora -- there was no selectable headroom (oracle <= SC).
      The north-star explicitly directs resuming breadth toward NEW directions where SC is NOT near-optimal.
      This task FLIPS the premise: build/identify a corpus where majority-vote SC is WEAK (near-chance) -- e.g.
      high answer-entropy problems, multiple plausible candidates, ambiguous or adversarially-hard items -- and
      test whether the verifier ensemble adds real best-of-N candidate-SELECTION value (oracle > SC, and the
      ensemble realizes a fraction of that headroom) that confidence and SC alone cannot. This is candidate
      SELECTION (Carnot's product), NOT energy-descent GENERATION (the retired P0.1). NULL/FALSE_NEGATIVE
      DISCIPLINE: only meaningful if the positive control holds -- oracle best-of-N materially > SC (real
      headroom) AND flip-count > 0 (the ensemble actually changes selections).
      EXISTING CODE TO READ FIRST: results/experiment_3645 (headroom hybrid verifier vs SC) and
      results/experiment_2837 (FoVer + the verifiers) via scripts/summarize_artifact.py;
      project_orthogonality_stall memory; ops/known-issues.md P0.1 entries (for what made SC near-optimal --
      to deliberately AVOID that regime here).
      PRECONDITIONS (step 0): a multi-candidate corpus with per-candidate correctness labels loadable or
      buildable (FoVer multi-candidate, or a generated high-entropy set with cached candidates + labels). If
      none -> "complete: blocked_no_multi_candidate_corpus".
      CONCRETE STEPS:
        1. Construct/identify the SC-WEAK regime: select items where majority-vote accuracy is near chance AND
           oracle best-of-N is materially higher (real selectable headroom). Report SC accuracy + oracle.
        2. Best-of-N selection by: SC/majority, confidence, ensemble energy, ensemble+confidence fusion.
           Report selection accuracy + flip-count + paired delta vs SC + bootstrap CI + McNemar.
        3. POSITIVE CONTROL: confirm oracle > SC (headroom) AND flip-count > 0; if not, report
           "no_selectable_headroom" honestly (uninformative, not a win for either side).
        4. Honest verdict: does the ensemble add selection value SC/confidence cannot WHERE SC IS WEAK?
      ANTI-POISON TEST DISCIPLINE (MANDATORY): parametrize any pytest over the honest outcomes
      (ensemble_adds_selection_value / no_value_even_with_headroom / no_selectable_headroom / blocked) on
      synthetic fixtures; NEVER hard-assert one success string. Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; ensemble_adds_selection_value_sc_weak MUST be a BARE top-level bool):
        honest_verdict:
