- id: exp1040-verdict-reproducibility-audit
  milestone: 2026.04.81
  deliverable: results/experiment_1040_verdict_reproducibility_audit.json
  title: "Verdict Reproducibility Audit + Seed Discipline (MANDATORY PER KNOWN-ISSUES.MD)"
  prior_failures:
    - experiment_id: exp1031-energy-ssd-v3-rerun
      verdict: non_reproducible_fr11_loop_closed_vs_carnot_filter_below_baseline
      addressed_by: "Root cause: experiment_template.py has no RNG seed discipline; stochastic samplers (jax.random, numpy.random, torch) produce different sequences each run, flipping verdict. Fix: (1) add random_seed field to build_result() schema, (2) add canonical RNG initialization at experiment start, (3) add reproducibility checksum to flagship results."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Experiment 1031 (Energy-Selection SSD v3) produced verdict=fr11_loop_closed at 21:12Z and
    verdict=carnot_filter_below_baseline at 01:13Z — same code, same milestone, 4 hours apart.
    This is documented in openspec/change-proposals/verdict-reproducibility-audit.md (MANDATORY
    for .81 per ops/known-issues.md). The position paper requires verdict-stable empirical results.

    EXISTING CODE TO READ FIRST:
    - openspec/change-proposals/verdict-reproducibility-audit.md (full spec — read entirely)
    - scripts/experiment_template.py (build_result() signature — add random_seed field here)
    - results/experiment_1031_energy_ssd_v3.json (flagship result to audit)
    - results/experiment_1032_ppsebm_relay_v4.json (flagship result to audit)
    - results/experiment_1026_schema_validation.json (infrastructure result to audit)
    - results/experiment_1027_conductor_supervisor.json (infrastructure result to audit)
    - results/experiment_1029_fover_expansion_v2.json (corpus result to audit)

    TASK:
    1. SEED DISCIPLINE: Add to scripts/experiment_template.py:
       a. Add random_seed: int = 42 field to ExperimentTemplate.__init__() (default 42 for backward
          compatibility, overridable by passing seed=<N> to ExperimentTemplate()).
       b. Add canonical RNG init to ExperimentTemplate.setup():
          import jax, numpy as np, random, os
          np.random.seed(seed)
          random.seed(seed)
          os.environ['JAX_DEFAULT_PRNG_SEED'] = str(seed)
          # Note: torch seed set only if torch is importable
          try:
              import torch; torch.manual_seed(seed)
          except ImportError: pass
       c. Add random_seed field to build_result() output (always emit the seed used).
    2. REPRODUCIBILITY CHECKSUM: Add to build_result():
       import hashlib, json
       def _compute_repro_checksum(seed, code_files, data_path=None):
           h = hashlib.sha256()
           h.update(str(seed).encode())
           for f in code_files:
               if os.path.exists(f):
                   with open(f, 'rb') as fp: h.update(fp.read())
           if data_path and os.path.exists(data_path):
               with open(data_path, 'rb') as fp: h.update(fp.read())
           return h.hexdigest()[:16]
       Emit this as reproducibility_checksum in flagship results.
    3. RERUN AUDIT: Rerun the 5 flagships WITHOUT the template changes (to test stability as-is):
       a. For each of [exp1031, exp1032, exp1026, exp1027, exp1029]: check if the experiment
          script exists and can be run in <30s (dry run mode or synthetic fallback).
       b. For each that can run: execute once with synthetic/fast mode, check if honest_verdict
          matches the stored artifact.
       c. Count stability_rate = n_matching / n_audited.
    4. TESTS: Write tests/python/test_experiment_template_seed.py with at least 4 tests:
       - ExperimentTemplate with default seed sets numpy/random seeds
       - build_result() emits random_seed field
       - build_result() emits reproducibility_checksum field
       - Two runs with same seed produce same random values from np.random
    5. Run tests: pytest tests/python/test_experiment_template_seed.py -v

    CONCRETE STEPS:
    - Read openspec/change-proposals/verdict-reproducibility-audit.md
    - Patch scripts/experiment_template.py with seed discipline + checksum
    - Write tests/python/test_experiment_template_seed.py
    - pytest tests/python/test_experiment_template_seed.py -v
    - Run quick stability audit on available flagships
    - Write results/experiment_1040_verdict_reproducibility_audit.json

    ARTIFACT FIELDS:
    - seed_discipline_deployed: bool
    - reproducibility_checksum_deployed: bool
    - n_flagships_audited: int
    - n_flagships_stable: int
    - stability_rate: float (n_stable / n_audited)
    - tests_passing: int
    - honest_verdict: "stability_measured_discipline_deployed" | "discipline_only" | "audit_only" | "failed"

    Run: python scripts/experiment_1040_verdict_reproducibility_audit.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

