# ============================================================

- id: exp1237-boltzmann-gpt-contrastive-training
  milestone: 2026.04.96
  deliverable: results/experiment_1237_boltzmann_gpt_contrastive_training.json
  title: "Boltzmann-GPT Contrastive CD Training — FoVer Corpus, Target AUROC > 0.80"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 40
  priority: medium
  requires_gpu: true
  prior_failures:
    - experiment_id: exp1226-boltzmann-gpt-phase3-seed
      verdict: boltzmann_gpt_below_nrgpt
      addressed_by: "exp1226 was a SEED experiment with random weights (AUROC=0.65). The seed confirmed non-degenerate structural signal. This experiment is the TRAINING run using contrastive divergence on FoVer corpus — a genuinely different step, not a retry of exp1226."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    exp1226 confirmed the Boltzmann-GPT layer (python/carnot/phase3/boltzmann_gpt.py) has
    non-degenerate structural signal at random weights (AUROC=0.65). The goal is now to train
    it with contrastive divergence (CD) on the FoVer corpus to achieve AUROC > 0.80.

    Reference: arXiv 2512.18730 (EBM Theoretical Lens for RL-Tuned LMs) provides the contrastive
    loss formulation: L_CD = E_correct[E(x)] - E_incorrect[E(x)] where E(x) is the Boltzmann
    energy. The energy gap between correct and incorrect FoVer traces is the training signal.

    NRGPT baseline (exp1163): AUROC=0.921.
    Target: AUROC > 0.80 (halfway to NRGPT).

    EXISTING CODE TO READ FIRST:
    - python/carnot/phase3/boltzmann_gpt.py (BoltzmannGPTLayer implementation from exp1226)
    - python/carnot/phase3/nrgpt.py (NRGPT as comparison baseline, exp1163)
    - python/carnot/data/fover.py (FoVer dataset loader)
    - results/experiment_1226_boltzmann_gpt_phase3_seed.json (seed AUROC=0.65, architecture params)

