- id: exp1219-grpo-v5-regression-diagnosis
  milestone: 2026.04.95
  deliverable: results/experiment_1219_grpo_v5_regression_diagnosis.json
  title: "GRPO v5 Regression Diagnosis — Root-Cause Analysis of -35pp vs v4 Baseline"
  agent_type: claude
  model: opus
  max_turns: 50
  estimated_wall_time_min: 40
  priority: critical
  requires_gpu: false
  prompt: |
    CONTEXT:
    GRPO v5 (exp1208, milestone .94) produced -35pp improvement vs the v4 baseline (+10pp).
    TinyV abstention is supposed to IMPROVE the training signal by removing false-negative noise.
    A -35pp regression means the implementation went wrong in a significant way.

    Known facts from exp1208 artifact:
    - llama_cpp_gpu_offload: true (GPU offload was working)
    - dualgpu_confirmed: true (DualGPU detected)
    - improvement_over_baseline_pp: -35.0
    - beats_spurious_reward_threshold: false

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write this to results/experiment_1219_grpo_v5_regression_diagnosis.json:
    {
      "experiment": "1219_grpo_v5_regression_diagnosis",
      "status": "in_progress",
      "diagnosis_complete": false,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - results/experiment_1208_grpo_v5_tinyv_v2_dualgpu.json (full artifact from .94)
    - results/experiment_1159_grpo_v4_structural_warmup.json (v4 baseline: +10pp)
    - python/carnot/training/latent_grpo.py (GRPO implementation)
    - python/carnot/pipeline/verify_repair.py (TinyV confidence threshold logic)

    TASK:
    1. Write skeleton artifact (STEP 0).

    2. Read exp1208 artifact in full. Extract:
       - tinyv_abstention_count and tinyv_abstention_rate
       - v5_fraction_correct_before and v5_fraction_correct_after
       - dualgpu_gpu0_utilization_pct and dualgpu_gpu1_utilization_pct
       - Any error messages or exception traces in the artifact

    3. Diagnose the root cause. Test each hypothesis:
       a. HIGH_ABSTENTION_RATE: If tinyv_abstention_rate > 0.7, almost no training signal
          reached the model. TinyV threshold was too aggressive.
       b. DUALGPU_INSTABILITY: If GPU utilization was highly unbalanced (one GPU >>75%),
          the tensor split caused gradient mismatch.
       c. THRESHOLD_MISCONFIGURATION: If abstention_rate is in 0.3-0.7 range but improvement
          still -35pp, the threshold conflated ThinkPRM and TinyV confidence scoring.
       d. REWARD_SIGNAL_COLLAPSE: If v5_fraction_correct_before > v5_fraction_correct_after
          dramatically, the model regressed during training (reward signal inverted).
       e. IMPLEMENTATION_BUG: Look for logical errors in latent_grpo.py that could invert
          the reward signal (e.g., subtracting where it should be adding).

    4. For the most likely root cause, propose a concrete fix for GRPO-VPS training (exp1220):
       - If HIGH_ABSTENTION_RATE: lower TinyV threshold from 0.3-0.7 to 0.1-0.9
       - If DUALGPU_INSTABILITY: use single GPU or synchronize gradients explicitly
       - If THRESHOLD_MISCONFIGURATION: separate TinyV confidence from ThinkPRM confidence
       - If REWARD_SIGNAL_COLLAPSE: check reward sign convention in the GRPO update
       - If IMPLEMENTATION_BUG: identify and describe the specific bug

    5. Update artifact with full diagnosis and recommended fix.

    CONCRETE STEPS:
    - Write skeleton artifact (STEP 0)
    - python3 -c "import json; d=json.load(open('results/experiment_1208_grpo_v5_tinyv_v2_dualgpu.json')); [print(k,':',v) for k,v in d.items()]" 2>&1
    - cat python/carnot/training/latent_grpo.py 2>&1 | head -100
    - [Read TinyV confidence threshold logic in verify_repair.py]
    - [Apply each diagnostic hypothesis to the artifact data]
    - Update results/experiment_1219_grpo_v5_regression_diagnosis.json

    REQUIRED ARTIFACT FIELDS:
    - tinyv_abstention_rate_observed: float (from exp1208)
    - grpo_v5_improvement_pp: float (-35.0 from exp1208)
    - root_cause: str ("high_abstention_rate" | "dualgpu_instability" | "threshold_misconfiguration" | "reward_signal_collapse" | "implementation_bug" | "unknown")
    - root_cause_evidence: str (specific evidence from exp1208 artifact or code)
    - recommended_fix_for_exp1220: str (concrete change to prevent same failure in VPS training)
    - diagnosis_complete: bool (True — we diagnosed it)
    - honest_verdict: "root_cause_identified" | "root_cause_partial" | "root_cause_unknown"

    Run: python3 -c "import json; d=json.load(open('results/experiment_1208_grpo_v5_tinyv_v2_dualgpu.json')); print('abstention_rate:', d.get('tinyv_abstention_rate', 'MISSING'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1220-grpo-vps-full-training
  milestone: 2026.04.95
  deliverable: results/experiment_1220_grpo_vps_full_training.json
  title: "GRPO-VPS Full Training Run — Step-Level Supervision via CausalReasoning + Z3Math"
  agent_type: claude
  model: opus
  max_turns: 60
  estimated_wall_time_min: 90
  priority: critical
  requires_gpu: true
  grace_period_s: 3600
  gated_on:
    - upstream: exp1219-grpo-v5-regression-diagnosis
      artifact_field: diagnosis_complete
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1209-grpo-vps-step-level-supervision
      verdict: step_supervision_improves_over_outcome
      addressed_by: "exp1209 measured +24pp in EVALUATION mode (50 questions), not training mode. This experiment is the FULL TRAINING RUN using step-level supervision — a genuinely new experiment, not a retry. exp1209's eval delta is the hypothesis this training confirms or refutes."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    exp1209 (milestone .94) showed GRPO-VPS step-level supervision gives +24pp delta on 50
    GSM8K questions in EVALUATION mode. This is a full GRPO TRAINING RUN to validate that
    delta holds through actual parameter updates.

    GRPO-VPS uses per-step rewards (CausalReasoningVerifier + Z3MathVerifier) rather than
    outcome-only rewards. Per-step credit attribution gives much better gradient signal because
    errors at specific steps are attributed to those steps.

    v4 baseline floor: +10pp improvement (exp1159 structural warm-up).
    VPS hypothesis: step-level supervision converts the +24pp evaluation delta into +>10pp
    training improvement (confirming energy verifier adds real signal beyond the structural 73%).

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write this to results/experiment_1220_grpo_vps_full_training.json:
    {
      "experiment": "1220_grpo_vps_full_training",
      "status": "in_progress",
      "grpo_vps_training_completed": false,
      "grpo_vps_improvement_pp": null,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - results/experiment_1219_grpo_v5_regression_diagnosis.json (apply recommended fix)
    - results/experiment_1209_grpo_vps_step_level_supervision.json (eval delta: +24pp)
    - results/experiment_1159_grpo_v4_structural_warmup.json (v4 baseline: +10pp)
    - python/carnot/training/latent_grpo.py (GRPO implementation)
    - python/carnot/pipeline/extract.py (CausalReasoningVerifier, Z3MathVerifier)

    TASK:
    1. Write skeleton artifact (STEP 0).

    2. VERIFY PREREQUISITES:
       - llama.cpp GPU offload:
         python3 -c "from llama_cpp import llama_cpp; print('gpu_offload:', llama_cpp.llama_supports_gpu_offload())" 2>&1
       - DualGPU: python3 -c "import torch; print('devices:', torch.cuda.device_count())" 2>&1
       - Apply exp1219's recommended fix to avoid the -35pp regression pattern.

    3. FIND GGUF MODEL:
       find /home -name "*.gguf" 2>/dev/null | grep -iE "qwen3.6|gemma.4.31|gemma.4.26" | head -3

    4. IMPLEMENT GRPO-VPS STEP-REWARD FUNCTION:
       Per arXiv 2604.20659 segment formulation:
       For each response, split at CoT step boundaries ("\n\nStep", "##", etc.)
       For each step S:
         causal_score = 1.0 - CausalReasoningVerifier().verify_step(step_text, prior_step)
         z3_score = 1.0 - Z3MathVerifier().verify_step(step_text)
         step_reward[S] = 0.5 * causal_score + 0.5 * z3_score
       Aggregate: r_vps = sum(decay^(k-S) * step_reward[k] for k in steps[S:]) where decay=0.9

    5. RUN GRPO-VPS TRAINING:
       Phase A (structural warm-up, 300s): optimize ONLY r_reflect = E_before - E_after.
         No TinyV abstention (lesson from exp1208 regression: too much abstention kills signal).
       Phase B (VPS mix, 900s): r_full = 0.5*r_vps + 0.3*r_reflect + 0.2*r_correctness
       Training set: GSM8K questions 1600-1800 (fresh range, not used in prior experiments).

    6. EVALUATE on holdout GSM8K 400-600:
       - fraction_correct_before (before training)
       - fraction_correct_after (after training)
       - grpo_vps_improvement_pp = 100*(after - before)
       - beats_v4_floor: improvement > 10.0

    7. Update artifact with final results.

    CONCRETE STEPS:
    - Write skeleton artifact (STEP 0)
    - python3 -c "from llama_cpp import llama_cpp; print(llama_cpp.llama_supports_gpu_offload())" 2>&1
