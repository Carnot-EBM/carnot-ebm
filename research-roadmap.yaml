      - experiment_id: exp5328-context-object-lifecycle-self-learning-v486
        verdict: "complete: deterministic context-object lifecycle fixture ready for Exp5329 and Exp5330; safe actions commit, unsafe actions reject, rollback succeeds at 1.0, and no model weights mutate"
        addressed_by: "Continuation of Exp5328, but different because it adds bounded state compression, recalled-not-committed states, drift labels, and poisoning/anomaly monitors."
        retire_if_same_verdict: true
      - experiment_id: exp5312-trustmem-transition-verifier-self-learning-v485
        verdict: "complete: deterministic memory transition verifier ready for Exp5313; safe transitions committed and unsafe writes rejected before state change"
        addressed_by: "Different from Exp5312: this task measures bounded context compression and drift/poisoning anomalies, not only transition write safety."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Run from {project_root} on {date}. Agent Cognitive Compressor and context-governance papers argue that recall and persistent commitment must be separated. Carnot already has context lifecycle safety; this task adds bounded state and drift monitoring.

      EXISTING CODE TO READ FIRST:
      - CODEX.md
      - CLAUDE.md
      - research-program.md
      - research-references.md
      - results/experiment_5328_context_object_lifecycle_self_learning_v486.json
      - results/experiment_5330_sea_anytime_certificate_gate_v486.json
      - python/carnot
      - tests/python

      TASK:
      Implement or assemble a deterministic bounded context compressor that separates artifact recall from persistent state commitment and detects drift, stale recall, and poisoning attempts.

      Deliverable: `results/experiment_5341_bounded_compressor_drift_monitor_v487.json`.

      CONCRETE STEPS:
      1. Reuse stable context object IDs, lifecycle actions, sidecars, and rollback fields from Exp5328.
      2. Add bounded state summaries with max object/token budgets and explicit `recalled_not_committed` rows.
      3. Add deterministic cases for benign recall, stale recall, poisoned candidate memory, compression omission, over-compression, and safe recovery.
      4. Measure compression budget, recall/commit separation, drift detection, poison rejection, recoverability, and verifier-call cost.
      5. Set `compressor_drift_fixture_ready` true only if deterministic tests pass, unsafe commits are zero, and recoverability is preserved.

      REQUIRED ARTIFACT FIELDS:
      - experiment_id with principle.
