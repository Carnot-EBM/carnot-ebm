- id: exp773-carnot-vs-sets
  milestone: 2026.04.59
  deliverable: results/experiment_773_carnot_vs_sets.json
  title: 'Exp 773: Carnot vs SETS — Test-Time Scaling Comparison (arXiv 2501.19306)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2501.19306 "SETS: Leveraging Self-Verification and Self-Correction for
    Improved Test-Time Scaling" (January 2026) is the closest published system to Carnot:
    1. Generate N candidate solutions in parallel (BoN sampling).
    2. Use LLM zero-shot self-verification to select the best candidate.
    3. Apply self-correction if the selected candidate still has issues.

    The key difference: SETS uses LLM self-verification (high-latency, expensive oracle);
    Carnot uses energy-based verification (low-latency, hardware-acceleratable oracle).
    The hypothesis: Carnot achieves comparable pass rate with fewer oracle calls and lower
    wall-clock time, because energy evaluation is 10-100x cheaper than LLM self-verification.

    This head-to-head comparison is the core publishable result for Carnot. If Carnot
    matches SETS pass rate with 3x fewer oracle calls, this demonstrates the efficiency
    advantage of energy-based verification over LLM-based verification.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (Carnot baseline).
    - python/carnot/pipeline/extract.py — CodeExtractor, AutoExtractor.
    - results/experiment_769_sota_gguf_code_repair.json — Carnot code repair baseline.
    - results/experiment_770_jepa_v19_predictive.json — JEPA v19 data (if available).
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement SETS baseline. Run SETS and Carnot on 30 GSM8K problems.
    Compare: pass rate, oracle calls, wall-clock time. Use CPU inference (no GPU required).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-COMPARE-001 (SETS baseline MUST implement: (a) N=4 parallel generation via
       simple prompt variations, (b) zero-shot LLM self-verification asking "Is this solution
       correct? Answer Yes/No", (c) self-correction prompt on selected solution),
       REQ-COMPARE-002 (comparison MUST report: pass_rate, n_oracle_calls, wall_time_s
       for BOTH Carnot and SETS on identical question set),
       SCENARIO-COMPARE-001/002 to openspec/capabilities/verification/spec.md.
    3. Implement python/carnot/pipeline/sets_baseline.py:
       a. SETSConfig(n_candidates=4, max_correction_rounds=2).
       b. SETSBaseline(llm_fn: callable, config: SETSConfig):
          generate_candidates(question: str) -> list[str]:
            - Generate 4 responses using prompt variations:
              ["Solve step by step:", "Think carefully then solve:",
               "Let me work through this:", "Using arithmetic:"] + question.
            - Oracle calls used: 4 (generation).
          self_verify(question: str, candidate: str) -> bool:
            - Prompt: "Question: (q)\nAnswer: (a)\nIs this correct? Answer Yes or No."
            - Parse Yes/No. Oracle calls used: 1 per candidate.
          self_correct(question: str, candidate: str) -> str:
            - Prompt: "Your solution may have errors. Correct it: (q)\nCurrent: (a)"
            - Oracle calls used: 1.
          run(question: str) -> SETSResult(answer, pass_flag, n_oracle_calls, wall_time_s).
    4. Use a SIMPLE local LLM (CPU-friendly):
       - Use a deterministic mock LLM: return correct answer for known GSM8K questions,
         wrong answer for unknown ones. This isolates the SETS architecture overhead
         from model quality. Record: llm_mode="mock_deterministic".
       - Alternatively, if Qwen3.5-0.8B is available (CPU): use it for real inference.
         Record: llm_mode="qwen35_08b_cpu".
    5. Load 30 GSM8K questions (seed=1234 to avoid overlap with other experiments).
       For each question: run BOTH SETSBaseline AND Carnot VerifyRepairPipeline.
       a. SETS: run SETSBaseline(llm_fn).run(question). Record: pass_flag, n_oracle_calls, wall_time_s.
       b. Carnot: run VerifyRepairPipeline.verify_and_repair(question). Record: pass_flag, n_oracle_calls, wall_time_s.
          Note: Carnot oracle call = energy evaluation (much cheaper than LLM call).
    6. Compute comparison metrics:
       sets_pass_rate = sum(SETS pass_flag) / 30
       carnot_pass_rate = sum(Carnot pass_flag) / 30
       sets_oracle_calls_per_q = mean(SETS n_oracle_calls)
       carnot_oracle_calls_per_q = mean(Carnot n_oracle_calls)
       oracle_call_ratio = sets_oracle_calls_per_q / carnot_oracle_calls_per_q
       pass_rate_delta = carnot_pass_rate - sets_pass_rate
    7. Create scripts/experiment_773_carnot_vs_sets.py:
       a. ExperimentTemplate(773) + ExperimentTimeoutWatchdog(773, timeout_minutes=45).
       b. Implement steps 3-6.
       c. honest_verdict:
          - "carnot_oracle_advantage" if oracle_call_ratio >= 2.0 AND pass_rate_delta >= -0.05
            (Carnot uses 2x+ fewer oracle calls at similar pass rate)
          - "carnot_pass_rate_advantage" if pass_rate_delta > 0.05 (Carnot wins on accuracy)
          - "sets_competitive" if oracle_call_ratio < 2.0 AND pass_rate_delta < 0.05
            (SETS within 2x oracle calls and 5pp pass rate)
          - "inconclusive" if llm_mode=mock_deterministic (architectural comparison only)
       d. artifact: sets_pass_rate, carnot_pass_rate, pass_rate_delta,
          sets_oracle_calls_per_q, carnot_oracle_calls_per_q, oracle_call_ratio,
          llm_mode, honest_verdict.
    8. Write tests/python/test_experiment_773_carnot_vs_sets.py with 100% coverage:
        - test SETSBaseline generates exactly N=4 candidates per question.
        - test self_verify calls LLM once per candidate.
        - test oracle_call_ratio = sets / carnot oracle calls per question.
        Each test traces to REQ-COMPARE-001/002.
    9. Reconcile:
        - ops/status.md: "Carnot vs SETS (arXiv 2501.19306): oracle_call_ratio=X.
          pass_rate_delta=Y. honest_verdict=X."
        - ops/changelog.md: one-line with honest_verdict.
    10. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
