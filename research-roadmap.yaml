    9. After all updates and delayed flushes, seal final banks before reading 64 evaluation and 32 retention labels. Compute paired future cost/Brier against complete-static and no-write, seeds averaged within family, 10000 bootstrap resamples and Holm-adjusted primary tests. Learning benefit requires cost gain >=.02 with CI95 lower>0 and adjusted p<.05 against both controls, nonworse Brier, retention cost increase CI95 upper<=.01, no extra false accepts and at least one causal later decision change. Report early/later block trajectories and unchanged/null arms. This is an exposed-development pilot, not independent generalization.
