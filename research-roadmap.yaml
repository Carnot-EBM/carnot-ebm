- id: exp767-preflight-v11
  milestone: 2026.04.59
  deliverable: results/experiment_767_preflight_v11.json
  title: 'Exp 767: Pre-flight v11 — Full Manifest Extension to ALL Queue Dequeue Sites (MANDATORY FIRST)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Milestone .58 retro (Exp 766) confirmed FOURTEENTH consecutive wall-time improvement.
    Governance win: manifest enforcement applied in Exp 754 (conductor managed cycle, 11 exps).
    CRITICAL REMAINING ISSUE: Exp 425 appeared for the 22ND consecutive milestone from unguarded
    historical queue sources (76 min, 1,672 cumulative minutes = 27.9 hours of zero-value compute
    since .37). The manifest patch (Exp 754) only covers the conductor's managed cycle. Other
    dequeue sites in research_conductor.py were not patched. This experiment extends enforcement
    to ALL queue dequeue sites and adds Exps 425, 491, 603, 627 to the exclusion manifest.

    SUCCESS CRITERION: Exp 425 absent from full-milestone timing in .59 retro (Exp 779) for
    the first time since milestone .37. This is a measurable, binary criterion.

    EXISTING CODE TO READ FIRST:
    - scripts/research_conductor.py — find ALL dequeue sites (search for "dequeue", "pop",
      "next_task", "get_task", "fetch_task"). The manifest patch from Exp 754 was applied to
      one site; there may be others.
    - scripts/conductor_exclusion_manifest.json — current exclusion list (should have 23 entries
      after Exp 754 added exp527).
    - python/carnot/pipeline/exclusion_manifest.py — ExclusionManifest class.
    - scripts/conductor_pre_flight.py — pre-flight runner.
    - results/experiment_754_preflight_v10.json — v10 baseline.
    - results/operational_retro_2026_04_58.json — Exp 766 retro confirming Exp 425 still appears.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Find ALL dequeue sites in research_conductor.py. Apply exclusion manifest check to each.
    Add Exps 425, 491, 603, 627 to conductor_exclusion_manifest.json. Validate patch coverage.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-INFRA-052 (exclusion manifest check MUST be applied at ALL dequeue sites in
       research_conductor.py; no dequeue may bypass the manifest), REQ-INFRA-053
       (Exps 425, 491, 603, 627 MUST be in conductor_exclusion_manifest.json),
       SCENARIO-INFRA-061/062 to openspec/capabilities/pipeline/spec.md.
    3. Audit research_conductor.py for dequeue sites:
       a. Read the ENTIRE research_conductor.py (all relevant sections).
       b. List every location where a task/experiment is dequeued or fetched from any source.
       c. For each location: note the function name and line range.
       d. Identify which locations already have the manifest guard (from Exp 754).
       e. Identify which locations are MISSING the guard.
    4. Apply the manifest guard to each unguarded dequeue site:
       a. At each site, add: if exclusion_manifest.is_excluded(task_id): continue (or skip).
       b. Use the same ExclusionManifest pattern already applied in Exp 754.
       c. Do NOT break existing functionality — test that patched conductor still dequeues
          non-excluded tasks correctly.
    5. Update conductor_exclusion_manifest.json:
       a. Add "exp425" (22nd milestone appearance, 1,672 min cumulative waste).
       b. Add "exp491" (12th appearance, historical queue source).
       c. Add "exp603" (repeated carry-over from unguarded source).
       d. Add "exp627" (repeated carry-over from unguarded source).
       e. Record: n_excluded_total after additions.
    6. GPU health check:
       a. Run `nvidia-smi` to confirm both GPUs at <100MB VRAM / 0% util.
       b. Record: gpu0_vram_mb, gpu1_vram_mb, gpu0_util, gpu1_util.
    7. Run incremental test selection and existing test suite:
       JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q --tb=short 2>&1 | tail -20
       Record: tests_passed (bool).
    8. Confirm patch coverage:
       a. Count total dequeue sites in research_conductor.py.
       b. Count dequeue sites with manifest guard after patching.
       c. coverage_pct = guarded_sites / total_sites * 100.
       d. full_coverage = (coverage_pct == 100.0).
    9. Create scripts/experiment_767_preflight_v11.py:
