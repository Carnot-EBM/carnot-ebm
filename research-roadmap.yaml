- id: exp1240-wopr-kakuro-cartridge
  milestone: 2026.04.96
  deliverable: results/experiment_1240_wopr_kakuro_cartridge.json
  title: "WOPR Kakuro Puzzle Cartridge — Integer Row/Column Sum Constraints, E=0 at Solution"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 25
  priority: medium
  requires_gpu: false
  prompt: |
    CONTEXT:
    WOPR gallery needs a new puzzle cartridge. Kakuro (also known as Cross Sums) is a logic
    puzzle where the grid must be filled with digits 1-9 such that:
    - Each "run" (contiguous horizontal or vertical block of cells) sums to a given clue number
    - No digit repeats within a run

    This is an integer constraint satisfaction problem naturally formulated as an Ising energy
    minimization: E = Σ_run (sum_violation)^2 + Σ_run (uniqueness_violation)^2

    EXISTING CODE TO READ FIRST:
    - python/carnot/wopr/nonogram.py (recent Nonogram cartridge, exp1214 — follow the same pattern)
    - python/carnot/wopr/futoshiki.py (recent Futoshiki cartridge, exp1227 — energy formulation)
    - python/carnot/wopr/registry.py (cartridge registration API)

    TASK:
    1. Write skeleton artifact:
    {{
      "experiment": "1240_wopr_kakuro_cartridge",
      "status": "in_progress",
      "kakuro_cartridge_shipped": false,
      "honest_verdict": "in_progress"
    }}

    2. IMPLEMENT KakuroCartridge in python/carnot/wopr/kakuro.py:
       a. Puzzle representation:
          - grid: NxN grid with some cells blocked (marked with clue numbers)
          - clues: list of (run_id, direction, target_sum, cell_positions)
          - values: assignment of digits 1-9 to unfilled cells
       b. Energy function (Ising formulation):
          E_sum = Σ_run (Σ_cells(value) - target_sum)^2
          E_unique = Σ_run Σ_{{i<j in run}} indicator(value_i == value_j)
          E_total = E_sum + E_unique
          E = 0 iff all runs sum correctly AND no repeats within any run
       c. Ising coupling matrix construction:
          - Encode each digit 1-9 as a spin configuration (3-bit binary)
          - OR: treat each cell-value pair as a spin (NxM binary Ising)
          - Prefer: direct integer spin Ising (simplest implementation)
       d. Gibbs sampler to minimize energy (same as Nonogram/Futoshiki)

    3. GENERATE TEST CASES:
       - 3x3 trivial Kakuro (smoke test)
       - 5x5 standard Kakuro (realistic)
       - Solve each with Gibbs sampler, verify E=0 at solution

    4. REGISTER in python/carnot/wopr/registry.py

    5. WRITE TESTS in tests/python/test_wopr_kakuro.py:
       - test_energy_zero_at_valid_solution
       - test_energy_nonzero_at_invalid_assignment
       - test_3x3_kakuro_solves
       - test_cartridge_registered

    CONCRETE STEPS:
    - python3 -c "import json; d={{'experiment':'1240_wopr_kakuro_cartridge','status':'in_progress','kakuro_cartridge_shipped':False,'honest_verdict':'in_progress'}}; open('results/experiment_1240_wopr_kakuro_cartridge.json','w').write(json.dumps(d,indent=2))" 2>&1
