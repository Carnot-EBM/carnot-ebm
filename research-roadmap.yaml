  max_turns: 40
  estimated_wall_time_min: 40
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1373-fully-parallel-ising-inertia-cpu-validation
      verdict: cpu_only_inertia_no_checkerboard_speedup_no_hardware_claim
      addressed_by: "exp1373 showed inertia dynamics provide no CPU speedup (best_alpha=0.0). 2D Parallel Tempering (arXiv:2601.09037) is a different technique: temperature replicas exploring the energy landscape in parallel, with >10x convergence speedup. The sparsification technique from arXiv:2503.01177 (copy nodes, K=16 neighbors) keeps KV260 LUT count within 117K budget."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    arXiv:2601.09037 demonstrates 2D parallel tempering on FPGA: 15 temperature
    replicas of a 128-node sparsified system (1,920 p-bits), fully on-chip,
    4.7ms end-to-end, >10x convergence speedup vs standard Ising. The sparsification
    technique from arXiv:2503.01177 (copy nodes, K=16 neighbors, ~36K LUTs for
    N=128) keeps the design within the KV260's 117K LUT budget. Carnot's existing
    parallel_ising.py uses checkerboard (semi-synchronous) without temperature
    replicas. Adding 2D parallel tempering in software validates the convergence
    speedup before investing in RTL synthesis. Use {project_root} as the project
    root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - research-hardware-wishlist.md
    - python/carnot/samplers/parallel_ising.py
    - results/experiment_1373_fully_parallel_ising_inertia_cpu_validation.json
    - scripts/experiment_template.py

    TASK:
    CPU-simulate 2D parallel tempering on FoVer constraint problems. Estimate
    KV260 LUT budget for 15-replica implementation. No hardware execution claimed.

    REQUIRED ARTIFACT FIELDS:
    - status
    - constraint_problems_tested
    - replica_count
    - temperature_schedule
    - steps_to_convergence_standard_pt
    - steps_to_convergence_2d_pt
    - convergence_speedup_2d_pt
    - sparsification_k_value
    - estimated_kv260_lut_count_per_replica
    - estimated_kv260_total_lut_count_15_replicas
    - lut_budget_feasible
    - hardware_claim_allowed
    - kv260_claim_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1387_2d_parallel_tempering_kv260_fpga_estimate.json immediately with status="in_progress".
    2. Read arXiv:2601.09037 and arXiv:2503.01177 references from research-references.md.
    3. Load 3-5 FoVer constraint problems.
    4. Implement 2D parallel tempering: T replicas at different temperatures; swap replicas with Metropolis criterion between adjacent temperatures; T=15, temperatures in [0.5, 5.0].
    5. Also run standard single-temperature Ising on same problems.
    6. Measure steps_to_convergence_standard_pt and steps_to_convergence_2d_pt for each problem.
    7. Compute convergence_speedup_2d_pt = standard_steps / 2d_steps.
    8. Compute FPGA LUT estimate: single replica at N=128 with K=16 sparse connectivity = ~36K LUTs (from arXiv:2503.01177/Exp 950 baseline). 15 replicas = 15 * 36K = 540K LUTs — this EXCEEDS KV260's 117K budget. Report this honestly.
    9. If 15 replicas exceed budget, compute the maximum replicas that fit: floor(117K / 36K) = 3 replicas. Report this as the feasible design.
