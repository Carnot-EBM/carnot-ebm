    TASK:
    Bind thirteen tasks and freeze executable validation dates.
    Deliverable: {project_root}/results/experiment_7915_v687_contract_methods.json.
    Actual compute: aggregation_from_upstream_artifacts; inference_substrate_class=no_model_load; MODEL_SPECS=[]; execution_venue=host.

    CONCRETE STEPS:
    1. Print a flushed start line. Resolve input paths, byte hashes, roles and gate operands before compute. External missing or failed prerequisites end as complete_blocked_* with verdict_class=blocked and gate_check_summary.
    2. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess. Print elapsed time and completed units inside long loops. Supervise owned children with heartbeats at most 60 seconds apart. Keep every output gap below 600 seconds and each tool wait at most 60 seconds. Silence can end the task at 1200 seconds; regular output permits the 4800-second hard cap. Never pad time.
    3. Write any file over about 200 lines in several tool calls, each at most 150 lines. Emit a progress message between calls. Keep each tool call and analysis segment bounded. Save checkpoints by code/config/input hash. Put scratch in /tmp and real scripts in scripts/experiments/.
    4. Add task-owned REQ-* and SCENARIO-* requirements before implementation. Write failing tests first. Freeze affected dependencies, exact argv, expected exits and failure reasons, deadlines and coverage includes before results. Preserve existing tests and all historical required failures.
    5. Reuse callable libraries behind a small parameterized CLI. Never copy an entire historical dispatcher. Keep pytest basetemp, coverage data and fixture outputs in private /tmp paths outside results. Seal and copy child logs only after exit. Do not disable result guards.
    6. Use roadmap_contract.parse_design with milestone 2026.09.687. Check the visible table, V687_TASK_CONTRACT_START JSON and canonical full-task SHA-256 over all thirteen tasks. Read actual staged and active files separately. Before activation record activation_confirmed=false; after activation require the matching active digest. Missing consumed staging or later staging is acceptable only with matching frozen active authority. Never substitute active bytes for a missing staged observation.
    7. Parameterize the reused v685_authority_lifecycle count with a default of twelve for historical consumers and an explicit count=13 here. Preserve old tests. Add private 12-task and 13-task lifecycle fixtures, consumed/later staging cases and twelve mutations, including task order, prompt, prior_failures, gate field, count, date and digest drift. Do not edit the conductor or activation guards.
    8. Authenticate Exp7892 public/evaluator source hashes directly: 640 intended families, 604 previously eligible, 36 excluded. Keep source custody distinct from contract readiness. Do not rebuild its source producer. Other branches validate these inputs directly, so this administrative task is not a global science gate.
    9. Ingest the V687 reference review and the fragility/Delayed-ACI methods. Recheck at most three primary pages with bounded low-concurrency requests. Freeze grouping, masks, sample budgets and adoption/defer reasons before outcomes. Update research-studying.md with ingestion status. Run E2E-015/016 and E2E-018 private lifecycle tests using historical fixture dates. The historical E2E-018 publishing command is not applicable after rollover; use equivalent private current-authority execution with the same assertions.
    10. Run affected unit and consumer tests with PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov. Combine unit and actual CLI success, expected-failure, cold-replay and terminal-recheck coverage with identical includes. Require nonempty data and 100 percent statements for changed modules and CLIs. Preserve stricter existing obligations. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py with explicit affected test filenames. Record repository-wide debt separately; never call an unscoped spec scan an affected-scope check.
    11. Execute the task-specific E2Es named above. For historical E2E-016 use --date 20260929 on BOTH fixture and cold-replay calls to experiment_7868_v683_intervention_protocol.py. That CLI rejects other dates. Record current {date} separately as execution time; never rewrite the historical fixture date. Use unique private paths. Do not invoke historical publishing CLIs against current authorities. Add a wrong-date rejection test when changing orchestration. Seal raw rows and nonoverlapping phase spans; keep shards below 50 MiB and tracked files below 90 MB.
    12. Cold-reduce every claim from primitive rows. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Inspect both reports. Required owned failures imply disqualified and readiness zero. Revalidate final bytes after any verdict change. Bind sidecars to candidate hashes and atomically publish only checked bytes. Fixture/oracle agreement is circular_positive, never independent benefit.
    13. Use complete_* with terminal verdict_class positive, circular_positive, null, blocked or disqualified. Reserve partial_* and partial for unfinished owned work that another attempt can finish. External incompleteness is blocked. A valid null may be ready. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Retire an unchanged prior verdict under retire_if_same_verdict. Do not activate a roadmap, change production defaults or publish externally.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date: Exact producer IDs, 2026.09.687 and {date}. Principle: Evidence belongs to the producer that executed it.
    - honest_verdict, verdict_class: Closed enum positive | circular_positive | null | blocked | disqualified | partial. Use complete_* for terminal outcomes. Principle: External incompleteness cannot be fixed by retries.
    - flagged_adversarial: Actual terminal validator result. Principle: Flagged evidence cannot open a downstream gate.
    - gate_check_summary: Every blocked_* or complete_blocked_* names upstream ID, path/hash, field, op, expected and observed value. Principle: Missing evidence differs from a failed threshold.
    - rows, sample_size_budget: Unit/arm/seed rows with intended, eligible, started, completed, failed, censored, excluded and independent counts. Principle: Headline comparisons must be recomputable without rerunning.
    - acceptance_gate_results: Separate validity, readiness and scientific benefit. Null denotes unmeasured. Principle: Execution success does not prove utility.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Monotonic times and real code/config/data hashes. Principle: Never infer compute from a model name or pad time.
    - source_artifact_hashes, preconditions_checked, resolved_imports: Paths, hashes and exposure roles. Principle: Evidence custody includes transitive dependencies.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, coverage_statement_counts, historical_required_failures, repository_health: Exact argv, expected/actual exits, deadline, sealed logs and measured files. Principle: New qualification does not erase an earlier failure.
    - verifier_is_oracle, claim_scope: Explicit circularity; natural cohorts remain exposed_development. Principle: Reused development labels cannot establish independent generalization.
    - inference_substrate, inference_substrate_class, execution_venue: Actual TASK compute, host for host execution. Principle: Workload determines the duration floor; no-run artifacts record the planned class separately.
    - MODEL_SPECS, model_specs, target_model, model_invocation_counts, trained_head_specs: Invoked pretrained models or empty lists and zero calls; fitted small heads separately. Principle: Cited models are not invoked models.
    - field_principles: Explain each task-owned field and acceptance gate. Principle: The schema must preserve why a field exists.
    - contract_ready_score: 1 only for matching activated V687 authority and passed owned checks. Principle: Planning alone does not prove activation.
    - contract_rows, mutation_rows, authority_snapshots, canonical_tasks_sha256, source_custody_rows, literature_adoption_decisions: Thirteen ordered task rows, twelve mutation rows and independently read authority/source hashes. Principle: Reuse qualified evidence without granting science credit.
    - historical_fixture_date, execution_date, lifecycle_task_count: 20260929, current {date}, and 13 respectively. Principle: Fixture identity and execution time are separate.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7915_v687_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
