      "complete: no_selectable_headroom_corpus_uninformative" /
      "complete: blocked_no_multi_candidate_corpus"
      Run: cd {project_root} && python scripts/experiment_3672_ensemble_selection_where_sc_weak.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

