tasks:
  - id: exp6527-v565-evidence-eligibility-corrigendum
    milestone: "2026.08.565"
    deliverable: results/experiment_6527_v565_evidence_eligibility_corrigendum.json
    title: "V565 activation manifest and V564 evidence eligibility corrigendum"
    priority: critical
    track: infrastructure-governance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6513-v564-terminal-handoff-contract
        verdict: "artifact_not_updated_past_bootstrap"
        addressed_by: "This is not another terminal handoff: it starts from the completed V564 artifact set, corrects Exp6520's still-flagged duration/adversarial receipt without editing history, and emits a new eligibility root for external transfer."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Every V564 task has a terminal artifact. Exp6518 and Exp6519 support held exact structural headroom, Exp6521-Exp6523 support transactional conflict-memory learning, and Exp6526 preserves the blocked ARC and GateMate lanes. Exp6520 is scientifically promising but still carries flagged_adversarial=true, corrigendum_pending=true, and duration_s=0.080421. V565 needs an immutable, non-retired evidence root before external transfer. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V565 roadmap document
      - {project_root}/research-roadmap.yaml and the activated V565 manifest; do not edit either
      - {project_root}/results/experiment_6518_structural_control_headroom_ab_v2.json through {project_root}/results/experiment_6526_v564_independent_capstone.json
      - {project_root}/python/carnot/experiment_6520_safety_net_branch_router_ab.py and its focused tests
      - {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/verdict_row_consistency_lint.py, and {project_root}/ops/conductor-log.md
      - {project_root}/ops/exclusion_manifest.yaml, relevant capability specs, traceability, and {project_root}/ops/e2e-test-plan.md

      TASK
      Validate the V565 activation manifest and write a bounded V564 evidence eligibility corrigendum. Recompute every adopted claim from immutable rows, rerun live verification, replace no historical file, and distinguish corrected eligibility from the historical Exp6520 fields.

      CONCRETE STEPS
      0. Record git status, active and planned milestone identifiers, input paths and hashes, conductor rows, tool versions, CPU/RAM/disk, monotonic-clock support, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for activation-manifest identity, immutable historical inputs, row-first recomputation, duration receipts, adversarial recheck, retired-ID isolation, and atomic terminal output. Write focused tests first.
      2. Recompute Exp6518-Exp6523 row counts, exact-equality fields, charged comparison fields, readiness scores, verdict classes, and gate chains from per-unit rows rather than copying aggregates.
      3. Rerun the current adversarial verifier and row-consistency lint against Exp6520. Execute its validation path under a monotonic timer with a meaningful duration floor and record command, exit code, stdout digest, start/end timestamps, duration, and code hash. Do not rewrite Exp6520.
      4. Explain the historical flagged_adversarial and corrigendum_pending fields, whether the current code and rows clear the defect, and which claims remain ineligible. Preserve disagreement instead of silently overwriting it.
      5. Verify that no V565 gated_on or requires edge names a retired task ID. Direct historical reads must be by path and hash only.
      6. Attack aggregate tampering, row deletion, renamed readiness fields, stale code, implausible duration, status-only success, positive oracle framing, and hidden historical-file edits.
      7. Set v565_evidence_root_ready_score=1.0 only if all adopted structural-router and conflict-memory inputs are row-consistent, live verification is clean, the duration receipt is credible, and every structured dependency is eligible.
      8. Write one terminal artifact atomically. Run focused tests with full new-module coverage, lint, spec coverage, row lint, exclusion lint, adversarial verification, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6527_v565_evidence_eligibility_corrigendum.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, activation_manifest_receipt, immutable_input_receipts, v564_task_rows, row_recomputation, exp6520_historical_flag_receipt, live_adversarial_recheck_receipt, monotonic_duration_receipt, corrected_claim_eligibility_rows, retired_dependency_attack_rows, v565_evidence_root_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Use verdict_class=null for an eligible governance root, partial when only a subset is usable, blocked for a missing prerequisite, or disqualified for false evidence. honest_verdict must begin complete_, blocked_, partial_, or disqualified_. Set inference_substrate=immutable_v564_row_replay_and_live_validation_no_llm. Set verifier_is_oracle=true only for hash, row, and command-receipt checks; never declare a positive scientific class. A blocked verdict must populate gate_check_summary with the failed check and observed value.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6527_v565_evidence_eligibility_corrigendum --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6528-v565-source-model-method-contract
    milestone: "2026.08.565"
    deliverable: results/experiment_6528_v565_source_model_method_contract.json
    title: "Execution-time V565 source, model, and method contract"
    priority: high
    track: sota-ingestion
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp5783-v516-source-delta-ingestion
        verdict: "complete: no accepted post-V516 source deltas; references unchanged and closed scopes preserved"
        addressed_by: "This dated check is anchored to an executable external benchmark intake, mandatory GGUF cache contract, transactional-memory controls, and the qwen3_xml live-path prerequisite rather than a generic literature refresh."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The V565 planning refresh is dated 2026-08-23 and selects DRIFT-Bench, Memoir, verifier-induced support reshaping, Distributional EBMs, Solver-Hard, and the qwen3_xml ARC prerequisite. Execution must check for a focused delta and freeze source, model, split, calibration, and stop-rule contracts before scientific outcomes are visible. Work at {project_root}. The execution date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V565 roadmap document
      - {project_root}/research-references.md and {project_root}/research-studying.md
      - {project_root}/scripts/sweep_clusters.py, {project_root}/scripts/sweep_semscholar.py, and source-note templates
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/docs/research-notes/avo-adaptation-for-local-generator-2026-08-21.md and {project_root}/docs/research-notes/qwen38-compaction-forward-plan-2026-08-20.md
      - Exp6527 if present, relevant exact solver/router/conflict-memory code, specs, tests, exclusions, and E2E plan

      TASK
      Run a focused, low-concurrency source and substrate delta through {date}, then freeze the V565 execution contract. This is research ingestion and preflight, not experimental LLM inference.

      CONCRETE STEPS
      0. Record network availability, query strings, timestamps, source tools, cache paths without secret values, repository state, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for dated source receipts, primary-source validation, revision/license provenance, citation-count caveats, model-cache identity, non-transfer boundaries, and a frozen method contract. Write focused tests first.
      2. Check arXiv, OpenReview, Semantic Scholar citations to EBT 2507.02092 and ARM-EBM 2512.15605, Hugging Face Papers, GitHub discovery, Extropic writing, and Logical Intelligence sequentially. Do not run a high-concurrency research harness.
      3. Verify primary URLs, dates, method claims, code/data availability, and local applicability for 2605.23940, 2607.20792, 2608.00220, 2605.18871, 2607.17047, QvsDTpf4yF, and gjiCml2CNG.
      4. Verify the DRIFT-Bench repository URL, immutable revision, license, data schema, upstream corruption warning, and the rule that all result receipts are regenerated locally.
      5. Call cached_sota_pair(gpu_indices=(0, 1)) only as a cache-resolution preflight. Record exact hub IDs, quantized filenames, hashes, and missing entries. Do not load or run the models.
      6. Freeze external family/chronology splits, structural controls, router calibration/abstention, paired-embedding conditions, transaction commit boundary, support/retention metrics, ARC qwen3_xml stop rule, and GateMate receipt boundary.
      7. Update research-studying.md and a dated research note only for verified execution-time deltas. Do not fabricate citation counts or product access.
      8. Set v565_method_contract_ready_score=1.0 only if every adopted method has a primary source, implementable local hook, negative control, non-transfer boundary, and frozen downstream field spelling.
      9. Run source-schema tests, URL/duplicate checks, spec coverage, adversarial verification, and git status.

      Required deliverable: {project_root}/results/experiment_6528_v565_source_model_method_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, query_receipts, source_rows, primary_source_hashes, citation_trail_receipts, citation_count_boundaries, drift_bench_provenance_contract, model_cache_resolution_rows, frozen_external_split_contract, frozen_router_contract, frozen_embedding_contract, frozen_transactional_learning_contract, frozen_arc_parser_contract, hardware_stop_contract, non_transfer_rows, v565_method_contract_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Use verdict_class=null or partial; blocked names the unavailable required channel or cache contract, and disqualified names fabricated or unverifiable evidence. honest_verdict must begin complete_, blocked_, partial_, or disqualified_. Set inference_substrate=low_concurrency_primary_source_and_cache_preflight_no_experimental_llm. Set verifier_is_oracle=false. A blocked verdict must populate gate_check_summary with the failed check and observed value.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6528_v565_source_model_method_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6529-drift-bench-external-intake
    milestone: "2026.08.565"
    deliverable: results/experiment_6529_drift_bench_external_intake.json
    title: "Content-pinned DRIFT-Bench intake and exact replay commitment"
    priority: critical
    track: data-and-evidence
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6528-v565-source-model-method-contract
        artifact_field: v565_method_contract_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      V564's router and conflict memory need a non-Carnot transfer surface. DRIFT-Bench provides 1,020 Z3-validated multi-turn seating, scheduling, and logic-grid problems, but its repository warns that original SQLite run databases were corrupted. V565 must pin the source and regenerate every scientific receipt locally. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V565 roadmap document
      - {project_root}/results/experiment_6528_v565_source_model_method_contract.json
      - {project_root}/results/experiment_6514_atomic_shard_artifact_transaction.json and its reusable transaction helper
      - exact constraint, Z3, branch feature, artifact, and checkpoint code under {project_root}/python/carnot/
      - existing external-corpus ingestion patterns, relevant specs/tests, exclusion manifest, traceability, and E2E plan
      - the pinned DRIFT-Bench README, data README, schema, and source rows resolved by Exp6528

      TASK
      Create a bounded, content-pinned DRIFT-Bench external fixture and exact replay commitment. Preserve chronological turns, regenerate labels locally, seal family-blind splits, and finalize through the V564 atomic transaction. Do not import upstream aggregate result claims.

      CONCRETE STEPS
      0. Evaluate the structured gate and record expected/observed values, source URL/revision/license, network status, solver versions, CPU/RAM/disk, fixture size bound, and protected-file hashes.
      1. Add REQ-* and SCENARIO anchors for external revision/license pinning, source-to-local row identity, chronological turn preservation, exact replay, family-blind split sealing, planned-unit accounting, resumable shards, and atomic finalization. Write tests first.
      2. Fetch or reuse only the exact pinned revision. Refuse a moving branch without a resolved commit. Record file-level hashes and the upstream corruption warning.
      3. Freeze a bounded balanced slice before labels are recomputed: all three domains, multiple problem sizes and turn positions, satisfiable and contradiction events, and enough independent base problems for train, development, and held family-blind cells.
      4. Preserve immutable source IDs separately from randomized local unit IDs. Remove no hard row based on solver cost or downstream behavior.
      5. Regenerate each cumulative constraint state and exact outcome with the installed solver. Record model/proof receipt, assignment, contradiction/MUS fields when available, solver effort, terminal status, and timeout/censoring.
      6. Seal train, development, and held base-problem lineages. No turn from one base problem may cross splits. Produce {project_root}/results/fixtures/v565_drift_bench_external_slice.jsonl through content-addressed shards and atomic final replace.
      7. Attack duplicate turns, chronological gaps, family aliases, entity-name leakage, row-order leakage, solver-version drift, corrupt resume, omitted timeouts, source-hash mismatch, and aggregate inheritance.
      8. Set external_constraint_corpus_ready_score=1.0 only when every planned unit is terminal, every admitted row has exact and source receipts, split floors hold, hashes close, and the fixture round-trips exactly.
      9. Run focused tests with full new-module coverage, lint, spec coverage, row lint, gate audit, adversarial verification, exact-solver E2E checks, fixture checksum verification, and git status.

      Required deliverables: {project_root}/results/experiment_6529_drift_bench_external_intake.json and {project_root}/results/fixtures/v565_drift_bench_external_slice.jsonl.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, upstream_gate_receipt, source_revision_and_license_receipt, source_file_hashes, upstream_corruption_boundary, intake_commitment, family_and_turn_census, source_to_local_identity_rows, exact_replay_rows, solver_receipts, contradiction_and_drift_rows, split_commitment, shard_manifest, planned_and_terminal_unit_counts, fixture_path_and_hash, leakage_attack_matrix, external_constraint_corpus_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Use verdict_class=null for a complete data contract, partial for a bounded usable corpus below a readiness floor, blocked for a failed gate or source/solver precondition, or disqualified for provenance or leakage failure. honest_verdict must begin complete_, blocked_, partial_, or disqualified_. Set inference_substrate=content_pinned_external_constraint_intake_and_exact_z3_replay_no_llm. Set verifier_is_oracle=true for exact labels and validity only; never use a positive scientific class. A blocked verdict must populate gate_check_summary with the failed check and observed value.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6529_drift_bench_external_intake --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6530-external-constraint-corpus-audit
    milestone: "2026.08.565"
    deliverable: results/experiment_6530_external_constraint_corpus_audit.json
    title: "Independent external-corpus provenance, replay, and split audit"
    priority: critical
    track: infrastructure-audit
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6512-branch-dataset-independent-audit
        verdict: "blocked_branch_dataset_independent_audit: upstream_exists=/home/ianblenke/github.com/ianblenke/carnot/results/experiment_6511_exact_branch_counterfactual_dataset_v2.json; independent_row_recomputation=row_count=0; split_and_lineage_audit=base_lineage_overlap_count=0 duplicate_checkpoint_count=0 post_held_repair_count=0 asymmetric_budget_count=0 missing_terminal_disposition_count=0; shard_and_censoring_audit=manifest_complete=False missing_shard_count=0 hash_chain_complete=True resume_receipts_present=True terminal_count_matches=True censored_count_matches=True"
        addressed_by: "This audit targets a content-pinned external fixture produced through the shipped atomic transaction, always runs, independently replays source and exact rows, and closes the readiness field even when intake is missing or corrupt."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6529 is the proposed external evidence root. Its audit must not trust source aggregates, intake aggregates, or source IDs as proof of independence. It must always run and always write external_constraint_corpus_audited_ready_score with the exact spelling below, including missing, blocked, partial, corrupt, and valid paths. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V565 roadmap document
      - {project_root}/results/experiment_6529_drift_bench_external_intake.json if present
      - {project_root}/results/fixtures/v565_drift_bench_external_slice.jsonl if present
      - {project_root}/results/experiment_6514_atomic_shard_artifact_transaction.json
      - the pinned DRIFT-Bench source revision and schema named by Exp6529
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, exact solver code, relevant specs/tests, exclusions, and E2E plan

      TASK
      Independently audit external provenance, exact labels, chronology, family-blind splits, transaction receipts, and row aggregates. Never edit the source artifact, fixture, shards, or upstream checkout.

      CONCRETE STEPS
      0. Record source and fixture existence, paths, hashes, statuses, row counts, pinned revision availability, solver versions, resources, and protected-file hashes. Continue to a terminal blocked record if anything is missing.
      1. Add REQ-* and SCENARIO anchors for missing-upstream closure, independent source identity, chronological replay, exact label replay, split reconstruction, shard verification, and leakage attacks. Write tests first.
      2. Independently resolve the pinned source revision and recompute every source-file hash used by the local slice. Verify license and upstream corruption-boundary text.
      3. Reconstruct cumulative constraints from raw source turns. Replay every held row and a preregistered sample of train/development rows with an independently initialized exact solver.
      4. Rebuild base-problem lineages and train/development/held sets from raw rows. Reject any cross-split turn, duplicate event, chronology gap, alias collision, post-held repair, or omitted terminal disposition.
      5. Verify planned IDs, terminal IDs, shard hashes, journal chain, resume receipts, final atomic-write receipt, fixture hash, and row-count agreement.
      6. Recompute family, turn, contradiction, drift, hardness, censoring, and exact-validity aggregates. Compare them with both the intake artifact and fixture without trusting either.
      7. Attack IDs, row order, entity names, serialization length, family labels, answer fields, solver-result caching, missing hard rows, hash substitution, and aggregate tampering.
      8. Set external_constraint_corpus_audited_ready_score=1.0 only when every audit passes. Otherwise set 0.0 and name every failed check and observed value in gate_check_summary.
      9. Run focused tests with full new-module coverage, lint, spec coverage, row consistency lint, adversarial verification, exact-solver E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6530_external_constraint_corpus_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, source_existence_and_hash_receipts, independent_revision_and_license_receipt, source_identity_audit_rows, chronology_replay_rows, independent_exact_replay_rows, split_and_lineage_audit, shard_and_transaction_audit, independent_aggregate_rows, leakage_attack_matrix, external_constraint_corpus_audited_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Use verdict_class=null for a complete integrity audit, partial for a bounded nonfatal limitation, blocked for missing or failed prerequisites, or disqualified for provenance/leakage corruption. honest_verdict must begin complete_, blocked_, partial_, or disqualified_. Set inference_substrate=independent_external_source_fixture_and_exact_solver_replay_no_llm. Set verifier_is_oracle=true for source, split, and exact-label audits only; never use positive. A blocked verdict must populate gate_check_summary with the failed check and observed value.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6530_external_constraint_corpus_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.
