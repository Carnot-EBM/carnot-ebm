  - id: exp3573-verifier-ensemble-code-bug-error-detection
    prior_failures:
      - experiment_id: exp1999-code-verification-humaneval
        verdict: prior_code_verification_baseline
        addressed_by: "exp1999 established HumanEval code verification; this task is DIFFERENT — it measures the FULL verifier ENSEMBLE's error-detection AUROC vs a strong model-confidence baseline AND best-single-verifier, framed as a CROSS-DOMAIN generalization test of the FoVer-validated ensemble (does math->code transfer?), not a single-verifier code check. New comparison + new framing + reuses the existing labeled corpus."
        retire_if_same_verdict: false
    milestone: "2026.05.329"
    title: "Verifier ensemble vs CODE BUGS — error-detection AUROC on execution-labeled HumanEval completions (does math->code generalize?)"
    priority: critical
    max_turns: 60
    agent_type: gemini
    estimated_wall_time_min: 30
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3573_verifier_code_bug_error_detection.json
    prompt: |
      CONTEXT: the verifier ensemble (G2-reproduced on FoVer math step-errors, AUROC 0.9131) must show it
      GENERALIZES to a different domain to be a defensible product claim. Code is the cleanest second domain:
      execution gives objective ground truth. Question: on a corpus of CORRECT vs BUGGY code completions,
      what is the verifier ensemble's ERROR-DETECTION AUROC, and does it beat a strong baseline?
      EXISTING DATA/CODE TO READ FIRST: results/experiment_1999_code_verification_humaneval.json + the script
      that produced it (the HumanEval code-verification corpus + labels); python/carnot/verify/
      ast_structure_verifier.py, code_structural_dependency_verifier.py, controlled_invariance_executor_v2.py,
      executable_monitor_runtime_adapter.py (the code-relevant verifiers); the verifier ENSEMBLE composition.
      PRECONDITIONS (step 0):
        a. An execution-labeled code corpus (correct vs buggy completions, >= 100 examples) is loadable —
           reuse exp1999's HumanEval corpus if present. If absent and you must GENERATE buggy/correct
           completions with a SOTA model, that is allowed (the conductor now gives live-model tasks a 1800s
           idle grace) — but PREFER the existing labeled corpus. If neither -> "complete: blocked_code_corpus_unavailable".
        b. The verifier ensemble is importable. If not -> "complete: blocked_verifier_ensemble_unavailable".
      CONCRETE STEPS:
        1. Score the verifier ensemble (objective energy) on each (problem, completion); compute
           error-detection AUROC (label = is-buggy) over >= 100 examples, >= 3 seeds, bootstrap CI.
        2. Strong baselines for comparison: (b1) model log-prob / sequence-confidence of the completion;
           (b2) the BEST SINGLE verifier in the ensemble. Compute their AUROCs on the same examples.
        3. Report ensemble AUROC vs both baselines + the deltas with paired CIs.
      REQUIRED ARTIFACT FIELDS (principle-annotated): honest_verdict (terminal prefix),
      inference_substrate=verifier_ensemble_against_cached_candidates,
      ensemble_code_error_detection_auroc (MEASURED + CI), best_single_verifier_auroc,
      model_confidence_baseline_auroc, ensemble_minus_best_baseline_delta (+ paired CI),
      n_examples (>=100), n_buggy / n_correct (class balance — sample-size rigor),
      generalizes_to_code (bool: ensemble AUROC materially > 0.5 AND > the model-confidence baseline),
      random_seed (content-derived), reproducibility_checksum, duration_s (1s floor).
      ACCEPTANCE GATE:
        - condition: "ensemble_code_error_detection_auroc present AND model_confidence_baseline_auroc present AND n_examples >= 100"
          principle: "Cross-domain generalization is measured against a STRONG baseline on adequate N — a number above 0.5 alone is not a win; it must beat model-confidence to show the ensemble adds value in code."
      TERMINAL VERDICTS: "complete: verifier_ensemble_generalizes_to_code_beats_confidence_baseline_auroc_FF" /
      "complete: verifier_ensemble_code_auroc_does_not_beat_confidence_baseline_domain_value_limited" /
      "complete: blocked_<resource>"
      Run: cd {project_root} && python scripts/experiment_3573_verifier_code_bug_error_detection.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3574-verifier-ensemble-factual-hallucination-error-detection
    prior_failures:
      - experiment_id: exp3329-verifier-ensemble-diversity-audit-v2
        verdict: prior_verifier_ensemble_eval
        addressed_by: "Prior verifier-ensemble evals (exp3329 diversity-audit, exp3441 adaptive-injection) measured ensemble diversity / prompt-injection robustness on injection corpora. This task asks a DIFFERENT question on a NEW domain: factual-hallucination error-detection AUROC on labeled QA (data/qa_dataset_1000.json) vs a strong model-confidence baseline, with per-verifier factual attribution. New domain + new metric + an explicit honest domain-bound hypothesis."
        retire_if_same_verdict: false
      - experiment_id: exp3441-verifier-ensemble-vs-adaptive-injection-corpus-v3
        verdict: prior_verifier_ensemble_eval
        addressed_by: "Adaptive-injection is prompt-injection robustness, not factual error-detection — different corpus, label, and baseline; not a re-run."
        retire_if_same_verdict: false
    milestone: "2026.05.329"
    title: "Verifier ensemble vs FACTUAL HALLUCINATIONS — error-detection AUROC on labeled QA (does it generalize to facts, or is it constraint-domain-bound?)"
    priority: critical
    max_turns: 60
    agent_type: gemini
    estimated_wall_time_min: 30
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3574_verifier_factual_hallucination_error_detection.json
    prompt: |
      CONTEXT: the HARDER generalization test (the core motivation — escape LLM hallucinations). Constraint
      verifiers (SAT/Z3/AST) do NOT naturally apply to factual claims; the semantic / NLA verifiers might.
      Question: on a labeled corpus of CORRECT vs INCORRECT (hallucinated) answers, what is the verifier
      ensemble's error-detection AUROC, and which verifiers carry the signal? Honest expectation: this may
      be WEAK (the ensemble could be constraint-domain-bound) — that is a valid, paper-scoping finding, not a
      failure to hide.
      EXISTING DATA/CODE TO READ FIRST: data/qa_dataset_1000.json (a 1000-example QA dataset — use its
      correct vs incorrect answer labels, or construct true/false claim pairs from it); the SEMANTIC / NLA
      verifiers python/carnot/verify/semantic_consistency_verifier.py, semantic_energy.py, nla_verifier_v3.py,
      nla_probe.py, fover_semantic_calibration.py.
      PRECONDITIONS (step 0):
        a. data/qa_dataset_1000.json present with usable correctness labels (or derivable true/false pairs),
           >= 100 examples. If unusable -> "complete: blocked_factual_corpus_unavailable".
        b. The verifier ensemble importable. If not -> "complete: blocked_verifier_ensemble_unavailable".
      CONCRETE STEPS:
        1. Build correct vs hallucinated (input, answer, label) pairs from the QA corpus.
        2. Score the verifier ensemble; error-detection AUROC (label = is-hallucination), >= 3 seeds, CI.
        3. Baselines: model-confidence/log-prob AUROC + best-single-verifier AUROC.
        4. Per-verifier attribution: which verifiers (if any) carry signal on FACTS vs which are inert
           (constraint verifiers expected inert) — informs whether the ensemble is constraint-domain-bound.
      REQUIRED ARTIFACT FIELDS (principle-annotated): honest_verdict (terminal prefix),
      inference_substrate=verifier_ensemble_against_cached_candidates,
      ensemble_factual_error_detection_auroc (MEASURED + CI), best_single_verifier_auroc,
      model_confidence_baseline_auroc, ensemble_minus_best_baseline_delta (+ CI),
      per_verifier_auroc (dict: which verifiers carry factual signal), n_examples (>=100),
      generalizes_to_facts (bool), constraint_verifiers_inert_on_facts (bool: honest domain-bound signal),
      random_seed (content-derived), reproducibility_checksum, duration_s.
      ACCEPTANCE GATE:
        - condition: "ensemble_factual_error_detection_auroc present AND model_confidence_baseline_auroc present AND per_verifier_auroc present"
          principle: "Measures factual generalization vs a strong baseline AND attributes which verifiers carry signal — a domain-bound result (constraint verifiers inert, AUROC ~ baseline) is a valid honest finding that scopes the paper's claim."
      TERMINAL VERDICTS: "complete: verifier_ensemble_generalizes_to_facts_beats_confidence_baseline_FF" /
      "complete: verifier_ensemble_factual_auroc_at_baseline_ensemble_is_constraint_domain_bound" /
      "complete: blocked_<resource>"
      Run: cd {project_root} && python scripts/experiment_3574_verifier_factual_hallucination_error_detection.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3575-verifier-discriminating-value-where-baseline-misses
    milestone: "2026.05.329"
    title: "Discriminating value — does the ensemble catch errors the STRONG baseline MISSES? (the 'second pair of eyes' lift, code + facts, McNemar)"
    priority: high
    max_turns: 50
    agent_type: gemini
    estimated_wall_time_min: 22
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3575_verifier_discriminating_value.json
    prompt: |
      CONTEXT: AUROC alone can hide the real value prop. The "second pair of eyes" claim is specifically that
      the verifier ensemble catches errors a STRONG baseline (model-confidence) MISSES. This task measures
      that conditional lift across code (exp3573) + facts (exp3574).
      PRECONDITIONS (step 0): read exp3573 + exp3574 artifacts via scripts/summarize_artifact.py. If either
      is blocked/missing -> run on whichever domain landed; if both missing -> "complete: blocked_prereq_domains_missing".
      CONCRETE STEPS:
        1. For each domain, on the held-out errors: compute (a) fraction the model-confidence baseline catches
           at a fixed FPR, (b) fraction the ensemble catches, (c) the CONDITIONAL catch-rate: errors the
           ensemble catches that the baseline MISSES (and vice-versa). McNemar paired test on the
           ensemble-vs-baseline disagreement + CI.
        2. Report the net "second pair of eyes" lift per domain: does the ensemble add coverage the baseline
           lacks, beyond what AUROC shows?
      REQUIRED ARTIFACT FIELDS (principle-annotated): honest_verdict (terminal prefix),
      inference_substrate=verifier_ensemble_against_cached_candidates,
      code_conditional_catch_rate_ensemble_over_baseline (errors caught by ensemble but missed by baseline),
      factual_conditional_catch_rate_ensemble_over_baseline, mcnemar_p_code, mcnemar_p_factual,
      second_pair_of_eyes_lift_real (bool: ensemble catches a significant set the baseline misses in >=1 domain),
      n_errors_code / n_errors_factual, random_seed (content-derived), reproducibility_checksum, duration_s.
      ACCEPTANCE GATE:
        - condition: "code_conditional_catch_rate_ensemble_over_baseline present AND mcnemar_p_code present"
          principle: "The product value is conditional coverage (catching what the baseline misses), tested with a paired significance test — not just a higher AUROC."
      TERMINAL VERDICTS: "complete: verifier_ensemble_catches_errors_baseline_misses_second_pair_of_eyes_confirmed" /
      "complete: verifier_ensemble_no_conditional_lift_over_confidence_baseline_value_is_redundant" /
      "complete: blocked_prereq_domains_missing"
      Run: cd {project_root} && python scripts/experiment_3575_verifier_discriminating_value.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

