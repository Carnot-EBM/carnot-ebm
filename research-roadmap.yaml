  - id: exp6407-provenance-tiered-factor-memory-protocol
    milestone: "2026.08.551"
    deliverable: results/experiment_6407_provenance_tiered_factor_memory_protocol.json
    title: "Provenance-linked typed factor memory and contamination protocol"
    priority: critical
    track: self-learning
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6397-transactional-continuous-factor-learning
        verdict: "complete_positive: at least one factor committed through predecessor-bound exact transaction"
        addressed_by: "This task adds an immutable raw tier, compiled typed graph, affected-neighborhood receipts, controlled contamination cases, expiry, supersession, and raw escalation; it does not rerun V550 learning utility."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6397 shipped predecessor-bound atomic factor commits, but the factor registry remains a short-horizon flat research structure. GRACE suggests typed graph-local verification under drift. TierMem suggests a compiled fast tier linked to immutable raw evidence. ConsistencyGate isolates write-time contamination. A-MAC supplies interpretable diagnostic features but not semantic authority. V551 needs a frozen substrate and test protocol before any new powered learning run. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6397_transactional_continuous_factor_learning.json and sidecars
      - {project_root}/results/experiment_6398_default_off_transactional_factor_consumer.json and sidecars
      - {project_root}/python/carnot/experiment_6342_anytime_evalue_release_ledger.py
      - {project_root}/python/carnot/experiment_6343_factor_lifecycle_retention_and_reversion.py
      - {project_root}/python/carnot/experiment_6397_transactional_continuous_factor_learning.py
      - {project_root}/research-references.md entries for arXiv:2607.09175, arXiv:2607.22962, arXiv:2602.17913, and arXiv:2603.04549
      - {project_root}/openspec/capabilities/continuous-learning/spec.md and {project_root}/openspec/capabilities/self-learning/spec.md

      TASK
      Implement and freeze a research-only provenance-linked two-tier factor memory and controlled contamination protocol. Do not invoke an LLM or measure learning utility. Exact checkers and release receipts remain authority. The compiled graph is a cache and must fail closed to the immutable raw ledger.

      CONCRETE STEPS
      0. Hash the V550 factor-head schema, release ledger, lifecycle code, exact checkers, licenses, and protected artifacts.
      1. Define an append-only raw record schema with event hash, source spans, model and harness identity, license key, exact checker version, release outcome, predecessor, disposition, timestamps, expiry, supersession, and transaction receipt.
      2. Define a compiled typed graph with factor, evidence, model, constraint-family, checker, license, predecessor, expiry, and supersession node/edge types. Every compiled node must link to raw hashes.
      3. Compute an exact affected-neighborhood receipt for additions, revocations, expiry, and supersession. Compare local replay with full replay on deterministic fixtures.
      4. Define fail-closed raw-tier escalation for missing provenance, implicit support, graph/cache disagreement, stale summaries, expired licenses, unresolved supersession, and checker drift.
      5. Freeze at least 48 controlled candidate events across supported, contradicted, implicit, stale, duplicated, replayed, superseded, poisoned, and clean-negative classes. Seal calibration, acquisition, retention, and future partitions.
      6. Add diagnostic admission features for utility, exact confidence, novelty, recency, and content type. Prove no weighted diagnostic can override an exact veto.
      7. Attack orphan summaries, forged raw links, cycle creation, neighborhood underreach/overreach, stale heads, partial atomic writes, duplicate effects, expiry removal, and cache resurrection after restart.
      8. Add or update REQ-* and SCENARIO-* entries before implementation. Write focused tests with 100% focused coverage. Run spec coverage, restart E2E, adversarial verification, determination preservation, and root-clutter checks.
      9. Set provenance_tiered_memory_protocol_ready_score=1.0 only when all compiled rows trace to immutable raw evidence, local and full replay agree, every attack fails closed, partitions are sealed, and no learned score gains authority.

      Required deliverable: {project_root}/results/experiment_6407_provenance_tiered_factor_memory_protocol.json.
      REQUIRED ARTIFACT FIELDS:
      status, upstream_factor_head_release_ledger_lifecycle_checker_and_license_hashes, raw_record_schema_path_hash_and_required_fields, compiled_typed_graph_schema_path_hash_node_and_edge_types, raw_to_compiled_provenance_link_receipts, affected_neighborhood_equations_and_receipts, local_vs_full_replay_equivalence_results, raw_tier_escalation_rules_and_tests, contamination_manifest_path_hash_counts_classes_and_partition_seals, diagnostic_admission_feature_contract, exact_veto_override_count, supported_contradicted_implicit_stale_duplicate_replay_supersession_poison_and_negative_fixture_results, orphan_forgery_cycle_neighborhood_head_atomic_duplicate_expiry_and_restart_attack_matrix, compiled_cache_authority_claimed, learning_utility_claimed, provenance_tiered_memory_protocol_ready_score, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for deterministic fixture checkers and replay equivalence. The memory substrate is not an oracle. field_principles must map provenance_tiered_memory_protocol_ready_score, exact_veto_override_count, and every escalation condition to its purpose. honest_verdict must begin with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6407_provenance_tiered_factor_memory_protocol --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6408-powered-write-time-factor-admission-ab
    milestone: "2026.08.551"
    deliverable: results/experiment_6408_powered_write_time_factor_admission_ab.json
    title: "Gated on Exp6406/6407 readiness: fresh powered write-time factor admission A/B"
    priority: critical
    track: self-learning
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 330
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6406-clean-v550-factor-evidence-boundary
        artifact_field: clean_factor_evidence_boundary_ready_score
        op: "=="
        value: 1.0
      - upstream: exp6407-provenance-tiered-factor-memory-protocol
        artifact_field: provenance_tiered_memory_protocol_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6381-verified-frontier-live-factor-proposal-ab
        verdict: "blocked_gate_check_failed"
        addressed_by: "The new attempt starts from shipped narrow licenses and a frozen contamination protocol, compares sandboxed write-everything with exact provenance admission, and never depends on universal transport readiness."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6406 must establish a clean V550-only evidence boundary. Exp6407 must freeze a provenance-linked raw and compiled memory protocol. Exp6395 licensed exactly four cells: Gemma-4-31B on threshold_guard and route_guard, and Gemma-4-26B-A4B on route_guard and conservation_guard. All Qwen cells and the two rejected Gemma cells must abstain. This experiment tests whether exact write-time admission prevents compounding contamination on fresh held events. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6406_clean_v550_factor_evidence_boundary.json
      - {project_root}/results/experiment_6407_provenance_tiered_factor_memory_protocol.json and contamination sidecar
      - {project_root}/results/experiment_6395_held_factor_transport_license_matrix.json
      - {project_root}/results/experiment_6396_capability_qualified_verified_frontier_ab.json
      - {project_root}/python/carnot/experiment_6395_held_factor_transport_license_matrix.py
      - {project_root}/python/carnot/experiment_6396_capability_qualified_verified_frontier_ab.py
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/openspec/capabilities/continuous-learning/spec.md and {project_root}/openspec/capabilities/research-harnesses/spec.md

      TASK
      Run a fresh powered write-time admission A/B inside the four licensed factor cells. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF from cached_sota_pair(). Use embedded GGUF tokenizers only. Never call AutoTokenizer. Qwen and rejected Gemma cells must record abstention without silent fallback. Exact event checkers own correctness.

      CONCRETE STEPS
      0. Revalidate both gates, clean boundary hash, contamination manifest seals, four licenses, frozen harnesses, schemas, model files, embedded tokenizers, both RTX 3090 GPUs, CUDA offload, and exact checker hashes.
      1. Seal at least 36 fresh held events balanced across the four licensed cells and contamination classes. Prove disjointness from V550 and Exp6407 development fixtures before generation.
      2. Compare a frozen baseline, a sandboxed write-everything arm, and provenance-plus-exact admission at matched models, prompts, event order, token budgets, checker calls, and consumer budget.
      3. Freeze raw model bytes, parser-independent source spans, proposed typed effects, diagnostic features, exact support receipt, admission disposition, and head hash before future outcomes are visible.
      4. Admit only exact-supported, source-bound, license-valid, predecessor-fresh proposals. Contradicted, implicit, stale, duplicate, replayed, superseded, poisoned, malformed, and unlicensed rows must reject, quarantine, defer, or abstain.
      5. Measure proposal transport, exact evaluability, admission precision/recall, contamination propagation, future exact yield, false accepts/rejects, raw escalation, abstention, latency, verification cost, and GPU memory by arm and cell.
      6. Attack model/family swaps, license inheritance, harness drift, source substitution, exact-check omission, weighted-diagnostic veto override, stale head, duplicate evidence, pooled abstention, and future-label leakage.
      7. Add or update REQ-* and SCENARIO-* entries. Write focused tests. Run focused coverage, spec coverage, inference E2E, adversarial verification, determination preservation, and root-clutter checks.
      8. Emit delta_future_exact_yield and delta_contamination_propagation_rate as bare finite numbers. Set powered_write_time_admission_ready_score=1.0 only when the powered arms run, provenance admission beats write-everything on future exact yield, contamination propagation does not increase over frozen and is lower than write-everything, false accepts do not increase, and every unlicensed cell abstains.

