milestone: "2026.08.579"
milestone_title: "Executable Constraints and Verified Skill Evolution"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6633-gpu-lease-phase-journal
    milestone: "2026.08.579"
    deliverable: results/experiment_6633_gpu_lease_phase_journal.json
    title: "Task-scoped GPU lease and phase journal"
    priority: critical
    track: execution-integrity
    requires_gpu: false
    max_turns: 100
    estimated_wall_time_min: 150
    model: opus
    prior_failures:
      - experiment_id: exp6617-gpu-lease-phase-receipts
        verdict: "blocked_gate_check_failed"
        addressed_by: "V579 starts with the implementation itself after the full 14-task contract was prevalidated, so no missing activation task can gate the lease."
        retire_if_same_verdict: true
      - experiment_id: exp6620-gpu-lease-phase-receipts
        verdict: "blocked_gate_check_failed"
        addressed_by: "The lease now has no runtime roadmap gate and must prove ownership with bounded process fixtures before any model task runs."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V577 and V578 planned a task-scoped GPU lease but never reached its implementation because their roadmap contracts failed first. V579 prevalidates its document and YAML before execution. This task starts the executable chain directly. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - Exp6605, Exp6607, Exp6617, Exp6620, and current conductor-log evidence
      - current lease, PID-start, heartbeat, cache-lock, checkpoint, atomic-write, model-admission, and protected-file helpers plus focused tests
      - {project_root}/python/carnot/inference/sota_models.py, {project_root}/python/carnot/pipeline/gemma4_quantized_loader.py, and {project_root}/scripts/experiment_template.py
      - relevant execution, model-tier, evidence, research-reporting, safety, and training-inference specs; traceability; status; changelog; and E2E plan

      TASK
      Implement a reusable task-scoped GPU lease and phase journal outside scripts/research_conductor.py. Prove ownership, phase, recovery, atomic evidence, and tamper behavior with bounded subprocess fixtures. Do not load an LLM.

      CONCRETE STEPS
      0. PRECONDITIONS: hash protected files; record existing helpers, process APIs, CUDA and nvidia-smi as diagnostics only, runtime paths, Python, CPU, RAM, disk, and the no-LLM substrate.
      1. Add REQ-* and SCENARIO-* anchors for atomic lease acquisition, device UUID, opaque token, PID start, heartbeat, expiry, model identity, VRAM, allowed phases, unload, recovery, atomic journals, and fail-closed status. Write focused tests first.
      2. Implement phases preflight, admitted, loading, resident, inferencing, unloading, validating, terminal_complete, and terminal_blocked. Reject skips, reversals, second terminals, and non-owner writes.
      3. Bind the journal to task ID, token, device UUID, PID and start time, executable and argv digest, expected model, acquisition and expiry, heartbeat, phase, VRAM before/resident/after, exit, unload, and checksum.
      4. Test same-device races, independent devices, PID reuse, owner crash, stale heartbeat, wrong token, wrong device, wrong model, timeout, missing unload, partial write, tamper, and restart recovery. Never kill or steal another process.
      5. Set gpu_lease_scheduler_ready_score=1.0 only when ownership, transitions, recovery, focused tests, and protected hashes pass. Write the artifact atomically and run relevant unit, spec, artifact, adversarial, and E2E checks.

      Required deliverable: {project_root}/results/experiment_6633_gpu_lease_phase_journal.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: infrastructure verdict with no model-quality claim
        verdict_class: closed enum; ready infrastructure is null
        gate_check_summary: failed check and observed value for every blocked result
        lease_api_receipts: owner-bound acquire, heartbeat, release, timeout, and recovery evidence
        phase_transition_rows: allowed and rejected transition rows
        process_fixture_rows: replayable race, reuse, crash, stale, tamper, and restart fixtures
        accelerator_receipt_examples: device, PID start, model, VRAM, exit, and unload evidence
        gpu_lease_scheduler_ready_score: exact binary field owned by this task
        attack_rows: every fail-closed attack and outcome
        preconditions_checked: inputs, tools, resources, and hashes
        protected_files_unchanged: hashes for research-roadmap.yaml and scripts/research_conductor.py
        inference_substrate: task_scoped_gpu_lease_process_fixtures_no_llm
        verifier_is_oracle: true because this is null infrastructure evidence
        field_provenance: source path, parser, function, hash, and schema per field
        duration_s: monotonic runtime
        tests_run: commands, exits, and summaries
        reproducibility_checksum: final content hash
      A ready result uses verdict_class=null. A genuine block uses blocked_* and gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6633_gpu_lease_phase_journal --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6634-mandated-model-admission
    milestone: "2026.08.579"
    deliverable: results/experiment_6634_mandated_model_admission.json
    title: "Independent admission of all mandated GGUF families"
    priority: critical
    track: model-admission
    requires_gpu: true
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 150
    model: opus
    gated_on:
      - upstream: exp6633-gpu-lease-phase-journal
        artifact_field: gpu_lease_scheduler_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6618-mandated-model-admission
        verdict: "blocked_upstream_retired"
        addressed_by: "The implemented ungated V579 lease now precedes three independent fresh-process admission canaries."
        retire_if_same_verdict: true
      - experiment_id: exp6605-qwen36-direct-headroom
        verdict: "blocked_gpu_process_receipts: direct baseline integrity did not complete"
        addressed_by: "A bounded canary now proves Qwen identity, lease, process, phase, residency, and unload before benchmark rows."
        retire_if_same_verdict: true
      - experiment_id: exp6606-gemma4-31b-direct-headroom
        verdict: "blocked_gate_check_failed"
        addressed_by: "Gemma 31B admission is independent and preserves its own terminal receipts even if another family fails."
        retire_if_same_verdict: true
      - experiment_id: exp6607-gemma4-26b-a4b-direct-headroom
        verdict: "blocked_gpu_ownership: expected True, observed False"
        addressed_by: "The same lease owner now records device UUID, PID start, model hash, residency, inference, and unload."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6633 owns the task-scoped execution envelope. This task validates actual local CUDA execution for each mandated family before science. One family may fail without erasing terminal evidence for the others. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V579 roadmap, and Exp6633 implementation, artifact, and tests
      - Exp6605-Exp6607 and Exp6618 artifacts, checkpoints, and conductor receipts
      - {project_root}/python/carnot/inference/sota_models.py, {project_root}/python/carnot/pipeline/gemma4_quantized_loader.py, and {project_root}/scripts/experiment_template.py
      - local GGUF cache discovery, llama.cpp or binding metadata, chat templates, GPU helpers, atomic evidence, and relevant specs and E2E checks

      TASK
      Run one deterministic fresh-process CUDA canary per mandated model under its own lease. Admit each family only from complete identity, process, phase, output, and unload evidence. Do not benchmark reasoning quality.

      CONCRETE STEPS
      0. PRECONDITIONS: verify Exp6633's structured gate; hash protected files; record exact cache paths, sizes, SHA-256, GGUF metadata, tokenizer and chat template, backend version, CUDA runtime, device UUIDs, free VRAM, CPU, RAM, disk, and time budget.
      1. Declare MODEL_SPECS with exactly these repo IDs: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Resolve one local file per repo and forbid substitutions, shared receipts, silent fallback, and legacy headline models.
      2. In three fresh processes, acquire a lease, load the expected file, prove CUDA residency and offload, run one deterministic machine-checkable canary, unload, release, and record residual VRAM. Keep partial terminal rows when a family blocks.
      3. Attack wrong repo, wrong hash, wrong tokenizer, CPU-only execution, second-process inference, stale journal, missing unload, malformed output, and cross-family receipt reuse.
      4. Set qwen36_admitted_score, gemma4_31b_admitted_score, and gemma4_26b_admitted_score independently to 1.0 only for complete passing rows. Write atomically and run focused, model-tier, artifact, adversarial, spec, and applicable E2E checks.

      Required deliverable: {project_root}/results/experiment_6634_mandated_model_admission.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: per-family admission verdict with no quality claim
        verdict_class: closed enum; admission is null infrastructure
        gate_check_summary: failed upstream or family check and observed value for every block
        model_specs: exact three mandated repo IDs and roles
        per_model_rows: one row per family with identity, process, device, phase, output, and unload evidence
        qwen36_admitted_score: exact binary Qwen gate field
        gemma4_31b_admitted_score: exact binary dense-Gemma gate field
        gemma4_26b_admitted_score: exact binary MoE-Gemma gate field
        lease_receipts: owner-bound lease and phase references
        attack_rows: identity, fallback, process, residency, output, and unload attacks
        preconditions_checked: cache, backend, resources, time, and hashes
        protected_files_unchanged: protected-file hashes
        inference_substrate: mandated_gguf_fresh_process_dual_rtx3090_canaries
        verifier_is_oracle: true because this is null execution admission
        field_provenance: source and method per field
        duration_s: monotonic runtime
        tests_run: commands and exits
        reproducibility_checksum: final content hash
      A ready family can coexist with a blocked family. A genuine block uses blocked_* and gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6634_mandated_model_admission --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6635-matched-direct-headroom
    milestone: "2026.08.579"
    deliverable: results/experiment_6635_matched_direct_headroom.json
    title: "Matched direct-headroom baselines"
    priority: critical
    track: constrained-generation
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    gated_on:
      - upstream: exp6634-mandated-model-admission
        artifact_field: qwen36_admitted_score
        op: "=="
        value: 1.0
      - upstream: exp6634-mandated-model-admission
        artifact_field: gemma4_26b_admitted_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6605-qwen36-direct-headroom
        verdict: "blocked_gpu_process_receipts: direct baseline integrity did not complete"
        addressed_by: "Qwen now runs only after a successful independent admission with the implemented task-scoped lease."
        retire_if_same_verdict: true
      - experiment_id: exp6607-gemma4-26b-a4b-direct-headroom
        verdict: "blocked_gpu_ownership: expected True, observed False"
        addressed_by: "Gemma 26B now uses the same owner-bound admission and phase journal before candidate generation."
        retire_if_same_verdict: true
      - experiment_id: exp6622-qwen36-direct-headroom
        verdict: "blocked_gate_check_failed"
        addressed_by: "The new gate points to an existing upstream task and identically declared per-family admission fields."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The constrained-decoding treatment needs complete direct rows and real error headroom. Prior attempts lacked owned GPU process evidence. This task creates the frozen baseline pool and does not apply constraints. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V579 roadmap, and Exp6633-Exp6634 artifacts and code
      - Exp6604-Exp6609 and Exp6622-Exp6624 artifacts, corpora, prompts, checkpoints, and reducers
      - {project_root}/scripts/experiment_template.py, SOTA loaders, exact task verifiers, candidate-row schemas, atomic checkpoint helpers, and relevant specs

      TASK
      Run matched deterministic direct baselines on Qwen3.6-35B-A3B and Gemma-4-26B-A4B. Freeze the corpus, prompts, seeds, budgets, parser, and exact checker. Emit every candidate row and qualify headroom without claiming a treatment benefit.

      CONCRETE STEPS
      0. PRECONDITIONS: verify both structured admission gates; record corpus and prompt hashes, exact MODEL_SPECS, model files and hashes, lease owner, backend, device, seeds, budgets, parser, checker, RAM, disk, and timeout.
      1. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF and unsloth/gemma-4-26B-A4B-it-GGUF. No substitute or legacy model may emit a headline row.
      2. Freeze eligible units before inference. Use fresh leased processes, exact chat templates, deterministic sampling, incremental checkpoints, and fail-closed parsing.
      3. Emit one per_candidate_rows entry for every unit, model, seed, and candidate. Include raw-output hash, parse status, exact validity, violation type, diversity key, latency, token counts, process and phase IDs, and error text.
      4. Compute complete-row and headroom gates only from rows. Set direct_rows_complete_score=1.0 only with all planned rows terminal. Set headroom_ready_score=1.0 only if preregistered invalid-candidate and recoverable-support floors pass for both families.
      5. Attack missing rows, duplicate candidates, parser drift, wrong model, CPU fallback, receipt reuse, aggregate-row mismatch, and checkpoint resume. Write atomically and run relevant tests and validation.

      Required deliverable: {project_root}/results/experiment_6635_matched_direct_headroom.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: baseline headroom verdict with no treatment claim
        verdict_class: closed enum
        gate_check_summary: failed gate or execution check and observed value for every block
        model_specs: exact mandated repo IDs, files, hashes, and roles
        corpus_manifest: frozen units, prompts, seeds, budgets, parser, and checker hashes
        per_candidate_rows: every planned unit-model-seed-candidate row
        direct_rows_complete_score: exact binary completeness field
        headroom_ready_score: exact binary treatment-eligibility field
        headroom_metrics: invalid rate, valid support, diversity, and confidence intervals by family
        accelerator_receipts: owner-bound process and phase evidence
        attack_rows: completeness, identity, parser, resume, and fallback attacks
        preconditions_checked: gates, inputs, resources, and hashes
        protected_files_unchanged: protected-file hashes
        inference_substrate: qwen36_and_gemma4_26b_gguf_dual_rtx3090_direct_generation
        verifier_is_oracle: false because exact checkers are independent of the proposal models
        field_provenance: source and method per field
        duration_s: monotonic runtime
        tests_run: commands and exits
        reproducibility_checksum: final content hash
      Positive headroom is eligibility, not a decoding win. A genuine block uses blocked_* and gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6635_matched_direct_headroom --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6636-delayed-two-level-decoding
    milestone: "2026.08.579"
    deliverable: results/experiment_6636_delayed_two_level_decoding.json
    title: "Delayed two-level constrained decoding"
    priority: critical
    track: constrained-generation
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 240
    gated_on:
      - upstream: exp6635-matched-direct-headroom
        artifact_field: headroom_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6609-two-level-constrained-decoding
        verdict: "blocked_gate_check_failed"
        addressed_by: "The treatment now starts only after complete owned flagship rows prove model-specific headroom."
        retire_if_same_verdict: true
      - experiment_id: exp6624-delayed-two-level-decoding
        verdict: "blocked_gate_check_failed"
        addressed_by: "The gate now names an existing upstream headroom field and the task compares all arms on one frozen candidate contract."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6635 owns a complete direct pool with qualified headroom. This task tests whether syntax constraints followed by delayed semantic constraints improve exact validity without collapsing candidate support. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V579 roadmap, and Exp6635 artifact, rows, prompts, checkpoints, and verifier code
      - Exp6604, Exp6608, Exp6609, and Exp6624 artifacts and two-level decoding implementations
      - Meta-Ctrl and verifier-support references in research-references.md
      - SOTA loaders, logits or grammar hooks, exact checkers, support metrics, atomic evidence, and relevant specs and E2E checks

      TASK
      Compare direct, syntax-only, and delayed syntax-plus-semantic decoding under matched models, units, seeds, and budgets. Preserve an unconstrained reasoning region. Exact checkers own validity and support accounting.

      CONCRETE STEPS
      0. PRECONDITIONS: verify the headroom gate; freeze Exp6635 row eligibility, MODEL_SPECS, prompt and corpus hashes, seeds, budgets, lease receipts, constraint activation point, syntax grammar, semantic atoms, exact checkers, resources, and timeout.
      1. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF and unsloth/gemma-4-26B-A4B-it-GGUF. Use the admitted files only and forbid silent fallback.
      2. Reuse the direct rows or replay only under a preregistered byte-identical need. Generate matched syntax-only and delayed two-level candidates. Log when each constraint activates and which token or structured choice it changes.
      3. Emit one per_candidate_rows entry per arm, unit, family, seed, and candidate with validity, violation type, best-at-k support, diversity, energy or score, latency, tokens, activation, process, and phase evidence.
      4. Report validity and support together. Reject a headline if validity rises while valid best-at-k support or diversity breaches the preregistered floor. Set decoding_rows_complete_score=1.0 only when all planned arms are terminal.
      5. Attack early semantic forcing, inert constraints, shared candidates, missing rejected-valid rows, mismatched budgets, parser drift, wrong model, receipt reuse, and aggregate inconsistency. Write atomically and validate.

      Required deliverable: {project_root}/results/experiment_6636_delayed_two_level_decoding.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: comparative validity-and-support verdict
        verdict_class: closed enum
        gate_check_summary: failed gate, row, model, support, or execution check and observed value
        model_specs: exact mandated models and admitted files
        treatment_contract: arms, activation points, units, seeds, budgets, and thresholds
        per_candidate_rows: every direct, syntax-only, and delayed row
        arm_metrics: validity, support, diversity, latency, and confidence intervals by model
        constraint_activation_rows: activation and changed-choice evidence
        decoding_rows_complete_score: exact binary completeness field
        acceptance_gate_validity_and_support: preregistered joint gate and observed values
        accelerator_receipts: owner-bound model process and phase evidence
        attack_rows: activation, support, completeness, identity, and aggregate attacks
        preconditions_checked: gate, inputs, methods, resources, and hashes
        protected_files_unchanged: protected-file hashes
        inference_substrate: qwen36_and_gemma4_26b_gguf_dual_rtx3090_delayed_constraint_decoding
        verifier_is_oracle: false because exact checkers are independent of candidate generation
        field_provenance: source and method per field
        duration_s: monotonic runtime
        tests_run: commands and exits
        reproducibility_checksum: final content hash
      A positive verdict requires the joint gate. A genuine block uses blocked_* and gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6636_delayed_two_level_decoding --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6637-verifier-unit-calibration
    milestone: "2026.08.579"
    deliverable: results/experiment_6637_verifier_unit_calibration.json
    title: "Cold-context verifier unit calibration"
    priority: high
    track: verification
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    gated_on:
      - upstream: exp6634-mandated-model-admission
        artifact_field: qwen36_admitted_score
        op: "=="
        value: 1.0
      - upstream: exp6634-mandated-model-admission
        artifact_field: gemma4_31b_admitted_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6625-cold-context-verifier
        verdict: "blocked_upstream_retired"
        addressed_by: "The verifier study now has direct per-family admission gates and a twin-prefix design that measures discrimination and rejection separately."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Recent work shows that prior repair context can shift a verifier threshold and that longer review units can raise catches and false rejections together. Carnot needs a calibrated verifier signal, not a catch-only score. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V579 roadmap, Exp6634 admission evidence, and current verifier modules and corpora
      - Exp6186 calibration patterns, Exp6603 scorer evidence, and any Exp6625 conductor receipt
      - arXiv:2608.23941 and arXiv:2608.16003 entries in research-references.md
      - exact trace validators, signal-detection metrics, SOTA loaders, row lints, atomic evidence, and relevant specs

      TASK
      Build byte-matched clean/error twin prefixes. Vary only the reviewed action unit and prior context. Measure catch, false rejection, informedness, criterion, and discrimination with exact labels as authority.

      CONCRETE STEPS
      0. PRECONDITIONS: verify both admission gates; freeze MODEL_SPECS, twin corpus, injected error, exact labels, five nested units, fresh/prior-repair/length-control contexts, prompts, seeds, budgets, model hashes, lease receipts, and time budget.
      1. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF and unsloth/gemma-4-31B-it-GGUF. Use admitted local files only.
      2. Prove each clean/error pair differs in one preregistered action and that unit boundaries alone change across nested conditions. Reject label leakage and non-byte-matched controls.
      3. Run every model, pair, context, and unit in fresh qualified processes. Emit per_twin_rows with both judgments and exact labels.
      4. Compute catch, false rejection, informedness, criterion, and d-prime by family, context, and unit. Select a unit only from discrimination plus a preregistered usefulness floor, never catch alone.
      5. Attack reject-all, accept-all, label leak, shuffled twins, changed observations, prior-context contamination, aggregate-row mismatch, wrong model, and missing rows. Write atomically and validate.

      Required deliverable: {project_root}/results/experiment_6637_verifier_unit_calibration.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: calibration verdict without release authority
        verdict_class: closed enum
        gate_check_summary: failed gate, corpus, execution, or calibration check and observed value
        model_specs: exact Qwen and dense-Gemma identities
        twin_corpus_manifest: byte hashes, labels, injections, contexts, units, and controls
        per_twin_rows: every clean and error judgment per model-context-unit
        signal_detection_metrics: catch, false rejection, informedness, criterion, and d-prime
        selected_verification_unit: preregistered selection result or null
        context_shift_rows: fresh, prior-repair, and length-control comparisons
        acceptance_gate_discrimination: gate and observed values
        accelerator_receipts: owner-bound process and phase evidence
        attack_rows: reject-all, leak, boundary, context, identity, and row attacks
        preconditions_checked: gates, inputs, methods, resources, and hashes
        protected_files_unchanged: protected-file hashes
        inference_substrate: qwen36_and_gemma4_31b_gguf_dual_rtx3090_twin_prefix_verification
        verifier_is_oracle: false because exact twin labels are independent authority
        field_provenance: source and method per field
        duration_s: monotonic runtime
        tests_run: commands and exits
        reproducibility_checksum: final content hash
      A learned verifier remains advisory. A genuine block uses blocked_* and gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6637_verifier_unit_calibration --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6638-exact-decoding-authority-audit
    milestone: "2026.08.579"
    deliverable: results/experiment_6638_exact_decoding_authority_audit.json
    title: "Independent exact decoding authority audit"
    priority: critical
    track: verification
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 90
    gated_on:
      - upstream: exp6636-delayed-two-level-decoding
        artifact_field: decoding_rows_complete_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6626-exact-authority-audit
        verdict: "blocked_upstream_retired"
        addressed_by: "The audit now gates only on a complete candidate-row field owned by an existing upstream treatment task."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6636 writes complete frozen candidate rows. This task is an independent exact reducer. It must recompute claims without importing treatment aggregates or using a learned verifier as authority. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V579 roadmap, and Exp6635-Exp6637 artifacts and row schemas
      - exact task checkers, support reducers, row-consistency lint, artifact schema, field provenance helpers, and relevant specs
      - verifier-support-reshaping and contract-grade-verifier entries in research-references.md

      TASK
      Recompute Exp6636 validity, support, diversity, and release gates from raw frozen rows. Audit learned routing against exact outcomes and retain every rejected valid candidate in support accounting. Do not run an LLM.

      CONCRETE STEPS
