    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - results/experiment_1536_satquest_cnf_verifier_benchmark.json
    - results/experiment_1522_cdg_root_cause_repair.json
    - results/experiment_1523_product_line_rescue_or_retire.json
    - python/carnot/verify/
    - python/carnot/repair/
    - tests/python/

    TASK:
    Build a residual-drift commitment ledger over multi-turn SATQuest,
    product-line, and runtime-contract cases and classify failures as true
    contradictions or satisfiable drift.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - residual_drift_ledger_ready
    - model_specs
    - live_sota_model_inference_used
    - multi_turn_cases
    - contradiction_cases
    - satisfiable_drift_cases
