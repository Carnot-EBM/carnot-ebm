- id: exp1041-kv260-bitstream-format-fix-v7
  milestone: 2026.04.81
  deliverable: results/experiment_1041_kv260_first_light_v7.json
  title: "KV260 First Light v7 — Bitstream Format Fix (bootgen .bit -> .bit.bin)"
  model: opus
  prior_failures:
    - experiment_id: exp1037-kv260-v6
      verdict: guide_written
      addressed_by: "Exp 1037 identified exact fix: guide_commands[2] = 'bootgen -arch zynqmp -process_bitstream bin -image carnot.bif'. The .bit file must be converted to .bit.bin format via bootgen before xmutil loadapp will succeed. SSH is confirmed working at 192.168.51.98. This experiment executes the guide."
      retire_if_same_verdict: false
    - experiment_id: exp1022-kv260-first-light-v5
      verdict: blocked_gate_artifact_missing
      addressed_by: "Was blocked because preflight gate artifact was missing. Exp 1041 is STANDALONE — no gate on any upstream experiment."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    The KV260 FPGA board (192.168.51.98) is SSH-reachable (confirmed Exp 1037). The bitstream
    load failure "carnot_ising_v4: Load Error: -1" is a KNOWN format issue: Kria's fpgautil
    requires a .bit.bin file (raw binary), NOT the Xilinx .bit format. The fix is to run
    bootgen with -process_bitstream bin flag to convert. Exp 1037 wrote the exact 5-command
    guide. This experiment executes it.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1037_kv260_v6.json (guide_commands array — these are the exact steps)
    - output/carnot_ising_v4_bd/ (bitstream files — ls to see what's there)
    - hardware/kv260/build_bd.tcl (understand the bitstream generation flow)
    - scripts/kv260_ising_smoke_test.py (smoke test to run if load succeeds)

    TASK:
    APPROACH 1 — Check if bootgen is installed:
    - which bootgen 2>/dev/null || which xsct 2>/dev/null || echo "not_found"
    - ls /tools/Xilinx/Vivado/*/bin/bootgen 2>/dev/null
    - If found: run bootgen to convert
    - If NOT found: check if the board itself has bootgen:
      ssh ubuntu@192.168.51.98 'which bootgen'
    - Board likely has bootgen: /usr/local/bin/bootgen or /opt/xilinx/bootgen

    APPROACH 2 — Use the board's bootgen (if not on host):
    - scp output/carnot_ising_v4_bd/*.bit ubuntu@192.168.51.98:/tmp/
    - Create carnot.bif on the board (via SSH heredoc):
      ssh ubuntu@192.168.51.98 'cat > /tmp/carnot.bif << EOF
      all:
      {
        [destination_device=pl] /tmp/carnot_ising_v4.bit
      }
      EOF'
    - ssh ubuntu@192.168.51.98 'bootgen -arch zynqmp -process_bitstream bin -image /tmp/carnot.bif'
    - This creates /tmp/carnot_ising_v4.bit.bin

    APPROACH 3 — Use fpgautil directly with the .bit.bin file:
    - scp /tmp/carnot_ising_v4.bit.bin ubuntu@192.168.51.98:/lib/firmware/xilinx/carnot_ising_v4/
    - ssh ubuntu@192.168.51.98 'sudo xmutil unloadapp 2>/dev/null; sudo xmutil loadapp carnot_ising_v4'
    - If success: jump to SMOKE TEST

    APPROACH 4 — Try dfx-mgr-client (alternative load path):
    - ssh ubuntu@192.168.51.98 'sudo dfx-mgr-client -addPackage /lib/firmware/xilinx/carnot_ising_v4/'
    - Then retry xmutil loadapp

    SMOKE TEST (if bitstream loads):
    - python scripts/kv260_ising_smoke_test.py --host 192.168.51.98
    - If smoke_test.py doesn't exist: create a minimal one (write 100 random J matrices via AXI,
      read back spin states, verify energy distribution is non-uniform)
    - Verify: energy_distribution_nonuniform=True (uniform would mean hardware isn't computing)

    FALLBACK: If all conversion approaches fail, write a detailed diagnostic:
    - exact bootgen error message
    - output of: ssh ubuntu@192.168.51.98 'dmesg | tail -20'
    - output of: ssh ubuntu@192.168.51.98 'ls /lib/firmware/xilinx/carnot_ising_v4/'
    - kv260_guide_v2_written=True with specific next steps

    CONCRETE STEPS:
    - ls output/carnot_ising_v4_bd/ 2>/dev/null | head -20
    - ssh ubuntu@192.168.51.98 'which bootgen && bootgen --version' 2>/dev/null
    - ping -c 1 192.168.51.98
    - ssh -o ConnectTimeout=10 ubuntu@192.168.51.98 'echo SSH_OK'
    - (run bootgen conversion, transfer, load, smoke test)
    - Write results/experiment_1041_kv260_first_light_v7.json

    ARTIFACT FIELDS:
    - ssh_reachable: bool
    - bootgen_found: bool (and where — host or board)
    - bit_to_bin_converted: bool
    - bitstream_loaded: bool
    - smoke_test_passed: bool (null if bitstream not loaded)
    - energy_distribution_nonuniform: bool (null if smoke test didn't run)
    - honest_verdict: "first_light_achieved" | "bitstream_loaded_smoke_pending" | "format_converted_load_failed" | "guide_v2_written" | "all_paths_blocked"

    Run: python scripts/experiment_1041_kv260_first_light_v7.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

