        addressed_by: "The deliverable is a bounded classifier and fixture replay, not another broad capstone; it must compute all classifications before atomically writing one terminal artifact."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 2026.08.536 is complete in conductor state, yet results/experiment_6183_transition_v536.json and results/experiment_6196_v536_capstone_reconciliation.json both remain bootstrap-only/nonterminal. Carnot needs one shared terminal-state contract before trusting another transition or capstone. This is infrastructure work, not a scientific result and not permission to rewrite historical artifacts.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/openspec/capabilities/research-harnesses/spec.md
      - {project_root}/scripts/conductor_gates.py and {project_root}/scripts/roadmap_schema.py
      - {project_root}/scripts/adversarial_verify.py and {project_root}/python/carnot/experiment_artifacts.py
      - {project_root}/python/carnot/experiment_6183_v536_transition.py and {project_root}/python/carnot/experiment_6196_v536_capstone_reconciliation.py
      - {project_root}/tests/python/test_experiment_6183_v536_transition.py and {project_root}/tests/python/test_experiment_6196_v536_capstone_reconciliation.py
      - Exact immutable artifacts for Exp6183, Exp6194, Exp6195, and Exp6196

      TASK
      Specify, implement, and test a reusable fail-closed terminal-artifact classifier outside scripts/research_conductor.py. It must distinguish terminal complete/ready/positive/null/blocked/skipped/retired/flagged outcomes from missing, running, running_bootstrap, bootstrap-only, contradictory, and malformed artifacts. Replay immutable fixtures and prove that Exp6183 and Exp6196 are nonterminal even when conductor completion receipts exist.

      Required deliverable: {project_root}/results/experiment_6197_v537_terminal_artifact_contract.json.
      REQUIRED ARTIFACT FIELDS: status, fixture_paths_and_hashes, accepted_terminal_prefixes, rejected_nonterminal_prefixes, status_verdict_cross_product, exp6183_classification, exp6196_classification, valid_fixture_classifications, conductor_receipt_override_count, protected_artifact_mutation_count, classifier_module_and_hash, focused_test_commands, focused_test_exit_codes, full_suite_command_and_classified_exit_code, inference_substrate, verifier_is_oracle, field_provenance, field_principles, duration_s, reproducibility_checksum, honest_verdict. Each load-bearing field must carry a principle annotation. conductor_receipt_override_count and protected_artifact_mutation_count must be bare 0.

      CONCRETE STEPS
      1. Add REQ-INFRA-6197 and scenarios to openspec/capabilities/research-harnesses/spec.md before implementation; update _bmad/traceability.md for the new requirement and focused tests.
      2. Implement a small shared module under python/carnot/ that normalizes status and honest_verdict without importing the conductor. Make unknown or contradictory combinations fail closed.
      3. Construct immutable hashed fixtures from existing result paths: known good complete/ready/positive, honest blocked, skipped/gated, retired, adversarial-flagged, missing, malformed, running, running_bootstrap, and bootstrap-only.
      4. Assert Exp6183 and Exp6196 classify nonterminal and that no conductor completion receipt can override artifact state. Do not edit either historical artifact.
      5. Add focused unit tests for every status/verdict cross-product, missing paths, malformed JSON, aliases, and protected-file immutability.
      6. Run focused tests, roadmap schema tests, and the applicable non-mutating commands from ops/e2e-test-plan.md. Classify unrelated pre-existing nonzero commands exactly; never rewrite results while testing.
      7. Compute every terminal field in memory, then atomically write the deliverable once. A defensive bootstrap artifact is forbidden.

      Run command: .venv/bin/python -m carnot.experiment_6197_v537_terminal_artifact_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

