        offline_reproduced:
          principle: "a solve not reproducible offline is wasted effort -- only reproduced levels count toward reproducible_total_levels."
        reproduced_levels:
          principle: "the integer new-level count banked this task (>=1 to satisfy the level-up guarantee on an attempted bank)."
        registry_updated:
          principle: "the per-game win-condition/action-model/gotchas/dead-ends persisted so the next attempt reuses, not re-derives."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "catches silent drift on replay."
        preconditions_checked:
          principle: "records resources verified; pre-empts missing-resource fabrication."

