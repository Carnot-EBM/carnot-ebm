        - research-references.md "2026-05-31 Post-.325 Planning Sweep" (MoB no-headroom insight, ranked-voting SC) + the .325 sweep

      TASK: Generate a NL-math corpus and SELECT for greedy-wrong-but-recoverable problems: keep a
      problem iff GREEDY answer is incorrect AND >=1 of k>=16 sampled candidates is correct, so the
      corpus oracle (always pick the correct answer when present among candidates) STRICTLY exceeds
      both the greedy accuracy and the SC majority accuracy. Write to a NEW path (do not overwrite the
      level-3 corpus).

