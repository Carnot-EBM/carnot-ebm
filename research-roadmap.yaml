- id: exp1081-fpga-scale-benchmark
  milestone: 2026.04.84
  deliverable: results/experiment_1081_fpga_scale_benchmark.json
  title: "FPGA Scale Benchmark — KV260 vs CPU Ising at 64→1024 Spins (find crossover point)"
  model: opus
  prior_failures:
    - experiment_id: exp1068-kv260-smoke-test-v9
      verdict: smoke_test_passed_latency_measured
      addressed_by: "exp1068 measured 24.83μs at 64 spins (smoke test only). This experiment scales to 128, 256, 512, 1024 spins to find the crossover point where FPGA beats CPU. Different scope: benchmark not smoke test."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    KV260 Ising smoke test passed in milestone .83 (exp1068): 24.83μs latency at 64 spins,
    70 unique values confirming live stochastic sampling. The board is at 192.168.51.98.

    This experiment measures FPGA vs CPU Ising sampling latency across multiple problem sizes.
    The CPU baseline is ~290ms per call from Exp 568. FPGA was 24.83μs at 64 spins.
    We want the crossover point: at what N does FPGA start beating CPU?

    arXiv 2602.15985 (Hybrid FPGA Ising) predicts: FPGA wins at N >= ~256 spins with co-design.
    KV260 N_SPINS=64 is the current bitstream; N=128/256/512/1024 require re-synthesis (Vivado)
    OR: we can extrapolate from scaling theory (latency ∝ N for FPGA, ∝ N^2 for CPU MCMC).

    EXISTING CODE TO READ FIRST:
    - results/experiment_1068_kv260_smoke_test_v9.json (hardware_latency_us=24.83, N=64)
    - scripts/kv260_ising_smoke_test.py (SSH-based benchmark script)
    - python/carnot/samplers/parallel_ising.py (CPU Ising sampler for baseline)
    - hardware/kv260/build_bd.tcl (find N_SPINS parameter for re-synthesis)

    TASK:
    1. BOARD REACHABILITY:
       ping -c 1 192.168.51.98 && echo "board reachable"
       ssh -o ConnectTimeout=10 ubuntu@192.168.51.98 'echo SSH_OK'

    2. CPU BASELINE — measure at multiple sizes:
       python -c "
       import time, sys; sys.path.insert(0, '{project_root}')
       from python.carnot.samplers.parallel_ising import ParallelIsingSampler
       import numpy as np
       for n in [64, 128, 256, 512, 1024]:
           sampler = ParallelIsingSampler(n_spins=n)
           J = np.random.randn(n, n) * 0.1
           J = (J + J.T) / 2; np.fill_diagonal(J, 0)
           t0 = time.perf_counter()
           for _ in range(100): sampler.sample(J, n_steps=1000)
           elapsed = (time.perf_counter() - t0) / 100 * 1000  # ms per call
           print(f'CPU N=(n): (elapsed:.2f)ms/call')
