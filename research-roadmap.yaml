- id: exp2369-spilled-energy-k18
  title: 'Phase 3: SpilledEnergy k=18 Variant (arXiv:2602.18671, ICLR 2026) — Logprob-Compatible Tier 0i'
  milestone: 2026.05.231
  deliverable: results/experiment_2369_spilled_energy_k18.json
  agent_type: codex
