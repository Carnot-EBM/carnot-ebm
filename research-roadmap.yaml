      AUROC not adversarially validated), this task MUST exit with honest_verdict blocked_gate_not_met
      rather than proceeding.

      BB-UCP (Bootstrap-Based Uncertainty-Calibrated Prediction) per arXiv:2509.23002 computes
      conformal calibration intervals over ensemble scores WITHOUT requiring labeled calibration data.
      It bootstraps from the ensemble's own score distribution on unlabeled examples. This is
      critical for deployment: most users don't have labeled data to run traditional conformal
      calibration.

      Target: coverage_at_90pct > 0.85 (coverage exceeds 85% of true labels at 90% prediction interval).

      EXISTING CODE TO READ FIRST:
      - results/experiment_2622_ensemble_v9_adversarial_val.json (adversarially_verified gate)
      - results/experiment_2534_adaptive_conformal_acse.json (prior conformal baseline)
      - python/carnot/verify/ (ensemble v9 components)

      TASK: Implement BB-UCP label-free conformal calibration for ensemble v9.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. Read results/experiment_2622_ensemble_v9_adversarial_val.json.
            If adversarially_verified != true: write honest_verdict blocked_gate_not_met; exit.
         b. `python -c "import sklearn; import numpy; import scipy"` succeeds.
         c. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load ensemble v9 scores from FoVer real corpus (unlabeled mode: use scores only, no labels).
         Draw 1000 bootstrap samples of size 200 from the score distribution.
         For each bootstrap sample: compute score mean, std, and 5th/95th percentiles.
         bb_ucp_mean = mean of per-bootstrap means
         bb_ucp_lower = mean of per-bootstrap 5th pct
         bb_ucp_upper = mean of per-bootstrap 95th pct
         bb_interval_width = bb_ucp_upper - bb_ucp_lower

      2. Validate coverage against labeled FoVer test set (n >= 100):
         For each labeled example: check if true label probability falls within [bb_ucp_lower, bb_ucp_upper].
         coverage_at_90pct = fraction of examples where the interval covers the true label.

      3. Compare to naive 90th percentile interval (no bootstrap):
         naive_interval_width = score_90th_pct - score_10th_pct
         Write bb_ucp_narrower_than_naive = (bb_interval_width < naive_interval_width).

      4. Write results/experiment_2627_bb_ucp_conformal.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - coverage_at_90pct: float — fraction of labeled examples with true label in BB-UCP interval
