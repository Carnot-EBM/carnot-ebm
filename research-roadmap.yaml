- id: exp6734-sota-dual-encoding-proposal-corpus
  title: Three-model SOTA dual-encoding proof-carrying proposal corpus
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 480
  per_unit_rows: true
  milestone: 2026.08.587
  deliverable: results/experiment_6734_sota_dual_encoding_proposal_corpus.json
  prompt: |
    CONTEXT:
    The current 48-row certificate corpus achieved only 8 exact successes, and the most recent SOTA
    planning proposal bank was pre-gate blocked. SymDiag (arXiv 2608.08786) suggests preserving two
    independent symbolic encodings so later work can separate neural-to-symbolic translation errors
    from reasoning errors. This task creates an attributable corpus, not a success-threshold gate:
    failures and abstentions are first-class data.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
    - {project_root}/openspec/capabilities/model-tiers/spec.md
    - {project_root}/openspec/capabilities/llm-ebm-inference/spec.md
    - {project_root}/results/experiment_6733_hardness_controlled_certificate_stream.json
    - {project_root}/results/experiment_6718_sota_planning_proposal_bank.json
    - The current exact-certificate scripts/corpus and
      {project_root}/scripts/experiment_template.py cached SOTA pattern
    - {project_root}/research-references.md entry for SymDiag, arXiv 2608.08786

    TASK:
    Run all three mandated local GGUF families sequentially over the frozen Exp6733 test protocol,
    elicit a constrained proof-carrying DSL, parse each response with two independently implemented
    encoders, and exact-check every candidate. Preserve raw, parse-failed, abstained, and invalid rows.

    MODEL_SPECS:
    - `unsloth/Qwen3.6-35B-A3B-GGUF`: flagship MoE.
    - `unsloth/gemma-4-31B-it-GGUF`: flagship dense.
    - `unsloth/gemma-4-26B-A4B-it-GGUF`: middle MoE.
    These are headline models. Legacy Qwen3.5-0.8B or gemma-4-E4B may be CPU smoke tests only and
    must not enter pooled or per-family headline metrics.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6733 and `hardness_stream_ready == true`; exact cached GGUF paths
       for all three MODEL_SPECS; CUDA offload; sequential one-model-at-a-time VRAM admission; the
       immutable split/corpus hashes; and exact verifier availability. On failure write
       `blocked_<resource>` plus `gate_check_summary`; do not substitute remote APIs or other models.
    1. Confirm or add the narrow dual-encoding/corpus REQ-* in verifiable-reasoning and model-tiers
       specs. Write tests for the proof DSL, both encoders, disagreement classification, exact
       checking, model attribution, and failed-row retention before implementation.
    2. Freeze one prompt template, decoding parameters, seed policy, and per-row token budget before
       loading models. Run all three current models sequentially on every preregistered evaluation
       row. Do not condition later prompts on earlier exact outcomes.
    3. Require a bounded proof-carrying DSL. Implement encoder A and encoder B as genuinely
       independent code paths with separate intermediate forms. Exact-check the source claim and
       each parsed certificate; do not let either parser certify its own output.
    4. Classify each response as exact success, reasoning error, translation error, dual failure,
       abstention, truncation, or infrastructure failure using stored raw/hash and exact receipts.
       Retain all rows and both parser outputs, including disagreements.
    5. Set `dual_encoding_corpus_ready` true only if every planned model/instance row was attempted,
       attributed, persisted, independently parsed, and exact-checked or given an explicit failure
       state. Do not gate on accuracy.
    6. Run focused tests, model-tier/spec coverage, lint, row-consistency lint, and adversarial
       verification. Write the artifact atomically after preconditions.
    7. REQUIRED ARTIFACT FIELDS, each documented in `field_principles`:
       `inference_substrate` (local CUDA GGUF exact-proposal stream), `duration_s` (wall time),
       `random_seed` (decoding/row seeds), `reproducibility_checksum` (canonical rows/config),
       `models_used` (exact IDs, SHAs, roles, cache-path hashes), `model_specs` (frozen settings),
       `upstream_dataset_hash` (Exp6733 corpus), `rows` (every model x instance attempt),
       `encoding_disagreement_rows` (all A/B disagreements), `exact_success_by_model_family`
       (row-derived), `error_type_by_model_family` (row-derived), `abstention_counts`,
       `dual_encoding_corpus_ready` (exact downstream gate), `gate_check_summary` (failing
       check/value on blocked paths), `verdict_class` (closed enum), and `honest_verdict` (terminal
       prefix). Use `local_llama_cpp_python_cuda_gguf_exact_proposal_stream` as the substrate.

    Run command: `cd {project_root} && .venv/bin/python scripts/experiments/experiment_6734_sota_dual_encoding_proposal_corpus.py`
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  gated_on:
    - upstream: exp6733-hardness-controlled-certificate-stream
      artifact_field: hardness_stream_ready
      op: '=='
      value: true
  prior_failures:
