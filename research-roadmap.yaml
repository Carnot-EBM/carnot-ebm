- id: exp641-hermes-v2-live-loop
  milestone: 2026.04.49
  deliverable: results/experiment_641_hermes_v2_live.json
  title: 'Exp 641: HermesVerifierAdapter v2 — LIVE Step-by-Step Generation Loop (RETRO-070 Critical Path, GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-070 CRITICAL (carry 3). interwhen recall=0.12 (Exp 629), hermes_recall=0.12
    (Exp 633). Both post-hoc — they run SymCodeVerifier on COMPLETED responses from live_pairs_578.json.
    The ceiling is 12% because IT models only express explicit arithmetic in 12% of their prose.
    The fix: generate step-by-step LIVE. Prompt Qwen3.5-0.8B for one sentence at a time. After
    each sentence: run SymCodeVerifier. If violation: inject correction hint into generation context
    before next sentence. This is architecturally different — the verifier sees "47 apples... 28
    oranges... total of 76" AS the model writes it, not after the full response is committed.
    Target: live_hermes_v2_recall >= 0.20 (target 0.30 to open VR gate).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/hermes_adapter.py — HermesVerifierAdapter v1, process_response()
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier.verify_step(), detection_score()
    - python/carnot/pipeline/interwhen_monitor.py — InterWhenMonitor.split_at_boundaries()
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()
    - python/carnot/pipeline/live_assertion.py — assert_live_gpu_available()
    - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner
    - results/experiment_629_interwhen_diagnostic.json — interwhen_recall_primary=0.12
    - results/experiment_633_hermes_adapter.json — hermes_recall=0.12 (post-hoc baseline)
    - results/fover_corpus_v5_oracle.json or results/fover_corpus_v5.json — live questions

    TASK: Implement HermesV2LiveLoop for step-by-step live generation with mid-generation verification.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-137 (HermesV2LiveLoop: generate one sentence at a time, run SymCodeVerifier
       at each boundary, inject hint before next sentence if violation detected),
       REQ-VERIFY-138 (HermesV2LiveLoop: live_recall >= 0.20 on 25 live questions),
       SCENARIO-VERIFY-180/181/182 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/hermes_v2_live_loop.py:
       a. HermesV2StepResult dataclass: step_index (int), step_text (str),
          violation_detected (bool), detection_score (float),
          hint_injected (bool), hint_text (str | None).
       b. HermesV2GenerationResult dataclass: question (str), full_response (str),
          step_results (list[HermesV2StepResult]), any_violation (bool),
          n_violations (int), n_hints (int).
       c. HermesV2LiveLoop class:
          __init__(self, llm_caller: Callable[[str], str] | None,
                   verifier: SymCodeVerifier,
                   max_sentences: int = 10,
                   max_new_tokens_per_step: int = 80):
            self.llm_caller = llm_caller
            self.verifier = verifier
            self.max_sentences = max_sentences
            self.max_new_tokens = max_new_tokens_per_step
          _generate_step(self, context: str) -> str:
            'Generate one sentence from the LLM given accumulated context.'
            If llm_caller is None: return a short synthetic stub sentence.
            prompt = context + ' (Continue. Write one sentence only.)'
            response = self.llm_caller(prompt)
            Return the first sentence from response (split on '.!?\n', take first non-empty).
          generate_with_verification(self, question: str) -> HermesV2GenerationResult:
            'Generate step-by-step answer, verifying at each step boundary.'
            context = f'Question: {question}\nAnswer: '
            steps: list[HermesV2StepResult] = []
            for i in range(self.max_sentences):
                sentence = self._generate_step(context)
                if not sentence.strip():
                    break
                score = self.verifier.detection_score(sentence)
                violated = score > 0.0
                hint = None
                hint_injected = False
                if violated:
                    hint = '[Note: Recheck the previous arithmetic step carefully.]'
                    hint_injected = True
                steps.append(HermesV2StepResult(i, sentence, violated, score,
                    hint_injected, hint))
                context += sentence + ' '
                if hint:
                    context += hint + ' '
                if len(context.split()) > 300:
                    break
            full_response = ' '.join(s.step_text for s in steps)
            return HermesV2GenerationResult(
                question=question,
                full_response=full_response,
                step_results=steps,
                any_violation=any(s.violation_detected for s in steps),
                n_violations=sum(s.violation_detected for s in steps),
                n_hints=sum(s.hint_injected for s in steps))
       d. Export HermesV2LiveLoop, HermesV2GenerationResult, HermesV2StepResult from carnot.pipeline.
    4. Write scripts/experiment_641_hermes_v2_live.py:
       a. apply_env_autofix() FIRST.
       b. assert_live_or_ci_skip() from python.carnot.pipeline.live_assertion.
       c. ExperimentTimeoutWatchdog(641, timeout_minutes=90).
       d. ExperimentTemplate(641, 'HERMES v2 Live Generation Loop',
          'results/experiment_641_hermes_v2_live.json', requires_gpu=True).
       e. tmpl.setup_gpu([{"name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0}])
          llm_caller: live Qwen3.5-0.8B via transformers pipeline if CARNOT_FORCE_LIVE=1,
          else None (CI stub — all steps return empty, all detections False).
       f. verifier = SymCodeVerifier(llm_caller=llm_caller if CARNOT_FORCE_LIVE else None)
          loop = HermesV2LiveLoop(llm_caller, verifier, max_sentences=8)
       g. Load 25 known-incorrect questions from fover_corpus_v5_oracle.json or
          fover_corpus_v5.json (is_correct=False). If < 25: use 25 synthetic GSM8K questions.
          Load 10 known-correct questions (is_correct=True) for FP measurement.
       h. BatchedInferenceRunner for incorrect questions, batch_size=5:
          For each question: result = loop.generate_with_verification(question)
          hermes_v2_tp = sum(r.any_violation for r in incorrect_results)
          For correct: hermes_v2_fp = sum(r.any_violation for r in correct_results)
          hermes_v2_recall = hermes_v2_tp / 25
          hermes_v2_fp_rate = hermes_v2_fp / 10
          mean_hints_per_incorrect = mean(r.n_hints for r in incorrect_results)
       i. Compare: post_hoc_baseline = 0.12 (from Exp 633)
          recall_improvement = hermes_v2_recall - post_hoc_baseline
       j. Build artifact: schema='carnot.hermes_v2_live.v1',
          n_questions=25, n_correct=10,
          hermes_v2_tp=<int>, hermes_v2_fp=<int>,
          hermes_v2_recall=<float>, hermes_v2_fp_rate=<float>,
          post_hoc_baseline=0.12, recall_improvement=<float>,
          mean_hints_per_incorrect=<float>,
          inference_mode='live_gpu' if CARNOT_FORCE_LIVE else 'ci_stub',
          gate_contribution=(hermes_v2_recall >= 0.20),
          retro_070_partial=(hermes_v2_recall > 0.12),
          honest_verdict='hermes_v2_breakthrough' if hermes_v2_recall >= 0.30
            else 'hermes_v2_improved' if hermes_v2_recall > 0.12
            else 'hermes_v2_no_improvement'.
       k. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_hermes_v2_live_loop.py (100% coverage on hermes_v2_live_loop.py).
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: ops/conductor-log.md (RETRO-070 HERMES v2 attempt), ops/changelog.md.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp642-causal-reasoning-verifier
  milestone: 2026.04.49
  deliverable: results/experiment_642_causal_verifier.json
  title: 'Exp 642: CausalReasoningVerifier — Step Entailment Checking (arXiv 2601.21210)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2601.21210 (January 2026) introduces symbolic verification of causal
    reasoning in LLM CoT: given step_k and step_{k+1}, does step_k causally justify step_{k+1}?
    This catches logical incoherence violations that arithmetic checking misses: e.g., a step
    that correctly adds 47+28=75 but then concludes "so we have 80 items" is causally broken
    even if all the arithmetic within each step is correct. SymCodeVerifier (Exp 619) checks
    arithmetic WITHIN a step; CausalReasoningVerifier checks ENTAILMENT ACROSS steps.
    Together they cover two orthogonal violation types.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier: verify_response(), segment_steps()
    - python/carnot/extraction/llm_extractor_v1.py — LLMAsExtractorV1.extract()
    - python/carnot/pipeline/hermes_v2_live_loop.py — HermesV2LiveLoop (Exp 641)
    - results/live_pairs_578.json — live pairs (read 5-10 incorrect responses to understand step structure)
    - results/experiment_633_hermes_adapter.json — hermes_recall=0.12 (baseline to beat)

    TASK: Implement CausalReasoningVerifier for step-to-step entailment checking.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-139 (CausalReasoningVerifier: step entailment checking across CoT boundaries),
       REQ-VERIFY-140 (CausalReasoningVerifier: AUC >= SymCodeVerifier on logical-incoherence test set),
       SCENARIO-VERIFY-183/184/185 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/causal_reasoning_verifier.py:
       a. CausalEntailmentResult dataclass: step_k_index (int), step_k_text (str),
          step_k1_text (str), entailment_score (float), causal_violation (bool),
          violation_type (str): 'arithmetic' | 'causal_break' | 'none'.
       b. CausalReasoningVerifier class:
          __init__(self, symcode: SymCodeVerifier, llm_extractor: LLMAsExtractorV1 | None = None):
            self.symcode = symcode
            self.extractor = llm_extractor
          _extract_numeric_conclusion(self, step_text: str) -> float | None:
            'Extract the numeric conclusion of a step (the final number stated).'
            import re
            numbers = re.findall(r'[-+]?\d+(?:\.\d+)?', step_text)
            return float(numbers[-1]) if numbers else None
          check_entailment(self, step_k: str, step_k1: str) -> CausalEntailmentResult:
            'Check if step_k causally justifies step_{k+1}.'
            First: run SymCodeVerifier on step_k. If arithmetic violation: type='arithmetic'.
            If no arithmetic violation:
              conclusion_k = _extract_numeric_conclusion(step_k)
              premise_k1 = _extract_numeric_conclusion(step_k1)
              If both are not None AND abs(conclusion_k - premise_k1) > 0.01:
                causal_violation = True, type='causal_break'
                entailment_score = abs(conclusion_k - premise_k1) / max(abs(conclusion_k), 1.0)
              Else:
                causal_violation = False, type='none', entailment_score=0.0
            Return CausalEntailmentResult(...)
          verify_response(self, response: str) -> list[CausalEntailmentResult]:
            'Verify all step-pair entailments in a response.'
            steps = self.symcode.segment_steps(response)
            results = []
            for i in range(len(steps) - 1):
                result = self.check_entailment(steps[i].text, steps[i+1].text)
                results.append(result)
            return results
          detection_score(self, response: str) -> float:
            'Return max entailment violation score across all step pairs.'
            results = self.verify_response(response)
            if not results: return 0.0
            return max(r.entailment_score for r in results)
          any_violation(self, response: str) -> bool:
            return self.detection_score(response) > 0.0
       c. Export CausalReasoningVerifier, CausalEntailmentResult from carnot.pipeline.
    4. Write scripts/experiment_642_causal_verifier.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(642, timeout_minutes=30).
       c. ExperimentTemplate(642, 'Causal Reasoning Verifier',
          'results/experiment_642_causal_verifier.json', requires_gpu=False).
       d. llm_caller = None (CI stub; causal checking uses regex, no LLM needed).
          verifier = SymCodeVerifier(llm_caller=None)
          causal = CausalReasoningVerifier(verifier)
       e. Load 25 incorrect + 10 correct from results/live_pairs_578.json.
       f. For each response:
          causal_results = causal.verify_response(response)
          causal_violated = any(r.causal_violation for r in causal_results)
       g. causal_tp = sum(causal_violated for r in incorrect)
          causal_fp = sum(causal_violated for r in correct)
          causal_recall = causal_tp / 25
          causal_fp_rate = causal_fp / 10
          n_causal_break = sum(r.violation_type == 'causal_break' for r in all_results)
          n_arithmetic = sum(r.violation_type == 'arithmetic' for r in all_results)
       h. Build artifact: schema='carnot.causal_verifier.v1',
          n_incorrect=25, n_correct=10,
          causal_tp=<int>, causal_fp=<int>,
          causal_recall=<float>, causal_fp_rate=<float>,
          n_causal_break=<int>, n_arithmetic=<int>,
          symcode_baseline=0.12,
          causal_improvement=(causal_recall > 0.12),
          honest_verdict='causal_improves' if causal_recall > 0.12
            else 'causal_no_improvement'.
       i. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_causal_reasoning_verifier.py (100% coverage).
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: _bmad/architecture.md (add CausalReasoningVerifier as orthogonal Tier 2.6 component),
       ops/conductor-log.md, ops/changelog.md.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp643-ensemble-recall-gate-v2
  milestone: 2026.04.49
  deliverable: results/experiment_643_ensemble_gate_v2.json
  title: 'Exp 643: Ensemble Recall Gate v2 — InterWhen OR HERMES v2 OR Causal (gate_open for VR #17)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exps 641 (HERMES v2 live loop) and 642 (CausalReasoningVerifier) provide
    two new detection signals beyond interwhen. This experiment computes the OR ensemble:
    any_violation = interwhen OR hermes_v2_live OR causal_check.
    Gate: combined_recall >= 0.30 (upgraded from 0.20 per .48 retro RETRO-070 action item:
    "Do NOT schedule attempt #17 until interwhen recall >= 30%").

    EXISTING CODE TO READ FIRST:
    - results/experiment_641_hermes_v2_live.json — hermes_v2_recall, hermes_v2_tp per question
    - results/experiment_642_causal_verifier.json — causal_recall, causal_tp per question
    - python/carnot/pipeline/interwhen_monitor.py — InterWhenMonitor
    - python/carnot/pipeline/hermes_v2_live_loop.py — HermesV2LiveLoop (Exp 641)
    - python/carnot/pipeline/causal_reasoning_verifier.py — CausalReasoningVerifier (Exp 642)
    - results/live_pairs_578.json or results/fover_corpus_v5_oracle.json — live pairs
    - results/experiment_629_interwhen_diagnostic.json — prior interwhen gate (gate_open=False)

    TASK: Compute OR ensemble recall, determine gate for VR #17.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-141 (EnsembleRecallGate: OR combination of InterWhen, HERMES v2, and Causal),
       REQ-VERIFY-142 (VR #17 gate: combined recall >= 0.30),
       SCENARIO-VERIFY-186/187 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Write scripts/experiment_643_ensemble_gate_v2.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(643, timeout_minutes=40).
       c. ExperimentTemplate(643, 'Ensemble Recall Gate v2',
          'results/experiment_643_ensemble_gate_v2.json', requires_gpu=False).
       d. Load Exp 641 and 642 results.
          hermes_v2_recall = exp641.get('hermes_v2_recall', 0.0)
          causal_recall = exp642.get('causal_recall', 0.0)
          hermes_v2_tp_indices = exp641.get('tp_question_indices', [])  (if available)
          causal_tp_indices = exp642.get('tp_question_indices', [])  (if available)
       e. Load 25 incorrect + 10 correct from live_pairs_578.json.
          llm_caller = None (CI stub).
          interwhen = InterWhenMonitor(SymCodeVerifier(None))
          causal = CausalReasoningVerifier(SymCodeVerifier(None))
          For each incorrect response:
            interwhen_hit = interwhen.any_violation(response)
            causal_hit = causal.any_violation(response)
            hermes_hit = True if question_index in hermes_v2_tp_indices else False
              (fallback: check hermes_v2_recall via Bernoulli sample if indices unavailable)
            ensemble_hit = interwhen_hit OR hermes_hit OR causal_hit
          For each correct response: compute ensemble FP.
          ensemble_tp = sum(ensemble_hit for incorrect)
          ensemble_fp = sum(ensemble_hit for correct)
          ensemble_recall = ensemble_tp / 25
          ensemble_fp_rate = ensemble_fp / 10
       f. gate_open = ensemble_recall >= 0.30
          gate_note = 'Exp 644 VR #17 UNBLOCKED' if gate_open else
            'Exp 644 VR #17 BLOCKED — combined recall below 0.30 threshold'
       g. Build artifact: schema='carnot.ensemble_gate_v2.v1',
          n_incorrect=25, n_correct=10,
