- id: exp624-kv260-vivado-v2
  milestone: 2026.04.47
  deliverable: results/experiment_624_kv260_vivado_v2.json
  title: 'Exp 624: KV260 Vivado Synthesis v2 + Synchronous Ising Python Simulation'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Exp 612 created\
    \ hardware/kv260/ising_sampler_v2.v — synchronous p-bit Ising RTL (arXiv 2604.01564,\
    \ ~50% area reduction vs v1). Exp 584 generated hardware/kv260/synth_ising.tcl.\
    \ Vivado has not been installed (blocked for multiple milestones). This experiment:\
    \ (1) Check if Vivado is NOW installed; if yes, synthesize v2. (2) Regardless:\
    \ implement a Python simulation of the synchronous Ising sampler to validate RTL\
    \ correctness before FPGA run (needed to confirm the synchronous update logic\
    \ is correct). The Python simulation IS the fallback deliverable if Vivado is\
    \ still not installed.\n\nEXISTING CODE TO READ FIRST:\n- hardware/kv260/ising_sampler_v2.v\
    \ — synchronous p-bit RTL (READ to understand the update logic: all spins update\
    \ on posedge clk)\n- hardware/kv260/ising_sampler_v1.v — original asynchronous\
    \ RTL (for comparison)\n- hardware/kv260/synth_ising.tcl — TCL synthesis script\n\
    - results/experiment_612_fact_e_pbit.json — synchronous_rtl_created=True\n- python/carnot/samplers/parallel_ising.py\
    \ — ParallelIsingSampler (Python Ising implementation)\n\nTASK: Vivado check +\
    \ Python simulation of synchronous Ising.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-SAMPLE-017 (synchronous Ising simulation: Python implementation matches\
    \ RTL spec), SCENARIO-SAMPLE-030/031 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Create python/carnot/samplers/synchronous_ising.py:\n   SynchronousIsingSampler\
    \ class:\n   a. __init__(self, n_spins: int, couplings: np.ndarray, biases: np.ndarray,\
    \ beta: float = 1.0):\n      Store params. Validate shapes.\n   b. step(self,\
    \ state: np.ndarray) -> np.ndarray:\n      'Synchronous update: ALL spins update\
    \ simultaneously (vs checkerboard in ParallelIsingSampler).'\n      For each spin\
    \ i: local_field = sum_j(J[i,j] * state[j]) + h[i]\n      P_up = sigmoid(2 *\
    \ beta * local_field)\n      new_state = np.where(np.random.rand(n_spins) < P_up,\
    \ +1, -1)  # all at once\n      return new_state  # NOT self-consistent within\
    \ step (true synchronous)\n   c. sample(self, n_steps: int, init_state: np.ndarray\
    \ | None = None) -> np.ndarray:\n      'Run synchronous Gibbs for n_steps. Return\
    \ final state.'\n   d. compare_with_async(self, n_steps: int, n_trials: int)\
    \ -> dict:\n      'Run synchronous vs async (ParallelIsingSampler checkerboard).\n\
    \       Return {sync_mean_energy, async_mean_energy, energy_gap, sync_converged}'\n\
    \   e. Export SynchronousIsingSampler from carnot.samplers.\n4. Write scripts/experiment_624_kv260_vivado_v2.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. ExperimentTimeoutWatchdog(624, timeout_minutes=35).\n\
    \   c. ExperimentTemplate(624, 'KV260 Vivado Synthesis v2 + Sync Ising Sim',\n\
    \      'results/experiment_624_kv260_vivado_v2.json', requires_gpu=False).\n \
    \  d. Vivado check: import subprocess; result = subprocess.run(['vivado', '-version'],\
    \ capture_output=True).\n      vivado_installed = result.returncode == 0.\n  \
    \ e. If vivado_installed:\n      subprocess.run(['vivado', '-mode', 'batch', '-source',\
    \ 'hardware/kv260/synth_ising.tcl'])\n      synthesis_succeeded = os.path.exists('output/carnot_ising_synth/carnot_ising.bit')\n\
    \   f. Python simulation test:\n      sampler = SynchronousIsingSampler(n_spins=10,\n\
    \        couplings=np.random.randn(10,10)*0.1, biases=np.zeros(10))\n      result\
    \ = sampler.compare_with_async(n_steps=100, n_trials=10)\n      simulation_validated\
    \ = result['sync_mean_energy'] is not None\n   g. Build artifact: schema='carnot.kv260_vivado_v2.v1',\n\
    \      vivado_installed=<bool>,\n      synthesis_succeeded=<bool if vivado_installed\
    \ else 'not_attempted'>,\n      simulation_validated=<bool>,\n      sync_mean_energy=<float>,\
    \ async_mean_energy=<float>, energy_gap=<float>,\n      honest_verdict='synthesis_and_simulation'\
    \ if (vivado_installed and synthesis_succeeded)\n        else 'simulation_only_vivado_blocked'\
    \ if simulation_validated\n        else 'both_blocked'.\n   h. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_synchronous_ising.py (100% coverage\
    \ on synchronous_ising.py).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\n7. Reconcile: research-hardware-wishlist.md (update Vivado status),\
    \ ops/conductor-log.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

