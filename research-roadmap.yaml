      telemetry. exp2383 implements a DIFFERENT continuous self-learning mechanism: online
      gradient updates to NSVIF extractor weights based on real constraint violation signals
      from exp2366 real-data evaluation. While exp2375 uses the fast/slow dual-weight trick,
      exp2383 uses the actual NSVIF extractor (a different module) and accumulates learning
