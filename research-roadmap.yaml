    Exp1394 deployed DVI v2 with AUROC delta 0.011458 using 59 fresh cases.
    Exp1395 then produced 1508 fresh verified cases and headline self-learning
    evidence. DVI v3 should train or update on the full 1508-case corpus and
    measure whether the delta improves. Use {project_root} as the project root
    and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - results/experiment_1394_dvi_v2_secl_combined.json
    - results/experiment_1395_fr11_self_learning_v5.json
    - python/carnot/pipeline/
    - python/carnot/verify/
    - openspec/capabilities/self-learning/spec.md
    - openspec/capabilities/verification/spec.md

    TASK:
    Train or update DVI v3 using the 1508 fresh verified cases, compare against
    DVI v2, and write a deployable checkpoint or honest blocked artifact.

    REQUIRED ARTIFACT FIELDS:
    - status
    - fresh_verified_cases_used
    - dvi_v2_auroc_delta_baseline
    - dvi_v3_auroc_delta
    - dvi_v3_deployed
    - dvi_v3_checkpoint_path
    - nonforgetting_rate
    - secl_ece_reduction_pct_preserved
    - tests_run
    - honest_verdict

    CONCRETE STEPS:
