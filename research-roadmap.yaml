       restore); acceptance_gate_positive (predeclared conjunction); residual_route_learning_
       completed (exact downstream field); gate_check_summary (blocked diagnostic);
       verifier_is_oracle (false, exact receipts are post-action authority); verdict_class (closed
       enum: positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict (terminal and row-supported).

