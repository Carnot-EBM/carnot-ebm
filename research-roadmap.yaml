    - grep -n "0\.0%\|HumanEval\|alpha_t\|α_t\|Seed.IQ\|seediq" docs/arxiv-paper/main.tex | head -30 2>&1
    - python3 -c "
      from scipy import stats
      # Clopper-Pearson CI for GRPO v2: n=25, k=0.085*25
      n, k = 25, int(0.085*25)
      lo, hi = stats.beta.ppf([0.025, 0.975], k+1, n-k+1)
      print(f'GRPO v2 n=25 CI: [{lo:.3f}, {hi:.3f}]')
      n, k = 47, int(0.1*47)
      lo, hi = stats.beta.ppf([0.025, 0.975], k+1, n-k+1)
      print(f'GRPO v4 n=47 CI: [{lo:.3f}, {hi:.3f}]')
      " 2>&1
