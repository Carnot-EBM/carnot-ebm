    The Carnot position paper v3 LaTeX bundle is complete at docs/arxiv-paper/ (main.tex +
    carnot.bib + 7 figures). The only missing step is pdflatex compilation and upload to arXiv.
    The submission target date is 2026-05-15. This is the MOST URGENT task in milestone .87.

    From exp1113 artifact: submission_ready_checklist =
      1. install texlive (or upload bundle to Overleaf / arXiv server)
      2. fill author identity in main.tex (currently placeholder)
      3. tar czvf carnot-arxiv-v3.tar.gz main.tex carnot.bib figures/
