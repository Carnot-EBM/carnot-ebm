        retire_if_same_verdict: true
      - experiment_id: exp3251-prompt-injection-v4-constraint-tax-manifest-v2
        verdict: "complete: v4_manifest_v2_ready=true"
        addressed_by: "The .301 manifest was a pre-label plan. This .303 manifest extends it to the full 15k execution ledger after .302 proved one shard can be labeled and trained."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      .302 labeled the first 2k prompt-injection v4 shard and trained a pilot KAN. The next top gap is full 15k corpus across shards plus repair and Garak gates. Do not rerun the failed monolithic exp3222 shape.

