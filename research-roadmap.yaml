       e. Log: task_id, allowed, reason.
    7. Create scripts/experiment_731_zombie_kill_preflight_v8.py:
       a. ExperimentTemplate(731) + ExperimentTimeoutWatchdog(731, timeout_minutes=30).
       b. Perform steps 3-6 above.
