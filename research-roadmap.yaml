    verdict: complete_null_static_source_support_no_registered_decision_benefit
    addressed_by: Diagnose selection support and replace fixed extreme thresholds with tune-once, certify-on-disjoint-data
      policies; preserve risk and coverage targets.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7426 passed its registered Brier and log-loss checks but failed the 25 percent certified-coverage floor. It tested extreme fixed thresholds and applied a 90-test correction. Diagnose empty selection separately from insufficient certification support. Reused RAGTruth data remain a protocol study, not fresh external confirmation.
    Work at {project_root}. Execution date {date}. Milestone 2026.09.652, phase 1.

