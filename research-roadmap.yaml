- id: exp6785-durable-row-checkpoint-contract
  title: Parent-owned durable row checkpoint and resume contract
  track: infrastructure
  priority: high
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 90
  per_unit_rows: true
  milestone: 2026.08.592
  deliverable: results/experiment_6785_durable_row_checkpoint_contract.json
  prompt: |
    CONTEXT:
    The long Exp6753 object-table run completed hundreds of generations, but its checkpoint lived
    inside a TemporaryDirectory. Interruption destroyed the only completed rows, so no scientific
    artifact survived. V592 comparisons need a parent-owned, atomic, manifest-bound checkpoint that
    survives worker teardown and resumes without duplicate rows. This task repairs evidence
    durability only. It must not rerun ARC, acquire a GPU, or make the old comparative claim.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/ops/known-issues.md, the Exp6753 checkpoint issue
    - {project_root}/scripts/experiments/experiment_6753_object_table_fetch_on_demand_ab.py
    - {project_root}/python/carnot/experiment_6753_object_table_fetch_on_demand_ab.py
    - {project_root}/python/carnot/memory/transactional_constraint_memory.py
    - {project_root}/scripts/experiment_template.py
    - {project_root}/results/experiment_6753_object_table_fetch_on_demand_ab.json
    - {project_root}/tests/python/test_experiment_6753_object_table_fetch_on_demand_ab.py

    TASK:
    Build a reusable parent-owned durable row checkpoint and prove interruption/resume semantics in
    a synthetic CPU probe. The checkpoint must be outside worker temporary directories, atomically
    replaced, bound to a frozen manifest hash, and safe against duplicate or conflicting row IDs.
    Do not execute the Exp6753 A/B.

    CONCRETE STEPS:
    0. PRECONDITIONS: require writable task-owned state under results/.checkpoints, atomic rename on
       the filesystem, and the source and known-issue records above. On failure write
       complete_blocked_durable_checkpoint with gate_check_summary, then stop.
    1. Confirm or add a narrow REQ-* anchor. Write focused tests for path ownership, atomic replace,
       fsync, manifest binding, duplicate suppression, conflict refusal, interruption, resume, final
       aggregation, and cleanup policy.
    2. Add a small reusable checkpoint utility under python/carnot. The parent chooses the path.
       Workers may append complete row envelopes only through atomic parent writes. Every envelope
       carries row ID, manifest hash, payload hash, attempt, start/end receipt, and status.
    3. Create a deterministic 24-row CPU probe. Interrupt after row 9 from a child process. Confirm
       the temporary worker directory is gone while the parent checkpoint and nine hashes remain.
    4. Start a fresh process, resume rows 10-24 exactly once, and aggregate a final artifact. Re-run
       resume to prove idempotence. Try a changed manifest and one conflicting row payload and prove
       both refuse without altering the good checkpoint.
    5. Keep the checkpoint after success until final artifact hash verification. Record an explicit
       cleanup receipt; do not broadly delete results or user files.
    6. Run focused tests, lint, spec coverage, adversarial verification, and row-consistency lint.
    7. REQUIRED ARTIFACT FIELDS: field_principles (one-line purpose for every required field);
       inference_substrate (local CPU processes and filesystem durability, no inference model);
       duration_s; random_seed; reproducibility_checksum; checkpoint_schema; checkpoint_path
       (task-owned path, never a TemporaryDirectory); frozen_manifest_hash; rows (one row per probe
       unit and interruption event); prefix_rows_preserved; fresh_process_resume_rows;
       duplicate_rows; conflicting_rows_refused; changed_manifest_refused; atomic_replace_receipts;
       fsync_receipts; cleanup_receipt; durable_checkpoint_ready (exact field reported by this
       task); gate_check_summary (failed check and observed value for any blocked_* verdict);
       verifier_is_oracle (false); verdict_class (closed enum: positive | circular_positive | null
       | blocked | disqualified | partial); and honest_verdict (terminal result; MUST start with
       complete: / complete_ / success: / success_ / passed: / passed_ / shipped: / shipped_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6785_durable_row_checkpoint_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6753-object-table-fetch-on-demand-ab
      verdict: 'complete_blocked_object_table_ab:cuda_device_available'
      addressed_by: 'This task does not rerun the live comparison or require CUDA; it isolates the later-diagnosed TemporaryDirectory checkpoint-loss mechanism in a synthetic CPU interruption test.'
      retire_if_same_verdict: true

- id: exp6786-constraint-dependency-hard-negative-fixture
  title: Exact constraint-dependency graph and hard-negative fixture
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.08.592
  deliverable: results/experiment_6786_constraint_dependency_hard_negative_fixture.json
  prompt: |
    CONTEXT:
    Exp6768 provides a cold-replayed 126-row targetable proof panel. Carnot also has declarative
    constraint-group metadata in the exact repair fixtures. AS2 preserves groups in a differentiable
    fixed-point operator. SymbolLKG treats rules and constraints as graph nodes. Neuro-symbolic PRM
    work motivates hard negatives that satisfy covered local checks while breaking semantic or
    cross-group dependencies. V592 first needs a frozen, exact-enumerable fixture with no proposal-
    time answer leakage.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md and {project_root}/_bmad/prd.md
    - {project_root}/research-references.md, V592 Planner Refresh
    - {project_root}/results/experiment_6768_targetable_proof_panel_expansion.json
    - {project_root}/python/carnot/experiment_5299_constraint_lns_solver_repair_fixture_v484.py
    - {project_root}/python/carnot/experiment_5304_kan_dynamic_abstraction_spotcheck_v484.py
    - {project_root}/openspec/capabilities/verification/spec.md
    - Primary sources arXiv:2603.18436, arXiv:2608.26836, and arXiv:2608.26329

    TASK:
    Build an exact-enumerable constraint-dependency graph fixture with topology-disjoint splits and
    dependency-breaking hard negatives. Preserve local group and cross-group semantics. Produce a
    frozen no-answer feature contract for the V592 soft fixed-point and online-routing branches.

    CONCRETE STEPS:
    0. PRECONDITIONS: require the Exp6768 artifact and its row hashes, the declarative constraint-
       group builders, an exact solver or enumeration path, and at least three topology families.
       On failure write complete_blocked_constraint_graph_fixture with gate_check_summary.
    1. Confirm or add narrow REQ-* anchors. Write focused tests for graph identity, group coverage,
       cross-group dependencies, exact enumeration, split disjointness, hard-negative semantics,
       feature denylist, and deterministic cold replay.
    2. Generate at least 96 unique bounded units over three or more topology families. Each unit
       contains variables, typed local groups, dependency edges, a satisfiable role or explicit
       contradiction role, exact assignments or certificate, and provenance to a source fixture.
    3. For every unit, create at least one counterfactual hard negative that passes its declared
       local checks but fails exactly one named cross-group dependency. Also include easy local-
       failure negatives so later audits can detect shortcut learning.
    4. Freeze train, development, and held-topology test splits by topology family, not by random
       row. Freeze graph serialization, group ordering, row IDs, difficulty strata, and seeds.
    5. Define proposal features that exclude exact assignments, exact-valid labels, future receipts,
       solver conflicts, oracle residuals, and post-action outcomes. Record the denylist explicitly.
    6. Cold-replay all exact labels and dependency classifications in a fresh process. Run focused
       tests, lint, spec coverage, adversarial verification, and row-consistency lint.
    7. REQUIRED ARTIFACT FIELDS: field_principles (one-line purpose for every required field);
       inference_substrate (CPU exact enumeration or symbolic solving, no LLM); duration_s;
       random_seed; reproducibility_checksum; source_artifact_hashes; frozen_manifest;
       topology_families; split_by_topology; feature_allowlist; feature_denylist; rows (one row per
       unit-negative pair with group and dependency receipts); exact_label_counts_by_split;
       local_pass_cross_dependency_fail_counts; easy_negative_counts; duplicate_rows;
       future_feature_violations; cold_replay_agreement; constraint_group_fixture_ready (exact field
       consumed by Exp6787 and Exp6790); gate_check_summary (failed check and observed value for any
       blocked_* verdict); verifier_is_oracle (false because the exact checker labels and audits but
       never proposes); verdict_class (closed enum: positive | circular_positive | null | blocked |
       disqualified | partial); and honest_verdict (terminal result; MUST start with complete: /
       complete_ / success: / success_ / passed: / passed_ / shipped: / shipped_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6786_constraint_dependency_hard_negative_fixture.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp5645-two-axis-tempering-hard-constraint-quality
      verdict: 'blocked: two-axis constraint-penalty exchange did not clear every preregistered quality promotion gate'
      addressed_by: 'This task builds an exact static graph fixture and no tempering or learned quality claim; cross-group negatives are cold-replayed before any proposer exists.'
      retire_if_same_verdict: true
    - experiment_id: exp5708-sota-exact-constraint-canary
      verdict: 'blocked: parse_failures'
      addressed_by: 'The fixture is generated from already parsed exact artifacts on CPU and makes no live SOTA generation or canary claim.'
