      CONCRETE STEPS
      0. PRECONDITIONS: verify both structured gates. Freeze raw, sidecar, vocabulary, parser-rule, budget, seed, and protected hashes.
      1. Add REQ-CONSTRAINT-6288 and scenarios before implementation. Update traceability.
      2. Implement the smallest lexical or syntax-aware adapter under python/carnot/. Never infer an atom that is not explicit in the raw output.
      3. Preserve positive, negative, unknown, rejected, and contradictory states separately. Fail closed on every ambiguous case.
      4. Check each accepted atom against the sealed sidecar only after extraction. The extractor cannot read answer labels while deciding.
      5. Run warm, blank, and random refinement and exact-completion controls with identical budgets.
      6. Add tests for negation scope, atom aliases, foreign atoms, contradictory evidence, empty output, zero-token rows, label leakage, and immutable inputs.
      7. Run focused tests and applicable e2e checks. Record git status after tests. Adversarial-verify the artifact.

      Run command: .venv/bin/python -m carnot.experiment_6288_partial_atom_evidence_adapter --date {date}
