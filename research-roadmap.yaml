    prompt: |
      CONTEXT:
      The research program requires at least one continuous self-learning experiment per milestone. Exp 2982 made FR-11 clean on independent metrics, while exp2983 stayed a pilot. This task must show whether verifier-backed traces can improve future verification without collapsing into the same utility metric.

      EXISTING CODE TO READ FIRST:
