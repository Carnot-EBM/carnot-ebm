    3. Recompute case-clustered intervals and the refinement/restructuring interaction. Compare every
       source headline with the cold value and classify discrepancies.
    4. Verify that only Exp6786 train rows reached fitting. Scan proposal features, checkpoints,
       thresholds, and decode inputs for Exp6799 IDs, source model labels, exact assignments, valid
       sets, held outcomes, and parser diagnosis.
    5. Run duplicate-case removal, model-ID permutation, transformation-label swap, solution-preserving
       surface relabel, group permutation, dependency-edge deletion, identical-arm, and injected
       aggregate contradiction controls.
    6. Confirm positive only if the row-derived gate and all authority/shortcut checks pass. Downgrade
       to null, partial, or disqualified as evidence requires.
    7. Run focused tests, ruff, spec coverage, adversarial verification, artifact convention audit,
       and verdict-row consistency lint.
    8. REQUIRED ARTIFACT FIELDS: field_principles; inference_substrate (independent CPU exact audit,
       no LLM); duration_s; random_seed; reproducibility_checksum; source_artifact_hashes;
       independent_evaluator_hash; row_grid_receipts; exact_recomputed_metrics;
       headline_differences; clustered_confidence_intervals; training_isolation_receipts;
       oracle_feature_violations; duplicate_case_checks; destructive_control_results;
       source_verdict_supported; rows (one per audited unit/control);
       model_output_fixed_point_audit_completed (exact field, true when the full audit completes);
       gate_check_summary; verifier_is_oracle (false); verdict_class (closed enum); and
       honest_verdict (terminal prefix).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6801_real_output_fixed_point_cold_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
