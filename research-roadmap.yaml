- id: exp6902-paraphrase-disjoint-prospective-relation-stream
  title: Paraphrase-disjoint prospective relation learning stream
  track: self-learning
  priority: high
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.09.604
  deliverable: results/experiment_6902_paraphrase_disjoint_prospective_relation_stream.json
  gated_on:
    - upstream: exp6901-independent-model-relation-qualification
      artifact_field: model_relation_qualification_ready_score
      op: '=='
      value: 1
    - upstream: exp6901-independent-model-relation-qualification
      artifact_field: qualified_model_relation_event_count
      op: '>='
      value: 90
  prompt: |
    CONTEXT:
