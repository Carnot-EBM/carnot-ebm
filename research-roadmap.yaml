        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5573 found six quality-matched CPU/CUDA pairs but CUDA was slower at small n. The ProbML 2026 cDLS workshop paper proposes continuous intermediates for discrete Langevin moves. Treat it as a hypothesis and run a local matched benchmark, not as performance authority. Today is {date}.

