    - python/carnot/samplers/parallel_ising.py — parallel_sample_states\n\
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline repair step\n\
    - python/carnot/core/energy.py — EnergyFunction protocol\n\
    \nTASK: Implement BoltzmannRepairBridge.\n\
    1. apply_env_autofix() FIRST.\n\
    2. Add REQ-REPAIR-014 (BoltzmannRepairBridge maps Ising ground-state spin configuration to\n\
    \   LLM repair direction via linear adapter), REQ-REPAIR-015 (repair direction reduces Ising\n\
    \   energy on held-out constraint instances), SCENARIO-REPAIR-028/029/030.\n\
    3. Write tests FIRST (100% coverage) for:\n\
    \   - RepairDirection(spin_config: jnp.ndarray, embedding_projection: jnp.ndarray,\n\
    \     energy_before: float, energy_after: float)\n\
    \   - LinearSpinAdapter(spin_dim: int, embed_dim: int):\n\
    \     Simple linear layer mapping spin ±1 vectors to embedding vectors\n\
    \     project(spins: jnp.ndarray) -> jnp.ndarray\n\
    \     train(spin_configs, target_embeddings, n_epochs=50) -> float (MSE loss)\n\
    \   - BoltzmannRepairBridge(ising_model, adapter: LinearSpinAdapter):\n\
