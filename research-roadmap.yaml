  - id: exp3873-build-in-distribution-error-rich-corpus
    operator_override: >
      2026-06-05 operator-outer-loop directive (standing): the .357 scissor was
      INCONCLUSIVE because PRMBench is OUT-OF-DISTRIBUTION for the math-bound
      ensemble (AUROC 0.55). This builds the IN-DISTRIBUTION error-rich corpus the
      moat measurement actually needs — new deliverable, scope-matches prior corpus
      builders only superficially.
    milestone: "2026.06.358"
    prior_failures:
      - experiment_id: exp3869-moat-scissor-v4-against-existing-corpus
        verdict: "complete: moat_scissor_v4_INCONCLUSIVE_reasoner_self_verify_auroc_and_carnot_ensemble_auroc"
        addressed_by: "exp3869 ran on PRMBench (carnot_ensemble_auroc=0.55, near chance — OOD). This task BUILDS a FoVer-family in-distribution corpus and ASSERTS carnot_ensemble_auroc>=0.65 ON the corpus before it is usable, so the next scissor cannot recur the OOD-degenerate-control failure."
        retire_if_same_verdict: true
    title: "BUILD an IN-DISTRIBUTION error-rich step-error corpus for the moat scissor: pool FoVer-family incorrect steps (fover_corpus_v3/v4/expanded) + generate/label additional math step-errors to reach >=150 gold-incorrect steps, balanced ~50/50, on which Carnot's k=15 ensemble DISCRIMINATES (AUROC>=0.65). Emit the gate field to a results/ artifact (NOT only a data/ file) so the downstream gate resolves."
    priority: critical
    track: research
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    requires_gpu: false
    estimated_wall_time_min: 40
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_3873_in_distribution_error_rich_corpus.json
    prompt: |
      CONTEXT. The verifier moat-at-scale scissor needs an error-rich corpus the
      math-bound ensemble can actually score. The .357 attempt failed because
      PRMBench is OOD (carnot_ensemble_auroc=0.55). FoVer is in-distribution but
      sparse in errors (fover_corpus_v4: 6548 items, only 114 incorrect). This task
      assembles a >=150-incorrect, ~balanced, IN-DISTRIBUTION corpus and PROVES the
      ensemble discriminates on it (AUROC>=0.65) before it is handed to the scissor.

      EXISTING CODE/DATA TO READ FIRST:
        - data/fover_corpus_v4.json (6548 items; 114 incorrect — keys question_id, step_text, label, confidence)
        - data/fover_corpus_v3.json (216 items; 114 incorrect, 102 correct)
        - data/fover_corpus_expanded.json (85 items; 38 incorrect)
        - data/fover_test.json (18 items)
        - scripts/experiment_2837_fover_memory_leakage_v3.py (the production k=15 ensemble scoring path)

      CONCRETE STEPS:
        0. PRECONDITIONS (blocked_<resource>+EXIT on fail):
           a. `import carnot.verify` succeeds (blocked_carnot_verify_import).
           b. The FoVer corpus files above exist and json-load (blocked_corpus_missing).
        1. POOL all FoVer-family incorrect steps (dedupe by question_id+step_text). Pool correct
           steps to balance ~50/50. If incorrect count < 150, GENERATE additional math step-errors
           in the SAME FoVer step-text style (perturb a correct step's arithmetic/logic, label
           incorrect) — clearly tag generated items `synthetic: true` and keep them <40% of errors.
        2. Score every item with the k=15 ensemble (the 2837 path) and compute corpus AUROC.
        3. If AUROC < 0.65, the pool is still too OOD/noisy — iterate (drop the lowest-confidence /
           hardest-to-score error axes) until AUROC>=0.65 OR report the best achievable with an
           honest INSUFFICIENT verdict. Write BOTH data/in_distribution_error_corpus_v1.json AND
           the results/ artifact carrying the gate field.

      REQUIRED ARTIFACT FIELDS:
        carnot_ensemble_auroc_on_corpus: BARE FLOAT  # gated_on field — emit a bare float, NOT a {value,principle} dict.
        n_incorrect_steps: {{ principle: "Set-B size budget — the residual scissor CI is meaningful only at >=100 errors (the 22-error FoVer-test failure mode)." }}
        n_total_items, frac_synthetic: {{ principle: "Provenance — keeps generated items a minority so the corpus stays a real measurement, not a synthetic artifact." }}
        corpus_path: {{ principle: "Where the scissor reads the corpus from (data/in_distribution_error_corpus_v1.json)." }}
        per_item_ensemble_scores_path: {{ principle: "Persist per-item ensemble scores so the scissor reuses them (the exp3863 lesson — missing per-item scores blocked complementarity)." }}
        preconditions_checked, random_seed, reproducibility_checksum, duration_s, inference_substrate:
          {{ principle: "Verifier-scoring methodology — CPU scoring against cached candidates, no GGUF/CUDA markers." }}

      FALSIFICATION GATE:
        - CORPUS_READY: n_incorrect_steps >= 150 AND carnot_ensemble_auroc_on_corpus >= 0.65.
          honest_verdict: `complete: in_distribution_corpus_READY_nerr<N>_auroc<a>_moat_scissor_can_run`
        - INSUFFICIENT: best achievable AUROC < 0.65 OR n_incorrect < 150.
          honest_verdict: `complete: in_distribution_corpus_INSUFFICIENT_best_auroc<a>_nerr<N>_ensemble_does_not_discriminate_in_band`
        honest_verdict MUST start with a terminal prefix or `blocked_<resource>`.

      DISCIPLINE: emit carnot_ensemble_auroc_on_corpus and n_incorrect_steps to the
      results/ artifact (NOT only the data/ file) so the downstream gated_on resolves
      (the .356 gate-resolution bug). Do NOT move frozen FoVer 0.9131.
      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_3873_in_distribution_error_rich_corpus.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

