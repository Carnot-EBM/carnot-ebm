      TASK:
      Build a held-out, solver-attested hard/soft decision benchmark with independent structure and solution receipts, and emit results/experiment_5746_exact_proposal_utility_benchmark.json.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify required Python/Rust environments, exact solver availability/versions, free RAM/disk, and absence of ID/row collisions with Exp5733/Exp5734. Emit a preflight receipt before dataset generation; bail honestly if a required exact solver is unavailable.
      1. Add or extend the relevant OpenSpec capability with REQ-* before implementation. Reuse existing validator APIs and put dataset-generation code in a maintained module or scripts/experiments, never the repository root.
      2. Deterministically generate at least 180 balanced held-out instances across finite-domain CSP, weighted MaxSAT, hard/soft packing, and finite-state planning, with train/dev/science separation and fixed seeds.
