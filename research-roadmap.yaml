- id: exp1353-triggered-certificate-v7-truncproof-sota
  milestone: 2026.04.105
  deliverable: results/experiment_1353_triggered_certificate_v7_truncproof_sota.json
  title: "Triggered Certificate Extraction v7 - TruncProof-Budgeted Dynamic Grammar on SOTA GGUF"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 90
  priority: critical
  requires_gpu: true
  gated_on:
    - upstream: exp1352-truncproof-xgrammar-certificate-completion-preflight
      artifact_field: sota_run_allowed
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1340-triggered-certificate-extraction-v6-sota-gguf-semantic-guard
      verdict: missing_terminal_artifact_after_gate_order_failure
      addressed_by: "Use an explicit preflight gate, terminal artifact discipline, and completion-budget evidence before running the replacement SOTA branch."
      retire_if_same_verdict: true
    - experiment_id: exp1325-triggered-certificate-extraction-v5-runtime-fixed-dccd-gbnf
      verdict: stale_in_progress_after_disk_quota_failures
      addressed_by: "Treat exp1325 as an environment/stale-artifact failure and rerun only with trigger-switched dynamic grammar and terminal blocker fields."
      retire_if_same_verdict: true
    - experiment_id: exp1312-triggered-certificate-extraction-dccd-gbnf
      verdict: certificate_parse_rate_0_71223_below_0_75_gate
      addressed_by: "Add trigger-before-constrain, dynamic grammar dispatch, UNKNOWN preservation, and TruncProof-style completion-budget checks to target the parse gate."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    This is the terminal replacement for missing exp1340. It must either
    produce SOTA certificate evidence or a complete terminal blocker artifact;
    a missing or bootstrap-only artifact is not acceptable. Use {project_root}
    as the project root and {date} as the run date in artifact metadata.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - research-references.md
    - results/experiment_1324_certificate_failure_taxonomy_formalizer_reality_check.json
    - results/experiment_1339_xgrammar2_tagdispatch_certificate_grammar_dryrun.json
    - results/experiment_1351_104_carryforward_artifact_integrity_audit.json
    - results/experiment_1352_truncproof_xgrammar_certificate_completion_preflight.json
    - python/carnot/
    - openspec/capabilities/pipeline/spec.md
    - openspec/capabilities/verification/spec.md

    TASK:
    Run a small, deterministic SOTA GGUF certificate extraction evaluation
    using trigger-before-constrain plus dynamic grammar and completion-budget
    checks. Every headline LLM generation in this task MUST use MODEL_SPECS
    from cached_sota_pair(gpu_indices=(0, 1)) when available. MODEL_SPECS must
    include at least one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models are allowed only as CPU smoke tests with
    headline_result_allowed=false.

    REQUIRED ARTIFACT FIELDS:
    - status
    - models_used
    - runtime_settings_used
    - completion_preflight_used
    - certificate_case_count
    - trigger_token_hit_rate
    - certificate_parse_rate
    - certificate_truthfulness_rate
    - parse_rate_delta_over_exp1312
    - unknown_preservation_rate
    - min_completion_budget_respected
    - terminal_blocker
    - headline_result_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1353_triggered_certificate_v7_truncproof_sota.json immediately with status="in_progress".
    2. Read exp1324, exp1339, exp1351, and exp1352 to inherit thresholds, failure taxonomy, dynamic grammar states, and completion-budget allowance.
    3. Resolve MODEL_SPECS through cached_sota_pair(gpu_indices=(0, 1)); record exact hf_id, quantization/path if available, GPU assignment, and any fallback.
    4. If cached_sota_pair() is unavailable or GPU health fails, run only a tiny legacy CPU smoke test, set headline_result_allowed=false, write terminal_blocker, and complete the artifact.
    5. Build a bounded certificate suite with SAT, UNSAT, UNKNOWN, and repair cases; keep it small enough for one milestone slot.
    6. Run trigger-before-constrain so the structural tag selects the branch grammar before the certificate body is constrained.
    7. Measure trigger_token_hit_rate, certificate_parse_rate, certificate_truthfulness_rate, unknown_preservation_rate, and min_completion_budget_respected.
    8. Compute parse_rate_delta_over_exp1312 against the exp1312 baseline of 0.71223.
    9. Set headline_result_allowed=true only if at least one mandated SOTA GGUF produced the measured certificate results.
    10. Write all required fields, status="complete", and honest_verdict even if blocked.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1353_triggered_certificate_v7_truncproof_sota.json')); print(d.get('certificate_case_count'), d.get('certificate_parse_rate'), d.get('certificate_truthfulness_rate'), d.get('headline_result_allowed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1354-logicskills-certificate-skill-split
  milestone: 2026.04.105
  deliverable: results/experiment_1354_logicskills_certificate_skill_split.json
  title: "LogicSkills Certificate Skill Split - Gated on Terminal Certificate Cases"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 35
  priority: high
  requires_gpu: false
  gated_on:
    - upstream: exp1353-triggered-certificate-v7-truncproof-sota
      artifact_field: certificate_case_count
      op: '>'
      value: 0
  prior_failures:
    - experiment_id: exp1341-certificate-failure-type-memory-policy-split
      verdict: diagnostic_no_universal_detector_claim_allowed
      addressed_by: "Use LogicSkills-style skill decomposition on terminal certificate cases instead of claiming a universal detector from local diagnostics."
      retire_if_same_verdict: true
    - experiment_id: exp1324-certificate-failure-taxonomy-formalizer-reality-check
      verdict: taxonomy_ready_but_no_sota_terminal_branch
      addressed_by: "Attach the taxonomy to fresh or terminal .105 certificate cases and measure symbolization, countermodel, and validity-specific rates."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    LogicSkills decomposes formal reasoning into symbolization, countermodel
    construction, and validity assessment. Carnot needs this split so a parse
    failure is not treated as one undifferentiated semantic failure. Use
    {project_root} as the project root and {date} as the run date in artifact
    metadata.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - results/experiment_1324_certificate_failure_taxonomy_formalizer_reality_check.json
    - results/experiment_1341_certificate_failure_type_memory_policy_split.json
    - results/experiment_1353_triggered_certificate_v7_truncproof_sota.json
    - python/carnot/
    - openspec/capabilities/verification/spec.md

    TASK:
    Split exp1353 certificate outcomes into LogicSkills-style formal skills.
    Do not run fresh LLM inference. Use local parser, verifier, and Z3-style
    checks where available.

    REQUIRED ARTIFACT FIELDS:
    - status
    - certificate_cases_used
    - symbolization_pass_rate
    - countermodel_pass_rate
    - validity_pass_rate
    - z3_verified_case_count
    - dominant_skill_gap
    - skill_split_claim_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1354_logicskills_certificate_skill_split.json immediately with status="in_progress".
    2. Load terminal exp1353 certificate cases and classify each case as parsed, semantically truth-preserving, UNKNOWN-preserving, or rejected.
    3. Map each failure to one of symbolization, countermodel, validity assessment, or unknown_preservation where the evidence supports it.
    4. Run local Z3 or existing verifier checks for cases that can be formalized; record z3_verified_case_count.
    5. Compute pass rates for symbolization, countermodel, and validity assessment.
    6. Set dominant_skill_gap to the largest measurable blocker.
    7. Set skill_split_claim_allowed=true only if at least one certificate case is classified with enough evidence to support the split.
    8. Write all required fields, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1354_logicskills_certificate_skill_split.json')); print(d.get('certificate_cases_used'), d.get('dominant_skill_gap'), d.get('skill_split_claim_allowed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

