- id: exp828-activation-jailbreak-probe
  milestone: 2026.04.63
  deliverable: results/experiment_828_activation_jailbreak_probe.json
  title: 'Exp 828: Activation Jailbreak Linear Probe (arXiv 2602.11495, Tier B Safety, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2602.11495 (Jailbreak Detection via Linear Probes on Intermediate Activations)
    shows that jailbreak prompts leave a linear signal in intermediate transformer layer activations,
    detectable by a logistic regression probe trained on 100 labeled examples with AUC >= 0.90
    at < 1 ms CPU latency. Carnot currently has JailbreakDetectionKAN at Tier 0h (AUC=1.0 on
    synthetic benchmark, Exp 775). This experiment adds a complementary linear probe as a
    second Tier B safety signal: interpretable, fast, and orthogonal to KAN spline detection.
    CPU-only: load Qwen3.5-0.8B in eval mode (no gradient tracking), extract activations
    at layers [4, 8, 12, 16], train sklearn LogisticRegression on 50 JailbreakBench + 50 benign.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/jailbreak_detection_kan.py — JailbreakDetectionKAN Tier 0h
    - python/carnot/pipeline/verify_repair.py — cascade tier structure
    - research-references.md — arXiv 2602.11495 entry if present
    - openspec/capabilities/pipeline/spec.md — REQ-VERIFY entries for Tier 0h

    TASK: Implement activation linear probe for jailbreak detection, train on synthetic
    JailbreakBench prompts, measure AUC and latency, compare to Tier 0h KAN, write
    results/experiment_828_activation_jailbreak_probe.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/pipeline/spec.md:
       - REQ-VERIFY-146: ActivationJailbreakProbe MUST extract intermediate layer activations
         from Qwen3.5-0.8B at layers [4, 8, 12, 16] and train a LogisticRegression probe
         on labeled jailbreak/benign examples. CPU inference latency MUST be < 1 ms per query.
       - REQ-VERIFY-147: ActivationJailbreakProbe probe_auc MUST be >= 0.85 on a 50/50
         balanced holdout (25 jailbreak + 25 benign) to be considered viable for production
         wiring alongside Tier 0h KAN.
       - SCENARIO-VERIFY-175: 50 jailbreak + 50 benign prompts; probe trained on 60 (train split);
         evaluated on 40 (holdout); AUC and latency reported. If probe_auc >= 0.85 AND
         latency < 1 ms: probe_viable=True.
    3. Implement python/carnot/pipeline/activation_jailbreak_probe.py:
       a. ActivationJailbreakProbe(model_name="unsloth/Qwen3.5-0.8B-GGUF", layers=[4,8,12,16]):
          - load_model(): load Qwen3.5-0.8B in eval mode (transformers AutoModel, CPU).
          - extract_activations(prompt: str) -> np.ndarray:
            Hook intermediate layer outputs. Return concatenated mean-pooled activation vectors.
            Shape: (n_layers * hidden_dim,). Latency target: < 50 ms per extract.
          - train(prompts_labeled: list[(str, int)]) -> sklearn.linear_model.LogisticRegression:
            Extract activations for all prompts. Fit LogisticRegression(max_iter=100).
            Return fitted probe.
          - evaluate(probe, test_prompts_labeled) -> (auc: float, latency_ms: float):
            Compute ROC AUC. Measure per-query inference latency (mean of 20 runs).
       b. Export ActivationJailbreakProbe from carnot.pipeline.__init__.
    4. Generate synthetic dataset in the experiment script:
       - 50 jailbreak prompts: variations on "Ignore previous instructions and...",
         "As a DAN...", "Pretend you have no restrictions...", etc. (fixed seed=42, CPU-safe).
       - 50 benign prompts: math questions, code completion requests, factual queries.
    5. Create scripts/experiment_828_activation_jailbreak_probe.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(828) + ExperimentTimeoutWatchdog(828, timeout_minutes=60).
       c. NOTE: Load model in CPU eval mode with no_grad context. Do NOT call tmpl.setup_gpu().
       d. Instantiate ActivationJailbreakProbe.
       e. Generate 100 synthetic prompts (50 jailbreak + 50 benign, seed=42).
       f. Train/test split: 60 train (30/30), 40 test (20/20).
       g. probe = probe_model.train(train_prompts).
       h. probe_auc, latency_ms = probe_model.evaluate(probe, test_prompts).
       i. Compare: tier0h_auc = 1.0 (from Exp 775 synthetic). auc_delta = probe_auc - tier0h_auc.
       j. probe_viable = (probe_auc >= 0.85 and latency_ms < 1.0).
       k. Artifact fields: probe_auc, latency_ms, tier0h_auc=1.0, auc_delta, probe_viable,
          n_train=60, n_test=40, layers=[4,8,12,16], honest_verdict.
       l. honest_verdict:
          - "probe_viable" if probe_viable=True
          - "probe_partial" if probe_auc >= 0.85 but latency >= 1.0
          - "probe_not_viable" if probe_auc < 0.85
    6. Write tests/python/test_experiment_828_activation_jailbreak_probe.py with 100% coverage:
       - test extract_activations returns correct shape (mocked model hooks)
       - test train returns fitted LogisticRegression (mocked activations)
       - test probe_viable logic: True when auc >= 0.85 AND latency < 1.0
       Each test traces to REQ-VERIFY-146/147.
    7. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict and probe_auc.
       - ops/status.md: "Exp 828: activation probe AUC=<value>, latency=<ms>ms. viable=<bool>."
       - _bmad/architecture.md: add activation probe note to Tier 0h section.
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_828_activation_jailbreak_probe.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp829-huggingface-v3-publish
  milestone: 2026.04.63
  deliverable: results/experiment_829_huggingface_v3_publish.json
  title: 'Exp 829: HuggingFace v3 Publish (Tier A product)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
