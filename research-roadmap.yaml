      TASK
      Run the clean local SOTA verifier rerun over exact context and constraint rows, using uncertainty and SMT coverage only as triage metadata while exact labels remain authoritative.

      CONCRETE STEPS
      1. Confirm exp3222 has `clean_rerun_allowed=true`; if not, write a blocked artifact without invoking an LLM.
      2. MODEL_SPECS for headline attempts must include at least one of:
         - `unsloth/Qwen3.6-35B-A3B-GGUF`
         - `unsloth/gemma-4-31B-it-GGUF`
