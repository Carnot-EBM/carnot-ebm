    TASK:
    1. Load SOSKANEnergyV3 and inspect its coefficient vectors:
       - How many KAN basis functions? How many coefficients per spline?
       - Compute current checkpoint size (bytes).
    2. Implement a simple centroid codebook compression:
       a. Collect all coefficient vectors across layers
       b. K-means cluster them (K=32 centroids, sklearn KMeans)
       c. Replace each coefficient vector with the index of its nearest centroid
       d. Store: centroids + indices (much smaller than original)
    3. Reconstruct: expand indices → centroids → compressed SOSKANEnergyV3
    4. Re-evaluate on 500 FoVer examples:
       - auroc_compressed (target: <= 0.02 below original 0.9902)
       - energy_correlation (pearson correlation between compressed and original energies)
    5. Report compression ratio: original_size_bytes / compressed_size_bytes

