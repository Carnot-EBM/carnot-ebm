        3. For each Phase 1 prong, extract current status:
             - PyPI: read latest pypi_status artifact (exp1930 or
               exp1987); record workflow_run_status + actionable_step.
             - HF mirror: exp1931 confirmed shipped to
               huggingface.co/Carnot-EBM/ThinkPRM-v3.
             - Fast-Slow codification: exp1929 confirmed shipped.
             - MCP/CLI docs: check results/experiment_1981*.json.
             - Independent Reproducer: check results/experiment_1982*.json.
        4. Write ops/phase-1-dashboard.md (operator-visible single-page;
           NO emojis; CLAUDE.md no-pruning if file already exists from
           exp1988 — APPEND a date-stamped update section).
        5. Update ops/status.md "What's Working" to LINK to the
           dashboard (do NOT replace prior content).

      REQUIRED ARTIFACT FIELDS:
