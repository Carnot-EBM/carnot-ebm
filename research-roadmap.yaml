  - id: exp3222-prompt-injection-kan-distill-v4-15k
    milestone: "2026.05.299"
    deliverable: "results/experiment_3222_prompt_injection_kan_distill_v4_15k.json"
    title: "Prompt-Injection KAN Distillation v4 — 15k Corpus + DeLong Non-Inferiority + Garak"
    priority: critical
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 60
    estimated_wall_time_min: 90
    track: "evidence"
    inference_substrate: "live_llm_inference"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp652-prompt-injection-kan
        verdict: "complete: v1 KAN trained, AUROC 0.7995"
        addressed_by: "v4 uses 15k stratified corpus with 2.5k paired test + 1k cross-dataset; the v1 corpus was insufficient for non-inferiority claims."
        retire_if_same_verdict: false
      - experiment_id: exp710-prompt-injection-kan-distill-v2
        verdict: "complete: distillation_improved_below_gate (AUROC 0.8747)"
        addressed_by: "v2 used 1091 training examples; v4 uses 10k training, which empirically broke the 0.90 gate in v3."
        retire_if_same_verdict: false
      - experiment_id: exp724-kan-distill-v3
        verdict: "complete: kan_gate_passed (AUROC 0.9078 on 3000 examples)"
        addressed_by: "v3 passed the publication gate but 600 test examples gives 95% CI +/-0.024 — too loose for non-inferiority at Delta=0.01. v4 uses 2.5k paired test (+/-0.012 CI) enabling a DeLong test the v3 sample size structurally cannot support."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      Operator authorization: 2026-05-26 + 2026-05-27 conversations. Priority
      was pending_count=10 in known-issues.md before this milestone pre-stage.
      The goal is to determine whether Carnot's prompt-injection KAN can
      statistically replace gpt-oss-safeguard:20b with non-inferiority at
      Delta=0.01 AUROC, on a defensibly-sized corpus.

      PRECONDITIONS
      0. Check BEFORE any inference call:
         a. ls ~/.cache/huggingface/hub/models--unsloth--gpt-oss-safeguard-20b-GGUF/ returns non-empty AND find ... -name 'gpt-oss-safeguard-20b-Q4_K_M.gguf' succeeds. If missing, write honest_verdict blocked_teacher_model_not_cached and exit.
         b. ls ~/.cache/huggingface/hub/models--Qwen--Qwen3.5-0.8B/ returns non-empty. If missing, blocked_student_model_not_cached.
         c. python -c "import torch; assert torch.cuda.is_available()" exit 0. If not, blocked_cuda_unavailable.
         d. command -v garak returns a path AND garak --version succeeds. If missing, blocked_garak_unavailable.
         e. huggingface-cli whoami returns non-anonymous user. If anonymous, blocked_huggingface_credentials.

      MODEL_SPECS
      - Teacher: unsloth/gpt-oss-safeguard-20b-GGUF (Q4_K_M) -- mandated SOTA
      - Student: Qwen/Qwen3.5-0.8B (activation source, hidden_dim=1024)
      - Classifier: 16-knot KAN (carry forward exp724 v3 architecture)

      CONCRETE STEPS

      1. CORPUS ASSEMBLY (target: 15,000 total examples)
         a. Train (10,000): HackAPrompt-2.0 + BIPIA + AdvBench + synthetic
            augmentation; stratify across ~10 attack categories (~1000/cat).
         b. Paired test (2,500): held-out subset, stratified, never in training.
            Both teacher AND student score these for DeLong.
         c. Cross-dataset (1,000): JailbreakBench-v2 OR prompts published
            after the teacher's training cutoff.
         d. Garak adversarial (1,500): garak --probes covering at least 10
            probe classes (PromptInjection, DAN family, EncodingAttack,
            GoodSide bypass, etc.) at 150/class.
         e. Emit corpus_composition with per-source/per-category/per-split counts.

      2. TEACHER LABELING
         Run gpt-oss-safeguard:20b on all 15k examples. Estimated ~75 min.

      3. STUDENT TRAINING
         Distill Qwen3.5-0.8B-activation -> 16-knot KAN on the 10k training
         subset. 100 epochs, AdamW, weight_decay=1e-4, seed-fixed.

      4. EVALUATION
         a. Student scores all four test splits (paired, cross-dataset, garak).
         b. Teacher scores the paired test (cached from step 2).
         c. Compute DeLong test on (student paired vs teacher paired) for
            non-inferiority at Delta=0.01.
         d. Compute cross_dataset_auroc.
         e. Compute per-Garak-probe AUROC (group by probe class); median +
            worst-case + full distribution.

      5. EMIT RESULTS with all REQUIRED ARTIFACT FIELDS. Set honest_verdict
         per the ACCEPTANCE GATES:
         - All three gates pass -> "complete: prompt_injection_v4_replacement_grade"
         - Gates 1+2 pass, gate 3 fails -> "complete: prompt_injection_v4_publication_grade_garak_partial"
         - Gate 1 passes, gate 2 fails -> "complete: prompt_injection_v4_overfit_to_training_distribution"
         - Gate 1 fails -> "complete: prompt_injection_v4_below_replacement_threshold"

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: str (principle: must start with complete:/success:/passed:/shipped_)
      - inference_substrate: "live_llm_inference"
      - random_seed: int (principle: determinism is the precondition for reproducibility)
      - reproducibility_checksum: str (principle: catches silent corpus/teacher-version drift)
      - model_specs: dict (principle: must name teacher GGUF + Q-level + sha256, student model + D)
      - preconditions_checked: list (principle: catches the silent-resource-missing fabrication mode)
      - duration_s: float (principle: expected ~5400s+; sub-60s is DURATION_TOO_SHORT)
      - corpus_composition: dict (principle: sample-size claim requires per-category enumeration)
      - auroc_paired_test: float (principle: 95% DeLong CI computed; 2.5k sample gives ~+/-0.012)
      - delong_pvalue_vs_teacher: float (principle: paired non-inferiority at Delta=0.01)
      - cross_dataset_auroc: float (principle: OOD generalization indicator)
      - garak_auroc_per_probe: dict (principle: per-probe class + median + worst-case)

      ACCEPTANCE GATES:
      - condition: "auroc_paired_test >= 0.90 AND delong_pvalue_vs_teacher < 0.05"
        principle: "G1 replacement-grade."
      - condition: "cross_dataset_auroc >= 0.85"
        principle: "G2 OOD floor."
      - condition: "garak_auroc_per_probe.worst_case >= 0.75"
        principle: "G3 adversarial floor."

  - id: exp3223-capstone-v299-single-focus
