    EXISTING ARTIFACTS TO READ:
      {project_root}/results/experiment_2422_hive_full_v4.json (HIVE v4 AUROC)
      {project_root}/results/experiment_2423_hierarchical_logcons_v2.json (LogCons AUROC)
      {project_root}/results/experiment_2424_halt_rag_nli_v2.json (HALT-RAG AUROC)
      {project_root}/results/experiment_2425_fr11_nsvif_online_v4.json (FR-11 result)
      {project_root}/results/experiment_2426_fst_constrained_mcmc_v2.json (MH acceptance)
      {project_root}/results/experiment_2427_kv260_yosys_v4.json (synthesis result)
      {project_root}/results/experiment_2428_kinetic_langevin_v4.json (KL delta)
      {project_root}/results/experiment_2429_dikin_langevin_v2.json (Dikin KL delta)
      {project_root}/results/experiment_2430_de_psgld_v2.json (DE-PSGLD KL delta)
      {project_root}/results/experiment_2431_phase1_ship_gate_v4.json (ship gate)
      {project_root}/results/experiment_2404_capstone.json (.233 capstone baseline)
      {project_root}/results/experiment_2395_fregelogic.json (FregeLogic 0.8831 baseline)

    TASK: Compile paper-v6 results table. Synthesize .235 key findings. Update ops/status.md.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. At least exp2422 artifact must exist (gate condition):
            ls {project_root}/results/experiment_2422_hive_full_v4.json
            If missing: write honest_verdict blocked_no_auroc_artifacts and exit.

      1. Read all available artifacts. Extract:
