      Compare frozen-ledger, MUS/contradiction-only, and query-driven constraint-acquisition arms on the sealed prospective stream, enforce retention and rollback, and emit results/experiment_5773_prospective_constraint_acquisition_ab.json.

      CONCRETE STEPS:
      0. PRECONDITIONS: enforce all Exp5772 gates; verify upstream artifact/row hashes, exact validators, chronological ordering, disjoint development/science sessions, typed template-library hash, random seeds, and free RAM/disk. Bail if any raw row, protected fact, candidate set, label, or split differs from Exp5772.
