    \ estimated 5% wall time savings from batching enforcement alone. This experiment\
    \ implements BatchingEnforcementAudit: scans harness scripts for sequential question\
    \ loops without BatchedInferenceRunner and flags them. Also enforces standard batch\
    \ sizes: batch_size=8 for GSM8K (longer prompts, lower throughput), batch_size=4\
    \ for HumanEval (code generation, variable length).\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n- python/carnot/pipeline/deliverable_guard.py\
    \ — DeliverableGuard (Exp 462)\n- scripts/experiment_template.py — BatchedInferenceRunner\n\
    - scripts/experiment_476_live_100q_precision_v4.py — LongRunBenchmarkExecutor\
    \ usage\n\nTASK: Implement BatchingEnforcementAudit and document batch size standards.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3. Add\
    \ REQ-INFRA-047 (BatchingEnforcementAudit scans scripts for sequential question\
    \ loops without BatchedInferenceRunner and reports violations), REQ-INFRA-048 (standard\
