       and quarantine-update arms from their declared initial state and order.
    3. Recompute exact decision accuracy, asymmetric error cost, coverage, abstention, headroom,
       update benefit, retention, harmful writes, support-at-k, and at-least-one-correct support.
    4. Compare pass-at-one improvement with future support. A better current error rate cannot hide a
       smaller set of events with any reachable correct decision.
    5. Re-run poison, delayed correction, tombstone, capacity, restart, and byte-exact rollback tests
       without importing Exp6903 aggregates.
    6. Set `sealed_self_learning_audit_complete_score=1` only when all rows and aggregates replay.
       Set `independent_self_learning_utility_score=1` only when the bounded-update arm beats
       read-only in every order and passes all safety, retention, and support gates.
    7. Because sealed exact outcomes are oracle authority, use `circular_positive` for a passing
       verdict and never use `positive`. Preserve null and disqualified outcomes honestly.
