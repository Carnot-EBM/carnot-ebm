milestone: 2026.09.665
milestone_title: Schema-aligned evidence, retained decision learning, and direct native service calls
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp7615-contract-methods
  title: Bind fourteen tasks and qualify schema-constrained evidence methods
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 30
  per_unit_rows: true
  milestone: 2026.09.665
  deliverable: results/experiment_7615_v665_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  agent_type: claude
  model: opus
  prior_failures:
  - experiment_id: exp7614-capstone
    verdict: complete_blocked_required_v664_external_evidence
    addressed_by: Routine new-milestone contract records missing producers without retrying the prior aggregate benefit
      claim.
    retire_if_same_verdict: true
  operator_override: '2026-05-29 standing operator directive: routine milestone transition accounting, not reuse of the
    exp7614 failed scientific scope.'
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.665. V664 ended with valid protocol/lifecycle fixtures, eight real but parser-invalid generations, an unmeasured evidence chain, a blocked ARC protocol, and a service attribution null. Archive lag does not erase the terminal capstone.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/research-roadmap-next.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7614_v664_capstone.json
    - {project_root}/python/carnot/experiment_7601_v664_contract_methods.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/publication_gate.py
    - {project_root}/research-references.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7615_v665_contract_methods.json. Use scripts/experiments/experiment_7615_v665_contract_methods.py as a thin CLI over reusable behavior in python/carnot/experiment_7615_v665_contract_methods.py; add tests/python/test_experiment_7615_v665_contract_methods.py only for changed behavior. Reuse existing receipt, validation and reduction helpers.

    Execution: inference_substrate_class=aggregation; MODEL_SPECS=[].

    CONCRETE STEPS:
    1. PRECONDITIONS: Immediately emit a flushed progress line. Resolve {project_root} absolutely. Authenticate named input files and declared tool versions before work. Verify the relevant capability spec has REQ-* requirements. New deliverables are outputs, never preconditions. Missing external prerequisites produce complete_blocked_<reason>, verdict_class=blocked and gate_check_summary. Include check, upstream, path, exact field, operator, expected and observed values. Do not retry unchanged external blocks as partial.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER each model load, generation, benchmark and subprocess that can take minutes. Inside long loops print completed units and elapsed monotonic time every 60 seconds. Stream subprocess output. During long synchronous calls use an owned heartbeat worker to print truthful pending status every 60 seconds. Keep EVERY gap below 600 seconds. Silent tasks can die at 1200 seconds despite a 4800-second cap. Checkpoint completed units. Terminate only owned processes.

    3. Bound EVERY tool call. Write any file over about 200 lines in several tool calls of about 100-150 lines. Emit a progress message BETWEEN calls. Split large reads and validation runs. Put throwaway probes in /tmp, experiment CLIs in scripts/experiments, and tests in tests/python. Reuse existing modules; do not copy thousands of lines of reporting scaffolding.

    4. Before implementation, add the task REQ-* and meaningful SCENARIO-* entries to its capability spec. Write failing tests for new behavior first. Preserve historical artifacts and unrelated working-tree changes. Keep generator weights and production defaults unchanged.

    5. Add REQ-REPORT-7615. Select staged or activated authority by milestone identity 2026.09.665, never assume the staging file still exists. Compare exactly 14 ordered task IDs exp7615-exp7628, titles, phases, paths, substrate classes and complete structured gates with the design contract. Reuse parsing helpers. Exercise missing, reordered, altered-path, misspelled-field and consumed-staging mutations. Do not activate a roadmap.

    6. Write docs/research-notes/v665-method-map.md. Read primary JSONSchemaBench coverage/quality/speed methods, EAEV evidence factors and Proper Calibeating assumptions. Map them to the schema pilot, evidence controls and delayed-loss experiment. Record that this local learner is not a reproduction of the papers or their theorem. Update research-studying.md with verified methods and inaccessible sources.

    7. Preserve fourteen V664 terminal dispositions, including pre-gate artifacts versus absent producers. Run schema, gate, exclusion, harness-fit, ARC-floor and overdue-priority guards plus fixed publication G1-G4. This contract gates no science. E2E: staged/activated authority selection and the five negative mutations.

    8. Freeze an affected-file validation manifest. Run scoped pytest with -n 0 -o addopts= and a private --basetemp. Require 100 percent coverage of changed behavior using a command-local COVERAGE_FILE. Run scoped Ruff check/format, changed-module mypy, and scripts/check_spec_coverage.py on affected tests. For Rust changes run scoped cargo test, fmt and clippy. Keep PYTHONPATH pinned to this worktree. Report unrelated repository debt separately; never require the whole repository suite as a model precondition.

    9. Run the declared entrypoint and fresh-process cold reduction on private paths. Run the task-specific end-to-end checks stated above. Save commands, exits, worktree and log hashes. Independently recompute comparative metrics from rows. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Persist terminal reader outcomes before atomic publication. A failed benefit gate cannot support positive. Exact oracle fixtures use circular_positive; protocol readiness uses null.

    10. Reconcile openspec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Apply each prior-failure retirement condition to its exact scope. Environmental or custody blocks do not retire the scientific hypothesis. Preserve all old verdicts. No external publication, submission, purchase, default promotion or generator training. Do not modify research-roadmap.yaml.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: Use a complete_ terminal prefix. Completion is distinct from scientific benefit.
    - verdict_class: Exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished work owned by this task; external blocks use blocked.
    - flagged_adversarial: Persist the terminal reader result. Flagged evidence never opens a downstream gate.
    - gate_check_summary: Every blocked verdict names the failed check, upstream, path, exact field, operator, expected and observed value.
    - acceptance_gate_results: Separate validity, readiness, benefit, retention and freshness. Give every gate its condition and principle.
    - rows: Keep each independent unit and arm, absolute metrics, numerators, denominators, seed, direction, censoring and raw provenance.
    - sample_size_budget: Report intended, observed, excluded and censored independent units. Seeds, views and replays never multiply independent samples.
    - preconditions_checked: Record actual resource and input checks before execution; unavailable inputs cannot become fabricated work.
    - inference_substrate: Describe current execution. Historical GPU evidence is not a current model invocation.
    - inference_substrate_class: Record planned and actual class separately. Bounded generation has a 10s floor, full generation 60s, load without generation 2s. Never pad runtime. This task plans aggregation.
    - MODEL_SPECS: Every current LLM call includes unsloth/Qwen3.8-27B-GGUF; no-model work uses [] and names historical identity separately. Planned value: [].
    - model_invoked: True if any real model load or generation is attempted; false for pure reduction, including historical GPU rows.
    - execution_venue: Name actual host, GPU UUID or physical device. Historical board receipts are not current board execution.
    - phase_spans: Disjoint measured stages, unit counters, current pending operations and checkpoint positions.
    - invocation_counts: Count current loads, forwards, generations and tokens separately from inherited evidence.
    - duration_s: Measure monotonic elapsed time and phase spans; no inherited or invented duration.
    - random_seed: Persist each stochastic-stage seed and its purpose.
    - reproducibility_checksum: Bind immutable inputs, configuration and reductions.
    - source_artifact_hashes: Distinguish actual producers, pre-gate receipts and missing artifacts.
    - validation_receipts: Record actual command exits and log hashes; retain the final independent readers.
    - verifier_is_oracle: An executable correctness oracle or exact fixture cannot establish an oracle-distinct learned advantage.
    - field_principles: Echo the governing principle beside every field and acceptance gate.
    - contract_ready_score: 1 only for exact fourteen-task parity and clean guard checks.
    - task_contract_rows: All fourteen ordered dispositions and new contract rows.
    - method_map_path: docs/research-notes/v665-method-map.md
    - publication_gates: Unchanged G1-G4; distinguish old FoVer eligibility from new evidence.

    Run command: cd {project_root} && PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7615_v665_contract_methods.py --date {date} --output results/experiment_7615_v665_contract_methods.json
    Do NOT push. Do NOT modify scripts/research_conductor.py.
