- id: exp669-prompt-injection-rescue
  milestone: 2026.04.51
  deliverable: results/experiment_669_prompt_injection_rescue.json
  title: 'Exp 669: Prompt-Injection KAN Rescue v2 — Reduced Corpus + Atomic Write Fix (5th Attempt)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Four prior attempts at the Prompt-Injection safety KAN classifier
    (Exps 387, 393, 407, 416, 652) all failed to produce a complete result file.
    Exp 652 DID run (results/experiment_652_training_curve.json shows 300 epochs with
    converging loss), but the final results JSON was never written — likely because an
    exception in the evaluation phase occurred after training but before AtomicResultWriter.

    Root causes to fix:
    1. Corpus too large: 2000 prompts × gpt-oss-safeguard-20b GGUF ≈ slow teacher inference.
       Fix: reduce to 100 benign + 100 injection (200 total). Teacher already cached.
    2. Final write not guaranteed: exception after training = no result file.
       Fix: write a partial result JSON AFTER each phase (corpus built, model trained,
       evaluated) using AtomicResultWriter. Even if evaluation fails, corpus and training
       results are preserved.
    3. Enforced honest_verdict enum prevents "partial_forever" pattern.

    EXISTING CODE TO READ FIRST:
    - openspec/change-proposals/prompt-injection-ebm.md — full design doc.
    - openspec/capabilities/safety/spec.md — REQ-SAFE-007/008/009.
    - python/carnot/models/compliance_checker.py — KAN pattern to reuse.
    - python/carnot/models/kan.py — KAN forward pass (DO NOT MODIFY).
    - python/carnot/inference/sota_models.py — resolve_cached_gguf().
    - python/carnot/pipeline/atomic_writer.py — AtomicResultWriter.
    - results/experiment_652_training_curve.json — prior training did converge.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Build prompt-injection classifier with 100+100 corpus and atomic phase writes.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Preflight (< 2 min): verify gpt-oss-safeguard-20b GGUF is cached.
       If missing: write blocked artifact and exit 0. Do not continue.
    3. Corpus build (20 min budget):
       - Benign: 100 GSM8K train prompts (first 100).
       - Injection: 100 from JailbreakBench (or synthetic OWASP seeds if unavailable).
       - Run teacher on each (50 benign + 50 injection subset if teacher is slow).
       - Cache (model_hash, prompt_hash) -> label to data/prompt_injection_distill/.
       - WRITE phase-1 partial artifact via AtomicResultWriter after corpus build.
    4. KAN training (15 min budget):
       - Feature encoder: encode_prompt_injection(text) -> (max_features,) JAX array.
       - Student KAN: 2 hidden layers, 32 units each (vs 64 in prior attempt — smaller).
       - Loss: contrastive margin (benign -> low, injection -> high).
       - Optimizer: Adam 1e-3, 100 epochs (vs 300 — faster).
       - 80/20 train/test split.
       - WRITE phase-2 partial artifact via AtomicResultWriter after training.
    5. Evaluation (5 min):
       - Compute AUROC on held-out set.
       - auroc >= 0.90: honest_verdict="auroc_met"
       - 0.70 <= auroc < 0.90: honest_verdict="auroc_partial"
       - auroc < 0.70: honest_verdict="auroc_below_threshold"
    6. Latency check (3 min, non-blocking): 1000 CPU calls, record median_ms.
    7. Save weights to python/carnot/models/prompt_injection_kan.py.
    8. Write final result to results/experiment_669_prompt_injection_rescue.json.
       honest_verdict must be one of the 5-value enum; no "partial_forever".
    9. Write tests/python/test_prompt_injection_rescue.py:
       - test honest_verdict is in the 5-value enum.
       - test feature encoder determinism.
       - test AtomicResultWriter phase writes.
       Each test traces to REQ-SAFE-007/008/009.
    10. tmpl.assert_deliverable_written() as final line.

    CONSTRAINTS:
    - ExperimentTimeoutWatchdog(669, timeout_minutes=60).
    - Call apply_env_autofix() inside main() before any GPU imports.
    - Write phase-1 partial artifact BEFORE any ML training begins.
    - Write phase-2 partial artifact BEFORE evaluation begins.
    - Final result file must be written even if evaluation raises an exception.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp670-jepa-cascade-deploy
