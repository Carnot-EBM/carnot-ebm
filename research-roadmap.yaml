  prompt: "CONTEXT: You are producing the milestone 2026.05.245 capstone artifact. Synthesize experiment artifacts (exp2543-exp2553) into a single coherent milestone report.\n\nWHY requires_claude: true — Multi-artifact synthesis across 11 files + cross-phase reasoning. Must determine: (1) whether Phase 4 Option B was executed (exp2544), (2) whether arxiv_ready flipped True (exp2553), (3) ensemble v7b AUROC relative to 0.9750 baseline, (4) hardware terminal state progress, (5) JEPA discrimination improvement. Open-ended cross-phase judgment. Meets all 3 positive criteria per CLAUDE.md.\n\nNO HARD GATE: This experiment has no acceptance gate. The capstone reflects reality.\n\nFILES TO READ (in order):\n  {project_root}/results/experiment_2543_archive.json\n  {project_root}/results/experiment_2544_phase4_option_b.json\n  {project_root}/results/experiment_2545_ising_verifier_impl.json\n  {project_root}/results/experiment_2546_ensemble_v7b.json\n  {project_root}/results/experiment_2547_adaptive_conformal_v2.json\n  {project_root}/results/experiment_2548_real_corpus_validation.json\n  {project_root}/results/experiment_2549_tier0v_hallufield.json\n  {project_root}/results/experiment_2550_jepa_real_eval.json\n  {project_root}/results/experiment_2551_hardware_flash.json\n  {project_root}/results/experiment_2552_paper_writethrough.json\n  {project_root}/results/experiment_2553_arxiv_package_v3.json\n  {project_root}/openspec/change-proposals/research-roadmap-v245.md\n\nREQUIRED SYNTHESIS FIELDS:\n  1. n_experiments_completed: count of exp2543-exp2553 with terminal honest_verdict\n  2. best_245_auroc: best AUROC from ensemble v7b (exp2546) or adaptive conformal (exp2547),\n     whichever is higher. If neither improved, carry forward 0.9750.\n  3. auroc_adversarially_verified: True if best_245_auroc confirmed across >= 3 seeds without adversarial flags.\n  4. phase4_final_status: 'retired_negative_option_b' if exp2544 produced phase4_honest_negative_documented=True;\n     'blocked_precondition' if exp2544 failed; 'validated_clean' if somehow Phase 4 validated.\n  5. arxiv_ready: True ONLY if exp2553.arxiv_ready=True. Do not infer or soften — read the value directly.\n  6. operator_recommendation: 'submit_now' if arxiv_ready=True; 'review_§4_first' if phase4_section unclear;\n     'fix_latex' if latex_compile_success=False; 'request_operator_decision' if ambiguous.\n  7. hardware_terminal_states: dict of {{gatemate, kv260}} with current state after exp2551.\n  8. jepa_discrimination_improved: True if exp2550.fast_path_rate in [0.30, 0.80].\n  9. top_3_successes: three most impactful positive findings in .245.\n  10. top_3_gaps_for_246: three most critical unresolved issues entering .246.\n  11. honest_verdict: 'complete: best_245_auroc=X.XXXX; phase4_final_status=Y; arxiv_ready=True/False'\n\nHONESTY PROTOCOL:\n  - arxiv_ready: Read from exp2553. Do NOT set to True if exp2553 artifact is missing or shows False.\n  - phase4_final_status: Set to 'retired_negative_option_b' only if exp2544 artifact confirms §4 expansion.\n  - AUROC: carry forward 0.9750 if ensemble v7b did not improve or did not run.\n  - Execution gap: if more than 3 of 11 tasks (exp2543-exp2553) produced no artifacts, flag\n    EXECUTION_LAYER_GAP in process_flags with root-cause hypothesis.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. Must start with complete:.\"\n  - best_245_auroc:\n      principle: \"Cite-safe headline AUROC. Carry-forward 0.9750 if ensemble v7b unavailable.\"\n  - phase4_final_status:\n      principle: \"Terminal Phase 4 determination — either retired_negative_option_b (Option B executed) or blocked_precondition (§4 expansion failed).\"\n  - arxiv_ready:\n      principle: \"True only if exp2553.arxiv_ready=True. This is the PRIMARY milestone success criterion. Directly read from exp2553.\"\n  - operator_recommendation:\n      principle: \"submit_now / review_§4_first / fix_latex / request_operator_decision.\"\n  - external_baselines:\n      principle: \"HIVE peer (0.9236, arXiv:2604.26139) carried forward for continuous gap tracking.\"\n  - kv260_status:\n      principle: \"Hardware continuity tracking — reflect exp2551 outcome.\"\n  - gatemate_status:\n      principle: \"Hardware continuity tracking — reflect exp2551 outcome.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

