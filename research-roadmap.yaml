        principle: "Confirmed TERMINAL in .247 — records graduation for ops/status.md."
      kv260_terminal:
        type: bool
        principle: "KV260 graduation status after exp2590."
      safety_classifier_viable:
        type: bool
        principle: "Product track gate for Tier B."
      fr11_online_integrated:
        type: bool
        principle: "FR-11 Tier 3 completion status."
      ipfs_cid:
        type: str
        description: "CID from exp2586 if available, else null"
        principle: "Rule 3 compliance documentation."
      operator_recommendation:
        type: str
        principle: "Human-readable forward guidance — primary deliverable of the capstone."

    acceptance_gates: []  # NO HARD GATE per convention


