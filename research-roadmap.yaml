- id: exp2497-phase4-spilled-energy-cpu-test
  title: 'Phase 1: Phase 4 Spilled Energy Alternative CPU Test (arXiv:2602.18671) -- Logit-Derived EBM Energy vs Hallucination Labels'
  milestone: 2026.05.241
  deliverable: results/experiment_2497_phase4_spilled_energy.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  prior_failures:
  - experiment_id: exp2486-phase4-arm-ebm-bijection-test
    verdict: 'complete: pearson_r=0.108, phase4_validated=False'
    addressed_by: "exp2486 tested the ARM-EBM bijection using SemanticEnergy (a sentence-embedding
      cosine-based score) vs logprob as the Carnot energy proxy — pearson_r=0.108, noise floor.
      exp2497 tests a DIFFERENT energy metric: spilled_energy from arXiv:2602.18671, which measures
      the probability mass distributed to non-predicted tokens during decoding
      (spilled_energy = sum of probabilities outside the argmax token, normalized by response length).
      This is a logit-distribution metric, not a logprob metric — structurally distinct from the
      ARM-EBM test. pearson_r reported in the paper: 0.31-0.47 on hallucination benchmarks."
    retire_if_same_verdict: true
  prompt: "CONTEXT: Phase 4 empirical validation is blocked (arXiv hold). Two attempts failed:\n  -
    exp2474: ODAR routing, pearson_r=0.19\n  - exp2486: ARM-EBM bijection (SemanticEnergy vs
    logprob), pearson_r=0.108\narXiv:2602.18671 'Spilled Energy in LLMs' reports pearson_r
    0.31-0.47 between spilled_energy and hallucination labels across LLaMA/Mistral/Gemma.\nspilled_energy
    = total probability mass NOT assigned to the predicted token, normalized by response length.\n
    This is training-free and computable from per-token logits in the existing telemetry manifest.\n\nIMPORTANT:
    This is a CPU-ONLY experiment. No new GGUF inference needed. The telemetry manifest\nalready
    contains per-token logprob fields from prior inference runs.\n\nEXISTING CODE TO READ FIRST:\n
    \ {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl (first 10 lines
    — check for logprob/logit fields)\n  {project_root}/results/experiment_2486_phase4_arm_ebm_bijection.json
    (prior failure details — check available_logprob_fields)\n\nTASK: Compute spilled_energy and
    marginalized_energy from existing telemetry; test Phase 4 correlation.\n\nCONCRETE STEPS:\n
    \ 0. PRECONDITIONS:\n     a. Telemetry manifest present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n
    \    b. scipy importable:\n        {project_root}/.venv/bin/python -c \"import scipy;
    print(scipy.__version__)\"\n     c. Check logprob fields in manifest:\n        {project_root}/.venv/bin/python
    -c \"\nimport json\nwith open('{project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl')
    as f:\n    entry = json.loads(f.readline())\nprint('all_fields:', list(entry.keys())[:30])\"\n
    \       Record: available_fields, manifest_entry_count\n        If no logprob-like fields found
    (logprob, token_logprob, log_prob, logits, top_logprobs):\n           write honest_verdict
    blocked_no_logprob_fields_in_manifest and exit.\n     Record: preconditions_checked list.\n\n
    \ 1. Load all manifest entries. For each entry:\n     a. Identify the logprob field (try:
    token_logprob, logprob, log_prob, top_logprobs in order).\n     b. Compute per-token spilled
    energy (arXiv:2602.18671 §3.1):\n        For each token t_i with logprob p_i:\n
    \           spilled_t = 1.0 - exp(p_i)  # probability mass NOT assigned to predicted token\n
    \       spilled_energy_entry = mean(spilled_t for all tokens) # normalize by length\n     c.
    Compute per-token marginalized energy (arXiv:2602.18671 §3.2):\n        marginalized_energy_entry
    = -mean(p_i for all tokens) # mean logprob negated = energy\n     d. Get label: 0 = correct,
    1 = hallucination (from 'label', 'is_hallucination', or 'correctness_label' field).\n     e.
    Record: {idx, label, spilled_energy, marginalized_energy, n_tokens}\n\n  2. Compute Phase 4
    metrics:\n     from scipy.stats import pearsonr\n     from sklearn.metrics import roc_auc_score\n
    \    pearson_spilled, p_spilled = pearsonr(spilled_energy_array, label_array)\n
    \    pearson_marginalized, p_marginalized = pearsonr(marginalized_energy_array, label_array)\n
    \    auroc_spilled = roc_auc_score(label_array, spilled_energy_array)\n
    \    auroc_marginalized = roc_auc_score(label_array, marginalized_energy_array)\n
    \    phase4_validated_via_spilled = (pearson_spilled > 0.3 and auroc_spilled > 0.65)\n
    \    phase4_validated_any = phase4_validated_via_spilled\n\n  3. Also check: is spilled_energy
    a viable Tier 0q verifier candidate?\n     tier0q_viable = (auroc_spilled > 0.65)\n
    \    # If auroc_spilled > 0.65, record spilled_energy_scores as a score array file:\n     # Save
    to results/experiment_2497_spilled_energy_scores.json for use by exp2499\n\n  4. Write
    deliverable. Validate JSON before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - pearson_spilled:\n
    \     principle: \"Pearson correlation between spilled_energy and hallucination labels.
    arXiv:2602.18671 reports 0.31-0.47; > 0.3 threshold for Phase 4 bijection claim via spilled
    energy path.\"\n  - auroc_spilled:\n      principle: \"AUROC of spilled_energy as standalone
    hallucination predictor. > 0.65 = viable Tier 0q verifier candidate for exp2499.\"\n  -
    phase4_validated_via_spilled:\n      principle: \"True if pearson_spilled > 0.3 AND
    auroc_spilled > 0.65. One of two Phase 4 arXiv gate lift conditions in .241.\"\n  -
    tier0q_viable:\n      principle: \"True if auroc_spilled > 0.65. Gates exp2499's integration
    of Tier 0q into the conformal ensemble.\"\n  - honest_verdict:\n      principle:
    \"Terminal-prefix required. complete: with pearson_spilled and phase4_validated_via_spilled.\"\n\nACCEPTANCE
    GATES:\n  - condition: \"pearson_spilled is not null\"\n    principle: \"Ensures spilled_energy
    was actually computed (non-null = real data was loaded).\"\n\nDo NOT push. Do NOT modify
    scripts/research_conductor.py."

- id: exp2498-auroc-adversarial-replication-v2-group-conditional
