  rationale: ".181 produced 4 substantive results with TWO majors: (a) alpha_t' is ALSO scale-invariant (statistically_distinguishable_pairs=0; both Phase 4 metrics fail the substrate-scaling question — deeper measurement problem than just metric choice), (b) QAOD vs NLA tied at TPR=0.4722 on the shared corpus (BOTH collapsed from 0.73 exp1694 baseline — test-corpus issue or label-noise issue). exp1742 EBT energy_decrease_pct=128% is physically suspicious (mode collapse?). exp1743 audit flagged 11 of 12 .179/.180 artifacts as REAL_BUG. .182 diagnoses these three findings + continues Phase 1 ship-track."
