    - JAX_PLATFORMS=cpu python -c "from python.carnot.eval.diagnostics import NullSpaceEstimator; print('imports OK')"
    - JAX_PLATFORMS=cpu python scripts/experiment_1106_phase1a_adversarial_verifier_robustness_audit_v2.py
    - JAX_PLATFORMS=cpu pytest tests/python/test_phase1a_adversarial_audit_v2.py -v
    - Write results/experiment_1106_phase1a_adversarial_verifier_robustness_audit_v2.json

