      CONCRETE STEPS
      0. Check all model files, tokenizers, CUDA devices, free VRAM, RAM, disk, timeouts, seeds, runtime capabilities, and protected hashes before model construction.
      1. Add REQ-INFRA-6312 and scenarios before implementation. Update traceability.
      2. Build a tiny exact causal fixture with matched code lengths and immutable sidecars. Freeze the surface-selection order before observing labels.
      3. Probe hidden-state runtime support. If unavailable, record the failure and test the output-free prefix trajectory exactly as preregistered.
      4. Load each model through the canonical GGUF path, collect raw tensors atomically, unload, and prove GPU memory release.
      5. Run every shortcut and causal control per model. Do not aggregate models or allow one surface to rescue another.
      6. Add tests for selection leakage, tensor provenance, deterministic replay, no-generation, no-shared-adapter, control mutations, and clean null closure.
      7. Run required tests, spec coverage, applicable e2e checks, and adversarial verification.

