      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-roadmap.yaml
      - {project_root}/research-roadmap-next.yaml
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_5719_sota_answer_channel_forensics.json
      - {project_root}/results/experiment_5720_sota_attested_exact_envelope_canary.json
      - {project_root}/results/experiment_5723_one_axis_rust_samplerbackend_integration.json
      - {project_root}/results/experiment_5724_one_axis_rust_python_matched_crossover.json
      - {project_root}/results/experiment_5726_arc_epistemic_ledger_live_ab.json
      - {project_root}/results/experiment_5727_arc_generalization_live_oracle_gap_v511.json
      - {project_root}/results/experiment_5728_v511_capstone_reconciliation.json
      - {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/ops/arc_solve_registry.yaml
      - {project_root}/research-complete.yaml

      TASK:
      Archive terminal .511 evidence, preserve every negative/null/retired boundary, collision-check the next graph, and emit results/experiment_5731_transition_v512.json.

      CONCRETE STEPS:
      1. Read every Exp5717-Exp5728 artifact plus conductor outcome. Record the missing Exp5721 artifact, gate skips, adversarial duration flag, blocked states, complete nulls, and promoted Rust integration exactly.
      2. Preserve Exp5719's root evidence: all three required GGUFs resolved, no qualified protocol, positive-control parse rate 0, 41 truncations, 82 missing answers, 10 repetitions, and unauthenticated CUDA-offload score. Do not reopen free-form answer-envelope repair.
      3. Preserve Exp5723 production-backend readiness and Exp5724's 178 quality-matched pairs, null consecutive-large-size crossover, and CPU-software-only timing boundary. Keep two-axis exchange retired.
      4. Preserve Exp5726 as a safe epistemic-ledger null and Exp5727 as a development measurement with 25 games, live 4, oracle 183, gap 179, and no new solve. Do not promote or retry the ledger.
      5. Collision-scan results, roadmaps, scripts, tests, history, and outer-loop artifacts before setting current_task_range=exp5731-exp5742. Emit dependency and gate maps with no chain to retired experiment IDs.
      6. Reconcile transition-only entries in research-complete.yaml, ops/status.md, ops/changelog.md, and ops/conductor-log.md without changing scientific verdicts. Do not rewrite historical records.
      7. REQUIRED ARTIFACT FIELDS: `field_principles` with one non-empty scientific principle for every field named here; `preconditions_checked`; `source_capstone_hash`; `v511_task_verdicts`; `v511_conductor_outcomes`; `answer_channel_ready=false`; `stream_ready=false`; `continuous_self_learning_credited=false`; `rust_samplerbackend_ready=true`; `rust_python_crossover_null=true`; `arc_live_levels=4`; `arc_oracle_levels=183`; `arc_gap=179`; `arc_registry_delta=0`; `preserved_scopes`; `retired_scopes`; `current_task_range=exp5731-exp5742`; `dependency_map`; `gate_map`; `timing_claimed=false`; `hardware_speedup_claimed=false`; `inference_substrate=artifact_reconciliation_only`; `test_commands`; `test_exit_codes`; `reproducibility_checksum`; `honest_verdict`.
      8. Run YAML, roadmap-schema, prior-failure, exclusion-manifest, gate, conductor-preflight, adversarial, spec-coverage, and root-clutter checks. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

