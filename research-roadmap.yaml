- id: exp2439-fr11-online-learnability
  title: 'Phase 2: FR-11 Online Learnability of CoT Verifiers (arXiv:2603.03538) -- MANDATORY Continuous Self-Learning Task'
  milestone: 2026.05.236
  deliverable: results/experiment_2439_fr11_online_learnability.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  continuous_self_learning_task: true
  prior_failures:
  - experiment_id: exp2425-fr11-nsvif-online-v4
    verdict: complete_fr11_nsvif_online_passed
    addressed_by: "exp2425 ran the NSVIF online self-learning loop and PASSED (fr11_nsvif_online_passed=true,\
      \ cross_domain_retention_rate=1.0). This task is a DISTINCT scope: instead of just running the loop,\
      \ it MEASURES the theoretical learnability properties (soundness, completeness, Littlestone dimension)\
      \ per arXiv:2603.03538. These properties were never measured; the prior task only demonstrated the loop\
      \ runs. Different: theoretical learnability audit, not a loop execution."
    retire_if_same_verdict: false
  prompt: "CONTEXT: FR-11 (Autonomous Self-Learning Loop) is a MANDATORY functional requirement.\nEvery milestone must include\
    \ at least one continuous_self_learning_task experiment.\n\nexp2425 (.235) ran the NSVIF online learning loop and passed\
    \ (cross_domain_retention_rate=1.0,\nself_learning_improvement=0.667). This task goes deeper: instead of just running\n\
    the loop, it MEASURES the theoretical learnability properties of the CoT verifier class.\n\nOnline Learnability of CoT Verifiers\
    \ (arXiv:2603.03538) establishes:\n  - Soundness: fraction of verifier verdicts that correctly classify SAT examples as\
    \ SAT\n  - Completeness: fraction of verifier verdicts that correctly classify UNSAT examples as UNSAT\n  - Littlestone\
    \ dimension: bounds the number of online updates needed before convergence\n    (finite Littlestone dim = online learnable;\
    \ infinite = not learnable)\n\nFor NSVIF Z3 verifier: bounded Littlestone dimension follows from the fact that\nZ3 constraint\
    \ patterns are drawn from a finite vocabulary (UNSAT cores are finite and\nenumerable). Empirically, estimate dim via the\
    \ doubling trick.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/nsvif_z3_extractor.py (NSVIFExtractor\
    \ class)\n  {project_root}/results/experiment_2425_fr11_nsvif_online_v4.json (loop result: retention=1.0)\n  {project_root}/results/constraint_patterns_v4.json\
    \ (if exists, from exp2425)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. z3-solver: .venv/bin/python -c \"import z3;\
    \ print(z3.get_version_string())\"\n        If missing: .venv/bin/pip install z3-solver -q\n     b. Telemetry manifest:\n\
    \        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n        If missing: write honest_verdict\
    \ blocked_telemetry_manifest_missing and exit.\n     c. NSVIF importable:\n        .venv/bin/python -c \"from carnot.verify.nsvif_z3_extractor\
    \ import NSVIFExtractor; print('OK')\"\n        If missing: write honest_verdict blocked_nsvif_not_importable and exit.\n\
    \n  1. Measure soundness on first 30 telemetry entries:\n     For each entry with ground_truth_label=SAT (clean):\n     \
    \  Run NSVIF Z3 verification. Record: is_correct = (z3_verdict == 'SAT').\n     soundness_rate = sum(is_correct) / n_sat_examples.\n\
    \n  2. Measure completeness on first 30 telemetry entries:\n     For each entry with ground_truth_label=UNSAT (hallucination):\n\
    \       Run NSVIF Z3 verification. Record: is_correct = (z3_verdict == 'UNSAT').\n     completeness_rate = sum(is_correct)\
    \ / n_unsat_examples.\n\n  3. Estimate Littlestone dimension via doubling trick:\n     Initialize: verifier_correct_so_far\
    \ = []\n     For k in 1..5 (doubling rounds):\n       Query 2^k examples in sequence. Record the number of verifier mistakes\
    \ (wrong label).\n       If mistakes in this round == 0: estimated_littlestone_dim = k-1. Stop.\n     If all 5 rounds have\
    \ mistakes: estimated_littlestone_dim = 5+ (bounded from above).\n\n  4. Online update step (FR-11 loop):\n     For any\
    \ entry where z3_verdict was WRONG (soundness or completeness failure):\n       Extract the constraint that was incorrectly\
    \ applied.\n       Append to constraint_patterns with confidence -= 0.1 (online weight decay for wrong patterns).\n     updated_soundness_rate,\
    \ updated_completeness_rate after the update.\n     cross_domain_retention_rate: fraction of originally-correct verdicts\
    \ still correct.\n\n  5. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix\
    \ required.\"\n  - fr11_online_learnability_passed:\n      principle: \"True if soundness + completeness were measured AND\
    \ online update ran.\"\n  - soundness_rate:\n      principle: \"Fraction of SAT examples correctly classified as SAT. FR-11\
    \ correctness.\"\n  - completeness_rate:\n      principle: \"Fraction of UNSAT examples correctly classified as UNSAT.\"\
    \n  - estimated_littlestone_dim:\n      principle: \"Finite dim = verifier is online-learnable per Littlestone theory.\"\
    \n  - cross_domain_retention_rate:\n      principle: \"FR-11 gate: fraction of correct verdicts retained after update.\"\
    \n  - n_eval_examples:\n      principle: \"Must be 30.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n\
    \      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n      principle: \"Records z3, telemetry,\
    \ nsvif checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"fr11_online_learnability_passed == true\"\n    principle: \"FR-11\
    \ mandatory: self-learning loop must complete.\"\n  - condition: \"cross_domain_retention_rate >= 0.50\"\n    principle:\
    \ \"Must not catastrophically degrade previously-correct verdicts.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

