      verifier set: if exp3598 has not landed, enumerate the code-applicable verifiers INLINE from
      python/carnot/verify/ -- controlled_invariance_executor_v2.py, executable_monitor_runtime_adapter.py,
      ast_structure_verifier.py, code_structural_dependency_verifier.py -- do NOT block on exp3598.
