      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/tier0g_semantic_energy.py (char-n-gram TF-IDF fix from exp2741)
      - python/carnot/pipeline/verify_repair.py (verify() method)
      - results/experiment_2741_tier0g_live_gpu_rerun.json (root_cause, fix_applied fields)

      TASK: Write stub, load gemma-4-26B-A4B-it-GGUF, generate N=5 live responses, run verifier,
      confirm non-degenerate energy. Produce non-adversarial artifact (duration >= 30s).

      CONCRETE STEPS:

      0.0 WRITE STUB ARTIFACT IMMEDIATELY (before any other step):
          Write results/experiment_2765_verifier_live_gpu_v4.json with:
          {{"honest_verdict": "partial_started",
            "stub_written_at": "<current_utc_timestamp>",
            "step": "preconditions_not_yet_checked",
            "verifier_discriminative": null, "duration_s": null}}
          This guarantees an artifact exists even if subsequent steps fail.

      0. PRECONDITIONS (update stub with result of each check):
