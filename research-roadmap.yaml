  - id: exp2733
    milestone: "2026.05.259"
    deliverable: "results/experiment_2733_orca_nexus_integration_v1.json"
    title: "FR-11 Tier 3+: ORCA-NEXUS Integration v1 — Online Violation Learning with Conformal Stopping"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: self-learning
    continuous_self_learning_task: true

    prior_failures:
      - experiment_id: exp2719-orca-ttt-v2
        verdict: "complete: conformal_stopping_enabled=True, n_ttt_steps_saved=79, GC dependency stopping operational"
        addressed_by: "exp2719 (.258) completed the ORCA conformal stopping (FR-11 Tier 3). This exp2733 has EXPANDED scope: integrates ORCA stopping WITH NEXUS symbolic constraint memory (exp2695, FR-11 Tier 2). The new task runs ORCA TTT on real FoVer violations (not synthetic examples) and feeds learned constraints into NexusConstraintMemory.synthesize_rules(). Different deliverable: ORCA-NEXUS online integration producing learned_rules (str count) from real violations."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      FR-11 Tier 2 (NEXUS v2): COMPLETED in .256 (exp2695 — 100 FoVer violations, 5 rules, persistence).
      FR-11 Tier 3 (ORCA TTT v2): COMPLETED in .258 (exp2719 — conformal_stopping, 79 steps saved).
      This experiment integrates both: use ORCA conformal stopping TO DRIVE rule synthesis in NEXUS.

      Integration design:
      1. For each FoVer violation, run ORCA TTT loop (up to k=10 iterations, conformal stopping)
      2. When conformal stopping fires (energy interval width < alpha), extract the final low-energy
         response as a "repair example"
      3. Feed (violation, repair) pairs into NexusConstraintMemory.synthesize_rules()
      4. Measure: how many new rules were synthesized? Are rules better than pattern-only synthesis?

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/ttt_loop.py (VerifierDrivenTTT from exp2719 — check if exists)
      - python/carnot/verify/nexus_constraint_memory.py (or nexus_*.py — from exp2695)
      - data/fover_corpus.jsonl (FoVer corpus)

      TASK: Integrate ORCA TTT stopping with NEXUS online constraint learning. (FR-11 Tier 3+)

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `ls python/carnot/pipeline/ttt_loop.py 2>/dev/null && echo exists || echo missing`
            Record: ttt_loop_exists (bool).
         b. `ls python/carnot/verify/nexus_constraint_memory.py 2>/dev/null || ls python/carnot/verify/nexus*.py 2>/dev/null | head -1`
            Record: nexus_module_exists (bool), nexus_module_path (str).
         c. `.venv/bin/python -c "import sys; sys.path.insert(0, 'python'); import carnot.pipeline"` — importable.
            If fails: write honest_verdict 'blocked_carnot_pipeline_not_importable' and exit.
         d. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. If ttt_loop_exists=false: create minimal VerifierDrivenTTT stub (per exp2719 pattern):
         iterate(prompt, initial_response, k_max=10, alpha=0.1) -> dict
         conformal_stopping_criterion(energy_scores, alpha=0.1, min_iterations=2) -> (bool, float)
         Record: ttt_stub_created (bool).

      2. If nexus_module_exists=false: create minimal NexusConstraintMemory stub:
         add_violation(question, wrong_answer, energy_score) -> None
         synthesize_rules(min_support=3) -> list of str
         Record: nexus_stub_created (bool).

      3. Load N=30 FoVer violations from corpus (random_seed=42):
         Violations = (question, incorrect_answer) pairs.
         For each violation: simulate ORCA TTT (use pipeline.verify() to compute energy):
           - energy_scores = [pipeline.verify(q, r) for r in iteration_responses]
           - conformal_stopping_criterion(energy_scores, alpha=0.1)
           - If stopped: record repair_example = (violation, iteration_responses[-1])
         Record: n_violations_processed (int), n_orca_stopped_early (int), n_repairs_found (int).

      4. Feed (violation, repair) pairs to NEXUS:
         For each repair: nexus.add_violation(question, wrong_answer, energy_score)
         synthesized_rules = nexus.synthesize_rules(min_support=3)
         Record: n_rules_synthesized (int), synthesized_rules_sample (list of str — first 3).

      5. orca_nexus_integration_viable = (n_repairs_found >= 5 AND n_rules_synthesized >= 1).

      6. Write results/experiment_2733_orca_nexus_integration_v1.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - orca_nexus_integration_viable: bool
        principle: "FR-11 integration gate: True if ORCA-driven violations feed NEXUS rule synthesis."
      - n_violations_processed: int
        principle: "Confirms ORCA TTT loop ran on real FoVer data (not synthetic examples)."
      - n_orca_stopped_early: int
        principle: "ORCA value: early stops = fewer iterations needed per online learning step."
      - n_repairs_found: int
