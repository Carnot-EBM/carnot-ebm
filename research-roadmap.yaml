    CONCRETE STEPS:
    1. PRECONDITIONS: emit a flushed progress line immediately. Check the listed resources and relevant REQ-* spec before any measurement. Earlier V657 outputs are inputs only after their producers run. If an external prerequisite is absent, emit complete_blocked_<reason>, verdict_class=blocked and gate_check_summary with the exact observed failure; do not invent a result.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. In long loops print completed units and monotonic elapsed at least every 60 seconds. Stream child stdout unbuffered and send truthful pending-operation heartbeats every 60 seconds. Keep EVERY gap below 600 seconds: a silent task can die at 1200 seconds; continuing progress permits the 4800-second hard cap. Checkpoint completed work and terminate only owned processes.
    3. Keep each tool call small. Write ANY file over about 200 lines in several tool calls, preferably chunks of 100-150 lines, with a progress message between calls. Do not compose a module plus tests in one huge call. A heartbeat process cannot expose progress while the agent is generating one oversized tool call. Split reads, edits and checks into bounded calls too.
    4. Before implementation, extend the relevant OpenSpec REQ-* and SCENARIO-* items, then add meaningful failing tests. Reuse qualified helpers and thin entrypoints; do not copy a prior experiment main or its validation boilerplate. Preserve historical tests and their assertions. Record unrelated orphan-test baseline failures separately; do not suppress or delete tests.
    5. Declare inference_substrate_class=aggregation. Set inference_substrate=aggregation_from_upstream_artifacts EXACTLY, MODEL_SPECS=[], model_specs=[], model_invoked=false and zero current model calls. Historical evidence stays historical.
    6. Run without a structured scientific pre-gate. Compare the exact13-task document/YAML contract again, then inventory every producer in conductor order with raw rows, flags, receipts, hashes and exact ready/value fields. This task records its own validated disposition after reducing the twelve preceding tasks; no self-dependent gate or fabricated producer result.
    7. Separate native evidence quality, probability value, selective decision value, causal information, retention, ARC reachability/opportunity, host quantization, historical board continuity and current machine-service timing. Propagate the independent static and causal audits. An unqualified recovered ARC candidate is not a live benchmark result; cached numerical work is not a current model call.
    8. Produce docs/research-notes/v657-retrospective.md with all thirteen dispositions and three PRD gap updates. Valid scientific nulls are terminal. Missing or externally gated required evidence makes the aggregate class blocked, with capstone_complete_score=1 once accounting is complete. Use partial only if this task itself still has repairable unfinished work. Preserve disqualified evidence rather than laundering it into null.
    9. Apply unchanged prior-failure retirement rules with all four fields. If the addressed mechanism produces the same recorded failure, retire the new ID through the existing exclusion workflow and document the new condition needed to reopen the scope; no reuse of retired upstream chains. Do not retire a whole research objective because one bounded technique fails.
    10. Evaluate existing publication gates G1-G4 read-only and record their actual outcomes; milestone completion is not publication permission. Reconcile OpenSpec, traceability, status, changelog and north-star evidence without promoting untested requirements. Keep the active roadmap and conductor unchanged and leave activation/publication to the operator.
    11. Freeze the affected-file validation manifest and verify imports resolve to this worktree. Run scoped pytest -n 0 -o addopts= --no-cov with a private --basetemp; separately require 100 percent changed-module coverage with a command-local COVERAGE_FILE. Run scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Reuse the Exp7358/Exp7303 helpers. Do not run full_python_suite or an unscoped tests/python suite inside this task.
    12. Run the declared entrypoint and a fresh-process cold replay as capability E2E. No numbered runtime E2E applies to reporting-only work. Shared model/training/sampling changes require applicable E2E-001/002; bindings/serialization require E2E-003/004. ARC policy or transport changes require E2E-009/010, telemetry changes E2E-011, and the private LLM-off real-environment smoke from ops/e2e-test-plan.md. Retain actual outputs and scope; Rust changes also require cargo tests, fmt and clippy.
    13. Independently reduce per-unit rows, run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict against the exact candidate, and save their actual outputs. Failed required validation is disqualified; failed measured benefit is null; unchanged external absence is blocked. Atomically publish terminal JSON only after the required work and checks. Keep checkpoints outside the terminal deliverable path.
    14. Keep each committed artifact below 20 MiB with hash-bound sidecars; scratch work belongs in /tmp. Reconcile affected OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md to actual evidence. Preserve historical artifacts, generator weights, production defaults and research-roadmap.yaml. No activation, external publication, scored submission or push.

