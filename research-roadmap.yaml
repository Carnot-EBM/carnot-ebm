  prompt: "CONTEXT: Ensemble v7b achieves AUROC=0.9857 but contains two near-random verifiers on real corpus: tier0s (real AUROC=0.3758) and tier0u (real AUROC=0.5360). These were paper-errata-corrected in .246 but not algorithmically improved. exp2572 and exp2573 retrained these verifiers on real FoVer data. This task builds ensemble v9 by:\n  1. Replacing tier0s with the exp2572 retrained version (if improved)\n  2. Replacing tier0u with the exp2573 NLI-proxy version (if improved)\n  3. Re-running 5-seed group-conditional calibration\n  4. Comparing to HalluScan benchmark from exp2566\n\nNO-REGRESSION GATE: ensemble v9 AUROC must be >= 0.975 (exp2547 adaptive conformal floor).\nIf replacing tier0s/tier0u reduces AUROC, keep the originals and document why.\n\nEXISTING CODE TO READ FIRST:\n  Calibration code:\n    grep -r 'group_conditional\\|GroupConditional' {project_root}/python/ --include='*.py' -l\n  {project_root}/results/experiment_2546_ensemble_v7b.json (v7b baseline + Group structure)\n  {project_root}/results/experiment_2563_ensemble_v8.json (v8 Group E members + AUROC)\n  {project_root}/results/experiment_2572_tier0s_retrain.json (tier0s_improved, tier0s_viable)\n  {project_root}/results/experiment_2573_tier0u_fix.json (tier0u_improved, tier0u_viable)\n  {project_root}/results/experiment_2566_halluscan_eval.json (external peer comparison)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Calibration module:\n        grep -r 'group_conditional\\|fisher' {project_root}/python/ --include='*.py' -l | head -3\n        If not found: write honest_verdict 'blocked_calibration_module_not_found' and exit.\n     b. Read exp2572 tier0s outcome:\n        python3 -c \"import json; d=json.load(open('results/experiment_2572_tier0s_retrain.json')); print('improved:', d.get('tier0s_improved'), 'viable:', d.get('tier0s_viable'), 'auroc:', d.get('tier0s_real_auroc'))\"\n        Set tier0s_improved, tier0s_real_auroc_v2.\n     c. Read exp2573 tier0u outcome:\n        python3 -c \"import json; d=json.load(open('results/experiment_2573_tier0u_fix.json')); print('improved:', d.get('tier0u_improved'), 'viable:', d.get('tier0u_viable'), 'auroc:', d.get('tier0u_v2_real_auroc'))\"\n        Set tier0u_improved, tier0u_real_auroc_v2.\n  1. Load ensemble v7b/v8 group structure. Make a copy of the group assignments.\n  2. For Group B (semantic): if tier0s_improved=True AND tier0s_viable=True:\n     Replace tier0s with the retrained version (load checkpoint from exp2572).\n  3. For Group C (logic): if tier0u_improved=True AND tier0u_viable=True:\n     Replace tier0u with the NLI-proxy version from exp2573.\n  4. Run 5-seed group-conditional calibration on FoVer real corpus.\n     Compute ensemble_v9_auroc and ensemble_v9_auroc_std.\n  5. Compare to v7b (0.9857) and v8 baselines. Set regression_detected=(v9 < 0.975).\n  6. Read HalluScan result from exp2566:\n     python3 -c \"import json; d=json.load(open('results/experiment_2566_halluscan_eval.json')); print('auroc:', d.get('carnot_halluscan_auroc'), 'beats_baseline:', d.get('carnot_beats_halluscan_baseline'))\"\n  7. Set ensemble_v9_viable=(ensemble_v9_auroc >= 0.975).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - ensemble_v9_auroc:\n      principle: \"New ensemble AUROC. Compared to v7b 0.9857 and v8 baseline.\"\n  - ensemble_v9_auroc_std:\n      principle: \"Multi-seed std — required for paper-v6 cite-safe reporting.\"\n  - ensemble_v7b_baseline:\n      principle: \"0.9857 carry-forward for regression detection.\"\n  - tier0s_replaced:\n      principle: \"True if retrained tier0s was substituted. Documents which verifiers changed.\"\n  - tier0u_replaced:\n      principle: \"True if NLI-proxy tier0u was substituted. Documents which verifiers changed.\"\n  - regression_detected:\n      principle: \"True if v9 AUROC < 0.975. Diagnostic flag for calibration analysis.\"\n  - ensemble_v9_viable:\n      principle: \"True if AUROC >= 0.975. Determines if v9 can replace v7b as headline metric.\"\n  - halluscan_auroc_v9:\n      principle: \"HalluScan AUROC from exp2566, compared against the ensemble v9 result — documents external generalization.\"\n  - n_seeds:\n      principle: \"Must be >= 3 for meaningful std.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"ensemble_v9_auroc >= 0.970\"\n    principle: \"No regression below exp2547 adaptive conformal floor. Real-corpus verifier improvements must not degrade headline metric.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

