  - id: exp3589-additivity-second-pair-of-eyes-mcnemar
    milestone: "2026.05.330"
    title: "Additivity / 'second pair of eyes' — does ensemble OR-with-confidence beat confidence alone? (conditional catch-rate + McNemar, resolves exp3575/3576 tension)"
    priority: high
    max_turns: 50
    agent_type: gemini
    estimated_wall_time_min: 20
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    gated_on:
      - upstream: exp3588-corrected-cross-domain-remeasurement
        artifact_field: positive_control_valid
        op: '=='
        value: true
    deliverable: results/experiment_3589_additivity_second_pair_of_eyes.json
    prompt: |
      CONTEXT: AUROC alone hides the real product claim. The "second pair of eyes" value is specifically that
      the verifier catches errors a STRONG confidence baseline MISSES — i.e. the verifier is ADDITIVE to
      confidence, not redundant with it. .329 claimed this confirmed (exp3575) from an ensemble at AUROC 0.44
      — impossible under a fair test. Re-derive it now with the corrected verifiers on the realistic corpora.
      EXISTING CODE TO READ FIRST: results/experiment_3588 (the corrected generalization table) +
      results/experiment_3575 (the contaminated prior claim, for comparison) via scripts/summarize_artifact.py.
      PRECONDITIONS (step 0): exp3588 landed with positive_control_valid==True. If not ->
      "complete: blocked_corrected_remeasurement_unavailable".
      CONCRETE STEPS:
        1. Per domain (code, facts): at a fixed confidence-baseline FPR, compute (a) recall of the
           confidence baseline, (b) recall of the ensemble, (c) the CONDITIONAL catch-rate: errors the
           ensemble catches that confidence MISSES (and vice versa). McNemar paired test on the
           disagreement + CI.
        2. Compute the FUSED detector (ensemble OR confidence, or a simple calibrated combination) AUROC and
           recall-at-fixed-FPR; compare to confidence alone — the genuine additive-value number.
        3. Honest verdict: additive (fusion materially beats confidence; ensemble catches a significant set
           confidence misses) / redundant (no conditional lift).
      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict: {{principle: "Terminal prefix for reconciler classification."}}
        inference_substrate: {{value: verifier_ensemble_against_cached_candidates, principle: "Scores cached corpora; no LLM load."}}
        code_conditional_catch_rate_ensemble_over_confidence: {{principle: "Errors the ensemble catches that confidence misses — the second-pair-of-eyes signal for code."}}
        factual_conditional_catch_rate_ensemble_over_confidence: {{principle: "Same for facts — the core-motivation product signal."}}
        mcnemar_p_code: {{principle: "Paired significance of the ensemble-vs-confidence disagreement (not just a point estimate)."}}
        mcnemar_p_factual: {{principle: "Same for facts."}}
        fused_detector_auroc: {{principle: "ensemble OR confidence — the deployable detector's headline number."}}
        fusion_beats_confidence_alone: {{value: bool, principle: "True iff the fused detector materially beats confidence — the real 'is the verifier worth adding' answer."}}
        second_pair_of_eyes_real: {{value: bool, principle: "True iff the ensemble catches a significant set confidence misses in >=1 domain with McNemar p<0.05 — re-derived honestly vs the contaminated exp3575."}}
        n_errors_per_domain: {{principle: "Sample-size rigor for the conditional-catch claim."}}
        random_seed: {{principle: "Determinism precondition."}}
        reproducibility_checksum: {{principle: "Drift detection."}}
        duration_s: {{principle: "Plausibility floor."}}
      ACCEPTANCE GATE:
        - condition: "fused_detector_auroc present AND mcnemar_p_code present AND fusion_beats_confidence_alone present"
          principle: "Product value is conditional, additive coverage measured with a paired significance test — a higher AUROC alone is not the second-pair-of-eyes claim."
      TERMINAL VERDICTS: "complete: ensemble_additive_to_confidence_second_pair_of_eyes_real_fusion_wins" /
      "complete: ensemble_redundant_with_confidence_no_additive_value_value_prop_weak" /
      "complete: blocked_corrected_remeasurement_unavailable"
      Run: cd {project_root} && python scripts/experiment_3589_additivity_second_pair_of_eyes.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

