- id: exp760-gemma4-threshold-grid
  milestone: 2026.04.58
  deliverable: results/experiment_760_gemma4_threshold_grid.json
  title: 'Exp 760: Live Gemma4 VR Threshold Grid Search — 5 Thresholds x 50q (GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Gemma4-E4B-it shows 0% VR improvement (or degradation) in all prior
    experiments. arXiv 2601.01490 explains this as "constraint-induced distortion":
    stronger models satisfy formal constraints at the cost of semantic correctness.
    The fix is ADAPTIVE THRESHOLD GATING — only repair violations above a confidence
    threshold. Exp 708 showed gate_suppressed_gemma4_symcode=True (25 constraints suppressed)
    with zero accuracy impact — but the threshold wasn't tuned. A grid search across
    5 thresholds should find the setting where VR provides net positive improvement for Gemma4.

    arXiv 2601.01490 predicts: lower thresholds suppress more constraints (fewer FPs)
    but risk missing real errors. The sweet spot is where precision is high enough that
    fixed errors exceed broken ones. For Gemma4 (stronger model), the threshold should
    be higher than for Qwen3.5-0.8B.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_708_vr_attempt_19_gemma4.py — Exp 708 adaptive gate pattern.
    - results/experiment_708_vr_attempt_19_gemma4.json — baseline: n_constraints_suppressed=25.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; find threshold param.
    - python/carnot/pipeline/extract.py — extraction logic for Gemma4.
    - python/carnot/pipeline/gemma_loader.py — GemmaTransformersLoader (RETRO-028 fix).
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Run 5 VR threshold settings on Gemma4-E4B-it (50q each, 250q total).
    Find the threshold where signed_improvement > 0.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-160 (Gemma4-E4B-it VR threshold grid: MUST test ≥5 thresholds in
       [0.10, 0.50]; MUST report signed_improvement per threshold; honest_verdict MUST
       identify the best_threshold), SCENARIO-VERIFY-210 to
       openspec/capabilities/verification/spec.md.
    3. GPU setup:
       a. apply_env_autofix() FIRST.
       b. setup_gpu([("name": "google/gemma-4-E4B-it", "hf_id": "google/gemma-4-E4B-it", "gpu": 0)]).
       c. Use GemmaTransformersLoader for Gemma4 (RETRO-028 fix — llama.cpp has tokenizer bug).
       d. If CARNOT_FORCE_LIVE not set: write artifact with honest_verdict="blocked" and exit.
    4. Load 50 GSM8K questions (seed=0 to avoid overlap with Exp 742's seed=999).
    5. Run VR at 5 threshold settings [0.10, 0.20, 0.30, 0.40, 0.50]:
       For each threshold:
         a. Run all 50 questions through VerifyRepairPipeline with Gemma4-E4B-it.
