    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - results/experiment_1535_xgrammar_abs_contract_decoder_adapter.json
    - results/experiment_1520_runtime_contract_e2e_harness.json
    - python/carnot/verify/
    - python/carnot/grammar/
    - tests/python/

    TASK:
    Implement a BEAVER-lite prefix-bound audit for selected runtime-contract
    and automata-decoder cases, using local SOTA logprobs/top-k only where
    available and never treating bounds as acceptance authority.

    REQUIRED ARTIFACT FIELDS:
