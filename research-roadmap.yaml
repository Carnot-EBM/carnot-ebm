- id: exp1037-kv260-v6
  milestone: 2026.04.80
  deliverable: results/experiment_1037_kv260_v6.json
  title: "KV260 First Light v6 — Standalone, USB Serial + SD Re-Flash Escalation"
  prompt: |
    CONTEXT:
    The KV260 FPGA board (AMD Kria KV260) arrived 2026-04-20 and has been pending for 8+
    consecutive milestones. The bitstream is at output/carnot_ising_v4_bd/. The board is
    at 192.168.51.98. SSH has been blocked in all prior attempts (Exps 1010, 1022, and earlier).
    This experiment is STANDALONE — it does NOT gate on preflight. Even if all other experiments
    fail this milestone, KV260 must be attempted. Prior Exp 1022 (.79) was blocked because
    preflight never ran; this will not happen again.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1022_kv260_first_light_v5.json (prior attempt status — what was tried)
    - output/carnot_ising_v4_bd/ (bitstream files — what's there)
    - scripts/kv260_ising_smoke_test.py (if it exists — smoke test script)
    - research-hardware-wishlist.md KV260 section

    TASK:
    Approach order (escalating intervention — stop at first success):

    APPROACH 1 — SSH retry with different settings:
    - ping 192.168.51.98 (is board reachable?)
    - ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@192.168.51.98
      (default Kria Ubuntu credentials: ubuntu/ubuntu)
    - ssh -o StrictHostKeyChecking=no -p 8022 ubuntu@192.168.51.98
    - If SSH succeeds: jump to BITSTREAM LOADING below.

    APPROACH 2 — USB serial console:
    - ls /dev/ttyUSB* /dev/ttyACM* 2>/dev/null (find serial device)
    - sudo minicom -b 115200 -D /dev/ttyUSB0 (or whichever device found)
    - Log in: username=ubuntu password=ubuntu (default Kria)
    - Once logged in via serial: sudo systemctl enable ssh && sudo systemctl start ssh
    - Then retry SSH (Approach 1).

    APPROACH 3 — SD card re-flash:
    - Download Kria Ubuntu 22.04 image (check for cached copy first: ls ~/Downloads/kria*.img 2>/dev/null)
    - Flash: sudo dd if=kria-ubuntu-22.04.img of=/dev/sdX bs=4M status=progress
      (CRITICAL: verify /dev/sdX is the SD card, NOT the system drive — use lsblk first)
    - Boot KV260 with new SD card, connect via serial, confirm boot, enable SSH.

    BITSTREAM LOADING (if any approach succeeds):
    - scp -r output/carnot_ising_v4_bd/ ubuntu@192.168.51.98:/tmp/
    - ssh ubuntu@192.168.51.98 'sudo cp /tmp/carnot_ising_v4_bd/*.bit /lib/firmware/'
    - ssh ubuntu@192.168.51.98 'sudo xmutil loadapp carnot_ising_v4'
    - Run smoke test: python scripts/kv260_ising_smoke_test.py --host 192.168.51.98
      (if smoke test doesn't exist: write a minimal one that generates 100 random spin samples
       and verifies energy distribution is non-uniform — uniform would mean hardware isn't computing)

    IF ALL AUTOMATED PATHS FAIL:
    - Write a 5-command human action guide as part of the artifact. Be specific:
      exact commands, device names, credential format, what to look for in output.
    - kv260_guide_written=True counts as soft success for this milestone.

    ARTIFACT FIELDS:
    - ssh_reachable: bool
    - ssh_approach_used: str ("direct" | "port_8022" | "serial_then_ssh" | "none")
    - bitstream_loaded: bool
    - smoke_test_passed: bool (null if bitstream not loaded)
    - energy_distribution_nonuniform: bool (null if smoke test didn't run)
    - kv260_guide_written: bool (if automated failed)
    - guide_commands: list[str] (if guide written — the exact 5 commands)
    - honest_verdict: "first_light_achieved" | "ssh_restored_bitstream_loaded" | "guide_written" | "all_paths_blocked"

    Run: python scripts/experiment_1037_kv260_v6.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: high
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 25
