- id: exp2379-halt-tier0j-latent-probe
  title: 'Phase 1: HALT Latent Probe Tier 0j (arXiv:2601.14210) — Sub-ms Hidden-State Hallucination Detector'
  milestone: 2026.05.232
  deliverable: results/experiment_2379_halt_tier0j.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2368-laab-k17-verifier
    verdict: 'complete: laab_k17_validated=true (different algorithm — Tier 0h)'
    addressed_by: "exp2368 implemented LaaB (assertion-alignment NLI). exp2379 implements
      HALT (arXiv:2601.14210) — a completely different algorithm using residual probes
      on intermediate hidden states rather than NLI. HALT reads activation patterns from
      question tokens, not output text. Different mechanism, different tier slot (0j vs 0h),
      new scope. No prior HALT implementation exists in the codebase."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: HALT (Hallucination Assessment via Latent Testing, arXiv:2601.14210, Jan 2026)
    uses lightweight residual probes on intermediate hidden states of question tokens to
    estimate hallucination risk. Computation is orders of magnitude cheaper than token
    generation — evaluated in parallel with inference, enabling near-instantaneous risk
    estimation. This is Tier 0j in Carnot's verifier cascade.

    Unlike Semantic Energy (Tier 0g, logit-space) and SpilledEnergy (Tier 0b, decoding math),
    HALT reads INTERNAL hidden states. In the absence of direct hidden-state access from
    cached telemetry, HALT can be approximated via:
      - Proxy A: Residual probe on top-k token probability distribution (already in telemetry)
      - Proxy B: Variance of top-k logprob across layers (accessible from cached data)
      - Proxy C: A lightweight linear probe trained on telemetry energy features

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/semantic_energy.py (Tier 0g architecture to follow)
      {project_root}/python/carnot/verify/laab_verifier.py (Tier 0h architecture reference)
      {project_root}/results/experiment_2351_semantic_energy_real.json (AUROC=0.685 baseline)
      {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl (first 10 lines)

    TASK: Implement HALT Tier 0j latent probe and evaluate on telemetry corpus. Use proxy
    approach when direct hidden states are unavailable (Proxy A/B/C).

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Verify sklearn importable:
            .venv/bin/python -c "import sklearn; print(sklearn.__version__)"
            If missing: .venv/bin/pip install scikit-learn -q
         b. Verify telemetry manifest:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         c. Check what fields the telemetry has (for proxy selection):
            .venv/bin/python -c "
            import json
            with open('{project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl') as f:
                row = json.loads(f.readline())
            print([k for k in row.keys()])
            "
         d. CPU-only run — no GPU needed.

      1. Implement HaltProbeDetector at python/carnot/verify/halt_probe.py:
         - __init__(self, proxy: str = 'A'): set proxy strategy
         - compute_halt_score(entry: dict) -> float:
             Proxy A: variance of top-k logprob values (higher variance = higher uncertainty)
             Proxy B: kurtosis of softmax(logprobs) distribution (heavy tail = hallucination)
             Proxy C: linear probe score from sklearn LogisticRegression on logprob features
           Select proxy based on available telemetry fields.
         - verify(entry: dict) -> dict:
             returns {halt_risk_score: float, is_high_risk: bool, proxy_used: str}
         - This is Tier 0j (cheap, training-free for Proxy A/B; lightweight train for Proxy C).

      2. Evaluate on telemetry corpus:
         Load 36 entries from live_sota_balanced_telemetry_manifest_1480.jsonl.
         (Same 36 rows as exp2351 for direct AUROC comparison)
         For each entry: run HaltProbeDetector.verify(entry).
         Compute:
           - halt_k19j_auroc: AUROC using telemetry labels if available
           - halt_k19j_mean_risk_score: mean risk score across corpus
           - halt_vs_semantic_energy_auroc_delta: halt_auroc - semantic_energy_auroc (baseline 0.685)

      3. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "halt" -v --no-cov 2>&1 | tail -15

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with HALT AUROC."
      - halt_k19j_validated:
          principle: "True if HaltProbeDetector ran and produced non-trivial risk scores on real data."
      - halt_k19j_auroc:
          principle: "Primary metric. Compare directly with exp2351 baseline (0.685). Honest result expected."
      - halt_vs_semantic_energy_auroc_delta:
          principle: "HALT - SemanticEnergy AUROC. Positive = HALT improves. Key gap closure signal."
      - halt_proxy_used:
          principle: "Records which proxy strategy was used (A/B/C) for reproducibility."
      - n_eval_examples:
          principle: "Must be 36 for direct comparison with exp2351."
      - verifier_tier:
          principle: "Must be '0j'."
      - random_seed:
          principle: "Reproducibility. Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records resource verification."

    ACCEPTANCE GATES:
      - condition: "halt_k19j_validated == true"
        principle: "HALT must run and produce non-trivial risk scores on real data."
      - condition: "n_eval_examples >= 30"
        principle: "Minimum sample size for AUROC claim validity."

    Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

- id: exp2380-hive-4verifier-ensemble
  title: 'Phase 1: HIVE-Style 4-Verifier Ensemble (Tier 0g+0h+0i+0j) — Target AUROC > 0.88'
  milestone: 2026.05.232
  deliverable: results/experiment_2380_hive_ensemble.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2370-multi-verifier-comparison
    verdict: 'complete: multi_verifier_comparison_complete=true (3-verifier baseline)'
    addressed_by: "exp2370 computed a 3-verifier ensemble (Tier 0g+0h+0i). exp2380 extends
      to 4 verifiers by adding HALT (Tier 0j from exp2379). More critically, exp2380 uses
      the HIVE soft-voting architecture (arXiv:2604.26139) with per-verifier confidence
      weighting, not just mean score averaging. Different ensemble architecture (confidence-
      weighted vs equal-weight), different target metric (> 0.88 vs baseline measurement).
      HIVE achieved 0.9236 AUROC in the paper; Carnot's structural match should approach
      this ceiling."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: HIVE (arXiv:2604.26139, April 2026) achieves AUROC=0.9236 via a multi-verifier
    soft-voting ensemble combining hidden-state probes, logit-distribution energy, and
    semantic consistency with per-verifier confidence weighting. This surpasses HalluScan's
    0.88 ceiling and represents the current state-of-the-art for hallucination ensembles.

    Carnot's 4-verifier set mirrors HIVE's architecture:
      - Tier 0g: SemanticEnergyDetector (logit Boltzmann energy, AUROC=0.685, exp2351)
      - Tier 0h: LaaB logical consistency (assertion NLI, from exp2368)
      - Tier 0i: SpilledEnergy k=18 (logprob spill, from exp2369)
      - Tier 0j: HALT latent probe (hidden-state variance, from exp2379)

    HIVE soft-voting: weighted_score = sum(w_i * score_i) / sum(w_i)
    where w_i = verifier_auroc (per-verifier confidence weight from calibration).

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/semantic_energy.py (Tier 0g)
      {project_root}/python/carnot/verify/laab_verifier.py (Tier 0h)
      {project_root}/python/carnot/verify/spilled_energy_k18.py (Tier 0i)
      {project_root}/python/carnot/verify/halt_probe.py (Tier 0j — from exp2379)
      {project_root}/results/experiment_2370_multi_verifier_comparison.json (3-verifier baseline)
      {project_root}/results/experiment_2379_halt_tier0j.json (HALT results — if available)
      {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl

    TASK: Implement HIVE-style 4-verifier confidence-weighted ensemble and measure AUROC
    on expanded corpus.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Check which verifiers are importable (check all 4):
            .venv/bin/python -c "from carnot.verify.semantic_energy import SemanticEnergyDetector; print('0g OK')"
            .venv/bin/python -c "from carnot.verify.laab_verifier import LaabVerifier; print('0h OK')" 2>/dev/null || echo "0h not available"
            .venv/bin/python -c "from carnot.verify.spilled_energy_k18 import spilled_energy_k18; print('0i OK')" 2>/dev/null || echo "0i not available"
            .venv/bin/python -c "from carnot.verify.halt_probe import HaltProbeDetector; print('0j OK')" 2>/dev/null || echo "0j not available"
         b. If fewer than 2 verifiers importable: write honest_verdict blocked_insufficient_verifiers and exit.
         c. Verify telemetry manifest:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl

      1. Implement HiveEnsemble at python/carnot/verify/hive_ensemble.py:
         - __init__(self, verifiers: list, weights: dict = None):
             if weights is None: calibrate weights as per-verifier AUROC from prior runs
             (use exp2351 AUROC=0.685 for 0g, results from exp2368/2369/2379 for 0h/0i/0j)
         - score(entry: dict) -> float:
             Run all available verifiers. Weighted average: sum(w_i * score_i) / sum(w_i)
         - verify(entry: dict) -> dict:
             returns {ensemble_score: float, is_hallucinated: bool, per_verifier_scores: dict,
                      weights_used: dict, n_verifiers_used: int}

      2. Evaluate on ALL available telemetry rows (use all rows, not just 36):
         For each entry: run HiveEnsemble.score(entry).
         Compute:
           - ensemble_auroc_4verifier: AUROC of 4-verifier ensemble
           - best_single_verifier_auroc: highest among individual verifiers
           - ensemble_vs_best_single_auroc_delta: ensemble - best_single (positive = ensemble helps)
           - hallscan_baseline_auroc: 0.88 (hardcode for tracking)
           - hive_baseline_auroc: 0.9236 (hardcode for tracking)
           - auroc_gap_to_hallscan: 0.88 - ensemble_auroc_4verifier

      3. Compute Spearman rank correlation between all verifier pairs (complementarity assessment).

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with ensemble_auroc_4verifier."
      - ensemble_auroc_4verifier:
          principle: "Primary headline metric. Compare to HalluScan 0.88 and HIVE 0.9236."
      - ensemble_auroc_improved:
          principle: "True if 4-verifier ensemble AUROC > 3-verifier baseline from exp2370."
      - auroc_gap_to_hallscan:
          principle: "0.88 - ensemble_auroc. Tracks progress toward competitive parity."
      - n_verifiers_used:
          principle: "Count of verifiers that ran. Minimum 2 required for ensemble claim."
      - ensemble_vs_best_single_auroc_delta:
          principle: "Validates ensemble synergy: positive means fusion beats best individual."
      - n_eval_examples:
          principle: "Total telemetry rows evaluated. More than 36 (use all available)."
      - hallscan_baseline_auroc:
          principle: "Must be 0.88 for tracking."
      - random_seed:
          principle: "Reproducibility. Must be 42."
      - duration_s:
          principle: "Guards against fabrication."

    ACCEPTANCE GATES:
      - condition: "n_verifiers_used >= 2"
        principle: "Ensemble requires at least 2 verifiers to be meaningful."
      - condition: "n_eval_examples >= 30"
        principle: "Minimum statistical sample for AUROC claim."

    Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

- id: exp2381-fregelogic-z3-neural-hybrid
  title: 'Phase 1: FregeLogic Z3+Neural Hybrid Verifier (arXiv:2604.18328) — Z3 as Tiebreaker'
  milestone: 2026.05.232
  deliverable: results/experiment_2381_fregelogic.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2366-nsvif-verge-real-data
    verdict: 'complete: nsvif_real_validated=true, nsvif_real_verification_pass_rate<1.0'
    addressed_by: "exp2366 used NSVIF Z3 as PRIMARY verifier (Z3 decides all verdicts).
      exp2381 implements FregeLogic (arXiv:2604.18328): Z3 as TIEBREAKER when neural
      classifiers disagree (Z3 is last-resort discriminator, not primary). FregeLogic
      achieved 94.3% accuracy on syllogistic validity vs NSVIF-primary approaches which
      had lower accuracy. Different architecture: neural ensemble primary + Z3 tiebreaker.
      exp2381 benchmarks FregeLogic pattern against NSVIF-primary on same telemetry corpus."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: FregeLogic (arXiv:2604.18328, April 2026, SemEval 2026 Task 11) achieves
    94.3% accuracy on syllogistic validity by combining 5 neural classifiers with a Z3 SMT
    solver as a last-resort tiebreaker. Key insight: neural classifiers are fast and accurate
    on most examples; Z3 only fires when classifiers disagree, preserving its precision
    for hard cases.

    This is architecturally opposite to Carnot's current NSVIF (Z3 primary, neural downstream):
      - NSVIF pattern: Z3 extracts + verifies constraints → neural downstream
      - FregeLogic pattern: neural classifiers vote → Z3 tiebreaker when vote is split

    exp2381 implements a simplified FregeLogic pattern using Carnot's existing verifiers
    as the neural ensemble and NSVIF's Z3 as the tiebreaker.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/extraction/nsvif_extractor.py
      {project_root}/python/carnot/verify/semantic_energy.py (Tier 0g neural verifier)
      {project_root}/python/carnot/verify/laab_verifier.py (Tier 0h neural verifier)
      {project_root}/results/experiment_2366_nsvif_verge_real.json (NSVIF-primary baseline)
      {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl (first 10 lines)

    TASK: Implement FregeLogic Z3-tiebreaker pattern and compare vs NSVIF-primary on 36-example corpus.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Verify NSVIF importable (Z3 component):
            .venv/bin/python -c "from carnot.extraction.nsvif_extractor import NsvifExtractor; print('OK')"
            If fails: write honest_verdict blocked_nsvif_not_implemented and exit.
         b. Verify at least one neural verifier importable:
            .venv/bin/python -c "from carnot.verify.semantic_energy import SemanticEnergyDetector; print('0g OK')"
         c. Verify telemetry manifest:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
         d. Verify z3:
            .venv/bin/python -c "import z3; print(z3.get_version_string())"

      1. Implement FregeLogicVerifier at python/carnot/verify/frege_logic.py:
         - __init__(self, neural_verifiers: list, z3_verifier: NsvifExtractor):
         - verify(entry: dict) -> dict:
             a. Run all neural verifiers (Tier 0g, 0h, 0i, 0j if available)
             b. Compute mean_neural_score and neural_vote_variance
             c. If neural_vote_variance < tiebreaker_threshold (default 0.25):
                   verdict = mean_neural_score (neural classifiers agree — use them)
             d. Else: run NSVIF Z3 extraction + verification as tiebreaker
                   verdict = z3_result
             returns {frege_verdict: bool, frege_score: float, tiebreaker_used: bool,
                      neural_vote_variance: float}

      2. Evaluate on 36 telemetry entries (same as exp2366):
         For each entry: run FregeLogicVerifier.verify(entry).
         Compute:
           - fregelogic_auroc: AUROC of FregeLogic pattern
           - n_tiebreaker_invocations: how often Z3 fired as tiebreaker
           - fregelogic_vs_nsvif_primary_auroc_delta: fregelogic_auroc - nsvif_auroc
         Note: honest result may show FregeLogic better or worse than NSVIF-primary.

      3. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with FregeLogic AUROC."
      - fregelogic_validated:
          principle: "True if FregeLogic ran on all 36 entries."
      - fregelogic_auroc:
          principle: "AUROC of Z3-tiebreaker pattern. Compare with NSVIF-primary baseline."
      - n_tiebreaker_invocations:
          principle: "Count of Z3 tiebreaker firings. Zero means neural ensemble always agrees."
      - fregelogic_vs_nsvif_primary_auroc_delta:
          principle: "FregeLogic - NSVIF-primary. Positive = tiebreaker pattern helps."
      - n_eval_examples:
          principle: "Must be 36 to match exp2366 corpus."
      - random_seed:
          principle: "Reproducibility. Must be 42."
      - duration_s:
          principle: "Guards against fabrication."

    ACCEPTANCE GATES:
      - condition: "fregelogic_validated == true"
        principle: "FregeLogic must process all examples without crashing."

    Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

- id: exp2382-fst-live-path-ab
  title: 'Phase 2: FST Live PATH A/B — Actual GGUF Inference (llama_cpp or transformers)'
  milestone: 2026.05.232
  deliverable: results/experiment_2382_fst_live_path_ab.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  prior_failures:
  - experiment_id: exp2365-fst-live-gen-v11
    verdict: 'complete: fst_live_validated=true via PATH C (cached telemetry only)'
    addressed_by: "exp2365 validated FST via PATH C (cached logprobs from telemetry manifest)
      — this proves the FST pipeline works on real model outputs but does NOT demonstrate
      live inference. exp2382 targets PATH A (llama_cpp live GGUF) or PATH B (transformers
      AutoModel) — actual model invocation during the experiment. success criterion:
      live_inference_completed==true. PATH C fallback retained for robustness. Different
      success definition: exp2365 passed with live_inference_completed=false (PATH C);
      exp2382 succeeds only if live_inference_completed=true."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: FST (Functional Symbolic Trees) + ODAR + CASAL live generation was validated
    via PATH C (cached telemetry) in exp2365. The headline capability requires actual live
    LLM inference (PATH A: llama_cpp, or PATH B: transformers AutoModel) to be paper-worthy.

    exp2382's primary goal: achieve live_inference_completed=true.
    If PATH A (GGUF) fails: try PATH B (transformers).
    If both fail: use PATH C, but record live_inference_completed=false (honest result).

    MODEL_SPECS (MANDATORY SOTA GGUF — include ALL THREE):
      - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE, ~3B active params)
      - unsloth/gemma-4-31B-it-GGUF (flagship dense)
      - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE, ~4B active)

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/pipeline/fst_pipeline.py (or similar)
      {project_root}/python/carnot/samplers/casal.py (or equivalent)
      {project_root}/results/experiment_2365_fst_live_gen.json (PATH C success reference)
      {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl (PATH C data)

    TASK: Run FST+ODAR+CASAL pipeline with actual live LLM inference (PATH A or B).

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Check for cached GGUF models (PATH A priority):
            ls ~/.cache/huggingface/hub/ 2>/dev/null | grep -i "Qwen3.6-35B\|gemma-4-26B\|gemma-4-31B"
            Record: gguf_model_found (true/false), gguf_model_name (first match)
         b. Check llama_cpp (PATH A requirement):
            .venv/bin/python -c "from llama_cpp import Llama; print('llama_cpp OK')" 2>/dev/null || echo "llama_cpp not available"
         c. Check transformers (PATH B fallback):
            .venv/bin/python -c "import transformers; print(transformers.__version__)"
         d. Check PATH C fallback:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         All PATH checks recorded in preconditions_checked. Proceed regardless of PATH A/B availability.

      1. PATH A attempt (llama_cpp + cached GGUF):
         If gguf_model_found AND llama_cpp available:
           a. Load the cached GGUF model:
              model = Llama(model_path=gguf_path, n_gpu_layers=-1, n_ctx=2048)
