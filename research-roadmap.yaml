        prm_catches_carnot_misses: { principle: "The symmetric direction — honest accounting of where the generative PRM is the one adding value (Carnot is not strictly dominant)." }
        union_catch_rate: { principle: "Best-of-both catch; the lift over the best single verifier is the deployable value of running both." }
        union_lift_over_best_single: { principle: "Bare float — union_catch_rate minus max(B_alone, carnot_alone); the headline complementarity number." }
        cost_note: { principle: "Qualitative — the ensemble is non-LLM so the union is near-free over B; NOT a fabricated wall-time (no timing claim without a real measurement)." }
