  - id: "exp3247-selected-python-cuda-root-cause-surgery-v1"
    milestone: "2026.05.301"
    title: "Selected-Python CUDA root-cause surgery ledger"
    deliverable: "results/experiment_3247_selected_python_cuda_root_cause_surgery_v1.json"
    priority: "critical"
    requires_gpu: true
    max_turns: 100
    model: "opus"
    estimated_wall_time_min: 35
    prior_failures:
      - experiment_id: "exp3236-isolated-cuda-python-smoke-v1"
        verdict: "complete: cuda_python_smoke_passed=false; selected_python_torch_cuda_unavailable; cuda_bindings_runtime_no_devices"
        addressed_by: "This task performs root-cause surgery and environment isolation before the next smoke, rather than repeating the same selected-Python probe."
        retire_if_same_verdict: true
      - experiment_id: "exp3220-hermetic-cuda-runtime-repair-ledger-v1"
        verdict: "blocked_cuda_runtime: cuda_receipt_ready_candidate=false; recommended_next_action=repair_system_driver_cuda_runtime_boundary"
        addressed_by: "This task uses .300's selected-Python failure fields to distinguish driver visibility, Python environment, PyTorch CUDA, and cuda.bindings runtime causes."
        retire_if_same_verdict: true
      - experiment_id: "exp3207-llama-cpp-cuda-rebuild-clean-subprocess-v1"
        verdict: "blocked_selected_python_torch_cuda: selected_python_torch_cuda_unavailable"
        addressed_by: "This task does not rebuild llama.cpp; it first repairs or isolates the selected Python CUDA layer that blocked prior llama.cpp work."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      You are in {project_root} on {date}. The .300 runtime chain stopped at exp3236: selected Python could not initialize CUDA, and downstream llama.cpp/SOTA tasks correctly skipped. This is a hardware/runtime root-cause ledger and safe repair attempt. It may fail honestly; the output must still be useful for gating.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - CODEX.md
      - research-hardware-wishlist.md
      - scripts/experiment_template.py
      - results/experiment_3235_cuda_driver_boundary_operator_package_v1.json
      - results/experiment_3236_isolated_cuda_python_smoke_v1.json
      - results/experiment_3245_capstone_v300.json
      - ops/status.md
      - ops/conductor-log.md

      TASK:
      Create results/experiment_3247_selected_python_cuda_root_cause_surgery_v1.json with a precise root-cause classification, safe repair actions attempted, and a downstream next_smoke_allowed gate for exp3248.

      CONCRETE STEPS:
      1. PRECONDITION STEP 0: Record nvidia-smi visibility, selected Python path, Python version, torch version, torch CUDA build, cuda.bindings import status, CUDA_VISIBLE_DEVICES, LD_LIBRARY_PATH, and any active virtual environment. Set preconditions_checked=true only after these checks are captured.
      2. Compare .300 exp3236 failure fields against the live environment; classify the failure as driver_absent, selected_python_env_mismatch, torch_cuda_build_mismatch, cuda_bindings_runtime_failure, permission/device_visibility_failure, or unresolved.
      3. Attempt only safe, non-destructive repairs inside the selected project environment or an explicitly named throwaway environment. Do not uninstall system drivers and do not use destructive package operations.
      4. If a repair candidate is found, run the smallest torch.cuda and cuda.bindings subprocess probes needed to justify next_smoke_allowed=true.
      5. Write the artifact with exact commands, stdout/stderr excerpts, return codes, root-cause class, and recommended next task.

      REQUIRED ARTIFACT FIELDS:
      - experiment_id: exp3247
      - task_id: exp3247-selected-python-cuda-root-cause-surgery-v1
      - milestone: 2026.05.301
      - inference_substrate: hardware_smoke
      - principle_annotations
      - preconditions_checked
      - cuda_root_cause_class
      - selected_python_path
      - selected_python_torch_cuda_available_before
      - cuda_bindings_device_count_before
      - repair_actions_attempted
      - selected_python_torch_cuda_available_after
      - cuda_bindings_device_count_after
      - selected_python_cuda_repaired_candidate
      - next_smoke_allowed
      - random_seed
      - reproducibility_checksum
      - protected_files_untouched
      - honest_verdict

      honest_verdict must begin with "complete:" even if next_smoke_allowed=false; represent the block in fields.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

