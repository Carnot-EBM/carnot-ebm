- id: exp1063-envguard-selfheal-repair-v1
  milestone: 2026.04.83
  deliverable: results/experiment_1063_envguard_selfheal_repair.json
  title: "EnvPropagationGuard Self-Heal Repair v1 + Fix 1 Remaining Failing Test (UNCONDITIONAL MANDATORY FIRST)"
  model: opus
  prompt: |
    CONTEXT:
    This is the UNCONDITIONAL MANDATORY first experiment for milestone .83. It has NO gate dependency
    and must run before all other experiments.

    Milestone .82 produced a new failure mode. The conductor log shows:
      00:53Z SKIP: "Pre-tests failing, self-heal failed: EnvPropagationGuard failed to load CARNOT_ variables"
      01:04Z SKIP: "Pre-tests failing, self-heal failed: EnvPropagationGuard failed to load CARNOT_ variables"

    The conductor's pre-test self-heal hook calls EnvPropagationGuard to try to set up the
    environment before retrying failing tests. When CARNOT_ environment variables are absent
    (as they are during normal conductor execution), EnvPropagationGuard crashes instead of
    returning gracefully. This prevents the self-heal from running AND prevents pre-test surgery
    from ever starting.

    ADDITIONALLY: KV260 experiments were SKIP x3 with "1 failed, 347 passed, 1 warning" —
    one pre-test is still failing after .82's partial cleanup. Find and fix that test too.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/env_autofix.py (EnvironmentAutoFix / EnvPropagationGuard — where is the crash?)
    - scripts/research_conductor.py (find the pre-test self-heal logic that calls EnvPropagationGuard)
    - tests/python/ (run pytest to find the 1 remaining failing test)

    TASK PART 1 — FIX ENVPROPAGATIONGUARD CRASH:
    1. Find the conductor's pre-test self-heal hook. Look for code like:
       - "_self_heal" or "self_heal" in scripts/research_conductor.py
       - Any call to EnvPropagationGuard, EnvironmentAutoFix, or env_autofix
    2. Find where it crashes: the crash is "EnvPropagationGuard failed to load CARNOT_ variables"
       which means the self-heal calls some form of .load() or .check() that raises when
       CARNOT_FORCE_LIVE, CARNOT_USE_SANDBOX, etc. are not in the environment.
    3. Fix: wrap the EnvPropagationGuard call in a try/except. If it raises, log a warning and
       continue (don't abort the self-heal). The pre-test gate should show the actual test
       failures, not a framework crash.
    4. Write a test in tests/python/test_envguard_selfheal.py:
       - envguard_graceful_when_no_carnot_vars: confirms no exception when CARNOT_ vars absent
       - self_heal_continues_after_envguard_miss: confirms self-heal completes when EnvGuard fails
    5. Run the new tests: pytest tests/python/test_envguard_selfheal.py -v

    TASK PART 2 — FIX 1 REMAINING FAILING TEST:
    1. Run pytest to find the failing test:
       pytest tests/python/ -v --tb=short 2>&1 | grep -E "FAILED|ERROR" | head -10
    2. Read the failing test file and understand what it expects.
    3. Fix the test or the implementation (never use pytest.mark.skip).
    4. Verify ALL tests pass: pytest tests/python/ -v 2>&1 | tail -5
       The final line must show "X passed" with 0 failed.

    CONCRETE STEPS:
    - grep -rn "EnvPropagationGuard\|env_autofix\|self_heal" scripts/research_conductor.py | head -20
    - grep -rn "failed to load CARNOT_\|EnvPropagationGuard" python/carnot/ | head -10
    - (read and understand the crash site)
    - (implement graceful fallback)
    - pytest tests/python/ -v --tb=short 2>&1 | grep -E "FAILED|ERROR" | head -10
    - (fix 1 remaining failing test)
    - pytest tests/python/ -v 2>&1 | tail -5
    - (write test_envguard_selfheal.py)
    - pytest tests/python/test_envguard_selfheal.py -v
    - Write results/experiment_1063_envguard_selfheal_repair.json

    ARTIFACT FIELDS:
    - envguard_crash_location: str (file:line where the crash was)
    - envguard_fix_applied: bool
    - self_heal_graceful_confirmed: bool
    - n_failing_tests_before: int
    - n_failing_tests_after: int (must be 0)
    - remaining_test_fixed: bool (True if n_failing_tests_after == 0)
    - envguard_fixed: bool (True if fix_applied AND self_heal_graceful_confirmed)
    - n_envguard_tests_written: int
    - honest_verdict: "envguard_fixed_tests_green" | "envguard_fixed_tests_partial" | "envguard_not_found" | "failed"

    Run: python scripts/experiment_1063_envguard_selfheal_repair.py
    Do NOT push. Do NOT modify scripts/research_conductor.py beyond the EnvPropagationGuard self-heal fix.

