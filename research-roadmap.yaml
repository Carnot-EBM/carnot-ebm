- id: exp7087-cold-entrance-bank-sufficiency-audit
  title: Cold entrance-bank sufficiency and headroom audit
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.621
  deliverable: results/experiment_7087_v621_entrance_bank_sufficiency_audit.json
  gated_on:
    - upstream: exp7086-chat-correct-three-family-entrance-bank
      artifact_field: entrance_proposal_bank_complete_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp7066-entrance-bank-independent-audit
      verdict: blocked_gate_check_failed
      addressed_by: "Exp7087 consumes Exp7086's canary-gated complete bank and adds family support, transport authenticity, conflict, and counterfactual-swap checks."
      retire_if_same_verdict: true
    - experiment_id: exp7081-entrance-bank-set-sufficiency-audit
      verdict: blocked_preemptive_gate_upstream_retired
      addressed_by: "Exp7087 replaces the retired V620 bank chain with Exp7086 and recomputes each chat-template, raw-byte, and exact-label receipt in a fresh process."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7086 supplies the complete proposal bank that the V619 and V620 audits
    did not receive. Evidence sufficiency is a set property. A pooled score can
    hide a missing model family, source group, entrance family, or unresolved
    parse and label conflict. This audit separates authenticity, support, and
    selector headroom.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md section "V621 planner refresh"
    - {project_root}/results/experiment_7064_v619_exact_entrance_fixture.json
    - {project_root}/results/experiment_7066_entrance_bank_independent_audit.json
    - {project_root}/results/experiment_7081_v620_entrance_bank_sufficiency_audit.json if present
    - {project_root}/results/experiment_7086_v621_three_family_entrance_bank.json
    - {project_root}/python/carnot/experiment_7064_v619_exact_entrance_fixture.py
    - {project_root}/python/carnot/experiment_7080_v620_three_family_entrance_bank.py
    - {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/openspec/capabilities/verification/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Recompute the chat-correct proposal bank in a fresh process and audit set-
    level support. Require declared entrance-family coverage and explicit
    conflict handling. Measure selector headroom without fitting or evaluating
    a learned selector.

    CONCRETE STEPS:
    0. PRECONDITIONS: require entrance_proposal_bank_complete_score=1,
       recomputed upstream and fixture hashes, readable raw checkpoints, and
       writable isolated audit paths. On failure write terminal `blocked`,
       `inference_substrate_class=blocked_no_run`, and exact
       gate_check_summary.
    1. Add REQ-VERIFY-7087 and RED tests before implementation. Test missing
       models, units, seeds, source groups, and templates; changed raw bytes;
       family deletion; source swaps; duplicated support; conflicting labels;
       counterfactual swaps; future-label leakage; and aggregate
       recomputation.
    2. In a fresh process, independently parse raw outputs and re-enumerate
       every exact entrance label and causal witness. Compare all primary rows
       with the producer output.
    3. Prove prompt, template, stop, seed, unit, budget, model identity, lease,
       CUDA, checkpoint, runner, telemetry, and cleanup parity from primary
       rows. Do not trust producer summaries.
    4. Define the required support set before reading held outcomes. For each
       source group, model, seed, and declared reachable entrance family,
       report present, missing, duplicate, conflicting, or inapplicable.
    5. Run family-deletion, source-swap, raw-byte mutation, and conflict
       attacks. Set-level readiness must fail even if a pooled proposal or
       reachability rate stays unchanged.
    6. Prove exact labels, witnesses, and solver-derived fields were absent
       from model input. Keep the exact executor as audit oracle only.
    7. Set entrance_support_audit_ready_score=1 only when authenticity, family
       sufficiency, conflict resolution, recomputation, telemetry, and leakage
       checks pass. Set entrance_selector_headroom_ready_score=1 only when at
       least 30 held units contain both reachable and unreachable proposed
       entrances and no non-oracle base control is perfect.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, scoped spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (fresh-process deterministic entrance-bank replay);
       inference_substrate_class (no_model_load, or blocked_no_run on a
       blocked precondition); duration_s; source_artifact_hashes;
       cited_upstream_artifacts; upstream_gate_rows; rows; per_game_results;
       fresh_process_rows; raw_hash_rows; parse_recomputation_rows;
       label_recomputation_rows; causal_witness_replay_rows;
       prompt_parity_rows; chat_template_parity_rows; stop_parity_rows;
       budget_parity_rows; model_identity_rows; seed_coverage_rows;
       source_group_coverage_rows; runner_receipt_rows; gpu_telemetry_rows;
       lease_cleanup_rows; required_support_schema; family_support_rows;
