      EXISTING CODE TO READ FIRST: python/carnot/models/ising/
      TASK: Implement an inertial-update ablation against Carnot sequential Gibbs.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1674_pipim.py`.
      2. Run CPU/simulator-only PIPIM ablation.
      3. Verify time-to-energy and sample-quality deltas.
      4. Write `{project_root}/results/experiment_1674_pipim.json` with field `hardware_claim_allowed: false`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

