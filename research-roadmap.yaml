- id: exp1282-sota-gguf-cache-provenance-preflight
  milestone: 2026.04.100
  deliverable: results/experiment_1282_sota_gguf_cache_provenance_preflight.json
  title: "SOTA GGUF Cache + Provenance Preflight - Prevent Exp 1271 Repeat"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 20
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prompt: |
    CONTEXT:
    Milestone .99 failed its headline SOTA certificate task before inference:
    exp1271 was blocked by missing prior-failure metadata and produced no parse rate.
    This preflight must prove whether the mandated local SOTA GGUF cache path is ready
    before downstream tasks spend GPU or agent time.

    Required local headline models:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - results/experiment_1271_triggered_certificate_extraction_sota_gguf.json
    - results/experiment_1281_milestone_retro_99.json

    TASK:
    Write a cache/provenance readiness artifact for mandated SOTA GGUF inference.
    Do not download models unless the existing resolver already performs a safe cache lookup.

    CONCRETE STEPS:
    1. Create the deliverable artifact immediately with status="in_progress".
    2. Import or inspect python/carnot/inference/sota_models.py and call cached_sota_pair(gpu_indices=(0, 1)) if import is safe.
    3. Record all three mandated model IDs, which ones are cached, model_path values, quantization suffixes, and whether cached_sota_pair() returns two loadable MODEL_SPECS.
    4. Record the exact prior failure that this preflight addresses: exp1271 blocked_gate_check_failed / DOOMED_RERUN_BLOCK due to missing prior_failures.
    5. Write cached_sota_ready=true only if at least one mandated SOTA GGUF is cached and cached_sota_pair() returns non-null specs. Otherwise write cached_sota_ready=false and missing_models.
    6. Include provenance_ok, model_specs_preview, headline_result_possible, status="complete", and honest_verdict.

    Run: python3 -c "import json; d=json.load(open('results/experiment_1282_sota_gguf_cache_provenance_preflight.json')); print(d.get('cached_sota_ready'), d.get('headline_result_possible'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1283-certificate-grammar-backend-bakeoff
  milestone: 2026.04.100
  deliverable: results/experiment_1283_certificate_grammar_backend_bakeoff.json
  title: "Certificate Grammar Backend Bakeoff - llama.cpp vs llguidance vs XGrammar"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 35
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prompt: |
    CONTEXT:
    .99 proved that the next expensive SOTA certificate run needs a bounded structured
    certificate substrate first. Recent sources add constraints: XGrammar/llguidance are
    practical local backends, Grammar-Aligned Decoding warns about grammar projection tax,
    CDoT covers context-sensitive certificate obligations, STATIC covers trie/vectorized
    bounded vocabularies, and ABS gives a DFA/automata fallback.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - python/carnot/inference/sota_models.py
    - scripts/experiment_template.py
    - research-references.md
    - openspec/change-proposals/research-roadmap-vNEXT.md

    TASK:
    Select the lowest-friction local grammar backend for <CARNOT_CERT> tails or write a
    complete blocker artifact. Do not run LLM inference.

    CONCRETE STEPS:
    1. Create the deliverable artifact immediately with status="in_progress".
    2. Define a minimal Carnot certificate JSON schema with claims, equations, final_answer, confidence, verifier_routes, and proof_numbers fields.
    3. Probe availability of llama.cpp GBNF support, llguidance, xgrammar, outlines/lm-format-enforcer if present, and a pure-Python validation fallback.
    4. For each backend, record import/CLI availability, schema support, unsupported features, estimated overhead if measurable, and failure reason if absent.
    5. Add cdot_expressiveness_note for context-sensitive invariants that are not expressible in the selected backend.
    6. Add static_trie_note, bounded_vocab_constraint_count, automata_fallback_viable, dfa_checkable_fields, structure_snowballing_risk, grammar_backend_available, grammar_backend_selected, status, and honest_verdict.

    Run: python3 -c "import json; d=json.load(open('results/experiment_1283_certificate_grammar_backend_bakeoff.json')); print(d.get('grammar_backend_available'), d.get('grammar_backend_selected'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

