  title: Bind fourteen complete authorities and ingest the new method limits
  phase: 1
  track: reporting
  priority: high
  requires_gpu: false
  max_turns: 20
  estimated_wall_time_min: 25
  per_unit_rows: true
  milestone: 2026.09.660
  deliverable: results/experiment_7546_v660_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  prior_failures:
  - experiment_id: exp7532-contract-methods
    verdict: complete_blocked_incomplete_v659_authorities
    addressed_by: The new pair contains all fourteen rows before staging; use legal execution_venue=host and preserve the
      flagged prior record.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.660. V659 ended with eight actual tasks, a qualified count prototype/tool protocol and blocked model admission. This milestone has exactly fourteen tasks; CPU learning and board continuity are independent of fresh GPU collection. Read the V660 design for the frozen statistical and evidence boundaries.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/experiment_7358_v646_validation_contract.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/python/carnot/experiment_7532_v659_contract_methods.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/research-roadmap.yaml
    - {project_root}/research-roadmap-next.yaml
    - {project_root}/research-references.md
    - {project_root}/research-studying.md
    - {project_root}/ops/known-issues.md
    - {project_root}/results/experiment_7532_v659_contract_methods.json
    - {project_root}/results/experiment_7535_v659_native_pilot.json
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7546_v660_contract_methods.json. Create scripts/experiments/experiment_7546_v660_contract_methods.py as a thin CLI, reusable behavior in python/carnot/experiment_7546_v660_contract_methods.py, and tests/python/test_experiment_7546_v660_contract_methods.py. These are paths to create, not prerequisite files. Read same-milestone inputs from the exact upstream deliverable paths in this roadmap.

    CONCRETE STEPS:
    1. PRECONDITIONS: immediately print a flushed progress line. Check required input paths, REQ-* specifications and resource availability before measurement. A same-milestone artifact is read only after its producer runs. Missing external prerequisites produce complete_blocked_<reason>, verdict_class=blocked and gate_check_summary with exact upstream, path/field, expected and observed value; no fabricated fallback.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER EVERY model load, generation, benchmark or subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed at least every 60 seconds. Stream child stdout unbuffered and emit truthful pending-operation heartbeats every 60 seconds. Keep EVERY gap below 600 seconds: silence can kill a task at 1200 seconds; continuous progress permits the 4800-second hard cap. Checkpoint and stop only owned processes.
    3. Keep every tool call bounded. Write ANY file over about 200 lines in several tool calls of about 100-150 lines, with a progress message between calls. Split source, tests, reads and validation into separate calls. Never compose a whole large module and test suite in one call; child heartbeats cannot show progress while the agent composes the call.
    4. Before implementation extend the relevant OpenSpec REQ-* and SCENARIO-* items and write meaningful failing tests. Reuse established numerical, validation, lifecycle and runner helpers; keep the CLI thin. Preserve tests, assertions and historical artifacts. Scratch files belong in /tmp, reusable code in python/carnot and tests in tests/python.
    5. Declare planned inference_substrate_class=aggregation. Use MODEL_SPECS=[]. No-load work records model_invoked=false and zero current calls. Native option forwards generate zero tokens; any small fixed-token canary is model_bounded_generation (10s), and only real generative runs are model_full_generation (60s). A model call that never starts uses blocked_no_run with the planned class retained separately. Never misclassify or pad duration.
    6. Compare exactly fourteen ordered tasks exp7546 through exp7559 in the design table and the YAML for 2026.09.660 (staged before activation, active after it). Compare full IDs, titles, phases, deliverables, substrates and every gate. In private copies reject removed/reordered tasks, changed titles/paths/substrates and misspelled upstream fields. Do not use this advisory receipt as a global scientific gate.
    7. Preserve the eight actual V659 dispositions, its six unissued promises exp7540-exp7545, the flagged Exp7532 host_cpu venue, and the Exp7535 zero-call owned-GPU block. Read pre-gate diagnostics at results/experiment_7536_fit_capture.json and results/experiment_7537_eval_capture.json when their scheduled deliverables are absent. Absent Exp7538/7539 outputs are not zero metrics. The completed ledger ends at V658 at planning time; do not invent V659 archive entries.
    8. Ingest three to five primary method sections from the dated V660 references, including SAFE source ablation, adversarial world-model sequences and online proper-loss recalibration. Write docs/research-notes/v660-method-map.md and update research-studying.md with destinations, counterexamples and access limitations. Preserve Semantic Scholar HTTP 429 and OpenReview browser challenges as incomplete access.
    9. Run unchanged schema, prior-failure, exclusion, gate, ARC-floor, harness-fit and overdue-priority checks. Preserve E0 as operator-blocked and E6 as resolved. Report publication_gate.py --json G1-G4 without publication. This task qualifies the current complete pair; it does not rewrite the prior failed artifact.
    10. Freeze the affected-file validation manifest and prove imports resolve to this worktree. Run scoped pytest -n 0 -o addopts= --no-cov with a private --basetemp; separately require 100 percent changed-module coverage with command-local COVERAGE_FILE. Run scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Reuse Exp7358/Exp7303 helpers. Record unrelated repository debt separately; never require a green unscoped suite before model admission.
    11. Run the declared entrypoint and fresh-process cold replay as capability E2E. Learning must exercise predict-release-update-persist-reload. Shared training/sampler changes also require E2E-001/002; binding or cross-language serialization changes require E2E-003/004. ARC policy/transport changes require E2E-009/010 and telemetry changes E2E-011/012/013 as applicable, plus the private LLM-off real-environment smoke from ops/e2e-test-plan.md. Read-only ARC/reporting work has no applicable numbered runtime E2E. Record actual command results.
    12. Independently reduce comparative rows and run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Require both exits to succeed before positive promotion. Required validation failure is disqualified; a valid lack of benefit is null; unchanged external absence is blocked. partial means only retryable unfinished OWN work. Keep explicit positive_claim=false and no_headroom annotations when warranted. Publish atomically after checks; checkpoints stay outside the terminal path.
    13. Reconcile affected OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md to actual evidence. Keep terminal artifacts below 20 MiB through hash-bound sidecars. Preserve Qwen weights and production defaults. Do not activate/archive a roadmap, change research-roadmap.yaml, submit a scored kernel, publish externally or contact anyone.

    ACCEPTANCE GATES:
    - Validity: required scoped checks, raw custody and independent cold replay pass. principle: invalid evidence cannot support science.
    - Readiness: named ready/complete fields are bare numeric 0/1, independent of effect. principle: a valid null remains auditable.
    - Benefit: meet every task-specific effect, support and uncertainty criterion above. principle: insufficient evidence cannot become promotion.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id: principle: "Bind the exact task ID, milestone 2026.09.660 and run_date={date}."
    - preconditions_checked: principle: "Record required inputs and current resource observations before compute."
    - MODEL_SPECS: principle: "Also emit model_specs; new LLM work names unsloth/Qwen3.8-27B-GGUF and resolved file/hash/quantization/runtime; no-load tasks use []."
    - model_invoked: principle: "Typed invocation_counts record attempted/completed/failed/cancelled current loads, forwards and generations; historical calls are separate."
    - inference_substrate_class: principle: "Actual work determines the floor: full_generation 60s, bounded_generation 10s, load_no_generation 2s. Never pad time."
    - inference_substrate: principle: "Aggregation is exactly aggregation_from_upstream_artifacts; native option forwards use live_llm_embedding_extraction with readout_kind=option_logits and zero generated tokens."
    - execution_venue: principle: "Use the legal host enum for host CPU and CUDA work; record device/compute details separately, never host_cpu."
    - duration_s: principle: "Measure monotonic current work with phase_spans and process identity; distinguish authoring, validation and historical time."
    - random_seed: principle: "Freeze all fitting, ordering, sampling and bootstrap seeds before outcomes."
    - reproducibility_checksum: principle: "Bind code, role/settings manifests, source_artifact_hashes, model identity when used, and raw rows."
    - rows: principle: "Each compared source/event/game/arm/trial has absolute metrics and a disposition; missing is not zero."
    - sample_size_budget: principle: "Retain planned, attempted, completed, excluded, failed, censored and unstarted independent units."
    - acceptance_gate_results: principle: "Every validity/support/benefit gate records expected, observed, op, passed and principle; readiness is not benefit."
    - gate_check_summary: principle: "Every blocked result names failed check, exact upstream/path/field and expected versus observed value, including absent/null."
    - honest_verdict: principle: "Use complete_ terminal prefixes including complete_blocked_; quote historical verdicts literally."
    - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial; external absence is blocked, never partial."
    - verifier_is_oracle: principle: "Oracle-defined fixture gains cannot exceed circular_positive; probabilistic confidence is not a correctness proof."
    - flagged_adversarial: principle: "Retain actual flags and corrections; do not clear a determination to open a gate."
    - validation_receipts: principle: "Store exact command scopes, exit codes, output hashes, cold replay and independent reductions."
    - field_principles: principle: "Every emitted artifact field and acceptance gate carries the failure it prevents."
    - contract_ready_score: principle: "Bare 0/1 requires exact agreement and all contract mutations rejected."
    - method_ingestion_complete_score: principle: "Read primary methods before changing their scientific interpretation."
    - prior_dispositions: principle: "Record all eight actual tasks and six unissued promises separately."
    - publication_gates: principle: "Use the unchanged G1-G4 definition; never substitute a blocker count."

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} .venv/bin/python -u scripts/experiments/experiment_7546_v660_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
