  - id: exp4314-cross-domain-selector-ir3de-cascal
    milestone: 2026.06.399
    title: "PHASE A1 (CLOSE THE CROSS-DOMAIN SELECTION MOAT; rebuild the underpowered exp4305) -- a domain router + per-domain set-encoder that generalizes selection to a HELD-OUT DOMAIN, rebuilt with the flagged SOTA + more power. .398 (exp4305) reported a POSITIVE point estimate (cross_domain_delta +0.231) but CI95 [-0.115,0.538] INCLUDED 0 (underpowered, NOT refuted); label_ablation_robust=true (no domain-label leak); GAP-CROSS-DOMAIN-FAMILY-INVARIANT-SELECTION-4305 logged. The .398 SOTA ingestion (exp4309) + the .399 sweep flagged the precise upgrades: (1) replace the nearest-centroid router with an IR3DE LINEAR domain-expert router (ridge regression over normalized selector features, leave-one-domain-out; arXiv:2606.06098); (2) add CASCAL GENERATED-DATA synthetic-task pretraining (train-only synthetic selector tasks from domain descriptions, query-only routers, no target labels; arXiv:2601.09692) for more router training signal; (3) add ContextPRM domain-AGNOSTIC step-COHERENCE features (verify the logical connection, not the domain fact; arXiv:2509.24460) as the domain-invariant discriminator; (4) MORE held-out tasks (>=~24) for power. Keep the LABEL-ABLATION anti-leak arm + the non-degenerate guards (vote@1>0.05, oracle<1.0, delta<0.95) so the adversarial_verify DEGENERATE_SEPARATION check does not fire. Domains: ARC families + ARC-GEN generators (reuse exp4291's non-degenerate pool) + FoVer-step/math (NOT code -- exp4319 owns code-execution). Emit cross_domain_selection_holds BARE bool := (held-out-domain delta>0 AND CI95-excl-0 AND non-degenerate guards AND label_ablation_robust). verifier_is_oracle=false. A held-out-domain win escapes the math/ARC domain bound (the strongest selection result yet); a powered collapse is a genuine, decision-grade scope boundary. HARD-CAP to the window; an honest partial (>=3 domains, >=1 held-out, >=~16 held-out tasks) is fine."
    priority: critical
    track: verifier-oracle-distinct
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-14 P0 (oracle-distinct frontier: a learned verifier capturing headroom where execution is NOT the oracle, matched control, CI95-excl-0) + the .398 exp4309 SOTA-ingestion flag (IR3DE/CASCAL cross-domain rebuild) -- false-positive scope-match vs the RETIRED GAP-3 trained-content-energy ARC selector (exclusion_manifest gap3_trained_content_energy_selector_retired_stage2v2): this is the NON-retired SET-ENCODER selection lineage (exp4271/4291/4305, proven within-ARC), NOT a content-energy EBM ranking TRM candidates; forward difference = an IR3DE linear router + CASCAL generated-data pretrain + ContextPRM coherence features closing the exp4305 underpowered cross-DOMAIN gap. verifier_is_oracle=false."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4314_cross_domain_selector_ir3de_cascal.json
    prior_failures:
      - experiment_id: exp4305-cross-domain-selector-generalization
        verdict: complete_cross_domain_selection_collapses_domain_bound
        addressed_by: "exp4305's held-out-domain delta was POSITIVE (+0.231) but UNDERPOWERED (CI95 [-0.115,0.538] incl 0); label_ablation_robust=true (no leak). This is NOT a refuted negative -- it is an underpowered-positive with a clean harness, so the root cause is method-power, not a dead idea. This attempt changes the METHOD (an IR3DE linear domain-expert router 2606.06098 replacing the nearest-centroid router that underpowered) + adds CASCAL generated-data synthetic-task pretraining 2601.09692 (more router training signal without target labels) + ContextPRM domain-agnostic coherence features 2509.24460 (the domain-invariant discriminator GAP-CROSS-DOMAIN-FAMILY-INVARIANT-SELECTION-4305 called for) + MORE held-out tasks for power. If the CI STILL includes 0 with these upgrades AND a powered n, the moat is genuinely math/ARC-domain-bound -- a real, decision-grade scope boundary -- and the ask is retired (the cross-domain selection moat is bounded; pivot to the in-generation + efficiency-deploy axes)."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: the selection moat holds WITHIN ARC (cross-family .395 +0.40, cross-generator .397 +0.50, both
      oracle-distinct, CI95-excl-0) but cross-DOMAIN is UNDERPOWERED-OPEN (exp4305 +0.231, CI incl 0). The deep open
      question: does the verifier's selection value transfer to a HELD-OUT DOMAIN, or is it math/ARC-domain-bound
      (memory verifier-domain-bound-math-only)? exp4305 had a clean harness (label-ablation robust) but too little
      power + a weak router. The flagged fixes: an IR3DE linear domain-expert router (2606.06098) + CASCAL generated-data
      pretraining (2601.09692) + ContextPRM domain-AGNOSTIC step-coherence features (2509.24460, "verify the logical
      connection not the domain fact"). The anti-leak trap stays: prove the router is not reading the domain label
      (LABEL-ABLATION arm). A held-out-DOMAIN win is the strongest, hardest selection result; a powered collapse is a
      genuine scope boundary (decision-grade, consistent with the domain-bound finding -> retire the ask).

      EXISTING CODE TO READ FIRST:
        - results/experiment_4305_cross_domain_selector_generalization.json (the UNDERPOWERED-OPEN result to rebuild: +0.231, CI incl 0, label_ablation_robust=true, the harness shape + the per-domain reads)
        - results/experiment_4291_arcgen_cross_generator_nondegenerate.json + results/experiment_4291_arcgen_generator_manifest.json (the non-degenerate ARC-GEN pool to REUSE as one domain)
        - results/experiment_4271_arc_cross_family_transfer_existing_pool.json + results/experiment_4270_arc_family_manifest.json (the ARC families domain)
        - results/experiment_4244_arc_set_encoder_aggregator_build.json + _model.json (the set-encoder to retrain per domain-split)
        - the FoVer-step selection corpus (the math/step-selection domain -- find the cached FoVer candidate pool used by the verifier-scoring experiments)
        - scripts/exp_verifier_detector_auroc.py, scripts/adversarial_verify.py (with the DEGENERATE_SEPARATION + DEGENERATE_CONTROLS checks), scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification + Sample-Size Rigor", "Missing-Verifier Gap Logging"

      TASK: rebuild the cross-DOMAIN router with IR3DE + CASCAL + ContextPRM features over >=3 domains; run the held-out-DOMAIN beats-vote gate (powered) + the label-ablation.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any analysis):
           a. The ARC-families pool, the exp4291 ARC-GEN pool, AND a FoVer-step/math selection pool all load. CPU
              sufficient; no GGUF/GPU. If a domain pool is missing -> use the available domains and SAY which (>=3
              domains needed for a held-out-DOMAIN test; if <3 -> honest_verdict `blocked_insufficient_domains` and STOP).
           b. The set-encoder loads.
        1. Assemble a CROSS-DOMAIN pool: each row carries a domain_id (arc / arcgen / fover) + a family/generator id +
           exact target_hash. Per domain, realistic candidate counts so vote@1>0.05 and oracle@K<1.0 (real headroom).
           Build the router as an IR3DE LINEAR domain-expert router (ridge regression over normalized selector features,
           2606.06098) + CASCAL generated-data synthetic-task pretraining (train-only synthetic selector tasks, query-only,
           no target labels, 2601.09692) + ContextPRM domain-AGNOSTIC step-coherence features (2509.24460). Train on
           TRAIN domains; FREEZE a HELD-OUT DOMAIN. Use MORE held-out tasks (>=~16, ideally >=24) for power. HARD-CAP to
           fit the window; an honest partial (>=3 domains, >=1 held-out, >=~16 held-out tasks) is fine. Persist the pool + manifest.
        2. On the HELD-OUT DOMAIN compute router+set_encoder@1, vote@1, oracle@K, matched control. Report
           cross_domain_delta + task-level bootstrap CI95 (>=2000 resamples) + per-domain held-out reads SEPARATELY.
        3. LABEL-ABLATION (anti-leak, load-bearing): re-run the router with the domain/family label REMOVED from its
           input (features only). If accuracy SURVIVES -> label_ablation_robust=true (uses task structure, not domain
           identity). If it COLLAPSES -> label_ablation_robust=false (the 'win' was reading the label -- NOT a real moat).
        4. Emit cross_domain_selection_holds BARE bool := (held-out-domain delta>0 AND CI95-excl-0 AND vote_at_1>0.05
           AND oracle_at_k<1.0 AND delta<0.95 AND label_ablation_robust). Run adversarial_verify.py (clean;
           verifier_is_oracle=false; DEGENERATE_SEPARATION must NOT fire). If the moat does NOT hold, LOG a missing-verifier
           gap (cross-domain family-invariant selection -- update GAP-CROSS-DOMAIN-FAMILY-INVARIANT-SELECTION-4305) per
           Missing-Verifier Gap Logging. Declare random_seed + reproducibility_checksum + model_specs (the 3-domain
           provenance + the IR3DE router + CASCAL pretrain + ContextPRM features + the domain-disjoint split).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A cross-domain survive (the moat escapes the domain bound), a POWERED collapse (the moat is domain-bound -> retire the ask), a label-ablation failure (the router read the label), and an honest blocked_insufficient_domains are ALL COMPLETE and decision-grade."
        cross_domain_selection_holds:
          principle: "BARE bool: the capstone reads this (gated-fields-must-be-bare); true iff held-out-DOMAIN router+set_encoder@1 - vote@1 > 0 AND CI95-excl-0 AND non-degenerate guards AND label_ablation_robust -- the strongest selection result (escapes the math/ARC domain bound)."
        cross_domain_delta:
          principle: "BARE float: held-out-DOMAIN router+set_encoder@1 - vote@1 -- compare to exp4305's +0.231 (the IR3DE+CASCAL upgrade should tighten the CI; a positive held-out delta with CI95-excl-0 is the cross-domain moat)."
        cross_domain_delta_ci95:
          principle: "Task-level bootstrap CI95 (>=2000 resamples) of the held-out delta -- excluding 0 is the decision-grade close (exp4305's [-0.115,0.538] included 0)."
        vote_at_1:
          principle: "BARE float: the vote baseline on the held-out domain -- MUST be > 0.05 (if 0, the pool is wrong-majority-only and the delta is degenerate)."
        oracle_at_k:
          principle: "BARE float: positive-control ceiling on the held-out domain -- MUST be < 1.0 (a sub-1.0 ceiling is real headroom the verifier must earn)."
        label_ablation_robust:
          principle: "BARE bool: true iff held-out accuracy SURVIVES removing the domain/family label from the router input -- the anti-leak proof (the moat must use task structure, not domain identity)."
        per_domain_delta:
          principle: "The lift reported SEPARATELY per held-out domain (arc / arcgen / fover) -- guards the one-domain-dominates failure mode."
        verifier_is_oracle:
          principle: "BARE bool=false -- a learned IR3DE router + set-encoder over cross-domain pools, no demo execution (oracle-distinct)."
        random_seed:
          principle: "Determinism precondition; the cross-domain sampling + domain-split + CASCAL synthetic-task generation reproducible."
        reproducibility_checksum:
          principle: "Hash of the cross-domain pool + the domain manifest + the IR3DE router + the CASCAL synthetic set; lets a third party re-run."
        model_specs:
          principle: "The 3-domain provenance + the IR3DE linear router + the CASCAL pretrain + the ContextPRM coherence features + the domain-disjoint split + the label-ablation protocol; required methodology."
      ACCEPTANCE GATE:
        - condition: "cross_domain_selection_holds + cross_domain_delta + cross_domain_delta_ci95 + vote_at_1 + oracle_at_k + label_ablation_robust + per_domain_delta reported AND verifier_is_oracle=false AND non-degenerate (vote_at_1>0.05 AND oracle_at_k<1.0), OR an honest blocked_insufficient_domains / powered-collapse verdict"
          principle: "A powered held-out-DOMAIN selection win (IR3DE+CASCAL closing the exp4305 underpowered gap) escapes the verifier's math/ARC domain bound (the strongest selection result yet); a POWERED collapse + a logged gap is a genuine boundary that retires the ask; a label-ablation failure catches a leak -- all decision-grade, none churn."

      Run: `python3 {project_root}/results/experiment_4314_cross_domain_selector_ir3de_cascal.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4315-diffusiongemma-reward-guided-stitching
    milestone: 2026.06.399
    title: "PHASE B1 (CLOSE THE IN-GENERATION MOAT; rebuild the underpowered exp4304 w/ a stronger architecture) -- DiffusionGemma in-generation, external-PRM REWARD-GUIDED STEP-STITCHING, must-beat the self-reward SMC intrinsic baseline. .398 (exp4304) had a CLEAN harness (controls_differentiated=true, scorer_leak_recheck_passed=true) and a POSITIVE point estimate (carnot_minus_best_control_delta +0.133) but CI95 [-0.067,0.367] INCLUDED 0 (underpowered, NOT refuted). The .399 sweep flagged the architecture upgrade: instead of a single guided pass, use REWARD-GUIDED STITCHING (arXiv:2602.22871) -- sample DIVERSE diffusion reasoning trajectories, score EVERY intermediate step with the exp4292 external partial-state scorer, and STITCH the highest-scoring steps into a composite (+23.8% in the paper). CRITICAL must-beat baseline (arXiv:2602.01849, the .399 sweep): SELF-REWARD SMC -- a particle filter using the model's OWN trajectory self-confidence (NO external scorer) -- so the moat now means Carnot's EXTERNAL verifier beats the model's INTRINSIC self-confidence -- the sharpest oracle-distinct test in generation. Keep: (1) an INDEPENDENT leak re-check on the exp4292 scorer, (2) >=1 genuinely-engaged non-Carnot control (RFG enhanced!=reference at gamma>0, 2509.25604, OR EntRGi 2602.05000) + the exp4308 DEGENERATE_CONTROLS no-op guard, (3) MORE power (n>=40 per arm). Emit diffusiongemma_guidance_moat BARE bool := (Carnot-stitched - best-engaged-control > 0 AND CI95-excl-0 AND controls_differentiated AND beats self-reward SMC). verifier_is_oracle=false. NO TRM training; NO leaderboard submission; DiffusionGemma via the llama.cpp PR binary."
    priority: critical
    track: diffusiongemma-scaleup
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-13/2026-06-14 gated forward-queue (DiffusionGemma) + the 2026-06-16 .399 sweep (reward-guided STEP-STITCHING 2602.22871 + the self-reward SMC must-beat baseline 2602.01849) -- the spec gate (diffusiongemma-energy-guided-diffusion-spec.md THE GATE) requires an oracle-distinct learned-verifier win with a matched control. False-positive scope-match vs exp4304 (.398 run, UNDERPOWERED-POSITIVE OPEN, NOT retired) / exp4293 (.397 degenerate controls, addressed in .398) / exp4281 (.396 partial-state blocked); forward difference = a STRONGER architecture (reward-guided step-stitching over diverse trajectories, NOT a single guided pass) + a SHARPER must-beat baseline (self-reward SMC = the model's intrinsic confidence) + MORE power. verifier_is_oracle=false."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4315_diffusiongemma_reward_guided_stitching.json
    prior_failures:
      - experiment_id: exp4304-diffusiongemma-in-generation-engaged-controls
        verdict: complete_diffusiongemma_guidance_bounded_null_vs_engaged_control
        addressed_by: "exp4304's carnot_minus_best_control_delta was POSITIVE (+0.133) but UNDERPOWERED (CI95 [-0.067,0.367] incl 0); the harness was CLEAN (controls_differentiated=true, scorer_leak_recheck_passed=true). This is an underpowered-positive with a sound harness, not a refuted negative, so the root cause is architecture-strength + power. This attempt changes the ARCHITECTURE -- external-PRM REWARD-GUIDED STEP-STITCHING (2602.22871: score every intermediate step, stitch the best, over DIVERSE trajectories) replacing the single guided pass -- adds the self-reward SMC intrinsic-confidence must-beat baseline (2602.01849), keeps the engaged controls + the exp4308 no-op guard + the leak re-check, and raises n per arm. If the CI STILL includes 0 with the stronger architecture + power, the in-generation moat is genuinely bounded on this corpus -- a real, decision-grade null -- and the ask is retired (the verifier ranks but does not steer generation here)."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: north-star §5 -- does the EXTERNAL energy verifier IMPROVE GENERATION when wired into a 26B
      discrete-diffusion LLM's denoising loop, beating not just an engaged guidance baseline but the model's OWN
      intrinsic self-confidence? exp4304 had a clean harness + a positive point estimate but too little power. The
      .399 architecture upgrade (2602.22871): sample DIVERSE diffusion reasoning trajectories, score EVERY
      intermediate step with the exp4292 external partial-state scorer, STITCH the highest-scoring steps. The sharpest
      must-beat baseline (2602.01849): self-reward SMC -- a particle filter using the model's OWN trajectory
      self-confidence, NO external model -- so the moat means "Carnot's external verifier beats intrinsic confidence"
      (the oracle-distinct test in generation). The operator was TWICE-burned by premature DiffusionGemma over-claims
      (.396/.397); this is skeptic-proof by construction (engaged controls + a no-op guard + a leak re-check + a
      sharper baseline). Architectural prior: EDLM 2410.21357 (EBM corrects diffusion; Carnot's external verifier is the diff).

      EXISTING CODE TO READ FIRST:
        - results/experiment_4304_diffusiongemma_in_generation_engaged_controls.json (the UNDERPOWERED-OPEN result to rebuild: +0.133, CI incl 0, the four-condition harness + the engaged-control construction + the no-op guard to reuse)
        - results/experiment_4292_partial_state_diffusion_scorer_build.json + the persisted scorer module (the partial-state scorer to wire as the STEP reward + re-check)
        - docs/research-notes/exp4293-in-generation-moat-degenerate-controls-audit-2026-06-16.md (the engaged-controls + no-op-guard + leak-re-check requirements)
        - scripts/exp_diffusiongemma_energy_prior_extract.py + results/diffusiongemma_energy_prior_extracted.json (the PR-binary call: llama-diffusion-gemma-eval <gguf> <prompt_ids.i32> <canvas_ids.i32> <out_logits.bin>; canvas=256 mask tokens id=4; vocab 262144)
        - docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md (THE GATE + the guidance design)
        - scripts/experiment_template.py (cached_sota_pair), scripts/adversarial_verify.py (with the NEW DEGENERATE_CONTROLS check from exp4308), scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Pre-Launch Preconditions", "Inference-Substrate Declaration", "GGUF tokenizer rule", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: run the DiffusionGemma reward-guided STEP-STITCHING benchmark with the re-checked partial-state scorer, must-beat self-reward SMC + an engaged control + the no-op guard; report guided-vs-baselines deltas + the moat verdict (powered).

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any inference):
           a. PR binary: `ls ~/.cache/llama.cpp-master/build/bin/llama-diffusion-gemma-eval` non-empty.
           b. DiffusionGemma GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--diffusiongemma-26B-A4B-it-GGUF/` non-empty. 1x RTX 3090 fits the Q4_K_M (16GB).
           c. The exp4292 scorer module loads AND its artifact has partial_state_scorer_built==true.
           d. The conductor is stood-down on TRM training; this task does NO TRM training and does NOT touch results/trm_runs/.
           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate inference.
        1. INDEPENDENT LEAK RE-CHECK on the exp4292 scorer (the AUROC 0.966 yellow flag): on a fresh held-out fixture,
           re-ablate the answer-bearing cells. If the scorer's signal COLLAPSES to chance with the answer masked ->
           emit scorer_leak_recheck_passed=false + honest_verdict `scorer_leaky_rebuild_needed` and STOP (the
           in-generation moat stays OPEN with a named blocker). If the signal SURVIVES -> scorer_leak_recheck_passed=true; proceed.
        2. WINDOW DISCIPLINE: run synchronously, checkpoint after EVERY trajectory, print per-task progress (the codex
           idle-timeout fix, memory powering-run-background-mechanism-fails). Construct >=1 genuinely-engaged non-Carnot
           control (RFG enhanced!=reference at gamma>0, 2509.25604, OR EntRGi 2602.05000). Smoke-test that EACH guidance
           arm CHANGES token selection vs unguided. NO-OP GUARD (exp4308 DEGENERATE_CONTROLS): if any two arms tie
           bit-identically -> emit controls_differentiated=false + honest_verdict `controls_not_differentiable` and STOP.
        3. On a REASONING corpus (FoVer-step/math, n>=40 per arm for power), run the arms: unguided, the engaged control(s),
           SELF-REWARD SMC (2602.01849, intrinsic trajectory-confidence particle filter -- the must-beat baseline), and
           Carnot REWARD-GUIDED STITCHING (2602.22871, the external partial-state scorer scoring every step + stitching the
           best over diverse trajectories). Report per-arm accuracy + Carnot-minus-(best engaged control) + Carnot-minus-
           self-reward-SMC + Carnot-minus-unguided + task-level bootstrap CI95 (>=2000 resamples) + a guidance-dynamics
           diagnostic (2506.10971: mask entropy / token-change covariance / trajectory stability).
        4. Emit diffusiongemma_guidance_moat BARE bool := (Carnot-stitched - best-engaged-control > 0 AND its CI95
           excludes 0 AND controls_differentiated==true AND Carnot-stitched - self-reward-SMC > 0). Run adversarial_verify.py
           (clean; verifier_is_oracle=false; the DEGENERATE_CONTROLS check must NOT fire). Declare random_seed +
           reproducibility_checksum + model_specs (DiffusionGemma GGUF + PR binary + the partial-state scorer + the
           stitching config + the self-reward-SMC baseline + the control construction + denoising steps + the corpus).
           Plausible duration (live 26B inference). NO leaderboard submission.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A guidance moat (external stitching beats the engaged control AND the intrinsic self-reward SMC, CI95-excl-0), a POWERED bounded null (ties despite the stronger architecture + power -> retire the ask), a controls_not_differentiable, and a scorer_leaky_rebuild_needed are ALL COMPLETE and decision-grade."
        diffusiongemma_guidance_moat:
          principle: "BARE bool: the capstone reads this (gated-fields-must-be-bare); true iff the LEARNED (oracle-distinct) reward-guided-stitched run beats the BEST GENUINELY-ENGAGED control AND CI95-excl-0 AND controls_differentiated AND beats the intrinsic self-reward SMC -- the moat-scissor realized in generation at LLM scale, against the model's own confidence."
        controls_differentiated:
          principle: "BARE bool: true iff no two control arms tie bit-identically (the exp4308 no-op guard) -- a moat off no-op controls is meaningless (the .397 exp4293 trap)."
        carnot_minus_best_control_delta:
          principle: "BARE float: Carnot-stitched minus the BEST genuinely-engaged non-Carnot control -- the engaged-baseline comparison (compare to exp4304's +0.133)."
        carnot_minus_self_reward_smc_delta:
          principle: "BARE float: Carnot-stitched minus self-reward SMC (intrinsic trajectory-confidence, 2602.01849) -- the SHARPEST oracle-distinct test (does the EXTERNAL verifier beat the model's OWN confidence in generation?)."
        guidance_moat_ci95:
          principle: "Task-level bootstrap CI95 (>=2000 resamples) of the Carnot-minus-best-engaged-control delta -- excluding 0 makes the in-generation moat decision-grade (exp4304's CI included 0)."
        scorer_leak_recheck_passed:
          principle: "BARE bool: the independent leak re-check on the exp4292 scorer -- true iff the signal SURVIVES masking the answer cells; false retires the run to scorer_leaky_rebuild_needed."
        guidance_dynamics_diagnostic:
          principle: "Mask entropy / token-change covariance / trajectory stability (2506.10971) -- bounds the result (an over-guided unstable scorer's 'win' is robustness-theater)."
        verifier_is_oracle:
          principle: "BARE bool=false -- the learned partial-state scorer is oracle-distinct (NOT the executable oracle); a circular guidance win cannot headline."
        preconditions_checked:
          principle: "Records the PR-binary + GGUF cache + scorer-loadable + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the denoising + stitching + bootstrap."
        reproducibility_checksum:
          principle: "Hash of the corpus + stitching config + self-reward-SMC config + control construction + PR-binary inputs; lets a third party re-run."
        model_specs:
          principle: "DiffusionGemma GGUF + PR binary + the partial-state scorer + the reward-guided-stitching config + the self-reward-SMC baseline + the engaged control + denoising steps + the corpus; required methodology."
      ACCEPTANCE GATE:
        - condition: "diffusiongemma_guidance_moat + controls_differentiated + carnot_minus_best_control_delta + carnot_minus_self_reward_smc_delta + guidance_moat_ci95 + scorer_leak_recheck_passed + guidance_dynamics_diagnostic reported with verifier_is_oracle=false and preconditions_checked, OR an honest blocked_/controls_not_differentiable/scorer_leaky_rebuild_needed/powered-null verdict"
          principle: "The §5 in-generation moat, made skeptic-proof AND powered: does the external verifier IMPROVE generation via reward-guided step-stitching, beating a genuinely-engaged control AND the model's intrinsic self-confidence (self-reward SMC) -- with a no-op guard + a leak re-check + circularity honesty + enough n to make the CI decision-grade."

      Run: `python3 {project_root}/results/experiment_4315_diffusiongemma_reward_guided_stitching.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4316-efficiency-cascade-router-deploy
    milestone: 2026.06.399
    title: "PHASE C1 (DEPLOY the hardened efficiency verifier as a budget-aware CASCADE ROUTER; the .399 SOTA-ingestion headline; broaden the exp4303 win) -- .398 (exp4303) HARDENED the efficiency-parity win (energy 0.8 vs well-prompted judge 0.5, cost_ratio 1.03e-08, CI95 [0.1,0.5] excl 0) but at n>=30 on cross-family ARC selection only. Convert the PROVEN result into a DEPLOYED budget-aware CASCADE policy (arXiv:2510.14913): score every candidate with the cheap discriminative energy verifier first, and escalate ONLY the low-margin (uncertain) cases to the LLM judge -- the operating point that buys most of the judge's accuracy at most of the energy verifier's cost. Compare the CASCADE against always-energy (cheap, lower accuracy) and always-judge (expensive, higher accuracy) controls on a LARGER, multi-corpus n (broaden beyond the exp4303 n>=30: add a 2nd selection corpus -- ARC-GEN generators and/or FoVer-step). Peers to cite: Weaver 2506.18203 (weak-verifier ensemble distilled to 400M rivals o3-mini), MSV 2603.03417 (set-conditioned verifier). Emit cascade_dominates_controls BARE bool := (cascade accuracy >= always-judge accuracy within CI AND cascade cost strictly between always-energy and always-judge AND cascade is Pareto-non-dominated). verifier_is_oracle=false. RE-SCOPE to fit the window (synchronous resume-accumulate, checkpoint after every judge escalation, per-task progress prints; a PARTIAL one-corpus n>=40 ACCEPTED). NOT the retired circular efficiency-vs-judge-ON-CODE (known-issues §0) -- this is the oracle-distinct ARC/cross-family selection."
    priority: high
    track: verifier-efficiency
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "north-star §5 (the verifier earns its place if equally effective at lower cost; efficiency-parity IS the win condition) + the .398 exp4309 SOTA-ingestion flag (budget_aware_discriminative_cascade_router_v399 -> deploy the proven verifier as a cascade policy) -- false-positive scope-match vs exp4303 (the .398 efficiency-parity HARDEN, SUCCEEDED, NOT retired -- this is a forward DEPLOYMENT of that success, broadened to multi-corpus + a cascade operating point) / the RETIRED circular efficiency-vs-judge-ON-CODE (exclusion_manifest code_oracle_distinct_replication; known-issues §0); forward difference = a DEPLOYED budget-aware cascade router (2510.14913) on the ORACLE-DISTINCT cross-family/ARC-GEN/FoVer selection (verifier_is_oracle=false, NOT code), with always-energy + always-judge Pareto controls + a larger multi-corpus n. verifier_is_oracle=false."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4316_efficiency_cascade_router_deploy.json
    prompt: |
      CONTEXT: north-star §5 -- the verifier earns its place if it matches the LM at lower cost. .398 PROVED
      efficiency-parity (exp4303: energy 0.8 vs well-prompted judge 0.5 at cost_ratio 1.03e-08, CI95-excl-0) but on a
      single corpus at n>=30. The .399 SOTA-ingestion flagged the deployment: a budget-aware DISCRIMINATIVE CASCADE
      (2510.14913) -- cheap energy scoring first, escalate ONLY uncertain (low-margin) cases to the judge -- the
      operating point that captures most of the judge's accuracy at a fraction of the cost. This BROADENS the proven
      win into a deployed, multi-corpus, Pareto-characterized policy. Peers: Weaver 2506.18203 (verifier ensemble
      distilled to 400M rivals o3-mini), MSV 2603.03417 (set-conditioned verifier). Build the STRONG judge per
      Thinking-Small-Judges (2509.13332). RE-SCOPE to fit the window (a PARTIAL one-corpus n>=40 is COMPLETE).

      EXISTING CODE TO READ FIRST:
        - results/experiment_4303_verifier_efficiency_parity_isoflops.json (the .398 HARDENED win: the harness, the well-prompted-judge construction, the cost-accounting, the iso-FLOPs curve to reuse + extend)
        - results/experiment_4271_arc_cross_family_transfer_existing_pool.json (the cross-family selection corpus) + results/experiment_4291_arcgen_cross_generator_nondegenerate.json (the ARC-GEN 2nd corpus) + the FoVer-step pool (a 3rd corpus)
        - python/carnot/verify/ (the energy verifier), scripts/experiment_template.py (cached_sota_pair -- the judge GGUFs; BatchedInferenceRunner)
        - scripts/adversarial_verify.py, scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "SOTA Local Models", "GGUF tokenizer rule", "Pre-Launch Preconditions", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: deploy the energy verifier as a budget-aware cascade router; compare accuracy/cost vs always-energy + always-judge on a larger multi-corpus n; report the Pareto verdict.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any inference):
           a. At least one judge GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/` OR
              `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF/` non-empty. Load GGUFs via the .gguf
              path (NOT AutoTokenizer -- GGUF tokenizer rule). If ALL judge models missing -> honest_verdict
              `blocked_judge_models_not_cached` and STOP.
           b. The selection corpora + the energy verifier load. CPU for the energy verifier; the judge uses the cached GGUF.
           c. The conductor is stood-down on TRM training; this task does NO TRM training and does NOT touch results/trm_runs/.
        1. WINDOW DISCIPLINE: synchronous, checkpoint after EVERY judge escalation (resume from it on restart), per-task
           progress prints; accept a PARTIAL (one corpus, n>=40) as COMPLETE.
        2. On >=1 selection corpus (n>=40; add a 2nd corpus if the window allows), run three policies: (a) always-energy
           (the cheap discriminative verifier on every task), (b) always-judge (the well-prompted judge on every task),
           (c) CASCADE (energy first; escalate to the judge ONLY when the energy margin is below a tuned threshold). Tune
           the cascade threshold on a held-out split. Measure per-policy selection accuracy + wall-clock + a FLOPs/token
           proxy + an estimated $/1k-selections + the escalation rate.
        3. Report accuracy_always_energy, accuracy_always_judge, accuracy_cascade, cost_always_energy, cost_always_judge,
           cost_cascade, escalation_rate, and the accuracy/cost CI95s (bootstrap >=2000). Emit cascade_dominates_controls
           BARE bool := (accuracy_cascade >= accuracy_always_judge within CI AND cost_always_energy < cost_cascade <
           cost_always_judge AND the cascade is Pareto-non-dominated). Run adversarial_verify.py (clean;
           verifier_is_oracle=false). Declare random_seed + reproducibility_checksum + model_specs (the judge GGUF ids +
           the strong prompt + the energy verifier + the cascade threshold + the cost-accounting). Plausible duration (live judge inference).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A cascade Pareto-win (most of the judge's accuracy at a fraction of the cost), a parity-at-lower-cost, an 'always-energy already dominates' (the cascade is unnecessary -- a clean finding), and an honest blocked_judge_models_not_cached / blocked_window_exceeded are ALL COMPLETE."
        cascade_dominates_controls:
          principle: "BARE bool: the capstone reads this (gated-fields-must-be-bare); true iff the cascade reaches always-judge accuracy (within CI) at a cost strictly between always-energy and always-judge AND is Pareto-non-dominated -- the deployed §5 efficiency operating point."
        accuracy_cascade:
          principle: "BARE float: the cascade policy's selection accuracy -- the deployed accuracy (target: >= always-judge within CI)."
        accuracy_always_energy:
          principle: "BARE float: the cheap always-energy baseline accuracy (compare to exp4303's 0.8)."
        accuracy_always_judge:
          principle: "BARE float: the well-prompted always-judge accuracy (the expensive ceiling; compare to exp4303's 0.5)."
        cost_ratio_cascade:
          principle: "BARE float: cascade cost / always-judge cost (wall-clock + FLOPs-proxy + $/1k) -- the deployed efficiency multiplier (the cascade buys accuracy by escalating only the hard cases)."
        escalation_rate:
          principle: "BARE float: fraction of tasks escalated to the judge -- the cascade's cost knob (low escalation + near-judge accuracy is the win)."
        pareto_curve:
          principle: "Accuracy-vs-cost for always-energy, cascade, always-judge (and intermediate thresholds) -- the honest Pareto frontier (Budget-aware Discriminative Verification 2510.14913)."
        verifier_is_oracle:
          principle: "BARE bool=false -- the energy verifier on cross-family/ARC-GEN/FoVer selection is oracle-distinct (NOT the executable oracle); keeps the efficiency measurement non-circular (unlike the retired code-efficiency)."
        preconditions_checked:
          principle: "Records the judge GGUF caches + corpus load + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the selection + bootstrap + threshold tuning."
        reproducibility_checksum:
          principle: "Hash of the corpora + the policies' outputs + the cascade threshold + the cost accounting; lets a third party re-run."
        model_specs:
          principle: "The judge GGUF ids + the strong prompt + the energy verifier + the cascade threshold + the cost-accounting method + the corpora; required methodology."
      ACCEPTANCE GATE:
        - condition: "cascade_dominates_controls + accuracy_cascade + accuracy_always_energy + accuracy_always_judge + cost_ratio_cascade + escalation_rate + pareto_curve reported with verifier_is_oracle=false and preconditions_checked, OR an honest blocked_judge_models_not_cached / blocked_window_exceeded verdict"
          principle: "Deploying the hardened efficiency-parity win as a budget-aware cascade router on a larger multi-corpus n turns a clean point result into a deployable, Pareto-characterized §5 operating point (the operator's stated win condition, now a policy)."

      Run: `python3 {project_root}/results/experiment_4316_efficiency_cascade_router_deploy.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

