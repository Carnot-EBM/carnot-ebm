  - id: exp5721-fr11-memops-lifecycle-shadow-stream
    milestone: "2026.07.511"
    title: "Gated on Exp5720 exact stream: prospective MemOps lifecycle FR-11 shadow learning"
    priority: critical
    track: continuous-learning
    deliverable: results/experiment_5721_fr11_memops_lifecycle_shadow_stream.json
    model: sonnet
    max_turns: 50
    estimated_wall_time_min: 300
    continuous_self_learning_task: true
    prior_failures:
      - experiment_id: exp5709-fr11-prospective-shadow-stream
        verdict: "blocked_gate_check_failed"
        addressed_by: "The parse-failed stream is not reused: Exp5720 supplies a newly attested two-family stream, and this adds MemOps traces, forgetting/supersession, and independent chronological metrics."
        retire_if_same_verdict: true
