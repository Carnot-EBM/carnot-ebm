  - id: exp2989-sota-gguf-cache-provenance-preflight
    milestone: "2026.05.281"
    deliverable: "results/experiment_2989_sota_gguf_cache_provenance_preflight_v1.json"
    title: "Mandated SOTA GGUF cache and provenance preflight"
    priority: critical
    model: opus
    requires_claude: true
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 60
    track: "infrastructure"
    inference_substrate: "live_llm_inference"
    prior_failures:
      - experiment_id: exp2977-sota-intent-preserving-code-repair
        verdict: "blocked_cached_sota_pair_unavailable_cpu_smoke_only"
        addressed_by: "This task isolates model-cache/provenance as an upstream gate before any headline repair or solver rerun."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp 2977 could not produce headline repair evidence because the mandated SOTA cached local GGUF models were unavailable and only a small CPU smoke model ran. This preflight is the upstream gate for all .281 live LLM claims.

      MODEL_SPECS:
      - headline_models:
        - unsloth/Qwen3.6-35B-A3B-GGUF
        - unsloth/gemma-4-31B-it-GGUF
        - unsloth/gemma-4-26B-A4B-it-GGUF
      - smoke_only_models:
        - Qwen/Qwen3.5-0.8B
        - unsloth/gemma-4-E4B-it-GGUF
      - Use python/carnot/inference/sota_models.py and the cached_sota_pair() pattern when applicable.
      - A headline SOTA result requires at least one headline model to produce a real transcript with cache/provenance fields.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - scripts/experiment_template.py
      - scripts/experiment_2977_sota_intent_preserving_code_repair_v1.py
      - python/carnot/inference/sota_models.py
      - python/carnot/inference/
      - results/experiment_2977_sota_intent_preserving_code_repair_v1.json
      - research-hardware-wishlist.md

      TASK:
      Implement and run a bounded preflight that checks the mandated SOTA GGUF cache, records provenance, and produces one minimal live transcript per available headline model. If no headline model is available, emit a terminal blocked artifact and do not substitute small models for headline readiness.

      CONCRETE STEPS:
      0. PRECONDITIONS: record CUDA/GPU availability, free VRAM if available, repo commit, Python environment, and whether cache paths exist before any model load.
      1. Add a focused script under scripts/ for exp2989 following scripts/experiment_template.py.
      2. Attempt the mandated headline models in MODEL_SPECS with conservative prompts and timeouts.
      3. For each attempted model, record exact model id, local cache path, file/checksum evidence when available, load status, generation status, duration, and transcript path/hash.
      4. If no headline model runs, optionally run a legacy small smoke test but label it smoke_only and set sota_headline_ready=false.
      5. Write the JSON artifact and ensure honest_verdict is terminal and explicit.
      6. Run the new script and any relevant unit/import checks.

      REQUIRED ARTIFACT FIELDS:
      - sota_headline_ready: bool (principle: downstream headline tasks must gate on real SOTA availability)
      - preconditions_checked: bool (principle: compute-bound failures must distinguish environment from method failure)
      - model_specs: dict (principle: model identity must be explicit)
      - sota_models_attempted: list (principle: failed availability must be auditable)
      - sota_models_available: list (principle: successful availability must be auditable)
      - cache_paths: dict (principle: model provenance must be local and inspectable)
      - model_checksums: dict (principle: repeated runs must be tied to exact artifacts when feasible)
      - live_transcript_paths: list (principle: live inference claims require replayable output evidence)
      - legacy_smoke_only_used: bool (principle: small models must not become headline evidence)
      - inference_substrate: str (principle: substrate claims must match actual execution)
      - duration_seconds: float (principle: impossible-duration artifacts must be catchable)
      - honest_verdict: str (principle: terminal verdict must state ready or blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2990-verifier-backed-hard-code-stress-manifest
    milestone: "2026.05.281"
    deliverable: "results/experiment_2990_verifier_backed_hard_code_stress_manifest_v1.json"
    title: "Verifier-backed hard-code stress manifest"
    priority: high
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 50
    estimated_wall_time_min: 45
    track: "code_repair"
    inference_substrate: "verifier_ensemble_against_cached_candidates"
    prior_failures:
      - experiment_id: exp2964-sota-dccd-repair-replication
        verdict: "complete: DCCD repair replication did not clear promotion gates; pass@1_delta=-0.2, syntax_failure_rate_delta=0.30000000000000004, false_accept_delta=-0.05"
        addressed_by: "This task constructs verifier-backed hard cases before rerunning repair instead of reusing a broad over-constrained repair set."
        retire_if_same_verdict: true
      - experiment_id: exp2977-sota-intent-preserving-code-repair
        verdict: "blocked_cached_sota_pair_unavailable_cpu_smoke_only"
        addressed_by: "The manifest is model-independent and gives the gated SOTA rerun a validated hard-test target once cache is ready."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Recent verifier-backed hard-problem and HARDTESTGEN work suggests that repair evidence should be measured on executable hard cases with independent validators. Carnot needs a small high-quality hard-code stress manifest before another SOTA repair rerun.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - research-references.md
      - scripts/experiment_2964_sota_dccd_repair_replication_v1.py
      - scripts/experiment_2977_sota_intent_preserving_code_repair_v1.py
      - python/carnot/
      - tests/
      - results/experiment_2964_sota_dccd_repair_replication_v1.json
      - results/experiment_2977_sota_intent_preserving_code_repair_v1.json

      TASK:
      Build a verifier-backed hard-code stress manifest for the .281 repair rerun. The manifest must contain executable tests, baseline-failing candidates, provenance, and edge-case rationale. Do not run a headline LLM repair experiment in this task.

      CONCRETE STEPS:
      1. Create a small manifest path such as datasets/repair_hard/manifest_v1.jsonl if no equivalent exists.
      2. Select or synthesize 20-40 code-repair items with deterministic tests; prefer existing repo fixtures and lightweight generated cases over broad external dependencies.
      3. For each item, include a baseline incorrect candidate that fails at least one verifier test and a reference or expected behavior.
      4. Run the verifier/test suite for every item and record pass/fail hashes or transcripts.
      5. Reject items whose tests are flaky, non-deterministic, or do not distinguish baseline failure from reference success.
      6. Write the result artifact with manifest statistics and validation commands.

      REQUIRED ARTIFACT FIELDS:
      - hard_code_stress_set_ready: bool (principle: downstream repair must gate on a valid hard set)
      - manifest_path: str (principle: generated benchmark evidence must be inspectable)
      - n_items: int (principle: sample size must be explicit)
      - all_items_have_tests: bool (principle: repair correctness requires executable checks)
      - all_baseline_candidates_fail: bool (principle: hard cases must expose a real defect)
      - all_reference_solutions_pass: bool (principle: tests must be satisfiable)
      - flaky_items: list (principle: nondeterminism must be excluded from headline claims)
      - verifier_transcript_paths: list (principle: test evidence must be replayable)
      - hard_generation_sources: list (principle: synthesized items need provenance)
      - honest_verdict: str (principle: terminal verdict must say ready or blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2991-gated-sota-intent-preserving-repair-hard-set
    milestone: "2026.05.281"
    deliverable: "results/experiment_2991_gated_sota_intent_preserving_repair_hard_set_v1.json"
    title: "Gated SOTA intent-preserving repair on verifier hard set"
    priority: critical
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 90
    track: "code_repair"
    inference_substrate: "live_llm_inference"
    gated_on:
      - upstream: exp2989-sota-gguf-cache-provenance-preflight
        artifact_field: sota_headline_ready
        op: "=="
        value: true
      - upstream: exp2990-verifier-backed-hard-code-stress-manifest
        artifact_field: hard_code_stress_set_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2977-sota-intent-preserving-code-repair
        verdict: "blocked_cached_sota_pair_unavailable_cpu_smoke_only"
        addressed_by: "Now gated on actual mandated SOTA cache readiness and a verifier-backed hard-code manifest."
        retire_if_same_verdict: true
      - experiment_id: exp2964-sota-dccd-repair-replication
        verdict: "complete: DCCD repair replication did not clear promotion gates; pass@1_delta=-0.2, syntax_failure_rate_delta=0.30000000000000004, false_accept_delta=-0.05"
        addressed_by: "Uses intent-preserving repair plus hard-test execution rather than stricter schema-only DCCD pressure."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      This is the .281 repair headline attempt, but it is allowed to run only after the SOTA cache preflight and hard-code stress manifest pass. The goal is useful verifier-backed repair, not prettier JSON.

      MODEL_SPECS:
      - headline_models:
        - unsloth/Qwen3.6-35B-A3B-GGUF
        - unsloth/gemma-4-31B-it-GGUF
        - unsloth/gemma-4-26B-A4B-it-GGUF
      - smoke_only_models:
        - Qwen/Qwen3.5-0.8B
        - unsloth/gemma-4-E4B-it-GGUF
      - Use cached_sota_pair() or the current repo-local SOTA cache helper.
      - At least one headline model must produce live results for headline_result=true.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - scripts/experiment_2977_sota_intent_preserving_code_repair_v1.py
      - scripts/experiment_2964_sota_dccd_repair_replication_v1.py
      - python/carnot/inference/sota_models.py
      - datasets/repair_hard/manifest_v1.jsonl if present
      - results/experiment_2989_sota_gguf_cache_provenance_preflight_v1.json
      - results/experiment_2990_verifier_backed_hard_code_stress_manifest_v1.json

      TASK:
      Run the intent-preserving repair protocol on the hard-code stress set using mandated SOTA local GGUF models. Compare against baseline candidates and record pass@1/pass@k, syntax/schema failure, and false-accept deltas. If preconditions are not met, emit a terminal blocked artifact.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify exp2989.sota_headline_ready=true, exp2990.hard_code_stress_set_ready=true, CUDA/cache status, and hard-set manifest integrity.
      1. Add a focused exp2991 script following scripts/experiment_template.py.
      2. Load the hard manifest and run baseline verifier tests before any LLM repair.
      3. Generate repair candidates with at least one mandated headline model; preserve draft intent, runtime trace, failing assertion, and final patch.
      4. Execute deterministic tests for every candidate and compute deltas against the baseline and any small-model smoke data separately.
      5. Reject headline promotion if schema/syntax failures rise, false accepts rise, n_tasks is too small, or only smoke models ran.
      6. Write transcripts, candidate patches, verifier logs, and the JSON artifact.

      REQUIRED ARTIFACT FIELDS:
      - repair_rerun_clean: bool (principle: the repair row must be machine-gated)
      - headline_result: bool (principle: SOTA claim must be separate from smoke evidence)
      - n_tasks: int (principle: sample size must be explicit)
      - model_specs: dict (principle: model identities must match mandated GGUFs)
      - headline_models_used: list (principle: SOTA evidence requires actual headline models)
      - pass_at_1_delta: float (principle: usefulness must be measured against baseline)
      - pass_at_k_delta: float (principle: candidate-set value must be measured separately)
      - schema_failure_rate_delta: float (principle: constraints must not create parser regressions)
      - syntax_failure_rate_delta: float (principle: constraints must not create code regressions)
      - verifier_false_accept_delta: float (principle: repair must not game the verifier)
      - trace_coverage: float (principle: trace-aware repair requires trace evidence)
      - transcript_paths: list (principle: live inference must be replayable)
      - inference_substrate: str (principle: substrate labels must match actual execution)
      - honest_verdict: str (principle: terminal verdict must state clean, flagged, or blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2992-sota-solver-formalization-provenance-reproduction
    milestone: "2026.05.281"
    deliverable: "results/experiment_2992_sota_solver_formalization_provenance_reproduction_v1.json"
    title: "SOTA solver formalization provenance reproduction"
    priority: critical
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 90
    track: "solver_reasoning"
    inference_substrate: "live_llm_inference"
    gated_on:
      - upstream: exp2989-sota-gguf-cache-provenance-preflight
        artifact_field: sota_headline_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2980-sota-solver-formalization-feedback
        verdict: "complete: feedback-aware local SOTA formalization cleared .280 Z3 gates"
        addressed_by: "Repeats the strong solver result with larger coverage, prompt hashes, model checksums, Z3 transcript hashes, and durable duration provenance."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp 2980 produced the strongest .280 technical signal, but matrix/capstone flagged it because methodology, duration, checksum, and provenance evidence were insufficient. This task preserves or falsifies that gain under stricter evidence.

      MODEL_SPECS:
      - headline_models:
        - unsloth/Qwen3.6-35B-A3B-GGUF
        - unsloth/gemma-4-31B-it-GGUF
        - unsloth/gemma-4-26B-A4B-it-GGUF
      - smoke_only_models:
        - Qwen/Qwen3.5-0.8B
        - unsloth/gemma-4-E4B-it-GGUF
      - Use cached_sota_pair() or the current repo-local SOTA helper.
      - Solver headline evidence requires live local inference from at least one headline model plus exact Z3 execution.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - scripts/experiment_2980_sota_solver_formalization_feedback_v2.py
      - scripts/experiment_2979_solver_feedback_mcs_frontier_v1.py
      - python/carnot/
      - python/carnot/inference/sota_models.py
      - results/experiment_2979_solver_feedback_mcs_frontier_v1.json
      - results/experiment_2980_sota_solver_formalization_feedback_v2.json
      - results/experiment_2989_sota_gguf_cache_provenance_preflight_v1.json

      TASK:
      Reproduce the solver-feedback formalization result with a larger fixed item set and durable provenance. Z3/runtime verification remains the authority. Do not promote LLM self-judgment, and do not treat impossible durations as valid live inference.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify SOTA cache readiness, CUDA/cache status, exact Z3 availability, fixed item-set hash, and prior exp2980 artifact availability.
      1. Add or update an exp2992 script without modifying scripts/research_conductor.py.
      2. Use a fixed set of at least 12 NL-to-Z3/constraint items unless preconditions force a terminal blocked artifact.
      3. Generate formalizations with solver feedback, record prompt hashes, raw model outputs, repair feedback, and final Z3 inputs.
      4. Execute Z3 and record transcript hashes, satisfiability/unsat-core/MCS/MUS where applicable, and answer correctness.
      5. Compare against exp2980 and explain any regression or non-reproduction.
      6. Write artifact and run relevant unit/import/script checks.

      REQUIRED ARTIFACT FIELDS:
      - solver_provenance_reproduced: bool (principle: downstream self-learning must gate on reproducible solver evidence)
      - formalization_clean: bool (principle: solver promotion must be explicit)
      - n_items: int (principle: sample size must exceed the .280 pilot)
      - parseability: float (principle: syntax validity must be measured)
      - z3_execution_rate: float (principle: exact verifier execution is required)
      - solver_verified_accuracy: float (principle: correctness must be solver-backed)
      - feedback_repair_delta: float (principle: solver feedback value must be isolated)
      - tautology_rate: float (principle: formalizations must not game validity)
      - prompt_hashes_recorded: bool (principle: prompts must be replayable)
      - z3_transcript_hashes_recorded: bool (principle: exact verifier evidence must be replayable)
      - model_checksums_recorded: bool (principle: model provenance must be durable)
      - duration_seconds: float (principle: live inference timing must be plausible)
      - inference_substrate: str (principle: substrate labels must match execution)
      - honest_verdict: str (principle: terminal verdict must state reproduced, flagged, or blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2993-aquaforte-beaver-substrate-corrigendum
    milestone: "2026.05.281"
    deliverable: "results/experiment_2993_aquaforte_beaver_substrate_corrigendum_v1.json"
    title: "AquaForte BEAVER honest substrate corrigendum"
    priority: high
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 75
    track: "paper_integrity"
    inference_substrate: "live_llm_inference"
    gated_on:
      - upstream: exp2989-sota-gguf-cache-provenance-preflight
        artifact_field: sota_headline_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2934-aquaforte-beaver-reformulation-pipeline
        verdict: "complete: exp2926 live GGUF proposals reformulated and exact-verified"
        addressed_by: "Known-issues mandate requires separating true live LLM retry from enumerator-only fallback and relabeling substrate claims."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      ops/known-issues.md marks exp2934 as a mandatory substrate-corrigendum issue: the artifact claimed live LLM retry, but the duration was too short for the reported retries. This task must correct the record with a controlled two-condition experiment.

      MODEL_SPECS:
      - headline_models:
        - unsloth/Qwen3.6-35B-A3B-GGUF
        - unsloth/gemma-4-31B-it-GGUF
        - unsloth/gemma-4-26B-A4B-it-GGUF
      - smoke_only_models:
        - Qwen/Qwen3.5-0.8B
        - unsloth/gemma-4-E4B-it-GGUF
      - A live retry condition must use at least one headline model or be reported as blocked.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - ops/known-issues.md
      - results/experiment_2934_aquaforte_beaver_reformulation_pipeline_v1.json
      - scripts/experiment_2934_aquaforte_beaver_reformulation_pipeline_v1.py
      - python/carnot/inference/sota_models.py
      - any AquaForte or BEAVER related modules under python/carnot/
      - results/experiment_2989_sota_gguf_cache_provenance_preflight_v1.json

      TASK:
      Produce an honest substrate corrigendum for AquaForte/BEAVER by measuring two separate conditions: actual live local SOTA LLM retry and enumerator-only fallback. Relabel claims so paper/roadmap artifacts cannot confuse the two.

      CONCRETE STEPS:
      0. PRECONDITIONS: confirm known issue text, SOTA cache readiness, exact verifier availability, and exp2934 script/artifact inputs.
      1. Add a focused exp2993 script.
      2. Run a small controlled live-retry condition using a mandated headline model if available.
      3. Run the enumerator-only fallback condition with LLM disabled.
      4. Record durations, transcripts, verifier results, and exact substrate labels for each condition.
      5. Emit corrected claim labels and any docs/status note required to prevent future paper overclaiming.
      6. Write the result artifact and run the script.

      REQUIRED ARTIFACT FIELDS:
      - substrate_corrigendum_complete: bool (principle: known issue closure must be explicit)
      - live_llm_retry_measured: bool (principle: live claims need live evidence)
      - enumerator_only_fallback_measured: bool (principle: fallback evidence must be separate)
      - substrate_labels_corrected: bool (principle: paper claims must name the real substrate)
      - no_impossible_duration_claims: bool (principle: timing must be physically plausible)
      - live_retry_duration_seconds: float (principle: live inference timing must be recorded)
      - fallback_duration_seconds: float (principle: fallback timing must be recorded separately)
      - verifier_results_by_condition: dict (principle: exact verification must remain authority)
      - inference_substrate: str (principle: artifact substrate must match actual execution)
      - honest_verdict: str (principle: terminal verdict must close or block the corrigendum)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

