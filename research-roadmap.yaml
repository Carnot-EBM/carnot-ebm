  - id: exp4533-a1
    milestone: 2026.06.419
    title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY; HEADLINE) -- BUILD per-level GOAL
      RE-INDUCTION: on a level-up, re-induce the L_{{n+1}} win-predicate from post-transition frames +
      route the frontier toward it + raise target_levels past 1. Gate: a CORE game reaches L2
      (core_efficiency STRICTLY > 2.0074) at preserved CORE solves, OR a measured actionable barrier
      refinement.'
    priority: critical
    track: arc-north-star
    max_turns: 160
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4533_per_level_goal_reinduction.json
    prior_failures:
      - experiment_id: exp4524-a2
        verdict: 'complete: l1_l2_barrier_diagnosed_depth_cap_honest_null'
        addressed_by: 'A2 only DIAGNOSED the L1->L2 barrier (and was false-positive-flagged on a
          control==best null-delta TAUTOLOGY, losing the diagnosis from the capstone). A2 PROVED the
          barrier is NOT depth (cap 45->90 just exhausted budget, still L1) but per-level GOAL
          RE-INDUCTION: l2_win_condition_differs_from_l1=true, known_l2_transition_in_salience=null,
          induction engages only on stall-and-not-won, SUBMITTED_TARGET_LEVELS=1 halts the agent. This
          task BUILDS the mechanism A2 prescribed (detect the level boundary -> re-induce the L_{{n+1}}
          predicate -> route the frontier toward it -> raise target_levels), NOT another depth raise.
          Different mechanism, falsifiable gate, and it emits model_specs/inference_substrate/
          efficiency_delta + a null-delta methodology note so a genuine null is not lost to the
          tautology false-positive again.'
        retire_if_same_verdict: true
    prompt: |
      CONTEXT ({date}, ARC sprint HEADLINE -- the REAL score lever is reaching DEEPER levels). The
      submission gate measures core_efficiency (arc_agi.scorecard: per-level min((human/agent)^2*100,115)
      index-weighted, baseline 2.0074). lp85 has 8 levels but the agent solves only L0->L1. The .418 A2
      diagnosis (exp4524) located the barrier: after clearing L1 the agent NEVER re-induces the
      (different) L2 win-predicate.

      ROOT CAUSE (verified in python/carnot/agentic/arc_competition_agent.py):
        - SUBMITTED_TARGET_LEVELS = 1 (line 65) + StepwiseExplorer target_levels default 1 (line 171,247)
          + the E3 stop condition `best_level >= start_level + target_levels` (~line 834): the agent
          STOPS one level beyond start, so even if it could cross into L2 it halts at L1.
        - The induce path (_induce_and_plan ~line 1165) escalates ONCE and ONLY on stall-and-not-won
          (~line 1148: `if stalled and not won and not self.induced`). After WINNING L1 (won=True) it
          never re-induces -- induction is an unstuck-mechanism, not a cross-level mechanism.
        - A2 evidence: l2_win_condition_differs_from_l1=true, known_l2_transition_in_salience=null,
          energy_signal_available=false (DSL induction did not engage post-L1).

      THE FIX (build the per-level re-induction the A2 diagnosis prescribed):
        1. DETECT the level boundary: when levels_completed bumps (the explorer wins a level), treat it
           as a NEW goal-acquisition episode rather than terminating. (level = frame.levels_completed;
           see registry general_gotcha level_on_frame_not_game.)
        2. RE-INDUCE the L_{{n+1}} win-predicate from the post-transition frames (the new level presents a
           DIFFERENT goal). Reuse the Family-B executable-world-model / DSL induction
           (arc_world_model_dsl, arc_executable_world_model) but TRIGGER it on the level-up, not only on
           stall. The induced L_{{n+1}} predicate is the new search target.
        3. ROUTE the frontier toward states satisfying the re-induced L_{{n+1}} predicate (level-conditioned
           goal). Keep depth as the no-regression primary key; the re-induced predicate is the goal bias.
        4. RAISE target_levels past 1 (sweep target_levels in {{1(control),2,3,8}}) so the agent keeps going.
      CAUTION: the run terminates on a FIXED explore_budget (transition count). Raising target_levels +
      re-routing changes WHICH states are explored before budget is spent -- it CAN drop a knife-edge CORE
      solve (the order-perturbation mechanism). So core_solves_preserved on {{lp85,m0r0,sp80,vc33}} is a
      HARD EMPIRICAL GATE, NOT a formality: a dropped CORE solve FAILS the lever regardless.

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (StepwiseExplorer target_levels ~171/247/834; E3AgentPolicy phase machine + _induce_and_plan ~1141-1206; SUBMITTED_TARGET_LEVELS line 65; CARNOT_ARC_DISABLE_INDUCTION ~1176)
        - {project_root}/python/carnot/agentic/arc_world_model_dsl.py (ObjectDeltaModel -- the induced transition/win model)
        - {project_root}/python/carnot/agentic/arc_executable_world_model.py (induce / WorldModelVerifier / plan_in_model -- the Family-B inducer)
        - {project_root}/results/experiment_4524_reach_deeper_levels.json (the A2 barrier diagnosis: barrier_diagnosis, levers_tried, deepest_level_reached_per_core_game)
        - {project_root}/scripts/kaggle/arc_local_submission_gate.py (the per-level efficiency gate; core_efficiency baseline 2.0074; deepest_level_reached)
        - {project_root}/scripts/arc_leaderboard_eval.py (the eval that drives the real scorer; eff= is per-level)
        - {project_root}/tests/python/test_arc_submitted_agent_parity.py (keep parity green if SUBMITTED config changes)

      TASK: implement per-level goal re-induction (detect level-up -> re-induce L_{{n+1}} predicate ->
      route -> raise target_levels); measure core_efficiency + deepest level per CORE game WITH vs
      WITHOUT on lp85 + m0r0; wire into SUBMITTED_AGENT_CONFIG only if a CORE game reaches L2 with no
      CORE solve lost.

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
           Missing -> honest_verdict blocked_<resource>, EXIT. (--no-cov on any focused pytest.)
        1. Implement the per-level re-induction in the E3AgentPolicy / StepwiseExplorer per THE FIX above. Make the induce path re-trigger on a level-up (re-induce the new level's predicate); raise target_levels (swept).
        2. Measure on lp85 + m0r0 (and report sp80/vc33 for the CORE-preserved check): per config report core_efficiency, deepest_level_reached per game, core_solves_preserved. The WIN: a CORE game reaches L2 (deepest_level_reached >= 2) AND core_efficiency STRICTLY > 2.0074 AND no CORE solve lost.
        3. METRIC DISCIPLINE: core_efficiency is the per-level metric (arc_agi.scorecard), NOT median actions (retired). Measure baseline and best the SAME way. If NO lever moves efficiency, that is an HONEST NULL: report core_efficiency_best == core_efficiency_baseline is EXPECTED, emit efficiency_delta: 0.0 + a null_delta_methodology_note ("baseline==best because no lever reached a deeper level; not a measurement bug") so the result is NOT lost to a TAUTOLOGY false-positive (the .418 A2 failure mode).
        4. POSITIVE CONTROL + FALSE_NEGATIVE_RISK guard: a config that DOES re-induce a different L2 predicate on a game with a known L2 (lp85) must at minimum register the predicate change; if no config reaches a deeper level, report the HONEST NULL with the barrier refinement (what specifically still blocks the re-induced predicate from being reachable).
        5. WIRE ONLY ON A STRICT IMPROVEMENT: update SUBMITTED_AGENT_CONFIG (raise target_levels + enable re-induction) ONLY if a CORE game reaches L2 (core_efficiency STRICTLY > 2.0074) with core_solves_preserved=True; then update test_arc_submitted_agent_parity.py consistently. Else keep the bare explorer + honest null. Offline-reproduce any new level via arc_solver_kit.reproduce.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; e.g. success: reinduction_<game>_reached_L2_core_efficiency_<n>_above_2.0074 OR complete: reinduction_no_deeper_level_barrier_refined_honest_null."
        inference_substrate:
          principle: "verifier_ensemble_against_cached_candidates -- offline arcade search/induction, no headline GGUF load (1s floor). If the LLM induction tier is genuinely invoked, declare live_llm_inference + add the model precondition."
        model_specs:
          principle: "names the inducer/model actually invoked (or 'offline_dsl_induction_no_llm') -- the methodology field whose absence false-flagged the .418 A2 as METHODOLOGY_MISSING."
        core_efficiency_baseline:
          principle: "2.0074 -- the REAL per-level metric control (NOT median actions, retired)."
        core_efficiency_best:
          principle: "the HEADLINE -- did per-level re-induction reach a deeper level and raise core_efficiency."
        efficiency_delta:
          principle: "core_efficiency_best - core_efficiency_baseline, emitted explicitly so a null (delta 0.0) is annotated, not a control==best TAUTOLOGY false-positive (the .418 A2 diagnosis-loss guard)."
        null_delta_methodology_note:
          principle: "present when efficiency_delta==0.0 -- states the equality is an honest no-deeper-level null, not a measurement bug."
        deepest_level_reached_per_core_game:
          principle: "best_level per CORE game per config -- the direct evidence of reaching MORE levels (the score lever)."
        core_solves_preserved:
          principle: "HARD empirical gate on {{lp85,m0r0,sp80,vc33}} -- raising target_levels/re-routing CAN drop a knife-edge solve under the fixed explore_budget; a dropped CORE solve FAILS the lever regardless."
        barrier_refinement:
          principle: "if no deeper level is reached, the CONCRETE actionable refinement of what still blocks the re-induced L2 predicate -- the deliverable on a null, and the input to .420."
        target_levels_sweep:
          principle: "the {{target_levels -> (core_efficiency, deepest_level, core_solves_preserved)}} table so the decision is auditable, not asserted."
        chosen_submitted_config:
          principle: "what was wired into SUBMITTED_AGENT_CONFIG (or 'unchanged' if null); must keep test_arc_submitted_agent_parity.py consistent."
        positive_control_passed:
          principle: "proves the harness can detect a real re-induction (a level-conditioned predicate change registers); guards a silently-broken metric."
        false_negative_risk_checked:
          principle: "a null is valid only if the positive control passed."
        offline_reproduced:
          principle: "any new level reached must offline-reproduce (arc_solver_kit.reproduce) to count."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "content-addressed hash catches silent corpus/model drift on replay."
        preconditions_checked:
          principle: "records resources verified; pre-empts missing-resource fabrication."

      Run: cd {project_root} && .venv/bin/python python/carnot/experiment_4533_per_level_goal_reinduction.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4534-a2
    milestone: 2026.06.419
    title: 'PHASE A2 (ARC NORTH STAR; PRIMARY; operator MANDATORY; HEADLINE; ORACLE-DISTINCT MOAT) --
      ENERGY-VERIFIER next-level-distance routing: use the world-model TRUST ENERGY (verifier_is_oracle:
      false) to route the frontier toward predicted-deeper states satisfying the re-induced L_{{n+1}}
      predicate. Test lp85 + sp80 with a matched no-energy control. Gate: an energy-routed config reaches
      a deeper level OR a measured null with the energy signal characterized.'
    priority: high
    track: arc-north-star
    max_turns: 140
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4534_energy_trust_next_level_routing.json
    prior_failures:
      - experiment_id: exp4524-a2
        verdict: 'complete: l1_l2_barrier_diagnosed_depth_cap_honest_null'
        addressed_by: 'A2 tried energy_verifier_frontier_routing as ONE of several levers and it stayed
          at L1 (and even dropped m0r0 to 0) because it routed in the SAME L1-goal frame with NO
          re-induced L2 predicate to aim at. This task pairs the energy routing with the A1 re-induced
          L_{{n+1}} predicate as the TARGET (route toward states the energy says are closer to the NEW
          goal), adds a MATCHED no-energy control + FALSE_NEGATIVE_RISK guard, and sets
          verifier_is_oracle:false per the Circularity discipline. Different mechanism (energy as a
          next-LEVEL-distance heuristic toward a re-induced goal, not a within-L1 tie-break), falsifiable
          gate. Also addresses the energy-augmented-ranking null (exp4502): that ranked the L1 frontier;
          this routes toward a re-induced deeper goal.'
        retire_if_same_verdict: true
    prompt: |
      CONTEXT ({date}, ARC sprint HEADLINE; the 2026-06-20 operator strategic directive "lean into energy
      models that AUGMENT others' approaches"). The oracle-distinct EBM slot on the ARC critical path is
      the world-model TRUST ENERGY (energy = 1 - dynamics_accuracy; ALREADY live in the submitted agent).
      This task uses it as a NEXT-LEVEL-DISTANCE heuristic: route the frontier toward states the energy
      predicts are closer to the re-induced L_{{n+1}} goal (from A1), so the search crosses into deeper
      levels. verifier_is_oracle MUST be false (a circular win does not count; CLAUDE.md Circularity /
      Oracle-Distinctness Discipline).

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_world_model_trust_energy.py (select_trusted_world_model, the trust energy)
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (_frontier, _induce_and_plan, world_model_trust_selection, HIDDEN_STATE_GAME_IDS)
        - {project_root}/results/experiment_4533_per_level_goal_reinduction.json (A1: the re-induced L_{{n+1}} predicate + any winning config -- the TARGET this routes toward; degrade gracefully if A1 nulled)
        - {project_root}/results/experiment_4524_reach_deeper_levels.json (A2 .418: the energy_verifier_frontier_routing lever that stayed L1 -- the prior failure this addresses)
        - {project_root}/scripts/kaggle/arc_local_submission_gate.py (per-level efficiency gate, baseline 2.0074)

      TASK: route the frontier toward predicted-deeper states using the world-model trust energy as a
      next-level-distance heuristic toward the re-induced L_{{n+1}} predicate; measure on lp85 + sp80 with
      a MATCHED no-energy control. verifier_is_oracle:false. If A1 produced a re-induced predicate, route
      toward it; if A1 nulled, characterize the energy signal independently (does the trust energy
      separate deeper-progress states from L1-stuck states at all?).

      CONCRETE STEPS:
        0. PRECONDITIONS: `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0. Missing -> blocked_<resource>, EXIT.
        1. Read the A1 artifact for the re-induced L_{{n+1}} predicate + winning config (if any). Implement energy-routed frontier selection: among eligible frontier nodes, bias toward those the trust energy ranks closer to the re-induced goal. Depth stays the no-regression primary key; energy is the goal bias.
        2. Measure WITH energy routing vs a MATCHED no-energy control on lp85 + sp80: core_efficiency, deepest_level_reached, core_solves_preserved. The WIN: an energy-routed config reaches a deeper level (deepest_level_reached >= 2 on a CORE game) the no-energy control does not, core_solves_preserved=True, verifier_is_oracle:false.
        3. POSITIVE CONTROL + FALSE_NEGATIVE_RISK: a state set where the trust energy SHOULD separate deeper-progress from stuck (e.g. a game with a known L2 the energy was trained on) must register separation; a null is valid only if this control passed. Characterize the energy signal (AUROC of energy separating deeper-progress vs L1-stuck states) even when no solve.
        4. HONEST NULL is acceptable IF it characterizes the energy signal + states why it does not yet cross levels (the actionable input to .420). Do NOT claim a circular win (verifier_is_oracle stays false).

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: energy_routing_<game>_reached_L2_oracle_distinct OR complete: energy_routing_no_deeper_level_signal_characterized_honest_null."
        inference_substrate:
