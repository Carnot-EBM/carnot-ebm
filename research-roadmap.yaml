- id: exp2385-kinetic-langevin-vs-casal
  title: 'Phase 3: Kinetic Langevin Splitting vs CASAL (arXiv:2603.23397) — Underdamped Faster Mixing'
  milestone: 2026.05.232
  deliverable: results/experiment_2385_kinetic_langevin.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2355-projected-langevin-v5
    verdict: 'complete: projected_langevin_competitive=true, langevin_vs_casal_delta=0.333'
    addressed_by: "exp2355 implemented overdamped projected-Langevin (static constraint
      manifold projection). exp2385 implements KINETIC (underdamped) Langevin splitting
      (arXiv:2603.23397) — a fundamentally different dynamics class with momentum terms.
      Kinetic Langevin typically achieves 2-4x faster mixing than overdamped on smooth
      manifolds due to momentum acceleration. Different algorithm family, different expected
      performance profile, new scope. exp2355 result is the comparison baseline."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: Kinetic Langevin Splitting (arXiv:2603.23397, March 2026) proposes splitting
    schemes for underdamped (kinetic) Langevin dynamics under constraints. Unlike overdamped
    Langevin (used in CASAL and projected-Langevin), kinetic Langevin adds a momentum variable
    that typically achieves 2-4x faster mixing on smooth constraint manifolds.

    Kinetic Langevin update:
      q_{t+1} = q_t + gamma * p_t  (position update via momentum)
      p_{t+1} = p_t - gamma * grad_E(q) + sqrt(2*gamma) * xi  (momentum update with noise)
    Constraint enforcement: project q onto constraint manifold after each position step.

    Benchmark: compare kinetic Langevin vs CASAL vs projected-Langevin (exp2355 baseline)
    on the same 3-problem constraint satisfaction suite.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/samplers/casal.py (or equivalent CASAL implementation)
      {project_root}/python/carnot/samplers/ (look for projected_langevin.py)
      {project_root}/results/experiment_2355_projected_langevin.json (overdamped baseline: delta=0.333)
      {project_root}/results/experiment_2371_lagonn.json (LagONN reference for problem suite)

    TASK: Implement kinetic Langevin splitting sampler and benchmark vs CASAL on 3-problem suite.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Verify numpy and scipy available:
            .venv/bin/python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
         b. Read exp2355 to extract the 3-problem suite definition:
            .venv/bin/python -c "import json; d=json.load(open('{project_root}/results/experiment_2355_projected_langevin.json')); print(list(d.keys()))"
         c. CPU-only confirmed.

      1. Implement KineticLangevinSampler at python/carnot/samplers/kinetic_langevin.py:
         - sample(energy_fn, constraint_fn, x0, n_steps, gamma=0.1, random_seed=42) -> ndarray:
           Implementation of kinetic Langevin splitting:
             Initialize momentum p ~ N(0, I)
             For each step:
               q = q + gamma * p  (position half-step)
               p = p - gamma * grad_E(q) + sqrt(2*gamma) * xi  (momentum update, xi~N(0,I))
               q = project_to_constraint(q)  (enforce constraint feasibility)
         - Returns: trajectory of q values

      2. Define 3-problem constraint satisfaction suite (use same as exp2355):
         Problem 1: 2D quadratic optimization with linear equality constraint
         Problem 2: 4-variable Ising spin configuration with parity constraint
         Problem 3: 6-variable continuous optimization with box constraints
         For each problem: known ground-truth optimal solution and constraint feasibility check.

      3. Run kinetic Langevin, projected-Langevin, and CASAL on same 3 problems:
         Metrics for each: n_steps_to_convergence, constraint_satisfaction_rate, wall_time_s

      4. Compute:
         - kinetic_vs_casal_speedup: CASAL n_steps / kinetic n_steps (> 1 = kinetic faster)
         - kinetic_vs_projected_speedup: projected n_steps / kinetic n_steps
         - kinetic_constraint_satisfaction_rate: fraction of constraints satisfied at convergence

      5. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with kinetic_vs_casal_speedup."
      - kinetic_langevin_validated:
          principle: "True if kinetic Langevin ran on all 3 problems."
      - kinetic_vs_casal_speedup:
          principle: "Primary metric. > 1.0 means kinetic Langevin is faster. Hypothesis: 2-4x."
      - kinetic_vs_projected_speedup:
          principle: "Comparison vs overdamped projected-Langevin (exp2355 baseline)."
      - kinetic_constraint_satisfaction_rate:
          principle: "Fraction of constraints satisfied. Guards against speed-accuracy tradeoff."
      - n_problems:
          principle: "Must be 3 to match exp2355."
      - random_seed:
          principle: "Reproducibility. Must be 42."
      - duration_s:
          principle: "Guards against fabrication."

    ACCEPTANCE GATES:
      - condition: "kinetic_langevin_validated == true"
        principle: "Kinetic Langevin must run on all 3 problems."
      - condition: "n_problems == 3"
        principle: "Must match exp2355 problem suite."

