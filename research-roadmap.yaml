milestone: 2026.06.399
milestone_title: "CLOSE THE TWO OPEN §5 MOATS -- CROSS-DOMAIN SELECTION (rebuild w/ IR3DE linear router + CASCAL generated-data pretrain + ContextPRM coherence) AND IN-GENERATION GUIDANCE (rebuild w/ external-PRM reward-guided STEP-STITCHING, must-beat self-reward SMC) -- DEPLOY the hardened efficiency verifier as a budget-aware CASCADE ROUTER -- UNSTALL ARC (frontier-adapter-free graph-explore solver). .398 HARDENED efficiency-parity (exp4303 energy 0.8 vs judge 0.5 @ cost_ratio 1.03e-08, CI95 [0.1,0.5] excl 0 -- the operator's §5 win condition, MET) and POWERED self-learning (exp4306 +0.529, CI95 [0.408,0.651] excl 0), but left the IN-GENERATION moat (exp4304 +0.133, CI95 [-0.067,0.367] incl 0 -- UNDERPOWERED-POSITIVE, controls differentiated, scorer leak-free) and the CROSS-DOMAIN moat (exp4305 +0.231, CI95 [-0.115,0.538] incl 0 -- UNDERPOWERED-POSITIVE, label-ablation robust, GAP logged) OPEN, and ARC STALLED at 22 (exp4307 FLAGGED GATE_PASSED_WITHOUT_DATA: frontier adapter unavailable, 0 exploration actions). .399 is DEPTH on exactly the two underpowered-positive open moats with the flagged SOTA, plus the ARC unstall + the mandated self-learning (cross-game transfer) + off-ARC execution transfer. Oracle-distinct frontier (P0 2026-06-14): every LEARNED-verifier task verifier_is_oracle=false + a matched control + CI95-excl-0; execution-grounded wins (off-ARC) declare verifier_is_oracle=true honestly."
milestone_doc: openspec/change-proposals/research-roadmap-v399.md
milestone_overview: |
  .398 closed two §5 axes (efficiency-parity HARDENED; self-learning HELPS, powered) and left two OPEN -- but
  OPEN here means UNDERPOWERED-POSITIVE, not refuted: the in-generation moat point estimate was +0.133 (CI incl 0)
  and the cross-domain moat point estimate was +0.231 (CI incl 0). Both had clean harnesses (controls differentiated,
  scorer leak-free, label-ablation robust); they need a STRONGER METHOD + MORE POWER, which is depth, not a doomed
  rerun (north-star §1 Depth-Over-Breadth). ARC stalled at 22 on a harness failure (the frontier adapter was
  unavailable), not a science failure. .399 is DEPTH on exactly these, in order of load-bearing-ness:

    PHASE 0 -- TRANSITION: exp4313 archive .398 -> activate .399; record the TRUE .398 scorecard
      (efficiency-parity HARDENED; self-learning HELPS; in-generation + cross-domain UNDERPOWERED-POSITIVE/OPEN;
      ARC stalled-on-harness-failure).

    PHASE A -- CLOSE THE CROSS-DOMAIN SELECTION MOAT (rebuild exp4305 w/ the flagged SOTA + more power):
      A1 (exp4314) rebuild the cross-domain router with an IR3DE linear domain-expert router (2606.06098) +
        CASCAL generated-data synthetic-task pretraining (2601.09692) + ContextPRM domain-AGNOSTIC step-coherence
        features (2509.24460), over >=3 domains (ARC families + ARC-GEN generators + FoVer-step/math), trained on
        train-DOMAINS, tested beats-vote on a HELD-OUT DOMAIN frozen, with the LABEL-ABLATION anti-leak arm and
        more held-out tasks for power. Emit cross_domain_selection_holds := (held-out delta>0 AND CI95-excl-0 AND
        non-degenerate AND label_ablation_robust). verifier_is_oracle=false.

    PHASE B -- CLOSE THE IN-GENERATION MOAT (rebuild exp4304 w/ external-PRM step-stitching + must-beat self-reward SMC):
      B1 (exp4315) DiffusionGemma in-generation, reusing the exp4292/exp4304 leak-re-checked partial-state scorer
        as an EXTERNAL process reward over diffusion STEPS (Reward-Guided Stitching, 2602.22871: score every
        intermediate step, stitch the highest-scoring), with the must-beat INTRINSIC baseline = self-reward SMC
        (2602.01849, trajectory self-confidence, NO external model) + >=1 genuinely-engaged control + the no-op
        guard (exp4308 DEGENERATE_CONTROLS) + an independent leak re-check + MORE power. Emit
        diffusiongemma_guidance_moat := (Carnot - best-engaged-control > 0 AND CI95-excl-0 AND controls_differentiated).
        verifier_is_oracle=false.

    PHASE C -- DEPLOY the hardened efficiency verifier as a budget-aware CASCADE ROUTER (the .399 SOTA-ingestion headline):
      C1 (exp4316) the energy verifier as a budget-aware cascade policy (2510.14913): cheap discriminative energy
        scoring first, escalate ONLY low-margin cases to the LLM judge; report accuracy/cost vs always-energy and
        always-judge controls on a LARGER, multi-corpus n (broadens the exp4303 n>=30 win). Peers: Weaver 2506.18203,
        MSV 2603.03417. Emit cascade_dominates_controls := (cascade accuracy >= always-judge within CI AND cost
        between always-energy and always-judge -- a Pareto-efficient operating point). verifier_is_oracle=false.

    PHASE D -- UNSTALL ARC (north star; fix the exp4307 harness failure):
      D1 (exp4317) offline ARC +1 on a NEW game (total_levels >= 23; NOT r11l/ls20/wa30/sc25) with a
        FRONTIER-ADAPTER-FREE solver -- the training-free graph-explore agent (2512.24156: salience-prioritized
        state-transition graph, shortest-path to untested state-action pairs) so the solve does NOT depend on an
        unavailable adapter. HARD gate: exploration_actions_used>0 AND real_env_confirmed AND offline_reproduced
        (the exp4307 GATE_PASSED_WITHOUT_DATA flag must NOT recur).

    PHASE E -- CONTINUOUS SELF-LEARNING (mandated; NEW mechanism = cross-game learned-verifier transfer):
      E1 (exp4318) the standing ARC learned verifier (arc_value_learner: state->steps-to-go) trained on the SOLVED
        games' traces, tested LEAVE-ONE-GAME-OUT for SEARCH-EFFICIENCY transfer (does a value-head trained on
        other games reduce search states on a held-out game vs an untrained/uniform heuristic?) -- the north-star
        EFFICIENCY axis + the self-learning mandate in one. Honest null (per-game heads do not transfer) LOGS a
        game-invariant-ARC-value-representation gap. verifier_is_oracle=false.

    PHASE F -- OFF-ARC EXECUTION-VERIFIER TRANSFER (decentralization; GAP-CODE-EXEC-DEMOFIT; known-issues MANDATORY):
      F1 (exp4319) the GAP-4 execution primitive (induce program from demos -> restricted-exec -> demo-fit selection)
        run OFF-ARC on MBPP/EvalPlus (visible tests = demos, hidden tests = gold), local SOTA GGUF generator
        (gemma-4-12B-it), ACCUMULATE to power (resume-not-restart). Execution-grounded => verifier_is_oracle=true
        (honest: this is the cheap/automatic/decentralized execution layer, NOT the oracle-distinct moat).

    PHASE G -- INFRA + HYGIENE + CAPSTONE:
      G1 (exp4320) SOTA-ingestion -> .400. G2 (exp4321) registry/gaps hygiene + GAP-4 regression guard (robust
        aggregator). G3 (exp4322) hardware continuity opportunistic. G4 (exp4323) capstone .399 (robust aggregator).

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227) and the conductor stays stood-down. NO task
  may launch TRM training, run pkill/kill against train.py, or WRITE results/trm_runs/. Qwen is FORBIDDEN as the
  TRAINED base (Spurious-Rewards confound); Qwen GGUF as an off-policy JUDGE/GENERATOR is fine. Every LEARNED-verifier
  value task MUST declare verifier_is_oracle honestly (Circularity Discipline): an EXECUTABLE-oracle win is
  execution_grounded (cheap, valid, NOT a moat); the moat is the LEARNED-energy result with a matched control,
  CI95-excl-0. NO autonomous edits to docs/index.html / README / paper prose. Online ARC play stays operator-gated
  (NO leaderboard submission). DiffusionGemma MUST use the llama.cpp PR binary, not a standard GGUF loader.
  In-loop verifier-as-reward TRAINING is OUT-OF-BAND/operator-owned (exclusion_manifest verifier_as_reward_in_loop_axis,
  live_lora_verifier_as_reward_path) -- do NOT propose it as a conductor task.

