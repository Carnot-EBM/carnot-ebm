  - id: exp2305-sparse-ising-connectivity
    title: "Phase 3: Sparse Ising Connectivity via Copy-Node Graph Sparsification (arXiv:2503.01177)"
    milestone: "2026.05.226"
    deliverable: "results/experiment_2305_sparse_ising.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2295-pypi-escalation-fix-claude
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prompt: |
      CONTEXT: arXiv:2503.01177 introduces Scalable Connectivity for Ising machines via
      copy-node graph sparsification. The technique: replace each high-degree Ising spin
      with a "copy cluster" of lower-degree spins connected by ferromagnetic couplings.
      This reduces the maximum degree of the QUBO graph, making it mappable to hardware
      with limited connectivity (KV260 FPGA, future Extropic Z1) without changing the
      ground-state energy landscape.

      Carnot's parallel Ising sampler (parallel_ising.py) currently uses dense coupling
      matrices (O(n^2) edges). Applying copy-node sparsification could reduce LUT count
      in the KV260 RTL (exp2303) by reducing the max-degree bound on the synthesized circuit.
      This is the first introduction of this technique; no prior experiment has attempted it.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/samplers/parallel_ising.py
        {project_root}/python/carnot/hardware/transpiler/
        {project_root}/scripts/experiment_template.py
      TASK: Implement copy-node graph sparsification and measure LUT reduction estimate.
      CONCRETE STEPS:
        1. Create python/carnot/hardware/sparse_ising.py implementing:
           class CopyNodeSparsifier:
             - sparsify(J: np.ndarray, max_degree: int) -> dict
               Takes dense coupling matrix J (n×n) and a max_degree budget.
               Returns: {{"J_sparse": csr_matrix, "n_copy_nodes": int,
                         "max_degree_original": int, "max_degree_sparse": int,
                         "copy_coupling_strength": float}}
             - estimate_lut_reduction(max_degree_original: int, max_degree_sparse: int) -> float
               Heuristic: LUTs scale quadratically with local degree; estimate reduction
               as (max_degree_sparse / max_degree_original)^2.
        2. Write 2 unit tests in tests/python/hardware/test_sparse_ising.py
           (one: max_degree(J_sparse) <= max_degree parameter; two: J_sparse is positive
           semidefinite after copy-node insertion — energy landscape preserved).
        3. Run unit tests; record n_tests_passed.
        4. Evaluate on 3 Ising problem sizes:
           n=64:  dense J (max_degree=63), sparsify to max_degree=8
           n=128: dense J (max_degree=127), sparsify to max_degree=16
           n=256: dense J (max_degree=255), sparsify to max_degree=32
        5. Measure for each:
           - sparse_lut_reduction_pct: estimate_lut_reduction result (as %)
           - n_copy_nodes: overhead from copy clusters
           - n_added_edges: total edges in J_sparse vs J_dense
        6. Set sparse_connectivity_validated: true if sparse_lut_reduction_pct >= 50.0
           on the n=256 problem (matching the 2503.01177 paper's reported reduction).
        7. Write deliverable to results/experiment_2305_sparse_ising.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if sparsification ran to completion."
        - sparse_lut_reduction_pct:
            principle: "Primary hardware-feasibility metric; >= 50% at n=256 validates the technique for KV260 RTL integration."
        - sparse_connectivity_validated:
            principle: "Boolean gate. True when LUT reduction >= 50% at n=256."
        - n_copy_nodes:
            principle: "Records the overhead of copy-node insertion; high overhead negates LUT savings."
        - n_tests_passed:
            principle: "Unit tests must pass; implementation quality gate."
        - module_path:
            principle: "Records where CopyNodeSparsifier was written for integration with hardware/transpiler."
        - random_seed:
            principle: "Reproducibility for J matrix generation."

