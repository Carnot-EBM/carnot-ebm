         status/preconditions_checked/immutable_upstream_hashes principle: readiness requires exact replay of immutable structural and verifier inputs.
         atom_schema_version_and_hash/generic_atom_universe_contract principle: legal atoms derive from public type/operation schemas, never per-case answers.
         model_visible_vs_hidden_reference_separation/label_secrecy_and_no_complete_answer_enumeration_receipt principle: hidden exact labels cannot enter prompts, candidate vocabularies, transforms, or token supports.
         non_pruning_support_contract/search_reachability_and_inertness_receipt principle: ranking is allowed, irreversible pre-union deletion is not; exact search cannot receive credit for unreachable truth.
         semantic_view_transforms_and_inverse_receipts principle: transforms are deterministic, meaning-preserving, invertible, and output-independent.
         exact_completion_contract_and_bounds/python_z3_certificate_parity principle: bounded exact execution with cross-backend agreement is the only semantic authority.
         injected_omission_spurious_contradiction_and_order_matrix/included_and_excluded_pool_contract principle: audit both admitted and omitted atoms under frozen strata and reject accepted-only recall.
         held_family_and_adversary_manifest/replay_and_tamper_matrix principle: held splits, adversaries, checksums, and rejection behavior are sealed before later model rows.
         protected_files_unchanged/atom_support_fixture_ready_score principle: emit bare 1.0 only for complete no-leakage, no-enumeration, exact-parity, non-pruning, and tamper-safe evidence.
