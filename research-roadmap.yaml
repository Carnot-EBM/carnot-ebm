    \ benchmark.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST (fixed version from Exp 526).\n\
    3. Add REQ-BENCH-017 (Live 100q v8 with RETRO-053 fix applied), REQ-BENCH-018\
