    prompt: |
      CONTEXT ({date}, ARC sprint HEADLINE -- the oracle-distinct EBM MOAT, the operator's energy-augmented graft
      #3). The generation wall is EXHAUSTED (5 nulls; the .424 generation scopes are RETIRED -- do NOT re-propose
      them). The decisive un-addressed fact (docs/research-notes/arc-008-wall-root-cause-2026-06-21.md): the 0.08
      Kaggle ceiling has ONE binding cause -- the SCORED E3AgentPolicy is gated out of EVERY world-model path by
      the degenerate WorldModelVerifier (exact-full-grid-match / binary accuracy<0.5; TTT 0/5, e3 LLM induction
      0/6, model-size-independent), so it ALWAYS falls back to the bare-explorer 0.08 floor. The gate is broken
      two ways: (i) an IDENTITY engine scores high on no-op-heavy / click-heavy games (full-grid match rewards
      predicting "no change") and FALSE-PASSES; (ii) a genuinely-induced model that mispredicts one no-op cell is
      REJECTED. The fix (graft #3, oracle-distinct): (a) a CHANGE-WEIGHTED consistency score computed over the
      grid-CHANGING transitions ONLY, with a non-degeneracy requirement (>=1 correctly-predicted REAL change), and
      (b) a learned/calibrated TRUST ENERGY that ranks induced world-models by HELD-OUT (not prefix) misprediction
      -- low energy = trustworthy = use it to plan. verifier_is_oracle: false (the trust energy ranks by held-out
      GENERALIZATION; it is oracle-DISTINCT from running the executable win-check). NO 3090; any optional LLM-
      induction arm runs on the iGPU Qwen3.5-9B-MTP and declares live_llm_inference for THAT arm only. Honest null
      with a passing control if the trust-energy gate does not help.

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_executable_world_model.py (WorldModelVerifier -- the degenerate exact-match/binary-accuracy gate to REPLACE; plan_in_model)
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (E3AgentPolicy -- the SCORED agent; where the trust gate decides whether a world-model path is USED vs the bare-explorer floor)
        - {project_root}/docs/research-notes/arc-008-wall-root-cause-2026-06-21.md (the root-cause analysis this task fixes)
        - {project_root}/docs/research-notes/arc-energy-augmented-strategy.md (the energy-augmented spine; graft #3)
        - {project_root}/ops/verifier_gaps.md (GAP-ARCH-WORLD-MODEL-TRUST-ENERGY ~2434, GAP-WM-TRUST-GATE ~2471 -- the gaps this fills)
        - {project_root}/python/carnot/agentic/arc_value_learner.py (the learned-verifier training pattern to reuse for the trust energy; CPU-trained, mirror-ready)

      TASK: replace the degenerate WorldModelVerifier trust gate with a non-degenerate, oracle-distinct TRUST
      ENERGY. Measure world_model_trust_pass_rate (the fraction of hidden-state games where a world-model path
      PASSES the new gate AND is used by the planner) + first-win-rate + median actions-to-first-levelup on
      held-out variants WITH the new gate vs WITH the binary exact-match gate (the matched control). The WIN: a
      world-model path now passes + is used on >=1 game where the binary gate 0/6 rejected it, AND first-win-rate
      up (bootstrap CI excludes the binary-gate baseline) OR efficiency up, solve-rate not dropped.
      verifier_is_oracle: false. Offline-reproduce any newly-solved level.

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
           b. `.venv/bin/python -c "from carnot.agentic.arc_executable_world_model import WorldModelVerifier"` exits 0.
           ANY missing -> honest_verdict blocked_<resource>, populate preconditions_checked, EXIT. (--no-cov on focused pytest.)
        1. Build the new trust gate (do NOT modify scripts/research_conductor.py): (a) CHANGE-WEIGHTED consistency = agreement on grid-CHANGING cells / transitions only, REQUIRING >=1 correctly-predicted real change (kills the identity false-pass); (b) a learned/calibrated TRUST ENERGY (reuse the arc_value_learner training pattern) that ranks induced world-models by HELD-OUT misprediction (train on early transitions, score on held-out later ones). Keep the binary gate available as the no-regression matched control.
        2. Measure WITH the new gate vs WITH the binary gate on the hidden-state / world-model games (the 0/6 set: include the games where e3 LLM induction currently fails) x held-out variants: world_model_trust_pass_rate, first-win-rate, median actions-to-first-levelup, solve-rate. Bootstrap CI on the first-win delta.
        3. POSITIVE CONTROL + FALSE_NEGATIVE_RISK: the binary-gate arm on the SAME games IS the matched control (the new gate must beat it on trust-pass-rate AND not drop solve-rate). A no-value null is valid ONLY if this control ran (set positive_control_passed). Emit trust_pass_rate_delta + first_win_delta explicitly + a null_delta_methodology_note when 0. Verify the new gate does NOT false-pass an IDENTITY engine on a no-op-heavy game (the GAP-WM-TRUST-GATE degeneracy -- assert identity is REJECTED). Offline-reproduce any newly-solved level; only reproduced solves count. Log the residual (which world-model game still 0-passes after the fix) as a Missing-Verifier gap.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: world_model_trust_energy_pass_rate_up_<n>_first_win_up OR complete: world_model_trust_energy_no_value_honest_null_residual_logged."
        inference_substrate:
          principle: "verifier_ensemble_against_cached_candidates -- offline trust-gate scoring over cached transitions (1s floor); if the optional LLM-induction arm runs, declare live_llm_inference for THAT arm + the Qwen3.5-9B-MTP iGPU precondition (NEVER the 3090s)."
        verifier_is_oracle:
          principle: "MUST be false -- the trust energy ranks induced world-models by HELD-OUT generalization, oracle-DISTINCT from running the executable win-check (a circular trust claim would not count)."
        solve_provenance:
          principle: "live_agent_self_discovery if the fixed trust gate lets the SCORED agent's own planner reach a level it previously could not; development_proxy if measured via the offline twin. NOT outer_loop_re."
        world_model_trust_pass_rate_new:
          principle: "the HEADLINE -- fraction of world-model games where the new change-weighted+held-out gate PASSES a world-model path AND the planner USES it; > the binary-gate baseline is the 0.08-wall crack."
        world_model_trust_pass_rate_binary:
          principle: "the matched binary exact-match-gate baseline on the SAME games (the apples-to-apples control; the current 0/6 failure surface)."
        trust_pass_rate_delta:
          principle: "new - binary (positive = the degenerate gate fixed), emitted explicitly so a null (0) is annotated."
        first_win_rate_new:
          principle: "first-win-rate on held-out variants WITH the new gate (the downstream effect of using the world-model path)."
        first_win_delta:
          principle: "new - binary first-win-rate, emitted explicitly so a null (0.0) is annotated."
        first_win_ci:
          principle: "bootstrap CI on the first-win delta; a claim above baseline requires the CI to exclude the binary-gate baseline."
        median_actions_to_first_levelup_new:
          principle: "ACTION cost WITH the new gate -- the leaderboard tiebreaker (RHAE rewards efficiency)."
        identity_engine_rejected:
          principle: "HARD non-degeneracy assertion -- an IDENTITY world-model (predict no change) MUST be REJECTED by the new gate on a no-op-heavy game (the GAP-WM-TRUST-GATE failure mode the binary gate false-passed)."
        binary_gate_control_passed:
          principle: "the POSITIVE CONTROL -- the new gate must beat the binary gate on the SAME games; a null is valid only if this ran (no broken-control trap)."
        false_negative_risk_checked:
          principle: "true with the binary-gate control run -- a no-value null is valid only then."
        null_delta_methodology_note:
          principle: "present when trust_pass_rate_delta==0 -- states the equality is an honest no-value null, not a measurement bug."
        solve_rate_preserved:
          principle: "HARD gate -- the new gate must NOT drop solve-rate on games the binary gate already solved."
        chosen_submitted_config:
          principle: "what (if anything) is recommended for SUBMITTED_AGENT_CONFIG (enable the trust-energy gate) -- the A6 input; 'unchanged' if null."
        residual_world_model_gaps:
          principle: "which world-model game still 0-passes after the fix -- the Missing-Verifier Gap Logging entry."
        offline_reproduced:
          principle: "any newly-solved level must offline-reproduce to count."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "content-addressed hash catches silent harness/corpus drift on replay."
        preconditions_checked:
          principle: "records resources verified (offline arcade, WorldModelVerifier importable); pre-empts missing-resource fabrication."

      Run: cd {project_root} && .venv/bin/python python/carnot/experiment_4604_world_model_trust_energy.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

