    - python/carnot/verify/
    - scripts/experiment_template.py
    - results/experiment_1384_ebm_cot_energy_calibration_probe.json

    TASK:
    Apply EBM-CoT contrastive hinge loss to Carnot's KAN energy tier with
    consistency_regularization_weight=0.0. Confirm calibration improvement
    (AUROC delta > 0) without consistency regularization.

