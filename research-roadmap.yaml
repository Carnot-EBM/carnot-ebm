        - research-references.md ".388 planning sweep": arXiv:2504.01005 (SC cost crossover), 2504.16828 (ThinkPRM comparator), openreview cve4NOiyVp (cost-tuned judge)

      TASK: run the 4-arm efficiency moat (verifier vs LLM-judge vs vote vs oracle) with accuracy + REAL cost.

      CONCRETE STEPS:
        0. PRECONDITIONS: A1 reported max_selectable_headroom >= 0.10 AND llm_judge_ready=true. If the gate
           field is missing/below 0.10 OR the judge arm is not ready -> honest_verdict
           `complete_efficiency_moat_deferred_no_headroom_or_no_judge` and STOP. (The conductor gate should
           skip this automatically; this is the in-script backstop.)
        1. ARM A (verifier): rerank K candidates per problem by the Carnot executable/energy verifier + V-STaR
           selector; record pass@1 + total verifier wall-clock seconds + total tokens (0 for the executable
           verifier; selector featurization time counted).
        2. ARM J (LLM-as-judge): the A1 judge arm picks the best candidate per problem; record pass@1 + total
           judge wall-clock seconds + total prompt/completion tokens.
        3. ARM B (SC-vote): self-consistency majority vote; pass@1 + (near-zero) cost. ORACLE: pass@k ceiling.
        4. Report: accuracy parity = bootstrap CI95 on pass@1(A) - pass@1(J); cost_ratio_wall_clock and
           cost_ratio_tokens = ARM A cost / ARM J cost; the Pareto point. Run adversarial_verify.py.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A clean efficiency win, an honest 'judge wins on accuracy', or 'no cost advantage' are ALL COMPLETE, decision-grade verdicts."
        verifier_efficiency_win:
          principle: "Bare bool: ARM A within-CI of ARM J on accuracy AND >=10x cheaper (or strictly Pareto-dominant). The north-star §5 win condition, measured against an LLM-judge with REAL cost."
        accuracy_parity_vs_judge:
          principle: "pass@1(A) - pass@1(J) with bootstrap CI95 — does the cheap verifier MATCH the expensive judge on accuracy?"
        cost_ratio_vs_judge:
          principle: "{{wall_clock, tokens}} ratio ARM A / ARM J — the efficiency axis in REAL units, fixing the .387 abstract-cost-unit caveat."
        positive_control_confirmed:
