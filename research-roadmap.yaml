    CONCRETE STEPS:
    1. Print a flushed start line. Resolve actual input paths, hashes, roles and gate operands before compute. Missing external prerequisites end as complete_blocked_* with verdict_class=blocked and gate_check_summary, never partial.
    2. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess. Include elapsed time and completed units. Print inside long loops. Supervise owned children with a heartbeat every 60 seconds or less; keep every output gap under 600 seconds and each tool wait at most 60 seconds. Silence gives an effective 1200-second budget; continued output permits the 4800-second cap. Never pad timing.
    3. Write any file over about 200 lines in several tool calls of at most 150 lines, with a progress message between calls. Keep analysis, code writing and every tool call bounded. Checkpoint by code/config/input hash. Put probes in /tmp and real scripts in scripts/experiments/.
    4. Before implementation, add task-owned REQ-* and SCENARIO-* items to the applicable capability spec and write failing tests first. Freeze the complete affected dependency closure, exact argv, expected exits and failure reasons, deadlines and measured modules before results. Preserve existing assertions, checks and historical verdicts.
    5. Reuse callable libraries and receipt helpers. Keep the new CLI small; do not copy a historical dispatcher or invent commands by replacing experiment numbers. Use explicit paths. Put all pytest --basetemp, temporary coverage files and CLI fixture outputs in private /tmp directories outside results; copy sealed evidence only after child exit. Historical tests use immutable private authorities. Never disable result guards.
    6. Reproduce Exp7901 five affected failures: pytest scratch below results caused guard redirection and cross-device atomic rename errors; its coverage reached only 141/218 statements. Use a private TemporaryDirectory under /tmp for every test/coverage/fixture root and keep atomic source and destination on that filesystem. Test child environments and exact argv. Do not disable guards, move historical data or weaken private-path assertions.
    7. Reuse the board custody reducer with explicit paths and a small current CLI. Exercise missing source, malformed JSON, missing/empty/unrelated coverage data, valid private CLI, negative replay and final publication. Require 100 percent changed reducer and orchestration coverage, including the missed coverage rejection branch; preserve affected historical consumer tests and required failure records.
    8. Produce separate dated custody rows for KV260, PolarFire and GateMate. Verify historical artifact/log hashes and their exact scope: KV260 qualified fabric only at k_max<=5, PolarFire Linux CPU-only dispatch, GateMate unchanged 0xffffffff physical/JTAG block. Retain NPU/TSU access as unqualified. No repeated board probe, flash, installation or purchase is part of this task. If future KV260 access is justified, its precondition is ssh kria, not host storage inspection.
    9. Attach Exp7912 complete workload rows only when its current artifact is ready and unflagged; otherwise report unavailable service evidence without failing board custody. Compare bytes and measured host work to candidate placement constraints, not vendor headline efficiency. Run affected board-reader tests and E2E-016 fixture/replay. Preserve all three obligations and record current_device_execution_count=0.
    10. Run the frozen affected unit and consumer commands with PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov. Combine explicit unit plus real CLI success, expected-failure and cold-replay coverage data with identical includes; require nonempty data and 100 percent statements for every changed module and CLI. Preserve stricter existing obligations. Run scoped Ruff check/format, strict mypy, and scripts/check_spec_coverage.py with the explicit affected test filenames. Never invoke that script without filenames as an affected-scope check: no arguments scans the whole repository. Record the existing global backlog separately without changing historical requirements.
    11. Run the task-specific E2Es assigned below. Include --date {date} on BOTH E2E-016 fixture and replay routes. Cold-reduce claims from primitive rows. Preserve intended, eligible, started, completed, failed, censored, excluded and independent denominators at their own units. Seal child logs after exit at durable hash-addressed paths. Keep raw shards below 50 MiB and tracked files below 90 MB.
    12. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate; inspect their reports. Required owned failures imply disqualified and readiness zero. If the verdict changes, validate the final bytes again. Bind validator sidecars to candidate hashes and atomically publish only checked bytes. Fixture/oracle agreement can be circular_positive, never independent benefit.
    13. Use complete_* honest_verdict with terminal positive, circular_positive, null, blocked or disqualified classes. Use partial_* and partial only for unfinished owned work that another attempt can finish. A valid null can be ready. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Apply retire_if_same_verdict to an identical prior failure. Do not activate this roadmap, change production defaults or publish externally.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date: Exact numeric ID, YAML ID, 2026.09.686 and {date}. Principle: Evidence belongs to the producer that executed it.
    - honest_verdict, verdict_class: Closed enum positive | circular_positive | null | blocked | disqualified | partial, with complete_* or partial_* prefix as appropriate. Principle: External incompleteness is terminal blocked.
    - flagged_adversarial: Actual terminal validator result. Principle: Flagged evidence cannot open gates.
    - gate_check_summary: Every blocked_* or complete_blocked_* names upstream ID, path/hash, field, op, expected and observed values; required-check failures also name their operands. Principle: Missing evidence, missing fields and failed values differ.
    - rows, sample_size_budget: Per-family/unit/arm/seed metrics and intended, eligible, started, completed, failed, censored, excluded and independent counts. Principle: Recompute comparisons without rerunning; do not sum checkpoints, families and boards into one n.
    - acceptance_gate_results: Separate validity, readiness, probability quality, decision benefit, retention and efficiency; null for unmeasured. Principle: Working mechanics do not imply benefit.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Monotonic times and actual code/config/data hashes. Principle: Authenticate work without padding.
    - source_artifact_hashes, preconditions_checked, resolved_imports: Paths, byte hashes, exposure roles and qualified import names. Principle: Preserve evidence custody.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, historical_required_failures, repository_health: Exact argv, expected and actual exits, deadlines, sealed log hashes and measured files. Principle: New affected qualification does not erase historical or repository-wide failure.
    - verifier_is_oracle, claim_scope: Fixture/oracle agreement is circular; natural data is exposed_development unless independently reserved. Principle: Repeated development measurement cannot close GAP-ORACLE-DISTINCT.
    - inference_substrate, inference_substrate_class, execution_venue: Actual compute from TASK; host for host CPU/GPU work, not host_cpu. Retain planned class separately if no run occurs. Principle: Workload determines the duration floor.
    - MODEL_SPECS, model_specs, target_model, model_invocation_counts, trained_head_specs: Actual pretrained models/calls/tokens or empty lists and zeros; fitted small heads separately. Principle: A cited LLM is not an invoked LLM.
    - field_principles: Explain every task-owned field and acceptance gate. Principle: Preserve the reason for the schema.
    - hardware_evidence_ready_score: 1 for authenticated historical custody and all owned checks; independent of optional service data. Principle: Historical device evidence is not new board execution.
    - board_rows, terminal_receipt_hashes, changed_physical_receipts, workload_feasibility_rows, workload_attachment_operands, current_device_execution_count, hardware_speedup_claimed: Three board dispositions, zero current device operations and no speedup. Principle: Workload estimates cannot expand hardware scope.

