    verdict: 'blocked_carnot_import_failed: required precondition command failed before implementation'
    addressed_by: "exp2549 was blocked because 'from carnot...' import failed (no module named 'carnot' — PYTHONPATH issue). This task applies the PYTHONPATH fix (sys.path.insert(0, project_root/python) before any carnot import) identified as the root cause in .245 capstone gap-2. Different from exp2549 in that it also adds Tier0w DiffuTruth (arXiv:2602.11364 thermodynamic divergence) as a second lightweight verifier in the same task."
    retire_if_same_verdict: true
  prompt: "CONTEXT: Two new verifiers are implemented in this task:\n  Tier 0v (HalluField, arXiv:2509.10753): hedge-word field energy; blocked in exp2549 by PYTHONPATH.\n  Tier 0w (DiffuTruth-inspired, arXiv:2602.11364): token logit variance as thermodynamic divergence proxy.\n\nBoth are TRAINING-FREE and compute from text features without live LLM inference.\n\nPYTHONPATH FIX (mandatory — this was the root cause in exp2549):\n  Before any 'from carnot...' import:\n  import sys, os\n  sys.path.insert(0, os.path.join('{project_root}', 'python'))\n\nTier 0v Implementation (hedge-word field energy):\n  HEDGE_WORDS = ['perhaps', 'might', 'could be', 'i think', 'approximately', 'roughly',\n                 'not sure', 'may be', 'unclear', 'according to', 'i believe',\n                 'as far as i know', 'possibly', 'probably', 'seemingly', 'apparently']\n  def score(self, response: str) -> float:\n    text_lower = response.lower()\n    hedge_count = sum(text_lower.count(w) for w in HEDGE_WORDS)\n    n_tokens = max(len(response.split()), 1)\n    return min(1.0, hedge_count * 3.0 / n_tokens)\n\nTier 0w Implementation (thermodynamic divergence proxy — token entropy):\n  def score(self, response: str) -> float:\n    # Proxy for thermodynamic divergence: measure token-level entropy from character distribution.\n    # Hallucinated text tends to have unusual character n-gram distributions (rare words, jargon).\n    words = response.lower().split()\n    if not words: return 0.0\n    # Word-frequency entropy\n    from collections import Counter\n    import math\n    counts = Counter(words)\n    n = len(words)\n    entropy = -sum((c/n) * math.log(c/n + 1e-9) for c in counts.values())\n    # Normalize by log(vocabulary_size); high entropy = more uniform = safer; low = suspicious specificity\n    # Invert: low vocabulary diversity = potential hallucination (overconfident single-concept)\n    vocab_size = max(len(counts), 1)\n    max_entropy = math.log(vocab_size + 1)\n    normalized = entropy / max_entropy if max_entropy > 0 else 0.0\n    # Low diversity (low normalized entropy) = higher hallucination risk\n    return max(0.0, min(1.0, 1.0 - normalized))\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/tier0r_curry_howard.py (interface pattern)\n  {project_root}/results/experiment_2548_real_corpus_validation.json (FoVer corpus)\n  {project_root}/results/experiment_2561_tier0t_dynamical.json (tier0t AUROC for comparison)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. PYTHONPATH-aware import:\n        python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('ok')\"\n        If fails: write honest_verdict 'blocked_carnot_import_failed_pythonpath_v2' and exit.\n        Set pythonpath_fix_applied=True if succeeds.\n  1. Implement Tier0vVerifier in python/carnot/verify/tier0v_hallufield.py\n     (using hedge-word implementation above).\n  2. Implement Tier0wVerifier in python/carnot/verify/tier0w_diffutruth.py\n     (using thermodynamic divergence proxy above).\n  3. Write unit tests for each: high-risk response > low-risk response.\n  4. Load FoVer corpus from exp2548. Score all examples with both verifiers.\n  5. Compute tier0v_auroc and tier0w_auroc.\n  6. Set tier0v_viable = (tier0v_auroc > 0.60), tier0w_viable = (tier0w_auroc > 0.60).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - tier0v_auroc:\n      principle: \"Tier 0v viability metric. >0.60 for ensemble candidacy.\"\n  - tier0w_auroc:\n      principle: \"Tier 0w viability metric. >0.60 for ensemble candidacy.\"\n  - tier0v_viable:\n      principle: \"Explicit viability flag.\"\n  - tier0w_viable:\n      principle: \"Explicit viability flag.\"\n  - pythonpath_fix_applied:\n      principle: \"True if sys.path.insert resolved the .245 PYTHONPATH issue. Documents the fix.\"\n  - corpus_type:\n      principle: \"'real_fover' or 'diverse_synthetic' — distinguishes paper-citable from non-citable.\"\n  - n_eval:\n      principle: \"Sample size — must be >= 50.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"(tier0v_viable == true OR tier0w_viable == true) OR (tier0v_auroc IS NOT NULL AND tier0w_auroc IS NOT NULL)\"\n    principle: \"Either at least one viable verifier OR both implementations evaluated honestly. Ensures the PYTHONPATH fix is exercised and verifier performance is measured.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

