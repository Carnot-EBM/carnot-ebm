  - id: exp2302-verge-repair-integration
    title: "Phase 2: VERGE SMT Minimal Correction Subset Repair Integration (arXiv:2601.20055)"
    milestone: "2026.05.226"
    deliverable: "results/experiment_2302_verge_repair.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2295-pypi-escalation-fix-claude
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prompt: |
      CONTEXT: VERGE (arXiv:2601.20055) — Formal Refinement and Guidance Engine — uses SMT
      Minimal Correction Subsets (MCS) to localize and repair Z3-encodable constraint
      violations. An MCS is the smallest subset of constraints that, when removed, makes
      the remaining system satisfiable. This enables targeted repair: rather than regenerating
      the full response, VERGE identifies which specific steps violated the constraints and
      patches only those steps.

      This is the repair-side complement to NSVIF (exp2301, which extracts violations).
      Together they form a detect-then-repair pipeline: NSVIF identifies the violation,
      VERGE isolates the minimal correction set and applies a targeted fix.

      NOTE: Requires z3-solver Python package (shared dependency with exp2301).
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/python/carnot/pipeline/extract.py (if exp2301 created it, else skip)
        {project_root}/scripts/experiment_template.py
      TASK: Implement VERGE-style MCS repair and evaluate on 20 synthetic violations.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. python -c "import z3; print(z3.get_version_string())" succeeds — else
              run: .venv/bin/pip install z3-solver -q
              If install fails: write honest_verdict blocked_z3_unavailable and exit.
        1. Create python/carnot/verify/verge_repair.py implementing:
           class VERGERepair:
             - find_mcs(solver: z3.Solver, constraints: list) -> list[int]
               Returns indices of the Minimal Correction Subset (min constraints to remove
               for satisfiability). Use OCUS algorithm: iteratively drop single constraints
               and check SAT until subset is minimal.
             - repair(original_text: str, mcs_indices: list, violations: list[str]) -> str
               Returns patched text with minimal corrections applied (stub implementation:
               prefix violated steps with "[CORRECTED]" and append a correction note).
        2. Write 2 unit tests in tests/python/verify/test_verge_repair.py
           (one: MCS finds smallest UNSAT core; two: repair produces different text than original).
        3. Run unit tests; record n_tests_passed.
        4. Evaluate on 20 synthetic violated (instruction, response) pairs:
           - Find MCS for each violation
           - Apply repair
           - Verify repaired text reduces constraint violation count
        5. Measure:
           - mcs_avg_size: mean size of found MCS (smaller = more targeted repair)
           - repair_violation_reduction_rate: fraction where repair reduces violations
           - mean_mcs_solve_time_ms: mean MCS computation latency
        6. Set verge_repair_validated: true if repair_violation_reduction_rate >= 0.60.
        7. Write deliverable to results/experiment_2302_verge_repair.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if VERGE ran to completion."
        - verge_repair_validated:
            principle: "Boolean. True when >= 60% of repairs reduce violations; 60% threshold is generous for a first implementation."
        - repair_violation_reduction_rate:
            principle: "Primary effectiveness gate; records whether targeted MCS repair actually fixes what it identified."
        - mcs_avg_size:
            principle: "Measures repair precision; MCS of size 1 is maximally targeted; large MCS means many constraints must change."
        - mean_mcs_solve_time_ms:
            principle: "MCS computation is NP-hard in general; latency determines cascade-tier cost feasibility."
        - n_tests_passed:
            principle: "Unit tests must pass; pipeline quality gate."
        - module_path:
            principle: "Records where VERGERepair was written for integration with verify_repair.py."
        - preconditions_checked:
            principle: "Lists Z3 availability check; mandatory per CLAUDE.md Pre-Launch Preconditions Discipline."

