    stationarity, initialization, and sensitivity. Estimate extra state, arithmetic, coefficient
    range, and memory traffic against documented KV260 and GateMate envelopes. Do not invoke or
    re-solve either board and do not infer clock, power, or throughput.

    CONCRETE STEPS:
    0. PRECONDITIONS: require temporal_exchange_comparison_completed=true, all raw sample or
       sufficient-statistic hashes, exact target hashes, update receipts, source code identity, and
       the existing board receipts. On failure write complete_blocked_temporal_exchange_audit with
