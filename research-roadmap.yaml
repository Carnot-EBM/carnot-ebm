  - id: exp2754
    milestone: "2026.05.261"
    deliverable: "results/experiment_2754_empirical_delta_audit.json"
    title: "Empirical Delta Root-Cause Audit: Verbose Repair Logging — Why 0/131 Attempts Succeed"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 30
    track: publication

    prior_failures:
      - experiment_id: exp2744-empirical-delta-paper-v6
        verdict: "complete: empirical_delta=0.000 (sum_successes=0, sum_attempts=131)"
        addressed_by: "exp2744 (.260) found empirical_delta=0.000 across 131 repair attempts in results/ artifacts. This is suspicious: delta=0 means the 4/delta bound implies infinite expected iterations (E[n] → ∞), which contradicts the paper's claim. Three root cause hypotheses: (H1) definitional mismatch (n_repair_attempts in artifacts counts something different from the delta formula); (H2) repair pipeline regression (repair loop never actually re-runs after collecting violations); (H3) FoVer ceiling (all violations in corpus are irreparable by design). This exp2754 diagnoses which hypothesis is correct by running a verbose 20-example repair loop with per-attempt logging. Different scope: exp2744 was a scan of existing artifacts; exp2754 runs a fresh diagnostic."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      exp2744 (.260) computed empirical delta = 0.000 (sum_successes=0 / sum_attempts=131).
      This contradicts paper-v6's use of the 4/delta convergence bound (arXiv:2512.02080):
      delta=0 → E[n] → ∞ (undefined). The paper cannot cite this bound as-is.

      Three root cause hypotheses:
      H1: Definitional mismatch — artifacts use n_repair_attempts as "number of ORCA TTT steps"
          (each step tries a repair) rather than "number of complete repair iterations that pass
          verification". The delta formula uses the latter (P(one repair iteration passes)).
      H2: Repair pipeline regression — the ORCA-TTT repair loop writes n_repair_attempts > 0 but
          never actually runs the verifier on the repaired output (success always False).
      H3: FoVer corpus ceiling — the specific FoVer examples collected have violations that are
          arithmetically impossible to repair (e.g., "2+2=5" has no valid rewriting that passes
          both the repair and verifier constraints simultaneously).

      EXISTING CODE TO READ FIRST:
      - results/experiment_2744_empirical_delta_paper_v6.json (sum_attempts=131, delta_source=empirical)
      - python/carnot/pipeline/ttt_loop.py (VerifierDrivenTTT — repair loop logic)
      - python/carnot/pipeline/verify_repair.py (verify() + repair() methods)
      - data/fover_corpus.jsonl (FoVer examples to test on)

      TASK: Run a verbose diagnostic on N=20 FoVer violations with per-attempt logging.
      Determine which root cause hypothesis explains delta=0.000.
      Recommend fix or negative-result documentation for paper-v6.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sys; sys.path.insert(0,'python'); import carnot.pipeline.ttt_loop"`
            Record: ttt_loop_importable (bool).
            If false: write honest_verdict 'blocked_ttt_loop_not_importable' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            Record: fover_corpus_lines (int).
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Read ttt_loop.py and verify_repair.py to understand what "n_repair_attempts" and
         "n_repair_successes" mean in the code. Look for:
         - How repair attempts are counted (per-step vs per-full-iteration)
         - When success is set to True (verifier passes? or just repair produces output?)
         - Whether the verifier is actually called after each repair attempt
         Record: n_repair_attempts_definition (str), success_condition (str).

      2. Run verbose repair on N=20 FoVer violations (random_seed=42):
         From FoVer corpus, select 20 violations (examples where the model's answer is wrong).
         For each: run 3 repair iterations, log per-iteration:
           - iteration_n: 1/2/3
           - original_violation_energy: verify(q, original_answer)
           - repair_output: repaired response (first 100 chars)
           - post_repair_energy: verify(q, repaired_answer)
           - repair_success: post_repair_energy < original_violation_energy
         Record: per_attempt_log (list of dicts), n_attempts_total (int), n_successes (int).
         empirical_delta_diagnostic = n_successes / n_attempts_total if n_attempts_total > 0 else 0.

      3. Diagnose root cause:
         If n_successes > 0: root_cause = "H1 definitional mismatch — delta > 0 with verbose logging"
         If n_successes == 0 AND repair outputs differ from original: root_cause = "H3 FoVer ceiling — repair runs but violations irreparable"
         If n_successes == 0 AND repair outputs == original: root_cause = "H2 repair pipeline regression — repair() is a no-op"
         Record: root_cause (str), delta_root_cause_identified (bool = root_cause != "unknown").

      4. Paper-v6 recommendation:
         If delta_diagnostic > 0: recommend "update paper with empirical delta from verbose run; cite as preliminary (N=20)"
         If root_cause == H2: recommend "fix repair pipeline; block paper-v6 cite until delta validated"
         If root_cause == H3: recommend "report as negative result: FoVer ceiling means delta=0 on this corpus; use conservative estimate with disclaimer"
         Record: paper_v6_recommendation (str).

