      - experiment_id: exp2993-aquaforte-beaver-substrate-corrigendum
        verdict: "complete: live retry measured separately and exp2934 retry substrate relabeled"
        addressed_by: "Adds durable model checksum, transcript, duration provenance, and two-condition replay while keeping enumerator fallback separate."
        retire_if_same_verdict: true
      - experiment_id: exp2934-aquaforte-beaver-live-gguf-retry
        verdict: "complete: exp2926 live GGUF proposals reformulated and exact-verified"
        addressed_by: "Revisits only the substrate/provenance ambiguity, not the enumerator fallback result."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp 2993 separated live retry evidence from enumerator fallback, but the .281 matrix and capstone still require clean live retry methodology, model checksum, transcript, and durable duration provenance. This task is a narrow provenance repair, not a new BEAVER headline.

      MODEL_SPECS:
