  - id: exp2583
    title: "tier0s Real-Corpus Retrain: Logistic Regression on FoVer Pairs"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: verifier_recovery

    prior_failures:
      - experiment_id: exp2509
        verdict: "complete: synthetic AUROC=1.0; real-corpus AUROC=0.3758 (near-random)"
        addressed_by: >
          exp2509 trained on synthetic NTK-proxy pairs; this trains on real FoVer corpus
          labeled pairs (n=6548) using logistic regression on TF-IDF features rather than
          NTK-proxy kernel similarity. Real training data is the structural fix for the
          synthetic→real distribution mismatch that caused AUROC=0.3758.
        retire_if_same_verdict: false

    context: |
      tier0s (HalluGuard NTK-proxy verifier) achieves real-corpus AUROC=0.3758 on FoVer
      natural-text pairs — near-random, contributing negligible signal to ensemble v7b.
      The root cause: tier0s was trained on synthetic pairs where NTK-proxy similarity is
      a reliable signal. On natural text, the NTK-proxy features are noisy.

      The FoVer corpus (n=6548 labeled real pairs) lives at:
        python/carnot/verify/foVer_corpus.jsonl  (or equivalent path — check glob)
      Each entry has: context, claim, label (hallucination/correct).

      Target: real-corpus AUROC > 0.65 (vs current 0.3758 baseline).

    existing_code_to_read:
      - python/carnot/verify/tier0s_halluguard.py
      - python/carnot/verify/foVer_corpus.jsonl
      - results/experiment_2509_tier0s_halluguard_ntk.json

    concrete_steps: |
      0. PRECONDITIONS:
         a. `python -c "import sklearn; print(sklearn.__version__)"` succeeds
         b. FoVer corpus file exists: `ls python/carnot/verify/foVer_corpus.jsonl` (or equivalent) returns non-empty
         c. `python -c "import carnot"` succeeds (Python package importable)
         If any precondition fails, write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus. Split 80/20 train/test stratified by label.
         Log n_train, n_test, label_distribution.

      2. Extract features from the context+claim pairs:
         - TF-IDF unigrams+bigrams on claim text (max_features=5000)
         - cosine similarity between context TF-IDF and claim TF-IDF
         - claim length in tokens
         - simple overlap coefficient between context tokens and claim tokens
         Feature matrix shape: (n_samples, ~5003).

      3. Train sklearn LogisticRegression(C=1.0, max_iter=1000, random_state=42)
         on train split. Evaluate on held-out test split: compute AUROC, AUPRC, F1.

      4. If test AUROC > 0.65: serialize the trained model to
         python/carnot/verify/tier0s_real_model.pkl (joblib).
         Update tier0s_halluguard.py to load this model when available (fallback to
         prior NTK-proxy if not found).

      5. Write results/experiment_2583_tier0s_real_retrain.json with all required fields.

    required_artifact_fields:
      honest_verdict:
        principle: "Terminal prefix required for conductor reconciler."
        format: "MUST start with complete: or complete_"
      tier0s_real_auroc:
        type: float
        principle: "Primary gate metric — must exceed 0.3758 (current baseline) to show improvement over synthetic training."
      tier0s_real_auprc:
        type: float
        principle: "Secondary metric — AUPRC is more informative than AUROC on imbalanced corpora."
      n_train:
        type: int
        principle: "Records corpus split size for reproducibility and sample-size adequacy checks."
      n_test:
        type: int
        principle: "Records held-out evaluation set size."
      random_seed:
        value: 42
        principle: "Determinism is the precondition for reproducibility."
      feature_description:
        type: str
        principle: "Documents feature engineering so future reruns can replicate the result."
      model_path:
        type: str
        principle: "Points to serialized model artifact for use by ensemble v9."
      preconditions_checked:
        type: list
        principle: "Records which resources were verified before proceeding."

    acceptance_gates:
      - condition: "tier0s_real_auroc > 0.3758"
        principle: "Must exceed the synthetic-trained baseline; any improvement is sufficient to justify ensemble update."
      - condition: "n_test >= 100"
        principle: "Statistical floor — distributional AUROC claims require at least 100 test examples (CLT minimum)."


  - id: exp2584
    title: "tier0u NLI-Proxy Fix: TF-IDF Cosine Self-Consistency on Real Text"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: verifier_recovery

    prior_failures:
      - experiment_id: exp2535
        verdict: "complete: synthetic AUROC=0.96; real-corpus AUROC=0.5360 (near-random)"
        addressed_by: >
          exp2535 trained on synthetic self-consistency pairs where logical consistency
          is derivable from template structure. This uses real FoVer corpus pairs with
          TF-IDF cosine similarity between claim and context as a proxy for logical
          consistency — a technique that generalizes to natural text. Different scoring
          technique (cosine overlap vs template self-consistency) AND different training
          source (real vs synthetic).
        retire_if_same_verdict: false

    context: |
      tier0u (Logical Consistency verifier) achieves real-corpus AUROC=0.5360 on FoVer
      natural-text pairs — near-random. Root cause: the self-consistency score was
      designed for synthetic pairs with template-predictable structure; it fails on
      natural text where self-consistency requires genuine semantic understanding.

      Replace the self-consistency scoring with TF-IDF cosine overlap between
      (context, claim) pairs as an approximation of "does the claim use concepts
      present in the context?" This is a heuristic but generalizes to natural text.

    existing_code_to_read:
      - python/carnot/verify/tier0u_logical_consistency.py
      - python/carnot/verify/foVer_corpus.jsonl
      - results/experiment_2535_tier0u_logical_consistency.json

    concrete_steps: |
      0. PRECONDITIONS:
         a. `python -c "import sklearn; print(sklearn.__version__)"` succeeds
         b. FoVer corpus file exists: returns non-empty
         c. `python -c "import carnot"` succeeds
         If any precondition fails, write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus. Split 80/20 train/test stratified by label.

      2. Compute per-sample feature: TF-IDF cosine similarity between context and claim
         using sklearn TfidfVectorizer(analyzer='word', ngram_range=(1,2), max_features=10000).
         Fit vectorizer on train context+claim combined. Score = cosine_similarity(
           context_tfidf_vector, claim_tfidf_vector).

      3. Also compute: claim length, context length, overlap coefficient (intersection /
         min(|context_tokens|, |claim_tokens|)), Jaccard coefficient.

      4. Train LogisticRegression(C=1.0, max_iter=1000, random_state=42) on these 4 features.
         Evaluate on test split: AUROC, AUPRC, F1.

      5. If test AUROC > 0.55 (improvement over 0.5360 baseline): serialize trained model to
         python/carnot/verify/tier0u_real_model.pkl. Update tier0u_logical_consistency.py
         to load this model when available.

      6. Write results/experiment_2584_tier0u_real_fix.json with all required fields.

    required_artifact_fields:
      honest_verdict:
        format: "MUST start with complete: or complete_"
        principle: "Terminal prefix required for conductor reconciler."
      tier0u_real_auroc:
        type: float
        principle: "Primary gate metric — must exceed 0.5360 baseline to show improvement."
      tier0u_real_auprc:
        type: float
        principle: "Secondary metric for imbalanced corpus evaluation."
      n_train:
        type: int
        principle: "Corpus split size for reproducibility."
      n_test:
        type: int
        principle: "Held-out evaluation set size."
      random_seed:
        value: 42
        principle: "Determinism for reproducibility."
      feature_description:
        type: str
        principle: "Documents scoring technique so results can be replicated or improved."
      model_path:
        type: str
        principle: "Points to serialized model for ensemble v9."
      preconditions_checked:
        type: list
        principle: "Records verified resources before proceeding."

    acceptance_gates:
      - condition: "tier0u_real_auroc > 0.5360"
        principle: "Must exceed the synthetic-trained baseline."
      - condition: "n_test >= 100"
        principle: "Statistical floor for distributional AUROC claims."


