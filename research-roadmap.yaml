      6. Re-run current adversarial, determination-preservation, and artifact-convention audits. Preserve stamped findings separately from current findings.
      7. Add or update REQ-* and SCENARIO-* entries. Write focused tests. Run independent reducer tests, spec coverage, adversarial verification, determination preservation, artifact convention audit, and root-clutter checks.
