- id: exp1141-wopr-slitherlink-rescue
  milestone: 2026.04.89
  deliverable: results/experiment_1141_wopr_slitherlink_rescue.json
  title: "WOPR Slitherlink Puzzle Cartridge Rescue — Loop Constraint Ising Encoding"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 25
  priority: high
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1136-wopr-slitherlink-cartridge
      verdict: blocked_gate_check_failed
      addressed_by: |
        exp1136 (.88) was blocked before running a single line of code because the task
        had no prior_failures field, and the conductor's keyword-match found 5 prior
        WOPR cartridge failures. exp1141 is the rescue: this prior_failures block
        exhaustively declares all relevant prior matches so the conductor will not block.
        The Slitherlink LOGIC was never attempted — this is a first real run.
      retire_if_same_verdict: false
    - experiment_id: exp1060-wopr-gtw-v2
      verdict: blocked_codex_config_error
      addressed_by: |
        FALSE-POSITIVE on 'WOPR' keyword. exp1060 failed because the codex CLI's
        config.toml rejected the conductor's model_providers key. That bug was fixed
        in exp1065 and codex is re-enabled since .85. This entry is included to
        satisfy the failure-ledger matcher; it is not a failure of Slitherlink logic.
      retire_if_same_verdict: false
    - experiment_id: exp1061-wopr-lights-out-v2
      verdict: blocked_codex_config_error
      addressed_by: |
        FALSE-POSITIVE on 'WOPR' keyword. Same codex config root cause as exp1060.
        Codex is re-enabled. Included for completeness.
      retire_if_same_verdict: false
    - experiment_id: exp1097-wopr-nqueens-cartridge
      verdict: blocked_prior_count_over_cap
      addressed_by: |
        FALSE-POSITIVE on 'WOPR cartridge' keywords. exp1097 was N-Queens (a CSP with
        column/row/diagonal constraints), which is structurally different from Slitherlink
        (a planar-loop / degree-parity constraint). Different encoding, different search
        space, different Ising formulation. This entry is included to satisfy the matcher.
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    The WOPR games gallery (huggingface.co/spaces/Carnot-EBM/wopr-games) has:
    Sudoku, GTW, Lights Out, N-Queens, Hashi (E=0 at convergence). Slitherlink was
    planned in .88 but blocked by gate/prior-failures metadata before a single line
    of code ran.

    Slitherlink puzzle rules:
    - NxM grid of dots. Clue digit in each cell (0-3) or blank.
    - Draw a single closed loop using horizontal/vertical edges between dots.
    - Clue = exactly how many of the cell's 4 adjacent edges are loop edges.
    - No branching (every dot has exactly 0 or 2 edges), exactly one connected loop.

    Ising encoding for a 3x3 grid (4x4 dots):
    - Spins: one per edge. 12 horizontal + 12 vertical = 24 spins. s_e in {-1, +1}.
      s_e = +1 means edge is IN the loop. s_e = -1 means NOT in loop.
    - Energy term 1 — CLUE_PENALTY: for each clued cell c with digit d:
        count_c = (1/2) * sum_{e in edges(c)} (1 + s_e)   [count of active edges]
        penalty_c = (count_c - d)^2
    - Energy term 2 — DEGREE_PENALTY: for each dot v:
        degree_v = (1/2) * sum_{e incident v} (1 + s_e)
        penalty_v = 0 if degree_v in {0, 2} else 1
        Implement as: (degree_v * (degree_v - 2))^2   [= 0 iff degree is 0 or 2]
    - Energy term 3 — EMPTY_PENALTY: 1000 if sum of all spins == -N_SPINS (all off)
    E_total = w_clue * sum(penalty_c) + w_degree * sum(penalty_v) + EMPTY_PENALTY
    Defaults: w_clue=10.0, w_degree=5.0

    EXISTING CODE TO READ FIRST:
    - spaces/wopr-games/games/hashi.py (most recent cartridge — use as template)
    - spaces/wopr-games/app.py (understand how cartridges are loaded and registered)
    - results/experiment_1124_wopr_hashi_cartridge.json (Hashi success pattern)

    TASK:
    1. Implement spaces/wopr-games/games/slitherlink.py following the Hashi template.
       Class: SlitherinkCartridge (note the typo — match the prior exp1136 prompt spec to
       avoid any naming mismatch with app.py if it registered the module name).
       Methods: __init__, energy, sample, to_display.
    2. Canonical 3x3 test puzzle (diamond pattern, known to have E=0 at 24 spins):
         clues = [[None, 2, None],
                  [2,   None, 2],
                  [None, 2, None]]
    3. Write tests in spaces/wopr-games/tests/test_slitherlink.py:
       - test_energy_at_known_solution_is_zero()
       - test_energy_at_empty_is_nonzero()
       - test_degree_two_dot_has_zero_penalty()
       - test_degree_one_dot_adds_energy()
       - test_sample_converges()
    4. Verify: SlitherinkCartridge(clues, (3,3)).sample(n_steps=5000) achieves E=0.
    5. Register Slitherlink in spaces/wopr-games/app.py cartridge menu.
    6. Write experiment result artifact.

    CONCRETE STEPS:
    - cat spaces/wopr-games/games/hashi.py
    - cat spaces/wopr-games/app.py | grep -i "game\|cartridge\|register\|menu"
    - (Implement slitherlink.py and test_slitherlink.py)
    - python3 -m pytest spaces/wopr-games/tests/test_slitherlink.py -v 2>&1 | tail -20
    - python3 -c "
      import sys; sys.path.insert(0, '.')
      from spaces.wopr_games.games.slitherlink import SlitherinkCartridge
      clues = [[None,2,None],[2,None,2],[None,2,None]]
      c = SlitherinkCartridge(clues, (3,3))
      spins = c.sample(n_steps=5000)
      e = c.energy(spins)
      print('E at convergence:', e)
      assert e == 0.0, f'Expected E=0, got E={e}'
      print('PASS: E=0 at convergence')
      "
    - Write results/experiment_1141_wopr_slitherlink_rescue.json

    REQUIRED ARTIFACT FIELDS:
    - cartridge_file: "spaces/wopr-games/games/slitherlink.py"
    - cartridge_file_written: bool
    - n_spins: int (24 for 3x3 grid)
