    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py

    TASK:
    Bind the V678 authority and write docs/research-notes/v678-method-map.md. Register adopted literature, causal contrasts and validation ownership without rerunning science.
    Deliverable: {project_root}/results/experiment_7795_v678_contract_methods.json.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print a flushed start line. Check named input paths, digests, schemas, exact gate fields and required resources before compute. Distinguish a science producer from a conductor pre-gate receipt. Missing external inputs yield complete_blocked_* with verdict_class=blocked and the failed operand. No simulated substitute.
    1. Print a flushed progress line at each phase boundary, and before and after every model load, generation, benchmark and subprocess. Include elapsed seconds and completed units. Emit status inside long loops and while supervising children at least every 60 seconds. Keep every silence gap below 600 seconds. Kill only owned children at their timeout. Never pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Bound each tool call; poll long commands at most 60 seconds apart. File-writing silence also triggers the stall rule.
    3. Add task-owned REQ-* and SCENARIO-* requirements to the relevant capability spec before code. Freeze the complete affected module/test closure and exact validation argv before implementation. Write meaningful failing tests first. Keep all original assertions; no skip, xfail or weakened tests. Use authentic historical fixtures independent of the mutable roadmap.
    4. Use the existing explicit-scope validation helper in a new task-owned entrypoint. Reuse low-level measurement functions, never an old run_experiment/main or mutable module-global reconfiguration. Historical full-suite contracts and verdicts remain unchanged. If an inherited entrypoint is invoked, its full-suite obligation still applies. New required checks cover all affected tests, all changed code and real integration behavior. Broad repository health is a separate diagnostic; it cannot be reported green from scoped checks.
    5. Compare the literal design table, embedded V678 JSON and matching staged or active YAML. Require fourteen tasks Exp7795 through Exp7808 in order. Validate titles, phases, outputs, models, substrates and gates independently. Store exact YAML and design bytes under docs/research-notes/v678-authority-snapshots/. A later roadmap must not replace historical authority.
    6. Run unchanged schema, exclusion, prior-failure, gate, harness-fit, ARC-floor and overdue-priority readers. Challenge private copies with missing tasks, reordered IDs, stale designs, changed models, misspelled producer fields and incomplete prior_failures. Confirm each is rejected.
    7. Write the method map from the completed V678 research review. Register the CoEV text deletion diagnostic, CCHD matched augmentation, Memoir write timing and delayed-feedback capacity. Keep visual-domain results, vendor efficiency estimates and exposed local measurements separate.
    8. Preserve the V677 failure ledger and the oracle-distinct corrigendum. Require task-local prospective validation for new entrypoints; inherited full-suite obligations remain unmet. This contract result cannot qualify any scientific producer.
    9. Run the frozen affected unit suite and require 100% statement coverage of all new or changed modules and CLI paths. Use private coverage shards with identical branch settings and explicit include paths. Preserve all shard exits before combining. Use PYTHONPATH=python:. with pytest -n 0 -o addopts= --no-cov. Run scoped Ruff check/format, mypy, and scripts/check_spec_coverage.py on explicit test files. Fix owned failures before measurement.
    10. Run the task-specific real entrypoint E2E and applicable ops/e2e-test-plan.md checks. Reduce raw rows in a fresh process. Run scripts/adversarial_verify.py on the exact candidate and scripts/verdict_row_consistency_lint.py --strict. Save validation argv, exits and durable log hashes. Test fixtures and pytest basetemp stay outside results/. Copy completed validation logs to task-owned raw storage before hashing. Failed required validation sets every readiness field to 0 and verdict_class=disqualified.
    11. Write the exact deliverable atomically after validation. Preserve null, rejected, censored and unstarted rows. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Apply same-verdict retirement to listed priors. Do not activate, publish, change production defaults, rewrite historical artifacts, or modify guards.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, milestone, run_date: Bind this task, 2026.09.678 and {date}. principle: Each result has one owner.
    - honest_verdict: Terminal complete_* string; complete_blocked_* for external missing inputs. principle: External incompleteness cannot be fixed by retrying owned work.
    - verdict_class: One of positive | circular_positive | null | blocked | disqualified | partial. Partial means incomplete owned work only. principle: Claim strength travels with the record.
    - flagged_adversarial: Actual terminal-reader boolean. principle: Invalid evidence cannot open a gate.
    - gate_check_summary: Failed checks with upstream id, exact path/hash, field, operator, expected and observed values; [] when none fail. principle: Missing evidence differs from a scientific null.
    - rows: Per-independent-family/game/seed/arm or per-check records, including raw provenance and metrics. principle: Recompute every comparison from its units.
    - acceptance_gate_results: Separate validity, readiness, probability_quality, decision_benefit, retention and efficiency; unmeasured values are null. principle: A working fixture proves no scientific gain.
    - duration_s, phase_spans: Measured monotonic elapsed times. principle: Duration reflects actual work.
    - random_seed, reproducibility_checksum: Exact code, inputs, roles, configuration and seed digests. principle: Replay requires identical inputs.
    - sample_size_budget: Intended, eligible, started, completed, excluded, censored and independent N. principle: Views and seeds are not new families.
    - source_artifact_hashes: Paths, digests, dates, imported fields and eligibility. principle: Old files cannot replace missing current producers.
    - preconditions_checked: Actual input, custody, backend and resource checks. principle: Cheap failures precede compute.
    - validation_receipts: Frozen affected scope, commands, exits, log hashes, coverage, E2E and cold readers. principle: Every required check must pass.
    - verifier_is_oracle, claim_scope: Exact-authority/fixture success is circular_positive. All 640 source families are exposed development data. principle: No hidden generalization or oracle-distinct benefit follows from fixture truth.
    - field_principles: Preserve the rationale for every field and gate. principle: Evidence requirements must stay understandable.
    - inference_substrate, inference_substrate_class: aggregation_from_upstream_artifacts, aggregation. Record planned versus actual class if blocked before compute. principle: Floors follow invoked work.
    - MODEL_SPECS, model_specs, model_invocation_counts: []; record actual loaded-file hashes, calls and tokens. principle: Citing a model is not invoking it.
    - contract_ready_score: 1 only after table/JSON/YAML and unchanged-reader checks pass. principle: Administrative agreement is not scientific benefit.
    - authority_snapshot_paths, method_map_path: Durable immutable files with hashes. principle: Rollover must not invalidate past tests.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7795_v678_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
