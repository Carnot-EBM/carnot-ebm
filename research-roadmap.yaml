    \ into shallow basins with high escape probability. Basin depth is computable\
    \ from hidden-state trajectories via finite-difference energy estimation: for\
    \ each hidden state x_t, depth(t) = energy(x_t) - min_i(energy(x_t + delta_i))\
    \ over k random perturbations. High escape probability = shallow basin = higher\
    \ hallucination risk. This becomes a new Tier 0d candidate (positioned after\
    \ SpilledEnergy Tier 0b, before SinkProbe Tier 1).\n\nEXISTING CODE TO READ FIRST:\n\
