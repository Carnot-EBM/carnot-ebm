  prompt: |
    CONTEXT:
    Work in {project_root} on {date}. V743 ended fourteen scheduling slots. Exp8654 passed 39 core nodes but changed its own sources after measurement, so core readiness stayed zero; the 25-node deadline remainder and actual learning never ran. Exp8656/8659 qualified full-source processing and recovered 55 of 190 responses in 128 exposed groups. Exp8660 qualified installed compatibility; Exp8661 passed packaging noninferiority but failed the complete 10x native/Python gate. Exp8663 repaired SDK reset payloads; Exp8664 remained flagged and disqualified because repeated observation callbacks violated the original observer checks. Preserve those findings and all earlier quarantines. V744 contains exactly fourteen tasks, Exp8667 through Exp8680.

    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; ops/exclusion_manifest.yaml; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; openspec/change-proposals/research-roadmap-vNEXT.md; openspec/change-proposals/research-roadmap-v743-preserved-20261101.md; openspec/change-proposals/v743-methods-protocol.json; research-references.md; python/carnot/reporting/v743_contract_methods.py; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/current_work_receipt.py; python/carnot/verify/cuda_reader_8410.py; results/experiment_8653_v743_contract_methods.json; results/experiment_8666_v743_capstone.json; research-studying.md

    TASK:
    Bind fourteen tasks and freeze independent research and execution operands. Deliver results/experiment_8667_v744_contract_methods.json. Create thin runner scripts/experiments/experiment_8667_v744_contract_methods.py, immutable primitives in results/raw/experiment_8667_v744_contract_methods/ and notes docs/research-notes/v744-contract-methods.md. Same-roadmap outputs are future dependencies.

    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Authenticate input paths and hashes, tools, free memory and writable disk-backed scratch. Check the declared gate fields before expensive work. In gate_check_summary distinguish missing file, missing field, observed zero and changed bytes. Optional hardware absence cannot block independent CPU work.

    2. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess that can take minutes. Use unbuffered output and print completed/pending counts inside long loops. Supervise children with a flushed parent heartbeat at least every 60 seconds; keep every silence gap under 600 seconds. Write any file over about 200 lines in several tool calls of at most 150 lines, with a progress message between calls. Poll with tool calls of at most 60 seconds. Stop measurements by 3600 seconds and reserve at least 900 seconds for validation within the 4800-second hard cap. Never pad duration.

    3. Spec first: confirm relevant REQ-* and SCENARIO-* before implementation, then add focused failing tests. Preserve original assertions, scientific thresholds and historical evidence. Accept --date {date}. Put runners in scripts/experiments/, tests in tests/python/ and scratch in /var/tmp. Do not change research-roadmap.yaml, scripts/research_conductor.py, shared validators, generator weights or external services.

    4. Declare inference_substrate_class=no_model_load, MODEL_SPECS=[] and zero current language-model calls. Declare the actual inference_substrate: aggregation_from_upstream_artifacts for readers, deterministic_verifier for constructed checks, verifier_ensemble_against_cached_candidates for numerical head scoring, or offline_arcade_live_agent_runtime_self_discovery_no_llm for real ARC stepping. Authenticate numerical checkpoints separately; no_model_load does not mean no numerical inference.

    5. Independently parse the visible table, full JSON, canonical_tasks_sha256 and V744 end marker. Require exact fourteen-object equality with the staged YAML, Exp8667 through Exp8680 in order. Test staged V744 beside active V743 and genuine V744 activation. Reject count, order, ID, title, phase, path, prompt, model, substrate, gate and prior-failure mutations. Preserve historical V743 bytes and original readers; never use mutable vNEXT as old authority.

    6. Create openspec/change-proposals/v744-methods-protocol.json before measurements. Inherit objective_updates and objective_audit by value/hash from sealed V743. Freeze the exact original 64-node partition (39 core, 25 deadline, containing all 27 original runner nodes), source inputs, original checkpoint, labels, seeds and count-validator receipt. Register current execution independently of failed Exp8654; emit learning_operands_ready_score from scientific operands only.

    7. Register the relational evidence study before seeing extractor outputs: 120 distinct constructed worlds, 40 each for directed role, negation attachment and temporal order. Four views per world are supported, equivalent wording, contradicted role/order assignment and explicit uncertainty. Freeze integer truth tables, grammar, split-free evaluation, seeds 7448670/7448673, exact claim/source byte spans and independent evaluator. This is a representation diagnostic, with no natural-truth labels or fitting. Authenticate qualified Exp8656/8659 separately for extraction_inputs_ready_score.

    8. Register installed batching: existing 109-coefficient head and 64 original request identities, Python/native arms, batch sizes 1/4/16, 16 panels per session, ten paired repeats (60 cells, 61440 item evaluations). Freeze seed 7448675, 10000 paired-repeat draws, primary native B16/B1 lower95>1.05 and measured p95 item completion<=50ms as a research tolerance. Include launch-through-exit costs; all items are already available at batch submission, so no interactive queueing claim. The same-batch native/Python lower95>=10 is a separate NFR-01 gate. Authenticate Exp8660/8661 for deployment_inputs_ready_score.

    9. Freeze the ARC observation-ownership protocol from actual Exp8664 callback evidence, with source-level diagnosis before edits. Preserve four games, seeds 11/23, 512 actions and 120 seconds per episode, unchanged 120-action redirect horizons and equal on/off policy actions. Registry-precheck and prohibit stored routes, per-game adapters, source inspection and offline solvers. Separately freeze four constructed Qwen questions with ten meaning-preserving prompts each, 40 calls, temperature 0 and <=64 output tokens.

    10. Ingest the dated reference scan before execution: RT4CHART claim binding, CCHD label-preserving invariance, the October 28 uncertainty taxonomy, proper-loss online learning, sparse KAN and operation-specific Ising support. Record adopt/defer decisions in research-studying.md. Reuse the existing CUDA reader once on supplied changed library/environment and real context/copy evidence, without device probes. runtime_repair_ready_score=0 pre-skips only Exp8676; validate canary_inputs_ready_score independently. Emit all branch gates with exact producer paths and failure diagnostics.

    11. Run focused unit tests, actual private CLI paths, Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Run applicable ops/e2e-test-plan.md checks, including private E2E-018/021. Require 100 percent newly owned statement coverage including real child and rejection paths. Collect once; execute bounded disjoint children with -n 0 -o addopts= --no-cov. Retain each raw SQLite, source hash, JUnit, command, exit and duration before combining copies. Instrument consumers for the code they execute; consumer coverage cannot certify a producer. Preserve original node IDs and independently sealed historical authority. A killed child fails qualification. Do not run the whole repository suite or recursive historical controllers.

    12. Cold-replay immutable primitives in a fresh bounded process. Reject missing operands and self-consistently rehashed tampering. Run primary_publication, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Preserve actual severity and stamped quarantines even if a later scan is clean. Validate final bytes before atomic publication. Failed owned checks disqualify. Unchanged external incompleteness is blocked, never partial. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md without rewriting historical outcomes.

    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Bind every claim to this invocation.
    honest_verdict, verdict_class: principle: Use complete_ terminal prefixes. verdict_class is exactly positive | circular_positive | null | blocked | disqualified | partial. Partial is incomplete owned work that another attempt can finish; unchanged external failure is blocked.
    gate_check_summary: principle: Every blocked_* or complete_blocked_* records upstream, check, path/hash, field, operator, expected and observed; missing differs from zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, historical_model_provenance, target_model: principle: Separate current model calls, numerical checkpoint identity and historical generators.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count, sample_size_budget: principle: Retain a metric/status row per intended unit and arm, including missing reasons. Seeds, siblings, views and timing repeats do not multiply independent N.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle-dependent wins use circular_positive. Constructed or exposed data cannot establish independent generalization.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path, adversarial_findings: principle: Failed acceptance gates forbid positive classes; readiness is separate from benefit.
    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes: principle: Record real clocks and immutable inputs.
    cited_upstream_artifacts, field_principles: principle: Name original producers and explain each metric.
    branch_gate_values: principle: All readiness scores are top-level numeric 0/1, with exactly the spelling consumed by downstream gated_on.
    methods_ready_score, current_contract_ready_score, learning_operands_ready_score, extraction_inputs_ready_score, deployment_inputs_ready_score, arc_inputs_ready_score, runtime_repair_ready_score, canary_inputs_ready_score: principle: Separate authentic operands from execution qualification and optional model access.
    methods_protocol_reference, cohort_partition_reference, gate_field_map, inherited_operand_checks, canonical_tasks_sha256, authority_mutation_rows, literature_method_rows: principle: Bind scientific choices before outcomes and preserve exact authority.

    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8667_v744_contract_methods.py --date {date}

    Do NOT push. Do NOT modify scripts/research_conductor.py.
