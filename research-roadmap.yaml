  - id: exp2836-sota-runtime-preflight
    milestone: "2026.05.269"
    deliverable: "results/experiment_2836_sota_runtime_preflight.json"
    title: "SOTA GGUF Runtime Preflight + Cache Manifest"
    agent_type: codex
    model: gpt-5.5
    max_turns: 30
    track: infrastructure
    prior_failures:
      - experiment_id: exp1891-sota-gguf-cache-runtime-preflight
        verdict: "OK (conductor)"
        addressed_by: "This is not a blind rerun: .268 newly proved the current runtime is mismatched (system python3 lacks torch while .venv has CUDA torch) and the mandated SOTA GGUF cache is absent, so .269 rechecks the live cache under the correct interpreter."
        retire_if_same_verdict: true
      - experiment_id: exp1905-sota-gguf-cache-runtime-preflight-v3
        verdict: "OK (conductor)"
        addressed_by: "This attempt adds a structured downstream gate field, sota_runtime_ready, and verifies scripts/experiment_template.py cached_sota_pair() for the current mandatory GGUF set."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Use {project_root} as the repository root and {date} as the run date.
        Milestone .268 failed to measure the corpus tasks because system python3 lacked
        torch and the mandated SOTA GGUFs were not cached. Local inspection showed
        .venv/bin/python has CUDA-capable torch, so this task establishes the exact
        runtime contract that downstream experiments must use.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - CODEX.md
        - scripts/experiment_template.py
        - results/experiment_2828_fover_memory_leakage_isolation.json
        - results/experiment_2834_capstone_v268.json
        - research-hardware-wishlist.md

      TASK:
        Build a fail-fast SOTA runtime/cache manifest. Do not run corpus evaluation.
        Determine whether at least one mandated SOTA GGUF is cached and load-smokeable
        under .venv/bin/python with CUDA torch.

      MODEL_SPECS:
        primary:
          - unsloth/Qwen3.6-35B-A3B-GGUF
          - unsloth/gemma-4-31B-it-GGUF
          - unsloth/gemma-4-26B-A4B-it-GGUF
        legacy_cpu_smoke_only:
          - Qwen3.5-0.8B
          - gemma-4-E4B-it

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. Run .venv/bin/python -c "import torch; print(torch.__version__, torch.cuda.is_available())".
           b. Run python3 -c "import torch; print(torch.__version__, torch.cuda.is_available())" and record failure/success.
           c. Check free disk space and GPU memory using available local commands.
           d. Locate HuggingFace cache, local models/, and any llama.cpp/llama-cpp-python loader available.
        1. Import scripts/experiment_template.py and exercise cached_sota_pair() if import-safe.
        2. Search local cache for each mandated SOTA GGUF. Record exact paths, sizes, SHA256
           for small manifest files, and model family.
        3. If no mandated SOTA GGUF is cached, attempt a controlled metadata-only or resumable
           cache step only if local credentials/tooling are already configured. Do not wedge the
           session on a huge blind download. If download cannot proceed, write blocked_model_cache.
        4. For each available mandated model, run the smallest possible load smoke test that
           exercises the loader without a benchmark. If load would exceed memory, record that
           honestly instead of forcing it.
        5. Set sota_runtime_ready=true only if .venv CUDA torch is available and at least one
           mandated SOTA GGUF is locally usable as a headline model.
        6. Write the artifact before returning. Do not modify scripts/research_conductor.py.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with "complete:" / "success:" or "blocked_"
          principle: "Terminal/blocked prefix discipline."
        - sota_runtime_ready: bool
          principle: "The structured gate for all downstream live-model tasks."
        - selected_python: str
          principle: "Downstream tasks need the exact interpreter path."
        - venv_torch_cuda_available: bool
          principle: "CUDA torch readiness must be measured, not assumed."
        - system_python_torch_cuda_available: bool
          principle: "Documents the .268 mismatch."
        - sota_models_cached: list
          principle: "At least one mandated GGUF must be present for headline use."
        - cached_sota_pair_result: dict
          principle: "Verifies the mandated template pattern."
        - model_specs: dict
          principle: "Records SOTA GGUF mandate and legacy smoke-test limitation."
        - preconditions_checked: list
          principle: "Every expensive downstream task gates on these checks."
        - duration_s: float
          principle: "Real preflight duration; no sleep padding."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

