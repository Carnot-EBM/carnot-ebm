      - {project_root}/python/carnot/constraint_ir_replay.py
      - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
      - {project_root}/ops/e2e-test-plan.md

      TASK:
      On at least 90 sealed calibration questions spanning all three families and preregistered difficulty strata, collect at least eight independent natural reasoning samples per question from the mandated 26B GGUF; measure exact correctness, method validity, parseability, effective K, answer clusters, and all-wrong rate; choose one fixed stratum/decode policy without held access; and write results/experiment_6115_phase_d_calibration_pool.json.

      CONCRETE STEPS:
      0. PRECONDITIONS: recompute the structured gate, hash Exp6103/Exp6114 artifacts and row/split manifests, resolve the exact GGUF and embedded tokenizer, record CUDA/VRAM/thermal/PID leases, seeds, disk/time budget, output paths, protected files, and held-test access guards. Block immediately if the gate is false.
      1. Ensure REQ-* calibration-only, natural-candidate, K/diversity, model-difficulty, method-validity, exact-label, no-held-access, fixed-policy, and raw-provenance requirements exist; add focused failing tests first.
      2. Preregister at least three difficulty strata and a bounded decode grid before inference. Sample at least 30 independent calibration questions per family and at least 90 total; semantic siblings cannot cross calibration folds.
      3. Generate `K >= 8` samples per question with independent recorded seeds, nonzero temperature where declared, `max_new_tokens >= 512`, and raw natural reasoning. Do not use JSON grammar, finite-ID answer tokens, hidden-label retries, deterministic templates, model-authored confidence, or tiny-model headline substitution.
      4. Extract final answers with a frozen surface parser and replay correctness/method-validity through independent Python and Z3 authorities. Parser failure is a measured failure, not a retry trigger.
      5. Report per-candidate accuracy with interval, parseability, method-validity, duplicate rate, effective K, answer-cluster entropy, all-wrong rate, oracle@K, tuned-SC, solver conflict strata, relabel/paraphrase sensitivity, tokens, latency, and energy/VRAM telemetry.
