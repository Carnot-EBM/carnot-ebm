  - id: exp6458-arc-representation-objective-generalization-ab
    milestone: "2026.08.555"
    deliverable: results/experiment_6458_arc_representation_objective_generalization_ab.json
    title: "Bounded ARC representation-objective generalization A/B without solve claim"
    priority: critical
    track: arc-generalization
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 300
