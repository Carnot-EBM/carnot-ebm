        verdict: status_unknown_drafted_during_bash_failure
        addressed_by: "exp1986 (.200) same drafting status. Combined audit now spans .198-.201."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: Outer-loop Bash failed 2026-05-16 ~06:40Z during the .200
      pre-stage. .200 yaml was drafted via Write tool only; activation
      state unknown. .201 is now active with a different scope
      (hallucination/spilled-energy/ROCm). This task consolidates
      4 milestones (.198 + .199 + .200 + .201) into a single audit
      pass + writes the Phase 1 ship-track dashboard at
      ops/phase-1-dashboard.md.

      FALSIFIABLE HYPOTHESIS: A single audit + dashboard task can
      accurately report: (a) which .198 ship-track tasks landed
      (exp1981 MCP docs, exp1982 Reproducer, exp1983 CoT2-Meta routing),
      (b) which .199 hardware/CLaRa tasks landed, (c) the current
      Phase 1 ship-percentage, and (d) any adversarial-verify flags
      across the 4-milestone artifact set.

      EXISTING CODE TO READ FIRST:
        - scripts/adversarial_verify.py (9-rule linter)
        - results/experiment_198[1-5]*.json + experiment_199*.json
          + experiment_20[0-1]*.json (4 milestones)
        - results/experiment_1929_fast_slow_codification.json (already-shipped)
        - results/experiment_1931_huggingface_mirror.json (already-shipped)
        - results/experiment_1930_pypi_status.json + exp1987 if exists
        - ops/conductor-log.md (SKIP/DOOMED_RERUN/GATE_BLOCK pattern check)
        - ops/known-issues.md (Phase 1 MANDATORY entry)

      TASK: Audit + dashboard in one pass.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. scripts/adversarial_verify.py importable.
           b. results/experiment_1929_fast_slow_codification.json exists
              (already-shipped baseline).
           c. results/experiment_1931_huggingface_mirror.json exists
              (already-shipped baseline).
