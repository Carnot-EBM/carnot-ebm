tasks:
  - id: exp6513-v564-terminal-handoff-contract
    milestone: "2026.08.564"
    deliverable: results/experiment_6513_v564_terminal_handoff_contract.json
    title: "V564 terminal evidence handoff and retired-lineage contract"
    priority: critical
    track: infrastructure-governance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 30
    model: opus
    prior_failures:
      - experiment_id: exp6506-v561-evidence-corrigendum-v562-lineage-lock
        verdict: "artifact_not_updated_past_bootstrap"
        addressed_by: "This task is a terminal-state handoff, not another exact-root qualifier; it uses Claude Opus, reads immutable content by path and hash, and writes one bounded governance record with no downstream structured dependency."
        retire_if_same_verdict: true
      - experiment_id: exp6510-v563-independent-exact-root
        verdict: "artifact_not_updated_past_bootstrap"
        addressed_by: "This task does not reactivate Exp6510 or repeat its qualifier scope; it records the retired task, usable file content, missing Exp6511 data, and closed Exp6512 block as an immutable handoff."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone V563 is terminal but not scientifically complete. The conductor retired Exp6510 after three artifact_not_updated_past_bootstrap results, Exp6511 never wrote a dataset, and Exp6512 correctly closed its audit with zero rows. Exp6510 nevertheless contains usable immutable content. V564 needs one honest handoff that preserves both facts without creating a retired dependency. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and {project_root}/research-program.md
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6504_exact_structural_benchmark_commitment.json
      - {project_root}/results/experiment_6506_v561_evidence_corrigendum_v562_lineage_lock.json
      - {project_root}/results/experiment_6510_v563_independent_exact_root.json
      - {project_root}/results/experiment_6512_branch_dataset_independent_audit.json
      - {project_root}/ops/conductor-log.md, {project_root}/ops/exclusion_manifest.yaml, and relevant specs/tests

      TASK
      Write a bounded V564 terminal handoff. Recompute the V563 state from immutable file content and conductor rows. Preserve the retired outcomes, distinguish usable content from eligible task dependencies, and authorize only direct path-and-hash reads. Do not create another root qualifier or scientific performance claim.

      CONCRETE STEPS
      0. Record git status, input paths and hashes, conductor-row identifiers, resources, exclusion state, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for terminal handoff, direct immutable input receipts, retired-ID isolation, closed verdict class, and atomic final write. Write focused tests first.
      2. Recompute Exp6504 and Exp6510 row counts and readiness content from rows. Do not trust their aggregates alone.
      3. Confirm all Exp6506 and Exp6510 bootstrap-update failures, the missing Exp6511 path, and the Exp6512 score-0 block from independent sources.
      4. Emit one row per historical task, file, conductor terminal event, allowed direct input, and forbidden dependency.
      5. Attack renamed dependencies, indirect requires chains, stale paths, hash drift, positive exact-oracle framing, and claims that terminal means scientifically successful.
      6. Set v564_handoff_ready_score=1.0 only if every historical determination is preserved and no planned structured dependency uses a retired ID.
      7. Write only a complete terminal artifact to the required path. Run focused tests, spec coverage, row lint, exclusion lint, adversarial verification, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6513_v564_terminal_handoff_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, prior_failure_receipts, historical_task_rows, immutable_input_receipts, allowed_direct_input_rows, forbidden_dependency_rows, retired_dependency_attack_matrix, v564_handoff_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Set verdict_class=null or partial, never positive. Set inference_substrate=bounded_historical_artifact_and_conductor_replay_no_llm. Set verifier_is_oracle=true only for row, hash, and terminal-state checks. A blocked verdict must populate gate_check_summary with the failed check and observed value.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6513_v564_terminal_handoff_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6514-atomic-shard-artifact-transaction
    milestone: "2026.08.564"
    deliverable: results/experiment_6514_atomic_shard_artifact_transaction.json
    title: "Crash-safe shard journal and atomic artifact finalization"
    priority: critical
    track: infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 75
    model: opus
    prompt: |
      CONTEXT
      Two consecutive milestone roots ended artifact_not_updated_past_bootstrap even though later file content existed. Long data generation needs a reusable transaction that separates resumable shards from the conductor-visible terminal JSON. The conductor itself is protected and must not change. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V564 roadmap document
      - artifact, checkpoint, atomic-write, and result-schema helpers under {project_root}/python/carnot/ and {project_root}/scripts/
      - {project_root}/scripts/experiment_template.py and {project_root}/scripts/adversarial_verify.py
      - Exp6506, Exp6510, and Exp6512 artifacts plus their conductor-log rows
      - relevant capability specs, tests, {project_root}/_bmad/traceability.md, and {project_root}/ops/e2e-test-plan.md

      TASK
      Specify, test, and implement a reusable crash-safe artifact transaction for row-producing experiments. It must support content-addressed shards, a planned-unit journal, verified resume, atomic final replace, and a closed failure artifact. Do not modify scripts/research_conductor.py.

      CONCRETE STEPS
      0. Record filesystem capabilities, output-root permissions, disk, process model, git status, and protected-file hashes.
      1. Add REQ-* and SCENARIO anchors for shard identity, planned and terminal unit accounting, idempotent resume, corrupt-shard quarantine, atomic replace, fsync boundaries, concurrent-writer refusal, and closed failure output. Write tests first.
      2. Implement the smallest reusable helper under python/carnot/. Keep experiment-specific fields outside the helper.
      3. Use content hashes for shards and journal records. Verify a shard before reuse and reject duplicate unit IDs with different content.
      4. Finalize only when every planned unit has a terminal disposition. Write a temporary complete JSON, fsync it and its directory where supported, then atomically replace the final path.
      5. Inject crashes before shard write, after shard write, during journal update, before replace, and after replace. Test resume, corruption, stale lock, concurrent writer, missing unit, duplicate unit, and insufficient disk paths.
      6. Prove that no success path leaves a bootstrap or running artifact at the final path. A failed path must write or preserve a closed terminal failure with diagnostics.
      7. Set atomic_artifact_contract_ready_score=1.0 only when every crash-injection and recovery row passes on the supported local filesystem.
      8. Run focused tests with full new-module coverage, lint, spec coverage, artifact schema checks, applicable E2E checks, and git status. Reconcile specs and ops docs after validation.

      Required deliverable: {project_root}/results/experiment_6514_atomic_shard_artifact_transaction.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, transaction_schema, filesystem_capability_receipt, crash_injection_rows, recovery_rows, shard_integrity_rows, concurrency_attack_rows, terminal_write_receipt, atomic_artifact_contract_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Set verdict_class=null for a complete infrastructure contract, partial for a bounded limitation, blocked for a missing precondition, or disqualified for a false success path. Set inference_substrate=local_filesystem_transaction_and_crash_injection_no_llm. Set verifier_is_oracle=true for transaction invariants only; never use positive.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6514_atomic_shard_artifact_transaction --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6515-v564-source-method-contract
    milestone: "2026.08.564"
    deliverable: results/experiment_6515_v564_source_method_contract.json
    title: "Execution-time literature delta for adaptive validation and exact guidance"
    priority: high
    track: sota-ingestion
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 60
    prior_failures:
      - experiment_id: exp5783-v516-source-delta-ingestion
        verdict: "complete: no accepted post-V516 source deltas; references unchanged and closed scopes preserved"
        addressed_by: "This is a new dated execution-time check for papers published after the V563 planning pass, with Task-CoEvolve and Safety Nets already identified as concrete V564 method inputs rather than a generic freshness rerun."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V564 uses recent work on Task-CoEvolve, Safety Nets, learned conflicts, DiBS, and mapping bottlenecks. The planning sources are dated 2026-08-22. Autonomous execution must check for a focused source delta and freeze the method contract before outcome data is visible. Work at {project_root}. The execution date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and {project_root}/research-program.md
      - {project_root}/research-references.md and {project_root}/research-studying.md
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/scripts/sweep_clusters.py and {project_root}/scripts/sweep_semscholar.py
      - the V563 source/method artifact and the search-layer literature-note template if present
      - relevant exact solver, branch feature, KAN, conflict-memory, and hardware mapping code

      TASK
      Run a focused, low-concurrency source delta and freeze an execution-time V564 method contract. Map the strongest current methods to exact implementation steps, explicit non-transfer boundaries, falsifiable metrics, and failure controls. This is research ingestion, not experimental LLM inference.

      CONCRETE STEPS
      0. Record network availability, query strings, timestamps, tool versions, source paths, git status, and protected-file hashes.
      1. Use the reliable sweep scripts plus sequential arXiv, OpenReview, Semantic Scholar, Hugging Face Papers, Extropic, GitHub, and Kona checks. Do not invoke a high-concurrency deep-research harness.
      2. Verify primary URLs and source dates for Task-CoEvolve 2608.20169, Safety Nets 2608.20053, learned conflicts 2603.12232, DiBS 2606.06518, nested SMC 2608.20123, and ChainForge 2608.15961.
      3. Emit one source row per paper or product with method, claimed evidence, available code or data, Carnot hook, non-transferable claim, exact-authority boundary, and source hash.
      4. Search for newer work through {date}. If a source changes the method, record the delta before reading any V564 outcome artifact.
      5. Freeze feature, control, exact fallback, adaptive-sampling, exception-table, conflict-witness, mapping-cost, and stop-rule contracts for Exp6516-Exp6523.
      6. Update research-studying.md and a dated research note only for verified sources. Do not fabricate citation counts when an API is rate-limited.
      7. Set v564_method_contract_ready_score=1.0 only when every adopted method has a primary source, implementable local mapping, negative control, and non-transfer boundary.
      8. Run source-schema tests, URL and duplicate checks, spec coverage where applicable, adversarial verification, and git status.

      Required deliverable: {project_root}/results/experiment_6515_v564_source_method_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, query_receipts, source_rows, primary_source_hashes, citation_count_boundaries, sota_to_experiment_rows, non_transfer_rows, frozen_method_contract, v564_method_contract_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Set verdict_class=null or partial. Set inference_substrate=low_concurrency_primary_source_ingestion_no_experimental_llm. Set verifier_is_oracle=false. A blocked verdict must name the unavailable source channel and observed error in gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6515_v564_source_method_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6516-exact-branch-pilot-dataset-v3
    milestone: "2026.08.564"
    deliverable: results/experiment_6516_exact_branch_pilot_dataset_v3.json
    title: "Bounded exact branch-counterfactual pilot with transactional shards"
    priority: critical
    track: data-and-evidence
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6507-exact-branch-counterfactual-dataset
        verdict: "blocked_preemptive_skip_upstream_retired"
        addressed_by: "The v3 pilot has no gate or requires edge to Exp6506 or Exp6510; it reads immutable files directly and is gated only on the new transaction and method-contract tasks in this roadmap."
        retire_if_same_verdict: true
      - experiment_id: exp6511-exact-branch-counterfactual-dataset-v2
        verdict: "blocked_preemptive_skip_upstream_retired"
        addressed_by: "This attempt is bounded to a pilot, uses the tested Exp6514 shard transaction, closes every planned unit, and does not depend on the retired Exp6510 task ID."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6514-atomic-shard-artifact-transaction
        artifact_field: atomic_artifact_contract_ready_score
        op: "=="
        value: 1.0
      - upstream: exp6515-v564-source-method-contract
        artifact_field: v564_method_contract_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      The two earlier branch-dataset tasks never executed because they depended on retired roots. V564 instead reads Exp6504 and Exp6510 files directly by path and hash, uses the new atomic transaction, and starts with a bounded pilot. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V564 roadmap document
      - {project_root}/results/experiment_6514_atomic_shard_artifact_transaction.json
      - {project_root}/results/experiment_6515_v564_source_method_contract.json
      - {project_root}/results/experiment_6504_exact_structural_benchmark_commitment.json
      - {project_root}/results/experiment_6510_v563_independent_exact_root.json
      - exact SAT/CSP, branch feature, checkpoint, and transaction code under {project_root}/python/carnot/
      - relevant tests, specs, exclusion manifest, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build a sealed, bounded exact branch-counterfactual pilot. Precommit base lineages, checkpoints, candidate rules, budgets, cell floors, and terminal dispositions. Replay every eligible value under equal exact budgets and finalize through the Exp6514 transaction.

      CONCRETE STEPS
      0. Evaluate both new-roadmap gates. Record expected and observed values, artifact hashes, direct historical input hashes, solver versions, CPU/RAM/disk, output-space bounds, and protected-file hashes.
      1. Add REQ-* and SCENARIO anchors for direct immutable inputs, deterministic checkpoints, candidate completeness, exact replay, split sealing, censoring, bounded shards, resume, and atomic finalization. Write tests first.
      2. Freeze a pilot across at least three procedural constraint families, two difficulty scales, multiple seeds, and sealed train, development, and held base lineages. Keep the planned size small enough to finish in the budget.
      3. Select checkpoints and all eligible values without unit ID, label, held outcome, or future effort. Freeze decision-time structural features before replay outcomes exist.
      4. Run equal-budget exact counterfactuals. Record conflicts, propagations, decisions, restarts, terminal model or proof, timeout, censoring, and exact answer equality.
      5. Write content-addressed shards and a planned-unit journal through the Exp6514 helper. Resume only verified shards. Finalize only after every unit has a terminal disposition.
      6. Attack row order, serialization length, family labels, base labels, outcome-derived effort, duplicate checkpoints, split leakage, asymmetric budgets, corrupt resume, and omitted hard rows.
      7. Set branch_pilot_dataset_ready_score=1.0 only when every admitted row has an exact receipt, every planned unit is terminal, cell floors hold, splits are sealed, and the final transaction verifies.
      8. Run focused tests with full new-module coverage, lint, spec coverage, row lint, gate audit, adversarial verification, exact-solver E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6516_exact_branch_pilot_dataset_v3.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, upstream_gate_receipts, prior_failure_receipts, direct_input_receipts, pilot_commitment, checkpoint_contract, structural_feature_schema, branch_counterfactual_rows, exact_solver_receipts, split_commitment, shard_manifest, planned_and_terminal_unit_counts, censoring_and_budget_rows, leakage_attack_matrix, branch_pilot_dataset_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Set verdict_class=null for complete data readiness, partial for bounded usable data below a claim gate, blocked for failed preconditions, or disqualified for leakage or false terminal accounting. Set inference_substrate=procedural_exact_branch_replay_with_transactional_shards_no_llm. Set verifier_is_oracle=true for labels and validity only; never use positive.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6516_exact_branch_pilot_dataset_v3 --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6517-branch-pilot-independent-audit
    milestone: "2026.08.564"
    deliverable: results/experiment_6517_branch_pilot_independent_audit.json
    title: "Independent integrity review of the transactional branch pilot"
    priority: critical
    track: infrastructure-audit
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6512-branch-dataset-independent-audit
        verdict: "blocked_branch_dataset_independent_audit: upstream_exists=/home/ianblenke/github.com/ianblenke/carnot/results/experiment_6511_exact_branch_counterfactual_dataset_v2.json; independent_row_recomputation=row_count=0; split_and_lineage_audit=base_lineage_overlap_count=0 duplicate_checkpoint_count=0 post_held_repair_count=0 asymmetric_budget_count=0 missing_terminal_disposition_count=0; shard_and_censoring_audit=manifest_complete=False missing_shard_count=0 hash_chain_complete=True resume_receipts_present=True terminal_count_matches=True censored_count_matches=True"
        addressed_by: "This audit targets the new bounded v3 pilot, checks the Exp6514 transaction and direct-input hashes, and still runs unconditionally so missing or invalid data closes the exact field instead of cascading."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6516 is the first branch-data attempt with a new eligible transaction. Its audit must always run and always write branch_pilot_audited_ready_score with the exact spelling below, including missing, blocked, partial, corrupt, and valid upstream paths. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V564 roadmap document
      - {project_root}/results/experiment_6516_exact_branch_pilot_dataset_v3.json if present
      - {project_root}/results/experiment_6514_atomic_shard_artifact_transaction.json
      - {project_root}/results/experiment_6504_exact_structural_benchmark_commitment.json
      - {project_root}/results/experiment_6510_v563_independent_exact_root.json
      - {project_root}/scripts/verdict_row_consistency_lint.py and {project_root}/scripts/adversarial_verify.py
      - relevant exact-solver code, specs, tests, exclusion manifest, and E2E plan

      TASK
      Independently audit the branch pilot from rows and receipts. Close the downstream readiness field even when the source is missing or invalid. Never edit the source artifact, its shards, or historical inputs.

      CONCRETE STEPS
      0. Record source existence, path, hash, status, verdict class, row and shard counts, solver availability, resources, and protected-file hashes. Continue to a terminal block if the source is missing.
      1. Add REQ-* and SCENARIO anchors for missing-upstream closure, independent row replay, shard and journal verification, split and timing checks, and leakage attacks. Write tests first.
      2. Recompute all counts and aggregates from per-unit rows. Verify every exact receipt against the immutable base hash.
      3. Rebuild train, development, and held lineage sets. Reject overlap, outcome-aware repair, duplicate checkpoints, asymmetric budgets, or missing terminal dispositions.
      4. Verify the Exp6514 transaction: planned IDs, terminal IDs, shard hashes, journal chain, resume receipts, final atomic-write receipt, and source checksum.
      5. Attack IDs, row order, serialization length, family and label shortcuts, future effort, censoring removal, corrupt shards, aggregate tampering, and one-cell headroom.
      6. Set branch_pilot_audited_ready_score=1.0 only when every audit passes. Otherwise set 0.0 and name every failed check and observed value in gate_check_summary.
      7. Emit one audit row per source unit plus manifest, split, feature, and attack rows. Write a complete terminal artifact for every path.
      8. Run focused tests, full new-module coverage, lint, spec coverage, row consistency lint, adversarial verification, exact-solver E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6517_branch_pilot_independent_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, upstream_artifact_receipt, prior_failure_receipt, independent_row_recomputation, exact_receipt_replay_rows, split_and_lineage_audit, transaction_and_shard_audit, feature_timing_audit, censoring_audit, shortcut_attack_matrix, branch_pilot_audited_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Set verdict_class=null for valid readiness, blocked for missing or incomplete input, or disqualified for leakage or false receipts. Set inference_substrate=independent_exact_row_shard_and_receipt_replay_no_llm. Set verifier_is_oracle=true for dataset integrity only; never use positive.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6517_branch_pilot_independent_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6518-structural-control-headroom-ab-v2
    milestone: "2026.08.564"
    deliverable: results/experiment_6518_structural_control_headroom_ab_v2.json
    title: "Matched exact structural-control headroom comparison"
    priority: critical
    track: exact-solver-guidance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 140
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6508-analytical-branch-refocus-ab
        verdict: "blocked_gate_check_failed"
        addressed_by: "This v2 comparison is gated on the new independently audited pilot, combines every precommitted structural arm in one matched run, and cannot read the missing Exp6507 dataset."
        retire_if_same_verdict: true
      - experiment_id: exp6509-critical-variable-enumeration-ab
        verdict: "blocked_preemptive_skip_upstream_retired"
        addressed_by: "Critical-variable enumeration is now one control inside an eligible matched comparison rather than a separate task chained to a retired dataset."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6517-branch-pilot-independent-audit
        artifact_field: branch_pilot_audited_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Learned branch routing is not justified until exact structural controls show held headroom on an audited pilot. Earlier analytical and enumeration tasks never ran. V564 combines them with native and negative controls under one charged protocol. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V564 roadmap document
      - {project_root}/results/experiment_6517_branch_pilot_independent_audit.json
      - {project_root}/results/experiment_6516_exact_branch_pilot_dataset_v3.json
      - {project_root}/results/experiment_6508_analytical_branch_refocus_ab.json
      - exact solver branch hooks, feature schema, control methods, tests, specs, and E2E plan
      - DiBS and enumeration method rows from {project_root}/results/experiment_6515_v564_source_method_contract.json

      TASK
      Run a matched exact-solver comparison of structural branch controls. Measure causal live influence, correctness equality, charged effort, long-tail cost, and held transfer before any learned model is trained.

      CONCRETE STEPS
      0. Evaluate the audit gate. Record its exact path, hash, expected and observed values, solver versions, resources, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for matched checkpoints, control arms, candidate preservation, live influence, equal budgets, cost accounting, and held comparison. Write tests first.
      2. Freeze arms: native dynamic, shuffled dynamic, static analytical, partial-assignment consistency, periodic bounded refocus, random critical-variable enumeration, and analytical enumeration.
      3. Use identical pilot units, solver settings, seeds, restart budgets, time limits, and terminal disposition rules for every arm.
      4. Record first changed decision, changed-decision count, candidate preservation, conflicts, propagations, decisions, restarts, wall time, control overhead, timeout, censoring, proof or model, and exact answer equality per row.
      5. Charge feature computation, refocus, enumeration, and fallback. Report solver-only and total cost without hiding either.
      6. Attack inert advice, no-headroom units, row-order coupling, family identity, tuned held thresholds, omitted losses, timeout selection, and one-seed wins.
      7. Emit structural_control_execution_complete_score and structural_headroom_candidate_score from rows. Candidate score 1.0 requires positive held charged benefit in the precommitted primary metric, correctness equality, live influence, and support in more than one family and seed.
