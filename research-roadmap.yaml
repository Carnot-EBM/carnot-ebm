    - {project_root}/openspec/capabilities/continuous-self-learning/spec.md

    TASK:
    Implement and run a bounded typed relation-memory controller over every frozen prospective order.
    Compare no memory, read-only memory, bounded update, and quarantine-update arms. Update only
    between events after exact delayed feedback. Track asymmetric false-accept and false-reject costs,
    lexical versus structural retrieval, capacity, retention, support, poison, restart, rollback, and
    update cost. Do not run an LLM or mutate model weights.

    CONCRETE STEPS:
    0. PRECONDITIONS: require `prospective_relation_stream_ready_score=1`, exact stream hashes, five
