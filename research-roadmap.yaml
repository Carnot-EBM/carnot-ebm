- id: exp667-ensemble-gate-v4
  milestone: 2026.04.51
  deliverable: results/experiment_667_gate_v4_redesign.json
  title: 'Exp 667: EnsembleGate v4 — Structured-First Recall Logic (RETRO-033/070 Gate Redesign)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 655 (EnsembleGate v3) produced gate_open=False with these values:
      symcode_recall=0.12, hermes_v2_recall=0.0, structured_recall=0.20,
      causal_recall=0.36, ensemble_recall=0.224, threshold=0.30, gate_blocker="symcode".
    The gate blocked VR #18 (RETRO-033 attempt #18 never ran) for the second time.

    Root cause: The v3 gate formula weights ALL components equally (including HermesV2 which
    scores 0.0 on mixed-format test sets). The causal_recall=0.36 already EXCEEDS the
    threshold=0.30, but the averaging formula drags the ensemble below it.

    Fix: EnsembleGate v4 uses structured-first logic:
      gate_open = structured_recall >= 0.20 OR max(causal_recall, symcode_recall) >= 0.30
    This would open the gate when causal_recall=0.36 (which it already is).

    EXISTING CODE TO READ FIRST:
    - results/experiment_655_ensemble_gate_v3.json — root cause data.
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier.
    - python/carnot/extraction/causal_reasoning_verifier.py — CausalReasoningVerifier.
    - python/carnot/pipeline/structured_equation_forcer.py — StructuredEquationForcer (Exp 653).
    - python/carnot/pipeline/hermes_v2_live_loop.py — HermesV2LiveLoop (Exp 641).
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Implement EnsembleGate v4 with structured-first logic and validate it opens.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-147 (EnsembleGate v4: gate_open when structured_recall >= 0.20
       OR max(causal_recall, symcode_recall) >= 0.30),
       REQ-VERIFY-148 (EnsembleGate v4: excludes HermesV2 recall from gate formula),
       SCENARIO-VERIFY-193/194/195 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/ensemble_gate_v4.py:
       a. EnsembleGateV4Result dataclass: symcode_recall (float), structured_recall (float),
          causal_recall (float), ensemble_recall (float), gate_threshold (float),
          gate_open (bool), gate_version (str), authorizes_vr (bool), honest_verdict (str).
       b. EnsembleGateV4 class:
          __init__(self, structured_threshold: float = 0.20,
                   max_component_threshold: float = 0.30):
          compute(self, symcode_recall: float, hermes_v2_recall: float,
                  structured_recall: float, causal_recall: float) -> EnsembleGateV4Result:
            'Structured-first gate logic. HermesV2 is advisory only, not in gate formula.'
            gate_open = (
                structured_recall >= self.structured_threshold
                OR max(causal_recall, symcode_recall) >= self.max_component_threshold
            )
            ensemble_recall = (symcode_recall + structured_recall + causal_recall) / 3
            return EnsembleGateV4Result(
                symcode_recall=symcode_recall,
                structured_recall=structured_recall,
                causal_recall=causal_recall,
                ensemble_recall=ensemble_recall,
                gate_threshold=self.structured_threshold,
                gate_open=gate_open,
                gate_version="v4",
                authorizes_vr=gate_open,
                honest_verdict="gate_open_vr_authorized" if gate_open else "gate_closed_vr_blocked",
            )
    4. Create scripts/experiment_667_gate_v4_redesign.py:
       a. ExperimentTemplate(667) + ExperimentTimeoutWatchdog(667, timeout_minutes=20).
       b. Load .50 recall values from results/experiment_655_ensemble_gate_v3.json.
       c. Run EnsembleGateV4().compute() with those values.
       d. Verify: gate_open is True (since causal_recall=0.36 >= 0.30).
       e. Compare: v3_gate_open=False vs v4_gate_open=True — document the delta.
       f. Record retro_070_gate_unblocked: gate_open is True.
       g. honest_verdict: "gate_open_retro_070_unblocked" if gate_open else "gate_still_closed".
       h. artifact includes: v3_ensemble_recall, v4_gate_open, gate_comparison, retro_033_authorized.
    5. Write tests/python/test_ensemble_gate_v4.py with 100% module coverage:
       - test gate opens when structured_recall >= 0.20.
       - test gate opens when causal_recall >= 0.30 even if structured_recall < 0.20.
       - test gate closes when both conditions fail.
       - test gate_open=True on .50 recall values (regression test).
       Each test traces to REQ-VERIFY-147/148.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

