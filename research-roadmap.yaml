    - python/carnot/verify/drift_probe.py — DRIFTProbe (Exp 911)
    - python/carnot/pipeline/three_tier_pipeline.py — Tier 0 integration point
    - openspec/change-proposals/research-roadmap-v71.md — .71 Phase 4 design

