  - id: exp6227-llama-server-signal-sender-diagnostic
    milestone: "2026.08.539"
    deliverable: results/experiment_6227_llama_server_signal_sender_diagnostic.json
    title: "Llama-server signal-sender and unbounded-wait diagnostic"
    priority: critical
    track: infrastructure
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 180
    model: opus
    requires:
      - exp6226-v539-post-marker-source-scope-freeze
    prior_failures:
      - experiment_id: exp6212-three-family-gguf-runtime-recovery
        verdict: "complete_partial: runtime diagnosis ran but not every family has owned CUDA and token receipts"
        addressed_by: "This task targets the long-run external-termination recurrence with process-tree, signal-sender, caller-state, and bounded-wait evidence; it is not another short per-family token canary."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Short native llama-server canaries return tokens, but two long ARC runs lost the server and one caller then hung for hours. OOM, GPU faults, janitors, obvious process-group handling, and name-matching have already been checked. The next step is sender-level tracing plus a bounded recovery contract. Do not assume the sender will be identifiable with current privileges.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md runtime and process rules
      - {project_root}/ops/known-issues.md sections "llama-server reaper recurrence #2" and "LIVE-AGENT WHOLE-PROCESS-CRASH RECOVERY"
      - {project_root}/results/experiment_6212_three_family_gguf_runtime_recovery.json and server logs
      - {project_root}/python/carnot/agentic/arc_executable_world_model.py server lifecycle code
      - {project_root}/scripts/run_exp6199_expanded_roster.py and available expanded-roster logs
      - {project_root}/ops/e2e-test-plan.md and existing GPU/process ownership helpers

      TASK
      Reproduce one bounded server lifecycle under an owned Gemma-4-31B process. Capture process ancestry, caller state, GPU state, signal delivery and sender evidence when available, stderr, exit status, and all timeouts. Localize the sender or emit an honest unlocalized taxonomy. Specify and test a finite wait, retry, and owned-process cleanup contract. Do not add speculative checkpointing or kill an unrelated process.

      MODEL_SPECS:
      - hf_id: unsloth/gemma-4-31B-it-GGUF; role: reaper reproduction and caller-hang diagnostic; preferred_quant: Q4_K_M
      Resolve the exact cached GGUF with the local resolver. Use its embedded template and the native llama.cpp server. No legacy model can substitute.

      Required deliverable: {project_root}/results/experiment_6227_llama_server_signal_sender_diagnostic.json.
      REQUIRED ARTIFACT FIELDS: status, prior_incident_paths_hashes_and_timeline, preconditions_checked, gpu_owner_receipts_before_during_after, model_specs, exact_gguf_and_llama_cpp_receipts, owned_process_tree_snapshots, launch_command_session_and_cgroup_receipts, health_and_token_timeline, signal_trace_tool_availability, signal_events_and_sender_receipts, server_exit_and_stderr_receipts, caller_thread_and_wait_state_receipts, bounded_reproduction_deadline, root_cause_taxonomy, sender_identified_score, unlocalized_reason, finite_wait_retry_cleanup_contract, controlled_owned_child_death_test, unrelated_process_kill_count, gguf_mutation_count, runtime_diagnostic_ready_score, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. unrelated_process_kill_count and gguf_mutation_count must be bare 0. A sender_identified_score of 0 may still yield runtime_diagnostic_ready_score=1 when the unlocalized evidence and finite contract are complete.

      CONCRETE STEPS
      0. PRECONDITIONS: record GPU owners, privileges, tracing-tool availability, exact model file, ports, deadlines, and protected hashes before starting a server.
      1. Add REQ-INFRA-6227 and scenarios before implementation and trace focused tests.
      2. Reconstruct the two incidents from persisted logs. Separate server death, connection failure, retry, and caller hang.
      3. Use auditd/eBPF/bpftrace only when already available and permitted. Never request privilege escalation. Record unavailable tools explicitly.
      4. Run one short owned reproduction with a hard outer deadline. Persist process-tree, health, token, GPU, stderr, and signal receipts incrementally.
      5. Inject one controlled termination into an owned test child. Prove caller wait is bounded and cleanup targets only the recorded PID/start-time identity.
      6. Add tests for PID reuse, unrelated owner refusal, connection refusal, dead-server retry, deadline expiry, and exact error classification.
      7. Run focused runtime checks and applicable e2e tests. Classify all nonzero commands and adversarial-verify the artifact.

      Run command: .venv/bin/python -m carnot.experiment_6227_llama_server_signal_sender_diagnostic --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6228-supervised-three-family-runtime-endurance
    milestone: "2026.08.539"
    deliverable: results/experiment_6228_supervised_three_family_runtime_endurance.json
    title: "Supervised three-family GGUF runtime endurance and recovery"
    priority: critical
    track: infrastructure
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 240
    model: opus
    requires:
      - exp6227-llama-server-signal-sender-diagnostic
    gated_on:
      - upstream: exp6227-llama-server-signal-sender-diagnostic
        artifact_field: runtime_diagnostic_ready_score
        op: '=='
        value: 1
    prior_failures:
      - experiment_id: exp6212-three-family-gguf-runtime-recovery
        verdict: "complete_partial: runtime diagnosis ran but not every family has owned CUDA and token receipts"
        addressed_by: "The new qualification parses actual CUDA placement, holds each service through an endurance window, injects an owned-child failure, and requires bounded supervised recovery instead of a 12-14 second token canary."
        retire_if_same_verdict: true
      - experiment_id: exp6200-three-family-raw-code-transport-canary
        verdict: "complete_partial: Exp6200 coverage=18/18 cells; ready_families=[]"
        addressed_by: "Runtime is qualified independently of code generation with exact model files, native servers, repeated deterministic tokens, and task-linked CUDA/process receipts."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6227 supplies a finite lifecycle contract. Turn it into the smallest reusable runtime supervisor outside the conductor, then qualify all three mandated GGUF families. Readiness requires more than a server that returns one token and exits cleanly.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md GGUF and hardware rules
      - {project_root}/results/experiment_6227_llama_server_signal_sender_diagnostic.json
      - {project_root}/python/carnot/experiment_6212_three_family_gguf_runtime_recovery.py and tests
      - {project_root}/python/carnot/inference/sota_models.py and local server/proposer helpers
      - {project_root}/scripts/experiment_template.py cached_sota_pair() documentation
      - {project_root}/ops/e2e-test-plan.md

      TASK
      Implement a task-owned native llama-server supervisor with explicit ownership, bounded health waits, deterministic retry limits, and safe cleanup. Qualify each mandated model through actual CUDA placement, repeated outputs, an endurance interval, controlled owned-child death, successful recovery, and final leak-free teardown. Do not modify the conductor or GGUF cache.

      MODEL_SPECS:
      - hf_id: unsloth/Qwen3.6-35B-A3B-GGUF; role: flagship MoE endurance; preferred_quant: Q4_K_M
      - hf_id: unsloth/gemma-4-31B-it-GGUF; role: flagship dense ARC endurance; preferred_quant: Q4_K_M
      - hf_id: unsloth/gemma-4-26B-A4B-it-GGUF; role: middle MoE endurance; preferred_quant: Q4_K_M
      Use exact cached files, embedded templates, pinned revisions, and the native CUDA llama.cpp build. Never use AutoTokenizer on a GGUF repository.

      Required deliverable: {project_root}/results/experiment_6228_supervised_three_family_runtime_endurance.json.
      REQUIRED ARTIFACT FIELDS: status, upstream_diagnostic_path_and_hash, preconditions_checked, supervisor_contract_and_paths_hashes, model_specs, exact_gguf_paths_sizes_hashes_revisions_quantizations, embedded_chat_template_receipts, llama_cpp_build_and_cuda_receipts, gpu_owner_intervals_by_family, server_command_pid_starttime_process_group_and_lifetime_by_family, parsed_cuda_layer_or_tensor_placement_by_family, repeated_raw_token_hashes_and_latencies_by_family, endurance_window_and_health_samples_by_family, controlled_owned_child_failure_and_recovery_by_family, retry_and_wait_bounds, final_process_and_vram_leak_check, qwen_runtime_ready_score, gemma_4_31b_runtime_ready_score, gemma_4_26b_runtime_ready_score, two_family_runtime_ready_score, three_family_runtime_ready_score, unrelated_process_kill_count, gguf_mutation_count, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. Every readiness score must be conjunctive and principle-annotated. Unrelated kills and GGUF mutations must be bare 0.

      CONCRETE STEPS
      0. PRECONDITIONS: enumerate GPU owners and free VRAM, verify exact files/builds/ports, reserve bounded windows, and write preconditions_checked before model load.
      1. Add REQ-INFRA-6228 and scenarios before implementation and trace focused tests.
      2. Implement ownership as PID plus start time, command hash, process group, and parent identity. Refuse cleanup when identity changes.
      3. Parse CUDA evidence from the actual server log and GPU intervals. Do not infer offload from flags alone.
      4. For each family, collect repeated deterministic raw tokens across the endurance window, inject one owned failure, and prove bounded recovery.
      5. Test dead port, slow load, early exit, PID reuse, retry exhaustion, unrelated owner, and cleanup leak cases.
      6. Require dense readiness separately, at least two families for two_family_runtime_ready_score, and all three for three_family_runtime_ready_score.
      7. Run focused tests and applicable GPU e2e checks. Adversarial-verify model identity, duration, CUDA, and process receipts.

      Run command: .venv/bin/python -m carnot.experiment_6228_supervised_three_family_runtime_endurance --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6229-arc-gemma31-think-determination
