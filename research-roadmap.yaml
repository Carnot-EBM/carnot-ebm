dated:\n      principle: \"True if main.tex was modified with ensemble v7b results and new citations.\"\n  - citations_added:\n      principle: \"List of arXiv IDs added in this task — audit trail.\"\n  - ensemble_v7b_incorporated:\n      principle: \"True if exp2546 AUROC result appears in the paper.\"\n  - phase4_section_intact:\n      principle: \"True if §4 honest negative from exp2544 was not overwritten.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"paper_updated == true\"\n    principle: \"Paper must incorporate the milestone's key results before the arXiv submission package is assembled.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2553-arxiv-final-package-v3
