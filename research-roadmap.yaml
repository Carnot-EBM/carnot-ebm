    explicitly set. Fix: use nvidia-smi as fallback when torch.cuda returns 0.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_template.py (setup_gpu() method — this is what needs patching)
    - python/carnot/pipeline/verify_repair.py (SC-Energy wiring from Exp 1001 — likely broke a snapshot test)
    - tests/python/ (find most recently modified test files)
    - scripts/conductor_exclusion_manifest.json (current exclusion list)
    - ops/exclusion_manifest.yaml (current YAML exclusion list)
    - results/experiment_1025_milestone_retro_79.json (already written — read honest_verdict)

    CRITICAL: Write the artifact file FIRST before doing anything else:
    import json, os, tempfile, time
    artifact = ("experiment": 1028, "status": "running", "preflight_started": True,
                "pre_test_fixed": False, "gpu_probe_rocm": False,
                "manifest_786_retired": False, "manifest_641_retired": False,
                "manifest_906_retired": False, "gate_schema_v80": False)
    with tempfile.NamedTemporaryFile('w', dir='results/', delete=False, suffix='.tmp') as f:
        json.dump(artifact, f)
