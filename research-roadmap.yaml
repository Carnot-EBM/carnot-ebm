  # -- Phase 77: Make Self-Learning Improve Future Runs --
  - id: exp239-case-memory
    milestone: "2026.04.17"
    deliverable: python/carnot/pipeline/case_memory.py
    title: "Exp 239: Case-based trace memory with richer retrieval keys"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: Exp 222 and Exp 223 showed that Carnot does not need more trace
      volume; it needs better targeting. Raw pattern reuse is too coarse. Build a
      case-based memory keyed by model, benchmark slice, violation family, prompt
      sketch, property names, and repair outcome so retrieval is more specific and
      more useful. Keep the lookup path cheap enough for CPU-side inference-speed
      use. Use {date} as the run date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - openspec/capabilities/verifiable-reasoning/spec.md
      - results/experiment_222_results.json
      - results/experiment_223_results.json
      - python/carnot/pipeline/live_trace_memory.py
      - python/carnot/pipeline/memory.py
      - python/carnot/pipeline/self_learning_replay.py
      - python/carnot/pipeline/code_learning.py

      TASK: Create python/carnot/pipeline/case_memory.py

      CONCRETE STEPS:
      1. Define a reusable case schema that can represent both semantic and code verification traces without collapsing them into one vague pattern bucket.
      2. Implement retrieval keys that are richer than domain-wide pattern names but still deterministic and cheap to compute.
      3. Preserve provenance and confidence so later policy updates can explain why a case was reused.
      4. Keep the module additive to the current memory path rather than breaking existing Exp 222 / Exp 223 artifacts.
      5. Write tests first for case normalization, retrieval ranking, serialization, and backward-compatible integration with the current replay code.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_case_memory.py -q --no-cov -n0
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp240-self-learning-policy
    milestone: "2026.04.17"
    deliverable: python/carnot/pipeline/self_learning_policy.py
    title: "Exp 240: Learned repair-policy compiler from accepted fixes"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: Case retrieval is necessary but not sufficient. Carnot needs a way
      to turn high-precision retrieved cases and accepted repairs into actual policy
      changes: threshold updates, property budgets, repair prompt patches, and
      routing hints. This is the Tier 1 / Tier 2 bridge from memory into behavior.
      Use {date} as the run date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - openspec/capabilities/verifiable-reasoning/spec.md
      - python/carnot/pipeline/case_memory.py
      - python/carnot/pipeline/code_learning.py
      - python/carnot/pipeline/live_trace_memory.py
      - python/carnot/pipeline/tracker.py
      - python/carnot/pipeline/adaptive.py
      - python/carnot/pipeline/verify_repair.py

      TASK: Create python/carnot/pipeline/self_learning_policy.py

      CONCRETE STEPS:
      1. Compile accepted repairs and high-precision cases into deterministic policy updates rather than free-form advice.
      2. Support at least verifier-threshold overrides, property-budget updates, repair-prompt patches, and routing hints.
      3. Keep every compiled update provenance-bearing so replay and future benchmarks can explain what was applied and why.
      4. Integrate the policy output additively with the current tracker and memory paths.
      5. Emit a small machine-readable policy artifact for later replay work.
      6. Write tests first for policy compilation, provenance, deterministic serialization, and additive integration.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_self_learning_policy.py -q --no-cov -n0
      Do NOT push. Do NOT modify scripts/research_conductor.py.

