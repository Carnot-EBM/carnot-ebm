  - id: exp5747-sota-exact-proposal-utility-panel
    milestone: "2026.07.513"
    title: "Gated on Exp5746 readiness: measure SOTA proposal utility against exact controls"
    priority: critical
    track: verification
    deliverable: results/experiment_5747_sota_exact_proposal_utility_panel.json
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 480
    prior_failures:
      - experiment_id: exp5708-sota-exact-constraint-canary
        verdict: "blocked: parse_failures"
        addressed_by: "This consumes the already-qualified parse-free finite-choice channel and measures matched-budget search utility; no model-authored answer envelope is generated or repaired."
        retire_if_same_verdict: true
      - experiment_id: exp5720-sota-attested-exact-envelope-canary
