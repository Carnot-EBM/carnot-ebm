  - id: exp3602-math-to-code-prm-transfer-positive-control
    operator_override: "2026-06-01 outer-loop directive: NEW literature-grounded positive control (arXiv:2506.00027 math->code PRM transfer, +4-8pts) testing whether the .330 code AUROC 0.44 was a wiring bug vs a real limit — forward difference from any prior code task; not a re-run."
    milestone: "2026.06.331"
    title: "math→code PRM-transfer positive control (arXiv:2506.00027) — does the math-trained verifier signal survive the modality jump, as the literature predicts?"
    priority: high
