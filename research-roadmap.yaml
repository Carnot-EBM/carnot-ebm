  - id: exp301-confidence-weighted-constraints
    milestone: "2026.04.22"
    deliverable: python/carnot/pipeline/confidence_verifier.py
    title: "Exp 301: Confidence-weighted constraint violations — only repair high-confidence errors"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 184 showed verify-repair has 0% net improvement on 3B models (6 fixed,
      6 broken — false positives cancel true fixes). The research program identified the fix:
      confidence-weighted constraints. Instead of binary violated/not-violated, weight violations
      by confidence. A "47+28=76" (1+1=3 level error) is high-confidence (definitely wrong).
      "The intermediate result is approximately 150" is low-confidence. Only repair when
      violation_confidence > threshold.

      Additionally, arXiv 2602.03979 (Likelihood-Based Reward Designs) validates using
      log-probability (EBM energy score) as a CONTINUOUS signal for the repair decision —
      more informative than binary correct/incorrect, and correlates with actual error severity.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (integrate into here)
      - python/carnot/pipeline/extract.py — ArithmeticExtractor, how violations are reported
      - python/carnot/verify/terms.py — ConstraintTerm, IsingConstraint energy scores
      - results/experiment_184_results.json — 3B model false positive analysis

      TASK: Implement confidence-weighted constraint verification.
      1. Read CLAUDE.md spec-first workflow
      2. Add REQ-VERIFY-081 (confidence-weighted violations), REQ-VERIFY-082 (repair gate),
         SCENARIO-VERIFY-103–106 to spec
      3. Write tests FIRST (100% coverage required) for:
         - ViolationConfidence: dataclass with constraint_id, energy_delta, confidence_score,
           repair_recommended, confidence_class (HIGH/MEDIUM/LOW)
         - compute_violation_confidence(violation, baseline_energy): higher energy delta = more confident
         - confidence_from_energy(energy_score): sigmoid(energy_score / scale) → [0, 1] confidence
         - repair_gate(confidence, threshold=0.8): only True when confidence ≥ threshold
         - confidence class assignment: HIGH ≥ 0.8, MEDIUM 0.5-0.8, LOW < 0.5
         - ConfidenceVerifier.verify_with_confidence(response, extractor): returns list of
           ViolationConfidence instead of binary violated list
         - repair_recommended count must be ≤ violations_detected count
         - high-confidence detection: |operand_sum - claimed_result| > 2 * scale → HIGH
         - integration: VerifyRepairPipeline.verify_and_repair_confident(threshold=0.8) method
      4. Implement python/carnot/pipeline/confidence_verifier.py:
         - ViolationConfidence(constraint_id, energy_delta, confidence_score, confidence_class,
           repair_recommended, evidence)
         - confidence_from_energy(energy_score, temperature=1.0): sigmoid normalization
         - ViolationConfidence.HIGH/MEDIUM/LOW thresholds (0.8/0.5/0.0)
         - ConfidenceVerifier class with verify_with_confidence(response, extractor) method
         - add VerifyRepairPipeline.verify_and_repair_confident(response, threshold=0.8):
           only passes violations with HIGH confidence to the repair loop
      5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      6. Reconcile: update ops/changelog.md and ops/status.md
      7. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp302-self-learning-benchmark-constraint-addition
    milestone: "2026.04.22"
    deliverable: results/experiment_302_results.json
    title: "Exp 302: Self-learning integrated benchmark — constraint addition + confidence weighting"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: This is the first integrated live benchmark of Tier 1+2 self-learning with:
      1. Confidence-weighted verification (Exp 301): only repair HIGH-confidence violations
      2. Memory-to-constraint generation (Exp 300): after N questions, add new constraint types
      Design: run 100 GSM8K questions in 2 batches of 50.
        Batch 1 (warmup): accumulate CaseMemory from 50 questions (no constraint addition)
        After batch 1: run ConstraintGenerator to add new constraint types from memory patterns
        Batch 2 (learning): run next 50 questions with enriched constraint set
      Compare batch 2 accuracy to batch 1 baseline to measure learning signal.
      Primary metric: did constraint addition produce any improvement (even +1pp)?

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/constraint_generator.py — Exp 300 implementation
