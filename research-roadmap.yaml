  deliverable: results/experiment_676_metajuls_adaptive.json
  title: 'Exp 676: MetaJuLS Adaptive Constraint Propagation — Online Policy Update for StructuredEquationForcer (arXiv 2601.00095)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2601.00095 (MetaJuLS) presents meta-RL constraint propagation policies
    that adapt across tasks and input distributions without full retraining. 1.5-2.0x speedup
    over task-specific baselines, enabling online adaptation at inference time.

    Applied to Carnot: StructuredEquationForcer (Exp 653) forces COMPUTE: format, but
    the system prompt addendum is STATIC. MetaJuLS-style meta-RL would update the forcing
    prompt based on feedback from each live session — "this model needs more explicit
    forcing for percentage problems" → adapt the FORCER_SYSTEM_ADDENDUM.

    This is Tier 2 continuous self-learning (research-program.md): Constraint Memory with
    online policy adaptation from live inference feedback.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/structured_equation_forcer.py — StructuredEquationForcer.
    - python/carnot/pipeline/jitrl_constraint_memory.py — JitRLConstraintMemory (Exp 432).
