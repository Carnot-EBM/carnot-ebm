- id: exp500-gemma4-int4-quantization
  milestone: 2026.04.38
  deliverable: results/experiment_500_gemma4_int4_quantized.json
  title: 'Exp 500: Gemma4 INT4 Quantization — RETRO-048 root cause fix (quantize to GGUF Q4_K_M ~8-10 GiB)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-048 is\
    \ the master blocker for five consecutive milestones. The conductor process holds\
    \ ~15.7 GiB of GPU 0 VRAM, leaving only ~8.9 GiB free. Gemma4-E4B-it at FP16\
    \ requires 14.89 GiB — it cannot load alongside the conductor. GPUVRAMGateV2\
    \ (Exp 487) correctly kills zombie processes but cannot kill the conductor itself.\
    \ The fix: quantize Gemma4 to INT4/GGUF Q4_K_M format targeting 8-10 GiB VRAM,\
    \ so that conductor (~9 GiB) + Gemma4-INT4 (~9 GiB) = ~18 GiB, fitting within\
    \ 24 GiB GPU 0 with ~6 GiB headroom. This is the unblocking prerequisite for\
    \ Exps 502/503/504 (credibility benchmarks deferred 5 milestones).\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/gemma_loader.py — GemmaTransformersLoader (Exp 450, HF\
    \ transformers loader that fixed RETRO-028)\n- python/carnot/pipeline/gpu_vram_gate_v2.py\
    \ — GPUVRAMGateV2 (Exp 487)\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/deliverable_guard.py — DeliverableGuard (Exp 462)\n- scripts/experiment_template.py\
    \ — ExperimentTemplate, setup_gpu()\n- ops/known-issues.md — RETRO-048\n\nTASK:\
    \ Implement Gemma4QuantizedLoader and verify INT4 model fits in VRAM budget.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3.\
    \ Add REQ-LOADER-003 (Gemma4QuantizedLoader loads GGUF Q4_K_M checkpoint via\
    \ llama-cpp-python with n_gpu_layers=-1 for full GPU offload), REQ-LOADER-004\
    \ (Gemma4QuantizedLoader validates VRAM usage after load is <= 10 GiB via pynvml),\
    \ REQ-LOADER-005 (Gemma4QuantizedLoader.accuracy_check() runs 10 GSM8K questions\
    \ and returns baseline_accuracy >= 0.60 to verify quantization quality),\
    \ SCENARIO-LOADER-003/004/005 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - Gemma4QuantizedLoader(model_path: str,\
    \ n_gpu_layers: int = -1, max_tokens: int = 512):\n     - load() -> bool: loads\
    \ GGUF via llama-cpp-python, returns True on success\n     - generate(prompt: str)\
    \ -> str: generate text from prompt\n     - vram_usage_gb() -> float: returns\
    \ VRAM used by this model via pynvml\n     - is_within_budget(max_gb: float =\
    \ 10.0) -> bool: vram_usage_gb() <= max_gb\n     - accuracy_check(n_questions:\
    \ int = 10) -> float: run GSM8K sample, return fraction correct\n   - Test: mock\
    \ llama-cpp-python when not installed (CI path)\n   - Test: is_within_budget(10.0)\
    \ returns True when vram=9.5, False when vram=10.5\n   - Test: accuracy_check\
    \ returns float in [0, 1]\n5. Implement python/carnot/pipeline/gemma4_quantized_loader.py\
    \ with Gemma4QuantizedLoader.\n   The CI stub path: if llama_cpp not installed,\
    \ return load()=True (mocked), vram_usage_gb()=9.0 (mocked),\
    \ accuracy_check()=0.70 (mocked), is_within_budget()=True — enables test suite\
    \ to pass without GPU.\n   Verbose docstring: WHY quantize to Q4_K_M (conductor\
    \ holds ~9 GiB GPU 0 VRAM; Gemma4 FP16 requires 14.89 GiB — sum exceeds 24 GiB;\
    \ Q4_K_M reduces Gemma4 to ~8-10 GiB; conductor + quantized model fits with\
    \ ~5 GiB headroom; this single change unblocks 5 consecutive missed milestones).\n\
    Export Gemma4QuantizedLoader from carnot.pipeline.__init__.\n6. Write scripts/experiment_500_gemma4_int4_quantized.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(500, timeout_minutes=30)\
    \ as context manager\n   c. ExperimentTemplate(500, 'Gemma4 INT4 Quantization',\n\
    \      'results/experiment_500_gemma4_int4_quantized.json', requires_gpu=True)\n\
    \   d. DeliverableGuard('results/experiment_500_gemma4_int4_quantized.json')\n\
    \   e. GPUVRAMGateV2(min_free_gb=2.0, kill_first=True).__enter__() — low threshold\
    \ since model may not be loaded yet\n   f. Attempt Gemma4QuantizedLoader load:\n\
    \      If GPU available: attempt load of GGUF (check CARNOT_GEMMA4_GGUF_PATH\
    \ env var; if not set, emit setup_instructions)\n      If model loads: check\
    \ is_within_budget(10.0) and accuracy_check(10)\n      If GPU not available:\
    \ emit status='gpu_required', honest_verdict='deferred_retro_048'\n   g. Build\
    \ artifact: schema='carnot.gemma4_quantization.v1'\n      gguf_path_set=bool(os.getenv('CARNOT_GEMMA4_GGUF_PATH'))\n\
    \      model_loaded=<bool>\n      vram_usage_gb=<float or null>\n      is_within_budget=<bool or null>\n\
    \      accuracy_check_result=<float or null>\n      retro_048_unblocked=(is_within_budget\
    \ and accuracy_check_result >= 0.60)\n      honest_verdict='retro_048_unblocked'\
    \ if retro_048_unblocked\n        else 'gguf_path_not_set' if not gguf_path_set\n\
    \        else 'vram_over_budget' if loaded and not is_within_budget\n        else\
    \ 'accuracy_degraded' if loaded and accuracy < 0.60\n        else 'deferred_retro_048'\n\
    \      setup_instructions: str (how to quantize Gemma4 with unsloth/llama.cpp if\
    \ gguf not present)\n   h. Call tmpl.assert_deliverable_written() as FINAL LINE\n\
    \   i. Output: results/experiment_500_gemma4_int4_quantized.json\n7. Write tests/python/test_gemma4_quantized_loader.py\
    \ (100% coverage on gemma4_quantized_loader.py).\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n9. Reconcile: update ops/conductor-log.md (RETRO-048 status),\
    \ ops/status.md, ops/changelog.md, _bmad/traceability.md.\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp501-conductor-cpu-routing
  milestone: 2026.04.38
  deliverable: results/experiment_501_conductor_cpu_routing.json
  title: 'Exp 501: Conductor CPU Routing + VRAM Budget Ledger — free all GPU VRAM for inference'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Even after Gemma4\
    \ INT4 quantization (Exp 500), the conductor process holds ~9 GiB GPU 0 VRAM\
    \ from its JAX-compiled computation graph. If the conductor routes to CPU-only\
    \ (JAX_PLATFORMS=cpu), all 24 GiB GPU 0 become available for inference. The\
    \ complementary improvement: a VRAMBudgetLedger that enumerates each planned\
    \ experiment's VRAM requirement and pre-checks feasibility before launch. This\
    \ converts the reactive 'deferred_to_gpu' pattern into proactive scheduling —\
    \ the conductor knows before a run starts whether it will fit. From the retro\
    \ .37 improvement suggestions: 'Add milestone-level VRAM budget ledger to\
    \ conductor planning: at the start of each milestone, enumerate planned experiments,\
    \ look up each experiment's peak VRAM requirement from prior run data, and compute\
    \ a VRAM availability forecast.'\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/gpu_vram_gate_v2.py\
    \ — GPUVRAMGateV2, VRAMStatus (Exp 487)\n- python/carnot/pipeline/env_autofix.py\
    \ — apply_env_autofix()\n- python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\
    \ (Exp 462)\n- scripts/experiment_template.py — ExperimentTemplate\n- ops/known-issues.md\
    \ — RETRO-048\n\nTASK: Implement VRAMBudgetLedger and document CPU routing pattern.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3.\
    \ Add REQ-INFRA-053 (VRAMBudgetLedger reads a YAML manifest of experiment VRAM\
    \ requirements and produces a feasibility forecast for a planned experiment sequence),\
    \ REQ-INFRA-054 (VRAMBudgetLedger.check_feasibility() returns a VRAMForecast\
    \ with is_feasible, required_gb, available_gb, and blocking_experiment when\
    \ is_feasible=False), REQ-INFRA-055 (VRAMBudgetLedger supports CPU-routing mode\
    \ where conductor_vram_gb=0.0 to model a fully CPU-routed conductor),\
    \ SCENARIO-INFRA-062/063/064 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - VRAMForecast(is_feasible: bool,\
    \ required_gb: float, available_gb: float,\n     blocking_experiment: str | None):\n\
    \     - headroom_gb: float (available_gb - required_gb)\n     - to_dict(): dict\n\
    \   - VRAMBudgetLedger(conductor_vram_gb: float = 9.0,\n     gpu_total_gb: float = 24.0):\n\
    \     - add_experiment(exp_id: str, required_gb: float): register requirement\n\
    \     - check_feasibility(exp_id: str) -> VRAMForecast: check if exp fits\n   \
    \    - check_all() -> list[VRAMForecast]: check all registered experiments\n  \
    \   - to_yaml() -> str: serialize to YAML for conductor manifest\n   - Test:\
    \ feasible when conductor=9 + model=9 < total=24\n   - Test: not feasible when\
    \ conductor=9 + model=16 > total=24\n   - Test: cpu_routing mode (conductor=0.0)\
    \ always more feasible\n   - Test: blocking_experiment is None when feasible\n\
    5. Implement python/carnot/pipeline/vram_budget_ledger.py with VRAMForecast +\
    \ VRAMBudgetLedger.\n   Verbose docstring: WHY VRAMBudgetLedger (conductor process\
    \ holds ~9 GiB GPU 0 VRAM in JAX mode; even with GPUVRAMGateV2, the gate cannot\
    \ account for the conductor's own footprint; the ledger makes this explicit at\
    \ planning time so the conductor knows before launching whether the model will\
    \ fit — converts silent OOM to fast-fail with actionable root cause).\n   Export\
    \ VRAMBudgetLedger, VRAMForecast from carnot.pipeline.__init__.\n6. Write scripts/experiment_501_conductor_cpu_routing.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(501, timeout_minutes=15)\
    \ as context manager\n   c. ExperimentTemplate(501, 'Conductor CPU Routing',\n\
    \      'results/experiment_501_conductor_cpu_routing.json')\n   d. DeliverableGuard('results/experiment_501_conductor_cpu_routing.json')\n\
    \   e. Instantiate VRAMBudgetLedger(conductor_vram_gb=9.0, gpu_total_gb=24.0)\n\
    \   f. Register all .38 milestone experiments with their VRAM requirements:\n \
    \     exp502: 18.0 (Gemma4-INT4 + Qwen), exp503: 18.0, exp504: 18.0,\n      exp507:\
    \ 9.0, exp510: 9.0, exp511: 2.0 (NPU)\n   g. check_all() — report feasibility\
    \ for each\n   h. Build artifact: schema='carnot.vram_budget_ledger.v1'\n     \
    \ conductor_vram_gb=9.0\n      gpu_total_gb=24.0\n      experiments_registered=<int>\n\
    \      feasibility_results=<list of VRAMForecast dicts>\n      all_feasible=<bool>\n\
    \      blocking_experiments=<list of exp_ids where not feasible>\n      cpu_routing_recommendation=True\
    \ if not all_feasible else False\n      honest_verdict='all_feasible' if all_feasible\n\
    \        else 'partial_feasible' if some feasible\n        else 'all_blocked'\n\
    \   i. Call tmpl.assert_deliverable_written() as FINAL LINE\n   j. Output: results/experiment_501_conductor_cpu_routing.json\n\
    7. Write tests/python/test_vram_budget_ledger.py (100% coverage on vram_budget_ledger.py).\n\
    8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n9. Reconcile: update\
    \ ops/conductor-log.md, ops/status.md, ops/changelog.md, _bmad/traceability.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"

- id: exp502-live-100q-precision-v6
  milestone: 2026.04.38
  deliverable: results/experiment_502_live_100q_precision_v6.json
  title: 'Exp 502: Live 100q Precision v6 — RETRO-033 sixth attempt with quantized Gemma4'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-033 has\
    \ been open for FIVE consecutive milestones. Exp 488 got gpu_vram_insufficient\
    \ because the conductor process itself holds ~15.7 GiB GPU 0 VRAM, leaving\
    \ insufficient headroom for Gemma4 even after GPUVRAMGateV2 killed all zombies.\
    \ Exp 500 (Gemma4 INT4 quantization) reduces Gemma4 to ~8-10 GiB so it fits\
    \ alongside the conductor. Exp 501 (VRAMBudgetLedger) confirms the budget before\
    \ launch. This experiment runs the 100q live precision benchmark with the\
    \ quantized model. Success criterion: is_positive=True (any model shows positive\
    \ signed_improvement on 100 questions). Write 100 CoT pairs per model to\
    \ results/exp502_cot_pairs.json for JEPA retraining (Exp 510).\n\nDepends on:\
    \ Exp 500 (Gemma4QuantizedLoader), Exp 501 (VRAMBudgetLedger). Hardware: 2x\
    \ RTX 3090 (CARNOT_FORCE_LIVE=1). Expected duration: 120 min.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/gemma4_quantized_loader.py — Gemma4QuantizedLoader (Exp 500)\n\
    - python/carnot/pipeline/gpu_vram_gate_v2.py — GPUVRAMGateV2 (Exp 487)\n- python/carnot/pipeline/vram_budget_ledger.py\
    \ — VRAMBudgetLedger (Exp 501)\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/deliverable_guard.py — DeliverableGuard (Exp 462)\n- python/carnot/pipeline/dual_gpu_harness.py\
    \ — DualGPUHarness (Exp 480)\n- python/carnot/extraction/vericot_validator.py\
    \ — VeriCoTStepValidator (Exp 453)\n- python/carnot/extraction/vprm_verifier.py\
    \ — VPRMArithmeticVerifier (Exp 454)\n- python/carnot/pipeline/long_run_executor.py\
    \ — LongRunBenchmarkExecutor (Exp 437)\n- scripts/experiment_488_live_100q_precision_v5.py\
    \ — prior harness (deferred_retro_033)\n- ops/known-issues.md — RETRO-033\n\n\
    TASK: Run 100q live precision benchmark with Gemma4QuantizedLoader.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3. Add REQ-BENCH-040\
    \ (100q v6 uses Gemma4QuantizedLoader and GPUVRAMGateV2 before model load),\
    \ REQ-BENCH-041 (100q v6 assigns Gemma4-INT4 to cuda:0 and Qwen3.5-0.8B to\
    \ cuda:1 explicitly via DualGPUHarness), REQ-BENCH-042 (100q v6 writes CoT\
    \ pairs to results/exp502_cot_pairs.json with at least 50 pairs per model for\
    \ JEPA retraining), SCENARIO-BENCH-059/060/061 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - Precision100qV6Result(model_id: str,\
    \ pre_accuracy: float, post_accuracy: float,\n     n: int, extractor_used: str,\
    \ inference_mode: str, gpu_id: int):\n     - signed_improvement: float\n     -\
    \ ci_95_wilson: tuple[float, float]\n     - is_positive: bool\n     - to_dict():\
    \ dict\n   - Test: ci_95_wilson(n=100, p=0.05) interval width < 0.10\n   - Test:\
    \ is_positive=True when signed_improvement=0.05, n=100\n5. Write scripts/experiment_502_live_100q_precision_v6.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(502, timeout_minutes=120)\
    \ as context manager\n   c. ExperimentTemplate(502, 'Live 100q Precision v6',\n\
    \      'results/experiment_502_live_100q_precision_v6.json', requires_gpu=True)\n\
    \   d. DeliverableGuard('results/experiment_502_live_100q_precision_v6.json')\n\
    \   e. VRAMBudgetLedger: check exp502 feasibility before gate\n   f. GPUVRAMGateV2(min_free_gb=6.0,\
    \ kill_first=True).__enter__()\n   g. If GPU unavailable after gate: emit status='gpu_vram_insufficient',\n\
    \      honest_verdict='deferred_retro_033_v6', assert_deliverable_written(), return\n\
    \   h. DualGPUHarness(n_gpus=2, live_mode=True).apply(\n      [{'name': 'gemma4-int4',\
    \ 'loader': Gemma4QuantizedLoader},\n       {'name': 'Qwen/Qwen3.5-0.8B', 'device':\
    \ 'cuda:1'}])\n   i. IntegratedExtractor(VeriCoTStepValidator(use_mock=False),\
    \ VPRMArithmeticVerifier())\n   j. Load 100 GSM8K questions (seed=42)\n   k.\
    \ CoTPairCollector('results/exp502_cot_pairs.json') for JEPA retraining\n   l.\
    \ LongRunBenchmarkExecutor(batch_size=8) for each model: baseline + pipeline\n\
    \      variant; collect CoT pairs per question\n   m. collector.flush() — write\
    \ CoT pairs for Exp 510\n   n. Precision100qV6Result for each model\n   o. Build\
    \ artifact: schema='carnot.live_precision.v6'\n      gemma4_result=<Precision100qV6Result dict>\n\
    \      qwen_result=<Precision100qV6Result dict>\n      cot_pairs_written=<int>\n\
    \      gemma4_quantized=True\n      dual_gpu_explicit=True\n      retro_033_closed=any(r.is_positive)\n\
    \      honest_verdict='retro_033_closed_positive' if retro_033_closed\n        else\
    \ 'retro_033_closed_negative'\n   p. Call tmpl.assert_deliverable_written() as\
    \ FINAL LINE\n   q. Output: results/experiment_502_live_100q_precision_v6.json\n\
    6. Write tests/python/test_precision_100q_v6.py (100% coverage on Precision100qV6Result).\n\
    7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n8. Reconcile: update\
    \ ops/conductor-log.md (RETRO-033 status), ops/status.md, ops/changelog.md,\
    \ _bmad/traceability.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp503-live-200q-vericot-vprm-v4
  milestone: 2026.04.38
  deliverable: results/experiment_503_live_200q_vericot_vprm_v4.json
  title: 'Exp 503: Live 200q VeriCoT+VPRM v4 — RETRO-038 fourth attempt, statistically significant target'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-038 is\
