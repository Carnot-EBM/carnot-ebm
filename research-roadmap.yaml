  - id: exp1982-continuous-latent-ebm-stub
    milestone: "2026.05.155"
    title: "Exp 1982: Continuous Latent EBM Prototype"
    deliverable: "results/experiment_1982_continuous_latent_ebm_stub.json"
    agent_type: "codex"
    prompt: |
      CONTEXT: Today is {date}. Workspace is {project_root}. Fast Autoregressive Models (FAR) (arXiv:2504.18391) demonstrate efficient continuous latent generation. Carnot's continuous reasoning goals require fast sampling in latent space.
      EXISTING CODE TO READ FIRST: python/carnot/inference/samplers.py
      TASK: Design a continuous-latent constraint sampler prototype inspired by FAR.
      CONCRETE STEPS:
      1. Design the latent interface that accepts continuous vector representations instead of discrete tokens.
      2. Implement a stub energy minimization layer compatible with the new continuous states.
      3. Evaluate latent convergence times compared to prior discrete Gibbs baselines.
      4. Write the results artifact.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

