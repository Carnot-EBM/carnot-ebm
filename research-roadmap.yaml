    \      Confirm carry_check template is pre-loaded. Measure FP rate.\n\
    \   g. Session 3 (50 questions): load Session 2 memory. Measure further improvement or plateau.\n\
    \   h. Build artifact: schema='carnot.cross_session_relay.v1'\n\
    \      session_results: [{session_id, fp_rate, n_templates_active, n_loaded}]\n\
    \      honest_verdict: compute_relay_verdict(sessions)\n\
