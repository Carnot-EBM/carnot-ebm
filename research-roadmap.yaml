milestone: 2026.06.398
milestone_title: "PROVE EFFICIENCY-PARITY (the §5 win condition) + ESTABLISH THE IN-GENERATION MOAT WITH DIFFERENTIATED CONTROLS + BROADEN THE SELECTION MOAT TO CROSS-DOMAIN. .397 CLOSED the cross-GENERATOR axis (exp4291 +0.50, CI95 [0.29,0.71], vote@1=0.25, oracle@K=0.75, non-degenerate, oracle-distinct -- the LAST open axis of the selection moat) and BUILT a leak-free partial-state diffusion scorer (exp4292 AUROC 0.966), but the in-generation guided run had DEGENERATE controls (exp4293 rfg=unguided=entrgi=0.3 no-op tautology, quarantined) and the efficiency-harden FAILED to run (exp4294 doomed-looped on the 2h cap, no artifact). The capstone (exp4301) + hygiene (exp4299) BLOCKED spuriously (one missing artifact hard-blocked the whole aggregation -- a robustness bug). .398 attacks the two unresolved §5 axes (efficiency-parity = the operator's stated win condition; does-the-verifier-IMPROVE-generation) and broadens the proven selection moat to cross-DOMAIN, plus fixes the two harness bugs mechanically. Oracle-distinct frontier (P0 2026-06-14): every verifier task verifier_is_oracle=false + a matched control, CI95-excl-0."
milestone_doc: openspec/change-proposals/research-roadmap-v398.md
milestone_overview: |
  .397 proved the SELECTION moat on BOTH axes (within-pool cross-family .395 +0.40 AND cross-generator
  .397 +0.50, both oracle-distinct, both CI95-excl-0). It left the two HARDEST §5 questions unresolved by
  HARNESS bugs, not by the science: (A) efficiency-parity -- the operator's stated win condition -- never
  hardened because exp4294 doomed-looped on the 2h cap (a failed task, NOT a measured null); (B) does the
  verifier IMPROVE generation -- the partial-state scorer is BUILT leak-free (exp4292) but the guided run's
  three controls (rfg/unguided/entrgi) were bit-identical no-ops, so "Carnot beats RFG" was "Carnot beats a
  no-op" (quarantined). And the selection moat is proven only WITHIN ARC; cross-DOMAIN is unproven (the
  verifier is math-domain-bound). .398 is DEPTH on exactly those (north-star §1 Depth-Over-Breadth), in
  order of load-bearing-ness:

    PHASE 0 -- TRANSITION: exp4302 archive .397 -> activate .398; record the TRUE scorecard truthfully
      (cross-generator CLOSED; in-generation degenerate-controls; efficiency task-failed-not-null).

    PHASE A -- PROVE EFFICIENCY-PARITY (THE HEADLINE; §5 win condition; re-scope the failed C1):
      A1 (exp4303) energy-verifier vs LLM-judge on cross-family ARC selection with a STRONGER judge prompt
        (few-shot + grid-reasoning + CoT, 2509.13332) + a 2nd judge model (gemma-4-31B), reported as an
        iso-FLOPs accuracy curve (2510.14913), RE-SCOPED to fit the window (synchronous resume-accumulate,
        checkpoint after EVERY judge call, per-task progress prints, a PARTIAL one-judge-n>=30 accepted).
        Emit efficiency_pareto_holds := (energy accuracy within/above the best-prompted judge CI AND
        cost_ratio <= 0.1). verifier_is_oracle=false.

    PHASE B -- ESTABLISH THE IN-GENERATION MOAT WITH DIFFERENTIATED CONTROLS (deepest §5; fix exp4293):
      B1 (exp4304) DiffusionGemma energy-guided run reusing the exp4292 partial-state scorer, with (1) an
        INDEPENDENT leak re-check on the scorer (AUROC 0.966 yellow flag), (2) >=1 GENUINELY-ENGAGED
        non-Carnot control -- RFG enhanced!=reference at gamma>0 (2509.25604) OR EntRGi single-model
        entropy-gated (2602.05000) -- + a mechanical no-op guard that REJECTS the run if any two arms tie
        bit-identically (the exp4293 signature), (3) the moat test. Emit diffusiongemma_guidance_moat :=
        (Carnot - best-engaged-control > 0 AND CI95-excl-0 AND controls_differentiated). verifier_is_oracle=false.

    PHASE C -- BROADEN THE SELECTION MOAT TO CROSS-DOMAIN (new axis; EEVEE; the .397 SOTA-ingestion flag):
      C1 (exp4305) a domain router + per-domain set-encoder over >=3 domains (ARC families + ARC-GEN
        generators + FoVer-step/math selection), trained on train-DOMAINS, tested beats-vote on a HELD-OUT
        DOMAIN frozen (EEVEE 2606.11182; DG-PRM multi-dimensional discriminators 2507.17849), with a
        LABEL-ABLATION arm (router sees only features vs sees the domain label) proving it is not reading
        domain identity. Emit cross_domain_selection_holds := (held-out-domain delta>0 AND CI95-excl-0 AND
        non-degenerate guards). verifier_is_oracle=false.

    PHASE D -- CONTINUOUS SELF-LEARNING (mandated; powered CI + cross-domain regime):
      D1 (exp4306) harden online_adaptation_helps with a POWERED bootstrap CI95 on (best-adaptive - static)
        in the cross-domain regime, Tier-1 online reweighting + Tier-2 retrieval (Decocted 2604.04373 /
        Dynamic Cheatsheet 2504.07952: retrieval-only curated context, NO weight mutation, NO LoRA). Emit
        online_adaptation_helps := (best-adaptive - static > 0 AND CI95-excl-0). verifier_is_oracle=false.

    PHASE E -- ARC NORTH STAR (mandated monotonic +1):
      E1 (exp4307) offline ARC +1 on a NEW game (total_levels >= 23; NOT r11l/ls20/wa30/sc25).

    PHASE F -- INFRA + HYGIENE + CAPSTONE:
      F0 (exp4308) INFRA safety net (fixes BOTH .397 harness bugs): a DEGENERATE_CONTROLS check in
        adversarial_verify.py (flag >=2 control arms bit-identical) + a reusable aggregate-available-
        report-gaps capstone helper (fixes the exp4301/exp4299 hard-block-all-False bug) + tests.
        F1 (exp4309) SOTA-ingestion -> .399. F2 (exp4310) registry/gaps hygiene + GAP-4 regression guard
        (re-run; .397 blocked by the aggregation bug). F3 (exp4311) hardware continuity opportunistic.
        F4 (exp4312) capstone .398 using the robust aggregator.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227) and the conductor stays
  stood-down. NO task may launch TRM training, run pkill/kill against train.py, or WRITE results/trm_runs/.
  Qwen is FORBIDDEN as the TRAINED base (Spurious-Rewards confound); Qwen GGUF as an off-policy judge is
  fine. Every verifier-value task MUST declare verifier_is_oracle honestly (Circularity Discipline): an
  EXECUTABLE-oracle win is execution_grounded (cheap, valid, NOT a moat); the moat is the LEARNED-energy
  result with a matched control, CI95-excl-0. NO autonomous edits to docs/index.html / README / paper
  prose. Online ARC play stays operator-gated (NO leaderboard submission). DiffusionGemma MUST use the
  llama.cpp PR binary, not a standard GGUF loader.

