    10. Set current_contract_ready_score=1 only on exact fourteen-task agreement. Set history_reader_ready_score=1 only on deterministic private cold replay. Keep cohort support separate. Run private E2E-018 and E2E-021 authority/replay cases. No science win is required.
    11. Run relevant unit and consumer tests, scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Require100 percent newly owned statement coverage including actual CLI, child, failure and recovery paths. Use pytest -n 0 -o addopts= with private scratch. Record exact argv, exit codes, timing and output hashes. Do not launch the full repository suite inside an experiment.
    12. Cold-replay primitive evidence in a fresh process. Test valid, negative and rehashed-tamper cases. Run unchanged primary_publication checks, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Keep every finding. Use only the qualified finding-consumer policy from Exp8318/8319; a raw nonzero exit never proves a clean result. Errors, unknown findings and unadjudicated warnings block readiness. Publish the terminal primary atomically after required checks. Failed owned checks disqualify. Unchanged external missingness is blocked, never partial. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. No generator-weight updates or external publication.
