        vanilla_descent_solve_rate: principle="the headroom WITNESS — MUST be < 0.9 (else the corpus is ceiling-saturated, the exp3518 failure mode)."
        vanilla_descent_solve_rate_hard_tier: principle="the trivial baseline's solve-rate ON THE HARD TIER specifically — MUST be < 1.0 (the operator's third gate conjunct: a global <0.9 could still hide a saturated hard tier)."
        solve_rate: principle="energy global inference solve-rate (proper coloring verified on the instance) — the gate."
        solve_rate_by_difficulty: principle="per-tier; the hard tier must NOT be saturated for the trivial baseline."
        solve_rate_by_optimizer_variant: principle="which ladder rung solved what — the optimizer-power diagnosis (incl. vanilla_descent the headroom witness)."
        strong_baseline_solve_rate: principle="best of DSATUR / tuned SA-restarts / backtracking — energy must beat a STRONG method, not just greedy-AR."
