      CONCRETE STEPS:
      1. Write an eval script invoking the models and passing their traces through `EidokuGate`.
      2. Output `{project_root}/results/experiment_1700_eidoku_eval.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

