        verdict: complete_dependency_aware_weighting_beats_carnot_clean_significant_headline_candidate
        addressed_by: "exp3667 measured dependency-aware vs Carnot AUROC on a single (pooled) FoVer scoring split with a DeLong test; exp3668 added a held-out split. NEITHER ran the FULL G1-rigor DUAL-CONDITION integrity protocol (production condition + architecture-only memory-ablation condition, the exact methodology behind the frozen G1 source exp2837/exp2850). This task re-runs the dependency-aware weighting under THAT protocol so the candidate is directly comparable to the frozen 0.9131 G1 artifact: both conditions, >=5 seeds, per-seed AUROC + pooled CI, reproducibility_checksum, leak-free, adversarial-verify clean. Different deliverable shape (a G1-candidate dual-condition integrity artifact, not a weighting panel)."
        retire_if_same_verdict: false
    milestone: "2026.06.337"
    title: "Promote the dependency-aware weighting to a G1-rigor headline candidate — run the FULL dual-condition integrity protocol (mirror exp2837/exp2850: production + architecture-only conditions, >=5 seeds, per-seed AUROC + pooled CI, reproducibility_checksum, leak-free, adversarial-verify clean) on the held-out-validated dependency-aware weighting; produce the new-headline CANDIDATE artifact directly comparable to the frozen 0.9131 G1 source"
    priority: critical
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # anti-wipeout codex routing for .337; multi-file integrity protocol replication
    estimated_wall_time_min: 28
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3680_dependency_aware_dual_condition_integrity.json
    prompt: |
      CONTEXT: the frozen FoVer headline (0.9131, G1) comes from exp2837/exp2850's DUAL-CONDITION integrity
      protocol (production condition AUROC 0.9131 + architecture-only memory-ablation condition; 5 seeds; CI
      [0.9027,0.9235]; learning_contribution +0.0185 CI [0.0125,0.0245]). .336 found a held-out-validated
      dependency-aware weighting (exp3667/3668: 0.9332 vs Carnot 0.919/0.920) but NOT under that exact protocol.
      Before the dependency-aware number can EVER be promoted to the headline, it must be measured under the SAME
      G1-rigor protocol so it is apples-to-apples with the frozen artifact. This task produces that candidate
      artifact. It does NOT touch the frozen headline -- the frozen 0.9131 stays frozen until a future operator
      re-freeze (exp3681 prepares the package).
      EXISTING CODE TO READ FIRST: results/experiment_2850 (the frozen G1 dual-condition integrity source -- copy
      its protocol) and results/experiment_2837 (the FoVer corpus + the 4 scoring verifiers) and
      results/experiment_3667 + results/experiment_3668 (the clean dependency-aware weighting + held-out
      validation) via scripts/summarize_artifact.py; scripts/reproduce_fover_headline.py (the G2 reproducer
      logic, to mirror); ops/north-star.md sec-1 + sec-2 (the headline + G1 definition).
      PRECONDITIONS (step 0): the FoVer corpus + the 4 scoring verifiers loadable; the exp3667 dependency-aware
      weighting implementation present; exp2850 readable for protocol parity. If not -> "complete:
      blocked_fover_corpus_or_dependency_weighting_or_g1_source_unavailable".
      DE-TAUTOLOGY + LEAK GUARDS (MANDATORY): store each conceptually-distinct AUROC under exactly ONE field name;
      verifiers score (input, candidate) only -- never the gold label; an AUROC >= 0.99 on n>=1000 is a RED-FLAG
      leak (report leak_free=false). Seeds may equal content-derived values but never the experiment number alone
      (the exp3506 tautology trap).
      CONCRETE STEPS:
        1. Replicate exp2850's dual-condition protocol EXACTLY but with the dependency-aware weighting in the
           production condition: production-condition dependency-aware AUROC (>=5 seeds, per-seed + pooled CI) and
           the architecture-only condition (the memory-ablation), so learning_contribution is recomputed under
           the new weighting. Report Carnot-current weighting under the IDENTICAL protocol as the in-artifact bar.
        2. Paired delta (dependency-aware production vs Carnot production) + bootstrap CI + DeLong p on the SAME
           splits; report the dependency-aware production AUROC vs the FROZEN 0.9131 explicitly (this is the
           candidate-new-headline number).
        3. Run `python scripts/adversarial_verify.py <your artifact>` and CONFIRM no TAUTOLOGY/critical flag and
           leak_free before finishing.
        4. Honest verdict: is the dependency-aware production-condition AUROC, under the frozen protocol, both
           higher than 0.9131 AND significant (delta CI excludes 0, DeLong p<0.05), AND adversarial-clean +
           leak-free? If yes -> dependency_aware_g1_rigor_confirmed=true (a G1-candidate, NOT a swap).
      ANTI-POISON TEST DISCIPLINE (MANDATORY): parametrize any pytest over the honest outcomes
      (g1_rigor_confirmed / no_significant_gain_under_protocol / blocked) on synthetic fixtures; NEVER hard-assert
      one success string. Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; dependency_aware_g1_rigor_confirmed MUST be a BARE top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores the cached FoVer corpus under the dual-condition protocol; no LLM load)."
        production_auroc_dependency_aware:
          principle: "The candidate-new-headline number: dependency-aware AUROC in the production condition under the frozen G1 protocol -- one field, no alias."
        production_auroc_carnot_current:
          principle: "Carnot's current weighting under the IDENTICAL protocol -- the in-artifact bar; one field, no alias."
        frozen_headline_auroc:
          principle: "The frozen 0.9131 -- recorded verbatim so the candidate is explicitly compared, never silently substituted."
        production_auroc_ci:
          principle: "Pooled bootstrap CI of the dependency-aware production AUROC -- a candidate headline needs a CI like the frozen one."
        learning_contribution_dependency_aware:
          principle: "The architecture-only memory-ablation delta recomputed under the new weighting -- the FR-11 contribution must be re-measured for a re-freeze."
        dependency_vs_carnot_delta_ci:
          principle: "Paired delta + bootstrap CI of dependency-aware minus Carnot under the protocol."
        delong_p_dependency_vs_carnot:
          principle: "DeLong paired significance under the protocol -- a point estimate alone cannot move a headline."
        n_seeds:
          principle: "Replication count (>=5, matching the frozen G1 source)."
        n_examples:
          principle: "Sample-size rigor (FoVer n>=1000)."
        adversarial_verify_clean:
          principle: "True iff the artifact passes adversarial_verify with no TAUTOLOGY/critical flag -- a G1 candidate must be adversarial-clean."
        leak_free:
          principle: "True iff verifiers scored (input, candidate) only and AUROC < 0.99 -- a leaked AUROC cannot be a headline."
        dependency_aware_g1_rigor_confirmed:
          principle: "BARE bool. True iff dependency-aware production AUROC > frozen 0.9131 AND delta CI excludes 0 AND DeLong p<0.05 AND adversarial_verify_clean AND leak_free -- the G1-candidate gate. STORE AS BARE true/false -- gates exp3681."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "production_auroc_dependency_aware present AND production_auroc_carnot_current present AND adversarial_verify_clean == true AND leak_free == true AND n_seeds >= 5"
          principle: "A G1-rigor headline candidate requires both weightings measured under the frozen dual-condition protocol, >=5 seeds, adversarial-clean and leak-free -- otherwise it is not comparable to the frozen G1 source."
      TERMINAL VERDICTS: "complete: dependency_aware_g1_rigor_confirmed_headline_candidate_exceeds_frozen_0_9131" /
      "complete: dependency_aware_no_significant_gain_under_g1_protocol_frozen_headline_stands" /
      "complete: blocked_fover_corpus_or_dependency_weighting_or_g1_source_unavailable"
      Run: cd {project_root} && python scripts/experiment_3680_dependency_aware_dual_condition_integrity.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

