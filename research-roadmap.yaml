  prompt: |
    CONTEXT:
    The arXiv submission is blocked by 5 critical integrity issues in docs/arxiv-paper/main.tex.
    These must be fixed with MINIMAL, SURGICAL edits — do not rewrite entire sections.
    Use MINIMAL-FIRST STRATEGY: find the specific claim, replace with an honest version.

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    python3 -c "
    import json, os; os.makedirs('results', exist_ok=True)
    d = {'experiment':'1257_paper_v6_critical_issues_fix','schema':'paper_integrity_v1',
         'run_date':'{date}','status':'in_progress','critical_issues_fixed':0,
         'issues_fixed_list':[],'honest_verdict':'in_progress'}
    open('results/experiment_1257_paper_v6_critical_issues_fix.json','w').write(json.dumps(d,indent=2))
    print('STEP 0 written')
    " 2>&1

    EXISTING CODE TO READ FIRST:
    - docs/arxiv-paper/main.tex (the paper — search for the specific claims below)
    - results/experiment_1094_kv260_performance_benchmark.json (for ISSUE-3: measured CPU latency)
    - openspec/change-proposals/paper-v5-integrity-remediation.md (full issue descriptions)

    TASK: Fix each of the 5 critical issues with the minimal possible edit.

    ISSUE-1: fig3 — fabricated CPU baseline
    The paper shows a 290ms/call CPU baseline for fig3's speedup comparison. This value is
    NOT a measured result from exp1094 — it is an estimate. Fix: add a footnote or inline
    caveat: "CPU baseline is order-of-magnitude estimate; measured value at equivalent problem
    size: see exp1094 results."
    Minimal fix: grep for "290ms" or "11680" in main.tex and add "(estimated)" or rephrase.

    ISSUE-2: KL=3.07 label
    The paper describes KL=3.07 as a "bitstream-measured" result. exp1094 uses
    kl_measurement_mode="software_parallel_glauber_proxy". Fix: change "bitstream-measured"
    to "software-simulated (Glauber dynamics proxy; bitstream measurement requires FPGA synthesis)".

    ISSUE-3: 15.6x speedup baseline
    The paper's 15.6x speedup uses CPU_GIBBS_PER_SWEEP_NS = 1000.0 (a hand-typed constant).
    exp1094's actual measured CPU is ~15,960 ns per sweep. Fix: replace the hand-typed constant
    reference with the exp1094 measured value, or add a footnote citing the measured value.

    ISSUE-4: 76,130x HumanEval speedup
    This compares 117μs CPU code vs 8.93s LLM API roundtrip — apples to oranges.
    Fix: remove this figure from the headline speedup claim. If retained, relabel as
    "latency reduction vs LLM-API roundtrip (different task class)".

    ISSUE-5: SOSKANEnergyV3 AUROC reconciliation
    Two AUROC values appear: 0.9902 (exp1120 retrained) and 0.9545 (exp1121 production OOD).
    Fix: clarify which measurement is which. In-distribution AUROC=0.9902; OOD/production
    deployment AUROC=0.9545. Add a footnote distinguishing training distribution vs OOD.

    CONCRETE STEPS:
    1. python3 -c "import json; d=json.load(open('results/experiment_1094_kv260_performance_benchmark.json')); print('exp1094 CPU latency ns:', d.get('cpu_latency_ns_per_sweep','NOT_FOUND'))" 2>&1

    2. grep -n "290ms\|11680\|11,680\|CPU baseline" docs/arxiv-paper/main.tex | head -20 2>&1

    3. grep -n "bitstream.measured\|bitstream-measured\|KL.*3\.07\|3\.07.*KL" docs/arxiv-paper/main.tex | head -10 2>&1

    4. grep -n "1000\.0\|CPU_GIBBS\|15\.6x\|15.6x" docs/arxiv-paper/main.tex | head -10 2>&1

    5. grep -n "76.130\|76,130\|HumanEval.*speedup\|speedup.*HumanEval" docs/arxiv-paper/main.tex | head -10 2>&1

    6. grep -n "0\.9902\|0\.9545\|0.9902\|0.9545\|AUCR\|AUROC.*SOS\|SOS.*AUROC" docs/arxiv-paper/main.tex | head -10 2>&1

    7. [Make minimal targeted edits to main.tex for each issue found. Use sed -i or direct edit.]

    8. Verify fixes:
    grep -c "estimated\|proxy\|order.of.magnitude\|different task class" docs/arxiv-paper/main.tex 2>&1

    9. Update artifact:
    python3 -c "
    import json
    f='results/experiment_1257_paper_v6_critical_issues_fix.json'
    d=json.load(open(f))
    # Fill in which issues were fixed
    # d['issues_fixed_list'] = ['ISSUE-1','ISSUE-2','ISSUE-3','ISSUE-4','ISSUE-5']
    # d['critical_issues_fixed'] = len(d['issues_fixed_list'])
    d['status']='complete'
    d['honest_verdict']=f'paper_v6_{d[\"critical_issues_fixed\"]}_of_5_critical_issues_fixed'
    open(f,'w').write(json.dumps(d,indent=2))
    print('Done:', d['honest_verdict'])
    " 2>&1

    REQUIRED ARTIFACT FIELDS:
