- id: exp7085-three-family-chat-transport-canary
  title: Three-family GGUF chat-template transport canary
  track: local-inference
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: true
  max_turns: 100
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.621
  deliverable: results/experiment_7085_v621_chat_transport_canary.json
  prior_failures:
    - experiment_id: exp6200-three-family-raw-code-transport-canary
      verdict: "complete_partial: Exp6200 coverage=18/18 cells; ready_families=[]"
      addressed_by: "Exp7085 uses the embedded GGUF chat template, explicit role messages, a 192-token budget, and per-family empty, parse, stop, and control-token gates."
      retire_if_same_verdict: true
    - experiment_id: exp7080-recovered-three-family-entrance-bank
      verdict: partial_three_family_entrance_proposal_bank_incomplete
      addressed_by: "Exp7085 isolates transport on eight units per family before any full bank run and requires zero empty or leaked-control-token outputs."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7079 proved that both local RTX 3090 leases and cold cleanup work.
    Exp7080 then called raw completion on an instruction-tuned Gemma GGUF. Of
    192 rows, 90 were empty, 64 had zero generated tokens, and 21 leaked a
    control token. The next full run needs a small all-family transport gate.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md section "V621 planner refresh"
    - {project_root}/ops/known-issues.md section for Exp7080
    - {project_root}/results/experiment_7064_v619_exact_entrance_fixture.json
    - {project_root}/results/experiment_7079_v620_gpu_lease_audit.json
    - {project_root}/results/experiment_7080_v620_three_family_entrance_bank.json
    - {project_root}/results/experiment_6200_three_family_raw_code_transport_canary.json
    - {project_root}/python/carnot/experiment_7080_v620_three_family_entrance_bank.py
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/scripts/experiment_template.py cached_sota_pair() pattern
    - {project_root}/scripts/run_gpu_guard.py
    - {project_root}/scripts/run_stop_authority.py
    - {project_root}/openspec/capabilities/inference/spec.md
    - {project_root}/openspec/capabilities/verification/spec.md

    TASK:
    Build and run a bounded chat-template transport canary on all three
    mandated local SOTA GGUF families. Prove that each model receives a valid
    instruction chat template and emits a short parseable entrance proposal.
    Do not build the full bank in this task.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp7064 entrance_fixture_ready_score=1, Exp7079
       gpu_lease_cold_audit_ready_score=1, recomputed hashes, owned idle RTX
       3090 leases, CUDA llama.cpp, clean stop authority, writable raw-first
       checkpoints, and all three cached GGUFs. If an unattributed owner holds
       a resource, block and send no signal. On failure write terminal
       `blocked`, `inference_substrate_class=blocked_no_run`, and exact
       gate_check_summary.
    1. Add REQ-INFRA-7085 and REQ-VERIFY-7085 with RED tests before
       implementation. Test missing or empty templates, raw-completion calls,
       wrong roles, cache miss, identity mismatch, zero-token output, leaked
       control tokens, length truncation, stop mismatch, resume, lease loss,
       cleanup, and aggregate recomputation.
    2. MODEL_SPECS must resolve through cached_sota_pair() and execute exactly
       `unsloth/Qwen3.6-35B-A3B-GGUF`,
       `unsloth/gemma-4-31B-it-GGUF`, and
       `unsloth/gemma-4-26B-A4B-it-GGUF`. Load GGUF paths with llama.cpp. Never
       call AutoTokenizer on a GGUF repository. No legacy-small headline
       fallback is allowed.
    3. Use `create_chat_completion` or an equivalent call that applies the
       embedded GGUF chat template. Emit the detected chat format, role
       messages, rendered-prompt hash when available, stop configuration, and
       generated-token count. Do not use raw `create_completion` on the plain
       instruction text.
    4. Freeze eight representative Exp7064 units per model, one matched seed,
       one first-branch response schema, temperature, top-p, context, and a
       192-token completion budget. Randomize model order reproducibly.
    5. Write raw bytes, token counts, finish reason, timings, and hashes before
       parsing or exact labeling. Parse only the declared short branch schema.
       Use the exact enumerator only after generation.
    6. Checkpoint each unit. Emit runner receipt, stage and task GPU telemetry,
       model-load count, per-model duration, peak VRAM per device, lease phase
       history, and post-release VRAM.
    7. Set chat_transport_ready_score=1 only if all 24 rows used real models,
       every family has zero empty outputs, zero zero-token outputs, zero
       leaked control tokens, at least 95 percent parseability, no length-
       limited row, a valid template receipt, and clean release.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, scoped spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked; MODEL_SPECS;
       inference_substrate (bounded live local SOTA GGUF chat generation);
       inference_substrate_class (model_bounded_generation, or blocked_no_run
       on a blocked precondition); duration_s; source_artifact_hashes;
       cited_upstream_artifacts; rows; per_game_results; model_specs;
       model_identity_rows; model_execution_rows; chat_template_rows;
       role_message_rows; rendered_prompt_hash_rows; stop_config_rows;
       raw_output_rows; token_count_rows; finish_reason_rows; parse_rows;
       exact_label_rows; per_model_rows; model_order_rows; sampling_config;
       seed_rows; checkpoint_rows; runner_receipt; generation_invoked;
       total_model_count; model_load_count_by_stage; per_model_duration_s;
       stage_gpu_telemetry_rows; task_gpu_telemetry_rows;
       peak_vram_by_device; gpu_lease_rows; vram_release_rows; signals_sent;
       empty_output_rate_by_model; zero_token_rate_by_model;
       parseable_rate_by_model; leaked_control_token_count_by_model;
       length_limited_count_by_model; all_models_real;
       chat_transport_ready_score; random_seed; reproducibility_checksum;
       gate_check_summary with failed check, expected value, and observed value
       for any blocked verdict; verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7085_v621_chat_transport_canary.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

