  - id: exp2267-dualgpu-import-fix
    title: "Phase 0: Fix DualGPU ImportError in carnot.inference.__init__ (Cascade Root Cause)"
    milestone: "2026.05.224"
    deliverable: "results/experiment_2267_dualgpu_fix.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 20
    prior_failures:
      - experiment_id: exp2254-pretest-fix
        verdict: incomplete
        addressed_by: "exp2254 resolved the duplicate test_compositional_energy basename (renamed phase3 test file) but pretest_fixed=false because a DIFFERENT ImportError remained: tests/python/test_dual_gpu.py imports DualGPUExecutionResult from carnot.inference, but python/carnot/inference/__init__.py is EMPTY. The class exists in python/carnot/inference/dual_gpu.py but is never re-exported. Root cause diagnosed from exp2254 evidence. Fix: add the four missing symbols to __init__.py."
    prompt: |
      CONTEXT: The cascading pre-test failure across milestones .223 has been root-caused to a single
      issue: python/carnot/inference/__init__.py is EMPTY, but tests/python/test_dual_gpu.py imports
      DualGPUExecutionResult, DualGPURunner, estimate_model_size_billions, and requires_device_map_auto
      from 'carnot.inference'. The classes exist in python/carnot/inference/dual_gpu.py but are never
      re-exported from __init__.py.
      This ImportError causes the conductor's pre-test check to fail, which labels ALL tasks as
      SKIP or blocked_gate_check_failed — including tasks with no structured gate of their own.
      Fixing this one file unblocks 10+ experiments across .223 and .224.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/inference/__init__.py
        {project_root}/python/carnot/inference/dual_gpu.py
        {project_root}/tests/python/test_dual_gpu.py
      TASK: Add the four missing exports to carnot/inference/__init__.py and verify pre-tests pass.
      CONCRETE STEPS:
        1. Read python/carnot/inference/dual_gpu.py to confirm the exact names of all four symbols:
           DualGPUExecutionResult, DualGPURunner, estimate_model_size_billions, requires_device_map_auto.
           Verify they are defined (not just referenced) in dual_gpu.py.
        2. Edit python/carnot/inference/__init__.py to add:
           from carnot.inference.dual_gpu import (
               DualGPUExecutionResult,
               DualGPURunner,
               estimate_model_size_billions,
               requires_device_map_auto,
           )
        3. Run: cd {project_root} && .venv/bin/python -m pytest tests/python/test_dual_gpu.py -x -q --no-cov
           -p no:cacheprovider 2>&1 | tail -10
           Record: n_test_errors, n_test_failures.
        4. Run the full pre-test check: cd {project_root} && .venv/bin/python -m pytest tests/python -x -q
           --no-cov -p no:cacheprovider 2>&1 | tail -5
           Record: full_pretest_errors, full_pretest_failures.
        5. Set pretest_fixed: true if full_pretest_errors == 0 AND full_pretest_failures == 0.
        6. Write deliverable to results/experiment_2267_dualgpu_fix.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if pretest_fixed is true."
        - pretest_fixed:
            principle: "Primary gate for ALL Phase 1 and Phase 2 tasks. True only when the full pytest suite has zero errors and zero failures — not just the dual_gpu test file alone."
        - n_test_errors:
            principle: "Records dual_gpu.py test errors specifically to confirm the ImportError was resolved."
        - n_test_failures:
            principle: "Records dual_gpu.py test failures to confirm no regressions were introduced by the fix."
        - full_pretest_errors:
            principle: "Records full-suite error count post-fix; must be 0 for pretest_fixed=true."
        - full_pretest_failures:
            principle: "Records full-suite failure count post-fix; must be 0 for pretest_fixed=true."
        - symbols_added:
            principle: "Lists the four symbol names added to __init__.py so reviewers can verify completeness of the export fix."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2268-fst-real-scale-live-gen
    title: "Phase 1: FST+ODAR+CASAL Real-Scale Live Generation Benchmark"
    milestone: "2026.05.224"
    deliverable: "results/experiment_2268_fst_live_gen.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 50
    gated_on:
      - upstream: exp2267-dualgpu-import-fix
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2255-fst-real-scale-live-gen
        verdict: blocked_gate_check_failed
        addressed_by: "exp2255 had blocked_gate_check_failed because exp2254.pretest_fixed=false. Root cause diagnosed: carnot.inference.__init__ was empty; DualGPUExecutionResult not exported. exp2267 fixes the ImportError by adding the four symbols to __init__.py. This attempt is identical in scope to exp2255 but runs only when exp2267.pretest_fixed=true."
    prompt: |
      CONTEXT: The .223 capstone (exp2251) demonstrated FST+ODAR+CASAL interoperate, but live
      hardware evidence was limited to a successful one-token GGUF probe on GPU 0, not full
      live answer generation. exp2255 was blocked by the DualGPU ImportError cascade. Now that
      exp2267 has fixed that ImportError, this task runs the benchmark with FULL ANSWER GENERATION
      (minimum 50 tokens per answer, not a single-token probe).
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/python/carnot/pipeline/odar_router.py
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/scripts/experiment_template.py
      TASK: Run 20 full generate+verify passes on a cached SOTA GGUF, generating complete answers.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. python/carnot/pipeline/odar_router.py imports without error — else blocked_odar_missing.
           b. python/carnot/training/fast_slow.py imports without error — else blocked_fst_missing.
           c. python/carnot/samplers/casal.py imports without error — else blocked_casal_missing.
           d. ls ~/.cache/huggingface/hub/ | grep -i "gemma-4-26B\|Qwen3.6-35B\|gemma-4-31B" returns non-empty —
              else blocked_model_not_cached. Do NOT fabricate GPU inference.
        1. MODEL_SPECS must include at least one of:
           - unsloth/Qwen3.6-35B-A3B-GGUF
           - unsloth/gemma-4-31B-it-GGUF
           - unsloth/gemma-4-26B-A4B-it-GGUF
        2. Construct 20 math/reasoning prompts (multi-step arithmetic, simple logic).
        3. For each prompt: generate a FULL ANSWER (minimum 50 tokens, not just next-token).
           Record the full generated text.
        4. For each answer: run ODAR routing (does this answer need deliberative verification?);
           if yes, run FST context prep + CASAL constraint enforcement on the answer.
        5. Measure:
           - n_violations_found: count of answers where a constraint violation was detected
           - n_violations_repaired: count where repair reduced energy
           - mean_constraint_violation_after_repair
           - mean_answer_length_tokens: must be >= 50 (not a one-token probe)
           - odar_fast_path_fraction: fraction routed to fast path
        6. Set fst_live_validated: true if n_violations_found >= 1 AND
           mean_answer_length_tokens >= 50.
        7. Write deliverable to results/experiment_2268_fst_live_gen.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if fst_live_validated is true."
        - fst_live_validated:
            principle: "Primary gate for exp2278 capstone. True only when violations were found in FULL answers (not token probes). This is the load-bearing anti-fabrication gate."
        - mean_answer_length_tokens:
            principle: "Must be >= 50 to distinguish from single-token probes. A value < 50 indicates the benchmark did not test full generation."
        - n_violations_found:
            principle: "At least 1 required to demonstrate the pipeline actually runs verification, not just pass-through generation."
        - n_violations_repaired:
            principle: "Records repair effectiveness; 0 is acceptable as an honest finding, but > 0 is the headline claim."
        - models_used:
            principle: "Records which SOTA GGUF ran so claims are model-specific and not hallucinated."
        - preconditions_checked:
            principle: "Lists which resources were verified before inference; pre-empts fabrication mode."
        - duration_s:
            principle: "Real compute takes wall-clock time; implausibly short duration (< 60s for 20 problems with a 26B model) flags fabrication."
        - random_seed:
            principle: "Reproducibility for the 20-example corpus."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2269-fr11-fst-multidomain
    title: "Phase 1: FR-11 FST Multi-Domain Retention Validation"
    milestone: "2026.05.224"
    deliverable: "results/experiment_2269_fr11_multidomain.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2268-fst-real-scale-live-gen
        artifact_field: fst_live_validated
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2256-fr11-fst-multidomain
        verdict: blocked_gate_check_failed
        addressed_by: "exp2256 was blocked because its upstream exp2255 (fst_live_validated) was itself blocked by the DualGPU ImportError cascade. exp2267 fixes the root cause. This attempt is identical in scope to exp2256 but runs only when exp2268.fst_live_validated=true."
    prompt: |
      CONTEXT: FR-11 continuous self-learning mandate. exp2241 (.222) proved FST achieves 4x
      sample efficiency on a single-domain synthetic corpus. This task validates that FST
      fast-weight updates generalize across domains: fast weights learned on math problems
      should partially help with code and logic problems. Cross-domain retention is the
      critical FR-11 property distinguishing Carnot from per-task fine-tuning.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/scripts/experiment_template.py
        {project_root}/results/experiment_2268_fst_live_gen.json
      TASK: Validate FST fast-weight retention across 3 reasoning domains.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/training/fast_slow.py imports without error — else blocked_fst_missing.
        1. Create 3 domain corpora (10 examples each, synthetic, no external LLM calls):
           Domain A: arithmetic (a + b = c style)
           Domain B: code constraints (loop bounds, array indices)
           Domain C: logic propositions (if P then Q style)
        2. Run FST learning in sequence: Domain A → Domain B → Domain C.
        3. After Domain C training, evaluate fast-weight performance on held-out Domain A examples.
        4. Measure:
           - cross_domain_retention_rate: accuracy on Domain A after Domain C training divided by
             accuracy on Domain A after Domain A training
           - per_domain_utility_delta: energy reduction per domain
        5. Set fr11_multidomain_passed: true if cross_domain_retention_rate >= 0.75.
        6. Write deliverable with continuous_self_learning_task: true.
        7. Write deliverable to results/experiment_2269_fr11_multidomain.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if fr11_multidomain_passed is true."
        - continuous_self_learning_task:
            principle: "Must be true — FR-11 mandate requires at least one CSL task per milestone."
        - fr11_multidomain_passed:
            principle: "Boolean gate. True only when cross-domain retention >= 0.75; below means FST overfits per-domain."
        - cross_domain_retention_rate:
            principle: "Primary FR-11 multi-domain gate; computed as accuracy-on-A-after-C / accuracy-on-A-after-A."
        - per_domain_utility_delta:
            principle: "Per-domain energy reduction records whether FST helps each domain independently."
        - n_corpus_per_domain:
            principle: "Must be >= 10 per domain for the retention claim to be statistically non-trivial."
        - preconditions_checked:
            principle: "Lists FST module availability check; pre-empts fabrication on missing module."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2270-kancl-n256-clean-reattempt
    title: "Phase 1: KAN-CL n=256 Per-Knot Regularization Clean Re-attempt"
    milestone: "2026.05.224"
    deliverable: "results/experiment_2270_kancl_n256.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2267-dualgpu-import-fix
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2258-kancl-n256-clean-reattempt
        verdict: blocked_gate_check_failed
        addressed_by: "exp2258 had blocked_gate_check_failed because exp2254.pretest_fixed=false. Root cause: DualGPU ImportError in carnot.inference.__init__ (empty file). exp2267 fixes the root cause by exporting the four missing symbols. This attempt is identical in scope to exp2258 and runs only when exp2267.pretest_fixed=true. No THRML parity measurement; no bounded_kl field — purely per-knot importance regularization at n=256."
    prompt: |
      CONTEXT: KAN-CL per-knot importance regularization was proven at small n in .221 (exp2231).
      Attempts at n=256 in .222 (exp2247, blocked by THRML contamination) and .223 (exp2258,
      blocked by DualGPU ImportError) have failed for exogenous reasons. COOL (Springer 2026)
      demonstrated 20us update latency with KANs on n=256-class tasks. This task is a CLEAN
      re-attempt: NO THRML parity, NO bounded_kl metric — purely per-knot importance regularization
      and retention across sequential constraint domains at n=256 spin Ising scale.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/models/substrate_kan.py
        {project_root}/python/carnot/samplers/parallel_ising.py
        {project_root}/scripts/experiment_template.py
      TASK: Validate KAN-CL per-knot importance at n=256 without THRML parity measurement.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/models/substrate_kan.py imports without error — else blocked_kan_missing.
        1. Construct an Ising model with n=256 spins (random J and h, random_seed=42).
        2. Define 3 sequential constraint domains:
           Domain 1: ferromagnetic coupling pattern (J_ij = +1 for nearest neighbors)
           Domain 2: antiferromagnetic coupling (J_ij = -1 for nearest neighbors)
           Domain 3: random sparse coupling (random J, 20% non-zero)
        3. Train KAN-CL with per-knot importance enabled for each domain in sequence.
        4. After Domain 3 training, evaluate accuracy on held-out Domain 1 test instances.
        5. Measure:
           - n256_retention_rate: accuracy on Domain 1 after Domain 3 / accuracy after Domain 1
           - per_knot_update_latency_us: mean update time per step in microseconds
           - n_active_knots: count of importance-weighted active knots after Domain 3
        6. Set kancl_n256_validated: true if n256_retention_rate >= 0.85.
        7. Write deliverable to results/experiment_2270_kancl_n256.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if n256_retention_rate >= 0.85."
        - kancl_n256_validated:
            principle: "Boolean gate for exp2271 and exp2278. True only if retention >= 0.85 at n=256 scale."
        - n256_retention_rate:
            principle: "Primary COOL-parity gate; >= 0.85 means per-knot importance prevents catastrophic forgetting at this scale."
        - per_knot_update_latency_us:
            principle: "Records whether COOL's 20us budget is achievable; informs hardware feasibility story."
        - n_active_knots:
            principle: "Sparsity metric; fewer active knots = more efficient; records importance mask effectiveness."
        - n_spins:
            principle: "Must be 256 to confirm this is the n=256 scale experiment, not a smaller surrogate."
        - random_seed:
            principle: "Reproducibility for sequential domain training; must be 42."
        - preconditions_checked:
            principle: "Lists KAN module availability check."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2271-kancl-casal-joint
    title: "Phase 1: KAN-CL n=256 + CASAL Joint Constraint Enforcement"
    milestone: "2026.05.224"
    deliverable: "results/experiment_2271_kancl_casal_joint.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2270-kancl-n256-clean-reattempt
        artifact_field: kancl_n256_validated
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2259-kancl-casal-joint
        verdict: blocked_gate_check_failed
        addressed_by: "exp2259 was blocked because its upstream exp2258 (kancl_n256_validated) was itself blocked by the DualGPU ImportError cascade. exp2267 fixes the root cause. exp2270 runs the n=256 validation first. This attempt is identical in scope to exp2259 but runs only when exp2270.kancl_n256_validated=true."
    prompt: |
      CONTEXT: KAN-CL (exp2270) provides per-knot importance regularization at n=256. CASAL
      (.222 exp2245) provides primal-dual hard-constraint sampling. Integrating them: when a
      constraint equality is violated in the energy landscape, CASAL enforces hard satisfaction
      while KAN-CL importance weights determine which spline knots are updated to remember
      this constraint pattern. This integration closes the full training+sampling loop.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/models/substrate_kan.py
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/scripts/experiment_template.py
      TASK: Evaluate KAN-CL importance weighting + CASAL hard-constraint sampling jointly.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/samplers/casal.py imports without error — else blocked_casal_missing.
           b. python/carnot/models/substrate_kan.py imports without error — else blocked_kan_missing.
        1. Define 2D continuous EBM with n=256 binary variables and 3 hard equality constraints.
        2. Run joint training loop (10 iterations):
           - CASAL sampler generates constraint-satisfying samples
           - KAN-CL importance weights updated based on which knots activated on violations
        3. Measure:
           - joint_constraint_satisfaction_rate: fraction of samples satisfying all 3 constraints
           - importance_weight_coverage: fraction of violated-constraint knots with high importance
        4. Set kancl_casal_joint_validated: true if joint_constraint_satisfaction_rate >= 0.90.
        5. Write deliverable to results/experiment_2271_kancl_casal_joint.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if joint_constraint_satisfaction_rate >= 0.90."
        - kancl_casal_joint_validated:
            principle: "Boolean gate. True when >= 90% of samples satisfy all hard constraints."
        - joint_constraint_satisfaction_rate:
            principle: "Primary integration gate: CASAL must enforce hard constraints even as KAN-CL updates importance weights."
        - importance_weight_coverage:
            principle: "Validates that importance weighting targets the right knots (those activated by violations), not random knots."
        - preconditions_checked:
            principle: "Lists CASAL and KAN module availability checks; pre-empts fabrication on missing modules."
        - random_seed:
            principle: "Reproducibility for the joint training loop."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2272-kv260-rtl-clean-reattempt
