  - id: exp2011-pypi-workflow-final-recheck
    title: "Exp 2011: PyPI workflow FINAL re-check (v0.1.0b1 awaiting operator approval since .194)"
    deliverable: results/experiment_2011_pypi_final_recheck.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1987-pypi-workflow-status-recheck
        verdict: status_unknown_drafted_during_bash_failure
        addressed_by: "exp1987 (.200) drafted during Bash failure; activation status unknown. This task runs the same check + escalates if still pending after this many hours."
        retire_if_same_verdict: false
      - experiment_id: exp1930-pypi-workflow-status-check
        verdict: success_operator_approval_required
        addressed_by: "exp1930 (.196) identified workflow waiting state. Many hours have passed; this final re-check determines if operator approved + workflow succeeded, OR if the workflow timed out and needs re-trigger via workflow_dispatch."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: exp1910 pushed v0.1.0b1 tag at .194. exp1930 (.196)
      identified the workflow waiting on operator approval. .200 exp1987
      drafted re-check (status unknown). This is the FINAL re-check
      task; if workflow still waiting after this many hours, the
      actionable next step shifts from 'operator approve' to
      'workflow timed out — re-trigger via workflow_dispatch'.

      FALSIFIABLE HYPOTHESIS: The v0.1.0b1 workflow run is in one of:
      (a) approved-and-succeeded (PyPI 0.1.0b1 reachable), (b) approved-
      and-failed (workflow ran but step failed), (c) still-waiting
      (operator hasn't approved yet), (d) timed-out / cancelled
      (workflow auto-expired). This task identifies which AND
      reports actionable next step.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1930_pypi_status.json
        - results/experiment_1987_pypi_status_recheck.json if exists
        - .github/workflows/publish-pypi.yml
        - feedback_pypi_publish_via_ci_tagged_release memory entry

      TASK: Final workflow status check; verify PyPI if succeeded.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `command -v gh` succeeds — else `blocked_gh_cli_unavailable`.
           b. `gh auth status` returns authenticated — else `blocked_gh_auth_needed`.
           c. `git ls-remote --tags origin | grep "v0.1.0b1"` returns
              hash — else `blocked_tag_unexpectedly_missing`.
           Record preconditions_checked.
        1. `gh run list --workflow=publish-pypi.yml --limit 10
            --repo Carnot-EBM/carnot-ebm --json
            databaseId,status,conclusion,createdAt,url`. Find
           v0.1.0b1 run.
        2. Classify:
           - status=waiting → "Operator: approve at <url>"
           - status=completed AND conclusion=success → verify PyPI
             install in fresh venv.
           - status=completed AND conclusion=failure → fetch failed
             logs.
           - status=cancelled OR run too old (>72h) → recommend
             `gh workflow run publish-pypi.yml --ref v0.1.0b1 --repo
             Carnot-EBM/carnot-ebm` to re-trigger via workflow_dispatch.
        3. If workflow_dispatch re-trigger needed, attempt it (NO new
           tag push) and wait up to 10 minutes for completion.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.pypi_workflow_final_recheck.v1"
        - experiment: 2011
        - run_date: ISO-8601 UTC
        - duration_s: > 15s
        - random_seed: 173211
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {{workflow_file: ".github/workflows/publish-pypi.yml",
          tag_checked: "v0.1.0b1",
          prior_status_artifact: "exp1930_or_exp1987"}}
        - n_samples: 1
        - n_samples_justification: "Final status check; n=1 workflow run."
        - workflow_run_id: int or null
        - workflow_run_url: str
        - workflow_run_status: "waiting" | "in_progress" | "success" | "failure" | "cancelled"
        - workflow_run_conclusion: str or null
        - state_change_from_prior: "no_change" | "now_succeeded" | "now_failed" | "now_cancelled"
        - re_trigger_attempted: bool
        - re_trigger_outcome: str or null
        - pypi_url_reachable: bool
        - pypi_url: str or null
        - external_install_verified: bool
        - actionable_next_step: str
        - acceptance_gate_passed: bool (status identified + actionable
          step set)
        - acceptance_gate_criteria: "Status accurately reported with
          escalation path if still pending."
        - methodology_note: "NO new tag push. workflow_dispatch
          re-trigger ONLY if prior run cancelled/timed-out."
        - optimization_direction: "neither — status check"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push tags. Do NOT modify
      scripts/research_conductor.py.

  - id: exp2012-cot2meta-routing-retry
