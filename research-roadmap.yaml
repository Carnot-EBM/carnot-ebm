        real_env_confirmed: principle "BARE BOOL — every level-up confirmed by levels_completed from the real env, not a model/heuristic (no fabrication)."
        random_seed, honest_verdict, duration_s, inference_substrate: principle "Reproducibility + terminal-prefix verdict + the real-env substrate."

      honest_verdict MUST start with `complete:`/`success:` or `blocked_<resource>`. Solving only level 1
