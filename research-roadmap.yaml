    \ strict grammar constraints during generation HURT reasoning because they prevent free-form\
    \ thinking. Fix: let model REASON FREELY until a trigger token, then SWITCH to constrained\
    \ generation for the final answer/claim. Up to +10pp on symbolic reasoning benchmarks.\n\n\
    WHY THIS MATTERS: ArithmeticExtractor found ZERO violations on Gemma4-E4B-it (0/20 including\
    \ 4 wrong answers) because IT models reason in natural language, not regex-parseable equations.\
