tasks:
- id: exp6898-v604-evidence-admissibility-contract
  title: V604 executable manifest and evidence admissibility contract
  track: infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.09.604
  deliverable: results/experiment_6898_v604_evidence_admissibility_contract.json
  prompt: |
    CONTEXT:
    V602 and V603 each activated four tasks while their design documents promised 11 and 13 tasks.
    V603 also produced a claimed live-GGUF corpus in 43.15 seconds. The adversarial verifier
    quarantined that artifact, and the downstream reducer found zero parse coverage for every GGUF
    and Enoki arm. V604 needs one exact manifest contract and an explicit admissibility ledger. This
    task is advisory. No science task may gate on it.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md and {project_root}/_bmad/prd.md
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/ops/known-issues.md and {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/results/experiment_6885_v603_executable_manifest_branch_contract.json
    - {project_root}/results/experiment_6887_three_family_relation_proposal_corpus.json
    - {project_root}/results/experiment_6888_independent_relation_qualification.json
    - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py,
      {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build an append-only V604 manifest and evidence-admissibility receipt. Compare the active design
    and roadmap from primary files. Require the exact 13-task sequence, unique deliverables, valid
    structured gates, complete prior-failure blocks, and exact prompt endings. Re-run evidence
    admission on V603 artifacts and quarantine every flagged source and every claim that depends on
    it. Do not change either roadmap, the exclusion manifest, conductor code, or old artifacts.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable V604 design and active roadmap, V603 terminal artifacts, the
       exclusion manifest, and current gate/schema/adversarial code. On failure, write
       complete_blocked_v604_evidence_admissibility_contract with gate_check_summary.
    1. Add REQ-REPORT-6898 and focused tests before implementation. Cover count, order, ID,
       deliverable, milestone, prompt-ending, gate-field, missing-upstream, prior-failure, flagged
       source, dependency-taint, and ungated-tail mismatches.
    2. Parse the design and active roadmap. Require milestone `2026.09.604`, 13 tasks, IDs
       Exp6898-Exp6910 in conductor order, and unique JSON deliverables.
    3. Require CONTEXT, EXISTING CODE TO READ FIRST, TASK, CONCRETE STEPS, a Run command, and the
       exact final sentence in every prompt.
    4. Validate every `gated_on` operator, upstream ID, producer field, and value. Require all four
       prior-failure subfields and `retire_if_same_verdict=true`.
    5. Prove that Exp6899, Exp6905, and Exp6906 are independent science roots. Prove that no task
       gates on Exp6898 and that Exp6910 is ungated.
    6. Re-run adversarial verification for the V603 artifacts. Mark Exp6887 inadmissible when its
       current critical flag remains. Mark Exp6888 non-headline because it consumes Exp6887 and
       only its lexical rule arm qualifies.
    7. Emit one row per task-contract check and one row per artifact-admission check. Preserve hard
       failures, warnings, and transitive taint separately.
    8. Set `v604_manifest_contract_ready_score=1` only when all document/YAML checks pass. This score
       cannot approve science. Set `v603_admissible_science_source_count` only from unflagged,
       independently traceable sources.
    9. Run focused tests, Ruff, OpenSpec coverage, YAML parsing, roadmap schema validation,
       prior-failure validation, gate audit, adversarial verification, artifact-convention audit,
       verdict-row consistency lint, docs audit, and root-clutter checks.
    10. REQUIRED ARTIFACT FIELDS: field_principles with one principle per required field and every
       advisory score; preconditions_checked; inference_substrate
       (deterministic_manifest_and_admissibility_audit_no_llm); duration_s; source_artifact_hashes;
       rows; document_task_rows; yaml_task_rows; document_yaml_parity_rows; gate_contract_rows;
       prior_failure_contract_rows; prompt_ending_rows; branch_root_rows; ungated_tail_rows;
       adversarial_recheck_rows; artifact_admissibility_rows; dependency_taint_rows;
       quarantined_artifact_ids; task_count; experiment_range; random_seed;
       reproducibility_checksum; v604_manifest_contract_ready_score;
       v603_admissible_science_source_count; gate_check_summary with failed check, expected value,
       and observed value for any blocked verdict; verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial); honest_verdict
       (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6898_v604_evidence_admissibility_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6885-v603-executable-manifest-branch-contract
      verdict: complete_blocked_v603_executable_manifest_branch_contract
      addressed_by: 'V604 emits all 13 executable tasks before this audit runs, makes the check advisory, and adds transitive quarantine of flagged evidence.'
      retire_if_same_verdict: true

- id: exp6899-live-relation-acquisition-canary
  title: Three-family live relation acquisition authenticity canary
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 360
  per_unit_rows: true
  milestone: 2026.09.604
  deliverable: results/experiment_6899_live_relation_acquisition_canary.json
  prompt: |
    CONTEXT:
    Exp6887 claimed a complete three-family corpus, but its 43.15-second live-model duration was
    quarantined. Exp6888 then showed zero parse coverage for every GGUF and Enoki arm. V604 must
    prove that each required local model process loads the intended weights, produces nonempty raw
    bytes, and reaches the relation parser before a larger corpus is allowed to run.

    Work at {project_root}. The execution date is {date}.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V604 Planner Refresh
    - {project_root}/ops/exclusion_manifest.yaml, finite-ID and Exp5923 retirement entries
    - {project_root}/results/experiment_5786_sota_constraint_stream.json
    - {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
    - {project_root}/results/experiment_6886_enoki_exact_relation_fixture.json
    - {project_root}/results/experiment_6887_three_family_relation_proposal_corpus.json
    - {project_root}/results/experiment_6888_independent_relation_qualification.json
    - {project_root}/scripts/experiment_template.py, cached_sota_pair() pattern
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/inference/llama_cpp_process.py
    - {project_root}/openspec/capabilities/llm-ebm-inference/spec.md
    - {project_root}/openspec/capabilities/constraint-verification/spec.md

    TASK:
    Run a small, fail-fast live acquisition canary on all three MODEL_SPECS. Use the frozen
    `anchored_relation_v1` fixture from Exp6886 and one plain relation-line protocol. Prove model,
    tokenizer, process, CUDA, output-byte, stop-reason, and parser authenticity per cell. The Enoki
    and deterministic rule arms are controls only. Do not score held semantics, use a grammar or
    schema decoder, repair a response, or accept an empty terminal cell.

    CONCRETE STEPS:
    0. PRECONDITIONS: call cached_sota_pair(); require the exact Exp6886 artifact and fixture hashes,
       all three GGUF paths, native tokenizer receipts, pinned Enoki assets, one task-owned GPU lease
       per live process, at least 24 GiB free VRAM, and zero held-sidecar access. On failure, write
       complete_blocked_live_relation_acquisition_canary with gate_check_summary.
    1. Add REQ-INFERENCE-6899 and focused tests first. Cover cache drift, wrong model file, tokenizer
       substitution, zero offload, empty bytes, zero generated tokens, parser bypass, canned rows,
       timeout, truncation, PID reuse, stale receipts, and teardown failure.
    2. Resolve every MODEL_SPEC through cached_sota_pair() and the dense extension. Use llama.cpp's
       native tokenizer. Never pass a GGUF repository to AutoTokenizer.from_pretrained().
    3. Freeze one source-only prompt and a plain line protocol with source spans and tuple fields.
       Use no grammar, JSON schema, finite answer ID, repair prompt, model judge, or text scorer.
    4. Run at least five source records per model, with all five fixture families represented. Use a
       fresh authenticated server lifecycle for each model family and at least two seeds overall.
    5. Preserve raw request and response bytes. Require nonzero response bytes, nonzero generated
       tokens, an observed stop reason, and a parser attempt for every required GGUF cell.
    6. Record model file hash, native prompt tokens, generated tokens, wall time, server PID, GPU
       UUID, offload layers, VRAM before/after, stderr tail, and teardown outcome per cell.
    7. Run Enoki and the lexical rule arm on identical records. Neither control may satisfy the live
       GGUF readiness gate.
    8. Set `relation_canary_ready_score=1` only if all three GGUF arms have authentic CUDA receipts,
       zero empty cells, zero canned cells, at least 0.60 surface parse coverage per arm, clean
       teardown, and total live duration of at least 60 seconds. Do not score tuple correctness.
    9. Run focused tests, Ruff, OpenSpec coverage, E2E-006, cache/GPU authenticity checks,
       adversarial verification, artifact-convention audit, verdict-row consistency lint, and
       root-clutter checks.
    10. REQUIRED ARTIFACT FIELDS: field_principles with one principle per required field and
       `relation_canary_ready_score`; preconditions_checked; inference_substrate
       (live_local_sota_gguf_cuda_authenticity_canary); duration_s; source_artifact_hashes;
       model_specs (all three exact MODEL_SPECS); models_used; model_artifact_hashes;
       tokenizer_receipts; llama_cpp_receipts; gpu_lease_rows; server_lifecycle_rows; prompt_manifest;
       rows (one model, seed, and source cell per row); raw_request_manifest; raw_output_manifest;
       output_byte_rows; generated_token_rows; stop_reason_rows; parse_attempt_rows;
       parse_coverage_by_model; empty_cell_count; canned_cell_count; held_sidecar_access_count
       (zero); enoki_control_rows; rule_control_rows; external_text_scorer_call_count (zero);
       constrained_schema_decode_count (zero); model_weight_mutation_count (zero); random_seed;
       reproducibility_checksum; relation_canary_ready_score; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict; verifier_is_oracle (false);
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6899_live_relation_acquisition_canary.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6887-three-family-relation-proposal-corpus
      verdict: complete_positive_three_family_relation_corpus
      addressed_by: 'This attempt is a small authenticity canary that requires nonempty raw bytes, generated tokens, per-process CUDA receipts, parser attempts, clean teardown, and the live duration floor before completion.'
      retire_if_same_verdict: true
    - experiment_id: exp5786-sota-constraint-stream
      verdict: 'complete: sota_constraint_response_stream_collected_not_ready:parser_failure_threshold'
      addressed_by: 'This attempt uses the frozen anchored_relation_v1 surface protocol and fails before corpus scale unless every required model reaches at least 0.60 parse coverage.'
      retire_if_same_verdict: true
    - experiment_id: exp5923-sota-schema-supported-constraintir-ab
      verdict: 'retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates'
      addressed_by: 'This attempt uses no schema-constrained decoding or repair reprompt and tests only authentic plain-text relation acquisition.'
      retire_if_same_verdict: true

- id: exp6900-authentic-anchored-relation-corpus
  title: Authentic three-family anchored relation proposal corpus
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 960
