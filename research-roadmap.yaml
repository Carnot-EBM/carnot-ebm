  - id: exp6584-three-family-source-receipt-audit
    milestone: "2026.08.572"
    deliverable: results/experiment_6584_three_family_source_receipt_audit.json
    title: "Independent three-family source receipt audit"
    priority: critical
    track: independent-evidence-audit
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 75
    agent_type: codex
    model: gpt-5.6-sol
    prior_failures:
      - experiment_id: exp6577-flagship-source-stream-independent-audit
        verdict: "blocked_flagship_source_stream_independent_audit: /home/ianblenke/github.com/ianblenke/carnot/results/experiment_6576_immutable_flagship_source_span_stream_v3.json expected=file_exists observed=missing"
        addressed_by: "Exp6584 audits three bounded same-milestone family artifacts instead of one source stream behind a retired monolithic root. It always runs and recomputes each family readiness field from raw rows."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6581, Exp6582, and Exp6583 should contain independent raw shards for the same frozen source units. This audit always runs. It must diagnose missing or blocked family artifacts without a model call and must not trust upstream aggregate or readiness fields. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V572 roadmap document
      - {project_root}/results/experiment_6579_v572_terminal_recovery_and_decomposition_contract.json through the expected {project_root}/results/experiment_6583_gemma4_26b_a4b_flagship_source_shard.json
      - source-byte, raw-response, GGUF-lineage, process, GPU, checkpoint, unload, cost, checksum, duplicate, drift, and row-reducer audit helpers plus tests
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/artifact_convention_audit.py, relevant evidence and model-ingestion specs, exclusions, and applicable E2E checks

      TASK
      Independently replay and merge the three family source shards. Recompute every readiness, coverage, failure, timing, and cost claim from raw rows. Emit the exact all-family audit field consumed by Exp6585.

      CONCRETE STEPS
      0. PRECONDITIONS: record expected paths, existence, hashes, schemas, source manifest and prompt hashes, audit-tool versions, CPU, RAM, disk, protected-file hashes, and raw content-addressed path availability. Do not synthesize missing family rows.
      1. Add or confirm REQ-* and SCENARIO anchors for independent three-family replay, missing-family diagnosis, immutable merge, failure retention, duplicate detection, unload verification, aggregate recomputation, and atomic output. Write focused tests first.
      2. For each expected source-family unit, recompute source and prompt hashes, repository, revision, GGUF hash, tokenizer, command, PID evidence, CUDA offload, GPU samples, raw response hash, token counts, latency, stop reason, exit, stderr, charged cost, and failure class without importing shard aggregates.
      3. Confirm the three tasks used identical source units, prompt, seeds, order, and budgets except for the model identity. Confirm each used a fresh process and reached terminal unload or a preserved failure.
      4. Confirm raw rows precede derived parser diagnostics where receipts permit. Preserve all timeout, malformed, refusal, empty, no-claim, and process-failure rows in denominators.
      5. Attack missing family artifacts, legacy substitution, source aliases, prompt drift, duplicate unit IDs, copied outputs across families, selective retries, hidden row drops, null-only rows, stale PIDs, zero-layer offload, missing unload, and readiness contradicted by rows.
      6. Emit one merged row per expected source-family unit and one attack row per invariant. Set all_family_source_audit_ready_score=1.0 only when all eligible rows replay, all families and units are present, failures remain visible, raw paths resolve, unload checks pass, costs recompute, and protected files are unchanged.
      7. If any artifact is missing or blocked, write honest_verdict beginning blocked_ and gate_check_summary with the exact path or failed field and observed value. If the same missing-chain verdict as Exp6577 repeats, activate retirement.
      8. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, row consistency, artifact convention checks, adversarial verification, applicable evidence E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6584_three_family_source_receipt_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The always-run audit closes even when a family is missing."
        honest_verdict:
          principle: "The verdict states lineage, coverage, failure retention, unload, and merge disposition."
        verdict_class:
          principle: "The audit uses null, partial, blocked, or disqualified."
        gate_check_summary:
          principle: "A block names the exact missing artifact or failed field and observed value."
        upstream_artifact_receipts:
          principle: "Path, hash, status, and schema bind every family object under audit."
        rows:
          principle: "Each expected source-family unit carries independently recomputed runtime and evidence metrics."
        family_coverage_rows:
          principle: "The three mandated families and every frozen source unit remain explicit."
        failure_retention_rows:
          principle: "Failure classes cannot vanish from a merged denominator."
        duplicate_drift_and_substitution_rows:
          principle: "Copied output, drift, stale execution, and legacy substitution are tested."
        unload_and_recovery_rows:
          principle: "One family cannot contaminate the next task's evidence."
        all_family_source_audit_ready_score:
          principle: "This exact binary field gates Exp6585."
        aggregate_row_recomputation:
          principle: "Coverage, failures, timing, tokens, and cost derive only from emitted rows."
        preconditions_checked:
          principle: "Input, tool, raw-path, resource, and protected-file receipts are explicit."
        protected_files_unchanged:
          principle: "The audit preserves both protected orchestration files."
        inference_substrate:
          principle: "This is immutable three-family artifact replay with no new LLM."
        verifier_is_oracle:
          principle: "The evidence audit is authority and cannot create positive science."
        field_provenance:
          principle: "Each field identifies source rows, hashes, and independent reducer code."
        duration_s:
          principle: "Monotonic duration exposes skipped replay or attack work."
        tests_run:
          principle: "Named commands, exits, and durations make the audit reproducible."
        reproducibility_checksum:
          principle: "A final hash detects audit mutation."
      Set inference_substrate=immutable_three_family_source_replay_no_llm and verifier_is_oracle=true. A clean audit uses verdict_class=null, never positive.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6584_three_family_source_receipt_audit --date {date}
