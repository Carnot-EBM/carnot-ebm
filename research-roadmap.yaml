    before the paired run. Exp6764 now opens this task only after a real exclusive Qwen3.8 32K load,
    production selfparse call, teardown, and VRAM-recovery receipt. The experiment tests whether
    fetching object rows on demand saves prompt tokens without degrading live change_fidelity. It
    does not target or claim a game-level solve.

