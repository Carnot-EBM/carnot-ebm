- id: exp1188-wopr-hex-game-cartridge
  milestone: 2026.04.92
  deliverable: results/experiment_1188_wopr_hex_game_cartridge.json
  title: "WOPR Hex Game Cartridge — Constraint-Satisfaction Game with Energy-Minimizing Player"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 25
  priority: medium
  requires_gpu: false
  prompt: |
    CONTEXT:
    The WOPR games module (openspec/capabilities/wopr-games/spec.md) defines a framework
    for testing Carnot's EBM reasoning on game-playing domains. Games are ideal because:
    - Constraints are explicit and checkable (no ambiguity about what "correct" means)
    - Winning conditions can be expressed as energy functions
    - Energy minimization = finding the most constrained-satisfying move

    Hex is the ideal first game cartridge:
    - Perfect information, two-player, zero-sum
    - Winning condition = graph connectivity (Black connects top-bottom, White connects left-right)
    - No draws (by Zermelo's theorem, Hex always has a winner)
    - Graph connectivity is a natural SAT constraint: "does a path exist through my pieces?"
    - Carnot's k=5 verifier ensemble can evaluate "does this board position satisfy the
      winning constraints?" directly via energy query

    EXISTING CODE TO READ FIRST:
    - python/carnot/games/__init__.py (if exists; game module structure)
    - python/carnot/games/connect_four.py (if exists; reference game implementation)
    - openspec/capabilities/wopr-games/spec.md (WOPR games spec)

    TASK:
    1. Implement python/carnot/games/hex.py:
       a. HexBoard(n): n×n board, cells are 0 (empty), 1 (Black), 2 (White)
       b. HexGame:
          - reset() → initial_board
          - legal_actions(board) → list[action] where action = (row, col)
          - step(board, action, player) → (new_board, done, winner)
          - check_winner(board) → None | 1 | 2 (uses union-find for connectivity)
       c. Energy function for a position: E(board) = -1 * (path_strength for current player)
          where path_strength = length of longest connected path toward goal
          (approx; exact would require BFS over all connected components)

    2. Implement three players:
       a. RandomPlayer: select uniformly from legal_actions
       b. GreedyEnergyPlayer: select action that minimizes E(board) (greedy, no search)
       c. GibbsEnergyPlayer: use Blocked Gibbs (from python/carnot/samplers/phase4_sampler.py)
          to find the action that minimizes the k=5 AND-composed free energy F(z)

    3. Run 10-game round-robin: Random vs Greedy, Random vs Gibbs, Greedy vs Gibbs
       On a 7×7 board. Record win rates.

    4. Write tests/python/games/test_hex.py:
       - test_hex_legal_moves: verify legal_actions returns correct count
       - test_hex_winner_detection: set up a won position, verify check_winner correct
       - test_hex_no_draws: play 5 complete games, verify all have a winner

    5. Write results artifact.

    CONCRETE STEPS:
    - ls python/carnot/games/ 2>&1
    - cat openspec/capabilities/wopr-games/spec.md 2>&1 | head -60
    - Implement python/carnot/games/hex.py
    - pytest tests/python/games/test_hex.py -v 2>&1 | tail -20
    - JAX_PLATFORMS=cpu python scripts/experiment_1188_wopr_hex_game_cartridge.py 2>&1 | tail -20
    - Write results/experiment_1188_wopr_hex_game_cartridge.json

    REQUIRED ARTIFACT FIELDS:
    - hex_game_operational: bool
    - board_size_n: int (7)
    - n_games_played: int (at least 30 total across all matchups)
    - random_vs_greedy_win_rate: float (greedy win rate vs random)
    - random_vs_gibbs_win_rate: float (gibbs win rate vs random)
    - greedy_vs_gibbs_win_rate: float (gibbs win rate vs greedy)
    - energy_player_beats_random: bool (gibbs win rate vs random > 0.5)
    - tests_pass: bool
    - honest_verdict: "hex_operational_energy_player_wins" | "hex_operational_random_baseline_only" | "hex_failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1188_wopr_hex_game_cartridge.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

