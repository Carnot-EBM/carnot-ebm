- id: exp1191-prlimit-memory-cap-conftest
  milestone: 2026.04.93
  deliverable: results/experiment_1191_prlimit_memory_cap_conftest.json
  title: "prlimit Memory Cap — resource.setrlimit RLIMIT_AS 8GB in conftest.py"
  agent_type: codex
  model: gpt-5.5
  max_turns: 20
  estimated_wall_time_min: 15
  priority: infrastructure
  requires_gpu: false
  prompt: |
    CONTEXT:
    The Carnot test suite has been causing 35GB+ RSS spikes when codex self-heal runs
    the full pytest suite. Six spikes occurred on 2026-05-02 (17:18, 19:33, 20:04, 21:18,
    21:33, 22:48). The exp1178 PytestMemoryWatchdog plugin detects leaks POST-test but
    cannot prevent a single-test catastrophic load (e.g., llama.cpp model load in one shot).

    The fix: set a hard address-space limit in conftest.py using resource.setrlimit
    BEFORE any tests run. This is an OS-level preemptive cap — if any test process
    tries to exceed 8GB virtual address space, it gets SIGSEGV immediately rather than
    saturating swap.

    EXISTING CODE TO READ FIRST:
    - tests/python/conftest.py (existing watchdog plugin wire-in, must NOT break it)
    - python/carnot/testing/pytest_memory_watchdog.py (the watchdog plugin from exp1178)

    TASK:
    1. Read tests/python/conftest.py in full.
    2. Add a pytest_configure hook (or prepend to existing conftest) that calls:
       ```python
       import resource
       import sys

       def pytest_configure(config):
           """Set hard address-space limit to prevent swap saturation from 35GB model loads."""
           limit_bytes = 8 * 1024 ** 3  # 8 GB
           try:
               soft, hard = resource.getrlimit(resource.RLIMIT_AS)
               # Only lower the limit, never raise it above system hard limit
               new_soft = min(limit_bytes, hard) if hard != resource.RLIM_INFINITY else limit_bytes
               resource.setrlimit(resource.RLIMIT_AS, (new_soft, hard))
           except (ValueError, resource.error) as e:
               # On some kernels RLIMIT_AS is not enforceable; log and continue.
               warnings.warn(f"Could not set RLIMIT_AS: {e}", RuntimeWarning)
       ```
    3. Write tests/python/test_prlimit_memory_cap.py with at least 2 tests:
       - test_rlimit_as_is_set: verify resource.getrlimit(RLIMIT_AS)[0] <= 8 * 1024**3
       - test_rlimit_does_not_break_existing_imports: verify `import carnot` still works
    4. Run the new tests:
       pytest tests/python/test_prlimit_memory_cap.py -v 2>&1 | tail -20
    5. Run the existing watchdog tests to verify no regression:
       pytest tests/python/test_memory_watchdog.py -v 2>&1 | tail -20
    6. Write the results artifact.

    CONCRETE STEPS:
    - cat tests/python/conftest.py 2>&1
    - python3 -c "import resource; print(resource.getrlimit(resource.RLIMIT_AS))" 2>&1
    - [Add pytest_configure hook to conftest.py]
    - pytest tests/python/test_prlimit_memory_cap.py -v 2>&1 | tail -20
    - pytest tests/python/test_memory_watchdog.py -v 2>&1 | tail -15
    - Write results/experiment_1191_prlimit_memory_cap_conftest.json

    REQUIRED ARTIFACT FIELDS:
    - rlimit_as_set: bool (True if resource.setrlimit call succeeded)
    - rlimit_as_limit_bytes: int (should be 8589934592 = 8GB)
    - new_tests_pass: bool (both new tests pass)
    - watchdog_tests_still_pass: bool (existing watchdog tests not broken)
    - conftest_hook_type: str ("pytest_configure" or "session-scoped fixture")
    - honest_verdict: "prlimit_active" | "setrlimit_failed_kernel_limitation" | "blocked"

    Run: pytest tests/python/test_prlimit_memory_cap.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1192-llama-cpp-gpu-offload-fix-v2
  milestone: 2026.04.93
  deliverable: results/experiment_1192_llama_cpp_gpu_offload_fix_v2.json
  title: "llama.cpp GPU Offload Fix v2 — Pre-built CUDA Wheel + Throughput Verification"
  agent_type: claude
  model: opus
  max_turns: 50
  estimated_wall_time_min: 40
  priority: critical
  requires_gpu: true
  prior_failures:
    - experiment_id: exp1179-llama-cpp-gpu-offload-fix
      verdict: MISSING
      addressed_by: "exp1179 timed out before producing an artifact; the pip install path from abetlen CUDA wheel takes >60 min. This attempt uses a pre-built binary from the llama-cpp-python GitHub Releases page (direct .whl download, no compilation) with a source-build fallback."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    GRPO v5 (exp1184, exp1195) requires llama.cpp with CUDA GPU offload to run the
    Qwen3.6-35B-A3B-GGUF model at >=50 tok/s. exp1179 produced a MISSING artifact —
    it timed out before completing the install.

    Root cause: the pip install from abetlen CUDA wheel index requires compilation of
    the CUDA extension from source, which takes 45-90 min on the research machine.
    This attempt downloads a pre-compiled binary wheel from the GitHub Releases page
    (https://github.com/abetlen/llama-cpp-python/releases) matching CUDA 12.x.

    This is a one-time infrastructure fix. Once llama.cpp is rebuilt with CUDA support,
    ALL subsequent GRPO experiments run at GPU speed.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1179_llama_cpp_gpu_offload_fix.json (MISSING — no artifact)
    - results/experiment_1184_grpo_v5_tinyv_v2_dualGPU.json (confirms root cause: llama_cpp_gpu_offload=false)
    - python/carnot/inference/diffusion_of_thought_v2.py (uses llama_cpp if present)

    TASK:
    1. Determine current CUDA version:
       nvidia-smi | grep "CUDA Version" 2>&1
       python3 -c "import torch; print(torch.version.cuda)" 2>&1

    2. Check if a pre-built CUDA wheel is already available on the machine:
       find ~/.cache/pip -name "llama_cpp_python*cu*.whl" 2>/dev/null | head -5
       python3 -c "from llama_cpp import llama_cpp; print(llama_cpp.llama_supports_gpu_offload())" 2>&1

    3. Download the pre-built CUDA 12.x wheel from GitHub Releases:
       - URL pattern: https://github.com/abetlen/llama-cpp-python/releases/download/v{VER}/llama_cpp_python-{VER}-cp{PY}-cp{PY}-linux_x86_64.whl
       - Find latest release version: curl -s https://api.github.com/repos/abetlen/llama-cpp-python/releases/latest | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['tag_name'])" 2>&1
       - Download the cublas/CUDA 12 wheel asset from that release
       - pip install the downloaded .whl

    4. Fallback if download fails: build from source with LLAMA_CUDA=1:
       CMAKE_ARGS="-DGGML_CUDA=on" pip install llama-cpp-python --upgrade --force-reinstall --no-cache-dir 2>&1 | tail -30

    5. Verify GPU offload works:
       python3 -c "
       from llama_cpp import llama_cpp
       print('gpu_offload_supported:', llama_cpp.llama_supports_gpu_offload())
       " 2>&1

    6. Find any available GGUF and test throughput:
       python3 -c "
       import glob, time
       from llama_cpp import Llama
       ggufs = sorted(glob.glob('/home/**/*.gguf', recursive=True) + glob.glob('/root/**/*.gguf', recursive=True))
       if not ggufs:
           print('NO GGUF FOUND — install a small model first')
           exit(1)
       m = Llama(ggufs[0], n_gpu_layers=10, verbose=False)
       t0 = time.time()
       out = m('Hello world, what is 2+2?', max_tokens=20)
       dt = time.time() - t0
       toks = out['usage']['completion_tokens']
       print(f'throughput={toks/dt:.1f} tok/s  n_gpu_layers=10  model={ggufs[0]}')
       " 2>&1

    7. Write results artifact.

    CONCRETE STEPS:
    - nvidia-smi | grep "CUDA Version" 2>&1
    - python3 -c "import torch; print(torch.version.cuda)" 2>&1
    - python3 -c "from llama_cpp import llama_cpp; print(llama_cpp.llama_supports_gpu_offload())" 2>&1
    - curl -s https://api.github.com/repos/abetlen/llama-cpp-python/releases/latest 2>&1 | python3 -c "import sys,json; r=json.load(sys.stdin); [print(a['browser_download_url']) for a in r.get('assets',[]) if 'cu' in a['name'].lower() and 'linux' in a['name'].lower()]" 2>&1
    - [Download and install pre-built CUDA wheel OR fall back to source build]
    - [Verify GPU offload + throughput test]
    - Write results/experiment_1192_llama_cpp_gpu_offload_fix_v2.json

    REQUIRED ARTIFACT FIELDS:
    - llama_cpp_version: str
    - cuda_version_detected: str (e.g., "12.4")
    - cuda_support_compiled: bool
    - install_method: str ("pre-built-wheel" | "source-cmake-cuda" | "already-installed")
    - llama_supports_gpu_offload: bool
    - test_model_path: str (path to GGUF used for throughput test)
    - n_gpu_layers_tested: int
    - throughput_tokens_per_sec: float (must be >= 50.0 to pass)
    - llama_cpp_gpu_offload_verified: bool (True iff cuda_support_compiled AND throughput >= 50.0)
    - grpo_v5_unblocked: bool (same as llama_cpp_gpu_offload_verified)
    - honest_verdict: "gpu_offload_verified" | "partial_offload_cpu_fallback" | "gpu_offload_failed"

    Run: python3 -c "from llama_cpp import llama_cpp; print(llama_cpp.llama_supports_gpu_offload())"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

