      TASK
      Independently audit the complete V553 CSL chain. Do not import upstream aggregate or readiness functions. Read per-unit rows and derive every count, rate, delta, confidence interval, capacity frontier point, interference result, held effect, retention result, and cost. Attack evidence freshness, causal order, memory authority, restart persistence, and claim pooling.

      CONCRETE STEPS
      0. Hash every expected upstream artifact, row file, manifest, raw output, source, test, checker, receipt, memory head, and determination record. Record CPU, RAM, disk, missing inputs, and current repository state.
      1. Classify every expected input as present, missing, skipped, blocked, null, flagged, underpowered, or eligible. Never treat missing rows as zeros or drop them from denominators.
      2. Verify manifest pre-absence receipts, unique event IDs, unique raw-output hashes across event IDs, prompt and model bindings, causal proposal-before-outcome order, head transitions, exact feedback, capacity enforcement, and held-policy freeze.
      3. Build an independent reducer that does not import Exp6430, Exp6431, or Exp6432 aggregate code. Derive development, capacity, interference, and held metrics from per-unit rows.
