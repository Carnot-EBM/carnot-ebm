- id: exp824-jepa-v23-limo-corpus
  milestone: 2026.04.63
  deliverable: results/experiment_824_jepa_v23_limo_corpus.json
  title: 'Exp 824: JEPA v23 LIMO Curated Corpus (RETRO-JEPA-OOD, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA has failed to reach OOD AUC >= 0.75 in 11 consecutive retrains (Exps v13-v22).
    Root cause analysis from .62 retro:
    1. Training corpus too large and noisy: 300 FoVer pairs + 750 CPMI triples = 1050 items with
       uneven quality. LIMO (2024, arXiv 2402.09353) showed 817 carefully curated examples beat
       100k random examples for LLM reasoning. Same principle applies here.
    2. Single-domain training (GSM8K × Qwen3.5-0.8B only). OOD holdout tests different domains.
    3. Binary BCE loss may be insufficient: triplet contrastive loss forces the model to learn
       relative ordering (anchor, positive, hard-negative) rather than just binary labels.
    Fix: LIMO-style curation (top-50 highest-quality pairs by Z3-confidence × CPMI score) +
    domain diversity (add HumanEval + SVAMP pairs) + contrastive triplet loss architecture.
    CPU-only experiment — no GPU required for this training scale.

    EXISTING CODE TO READ FIRST:
    - results/experiment_809_jepa_v22_rapbm.json — current v22 ood_auc=0.5 baseline
    - python/carnot/inference/jepa_reasoner_probe.py — JEPAReasonerProbe model architecture
    - python/carnot/pipeline/fover_annotator.py — FoVer annotation infrastructure
    - results/experiment_798_cpmi_pairs_triples.json — CPMI corpus statistics
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN entries

    TASK: Curate top-70 high-quality training pairs (LIMO principle), train JEPA v23 with
    contrastive triplet loss, evaluate OOD, write results/experiment_824_jepa_v23_limo_corpus.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/autoresearch/spec.md:
       - REQ-LEARN-048: JEPA training corpus MUST be curated using LIMO principle: select
         top-50 pairs by Z3-verification confidence × CPMI contrastive score from the full
         FoVer + CPMI corpus. Random or all-pairs training is prohibited after milestone .62.
       - REQ-LEARN-049: JEPA training corpus MUST include domain diversity: >= 10 HumanEval
         code reasoning pairs and >= 10 SVAMP arithmetic pairs to reduce single-domain overfitting.
       - REQ-LEARN-050: JEPA v23+ MUST use contrastive triplet loss with hard negatives from
         CPMI triples. Binary BCE loss is deprecated after 11 consecutive retrain failures.
       - SCENARIO-LEARN-060: LIMO curation selects 50 GSM8K + 10 HumanEval + 10 SVAMP pairs.
         Triplet training for 100 epochs. OOD AUC evaluated on fover_labeled_steps_live.json.
    3. Implement LIMO curation in python/carnot/pipeline/limo_curator.py:
       a. LIMOCurator(fover_path, cpmi_path, z3_confidence_threshold=0.9):
          - load_fover_pairs() → list of (prefix, correct_step, incorrect_step, z3_confidence)
          - load_cpmi_triples() → list of (anchor, positive, negative, cpmi_score)
          - score_pairs(pairs) → sorted by z3_confidence × cpmi_score descending
          - select_top_k(k=50) → top-k scored pairs
       b. LIMOCurator.add_domain_pairs(humaneval_n=10, svamp_n=10):
          - Generate synthetic HumanEval pairs: 10 simple Python function tasks with Z3 stub check.
          - Generate SVAMP pairs: 10 arithmetic word problems with Z3-verifiable solutions.
          - Return combined corpus: top-50 + 10 HumanEval + 10 SVAMP = 70 pairs.
    4. Implement contrastive triplet architecture in python/carnot/inference/jepa_v23.py:
       a. JEPAv23Predictor: 2-layer transformer encoder (dim=64, 2 heads, 2 layers) + MLP head.
       b. TripletLoss(margin=0.5): L = max(0, d(a, p) - d(a, n) + margin)
          where d = cosine distance in embedding space.
       c. train_v23(triples, epochs=100, lr=1e-3, seed=42):
          - Convert curated pairs to triplets: (prefix, correct_step, cpmi_hard_negative).
          - Train with AdamW, batch_size=8.
          - Log train loss per epoch.
          - Return: model, train_losses, final_epoch_loss.
       d. evaluate_v23(model, holdout_path) -> (in_dist_auc, ood_auc):
          - Load holdout from results/fover_labeled_steps_live.json or generate synthetic.
          - Compute per-step energies. Return AUC scores.
    5. Create scripts/experiment_824_jepa_v23_limo_corpus.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(824) + ExperimentTimeoutWatchdog(824, timeout_minutes=60).
       c. Instantiate LIMOCurator — curate 70-pair corpus. Log: n_gsm8k, n_humaneval, n_svamp.
       d. Train JEPA v23: train_v23(triples=curated_triples, epochs=100, seed=42).
          Checkpoint every 25 epochs.
       e. Evaluate: in_dist_auc, ood_auc = evaluate_v23(model, holdout_path).
       f. Save model to results/jepa_v23_limo_model.pkl.
       g. Artifact fields: n_training_pairs, n_gsm8k, n_humaneval, n_svamp, epochs=100,
          final_loss, in_dist_auc, ood_auc, honest_verdict.
       h. honest_verdict:
          - "jepa_v23_viable" if ood_auc >= 0.65
          - "jepa_v23_improvement" if 0.50 <= ood_auc < 0.65
          - "jepa_v23_below_random" if ood_auc < 0.50
    6. Write tests/python/test_experiment_824_jepa_v23_limo_corpus.py with 100% coverage:
       - test LIMOCurator.score_pairs sorts by z3_confidence × cpmi_score descending
       - test LIMOCurator.select_top_k returns exactly k pairs
       - test TripletLoss is zero when d(a,p) < d(a,n) - margin
       - test JEPAv23Predictor forward pass shape correct
       Each test traces to REQ-LEARN-048/049/050.
    7. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict and ood_auc.
       - ops/status.md: "Exp 824: JEPA v23 OOD AUC=<value>. RETRO-JEPA-OOD: <status>."
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_824_jepa_v23_limo_corpus.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

