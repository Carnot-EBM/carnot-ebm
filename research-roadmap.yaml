- id: exp2476-kan-lipschitz-regularization
  title: 'Phase 2: KAN Lipschitz Regularization + Recertification -- Address certified_coverage=0.0 Finding'
  milestone: 2026.05.239
  deliverable: results/experiment_2476_kan_lipschitz.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2467-kan-formal-verification-bounds
    verdict: 'complete: with certified_coverage.'
    addressed_by: 'exp2467 (.238) measured KAN formal bounds WITHOUT any regularization and found certified_coverage=0.0 (mean_local_lipschitz=39.5).
      The KAN amplifies input perturbations by 39.5x on average. exp2476 adds a Lipschitz penalty to KAN training: add L_lip
      = max(0, ||gradient||_F - L_target) loss term with L_target=5.0, retrain the KAN, then re-evaluate certified coverage.
      Per arXiv:2601.18513 (LipNeXt, Jan 2026), Lipschitz-constrained training reduces sensitivity. Fundamentally different:
      measuring unregularized KAN vs training a regularized KAN.'
    retire_if_same_verdict: true
  prompt: "CONTEXT: exp2467 (.238) found KAN (AUROC=0.994) has certified_coverage=0.0:\nmean_local_lipschitz=39.5 means the\
    \ KAN changes output by 39.5x more than input changes.\nThis blocks certified deployment: any input perturbation of \xB1\
    0.1 causes output swings of \xB13.95,\nmaking certified predictions impossible under \xB10.1 input bounds.\n\narXiv:2601.18513\
    \ (LipNeXt, Jan 2026): Lipschitz-bounded training via spectral\nnormalization reduces local Lipschitz constant while preserving\
    \ high AUROC.\nTarget: reduce mean_local_lipschitz from 39.5 to < 5, enabling certified_coverage > 0.\n\nEXISTING CODE\
    \ TO READ FIRST:\n  {project_root}/python/carnot/models/kan.py (KAN implementation)\n  {project_root}/results/experiment_2467_kan_formal_verification.json\
    \ (baseline \u2014 certified_coverage=0.0)\n\nTASK: Add Lipschitz regularization to KAN training; retrain; re-evaluate\
    \ certified coverage.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. numpy importable: {project_root}/.venv/bin/python\
    \ -c \"import numpy; print(numpy.__version__)\"\n     b. KAN model:\n        ls {project_root}/python/carnot/models/kan.py\n\
    \        If missing: write honest_verdict blocked_kan_model_missing and exit.\n     c. Telemetry manifest:\n        ls\
    \ {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n        If missing: write honest_verdict blocked_telemetry_manifest_missing\
    \ and exit.\n\n  1. Read KAN model class. Find the training/optimization loop.\n     Add Lipschitz regularization term\
    \ to the loss function:\n       # Penalty: pushes local gradient norms toward L_target=5.0\n       L_target = 5.0\n  \
    \     def compute_lipschitz_penalty(model, x_batch, delta=0.01):\n         perturbed = x_batch + delta * np.sign(np.random.randn(*x_batch.shape))\n\
    \         diff = model(perturbed) - model(x_batch)\n         local_lip = np.abs(diff) / delta  # per-example Lipschitz\n\
    \         penalty = np.maximum(0, local_lip - L_target).mean()\n         return penalty\n       total_loss = energy_loss\
    \ + 0.1 * compute_lipschitz_penalty(model, x_batch)\n\n  2. Retrain KAN with Lipschitz penalty on 36 telemetry examples:\n\
    \     Train for 100 epochs with penalty enabled.\n     Record: training_loss_final, lipschitz_penalty_final.\n\n  3. Re-evaluate\
    \ certified bounds (same protocol as exp2467):\n     For each of 20 telemetry entries:\n       base_energy = KAN(logprobs_i)\n\
    \       10 perturbed versions with \xB10.1 perturbation\n       stays_certified = all on same side of threshold as base_energy\n\
    \       local_lipschitz_i = energy_range / 0.1\n     new_certified_coverage = fraction of 20 where stays_certified=True\n\
    \     new_mean_local_lipschitz = mean(local_lipschitz_i)\n     new_kan_auroc = AUROC of retrained KAN on 20 entries\n\n\
    \  4. Compare:\n     lipschitz_improvement = new_mean_local_lipschitz < 39.5\n     coverage_improvement = new_certified_coverage\
    \ > 0.0\n     auroc_preserved = new_kan_auroc > 0.80 (should stay high)\n\n  5. Write deliverable. Validate JSON before\
    \ writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with\
    \ new_certified_coverage.\"\n  - new_certified_coverage:\n      principle: \"Fraction of 20 examples certifiably stable.\
    \ > 0.0 = improvement over exp2467 baseline.\"\n  - new_mean_local_lipschitz:\n      principle: \"Mean local Lipschitz\
    \ after regularization. Target < 5.0.\"\n  - lipschitz_improvement:\n      principle: \"True if new < 39.5 (exp2467 baseline).\
    \ Documents regularization effect.\"\n  - coverage_improvement:\n      principle: \"True if new_certified_coverage > 0.0.\
    \ Core goal of this experiment.\"\n  - new_kan_auroc:\n      principle: \"AUROC of regularized KAN. Must stay > 0.80 to\
    \ preserve verifier quality.\"\n  - l_target_used:\n      principle: \"The Lipschitz target used (5.0). Documents regularization\
    \ strength.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n      principle: \"Guards against\
    \ fabrication.\"\n  - preconditions_checked:\n      principle: \"Records numpy, KAN model, telemetry checks.\"\n\nACCEPTANCE\
    \ GATES:\n  - condition: \"new_certified_coverage != null AND new_kan_auroc != null\"\n    principle: \"Must produce both\
    \ coverage and AUROC \u2014 even if coverage stays 0, documents Lipschitz effect.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."
