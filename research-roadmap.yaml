  - id: exp3027-adversarial-flag-methodology-corrigendum
    milestone: "2026.05.284"
    deliverable: "results/experiment_3027_adversarial_flag_methodology_corrigendum_v1.json"
    title: "Adversarial flag methodology corrigendum"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 30
    track: "methodology"
    inference_substrate: "aggregation"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3016-sota-repair-rerun-with-acceptance-controller
        verdict: "complete: acceptance-controlled SOTA repair rerun gates passed"
        addressed_by: "Separates clean repair deltas from adversarial methodology flags by replaying source provenance, duration, model_specs, seeds, checksums, and transcript hashes before any new repair promotion."
        retire_if_same_verdict: true
      - experiment_id: exp3018-beaver-style-validator-frontier-certificate
        verdict: "complete: validator frontier certificate ready with explicit unresolved bounds"
        addressed_by: "Classifies unresolved frontier rows into verified, unresolved, fallback-only, and methodology-missing bins before matrix promotion."
        retire_if_same_verdict: true
      - experiment_id: exp3025-capstone-v283
        verdict: "complete: capstone_ready=true; paper_ready=false; repaired=3; flagged=29; blocked=10; gated_skipped=3; missing=1; next=2026.05.284 repair-corrigendum-and-gatemate-output-contract"
        addressed_by: "Directly targets the capstone's paper_ready=false blockers with a corrigendum manifest instead of rerunning experiments blindly."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. The .283 capstone is not paper-ready even though several upstream experiments completed. This task is a methodology and adversarial-flag corrigendum. It must not run live LLM inference and must not rewrite historical artifacts.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-references.md
      - results/experiment_3013_sota_gguf_logprob_telemetry_preflight_v1.json
      - results/experiment_3014_repair_syntax_schema_failure_taxonomy_v1.json
      - results/experiment_3015_cactus_style_repair_acceptance_controller_v1.json
      - results/experiment_3016_sota_repair_rerun_with_acceptance_controller_v1.json
      - results/experiment_3018_beaver_style_validator_frontier_certificate_v1.json
      - results/experiment_3024_cross_corpus_matrix_v17.json
      - results/experiment_3025_capstone_v283.json
      - ops/changelog.md
      - ops/conductor-log.md

      TASK
      Produce a corrigendum manifest that explains which .283 adversarial flags are true blockers, which are false positives caused by aggregation/substrate schema mismatch, and which require a live rerun. Use MARCH-style information asymmetry as an audit principle: do not let the same evidence source grade itself.

      CONCRETE STEPS
      1. Load .283 repair, validator, matrix, capstone, and exp3013 SOTA preflight artifacts and collect all fields related to duration, model_specs, inference_substrate, transcript hashes, seeds, checksums, adversarial flags, SOTA headline readiness, and paper readiness.
      2. Classify every relevant flagged row into: true_methodology_blocker, aggregation_false_positive, missing_metadata, unresolved_bound, hardware_blocked, or clean_but_not_headline.
      3. For each row, cite the source artifact path and the exact field that supports the classification.
      4. Decide whether exp3028 needs live rerun or can reconstruct clean evidence from existing transcripts. Be conservative: if any required live transcript, model spec, seed, or checksum is missing, require rerun.
      5. Write a corrigendum manifest and set methodology_corrigendum_ready=true only if the next tasks can mechanically gate on it.

      REQUIRED ARTIFACT FIELDS:
      - methodology_corrigendum_ready: bool (principle: downstream reruns must gate on a completed diagnosis)
      - sota_headline_ready: bool (principle: live repair tasks must gate on same-roadmap SOTA readiness carry-forward)
      - repair_rerun_required: bool (principle: live compute should run only when reconstruction is insufficient)
      - flagged_rows_reviewed: int (principle: all flagged rows must be counted)
      - true_methodology_blockers: list (principle: real blockers must remain visible)
      - aggregation_false_positive_rows: list (principle: aggregation-only mistakes must not poison live claims)
      - missing_metadata_rows: list (principle: provenance gaps must be explicit)
      - unresolved_bound_rows: list (principle: frontier uncertainty must not be flattened)
      - source_artifacts: list (principle: every corrigendum claim must trace to a source)
      - inference_substrate: dict (principle: aggregation artifacts must declare aggregation and must not include top-level live model metadata)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3028-sota-repair-clean-methodology-rerun-v2
    milestone: "2026.05.284"
    deliverable: "results/experiment_3028_sota_repair_clean_methodology_rerun_v2.json"
    title: "SOTA repair clean-methodology rerun v2"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 90
    track: "code_repair"
    inference_substrate: "local_sota_gguf"
    requires_gpu: true
    gated_on:
      - upstream: exp3027-adversarial-flag-methodology-corrigendum
        artifact_field: methodology_corrigendum_ready
        op: "=="
        value: true
      - upstream: exp3027-adversarial-flag-methodology-corrigendum
        artifact_field: sota_headline_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3016-sota-repair-rerun-with-acceptance-controller
        verdict: "complete: acceptance-controlled SOTA repair rerun gates passed"
        addressed_by: "Repeats the positive repair row only after methodology corrigendum, requiring clean metadata, independent checker inputs, exact model specs, seeds, checksums, and transcript hashes."
        retire_if_same_verdict: true
      - experiment_id: exp3003-gated-sota-repair-metamorphic-false-accept-rerun
        verdict: "flagged: metamorphic repair rerun did not clear gates"
        addressed_by: "Uses the exp3015 acceptance controller and exp3027 corrigendum to prevent syntax/schema and false-accept regressions before promotion."
        retire_if_same_verdict: true
      - experiment_id: exp2991-gated-sota-intent-preserving-repair-hard-set
        verdict: "flagged: hard-set repair did not clear promotion gates"
        addressed_by: "Adds draft-intent preservation and information-asymmetric checking rather than relying on pass-rate improvement alone."
        retire_if_same_verdict: true
      - experiment_id: exp2977-sota-intent-preserving-code-repair
        verdict: "blocked/flagged: SOTA repair evidence lacked clean promotion boundary"
        addressed_by: "Requires mandated headline GGUF use and full reproducibility metadata before any clean_repair_claim_promotable=true."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. This task is the clean-methodology successor to exp3016. It may either reconstruct clean evidence from existing live transcripts if exp3027 proves all required metadata exists, or run a small live rerun. Do not use legacy small models as headline evidence.

      MODEL_SPECS
      Headline SOTA local GGUF candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      At least one headline model must be used for any live repair generation. Legacy models such as Qwen3.5-0.8B or gemma-4-E4B-it are allowed only as CPU smoke tests and must be marked legacy_smoke_only=true when used.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3013_sota_gguf_logprob_telemetry_preflight_v1.json
      - results/experiment_3014_repair_syntax_schema_failure_taxonomy_v1.json
      - results/experiment_3015_cactus_style_repair_acceptance_controller_v1.json
      - results/experiment_3016_sota_repair_rerun_with_acceptance_controller_v1.json
      - results/experiment_3027_adversarial_flag_methodology_corrigendum_v1.json
      - datasets/repair_hard/manifest_v1.jsonl if present
      - scripts/experiment_3003_gated_sota_repair_metamorphic_false_accept_rerun_v1.py if present

      TASK
      Produce clean SOTA repair evidence with all methodology fields required by the capstone. Use MARCH-style information asymmetry: generate/collect repair candidates separately from the checker that validates intent, syntax/schema, metamorphic behavior, false accepts, and tautology probes.

      CONCRETE STEPS
      0. PRECONDITIONS: record CUDA/GPU availability, free VRAM, repo commit, Python environment, GGUF cache paths, model checksum feasibility, and exp3027 repair_rerun_required before any model load. If no headline model can load and no complete transcript reconstruction is possible, write blocked_sota_headline_model_unavailable and stop.
      1. Load exp3027 and determine whether reconstruction from exp3016 transcripts is sufficient. If not, run a minimal live panel using at least one mandated headline GGUF and the cached_sota_pair() pattern where applicable.
      2. Preserve unconstrained draft intent, failing trace, candidate patch, final patch, validator output, duration, transcript hash, random_seed, reproducibility_checksum, and model_specs for every task.
      3. Apply the exp3015 acceptance controller and compute pass_at_1_delta, pass_at_k_delta, syntax_failure_rate_delta, schema_failure_rate_delta, false_accept_delta, tautology_gate_clean, and intent_drift_count.
      4. Reject any candidate whose pass-rate gain comes from schema drift, syntax drift, false accepts, tautology exposure, or missing checker evidence.
      5. Set clean_repair_rerun_ready=true only if the row is clean enough for exp3029 to make a promotion decision.

      REQUIRED ARTIFACT FIELDS:
      - clean_repair_rerun_ready: bool (principle: downstream promotion must gate on machine-checkable repair cleanliness)
      - repair_controller_clean: bool (principle: acceptance must be independently gated)
      - clean_repair_claim_promotable_candidate: bool (principle: candidate promotion must be separated from final capstone promotion)
      - n_tasks: int (principle: sample size must be explicit)
      - n_live_transcripts: int (principle: live evidence must not be confused with reconstruction)
      - model_specs: list (principle: every live LLM task must name the headline GGUF models actually used)
      - legacy_smoke_only_used: bool (principle: smoke tests cannot become headline evidence)
      - pass_at_1_delta: float (principle: repair gain must be measured)
      - pass_at_k_delta: float (principle: repair gain must include candidate breadth)
      - syntax_failure_rate_delta: float (principle: repair must not trade correctness for parse failures)
      - schema_failure_rate_delta: float (principle: repair must not trade correctness for schema failures)
      - false_accept_delta: float (principle: repair must not increase unsafe acceptance)
      - tautology_gate_clean: bool (principle: tautology checks must be non-vacuous)
      - intent_drift_count: int (principle: structured validity must preserve user intent)
      - reproducibility_checksum: str (principle: reruns must be auditable)
      - inference_substrate: dict (principle: live local GGUF evidence must declare hardware, runtime, and model cache)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3029-repair-promotion-boundary-audit-v2
    milestone: "2026.05.284"
    deliverable: "results/experiment_3029_repair_promotion_boundary_audit_v2.json"
    title: "Repair promotion boundary audit v2"
    priority: high
    max_turns: 40
    estimated_wall_time_min: 25
    track: "code_repair"
    inference_substrate: "aggregation"
    requires_gpu: false
    gated_on:
      - upstream: exp3028-sota-repair-clean-methodology-rerun-v2
        artifact_field: clean_repair_rerun_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3016-sota-repair-rerun-with-acceptance-controller
        verdict: "complete: acceptance-controlled SOTA repair rerun gates passed"
        addressed_by: "Makes the promotion boundary explicit after clean-methodology rerun instead of treating passed local gates as paper-ready evidence."
        retire_if_same_verdict: true
      - experiment_id: exp3025-capstone-v283
        verdict: "complete: capstone_ready=true; paper_ready=false; repaired=3; flagged=29; blocked=10; gated_skipped=3; missing=1; next=2026.05.284 repair-corrigendum-and-gatemate-output-contract"
        addressed_by: "Translates capstone paper_ready=false into a concrete repair-claim boundary table."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Exp3028 has produced clean-methodology repair evidence or this task will be gate-skipped. This is aggregation-only and must not run live LLM inference.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3027_adversarial_flag_methodology_corrigendum_v1.json
      - results/experiment_3028_sota_repair_clean_methodology_rerun_v2.json
      - results/experiment_3016_sota_repair_rerun_with_acceptance_controller_v1.json
      - results/experiment_3024_cross_corpus_matrix_v17.json
      - results/experiment_3025_capstone_v283.json

      TASK
      Decide whether the repair claim is promotable, bounded, or retired. The deliverable is a claim-boundary table that distinguishes clean evidence from unsupported headline language.

      CONCRETE STEPS
      1. Load exp3027 and exp3028, plus the .283 matrix/capstone rows.
      2. Build a table with each proposed repair claim, required support fields, observed support fields, blockers, and allowed wording.
      3. Mark claims as promotable only if they have clean deltas, clean metadata, non-vacuous tautology gates, no false-accept increase, and enough live/reconstructed evidence.
      4. If the evidence is still incomplete, set repair_claim_status to bounded or retired and explain exactly what would be needed in a future milestone.
      5. Keep source model details under cited_upstream_artifacts only; this artifact is aggregation-only.

      REQUIRED ARTIFACT FIELDS:
      - repair_promotion_boundary_ready: bool (principle: matrix/capstone need a machine-readable promotion decision)
      - repair_claim_status: str (principle: clean, bounded, blocked, and retired claims must be distinct)
      - promotable_claims: list (principle: only supported claims should be promoted)
      - bounded_claims: list (principle: partial evidence must be bounded in wording)
      - retired_or_blocked_claims: list (principle: failed reruns must stop recurring)
      - cited_upstream_artifacts: list (principle: aggregation must preserve source traceability)
      - inference_substrate: dict (principle: aggregation artifacts must not include top-level live model metadata)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3030-validator-frontier-corrigendum-v2
