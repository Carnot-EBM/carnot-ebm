- id: exp674-ias-adaptive-gate
  milestone: 2026.04.51
  deliverable: results/experiment_674_ias_adaptive_gate.json
  title: 'Exp 674: IAS Adaptive Gate Calibration — Quantile Regression for Verification Thresholds (arXiv 2506.09338)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The EnsembleGate has used a fixed threshold=0.30 across multiple milestones.
    This fixed threshold failed in .50 (gate_closed despite causal_recall=0.36 locally) because
    recall estimates from different extractors have different variance distributions — a fixed
    single threshold ignores this heterogeneity.

    arXiv 2506.09338 (IAS: Instance-Adaptive Scaling) shows that quantile regression calibration
    aligns confidence estimates with true success probabilities, enabling ADAPTIVE thresholds
    that respect per-extractor variance. Applied to Carnot: train quantile regression heads on
    FOVER pairs for each extractor (symcode, structured, causal), use the 10th-percentile recall
    as the adaptive gate threshold. High-variance extractors get a lower effective threshold;
    low-variance extractors get a higher one.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/ensemble_gate_v4.py — EnsembleGateV4 (Exp 667).
    - results/fover_labeled_steps_live.json — 57 live FOVER pairs.
    - results/experiment_655_ensemble_gate_v3.json — .50 recall values for calibration.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Implement IAS quantile regression calibration for gate thresholds.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-151 (IAS adaptive gate uses per-extractor quantile regression calibration),
       REQ-VERIFY-152 (IAS adaptive threshold is set at 10th percentile of extractor recall distribution),
       SCENARIO-VERIFY-200/201 to spec.md.
    3. Create python/carnot/pipeline/ias_gate_calibration.py:
       a. QuantileRegressionHead: simple JAX linear model fitting
          pinball loss L_q(y, yhat) = q*(y-yhat) if y>yhat else (q-1)*(y-yhat).
          train(observations: list[float], quantile: float = 0.10) -> float:
            returns the q-th quantile of the observation distribution.
       b. IASGateCalibration dataclass: symcode_threshold (float), structured_threshold (float),
          causal_threshold (float), calibrated_from_n (int).
       c. calibrate(fover_pairs_path: str) -> IASGateCalibration:
          - Load FOVER pairs.
          - For each extractor: compute recall on each pair → distribution of recall values.
          - Fit QuantileRegressionHead at q=0.10 for each extractor.
          - Return thresholds as IASGateCalibration.
       d. adaptive_gate_open(calibration: IASGateCalibration,
                              symcode: float, structured: float, causal: float) -> bool:
          'Gate opens if any extractor exceeds its calibrated threshold.'
          return (symcode >= calibration.symcode_threshold
                  OR structured >= calibration.structured_threshold
                  OR causal >= calibration.causal_threshold)
    4. Create scripts/experiment_674_ias_adaptive_gate.py:
       a. ExperimentTemplate(674) + ExperimentTimeoutWatchdog(674, timeout_minutes=20).
       b. Calibrate gate from results/fover_labeled_steps_live.json.
       c. Apply to .50 recall values: symcode=0.12, structured=0.20, causal=0.36.
       d. Compute: ias_gate_open (True/False), compare to v3 gate (False) and v4 gate (True).
       e. Record: calibrated_thresholds, ias_gate_open, comparison_to_v3, comparison_to_v4.
       f. honest_verdict: "ias_gate_improves_v3" if ias_gate_open=True and v3=False,
          "ias_gate_matches_v4" if same as v4, "ias_gate_no_change" otherwise.
    5. Write tests/python/test_ias_gate_calibration.py with 100% module coverage.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp675-losnet-sequence-detector
  milestone: 2026.04.51
  deliverable: results/experiment_675_losnet_detector.json
  title: 'Exp 675: LOS-Net Sequence Distribution Hallucination Detector — Tier 0h Candidate (arXiv 2503.14043)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2503.14043 (LOS-Net) shows that the FULL sequence of next-token
    distributions — not just individual token entropy — carries far more hallucination signal
    than single-token measures. Carnot's Tier 0b (SpilledEnergyDetector) uses per-token
    logit discrepancy. LOS-Net's sequence-level attention over the distribution trajectory
    provides an orthogonal, stronger signal.

    Key insight: the logit distribution at token t contains information about how UNCERTAIN
    the model is GLOBALLY, not just at that token. A sequence of low-entropy → high-entropy →
    low-entropy distributions signals a "garden path" hallucination pattern where the model
    commits to a wrong path then doubles down.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/spilled_energy_detector.py — SpilledEnergyDetector (Tier 0b).
    - results/fover_labeled_steps_live.json — 57 live FOVER pairs for training.
    - results/live_pairs_578.json — 100 live pairs (larger training set if available).
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Implement lightweight LOS-Net attention model over token distribution sequences.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-153 (LOS-Net: sequence-level hallucination detector over full output
       distribution, < 5M params), REQ-VERIFY-154 (LOS-Net: AUC >= 0.75 on FOVER live pairs),
       SCENARIO-VERIFY-202/203/204 to spec.md.
    3. Create python/carnot/pipeline/losnet_detector.py:
       a. Observation: given only token logit distributions (top-K probabilities per step),
          not actual model weights or hidden states.
       b. LOSNetFeatures dataclass: top_k_probs (list[list[float]]), n_steps (int),
          sequence_entropy (list[float]), entropy_variance (float), entropy_trend (float).
       c. extract_losnet_features(logit_sequences: list[list[float]], top_k: int = 10) ->
          LOSNetFeatures:
          - logit_sequences: shape (n_steps, vocab_size) or (n_steps, top_k) pre-filtered.
          - Compute per-step entropy: H_t = -sum(p * log(p)).
          - Compute entropy_variance = var(H).
          - Compute entropy_trend = linear fit slope of H over time.
          - Return LOSNetFeatures.
       d. LOSNetClassifier: small JAX MLP:
          __init__(self, n_features: int = 3):  # [entropy_variance, entropy_trend, max_entropy]
          train(self, positive_features, negative_features) -> None:
          score(self, features: LOSNetFeatures) -> float:  # probability of hallucination
       e. build_losnet_artifact(auc, vs_spilled_energy_auc, n_train_pairs) -> dict.
    4. Create scripts/experiment_675_losnet_detector.py:
       a. ExperimentTemplate(675) + ExperimentTimeoutWatchdog(675, timeout_minutes=30).
       b. Load FOVER live pairs (results/fover_labeled_steps_live.json).
       c. For each pair: extract_losnet_features() from stored logit sequences if available,
          OR use synthetic distribution sequences (step entropy derived from stored responses).
       d. Train LOSNetClassifier on 80% of pairs, evaluate on 20% held-out.
       e. Compute AUC vs SpilledEnergyDetector baseline on same pairs.
       f. honest_verdict: "tier0h_viable" if auc >= 0.75, "below_threshold" if < 0.75.
       g. If tier0h_viable: add to _bmad/architecture.md as Tier 0h candidate.
    5. Write tests/python/test_losnet_detector.py with 100% module coverage.
    6. tmpl.assert_deliverable_written() as final line.

