  - id: exp4175-headroom-gate-executable-census
    milestone: 2026.06.387
    title: "PHASE A1 — Headroom gate + executable-oracle corpus census. Build reusable scripts/headroom_gate.py: for each cached candidate pool compute oracle@k vs baseline pass@1 vs SC-vote with an OBJECTIVE/EXECUTABLE oracle (run code/tests, parse math — NO LLM judge, per arXiv:2605.07395), and flag artifact inflation (truncation/format mismatch). Census {{code HumanEval/MBPP (exp1999/2090/1607), math GSM8K, Sudoku held-out}}. Emit max_selectable_headroom (BARE) + headroom_present_domain. This is the POSITIVE CONTROL the moat test requires."
    priority: high
    track: verifier-moat
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the headroom-gate infra is the forward difference addressing the exp4168 headroom-limited null — false-positive scope-match vs prior verifier-moat tasks; new infra = objective/executable-oracle headroom measurement + artifact sanitization (arXiv:2605.07395), never tested before."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4175_headroom_gate_executable_census.json
    prompt: |
      CONTEXT: The .386 moat graft was a NULL only because Sudoku had no selectable headroom (oracle@k
      ≈ baseline). Before re-asking "does the verifier add value?", we must FIND a domain that actually
      HAS selectable headroom, measured with an OBJECTIVE oracle. arXiv:2605.07395 warns that apparent
      headroom is often an evaluation artifact (LLM-judge bias, truncation, format mismatch) — so the
      oracle MUST be executable/objective, and the measurement MUST be sanitized.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1999_code_verification_humaneval.json (baseline 0.66 -> repair 0.84)
        - results/experiment_2090_crane_humaneval.json, results/experiment_1607_dsl_humaneval.json
        - results/experiment_1816_gsm8k_baseline.json, results/adversarial_gsm8k_data_400.json
        - results/arc3_trm_verifier_rerank.json (Sudoku/ARC pool, KNOWN low/no headroom — the negative anchor)
        - scripts/summarize_artifact.py (read artifacts via this, not raw JSON)

      TASK: build scripts/headroom_gate.py and census the cached candidate pools for selectable headroom.

      CONCRETE STEPS:
        0. PRECONDITIONS: confirm at least 2 cached candidate pools with stored multi-candidate sets
           exist (`ls results/experiment_1999_* results/experiment_2090_* results/experiment_1816_*`).
           If a pool stores only a single greedy completion (no K candidates), mark it
           census_incomplete for that domain and continue. If NO multi-candidate pool exists -> honest_verdict
           `blocked_no_multicandidate_pool` and STOP.
        1. Implement scripts/headroom_gate.py with a function headroom(pool) -> {{oracle_at_k,
           baseline_pass1, sc_vote_pass1, selectable_headroom = oracle_at_k - sc_vote_pass1, n,
           artifact_flags}}. Oracle MUST be executable/objective: run unit tests for code; exact-match
           for math/Sudoku. NO LLM judge.
        2. Sanitize per arXiv:2605.07395: flag candidates that are truncated, mis-formatted, or
           unparseable as artifact_inflation rather than counting them as oracle hits.
        3. Census {{code, math, Sudoku}} pools; pick headroom_present_domain = the executable domain with
           the largest sanitized selectable_headroom; emit max_selectable_headroom BARE (a plain float,
           NOT a {{value,principle}} dict — gated fields must be bare).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A clean census (even 'no domain clears 0.10') is a COMPLETE verdict."
        max_selectable_headroom:
          principle: "BARE float (oracle@k - SC-vote, sanitized) — the downstream gate for A3 compares this raw value; a principle-dict would break the gate (gated-fields-must-be-bare)."
        headroom_present_domain:
          principle: "Names the executable domain A3 must run on; the positive control that makes a null informative."
        per_domain_headroom:
          principle: "oracle@k/baseline/vote/headroom/artifact_flags per domain so a reviewer can audit the pick and the sanitization."
        artifact_inflation_flagged:
          principle: "Count of candidates excluded as truncated/mis-formatted; proves the headroom is real, not an evaluation artifact (arXiv:2605.07395)."
      ACCEPTANCE GATE:
        - condition: "headroom_present_domain named with executable oracle AND max_selectable_headroom emitted BARE, OR an honest 'no domain clears 0.10' verdict"
          principle: "Either a positive control is established for A3, or we honestly record that no cached executable pool has selectable headroom (which itself bounds the moat claim)."

      Run: `python3 results/experiment_4175_headroom_gate_executable_census.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4176-vstar-learned-selector
    milestone: 2026.06.387
    title: "PHASE A2 — V-STaR learned selector (arXiv:2402.06457). Train an oracle-free selector on ACCEPTED + REJECTED candidate traces (so it learns a correctness boundary, not just imitates winners), out-of-fold. The missing learned-selector verifier class. Deployable ranker consumed by A3. Prefer cached traces; if fresh traces needed, generate from a SOTA GGUF behind a PRECONDITIONS cache check."
    priority: high
    track: verifier-moat
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the V-STaR accepted+rejected learned selector is the forward difference — false-positive scope-match vs prior verifier tasks; no prior experiment trained a selector on rejected traces; flagged by the .386 SOTA ingestion (exp4170) as the .387 prerequisite for DiffusionGemma."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4176_vstar_learned_selector.json
    prompt: |
      CONTEXT: Every Carnot verifier to date is a hand-built invariant or an outcome checker. V-STaR
      (arXiv:2402.06457) is the missing LEARNED-selector class: train on BOTH accepted and rejected
      traces so the model learns where the correctness boundary is. The .386 SOTA ingestion (exp4170)
      flagged this as the .387 prerequisite to unlock DiffusionGemma guidance.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4175_headroom_gate_executable_census.json (the chosen domain + pool)
        - scripts/experiment_template.py (cached_sota_pair() for any fresh generation)
        - research-references.md ".387 planning sweep" (V-STaR 2402.06457; arXiv:2504.16828 ThinkPRM)

      TASK: build an oracle-free, out-of-fold V-STaR-style selector on accepted+rejected traces.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. A cached candidate pool with per-candidate correctness labels exists for an executable
              domain (reuse exp4175's headroom_present_domain pool).
           b. IF fresh trace generation is required, verify a SOTA GGUF is cached:
              `python3 -c "from scripts.experiment_template import cached_sota_pair; print(cached_sota_pair())"`
              (expects unsloth/Qwen3.6-35B-A3B-GGUF or unsloth/gemma-4-26B-A4B-it-GGUF). Load via the
              .gguf path, NOT AutoTokenizer (GGUF tokenizer rule). If neither cached and traces are
              needed -> honest_verdict `blocked_model_not_cached_sota_gguf` and STOP.
        1. Build the selector: featurize each (input, candidate) and train an OOF classifier/ranker on
           ACCEPTED (correct) vs REJECTED (incorrect) traces. Oracle-free: never read held-out gold.
        2. Report selector AUROC (gold vs non-gold) + pass@1 when used as a ranker vs SC-vote, OOF.
        3. Persist the selector so A3 can load it as a deployable ranker.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A trained selector (even one that ties vote) is a COMPLETE verdict."
        selector_auroc_oof:
          principle: "Out-of-fold gold-vs-non-gold AUROC; the learned selector's discrimination, measured without oracle leakage."
        selector_pass1_vs_vote:
          principle: "pass@1 as a ranker minus SC-vote pass@1 (OOF) — the learned-selector's standalone lift, input to A3."
        accepted_rejected_n:
          principle: "Counts of accepted and rejected traces trained on; V-STaR's value is using BOTH (rejected traces define the boundary)."
        random_seed:
          principle: "Determinism is the precondition for reproducibility; the selector must be re-trainable to the same result."
        reproducibility_checksum:
          principle: "Content hash of the trace corpus + features; catches silent corpus drift between this run and any replication."
      ACCEPTANCE: an OOF selector with reported AUROC + pass@1-vs-vote, trained on both accepted and rejected traces, persisted for A3.

      Run: `python3 results/experiment_4176_vstar_learned_selector.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4177-decisive-headroom-controlled-moat-test
    milestone: 2026.06.387
    title: "PHASE A3 (DECISIVE, gated_on A1 headroom>=0.10) — the headroom-controlled verifier moat test. On the headroom_present_domain: executable verifier ensemble + V-STaR selector (A2) vs SC-vote vs oracle, with a MATCHED no-verifier control (same budget/candidates/steps, arXiv:2511.02886) and accuracy AND cost (arXiv:2504.01005 SC-crossover). Decisive: does the verifier add value (CI95 excl 0) WHERE headroom exists? Resolves the moat question + informs the DiffusionGemma gate."
    priority: high
    track: verifier-moat
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + addresses the exp4168 headroom-limited null: the forward difference is a HEADROOM-PRESENT executable domain + matched no-verifier control + V-STaR selector + accuracy-and-cost reporting — false-positive scope-match vs the .386 graft; the .386 root cause (no selectable headroom) is now controlled-for via the A1 positive control."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4177_decisive_headroom_controlled_moat_test.json
    gated_on:
      - upstream: exp4175-headroom-gate-executable-census
        artifact_field: max_selectable_headroom
        op: '>='
        value: 0.10
    prompt: |
      CONTEXT: THE decisive verifier-moat test, done with the positive control the .386 null lacked.
      Only run on a domain A1 proved has selectable headroom (oracle@k - SC-vote >= 0.10) with an
      executable oracle. The win condition (north-star §5) is efficiency-parity: the verifier earns its
      place if it is at least as accurate as SC-vote at lower cost — accuracy gains are a bonus.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4175_headroom_gate_executable_census.json (headroom_present_domain + pool)
        - results/experiment_4176_vstar_learned_selector.json (the deployable selector)
        - scripts/headroom_gate.py (oracle@k / SC-vote helpers), scripts/adversarial_verify.py
        - research-references.md ".387 sweep": arXiv:2504.01005 (SC compute-crossover), 2511.02886 (matched control), 2602.21189 (pass@k can hurt pass@1)

      TASK: run the headroom-controlled moat test with a matched no-verifier control, accuracy + cost.

      CONCRETE STEPS:
        0. PRECONDITIONS: A1 reported headroom_present_domain with max_selectable_headroom >= 0.10 AND
           the executable oracle for that domain runs (e.g. `python3 -c "import subprocess"` for code
           execution sandbox). If the gate field is missing/below 0.10 -> honest_verdict
           `complete_moat_test_deferred_no_headroom_present` (the gate prevents an uninformative null)
           and STOP. (The conductor gate should skip this task automatically; this is the in-script backstop.)
        1. ARM A (verifier): rerank the K candidates per problem by the executable verifier ensemble +
           V-STaR selector; measure pass@1 + total verifier compute/latency.
        2. ARM B (SC-vote): self-consistency majority vote; pass@1 + compute.
        3. ARM C (matched no-verifier control): SAME candidate budget, NO verifier (e.g. random or
           first-of-K), to prove any A-lift is the verifier, not the extra compute (arXiv:2511.02886).
        4. ORACLE: pass@k ceiling. Report A-vs-B delta with bootstrap CI95, A-vs-C delta, and the
           accuracy/cost Pareto point ("parity at N× cheaper" if applicable). Run adversarial_verify.py.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A clean positive, a clean (headroom-present) null, or a gated deferral are ALL COMPLETE."
        verifier_value_added:
          principle: "Bare bool: did ARM A beat SC-vote (CI95 excl 0) OR match it at lower cost? Resolves the moat question and the DiffusionGemma gate when headroom is present."
        moat_delta_vs_vote:
          principle: "pass@1(A) - pass@1(B) with CI95 — the accuracy axis of the moat, now measured WHERE headroom exists."
        moat_vs_matched_control:
          principle: "pass@1(A) - pass@1(C) — proves a win is the verifier, not extra adaptation compute (arXiv:2511.02886)."
        accuracy_cost_pareto:
          principle: "Compute/latency ratio at equal accuracy — the efficiency-parity win condition (north-star §5; arXiv:2504.01005)."
        positive_control_confirmed:
          principle: "Bare bool: oracle@k > SC-vote AND >=1 flip occurred on this corpus — without it the null is uninformative (FALSE_NEGATIVE_RISK)."
        random_seed:
          principle: "Determinism precondition for reproducibility of the decisive measurement."
        reproducibility_checksum:
          principle: "Content hash of candidate pool + verifier config; lets a third party re-run the decisive test."
      ACCEPTANCE GATE:
        - condition: "positive_control_confirmed True AND (verifier_value_added with CI95 reported), OR an honest gated deferral when headroom < 0.10"
          principle: "Decisive only with the positive control in place; otherwise honestly defer rather than emit another uninformative null."

      Run: `python3 results/experiment_4177_decisive_headroom_controlled_moat_test.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4178-gap3-stage1-model-native-arc-energy
    milestone: 2026.06.387
    title: "PHASE B — GAP-3 Stage-1 model-native ARC energy (CPU; the activation dump ALREADY EXISTS). On results/arc3_gap3_stage1_candidate_table.npz (z_mean (8041,512), votes, q_mean, probe, correct, task_idx): score with (1a) a model-native ORTHOGONAL basis (arXiv:2604.17614) + (1b) the learned OOF probe. Run ALL gates (selection>vote, AUROC>0.70, coverage>=80%, headroom-capture>=30%) + ALL adversarial checks (permutation, strict OOF, oracle-leak, bootstrap CI). Does it reach the proven ~13pp ARC headroom? READ-ONLY w.r.t. TRM training."
    priority: high
    track: verifier-gap3
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): GAP-3 Stage-1 is the forward step after Stage-0 (q_halt scalar) was adversarially-confirmed NEGATIVE — false-positive scope-match vs Stage-0; forward difference = the full 512-d latent (not the 1-D scalar) per the gap3 design doc; the 0.86 within-task soft-AUROC says the signal is in the latent the scalar projected away."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4178_gap3_stage1_model_native_arc_energy.json
    prompt: |
      CONTEXT: ops/verifier_gaps.md GAP-3 is the PRIMARY verifier-build path: ~13pp of selectable
      headroom is proven in TRM's ARC pool (oracle 0.61 > vote 0.45) but cheap hand-invariants are
      exhausted (anti-rank). Stage-0 (q_halt scalar) was NEGATIVE; Stage-1 uses the full latent. The
      GPU activation dump ALREADY EXISTS as results/arc3_gap3_stage1_candidate_table.npz, so this is a
      CPU-only scoring task — NO GPU, NO TRM retrain, NO write to the stable checkpoint dir.

      EXISTING CODE TO READ FIRST:
        - docs/research-notes/gap3-learned-arc-energy-design.md (REQ-GAP3-1/2/3, §3 gates, §4 adversarial)
        - ops/verifier_gaps.md (the gap ledger; the corrected anti-rank evidence; the oracle ceiling 0.613)
        - results/arc3_gap3_stage1_candidate_table.npz (z_mean,(8041,512); task_idx; votes; q_mean; probe; correct)
        - results/arc3_gap3_stage0_qhalt_energy.json + ..._adversarial_verify.json (the Stage-0 negative)

      TASK: score the existing latent dump with a model-native basis + learned probe; run all gates + adversarial.

      CONCRETE STEPS:
        0. PRECONDITIONS: `python3 -c "import numpy as np; d=np.load('results/arc3_gap3_stage1_candidate_table.npz'); assert d['z_mean'].shape[1]==512 and d['correct'].sum()>0"` exits 0. If the npz is
           missing -> honest_verdict `blocked_stage1_latent_dump_missing` and STOP (do NOT launch a GPU dump — that risks the wall-cap + a training collision; queue the dump as a separate task instead).
        1. (1a) model-native basis: recover an orthogonal basis (SVD/PCA-class) from z_mean on held-out
           tasks; score candidate consistency along it. (1b) learned probe: a tiny OOF (leave-one-task-out)
           logistic/MLP z_mean -> correctness. Rank candidates per task by each energy.
        2. Gates (vs TRM frequency vote on held-out tasks): selection pass@2(energy) > pass@2(vote);
           per-candidate AUROC(gold vs non-gold) > 0.70; coverage (energy defined) >= 80%;
           headroom-capture >= 30% of (oracle - vote).
        3. Adversarial (gap3 design §4): A1 permutation control (shuffle correctness labels within
           augmentation strata -> must collapse to chance); A2 strict OOF (disjoint fit/eval task sets,
           report in-fold vs OOF gap); A3 oracle-leak audit (energy identical with/without the gold file);
           A4 bootstrap CI95 on the pass@2 delta vs vote (n=31 is directional; flag if the full 400-task
           re-confirm is still owed).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An honest negative (latent also does not beat vote) is a COMPLETE, decision-grade verdict."
        pass2_energy_vs_vote:
          principle: "Selection gate: pass@2(energy) - pass@2(vote) on held-out tasks; the single number GAP-3 lives or dies on."
        candidate_auroc:
          principle: "Per-candidate gold-vs-non-gold AUROC; must beat the hand-features' best always-on family (object_count 0.67) to justify the latent."
        coverage_fraction:
          principle: "Fraction of candidates the energy is defined on; the structural failure of hand-features was <20% coverage."
        headroom_capture_fraction:
          principle: "Fraction of (oracle - vote) captured; partial credit toward the 0.61 ceiling and the metric that says whether the latent reaches the proven ~13pp."
        adversarial_checks:
          principle: "Permutation/OOF/oracle-leak/bootstrap results; a passing gate without these is gameable (gap3 §4 + sample-size rigor)."
        random_seed:
          principle: "Determinism precondition; the OOF split + probe must be reproducible."
        reproducibility_checksum:
          principle: "Hash of the npz + fold assignment; catches silent dump drift."
      ACCEPTANCE GATE:
        - condition: "all four gates reported with bootstrap CI AND the adversarial checks run (a passing OR an honest-negative verdict both qualify)"
          principle: "GAP-3 Stage-1 is decided on the merits with the adversarial guards; never a bare celebratory number."

      Run: `python3 results/experiment_4178_gap3_stage1_model_native_arc_energy.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

