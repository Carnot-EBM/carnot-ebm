    4. Implement python/carnot/models/lowrank_kaem.py.\n\
    \   Docstring: WHY low-rank (arXiv 2604.04384 shows transformer logit matrices are\
    \   low-rank; the effective dimensionality of the energy landscape is 2-11,\
    \   not n_vars; projecting to this subspace before spline computation is an information-\
    \   preserving compression that reduces compute from O(n_vars) to O(k) where k<<n_vars).\n\
    \   Export LowRankKAEMEnergy, LowRankProjector from carnot.models.__init__.\n\
    5. Write scripts/experiment_532_lowrank_kaem_energy.py:\n\
    \   a. apply_env_autofix() FIRST\n\
