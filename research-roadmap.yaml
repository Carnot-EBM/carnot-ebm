tasks:
- id: exp7357-contract
  title: Bind the V646 research delta and twelve-task contract
  phase: 1
  track: reporting
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.646
  deliverable: results/experiment_7357_v646_contract.json
  model: opus
  prior_failures:
  - experiment_id: exp7343-contract
    verdict: complete_disqualified_v645_contract_mismatched_or_invalid
    addressed_by: One current twelve-row contract, pre-emit prior-failure and exclusion lint, exact producer field
      declarations, and independent parser/gate mutation checks replace the mismatched V645 contract.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V645 ended with fourteen dispositions, a failed prior-failure contract check, and blocked downstream science. Bind this single V646 contract before interpreting measurements. The contract receipt is advisory: no science task gates on it.
    Work at {project_root}. Execution date {date}. Milestone 2026.09.646, phase 1.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/research-references.md
    - {project_root}/research-studying.md
    - {project_root}/python/carnot/experiment_7329_v644_contract.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/validate_prior_failures.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_consumer_checks.py
    - {project_root}/scripts/conductor_gates.py
    - {project_root}/results/experiment_7343_v645_contract.json

    TASK:
    Produce results/experiment_7357_v646_contract.json. Create scripts/experiments/experiment_7357_v646_contract.py as a thin executable entrypoint. Reuse existing production helpers; add reusable behavior in python/carnot/experiment_7357_v646_contract.py only where necessary, with meaningful tests in tests/python/test_experiment_7357_v646_contract.py. Do not copy an old complete launcher.
    SAME-MILESTONE INPUTS (future outputs, read after their tasks finish):
    None. Historical files are diagnostic evidence only.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print and flush immediately. Check exact input paths and prerequisite field values before dependent work. Reject missing, quarantined, disqualified, blocked or partial producers. External absence produces a terminal blocked_* with gate_check_summary and no dependent work. Verify an existing relevant capability contains the driving REQ-*; write specific requirements and meaningful failing tests before implementation. Scratch belongs in /tmp, never the repository root.
    1. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER any model load, generation, benchmark or subprocess that can take minutes. Inside EVERY long loop print completed units and monotonic elapsed at least every 60 seconds. Stream subprocess output unbuffered; emit truthful pending-operation heartbeats every 60 seconds during blocking calls. Keep EVERY silence gap under 600 seconds, including authoring and validation. Silence can kill at 1200 seconds; continuous progress permits the 4800-second cap. Checkpoint completed units and cancel only owned work on budget expiry; never pad elapsed time.
    2. No current LLM work: MODEL_SPECS=[], model_invoked=false and zero current invocation counts. Declare inference_substrate_class=aggregation and the actual host computation; authenticate historical LLM receipts in labeled sidecars, never as new generation. Do not load a model to inflate this task.
    3. Select research-roadmap-next.yaml only if its milestone is 2026.09.646; otherwise select the matching active YAML. Hash-copy it and the Markdown before reading results. Require twelve ordered tasks exp7357 through exp7368 and exactly one Exact Task Contract. Independently parse IDs, titles, phases, deliverables, substrate classes and every structured gate with the shipped parsers; do not reuse fixed V644/V645 evaluate_contract constants or activate a roadmap.
    4. Run schema, prior-failure, gate-field, exclusion-manifest, prompt-path, ARC-generalization and overdue-priority checks. Exercise missing/reordered task, stale milestone, changed path/title/phase, misspelled gate field and bad operator mutations; each must fail. Against the real conductor gate reader in a private temporary result tree test each edge with valid input, zero score, absent producer, absent field/class, disqualified score-one and flagged score-one. Every edge must fail closed when appropriate.
    5. Ingest the dated V646 references into research-studying.md. Make a bounded primary-source refresh of Dream-RSI 2609.14858, ModularRSI 2609.14857, CCA 2604.13283, Memoir 2607.20792 and RT4CHART 2603.27752. Map assumptions to Exp7365/7366, Exp7362 and Exp7361 respectively. Record access limits and the difference between observed-support replay and causal counterfactuals; no additional research branch or runtime dependency.
    6. Emit contract_complete_score=1 only for exact pair agreement and zero hard planner violations. A source fetch failure does not invalidate a previously authenticated contract; record it separately. E2E is the real document pair through both independent parsers and the real gate reader, not equality of two lists generated in one function.
    7. Use the shipped Exp7303 scoped validation runner with explicit affected tests/modules. Create parents for private --basetemp paths. Require worktree imports, pytest -n 0 -o addopts= --no-cov, separate 100% changed-module coverage, scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Run focused Rust test/fmt/clippy only for changed Rust. Never invoke an old main() that launches the whole suite. Keep unrelated repository-health failures dated and separate; do not erase or weaken any affected required check.
    8. Execute the declared entrypoint end to end plus the applicable ops/e2e-test-plan.md checks stated in this task. Reload the candidate and independently reduce raw evidence. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict; retain critical findings and all failed gates. Readiness/value/promotion stay zero for disqualified or blocked science; accounting-only disposition scores never authorize consumers. Write terminal JSON atomically and reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Keep active research-roadmap.yaml, historical determinations and production defaults unchanged.
    9. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Version this record and retain ordinary top-level experiment_id and milestone."
       - status: principle: "Terminal only after actual work and affected validation; never a success-shaped placeholder."
       - run_date: principle: "Use {date} and actual UTC timestamps."
       - preconditions_checked: principle: "Exact input, resource and required-field checks before dependent work."
       - MODEL_SPECS: principle: "Actual intended identities; every LLM task includes unsloth/Qwen3.8-27B-GGUF."
       - model_invoked: principle: "True for any attempted current model load or generation, even failure."
       - invocation_counts: principle: "Attempted/completed/failed/cancelled/in-flight calls; separate current from historical."
       - inference_substrate: principle: "Actual computation, with historical inference in explicitly labeled hash-bound sidecars."
       - inference_substrate_class: principle: "Actual closed duration class; no duration padding."
       - execution_venue: principle: "Host CPU or owned CUDA runtime as measured; no new board execution in V646."
       - duration_s: principle: "Measured monotonic elapsed, never synthetic elapsed or sleep to pass a floor."
       - phase_spans: principle: "Disjoint measured load, generation, evaluation, validation and write spans."
       - random_seed: principle: "Frozen development/evaluation/resampling seeds; null if truly inapplicable."
       - reproducibility_checksum: principle: "Bind exact code, settings, evaluator, inputs and raw evidence."
       - source_artifact_hashes: principle: "Exact producer paths and immutable byte hashes; preserve original classes/flags."
       - rows: principle: "Every comparative unit/arm/metric/cost/failure/censoring disposition, not only pooled means."
       - sample_size_budget: principle: "Frozen planned/attempted/completed/censored units and stopping rules."
       - acceptance_gate_results: principle: "Expected, observed and passed separately for required validation, safety and scientific value; never mark failed value as successful."
       - gate_check_summary: principle: "Every blocked_* names upstream/check, exact field, expected and observed value, including missing paths."
       - verifier_is_oracle: principle: "True when the evaluator defines truth; independent code alone cannot remove circularity."
       - honest_verdict: principle: "Precise free-text terminal outcome; distinguish accounting, null science and unavailable work."
       - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. Only unfinished retryable OWN work is partial; external unchanged absence is blocked."
       - flagged_adversarial: principle: "Current independent verification state; critical findings set true and prevent promotion."
       - validation_receipts: principle: "Exact command/scope/return code/elapsed/log hash for every required and diagnostic check, including failures."
       - repository_health: principle: "Dated unrelated failures kept separately from affected required validation."
       - field_principles: principle: "Explain each field without wrapping scalar gates or ordinary dictionaries."
       - contract_complete_score: principle: "One only after independent exact contract comparison and all planner controls pass; no scientific-value meaning."
       - contract_rows: principle: "Twelve parsed rows including gate lists from both files."
       - source_method_map: principle: "Primary URLs, retrieval outcomes, assumptions and destination experiment IDs."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7357_v646_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
