- id: exp924-rppm-tier29-step-reward
  milestone: 2026.04.71
  deliverable: results/experiment_924_rppm_tier29_step_reward.json
  max_turns: 40
  title: 'Exp 924: R-PRM Step Reward Tier 2.9 — Reasoning-Driven Step Verification (arXiv 2503.21295) (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2503.21295 (R-PRM: Reasoning-Driven Process Reward Modeling) improves
    process reward models by having the model reason over WHY a step is wrong before assigning
    a reward. This achieves +11.9 F1 points on ProcessBench vs direct-scoring PRMs. The key
    insight: the reasoning step acts as a regularizer that prevents overfitting to surface
    patterns. For Carnot, this creates Tier 2.9: between Tier 2.7 (CausalReasoningVerifier)
    and Tier 3 (Ising), insert a step-level reasoning probe that generates a brief explanation
    before scoring. The explanation also provides repair hints for IterativeSelfRepair.

    This is a NEW technique (not a rerun of any prior experiment). Decentralization-compliant:
    implemented locally using small models, no external API required.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/three_tier_pipeline.py — Tier 0-3 cascade, integration point
    - python/carnot/verify/causal_reasoning_verifier.py — Tier 2.7 (for reference pattern)
    - python/carnot/pipeline/vjepa_predictor.py — Tier 2 (adjacent tier)
    - openspec/change-proposals/research-roadmap-v71.md — .71 Phase 4 design

    TASK: Implement RPRMStepRewardTier29. Run on 30 GSM8K questions.
    Measure AUC vs direct-scoring baseline. Target: auc > baseline.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Create python/carnot/verify/rppm_step_reward.py:
       @dataclass
       class StepReasoningResult:
           step_text: str
           reasoning: str          # "why" explanation (from LLM or heuristic)
           step_score: float       # 0-1 violation probability
           reasoning_mode: str     # "llm" | "heuristic"

       class RPRMStepReward:
         __init__(self, llm_runner=None, n_reasoning_tokens: int = 50):
           self.llm = llm_runner   # None = heuristic mode (CI-safe)
           self.n_tokens = n_reasoning_tokens

         score_step_with_reasoning(self, step: str, context: str) -> StepReasoningResult:
           if self.llm is None:
             # CI-safe heuristic: flag if step contains suspicious patterns
             # ("= 0", division by impossible number, repeated equals)
             suspicious = any([
               "= 0" in step and len(step) > 20,  # suspicious zero result
               step.count("=") > 2,               # multiple equals in one step
               re.search(r"\b0\b.*=", step),       # divides by zero pattern
             ])
             reasoning = "heuristic: suspicious pattern detected" if suspicious else "ok"
             score = 0.7 if suspicious else 0.1
             return StepReasoningResult(step, reasoning, score, "heuristic")
           # LLM mode: generate reasoning then score
           reasoning_prompt = (
             f"Context: (context)\n"
             f"Step: (step)\n"
             f"Is this step correct? Explain briefly in (self.n_tokens) tokens max.\n"
             f"End with: VERDICT: [correct|suspicious|wrong]"
           )
           reasoning_text = self.llm.generate(reasoning_prompt,
                                               max_tokens=self.n_tokens)
           if "VERDICT: wrong" in reasoning_text: score = 0.9
           elif "VERDICT: suspicious" in reasoning_text: score = 0.5
           else: score = 0.1
           return StepReasoningResult(step, reasoning_text, score, "llm")

         verify_response(self, question: str, response: str) -> RPRMResult:
           steps = self._split_steps(response)
           step_results = [
             self.score_step_with_reasoning(s, question) for s in steps
           ]
           overall_score = max([r.step_score for r in step_results], default=0.0)
           return RPRMResult(
             steps=step_results,
             overall_violation_prob=overall_score,
             n_flagged=sum(1 for r in step_results if r.step_score > 0.5),
             repair_hints=[r.reasoning for r in step_results if r.step_score > 0.5]
           )

         _split_steps(self, response: str) -> list[str]:
           # Split by sentence endings or explicit step markers
           return [s.strip() for s in re.split(r'[.\n]', response)
                   if len(s.strip()) > 10]

    3. Add spec entries: REQ-VERIFY-148 (RPRMStepReward reasoning-driven step verification),
       SCENARIO-VERIFY-148 (step reasoning identifies violations with explanation for repair).
    4. Create scripts/experiment_924_rppm_tier29_step_reward.py:
       a. tmpl = ExperimentTemplate(924, ..., requires_gpu=False). tmpl.setup().
       b. Load 30 GSM8K questions. Generate responses with Qwen3.5-0.8B (CPU).
       c. For each (question, response) pair:
          - Label: correct if LLM answer matches GSM8K ground truth (from dataset).
          - Baseline: score with CausalReasoningVerifier (Tier 2.7) → baseline_auc.
          - RPRM: score with RPRMStepReward (heuristic mode for CPU) → rppm_auc.
       d. Compute: baseline_auc, rppm_auc using sklearn.metrics.roc_auc_score.
       e. honest_verdict:
          "rppm_tier29_viable" if rppm_auc > baseline_auc
          "rppm_tier29_no_improvement" otherwise
    5. Write tests with 100% coverage. Test:
       - score_step_with_reasoning heuristic mode (CI-safe).
       - StepReasoningResult dataclass.
       - _split_steps handles edge cases (empty, single step, multi-sentence).
       Traces to REQ-VERIFY-148, SCENARIO-VERIFY-148.
    6. Write results/experiment_924_rppm_tier29_step_reward.json.
    7. Update ops/changelog.md: one-line entry.
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_924_rppm_tier29_step_reward.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

