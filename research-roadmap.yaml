    title: "PHASE E (CAPSTONE .401, UNGATED) -- the verifier scorecard + the DiffusionGemma GATE DECISION (replicate-or-retire), using the ROBUST aggregate-available-report-gaps helper (NO hard-block-all-False). Headline questions: (1) did the in-generation oracle-distinct moat REPLICATE with the LEAK-ROBUST scorer on the 2nd corpus (exp4337 scorer_leak_audit_passed -> exp4338 in_generation_moat_replicates, CI95-excl-0)? -> does the DiffusionGemma gate (diffusiongemma-energy-guided-diffusion-spec.md THE GATE: oracle-distinct learned-verifier win + matched control + CI95-excl-0, LEAK-ROBUST, replicated) now flip MET -- or is the in-generation moat RETIRED as corpus-specific (retire_if_same_verdict fired)? (2) did Phase B/C land the FIRST E3 ARC solve (exp4339 ar25 / exp4340 ka59 / exp4341 sc25 offline_reproduced) -> reproducible_total_levels? (3) did the action-role cross-game encoder transfer (exp4342) or log a 3rd null? Aggregate (skipping flagged, reporting missing as per-axis gaps; HONORING verifier_is_oracle -- the E3 solves are execution-grounded verifier_is_oracle=true ARC progress NOT a moat; the in-generation/self-learning results are oracle-distinct verifier_is_oracle=false). Cite each upstream sha256. Emit in_generation_moat_replicates_headline + diffusiongemma_gate_status + arc_reproducible_total_levels + verifier_thesis_state (one honest string). Compute the G1-G4 publication gate via publication_gate.py. NO gated_on."
    priority: critical
    track: capstone
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 1 (routine milestone-capstone task): capstone-vN -- false-positive scope-match vs all prior capstone-v* tasks (exp4335); structurally never a doomed rerun. Capstone defaults to codex per the planner-routing rule."
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4346_capstone_v401.json
    prompt: |
      CONTEXT: Close .401 with the verifier scorecard + the DiffusionGemma GATE DECISION (replicate-or-retire). Use the
      ROBUST aggregate-available-report-gaps helper (NO hard-block-all-False: a missing artifact for one axis is a
      per-axis gap, never defaults every boolean False -- the exp4301 spurious-block bug). HONOR verifier_is_oracle: the
      E3 solves are EXECUTION-GROUNDED (verifier_is_oracle=true, ARC progress, NOT a moat headline); the in-generation +
      self-learning results are ORACLE-DISTINCT (verifier_is_oracle=false). Skip any flagged_adversarial artifact.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4337_leak_robust_partial_state_scorer_build.json (scorer_leak_audit_passed -- the gate precondition)
        - results/experiment_4338_in_generation_moat_replicate_leak_robust.json (in_generation_moat_replicates + the CI95 -- the gate decision)
        - results/experiment_4339_e3_explore_verify_plan_ar25.json + results/experiment_4340_e3_explore_verify_plan_ka59.json + results/experiment_4341_e3_sc25_reproduction.json (offline_reproduced + reproduced_levels -- the ARC accuracy)
        - results/experiment_4342_self_learning_action_role_cross_game_encoder.json (learned_encoder_transfer_helps)
        - results/experiment_4344_verifier_registry_gaps_hygiene.json (hygiene + regression guard)
        - results/experiment_4335_capstone_v400.json (the .400 capstone -- the prior scorecard + the robust aggregator + the upstream-provenance pattern to reuse)
        - docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md (THE GATE), scripts/publication_gate.py (G1-G4), ops/arc_solve_registry.yaml (reproducible_total_levels), scripts/summarize_artifact.py, scripts/adversarial_verify.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification + Sample-Size Rigor" (the fabrication gate: skip flagged artifacts)

      TASK: aggregate the .401 verifier scorecard; decide the DiffusionGemma gate (replicate-or-retire); compute G1-G4.

      CONCRETE STEPS:
        0. PRECONDITIONS: the upstream .401 artifacts are readable; publication_gate.py runs. If publication_gate.py is
           missing -> honest_verdict `blocked_publication_gate_missing` and STOP.
        1. Read each upstream artifact via summarize_artifact.py; for each, run a LIVE adversarial re-check + record its
           sha256; SKIP any flagged_adversarial artifact (do NOT aggregate its numbers). Use the robust aggregate-available
           helper (per-axis gaps, never all-False).
        2. THE GATE DECISION: diffusiongemma_gate_status := 'MET_oracle_distinct_leak_robust_replicated' iff
           exp4337 scorer_leak_audit_passed==true AND exp4338 in_generation_moat_replicates==true (CI95-excl-0, matched
           controls, verifier_is_oracle=false); else if exp4338 retired the moat (powered non-replication even with a
           leak-robust scorer) -> 'RETIRED_corpus_specific_<reason>'; else 'STILL_PENDING_<reason>'. The operator was
           TWICE-burned -> only a LEAK-ROBUST, REPLICATED oracle-distinct win flips the gate MET.
        3. ARC: arc_reproducible_total_levels := the registry's reproducible_total_levels after exp4339/4340/4341 (only
           offline_reproduced solves count). SELF-LEARNING: read exp4342's learned_encoder_transfer_helps.
        4. Emit in_generation_moat_replicates_headline + diffusiongemma_gate_status + arc_reproducible_total_levels +
           verifier_thesis_state (one honest string) + verifier_is_oracle_honored + per_axis_gaps +
           flagged_artifacts_excluded + upstream_provenance (each {{experiment_id, fields_imported, sha256}}). Compute
           paper_ready via publication_gate.py --json (G1-G4). Declare reproducibility_checksum.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. The .401 close-state -- whether the in-generation moat replicated leak-robust (gate flips) or retired (corpus-specific), whether E3 landed the first ARC solve, whether the action-role encoder transferred."
        in_generation_moat_replicates_headline:
          principle: "BARE bool: did the in-generation oracle-distinct moat REPLICATE with the LEAK-ROBUST scorer on the 2nd corpus (exp4338, CI95-excl-0, controls_differentiated, verifier_is_oracle=false) -- the SETTLED headline."
        diffusiongemma_gate_status:
          principle: "One honest string: 'MET_oracle_distinct_leak_robust_replicated' iff the LEAK-ROBUST scorer (exp4337) replicated the moat (exp4338) with matched controls + CI95-excl-0; 'RETIRED_corpus_specific_<reason>' iff a powered non-replication even with a leak-robust scorer; else 'STILL_PENDING_<reason>'. The operator was twice-burned -> only a leak-robust REPLICATED win flips MET."
        arc_reproducible_total_levels:
          principle: "BARE int: the cumulative OFFLINE-REPRODUCED ARC solved-level count (the north-star accuracy metric; only reproduced levels count) after the .401 E3 advances (target >=14)."
        verifier_thesis_state:
          principle: "One honest string for the verifier thesis state -- the framing the .402 planner inherits (e.g. in_generation_moat_replicated_leak_robust / in_generation_moat_retired_corpus_specific / first_e3_arc_solve)."
        verifier_is_oracle_honored:
          principle: "BARE bool=true -- confirms every cited MOAT/headline result carried verifier_is_oracle=false (the E3 solves are reported as execution-grounded ARC progress, NOT moats)."
        per_axis_gaps:
          principle: "List of .401 axes whose artifact was MISSING (reported as a gap, NOT defaulted False) -- the robust-aggregator fix (no exp4301-style all-False)."
        flagged_artifacts_excluded:
          principle: "List of .401 artifacts excluded for flagged_adversarial -- the fabrication gate (their numbers are NOT aggregated)."
        paper_ready:
          principle: "From publication_gate.py --json -- the G1-G4 status (FoVer 0.9131 stays the publication target; a replicated leak-robust in-generation moat would be a new headline-grade supporting result)."
        upstream_provenance:
          principle: "Each cited upstream artifact {{experiment_id, fields_imported, sha256}} -- the audit trail that the capstone synthesizes nothing from nothing."
        reproducibility_checksum:
          principle: "Hash of the aggregated upstream sha256 set; lets a third party re-derive the capstone."
      ACCEPTANCE GATE:
        - condition: "in_generation_moat_replicates_headline + diffusiongemma_gate_status + arc_reproducible_total_levels + verifier_thesis_state + verifier_is_oracle_honored + per_axis_gaps + flagged_artifacts_excluded + paper_ready + upstream_provenance reported, OR an honest blocked_publication_gate_missing verdict"
          principle: "The capstone SETTLES the headline (replicate-or-retire the in-generation moat with a leak-robust scorer) + records the ARC accuracy + the self-learning result, honoring verifier_is_oracle and the fabrication gate, via the robust aggregator (no all-False). This is the decision-grade close the .402 planner inherits."

      Run: `python3 {project_root}/results/experiment_4346_capstone_v401.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.
