milestone: 2026.09.674
milestone_title: Localized evidence supervision, retained constraint learning, and live exploration value
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp7739-contract-methods
  title: Bind fourteen tasks and ingest localized-supervision methods
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 25
  per_unit_rows: true
  milestone: 2026.09.674
  deliverable: results/experiment_7739_v674_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  agent_type: claude
  model: opus
  prior_failures:
  - experiment_id: exp7726-contract-methods
    verdict: complete_disqualified_v673_contract_validation
    addressed_by: Resolve and precheck the current Gibbs package path; independently validate all prompt
      inputs before dispatch.
    retire_if_same_verdict: true
  - experiment_id: exp7713-contract-methods
    verdict: complete_blocked_v672_independent_contract
    addressed_by: Provide a complete fourteen-row design table and machine block before executing the
      contract reader.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.674. V673 qualified a development corpus and finite normalization. It did not qualify learned decisions, retained learning or the ARC organic selector comparison. Preserve its nulls and disqualifications.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/python/carnot/reporting/v672_contract.py
    - {project_root}/python/carnot/experiment_7726_v673_contract_methods.py
    - {project_root}/research-references.md
    - {project_root}/research-studying.md

    TASK:
    Produce results/experiment_7739_v674_contract_methods.json. Add REQ-REPORT-7739 and the relevant capability requirements before code. Planned thin CLI: scripts/experiments/experiment_7739_v674_contract_methods.py. Planned tests: tests/python/test_experiment_7739_v674_contract_methods.py. Planned raw evidence: results/raw/experiment_7739_v674_contract_methods/. Reuse production modules; add a small task-owned orchestration module under python/carnot only where needed. These paths are outputs, not input preconditions.
    Execution: inference_substrate_class=aggregation; MODEL_SPECS=[].

    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed progress line immediately. Resolve {project_root} absolutely. Check required input bytes, schemas and owned resources before measurement. Missing external prerequisites produce complete_blocked_<reason>, verdict_class=blocked and gate_check_summary. Preserve unrelated edits. Planned outputs are not required existing inputs.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER any potentially minutes-long model load, generation, benchmark or subprocess. Print elapsed time and completed units INSIDE every long loop at least every 60 seconds. Stream child output with an owned heartbeat. Keep every silence gap under 600 seconds to retain the 4800-second cap. A silent task can die at 1200 seconds. Checkpoint completed work; never pad duration.

    3. Bound each tool call. Write any file over about 200 lines in several calls of roughly 100-150 lines. Send a progress message BETWEEN calls. Split large reads and checks. Put throwaway probes in /tmp, experiment CLIs in scripts/experiments and tests in tests/python.

    4. Before code, add task REQ-* and SCENARIO-* requirements to the relevant capability spec. Write meaningful failing tests first. Freeze the complete affected validation scope before measurements. Keep numerical code, experiment orchestration and the CLI separate. Finish private end-to-end tests before expensive data capture.

    5. Compare exactly fourteen tasks, Exp7739-Exp7752, across the V674 design table, JSON block and matching staged YAML. Use the real parser and independent field comparisons. Reject deletion, reordering, wrong milestones, stale paths, missing models and misspelled gate fields in private copies. Administrative qualification gates no science.

    6. Address Exp7726 directly: its contract comparison passed, but prompt_path failed on the nonexistent Gibbs file. The current import is python/carnot/models/gibbs/__init__.py. Check every required input before execution. Preserve the old verdict and the archived V673 design hash.

    7. Write docs/research-notes/v674-method-map.md from the V674 reference review. Read HalluSpan training/limitations, delayed-capacity learning and complete hardware cost boundaries. Map each method to a falsifiable task and its local deviations. Run one bounded sequential literature delta check; record access failures. Mark methods ingested in research-studying.md.

    8. Run unchanged roadmap schema, prior-failure, exclusion, gate, harness-fit, ARC-floor, overdue-priority and prompt-path readers. Resolve only matching V674 staged or activated authority. Do not fix missing design sections during measurement. Record actual backend routing without changing it.

    9. Task E2E: Run the thin CLI on private fixture inputs, then cold-reduce its raw rows in a fresh process. Reject changed input hashes and mismatched summaries.

    10. Run scoped pytest with -n 0 -o addopts=, pinned PYTHONPATH, private COVERAGE_FILE and private --basetemp outside results/. Create parent directories first. Require 100 percent coverage of every new or changed implementation module; include the existing affected tests and verify every modified existing line. Never omit changed code to pass coverage. Run affected-test spec coverage, scoped Ruff check/format and changed-module mypy. If Rust changes, run affected cargo test, fmt and clippy. Record global suite debt separately; never suppress affected failures, skip tests or weaken assertions.

    11. Cold-reduce raw evidence in a fresh process. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Record reader commands, exits and hashes before atomic publication. Derive readiness only after all required checks. Administrative readiness is null; exact fixture success is circular_positive. Valid scientific nulls may open readiness gates.

    12. Reconcile openspec, _bmad/traceability.md, ops/status.md and ops/changelog.md from actual evidence. Preserve old artifacts. Apply declared same-verdict retirement only to the matching scope. Keep defaults opt-in. Do not activate or modify research-roadmap.yaml, alter generator weights, publish, submit, buy hardware or change conductor settings.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: Use a terminal complete_ prefix; a complete null is a valid completed experiment. principle: Completion and scientific benefit are different facts.
    - verdict_class: Exactly positive | circular_positive | null | blocked | disqualified | partial. External absence or unchanged upstream failure is blocked. partial is only retryable owned incompleteness. principle: Unchanged external failures must not trigger three identical attempts.
    - flagged_adversarial: Actual terminal-reader boolean; flagged evidence opens no gate. principle: A clean label cannot replace independent checks.
    - gate_check_summary: Every blocked_* or complete_blocked_* result names check, upstream ID, artifact path, field, op, expected and observed value. principle: A missing field is a broken contract, not a scientific null.
    - acceptance_gate_results: Separate validity, readiness, probability quality, decision benefit, retention and efficiency. Unmeasured is null. principle: Negative science may be valid while invalid execution never qualifies.
    - rows: Per family or game/seed/arm metrics, raw numerators, denominators, exclusions, censoring and input hashes. principle: Every comparison must be independently recomputable.
    - sample_size_budget: Intended, started, completed, eligible, excluded and censored counts; effective independent N. principle: Seeds, sentences and actions do not multiply families or games.
    - claim_scope: development_only for exposed RAGTruth, fixture_only for constructed truth, adapter_withheld_public for ARC. fresh_generalization_eligible=false. principle: A new split cannot erase historical exposure.
    - inference_substrate: Use actual established vocabulary; keep historical model provenance separate. principle: Cached scoring must not claim live generation.
    - inference_substrate_class: Emit actual and planned classes. Full generation floor 60s; bounded generation 10s; load/embeddings 2s; no_model_load before a failed load. Never pad elapsed time. principle: Duration checks must match the work performed.
    - MODEL_SPECS: Also emit planned_MODEL_SPECS and model_specs. Current LLM calls use unsloth/Qwen3.8-27B-GGUF; no-model tasks use []. principle: The experimental model is distinct from the coding backend.
    - model_invoked: Actual flag and load/forward/generation/token/failure/cancellation counts. principle: Model strings alone are not invocation evidence.
    - execution_venue: host unless authenticated board execution occurs; include PID and actual GPU UUID when used. principle: Host work is not fabric work.
    - phase_spans: Disjoint monotonic spans, duration_s, run_date, heartbeat times, completed units and checkpoint hashes. principle: Real timings and bounded silence expose stalled work.
    - random_seed: Record each seed purpose; reproducibility_checksum binds input bytes, parameters and reducer code. principle: Independent replay needs fixed inputs.
    - source_artifact_hashes: Distinguish eligible producers, historical disqualified sources, missing inputs and pre-gate receipts. Exclude this planned output from required inputs. principle: An artifact cannot authenticate itself as an upstream source.
    - preconditions_checked: Actual resources, path/schema checks and effective coding backend. principle: Missing access must produce a block before expensive work.
    - validation_receipts: Frozen affected scope; actual commands, exits, log hashes, cold replay and applicable E2E. Keep repository debt separate. principle: A result is usable only after its registered checks pass.
    - verifier_is_oracle: True when the predictor uses the same exact authority that supplies truth; successful fixture claims are circular_positive. Natural annotation evaluation alone does not make the predictor an oracle. principle: Circular success cannot establish independent verification value.
    - field_principles: Echo the principle for every field and acceptance gate. principle: The rationale must travel with the contract.
    - contract_ready_score: 1 only after exact three-source agreement and every registered reader passes. principle: Administrative completeness cannot manufacture science.
    - method_map_path: docs/research-notes/v674-method-map.md with primary URLs, review depth, local adaptations and deferrals. principle: A paper must change an experiment or be explicitly deferred.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7739_v674_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
