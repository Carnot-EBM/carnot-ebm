  - id: exp6609-two-level-constrained-decoding
    milestone: "2026.08.576"
    deliverable: results/experiment_6609_two_level_constrained_decoding.json
    title: "Two-level local GGUF constrained decoding, gated on Exp6608 headroom"
    priority: critical
    track: constrained-generation
    requires_gpu: true
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 240
    model: opus
    prior_failures:
      - experiment_id: exp6593-cfr-independent-row-reducer
        verdict: "complete: Qwen, Gemma, and pooled CFR effects replayed; every exact-success delta is 0.0 with zero direct headroom, so no CFR benefit is eligible"
