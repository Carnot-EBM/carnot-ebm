        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6608-family-headroom-reducer
        artifact_field: headroom_benchmark_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Exp6608 has frozen at least one mandated model family with genuine held direct headroom. This task tests the Meta-Ctrl-inspired factorization against immutable direct rows. It must perform a real decoding intervention, keep unconstrained reasoning before the plan boundary, and leave final authority with the independent executor. Work at {project_root}. The planning date is {date}.

