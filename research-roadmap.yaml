  - id: exp3005-solver-to-validator-tree-expansion
    milestone: "2026.05.282"
    deliverable: "results/experiment_3005_solver_to_validator_tree_expansion_v1.json"
    title: "Solver-to-validator tree expansion"
    priority: high
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 50
    estimated_wall_time_min: 60
    track: "solver_verification"
    inference_substrate: "verifier_ensemble_against_cached_candidates"
    prior_failures:
      - experiment_id: exp2992-sota-solver-formalization-provenance-reproduction
        verdict: "reproduced: solver-feedback formalization gain reproduced with stricter Z3 provenance"
        addressed_by: "Expands the clean solver-provenance line into a larger deterministic validator-tree corpus rather than rerunning the same six-item reproduction."
        retire_if_same_verdict: true
      - experiment_id: exp2994-prompt-validator-dialogue-schema
        verdict: "complete: prompt-validator dialogue protocol ready with deterministic exact checks"
        addressed_by: "Moves from protocol readiness to executable tree expansion and partial-viability checks."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp 2992 and exp2994 are the cleanest .281 technical path: solver-feedback formalization reproduced with Z3 provenance, and the prompt-validator dialogue protocol is ready. The next step is a larger deterministic validator-tree corpus with strict partial-candidate viability checks.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - research-references.md
      - scripts/experiment_2992_sota_solver_formalization_provenance_reproduction_v1.py
      - scripts/experiment_2994_prompt_validator_dialogue_schema_v1.py
      - results/experiment_2992_sota_solver_formalization_provenance_reproduction_v1.json
      - results/experiment_2994_prompt_validator_dialogue_schema_v1.json
      - python/carnot/
      - tests/

      TASK:
      Expand the solver-to-validator line into a larger deterministic exact-check corpus. Add validator trees, partial-viability checks inspired by LAVE, and Z3/runtime transcripts. Do not use LLM-as-judge semantics.

      CONCRETE STEPS:
      1. Add a focused exp3005 script following scripts/experiment_template.py.
      2. Select or synthesize at least 20 small solver/formalization items grounded in existing fixtures, exp2992 transcripts, or deterministic generated cases.
      3. For each item, build a validator tree with explicit constraint nodes, runtime checks where applicable, and Z3 checks where applicable.
      4. Add partial-candidate viability checks: invalid prefixes or partial constraints should fail early, while valid extendable partials should remain accepted.
      5. Execute all validators and save transcript/hash evidence.
      6. Reject items with non-deterministic tests, missing exact checks, or LLM-only labels.
      7. Write the artifact and any dataset/manifest files with clear paths.

      REQUIRED ARTIFACT FIELDS:
      - validator_tree_expanded: bool (principle: downstream diagnostics must gate on a real corpus)
      - validator_manifest_path: str (principle: expanded corpus must be inspectable)
      - n_solver_items: int (principle: sample size must be explicit)
      - n_validator_trees: int (principle: tree count must be explicit)
      - all_trees_exact_checked: bool (principle: validators must be executable, not semantic claims)
      - partial_viability_checked: bool (principle: prefix/partial validity must be explicit)
      - z3_transcript_paths: list (principle: formal evidence must be replayable)
      - runtime_transcript_paths: list (principle: executable evidence must be replayable)
      - rejected_constraints: list (principle: invalid generated checks must not be hidden)
      - llm_judge_used: bool (principle: LLM judgments must not become verifiers)
      - honest_verdict: str (principle: terminal verdict must state ready, flagged, or blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

