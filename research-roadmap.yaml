    - {project_root}/python/carnot/agentic/arc_competition_agent.py
    - {project_root}/python/carnot/agentic/arc_action_provenance.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/arc-world-model-trust-energy/spec.md

    TASK:
    Build a frozen, game-blind chronological belief stream from eligible
    provenance-complete live-agent attempts. Each event must separate the
    pre-action view, action, next observation, derived contradiction, and
    later held outcomes. Write an immutable raw JSONL fixture plus its result
    manifest. Do not solve or replay a public game for credit.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable Exp7010 and Exp7005 artifacts, eligible
       live manifests, the solve registry, provenance helpers, and writable
       raw/result paths. Reject any row with incomplete provenance. On failure
