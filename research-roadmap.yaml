- id: exp768-gemma4-loader-fix-v2
  milestone: 2026.04.59
  deliverable: results/experiment_768_gemma4_loader_fix_v2.json
  title: 'Exp 768: Gemma4 Loader Fix v2 — RETRO-028 Root Cause + VR Threshold Grid (GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-028 (Gemma4 tokenizer infinite-<unused> token bug) has blocked Gemma4
    experiments in milestones .55, .56, .57, and .58. Exp 760 (.58) set honest_verdict="blocked"
    because the loader failed before any questions ran. The root cause identified across milestones:
    llama.cpp's Gemma4 tokenizer generates infinite <unused> tokens; the HuggingFace transformers
    loader (GemmaTransformersLoader) does NOT have this bug. All Gemma4 call sites must switch
    to GemmaTransformersLoader as the sole loading path.

    Once the loader is fixed, immediately run the 5-threshold VR grid that was blocked in Exp 760
    to determine whether Gemma4 has a positive-improvement threshold. This is the ONLY remaining
    experiment needed to know if Carnot's VR pipeline adds value for Gemma4.

    arXiv 2601.01490 predicts: a positive threshold exists — the current default threshold
    produces FP rate > TP rate for stronger models; raising the threshold suppresses FPs while
    preserving real detections. Exp 708 showed 25 constraints suppressed at default threshold
    with zero accuracy impact, confirming the gate works.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/gemma_loader.py — GemmaTransformersLoader (the working loader).
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; find all Gemma4 call sites.
    - python/carnot/pipeline/extract.py — auto-extractor; find Gemma4 model loading.
    - python/carnot/inference/llm_solver.py — LLMSolver; find model loading pattern.
    - results/experiment_760_gemma4_threshold_grid.json — blocked baseline.
    - results/experiment_708_vr_attempt_19_gemma4.json — Exp 708: n_constraints_suppressed=25.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Fix ALL Gemma4 call sites to use GemmaTransformersLoader. Confirm loader works
    (load test). Then run 5-threshold VR grid on 50 GSM8K questions. Target: positive_threshold_found=True.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LOADER-010 (all model loading for google/gemma-4-* MUST use GemmaTransformersLoader;
       llama.cpp backend MUST NOT be used for Gemma4 models until tokenizer bug is fixed upstream),
       REQ-VERIFY-165 (Gemma4-E4B-it VR threshold grid MUST test [0.10, 0.20, 0.30, 0.40, 0.50];
       signed_improvement reported per threshold; best_threshold identified),
       SCENARIO-LOADER-010, SCENARIO-VERIFY-215 to openspec/capabilities/verification/spec.md.
    3. Audit Gemma4 call sites:
       a. Search for "gemma" (case-insensitive) across python/carnot/ to find all model loading.
       b. For each site: note if it uses llama.cpp or GemmaTransformersLoader.
       c. Switch llama.cpp sites to GemmaTransformersLoader.
       d. Run loader test: load google/gemma-4-E4B-it, generate 5-token response to "Hello",
          confirm NO infinite <unused> tokens in output. Record: loader_test_passed (bool).
    4. apply_env_autofix() FIRST before any GPU import.
    5. setup_gpu([("name": "google/gemma-4-E4B-it", "hf_id": "google/gemma-4-E4B-it", "gpu": 0)]).
    6. If CARNOT_FORCE_LIVE not set: write artifact with honest_verdict="blocked_no_live_gpu" and exit.
    7. If loader_test_passed=False: write artifact with honest_verdict="loader_still_broken" and exit.
    8. Load 50 GSM8K questions (seed=42 to avoid overlap with Exps 742/760).
    9. Run VR at 5 threshold settings [0.10, 0.20, 0.30, 0.40, 0.50]:
       For each threshold t:
         a. Run all 50 questions through VerifyRepairPipeline with Gemma4-E4B-it.
         b. Violations below t: skip repair (abstain). Violations above t: repair.
         c. Record: baseline_accuracy, vr_accuracy, signed_improvement, n_abstained, n_repaired.
       Checkpoint after each threshold.
    10. Find best threshold:
        best_threshold = threshold with highest signed_improvement.
        positive_threshold_found = any(signed_improvement > 0 for t in thresholds).
    11. Create scripts/experiment_768_gemma4_loader_fix_v2.py:
        a. ExperimentTemplate(768, requires_gpu=True) + ExperimentTimeoutWatchdog(768, timeout_minutes=120).
        b. Implement steps 3-10.
        c. honest_verdict:
           - "retro028_closed_positive_threshold_found" if loader_test_passed AND positive_threshold_found
           - "retro028_closed_no_positive_threshold" if loader_test_passed AND NOT positive_threshold_found
           - "loader_still_broken" if loader_test_passed=False
           - "blocked_no_live_gpu" if CARNOT_FORCE_LIVE not set
        d. artifact: loader_test_passed (bool), n_call_sites_fixed (int),
           per_threshold_results (list of (threshold, signed_improvement, n_abstained)),
           best_threshold, positive_threshold_found (bool), inference_mode, honest_verdict.
    12. Write tests/python/test_experiment_768_gemma4_loader_fix_v2.py with 100% coverage:
        - test GemmaTransformersLoader is used at all discovered Gemma4 call sites.
        - test per_threshold_results has exactly 5 entries.
        - test positive_threshold_found is True when any signed_improvement > 0.
        Each test traces to REQ-LOADER-010/REQ-VERIFY-165.
    13. Reconcile:
        - ops/status.md: "RETRO-028: loader_test_passed=True/False. Gemma4 VR: positive_threshold_found=X.
          best_threshold=Y. RETRO-028: CLOSED/STILL OPEN."
        - ops/changelog.md: one-line with honest_verdict.
    14. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0, apply_env_autofix() FIRST.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp769-sota-gguf-code-repair
  milestone: 2026.04.59
  deliverable: results/experiment_769_sota_gguf_code_repair.json
  title: 'Exp 769: SOTA GGUF 2-Round Code Repair — Qwen3.6-35B-A3B HumanEval (GPU REQUIRED, CARNOT_FORCE_LIVE=1)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 759 (.58) showed signed_improvement=0.0 with Qwen3.5-0.8B on HumanEval
    (pass@1=0.0 — the model is simply too small to generate valid Python code). Research
    references explicitly mandate SOTA GGUF models for all headline results:
    "unsloth/Qwen3.6-35B-A3B-GGUF — Qwen 3.6 35B MoE, ~3B active params per token.
    Flagship MoE choice; highest capability per computation for reasoning / verify-repair."

    arXiv 2604.10508 ("How Many Tries Does It Take?") found iterative 2-round repair yields
    +4.9 to +17.1pp pass rate improvement on HumanEval across 7 models. All tested models
    were >= 7B. The Qwen3.6-35B MoE (~3B active params, Q4_K_M fits in 24GB VRAM) should
    reproduce these gains. This is the first credible headline code repair number for Carnot.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_759_iterative_code_repair_live.py — Exp 759 harness to adapt (not rewrite).
    - results/experiment_759_iterative_code_repair_live.json — baseline: pass@1=0.0 (model too small).
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline code repair path.
    - python/carnot/pipeline/extract.py — CodeExtractor.
    - python/carnot/pipeline/long_run_executor.py — LongRunBenchmarkExecutor (checkpoint+resume).
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Run 2-round iterative code repair on 50 HumanEval problems using Qwen3.6-35B-A3B-GGUF
    via llama.cpp. Target: signed_improvement > 0 AND inference_mode="live_gpu".

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-REPAIR-022 (SOTA GGUF code repair MUST use unsloth/Qwen3.6-35B-A3B-GGUF or
       equivalent >= 7B model; Qwen3.5-0.8B MUST NOT be used as headline code repair model),
       REQ-REPAIR-023 (signed_improvement MUST be computed from round1 vs round2 pass@1;
       n_repaired counts questions that fail round1 but pass round2),
       SCENARIO-REPAIR-042/043 to openspec/capabilities/verification/spec.md.
    3. apply_env_autofix() FIRST.
    4. GPU setup — check available VRAM before loading:
       a. Run nvidia-smi, read GPU 0 free VRAM.
       b. If free_vram_mb < 20000: warn but proceed (Q4_K_M Qwen3.6-35B-A3B needs ~20GB).
       c. Load Qwen3.6-35B-A3B-GGUF via llama-cpp-python:
          from llama_cpp import Llama
          llm = Llama.from_pretrained("unsloth/Qwen3.6-35B-A3B-GGUF", filename="*Q4_K_M*",
                                      n_gpu_layers=-1, n_ctx=4096)
       d. Run smoke test: llm("def hello():", max_tokens=20). If fails: write blocked artifact.
    5. If CARNOT_FORCE_LIVE not set: write artifact honest_verdict="blocked_no_live_gpu", exit.
    6. Load 50 HumanEval problems (use datasets: pip install datasets; load_dataset("openai/openai_humaneval")
       or use humaneval/problems.json if available locally). Sample first 50 problems.
    7. For each problem:
       Round 1:
         - Build prompt: "Complete the Python function:\n(problem['prompt'])"
         - Generate code (max_tokens=512).
         - Execute against HumanEval test cases (subprocess with 10s timeout):
           - Write code to temp file, run eval(problem['test'] + '\ncheck(' + problem['entry_point'] + ')')
         - Record: round1_pass (bool), round1_error (str or None).
       Round 2 (only if round1_pass=False):
         - Build repair prompt: "Your code failed.\nError: (round1_error)\nFix the function:\n(original_code)"
         - Generate repaired code (max_tokens=512).
         - Execute repaired code against test cases.
         - Record: round2_pass (bool).
       Checkpoint every 10 problems.
    8. Compute:
       pass_at_1_round1 = sum(round1_pass) / 50
       pass_at_1_round2 = sum(round1_pass OR round2_pass) / 50
       signed_improvement = pass_at_1_round2 - pass_at_1_round1
       n_repaired = sum(NOT round1_pass AND round2_pass)
    9. Create scripts/experiment_769_sota_gguf_code_repair.py:
       a. ExperimentTemplate(769, requires_gpu=True) + ExperimentTimeoutWatchdog(769, timeout_minutes=120).
       b. Implement steps 3-8.
       c. honest_verdict:
          - "sota_code_repair_positive" if signed_improvement > 0 AND inference_mode="live_gpu"
          - "sota_code_repair_zero" if signed_improvement == 0 AND inference_mode="live_gpu"
          - "sota_code_repair_negative" if signed_improvement < 0 (unexpected)
          - "blocked_model_load_failed" if llama-cpp load fails
          - "blocked_no_live_gpu" if CARNOT_FORCE_LIVE not set
       d. artifact: model_id, n_problems, pass_at_1_round1, pass_at_1_round2, signed_improvement,
          n_repaired, n_round2_attempted, inference_mode, honest_verdict.
    10. Write tests/python/test_experiment_769_sota_gguf_code_repair.py with 100% coverage:
        - test repair prompt includes error message from round1.
        - test pass@1_round2 >= pass@1_round1 (repair can only improve or stay same).
        - test signed_improvement = pass_at_1_round2 - pass_at_1_round1.
        - test honest_verdict maps correctly to signed_improvement and inference_mode.
        Each test traces to REQ-REPAIR-022/023.
    11. Reconcile:
        - ops/status.md: "SOTA GGUF code repair (Qwen3.6-35B-A3B): pass@1 R1=X R2=Y.
          signed_improvement=Z. inference_mode=live_gpu. honest_verdict=X."
        - ops/changelog.md: one-line with honest_verdict.
    12. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0 (24GB). Q4_K_M Qwen3.6-35B-A3B fits in ~20GB VRAM.
    apply_env_autofix() FIRST.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp770-jepa-v19-predictive
  milestone: 2026.04.59
  deliverable: results/experiment_770_jepa_v19_predictive.json
  title: 'Exp 770: JEPA v19 Predictive Verification — Real Accumulated Data Training (carried from Exp 765)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: This is the carry-over of Exp 765 which was scheduled in milestone .58 but did not
    run (absent from conductor cycle, not in results/). JEPA v19 is the mandatory self-learning
    experiment for this milestone. It trains a multi-step predictor on REAL accumulated violation
    data from live GPU experiments (not synthetic), targeting OOD AUC > 0.75.

    Background: JEPA v18 (Exp 717) OOD AUC=0.5115 (barely above random). Root cause: training
    on synthetic data produces probes that don't generalize. The fix (from arXiv 2511.06209):
    multi-step probes trained on REAL model hidden states generalize much better. Exps 742
    (200q live VR), 759/769 (code repair live), and 760/768 (Gemma4 threshold) provide the
    real violation data needed.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_reasoner_probe.py — JEPAReasonerProbe (current single-step arch).
    - results/experiment_732_jepa_5fold_cv.json — baseline: probe_5fold_auc=0.993 (in-distribution).
    - results/experiment_742_retro033_confirmation.json — 200q live VR data (real violations).
    - results/experiment_769_sota_gguf_code_repair.json — load if available (real code repair data).
    - results/experiment_768_gemma4_loader_fix_v2.json — load if available (Gemma4 VR data).
    - results/fover_labeled_steps_live.json — fallback: 57 real labeled steps (always available).
    - python/carnot/pipeline/fover_annotator.py — FOVERAnnotator for step parsing.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Train JEPA v19 (MultiStepJEPAv19 with n_steps=3 pooling) on real accumulated data.
    Target: OOD AUC > 0.75 to unlock Tier 3 cascade deployment in Exp 778.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-043 (JEPA v19 MUST be trained exclusively on real accumulated violation
       data from live GPU experiments; no synthetic data injection allowed),
       REQ-LEARN-044 (JEPA v19 OOD AUC MUST exceed 0.75 for Tier 3 deployment; otherwise
       file RETRO-JEPA-OOD-V19), REQ-LEARN-045 (MultiStepJEPAv19 MUST pool TF-IDF
       embeddings across n_steps=3 consecutive CoT steps for each training sample),
       SCENARIO-LEARN-085/086/087 to openspec/capabilities/self_learning/spec.md.
    3. Collect training data (priority order):
       a. Load results/experiment_742_retro033_confirmation.json — extract VR violation pairs.
          For each question: (question_text, cot_steps, violation_detected, label).
       b. Load results/experiment_769_sota_gguf_code_repair.json — if available, extract code pairs.
          For each problem: (prompt, round1_code, round1_error, round2_code, label=round1_pass).
       c. Load results/experiment_768_gemma4_loader_fix_v2.json — if available, extract Gemma4 pairs.
       d. Always include results/fover_labeled_steps_live.json (57 real labeled CoT steps).
       e. Pool all real pairs. Record: n_real_pairs, data_sources (list).
    4. Build MultiStepJEPAv19 architecture (create python/carnot/samplers/jepa_v19.py):
       a. MultiStepJEPAv19(hidden_dim=64, n_steps=3, output_dim=1):
          forward(steps: list[str]) -> float:
            - For each step: compute TF-IDF embedding (128-dim, fit on training corpus).
            - Pool across n_steps steps: mean pooling of embeddings.
            - 2-layer MLP on pooled embedding → scalar probability.
          train(step_sequences: list[list[str]], labels: list[int],
                n_epochs=200, lr=1e-3) -> None:
            - BCE loss, Adam optimizer.
          predict(steps: list[str]) -> float: forward() → sigmoid.
    5. Train on collected real data:
       a. 80/20 in-distribution split.
       b. OOD test: use GSM8K questions 800-999 (never seen in Exps 742/769/768).
          For OOD: generate synthetic step sequences from GSM8K text (no live GPU needed).
          Label: 0 if question is "easy" (single-step), 1 if "hard" (multi-step arithmetic).
       c. Train MultiStepJEPAv19 for 200 epochs on training split.
    6. Evaluate:
       a. In-distribution AUC (20% held-out).
       b. OOD AUC (GSM8K 800-999, 50 questions, step sequences labeled by violation_detected).
       c. Compare: OOD AUC vs v18 baseline (0.5115). Target: v19 OOD AUC > 0.75.
    7. Save model if OOD AUC > 0.75:
       Save to results/jepa_v19_model.npz (weights as numpy arrays).
       Record: model_saved_path.
    8. Create scripts/experiment_770_jepa_v19_predictive.py:
       a. ExperimentTemplate(770) + ExperimentTimeoutWatchdog(770, timeout_minutes=60).
       b. Implement steps 3-7.
       c. honest_verdict:
          - "jepa_v19_ood_viable" if ood_auc > 0.75 (Tier 3 deployment eligible)
          - "jepa_v19_improving" if 0.60 < ood_auc <= 0.75 (above v18=0.5115, below gate)
          - "jepa_v19_still_below_random" if ood_auc <= 0.5 (no progress vs v18)
          - "jepa_v19_insufficient_data" if n_real_pairs < 20
       d. artifact: n_real_pairs, data_sources, in_dist_auc, ood_auc,
          n_steps_pooled, model_saved_path (str or None), honest_verdict.
    9. Write tests/python/test_experiment_770_jepa_v19_predictive.py with 100% coverage:
        - test MultiStepJEPAv19.forward pools across exactly n_steps step embeddings.
        - test training reduces BCE loss over 10 epochs on synthetic binary data.
        - test OOD AUC computation from predictions and labels.
        - test model saved to npz when ood_auc > 0.75.
        Each test traces to REQ-LEARN-043/044/045.
    10. Reconcile:
        - ops/status.md: "JEPA v19 (Tier 3 predictive): ood_auc=X (target > 0.75, v18=0.5115).
          n_real_pairs=N. Tier 3: VIABLE/NOT YET."
          If ood_auc > 0.75: "JEPA Tier 3 UNBLOCKED. Run Exp 778 for cascade deploy."
        - ops/changelog.md: one-line with honest_verdict.
    11. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp771-ebrm-comparison
  milestone: 2026.04.59
  deliverable: results/experiment_771_ebrm_comparison.json
  title: 'Exp 771: EBRM Validation — Energy-Based Reward Model vs EORM (arXiv 2504.13134)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2504.13134 "Energy-Based Reward Models for Robust Language Model Alignment"
    (April 2025) introduces EBRM — an energy-based reward model that models the full distribution
    of noisy reward signals using an energy function over (response, reward) pairs. EBRM
    outperforms discriminative reward models on chat-hard, safety, and reasoning benchmarks.

    Carnot's EORM (Energy-based Outcome/step-level Reward Model, 55M params) is architecturally
    similar — it also uses an energy function over step sequences, trained on FoVer labeled data.
    The key difference: EBRM operates at the response level; EORM operates at the step level.

    This experiment implements EBRM as a direct comparison baseline on FoVer labeled steps.
    The result validates whether Carnot's step-level energy formulation is architecturally sound.
