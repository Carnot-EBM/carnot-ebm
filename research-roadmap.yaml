  - id: exp6462-sota-raw-persistence-uniqueness-canary
    milestone: "2026.08.556"
    deliverable: results/experiment_6462_sota_raw_persistence_uniqueness_canary.json
    title: "SOTA raw persistence and unique-event canary"
    priority: critical
    track: infrastructure
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6450-sota-fixed-policy-candidate-corpus
        verdict: "complete: fixed-policy candidate corpus finished but readiness gate stayed closed"
        addressed_by: "This task is a small persistence canary, not a full corpus. It writes one atomic file per generation, verifies nonzero bytes before parse, binds one event ID to one raw hash, and injects the zero-byte and clone failures that Exp6450 exposed."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6450 ran all three mandatory GGUFs, but 182 of 324 rows had missing or zero-byte raw output and 269 candidate rows were duplicates. Before another corpus run, V556 must prove atomic persistence and one-to-one event identity on a small live matrix. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6450_sota_fixed_policy_candidate_corpus.json and source
      - {project_root}/results/experiment_6449_generation_to_verdict_path_receipt_contract.json and source
      - {project_root}/scripts/experiment_template.py and cached_sota_pair() documentation
      - {project_root}/python/carnot/inference/sota_models.py and current GGUF runner, atomic-write, checkpoint, and receipt helpers
      - relevant inference and verification OpenSpec files and {project_root}/ops/e2e-test-plan.md

      TASK
      Run a live raw-output persistence canary across all three mandated GGUFs. Prove that each generation has a new path, nonzero durable bytes, a unique event ID, and a replayable path receipt before parsing. Detect zero-byte, duplicate-event, cloned-candidate, stale-file, and hidden-CPU attacks.

      CONCRETE STEPS
      0. Require both RTX 3090 GPUs, cached model files, embedded tokenizers, free disk and VRAM, and new output paths. Fail closed before inference when a precondition fails.
      1. Add raw-persistence REQ-* and SCENARIO-* entries. Write focused tests first.
      2. Define MODEL_SPECS with unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF through cached_sota_pair() or the same cache resolver. Use embedded tokenizers. Legacy models may smoke-test only.
      3. Seal at least four fixed units. Generate at least two independent outputs per unit and model with frozen prompts and settings.
      4. Allocate the final path and event ID before generation. Write to a temporary file, fsync where supported, atomically rename, then verify byte count and SHA-256 before parse.
      5. Bind event ID, unit ID, model file hash, tokenizer hash, device samples, prompt hash, raw hash, parse hash, checker hash, and verdict through the Exp6449 receipt chain.
      6. Emit per_unit_rows for every generation and injected attack. Do not count text equality as event uniqueness.
      7. Attack zero-byte rename, stale preexisting path, reused event ID, same raw path under two rows, cloned candidate row, model substitution, CPU fallback, and receipt reordering.
      8. Run live inference, focused tests, row consistency, adversarial verification, and relevant E2E checks.
      9. Set raw_persistence_canary_ready_score=1.0 only when every normal generation has nonzero durable bytes and a one-to-one event/path/hash binding, and every attack fails closed.

      Required deliverable: {project_root}/results/experiment_6462_sota_raw_persistence_uniqueness_canary.json.
      REQUIRED ARTIFACT FIELDS:
      status, MODEL_SPECS, models_used, cached_sota_pair_receipts, model_file_and_embedded_tokenizer_hashes, autotokenizer_usage_count, device_and_runner_receipts, sealed_unit_manifest, event_path_allocation_receipts, atomic_write_receipts, raw_output_manifest, per_unit_rows, one_event_one_path_one_hash_check, nonzero_durable_byte_check, raw_text_equality_diagnostic, cpu_fallback_count, attack_matrix, aggregate_row_recomputation, current_adversarial_findings, raw_persistence_canary_ready_score, protected_files_unchanged, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for byte, hash, receipt, and exact-checker arithmetic. A blocked_* verdict requires gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6462_sota_raw_persistence_uniqueness_canary --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6463-sota-fixed-policy-candidate-corpus-v2
    milestone: "2026.08.556"
    deliverable: results/experiment_6463_sota_fixed_policy_candidate_corpus_v2.json
    title: "Gated on Exp6462 canary readiness: provenance-complete fixed-policy corpus v2"
    priority: critical
    track: sota-ingestion
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 480
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6462-sota-raw-persistence-uniqueness-canary
        artifact_field: raw_persistence_canary_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6450-sota-fixed-policy-candidate-corpus
        verdict: "complete: fixed-policy candidate corpus finished but readiness gate stayed closed"
        addressed_by: "This rerun depends on a live persistence canary, checkpoints after each generation, four presealed partitions, one event/path/hash binding, and explicit nonzero-byte and candidate-diversity gates before downstream readiness."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6450 did not produce a valid evidence substrate. Exp6462 adds the missing atomic-write and event-identity prerequisite. This task rebuilds the fixed-policy corpus with sealed development, allocation-held, selection-held, and audit-held partitions. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6462_sota_raw_persistence_uniqueness_canary.json and source
      - {project_root}/results/experiment_6450_sota_fixed_policy_candidate_corpus.json, raw manifest, and source
      - {project_root}/results/experiment_6449_generation_to_verdict_path_receipt_contract.json
      - {project_root}/scripts/experiment_template.py, cached_sota_pair(), and embedded-tokenizer helpers
      - fixed-policy simulator, exact checker, checkpoint, and receipt code under {project_root}/python/carnot
      - relevant OpenSpec files and {project_root}/ops/e2e-test-plan.md

      TASK
      Build a fresh provenance-complete fixed-policy candidate corpus with all three mandated local GGUFs. Seal four partitions before inference. Preserve one nonzero raw file per event, exact labels, and measurable selection headroom. Do not make a model-ranking claim.

      CONCRETE STEPS
      0. Pre-gate on raw_persistence_canary_ready_score==1.0. If it fails, emit blocked_gate_check_failed with gate_check_summary and stop.
      1. Add corpus-v2 REQ-* and SCENARIO-* entries. Write focused tests first.
      2. Define MODEL_SPECS with unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF through cached local resolution and embedded tokenizers.
      3. Seal at least 48 fixed-policy units: 12 development, 12 allocation-held, 12 selection-held, and 12 audit-held. Hash all labels and membership before generation.
      4. Generate at least three candidates per unit and model. Use a new event ID and atomic raw path for every generation. Checkpoint after every event and resume without repeating completed events.
      5. Parse once with the fixed parser. Record parse failure without repair. Run the deterministic simulator and exact checker on parsed plans.
      6. Emit per_unit_rows with unit, partition, model, candidate, event ID, raw path and hash, parse result, exact result, device receipt, and timing.
      7. Require mixed exact outcomes and positive candidate-selection headroom in each held partition. Report exact successes and parse failures by model, but do not rank models.
      8. Attack zero-byte files, event reuse, candidate cloning, held exposure, membership reassignment, parser repair, CPU fallback, exact-veto bypass, and aggregate mismatch.
      9. Run live inference, focused tests, row consistency, adversarial verification, spec coverage, and relevant E2E checks.
      10. Set sota_corpus_ready_score=1.0 only if all models have eligible rows, every event is provenance-complete, partitions stayed sealed, labels recompute, every held split has headroom, and critical findings are zero.

      Required deliverable: {project_root}/results/experiment_6463_sota_fixed_policy_candidate_corpus_v2.json.
      REQUIRED ARTIFACT FIELDS:
      status, MODEL_SPECS, models_used, cached_sota_pair_receipts, model_file_and_embedded_tokenizer_hashes, autotokenizer_usage_count, device_and_runner_receipts, sealed_problem_and_partition_manifest, exposure_ledger, checkpoint_and_resume_receipts, raw_output_manifest, event_identity_manifest, fixed_parser_and_checker_hashes, per_unit_rows, eligible_rows_by_model_and_partition, parse_failures_by_model, exact_outcomes_by_model_and_partition, candidate_headroom_by_partition, one_event_one_path_one_hash_check, cpu_fallback_count, aggregate_row_recomputation, attack_matrix, current_adversarial_findings, sota_corpus_ready_score, protected_files_unchanged, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for the deterministic simulator, checker, and row arithmetic. A blocked_* verdict requires gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6463_sota_fixed_policy_candidate_corpus_v2 --date {date}
