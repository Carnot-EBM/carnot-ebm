milestone: "2026.05.330"
milestone_title: "Verifier Cross-Domain Value, DE-CONTAMINATED — was '.329 math-only' a real limitation or a failed positive control? Build the missing factual-grounding verifier and re-test on realistic corpora."
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md

# OUTER-LOOP / OPERATOR PRE-STAGED ROADMAP (2026-05-31, Claude Opus 4.8). PIVOT RATIONALE:
# .329 concluded the verifier ensemble is "math-only, domain-bound" (exp3576). Reading the artifacts
# shows that null is CONTAMINATED — the positive control FAILED (FALSE_NEGATIVE_RISK, CLAUDE.md
# Reading-Results Discipline): on facts the model-confidence baseline scored AUROC 1.0 (degenerate
# corpus, no headroom) and EVERY per-verifier scored exactly 0.50 (inert — only 2 verifiers were even
# in the ensemble, none of them factual-applicable); on code the ensemble scored 0.44 (worse than
# random, verifiers never fired). Before accepting "Carnot's verifier is math-only," .330 runs the
# positive control: REALISTIC corpora where confidence is NOT a perfect detector, scored with the
# verifiers that actually APPLY per domain — AND builds the missing factual-grounding verifier
# (retrieval + atomic-claim NLI entailment, the Mu-SHROOM/HalluSearch SOTA recipe; peer EBM judge
# arXiv:2505.14999 claims energy verifiers DO generalize OOD when trained on reasoning-validity).
# Either outcome is genuine learning: verifiers fire -> the .329 null was an artifact, value generalizes
# (broader paper); verifiers still don't fire on a fair test -> "math-only" is EARNED, a precise honest
# limitation. G1-G4 met, paper_ready=true (do NOT regress). P0.1 stays honest-negative (do NOT re-test
# Route-1/Route-2). All tasks default agent_type: gemini (claude->gemini coercion enforces it).

tasks:
  - id: exp3583-archive-v329-activate-v330
    operator_override: "2026-05-29 operator directive (standing): routine milestone-transition (archive-vN-activate-vN+1) — false-positive scope-match vs prior archive-v* tasks; structurally never a doomed rerun."
    milestone: "2026.05.330"
    title: "Archive milestone .329 honestly and activate .330 (verifier cross-domain DE-CONTAMINATION pivot)"
    priority: critical
    max_turns: 20
    agent_type: gemini
    estimated_wall_time_min: 6
    track: ops
    inference_substrate: aggregation_from_upstream_artifacts
    requires_gpu: false
    deliverable: results/experiment_3583_archive_v329_activate_v330.json
    prompt: |
      CONTEXT: .329 concluded the verifier ensemble is "math-only domain-bound" (exp3576), BUT that null is
      contaminated — the positive control failed (facts: confidence AUROC=1.0 degenerate corpus + all
      per-verifier=0.5 inert; code: ensemble AUROC=0.44 worse-than-random). .330 re-runs the test honestly
      with realistic corpora + applicable verifiers, and builds the missing factual-grounding verifier.
      G1-G4 met, paper_ready=true — do NOT regress. P0.1 stays honest-negative — do NOT re-test Route-1/2.
      EXISTING CODE TO READ FIRST: research-roadmap.yaml (.329, the just-finished milestone),
      results/experiment_3573/3574/3575/3576 (the contaminated null), ops/north-star.md.
      TASK: archive .329 to research-complete.yaml honestly, confirm .330 active.
      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "Terminal prefix lets the conductor reconciler classify the transition as complete without re-running it."
        inference_substrate: {{value: aggregation_from_upstream_artifacts, principle: "Declares this is a JSON-read + format task, not live inference (0.0001s floor)."}}
        v329_headline_recorded_as: {{principle: "Records that .329's defensible result is the contaminated null, not a clean 'math-only' finding — prevents the false verdict propagating to the paper."}}
        paper_ready_preserved: {{principle: "G1-G4 stay met; the transition must not silently regress paper_ready."}}
        n_tasks_archived: {{principle: "Sample-size hygiene — confirms the full milestone was archived, not a partial."}}
        random_seed: {{principle: "Determinism precondition for reproducibility."}}
        reproducibility_checksum: {{principle: "Content hash catches silent drift between this artifact and any replication."}}
        duration_s: {{principle: "Wall-clock plausibility floor; missing duration is the fabrication signal."}}
