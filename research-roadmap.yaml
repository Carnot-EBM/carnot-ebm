  - id: exp4256-arc-oracle-distinct-leak-audit
    milestone: 2026.06.394
    title: "PHASE A1 (HEADLINE; cross-check the surprising win) -- LEAK-AUDIT the +44pp ARC oracle-distinct win. exp4245 won by +0.4423 (CI95 [0.308,0.596]) but positive labels = exact match to gold/GAP-4-INDUCED pred_grid and features include shape/palette-family + duplicate-counts that could encode candidate ORIGIN (induced-program output vs sampled candidate) rather than correctness -- a leaked/circular detector would inflate AUROC to ~0.96 and the delta to +44pp while NOT being oracle-distinct. AUDIT: (1) train an explicit candidate-ORIGIN probe (predict induced-vs-sampled from the features) and measure how predictive it is AND whether origin correlates with is_correct (the leak signature); (2) RE-RUN the decisive beats-vote gate with PROVENANCE-BLIND features (strip every origin-encoding feature, keep only genuinely oracle-distinct CONTENT signals: vote-priors, cross-candidate agreement, self-consistency margin); report the provenance-blind delta + CI95 vs the .393 +0.4423. Emit win_survives_provenance_blind BARE bool (delta>0 AND CI95 excl 0 on provenance-blind features). verifier_is_oracle=false. A SURVIVING win is decision-grade; a COLLAPSE (the win was provenance leak) is an even MORE important decision-grade negative that STOPS the DiffusionGemma scale-up."
    priority: critical
    track: verifier-oracle-distinct
    max_turns: 80
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct ARC verifier is MANDATED by the 2026-06-14 P0 directive (HEADLINE oracle-distinct verifier) -- false-positive scope-match vs retired GAP-3 content-EBM lineage / the .393 ARC gate (exp4245); forward difference = a LEAK-AUDIT (provenance-blind features + candidate-origin probe) of the +44pp win per CLAUDE.md cross-check-surprising-results, verifier_is_oracle=false. NOT a re-run for the same number; a harder test that can only confirm or refute."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4256_arc_oracle_distinct_leak_audit.json
    prompt: |
      CONTEXT: The .393 ARC win (exp4245, +0.4423, CI95 [0.308,0.596]) is the program's #1 positive and is
      SURPRISING (+44pp from a TIE). CLAUDE.md "Adversarial Artifact Verification + Sample-Size Rigor" mandates
      cross-checking surprising results before they headline. The specific risk: the grown pool's positives are
      defined by exact-match to the GAP-4 INDUCED pred_grid, and features include origin-correlated signals
      (shape/palette-family indicators, duplicate counts). If the verifier learned candidate PROVENANCE
      (induced-vs-sampled) instead of correctness, the win is leaked/circular -- high AUROC, big delta, but NOT
      oracle-distinct. Methods: data-contamination survey (arXiv:2502.14425), in-context contamination
      detection (arXiv:2510.27055) -- behavior-based + provenance checks.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4245_arc_set_encoder_beats_vote.json (the win + model_specs feature list)
        - results/experiment_4244_arc_set_encoder_aggregator_build.json + results/experiment_4244_arc_set_encoder_aggregator_model.json (the trained model + feature set)
        - results/experiment_4243_arc_candidate_pool_grow.json + results/experiment_4243_arc_candidate_pool_grow_pool.json.gz (the grown pool: per-task candidate sets, is_correct labels, candidate provenance/source)
        - scripts/exp_verifier_detector_auroc.py (the ARC label/feature path), scripts/adversarial_verify.py, scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: leak-audit the +44pp win -- origin probe + provenance-blind re-test of the decisive gate.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any analysis):
           a. The grown pool loads: `python3 -c "import json,gzip; json.load(gzip.open('results/experiment_4243_arc_candidate_pool_grow_pool.json.gz'))"`.
           b. The per-candidate provenance/source field exists in the pool (which candidates came from GAP-4
              induced programs vs sampled). If provenance is NOT recoverable -> reconstruct it by joining the
              pool candidates back to results/arc3_gap4_induced_programs.json pred_grids (induced) vs
              results/arc3_gap3_stage2_eval_pool.json.gz (sampled). If still unrecoverable -> honest_verdict
              `blocked_arc_provenance_unrecoverable` and STOP. CPU is sufficient; no GGUF/GPU.
        1. ORIGIN PROBE: train a classifier to predict candidate ORIGIN (induced vs sampled) from the SAME
           feature set the .393 verifier used. Report origin_probe_auroc. Then measure the LEAK SIGNATURE:
           corr(origin, is_correct) and the fraction of positives that are induced-origin. A high
           origin_probe_auroc COMBINED with high corr(origin, is_correct) is the leak (the verifier could win by
           detecting origin).
        2. PROVENANCE-BLIND RE-TEST: re-run the decisive beats-vote gate on the SAME held-out split but with
           PROVENANCE-BLIND features only -- strip every feature that encodes origin (shape/palette-family
           indicators, duplicate counts, anything correlated with origin_probe at high weight) and keep only
           genuinely oracle-distinct CONTENT signals (vote priors, cross-candidate agreement, self-consistency
           margin, per-cell modal agreement). Report provenance_blind_delta (set_encoder@1 - vote@1) + task-level
           bootstrap CI95 (>=2000 resamples) vs the .393 +0.4423.
        3. Emit win_survives_provenance_blind BARE bool := (provenance_blind_delta > 0 AND its CI95 excludes 0).
           Run adversarial_verify.py (CIRCULAR_MOAT_OVERCLAIM must stay clean; verifier_is_oracle=false). Declare
           random_seed + reproducibility_checksum + model_specs. Do NOT emit duplicate raw counts as distinct
           metrics (TAUTOLOGY false-positive). HONEST framing: a survive is the hardened win; a collapse means
           the +44pp was provenance leak (decision-grade -- it STOPS the scale-up).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A surviving provenance-blind win AND a collapse (the win was leak) are BOTH COMPLETE and decision-grade."
        win_survives_provenance_blind:
          principle: "BARE bool: A4/B1 gate on this raw value (gated-fields-must-be-bare); true iff the beats-vote delta>0 AND CI95-excl-0 on provenance-BLIND features -- the de-leaked headline."
        origin_probe_auroc:
          principle: "BARE float: AUROC of a classifier predicting candidate ORIGIN (induced-vs-sampled) from the .393 features -- high value flags that origin is encoded in the features."
        origin_correctness_corr:
          principle: "BARE float: correlation between candidate origin and is_correct -- the leak signature is high origin_probe_auroc AND high origin_correctness_corr (the verifier could win by detecting provenance)."
        provenance_blind_delta:
          principle: "set_encoder@1 - vote@1 with origin-encoding features removed -- the de-leaked oracle-distinct lift; compare to the .393 +0.4423."
        provenance_blind_ci95:
          principle: "Task-level bootstrap CI95 of the provenance-blind delta -- excluding 0 is what makes the de-leaked win real."
        verifier_is_oracle:
          principle: "BARE bool=false -- the de-leaked verifier scores content WITHOUT executing demos; only this keeps an A4/B1 build headline/gate-eligible."
        random_seed:
          principle: "Determinism precondition; the held-out split + bootstrap must be reproducible."
        reproducibility_checksum:
          principle: "Hash of the pool + provenance join + feature set; lets a third party re-run the audit."
        model_specs:
          principle: "The origin-probe + provenance-blind feature partition (which features were stripped and why); required methodology."
      ACCEPTANCE GATE:
        - condition: "win_survives_provenance_blind reported with origin_probe_auroc + origin_correctness_corr + provenance_blind_delta + provenance_blind_ci95 AND verifier_is_oracle=false, OR an honest blocked_arc_provenance_unrecoverable verdict"
          principle: "The +44pp win cannot headline or justify scale-up until it survives provenance-blind features; a collapse is the more important negative (stops a leaked scale-up)."

      Run: `python3 {project_root}/results/experiment_4256_arc_oracle_distinct_leak_audit.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4257-arc-oracle-distinct-multiseed-replication
    milestone: 2026.06.394
    title: "PHASE A2 (HEADLINE; cross-check the surprising win) -- MULTI-SEED + INDEPENDENT replication of the +44pp ARC oracle-distinct win. exp4245 reported delta +0.4423 on a SINGLE seed (4245), n=52. A surprising result is not headline-eligible until replicated (n>1 seeds, same direction; CLAUDE.md). RE-RUN the decisive beats-vote gate across >=5 SEEDS (independent fold reshuffles of the train/held-out split over the grown pool), report per-seed delta + the MEAN delta + a cross-seed CI (and flag any seed where the win flips sign). SEPARATELY, an INDEPENDENT clean-room re-score: reload the persisted A1/.393 pool artifact and recompute set_encoder@1, vote@1, oracle@K via a SECOND code path (not the .393 script) to confirm the numbers reproduce off the artifact (mirrors the G2 FoVer independent-reproducer pattern). Emit oracle_distinct_win_replicates BARE bool := (mean cross-seed delta>0 AND cross-seed CI excl 0 AND the independent re-score lands within the .393 CI). verifier_is_oracle=false."
    priority: critical
    track: verifier-oracle-distinct
    max_turns: 80
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct ARC verifier is MANDATED by the 2026-06-14 P0 directive -- false-positive scope-match vs retired GAP-3 content-EBM lineage / the .393 ARC gate (exp4245); forward difference = MULTI-SEED (>=5) + an INDEPENDENT clean-room replication of the single-seed +44pp win per CLAUDE.md cross-check-surprising-results, verifier_is_oracle=false."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4257_arc_oracle_distinct_multiseed_replication.json
    prompt: |
      CONTEXT: The .393 ARC win (exp4245, +0.4423) is single-seed (4245), n=52. Before it anchors the headline
      or justifies the DiffusionGemma scale-up, it must reproduce across seeds AND off the persisted artifact via
      an independent path. This is the program's #1 positive -- it deserves the same independent-reproducer rigor
      the FoVer headline got (north-star §2 G2).

      EXISTING CODE TO READ FIRST:
        - results/experiment_4245_arc_set_encoder_beats_vote.json (the single-seed win + gate protocol)
        - results/experiment_4244_arc_set_encoder_aggregator_build.json + _model.json (the trainable set-encoder + folds)
        - results/experiment_4243_arc_candidate_pool_grow_pool.json.gz (the grown pool to re-split)
        - scripts/exp_verifier_detector_auroc.py, scripts/adversarial_verify.py, scripts/summarize_artifact.py
        - CLAUDE.md "Adversarial Artifact Verification + Sample-Size Rigor", "Circularity / Oracle-Distinctness Discipline"

      TASK: replicate the decisive gate across >=5 seeds + an independent clean-room re-score off the artifact.

      CONCRETE STEPS:
        0. PRECONDITIONS: the grown pool + the .393 set-encoder config load (per A1's preconditions). If the
           pool is missing -> honest_verdict `blocked_arc_grown_pool_missing` and STOP. CPU sufficient.
        1. MULTI-SEED: for each of >=5 seeds, independently reshuffle the train/held-out TASK split over the
           grown pool, retrain the set-encoder out-of-fold, and compute set_encoder@1 - vote@1 on that seed's
           held-out tasks. Report per_seed_deltas (list), mean_delta, and a cross-seed CI (e.g. mean +/- t*se or
           bootstrap over seeds). Flag any seed where the delta <= 0 (sign flip = fragility).
        2. INDEPENDENT RE-SCORE: in a SEPARATE function (not importing the .393 gate code), reload the persisted
           pool + the .393 trained model artifact and recompute set_encoder@1, vote@1, oracle@K directly. Confirm
           it lands within the .393 reported CI [0.308, 0.596]. Report independent_rescore_delta.
        3. Emit oracle_distinct_win_replicates BARE bool := (mean_delta>0 AND cross-seed CI excl 0 AND
           independent_rescore_delta within the .393 CI). Run adversarial_verify.py (clean; verifier_is_oracle=false).
           Declare random_seeds_used (the list) + reproducibility_checksum + model_specs. HONEST framing: a clean
           multi-seed replication hardens the win; a sign-flip or out-of-CI re-score means the single-seed result
           was fragile (decision-grade -- it gates A4/B1 off).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A clean multi-seed replication AND an honest fragility finding are BOTH COMPLETE and decision-grade."
        oracle_distinct_win_replicates:
          principle: "BARE bool: A4/B1 gate on this raw value (gated-fields-must-be-bare); true iff mean cross-seed delta>0 AND CI excl 0 AND the independent re-score lands within the .393 CI."
        per_seed_deltas:
          principle: "List of set_encoder@1 - vote@1 per seed -- exposes single-seed fragility; a sign-flip on any seed is a fragility flag."
        mean_delta:
          principle: "BARE float: mean cross-seed delta -- the replicated lift (compare to the single-seed +0.4423)."
        cross_seed_ci95:
          principle: "Cross-seed CI of the delta -- excluding 0 distinguishes a robust win from a single-seed fluke."
        independent_rescore_delta:
