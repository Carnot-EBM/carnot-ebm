- id: exp7019-arc-belief-stream-fixture
  title: Immutable ARC chronological belief-stream fixture
  track: arc-generalization
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.09.615
  deliverable: results/experiment_7019_arc_belief_stream_fixture.json
  prompt: |
    CONTEXT:
    Exp7010 established one ARC evaluation provenance schema. Exp7005 found
    eight readable live attempt manifests, 17 construction transitions, and
    10 held target transitions, but its simulation engine did not beat both
    controls. V615 needs an immutable chronological stream for a different
    mechanism: explicit current-state belief learned only from prior actions
    and observations.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/ops/arc_solve_registry.yaml
    - {project_root}/results/experiment_7010_arc_eval_provenance_contract.json
    - {project_root}/results/experiment_7005_arc_live_envelope_audit.json
    - {project_root}/results/experiment_5155_multilevel_belief_state_scoping_v472.json
