         c. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.

      1. Implement MCHFSTFilter at python/carnot/pipeline/mch_fst_filter.py:
         MH acceptance: accept_prob = min(1, exp(-(energy_after - energy_before)))

      2. Validate on 10 cached telemetry entries:
         For each entry, simulate token-level MH acceptance:
           energy_before = IsingEnergy(response[:t])
           energy_after  = IsingEnergy(response[:t+1])
           acceptance_rate = fraction of tokens accepted under MH rule
         Compute: mean_acceptance_rate, mean_energy_reduction_ratio.

      3. Compare MH-filtered vs unfiltered constraint violations (NSVIF):
         mch_violation_reduction: (unfiltered_violations - mch_filtered_violations) / unfiltered_violations

      4. Unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/pipeline/ -k "mch" -v --no-cov 2>&1 | tail -15

      5. Write deliverable.

