      Exp5762/5763 credited solver-certified constraint acquisition on a synthetic exact benchmark, but Exp5708's earlier prospective SOTA stream parse-failed and Exp5709 gate-blocked. DRIFT-Bench shows that satisfiable answer drift can dominate contradiction, while arXiv:2601.01490 warns that apparent constraint compliance can hide protected-fact distortion. This task builds the missing parse-safe prospective stream and does not learn constraints. Today is {date}.

