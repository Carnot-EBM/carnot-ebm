- id: exp1197-phase4-bfs-intractable-puzzles
  milestone: 2026.04.93
  deliverable: results/experiment_1197_phase4_bfs_intractable_puzzles.json
  title: "Phase 4 ARC-AGI-3 Harder Puzzles — BFS-Intractable 15x15 Grids"
  agent_type: claude
  model: opus
  max_turns: 50
  estimated_wall_time_min: 35
  priority: high
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1189-phase4-stronger-baseline-10x10
      verdict: phase4_tied_with_bfs
      addressed_by: "exp1189 synthetic puzzles were all BFS-tractable (bfs_intractable=0/20) and all energy traces [0.0,...] — the Blocked Gibbs sampler was given pre-solved problems where E=0 from the initial state. This attempt generates genuinely hard puzzles: (1) grid size 15x15 or larger with high branching factor (>50 actions per state), (2) multi-step dependency structure where partial solutions create dead-ends, (3) BFS state limit 100k will be hit on >50% of puzzles, (4) initial energy is non-zero and must actually decrease."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Phase 4 active inference (Blocked Gibbs free-energy minimization) showed no advantage
    over BFS in exp1189: all 20 synthetic puzzles had energy traces [0.0, 0.0, ...] (initial
    energy=0, sampler idle) and BFS was tractable on all of them (bfs_intractable=0/20).

    The root cause: the synthetic puzzle generator created problems where the initial state
    already satisfied all constraints (E=0 at start). Phase 4 had nothing to do — Blocked
    Gibbs can only help when the initial energy is nonzero and it must find a lower-energy
    state.

    This experiment fixes the puzzle generator to produce genuinely hard problems:
    - 15x15+ grids with high branching factor (50+ valid actions per state)
    - Initial state has E > 0 (constraint violations present)
    - Multi-step dependency: solving one constraint may create another violation
    - BFS hits 100k state cap on >50% of puzzles (verified intractability)
    - Phase 4 energy minimization must find a path BFS cannot enumerate

    EXISTING CODE TO READ FIRST:
    - python/carnot/phase3/active_inference_pilot.py (Phase 4 Blocked Gibbs implementation)
    - results/experiment_1189_phase4_stronger_baseline_10x10.json (failed: all E=0, tied BFS)
