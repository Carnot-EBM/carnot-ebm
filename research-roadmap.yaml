    Execution: inference_substrate_class=aggregation; MODEL_SPECS=[].

    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed progress line immediately. Resolve {project_root} absolutely. Check required input bytes, schemas and owned resources before measurement. Missing external prerequisites produce complete_blocked_<reason>, verdict_class=blocked and gate_check_summary. Preserve unrelated edits. Planned outputs are not required existing inputs.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER any potentially minutes-long model load, generation, benchmark or subprocess. Print elapsed time and completed units INSIDE every long loop at least every 60 seconds. Stream child output with an owned heartbeat. Keep every silence gap under 600 seconds to retain the 4800-second cap. A silent task can die at 1200 seconds. Checkpoint completed work; never pad duration.

    3. Bound each tool call. Write any file over about 200 lines in several calls of roughly 100-150 lines. Send a progress message BETWEEN calls. Split large reads and checks. Put throwaway probes in /tmp, experiment CLIs in scripts/experiments and tests in tests/python.

    4. Before code, add task REQ-* and SCENARIO-* requirements to the relevant capability spec. Write meaningful failing tests first. Freeze the complete affected validation scope before measurements. Keep numerical code, experiment orchestration and the CLI separate. Finish private end-to-end tests before expensive data capture.

    5. Read existing board inventory and dated evidence once. This is an unconditional continuity audit, not hardware integration or bring-up. Do not repeat an unchanged probe, claim new FPGA execution, buy equipment or regenerate a bitstream.

    6. For KV260, record authenticated SSH-based quadratic fabric evidence and k_max<=5 plus transport limits. For PolarFire, retain Linux CPU-only evidence. For GateMate, retain the 0xffffffff physical/JTAG blocker. Name the exact changed prerequisite and evidence needed to reopen each. Missing host-mounted storage is not a KV260 failure.

    7. Read Exp7750 if it exists and is eligible. Map measured service fractions to existing board-supported operations; report unmeasured where no mapping exists. Finite set normalization, learned feature construction and nonlinear inference are not automatically quadratic Ising kernels. Exp7750 absence must appear in gate_check_summary but does not prevent completing the inventory audit.

    8. Check the already captured Extropic Z1T source and Kona disclosure level. Distinguish vendor projected energy, dense-readout inclusion, local silicon access and reproducible SDK evidence. TSU/NPU remain unavailable/unqualified unless new operator-provided evidence exists; do not infer access from a paper.

    9. Write docs/research-notes/v674-hardware-continuity.md with one row per substrate, original evidence date/hash, supported workload, blocker, reopening condition and bounded next experiment. No hardware advantage, continuous-learning throughput or NFR-01 claim may be inferred from host-only evidence.

    10. Task E2E: Run the thin CLI on private fixture inputs, then cold-reduce its raw rows in a fresh process. Reject changed input hashes and mismatched summaries.

