- id: exp564-coace-extractor-impl
  milestone: 2026.04.43
  deliverable: results/experiment_564_coace_extractor.json
  title: 'Exp 564: CoACEExtractor — Code-Assisted Constraint Extraction (RETRO-061
    Fix, arXiv 2510.04081)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-061 CRITICAL\
    \ — VeriCoTStepValidator and VPRMArithmeticVerifier both produce 0 true positives\
    \ on 25 known-incorrect live IT-model responses (Exp 554). Root cause: both extractors\
    \ check FORMAT (regex patterns, Z3 UNSAT) but IT models produce correct-FORMAT,\
    \ wrong-ARITHMETIC outputs. Example: 'We add 47 and 28 to get 76' passes Z3 and\
    \ passes VPRM pattern checks — but 47+28=75, not 76. The fix (Caco, arXiv 2510.04081):\
    \ parse arithmetic expressions from prose and EXECUTE them as Python. eval('47+28')=75\
    \ != 76 → violation. This is CPU-only and does not require live GPU.\n\nEXISTING\
    \ CODE TO READ FIRST:\n- python/carnot/extraction/vericot_step_validator.py —\
    \ VeriCoTStepValidator (understand the Z3 approach we are NOT using)\n- python/carnot/extraction/vprm_verifier.py\
    \ — VPRMArithmeticVerifier (understand the pattern approach we are NOT using)\n\
    - python/carnot/extraction/__init__.py — exports to add CoACEExtractor\n- results/experiment_554_extraction_diagnostic.json\
    \ — diagnostic result (tp_rate=0 for VeriCoT and VPRM)\n- python/carnot/pipeline/verify_repair.py\
    \ — VerifyRepairPipeline (understand how extractors are plugged in)\n\nTASK: Implement\
    \ CoACEExtractor — execution-based arithmetic constraint extraction.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Add REQ-EXTRACT-031 (CoACEExtractor: parse arithmetic\
    \ from prose CoT and execute to detect violations), REQ-EXTRACT-032 (safe execution\
    \ sandbox for arithmetic eval), SCENARIO-EXTRACT-058/059/060/061 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Create python/carnot/extraction/coace_extractor.py:\n   a. ArithmeticEquation\
    \ dataclass: lhs_expr (str), rhs_value (float), stated_result (str), confidence\
    \ (float).\n   b. CoACEViolation dataclass: equation (ArithmeticEquation), computed_value\
    \ (float), stated_value (float), absolute_error (float), relative_error (float),\
    \ is_violation (bool).\n   c. CoACEResult dataclass: n_equations_found (int),\
    \ n_violations (int), violations (list[CoACEViolation]), extraction_mode (str),\
    \ confidence_weighted_violations (int).\n   d. _parse_arithmetic_equations(text:\
    \ str) -> list[ArithmeticEquation]:\n      - Use re.findall to match patterns like\
    \ (number op number [op number]* = number).\n      - Patterns to handle: simple\
    \ addition/subtraction/multiplication/division (e.g. '47 + 28 = 76'), chained\
    \ ops (e.g. '47 + 28 + 5 = 80'), with/without spaces, written as 'equals', 'gives',\
    \ 'is', 'results in', '='.\n      - For each match: lhs_expr = left side as Python-eval\
    \ string (replace x with *), rhs_value = float(right side).\n      - confidence:\
    \ 1.0 if exact '=' found, 0.8 if 'equals/gives/is', 0.5 if 'approximately'.\n\
    \   e. _safe_eval(expr: str) -> float | None:\n      - Use ast.parse(expr) to\
    \ validate it is a literal arithmetic expression (no function calls, no attribute\
    \ access, no names).\n      - Only allow: ast.BinOp, ast.Num, ast.UnaryOp, ast.Constant\
    \ with numeric values.\n      - If validation passes, eval(expr) with empty locals/globals\
    \ and return result.\n      - Return None if parse fails or exception occurs (graceful).\n\
    \   f. CoACEExtractor class:\n      - __init__(self, tolerance=1e-6, min_confidence=0.5)\n\
    \      - extract(self, response: str) -> CoACEResult:\n          * Call _parse_arithmetic_equations(response).\n\
    \          * For each equation, call _safe_eval(lhs_expr).\n          * If computed\
    \ != None and abs(computed - rhs) > tolerance and eq.confidence >= min_confidence:\
    \ mark as violation.\n          * Return CoACEResult.\n      - to_constraint_terms(self,\
    \ result: CoACEResult) -> list[ConstraintTerm]: convert violations to ConstraintTerm\
    \ format for VerifyRepairPipeline compatibility.\n   g. Export CoACEExtractor,\
    \ CoACEResult, CoACEViolation, ArithmeticEquation from carnot.extraction.__init__.\n\
    4. Write scripts/experiment_564_coace_extractor.py:\n   a. apply_env_autofix()\
    \ FIRST.\n   b. ExperimentTimeoutWatchdog(564, timeout_minutes=20).\n   c. ExperimentTemplate(564,\
    \ 'CoACEExtractor Implementation',\n      'results/experiment_564_coace_extractor.json',\
    \ requires_gpu=False).\n   d. Load 20 hardcoded test cases — 10 with arithmetic\
    \ errors (e.g. '47 + 28 = 76', '15 * 4 = 55', '100 / 5 = 25') and 10 correct\
    \ — same format as IT model prose CoT.\n   e. Run CoACEExtractor on all 20.\n\
    \   f. Compute: correct_cases_tp=violations_on_incorrect_cases, fp=violations_on_correct_cases.\n\
    \   g. Build artifact: schema='carnot.coace_extractor.v1',\n      n_test_cases=20,\n\
    \      n_incorrect_cases=10, n_correct_cases=10,\n      tp_rate=correct_cases_tp/10,\n\
    \      fp_rate=fp/10,\n      retro_061_partial=<tp_rate>0>,\n      honest_verdict='extraction_viable'\
    \ if tp_rate>0.5 else 'extraction_partial' if tp_rate>0 else 'extraction_zero'.\n\
    \   h. tmpl.assert_deliverable_written() as FINAL LINE.\n5. Write tests/python/test_coace_extractor.py\
    \ (100% coverage on coace_extractor.py):\n   a. Test _parse_arithmetic_equations\
    \ finds '47 + 28 = 76'.\n   b. Test _safe_eval('47+28') returns 75.0.\n   c. Test\
    \ _safe_eval('__import__(\"os\")') returns None (safety).\n   d. Test extract()\
    \ flags '47+28=76' as violation.\n   e. Test extract() does NOT flag '47+28=75'\
    \ as violation.\n   f. Test extract() handles prose: 'we add 47 and 28 to get\
    \ 76' — at minimum flags the equation form.\n   g. Ensure 100% coverage on coace_extractor.py.\n\
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile: _bmad/traceability.md\
    \ (new REQ rows), ops/conductor-log.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

