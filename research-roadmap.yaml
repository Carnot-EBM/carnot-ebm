  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 30
  prior_failures:
    - experiment_id: exp936-nk-kaem-multilevel
      verdict: partial_optimizer_unstable
      addressed_by: "Root cause: NK diverged on cold initialization; deep layers destabilized without LR decay. Fix: (1) warm-start from Adam at G=4 before switching to NK; (2) per-layer LR decay lr_i = base_lr/(1+i); (3) gradient clipping ||∇|| <= 1.0; (4) multilevel schedule from coarse to fine grid."
