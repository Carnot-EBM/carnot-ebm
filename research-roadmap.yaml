        2. Load Exp 2864 rows and labels plus any verifier traces available from
           the `.271` pipeline.
        3. Define deterministic error buckets: data-grounding, reasoning-chain,
           extraction/format, unsupported, and unknown.
        4. Compute localization/verifiability metrics: fraction with an
           actionable violated constraint, agreement between label and verifier
