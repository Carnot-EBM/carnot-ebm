  - id: exp2687
    milestone: "2026.05.256"
    deliverable: "results/experiment_2687_conductor_zero_execution_diagnosis.json"
    title: "Conductor Zero-Execution Diagnosis: Root Cause Report for .206-.255 Stall"
    agent_type: codex
    model: gpt-5.5
    max_turns: 25
    track: infrastructure

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Milestones 2026.05.206 through 2026.05.255 ALL completed with 0 experiments executed.
      That is 50 consecutive zero-execution milestones. The conductor has been activated,
      roadmaps have been planned and written to research-roadmap.yaml, but no experiment
      artifacts have been produced. This task produces a structured diagnosis report.

      Per CLAUDE.md: "Never modify scripts/research_conductor.py from within experiment prompts."
      This task reads and REPORTS on the conductor; it does NOT modify it.

      EXISTING CODE TO READ FIRST:
      - scripts/research_conductor.py (read ONLY — understand task dispatch, agent invocation, retro logic)
      - ops/conductor-log.md (last 30 lines — when did last successful experiment run?)
      - results/operational_retro_2026_05_205.json (last milestone with experiments > 0)
      - results/operational_retro_2026_05_255.json (most recent zero-execution retro)
      - ops/conductor-state.json (if exists — conductor's persisted state)
      - research-roadmap.yaml (currently active roadmap — milestone should be 2026.05.256 after exp2686)

      TASK: Diagnose why the conductor has been executing 0 experiments per milestone since .206.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Confirm scripts/research_conductor.py exists.
            `ls scripts/research_conductor.py` — record: conductor_exists (bool).
         b. Check ops/conductor-log.md exists.
            Record: conductor_log_exists (bool).
         c. Check ops/conductor-state.json:
            `ls ops/conductor-state.json 2>/dev/null && echo "exists" || echo "missing"`
            Record: conductor_state_exists (bool).
         Record: preconditions_checked.

      1. Read scripts/research_conductor.py. Focus on:
         a. The _research_step() or main loop function — how does it pick the next task?
         b. The _build_agent_command() function — what command does it invoke for codex/claude?
         c. Any precondition checks that might silently skip tasks (venv, pre-tests, etc.)
         d. How it writes to ops/conductor-log.md and ops/conductor-state.json.
         Record: task_dispatch_mechanism (str — brief description of how tasks are dispatched).

      2. Read ops/conductor-log.md (last 100 lines). Find:
         a. The last line with "OK" status — what date and experiment was it?
         b. Any SKIP or FAIL patterns that appear repeatedly.
         c. What milestone was active when the conductor last produced an OK result?
         Record: last_ok_experiment (str), last_ok_date (str), last_ok_milestone (str).

      3. Read results/operational_retro_2026_05_205.json:
         Record: milestone_205_experiments_completed (int), milestone_205_wall_time (float).

      4. Read ops/conductor-state.json if it exists:
         Record: conductor_state_keys (list of top-level keys), current_milestone_in_state (str).

      5. Based on readings, identify the most likely root causes from this list:
         a. "venv_missing" — .venv was broken (exposes the .253 root cause — missing pip/pytest)
         b. "roadmap_milestone_mismatch" — research-roadmap-next.yaml milestone != expected next
         c. "conductor_not_running" — the conductor process is simply not being executed by any job
         d. "pre_test_failure_cascade" — pre-tests fail → all tasks SKIP → 0 artifacts
         e. "agent_spawn_failure" — codex/claude CLI invocations fail silently
         f. "artifact_write_permission" — conductor cannot write to results/ directory
         g. "other" — describe
         Record: root_causes_identified (list of str), most_likely_cause (str).

      6. Write a one-paragraph recovery plan based on the most likely cause.
         Record: recovery_plan (str — one paragraph).

      7. Write results/experiment_2687_conductor_zero_execution_diagnosis.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:'
        principle: "Terminal prefix; diagnosis always produces a terminal artifact."
      - task_dispatch_mechanism: str
        principle: "Understanding dispatch is prerequisite for diagnosing stalls."
      - last_ok_experiment: str
        principle: "Establishes the timeline: when was the last successful run?"
      - last_ok_date: str
        principle: "Wall-clock anchor for the stall start time."
      - last_ok_milestone: str
        principle: "Identifies which milestone the conductor last produced artifacts in."
      - conductor_state_exists: bool
        principle: "State file presence indicates whether conductor has persisted state at all."
      - root_causes_identified: list of str
        principle: "Structured list allows the operator to address each cause systematically."
      - most_likely_cause: str
        principle: "Prioritized root cause lets the operator focus on the highest-leverage fix first."
      - recovery_plan: str
        principle: "Actionable recovery steps close the feedback loop from diagnosis to fix."
      - duration_s: float
        principle: "Read-only analysis: expected 5-30s."
      - preconditions_checked: list of {{resource, available, check}}
        principle: "Anti-fabrication: records conductor.py and log file existence checks."

      Do NOT modify scripts/research_conductor.py.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


