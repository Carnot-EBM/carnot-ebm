  - id: exp2587
    title: "Safety Corpus 200 Pairs + Tier0x Safety Verifier (Ising Pattern Energy)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: safety_classifier

    prior_failures:
      - experiment_id: exp2522
        verdict: "complete: HalluGuard corpus construction succeeded"
        addressed_by: >
          exp2522 built the hallucination domain corpus. This builds a DIFFERENT domain
          corpus: safety/jailbreak (safe/unsafe labels vs hallucination/correct labels).
          Different domain, different label schema, different verifier technique (Ising
          pattern energy vs NTK-proxy). Not a rerun — a new product track.
        retire_if_same_verdict: false

    context: |
      The Tier B Safety/Jailbreak Classifier is the next commercially viable product per
      research-program.md. The Carnot energy infrastructure (Ising sampler, verifier API,
      conformal calibration) already exists. This task adds the safety domain corpus and
      a first safety verifier.

      Safety corpus design: 200 (prompt, response) pairs with label safe/unsafe.
        - 100 safe: benign user requests + appropriate model responses
        - 100 unsafe: jailbreak attempts OR harmful requests + model compliance responses
      Source: public safety benchmarks (WildGuard, HarmBench, AdvBench subsets).

      Safety verifier (Tier0xSafetyVerifier):
        - Feature: token-level Ising energy pattern score — compute E(s) for a spin
          configuration derived from the response's token entropy pattern. Unsafe responses
          to jailbreaks tend to have characteristic low-entropy "compliance sequences"
          that differ from refusal patterns.
        - Score: binary energy threshold (E > threshold → safe, E ≤ threshold → unsafe)
        - Calibrate threshold on train split using conformal coverage.

    existing_code_to_read:
      - python/carnot/verify/
      - python/carnot/models/ising.py
      - research-program.md

    concrete_steps: |
      0. PRECONDITIONS:
         a. `python -c "import carnot"` succeeds
         b. `python -c "import sklearn"` succeeds
         c. Network connectivity for corpus download: `curl -sf -o /dev/null https://huggingface.co` succeeds
         If any precondition fails, write honest_verdict blocked_<resource> and exit.

      1. Construct safety corpus from public sources:
         - Load WildGuard or HarmBench samples (HuggingFace datasets — check local cache first).
         - If not locally cached, generate 200 synthetic pairs using template-based generation
           (do NOT call a closed-weight API): 100 benign (safe) + 100 harmful request patterns (unsafe).
         - Log corpus_source (real/synthetic) in artifact.

      2. Compute Tier0xSafetyVerifier features:
         - For each (prompt, response) pair: compute token-level Shannon entropy H(t) for each
           response token position using a simple unigram LM.
         - Compute mean entropy, min entropy, std of entropy, entropy run-length of low-entropy
           spans (compliance sequences).
         - Feature vector: [mean_H, min_H, std_H, compliance_run_length, response_length].

      3. Split 80/20 train/test stratified by label. Train LogisticRegression(C=1.0, random_state=42).
         Evaluate: AUROC, AUPRC, F1 on test split.

      4. If AUROC > 0.60: safety_verifier_viable=True. Serialize model to
         python/carnot/verify/tier0x_safety_verifier.pkl.
         Write stub python/carnot/verify/tier0x_safety_verifier.py implementing
         Tier0xSafetyVerifier(BaseVerifier) with .score(prompt, response) → float.

      5. Write results/experiment_2587_safety_corpus_verifier.json with all required fields.

    required_artifact_fields:
      honest_verdict:
        format: "MUST start with complete: or complete_"
        principle: "Terminal prefix required."
      safety_verifier_viable:
        type: bool
        principle: "Gate for exp2588 — only proceed with safety ensemble if AUROC > 0.60."
      safety_auroc:
        type: float
        principle: "Primary metric for viability gate. Must exceed random baseline (0.50)."
      n_corpus:
        type: int
        principle: "Records corpus size for sample-size adequacy."
      corpus_source:
        type: str
        values: ["real", "synthetic", "mixed"]
        principle: "Distinguishes real benchmark data from template-generated corpus for paper credibility."
      random_seed:
        value: 42
        principle: "Reproducibility."
      preconditions_checked:
        type: list
        principle: "Records verified resources."

    acceptance_gates:
      - condition: "safety_auroc > 0.50"
        principle: "Must beat random baseline — any result below 0.50 is worse than flipping a coin."
      - condition: "n_corpus >= 100"
        principle: "Statistical floor for binary classification claims."


