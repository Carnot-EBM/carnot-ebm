  - id: exp2753
    milestone: "2026.05.261"
    deliverable: "results/experiment_2753_phase4_fep_redesign_v2.json"
    title: "Phase 4 FEP Aggregator Redesign v2: Normalized Alpha Weights + Learned Ensemble Pooling"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 40
    track: research

    prior_failures:
      - experiment_id: exp2748-phase4-fep-factor-graph
        verdict: "complete: fep_factor_graph_computed=true; fep_auroc=0.489 (~random); fep_vs_odar_delta=-0.484; alpha_t_nonzero=true but unscaled (values: [-1.23, -1.27, 0.06, -1.23, ~0, 2.34, 25.9, 0.0])"
        addressed_by: "exp2748 (.260) showed alpha_t_nonzero=true (hypothesis supported: verifiers have non-zero contribution) BUT the aggregation formula Cov(Vi,label)/Var(Vi) produces unscaled, sign-flipped alpha values (one is 25.9x larger than the next). Simple averaging of such values produces random output. This exp2753 tries 3 normalized pooling strategies: (1) softmax over |alpha|, (2) learned logistic regression from calibration data, (3) temperature-scaled geometric mean. Different: exp2748 used raw covariance; exp2753 uses normalized/learned weights."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      exp2748 (.260) implemented Phase 4 FEP factor graph. Alpha values from raw Cov/Var formula:
      [-1.23, -1.27, 0.06, -1.23, ~0, 2.34, 25.9, 0.0]. One value is 25.9x larger — dominates sum.
      Some are negative (verifiers anti-correlated with correctness), some are near-zero (degenerate
      verifiers). Simple sum produces random predictions (auroc=0.489).

      Three redesign strategies to evaluate:
      STRATEGY 1: Softmax-normalized absolute alpha weights
        w_i = softmax(|alpha_i| / temperature)
        joint_fep = sum(w_i * energy_i)
        Key change: negative alphas become positive (anti-correlated verifiers inverted); temperature
        parameter controls how much weight concentrates on the highest-alpha verifier.

      STRATEGY 2: Learned logistic regression (optimal linear combination from calibration data)
        From 80% calibration split: fit LogisticRegression on [energy_1, ..., energy_k] → label
        The coefficients are the optimal verifier weights for this dataset.
        Key change: fully data-driven; handles sign, scale, and non-linearity automatically.

      STRATEGY 3: Temperature-scaled geometric mean (robust to outliers)
        For verifiers with energy_i > 0: joint_fep = geometric_mean([max(e, eps) for e in energies])
        Key change: geometric mean is robust to outlier alphas; normalizes scale automatically.

      EXISTING CODE TO READ FIRST:
      - results/experiment_2748_phase4_fep_factor_graph.json (n_verifiers=8, alpha_values, odar_auroc)
      - python/carnot/verify/ (list all tier0* modules — same as exp2748)
      - python/carnot/pipeline/verify_repair.py (odar_route() — baseline to beat)
      - data/fover_corpus.jsonl (FoVer corpus for evaluation)

      TASK: Implement 3 normalized FEP pooling strategies. Find the best one.
      Target: fep_auroc >= 0.70 AND fep_vs_odar_delta >= 0 (match or beat ODAR heuristic).

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; import numpy; import sys; sys.path.insert(0,'python'); import carnot.verify"`
            Record: carnot_verify_importable (bool).
            If false: write honest_verdict 'blocked_carnot_verify_not_importable' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            Record: fover_corpus_lines (int).
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Enumerate verifiers and build feature matrix (same as exp2748):
         `ls python/carnot/verify/tier0*.py`
         Record: n_verifiers (int), verifier_ids (list of str).
         Load FoVer corpus (N=100, random_seed=42, 70/30 train/test split):
         For each example: compute [energy_i for verifier_i in verifiers] → feature_matrix (N x k).
         labels = [1 if incorrect else 0 for each example].
         Record: n_train (int), n_test (int).

      2. STRATEGY 1 — Softmax-normalized absolute alpha:
         alphas = [Cov(E_i, labels) / (Var(E_i) + 1e-8) for each verifier]  # regularized
         abs_alphas = [abs(a) for a in alphas]
         # temperature scan: T in [0.1, 0.5, 1.0, 2.0, 5.0]
         For each T:
           weights = softmax(abs_alphas / T)
           fep_scores = feature_matrix @ weights
           auroc_T = roc_auc_score(labels_test, fep_scores_test)
         best_T = T with best auroc_T
         strategy1_auroc = auroc at best_T
         Record: strategy1_auroc (float), strategy1_best_temperature (float).

      3. STRATEGY 2 — Learned logistic regression:
         from sklearn.linear_model import LogisticRegression
         lr = LogisticRegression(C=1.0, max_iter=1000, random_state=42)
         lr.fit(X_train, y_train)
         strategy2_auroc = roc_auc_score(y_test, lr.predict_proba(X_test)[:, 1])
         strategy2_coefficients = lr.coef_[0].tolist()
         Record: strategy2_auroc (float), strategy2_coefficients (list of float).

      4. STRATEGY 3 — Temperature-scaled geometric mean:
         eps = 1e-6
         For each example: geom_mean = exp(mean([log(max(e, eps)) for e in energies]))
         strategy3_auroc = roc_auc_score(labels_test, geom_mean_test)
         Record: strategy3_auroc (float).

      5. Compare all strategies to ODAR baseline (compute ODAR auroc from exp2748: 0.973):
         # ODAR auroc from exp2748: fep_vs_odar_delta=-0.484 with fep_auroc=0.489
         # => odar_auroc = 0.489 + 0.484 = 0.973 (approximately)
         odar_auroc_baseline = 0.973  # from exp2748
         strategies = {{
           'strategy1': strategy1_auroc,
           'strategy2': strategy2_auroc,
           'strategy3': strategy3_auroc,
         }}
         best_strategy = argmax(strategies)
         best_fep_auroc = strategies[best_strategy]
         fep_vs_odar_delta = best_fep_auroc - odar_auroc_baseline
         fep_viable = (best_fep_auroc >= 0.70 AND fep_vs_odar_delta >= 0.0)
         Record: best_strategy (str), best_fep_auroc (float), fep_vs_odar_delta (float), fep_viable (bool).

      6. Implement best strategy as FEPAggregator class in python/carnot/pipeline/fep_aggregator.py.
         Record: fep_aggregator_implemented (bool).

      7. Alpha_t hypothesis re-assessment:
         alpha_t_hypothesis_updated = (best_fep_auroc > 0.60)  # updated conclusion
         Record: alpha_t_hypothesis_updated (bool), summary (str — why the formula failed + why the fix works).

      8. Write results/experiment_2753_phase4_fep_redesign_v2.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - fep_viable: bool
        principle: "PRIMARY GATE: True if best_fep_auroc >= 0.70 AND fep_vs_odar_delta >= 0. Unblocks paper-v6 Phase 4 claim."
      - best_fep_auroc: float
        principle: "Best AUROC across all 3 pooling strategies."
      - best_strategy: str
        principle: "Names which redesign strategy worked — cited in paper-v6 §6 methods."
      - fep_vs_odar_delta: float
        principle: "Comparison vs ODAR heuristic: positive = FEP outperforms ODAR."
      - strategy1_auroc: float
        principle: "Softmax-normalized absolute alpha result."
      - strategy2_auroc: float
        principle: "Learned logistic regression result."
      - strategy3_auroc: float
        principle: "Geometric mean result."
      - fep_aggregator_implemented: bool
        principle: "FEPAggregator class in python/carnot/pipeline/ for ensemble integration."
      - alpha_t_hypothesis_updated: bool
        principle: "Re-assessment: does the redesign confirm verifier-as-alpha_t is viable?"
      - random_seed: int — 42
