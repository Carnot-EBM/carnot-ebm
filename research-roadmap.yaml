    title: "Validator frontier corrigendum v2"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 35
    track: "verification"
    inference_substrate: "aggregation"
    requires_gpu: false
    gated_on:
      - upstream: exp3027-adversarial-flag-methodology-corrigendum
        artifact_field: methodology_corrigendum_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3018-beaver-style-validator-frontier-certificate
        verdict: "complete: validator frontier certificate ready with explicit unresolved bounds"
        addressed_by: "Adds Clip-and-Verify-style region separation and explicit fallback-only accounting so unresolved bounds cannot be misread as clean verification."
        retire_if_same_verdict: true
      - experiment_id: exp3017-nsvif-instruction-validator-tree-expansion
        verdict: "complete: nsvif validator-tree expansion ready"
        addressed_by: "Audits the expanded validator tree for verified, irrelevant, unresolved, and fallback-only regions before matrix promotion."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Exp3018 completed a BEAVER-style frontier certificate but left unresolved bounds. The new research sweep added Clip-and-Verify and hard-constraint decision-rule references. Use them as accounting principles only; do not claim their algorithms are implemented unless you implement them.

      EXISTING CODE TO READ FIRST
