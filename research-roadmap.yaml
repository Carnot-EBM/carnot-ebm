    arms, and recompute every headline. Do not import the Exp6813 producer. Attack selection
    authority, safe-action preservation, and row aggregation.

    CONCRETE STEPS:
    0. PRECONDITIONS: require selective_arbiter_ab_completed=true, raw bytes, source hashes,
       complete rows, matched budgets, and frozen manifests. On failure write complete_blocked_
       selective_arbiter_cold_audit with gate_check_summary and stop.
    1. Write independent audit tests first. Implement separate parsing, lexicographic comparison,
       no-op detection, transition evaluation, confidence intervals, and aggregation.
    2. Recompute every per-arm and paired metric. Compare producer headlines within a frozen tight
