         immutable_ladder_row_split_and_canary_hashes/calibration_question_family_stratum_and_semantic_group_counts principle: selection is powered on independent frozen calibration groups.
         model_specs_and_exact_file_hashes/embedded_tokenizer_prompt_and_decode_policy_candidates principle: every row traces to one mandated headline GGUF and preregistered settings.
         raw_candidate_row_paths_hashes_and_prefix_chain/generation_seeds_tokens_latency_cuda_vram_thermal_and_pid_receipts principle: authentic draws and compute remain auditable.
         frozen_parser_and_parseability/python_z3_correctness_and_method_validity_replay principle: exact authorities label outcomes and parser failures are not hidden.
         duplicate_effective_k_answer_cluster_and_entropy_metrics principle: nominal K is not credited when exploration collapses.
