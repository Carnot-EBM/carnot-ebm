- id: exp496-nup-probe-v2-bayesian
  milestone: 2026.04.37
  deliverable: results/experiment_496_nup_probe_v2.json
  title: 'Exp 496: NUP Probe v2 — Bayesian Semantic Entropy for Tier 0c (RETRO-047, arXiv 2603.22812)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-047 is\
    \ open: NUP Probe v1 (Exp 484) got AUC=0.600, below the 0.700 Tier 0c threshold.\
    \ The root cause: character-entropy fallback (no logprobs available from static\
    \ CoT text) has much lower discriminative power than actual token-level entropy.\
    \ This experiment implements NUP Probe v2 with Bayesian semantic entropy (arXiv\
    \ 2603.22812, AAAI 2026 oral): instead of a fixed threshold on Shannon entropy,\
    \ use Bayesian credible intervals to determine whether continuation entropy is\
    \ 'confidently high' (likely hallucination) vs 'uncertainly medium' (indeterminate).\
    \ Uses real CoT pairs from Exps 488/489 if available (these have live inference\
    \ metadata). CPU-only (post-processes saved CoT pairs).\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/nup_probe.py — NUPProbe, ContinuationEntropy, NUPProbeResult\
    \ (Exp 484)\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n-\
    \ python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\n- python/carnot/pipeline/three_tier_pipeline.py\
    \ — ThreeTierPipeline, Tier 0c candidate\n- results/fover_labeled_steps_live.json\
    \ — 57 labeled pairs\n- results/exp488_cot_pairs.json — 100 CoT pairs from Exp\
    \ 488 (if present)\n- results/exp489_cot_pairs.json — 200 CoT pairs from Exp 489\
    \ (if present)\n- research-references.md — Bayesian Semantic Entropy section\n\
    \nTASK: Implement BayesianEntropyEstimator and NUPProbeV2; evaluate AUC > 0.700.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3.\
    \ Add REQ-VERIFY-098 (BayesianEntropyEstimator.estimate(logprobs) returns EntropyEstimate\
    \ with mean, lower_ci, upper_ci computed via Beta-conjugate posterior on token\
    \ probability distribution), REQ-VERIFY-099 (NUPProbeV2.predict_violation uses\
    \ upper_ci > hallucination_threshold rather than point estimate, reducing false\
    \ positives from uncertain-entropy cases), REQ-VERIFY-100 (NUPProbeV2 AUC > 0.700\
    \ on real labeled CoT pairs qualifies it as Tier 0c in ThreeTierPipeline), SCENARIO-VERIFY-131/132/133\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n4. Write tests FIRST\
    \ (100% coverage) for:\n   - EntropyEstimate(mean: float, lower_ci: float, upper_ci:\
    \ float, n_samples: int):\n     - is_confidently_high: bool (lower_ci > threshold)\n\
    \     - is_uncertain: bool (lower_ci <= threshold <= upper_ci)\n   - BayesianEntropyEstimator(confidence_level:\
    \ float = 0.95):\n     - estimate(logprobs: list[float]) -> EntropyEstimate\n\
    \     - estimate_from_text(text: str) -> EntropyEstimate: character-entropy proxy\
    \ with wider CI\n   - NUPProbeV2(hallucination_threshold: float = 1.5,\n     \
    \ confidence_level: float = 0.95):\n     - score(cot_text: str, logprobs=None)\
    \ -> EntropyEstimate\n     - predict_violation(cot_text, logprobs=None) -> bool\n\
    \     - evaluate_auc(labeled_pairs: list[dict]) -> float\n   - NUPProbeV2Result(n_pairs,\
    \ auc, threshold, probe_latency_ms):\n     - is_viable_tier_0c: bool (auc > 0.700)\n\
    \   - Test: EntropyEstimate.is_confidently_high=True when lower_ci > threshold\n\
    \   - Test: BayesianEntropyEstimator.estimate with uniform logprobs gives wide\
    \ CI\n   - Test: NUPProbeV2.evaluate_auc returns float in [0, 1]\n5. Implement\
    \ python/carnot/pipeline/nup_probe_v2.py (BayesianEntropyEstimator, EntropyEstimate,\
    \ NUPProbeV2, NUPProbeV2Result).\n   If NUPProbeV2 is viable (AUC > 0.700): add\
    \ as Tier 0c to _bmad/architecture.md pipeline cascade table.\n   Export from\
    \ carnot.pipeline.__init__.\n   Verbose docstrings: WHY Bayesian (point-estimate\
    \ entropy threshold causes FP on 'uncertain' cases — text with moderate character\
    \ entropy near the threshold; Bayesian CI separates 'confidently high entropy'\
    \ from 'uncertain'; only 'confident' predictions trigger early cascade exit, reducing\
    \ FP rate; arXiv 2603.22812 AAAI 2026 shows 12.6% AUROC improvement from adaptive\
    \ sampling over fixed threshold), WHY Beta posterior (token probabilities are bounded\
    \ [0,1]; Beta distribution is the conjugate prior for Bernoulli/Binomial, making\
    \ it the natural posterior for token-level probabilities).\n6. Write scripts/experiment_496_nup_probe_v2.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(496, timeout_minutes=30)\
    \ as context manager\n   c. ExperimentTemplate(496, 'NUP Probe v2',\n      'results/experiment_496_nup_probe_v2.json')\n\
    \   d. DeliverableGuard('results/experiment_496_nup_probe_v2.json')\n   e. Load\
    \ labeled pairs: fover_labeled_steps_live.json + exp488/489_cot_pairs.json (if\
    \ present)\n   f. NUPProbeV2(hallucination_threshold=1.5)\n   g. Evaluate AUC\
    \ on held-out 20%\n   h. Build artifact: schema='carnot.nup_probe.v2'\n      n_pairs=<int>\n\
    \      n_with_logprobs=<int>\n      n_char_entropy_fallback=<int>\n      auc_v1=0.600\
    \ (reference from Exp 484)\n      auc_v2=<float>\n      auc_improvement=auc_v2\
    \ - 0.600\n      is_viable_tier_0c=auc_v2 > 0.700\n      retro_047_closed=is_viable_tier_0c\n\
    \      honest_verdict='tier_0c_viable' if is_viable_tier_0c\n        else 'improvement_below_threshold'\n\
    \   i. Call tmpl.assert_deliverable_written() as FINAL LINE\n   j. Output: results/experiment_496_nup_probe_v2.json\n\
    7. Write tests/python/test_nup_probe_v2.py (100% coverage on BayesianEntropyEstimator,\
    \ NUPProbeV2, NUPProbeV2Result).\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\n9. Reconcile: update _bmad/architecture.md (Tier 0c NUPProbeV2 if viable),\
    \ ops/conductor-log.md (RETRO-047 status), ops/status.md, ops/changelog.md.\nRun:\
    \ JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"

- id: exp497-sure-surprise-ebm-replay
  milestone: 2026.04.37
  deliverable: results/experiment_497_sure_surprise_ebm_replay.json
  title: 'Exp 497: SuRe Surprise-Driven EBM Replay — Tier 2 self-learning with priority replay (arXiv 2511.22367)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2511.22367\
    \ (SuRe, 2025) proposes surprise-prioritized replay for continual learning: select\
    \ replay items by NLL (negative log-likelihood) — high-surprise sequences that\
    \ the model was most uncertain about are replayed more frequently, preventing\
    \ catastrophic forgetting at knowledge boundaries. This maps directly to Carnot's\
    \ Tier 2 self-learning (PPSConstraintLearner): when new constraint violations\
    \ arrive, we replay high-surprise (high-EBM-energy) violations from the replay\
    \ buffer instead of random selection. High-energy violations are the model's hardest\
    \ examples — the ones most likely to be forgotten across domain partitions. This\
    \ is the mandatory Tier 2 self-learning experiment for milestone .37 (FR-11). CPU-only.\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/pps_constraint_learner.py\
    \ — PPSConstraintLearner, DomainParameterPartition, PartitionIsolationScore (Exp\
    \ 470)\n- python/carnot/pipeline/ppsebm_real_validator.py — InterleavedViolationSequence,\
    \ PPSEBMRealValidationResult (Exp 485)\n- python/carnot/pipeline/env_autofix.py\
    \ — apply_env_autofix()\n- python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\n\
    - results/experiment_485_ppsebm_real_data_validation.json — prior PPSEBM result\n\
    - results/fover_labeled_steps_live.json — 57 real labeled steps\n- research-references.md\
    \ — SuRe section\n\nTASK: Implement SuRePriorityReplay for PPSConstraintLearner;\
    \ compare isolation_score vs uniform replay.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n3. Add REQ-SELFLEARN-021 (SuRePriorityReplay\
    \ ranks constraint violations in the replay buffer by EBM energy surprise — energy\
    \ relative to per-domain running mean — and selects top-k for replay at each update\
    \ step), REQ-SELFLEARN-022 (SuRePriorityReplay combined with PPSConstraintLearner\
    \ maintains partition_isolation_score > 0.7 on interleaved real violation sequences),\
    \ SCENARIO-SELFLEARN-021/022 to openspec/capabilities/autoresearch/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - ViolationSurprise(violation: dict,\
    \ domain: str, energy: float, domain_mean_energy: float):\n     - surprise_score:\
    \ float (energy - domain_mean_energy; high = more surprising)\n     - is_high_surprise:\
    \ bool (surprise_score > surprise_threshold)\n   - SuRePriorityReplay(replay_buffer_size:\
    \ int = 100, top_k_fraction: float = 0.3,\n     surprise_threshold: float = 0.5):\n\
    \     - add(violation: dict, domain: str, energy: float) -> None\n     - get_replay_batch(n:\
    \ int) -> list[dict]: top-n by surprise_score\n     - update_domain_mean(domain:\
    \ str, energy: float) -> None\n   - SuReReplayResult(n_violations_processed, n_replay_items,\
    \ isolation_score_uniform, isolation_score_sure):\n     - isolation_improvement:\
    \ float\n     - sure_better: bool (isolation_score_sure > isolation_score_uniform)\n\
    \   - Test: SuRePriorityReplay.get_replay_batch returns highest-surprise items\n\
    \   - Test: domain_mean updated correctly after add()\n   - Test: SuReReplayResult.sure_better=True\
    \ when score_sure > score_uniform\n5. Implement python/carnot/pipeline/sure_priority_replay.py\
    \ (SuRePriorityReplay, ViolationSurprise, SuReReplayResult).\n   Wire SuRePriorityReplay\
    \ into PPSConstraintLearner as an optional replay_strategy parameter.\n   Export\
    \ from carnot.pipeline.__init__.\n   Verbose docstrings: WHY surprise-driven selection\
    \ (uniform random replay wastes replay budget on easy examples the model already\
    \ handles well; surprise-driven selection prioritizes examples near the knowledge\
    \ boundary — where forgetting is most likely; arXiv 2511.22367 shows +5% accuracy\
    \ in continual learning from surprise prioritization), WHY EBM energy as surprise\
    \ proxy (high Ising energy = multiple competing low-energy configurations = the\
    \ constraint is ambiguous for the current model = high cognitive surprise; this\
    \ is a direct translation of NLL-based surprise to the EBM domain).\n6. Write\
    \ scripts/experiment_497_sure_surprise_ebm_replay.py:\n   a. apply_env_autofix()\
    \ FIRST\n   b. ExperimentTimeoutWatchdog(497, timeout_minutes=40) as context manager\n\
    \   c. ExperimentTemplate(497, 'SuRe Surprise EBM Replay',\n      'results/experiment_497_sure_surprise_ebm_replay.json')\n\
    \   d. DeliverableGuard('results/experiment_497_sure_surprise_ebm_replay.json')\n\
    \   e. Load real CoT steps from fover_labeled_steps_live.json\n   f. InterleavedViolationSequence(steps)\
    \ — preserve natural ordering\n   g. Run PPSConstraintLearner with replay_strategy='uniform'\
    \ → isolation_score_uniform\n   h. Run PPSConstraintLearner with replay_strategy=SuRePriorityReplay()\
    \ → isolation_score_sure\n   i. SuReReplayResult(n_violations, n_replay, isolation_score_uniform,\
    \ isolation_score_sure)\n   j. Build artifact: schema='carnot.sure_replay.v1'\n\
    \      n_violations_processed=<int>\n      isolation_score_uniform=<float>\n  \
    \    isolation_score_sure=<float>\n      isolation_improvement=<float>\n      sure_better=<bool>\n\
    \      fr11_tier2_status='improved' if sure_better else 'no_improvement'\n    \
    \  honest_verdict='sure_improves_isolation' if sure_better else 'no_improvement'\n\
    \   k. Call tmpl.assert_deliverable_written() as FINAL LINE\n   l. Output: results/experiment_497_sure_surprise_ebm_replay.json\n\
    7. Write tests/python/test_sure_priority_replay.py (100% coverage on SuRePriorityReplay,\
    \ ViolationSurprise, SuReReplayResult).\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n9. Reconcile: update _bmad/traceability.md (FR-11 Tier 2 SuRe),\
    \ ops/conductor-log.md, ops/status.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

