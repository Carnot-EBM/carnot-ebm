- id: exp1414-certificate-llm-repair-executor-v1
  milestone: 2026.04.109
  deliverable: results/experiment_1414_certificate_llm_repair_executor_v1.json
  title: "Certificate LLM Repair Executor v1 — Execute REPAIR_HINT with Local SOTA GGUF"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 70
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1397-fullscale-pipeline-v2-200cases
      verdict: not_headline_full_pipeline_below_0_40
      addressed_by: "exp1397 localized repair hints with precision=1.0 but did not execute them. This task implements the missing local LLM repair executor and validates corrected certificates with the existing semantic validator."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Exp1397 showed that semantic validation is perfect but repair execution is
    missing. The executor must take a certificate, a REPAIR_HINT, and validator
    feedback, then ask a local SOTA GGUF model for a bounded corrected
    certificate. This is a local-first task. New LLM-bearing experiments must
    include mandated SOTA GGUF models in MODEL_SPECS. Use {project_root} as
    the project root and {date} as the run date.

    MODEL_SPECS:
    - hf_id: unsloth/Qwen3.6-35B-A3B-GGUF
      role: primary_repair_model
    - hf_id: unsloth/gemma-4-31B-it-GGUF
      role: dense_fallback
    - hf_id: unsloth/gemma-4-26B-A4B-it-GGUF
      role: moe_fallback
    Legacy Qwen3.5-0.8B or gemma-4-E4B-it may be used only for CPU smoke tests,
    not headline repair results. Prefer the cached_sota_pair() pattern from
    scripts/experiment_template.py.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - results/experiment_1413_certificate_repair_execution_diagnosis.json
    - results/experiment_1397_fullscale_pipeline_v2_200cases.json
    - python/carnot/pipeline/
    - python/carnot/verify/
    - openspec/capabilities/pipeline/spec.md
    - openspec/capabilities/verification/spec.md

    TASK:
    Implement a bounded local LLM repair executor for certificate repair hints,
    wire it into the pipeline behind an opt-in path, and validate on a small
    sample of exp1397 repair-hint cases.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - repair_executor_deployed
    - repair_hint_cases_tested
    - repaired_cases_successful
    - repaired_case_success_rate
    - semantic_equivalence_pass_rate_after_repair
    - local_sota_model_used
    - tests_run
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1414_certificate_llm_repair_executor_v1.json immediately with status="in_progress".
    2. If implementation changes public behavior, update relevant OpenSpec REQ-* / SCENARIO-* before code changes.
    3. Add a small, bounded repair-executor module or pipeline hook using existing local LLM utilities; do not import vendor SDKs into core pipeline code.
    4. The executor input contract: original prompt/question, current certificate, REPAIR_HINT, validator error, and allowed output schema.
    5. The executor output contract: corrected certificate plus metadata; validate with existing semantic validator before accepting.
    6. Use cached_sota_pair() or equivalent cache resolver with MODEL_SPECS above; record the actual model used.
    7. Run on at least 20 repair-hint cases if available; if model cache is unavailable, write a blocked artifact with cache details rather than simulating headline results.
    8. Add focused tests for prompt construction, schema validation, fallback behavior, and no closed-weight dependency in core code.
    9. Write all required artifact fields with status="complete" or status="blocked" and an honest verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1414_certificate_llm_repair_executor_v1.json')); print(d.get('repair_executor_deployed'), d.get('repaired_case_success_rate'), d.get('local_sota_model_used'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1415-dvi-v3-1508-fresh-cases
  milestone: 2026.04.109
