- id: exp474-gpu-vram-gate
  milestone: 2026.04.36
  deliverable: results/experiment_474_gpu_vram_gate.json
  title: 'Exp 474: GPUVRAMGate — mid-session zombie kill before every GPU experiment (RETRO-037/042 root cause)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Four of twelve\
    \ experiments in milestone .35 were deferred_to_gpu with the same root cause: zombie\
    \ processes accumulated mid-session and held 23.8GB of GPU 0 VRAM at 0% utilization,\
    \ preventing new model loads. The 'kill zombies at session start' improvement (Exp\
    \ 463) fired once but could not prevent mid-session accumulation from failed GPU-required\
    \ experiments. RETRO-037 and RETRO-042 both trace to this root cause. The fix: a\
    \ GPUVRAMGate context manager that runs before EVERY GPU-required experiment, checks\
    \ free VRAM, kills zombies if needed, waits up to 60 seconds for VRAM to free, and\
    \ defers with honest_verdict='gpu_vram_insufficient' if the wait fails.\n\nEXISTING\
    \ CODE TO READ FIRST:\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/session_health_check.py — ConductorSessionHealthCheck,\
    \ ZombieProcess (Exp 463)\n- python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\
    \ (Exp 462)\n- python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog\n\
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu()\n- ops/known-issues.md\
    \ — RETRO-037, RETRO-042\n\nTASK: Implement GPUVRAMGate and wire it into ExperimentTemplate.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3. Add\
    \ REQ-INFRA-039 (GPUVRAMGate checks free VRAM before every GPU-required experiment\
    \ and kills zombie processes if free_vram < min_free_gb), REQ-INFRA-040 (GPUVRAMGate\
    \ waits up to wait_seconds for VRAM to free after zombie kill; defers experiment\
    \ if threshold not met), REQ-INFRA-041 (ExperimentTemplate.setup_gpu() calls GPUVRAMGate\
    \ when requires_gpu=True), SCENARIO-INFRA-047/048/049 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - VRAMStatus(gpu_index: int, total_mb:\
    \ int, used_mb: int, free_mb: int):\n     - free_gb: float (property)\n     - is_zombie_saturated:\
    \ bool (used_mb > 0.90 * total_mb and utilization_pct == 0)\n   - GPUVRAMGate(min_free_gb:\
    \ float = 8.0, wait_seconds: int = 60, auto_kill: bool = True):\n     - check_vram(gpu_index:\
    \ int) -> VRAMStatus\n     - kill_zombies(gpu_index: int) -> int: returns count\
    \ killed\n     - wait_for_vram(gpu_index: int) -> bool: True if threshold met within\
    \ wait_seconds\n     - __enter__() / __exit__(): context manager; raises GPUVRAMInsufficientError\
    \ if wait_for_vram returns False\n   - GPUVRAMInsufficientError(gpu_index, free_gb,\
    \ min_free_gb): custom exception\n   - Test: GPUVRAMGate on CPU-only machine (n_gpus=0)\
    \ raises no error (no-op)\n   - Test: GPUVRAMGate with mocked free_mb > threshold\
    \ passes without killing\n   - Test: GPUVRAMGate with mocked free_mb < threshold\
    \ calls kill_zombies() then re-checks\n   - Test: GPUVRAMGate raises GPUVRAMInsufficientError\
    \ when wait exhausted\n5. Implement python/carnot/pipeline/gpu_vram_gate.py (GPUVRAMGate,\
    \ VRAMStatus, GPUVRAMInsufficientError).\n   Update scripts/experiment_template.py:\
    \ in setup_gpu(), wrap model load with GPUVRAMGate(min_free_gb=8.0, auto_kill=True)\
    \ when requires_gpu=True.\n   Export GPUVRAMGate, VRAMStatus, GPUVRAMInsufficientError\
    \ from carnot.pipeline.__init__.\n   Verbose docstrings: WHY mid-session gate (session-start\
    \ check insufficient — zombie accumulation from failed experiments; 4 deferred_to_gpu\
    \ in .35 all same root cause), WHY 60-second wait (allows GPU driver to reclaim\
    \ VRAM after kill signal before declaring failure), WHY 8GB threshold (minimum needed\
    \ for Qwen3.5-0.8B or Gemma4-E4B-it with inference overhead).\n6. Write scripts/experiment_474_gpu_vram_gate.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(474, timeout_minutes=20)\
    \ as context manager\n   c. ExperimentTemplate(474, 'GPUVRAMGate', 'results/experiment_474_gpu_vram_gate.json')\n\
    \   d. DeliverableGuard('results/experiment_474_gpu_vram_gate.json')\n   e. Simulate\
    \ zombie scenario: mock VRAMStatus with free_mb < threshold\n   f. Test GPUVRAMGate\
    \ behavior in CI mode (no GPU: no-op, returns safely)\n   g. Verify ExperimentTemplate.setup_gpu()\
    \ now calls GPUVRAMGate when requires_gpu=True\n   h. Build artifact: schema='carnot.gpu_vram_gate.v1'\n\
    \      gate_implemented=True\n      template_wired=True\n      n_gpus_detected=<int>\n\
    \      retro_037_prevention=True\n      retro_042_prevention=True\n      honest_verdict='vram_gate_operational'\n\
    \   i. Call tmpl.assert_deliverable_written() as FINAL LINE\n   j. Output: results/experiment_474_gpu_vram_gate.json\n\
    7. Write tests/python/test_gpu_vram_gate.py (100% coverage).\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: update ops/conductor-log.md (RETRO-037/042\
    \ root cause fixed), ops/status.md, ops/changelog.md, _bmad/traceability.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"

- id: exp475-conductor-dedup-handoff
  milestone: 2026.04.36
  deliverable: results/experiment_475_conductor_dedup_handoff.json
  title: 'Exp 475: Conductor Dedup Check + Partial-Result Handoff — RETRO-041 throughput items'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Two non-adopted\
    \ throughput improvements from milestone .34/.35 retros must be implemented now.\
    \ (1) Conductor deduplication: the conductor should check if results/experiment_NNN*.json\
    \ already has a complete honest_verdict before re-executing an experiment. Exp 447\
    \ was verified three times with no changes — 3 × ~20 min = 60 min wasted. (2) Partial-result\
    \ handoff: when the conductor is interrupted (SIGTERM, exception, timeout), the\
    \ in-progress ExperimentTemplate state should be serialized to results/experiment_NNN_partial.json.\
    \ The next session fast-paths to the checkpoint. Exp 308 took 105 min because interrupted-run\
    \ recovery required full context reload and triage. Both are CPU-only infrastructure\
    \ experiments.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/env_autofix.py\
    \ — apply_env_autofix()\n- python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\
    \ (Exp 462)\n- python/carnot/pipeline/atomic_writer.py — AtomicResultWriter (Exp\
    \ 452)\n- scripts/experiment_template.py — ExperimentTemplate, build_result()\n\
    - ops/known-issues.md — RETRO-041\n\nTASK: Implement ConductorDedupCheck and PartialResultHandoff.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3. Add\
    \ REQ-INFRA-042 (ConductorDedupCheck.is_complete(exp_id) returns True when result\
    \ JSON exists with honest_verdict not in blocked/deferred/partial states), REQ-INFRA-043\
    \ (PartialResultHandoff.install(template) registers SIGTERM handler that serializes\
    \ partial state before exit), REQ-INFRA-044 (PartialResultHandoff.resume_if_available(template)\
    \ loads partial state if checkpoint exists, skipping completed steps), SCENARIO-INFRA-050/051/052\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n4. Write tests FIRST (100%\
    \ coverage) for:\n   - ConductorDedupCheck:\n     - is_complete(exp_id: int, results_dir:\
    \ str = 'results') -> bool\n     - is_blocked_verdict(verdict: str) -> bool: True\
    \ for 'blocked', 'deferred_to_gpu', 'gpu_required', 'partial_*', 'scaffolding_only'\n\
    \     - should_skip(exp_id: int) -> bool: is_complete and not is_blocked_verdict\n\
    \   - PartialResultHandoff:\n     - install(template: ExperimentTemplate) -> None:\
    \ registers atexit + SIGTERM handler\n     - save(template: ExperimentTemplate,\
    \ partial_state: dict) -> None: atomic write to results/experiment_NNN_partial.json\n\
    \     - resume_if_available(template: ExperimentTemplate) -> dict | None\n    \
    \ - Test: is_complete(exp_id) returns True when result file exists with valid verdict\n\
    \   - Test: is_complete(exp_id) returns False when result file absent\n   - Test:\
    \ is_complete(exp_id) returns False when verdict='deferred_to_gpu'\n   - Test: PartialResultHandoff.save()\
    \ writes atomic JSON to results/experiment_NNN_partial.json\n   - Test: resume_if_available()\
    \ returns None when no partial file exists\n5. Implement python/carnot/pipeline/conductor_dedup.py\
    \ (ConductorDedupCheck, PartialResultHandoff).\n   Export from carnot.pipeline.__init__.\n\
    \   Verbose docstrings: WHY dedup check (Exp 447 triple-re-verification wasted 60\
    \ min — conductor lacked any memory of prior completion), WHY partial handoff (Exp\
    \ 308 interrupted-run recovery took 105 min including full context reload; checkpoint\
    \ reduces this to <5 min for the resume path), WHY atomic write for partial (partial\
    \ state must be usable even if interrupted mid-write).\n6. Write scripts/experiment_475_conductor_dedup_handoff.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(475, timeout_minutes=20)\
    \ as context manager\n   c. ExperimentTemplate(475, 'Conductor Dedup + Partial Handoff',\n\
    \      'results/experiment_475_conductor_dedup_handoff.json')\n   d. DeliverableGuard('results/experiment_475_conductor_dedup_handoff.json')\n\
    \   e. Test ConductorDedupCheck on 5 existing result files (mix of complete/blocked/absent)\n\
    \   f. Test PartialResultHandoff.save() with a synthetic partial state dict\n   g.\
    \ Test resume_if_available() returns the saved dict\n   h. Build artifact: schema='carnot.conductor_dedup.v1'\n\
    \      dedup_check_implemented=True\n      partial_handoff_implemented=True\n  \
    \    n_existing_results_checked=<int>\n      n_skippable_found=<int>\n      retro_041_dedup_resolved=True\n\
    \      retro_041_handoff_resolved=True\n      honest_verdict='throughput_improved'\n\
    \   i. Call tmpl.assert_deliverable_written() as FINAL LINE\n   j. Output: results/experiment_475_conductor_dedup_handoff.json\n\
    7. Write tests/python/test_conductor_dedup.py (100% coverage).\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: update ops/conductor-log.md (RETRO-041\
    \ dedup + handoff closed), ops/status.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp476-live-100q-precision-v4
  milestone: 2026.04.36
  deliverable: results/experiment_476_live_100q_precision_v4.json
  title: 'Exp 476: Live 100q Precision v4 — RETRO-033 third attempt with GPUVRAMGate'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-033 has\
    \ been open for three consecutive milestones (.33, .34, .35). The goal is simple:\
    \ confirm verify-repair improvement at 100q+ on live GPU with statistical weight.\
    \ Exp 451 showed +5pp at 50q but the result file was absent. Exp 464 was implemented\
    \ but deferred_to_gpu (zombie VRAM). This experiment re-runs the 100q live precision\
    \ benchmark using the GPUVRAMGate (Exp 474) to prevent mid-session zombie blockage.\
    \ DualGPURunner assigns both models simultaneously. Writes 100 CoT pairs per model\
    \ to results/exp476_cot_pairs.json for JEPA retrain (Exp 477).\n\nDepends on: Exp\
    \ 474 (GPUVRAMGate). Hardware: 2x RTX 3090 (CARNOT_FORCE_LIVE=1).\n\nEXISTING CODE\
    \ TO READ FIRST:\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/gpu_vram_gate.py — GPUVRAMGate (Exp 474)\n- python/carnot/pipeline/deliverable_guard.py\
    \ — DeliverableGuard (Exp 462)\n- python/carnot/pipeline/dual_gpu_assigner.py —\
    \ DualGPUAssigner (Exp 462)\n- python/carnot/extraction/vericot_validator.py —\
    \ VeriCoTStepValidator (Exp 453)\n- python/carnot/extraction/vprm_verifier.py —\
    \ VPRMArithmeticVerifier (Exp 454)\n- python/carnot/pipeline/gemma_loader.py —\
    \ GemmaTransformersLoader (Exp 450)\n- python/carnot/pipeline/long_run_executor.py\
    \ — LongRunBenchmarkExecutor (Exp 437)\n- scripts/experiment_464_live_precision_100q.py\
    \ — prior harness (deferred_to_gpu)\n- ops/known-issues.md — RETRO-033\n\nTASK:\
    \ Run 100q live precision benchmark with GPUVRAMGate and DualGPURunner.\n1. Read\
    \ CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3. Add REQ-BENCH-025\
    \ (live 100q benchmark uses GPUVRAMGate before model load, kills zombies, waits\
    \ up to 60s for 8GB free), REQ-BENCH-026 (DualGPURunner assigns Gemma4-E4B-it to\
    \ cuda:0, Qwen3.5-0.8B to cuda:1 for concurrent inference), REQ-BENCH-027 (benchmark\
