        honest_verdict:
          principle: "Terminal prefix stating THIS chunk's stability outcome (stable-so-far/converged/diverged); blocked_<resource> if a precondition failed."
        inference_substrate: "live_llm_inference (principle: real GPU training; strict floor, easily cleared)."
        harness_fix_applied:
          principle: "Records the exp3728 root-cause fix: importlib.util.find_spec + absolute paths + run-from-{project_root}. The single most important deliverable -- without it, exp3735 re-blocks."
        cumulative_steps_trained:
          principle: "BARE int. Records training progress across checkpoint-spanning runs; exp3735 gates on this being >0 (the proof the genuine training ran)."
        ebt_loss_curve:
          principle: "Downsampled EBT loss trajectory -- the direct evidence for whether EBT training is stable (the kill-gate's core question)."
        ar_loss_curve:
          principle: "The matched AR baseline trajectory -- so part-(b)'s comparison is apples-to-apples (same corpus/budget)."
        nan_or_divergence_events:
          principle: "EBT instability is the most likely failure mode; recording NaN/divergence is the honest fail signal, not a hidden one."
        stabilizers_applied:
          principle: "Which EBT-paper stabilizers were enabled (random-alpha, replay, Langevin, grad-clip, KL-term CD) -- the open-ended judgment justifying claude; also the recipe exp3735/.342 inherits."
        peak_vram_mb:
          principle: "Confirms the bounded train stayed within the 3090's 24GB (exp3726 baseline 1283MB)."
        preconditions_checked:
          principle: "Records CUDA + ROBUST EBT-importable + corpus verified before training; pre-empts the exact silent-missing-resource fabrication that exp3728 fell into."
        model_specs:
          principle: "Names BOTH tiny configs (from-scratch, matched param-band) so the substrate + comparison fairness are honest."
        random_seed:
          principle: "Determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "Content hash catches silent corpus/config drift."
        duration_s:
          principle: "Wall-clock plausibility floor; long real duration expected for training."
      TERMINAL VERDICT example: "complete: harness_fixed_ebt_train_chunk_<steps>_steps_stable_so_far_loss_converging_no_nan_ar_baseline_co_trained_checkpointed"
      (or "complete: harness_fixed_ebt_train_chunk_diverged_at_step_<N>_after_<stabilizers>_genuine_part_a_signal_negative" if it genuinely diverges)
      Run: cd {project_root} && python scripts/experiment_3734_fix_harness_and_bounded_train_chunk1.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

