- id: exp732-probe-xval
  milestone: 2026.04.56
  deliverable: results/experiment_732_probe_xval.json
  title: 'Exp 732: JEPAReasonerProbe 5-Fold Cross-Validation (gate for Tier 2.1 cascade deploy)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 726 reported JEPAReasonerProbe OOD AUC=1.0000. This is a Tier 2.1 candidate
    (REQ-VER-034-3). However, AUC=1.0 on 200 held-out samples from a 1000-sample corpus is
    statistically suspicious — the probe may be overfit to the specific 80/20 split used in
    Exp 726. We must validate with 5-fold stratified cross-validation before deploying in the
    production cascade.

    arXiv 2512.19171 explains the theoretical mechanism: Qwen3.5-0.8B layer-16 hidden states
    encode "willingness to follow constraint" as a nearly linear subspace at the question-end
    token. If this subspace is genuinely stable, AUC should remain high across all folds. If
    the probe was overfit to the specific Exp 726 train/test split, fold variance will be
    high (std_auc > 0.15).

    Additionally, we test domain transfer: run the best fold's probe on MATH-500 (50
    questions, different distribution from GSM8K) to check generalization beyond the
    training domain.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_reasoner_probe.py — JEPAReasonerProbe implementation
      from Exp 726.
    - results/experiment_726_jepa_reasoner_probe.json — baseline AUC=1.0, hidden_dim=1024,
      probe_params=262657, layer_index=16, model=Qwen/Qwen3.5-0.8B.
    - results/fover_v2_labeled.json (or equivalent) — FoVer v2 labeled pairs.
    - scripts/experiment_template.py — ExperimentTemplate with BatchedInferenceRunner.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: 5-fold stratified CV on JEPAReasonerProbe. Compute mean OOD AUC ± std.
    Test domain transfer on MATH-500. Write gate file for Exp 733.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VER-034-3 (JEPAReasonerProbe cross-validation MUST show mean_auc >= 0.75
       AND std_auc < 0.15 across 5 stratified folds before cascade deployment),
       REQ-VER-034-4 (domain transfer AUC on MATH-500 MUST be >= 0.65),
       SCENARIO-VER-042/043 to openspec/capabilities/verification/spec.md.
    3. Implement 5-fold cross-validation:
       a. Load FoVer v2 + GSM8K 500-699 pairs (same corpus as Exp 726).
       b. StratifiedKFold(n_splits=5, shuffle=True, random_state=42).
          Stratify by step_correct label to ensure balanced folds.
       c. For each fold i:
          - Extract hidden states for train and val splits using Qwen3.5-0.8B GPU batch=32.
          - Train JEPAReasonerProbe on train split (BCELoss, Adam lr=1e-3, 50 epochs).
          - Evaluate AUC on val split.
          - Record fold_auc[i].
       d. Compute mean_auc = mean(fold_auc), std_auc = std(fold_auc).
    4. Domain transfer test (best fold model):
       a. Load 50 MATH-500 problems (different arithmetic domain from GSM8K).
       b. If MATH-500 not available: use MATH subset from HuggingFace (lighteval/MATH).
       c. Extract question-end hidden states (GPU), run best-fold probe (CPU).
       d. Compute transfer_auc on MATH-500 examples with known constraint labels.
       e. If no labeled MATH-500 available: report transfer_auc=null,
          note "manual_label_required".
    5. Gate logic:
       a. PASS: mean_auc >= 0.75 AND std_auc < 0.15 → write
          results/tier21_gate.json with {"gate": "pass", "mean_auc": ...,
          "std_auc": ..., "transfer_auc": ...}
       b. FAIL: either condition fails → write {"gate": "fail", "reason": ...,
          "mean_auc": ..., "std_auc": ...}
    6. Create scripts/experiment_732_probe_xval.py:
       a. ExperimentTemplate(732, requires_gpu=True) +
          ExperimentTimeoutWatchdog(732, timeout_minutes=90).
       b. Implement steps 3-5. Use BatchedInferenceRunner(batch_size=32) for
          hidden state extraction across folds.
       c. honest_verdict:
          - "probe_xval_robust" if mean_auc >= 0.75 AND std_auc < 0.15
          - "probe_xval_high_variance" if mean_auc >= 0.75 AND std_auc >= 0.15
          - "probe_xval_below_threshold" if mean_auc < 0.75
       d. artifact: fold_aucs (list of 5), mean_auc, std_auc, transfer_auc,
          n_train_per_fold, n_val_per_fold, tier21_gate_written (bool), honest_verdict.
    7. Write tests/python/test_experiment_732_probe_xval.py with 100% coverage:
       - test StratifiedKFold produces balanced label distribution per fold.
       - test gate file written with correct schema.
       - test mean_auc/std_auc computed correctly from fold list.
       Each test traces to REQ-VER-034-3/034-4.
    8. Reconcile:
       - ops/status.md: add "JEPAReasonerProbe 5-fold CV: mean_auc=X, std_auc=Y".
       - ops/changelog.md: one-line with honest_verdict.
    9. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0. Run setup_gpu() before hidden state extraction.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp733-tier21-cascade-integration
  milestone: 2026.04.56
  deliverable: results/experiment_733_tier21_cascade.json
  title: 'Exp 733: Tier 2.1 Cascade Integration (GATED on Exp 732 tier21_gate.json)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    GATE CHECK (MANDATORY FIRST STEP): Read results/tier21_gate.json.
    If ("gate": "fail"): write results/experiment_733_tier21_cascade.json with
    ("experiment": 733, "status": "gated_blocked", "gate_source": "exp732",
     "honest_verdict": "gated_blocked_probe_xval_failed", "schema": "carnot.result.v1")
    and STOP. Do not implement anything else.

    CONTEXT (only if gate passes): JEPAReasonerProbe has passed 5-fold cross-validation
    (mean_auc >= 0.75, std_auc < 0.15 per Exp 732). This qualifies as Tier 2.1 per
    REQ-VER-034-3 and the change proposal in
    openspec/change-proposals/tier21-jepa-reasoner-probe.md.

    The probe must be wired between EORM (Tier 2) and SymCodeVerifier (Tier 2.5) in the
    production ThreeTierPipeline / cascade_router. When the probe scores a response above
    the violation threshold, it fires a ViolationEvent stub to the FR11EventBus (Exp 734
    implements the bus). When the probe scores below threshold (likely correct), downstream
    tiers (SymCode, HERMES, Causal) are skipped — early-exit path for correct responses.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_reasoner_probe.py — JEPAReasonerProbe from Exp 726.
    - python/carnot/cascade/cascade_router.py — cascade routing logic.
    - python/carnot/cascade/tier2_jepa.py — Tier 2 EORM wrapper.
    - python/carnot/cascade/tier3_ising.py — Tier 3 wrapper (for skip-rate measurement).
    - results/experiment_726_jepa_reasoner_probe.json — checkpoint path for probe weights.
    - results/experiment_732_probe_xval.json — validated mean_auc and 5th-percentile
      threshold for calibration.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Wire JEPAReasonerProbe as Tier 2.1 in the cascade. Measure skip rate, FN delta,
    and latency. Write gate file for Exp 734.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VER-035 (Tier 2.1 MUST fire between Tier 2 EORM and Tier 2.5
       SymCodeVerifier; probe threshold calibrated to 5th percentile of correct-step scores
       on FoVer v2 to ensure < 5% FP rate),
       REQ-VER-036 (if Tier 2.1 score <= threshold, SymCodeVerifier + HERMES + Causal tiers
       MUST be skipped; response marked "likely_correct"),
       REQ-VER-037 (Tier 2.1 MUST emit ViolationEvent stub to FR11EventBus when score >
       threshold; bus may be a no-op stub until Exp 734),
       SCENARIO-VER-044/045/046 to openspec/capabilities/verification/spec.md.
    3. Calibrate probe threshold:
       a. Load FoVer v2 correct-step scores from Exp 726 training outputs.
       b. threshold = np.percentile(correct_step_scores, 5).
          (5th percentile → < 5% of correct steps score above threshold = FP rate < 5%)
    4. Implement python/carnot/cascade/tier21_probe.py:
       a. Class Tier21ProbeWrapper wrapping JEPAReasonerProbe.
       b. score(query_text: str) -> (probe_score: float, verdict: str)
          verdict = "likely_violation" if score > threshold else "likely_correct"
       c. emit_violation_stub(query_id, probe_score): write to a FR11EventBus stub
          (simple list or file) if verdict == "likely_violation". Exp 734 replaces stub.
    5. Update python/carnot/cascade/cascade_router.py:
       a. After Tier 2 EORM: call Tier21ProbeWrapper.score().
       b. If verdict == "likely_violation": log violation, continue to Tier 2.5+.
          Call emit_violation_stub() to stub FR11EventBus.
       c. If verdict == "likely_correct": skip Tier 2.5, 2.6, 2.7. Return "likely_correct".
          Log: tier21_skip=True, probe_score=float.
    6. Create scripts/experiment_733_tier21_cascade.py:
       a. ExperimentTemplate(733, requires_gpu=True) +
          ExperimentTimeoutWatchdog(733, timeout_minutes=60).
       b. Run 200q GSM8K through cascade:
          - Condition A: no Tier 2.1 (baseline, same as .55 cascade).
          - Condition B: Tier 2.1 wired (new).
       c. Measure:
          - skip_rate_symcode: fraction of queries where Tier 2.5+ was skipped.
          - fn_delta: FN rate condition B minus FN rate condition A (must be < 0.05).
          - probe_latency_p99_ms (must be < 1ms, re-confirmed from Exp 726=0.025ms).
          - cascade_latency_delta_ms: condition A minus condition B per query.
       d. honest_verdict:
          - "tier21_cascade_success" if skip_rate_symcode >= 0.40 AND fn_delta < 0.05
            AND probe_latency_p99_ms < 1.0
          - "tier21_cascade_fn_too_high" if fn_delta >= 0.05
          - "tier21_cascade_low_skip" if skip_rate_symcode < 0.40 AND fn_delta < 0.05
       e. Gate signal: write results/tier21_cascade_gate.json with
          {"gate": "pass"/"fail", "skip_rate_symcode": float, "fn_delta": float,
           "probe_latency_p99_ms": float}. Exp 734 reads this.
       f. artifact: skip_rate_symcode, fn_delta, probe_latency_p99_ms,
          cascade_latency_delta_ms, tier21_threshold, honest_verdict.
    7. Write tests/python/test_experiment_733_tier21_cascade.py with 100% coverage:
       - test gated-blocked path writes correct status when gate file says "fail".
       - test Tier21ProbeWrapper skips Tier 2.5+ when verdict == "likely_correct".
       - test emit_violation_stub fires when verdict == "likely_violation".
       - test gate file written with correct schema.
       Each test traces to REQ-VER-035/036/037.
    8. Reconcile:
       - ops/status.md: add "Tier 2.1 JEPAReasonerProbe wired in cascade (Exp 733)".
         Update architecture diagram entry: "Tier 2.1 status: DEPLOYED".
       - ops/changelog.md: one-line with honest_verdict.
    9. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0 (Qwen3.5-0.8B hidden state extraction).
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp734-fr11-tier21-relay
  milestone: 2026.04.56
  deliverable: results/experiment_734_fr11_tier21_relay.json
  title: 'Exp 734: FR-11 Tier 2.1 Relay — Autonomous Self-Learning Loop (GATED on Exp 733, FR-11 MANDATORY)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    GATE CHECK (MANDATORY FIRST STEP): Read results/tier21_cascade_gate.json.
    If ("gate": "fail"): write results/experiment_734_fr11_tier21_relay.json with
    ("experiment": 734, "status": "gated_blocked", "gate_source": "exp733",
     "honest_verdict": "gated_blocked_tier21_cascade_failed", "schema": "carnot.result.v1")
    and STOP. Do not implement anything else.

    CONTEXT (only if gate passes): This is the first viable attempt at FR-11 (Autonomous
    Self-Learning Loop, PRD MANDATORY requirement). FR-11 has been blocked for 15+
    milestones because the violation detector (JEPA) never reached reliable AUC. Tier 2.1
    (JEPAReasonerProbe, AUC >= 0.75 confirmed by Exps 732-733) is now the violation
    signal source.

    FR-11 architecture: Tier 2.1 probe fires violation → FR11EventBus →
    (Subscriber 1) Tier 1 PerModelFPTracker.on_violation() increments constraint weight →
    (Subscriber 2) SessionMemory.cache_violation(violation_type, question_domain)
    After 5+ cached violations of same type: ConstraintTemplateLibrary.observe_pattern().

    This experiment replaces the stub FR11EventBus from Exp 733 with the real implementation.
    After wiring, run 50q validation and confirm at least one relay event is acked.

    EXISTING CODE TO READ FIRST:
    - python/carnot/cascade/tier21_probe.py — Tier 2.1 wrapper from Exp 733;
      find emit_violation_stub() to replace with real bus.
    - python/carnot/cascade/cascade_router.py — cascade routing (calls emit_violation_stub).
    - python/carnot/pipeline/fp_tracker.py (or equivalent) — PerModelFPTracker (Tier 1).
    - python/carnot/pipeline/session_memory.py (or equivalent) — SessionMemory.
    - python/carnot/pipeline/constraint_template_library.py (or equivalent)
      — ConstraintTemplateLibrary.
    - results/experiment_719_fr11_relay.json — prior attempt (gated_blocked); read to
      understand what FR11EventBus implementation was designed there.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement FR11EventBus. Wire Tier 2.1 violation events to Tier 1 weight updater
    and Tier 2 SessionMemory. Confirm relay operational with 50q validation.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-FR11-001 (FR11EventBus MUST deliver ViolationEvent to all registered
       subscribers within 200ms of emission; pub-sub, not blocking),
       REQ-FR11-002 (PerModelFPTracker MUST increment constraint_weight by 0.01 on each
       ViolationEvent for the affected constraint type; max weight cap = 2.0),
       REQ-FR11-003 (SessionMemory MUST cache violation_type and question_domain on each
       ViolationEvent; after >= 5 cached violations of same type, call
       ConstraintTemplateLibrary.observe_pattern()),
       REQ-FR11-004 (weight update throttle: max 1 Tier 1 update per 10 queries to prevent
       weight thrash),
       SCENARIO-FR11-001/002/003/004 to openspec/capabilities/self_learning/spec.md.
       If spec.md does not exist, create it.
    3. Implement python/carnot/pipeline/fr11_event_bus.py:
       a. Class ViolationEvent(dataclass): query_id, step_index, energy_score,
          probe_confidence, constraint_type, question_domain, timestamp.
       b. Class FR11EventBus:
          - subscribe(subscriber_fn: Callable[[ViolationEvent], None]) -> None
          - publish(event: ViolationEvent) -> None (calls all subscribers synchronously)
          - events_published: int (counter)
          - events_acked: int (incremented by each subscriber that returns without error)
    4. Implement or update python/carnot/pipeline/fp_tracker.py:
       a. PerModelFPTracker.on_violation(event: ViolationEvent) -> None:
          - Increment constraint_weight[event.constraint_type] by 0.01.
          - Cap at 2.0.
          - Throttle: skip update if update_count % 10 != 0.
          - Log: constraint_type, new_weight, throttled (bool).
    5. Implement or update python/carnot/pipeline/session_memory.py:
       a. SessionMemory.on_violation(event: ViolationEvent) -> None:
          - Cache: violations_by_type[event.constraint_type] += 1.
          - Cache: violations_by_domain[event.question_domain] += 1.
          - If violations_by_type[type] >= 5:
            call ConstraintTemplateLibrary.observe_pattern(type, event).
    6. Update python/carnot/cascade/tier21_probe.py:
       a. Replace emit_violation_stub() with FR11EventBus.publish(ViolationEvent(...)).
       b. Wire PerModelFPTracker and SessionMemory as subscribers at cascade init.
    7. Create scripts/experiment_734_fr11_tier21_relay.py:
       a. ExperimentTemplate(734, requires_gpu=True) +
          ExperimentTimeoutWatchdog(734, timeout_minutes=60).
       b. Run 50q GSM8K through cascade with FR-11 relay fully wired.
       c. Measure:
          - relay_events_published: total ViolationEvents published.
          - relay_events_acked: events acked by all subscribers without error.
          - relay_latency_p99_ms: time from publish to all subscribers returning.
          - fp_rate_before: FP rate before any weight update.
          - fp_rate_after: FP rate after weight updates applied.
          - fp_rate_delta = fp_rate_after - fp_rate_before.
          - templates_added: ConstraintTemplateLibrary.observe_pattern() call count.
       d. honest_verdict:
          - "fr11_relay_operational" if relay_events_acked >= 1 AND
            relay_latency_p99_ms < 200
          - "fr11_relay_no_violations" if relay_events_published == 0 (no violations
            detected in 50q — unexpected given FoVer v2 data)
          - "fr11_relay_latency_fail" if relay_latency_p99_ms >= 200
       e. artifact: relay_events_published, relay_events_acked, relay_latency_p99_ms,
          fp_rate_delta, templates_added, fr11_relay_operational (bool), honest_verdict.
    8. Write tests/python/test_experiment_734_fr11_relay.py with 100% coverage:
       - test gated-blocked path writes correct status.
       - test FR11EventBus delivers events to all subscribers.
       - test PerModelFPTracker increments constraint_weight on event.
       - test SessionMemory calls observe_pattern after 5 violations of same type.
       - test throttle prevents > 1 update per 10 queries.
       Each test traces to REQ-FR11-001/002/003/004.
    9. Reconcile:
       - ops/status.md: add "FR-11 relay operational (Exp 734)" with relay_events_acked.
         If operational: mark FR-11 as UNBLOCKED. Note "First FR-11 relay in 15+ milestones."
       - ops/changelog.md: one-line with honest_verdict.
    10. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0 (Tier 2.1 requires Qwen3.5-0.8B forward pass).
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp735-kan-tier0b-integration
  milestone: 2026.04.56
  deliverable: results/experiment_735_kan_tier0b_integration.json
  title: 'Exp 735: KAN Distill v3 Tier 0b Integration — Prompt-Injection Pre-filter Production Deploy'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: KAN Distill v3 (Exp 724) passed the production gate with AUROC=0.9078. The
    deployment checkpoint was saved to models/kan_distill_v3_tier0b.safetensors. This
    experiment wires it as Tier 0b in the production cascade.

    Tier 0b sits before CarnotThinkProbe (Tier 0a) — it is the very first check in the
    cascade. If a prompt is flagged as prompt-injection (score > 0.5), the query is routed
    to the safety pipeline INSTEAD of the verification cascade. This prevents the expensive
    verification tiers from running on adversarial inputs.

    Key constraint: the FP rate on benign GSM8K prompts MUST be < 5%. If Tier 0b flags
    too many benign prompts as injections, the verification cascade will be bypassed for
    legitimate questions, degrading user experience. This is the primary risk.

    EXISTING CODE TO READ FIRST:
    - models/kan_distill_v3_tier0b.safetensors — deployment checkpoint (must exist).
    - python/carnot/cascade/cascade_router.py — routing logic to update.
    - python/carnot/models/kan_classifier.py (or equivalent) — KAN model class.
    - results/experiment_724_kan_distill_v3.json — AUROC=0.9078, gate_passed=True.
