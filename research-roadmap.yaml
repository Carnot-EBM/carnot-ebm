milestone: 2026.06.408
milestone_title: "PIVOT the ARC north star to verifier-grounded CONFIG-RULE INDUCTION (the operator's #1 lever -- 9 toggle/config games) after the oracle-distinct first-error LOCALIZER RETIRED as position-bound. .407 took the honest next step on the .406 quarantine -- REAL verifier-checked intervention first-error data (arXiv:2601.14209) instead of synthetic injection -- and the localizer RETIRED: exp4403's real-intervention localizer STILL tied the content-blind position-only baseline (FoVer position-only F1=1.0 -- first-error onset is near-deterministic in POSITION, ~zero CONTENT headroom; delta_vs_position_only=0.0, template_family_holdout_drop=0.0; GAP-4 ARC delta +0.019 CI95 [-0.13,+0.17] includes 0), retire_if_same_verdict fired (two confounded attempts is enough). Self-learning compounds=false (exp4407 saturated F1=1.0 flat). Cross-domain detection calibrated=false (exp4408: code_humaneval at chance AUROC 0.577 CI95 [0.46,0.69] n=539 -- verifier domain-bound). ARC STILL 34 reproducible levels / 17 games, 0 new (exp4405 deeper + exp4406 tails: per-mechanic unit tests PASSED but reproduction did NOT follow, lookahead_fidelity stuck ~0.73 -- static unit tests document blockers but do not deepen ARC). The .408 reframe (what the evidence forces): the oracle-distinct LEARNED-verifier vehicles are exhausted (localizer retired .407, GAP-3 content-energy retired earlier); the freshest, validated, operator-hands-on lever is the verifier as the GROUNDING ORACLE for an LLM-PROPOSED win-RULE -- Config Layer B proved a local offline gemma-4-12B that CANNOT read a raw 64x64 scene CAN induce a GROUNDED relational win-rule (ka59 Tier-2 count_4==32, fires-on-win, 0 FP) when handed object-centric digests, and the verifier grounds/rejects the proposed predicate; the operator's first-contact audit names the 9 toggle/config games as 'the clear #1 next investment and the genuinely hard one'. PRIMARY = verifier-grounded config-rule SOLVE (exp4414) + Agent2World adaptive E3 repair (exp4415, flagged_for_v408). Plus a definitive hidden-state FALSIFICATION of the localizer (exp4416), GAP-4 with a LOCAL generator (exp4417), a config-rule-vocabulary self-learning transfer (exp4418), SteerConf code-domain calibration repair (exp4419). paper_ready=True (FoVer 0.9131, G1-G4) is the FROZEN headline."
milestone_doc: openspec/change-proposals/research-roadmap-v408.md
milestone_overview: |
  .407 (exp4412 capstone, verdict v407_localizer_position_bound_retired_compounds_false_calibrated_false_arc_levels_34_publication_ready)
  RETIRED the oracle-distinct first-error LOCALIZER. .408 takes the honest pivot the evidence forces:

    PHASE 0 -- TRANSITION: exp4413 archive .407 -> activate .408; record the TRUE close-state.

    PHASE A -- ARC NORTH STAR: verifier-grounded config-rule induction + adaptive E3 (operator MANDATORY):
      A1 (exp4414, PRIMARY) Config/toggle SOLVE via verifier-grounded win-RULE induction. Reuse the
        validated scaffolded inducer (arc3_config_layerb_scaffolded.py): object-centric digest -> local
        gemma-12B proposes is_win -> verifier GROUNDS it on banked win/non-wins -> wire the grounded
        predicate as the OfflineSolver verifier to drive +1 level. ka59 L2 + first-contact win-rule
        grounding on >=2 UNSOLVED config games (bp35/dc22/g50t/lf52/s5i5). verifier_is_oracle=true.
      A2 (exp4415) Agent2World ADAPTIVE E3 mechanic repair (flagged_for_v408, arXiv:2512.22336) + AERA
        speed-depth/leakage controls (2605.25931): a Testing Team generates ADAPTIVE behavior tests from
        failing rollout traces (NOT static named-register tests) on ar25 L2 + tn36 L8 + lp85 L6.

    PHASE B -- ORACLE-DISTINCT FRONTIER (operator P0 2026-06-14) + verifier-earns-its-place (sovereignty):
      B1 (exp4416) Hidden-state first-error localization AUDIT (arXiv:2605.13772): the DEFINITIVE
        falsification of the retired TEXT localizer -- does a hidden-state transport margin carry ANY
        recoverable NON-position first-error signal? One bounded diagnostic vs the position-only baseline.
        Emit hidden_state_localizer_has_nonposition_signal BARE bool. A clean null CONCLUSIVELY closes the
        first-error-localizer program. verifier_is_oracle=false. prior_failures exp4403.
      B2 (exp4417) GAP-4 rule-execution verifier with a LOCAL open-weight generator arm (the
        decentralization tier of the GAP-4 forward protocol): replace contaminated codex with a local
        Gemma-4/Qwen3.6 generator; graded min-hamming gate (tau=0.005) + k-consistency; pass@2 vs the
        matched no-verifier control. verifier_is_oracle=true (execution gate; NOT an oracle-distinct moat).

    PHASE C -- CONTINUOUS SELF-LEARNING (mandated; the substrate that now has real headroom):
      exp4418 Config-rule VOCABULARY transfer from previously-seen games (operator's 'derive config-rules
        from previously-seen games'): build a vocabulary of relational primitives from solved config-game
        win-rules; does vocabulary-seeding raise the grounding rate on HELD-OUT config games vs cold-start?
        Emit config_rule_vocabulary_transfers BARE bool. verifier_is_oracle=false. NOT gated.

    PHASE D -- CROSS-DOMAIN DETECTION CALIBRATION REPAIR (complementary; cached; CPU):
      exp4419 SteerConf steered-confidence (arXiv:2503.02863) to rescue code_humaneval detection where the
        .407 semantic-confidence-aggregation could not. Emit detection_calibrated_multi_domain BARE bool.

    PHASE E -- INFRA + SOTA + HARDWARE + CAPSTONE: exp4420 SOTA-ingestion -> .409; exp4421 registry/gaps
      hygiene + GAP-4 guard; exp4422 KV260 continuity (opportunistic); exp4423 capstone .408 + the headline
      decision + G1-G4.

  HARD RULE (every task): conductor STOOD-DOWN on TRM/generator training -- NO task launches train.py, runs
  pkill/kill against it, or writes results/trm_runs/. A2D2 (2606.13565) + SEPO (2502.01384) are OUT-OF-BAND/
  operator-owned. Qwen FORBIDDEN as the TRAINED base; Qwen/Gemma GGUF as an off-policy judge/generator/proposer
  is fine. Every verifier-value task declares verifier_is_oracle honestly (Circularity Discipline): config-rule
  SOLVEs + Agent2World E3 + GAP-4 are execution-grounded (verifier_is_oracle=true, ARC progress NOT a moat
  headline); the localizer audit + calibration + vocabulary-transfer are oracle-distinct (verifier_is_oracle=
  false + matched control + CI95-excl-0). DO NOT re-propose: the SYNTHETIC or REAL-intervention first-error TEXT
  localizer (RETIRED exp4392/4403 -- the hidden-state audit B1 is a one-shot FALSIFICATION, NOT a redeployment),
  GAP-3 trained-content-energy, cross-game ARC value transfer (RETIRED exp4318/4331/4342), in-generation
  DiffusionGemma (RETIRED exp4374), LLM-heuristic efficiency (SETTLED exp4370), cross-domain SELECTION (RETIRED
  exp4314). NO autonomous edits to docs/index.html / README / paper prose. Online ARC stays operator-gated (NO
  leaderboard submission; only offline-reproduced levels count). paper_ready=True (FoVer 0.9131) is the FROZEN
  headline -- .408 adds lenses, never a substitute.

