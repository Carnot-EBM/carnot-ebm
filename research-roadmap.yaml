# merits: A1 proved code+TTA cannot predict change-VALUE, so .451 asks whether a DIFFERENT representation can.
# Testing alternative representations IS the proper test of the METHOD ceiling A1b failed to run. .451 A1
# (HEADLINE) = agent-authored decision-need targets (arXiv:2606.25421); A1b (gated on A1 not closing the gap)
# = action-prefix latent adapter (arXiv:2606.26217 + 2603.19312) -- a structurally-different second
# representation that MUST genuinely run live (the .450 A1b 13.7s non-test fix). If BOTH fail -> the
# change-VALUE gap is representation-invariant and the capstone escalates to the operator. Energy CONCLUDED
# (2026-06-26, negative); TTA-on-code-engine, stronger-local-code-inducers, coverage/exploration/perception-
# from-grid/selection all RETIRED -- do NOT re-propose any of them.
