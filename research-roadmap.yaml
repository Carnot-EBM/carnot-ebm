  title: "Potts Machine q=3 Verilog + Python Simulation — Correct/Partial/Violated Energy States"
  model: opus
  prompt: |
    CONTEXT:
    The binary Ising sampler (q=2) encodes constraints as (violated=+1, satisfied=-1).
    A Potts machine (q=3) encodes (correct=0, partial=1, violated=2) — enabling partial-credit
    constraint scoring. This is the natural extension of Carnot's PottsMachineVerifier (Exp 534)
    to hardware.

    arXiv 2602.04200 (mean-field constraints for Potts machines) confirms that sparse coupling
    structure is preserved for q=3, making this FPGA-compatible.

    CLAUDE.md hardware wishlist explicitly notes: "New Verilog requirement: ising_sampler_v1.v
    needs a q-state extension to support Potts sampling."

    Vivado may not be available on this machine. Deliverable: RTL file + validated Python simulation.

    EXISTING CODE TO READ FIRST:
    - hardware/kv260/ising_sampler_v1.v (current binary Ising — understand AXI interface)
    - hardware/kv260/ising_sampler_v2.v (synchronous v2 — prefer as base for Potts extension)
    - python/carnot/verify/potts_machine.py (PottsMachineVerifier from Exp 534)
    - research-hardware-wishlist.md (Potts Machine Motivation section)

    TASK PART 1 — PYTHON SIMULATION (always runs):
    1. Read python/carnot/verify/potts_machine.py to understand q=3 energy formulation.
    2. Create python/carnot/samplers/potts_sampler.py:
       class PottsSampler:
           """q=3 Potts machine sampler using synchronous checkerboard update.
           State: each spin in (0, 1, 2) (correct / partial / violated).
           Energy: E = -Σ_(ij) J_(ij) * δ(s_i, s_j)  (Potts Hamiltonian)
           Update: for each spin i, compute E_i(a) for a in (0,1,2),
                   sample from Softmax(-β * [E_i(0), E_i(1), E_i(2)])
           """
           def __init__(self, n_spins: int, q: int = 3, beta: float = 2.0): ...
           def sample(self, J: np.ndarray, n_steps: int = 1000) -> np.ndarray:
               """Return spin configuration after n_steps updates.""" ...
           def energy(self, J: np.ndarray, spins: np.ndarray) -> float: ...

    3. VALIDATE SIMULATION on 16-spin test problem:
       - Initialize random J matrix (16x16, q=3)
       - Run 10000 steps
       - Verify: energy monotonically non-increasing (in expectation)
       - Verify: distribution of final states is sensible (not degenerate)
       - Compare to binary Ising on same coupling matrix (2-state version)

    TASK PART 2 — VERILOG RTL:
    Create hardware/kv260/potts_sampler_v1.v:
    - Based on ising_sampler_v2.v structure (synchronous checkerboard)
    - Extend spin register from 1 bit per spin to 2 bits per spin (encodes (0,1,2))
    - Conditional energy: for each spin i, compute three energy deltas E_i(0), E_i(1), E_i(2)
    - 3-entry softmax unit: exp(-β*E_i(a)) for a in (0,1,2) using 8-bit fixed-point
    - Categorical sampler: 2-bit LFSR → select state based on cumulative softmax
    - AXI-Lite interface: same register map as ising_sampler_v2.v (compatible)
    - Parameters: N_SPINS=64 (default), Q_STATES=3, BETA_FIXED=8'h40 (β=2.0)

    Include synthesis estimate comment in RTL:
