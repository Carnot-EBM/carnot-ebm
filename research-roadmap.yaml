  - id: exp2605
    milestone: "2026.05.249"
    deliverable: "results/experiment_2605_tier0y_cot_verifier.json"
    title: "Tier 0y CoT Consistency Verifier (arXiv:2603.03538 Online Learnability)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: new_verifier

    prior_failures:
      - experiment_id: exp103-kan-energy-tier
        verdict: "complete: early KAN energy tier experiment"
        addressed_by: "exp103 implemented a KAN-based energy tier. This implements Tier 0y — a bigram transition entropy verifier motivated by arXiv:2603.03538's Littlestone dimension criterion (simple consistent verifiers generalize better OOD). Completely different architecture and theoretical motivation."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      New paper: "Online Learnability of Chain-of-Thought Verifiers: Soundness and Completeness
      Trade-offs" (arXiv:2603.03538). Key finding: simple consistent verifiers outperform complex
      inconsistent ones on out-of-distribution examples (Littlestone dimension bound).

      This directly explains why tier0s/tier0u fail on natural FoVer text: they were trained on
      synthetic pairs with complex template-dependent structure that does not generalize OOD.

      Tier 0y (CoT Consistency Verifier) implements the simplest possible consistent verifier:
      bigram transition entropy in the response text. Low entropy = high consistency = low
      hallucination risk. This verifier has minimal Littlestone dimension and should generalize
      better OOD than tier0s/tier0u.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/
      - python/carnot/verify/base_verifier.py  (for BaseVerifier interface)

      TASK: Implement Tier 0y bigram consistency verifier and evaluate on FoVer.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds
         b. `python -c "import sklearn"` succeeds
         c. FoVer corpus discoverable (same path discovery as exp2596)
         If precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Implement python/carnot/verify/tier0y_cot_consistency.py:
         class Tier0yCoTConsistencyVerifier(BaseVerifier):
           def score(self, text: str) -> float:
             # Compute bigram transition entropy
             tokens = text.lower().split()
             if len(tokens) < 3:
               return 0.0  # short text = no signal
             bigrams = list(zip(tokens[:-1], tokens[1:]))
             unique_bigrams = set(bigrams)
             # Transition matrix: freq of each bigram
             from collections import Counter
             freq = Counter(bigrams)
             total = len(bigrams)
             # Entropy H = -sum(p * log2(p))
             entropy = -sum((c/total) * math.log2(c/total) for c in freq.values() if c > 0)
             # Normalize by log2(vocab_size^2) to get [0,1]
             max_entropy = 2 * math.log2(max(len(set(tokens)), 2))
             return min(1.0, entropy / max_entropy) if max_entropy > 0 else 0.0

      2. Evaluate on FoVer test split (random_state=42, test_size=0.20):
         For each (context, claim) pair: score = verifier.score(claim)
         Compute AUROC vs hallucination labels.
         Also compute: soundness (precision@0.5), completeness (recall@0.5).

      3. Compare to tier0s (0.3758) and tier0u (0.5360) real-corpus AUROCs if exp2596/exp2597
         artifacts exist. Log comparison.

      4. If tier0y_auroc > 0.55: tier0y_viable=True.

      5. Write results/experiment_2605_tier0y_cot_verifier.json with required fields.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
      - tier0y_auroc: float — primary metric (must be documented)
      - tier0y_soundness: float — precision@0.5 threshold
      - tier0y_completeness: float — recall@0.5 threshold
      - tier0y_viable: bool — True iff tier0y_auroc > 0.55
      - implementation_path: str — path to tier0y_cot_consistency.py
      - random_seed: 42
      - duration_s: float — wall-clock time
      - preconditions_checked: list of {{resource, available, check}}

      Run: `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"`.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


