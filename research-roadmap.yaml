milestone: "2026.06.331"
milestone_title: "Finish the De-Contamination — does verifier value generalize once the test is GENUINELY fair? Fix the .330 gate cascade, audit the AUROC=1.0 leak, build a real NLI grounding verifier on a corpus WITH held-out evidence, and run the cross-domain re-measurement .330 skipped."
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md

# OUTER-LOOP / OPERATOR PRE-STAGED ROADMAP (2026-06-01, Claude Opus 4.8). PIVOT RATIONALE:
# .330 set out to de-contaminate the .329 "verifier is math-only" verdict but DID NOT FINISH. A gate
# cascade (scripts/conductor_gates.py:_eval_op compared a principle-annotated dict {{value:true,...}} vs the
# bare expected true, which _coerce_gate_value does not unwrap) blocked exp3586 -> the centerpiece exp3588
# (corrected cross-domain re-measurement) NEVER RAN -> exp3589 blocked. The one factual number that landed
# (exp3587 grounding verifier AUROC=1.0) is IMPLAUSIBLE_PERFECT contamination: the corpus
# data/realistic_factual_corpus_v1.jsonl has NO evidence column ({{question,answer,is_hallucination,
# model_confidence}}), so a grounding verifier scoring 1.0 is label-leaking, and nli_substrate was a
# text-statistical proxy (no real NLI model). The .330 capstone "math_only_earned/329_null_was_artifact"
# verdict was synthesized from this broken partial data -- the de-contamination question is STILL OPEN.
# .331 finishes it HONESTLY: (1) bare gated fields fix the cascade; (2) adversarially adjudicate the 1.0
# leak; (3) build a factual corpus WITH independent held-out evidence (HaluEval `knowledge`) + confidence
# headroom; (4) build a REAL NLI-model grounding verifier (HalluSearch/VeriScore recipe, arXiv:2504.10168/
# 2406.19276); (5) run the centerpiece re-measurement + the literature math->code positive control
# (arXiv:2506.00027, +4-8pts) against the discriminative-fragility falsifier (ThinkPRM arXiv:2504.16828).
# Either outcome is genuine learning. INVARIANTS: paper_ready=true (G1-G4 met, do NOT regress); P0.1 stays
# honest-negative (do NOT re-test Route-1/Route-2). All tasks default agent_type: gemini.

