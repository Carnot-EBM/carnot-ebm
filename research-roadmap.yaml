  - id: exp5719-sota-answer-channel-forensics
    milestone: "2026.07.511"
    title: "Diagnose the .510 GGUF answer-channel failure across the mandated SOTA model families"
    priority: critical
    track: continuous-learning
    deliverable: results/experiment_5719_sota_answer_channel_forensics.json
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 300
    prior_failures:
      - experiment_id: exp5708-sota-exact-constraint-canary
        verdict: "blocked: parse_failures"
        addressed_by: "This is a disjoint positive-control diagnostic, not another stream: it reproduces raw completion then changes to GGUF-native chat templates, removes newline truncation, budgets termination, and freezes a protocol only after exact controls pass."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5708 authenticated CUDA for `unsloth/gemma-4-26B-A4B-it-GGUF`, but raw completion used max_tokens=32 and newline stop. Of 50 rows, 21 ended by length, 26 lacked the answer, and 3 parsed; repeated text appeared. Validator disagreement was zero. Diagnose the completion/chat boundary on small exact controls, not a full panel or grammar-engine retry. arXiv:2607.11317 motivates direct termination/repetition telemetry. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/python/carnot/model_cache.py
      - {project_root}/results/experiment_5708_sota_exact_constraint_canary.json
      - {project_root}/results/experiment_5708_sota_exact_constraint_canary.rows.jsonl
      - {project_root}/tests/python/test_experiment_5708_sota_exact_constraint_canary.py
      - {project_root}/python/carnot/pipeline/cross_model_typed_memory_retry.py
      - {project_root}/openspec/capabilities
      - {project_root}/tests/python

      TASK:
      Reproduce and classify the Exp5708 failure, qualify a bounded GGUF-native answer protocol across mandated models, and emit results/experiment_5719_sota_answer_channel_forensics.json.

      CONCRETE STEPS:
      1. Add/extend OpenSpec REQ-* before implementation. Declare `MODEL_SPECS` for `unsloth/Qwen3.6-35B-A3B-GGUF`, `unsloth/gemma-4-31B-it-GGUF`, and `unsloth/gemma-4-26B-A4B-it-GGUF`. Use cached `.gguf` files and llama.cpp APIs, never transformers tokenization. Legacy small models are smoke-only.
      2. Resolve/hash models, record quantization/size, and authenticate CUDA llama-cpp-python, positive layer offload, devices, and before/during/after memory. CPU fallback cannot qualify.
      3. Freeze at least 6 positive finite-label/arithmetic controls and 4 negative malformed/truncation/repetition controls per model. Do not use Exp5720 science rows.
      4. Run a preregistered matrix: exact Exp5708 raw-completion control; `create_chat_completion` with embedded native template; newline-stop versus EOS-only; adequate answer budget; and a reason-then-`FINAL: <value>` envelope. Preserve template hash, raw text, finish reason, tokens, timing, repetition, and parser outcome.
      5. Do not use JSON grammar, XGrammar, llguidance, external scorers, an LLM parser, or logit bias as semantic authority. Deterministic parsing and exact validators decide controls.
      6. Classify template mismatch, length truncation, premature stop, sentinel omission, repetition, malformed envelope, runtime failure, and semantic exact error separately.
      7. Freeze one protocol only if at least two mandated families each achieve 100% positive-control parse success, zero missing/truncated positives, zero validator disagreement, bounded repetition, and authenticated CUDA. Selection uses controls only.
      8. REQUIRED ARTIFACT FIELDS: with `field_principles`, `MODEL_SPECS`, `resolved_model_receipts`, `model_hashes`, `gguf_filenames`, and `quantizations` — weights exact; `llama_cpp_version`, `llama_cpp_build_info`, and `native_chat_template_receipts` — runtime reconstructs; `cuda_device_receipts`, `n_gpu_layers_offloaded`, `gpu_memory_before_mb`, `gpu_memory_peak_mb`, `gpu_memory_after_mb`, and `cuda_offload_authenticated` — GPU evidence; `control_manifest`, `protocol_matrix`, `raw_response_manifest_path`, and `raw_response_hashes` — diagnosis lossless; `finish_reason_counts`, `truncation_count`, `missing_answer_count`, `repetition_failure_count`, `parse_failure_count`, `semantic_error_count`, and `validator_disagreement_count` — failures separate; `root_cause_attribution`, `qualified_protocol`, `qualified_model_ids`, `qualified_model_count`, `positive_control_parse_rate`, and `answer_channel_ready_score` — downstream gate explicit; `native_json_grammar_used=false`, `external_scorer_used=false`, and `retired_runtime_used=false` — closed paths; `inference_substrate=local_llama_cpp_python_cuda_gguf_diagnostic`, `random_seeds`, `reproducibility_checksum`, and `honest_verdict` — replay/verdict.
      REQUIRED GATE SCALAR: `cuda_offload_authenticated_score` — 1.0 only when at least two qualified models have positive layer/memory receipts, otherwise 0.0.
      9. Run model, CUDA, template, parser, validator, repetition/truncation, schema, adversarial, spec-coverage, and root-clutter tests. Release GPU resources on every path.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5720-sota-attested-exact-envelope-canary
    milestone: "2026.07.511"
    title: "Gated on Exp5719 channel readiness: build a sealed attested exact-envelope SOTA canary"
    priority: critical
    track: continuous-learning
    deliverable: results/experiment_5720_sota_attested_exact_envelope_canary.json
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 360
    prior_failures:
      - experiment_id: exp5708-sota-exact-constraint-canary
        verdict: "blocked: parse_failures"
        addressed_by: "Exp5719 first qualifies native chat on disjoint controls; this uses that frozen protocol, two flagship families, termination-safe budgets, attested exact envelopes, and conflict-set receipts on a new corpus."
        retire_if_same_verdict: true
      - experiment_id: exp5615-native-llamacpp-cuda-runtime-certificate
        verdict: "blocked_native_cuda_runtime_certificate_failed_terminal_retirement_evidence"
        addressed_by: "The retired JSON-grammar certificate stays closed; this uses ordinary GGUF-native chat plus deterministic exact validation and does not require three-model grammar parity."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp5719-sota-answer-channel-forensics
        artifact_field: answer_channel_ready_score
        op: ">="
        value: 1.0
        principle: "A sealed stream is inadmissible until disjoint exact controls pass."
      - upstream: exp5719-sota-answer-channel-forensics
        artifact_field: positive_control_parse_rate
        op: "=="
        value: 1.0
        principle: "Every qualified positive control must parse."
      - upstream: exp5719-sota-answer-channel-forensics
        artifact_field: qualified_model_count
        op: ">="
        value: 2
        principle: "The flagship pair requires two qualified model families."
      - upstream: exp5719-sota-answer-channel-forensics
        artifact_field: cuda_offload_authenticated_score
        op: ">="
        value: 1.0
        principle: "CPU fallback cannot masquerade as the SOTA stream."
    prompt: |
      CONTEXT:
      Exp5719 must provide a frozen non-retired protocol qualified on controls disjoint from this task. EG-VAR motivates the authority split: model outputs are proposals; only deterministic exact-validator receipts admit an envelope. MaxSAT feedback motivates bounded conflict sets while hard constraints stay authoritative. This replaces the parse-failed Exp5708 stream. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/results/experiment_5708_sota_exact_constraint_canary.json
      - {project_root}/results/experiment_5719_sota_answer_channel_forensics.json
      - {project_root}/python/carnot/model_cache.py
      - {project_root}/python/carnot/verifiers
      - {project_root}/openspec/capabilities
      - {project_root}/tests/python

      TASK:
      Generate a new sealed chronological exact-constraint stream with flagship local GGUFs, admit only exact-validator-attested envelopes, and emit results/experiment_5720_sota_attested_exact_envelope_canary.json.

      CONCRETE STEPS:
      1. Enforce all gates and verify Exp5719 artifact/hash/protocol receipts. Add/extend OpenSpec REQ-* before implementation.
      2. Declare `MODEL_SPECS` using the cached_sota_pair() pattern for `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF`. Resolve immutable `.gguf` files, hashes, quantizations, and CUDA receipts. Never load GGUF through transformers.
      3. Before inference, preregister/seal at least 64 chronological balanced rows across exact finite-state, finite-domain arithmetic, hard/soft preference, format stress, and TrapQA-style shortcut families. Balance denominators across both models and include answer/abstention cases.
      4. Use only Exp5719's protocol. Preserve prompt, template hash, raw response, finish reason, tokens, timing, telemetry, and raw hash. Missing, truncated, repeated, or unparsable rows fail; never impute them.
      5. Parse the bounded `FINAL:` envelope deterministically. Run independent exact FSM/arithmetic/SAT-or-MaxSAT validators. For inconsistent proposals record hard constraints, soft assignments, largest mutually consistent subset, and exact conflict set. Only the exact validator mints the admitted label.
      6. Double-check a stratified sample with independent enumeration/validation. Any disagreement blocks. Record validator versions/hashes.
      7. Commit row order before learner access. Seal a prospective prefix and untouched suffix with IDs, family/model strata, timestamps, prompt/model/raw/label receipt hashes, split hashes, and stream-root commitment. No outcome-driven split tuning.
      8. Set `sota_stream_ready_score=1.0` only if both models have authenticated CUDA, every row exists/parses, repetition/truncation/missing counts are zero, disagreement is zero, every admitted row has attestation, commitments verify, and no retired runtime/external scorer ran.
      9. REQUIRED ARTIFACT FIELDS: with `field_principles`, `MODEL_SPECS`, `resolved_model_receipts`, `model_hashes`, `gguf_filenames`, `quantizations`, and `llama_cpp_runtime_receipt` — execution exact; `cuda_device_receipts`, `n_gpu_layers_offloaded`, `gpu_memory_receipts`, and `cuda_offload_authenticated` — offload evidence; `qualified_protocol_hash`, `generation_config`, `preregistered_panel`, `family_counts`, and `model_family_counts` — design fixed; `row_manifest_path`, `raw_response_hashes`, and `attested_envelope_hashes` — output lossless; `attestation_schema`, `exact_validator_versions`, `conflict_set_receipts`, and `validator_disagreement_count` — authority explicit; `missing_row_count`, `truncation_count`, `repetition_failure_count`, and `parse_failure_count` — failures visible; `prospective_prefix_hash`, `sealed_suffix_hash`, and `stream_root_commitment` — chronology immutable; `headline_model_count=2` and `sota_stream_ready_score` — gates honest; `model_weight_mutation=false`, `native_json_grammar_used=false`, `external_scorer_used=false`, and `retired_runtime_used=false` — boundaries; `inference_substrate=flagship_local_llama_cpp_cuda_gguf_attested_exact_stream`, `random_seeds`, `reproducibility_checksum`, and `honest_verdict` — replay/verdict.
      10. Run gate, model, CUDA, parser, exact/conflict/independent-validator, commitment, schema, adversarial, spec-coverage, and root-clutter tests. Release GPUs on all paths.
