- id: exp826-prm-cross-domain-benchmark
  milestone: 2026.04.63
  deliverable: results/experiment_826_prm_cross_domain_benchmark.json
  title: 'Exp 826: PRM Cross-Domain Benchmark (arXiv 2506.00027, 2601.17223, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2506.00027 (From Mathematical Reasoning to Code: Does Process Reward Model
    Generalize?) reports that PRMs trained on math reasoning degrade ~8% AUC when applied to
    code verification. arXiv 2601.17223 (Beyond Outcome Verification) proposes step-level
    VerificationCertificates to make PRM judgments auditable. This experiment uses JEPA v23
    results from Exps 824-825 to compute Carnot's cross-domain degradation vs the 8% baseline
    and generate certificates for failed OOD steps.

    CPU-only. Uses stored results from Exps 820 (HumanEval CoT traces), 824 (JEPA v23 model),
    and 825 (cross-domain AUC). No live GPU required.

    EXISTING CODE TO READ FIRST:
    - results/experiment_825_jepa_v23_eval_fr11_tier3.json — auc_gsm8k, auc_humaneval, auc_arc
    - results/experiment_824_jepa_v23_limo_corpus.json — in-distribution baseline AUC
    - results/experiment_820_gguf_import_fix_code_repair_v5.json — HumanEval step traces
    - research-references.md — PRM cross-domain section (arXiv 2506.00027)
    - openspec/capabilities/pipeline/spec.md — REQ-VERIFY entries

    TASK: Compute cross-domain AUC degradation, compare to 8% published baseline, generate
    VerificationCertificates for 20 failed OOD steps, write
    results/experiment_826_prm_cross_domain_benchmark.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/pipeline/spec.md:
       - REQ-VERIFY-145: For cross-domain PRM evaluation, Carnot MUST report cross_domain_degradation
         = auc_in_dist - auc_ood. If degradation > 0.08 (8% baseline from arXiv 2506.00027):
         report which domain shows the largest gap (GSM8K vs HumanEval vs ARC-Challenge).
       - SCENARIO-VERIFY-174: Load Exp 825 AUC results. Compute degradation. If above baseline:
         identify top failing domain. Emit VerificationCertificate for 20 randomly selected
         OOD steps that JEPA v23 scored as high-energy (likely errors).
    3. Create scripts/experiment_826_prm_cross_domain_benchmark.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(826) + ExperimentTimeoutWatchdog(826, timeout_minutes=30).
       c. Load from results/experiment_825_jepa_v23_eval_fr11_tier3.json:
          auc_gsm8k, auc_humaneval, auc_arc, overall_ood_auc.
          If Exp 825 blocked_gate: write this exp as data_unavailable and stop.
       d. Load from results/experiment_824_jepa_v23_limo_corpus.json:
          in_dist_auc (GSM8K in-distribution).
       e. Compute:
          cross_domain_degradation_humaneval = in_dist_auc - auc_humaneval
          cross_domain_degradation_arc = in_dist_auc - auc_arc
          cross_domain_degradation_max = max(degradation_humaneval, degradation_arc)
          beats_baseline = (cross_domain_degradation_max <= 0.08)
       f. Load VerificationCertificates emitted by Exp 825 (from artifact or regenerate 20).
          For each certificate: check if z3_verdict corroborates jepa_energy_delta direction.
          corroboration_rate = n_z3_corroborates / n_certificates.
       g. If cross_domain_degradation_max > 0.08: identify worst_domain (humaneval or arc).
          Analyze top-5 failing OOD steps: common constraint_type or step_position.
       h. Artifact fields: in_dist_auc, auc_humaneval, auc_arc, cross_domain_degradation_humaneval,
          cross_domain_degradation_arc, cross_domain_degradation_max, beats_baseline,
          published_baseline=0.08, corroboration_rate, n_certificates=20, honest_verdict.
       i. honest_verdict:
          - "above_baseline" if beats_baseline (our degradation <= 8%)
          - "at_baseline" if abs(degradation_max - 0.08) <= 0.01
          - "below_baseline" if degradation_max > 0.09
          - "data_unavailable" if exp825 blocked
    4. Write tests/python/test_experiment_826_prm_cross_domain_benchmark.py with 100% coverage:
       - test cross_domain_degradation computed correctly from auc values
       - test beats_baseline threshold logic (0.08 boundary)
       - test corroboration_rate computed from certificate z3_verdict alignment
       Each test traces to REQ-VERIFY-145 and SCENARIO-VERIFY-174.
    5. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict and cross_domain_degradation_max.
       - ops/status.md: "Exp 826: PRM cross-domain degradation=<value> vs baseline 8%. Verdict: <verdict>."
       - research-references.md: add Exp 826 results note under arXiv 2506.00027 entry.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_826_prm_cross_domain_benchmark.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp827-kv260-nextpnr-xilinx-v3
  milestone: 2026.04.63
  deliverable: results/experiment_827_kv260_nextpnr_xilinx_v3.json
  title: 'Exp 827: KV260 nextpnr-xilinx Synthesis v3 (gated on Exp 816, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 816 (milestone .62) produced synthesis_clean_n32 on an iCE40 HX8K target
    using OSS-CAD-Suite nextpnr-ice40 (3952 LUTs for N=32 Ising). However, the physical KV260
    board uses Zynq UltraScale+ (xczu5eg) — not iCE40. OSS-CAD-Suite includes nextpnr-xilinx
    (still experimental), which can target some Xilinx parts. The primary goal is:
    1. Attempt nextpnr-xilinx for xczu5eg (may not have chipdb).
    2. Fallback: generate an actual iCE40 HX8K bitstream (.bin) from the Exp 816 JSON output
       using icepack, so we have a concrete hardware-programmable artifact even if Zynq synthesis
       fails.
    3. Smoke-test: verify the bitstream has a valid iCE40 header.

    EXISTING CODE TO READ FIRST:
    - results/experiment_816_kv260_synthesis_v2.json — N=32 synthesis JSON output path
    - hardware/kv260/ising_sampler_v3.v — target RTL Verilog
    - research-hardware-wishlist.md — KV260 Synthesis Status section
    - openspec/capabilities/verifiable-reasoning/spec.md — REQ-HW entries

    TASK: Attempt nextpnr-xilinx for xczu5eg; if unsupported, generate iCE40 bitstream with
    icepack from Exp 816 JSON; verify bitstream; write results/experiment_827_kv260_nextpnr_xilinx_v3.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Verify gate: read results/experiment_816_kv260_synthesis_v2.json — confirm lut_count_n32=3952
       and synthesis JSON path. If experiment 816 did not produce a synthesis JSON: write blocked.
    3. Add to openspec/capabilities/verifiable-reasoning/spec.md:
       - REQ-HW-038: If nextpnr-xilinx does not support the KV260 Zynq target, Carnot MUST fall
         back to generating a complete iCE40 HX8K bitstream (.bin) using icepack from the
         nextpnr-ice40 JSON produced in a prior synthesis run. The bitstream MUST contain a valid
         iCE40 magic header (first 4 bytes: 0xFF 0x00 0x00 0xFF).
       - SCENARIO-HW-035: nextpnr-xilinx --help lists xczu5eg in supported chips; synthesis clean.
         OR fallback: icepack produces .bin with valid magic header from Exp 816 JSON.
    4. Create scripts/experiment_827_kv260_nextpnr_xilinx_v3.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(827) + ExperimentTimeoutWatchdog(827, timeout_minutes=45).
       c. Set OSS_CAD_BIN = Path.home() / "tools" / "oss-cad-suite" / "bin".
          Verify OSS-CAD-Suite is installed (check for nextpnr-ice40 binary).
       d. Primary attempt — nextpnr-xilinx:
          result = subprocess.run([OSS_CAD_BIN / "nextpnr-xilinx", "--help"], capture_output=True)
          xilinx_available = (result.returncode == 0)
          If xilinx_available:
            Run: nextpnr-xilinx --chipdb xczu5eg --json <exp816_json> --pcf hardware/kv260/ising.pcf
                 --asc /tmp/ising_xilinx.asc
            xilinx_synthesis_result = subprocess.run([...], capture_output=True)
            xilinx_synthesis_clean = (xilinx_synthesis_result.returncode == 0)
       e. Fallback — iCE40 bitstream generation:
          exp816_json = results/experiment_816_kv260_synthesis_v2.json synthesis_json_path.
          If exp816_json exists:
            Run nextpnr-ice40 to produce ASC: nextpnr-ice40 --hx8k --json <exp816_json>
                                                              --asc /tmp/ising_n32.asc
            Run icepack to produce BIN: icepack /tmp/ising_n32.asc /tmp/ising_n32.bin
            bitstream_generated = Path("/tmp/ising_n32.bin").exists()
            If bitstream_generated:
              Read first 4 bytes of /tmp/ising_n32.bin.
              valid_header = (bytes[0] == 0xFF and bytes[1] == 0x00)
              Copy bitstream to hardware/kv260/ising_n32.bin.
       f. Artifact fields: xilinx_available, xilinx_synthesis_clean, ice40_bitstream_generated,
          valid_header, bitstream_size_bytes, bitstream_path, honest_verdict.
       g. honest_verdict:
          - "xilinx_synthesis_clean" if xilinx_available AND xilinx_synthesis_clean
          - "ice40_bitstream_generated" if bitstream_generated AND valid_header
          - "bitstream_invalid_header" if bitstream_generated but header wrong
          - "synthesis_blocked" if neither path produces output
    5. Write tests/python/test_experiment_827_kv260_nextpnr_xilinx_v3.py with 100% coverage:
       - test valid_header check with mocked file bytes (0xFF 0x00 = valid)
       - test fallback path triggers when nextpnr-xilinx not available (mocked subprocess)
       - test bitstream_path copied to hardware/kv260/ when generated
       Each test traces to REQ-HW-038 and SCENARIO-HW-035.
    6. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict.
       - ops/status.md: "Exp 827: KV260 synthesis: <verdict>. Bitstream: <path>."
