      actions-to-first-levelup WITH vs WITHOUT on held-out games/variants (the action-efficiency scoring lever
      min(human/agent,1)^2) + generic_transfer (baseline 0.04). Gate: STRICTLY fewer actions-to-first-levelup
      than blind BFS w/ CI + positive control + must NOT drop solve-rate. verifier_is_oracle: false.'
