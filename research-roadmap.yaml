      addressed_by: "Exp 1074 succeeded but used Qwen3.5-0.8B (CPU smoke-test tier) rather than the SOTA flagship required by CLAUDE.md. The result (alpha_t=0.78) cannot be cited in the position paper. This re-run uses Qwen3.6-35B-A3B-GGUF (confirmed in cache from Exp 1055). The DualGPU is confirmed live from Exp 1066. Scope differs: larger model, 100 questions (vs 50 in 1074), and writes to data/fr11_zenil_distill_v2.jsonl."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    FR-11 MANDATORY. Milestone .83 exp1074 measured alpha_t=0.78 but with Qwen3.5-0.8B
    (CPU smoke-test tier). CLAUDE.md explicitly prohibits CPU smoke-test models as headline results.
    The position paper §3 empirical section cannot cite exp1074's number.

    This experiment is IDENTICAL in design but uses the mandatory SOTA model:
      unsloth/Qwen3.6-35B-A3B-GGUF (Qwen 3.6 35B MoE, ~3B active, flagship)

    DualGPU is confirmed live (2x RTX 3090, CUDA 12 from exp1066).
    Qwen3.6-35B-A3B-GGUF confirmed in cache (downloaded by exp1055).

    EXISTING CODE TO READ FIRST:
    - results/experiment_1074_fr11_alpha_t_live_v3.json (the .83 result — understand what ran)
    - python/carnot/eval/phi_test.py (Phi measurement module)
    - python/carnot/models/sos_kan.py (SOSKANEnergyV3 — the AND-composed verifier)
    - scripts/experiment_template.py (setup_gpu(), cached_sota_pair())
    - data/fr11_zenil_distill_v2.jsonl (existing FR-11 training data — append to this file)

    TASK:
    1. SETUP GPU (CRITICAL — write blocked_no_live_gpu artifact immediately if GPU unavailable):
       CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu python
       tmpl = ExperimentTemplate(1077, 'FR-11 alpha_t SOTA v4',
           'results/experiment_1077_fr11_alpha_t_sota_v4.json', requires_gpu=True)
       MODEL_SPECS = [
           ("name": "Qwen3.6-35B-A3B", "hf_id": "unsloth/Qwen3.6-35B-A3B-GGUF", "gpu": 0)
       ]
       gpu_status = tmpl.setup_gpu(MODEL_SPECS)
       If NOT all_healthy: write blocked_no_live_gpu artifact.

    2. LOAD MODEL:
       from scripts.experiment_template import cached_sota_pair
       model_path = cached_sota_pair(prefer_moe=True)  # returns Qwen3.6-35B path
       Verify: "3.6-35B" in model_path or "Qwen3.6" in model_path
       If wrong model found: write model_tier_violation artifact and stop.

    3. GENERATE 100 LIVE QUESTIONS from GSM8K:
       Use Qwen3.6-35B-A3B-GGUF to generate chain-of-thought responses.
       Batch size 8. Hard timeout: 60 min total (batch_timeout_s = 8 * 60).
       inference_mode must be "live_gpu" in all responses.
       Record: question, response, is_correct (ground truth from GSM8K labels).
       Checkpoint every 25 questions to results/ckpt_exp1077.json.

    4. MEASURE alpha_t (fraction Carnot verifier differs from temperature-only):
       For each response:
       a. Temperature-only baseline: keep top 50% by response log-probability proxy
          (use response length as cheap proxy: shorter = more confident = top tier)
       b. Carnot AND-composed verifier (k=5, Phase-3 Round-9 recipe):
          - Tier 0c NUP Probe: bigram log-probability dot product from model logits
          - Tier 0a ThinkPRM: step-level energy score (import from python/carnot/verify/)
          - Tier 2 SC-Energy: run VeriCoTStepValidator on response steps
          - Tier 3 Ising: IsingEBM on extracted constraints
          - AND-compose: reject if ANY tier signals violation (energy > threshold)
       c. alpha_t = fraction where Carnot verdict != temperature-only verdict

    5. MEASURE Phi:
