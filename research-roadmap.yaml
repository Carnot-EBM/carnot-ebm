- id: exp1413-certificate-repair-execution-diagnosis
  milestone: 2026.04.109
  deliverable: results/experiment_1413_certificate_repair_execution_diagnosis.json
  title: "Certificate Repair Execution Diagnosis — Classify exp1397 REPAIR_HINT Cases"
  agent_type: codex
  model: gpt-5.5
  max_turns: 25
  estimated_wall_time_min: 20
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1397-fullscale-pipeline-v2-200cases
      verdict: not_headline_full_pipeline_below_0_40
      addressed_by: "exp1397 proved semantic validation and MCS localization are fixed, but full_pipeline_pass_rate=0.305 because REPAIR_HINT actions are not executed. This task reads exp1397 and classifies repair-hint cases before implementation."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Exp1397 achieved certificate_parse_rate=1.0 and semantic_validation_pass_rate=1.0,
    but full_pipeline_pass_rate=0.305. The root cause was missing repair
    execution: VERGE MCS emits REPAIR_HINT labels but no LLM call produces
    corrected certificates. Before implementing the executor, classify the
    repair-hint cases and define the executor contract. Use {project_root} as
    the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - results/experiment_1397_fullscale_pipeline_v2_200cases.json
    - results/experiment_1396_semantic_validation_pass_rate_fix_v1.json
    - python/carnot/verify/
    - python/carnot/pipeline/
    - openspec/capabilities/verification/spec.md
    - openspec/capabilities/pipeline/spec.md

    TASK:
    Diagnose the repair-hint rows from exp1397 and write a contract for the
    LLM repair executor that exp1414 can implement.

    REQUIRED ARTIFACT FIELDS:
    - status
    - total_cases_analyzed
    - repair_hint_cases_total
    - no_repair_cases_total
    - repair_execution_diagnosis_complete
    - hint_category_counts
    - executable_hint_pct
    - recommended_executor_contract
    - expected_full_pipeline_pass_rate_if_50pct_repaired
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1413_certificate_repair_execution_diagnosis.json immediately with status="in_progress".
    2. Read exp1397 and locate per-case rows or enough aggregate evidence to classify repair-hint cases.
    3. Categorize repair hints into FIELD_REWRITE, STEP_REWRITE, CONSTRAINT_REWRITE, CERTIFICATE_REGENERATE, and UNKNOWN.
    4. Estimate executable_hint_pct as the fraction that can be handled by a bounded local LLM rewrite prompt.
    5. Define recommended_executor_contract with inputs, outputs, validation call, timeout, and fallback behavior.
    6. Compute expected_full_pipeline_pass_rate_if_50pct_repaired as 0.305 + 0.5 * (1 - 0.305), unless exp1397 contains a better denominator.
    7. Write all required fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1413_certificate_repair_execution_diagnosis.json')); print(d.get('repair_execution_diagnosis_complete'), d.get('executable_hint_pct'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

