        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 2026.08.550 is terminal. Exp6395 issued four narrow Gemma model-family and constraint-family licenses while every Qwen cell abstained. Exp6396 through Exp6398 produced positive internal factor evidence. Exp6399 remained null for broad/public promotion because its claim boundary included the previously flagged Exp6385 artifact. Exp6401 produced positive internal ARC progress without a solve or route promotion. Exp6402 kept public ARC eligibility false by scope. Exp6403 reconciled partial factor capability, partial FR11, internal ARC route progress, unchanged hardware, and no public claim. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6391_v550_terminal_handoff_and_queue_preflight.json through {project_root}/results/experiment_6403_v550_adversarial_capstone.json
      - {project_root}/ops/conductor-log.md, {project_root}/ops/status.md, and {project_root}/ops/changelog.md
      - {project_root}/research-complete.yaml, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/known-issues.md
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/exclusion_manifest_lint.py

      TASK
      Create the exact V550-to-V551 evidence handoff and preflight the complete 12-task V551 queue. Preserve artifact verdicts, conductor outcomes, adversarial findings, and public-claim decisions as separate facts. Validate all memory and ARC gates before activation. Do not alter the active roadmap or the conductor.

      CONCRETE STEPS
      0. Hash the active roadmap, next roadmap, milestone document, conductor, exclusion manifest, known issues, solve registry, claims ledger, and all expected V550 terminal artifacts.
      1. Summarize Exp6391 through Exp6403 with scripts/summarize_artifact.py. Preserve clean, partial, null, blocked, skipped, absent, flagged, and retired states without filling gaps.
      2. Reconcile honest_verdict values with ops/conductor-log.md outcomes and adversarial results. Derive each duration from its task-linked terminal receipt.
      3. Record the exact factor boundary: four Exp6395 licenses, Qwen abstention, two rejected Gemma cells, positive Exp6396-Exp6398 internal results, Exp6399 public block, and no universal support.
      4. Record the exact ARC boundary: Exp6400 shadow readiness, Exp6401 positive causal progress, Exp6402 clean provenance audit with public ineligibility, no solve, and zero route promotion.
      5. Validate 12 unique V551 IDs and deliverables, order, structured gates, gate-field types, prior-failure subfields, no retired-ID reuse, and no retired dependency chain.
      6. Check every prompt for CONTEXT, EXISTING CODE TO READ FIRST, TASK, CONCRETE STEPS, {project_root}, {date}, a Run command, and the exact final prohibition line.
      7. Check every LLM task for MODEL_SPECS, cached_sota_pair(), at least one mandated GGUF ID, embedded tokenizers, no AutoTokenizer, real GPU receipts, and no legacy headline cell. Check every task for agent_type=codex and model=gpt-5.5.
      8. Add or update applicable REQ-* and SCENARIO-* entries before implementation. Write focused tests. Run schema, prior-failure, gate, exclusion, spec-coverage, adversarial, determination-preservation, and root-clutter checks.
      9. Write the artifact atomically. A repeated unresolved handoff mismatch retires this task scope.

      Required deliverable: {project_root}/results/experiment_6404_v551_terminal_handoff_and_queue_preflight.json.
      REQUIRED ARTIFACT FIELDS:
      status, v550_active_roadmap_path_and_hash, v550_task_ids, v550_terminal_artifacts_by_task, v550_artifact_verdicts, v550_conductor_outcomes, v550_adversarial_findings, v550_duration_receipts_by_task, v550_factor_boundary, v550_arc_boundary, v551_milestone_doc_and_queue_hashes, v551_task_ids, v551_id_and_deliverable_checks, v551_dependency_and_gate_checks, v551_gate_field_cross_reference_checks, v551_prior_failure_checks, v551_exclusion_manifest_checks, v551_agent_model_and_llm_policy_checks, prompt_contract_checks, active_roadmap_modified, conductor_modified, solve_registry_modified, claims_ledger_modified, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      field_principles must map every required field and gate to its purpose. field_provenance must classify every field as measured, derived, constant, or upstream. Set verifier_is_oracle=false. honest_verdict must begin with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6404_v551_terminal_handoff_and_queue_preflight --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

