- id: exp812-ising-constraint-injection
  milestone: 2026.04.62
  deliverable: results/experiment_812_ising_constraint_injection.json
  title: 'Exp 812: IsingEBM Constraint Feature Injection — EmbeddingConstraintStore to Coupling Matrix'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-CONSTRAINT-ZERO-DELTA: The .61 retro identified the root fix:
    "wiring the constraint feature vector into IsingEBM's spin coupling matrix is the single
    fix that simultaneously resolves RETRO-CONSTRAINT-ZERO-DELTA and RETRO-TIER1-PLATEAU."
    Currently, EmbeddingConstraintStore.retrieve() returns constraint vectors but these are
    never passed to IsingEBM.infer() — the pipeline stub ignores them. This experiment
    implements the wiring: retrieved constraint embeddings are projected to spin-space and
    added as soft bias terms on the coupling matrix J before Ising sampling.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/embedding_constraint_store.py — EmbeddingConstraintStore (Exp 800)
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.verify() (Exp 801 modified)
