          principle: "Each supported N records available candidates, contamination, selection, release, and charged omissions."
        proxy_contamination_rows:
          principle: "Syntax-only, incomplete-semantic, stale-state, and score-tail false feasibles remain distinct."
        exact_authority_rows:
          principle: "Checker identity, input, outcome, and release decision are explicit for every candidate."
        false_accept_curve:
          principle: "Proxy, selected, and released false-accept rates are reported against candidate budget."
        constraint_safety_audit_ready_score:
          principle: "This exact binary field records complete eligible row, budget, and attack replay."
        attack_rows:
          principle: "Grammar, semantics, obligation, state, family, source, reorder, authority, and amplification attacks fail closed at release."
        preconditions_checked:
          principle: "Gate, source, candidates, budgets, registry, attacks, and protected files are explicit."
        protected_files_unchanged:
          principle: "Both protected orchestration files retain original hashes."
        inference_substrate:
          principle: "The task declares immutable constrained candidate-bank replay with deterministic attacks and no LLM."
        verifier_is_oracle:
          principle: "The exact executor is release authority and defines unsafe false acceptance."
        field_provenance:
          principle: "Every field points to raw candidates, attack mutations, exact rows, hashes, and reducer functions."
        duration_s:
          principle: "Monotonic duration exposes truncated audit coverage."
        tests_run:
          principle: "Named audit, lint, gate, adversarial, and E2E commands include exits and durations."
        reproducibility_checksum:
          principle: "A final hash protects the independent audit."
