  - id: exp318-self-learning-relay
    milestone: "2026.04.29"
    deliverable: results/experiment_318_self_learning_relay.json
    title: "Exp 318: Continuous self-learning relay — Tiers 1+2+3 working in sequence"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: This milestone has individually tested Tier 1+2 (Exp 302), JEPA Tier 3 gate
      (Exp 309), and Z3-gated repair (Exp 312). This experiment runs ALL FOUR TIERS in sequence
      on a single 100-question benchmark to demonstrate the FULL continuous self-learning loop:

        Tier 1: Per-constraint precision tracker (online weight updates)
        Tier 2: CaseMemory → ConstraintGenerator (constraint addition from patterns)
        Tier 3: JEPA fast-path gate (predict violations, skip Ising if low energy)
        Z3 gate: NL2Z3Extractor → UNSAT triggers Ising; SAT skips

      The relay design: 3 batches of 33 questions each.
        Batch 1: Warmup — all tiers passive, collect data
        Batch 2: Tiers 1+2 active — constraint adaptation enabled
        Batch 3: Tiers 1+2+3+Z3 active — full relay

      Primary metric: batch3_accuracy - batch1_accuracy (honest signed delta).

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_302_self_learning_benchmark.py — Tier 1+2 benchmark (base this on)
      - python/carnot/pipeline/jepa_fast_path.py — JepaGate (Tier 3, from Exp 308)
      - python/carnot/pipeline/z3_gated_repair.py — Z3GatedRepair (from Exp 312)
      - python/carnot/pipeline/constraint_generator.py — ConstraintGenerator (Tier 2)
      - python/carnot/pipeline/confidence_verifier.py — ConfidenceVerifier (Tier 1)
      - results/experiment_309_tier3_pipeline.json — Tier 3 best threshold
      - scripts/experiment_template.py — ExperimentTemplate

      TASK: Run four-tier continuous self-learning relay benchmark.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-LEARN-013 (four-tier relay benchmark) and SCENARIO-LEARN-021/022.
      3. Write tests FIRST (100% coverage required) for:
         - RelayBatchResult: batch_id, accuracy, n_questions, tiers_active, constraint_delta
         - tiers_active list: ["tier1"] / ["tier1","tier2"] / ["tier1","tier2","tier3","z3"]
         - RelayArtifact: batch1, batch2, batch3, improvement_1to2, improvement_1to3
         - improvement computations: signed floats, never clamped
         - constraint_delta: n_constraints_after - n_constraints_before per batch
         - honest: any batch can have negative improvement; no fabrication
         - artifact schema: experiment=318, schema="carnot.self_learning_relay.v1"
      4. Implement scripts/experiment_318_self_learning_relay.py using ExperimentTemplate:
