milestone: "2026.08.585"
milestone_title: "Behavior-Aware Verification and Guarded Continual Reasoning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6715-bounded-exact-replay-audit
    milestone: "2026.08.585"
    deliverable: results/experiment_6715_bounded_exact_replay_audit.json
    title: "Bounded independent exact-replay audit"
    priority: critical
    track: evidence-infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 60
    model: opus
    prior_failures:
      - experiment_id: exp6703-exact-planning-fixture-audit
        verdict: "missing_terminal_artifact: hard_wall_clock_exceeded after three 4800-second attempts"
        addressed_by: "The monolithic audit is split. This shard has a frozen eight-instance sample, a fixed state-enumeration ceiling, no leakage scan, and direct Opus routing."
        retire_if_same_verdict: true
      - experiment_id: exp6690-exact-planning-fixture-audit
        verdict: "blocked_gate_check_failed"
        addressed_by: "Exp6702 now exists with planning_fixture_ready=true; this bounded root task reads that archived artifact directly instead of a missing same-milestone producer."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Milestone 2026.08.584 recovered the exact finite-horizon planning fixture in Exp6702. Its monolithic Exp6703 audit then hit the 4,800-second hard wall three times and emitted no terminal artifact. V585 uses behavior-aware verification: this task owns independent exact replay only. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V585 roadmap document
      - {project_root}/results/experiment_6702_exact_planning_fixture_recovery.json and its raw fixture stores, typed specs, seals, and source
      - Any partial Exp6703 work, but do not treat partial files or reported aggregates as evidence
      - Independent enumeration, artifact, row-consistency, adversarial-verification, and exact-planning helpers plus the relevant capability specs and {project_root}/ops/e2e-test-plan.md

      TASK:
      Cold-recompute a fixed stratified subset of Exp6702 with an independently implemented exhaustive solver. Audit transitions, legal actions, feasibility, optima, tie sets, state-action values, and action gaps. Do not run leakage, seal, metamorphic, or mutation scans in this shard.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify Exp6702 exists, planning_fixture_ready=true, raw stores and seals resolve, and CPU, RAM, disk, schema, roadmap, and conductor hashes are available. On failure, write a terminal blocked artifact with gate_check_summary.
      1. Add or update REQ-* and SCENARIO-* anchors before implementation. Write focused tests first.
      2. Before reading reported labels, freeze exactly eight headline instances: two per family, with one tie-bearing or infeasible edge case per family where available. Freeze selection hashes and reveal order.
      3. Set a preregistered maximum horizon, action count, state count, and total enumeration count. Abort honestly before the wall clock if a cap is exceeded. Do not widen the sample during execution.
      4. Implement the audit solver without importing Exp6702's dynamic-program solver or its reported optima. Enumerate transitions, legal plans, costs, optima, ties, values, and gaps from typed specs.
      5. Compare every recomputed field with the sealed report. Keep disagreements and missing values as rows. Do not coerce them to zero.
      6. Set exact_replay_audit_passed=true only when every expected row exists, every exact value matches, all focused and applicable E2E checks pass, and no method substitution or cap reduction occurred.
      7. Write the artifact atomically. Run focused tests, scoped coverage, spec coverage, row consistency, artifact validation, adversarial verification, and git status.

      Required deliverable: {project_root}/results/experiment_6715_bounded_exact_replay_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal audit state. Principle: deterministic process evidence.
        honest_verdict: reproduced, corrected, disqualified, or blocked conclusion. Principle: measured evidence only.
        verdict_class: one of positive|circular_positive|null|blocked|disqualified|partial. Principle: closed classification.
        gate_check_summary: failed precondition or audit check with expected and observed values. Principle: deterministic failure localization.
        openspec_requirement_ids: REQ-* and SCENARIO-* anchors. Principle: spec-first traceability.
        frozen_sample_manifest: eight instances, selection rule, reveal order, caps, versions, and hashes. Principle: preregistered audit identity.
        method_fidelity_contract: required solver independence, data, budgets, components, metrics, and forbidden substitutions. Principle: reference-anchored fidelity.
        enumeration_rows: instance, states, actions, plans, optimum, ties, action values, gaps, runtime, cap state, and receipt. Principle: independent authority evidence.
        reported_vs_recomputed_rows: unit, field, reported value, recomputed value, tolerance, and disposition. Principle: recheckable audit evidence.
        exact_replay_audit_passed: boolean owned by this task and reduced from raw rows. Principle: producer-owned gate contract.
        per_unit_rows: every instance, state-action, enumeration, comparison, cap, and check row. Principle: recheckable evidence.
        aggregate_row_recomputation: all counts and the gate rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: artifact, stores, tools, resources, schema, roadmap, conductor, and hashes. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: cpu_independent_exhaustive_audit_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: false for later selection; this task reads sealed labels only for audit. Principle: explicit authority boundary.
        field_provenance: source store, audit solver, comparator, reducer, function, version, and hash per field. Principle: traceable evidence.
        random_seed: sample and reveal-order seeds. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, coverage, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6715_bounded_exact_replay_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6716-bounded-seal-attack-audit
    milestone: "2026.08.585"
    deliverable: results/experiment_6716_bounded_seal_attack_audit.json
    title: "Bounded seal, leakage, and mutation audit"
    priority: critical
    track: evidence-infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 60
    model: opus
    prior_failures:
      - experiment_id: exp6703-exact-planning-fixture-audit
        verdict: "missing_terminal_artifact: hard_wall_clock_exceeded after three 4800-second attempts"
        addressed_by: "The monolithic audit is split. This shard excludes plan enumeration, fixes every attack count before execution, and routes directly to Opus."
        retire_if_same_verdict: true
      - experiment_id: exp6690-exact-planning-fixture-audit
        verdict: "blocked_gate_check_failed"
        addressed_by: "The archived Exp6702 fixture now exists and is ready; this root audit reads it directly and owns a distinct bounded attack receipt."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp6702 recovered a ready exact planning fixture. Exp6703 mixed exhaustive recomputation with leakage, seal, metamorphic, mutation, tests, and reporting, then timed out three times. This task owns only the bounded adversarial and seal checks. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V585 roadmap document, and FR-12 oracle-isolation rules
      - {project_root}/results/experiment_6702_exact_planning_fixture_recovery.json plus prompts, metadata, split manifests, label seals, metamorphic rows, and mutations
      - Any partial Exp6703 scanner and attack work without importing its conclusion
      - Leakage, canonicalization, seal-access, mutation, artifact, and row-consistency helpers plus relevant capability specs and {project_root}/ops/e2e-test-plan.md

      TASK:
      Cold-audit prompt and metadata leakage, family and split isolation, label-access timing, stale seals, metamorphic invariants, and mutation detection. Do not enumerate plan spaces or recompute optima in this shard.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify Exp6702 and all raw attack inputs, planning_fixture_ready=true, resources, schema, roadmap, and conductor hashes. Emit a blocked artifact with gate_check_summary on any real absence.
      1. Add REQ-* and SCENARIO-* anchors before implementation. Write focused tests first.
      2. Freeze prompt, metadata, ID, split, seal, metamorphic, and mutation attack sets before reading expected attack results. Fix the count and time budget for each family.
      3. Scan prompts and metadata for direct answers, objectives that encode labels, family or split collisions, ID shortcuts, duplicates, development-to-held contamination, and stale hashes.
      4. Test that current-event labels remain unreadable until a commit receipt exists. Test early access, replay, stale token, reordered event, and partial-write paths.
      5. Replay all preregistered metamorphic transformations and a bounded mutation panel. Preserve raw expected and observed results.
      6. Add copied-record, relation-poison, provenance-loss, and tombstone-reappearance probes as forward-compatible memory attacks. They must not change fixture truth or seal state.
      7. Set seal_attack_audit_passed=true only when every expected row exists, every leak is absent, every seal rule holds, every invariant holds, every mutation is detected, and all focused and applicable E2E checks pass.
      8. Write atomically. Run focused tests, scoped coverage, spec coverage, row consistency, artifact validation, adversarial verification, and git status.

      Required deliverable: {project_root}/results/experiment_6716_bounded_seal_attack_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal audit state. Principle: deterministic process evidence.
        honest_verdict: passed, corrected, disqualified, or blocked conclusion. Principle: measured evidence only.
        verdict_class: one of positive|circular_positive|null|blocked|disqualified|partial. Principle: closed classification.
        gate_check_summary: failed precondition or attack check with expected and observed values. Principle: deterministic failure localization.
        openspec_requirement_ids: REQ-* and SCENARIO-* anchors. Principle: spec-first traceability.
        frozen_attack_manifest: attack families, counts, budgets, inputs, versions, and hashes. Principle: preregistered audit identity.
        method_fidelity_contract: required scanners, attacks, budgets, metrics, and forbidden substitutions. Principle: reference-anchored fidelity.
        leakage_rows: prompt, metadata, ID, split, duplicate, and family checks with raw evidence. Principle: contamination evidence.
        seal_access_rows: event, access token, commit state, expected access, observed access, and disposition. Principle: oracle isolation evidence.
        metamorphic_rows: transform, expected invariant, observed result, and pass state. Principle: representation robustness.
        mutation_attack_rows: mutation or poison, expected detection, observed detection, and pass state. Principle: adversarial evidence.
        seal_attack_audit_passed: boolean owned by this task and reduced from raw rows. Principle: producer-owned gate contract.
        per_unit_rows: every leakage, seal, transform, mutation, poison, and check row. Principle: recheckable evidence.
        aggregate_row_recomputation: all counts and the gate rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: artifact, stores, tools, resources, schema, roadmap, conductor, and hashes. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: cpu_static_and_dynamic_attack_audit_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: false; this task audits label isolation and cannot select a plan. Principle: explicit authority boundary.
        field_provenance: prompt store, seal, scanner, attack runner, reducer, function, version, and hash per field. Principle: traceable evidence.
        random_seed: attack-order and mutation seeds. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, coverage, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6716_bounded_seal_attack_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6717-planning-audit-receipt-merge
    milestone: "2026.08.585"
    deliverable: results/experiment_6717_planning_audit_receipt_merge.json
    title: "Planning audit receipt merge"
    priority: critical
    track: evidence-infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 20
    estimated_wall_time_min: 20
    gated_on:
      - upstream: exp6715-bounded-exact-replay-audit
        artifact_field: exact_replay_audit_passed
        op: in
        value: [true]
      - upstream: exp6716-bounded-seal-attack-audit
        artifact_field: seal_attack_audit_passed
        op: in
        value: [true]
    prompt: |
      CONTEXT:
      Exp6715 and Exp6716 split the failed monolithic audit into bounded evidence owners. This task merges receipts only. It must not repeat expensive science. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V585 roadmap document
      - Exp6702, Exp6715, and Exp6716 terminal artifacts and canonical artifact-hash helpers
      - Gate evaluation, row consistency, artifact validation, and reporting capability specs

      TASK:
      Recompute the two shard gate fields from their raw rows, confirm both artifacts point to the same Exp6702 fixture identity, and emit one small merged audit receipt.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify both structured gates, terminal artifacts, raw rows, and hashes. Record any failed check in gate_check_summary.
      1. Add only missing REQ-* and SCENARIO-* anchors for receipt merging. Write a focused reducer test first if code changes.
      2. Recompute exact_replay_audit_passed and seal_attack_audit_passed independently from their rows. Do not trust top-level booleans alone.
      3. Confirm fixture hash, schema version, split hash, label-seal hash, and protected-file receipts match across Exp6702, Exp6715, and Exp6716.
      4. Do not run a solver, model, attack campaign, broad test suite, or mutation generator.
      5. Set planning_fixture_audit_passed=true only if both recomputed shard gates are true and every identity check matches.
      6. Write atomically. Run the focused reducer test, row consistency, artifact validation, adversarial verification, and git status.

      Required deliverable: {project_root}/results/experiment_6717_planning_audit_receipt_merge.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal merge state. Principle: deterministic process evidence.
        honest_verdict: merged pass, corrected, disqualified, or blocked conclusion. Principle: measured evidence only.
        verdict_class: one of positive|circular_positive|null|blocked|disqualified|partial. Principle: closed classification.
        gate_check_summary: failed upstream, recomputation, or identity check with expected and observed values. Principle: deterministic failure localization.
        openspec_requirement_ids: REQ-* and SCENARIO-* anchors. Principle: spec-first traceability.
        shard_receipt_rows: shard, artifact hash, recomputed gate, reported gate, row count, and disposition. Principle: recheckable merge evidence.
        fixture_identity_rows: source, fixture hash, split hash, seal hash, schema, and match state. Principle: immutable benchmark identity.
        planning_fixture_audit_passed: boolean owned by this task and reduced from shard and identity rows. Principle: producer-owned gate contract.
        per_unit_rows: every shard, identity, gate, and protected-file row. Principle: recheckable evidence.
        aggregate_row_recomputation: merged gate rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: gates, artifacts, rows, hashes, roadmap, and conductor. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: cpu_receipt_merge_no_solver_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: false; no current plan is evaluated or selected. Principle: explicit authority boundary.
        field_provenance: shard artifact, row reducer, identity comparator, function, version, and hash per field. Principle: traceable evidence.
        random_seed: null because the merge is deterministic. Principle: explicit reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6717_planning_audit_receipt_merge --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6718-sota-planning-proposal-bank
    milestone: "2026.08.585"
    deliverable: results/experiment_6718_sota_planning_proposal_bank.json
    title: "Three-family frozen planning proposal bank"
    priority: critical
    track: verifier-grounded-planning
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 300
    gated_on:
      - upstream: exp6717-planning-audit-receipt-merge
        artifact_field: planning_fixture_audit_passed
        op: in
        value: [true]
    prior_failures:
      - experiment_id: exp6704-sota-planning-proposal-bank
        verdict: "missing_terminal_artifact: preemptive skip after exp6703-exact-planning-fixture-audit retired"
        addressed_by: "The producer now gates on two bounded audits and a receipt-only merge; it no longer depends on the retired monolithic Exp6703 task."
        retire_if_same_verdict: true
      - experiment_id: exp6691-sota-planning-proposal-corpus
        verdict: "missing_terminal_artifact: preemptive skip after exp6688-v583-manifest-parity-contract retired"
        addressed_by: "Runtime parity is absent and the same-milestone producer field is declared with exact spelling."
        retire_if_same_verdict: true
      - experiment_id: exp5747-sota-exact-proposal-utility-panel
        verdict: "blocked_gate_check_failed"
        addressed_by: "A row-recomputed audit boolean and immutable Exp6702 labels replace the earlier missing benchmark readiness contract."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Carnot now has a recovered and independently audited finite-horizon fixture. It still lacks one authentic proposal bank for complete inference-system comparisons. Use all three required GGUF families and keep every failure row. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md SOTA Local Models section, {project_root}/scripts/experiment_template.py cached_sota_pair() example, and the V585 roadmap document
      - Exp6702 and Exp6715-Exp6717 artifacts plus Exp6647-Exp6649 model and proposal receipts
      - {project_root}/python/carnot/inference/sota_models.py, GGUF resolution, llama.cpp supervisor, owner-bound lease, GPU receipt, parser, checkpoint, and row-store helpers
      - Model-tier, inference, verification, evidence, statistics, safety, reporting, and pipeline specs plus {project_root}/ops/e2e-test-plan.md

      TASK:
      Create a frozen raw proposal bank for every headline planning instance with all three mandated local GGUF models. Record exact outcomes only after each raw response commits.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify planning_fixture_audit_passed=true; resolve models; validate GGUF magic, hashes, embedded tokenizers, CUDA, VRAM, RAM, disk, ports, owner-bound leases, roadmap, and conductor. Emit a blocked artifact on a real absence. Do not substitute a legacy model.
      1. Add REQ-* and SCENARIO-* anchors before implementation. Write focused tests first.
      2. Define MODEL_SPECS with exactly unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Use cached_sota_pair() and resolve_cached_gguf(). Legacy small models may run CPU smoke tests only.
      3. Freeze instances, prompts, system text, model order, seeds, generation settings, token ceiling, parser, one-call policy, missing policy, and exact-reveal timing.
      4. Launch owner-bound llama.cpp CUDA processes and capture full load, inference, unload, GPU, port, and lease receipts.
      5. Make exactly one planned call per model-instance-seed unit. Save raw bytes before parsing. Keep timeouts, empty, malformed, and partial rows. Never retry based on quality.
      6. Parse at most four action sequences from the original response. After commit, reveal sealed exact legality, validity, objective, regret, headroom, and action outcomes.
      7. Report model, family, and unit metrics with uncertainty. Set proposal_bank_ready=true only when every planned unit has a terminal row, raw bytes, process receipt, parser receipt, and post-commit exact receipt.
      8. Write atomically. Unload processes and release leases. Run focused tests, scoped coverage, spec coverage, row consistency, artifact validation, adversarial verification, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6718_sota_planning_proposal_bank.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal bank state. Principle: deterministic process evidence.
        honest_verdict: complete bank result or precise blocker. Principle: measured evidence only.
        verdict_class: one of positive|circular_positive|null|blocked|disqualified|partial. Principle: closed classification.
        gate_check_summary: failed upstream, model, lease, inference, parser, row, or test check with expected and observed values. Principle: deterministic failure localization.
        openspec_requirement_ids: REQ-* and SCENARIO-* anchors. Principle: spec-first traceability.
        model_specs: exact hub IDs, paths, hashes, quantization, tokenizers, GPUs, and roles. Principle: substrate identity.
        models_used: exact mandated hub IDs that completed authentic CUDA rows. Principle: measured model provenance.
        frozen_inference_manifest: instances, prompts, model order, seeds, settings, budgets, parser, policies, and hashes. Principle: preregistered protocol evidence.
        per_model_process_receipts: PID, start time, owner, port, model hash, tokenizer, CUDA UUID, VRAM, counts, unload, and release. Principle: authentic accelerator evidence.
        proposal_rows: model, instance, seed, raw hash, parse state, candidates, tokens, latency, failure, commit time, and reveal time. Principle: unit generation evidence.
        exact_outcome_rows: model, instance, candidate, legality, validity, objective, regret, headroom, and exact receipt. Principle: immutable outcome evidence.
        bank_replay_rows: raw response, parser version, reported parse, replayed parse, and match. Principle: deterministic transport evidence.
        proposal_bank_ready: boolean owned by this task and reduced from completeness rows. Principle: producer-owned gate contract.
        per_unit_rows: every model-instance-seed, candidate, process, and replay row. Principle: recheckable comparative evidence.
        aggregate_row_recomputation: all metrics and readiness rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: gate, models, cache, CUDA, leases, ports, resources, roadmap, conductor, and hashes. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: local_llamacpp_cuda_three_family_frozen_bank. Principle: measured substrate identity.
        verifier_is_oracle: false for generation; exact outcomes appear only after commit. Principle: explicit oracle-distinct boundary.
        field_provenance: transcript, parser, process receipt, exact evaluator, reducer, function, version, and hash per field. Principle: traceable evidence.
        random_seed: base and per-model-instance seeds. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, coverage, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6718_sota_planning_proposal_bank --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.
