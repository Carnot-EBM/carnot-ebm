  title: 'Exp 422: VPRM training via FOVER — Z3-annotated GSM8K step labels train IsingEBM as process reward model'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: New research direction derived from\
    \ two recent papers:\n\
