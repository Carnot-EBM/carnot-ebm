- id: exp1520-runtime-contract-e2e-harness
  milestone: 2026.04.117
  deliverable: results/experiment_1520_runtime_contract_e2e_harness.json
  title: "Runtime-Contract E2E Harness - Gated on Exp1519 Runtime Contract Ready"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 80
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  gated_on:
    - upstream: exp1519-116-completion-archive-117-activation
      artifact_field: prior_runtime_contract_ready
      op: "=="
      value: true
  prior_failures:
    - experiment_id: exp1518-milestone-116-retro
      verdict: runtime_contract_e2e_carry_forward_gate
      addressed_by: "This task changes scope from separate .116 contract artifacts to an integrated deterministic E2E harness with one false-accept ledger."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    .116 proved the individual pieces of a runtime contract: safe-DSL
    verifier induction, grammar certificate decoding, executable monitor
    events, and plan-graph structural contracts. .117 must combine them into
    one deterministic acceptance surface before more repair experiments can
    make credible claims. Use {project_root} as the project root and {date} as
    the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - results/experiment_1507_autopyverifier_safe_dsl_induction_pack.json
    - results/safe_dsl_verifier_induction_1507.jsonl
    - results/experiment_1508_trigger_grammar_certificate_decoder_audit.json
    - results/trigger_grammar_certificate_decoder_1508.jsonl
    - results/experiment_1509_executable_monitor_runtime_adapter.json
    - results/executable_monitor_runtime_events_1509.jsonl
    - results/experiment_1510_plan_graph_structural_contract_gate.json
    - results/plan_graph_structural_contracts_1510.jsonl
    - results/experiment_1511_product_line_solver_oracle_benchmark.json
    - python/carnot/verify/
    - tests/python/

    TASK:
    Build a runtime-contract E2E harness that loads the .116 verifier,
    certificate, monitor, and structural-contract artifacts into one manifest
    and computes one deterministic false-accept ledger.

    REQUIRED ARTIFACT FIELDS:
    - status
    - runtime_contract_e2e_ready
    - source_artifacts_loaded
    - contract_cases_total
    - safe_dsl_cases_linked
    - grammar_certificate_cases_linked
    - monitor_events_linked
    - structural_contract_cases_linked
    - false_accept_count
    - false_accept_rate
    - false_reject_count
    - runtime_contract_manifest_path
    - focused_tests_passed
    - blockers
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1520_runtime_contract_e2e_harness.json immediately with status="in_progress".
    2. Load the .116 JSON and JSONL artifacts listed above. If any required artifact is missing, write a terminal blocker with exact missing paths.
    3. Define a normalized contract-case record with fields for prompt/case id, proposed output, certificate parse result, safe-DSL verifier result, monitor event result, structural-contract result, expected label when available, and final deterministic accept/reject.
    4. Write results/runtime_contract_e2e_manifest_1520.jsonl with one row per normalized case and a final summary row.
    5. Compute false accepts and false rejects only against rows with explicit expected labels. Do not infer success from LLM text.
    6. Add or update focused tests for the normalizer and false-accept ledger. Keep edits scoped to helpers needed by this harness.
    7. Set runtime_contract_e2e_ready=true only if all mandatory source artifacts load, at least one row from each .116 contract family is linked, and false_accept_rate is reported as 0.0.
    8. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.
    9. Write all required artifact fields with status="complete" or an honest terminal blocker.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1520_runtime_contract_e2e_harness.json')); print(d.get('runtime_contract_e2e_ready'), d.get('contract_cases_total'), d.get('false_accept_rate'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1521-live-sota-contract-guided-repair-v1
  milestone: 2026.04.117
  deliverable: results/experiment_1521_live_sota_contract_guided_repair_v1.json
  title: "Live SOTA Contract-Guided Repair v1 - Gated on Exp1520 E2E Harness"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 120
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  gated_on:
    - upstream: exp1520-runtime-contract-e2e-harness
      artifact_field: runtime_contract_e2e_ready
      op: "=="
      value: true
  prior_failures:
    - experiment_id: exp1508-trigger-grammar-certificate-decoder-audit
      verdict: grammar_certificate_decoder_ready_separate_surface
      addressed_by: "This task uses the grammar certificate path inside a full E2E contract-guided repair loop and adds a draft-conditioned constrained-decoding ablation."
      retire_if_same_verdict: false
    - experiment_id: exp1496-hover-safe-prefix-continuation
      verdict: safe_prefix_continuation_ready_not_full_contract_repair
      addressed_by: "This task evaluates contract-guided repair against the integrated .117 runtime-contract harness rather than only safe-prefix continuation."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Draft-Conditioned Constrained Decoding suggests separating semantic
    planning from structural enforcement. Carnot now has a deterministic
    runtime-contract E2E harness, so the repair question is whether mandated
    local SOTA GGUFs can use contract feedback to improve acceptance without
    increasing false accepts. Use {project_root} as the project root and
    {date} as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE; primary contract-guided repair model)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense; secondary contract-guided repair model)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE; secondary contract-guided repair model)
    Legacy small models are allowed only as CPU smoke-tests and must not be
    used for headline repair results.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - research-references.md
    - results/experiment_1520_runtime_contract_e2e_harness.json
    - results/runtime_contract_e2e_manifest_1520.jsonl
    - python/carnot/inference/
    - python/carnot/verify/
    - tests/python/

    TASK:
    Run a live local SOTA contract-guided repair experiment over the E2E
    harness, comparing baseline generation, grammar-only repair, and
    draft-conditioned contract-guided repair.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - live_sota_model_inference_used
    - contract_guided_repair_ready
    - e2e_cases_loaded
    - repair_cases_attempted
    - baseline_accept_rate
    - grammar_only_accept_rate
    - draft_conditioned_accept_rate
    - repair_accept_rate_delta
    - false_accept_count
    - false_accept_rate
    - models_used
    - gpu_probe
    - repair_manifest_path
    - blockers
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1521_live_sota_contract_guided_repair_v1.json immediately with status="in_progress".
    2. Load the E2E manifest from exp1520 and select a bounded subset of contract-failing or contract-marginal cases that have deterministic labels.
    3. Use cached_sota_pair() or the established local SOTA GGUF cache pattern from scripts/experiment_template.py. If no mandated SOTA GGUF can run, write a terminal blocker and do not fall back to legacy small headline models.
    4. For each case, run baseline generation, grammar-only constrained certificate/repair, and draft-conditioned repair where a free draft is followed by structured contract output.
    5. Validate every output through the exp1520 runtime-contract harness. LLM text is never final authority.
    6. Write results/live_contract_guided_repair_1521.jsonl with one row per case, model, mode, raw output path or excerpt hash, deterministic validator outcomes, and repair outcome.
    7. Set contract_guided_repair_ready=true only if at least one mandated SOTA GGUF ran, repair metrics are reported, and false_accept_rate remains 0.0.
    8. Add focused tests for any new repair-mode adapter or manifest reader.
    9. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.
    10. Write all required artifact fields with status="complete" or an honest terminal blocker.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1521_live_sota_contract_guided_repair_v1.json')); print(d.get('contract_guided_repair_ready'), d.get('live_sota_model_inference_used'), d.get('repair_accept_rate_delta'), d.get('false_accept_rate'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1522-constraint-dependency-graph-root-cause-repair
  milestone: 2026.04.117
  deliverable: results/experiment_1522_constraint_dependency_graph_root_cause_repair.json
  title: "Constraint Dependency Graph Root-Cause Repair - Gated on Exp1520 E2E Harness"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 100
  priority: high
  requires_gpu: true
  skip_pre_test: true
  gated_on:
    - upstream: exp1520-runtime-contract-e2e-harness
      artifact_field: runtime_contract_e2e_ready
      op: "=="
      value: true
  prior_failures:
    - experiment_id: exp1510-plan-graph-structural-contract-gate
      verdict: structural_contract_gate_ready_without_cross_contract_cdg
      addressed_by: "This task generalizes plan-graph contract evidence into a cross-contract dependency graph that ranks upstream root causes before repair."
      retire_if_same_verdict: false
    - experiment_id: exp1490-kona-ebt-partial-trace-localization-audit
      verdict: partial_trace_localization_no_repair_claim
      addressed_by: "This task keeps deterministic localization but adds a bounded CDG repair/localization comparison against flat validator ordering."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    AeroTherm-GPT reports that Constraint Dependency Graph guided repair can
    fix upstream causes instead of chasing downstream violations. Carnot's
    .116 artifacts now expose multiple contract categories, so .117 can test a
    local CDG without importing any external trust boundary. Use {project_root}
    as the project root and {date} as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE; primary repair proposal model if LLM repair is used)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense; secondary repair proposal model if LLM repair is used)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE; secondary repair proposal model if LLM repair is used)
    Legacy small models are allowed only as CPU smoke-tests and must not be
    used for headline CDG repair results.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - results/experiment_1520_runtime_contract_e2e_harness.json
    - results/runtime_contract_e2e_manifest_1520.jsonl
    - results/experiment_1521_live_sota_contract_guided_repair_v1.json
    - python/carnot/verify/
    - tests/python/

    TASK:
    Build a Constraint Dependency Graph over runtime-contract failure
    categories and compare CDG-guided root-cause localization/repair ordering
    against flat validator ordering.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - live_sota_model_inference_used
    - cdg_root_cause_repair_ready
    - e2e_cases_loaded
    - cdg_nodes
    - cdg_edges
    - root_cause_cases_attempted
    - flat_order_fix_efficiency
    - cdg_fix_efficiency
    - cdg_efficiency_delta
    - false_accept_count
    - false_accept_rate
    - cdg_manifest_path
    - models_used
    - blockers
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1522_constraint_dependency_graph_root_cause_repair.json immediately with status="in_progress".
    2. Load exp1520 E2E contract rows and exp1521 repair rows if present. Continue with exp1520 alone if exp1521 did not run, and record that scope.
    3. Define CDG nodes for contract categories such as parse, certificate, safe-DSL verifier, monitor event, structural dependency, solver oracle, and final accept.
    4. Estimate directed dependencies from observed co-failures and lifecycle ordering. Keep the CDG deterministic and auditable.
    5. For each failing case, compare flat validator-order repair/localization with CDG-prioritized upstream repair/localization. If LLM repair proposals are used, use at least one mandated SOTA GGUF and record exact models_used.
    6. Validate every repaired output through deterministic contracts. Do not accept LLM self-evaluation.
    7. Write results/cdg_root_cause_repair_1522.jsonl with one row per case and a graph summary row.
    8. Set cdg_root_cause_repair_ready=true if CDG metrics are computed and false_accept_rate remains 0.0, even if the delta is negative.
    9. Add focused tests for CDG construction and root-cause ordering.
    10. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.
    11. Write all required artifact fields with status="complete" or an honest terminal blocker.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1522_constraint_dependency_graph_root_cause_repair.json')); print(d.get('cdg_root_cause_repair_ready'), d.get('cdg_nodes'), d.get('cdg_efficiency_delta'), d.get('false_accept_rate'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

