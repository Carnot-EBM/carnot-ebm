        pooled_effect_summary:
          principle: "Pooling uses only byte-identical shared held units and preserves heterogeneity."
        safety_and_cost_summary:
          principle: "Unsafe release, tokens, latency, mask cost, transition cost, and failures are charged by arm."
        acceptance_gate_rows:
          principle: "Every scientific gate records expected, observed, and passed values."
        two_level_decoder_comparison_ready_score:
