      2. Hash Exp6121, Exp3866, hardware docs, tool identities, and any dated operator physical receipt before considering a command.
      3. If physical_state_changed is false, run no openFPGALoader, JTAG, detect, synthesis, place/route, pack, flash, firmware, SSH, timing, current, or power command. Set every command/mutation count to bare 0.
      4. If and only if a newer receipt materially changes state, permit at most one `openFPGALoader -c dirtyJtag --detect`; capture exact raw receipts and run no mutating command.
