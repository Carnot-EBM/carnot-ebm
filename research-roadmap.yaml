- id: exp1381-dvi-discriminative-verifier-training-v1
  milestone: 2026.04.107
  deliverable: results/experiment_1381_dvi_discriminative_verifier_training_v1.json
  title: "DVI Discriminative Verifier Training v1 — First Actual DVI Run"
  agent_type: codex
  model: gpt-5.5
  max_turns: 55
  estimated_wall_time_min: 60
  priority: critical
  requires_gpu: true
  prior_failures:
    - experiment_id: exp1374-continuous-self-learning-v3-verifier-selected-or-csp-fallback
      verdict: continuous_self_learning_v3_primary_semantic_verified_dvi_ready_headline_allowed
      addressed_by: "exp1374 set dvi_ready=True and fresh_verified_sample_count=4, but DVI training itself did not run. This task executes the actual discriminative verifier update using those 4 fresh verified cases plus replay data."
      retire_if_same_verdict: false
    - experiment_id: exp1358-continuous-self-learning-verifier-selected-memory
      verdict: verifier_selected_memory_replay_only_dvi_ready_non_headline
      addressed_by: "exp1358 and exp1374 both flagged dvi_ready=True across 3+ milestones but DVI training was deferred. Fresh verified samples now exist (exp1374). This experiment executes the deferred DVI training step."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    dvi_ready=True has appeared in exp1374 (.106), exp1358 (.105), and exp1344
    (.104) — three consecutive milestones. exp1374 delivered fresh_verified_sample_count=4
    via the primary semantic verified path. DVI (Discriminative Verifier
    Improvement) requires: (1) a current verifier checkpoint, (2) fresh
    semantically-verified positive examples, (3) a discriminative training step
    that improves the verifier's discrimination boundary. This is the FIRST actual
    DVI training run — previous milestones set dvi_ready but never executed the
    training. Use {project_root} as the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-program.md
    - scripts/experiment_template.py
    - python/carnot/
    - results/experiment_1374_continuous_self_learning_v3_verifier_selected_or_csp_fallback.json
    - results/experiment_1369_semantic_validator_v2_nsvif_z3_constraints.json
    - results/experiment_1370_verge_mcs_repair_localization_v2.json
    - openspec/capabilities/verification/spec.md
    - research-references.md

    TASK:
    Run the DVI training loop using semantically-verified positive cases from
    exp1374 and contrastive negative cases from the FoVer corpus. Produce a
    checkpoint and measure AUROC delta vs the pre-DVI baseline. Report results
    as a discriminative improvement signal for the self-learning pipeline.

    Every headline LLM generation MUST use MODEL_SPECS from
    cached_sota_pair(gpu_indices=(0, 1)) if generating new inference. For
    DVI training itself, the model being trained is Carnot's verifier (not
    the LLM), but any fresh inference needed to augment the training set
    must use mandated SOTA GGUFs:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF

    REQUIRED ARTIFACT FIELDS:
    - status
    - positive_cases_used
    - negative_cases_used
    - training_method
    - dvi_baseline_auroc
    - dvi_trained_auroc
    - dvi_auroc_delta
    - dvi_checkpoint_path
    - dvi_deployed
    - discriminative_improvement_measured
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1381_dvi_discriminative_verifier_training_v1.json immediately with status="in_progress".
    2. Load the 4 fresh semantically-verified positive cases from exp1374 (path_used=primary_semantic_verified, promoted_memory_count=4).
    3. Load contrastive negative cases from the FoVer corpus (labeled incorrect reasoning steps). Target ratio: at least 1:3 positive:negative.
    4. Identify the current verifier checkpoint to fine-tune. Prefer GS-KAN or SC-Energy tier checkpoint in python/carnot/models/.
    5. Apply SECL-style discriminative training (arXiv:2604.09624): train the verifier to classify positive (semantically verified) vs negative (FoVer incorrect) cases using a binary cross-entropy or contrastive hinge loss.
    6. Measure dvi_baseline_auroc on a held-out FoVer split before training.
    7. Run the discriminative training loop for at least 10 epochs or until convergence.
    8. Measure dvi_trained_auroc on the same held-out split after training.
    9. Compute dvi_auroc_delta = dvi_trained_auroc - dvi_baseline_auroc.
    10. Save the checkpoint to python/carnot/models/dvi_checkpoint_v1.pt. Record dvi_checkpoint_path.
    11. Set dvi_deployed=true if checkpoint was saved successfully.
    12. Set discriminative_improvement_measured=true if dvi_auroc_delta is not None (positive or negative, just measured).
    13. Write all required fields, status="complete", honest_verdict.

