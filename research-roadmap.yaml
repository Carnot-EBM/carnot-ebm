- id: exp6797-canonical-transaction-byte-replay
  title: Canonical transaction-byte replay fixture
  track: continuous-self-learning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.08.593
  deliverable: results/experiment_6797_canonical_transaction_byte_replay.json
  prompt: |
    CONTEXT:
    Exp6791 completed a deterministic four-arm, five-order prospective constraint-routing
    comparison with 4,800 rows and 3,189 committed transactions. Exp6792 found that every commit had
    a hash but none stored canonical parent or new state bytes. Hashes cannot be inverted or cold
    replayed. Re-execute the frozen comparison with the same policy and capture bytes at commit time.
    Do not edit Exp6791 or Exp6792 and do not change the scientific mechanism.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md, Continuous Self-Learning
    - {project_root}/_bmad/prd.md, FR11
    - {project_root}/results/experiment_6790_chronological_constraint_routing_stream.json
    - {project_root}/results/experiment_6791_compositional_online_constraint_routing_ab.json
    - {project_root}/results/experiment_6792_csl_causal_safety_cold_audit.json
    - {project_root}/python/carnot/experiment_6791_compositional_online_constraint_routing_ab.py
    - {project_root}/python/carnot/memory/transactional_constraint_memory.py
    - {project_root}/openspec/capabilities/continuous-learning/spec.md, REQ-CL-6791 and REQ-CL-6792
    - {project_root}/scripts/verdict_row_consistency_lint.py

    TASK:
    Produce a snapshot-complete deterministic replay of Exp6791. Store canonical parent and new
    state bytes for every commit, verify the hashes immediately, and preserve every prior action and
    outcome. Use a new artifact and checkpoint. Do not backfill bytes from hashes, alter historical
    artifacts, fit a new learner, or use an LLM.

    CONCRETE STEPS:
    0. PRECONDITIONS: verify Exp6790 and Exp6791 hashes, 4,800 unique cells, five frozen order hashes,
       four arm definitions, 3,189 source commits, the canonical serializer, and sufficient disk/RAM.
       On failure write complete_blocked_transaction_byte_replay with the failed check and observed
       value in gate_check_summary, then stop. No reduced replay is allowed.
    1. Add or refine the REQ-* contract so every committed transaction carries canonical parent
       bytes, new bytes, their hashes, arm/order/event identity, and a chain predecessor. Write tests
       first for deterministic encoding, round-trip, and hash verification.
    2. Re-run the exact Exp6791 arms, seeds, five orders, thresholds, capacity, opportunity stream,
       update cadence, action policy, and controls. Active events remain read-only. Commit only after
       the current exact receipt.
    3. For every commit, capture canonical parent_state_bytes and new_state_bytes at the transaction
       boundary. Encode them reversibly, recompute both hashes, and retain a byte-chain receipt. Never
       infer or fabricate bytes from a digest.
    4. Use the Exp6785 parent-owned atomic checkpoint contract. Inject interruption after a fixed
       prefix, resume in a fresh process, skip complete cells exactly once, and refuse a changed
       manifest. Preserve isolated stores per arm and order.
    5. Compare all 4,800 replay rows with Exp6791 by paired key. Require identical route actions,
       rewards, utilities, writes, reads, and transaction decisions. Recompute 1,063 online writes,
       3,132 online later reads, 721 online action changes, and all order summaries from rows. These
       are reproduction checks, not new source claims.
    6. Attack byte flips, receipt reorder, stale parent, valid bytes under the wrong arm, duplicate
       commit, cross-arm store access, interrupted write, and manifest mismatch. Every attack must
       fail closed without changing committed bytes.
    7. Run focused tests, ruff, spec coverage, artifact convention audit, adversarial verification,
       and verdict-row consistency lint.
    8. REQUIRED ARTIFACT FIELDS: field_principles; inference_substrate (deterministic CPU
       transactional replay, no LLM); duration_s; random_seed; reproducibility_checksum;
       source_artifact_hashes; frozen_manifest; arm_definitions; order_hashes; checkpoint_receipts;
       transaction_schema; transaction_receipts (each committed receipt carries canonical parent and
       new bytes plus verified hashes); committed_transaction_count; parent_byte_snapshot_count;
       new_state_byte_snapshot_count; byte_hash_match_count; replay_identity_checks; attack_results;
       rows (all 4,800 per-event arm/order rows); transaction_byte_snapshot_fixture_ready (true only
       when all counts and identity checks pass); gate_check_summary; verifier_is_oracle (false);
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial); and
       honest_verdict (terminal prefix required).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6797_canonical_transaction_byte_replay.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6792-csl-causal-safety-cold-audit
      verdict: "complete_blocked_csl_causal_audit: transaction_byte_snapshots expected {'committed_receipts': 3189, 'parent_byte_snapshots': 3189, 'new_state_byte_snapshots': 3189, 'byte_hash_matches': 3189}, observed {'committed_receipts': 3189, 'parent_byte_snapshots': 0, 'new_state_byte_snapshots': 0, 'byte_hash_matches': 0}"
      addressed_by: 'This producer re-executes the frozen comparison and captures canonical parent/new bytes at commit time; it does not ask the cold audit to reconstruct missing preimages.'
      retire_if_same_verdict: true

- id: exp6798-csl-causal-safety-byte-audit
  title: Independent byte-grounded CSL causal and safety audit
  track: continuous-self-learning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.08.593
  deliverable: results/experiment_6798_csl_causal_safety_byte_audit.json
  gated_on:
    - upstream: exp6797-canonical-transaction-byte-replay
      artifact_field: transaction_byte_snapshot_fixture_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6797 supplies the exact missing contract from the blocked Exp6792 audit: canonical parent and
    new bytes for every committed transaction. The source comparison was positive, but FR11 credit
    still requires an independent process to reproduce actions and utilities from bytes and to
    survive causal, poison, capacity, restart, and rollback attacks. Completion is independent of
    effect sign.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md, Continuous Self-Learning
    - {project_root}/results/experiment_6790_chronological_constraint_routing_stream.json
    - {project_root}/results/experiment_6791_compositional_online_constraint_routing_ab.json
    - {project_root}/results/experiment_6792_csl_causal_safety_cold_audit.json
    - {project_root}/results/experiment_6797_canonical_transaction_byte_replay.json
    - {project_root}/openspec/capabilities/continuous-learning/spec.md, REQ-CL-6792
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/scripts/verdict_row_consistency_lint.py

    TASK:
    Cold-audit the snapshot-complete CSL replay without importing its producer. Recompute all source
    headlines from rows and canonical bytes. Credit learning only where a stored update causes a
    later changed action and utility witness. Attack future leakage, poison, capacity, restart, and
    rollback. The exact event receipt remains evaluation authority, not a proposal-time feature.

    CONCRETE STEPS:
    0. PRECONDITIONS: require transaction_byte_snapshot_fixture_ready=true, the exact upstream field
       and artifact hash, 4,800 unique rows, five order hashes, 3,189 commits, 3,189 parent snapshots,
       3,189 new snapshots, and 3,189 matching byte hashes. On failure write a complete_blocked_*
       artifact with gate_check_summary and stop. Do not import Exp6797 code or shrink the audit.
    1. Add a new REQ-* audit anchor or extend REQ-CL-6792 for byte-grounded replay. Write independent
       serializer/hash/replay tests before the audit implementation.
    2. In a fresh module, decode every transaction, verify parent/new hashes, reconstruct each chain,
       replay every action, and recompute writes, later reads, action changes, held-future effects,
       retention, hard-case harm, support, and confidence intervals from rows.
    3. For every credited factor, replay from its parent bytes with the update removed and with its
       retrieval disabled. Require a later changed route and exact utility witness. Report uncredited
       writes separately.
    4. Inject future receipts, poisoned factors, stale parents, wrong-arm valid bytes, capacity
       pressure, eviction reorder, byte corruption, and duplicate commits. No poisoned or invalid
       factor may enter or influence active state.
    5. Restart from every preregistered transaction boundary and compare bytes and next actions.
       Trigger rollback on retention or hard-case harm and require exact restoration of the declared
       parent bytes and actions.
    6. Classify positive only if every causal and safety gate passes. Use null for a complete
       no-effect replay, blocked for missing contracts, and disqualified for leakage, corruption, or
       source contradiction.
    7. Run focused tests, ruff, spec coverage, adversarial verification, artifact convention audit,
       and verdict-row consistency lint.
    8. REQUIRED ARTIFACT FIELDS: field_principles; inference_substrate (independent deterministic
       CPU byte replay, no LLM); duration_s; random_seed; reproducibility_checksum;
       source_artifact_hashes; transaction_byte_counts; chain_replay_receipts;
       cold_recomputed_metrics; headline_differences; factors_with_changed_action_witness;
       credited_factor_count; retrieval_disable_effects; poison_attack_results;
       admitted_poison_count; influenced_poison_count; capacity_eviction_receipts;
       restart_byte_identity; restart_action_identity; rollback_byte_identity;
       rollback_action_identity; retention_after_phase; hard_case_harm_after_phase; rows (one per
       audited unit and attack); source_verdict_supported; csl_causal_audit_completed (exact field,
       true when the full audit completes even if effect is null); gate_check_summary;
       verifier_is_oracle (false); verdict_class (closed enum); and honest_verdict (terminal prefix).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6798_csl_causal_safety_byte_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6792-csl-causal-safety-cold-audit
      verdict: "complete_blocked_csl_causal_audit: transaction_byte_snapshots expected {'committed_receipts': 3189, 'parent_byte_snapshots': 3189, 'new_state_byte_snapshots': 3189, 'byte_hash_matches': 3189}, observed {'committed_receipts': 3189, 'parent_byte_snapshots': 0, 'new_state_byte_snapshots': 0, 'byte_hash_matches': 0}"
      addressed_by: 'Exp6797 is a new in-milestone producer whose required field and artifact contain every canonical parent/new byte preimage consumed by this independent audit.'
      retire_if_same_verdict: true

- id: exp6799-model-output-formal-constraint-probes
  title: Formally calibrated model-output constraint probes
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 210
  per_unit_rows: true
  milestone: 2026.08.593
  deliverable: results/experiment_6799_model_output_formal_constraint_probes.json
  prompt: |
    CONTEXT:
    Exp6788 and Exp6789 proved a grouped fixed-point effect only on synthetic implication graphs.
    Exp6745 already contains authentic frozen outputs from the mandated Qwen3.6-35B-A3B,
    Gemma-4-31B, and Gemma-4-26B-A4B GGUF families. X-RAY (arXiv:2603.05290) shows that formal
    probes should distinguish constraint refinement from solution-space restructuring. Build that
    exact fixture without running a new LLM. Preserve model provenance as a stratum, never a feature.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V593 Planner Refresh
    - {project_root}/results/experiment_6745_sota_dual_encoding_proposal_corpus.json
    - {project_root}/results/experiment_6768_targetable_proof_panel_expansion.json
    - {project_root}/results/experiment_6786_constraint_dependency_hard_negative_fixture.json
    - {project_root}/results/experiment_6789_soft_fixed_point_cold_authority_audit.json
    - {project_root}/python/carnot/verify/constraint.py
    - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
    - Primary sources arXiv:2603.05290, arXiv:2608.08786, and arXiv:2608.22652

    TASK:
    Convert frozen authentic model outputs into exact-enumerable paired constraint probes. For each
    eligible source case, create a refinement variant and a genuine solution-space restructuring
    variant. Match nuisance properties, preserve dual-encoding diagnostics, and freeze disjoint
    development and held-case splits. Do not invoke an LLM, replace source outputs, or use source
    model identity in proposal features.

    CONCRETE STEPS:
    0. PRECONDITIONS: verify source artifact hashes, authentic local-GGUF provenance, exact model IDs,
       complete source rows, dual encodings, parseability, exact-check availability, and at least 96
       eligible paired source cases spanning all required model/family strata. On failure write
       complete_blocked_model_output_probe_fixture with gate_check_summary and stop. No synthetic-only
       or reduced-model substitute is allowed.
    1. Add REQ-* coverage for a formally calibrated real-output probe fixture. Write generator,
       exact-enumeration, split-isolation, and mutation tests first.
    2. Preserve source case ID, exact output bytes/hash, source artifact hash, family, model hub ID,
       original dual encodings, and translation/reasoning diagnostic. Set live_llm_invoked=false.
    3. For refinement, add a valid constraint that shrinks the existing solution set without changing
       its structural representation. For restructuring, change dependency topology or the solution
       manifold rather than merely adding a constraint. Prove the two operation classes are distinct.
    4. Pair and match variable count, solution-count band, exact-check work, serialized length, and
       difficulty as closely as the preregistered tolerances allow. Keep one base/refinement/
       restructuring group under one split and one case-cluster key.
    5. Enumerate the exact valid set and create local-pass/cross-dependency-fail adversarial rows.
       Run dual parsers where available. Translation disagreement cannot be labeled model reasoning
       error.
    6. Freeze development and held-case splits by case, with all source models and required families
       represented. Run fresh-process exact replay and hash every graph and valid set.
    7. Attack solution-preserving renames, source-model label shuffles, parser disagreement, duplicate
       cases, accidental refinement labeled restructuring, and exact-label leakage.
    8. Run focused tests, ruff, spec coverage, adversarial verification, artifact convention audit,
       and verdict-row consistency lint.
    9. REQUIRED ARTIFACT FIELDS: field_principles; inference_substrate (CPU transform of frozen
       authentic mandated-GGUF outputs, no new LLM); duration_s; random_seed;
       reproducibility_checksum; source_artifact_hashes; source_model_specs (must list
       unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and
       unsloth/gemma-4-26B-A4B-it-GGUF as frozen provenance); live_llm_invoked (false);
       transformation_contract; feature_allowlist; feature_denylist; split_manifest; matching_receipts;
       dual_encoding_diagnostics; exact_replay_receipts; graph_hashes; rows (one per source,
       transformation, and adversarial condition); model_output_constraint_probe_ready (exact field);
       gate_check_summary; verifier_is_oracle (false); verdict_class (closed enum); and honest_verdict
       (terminal prefix).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6799_model_output_formal_constraint_probes.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp6800-real-output-fixed-point-transfer-ab
  title: Frozen grouped fixed point versus flat control on real outputs
  track: phase3-bridge
  priority: critical
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 300
  per_unit_rows: true
  milestone: 2026.08.593
  deliverable: results/experiment_6800_real_output_fixed_point_transfer_ab.json
  gated_on:
    - upstream: exp6799-model-output-formal-constraint-probes
      artifact_field: model_output_constraint_probe_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6799 provides formally calibrated refinement and restructuring graphs derived from frozen
    authentic SOTA GGUF outputs. Exp6788 provides the positive grouped-versus-flat recipe, but its
    data was synthetic. Reconstruct the exact V592 arms from their original training split and prove
    candidate-hash reproduction before freezing both arms. Then test zero-shot real-output transfer.
    The exact checker runs only after proposal and never supplies fitting, stopping, or decode input.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6786_constraint_dependency_hard_negative_fixture.json
    - {project_root}/results/experiment_6787_group_aware_soft_fixed_point.json
    - {project_root}/results/experiment_6788_soft_fixed_point_structural_control_ab.json
    - {project_root}/results/experiment_6789_soft_fixed_point_cold_authority_audit.json
