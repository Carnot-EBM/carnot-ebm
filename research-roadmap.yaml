  - id: exp2622
    milestone: "2026.05.251"
    deliverable: "results/experiment_2622_ensemble_v9_adversarial_val.json"
    title: "Ensemble v9 Adversarial Validation: 5-Seed Replication on Real FoVer Corpus"
    agent_type: codex
    model: gpt-5.5
    max_turns: 45
    track: adversarial_validation

    prior_failures:
      - experiment_id: exp2619-capstone-v250
        verdict: "complete: single-seed synthesis of .250 results"
        addressed_by: "exp2619 was a synthesis task producing a single-seed AUROC claim. CLAUDE.md Adversarial Artifact Verification rule requires N >= 30 examples AND multi-seed replication before paper-v6 citation. This task runs explicit 5-seed replication (seeds 42, 7, 99, 1234, 2026) and passes each artifact through adversarial_verify.py."
        retire_if_same_verdict: false
      - experiment_id: exp2546-ensemble-v7b-5seed
        verdict: "complete: ensemble_v7b_auroc=0.9857, std=0.0175 (5-seed adversarially verified)"
        addressed_by: "exp2546 validated ensemble v7b (0.9857). This validates ensemble v9 — a different model incorporating real-corpus-retrained tier0s, tier0u, and new Tier 0z. Different ensemble configuration, different baseline."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Ensemble v9 was built in exp2615 (.250) incorporating real-corpus-retrained tier0s/tier0u
      and the training-free Tier 0z semantic energy verifier. However, the AUROC claim from exp2615
      is single-seed and has NOT been validated by adversarial_verify.py.

      Per CLAUDE.md Adversarial Artifact Verification rule: "Any claim about a benchmark accuracy /
      TPR / improvement requires N >= 30 examples for any percentage-point delta claim AND a
      successful replication artifact (n>1 seeds, same direction)."

      Ensemble v7b baseline: AUROC = 0.9857 (5-seed, adversarially verified, exp2546).
      Ensemble v9 claim: pending 5-seed replication.

      The 5-seed gate (mean AUROC >= 0.90 AND adversarially_verified: true) determines whether
      paper-v6 can be updated with v9 numbers and whether BB-UCP conformal (exp2627) and paper
      polish (exp2629) should run.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (all tier0* files to understand ensemble v9 composition)
      - results/experiment_2615_ensemble_v9.json (exp2615 artifact — single-seed AUROC claim)
      - results/experiment_2619_capstone_v250.json (capstone synthesis of .250 results)
      - scripts/adversarial_verify.py (the verification script)

      TASK: Run 5-seed adversarial validation of ensemble v9 on real FoVer corpus.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import sklearn; import numpy; import scipy"` succeeds.
         b. FoVer corpus discoverable: check paths in order:
            {project_root}/data/fover_corpus.jsonl (primary from exp2609)
            {project_root}/python/carnot/verify/foVer_corpus.jsonl
            {project_root}/data/foVer_corpus.jsonl
            If none found with > 100 lines: write honest_verdict blocked_fover_corpus_not_found; exit.
         c. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         d. Read results/experiment_2615_ensemble_v9.json. If file absent or ensemble_v9_built != true:
            write honest_verdict blocked_ensemble_v9_not_built; exit.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus from the resolved path. Parse JSONL; extract (context, claim, label)
         triples where label in {hallucination, correct, 0, 1}. Normalize: label=1 = hallucination.
         n_corpus = number of valid triples. Require n_corpus >= 200 for statistical validity.

      2. Load ensemble v9 configuration from exp2615 artifact and from python/carnot/verify/:
         - tier0s: load tier0s_halluguard.py (with real pkl if present from exp2610)
         - tier0u: load tier0u_logical_consistency.py (with real pkl if present from exp2611)
         - tier0z: load tier0z_semantic_energy.py (if present from exp2612)
         - Other tiers from the ensemble composition in python/carnot/verify/

      3. For each seed in [42, 7, 99, 1234, 2026]:
         a. Set random_state = seed. Split corpus 80/20 stratified (or use full corpus for eval
            if n_corpus < 1000 — log which mode).
         b. For each (context, claim, label) in test split:
            - Run ensemble scoring: score = ensemble.score(context, claim)
            - Collect (score, label) pairs
         c. Compute AUROC, AUPRC using sklearn.metrics.roc_auc_score, average_precision_score.
         d. Write per-seed artifact to results/experiment_2622_seed_{seed}.json with:
            {seed, auroc, auprc, n_test, duration_s, random_seed: seed}
         e. Run `python scripts/adversarial_verify.py results/experiment_2622_seed_{seed}.json`
            Capture output; parse for CRITICAL flags (TAUTOLOGY, IMPLAUSIBLE_PERFECT, etc.)
            adversarial_flags_seed = list of any CRITICAL flags found.

      4. Aggregate across 5 seeds:
         ensemble_v9_auroc_mean = mean(auroc_per_seed)
         ensemble_v9_auroc_std = std(auroc_per_seed)
         n_seeds_above_v7b = count(auroc > 0.9857)
         n_seeds_critical_flags = count(adversarial_flags != [])
         adversarially_verified = (n_seeds_critical_flags == 0) AND (ensemble_v9_auroc_mean >= 0.90)

      5. Write results/experiment_2622_ensemble_v9_adversarial_val.json with all required fields.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required for conductor reconciler to classify as done."
      - ensemble_v9_auroc_mean: float — mean across 5 seeds
        principle: "Multi-seed mean is the headline-eligible metric per CLAUDE.md sample-size rigor."
      - ensemble_v9_auroc_std: float — std across 5 seeds
        principle: "Std quantifies seed sensitivity; std > 0.02 flags instability in paper citation."
      - adversarially_verified: bool — True iff 0 CRITICAL flags AND mean AUROC >= 0.90
        principle: "Gate for exp2627 (BB-UCP) and exp2629 (paper polish); prevents non-headline-eligible numbers reaching the paper."
      - n_seeds_above_v7b: int — count of seeds with AUROC > 0.9857
        principle: "Measures consistency of improvement over v7b baseline."
      - auroc_per_seed: dict {seed: float} — per-seed AUROC
        principle: "Reproducibility: each seed independently verifiable."
      - adversarial_flags_per_seed: dict {seed: list} — CRITICAL flags per seed
        principle: "Documents which seeds triggered fabrication signals; isolates problematic seeds."
      - n_corpus: int — total FoVer corpus size used
        principle: "N >= 200 is the statistical minimum for AUROC confidence intervals < 0.05."
      - n_test: int — per-seed test set size (must be >= 100)
        principle: "Test set size floor; below 100 the AUROC estimate is statistically meaningless."
      - random_seed: 42 (first seed)
        principle: "Records primary seed used for audit; full per-seed breakdown in auroc_per_seed."
      - duration_s: float — total wall-clock across all 5 seeds
        principle: "Real sklearn evaluation on 1000+ examples takes >= 2s total; zero implies fabrication."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication record: documents which preconditions were actually verified."

      Run: `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"`.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2623
