  - id: exp4569-a2
    milestone: 2026.06.422
    title: 'PHASE A2 (ARC NORTH STAR; operator MANDATORY; THE GENERATION FIX) -- use the oracle-distinct
      cross-game DiscriminativeVerifier (LOO-AUROC 0.674) as a FRONTIER-EXPANSION priority in best-first search
      so the WINNING candidate is GENERATED, not just re-ranked. This attacks the .421 A6 root cause
      (ordering_gain=0 because the winner was never in the fixed pool). Measure generic_transfer + expanded-
      states-to-goal WITH vs WITHOUT on held-out variants, vs a random-priority positive control; bounded
      expansion (Scaling-Flaws guard). verifier_is_oracle: false. retire_if_same_verdict.'
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4569_verifier_guided_expansion.json
    prior_failures:
      - experiment_id: exp4556-a1
        verdict: 'complete: verifier_router_no_value_added_honest_null_gap_sharpened'
        addressed_by: 'exp4556 (.421 A1) wired the cross-game DiscriminativeVerifier as a RE-RANKER of a FIXED
          candidate pool and got ordering_gain=0 because the winning candidate was never IN the pool (the A6
          diagnostic: "no offline-reproduced target candidate for the ranker to promote"), AND its positive
          control failed. This task changes the MECHANISM: the verifier is the FRONTIER-EXPANSION priority in a
          best-first search -- it GROWS the candidate set toward the goal so the winner is GENERATED, not merely
          re-ordered within a pool that lacks it. Different operation (expansion vs ranking), with a random-
          priority positive control and a bounded expansion budget (arXiv:2502.00271 verifier-guided-search
          scaling-flaws guard). This is NOT the RETIRED LLM re-induction lever (no LLM proposal -- it grows the
          existing non-LLM action enumeration). If it reproduces the same no-value/winner-not-generated verdict,
          verifier-as-search-signal is retired for the sprint.'
        retire_if_same_verdict: true
    prompt: |
      CONTEXT ({date}, ARC sprint -- the GENERATION fix). The .421 A6 diagnostic is decisive: the oracle-distinct
      cross-game DiscriminativeVerifier (LOO-AUROC 0.674, the real moat result) added ZERO value as a RE-RANKER
      because the winning candidate was never in the fixed pool (ordering_gain=0 on tu93/tr87/sc25). A re-ranker
      cannot promote a winner that was never generated. The fix: use the verifier as the EXPANSION priority in a
      best-first search -- it decides WHICH frontier node to expand next, GROWING the search toward the goal so
      the winning candidate is GENERATED and tried. This is the verifier moat used where it can add value
      (search guidance, cf. arXiv:2502.18407 AgentRM / arXiv:2504.16828 ThinkPRM), bounded to avoid the
      verifier-guided-search scaling flaws (arXiv:2502.00271). NO LLM (it grows the existing non-LLM action
      enumeration; this is NOT the retired re-induction lever). verifier_is_oracle: false.

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_value_learner.py (DiscriminativeVerifier ~497, cross_game_features_v3 ~394 -- the oracle-distinct LOO-0.674 verifier)
        - {project_root}/python/carnot/agentic/arc_graph_explore.py (graph_explore_solve_v2 ~231 -- best-first frontier; rich_action_candidates ~44)
        - {project_root}/python/carnot/agentic/arc_solver_kit.py (OfflineSolver best-first/dedup -- the frontier the priority drives)
        - {project_root}/python/carnot/experiment_4550_honest_sprint_metric.py (measure_generic_transfer_over_variants ~190 -- the 0.04 baseline harness)
        - {project_root}/results/experiment_4561_primitive_persist_transfer.json (.421 A6: the ordering_gain=0 winner-not-in-pool root cause this fixes)
        - {project_root}/results/experiment_4556_verifier_router_generic_transfer.json (.421 A1: the re-ranker null this re-mechanizes)

      TASK: wire the DiscriminativeVerifier as a FRONTIER-EXPANSION priority (best-first node selection) in the
      generic solver; measure generic_transfer + expanded-states/actions-to-goal WITH vs WITHOUT on held-out
      variants, vs a RANDOM-priority positive control; bounded expansion. verifier_is_oracle: false. Honest null
      if expansion does not help.

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
           b. `.venv/bin/python -c "from carnot.agentic.arc_value_learner import DiscriminativeVerifier"` exits 0 AND the trained cross-game verifier / corpus is loadable.
           ANY missing -> honest_verdict blocked_<resource>, populate preconditions_checked, EXIT. (--no-cov on focused pytest.)
        1. Use the DiscriminativeVerifier score as the best-first EXPANSION priority (which frontier node to expand next), NOT as a final re-ranker. Keep the bare best-first ordering as the no-regression fallback. Bound the expansion budget (max_expansions) so a mis-scoring verifier cannot blow up the search (the Scaling-Flaws guard); record expansions used.
        2. Measure WITH verifier-expansion vs WITHOUT on the 25 public games x N held-out variants (reuse measure_generic_transfer_over_variants): generic_transfer_rate_over_variants, median expanded-states-to-goal / actions-to-goal, solve-rate. The WIN: generic_transfer STRICTLY > 0.04 with a bootstrap CI excluding the baseline, OR a STRICTLY lower expanded-states-to-goal on solved variants, AND solve-rate not dropped.
        3. POSITIVE CONTROL + FALSE_NEGATIVE_RISK: verifier-expansion must beat a RANDOM-priority control on the SAME variants (proves the verifier signal is load-bearing as a search guide). A no-value null is valid only if this control passed; else report the honest null + whether the winner was GENERATED at all (the sharpened generation gap for .423). Emit transfer_delta explicitly + a null_delta_methodology_note when 0.0. Offline-reproduce any newly-solved variant.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: verifier_guided_expansion_generic_transfer_<n>_above_0.04 OR complete: verifier_guided_expansion_no_value_honest_null_generation_gap_sharpened."
        inference_substrate:
          principle: "verifier_ensemble_against_cached_candidates -- the verifier scores offline frontier candidates, no LLM load (1s floor)."
        verifier_is_oracle:
          principle: "MUST be false -- the DiscriminativeVerifier guides search by a LEARNED cross-game signal, oracle-DISTINCT from the executable win-check (a circular win does not count)."
        generic_transfer_rate_with_expansion:
          principle: "the HEADLINE -- held-out variant transfer WITH verifier-guided expansion; > 0.04 with CI-excl-baseline is the non-circular live-value evidence."
        generic_transfer_rate_baseline:
          principle: "0.04 -- the .420/.421 B1 bare-solver baseline, measured the SAME way."
        transfer_delta:
          principle: "with_expansion - baseline, emitted explicitly so a null (0.0) is annotated, not a control==best TAUTOLOGY false-positive."
        transfer_ci:
          principle: "bootstrap CI on the transfer delta; a claim above baseline requires the CI to exclude the baseline."
        expanded_states_to_goal_with_vs_without:
          principle: "the search-efficiency evidence -- did verifier-guided expansion reach the goal in fewer expanded states (the winner GENERATED earlier)."
        winner_generated:
          principle: "did the search GENERATE the winning candidate at all (the .421 A6 root cause: a re-ranker fails when the winner is never generated) -- the load-bearing diagnostic."
        expansions_used:
          principle: "the bounded expansion budget consumed -- proves the Scaling-Flaws guard (arXiv:2502.00271) held and bounds wall-clock."
        random_priority_control_passed:
          principle: "the POSITIVE CONTROL -- verifier-expansion must beat random-priority on the SAME variants; a null is valid only if this passed."
        false_negative_risk_checked:
