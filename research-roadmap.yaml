    TASK:
    1. VERIFY FASTPATH FIX:
       grep -n "_deliverable_exists\|status.*running" scripts/research_conductor.py | head -10
       Does _deliverable_exists() check the "status" field? If not: implement it.
       If yes: confirm it returns False for ("status": "running").

    2. VERIFY GATE COERCION FIX:
       grep -n "_coerce_gate_value\|_evaluate_gate\|str.*True" scripts/research_conductor.py | head -10
