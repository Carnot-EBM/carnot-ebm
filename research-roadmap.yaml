        executable_verifier_is_oracle:
          principle: "Bare bool (true on unique-solution Sudoku): flags that the executable-validity rerank == oracle by construction, so the capstone NEVER reads executable_oracle_upper_bound as a generalization claim."
        executable_oracle_upper_bound:
