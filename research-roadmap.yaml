milestone: 2026.06.390
milestone_title: "RE-AIM AT THE ORACLE-DISTINCT FRONTIER — does a LEARNED (oracle-distinct) verifier beat majority vote on ARC where execution is NOT the oracle (close GAP-3-ties-vote), and FINISH the owed de-confounded verifier-as-reward A-vs-B on code (the .389 operating point CLEARED — only the BACKGROUND training infra died)"
milestone_doc: openspec/change-proposals/research-roadmap-v390.md
milestone_overview: |
  .389 tried to run the de-confounded verifier-as-reward A-vs-B on CODE. The code operating point
  CLEARED (exp4197: Phase-0 certification precision 0.956, Youden J=0.414, training headroom 0.600,
  harness ready) and the 3-arm corpora were BUILT + N-matched (exp4198: A=776 certified, B=776
  same-generator random-label, C=742 gold; base_passrate=0.6). But the BACKGROUND LoRA training
  process EXITED before its first checkpoint (exp4198 blocked_training_process_exited_before_checkpoint),
  so the decisive A-vs-B was never collected (exp4199 gate-blocked) and the capstone — skipping FOUR
  DURATION_TOO_SHORT-flagged artifacts (exp4197/4198/4200/4204) — read "NO-OPERATING-POINT". That
  headline is an INFRA artifact, NOT a scientific one: the operating point is real; the
  *powering-run-background-mechanism-fails* pattern killed the run (memory
  incident_powering_run_background_mechanism_fails). The stable checkpoint dir
  code_verifier_reward_lora_rft_a83b52882c198954 + the N-matched corpora are intact on disk.
  ARC held at total_levels_solved=15 / total_games_solved=13 (exp4201 no new solve); the live solver
  beat the random/greedy floor on EFFICIENCY only (exp4202: 5 vs 6 actions) but completed 0 levels
  (no accuracy win, no leaderboard submission). Hardware: GateMate unreachable, PolarFire hash-verified
  CPU dispatch, KV260 terminal. SOTA flagged for .390 = non_qwen_same_generator_random_label_ablation.

  Meanwhile the operator's NEWEST directive (2026-06-14 P0, "2+3+1") re-aims the verifier program at
  the ORACLE-DISTINCT frontier: the verifier's EXECUTION wins (code, ARC GAP-4) are CIRCULAR (verifier
  == executable oracle) — valid, but NOT a moat and NOT headline/gate-eligible. The deep, defensible,
  still-UNPROVEN claim is an oracle-DISTINCT (learned/energy) verifier that captures headroom where
  execution is NOT the oracle — closing GAP-3-energy-ties-vote-on-ARC. So .390 serves BOTH:
    PHASE A -- THE ORACLE-DISTINCT FRONTIER (HEADLINE): A1 (exp4208) the cheap verifier-as-DETECTOR
      measurement (detection AUROC where SELECTION headroom is ~0; the OTHER axis of value); A2
      (exp4209) BUILD the oracle-distinct learned ARC verifier (reuse the .386 V-STaR class, exp4176,
      arXiv:2402.06457, on the ARC GAP-4 pool; verifier_is_oracle=false); A3 (exp4210, gated_on A2)
      MEASURE does it beat majority vote OFF-ORACLE vs a MATCHED no-verifier control, CI95-excl-0 --
      framed by ARBITER's "wrong-majority failures" (arXiv:2605.26172). The headline gate.
    PHASE B -- OWED verifier-as-reward + self-learning: B1 (exp4211) FINISH the de-confounded A-vs-B on
      code -- RESUME the .389 checkpoint, run the 3-arm LoRA-RFT SYNCHRONOUSLY / resume-accumulate /
      per-step progress prints (the infra fix); A(certified) vs B(same-generator random-label = the
      Spurious-Rewards control arXiv:2506.10947) vs C(gold) vs D(cold); gold-control + truncation
      guards; Youden-J; memorization-shortcut diagnostic (arXiv:2601.11061); verifier_is_oracle=true
      (HONEST -- reward axis, not a moat). B2 (exp4212) certified-ARC-corpus distill-lift
      (Invisible-Leash latent-vs-absent, arXiv:2507.14843).
    PHASE C -- ARC NORTH-STAR: C1 (exp4213) monotonic ARC +1 (total_levels>=16); C2 (exp4214) the LIVE
      solver-vs-floor probe, now ACCURACY-seeking (complete a level), NO leaderboard submission.
    PHASE D -- reserved slots: D1 (exp4215) SOTA-ingestion (oracle-distinct track), D2 (exp4216)
      registry+gaps hygiene, D3 (exp4217) hardware continuity, D4 (exp4218) capstone .390.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227, SIGTERM'd) and the conductor
  stays stood-down. NO task may launch TRM training, run pkill/kill against train.py, or WRITE
  results/trm_runs/sudoku_extreme_baseline/. Phase B trains a SEPARATE small NON-Qwen code base via
  LoRA on the RTX 3090 rig -- it does NOT touch the TRM checkpoint. Qwen is FORBIDDEN as the TRAINED
  base (Spurious-Rewards confound); Qwen GGUF as an off-policy teacher / certifier reference is fine.
  DiffusionGemma stays GATED (STILL-PENDING; activate ONLY on an oracle-distinct win with a matched
  control). Every verifier-value task MUST declare verifier_is_oracle honestly (Circularity Discipline).

