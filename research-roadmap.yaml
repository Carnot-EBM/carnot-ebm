milestone: "2026.08.583"
milestone_title: "Verifier-Grounded Planning Energy"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6688-v583-manifest-parity-contract
    milestone: "2026.08.583"
    deliverable: results/experiment_6688_v583_manifest_parity_contract.json
    title: "V583 document-to-manifest parity contract"
    priority: critical
    track: execution-integrity
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 45
    agent_type: claude
    model: opus
    prompt: |
      CONTEXT:
      V582 proved that roadmap parity must be an executable precondition. V583 contains fourteen tasks across an exact-planning spine, continuous self-learning, and an independent sampler branch. This task proves that the design and execution manifest are the same contract before science begins. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
      - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md, {project_root}/ops/exclusion_manifest.yaml, and available Exp6674-Exp6687 records
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/audit_roadmap_gates.py, {project_root}/scripts/exclusion_manifest_lint.py, and {project_root}/scripts/conductor_gates.py
      - relevant research-harness, evidence, reporting, and pipeline specs plus {project_root}/ops/e2e-test-plan.md

      TASK:
      Implement and run a read-only V583 execution-contract audit. Confirm exact document-to-YAML task-set parity, conductor order, unique deliverables, dependencies, structured gates, producer field spelling, prior-failure blocks, routes, resource flags, and run commands. Do not patch either roadmap, the exclusion manifest, validators, or the conductor.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash both roadmaps, the V583 design, conductor, exclusion manifest, relevant prior artifacts, Python, CPU, RAM, disk, and the no-LLM substrate.
      1. Add or update REQ-* and SCENARIO-* anchors for manifest parity before implementation. Write focused tests first.
      2. Parse the design and next manifest. Require exactly Exp6688 through Exp6701 in identical order with one unique JSON deliverable each.
      3. Compare every title, track, GPU flag, route, dependency, gate, prior-failure entry, required producer field, and run command.
      4. For every gate, prove the producer is in V583 and declares the artifact_field with identical spelling in its own REQUIRED ARTIFACT FIELDS.
      5. Verify all referenced prior failures against artifacts, conductor states, and the exclusion manifest. Reject retired upstream dependencies and missing retirement signals.
      6. Run YAML parse, roadmap schema, prior-failure, gate-contract, and exclusion-manifest checks in read-only mode. Record any dated operator-schema mismatch without weakening a validator.
      7. Set v583_manifest_parity_ready=true only if all task sets, order, paths, gates, fields, routes, and commands match with no activation-hard violation.
      8. Write atomically. Run focused tests, scoped coverage, spec coverage, row consistency, artifact validation, adversarial verification, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6688_v583_manifest_parity_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal task state. Principle: deterministic process evidence.
        honest_verdict: parity conclusion or exact blocker. Principle: measured evidence only.
        verdict_class: one of positive|circular_positive|null|blocked|disqualified|partial; ready infrastructure is null. Principle: closed classification.
        gate_check_summary: exact failed check, expected value, and observed value for blocked results. Principle: deterministic failure localization.
        design_task_rows: ordered design task IDs and declared fields. Principle: raw contract evidence.
        manifest_task_rows: ordered YAML task IDs and declared fields. Principle: raw execution evidence.
        producer_consumer_rows: producer, field, consumer, operator, and value for every gate. Principle: deterministic cross-reference evidence.
        prior_failure_rows: prior scope, verdict, changed condition, and retirement signal. Principle: traceable failure lineage.
        route_rows: agent backend, model, max turns, task category, and validation. Principle: explicit execution provenance.
        validator_rows: command, exit, output, classification, and hash. Principle: reproducible verification.
        v583_manifest_parity_ready: boolean owned by this task. Principle: deterministic reduction from complete rows.
        per_unit_rows: every task, gate, prior-failure, route, and validator row. Principle: recheckable raw evidence.
        aggregate_row_recomputation: readiness rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: inputs, resources, tools, and hashes. Principle: measured provenance.
        protected_files_unchanged: before and after hashes for both roadmaps and the conductor. Principle: deterministic integrity.
        inference_substrate: artifact_and_manifest_audit_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: true for this deterministic infrastructure contract. Principle: explicit circularity boundary.
        field_provenance: source path, parser, function, and hash per field. Principle: traceable evidence.
        random_seed: deterministic audit-order seed. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6688_v583_manifest_parity_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6689-exact-planning-fixture
    milestone: "2026.08.583"
    deliverable: results/experiment_6689_exact_planning_fixture.json
    title: "Generated finite-horizon exact planning fixture"
    priority: critical
    track: verifier-grounded-planning
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.6-sol
    gated_on:
      - upstream: exp6688-v583-manifest-parity-contract
        artifact_field: v583_manifest_parity_ready
        op: in
        value: [true]
    prompt: |
      CONTEXT:
      V583 needs a contamination-resistant planning corridor with exact evaluation and dense per-action supervision. Recent work converts exact dynamic-programming action values into verifier rewards. VeRA recommends generated executable specifications rather than static benchmark questions. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, the V583 roadmap doc, and the V583 reference refresh
      - {project_root}/results/experiment_6688_v583_manifest_parity_contract.json, Exp6604, Exp6649, Exp6650, and relevant exact-corpus artifacts
      - {project_root}/python/carnot/verify/plan_graph_energy_adapter.py, {project_root}/python/carnot/core/energy.py, exact checkers, artifact helpers, and deterministic split utilities
      - constraint-verification, verifiable-reasoning, benchmarks, evidence, safety, reporting, and pipeline specs plus the E2E plan

      TASK:
      Build a generated finite-horizon planning fixture with four structural families, executable transitions and constraints, exact optima, exact per-action values, sealed labels, and natural-language prompts that contain no answer. This is a benchmark and authority fixture, not an LLM experiment.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify the manifest gate, Python, CPU, RAM, disk, numeric dependencies, deterministic JSON support, active roadmap hash, conductor hash, and no-LLM substrate. Stop with a blocked artifact on a failed gate.
      1. Add REQ-* and SCENARIO-* anchors to the appropriate existing capability specs before implementation. Write focused failing tests first.
      2. Implement inventory, battery-dispatch, job-slot, and reservoir-control generators. Cap horizon at eight and available actions at five. Generate separate development and 32 headline instances with family and seed isolation.
      3. Emit typed state, action, hard-constraint, transition, immediate-cost, terminal-cost, and text-template records. Text must not contain optimum actions, action values, label hashes, or hidden solver hints.
      4. Implement backward dynamic programming over complete reachable state spaces. Retain every state-action-next-state row, value, optimum tie set, infeasible action, and Bellman residual.
      5. Seal exact tables separately from live prompts. Define an API that reveals validity, optimum, regret, and action gaps only after a plan commit or after an explicitly post-event learning boundary.
      6. Freeze family splits, seeds, generator versions, text templates, tolerances, tie policy, infeasible-state policy, and missing-row policy.
      7. Attack parameter mutation, transition mutation, constraint removal, cost sign flips, horizon truncation, tie mishandling, unreachable states, label leakage, prompt-answer collision, and split overlap.
      8. Set planning_fixture_ready=true only if all generated instances are complete, Bellman residuals satisfy tolerance, attacks are detected, label sealing passes, and every aggregate recomputes from rows.
      9. Write atomically. Run focused tests, 100% scoped coverage, lint, format, spec coverage, row/artifact/adversarial checks, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6689_exact_planning_fixture.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal fixture state. Principle: deterministic process evidence.
        honest_verdict: exact fixture readiness or precise blocker. Principle: measured evidence only.
        verdict_class: closed enum; ready exact infrastructure is null. Principle: deterministic classification.
        gate_check_summary: failed upstream, generator, solver, sealing, test, or attack check with expected and observed values. Principle: deterministic failure localization.
        openspec_requirement_ids: added REQ-* and SCENARIO-* anchors. Principle: spec-first traceability.
        frozen_fixture_manifest: families, counts, splits, seeds, horizons, actions, templates, rules, tolerances, and hashes. Principle: immutable benchmark definition.
        family_rows: family definition, parameter ranges, train/development/headline counts, and split hashes. Principle: transfer-boundary evidence.
        instance_rows: every instance with prompt path, typed spec path, family, seed, horizon, action count, reachable-state count, and hashes. Principle: complete fixture evidence.
        transition_rows: every reachable state-action-next-state, validity, constraints, cost, and receipt. Principle: executable dynamics evidence.
        dynamic_programming_rows: every state-action value, optimum tie set, value-to-go, and Bellman residual. Principle: exact supervision evidence.
        label_sealing_receipts: prompt-store and exact-store separation, access API, timing rule, and hashes. Principle: future-label isolation.
        leakage_attack_rows: attack, expected result, observed result, and receipt. Principle: adversarial benchmark integrity.
        metamorphic_rows: parameter, transition, cost, horizon, and symmetry transformations with expected and observed values. Principle: exact-solver validation.
        planning_fixture_ready: boolean owned by this task. Principle: deterministic reduction from complete exact rows.
        per_unit_rows: every family, instance, transition, state-action value, metamorphic check, and attack. Principle: recheckable raw evidence.
        aggregate_row_recomputation: all counts and readiness rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: gate, tools, resources, inputs, and hashes. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: cpu_generated_exact_dynamic_programming_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: true because the generated executable specification defines correctness. Principle: explicit circularity boundary.
        field_provenance: generator, transition, solver, sealing API, function, and hash per field. Principle: traceable evidence.
        random_seed: base, family, split, and instance seeds. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6689_exact_planning_fixture --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6690-exact-planning-fixture-audit
    milestone: "2026.08.583"
    deliverable: results/experiment_6690_exact_planning_fixture_audit.json
    title: "Cold exact planning fixture audit"
    priority: critical
    track: verifier-grounded-planning
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 60
    gated_on:
      - upstream: exp6689-exact-planning-fixture
        artifact_field: planning_fixture_ready
        op: in
        value: [true]
    prompt: |
      CONTEXT:
      Exp6689 claims generated dynamics, exact optima, per-action values, and sealed prompts. This cold audit must reproduce those claims without importing Exp6689's dynamic-programming reducer. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V583 roadmap doc, and exact-evidence claim rules
      - {project_root}/results/experiment_6689_exact_planning_fixture.json and all fixture, prompt, typed-spec, and exact-table stores
      - Exp6604 and Exp6649 cold-check patterns, independent enumeration helpers, row consistency, artifact validation, and adversarial verification
      - relevant constraint-verification, benchmarks, evidence, statistics, safety, and reporting specs plus the E2E plan

      TASK:
      Independently audit the generated planning fixture. Reparse typed specs, exhaustively enumerate a blinded subset, recompute optimal values and ties, and verify prompt/label separation, family isolation, and mutation sensitivity. Do not use Exp6689's DP implementation for the cold calculation.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify the planning_fixture_ready gate; hash Exp6689, all stores, specs, audit code inputs, active roadmap, conductor, CPU, RAM, disk, and the no-LLM substrate.
      1. Freeze a blinded stratified sample and reveal procedure before reading expected values. Include every family, feasible and infeasible actions, ties, and boundary states.
      2. Implement an independent forward exhaustive enumerator or brute-force plan enumerator. Do not call the Exp6689 Bellman reducer.
      3. Recompute reachable states, valid transitions, plan costs, optima, ties, state values, action gaps, and Bellman identities for every blinded audit unit.
      4. Scan every natural-language prompt and live manifest for answers, labels, optimum plans, action values, hashes correlated with labels, split collisions, and development/headline overlap.
      5. Attack row deletion, duplication, spec/prompt mismatch, family relabeling, transition mutation, constraint mutation, cost mutation, tie collapse, hidden-field access, and seal timing.
      6. Set planning_fixture_audit_passed=true only if coverage is complete, cold values match within tolerance, sealing and isolation pass, and every attack fires.
      7. Write atomically. Run focused tests, scoped coverage, spec coverage, row consistency, artifact validation, adversarial verification, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6690_exact_planning_fixture_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal audit state. Principle: deterministic process evidence.
        honest_verdict: reproduced, corrected, disqualified, or blocked conclusion. Principle: measured evidence only.
        verdict_class: one of positive|circular_positive|null|blocked|disqualified|partial; fixture audit normally null. Principle: closed classification.
        gate_check_summary: failed upstream or audit check with expected and observed values. Principle: deterministic failure localization.
        blinding_receipt: stratification, hidden map hash, reveal procedure, and audit seed. Principle: independent evaluation.
        coverage_rows: expected and observed families, instances, states, actions, ties, and boundary cases. Principle: completeness evidence.
        cold_enumeration_rows: independently recomputed plans, costs, optima, ties, state values, action gaps, and residuals. Principle: exact audit evidence.
        reported_vs_recomputed: field-level reported and cold values with differences. Principle: deterministic correction evidence.
        sealing_audit_rows: path, store, access phase, forbidden-field scan, and hash. Principle: future-label isolation evidence.
        split_isolation_rows: family, split, identity, overlap check, and result. Principle: transfer-boundary evidence.
        attack_rows: deletion, duplicate, mismatch, relabel, mutation, tie, hidden access, and timing attacks. Principle: adversarial evidence.
        planning_fixture_audit_passed: boolean owned by this task. Principle: deterministic reduction from audit rows.
        per_unit_rows: every coverage, cold value, sealing, split, comparison, and attack row. Principle: recheckable raw evidence.
        aggregate_row_recomputation: all audit conclusions rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: gate, inputs, tools, resources, and hashes. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: cold_exhaustive_planning_audit_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: true because the audit recomputes the exact authority. Principle: explicit circularity boundary.
        field_provenance: raw spec, independent function, seal scan, and hash per field. Principle: traceable evidence.
        random_seed: blinding and attack-order seeds. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6690_exact_planning_fixture_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6691-sota-planning-proposal-corpus
    milestone: "2026.08.583"
    deliverable: results/experiment_6691_sota_planning_proposal_corpus.json
    title: "Three-family SOTA planning proposal corpus"
    priority: critical
    track: verifier-grounded-planning
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 240
    prior_failures:
      - experiment_id: exp5747-sota-exact-proposal-utility-panel
        verdict: blocked_gate_check_failed
        addressed_by: "Exp5747 never ran because its gate read benchmark_ready_score=None; Exp6690 now owns the row-recomputed planning_fixture_audit_passed field that Exp6691 gates on before generation."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6690-exact-planning-fixture-audit
        artifact_field: planning_fixture_audit_passed
        op: in
        value: [true]
    prompt: |
      CONTEXT:
      Exp6689-Exp6690 provide an audited exact planning fixture with sealed labels. V583 now needs authentic proposals from all three mandated local GGUF families. The corpus measures proposal support and headroom; it does not retry malformed output or let the exact evaluator influence generation. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/scripts/experiment_template.py, the V583 roadmap doc, and the V583 reference refresh
      - {project_root}/results/experiment_6689_exact_planning_fixture.json, Exp6690, Exp6648, Exp6649, and current SOTA GGUF canary artifacts
      - {project_root}/python/carnot/inference/sota_models.py, llama.cpp loaders, embedded-tokenizer helpers, server supervisor, lease code, process receipts, and raw-output stores
      - relevant inference, model-tier, constraint-verification, evidence, safety, statistics, reporting, and pipeline specs plus the E2E plan

      TASK:
      Create a frozen proposal corpus on the 32 audited headline instances using Qwen3.6-35B-A3B, Gemma-4-31B, and Gemma-4-26B-A4B. Retain raw responses, untrusted rationales, parsed action proposals, exact post-generation evaluations, and authentic CUDA receipts for every model-instance unit.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify the planning_fixture_audit_passed gate; resolve all model files from local cache; verify GGUF magic, hashes, embedded tokenizers, CUDA visibility, VRAM, RAM, disk, owner-bound leases, ports, and no conflicting process. If any mandated model cannot run on CUDA, write a blocked artifact and stop.
      1. Add or update REQ-* and SCENARIO-* anchors for the frozen proposal corpus. Write focused tests first.
      2. Define MODEL_SPECS with unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Resolve with cached_sota_pair() and resolve_cached_gguf(). Legacy small models may run CPU smoke tests only and cannot satisfy a headline row.
      3. Freeze instance order, model order, prompts, system text, generation settings, seeds, one-call budget, response budget, parser, maximum four extracted proposals, stopping rules, missing-row policy, and exact-evaluation timing before inference.
      4. Launch fresh owner-bound llama.cpp CUDA processes. Run exactly one planned call per model-instance unit. Ask for candidate action sequences and optional reasoning, but do not expose solver fields, optimum values, labels, or answer-encoding grammar.
      5. Retain the unmodified response. Extract at most four action sequences without regeneration. Mark parse failures and empty proposal sets; do not silently retry, repair, or substitute a solver plan.
      6. Only after response commitment, evaluate each proposal with the sealed exact API. Record validity, cost, normalized regret, first failing step, candidate diversity, oracle-at-K headroom, no-headroom, tokens, latency, process identity, and accelerator evidence.
      7. Report overall and per-model parse yield, proposal count, exact validity, regret, headroom, diversity, cost, missing units, and intervals. Keep model comparisons paired by instance.
      8. Set proposal_corpus_ready=true only when every planned unit is present or explicitly missing with cause, raw responses and process receipts exist, exact access occurred after commitment, and aggregates recompute from rows.
      9. Write atomically. Cleanly unload servers and release leases. Run focused tests, scoped coverage, spec coverage, row/artifact/adversarial checks, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6691_sota_planning_proposal_corpus.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal corpus state. Principle: deterministic process evidence.
        honest_verdict: corpus completeness and measured proposal support or precise blocker. Principle: measured evidence only.
        verdict_class: closed enum; readiness alone is null and an oracle-defined positive is circular_positive. Principle: deterministic classification.
        gate_check_summary: failed upstream, model, lease, process, row, test, or timing check with expected and observed values. Principle: deterministic failure localization.
        openspec_requirement_ids: REQ-* and SCENARIO-* anchors. Principle: spec-first traceability.
        model_specs: exact hub IDs, paths, hashes, tokenizer sources, quantization, GPU assignments, and roles. Principle: substrate identity.
        models_used: exact mandated hub IDs that completed headline rows. Principle: measured model provenance.
        frozen_run_manifest: instances, models, prompts, settings, seeds, budgets, parser, rules, order, and hashes. Principle: preregistered comparison.
        per_model_process_receipts: PID/start, port, owner token, model hash, CUDA UUID, VRAM, inference count, unload, and release. Principle: authentic accelerator use.
        per_unit_rows: every model-instance unit with raw response path, proposal paths, parse outcome, exact post-commit metrics, tokens, latency, and receipts. Principle: recheckable comparative evidence.
        proposal_rows: every extracted proposal with action sequence, validity, cost, regret, first failure, rank, source span, and hashes. Principle: raw candidate evidence.
        model_summary_rows: paired per-model parse, diversity, validity, regret, headroom, token, and latency metrics. Principle: model-family evidence.
        headroom_rows: oracle-at-K, no-headroom cause, valid-candidate count, and best regret per instance-model. Principle: intervention opportunity evidence.
        missing_unit_rows: every absent or invalid unit with cause and consequence. Principle: no missing-to-zero coercion.
        proposal_corpus_ready: boolean owned by this task. Principle: completeness reduction from planned rows.
        aggregate_row_recomputation: all headlines rebuilt from per-unit and proposal rows. Principle: deterministic aggregation.
        preconditions_checked: gate, cache, CUDA, lease, process, memory, disk, and input receipts. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: local_llamacpp_cuda_mandated_gguf_three_family. Principle: measured substrate identity.
        verifier_is_oracle: true because exact DP labels evaluate completed proposals. Principle: explicit circularity boundary.
        field_provenance: raw response, parser, sealed evaluator, process, function, and hash per field. Principle: traceable evidence.
        random_seed: base and per-model-instance seeds. Principle: reproducibility.
        duration_s: total monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6691_sota_planning_proposal_corpus --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6692-structural-plan-energy
    milestone: "2026.08.583"
    deliverable: results/experiment_6692_structural_plan_energy.json
    title: "Oracle-distinct structural plan energy"
    priority: critical
    track: verifier-grounded-planning
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.6-sol
    gated_on:
      - upstream: exp6691-sota-planning-proposal-corpus
        artifact_field: proposal_corpus_ready
        op: in
        value: [true]
    prior_failures:
      - experiment_id: exp5163
        verdict: "complete_mmlu_pro_fewshot_verifier_vs_cheap_delta_+0.025_CI95_[-0.125,0.175]_CI_includes_0"
        addressed_by: "This task replaces retired generated-text and logprob scoring with typed executable plan features, family-held-out training, and action-search guidance; rationales and model identity are excluded."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      External generated-text energy scorers are retired after Exp5163 and seven milestones of null or marginal evidence. V583 tests a different representation and seam: a small energy over typed plan states, trained from exact development action gaps, evaluated leave-one-family-out, and later used to guide action search rather than rank prose answers. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V583 roadmap doc, the V583 reference refresh, and the Phase-D exclusion entry for Exp5163
      - {project_root}/results/experiment_6689_exact_planning_fixture.json, Exp6690, Exp6691, Exp5163, Exp1501, and relevant structural-energy artifacts
      - {project_root}/python/carnot/verify/plan_graph_energy_adapter.py, {project_root}/python/carnot/core/energy.py, {project_root}/python/carnot/experiment_4781_structural_energy_s1_contrastive_landscape.py, and leakage-audit helpers
      - constraint-verification, verifiable-reasoning, core-EBM, evidence, statistics, safety, reporting, and pipeline specs plus the E2E plan

      TASK:
      Train and evaluate a small oracle-distinct pairwise-margin energy over typed planning features. Use exact action gaps only as development labels and held-out evaluation labels. Exclude all text, rationale, model identity, task identity, and exact future-value features from the live energy input.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify proposal_corpus_ready, fixture and corpus hashes, CPU, RAM, disk, numeric libraries, deterministic training support, active roadmap, and conductor. Stop with a blocked artifact on any failed gate.
      1. Add REQ-* and SCENARIO-* anchors for typed energy features, leave-one-family-out evaluation, leakage exclusion, baselines, and promotion criteria. Write focused tests first.
      2. Freeze feature schema, normalization, pair construction, development/headline splits, family folds, seeds, optimizer, epochs, early-stopping rule, missing-row rule, and primary metric before fitting.
      3. Build features only from typed current state, proposed action or partial plan, immediate cost, resource slack, local hard-constraint status, transition-local deltas, and action-position statistics available at inference.
