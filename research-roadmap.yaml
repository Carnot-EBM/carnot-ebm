  - id: exp2732
    milestone: "2026.05.259"
    deliverable: "results/experiment_2732_entanglement_retirement_diversity_audit.json"
    title: "Behavioral Entanglement Lineage Retirement + Diversity-Maximizing Verifier Selection Audit"
    agent_type: codex
    model: gpt-5.5
    max_turns: 25
    track: verifier

    prior_failures:
      - experiment_id: exp2723-behavioral-entanglement-reweighting
        verdict: "complete: auroc_lift=-0.008 (NEGATIVE); high_entanglement=false; reweighting did not improve discrimination"
        addressed_by: "exp2723 (.258) showed pairwise Pearson correlation is low (high_entanglement=false), making the de-entangled reweighting premise incorrect. This exp2732 has DIFFERENT scope: (1) formally documents the retirement of the Pearson-correlation-based reweighting approach, and (2) implements a DIFFERENT diversity criterion (diversity-maximizing greedy selection: pick verifiers that maximize ensemble coverage, not minimize pairwise correlation). This is an analysis + alternative selection task, not a rerun of correlation-based reweighting."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      exp2723 (.258): auroc_lift=-0.008 (NEGATIVE), high_entanglement=false. The behavioral entanglement
      reweighting hypothesis was NOT confirmed. Pairwise Pearson correlation between Carnot's verifiers is
      low — they are NOT behaviorally entangled by this criterion.

      IMPLICATION: The saturation at k=2 (exp2704) is NOT caused by verifier entanglement. Alternative
      explanation: the verifiers are complementary but redundant at k>2 — each additional verifier adds
      precision but not recall. This calls for a DIVERSITY criterion, not an entanglement criterion.

      This task: (1) formally retires the Pearson-correlation entanglement reweighting approach,
      (2) implements diversity-maximizing greedy verifier selection (covers cases the ensemble misses).

      EXISTING CODE TO READ FIRST:
      - results/experiment_2723_behavioral_entanglement_reweighting.json (correlation_matrix, auroc_lift)
      - python/carnot/verify/ (list all tier0* verifier modules)
      - data/fover_corpus.jsonl (FoVer corpus)

      TASK: Retire Pearson-correlation reweighting. Implement diversity-maximizing greedy selection.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `ls results/experiment_2723_behavioral_entanglement_reweighting.json 2>/dev/null && echo exists || echo missing`
            Record: exp2723_artifact_exists (bool).
         b. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         c. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0` — FoVer corpus.
            If 0 or missing: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Formally retire the Pearson-correlation reweighting approach:
         Write a retirement record in the artifact explaining:
         - Why retired: high_entanglement=false (exp2723) means the approach's premise was wrong
         - What was learned: verifiers have low pairwise correlation, so uniform weighting is near-optimal
         - Alternative: diversity-maximizing selection (greedy coverage)
         Record: entanglement_lineage_retired (bool = true), retirement_reason (str).

      2. Implement diversity-maximizing greedy selection:
         diversity_select(verifier_scores_matrix, labels, k_target: int = 4) -> list of indices:
         """Greedy selection: start with best single verifier (highest AUROC), then add each
         verifier that maximizes F1 improvement on the examples the current ensemble misses.
         This targets recall gaps (examples no current verifier catches) rather than
         correlation reduction (entanglement premise)."""
         Record: diversity_select_added (bool).

      3. Evaluate on FoVer eval split (80/20, random_seed=42):
         - Uniform ensemble AUROC (use all available tier0* verifiers)
         - Diversity-selected k=4 ensemble AUROC
         - diversity_lift = diversity_selected_auroc - uniform_auroc
         Record: uniform_auroc (float), diversity_selected_auroc (float), diversity_lift (float).
         diversity_viable = diversity_lift > 0.001.

      4. Write results/experiment_2732_entanglement_retirement_diversity_audit.json.

