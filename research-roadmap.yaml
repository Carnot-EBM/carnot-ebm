  deliverable: results/experiment_615_live_corpus_v3.json
  title: 'Exp 615: Live Corpus v3 Expansion — GSM8K 350-449 + Merge to fover_corpus_v5.json (GPU REQUIRED)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: The fover_corpus_v4.json\
    \ (from Exp 602) contains ~200-300 live pairs from GSM8K 0-349. The LLMAsExtractorV1\
    \ (Exp 616) needs diverse live data for evaluation and JEPA v13 (Exp 618) needs\
    \ it for calibrated retraining. This experiment collects 100 more live pairs from\
    \ GSM8K 350-449 (new question types — more complex multi-step problems) and merges\
    \ all corpora into fover_corpus_v5.json. CARNOT_FORCE_LIVE=1 is MANDATORY.\n\n\
    EXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/live_assertion.py — assert_live_gpu_available()\n\
    - python/carnot/pipeline/long_run_executor.py — LongRunBenchmarkExecutor\n- results/fover_corpus_v4.json\
    \ — existing corpus (READ schema: question_id, question, response, is_correct,\
    \ model_id, inference_mode)\n- results/experiment_602_live_corpus_v2.json — prior\
    \ expansion result\n- scripts/experiment_602_live_corpus_expansion_v2.py — copy\
    \ structure for this script\n\nTASK: Collect 100 live pairs from GSM8K 350-449,\
    \ merge into fover_corpus_v5.json.\n1. Read CLAUDE.md spec-first workflow.\n2.\
    \ Add REQ-DATA-011 (fover_corpus_v5: >= 300 real live pairs across diverse GSM8K\
    \ indices), SCENARIO-DATA-017/018 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write scripts/experiment_615_live_corpus_v3.py:\n   a. from python.carnot.pipeline.live_assertion\
    \ import assert_live_gpu_available; assert_live_gpu_available() FIRST.\n   b.\
    \ apply_env_autofix().\n   c. ExperimentTimeoutWatchdog(615, timeout_minutes=120).\n\
    \   d. ExperimentTemplate(615, 'Live Corpus v3 Expansion',\n      'results/experiment_615_live_corpus_v3.json',\
    \ requires_gpu=True).\n   e. LiveGPUGate.require_live_or_blocked().\n   f. JITVRAMCheck.\n\
    \   g. Model selection: try cached SOTA GGUFs first (unsloth/Qwen3.6-35B-A3B-GGUF\
    \ + unsloth/gemma-4-26B-A4B-it-GGUF). If unavailable, fall back to Qwen3.5-0.8B\
    \ + google/gemma-4-E4B-it. Log models_used in artifact.\n   h. Load GSM8K validation\
    \ split, questions 350-449.\n   i. LongRunBenchmarkExecutor(batch_size=25, checkpoint_path='results/exp615_ckpt.json').\n\
    \      For each question, each model: generate response, extract answer,\n     \
    \ compute is_correct, record (question_id, question, response, is_correct,\n  \
    \    model_id, inference_mode='live_gpu').\n   j. Write results/live_pairs_615.json\
    \ with 200 new pairs.\n   k. Merge: load all prior corpora (results/live_pairs_578.json,\
    \ results/live_pairs_579.json if exists, results/live_pairs_602.json, results/live_pairs_615.json).\
    \ Deduplicate by (question_id, model_id). Write results/fover_corpus_v5.json.\n\
    \   l. Compute: n_new_pairs, n_total_corpus_v5, model_accuracy_qwen, model_accuracy_gemma,\n\
    \      n_incorrect_pairs (these are the extractor training targets).\n   m. Build\
    \ artifact: schema='carnot.live_corpus_v3.v1',\n      n_new_pairs=<int>, n_total_corpus_v5=<int>,\n\
    \      fover_corpus_v5_path='results/fover_corpus_v5.json',\n      model_accuracy_qwen=<float>,\
    \ model_accuracy_gemma=<float>,\n      n_incorrect_pairs=<int>,\n      honest_verdict='corpus_expanded'\
    \ if n_new_pairs>=80 else 'corpus_partial'.\n   n. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n4. Write tests/python/test_experiment_615_corpus.py (100% coverage\
