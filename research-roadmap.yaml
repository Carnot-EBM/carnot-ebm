      (template_robust_under_shift / template_falls_back_gracefully / template_hurts_under_shift / blocked)
      on synthetic fixtures; NEVER hard-assert one success string against real traces; never use
      Q/R/H-number placeholder tokens. Run your own test green BEFORE finishing.
