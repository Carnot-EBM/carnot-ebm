         - __init__(self, extractor: NsvifExtractor, learning_rate: float = 0.01):
         - update_from_violation(response: str, violated_steps: list[str]) -> dict:
             For each violated step: extract token n-grams, upweight in pattern_weights dict.
             Returns {patterns_updated: int, mean_weight_delta: float}
         - update_from_coverage_miss(response: str) -> dict:
             For responses where no constraints extracted: add fallback pattern matching
             common grammatical templates missed by current patterns.
