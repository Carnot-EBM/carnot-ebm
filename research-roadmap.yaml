        preconditions_checked:
          principle: "Gate, sources, models, backends, GPU, tokenizer, checkpoint, timeout, and protection checks are explicit."
        protected_files_unchanged:
          principle: "Both protected orchestration files retain original hashes."
        inference_substrate:
          principle: "The task declares live local mandated GGUF direct-control and constrained-decoding inference through CUDA llama.cpp."
        verifier_is_oracle:
          principle: "The independent exact executor defines constrained-plan success."
        field_provenance:
          principle: "Every field binds raw candidates, intervention traces, model receipts, exact rows, and reducer code."
        duration_s:
          principle: "Monotonic duration matches the live multi-arm workload."
        tests_run:
