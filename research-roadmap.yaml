#   * exp1676 GateMate flash: shipped, 0.08% LUT, 514 MHz max clock
#   * exp1677 THRML parity v3 (n=128 Curie-Weiss, 10k samples): gate
#     passed (KL=0.0034, ks_p=0.55) BUT both Carnot AND THRML
#     systematically underestimate analytic_mean (0.6587) by ~0.04
#     (empirical means: carnot 0.6187, thrml 0.6207) — joint bias
#     worth investigating
#   * exp1678 Phase 4 active inference v3 (n=8): delta_alpha=0.150,
#     3× the 0.05 gate; first empirical validation of verifier-as-
#     free-energy hypothesis at tiny scale
# - .168 had 2 fails (gemini CLI stall): exp1675 PolarFire smoke and
#   exp1679 retro
# - .169 builds on these by: scaling Phase 4 to larger n, investigating
#   the THRML/Carnot joint bias, retrying PolarFire, AND finally
#   delivering a Phase 1 ship-track task (operator-flagged unmoved
#   blocker since exp1582; pre-stage scope-reduction-compliance says
