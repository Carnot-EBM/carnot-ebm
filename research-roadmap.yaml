    12. Set implicit_cot_energy_viable=true if calibration_auroc_delta > 0.
    13. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1401_ebm_cot_v2_hinge_only.json')); print(d.get('calibration_auroc_delta'), d.get('variance_worsened'), d.get('implicit_cot_energy_viable'), d.get('honest_verdict'))"
