- id: exp750-vitis-hls-ising-v4
  milestone: 2026.04.57
  deliverable: results/experiment_750_vitis_hls_ising_v4.json
  title: 'Exp 750: Vitis HLS Ising Sampler v4 — HLS C++ Approach (arXiv 2604.17109)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: KV260 bitfile synthesis has been blocked for 3 consecutive milestones because
    Vivado is not installed. arXiv 2604.17109 "A fully parallel densely connected probabilistic
    Ising machine with inertia for real-time applications" (April 2026) uses Vitis HLS
    (High-Level Synthesis) to generate FPGA hardware from C++ code. Vitis HLS is distributed
    SEPARATELY from full Vivado — it may be available as a standalone tool.

    This experiment:
    1. Checks if Vitis HLS is available (`vitis_hls --version`)
    2. If available: writes ising_sampler_hls.cpp and attempts synthesis
    3. If not available: writes the C++ HLS kernel as a CPU simulation (same code,
       compiled as regular C++, validated against Python sampler outputs)
    Either way: the HLS C++ kernel is a deliverable that can be synthesized by a human
    with Vitis HLS access (e.g., on a cloud instance with AMD Vitis installed).

    EXISTING CODE TO READ FIRST:
    - hardware/kv260/ising_sampler_v2.v — existing Verilog RTL (synchronous, ~50% area).
    - hardware/kv260/ising_sampler_v3_spec.md — v3 spec with inertia dynamics.
    - hardware/kv260/synth_ising.tcl — existing Vivado TCL (blocked).
    - python/carnot/samplers/parallel_ising.py — Python reference implementation.
    - results/experiment_648_parallel_ising_inertia.json — inertia dynamics baseline.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Write ising_sampler_hls.cpp using HLS C++ pattern from arXiv 2604.17109.
    Check Vitis HLS availability. Attempt synthesis if available. Validate C++ logic
    against Python sampler. Write hardware/kv260/synth_ising_hls.tcl for synthesis.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-HW-010 (Ising sampler v4 MUST be expressed in HLS C++ with loop pipelining
       pragmas; the same C++ MUST compile and run as a CPU simulation for validation),
       SCENARIO-HW-010 to openspec/capabilities/pipeline/spec.md.
    3. Write hardware/kv260/ising_sampler_hls.cpp:
       a. Follow arXiv 2604.17109 pattern: one function per computational phase.
       b. Include HLS pragmas as comments (so CPU compile ignores them):
          // #pragma HLS PIPELINE II=1
          // #pragma HLS UNROLL factor=N
          // #pragma HLS ARRAY_PARTITION variable=J complete dim=2
       c. Implement: update_spin_kernel(J, h, beta, spins, rng_state, n, num_sweeps)
          - For each sweep: randomized sequential Gibbs update (single thread for CPU)
          - Energy computation: E_i = sum_j(J[i][j] * s[j]) + h[i]
          - Flip probability: p = 1 / (1 + exp(2 * s[i] * E_i * beta))
          - Sample flip with xorshift RNG (HLS-compatible)
       d. Add v3 inertia dynamics (from ising_sampler_v3_spec.md):
          h_ema[i] = alpha * h_ema[i] + (1 - alpha) * local_field[i]
          Use h_ema in flip probability.
    4. Validate C++ against Python sampler:
       a. Compile: `g++ -O2 -std=c++17 hardware/kv260/ising_sampler_hls.cpp -o /tmp/ising_hls_test`
          (If compile fails: fix C++ syntax errors, not the algorithm.)
       b. Run with same J, h, beta, initial_spins as Python parallel_ising.py.
       c. Compare final energy between C++ and Python (should be within 5% for same config).
    5. Check Vitis HLS:
       a. Run `which vitis_hls 2>/dev/null || echo "not_found"`.
       b. If found: attempt synthesis with new TCL at hardware/kv260/synth_ising_hls.tcl.
          Record synthesis_attempted=True, synthesis_result (success/fail/time_s).
       c. If not found: record synthesis_attempted=False,
          note "Install: AMD Vitis 2024.2 provides standalone vitis_hls".
    6. Write hardware/kv260/synth_ising_hls.tcl:
       create_project ising_hls_v4 ./output/ising_hls_v4 -part xck26-sfvc784-2LV-c
       add_files hardware/kv260/ising_sampler_hls.cpp
       set_top update_spin_kernel
       open_solution "solution1" -flow_target vivado
       set_part xck26-sfvc784-2LV-c
       create_clock -period 10 -name default
       csynth_design
       export_design -format ip_catalog
    7. Create scripts/experiment_750_vitis_hls_ising_v4.py:
       a. ExperimentTemplate(750) + ExperimentTimeoutWatchdog(750, timeout_minutes=60).
       b. Implement steps 3-6.
       c. honest_verdict:
          - "hls_synthesized" if synthesis_attempted=True AND synthesis_result=success
          - "hls_kernel_ready_synthesis_pending" if C++ compiles AND validates BUT
            vitis_hls not found
          - "hls_kernel_compile_fail" if g++ compile fails
       d. artifact: hls_cpp_written (bool), cpp_compiles (bool), energy_delta_pct,
          vitis_hls_available (bool), synthesis_attempted (bool), synthesis_result,
          honest_verdict.
    8. Write tests/python/test_experiment_750_vitis_hls.py with 100% coverage:
       - test ising_sampler_hls.cpp file exists after experiment.
       - test synth_ising_hls.tcl has correct part number.
       - test honest_verdict assigned correctly based on vitis_hls availability.
       Each test traces to REQ-HW-010.
    9. Reconcile:
       - ops/status.md: update RETRO-072 KV260 section. Add "v4 HLS C++ kernel written
         and validated. Synthesis: [pending/succeeded]. Vitis HLS: [available/not found]."
         Note in research-hardware-wishlist.md: Vitis HLS install path.
       - ops/changelog.md: one-line with honest_verdict.
    10. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp751-dwave-neal-sampler-backend
  milestone: 2026.04.57
  deliverable: results/experiment_751_dwave_neal_backend.json
  title: 'Exp 751: D-Wave Neal SamplerBackend Integration — Validate Alternative Sampler'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The SamplerBackend abstraction (Exp 71) was designed for pluggable sampling
    backends: CPU (ParallelIsingSampler), FPGA (KV260, blocked), TSU (Extropic, future).
    D-Wave's dwave-ocean-sdk provides a THIRD backend option via neal.SimulatedAnnealingSampler
    — a CPU-based simulated annealing solver for QUBO/Ising problems that uses a fundamentally
    different algorithm than Gibbs sampling. This is $0 cost and pip-installable.

    D-Wave's neal uses simulated annealing (SA): starts at high temperature and gradually
    lowers it, accepting uphill moves probabilistically. This is different from Gibbs
    sampling (which always takes the conditional optimum). SA may escape local minima that
    Gibbs gets stuck in, potentially finding lower-energy configurations for dense constraint
    graphs.

    This experiment validates the SamplerBackend abstraction by adding a third concrete
    implementation and comparing solution quality and speed.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/backend.py — SamplerBackend protocol definition.
    - python/carnot/samplers/parallel_ising.py — ParallelIsingSampler (Gibbs, reference).
    - python/carnot/models/ising.py (or equivalent) — IsingEBM class.
    - results/experiment_102_ising_benchmark.json (or nearest) — CPU Gibbs baseline.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: pip install dwave-ocean-sdk. Implement DWaveNealBackend(SamplerBackend).
    Test on 20 real constraint problems from GSM8K violations. Compare vs ParallelIsingSampler.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-SAMPLE-017 (DWaveNealBackend MUST implement SamplerBackend protocol;
       MUST convert IsingEBM coupling matrix to BinaryQuadraticModel for neal submission),
       REQ-SAMPLE-018 (DWaveNealBackend MUST report final_energy and wall_time_s per call),
       SCENARIO-SAMPLE-030/031 to openspec/capabilities/pipeline/spec.md.
    3. Install dwave-ocean-sdk:
       a. Run `.venv/bin/pip install dwave-ocean-sdk` (adds neal + dimod).
       b. Verify: `python -c "import neal; print(neal.__version__)"`.
       c. If install fails: emit blocked_on_dependency with install command and STOP.
    4. Implement python/carnot/samplers/dwave_neal_backend.py:
       a. Class DWaveNealBackend(implements SamplerBackend protocol):
          - __init__(num_reads=100, num_sweeps=1000, beta_range=(0.1, 5.0)):
            Store SA hyperparameters. Instantiate neal.SimulatedAnnealingSampler.
          - to_bqm(ising_ebm: IsingEBM) -> dimod.BinaryQuadraticModel:
            Extract J matrix and h biases from IsingEBM.
            Convert to BQM (SPIN vartype).
          - sample(ising_ebm: IsingEBM) -> SampleResult:
            Call to_bqm(), then sampler.sample(bqm, num_reads=self.num_reads,
            num_sweeps=self.num_sweeps, beta_range=self.beta_range).
            Return lowest-energy sample as SampleResult(spins, energy, wall_time_s).
    5. Load 20 real constraint problems:
       a. Find stored violation events from FR11EventBus (or generate 20 GSM8K violations
          from FoVer v2). Each problem is an IsingEBM configuration (J matrix + h biases).
       b. If no stored violations: generate 20 synthetic IsingEBM instances
          (n=50 spins, random J with sparsity=0.3, random h biases).
    6. Compare DWaveNealBackend vs ParallelIsingSampler on 20 problems:
       a. For each problem: run both backends.
       b. Record: final_energy (lower is better), wall_time_s, sample_count.
       c. Compute: mean_energy_neal vs mean_energy_gibbs.
          energy_improvement_pct = (mean_energy_gibbs - mean_energy_neal) /
          abs(mean_energy_gibbs) * 100.
          (positive = neal finds lower energy = better)
    7. Create scripts/experiment_751_dwave_neal_backend.py:
       a. ExperimentTemplate(751) + ExperimentTimeoutWatchdog(751, timeout_minutes=30).
       b. Implement steps 3-6.
       c. honest_verdict:
          - "neal_better_energy" if energy_improvement_pct > 5%
          - "neal_comparable_energy" if abs(energy_improvement_pct) <= 5%
          - "neal_worse_energy" if energy_improvement_pct < -5%
          - "blocked_on_dependency" if dwave-ocean-sdk not installable
       d. artifact: mean_energy_neal, mean_energy_gibbs, energy_improvement_pct,
          wall_time_s_neal (mean), wall_time_s_gibbs (mean), n_problems, honest_verdict.
    8. Write tests/python/test_experiment_751_dwave_neal.py with 100% coverage:
       - test DWaveNealBackend.to_bqm converts J and h correctly.
       - test sample returns SampleResult with energy field.
       - test energy_improvement_pct computed correctly.
       Each test traces to REQ-SAMPLE-017/018.
    9. Reconcile:
       - ops/status.md: add "D-Wave Neal SamplerBackend integrated (Exp 751).
         Energy improvement vs Gibbs: X%. SamplerBackend abstraction validated."
         Update hardware-wishlist: mark D-Wave neal as "INTEGRATED (CPU sim)".
       - ops/changelog.md: one-line with honest_verdict.
    10. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

