        op: "=="
        value: "success"
    prompt: |
      CONTEXT: We must prove HILED works with actual SOTA model logprobs.
      EXISTING CODE TO READ FIRST: python/carnot/inference/hiled_simulator.py
      TASK: Execute live autoregressive decoding using the HILED simulator on the Gemma dense model.
      CONCRETE STEPS:
      1. Configure `unsloth/gemma-4-31B-it-GGUF` for local inference.
      2. Decode 50 sequences using HILED constraint checking.
      3. Report on latency overhead and validation rate.
      4. Save output to `{project_root}/results/experiment_1870_hiled_live.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

