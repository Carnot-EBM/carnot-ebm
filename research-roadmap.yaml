  - id: exp6433-csl-row-recomputation-safety-audit
    milestone: "2026.08.553"
    deliverable: results/experiment_6433_csl_row_recomputation_safety_audit.json
    title: "Independent V553 CSL row-recomputation and safety audit"
    priority: critical
    track: safety
    requires_gpu: false
    max_turns: 100
    estimated_wall_time_min: 180
    agent_type: claude
    model: opus
    prior_failures:
