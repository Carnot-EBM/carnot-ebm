  - id: exp2874
    milestone: "2026.05.272"
    deliverable: "results/experiment_2874_sota_runtime_clean_corrigendum_v4.json"
    title: "SOTA Runtime Clean Corrigendum v4"
    priority: critical
    agent_type: claude
    model: opus
    max_turns: 100
    estimated_wall_time_min: 120
    requires_gpu: true
    track: infrastructure
    prior_failures:
      - experiment_id: exp2862
        verdict: "success_but_adversarially_flagged: one mandated GGUF produced usable GPU-backed output, but cached_sota_pair_returned_two_loadable_specs=false and methodology was not clean enough for citation"
        addressed_by: "This attempt is a clean corrigendum requiring adversarial-clean provenance, explicit one-vs-two-model cache status, and no headline claim unless evidence is complete."
        retire_if_same_verdict: true
      - experiment_id: exp2848
        verdict: "blocked_llama_cpp_gpu_offload: precondition failed before model selection or inference; cached_sota_pair also failed to return the required two-model local SOTA pair"
        addressed_by: "Exp2862 proved at least one mandated GGUF can run; this task repeats only the clean evidence/provenance layer and keeps two-model cache status separate."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Exp 2862 proved that a mandated SOTA GGUF can produce usable GPU-backed
        output on this host, but the artifact was adversarially flagged. The
        next live-model tasks must not run until this clean corrigendum records
        a citation-grade runtime state.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - CODEX.md
        - scripts/experiment_template.py
        - python/carnot/inference/sota_models.py
        - python/carnot/reporting/sota_gguf_preflight.py
        - python/carnot/reporting/sota_runtime_cache_offload_resolver_v3.py
        - results/experiment_2862_sota_runtime_cache_offload_resolver_v3.json
        - results/experiment_2872_capstone_v271.json
        - tests/python/test_inference_sota_models.py

      TASK:
        Produce an adversarially clean SOTA runtime corrigendum. If code changes
        are needed, verify the relevant OpenSpec capability spec before editing,
        add focused tests, and keep changes scoped. Do not modify
        scripts/research_conductor.py or research-roadmap.yaml.

      MODEL_SPECS:
        Mandated headline candidates:
          - unsloth/Qwen3.6-35B-A3B-GGUF
          - unsloth/gemma-4-31B-it-GGUF
          - unsloth/gemma-4-26B-A4B-it-GGUF
        Legacy Qwen3.5-0.8B and gemma-4-E4B-it may be used only for CPU smoke
        tests and must never set sota_runtime_clean=true.

      CONCRETE STEPS:
        0. PRECONDITIONS: before any edits or inference, run CUDA torch
           availability, nvidia-smi inventory, llama_cpp import/version/origin,
           llama_supports_gpu_offload(), local cache resolution for all three
           mandated GGUF IDs, and cached_sota_pair(gpu_indices=(0,1)). If any
           required runtime precondition is missing, write a blocked artifact
           with preconditions_checked and stop.
        1. cd {project_root}
        2. Inspect Exp 2862 and identify exactly why the capstone flagged it.
        3. Re-run a bounded mandated-GGUF prompt suite with fixed seed, recorded
           prompt texts, model path, model checksum or file size/mtime fallback,
           GPU memory before/after, wall-clock timings, and output text.
        4. Distinguish clean single-model runtime readiness from two-model
           cached_sota_pair readiness. Do not require two cached models to prove
           one-model runtime, but do not claim pair readiness unless two
           mandated models are actually loadable.
        5. If resolver code changes are necessary, update tests and run them.
        6. Write the deliverable JSON. Set sota_runtime_clean=true only when at
           least one mandated SOTA GGUF generated a non-empty usable response on
           GPU with complete provenance.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: str
        - sota_runtime_clean: bool
        - sota_runtime_ready_v4: bool
        - model_specs: list
        - selected_model_hf_id: str
        - selected_model_path: str
        - selected_model_checksum_or_fingerprint: str
        - cached_sota_pair_returned_two_loadable_specs: bool
        - llama_cpp_gpu_offload_verified: bool
        - preconditions_checked: list
        - prompt_suite: list
        - usable_response_count: int
        - nonempty_response_count: int
        - total_tokens_generated: int
        - tokens_per_second: float
        - gpu_memory_evidence: dict
        - legacy_small_models_used_only_for_smoke: bool
        - random_seed: int
        - reproducibility_checksum: str
        - tests_run: list
        - field_principles: dict
        - run_date: "{date}"
        - duration_s: float

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

