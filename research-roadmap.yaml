    6. Reconcile: ops/conductor-log.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp616-llm-as-extractor-v1
  milestone: 2026.04.47
  deliverable: results/experiment_616_llm_extractor_v1.json
  title: 'Exp 616: LLMAsExtractorV1 — Qwen3.5-0.8B as Extraction LLM (RETRO-070 CRITICAL FIX)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-070 CRITICAL.\
    \ Fourteen consecutive VR attempts at 0% improvement. CoACEV1 through V4 all\
    \ used pattern matching / regex / eval()-chaining. All achieved live recall=4%.\
    \ The root cause is confirmed: hand-engineered patterns cannot match the natural\
    \ language phrasing of instruction-tuned models. Goal #1b from research-program.md:\
    \ use a SECOND LLM CALL to extract verifiable claims. This experiment implements\
    \ LLMAsExtractorV1 with THREE extraction strategies and selects the best-recall\
    \ one. Referenced papers: arXiv 2510.25975 (SymCode — code generation for\
    \ verification), arXiv 2601.04675 (AquaForte — LLM-guided constraint instantiation).\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/extraction/coace_extractor_v4.py\
    \ — CoACEExtractorV4 (examine ALL patterns — these are the ones that fail)\n-\
    \ results/live_pairs_578.json — 100 live pairs (READ ALL is_correct=False responses\
    \ carefully — catalog how IT models express arithmetic errors in natural language)\n\
    - results/fover_corpus_v5.json (or v4 if v5 not yet available) — live corpus\n\
    - results/experiment_603_coace_v4_live.json — v4_recall=0.04, error_type_catalog\n\
    - python/carnot/extraction/__init__.py — add LLMAsExtractorV1 export\n- python/carnot/pipeline/env_autofix.py\
    \ — apply_env_autofix()\n\nTASK: Implement LLMAsExtractorV1 with three strategies,\
    \ benchmark all on 25 live incorrect responses.\n1. Read CLAUDE.md spec-first\
    \ workflow.\n2. READ results/live_pairs_578.json FULLY. For every is_correct=False\
    \ entry, read the response text and catalog:\n   - What arithmetic error type\
    \ does the model make?\n   - How does the model PHRASE the arithmetic (\"we add\
    \ X and Y to get Z\", \"X + Y = Z\", \"X plus Y equals Z\", etc.)?\n   - Could\
    \ eval() detect it? Could a code generation approach detect it?\n   This analysis\
    \ determines which strategy will work. Do NOT skip this step.\n3. Add REQ-EXTRACT-050\
    \ (LLMAsExtractorV1: use LLM call to extract arithmetic claims from CoT, NOT\
    \ regex), REQ-EXTRACT-051 (SymCode strategy: generate executable Python from\
    \ CoT step), REQ-EXTRACT-052 (JSON claim strategy: prompt LLM to emit JSON claim\
    \ array), SCENARIO-EXTRACT-085/086/087/088/089 to\
    \ openspec/capabilities/verifiable-reasoning/spec.md.\n4. Create python/carnot/extraction/llm_extractor_v1.py:\n\
    \   a. ArithmeticClaim dataclass: lhs_expr (str), rhs_value (float | None),\n\
    \      claim_text (str), strategy (str), confidence (float).\n   b. safe_eval(expr:\
    \ str) -> float | None:\n      - Allowed: +, -, *, /, **, %. No builtins, no\
    \ imports.\n      - Returns None on error.\n   c. Strategy 1 — JsonClaimExtractor:\n\
    \      PROMPT = '''You are an arithmetic verifier. Read this math reasoning step.\n\
    List every arithmetic calculation stated as a JSON array.\nFor each: {\"lhs\":\
    \ \"expression_to_evaluate\", \"rhs\": stated_numeric_result, \"text\": \"verbatim_excerpt\"\
    }.\nIf no calculations: output []. Output ONLY valid JSON, no prose.\nStep: {step}'''\n\
    \      extract_claims(step: str, llm_caller: callable) -> list[ArithmeticClaim]:\n\
    \        Call llm_caller(PROMPT.format(step=step)), parse JSON, for each: verify\n\
    \        via safe_eval(claim.lhs_expr) != claim.rhs_value. Flag mismatch as violation.\n\
    \   d. Strategy 2 — SymCodeExtractor (arXiv 2510.25975):\n      PROMPT = '''Write\
    \ a single-line Python expression that computes the answer claimed in this math\
    \ step. Output ONLY executable Python (no assignment, no print). If unclear: output\
    \ None. Step: {step}'''\n      extract_claims(step: str, llm_caller: callable)\
    \ -> list[ArithmeticClaim]:\n        Call llm_caller(PROMPT.format(step=step)),\
    \ exec result via safe_eval().\n        Compare computed value to any numeric\
    \ answer stated in the step. Flag mismatch.\n   e. Strategy 3 — StepSegmentEvalChain:\n\
    \      No LLM call. Sentence-segment the CoT, apply eval() to numeric expressions\
    \      in each sentence. (This is the CoACEV4 approach — include as baseline.)\n\
    \   f. LLMAsExtractorV1 class:\n      __init__(self, llm_caller: callable | None\
    \ = None):\n        If llm_caller is None (CI mode): use StepSegmentEvalChain\
    \ only.\n        If llm_caller provided: test all three strategies on a single\
    \ example;\n        select highest-recall strategy as self._best_strategy.\n  \
    \    extract(self, response: str) -> list[ArithmeticClaim]:\n        Run self._best_strategy.extract_claims().\n\
    \        If llm_caller and both LLM strategies available: run all three, union\
    \ results, dedup by (lhs_expr, rhs_value).\n   g. Export LLMAsExtractorV1, ArithmeticClaim,\
    \ JsonClaimExtractor, SymCodeExtractor from carnot.extraction.__init__.\n5. Write\
    \ scripts/experiment_616_llm_extractor_v1.py:\n   a. apply_env_autofix() FIRST.\n\
    \   b. from python.carnot.pipeline.live_assertion import assert_live_or_ci_skip;\
    \ assert_live_or_ci_skip().\n   c. ExperimentTimeoutWatchdog(616, timeout_minutes=40).\n\
    \   d. ExperimentTemplate(616, 'LLMAsExtractorV1',\n      'results/experiment_616_llm_extractor_v1.json',\
    \ requires_gpu=False).\n   e. Load 25 incorrect + 10 correct live responses from\
    \ results/live_pairs_578.json or results/fover_corpus_v5.json.\n   f. llm_caller:\
    \ if CARNOT_FORCE_LIVE=1 and transformers importable: use\n      transformers.pipeline('text-generation',\
    \ 'Qwen/Qwen3.5-0.8B', device='cpu',\n      max_new_tokens=200). Else: llm_caller=None\
    \ (CI stub, StepSegmentEvalChain only).\n   g. Run ALL THREE strategies on each\
    \ incorrect response:\n      json_tp, symcode_tp, chain_tp = 0, 0, 0\n      For\
    \ each incorrect response:\n        json_violations = JsonClaimExtractor.extract_claims(response,\
    \ llm_caller)\n        symcode_violations = SymCodeExtractor.extract_claims(response,\
    \ llm_caller)\n        chain_violations = StepSegmentEvalChain.extract_claims(response)\n\
    \        json_tp += 1 if json_violations else 0\n        symcode_tp += 1 if symcode_violations\
    \ else 0\n        chain_tp += 1 if chain_violations else 0\n   h. Run all three\
    \ strategies on 10 correct responses (FP count for each).\n   i. Compute per-strategy:\
    \ recall = tp/25, fp_rate = fp/10.\n      best_strategy = argmax recall. v4_baseline_recall\
    \ = chain_tp/25 (CoACEV4 equivalent).\n      v1_recall = best recall across all\
    \ three strategies. recall_improvement = v1_recall - 0.04.\n   j. gate_open =\
    \ v1_recall >= 0.20.\n   k. error_type_catalog: dict of (error_type: count) from\
    \ step 2 analysis.\n   l. Build artifact: schema='carnot.llm_extractor_v1.v1',\n\
    \      n_responses=25, llm_mode=<str>,\n      json_strategy_recall=<float>, json_strategy_fp_rate=<float>,\n\
    \      symcode_strategy_recall=<float>, symcode_strategy_fp_rate=<float>,\n   \
    \   chain_strategy_recall=<float>, chain_strategy_fp_rate=<float>,\n      v4_baseline_recall=<float>,\
    \ v1_recall=<float>, recall_improvement=<float>,\n      best_strategy=<str>,\
    \ gate_open=<bool>,\n      error_type_catalog=<dict>,\n      retro_070_partial=(v1_recall\
    \ > 0.04),\n      retro_070_resolved=(v1_recall >= 0.20),\n      honest_verdict='llm_extractor_breakthrough'\
    \ if v1_recall>=0.20\n        else 'llm_extractor_improved' if v1_recall>0.04\n\
    \        else 'no_improvement_architecture_review_needed'.\n   m. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n6. Write tests/python/test_llm_extractor_v1.py (100% coverage\
    \ on llm_extractor_v1.py including all three strategy classes and safe_eval).\n\
    7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n8. Reconcile: _bmad/traceability.md\
    \ (RETRO-070 resolution attempt), ops/conductor-log.md, ops/changelog.md.\nRun:\
    \ JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"

- id: exp617-extractor-diagnostic-v5
  milestone: 2026.04.47
  deliverable: results/experiment_617_extractor_diagnostic_v5.json
  title: 'Exp 617: Live Extractor Diagnostic v5 — Gate Check for VR Attempt #15'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Exp 616 implemented\
    \ LLMAsExtractorV1 with three extraction strategies. This experiment runs the\
    \ best-strategy extractor on the full diagnostic set and computes the gate_open\
    \ flag. gate_open = recall >= 0.20 is REQUIRED before Exp 620 (VR attempt #15)\
    \ can be scheduled. Also run TRUST Agents (arXiv 2604.12184) three-agent approach\
    \ as an alternative extractor candidate.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/extraction/llm_extractor_v1.py\
    \ — LLMAsExtractorV1, best_strategy from Exp 616\n- results/experiment_616_llm_extractor_v1.json\
    \ — v1_recall, best_strategy, gate_open from Exp 616\n- results/live_pairs_578.json\
    \ or results/fover_corpus_v5.json — live corpus\n- results/experiment_605_extractor_diagnostic_v4.json\
    \ — prior diagnostic (gate_open=False)\n\nTASK: Run best LLMAsExtractorV1 on\
    \ extended diagnostic set + compute gate.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-EXTRACT-053 (diagnostic gate: gate_open requires recall >= 0.20 on\
    \ 25 known-incorrect responses), SCENARIO-EXTRACT-090/091 to\
    \ openspec/capabilities/verifiable-reasoning/spec.md.\n3. Implement python/carnot/extraction/trust_agents_extractor.py:\n\
    \   a. TrustAgentsExtractor class (arXiv 2604.12184 multi-agent claim extraction):\n\
    \      - Agent1NER(response: str, llm_caller) -> list[str]: prompt 'List all\
    \ numeric values in this text as JSON array of strings.' Return list of numeric\
    \ entity strings.\n      - Agent2ClaimFormer(entities: list[str], response: str,\
    \ llm_caller) -> list[dict]:\n        prompt 'Given these numbers {entities},\
    \ find arithmetic relationships in this text.\n        Output JSON: [{\"lhs\":\
    \ \"expr\", \"rhs\": value, \"text\": \"excerpt\"}].' \n      - Agent3Verifier(claims:\
    \ list[dict]) -> list[ArithmeticClaim]: eval() each claim.\n      - extract(self,\
    \ response: str) -> list[ArithmeticClaim]: run Agent1 → Agent2 → Agent3.\n  \
    \    - CI stub: if llm_caller is None, return [] (no-op in CI).\n   b. Export\
    \ TrustAgentsExtractor from carnot.extraction.__init__.\n4. Write scripts/experiment_617_extractor_diagnostic_v5.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. from python.carnot.pipeline.live_assertion\
    \ import assert_live_or_ci_skip; assert_live_or_ci_skip().\n   c. ExperimentTimeoutWatchdog(617,\
    \ timeout_minutes=30).\n   d. ExperimentTemplate(617, 'Extractor Diagnostic v5',\n\
    \      'results/experiment_617_extractor_diagnostic_v5.json', requires_gpu=False).\n\
    \   e. Load 25 incorrect + 10 correct from live corpus. llm_caller setup same\
    \ as Exp 616.\n   f. Run LLMAsExtractorV1 (best strategy from Exp 616) on all\
    \ 35 responses.\n      Compute: v1_recall (on 25 incorrect), v1_fp_rate (on 10\
    \ correct).\n   g. Run TrustAgentsExtractor on same 35 responses.\n      Compute:\
    \ trust_recall, trust_fp_rate.\n   h. best_recall = max(v1_recall, trust_recall).\n\
    \      best_extractor = 'llm_v1' if v1_recall >= trust_recall else 'trust_agents'.\n\
    \      gate_open = best_recall >= 0.20.\n   i. Build artifact: schema='carnot.extractor_diagnostic_v5.v1',\n\
    \      n_tested=25, v1_recall=<float>, v1_fp_rate=<float>,\n      trust_recall=<float>,\
    \ trust_fp_rate=<float>,\n      best_recall=<float>, best_extractor=<str>,\n \
    \     gate_open=<bool>,\n      gate_note='Exp 620 GATED — do not schedule without\
    \ gate_open=True' if not gate_open\n               else 'Exp 620 UNBLOCKED —\
    \ schedule VR attempt #15',\n      honest_verdict='gate_open_vr_unblocked' if\
    \ gate_open else 'gate_closed_do_not_retry'.\n   j. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_trust_agents_extractor.py (100%\
    \ coverage on trust_agents_extractor.py).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n7. Reconcile: ops/conductor-log.md (gate decision),\
    \ ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp618-jepa-v13-capo-calibrated
  milestone: 2026.04.47
  deliverable: results/experiment_618_jepa_v13_capo.json
  title: 'Exp 618: JEPA v13 CAPO Calibrated Retrain — Prevent Overfit, Maintain OOD (arXiv 2604.12632)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: JEPA v12\
    \ OOD generalization was confirmed in Exp 607 (fr11_generalization_confirmed=True)\
    \ but with OOD AUC=1.0 on only 20 pairs — suspicious overfit. The model outputs\
    \ extreme confidence scores (near 0 or 1) rather than calibrated probabilities.\
    \ This experiment applies CAPO calibration loss (arXiv 2604.12632: jointly optimize\
    \ accuracy and calibration during training) alongside the existing CPMI contrastive\
    \ margin loss. Train on fover_corpus_v5.json (300+ live pairs). Target: OOD AUC\
    \ >= 0.75 WITH ECE < 0.10 (calibrated, not just discriminative).\n\nEXISTING\
    \ CODE TO READ FIRST:\n- python/carnot/inference/ — EORMModel, JEPAPredictor\
    \ (find the JEPA training code)\n- results/experiment_607_jepa_v12_ood.json —\
    \ v12 OOD AUC, training details\n- results/fover_corpus_v5.json (or v4) — live\
    \ corpus with labels\n- results/experiment_593_jepa_v12_retrain.json or similar\
    \ — v12 training config\n- python/carnot/training/ — training loops, find JEPA\
    \ training implementation\n\nTASK: Retrain JEPA v13 with CAPO calibration loss.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-VERIFY-120 (JEPA v13: OOD\
    \ AUC >= 0.75), REQ-VERIFY-121 (JEPA v13: ECE < 0.10 calibration constraint),\
