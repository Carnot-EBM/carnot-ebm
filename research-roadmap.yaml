- id: exp817-multi-agent-arbiter-mcp
  milestone: 2026.04.62
  deliverable: results/experiment_817_multi_agent_arbiter.json
  title: 'Exp 817: Multi-Agent Arbiter MCP Tool — Energy-Ranked Agent Output Selection (Tier B Product)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: research-program.md Tier B product "Multi-Agent Arbiter": score competing agent
    outputs, pick lowest energy as the final answer. Growing agent market; every multi-agent
    system needs arbitration. Energy is a natural arbitration signal — the most constraint-
    consistent output has lowest energy. This experiment implements the MCP tool
    score_agent_outputs and tests it on a synthetic 3-agent math debate scenario.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.verify() (energy scoring)
    - python/carnot/mcp/ (or similar MCP server location) — existing MCP tools
    - python/carnot/pipeline/ising_constraint_injector.py — IsingConstraintInjector (Exp 812)
    - openspec/capabilities/verifiable-reasoning/spec.md — REQ-VERIFY and REQ-AGENT entries

    TASK: Implement score_agent_outputs MCP tool, test on 3-agent synthetic scenario.
    Write results/experiment_817_multi_agent_arbiter.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/verifiable-reasoning/spec.md:
       - REQ-AGENT-003: score_agent_outputs(responses: list[str]) MUST return a ranked list
         of agent responses sorted by ascending EBM energy (lowest energy = most valid first).
       - REQ-AGENT-004: The arbiter MUST return the winner_index (index in original list),
         winner_energy (energy score), and rank (full ranking with energies).
       - SCENARIO-AGENT-004: 3 agents respond to "47 + 28 = ?". Agent A: "75", Agent B: "76",
         Agent C: "77". Arbiter correctly identifies Agent A (energy_A < energy_B < energy_C).
    3. Implement python/carnot/pipeline/multi_agent_arbiter.py:
       a. AgentScore dataclass: (agent_index, response, energy, rank)
       b. ArbiterResult dataclass:
          (n_agents, winner_index, winner_response, winner_energy, all_scores: list[AgentScore],
           inference_mode, honest_verdict)
       c. MultiAgentArbiter:
          - __init__(pipeline: VerifyRepairPipeline):
            self._pipeline = pipeline
          - score_response(response: str) -> float:
            result = self._pipeline.verify(response)
            return result.energy  # energy from IsingEBM
          - rank_agents(responses: list[str]) -> ArbiterResult:
            scores = [(i, r, self.score_response(r)) for i, r in enumerate(responses)]
            sorted_scores = sorted(scores, key=lambda x: x[2])  # ascending energy
            all_scores = [AgentScore(i, r, e, rank+1) for rank, (i, r, e) in enumerate(sorted_scores)]
            winner_index, winner_response, winner_energy = sorted_scores[0]
            return ArbiterResult(...)
       d. Export MultiAgentArbiter, ArbiterResult, AgentScore from carnot.pipeline.__init__
       e. Wire as MCP tool: add score_agent_outputs to the MCP server:
          @mcp_server.tool("score_agent_outputs")
          def score_agent_outputs(responses: list[str]) -> dict:
              arbiter = MultiAgentArbiter(VerifyRepairPipeline())
              result = arbiter.rank_agents(responses)
              return result.to_dict()
    4. Create scripts/experiment_817_multi_agent_arbiter.py:
       a. ExperimentTemplate(817) + ExperimentTimeoutWatchdog(817, timeout_minutes=30).
       b. apply_env_autofix() FIRST.
       c. Run synthetic 3-agent debate:
          Scenario: "What is 47 + 28?"
          Agent A: "47 + 28 = 75" (correct)
          Agent B: "47 + 28 = 76" (wrong by 1)
          Agent C: "47 + 28 = 70" (wrong by 5)
          Expected: energy_A < energy_B < energy_C → winner_index=0 → arbiter_correct=True
       d. Run 5 more synthetic scenarios to validate consistency.
       e. Compute arbiter_accuracy = fraction of scenarios where winner is correct.
       f. honest_verdict:
          - "arbiter_correct" if arbiter_accuracy >= 0.80
          - "arbiter_partial" if arbiter_accuracy in [0.60, 0.80)
          - "arbiter_incorrect" if arbiter_accuracy < 0.60
    5. Write tests with 100% coverage:
       - test rank_agents returns winner with lowest energy
       - test AgentScore rank field assigned correctly
       - test ArbiterResult to_dict() contains all required fields
       Each test traces to REQ-AGENT-003/004.
    6. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict and arbiter_accuracy.
       - _bmad/traceability.md: add Multi-Agent Arbiter as Tier B product shipped.
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
