milestone: 2026.06.386
milestone_title: "Conductor STANDS DOWN on TRM training (outer-loop owns the contiguous run); MONITOR + DEFENSIVE graft only"
milestone_doc: |
  Operator directive 2026-06-13 (decision "A"): the TRM Sudoku-Extreme baseline training is OWNED
  BY THE OUTER-LOOP, which runs ONE detached contiguous job (results/trm_runs/contiguous_run.log,
  PID in results/trm_runs/contiguous_run.pid) resuming from the stable checkpoint
  (results/trm_runs/sudoku_extreme_baseline/last.ckpt) toward ~0.87. The conductor's bounded-task
  model structurally CANNOT do this (80-min wall-cap; the .383/.384/.385 bounded passes all no-op'd
  on the cumulative-max_time bug) AND the conductor's own continuation tasks COLLIDED with the
  outer-loop run (.385 exp4157 shared the checkpoint/GPU/paths and killed net progress). So .386
  CEDES TRM training to the outer-loop.

  HARD COORDINATION RULE (every .386 task MUST obey): NO conductor task may launch TRM training,
  run `pkill`/`kill` against `train.py`, or WRITE the stable checkpoint dir
  (results/trm_runs/sudoku_extreme_baseline/). Training-related tasks are READ-ONLY: they read the
  checkpoint val + the contiguous_run.log + the train PID, and report. This prevents the .385
  collision from recurring.

  The decisive verifier graft is DEFENSIVE and gated on BOTH (val >= 0.85) AND (the outer-loop train
  process is NO LONGER running) — so it never reads a checkpoint that is being written. The
  outer-loop will stop its run when val converges (~0.87), making the checkpoint stable for the graft.

  NOTE: nano-trm/src/nn/models/trm.py was locally edited (mode="default" not "reduce-overhead") to
  fix the CUDAGraphs-overwrite crash; this is a local fix to the gitignored vendored clone.

