tasks:
- id: exp7343-contract
  title: Bind V645 literature and the fourteen-task execution contract
  phase: 1
  track: reporting
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.645
  deliverable: results/experiment_7343_v645_contract.json
  model: opus
  prior_failures:
  - experiment_id: exp7329-contract
    verdict: complete_disqualified_v644_contract_mismatched_or_invalid
    addressed_by: The new plan includes complete prior-failure metadata, checked existing spec paths, and one V645
      contract. Run all planner linters before execution; do not reuse V644 fixed constants.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V644 completed fourteen dispositions, but its contract failed prior-failure coverage and a prompt-path check. Bind the actual next plan and ingest the dated research delta. This receipt is advisory; no science task depends on it.
    Work at {project_root}. Execution date {date}. Milestone 2026.09.645, phase 1.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/python/carnot/experiment_7329_v644_contract.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/validate_prior_failures.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_consumer_checks.py
    - {project_root}/scripts/conductor_gates.py
    - {project_root}/research-studying.md
    - {project_root}/results/experiment_7329_v644_contract.json

    TASK:
    Produce results/experiment_7343_v645_contract.json. Create scripts/experiments/experiment_7343_v645_contract.py as a thin executable entrypoint. Add reusable behavior in python/carnot/experiment_7343_v645_contract.py only where needed. Use tests/python/test_experiment_7343_v645_contract.py for new meaningful tests. Reuse existing production code; do not copy a prior experiment's complete launcher.
    SAME-MILESTONE INPUTS (future outputs, read only after their tasks finish):
    None. Historical files are diagnostic evidence only.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print and flush immediately. Check exact input paths and prerequisite fields before dependent work. Reject missing, quarantined, disqualified, blocked or partial producers. For external absence write a terminal blocked_* artifact with gate_check_summary and stop dependent work. Verify a named existing capability contains the driving REQ-*; add specific requirements and meaningful failing tests before any implementation. Put scratch work in /tmp. Do not write a success-shaped placeholder.
    1. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER any model load, generation, benchmark or subprocess that can take minutes. Inside EVERY long loop print completed units and monotonic elapsed at least every 60 seconds. Stream subprocess output unbuffered. During blocking calls emit a truthful pending-operation heartbeat every 60 seconds. Keep every silence gap under 600 seconds, including authoring and validation. A silent task can die at 1200 seconds; steady progress permits the 4800-second cap. Checkpoint completed work. Never pad elapsed time.
    2. No current LLM work: MODEL_SPECS=[], model_invoked=false and zero invocation counts. Declare inference_substrate=aggregation_from_upstream_artifacts, inference_substrate_class=aggregation, execution_venue=host. Keep historical and scripted model-shaped evidence in labeled hash-bound sidecars. Declare the actual substrate if actual work changes.
    3. Select research-roadmap-next.yaml only if milestone equals 2026.09.645; otherwise select matching research-roadmap.yaml. Hash-copy that YAML and the new Markdown contract before reading results. Require exactly fourteen tasks exp7343 through exp7356 in their declared order. Compare IDs, titles, phases, deliverables, substrate classes and all structured gates. Do not activate or archive a roadmap.
    4. Reuse the shipped independent Markdown and YAML parsers. Avoid old evaluate_contract functions with fixed milestone constants. Exercise missing task, reordered ID, stale milestone, changed path/title/phase, misspelled gate field and malformed operator mutations. Each mutation must fail. Principle: two files must describe the same executable work.
    5. Exercise scripts/conductor_gates.py in a private temporary result tree. For every edge test passing evidence, zero score, missing producer, missing field, missing class, disqualified score-one and quarantined score-one. Confirm each field occurs verbatim in its producer REQUIRED ARTIFACT FIELDS. Principle: stale or unusable evidence must never authorize downstream work.
    6. Read the V645 research-references.md section. Make a bounded primary-source refresh of 2609.12267, 2604.13283, 2607.20792 and 2607.29549. Map methods to Exp7351, Exp7349 and Exp7354. Preserve HTTP 429 and browser-challenge outcomes. Record neural-oracle and shared-executor limitations. Mark the mapping ingested in research-studying.md. Do not use a broad agent fan-out.
    7. Run schema, prior-failure, gate, exclusion, prompt-path, ARC-generalization and overdue-priority linters on the selected YAML. Require zero hard violations before contract_complete_score=1. Record a source access failure separately from contract validity. E2E: real selected files through both parsers and actual gate reader into terminal JSON.
    8. Use the shipped Exp7303 scoped validation runner with explicit test files and changed modules. Create all parents of each private --basetemp before launch. Require worktree imports; pytest -n 0 -o addopts= --no-cov; separate 100% changed-module coverage; scoped Ruff check/format; changed-module mypy; and scripts/check_spec_coverage.py on the exact affected tests. Run focused Rust test/fmt/clippy only for affected Rust changes. Never invoke an old main() that launches a full suite. Do not weaken tests or erase repository-health failures. Unchanged pure reducers reuse existing tests.
    9. Run the declared entrypoint end to end and the applicable ops/e2e-test-plan.md checks named above. Reload the candidate and independently reduce raw rows. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict. Preserve failed checks. Zero readiness/value/promotion on blocked or disqualified evidence; disposition-complete scores are accounting only. Write the terminal deliverable atomically. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Keep research-roadmap.yaml, production defaults, historical determinations and publication surfaces unchanged.

    10. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Version the record and retain ordinary top-level experiment_id and milestone."
       - status: principle: "Write a terminal result only after actual work and affected checks."
       - run_date: principle: "Use {date}; record real UTC timestamps as well."
       - preconditions_checked: principle: "Record each actual input/resource check before dependent work."
       - MODEL_SPECS: principle: "List actual intended model identities; LLM tasks include unsloth/Qwen3.8-27B-GGUF."
       - model_invoked: principle: "True for any attempted current model load or generation, including failures."
       - invocation_counts: principle: "Separate attempted, completed, failed, cancelled and in-flight operations."
       - inference_substrate: principle: "Declare actual computation; historical model receipts are not current inference."
       - inference_substrate_class: principle: "Use the closed duration class matching the actual run."
       - execution_venue: principle: "Use host; this milestone makes no new board-execution claim."
       - duration_s: principle: "Measure monotonic time; never wait merely to pass a duration floor."
       - phase_spans: principle: "Measure disjoint load, generation, evaluation, test and write spans."
       - random_seed: principle: "Freeze development, evaluation and resampling seeds before outcomes."
       - reproducibility_checksum: principle: "Bind code, settings, inputs, evaluator identity and raw evidence."
       - source_artifact_hashes: principle: "Authenticate exact producers and current same-milestone paths."
       - rows: principle: "Keep every comparative unit, arm, metric, cost, failure and censoring disposition."
       - sample_size_budget: principle: "Record planned, attempted, completed and censored units and stopping rules."
       - acceptance_gate_results: principle: "Each gate records expected, observed, passed and its principle."
       - gate_check_summary: principle: "Every blocked_* names upstream, failed check, exact artifact field, expected and observed value."
       - verifier_is_oracle: principle: "True when the executor defines correctness; separate code does not remove circularity."
       - honest_verdict: principle: "Completed work starts complete_ or complete:; external absence starts blocked_ with its failed check."
       - verdict_class: principle: "Closed enum: positive | circular_positive | null | blocked | disqualified | partial. Only unfinished own work is partial."
       - flagged_adversarial: principle: "Set false only after current verification; a critical finding sets true and prevents promotion."
       - validation_receipts: principle: "Retain exact command, scope, exit code, elapsed time and log hash, including failures."
       - repository_health: principle: "Preserve dated unrelated failures separately from affected required validation."
       - field_principles: principle: "Explain fields separately; do not wrap numeric gates or ordinary dictionaries."
       - contract_complete_score: principle: "One means exact file parity and passing contract controls, not scientific value."
       - source_method_map: principle: "Bind each paper assumption to a named task and primary URL."
       - contract_rows: principle: "Preserve all fourteen independently parsed task rows."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7343_v645_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
