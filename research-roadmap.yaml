- id: exp409-crane-extraction-gate
  milestone: 2026.06.17
  deliverable: python/carnot/pipeline/crane_extractor.py
  title: 'Exp 409: CRANE extraction gate — 1x-cost prompt-side constrained extraction (purge corrupt file)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
