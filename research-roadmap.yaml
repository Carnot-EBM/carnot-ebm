- id: exp4903-a1
  title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; HEADLINE) -- STOP PREDICTING change-VALUE; READ IT FROM THE ENV. A
    change-LOCATION-pruned, REAL-ENV-VALUE-GROUNDED interleaved act-and-observe search on A1''s exact held-out
    games. .451 proved change-VALUE prediction is REPRESENTATION-INVARIANT (3 classes) but change-LOCATION is
    learnable (cell_recall 0.727). A1 demotes the model from state-predictor to action-PRIOR: per state, the
    change-LOCATION model ranks WHICH legal actions change something meaningful, the agent EXECUTES the top-k in
    the REAL env (reset-replay) to read the TRUE next state (change-VALUE for free, never predicted), the
    learned verifier scores progress to the .437-quality goal, best-first. Measures BOTH north-star axes:
    ACCURACY (NEVER_ENUMERATED -> COVERED migration / first-win vs 0.04) and EFFICIENCY (actions-to-first-win).
    The decisive swing + fork that redirects .453.'
  priority: critical
  track: arc-north-star
  max_turns: 200
  inference_substrate: live_llm_inference
  deliverable: results/experiment_4903_env_grounded_location_pruned_search.json
  operator_override: '2026-06-27 operator GPU-allocation directive + 2026-06-19 ARC sprint (standing): A1
    attacks the live first-win wall with a STRUCTURALLY-NEW class (env-grounded interleaved search, model as
    action-prior), NOT another value-prediction representation -- the honest non-churn response to the .451
    representation-invariant escalation. Reserved ARC headline slot; offline induction runs on the conductor''s
    GPU-0 generator (NOT iGPU-pinned). False-positive scope-match vs the .451 A1 representation probe.'
  prior_failures:
  - experiment_id: exp4892-decision-need-targets-value-gap
    verdict: 'complete_decision_need_no_value_lift_VALUE_GAP_REPRESENTATION_INVARIANT (a non-code decision-need
      target representation did not predict change-VALUE; delta -0.10, migration 0)'
    addressed_by: 'A1 does NOT propose another representation that PREDICTS change-VALUE offline (3 classes
      already nulled, representation-invariant). It ABANDONS offline value prediction entirely: it reads
      change-VALUE from the REAL ENV at every search step (interleaved act-and-observe) and uses the induced
      model ONLY for the change-LOCATION signal that provably works (cell_recall 0.727) as an action-expansion
      prior. retire_if_same_verdict: true -- if location-pruned env-grounded search ALSO fails to migrate any
      NEVER_ENUMERATED game to COVERED (first-win delta CI95 includes 0, positive control non-degenerate), the
      wall is deeper than value-prediction and A1b takes the last representation swing.'
    retire_if_same_verdict: true
  - experiment_id: exp4882-ttt-dynamics-value-gap
    verdict: 'complete_ttt_dynamics_no_value_lift_INDUCER_CEILING_HARD (TTA on the executable-code engine did
      not move change-VALUE accuracy)'
    addressed_by: 'A1 is not TTA on the code engine and does not adapt or re-induce any engine to predict
      change-VALUE. The model is used only as a change-LOCATION action-prior; the env supplies change-VALUE.
      retire_if_same_verdict: true (shared gate with the row above).'
    retire_if_same_verdict: true
  prompt: |
    CONTEXT ({date}). HEADLINE. The L1-first-contact generation wall is NEVER_ENUMERATED dominant (the winning
    multi-step prefix is never assembled; generic first-win ~0.04 = 1/25). .451 settled WHY the OFFLINE route
    is bounded: across THREE world-model representations (executable-code, decision-need-targets,
    action-prefix-latents) the induced model predicts change-LOCATION (engine_cell_recall_median=0.727) but NOT
    change-VALUE -- REPRESENTATION-INVARIANT, and the capstone escalated to the operator. .452 stops proposing
    representation #4 and exploits the ASYMMETRY: change-LOCATION works, change-VALUE does not, and ARC-AGI-3 is
    INTERACTIVE so the REAL ENV supplies the true change-VALUE for free.

    THE METHOD (interleaved act-and-observe; NOT plan_in_model plan-then-validate). plan_in_model already
    executes in the real env and halts on divergence -- but it PLANS the full prefix IN THE MODEL FIRST
    (value-prediction-dependent), so when the model mispredicts change-VALUE the plan is already wrong before
    the env sees it (immediate divergence, zero progress). A1 INTERLEAVES instead. Per real observed state s:
      1. The change-LOCATION model (the induced engine, used ONLY for WHERE-cells-change saliency -- the 0.727
         signal) RANKS the legal actions by predicted-change saliency. It NEVER predicts the resulting VALUES.
      2. EXECUTE the top-k ranked actions in the REAL env (reset-replay in the offline dev twin) -> read the
         TRUE next state s' (real change-VALUE, no prediction).
      3. Score progress toward the .437-quality goal predicate via the LEARNED VERIFIER (oracle-distinct).
      4. Best-first expand the most promising real s'. Repeat under an ACTION budget.
    The model is the action-PRUNER; the env is the value ORACLE; the verifier is the progress score. This fixes
    the .432 "proposal distribution misses the winning prefix" wall (the prior is now the one signal that
    works) AND sidesteps the representation-invariant change-VALUE wall (values are read, never predicted).

    THE GPU FIX (load-bearing -- 2026-06-27 operator GPU-allocation directive). Offline induction must NOT
    iGPU-pin or hard-reject CUDA_VISIBLE_DEVICES. Accept the conductor's GPU-0 CUDA llama-server
    (CUDA_VISIBLE_DEVICES=0, CARNOT_ARC_GENERATOR_CUDA_GPU=0, card >=13GB free -- both 3090s idle) OR the iGPU
    HIP server; health-check via _ensure_server(). REUSE exp4892's generator_available() precondition.

    THE HELD-OUT GAMES + POSITIVE CONTROL (reuse exp4892/exp4882 EXACTLY for a fair comparison). Held-out games:
    cd82, cn04, ls20, m0r0, r11l, sk48, sp80, su15, wa30; tu93 positive control; A1's held-out split. The
    change-LOCATION ranker must be NON-DEGENERATE on tu93 (it ranks the truly-changing action highly).

    THE INTERVENTION (Phase-Prototype+Validation -- baseline then intervention then positive control):
      1. BASELINE: the current live path's first-win on the held-out games (the ~0.04 generic agent /
         plan_in_model plan-then-validate). Read from exp4896/exp4886 readiness or re-measure with the same harness.
      2. INTERVENTION: the change-LOCATION-pruned, real-env-value-grounded interleaved search. For each held-out
         game run it under a fixed ACTION budget; record (first-win reached?, actions-to-first-win, states_expanded).
      3. PRIMARY METRIC (ACCURACY): per-game and median first-win-rate DELTA (env-grounded search - baseline)
         with bootstrap CI95. EMIT BARE value_grounded_first_win_delta_median (A1b's gated_on reads it raw).
      4. SECONDARY METRIC (EFFICIENCY): median actions-to-first-win on the games it solves (the env-grounding
         cost the change-LOCATION prior must keep bounded).
      5. MIGRATION FORK: classify per game COVERED / ENUMERATED_BUT_LOST / NEVER_ENUMERATED before vs after.
    FORK VERDICT:
      - first-win delta CI95 EXCLUDES 0 AND >=1 migration NEVER_ENUMERATED->COVERED at a bounded action cost ->
        ENV_GROUNDED_SEARCH_UNLOCKS_FIRST_WIN (.453 scales it; the model-as-action-prior + env-value is the win).
      - first-win delta CI95 EXCLUDES 0 BUT only at an unbounded/huge action cost -> SEARCH_BUDGET_BOUND
        (.453 attacks efficiency: a tighter prior / cheaper progress score).
      - first-win delta CI95 INCLUDES 0 -> WALL_DEEPER_THAN_VALUE_PREDICTION (even env-grounded location-pruned
        search cannot assemble the prefix -> the change-LOCATION prior itself is insufficient; A1b takes the
        last representation swing, then .453 escalates).

    SCOPE: LIVE-PATH-REACHABLE -- the search must improve the live e3 path (StepwiseExplorer expansion prior /
    plan_in_model / arc_competition_agent._induce_and_plan); arc_orphan_solver_lint must pass; NOT a parallel
