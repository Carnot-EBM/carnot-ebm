  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V717 completed scheduling but did not measure H1/H2. Eight producer primaries exist; two tasks have pre-gate receipts; four producer primaries are absent. Exact sparse/dense parity raised an informational verifier finding. A historical V716 authority test read the V717 design. The capstone cold replay reported reduction_drift. Preserve those outcomes. V718 retains the frozen V717 science and repairs specific execution contracts. Cached data are exposed development, not independent generalization.
