  - id: exp3551-p01-graph-coloring-terminal-discriminating-corpus-v3
    operator_override: "2026-05-31 operator directive (ops/known-issues.md 'NEW 2026-05-31: P0.1 GRAPH-COLORING RE-TEST'), continued: exp3540 (.326) CLEANLY re-ran the graph-coloring test (de-tautologized, 0 CRITICAL flags, n expanded, paired significance) and found energy global inference does NOT significantly beat a STRONG DSATUR baseline (1.0 vs 0.99, p=0.135) — BUT a warn CEILING_SATURATION fired because DSATUR itself sat at 0.99, so the corpus was NOT hard enough to DISCRIMINATE energy from a strong classical heuristic. This task gives P0.1 Route-1 its TERMINAL verdict on a corpus where DSATUR is forced BELOW 0.9 (near the chromatic/freezing threshold) while the exact solver confirms solvability — the discriminating test exp3540's saturated corpus structurally could not be. Different (DSATUR < 0.9 discriminating corpus, not just vanilla < 0.9) = the terminal P0.1 Route-1 datapoint. scope-match vs exp3540/exp3528/exp3518 is the intended P0.1 graph-coloring continuation."
