         phase_d_calibration_ready_score principle: readiness requires all calibration, authenticity, competence, diversity, secrecy, and cleanup gates.
         duration_s/inference_substrate/field_provenance/test_commands/test_exit_codes/reproducibility_checksum principle: report measured `live_local_sota_gguf_cuda_generation_plus_exact_validation`.
         verifier_is_oracle/missing_verifier_gaps principle: Python/Z3 are oracle; tuned SC and model traces are not.
         honest_verdict principle: use `complete_ready:`, `complete_null:`, `complete_partial:`, or `blocked:`.
      8. Run focused unit/spec coverage, gate, held-access sentinel, ladder/hash, model/tokenizer, K/diversity, parser, label/method parity, split leakage, raw-row chain, CUDA lifecycle, schema, adversarial-verify, applicable E2E, protected-file, and root-clutter checks.
