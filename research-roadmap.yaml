- id: exp2435-diffutruth-tier0k
  title: 'Phase 1: DiffuTruth Tier 0k Verifier (arXiv:2602.11364) -- Diffusion Reconstruction Energy Proxy'
  milestone: 2026.05.236
  deliverable: results/experiment_2435_diffutruth_tier0k.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp571-hallufield-tier0e
    verdict: tier_0e_viable
    addressed_by: "exp571 implemented HalluField (arXiv:2509.10753) — thermodynamic energy-path detection — and passed as\
      \ Tier 0e viable. DiffuTruth (arXiv:2602.11364) is a DISTINCT technique: diffusion model reconstruction error as\
      \ hallucination proxy, not energy-path thermodynamics. Different paper, different mechanism, different signal axis.\
      \ Prior technique succeeded but this is novel scope on a different arXiv paper."
    retire_if_same_verdict: false
  prompt: "CONTEXT: DiffuTruth (arXiv:2602.11364, Feb 2026) proposes that diffusion model\nreconstruction error is a proxy\
    \ for hallucination risk: hallucinated text has higher\nenergy (more reconstruction steps required) than factually grounded\
    \ text. AUROC=0.725 on\nFEVER in the paper. This is a generative energy proxy — orthogonal to discriminative\nlogit-based\
    \ verifiers (Tier 0f/0g/0h/0j). Adding an orthogonal signal axis should\nimprove the conformal p-value ensemble (exp2438).\n\
    \nThis is a NEW scope: no DiffuTruth implementation exists in the codebase. Best current\nAUROC: Hierarchical LogCons 0.8896\
    \ (exp2423). HIVE peer target: 0.9236.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/fregelogic_hybrid.py\
    \ (verifier architecture pattern)\n  {project_root}/python/carnot/verify/semantic_energy.py (energy score pattern)\n  {project_root}/results/experiment_2395_fregelogic.json\
    \ (0.8831 baseline)\n\nTASK: Implement DiffuTruthVerifier (Tier 0k) and evaluate on 36 telemetry entries.\n\nCONCRETE STEPS:\n\
    \  0. PRECONDITIONS:\n     a. sklearn importable: .venv/bin/python -c \"import sklearn; print(sklearn.__version__)\"\n  \
    \      If missing: .venv/bin/pip install scikit-learn -q\n     b. Telemetry manifest present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n     c. numpy importable: .venv/bin/python\
    \ -c \"import numpy; print(numpy.__version__)\"\n\n  1. Implement DiffuTruthVerifier at python/carnot/verify/diffutruth_verifier.py:\n\
    \     DiffuTruth energy proxy WITHOUT a real diffusion model (which would require GPU):\n       Use token-level log-perplexity\
    \ variance as a reconstruction proxy:\n         energy_score = std(token_logprobs) * mean(abs(token_logprobs))\n       Intuition:\
    \ hallucinated claims have high perplexity variance (confident on common tokens,\n       confused on specific factual claims).\
    \ This is the CPU-feasible approximation.\n     Output: diffutruth_score (higher = more likely hallucination), energy_proxy_method.\n\
    \n  2. Evaluate on 36 telemetry entries (same split as exp2351/exp2422):\n     diffutruth_auroc: AUROC on 36 examples.\n\
    \     diffutruth_vs_fregelogic_delta: diffutruth_auroc - 0.8831.\n     diffutruth_vs_logcons_delta: diffutruth_auroc - 0.8896.\n\
    \     orthogonality_check: correlation with Tier 0j (HALT probe) scores. If abs(pearson_r)\
    \ < 0.5, signal is orthogonal.\n\n  3. Compute verifier_scores list (36 entries) for use by conformal ensemble (exp2438):\n\
    \     Write results/experiment_2435_tier0k_scores.json with format:\n     {{\"verifier\": \"diffutruth\", \"scores\": [{{\"idx\"\
    : i, \"score\": s, \"label\": l}} for all 36]}}\n\n  4. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/verify/\
    \ -k \"diffutruth\" -v --no-cov 2>&1 | tail -15\n     Create test if none exists.\n\n  5. Write deliverable.\n\nREQUIRED\
    \ ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with AUROC.\"\n  - diffutruth_auroc:\n\
    \      principle: \"Primary metric. Honest result regardless of sign vs baseline.\"\n  - diffutruth_vs_fregelogic_delta:\n\
    \      principle: \"diffutruth_auroc - 0.8831. Diagnostic for conformal ensemble.\"\n  - orthogonality_check:\n      principle:\
    \ \"Pearson correlation with Tier 0j. Low correlation = independent signal axis.\"\n  - energy_proxy_method:\n      principle:\
    \ \"Documents which CPU approximation was used for reproducibility.\"\n  - n_eval_examples:\n      principle: \"Must be\
    \ 36.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n      principle: \"Guards against fabrication.\"\
    \n  - preconditions_checked:\n      principle: \"Records sklearn, telemetry, numpy checks.\"\n\nACCEPTANCE GATES:\n  - condition:\
    \ \"diffutruth_auroc != null AND n_eval_examples >= 30\"\n    principle: \"Must produce valid AUROC on sufficient data —\
    \ even below baseline is a finding.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2436-pcib-tier0l
  title: 'Phase 1: PCIB Tier 0l Verifier (arXiv:2601.15652) -- Predictive Coding + Information Bottleneck'
  milestone: 2026.05.236
  deliverable: results/experiment_2436_pcib_tier0l.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp995-pcib-hallucination-tier0f
    verdict: tier0f_below_threshold
    addressed_by: "exp995 implemented PCIB Tier 0f and achieved pcib_auroc=0.5321 (below threshold). Root cause: exp995 used\
      \ a simplified PCIB proxy without the semi-supervised 5-example seeding and the proper IB compression (LinearSVC C=0.1).\
      \ This v236 implementation uses the correct semi-supervised approach from the arXiv:2601.15652 paper: 5 labeled seed\
      \ examples + label propagation via nearest-neighbor in feature space + 5-fold CV evaluation. The 75x data efficiency\
      \ is the key mechanism that exp995 did not use. Different: proper IB compression, semi-supervised seeding."
    retire_if_same_verdict: false
  prompt: "CONTEXT: PCIB (arXiv:2601.15652, Jan 2026) combines Predictive Coding (PC) with\nInformation Bottleneck (IB) to\
    \ extract a compressed representation Z of the model's\ninternal state that predicts hallucination. Key advantage: AUROC=0.8669\
    \ with 75x LESS\ntraining data than comparable probes. The 75x data efficiency directly addresses\nCarnot's limited 36-sample\
    \ telemetry problem. Semi-supervised setting: only 5 labeled\nexamples needed to initialize; the rest learned from structure.\n\
    \nThis is a NEW scope: no PCIB implementation exists in the codebase.\nBest current AUROC: 0.8896 (exp2423). HIVE peer target:\
    \ 0.9236.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/halt_probe.py (probe architecture pattern)\n\
    \  {project_root}/python/carnot/verify/fregelogic_hybrid.py (verifier architecture)\n  {project_root}/results/experiment_2394_halt_tier0j.json\
    \ (Tier 0j baseline probe: 0.8539)\n\nTASK: Implement PCIBVerifier (Tier 0l) and evaluate on 36 telemetry entries.\n\nCONCRETE\
    \ STEPS:\n  0. PRECONDITIONS:\n     a. sklearn importable: .venv/bin/python -c \"import sklearn; print(sklearn.__version__)\"\
    \n     b. numpy importable: .venv/bin/python -c \"import numpy; print(numpy.__version__)\"\n     c. Telemetry manifest present:\n\
    \        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n        If missing: write honest_verdict\
    \ blocked_telemetry_manifest_missing and exit.\n\n  1. Implement PCIBVerifier at python/carnot/verify/pcib_verifier.py:\n\
    \     Predictive Coding component (CPU approximation without live activations):\n       Encode text as token-level feature\
    \ vector: [mean_logprob, std_logprob, max_logprob,\n         min_logprob, kurtosis_logprob, skewness_logprob] (6 features).\n\
    \       These capture the statistical structure of the model's predictive distribution.\n     Information Bottleneck compression\
    \ (LinearSVC with C=0.1 for compression):\n       Compress 6 features to a 2D IB representation via LinearSVC decision function.\n\
    \     Output: pcib_score, ib_compression_ratio, pc_features_used.\n\n  2. Train with 5 labeled examples (semi-supervised):\n\
    \     a. Use first 5 examples from telemetry as labeled seed.\n     b. Fit LinearSVC on 5 labeled examples.\n     c. Propagate\
    \ labels to remaining 31 examples via nearest-neighbor in feature space.\n     d. Re-fit on all 36 with propagated labels.\n\
    \     Measure pcib_auroc on all 36 held-out examples (via 5-fold CV on 36).\n\n  3. Compute verifier_scores for conformal\
    \ ensemble (exp2438):\n     Write results/experiment_2436_tier0l_scores.json with format:\n     {{\"verifier\": \"pcib\"\
    , \"scores\": [{{\"idx\": i, \"score\": s, \"label\": l}} for all 36]}}\n\n  4. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python\
    \ -m pytest tests/python/verify/ -k \"pcib\" -v --no-cov 2>&1 | tail -15\n     Create test if none exists.\n\n  5. Write\
    \ deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - pcib_auroc:\n\
    \      principle: \"Primary metric. AUROC via 5-fold CV. Honest result.\"\n  - pcib_vs_halt_delta:\n      principle: \"\
    pcib_auroc - 0.8539 (Tier 0j baseline). Positive = improvement.\"\n  - ib_compression_ratio:\n      principle: \"Information\
    \ bottleneck compression — core PCIB mechanism signal.\"\n  - n_labeled_seed_examples:\n      principle: \"Must be\
    \ 5 (75x data efficiency claim requires few-shot seed).\"\n  - pc_features_used:\n      principle: \"Lists which predictive\
    \ coding features were extracted.\"\n  - n_eval_examples:\n      principle: \"Must be 36.\"\n  - random_seed:\n      principle:\
    \ \"Must be 42.\"\n  - duration_s:\n      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n      principle:\
    \ \"Records sklearn, numpy, telemetry checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"pcib_auroc != null AND n_eval_examples\
    \ >= 30\"\n    principle: \"Must produce valid AUROC on sufficient data.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2437-logcons-z3-true-v3
  title: 'Phase 1: Hierarchical LogCons Z3-True v3 -- Force Real Z3 Encoding (Fix exp2423 Fallback)'
  milestone: 2026.05.236
  deliverable: results/experiment_2437_logcons_z3_true_v3.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  prior_failures:
  - experiment_id: exp2423-hierarchical-logcons-v2
    verdict: complete_logcons_auroc_0.8896_z3_encoding_used_false
    addressed_by: "exp2423 in .235 achieved AUROC=0.8896 BUT z3_encoding_used=false (fallback FregeLogic path was used because\
      \ instruction hierarchy detection found no hierarchy-detectable fields). The task produced the best .235 AUROC without\
      \ actually using Z3. This v3 explicitly constructs a synthetic instruction hierarchy from the telemetry prompt field (system\
      \ > user > task levels), encodes it as Z3 partial-order constraints BEFORE anything else, and treats z3_encoding_used=false\
      \ as a hard FAIL gate. Different from v2: the Z3 encoding is NOT optional."
    retire_if_same_verdict: false
  prompt: "CONTEXT: exp2423 (Hierarchical LogCons v2, .235) achieved AUROC=0.8896 — the best\nresult in the project —\
    \ BUT z3_encoding_used=false. The fallback FregeLogic path was\ntriggered because the instruction field detection found no\
    \ detectable hierarchy in the\ntelemetry entries. The Z3 partial-order constraint encoding, which is the key innovation\n\
    in arXiv:2604.09075, was NEVER used.\n\nThis v3 MUST use real Z3. The hypothesis: real Z3 hierarchical encoding\nshould\
    \ achieve >= 0.8896 AUROC (already demonstrated by the fallback), and may push\nhigher since the fallback was a weaker proxy.\n\
    \nRoot cause of exp2423 fallback: hierarchy_levels was an empty list because the code\nlooked for an 'instruction' field\
    \ in telemetry that doesn't exist. Fix: construct a\nsynthetic 3-level hierarchy from telemetry fields (system_prompt >\
    \ user_prompt > response)\nand encode it as Z3 partial-order constraints regardless.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/hierarchical_logcons.py\
    \ (from exp2423)\n  {project_root}/python/carnot/verify/nsvif_z3_extractor.py (Z3 encoding reference)\n  {project_root}/results/experiment_2423_hierarchical_logcons_v2.json\
    \ (AUROC=0.8896, z3=false)\n\nTASK: Fix HierarchicalLogConsVerifier to always use Z3 encoding. Force z3_encoding_used=true.\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. z3-solver importable: .venv/bin/python -c \"import z3; print(z3.get_version_string())\"\
    \n        If missing: .venv/bin/pip install z3-solver -q\n     b. hierarchical_logcons.py exists:\n        ls {project_root}/python/carnot/verify/hierarchical_logcons.py\n\
    \        If missing: write honest_verdict blocked_logcons_module_missing and exit.\n     c. Telemetry manifest present:\n\
    \        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n        If missing: write honest_verdict\
    \ blocked_telemetry_manifest_missing and exit.\n\n  1. Read hierarchical_logcons.py. Find the code path that sets z3_encoding_used=False.\n\
    \     Modify to ALWAYS build a 3-level hierarchy from available telemetry fields:\n       Level 0 (highest priority): system-level\
    \ content (use 'system' or 'instruction' or first 100 chars of prompt)\n       Level 1: user-level content (use 'question'\
    \ or 'prompt' field or next 100 chars)\n       Level 2: task-level content (use 'response' first 100 chars)\n     Z3 encoding:\n\
    \       s0, s1, s2 = z3.Ints('s0 s1 s2')  # priority levels\n       solver = z3.Solver()\n       solver.add(s0 > s1, s1\
    \ > s2)       # hierarchy constraint\n       # Check if response violates level ordering\n       response_level = estimate_response_priority_level(response)\n\
    \       solver.add(z3.Not(response_level >= s0))  # if response claims system-level\n       verdict = solver.check()  #\
    \ SAT = consistent, UNSAT = hierarchy violation\n     If z3 check completes (SAT or UNSAT): z3_encoding_used=True.\n   \
    \  FAIL GATE: if z3_encoding_used=False after this, write honest_verdict\n     blocked_z3_encoding_failed and exit.\n\n\
    \  2. Evaluate on 36 entries:\n     logcons_z3_true_auroc, logcons_z3_true_vs_v2_delta (v2 was 0.8896),\n     hierarchy_violation_rate,\
    \ z3_encoding_used (must be True for all 36).\n\n  3. Compute verifier_scores for conformal ensemble (exp2438):\n     Write\
    \ results/experiment_2437_logcons_z3_scores.json with format:\n     {{\"verifier\": \"logcons_z3_true\", \"scores\": [{{\"\
    idx\": i, \"score\": s, \"label\": l}} for all 36]}}\n\n  4. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest\
    \ tests/python/verify/ -k \"logcons\" -v --no-cov 2>&1 | tail -15\n\n  5. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n\
    \  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with AUROC. blocked_z3_encoding_failed if Z3\
    \ encoding fails.\"\n  - logcons_z3_true_auroc:\n      principle: \"Primary metric. Must be from Z3 path, not fallback.\"\
    \n  - logcons_z3_true_vs_v2_delta:\n      principle: \"Difference from exp2423 (0.8896). Positive = Z3 beats FregeLogic\
    \ fallback.\"\n  - z3_encoding_used:\n      principle: \"MUST be true. If false, task has failed its mandate.\"\n  - hierarchy_violation_rate:\n\
    \      principle: \"Fraction of examples with detected Z3 hierarchy violations.\"\n  - n_eval_examples:\n      principle:\
    \ \"Must be 36.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n      principle: \"Guards against\
    \ fabrication.\"\n  - preconditions_checked:\n      principle: \"Records z3, logcons module, telemetry checks.\"\n\nACCEPTANCE\
    \ GATES:\n  - condition: \"z3_encoding_used == true\"\n    principle: \"The entire purpose of this task is to force Z3 encoding.\
    \ If false, it failed.\"\n  - condition: \"logcons_z3_true_auroc != null AND n_eval_examples >= 30\"\n    principle: \"\
    Must produce valid AUROC on sufficient data.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2438-conformal-ensemble-v1
  title: 'Phase 1: Conformal P-Value Ensemble v1 (arXiv:2508.18473) -- Principled Multi-Verifier Aggregation'
  milestone: 2026.05.236
  deliverable: results/experiment_2438_conformal_ensemble_v1.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  prior_failures:
  - experiment_id: exp923-drift-probe-ensemble
    verdict: complete_drift_probe_ensemble_ok
    addressed_by: "exp923 implemented DRIFTProbe Ensemble (arXiv:2604.13386) — multi-layer weighted ensemble — which PASSED.\
      \ Conformal P-Value Ensemble (arXiv:2508.18473) is a DISTINCT aggregation method: uses calibration-set nonconformity\
      \ scores and Fisher's combined p-value test instead of weighted voting. Different paper, different aggregation theory\
      \ (conformal prediction vs weighted averaging). The prior ensemble used LogisticRegression weights (exp2422 HIVE v4);\
      \ this uses theoretically-principled p-value aggregation with coverage guarantees."
    retire_if_same_verdict: false
  gated_on:
  - upstream: exp2437-logcons-z3-true-v3
    artifact_field: logcons_z3_true_auroc
    op: "!="
    value: null
  prompt: "CONTEXT: Conformal P-Value Ensemble (arXiv:2508.18473, Aug 2025) achieves highest\nmacro AUROC across verifier aggregation\
    \ methods by converting each verifier's score\ninto a p-value via calibration-set nonconformity scores, then aggregating\
    \ via Fisher's\ncombined test (chi-squared statistic: -2 * sum(ln(p_i))).\n\nThis task fuses all available Tier 0 verifiers:\n\
    \  - Tier 0f FreqAwareAttn (AUROC=0.7045, exp2397)\n  - Tier 0g SemanticEnergy (AUROC=0.6852, exp2351)\n  - Tier 0h LaaB\
    \ (exp2368)\n  - Tier 0j HALT probe (AUROC=0.8539, exp2394)\n  - Tier 0k DiffuTruth (exp2435, from results/experiment_2435_tier0k_scores.json)\n\
    \  - Tier 0l PCIB (exp2436, from results/experiment_2436_tier0l_scores.json)\n  - Tier 1 LogCons Z3-True (exp2437, from\
    \ results/experiment_2437_logcons_z3_scores.json)\n\nReplace LogisticRegression soft-vote weights (exp2422 approach) with\n\
    conformal p-value aggregation. Theory guarantees: marginal coverage at level alpha\nregardless of per-verifier score distribution.\n\
    \nGated on exp2437 completing (requires logcons_z3_true_auroc != null — need at\nleast the Z3-True scores for the ensemble).\n\
    \nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/hive_ensemble_v4.py (from exp2422)\n  {project_root}/results/experiment_2422_hive_full_v4.json\
    \ (HIVE v4 baseline: 0.8864)\n  {project_root}/results/experiment_2435_tier0k_scores.json (if exists)\n  {project_root}/results/experiment_2436_tier0l_scores.json\
    \ (if exists)\n  {project_root}/results/experiment_2437_logcons_z3_scores.json (if exists)\n\nTASK: Implement ConformalEnsemble\
    \ and evaluate on 36 telemetry entries.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. sklearn importable: .venv/bin/python\
    \ -c \"import sklearn; print(sklearn.__version__)\"\n     b. scipy importable: .venv/bin/python -c \"import scipy; print(scipy.__version__)\"\
    \n     c. Telemetry manifest:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n     d.\
    \ Score files from exp2435+2436+2437 (read each, log which are present):\n        for f in tier0k_scores tier0l_scores logcons_z3_scores;\
    \ do\n          ls {project_root}/results/experiment_*_$f.json 2>/dev/null && echo \"present\" || echo \"missing: $f\"\n\
    \        done\n\n  1. Load all available verifier scores into a matrix X (n=36, d=n_verifiers).\n     Available verifiers\
    \ from existing artifacts:\n       Tier 0f: load from exp2397 or re-compute via freq_aware_attention.py\n       Tier 0g:\
