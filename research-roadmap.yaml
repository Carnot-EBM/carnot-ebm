tasks:
- id: exp8615-contract-methods
  title: Bind twelve tasks and seal independent learning evidence and service methods
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 40
  per_unit_rows: true
  milestone: 2026.10.740
  deliverable: results/experiment_8615_v740_contract_methods.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prior_failures:
  - experiment_id: exp8602-contract-methods
    verdict: complete_blocked_v739_contract_methods
    addressed_by: V739 pointed to V738 and failed its full-object contract. V740 supplies a new complete
      twelve-task document, independently compared table, JSON, digest and staged authority. Historical
      V739 remains blocked.
    retire_if_same_verdict: true
  agent_type: claude
  model: opus
  prompt: |
    CONTEXT:
    Work in {project_root} on {date}. V739 ended thirteen scheduling slots with six producer artifacts. The live YAML pointed to a V738 design, so methods authority failed. Exp8608 qualified a lean prototype. Repaired Exp8609 passed its owned checks but remained blocked on methods. Exp8603 passed all 51 collected tests and all three deadline cases, yet its custom coverage projection demanded continuation line94. The raw Coverage.py report covered all83 executable runner statements; first_line(94)=92. Preserve the old disqualification. V740 changes measurement accounting, not deadline behavior or the learner. V733 source, V735 cold-cost and V737 ARC nulls remain closed. V738 native throughput CI95[1.0740525,1.1057774] does not meet NFR01. V740 has exactly twelve tasks, Exp8615 through Exp8626.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; ops/exclusion_manifest.yaml; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; openspec/change-proposals/research-roadmap-vNEXT.md; research-references.md; python/carnot/reporting/v738_contract_methods.py; python/carnot/reporting/v738_contract_inputs.py; python/carnot/reporting/roadmap_contract.py; openspec/change-proposals/v738-methods-protocol.json; openspec/change-proposals/research-roadmap-v738-preserved-20261017.md; results/experiment_8591_v738_contract_methods.json; results/experiment_8601_v738_capstone.json; python/carnot/verify/cuda_reader_8410.py; python/carnot/reporting/v739_contract_methods.py; results/experiment_8602_v739_contract_methods.json; results/experiment_8614_v739_capstone.json
    TASK:
    Bind twelve tasks and seal independent learning evidence and service methods. Deliver results/experiment_8615_v740_contract_methods.json. Create thin runner scripts/experiments/experiment_8615_v740_contract_methods.py. Store primitives under results/raw/experiment_8615_v740_contract_methods/ and notes in docs/research-notes/v740-contract-methods.md. Same-roadmap outputs are future dependencies.
    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Authenticate actual input paths, original authority, hashes, tools, memory and writable disk-backed scratch. Record missing required inputs in gate_check_summary. Optional GPU and board absence cannot block independent CPU branches.
    2. Print a flushed progress line at every phase boundary. Print before and after every model load, generation, benchmark, or subprocess that can take minutes. Use unbuffered output. Inside long loops, print completed and pending counts. Supervise children with status lines at least every 60 seconds. Keep every silence gap below 600 seconds. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between those calls. Poll long work in calls of at most 60 seconds. Stop measurement by 3600 seconds. Reserve 900 seconds for validation within the 4800-second hard cap. Never pad duration.
    3. Spec first: confirm the relevant capability spec contains REQ-* and SCENARIO-* before implementation. Add focused failing tests first. Preserve original scientific assertions and historical evidence. Accept --date {date}. Put runners in scripts/experiments/, tests in tests/python/, and scratch in /var/tmp. Do not modify research-roadmap.yaml, shared validators, generator weights or external services.
    4. Declare inference_substrate_class=no_model_load and MODEL_SPECS=[]. Record zero current language-model calls. Imported generator names belong in historical_model_provenance. Identify any actual small energy head and checkpoint in target_model; no_model_load does not mean absence of numerical inference.
    5. Bind exactly twelve complete task dictionaries, Exp8615 through Exp8626. Compare staged or authentically activated V740 YAML, the visible table, embedded full JSON, canonical_tasks_sha256 and end marker. Reject count, order, ID, title, phase, deliverable, model, substrate, gate, prompt, retirement and marker mutations. V739 remains historical; never manufacture its missing design or require future artifacts.
    6. Create openspec/change-proposals/v740-methods-protocol.json before measurement. Inherit objective_updates, objective_audit, evidence_canary and resident_session from authenticated V738 by value and hash. Register V740 producer mappings separately. Preserve original readers and pins. Authenticate only dependencies used by each branch; mutable roadmap or references files cannot substitute for sealed historical bytes.
    7. Ingest the dated V740 scan using low-concurrency primary-source retrieval. Read Trivia+2605.11330, RT4CHART2603.27752, Calibeating2603.22167, delayed feedback2602.02634/2606.11711 and online KAN2602.02056. Record methods, assumptions, hashes and use/defer decisions. Mark ingested leads in research-studying.md. Do not infer correctness from compatibility, lexical overlap or source faithfulness.
    8. Authenticate original Exp8580 validator, Exp8581 accounting, Exp8431 head and Exp8554 test union. Separately authenticate Exp8593 provenance, Exp8596 cost, Exp8608 prototype and repaired Exp8609 owned evidence. Keep blocked historical readiness zero. Emit learning_inputs_ready_score and resident_inputs_ready_score separately. No current validation can erase an old failure.
    9. Register the still-unmeasured Trivia+ protocol from V739 as new V740 methods. Select first128 normalized official-test question clusters by SHA256(seed7398607 || question_hash) before labels, preserving all siblings. Keep full sources, original labels and private internal use. No released p2 judge confidence means no nine-input head inference. Register four fixed lexical scores and descriptive disagreement strata without fitting.
    10. Register lean_worker_2x2 explicitly: legacy/lean imports crossed with Python/native arithmetic, original64 requests, session lengths1/4/16, batches1/8 and ten paired repetitions. Preserve the V739 intended operands by value, without treating its invalid authority as qualification. Primary is L16/B1 lean_native versus legacy_native; separately test native versus Python. Register observer horizon120 without changing ARC policy.
    11. Read the existing CUDA evidence reader once without a device command. A supplied causal library/environment repair and qualified current validator custody are required for runtime_repair_ready_score=1. Declare canary_inputs_ready_score separately. Missing or unchanged evidence keeps the optional model gate closed; CPU work proceeds.
    12. Seal snapshots and branch references. Exercise staged-V740/active-V739 selection and later activated-V740 selection in private fixtures. Test that missing optional runtime evidence leaves learning, extraction and service methods usable. Publish methods_ready_score only after full-object equality and independent mutation controls pass.
    13. Run scoped unit tests, private CLI checks, Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Run applicable ops/e2e-test-plan.md checks, including private E2E-018/021 for authority/publication readers. Require100percent newly owned statement coverage, including actual children and rejection paths. Collect original node IDs before bounded disjoint test children; retain the exact union and original authority. Use -n 0 -o addopts= --no-cov. Never run the whole repository suite or nested historical validation controllers. A killed child fails validation. Keep commands, exits, durations and log hashes.
    14. Cold-replay immutable primitives in a fresh bounded process. Test missing inputs, owned failures and self-consistently rehashed tampering. Run primary_publication, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Preserve actual findings and downstream acceptance. Validate final bytes before atomic publication. Required owned-check failure is disqualified. Unchanged external blockage is blocked, never partial. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md without rewriting history.
    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Bind evidence to this invocation.
    honest_verdict, verdict_class: principle: Terminal verdicts start complete_. verdict_class is exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means incomplete owned work that another attempt can finish; external unchanged failures mean blocked.
    gate_check_summary: principle: Every blocked_* or complete_blocked_* outcome names failed check, upstream, path/hash, field, operator, expected and observed. Missing differs from zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, historical_model_provenance, target_model: principle: Separate actual execution from imported generator names and authenticate numerical checkpoints.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count, sample_size_budget: principle: Retain each unit and arm, its metric or missing reason. Seeds, sibling answers and timing repetitions are not independent questions.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle-dependent positives use circular_positive. Exposed learning, eligibility, fixtures and service timings keep both generalization scores zero.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path, adversarial_findings: principle: Qualification differs from benefit. Failed acceptance gates forbid positive classes.
    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes: principle: Preserve actual clocks and immutable operands.
    cited_upstream_artifacts, field_principles: principle: Name original producers and explain every added metric and gate.
    methods_ready_score, current_contract_ready_score, learning_inputs_ready_score, resident_inputs_ready_score, canary_inputs_ready_score, runtime_repair_ready_score, inherited_operand_checks, literature_method_rows, gate_field_map, canonical_tasks_sha256: principle: Each branch has explicit authority and readiness; method registration cannot establish benefit.
    methods_protocol_reference, learning_protocol_reference, lean_worker_2x2, preserved_v739_failure, authority_mutation_rows: principle: Bind current authority and measured operands without rewriting historical qualification.
    branch_gate_values: principle: Readiness fields named above are top-level numeric0/1 values. Explain each in field_principles; missing differs from zero.
    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8615_v740_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
