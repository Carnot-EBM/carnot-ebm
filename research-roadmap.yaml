- id: exp614-exclusion-manifest-dualgpu-validation
  milestone: 2026.04.47
  deliverable: results/experiment_614_exclusion_manifest_dualgpu.json
  title: 'Exp 614: ExclusionManifest Conductor Wire-In Validation + DualGPU Utilization Proof'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-067 was\
    \ marked resolved in Exp 601 (precheck_created_sentinel_proven=True), but the\
    \ .46 retro still shows conductor_consulted=False for the milestone as a whole.\
    \ We need to validate that the sentinel file mtime is ACTUALLY within 60 seconds\
    \ of an experiment start — proving the precheck ran just-in-time, not hours earlier.\
    \ Additionally, DualGPU parallel forward-pass has been UNCONFIRMED for five consecutive\
    \ milestones: both RTX 3090s are available and clean, but no experiment has logged\
    \ gpu1_utilization > 0 during a forward pass. This experiment validates both.\n\
    \nEXISTING CODE TO READ FIRST:\n- scripts/conductor_manifest_precheck.py — precheck\
    \ script (Exp 601), reads conductor_exclusion_manifest.json\n- scripts/conductor_consulted_at.txt\
    \ — sentinel file written by precheck\n- scripts/conductor_exclusion_manifest.json\
    \ — manifest listing [308, 260, 309, 425, 410]\n- python/carnot/pipeline/exclusion_manifest.py\
    \ — ExclusionManifest, build_default_manifest()\n- scripts/experiment_template.py\
    \ — ExperimentTemplate, BatchedInferenceRunner\n\nTASK: Validate precheck timing\
    \ AND prove DualGPU parallel forward-pass.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-INFRA-087 (precheck must run within 60s of experiment start),\
    \ REQ-INFRA-088 (DualGPU parallel forward-pass: both GPUs must show >0 utilization\
    \ during concurrent model inference), SCENARIO-INFRA-092/093 to\
    \ openspec/capabilities/verifiable-reasoning/spec.md.\n3. Write scripts/experiment_614_exclusion_manifest_dualgpu.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. ExperimentTimeoutWatchdog(614, timeout_minutes=20).\n\
    \   c. ExperimentTemplate(614, 'ExclusionManifest DualGPU Validation',\n      'results/experiment_614_exclusion_manifest_dualgpu.json',\
    \ requires_gpu=False).\n   d. Precheck timing test:\n      i. Run scripts/conductor_manifest_precheck.py\
    \ 614 (not excluded).\n      ii. Read scripts/conductor_consulted_at.txt mtime.\n\
    \      iii. Check mtime - time.time() < 60 seconds. Record sentinel_within_60s.\n\
    \   e. DualGPU utilization test:\n      i. Try: import torch; gpus = [i for i\
    \ in range(torch.cuda.device_count())].\n      ii. If len(gpus) >= 2: load a tiny\
    \ model stub (nn.Linear(10, 10)) onto cuda:0 AND cuda:1 simultaneously.\n     \
    \     Run a forward pass on EACH simultaneously using threading.Thread.\n      \
    \    After both threads complete: check torch.cuda.utilization(0) > 0 and\n  \
    \        torch.cuda.utilization(1) > 0 (or use pynvml if available).\n         \
    \ gpu1_utilization_confirmed = bool(gpu1_util > 0).\n      iii. If torch.cuda\
    \ unavailable or len(gpus) < 2: gpu1_utilization_confirmed = False,\n        \
    \  dualgpu_blocked_reason = 'cuda_unavailable' | 'only_one_gpu'.\n   f. Build\
    \ artifact: schema='carnot.exclusion_dualgpu_validation.v1',\n      sentinel_within_60s=<bool>,\
    \ sentinel_age_seconds=<float>,\n      n_gpus_detected=<int>, gpu1_utilization_confirmed=<bool>,\n\
    \      dualgpu_blocked_reason=<str | None>,\n      retro_067_timing_confirmed=<bool\
    \ = sentinel_within_60s>,\n      honest_verdict='precheck_timed_dualgpu_confirmed'\
    \ if (sentinel_within_60s and gpu1_utilization_confirmed)\n        else 'precheck_timed_dualgpu_blocked'\
    \ if sentinel_within_60s\n        else 'precheck_not_timed_dualgpu_checked'.\n\
    \   g. tmpl.assert_deliverable_written() as FINAL LINE.\n4. Write tests/python/test_experiment_614_validation.py\
    \ (100% coverage on new functions).\n5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n6. Reconcile: ops/conductor-log.md (RETRO-067 timing check),\
    \ ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp615-live-corpus-v3
