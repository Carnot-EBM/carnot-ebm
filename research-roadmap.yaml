    \   theoretical basis (Boltzmann-GPT arXiv 2601.17094 + ARM-EBM bijection 2512.15605),\n\
    \   hardware path (adapter is a small matmul — GPU/NPU native, <1ms).\n\
    5. Write scripts/experiment_445_boltzmann_repair_bridge.py:\n\
