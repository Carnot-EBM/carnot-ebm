        addressed_by: "exp2614 (.250) added HF citation stub and attempted IPFS pin. This does the POST-v9 update: updates HF model card with adversarially-validated v9 AUROC from exp2622 (not the single-seed claim from .250), verifies the IPFS CID is actually accessible (not just pinned), and adds v9 weights hash to model card. Different scope: verification and v9 update vs. initial citation stub."
