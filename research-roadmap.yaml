# Carnot Research Roadmap - Milestone 2026.04.21
# "Apple Adversarial GSM8K, Extraction-Free Detection, and FPGA Hardware Bring-up"
#
# CONTEXT: Milestone 2026.04.20 (Revalidation Sweep) confirmed:
#   - Global consistency: 100% detection (live, CONFIRMED)
#   - Agent rollback: 100% success (live, CONFIRMED)
#   - Semantic grounding: 100% stale detection, 0% fresh-wrong detection, +40pp lift (SCOPED)
#   - CRITICAL: Semantic grounding is quantity-mismatch sensitive but NOT arithmetic-error sensitive.
# This tells us exactly where the gap is: we need extraction-free logit-based signals.
# The Apple adversarial GSM8K should work with semantic grounding (number-swap = stale errors).
# SpilledEnergy + SemanticEnergy provide extraction-free coverage of remaining classes.
# FPGA bring-up has been deferred 3 milestones — this milestone closes the hardware gap.
#
# Design doc: openspec/change-proposals/research-roadmap-vNEXT.md (v27)
# Previous milestone: research-roadmap.yaml (2026.04.20)

