  - id: exp6608-family-headroom-reducer
    milestone: "2026.08.576"
    deliverable: results/experiment_6608_family_headroom_reducer.json
    title: "Independent three-family headroom reducer"
    priority: critical
    track: flagship-headroom
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 75
    agent_type: codex
    model: gpt-5.6-sol
    prior_failures:
      - experiment_id: exp5791-arc-sota-independent-hypothesis-panel
        verdict: "blocked: headline_gpu_offload_receipts_present"
        addressed_by: "V576 performs a CPU-only row reducer over completed family plan baselines; it does not run an ARC hypothesis panel or depend on new GPU-offload receipts."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
