- id: exp1107-new-diverse-verifiers-v1
  milestone: 2026.04.86
  deliverable: results/experiment_1107_new_diverse_verifiers_v1.json
  title: "New Diverse Verifiers v1 — Z3 Math + AST Code + Semantic Consistency (for AND-composition viability)"
  agent_type: codex
  max_turns: 45
  estimated_wall_time_min: 40
  priority: high
  requires_gpu: false
  prompt: |
    CONTEXT:
    Milestone .85 Phase 1c measurement (exp1093) found that the current verifier ensemble
    (SOSKANEnergyV3, IsingEnergy, SemEnergy) has max pairwise r-correlation=0.656 — ABOVE the
    0.5 threshold required for AND-composition to shrink the joint null space exponentially.

    Root cause: all three current verifiers rely on token-level statistical features. They
    share a common failure pattern (fluent/well-formatted text gets low energy regardless of
    mathematical correctness).

    Fix: add 3 new verifiers with STRUCTURALLY ORTHOGONAL kernels:
    1. Z3MathVerifier — symbolic math correctness via Z3 SMT solver
    2. ASTStructureVerifier — code/text structural properties via AST parsing
    3. SemanticConsistencyVerifier — cross-sentence logical consistency

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/ (list directory — understand existing verifier interfaces)
