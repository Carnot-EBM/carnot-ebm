          principle: "Bare bool: True if val<0.80 (RFT arm not run). Prevents a meaningless graft dressed as a result."
        verifier_value_added:
          principle: "Bare bool: did the NON-oracle ensemble rerank OR the RFT de-confound beat the vote WITH headroom present? THE headline answer + the DiffusionGemma gate. Defined on the transferable verifier + the LABEL contrast, NEVER on the executable-oracle rerank."
