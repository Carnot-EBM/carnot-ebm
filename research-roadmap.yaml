      they import, do NOT silently skip the train like the off-ARC runner did); other deps (peft/trl/
      transformers) + GPU visible (python -c "import torch; assert torch.cuda.is_available()");
      (c) the ARC-1/ARC-2 task pools loadable.
      BUILD: (1) held-IN split of ARC tasks; codex generates k>=8 transform programs per task.
      (2) PRECISION GATE FIRST (scoping-doc Phase-0): on a labeled held-out, compute the verifier's
      certification precision P(test-gold | demo-perfect) and recall; if precision < 0.85 at recall
      >= 0.20, the demo-perfect label is too noisy -> the RFT-CORRECT corpus is poisoned ->
      honest_verdict blocked_precision_gate_unmet_<p>_<r> and STOP (do NOT build a corpus on a
      poisoned label). (3) build THREE N-MATCHED corpora from the SAME generator: (A) RFT-CORRECT =
      demo-perfect programs; (B) RFT-ABLATION = NOT-demo-perfect / random-filtered programs (same
      generator, |B| == |A|, matched task distribution -- the verifier-LABEL ablation); (C) gold-SFT =
