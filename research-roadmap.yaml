    milestone: "2026.06.377"
    title: "VERIFIER-AS-REWARD RFT -- CORPUS BUILD (THE PIVOT, part 1; DE-CONFOUNDED per the 2026-06-12 adversarial review): build THREE N-matched corpora from the SAME codex generator so the experiment isolates the VERIFIER'S LABEL, not codex-distillation. For each ARC-1/ARC-2 task in a held-IN split, codex generates k candidate `def transform(grid)` programs; the model-free execution verifier (python/carnot/agentic/arc_gap4_execution_verifier.py) labels each. (A) RFT-CORRECT corpus = verifier-certified DEMO-PERFECT programs (the verifier's label-free positive signal). (B) RFT-ABLATION corpus = the verifier-LABEL ablation: programs the verifier certifies as NOT demo-perfect (demo-failing / randomly-filtered), SAME generator, N-MATCHED and composition-matched to (A). (C) gold-SFT corpus = TEST-gold-passing programs (oracle labels), N-matched. THE LOAD-BEARING CONTRAST is (A) vs (B): same codex intelligence, the ONLY difference is whether the verifier's label is CORRECT -- if A>B the verifier's LABEL carries training signal (verifier-as-reward), if A~=B then 'RFT helps' is just codex-distillation and the verifier adds nothing (the honest null the review warned of). (A) vs (C) asks whether the label-free verifier signal matches oracle labels. PRECISION GATE (scoping-doc Phase-0, MANDATORY before trusting any train): measure the verifier's certification precision -- P(test-gold | demo-perfect) -- on a labeled held-out; if < 0.85 at recall >= 0.20 the RFT-CORRECT corpus is POISONED and the result is uninterpretable -> report blocked_precision_gate_unmet and STOP. Write the LoRA trainer for the small-model LADDER (cached HF safetensors, NOT GGUF: Qwen/Qwen3.5-0.8B headroom rung [primary], openbmb/MiniCPM5-1B strong rung; optional Qwen/Qwen2.5-0.5B or Qwen/Qwen3.5-2B) using trl 1.6.0 (SFTTrainer + GRPOTrainer) + peft LoRA, + the held-OUT eval harness. Smoke-train 2 tasks for ONE base; commit the runner."
    priority: critical
    track: verifier-as-reward
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4077_verifier_reward_rft_corpus_build.json
    prompt: |
      Read docs/research-notes/verifier-as-self-improvement-reward-scoping.md (the Sudoku
      RFT-beats-SFT beachhead design) FIRST. Reuse the execution verifier
      (python/carnot/agentic/arc_gap4_execution_verifier.py + python/carnot/verify/sandbox.py).
      PRECONDITIONS (check BEFORE any inference; miss -> honest_verdict blocked_<resource>, no
      fabrication): (a) the LADDER bases load as HF safetensors (cached; NOT GGUF -- LoRA needs
      trainable weights): Qwen/Qwen3.5-0.8B (headroom rung) AND openbmb/MiniCPM5-1B (strong rung;
      may need trust_remote_code=True); (b) the trainer imports: `python -c "import trl, peft;
