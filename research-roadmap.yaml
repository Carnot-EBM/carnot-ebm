    \   Potts machines encode correct/partial/violated as a single joint distribution\
    \   with the same FPGA-compatible sparse structure; arXiv 2602.04200 shows\
    \   mean-field constraints preserve sparsity during optimization,\
    \   enabling hardware-native Potts sampling on the KV260 FPGA without\
    \   architecture changes).\n\
