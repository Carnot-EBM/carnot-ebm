tasks:
  - id: exp325-conductor-timeout-wrapper
    milestone: "2026.05.06"
    deliverable: scripts/run_experiment_with_timeout.sh
    title: "Exp 325: Conductor timeout wrapper + ExperimentTemplate test-first stub (RETRO-001 + NEW-001)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: RETRO-001 (45-minute conductor timeout) has been carried forward for TWO
      consecutive milestones (2026.04.22 and 2026.04.29). The Exp 308 post-test failure loop
      consumed 138 minutes — a 45-minute hard timeout would have saved 93 minutes. The
      conductor calls `claude -p` with no timeout, so stuck experiments run until max turns
      (50) which can take 2+ hours on complex tasks.

      Additionally, NEW-001 identified that ExperimentTemplate should auto-generate a test
      file skeleton BEFORE implementation begins. This enforces test-first development
      (reducing the 23.5% post-test failure rate observed in 2026.04.29).

      The research conductor (scripts/research_conductor.py) must NOT be modified. Instead,
      this experiment: (1) writes a wrapper shell script that calls the conductor with a
      timeout, and (2) adds generate_test_stub() to ExperimentTemplate (scripts/experiment_template.py).

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner (add to this)
      - ops/conductor-log.md — RETRO-001, RETRO-002, NEW-001, NEW-002 definitions
      - results/operational_retro_2026_04_29.json — action item details

      TASK: Implement conductor timeout wrapper and test-first stub.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-INFRA-001 (conductor timeout ≤45 min), REQ-INFRA-002 (test-first stub),
         and SCENARIO-INFRA-001/002/003 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - ExperimentTemplate.generate_test_stub(test_file_path, module_to_test): writes a
           pytest file skeleton with class TestExpNNNPlaceholder and one passing placeholder test
         - stub file: imports module_to_test, has docstring "Auto-generated by ExperimentTemplate;
           replace placeholder tests with real tests before implementing"
         - stub is idempotent: does NOT overwrite if test_file_path already exists
         - stub validation: skeleton parses as valid Python (ast.parse check)
         - timeout_wrapper_exists(): returns True if scripts/run_experiment_with_timeout.sh exists
           and is executable
         - timeout_minutes: configurable via CARNOT_CONDUCTOR_TIMEOUT_MINUTES env var (default 45)
         - wrapper exit code: 124 when timeout fires (standard Unix timeout exit code)
      4. Implement ExperimentTemplate.generate_test_stub() in scripts/experiment_template.py:
         a. Signature: generate_test_stub(test_file_path: str, module_to_test: str = "") -> str
         b. If test_file_path exists: log warning, return test_file_path unchanged (idempotent)
         c. Else: write skeleton file with:
            - "# AUTO-GENERATED by ExperimentTemplate.generate_test_stub() — replace me"
            - "# REQ-INFRA-002: test-first enforcement"
            - import statement for module_to_test (if provided)
            - class TestExpNNNPlaceholder: with def test_placeholder_stub(self): assert True
         d. Set file permissions 644
         e. Return path to written file
      5. Write scripts/run_experiment_with_timeout.sh:
         a. Shebang: #!/usr/bin/env bash
         b. Usage: run_experiment_with_timeout.sh <conductor_command...>
         c. Read CARNOT_CONDUCTOR_TIMEOUT_MINUTES (default 45)
         d. Run: timeout -k 60s ${TIMEOUT_MINUTES}m "$@"
         e. Capture exit code; if 124: echo "CONDUCTOR TIMEOUT after ${TIMEOUT_MINUTES} min"
         f. Exit with original exit code (or 124 on timeout)
         g. chmod +x scripts/run_experiment_with_timeout.sh
      6. Write tests/python/test_experiment_325_hardening.py (100% coverage required).
      7. Write scripts/experiment_325_hardening.py using ExperimentTemplate(325, ...):
         a. Call generate_test_stub() on a temp path; verify idempotency
         b. Check that run_experiment_with_timeout.sh exists and is executable
         c. Parse the wrapper script; verify timeout value is configurable
         d. Build artifact: schema="carnot.conductor_hardening.v1", retro_items_implemented,
            estimated_speedup_pct=27.0, timeout_minutes=45, test_first_stub_added=True
         e. Output: results/experiment_325_hardening.json
      8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      9. Reconcile: update ops/conductor-log.md (RETRO-001 implemented), ops/changelog.md,
         ops/status.md
      10. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp326-dual-gpu-monitor
    milestone: "2026.05.06"
    deliverable: python/carnot/pipeline/dual_gpu_monitor.py
    title: "Exp 326: DualGPUMonitor + ExperimentTemplate GPU enforcement (RETRO-002 + RETRO-003)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: RETRO-002 (GPU monitor in conductor) and RETRO-003 (DualGPURunner enforcement)
      were both carried forward without implementation. Key findings from the 2026.04.29 retro:
      - Zombie GPU processes hold ~1050 MB VRAM at 0% utilization (PIDs 2592400/2595103)
      - Exp 219/221 ran two models sequentially on GPU 0 with GPU 1 idle (195 min vs 90 min
        if both GPUs used in parallel)
      - ExperimentTemplate.setup_gpu() was designed for GPU health checks but doesn't verify
        both GPUs are active or warn about idle GPUs

      The fix: DualGPUMonitor checks for zombie processes and idle GPUs at experiment start,
      logs warnings to the artifact, and exposes a clean API for ExperimentTemplate.setup_gpu().

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_template.py — ExperimentTemplate.setup_gpu() (existing implementation)
      - python/carnot/pipeline/ — existing pipeline modules (understand the structure)
      - results/operational_retro_2026_04_29.json — RETRO-002/003 details
      - results/experiment_325_hardening.json — Exp 325 outcome (if exists)

      TASK: Implement DualGPUMonitor and integrate into ExperimentTemplate.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-INFRA-003 (GPU zombie detection), REQ-INFRA-004 (dual GPU utilization check),
         and SCENARIO-INFRA-004/005/006 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - GPUProcessInfo dataclass: pid, gpu_index, vram_mb, utilization_pct, is_zombie
         - is_zombie: True when utilization_pct == 0 and vram_mb > 100
         - DualGPUMonitor.list_gpu_processes() → list[GPUProcessInfo]: parses nvidia-smi output
         - list_gpu_processes() returns empty list when nvidia-smi not available (CI-safe)
         - DualGPUMonitor.detect_zombies() → list[GPUProcessInfo]: filters is_zombie=True
         - DualGPUMonitor.check_dual_gpu_health() → dict: keys=n_gpus_detected, n_zombies,
           idle_gpus (list of gpu_index with 0 active processes), all_healthy bool
         - all_healthy: True only when n_gpus_detected >= 2 AND n_zombies == 0 AND
           len(idle_gpus) == 0
         - DualGPUMonitor.to_dict() for artifact serialization
         - ExperimentTemplate.setup_gpu() updated: calls DualGPUMonitor, adds gpu_monitor key
           to returned dict (never breaks existing callers; additive only)
         - CI-safe: when CARNOT_FORCE_LIVE=0, returns mock health dict with all_healthy=True
      4. Implement python/carnot/pipeline/dual_gpu_monitor.py:
         - GPUProcessInfo(pid, gpu_index, vram_mb, utilization_pct, is_zombie)
         - DualGPUMonitor():
           - _parse_nvidia_smi() → list[GPUProcessInfo]: runs
             `nvidia-smi --query-compute-apps=pid,gpu_index,used_memory --format=csv,noheader`
             and `nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader`
             Gracefully handles FileNotFoundError (nvidia-smi absent)
           - list_gpu_processes() → list[GPUProcessInfo]
           - detect_zombies() → list[GPUProcessInfo]: filter is_zombie=True
           - check_dual_gpu_health() → dict
           - to_dict() → dict
      5. Update ExperimentTemplate.setup_gpu() in scripts/experiment_template.py (additive):
         a. After existing GPU health check, instantiate DualGPUMonitor
         b. Add gpu_monitor_results = monitor.check_dual_gpu_health() to returned dict
         c. If not all_healthy AND CARNOT_FORCE_LIVE=1: log warning (don't fail, just warn)
         d. Preserve all existing return keys (no regressions)
      6. Export DualGPUMonitor, GPUProcessInfo from python/carnot/pipeline/__init__.py.
      7. Write scripts/experiment_326_dual_gpu_config.py using ExperimentTemplate(326, ...):
         a. Call setup_gpu() — record gpu_monitor_results in artifact
         b. Run check_dual_gpu_health()
         c. Build artifact: schema="carnot.dual_gpu_config.v1", gpu_monitor_results,
            retro_items_implemented=["RETRO-002", "RETRO-003"]
         d. Output: results/experiment_326_dual_gpu_config.json
      8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      9. Reconcile: update ops/conductor-log.md (RETRO-002/003 implemented),
         ops/changelog.md, ops/status.md
      10. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp327-dependency-audit
    milestone: "2026.05.06"
    deliverable: scripts/experiment_dependency_audit.py
    title: "Exp 327: Pre-experiment dependency audit tool (NEW-002)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: NEW-002 from the 2026.04.29 retrospective identified that experiments frequently
      fail when they assume prior experiment results exist (e.g., "load Exp 307 results from
      results/experiment_307_jepa_real_training.json") but those files are missing. This adds
      ~5% wall time overhead in retry loops. A pre-experiment dependency audit checks that all
      files listed under "EXISTING CODE TO READ FIRST" exist before the experiment begins.

      The audit tool parses an experiment prompt (from research-roadmap-next.yaml), extracts
      all file paths under "EXISTING CODE TO READ FIRST", checks each path for existence, and
      reports which are missing. When run as a conductor pre-hook, this creates a blocked
      artifact rather than a failed experiment — saving the full experiment turn budget.

      EXISTING CODE TO READ FIRST:
      - research-roadmap-next.yaml — experiment prompts with "EXISTING CODE TO READ FIRST" sections
      - scripts/experiment_template.py — ExperimentTemplate (understand the structure)
      - results/operational_retro_2026_04_29.json — NEW-002 rationale

      TASK: Implement pre-experiment dependency audit tool.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-INFRA-005 (dependency audit), SCENARIO-INFRA-007/008 to
         openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - DependencyAudit dataclass: experiment_id, required_files, missing_files, all_present bool
         - extract_required_files(prompt: str) → list[str]: parses lines between
           "EXISTING CODE TO READ FIRST:" and the next blank-line-plus-TASK heading
           Handles both absolute and relative file paths (relative to project_root)
         - extract_required_files(): returns [] for prompts with no "EXISTING CODE TO READ FIRST"
         - extract_required_files(): handles "{project_root}" placeholder substitution
         - check_dependencies(prompt, project_root) → DependencyAudit: calls extract, checks each
         - check_dependencies(): all_present=True when missing_files=[]
         - build_blocked_artifact(audit) → dict: includes missing_files, next_action advice
         - CLI: `python scripts/experiment_dependency_audit.py --exp-id 328 --prompt-file <path>`
           exits with code 0 when all_present, code 1 when missing_files non-empty
         - YAML loading: load_experiment_prompt(yaml_path, exp_id) → str (reads roadmap YAML)
      4. Implement scripts/experiment_dependency_audit.py:
         a. `extract_required_files(prompt: str, project_root: str) → list[str]`:
            - Find "EXISTING CODE TO READ FIRST:" line
            - Collect lines until empty line followed by non-indented line (or TASK:)
            - Strip `- ` bullet prefix and explanatory comments (text after " — " or " # ")
            - Substitute {project_root} with actual project_root
            - Return list of paths (relative paths resolved to absolute)
         b. `check_dependencies(prompt, project_root) → DependencyAudit`:
            - Call extract_required_files()
            - For each path: os.path.exists() check
            - Return DependencyAudit(required_files, missing_files, all_present)
         c. `load_experiment_prompt(yaml_path, exp_id) → str`:
            - Load YAML, find task with id containing exp_id
            - Return prompt string
         d. CLI: argparse with --exp-id, --prompt-file (or --yaml-path for YAML loading)
         e. On all_present: print "All {n} dependencies found."
         f. On missing: print each missing path, exit code 1
      5. Write scripts/experiment_327_dep_audit_results.py using ExperimentTemplate(327, ...):
         a. Run check_dependencies() on the first 3 prompts in research-roadmap-next.yaml
         b. For each: record audit result (all_present, missing_files count)
         c. Build artifact: schema="carnot.dependency_audit.v1", n_prompts_checked,
            n_all_present, n_missing_found, sample_audits (first 3 results)
         d. Output: results/experiment_327_dep_audit_results.json
      6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      7. Reconcile: update ops/conductor-log.md (NEW-002 implemented), ops/changelog.md, ops/status.md
      8. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp328-live-fullscale-benchmark
    milestone: "2026.05.06"
    deliverable: results/experiment_328_live_fullscale_results.json
    title: "Exp 328: Live GPU full-scale benchmark — run Exp 315 script on RTX 3090"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 315 wrote the full-scale benchmark script. Exp 316 executed it in
      simulated mode (inference_mode=simulated) because live GPU was unavailable. The
      simulation produced implausible results: Qwen3.5-0.8B at 34% and Gemma4-E4B-it
      at 30% — both wrong versus published baselines (25% and 80% respectively).

      Two RTX 3090 GPUs (48GB VRAM total) are now available via CUDA. This experiment
      executes scripts/experiment_315_fullscale_benchmark.py with CARNOT_FORCE_LIVE=1.
      All results must have inference_mode="live_gpu" to qualify as headline claims.

      Primary models:
      - Qwen3.5-0.8B: GPU 0. Published baseline: ~25% GSM8K.
      - google/gemma-4-E4B-it: GPU 1. Published baseline: ~80% GSM8K.

      If live inference fails (OOM, driver error), emit honest blocked artifact with
      exact error and GPU diagnostic info. Do NOT fall back to simulation and report
      as live.

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_315_fullscale_benchmark.py — the benchmark script to execute
      - results/experiment_316_fullscale_results.json — simulated baseline to compare against
      - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner
      - python/carnot/pipeline/dual_gpu_monitor.py — DualGPUMonitor (from Exp 326)

      TASK: Execute full-scale live GPU benchmark.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-BENCH-002 (live GPU benchmark result), SCENARIO-BENCH-003/004 to
         openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - load_live_benchmark_results(path) → dict: loads results JSON, validates schema
         - validate_live_result(result): raises ValueError if inference_mode != "live_gpu"
         - compare_to_simulated(live, simulated) → dict: delta per model per mode
         - compare_to_published_baseline(result, baselines) → dict: deviation from known values
         - published_baselines: {"Qwen3.5-0.8B": 0.25, "gemma-4-E4B-it": 0.80}
         - within_expected_range(accuracy, baseline, tolerance=0.15) → bool
         - artifact schema: experiment=328, inference_mode="live_gpu", n_total >= 100,
           per_model results with baseline_deviation, 95% Wilson CI per mode
         - honest: if GPU unavailable, blocked artifact with gpu_diagnostics not a fake result
      4. Execute scripts/experiment_315_fullscale_benchmark.py:
         a. [PRE-CHECK] Run DualGPUMonitor.check_dual_gpu_health(); if not healthy, document
         b. [SETUP] ExperimentTemplate(328, ..., requires_gpu=True).setup()
         c. [GPU PREWARM] Call setup_gpu() with both models before timed loop
         d. [EXECUTE] Run: CARNOT_FORCE_LIVE=1 python scripts/experiment_315_fullscale_benchmark.py
            Capture stdout/stderr; checkpoint after each 50-question batch
         e. [VALIDATE] Load result; verify inference_mode="live_gpu"
         f. [COMPARE] compute_compare_to_simulated(live_result, simulated_result)
            compare_to_published_baseline(live_result, published_baselines)
         g. [ARTIFACT] Build experiment_328 wrapper artifact:
            schema="carnot.live_fullscale_benchmark.v1",
            inference_mode="live_gpu",
            simulation_divergence (live vs Exp 316 delta per metric),
            baseline_deviation (live vs published),
            primary_result_path="results/experiment_316_fullscale_results_live.json"
         h. Output: results/experiment_328_live_fullscale_results.json
      5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      6. Reconcile: update ops/test-results.md, ops/changelog.md, ops/status.md,
         _bmad/traceability.md (REQ-BENCH-002 impl status)
      7. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp329-live-relay-benchmark
    milestone: "2026.05.06"
    deliverable: results/experiment_329_live_relay_results.json
    title: "Exp 329: Four-tier self-learning relay on live GPU"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 318 implemented the four-tier continuous self-learning relay benchmark
      (Tier 1 ConfidenceVerifier, Tier 2 ConstraintGenerator, Tier 3 JEPA gate, Z3 gate).
      It ran in simulated mode: improvement_1to3=-0.0606 (honest; simulated inference).
      The JEPA threshold (0.55) was from synthetic training, and the Z3 SAT rate (66.7%)
      came from a synthetic corpus.

      This experiment re-runs the relay on LIVE GPU inference (CARNOT_FORCE_LIVE=1) using
      Qwen3.5-0.8B on GPU 0 and Gemma4-E4B-it on GPU 1. The primary question: does the
      four-tier stack produce improvement_1to3 > 0 when using real model outputs?

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_318_self_learning_relay.py — relay script to execute on live GPU
      - results/experiment_318_self_learning_relay.json — simulated baseline (compare against)
      - python/carnot/pipeline/jepa_fast_path.py — JepaGate (from Exp 308)
      - results/experiment_308_jepa_gate_benchmark.json — JEPA best threshold
      - results/experiment_307_jepa_real_training.json — JEPA model training source

      TASK: Run four-tier relay with live GPU inference.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-LEARN-014 (four-tier relay live GPU validation), SCENARIO-LEARN-023/024
         to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - load_live_relay_results(path) → dict: loads artifact, validates schema
         - validate_relay_live(result): raises ValueError if inference_mode != "live_gpu"
         - compare_relay_to_simulated(live, simulated) → dict:
           keys: batch1_accuracy_delta, batch3_accuracy_delta, improvement_delta
         - primary_metric_honest: improvement_1to3 is signed, not clamped (SCENARIO-LEARN-022)
         - jepa_skip_rate_change: difference between live and simulated jepa_skip_rate
         - artifact schema: experiment=329, inference_mode="live_gpu", 3 batch results,
           improvement_1to3 (signed), simulation_comparison dict
      4. Execute on live GPU:
         a. [SETUP] ExperimentTemplate(329, ..., requires_gpu=True).setup()
         b. [GPU CHECK] DualGPUMonitor.check_dual_gpu_health()
         c. [EXECUTE] Run: CARNOT_FORCE_LIVE=1 python scripts/experiment_318_self_learning_relay.py
            Capture output; use 5-minute per-batch timeout (BatchedInferenceRunner pattern)
         d. [VALIDATE] Verify inference_mode="live_gpu" in output artifact
         e. [COMPARE] compute_compare_to_simulated(live_result, simulated_result)
         f. [ARTIFACT] Build experiment_329 wrapper:
            schema="carnot.live_relay_benchmark.v1",
            inference_mode="live_gpu",
            improvement_1to3 (signed, from live run),
            simulation_comparison, jepa_skip_rate_live
         g. Output: results/experiment_329_live_relay_results.json
      5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      6. Reconcile: update ops/test-results.md, ops/changelog.md, ops/status.md
      7. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp330-hf-live-publish
