  - id: exp5421-evidence-reliance-csl-v493
    milestone: "2026.07.493"
    title: "Continuous self-learning evidence-reliance drift and hidden-forgetting diagnostic"
    priority: critical
    track: self-learning
    deliverable: results/experiment_5421_evidence_reliance_csl_v493.json
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    estimated_wall_time_min: 90
    prior_failures:
      - experiment_id: exp5408-resource-accounted-csl-controller-v492
        verdict: "complete: resource_accounted_csl_ready=true with quality preservation, verifier-cost reduction, rollback, raw episodes, and no weight mutation"
        addressed_by: "This required CSL task adds evidence-reliance and hidden-forgetting diagnostics rather than rerunning resource accounting."
        retire_if_same_verdict: true
      - experiment_id: exp5409-uncertainty-gated-promotion-v492
        verdict: "complete: uncertainty_gated_promotion_ready=true with accepted reachable fragments, rejected unsupported fragments, rollback, and no weight mutation"
        addressed_by: "This task measures whether learned routing preserves evidence reliance before the next promotion scale-up."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      The research program requires at least one continuous self-learning experiment per milestone. Exp5408 and Exp5409 proved resource accounting and uncertainty-gated promotion without weight mutation. Recent hidden-forgetting work warns that scores can stay stable while evidence reliance drifts.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/results/experiment_5408_resource_accounted_csl_controller_v492.json
      - {project_root}/results/experiment_5409_uncertainty_gated_promotion_v492.json
      - {project_root}/scripts/experiment_template.py
      - {project_root}/tests/python

      TASK:
      Implement a continuous self-learning diagnostic that measures evidence-reliance drift and hidden forgetting while preserving the existing constraints: raw episodes retained, rollback available, no model-weight mutation, and deterministic verifiers authoritative.

      CONCRETE STEPS:
      1. Reuse the Exp5408/Exp5409 CSL controller pattern and build paired episodes where surface success can remain constant while grounding source, verifier dependency, or constraint evidence changes.
      2. Track routing decisions, learned-memory influence shares, raw episodes, resource cost, verifier calls, grounding source, and evidence-reliance labels before and after learning.
      3. Inject stale, poisoned, underspecified, and distribution-shift episodes. The controller should either abstain, route to verification, or retain as non-promoted evidence when reliance is uncertain.
      4. Measure hidden forgetting as evidence-reliance drift even when answer accuracy remains stable.
      5. Verify rollback restores prior routing and that no model weights are mutated.
      6. Add focused tests for drift detection, raw episode retention, rollback, and no-weight-mutation checks.
      7. Emit the deliverable JSON with REQUIRED ARTIFACT FIELDS:
         - episode_count: int  # principle: scale and coverage
         - raw_episodes_retained: bool  # principle: auditability
         - no_weight_mutation: bool  # principle: FR-11 boundary
         - rollback_verified: bool  # principle: safety recovery
         - quality_preserved: bool  # principle: no learning regression
         - resource_delta: number  # principle: resource-aware learning
         - verifier_cost_delta: number  # principle: verifier economy
         - reliance_drift_metric: number  # principle: hidden-forgetting signal
         - hidden_forgetting_detected: bool  # principle: explicit drift classification
