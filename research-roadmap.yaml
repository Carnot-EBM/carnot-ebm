milestone: 2026.08.589
milestone_title: Exact proof transport, active procedural memory, and independent live evidence
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp6755-lossless-gguf-output-reparse
  title: Lossless GGUF output boundary and 216-row reparse
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 60
  per_unit_rows: true
  milestone: 2026.08.589
  deliverable: results/experiment_6755_lossless_gguf_output_reparse.json
  prompt: |
    CONTEXT:
    Exp6745 retained all 216 planned SOTA proposal rows but labeled every row
    malformed_certificate. Direct inspection shows 216/216 raw_output values are Python byte
    literal envelopes such as b'SAT ...'. The frozen parser therefore sees b'SAT rather than SAT
    and returns unknown_claim. Recover this already-paid-for evidence before any new LLM run. This
    task tests transport normalization, not model quality, and it must not silently repair semantic
    errors.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md and
      {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_6745_sota_dual_encoding_proposal_corpus.json
    - {project_root}/results/experiment_6744_hardness_controlled_certificate_stream.json
    - {project_root}/python/carnot/experiment_6745_sota_dual_encoding_proposal_corpus.py
    - {project_root}/python/carnot/experiment_6745_certificate_encoder_a.py and
      {project_root}/python/carnot/experiment_6745_certificate_encoder_b.py
    - {project_root}/tests/python/test_experiment_6745_sota_dual_encoding_proposal_corpus.py
    - {project_root}/scripts/experiment_template.py and its output handling
    - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/conductor-log.md

    TASK:
    Add one explicit bytes-or-text GGUF output boundary and cold-reparse every frozen Exp6745 row.
    Preserve original receipts, reject ambiguous coercions, and distinguish transport recovery from
    exact semantic success. Do not invoke an LLM and do not alter Exp6745.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6745 to parse, contain exactly 216 unique rows, preserve nonempty
       original output hashes, and link to the ready Exp6744 stream. If a check fails, write
       complete_blocked_reparse_input atomically with the failed check and observed value in
       gate_check_summary, then stop.
    1. Confirm the relevant REQ-* anchors in
       openspec/capabilities/verifiable-reasoning/spec.md and
       openspec/capabilities/research-reporting/spec.md. Add only a narrow missing requirement and
       focused tests before implementation.
    2. Implement a shared output-text boundary that accepts str or bytes. Decode real bytes once as
       UTF-8 with explicit failure. For the frozen legacy rows, unwrap only a strict Python bytes
       literal whose safe parse returns bytes and whose canonical round-trip is unambiguous. Reject
       arbitrary expressions, nested literals, lossy replacement, or semantic edits.
    3. Add tests for single and double quotes, escapes, non-UTF-8 bytes, text that legitimately
       begins with b, malicious literal text, double wrapping, empty output, and idempotence.
    4. Replay all 216 rows through the original parser, both independent encoders, and the exact
       checker. Do not read the Exp6744 answer label while parsing or encoding. Preserve original
       text/hash and normalized text/hash in every row.
    5. Emit one rows entry per frozen proposal with model, family, source row, pre/post diagnosis,
       normalization kind, parse result, encoder agreement, exact outcome, and failure reason.
       Derive all aggregates from rows.
    6. Count invalid variable references, invalid clause references, non-binary values, duplicates,
       incomplete evidence, false parseable proofs, and exact-valid proofs. Set
       environment_grammar_targetable_rows to the row-derived count addressable by typed symbol,
       domain, uniqueness, or completeness constraints.
    7. Set transport_reparse_ready only when all 216 rows replay without evidence loss and cold
       aggregate recomputation matches. This readiness does not require a positive exact-valid rate.
    8. Run focused tests, lint, spec coverage, adversarial verification, and row-consistency lint.
    9. REQUIRED ARTIFACT FIELDS: field_principles (explanation for every required field, including
       itself), inference_substrate (frozen local row replay with no LLM), duration_s (monotonic wall
       time), random_seed (explicit fixed replay seed), reproducibility_checksum (input, code, and
       row-derived hash), source_artifact_sha256, rows (all 216 per-proposal receipts),
       pre_diagnosis_counts, post_diagnosis_counts, bytes_envelope_rows,
       transport_reparse_ready (lossless complete replay boolean),
       environment_grammar_targetable_rows (row-derived integer), exact_valid_rows,
       semantic_edits_performed (must be zero), gate_check_summary (failed check and observed value
       for any blocked_* verdict), verifier_is_oracle (false; exact checks evaluate replay but are
       not the transport mechanism), verdict_class (positive | circular_positive | null | blocked |
       disqualified | partial), and honest_verdict (allowed complete/success/passed/shipped prefix;
       use complete_blocked_<reason> for task-owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6755_lossless_gguf_output_reparse.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6745-sota-dual-encoding-proposal-corpus
      verdict: 'complete: all 216 attributable rows are ready; exact-valid is 0/216 and does not control readiness'
      addressed_by: 'This attempt does not regenerate or reprompt. It fixes the observed bytes-to-text boundary, preserves both hashes, and cold-reparses every paid-for row before adding a new decoding method.'
      retire_if_same_verdict: true

- id: exp6756-environment-indexed-proof-grammar-fixture
  title: Environment-indexed proof grammar runtime fixture
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 90
  per_unit_rows: true
  milestone: 2026.08.589
  deliverable: results/experiment_6756_environment_indexed_proof_grammar_fixture.json
  gated_on:
    - upstream: exp6755-lossless-gguf-output-reparse
      artifact_field: transport_reparse_ready
      op: '=='
      value: true
    - upstream: exp6755-lossless-gguf-output-reparse
      artifact_field: environment_grammar_targetable_rows
      op: '>='
      value: 24
  prompt: |
    CONTEXT:
    Exp6755 identifies the semantic failure mass left after lossless transport recovery. Decode-Time
    Grammars (arXiv 2607.18357) refine grammar fragments from a live environment so undefined
    symbols cannot be emitted. DCCD (arXiv 2603.03305v2) separates a semantic draft from constrained
    rendering. Carnot previously retired schema-supported ConstraintIR after zero exact semantics;
    this task uses a different mechanism: instance-bound variables, clause IDs, values, uniqueness,
    and prefix state enforced during decoding.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, section V589 Planner Refresh - 2026-08-29
    - {project_root}/results/experiment_6755_lossless_gguf_output_reparse.json
    - {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
    - {project_root}/python/carnot/experiment_6745_sota_dual_encoding_proposal_corpus.py
    - {project_root}/tests/python/test_experiment_1312_triggered_certificate_extraction_dccd_gbnf.py
    - {project_root}/tests/python/test_experiment_1352_truncproof_xgrammar_certificate_completion_preflight.py
    - {project_root}/tests/python/test_experiment_1339_xgrammar2_tagdispatch_certificate_grammar_dryrun.py
    - {project_root}/tests/python/test_experiment_1580_dccd_jsonschemabench_sota_structured_output_smoke.py
    - Primary sources arXiv 2607.18357 and 2603.03305v2.

    TASK:
    Build and adversarially test an environment-indexed runtime grammar for Carnot's proof DSL.
    Prove that the invoked runtime path preserves valid certificate support while making ghost
    variables, ghost clauses, non-binary values, duplicates, and incomplete terminal forms
    unreachable. Add a draft-conditioned rendering interface but do not run a SOTA comparison.

    CONCRETE STEPS:
    0. PRECONDITIONS: load Exp6755 and verify transport_reparse_ready=true and
       environment_grammar_targetable_rows>=24. Verify the local grammar backend and exact checker
       imports. On failure write complete_blocked_dynamic_grammar_fixture with gate_check_summary.
    1. Confirm or add narrow REQ-* anchors in
       openspec/capabilities/verifiable-reasoning/spec.md. Write focused tests first.
    2. Define a Gamma environment per CNF with the exact variable set, clause-ID set, binary value
       domain, claim branch, remaining required slots, and used-symbol state. Never include the
       answer label or exact-valid outcome in Gamma.
    3. Implement prefix-dependent policy resolution for SAT, UNSAT, and ABSTAIN. The runtime must
       record actual mask or grammar-policy invocations; a post-hoc parser filter is disqualified.
    4. Implement a draft-conditioned renderer that receives only a model draft and Gamma. It may
       copy semantic intent but may not call the exact checker, read an answer, or synthesize a
       ground-truth proof.
    5. Build exact-valid fixtures and attacks for undefined variables, out-of-range clauses,
       duplicates, non-binary values, premature stop, extra text, Unicode confusables, adversarial
       prefixes, and support-set collapse. Compare static CFG, environment-indexed, and
       draft-conditioned fixture behavior row by row.
    6. Prove at least one exact-valid SAT and UNSAT certificate remains reachable per supported size
       bin. Record the support receipt rather than claiming all valid proofs are enumerated.
    7. Set dynamic_proof_grammar_ready only if all runtime invocation, no-ghost, reachability,
       parser, exact-authority separation, and focused-test gates pass.
    8. Run focused tests, lint, spec coverage, adversarial verification, and row consistency.
    9. REQUIRED ARTIFACT FIELDS: field_principles, inference_substrate (invoked local runtime
       grammar fixture with no LLM), duration_s, random_seed, reproducibility_checksum,
       source_artifact_sha256, gamma_schema, rows (one row per mode, fixture, and attack),
       runtime_mask_invocation_count, no_ghost_violations, valid_sat_reachable,
       valid_unsat_reachable, support_contraction_receipts, exact_authority_features_in_grammar
       (must be empty), dynamic_proof_grammar_ready (all-gates boolean), gate_check_summary (failed
       check and observed value for blocked_*), verifier_is_oracle (false), verdict_class (positive |
       circular_positive | null | blocked | disqualified | partial), and honest_verdict (allowed
       complete/success/passed/shipped prefix; use complete_blocked_<reason> for task-owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6756_environment_indexed_proof_grammar_fixture.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp5923-sota-schema-supported-constraintir-ab
      verdict: 'retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates'
      addressed_by: 'The new path is not schema reprompting. It invokes an instance-bound prefix policy over variables, clauses, values, uniqueness, and completion, and it must prove exact-valid SAT and UNSAT support before any live run.'
      retire_if_same_verdict: true

- id: exp6757-dccd-environment-grammar-ab
  title: Three-model DCCD environment-grammar A/B
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.08.589
  deliverable: results/experiment_6757_dccd_environment_grammar_ab.json
  gated_on:
    - upstream: exp6756-environment-indexed-proof-grammar-fixture
      artifact_field: dynamic_proof_grammar_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6755 repairs the bytes-to-text boundary without semantic edits. Exp6756 supplies an invoked,
    instance-bound grammar fixture. This experiment tests whether static grammar or
    draft-conditioned environment-indexed grammar improves exact certificate yield on current local
    SOTA models. Parseability is not success. Exact semantic correctness remains the headline.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/scripts/experiment_template.py and cached_sota_pair()
    - {project_root}/results/experiment_6755_lossless_gguf_output_reparse.json
    - {project_root}/results/experiment_6756_environment_indexed_proof_grammar_fixture.json
    - {project_root}/results/experiment_6744_hardness_controlled_certificate_stream.json
    - {project_root}/results/experiment_6745_sota_dual_encoding_proposal_corpus.json
    - {project_root}/python/carnot/experiment_6745_sota_dual_encoding_proposal_corpus.py
    - {project_root}/tests/python/test_experiment_1580_dccd_jsonschemabench_sota_structured_output_smoke.py
    - Primary sources arXiv 2607.18357, 2603.03305v2, and 2607.17047.

    TASK:
    Run a paired three-arm, three-model live GGUF comparison on a frozen family- and
    hardness-stratified proof set. Compare repaired one-shot output, static grammar, and
    draft-conditioned environment-indexed grammar under matched total generation and exact-check
    budgets. Report exact-valid yield and semantic error, not syntax alone.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF: flagship MoE headline model.
    - unsloth/gemma-4-31B-it-GGUF: flagship dense headline model.
    - unsloth/gemma-4-26B-A4B-it-GGUF: middle MoE headline model.
    Resolve exact cached GGUF files with embedded tokenizers and llama.cpp CUDA offload. Load models
    sequentially and tear each down before the next. Legacy models may run only labeled CPU smoke
    tests and cannot satisfy any gate. Remote APIs cannot replace a missing local model.

    CONCRETE STEPS:
    0. PRECONDITIONS: verify dynamic_proof_grammar_ready=true, freeze at least 36 Exp6744 instances
       balanced across family, size, SAT/UNSAT, and relabel role, resolve all MODEL_SPECS, confirm
       hashes, tokenizer, CUDA offload, one-model-at-a-time VRAM, exact authority, task-owned lease,
       ports, RAM, and disk. On failure write complete_blocked_proof_transport_ab with
       gate_check_summary and no CPU or remote headline fallback.
    1. Confirm the relevant REQ-* anchors and add focused tests for arm matching, runtime invocation,
       row-derived metrics, teardown, and blocked artifacts before live execution.
    2. Freeze instance IDs, model order, arm order rotation, seeds, prompts, context, maximum total
       output tokens, draft/render token split, stop rules, temperatures, and exact-check budget.
    3. Run three arms per model-instance pair: repaired one-shot; static syntax grammar; and an
       unconstrained semantic draft followed by environment-indexed constrained rendering. The DCCD
       arm gets the same total token budget as other arms.
    4. Record real grammar-policy invocation counts. Disqualify a constrained arm if it falls back
       to post-hoc filtering, a canned fixture, a different model, or exact-answer-conditioned masks.
    5. Preserve raw output, output hash, normalized text, parsed proof, both encoder receipts, exact
       result, latency, tokens, device, peak VRAM, seed, stop reason, and failure for every row.
    6. Compute paired exact-valid delta, semantic-correct delta, parseability, abstention,
       invalid-reference rate, invalid-domain rate, support contraction, tokens, and latency by
       model, family, size, label, and relabel role. Do not treat solver conflicts as model hardness.
    7. Set proof_transport_ab_completed when every planned row is attributable and both cold
       aggregate recomputation and teardown pass, regardless of whether the scientific delta is
       positive.
    8. Run focused tests, lint, spec coverage, adversarial verification, and row-consistency lint.
    9. REQUIRED ARTIFACT FIELDS: field_principles, inference_substrate (local llama.cpp CUDA GGUF
       with invoked runtime grammar), duration_s, random_seed, reproducibility_checksum,
       models_used (exact hub IDs, paths, hashes, roles), live_model_invoked, frozen_manifest,
       gpu_receipts, rows (every model-instance-arm unit), runtime_mask_invocations_by_arm,
       exact_valid_rate_by_arm, semantic_correct_rate_by_arm, paired_exact_valid_deltas,
       support_contraction_by_arm, proof_transport_ab_completed (row-completeness boolean),
       claim_boundary (exact validity rather than parseability), gate_check_summary (failed check and
       observed value for blocked_*), verifier_is_oracle (false; exact authority evaluates outputs
       but is not an arm), verdict_class (positive | circular_positive | null | blocked |
       disqualified | partial), and honest_verdict (allowed complete/success/passed/shipped prefix;
       use complete_blocked_<reason> for task-owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6757_dccd_environment_grammar_ab.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6745-sota-dual-encoding-proposal-corpus
      verdict: 'complete: all 216 attributable rows are ready; exact-valid is 0/216 and does not control readiness'
      addressed_by: 'The baseline now uses the lossless output boundary, while the new arms invoke static or environment-indexed decoding and DCCD under a matched total token budget.'
      retire_if_same_verdict: true
    - experiment_id: exp5923-sota-schema-supported-constraintir-ab
      verdict: 'retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates'
      addressed_by: 'This is a proof DSL with runtime instance-bound symbol masks and exact-valid headline gates, not another schema-supported ConstraintIR prompt.'
      retire_if_same_verdict: true

- id: exp6758-proof-transport-independent-audit
  title: Independent proof-transport and support audit
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.5
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 75
  per_unit_rows: true
  milestone: 2026.08.589
  deliverable: results/experiment_6758_proof_transport_independent_audit.json
  gated_on:
    - upstream: exp6757-dccd-environment-grammar-ab
      artifact_field: proof_transport_ab_completed
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Structured generation can improve syntax while distorting semantic support. Exp6757 therefore
    needs a cold evaluator that does not import its parser, reducers, or exact-check implementation.
    This audit validates actual runtime invocation, matched budgets, exact semantics, leakage, and
    proof-preserving relabeling. It also determines whether a two-class panel exists for diagnostic
    energy; it does not force that panel to exist.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6757_dccd_environment_grammar_ab.json
    - {project_root}/results/experiment_6744_hardness_controlled_certificate_stream.json
    - {project_root}/results/experiment_6756_environment_indexed_proof_grammar_fixture.json
    - {project_root}/scripts/adversarial_verify.py and
      {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/research-references.md, V589 DCCD and Solver-Hard entries

    TASK:
    Independently replay every Exp6757 row. Verify exact outcomes, budget equality, runtime grammar
    use, no oracle leakage, support, and relabel invariance. Emit the exact diagnostic-panel gate
    fields consumed by Exp6759.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6757 to exist, parse, declare proof_transport_ab_completed=true,
       contain all frozen rows, and preserve raw hashes. On failure write
       complete_blocked_transport_audit with gate_check_summary.
    1. Confirm or add narrow audit requirements in
       openspec/capabilities/research-reporting/spec.md. Write independent evaluator tests first.
    2. Implement the cold parser and exact checker without importing Exp6755-Exp6757 parser,
       encoder, reducer, or checker functions. It may reuse only the frozen CNF input schema.
    3. Recompute parseability, exact validity, semantic correctness, invalid references,
       invalid-domain failures, abstention, paired arm deltas, and model/family/size strata from
       rows. Fail closed on disagreement with the producing artifact.
    4. Inspect prompts, Gamma receipts, mask traces, and feature manifests for answer labels,
       current-row exact outcomes, solver labels, or other oracle proxies. Record every prohibited
       feature check.
    5. Verify identical total token ceilings, context, seed policy, exact-check budget, and honest
       accounting for draft plus render tokens. Measure support contraction and harmful flips from
       baseline-valid rows.
    6. Verify proof-preserving relabel pairs do not change exact outcomes. Solver conflicts remain
       metadata and are not used as a model-difficulty conclusion.
    7. Set proof_transport_audit_ready only when independent replay, leakage, runtime invocation,
       and budget checks pass. Set diagnostic_panel_ready only when every held family has at least
       two diagnosis classes and there are at least 24 parseable exact-invalid rows.
    8. Run focused tests, lint, spec coverage, adversarial verification, and row consistency.
    9. REQUIRED ARTIFACT FIELDS: field_principles, inference_substrate (cold independent CPU exact
       replay), duration_s, random_seed, reproducibility_checksum, source_artifact_sha256, rows (one
       cold audit row per source unit), independent_parser_id, independent_exact_checker_id,
       aggregate_recomputation, paired_exact_valid_deltas, semantic_error_by_arm,
       support_contraction_by_arm, harmful_flips_by_arm, runtime_invocation_verified,
       prohibited_feature_findings, proof_transport_audit_ready (all-audit boolean),
       diagnosis_counts_by_held_family, parseable_exact_invalid_rows, diagnostic_panel_ready
       (two-class-and-size boolean), gate_check_summary (failed check and observed value for
       blocked_*), verifier_is_oracle (false; this is an evaluator audit, not a learned verifier
       claim), verdict_class (positive | circular_positive | null | blocked | disqualified |
       partial), and honest_verdict (allowed complete/success/passed/shipped prefix; use
       complete_blocked_<reason> for task-owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6758_proof_transport_independent_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6570-proof-obligation-independent-audit
      verdict: 'blocked_proof_obligation_independent_audit: provenance=not_recomputable; spans=not_replayable; compiler=not_replayable; exact_release=not_replayable; harm=not_recomputable; cost=not_recomputable; promotion=not_confirmed'
      addressed_by: 'Exp6757 is required to preserve raw output hashes, runtime-mask traces, frozen budgets, exact inputs, and per-unit rows; this audit independently replays those rows instead of auditing non-replayable source spans.'
      retire_if_same_verdict: true

- id: exp6759-oracle-distinct-diagnostic-energy-v2
  title: Held-family oracle-distinct diagnostic energy v2
  track: energy-models
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.08.589
  deliverable: results/experiment_6759_oracle_distinct_diagnostic_energy_v2.json
  gated_on:
    - upstream: exp6758-proof-transport-independent-audit
      artifact_field: proof_transport_audit_ready
      op: '=='
      value: true
    - upstream: exp6758-proof-transport-independent-audit
      artifact_field: diagnostic_panel_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6746 gate-blocked because every held-family row was labeled malformed_certificate. Exp6758
    opens this branch only after independent replay proves at least two diagnosis classes per held
    family and at least 24 parseable exact-invalid rows. The research question is whether structural
    features can diagnose reasoning error without reading exact outcomes or answer proxies.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6758_proof_transport_independent_audit.json
    - {project_root}/results/experiment_6746_oracle_distinct_diagnostic_energy.json
    - {project_root}/results/experiment_6744_hardness_controlled_certificate_stream.json
    - {project_root}/python/carnot/experiment_6746_oracle_distinct_diagnostic_energy.py
    - {project_root}/tests/python/test_experiment_6746_oracle_distinct_diagnostic_energy.py
    - {project_root}/research-references.md, V589 Solver-Hard and Decode-Time Grammars entries

    TASK:
    Train and evaluate a compact structural diagnostic energy on audited proof rows. Compare
    dual-encoding structure, single-encoding structure, and an undifferentiated scalar baseline on
    family-disjoint tests and proof-preserving relabel pairs. Keep the learned verifier distinct
    from exact authority.

    CONCRETE STEPS:
    0. PRECONDITIONS: require proof_transport_audit_ready=true, diagnostic_panel_ready=true, at
       least two diagnosis classes per held family, at least 24 parseable exact-invalid rows, sealed
       family splits, and available compact-model dependencies. On failure write
       complete_blocked_diagnostic_energy_v2 with gate_check_summary.
    1. Confirm or add narrow REQ-* anchors in
       openspec/capabilities/energy-based-models/spec.md and
       openspec/capabilities/verifiable-reasoning/spec.md. Write focused leakage, split, reducer,
       and determinism tests first.
    2. Freeze train/dev/test by family before training. Keep all proof-preserving relabel pairs in
       the same split. Use at least six seeds or a paired bootstrap with an explicit seed schedule.
    3. Permit only pre-oracle structural features such as prefix position, grammar rejection kind,
       typed-slot state, encoder agreement structure, and certificate-shape counts. Deny answer
       labels, SAT/UNSAT truth, exact-valid bits, exact-check traces, solver conflicts, source
       answer fields, and repair outcomes.
    4. Fit matched-capacity dual-encoding, single-encoding, and scalar baselines. No model may use
       hidden access unavailable on the local GGUF substrate.
    5. Emit one rows entry per held unit, seed, and arm with score, target diagnosis, family, size,
       relabel pair, feature-manifest hash, and prediction. Derive AUROC, AUPRC, calibration, and
