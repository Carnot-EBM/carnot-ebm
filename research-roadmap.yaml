      EXISTING CODE TO READ FIRST:
        - python/carnot/verify/
        - results/experiment_1767_fover_roce_expansion.json

      TASK: Build a deterministic ROCE-to-KAN compiler.

      CONCRETE STEPS:
        1. Write a compiler that maps 20 simple temporal/numeric ROCE constraints to KAN B-spline or polynomial bases.
        2. Run 100 evaluations where the KAN representation accurately separates valid from invalid states with zero false accepts compared to a reference PySAT oracle.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.roce_kan_compiler.v1"
        - experiment: 1769
        - run_date: "{date}"
        - compile_success_rate: float
