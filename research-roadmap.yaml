        - energy ties/loses on a discriminating corpus -> "complete: p01_route1_terminally_bounded_energy_competitive_not_superior_to_strong_classical_beats_only_AR_solve_SS_vs_strong_TT_p_PP"
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3551_p01_graph_coloring_terminal_discriminating_corpus_v3.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

