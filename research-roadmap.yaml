  - id: exp332-confidence-weighted-repair
    milestone: "2026.05.06"
    deliverable: python/carnot/pipeline/confidence_weighted_repair.py
    title: "Exp 332: Confidence-weighted constraint violations — only repair high-confidence"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 331 identified the primary false positive category in verify-repair.
      The research-program.md describes the fix: "Instead of binary violated/not-violated,
      weight constraint violations by confidence. A '47+28=76' violation is high-confidence
      (definitely wrong). A 'the intermediate result is approximately 150' is low-confidence.
      Only repair high-confidence violations."

      The arXiv 2504.13134 (EBM Reward Models) paper proposes partition function variance
      as a confidence signal — high variance across Gibbs samples = uncertain constraint.
      This experiment implements confidence-weighted repair using two signals:
        1. Violation expression specificity (exact number vs approximate) → expression_confidence
        2. Ising sampler variance across multiple samples → energy_variance_confidence

      EXISTING CODE TO READ FIRST:
      - results/experiment_331_fp_autopsy.json — primary FP category and recommended fix
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (integration target)
      - python/carnot/pipeline/extract.py — ConstraintViolation dataclass (confidence field?)
      - python/carnot/samplers/parallel_ising.py — ParallelIsingSampler (multi-sample variance)
      - python/carnot/verify/ — ConstraintTerm, ComposedEnergy (understand verify flow)

      TASK: Implement confidence-weighted constraint violations.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-VERIFY-082 (confidence-weighted violations), REQ-VERIFY-083 (partition function
         variance confidence), SCENARIO-VERIFY-109–112 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - ViolationConfidence dataclass: expression_confidence, energy_variance_confidence,
           combined_confidence (geometric mean); is_high_confidence (combined >= threshold)
         - compute_expression_confidence(violation_text: str) → float in [0, 1]:
           exact arithmetic expression (e.g., "47+28=76") → 0.95
           approximate/qualitative (e.g., "approximately 150") → 0.30
           integer mismatch with specific values → 0.80
           no numeric content → 0.10
         - compute_energy_variance_confidence(energies: list[float]) → float:
           low variance (stable samples) → high confidence (samples agree violation is real)
           high variance (unstable) → low confidence (may be noise)
         - ConfidenceWeightedRepair.repair(question, response, domain, min_confidence=0.8):
           only triggers repair when combined_confidence >= min_confidence
         - ConfidenceWeightedRepair returns ConfidenceRepairResult with:
           violations_found, violations_above_threshold, repair_triggered, improvement
         - benchmark: 30 questions, compare n_repairs_triggered with confidence filter vs
           without; count how many correct responses avoided unnecessary repair
      4. Implement python/carnot/pipeline/confidence_weighted_repair.py:
         - ViolationConfidence(expression_confidence, energy_variance_confidence, min_confidence)
         - compute_expression_confidence(violation_text: str) → float:
           Uses regex to detect exact arithmetic expressions, score by specificity
         - compute_energy_variance_confidence(energies: list[float]) → float:
           coefficient_of_variation = std(energies) / (mean(energies) + 1e-8)
           confidence = 1 / (1 + coefficient_of_variation)
         - ConfidenceRepairResult dataclass with all fields above
         - ConfidenceWeightedRepair(pipeline, n_samples=5, min_confidence=0.8):
           repair(question, response, domain) → ConfidenceRepairResult:
           1. Run extractor to get violations
           2. For each violation: compute expression_confidence
           3. Run Ising n_samples times to get energy distribution → energy_variance_confidence
           4. Only repair if combined_confidence >= min_confidence
      5. Add additive VerifyRepairPipeline.verify_repair_confidence_weighted() integration.
      6. Export from python/carnot/pipeline/__init__.py.
      7. Write scripts/experiment_332_confidence_repair.py using ExperimentTemplate(332, ...):
         a. 30-question benchmark: with and without confidence filter
         b. Primary metric: n_false_positives_avoided (correct responses not repaired)
         c. Secondary metric: n_true_positives_preserved (wrong responses still repaired)
         d. Output: results/experiment_332_confidence_repair.json
      8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      9. Reconcile: update ops/changelog.md, ops/status.md, _bmad/traceability.md
      10. Do NOT push. Do NOT modify scripts/research_conductor.py.

