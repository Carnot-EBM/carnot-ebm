      - CODEX.md
      - results/experiment_3210_context_cot_clbench_parametric_shortcut_fixtures_v1.json
      - results/experiment_3211_constraintbench_feasibility_objective_pilot_v1.json
      - results/experiment_3182_ebm_logit_residual_rescue_v1.json
      - research-references.md
      - scripts/experiment_template.py

      TASK
      Build an exact-row uncertainty sidecar that can triage context and constraint fixtures by abstention risk, model-identity shortcut risk, and solver-disagreement risk.

      CONCRETE STEPS
      1. Load `.297` context and ConstraintBench fixture artifacts.
      2. Define a small distributional-energy-style sidecar over exact rows using deterministic features already available in artifacts, such as satisfiability, objective gap, contradiction flags, context-dependency labels, and solver row metadata.
      3. Produce uncertainty, abstention, and shortcut-risk fields per fixture without invoking an LLM.
      4. Run a negative-control audit that checks whether sidecar risk is dominated by model identity or artifact source rather than row difficulty.
      5. Define how exp3225 should consume the sidecar as triage metadata while preserving exact verifier scoring.
      6. Write `results/experiment_3223_distributional_ebm_exact_row_uncertainty_sidecar_v2.json`.

