    headline_result_allowed=false.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1282_sota_gguf_cache_provenance_preflight.json
    - results/experiment_1283_certificate_grammar_backend_bakeoff.json
    - results/experiment_1284_ars_uqlm_answer_stability_sota_audit.json
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - python/carnot/pipeline/extract.py
    - results/fover_corpus_v5.json

    TASK:
    Run 30-50 prompt triggered-certificate extraction with local SOTA GGUF models.
    The response should answer normally, then emit a bounded <CARNOT_CERT> tail.

    CONCRETE STEPS:
    1. Create the deliverable artifact immediately with status="in_progress".
    2. Resolve SOTA MODEL_SPECS via cached_sota_pair() and use the selected grammar backend from exp1283 where possible.
    3. Generate or replay 30-50 FoVer/GSM8K prompts across three modes: raw trigger, grammar-only, and DCCD-style draft-conditioned certificate.
    4. Parse certificate tails and verify claims/equations/final_answer with existing Z3/SymCode/FoVer helpers when available.
    5. Compute certificate_parse_rate, verified_claim_coverage, false_positive_rate, answer_reasoning_consistency_score, grammar_projection_tax_proxy, solver_vs_certificate_delta, formalizer_failure_modes, models_used, headline_result_allowed, and batch_log.
    6. Write terminal status and honest_verdict: certificate_extraction_viable, certificate_extraction_partial, blocked_no_sota_gguf, or smoke_only_not_headline.

    Run: python3 -c "import json; d=json.load(open('results/experiment_1285_triggered_certificate_extraction_v2.json')); print(d.get('honest_verdict'), d.get('certificate_parse_rate'), d.get('headline_result_allowed'))"
