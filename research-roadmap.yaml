      EXISTING CODE TO READ FIRST:
        - python/carnot/models/ (the new PiNet layer)
        - python/carnot/pipeline/ (the new CLaRa schema)

      TASK: Execute a synthetic constraint verification using CLaRa-V states and the PiNet projection.

      CONCRETE STEPS:
