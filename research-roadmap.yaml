- id: exp611-flip-reward-fr11-v5
  milestone: 2026.04.46
  deliverable: results/experiment_611_flip_fr11_v5.json
  title: 'Exp 611: FLIP Backward Inference + FR-11 Real Violations v5 (Tier 1 Self-Learning, Mandatory)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: FR-11 self-learning\
    \ requires repair quality scoring. The current binary correct/incorrect verdict\
    \ after repair is a weak signal. FLIP (arXiv 2602.13551) backward inference:\
    \ given a repaired response, infer the original constraint it was satisfying —\
    \ if the repair introduced a constraint-inconsistent change, FLIP detects it.\
    \ Also: ConstraintAdditionFromMemory has been running but with no feedback on\
    \ whether the added constraints REDUCED false positives. This experiment connects\
    \ violation data from Exp 609 (if available) to FR-11 relay and adds FLIP scoring.\
    \ FR-11 MANDATORY.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/constraint_addition.py\
    \ — ConstraintAdditionFromMemory (read current state)\n- python/carnot/pipeline/mise_calibrator.py\
    \ — MISECalibrator (from Exp 597)\n- results/experiment_609_live_vr_coace_v4.json\
    \ — n_violations_found, repair triples (if exists)\n- results/experiment_597_fr11_real_violations_v4.json\
    \ — prior FR-11 attempt\n- results/fover_corpus_v4.json — live corpus for synthetic\
    \ fallback\n\nTASK: Implement FLIPRewardCalibrator + run FR-11 relay.\n1. Read\
    \ CLAUDE.md spec-first workflow.\n2. Add REQ-LEARN-076 (FR-11: FLIP backward\
    \ inference for repair quality scoring, arXiv 2602.13551), REQ-LEARN-077\
    \ (FR-11: real violations relay v5 from Exp 609 or synthetic fallback),\
    \ SCENARIO-LEARN-115/116/117 to openspec/capabilities/autoresearch/spec.md.\n\
    3. Create python/carnot/pipeline/flip_calibrator.py:\n   a. FLIPRepairTriple dataclass:\
    \ question (str), original (str), repaired (str | None),\n      verdict_correct\
    \ (bool), flip_score (float | None).\n   b. FLIPRewardCalibrator class:\n      -\
    \ __init__(self, embed_fn: callable).\n      - backward_inference_score(self, response:\
    \ str, question: str) -> float:\n          'What constraint was this response satisfying?'\n\
    \          Compute cosine similarity: embed(response) · embed(question) / (|embed(response)|\
    \ * |embed(question)|).\n          Returns float 0..1. Higher = response well-aligned\
    \ to question's constraints.\n      - calibrate_repair(self, triple: FLIPRepairTriple)\
    \ -> FLIPRepairTriple:\n          If repaired is not None:\n            flip_score\
    \ = backward_inference_score(repaired, triple.question).\n            If flip_score\
    \ > backward_inference_score(triple.original, triple.question):\n              # Repair\
    \ improved constraint alignment.\n              triple.flip_score = flip_score\n\
    \          Else: triple.flip_score = None.\n          Return triple.\n      - batch_calibrate(self,\
    \ triples: list[FLIPRepairTriple]) -> dict:\n          Returns ('mean_flip_score':\
    \ float, 'n_improved': int, 'repair_quality': 'good'|'neutral'|'bad').\n   c. Export\
    \ FLIPRewardCalibrator, FLIPRepairTriple from carnot.pipeline.__init__.\n4. Write\
    \ scripts/experiment_611_flip_fr11_v5.py:\n   a. apply_env_autofix() FIRST; from\
    \ python.carnot.pipeline.live_assertion import assert_live_or_ci_skip;\
    \ assert_live_or_ci_skip().\n   b. ExperimentTimeoutWatchdog(611, timeout_minutes=30).\n\
    \   c. ExperimentTemplate(611, 'FLIP + FR-11 Real Violations v5',\n      'results/experiment_611_flip_fr11_v5.json',\
    \ requires_gpu=False).\n   d. Load violations: Try results/experiment_609_live_vr_coace_v4.json\
    \ (n_violations_found > 0). Else load from results/experiment_597_fr11_real_violations_v4.json.\
    \ Else use 10 synthetic violations from fover_corpus_v4.json (labeled synthetic_fallback).\n\
    \   e. If n_live_violations >= 5: run ConstraintAdditionFromMemory.hisr_weighted_add()\
    \ on live violations (use_hisr=True from Exp 610 wire-in).\n   f. Build FLIPRepairTriple\
    \ list from available (question, original, repaired, verdict) triples.\n   g. Run\
    \ FLIPRewardCalibrator(embed_fn=lambda x: jnp.array([hash(w)%128 for w in x.split()[:128]]))\n\
    \      .batch_calibrate(triples).\n   h. fr11_real_violations_confirmed = n_live_violations\
    \ >= 5.\n   i. Build artifact: schema='carnot.flip_fr11_v5.v1',\n      n_live_violations=<int>,\
    \ violations_source='exp609' or 'exp597' or 'synthetic_fallback',\n      constraints_added=<int>,\
    \ fp_rate_before=<float>, fp_rate_after=<float>,\n      flip_mean_score=<float>,\
    \ flip_n_improved=<int>, flip_repair_quality=<str>,\n      fr11_real_violations_confirmed=<bool>,\n\
    \      honest_verdict='real_violations_improved' if (fr11_real_violations_confirmed\
    \ and fp_rate_after<fp_rate_before)\
    \ else 'real_violations_no_improvement' if fr11_real_violations_confirmed\
    \ else 'synthetic_fallback'.\n   j. tmpl.assert_deliverable_written() as FINAL LINE.\n\
    5. Write tests/python/test_flip_calibrator.py (100% coverage on flip_calibrator.py).\n\
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile:\
    \ _bmad/traceability.md (FR-11 status), ops/conductor-log.md, ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"

- id: exp612-fact-e-pbit-ising
  milestone: 2026.04.46
  deliverable: results/experiment_612_fact_e_pbit.json
  title: 'Exp 612: FACT-E Causal Faithfulness Probe + Synchronous p-bit Ising RTL (arXiv 2604.10693 + 2604.01564)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Two independent\
    \ research experiments combined. (1) FACT-E (arXiv 2604.10693): causal faithfulness\
    \ probe that detects logically disconnected CoT steps via controlled perturbations —\
    \ extends Carnot's verifier from arithmetic correctness to logical faithfulness.\
    \ Catches errors where numbers add up but the reasoning chain is non-sequitur.\
    \ (2) Synchronous p-bit Ising machine (arXiv 2604.01564): 50% FPGA area reduction\
    \ by replacing asynchronous update schedule with synchronous-DAC-free design while\
    \ preserving annealing dynamics. Directly applicable to KV260 Verilog RTL\
    \ (hardware/kv260/ising_sampler_v1.v).\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/verify_repair.py\
    \ — VerifyRepairPipeline (FACT-E as auxiliary energy signal)\n- hardware/kv260/ising_sampler_v1.v\
    \ — current asynchronous Ising RTL\n- hardware/kv260/synth_ising.tcl — synthesis\
    \ script\n- results/experiment_585_kv260_live_benchmark_v3.json — blocked_no_bitfile\
    \ status\n- results/experiment_612 does not exist yet\n\nTASK: Implement FACT-E\
    \ faithfulness probe + update Ising RTL to synchronous architecture.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Add REQ-VERIFY-145 (FACT-E causal faithfulness probe\
    \ as Tier 3.5 advisory signal, arXiv 2604.10693), REQ-SAMPLE-030 (synchronous\
    \ p-bit Ising RTL per arXiv 2604.01564), SCENARIO-VERIFY-175/176, SCENARIO-SAMPLE-045\
    \ to spec.\n3. Create python/carnot/pipeline/fact_e_probe.py:\n   a. CausalStepDependency\
    \ dataclass: step_a (str), step_b (str), dependency_score (float),\n      is_causally_connected\
    \ (bool).\n   b. FACTEFaithfulnessProbe class:\n      - __init__(self, threshold:\
    \ float = 0.3).\n      - _perturb_step(self, step: str) -> str:\n          * Replace\
    \ numeric values with random alternatives (± 20%).\n          * Return perturbed step.\n\
    \      - measure_dependency(self, step_a: str, step_b: str) -> CausalStepDependency:\n\
    \          * Count numeric tokens shared between step_a and step_b.\n          *\
    \ Perturb step_a. Check if step_b's numeric claims change proportionally.\n   \
    \       * dependency_score = count_shared_numeric_tokens(step_a, step_b) / max(1,\
    \ len(step_b_numeric_tokens)).\n          * is_causally_connected = dependency_score\
    \ >= self.threshold.\n      - faithfulness_score(self, response: str) -> float:\n\
    \          * Split into steps. Compute mean dependency_score across consecutive\
    \ step pairs.\n          * Returns float 0..1. Low score = many disconnected\
    \ reasoning steps.\n   c. Export FACTEFaithfulnessProbe, CausalStepDependency\
    \ from carnot.pipeline.__init__.\n4. Update hardware/kv260/ising_sampler_v2.v\
    \ (NEW FILE — do not modify v1):\n   a. Copy ising_sampler_v1.v as starting point.\n\
    \   b. Convert asynchronous random-order spin updates to SYNCHRONOUS:\n      *\
    \ Add global clock domain: `always @(posedge clk) begin ... end`\n      * Each\
    \ cycle: ALL spins update simultaneously based on current state (checkerboard\
    \ or parallel update).\n      * Remove random spin-selection logic (DAC-free design).\n\
    \   c. Add header comment explaining: 'Synchronous p-bit Ising sampler per arXiv\
    \ 2604.01564. Reduces LUT utilization ~50% vs asynchronous by eliminating DAC\
    \ and random-order logic. All spins update in lockstep each clock cycle.'\n5.\
    \ Write scripts/experiment_612_fact_e_pbit.py:\n   a. apply_env_autofix() FIRST;\
    \ from python.carnot.pipeline.live_assertion import assert_live_or_ci_skip;\
    \ assert_live_or_ci_skip().\n   b. ExperimentTimeoutWatchdog(612, timeout_minutes=25).\n\
    \   c. ExperimentTemplate(612, 'FACT-E + Synchronous p-bit Ising',\n      'results/experiment_612_fact_e_pbit.json',\
    \ requires_gpu=False).\n   d. FACT-E test: load 25 incorrect + 10 correct live\
    \ responses from results/live_pairs_578.json.\n      Run FACTEFaithfulnessProbe.faithfulness_score()\
    \ on all. Record mean scores by label.\n      causal_gap = mean_faithful_correct\
    \ - mean_faithful_incorrect.\n      probe_viable = causal_gap > 0 (correct responses\
    \ are more causally faithful).\n   e. Synchronous Ising RTL test: verify hardware/kv260/ising_sampler_v2.v\
    \ exists and contains 'posedge clk'. Count LUT-equivalent lines as proxy for\
    \ area estimate.\n   f. Build artifact: schema='carnot.fact_e_pbit.v1',\n      fact_e_mean_faithful_correct=<float>,\
    \ fact_e_mean_faithful_incorrect=<float>,\n      causal_gap=<float>, probe_viable=<bool>,\n\
    \      synchronous_rtl_created=True, rtl_path='hardware/kv260/ising_sampler_v2.v',\n\
    \      asynchronous_lines=<int>, synchronous_lines=<int>,\
    \ area_reduction_estimate='~50%' if synchronous_lines < asynchronous_lines * 0.7\
    \ else 'smaller_than_expected',\n      honest_verdict='fact_e_viable_rtl_updated'\
    \ if probe_viable else 'fact_e_no_signal_rtl_updated'.\n   g. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n6. Write tests/python/test_fact_e_probe.py (100% coverage on\
    \ fact_e_probe.py).\n7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    8. Reconcile: research-hardware-wishlist.md (add synchronous Ising RTL note),\
    \ _bmad/architecture.md (Tier 3.5 advisory), ops/conductor-log.md, ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
