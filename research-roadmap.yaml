- id: exp1519-116-completion-archive-117-activation
  milestone: 2026.04.117
  deliverable: results/experiment_1519_116_completion_archive_117_activation.json
  title: ".116 Completion Archive + .117 Activation Manifest"
  agent_type: codex
  model: gpt-5.5
  max_turns: 20
  estimated_wall_time_min: 25
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1506-115-completion-archive-116-activation
      verdict: prior_milestone_activation_manifest_scope
      addressed_by: "This is expected per-milestone activation bookkeeping for .117; it archives .116 completion and exposes same-roadmap gate fields for downstream runtime-contract, FR-11, and THRML tasks."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Milestone .116 completed all 13 planned tasks. It proved bounded safe-DSL
    verifier induction, trigger+grammar certificate decoding, executable
    monitor normalization, structural contract detection, FR-11 policy replay
    and rollback, THRML simulator conformance, KAN shape normalization, and
    KV260 source-level RTL properties. It also exposed one weak branch:
    product-line solver-oracle parsing and feasibility remained poor. Use
    {project_root} as the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - research-roadmap.yaml
    - research-complete.yaml
    - research-references.md
    - ops/known-issues.md
    - ops/conductor-log.md
    - ops/changelog.md
    - ops/status.md
    - results/experiment_1518_milestone_116_retro.json

    TASK:
    Write the .116 completion archive and .117 activation manifest. Do not
    modify research-roadmap.yaml or scripts/research_conductor.py.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - predecessor_milestone
    - predecessor_criteria_met
    - predecessor_criteria_total
    - activation_manifest_complete
    - prior_runtime_contract_ready
    - prior_fr11_rollback_ready
    - prior_product_line_benchmark_ready
    - prior_thrml_conformance_ready
    - prior_kan_shape_manifest_ready
    - prior_kv260_property_pack_ready
    - research_complete_has_116_entry
    - mandated_sota_models
    - continuous_self_learning_required
    - allowed_117_tracks
    - gated_117_tracks
    - retired_headline_signals
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1519_116_completion_archive_117_activation.json immediately with status="in_progress".
    2. Read exp1518, research-complete.yaml, conductor log entries for exp1506 through exp1518, ops/status.md, ops/changelog.md, and ops/known-issues.md.
    3. Verify that exp1518 reports 13 of 13 criteria met. Record whether research-complete.yaml already has a 2026.04.116 entry.
    4. Write ops/milestone_117_activation_manifest.md with allowed tracks: runtime-contract E2E, live SOTA contract-guided repair, CDG root-cause repair, product-line rescue/retirement, FR-11 live policy promotion, MARCH-style claim isolation, and THRML/Carnot parity scaling.
    5. Expose same-roadmap gate fields for downstream tasks. Set prior_runtime_contract_ready=true only if exp1507, exp1508, exp1509, and exp1510 completed with zero false accepts. Set prior_fr11_rollback_ready=true only if exp1512 and exp1513 completed with zero soundness mistakes. Set prior_product_line_benchmark_ready=true if exp1511 produced the product-line manifest, even if weak. Set prior_thrml_conformance_ready=true only if exp1515 completed simulator-only conformance.
    6. Preserve blocks on Semantic Energy/logit telemetry headline claims, pairwise LLM verifier headline claims, arbitrary generated-Python verifier trust, TSU hardware claims, KV260 board claims, KAN synthesis claims, and legacy small-model headline results.
    7. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.
    8. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1519_116_completion_archive_117_activation.json')); print(d.get('activation_manifest_complete'), d.get('prior_runtime_contract_ready'), d.get('prior_fr11_rollback_ready'), d.get('prior_thrml_conformance_ready'), d.get('honest_verdict'))"
