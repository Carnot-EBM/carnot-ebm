milestone: 2026.06.401
milestone_title: "SETTLE the in-generation oracle-distinct verifier-moat with a LEAK-ROBUST partial-state scorer (the .400 replication FAILED at the leak check -> replicate-or-RETIRE) + drive the FIRST E3 ARC solve with explore-verify-plan. .400 was DEPTH on every proven-or-mandated direction and came back mostly NULL/PARTIAL (exp4335 capstone, verifier_thesis_state=in_generation_moat_corpus_specific): the in-generation moat DID NOT replicate -- the exp4292 partial-state scorer LEAKED on a 2nd corpus (exp4325 scorer_leak_recheck_passed=false), so the .399 'first oracle-distinct win' is in DOUBT and the DiffusionGemma gate stays STILL_PENDING; adaptive scale-up bounded to post-hoc stitching (exp4326 CI95 incl 0); E3 deep tail 0 solves but ar25 CLOSE (0.89 verifier accuracy, plan_executed=false -- planned before verifying mechanics); self-learning cross-game transfer NULL again (exp4331 learned frame encoder, reduction 1.008); shallow tail no-advance (ARC stays 13 reproducible / 11 games); paper_ready=True (FoVer 0.9131, G1-G4). .401 is DEPTH on the diagnosed root causes (north-star §1): (A) HEADLINE -- BUILD a DiNa-LRM leak-robust partial-state scorer (2602.11146) gated on an ANSWER-CELL-MASKED leak audit across >=2 corpora, THEN re-run the 2nd-corpus moat gate -> replicate (gate flips) or RETIRE (corpus-specific). (B) ARC NORTH STAR -- the FIRST E3 solve: ar25 (closest) + ka59 via AERA explore-verify-plan (2605.25931) + Agent2World adaptive testing (2512.22336); sc25 reproduction via E3 (the biggest reproducible-level upside, +1..+5). (D) SELF-LEARNING -- ReactiveGWM action-role interaction features (2605.15256) for cross-game search-value transfer. Cross-domain selection stays RETIRED (exp4314)."
milestone_doc: openspec/change-proposals/research-roadmap-v401.md
milestone_overview: |
  .400 tested every depth bet and came back mostly negative -- the single most important finding is that the
  in-generation moat (the project's ONE oracle-distinct win, .399 exp4315) did NOT replicate because the exp4292
  partial-state scorer LEAKED on a 2nd corpus (exp4325). The .399 win may have depended on a scorer that recovers
  answer cells from position cues. .401 SETTLES this and drives the first E3 ARC solve (north-star §1 Depth-Over-Breadth):

    PHASE 0 -- TRANSITION: exp4336 archive .400 -> activate .401; record the TRUE .400 close-state.

    PHASE A -- HEADLINE (SETTLE the in-generation moat; replicate-or-RETIRE -> the DiffusionGemma gate):
      A1 (exp4337) BUILD a DiNa-LRM-style LEAK-ROBUST partial-state reward scorer (2602.11146): a timestep-conditioned
        reward head trained on noisy/masked DiffusionGemma canvases. HARD gate: it stays oracle-distinct UNDER
        ANSWER-CELL MASKING on >=2 corpora (the diagnosed fix for exp4325's leak). verifier_is_oracle=false.
      A2 (exp4338, GATED on A1 scorer_leak_audit_passed==true) RE-RUN the in-generation moat replication on the 2nd
        corpus with the leak-robust scorer, EXACT exp4315 harness at n>=80/arm + >=3 seeds. Emit
        in_generation_moat_replicates BARE bool -> DECIDES the gate. retire_if_same_verdict: true (a powered
        failure-to-replicate even WITH a leak-robust scorer RETIRES the in-generation moat as corpus-specific).
        verifier_is_oracle=false.

    PHASE B -- ARC NORTH STAR (operator MANDATORY 2026-06-17): the FIRST E3 solve via explore-verify-plan:
      B1 (exp4339) E3 ar25 (0.89, closest) with AERA explore-verify-plan (2605.25931) + Agent2World adaptive testing
        (2512.22336) -> L1. The codex agent IS the proposer. verifier_is_oracle=true.
      B2 (exp4340) E3 ka59 (0.56) same upgraded harness -> L1. verifier_is_oracle=true.

    PHASE C -- ARC NORTH STAR (biggest reproducible-level upside): exp4341 E3 executable-world-model on sc25 to crack
      the win-mechanic the BFS solver stalled on -> reproduce L1 offline (+1, opening the path to the 5 live-recorded
      levels). verifier_is_oracle=true.

    PHASE D -- CONTINUOUS SELF-LEARNING (mandated; NEW mechanism): exp4342 a game-AGNOSTIC ACTION-ROLE / interaction
      encoder (ReactiveGWM 2605.15256) over solved-game traces; re-test leave-one-game-out cross-game value transfer
      for SEARCH EFFICIENCY (the gap exp4331's raw-frame null logged). retire_if_same_verdict: true. verifier_is_oracle=false.

    PHASE E -- INFRA + HYGIENE + CAPSTONE: exp4343 SOTA-ingestion -> .402; exp4344 registry/gaps hygiene + GAP-4
      regression guard; exp4345 hardware continuity (opportunistic); exp4346 capstone .401 + the DiffusionGemma gate
      decision (replicate-or-retire) + ARC reproducible-total + G1-G4.

  HARD RULE (every task): the conductor stays STOOD-DOWN on TRM training -- NO task may launch TRM training, run
  pkill/kill against train.py, or WRITE results/trm_runs/. Qwen is FORBIDDEN as the TRAINED base (Spurious-Rewards
  confound); Qwen/Gemma GGUF as an off-policy JUDGE/GENERATOR is fine. SEPO (verifier-as-reward GENERATOR training,
  2502.01384) is OUT-OF-BAND/operator-owned -- flagged in SOTA-ingestion, NOT auto-run in-loop. Every LEARNED-verifier
  value task MUST declare verifier_is_oracle honestly (Circularity Discipline): an EXECUTABLE-oracle win (E3 solve) is
  execution_grounded (verifier_is_oracle=true, ARC progress, NOT a moat headline); the moat is the oracle-DISTINCT
  learned result with a matched control + CI95-excl-0. NO autonomous edits to docs/index.html / README / paper prose.
  Online ARC play stays operator-gated (NO leaderboard submission). DiffusionGemma MUST use the llama.cpp PR binary,
  NOT a standard GGUF loader (known-issues 2026-06-15). The cross-domain SELECTION scope is RETIRED (exp4314) -- do NOT
  re-propose it.

