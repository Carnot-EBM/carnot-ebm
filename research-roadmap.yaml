        model_specs:
          principle: "The SOTA GGUF invoked as the judge; required methodology for a live-LLM artifact."
        random_seed:
          principle: "Determinism precondition for reproducibility of the decisive measurement."
        reproducibility_checksum:
          principle: "Content hash of candidate pool + verifier + judge config; lets a third party re-run the head-to-head."
