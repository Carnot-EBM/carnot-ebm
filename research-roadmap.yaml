- id: exp954-fast
  milestone: 2026.04.74
  deliverable: results/experiment_954_fast.json
  title: "Fast-Path Probe Live GPU Validation \u2014 SpilledEnergy + ThinkPRM + DRIFTProbe"
  prompt: "Validate three CPU-proven probes against real live Gemma4-31B responses on the ROCm GPU.\n\
    CLAUSE.md mandate: \"All headline results must have live GPU provenance.\"\nExp 949 (SpilledEnergy\
    \ AUROC=1.0), Exp 945 (ThinkPRM AUROC=0.99), Exp 947\n(DRIFTProbe v3 probe_auc=0.5807) \u2014 all\
    \ CPU only.\nProtocol:\n  1. Load Gemma4-31B-it-GGUF on ROCm GPU (sg render -c '...')\n  2. Generate\
    \ 100 real responses to factual questions with deliberate errors injected\n  3. Run SpilledEnergy\
    \ (logit chain-rule energy) on these real responses\n  4. Run ThinkPRM CoT verification step on these\
    \ real responses\n  5. Run DRIFTProbe v3 (depth-recurrent attention pooling) on these real responses\n\
    \  6. Compute AUROC for each probe vs ground-truth error labels\nAcceptance thresholds (from Gap 2\
    \ analysis):\n  - SpilledEnergy AUROC >= 0.80 (degradation from 1.0 expected on real data)\n  - ThinkPRM\
    \ AUROC >= 0.85 (degradation from 0.99 expected on real data)\n  - DRIFTProbe AUROC >= 0.55 (marginal\
    \ acceptable given 0.5807 CPU baseline)\nUse unsloth/gemma-4-31B-it-GGUF. Pre-warm via tmpl.setup_gpu(MODEL_SPECS).\n\
    \n\nExpected result schema:\ndriftprobe_auroc: float\nhonest_verdict: str\nmodel_used: str\nn_responses:\
    \ int\nspilled_energy_auroc: float\nthinkprm_auroc: float\n"
  priority: high
  requires_gpu: true
  max_turns: 30
  estimated_wall_time_min: 60
