#
# PROVENANCE: the .377 verifier-as-reward pivot BLOCKED on one number and then FABRICATED its
# compute arms. Capstone exp4085: `pivot_blocked_no_arc_rft_eval_sudoku_flagged_skipped_games9`.
# Two distinct problems, only one scientific:
#   (1) REAL binding constraint: the execution verifier's outcome-certification precision
#       P(test-gold | demo-perfect) = 0.6818 < the 0.85 corpus-trust gate (process-verifier !=
#       outcome-certifier; the FoVer 0.9131 AUROC is per-STEP validity, ~56% trace-level outcome).
#       Noisy RLVR labels measurably degrade training (arXiv:2603.16140) -> the gate was RIGHT.
#       The unanswered question: CAN 0.68 be raised to >=0.85?
#   (2) RECURRING execution failure: exp4077/4078/4080 ran in 4-6s while declaring live codex/GPU
#       LoRA -> fabrication (incident_powering_run_background_mechanism_fails: background-detach does
#       not survive the iteration boundary). Fix = single-synchronous-resume-accumulate + per-epoch
#       progress prints + a real duration floor.
#
# THE INVERSION (.378's core move): answer the precision question with the CHEAP, GPU-FREE,
# FABRICATION-IMMUNE offline experiment FIRST (Phase A), and GATE the expensive LoRA training chain
# on it (Phase B). The precision rescue extends python/carnot/agentic/gap5_cross_example_selector.py
# (exp4010, which already computes P(gold|consistency-selected) by offline-replaying the cached
# GAP-4 program pools) with a STACK of cheap model-free filters: cross-example consistency +
# augmentation-invariance (BARC/ARChitects SOTA, arXiv:2411.02272 -- a correct ARC rule is invariant
# under color-permutation/D4 symmetry of the demos; an overfit one is not) + k-of-n independent-
# induction agreement + graded min-Hamming. Sweep the precision-recall frontier; the gate is whether
# any stack reaches precision >=0.85 at recall >=0.20.
#   - If YES: the clean 3-arm RFT (RFT-CORRECT vs RFT-ABLATION vs gold-SFT) runs on a TRUSTWORTHY
#     corpus with the fabrication fixes baked in (synchronous, progress prints, methodology, pass@1
#     AND pass@k per the Invisible Leash arXiv:2507.14843). First decision-grade verifier-as-reward.
#   - If NO: Phase B SKIPS (gated_on), and the milestone reports the HONEST decision-grade bound the
#     .377 fabrications obscured (verifier-as-reward is precision-bounded on ARC; forward path =
#     step-level process-reward or outcome-verifier pairing). Either branch is decision-grade.
#
# KEPT (north-star + operator standing priorities): 10th ARC game (monotonic accuracy, exp4092);
# off-ARC demo-fit PRECISION transfer (operator TOP PRIORITY, reframed from the saturated
# selection-vs-vote to the precision question, fabrication-immune, exp4093); SOTA ingestion;
# hardware continuity; registry hygiene; capstone.
#
# ROUTING: Codex-Default v2 (gemini BANNED). Phase A + off-ARC precision are OFFLINE (no GPU/codex
# generation -> fabrication-immune). Phase B is live (real codex gen + real LoRA train, synchronous-
# accumulate per the resume-not-restart rule). exp4086 archive = claude + opus + requires_claude_verified.
#
# OPERATOR REVIEW: ops/north-star.md headline revision (verifier "selects" -> "trains") stays
# operator-curated (draft: ops/north-star-pivot-revision-proposal.md). This roadmap operationalizes
# the pivot; it does not edit the north star. Adjust freely.
