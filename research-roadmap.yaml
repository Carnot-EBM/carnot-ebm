  - id: exp2802
    milestone: "2026.05.265"
    deliverable: "results/experiment_2802_mbpp_ensemble_eval.json"
    title: "MBPP Corpus Ensemble Adversarial Replication (N=500, 5 seeds)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 60
    track: corpus
    prompt: |
      Read CLAUDE.md for project context, especially "Verifier Authenticity
      Discipline" (no sleep-padding, no score-capping, no random-data
      evaluation) and "Adversarial Artifact Verification + Sample-Size
      Rigor" (random_seed + reproducibility_checksum mandatory).

      CONTEXT: per operator directive 2026-05-21, expand evaluation
      surface beyond FoVer (the single corpus driving the 0.9857
      headline). MBPP is industry-standard for Python code generation;
      execution-based ground-truth makes hallucination detection
      well-defined (correct code passes tests; incorrect code fails).

      TASK: Run the production verifier ensemble v7b against MBPP test
      split (500 problems) and compute AUROC under 5-seed adversarial
      replication.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. `python3 -c "import torch; assert torch.cuda.is_available()"`
              — if false, blocked_cuda_not_available
           b. `python3 -c "from datasets import load_dataset; load_dataset('mbpp', 'sanitized', split='test')"`
              — if HF unreachable, blocked_huggingface_mbpp_unreachable
           c. `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/`
              — if empty, blocked_model_not_cached_qwen36
           Record preconditions_checked.

        1. Load MBPP test split via `datasets.load_dataset("mbpp",
           "sanitized", split="test")` (500 problems).
        2. For each problem, run live-GPU inference (Qwen3.6-35B-A3B-GGUF
           via llama.cpp) to generate a candidate solution.
        3. Execute the candidate against the test cases — this gives
           ground-truth (pass/fail). Real execution; no static-analysis
           proxy.
        4. Score each (problem, candidate) pair with the production
           verifier ensemble v7b — record per-verifier scores AND the
           ensemble's final hallucination probability.
        5. Repeat steps 2-4 with 5 different random seeds (42, 137,
           271, 314, 1729) to measure replication std.
        6. Compute AUROC per seed against ground-truth (pass=clean,
           fail=hallucination). Report mean + std across 5 seeds.
        7. Compare to MBPP peer baselines: vanilla Qwen3.6 pass@1 +
           any published verifier baselines on MBPP.
        8. Write artifact.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:' /
          'passed:' / 'shipped:' (or 'blocked_<resource>' on precondition fail)
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - corpus: "MBPP-sanitized-test"
          principle: "Identifies which corpus was used."
        - n_problems: 500
          principle: "Sample size for statistical claims."
        - n_seeds: 5
          principle: "Adversarial replication seed count per .241 5-seed protocol."
        - ensemble_auroc_per_seed: list[float] (length 5)
          principle: "Raw AUROC for each seed; mean+std derived from these."
        - ensemble_auroc_mean: float
          principle: "Headline number for this corpus."
        - ensemble_auroc_std: float
          principle: "Adversarial-verify discipline requires std for the headline claim."
        - per_verifier_auroc: dict[str, list[float]] — verifier_id → [auroc_seed1, ..., auroc_seed5]
          principle: "Per-verifier breakdown exposes which verifiers contribute on this corpus shape vs FoVer."
        - vanilla_qwen36_pass_at_1: float
          principle: "Baseline for the model without Carnot — establishes the headroom Carnot operates in."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism is the precondition for reproducibility."
        - reproducibility_checksum: str (sha256 of corpus + model_specs + random_seeds)
          principle: "Catches silent corpus or model-version drift between this artifact and any future replication."
        - model_specs: {name: "Qwen3.6-35B-A3B-GGUF", quant: "...", revision_sha: "..."}
          principle: "Real compute requires naming what was compute'd on."
        - duration_s: float (MUST be ≥ 5*N*per-problem-inference-time; expect ≥1800s for full run)
          principle: "Real compute takes wall-time; missing or short duration is fabrication signal."
        - preconditions_checked: list[{resource, available, check}]
          principle: "Anti-fabrication: records what was verified before running."
        - methodology_note: str
          principle: "If any verifier shows low AUROC (<0.6), explain why honestly; this is expected per the input-shape-overfit thesis."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2803
    milestone: "2026.05.265"
    deliverable: "results/experiment_2803_truthfulqa_ensemble_eval.json"
    title: "TruthfulQA Corpus Ensemble Adversarial Replication (N=817, 5 seeds)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 60
    track: corpus
    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline" and
      "Adversarial Artifact Verification".

      CONTEXT: per operator directive 2026-05-21, expand evaluation
      beyond FoVer to test factuality generalization. TruthfulQA is the
      industry-standard adversarial-truthfulness benchmark (Lin et al.
      2022, arXiv:2109.07958, 817 Qs across 38 categories). Carnot has
      never been measured on TruthfulQA; FoVer-trained verifiers may
      perform near-random.

      TASK: Run the production verifier ensemble v7b against TruthfulQA
      generation split and compute AUROC under 5-seed adversarial
      replication.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `python3 -c "import torch; assert torch.cuda.is_available()"`
           b. `python3 -c "from datasets import load_dataset; load_dataset('truthful_qa', 'generation')"`
              — if HF unreachable, blocked_huggingface_truthfulqa_unreachable
           c. Qwen3.6-35B-A3B-GGUF cached (same check as exp2802)
           Record preconditions_checked.

        1. Load TruthfulQA generation split (817 questions).
        2. For each question, run live-GPU Qwen3.6-35B inference to
           generate a candidate answer.
        3. Compute ground-truth via TruthfulQA's reference (best_answer
           field). Two scoring modes:
              - GPT-judge mode: NOT used (operator-directive: avoid
                closed-weight dependencies per CLAUDE.md
                Decentralization rule 2)
              - BLEURT mode: install bleurt-base-128 (HF, MIT license)
                and compute semantic similarity. Threshold tuned on a
                held-out 50-Q calibration set.
        4. Score each (question, candidate) with the production
           verifier ensemble v7b.
        5. Repeat 2-4 with 5 seeds (42, 137, 271, 314, 1729).
        6. AUROC per seed vs BLEURT-derived truthful/untruthful labels.
        7. Compare to TruthfulQA peer baselines: GPT-3 MC1 ~28%, any
           published BLEURT verifier comparator.
        8. Write artifact.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:' / 'passed:' / 'shipped:'
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - corpus: "TruthfulQA-generation"
          principle: "Identifies which corpus was used."
        - n_questions: 817
          principle: "Sample size."
        - n_seeds: 5
          principle: "Adversarial replication seed count."
        - ensemble_auroc_per_seed: list[float] (length 5)
          principle: "Raw AUROC for each seed."
        - ensemble_auroc_mean: float
          principle: "Headline number for this corpus."
        - ensemble_auroc_std: float
          principle: "Required by adversarial-verify discipline."
        - per_verifier_auroc: dict[str, list[float]]
          principle: "Per-verifier breakdown — KEY finding will be which verifiers transfer from FoVer-math to TruthfulQA-factual."
        - scoring_method: "BLEURT-base-128, threshold tuned on 50-Q held-out"
          principle: "Documents how 'truthful' was operationalized."
        - bleurt_threshold: float
          principle: "Reproducibility — anyone replicating must use the same threshold."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism precondition for reproducibility."
        - reproducibility_checksum: str
          principle: "Catches corpus or model drift."
        - model_specs: dict
          principle: "Names the compute target."
        - duration_s: float (expected ≥1800s for 5-seed run)
          principle: "Real compute takes wall-time."
        - preconditions_checked: list
          principle: "Anti-fabrication."
        - methodology_note: str — REQUIRED if ensemble_auroc_mean < 0.7
          principle: "Low AUROC on a new corpus is an honest finding (FoVer-shape overfit thesis), not a failure — but the artifact must say so explicitly."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

