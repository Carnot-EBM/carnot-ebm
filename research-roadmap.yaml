  - id: exp2275-eidoku-csp-gate
    title: "Phase 3: Eidoku CSP Verification Gate Implementation (arXiv:2512.20664)"
    milestone: "2026.05.224"
    deliverable: "results/experiment_2275_eidoku_csp_gate.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    prior_failures:
      - experiment_id: none
        verdict: n/a
        addressed_by: "New experiment — no prior attempt. Motivated by arXiv:2512.20664 (Eidoku: Neuro-Symbolic Verification Gate for LLM Reasoning via Structural CSP) added to research-references.md during .224 planning sweep."
    prompt: |
      CONTEXT: Eidoku (arXiv:2512.20664) reformulates LLM reasoning verification as a
      Constraint Satisfaction Problem (CSP) operating independently of generation likelihood.
      The key mechanism: a lightweight System-2 gate that rejects candidates exceeding a
      context-calibrated cost threshold derived from the intrinsic statistics of the context,
      not a learned threshold. This successfully rejects "smooth falsehoods" — statements that
      are highly probable (would not be caught by perplexity or entropy detectors) yet
      structurally disconnected from the context.
      This is a natural Tier 2.8 verifier for Carnot's cascade, between Tier 2.7 (CausalReasoningVerifier)
      and Tier 3 (Ising full verification).
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/verify/
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/scripts/experiment_template.py
      TASK: Implement a minimal EidokuCSPGate verifier and evaluate on 50 synthetic examples.
      CONCRETE STEPS:
        1. Create python/carnot/verify/eidoku_csp.py implementing:
           class EidokuCSPGate:
             - Takes (context: str, candidate: str) as input
             - Extracts structural constraints from context (entities, quantitative claims, logical connectives)
             - Formulates a cost function over how well candidate satisfies those constraints
             - Uses context-calibrated threshold (mean + k*sigma of cost over context sentences)
             - Returns: is_violation: bool, cost: float, constraint_violations: list[str]
        2. Write focused unit tests in tests/python/verify/test_eidoku_csp.py
           (at least 2 tests: one smooth-falsehood rejection, one correct-answer acceptance).
        3. Run the unit tests; record n_tests_passed.
        4. Evaluate on 50 synthetic examples (25 correct answers, 25 smooth falsehoods):
           - correct answers: rephrasings of context sentences (should NOT be rejected)
           - smooth falsehoods: plausible-sounding but structurally disconnected claims
        5. Measure:
           - csp_false_positive_rate: correct answers rejected / 25
           - csp_true_positive_rate: smooth falsehoods caught / 25
        6. Set eidoku_gate_validated: true if csp_true_positive_rate >= 0.60 AND csp_false_positive_rate <= 0.20.
        7. Write deliverable to results/experiment_2275_eidoku_csp_gate.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if implementation produced a runnable module (even if gate thresholds not met — a low TPR is an honest research finding)."
        - eidoku_gate_validated:
            principle: "Boolean. True when TPR >= 0.60 AND FPR <= 0.20 — practical operating point for a cascade verifier where false positives are more costly than false negatives."
        - csp_true_positive_rate:
            principle: "Measures smooth-falsehood detection rate; the Eidoku paper claims CSP-based checking catches this class that entropy methods miss."
        - csp_false_positive_rate:
            principle: "Guards against rejecting correct answers; a high FPR makes the gate useless as a cascade step."
        - n_tests_passed:
            principle: "Records unit test pass count; tests must pass for the implementation to be production-quality."
        - module_path:
            principle: "Records where the verifier was written; enables integration into verify_repair.py cascade."
        - n_eval_examples:
            principle: "Must be 50 (25+25) for the FPR/TPR claims to be statistically meaningful."

