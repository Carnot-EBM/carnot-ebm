  prompt: |-
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.667. V666 had no eligible new evidence/learning result; its GPU was occupied and ARC validation failed. V667 measures a changed CPU source-witness discriminator and isolates live GPU branches. Prior readiness is not benefit.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/research-roadmap-next.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7642_v666_capstone.json
    - {project_root}/python/carnot/experiment_7629_v666_contract_methods.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/publication_gate.py
    - {project_root}/research-references.md

    TASK:
    Produce results/experiment_7643_v667_contract_methods.json. Implement a thin CLI at scripts/experiments/experiment_7643_v667_contract_methods.py over reusable behavior; use python/carnot/experiment_7643_v667_contract_methods.py only for experiment orchestration, with focused tests at tests/python/test_experiment_7643_v667_contract_methods.py.
    Execution: inference_substrate_class=aggregation; MODEL_SPECS=[].

    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed progress line immediately. Resolve {project_root} absolutely and authenticate the named inputs. Test only real input/resource conditions; a planned output is never its own precondition. Missing external evidence is complete_blocked_<reason>, verdict_class=blocked, with exact gate_check_summary operands. Unchanged external absence is never partial.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark and subprocess that can take minutes. In long loops print completed units and monotonic elapsed time at least every 60 seconds. Stream child output and run an owned heartbeat during synchronous waits. Keep EVERY gap below 600 seconds; silence otherwise cuts the budget to about 1200 seconds instead of the 4800-second hard cap. Checkpoint each completed unit.

    3. Bound EVERY tool call. Write any file over about 200 lines in several tool calls of about 100-150 lines, with a progress message BETWEEN calls. Split large reads, edits and validation commands. Put scratch in /tmp, entrypoints in scripts/experiments and tests in tests/python. Reuse existing modules; do not copy a thousand-line experiment harness.

    4. Before implementation add REQ-REPORT-7643 and meaningful SCENARIO-* items to the capability specification; add the affected capability REQ-* if reusable behavior changes. Write failing tests for new behavior first. Preserve prior artifacts, unrelated edits, operator-curated docs and production defaults.

    5. Compare the staged or activated milestone authority with the Markdown machine contract: exactly fourteen ordered IDs exp7643-exp7656, titles, phases, paths, substrates, models and complete gates. Reject deleted/reordered IDs, wrong producer fields, self-inputs and stale staging in private mutations. This accounting task gates no science.

    6. Write docs/research-notes/v667-method-map.md and update research-studying.md. Read the static-analysis study and Hallucination Inspector first; map their limits to the proposed source witnesses, and Calibeating Made Simple to delayed source-conditioned updates. Recheck publication G1-G4 unchanged. Retain the GPU-resource block and ARC validation failure as different findings.

    7. E2E: run schema, prior-failure, exclusion, gate, harness-fit, prompt-path, ARC and overdue-priority readers against the staged authority. Preserve the old V666 document and fourteen terminal dispositions; distinguish actual pre-gate paths from absent producer paths. Do not archive or activate milestones.

    8. Freeze an affected-file validation manifest. Run focused pytest with -n 0 -o addopts=, pinned PYTHONPATH, a command-local COVERAGE_FILE and private --basetemp whose PARENT EXISTS. Require 100 percent coverage of changed behavior. Run scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Rust changes require scoped cargo test, fmt and clippy. Existing unrelated full-suite debt is not a model-load precondition.

    9. Run the declared entrypoint and the task-specific E2E checks. Cold-reduce raw rows in a fresh process, independently recompute comparisons, and retain commands, exits and log hashes. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Persist terminal reader outcomes before atomic publication. Invalid required validation means disqualified; exact oracle fixtures mean circular_positive; readiness alone means null.

    10. Reconcile openspec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve historical verdicts and retire only the failed mechanism when the declared repeated verdict occurs; resource absence does not falsify science. Do not activate or modify research-roadmap.yaml. No external publication, submission, purchase, generator-weight training or default promotion.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: Terminal complete_ prefix; completion is separate from scientific benefit.
    - verdict_class: Exactly positive | circular_positive | null | blocked | disqualified | partial. Partial is unfinished owned work only; unchanged missing upstream evidence is blocked.
    - flagged_adversarial: Boolean final reader result; flagged evidence cannot open a downstream gate.
    - gate_check_summary: Every blocked result names check, upstream, path, exact field, operator, expected and observed values, including complete_blocked_*.
    - acceptance_gate_results: Separate validity, readiness, probability benefit, utility, retention and freshness; each gate records its governing principle and measured operands.
    - rows: Per independent unit and arm, with absolute metrics, numerators, denominators, raw provenance, exclusions and censoring. Repeated seeds, views and orderings never increase sample size.
    - sample_size_budget: Intended and observed independent groups, eligible/excluded/censored counts and exposure limits.
    - preconditions_checked: Actual input and resource checks, not output existence requirements.
    - inference_substrate: Current work only; inherited model evidence is not current inference.
    - inference_substrate_class: Actual class and planned_inference_substrate_class. model_full_generation floor 60s, model_bounded_generation floor 10s, model_load_no_generation floor 2s. Never pad duration.
    - MODEL_SPECS: Current invocation identities plus planned_MODEL_SPECS. Every LLM task includes unsloth/Qwen3.8-27B-GGUF; no-call work uses [] and keeps historical models separate.
    - model_invoked: Whether a current load or generation was attempted; include invocation_counts for loads, forwards, generations and tokens.
    - execution_venue: Closed enum host | kv260 | polarfire | gatemate; use execution_venue_details for host, UUID, owned PID and other metadata.
    - phase_spans: Measured disjoint stages, completed units and checkpoint positions; duration_s is monotonic current elapsed time.
    - random_seed: Seeds and purposes; reproducibility_checksum binds immutable inputs, config and reduction code.
    - source_artifact_hashes: Separate producer files, pre-gate receipts, missing inputs and planned outputs. Never self-hash a current output as input.
    - validation_receipts: Actual commands, exits, log hashes and independent terminal reader results.
    - verifier_is_oracle: Exact structural witness truth cannot establish an oracle-distinct learned advantage.
    - field_principles: Governing principle beside each field and gate; proper loss, decision value and coverage are different claims.
    - contract_ready_score: 1 only if both complete authorities agree; does not gate science.
    - method_map_path: docs/research-notes/v667-method-map.md
    - prior_dispositions: Fourteen V666 rows, including seven handled tasks and seven pre-gated or cascade-skipped tasks.

    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7643_v667_contract_methods.py --date {date} --output results/experiment_7643_v667_contract_methods.json
    Do NOT push. Do NOT modify scripts/research_conductor.py.
