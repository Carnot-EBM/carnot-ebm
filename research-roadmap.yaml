    \  How to Train OIM (arXiv 2505.02103), Digitally Optimized Initializations (2603.24183)\n\
    - research-hardware-wishlist.md — KV260 bring-up status\n\n\
    TASK: Generate Verilog RTL + Python FpgaBackend for 128-spin sparsified Ising sampler.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-HARDWARE-013 (128-spin sparsified Ising sampler Verilog RTL with AXI-Lite interface\n\
