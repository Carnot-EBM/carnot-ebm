  - id: exp2301-nsvif-neuro-symbolic
    title: "Phase 2: NSVIF Neuro-Symbolic Z3 Extractor — First Implementation (arXiv:2601.17789)"
    milestone: "2026.05.226"
    deliverable: "results/experiment_2301_nsvif_extractor.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 40
    gated_on:
      - upstream: exp2295-pypi-escalation-fix-claude
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prompt: |
      CONTEXT: research-program.md lists "Rebuild constraint extraction for real models" as
      the HIGHEST PRIORITY since 2026-04-11. The NSVIF approach (arXiv:2601.17789) has been
      identified as the target implementation and has NEVER been attempted in any prior
      milestone. This is the first direct implementation.

      NSVIF (Neuro-Symbolic Verification on Instruction Following) formalizes instruction
      verification as a CSP: given an instruction I and candidate response R, extract logical
      steps from R, encode them as Z3 constraints, and check satisfiability. When Z3 finds
      UNSAT, the response violates the instruction's constraints. This is exactly the
      constraint extraction rebuild that research-program.md requires.

      NOTE: Requires z3-solver Python package.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/
        {project_root}/python/carnot/verify/
        {project_root}/scripts/experiment_template.py
      TASK: Implement the NSVIF LogicalStepExtractor and Z3 encoding pipeline.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. python -c "import z3; print(z3.get_version_string())" succeeds — else
              run: .venv/bin/pip install z3-solver -q
              If install fails: write honest_verdict blocked_z3_unavailable and exit.
        1. Create python/carnot/pipeline/extract.py implementing:
           class LogicalStepExtractor:
             - extract(instruction: str, response: str) -> list[dict]
               Parses response for logical steps: quantitative claims, conditions,
               causal assertions, list-item commitments.
               Returns: [{{"step": str, "constraint_type": str, "variables": list}}]
             - encode_z3(steps: list[dict]) -> z3.Solver
               Encodes each step as a Z3 assertion (arithmetic, comparison, or
               Boolean implication). Returns a solver with all constraints asserted.
             - verify(instruction: str, response: str) -> dict
               Returns: {{"satisfiable": bool, "violations": list[str], "n_constraints": int}}
        2. Write focused unit tests in tests/python/pipeline/test_extract.py
           (at least 3 tests: one satisfiable response, one violated arithmetic constraint,
           one violated list-completeness constraint).
        3. Run unit tests; record n_tests_passed.
        4. Evaluate on 30 synthetic (instruction, response) pairs:
           - 15 correct responses (should return satisfiable=true)
           - 15 responses with detectable violations (arithmetic error, missing step,
             conditional not satisfied)
        5. Measure:
           - nsvif_tpr: violations_correctly_detected / 15
           - nsvif_fpr: correct_responses_rejected / 15
           - mean_z3_solve_time_ms: mean Z3 query latency
        6. Set nsvif_extractor_validated: true if nsvif_tpr >= 0.50 AND nsvif_fpr <= 0.30.
           (First prototype; relaxed thresholds appropriate for initial implementation.)
        7. Write deliverable to results/experiment_2301_nsvif_extractor.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if extractor ran to completion (low TPR on first prototype is an honest research finding)."
        - nsvif_extractor_validated:
            principle: "Boolean. True when TPR >= 0.50 AND FPR <= 0.30. Relaxed for first prototype; PRD Priority #1 is addressed by IMPLEMENTING the extraction pipeline, not by achieving perfect accuracy."
        - nsvif_tpr:
            principle: "Measures constraint-violation detection rate; >= 0.50 on first prototype is meaningful given ArithmeticExtractor achieved ~0% on IT models."
        - nsvif_fpr:
            principle: "Guards against over-rejection; high FPR makes the verifier unusable in practice."
        - mean_z3_solve_time_ms:
            principle: "Z3 query latency determines cascade-tier cost; must be < 1000ms for Tier 1-2 feasibility."
        - n_tests_passed:
            principle: "Unit tests must pass; pipeline quality gate."
        - module_path:
            principle: "Records where LogicalStepExtractor was written for downstream integration."
        - z3_version:
            principle: "Records Z3 version for reproducibility; Z3 encoding behavior varies across versions."
        - preconditions_checked:
            principle: "Lists Z3 availability check; mandatory per CLAUDE.md Pre-Launch Preconditions Discipline."

