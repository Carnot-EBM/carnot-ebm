        retire_if_same_verdict: true
      - experiment_id: exp3018-beaver-style-validator-frontier-certificate
        verdict: "complete: validator frontier certificate ready with explicit unresolved bounds"
        addressed_by: "Adds formulaic exact-validator implementation and tests for the subset where solver checks are available."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. VERGE, SATQuest, and SMT-distillation work all point to exact solver feedback as the next useful verifier substrate. This is formulaic verifier/test work. If implementation code is changed, follow the repo's OpenSpec discipline before editing code.

      MODEL_SPECS
      Do not run an LLM unless strictly needed. If you do use live LLM-generated candidates, use at least one mandated local GGUF:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Legacy models are smoke-only and must be excluded from headline evidence.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
