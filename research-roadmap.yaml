    HALT-RAG NLI v2 (exp2424), FR-11 NSVIF v4 (exp2425), FST Constrained MCMC v2 (exp2426),
    3 new samplers (exp2428-2430), KV260 Yosys v4 (exp2427), Phase 1 ship gate v4 (exp2431).

    REQUIRES_CLAUDE JUSTIFICATION: (1) Codex has never successfully synthesized multi-
    milestone AUROC capstones — prior successful capstones all used Claude (exp2376,
    exp2404). (2) Reads 12+ experiment artifacts across 5+ directories with cross-
    experiment AUROC reasoning. (3) Open-ended synthesis: which results close the HIVE
    peer gap? Does Phase 1 ship gate progress change the paper submission timeline?
