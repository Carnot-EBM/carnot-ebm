    gated_on:
      - upstream: exp5111-fover-in-domain-pool-v469
        artifact_field: pool_n
        op: ">="
        value: 150
      - upstream: exp5111-fover-in-domain-pool-v469
        artifact_field: headroom_present
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp4305-cross-domain-selector-generalization
        verdict: "complete: cross_domain_selection_collapses_domain_bound"
        addressed_by: "This attempt changes scope to in-domain FoVer selection with a fixed-domain train/test split; it does not reopen held-out-domain selection."
        retire_if_same_verdict: true
      - experiment_id: exp4314-cross-domain-selector-ir3de-cascal
        verdict: "complete: powered_collapse_cross_domain_domain_bound"
        addressed_by: "The retired cross-domain axis is avoided; label-ablation remains as a leakage control for in-domain FoVer selection."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      The retired exp4305/exp4314 result says cross-domain verifier selection is domain-bound. Do not re-propose cross-domain selection. This task tests the still-unanswered in-domain FoVer question: can a Carnot verifier/energy selector beat tuned self-consistency on an oracle-distinct pool with formal labels and positive headroom?

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - research-program.md
      - research-references.md
      - ops/exclusion_manifest.yaml
      - results/experiment_4305_cross_domain_selector_generalization.json
      - results/experiment_4314_cross_domain_selector_ir3de_cascal.json
