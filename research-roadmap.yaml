- id: exp1399-discrete-sb-kv260-cpu-simulation
  milestone: 2026.04.108
  deliverable: results/experiment_1399_discrete_sb_kv260_cpu_simulation.json
  title: "Discrete SB KV260 CPU Simulation — BRAM-Limited Algorithm Estimate"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 40
  priority: medium
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1387-2d-parallel-tempering-kv260-fpga-estimate
      verdict: 15_replicas_540k_lut_over_kv260_117k_budget_hardware_claim_false
      addressed_by: "exp1387 found 2D PT requires 540K LUTs for 15 replicas vs 117K KV260 budget. The alternative: Discrete Simulated Bifurcation (arXiv:2510.12407) is BRAM-limited rather than LUT-limited. BRAM-limited implementations can target 256-variable problems on the KV260 BRAM budget. This CPU simulation estimates the BRAM requirements and convergence properties."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Exp1387 found that 2D Parallel Tempering requires 540K LUTs for 15 replicas
    vs the KV260's 117K budget — exceeding by 4.6x. The alternative, Discrete
    Simulated Bifurcation (arXiv:2510.12407), is fundamentally BRAM-limited
    rather than LUT-limited. BRAM stores the coupling matrix J; the LUT count is
    proportional to the number of bifurcation update units (which can be small).
    KV260 has 144 BRAM_36 blocks = 5.2 MB. For a 256-variable Ising problem
    with int8 coupling: 256*256 = 65536 bytes = 64 KB — fits comfortably. This
    CPU simulation implements Discrete SB (dSB), measures convergence on FoVer
    constraint problems, and estimates the BRAM budget for a KV260 implementation.
    Use {project_root} as the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - python/carnot/samplers/
    - results/experiment_1387_2d_parallel_tempering_kv260_fpga_estimate.json
    - hardware/kv260/

    TASK:
    CPU-simulate Discrete SB on FoVer constraint problems. Estimate KV260 BRAM
    budget. Determine if hardware_claim_allowed differs from exp1387's LUT-limited
    finding.

    REQUIRED ARTIFACT FIELDS:
    - status
    - algorithm
    - constraint_problems_tested
    - n_variables
    - steps_to_convergence_ising_baseline
    - steps_to_convergence_discrete_sb
    - convergence_speedup_discrete_sb
    - bram_estimate_kb_for_256var
    - kv260_bram_budget_kb
    - bram_budget_feasible
    - lut_estimate_per_update_unit
    - kv260_lut_budget_fits
    - hardware_claim_allowed
    - kv260_claim_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1399_discrete_sb_kv260_cpu_simulation.json immediately with status="in_progress".
    2. Read arXiv:2510.12407 reference from research-references.md. Understand dSB update rule.
    3. Load 3-5 FoVer constraint problems as Ising QUBO formulations (N=64 to N=256 variables).
    4. Implement Discrete SB: x_i(t+1) = sign(x_i(t) + η * sum_j J_ij * x_j(t) - pressure_term(t)).
    5. Implement the pressure schedule (linearly increasing from 0 to 1 over T steps).
    6. Run dSB and standard Ising (Gibbs sampling baseline) on the same problems.
    7. Measure steps_to_convergence for each. Compute convergence_speedup.
    8. BRAM estimate: J matrix for N=256 variables, int8 → 256*256 = 65536 bytes = 64 KB.
    9. KV260 BRAM budget: 144 BRAM_36 = 144*36Kb = 5184 Kb = 648 KB. Set kv260_bram_budget_kb=648.
    10. Set bram_budget_feasible=true if bram_estimate_kb_for_256var < kv260_bram_budget_kb.
    11. Estimate LUT count for one dSB update unit (~2K LUTs for N=256 add-tree). Set kv260_lut_budget_fits based on whether this fits in 117K budget.
    12. Set hardware_claim_allowed=true only if BOTH bram_budget_feasible AND kv260_lut_budget_fits.
    13. Set kv260_claim_allowed consistent with hardware_claim_allowed.
    14. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1399_discrete_sb_kv260_cpu_simulation.json')); print(d.get('bram_budget_feasible'), d.get('hardware_claim_allowed'), d.get('convergence_speedup_discrete_sb'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1400-biprm-retrospective-verification-probe
  milestone: 2026.04.108
  deliverable: results/experiment_1400_biprm_retrospective_verification_probe.json
  title: "BiPRM Retrospective Verification Probe — R2L Stream on FoVer Verified Pairs"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 40
  priority: medium
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1400-biprm-retrospective-verification-probe
      verdict: not_yet_run
      addressed_by: "New experiment based on arXiv:2508.01682 BiPRM. No prior failure."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    BiPRM (arXiv:2508.01682) introduces a Bidirectional Process Reward Model
    with both a forward (L2R) stream that scores reasoning steps left-to-right
    and a retrospective (R2L) stream that scores from the final answer backward,
    identifying pivotal reasoning steps. The retrospective stream achieves
    better pivot-step identification than L2R alone. Carnot's current step
    verification (Tier 2.5 SymCodeVerifier, Tier 2.6 HermesVerifier, Tier 2.7
    CausalReasoningVerifier) operates forward-only. Applying BiPRM's R2L
    retrospective stream to Carnot's verified FoVer pairs could identify which
    reasoning steps were pivotal for correctness — improving the precision of
    certificate verification. This is a CPU-only probe using existing FoVer
    verified pairs. Use {project_root} as the project root and
    {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - python/carnot/verify/
    - scripts/experiment_template.py

    TASK:
    Implement a BiPRM R2L retrospective stream on FoVer verified pairs.
    Measure pivot-step identification precision vs the forward-only baseline.

    REQUIRED ARTIFACT FIELDS:
    - status
    - corpus_cases_used
    - forward_only_pivot_precision
    - biprm_r2l_pivot_precision
    - pivot_precision_delta
    - retrospective_verification_viable
    - pivotal_step_categories
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1400_biprm_retrospective_verification_probe.json immediately with status="in_progress".
    2. Read arXiv:2508.01682 from research-references.md. Identify the R2L update rule.
    3. Load FoVer verified pairs (positive: verified correct reasoning, negative: rejected reasoning).
    4. Implement forward-only pivot scoring: score each step s_i as the verifier energy change when s_i is removed.
    5. Implement R2L retrospective scoring: score each step s_i as the energy change when s_i is the "pivot" from the answer backward.
    6. Measure pivot-step identification precision: fraction of pivots identified that match human-annotated important steps (use FoVer metadata if available; otherwise use ground-truth incorrect steps from negatives as pivot proxies).
    7. Compute pivot_precision_delta = biprm_r2l_pivot_precision - forward_only_pivot_precision.
    8. Set retrospective_verification_viable=true if delta > 0.
    9. Categorize pivotal steps: arithmetic error, logical fallacy, missing premise, hallucination.
    10. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1400_biprm_retrospective_verification_probe.json')); print(d.get('pivot_precision_delta'), d.get('retrospective_verification_viable'), d.get('honest_verdict'))"
