    TASK:
    Independently audit the real-output fixed-point transfer. Recompute graph semantics, exact labels,
    candidate validity, matched work, clustered intervals, and verdict from serialized sources and
    per-unit rows. Prove train isolation and apply destructive controls that separate useful group
    topology from case identity, model identity, surface form, and oracle leakage.

    CONCRETE STEPS:
    0. PRECONDITIONS: require model_output_fixed_point_comparison_completed=true, source artifacts and
       hashes, all planned rows, unique paired keys, complete model/family/transformation strata, and
       frozen training receipts. On failure write complete_blocked_real_output_fixed_point_audit with
       gate_check_summary and stop. Do not import producer code or accept aggregate-only evidence.
    1. Add a REQ-* cold audit scenario and independent standard-library evaluator tests before code.
    2. Rebuild every probe graph and exact valid set from serialized definitions. Recompute candidate
       validity, dependency violations, nearest-valid distance, support, convergence, work, and runtime
