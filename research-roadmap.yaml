    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/continuous-self-learning/spec.md

    TASK:
    In a fresh process, independently replay Exp6903 from its frozen inputs and sealed outcomes.
    Recompute every arm/order metric, asymmetric cost, useful/harmful write, retention result, support
    size, poison response, restart, and rollback. Measure whether current-task gains shrink the set of
    future events with any correct supported decision. The controller's own score is never authority.

    CONCRETE STEPS:
    0. PRECONDITIONS: require `self_learning_run_complete_score=1`, exact source/code/config hashes,
       complete per-event rows, sealed outcomes, and a fresh writable temporary state directory. On
       failure, write complete_blocked_sealed_self_learning_support_audit with gate_check_summary.
