       collision, lexical shortcut, capacity overflow, asymmetric-cost inversion, poison, delayed
       correction, tombstone, restart, rollback, retention, and aggregate-row disagreement.
    2. Define a closed relation-memory record with source provenance, normalized tuple, structural
       key, confidence interval, exact outcome count, asymmetric error costs, revision, and tombstone.
