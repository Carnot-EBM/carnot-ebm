    \     python/carnot/models/safety_kan.py,\n     python/carnot/pipeline/semantic_energy_scorer.py,\n\
    \     python/carnot/pipeline/crane_extractor.py\n     Status per file: 'valid_python' /\
    \ 'corrupt_json' / 'missing'\n   - CloudGPUInstructions: dataclass with fields:\n     lambda_command:\
    \ str (Lambda Labs provisioning CLI command),\n     vastai_command: str (vast.ai provisioning\
    \ command),\n     runpod_command: str (RunPod provisioning command),\n     estimated_cost_per_hour_usd:\
    \ float\n   - build_cloud_gpu_instructions() -> CloudGPUInstructions:\n     Lambda: 'lambdalabs\
    \ instance create --instance-type gpu_1x_a100 --region us-west-2 --quantity 1'\n     vast.ai:\
    \ 'vastai create instance <id> --image pytorch/pytorch:2.3.0-cuda12.1'\n     RunPod: 'runpodctl\
    \ create pod --gpuType NVIDIA_A100_80GB'\n     estimated_cost=1.10\n   - generate_cloud_gpu_script(instructions:\
    \ CloudGPUInstructions, output_path: str) -> None:\n     Writes scripts/setup_cloud_gpu.sh\
