- id: exp4511-a1
  milestone: 2026.06.417
  title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY; SCORE-LEVER) -- frame-change /
    clickability predictor that PRUNES no-op candidates (the StochasticGoose lever). Self-supervised
    offline-arcade corpus. Gate: median actions-to-first-levelup STRICTLY < 7760 at equal solve-rate.'
  priority: critical
  track: arc-north-star
  max_turns: 150
  agent_type: codex
  model: gpt-5.5
  inference_substrate: verifier_ensemble_against_cached_candidates
  deliverable: results/experiment_4511_frame_change_prune_predictor.json
  prior_failures:
  - experiment_id: exp4490-human-replay-frame-change-predictor
    verdict: 'complete: blocked_human_replay_corpus_not_cached'
    addressed_by: '.417 A1 uses a SELF-SUPERVISED (frame,action,next_frame) corpus GENERATED from the
      offline arcade (zero quota, all 25 games, deterministic, no network) as the PRIMARY source; the
      human-replay corpus is an OPTIONAL bootstrap, not a precondition -- this removes the external-corpus-
      availability failure that blocked .415 and nulled .416.'
    retire_if_same_verdict: true
  - experiment_id: exp4501-frame-change-predictor-rerun
    verdict: 'complete: frame_change_predictor_rerun_staged_corpus_shortfall_null_guard'
    addressed_by: 'Two changes vs .416: (1) the corpus is self-supervised from the offline arcade (no
      shortfall possible), and (2) the predictor PRUNES candidates predicted no-op BEFORE expansion
      rather than RE-RANKING them -- ranking (the .416 approach) cannot cut the action count, pruning can.'
    retire_if_same_verdict: true
  prompt: |
    CONTEXT ({date}, operator MANDATORY, ARC sprint PRIMARY/SCORE-LEVER). The live explorer expands ALL
    salient candidates per node -> ~7760 actions for ~21-action solutions -> score ~0.08 (score =
    min(human/agent,1)^2). The leaderboard leader (Tufa StochasticGoose, 1.21) wins on exactly this: a
    CNN that predicts which actions cause a FRAME CHANGE, so it stops wasting actions on no-ops. This task
    builds that predictor and uses it to PRUNE (not rank) candidates predicted no-op BEFORE expansion.
    The frame-change predictor nulled TWICE on external-corpus availability (.415 A1, .416 A2); A1 fixes
    that by generating a SELF-SUPERVISED corpus from the offline arcade -- every (frame, action,
    next_frame) the explorer generates IS a labeled example (label = did the frame change + magnitude),
    pooled across all 25 games, zero quota, no network. The human-replay corpus
    (data/arc_public_demo_human_replay_corpus) is an OPTIONAL bootstrap only.

    EXISTING CODE TO READ FIRST:
      - {project_root}/docs/research-notes/arc-frame-change-predictor-spec.md (the data + architecture plan)
      - {project_root}/docs/research-notes/arc-417-shaping-action-efficiency.md (candidates 1+2: PRUNE with a working predictor)
      - {project_root}/python/carnot/agentic/arc_solver_kit.py (offline_arcade, OfflineSolver, reproduce, rich_action_candidates)
      - {project_root}/python/carnot/agentic/arc_competition_agent.py (StepwiseExplorer / E3AgentPolicy -- the prune wires in here)
      - {project_root}/scripts/kaggle/arc_local_submission_gate.py (THE metric: median actions-to-solve on 8 games, baseline 7760)
      - {project_root}/python/carnot/agentic/arc_human_replay_corpus.py (optional bootstrap loader)

    TASK: train a small frame-change / clickability predictor on the self-supervised offline-arcade corpus,
    wire it into rich_action_candidates to DROP candidates predicted no-op before expansion, and SHOW it
    reduces median actions-to-first-levelup below 7760 WITHOUT dropping solve-rate.

    CONCRETE STEPS:
      0. PRECONDITIONS (BEFORE any other step):
         a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0 (the corpus source).
         b. `.venv/bin/python -c "import torch; print(torch.__version__)"` (small predictor; CPU acceptable).
         Missing -> honest_verdict blocked_<resource>, EXIT. Do NOT run the full pytest as a precondition (use --no-cov for any focused test).
      1. Generate the self-supervised corpus: sweep the offline arcade across the 25 games, collect
         (frame, action, next_frame) -> (changed:bool, magnitude). Pool across games. (Optionally augment with the human replays.)
      2. Train a small conv predictor: 64x64x(color-onehot) grid -> P(frame_change) per candidate action (click heatmap + directional).
         Hold out games for a transfer check (LOO-style); report held-out no-op precision/recall.
      3. Wire it into rich_action_candidates: PRUNE candidates with P(frame_change) below a swept threshold BEFORE the explorer expands them.
      4. Measure on scripts/kaggle/arc_local_submission_gate.py: median actions-to-first-levelup WITH vs WITHOUT pruning, per-game + median.
      5. POSITIVE CONTROL: a game where clickability is plainly learnable (most clicks no-op, a few aren't) -> prove the harness detects a real reduction.
      6. FALSE_NEGATIVE_RISK guard: if pruning does NOT reduce median actions (or drops solve-rate), report the HONEST NULL -- do not over-claim.
      7. Every reported solve stays offline-reproduced via arc_solver_kit.reproduce (pruning must not break a real solve).

    REQUIRED ARTIFACT FIELDS (principle-annotated):
      honest_verdict: principle "terminal prefix complete:/success:/passed:/shipped_; e.g. success: frame_change_prune_median_actions_<n>_below_7760 OR complete: prune_no_action_reduction_honest_null."
      inference_substrate: principle "verifier_ensemble_against_cached_candidates -- offline arcade search + small-predictor scoring, NO GGUF/LLM load (1s floor)."
      median_actions_baseline: principle "the 7760 control so the delta is auditable, not a moving baseline."
      median_actions_with_prune: principle "the headline -- pruning's whole point is to cut this number."
      solve_rate_baseline: principle "pruning MUST NOT drop solve-rate; a faster agent that solves less is not a win."
      solve_rate_with_prune: principle "the no-regression check on solve-rate."
      heldout_noop_precision: principle "the predictor must generalize cross-game (pooled training) -- the StochasticGoose persist-across-games idea, measured held-out."
      positive_control_passed: principle "proves the harness can detect a real reduction (guards against a silently-broken metric)."
      false_negative_risk_checked: principle "a null result is only valid if a positive control passed -- per CLAUDE.md FALSE_NEGATIVE_RISK."
      random_seed: principle "determinism is the precondition for reproducibility."
      reproducibility_checksum: principle "content-addressed hash catches silent corpus/model drift on replay."
      preconditions_checked: principle "records WHICH resources were verified; pre-empts silent-missing-resource fabrication."

    Run: cd {project_root} && .venv/bin/python python/carnot/experiment_4511_frame_change_prune_predictor.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.
- id: exp4512-a2
  milestone: 2026.06.417
  title: 'PHASE A2 (ARC NORTH STAR; SCORE-LEVER) -- imitation / behavior-cloning ACTION PRIOR from the
    342 human replays (+ self-supervised marginal fallback): try human-like efficient actions FIRST.
    Gate: actions saved at equal solve-rate.'
  priority: high
  track: arc-north-star
  max_turns: 130
  agent_type: codex
  model: gpt-5.5
  inference_substrate: verifier_ensemble_against_cached_candidates
  deliverable: results/experiment_4512_imitation_action_prior.json
  prompt: |
    CONTEXT ({date}, ARC sprint SCORE-LEVER). Humans changed the frame on 97% of their actions -- their
    action sequences ARE an efficient-exploration prior. This task uses the 342 human replays (and a
    self-supervised marginal-action distribution from the offline arcade as a robust fallback) as a
    behavior-cloning PRIOR so the explorer tries human-like (efficient) actions FIRST, pruning the
    candidate set by likelihood. Even the marginal action distribution (which action TYPES change frames
    on which game classes) prunes wasted exploration. This is candidate 3 of the .417 action-efficiency
    program. It is a DIFFERENT mechanism from A1 (A1 = per-frame no-op predictor; A2 = prior over action
    sequences/types). Robustness: the self-supervised marginal must be the fallback so A2 cannot null on
    human-replay-corpus availability.

    EXISTING CODE TO READ FIRST:
      - {project_root}/docs/research-notes/arc-human-replay-application-spec.md (the 14k replay corpus + how to recompute features our way)
      - {project_root}/docs/research-notes/arc-417-shaping-action-efficiency.md (candidate 3: imitation prior)
      - {project_root}/python/carnot/agentic/arc_human_replay_corpus.py (replay loader)
      - {project_root}/python/carnot/agentic/arc_solver_kit.py (offline_arcade -> self-supervised marginal fallback)
      - {project_root}/python/carnot/agentic/arc_competition_agent.py (StepwiseExplorer -- the prior orders candidate expansion here)
      - {project_root}/scripts/kaggle/arc_local_submission_gate.py (THE metric: median actions-to-solve, baseline 7760)

    TASK: build an action-type / action-sequence prior (human replays primary, self-supervised marginal
    fallback), order/prune the explorer's candidate expansion by it, and SHOW actions saved at equal solve-rate.

    CONCRETE STEPS:
      0. PRECONDITIONS (BEFORE any other step):
         a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0 (fallback source -- always available).
