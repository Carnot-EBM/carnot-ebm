    title: "PHASE F3 (hardware continuity; opportunistic per north-star §3) -- KV260 terminal/opportunistic (SSH-only reachability + xmutil listapps; NO host SD-card precondition), PolarFire CPU dispatch hash-verify, GateMate USB detect. KV260 is terminal (north-star §3) so the per-board mandate relaxes to opportunistic; this task keeps the boards visible without blocking the milestone. Report per-board reachability + any opportunistic result. NO board blocks the milestone (honest blocked_<board> per board is fine)."
    priority: low
    track: hardware
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-18 Hardware-Task Continuity Discipline + north-star §3 (KV260 terminal -> opportunistic), standing: the per-milestone hardware-continuity slot is REQUIRED forward work -- false-positive scope-match vs prior hardware-continuity tasks (exp4288/exp4278, SUCCEEDED, not retired); forward difference = opportunistic per-board check at the .397 state."
    inference_substrate: hardware_smoke
    deliverable: results/experiment_4300_hardware_continuity.json
    prompt: |
      CONTEXT: Hardware-Task Continuity Discipline -- keep the attached FPGA boards visible each milestone. Per
      north-star §3, KV260 is terminal so the mandate is opportunistic. KV260 SSH-Not-SD-Card Discipline: the KV260
      precondition is SSH reachability, NEVER a host SD-card block-device check.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4288_hardware_continuity.json (the .396 hardware state: KV260 terminal SSH-only, PolarFire, GateMate)
        - CLAUDE.md "KV260 SSH-Not-SD-Card Discipline", "Hardware-Task Continuity Discipline", "Pre-Launch Preconditions" (board rows)

      TASK: opportunistic per-board continuity check; report reachability; block nothing.

      CONCRETE STEPS:
        0. PRECONDITIONS (per board; a board being unreachable is an honest blocked_<board>, NOT a milestone block):
           a. KV260: `ssh -o ConnectTimeout=5 -o BatchMode=yes kria 'true'` (SSH reachability only; NEVER a host SD-card block-device check).
           b. PolarFire: `ssh -o ConnectTimeout=5 polarfire 'true'`.
           c. GateMate: `openFPGALoader -c dirtyJtag --detect`.
        1. KV260 (if reachable): `ssh kria 'xmutil listapps'` to confirm the terminal bitstream; record SSH-only
           terminal status. PolarFire (if reachable): a CPU-dispatch hash-verify smoke. GateMate (if detected):
           record the IDCODE; else blocked_gatemate_unreachable.
        2. Report per_board_status (reachable / blocked_<board> + any opportunistic result). Declare preconditions_checked.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A per-board reachability report (including honest blocked_<board>) is COMPLETE; no board blocks the milestone."
        per_board_status:
          principle: "Per-board reachability + any opportunistic result -- keeps the boards visible (continuity) without blocking on operator hardware actions."
        preconditions_checked:
          principle: "Records the SSH/USB reachability checks (KV260 via SSH NOT SD-card); pre-empts the wrong-mechanism + fabrication modes."
        reproducibility_checksum:
          principle: "Hash of the per-board probe outputs; auditable."
      ACCEPTANCE GATE:
        - condition: "per_board_status reported for KV260 + PolarFire + GateMate with preconditions_checked"
          principle: "Opportunistic continuity keeps the FPGA boards visible per the discipline + north-star §3 relaxation; no board blocks the milestone."

      Run: `python3 {project_root}/results/experiment_4300_hardware_continuity.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4301-capstone-v397
    milestone: 2026.06.397
    title: "PHASE F4 (capstone .397, UNGATED) -- the verifier scorecard. Headline questions: (1) did the oracle-distinct selection moat CLOSE the cross-GENERATOR axis on a NON-degenerate ARC-GEN pool (the LAST open axis)? (2) was the missing partial-state diffusion scorer built LEAK-FREE, and if so did the EXTERNAL verifier IMPROVE generation (beat RFG)? (3) did the efficiency Pareto win HARDEN against a well-prompted judge? Aggregate: CROSS-GENERATOR = exp4291 cross_generator_holds + cross_generator_delta + vote_at_1 + oracle_at_k + per_substrate_delta; PARTIAL-STATE = exp4292 partial_state_scorer_built + partial_state_leak_free + partial_state_auroc; IN-GENERATION = exp4293 diffusiongemma_guidance_moat + carnot_minus_rfg_delta (if it ran); EFFICIENCY = exp4294 efficiency_pareto_holds + cost_ratio; SELF-LEARNING = exp4295 online_adaptation_helps (tier-2 fixed); ARC = exp4296 total_levels (>=22?); hygiene = exp4299 regression_guard_passed. Emit cross_generator_moat_closes + in_generation_moat_holds + efficiency_pareto_hardened + verifier_thesis_state (one honest string). SKIP any flagged_adversarial artifact; HONOR verifier_is_oracle (a circular/execution-grounded win is NOT a moat). Compute the G1-G4 publication gate via publication_gate.py. NO gated_on."
    priority: high
    track: capstone
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 1 (routine milestone-transition task): capstone-vN -- false-positive scope-match vs all prior capstone-v* tasks (exp4289); structurally never a doomed rerun. Capstones default to codex."
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4301_capstone_v397.json
    prompt: |
      CONTEXT: the .397 capstone -- the verifier scorecard. Three headline questions: (1) did the oracle-distinct
      selection moat close the cross-GENERATOR axis (the LAST open axis) on a NON-degenerate ARC-GEN pool? (2) was
      the missing partial-state diffusion scorer built leak-free, and did the external verifier IMPROVE generation
      (beat RFG)? (3) did the efficiency Pareto win harden against a well-prompted judge? CRITICAL: SKIP any
      flagged_adversarial artifact (do NOT aggregate its numbers); HONOR verifier_is_oracle (a circular/
      execution-grounded win may NOT headline a moat); cite upstream sha256.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4291..4296 (the .397 phase artifacts) + exp4299 + exp4300
        - scripts/summarize_artifact.py (read each via the fixed reading order), scripts/adversarial_verify.py (with the NEW DEGENERATE_SEPARATION check from exp4297), scripts/publication_gate.py
        - ops/north-star.md (§0 ARC accuracy+efficiency, §1 headline, §2 G1-G4 gate, §5 energy-verifies-shapes-generation), CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification" (fabrication gate: skip flagged)

      TASK: aggregate .397 into an honest scorecard + the verifier_thesis_state + the G1-G4 status.

      CONCRETE STEPS:
        0. PRECONDITIONS: the .397 phase artifacts exist AND parse. For EACH, run summarize_artifact.py + a LIVE
           adversarial re-check (the new DEGENERATE_SEPARATION check included); if flagged_adversarial -> EXCLUDE it
           from aggregation and record the exclusion. If core artifacts are missing -> honest_verdict
           `blocked_v397_artifacts_missing` and STOP.
        1. Aggregate (skipping flagged): the CROSS-GENERATOR verdict (exp4291 cross_generator_holds +
           cross_generator_delta + vote_at_1 + oracle_at_k + per_substrate_delta -- confirm the non-degenerate guards
           held); the PARTIAL-STATE scorer (exp4292 partial_state_scorer_built + partial_state_leak_free +
           partial_state_auroc); the IN-GENERATION moat (exp4293 diffusiongemma_guidance_moat + carnot_minus_rfg_delta,
           if it ran -- else record gated-off); the hardened EFFICIENCY (exp4294 efficiency_pareto_holds + cost_ratio);
           the re-powered SELF-LEARNING (exp4295 online_adaptation_helps); ARC progress (exp4296 total_levels). Cite
           each upstream sha256.
        2. Emit cross_generator_moat_closes BARE bool := (exp4291 cross_generator_holds==true AND verifier_is_oracle==false
           AND the non-degenerate guards held) + in_generation_moat_holds BARE bool := (exp4293 diffusiongemma_guidance_moat==true
           AND verifier_is_oracle==false) + efficiency_pareto_hardened BARE bool (exp4294 efficiency_pareto_holds) +
           verifier_thesis_state (one honest string: 'cross_generator_moat_closed' / 'cross_generator_open_within_pool_only' /
           'in_generation_moat_holds' / 'partial_state_scorer_leaked' / 'partial_state_blocked'). Compute the G1-G4 gate
           via publication_gate.py --json and record paper_ready + unmet_gates. HONOR verifier_is_oracle on every cited result.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. The .397 close-state -- whether the cross-generator moat closed, the in-generation thesis unblocked, the efficiency win hardened."
        headline_outcome:
          principle: "One honest string aggregating the cross-generator + partial-state + in-generation + efficiency + self-learning + ARC reads; the single line the .398 planner frames from."
        cross_generator_moat_closes:
          principle: "BARE bool: did the oracle-distinct selection win transfer to construction-disjoint generators on a NON-degenerate pool -- the LAST open axis of the selection moat (NOT the degenerate .396 +1.0)."
        in_generation_moat_holds:
          principle: "BARE bool: did the LEARNED (oracle-distinct) partial-state-guided DiffusionGemma beat RFG model-self-guidance with CI95-excl-0 -- the §5 in-generation moat verdict (false if gated off / blocked / ties)."
        efficiency_pareto_hardened:
          principle: "BARE bool: did the energy verifier match/beat a WELL-PROMPTED judge at <=0.1x cost -- the skeptic-proof §5 efficiency headline."
        verifier_thesis_state:
          principle: "One honest string for the verifier thesis state (cross_generator_moat_closed / cross_generator_open_within_pool_only / in_generation_moat_holds / partial_state_scorer_leaked / partial_state_blocked) -- the framing the .398 planner inherits."
        flagged_artifacts_excluded:
          principle: "List of .397 artifacts excluded for flagged_adversarial -- the fabrication gate (their numbers are NOT aggregated)."
        paper_ready:
          principle: "From publication_gate.py --json -- the G1-G4 status (FoVer headline stays the publication target; a verified cross-generator moat or in-generation win would be a new headline-grade supporting result)."
        verifier_is_oracle_honored:
          principle: "BARE bool=true -- confirms every cited moat/headline result carried verifier_is_oracle=false (no circular/execution-grounded result headlines a moat)."
        reproducibility_checksum:
          principle: "Hash of the aggregated upstream sha256 set; lets a third party re-derive the capstone."
      ACCEPTANCE GATE:
        - condition: "headline_outcome + cross_generator_moat_closes + in_generation_moat_holds + efficiency_pareto_hardened + verifier_thesis_state + flagged_artifacts_excluded + paper_ready + verifier_is_oracle_honored reported, OR an honest blocked_v397_artifacts_missing verdict"
          principle: "The capstone must report an honest cross-generator + in-generation + efficiency scorecard while skipping flagged artifacts and honoring oracle-distinctness -- the discipline that prevents a degenerate pool or a circular win from over-headlining."

      Run: `python3 {project_root}/results/experiment_4301_capstone_v397.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.
