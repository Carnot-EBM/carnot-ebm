         autoregressive LMs and EBMs with distillation error bounds. Goes in §2 (theoretical
         background). The bijection is the scaffolding Phase 3 was missing.

      2. arXiv:2512.02080 (4/delta bound): proves LLM-verifier pipelines as absorbing Markov
         chains terminate in E[n] <= 4/delta iterations. Computing Carnot's empirical delta
         from existing results validates the theory and provides a paper-v6 §3 citation.

      3. arXiv:2605.12484 (Fast-Slow Training, FST): validates dual-timescale LLM architecture
         (slow frozen weights + fast context-updated weights) that mirrors Carnot's verify-repair
         design. 3x sample efficiency vs RL-only. Paper-v6 §3 citation.

      Per CLAUDE.md "Operator-Only External Publication": this task updates LaTeX source only.
      It does NOT submit to arXiv.

      EXISTING CODE TO READ FIRST:
      - docs/arxiv-submission/ (find main.tex or equivalent .tex file)
