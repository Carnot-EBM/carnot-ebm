- id: exp437-long-run-benchmark-executor
  milestone: 2026.04.33
  deliverable: results/experiment_437_long_run_executor.json
  title: 'Exp 437: LongRunBenchmarkExecutor — RETRO-026 fix (batch benchmarks to fit 45-min budget)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-026 opened in milestone 2026.04.32:\
    \ Exps 427/428/429 all produced scaffolding_only artifacts because live benchmarks need >45-min\
    \ executor budget. The root cause: 200 questions × 5 variants × 2 models = 2000 LLM calls\
    \ × ~10s = 20,000s = 333 min. The 45-min ExperimentTimeoutWatchdog kills the run at 27% completion.\n\
    \nFix: LongRunBenchmarkExecutor splits any benchmark into 50-question batches. Each batch runs\
    \ within 45 min. Batches are checkpointed. The full result is assembled from all batch checkpoints.\
    \ An outer conductor invocation can schedule batch_1 → batch_2 → ... as separate experiments;\
    \ each produces a valid partial result that is then assembled.\n\nThis is a CPU-only experiment.\
    \ It does NOT require GPU. It always produces a result JSON.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST)\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog (use it)\n\
    - scripts/experiment_template.py — ExperimentTemplate, checkpoint_save() pattern\n\
    - results/operational_retro_2026_04_32.json — RETRO-026 details\n\n\
    TASK: Implement LongRunBenchmarkExecutor.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST (before any import).\n\
    3. Add REQ-INFRA-027 (LongRunBenchmarkExecutor splits benchmarks into configurable batch sizes,\n\
    \   checkpoints each batch, assembles final result), REQ-INFRA-028 (default batch_size=50\n\
    \   configurable via CARNOT_BENCH_BATCH_SIZE), SCENARIO-INFRA-034/035/036 to\n\
    \   openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - BenchmarkBatch(batch_id: int, start_idx: int, end_idx: int, questions: list,\n\
    \     results: list | None = None, status: str = 'pending')\n\
    \   - LongRunBenchmarkResult(total_questions: int, batch_size: int, n_batches: int,\n\
    \     completed_batches: int, all_results: list, honest_verdict: str)\n\
    \   - LongRunBenchmarkExecutor(batch_size: int = 50, checkpoint_dir: str = 'results/batch_ckpt'):\n\
    \     - partition(questions: list) -> list[BenchmarkBatch]: split questions into batches\n\
    \     - save_batch(batch: BenchmarkBatch, prefix: str) -> str: checkpoint path\n\
    \     - load_batch(path: str) -> BenchmarkBatch | None: resume from checkpoint\n\
    \     - run_batch(batch, inference_fn, watchdog_timeout_minutes=40) -> BenchmarkBatch:\n\
    \       Uses ExperimentTimeoutWatchdog internally; writes checkpoint on completion or timeout\n\
    \     - assemble(batches: list[BenchmarkBatch]) -> LongRunBenchmarkResult:\n\
    \       Collects all batch results; honest_verdict='complete' if all batches done;\n\
    \       'partial_N_of_M' if only N of M batches completed\n\
    \   - get_batch_size() -> int: reads CARNOT_BENCH_BATCH_SIZE (default 50)\n\
    \   - Test: 120 questions split into 3 batches of 50/50/20 correctly\n\
    \   - Test: partial batch assembly produces 'partial_1_of_3' verdict\n\
    \   - Test: full batch assembly produces 'complete' verdict\n\
    \   - Test: save/load checkpoint round-trip\n\
    5. Implement python/carnot/pipeline/long_run_executor.py.\n\
    \   Export LongRunBenchmarkExecutor, LongRunBenchmarkResult, BenchmarkBatch,\n\
    \   get_batch_size from carnot.pipeline.__init__.\n\
    \   Verbose docstrings: WHY 50-question batches (fit in 45-min watchdog budget),\n\
    \   WHY checkpoint between batches (resume on retry without repeating work),\n\
    \   hardware path (CPU for orchestration; batches themselves can use GPU).\n\
    6. Write scripts/experiment_437_long_run_executor.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(437, timeout_minutes=20) as context manager\n\
    \   c. ExperimentTemplate(437, 'LongRunBenchmarkExecutor', 'results/experiment_437_long_run_executor.json')\n\
    \   d. Demo: partition 150 synthetic questions into 3 batches of 50\n\
    \   e. Simulate batch 1 success, batch 2 success, batch 3 partial (timeout at Q40)\n\
    \   f. assemble() → LongRunBenchmarkResult\n\
    \   g. Build artifact: schema='carnot.long_run_executor.v1'\n\
    \      retro_026_resolved=True\n\
    \      batch_size=50 (production default)\n\
    \      demo_n_batches=3, demo_completed_batches=2\n\
    \      honest_verdict='retro_026_fixed'\n\
    \   h. Output: results/experiment_437_long_run_executor.json\n\
    7. Write tests/python/test_long_run_executor.py (100% coverage).\n\
    8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    9. Reconcile: update ops/conductor-log.md (RETRO-026 CLOSED — LongRunBenchmarkExecutor\n\
    \   implemented), ops/status.md, ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp438-gpu1-zombie-fix
  milestone: 2026.04.33
  deliverable: results/experiment_438_gpu1_zombie_fix.json
  title: 'Exp 438: GPU1 zombie root-cause fix — DualGPURunner scheduling (RETRO-025 resolution attempt)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-025 (first opened 2026.04.31,\
    \ confirmed in 2026.04.32 Exp 426): PID 3509070 held 1786MB on GPU1 at 0% utilization while\
    \ GPU0 ran at 88% for 144+ minutes. Exp 426 diagnosed zombie_confirmed but did NOT fix it.\
    \ Root hypothesis: model loading with device_map='auto' lets CUDA allocate VRAM on GPU1 for\
    \ layer offloading, but actual forward pass stays on GPU0. Fix: explicitly assign model to\
    \ cuda:1 using device_map={'': 'cuda:1'} or load directly on CUDA device index.\n\nThis experiment\
    \ can run in CI mode (diagnosing the code path) even if GPU is not live.\n\nEXISTING CODE TO\
    \ READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST)\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog\n\
    - python/carnot/pipeline/dual_gpu_health.py — DualGPUHealthResult, check_dual_gpu_health()\n\
    - scripts/experiment_template.py — ExperimentTemplate.setup_gpu() — the place to fix\n\
    - results/experiment_426_dual_gpu_fix.json — zombie_confirmed details\n\
    - python/carnot/pipeline/gpu_monitor.py — DualGPUMonitor (Exp 326)\n\nTASK: Fix GPU1 zombie scheduling.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-INFRA-029 (DualGPURunner assigns models with explicit device_map={'': 'cuda:N'}\n\
    \   rather than device_map='auto' when CARNOT_FORCE_LIVE=1 and n_gpus >= 2),\n\
    \   SCENARIO-INFRA-037/038.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - ZombieFixResult(gpu0_model_id: str, gpu1_model_id: str,\n\
    \     gpu0_device_map: str, gpu1_device_map: str,\n\
    \     fix_applied: bool, post_fix_gpu1_util_pct: float | None,\n\
    \     honest_verdict: str)\n\
    \   - build_zombie_fix_strategy(n_gpus: int, model_ids: list[str]) -> dict:\n\
    \     Returns per-model device_map spec:\n\
    \     GPU0 model: device_map={'': 'cuda:0'} (explicit, NOT 'auto')\n\
    \     GPU1 model: device_map={'': 'cuda:1'} (explicit, NOT 'auto')\n\
    \     Single GPU: device_map='auto' (fallback)\n\
    \   - build_zombie_fix_artifact(result: ZombieFixResult) -> dict:\n\
    \     schema='carnot.gpu1_zombie_fix.v1'\n\
    \     retro_025_status: 'fix_applied_and_verified' / 'fix_applied_unverified' / 'ci_mode'\n\
    5. ADDITIVE: Modify ExperimentTemplate.setup_gpu() in scripts/experiment_template.py:\n\
    \   When len(model_specs) >= 2 AND CARNOT_FORCE_LIVE=1:\n\
    \     Use device_map={'': f'cuda:{gpu_idx}'} instead of device_map='auto'\n\
    \     Log: 'Using explicit device assignment to prevent GPU1 zombie allocation'\n\
    \   When CI or single GPU: keep existing device_map='auto' behavior\n\
    6. Write scripts/experiment_438_gpu1_zombie_fix.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(438, timeout_minutes=20)\n\
    \   c. Run check_dual_gpu_health() to get baseline zombie status\n\
    \   d. Call build_zombie_fix_strategy(n_gpus, model_ids) and log the strategy\n\
    \   e. If live GPU: attempt loading Qwen3.5-0.8B on GPU1 with explicit device_map={'': 'cuda:1'}\n\
    \      After load: re-run check_dual_gpu_health() — if gpu1_util > 0 during inference, fix worked\n\
    \   f. Build ZombieFixResult with honest_verdict\n\
    \   g. Output: results/experiment_438_gpu1_zombie_fix.json\n\
    7. Write tests/python/test_experiment_438_gpu1_zombie_fix.py (100% coverage).\n\
    8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    9. Reconcile: update ops/conductor-log.md (RETRO-025 status), ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

