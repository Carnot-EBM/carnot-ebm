- id: exp893-svamp-root-cause
  milestone: 2026.04.69
  deliverable: results/experiment_893_svamp_root_cause.json
  title: 'Exp 893: SVAMP Root Cause Deep Diagnosis (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-SVAMP-ZERO-AUC has been open since Exp 872 (svamp_auc=0.125). The
    same AUC was replicated in Exp 883 (VJEPA v2 expanded corpus). The hypothesis:
    SVAMP questions are single-step word problems ("Tom has 5 apples, gives 2, how many?")
    with no multi-step CoT chains to label. FoVer labeling assumes intermediate steps
    exist — for SVAMP they don't, so all labels are noise. This experiment CONFIRMS
    this hypothesis with evidence before attempting a fix.

    EXISTING CODE TO READ FIRST:
    - results/experiment_883_vjepa_v2_expanded_corpus.json — ood_auc=0.9211, svamp_auc=0.125
    - python/carnot/verify/fover_labeler.py — FoVer step-labeling pipeline
    - python/carnot/pipeline/vjepa_predictor.py — VariationalJEPAPredictor
    - tests/data/svamp_samples.json (if exists) or download from SVAMPClean (arXiv 2509.18565)
    - openspec/change-proposals/research-roadmap-v69.md — .69 Phase 1 design

    TASK: Confirm that FoVer labeling is inapplicable to SVAMP single-step word problems.
    Measure CoT depth distribution, label noise rate, and VJEPA AUC on SVAMP-only pairs.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Load 20 SVAMP questions. Preferred source: tests/data/ directory. If not present:
       construct 20 representative single-step arithmetic word problems manually (cover add,
       subtract, multiply, divide). Example: "A farmer has 15 chickens. He sells 6. How many remain?"
    3. Run Qwen3.5-0.8B (via llama.cpp or transformers, CPU) on all 20 questions.
       Collect responses. Use CARNOT_FORCE_LIVE=0 (CPU inference is fine for small model).
    4. Run FoVer labeling pipeline on each (question, response) pair. For each pair collect:
       - n_cot_steps: int (number of reasoning steps detected by FoVer)
       - labeling_successful: bool (did FoVer produce a valid label?)
       - label_value: int or null
       - label_confidence: float or null
    5. Compute for SVAMP cohort:
       - mean_cot_depth: mean(n_cot_steps) across 20 questions
       - labeling_failure_rate: fraction where labeling_successful=False
       - label_noise_estimate: fraction with label_confidence < 0.5 (if confidence available)
    6. Also run same pipeline on 20 GSM8K questions (for comparison). Collect same stats.
    7. Run VJEPA v2 (python/carnot/pipeline/vjepa_predictor.py) on SVAMP-labeled pairs
       that DID get a label. Compute svamp_auc. Compare to gsm8k_auc.
    8. Compute labeling_mismatch_confirmed:
       True if ALL of: mean_cot_depth_svamp < 2.0 AND mean_cot_depth_gsm8k > 4.0
                       AND labeling_failure_rate_svamp > 0.5
    9. Add spec entries: REQ-VER-085 (EstimationVerifier for word problems),
       SCENARIO-VER-085 (SVAMP answer in plausible range => verified).
    10. Build artifact:
       {
         mean_cot_depth_svamp: float,
         mean_cot_depth_gsm8k: float,
         labeling_failure_rate_svamp: float,
         labeling_failure_rate_gsm8k: float,
         svamp_auc: float,
         gsm8k_auc_for_comparison: float,
         labeling_mismatch_confirmed: bool,
         n_svamp_questions: 20,
         n_gsm8k_questions: 20,
         honest_verdict: str
       }
    11. honest_verdict:
        - "mismatch_confirmed_gate_open" if labeling_mismatch_confirmed=True (gates Exp 896)
        - "mismatch_unconfirmed_investigate_further" if labeling_mismatch_confirmed=False
    12. Write tests with 100% coverage. Test FoVer labeling on single-step vs multi-step.
        Test labeling_mismatch_confirmed logic. Traces to REQ-VER-085.
    13. Write results/experiment_893_svamp_root_cause.json.
    14. Update ops/changelog.md: one-line entry.
    15. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_893_svamp_root_cause.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp894-vjepa-streaming-filter
  milestone: 2026.04.69
  deliverable: results/experiment_894_vjepa_streaming_filter.json
  title: 'Exp 894: VJEPA Live Streaming Filter — Generation-Time Logit Masking (GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: VJEPA v2 achieved ood_auc=0.9211 and is deployed as Tier 2 post-hoc filter.
    The next architectural step is to move VJEPA guidance EARLIER: use its violation
    probability to influence logit selection DURING generation rather than filtering
    afterward. This connects to arXiv 2502.03685 (Controlled LLM Decoding via Discrete
    Autoregressive Biasing) and arXiv 2603.03305 (Draft-Conditioned Constrained Decoding).

    This experiment wires VJEPA as a generation-time LogitsProcessor in HuggingFace
    transformers. At each generation step, the current CoT prefix is encoded by VJEPA
    and its violation_probability modulates the logits before sampling.

    EXISTING CODE TO READ FIRST:
    - results/experiment_884_vjepa_cascade_deploy.json — Tier 2 deployment, model path
    - python/carnot/pipeline/vjepa_predictor.py — VariationalJEPAPredictor (encoder, violation_prob)
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline
    - python/carnot/verify/streaming_cot.py — StreamingCoT (Exp 874, Tier 0g — for pattern reference)
    - openspec/change-proposals/research-roadmap-v69.md — .69 Phase 2 design

    TASK: Implement VJEPAStreamingLogitsProcessor. Wire to Gemma4-E4B-it generation.
    Run 25 GSM8K questions. Measure signed_improvement vs baseline.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_884_vjepa_cascade_deploy.json. Extract:
       - vjepa_model_path: path to saved VJEPA weights
       - vjepa_ood_auc: 0.9211 (confirm)
    3. Implement python/carnot/pipeline/vjepa_streaming_processor.py:
       class VJEPAStreamingLogitsProcessor(LogitsProcessor):
         (import from transformers.generation.logits_process)
         __init__(self, vjepa: VariationalJEPAPredictor, tokenizer,
                  violation_threshold: float = 0.75, penalty_scale: float = 2.0):
           self.vjepa = vjepa
           self.tokenizer = tokenizer
           self.violation_threshold = violation_threshold
           self.penalty_scale = penalty_scale
           self.prefix_history = []
           self._applied_count = 0
         __call__(self, input_ids: torch.LongTensor, scores: torch.FloatTensor) -> torch.FloatTensor:
           STEP 1: Decode current prefix from input_ids: text = tokenizer.decode(input_ids[0])
           STEP 2: Compute violation_prob = self.vjepa.violation_probability(text)
           STEP 3: If violation_prob > self.violation_threshold:
                     # Apply soft penalty: suppress tokens that correlate with wrong answers
                     # Use VJEPA KL divergence to identify high-violation next-token directions
                     # Conservative: apply uniform downscale to all logits by penalty_scale
                     # (Future work: per-token KL-guided masking)
                     scores = scores / self.penalty_scale
                     self._applied_count += 1
           Return scores
         property applied_count -> int
    4. Add spec entries: REQ-TIER2-009 (VJEPA streaming logit guidance),
       SCENARIO-TIER2-009 (streaming processor reduces constraint violations in generation).
    5. Create scripts/experiment_894_vjepa_streaming_filter.py:
       a. Setup: tmpl = ExperimentTemplate(894, ..., requires_gpu=True). tmpl.setup().
       b. Load Gemma4-E4B-it via transformers (same as Exp 881).
          CARNOT_FORCE_LIVE=1 required. sg render -c '...' for ROCm GPU group access.
       c. Load VJEPA v2 weights from vjepa_model_path.
       d. Instantiate VJEPAStreamingLogitsProcessor(vjepa, tokenizer).
       e. Load 25 GSM8K questions from tests/data/gsm8k_sample.json (or equivalent).
       f. Baseline run (no streaming): generate answers for all 25 without processor.
          baseline_correct = count correctly answered questions.
       g. Streaming run: generate with logits_processor=[vjepa_streaming_processor].
          streaming_correct = count correctly answered questions.
          streaming_applied_count = vjepa_streaming_processor.applied_count
       h. Collect metrics:
          - gsm8k_accuracy_baseline: baseline_correct / 25
          - gsm8k_accuracy_streaming: streaming_correct / 25
          - signed_improvement: streaming_correct - baseline_correct
          - streaming_filter_applied_count: int (how often VJEPA triggered penalty)
          - streaming_filter_applied_pct: streaming_applied_count / (25 * avg_steps)
          - violation_threshold: 0.75
          - avg_tokens_per_question: float
    6. honest_verdict:
       - "streaming_positive" if signed_improvement > 0
       - "streaming_neutral" if signed_improvement == 0
       - "streaming_negative" if signed_improvement < 0
       - "streaming_blocked_no_gpu" if GPU not available
    7. Write tests with 100% coverage. Mock vjepa.violation_probability. Test that
       scores are divided by penalty_scale when threshold exceeded. Test applied_count.
       Test that scores unchanged below threshold. Traces to REQ-TIER2-009.
    8. Update ops/changelog.md, ops/status.md.
    9. tmpl.assert_deliverable_written() as final line.
    10. Write results/experiment_894_vjepa_streaming_filter.json.

    Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu sg render -c '.venv/bin/pytest tests/python/test_experiment_894_vjepa_streaming_filter.py -v'
    Do NOT push. Do NOT modify scripts/research_conductor.py.

