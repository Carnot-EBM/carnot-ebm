- id: exp1128-sos-kan-root-cause-k5-fix
  milestone: 2026.04.88
  deliverable: results/experiment_1128_sos_kan_root_cause_k5_fix.json
  title: "SOS-KAN Polarity Fix v2 — k=5 Ensemble Net-Positive Repair"
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 30
  priority: high
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1047-sos-kan-reparameterization
      verdict: kan_reparam_partial
      addressed_by: |
        exp1047 introduced the SOSKANEnergyV3 reparameterization. It shipped
        but no production AUROC was measured at the time. exp1128 is the FIRST
        attempt to measure the verifier's individual AUROC against a
        held-out FoVer eval set — discovers AUROC=0.3333 (below chance,
        polarity inverted). Addresses by fixing polarity OR retraining with
        correct labels.
      retire_if_same_verdict: false
    - experiment_id: exp1072-sos-kan-v3-neural-gram
      verdict: neural_gram_shipped
      addressed_by: |
        exp1072 evolved the SOSKAN to v3 with neural-gram extension. Same
        polarity / label issue that exp1128 is now diagnosing — exp1072 was
        about architecture, not about training-label correctness. exp1128
        addresses the orthogonal label/polarity issue.
      retire_if_same_verdict: false
    - experiment_id: exp1108-ensemble-diversity-v2-and-composition
      verdict: and_composition_viable_at_k5_subset_k6_above_threshold_honest_negative
      addressed_by: |
        exp1108 measured pairwise correlations and confirmed k=5 subset has
        max r < 0.5, but did NOT measure individual verifier AUROC. The
        diversity finding (mechanism-orthogonal) is correct; the AUROC issue
        with SOSKANEnergyV3 was orthogonal and unexposed by exp1108's
        correlation methodology. exp1128 measures and fixes it directly.
      retire_if_same_verdict: false
    - experiment_id: exp1121-k5-and-compose-production
      verdict: k5_deployed_and_benchmarked
      addressed_by: |
        exp1121 wired the k=5 ensemble to production but the verdict
        "k5_deployed_and_benchmarked" obscured that the ensemble AUROC=0.5547
        is WORSE than the best individual verifier (SemEnergyProbe AUROC=
        0.8964) due to SOSKANEnergyV3's inverted polarity. exp1128 is the
        explicit follow-up fixing the SOSKANEnergyV3 polarity/training so
        the production wiring becomes net-positive.
      retire_if_same_verdict: false
    - experiment_id: exp693-jepa-v15-root-cause
      verdict: root_cause_identified_v16_specced
      addressed_by: |
        FALSE-POSITIVE MATCH: the conductor's keyword matcher flagged this
        prior because both titles contain "root cause" — but exp693 is about
        JEPA architecture diagnosis, completely unrelated to SOSKANEnergyV3
        verifier polarity. This entry is included to satisfy the rerun-
        discipline check; it does not represent a real prior failure of
        this work.
      retire_if_same_verdict: false
    - experiment_id: exp833-constraint-delta-root-cause
      verdict: write_path_missing
      addressed_by: |
        FALSE-POSITIVE MATCH: keyword matcher flagged this prior because
        both titles contain "root cause" — but exp833 is about constraint
        delta diagnosis, completely unrelated to SOSKANEnergyV3 polarity.
        Included to satisfy rerun-discipline check; not a real prior failure
        of this work. Suggests the matcher's scaffolding-token list should
        also exclude "root", "cause", "diagnosis" — filed for future Issue 5
        refinement.
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    The k=5 AND-compose ensemble was deployed in exp1121 but benchmarked WORSE than the
    best individual verifier:
      - k=5 ensemble AUROC: 0.5547
      - SemEnergyProbe individual AUROC: 0.8964 (BEST)
      - SOSKANEnergyV3 individual AUROC: 0.3333 (BELOW CHANCE — actively degrading ensemble)
      - Z3MathVerifier: 0.6909
      - ASTStructureVerifier: 0.5562
      - SemanticConsistencyVerifier: 0.5281

    SOSKANEnergyV3 at AUROC=0.333 means it is producing INVERTED scores — higher energy when
    the response is correct, lower when incorrect. This is the opposite of what the ensemble
    needs. The AND-compose aggregation amplifies this inversion across all 5 verifiers.

    From exp1121 artifact:
    - benchmark_individual_aurocs.SOSKANEnergyV3 = 0.3333
    - and_compose_verifiers includes SOSKANEnergyV3

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/kaem_energy.py (look for SOSKANEnergyV3 class or energy() method)
    - python/carnot/verify/ directory (find AND-compose logic)
    - results/experiment_1121_k5_and_compose_production.json (read benchmark results)
    - results/experiment_1108_ensemble_diversity_v2_and_composition.json (prior r_corr results)
    - python/carnot/pipeline/verify_repair.py (find how verifiers are called for scores)

    TASK:
    1. Find SOSKANEnergyV3 source. Read its energy() method and how it returns scores.
    2. Test it on 10 known-correct vs 10 known-incorrect FoVer examples:
       - Load data/fover_corpus.jsonl (or fover_corpus_v4.json), take first 10 pairs
       - Call SOSKANEnergyV3.energy(correct_response) and SOSKANEnergyV3.energy(incorrect_response)
       - Report: mean correct energy, mean incorrect energy, which direction is wrong?
    3. Diagnose the root cause from the three hypotheses:
       a. POLARITY INVERTED: the model returns high energy for correct outputs (fix: negate output)
       b. NOT CONVERGED: weights near zero, random output (fix: re-train from scratch)
       c. WRONG LABEL MAPPING: trained with flipped labels (fix: retrain with correct labels)
    4. Fix the root cause:
       - If polarity inverted: add sign flip in SOSKANEnergyV3.energy() or in the ensemble adapter
       - If not converged: re-train on 500 random FoVer pairs (fast: 50 epochs, Adam lr=1e-3)
       - If label error: re-train with correct positive/negative label assignment
    5. After fix: re-run k=5 ensemble benchmark on 500 FoVer examples
       - If k5 AUROC > 0.80: success
       - If k5 AUROC 0.65-0.80: partial fix, note what else needs attention
       - If k5 AUROC < 0.65: SOSKANEnergyV3 is incompatible with AND-compose; replace with
         a calibrated isotonic regression wrapper on SemEnergyProbe output (duplicate the best
         verifier at different confidence thresholds as the 5th ensemble member)

    CONCRETE STEPS:
    - Read python/carnot/models/kaem_energy.py
    - python3 -c "
      import json
      with open('data/fover_corpus_v4.json') as f: corpus = json.load(f)
      pairs = [(p['correct'], p['incorrect']) for p in corpus[:10]]
      # import SOSKANEnergyV3 and test
      "
    - Fix the root cause in the source file
    - Re-benchmark: python3 -c "
      from python.carnot.verify import build_k5_ensemble
      # run 500-example benchmark
      "
    - Write results/experiment_1128_sos_kan_root_cause_k5_fix.json

    REQUIRED ARTIFACT FIELDS:
    - sos_kan_root_cause: str ("polarity_inverted" | "not_converged" | "label_error" | "unknown")
    - sos_kan_energy_on_correct_before: float
    - sos_kan_energy_on_incorrect_before: float
    - fix_applied: str (description of what was changed)
    - k5_ensemble_auroc_before: 0.5547
    - k5_ensemble_auroc_after: float
    - k5_ensemble_auroc_above_08: bool
    - sos_kan_individual_auroc_after: float
    - sos_kan_root_cause_identified: bool
    - honest_verdict: "fixed_k5_above_08" | "partial_fix_k5_above_065" | "unfixable_sos_kan_replaced" | "root_cause_unknown_no_improvement"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1128_sos_kan_root_cause_k5_fix.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1129-grpo-energy-prm-v2
  milestone: 2026.04.88
  deliverable: results/experiment_1129_grpo_energy_prm_v2.json
  title: "GRPO Energy PRM Full Training v2 — DualGPU MANDATORY (600s budget, 100 questions)"
  model: opus
  max_turns: 60
  estimated_wall_time_min: 50
  priority: high
  requires_gpu: true
  grace_period_s: 2400
  prior_failures:
    - experiment_id: exp1118-grpo-energy-prm-v1
      verdict: training_wall_budget_hit
      addressed_by: "Increasing training budget from 240s to 600s; n_training from 50 to 100 questions; applying DRA-GRPO diversity penalty (arXiv 2505.09655) and CPPO proxy reuse (arXiv 2503.22342) to make better use of the N=8 completion budget. DualGPU MANDATORY hard constraint."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Exp 1118 proved GRPO+ThinkPRM v2 is positive: +4pp (24%→28% on 25-question holdout).
    BUT: training_wall_budget_hit=True — only 42/50 questions were processed in 240s budget.
    Score mean was 0.861 (high), advantage_stdev=0.106 (low, hinting at mode collapse in the
    8-completion groups). DualGPU was used successfully (cuda_device_count=2, dualgpu_used=True).

    This is a full training run. CRITICAL: DualGPU is MANDATORY. If cuda_device_count < 2
    or dualgpu_used=False after setup, write a blocked artifact and do NOT run training.

    From exp1118:
    - sota_path: /home/ianblenke/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/...
    - thinkprm_v2_artifact_path: results/experiment_1111_thinkprm_v2_retrain_7349_prm.json
    - advantage_weight_used: 0.1, group_size_n: 8

    New parameters for v2:
    - n_training_questions: 100 (was 50; use GSM8K questions 500-600 to avoid overlap with prior training)
    - training_budget_s: 600 (was 240)
    - group_size_n: 8 (unchanged)
    - advantage_weight: 0.1 (unchanged)
    - diversity_penalty: 0.05 (NEW — penalize cosine similarity > 0.90 among the 8 completions;
      DRA-GRPO arXiv 2505.09655)
    - proxy_reuse_k: 3 (NEW — reuse 3 semantically nearest prior completions as proxy group members;
      CPPO arXiv 2503.22342; reduces inference cost per group by ~37%)
    - n_eval_questions: 50 (was 25)

    EXISTING CODE TO READ FIRST:
    - results/experiment_1118_grpo_energy_prm_v1.json (read training loop implementation notes)
    - scripts/experiment_1118_grpo_energy_prm_v1.py (if it exists — read the training loop)
    - python/carnot/pipeline/verify_repair.py (CARNOT_FAST_EVAL flag added in exp1117)
    - results/experiment_1111_thinkprm_v2_retrain_7349_prm.json (verify thinkprm_model_path)

    TASK:
    1. Verify DualGPU: import torch; assert torch.cuda.device_count() >= 2; if not, write blocked artifact.
    2. Load the SOTA GGUF model (same path as exp1118). Confirm it loads on GPU.
    3. Load ThinkPRM v2 (from exp1111 artifact path). Confirm it's accessible.
    4. Implement training loop v2:
       a. For each of 100 questions (GSM8K index 500-600):
          - Generate N=8 completions
          - Apply DRA-GRPO diversity penalty: if any pair has cosine_similarity > 0.90, reduce
            their advantage contribution by diversity_penalty=0.05
          - Score each completion with ThinkPRM v2 (continuous [0,1])
          - Compute group-relative advantage: (score - group_mean) / group_std
          - Log running advantage_stdev (target: > 0.15 vs exp1118's 0.106)
       b. Stop when 600s budget is consumed OR all 100 questions processed
    5. Evaluate on 50 holdout questions (GSM8K index 700-750 to avoid train/test overlap):
       - baseline: direct SOTA model answer (no GRPO influence)
       - trained: apply advantage-weighted logit adjustment if feasible
       - Record: baseline_fraction_correct, trained_fraction_correct, improvement_over_baseline
    6. Write artifact

    CONCRETE STEPS:
    - python3 -c "import torch; print(f'GPUs: {torch.cuda.device_count()}'); [print(torch.cuda.get_device_name(i)) for i in range(torch.cuda.device_count())]"
    - (Confirm 2x RTX 3090)
    - python3 scripts/experiment_1129_grpo_energy_prm_v2.py

    REQUIRED ARTIFACT FIELDS:
    - dualgpu_used: bool (MUST be True or artifact is blocked)
    - cuda_device_count: int
    - n_training_questions: int (target: 100)
    - training_seconds: float
    - training_wall_budget_hit: bool
    - advantage_stdev: float (target: > 0.15; higher = better diversity)
    - diversity_penalty_applied: bool
    - proxy_reuse_applied: bool
    - n_eval_questions: int (target: 50)
    - baseline_fraction_correct: float
    - trained_fraction_correct: float
    - improvement_over_baseline: float
    - grpo_v2_honest_result: bool (always True — any result is honest)
    - honest_verdict: "positive_improvement" | "no_improvement" | "negative_regression" | "blocked_no_dualgpu"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1129_grpo_energy_prm_v2.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1130-zenil-alpha-t-post-retrain
  milestone: 2026.04.88
  deliverable: results/experiment_1130_zenil_alpha_t_post_retrain.json
  title: "Zenil α_t Re-Measurement v2 — Post-Retrain Verifier on FR-11 Corpus"
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 30
  priority: medium
  requires_gpu: true
  prior_failures:
    - experiment_id: exp1046-zenil-alpha-t-fr11
      verdict: blocked_no_live_gpu
      addressed_by: |
        exp1046 was blocked because no live GPU was available for measurement.
        exp1130 explicitly requires_gpu=true and runs after the dual-GPU
        ROCm path landed (post-exp1120). The original measurement
        constraint that blocked exp1046 has been resolved by infrastructure
        improvements; this is the same task with the GPU prerequisite met.
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The energy verifier was retrained in exp1120 on 7329-pair SOTA corpus: AUROC improved to
    0.9774 and the energy inversion was fixed (correct < incorrect ordering restored). The prior
    Zenil alpha_t measurement (exp1112) used the pre-retrain verifier with alpha_t=0.38 on SOTA
    model Qwen3.6-35B-A3B. Re-measuring alpha_t with the new verifier answers: does a better-
    calibrated verifier provide stronger grounding for self-distillation (higher alpha_t)?

    The Zenil alpha_t formula: alpha_t = fraction of self-distillation signal that comes from
    the exogenous verifier vs the LLM's own distribution. Higher alpha_t = more external
    grounding = more self-improvement possible without collapse (per arXiv 2601.05280).

    From exp1112 artifact: alpha_t = 0.38 (with pre-retrain verifier)
    From exp1120 artifact: retrained_auroc_val = 0.977419, inversion_fixed = True

    EXISTING CODE TO READ FIRST:
    - results/experiment_1112_llm_failure_exemplar_corpus_v1.json (read alpha_t measurement method)
    - results/experiment_1120_energy_verifier_retrain_sota.json (read retrained model path)
    - python/carnot/pipeline/verify_repair.py (find how verifier scores are computed post-retrain)
    - docs/research-notes/zenil-alpha-verifier-derivation.md (if exists, read alpha_t formula)

    TASK:
    1. Read the alpha_t measurement method from exp1112.
    2. Load the retrained verifier from exp1120 (check artifact for model path or checkpoint).
    3. On 50 fresh SOTA model outputs (GSM8K, SOTA Qwen3.6-35B-A3B-GGUF, live GPU):
       a. Generate 50 responses
       b. Score each with the retrained verifier: verifier_score = E(response)
       c. Score each with ThinkPRM v2: thinkprm_score = P(correct)
       d. Compute alpha_t = corr(verifier_score, ground_truth_label) — or use the formula from exp1112
    4. Compare: alpha_t_post_retrain vs prior alpha_t=0.38
    5. Log as a FR-11 (Autonomous Self-Learning Loop) data point in ops/changelog.md

    CONCRETE STEPS:
    - cat results/experiment_1112_llm_failure_exemplar_corpus_v1.json | python3 -c "import json,sys; d=json.load(sys.stdin); print([k for k in d.keys()])"
    - (Read method from exp1112, then implement)
    - python3 scripts/experiment_1130_zenil_alpha_t_post_retrain.py

    REQUIRED ARTIFACT FIELDS:
    - alpha_t_prior: 0.38
    - alpha_t_post_retrain: float
    - alpha_t_improved: bool (True if post > prior)
    - verifier_auroc_used: float (0.9774)
    - n_evaluation_examples: int
    - inference_mode: "live_gpu" (preferred) or "cached"
    - fr11_self_learning_data_point_logged: bool
    - zenil_alpha_t_post_retrain_measured: bool (always True)
    - honest_verdict: "alpha_t_improved" | "alpha_t_unchanged" | "alpha_t_degraded" | "measurement_incomplete"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1130_zenil_alpha_t_post_retrain.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1131-lagrangian-cascade-v2
  milestone: 2026.04.88
  deliverable: results/experiment_1131_lagrangian_cascade_v2.json
  title: "Lagrangian Cascade v2 — Accuracy-Preserving Router (prior: exp1123 -22.9pp accuracy)"
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 25
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1123-adaptive-cascade-lagrangian
      verdict: savings_positive_accuracy_degraded
      addressed_by: "Adding SemEnergyProbe score and ThinkPRM confidence as router input features (exp1123 used no verifier-score features — pure feature-free MLP). Increasing hidden size 32→128. Adding min-TP constraint to Lagrangian dual (target: TP ≥ 0.90 at any cascade depth). The arXiv 2604.14853 paper allows per-instance Lagrange multiplier λ updates when accuracy constraint is violated."
      retire_if_same_verdict: false
  gated_on:
    - upstream: exp1128-sos-kan-root-cause-k5-fix
      artifact_field: k5_ensemble_auroc_above_08
      op: "=="
      value: true
  prompt: |
    CONTEXT:
    Exp 1123 achieved 99.98% cascade cost savings (111ms → 0.017ms) via a Lagrangian dual MLP
    router, but with -22.9pp accuracy degradation (TP 0.743 vs 0.971 fixed). The root cause:
    the MLP was trained with zero verifier-score features — it had no signal about correctness.
    The router was learning to ALWAYS predict shallow depth (fast path) regardless of difficulty.

    From exp1123 artifact:
    - mlp_hidden_size: 32
    - mlp_val_accuracy: 0.754
    - fixed_cascade_cost_ms: 111.017
    - adaptive_cascade_cost_ms: 0.017
    - cost_savings_pct: 99.98
    - adaptive_tp_rate: 0.7429
    - fixed_tp_rate: 0.9714
    - accuracy_delta: -0.2286

    The fix from arXiv 2604.14853 (Lagrangian cascade, the basis for exp1123): add per-example
    constraint λ updates when the accuracy constraint is violated. The global budget decomposes
    to per-instance supervised classification via the KKT dual variable — use the verifier's
    energy score as the primary input feature.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1123_adaptive_cascade_lagrangian.json (read full implementation)
    - scripts/experiment_1123_adaptive_cascade_lagrangian.py (if exists, read MLP architecture)
    - python/carnot/pipeline/verify_repair.py (find SemEnergyProbe score method)
    - data/fover_corpus_v4.json (training data)

    TASK:
    1. Read exp1123 implementation. Understand the MLP input features used.
    2. v2 design:
       a. Input features (expand from exp1123's feature-free design):
          - sem_energy_score: SemEnergyProbe.score(response) — 0.017ms per call
          - response_length: len(response.split()) (normalized)
          - step_count: number of "Step N:" markers in response
       b. MLP: hidden_size=128 (was 32), 2 layers, ReLU
       c. Lagrangian dual update: after each batch, if TP_batch < 0.90, increase λ by 0.01
       d. Training: 5000 FoVer examples with CARNOT_FAST_EVAL=1 (fast sampling)
    3. Evaluate on 500 holdout FoVer examples:
       - adaptive_tp_rate, fixed_tp_rate (target: adaptive_tp >= 0.90 x fixed_tp)
       - cost_savings_pct (target: > 0% — any savings is a win if accuracy holds)
       - accuracy_delta = adaptive_tp - fixed_tp (target: > -0.05)
    4. Write artifact

    CONCRETE STEPS:
    - python3 -c "import os; os.environ['CARNOT_FAST_EVAL']='1'; # test import"
    - python3 scripts/experiment_1131_lagrangian_cascade_v2.py

    REQUIRED ARTIFACT FIELDS:
    - mlp_hidden_size: 128
    - verifier_score_features_used: list[str]
    - min_tp_constraint: 0.90
    - adaptive_tp_rate: float
    - fixed_tp_rate: float
    - accuracy_delta: float (adaptive_tp - fixed_tp)
    - cost_savings_pct: float
    - cascade_v2_accuracy_delta_above_neg05: bool (accuracy_delta > -0.05)
    - cost_savings_pct_positive: bool (cost_savings_pct > 0)
    - honest_verdict: "savings_accuracy_both_positive" | "savings_positive_accuracy_acceptable" | "savings_positive_accuracy_still_degraded" | "no_improvement_over_exp1123"

    Run: JAX_PLATFORMS=cpu CARNOT_FAST_EVAL=1 python scripts/experiment_1131_lagrangian_cascade_v2.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1132-goodfire-exemplar-cascade-tp
  milestone: 2026.04.88
  deliverable: results/experiment_1132_goodfire_exemplar_cascade_tp.json
