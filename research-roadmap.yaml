  - id: exp334-verge-iterative-z3
    milestone: "2026.05.06"
    deliverable: results/experiment_334_verge_refinement.json
    title: "Exp 334: VERGE-style iterative Z3 refinement — targeted step repair from UNSAT assertion"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: VERGE (arXiv 2601.20055) implements an iterative SMT-refinement loop:
        1. Translate CoT response into Z3 assertions (NL2Z3Extractor, Exp 310)
        2. Run Z3 → if UNSAT, extract which assertion failed
        3. Ask the LLM to fix ONLY that specific step
        4. Regenerate Z3 code for the fixed step and re-verify
        5. Repeat until SAT or max_iterations reached

      This is superior to Carnot's current approach (whole-response Ising repair) because:
        - It identifies the SPECIFIC step that's wrong, not just that something is wrong
        - It repairs only the broken step, not the whole response (reduces repair artifacts)
        - It verifies the repair immediately before continuing (closed-loop correction)

      VERGE achieved near-perfect accuracy on multi-step math problems. This experiment
      implements a simplified version and benchmarks it against the current whole-response
      Z3-gated repair (Exp 312).

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/nl2z3_extractor.py — NL2Z3Extractor, Z3Result, run_z3_code()
      - python/carnot/pipeline/z3_gated_repair.py — Z3GatedRepair (Exp 312)
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
      - results/experiment_312_z3_gated_results.json — Z3-gated baseline to compare against
      - results/experiment_334_verge_refinement.json — will be written here

      TASK: Implement VERGE-style iterative Z3 refinement.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-REPAIR-012 (VERGE iterative refinement), REQ-REPAIR-013 (step isolation),
         SCENARIO-REPAIR-024–027 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - VergeIteration dataclass: iteration_n, assertion_failed, step_text, repair_prompt,
           repaired_step, new_z3_result, resolved bool
         - extract_failed_assertion(z3_result: Z3Result) → str | None:
           parses Z3 UNSAT output to find which assertion triggered UNSAT
           returns the assertion string or None if not parseable
         - build_step_repair_prompt(assertion_failed, response, context) → str:
           prompt asking LLM to fix only the step that produced the failed assertion
         - VergeRefiner(nl2z3_extractor, max_iterations=3):
           refine(question, response) → list[VergeIteration]
           if initial Z3 result is SAT: return [] (no refinement needed)
           else: iteratively extract, prompt, re-verify
         - benchmark comparison: n_questions_resolved_by_verge vs n_by_z3_gated
         - honest: report n_iterations_per_question distribution (some need 1, some need 3)
         - timeout: each iteration has 5s Z3 timeout; total max 30s per question
      4. Implement python/carnot/pipeline/verge_refiner.py:
         - extract_failed_assertion(z3_result) → str | None:
           use regex to find "model is: [...]" or "(declare-fun ..." in UNSAT proof output
           fallback: return first assertion in z3_code if UNSAT but no specific assertion found
         - build_step_repair_prompt(assertion_failed, full_response) → str:
           "The following step in your reasoning is arithmetically inconsistent:\n{assertion}\n
           Please correct only that specific step and rewrite the corrected step."
         - VergeRefiner(nl2z3_extractor, llm_caller, max_iterations=3):
           refine(question, response) → tuple[str, list[VergeIteration]]:
           Returns (final_response, iteration_log)
           Iteration: get Z3 result → if UNSAT: extract_failed_assertion → build_step_repair_prompt
                       → call LLM → patch response → re-run Z3
      5. Add VerifyRepairPipeline.verify_repair_verge() integration (additive).
      6. Export VergeRefiner from python/carnot/pipeline/__init__.py.
      7. Write scripts/experiment_334_verge_refinement.py using ExperimentTemplate(334, ...):
