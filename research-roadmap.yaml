milestone: "2026.05.177"
milestone_title: "Neuro-Symbolic Extraction, Compositional Energy, and KAN Hardware"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
scope_reduction_compliance:
  rationale: "Aligns with PRD gaps: addresses extraction, multi-constraint degradation, and hardware substrate preparation. Reduces scope by bounding KAN work to python logic without hardware board claims."
  carry_forwards_addressed: []
authored_by: outer-loop-claude

tasks:
  - id: exp1771-care-test-suite
    title: "Exp 1771: Phase 1 - Setup CARM Test Cases and Ground Truth"
    deliverable: results/experiment_1771_care_test_suite.json
    max_turns: 20
    agent_type: codex
    prompt: |
      CONTEXT: The extraction gap requires a Constraint-Aware Retrieval Module (CARM). We need a benchmark suite first.
      
      EXISTING CODE TO READ FIRST:
        - openspec/change-proposals/research-roadmap-vNEXT.md
      
      TASK: Create 20 unstructured instruction prompts and their ground truth deterministic constraint representations.
      
      CONCRETE STEPS:
        1. Write a python script to generate `results/carm_benchmark_cases.json`.
        2. Ensure the cases cover tool-use, arithmetic, and logic constraints.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.carm.benchmark.v1"
        - num_cases: 20
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1772-care-prototype
    title: "Exp 1772: Phase 1 - Prototype Constraint-Aware Retrieval using SOTA models"
    deliverable: results/experiment_1772_care_prototype.json
    max_turns: 50
    prompt: |
      CONTEXT: We must bridge the extraction gap using CARM principles.
      
      EXISTING CODE TO READ FIRST:
        - results/experiment_1771_care_test_suite.json
      
      TASK: Implement a prototype Constraint-Aware Retrieval Module that uses SOTA models to extract constraints.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1772_carm_prototype.py`.
        2. Use MODEL_SPECS with `unsloth/Qwen3.6-35B-A3B-GGUF`.
        3. Evaluate extraction accuracy on the test suite.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.carm.prototype.v1"
        - extraction_accuracy: float
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1773-care-evaluation
    title: "Exp 1773: Phase 1 - Run full CARM extraction suite and evaluate constraint recall"
    deliverable: results/experiment_1773_care_evaluation.json
    max_turns: 50
    gated_on:
      - upstream: exp1772-care-prototype
        artifact_field: extraction_accuracy
        op: '>='
        value: 0.5
    prompt: |
      CONTEXT: Evaluate the full CARM extraction suite using mandated local SOTA models.
      
      EXISTING CODE TO READ FIRST:
        - scripts/experiment_1772_carm_prototype.py
      
      TASK: Run full suite with `unsloth/gemma-4-31B-it-GGUF` and `unsloth/gemma-4-26B-A4B-it-GGUF`.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1773_carm_eval.py`.
        2. Compare extraction recall against ground truth.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.carm.evaluation.v1"
        - recall_rate: float
        - false_accept_rate: float
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1774-cem-decomposition
    title: "Exp 1774: Phase 2 - Decompose multi-constraint problem into local energy subsets"
    deliverable: results/experiment_1774_cem_decomposition.json
    max_turns: 30
    agent_type: codex
    prompt: |
      CONTEXT: Complex multi-constraint optimization degrades. We need Compositional Energy Minimization (CEM).
      
      EXISTING CODE TO READ FIRST:
        - openspec/change-proposals/research-roadmap-vNEXT.md
      
      TASK: Write a logic decomposition engine that splits a monolithic constraint graph into localized energy landscapes.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1774_cem_decomposition.py`.
        2. Validate on existing CCTU tools.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.cem.decomposition.v1"
        - num_subsets: int
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1775-cem-solver
    title: "Exp 1775: Phase 2 - Implement Compositional Energy Minimization solver over subsets"
    deliverable: results/experiment_1775_cem_solver.json
    max_turns: 50
    agent_type: codex
    prompt: |
      CONTEXT: Implement the solver that runs parallel energy minimization across the decomposed subsets.
      
      EXISTING CODE TO READ FIRST:
        - scripts/experiment_1774_cem_decomposition.py
      
      TASK: Implement Parallel Energy Minimization (PEM) over the decomposed energy landscapes.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1775_cem_solver.py`.
        2. Ensure energy sum correctly models the global landscape.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.cem.solver.v1"
        - solver_success: bool
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1776-cem-evaluation
    title: "Exp 1776: Phase 2 - Evaluate CEM against monolithic baseline using SOTA models"
    deliverable: results/experiment_1776_cem_evaluation.json
    max_turns: 50
    gated_on:
      - upstream: exp1775-cem-solver
        artifact_field: solver_success
        op: '=='
        value: true
    prompt: |
      CONTEXT: Evaluate CEM on multi-constraint tasks using SOTA GGUFs.
      
      EXISTING CODE TO READ FIRST:
        - scripts/experiment_1775_cem_solver.py
      
      TASK: Run inference and repair using the new CEM solver with `unsloth/Qwen3.6-35B-A3B-GGUF`.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1776_cem_eval.py`.
        2. Record multi-constraint satisfaction rate.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.cem.evaluation.v1"
        - satisfaction_rate_monolithic: float
        - satisfaction_rate_cem: float
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1777-dab-integration
    title: "Exp 1777: Phase 2 - Add Discrete Auto-Regressive Biasing (DAB) to generation loop"
    deliverable: results/experiment_1777_dab_integration.json
    max_turns: 50
    prompt: |
      CONTEXT: To improve constraint satisfaction during generation, use DAB.
      
      EXISTING CODE TO READ FIRST:
        - openspec/change-proposals/research-roadmap-vNEXT.md
      
      TASK: Implement DAB in the structured decoding loop using local SOTA models.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1777_dab.py`.
        2. Use `unsloth/gemma-4-31B-it-GGUF`.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.dab.v1"
        - dab_success_rate: float
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1778-csl-baseline
    title: "Exp 1778: Phase 3 - Baseline online skill evaluation on execution traces"
    deliverable: results/experiment_1778_csl_baseline.json
    max_turns: 30
    prompt: |
      CONTEXT: For continuous self-learning, we need a baseline of execution traces.
      
      EXISTING CODE TO READ FIRST:
        - openspec/change-proposals/research-roadmap-vNEXT.md
      
      TASK: Collect multi-turn traces and apply current static skill scoring.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1778_csl_baseline.py`.
        2. Establish current retention/forgetting baseline.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.csl.baseline.v1"
        - baseline_soundness_mistakes: int
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1779-csl-nonforgetting
    title: "Exp 1779: Phase 3 - Implement non-forgetting soundness check for continuous learning"
    deliverable: results/experiment_1779_csl_nonforgetting.json
    max_turns: 30
    agent_type: codex
    prompt: |
      CONTEXT: Policy updates must be rigorous.
      
      EXISTING CODE TO READ FIRST:
        - scripts/experiment_1778_csl_baseline.py
      
      TASK: Implement the non-forgetting soundness check logic.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1779_csl_check.py`.
        2. Validate on synthetic trace updates.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.csl.check.v1"
        - check_implemented: true
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1780-csl-loop
    title: "Exp 1780: Phase 3 - Run FR-11 continuous self-learning loop with rigorous checks"
    deliverable: results/experiment_1780_csl_loop.json
    max_turns: 50
    gated_on:
      - upstream: exp1779-csl-nonforgetting
        artifact_field: check_implemented
        op: '=='
        value: true
    prompt: |
      CONTEXT: Run the self-learning loop safely.
      
      EXISTING CODE TO READ FIRST:
        - scripts/experiment_1779_csl_check.py
      
      TASK: Run FR-11 loop with `unsloth/Qwen3.6-35B-A3B-GGUF`.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1780_csl_loop.py`.
        2. Evaluate utility delta and soundness mistakes.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.csl.loop.v1"
        - utility_delta: float
        - soundness_mistakes: int
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1781-kan-lut
    title: "Exp 1781: Phase 4 - Draft Python LUT abstractions for KANs based on KANELÉ"
    deliverable: results/experiment_1781_kan_lut.json
    max_turns: 30
    agent_type: codex
    prompt: |
      CONTEXT: We must blueprint KANelE LUT structures for hardware accounting.
      
      EXISTING CODE TO READ FIRST:
        - openspec/change-proposals/research-roadmap-vNEXT.md
      
      TASK: Implement KANelE Look-Up Table evaluations in Python.
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1781_kan_lut.py`.
        2. Transform a small KAN tier to LUT format.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.kan.lut.v1"
        - lut_conversion_success: bool
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1782-kan-benchmark
    title: "Exp 1782: Phase 4 - Benchmark KANELÉ LUT representation BOPs and NABS against baseline"
    deliverable: results/experiment_1782_kan_benchmark.json
    max_turns: 40
    gated_on:
      - upstream: exp1781-kan-lut
        artifact_field: lut_conversion_success
        op: '=='
        value: true
    prompt: |
      CONTEXT: Benchmark hardware accounting for KAN LUTs.
      
      EXISTING CODE TO READ FIRST:
        - scripts/experiment_1781_kan_lut.py
      
      TASK: Measure Bit Operations (BOPs) and Number of Additions and Bit-Shifts (NABS).
      
      CONCRETE STEPS:
        1. Write `scripts/experiment_1782_kan_benchmark.py`.
        2. Generate explicit hardware_execution_claim=false metrics.
      
      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.kan.benchmark.v1"
        - bops: int
        - nabs: int
        - hardware_execution_claim: false
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.
