    title: "PHASE A1 (THE HEADLINE; §5 win condition; re-scope the failed C1) -- PROVE EFFICIENCY-PARITY: energy-verifier vs a WELL-PROMPTED LLM-judge on cross-family ARC selection, reported as an iso-FLOPs accuracy curve. .396 (exp4284) showed the energy verifier BEATS a Qwen3.6-35B judge (0.654 vs 0.212) at ~50M× lower cost -- BUT the judge scored BELOW random (0.25 for 4 candidates), so a skeptic blames the prompt. .397's harden (exp4294) FAILED to run (doomed-looped on the 2h cap + a strong_judge.py bug; no artifact -- a failed task, NOT a measured null). RE-SCOPE to fit the window AND remove the weak-prompt confound: (a) a STRONGER judge prompt (few-shot + explicit grid-reasoning + CoT, per Thinking-Small-Judges arXiv:2509.13332) + a 2nd judge model (gemma-4-31B alongside Qwen3.6-35B); (b) report the head-to-head as a FIXED-COMPUTE / iso-FLOPs accuracy curve (Budget-aware Discriminative Verification arXiv:2510.14913) -- a discriminative verifier (one forward pass) vs a CoT judge is a clean iso-compute comparison; (c) FIT THE WINDOW: single-synchronous-resume-accumulate, checkpoint after EVERY judge call, per-task progress prints (the codex idle-timeout fix), a PARTIAL (one well-prompted judge, n>=30) ACCEPTED -- headroom-route, do NOT gate-block. Emit efficiency_pareto_holds BARE bool := (energy accuracy within/above the BEST-prompted judge's CI AND cost_ratio <= 0.1). verifier_is_oracle=false. Precedent: CompassVerifier 2508.03686, Calibrated Reasoning 2509.19681. This is the operator's STATED §5 win condition, finally hardened."
