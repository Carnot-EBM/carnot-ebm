  - id: exp6115-phase-d-calibration-pool
    milestone: "2026.08.530"
    title: "Gated calibration-only authentic Phase-D candidate pool"
    priority: critical
    track: phase-d
    deliverable: results/experiment_6115_phase_d_calibration_pool.json
