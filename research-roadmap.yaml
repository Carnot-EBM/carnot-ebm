    2. Implement 4-bit and 8-bit quantization of the spline weights:
       - For 8-bit: round each spline control point to nearest 1/255 interval
       - For 4-bit: round to nearest 1/15 interval
       - Spline endpoint values (first and last control point of each spline) quantize
         separately with 2x more bits (per KANtize paper: endpoints more sensitive)
