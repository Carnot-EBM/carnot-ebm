  - id: exp305-kv260-verilog-ising-synthesis
    milestone: "2026.04.22"
    deliverable: hardware/kv260/ising_sampler_v1.v
    title: "Exp 305: KV260 Verilog Ising sampler — first synthesis pass with quantum-inspired schedule"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 228 designed the 4096-spin sparse Ising sampler architecture for KV260.
      Exp 288 brought up the KV260 FPGA (blocked by missing bitfile). Exp 289 implemented
      FpgaBackend with quantum-inspired annealing schedule (arXiv 2604.04606) and AXI-Lite
      register map. Now write the actual Verilog RTL that can be synthesized into a bitfile.

      Key design constraints from prior experiments:
      - AXI-Lite register map: SPIN_COUNT, BETA_FINAL, bias_words, row_ptr, edge_words (Exp 289)
      - Q8.8 fixed-point encoding (Exp 289 quantize_to_q88)
      - Sparse connectivity: max_degree=32 (Exp 289 sparsify_coupling)
      - Quantum annealing schedule: log-linear β(t) (Exp 289 quantum_annealing_schedule)
      - Mpemba-effect initialization: suppress slow relaxation modes (arXiv 2603.24183)
      - Start small: 128-spin prototype (matches Exp 288 ring-topology test)

      EXISTING CODE TO READ FIRST:
      - python/carnot/samplers/fpga_backend.py — AXI-Lite register map, Q8.8 format, schedule
      - docs/fpga-ising-design.md — Exp 228 architecture design doc
      - scripts/experiment_288_kv260_bringup.py — PYNQ register access pattern
      - hardware/ — check for existing Verilog files

      TASK: Write 128-spin Ising sampler Verilog RTL.
      1. Read CLAUDE.md spec-first workflow
      2. Add REQ-SAMPLE-011 (Verilog RTL for 128-spin Ising sampler),
         SCENARIO-SAMPLE-023/024 to openspec/capabilities/training-inference/spec.md
      3. Write tests for the Verilog simulation (Python testbench using cocotb or pure logic tests):
         - register_map_coverage: all registers from Exp 289 AXI map are addressable
         - spin_update_single_step: one Gibbs update on a 4-spin test graph gives correct energy
         - energy_computation: E = -Σ J_ij s_i s_j - Σ h_i s_i matches Python reference
         - annealing_schedule: β increases log-linearly from β_min to β_max
         - mpemba_init: starting from hot (random) initialization, convergence faster than
           cold initialization on a frustrated 4-spin ring
         - halt_condition: sampler halts after T steps, outputs final spins via AXI read
         Note: Python tests should validate the RTL logic via behavioral simulation, not
         require a physical FPGA. Use pure numpy simulation matching the Verilog logic.
      4. Implement hardware/kv260/ising_sampler_v1.v:
         a. Module ising_sampler_128 with parameters:
            N_SPINS=128, MAX_DEGREE=32, Q88_BITS=16, N_STEPS=1000
         b. AXI-Lite slave interface: AWADDR, AWVALID, WDATA, WVALID, ARADDR, ARVALID, RDATA
         c. Registers: CONTROL (start/reset), STATUS (done/running), SPIN_COUNT, BETA_FINAL,
            bias_ram[N_SPINS], adj_ram[N_SPINS*MAX_DEGREE], coupl_ram[N_SPINS*MAX_DEGREE],
            spin_out[N_SPINS/32] (packed ±1 as 0/1 bits)
         d. Gibbs update logic: for each spin i, compute local field h_eff = Σ_j J_ij s_j + h_i,
            compute acceptance probability p = sigmoid(2 * h_eff * β), compare to LFSR random
         e. LFSR-based pseudo-random number generator (Fibonacci 16-bit LFSR)
         f. Log-linear β schedule: β(t) = β_min * (β_max/β_min)^(t/T), computed in fixed-point
         g. Mpemba initialization: first 10% of steps run at β=0 (maximum temperature),
            then ramp from β_min (suppresses slow relaxation modes per arXiv 2603.24183)
         h. Checkerboard update order (even/odd spin alternation for parallelism)
      5. Create hardware/kv260/README.md documenting the register map, port list, synthesis steps
      6. Create scripts/simulate_ising_sampler.py: Python behavioral simulation matching the
         Verilog logic, used by tests to validate correctness without physical FPGA
      7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      8. Reconcile: update docs/fpga-ising-design.md, ops/changelog.md, ops/status.md
      9. Do NOT push. Do NOT modify scripts/research_conductor.py.

