  - id: exp4243-arc-candidate-pool-grow
    milestone: 2026.06.393
    title: "PHASE A1 (HEADLINE; the DATA-SPARSITY fix) -- GROW the labeled ARC candidate pool so the oracle-distinct aggregator has minority-correct evidence to learn from. .392's ARC tie was diagnosed DATA-SPARSITY: only 20 positive/correct candidates across 28419 (base-rate 0.0007), wrong_majority_n 0-9 on the held-out split -- too few minority-correct examples to learn or test a wrong-majority recoverer. FIX: assemble the MAXIMAL cached pool (ALL GAP-4 stage2 games + the GAP-4 induced programs + the existing 28419 candidate set), dedupe + relabel is_correct (candidate grid == gold/induced pred_grid), GROUPED by task_id; and IF positives remain below target, a BOUNDED candidate TOP-UP via the cached explore-induce-verify solver (exp4236) on the wrong-majority tasks (cap candidates/task + tasks to FIT THE WINDOW; honest partial if the cap is reached). Target: >=40 wrong-majority held-out tasks (oracle@K>vote@1) and a meaningfully larger positive_candidate_n than .392's 20. Report arc_pool_grown (BARE bool) + positive_candidate_n + wrong_majority_n + held_out_task_n + pool_artifact_path. NO TRM training; READ-ONLY w.r.t. the TRM checkpoint."
    priority: high
    track: verifier-oracle-distinct
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct learned ARC verifier is MANDATED by the 2026-06-14 P0 directive (HEADLINE = an oracle-distinct learned verifier closing GAP-3-ties-vote-on-ARC) -- false-positive scope-match vs retired GAP-3 content-EBM lineage / the .392 aggregator build (exp4231); forward difference = GROW the labeled pool toward >=40 wrong-majority tasks + more minority-correct positives (the .392-diagnosed data-sparsity fix, flagged by exp4238 SOTA-ingestion as bigger_arc_pool_full_set_encoder_agglm_aggregator_v393), verifier_is_oracle=false."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4243_arc_candidate_pool_grow.json
    prior_failures:
      - experiment_id: exp4231-oracle-distinct-arc-aggregator-build
        verdict: complete_oracle_distinct_arc_aggregator_no_learnable_gain_auroc0.7866
        addressed_by: "exp4231 built the aggregator on a pool with only 20 positive candidates (base-rate 0.0007) and reported no learnable gain; the downstream gate (exp4232) consequently tied vote. The .392 capstone disambiguated this as DATA-SPARSITY (code, with balanced ~0.6 pass-rate, WON at power). This task changes the INPUT, not the model: it GROWS the labeled ARC pool (maximal cached assembly + bounded solver top-up) toward >=40 wrong-majority tasks and many more minority-correct positives, so A2's set-encoder has evidence to learn the wrong-majority recovery the .392 pool could not supply."
        retire_if_same_verdict: true
    prompt: |
