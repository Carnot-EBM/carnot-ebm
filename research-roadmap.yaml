    - {project_root}/ops/arc_solve_registry.yaml,
      {project_root}/ops/arc_levelup_architecture_map.md, and
      {project_root}/ops/e2e-test-plan.md

    TASK:
    Rerun the frozen 20-game paired A/B under the exclusive-load prerequisite. Compare the default
    inline object table against table-absent plus production find_objects fetch. Keep the immutable
    Qwen3.8 generator, public agent route, 32K context, games, seeds, and budgets fixed.

    MODEL_SPECS:
    - unsloth/Qwen3.8-27B-GGUF: immutable scored ARC generator; do not replace or fine-tune it.
    - unsloth/Qwen3.6-35B-A3B-GGUF: mandated flagship MoE transport canary only; do not pool its
      rows with Qwen3.8 quality results.
    Resolve exact cached GGUF files and embedded tokenizers. Use llama.cpp CUDA. Legacy, CPU,
    remote, or substituted models cannot satisfy the live comparison.

    CONCRETE STEPS:
    0. PRECONDITIONS: require arc_exclusive_load_ready=true; verify the frozen 20 games and three
       seeds from Exp6753, current production E3AgentPolicy route, no new or duplicate solve target
       in the registry, architecture map freshness, exact Qwen3.8 and Qwen3.6 cache hashes, 32K
       context, llama.cpp CUDA, lease, ports, RAM, and disk. On failure write
       complete_blocked_object_table_ab_v2 with gate_check_summary and no fallback.
    1. Confirm existing ARC REQ-* anchors and add only narrow missing coverage. Write tests for
       frozen pairing, absent-table prompt construction, production find_objects dispatch, useful
       fetch scoring, token accounting, lease use, teardown, and no solve claim.
    2. Freeze the same game IDs, seeds 6100-6102, within-arm noise floor, prompts, context, action and
       tool budgets, selfparse schema, model hash, sampling configuration, and arm-order rotation as
       Exp6753.
    3. Acquire the Exp6764-tested lease policy and run only on the eligible leased device. Never
       signal unrelated processes. Tear down each owned session before changing arm or seed.
    4. Run arm A with the production inline object table. Run arm B with that table absent and the
