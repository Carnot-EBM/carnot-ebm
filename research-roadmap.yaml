        op: "=="
        value: true
      - upstream: exp3002-metamorphic-repair-oracle-audit
        artifact_field: metamorphic_oracle_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2991-gated-sota-intent-preserving-repair-hard-set
        verdict: "flagged: hard-set repair did not clear promotion gates"
        addressed_by: "Reruns only after SOTA cache refresh and metamorphic oracle readiness, with false-accept and tautology gates promoted to first-class fields."
        retire_if_same_verdict: true
      - experiment_id: exp2977-sota-intent-preserving-code-repair
        verdict: "blocked_cached_sota_pair_unavailable_cpu_smoke_only"
        addressed_by: "Uses the exp3001 SOTA cache gate so CPU smoke cannot become headline evidence."
        retire_if_same_verdict: true
      - experiment_id: exp2964-sota-dccd-repair-replication
        verdict: "complete: DCCD repair replication did not clear promotion gates; pass@1_delta=-0.2, syntax_failure_rate_delta=0.30000000000000004, false_accept_delta=-0.05"
        addressed_by: "Measures intent-preserving repair under independent metamorphic tests instead of repeating over-constrained DCCD repair."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      This is the .282 live repair claim-repair attempt. It may run only after the SOTA cache carry-forward and metamorphic oracle audit pass. The target is not just a positive delta: promotion requires clean false-accept, tautology, syntax/schema, and provenance evidence.

      MODEL_SPECS:
      - headline_models:
        - unsloth/Qwen3.6-35B-A3B-GGUF
        - unsloth/gemma-4-31B-it-GGUF
        - unsloth/gemma-4-26B-A4B-it-GGUF
      - smoke_only_models:
        - Qwen/Qwen3.5-0.8B
        - unsloth/gemma-4-E4B-it-GGUF
      - Use cached_sota_pair() or the current repo-local SOTA cache helper.
      - At least one headline model must produce live results for headline_result=true.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - scripts/experiment_2991_gated_sota_intent_preserving_repair_hard_set_v1.py
      - python/carnot/inference/sota_models.py
      - results/experiment_3001_sota_gguf_cache_carry_forward_checksum_refresh_v1.json
      - results/experiment_3002_metamorphic_repair_oracle_audit_v1.json
      - results/experiment_2991_gated_sota_intent_preserving_repair_hard_set_v1.json
      - datasets/repair_hard/manifest_v1.jsonl if present

      TASK:
      Rerun SOTA local GGUF repair on the hard set plus metamorphic variants, then compute pass@1/pass@k, syntax/schema failure, false-accept, and tautology deltas. If gates or preconditions fail, emit a terminal blocked artifact.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify exp3001.sota_headline_ready=true, exp3002.metamorphic_oracle_ready=true, CUDA/cache status, model checksum availability, and hard-set integrity.
      1. Add a focused exp3003 script following scripts/experiment_template.py.
      2. Load the original hard-set manifest and metamorphic manifest; run baseline validators before live LLM repair.
      3. Generate repair candidates with at least one mandated headline model; preserve prompt, draft intent, failing trace, final patch, duration, and transcript hash.
      4. Execute deterministic tests for original and metamorphic cases for every candidate.
      5. Compute deltas against baseline and exp2991 where comparable, keeping small-model smoke data separate.
      6. Set repair_rerun_clean=false if false accepts rise, tautology probes pass vacuously, schema/syntax failures rise, n_tasks is too small, or only smoke models ran.
      7. Write candidate patches, verifier logs, transcripts, and the JSON artifact.

      REQUIRED ARTIFACT FIELDS:
      - repair_rerun_clean: bool (principle: the repair row must be machine-gated)
      - headline_result: bool (principle: SOTA claim must be separate from smoke evidence)
      - preconditions_checked: bool (principle: compute-bound failures must distinguish setup from method failure)
      - n_tasks: int (principle: sample size must be explicit)
      - n_metamorphic_variants: int (principle: methodology amplification must be explicit)
      - model_specs: dict (principle: model identities must match mandated GGUFs)
      - headline_models_used: list (principle: SOTA evidence requires actual headline models)
      - model_checksums: dict (principle: live model identity must be durable)
      - pass_at_1_delta: float (principle: usefulness must be measured against baseline)
      - pass_at_k_delta: float (principle: multiple candidates must not hide pass@1 regression)
      - false_accept_delta: float (principle: verifier safety must not regress)
      - tautology_gate_clean: bool (principle: vacuous wins must not promote)
      - syntax_failure_rate_delta: float (principle: repair must not trade correctness for parse failures)
      - live_transcript_paths: list (principle: live inference claims require replayable output)
      - verifier_log_paths: list (principle: correctness claims require executable evidence)
      - honest_verdict: str (principle: terminal verdict must state clean, flagged, or blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3004-aquaforte-beaver-live-retry-provenance-v2
    milestone: "2026.05.282"
    deliverable: "results/experiment_3004_aquaforte_beaver_live_retry_provenance_v2.json"
    title: "AquaForte/BEAVER live retry provenance v2"
