         c. `find ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/ -name '*.gguf' 2>/dev/null | head -3`
            Record: gguf_files (list of str).
            If len(gguf_files)==0: write honest_verdict 'blocked_no_gguf_file_found' and exit.
         d. `.venv/bin/python -c "from llama_cpp import Llama; print('ok')" 2>/dev/null || echo missing`
            Record: llama_cpp_available (bool).
            If llama_cpp_available=false: write honest_verdict 'blocked_llama_cpp_not_installed' and exit.
