milestone: "2026.05.329"
milestone_title: "Verifier Cross-Domain Value — does the verifier ensemble catch errors SC/baselines miss, and does it generalize beyond math (code bugs + factual hallucinations)?"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md

# OUTER-LOOP / OPERATOR PRE-STAGED ROADMAP (2026-05-31, Claude Opus 4.8 on operator directive). PIVOT:
# the P0.1 energy-descent existential question is answered HONEST-NEGATIVE (Route-1/Route-2 bounded; SC /
# strong classical baselines are near-optimal on math/CSP, so energy SELECTION has no headroom). G2 is now
# CLOSED (FoVer headline reproduced on a clean CI runner, run 26725185125; paper_ready=true). The
# Depth-Over-Breadth forcing function is RETIRED. So this milestone stops re-grinding the answered question
# and asks the REAL product question (Carnot's north star = escape LLM hallucinations): the now-reproduced
# VERIFIER ENSEMBLE works on FoVer math step-errors (AUROC 0.9131). Does it (a) catch errors a STRONG
# baseline (model-confidence / best single verifier) MISSES — the "second pair of eyes" value, tested where
# it matters — and (b) GENERALIZE beyond math to code bugs (execution-verifiable ground truth) and factual
# hallucinations (the core motivation, noisier labels)? This has REAL headroom: SC is not a near-optimal
# baseline for "is THIS output wrong?" (verification) the way it is for "what's the answer?" (selection).
# Build on existing labeled data (HumanEval code verification exp1999; data/qa_dataset_1000.json) to avoid
# the blocked_cannot_construct trap. All tasks default agent_type: gemini (the claude->gemini coercion
# enforces it). Either outcome is genuine learning: generalizes -> broader paper; domain-bound -> a precise,
# honest limitation that scopes the verifier claim.

