      gate_field: brain_linear_ar_validation_ready
      expected_value: true
  prior_failures:
    - experiment_id: dt_brain_correlations_runnable_predicate_k4
      verdict: "complete: predicate_partial_3.21x_at_k4"
      addressed_by: "Initial k=4 run gave 3.21× AR advantage (PARTIAL
                     validation). Per DT-BRAIN-CORRELATIONS, gap is
                     exponential in k. Extending to k=8/12/15 to confirm
                     the rescue path holds at Phase 3's actual scale.
                     If Linear-AR insufficient at k=15, fall back to
                     MADE-with-hidden-layers."
  prompt: |
    Per Deep Think DT-BRAIN-CORRELATIONS (docs/research-notes/iclr26-
    deep-think-responses.md): BRAIN's factorized Bernoulli is
    mathematically inadequate for AND-composed verifier ensembles per
    Plefka/TAP closed-form bound. Linear AR rescue captures pairwise
    correlations at O(n²) parameter cost.

    Initial k=4 empirical run (2026-05-08): KL_factorized=1.075,
    KL_AR=0.335, ratio 3.21× (PARTIAL validation — gap exists but
    smaller than Deep Think's prediction at k=4).

    EXTEND the runnable script python/scripts/dt_brain_correlations_
    verification.py to k ∈ {4, 8, 12, 15}, n=16. Brute-force 2^16 =
    65,536 enumeration remains tractable. Optimize:
    (a) Factorized Bernoulli (n=16 params)
    (b) Linear AR (n + n(n-1)/2 = 136 params)
    (c) [If (b) insufficient at k=15] MADE with 1 hidden layer of 32 units

    For each k, report KL(q || π_β) for each parameterization.

    ACCEPTANCE GATE:
    - Factorized vs AR ratio at k=15: ≥ 10× (k=4 baseline of 3.21×
      should widen substantially)
    - Best parameterization KL at k=15: ≤ 0.1
    - If Linear-AR insufficient at k=15, MADE-with-hidden-layers must
      satisfy ≤ 0.1 KL gate

    FALSIFICATION: if AR/factorized ratio at k=15 is < 5×, the
    BRAIN+Linear-AR rescue is structurally weaker than predicted;
    Phase 3 may need to drop BRAIN entirely.

