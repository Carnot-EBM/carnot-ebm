           cached explore-induce-verify solver (exp4236) on the wrong-majority tasks to MINE more
           minority-correct candidates. HARD CAP candidates/task (e.g. <=K) and tasks (e.g. <=M) sized so the
           whole task finishes WELL INSIDE the 80-min conductor wall-clock cap; if the cap is reached before
           target, report the achieved counts HONESTLY (partial is fine -- A2 trains on what exists). Per the
