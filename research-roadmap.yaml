- id: exp930-math-iterative-self-repair-v1
  milestone: 2026.04.72
  deliverable: results/experiment_930_math_iterative_self_repair_v1.json
  max_turns: 50
  prior_failures:
    - experiment_id: exp919-math-iterative-self-repair
      verdict: blocked_gate_check_failed
      addressed_by: "Exp 919 was blocked only because the YAML task lacked prior_failures entries. There was no algorithm failure — the conductor rejected it at pre-gate. This version includes all required prior_failures entries. The approach (execute-feedback-retry on math questions) has never actually run."
      retire_if_same_verdict: false
    - experiment_id: exp905-iterative-self-repair-v1
      verdict: improvement_significant_gate_open
      addressed_by: "Exp 905 SUCCEEDED for HumanEval code: 4% baseline → 72% repair rate (+68pp) using Gemma4-E4B-it. That experiment tested CODE repair (execute Python, check test cases). This experiment extends to MATH repair (GSM8K): parse numeric answer, compare to ground truth. The mechanism is different — no code execution, instead arithmetic answer extraction and comparison."
      retire_if_same_verdict: false
    - experiment_id: exp759-iterative-code-repair-live
      verdict: code_repair_zero
      addressed_by: "Exp 759 failed because Qwen3.5-0.8B (0.8B params) was too small. This experiment uses Gemma4-E4B-it (>80% GSM8K baseline, GemmaTransformersLoader)."
      retire_if_same_verdict: true
    - experiment_id: exp744-iterative-2round-repair
      verdict: code_repair_blocked
      addressed_by: "Exp 744 was blocked because RETRO-028 (Gemma4 tokenizer bug) was open. RETRO-028 was closed by Exp 810 via nvidia-smi verification loop + GPU isolation. GemmaTransformersLoader is the fix."
      retire_if_same_verdict: false
  title: 'Exp 930: Math Iterative Self-Repair v1 — Execute-Feedback on 25 GSM8K Questions (GPU, CARNOT_FORCE_LIVE=1)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 905 proved IterativeSelfRepair works for HumanEval code: 4% baseline → 72%
    repair rate (+68pp) with Gemma4-E4B-it via GemmaTransformersLoader (live GPU inference).
    Exp 919 was blocked only by missing prior_failures fields in the .71 YAML — the algorithm
    never actually ran. This experiment extends the same execute-feedback-retry approach to
    GSM8K math. The key difference from code repair: instead of executing Python and checking
    test cases, we parse the numeric answer from the LLM's response and compare to ground truth.
    Carnot's Ising energy function ranks multiple repair attempts and selects the lowest-energy
    candidate.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_905_iterative_self_repair_v1.py — working code repair implementation
    - results/experiment_905_iterative_self_repair_v1.json — baseline 4%, repair 72%, +68pp
    - python/carnot/pipeline/gemma_loader.py — GemmaTransformersLoader (use this, not llama.cpp)
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
    - python/carnot/models/ising.py — IsingEBM energy scorer
    - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner

    TASK: Implement and run math iterative self-repair on 25 GSM8K questions. Measure:
    baseline_accuracy (Gemma4-E4B-it, 0 repair rounds) and repair_accuracy (3 repair rounds).

    CONCRETE STEPS:
    1. Read CLAUDE.md.
    2. Read Exp 905 script — understand the code repair structure to adapt for math.
    3. Write scripts/experiment_930_math_iterative_self_repair_v1.py:
       a. tmpl = ExperimentTemplate(930, "Math Iterative Self-Repair v1 — GSM8K",
              "results/experiment_930_math_iterative_self_repair_v1.json", requires_gpu=True)
          tmpl.setup()
       b. Load first 25 GSM8K problems from datasets library (gsm8k, 'main', split='test')
          or from a hardcoded list of 25 problems with known numeric answers.
       c. Load Gemma4-E4B-it via GemmaTransformersLoader (same as Exp 905):
          from python.carnot.pipeline.gemma_loader import GemmaTransformersLoader
          loader = GemmaTransformersLoader()
          model, tokenizer = loader.load()
       d. For each question:
          - Round 0: generate response, extract numeric answer using regex (first integer/float
            in the response that could be the answer, or answer after "=", "is", "are")
          - Check if baseline_answer == ground_truth_answer
          - If wrong: generate repair prompt: "Your previous answer was (prev_answer).
            The correct reasoning should lead to a different value. Please solve again carefully."
          - Repeat for up to 3 repair rounds
          - Use IsingEBM to score each response: energy = model.energy(tokenizer.encode(response))
          - Select the response with lowest energy as the final answer
          - Record: baseline_passed, repair_passed, n_retries, energy_score_best
       e. Compute: baseline_accuracy, repair_accuracy, signed_improvement
       f. Build artifact with ExperimentTemplate.build_result()
       g. honest_verdict: 'math_repair_significant' if signed_improvement > 0.1,
                          'math_repair_marginal' if 0 < signed_improvement <= 0.1,
                          'math_repair_zero' if signed_improvement == 0,
                          'math_repair_negative' if signed_improvement < 0
    4. Write tests in tests/python/test_experiment_930_math_repair.py (100% coverage required).
       Mock the GPU: patch GemmaTransformersLoader to return deterministic outputs.
       Test at minimum: (a) answer extraction regex, (b) repair loop termination,
       (c) energy scorer call, (d) honest_verdict assignment.
    5. Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_930_math_iterative_self_repair_v1.py
    6. Update openspec/capabilities/verify/spec.md with new REQ-VER-* and SCENARIO-VER-*
       (at minimum: REQ-VER for math repair, SCENARIO-VER for GSM8K execute-feedback loop).
    7. Update ops/changelog.md.
    8. Verify results/experiment_930_math_iterative_self_repair_v1.json exists and contains
       inference_mode='live_gpu', signed_improvement field.

    Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_930_math_iterative_self_repair_v1.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp931-combined-math-estimation-pipeline
  milestone: 2026.04.72
  deliverable: results/experiment_931_combined_math_estimation_pipeline.json
  max_turns: 30
  gated_on:
    - upstream: exp930-math-iterative-self-repair-v1
      artifact_field: signed_improvement
      op: '>'
      value: 0.0
  prior_failures:
    - experiment_id: exp920-combined-estimation-math-repair
      verdict: blocked_gate_check_failed
      addressed_by: "Exp 920 was blocked only because the YAML task lacked prior_failures entries, and its upstream gate (Exp 919) was itself blocked. This version includes all required prior_failures and is gated on Exp 930 (the corrected math repair experiment)."
      retire_if_same_verdict: false
  title: 'Exp 931: Combined Math+Estimation Pipeline — Wire EstimationVerifier with Math Repair (CPU, GATED on Exp 930 signed_improvement > 0)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 906 proved EstimationVerifier achieves SVAMP AUC=0.90. Exp 930 tests math
    iterative self-repair on GSM8K. This experiment combines both: use EstimationVerifier as a
    pre-filter (detect likely-wrong answers before running full repair), then apply iterative
    repair only when EstimationVerifier flags a high-energy response. This should reduce the
    number of repair calls on already-correct answers (efficiency gain).

    GATE: This experiment is GATED on Exp 930 signed_improvement > 0. If Exp 930 found no
    improvement, this experiment should output honest_verdict='gated_upstream_no_improvement'.

    EXISTING CODE TO READ FIRST:
    - results/experiment_930_math_iterative_self_repair_v1.json — upstream gate result
    - results/experiment_906_estimation_verifier_svamp.json — EstimationVerifier AUC=0.90
    - python/carnot/pipeline/estimation_verifier.py — EstimationVerifier class
    - scripts/experiment_930_math_iterative_self_repair_v1.py — math repair implementation

    TASK: Combine EstimationVerifier + math repair. Measure combined_accuracy vs baseline.

    CONCRETE STEPS:
    1. Read CLAUDE.md.
    2. Check results/experiment_930_math_iterative_self_repair_v1.json:
       - If signed_improvement <= 0: write artifact with honest_verdict='gated_upstream_no_improvement'
         and exit. Do NOT run this experiment.
    3. Write scripts/experiment_931_combined_math_estimation_pipeline.py (CPU, no live GPU):
       a. Load 25 GSM8K questions (same as Exp 930).
       b. Use EstimationVerifier to score each baseline response (CPU inference on Qwen3.5-0.8B).
       c. Apply repair only to responses where EstimationVerifier energy > threshold.
       d. Measure: combined_accuracy, repair_calls_made, repair_calls_saved.
       e. Compare to Exp 930 results: combined_accuracy vs repair_accuracy from Exp 930.
    4. honest_verdict: 'combined_improves_efficiency' if repair_calls_saved > 0 and
                         combined_accuracy >= repair_accuracy_from_930;
                       'combined_viable' if combined_accuracy > baseline;
                       'combined_no_improvement' otherwise.
    5. Write tests (100% coverage). Mock EstimationVerifier for CPU-only tests.
    6. Update ops/changelog.md.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_931_combined_math_estimation_pipeline.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

