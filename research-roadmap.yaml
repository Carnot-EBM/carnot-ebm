- id: exp1034-gskan-v4
  milestone: 2026.04.80
  deliverable: results/experiment_1034_gskan_v4.json
  title: "GS-KAN Energy Tier v4 — QuantKAN INT8 Quantization + FPGA Budget Confirmation"
  prompt: |
    CONTEXT:
    GS-KAN (Group-Shared KAN, arXiv 2512.09084) reduces LUT count for KV260 from ~82K
    (standard KAEMEnergy) to ~8K estimated (G=4 shared basis). Exp 1009 (.78, never ran —
    pre-test comparison failure blocked it). Exp 1019 (.79, blocked — gate exp1013 not found).
    This experiment is STANDALONE — no gate on preflight. Adding QuantKAN INT8 quantization
    (arXiv 2511.18689) to further reduce DSP48 usage for KV260.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/gskan.py or equivalent (GS-KAN implementation — may not exist yet)
    - python/carnot/models/kaem_energy.py (KAEMEnergy baseline — GS-KAN extends this)
    - research-references.md: QuantKAN section (2026-04-28 arxiv scan) for INT8 recipe
    - research-references.md: GS-KAN section (arXiv 2512.09084) for architecture details
    - python/carnot/data/fover_corpus.py (57-pair corpus — use as training/test data)
    - results/experiment_1029_fover_expansion_v2.json (if Exp 1029 ran first, use expanded corpus)

    TASK:
    1. IMPLEMENT GS-KAN (if not already implemented):
       - G=4 groups, each group shares a parent B-spline basis
       - Group-wise linear projection from shared basis to group-specific output
       - Should be compatible with KAEMEnergy.fit() interface
    2. TRAIN: Train GS-KAN on FoVer corpus (expanded if available, else 57-pair).
       Compare training time and convergence vs standard KAEMEnergy (KAN with G=1).
    3. EVALUATE: Compute AUROC on test split. Target: AUROC >= 0.70 (within 0.02 of
       KAEMEnergy baseline — GS-KAN trades slight accuracy for hardware efficiency).
    4. QuantKAN INT8 QUANTIZATION:
       Apply post-training quantization per arXiv 2511.18689:
       - Per-knot scale factors: for each B-spline knot, compute optimal scale = max(abs(weights))/127
       - Round weights to INT8: quantized_w = round(w / scale) clipped to [-127, 127]
       - Reconstruct: w_reconstructed = quantized_w * scale
       - Measure AUROC degradation vs FP32 GS-KAN. Target: degradation < 0.02.
    5. FPGA RESOURCE ESTIMATION:
       Count model parameters at INT8 precision.
       Estimate LUT count: 1 INT8 multiply ≈ 3 LUTs on Xilinx (vs 10 LUTs for FP32).
       Estimate BRAM: INT8 weight storage ≈ 1/4 of FP32.
       Estimate DSP48: INT8 arithmetic uses DSP48 efficiently (target: < 200 DSP48s).
       Compare to prior GS-KAN FP32 estimate (Exp 1019's analysis if available).
    6. HARDWARE COMPLEXITY METRICS (arXiv 2604.03345):
       RM (Resource Multiplier) = LUT_gskan_int8 / LUT_kaem_baseline
       BOP (Bit Operations per inference) = 8 * num_multiplications (INT8)
       NABS (Normalized Area-Budget Score) = RM * (1 - AUROC_delta) (lower is better)

    ARTIFACT FIELDS:
    - auroc_gskan_fp32: float
    - auroc_gskan_int8: float
    - auroc_kaem_baseline: float
    - int8_quantized: bool
    - fpga_lut_estimate_fp32: int
    - fpga_lut_estimate_int8: int
    - fpga_dsp48_estimate: int
    - fpga_bram_estimate: int
    - rm_metric: float
    - bop_metric: int
    - nabs_metric: float
    - honest_verdict: "gskan_quantized_budget_confirmed" | "gskan_quantized_auroc_regression" | "gskan_budget_exceeded" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1034_gskan_v4.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

