- id: exp1124-wopr-hashi-cartridge
  milestone: 2026.04.87
  deliverable: results/experiment_1124_wopr_hashi_cartridge.json
  title: "WOPR Hashi Puzzle Cartridge — Bridge Counting + Ising Ground-State (codex)"
  agent_type: codex
  max_turns: 30
  estimated_wall_time_min: 25
  priority: low
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1070-wopr-gtw-cartridge-v2
      verdict: ok
      addressed_by: "SCOPE CLARIFICATION: exp1070 was the Global Thermonuclear War cartridge (GTW).
        exp1124 is a Hashi (Hashiwokakero) puzzle cartridge — a completely different game type.
        GTW uses Ising to solve a game-theory problem; Hashi uses Ising to satisfy bridge counting
        + planarity constraints on a grid graph. Different constraint encoding, different Gradio UI,
        different cultural reference. No failure inheritance; this is a novel cartridge."
      retire_if_same_verdict: false
    - experiment_id: exp1071-wopr-lights-out-cartridge-v2
      verdict: ok
      addressed_by: "SCOPE CLARIFICATION: exp1071 was the Lights Out cartridge. exp1124 is Hashi.
        Different game. No failure inheritance."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    The WOPR gallery (HuggingFace Spaces) currently has: Sudoku (E=0), Global Thermonuclear War
    (GTW, Ising game tree), Lights Out (Ising ground-state), N-Queens (Ising E=0).
    Add a Hashi (Hashiwokakero / Bridges) puzzle cartridge.

    Hashi puzzle rules:
    - Grid of islands (circles with numbers 1-8)
    - Connect islands with horizontal or vertical bridges
    - Each island must have exactly its number of bridges connected
    - No bridge may cross another bridge
    - All islands must be connected (single connected component)

    Ising encoding of Hashi:
    - Binary variables: one spin per possible bridge position (H/V edge between adjacent islands)
    - Spin +1 = bridge present, spin -1 = bridge absent
    - Constraint per island i: sum(bridges connected to i) = island_number[i]
      Penalty: (sum_j B_{ij} - n_i)^2 where B_{ij} ∈ {0,1} is bridge presence
    - No-crossing constraint: two orthogonal edges sharing a grid cell cannot both be bridges
      Penalty: B_{h} * B_{v} for each crossing pair
    - Connectivity: enforce via soft penalty (optional for v1; hard for v2)

    IMPLEMENTATION PATTERN: follow the WOPR cartridge pattern from existing cartridges.
    - Read: app/wopr_gallery/cartridges/nqueens.py (N-Queens Ising encoding reference)
    - Read: app/wopr_gallery/app.py (Gradio UI integration pattern)

    CARTRIDGE REQUIREMENTS:
    1. HashiCartridge class: solve(puzzle) → (solution, final_energy, n_iterations)
    2. A canonical 5×5 Hashi puzzle (included as a test case) with known solution
    3. Ising ground state E=0 at convergence (no violated constraints)
    4. Gradio UI: display grid with islands + bridges using ASCII art or matplotlib
    5. CRT aesthetic (green on black, WarGames theme) — match other cartridges
    6. Tests: test_hashi_e0_convergence (E=0 on canonical puzzle)

    CONCRETE STEPS:
    - ls app/wopr_gallery/cartridges/
    - cat app/wopr_gallery/cartridges/nqueens.py (read full implementation)
    - cat app/wopr_gallery/app.py (read cartridge registration pattern)
    - (implement HashiCartridge with Ising encoding)
    - (implement Gradio UI component)
    - (register in app.py)
    - JAX_PLATFORMS=cpu pytest tests/ -k "hashi" -v
    - Write results/experiment_1124_wopr_hashi_cartridge.json

    REQUIRED ARTIFACT FIELDS:
    - cartridge_file: str ("app/wopr_gallery/cartridges/hashi.py")
    - canonical_puzzle_e_at_convergence: float (target: 0.0)
    - n_iterations_to_convergence: int
    - hashi_cartridge_shipped: bool (True if E=0 achieved on canonical puzzle)
    - tests_passing: int
    - honest_verdict: "e0_achieved" | "e_positive_still_solving" | "partial" | "failed"

