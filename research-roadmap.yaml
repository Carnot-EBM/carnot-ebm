    title: "r11l FULL solve: take r11l from 1/6 (exp3946) to as many of levels 2-6 as the induced select/place mechanic + perception reach, offline, real-env-confirmed. exp3946 induced: a click selects a piece, a 2nd click places it so the pieces' average position aligns on the target centroid; placing exactly on top re-selects. Reuse that mechanic + perception (pieces=color-3 sprites, targets=flkdtg) and drive level-by-level to ACCURACY_levels_solved as high as possible. Report per-level actions vs baseline_actions (the RHAE efficiency axis). RHAE weights LATER levels more, so each additional level is worth more than the first."
    priority: critical
    track: research
    max_turns: 80
    agent_type: claude
    model: opus
    requires_claude: true
    inference_substrate: offline_arc_agi3_perception_planner_real_env_confirmed
    deliverable: results/experiment_3953_r11l_full_solve.json
    prompt: |
      CONTEXT. exp3946 achieved Carnot's FIRST ARC-AGI-3 solve: r11l level-1 (1/6 levels), real-env
      confirmed, 4 actions. RHAE scores nothing on an unsolved level and weights LATER levels more, so
      converting 1/6 into 4/6 or 6/6 is the highest-value accuracy move available. r11l is non-spatial,
      hidden_state=false, directly-observable per-sprite goal — the levels differ in piece/target count
      and layout, not in mechanic. This task drives r11l to as many levels as the induced mechanic reaches.

      EXISTING CODE/EVIDENCE TO READ FIRST:
        - results/experiment_3946_r11l_first_solve.json (the induced mechanic + solve_log + perception)
        - scripts/experiments/experiment_3946_r11l_first_solve.py (the solver — _perceive/_match/_place)
        - results/arc3_r11l_solve.json (the perception diagnosis: pieces=color-3, targets=flkdtg, gray=decorative)
        - python/carnot/agentic/arc_agi3_world_model.py (GameGraph, objects, compute_grid_delta, frame_hash)

      CONCRETE STEPS:
        0. PRECONDITIONS: offline env loads — `{project_root}/.venv/bin/python -c "import sys;
           sys.path.insert(0,'python'); from arc_agi import Arcade; from arc_agi.base import OperationMode;
           Arcade(arc_api_key='', operation_mode=OperationMode.OFFLINE, environments_dir='environment_files')"`
           succeeds. If not, honest_verdict blocked_arc_offline_env_unavailable and EXIT (no fabrication).
        1. Reuse the exp3946 perception (color-3 pieces, flkdtg targets) + select/place mechanic. After a
           level-up, RE-PERCEIVE the new level's pieces+targets (counts/layout change per level).
        2. For each level 1..6: match each piece to its target by shape/size, execute the induced
           select->place click-pairs in the REAL env, confirm the level-up via levels_completed.
        3. On a non-winning match, search piece->target assignments with env feedback (reset on lose),
           within the per-game action budget. Continue until a level fails to solve or all 6 are solved.
        4. Record per-level actions used and the baseline_actions reference for each solved level.

      REQUIRED ARTIFACT FIELDS (BARE scalars; principle: lines guide YOU):
        ACCURACY_levels_solved: principle "The headline — how many of r11l's 6 levels solved (>=1 from exp3946; goal is to raise it), real-env-confirmed."
        per_level_actions: principle "Actions used per solved level — paired with baseline_actions it gives the RHAE efficiency per level."
