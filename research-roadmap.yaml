          principle: "Terminal-prefix required."
      - mch_filter_validated:
          principle: "True if MCHFSTFilter ran on real cached telemetry."
      - mean_acceptance_rate:
          principle: "MH acceptance rate. Core effectiveness metric."
      - mch_violation_reduction:
          principle: "Fractional reduction in NSVIF violations."
      - mean_energy_reduction_ratio:
