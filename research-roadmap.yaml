    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Synthesize ising_sampler_v2.v with N_SPINS=32, MAX_DEGREE=8 for iCE40 HX8K via
    Yosys + nextpnr-ice40. Target: pnr_success_ice40=True AND bitstream_generated=True.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-HW-043 (N=32 iCE40 synthesis MUST use Yosys synth_ice40 + nextpnr-ice40;
       MUST override N_SPINS=32 and MAX_DEGREE=8 as synthesis parameters; MUST report
       LUT utilization after synth and PNR timing result),
       SCENARIO-HW-043 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Read results/experiment_776_kv260_nextpnr_synthesis.json. If not found: proceed with N=32 design.
    4. Check tools available:
       a. `which nextpnr-ice40` — check if iCE40 P&R available.
       b. `python -c "import yowasp_nextpnr_ice40"` — check Python wrapper.
       c. `which yosys` — check Yosys.
       d. `which icepack` — check bitstream packer.
       Record: tools_available (dict).
    5. Read hardware/kv260/ising_sampler_v2.v. Verify it supports parametric N_SPINS.
