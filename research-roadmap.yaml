      addressed_by: "This task adds a deterministic SAT/CNF benchmark with PySAT authority so CDG-style repair can be evaluated against objective logical labels."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Carnot's PRD requires verifiable reasoning, and .117's CDG repair improved
    root-cause ordering without adding a new objective logical benchmark.
    SATQuest suggests generating CNF reasoning tasks with deterministic PySAT
    labels across machine, symbolic, and narrative formats. Use {project_root}
    as the project root and {date} as the run date.

    MODEL_SPECS:
