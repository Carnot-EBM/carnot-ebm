    The root cause: consistency regularization penalizes energy variance across
    paraphrased positives, while hinge loss drives energy variance toward the
    margin — they work against each other. This task runs EBM-CoT v2 with
    hinge loss ONLY (consistency_regularization_weight=0.0) to confirm the
    +0.185 AUROC delta is real and not an artifact of the two-term interaction.
