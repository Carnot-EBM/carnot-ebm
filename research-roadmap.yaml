#   G3: RESUME the MoE checkpoint (14 tasks) toward accumulated N>=30; CI vs 0.2581 -> latent/absent;
#      NO premature retire on a throughput-truncated window (exp4058 build + exp4059 collect).
#   EFFICIENCY (the G2 pivot): the GAP-4 verifier as an ONLINE ACTION-PRUNER on solved games --
#      actions + wall-clock at equal solve-rate (exp4061; the north-star "efficient" axis).
#   KEEP the proven tracks: 9th-game first-solve (monotonic +1), ArcMemo v8 richer cross-game library,
#      GateMate/PolarFire toward terminal (KV260 done). Capstone: did the verifier transfer
#      SIGNIFICANTLY off-ARC on an un-saturated corpus, and is the sovereign base latent or absent?
#
