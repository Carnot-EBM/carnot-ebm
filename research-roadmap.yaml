    - codex --help 2>&1 | head -10  (or equivalent, to understand Codex CLI interface)
    - (validate Codex launches without error)
    - grep -n "subprocess.run\|claude -p\|_build_agent\|dispatch" scripts/research_conductor.py | head -20
