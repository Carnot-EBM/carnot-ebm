  max_turns: 100
  estimated_wall_time_min: 25
  per_unit_rows: true
  milestone: 2026.10.702
  deliverable: results/experiment_8110_v702_contract_custody.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prior_failures:
  - experiment_id: exp8083-contract-custody
    verdict: complete_disqualified_research-roadmap-vNEXT_md
    addressed_by: Complete table, full JSON and digest are emitted together; use the qualified parameterized
      V685/V701 authority reader.
    retire_if_same_verdict: true
  - experiment_id: exp7992-contract-methods
    verdict: complete_blocked_authority
    addressed_by: The immutable authority lifecycle already qualified in Exp8097; test activation snapshots
      instead of requiring a vanished staging pathname.
    retire_if_same_verdict: true
  agent_type: claude
  model: opus
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V701 scheduled thirteen tasks; nine produced primaries and four were gate-skipped. Its qualified transport and native fixtures do not establish decision or learning benefit.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py; python/carnot/reporting/primary_publication.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/v685_authority_lifecycle.py; python/carnot/reporting/roadmap_contract.py; scripts/experiments/experiment_8097_v701_contract_custody.py; results/experiment_8109_v701_capstone.json; openspec/change-proposals/research-roadmap-v701-preserved-20261004.md; tests/python/test_experiment_7891_v685_authority_lifecycle.py
    TASK:
    Bind thirteen tasks and preserve V701 execution evidence. Deliver results/experiment_8110_v702_contract_custody.json, primitive evidence under results/raw/experiment_8110_v702_contract_custody/ and runnable scripts/experiments/experiment_8110_v702_contract_custody.py.
    CONCRETE STEPS:
    1. Emit a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess. Set PYTHONUNBUFFERED=1 and use print(..., flush=True). Emit real completed/pending counts inside long loops and child-process waits at least every 60 seconds; keep every silence gap below 600 seconds. Bound tool calls and poll children in at most 60-second intervals. Write any file over about 200 lines in several tool calls of at most about 150 lines, with a progress message between calls. Do not pad runtime or invent progress.
    2. Check exact input paths, hashes, terminal sidecars and executable/test paths with bounded calls. In particular, use tests/python/test_primary_publication_7928.py, not the absent test_primary_publication.py. Missing external evidence is terminal complete_blocked_<check>, verdict_class=blocked, with the actual failed operand in gate_check_summary. Preserve failed historical artifacts.
    3. Add or extend the applicable REQ-* and SCENARIO-* specifications before implementation; write failing tests first. Reuse qualified modules and a thin experiment CLI. All fixture/test outputs belong in private temporary directories outside results/. Preserve original assertions and historical primaries. Resolve imports for script-path execution outside the checkout.
    4. Run with no current LLM load or call: inference_substrate_class=no_model_load and MODEL_SPECS=[]. Use aggregation_from_upstream_artifacts for replay or verifier_ensemble_against_cached_candidates for actual CPU evaluation, as executed. Historical Qwen receipts remain historical; small head training uses trained_head_specs and cannot become a current Qwen invocation.
    5. Use the parameterized authority reader with milestone 2026.10.702, first_id=8110 and count=13. Bind the visible table, complete executable JSON, canonical full-task digest and immutable staged/activated snapshots. Activation may remove the staged pathname; validate its saved bytes. Preserve all thirteen V701 task dispositions, including conductor skip records and the alternate Exp8100 gate-block pathname.
    6. Authenticate Exp8098 roles, Exp8102 stream features, Exp8085 numerical kernel and Exp8105 native binding separately. Export independent historical readiness fields. Do not join the disqualified Exp8099 into qualified data. Validate actual current code and terminal sidecars; a circular_positive fixture may qualify as a kernel, never a natural-data benefit.
    7. Run the twelve E2E-018 authority mutations in private files, including missing staged file after activation and full-prompt drift. Reuse the shipped reader and commands, not a copied orchestration framework. No science task needs a global positive V701 capstone.
    8. Freeze validation argv before measurement. Run scoped unit/consumer tests, Ruff check and format, strict mypy, 100% changed-code statement coverage and scoped spec coverage. Run the named applicable E2E private CLI success, blocked, mutation and cold-replay routes. Capture argv, normal exit, log hash and duration. If Rust changes, also run cargo test, fmt, clippy and the actual loaded binding. Record existing global health failures separately; do not make an unrelated full-suite rerun a prerequisite for science.
    9. Save primitive rows, input/code/config hashes, raw transcripts and phase timings; independently recompute all reductions. Run scripts/adversarial_verify.py and strict scripts/verdict_row_consistency_lint.py. Publish through primary_publication only after normal exit and passing owned validation; owned failures set readiness=0 and verdict_class=disqualified. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md without deleting history. External unchanged blocks are blocked, not partial.
    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: terminal complete_* string; principle: completed null science is terminal.
    - verdict_class: positive | circular_positive | null | blocked | disqualified | partial; principle: partial is only unfinished owned work; external blocks do not merit retries.
    - verifier_is_oracle, claim_scope, exposure_scope; principle: an oracle fixture must be circular_positive, never positive.
    - independent_generalization_score: 0; generalized_learning_benefit_score: 0; principle: exposed development cannot close independent generalization gaps.
    - required_checks_passed, flagged_adversarial, validation_receipts, terminal_validation_sidecar_path; principle: valid measurements require current owned checks.
    - gate_check_summary: list of check/upstream/path/hash/artifact_field/op/expected/observed/passed; principle: blocked verdicts identify the failed check and actual value.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, call_ledger, trained_head_specs; principle: current execution is separate from historical model provenance.
    - rows: unit_id/source_cluster_id/arm/condition/metric/numerator/denominator/status/exclusion_reason; principle: every comparative headline reduces from individual units.
    - intended_count, eligible_count, independent_count, completed_count, excluded_count, censored_count, failed_count, sample_size_budget; principle: seeds and repeated calls do not create independent sources.
    - run_date, duration_s, random_seed, reproducibility_checksum, source_artifact_hashes, raw_shard_hashes, code_config_hashes, phase_spans; principle: each claim binds real work to exact bytes.
    - acceptance_gates, field_principles; principle: each extra field and threshold explains which false inference it prevents.
    - contract_ready_score, historical_stream_ready_score, historical_kernel_ready_score: 0|1; principle: independent inputs must not share an unrelated failure gate.
    - canonical_tasks_sha256, authority_snapshots, historical_dispositions, scope_reduction_compliance; principle: all thirteen scheduled tasks must remain visible.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_8110_v702_contract_custody.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
