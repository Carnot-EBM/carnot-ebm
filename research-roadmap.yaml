    # Frustrated triangle J: antiferromagnetic triangles cause non-trivial ground states
    J_frustrated = np.zeros((n, n))
    for i in range(n): J_frustrated[i, (i+1)%n] = -1.0  # antiferro ring

    # Sequential Gibbs sampler (sequential single-site updates = detailed balance)
    def gibbs_single_site(J, beta=2.0, n_samples=5000, burnin=500):
        s = np.random.choice([-1, 1], size=len(J))
        samples = []
        for t in range(n_samples + burnin):
            i = t % len(J)  # sequential sweep
            h_i = np.dot(J[i], s)
            prob_plus = 1 / (1 + np.exp(-2 * beta * h_i))
            s[i] = 1 if np.random.rand() < prob_plus else -1
            if t >= burnin: samples.append(s.copy())
        return np.array(samples)

    gibbs_samples = gibbs_single_site(J_frustrated, n_samples=5000)

