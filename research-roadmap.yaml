- id: exp2519-phase4-arm-ebm-v3-no-fallback
  title: 'Phase 1: Phase 4 ARM-EBM Step-Level v3 -- IsingVerifier NO FALLBACK (retire_if_methodology_fallback)'
  milestone: 2026.05.243
  deliverable: results/experiment_2519_phase4_arm_ebm_v3.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  prior_failures:
  - experiment_id: exp2508-phase4-step-level-arm-ebm-v2
    verdict: 'complete: success (literal gate), step_granularity_achieved=False (methodology
      fallback to semantic_energy_fallback)'
    addressed_by: "exp2508 fell back to SemanticEnergy at response-level (same class as
      the failed exp2486) because IsingVerifier step-level energy was not checked at PRECONDITION
      time. This task adds an explicit PRECONDITION check for IsingVerifier.energy() importability
      BEFORE any computation, and REFUSES to fall back to SemanticEnergy. If IsingVerifier
      is not available, emit blocked_ising_verifier_not_available and exit. No fallback
      path exists. The key distinction: exp2508 allowed fallback; this task forbids it."
    retire_if_same_verdict: true
  - experiment_id: exp2486-phase4-arm-ebm-bijection
    verdict: 'complete: pearson_r=0.108, phase4_validated=False (SemanticEnergy embedding
      proxy, not raw logprobs)'
    addressed_by: "exp2486 used SemanticEnergy EMBEDDINGS as E_ising proxy. This task
      uses IsingVerifier.energy(step_text) directly on each CoT step text — a fundamentally
      different energy proxy. The ARM-EBM formula E_step=-sum(log_p(token_i)) computes
      ARM-EBM energy from raw token logprobs; IsingVerifier.energy(step_text) computes
      Carnot constraint energy from the step text. Correlation between these two energies
      is the Phase 4 bijection test."
    retire_if_same_verdict: false
  prompt: "CONTEXT: arXiv operator hold requires Gate 3 (phase4_validated_any) to be unambiguous.
    exp2508 passed the literal gate (pearson_r=-0.4266, n=290, phase4_validated_step_level=True)
    but the capstone flagged a critical corrigendum: step_granularity_achieved=False and
    energy_proxy_used='semantic_energy_fallback' — the experiment fell back to response-level
    SemanticEnergy proxy (the same class as the failed exp2486, pearsonr=0.108). The structural
    ARM-EBM test was NOT performed.\n\nTHEORETICAL GROUNDING:\nARM-EBM bijection (arXiv:2512.15605):
    E_LLM(x) = -log p_LLM(x) = -sum_i log p(x_i | x_{{<i}})\nFREIA (arXiv:2605.04065):
    step-level free energy E_t = -log p(action_t | state_t)\nCarnot IsingVerifier.energy(text)
    computes constraint-violation energy from text structure.\nIf Phase 4 hypothesis holds:
    high Carnot energy steps should have high ARM-EBM energy (more uncertain, more likely
    to violate constraints).\n\nCRITICAL DIFFERENCE FROM exp2508: This task REFUSES to
    fall back to SemanticEnergy. If IsingVerifier.energy() is not importable, emit blocked_ising_verifier_not_available
    and exit. The structural test requires IsingVerifier, not SemanticEnergy.\n\nEXISTING
    CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py (IsingVerifier.energy()
    method — verify it takes a text string argument)\n  {project_root}/results/ (find
    any files named *telemetry* or *manifest* from .241 or .242 that contain token_logprob
    fields)\n  {project_root}/scripts/experiment_template.py (ExperimentTemplate boilerplate)\n\nTASK:
    Test Phase 4 ARM-EBM bijection at step-level granularity using IsingVerifier NO FALLBACK.\n\nCONCRETE
    STEPS:\n  0. PRECONDITIONS (check ALL — any failure exits with blocked_* verdict, NO
    FALLBACK):\n     a. Verify IsingVerifier.energy() is importable AND callable on text:\n
    \       python3 -c \"from carnot.verify.semantic_energy import IsingVerifier; v=IsingVerifier(n_spins=4);
    print(v.energy('test text ok'))\"\n        If import fails OR energy() raises: write
    honest_verdict blocked_ising_verifier_not_available and exit.\n        DO NOT substitute
    SemanticEnergy or any other class. IsingVerifier is required.\n     b. Find telemetry
    manifest with token_logprob fields:\n        ls {project_root}/results/*telemetry*
    2>/dev/null || ls {project_root}/results/*manifest* 2>/dev/null\n        Must contain
    token_logprob fields (not just text). Check with:\n        python3 -c \"import json,
    glob; files=glob.glob('results/*telemetry*.json')+glob.glob('results/*manifest*.json');
    [print(f, list(json.load(open(f)).keys())[:10]) for f in files[:3]]\"\n        If
    no files with token_logprob: write honest_verdict blocked_no_token_logprob_manifest
    and exit.\n     c. Count step pairs: n_step_pairs >= 100 required.\n        If n_step_pairs
    < 100: write honest_verdict blocked_insufficient_step_pairs_n={{n}} and exit.\n  1.
    Load telemetry manifest. Extract per-CoT-step token logprob sequences.\n  2. For each
    CoT step:\n     E_arm_step = -sum(token_logprobs_for_step)  # ARM-EBM formula, raw
    logprobs\n     E_ising_step = IsingVerifier(n_spins=4).energy(step_text)  # Carnot
    constraint energy\n  3. Verify step_granularity_achieved: True if IsingVerifier.energy()
    was called per-step (not response-level).\n  4. Compute pearson_r(E_arm_step_list,
    E_ising_step_list) across all step pairs.\n  5. Compute p_value (scipy.stats.pearsonr).\n
    \ 6. Set phase4_validated_step_level = (abs(pearson_r) > 0.30 AND p_value < 0.05
    AND n_step_pairs >= 100 AND step_granularity_achieved == True).\n     NOTE: step_granularity_achieved=True
    is a REQUIRED condition — a positive correlation using a fallback proxy does NOT validate
    Phase 4.\n\nNEGATIVE RESULT PROTOCOL:\n  If gate fails (|pearsonr| <= 0.30 OR p >=
    0.05 OR step_granularity_achieved=False):\n  - Set honest_verdict = 'complete: phase4_step_level_arm_ebm_v3_below_threshold'\n
    \ - This triggers retire_if_same_verdict=true for the exp2508 prior_failure entry\n
    \ - The arXiv proceed-without-phase4 path (revise §4 as negative) is then triggered\n\nREQUIRED
    ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required
    (complete:/success:/passed:/shipped:).\"\n  - n_step_pairs:\n      principle: \"Sample
    size for pearson_r claim — must be >= 100 for statistical credibility.\"\n  - pearson_r:\n
    \     principle: \"Core Phase 4 bijection test value. |r| > 0.30 with p < 0.05 and
    step_granularity_achieved=True is the threshold.\"\n  - p_value:\n      principle:
    \"Statistical significance — required alongside correlation to prevent noise-floor
    acceptance.\"\n  - step_granularity_achieved:\n      principle: \"Must be True (IsingVerifier
    called per-CoT-step on step text). False = structural test not performed = methodology
    fallback = retire signal fires.\"\n  - phase4_validated_step_level:\n      principle:
    \"True only if |pearsonr| > 0.30 AND p < 0.05 AND n >= 100 AND step_granularity_achieved=True.
    The four conditions together are the Gate 3 clean flip.\"\n  - energy_proxy_used:\n
    \     principle: \"Must be 'ising_verifier_direct' — any other value indicates methodology
    fallback and should cause retire_if_same_verdict to fire.\"\n  - preconditions_checked:\n
    \     principle: \"Records which resources were verified before launching.\"\n  - duration_s:\n
    \     principle: \"Real compute takes wall-clock time. IsingVerifier on 290 step pairs
    takes > 5.0s minimum.\"\n  - random_seed:\n      principle: \"Reproducibility — set
    to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"phase4_validated_step_level == true
    AND step_granularity_achieved == true\"\n    principle: \"Both conditions required:
    step-level granularity (IsingVerifier called per-step) AND positive correlation (|r|
    > 0.30, p < 0.05, n >= 100). A correlation computed via response-level fallback does
    NOT pass.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2520-tier0r-implementation
  title: 'Phase 2a: Tier 0r Curry-Howard Verifier Implementation (write the code that
    exp2504 only tested)'
  milestone: 2026.05.243
  deliverable: results/experiment_2520_tier0r_implementation.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  prior_failures:
  - experiment_id: exp2510-tier0r-integration-ensemble-v7
    verdict: 'blocked_tier0r_not_implemented'
    addressed_by: "exp2510 failed because the Tier0rVerifier class file did not exist.
      exp2504 tested the viability of Curry-Howard proof-path verification (AUROC=0.9123)
      but did not persist the implementation as an importable Python module. This task
      WRITES the Tier0rVerifier class in python/carnot/verify/tier0r_curry_howard.py following
      the BaseVerifier interface pattern from existing verifiers. The implementation creates
      what exp2510 could not find."
    retire_if_same_verdict: false
  prompt: "CONTEXT: Tier 0r (Curry-Howard soft-typed proof-path verification, arXiv:2510.01069
    ICLR 2026) was validated viable in exp2504 with AUROC=0.9123. However exp2504 tested
    the concept without writing a persistent importable Python class. When exp2510 tried\n
    \ from carnot.verify.tier0r_curry_howard import Tier0rVerifier\nthe file did not exist
    — blocking ensemble v7 integration and the adaptive conformal chain.\n\nThis task
    creates the implementation that the chain needs.\n\nTHEORY (arXiv:2510.01069):\nCurry-Howard
    correspondence: propositions = types, proofs = programs. For LLM reasoning chains:\n-
    Map each reasoning step to a typed term (e.g., 'A implies B, A, therefore B' = modus
    ponens type)\n- Check type signatures are consistent across steps (type A output feeds
    type A input)\n- Type violations (wrong argument type, conclusion type mismatch) = logical
    non-sequiturs\n- Score = soft penalty weighted by violation degree (NOT hard binary
    flag)\nSoft Curry-Howard produces a continuous nonconformity score compatible with
    Fisher conformal ensemble.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py
    (BaseVerifier interface — follow this pattern)\n  {project_root}/python/carnot/verify/
    (all existing verifier files — understand the interface)\n  {project_root}/results/experiment_2504*.json
    (Tier 0r viability test from .241 — what methodology was used?)\n  {project_root}/scripts/experiment_template.py
    (ExperimentTemplate boilerplate)\n\nTASK: Implement Tier0rVerifier class. Evaluate
    AUROC on available corpus. Confirm importability.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n
    \    a. Verify carnot.verify imports work:\n        python3 -c \"from carnot.verify.semantic_energy
    import IsingVerifier; print('ok')\"\n        If fails: write honest_verdict blocked_carnot_import_failed
    and exit.\n     b. Find evaluation corpus:\n        ls {project_root}/results/*eval*
    2>/dev/null || ls {project_root}/data/*corpus* 2>/dev/null\n        If no corpus:
    use synthetic 50-example corpus (25 valid reasoning, 25 type-violating).\n  1. Read
    exp2504 results to understand which methodology was used.\n  2. Implement Tier0rVerifier
    in {project_root}/python/carnot/verify/tier0r_curry_howard.py:\n     class Tier0rVerifier:
    (follows BaseVerifier interface)\n       def score(self, response: str) -> float:
    (returns soft type-violation score in [0, 1]; 0=valid, 1=fully violated)\n       Practical
    approximation: parse reasoning steps by sentence boundaries; check if conclusion words\n
    \      ('therefore', 'so', 'thus', 'hence') follow premises with semantic consistency;\n
    \      penalize non-sequitur steps proportionally. If no full NLI model available,\n
    \      use keyword-pattern soft scoring as approximation — document in methodology_note.\n
    \ 3. Write unit tests confirming import and score() returns float in [0, 1].\n  4.
    Evaluate on eval corpus: compute AUROC(tier0r_scores, labels).\n  5. Verify: python3
    -c \"from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('importable')\"\n
    \ 6. Record tier0r_implemented=True if import succeeds.\n\nREQUIRED ARTIFACT FIELDS:\n
    \ - honest_verdict:\n      principle: \"Terminal-prefix required (complete:/success:/passed:/shipped:).\"\n
    \ - tier0r_implemented:\n      principle: \"True only if Tier0rVerifier is importable
    AND score() returns a float. This is the gate condition for exp2521.\"\n  - tier0r_auroc:\n
    \     principle: \"AUROC on eval corpus — must be >= 0.75 to confirm the implementation
    is functional (below exp2504 baseline 0.9123 = implementation regression).\"\n  -
    tier0r_implementation_path:\n      principle: \"File path of the written implementation
    — required for exp2521 to locate it.\"\n  - methodology_note:\n      principle: \"Documents
    which Curry-Howard approximation was used — required for paper-v6 §3 methodology.\"\n
    \ - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n
    \ - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n
    \     principle: \"Reproducibility seed.\"\n\nACCEPTANCE GATES:\n  - condition: \"tier0r_implemented
    == true AND tier0r_auroc >= 0.75\"\n    principle: \"Both conditions: importability
    (structural) and AUROC floor (functional). A file that imports but scores worse than
    random is not a viable verifier.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2521-ensemble-v7-tier0r-integration
  title: 'Phase 2a: Ensemble v7 -- Tier 0r Integration into Group-Conditional Calibration
    (10 Verifiers)'
  milestone: 2026.05.243
  deliverable: results/experiment_2521_ensemble_v7.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  gated_on:
  - upstream: exp2520-tier0r-implementation
    artifact_field: tier0r_implemented
    op: '=='
    value: true
  prior_failures:
  - experiment_id: exp2510-tier0r-integration-ensemble-v7
    verdict: 'blocked_tier0r_not_implemented'
    addressed_by: "exp2510 was blocked because Tier0rVerifier didn't exist. exp2520 implements
      it. This task is the same ensemble v7 integration goal — now unblocked because Tier0rVerifier
      exists from exp2520. Gated on exp2520.tier0r_implemented==true."
    retire_if_same_verdict: false
  prompt: "CONTEXT: Tier 0r (Curry-Howard proof-path verifier) is now implemented (exp2520).
    This task integrates it as the 10th verifier in the group-conditional conformal ensemble.\n\nCurrent
    ensemble (v6, 9 verifiers, AUROC=0.9750, adversarially verified):\n  Group A (logprob):
    Tier 0a (0.810), Tier 0b (0.8539), Tier 0f (0.8669)\n  Group B (semantic): Tier 0c
    (0.8831), Tier 0e (0.8896), Tier 0g (0.854)\n  Group C (logic): Tier 0d (0.588),
    Tier 0h (0.678)\nBaseline: AUROC=0.9750 (adversarially verified, 5 seeds)\n\nTier
    0r is logic-class (proof-path type-checking) → Group C alongside Tier 0d and Tier
    0h.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/tier0r_curry_howard.py
    (from exp2520)\n  Search for group-conditional calibration: grep -r 'group_conditional'
    {project_root}/python/ --include='*.py' -l\n  {project_root}/results/experiment_2520_tier0r_implementation.json
    (baseline AUROC from exp2520)\n  {project_root}/scripts/experiment_template.py\n\nTASK:
    Add Tier 0r to Group C, re-run group-conditional calibration, report ensemble v7 AUROC.\n\nCONCRETE
    STEPS:\n  0. PRECONDITIONS:\n     a. Verify Tier 0r importable: python3 -c \"from
    carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('ok')\"\n        If
    fails: write honest_verdict blocked_tier0r_not_found and exit.\n     b. Find group-conditional
    calibration code:\n        grep -r 'group_conditional' {project_root}/python/ --include='*.py'
    -l\n        If not found: write honest_verdict blocked_group_conditional_code_not_found
    and exit.\n     c. Find evaluation corpus:\n        ls {project_root}/results/*eval*
    || ls {project_root}/data/*corpus*\n        If not found: write honest_verdict blocked_no_eval_corpus
    and exit.\n  1. Assign Tier 0r to Group C (logic-class).\n  2. Re-run group-conditional
    calibration with 10 verifiers across 5 seeds.\n  3. Compute ensemble_v7_auroc (mean
    and std across 5 seeds).\n  4. Compare to baseline ensemble_v6_auroc=0.9750.\n  5.
    If tier0s_viable is available from exp2522 results (if exp2522 ran before this task):\n
    \    Also run ensemble v7b with HalluGuard Tier 0s as 11th verifier (opportunistic).\n\nREQUIRED
    ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n
    \ - ensemble_v7_auroc:\n      principle: \"Primary metric — must be >= 0.970 to confirm
    no regression from v6 baseline.\"\n  - ensemble_v7_auroc_std:\n      principle: \"Multi-seed
    std for reproducibility — required for paper-v6 cite-safe reporting.\"\n  - ensemble_v6_baseline:\n
    \     principle: \"Explicitly records the .241/.242 carry-forward baseline (0.9750)
    so regression detection is unambiguous.\"\n  - tier0r_group_assignment:\n      principle:
    \"Which calibration group Tier 0r was assigned to — required for paper-v6 methodology.\"\n
    \ - n_seeds:\n      principle: \"Must be >= 3 for multi-seed std to be meaningful.\"\n
    \ - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n
    \ - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n
    \     principle: \"Base random seed (other seeds = base+k).\"\n\nACCEPTANCE GATES:\n
    \ - condition: \"ensemble_v7_auroc >= 0.970\"\n    principle: \"Floor prevents accepting
    a new verifier that degrades the cite-safe headline AUROC below the HIVE peer gap threshold.\"\n\nDo
    NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2522-halluguard-tier0s-corpus
  title: 'Phase 2b: HalluGuard Tier 0s -- Eval Corpus Construction + NTK Prototype'
  milestone: 2026.05.243
  deliverable: results/experiment_2522_halluguard_tier0s.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  prior_failures:
  - experiment_id: exp2509-halluguard-tier0s-prototype
    verdict: 'blocked_no_eval_corpus'
    addressed_by: "exp2509 was blocked because it could not find a labeled (response, label)
      evaluation corpus. This task constructs the corpus FIRST: scan all results/*.json
      files for response+label pairs (any field named 'label', 'hallucinated', 'ground_truth',
      'correct', or similar). If fewer than 50 labeled pairs are found in results files,
      generate a synthetic 100-example corpus (50 correct, 50 hallucinated) using template
      patterns. The corpus construction step is PRECONDITION step 1, not an optional fallback."
    retire_if_same_verdict: false
  prompt: "CONTEXT: HalluGuard (arXiv:2601.18753, ICLR 2026) proposes an NTK (Neural Tangent
    Kernel)-based unified hallucination detector that distinguishes data-driven hallucinations
    (factual gaps) from reasoning-driven hallucinations (logical errors). exp2509 was blocked
    because no labeled evaluation corpus could be found at runtime.\n\nThis task constructs
    the corpus and then prototypes the verifier.\n\nTASK: Build eval corpus, implement
    HalluGuard Tier 0s NTK prototype, evaluate AUROC.\n\nEXISTING CODE TO READ FIRST:\n
    \ {project_root}/python/carnot/verify/ (existing verifier interface and BaseVerifier
    pattern)\n  {project_root}/python/carnot/verify/semantic_energy.py (BaseVerifier interface)\n
    \ {project_root}/results/ (scan for response+label pairs)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE
    STEPS:\n  0. PRECONDITIONS:\n     a. Verify carnot.verify imports:\n        python3
    -c \"from carnot.verify.semantic_energy import IsingVerifier; print('ok')\"\n        If
    fails: write honest_verdict blocked_carnot_import_failed and exit.\n  1. Corpus construction
    (required before any AUROC evaluation):\n     a. Scan all results/*.json files for
    labeled response pairs:\n        python3 -c \"import json, glob; [print(f, [k for
    k in json.load(open(f)).keys() if 'label' in k.lower() or 'halluc' in k.lower() or
    'correct' in k.lower()]) for f in glob.glob('results/*.json')[:50]]\"\n     b. If
    >= 50 labeled pairs found: use them as corpus.\n     c. If < 50: generate synthetic
    corpus:\n        - 50 valid reasoning examples: 'The sum of 2+3 is 5. Therefore the
