- id: exp1013-preflight-v29
  milestone: 2026.04.79
  deliverable: results/experiment_1013_preflight_v29.json
  title: "Preflight v29 — Pre-Test Surgery + Manifest Retirement 786/641/906 + .78 Retro Coverage"
  prompt: |
    CONTEXT:
    Milestone 2026.04.78 closed with 3/12 criteria met. A critical new failure mode appeared:
    "comparison failed" pre-test errors blocked Exps 1004, 1009, 1010, 1012 — 4 experiments that
    never ran including the retro. Root cause: Exp 1001 fixed SC-Energy test failures by wiring
    SC-Energy as Tier 2 in verify_repair.py. This change likely altered pipeline output behavior
    such that a pre-existing test's expected value no longer matches actual output (snapshot test,
    assertEqual, or hardcoded float comparison). The conductor's self-heal mechanism tried 3x per
    experiment and failed each time.

    Additionally, Exps 786, 641, and 906 ran for the 19th consecutive milestone. Per CLAUDE.md
    no-doomed-rerun discipline: Exp 641 is 9 consecutive (6 past mandatory gate), Exp 906 is 6
    consecutive (3 past mandatory gate), Exp 786 is 19 consecutive — all MUST be retired.

    This preflight must:
    1. Find and fix the "comparison failed" pre-test failure
    2. Retire Exps 786, 641, 906 to both exclusion manifests
    3. Write a summary of .78 milestone outcomes (Exp 1012 never ran)
    4. Write gate artifact gate_schema_v79=True so downstream experiments can proceed

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py (SC-Energy wiring from Exp 1001)
    - tests/python/ (find test files most recently modified — look for snapshot/assertEqual)
    - results/experiment_1001_sc_energy_tier2_v4.json (what changed in .78)
    - scripts/conductor_exclusion_manifest.json (current exclusion list)
    - ops/exclusion_manifest.yaml (current YAML exclusion list)
    - results/experiment_100{0,1,2,3,5,6,7,8,11}_*.json (collect .78 verdicts for retro summary)

    TASK:
    1. RUN pytest to find the comparison failure:
       pytest tests/python/ -x -v 2>&1 | head -80
       Look for "AssertionError" or "comparison failed" with specific test name and expected vs actual.
    2. DIAGNOSE: What exactly is different? Is it a hardcoded float? A string comparison? A structure
       that changed because SC-Energy is now Tier 2 instead of VariationalJEPAPredictor?
    3. FIX: Update the test's expected value to match the new behavior. Do NOT skip the test.
       Run pytest again to confirm 0 failures before proceeding.
    4. RETIRE to conductor_exclusion_manifest.json: add integers 786, 641, 906 to the
       'retired_experiment_ids' array if not already present. Write atomically (tmp+rename).
    5. RETIRE to ops/exclusion_manifest.yaml: add entries for experiments 786, 641, 906 with
       retire_reason: "19/9/6 consecutive appearances, mandatory gate reached per CLAUDE.md"
    6. COLLECT .78 summary from result files:
       For each: experiment_1000 through 1011, read honest_verdict (N/A if file missing).
       Count: n_met (tier2_deployed + gate_schema_repaired = 2 min), n_total=12.
    7. WRITE results/experiment_1013_preflight_v29.json (try/finally):
       - pre_test_fixed: bool (True if pytest passes after fix)
       - failing_test_name: str (the test that was failing)
       - failing_test_root_cause: str (why it failed — e.g. "SC-Energy wiring changed pipeline structure check")
       - manifest_786_retired: bool
       - manifest_641_retired: bool
       - manifest_906_retired: bool
       - retro_78_verdicts: dict (exp_id -> verdict string for 1000-1011)
       - retro_78_criteria_met: int
       - gate_schema_v79: bool (True if pre_test_fixed=True AND all three retired)
       - honest_verdict: "preflight_complete" | "tests_still_failing" | "partial_retirement_only"

    CONCRETE STEPS:
    - pytest tests/python/ -x -v 2>&1 | grep -A10 "FAILED\|comparison failed\|AssertionError" | head -60
    - git log --oneline -5 tests/python/ python/carnot/pipeline/verify_repair.py 2>/dev/null | head -10
    - python3 -c "import json; d=json.load(open('scripts/conductor_exclusion_manifest.json')); ids=d.get('retired_experiment_ids', []); print('786:', 786 in ids, '641:', 641 in ids, '906:', 906 in ids)"
    - for f in results/experiment_100{0,1,2,3,5,6,7,8,11}_*.json; do echo "$(basename $f):"; python3 -c "import json,sys; print(json.load(open('$f')).get('honest_verdict','N/A'))" 2>/dev/null || echo "N/A"; done

    Run: python scripts/experiment_1013_preflight_v29.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

