    title: "SMT/SAT validator-tree exactness upgrade"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 60
    track: "verification"
    inference_substrate: "cpu_exact_validator"
    requires_gpu: false
    agent_type: codex
    model: "gpt-5.5"
    requires_codex: true
