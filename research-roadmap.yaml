- id: exp513-jit-vram-check
  milestone: 2026.04.39
  deliverable: results/experiment_513_jit_vram_check.json
  title: 'Exp 513: JITVRAMCheck + Sequential Model Loading — RETRO-051 root cause fix'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-051 is\
    \ the final blocker in a six-milestone chain preventing live credibility benchmarks\
    \ (RETRO-033/038/039). RETRO-048 resolved the VRAM budget constraint (Exp 500\
    \ confirmed Gemma4-INT4 fits within budget). But Exps 502/503/504 still failed\
    \ with runtime CUDA OOM because the planning-time VRAM forecast is computed once\
    \ at startup while actual model loading happens later when VRAM state has changed.\
    \ Fix: implement JITVRAMCheck that queries pynvml immediately before each model.load()\
    \ call — not at script startup. Retry once after 30s if insufficient.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/gemma4_quantized_loader.py — Gemma4QuantizedLoader (Exp 500)\n\
    - python/carnot/pipeline/gemma_loader.py — GemmaTransformersLoader (Exp 450)\n\
    - python/carnot/pipeline/gpu_vram_gate_v2.py — GPUVRAMGateV2 (pattern for pynvml usage)\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/deliverable_guard.py — DeliverableGuard (Exp 462)\n\
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu()\n\
    - ops/known-issues.md — RETRO-051\n\nTASK: Implement JITVRAMCheck and wire it\
    \ into the model loaders as a pre-load gate.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-INFRA-054 (JITVRAMCheck queries real-time VRAM immediately before\
    \ each model.load() call), REQ-INFRA-055 (JITVRAMCheck retries once after\
    \ retry_wait_s=30 if available_gb < required_gb), REQ-INFRA-056 (JITVRAMCheck\
    \ CI stub returns is_cleared=True, available_gb=24.0 when pynvml not installed),\
    \ SCENARIO-INFRA-062/063/064 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST for python/carnot/pipeline/jit_vram_check.py (100% coverage):\n\
    \   - JITVRAMResult(device_id, required_gb, available_gb, is_cleared, attempts, wait_applied)\n\
    \   - JITVRAMCheck(device_id=0):\n\
    \     - get_available_gb() -> float: real-time pynvml query; CI stub returns 24.0\n\
    \     - gate_model_load(model_id, required_gb, retry_wait_s=30) -> JITVRAMResult:\n\
    \       check now; if not cleared, wait retry_wait_s seconds, check again;\n\
    \       return JITVRAMResult with is_cleared, available_gb, attempts (1 or 2),\
    \ wait_applied\n\
    \     - sequential_load_gate(model_specs: List[Dict[str,Any]]) -> List[JITVRAMResult]:\n\
    \       for each spec in model_specs, call gate_model_load(spec['model_id'],\
    \ spec['required_gb']); return list of results\n\
    \   - Test: gate_model_load returns is_cleared=True when available_gb >= required_gb\n\
    \   - Test: gate_model_load returns attempts=2 and wait_applied=True when first\
    \ check fails\n\
    \   - Test: gate_model_load returns is_cleared=False when both checks fail\n\
    \   - Test: CI stub path (pynvml not installed) returns is_cleared=True\n\
    5. Implement python/carnot/pipeline/jit_vram_check.py with JITVRAMCheck.\n\
    \   Docstring: WHY jit vs planning-time (planning-time VRAM snapshot is stale\
    \ by model load time; JIT check happens in the same call frame as the load;\
    \ this converts silent CUDA OOM into a fast-fail diagnostic with retry).\n\
    \   CI stub: if pynvml not importable, get_available_gb() returns 24.0 (max VRAM\
    \ assumed available — CI never has GPU).\n\
    \   Export JITVRAMCheck, JITVRAMResult from carnot.pipeline.__init__.\n\
    6. Wire JITVRAMCheck into Gemma4QuantizedLoader.load():\n\
    \   a. Add optional jit_vram_check: Optional[JITVRAMCheck] = None param to __init__\n\
    \   b. In load(): if self.jit_vram_check is not None, call gate_model_load(\
    \ self.model_id, required_gb=10.0) BEFORE calling llama_cpp.Llama(); if result.is_cleared\
    \ is False, return False immediately with a logged warning.\n\
    7. Wire JITVRAMCheck into GemmaTransformersLoader.load() analogously (required_gb=15.0).\n\
    8. Write scripts/experiment_513_jit_vram_check.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(513, timeout_minutes=20) as context manager\n\
    \   c. ExperimentTemplate(513, 'JIT VRAM Check',\n\
    \      'results/experiment_513_jit_vram_check.json', requires_gpu=False)\n\
    \   d. DeliverableGuard('results/experiment_513_jit_vram_check.json')\n\
    \   e. Test JITVRAMCheck with simulated scenarios:\n\
    \      - scenario_a: available_gb=20.0, required_gb=10.0 → is_cleared=True, attempts=1\n\
    \      - scenario_b: available_gb=8.0, required_gb=10.0 → first check fails;\n\
    \        simulate 30s wait (mock time.sleep); second check with available_gb=12.0\
    \ → is_cleared=True, attempts=2\n\
    \      - scenario_c: available_gb=5.0, required_gb=10.0, retry available_gb=6.0\
    \ → is_cleared=False, attempts=2\n\
    \   f. Build artifact: schema='carnot.jit_vram_check.v1'\n\
    \      jit_vram_check_implemented=True\n\
    \      scenario_a_result: {is_cleared, available_gb, attempts}\n\
    \      scenario_b_result: {is_cleared, available_gb, attempts, wait_applied}\n\
    \      scenario_c_result: {is_cleared, available_gb, attempts}\n\
    \      gemma4_wired=True (JITVRAMCheck added to Gemma4QuantizedLoader)\n\
    \      gemma_wired=True (JITVRAMCheck added to GemmaTransformersLoader)\n\
    \      retro_051_resolved=True\n\
    \      honest_verdict='jit_vram_check_operational'\n\
    \   g. Call tmpl.assert_deliverable_written() as FINAL LINE\n\
    9. Write tests/python/test_jit_vram_check.py (100% coverage on jit_vram_check.py).\n\
    10. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    11. Reconcile: update ops/conductor-log.md (RETRO-051 status), ops/status.md,\
    \ ops/changelog.md, _bmad/traceability.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp514-live-100q-precision-v7
  milestone: 2026.04.39
  deliverable: results/experiment_514_live_100q_precision_v7.json
  title: 'Exp 514: Live 100q Precision v7 — RETRO-033 seventh attempt, JIT VRAM gated'
