- id: exp481-inference-batching-enforcement
  milestone: 2026.04.36
  deliverable: results/experiment_481_inference_batching_enforcement.json
  title: 'Exp 481: Inference Batching Enforcement — BatchedInferenceRunner audit and enforcement'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: BatchedInferenceRunner\
    \ is available in scripts/experiment_template.py since Exp 437 but is NOT consistently\
