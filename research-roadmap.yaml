- id: exp755-psv-relapse-diagnosis
  milestone: 2026.04.58
  deliverable: results/experiment_755_psv_relapse_diagnosis.json
  title: 'Exp 755: PSV Relapse Diagnosis — Architecture Root Cause (RETRO-PSV-RELAPSE)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: PSV (self-play verify-repair loop) has relapsed for the third time.
    Milestone .57 retro (Exp 753) showed fp_rate_slope_new30=+0.00110 (positive =
    deteriorating). Three prior recovery experiments (Exps 697, 737) each achieved
    temporary recovery that subsequently reversed. This indicates an ARCHITECTURE problem,
    not a hyperparameter problem. Three competing hypotheses:

    HYPOTHESIS A (SRSA — arXiv 2603.21558): Unverified incorrect repairs write to session
    memory and corrupt the constraint signal. Each relapse occurs when the memory pool
    accumulates enough corrupted entries to flip the constraint weights.

    HYPOTHESIS B (PPSEBM — arXiv 2512.15658): Calibrated constraint parameters get
    overwritten during self-play adaptation. The coupling matrix entries that were correctly
    learned via CD training get perturbed by the self-play update step.

    HYPOTHESIS C (Curriculum collapse): The self-play question diversity is exhausted —
    the system keeps sampling the same question types, leading to overfitting to a narrow
    distribution of constraint violations.

    This experiment diagnoses which hypothesis is correct so Exp 756 can apply the right fix.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/self_learning_relay.py — SelfLearningRelay; look for memory write.
    - python/carnot/pipeline/session_memory.py — SessionMemory; how entries are written.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; the PSV entry point.
    - results/experiment_736_psv_diagnosis.json — .56 root cause: "constraint_specialization".
    - results/experiment_737_psv_recovery.json — .56 recovery: "domain_diverse_training".
    - results/operational_retro_2026_04_57.json — .57 retro: PSV relapse confirmed.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Run a controlled diagnostic to test all three hypotheses on synthetic data.
    Report: which hypothesis explains the relapse? Provide evidence for each.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-PSV-010 (PSV relapse root cause MUST be identified via controlled test of
       at least 3 competing hypotheses before applying any fix), SCENARIO-PSV-020 to
       openspec/capabilities/self_learning/spec.md.
    3. Build a PSVDiagnostic framework:
       a. Create python/carnot/pipeline/psv_diagnostic.py with:
          PSVDiagnosticResult(hypothesis_a_confirmed, hypothesis_b_confirmed,
            hypothesis_c_confirmed, primary_hypothesis, evidence_dict) dataclass.
          PSVDiagnostic(pipeline, session_memory, n_trials=100):
            test_hypothesis_a(): inject 20% corrupted (incorrect) repairs into memory,
              run 30 self-play steps, measure fp_rate_slope. If slope > 0, hyp A confirmed.
            test_hypothesis_b(): freeze coupling matrix before self-play, run 30 steps,
              measure fp_rate_slope. If slope stays ≤ 0 when frozen, hyp B confirmed.
            test_hypothesis_c(): duplicate the same 10 questions 10x (zero diversity),
              run 30 self-play steps, measure fp_rate_slope. If slope > 0, hyp C confirmed.
            diagnose() -> PSVDiagnosticResult: run all three, return primary hypothesis.
    4. Run the diagnostic on synthetic GSM8K-style data (100 questions, CPU-only):
       a. Initialize PSV with clean state.
       b. Run test_hypothesis_a() with 20% corrupted memory writes.
       c. Run test_hypothesis_b() with frozen coupling matrix.
       d. Run test_hypothesis_c() with zero-diversity question set.
       e. For each: record fp_rate at step 0, 10, 20, 30 and fp_rate_slope.
    5. Compare results across hypotheses:
       a. Which shows the strongest correlation with fp_rate_slope reversal?
       b. Are multiple hypotheses partially true?
       c. What is the PRIMARY root cause?
    6. Write python/carnot/pipeline/psv_diagnostic.py with full implementation.
    7. Create scripts/experiment_755_psv_relapse_diagnosis.py:
       a. ExperimentTemplate(755) + ExperimentTimeoutWatchdog(755, timeout_minutes=60).
       b. Run PSVDiagnostic.diagnose() on 100 synthetic questions.
       c. honest_verdict:
          - "hypothesis_a_confirmed" (SRSA — memory contamination)
          - "hypothesis_b_confirmed" (PPSEBM — coupling overwrite)
          - "hypothesis_c_confirmed" (curriculum collapse)
          - "multiple_hypotheses" (≥2 confirmed, need combined fix)
          - "diagnosis_inconclusive" (none confirmed, need deeper analysis)
       d. artifact: hypothesis_a_slope, hypothesis_b_slope, hypothesis_c_slope,
          primary_hypothesis, evidence_dict, honest_verdict.
    8. Write tests/python/test_experiment_755_psv_diagnosis.py with 100% coverage:
        - test PSVDiagnosticResult dataclass fields.
        - test test_hypothesis_a injects corrupted repairs correctly.
        - test test_hypothesis_b freezes coupling matrix before self-play.
        - test test_hypothesis_c uses zero-diversity question set.
        Each test traces to REQ-PSV-010.
    9. Reconcile:
       - ops/status.md: "RETRO-PSV-RELAPSE diagnosis: primary_hypothesis=X. Evidence: ..."
       - ops/changelog.md: one-line with honest_verdict.
    10. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp756-psv-srsa-gate
  milestone: 2026.04.58
  deliverable: results/experiment_756_psv_srsa_gate.json
  title: 'Exp 756: PSV Recovery v2 — SRSA Memory Gate + PPSEBM Constraint Freezing (GATED on Exp 755)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: GATED on Exp 755 (PSV relapse diagnosis). Read
    results/experiment_755_psv_relapse_diagnosis.json FIRST. The fix to apply depends
    on Exp 755's primary_hypothesis:
    - hypothesis_a: Apply SRSA Memory Gate (arXiv 2603.21558) — Z3/SymCodeVerifier check
      before memory writes; only verified-correct repairs enter the pool.
    - hypothesis_b: Apply PPSEBM Constraint Freezing (arXiv 2512.15658) — freeze coupling
      matrix entries with low energy variance during self-play adaptation.
    - hypothesis_c: Apply curriculum diversity enforcement — shuffle question pool with
      minimum Hamming distance between consecutive samples.
    - multiple_hypotheses: Apply all three (layered fix).

    The SUCCESS CRITERION is fp_rate_slope_new30 < 0 (recovering trend) confirmed on 30+
    self-play steps. This is the same criterion that Exps 697 and 737 achieved temporarily
    but did not sustain. The test: run 60 self-play steps total, check slope in two windows:
    steps 0-30 AND steps 30-60. BOTH windows must show slope < 0 for "recovery_sustained".

    EXISTING CODE TO READ FIRST:
    - results/experiment_755_psv_relapse_diagnosis.json — PRIMARY INPUT: primary_hypothesis.
    - python/carnot/pipeline/self_learning_relay.py — SelfLearningRelay memory write path.
    - python/carnot/pipeline/session_memory.py — SessionMemory.write() to add gate.
    - python/carnot/extraction/vprm_verifier.py — VPRMArithmeticVerifier for Z3 checking.
    - python/carnot/pipeline/psv_diagnostic.py — PSVDiagnostic from Exp 755.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Apply the Exp 755 diagnosis to implement the targeted fix. Validate:
    fp_rate_slope_new30 < 0 in BOTH windows (steps 0-30 AND 30-60).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_755_psv_relapse_diagnosis.json. Note primary_hypothesis.
    3. Add REQ-PSV-011 (SRSA memory gate: SessionMemory.write() MUST verify repair with
       VPRMArithmeticVerifier before accepting; unverified repairs are discarded),
       REQ-PSV-012 (PPS constraint freezing: coupling entries with energy variance < threshold
       MUST NOT be updated during self-play), REQ-PSV-013 (sustained recovery: fp_rate_slope
       MUST be < 0 in both steps 0-30 AND 30-60 windows to declare RETRO-PSV-RELAPSE closed),
       SCENARIO-PSV-021/022/023 to openspec/capabilities/self_learning/spec.md.
    4. Implement the fix(es) based on primary_hypothesis:
       a. HYPOTHESIS A fix (SRSA Memory Gate):
          Add to python/carnot/pipeline/session_memory.py:
          SessionMemory.write_with_verification(repair_text, constraint_type) -> bool:
            - Run VPRMArithmeticVerifier.verify(repair_text) → if NOT verified: return False.
            - If verified: call existing write(), return True.
          Modify SelfLearningRelay to call write_with_verification instead of write().
       b. HYPOTHESIS B fix (PPSEBM Constraint Freezing):
          Add to python/carnot/pipeline/self_learning_relay.py:
          SelfLearningRelay._freeze_stable_constraints():
            - For each constraint type: compute energy variance over last 30 self-play steps.
            - If variance < FREEZE_THRESHOLD (0.01): mark constraint as frozen.
            - Frozen constraints: skip weight update in PerModelFPTracker.update().
       c. HYPOTHESIS C fix (Curriculum Diversity):
          Add to SelfLearningRelay: enforce minimum Hamming distance between consecutive
          question samples. Reject questions with distance < 2 from the last 5 sampled.
       d. MULTIPLE: apply all three (A + B + C layered).
    5. Run validation: 60 self-play steps on 100 synthetic GSM8K-style questions.
       - Measure fp_rate at steps 0, 10, 20, 30, 40, 50, 60.
       - Compute fp_rate_slope_window1 (steps 0-30) and fp_rate_slope_window2 (steps 30-60).
       - recovery_sustained = (window1_slope < 0) AND (window2_slope < 0).
    6. Create scripts/experiment_756_psv_srsa_gate.py:
       a. ExperimentTemplate(756) + ExperimentTimeoutWatchdog(756, timeout_minutes=60).
       b. Implement steps 4-5.
       c. honest_verdict:
          - "recovery_sustained" if window1_slope < 0 AND window2_slope < 0
          - "recovery_partial" if window1_slope < 0 AND window2_slope >= 0 (old pattern)
          - "recovery_failed" if both slopes >= 0
          - "fix_not_applicable" if primary_hypothesis == "diagnosis_inconclusive"
       d. artifact: primary_hypothesis_applied, fix_type, fp_rate_series (list),
          window1_slope, window2_slope, recovery_sustained (bool), honest_verdict.
    7. Write tests/python/test_experiment_756_psv_srsa_gate.py with 100% coverage:
        - test SessionMemory.write_with_verification rejects unverified repairs.
        - test constraint freezing skips weight update for frozen constraints.
        - test recovery_sustained requires BOTH window slopes to be negative.
        Each test traces to REQ-PSV-011/012/013.
    8. Reconcile:
       - ops/status.md: "RETRO-PSV-RELAPSE: fix applied (hypothesis=X). Recovery: sustained/partial/failed."
         If recovery_sustained: "RETRO-PSV-RELAPSE CLOSED."
       - ops/changelog.md: one-line with honest_verdict.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp757-hls-energy-fix
  milestone: 2026.04.58
  deliverable: results/experiment_757_hls_energy_fix.json
  title: 'Exp 757: HLS Energy Sign Fix — RETRO-HLS-ENERGY (CPU Validation)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 750 (Vitis HLS Ising Sampler v4) built and compiled successfully but
    CPU validation FAILED: expected energy near -3.0 (ferromagnetic ground state for
    all-aligned spins), got +3.0 (energy_delta_pct=200%). This is a sign convention bug:
    the Ising Hamiltonian is E = -sum(J_ij * s_i * s_j). The negative sign is critical —
    ground state (all spins aligned, J > 0) has NEGATIVE energy. A +3.0 result means
    the code computes +J instead of -J.

    This bug was reported as RETRO-HLS-ENERGY in the .57 retro and must be fixed before
    KV260 synthesis can be validated.

    EXISTING CODE TO READ FIRST:
    - results/experiment_750_vitis_hls_ising_v4.json — baseline: energy_delta_pct=200.
    - hardware/kv260/ — look for the HLS C++ kernel file (likely ising_sampler_v4.cpp
      or similar); read it completely.
    - hardware/kv260/ising_sampler_v3.v — the Verilog RTL for comparison on sign convention.
    - crates/carnot-ising/src/ — Rust Ising implementation; verify sign convention there.
    - python/carnot/samplers/parallel_ising.py — Python Ising; verify sign convention there.
    - scripts/experiment_750_vitis_hls_ising_v4.py — Exp 750 script; find the CPU simulation.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Find and fix the sign bug in the HLS C++ energy function. Validate CPU simulation
    shows energy near -3.0 for the ferromagnetic ground state test case.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_750_vitis_hls_ising_v4.json to understand the exact test
       case that failed (which J matrix, which spin configuration, expected vs actual).
    3. Read the HLS C++ kernel file (hardware/kv260/ising_sampler_v4.cpp or similar).
       Find the energy accumulation code. Look for the pattern:
       energy += J[i][j] * spin[i] * spin[j]  ← WRONG (positive)
       Should be: energy -= J[i][j] * spin[i] * spin[j]  OR energy += -J[i][j] * spin[i] * spin[j]
    4. Add REQ-HW-040 (HLS Ising kernel energy computation MUST use Hamiltonian
       E = -sum(J_ij * s_i * s_j), negative sign required; CPU validation MUST confirm
       energy of ferromagnetic ground state is negative and approximately -J*N*(N-1)/2 for
       fully connected N-spin system), SCENARIO-HW-040 to
       openspec/capabilities/verifiable-reasoning/spec.md.
    5. Fix the sign bug in the HLS C++ kernel:
       a. Apply the minimal change: negate the energy accumulation.
       b. Check for any other sign issues: h_ema initialization, Metropolis criterion.
          The Metropolis criterion for acceptance: accept if delta_E <= 0 (energy DECREASES).
          Verify the C++ accepts flips that DECREASE energy, not INCREASE.
    6. Write a CPU validation program:
       a. Create hardware/kv260/validate_energy_sign.cpp (or Python equivalent):
          - Set up a small N=4 ferromagnetic Ising system: J[i][j]=1.0 for all i,j.
          - All spins = +1 (ground state).
          - Expected energy: E = -sum_(i<j) J_ij * 1 * 1 = -N*(N-1)/2 = -6.0 for N=4.
          - Run the energy function from the HLS kernel.
          - Pass if |energy - (-6.0)| < 0.5.
    7. Alternatively, port the energy calculation to Python for CPU validation:
       a. Write python/carnot/pipeline/hls_energy_validator.py:
          HLSEnergyValidator(n_spins, j_matrix, h_field):
            compute_energy(spins) -> float: implement Hamiltonian E = -sum J_ij s_i s_j - sum h_i s_i
            validate_ground_state() -> bool: all-ones spins should give minimum energy
            compare_with_python_ising(n_samples=100) -> (max_delta, max_delta_pct)
    8. Run validation and confirm:
       - energy_ground_state < 0 (negative — required by physics)
       - |energy_ground_state - expected| / |expected| < 0.10 (within 10%)
       - Record energy_before_fix and energy_after_fix.
    9. If Vivado is available on PATH: attempt synthesis of fixed kernel.
       Record: vivado_available (bool), synthesis_attempted (bool), synthesis_result.
    10. Create scripts/experiment_757_hls_energy_fix.py:
        a. ExperimentTemplate(757) + ExperimentTimeoutWatchdog(757, timeout_minutes=45).
        b. Implement steps 5-9.
        c. honest_verdict:
           - "sign_fixed_validated" if energy_ground_state < 0 AND delta_pct < 10
           - "sign_fixed_synthesis_done" if sign_fixed AND vivado_available AND synthesis done
           - "sign_fixed_not_validated" if fix applied but delta still > 10%
           - "sign_not_found" if HLS C++ kernel not found at expected path
        d. artifact: energy_before_fix, energy_after_fix, energy_ground_state, expected_energy,
           delta_pct, sign_convention_fixed (bool), vivado_available (bool),
           synthesis_attempted (bool), honest_verdict.
    11. Write tests/python/test_experiment_757_hls_energy_fix.py with 100% coverage:
        - test HLSEnergyValidator computes correct energy for N=4 all-ones spins.
        - test validate_ground_state returns True when energy is negative.
        - test compare_with_python_ising returns delta < 0.10 for correct implementation.
        Each test traces to REQ-HW-040.
    12. Reconcile:
        - ops/status.md: "RETRO-HLS-ENERGY: sign_fixed=True/False. energy_after_fix=X.
          Synthesis: attempted/blocked." Mark RETRO-HLS-ENERGY as CLOSED or PARTIAL.
        - ops/changelog.md: one-line with honest_verdict.
        - research-hardware-wishlist.md: update KV260 synthesis status section.
    13. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp758-yosys-synthesis
  milestone: 2026.04.58
  deliverable: results/experiment_758_yosys_synthesis.json
  title: 'Exp 758: Yosys RTL Synthesis — Open-Source Alternative to Vivado (GATED on Exp 757)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: GATED on Exp 757 (HLS energy sign fix). Read
    results/experiment_757_hls_energy_fix.json first. If sign_fixed=False, this
    experiment is blocked — write an honest_verdict="blocked_hls_fix_needed" artifact
    and exit cleanly.

    Vivado has been unavailable for every KV260 synthesis attempt across 6+ milestones.
    The open-source alternative is yosys + nextpnr. yosys synthesizes Verilog RTL to a
    gate-level netlist; nextpnr performs place-and-route for various FPGA families.
    For iCE40 (Lattice), this is fully open-source. For Xilinx (KV260), yosys can target
    a generic FPGA for resource estimation, or the nextpnr-xilinx experiment may work.

    Even if the KV260 XCK26 is too large for full synthesis with open tools, synthesizing
    the Ising sampler RTL for iCE40 (smaller) proves the RTL is synthesis-clean and gives
    real resource utilization numbers. This unblocks KV260 comparison.

    EXISTING CODE TO READ FIRST:
    - results/experiment_757_hls_energy_fix.json — confirm sign_fixed=True before proceeding.
    - hardware/kv260/ising_sampler_v3.v — Ising v3 RTL (EMA inertia, Exp 662).
    - hardware/kv260/ising_sampler_v2.v — Ising v2 RTL (synchronous, smaller).
    - hardware/kv260/synth_ising.tcl — existing Vivado synthesis TCL (for reference only).
    - hardware/kv260/ising_sampler_v3_spec.md — v3 spec with target parameters.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Install yosys. Synthesize ising_sampler_v2.v or v3.v targeting a generic/iCE40
    FPGA. Report synthesis result, resource utilization, and timing estimate.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_757_hls_energy_fix.json. If sign_fixed=False: write
       artifact with honest_verdict="blocked_hls_fix_needed" and exit immediately.
    3. Add REQ-HW-041 (Yosys open-source synthesis MUST be attempted as Vivado alternative;
       honest_verdict=synthesis_successful when LUT count and timing reported without errors),
       SCENARIO-HW-041 to openspec/capabilities/verifiable-reasoning/spec.md.
    4. Check if yosys is installed:
       a. Run `which yosys` and `yosys --version` in a subprocess.
       b. If not found: attempt install via `pip install yowasp-yosys` (Python wrapper).
       c. If pip install fails: try `sudo pacman -S yosys` (Arch Linux) or
          `sudo apt install yosys` (Debian/Ubuntu) in a subprocess.
