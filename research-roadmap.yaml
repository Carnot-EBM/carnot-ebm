- id: exp1417-ebrm-latent-trajectory-drift-smoke
  milestone: 2026.04.109
  deliverable: results/experiment_1417_ebrm_latent_trajectory_drift_smoke.json
  title: "EBRM Latent Trajectory Drift Smoke — Energy Down Does Not Imply Decode Correct"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 35
  priority: medium
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp771-ebrm-comparison
      verdict: prior_ebrm_validation_archived
      addressed_by: "exp771 compared an EBRM-style reward model against EORM. This task is different: it tests the 2026 structured-latent-trajectory drift failure mode from arXiv:2603.28248 and explicitly measures whether energy descent hurts decoded accuracy."
      retire_if_same_verdict: false
    - experiment_id: exp1187-latent-grpo-energy-reward
      verdict: latent_grpo_scope_previously_explored
      addressed_by: "This task does not rerun Latent-GRPO or policy optimization. It is a CPU-only diagnostic of latent drift, decoder support, and anchoring requirements before Phase-3 scale-up."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    arXiv:2603.28248 models reasoning as energy minimization over latent
    trajectories but reports a critical failure: on CNF logic, planning lowers
    energy while decoded accuracy drops because the planner drifts off decoder
    support. Carnot's Phase-3/Kona bridge must measure this failure before
    scaling continuous latent repair. Use {project_root} as the project root
    and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - python/carnot/phase3/
    - docs/research-notes/phase3-architecture-blindspot-audit-results.md
    - openspec/capabilities/self-learning/spec.md

    TASK:
    Build or run a tiny CPU-only EBRM-style latent planning smoke test that
    measures whether energy decreases, decoded accuracy changes, and latent
    drift grows beyond decoder support.

    REQUIRED ARTIFACT FIELDS:
    - status
    - latent_drift_smoke_complete
    - task_family
    - energy_monotone
    - accuracy_before_planning
    - accuracy_after_planning
    - accuracy_delta_after_planning
    - latent_drift_norm
    - dual_path_decoder_required
    - anchoring_required
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1417_ebrm_latent_trajectory_drift_smoke.json immediately with status="in_progress".
    2. Prefer a minimal synthetic CNF or graph task already present in the repo; otherwise create a tiny self-contained script under scripts/ or results/ as appropriate.
    3. Implement encoder output h_x, latent z, simple energy terms, and a decoder.
    4. Run direct decode and planned decode on the same small dataset.
    5. Measure energy monotonicity during planning.
    6. Measure latent_drift_norm from encoder output to planned z_T.
    7. Set dual_path_decoder_required=true if planning lowers energy but hurts or fails to improve accuracy.
    8. Write all required fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1417_ebrm_latent_trajectory_drift_smoke.json')); print(d.get('latent_drift_smoke_complete'), d.get('energy_monotone'), d.get('accuracy_delta_after_planning'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

