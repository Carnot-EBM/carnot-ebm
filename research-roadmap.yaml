tasks:
  - id: exp1692-thrml-curie-weiss-10k-ground-truth
    title: "Exp 1692: THRML/Carnot Curie-Weiss n=128 parity with analytic ground truth (top MANDATORY)"
    deliverable: results/experiment_1692_thrml_curie_weiss_ground_truth.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1850-thrml-parity-n128
        verdict: undersampled_n128_100_samples
        addressed_by: "exp1850 used 100 samples at n=128 in a 2^128 state space, so KL was sample-noise dominated; this experiment uses 10,000 samples per side AND a tractable mean-field Curie-Weiss substrate where the analytic equilibrium mean is computable, giving three-way comparison Carnot vs THRML vs ground truth."
        retire_if_same_verdict: true
      - experiment_id: exp1686-thrml-bias-fix
        verdict: complete_but_missing_ground_truth_check
        addressed_by: "exp1686 fit a beta-dependent linear bias correction from a 3-point OLS over a single n=128 substrate; correction reduced bias 81.7x at beta=1.2 BUT no analytic Curie-Weiss equilibrium-mean reference was used (sample-mean comparison only). This experiment closes that gap by computing the analytic <s>_CW(beta) and reporting all three estimators against ground truth."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: The exp1850 corrigendum (filed 2026-05-11 23:30Z, see ops/known-issues.md
      ".148+ MANDATORY") requires a tractable-substrate THRML/Carnot parity comparison
      with analytic ground truth at n=128, 10k+ samples, and gates calibrated to
      the sample-size variance floor.

      FALSIFIABLE HYPOTHESIS: After applying the exp1686 bias correction
      (correction(beta) = 0.17735 - 0.11356 * beta), Carnot's corrected per-spin
      magnetization at n=128 on a Curie-Weiss (all-to-all J=1/(n-1)) substrate at
      beta in {1.05, 1.20, 1.50} converges to the analytic mean-field equilibrium
      <s>_CW(beta) (root of m = tanh(beta * m) for beta > 1) within
      |Carnot_mean - ground_truth| < 0.01 over 10,000 samples. THRML's raw mean
      should agree with Carnot's RAW mean (pre-correction) within KS p > 0.05.

      EXISTING CODE TO READ FIRST:
        - python/carnot/samplers/parallel_ising.py (has ising_mean_bias_correction +
          corrected_magnetization_mean from exp1686)
        - results/experiment_1686_thrml_bias_fix.json (correction coefficients)
        - results/experiment_1850_thrml_parity_n128.json (corrigendum field)
        - results/experiment_1682_thrml_bias.json (sweep_b OLS source)

      TASK: Three-way comparison at n=128 Curie-Weiss between (a) analytic mean-field
      ground truth, (b) Carnot corrected sampler, (c) THRML JAX sampler. All at 10,000
      samples per beta-point, 500 warmup, 5 steps_per_sample (matching exp1686).

      CONCRETE STEPS:
        1. Compute analytic ground truth: for each beta in {1.05, 1.20, 1.50},
           numerically solve m = tanh(beta * m) for m > 0 using scipy.optimize.brentq
           on [1e-6, 1.0]; this is <s>_CW(beta) for the all-to-all Curie-Weiss model
           in the thermodynamic limit. At n=128 the finite-size correction is O(1/n)
           ~ 0.008, so the gate of 0.01 is at the noise floor.
        2. Run Carnot sampler with use_checkerboard=False, n_spins=128, J=1/127,
           h=0, beta=beta, n_samples=10000, n_warmup=500, steps_per_sample=5,
           random_seed=171192. Apply bias correction. Report raw + corrected
           per-spin means.
        3. Run THRML 0.1.3 JAX sampler with the same substrate + same N. Pre-existing
           import path is `import thrml`. If thrml.sample_ising not available, use
           the same path exp1682 used.
        4. Report all three estimators side-by-side: ground_truth, carnot_raw,
           carnot_corrected, thrml_raw, thrml_corrected (if bias correction applies).
        5. Compute KL divergence between empirical histograms (binned at 0.01
           resolution on per-spin magnetization, which is the only well-defined
           empirical density at this sample size); report KL between each pair.
        6. Acceptance gate: abs(carnot_corrected_mean - ground_truth) < 0.01 at
           all three beta values AND KS p-value(carnot_raw, thrml_raw) > 0.05
           (cannot reject same-distribution null). If either fails, write
           the failure honestly into honest_verdict with prefix
           `complete:` describing the residual gap.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.thrml_curie_weiss_ground_truth.v1"
        - experiment: 1692
        - run_date: ISO-8601 UTC
        - duration_s: actual wall time (must be > 60s for a 10k-sample run at n=128;
          if it completes in less than 60s the artifact should explain why)
        - random_seed: 171192  (DELIBERATELY DIFFERENT from experiment ID 1692 and
          DIFFERENT from the prior_experiment ID 1686/1850 to avoid TAUTOLOGY flag
          on adversarial-verify)
        - reproducibility_checksum: hashlib.sha256 of (this YAML task block + the
          Carnot + THRML library versions, e.g. `"thrml-0.1.3+carnot-{git_rev}"`)
        - model_specs: {n_spins: 128, J: "1/127 all-to-all Curie-Weiss", h: 0,
          beta_points: [1.05, 1.20, 1.50], n_samples_per_beta: 10000,
          n_warmup: 500, steps_per_sample: 5, use_checkerboard: false}
        - n_samples: 10000 per beta point
        - n_samples_justification: "10,000 samples per beta gives std(empirical_mean)
          ~ 1/sqrt(N) ~ 0.01 at the per-spin scale, which is the same order as the
          gate threshold; smaller N would put the gate inside sample-noise. n=128
          Curie-Weiss is mean-field-tractable so analytic ground truth exists,
          unlike the 2^128 fully general Ising configuration space."
        - analytic_ground_truth_mean: dict beta -> m_star (root of m = tanh(beta*m))
        - carnot_raw_mean, carnot_corrected_mean: dict beta -> mean
        - thrml_raw_mean: dict beta -> mean
        - ks_p_values: dict pair_label -> p-value (carnot_raw vs thrml_raw,
          carnot_corrected vs ground_truth_replicate_draws)
        - kl_divergences: dict pair_label -> KL value (with bin_resolution=0.01 noted)
        - acceptance_gate_passed: bool (true iff abs(carnot_corrected - ground_truth)
          < 0.01 at ALL three beta values AND ks_p(carnot_raw, thrml_raw) > 0.05)
        - acceptance_gate_criteria: literal string
        - methodology_note: "If carnot_corrected_mean matches ground_truth to 5+
          significant figures, this is NOT a TAUTOLOGY — it would mean the bias
          correction is mathematically exact for the calibration regime. Disclose
          this explicitly so adversarial-verify does not mistake it for a bug."
        - optimization_direction: "minimize_abs_bias" (bias measure should decrease
          relative to exp1686; not an INCREASE)
        - honest_verdict: MUST start with one of `complete:` / `complete_` /
          `success:` / `success_` / `passed:` / `passed_` / `shipped:` / `shipped_`
          per CLAUDE.md Verdict Terminal-Prefix Discipline.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.
      Adversarial-verify will run automatically after task completion; the
      methodology fields above are designed to pass its TAUTOLOGY,
      IMPLAUSIBLE_PERFECT, SIGN_ANOMALY, DURATION_TOO_SHORT,
      SAMPLE_SIZE_BELOW_CLAIM, GATE_PASSED_WITHOUT_DATA, and
      METHODOLOGY_MISSING checks.

  - id: exp1693-phase4-active-inference-n64
    title: "Exp 1693: Phase 4 active-inference delta_alpha at n=64 (substrate-size scaling extension)"
    deliverable: results/experiment_1693_phase4_n64.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1681-phase4-scaling-n8-16-32
        verdict: complete_no_collapse_to_n32
        addressed_by: "exp1681 swept n=8/16/32 and reported collapse_scale=None (delta_alpha > 0.05 held across the range). This extends to n=64 to check whether the Phase 4 verifier-as-free-energy hypothesis continues to hold at a substrate size 2x larger than the prior ceiling, or collapses (which would localize the substrate-size limit and inform Phase 5 design)."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: Phase 4 active-inference (CLAUDE.md committed track + 3 mandatory tasks
      per feedback_active_inference_phase4_committed.md) measures
      delta_alpha = inf_t alpha_k6 - inf_t alpha_k1 on the Carnot k=6 vs k=1 verifier
      ensemble. exp1678 baseline at n=8 reported delta_alpha=0.15 > 0.05 gate.
      exp1681 swept n=8/16/32 and confirmed no collapse_scale.

      FALSIFIABLE HYPOTHESIS: At n=64 the delta_alpha measurement either (a) stays
      above 0.05 (Phase 4 hypothesis continues to scale, no localized substrate-size
      collapse below n=64), or (b) drops below 0.05 (Phase 5 needs to budget around
      the n=64 collapse, and we have a numerical handle on it). Both outcomes are
      acceptable findings; the experiment should NOT optimize toward (a).

      EXISTING CODE TO READ FIRST:
        - results/experiment_1681_phase4_scaling.json
        - results/experiment_1678_phase4_baseline.json (n=8 baseline)
        - python/carnot/phase4/* (active inference module if exists)
        - search for `alpha_k6` and `alpha_k1` in python/

      TASK: Reproduce the exp1681 measurement protocol at n=64. Same verifier set
      (6 base verifiers vs 1 base verifier per AND-composition), same alpha_t
      definition, same number of MLD steps as exp1681 (100 steps).

      CONCRETE STEPS:
        1. Read exp1681 to extract the exact alpha_t computation (or the function
           reference). Record it in artifact as `alpha_t_method`.
        2. Initialize substrate at n=64 with the same Ising couplings family used
           in exp1681 (whatever it was — read exp1681 carefully).
        3. Run 100 MLD steps with the k=6 ensemble. Record alpha_t at each step.
        4. Run 100 MLD steps with the k=1 baseline. Record alpha_t at each step.
        5. Compute delta_alpha = inf_t alpha_k6 - inf_t alpha_k1.
        6. Acceptance: delta_alpha is REPORTED with a 30-seed bootstrap CI; the
           gate is statistical significance of delta_alpha != 0, NOT direction.
           If CI excludes 0 with sign positive, the Phase 4 hypothesis scales
           to n=64. If CI excludes 0 with sign negative, that's also a finding
           (substrate-size inversion). If CI includes 0, "not yet conclusive at
           n=64, more seeds needed."

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase4_active_inference_n64.v1"
        - experiment: 1693
        - run_date: ISO-8601 UTC
        - duration_s: actual wall time
        - random_seed: 171193 (NOT 1693 or 64 — avoid TAUTOLOGY)
        - reproducibility_checksum: sha256 of (substrate generator seed + alpha_t method
          fingerprint + scripts/research_conductor.py git_rev)
        - model_specs: {n_spins: 64, ensemble_k6: "<list of 6 verifier names from
          exp1681>", ensemble_k1: "<the single baseline verifier from exp1681>",
          mld_steps: 100, n_seeds: 30}
        - n_samples: 30 seeds * 100 MLD steps = 3000 sample steps per ensemble
        - n_samples_justification: "30 seeds gives std_err(mean_alpha_t) ~ 1/sqrt(30)
          ~ 0.18; bootstrap CI on delta_alpha needs at least 30 seeds for
          asymptotic-CI validity per Wasserman 'All of Statistics' ch.5"
        - alpha_t_method: literal description from exp1681
        - inf_t_alpha_k6: float (with 30-seed bootstrap mean)
        - inf_t_alpha_k1: float (with 30-seed bootstrap mean)
        - delta_alpha: float
        - delta_alpha_bootstrap_ci_95: [lower, upper]
        - collapse_scale_observed: bool (true iff delta_alpha CI is entirely below
          0.05 — i.e., the substrate-size scaling has now localized below n=64)
        - acceptance_gate_passed: true (this is a measurement task; no gate failure
          mode except adversarial-verify catches)
        - acceptance_gate_criteria: "Measurement reported with bootstrap CI; sign
          and magnitude are findings, not gates."
        - methodology_note: "delta_alpha values below 0.01 in absolute value on
          n=64 are interpreted with caution — possible numerical floor at this
          substrate scale; record the alpha_t variance to disambiguate."
        - optimization_direction: "neither — this is a measurement task, not an
          optimization; sign-anomaly check should NOT apply"
        - honest_verdict: MUST start with `complete:` / `complete_` / `success:` /
          `success_` / `passed:` / `passed_` / `shipped:` / `shipped_`.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1694-nla-class-16th-verifier-prototype-v3
    title: "Exp 1694: NLA-class 16th verifier prototype v3 with strict methodology"
    deliverable: results/experiment_1694_nla_v3.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1851-nla-probe
        verdict: fabricated_artifact_TPR_1.0_duration_0_4s
        addressed_by: "exp1851 fabricated TPR=1.0 in 3.4s wall time on a 30B+ GGUF model — physically impossible; flagged by adversarial-verify post-task. This v3 attempt MUST run on a model that's already cached (gemma-4-26B-A4B-it-GGUF) AND emit per-example latency + reproducibility_checksum + an end-to-end log of the actual SAE feature activations on >=30 examples; small or stale samples are explicit failure modes."
        retire_if_same_verdict: true
      - experiment_id: exp1680-polarfire-smoke-v2
        verdict: fabricated_artifact_TPR_1.0_run_duration_0
        addressed_by: "exp1680 fabricated TPR=1.0 with run_duration_s=0; the v3 prototype includes a hard duration_s floor check in artifact validation (refuse to emit acceptance_gate_passed=true if duration_s < 60s on a >=30-example evaluation with a real LLM in the loop)."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: Per CLAUDE.md operator decision 2026-05-09 and
      feedback_nla_class_16th_verifier_committed.md, Carnot grows its verifier
      ensemble from k=15 to k=16 by adding an NLA-class white-box probe. The
      4-task chain (design, prototype, eval-awareness test, ensemble integration)
      is mandatory. exp1851 fabricated the prototype evaluation; this v3 is the
      legitimate prototype.

      FALSIFIABLE HYPOTHESIS: An SAE-based feature-activation probe on
      gemma-4-26B-A4B-it-GGUF, trained on a small held-out corpus of 30
      verifier-positive vs 30 verifier-negative LLM outputs, can predict
      verifier ensemble agreement (k>=8 of 15) with TPR in [0.55, 0.85] at
      FPR <= 0.20. TPR = 1.0 is implausible on this substrate; the
      methodology_note must explicitly flag any sub-0.05 sample-noise floor
      results as suspicious.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1851_nla_probe.json (the fabricated baseline; what NOT
          to emit)
        - feedback_nla_class_16th_verifier_committed.md memory entry
        - python/carnot/verify/* (the k=15 ensemble; the NLA probe is verifier #16)
        - search for `sae` and `feature_activation` in python/ — if zero hits, this
          experiment also has to bootstrap the SAE training pipeline (use
          off-the-shelf gemma-4 SAE if HuggingFace has one; otherwise train a
          minimal SAE on a 1k-example calibration corpus before the prototype).

      TASK: Build a working NLA-class 16th verifier prototype that runs on a real
      cached gemma-4-26B-A4B-it-GGUF model and reports a measurable TPR/FPR on
      a 60-example held-out set (30 positive + 30 negative).

      CONCRETE STEPS:
        1. Verify gemma-4-26B-A4B-it-GGUF is locally cached. If not, abort with
           honest_verdict `blocked_model_not_cached` (no fabrication).
        2. Pick an SAE: use one of (a) an off-the-shelf gemma SAE if HuggingFace
           has it (search gemma + sae), or (b) train a minimal sparse-autoencoder
           on 1k calibration prompts using ReLU + L1 = 1e-4 sparsity loss.
        3. Build the labelled corpus: 30 LLM outputs where the k=15 verifier
           ensemble agrees (k>=8 positive), 30 where it disagrees (k<=4 positive).
           These are the LABELS; the SAE probe predicts ensemble agreement.
        4. Train a logistic-regression head on SAE feature activations from the
           30 positive + 30 negative training examples (50% train / 50% test).
        5. Report TPR and FPR on the 30-example held-out test set with 95% CIs
           via Wilson interval (NOT bootstrap on a 30-example set — Wilson is
           tighter at small N).

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.nla_16th_verifier_v3.v1"
        - experiment: 1694
        - run_date: ISO-8601 UTC
        - duration_s: actual wall time. MUST be > 60s. Loading and running a 26B
          GGUF model on 60 examples even at 200ms per example is >12 seconds JUST
          on inference; plus SAE forward passes and logistic regression training.
          A duration_s < 60s with acceptance_gate_passed=true is automatically a
          fabrication signal — emit blocked honest_verdict instead.
        - random_seed: 171194 (NOT 1694, NOT 16)
        - reproducibility_checksum: sha256 of (model_name + corpus_size + SAE_id +
          logistic_regression_C + sklearn_version)
        - model_specs: {target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          sae_source: "<huggingface id or 'trained_locally_1k_examples'>",
          n_train: 30, n_test: 30, total_examples: 60}
        - n_samples: 60 (full corpus)
        - n_samples_justification: "60 examples (30 pos + 30 neg) gives Wilson 95%
          CI of width approximately 0.30 on TPR at 0.7; this is a prototype, not a
          production claim — calibration corpus is small to ship the methodology."
        - tpr_observed: float
        - fpr_observed: float
        - tpr_wilson_95_ci: [lower, upper]
        - fpr_wilson_95_ci: [lower, upper]
        - per_example_inference_latency_ms_p50: float (must be > 100 ms — a 26B
          model inference faster than that on CPU is implausible; on GPU still > 30 ms;
          a value of 1ms is a fabrication signal)
        - sae_feature_count_active: int (how many SAE features were non-zero
          across the 60-example corpus)
        - acceptance_gate_passed: bool (TPR in [0.55, 0.85] AND FPR <= 0.20)
        - acceptance_gate_criteria: literal string
        - methodology_note: "TPR == 1.0 on this small held-out set is the
          adversarial-verify IMPLAUSIBLE_PERFECT trigger; if observed, the
          methodology_note must explain (overfitting on the small training set,
          label leakage, or actual ceiling — only the first two are bugs, the
          third needs replication on a larger corpus to confirm)."
        - optimization_direction: "maximize_tpr_subject_to_fpr_cap"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.
      If gemma-4-26B-A4B-it-GGUF is NOT locally cached, emit honest_verdict
      `blocked_model_not_cached_GGUF_download_needed` and exit — DO NOT
      fabricate. Adversarial-verify will catch fabricated outputs as it did
      with exp1851.

