  - id: exp2245-casal-impl
    title: "Phase 3: CASAL Primal-Dual Split Augmented Langevin Implementation"
    milestone: "2026.05.222"
    deliverable: "results/experiment_2245_casal_impl.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    prior_failures:
      - experiment_id: exp1688-casal-primal-dual-sampler
        verdict: partial
        addressed_by: "exp1688 was a partial implementation without the dual update step. This task delivers the complete primal-dual cycle (primal Langevin + dual Lagrange update) plus unit tests verifying hard constraint satisfaction (violation < 1e-4)."
      - experiment_id: exp1689-casal-vs-mcmc-scaling
        verdict: partial
        addressed_by: "exp1689 benchmarked without a complete CASAL implementation. This task first produces the working module (exp2245), then exp2246 does the comparison."
    prompt: |
      CONTEXT: CASAL (arXiv:2505.18017, Blanke et al.) enforces hard equality constraints
      during Langevin sampling via a primal-dual variational formulation. Unlike AdamFLIP
      (which enforces constraints at training time), CASAL guarantees hard constraint satisfaction
      during the sampling/inference phase. Prior exp1688 was incomplete. This task delivers
      the full primal-dual cycle.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/phase3/continuous_ebm.py
        {project_root}/python/carnot/samplers/
        {project_root}/python/carnot/training/adamflip.py
      TASK: Implement CASAL primal-dual Split Augmented Langevin sampling for Carnot.
      CONCRETE STEPS:
        1. Create python/carnot/samplers/casal.py implementing:
           - CASALSampler(constraints, step_size, dual_step_size, n_steps)
           - sample(x_init, energy_fn) -> samples satisfying equality constraints
           - Primal update: Langevin step + constraint projection
           - Dual update: Lagrange multiplier update for violated constraints
        2. Write unit test: verify hard constraint satisfaction (mean violation < 1e-4)
           on a 2D quadratic energy with one equality constraint.
        3. Set casal_impl_ready: true if unit test passes (violation < 1e-4).
        4. Write deliverable to results/experiment_2245_casal_impl.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required."
        casal_impl_ready:
          principle: "Boolean gate for exp2246 and exp2250. True only when unit test shows violation < 1e-4."
        casal_module_path:
          principle: "Records file path for downstream comparison task."
        unit_test_violation_mean:
          principle: "Must be < 1e-4 to claim hard-constraint semantics; validates primal-dual cycle."
        dual_update_converged:
          principle: "Boolean confirming dual variables converged during unit test."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2246-casal-vs-adamflip
    title: "Phase 3: CASAL vs AdamFLIP Hard Constraint Violation Comparison"
    milestone: "2026.05.222"
    deliverable: "results/experiment_2246_casal_vs_adamflip.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2245-casal-impl
        artifact_field: casal_impl_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp1689-casal-vs-mcmc-scaling
        verdict: partial
        addressed_by: "exp1689 benchmarked CASAL against MCMC without a complete CASAL module. This task compares CASAL vs AdamFLIP specifically, with 100 samples and a falsifiable gate: casal_violation_mean <= adamflip_violation_mean / 2."
    prompt: |
      CONTEXT: AdamFLIP (exp2235, .221) enforces hard constraints at training time.
      CASAL (exp2245, .222) enforces them during sampling. This task compares constraint
      violation magnitude on 100 samples from the same energy landscape.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/python/carnot/training/adamflip.py
        {project_root}/python/carnot/phase3/continuous_ebm.py
        {project_root}/scripts/experiment_template.py
      TASK: Compare CASAL vs AdamFLIP constraint violation magnitude on 100 samples.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/samplers/casal.py imports — else blocked_casal_missing.
           b. python/carnot/training/adamflip.py imports — else blocked_adamflip_missing.
        1. Define benchmark: 3D continuous EBM with two hard equality constraints.
        2. Draw 100 samples from each:
           Regime A: MCMC with AdamFLIP-trained parameters (soft-penalty post-training).
           Regime B: CASAL primal-dual sampler on the same energy.
        3. Measure:
           - casal_violation_mean / adamflip_violation_mean (both regimes, all constraints)
           - max_constraint_violation for each
           - energy_mean for each
        4. Set casal_validated: true if casal_violation_mean <= adamflip_violation_mean / 2.
        5. Write deliverable to results/experiment_2246_casal_vs_adamflip.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required. Use complete: if CASAL violation <= AdamFLIP/2."
        casal_validated:
          principle: "Boolean gate for exp2251 capstone."
        casal_violation_mean:
          principle: "Primary comparison metric; expected much lower under hard-constraint sampling."
        adamflip_violation_mean:
          principle: "Baseline for comparison; needed so the ratio is auditable."
        n_samples:
          principle: "Must be >= 100 for statistical significance on constraint violation claims."
        random_seed:
          principle: "Reproducibility: both regimes use the same seed for fair comparison."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2247-kancl-n256-scaling
    title: "Phase 4: KAN-CL Scaling to n=256 Spin Ising (COOL-Style)"
    milestone: "2026.05.222"
