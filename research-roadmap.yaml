# Carnot Research Roadmap - Milestone 2026.04.18
# "Formal Claim Verification, Process Integrity, and Predictive Self-Learning"
#
# CONTEXT: Milestone 2026.04.17 established that:
# - semantic_verifier_v2 improved observability but still did not justify verify-only on either target model
# - spec-aware code verification composes cleanly, but the paired cross-model signal is still small and only on a 30-case cohort
# - case memory plus policy compilation improved retrieval precision, not held-out task success
# - KV260 bring-up is still blocked and sampler-backed reranking stayed flat on quality
#
# This milestone rebuilds live reasoning verification around formal claims,
# adds explicit process-integrity checks, then turns self-learning from replay
# bookkeeping into proactive constraint addition and predictive verification.

milestone: "2026.04.18"
milestone_title: "Formal Claim Verification, Process Integrity, and Predictive Self-Learning"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"

tasks:
  # -- Phase 79: Rebuild Live Semantic Verification with Formal Claims --
  - id: exp244-formal-claim-corpus
    milestone: "2026.04.18"
    deliverable: data/research/formal_claim_corpus_244.jsonl
    title: "Exp 244: Formal claim-routing corpus from live reasoning traces"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: Exp 235 proved that calibrated semantic scoring alone still leaves
      verify-only harmful on both Qwen/Qwen3.5-0.8B and google/gemma-4-E4B-it.
      VERGE and the current research-program both point toward the same next
      move: typed claims routed to the narrowest deterministic checker instead of
      one scalar semantic verdict. Use {date} as the run date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - openspec/capabilities/verifiable-reasoning/spec.md
      - results/experiment_235_results.json
      - results/experiment_221_results.json
      - data/research/constraint_ir_benchmark_211.jsonl
      - data/research/semantic_failure_corpus_214.jsonl
      - python/carnot/pipeline/typed_reasoning.py
      - python/carnot/pipeline/semantic_verifier_v2.py

      TASK: Create data/research/formal_claim_corpus_244.jsonl

      CONCRETE STEPS:
      1. Create a checked-in script that converts existing live semantic and prompt-side traces into a formal-claim corpus rather than generating a synthetic benchmark from scratch.
      2. For each claim, store normalized relation type, operands or bound variables, target quantity or entity, candidate solver route, gold verdict, and provenance back to the source artifact.
      3. Include an explicit abstain or not_formalizable label for claims that cannot be safely normalized so later verifier code does not guess.
      4. Add fields for minimal-correction-subset style localization when source traces already reveal which premise or claim is broken.
      5. Write or update tests first for schema shape, deterministic generation, and provenance coverage.
      6. Write a short results artifact summarizing route counts, formalizable-vs-abstain rates, and source breakdown.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_244_formal_claim_corpus.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp245-formal-claim-verifier
    milestone: "2026.04.18"
    deliverable: python/carnot/pipeline/formal_claim_verifier.py
    title: "Exp 245: Solver-routed formal claim verifier"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: The current semantic verifier is still too heuristic. This task
      upgrades the verifier substrate itself: typed claims should be normalized
      and routed to arithmetic, comparison, cardinality, set-membership, or
      boolean-entailment checkers where possible, with abstention rather than
      brittle guesses when not formalizable. Use {date} as the run date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - openspec/capabilities/verifiable-reasoning/spec.md
      - data/research/formal_claim_corpus_244.jsonl
      - python/carnot/pipeline/typed_reasoning.py
      - python/carnot/pipeline/semantic_grounding.py
      - python/carnot/pipeline/semantic_verifier_v2.py
      - python/carnot/pipeline/verify_repair.py

      TASK: Create python/carnot/pipeline/formal_claim_verifier.py

      CONCRETE STEPS:
      1. Add or update the relevant verifiable-reasoning spec requirements before implementation if solver-routed claim verification is not already covered.
      2. Implement a typed formal-claim representation plus route selection for at least arithmetic, comparison, cardinality, set-membership, and simple boolean-entailment claims.
      3. Return structured claim-level verdicts, route metadata, and localized failure detail instead of a monolithic semantic score.
      4. Preserve an explicit abstain path for unsafe or ambiguous formalizations.
      5. Integrate the verifier additively into VerifyRepairPipeline behind a clear entry point and structured result field.
      6. Write tests first for normalization, route selection, abstention, deterministic serialization, and pipeline integration.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_formal_claim_verifier.py -q --no-cov -n0
      Do NOT push. Do NOT modify scripts/research_conductor.py.

