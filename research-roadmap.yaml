    2. Read exp1384 artifact to get baseline_auroc and consistency_regularization_effect details.
    3. Load the KAN energy tier from the same checkpoint as exp1384 (pre-training checkpoint).
    4. Implement EBM-CoT hinge-only loss: L = max(0, hinge_margin - (E_negative - E_positive)).
    5. Set consistency_regularization_weight=0.0 explicitly (no regularization term).
