  - id: exp4139-decisive-verifier-graft-sudoku
    milestone: 2026.06.383
    title: "THE DECISIVE verifier-as-reward GRAFT on the faithful/near-faithful Sudoku baseline (the LABEL de-confound never yet run faithfully). MANDATORY headroom positive-control FIRST (oracle best-of-K vs vote; oracle==vote -> NO HEADROOM -> FALSE_NEGATIVE_RISK). HEADLINE verifier-value = the NON-oracle Carnot energy/text-stat ENSEMBLE rerank (the transferable verifier) + the RFT LABEL de-confound (A=verifier-cert vs B=vote-cert, CI95 excl 0). The executable-validity rerank == oracle is reported SEPARATELY as a labeled UPPER BOUND (tautological on unique-solution Sudoku, NOT the verifier result). DEFENSIVE on exp4138: matches_087 -> full (rerank + RFT); near_faithful_080 -> RFT + ensemble-rerank; <0.80 -> defer."
    priority: high
    track: verifier-as-reward
    max_turns: 110
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-13: graft the Carnot verifier on a FAITHFUL reproducing baseline -- false-positive scope-match vs exp4109/exp4119/exp4128 (all DEFERRED or grafted on a non-faithful checkpoint); forward difference = FIRST graft on a faithful/near-faithful baseline (val from exp4138, not the 0.0232/0.106/0.278 deferrals), with the NON-oracle ensemble rerank as the transferable-verifier headline (not the tautological executable-oracle rerank) + the RFT LABEL de-confound + a mandatory oracle-vs-vote headroom positive control."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4139_decisive_verifier_graft_sudoku.json
    prompt: |
      CONTEXT: Test verifier-as-reward on a faithful/near-faithful reproducing TRM baseline. CRITICAL
      design point (from the .383 adversarial review): for unique-solution Sudoku the EXECUTABLE validity
      checker IS the oracle (a candidate passes iff it equals the unique solution), so an executable-
      verifier rerank trivially captures all headroom -- `executable_rerank_lift == oracle_vs_vote_gap`
      BY CONSTRUCTION (a TAUTOLOGY adversarial_verify.py would flag, and uninformative about the GENERAL
      energy verifier that anti-discriminated on ARC grids in exp4099 and that DiffusionGemma's guidance
      actually uses). Therefore: report the executable gap SEPARATELY as a labeled UPPER BOUND; the
      HEADLINE verifier-value is (1) the NON-oracle Carnot energy/text-stat ENSEMBLE rerank (the
      transferable verifier) and (2) the RFT LABEL de-confound (non-tautological even when the certifier
      is exact). verifier_value_added is defined on (1)+(2), NEVER the executable-oracle rerank, and it
      gates the queued DiffusionGemma scale-up.

      EXISTING CODE TO READ FIRST:
        - python/carnot/experiment_4128_carnot_verifier_graft_sudoku.py (the graft scaffold -- REUSE: candidate sampling, the executable Sudoku verifier, the A-vs-B de-confound)
        - python/carnot/experiment_4109_carnot_verifier_graft_sudoku.py (the .380 graft on a non-faithful baseline -- the honest_null this supersedes)
        - results/experiment_4138_sudoku_accumulate_pass4_convergence_check.json (matches_published_087 + near_faithful_080 + stable_checkpoint_path -- the DEFENSIVE read)
        - python/carnot/verify/ (the energy/text-stat ENSEMBLE verifiers for the NON-oracle headline rerank + the executable validity checker)

      CONCRETE STEPS:
        0. PRECONDITIONS: CUDA available; read results/experiment_4138_*.json for matches_published_087 + near_faithful_080 + stable_checkpoint_path + val_exact_accuracy. If the checkpoint is missing/unloadable -> honest_verdict `blocked_baseline_checkpoint_missing` and STOP.
        1. Sample K (e.g. 8-16) candidate solutions per held-out puzzle from the faithful TRM checkpoint.
        2. HEADROOM POSITIVE CONTROL (MANDATORY, FIRST): compute oracle pass@K (does ANY candidate pass the executable validity check = is the unique solution) vs vote pass@1. If oracle <= vote (no headroom), report `headroom_present: false` + `false_negative_risk: true` and DO NOT conclude the verifier fails -- the test is uninformative; report the baseline is too converged on its pool to test rerank and SKIP the rerank verdict (still run the RFT arm if branched).
        3. RERANK measurements (always report BOTH, clearly distinguished):
           - `executable_oracle_upper_bound`: executable-validity rerank pass@1 vs vote -- LABEL it the oracle upper bound (== oracle_vs_vote_gap by construction; set executable_verifier_is_oracle=true). NOT the verifier result.
           - `ensemble_rerank_lift_vs_vote`: the NON-oracle Carnot energy/text-stat ENSEMBLE rerank pass@1 vs vote, bootstrap CI. THIS is the transferable-verifier headline (Weaver-style weighted ensemble of the energy + text-stat verifiers, NO exact validity check in the score).
        4. BRANCH on exp4138 val for the RFT arm:
           IF matches_published_087 (val>=0.85, faithful) OR near_faithful_080 (val>=0.80):
             - RFT arm (de-confound, the LOAD-BEARING contrast): A=verifier-certified (execution-validated-correct) vs B=vote-certified corpus, N-matched, same TRM, same pool; resume-train each (bounded, FIXED schedule); held-out exact-accuracy, CI95 excl 0. This is non-tautological even though the certifier is exact -- it asks whether verifier-LABEL beats vote-LABEL as a TRAINING signal.
