- id: exp619-dsvd-symcode-hybrid
  milestone: 2026.04.47
  deliverable: results/experiment_619_dsvd_symcode.json
  title: 'Exp 619: DSVD-SymCode Hybrid — Executable Verification Replacing Hidden-State Probing (RETRO-069)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-069:\
    \ DSVD offline AUC=0.976 vs live AUC=0.158. The hidden-state probing approach\
    \ trained on synthetic data cannot generalize to live Qwen3.5-0.8B outputs.\
    \ The fundamental problem: hidden states are model-specific and distribution-sensitive.\
    \ Fix: SymCode-style executable verification (arXiv 2510.25975). Instead of probing\
    \ hidden states, use the LLM to generate executable Python from each CoT step,\
    \ then run it. Code execution is model-agnostic: eval('47+28') == 75 regardless\
    \ of how the model phrased the step. This is the interwhen (arXiv 2602.11202)\
    \ mid-generation verification architecture.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/dsvd_adapter.py (or similar) — DSVDAdapter from Exp\
    \ 587; examine the hidden-state probe architecture\n- results/experiment_604_dsvd_live_finetuning.json\
    \ — post_finetune_val_auc=0.158, architecture details of what failed\n- python/carnot/extraction/llm_extractor_v1.py\
    \ — LLMAsExtractorV1, SymCodeExtractor (Exp 616)\n- results/live_pairs_578.json\
    \ — live corpus for testing\n\nTASK: Implement SymCode-style executable verification\
    \ as DSVD replacement.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-VERIFY-122\
    \ (SymCodeVerifier: executable Python verification of CoT arithmetic steps),\
    \ REQ-VERIFY-123 (SymCodeVerifier: distribution-invariant via code execution),\
    \ SCENARIO-VERIFY-160/161/162 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Create python/carnot/pipeline/symcode_verifier.py:\n   a. CoTStep dataclass:\
    \ text (str), step_index (int), generated_code (str | None), executed_result\
    \ (float | None), stated_result (float | None), violation_detected (bool).\n \
    \  b. SymCodeVerifier class:\n      __init__(self, llm_caller: callable | None\
    \ = None):\n        self.llm_caller = llm_caller  # Qwen3.5-0.8B CPU if available\n\
    \      segment_steps(self, response: str) -> list[str]:\n        Split CoT into\
    \ steps by sentence boundaries ('. ', '\\n'). Return non-empty sentences.\n  \
    \    extract_code_for_step(self, step: str) -> str | None:\n        If llm_caller:\
    \ prompt 'Write a single-line Python expression that computes the\n        arithmetic\
    \ stated in this reasoning step. Output ONLY the expression (e.g.\
    \ \"47+28\").\n        If no arithmetic: output \"None\". Step: {step}'. Return\
    \ response stripped.\n        If llm_caller is None (CI stub): apply SymCodeExtractor\
    \ regex fallback.\n      verify_step(self, step: str) -> CoTStep:\n        code\
    \ = self.extract_code_for_step(step).\n        If code is None or code.strip()\
    \ == 'None': return CoTStep(step, 0, None, None, None, False).\n        executed\
    \ = safe_eval(code) (use same safe_eval from llm_extractor_v1.py).\n        stated\
    \ = extract_numeric_result(step) (regex for last number in step).\n        violation\
    \ = executed is not None and stated is not None and abs(executed - stated) > 1e-6.\n\
    \        return CoTStep(step, ..., code, executed, stated, violation).\n      verify_response(self,\
    \ response: str) -> list[CoTStep]:\n        return [self.verify_step(s) for s\
    \ in self.segment_steps(response)]\n      detection_score(self, response: str)\
    \ -> float:\n        steps = self.verify_response(response). Return fraction of\
    \ steps with violation_detected.\n   c. Export SymCodeVerifier, CoTStep from\
    \ carnot.pipeline.\n4. Write scripts/experiment_619_dsvd_symcode.py:\n   a. apply_env_autofix()\
    \ FIRST.\n   b. from python.carnot.pipeline.live_assertion import assert_live_or_ci_skip;\
    \ assert_live_or_ci_skip().\n   c. ExperimentTimeoutWatchdog(619, timeout_minutes=30).\n\
    \   d. ExperimentTemplate(619, 'DSVD-SymCode Hybrid Verifier',\n      'results/experiment_619_dsvd_symcode.json',\
    \ requires_gpu=False).\n   e. Load 25 incorrect + 10 correct responses from\
    \ live_pairs_578.json.\n      llm_caller = Qwen3.5-0.8B CPU if CARNOT_FORCE_LIVE=1,\
    \ else None.\n   f. Run SymCodeVerifier.verify_response() on each. detection_score()\
    \ per response.\n      Label: score > 0.0 → violation_detected. Compute:\n  \
    \    symcode_tp = sum(detection_score(r)>0 for r in incorrect) \n      symcode_fp\
    \ = sum(detection_score(r)>0 for r in correct)\n      symcode_auc = roc_auc on\
    \ 35 responses (sklearn if available, else manual AUC).\n   g. Compare vs DSVD:\
    \ dsvd_live_auc=0.158 (from Exp 604). retro_069_partial = symcode_auc > 0.158.\n\
    \   h. Build artifact: schema='carnot.dsvd_symcode.v1',\n      n_incorrect=25,\
    \ n_correct=10,\n      symcode_tp=<int>, symcode_fp=<int>,\n      symcode_recall=symcode_tp/25,\
    \ symcode_fp_rate=symcode_fp/10,\n      symcode_live_auc=<float>,\n      dsvd_baseline_live_auc=0.158,\n\
    \      retro_069_partial=(symcode_live_auc > 0.158),\n      retro_069_resolved=(symcode_live_auc\
    \ >= 0.50),\n      honest_verdict='symcode_beats_dsvd' if symcode_live_auc>0.158\
    \ else 'symcode_no_improvement'.\n   i. tmpl.assert_deliverable_written() as\
    \ FINAL LINE.\n5. Write tests/python/test_symcode_verifier.py (100% coverage\
    \ on symcode_verifier.py).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\n7. Reconcile: _bmad/architecture.md (add SymCodeVerifier as Tier 2.5b option),\
    \ ops/conductor-log.md (RETRO-069), ops/changelog.md.\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

