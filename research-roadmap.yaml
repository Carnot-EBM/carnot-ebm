- id: exp876-ice40-inertia-v2
  milestone: 2026.04.67
  deliverable: results/experiment_876_ice40_inertia_v2.json
  title: 'Exp 876: iCE40 Inertia Ising v2 — Sparse Adjacency + EMA (RETRO-INERTIA-SWEEPS-TARGET-MISSED) (CPU+FPGA)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-INERTIA-SWEEPS-TARGET-MISSED: Exp 860 achieved 2x sweep reduction
    (target: 5x). Root cause diagnosed: EMA alpha=0.5 provides insufficient inertia
    for N=8 constraint graphs. Paper's 15-25x gain (arXiv 2604.17109) is for dense
    all-to-all graphs; Carnot's constraint graphs are sparse (2-3 connections/variable).

    Two-part fix:
    1. EMA alpha sweep: test alpha in {0.25, 0.125, 0.0625} — lower alpha = more inertia
    2. Sparse adjacency storage (arXiv 2505.20250): store only non-zero J_ij pairs in BRAM
       This enables N=16 synthesis without the 12258 LC register expansion (RETRO-ICE40-N16)
       because unconnected spins share no storage. It also speeds convergence by focusing
       flip probability on connected constraints only.

    EXISTING CODE TO READ FIRST:
    - results/experiment_860_inertia_ising_benchmark.json — v1 result (2x achieved, 5x missed)
    - results/experiment_859_ice40_n8_combinational.json — N=8 baseline (134 LUTs)
    - hardware/kv260/ising_sampler_v3.v — EMA register spec from Exp 662
    - python/carnot/samplers/parallel_ising.py — ParallelIsingSampler (simulation)
    - ~/tools/oss-cad-suite/ — OSS-CAD-Suite (yosys, nextpnr-ice40)

    TASK: Implement sparse adjacency Ising sampler with EMA inertia. Synthesize on iCE40.
    Python simulation: target 5x sweep reduction vs baseline. FPGA: target LUT count ≤ 200.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_860_inertia_ising_benchmark.json. Note: alpha=0.5 gave 2x.
       Note the baseline (no inertia) sweep count for comparison.
    3. Python simulation first:
       a. Implement SparseInertiaIsingSampler in python/carnot/samplers/sparse_inertia_ising.py
          with parameters: n_spins, adjacency_list (list of (i,j,J_ij) tuples), alpha.
          For each spin i: compute h_i = sum_{j in neighbors(i)} J_ij * s_j (sparse)
          EMA update: h_ema_i = alpha * h_ema_i + (1 - alpha) * h_i
          Flip probability: p_i = 1 / (1 + exp(2 * beta * h_ema_i * s_i))
       b. Alpha sweep: test alpha in {0.5, 0.25, 0.125, 0.0625}.
          For each: run 100-trial convergence test on N=8 constraint graph.
          Measure: sweeps_to_converge (stop when energy < -3.0 or 400 steps).
          Find best_alpha where sweeps_to_converge is minimized.
       c. Compare: best_inertia_sweeps vs baseline_sweeps (no inertia from Exp 860).
          Target: sweeps_reduction >= 5.0.
    4. Verilog implementation for iCE40:
       Write hardware/kv260/ising_inertia_n8_sparse_v2.v:
       - N=8 spins, sparse adjacency (K=12 non-zero J pairs for N=8 complete graph max)
       - Per-spin h_ema register (8-bit Q8 fixed-point)
       - EMA update stage: h_ema_i <= h_ema_i * ALPHA + h_i * (1 - ALPHA) where ALPHA
         is a 8-bit fixed-point constant (e.g., 0x20 for alpha=0.125)
       - Combinational Metropolis: compute p_flip from h_ema_i, compare to LFSR random
       - Sparse adjacency: adjacency table as ROM (i, j, J_ij in 3-entry rows)
    5. Synthesize with OSS-CAD-Suite:
       cd hardware/kv260
       ~/tools/oss-cad-suite/bin/yosys -p "synth_ice40 -top ising_inertia_n8_sparse_v2 -json /tmp/ising_inertia_v2.json" ising_inertia_n8_sparse_v2.v
       ~/tools/oss-cad-suite/bin/nextpnr-ice40 --hx8k --package ct256 --json /tmp/ising_inertia_v2.json --placed-svg /tmp/ising_inertia_v2_placed.svg 2>&1
       Parse output for LUT count. Target: <= 200 LUTs.
    6. Report:
       - best_alpha: float (from sweep)
       - sweeps_reduction: float (target >= 5.0)
       - inertia_sweeps: int (with best alpha)
       - baseline_sweeps: int (from Exp 860)
       - lut_count: int (from synthesis)
       - synthesis_clean: bool
       - sparse_adjacency_luts: int (compare vs full matrix storage)
    7. honest_verdict:
       - "sweeps_5x_and_synthesis_clean" if sweeps_reduction>=5 AND lut_count<=200
       - "sweeps_5x_synthesis_over_budget" if sweeps_reduction>=5 AND lut_count>200
       - "sweeps_improved_below_5x" if sweeps_reduction in [3, 5)
       - "synthesis_blocked" if OSS-CAD tools not found
       - "no_improvement" if sweeps_reduction < 3
    8. Add spec entries: REQ-HW-035 (sparse adjacency Ising synthesis),
       SCENARIO-HW-035.
    9. Build artifact and write results/experiment_876_ice40_inertia_v2.json.
    10. Write tests with 100% coverage. Test SparseInertiaIsingSampler convergence.
        Test alpha sweep function. Mock synthesis for unit tests.
        Traces to REQ-HW-035, SCENARIO-HW-035.
    11. Reconcile: ops/changelog.md, ops/status.md, research-hardware-wishlist.md
        (update KV260 synthesis status with sparse adjacency result).
    12. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_876_ice40_inertia_v2.py -v
