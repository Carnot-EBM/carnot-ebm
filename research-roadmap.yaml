  title: "Paper v5 Integrity — High-Severity ISSUE-6 to ISSUE-10"
  agent_type: claude
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 30
  priority: high
  requires_gpu: false
  prompt: |
    CONTEXT:
    Following exp1180's resolution of the 5 critical issues, this experiment addresses
    the 5 high-severity issues (ISSUE-6 through ISSUE-10) from paper-v5-integrity-remediation.md.
