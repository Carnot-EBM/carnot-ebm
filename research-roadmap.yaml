  - id: exp2262-adversarial-null-space-probe
    title: "Phase 4: Adversarial Null-Space Probe on k=16 Ensemble + FST Stack"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2262_adversarial_probe.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    prior_failures:
      - experiment_id: exp1500-orthogonality-matrix-verifier
        verdict: complete
        addressed_by: "exp1500 measured the joint null-space of the k=6 ensemble. This task probes the k=16 ensemble + FST stack against adversarial inputs — a different evaluation (attack simulation vs static null-space measurement) on a different stack version."
    prompt: |
      CONTEXT: Per Phase 3 defence-layer theory (CLAUDE.md) and Q11 TSS analysis, the k=16
      verifier ensemble + FST fast-weight stack must be adversarially probed. The adversarial
      threat: craft inputs that score LOW energy on ANY single verifier but HIGH energy on the
      ensemble. If the ensemble's joint null-space is exploitable, these inputs fool the system.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/verify/
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/scripts/experiment_template.py
      TASK: Probe the k=16 ensemble against null-space mimicry attacks.
      CONCRETE STEPS:
        1. Define 200 adversarial inputs: for each, craft a version that minimizes energy
           for Verifier 1 (Boolean E) while maximizing energy for Verifier 2 (Z3-based).
           Use gradient-based perturbation in the input token space.
        2. Score each adversarial input on all k=16 verifiers.
        3. Measure:
           - single_verifier_fooled_rate: fraction that fool at least 1 verifier individually
           - ensemble_fooled_rate: fraction that fool ALL k=16 verifiers simultaneously
           - fst_robustness_improvement: ensemble_fooled_rate with FST fast-weight active
             vs without (FST context should capture recent verifier disagreements)
        4. Set adversarial_probe_passed: true if ensemble_fooled_rate < 0.05.
        5. Write deliverable to results/experiment_2262_adversarial_probe.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required. complete: if probe ran to completion."
        adversarial_probe_passed:
          principle: "Boolean. True only when ensemble_fooled_rate < 5% — validates the AND-composition security property."
        ensemble_fooled_rate:
          principle: "Primary defence gate: must be < 0.05 for the k=16 AND-composition claim to hold."
        single_verifier_fooled_rate:
          principle: "Baseline: expected to be high (single verifier is fooled easily). Contrast with ensemble rate."
        fst_robustness_improvement:
          principle: "Measures FST's contribution to robustness; positive value = FST context reduces attack success."
        n_adversarial_inputs:
          principle: "Must be >= 200 for statistical significance on 5% rate claims."
        random_seed:
          principle: "Reproducibility for adversarial input generation."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

