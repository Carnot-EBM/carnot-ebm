- id: exp1231-llms-gaming-verifiers-defense
  milestone: 2026.04.96
  deliverable: results/experiment_1231_llms_gaming_verifiers_defense.json
  title: "LLMs Gaming Verifiers Defense — k=5 AND-Compose vs Single-Verifier RLVR Gaming"
  agent_type: claude
  model: opus
  max_turns: 80
  estimated_wall_time_min: 50
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1225-llms-gaming-verifiers-defense
      verdict: in_progress
      addressed_by: "exp1225 hit max_turns:40 with codex 3x — codex is insufficient for this reasoning-intensive experiment. This retry uses claude/opus max_turns:80 with STEP 0 skeleton and skip_pre_test:true."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    arXiv 2604.15149 (LLMs Gaming Verifiers: RLVR can Lead to Reward Hacking) demonstrates
    that models trained with single-verifier RLVR systematically learn to exploit the verifier
    by finding inputs that score high without satisfying the intended semantics. The paper
    uses a rule-induction task where models output text patterns that satisfy the verifier
    without actually inducing the rules.

    Carnot's Phase-3 null-space mimicry attack analysis predicted this exact failure mode.
    Carnot's k=5 AND-composed verifier ensemble is the proposed defense. This experiment
    verifies whether the k=5 ensemble resists the gaming pattern from arXiv 2604.15149.

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write this to results/experiment_1231_llms_gaming_verifiers_defense.json NOW:
    {{
      "experiment": "1231_llms_gaming_verifiers_defense",
      "status": "in_progress",
      "gaming_defense_measured": false,
      "honest_verdict": "in_progress"
    }}

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/pipeline.py (VerifyRepairPipeline, verifier ensemble)
    - python/carnot/models/ising.py (Ising energy formulation)
    - python/carnot/verify/and_composition.py (k=5 AND-compose implementation)
    - results/experiment_1121_and_composition_k5_production.json (k=5 AUROC=0.5547 then fixed)
    - results/experiment_1128_soskan_k5_fix.json (SOSKANEnergyV3 normalization fix, k=5 AUROC=0.9402)

    TASK:
    1. Write skeleton artifact (STEP 0 above).

    2. IMPLEMENT GAMING SIMULATION from arXiv 2604.15149 pattern:
       a. Define a SIMPLE RULE-INDUCTION TASK:
          - 20 examples, each with (context, correct_label) pairs
          - Target: model must output "RULE: if X then Y" text
          - Single verifier: check if output contains "RULE:" prefix (naive semantic check)
       b. BASELINE (single verifier RLVR):
          - Generate N=100 candidate responses with a simple LM (random policy or template)
          - Score each with single-verifier: 1 if "RULE:" in output else 0
          - Measure gaming rate: fraction of high-scoring responses that DON'T actually
            induce a valid rule (just contain the "RULE:" prefix without real content)
       c. CARNOT DEFENSE (k=5 AND-compose):
          - Score same N=100 candidates with k=5 AND-composed ensemble:
            V1: contains "RULE:" (simple pattern)
            V2: rule body has "if" and "then" keywords (structural)
            V3: rule generalizes to a held-out test set (semantic)
            V4: rule doesn't just memorize training examples (novelty)
            V5: rule predicts correct label on 3 random test cases (accuracy)
          - Measure gaming rate under k=5 AND-compose
       d. COMPARE: single-verifier gaming rate vs k=5 gaming rate
          - If k=5 gaming_rate < 0.2 * single_gaming_rate → defense effective
          - If k=5 gaming_rate >= 0.5 * single_gaming_rate → defense insufficient (revision needed)

    3. Also check: does Carnot's actual k=5 production ensemble (Z3, AST, Semantic, ThinkPRM,
       SOS-KAN) show evidence of gaming on the FoVer corpus?
       - Load results/experiment_1128_soskan_k5_fix.json
       - Compute: fraction of k=5 PASS outputs that Z3MathVerifier labels INCORRECT
       - This is the "gaming detection rate" on production data

    4. Write analysis and recommendations:
       - If single-verifier gaming rate > 0.5 and k=5 gaming rate < 0.2: defense confirmed
       - If both remain high: propose additional verifier or ensemble rotation

    CONCRETE STEPS:
    - python3 -c "import json; d={{'experiment':'1231_llms_gaming_verifiers_defense','status':'in_progress','gaming_defense_measured':False,'honest_verdict':'in_progress'}}; open('results/experiment_1231_llms_gaming_verifiers_defense.json','w').write(json.dumps(d,indent=2))" 2>&1
    - python3 -c "import json; d=json.load(open('results/experiment_1128_soskan_k5_fix.json')); print([(k,v) for k,v in d.items() if 'auroc' in k.lower() or 'gaming' in k.lower()])" 2>&1
    - [Implement gaming simulation with single-verifier and k=5 ensemble]
    - [Measure gaming rates, compare, analyze]
    - [Update artifact with results]

    REQUIRED ARTIFACT FIELDS:
    - single_verifier_gaming_rate: float (fraction gaming the single verifier)
    - k5_ensemble_gaming_rate: float (fraction gaming the k=5 ensemble)
    - gaming_reduction_ratio: float (single_rate / k5_rate)
    - defense_effective: bool (k5_rate < 0.2 * single_rate)
    - production_gaming_detection_rate: float (from FoVer corpus analysis)
    - gaming_defense_measured: bool (true)
    - honest_verdict: "defense_effective" | "defense_partial" | "defense_insufficient" | "blocked"

    Run: python3 -c "import json; d=json.load(open('results/experiment_1231_llms_gaming_verifiers_defense.json')); print('gaming_defense_measured:', d.get('gaming_defense_measured'), '| defense_effective:', d.get('defense_effective'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

