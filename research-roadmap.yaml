- id: exp1110-rlvr-ssd-v2-nondegenerate-live-gpu
  milestone: 2026.04.86
  deliverable: results/experiment_1110_rlvr_ssd_v2_nondegenerate_live_gpu.json
  title: "RLVR+SSD v2 — Non-Degenerate Energy Corpus with SOTA Live GPU Inference (DualGPU MANDATORY)"
  model: opus
  max_turns: 55
