    CONTEXT: Exp 911 achieved tier0i_marginal (AUC below 0.65 threshold) because it used a
    single LogisticRegression trained on concatenated multi-layer drift features. arXiv 2604.13386
    shows multi-layer probe ENSEMBLING (separate probe per layer, learned weighting) outperforms
    single-probe approaches by 3-8% AUROC. The fix: train N separate probes (one per layer pair),
    learn ensemble weights α via held-out accuracy, then α-weighted sum is the final score.

    IMPORTANT: retire_if_same_verdict=false. Root cause identified (single-probe vs ensemble)
    and the fix directly addresses it (separate probe per layer + learned weighting).

    EXISTING CODE TO READ FIRST:
