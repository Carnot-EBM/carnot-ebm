        arc_pool_grown:
          principle: "BARE bool: A2's gate compares this raw value (gated-fields-must-be-bare); true iff positive_candidate_n AND wrong_majority_n both meaningfully exceed the .392 baseline (20 / 5-9)."
        positive_candidate_n:
          principle: "BARE int: count of minority-correct candidates in the grown pool -- the data-sparsity metric; must exceed .392's 20 for the set-encoder to learn wrong-majority recovery."
        wrong_majority_n:
          principle: "BARE int: count of tasks where oracle@K > vote@1 (correct answer present but loses the vote) -- the recoverable headroom the aggregator targets; target >=40 held-out."
        held_out_task_n:
          principle: "BARE int: tasks reserved for the A3 gate's held-out split -- target >=40 (CLT floor) so the A3 win/null is not under-powered like .392's n=52-at-sparsity."
        pool_artifact_path:
          principle: "The persisted grown labeled-pool artifact A2 loads (per-task candidate sets + is_correct + features); the build deliverable."
        verifier_is_oracle:
          principle: "BARE bool=false -- the labels come from gold/induced pred_grid match used as the TRAINING target; the eventual aggregator scores WITHOUT executing demos at inference (Circularity Discipline)."
        random_seed:
          principle: "Determinism precondition; the pool assembly + any solver top-up + fold reservation seeded so the pool is reproducible."
        reproducibility_checksum:
          principle: "Hash of the assembled pool; catches silent candidate/label drift before A2 trains."
        model_specs:
          principle: "The cached-assembly description + any bounded solver top-up config; required methodology."
      ACCEPTANCE GATE:
        - condition: "arc_pool_grown reported with positive_candidate_n + wrong_majority_n + held_out_task_n + pool_artifact_path AND verifier_is_oracle=false, OR an honest blocked_arc_gap4_pools_missing / ceiling-below-target verdict"
          principle: "A2 needs a positive-richer ARC pool than .392's 20-positive set; growing minority-correct evidence is the precondition for the set-encoder to learn the wrong-majority recovery vote cannot do."

      Run: `python3 {project_root}/results/experiment_4243_arc_candidate_pool_grow.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

