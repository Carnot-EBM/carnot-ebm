  - id: exp4337-leak-robust-partial-state-scorer-build
    milestone: 2026.06.401
    title: "PHASE A1 (HEADLINE; SETTLE the in-generation moat) -- BUILD a DiNa-LRM-style LEAK-ROBUST partial-state reward scorer (arXiv:2602.11146 VERIFIED). .400 (exp4325) found the .399 in-generation moat did NOT replicate because the exp4292 partial-state scorer LEAKED on a 2nd corpus (scorer_leak_recheck_passed=false): it recovered answer-bearing cells from position cues rather than genuinely scoring the masked denoising state. ROOT-CAUSE FIX (DiNa-LRM, 2602.11146 'Beyond VLM-Based Rewards: Diffusion-Native Latent Reward Modeling'): a timestep-conditioned reward head trained DIRECTLY on noisy/masked DiffusionGemma canvases (noise-calibrated uncertainty, inference-time noise ensembling), NOT a post-hoc scorer that peeks at clean cells. HARD GATE: the scorer must stay ORACLE-DISTINCT UNDER ANSWER-CELL MASKING on >=2 oracle-distinct corpora -- with the answer cells masked, the reward signal must NOT recover the answer (collapses to chance on the masked-answer probe) AND must still rank partial states by genuine process quality. Emit scorer_leak_audit_passed BARE bool := (the scorer SURVIVES the masked-answer leak audit on BOTH corpora: no answer recovery + non-degenerate process ranking). Deliverable: the persisted scorer module + the leak-audit artifact. verifier_is_oracle=false. If NO leak-robust scorer can be built (it always leaks or always degenerates) -> scorer_leak_audit_passed=false + honest_verdict complete_no_leak_robust_partial_state_scorer (decision-grade: the partial-state-scoring direction is not viable, retire). NO TRM training; DiffusionGemma via the llama.cpp PR binary."
    priority: critical
    track: diffusiongemma-headline
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4337_leak_robust_partial_state_scorer_build.json
    prior_failures:
      - experiment_id: exp4292-diffusiongemma-partial-state-scorer
        verdict: complete_partial_state_scorer_auroc_0.966_yellow_flag_masked_states
        addressed_by: "exp4292 built a partial-state scorer at AUROC 0.966 that PASSED the corpus-1 leak re-check (exp4315) but FAILED it on a 2nd corpus (exp4325 scorer_leaky_on_second_corpus) -- the corpus-1 audit was too weak. This attempt REBUILDS the scorer leak-robust by construction (DiNa-LRM 2602.11146: a timestep-conditioned reward head on noisy/masked states, not a post-hoc clean-state scorer) and validates it under ANSWER-CELL MASKING on >=2 corpora before any reuse. Different technique (diffusion-native noisy-state reward head) + a stronger, cross-corpus leak gate."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: north-star §1 + §5 -- the in-generation moat is the project's headline-candidate oracle-distinct win, but
      .400 (exp4325) showed the exp4292 partial-state scorer LEAKS on a 2nd corpus. The diagnosed root cause is that the
      scorer recovers answer cells from position cues. The fix (DiNa-LRM, arXiv:2602.11146) is a timestep-conditioned
      reward head trained directly on noisy/masked diffusion states. This task BUILDS that scorer and PROVES it is
      leak-robust (oracle-distinct under answer-cell masking) on >=2 corpora -- the precondition for any moat replication.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4292_partial_state_diffusion_scorer_build.json + the persisted exp4292 scorer module (the LEAKY scorer to replace; reuse its data-loading + canvas wiring)
        - results/experiment_4325_in_generation_moat_replicate_second_corpus.json (the leak FINDING: how the masked-answer re-check was run on corpus-2)
        - scripts/exp_diffusiongemma_energy_prior_extract.py + results/diffusiongemma_energy_prior_extracted.json (the PR-binary call: llama-diffusion-gemma-eval <gguf> <prompt_ids.i32> <canvas_ids.i32> <out_logits.bin>; canvas=256 mask tokens id=4; vocab 262144)
        - research-references.md (.401 sweep: DiNa-LRM 2602.11146 -- timestep-conditioned reward head, noise-calibrated uncertainty, inference-time noise ensembling)
        - scripts/experiment_template.py, scripts/adversarial_verify.py, scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Pre-Launch Preconditions", "Inference-Substrate Declaration", "GGUF tokenizer rule", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: build a DiNa-LRM-style leak-robust partial-state reward scorer; prove it oracle-distinct under answer-cell masking on >=2 corpora.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any inference):
           a. PR binary: `ls ~/.cache/llama.cpp-master/build/bin/llama-diffusion-gemma-eval` non-empty.
           b. DiffusionGemma GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--diffusiongemma-26B-A4B-it-GGUF/` non-empty. 1x RTX 3090 fits the Q4_K_M (16GB).
           c. >=2 oracle-distinct reasoning corpora available (the corpus-1 from exp4315 + the corpus-2 from exp4325). If <2 corpora -> honest_verdict `blocked_second_corpus_unavailable` and STOP.
           d. The conductor is stood-down on TRM training; this task does NO TRM training and does NOT touch results/trm_runs/.
           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate inference.
        1. WINDOW DISCIPLINE: synchronous, checkpoint after every training/eval phase, print per-phase progress (codex idle-timeout fix).
        2. Generate noisy/masked DiffusionGemma canvases (the PR binary) for BOTH corpora; train a timestep-conditioned
           reward head on the NOISY/MASKED states (DiNa-LRM: condition on the denoising timestep; noise-calibrated
           uncertainty). Do NOT let the head see clean answer cells at train time.
        3. LEAK AUDIT (the HARD gate) on BOTH corpora: (a) MASKED-ANSWER probe -- with the answer-bearing cells masked,
           the reward signal must NOT recover the correct answer (AUROC of answer-recovery ~ chance); (b) PROCESS-RANKING
           probe -- the reward must still rank partial states by genuine process quality (non-degenerate, not a constant).
           Emit scorer_leak_audit_passed BARE bool := PASS on BOTH probes on BOTH corpora.
        4. Persist the scorer module (so exp4338 reuses it). Run adversarial_verify.py (clean; verifier_is_oracle=false).
           Declare random_seed + reproducibility_checksum + model_specs (GGUF + PR binary + the reward-head architecture +
           the timestep conditioning + the 2 corpora + n + seeds). Plausible duration (live 26B canvas generation + training).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A leak-robust scorer BUILT (scorer_leak_audit_passed=true on >=2 corpora -- unblocks exp4338) and a complete_no_leak_robust_partial_state_scorer (the direction is not viable, retire) are BOTH decision-grade."
        scorer_leak_audit_passed:
          principle: "BARE bool: exp4338 is gated on this; true iff the scorer SURVIVES the answer-cell-masked leak audit on BOTH corpora (no answer recovery AND non-degenerate process ranking) -- the diagnosed fix for exp4325's leak."
        masked_answer_recovery_auroc:
          principle: "BARE float (per corpus, report the max): AUROC of recovering the answer from the MASKED canvas -- must be ~0.5 (chance); a high value means the scorer still leaks."
        process_ranking_auroc:
          principle: "BARE float (per corpus, report the min): AUROC of ranking partial states by genuine process quality -- must be non-degenerate (>0.5) so the scorer is a real reward, not a constant."
        scorer_module_path:
          principle: "Path to the persisted leak-robust scorer module -- the deliverable exp4338 reuses."
        verifier_is_oracle:
          principle: "BARE bool=false -- the learned reward head is oracle-distinct (NOT the executable oracle)."
        preconditions_checked:
          principle: "Records the PR-binary + GGUF cache + >=2-corpora + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the canvas generation + reward-head training + leak audit."
        reproducibility_checksum:
          principle: "Hash of the 2 corpora + the reward-head config + PR-binary inputs; lets a third party re-run."
        model_specs:
          principle: "DiffusionGemma GGUF + PR binary + the reward-head architecture + the timestep conditioning + the 2 corpora + n + seeds; required methodology."
      ACCEPTANCE GATE:
        - condition: "scorer_leak_audit_passed + masked_answer_recovery_auroc + process_ranking_auroc + scorer_module_path reported with verifier_is_oracle=false and preconditions_checked, OR an honest blocked_second_corpus_unavailable / complete_no_leak_robust_partial_state_scorer verdict"
          principle: "A leak-robust partial-state scorer (oracle-distinct under answer-cell masking on >=2 corpora) is the diagnosed precondition for replicating the in-generation moat; if no such scorer can be built, the partial-state-scoring direction is not viable -- a decision-grade negative, not a doomed rerun."

      Run: `python3 {project_root}/results/experiment_4337_leak_robust_partial_state_scorer_build.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

