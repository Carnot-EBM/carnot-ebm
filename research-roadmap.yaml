  prompt: "CONTEXT: Three verifiers were implemented in .243/.244 milestones:\n  Tier 0r (Curry-Howard, exp2520): synthetic AUROC=0.8256 on proof-path features\n  Tier 0s (HalluGuard NTK, exp2522): synthetic AUROC=1.0 — suspicious (fit-to-corpus)\n  Tier 0u (Logical Consistency, exp2535): synthetic AUROC=0.96 — suspicious (fit-to-corpus)\n\nNone are paper-citable until validated on a REAL corpus (not generated by the same heuristic that scores them).\n\nREAL CORPUS SOURCES (in priority order):\n  1. FoVer corpus: {project_root}/data/ or results/experiment_*fover* (look for labeled pairs)\n  2. Telemetry results: results/experiment_*telemetry* or results/experiment_*manifest*\n  3. HalluEval subset: if huggingface_hub is available, load a small subset of HalluEval\n  4. Synthetic fallback: 100 examples with DIVERSE patterns (not tuned to the heuristic)\n\nMINIMUM REAL CORPUS: n >= 50 examples with ground-truth labels (hallucination=1, grounded=0).\n\nEXISTING CODE TO READ FIRST:\n  python3 -c \"from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('ok')\"\n  python3 -c \"from carnot.verify.semantic_energy import IsingVerifier; print('ok')\"\n  grep -r 'Tier0uVerifier' {project_root}/python/ --include='*.py' -l\n  grep -r 'Tier0sVerifier\\|NTKVerifier\\|hallu_guard' {project_root}/python/ --include='*.py' -l\n  ls {project_root}/data/ 2>/dev/null | head -10\n  ls {project_root}/results/*fover* 2>/dev/null | head -5\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Verify at least one verifier imports:\n        python3 -c \"from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('0r ok')\"\n        python3 -c \"exec(open('{project_root}/python/carnot/verify/tier0u_logical_consistency.py').read()); print('0u ok')\"\n        Record which verifiers import successfully.\n     b. Find real corpus:\n        python3 -c \"import glob, json; files=glob.glob('results/*fover*.json')+glob.glob('data/*.json'); print(files[:3])\"\n        Record n_real_examples found.\n  1. For each importable verifier (Tier 0r, 0s, 0u):\n     a. Score all real-corpus examples.\n     b. Compute AUROC vs ground-truth labels.\n     c. Note whether AUROC is higher or lower than the synthetic claim.\n  2. If n_real < 50: supplement with diverse synthetic examples (vary sentence structure;\n     do NOT generate examples tuned to the specific heuristic being evaluated).\n  3. Produce per-verifier AUROC dict:\n     tier0r_real_auroc, tier0s_real_auroc, tier0u_real_auroc\n  4. Set paper_citable_flag per verifier: True if n_real >= 50 AND AUROC measured on real corpus.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - tier0r_real_auroc:\n      principle: \"AUROC on real corpus — paper-citable only if corpus_type='real' AND n_real>=50.\"\n  - tier0s_real_auroc:\n      principle: \"AUROC on real corpus — prev synthetic 1.0 was suspicious; honest real-corpus value expected lower.\"\n  - tier0u_real_auroc:\n      principle: \"AUROC on real corpus — prev synthetic 0.96 was fit-to-corpus; honest real value expected lower.\"\n  - corpus_type:\n      principle: \"'real' or 'diverse_synthetic' — distinguishes paper-citable from non-citable.\"\n  - n_real:\n      principle: \"Sample size for AUROC claims — must be >= 50 for paper-citable result.\"\n  - paper_citable:\n      principle: \"Dict of {{tier0r, tier0s, tier0u}} -> bool. True only if n_real>=50 AND corpus_type='real'.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"corpus_type IS NOT NULL AND n_real >= 30\"\n    principle: \"Either real corpus validation (n>=50, paper-citable) or diverse synthetic (n>=30, honest baseline for .246 improvement). Some evaluation completed is better than none.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2549-tier0v-hallufield-prototype
  title: 'Phase 3b: Tier 0v HalluField Prototype (arXiv:2509.10753, field-theoretic hallucination energy)'
  milestone: 2026.05.245
  deliverable: results/experiment_2549_tier0v_hallufield.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  prior_failures:
  - experiment_id: exp2535-tier0u-logical-consistency-verifier
    verdict: 'complete: tier0u_auroc=0.96 on synthetic corpus (different verifier scope — Logical Consistency, not HalluField)'
    addressed_by: "exp2535 was Tier 0u (Logical Consistency, arXiv:2605.03971). Tier 0v (this task) is structurally different: it uses arXiv:2509.10753 HalluField field-theoretic energy/entropy landscape analysis as its theoretical foundation. Different theoretical grounding, different implementation, different group placement. This is a new verifier prototype, not a rerun of exp2535."
    retire_if_same_verdict: false
  prompt: "CONTEXT: New verifier from .245 planning sweep: arXiv:2509.10753 'HalluField: Detecting LLM Hallucinations via Field-Theoretic Modeling'. Uses parametrized variational principles and thermodynamic energy/entropy landscape analysis — achieves hallucination detection competitive with external-knowledge-based methods without needing external DBs.\n\nFor Carnot: Tier 0v computes a field-theoretic energy score: given a response, measure the ratio of high-uncertainty tokens (tokens with high logprob variance across top-k predictions) to total tokens. High uncertainty = high field energy = likely hallucination.\n\nPractical approximation (no live LLM inference needed):\n  - Use token-length as a proxy for response complexity\n  - Count hedge words ('perhaps', 'might', 'could be', 'I think', 'approximately', 'roughly')\n  - Count explicit uncertainty markers ('not sure', 'may be', 'unclear')\n  - Count factual hedges ('according to', 'I believe', 'as far as I know')\n  Energy = weighted hedge_count / (response_length + 1) clamped to [0, 1]\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/tier0r_curry_howard.py (Tier0rVerifier interface to follow)\n  {project_root}/python/carnot/verify/tier0u_logical_consistency.py (Tier0uVerifier for pattern)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. python3 -c \"from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('ok')\"\n        If fails: write honest_verdict 'blocked_carnot_import_failed' and exit.\n  1. Implement Tier0vVerifier in python/carnot/verify/tier0v_hallufield.py:\n     class Tier0vVerifier:\n         HEDGE_WORDS = ['perhaps', 'might', 'could be', 'i think', 'approximately',\n                        'roughly', 'not sure', 'may be', 'unclear', 'according to',\n                        'i believe', 'as far as i know', 'possibly', 'probably',\n                        'seemingly', 'apparently', 'allegedly']\n         def score(self, response: str) -> float:\n             'Returns field-theoretic energy in [0,1]; 1=high uncertainty=likely hallucination.'\n             text_lower = response.lower()\n             hedge_count = sum(text_lower.count(w) for w in self.HEDGE_WORDS)\n             n_tokens = max(len(response.split()), 1)\n             return min(1.0, hedge_count * 3.0 / n_tokens)\n  2. Write unit tests: high-hedge response > low-hedge response.\n  3. Evaluate on real or diverse synthetic corpus (n>=50).\n  4. Compute tier0v_auroc.\n  5. Set tier0v_viable = (tier0v_auroc > 0.60).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - tier0v_auroc:\n      principle: \"Primary viability metric. > 0.60 threshold for ensemble candidacy.\"\n  - tier0v_viable:\n      principle: \"Explicit viability flag for future ensemble integration.\"\n  - corpus_type:\n      principle: \"'real' or 'diverse_synthetic' — distinguishes paper-citable from non-citable.\"\n  - n_eval:\n      principle: \"Sample size for AUROC claim — must be >= 50.\"\n  - methodology_note:\n      principle: \"Documents hedge-word list used and weighting — required for paper-v6 methodology disclosure.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"tier0v_viable == true OR tier0v_implementation_complete == true\"\n    principle: \"Either a viable verifier (AUROC > 0.60) or implemented and tested (documents approach). Either advances the ensemble expansion track.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2550-jepa-real-corpus-evaluation
  title: 'Phase 4a: JEPA Fast-Path Real-Corpus Evaluation (fix fast_path_rate=1.0 on synthetic — continuous self-learning)'
  milestone: 2026.05.245
  deliverable: results/experiment_2550_jepa_real_eval.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  continuous_self_learning_task: true
  prior_failures:
  - experiment_id: exp2539-fr11-tier3-jepa-pipeline-integration
    verdict: 'complete: jepa_pipeline_integrated=True; fast_path_rate=1.0 on synthetic (feature-vector proxy too coarse)'
    addressed_by: "exp2539 integrated the JEPA fast-path into VerifyRepairPipeline but fast_path_rate=1.0 on synthetic corpus — the feature-vector proxy (response_length + logprob_variance) scores every response as 'low violation probability' below the 0.2 threshold. This task evaluates the fast-path discriminator on a REAL corpus with actual logprob_variance signals from accumulated FoVer or telemetry data. If fast_path_rate is still >= 0.95 on real text, the threshold is tightened. This is NOT a rerun of exp2539's pipeline integration task."
    retire_if_same_verdict: false
  prompt: "CONTEXT: exp2539 integrated the JEPA fast-path predictor into VerifyRepairPipeline but found fast_path_rate=1.0 on the synthetic test corpus — the feature-vector proxy (response_length, logprob_variance features) scored everything below the 0.2 threshold, so the full Ising verifier was NEVER invoked. This defeats the purpose of the fast-path (it should skip only truly safe responses).\n\nARCHITECTURE: JEPAFastPathPredictor in python/carnot/pipeline/jepa_fast_path.py. The issue is that the synthetic corpus had responses with very similar logprob_variance features. We need to evaluate against responses that include both:\n  - SAFE responses (simple correct arithmetic, clear factual statements) → should trigger fast-path\n  - UNSAFE responses (ambiguous, hedged, internally inconsistent) → should NOT trigger fast-path\n\nTARGET fast_path_rate: between 0.30 and 0.80 on a balanced corpus.\n\nEXISTING CODE TO READ FIRST:\n  grep -r 'JEPAFastPath\\|jepa_fast_path\\|fast_path' {project_root}/python/ --include='*.py' -l\n  {project_root}/python/carnot/pipeline/jepa_fast_path.py (the fast-path predictor)\n  {project_root}/results/experiment_2539_fr11_jepa_pipeline.json (baseline: fast_path_rate=1.0)\n  Look for FoVer data: ls {project_root}/data/ 2>/dev/null | head -10\n  Look for telemetry: ls {project_root}/results/*telemetry*.json 2>/dev/null | head -3\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Verify JEPA fast-path exists:\n        python3 -c \"from carnot.pipeline.jepa_fast_path import JEPAFastPathPredictor; print('ok')\" 2>/dev/null || \\\n           grep -r 'JEPAFastPath' {project_root}/python/ --include='*.py' | head -3\n        If not found: write honest_verdict 'blocked_jepa_fast_path_not_found' and exit.\n  1. Construct balanced evaluation corpus (n=100):\n     - 50 'safe' responses: short (< 50 words), no hedge words, simple arithmetic or definitions\n     - 50 'unsafe' responses: hedged language, contradictory statements, uncertain phrasing\n     Label each: safe=0 (should fast-path), unsafe=1 (should NOT fast-path).\n  2. Score each response through JEPAFastPathPredictor.predict(response).\n  3. Compute fast_path_rate = fraction that triggered fast-path (predict() < threshold).\n  4. If fast_path_rate >= 0.95 (threshold too permissive):\n     Tune threshold: try 0.1, 0.15, 0.25, 0.3. Find threshold where fast_path_rate in [0.30, 0.80].\n     Update the threshold in jepa_fast_path.py.\n  5. Compute precision of fast-path on safe subset:\n     fast_path_precision = (safe responses that triggered fast-path) / (all fast-path triggers).\n     Target: fast_path_precision >= 0.80.\n  6. Report jepa_discrimination_achieved = (fast_path_rate in [0.30, 0.80] AND fast_path_precision >= 0.80).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - fast_path_rate:\n      principle: \"Fraction of real corpus triggering fast-path. 1.0 = no discrimination; target 0.30-0.80.\"\n  - fast_path_precision:\n      principle: \"Fraction of fast-path triggers that are genuinely safe. Guards against aggressive fast-pathing that skips needed verification.\"\n  - jepa_discrimination_achieved:\n      principle: \"True if fast_path_rate in [0.30,0.80] AND fast_path_precision >= 0.80. Continuous self-learning milestone deliverable.\"\n  - threshold_used:\n      principle: \"The p_violation threshold applied. Documents any tuning from exp2539's 0.2 default.\"\n  - n_corpus:\n      principle: \"Corpus size — must be >= 50 for meaningful discrimination measurement.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"jepa_discrimination_achieved == true OR fast_path_rate < 0.95\"\n    principle: \"Continuous self-learning mandate: JEPA fast-path must provide meaningful discrimination. Rate < 0.95 shows some improvement from synthetic baseline even if target range not fully met.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

