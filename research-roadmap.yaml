    \ improvement (isolation_improvement=-0.1172). Root cause: the LLM-surprise\
    \ signal (NLL of sequences) doesn't correlate with EBM energy magnitude —\
    \ LLM 'surprise' and 'high constraint energy' are different concepts. The\
    \ retro .37 recommendation: 'Replace LLM-surprise replay priority with EBM\
    \ energy magnitude priority: rank constraint violations by |energy(x)|\
    \ and replay top-k highest-energy samples. High-energy violations are domain\
    \ boundary cases the model most needs to learn from.' CPU-only experiment.\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/ppsebm.py (or related)\
    \ — PPSConstraintLearner, PPSEBM (Exps 470, 485)\n- python/carnot/pipeline/sure_replay.py\
    \ (if exists) — SuRePriorityReplay (Exp 497)\n- python/carnot/pipeline/env_autofix.py\
    \ — apply_env_autofix()\n- python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\n\
    - results/experiment_497_sure_surprise_ebm_replay.json — SuRe baseline\
    \ (isolation_improvement=-0.1172)\n- ops/known-issues.md — RETRO-050\n\nTASK:\
    \ Implement EnergyMagnitudeReplay and compare isolation_score vs SuRe baseline.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3.\
    \ Add REQ-LEARN-036 (EnergyMagnitudeReplay ranks constraint violations by\
    \ |energy(x) - session_mean_energy| for replay, prioritizing domain boundary\
    \ violations), REQ-LEARN-037 (EnergyMagnitudeReplay maintains a per-domain\
    \ energy buffer of the last K violations, sorted by energy deviation),\
    \ REQ-LEARN-038 (EnergyMagnitudeReplay.isolation_score() measures domain boundary\
    \ interference: fraction of domain-A updates that change domain-B accuracy),\
    \ SCENARIO-LEARN-064/065/066 to openspec/capabilities/autoresearch/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - EnergyMagnitudeBuffer(domain:\
    \ str, max_size: int = 100):\n     - add(violation: dict, energy: float): add\
    \ to buffer, maintain sorted order by |energy - mean|\n     - top_k(k: int)\
    \ -> list[dict]: return highest-deviation violations\n     - mean_energy: float\
    \ (running mean of all added energies)\n   - EnergyMagnitudeReplay(domains:\
    \ list[str], k: int = 10):\n     - add_violation(domain: str, violation: dict,\
    \ energy: float)\n     - get_replay_batch(domain: str) -> list[dict]\n     -\
    \ isolation_score(domain_a: str, domain_b: str, n_steps: int = 20) -> float\n\
    \   - Test: top_k returns k items sorted by highest |energy - mean|\n   - Test:\
    \ isolation_score in [-1, 1] (perfect isolation=1, interference=-1)\n5. Implement\
    \ python/carnot/pipeline/energy_magnitude_replay.py with EnergyMagnitudeBuffer\
    \ + EnergyMagnitudeReplay.\n   Verbose docstring: WHY energy-magnitude priority\
    \ (SuRe uses LLM NLL as 'surprise' — this measures how surprising the\
    \ token sequence is to the language model, not how much constraint energy\
    \ the violation carries; the EBM's energy function is the ground truth for\
    \ what the model needs to learn; high |energy - mean| = domain boundary case\
    \ = the example the constraint model is most wrong about = exactly what replay\
    \ should prioritize; RETRO-050 showed LLM-surprise had isolation=-0.1172,\
    \ confirming the signals are anticorrelated).\n   Export EnergyMagnitudeReplay,\
    \ EnergyMagnitudeBuffer from carnot.pipeline.__init__.\n6. Write scripts/experiment_509_ppsebm_energy_magnitude_replay.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(509, timeout_minutes=20)\
    \ as context manager\n   c. ExperimentTemplate(509, 'PPSEBM Energy Magnitude Replay',\n\
    \      'results/experiment_509_ppsebm_energy_magnitude_replay.json')\n   d.\
    \ DeliverableGuard('results/experiment_509_ppsebm_energy_magnitude_replay.json')\n\
    \   e. EnergyMagnitudeReplay(domains=['arithmetic', 'code', 'logical'], k=10)\n\
    \   f. Simulate 200 constraint violations (50 per domain + 50 cross-domain)\
