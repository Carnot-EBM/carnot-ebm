       Extract: parallel_sweeps, checkerboard_sweeps, sweeps_reduction from Exp 889.
    4. Implement python/carnot/samplers/sparse_pimi.py:
       class SparsePIMISampler:
         __init__(self, n_spins: int, J_dense: np.ndarray, h: np.ndarray,
                  k: int = 3, alpha: float = 0.125, beta: float = 1.0):
           # Copy-node sparsification: add n_spins relay nodes
           # Each spin i connects to: k nearest neighbors (by |J[i,j]| magnitude)
           # Long-range couplings route through relay nodes
           self.n_spins = n_spins
           self.n_total = n_spins * 2  # spins + relay nodes
           self.J_sparse = self._sparsify(J_dense, k)  # O(N*k) instead of O(N^2)
         _sparsify(self, J_dense: np.ndarray, k: int) -> np.ndarray:
           For each spin i: keep only top-k couplings by |J[i,j]|.
           Zero out all others. Return sparse J (same shape, fewer nonzeros).
         sample_once(self, s_current: np.ndarray) -> np.ndarray:
           # Same synchronous parallel update as Exp 889 but using sparse J
           h_local = self.J_sparse @ s_current + self.h
           h_ema = self.alpha * self._h_ema + (1 - self.alpha) * h_local
           self._h_ema = h_ema
           p_flip = sigmoid(-2 * self.beta * h_ema * s_current)
           s_new = np.where(np.random.rand(self.n_spins) < p_flip, -s_current, s_current)
           return s_new
         run(n_sweeps, init_state) -> (final_state, energy_trajectory)
         measure_convergence(n_trials, target_energy, max_sweeps) -> int
    5. Python simulation benchmark (N=8 problem, same as prior experiments):
       a. Dense baseline: SynchronousPIMISampler(J_dense) — from Exp 889 baseline_sweeps
       b. k=3 sparse: SparsePIMISampler(J_dense, k=3)
       c. k=4 sparse: SparsePIMISampler(J_dense, k=4)
       d. k=5 sparse: SparsePIMISampler(J_dense, k=5)
       e. 100 trials each. Measure sweeps_to_converge.
    6. Verilog implementation:
       Write hardware/kv260/ising_pimi_n8_sparse_v4.v:
       - N=8 spins, k=3 sparse topology (21 nonzero couplings vs 28 in dense)
       - Reuse synchronous parallel pipeline from v3 (STAGE 0-3 architecture)
       - STAGE 1: only compute h_local[i] from k=3 nearest-neighbor j values
         (eliminates 7 multiplications per spin vs dense)
    7. Synthesize:
       ~/tools/oss-cad-suite/bin/yosys -p "synth_ice40 -top ising_pimi_n8_sparse_v4 -json /tmp/pimi_v4.json" hardware/kv260/ising_pimi_n8_sparse_v4.v
       ~/tools/oss-cad-suite/bin/nextpnr-ice40 --hx8k --package ct256 --json /tmp/pimi_v4.json 2>&1 | tee /tmp/pimi_v4_pnr.log
       Parse LUT count.
    8. Compute:
       - sparse_sweeps_best_k: int (best k value)
       - dense_sweeps_baseline: int (from Exp 889 or recomputed)
       - sweeps_reduction: dense_sweeps_baseline / sparse_sweeps_best_k
       - lut_count: int
       - synthesis_clean: bool
    9. honest_verdict:
       - "pimi_5x_retro_closed" if sweeps_reduction >= 5.0 AND lut_count <= 250
       - "pimi_5x_synthesis_over_budget" if sweeps_reduction >= 5.0 AND lut_count > 250
       - "pimi_improved_below_5x" if 3.0 <= sweeps_reduction < 5.0 (add to exclusion manifest)
       - "pimi_retired" if sweeps_reduction < 3.0 (retire per discipline)
       - "pimi_retired_upstream" if Exp 889 was already pimi_retired
       - "synthesis_blocked" if OSS-CAD tools not found
    10. If sweeps_reduction < 5.0: add iCE40 PIMI to ops/exclusion_manifest.yaml.
        Reason: "Three structural strategies + parallel update strategy all failed to reach 5x.
                 Retired after Exp 901 (final attempt per research-roadmap-v69.md)."
    11. Write tests: test _sparsify keeps only top-k couplings. Test sample_once uses
        sparse J. Test convergence measurement. Mock synthesis for unit tests.
        Traces to REQ-HW-037 (add spec entry).
    12. Add spec entry: REQ-HW-037 (SparsePIMISampler), SCENARIO-HW-037.
    13. Update ops/changelog.md, ops/status.md, research-hardware-wishlist.md.
    14. tmpl.assert_deliverable_written() as final line.
    15. Write results/experiment_901_pimi_sparse_adjacency_v4.json.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_901_pimi_sparse_adjacency_v4.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp902-huggingface-publish-v3
  milestone: 2026.04.69
  deliverable: results/experiment_902_huggingface_publish_v3.json
  title: 'Exp 902: HuggingFace Publish v3 — VJEPA v2 Weights + Architecture Update (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The last HuggingFace publish (huggingface.co/Carnot-EBM) was before milestone .68.
    Milestone .68 produced the biggest result in the project: VJEPA v2 ood_auc=0.9211.
    This result deserves a published model card and weights update.
    Additionally, the architecture has changed significantly: Tier 0h (SpectralAttentionProbe),
    Tier 2 replaced with VJEPA v2, Tier 3 relay wired (FR-11 Tier 3 closed).
    CLAUDE.md rule 3 (decentralization): all published weights must have an IPFS mirror.

    EXISTING CODE TO READ FIRST:
    - results/experiment_884_vjepa_cascade_deploy.json — VJEPA v2 deployment result, model path
    - results/experiment_891_milestone_retro.json — .68 retro summary for model card
    - openspec/change-proposals/research-roadmap-v69.md — .69 Phase 6
    - _bmad/architecture.md — updated architecture (post-.68)
    - python/carnot/pipeline/vjepa_predictor.py — VJEPA v2 implementation

    TASK: Update HuggingFace Carnot-EBM model hub with VJEPA v2 weights and updated README/cards.
    Ensure IPFS mirror is established for all published weights.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_884_vjepa_cascade_deploy.json. Extract:
       - vjepa_model_path: path to VJEPA v2 safetensors weights
       - vjepa_ood_auc: float (0.9211 expected)
       - cascade_deployed: bool (True expected)
    3. Read results/experiment_891_milestone_retro.json. Extract:
       - n_criteria_met, retros_closed_this_milestone, wall_time_minutes
    4. Prepare VJEPA v2 model card (huggingface hub README.md format):
       Write to a staging directory: /tmp/carnot-vjepa-v2-card/
         README.md with:
           - Model name: Carnot VJEPA v2 (Three-Tier LLM Verification)
           - Architecture: VariationalJEPAPredictor (KL-regularized, variational)
           - Training corpus: 207 pairs (57 FoVer + 100 synthetic GSM8K + 30 ARC + 20 SVAMP)
           - Key metrics: ood_auc=0.9211, fover_auc=<from result>, training_epochs=200
           - Usage: code snippet showing carnot.pipeline.vjepa_predictor.VariationalJEPAPredictor.load()
           - License: Apache 2.0
           - Citation: (Carnot project, milestone 2026.04.68)
         model.safetensors: copy of vjepa_model_path file
    5. Check if huggingface_hub Python package and HF credentials are available:
       import huggingface_hub; huggingface_hub.whoami() — if fails, log credentials_available=False
    6. If credentials_available:
       a. Upload to huggingface.co/Carnot-EBM/carnot-vjepa-v2 using huggingface_hub.upload_folder()
       b. Also update main huggingface.co/Carnot-EBM README with .68 architecture table
       c. Set publish_confirmed=True
    7. IPFS mirror:
       a. Check if ipfs command available: shutil.which("ipfs")
       b. If available: ipfs add -r /tmp/carnot-vjepa-v2-card/ —> extract CID
          ipfs pin add <CID>
          Set ipfs_mirror_cid = CID, ipfs_mirror_confirmed=True
       c. If not available: set ipfs_mirror_cid=None, ipfs_mirror_confirmed=False
          Append to ops/known-issues.md: "IPFS not installed — VJEPA v2 weights have no
          IPFS mirror. Install: apt install ipfs or use ipfs.io installer."
    8. Update _bmad/architecture.md "Last Reconciled" date to today's date.
       Add to architecture doc: Tier 2 = VJEPA v2 (ood_auc=0.9211, .68), Tier 0h = SpectralAttentionProbe.
    9. honest_verdict:
       - "published_with_ipfs_mirror" if publish_confirmed AND ipfs_mirror_confirmed
       - "published_no_ipfs_mirror" if publish_confirmed AND NOT ipfs_mirror_confirmed
       - "publish_blocked_no_credentials" if NOT credentials_available
       - "staged_only" if publish_confirmed=False (card staged but not uploaded)
    10. Build artifact:
        {
          publish_confirmed: bool,
          ipfs_mirror_confirmed: bool,
          ipfs_mirror_cid: str or null,
          vjepa_ood_auc: 0.9211,
          model_card_path: "/tmp/carnot-vjepa-v2-card/README.md",
          architecture_reconciled: bool,
          honest_verdict: str
        }
    11. Update ops/changelog.md, ops/status.md.
    12. tmpl.assert_deliverable_written() as final line.
    13. Write results/experiment_902_huggingface_publish_v3.json.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_902_huggingface_publish_v3.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp903-milestone-retro
