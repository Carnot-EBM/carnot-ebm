    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct ARC verifier is MANDATED by the 2026-06-14 P0 directive (HEADLINE oracle-distinct verifier) + the .394 capstone left cross-game generalization as the SOLE reason hardened_win=False -- false-positive scope-match vs retired GAP-3 content-EBM lineage / the .393 ARC gate (exp4245); forward difference = recover the FAMILY/GAME provenance exp4258 could not (the data-provenance fix that makes the held-out-family OOD test possible), per the SOTA-ingestion flagged_for_v395 (ARC-TGI + Reliability Gap). verifier_is_oracle=false."
