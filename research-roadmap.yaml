    operator_override: "2026-05-29 operator directive (standing): P0.1 is the hand-authored Phase-3 de-risking experiment in ops/known-issues.md (exp3312). Three single-task attempts FAILED (exp3312 flagged, exp3426 degenerate-harness, exp3437 idle-timeout-retired). This task is the NEW first half of the decoupled design: a resumable generation-corpus builder whose only job is to produce cached candidate generations that the scoring task (exp3449) consumes — a different deliverable (a corpus, not the comparison), explicitly engineered to defeat the 1201s idle-timeout that killed exp3437."
