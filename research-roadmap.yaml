- id: exp972-kan-milp-formal-verification
  milestone: 2026.04.75
  deliverable: results/experiment_972_kan_milp_formal_verification.json
  title: "KAN Formal Verification via MILP — Property Checking for Energy Functions"
  prompt: |
    CONTEXT:
    arXiv 2602.06737 (Feb 2026) introduces MILP-based formal verification for KAN models using
    piecewise affine (PWA) abstractions. The method verifies properties like monotonicity,
    convexity, and output bounds for KAN networks. This is critical for Carnot's KAN energy
    tier: a subtle spline bug could produce incorrect energy scores without failing any test.

    Carnot has two deployed KAN energy models:
    1. KAEMEnergy (python/carnot/models/kaem_energy.py) — exact inverse-transform sampling
    2. Symbolic-KAN (from Exp 948, now deployed in Exp 968) — constraint verifier AUC=1.0

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/kaem_energy.py (KAEMEnergy, UnivariateKAEMLayer)
    - python/carnot/models/kan_tier.py (KAN energy tier, if exists)
    - results/experiment_948_*.json (Symbolic-KAN checkpoint path)
    - results/experiment_968_symbolic_kan_deploy_hf_publish.json (confirm deployment)

    TASK:
    Apply PWA abstraction + MILP property verification to Carnot's KAN energy functions:
    1. Implement PWA abstraction: for each spline in UnivariateKAEMLayer, replace the
       B-spline with a piecewise-affine function (linear interpolation between knot points)
    2. Encode the following properties as MILP constraints using scipy.optimize or PuLP:
       a) Monotonicity: energy(violation_severity=1.0) > energy(violation_severity=0.0)
       b) Output range: energy output in [-N, N] for N spins
       c) Boundary condition: energy(no_violation) is close to minimum
    3. Verify each property for the KAEMEnergy model (CPU-based, no GPU needed)
    4. Report: n_properties_verified, n_violations_found, verification_time_s
    5. If violations found: write the violation details so engineers can fix the splines

    Use JAX_PLATFORMS=cpu for reproducibility.

    Write results/experiment_972_kan_milp_formal_verification.json with schema:
      n_properties_verified: int
      n_violations_found: int
      verification_time_s: float
      properties_checked: list[str]
      violations_detail: list[str]
      honest_verdict: str

    honest_verdict = "kan_properties_verified" if n_violations_found == 0.
    honest_verdict = "kan_violations_found" if n_violations_found > 0 (fix needed).
    honest_verdict = "milp_solver_unavailable" if PuLP/scipy not installable.

    Run: python scripts/experiment_972_kan_milp_formal_verification.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: medium
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 60
