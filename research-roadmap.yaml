  - id: exp285-spilled-energy-extractor
    milestone: "2026.04.21"
    deliverable: python/carnot/pipeline/spilled_energy_extractor.py
    title: "Exp 285: SpilledEnergyExtractor implementation (arXiv 2602.18671 + 2512.15605)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: The fundamental bottleneck is constraint EXTRACTION. ArithmeticExtractor
      finds 0 violations on IT models. Semantic grounding detects stale errors but misses
      fresh-wrong errors (0% detection, Exp 279). Spilled Energy (ICLR 2026,
      arXiv 2602.18671) detects hallucinations via logit_energy − output_energy discrepancy
      with NO extraction required. The AR-EBM bijection paper (arXiv 2512.15605) shows
      LLMs implicitly compute a "lookahead energy" in function space — computable without
      fine-tuning. These logit-based signals are the escape from the extraction bottleneck.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/extract.py — ConstraintExtractor base protocol
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (add method here)
      - openspec/capabilities/verifiable-reasoning/spec.md — add REQ-VERIFY-061

      TASK: Implement SpilledEnergyExtractor.
      1. Read CLAUDE.md spec-first workflow
      2. Add REQ-VERIFY-061, SCENARIO-VERIFY-074, SCENARIO-VERIFY-075 to spec.md
      3. Write tests first (tests/python/test_spilled_energy_extractor.py) covering:
         - Spilled energy computation from logits numpy array
         - Lookahead energy approximation (negative log-prob of continuation)
         - Threshold firing (mean_spilled > threshold → suspected_hallucination=True)
         - Pipeline integration (verify_spilled_energy returns SpilledEnergyResult)
         - Edge cases: uniform logits (spill ≈ 0), peaked logits (spill > 0), single token
         - Loading saved logits from file (data/research/logits_282_*.npy if Exp 282 ran)
         - SpilledEnergyResult serialization to dict for JSON export
      4. Implement python/carnot/pipeline/spilled_energy_extractor.py:
         - SpilledEnergyResult dataclass: per_token_spilled, mean_spilled, max_spilled,
           p95_spilled, lookahead_energy, suspected_hallucination, threshold_used
         - compute_spilled_energy(logits: np.ndarray) → SpilledEnergyResult
           Formula: per_token = H(softmax(logit_t)) − max(log_softmax(logit_t))
           i.e., entropy minus max-logit contribution
         - compute_lookahead_energy(logits: np.ndarray) → float
           AR-EBM bijection: −mean(log P(token_t | prefix_t)) over response tokens
         - SpilledEnergyExtractor class implementing additive extraction from saved logits file
         - Add verify_spilled_energy(logits_path: str | np.ndarray) to VerifyRepairPipeline
         - Export from python/carnot/pipeline/__init__.py
      5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q (must be 100% coverage)
      6. Run: .venv/bin/ruff check python/carnot/pipeline/spilled_energy_extractor.py
      7. Run: .venv/bin/mypy python/carnot/pipeline/spilled_energy_extractor.py
      8. Reconcile: update _bmad/traceability.md, ops/changelog.md, ops/status.md
      9. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp286-semantic-energy-extractor
    milestone: "2026.04.21"
    deliverable: python/carnot/pipeline/semantic_energy_extractor.py
    title: "Exp 286: SemanticEnergyExtractor + DualEnergyGate (arXiv 2508.14496)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 285 implemented SpilledEnergyExtractor (uncertain outputs).
      Semantic Energy (arXiv 2508.14496) catches the complementary class: confident-but-wrong
      outputs where entropy is LOW but the answer is WRONG. Spilled energy fires on uncertain
      outputs; semantic energy fires on overconfident-wrong outputs. The DualEnergyGate
      combines them: fires if EITHER exceeds its threshold. Together they form an
      extraction-free first-pass filter — no regex, no KB, no SMT required.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/spilled_energy_extractor.py — SpilledEnergyExtractor (Exp 285)
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
      - openspec/capabilities/verifiable-reasoning/spec.md — add REQ-VERIFY-062

      TASK: Implement SemanticEnergyExtractor and DualEnergyGate.
      1. Read CLAUDE.md spec-first workflow
      2. Add REQ-VERIFY-062, SCENARIO-VERIFY-076, SCENARIO-VERIFY-077 to spec.md
      3. Write tests first (tests/python/test_semantic_energy_extractor.py) covering:
         - Semantic energy computation: E = -log(sum(exp(logit_i / T)))
         - Temperature parameter effect (higher T = lower energy = less confident)
         - DualEnergyGate: fires when EITHER spilled OR semantic exceeds threshold
         - Calibration from labeled logit corpus (isotonic regression)
         - pipeline integration (verify_dual_energy returns DualEnergyResult)
         - Edge cases: very high entropy logits, very low entropy logits, single token
         - Threshold calibration on Exp 219/235 labels as ground truth
      4. Implement python/carnot/pipeline/semantic_energy_extractor.py:
         - SemanticEnergyResult dataclass: semantic_energy, temperature, overconfident_flag
         - compute_semantic_energy(logits: np.ndarray, T: float = 1.0) → float
           Formula: E_semantic = -log(sum_i(exp(logit_i / T)))
         - DualEnergyResult dataclass: spilled_result, semantic_result, gate_fired,
           trigger_signal ("spilled"|"semantic"|"both"|"none"), calibration_threshold_used
         - DualEnergyGate class: calibrate(logits_corpus, labels) using isotonic regression,
           fire(spilled_result, semantic_result) → DualEnergyResult
         - Add verify_dual_energy(logits) to VerifyRepairPipeline
         - Export from python/carnot/pipeline/__init__.py
      5. If data/research/logits_282_*.npy exists (Exp 282 ran), calibrate on those logits
         using Exp 219/235 accuracy labels as ground truth; else use synthetic calibration.
      6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q (100% coverage)
      7. Run: .venv/bin/ruff check and .venv/bin/mypy
      8. Reconcile: update _bmad/traceability.md, ops/changelog.md, ops/status.md
      9. Do NOT push. Do NOT modify scripts/research_conductor.py.

