  prompt: |-
    CONTEXT: Constrained Sampling for LLMs via MCMC Perspective (arXiv:2506.05754) proposes
    treating any constraint set as an energy function and applying Metropolis-Hastings
    acceptance/rejection. FST live PATH A GGUF inference was validated in .233 (exp2399).
    This task adds MH-constrained generation: each proposed token is accepted/rejected based
    on Carnot's energy constraints (Ising energy or NSVIF Z3 verdict).

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/pipeline/fst_pipeline.py (FST pipeline)
      {project_root}/python/carnot/samplers/casal_sampler.py (MH acceptance pattern)
      {project_root}/results/experiment_2399_fst_live_path_ab.json (PATH A baseline)
      {project_root}/python/carnot/verify/nsvif_z3_extractor.py (constraint checker)

