  - id: exp1993-gec-math-core-rust
    title: "Exp 1993: Implement Gradient-Guided Epsilon Constraint (GEC) core math in Rust"
    deliverable: results/experiment_1993_gec_math.json
    max_turns: 80
    agent_type: codex
    prompt: |
      CONTEXT: FR-11 continuous self-learning suffers from catastrophic forgetting. The NeurIPS 2025 "Gradient-Guided Epsilon Constraint" (GEC) method provides strict projection to prevent this.

      EXISTING CODE TO READ FIRST:
        - crates/carnot-core/src/math/ (or similar Rust math directory)
        - research-references.md

      TASK: Implement the GEC projection algorithm in Rust for the Carnot core.

      CONCRETE STEPS:
        1. Implement the mathematical projection operator that guarantees `nonforgetting_rate = 1.0` within `crates/carnot-core/src/math/gec.rs`.
        2. Write Rust unit tests for the projection operator.
        3. Ensure Python PyO3 bindings are exposed for the new math core.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.rust_impl.v1"
        - experiment: 1993
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1994-clara-v-schema
    title: "Exp 1994: CLaRa-V Continuous Latent Representation Schema"
    deliverable: results/experiment_1994_clara_schema.json
    max_turns: 50
    prompt: |
      CONTEXT: Bridging retrieval and generation with continuous latent reasoning (CLaRa-V) replaces discrete tokens. We need the data structures in Python to hold these continuous states.

      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/ (or relevant schema directories)
        - research-references.md

      TASK: Create the schema and Python dataclasses for CLaRa-V continuous latent variables.

      CONCRETE STEPS:
        1. Define `ContinuousLatentState` and `EnergyVector` schema representations.
        2. Integrate these classes with the existing EBM abstraction layers.
        3. Write unit tests for the schema initialization.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.schema.v3"
        - experiment: 1994
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1995-pinet-differentiable-projection
    title: "Exp 1995: PiNet-style differentiable projection layer for hard constraints"
    deliverable: results/experiment_1995_pinet_projection.json
    max_turns: 100
    agent_type: codex
    prompt: |
      CONTEXT: PiNet (ICLR 2026) offers differentiable projection layers for convex constraints, bypassing slow symbolic solvers.

      EXISTING CODE TO READ FIRST:
        - python/carnot/models/
        - research-references.md

      TASK: Implement the PiNet differentiable projection in JAX for continuous latent states.

      CONCRETE STEPS:
        1. Write the JAX implementation of the Douglas-Rachford operator splitting method.
        2. Map the continuous constraints from Exp 1994 into this projection layer.
        3. Validate the gradients flow through the projection with a synthetic test.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.model_layer.v1"
        - experiment: 1995
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

