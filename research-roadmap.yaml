  - id: exp5417-risk-calibrated-sota-structured-panel-v493
    milestone: "2026.07.493"
    title: "Risk-calibrated SOTA structured safety/action panel with abstention"
    priority: critical
    track: verification
    deliverable: results/experiment_5417_risk_calibrated_sota_structured_panel_v493.json
    requires_gpu: true
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    estimated_wall_time_min: 110
    prior_failures:
      - experiment_id: exp5405-scaled-structured-safety-action-panel-v492
        verdict: "complete: structured_safety_action_panel_ready=true with local SOTA GGUF receipts and deterministic verifier authority"
        addressed_by: "This extends the clean .492 panel with confidence-interval risk accounting and abstention, instead of rerunning the same validity panel."
        retire_if_same_verdict: true
      - experiment_id: exp5404-formal-encoding-tautology-corrigendum-v492
        verdict: "complete: formal_encoding_corrigendum_clean=true after row-level checksum repair of the prior tautology"
        addressed_by: "This task consumes the cleaned formal fixture as an input and adds risk calibration, not another tautology corrigendum."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5404 and Exp5405 made structured formal/safety/action verification headline-ready at bounded scale. Recent abstention and structured-output work says the next gap is risk-calibrated selective answering: schema validity is not enough, and uncertain rows should abstain rather than become false accepts.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/research-references.md
      - {project_root}/results/experiment_5404_formal_encoding_corrigendum_v492.json
      - {project_root}/results/experiment_5405_structured_safety_action_panel_v492.json
      - {project_root}/tests/python

      TASK:
      Build a risk-calibrated structured safety/action panel that compares constrained local SOTA GGUF outputs against unconstrained baselines, deterministic policy/semantic/reachability checks, and an explicit abstention rule.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify local SOTA GGUF availability and GPU/offload viability before long inference. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Use legacy small models only for CPU smoke tests, never headline rows.
      1. Reuse the Exp5404/Exp5405 row-record pattern and add confidence/uncertainty signals that can be computed from deterministic checks, repeated samples, verifier margins, or model self-reports clearly marked as advisory.
      2. Build fixtures across schema-only traps, semantic contradictions, unsafe policy rows, unreachable tool actions, benign rows, and decoy constraints.
      3. Compare constrained, unconstrained, and abstaining variants. The deterministic verifier remains final authority for acceptance.
      4. Compute confidence intervals, accepted-risk estimates, abstention rates, false accept rates, false reject rates, and semantic-error rates from row records only.
      5. Add focused tests that fail if schema validity is used as semantic correctness or if readiness booleans are assigned without row provenance.
      6. If GPU/offload is unavailable, emit a blocked artifact with preconditions_checked and no headline claim.
      7. Emit the deliverable JSON with REQUIRED ARTIFACT FIELDS:
         - preconditions_checked: bool  # principle: compute-bound task must fail fast
         - model_specs: list  # principle: mandated SOTA GGUF provenance
         - runtime_backend: string  # principle: no hidden transformers path
         - gpu_offload_verified: bool  # principle: no CPU-only SOTA headline
         - fixture_count: int  # principle: scale and coverage
         - row_checksums: list  # principle: aggregate provenance
         - constrained_validity: number  # principle: structured baseline
         - unconstrained_validity: number  # principle: comparison baseline
         - semantic_error_rate: number  # principle: schema is not semantics
         - accepted_risk_bound: number  # principle: risk-calibrated decision
         - abstention_rate: number  # principle: selective answering behavior
         - unsafe_false_accept_rate: number  # principle: safety guard
         - confidence_interval_method: string  # principle: calibration provenance
         - aggregate_from_rows_only: bool  # principle: tautology prevention
         - risk_calibrated_structured_panel_ready: bool  # principle: downstream gate
         - inference_substrate: live_llm_inference  # principle: real local model invocation
         - honest_verdict: string  # principle: terminal status; start with "complete:" or "blocked:"
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

