milestone: "2026.08.576"
milestone_title: "Verifier-Governed Constraint Decoding and Reversible Live Learning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6604-exact-two-level-plan-corpus
    milestone: "2026.08.576"
    deliverable: results/experiment_6604_exact_two_level_plan_corpus.json
    title: "Exact two-level plan corpus and compiler contract"
    priority: critical
    track: exact-constraint-foundation
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 90
    agent_type: codex
    model: gpt-5.6-sol
    prior_failures:
      - experiment_id: exp6326-restricted-policy-contract-compiler
        verdict: "ready: bounded policy contracts passed exact enumeration with verified fallbacks"
        addressed_by: "V576 builds a new exact plan corpus and token/action compiler with an independent executor and incomplete-encoding attacks; it does not rerun the old restricted policy contract."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 575 found zero direct headroom in the CFR rows, so it could not test whether constraints improve flagship generation. Meta-Ctrl, arXiv:2608.22149, suggests factoring token syntax from action-level preconditions, goals, and ordering. Carnot needs a fixed exact-executable benchmark and an oracle-distinct compiler before any model comparison. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V576 roadmap document
      - {project_root}/research-references.md V576 refresh and the Meta-Ctrl source
      - {project_root}/python/carnot/verifiers/dccd_adapter.py, {project_root}/python/carnot/verify/xgrammar_abs_contract_decoder_adapter.py, {project_root}/python/carnot/inference/crane_decoder.py, and {project_root}/python/carnot/pipeline/gemma4_quantized_loader.py
      - existing exact-check registries, fixture hashing, split, artifact unwrapping, atomic output, and protected-file helpers plus their tests
      - relevant constraint-verification, verifiable-reasoning, llm-ebm-inference, research-reporting, and safety capability specs; _bmad/traceability.md; ops/status.md; ops/changelog.md; and ops/e2e-test-plan.md

      TASK
      Build a deterministic exact-executable plan corpus with calibration and frozen held splits. Implement a two-level compiler that separates token grammar from action-level semantic state. Keep an independent exact executor as release authority. Perform no LLM inference.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected-file hashes, dirty-worktree state, Python and solver versions, available grammar backends, CPU, RAM, disk, fixture seeds, and the no-LLM substrate.
      1. Add REQ-* and SCENARIO-* anchors for deterministic plan generation, frozen splits, two-level compilation, independent execution, incomplete-encoding attacks, row retention, and atomic output. Write focused tests first.
      2. Create at least 72 bounded plan tasks: 36 calibration and 36 held. Each task must define a grounded action vocabulary, argument grammar, state, preconditions, ordering constraints, goal predicates, known feasibility, and an exact deterministic executor. Use fixed seeds and immutable source bytes.
      3. Stratify task generation by independent lexical, temporal, branching, and distractor features. Do not claim that symbolic solver difficulty predicts model difficulty. Freeze generator version, seeds, split membership, and task hashes before any model runs.
      4. Implement token-level syntax compilation and action-level semantic compilation as separate reusable interfaces. Preserve a structured meta-token mapping. The exact executor must not call either compiler to decide final validity.
      5. Hand-check a bounded gold subset and test valid plans, syntax errors, precondition violations, ordering violations, unmet goals, impossible tasks, and parser ambiguity. Emit one fixture row for every task and mutation.
      6. Construct attacks that pass token syntax but fail semantic state, and at least one candidate that passes both encoded automata but fails the independent executor because an obligation was deliberately omitted from the test compiler. This proves the automata are not self-certifying.
      7. Attack split leakage, duplicate bytes, seed drift, non-deterministic execution, goal leakage, compiler/executor code sharing, impossible-task mislabeling, and protected-file mutation.
      8. Set headroom_fixture_ready_score=1.0 only when all tasks, hashes, splits, executor checks, compiler checks, attacks, and focused tests replay. A complete contract is null infrastructure, not positive research science.
      9. Write the terminal artifact atomically. Run focused tests, lint, spec coverage, artifact-convention checks, adversarial verification, applicable exact-verification E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6604_exact_two_level_plan_corpus.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The corpus task ends with a terminal contract or a named block."
        honest_verdict:
          principle: "The verdict reports fixture and compiler readiness without claiming model benefit."
        verdict_class:
          principle: "Use the closed enum; a ready foundation is null infrastructure."
        gate_check_summary:
          principle: "Any blocked outcome names the failed fixture, split, solver, compiler, hash, backend, or protection check and observed value."
        fixture_and_split_receipts:
          principle: "Every calibration and held task has immutable bytes, seed, stratum, membership, and hash."
        plan_fixture_rows:
          principle: "Every task records vocabulary, state, obligations, feasibility, gold witness when available, and exact outcome."
        token_syntax_compiler_receipts:
          principle: "Token grammar is versioned and distinct from semantic and exact execution."
        action_semantic_compiler_receipts:
          principle: "Preconditions, ordering, goals, and meta-token transitions are explicit and replayable."
        independent_exact_executor_receipts:
          principle: "Final validity comes from an executor that does not reuse decoding automata as authority."
        mutation_rows:
          principle: "Syntax, semantics, omitted-obligation, infeasibility, ambiguity, and leakage mutations fail as expected."
        headroom_fixture_ready_score:
          principle: "This exact binary field gates Exp6605, Exp6606, and Exp6607 only when the full corpus contract replays."
        attack_rows:
          principle: "Leakage, duplication, drift, sharing, mislabeling, and mutation attacks fail closed."
        preconditions_checked:
          principle: "Resources, versions, backends, seeds, hashes, and protected files are explicit."
        protected_files_unchanged:
          principle: "research-roadmap.yaml and scripts/research_conductor.py retain their original hashes."
        inference_substrate:
          principle: "The task declares deterministic fixture compilation and exact execution with no LLM."
        verifier_is_oracle:
          principle: "The exact executor is authoritative for benchmark validity."
        field_provenance:
          principle: "Every field names source bytes, seeds, hashes, compiler code, executor code, and reducer functions."
        duration_s:
          principle: "Monotonic duration exposes a shortcut or truncated fixture build."
        tests_run:
          principle: "Named focused, lint, spec, artifact, adversarial, and E2E commands include exits and durations."
        reproducibility_checksum:
          principle: "A final content hash detects corpus or contract mutation."
      Set inference_substrate=deterministic_two_level_plan_fixture_and_exact_executor_no_llm and verifier_is_oracle=true. A ready contract uses verdict_class=null. A genuine block uses blocked_* and populates gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6604_exact_two_level_plan_corpus --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6605-qwen36-direct-headroom
    milestone: "2026.08.576"
    deliverable: results/experiment_6605_qwen36_direct_headroom.json
    title: "Qwen3.6 direct baseline headroom qualification"
    priority: critical
    track: flagship-headroom
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    gated_on:
      - upstream: exp6604-exact-two-level-plan-corpus
        artifact_field: headroom_fixture_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Exp6604 owns the frozen exact plan corpus. This task measures a direct baseline for one flagship family before any constrained treatment exists. It must preserve complete local GGUF identity and raw evidence. Finding no headroom is a valid null qualification result. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V576 roadmap document, and Exp6604's artifact and exact frozen task bytes
      - {project_root}/scripts/experiment_template.py and the cached_sota_pair() contract
      - {project_root}/python/carnot/inference/sota_models.py, {project_root}/python/carnot/pipeline/gemma4_quantized_loader.py, and current GPU ownership, tokenizer, chat-template, checkpoint, timeout, raw-output, failure-retention, and atomic-write helpers
      - relevant model-tier, training-inference, llm-ebm-inference, benchmark, evidence, and research-reporting specs; traceability; status; changelog; and E2E plan

      TASK
      Run the byte-frozen direct prompt on the full Exp6604 calibration and held splits with the mandated local Qwen3.6 flagship. Measure family-level held headroom without any grammar, semantic mask, repair, or model-family cross-talk.

      CONCRETE STEPS
      0. PRECONDITIONS: record the structured Exp6604 gate, protected hashes, task and split hashes, expected unit count, disk and checkpoint space, GPU ownership and free VRAM, CUDA llama.cpp receipt, exact GGUF shard paths and hashes, embedded tokenizer and chat-template identity, and timeout budget. If any required live precondition fails, write a terminal blocked artifact with gate_check_summary before exit.
      1. Add REQ-* and SCENARIO-* anchors for one-family local baseline inference, immutable prompt bytes, GGUF identity, embedded tokenizer use, CUDA offload evidence, raw output retention, exact replay, failures, family headroom, checkpoint resume, and atomic output. Write focused tests first.
      2. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF with resolved local model_path and reviewed GPU assignment. Legacy Qwen3.5-0.8B or Gemma E4B may run only as a labeled CPU smoke test and cannot fill a result row.
      3. Freeze the direct prompt and decoding settings before inference. Use at least three fixed seeds per calibration and held task with a bounded plan output. No output may be regenerated because it failed exact execution.
      4. Preserve prompt bytes, raw response bytes, parsed plan, seed, task hash, model process, GPU, timing, token count, finish reason, parse state, exact executor result, and every timeout or failure in per_unit_rows.
      5. Recompute calibration and held exact success only from per-unit rows. Report family success intervals, syntax failure, semantic failure, unmet goal, refusal, invalid generation, and charged failure rates. Do not select individual held rows by outcome.
      6. Set qwen_headroom_ready_score=1.0 only when every expected row is complete and the family-level held direct exact-success rate is between 0.20 and 0.80 inclusive. Row completeness may still finish with a zero readiness score.
      7. Attack prompt drift, split leakage, omitted failures, CPU fallback in headline rows, fake CUDA offload, wrong model, tokenizer substitution, response regeneration, aggregate disagreement, and protected-file mutation.
      8. Write checkpoints and the terminal artifact atomically. Run focused tests, lint, spec coverage, artifact convention and verdict-row consistency checks, adversarial verification, applicable inference and verification E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6605_qwen36_direct_headroom.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The family run is terminal, resumable, and never hides a resource block."
        honest_verdict:
          principle: "The verdict distinguishes row completion from the presence of useful headroom."
        verdict_class:
          principle: "Use the closed enum; baseline qualification alone is null infrastructure."
        gate_check_summary:
          principle: "Any blocked outcome names the failed upstream, cache, GPU, model, tokenizer, row, timeout, checkpoint, or exact-check condition and observed value."
        per_unit_rows:
          principle: "Every task and seed carries immutable inputs, raw output, parse, exact result, tokens, latency, process, and failures."
        model_spec_and_identity:
          principle: "The exact mandated hub ID, GGUF shards, hashes, tokenizer, chat template, quantization, and context are bound."
        gpu_process_receipts:
          principle: "Owned process, device, VRAM, CUDA layer offload, timing, and unload evidence prove local GPU inference."
        prompt_and_decode_contract:
          principle: "Direct prompt bytes, stop rules, sampling settings, and seed schedule are frozen before inference."
        raw_model_receipts:
          principle: "Every raw response is retained before parsing or exact checking."
        failure_rows:
          principle: "Timeouts, parse failures, refusals, invalid plans, and resource errors remain charged to the baseline."
        family_headroom_summary:
          principle: "Calibration and held exact success and failure modes recompute only from rows."
        qwen_headroom_ready_score:
          principle: "This exact binary field is owned here and indicates complete held success in the frozen 20%-80% interval."
        attack_rows:
          principle: "Drift, leakage, dropping, fallback, identity, regeneration, aggregate, and mutation attacks fail closed."
        preconditions_checked:
          principle: "Upstream gate, files, hashes, GPU, cache, model, tokenizer, timeouts, and protected files are explicit."
        protected_files_unchanged:
          principle: "Both protected orchestration files retain their original hashes."
        inference_substrate:
          principle: "The task declares live local Qwen3.6 GGUF inference through CUDA llama.cpp."
        verifier_is_oracle:
          principle: "The independent exact executor defines plan success."
        field_provenance:
          principle: "Every aggregate points to per-unit raw, model, process, and exact-check receipts."
        duration_s:
          principle: "Monotonic duration is consistent with the declared live workload."
        tests_run:
          principle: "Named validation commands include exits and durations."
        reproducibility_checksum:
          principle: "A final content hash detects result mutation."
      Set inference_substrate=live_local_qwen36_35b_a3b_gguf_direct_plan_baseline_cuda_llamacpp and verifier_is_oracle=true. A complete baseline uses verdict_class=null whether or not headroom opens. A genuine block uses blocked_* and populates gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6605_qwen36_direct_headroom --date {date} --gpu 0
      Do NOT push. Do NOT modify scripts/research_conductor.py.

