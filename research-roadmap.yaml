- id: exp1535-xgrammar-abs-contract-decoder-adapter
  milestone: 2026.04.118
  deliverable: results/experiment_1535_xgrammar_abs_contract_decoder_adapter.json
  title: "XGrammar/ABS Contract Decoder Adapter - Gated on Exp1533+Exp1534"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 90
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  gated_on:
    - upstream: exp1533-117-completion-archive-118-activation
      artifact_field: prior_runtime_contract_e2e_ready
      op: "=="
      value: true
    - upstream: exp1534-planner-orphan-test-discipline-guard
      artifact_field: orphan_test_guard_ready
      op: "=="
      value: true
  prior_failures:
    - experiment_id: exp1521-live-sota-contract-guided-repair
      verdict: contract_repair_zero_delta_tiny_case_count
      addressed_by: "This task changes the intervention from post-hoc repair to generation-time automata/grammar constraints and measures validity, latency, and false accepts on the runtime-contract corpus."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    .117 proved runtime-contract E2E acceptance, but live SOTA repair attempted
    only 2 cases and showed repair_accept_rate_delta=0.0. The 2026 sweep added
    XGrammar-2 and ABS as promising structured-generation approaches. .118
    should test whether dynamic grammar/DFA masking improves validity before
    semantic validators run. Use {project_root} as the project root and {date}
    as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (headline flagship MoE)
    - unsloth/gemma-4-31B-it-GGUF (headline flagship dense)
    - unsloth/gemma-4-26B-A4B-it-GGUF (headline middle MoE)
    - Legacy small GGUFs may be used only as CPU smoke tests and must not be headline-result models.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - results/experiment_1520_runtime_contract_e2e_harness.json
    - results/experiment_1521_live_sota_contract_guided_repair.json
    - python/carnot/verify/
    - python/carnot/grammar/
    - scripts/
    - tests/python/

    TASK:
    Implement or prototype an XGrammar-2/ABS-compatible contract decoder
    adapter for Carnot runtime-contract cases and compare it against the
    existing grammar-only/post-decode path under mandated local SOTA GGUFs.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - contract_decoder_adapter_ready
    - model_specs
    - live_sota_model_inference_used
    - cases_attempted
    - baseline_parse_rate
    - automata_parse_rate
    - baseline_contract_accept_rate
    - automata_contract_accept_rate
    - latency_delta_seconds
    - false_accept_rate
    - xgrammar_available
    - abs_dfa_masks_used
    - adapter_path
    - focused_tests_passed
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1535_xgrammar_abs_contract_decoder_adapter.json immediately with status="in_progress".
    2. Load the .117 runtime-contract case manifest and choose a bounded case set that covers certificates, safe DSL validators, monitor events, and structural contracts.
    3. Probe whether an XGrammar-compatible package is available locally. If not, implement a bounded adapter with the same interface and an ABS-style DFA mask simulation for regular contract constraints.
    4. Use the cached_sota_pair() pattern from scripts/experiment_template.py where applicable and run at least one mandated SOTA headline model. Record all MODEL_SPECS in the artifact.
    5. Compare baseline grammar-only/post-decode results with automata-guided results on parse rate, contract accept rate, latency, and deterministic false accepts.
    6. Add focused tests for DFA/grammar compilation and validator handoff. Keep deterministic validators as final authority.
    7. Confirm legacy small models, if used, are marked smoke-test-only and excluded from headline metrics.
    8. Write the final artifact with status="complete" and an honest terminal verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1535_xgrammar_abs_contract_decoder_adapter.json')); print(d.get('contract_decoder_adapter_ready'), d.get('live_sota_model_inference_used'), d.get('cases_attempted'), d.get('false_accept_rate'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1536-satquest-cnf-verifier-benchmark
  milestone: 2026.04.118
  deliverable: results/experiment_1536_satquest_cnf_verifier_benchmark.json
