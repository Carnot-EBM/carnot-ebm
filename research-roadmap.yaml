      - {project_root}/research-references.md entries for Meta-Ctrl, In-Writing, STATIC, CRANE, and Safety Hacking
      - the Exp6604 two-level compiler; dccd_adapter.py; xgrammar_abs_contract_decoder_adapter.py; crane_decoder.py; grammar_constrained_decoder.py; gemma4_quantized_loader.py; and cached_sota_pair()
      - GPU ownership, checkpoint, timeout, process, raw output, failure, exact executor, paired statistics, row consistency, atomic output, and protected-file helpers plus tests
      - relevant constraint, inference, model-tier, verification, evidence, safety, and reporting specs; traceability; status; changelog; and E2E plan

      TASK
      For every Exp6608-eligible family, compare immutable direct rows with fresh syntax-only and two-level syntax-plus-semantic constrained decoding on the complete frozen held split. Measure exact success, failure modes, safety, tokens, latency, and intervention cost per unit.

      CONCRETE STEPS
      0. PRECONDITIONS: record the structured Exp6608 gate, eligible model specs, held hashes, direct row hashes, protected hashes, grammar backend, action-state backend, GPU ownership and VRAM, CUDA llama.cpp, GGUF identities, tokenizer and chat templates, checkpoint space, and timeouts. Emit a terminal blocked artifact before inference if any required treatment backend or live identity is absent.
      1. Add REQ-* and SCENARIO-* anchors for headroom-gated treatment, direct-row reuse, syntax-only and two-level arms, reasoning/plan boundary, live logit intervention, exact authority, family isolation, paired rows, failures, cost, resume, and atomic output. Write focused tests first.
      2. MODEL_SPECS must declare unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Load only the Exp6608-eligible subset by exact local path. Legacy models cannot enter any arm.
      3. Freeze prompts, trigger boundary, grammar, semantic automata, decoding settings, seeds, and arm order before inference. Preserve free reasoning before the structured plan trigger. A prompt-only JSON request or post-hoc repair is not a constrained treatment.
      4. Reuse Exp6605-Exp6607 direct rows without rerunning them. Run syntax_only with token masks and two_level with token masks plus action-state transitions. Use matched family, task, seed, and output budget. Preserve every candidate bank and failure.
      5. Emit per_unit_rows for every eligible family, held task, seed, and arm with raw bytes, parse, syntax state, semantic state, exact execution, unsafe release, tokens, latency, mask steps, state-transition cost, finish reason, and failures.
      6. Recompute direct-versus-syntax and direct-versus-two-level paired wins, losses, ties, intervals, exact-success deltas, failure modes, unsafe release, tokens, latency, and charged cost by family before pooling. Pool only byte-identical tasks after family results are fixed.
      7. A treatment win requires positive paired exact-success delta, a nonnegative paired lower bound, no unsafe-release increase, complete row retention, and the preregistered cost ceiling. Set two_level_decoder_comparison_ready_score=1.0 for row-complete comparison even when the scientific effect is null.
      8. Attack identical treatment and control, prompt-only fallback, post-hoc repair disguised as decoding, semantic automaton bypass, family cross-talk, held cherry-picking, dropped failures, wrong model, CPU fallback, tokenizer drift, exact-check substitution, and protected-file mutation.
      9. Write checkpoints and terminal artifact atomically. Run focused tests, lint, spec coverage, artifact and verdict-row consistency checks, gate audit, adversarial verification, applicable inference and verification E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6609_two_level_constrained_decoding.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The comparison is terminal and never presents a bootstrap or prompt fallback as treatment."
        honest_verdict:
          principle: "The verdict states family and pooled effects, safety, and cost without upgrading row completion to benefit."
        verdict_class:
