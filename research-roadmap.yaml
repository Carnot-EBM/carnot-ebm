    verdict: 'complete: kv260_operator_procedure_documented=True; kv260_pynq_url_reachable=True/False'
    addressed_by: "exp2560 produced operator docs and confirmed URL reachability. This task checks if the operator has since inserted an SD card (/dev/sdb or /dev/mmcblk0) and proceeds to flash if yes, or updates the prep script with any new information (e.g., confirmed-reachable URL from exp2560) if no. Different deliverable: flash validation vs documentation. retire_if_same_verdict=false."
