- id: exp7020-counterexample-belief-ledger
  title: Counterexample-updated ARC belief ledger
  track: continuous-self-learning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.615
  deliverable: results/experiment_7020_counterexample_belief_ledger.json
  gated_on:
    - upstream: exp7019-arc-belief-stream-fixture
      artifact_field: arc_belief_stream_ready_score
      op: '=='
      value: 1
  prior_failures:
    - experiment_id: exp6978-transactional-constraint-self-learning
      verdict: complete_null_transactional_constraint_self_learning
      addressed_by: "Exp7020 learns explicit ARC current-state beliefs from delayed world observations and contradiction clusters; Exp6978 learned generated constraint memory from a different off-ARC stream and showed no positive future value."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The research program requires continuous self-learning. Exp6978 proved a
    transactional generated-constraint memory could run safely, but it did not
    show positive future value. Exp7019 now provides a different substrate:
    chronological ARC actions and observations with sealed future outcomes.
    BB-WM motivates a queryable belief interface. Counterexample-guided
    learning motivates grouped contradiction updates.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md Continuous Self-Learning
    - {project_root}/research-references.md V615 Planner Refresh
    - {project_root}/results/experiment_7019_arc_belief_stream_fixture.json
    - {project_root}/results/experiment_6978_transactional_constraint_self_learning.json
    - {project_root}/results/experiment_5155_multilevel_belief_state_scoping_v472.json
    - {project_root}/python/carnot/agentic/arc_competition_agent.py
    - {project_root}/python/carnot/agentic/arc_world_model_trust_energy.py
    - {project_root}/openspec/capabilities/continuous-learning/spec.md
    - {project_root}/openspec/capabilities/arc-world-model-trust-energy/spec.md

    TASK:
    Implement a small, explicit ARC belief ledger over the Exp7019 stream.
    Maintain known, possible, contradicted, and uncertain facts. Update only
    after the next observation. Cluster counterexamples, tombstone refuted
    beliefs, bound capacity, and provide exact transaction, restart, and
    rollback behavior. Do not train model weights or use held-future fields.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp7019 readiness=1, readable frozen fixtures,
       matching hashes, writable code/test/checkpoint/artifact paths, and no
       hidden future fields in the updater view. On failure write
       blocked_counterexample_belief_ledger with gate_check_summary.
    1. Add REQ-CSL-7020 and REQ-ARC-WMTE-7020 plus RED tests first. Cover
       observation-time writes, four belief states, support updates,
       contradiction clusters, tombstones, capacity eviction, authority
       conflicts, supersession, restart, interruption, rollback, and poison.
    2. Implement `python/carnot/agentic/arc_belief_ledger.py`. Use typed,
       game-blind mechanic keys. Do not use game IDs, source paths, hidden
       rules, solve registry labels, adapters, or later outcomes.
    3. Make each write append-only and hash chained. A belief becomes known
       only after minimum support. A direct contradiction weakens or
       tombstones it before later queries can use it.
    4. Keep a bounded capacity and deterministic eviction rule. Protect
       supported non-conflicting beliefs from an unrelated poison cluster.
    5. Provide snapshot, restart, byte-exact rollback, and audit-state APIs.
       A failed write must leave the prior state unchanged.
    6. Replay the construction portion of Exp7019. Report writes, rejects,
       contradictions, tombstones, retention, and query support per event.
       This task proves the substrate, not future utility.
    7. Set belief_ledger_ready_score=1 only when all safety fixtures pass,
       fresh-process replay is deterministic, and zero future fields enter a
       write or query.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (deterministic_arc_belief_ledger_replay_no_llm);
       duration_s; cited_upstream_artifacts with experiment_id,
       fields_imported, and sha256; source_artifact_hashes; rows;
       per_event_results; belief_state_rows; update_rows; rejection_rows;
       contradiction_cluster_rows; tombstone_rows; capacity_rows;
       authority_conflict_rows; supersession_rows; poison_rows;
       retention_rows; transaction_rows; restart_rows; rollback_rows;
       leakage_check_rows; snapshot_hashes; ledger_state_bytes;
       belief_ledger_ready_score; random_seed; reproducibility_checksum;
       gate_check_summary with failed check, expected value, and observed
       value for any blocked verdict; verifier_is_oracle (false);
       verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7020_counterexample_belief_ledger.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7021-prospective-belief-utility
  title: Prospective held-future belief utility comparison
  track: continuous-self-learning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.615
  deliverable: results/experiment_7021_prospective_belief_utility.json
  gated_on:
    - upstream: exp7020-counterexample-belief-ledger
      artifact_field: belief_ledger_ready_score
      op: '=='
      value: 1
  prior_failures:
    - experiment_id: exp6873-prospective-sealed-self-learning-audit
      verdict: complete_null_prospective_sealed_self_learning_utility_not_demonstrated
      addressed_by: "Exp7021 scores distinct later ARC decision units with game-blind belief queries and a capacity-matched recency control; Exp6873 used an off-ARC reliability controller whose quarantine arm did not beat read-only on every order."
      retire_if_same_verdict: true
    - experiment_id: exp6978-transactional-constraint-self-learning
      verdict: complete_null_transactional_constraint_self_learning
      addressed_by: "Exp7021 makes later action-ranking value the primary outcome and cannot claim success from transactions, write acceptance, or replay fit."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    A durable memory is not useful merely because it writes and reloads.
    Exp6873 and Exp6978 established that distinction. V615 must measure whether
    beliefs formed before a decision improve a later, distinct ARC decision.
    The comparison must preserve chronology and give the recency control the
    same memory capacity.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_7019_arc_belief_stream_fixture.json
    - {project_root}/results/experiment_7020_counterexample_belief_ledger.json
    - {project_root}/results/experiment_6873_prospective_sealed_self_learning_audit.json
    - {project_root}/results/experiment_6978_transactional_constraint_self_learning.json
    - {project_root}/python/carnot/agentic/arc_belief_ledger.py
    - {project_root}/openspec/capabilities/continuous-learning/spec.md
    - {project_root}/openspec/capabilities/arc-world-model-trust-energy/spec.md

    TASK:
    Run a sealed chronological comparison of frozen, capacity-matched
    recency-only, and counterexample-belief policies. Score only decisions
    that occur after the evidence used for their memory state. Measure held
    future action ranking, contradiction avoidance, retention, and cost from
    rows. Do not use an LLM or current-outcome oracle.

    CONCRETE STEPS:
