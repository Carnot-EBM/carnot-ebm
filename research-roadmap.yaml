  - id: exp2589
    title: "JEPA v3 Online Integration: Real-Data Checkpoint → VerifyRepairPipeline"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: continuous_self_learning
    continuous_self_learning_task: true

    context: |
      FR-11 Autonomous Self-Learning Loop Tier 3 (JEPA predictive verification) requires
      the JEPAFastPathPredictor to be integrated into VerifyRepairPipeline with online-update
      capability. The predictor was trained in exp2565 (n=6548 real FoVer examples, AUC>0.889),
      checkpoint saved. This task wires that checkpoint into the live pipeline.

      The OSCAR paper (arXiv:2605.00323) provides a strong comparator: MCTS with dual-granularity
      rewards (token + sequence level) for online calibration. The online_update() design should
      consider a similar dual-granularity signal: per-token energy delta + sequence-level
      verification outcome.

    existing_code_to_read:
