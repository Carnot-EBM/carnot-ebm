  - id: exp1702-findings-audit-and-corrigenda
    title: "Exp 1702: .171 adversarial-verify findings audit + corrigenda pass"
    deliverable: results/experiment_1702_findings_audit_171.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: medium
    prior_failures: []
    prompt: |
      CONTEXT: Standard end-of-milestone audit per CLAUDE.md "Adversarial
      Artifact Verification" rule. Run adversarial-verify on the .171
      artifact set, classify each flag, and append corrigendum fields
      (CLAUDE.md no-pruning policy — add the corrigendum, do NOT modify
      original methodology fields).

      FALSIFIABLE HYPOTHESIS: Each .171 flagged artifact is either (a) a
      real methodology bug, (b) a false-positive from pattern-matching,
      or (c) a methodology smell needing future revision. The audit
      classifies all flagged artifacts and either ships corrigenda or
      proposes adversarial_verify.py exceptions for false positives.

      EXISTING CODE TO READ FIRST:
        - scripts/adversarial_verify.py (the 7 detection rules)
        - results/experiment_169[2-9]*.json (the .171 artifact set)
        - results/operational_retro_2026_05_171.json (if exists)

      TASK: Run `python3 scripts/adversarial_verify.py --milestone-range
      1692 1697` and process each flagged artifact.

      CONCRETE STEPS:
        1. Run adversarial-verify and capture the JSON output.
        2. For each flagged artifact (if any), classify the flag as
           REAL_BUG / FALSE_POSITIVE / NEEDS_REVISION.
        3. Append a `corrigendum_2026_05_172_audit` field to each flagged
