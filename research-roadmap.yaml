- id: exp2359-self-adaptive-ising
  title: 'Phase 4: Self-Adaptive Ising Machine with Lagrange Relaxation (arXiv:2501.04971)'
  milestone: 2026.05.230
  deliverable: results/experiment_2359_self_adaptive_ising.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prompt: "CONTEXT: \"Self-Adaptive Ising Machines for Constrained Optimization\" (arXiv:2501.04971)\nintroduces Lagrange\
    \ multiplier updates to iteratively reshape the Ising energy landscape for\nconstrained problems. Instead of requiring\
    \ constraint penalties to be manually tuned, the\nmachine automatically adjusts them until constraints are satisfied.\
    \ This outperforms Fujitsu's\nDigital Annealer on 300-variable quadratic knapsack problems with far fewer samples.\n\n\
    For Carnot: this addresses the penalty-tuning problem in the parallel Ising sampler\n(python/carnot/samplers/parallel_ising.py).\
    \ Constraint violations are currently handled by\nfixed penalty terms. Lagrangian updates would make the sampler self-correcting.\n\
    \nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/samplers/ (look for parallel_ising.py or gibbs_sampler.py)\n\
    \  {project_root}/scripts/experiment_template.py\n\nTASK: Implement self-adaptive Lagrangian Ising sampler and benchmark.\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS: none (pure numpy/CPU).\n\n  1. Implement SelfAdaptiveIsingSampler at python/carnot/samplers/adaptive_ising.py:\n\
    \     - Initialize: J (coupling matrix), h (bias), lambdas (Lagrange multipliers, zeros)\n     - constraint_fn: function\
    \ mapping state -> constraint violations (list of scalars)\n     - sample_step(): Gibbs sweep over all spins\n     - lagrange_update():\
    \ lambdas += lr * constraint_violations (gradient ascent on dual)\n     - solve(n_outer=50, n_inner=10): outer loop =\
    \ lagrange updates, inner = Gibbs sweeps\n\n  2. Benchmark on 2 constrained Ising problems:\n     - Problem A: 16-spin\
    \ ferromagnet with sum constraint (sum(s) == 4)\n     - Problem B: 32-spin random coupling with linear equality constraint\n\
    \     Metrics: final_constraint_violation (||g(s)||), convergence_rate (iter to feasibility)\n\n  3. Compare to fixed-penalty\
    \ baseline (same problems, fixed penalty=1.0).\n     adaptive_speedup = fixed_iters / adaptive_iters to reach violation\
    \ < 0.1.\n\n  4. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix\
    \ required.\"\n  - adaptive_ising_validated:\n      principle: \"True if adaptive_speedup >= 1.5x on at least 1 of 2 problems.\"\
    \n  - adaptive_speedup:\n      principle: \"Iterations ratio: fixed-penalty / adaptive Lagrangian to feasibility.\"\n\
    \  - final_constraint_violation:\n      principle: \"Constraint residual after convergence. Adversarial check: should\
    \ be near 0.\"\n  - n_problems:\n      principle: \"Must be 2.\"\n  - random_seed:\n      principle: \"Reproducibility.\
    \ Must be 42.\"\n\nRun command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'\n"
