milestone: "2026.08.560"
milestone_title: "Trajectory Energy, Anytime Factor Memory, and ARC Decision Alignment"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6488-v559-decision-ledger-v560-lineage-lock
    milestone: "2026.08.560"
    deliverable: results/experiment_6488_v559_decision_ledger.json
    title: "V559 evidence decision ledger and V560 solver-trajectory lineage lock"
    priority: critical
    track: research-governance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 20
    estimated_wall_time_min: 30
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6487-representation-integrity-audit
        verdict: "disqualified: candidate_identifier_length,candidate_identity,row_order_modulo_pair,token_length_unavailable_from_raw_rows,candidate_length_unavailable_from_raw_rows,prompt_length_unavailable_from_raw_rows"
        addressed_by: "This task does not repair or rerun the selector; it freezes the disqualification in a decision ledger and permits only a different exact solver-trajectory lineage."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V559 completed Exp6483-Exp6487. The source, receipt, and transition contracts are reusable, but the prospective forced-candidate representation stream is not selector-eligible: candidate identifier length, candidate identity, and row-order parity each perfectly predict labels, and token, prompt, and candidate lengths cannot be reconstructed from the raw rows. V560 must freeze that scientific boundary before opening a distinct exact solver-trajectory lineage. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6483_v559_latent_energy_sota_ingestion.json
      - {project_root}/results/experiment_6484_non_generation_representation_receipt_contract.json
      - {project_root}/results/experiment_6485_online_cache_transition_eprocess_contract.json
      - {project_root}/results/experiment_6486_three_family_forced_candidate_representations.json
      - {project_root}/results/experiment_6487_representation_integrity_audit.json
      - {project_root}/ops/exclusion_manifest.yaml, {project_root}/research-complete.yaml, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build a row-recomputed V559 decision ledger. Freeze the disqualified forced-candidate representation-selector scope and define the exact allowed V560 solver-trajectory lineage. Preserve reusable infrastructure without laundering the failed rows into a new claim.

      CONCRETE STEPS
      0. Record git status and hashes for every V559 artifact. Confirm research-roadmap.yaml and scripts/research_conductor.py are protected.
      1. Add or confirm a REQ-* and SCENARIO anchor for terminal research-lineage decisions. Write focused tests before the reducer.
      2. Recompute Exp6483-Exp6487 readiness, row counts, shortcut outcomes, and missing evidence directly from their rows and receipts.
      3. Emit one decision row per V559 claim surface with disposition reuse, freeze, retire, or informational_only and a source field.
      4. Define the allowed V560 lineage as prospective exact-solver states, early-to-final persistence labels, identity-free features, exact replay, and no hidden-state selector reuse.
      5. Reject attacks that relabel V559 candidates, repair lengths post hoc, filter shortcut rows, reuse a fitted representation transform, or cite contract readiness as scientific signal.
      6. Set v560_lineage_lock_ready_score=1.0 only if every V559 disposition recomputes and every forbidden reuse fails closed.
      7. Emit {project_root}/results/experiment_6488_v559_decision_ledger.json and update relevant OpenSpec, traceability, status, and changelog records only after the artifact is valid.
      8. Run focused tests, spec coverage, verdict-row consistency lint, adversarial verification, relevant documentation checks from ops/e2e-test-plan.md, and git status.

      Required deliverable: {project_root}/results/experiment_6488_v559_decision_ledger.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal ledger state."
        v559_artifact_receipts: "Paths and hashes for Exp6483-Exp6487."
        decision_rows: "One row per V559 claim surface and disposition."
        aggregate_row_recomputation: "Recomputed V559 counts, gates, and shortcut outcomes."
        retired_scope_definition: "Exact forced-candidate selector boundary."
        allowed_v560_lineage: "Prospective solver-trajectory scope."
        forbidden_reuse_attack_matrix: "Post-hoc repair and laundering attacks."
        v560_lineage_lock_ready_score: "Same-roadmap downstream gate field."
        per_unit_rows: "Decision and attack rows."
        gate_check_summary: "Required for any blocked_* verdict."
        preconditions_checked: "Artifacts, exclusion manifest, and repository state."
        protected_files_unchanged: "Active roadmap and conductor unchanged."
        inference_substrate: "artifact_reducer_no_llm."
        verifier_is_oracle: "True only for deterministic row and hash recomputation."
        field_principles: "Reason for each evidence field."
        field_provenance: "Artifact paths, JSON pointers, and reducer functions."
        random_seed: "Fixed attack ordering seed."
        duration_s: "Measured wall time."
        tests_run: "Commands and exit codes."
        reproducibility_checksum: "Hash over source receipts, decisions, and attacks."
        honest_verdict: "complete_* when the ledger is valid, otherwise blocked_* with gate_check_summary."
      ACCEPTANCE GATES:
        - condition: "v560_lineage_lock_ready_score == 1.0."
        - condition: "No V559 forced-candidate row is eligible for a V560 selector headline."
      Set inference_substrate=artifact_reducer_no_llm. Set verifier_is_oracle=true only for deterministic row and hash recomputation.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6488_v559_decision_ledger --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6489-immutable-solver-trajectory-commitment
    milestone: "2026.08.560"
    deliverable: results/experiment_6489_solver_trajectory_commitment.json
    title: "Immutable early-to-final exact solver trajectory commitment"
    priority: critical
    track: data-and-evidence
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 90
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6488-v559-decision-ledger-v560-lineage-lock
        artifact_field: v560_lineage_lock_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6463-sota-fixed-policy-candidate-corpus-v2
        verdict: "complete: fixed-policy corpus v2 finished but readiness gate stayed closed"
        addressed_by: "The commitment contains exact-backend solver trajectories and final-solution persistence labels with no generated candidates or LLM output, replacing the retired fixed-policy answer-corpus shape."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6482 sealed 48 prospective exact constraint units across quota allocation, route ordering, and Boolean guards. V559 showed that static forced candidates can carry fatal construction shortcuts. V560 instead observes chronological states produced by exact solvers and labels whether early assignments or constraints persist to the final exact solution. The commitment must be immutable before any learned baseline or local model sees the rows. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/_bmad/architecture.md, and the V560 roadmap document
      - {project_root}/results/experiment_6482_prospective_constraint_stream_commitment.json
      - {project_root}/results/experiment_6488_v559_decision_ledger.json
      - exact solver, energy, and commitment modules under {project_root}/python/carnot/
      - the focused tests for Exp6478, Exp6481, and Exp6482
      - relevant OpenSpec capability files, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/e2e-test-plan.md

      TASK
      Instrument the existing exact backends to create a prospective early-to-final trajectory corpus. Persist raw chronological solver events, final exact outcomes, persistence labels, identity-free feature contracts, held splits, and leakage attacks before any fitting.

      CONCRETE STEPS
      0. Evaluate the structured gate and copy its observed field/value into gate_check_summary. Record repository state and Exp6482 checksums.
      1. Add REQ-* and SCENARIO anchors for prospective solver trajectories, exact-label authority, immutable splits, and leakage controls. Write failing focused tests first.
      2. Reuse the Exp6482 committed unit identities and exact backends. Do not add an LLM, generated label, post-hoc instance filter, or hand-corrected trajectory.
      3. Record chronological early states at precommitted solver checkpoints. Include assignments, constraint residuals, exact bounds, branch depth, event time, backend, family, and final exact outcome.
      4. Derive early-to-final persistence labels only from the recorded final exact solution and a versioned reducer. Keep raw solver records immutable and separately hashed.
      5. Commit train, development, and held splits by instance before feature extraction. Balance families and checkpoints without inspecting labels.
      6. Define identity-free feature groups. Add attacks for row order, unit ID, backend, family, serialization length, checkpoint index, and duplicate trajectory leakage.
      7. Emit one row per solver event and one receipt per unit, split, backend, attack, and checksum. Set trajectory_contract_ready_score=1.0 only if exact replay and every commitment invariant pass.
      8. Run focused tests, full task-module coverage, spec coverage, row lint, adversarial verification, exact-backend E2E checks, and git status. Reconcile the applicable specs and ops documents.

      Required deliverable: {project_root}/results/experiment_6489_solver_trajectory_commitment.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal trajectory commitment state."
        upstream_gate_receipt: "Exp6488 path, hash, field, expected, and observed value."
        source_stream_receipt: "Exp6482 path and checksum."
        trajectory_schema: "Versioned chronological exact-solver event schema."
        raw_trajectory_rows: "One row per immutable solver checkpoint event."
        final_exact_outcome_rows: "Exact solution and validity authority per unit."
        persistence_label_rows: "Early-to-final labels bound to raw hashes."
        split_commitment: "Pre-feature unit-level train, development, and held split."
        identity_free_feature_contract: "Allowed and forbidden feature fields."
        family_backend_balance_rows: "Counts and parity by family and backend."
        leakage_attack_matrix: "Identity, order, length, checkpoint, and duplicate attacks."
        trajectory_contract_ready_score: "Same-roadmap downstream gate field."
        per_unit_rows: "Trajectory, unit, split, and attack rows."
        aggregate_row_recomputation: "Counts and ready score recomputed from rows."
        gate_check_summary: "Exact gate evaluation or blocked_* reason and observed value."
        preconditions_checked: "Lineage lock, exact backends, and stream commitment."
        protected_files_unchanged: "Active roadmap and conductor unchanged."
        inference_substrate: "exact_solver_trajectory_recording_no_llm."
        verifier_is_oracle: "True for final exact backend outcomes only."
        field_principles: "Reason for each feature and evidence field."
        field_provenance: "Source modules, instance hashes, and reducers."
        random_seed: "Fixed split and checkpoint seed."
        duration_s: "Measured wall time."
        tests_run: "Commands and exit codes."
        reproducibility_checksum: "Hash over source stream, splits, trajectories, and labels."
        honest_verdict: "complete_* when commitment is valid, otherwise blocked_* with gate_check_summary."
      ACCEPTANCE GATES:
        - condition: "trajectory_contract_ready_score == 1.0."
        - condition: "Every label is reproducible from final exact outcomes and every held split predates feature extraction."
      Set inference_substrate=exact_solver_trajectory_recording_no_llm. Set verifier_is_oracle=true only for final exact backend outcomes.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6489_solver_trajectory_commitment --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6490-leakage-neutral-trajectory-energy-baselines
    milestone: "2026.08.560"
    deliverable: results/experiment_6490_trajectory_energy_baselines.json
    title: "Leakage-neutral early-to-final trajectory energy baseline comparison"
    priority: critical
    track: energy-science
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6489-immutable-solver-trajectory-commitment
        artifact_field: trajectory_contract_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp5853-paired-embedding-integrity-audit
        verdict: "disqualified: claim_flip_direction_cell_failure,disaggregated_cell_failure,label_or_pair_permutation_survives,norm_only_or_length_control_failure,raw_model_dimension_identity_shortcut"
        addressed_by: "This attempt removes pooled model representations entirely and uses precommitted identity-free exact-solver trajectory features with unit-level held splits, raw rows, and the same shortcut attacks before any headline."
        retire_if_same_verdict: true
      - experiment_id: exp6487-representation-integrity-audit
        verdict: "disqualified: candidate_identifier_length,candidate_identity,row_order_modulo_pair,token_length_unavailable_from_raw_rows,candidate_length_unavailable_from_raw_rows,prompt_length_unavailable_from_raw_rows"
        addressed_by: "This is a different observable and label process: exact chronological solver states and early-to-final persistence replace forced candidate identities, and all relevant lengths are present in immutable raw rows before fitting."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The V559 forced-candidate selector is retired. Exp6489 supplies a distinct prospective corpus of exact solver states labeled by persistence to final exact solutions. The scientific question is whether compact energy heads find held early-to-final structure beyond analytical energy and construction shortcuts. A clean null is acceptable and must retire this learned-trajectory branch if it repeats the prior integrity verdict. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md and the V560 roadmap document
      - {project_root}/results/experiment_5853_paired_embedding_integrity_audit.json
      - {project_root}/results/experiment_6487_representation_integrity_audit.json
      - {project_root}/results/experiment_6489_solver_trajectory_commitment.json
      - {project_root}/results/experiment_6478_held_exact_constraint_energy_selection.json
      - existing energy, KAN, calibration, and statistical modules under {project_root}/python/carnot/
      - relevant focused tests, OpenSpec files, exclusion manifest, and ops/e2e-test-plan.md

      TASK
      Compare frozen analytical early energy, regularized linear, compact MLP, and compact KAN persistence heads on Exp6489 trajectories. Use development data for fitting and thresholds once, held units once, and explicit shortcut controls. Do not use an LLM.

      CONCRETE STEPS
      0. Evaluate the Exp6489 gate and record artifact hash, field, expected, and observed value. Confirm both prior failure verdicts and the changed scope.
      1. Add REQ-* and SCENARIO anchors for held trajectory discrimination, family-separated reporting, shortcut rejection, and branch retirement. Write tests first.
      2. Freeze feature groups, preprocessing, architectures, parameter budgets, seeds, metrics, and decision thresholds before held evaluation.
      3. Fit analytical-only, regularized linear, compact MLP, compact KAN, label-shuffle, row-order, identifier, length, norm, family, backend, and checkpoint controls. Match learned parameter budgets where practical.
      4. Report per-unit and per-checkpoint persistence loss, balanced accuracy, AUROC where defined, calibration, family cells, and confidence intervals. Never pool away a failing family.
      5. Repeat claim-flip, label permutation, split permutation, duplicate leakage, raw-length, order, identity, norm, family, and backend attacks.
      6. Set trajectory_signal_ready_score=1.0 only if a predeclared learned head beats analytical and shuffled controls on held units, survives every shortcut attack, has no disqualifying family cell, and all row-derived headlines recompute.
      7. If the prior no-signal or shortcut verdict repeats, use an honest complete_null or disqualified verdict and preserve retirement receipts; do not tune after held access.
      8. Emit the artifact, run focused tests, full task-module coverage, spec coverage, statistical checks, row lint, adversarial verification, applicable E2E checks, and git status. Reconcile specs and ops docs.

      Required deliverable: {project_root}/results/experiment_6490_trajectory_energy_baselines.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal comparative evaluation state."
        upstream_gate_receipt: "Exp6489 artifact hash and exact gate values."
        frozen_analysis_manifest: "Features, heads, budgets, metrics, seeds, and thresholds."
        model_configuration_rows: "Analytical, linear, MLP, KAN, and control definitions."
        rows: "Per unit, checkpoint, seed, family, backend, head, and control metrics."
        family_cell_results: "Disaggregated held results."
        calibration_rows: "Held calibration by head and cell."
        confidence_intervals: "Predeclared uncertainty estimates from unit-level rows."
        shortcut_attack_matrix: "Identity, order, length, norm, split, family, and backend attacks."
        harmful_flip_rows: "Any learned reversal of an exact-valid analytical decision."
        trajectory_signal_ready_score: "Same-roadmap downstream gate field."
        branch_retirement_receipt: "Outcome against Exp5853 and Exp6487 verdicts."
        per_unit_rows: "Required unit/checkpoint/seed comparison rows."
        aggregate_row_recomputation: "Every headline recomputed from rows."
        gate_check_summary: "Exact gate evaluation or blocked_* reason and observed value."
        preconditions_checked: "Commitment, split, prior failures, and feature contract."
        protected_files_unchanged: "Active roadmap and conductor unchanged."
        inference_substrate: "local_compact_energy_heads_on_exact_solver_features_no_llm."
        verifier_is_oracle: "True for exact final outcomes; learned heads are not oracles."
        field_principles: "Reason for each metric and control."
        field_provenance: "Raw row hashes, reducers, and source modules."
        random_seed: "All fit, split, and interval seeds."
        duration_s: "Measured wall time."
        tests_run: "Commands and exit codes."
        reproducibility_checksum: "Hash over frozen manifest, rows, and attacks."
        honest_verdict: "complete_positive, complete_null, disqualified, or blocked_* with diagnostics."
      ACCEPTANCE GATES:
        - condition: "All analytical, learned, and control arms emit held per-unit rows and recomputable metrics."
        - condition: "trajectory_signal_ready_score is positive only after every shortcut and family-cell gate passes."
      Set inference_substrate=local_compact_energy_heads_on_exact_solver_features_no_llm. Set verifier_is_oracle=true only for exact final outcomes.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6490_trajectory_energy_baselines --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6491-local-sota-atomic-factor-proposal-stream
    milestone: "2026.08.560"
    deliverable: results/experiment_6491_sota_factor_proposal_stream.json
    title: "Prospective local-SOTA atomic constraint factor proposal stream"
    priority: critical
    track: model-proposals
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6488-v559-decision-ledger-v560-lineage-lock
        artifact_field: v560_lineage_lock_ready_score
        op: "=="
        value: 1.0
      - upstream: exp6489-immutable-solver-trajectory-commitment
        artifact_field: trajectory_contract_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6463-sota-fixed-policy-candidate-corpus-v2
        verdict: "complete: fixed-policy corpus v2 finished but readiness gate stayed closed"
        addressed_by: "The deliverable changes from answer-policy candidate generation to one-shot atomic factor proposals on a new exact solver-trajectory stream; models never emit answers, see held labels, or retry to satisfy a fixed slot."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6463's fixed-policy answer-corpus lineage is retired. V560 permits a distinct use of local SOTA models: at precommitted development-only solver divergences, a model may propose one atomic constraint factor for exact compilation and later causal replay. It cannot label data, answer the task, see held outcomes, retry until accepted, or act as verifier. Every local inference must have a raw-byte receipt. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md, especially GGUF and failed-experiment discipline
      - {project_root}/research-program.md, {project_root}/research-references.md, and the V560 roadmap document
      - {project_root}/results/experiment_6463_sota_fixed_policy_candidate_corpus_v2.json
      - {project_root}/results/experiment_6484_non_generation_representation_receipt_contract.json
      - {project_root}/results/experiment_6488_v559_decision_ledger.json
      - {project_root}/results/experiment_6489_solver_trajectory_commitment.json
      - {project_root}/scripts/experiment_template.py and its cached_sota_pair() documentation
      - local GGUF runtime, receipt, exact compiler, and model cache code under {project_root}/python/carnot/
      - relevant tests, OpenSpec files, exclusion manifest, and ops/e2e-test-plan.md

      TASK
      Create an immutable development-only stream of one-shot atomic factor proposals from the mandated local SOTA GGUF models. Exact compilation decides syntactic and semantic admissibility. Persist requests, responses, timing, backend, and proposal receipts; make no quality claim yet.

      CONCRETE STEPS
      0. Evaluate both gates and record exact upstream paths, hashes, fields, expected values, and observed values. Confirm the Exp6463 prior verdict and changed scope.
      1. Add REQ-* and SCENARIO anchors for one-shot local-GGUF factor proposals, raw-byte receipts, held isolation, exact compilation, and model non-authority. Write focused tests first.
      2. Define MODEL_SPECS using the cached_sota_pair() pattern and include all three mandated repositories: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Produce evidence with at least one Qwen flagship and one Gemma flagship/middle model; record any third-model resource block honestly.
      3. Use llama_cpp with the GGUF-embedded tokenizer. Never call transformers.AutoTokenizer on a GGUF repository. Record model file hash, quantization, runtime version, n_gpu_layers, actual backend, and load receipt.
      4. Freeze development divergence events and prompts before model access. Give each model only the allowed solver prefix and factor schema, never the final outcome or held rows.
      5. Request exactly one atomic factor per event with no answer field, constrained answer grammar, retry-to-valid loop, rank-and-select loop, or post-response prompt edit. Persist exact request and response bytes before parsing.
      6. Pass parsed factors to the existing exact compiler. Record accept, reject, duplicate, timeout, and no-proposal outcomes without using compiler success as a model-quality headline.
      7. Add attacks for held-label access, answer emission, retry, response rewrite, missing raw bytes, wrong tokenizer path, model-identity omission, duplicate factor, and post-hoc event selection.
      8. Set factor_proposal_stream_ready_score=1.0 only if at least two mandated model families complete precommitted events with valid receipts and no boundary violation. Emit the artifact and run focused tests, spec coverage, receipt checks, row lint, adversarial verification, applicable GPU/model E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6491_sota_factor_proposal_stream.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal local proposal-stream state."
        upstream_gate_receipts: "Both upstream artifact hashes and exact gate values."
        model_specs: "All three mandated repository IDs, files, quantizations, and roles."
        model_load_receipts: "Runtime, embedded tokenizer, backend, n_gpu_layers, hashes, and failures."
        frozen_event_manifest: "Development-only divergence events committed before model access."
        prompt_commitment: "Allowed context, schema, and prompt hashes."
        raw_request_response_receipts: "Immutable byte paths and hashes before parsing."
        proposal_rows: "One row per event and model, including no-proposal outcomes."
        exact_compile_rows: "Accepted, rejected, duplicate, timeout, and reason per proposal."
        held_isolation_receipts: "Proof that held outcomes were inaccessible."
        non_authority_receipts: "Proof that model output did not label, verify, or release an answer."
        boundary_attack_matrix: "Held access, answer, retry, rewrite, tokenizer, and selection attacks."
        factor_proposal_stream_ready_score: "Same-roadmap downstream gate field."
        prior_lineage_retirement_receipt: "Changed scope and Exp6463 comparison."
        per_unit_rows: "Event/model/proposal/compiler rows."
        aggregate_row_recomputation: "Counts and ready score recomputed from rows."
        gate_check_summary: "Exact gate evaluation or blocked_* reason and observed value."
        preconditions_checked: "Models, runtime, development split, compiler, and retired lineage."
        protected_files_unchanged: "Active roadmap and conductor unchanged."
        inference_substrate: "local_llama_cpp_gguf_atomic_factor_proposals."
        verifier_is_oracle: "False for model proposals; true only for exact compilation facts."
        field_principles: "Reason for every receipt and boundary field."
        field_provenance: "Raw bytes, file hashes, runtime receipts, and compiler reducers."
        random_seed: "Frozen event and model-order seeds."
        duration_s: "Measured inference and task wall time."
        tests_run: "Commands and exit codes."
        reproducibility_checksum: "Hash over models, events, raw bytes, and compile rows."
        honest_verdict: "complete_* when the stream is valid, otherwise blocked_* with gate_check_summary."
      ACCEPTANCE GATES:
        - condition: "factor_proposal_stream_ready_score == 1.0 only after two mandated model families complete valid one-shot events."
        - condition: "No model output serves as an answer, label, verifier, or release authority."
      Set inference_substrate=local_llama_cpp_gguf_atomic_factor_proposals. Set verifier_is_oracle=false for model proposals.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6491_sota_factor_proposal_stream --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

