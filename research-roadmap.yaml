    milestone: "2026.06.371"
    title: "GAP-5 CROSS-EXAMPLE-CONSISTENCY SELECTOR upgrade (build against the logged GAP-5 demo-underdetermination gap per the Missing-Verifier Gap Logging mandate): exp4001 logged GAP-5 (multiple demo-consistent programs disagree on the test = the verifier cannot select among them). Build a STRONGER discriminator than plain output-agreement: among induced demo-perfect programs, score each by (a) cross-DEMONSTRATION consistency (does it reproduce held-out demo pairs, leave-one-demo-out) and (b) SIBLING-INPUT agreement (do the candidate programs agree on perturbed/sibling inputs). Measure whether this lifts precision and/or coverage over plain final-grid output-agreement on the SAME ARC-2 chain-feasible pool (reuse the cached induced programs; NO new codex calls if the saved programs suffice). The cleanest off-the-shelf design (arXiv:2604.02434 cross-example consistency filtering). A new registry-eligible discriminator that closes a logged gap is direct progress on Carnot's core."
    priority: high
    track: research
    max_turns: 80
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4010_gap5_cross_example_consistency_selector.json
    prompt: |
      CONTEXT. The GAP-4 verifier selects via final-grid output-AGREEMENT among independently-induced
      programs, but exp4001 logged GAP-5: when several demo-consistent programs DISAGREE on the test
      output, agreement cannot pick the right one (demo-underdetermination). The remedy in the literature
      (arXiv:2604.02434, cross-example consistency filtering) is to score candidates by consistency ACROSS
      demonstrations and across SIBLING inputs, not just by final-output voting. This task builds that
      stronger discriminator and measures whether it lifts precision/coverage over plain output-agreement.

      EXISTING CODE TO READ + REUSE:
        - results/arc3_gap4_arc2_induced_programs.json + results/arc3_gap4_induced_programs.json (the SAVED
          induced programs per task -- reuse them; no new codex calls if these suffice)
        - results/arc3_gap4_arc2_chain_ensemble.json (the chain-arm harness + the per-task candidate sets)
        - results/arc3_gap4_arc2_eval_pool.json.gz (the demos + sibling inputs per task)
        - ops/verifier_gaps.md (the GAP-5 entry: failure mode + the sibling-input missing discriminator)
        - python/carnot/agentic/arc_world_model_synth.py (consistency_energy / grade_predictions -- the
          model-free execution primitives to score leave-one-demo-out + sibling consistency)

      CONCRETE STEPS:
        0. PRECONDITIONS: the saved induced-program artifacts load AND the eval pool loads. Else honest_verdict
           blocked_saved_programs_missing / blocked_eval_pool_unreadable and EXIT.
        1. For each ARC-2 chain-feasible task with >=2 demo-perfect candidate programs: compute, per candidate,
           (a) leave-one-demo-out reproduction rate (cross-demonstration consistency) and (b) sibling-input
           agreement (fraction of OTHER candidates that produce the same output on perturbed/sibling inputs).
        2. Define the cross-example-consistency SELECTOR: pick the candidate maximizing the combined score;
           abstain when no candidate dominates (the GAP-5 tripwire). Compare its precision (P(gold | selected))
           and coverage (fraction of tasks with a confident selection) against the plain output-agreement baseline.
        3. Report whether the cross-example selector BEATS output-agreement on precision and/or coverage, with
           a paired comparison + CI. If new codex calls are needed to fill missing candidates, gate them behind
           a `command -v codex` precondition and >=600s timeouts; else operate purely offline on saved programs.

      REQUIRED ARTIFACT FIELDS: (BARE scalars; principle: lines guide YOU)
        cross_example_precision: principle "BARE FLOAT -- P(gold | cross-example-consistency selected) on the ARC-2 pool (the precision side)."
        output_agreement_precision_ref: principle "BARE FLOAT -- the plain output-agreement precision baseline (the must-beat)."
        cross_example_coverage: principle "BARE FLOAT -- fraction of tasks with a confident cross-example selection (the coverage side)."
        selector_beats_output_agreement: principle "BARE BOOL -- does the cross-example selector beat output-agreement on precision and/or coverage with a CI excluding 0 (the verifier-improvement claim)."
        sibling_abstention_gold_rate: principle "BARE FLOAT -- gold rate on tasks where the selector abstains due to sibling-input disagreement (the GAP-5 tripwire datum)."
        n_tasks_scored, n_codex_calls: principle "Coverage provenance + whether any new codex calls were made (0 = pure offline replay = cheapest)."
        missing_verifier_gaps: principle "What the cross-example selector still cannot disambiguate (the next gap per the Missing-Verifier Gap Logging mandate)."
        random_seed, honest_verdict, duration_s, inference_substrate: principle "Reproducibility + terminal-prefix verdict + the aggregation/offline substrate."

      honest_verdict MUST start with `complete:`/`success:` or `blocked_<resource>`. A lift is
      `success: gap5_cross_example_selector_beats_agreement_prec<val>_cov<val>`. No lift is an honest
      `complete: gap5_cross_example_no_better_than_agreement_<reason>` (a real bounded finding on the logged gap).
      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_4010_gap5_cross_example_consistency_selector.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

