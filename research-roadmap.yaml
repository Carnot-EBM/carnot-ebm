    retire_if_same_verdict: true
  model: opus
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V706 scheduled fourteen tasks, produced eleven primaries and three gate skips. Its contract shape passed, but historical log and specification hashes changed. The original blocked verdict must remain visible.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/v685_authority_lifecycle.py; python/carnot/reporting/roadmap_contract.py; results/experiment_8164_v706_contract_custody.json; results/experiment_8177_v706_capstone.json; research-roadmap.yaml; ops/conductor-log.md; openspec/change-proposals/research-roadmap-v706-preserved-20261005.md
