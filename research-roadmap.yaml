      TASK
      Produce a flag-hygiene artifact that classifies .284 matrix/capstone flags into real blockers, aggregation-substrate false positives, missing metadata, unresolved bounds, hardware blocks, and gate-skipped rows.

      CONCRETE STEPS
      1. Load the .284 repair, matrix, and capstone artifacts and collect every adversarial flag, methodology flag, missing row, blocked row, and gate-skipped row.
