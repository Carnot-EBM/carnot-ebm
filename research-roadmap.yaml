           self.error_type_counts[error_type] = self.error_type_counts.get(error_type, 0) + 1
           if was_repaired:
             self.error_type_repair_successes[error_type] = (
               self.error_type_repair_successes.get(error_type, 0) + 1)

         get_active_constraints(self) -> list[str]:
           Return constraint types for error categories with >= min_observations_for_template.
           E.g. if "syntax_error" count >= 3: add "syntax_check" constraint.
           Map: syntax_error → "syntax_check"; name_error → "import_check";
                type_error → "type_check"; index_error → "bounds_check";
                assertion_error → "assertion_check"; logic_error → "logic_check"

         repair_success_rate(self, error_type: str) -> float:
           Return successes / max(1, counts) for given error type.

    4. Add spec entries: REQ-LEARN-045 (CodeCaseMemory accumulates error-type patterns
       from code repair sessions), SCENARIO-LEARN-045 (after 3+ syntax errors, syntax_check
       constraint auto-added).
    5. Create scripts/experiment_926_fr11_tier2_code_domain.py:
       a. tmpl = ExperimentTemplate(926, ..., requires_gpu=False). tmpl.setup().
       b. Load Exp 905 + Exp 906 repair logs. Extract and classify all error types.
       c. mem = CodeCaseMemory()
       d. Simulate 5 accumulation sessions (replay the logs in chronological order):
          Session 1: first 10 attempts from Exp 905.
          Session 2: next 10 from Exp 905.
          Session 3: first 10 from Exp 906.
          Session 4: next 10 from Exp 906.
          Session 5: final 10 from Exp 906.
          After each session: record active_constraints = mem.get_active_constraints()
       e. Measure:
          - n_constraints_after_session_1 through n_constraints_after_session_5
          - precision_improvement: does more specific constraint set reduce false alarms?
            Simulate: baseline (no constraints): flag all failed attempts as violations.
                     memory-guided (active constraints only): flag only if matching error type.
                     Compute: precision = TP / (TP + FP) for both.
          - signed_precision_improvement = memory_precision - baseline_precision
       f. honest_verdict:
          "tier2_code_memory_works" if signed_precision_improvement > 0 AND n_constraints_after_session_5 >= 2
          "tier2_code_memory_partial" if n_constraints_after_session_5 >= 1
          "tier2_code_memory_insufficient_data" if all error_type_counts < min_observations_for_template
          "tier2_code_memory_no_improvement" otherwise
    6. Write tests. Traces to REQ-LEARN-045, SCENARIO-LEARN-045.
    7. Write results/experiment_926_fr11_tier2_code_domain.json.
    8. Update ops/changelog.md: one-line entry.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_926_fr11_tier2_code_domain.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp927-draft-conditioned-integration
  milestone: 2026.04.71
  deliverable: results/experiment_927_draft_conditioned_integration.json
  max_turns: 30
  title: 'Exp 927: DraftConditioned Tier 2.8 Pipeline Integration — Wire to ThreeTierPipeline (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 912 confirmed DraftConditionedVerifier (Tier 2.8) is viable in isolation
    (honest_verdict=tier28_viable). The structural constraint injection improved Ising solve
    quality when tested standalone. This experiment integrates Tier 2.8 into the
    ThreeTierPipeline cascade between Tier 2.7 (CausalReasoningVerifier) and Tier 3 (Ising).
    The key metric: skip_rate (fraction of Tier 3 calls avoided by Tier 2.8 early exit)
    with FN rate < 5% (we don't miss real violations).

    EXISTING CODE TO READ FIRST:
    - results/experiment_912_draft_conditioned_tier28.json — tier28_viable, baseline metrics
    - python/carnot/pipeline/draft_conditioned_verifier.py — DraftConditionedVerifier (Exp 912)
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline cascade
    - python/carnot/verify/causal_reasoning_verifier.py — Tier 2.7 (insert after this)
    - openspec/change-proposals/research-roadmap-v71.md — .71 Phase 5 design

    TASK: Wire DraftConditionedVerifier into ThreeTierPipeline. Measure skip_rate and FN_rate
    on 25 GSM8K questions. Target: skip_rate > 0.20, FN_rate < 0.05.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_912_draft_conditioned_tier28.json. Extract:
       - mean_constraints_injected, auc_with_draft, auc_baseline
    3. Read python/carnot/pipeline/three_tier_pipeline.py fully. Identify:
       - The position where Tier 2.7 exits and Tier 3 begins
       - The interface for adding a new tier (return early if score > threshold)
    4. Modify python/carnot/pipeline/three_tier_pipeline.py to add Tier 2.8:
       In ThreeTierPipeline.__init__: accept optional draft_verifier: DraftConditionedVerifier
       parameter. If provided, wire after Tier 2.7.
       In ThreeTierPipeline.verify():
         if self.draft_verifier is not None:
           tier28_result = self.draft_verifier.verify_with_draft(question, response)
           # Tier 2.8 is permissive: only exit early if no structural constraints found
           if tier28_result.n_constraints == 0:
             return VerificationResult(verified=True, mode="DRAFT_FAST_PATH",
                                       tier28_skipped_tier3=True)
           # Otherwise: inject draft constraints into Tier 3 call
           tier3_energy = ising_sampler.score_with_constraints(
             response, tier28_result.draft_constraints)
         else:
           tier3_energy = ising_sampler.score(response)
    5. Add spec entries: REQ-VERIFY-149 (Tier 2.8 DraftConditioned pipeline integration),
       SCENARIO-VERIFY-149 (Tier 2.8 in cascade achieves skip_rate > 20% with FN < 5%).
    6. Create scripts/experiment_927_draft_conditioned_integration.py:
       a. tmpl = ExperimentTemplate(927, ..., requires_gpu=False). tmpl.setup().
       b. Load 25 GSM8K questions. Use Qwen3.5-0.8B (CPU) for generation.
       c. Ground-truth labels: correct answer from GSM8K dataset.
       d. Baseline: ThreeTierPipeline without Tier 2.8 (no draft_verifier).
       e. Integrated: ThreeTierPipeline with Tier 2.8 wired.
       f. For each question compute:
          - baseline: did pipeline correctly classify (TP/TN/FP/FN)?
          - integrated: did pipeline skip Tier 3 (skip_tier3=True)?
          -             did integrated correctly classify?
       g. Compute: skip_rate = fraction skipped Tier 3 / total
                   fn_rate = false negatives / total violated (we missed a real violation)
       h. honest_verdict:
          "tier28_wired_target_met" if skip_rate > 0.20 AND fn_rate < 0.05
          "tier28_wired_high_fn" if skip_rate > 0.20 AND fn_rate >= 0.05
          "tier28_wired_low_skip" if skip_rate <= 0.20
          "tier28_wired_baseline" otherwise
    7. Write tests. Test CARNOT_DUAL_GPU behavior unchanged with tier28 wired.
       Traces to REQ-VERIFY-149.
    8. Write results/experiment_927_draft_conditioned_integration.json.
    9. Update ops/changelog.md: one-line entry.
    10. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_927_draft_conditioned_integration.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

