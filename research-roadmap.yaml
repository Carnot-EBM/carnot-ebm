    \   e. Measure skip_rate, tp_rate, fp_rate\n\
    \   f. Build artifact: schema='carnot.think_probe.v1'\n\
    \      honest_verdict: 'think_probe_viable' if skip_rate > 0.30 AND fp_rate < 0.10;\n\
