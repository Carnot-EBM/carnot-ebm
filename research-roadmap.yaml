- id: exp417-semantic-energy-scorer
  milestone: 2026.06.24
  deliverable: python/carnot/pipeline/semantic_energy_scorer.py
  title: 'Exp 417: Semantic Energy Scorer — logit-space Boltzmann hallucination detection (RETRO-023 carry, purge + re-implement)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: python/carnot/pipeline/semantic_energy_scorer.py\
    \ contains corrupt JSON data (not Python). Carried from Exp 401 (not executed), Exp 408\
    \ (force-skipped). Call DeliverableContentValidator.validate_and_clear() at top.\n\
    \narXiv 2508.14496 (Semantic Energy, 2025-08): Operates on PENULTIMATE-LAYER LOGITS (pre-softmax)\
    \ instead of post-softmax probabilities. Post-softmax normalization loses intensity information —\
    \ logit 100 vs logit 10 both normalize to high probability, but represent very different\
    \ confidence levels. Semantic Energy: E = -log(sum(exp(logits/T))) over semantic cluster.\
    \ Higher energy = more hallucination-prone. Consistently outperforms semantic entropy.\
    \ WHY THIS COMPLEMENTS ISING: Ising checks structural correctness AFTER generation. Semantic\
    \ Energy provides a FAST pre-filter DURING generation — if energy is high, trigger full Ising;\
    \ if low, skip. Same architecture as SinkProbe (Exp 348) but uses logit-space energy.\n\
    \nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/deliverable_validator.py — DeliverableContentValidator (Exp 404)\n\
    - python/carnot/pipeline/sink_probe.py — SinkProbe (Exp 348) — fast-path pattern to follow\n\
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline (Exp 360) — integration point\n\
    - python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu() for CI-safe mode\n\
    \nTASK: Implement SemanticEnergyScorer.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call validate_and_clear('{project_root}/python/carnot/pipeline/semantic_energy_scorer.py') at TOP.\n\
    3. Add REQ-VERIFY-090 (SemanticEnergyScorer: logit-space energy detects hallucination before\n\
    \   Ising check), REQ-VERIFY-091 (CI-safe mode with deterministic hash of response text),\n\
    \   SCENARIO-VERIFY-120/121/122 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - SemanticCluster(response_texts: list[str], logit_matrix: jnp.ndarray | None)\n\
    \   - compute_boltzmann_energy(logits: jnp.ndarray, temperature: float = 1.0) -> float:\n\
    \     E = -log(sum(exp(logits/temperature))). Returns scalar.\n\
    \   - SemanticEnergyResult(energy: float, is_uncertain: bool, should_verify: bool,\n\
    \     n_tokens_scored: int, inference_mode: str)\n\
    \   - SemanticEnergyScorer(threshold: float = 2.0, temperature: float = 1.0)\n\
    \   - SemanticEnergyScorer.score(response: str, logits: jnp.ndarray | None) -> SemanticEnergyResult:\n\
