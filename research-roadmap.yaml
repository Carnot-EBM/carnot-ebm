  - id: exp2626
    milestone: "2026.05.251"
    deliverable: "results/experiment_2626_multi_exit_kan.json"
    title: "Multi-Exit KAN Energy Verifier: Per-Layer Prediction Heads for Inference Speedup"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: architecture

    prior_failures:
      - experiment_id: exp980-sos-kan-reparameterization
        verdict: "complete: SOS-KAN reparameterization with monotonicity invariants"
        addressed_by: "exp980 added SOS-on-derivative type-level invariants to the KAN energy tier. Multi-Exit KAN is a different architectural change: adds independent prediction heads at each KAN layer, allowing early-exit inference when confidence is high. Different technique (multi-exit branching vs. activation reparameterization) and different goal (speedup vs. constraint enforcement)."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Carnot's KAN energy tier achieves AUROC = 0.994 on synthetic FoVer with 8.7x fewer params
      than Ising. However, all inference runs the full KAN depth. Multi-Exit KAN (arXiv:2506.03302
      from 2025) adds prediction heads at each KAN layer: if an intermediate layer's prediction
      confidence exceeds a threshold, return early — skipping the remaining layers. For inputs where
      the constraint violation is obvious (very high energy), early-exit at layer 1 or 2 provides
      identical accuracy at ~3x speedup.

      Target: multi_exit_viable = True iff (early_exit_auroc >= full_path_auroc - 0.005) AND
              (avg_exit_layer < n_layers * 0.7) — meaning we can skip >30% of layers on average.

      EXISTING CODE TO READ FIRST:
      - python/carnot/models/kan.py (or python/carnot/verify/ for KAN energy verifier)
      - python/carnot/verify/base_verifier.py (interface)
      - results/experiment_2622_ensemble_v9_adversarial_val.json (current KAN contribution)

      TASK: Add multi-exit prediction heads to the KAN energy verifier.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import numpy; import sklearn"` succeeds.
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. Locate the KAN energy verifier module (search python/carnot/ for kan*.py or kan_energy*).
            If KAN module not found: write honest_verdict blocked_kan_module_not_found; exit.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load or reconstruct a simple KAN energy verifier on synthetic data:
         n_layers = 3 (matching the current tier)
         Input features: claim length, token diversity, bigram entropy (3 features)
         For each of n_layers: train a simple LogisticRegression head on those layer features.

      2. Implement MultiExitKANVerifier:
         class MultiExitKANVerifier:
           """KAN with per-layer prediction heads for early-exit inference.
           Early exit when any layer's confidence exceeds threshold.
           Per arXiv:2506.03302 — reduces Lipschitz constant at intermediate layers."""

           def score(self, context: str, claim: str) -> tuple[float, int]:
             """Return (energy_score, exit_layer) where exit_layer is the layer
             that fired (1 to n_layers). Lower exit_layer = cheaper inference."""
             for layer in range(n_layers):
               features = self._extract_layer_features(context, claim, layer)
               confidence = self.heads[layer].predict_proba([features])[0][1]
               if confidence > self.threshold or confidence < 1 - self.threshold:
                 return confidence, layer + 1
             # Full path
             return self.heads[-1].predict_proba([all_features])[0][1], n_layers

      3. Evaluate on 200 real FoVer examples:
         For each example run both full-path and multi-exit scoring.
         Collect (full_score, exit_score, exit_layer, label) tuples.
         Compute: full_path_auroc, early_exit_auroc, avg_exit_layer.
         multi_exit_viable = (early_exit_auroc >= full_path_auroc - 0.005) AND
                              (avg_exit_layer < n_layers * 0.7)

      4. Write results/experiment_2626_multi_exit_kan.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - multi_exit_viable: bool — True iff early-exit AUROC within 0.005 of full-path AND avg_exit < 70% layers
        principle: "Primary gate: multi-exit is only worth deploying if accuracy loss is negligible."
      - full_path_auroc: float — AUROC with all KAN layers
        principle: "Baseline for measuring accuracy loss due to early exit."
      - early_exit_auroc: float — AUROC with multi-exit (threshold=0.8)
        principle: "Primary metric; delta vs full_path_auroc quantifies accuracy cost of speedup."
      - avg_exit_layer: float — mean exit layer across corpus (lower = faster)
        principle: "Measures actual speedup achieved; avg_exit_layer = n_layers means no speedup."
      - n_layers: int — KAN depth
        principle: "Denominator for avg_exit_layer fraction."
      - speedup_estimate: float — n_layers / avg_exit_layer (approximate inference speedup)
        principle: "Headline speedup number; paper-v6 §5 can cite if multi_exit_viable."
      - random_seed: 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Real evaluation >= 0.5s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication record."

