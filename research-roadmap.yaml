      op: "=="
      value: true
  prompt: |
    CONTEXT:
    arXiv 2603.06621 "Reward Under Attack" released PRM-BiasBench: an adversarial evaluation
    suite for PRMs. Key finding: 43% of PRM reward attributable to stylistic shortcuts (padding,
    formatting), not reasoning quality. Near-perfect PRM scores (>0.9) achievable with <4%
    ground-truth accuracy via stylistic gaming.

    This experiment tests whether Carnot's k=5 AND-compose ensemble is more robust to stylistic
    attacks than individual PRMs. The k=5 ensemble combines:
    - SemEnergyProbe: semantic coherence (could be fooled by well-formatted noise)
    - Z3MathVerifier: formal arithmetic (cannot be fooled by style)
    - ASTStructureVerifier: code structure
    - SemanticConsistencyVerifier
    - SOSKANEnergyV3 (fixed in exp1128)

    PREREQUISITE: This experiment is gated on exp1128.k5_ensemble_auroc_above_08 == True.
