- id: exp1196-grpo-vps-step-level-supervision
  milestone: 2026.04.93
  deliverable: results/experiment_1196_grpo_vps_step_level_supervision.json
  title: "GRPO-VPS Step-Level Process Supervision via CausalReasoning + Z3Math Verifiers"
  agent_type: claude
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 30
  priority: high
  requires_gpu: false
  prompt: |
    CONTEXT:
    arXiv 2604.20659 (GRPO-VPS) extends GRPO with step-level process supervision: instead
    of a single outcome reward, compute per-step rewards as the change in the model's belief
    in the correct answer at each reasoning step boundary. Reports up to 2.6pp improvement
    and 13.7% shorter reasoning chains.

    Carnot already has step-level verifiers: CausalReasoningVerifier (Tier 2.7, checks causal
    entailment across CoT step boundaries) and Z3MathVerifier (Tier 3, checks arithmetic
    correctness per step). These naturally produce the per-step verification signals that
    GRPO-VPS needs. This is orthogonal to TinyV (which addresses false negatives in outcome
    verification; VPS addresses credit assignment for intermediate steps).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/extract.py (CausalReasoningVerifier Tier 2.7, Z3MathVerifier)
    - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline — per-step verification)
    - results/experiment_1159_grpo_v4_structural_warmup.json (v4 baseline: +10pp)
    - results/experiment_1187_latent_grpo_energy_reward.json (latent-GRPO: no_delta)

    TASK:
    1. Read the CausalReasoningVerifier and Z3MathVerifier API from pipeline/extract.py.
       Understand what per-step signal each returns (causal_violation, arithmetic_violation).

    2. Implement GRPO-VPS segment reward function:
       def segment_reward(step_text, step_index, full_cot_steps):
           causal_score = 1.0 - CausalReasoningVerifier().verify_step(step_text, prior_step)
           z3_score = 1.0 - Z3MathVerifier().verify_step(step_text)
           return 0.5 * causal_score + 0.5 * z3_score  # 0=violation, 1=correct

    3. Run GRPO-VPS on a subset of GSM8K (50 questions, 4 completions each):
       For each completion: split into CoT steps, compute per-step rewards, aggregate
       as weighted sum with decay (later steps weighted less — early credit assignment)
       Compare vs outcome-only GRPO (same 50 questions, ThinkPRM v2 outcome reward)

    4. Use a GGUF model (Qwen3.6-35B-A3B or gemma-4-31B) for generation via llama.cpp CPU
       (no GPU required for this experiment — generating on CPU at reduced scale is acceptable
       for a step-level comparison; the goal is to measure signal quality, not full training).

    5. Measure:
       - Per-step reward distribution (mean, std by step index)
       - Fraction of steps with violations detected by CausalReasoning vs Z3Math
       - Correlation between per-step reward and final answer correctness
       - grpo_vps_delta_pp vs outcome-only baseline on 50 questions

    6. Write results artifact.

    CONCRETE STEPS:
    - python3 -c "from carnot.pipeline.extract import CausalReasoningVerifier, Z3MathVerifier; print('ok')" 2>&1
    - [Implement GRPO-VPS segment_reward function]
    - [Generate 50 GSM8K responses with GGUF model (CPU)]
    - [Split into CoT steps and compute per-step rewards]
    - [Compare vs outcome-only baseline]
    - Write results/experiment_1196_grpo_vps_step_level_supervision.json

    REQUIRED ARTIFACT FIELDS:
    - n_questions_evaluated: int (50)
    - n_completions_per_question: int (4)
    - causal_verifier_violations_pct: float (fraction of steps with causal violation)
    - z3_verifier_violations_pct: float (fraction of steps with arithmetic violation)
    - per_step_reward_mean: float
    - per_step_reward_std: float
    - step_reward_correctness_correlation: float (Pearson r between step reward and final correctness)
    - outcome_baseline_accuracy: float (fraction correct with outcome-only reward)
    - grpo_vps_accuracy: float (fraction correct with step-level reward)
    - grpo_vps_delta_pp: float (vps_accuracy - outcome_baseline_accuracy, signed)
    - grpo_vps_step_delta_measured: bool (True — we measured the delta, even if negative)
    - model_used: str
    - honest_verdict: "step_supervision_improves_over_outcome" | "step_supervision_no_delta" | "step_supervision_degrades" | "insufficient_step_signal"

