    deliverable: "results/experiment_3541_p01_route2_headroom_corpus_greedy_wrong_construction_v2.json"
    prompt: |
      CONTEXT: exp3530 (.325) tried to build a Route-2 selectable-headroom corpus by difficulty-
      filtering MATH L4-5 for "the correct answer is a selectable minority among k candidates" and
      found NONE (0/24 kept; oracle 0.0; verdict: SC majority is near-optimal). The MoB paper
      (arXiv:2511.18630) explains why: with imperfect rewards BoN degrades, but the correct answer is
      usually the MOST LIKELY OUTCOME (the mode) — so when SC is near-optimal, the mode IS the answer
