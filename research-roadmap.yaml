        verdict: "complete: ebm_logit_residual_rescue_ready=false; sample_count_too_small"
        addressed_by: "This task uses .297 exact fixture banks and reports uncertainty/abstention diagnostics rather than trying to rescue a headline EBM score."
        retire_if_same_verdict: true
      - experiment_id: exp3211-constraintbench-feasibility-objective-pilot-v1
        verdict: "complete: constraintbench_pilot_ready=true; exact_row_count=15"
        addressed_by: "Consumes the existing exact rows as inputs and adds uncertainty sidecar fields without changing their solver authority."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Recent Distributional EBM work suggests modeling uncertainty over structured reasoning outputs. Carnot already has exact context and ConstraintBench-style fixture banks from `.297`. You are working in {project_root} on {date}. This task must not claim that uncertainty replaces exact verification.

      EXISTING CODE TO READ FIRST
