  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-040: JEPA\
    \ AUC regressed 0.667→0.400→0.281. Exp 491 diagnosed the root cause: quality-gate\
    \ filtering removed 73% of pairs, leaving an imbalanced corpus that caused majority-class\
    \ collapse. The fix is curriculum training: three stages that expose the predictor\
    \ to pairs in increasing difficulty order. Stage 1: only high-confidence pairs\
    \ (label_confidence >= 0.85) for 100 epochs — establishes a stable baseline. Stage\
    \ 2: fine-tune on ALL pairs (no filtering) for 100 epochs — exposure to full distribution.\
    \ Stage 3: augment with EBM-guided synthetic pairs to reach n_total >= 200 for\
    \ 100 more epochs. This is the Tier 3 self-learning experiment for milestone .37\
    \ (FR-11: autonomous self-learning loop). CPU-only.\n\nRead results/experiment_491_jepa_curriculum_diagnostic.json\
    \ for the root_cause and curriculum_recommendation fields before implementing.\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/models/eorm.py — EORM\n- python/carnot/models/jepa_retrain_v2.py\
    \ — CoTPairQualityFilter, JEPAQualityAugmentor, JEPARetrainV2Result (Exp 477)\n\
    - python/carnot/models/jepa_curriculum_diagnostic.py — JEPACurriculumDiagnostic\
    \ (Exp 491)\n- python/carnot/pipeline/deliverable_guard.py — DeliverableGuard\n\
    - results/fover_labeled_steps_live.json — 57 real pairs\n- results/experiment_491_jepa_curriculum_diagnostic.json\
    \ — root cause finding\n- ops/known-issues.md — RETRO-040\n\nTASK: Implement\
    \ JEPACurriculumTrainer and retrain JEPA to AUC > 0.600 (recovery from 0.281).\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n3.\
    \ Load results/experiment_491_jepa_curriculum_diagnostic.json and read curriculum_recommendation.\n\
    4. Add REQ-LEARN-040 (JEPACurriculumTrainer stage1 trains on high-confidence pairs\
    \ label_confidence>=0.85 for n_stage1_epochs, establishing stable baseline before\
    \ full-distribution exposure), REQ-LEARN-041 (JEPACurriculumTrainer stage2 fine-tunes\
    \ on all pairs unfiltered for n_stage2_epochs, preventing majority-class collapse\
    \ by seeing the full distribution early after anchoring), REQ-LEARN-042 (JEPACurriculumTrainer\
