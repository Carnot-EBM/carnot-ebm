- id: exp1149-kv260-v5-dc-continuous-diagnostic
  milestone: 2026.04.89
  deliverable: results/experiment_1149_kv260_v5_dc_continuous_diagnostic.json
  title: "KV260 Ising v5 — DC-Continuous Relaxation Diagnostic (Software Parity)"
  model: opus
  max_turns: 40
  estimated_wall_time_min: 35
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1134-kv260-v4-parameter-tuning
      verdict: kl_improved_not_below_threshold
      addressed_by: |
        exp1134 mapped the full parameter space (beta=[2,5], alpha=[0.02,0.3]) and found
        best KL=0.1128. Self-adaptive lambda was CATASTROPHIC (KL=31.89) — suggesting a
        topology-level problem: the sparse K=16 connectivity does NOT preserve detailed
        balance under synchronous parallel Glauber for arbitrary J matrices. exp1149
        addresses this by switching to a DC-continuous relaxation (arXiv 2509.01928):
        relax binary spins to [-1,+1] continuous, decompose energy into convex+concave
        parts, and use DC programming for convergence. This is a fundamentally different
        sampling algorithm, not another parameter sweep.
      retire_if_same_verdict: false
    - experiment_id: exp1122-kv260-v4-python-sim
      verdict: v4_kl_above_threshold
      addressed_by: |
        exp1122 simulated the v4 RTL design directly in Python. exp1149 tests a v5
        DC-continuous algorithm that is software-simulated first (matching the exp1122
        approach) but uses a different mathematical foundation.
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    KV260 v4 parameter tuning (exp1134) showed:
    - best KL with manual sweep: 0.1128 (above 0.05 threshold)
    - self-adaptive lambda (arXiv 2501.04971): CATASTROPHIC KL=31.893 — the update rule
      diverged, suggesting the sparse K=16 topology doesn't support the lambda update dynamics

    Root-cause hypothesis: synchronous parallel Glauber on sparse K=16 graphs does NOT preserve
    detailed balance for arbitrary J matrices. This is the exp1094 finding (KL=3.07 FPGA mismatch
    from the Phase 2a sampler correctness audit).

    arXiv 2509.01928 "Continuous Energy Ising Machine via Difference-of-Convex Programming":
    Relaxes binary spins to continuous [-1,+1], decomposes Ising energy into convex+concave parts
    (DC decomposition), and uses a proximal gradient update that converges in polynomial time.
    Unlike synchronous Glauber, this approach HAS provable convergence guarantees.

    This experiment implements a v5 DC-continuous sampler in Python (software parity test)
    and checks whether it can achieve KL < 0.05 on the same J matrices that v4 failed on.

    EXISTING CODE TO READ FIRST:
    - hardware/kv260/ising_sampler_v4_spec.md (read the v4 topology: sparse K=16, N=128)
    - results/experiment_1134_kv260_v4_parameter_tuning.json (read kl_v4_best, kl_v4_with_self_adaptive)
    - results/experiment_1122_kv260_v4_python_sim.json (read the simulation code structure)
    - scripts/experiment_1122_kv260_v4_python_sim.py (if exists, read simulation approach)

    TASK:
    1. Read the v4 simulation code from exp1122.
    2. Implement v5 DC-continuous sampler:
       a. Relax spins from {-1,+1} to continuous s_i in [-1, +1]
       b. Energy: E(s) = -0.5 * s^T J s (same J as v4)
       c. DC decomposition: E = f(s) - g(s) where f(s) = -0.5 s^T J^- s (concave part negated)
          and g(s) = 0.5 s^T J^+ s (convex part), J = J^+ - J^- (positive/negative eigenvalue split)
       d. Proximal gradient update:
          s_new = clip(s - alpha * grad_f(s) + alpha * grad_g(s), -1, 1)
          (DC subgradient: linearize g, solve proximal for f)
       e. After convergence: threshold to {-1,+1} via sign(s)
    3. Test on the same 3 random J matrices used in exp1134.
    4. Compare: KL(v5_continuous_DC || CPU_Gibbs) vs KL(v4_sparse || CPU_Gibbs)
    5. Add energy-time-accuracy reporting (arXiv 2601.04358 EDDP framing):
       - energy_at_convergence
       - wall_clock_s
       - final_accuracy (percent correct constraint satisfaction)
    6. If KL v5 < 0.05: kv260_v5_kl_below_threshold = True
       If KL v5 >= 0.05 but < v4: document remaining gap and recommended RTL approach for v5

    CONCRETE STEPS:
    - cat hardware/kv260/ising_sampler_v4_spec.md | head -60
    - python3 scripts/experiment_1149_kv260_v5_dc_continuous_diagnostic.py

    REQUIRED ARTIFACT FIELDS:
    - kl_v4_best_prior: 0.1128
    - kl_v4_with_self_adaptive_prior: 31.893
    - algorithm: "dc_continuous_relaxation"
    - kl_v5_best: float
    - kl_v5_below_threshold: bool (target: True if kl < 0.05)
    - kl_improvement_over_v4: float (kl_v4_best - kl_v5_best; positive = better)
    - energy_time_accuracy_reported: bool
    - n_j_matrices_tested: int (3)
    - kv260_v5_diagnostic_complete: bool (always True)
    - rtl_recommendation: str (what to implement in v5 RTL based on DC results)
    - honest_verdict: "kl_below_threshold_v5_viable" | "kl_improved_not_threshold" | "kl_unchanged_topology_wall" | "algorithm_diverged"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1149_kv260_v5_dc_continuous_diagnostic.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

