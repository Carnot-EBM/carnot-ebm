  - id: exp3704-refreeze-disambiguate-dependency-vs-external-vs-fusion
    operator_override: "2026-06-02 outer-loop directive: versioned re-freeze-candidate continuation with a STATED forward difference — exp3693 found the PUBLISHED external baseline (0.9287) BEAT the dependency-aware candidate (0.9249), so the re-freeze candidate is ambiguous. Forward diff vs exp3680/3692/3693: runs dependency-aware vs external vs a FUSION head-to-head at FULL G1-rigor dual-condition, picks the SINGLE strongest, and re-emits the clean operator package for the WINNER (not just the dependency-aware number). False-positive scope-match vs prior dependency-aware/re-freeze exps. Prepare-only per Operator-Only External Publication + Public Documentation Discipline; the frozen 0.9131 is never silently substituted."
    milestone: "2026.06.339"
    title: "DISAMBIGUATE the re-freeze candidate at full G1-rigor — exp3693 found the published external de-entangled/CIG baseline (0.9287) BEAT the dependency-aware candidate (0.9249). Run dependency-aware vs external vs a FUSION (multi-verifier, arXiv:2502.20379) head-to-head under the FROZEN dual-condition protocol (5-seed, CI, DeLong, adversarial-clean, leak-free), pick the SINGLE strongest candidate > frozen 0.9131, and re-emit the CLEAN operator re-freeze package for THAT winner — PREPARE-ONLY; the frozen 0.9131 stays frozen, the agent never edits north-star.md or triggers the CI run"
    priority: critical
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # anti-wipeout codex routing for .339; multi-candidate G1-rigor + package re-emit
