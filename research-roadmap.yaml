tasks:
- id: exp6729-v587-activation-evidence-contract
  title: V587 activation, source-receipt, and evidence-contract preflight
  track: infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.5
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 20
  milestone: 2026.08.587
  deliverable: results/experiment_6729_v587_activation_evidence_contract.json
  prompt: |
    CONTEXT:
    Milestone 2026.08.586 completed with `blocked_context_window`; it did not run the object-table
    A/B. V587 has four independent branches and adopts recent primary-source ideas only where a
    local, falsifiable experiment exists. This task is the milestone's required SOTA-ingestion and
    manifest-contract slot. It prevents mismatched gate names, missing prior-failure mechanics,
    ungrounded model choices, and duplicate or retired chains from consuming expensive runs.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/research-roadmap-next.yaml and {project_root}/research-roadmap.yaml
    - {project_root}/research-references.md, section `V587 Planner Refresh - 2026-08-29`
    - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md,
      {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/scripts/conductor_gates.py,
      {project_root}/scripts/verdict_row_consistency_lint.py, and
      {project_root}/scripts/adversarial_verify.py
    - Primary-source receipts named in the V587 planner refresh: arXiv 2608.08786,
      2607.17047, 2608.24082, 2607.20792, 2608.00220, 2608.01615, 2608.01612,
      and 2608.03065.

    TASK:
    Build a machine-checkable activation receipt for the proposed 13-task milestone. Confirm that
    the design, manifest, source receipts, exact gate contracts, failure-retirement declarations,
    local model policy, claim boundaries, and deliverable paths agree before any downstream run.

    CONCRETE STEPS:
    0. PRECONDITIONS: confirm all listed local files exist; both roadmap YAML files parse; every
       V587 source receipt has a URL, date/cutoff, local adoption decision, and experiment mapping;
       and no source lookup or implementation write is needed. If a precondition fails, emit a
       blocked verdict with `gate_check_summary` and stop after writing the artifact atomically.
    1. Before changing implementation, confirm the relevant REQ-* anchors exist in
       openspec/capabilities/research-harnesses/spec.md and
       openspec/capabilities/research-reporting/spec.md. Add a narrowly scoped requirement only if
       the contract is genuinely absent, then test that requirement.
    2. Parse V587 and verify exactly 13 unique task IDs and 13 unique deliverables, four phases,
       three named PRD gaps, at least two infrastructure tasks, and an ungated capstone.
    3. Verify every `gated_on` upstream exists in this manifest and the artifact field is named
       identically in that upstream prompt's REQUIRED ARTIFACT FIELDS. Reject a missing/renamed
       field rather than normalizing it.
    4. Check every scope-matched rerun has all four `prior_failures` subfields, including
       `retire_if_same_verdict: true`; no `requires:` edge names a retired task; and no task reuses
       a retired ID.
    5. Check every comparison sets `per_unit_rows: true`; every prompt declares the closed
       `verdict_class`; every blocked path requires `gate_check_summary`; and no ARC task claims a
       level solve or uses source/BFS/per-game adapters.
    6. Check each LLM task's MODEL_SPECS contains at least one mandated model and that the ARC
       scored generator remains `unsloth/Qwen3.8-27B-GGUF`. Record model cache as NOT required for
       this source/manifest-only task.
    7. Run the focused tests plus roadmap/schema, spec-coverage, exclusion-manifest, and
       adversarial verification checks applicable to activation. Do not edit the active
       `research-roadmap.yaml`.
    8. Write the deliverable atomically only after preconditions. REQUIRED ARTIFACT FIELDS, each
       documented in `field_principles`: `inference_substrate` (exact local preflight path),
       `duration_s` (monotonic measured wall time), `random_seed` (explicit even when unused),
       `reproducibility_checksum` (canonical checked-input hash), `source_cutoff` (2026-08-29),
       `source_receipts` (one row per primary source), `task_contract_rows` (one row per task),
       `gate_contract_rows` (one row per gate), `prior_failure_rows` (one row per matched rerun),
       `model_policy_rows` (one row per LLM task), `v587_contract_ready` (true only if every check
       passes), `gate_check_summary` (named failing check and observed value on blocked paths),
       `verdict_class` (positive | circular_positive | null | blocked | disqualified | partial),
       and `honest_verdict` (terminal-prefixed free text). Use
       `source_receipts_and_local_method_preregistration_no_llm` as the substrate.

    Run command: `cd {project_root} && .venv/bin/python scripts/experiments/experiment_6729_v587_activation_evidence_contract.py`
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6660-v581-evidence-contract
      verdict: 'skipped_three_fail: model metadata for gemini-3.1-pro-preview was unavailable before artifact creation'
