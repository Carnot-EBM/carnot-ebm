    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3704_refreeze_disambiguate_dependency_vs_external_vs_fusion.json
    prompt: |
      CONTEXT: exp3680 confirmed Carnot's dependency-aware weighting clears G1-rigor at production AUROC
      0.9253 > frozen 0.9131. exp3692 re-emitted a CLEAN operator re-freeze package for that number. BUT
      exp3693 then found the PUBLISHED external de-entangled/CIG reweighting baseline (arXiv:2604.07650)
      scores AUROC 0.9287 -- HIGHER than the dependency-aware candidate 0.9249 -- on the same FoVer corpus
      (verdict "ties_or_loses"). So the re-freeze package may be for the WRONG candidate. This task
      disambiguates: run ALL THREE candidates (Carnot dependency-aware, the external de-entangled/CIG
      baseline, and a FUSION of both -- multi-verifier composition per arXiv:2502.20379) head-to-head
      under the FROZEN dual-condition integrity protocol, pick the SINGLE strongest, and re-emit the clean
      operator package for THAT winner. It MUST NOT edit ops/north-star.md, MUST NOT trigger the GitHub
      Actions reproducer, and MUST NOT change the frozen 0.9131 anywhere the publication gate reads.
      EXISTING CODE TO READ FIRST: results/experiment_3680 (the dependency-aware G1 candidate + the
      dual-condition protocol) and results/experiment_3693 (the external baseline 0.9287 + its
      implementation) and results/experiment_3692 (the clean package mechanics) and results/experiment_2850
      (the frozen G1 source) via scripts/summarize_artifact.py; scripts/reproduce_fover_headline.py and
      .github/workflows/reproduce-fover-headline.yml (READ-ONLY -- do NOT edit); research-references.md
      "De-entangled / CIG reweighting (arXiv:2604.07650)" + "Multi-Agent Verification (arXiv:2502.20379)";
      ops/north-star.md sec-1+sec-2; CLAUDE.md "Operator-Only External Publication" + "Public Documentation
      Discipline" + "Inference-Substrate Declaration Discipline".
      PRECONDITIONS (step 0): the FoVer corpus + the 4 verifier per-candidate outputs loadable; the
      dependency-aware weighting (exp3680) and the external baseline (exp3693) both reproducible;
      scripts/reproduce_fover_headline.py importable. If not -> "complete: blocked_fover_corpus_or_baselines_unavailable".
      INFERENCE-SUBSTRATE HYGIENE (LOAD-BEARING -- the exp3681 fix): set
      inference_substrate=verifier_ensemble_against_cached_candidates and DO NOT include ANY
      GGUF/CUDA/live-model marker in model_specs/target_model. After writing the artifact, run
      `python scripts/adversarial_verify.py <your artifact>` and CONFIRM no critical flag before finishing.
      LEAK-GUARD: if any candidate's pooled AUROC >= 0.99 treat it as a leak and investigate before reporting.
      DE-TAUTOLOGY (MANDATORY): store each conceptually-distinct AUROC under exactly ONE field name; the
      three candidate AUROCs and the frozen number are DISTINCT measurements -- bit-identical values are a
      copy bug, not a tie.
      CONCRETE STEPS:
        1. Run all three candidates under the FROZEN dual-condition protocol (production + architecture-only,
           >=5 seeds, per-seed AUROC + pooled CI95, reproducibility_checksum, leak-free) directly comparable
           to the frozen 0.9131. Confirm Carnot-current reproduces 0.9131 under the identical protocol.
        2. Build the FUSION candidate (dependency-aware label-conditional weighting composed with the
           external de-entangled signal -- e.g. weighted/stacked combination); report its AUROC + CI.
        3. Rank the three by pooled AUROC; paired delta + bootstrap CI + DeLong p for (winner vs runner-up)
           and (winner vs frozen 0.9131). Record strongest_candidate (string: dependency_aware/external/fusion)
           and strongest_candidate_auroc + strongest_candidate_beats_frozen (BARE bool).
        4. If a winner beats frozen, re-emit the CLEAN operator re-freeze package FOR THE WINNER: the exact
           north-star sec-1 edit (old headline -> winning candidate with CI + source artifact), the drafted
           CI-workflow assertion bounds, and "trigger the reproducer run" -- each marked OPERATOR-ACTION.
           State plainly that the frozen 0.9131 stays the headline until the operator completes the checklist
           AND the CI reproducer re-runs green on the new number.
        5. ASSERT in the artifact: north-star.md NOT modified, the .yml NOT modified, the GitHub run NOT
           triggered, and the publication gate still reads 0.9131 (paper_ready unchanged).
      ANTI-POISON TEST DISCIPLINE (MANDATORY): parametrize any pytest over the honest outcomes
      (winner_beats_frozen_package_reemitted / no_candidate_beats_frozen / blocked) on synthetic fixtures;
      NEVER hard-assert one success string. Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; bare booleans stored bare):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores cached FoVer outputs; no LLM load; no compute-bound marker)."
        dependency_aware_auroc:
          principle: "Carnot's label-conditional dependency-aware candidate under the frozen dual-condition protocol -- one field, no alias."
        external_comparator_auroc:
          principle: "The published de-entangled/CIG baseline (arXiv:2604.07650) under the identical protocol -- a DISTINCT measurement."
        fusion_auroc:
          principle: "The dependency-aware + external FUSION candidate (arXiv:2502.20379) -- the third DISTINCT candidate."
        carnot_current_auroc:
          principle: "Carnot-current under the identical protocol -- must reproduce the frozen 0.9131 as the protocol sanity check."
        strongest_candidate:
          principle: "dependency_aware / external / fusion -- which single candidate has the highest pooled AUROC."
        strongest_candidate_auroc:
          principle: "The winning candidate's pooled AUROC + the number the operator would re-freeze to."
        winner_vs_runnerup_delta_ci:
          principle: "Paired delta + bootstrap CI + DeLong p of winner vs runner-up -- a point estimate cannot decide the ranking."
        strongest_candidate_beats_frozen:
          principle: "BARE bool. True iff the winning candidate's AUROC > frozen 0.9131 with the delta CI excluding 0 -- whether ANY candidate is a defensible re-freeze. STORE AS BARE true/false."
