- id: exp5182-diffusiongemma-meta-tensor-rootcause-fix-v475
  milestone: 2026.07.475
  title: PHASE A1 root-cause and fix the DiffusionGemma two-GPU meta-tensor/device-placement bug with
    genuinely new mitigations (not a repeat of .474's four device_map=auto variants)
  priority: critical
  track: verification
  deliverable: results/experiment_5182_diffusiongemma_meta_tensor_rootcause_fix_v475.json
  prior_failures:
  - experiment_id: exp5173-diffusiongemma-energy-guided-diffusion-pilot-v474
    verdict: blocked_diffusiongemma_meta_tensor_bug_unresolved
    addressed_by: "exp5173 tried 5 load-path variants, ALL using accelerate's device_map='auto' balancer
      (with or without an explicit max_memory cap) across the DiffusionGemmaModel /
      DiffusionGemmaForBlockDiffusion classes. This task tries structurally different mitigations that
      were never attempted: (1) explicit single-GPU placement (device_map={'':0}, no auto-balancer at
      all -- the model at 4-bit NF4 is small enough (~13-14GB) to plausibly fit on one 24GB RTX 3090,
      which would sidestep the entire cross-device meta-tensor code path); (2) inspecting and, if needed,
      correcting the model class's _no_split_modules / _no_split_classes declaration (the classic root
      cause of accelerate auto-splitting a block-diffusion denoising module that must not be split);
      (3) low_cpu_mem_usage=False (forces materialized weights instead of meta-device staging during
      load); (4) int8 bitsandbytes quantization as an alternate quant path with a different accelerate
      hook chain than 4-bit NF4."
    retire_if_same_verdict: true
  agent_type: claude
  model: opus
  requires_claude_verified: true
  max_turns: 100
  estimated_wall_time_min: 75
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. DiffusionGemma is Carnot's energy-guided discrete
    diffusion pilot target -- per `docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md`,
    it is "the decisive verifier-moat pilot" the `.379-.474` verifier-moat arc has been building toward.
    `.474`'s exp5173 was gated on exp5171's cross-corpus hardening (which passed), so the pilot was cleared
    to run -- but it never got past model loading. The exact failure, verbatim from
    `results/experiment_5173_diffusiongemma_energy_guided_diffusion_pilot_v474.json`:

    ```
    ValueError: Some modules are dispatched on the CPU or the disk before forward
    (underlying, from an earlier probe: RuntimeError: Tensor.item() cannot be called on meta tensors)
    ```

    All 5 of `.474`'s sub-attempts used `device_map="auto"` (accelerate's automatic layer-balancing
    across GPUs), either alone, with `DiffusionGemmaForBlockDiffusion`, with `DiffusionGemmaModel`, or
    with an explicit `max_memory={0:24GiB,1:24GiB}` cap -- all failed identically during accelerate's
    device-placement phase, before the diffusion forward pass ever ran. This is a HARD requires_claude_verified
    task (dual-GPU device-placement debugging on a non-standard "block diffusion" architecture that
    accelerate's auto-balancer does not know how to split cleanly) -- exactly the class of problem the
    Pre-emptive Opus Routing criteria (schema/preflight infra + hardware-adjacent debugging) name.

    This task's SOLE job is to get the model loadable and runnable through at least one real forward
    pass. It does NOT run the actual guided-vs-unguided-vs-AR benchmark (that is exp5183, gated on this
    task's success) -- do not scope-creep into the full pilot.

    EXISTING CODE TO READ FIRST:
    - results/experiment_5173_diffusiongemma_energy_guided_diffusion_pilot_v474.json (the exact failure
      transcript, `preconditions.smoke.tried` lists all 5 prior sub-attempts verbatim -- do not repeat
      any of them).
    - results/diffusiongemma_energy_prior_probe.json, results/diffusiongemma_energy_prior_gguf.json,
      results/diffusiongemma_energy_prior_transformers.json, results/diffusiongemma_energy_prior_vllm.json
      (earlier loader-path probes; the GGUF and vLLM paths may have different device-placement behavior
      worth comparing against the transformers/accelerate path if the mitigations below all fail).
    - python/carnot/experiment_5173_diffusiongemma_energy_guided_diffusion_pilot_v474.py (the exact
      loading code that failed -- read this before writing any fix, not a rewrite from scratch).
    - docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md (the model identity, expected
      VRAM footprint, and prior successful-load precedent this bug regressed from).
    - python/carnot/reporting/diffusiongemma_gate_reexamination_5152.py (context on the gate history).

    CONCRETE STEPS:
    0. PRECONDITIONS (check BEFORE any subsequent step):
       a. GPU 0 and GPU 1 both idle: `nvidia-smi --query-gpu=index,memory.used,memory.total --format=csv`
          -- both should show near-zero used memory. If either is busy with unrelated work, note it and
          proceed only on the idle GPU(s); do not kill another process's job.
       b. The DiffusionGemma weights are locally cached: check whatever path
          `results/diffusiongemma_energy_prior_probe.json`'s `hidden_state_access_metadata`-equivalent
          field (or the model download log) names, confirm the files exist on disk.
       c. `python -c "import transformers, accelerate, bitsandbytes; print(transformers.__version__,
          accelerate.__version__, bitsandbytes.__version__)"` succeeds -- record the exact versions (a
          version-mismatch regression is a plausible root cause given this load path worked earlier in
          the DiffusionGemma lineage, per the probe artifacts, and has since broken).
       If any precondition fails, write honest_verdict `blocked_<resource>` and exit. Do NOT proceed to
       loading attempts on a missing/busy resource.
    1. Try mitigation 1 (cheapest, most likely): load with `device_map={"": 0}` (or the model's own
       single-GPU pattern) -- NO auto-balancer at all. Compute the actual 4-bit NF4 memory footprint from
       the model's declared parameter count first to confirm it should plausibly fit in 24GB before
       attempting. If it OOMs, record the actual peak memory and move to mitigation 2.
    2. Try mitigation 2: inspect the model class's `_no_split_modules` / `_no_split_classes` class
       attribute (or lack thereof). A missing or incorrect declaration is the textbook root cause of
       accelerate's auto-balancer splitting a module (e.g. a diffusion denoising block or attention layer)
       that must stay whole across devices, leaving meta-tensor placeholders unresolved at forward time.
       If missing, add a correct declaration (naming the actual block-diffusion module class) and retry
       `device_map="auto"` across both GPUs with this fix.
    3. Try mitigation 3: `low_cpu_mem_usage=False` on `from_pretrained` (forces materialized weights
       instead of staged meta-device loading; costs more peak host RAM during load but sidesteps the
       meta-tensor code path entirely). Combine with either mitigation 1 or 2's device placement.
    4. Try mitigation 4 (only if 1-3 all fail): bitsandbytes int8 quantization instead of 4-bit NF4 --  a
       different quantization/accelerate hook chain that may not trigger the same placement bug.
    5. On ANY successful load, run one real forward pass (a single short diffusion denoising step on a
       trivial input) to confirm the model is not just "loaded" but genuinely runnable -- `.474`'s prior
       probe (`diffusiongemma_energy_prior_probe.json`) shows `model_loaded=true` can co-exist with a
       forward-pass failure, so loaded-without-forward-pass-confirmed does NOT count as success here.
    6. If ALL FOUR mitigations fail, write `honest_verdict: blocked_diffusiongemma_meta_tensor_bug_unresolved_v475`
       with a precise record of what was tried and the exact error at each step -- do not fabricate a
       partial success. This is an acceptable, honest outcome; per this task's `prior_failures` block,
       `retire_if_same_verdict: true` means this specific mitigation-attempt scope ("try another
       device_map variant") retires if this happens, and a future attempt needs either a genuinely
       different root-cause theory or operator escalation.

    REQUIRED ARTIFACT FIELDS:
      diffusiongemma_loadable:
        value: bool
        principle: "The single gate field exp5183 reads via gated_on -- must be true ONLY if a real
          forward pass was confirmed, never merely 'from_pretrained returned without raising'.
          MECHANICAL CONSTRAINT (verified against scripts/conductor_gates.py before writing this task):
          this field MUST be written as a BARE top-level boolean in the artifact JSON, e.g.
          \"diffusiongemma_loadable\": true -- NOT wrapped as {\"value\": true, \"principle\": \"...\"}
          the way most other principle-annotated fields in this project's artifacts are conventionally
          written. conductor_gates.py's evaluate_gates() does `data.get('diffusiongemma_loadable')` and
          compares it directly against `True`; a wrapped dict does not equal `True` and the gate would
          silently and permanently block exp5183 (the exact failure class documented in the
          feedback_gated_fields_must_be_bare project memory, the .330 cascade incident). Every OTHER
          field in this artifact may use the normal {value, principle} convention; this one field must
          not."
      forward_pass_confirmed:
        value: bool
      mitigations_tried:
        value: "ordered list of {mitigation, outcome, error_if_any, duration_s}"
        principle: "Must show genuinely new attempts, not a re-run of .474's 5 device_map=auto variants
          -- an adversarial reviewer should be able to diff this list against exp5173's tried[] and see
          zero overlap."
      transformers_accelerate_bitsandbytes_versions:
        value: "exact version strings, to catch a version-regression root cause"
      preconditions_checked:
        value: "list of {resource, available}"
      random_seed:
        value: int
      reproducibility_checksum:
        value: string
      inference_substrate:
        value: live_llm_inference
        principle: "A real forward pass, if achieved, is genuine GPU compute -- the 60s floor applies
          honestly; if blocked before any forward pass, duration reflects the diagnostic attempts only."
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_ or blocked_, and must not claim
          diffusiongemma_loadable=true without a confirmed forward pass."

    Do not push. Do not modify scripts/research_conductor.py.

- id: exp5183-diffusiongemma-energy-guided-pilot-v475
  milestone: 2026.07.475
  title: PHASE A2 the actual DiffusionGemma energy-guided-vs-unguided-vs-AR pilot, gated on exp5182 unblocking
    the load
  priority: critical
  track: verification
  deliverable: results/experiment_5183_diffusiongemma_energy_guided_pilot_v475.json
  gated_on:
  - upstream: exp5182-diffusiongemma-meta-tensor-rootcause-fix-v475
    artifact_field: diffusiongemma_loadable
    op: '=='
    value: true
  prior_failures:
  - experiment_id: exp5173-diffusiongemma-energy-guided-diffusion-pilot-v474
    verdict: blocked_diffusiongemma_meta_tensor_bug_unresolved
    addressed_by: "exp5173 never reached the measurement phase (blocked at load). This task only runs at
      all if exp5182 (this milestone) confirms a real forward pass; it then executes the exact 3-arm
      design exp5173 already specified (AR best-of-N baseline, unguided diffusion, energy-guided
      diffusion) using the same guidance-mechanism formula exp5173 documented
      (logit_model(i,t) - lambda_energy * verifier_energy(partial_canvas_with_t)), so this is a genuine
      continuation of gated-pending work, not a rerun of a failure."
    retire_if_same_verdict: false
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 60
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. This task ONLY executes if exp5182 (this milestone)
    set `diffusiongemma_loadable=true` with a confirmed forward pass -- the conductor's gated_on mechanism
    skips this task entirely otherwise, so if you are reading this prompt, assume loading now works and
    focus on the measurement.

    Reuse exp5173's already-specified design exactly (it was carefully constructed and gated on exp5171's
    now-hardened cross-corpus result -- do not redesign from scratch):
    - THREE ARMS: (1) AR best-of-N autoregressive Gemma baseline, (2) unguided DiffusionGemma diffusion,
      (3) energy-guided DiffusionGemma diffusion.
    - GUIDANCE MECHANISM (verbatim from exp5173's `guidance_mechanism_design`): "Per denoising step, score
      the current token-candidate slate with the native DiffusionGemma logits and an executable-verifier
      energy. The composed score for token t at position i is
      logit_model(i,t) - lambda_energy * verifier_energy(partial_canvas with t inserted). Sampling/commit
      uses the same low-entropy DiffusionGemma commit order after this reweighting; no post-hoc reranking
      of completed samples is counted as guided diffusion."
    - A NEW mitigation to consider for the guidance itself (per exp5172's SOTA-ingestion literature find):
      EDLM (arXiv:2410.21357, ICLR 2025) documents a concrete, ~1.3x-overhead (not Nx) energy-injection
      recipe for discrete diffusion denoising -- read it if the exp5173 formula above needs a concrete
      implementation reference for the resampling/reweighting step.
    - CIRCULARITY CONTROL (per CLAUDE.md's Circularity/Oracle-Distinctness Discipline -- exp5173 got
      flagged CIRCULAR_MOAT_OVERCLAIM/MOAT_CLAIM_RIGOR for setting verifier_is_oracle=true while framing
      results as gate-eligible): if the `verifier_energy` term in the guidance formula is computed by an
      EXECUTABLE test-suite oracle (the same oracle that defines task correctness), set
      `verifier_is_oracle: true` explicitly and frame any positive result as "execution-grounded
      verification helps diffusion decoding" -- NOT as a moat-proven claim, and do NOT flip the
      DiffusionGemma gate on this alone. If instead you use an oracle-DISTINCT energy (a learned/probe
      signal, not the test oracle itself), set `verifier_is_oracle: false` and this result IS
      gate-eligible. Decide and declare this BEFORE running any arm, not after seeing results.
    - CONTROL ARM for intrinsic confidence (per exp5172's citation): VFScale (arXiv:2502.01989) -- an
      intrinsic-confidence-only signal with no external verifier, to separate "guidance helps because it's
      a verifier" from "guidance helps because any confidence signal would."
    - TELEMETRY precondition (per exp5172's citation): commit-position telemetry (arXiv:2606.14620) --
      log which token positions get committed at each denoising step, to make any guidance-helped claim
      independently auditable by a third party.

    EXISTING CODE TO READ FIRST:
    - results/experiment_5173_diffusiongemma_energy_guided_diffusion_pilot_v474.json (the full 3-arm
      design, field_principles, and REQUIRED ARTIFACT FIELDS -- reuse this schema).
    - results/experiment_5182_diffusiongemma_meta_tensor_rootcause_fix_v475.json (this milestone's own
      unblocking fix -- use the EXACT load path/mitigation it confirmed working).
    - python/carnot/experiment_5173_diffusiongemma_energy_guided_diffusion_pilot_v474.py (the pilot
      harness code -- extend it with the confirmed load path, do not rewrite).
    - ops/verifier_gaps.md / docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md (task
      corpus and what counts as pass@1).

    CONCRETE STEPS:
    1. PRECONDITIONS: re-confirm GPU availability (`nvidia-smi`) and re-load the model using exactly the
       mitigation exp5182 confirmed working. If it fails to reproduce (environment drift since exp5182
       ran), write `honest_verdict: blocked_diffusiongemma_load_regressed_since_exp5182` and stop.
    2. Run the AR best-of-N baseline arm on the pilot task set.
    3. Run the unguided DiffusionGemma diffusion arm.
    4. Run the energy-guided DiffusionGemma diffusion arm with the guidance formula above, declaring
       `verifier_is_oracle` correctly per the circularity control discussion.
    5. Run the VFScale intrinsic-confidence-only control arm.
    6. Compute pass@1 per arm, bootstrap CI95 for guided-vs-unguided and guided-vs-AR deltas, and
       compute_cost_per_arm (GPU count, wall-clock) -- the north star's efficiency axis is co-equal with
       accuracy, so a guided win that costs materially more compute is a different, weaker finding than a
       Pareto win.
    7. Update `ops/known-issues.md`'s DiffusionGemma gate note and `docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md`
       with the actual result -- do not inflate a marginal or null result.

    REQUIRED ARTIFACT FIELDS:
      pass_at_1_ar_baseline:
        value: float
      pass_at_1_unguided:
        value: float
      pass_at_1_guided:
        value: float
      pass_at_1_vfscale_control:
        value: float
      guided_vs_unguided_delta_ci95:
        value: "[lo, hi]"
      guided_vs_ar_delta_ci95:
        value: "[lo, hi]"
      compute_cost_per_arm:
        value: "{arm: {gpu_count, wall_clock_s}}"
      verifier_is_oracle:
        value: bool
        principle: "Must be declared BEFORE seeing results and match the actual energy-term construction;
          this is exactly what exp5173's corrigendum flagged when violated."
      headroom_present:
        value: bool
      commit_position_telemetry:
        value: "per-step token-commit log, sampled"
      random_seed:
        value: int
      reproducibility_checksum:
        value: string
      inference_substrate:
        value: live_llm_inference
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_ or blocked_, and state plainly
