- id: exp1133-prm-biasbench-adversarial-test
  milestone: 2026.04.88
  deliverable: results/experiment_1133_prm_biasbench_adversarial_test.json
  title: "PRM-BiasBench Adversarial Test on k=5 AND-Compose Ensemble"
  model: sonnet
  max_turns: 35
  estimated_wall_time_min: 25
  priority: medium
  requires_gpu: false
  gated_on:
