- id: exp1142-beaver-lite-certificate-tier
  milestone: 2026.04.89
  deliverable: results/experiment_1142_beaver_lite_certificate_tier.json
  title: "BEAVER-Lite Deterministic Prefix Constraint Bounder — Unsafe Mass Certificates"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 35
  priority: high
  requires_gpu: false
  prompt: |
    CONTEXT:
    Carnot's k=5 AND-compose ensemble has AUROC=0.9402 on sampled outputs. But it certifies
    individual samples, not the probability mass of all possible bad outputs. The next step
    toward verifiable reasoning (PRD FR-12) is a certificate tier: "under these constraints,
    the model assigns at most p_bad probability mass to invalid outputs."

    arXiv 2512.05439 BEAVER: Deterministic, sound probability bounds using token-trie/frontier
    data structures. Key result: 6-8x tighter bounds and 3-4x more high-risk-instance discovery
    than baselines. Uses prefix-closed semantic constraints.

    This experiment builds a BEAVER-lite bounder for Carnot's arithmetic constraints (GSM8K-style).
    The implementation does NOT need to replicate the full BEAVER paper. It needs to:
    1. Define a prefix-closed arithmetic constraint (e.g., "the final answer must be a positive integer")
    2. Enumerate token prefixes and bound the probability mass of constraint-violating completions
    3. Compare bound tightness vs empirical sampling (run 100 samples, report empirical violation rate
       vs the bound)

    IMPORTANT: Use logprob access from llama.cpp (llama-cpp-python's logits). This does NOT require
    a live large model — a small model (Qwen3.5-0.8B) is acceptable for the bounder prototype
    since we are testing the MECHANISM, not the headline result. The headline result uses SOTA GGUF.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py (find Z3MathVerifier class and constraint definition)
    - python/carnot/models/ (find energy function interface)
    - results/experiment_1142_* does not exist yet — this is the first attempt

    TASK:
    1. Design a minimal prefix-closed constraint: "response ends with an integer between 0 and 9999"
       (a simple GSM8K answer constraint). This is prefix-closed: once we see any non-integer token
       after a definitive end-of-sequence, the constraint is violated.
    2. For a sample GSM8K question (e.g., "If Alice has 3 apples and Bob gives her 4, how many
       does she have?"):
       a. Using llama-cpp-python (or mock token logprobs if llama.cpp not available), enumerate
          the top-K (K=50) completions by greedy search.
       b. Score each completion: does it satisfy the final-integer constraint?
       c. Compute empirical violation rate: fraction of K completions that violate the constraint.
       d. Compute the BEAVER-lite upper bound: sum of logprob mass for all prefixes that
          ALREADY violate the constraint (i.e., the bound is: P(any prefix violates) which is an
          upper bound on P(final completion violates)). Use log-sum-exp for numerical stability.
    3. Compare: beaver_lite_upper_bound vs empirical_violation_rate.
       Document: bound_gap = beaver_lite_upper_bound - empirical_violation_rate.
       A gap of 0 means the bound is tight; positive gap means it's loose (conservative).
    4. If llama.cpp logprob access is not available (no live model): implement the bound computation
       with mock logprobs (e.g., uniform distribution) and document that mode as "mock_logprobs=True".
    5. Write the BEAVER-lite module at python/carnot/verify/beaver_lite.py.

    CONCRETE STEPS:
    - python3 -c "from llama_cpp import Llama; print('llama_cpp available')" 2>/dev/null || echo "llama_cpp not available"
    - python3 -c "from python.carnot.verify.z3_math import Z3MathVerifier; print('Z3MathVerifier available')" 2>/dev/null || echo "z3 not available"
    - (Implement python/carnot/verify/beaver_lite.py)
    - python3 -c "
      from python.carnot.verify.beaver_lite import BEAVERLiteBounder
      b = BEAVERLiteBounder()
      result = b.bound_prefix_violation('If Alice has 3 apples and Bob gives her 4, how many does she have?')
      print('bound:', result.upper_bound)
      print('empirical:', result.empirical_rate)
      print('gap:', result.bound_gap)
      "
    - Write results/experiment_1142_beaver_lite_certificate_tier.json

    REQUIRED ARTIFACT FIELDS:
    - beaver_lite_bounder_written: bool
    - module_path: "python/carnot/verify/beaver_lite.py"
    - n_sample_questions: int
    - n_completions_sampled: int
    - mock_logprobs_used: bool (True if no live LLM was available)
    - unsafe_mass_bound: float (BEAVER-lite upper bound on violation probability)
    - empirical_violation_rate: float
    - bound_gap: float (unsafe_mass_bound - empirical_violation_rate; should be >= 0)
    - bound_is_sound: bool (True if bound_gap >= 0, meaning bound is never below empirical)
    - beaver_lite_bound_reported: bool (always True)
    - honest_verdict: "sound_bound_live_logprobs" | "sound_bound_mock_logprobs" | "bound_violated_bug" | "llm_access_blocked"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1142_beaver_lite_certificate_tier.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1143-halluguard-cascade-router-v3
  milestone: 2026.04.89
  deliverable: results/experiment_1143_halluguard_cascade_router_v3.json
  title: "HalluGuard NTK Cascade Router v3 — Data-vs-Reasoning Routing Feature"
  model: sonnet
  max_turns: 35
  estimated_wall_time_min: 30
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1123-adaptive-cascade-lagrangian
      verdict: savings_positive_accuracy_degraded
      addressed_by: |
        exp1123 used a feature-free MLP router (no verifier-score features), degrading accuracy
        22.9pp. exp1131 fixed the accuracy by adding verifier-score features. exp1143 is
        DIFFERENT in scope: it adds HalluGuard-style NTK features (data-driven mismatch vs
        reasoning-driven decoding instability) as additional routing signals. exp1131 addressed
        the no-features root cause; exp1143 asks whether failure-type decomposition improves
        calibration further.
      retire_if_same_verdict: false
    - experiment_id: exp1131-lagrangian-cascade-v2
      verdict: savings_accuracy_both_positive
      addressed_by: |
        exp1131 confirmed accuracy-preserving Lagrangian cascade with 3.2% savings. exp1143 is
        a routing FEATURE experiment on top of exp1131's fixed architecture. The scope is
        different: exp1131 tested whether the router works; exp1143 tests whether adding
        theory-motivated NTK features from HalluGuard explains cheap-tier failure modes.
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    From exp1132 (.88 Goodfire cascade TP), cheap tiers have low TP rates:
      - ThinkPRM: 13.9% TP
      - SemEnergy: 22.2% TP
      - SymCode: 8.3% TP
      - CausalReasoning: 2.8% TP
    But k=5 has 100% TP — the cascade escalates successfully. The problem: cheap tiers escalate
    EVERYTHING to k=5 (false negatives from cheap tiers waste compute). We need the router
    to KNOW when cheap tiers will fail, so it can route appropriately without k=5 for every query.

    arXiv 2601.18753 HalluGuard decomposes hallucination into:
    1. DATA-DRIVEN mismatch: embedding/representation distance from training distribution
       (NTK/GP-based kernel score; high distance = model doesn't "know" this domain)
    2. REASONING-DRIVEN instability: decoding entropy/probability variance
       (logprob variance over N samples; high variance = uncertain reasoning path)

    From exp1132: ThinkPRM's 13.9% TP on Goodfire exemplars suggests cheap tiers fail on
    reasoning-driven errors (model is confident but wrong). The cascade exp1131 uses
    sem_energy_score, response_length, step_count as features. Adding data/reasoning class
    features should explain WHEN to route to k=5.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1131_lagrangian_cascade_v2.json (read verifier_score_features_used)
    - results/experiment_1132_goodfire_exemplar_cascade_tp.json (read per_tier_tp_rate)
    - scripts/experiment_1131_lagrangian_cascade_v2.py (if it exists, read the MLP architecture)
    - python/carnot/pipeline/verify_repair.py (find cascade router invocation)

    TASK:
    1. Read exp1131's cascade v2 architecture (MLP with 3 features: sem_energy, length, steps).
    2. Add 2 HalluGuard-style features to the router:
       a. ENTROPY_PROXY: mean token entropy over the response.
          Approximation (no logprob access needed): use the ratio of unique tokens to total tokens.
          high_unique_ratio ≈ high entropy ≈ reasoning-driven instability.
       b. EMBEDDING_DISTANCE: cosine distance from the query embedding to the FoVer training
          set centroid.
          Approximation: use sentence-transformers 'all-MiniLM-L6-v2' (local, no API).
          high_distance ≈ out-of-distribution ≈ data-driven mismatch.
    3. Retrain the cascade v2 MLP with the 5-feature input (sem_energy + length + steps + entropy +
       distance) on 5000 FoVer examples.
    4. Evaluate on 500 holdout FoVer examples:
       - adaptive_tp_rate (target: same or better than exp1131's TP)
       - cost_savings_pct
       - accuracy_delta
    5. Analyze: on the Goodfire exemplar failures (ThinkPRM misses), do the new features predict
       routing to k=5?

    CONCRETE STEPS:
    - python3 -c "from sentence_transformers import SentenceTransformer; print('ST available')" 2>/dev/null || pip install sentence-transformers -q
    - python3 scripts/experiment_1143_halluguard_cascade_router_v3.py

    REQUIRED ARTIFACT FIELDS:
    - halluguard_features_added: list[str] (["entropy_proxy", "embedding_distance"])
    - n_router_features_before: 3
    - n_router_features_after: 5
    - training_set_size: int
    - holdout_set_size: int
    - adaptive_tp_rate: float
    - fixed_tp_rate: float
    - accuracy_delta: float (adaptive_tp - fixed_tp)
    - cost_savings_pct: float
