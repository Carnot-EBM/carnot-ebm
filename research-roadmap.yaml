  - id: exp2731
    milestone: "2026.05.259"
    deliverable: "results/experiment_2731_semantic_energy_tier0g.json"
    title: "Semantic Energy Verifier Tier 0g (arXiv:2508.14496): Boltzmann Cluster Energy for Live GGUF"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: verifier

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .259 — motivated by exp2715's degenerate energy scores.

      arXiv:2508.14496 "Semantic Energy: Detecting LLM Hallucination Beyond Entropy" (Aug 2025):
      Clusters LLM outputs by semantic equivalence (cosine similarity of TF-IDF or embedding vectors),
      then assigns energy via a Boltzmann distribution over cluster probabilities:
        E(x) = -log P(cluster(x)) where P(cluster) = size(cluster) / total_outputs
      Low-energy = high-probability cluster = likely correct. High-energy = rare cluster = likely hallucination.
      Validated: TruthfulQA AUROC 0.82, HaluEval AUROC 0.79. Non-degenerate by design.

      Context: exp2727 investigates WHY exp2715's energy was all-zero. Semantic Energy (this task)
      provides an ALTERNATIVE verifier that avoids zero-energy collapse regardless of exp2727's finding.
      Both tasks are independent and complementary.

      MODEL_SPECS (mandatory per CLAUDE.md SOTA GGUF — used only if GGUF cached for validation):
        - name: Qwen3.6-35B-A3B-GGUF
          hf_id: unsloth/Qwen3.6-35B-A3B-GGUF
          role: optional_validation

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (list all tier0* modules — add tier0g_semantic_energy.py)
      - data/fover_corpus.jsonl (FoVer corpus — used for training and baseline)
      - python/carnot/verify/__init__.py (export pattern)

      TASK: Implement Tier 0g Semantic Energy Verifier. Evaluate on FoVer corpus. Confirm non-degenerate.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            Record: fover_corpus_lines (int).
            If 0 or missing: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         c. Check Qwen3.6 GGUF cached (optional validation only):
            `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/ 2>/dev/null | head -1`
            Record: qwen_cached (bool).
         Record: preconditions_checked.

      1. Load FoVer corpus. Compute TF-IDF features (random_seed=42, max_features=5000).
         n_corpus_entries = number of (question, answer) pairs.
         Record: n_corpus_entries (int).

      2. Implement SemanticEnergyVerifier:
         For a (question, response) pair:
           a. Compute TF-IDF of response
           b. Find k=5 nearest neighbors in FoVer corpus (by cosine similarity)
           c. Cluster assignment: bin by cosine distance (< 0.3 = same cluster, else new cluster)
           d. E(response) = -log(cluster_size / n_corpus_entries + epsilon)
         Save cluster index to results/tier0g_cluster_index.pkl.
         Record: module_created (bool), n_clusters (int).

      3. Evaluate on FoVer eval split (80/20, random_seed=42):
         For each (question, correct) and (question, incorrect) pair:
         Energy for correct answer should be LOWER than incorrect (verifier direction check).
         tier0g_auroc = roc_auc_score(labels=[0,0,...,1,1,...], scores=energies)
         tier0g_ece = calibration ECE (10 bins)
         tier0g_non_degenerate = (energy_std > 0.01 AND energy_max - energy_min > 0.1)
         Record: tier0g_auroc (float), tier0g_ece (float), tier0g_non_degenerate (bool).

      4. Adversarial check: run on 3 synthetic Qwen3.6-format responses (markdown, special tokens):
         Confirm energies are non-zero (critical: must not reproduce exp2715 zero-energy collapse).
         Record: synthetic_energies (list of 3 floats), all_non_zero (bool).

      5. If qwen_cached: read 3 cached GGUF output examples and compute energy.
         Record: live_gguf_tested (bool).
         gguf_energies (list of float — 3 values). gguf_non_degenerate (bool).

      6. Create python/carnot/verify/tier0g_semantic_energy.py with SemanticEnergyVerifier.
         Update python/carnot/verify/__init__.py to export it.

      7. Write results/experiment_2731_semantic_energy_tier0g.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - tier0g_auroc: float
        principle: "Primary accuracy metric; arXiv:2508.14496 claims 0.79-0.82 AUROC."
      - tier0g_non_degenerate: bool
        principle: "Critical gate: True confirms Semantic Energy avoids exp2715 zero-energy collapse."
      - synthetic_energies: list of float
        principle: "Adversarial check: must be non-zero on markdown/code responses (degenerate verifier test)."
      - all_non_zero: bool
        principle: "Confirms Semantic Energy works on Qwen3.6-format responses without zero-collapse."
      - tier0g_ece: float
        principle: "Calibration quality: lower is better (arXiv:2508.14496 secondary metric)."
      - n_clusters: int
        principle: "Confirms clustering is non-trivial (expected > 10 for FoVer corpus)."
      - module_created: bool
        principle: "SemanticEnergyVerifier module exists in python/carnot/verify/ after this task."
      - random_seed: int — 42
        principle: "Reproducibility."
      - duration_s: float
