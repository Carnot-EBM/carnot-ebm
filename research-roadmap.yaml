        retire_if_same_verdict: false
    milestone: "2026.05.318"
    title: "P0.1 generation corpus builder — k-sample GSM8K generations (resumable, progress-printing, timeout-proof)"
    priority: critical
    max_turns: 100
    model: opus
    agent_type: claude
    requires_claude: true   # (1) gemini-cli is DOWN (.315/.316); (2) 5+ files: GGUF loader + GSM8K corpus + per-token logprob capture + checkpoint/resume JSONL writer + progress harness; (3) open-ended judgment on the resume protocol, the per-problem progress cadence that defeats the idle-timeout, and the warm-up non-degenerate-SC self-check no deterministic gate substitutes for.
    estimated_wall_time_min: 30
    track: evidence
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: "results/experiment_3448_p01_generation_corpus_builder_v1.json"
    prompt: |
      CONTEXT: P0.1 (does energy-based selection/voting on continuous latents BEAT
      plain token-sampling self-consistency at equal compute?) is the single most
      important test in the project and has failed to answer THREE times. The .317
      failure (exp3437) was NOT scientific — it was a 1201s idle-timeout: a single
      in-session job doing live 35B generation over 200xk samples ran silently past
      the agent's ~20-minute wall-clock+idle budget and produced no artifact. The
      fix is to DECOUPLE: this task does ONLY generation, producing a cached corpus
      that the scoring task (exp3449) consumes with no live model and thus no
      timeout. Your job is to build (and, on re-invocation, EXTEND) a resumable
      generation corpus on GSM8K.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3426_energy_descent_vs_ar_vs_self_consistency_premise_v2.json
          (the broken-harness predecessor; note its k-sample 0.0 bug — per-sample
          answer extraction failed)
        - scripts/experiment_template.py (cached_sota_pair, BatchedInferenceRunner)
        - results/experiment_281_results.json (the GSM8K corpus reference)
        - CLAUDE.md "SOTA Local Models" + "GGUF tokenizer rule (MANDATORY — 2026-05-29)"
        - ops/known-issues.md exp3312 spec (authoritative P0.1 spec)

      TASK: Generate k sampled candidate solutions per GSM8K problem from the SOTA
      GGUF, capturing per-token logprobs (needed downstream for self-certainty BoN),
      and append each completed problem to data/p01_gsm8k_generations.jsonl. Target
      n=120 problems x k=6 samples + 1 greedy generation/problem; EXIT CLEAN with
      whatever you complete.

      PRECONDITIONS (step 0, before any generation — emit blocked_* and STOP if a/b/c fail):
        a. CUDA available: python -c "import torch; assert torch.cuda.is_available()".
           If not -> honest_verdict blocked_cuda_unavailable.
        b. SOTA GGUF loads via the GGUF path (NOT AutoTokenizer on a -GGUF repo id;
           embedded tokenizer per the 2026-05-29 GGUF tokenizer rule):
           llama_cpp.Llama(model_path=..., vocab_only=True).tokenize(b"x") succeeds.
           MODEL_SPECS = ["unsloth/gemma-4-26B-A4B-it-GGUF"] (fastest SOTA MoE).
           If not -> blocked_sota_gguf_tokenizer_unavailable.
        c. GSM8K subset with ground-truth labels present (exp281 corpus acceptable).
           If not -> blocked_real_task_corpus_missing.

      CONCRETE STEPS:
        1. Load the GSM8K split: a fixed, documented, held-out set of >=120 problems
           with a documented seed. Record the exact problem ids/order.
        2. RESUME: if data/p01_gsm8k_generations.jsonl already exists, read which
           problem ids are already complete and SKIP them. Only generate for
           problems not yet in the file.
        3. For each remaining problem: generate 1 greedy generation (temp 0) AND k=6
           sampled generations (temp ~0.8), capturing for EACH generation: the raw
           text, the extracted numeric answer, AND the per-token / mean-token logprob
           (mean token confidence). Cap max_tokens (~320) so each generation is
           bounded in wall time.
        4. CHECKPOINT: append one JSONL row per COMPLETED problem immediately after it
           finishes (do not buffer to the end), so an interruption loses at most one
           problem and a re-invocation resumes.
        5. PROGRESS: print a one-line progress message to stdout after EVERY problem
           (e.g. "[exp3448] problem 37/120 done, 6 samples, elapsed 412s"). This is
           LOAD-BEARING: it keeps the subprocess from being silent for 20 minutes and
           is what makes the 1201s idle-timeout that killed exp3437 impossible.
        6. WARM-UP NON-DEGENERATE-SC SELF-CHECK: after the first >=20 problems, compute
           the self-consistency (majority-vote) accuracy over the k samples AND the
           greedy accuracy. Assert SC >= greedy AND SC > 0.30. If SC is 0.0 or below
           greedy, the per-sample answer extraction is BROKEN (the exp3426 bug) — record
           self_consistency_non_degenerate=false with the raw extracted answers of 3
           example problems so the bug is diagnosable, but CONTINUE generating (the
           corpus is still useful and exp3449 re-validates this gate).
        7. WALL-TIME BUDGET: if you approach ~18 minutes of wall time, STOP generating,
           finalize the JSONL, and EXIT CLEAN (code 0). A partial corpus is progress.
        8. Emit the artifact recording how many problems/samples landed and the
           warm-up SC self-check.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="Terminal verdict must start with complete:/success:/passed:/shipped_."
        inference_substrate: value=live_llm_inference
        corpus_path: principle="data/p01_gsm8k_generations.jsonl — the cached corpus exp3449 consumes."
        n_problems_completed: principle="problems with a full set of generations in the corpus after this run."
        n_problems_target: principle="the target (120); n_completed < target -> the builder resumes next milestone."
        k_samples: principle="sampled generations per problem (6); the matched-compute budget for the scoring task."
        per_sample_logprobs_captured: principle="boolean: mean-token confidence stored per generation, required for self-certainty BoN downstream."
        self_consistency_non_degenerate: principle="warm-up gate: SC accuracy >= greedy AND > 0.30 — proves the per-sample answer extraction works (the exp3426 0.0-bug guard)."
        warmup_self_consistency_accuracy: principle="majority-vote accuracy on the warm-up batch."
        warmup_greedy_accuracy: principle="greedy accuracy on the warm-up batch."
        model_specs: principle="the actual GGUF invoked (gemma-4-26B-A4B-it-GGUF)."
        random_seed: principle="determinism precondition for reproducibility."
        reproducibility_checksum: principle="content hash of corpus split + model + seed."
        duration_s: principle="real live MoE generation takes wall time; 60s floor — a sub-60s duration is the fabrication signal."

      ACCEPTANCE GATES:
        - condition: "n_problems_completed >= 30 AND per_sample_logprobs_captured == true"
          principle: "G1 CORPUS-USABLE: at least a CLT-minimum corpus with the logprobs the scoring task needs; below this the scoring task has nothing to answer P0.1 on."

      TERMINAL VERDICTS (all start with complete:):
        - n_completed >= target -> "complete: p01_generation_corpus_complete_n=NN"
        - 30 <= n_completed < target -> "complete: p01_generation_corpus_partial_resumable_n=NN" (progress, not failure)
        - n_completed < 30 (preconditions ok but ran out of budget early) -> "complete: p01_generation_corpus_seeded_n=NN_resume_next_milestone"
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3448_p01_generation_corpus_builder_v1.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  # ---- P0.1 step 2 of 2: cached SCORING — THE crux answer (cannot time out) ----
  - id: exp3449-p01-energy-vote-vs-self-consistency-cached-scoring-v4
    operator_override: "2026-05-29 operator directive (standing): P0.1 (exp3312) is the project's single most important test. This is the NEW second half of the decoupled design — pure cached-candidate scoring over exp3448's corpus (no live model -> cannot idle-timeout, the exp3437 failure mode). It supersedes the coupled exp3437/exp3426/exp3312 attempts and adds the energyxSC HYBRID condition per arXiv:2510.14913 + the .317 Kona hybrid finding. Not a doomed rerun: different substrate (cached scoring), different structure (decoupled), sharper bar (beat SC, not greedy AR)."
    prior_failures:
      - experiment_id: exp3437-energy-vote-vs-self-consistency-real-harness-premise-v3
        verdict: "no artifact produced (Wall-clock+idle timeout after 1201s x3, retired)"
        addressed_by: "exp3437 timed out because it generated live in-session. This task invokes NO live model — it scores exp3448's CACHED generations (inference_substrate=verifier_ensemble_against_cached_candidates), so it completes in seconds and cannot time out. It is the same comparison exp3437 intended but on cached data."
        retire_if_same_verdict: true
      - experiment_id: exp3426-energy-descent-vs-ar-vs-self-consistency-premise-v2
        verdict: "complete: degenerate 0.0-vs-0.0 tie (every k-sample condition = 0.0; broken per-sample extraction)"
        addressed_by: "exp3426's per-sample extraction was broken. exp3448 already validated a NON-DEGENERATE SC warm-up gate before writing the corpus, and this task RE-asserts the non-degenerate-SC gate over the full cached corpus BEFORE reporting any energy comparison, so a 0.0 tie cannot ship."
        retire_if_same_verdict: true
      - experiment_id: exp3312-energy-descent-vs-autoregressive-premise-v1
        verdict: "complete: flagged_adversarial; energy 0.840 LOST to equal-compute self-consistency 0.895"
        addressed_by: "exp3312 was flagged and compared only to greedy AR. This task clears the flag (cached scoring, real provenance) and makes matched-compute SC the PRIMARY control, with the energyxSC hybrid added per arXiv:2510.14913."
        retire_if_same_verdict: true
    milestone: "2026.05.318"
    title: "P0.1 v4 — Energy-Weighted Vote vs Self-Consistency vs Hybrid (cached scoring, matched compute, non-degenerate-SC gate)"
    priority: critical
    max_turns: 80
    model: opus
    agent_type: claude
    requires_claude: true   # (1) gemini-cli is DOWN; (2) 5+ files: the corpus reader + boltzmann_gpt energy + verifier energy + 6 condition scorers + per-sample extraction + paired McNemar/bootstrap; (3) open-ended judgment on the non-degenerate-SC gate, matched-compute accounting, and the energy-weighting / hybrid scheme no deterministic gate substitutes for.
    estimated_wall_time_min: 35
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: true
    deliverable: "results/experiment_3449_p01_energy_vote_vs_self_consistency_cached_scoring_v4.json"
    prompt: |
      CONTEXT: This is the SCORING half of the decoupled P0.1 pipeline. exp3448 built
      a cached corpus of k sampled generations/problem on GSM8K (with per-sample
      logprobs). This task scores SIX conditions over that cached corpus at MATCHED
      compute and answers the crux: does energy-based selection/voting BEAT plain
      majority-vote self-consistency? Because it invokes NO live model, it completes
      in seconds and CANNOT idle-timeout (the exp3437 failure mode). The sharpened
      bar (arXiv:2410.12608 "Not All Votes Count" + arXiv:2510.14913 budget-aware
      hybrid): a verifier-weighted vote can beat SC, and a verifier+SC HYBRID beats
      either alone — so the honest target is "energy (or the energyxSC hybrid) >=
      SC", not "energy beats greedy AR". arXiv:2506.01369 is the adversarial counter:
      external verifiers often UNDERPERFORM SC; if energy loses, that is the
      predicted-and-explained outcome and we retire the energy-superiority framing
      honestly. The .317 Kona result (energy is a global heuristic; only the hybrid
      solves) converges with this.

      EXISTING CODE TO READ FIRST:
        - data/p01_gsm8k_generations.jsonl (the cached corpus from exp3448 — the input)
        - results/experiment_3448_p01_generation_corpus_builder_v1.json (corpus metadata + warm-up SC gate)
        - python/carnot/phase3/boltzmann_gpt.py + continuous_ebm.py (the energy substrate)
        - python/carnot/verify/ (verifier energy scorers)
        - research-references.md "2026-05-30 Post-.317 Planning Sweep" (the SC-vs-verifier-vs-hybrid references)
        - ops/known-issues.md exp3312 spec (authoritative P0.1 spec + acceptance gates)

      TASK: Score six conditions over the cached corpus at matched compute, with a
      VERIFIED-NON-DEGENERATE self-consistency baseline as a hard gate, and a
      falsifiable paired significance gate. PRIMARY comparison: energy-weighted vote
      vs majority-vote self-consistency. SECONDARY: the energyxSC hybrid.

      PRECONDITIONS (step 0, before any comparison is reported):
        a. data/p01_gsm8k_generations.jsonl present with >=30 problems each having a
           greedy generation + k>=5 sampled generations + per-sample logprobs. If the
           corpus is absent or n<30 -> honest_verdict
           complete: blocked_p01_corpus_too_small_n=NN (a clean complete: verdict so
           the downstream gate-synth/capstone are NOT cascade-blocked).
        b. The energy substrate (boltzmann_gpt / continuous_ebm / verifier energy) is
           loadable to score a candidate. If not -> complete: blocked_energy_substrate_unavailable.
        c. NON-DEGENERATE-SC GATE (re-asserted over the FULL corpus, the exp3426 fix):
           compute SC (majority-vote) accuracy and greedy accuracy over the corpus;
           assert SC >= greedy AND SC > 0.30. If not -> write honest_verdict
           complete: blocked_self_consistency_harness_degenerate_per_sample_extraction_broken
           with the raw extracted answers for 3 example problems; do NOT report any
           energy comparison against a broken SC.

      CONCRETE STEPS:
        1. Load the cached corpus. Use the SAME paired problems across ALL conditions.
        2. CONDITION 1 (greedy AR floor): the stored greedy generation per problem.
        3. CONDITION 2 (self-consistency, PRIMARY control): majority vote over the k
           sampled answers.
        4. CONDITION 3 (self-certainty BoN, arXiv:2502.18581): select the sample with
           the highest mean-token confidence (from the stored logprobs).
        5. CONDITION 4 (energy-argmin): score each of the k samples with the
           Boltzmann-GPT / verifier energy; select the lowest-energy answer.
        6. CONDITION 5 (energy-WEIGHTED vote, EBM-CoT arXiv:2511.07124): vote weighted
           by softmax(-E/T) over the k samples. THE headline condition.
        7. CONDITION 6 (energyxSC HYBRID, arXiv:2510.14913): combine the SC majority
           signal with the energy weighting (e.g. energy-weighted vote restricted to /
           tie-broken by the SC majority bucket). Report its accuracy.
        8. MATCHED COMPUTE: conditions 2-6 all consume the SAME k cached generations;
           energy adds only the latent-energy scoring (no extra samples). State the
           exact per-condition generation budget.
        9. Compute accuracy per condition + the PRIMARY paired delta (energy-vote
           minus majority-vote SC) AND the hybrid delta (hybrid minus SC) with McNemar
           exact + paired bootstrap CI95. Also report energy-vote minus greedy AR.
        10. Emit results with clean methodology (real duration, seed, checksum,
            inference_substrate=verifier_ensemble_against_cached_candidates).

      REQUIRED ARTIFACT FIELDS: (each carries a principle per CLAUDE.md)
        honest_verdict: principle="complete:/success:/passed:/shipped_ prefix."
        inference_substrate: value=verifier_ensemble_against_cached_candidates
        n_problems: principle="problems scored from the cached corpus; >=30 preliminary, >=80 headline-eligible."
        k_samples: principle="sampled generations/problem consumed (the matched-compute budget)."
        self_consistency_non_degenerate: principle="re-asserted over the full corpus: SC >= greedy AND > 0.30 — the gate that makes the exp3426 0.0-tie impossible to ship."
        ar_greedy_accuracy: principle="1-sample greedy control."
        self_consistency_accuracy: principle="majority vote over k samples — the PRIMARY control energy must beat; MUST be non-degenerate."
        self_certainty_bon_accuracy: principle="self-certainty Best-of-N (arXiv:2502.18581) — the strongest cheap selector."
        energy_argmin_accuracy: principle="energy-argmin selection over the same k samples."
        energy_weighted_vote_accuracy: principle="energy-weighted vote (EBM-CoT) — the premise under test; the headline condition."
        energy_sc_hybrid_accuracy: principle="energyxSC hybrid (arXiv:2510.14913) — verifier+sampling hybrids beat either alone; mirrors the .317 Kona hybrid finding."
        delta_energy_vs_self_consistency: principle="energy_weighted_vote minus self_consistency at matched compute — THE headline."
        delta_hybrid_vs_self_consistency: principle="hybrid minus SC — does combining beat plain majority vote?"
        delta_energy_vs_greedy_ar: principle="energy minus greedy AR — for continuity with exp3312/exp3426."
        paired_significance: principle="McNemar exact p + paired bootstrap CI95 for the PRIMARY (energy vs SC) and hybrid deltas; an unpaired or n<30 delta is gameable."
        compute_parity_note: principle="per-condition generation budget + param count so energy does not win by spending more compute."
        random_seed: principle="determinism precondition for reproducibility."
        reproducibility_checksum: principle="content hash of corpus + substrate + seed."
        duration_s: principle="cached scoring; 1s floor (no live model — this is why it cannot time out)."

      ACCEPTANCE GATES:
        - condition: "self_consistency_non_degenerate == true BEFORE any energy comparison is reported"
          principle: "G0 NON-DEGENERATE-SC: a 0.0-vs-0.0 tie (exp3426) is a broken harness, not a result."
        - condition: "max(energy_weighted_vote_accuracy, energy_sc_hybrid_accuracy) >= self_consistency_accuracy AND paired_significance favors non-inferiority"
          principle: "G1 ENERGY-NON-INFERIOR: energy (or the hybrid) at least matches plain majority vote at equal compute. Below this, energy adds nothing over sampling."
        - condition: "delta_energy_vs_self_consistency > 0 (or delta_hybrid_vs_self_consistency > 0) with paired p < 0.05"
          principle: "G2 ENERGY-ADDS-VALUE: energy (or the hybrid) SIGNIFICANTLY beats majority vote at matched compute — the FIRST real justification for the Phase-3 endgame; clears the arXiv:2410.12608 bar."

      TERMINAL VERDICTS (all start with complete:):
        - corpus too small -> "complete: blocked_p01_corpus_too_small_n=NN" (honest; exp3448 resumes next milestone)
        - step 0c fails -> "complete: blocked_self_consistency_harness_degenerate_per_sample_extraction_broken"
        - G2 passes -> "complete: energy_beats_self_consistency_premise_validated"
        - G1 passes, G2 fails -> "complete: energy_matches_but_does_not_beat_self_consistency_at_equal_compute"
        - G1 fails -> "complete: energy_below_self_consistency_premise_unsupported_retire_superiority_framing"
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3449_p01_energy_vote_vs_self_consistency_cached_scoring_v4.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  # ---- Energy-correctness calibration — WHY P0.1 comes out the way it does -----
  - id: exp3450-energy-correctness-calibration-audit-v1
    operator_override: "2026-05-30 planner (Opus 4.8) under Depth-Over-Breadth: a NEW diagnostic that explains the P0.1 result mechanistically — does the energy signal rank-correlate with answer correctness on the cached corpus? An energy that does not track correctness CANNOT beat SC; this is load-bearing context for P0.1, not a re-measurement of any prior artifact. scope-match vs exp3411 ebm_cot_scaling is a different metric (energy-vs-correctness calibration, not CoT scaling)."
    prior_failures:
      - experiment_id: exp3411-ebm-cot-scaling
        verdict: "flagged_adversarial; corrigendum_pending (ebm-cot scaling metrics)"
        addressed_by: "exp3411 measured EBM-CoT scaling and was flagged. This task answers a different, cleanly-scoped question on cached data: the Spearman rank-correlation and AUROC of the energy score as a correctness classifier over exp3448's corpus. It does NOT re-run EBM-CoT scaling and produces clean methodology (cached scoring, seed, checksum)."
        retire_if_same_verdict: true
    milestone: "2026.05.318"
    title: "Energy-correctness calibration — does the energy signal rank-correlate with answer correctness?"
    priority: high
    max_turns: 50
    agent_type: claude
    requires_claude: true   # gemini-cli is DOWN (.315/.316); cached scoring + judgment on the calibration framing; claude is the only landing backend.
    estimated_wall_time_min: 20
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: true
    deliverable: "results/experiment_3450_energy_correctness_calibration_audit_v1.json"
    prompt: |
      CONTEXT: P0.1 (exp3449) measures whether energy-based selection beats
      self-consistency. THIS task explains WHY it comes out the way it does. If the
      Boltzmann-GPT / verifier energy does not rank-correlate with answer
      correctness, then energy-argmin and energy-weighted vote CANNOT beat SC — the
      mechanism is broken, not the framing. arXiv:2506.01369 predicts external
      verifiers often fail to track correctness; the .317 P0.2 (exp3439) showed the
      ensemble's joint null space is near-collapsed (lambda_min~0). This is a cheap
      cached-scoring diagnostic over exp3448's corpus.

      EXISTING CODE TO READ FIRST:
        - data/p01_gsm8k_generations.jsonl (exp3448 corpus; each generation has a
          correctness label vs ground truth)
        - python/carnot/phase3/boltzmann_gpt.py + continuous_ebm.py + python/carnot/verify/
        - results/experiment_3439_verifier_ensemble_lambda_min_diversity_audit_v3.json
          (the at-risk-grounding context)

      TASK: For every cached candidate generation, compute its energy and its
      correctness label; measure how well energy predicts correctness.

      PRECONDITIONS (step 0):
        a. data/p01_gsm8k_generations.jsonl present with >=30 problems x k samples and
           per-generation correctness labels. If absent/small ->
           complete: blocked_p01_corpus_too_small_n=NN.
        b. The energy substrate is loadable. If not -> complete: blocked_energy_substrate_unavailable.

      CONCRETE STEPS:
        1. For each cached candidate: compute the energy and read the correctness label.
        2. Compute the energy->correctness calibration: Spearman rank-correlation
           (lower energy should mean more-likely-correct), AND the AUROC of -energy as
           a binary correctness classifier across all candidates, AND within-problem
           (does the lowest-energy candidate per problem tend to be the correct one?).
        3. Break down by correctness margin and report whether energy separates
           correct from incorrect candidates at all.
        4. Emit the artifact with clean methodology.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="complete:/success:/passed:/shipped_ prefix."
        inference_substrate: value=verifier_ensemble_against_cached_candidates
        n_candidates: principle="total cached candidates scored."
        energy_correctness_spearman: principle="rank-correlation of energy vs correctness; the core calibration number."
        energy_as_correctness_auroc: principle="AUROC of -energy as a correctness classifier; >0.5 means energy carries signal."
        within_problem_argmin_correct_rate: principle="fraction of problems where the lowest-energy candidate is correct — directly explains energy-argmin accuracy in exp3449."
        random_seed: principle="determinism."
        reproducibility_checksum: principle="content hash."
        duration_s: principle="cached scoring; 1s floor."

      ACCEPTANCE GATES:
        - condition: "energy_as_correctness_auroc > 0.55"
          principle: "G1 ENERGY-TRACKS-CORRECTNESS: energy carries meaningful correctness signal; if it fails, the energy mechanism cannot beat SC and exp3449's outcome is explained at the source."

      TERMINAL VERDICTS (all start with complete:):
        - G1 passes -> "complete: energy_tracks_correctness_auroc_reported"
        - G1 fails -> "complete: energy_does_not_track_correctness_explains_p01_ceiling"
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3450_energy_correctness_calibration_audit_v1.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

