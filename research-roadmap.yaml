    - slug: verifier_ensemble_multi_axis_composition_v1
      rationale: "Related verifier-robustness work; P0.2 (lambda_min diversity audit) is the more fundamental version and runs this milestone. Multi-axis composition graduates to .308+ after the diversity keystone is measured."
    - slug: verifier_ensemble_multi_violation_degradation_curve_v1
      rationale: "Sibling of multi-axis; same dependency on the diversity-audit result. Deferred to .308+."
    - slug: gatemate_n16_flash_timing_smoke_v3
      rationale: "Operator-side hardware action (board flash). Not a path-de-risking experiment; deferred."
    - slug: gatemate_a1_n16_ising_tile_bitstream_build_v2
      rationale: "Operator-side gatemate toolchain action. Deferred."
    - slug: kv260_mmd_vs_cpu_sequential_gibbs_v1
      rationale: "Operator-side KV260 board measurement. Deferred."
    - slug: aquaforte_beaver_pipeline_honest_substrate_corrigendum_v1
      rationale: "Paper-prep corrigendum; queued behind the path-de-risking critical path. Deferred to .308+."

