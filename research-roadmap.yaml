          principle: "the HEADLINE -- did energy routing toward the re-induced goal reach a deeper level."
        no_energy_control:
          principle: "matched control measured the SAME way (energy off) -- the apples-to-apples comparison."
        energy_separation_auroc:
          principle: "AUROC of the trust energy separating deeper-progress states from L1-stuck states -- the signal characterization that is the deliverable on a null."
        deepest_level_reached_per_core_game:
          principle: "best_level per CORE game with vs without energy routing -- the score-lever evidence."
        core_solves_preserved:
          principle: "HARD gate on {{lp85,m0r0,sp80,vc33}}; a dropped CORE solve FAILS the lever."
        positive_control_passed:
          principle: "the energy SHOULD separate deeper-progress on a known-L2 game; guards a silently-broken signal."
        false_negative_risk_checked:
          principle: "a null is valid only if the positive control passed."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "catches silent drift on replay."
        preconditions_checked:
          principle: "records resources verified; pre-empts missing-resource fabrication."

