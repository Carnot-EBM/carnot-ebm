- id: exp1180-paper-v5-critical-issues-1-5
  milestone: 2026.04.92
  deliverable: results/experiment_1180_paper_v5_critical_issues_1_5.json
  title: "Paper v5 Integrity — Critical ISSUE-1 to ISSUE-5 + figure_integrity_audit.py"
  agent_type: claude
  model: opus
  max_turns: 55
  estimated_wall_time_min: 50
  priority: critical
  requires_gpu: false
  prompt: |
    CONTEXT:
    The 2026-05-02 audit found 18 integrity issues in docs/arxiv-paper/main.tex and the 7 figures.
    This experiment addresses the 5 CRITICAL issues that each individually block arXiv submission
    per CLAUDE.md "All headline results must have live GPU provenance."

    Every fix must satisfy the 4-test framework from paper-v5-integrity-remediation.md:
    1. SOURCE-ARTIFACT: every numerical constant traces to a specific results/ JSON field
    2. SAME-BASIS COMPARISON: speedup comparisons use same measurement basis both sides
    3. PROMINENT CAVEATS: extrapolated/estimated claims carry equally-prominent caveats
    4. NO HALLUCINATED CITES: every \cite{} verified as real published work

    EXISTING CODE TO READ FIRST:
    - docs/arxiv-paper/main.tex (the paper being fixed)
    - docs/arxiv-paper/carnot.bib (bibliography)
    - openspec/change-proposals/paper-v5-integrity-remediation.md (full remediation spec)
    - ops/known-issues.md lines 1-100 (publication hold punch-list)
    - results/experiment_1068_ising_sampler_v3_fpga.json (exp1068 FPGA measurements)
    - results/experiment_1094_fpga_cpu_benchmark.json (if exists; exp1094 CPU baseline)
    - results/experiment_1147_hardnet_constraint_verification.json (exp1147 117µs measurement)
    - results/experiment_1121_production_corpus_eval.json (exp1121 AUROC=0.3333)

    TASK (ISSUE-1 through ISSUE-5):

    ISSUE-1 (fig3 11680x fabricated speedup):
    - Read docs/figures/fig3_fpga_latency.py and identify the fabricated CPU baseline constant.
    - Read exp1068 JSON: extract measured FPGA latency (expected: ~24.83 µs at 64 spins).
    - Read exp1094 JSON: extract CPU baseline (expected: ~15.96 µs C++ Glauber; SAME N=64 basis).
    - Rewrite fig3_fpga_latency.py to compute ratio from artifact fields (no hard-coded constants).
    - Honest speedup = exp1068.fpga_latency_us / exp1094.cpu_latency_us (expected: ~1.56x at same N).
      NOTE: if the honest ratio is < 2x, use path (a) from remediation.md instead — delete fig3
      and rewrite main.tex to drop the hardware-speedup figure entirely.
    - Re-render the figure if kept: python3 docs/figures/fig3_fpga_latency.py
    - Update main.tex lines around the fig3 reference to match the honest number.

    ISSUE-2 (KL=3.07 software-proxy framing):
    - grep -n "KL=3.07\|KL = 3.07\|kl.*3\.07\|3\.07.*kl" docs/arxiv-paper/main.tex
    - For each hit: rewrite "FPGA KL=3.07" to "software-proxy KL=3.07; bitstream KL has not been
      measured on-board". Add a sentence in Section 4 paragraph distinguishing bitstream-live vs
      software-proxy measurements.

    ISSUE-3 (15.6x hand-typed CPU baseline):
    - Use path (b) from remediation.md: retract 15.6x headline.
    - Rewrite to cite exp1094's measured CPU latency as the only defensible comparison.
    - grep -n "15\.6x\|15\.6 x\|15\.6-fold" docs/arxiv-paper/main.tex
    - Replace with: "exp1094's measured CPU latency vs FPGA bitstream latency (see Table 3)."

    ISSUE-4 (76,130x HardNet++ apples-to-oranges):
    - grep -n "76.130\|76130\|76,130" docs/arxiv-paper/main.tex
    - Rewrite to: "handled constraint violations in 117µs per case vs 8.9s for prompt repair on
      the same 20 cases (exp1147), without the multiplicative framing that conflates hardware speed
      with LLM API latency."
    - Verify no "76,130" or "76130" remains after replacement.

    ISSUE-5 (SOSKANEnergyV3 collapse hidden):
    - Find where exp1121 is cited in main.tex.
    - Add 2-3 sentences immediately after: "On the FoVer corpus, SOSKANEnergyV3 reaches
      AUROC=0.9545 (exp1072). On the exp1121 production corpus, the SAME verifier reads
      AUROC=0.3333 — a striking confirmation of the out-of-distribution energy-inversion
      pattern described in Section 4. The 3-fold AUROC degradation across corpus shifts
      motivates the multi-verifier AND-composition approach: no single verifier's failure
      mode dominates the ensemble."

    ADDITIONAL: Ship scripts/figure_integrity_audit.py that:
    - Scans docs/figures/*.py
    - Extracts numerical constants (regex: r'\b\d+\.?\d*\b' with context)
    - For each constant, greps results/*.json for a matching artifact field value
    - Flags constants that don't trace to any measured artifact
    - Exits with code 1 if any untraced constants found

    CONCRETE STEPS:
    - cat openspec/change-proposals/paper-v5-integrity-remediation.md 2>&1 | head -80
    - grep -n "76130\|76,130\|15\.6x\|KL=3\.07\|11680" docs/arxiv-paper/main.tex 2>&1
    - ls results/experiment_1068*.json results/experiment_1094*.json results/experiment_1147*.json 2>&1
    - python3 -c "import json; d=json.load(open('results/experiment_1068_ising_sampler_v3_fpga.json')); print({k:v for k,v in d.items() if 'latency' in k.lower() or 'throughput' in k.lower() or 'time' in k.lower()})" 2>&1
    - [Apply all 5 fixes to main.tex and figure scripts]
    - python3 scripts/figure_integrity_audit.py 2>&1 | tail -20
    - Write results/experiment_1180_paper_v5_critical_issues_1_5.json

    REQUIRED ARTIFACT FIELDS:
    - issue_1_fig3_fixed: bool (fig3 uses artifact-traced ratio or was dropped)
    - issue_1_honest_speedup: float (or null if fig3 dropped)
    - issue_2_kl_claims_remaining: int (must be 0)
    - issue_3_15p6x_removed: bool
    - issue_4_hardnet_removed: bool (no "76,130" or "76130" in tex)
    - issue_5_ood_narrative_added: bool
    - figure_integrity_script_active: bool
    - figure_integrity_untraced_constants: int (should be 0 after fixes)
    - critical_issues_fixed: int (must be 5 to unblock exp1183)
    - 4_test_passes_critical: bool
    - honest_verdict: "all_5_critical_resolved" | "partial_fix" | "blocked"

    Run: python3 scripts/experiment_1180_paper_v5_critical_issues_1_5.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1181-paper-v5-high-issues-6-10
  milestone: 2026.04.92
