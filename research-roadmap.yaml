    2. Load exp1312 and exp1313 and abort to a terminal blocker if their gates are not satisfied.
    3. Define a small acceptance policy over certificate prefixes, validator confidence, unknown states, and MUS repair availability.
    4. Replay the policy over the parsed certificate corpus. Only run fresh local SOTA generation if replay is insufficient and MODEL_SPECS are available.
    5. Measure low_risk_acceptance_rate, false_acceptance_rate, full_verifier_call_reduction, safe_prefix_repair_delta, and risk_bound_proxy.
    6. Write headline_result_allowed=true only if the inputs are fresh mandated SOTA outputs or the artifact clearly inherits headline eligibility from exp1312.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1314_beaver_lite_cactus_safe_prefix_acceptance.json')); print(d.get('low_risk_acceptance_rate'), d.get('false_acceptance_rate'), d.get('headline_result_allowed'), d.get('honest_verdict'))"
