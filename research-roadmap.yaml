    title: "OFF-ARC TRANSFER POWER on an UN-SATURATED corpus -- BUILD+LAUNCH (operator TOP PRIORITY; G1; split-long-codex BUILD half; resume-not-restart): .374 completed only 22/160 tasks AND they were ceiling-saturated (all arms+oracle=1.0 on base HumanEval/MBPP -- no headroom). FIX BOTH: (1) EVALUATE arms against EvalPlus HumanEval+/MBPP+ HIDDEN tests (the demo-fit verifier still SELECTS on VISIBLE example tests -- the visible-under-determines-hidden gap is exactly GAP-CODE-EXEC-DEMOFIT, and EvalPlus's 80x hidden tests maximize it); (2) RESUME the candidate-generation checkpoint into a STABLE (corpus+model+k-keyed) path that ACCUMULATES across milestone windows toward N>=160. Same gemma-4-12B inducer, k>=8. Arms: Arm A vote, Arm A++ ACES leave-one-out (arXiv:2604.03922), Arm B demo-fit (the SHARED ARC primitive -- headline), Arm C symbolic-equivalence partition (arXiv:2604.06485). SMOKE must VERIFY oracle headroom EXISTS (oracle < 1.0 on EvalPlus eval) before launching -- the check that would have caught the .374 saturation. setsid-detach the run so it survives the iteration boundary; checkpoint per task; ~75-min window -> report partial via the stable checkpoint."
