    \     benchmark(responses: list[str], ground_truth: list[bool]) -> dict:\n\
    \       skip_rate (fraction flagged incorrect → Ising skipped)\n\
    \       tp_rate (fraction of wrong responses correctly flagged as incorrect)\n\
    \       fp_rate (fraction of correct responses wrongly flagged as incorrect)\n\
    \   - Test: verdict='incorrect' → should_run_ising=False (fast-path skip)\n\
    \   - Test: verdict='correct' → should_run_ising=True\n\
    \   - Test: CI stub returns uncertain without GPU\n\
    4. Implement python/carnot/pipeline/think_probe.py.\n\
    \   Export CarnotThinkProbe, ThinkProbeResult, ThinkVerdict from carnot.pipeline.__init__.\n\
    \   Verbose docstrings: WHY CoT verification is more sample-efficient than discriminative\n\
    \   (ThinkPRM result), WHY 3 steps (fast enough for pre-filter), hardware path (Qwen3.5-0.8B\n\
    \   on GPU/NPU; CI stub on CPU), Phase 3 path (ThinkProbe becomes the non-autoregressive\n\
    \   verifier in Phase 3, running at energy minimum not by token prediction).\n\
    5. ADDITIVE: Add CarnotThinkProbe as optional pre-filter in VerifyRepairPipeline:\n\
    \   If think_probe param is set AND response is flagged 'incorrect': skip Ising, return violation.\n\
    6. Write scripts/experiment_444_think_probe.py:\n\
