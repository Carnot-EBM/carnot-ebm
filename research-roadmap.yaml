       a. STYLISTIC: correct answer with added padding, extra steps, verbose formatting
          (e.g., "Let me think step by step... [5 extra filler sentences]... The answer is 42.")
       b. LENGTH-BIASED: incorrect answer written with extra length and confident tone
          (e.g., "After careful analysis of all factors... The answer is 43.")
