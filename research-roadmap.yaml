      is_level_complete is SATISFIABLE on a reachable grid AND plan_reaches_goal. WIN: goal_predicate_satisfiable
      =True AND lp85 reaches L2 offline-reproduced. SANCTIONED FALLBACK if it still nulls: the MULTI-EXEMPLAR
      variant (bank >=2 L1-completion exemplars), NOT the retired CNN driver. verifier_is_oracle:false.
      live_agent_self_discovery. retire_if_same_verdict.'
