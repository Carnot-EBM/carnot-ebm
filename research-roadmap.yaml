           accuracy_delta (EBT - AR), the FLOP budgets for both, and whether they matched within tolerance.
        5. Report HONESTLY -- a negative delta (AR >= EBT at equal compute) is a valid, valuable finding
           (it bounds the route). Do NOT manufacture an EBT win; do NOT give the EBT a FLOP advantage.
      INFERENCE-SUBSTRATE HYGIENE: live GPU; full methodology (random_seed, reproducibility_checksum,
      model_specs naming BOTH from-scratch configs + the energy-descent vs best-of-N inference protocols,
      n_heldout). Run `python scripts/adversarial_verify.py <artifact>`; confirm no critical flag (n>=100
      sample size + matched-FLOP accounting should clear the rigor checks).
