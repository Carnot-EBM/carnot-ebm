  prompt: "CONTEXT: KV260 has been in 'operator-action-required' state since exp2551. exp2560 produced a 10-step operator flash procedure with confirmed-reachable PYNQ URL. This task checks if the operator has since inserted an SD card and executes the flash if possible, or records the current device state and updates the prep script.\n\nKEY STATE FROM exp2560:\n  - 10-step operator procedure documented\n  - PYNQ image URL reachability determined (may be True or False from exp2560)\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/results/experiment_2560_kv260_operator_docs.json (URL reachability + operator commands)\n  {project_root}/results/experiment_2578_kv260_continuity.json (check if already exists)\n  {project_root}/ops/hardware-bringup-prep.md (board state overview)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Check for inserted SD card:\n        lsblk | grep -E 'sd[b-z]|mmcblk' | head -5\n        ls /dev/sdb /dev/sda /dev/mmcblk0 2>/dev/null\n        Set sd_card_inserted=(any mass storage device besides /dev/sda boot disk detected).\n     b. Read exp2560 PYNQ URL status:\n        python3 -c \"import json; d=json.load(open('results/experiment_2560_kv260_operator_docs.json')); print('url_reachable:', d.get('kv260_pynq_url_reachable'), 'confirmed_url:', d.get('kv260_confirmed_reachable_url'))\"\n        Set pynq_url_reachable, confirmed_pynq_url.\n  1. If sd_card_inserted=True:\n     BRANCH A: Execute flash sequence.\n     a. Confirm PYNQ image URL is reachable:\n        wget -q --timeout=30 --spider {{confirmed_pynq_url}} && echo 'reachable' || echo 'unreachable'\n     b. If reachable: download and flash:\n        wget -q --timeout=300 -O /tmp/kv260_pynq.img.zip {{confirmed_pynq_url}}\n        unzip /tmp/kv260_pynq.img.zip -d /tmp/\n        Set image_file=(ls /tmp/*.img | head -1)\n        sudo dd if={{image_file}} of=/dev/sdb bs=4M status=progress conv=fsync\n        sync\n        Set kv260_sd_flashed=(dd exit_code == 0).\n     c. If flashed: eject card, instruct operator to insert into KV260 and power on.\n        Set kv260_status='sd_flashed_awaiting_board_boot'.\n     d. Write artifact with flash status.\n  2. If sd_card_inserted=False:\n     BRANCH B: Update prep script.\n     a. Write or update scripts/kv260_flash_prep.sh with the current confirmed URL.\n     b. Make it executable.\n     c. Set kv260_status='sd_absent_prep_script_updated', kv260_sd_flashed=False.\n  3. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - sd_card_inserted:\n      principle: \"True if an SD card was detected in a slot. Determines which branch executed.\"\n  - kv260_sd_flashed:\n      principle: \"True if PYNQ image was dd'd to SD card. False if SD absent or download failed.\"\n  - kv260_status:\n      principle: \"Summary status: 'sd_flashed_awaiting_board_boot' OR 'sd_absent_prep_script_updated'.\"\n  - kv260_confirmed_reachable_url:\n      principle: \"URL that was actually reachable for download (from exp2560 or re-verified here).\"\n  - kv260_prep_script_updated:\n      principle: \"True if scripts/kv260_flash_prep.sh was written with current URL.\"\n  - preconditions_checked:\n      principle: \"Records which devices and URLs were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"kv260_sd_flashed == true OR kv260_prep_script_updated == true\"\n    principle: \"Hardware continuity discipline: either flash progress OR updated prep script for operator. KV260 task must produce actionable progress.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

