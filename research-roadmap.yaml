- id: exp1047-sos-kan-reparameterization
  milestone: 2026.04.81
  deliverable: results/experiment_1047_sos_kan_v1.json
  title: "SOS-Integrated KAN Reparameterization — Exp 980 Re-Scope (Type-Level Invariants)"
  prior_failures:
    - experiment_id: exp980-kan-milp-repair
      verdict: milp_repair_wrong_framing
      addressed_by: "Per ops/known-issues.md EXP-980-RE-SCOPING: MILP repair of KAEMEnergy monotonicity violations is the wrong approach. The correct fix is SOS-on-derivative reparameterization: parameterize ψ'(x) as Sum-of-Squares of B-splines (V unconstrained), then integrate analytically to ψ(x) = c^2 + Σ(V V^T)_{ij} Φ_{ij}(x). Monotonicity and non-negativity become type-level invariants, not numerical properties to verify. MILP verification reduces to type-checking."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    KAEMEnergy currently has monotonicity and non-negativity violations that Exp 992 (KAN MILP v2)
    fixed to 0 violations via post-hoc repair. However the fix is the WRONG framing per
    ops/known-issues.md EXP-980-RE-SCOPING. The SOS-Integrated KAN approach makes these
    properties TYPE-LEVEL INVARIANTS: it's structurally impossible to violate them.

    Mathematical recipe (from memory/project_sos_integrated_kan.md):
    1. Parameterize the derivative as SOS: ψ'(x) = Σ_{i,j} (V·V^T)_{ij} B_i(x) B_j(x)
       where V ∈ R^{N×M} is unconstrained (M >= 2 for Burer-Monteiro stability).
    2. Integrate analytically: ψ(x) = c² + Σ_{i,j} (V·V^T)_{ij} Φ_{ij}(x)
       where Φ_{ij}(x) = ∫ B_i(t) B_j(t) dt (precomputed basis integrals).
    3. Gradient w.r.t. V (unconstrained): standard autodiff, no projection needed.

    This is COMPATIBLE with existing KAEMEnergy at p=1 (hat functions → C1 piecewise cubic).
    Drop-in replacement: same interface, same computational profile.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/kaem_energy.py (KAEMEnergy — SOSKANEnergy will extend this)
    - python/carnot/models/gskan.py (GS-KAN — understand shared-basis structure for reference)
    - data/fover_corpus_expanded.json or data/fover_corpus_v3.json (training corpus)
    - python/carnot/eval/metrics.py (use canonical AUROC computation)
    - openspec/capabilities/*/spec.md — find the spec entry for KAEMEnergy

    TASK:
    1. IMPLEMENT python/carnot/models/sos_kan.py:
       class SOSKANEnergy:
         - init: n_splines (N), n_sos_basis (M >= 2), n_features
         - forward: compute ψ(x) using SOS integral formula
         - _compute_basis_integrals(): precompute Φ_{ij}(x) on grid (can cache)
         - _compute_sos_weights(): (V V^T) matrix from unconstrained V
         - fit(X, y, n_epochs=100, lr=0.01): standard Adam training, no constraints needed
         - auroc(X_test, y_test): use carnot.eval.metrics AUROC
       The fit() method should use JAX jit for speed.
    2. TRAIN on FoVer corpus (57-pair minimum; use expanded v3 if available):
       Train SOSKANEnergy vs KAEMEnergy baseline. Measure:
       - auroc_sos_kan vs auroc_kaem_baseline
       - n_monotonicity_violations: count violations of ψ'(x) >= 0 on test grid
         (should be ZERO by construction)
       - training_wall_time_s: compare to KAEMEnergy
    3. VERIFY TYPE-LEVEL INVARIANTS:
       - Sample 1000 random x values in training domain
       - Compute ψ(x) at each
       - Verify: (a) ψ(x) >= 0 for all x (non-negativity) — should be guaranteed by c^2 term
                (b) ψ(x+ε) - ψ(x) >= 0 for positive ε (monotonicity) — guaranteed by SOS construction
       - Report: n_invariant_violations (should be 0), invariants_hold: bool
    4. FPGA RESOURCE ESTIMATE:
       Count SOS-basis multiplications vs standard B-spline multiplications.
       The SOS approach uses matrix multiply (V V^T) which maps to DSP48 cascades efficiently.
       Estimate: LUT savings vs standard KAEMEnergy (SOS reuses diagonal basis elements).
    5. SPEC UPDATE: Add REQ-MODEL-SOS-001 to the appropriate spec file:
       "SOSKANEnergy MUST guarantee ψ'(x) >= 0 (monotonicity) as a type-level property."
    6. TESTS: Write tests/python/test_sos_kan.py with at least 5 tests:
       - SOSKANEnergy instantiates without error
       - forward() produces non-negative outputs
       - zero monotonicity violations on random test grid
       - AUROC >= 0.5 on toy binary classification
       - fit() converges (loss decreases over 10 epochs)

    CONCRETE STEPS:
    - JAX_PLATFORMS=cpu python scripts/experiment_1047_sos_kan_v1.py

    ARTIFACT FIELDS:
    - auroc_sos_kan: float
    - auroc_kaem_baseline: float
    - auroc_no_regression: bool (auroc_sos_kan >= auroc_kaem - 0.02)
    - n_monotonicity_violations: int (should be 0)
    - invariants_hold: bool
    - n_pairs_used: int
    - tests_passing: int
    - honest_verdict: "sos_kan_invariants_confirmed" | "sos_kan_auroc_regression" | "invariant_violated" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1047_sos_kan_v1.py
