    TASK:
    Compare four equal-capacity arms: frozen memory, residual-pressure route learning, raw
    violation accumulation, and random valid updates. The active episode is read-only. Propose and
    commit external memory changes only between episodes after exact local receipts. Store canonical
    parent and new bytes for every commit. Roll back support, retention, or hard-case harm.

    CONCRETE STEPS:
    0. PRECONDITIONS: require verified_memory_stream_ready=true, complete orders and splits,
       headroom, alternatives, admitted and rejected operations, later reads, serializer, and
       sufficient disk/RAM. On failure write complete_blocked_residual_pressure_route_learning_ab
