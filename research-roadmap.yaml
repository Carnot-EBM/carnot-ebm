  - id: exp3956-goal-predicate-induction
    operator_override: >
      2026-06-09 operator directive (standing ARC north-star push): OWED .365 task (exp3948) that the
      conductor never ran — false-positive scope-match vs the never-executed exp3948. Owed-not-failed
      re-attempt of goal-predicate induction; no prior verdict exists to address.
    milestone: "2026.06.366"
    title: "OWED from .365: induce a GOAL-PREDICATE from observed level-up transitions. The M2-v5 finding is that a trustworthy transition-model is necessary but NOT sufficient — you also need to RECOGNIZE the WIN state. Collect level-up transitions (via active/goal-directed play on the non-spatial games), characterize the grid-state property that holds at a win (e.g. all pieces on targets / a matched pattern), and emit a reusable goal_predicate(grid)->bool. Measure: on a held-out set, does the induced predicate correctly flag win-vs-non-win states (precision/recall)? Require >=2 level-up examples before committing a predicate (single-example goal mis-induction is the named M1/M2 risk)."
    priority: high
    track: research
    max_turns: 60
    agent_type: claude
    model: opus
    requires_claude: true
    inference_substrate: offline_arc_agi3_world_model_consistency_energy
    deliverable: results/experiment_3956_goal_predicate_induction.json
    prompt: |
      CONTEXT. M2-v5 (results/arc3_m2_solve.json) showed converting a world-model into a SOLVE requires
      grounding the GOAL — a trustworthy transition-model predicts the next frame but does not know which
      frame is a WIN. The .365 task (exp3948) that was to induce a goal-predicate NEVER RAN. This is the
      owed re-attempt. The r11l first solve (exp3946) implicitly used 'all pieces on targets' as the goal;
      generalize that into an explicitly-induced, held-out-validated predicate.

      EXISTING CODE TO READ:
        - python/carnot/agentic/arc_agi3_world_model.py (GameGraph, perception primitives, compute_grid_delta)
        - scripts/experiments/arc3_goal_prior_explore.py (goal-directed play that previously reached level-ups — a source of win transitions)
        - results/experiment_3946_r11l_first_solve.json (the implicit r11l goal = pieces-on-targets coincidence)
        - results/arc3_win_condition_survey.json (per-game win summaries — the ground-truth goal shapes)

      CONCRETE STEPS:
        0. PRECONDITIONS: offline env loads (the exp3946 Arcade OFFLINE check). Else honest_verdict
           blocked_arc_offline_env_unavailable, EXIT.
        1. For 1-3 non-spatial games where level-ups are reachable, collect transitions where
           levels_completed increments; capture the grid-state at the win AND non-win states for contrast.
        2. Induce a goal_predicate(grid) -> bool that characterizes the win-state property (object/target
           coincidence, pattern match, etc.). Keep it grid-grounded (no oracle / no source-hardcoding).
           Require >=2 level-up examples before committing (single-example goal mis-induction is the risk).
        3. EVALUATE on held-out states: precision/recall of goal_predicate at flagging win-vs-non-win.

      REQUIRED ARTIFACT FIELDS (BARE scalars; principle: lines guide YOU):
        goal_predicate_precision: principle "Of states the predicate flags as WIN, the fraction that truly are — high precision means it won't plan toward a false goal."
        goal_predicate_recall: principle "Of true WIN states, the fraction the predicate flags — high recall means it recognizes the goal when reached (the plan-ability gate)."
        n_level_ups_observed: principle "How many real wins the induction trained on — <2 = an under-determined predicate (FALSE_NEGATIVE_RISK); >=2 required to commit."
        games_covered: principle "Which games the predicate was induced/validated on — coverage, not a single-game artifact."
        random_seed, honest_verdict, duration_s, inference_substrate: principle "Reproducibility + terminal-prefix verdict + substrate."

      honest_verdict MUST start with `complete:`/`success:` or `blocked_<resource>`.
      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_3956_goal_predicate_induction.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

