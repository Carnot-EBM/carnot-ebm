- id: exp918-lagrange-forgetting-multi-constraint
  milestone: 2026.04.71
  deliverable: results/experiment_918_lagrange_forgetting_multi_constraint.json
  max_turns: 30
  prior_failures:
    - experiment_id: exp909-lagrange-forgetting-curve
      verdict: no_improvement
      addressed_by: >
        Exp 909 used a single-constraint corpus where entropy = 0 regardless of decay
        (p = 1.0 always, so -p*log(p) = 0). The LagrangeMultiplierUpdater.weight_entropy
        property is correct but non-informative with only one constraint type. Exp 918 uses
        an 8-constraint heterogeneous corpus (arithmetic_carry, sign_check, unit_consistency,
        comparison_direction, equality_check, range_check, step_coherence, modular_arithmetic)
        with different per-constraint violation rates. With heterogeneous violation rates,
        weights are non-uniform and entropy is meaningful, making decay measurable.
      retire_if_same_verdict: false
  title: 'Exp 918: Lagrange Forgetting Multi-Constraint — RETRO-LAGRANGE-ENTROPY-DEGENERATE Fix (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-LAGRANGE-ENTROPY-DEGENERATE: Exp 909 (Lagrange forgetting curve) produced
    no_improvement because its single-constraint corpus has entropy = 0 by construction
    (p = 1.0 always → -p*log(p) = 0). Root cause: degenerate test design, not algorithm failure.
    Fix: use an 8-constraint heterogeneous corpus where different constraint types have different
    violation rates, making weights non-uniform and entropy non-degenerate.

    IMPORTANT: retire_if_same_verdict=false. Root cause is identified (corpus degenerate) and
    the fix directly addresses it (heterogeneous corpus). This is per no-doomed-rerun rule #3
    (naming the root cause and what is different).

    EXISTING CODE TO READ FIRST:
    - results/experiment_909_lagrange_forgetting_curve.json — prior failure: no_improvement
    - python/carnot/pipeline/lagrange_updater.py — LagrangeMultiplierUpdater (Exp 909 extension)
    - openspec/capabilities/self_learning/spec.md — FR-11 requirements, REQ-SELF-007
    - openspec/change-proposals/research-roadmap-v71.md — .71 Phase 1 design

    TASK: Re-run Lagrange forgetting with 8-constraint heterogeneous corpus.
    Confirm entropy is non-degenerate. Measure signed_entropy_improvement with decay=0.95.
    Target: signed_entropy_improvement > 0.5.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_909_lagrange_forgetting_curve.json. Extract:
       - signed_entropy_improvement: (expect 0 — degenerate corpus)
       - n_constraints: (expect 1 — the root cause)
    3. Read python/carnot/pipeline/lagrange_updater.py. Confirm weight_entropy property exists
       from Exp 909. If not, verify it was implemented correctly.
    4. Create scripts/experiment_918_lagrange_forgetting_multi_constraint.py:
       a. tmpl = ExperimentTemplate(918, "Lagrange Forgetting Multi-Constraint Rerun",
                                     "results/experiment_918_lagrange_forgetting_multi_constraint.json",
                                     requires_gpu=False)
       b. tmpl.setup()
       c. Define 8 constraint types with different violation probabilities:
          constraints = (
            "arithmetic_carry":     {"high_viol_prob": 0.80, "low_viol_prob": 0.05),
            "sign_check":           ("high_viol_prob": 0.70, "low_viol_prob": 0.10),
            "unit_consistency":     ("high_viol_prob": 0.60, "low_viol_prob": 0.15),
            "comparison_direction": ("high_viol_prob": 0.50, "low_viol_prob": 0.20),
            "equality_check":       ("high_viol_prob": 0.40, "low_viol_prob": 0.25),
            "range_check":          ("high_viol_prob": 0.30, "low_viol_prob": 0.30),
            "step_coherence":       ("high_viol_prob": 0.20, "low_viol_prob": 0.50),
            "modular_arithmetic":   ("high_viol_prob": 0.10, "low_viol_prob": 0.70),
          }
       d. 200-step simulation (not 100 — longer for clearer signal):
          Steps 1-100: each constraint fires at high_viol_prob.
          Steps 101-200: each constraint fires at low_viol_prob.
       e. Run two LagrangeMultiplierUpdaters with n_constraints=8:
          - baseline: no decay (decay_rate=1.0)
          - decay: decay_rate=0.95
       f. Record at each 20-step interval: weight_entropy (baseline), weight_entropy (decay),
          max_weight, mean_weight for each.
       g. Verify corpus is non-degenerate: assert entropy_at_step_1_baseline > 0.1
          (should be ~log(8) = 2.08 if weights start equal)
       h. Compute: entropy_with_decay_at_200, entropy_without_decay_at_200
          signed_entropy_improvement = entropy_with_decay_at_200 - entropy_without_decay_at_200
       i. honest_verdict:
          "forgetting_curve_improves_entropy" if signed_entropy_improvement > 0.5
          "marginal_improvement" if signed_entropy_improvement > 0.0
          "degenerate_again_retire" if entropy_at_step_1_baseline < 0.1 (corpus still degenerate)
          "no_improvement" otherwise
    5. Write tests with 100% coverage. Test:
       - 8-constraint entropy is non-degenerate at step 1 (> 0.1)
       - decay produces different weights than baseline at step 100
       - weight_entropy decreases more slowly with decay than without
       Traces to REQ-SELF-007, SCENARIO-SELF-007.
    6. If honest_verdict in ("forgetting_curve_improves_entropy", "marginal_improvement"):
       Mark RETRO-LAGRANGE-ENTROPY-DEGENERATE as CLOSED in MILESTONE_PREREQS.md.
       Append to ops/changelog.md: "RETRO-LAGRANGE-ENTROPY-DEGENERATE CLOSED by Exp 918."
    7. Write results/experiment_918_lagrange_forgetting_multi_constraint.json.
    8. Update ops/changelog.md: one-line entry.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_918_lagrange_forgetting_multi_constraint.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp919-math-iterative-self-repair
  milestone: 2026.04.71
  deliverable: results/experiment_919_math_iterative_self_repair.json
  max_turns: 50
  title: 'Exp 919: MathIterativeSelfRepair — Execute-Feedback on 25 GSM8K Questions (GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 905 proved IterativeSelfRepair works for code (+72pp on HumanEval) by using
    Python execution errors as the repair signal. The identical approach applies to arithmetic:
    (1) parse the LLM's chain-of-thought into arithmetic steps, (2) execute each step with
    Python eval(), (3) compare eval() result to the LLM's stated intermediate value, (4) if
    they diverge, feed the discrepancy back to the LLM as a correction prompt, (5) retry up
    to 3x, (6) Carnot Ising energy selects the best attempt.

    This does NOT use ArithmeticExtractor or regex-based constraint extraction — it avoids
    the broken extraction pipeline entirely, using Python eval() as the oracle instead.

    EXISTING CODE TO READ FIRST:
    - results/experiment_905_iterative_self_repair_v1.json — code repair success: +72pp
    - python/carnot/pipeline/iterative_self_repair.py — IterativeSelfRepair (code version)
    - python/carnot/verify/arithmetic_extractor.py — DO NOT USE (broken regex extractor)
    - python/carnot/samplers/ising_sampler.py — Ising energy scorer
    - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner
    - openspec/change-proposals/research-roadmap-v71.md — .71 Phase 2 design

    TASK: Implement MathIterativeSelfRepair. Run on 25 GSM8K questions. Use
    unsloth/Qwen3.6-35B-A3B-GGUF (llama.cpp, GPU). Measure signed_improvement vs
    baseline (first-attempt accuracy).

    MODEL_SPECS = [
      ("name": "Qwen3.6-35B-A3B-GGUF", "hf_id": "unsloth/Qwen3.6-35B-A3B-GGUF", "gpu": 0)
    ]

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Create python/carnot/pipeline/math_iterative_repair.py:
       @dataclass
       class MathStep:
           step_text: str          # raw text of the step
           python_expr: str | None # python expression extracted (e.g. "47 + 28")
           stated_value: float | None  # what the LLM said the result is
           eval_value: float | None    # what Python eval() says

       class MathIterativeSelfRepair:
         __init__(self, llm_runner, energy_scorer, max_retries: int = 3):
           self.llm = llm_runner
           self.energy = energy_scorer
           self.max_retries = max_retries

         extract_math_steps(self, response: str) -> list[MathStep]:
           Parse: look for lines containing "=" with numeric LHS/RHS.
           For each line: extract (python_expr, stated_value) using regex.
           Return list of MathStep objects. Empty list if no steps found (do not fail).

         detect_arithmetic_error(self, step: MathStep) -> bool:
           If step.python_expr is None: return False (cannot verify)
           Try: eval_val = eval(step.python_expr)  # restricted eval (numbers + operators)
           If abs(eval_val - step.stated_value) > 0.01: return True (error found)
           Return False

         build_correction_prompt(self, question: str, response: str,
                                  error_steps: list[MathStep]) -> str:
           Format: "The following reasoning has arithmetic errors:\n(response)\n\n"
                   "Detected errors:\n"
                   For each error: "  Step '(step.step_text)': (step.python_expr) = "
                                   "(step.eval_value:.2f), but you wrote (step.stated_value)\n"
                   "Please correct the calculation and provide the right final answer."

         repair(self, question: str, correct_answer: float,
                test_cases: list = None) -> MathRepairResult:
           attempts = []
           response = self.llm.generate(question)
           for i in range(self.max_retries + 1):
             steps = self.extract_math_steps(response)
             error_steps = [s for s in steps if self.detect_arithmetic_error(s)]
             score = self.energy.score(response)
             final_num = self._extract_final_number(response)
             correct = (final_num is not None and
                        abs(final_num - correct_answer) < 0.01)
             attempts.append((
               "attempt": i,
               "response": response,
               "n_errors_found": len(error_steps),
               "correct": correct,
               "energy_score": score
             ))
             if correct or not error_steps:
               break
             if i < self.max_retries:
               correction_prompt = self.build_correction_prompt(
                 question, response, error_steps)
               response = self.llm.generate(correction_prompt)
           best = min(attempts, key=lambda a: a["energy_score"])
           return MathRepairResult(
             best_attempt=best,
             all_attempts=attempts,
             n_retries=len(attempts) - 1,
             final_correct=best["correct"]
           )

         _extract_final_number(self, response: str) -> float | None:
           # Extract the last number from response (common GSM8K answer format)
           nums = re.findall(r'[-+]?\d+\.?\d*', response)
           if nums:
             try: return float(nums[-1])
             except: return None
           return None

    3. Add spec entries: REQ-CODE-011 (MathIterativeSelfRepair pipeline),
       SCENARIO-CODE-011 (math repair retries with arithmetic feedback until correct or budget).
    4. Create scripts/experiment_919_math_iterative_self_repair.py:
       a. tmpl = ExperimentTemplate(919, "MathIterativeSelfRepair — 25 GSM8K GPU",
                                     "results/experiment_919_math_iterative_self_repair.json",
                                     requires_gpu=True)
       b. tmpl.setup()
       c. gpu_status = tmpl.setup_gpu(MODEL_SPECS). If not all_healthy: write blocked artifact.
       d. Load 25 GSM8K questions with known correct answers from datasets or construct
          representative problems covering: multi-step arithmetic, percentages, rate problems.
          Use the datasets library or hardcode 25 problems with verified answers.
       e. Baseline: first-attempt accuracy (no repair, just check if answer correct).
       f. Repair: run MathIterativeSelfRepair(max_retries=3) on all 25 questions.
       g. Compute:
          - baseline_accuracy: fraction correct on first attempt
          - repair_accuracy: fraction correct after iterative repair
          - signed_improvement: repair_accuracy - baseline_accuracy
          - mean_retries_needed: mean retries for repaired-correct questions
          - energy_selected_correctly: fraction where energy score ranked the correct
            attempt best (lowest energy = correct answer)
          - error_detection_rate: fraction of wrong first attempts where >= 1 arithmetic
            error was detected (eval() disagreement found)
       h. honest_verdict logic:
          if signed_improvement > 0.05: "math_repair_significant_gate_open"
          elif signed_improvement > 0.0: "math_repair_marginal_gate_open"
          else: "math_repair_no_improvement"
    5. Write tests with 100% coverage. Test MathIterativeSelfRepair:
       - extract_math_steps parses "47 + 28 = 76" correctly (step_text, python_expr="47 + 28",
         stated_value=76.0)
       - detect_arithmetic_error returns True for "47 + 28 = 76" (eval gives 75)
       - detect_arithmetic_error returns False for "47 + 28 = 75" (correct)
       - build_correction_prompt includes the error in prompt text
       - repair returns best_attempt with lowest energy score
       - _extract_final_number handles edge cases (negative, decimal, no number)
       Traces to REQ-CODE-011, SCENARIO-CODE-011.
    6. Write results/experiment_919_math_iterative_self_repair.json.
    7. Update ops/changelog.md: one-line entry.
    8. tmpl.assert_deliverable_written() as final line.

    Run: CARNOT_USE_SANDBOX=0 .venv/bin/python scripts/experiment_919_math_iterative_self_repair.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp920-combined-estimation-math-repair
  milestone: 2026.04.71
  deliverable: results/experiment_920_combined_estimation_math_repair.json
  max_turns: 40
  gated_on:
    - upstream: exp919-math-iterative-self-repair
      artifact_field: signed_improvement
      op: '>'
      value: 0.0
  title: 'Exp 920: Combined EstimationVerifier + MathIterativeSelfRepair Pipeline (CPU, GATED on Exp 919)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 919 confirmed MathIterativeSelfRepair works (signed_improvement > 0).
    Exp 908 confirmed EstimationVerifier works (SVAMP AUC improved +0.775). This experiment
    combines them: EstimationVerifier gates whether to attempt repair (high violation_prob
    → trigger repair), MathIterativeSelfRepair corrects when triggered. The hypothesis:
    selective repair (only on high-confidence violations) has better precision than always
    repairing.

    GATE CHECK (run first): Read results/experiment_919_math_iterative_self_repair.json.
    If signed_improvement <= 0: write results/experiment_920_combined_estimation_math_repair.json
    with honest_verdict="skipped_gate_blocked_exp919_no_improvement" and exit immediately.

    EXISTING CODE TO READ FIRST:
    - results/experiment_919_math_iterative_self_repair.json — gate result, signed_improvement
    - results/experiment_908_estimation_verifier.json — EstimationVerifier AUC, svamp_auc
    - python/carnot/verify/estimation_verifier.py — EstimationVerifier (Exp 908)
    - python/carnot/pipeline/math_iterative_repair.py — MathIterativeSelfRepair (Exp 919)
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Implement combined pipeline. Run on 25 GSM8K + 20 SVAMP questions.
    Measure combined_auc vs each component alone. Use Qwen3.5-0.8B (CPU) for fast iteration.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. GATE CHECK: read results/experiment_919_math_iterative_self_repair.json.
       If signed_improvement <= 0: write skip artifact and exit.
    3. Create python/carnot/pipeline/combined_math_verifier.py:
       class CombinedMathVerifier:
         __init__(self, estimation_verifier, math_repair,
                  repair_threshold: float = 0.5):
           self.estimator = estimation_verifier
           self.repair = math_repair
           self.threshold = repair_threshold  # trigger repair if viol_prob > threshold
         verify_and_repair(self, question: str, response: str,
                            correct_answer: float) -> CombinedVerifyResult:
           est_result = self.estimator.verify(question, response)
           triggered_repair = est_result.violation_prob > self.threshold
           if triggered_repair:
             repair_result = self.repair.repair(question, correct_answer)
             final_response = repair_result.best_attempt["response"]
             final_correct = repair_result.final_correct
           else:
             final_response = response
             final_correct = (
               self.repair._extract_final_number(response) is not None and
               abs(self.repair._extract_final_number(response) - correct_answer) < 0.01
             )
           return CombinedVerifyResult(
             estimation_violation_prob=est_result.violation_prob,
             triggered_repair=triggered_repair,
             final_correct=final_correct,
             repair_attempts=repair_result.all_attempts if triggered_repair else []
           )
    4. Add spec entries: REQ-CODE-012 (CombinedMathVerifier selective repair),
       SCENARIO-CODE-012 (EstimationVerifier gates repair, reduces wasted repair calls).
    5. Create scripts/experiment_920_combined_estimation_math_repair.py:
       a. tmpl = ExperimentTemplate(920, ..., requires_gpu=False). tmpl.setup().
       b. Load 25 GSM8K + 20 SVAMP questions with correct answers.
       c. Use Qwen3.5-0.8B (llama.cpp, CPU) for generation (fast for combined pipeline).
          MODEL_SPECS = [("name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0)]
          (CPU fallback acceptable for this experiment)
       d. Baseline: no repair (raw LLM accuracy on both datasets).
       e. Repair-all: MathIterativeSelfRepair on all questions (upper bound).
       f. Combined: CombinedMathVerifier (selective repair via EstimationVerifier).
       g. Compute per dataset and combined:
          - baseline_accuracy, repair_all_accuracy, combined_accuracy
          - repair_rate: fraction questions where repair was triggered (lower = more efficient)
          - correct_repair_rate: among triggered repairs, fraction that improved
          - wasted_repair_rate: among triggered repairs, fraction that made no difference
          - combined_auc: AUC using EstimationVerifier.violation_prob as discriminator
       h. honest_verdict:
          if combined_accuracy >= repair_all_accuracy: "combined_dominant_efficient_repair"
          elif combined_accuracy > baseline_accuracy: "combined_viable_improvement"
          else: "combined_no_improvement"
    6. Write tests with 100% coverage. Traces to REQ-CODE-012.
    7. Write results/experiment_920_combined_estimation_math_repair.json.
    8. Update ops/changelog.md: one-line entry.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_920_combined_estimation_math_repair.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp921-dualgpu-throughput-benchmark
  milestone: 2026.04.71
  deliverable: results/experiment_921_dualgpu_throughput_benchmark.json
  max_turns: 30
  gated_on:
    - upstream: exp913-dualgpu-production-wiring
      artifact_field: honest_verdict
      op: contains
      value: "dualgpu_wired"
  title: 'Exp 921: DualGPU Throughput Benchmark — Confirm 1.7x Speedup Quantitatively (GPU, GATED on Exp 913)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 913 wired DualGPURunner to ThreeTierPipeline (verdict: dualgpu_wired_partial_speedup)
