  - id: exp354-apple-adversarial-gsm8k-harness
    milestone: "2026.05.20"
    deliverable: scripts/experiment_354_adversarial_gsm8k_harness.py
    title: "Exp 354: Apple adversarial GSM8K harness — dataset + evaluation script (no GPU)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: The Apple adversarial GSM8K variant (arXiv 2410.05229) is labeled "Carnot's
      most compelling result" in research-references.md. Apple researchers showed that adding
      one irrelevant sentence to identical math problems causes models to drop up to 65%
      accuracy (o1-preview: 92.7% → 77.4%). Carnot's arithmetic verifier extracts equations
      via structural parsing — it should be immune to irrelevant-sentence noise because
      the Ising energy doesn't care about context words.

      This experiment ONLY implements the harness (dataset + evaluation script + tests).
      Execution on live GPU is a SEPARATE experiment (Exp 355). This is the script-generation
      phase per research-program.md "Large Benchmark Experiments" rule.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/extract.py — ArithmeticExtractor
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
      - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner
      - scripts/experiment_340_live_precision_benchmark.py — benchmark script pattern
      - scripts/experiment_341_live_humaneval.py — benchmark script pattern

      TASK: Implement the Apple adversarial GSM8K test harness.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-BENCH-006 (adversarial GSM8K benchmark), REQ-BENCH-007 (irrelevant-sentence
