    production VerifyRepairPipeline for 9 consecutive milestones (cumulative 540 min foregone
    savings). Exp 956 in .74 was blocked by missing prior_failures. This is the 10th attempt
    to wire DualGPU into production, now with complete prior_failures documentation.

