           resamples). Also report margin_override_minus_vote. Emit oracle_distinct_beats_vote BARE bool :=
           (CI95 excludes 0 AND delta>0 AND headroom exists). Run adversarial_verify.py (it must NOT raise
           CIRCULAR_MOAT_OVERCLAIM). Honest headline: one of {{oracle_distinct_aggregator_beats_vote,
