    CONCRETE STEPS:
    1. PRECONDITIONS: immediately print a flushed progress line. Check input paths, REQ-* specifications and resources before measurement. Missing external inputs produce complete_blocked_<reason>, verdict_class=blocked, and gate_check_summary naming upstream, path, field, expected and observed values. Do not fabricate fallback data.
