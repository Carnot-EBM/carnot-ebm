- id: exp566-jepa-pure-margin-loss
  milestone: 2026.04.43
  deliverable: results/experiment_566_jepa_pure_margin.json
  title: 'Exp 566: JEPAPUREMinForm — Min-Form PRM Objective for JEPA (RETRO-060 Fix,
    arXiv 2504.15275)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-060 —\
    \ JEPA trained with binary BCE loss produced AUC=0.4286 on a 132-pair corpus (Exp\
    \ 557) — below random baseline, for the SECOND consecutive retrain. Root cause:\
    \ binary BCE loss lets the model hedge toward P=0.5 everywhere, producing zero\
    \ gradient for useful energy gap. Fix: PURE min-form PRM objective (arXiv 2504.15275):\
    \ score(chain) = min(step_score(t) for t in chain). Incorrect chains with one bad\
    \ step get a strong low signal; correct chains with all good steps get a strong\
    \ high signal. This enforces a contrastive margin EXACTLY as NUP Probe v4 uses\
    \ (AUC=1.0). CPU-only — no GPU needed.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/inference/jepa_predictor.py\
    \ — existing JEPAPredictor (read the training loop and loss function)\n- python/carnot/pipeline/fover_corpus.py\
    \ — FOVERCorpusEntry, merge_fover_sources() (from Exp 553)\n- results/fover_corpus_v2.json\
    \ — 132-pair corpus (check structure: question, response, is_correct, cot_steps)\n\
    - results/experiment_557_jepa_v9_retrain.json — RETRO-060 context (final_auc=0.4286,\
    \ loss_function='binary_ce')\n- python/carnot/models/eorm_retrain.py — _evaluate_eorm_auc\
    \ (reuse for AUC computation)\n\nTASK: Implement PURE min-form loss and validate\
    \ on 132-pair corpus.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-LEARN-050\
    \ (JEPAPUREMinForm: min-form contrastive margin loss for JEPA training, arXiv 2504.15275),\
    \ REQ-LEARN-051 (margin parameter configurable), SCENARIO-LEARN-078/079/080 to\
    \ openspec/capabilities/autoresearch/spec.md.\n3. Create python/carnot/inference/jepa_pure_loss.py:\n\
    \   a. JEPAChainScore dataclass: chain_id (str), step_scores (list[float]), min_score\
    \ (float), is_correct (bool). min_score = min(step_scores).\n   b. PUREMinFormLoss\
    \ class:\n      - __init__(self, margin: float = 1.0)\n      - compute_chain_scores(model,\
    \ chain_embeddings: list[jnp.ndarray]) -> list[float]: pass each embedding through\
    \ model, return list of scalar scores.\n      - compute_loss(correct_chains: list[JEPAChainScore],\
    \ incorrect_chains: list[JEPAChainScore]) -> float:\n          * For each (correct,\
    \ incorrect) pair (cross-product or matched by question_id):\n          * loss\
    \ += max(0, margin - (incorrect.min_score - correct.min_score)).\n          * Return\
    \ mean loss over all pairs.\n      - zero_if_empty(self, pairs) -> float: return\
    \ 0.0 if len(pairs)==0.\n   c. pairs_to_pure_chains(fover_entries: list[FOVERCorpusEntry],\
    \ embed_fn) -> tuple[list[JEPAChainScore], list[JEPAChainScore]]:\n      - Group\
    \ by question_id (same question, different model responses = contrastive pairs).\n\
    \      - For each entry: embed each cot_step, compute chain scores, assign JEPAChainScore.\n\
    \      - Return (correct_chains, incorrect_chains) split.\n   d. Export PUREMinFormLoss,\
    \ JEPAChainScore, pairs_to_pure_chains from carnot.inference.__init__.\n4. Write\
    \ scripts/experiment_566_jepa_pure_margin.py:\n   a. apply_env_autofix() FIRST.\n\
    \   b. ExperimentTimeoutWatchdog(566, timeout_minutes=30).\n   c. ExperimentTemplate(566,\
    \ 'JEPA PURE MinForm Loss',\n      'results/experiment_566_jepa_pure_margin.json',\
    \ requires_gpu=False).\n   d. Load 132-pair corpus from results/fover_corpus_v2.json.\n\
    \   e. Build correct_chains and incorrect_chains using pairs_to_pure_chains.\n\
    \   f. Initialize small JEPA model (same architecture as Exp 557).\n   g. Train\
    \ for 100 epochs using PUREMinFormLoss.\n   h. Evaluate AUC on held-out 20% split\
    \ after training.\n   i. Compare: loss_function_old='binary_ce', loss_function_new='pure_min_form',\
    \ old_auc=0.4286 (from Exp 557), new_auc=<computed>.\n   j. Determine retro_060_partial:\
    \ new_auc > 0.5 (any improvement over random).\n   k. Build artifact: schema='carnot.jepa_pure_loss.v1',\n\
    \      n_pairs=<len(correct_chains)+len(incorrect_chains)>,\n      loss_function='pure_min_form',\n\
    \      margin=1.0,\n      train_auc=<float>, val_auc=<float>,\n      old_auc=0.4286,\n\
    \      auc_improvement=new_auc-0.4286,\n      retro_060_partial=<new_auc>0.5>,\n\
    \      honest_verdict='loss_redesign_success' if new_auc>0.5 else 'loss_redesign_partial'\
    \ if new_auc>old_auc else 'loss_redesign_no_improvement'.\n   l. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_jepa_pure_loss.py (100% coverage\
    \ on jepa_pure_loss.py):\n   a. Test PUREMinFormLoss.compute_loss with correct\
    \ chains scoring higher than incorrect returns loss > 0.\n   b. Test margin enforcement:\
    \ when gap > margin, loss contribution = 0.\n   c. Test zero_if_empty returns 0.0.\n\
    \   d. Ensure 100% coverage.\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\n7. Reconcile: _bmad/traceability.md (new REQ rows), ops/conductor-log.md,\
    \ ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp567-jepa-v10-retrain-pure
  milestone: 2026.04.43
  deliverable: results/experiment_567_jepa_v10_retrain.json
  title: 'Exp 567: JEPA v10 Retrain — PURE MinForm on 132-pair Corpus (FR-11 Mandatory)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: FR-11 mandatory\
    \ — this is the JEPA retrain that must run every milestone. RETRO-060: two consecutive\
    \ JEPA retrains (Exps 543, 557) both produced AUC < 0.5. Exp 566 implemented PUREMinFormLoss\
    \ as the replacement objective. This experiment performs the full JEPA v10 retrain\
    \ on the 132-pair FOVER corpus v2 using the new PURE objective. CPU-only (training\
    \ small model on 132 pairs).\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/inference/jepa_pure_loss.py\
    \ — PUREMinFormLoss, pairs_to_pure_chains() (from Exp 566)\n- python/carnot/inference/jepa_predictor.py\
    \ — JEPAPredictor architecture (EORMModel encoder + predictor head)\n- python/carnot/models/eorm_retrain.py\
    \ — _evaluate_eorm_auc() (reuse for AUC evaluation)\n- results/fover_corpus_v2.json\
    \ — 132-pair corpus\n- results/jepa_predictor_v9.safetensors — prior checkpoint\
    \ (v9 from Exp 557, AUC=0.4286)\n- results/experiment_557_jepa_v9_retrain.json\
    \ — Exp 557 result (architecture details, n_pairs=132, final_auc=0.4286)\n\nTASK:\
    \ Full JEPA v10 retrain with PURE objective. Target AUC >= 0.700.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Add REQ-LEARN-052 (JEPA v10: full retrain with PUREMinFormLoss\
    \ on 132-pair corpus), SCENARIO-LEARN-081/082/083 to autoresearch/spec.md.\n3.\
