      TASK:
      Archive terminal .510 evidence into a collision-free .511 dependency map, apply the capstone's narrow missing retirement, and emit results/experiment_5717_transition_v511.json.

      CONCRETE STEPS:
      1. Read every Exp5706-Exp5716 artifact and conductor outcome. Preserve missing, gate-skipped, blocked, null, and promoted states exactly.
      2. Preserve the Exp5708 root cause: authenticated CUDA and 50 manifest rows, but 21 truncations, 26 missing answers, 3 parses, and zero validator disagreements.
      3. Add one narrow exclusion-manifest entry for `fr11_prospective_shadow_stream_exp5709_same_verdict`. Preserve the .509 controller, disabled adapter, future clean streams, and generic lifecycle learning.
      4. Preserve Exp5711 as qualification-only, Exp5712 as a safe matched null, and Exp5713's `solve_provenance=live_agent_self_discovery`, registry count 177, and delta 0. Do not retire generic ARC working memory or live attempts.
      5. Preserve one-axis Python promotion and Exp5714/Exp5715 Rust readiness; keep two-axis exchange retired. Emit `one_axis_rust_quality_ready_score=1.0` only when the direct artifacts validate.
      6. Collision-check artifacts, roadmaps, history, logs, scripts, and tests before allocating `current_task_range=exp5717-exp5728`. Emit dependency and structured-gate maps.
      7. Reconcile transition-only entries in research-complete.yaml, ops/status.md, ops/changelog.md, ops/conductor-log.md, and ops/exclusion_manifest.yaml without changing scientific verdicts.
      8. REQUIRED ARTIFACT FIELDS: with `field_principles`, `source_capstone_hash`, `v510_task_verdicts`, and `v510_conductor_outcomes` — provenance/denominator exact; `sota_parse_failure_taxonomy` and `cuda_offload_authenticated=true` — root cause exact; `fr11_prospective_promoted=false`, `fr11_isolated_promoted=false`, `model_weight_mutation=false`, and `production_default_enabled=false` — FR-11 boundary exact; `arc_registry_count=177`, `arc_registry_delta=0`, and `arc_relational_route_promoted=false` — ARC exact; `one_axis_rust_parity_ready_score=1.0` and `one_axis_rust_quality_ready_score=1.0` — prerequisites scalar; `retirements_required`, `retirements_applied`, `preserved_scopes`, and `retired_scopes` — exclusions reconstruct; `current_task_range=exp5717-exp5728`, `dependency_map`, and `gate_map` — allocation canonical; `timing_claimed=false` and `hardware_speedup_claimed=false` — no inflation; `inference_substrate=artifact_reconciliation_only`, `test_commands`, `test_exit_codes`, `reproducibility_checksum`, and `honest_verdict` — replay/verdict explicit.
      9. Run YAML, roadmap schema, prior-failure, exclusion-manifest, gate, conductor-preflight, adversarial, and root-clutter checks. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.
