        3. Fit the accuracy(K) curve; classify MONOTONE_GAIN / PLATEAU / DEGRADING.

      REQUIRED ARTIFACT FIELDS:
        accuracy_by_k: {{ principle: "The K-scaling curve — the direct evidence for/against 'thinking = energy descent helps'." }}
        k_curve_shape: {{ principle: "MONOTONE_GAIN | PLATEAU | DEGRADING — bounds (or supports) the EBT System-2 claim at this scale." }}
        best_k, best_k_accuracy: {{ principle: "The compute-optimal descent budget; informs whether spending more inference compute is worth it." }}
        n_heldout, seeds_used, preconditions_checked, model_specs, random_seed,
        reproducibility_checksum, duration_s, inference_substrate:
          {{ principle: "Methodology — real K-sweep inference takes wall-clock; implausibly short = fabrication." }}

      FALSIFICATION GATE:
        - SYSTEM2_SUPPORTED: k_curve_shape == MONOTONE_GAIN AND accuracy_by_k[16] > accuracy_by_k[1].
          honest_verdict: `complete: ebt_system2_SUPPORTED_acc_rises_with_k_best_k<k>_acc<a>`
        - SYSTEM2_BOUNDED: k_curve_shape in {{PLATEAU, DEGRADING}}.
          honest_verdict: `complete: ebt_system2_BOUNDED_<shape>_no_usable_descent_signal_at_scale`
        honest_verdict MUST start with a terminal prefix or `blocked_<resource>`.

      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_3872_ebt_energy_descent_system2_diagnostic.py
