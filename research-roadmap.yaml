# Pre-staged .452 roadmap (Pre-Staged Roadmap Convention).
# Planner: outer-loop Claude Opus 4.8, 2026-06-28.
# STRATEGIC READ (.451 -> .452): .451's capstone (exp4901) ESCALATED to the operator:
# complete_capstone_v451_representation_invariant_escalate_operator. Across THREE world-model
# representations (executable-code .449, decision-need-targets .450/.451 A1, action-prefix-latents .451 A1b)
# the induced model predicts change-LOCATION (cell_recall 0.727) but NOT change-VALUE
# (REPRESENTATION-INVARIANT: A1 delta -0.10 migration 0; A1b delta 0.0). Energy CONCLUDED negative (S0-S3, no
# live ARC value). Goal-quality SOLVED (.437). So every OFFLINE value-PREDICTION route is bounded. .452 stops
# proposing representation #4. It exploits the finding's ASYMMETRY: change-LOCATION is learnable (0.727),
# change-VALUE is not -- and ARC-AGI-3 is INTERACTIVE, so the real env gives the true change-VALUE for free.
# .452 A1 (HEADLINE) demotes the model from state-predictor to action-PRIOR: a change-LOCATION-pruned,
# REAL-ENV-VALUE-GROUNDED interleaved act-and-observe search (NOT plan_in_model's plan-then-validate, whose
# plan is poisoned by the broken value prediction BEFORE the env sees it). The model ranks WHICH action changes
# something (0.727), the env reads WHAT it becomes; the learned verifier scores progress to the .437-quality
# goal. This fixes the .432 "proposal distribution misses" wall with the one signal that works AND sidesteps the
# representation-invariant change-VALUE wall. A1b (gated on A1 not lifting first-win) = the LAST representation
# swing: the latent-ACTION interface (AdaWorld arXiv:2503.18938, D's flagged priority-1). If BOTH null, the
# change-VALUE gap is representation-invariant across FOUR classes + env-grounding -> deliverable LOCKS to the
# ~0.05 agent + the publishable FoVer paper. PLUS the 6/30 deadline lanes: A2 level-up bank, A3 self-play, A4 a
# CLEAN genuinely-live held-out first-win (go/no-go), B2 final submission harden. Do NOT re-propose energy
# (CONCLUDED), TTA-on-code-engine, stronger-local-code-inducers, decision-need-targets, action-prefix-latents,
# coverage/exploration/selection/perception-from-grid (all nulled/retired).
