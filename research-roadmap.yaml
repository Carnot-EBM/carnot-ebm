      verdict: tier0i_marginal
      addressed_by: >
        Exp 911 achieved AUC below 0.65 threshold because it used a single cosine drift
        vector (3 values from 3 adjacent-layer pairs) fed to one LogisticRegression.
        arXiv 2604.13386 (Multi-Layer Probe Ensembling, incorporated in .70 planning) shows
        that replacing per-layer single probes with a learned ensemble over all layers improves
        AUROC by 3-8%. Exp 923 implements: instead of concatenating 3 drift values into one
        feature vector, train 4 separate LogisticRegression probes (one per layer pair) and
        learn a weighting α over their outputs. The ensemble weight is optimized on held-out
