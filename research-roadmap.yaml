  - id: exp5381-v490-budget-memory-tautology-corrigendum
    milestone: "2026.07.490"
    title: "Budget-curated memory tautology corrigendum"
    priority: critical
    track: self-learning
    deliverable: "results/experiment_5381_budget_memory_tautology_corrigendum_v490.json"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    estimated_wall_time_min: 35
    prior_failures:
      - experiment_id: exp5368-v489-budget-curated-memory-governance
        verdict: "FLAGGED: adversarial_verify CRITICAL TAUTOLOGY despite capstone budget_curated_memory_ready=true"
        addressed_by: "This task recomputes every readiness field from row-level evidence and adds negative controls before allowing downstream self-learning scale-up."
        retire_if_same_verdict: true
      - experiment_id: exp5342-v487-memory-cadence-policy
        verdict: "FLAGGED: adversarial_verify CRITICAL TAUTOLOGY"
        addressed_by: "This corrigendum requires anti-tautology controls, row-level provenance, and recomputation rather than copying an aggregate ready flag."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      The .489 capstone reported budget_curated_memory_ready=true, but the conductor log marked Exp5368 with an adversarial TAUTOLOGY flag. Downstream self-learning should not depend on that artifact until a clean corrigendum recomputes the fields from row-level evidence.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/research-program.md
      - {project_root}/results/experiment_5368_budget_curated_memory_governance_v489.json
      - {project_root}/results/experiment_5375_capstone_v489.json
      - {project_root}/ops/conductor-log.md
      - {project_root}/python/carnot/
      - {project_root}/tests/python/

      TASK:
      Produce a non-tautological budget-curated memory corrigendum. The artifact must show that memory KEEP/SHARE/TRUST decisions and readiness flags are derived from rows, not from restating desired conclusions.

      CONCRETE STEPS:
      1. Inspect the Exp5368 artifact and conductor log for the exact TAUTOLOGY reason.
      2. Build or reuse row-level memory evidence covering value, byte/latency/energy proxy cost, provenance, trust label, stale/poison controls, and rollback behavior.
      3. Add negative controls where a stale or poisoned memory should be rejected and a high-cost low-value memory should be dropped.
      4. Recompute aggregate fields from the rows and fail closed if the rows do not support the claim.
      5. Write {project_root}/results/experiment_5381_budget_memory_tautology_corrigendum_v490.json.

      REQUIRED ARTIFACT FIELDS:
      - status: principle: complete only if row-level evidence and controls were evaluated.
      - budget_memory_corrigendum_clean: principle: true only if readiness is recomputed from rows and anti-tautology controls pass.
      - source_artifact: principle: path to the Exp5368 artifact reviewed.
      - row_count: principle: number of memory decision rows evaluated.
      - recomputed_fields_from_rows: principle: list of aggregate fields derived mechanically from rows.
      - anti_tautology_controls: principle: object describing controls and pass/fail status.
      - negative_controls_count: principle: number of stale/poison/high-cost controls.
      - negative_controls_passed: principle: count of negative controls rejected correctly.
      - keep_share_trust_policy_ready: principle: true only if decisions are supported by row evidence.
      - no_weight_mutation: principle: must be true.
      - rollback_supported: principle: true only if rollback behavior is evidenced.
      - unsafe_false_accepts: principle: count of bad memory decisions accepted as good.
      - tests_run: principle: list of commands run or explicit no-code-change explanation.
      - honest_verdict: principle: one-line clean/block verdict.

