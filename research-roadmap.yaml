- id: exp646-jepa-v14-platt-scaling
  milestone: 2026.04.49
  deliverable: results/experiment_646_jepa_v14_platt.json
  title: 'Exp 646: JEPA v14 Platt Scaling — Temperature Calibration for ECE < 0.10'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA v14 OOD AUC=0.912 (excellent). ECE=0.132 (target < 0.10, not met).
    Platt scaling (temperature scaling) applies a single parameter T to the logits:
    calibrated_prob = sigmoid(logit / T).
    T > 1 softens probabilities (reduces overconfidence). T < 1 sharpens.
    Optimize T on a held-out calibration set to minimize ECE.
    This is a 5-minute fix that typically reduces ECE by 50-70% without touching AUC.

    EXISTING CODE TO READ FIRST:
    - results/jepa_v14_oracle.npz — JEPA v14 weights (Exp 631)
    - results/experiment_631_jepa_v14_oracle.json — v14_ece=0.132, v14_ood_auc=0.912,
      training config, n_training_pairs
    - python/carnot/training/capo_loss.py — capo_loss, ece_loss (Exp 618)
    - python/carnot/inference/ — JEPAPredictor class and predict() method
    - results/fover_corpus_v5_oracle.json — ORACLE corpus for calibration split

    TASK: Apply Platt temperature scaling to JEPA v14 to reduce ECE below 0.10.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-144 (JEPA v14 Platt: temperature scaling reduces ECE below 0.10
       without AUC degradation > 0.02), SCENARIO-VERIFY-190/191 to
       openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/training/platt_scaler.py:
       a. PlattScaler class:
          __init__(self, init_temperature: float = 1.0):
            self.T = init_temperature
          fit(self, logits: jnp.ndarray, labels: jnp.ndarray,
              n_steps: int = 200, lr: float = 0.01) -> float:
            'Find T minimizing NLL on calibration set. Returns optimal T.'
            T = self.T
            for step in range(n_steps):
                calibrated = jax.nn.sigmoid(logits / T)
                nll = -jnp.mean(labels * jnp.log(calibrated + 1e-8) +
                                (1 - labels) * jnp.log(1 - calibrated + 1e-8))
                grad_T = jax.grad(lambda t: -jnp.mean(
                    labels * jnp.log(jax.nn.sigmoid(logits/t) + 1e-8) +
                    (1-labels) * jnp.log(1-jax.nn.sigmoid(logits/t) + 1e-8)))(T)
                T = T - lr * grad_T
                T = float(jnp.clip(T, 0.1, 10.0))
            self.T = T
            return T
          calibrate(self, logits: jnp.ndarray) -> jnp.ndarray:
            return jax.nn.sigmoid(logits / self.T)
          compute_ece(self, probs: jnp.ndarray, labels: jnp.ndarray,
                      n_bins: int = 10) -> float:
            'Expected Calibration Error.'
            bin_boundaries = jnp.linspace(0, 1, n_bins + 1)
            ece = 0.0
            for i in range(n_bins):
                in_bin = (probs >= bin_boundaries[i]) & (probs < bin_boundaries[i+1])
                if in_bin.sum() > 0:
                    bin_acc = labels[in_bin].mean()
                    bin_conf = probs[in_bin].mean()
                    ece += float(in_bin.sum()) / len(probs) * abs(float(bin_acc) - float(bin_conf))
            return ece
       b. Export PlattScaler from carnot.training.
    4. Write scripts/experiment_646_jepa_v14_platt.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(646, timeout_minutes=30).
       c. ExperimentTemplate(646, 'JEPA v14 Platt Scaling',
          'results/experiment_646_jepa_v14_platt.json', requires_gpu=False).
       d. Load JEPA v14 model from results/jepa_v14_oracle.npz.
          If not found: use v13 from results/jepa_v13_capo.npz as fallback.
       e. Load calibration pairs from fover_corpus_v5_oracle.json (use 20% as cal set, 80% eval).
          Compute raw logits = predictor.predict_logit(response, step_text) for each pair.
          labels = [1.0 if is_correct else 0.0 for each pair].
       f. Baseline ECE (before Platt): compute ece_before using PlattScaler.compute_ece().
       g. scaler = PlattScaler(init_temperature=1.0)
          T_optimal = scaler.fit(train_logits, train_labels)
          calibrated_probs_val = scaler.calibrate(val_logits)
          ece_after = scaler.compute_ece(calibrated_probs_val, val_labels)
       h. AUC before/after (use sklearn or manual AUROC if available).
       i. Save scaler: json.dump({'temperature': T_optimal}, open('results/jepa_v14_platt_T.json','w'))
       j. Build artifact: schema='carnot.jepa_v14_platt.v1',
          v14_ece_before=<float>, ece_after=<float>,
          T_optimal=<float>, ece_reduction_pct=<float>,
          v14_auc_before=0.912, auc_after=<float>,
          calibration_target_met=(ece_after < 0.10),
          scaler_saved='results/jepa_v14_platt_T.json',
          honest_verdict='platt_calibrated' if ece_after < 0.10
            else 'platt_improved_not_calibrated' if ece_after < 0.132
            else 'platt_no_improvement'.
       k. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_platt_scaler.py (100% coverage on platt_scaler.py).
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: ops/conductor-log.md (RETRO-060 JEPA ECE calibration), ops/changelog.md.
