    \   Export CrossSessionResult, simulate_session, compute_relay_verdict from carnot.pipeline.__init__.\n\
    \   Verbose docstrings: WHY cross-session memory matters (within-session learning is washed out;\n\
    \   persistent memory accumulates signal across queries), Tier 2 architecture alignment\n\
    \   (research-program.md Tier 2: constraint memory across sessions), hardware path (CPU +\n\
    \   system memory for storage; FPGA for fast template matching at production scale).\n\
    5. Write scripts/experiment_448_cross_session_memory.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(448, timeout_minutes=25)\n\
    \   c. ExperimentTemplate(448) CPU mode\n\
    \   d. Generate 150 synthetic arithmetic GSM8K-style problems with known carry errors\n\
    \   e. Session 1 (50 questions): no prior memory. Run pipeline. Observe carry_check activating.\n\
    \      Save ConstraintTemplateLibrary to SessionMemory.\n\
