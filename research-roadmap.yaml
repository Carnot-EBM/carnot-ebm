- id: exp774-adaptive-bayesian-psv
  milestone: 2026.04.59
  deliverable: results/experiment_774_adaptive_bayesian_psv.json
  title: 'Exp 774: Adaptive Bayesian Sampling in PSV — Variance-Based Early Stopping (arXiv 2603.22812)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2603.22812 "Efficient Hallucination Detection: Adaptive Bayesian Estimation
    with Guided Semantic Exploration" (March 2026) shows adaptive variance-based sampling stops
    early when sample variance drops below a criterion, achieving 50% fewer samples while
    maintaining detection quality comparable to fixed-budget sampling.

    Carnot's PSV (self-play verify-repair) loop currently uses fixed K=4 parallel samples per
    question. Adaptive variance-based stopping could reduce oracle calls by 30-50%, directly
    lowering the compute cost of the verify-repair pipeline at scale. This is a component-level
    efficiency improvement that complements the SETS architectural comparison (Exp 773).

    The mechanism: compute variance of energy scores across K sampled responses. If variance
    drops below threshold (the distribution has converged), stop sampling. Otherwise continue
    up to K_max.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/self_learning_relay.py — SelfLearningRelay; PSV sampling loop.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; K-sample generation.
    - python/carnot/pipeline/psv_diagnostic.py — PSVDiagnostic from Exp 755.
    - results/experiment_756_psv_srsa_gate.json — PSV recovery baseline (fp_rate_slope).
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement AdaptivePSVSampler with variance-based early stopping. Measure:
    sample_reduction_fraction and detection_auc_delta vs fixed-K baseline.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-SAMPLE-020 (AdaptivePSVSampler MUST stop early when energy_variance <
       variance_threshold across current K samples; MUST NOT stop before K_min=2 samples),
       REQ-SAMPLE-021 (sample_reduction_fraction MUST be computed as
       1 - mean_samples_used / K_max; target >= 0.30 for efficiency gain),
       SCENARIO-SAMPLE-030/031 to openspec/capabilities/self_learning/spec.md.
    3. Implement python/carnot/pipeline/adaptive_psv_sampler.py:
       a. AdaptiveSamplerConfig(K_min=2, K_max=8, variance_threshold=0.05).
       b. AdaptivePSVSampler(pipeline: VerifyRepairPipeline, config: AdaptiveSamplerConfig):
          sample_until_convergent(question: str) -> AdaptiveSampleResult:
            - samples: list[str] = []
            - energy_scores: list[float] = []
            - For k in range(K_max):
                candidate = pipeline.generate(question)
                energy = pipeline.compute_energy(candidate)
                samples.append(candidate), energy_scores.append(energy)
                if k >= K_min and variance(energy_scores) < config.variance_threshold:
                    break (early stopping)
            - Return AdaptiveSampleResult(samples, energy_scores, k_used=len(samples)).
    4. Run comparison: 50 synthetic GSM8K-style questions.
       a. Fixed-K baseline: K=4 for all questions.
       b. Adaptive: AdaptivePSVSampler with config.
       c. For both: compute final energy score (min energy sample selected).
       d. Compute:
          fixed_k_mean_samples = 4.0 (by definition)
          adaptive_mean_samples = mean(k_used for all questions)
          sample_reduction_fraction = 1 - adaptive_mean_samples / K_max
          detection_auc_fixed = AUROC from fixed-K energy scores vs labels.
          detection_auc_adaptive = AUROC from adaptive energy scores vs labels.
          auc_delta = detection_auc_adaptive - detection_auc_fixed.
    5. Create scripts/experiment_774_adaptive_bayesian_psv.py:
       a. ExperimentTemplate(774) + ExperimentTimeoutWatchdog(774, timeout_minutes=30).
       b. Implement steps 3-4.
       c. honest_verdict:
          - "adaptive_efficient_lossless" if sample_reduction >= 0.30 AND auc_delta >= -0.02
          - "adaptive_efficient_marginal_loss" if sample_reduction >= 0.30 AND auc_delta < -0.02
          - "adaptive_no_reduction" if sample_reduction < 0.10 (variance threshold too tight)
          - "adaptive_configuration_needed" if threshold needs calibration
       d. artifact: K_max, variance_threshold, adaptive_mean_samples, fixed_k_mean_samples,
          sample_reduction_fraction, detection_auc_fixed, detection_auc_adaptive, auc_delta,
          honest_verdict.
    6. Write tests/python/test_experiment_774_adaptive_bayesian_psv.py with 100% coverage:
        - test AdaptivePSVSampler stops before K_max when variance < threshold.
        - test AdaptivePSVSampler never stops before K_min samples.
        - test sample_reduction_fraction = 1 - adaptive_mean / K_max.
        Each test traces to REQ-SAMPLE-020/021.
    7. Reconcile:
        - ops/status.md: "Adaptive Bayesian PSV (arXiv 2603.22812): sample_reduction=X%.
          auc_delta=Y. honest_verdict=X."
        - ops/changelog.md: one-line with honest_verdict.
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

