  # --------------------------------------------------------------------------
  # PHASE 1 — THE FIRST SOLVE (r11l, the survey's easiest inducible target)
  # --------------------------------------------------------------------------
  - id: exp3946-r11l-first-solve
    milestone: "2026.06.365"
    prior_failures:
      - experiment_id: arc3_m2_solve (M2-v5, vc33)
        verdict: "complete: m2v5_vc33_no_solve — vc33's win is a hard Sokoban spatial-target config; a trustworthy transition-model is necessary but not sufficient (needs goal-grounding + PSPACE-class planning)."
        addressed_by: "DIFFERENT GAME + DIFFERENT difficulty class. The 25-game win-condition survey (results/arc3_win_condition_survey.json) selected r11l: NON-spatial (is_spatial_planning=false), goal DIRECTLY OBSERVABLE (gray templates show each piece's destination), near-trivial plan (per piece: click-piece, click-its-target). r11l mechanic already reverse-engineered partway (results/arc3_r11l_solve.json diagnosis): pieces = color-3 sprites (one auto-selected at level start), targets = flkdtg sprites, gray color-2 = decorative; a click selects the piece under the cursor, a 2nd click places the SELECTED piece centered at the cursor if valid; next_level() when all pieces are on targets. The FIRST attempt's generic gray-as-template perception was wrong; this task pins the exact select/place interaction empirically."
        retire_if_same_verdict: false
    title: "FIRST ARC-AGI-3 SOLVE: reverse-engineer r11l's exact select/place WIN-INTERACTION empirically and SOLVE level 1 (ideally more), offline. The transition dynamics are inducible (hidden_state=false); the open problem is the click semantics + piece->target matching. Build on scripts/experiments/arc3_r11l_solve.json's diagnosis: pieces=color-3 (one auto-selected), targets=flkdtg sprites. Probe each click type, watch the grid delta, determine how a piece is picked up and placed, match each color-3 piece to its target by shape, execute click-pairs, and CONFIRM the solve via the REAL env level_completed (ground truth)."
    priority: critical
    track: research
    max_turns: 80
    agent_type: claude
    model: opus
    requires_claude: true
    inference_substrate: offline_arc_agi3_perception_planner_real_env_confirmed
    deliverable: results/experiment_3946_r11l_first_solve.json
    prompt: |
      CONTEXT. This is the ARC push's first-solve attempt. The offline stack already produced a
      trustworthy world-model for a click-game (vc33, energy 0.005). The blocker for a SOLVE is the
      per-game GOAL + WIN-INTERACTION. r11l (the survey's easiest target) is a click-to-drag placement
      puzzle: drag each colored PIECE onto its matching GRAY-TEMPLATE target; win when all placed.

      EXISTING CODE/EVIDENCE TO READ FIRST:
        - results/arc3_win_condition_survey.json (the survey; r11l entry + rationale)
        - results/arc3_r11l_solve.json (the diagnosis: pieces=color-3 auto-selected, targets=flkdtg,
          gray=decorative; the generic perception that FAILED and why)
        - scripts/experiments/arc3_r11l_solve.py (the first solver — has _components/_perceive/_match)
        - environment_files/r11l/*/r11l.py step() + on_set_level() + the win check (for DIAGNOSIS of the
          mechanic — the SOLVER must INDUCE from observation, but you may read source to design probes)

      CONCRETE STEPS:
        0. PRECONDITIONS: offline env loads — `{project_root}/.venv/bin/python -c "import sys;
           sys.path.insert(0,'python'); from arc_agi import Arcade; from arc_agi.base import OperationMode;
           Arcade(arc_api_key='', operation_mode=OperationMode.OFFLINE, environments_dir='environment_files')"`
           succeeds. If not, honest_verdict blocked_arc_offline_env_unavailable and EXIT.
        1. EMPIRICALLY pin the select/place interaction: from reset, probe single clicks on a color-3
           piece, on empty cells, on a target — record the grid delta + levels_completed each time.
           Determine: is a piece auto-selected at start? Does clicking a piece select it? Does a 2nd
           click place it (where)? Is there a pickup/drag phase? Document the induced mechanic.
        2. PERCEPTION: identify the color-3 piece(s) and their target locations (NOT the gray decoration).
           Match each piece to its target by shape/size.
        3. PLAN + EXECUTE: for each (piece, target), execute the induced select->place click sequence in
           the REAL env. Confirm a solve via levels_completed > 0 (the env is ground truth).
        4. If the first matching does not win, search piece->target assignments with env feedback
           (resetting on lose, within the 60-action budget). Report honestly whether L1 (or more) solved.

      REQUIRED ARTIFACT FIELDS (BARE scalars; principle: lines guide YOU):
        ACCURACY_levels_solved: principle "The headline — levels of r11l solved, confirmed by the REAL env (the first ARC-AGI-3 solve if > 0)."
        first_solve_at_action: principle "Action count to the first level-up — the efficiency axis (RHAE) for the quota-gate."
        induced_select_place_mechanic: principle "Plain-English description of the click semantics induced empirically — so the next game reuses the method."
        real_env_confirmed: principle "BARE BOOL — the solve was confirmed by levels_completed from the real env, not a model or a heuristic (no fabrication)."
        n_pieces_perceived, n_targets_perceived: principle "Perception sanity — should be a sensible 1:1-ish piece:target count, not the decorative gray over-count of the first attempt."
        random_seed, honest_verdict, duration_s, inference_substrate: principle "Reproducibility + terminal-prefix verdict + the real-env substrate."

      honest_verdict MUST start with `complete:`/`success:` or `blocked_<resource>`. A 0-solve is an
      honest `complete: r11l_no_solve_<reason>` with the induced mechanic recorded — NOT a fabricated win.
      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_3946_r11l_first_solve.py
      Do NOT push.

  # --------------------------------------------------------------------------
  # PHASE 2 — GENERALIZE THE TRUSTWORTHY-MODEL PIPELINE
  # --------------------------------------------------------------------------
  - id: exp3947-active-data-codex-nonspatial-sweep
    milestone: "2026.06.365"
    title: "Generalize the active-data -> codex-program-synthesis -> consistency-energy-verification pipeline across the 6 NON-SPATIAL games (r11l, sc25, lp85, tn36, dc22, su15): how many reach a TRUSTWORTHY world-model (held-out consistency energy <= 0.15)? vc33 reached 0.005 from active data; this measures whether that generalizes. Build on scripts/experiments/arc3_m2_active_codex.py (passive-vs-active codex synthesis) — extend it to the 6-game set and report a per-game trustworthy-model table."
    priority: high
    track: research
    max_turns: 70
    agent_type: claude
    model: opus
    requires_claude: true
    inference_substrate: offline_arc_agi3_plus_codex_program_synthesis_consistency_verified
    deliverable: results/experiment_3947_active_data_codex_nonspatial_sweep.json
    prompt: |
      CONTEXT. M2-v4b proved active data -> codex program synthesis -> consistency-energy verification
      produces a trustworthy world-model on vc33 (energy 0.005, replicated). This task tests whether the
      pipeline GENERALIZES across the 6 non-spatial games the survey identified.

      EXISTING CODE TO READ + REUSE:
        - scripts/experiments/arc3_m2_active_codex.py (the codex passive-vs-active comparison; reuse its
          codex_best_energy + active_collect + grade_predictions wiring)
        - scripts/experiments/arc3_m2_active_data.py (active_collect — the coverage-driven collector)
        - python/carnot/agentic/arc_world_model_synth.py (grade_predictions — the oracle-free verifier)
        - results/arc3_m2_active_codex.json (the vc33 0.005 baseline)
        - results/arc3_win_condition_survey.json (the 6 non-spatial games)

      CONCRETE STEPS:
        0. PRECONDITIONS: codex CLI available (`command -v codex` succeeds) AND the offline env loads.
           If codex is unavailable, honest_verdict blocked_codex_unavailable and EXIT (do NOT fabricate
           a synthesis result).
        1. For each of the 6 games (r11l, sc25, lp85, tn36, dc22, su15): active-collect transitions,
           run codex program synthesis with the consistency-energy refactor-from-best loop, grade the
           best program on a common held-out test. Bound codex iters (<=3) + reasoning_effort=medium for
           wall-time.
        2. Report a per-game table: best held-out consistency energy, whether it is trustworthy (<=0.15),
           and how it compares to vc33's 0.005.

      REQUIRED ARTIFACT FIELDS (BARE scalars; principle: lines guide YOU):
        n_trustworthy_at_0.15: principle "How many of the 6 reach a plan-able world-model — the generalization headline."
        per_game_best_energy: principle "Per-game best held-out consistency energy (the verifier's trustworthiness signal, no oracle)."
        total_codex_calls, total_codex_seconds: principle "Wall-time provenance — codex synthesis is the heavy inducer; implausibly-short = fabrication."
        random_seed, honest_verdict, duration_s, inference_substrate: principle "Reproducibility + terminal-prefix verdict + the codex-synthesis substrate."

      honest_verdict MUST start with `complete:`/`success:` or `blocked_<resource>`.
      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_3947_active_data_codex_nonspatial_sweep.py
      Do NOT push.

  - id: exp3948-goal-predicate-induction
    milestone: "2026.06.365"
    title: "Induce a GOAL-PREDICATE from observed level-up transitions: the M2-v5 finding is that a trustworthy transition-model is necessary but not sufficient — you also need to recognize the WIN state. Collect level-up transitions (via active/goal-directed play on the non-spatial games), characterize the grid-state property that holds at a win (e.g. all pieces on targets / a matched pattern), and emit a reusable goal_predicate(grid) check. Measure: on a held-out set, does the induced predicate correctly flag win-vs-non-win states (precision/recall)?"
    priority: high
    track: research
    max_turns: 60
    agent_type: claude
    model: opus
    requires_claude: true
    inference_substrate: offline_arc_agi3_world_model_consistency_energy
    deliverable: results/experiment_3948_goal_predicate_induction.json
    prompt: |
      CONTEXT. M2-v5 (results/arc3_m2_solve.json) showed converting a world-model into a SOLVE requires
      grounding the GOAL. This task induces a goal-predicate from observed wins.

      EXISTING CODE TO READ:
        - python/carnot/agentic/arc_agi3_world_model.py (GameGraph, perception primitives)
        - scripts/experiments/arc3_goal_prior_explore.py (goal-directed play that previously reached
          level-ups — a source of win transitions)
        - results/arc3_win_condition_survey.json (per-game win summaries — the ground-truth goal shapes)

      CONCRETE STEPS:
        0. PRECONDITIONS: offline env loads. Else honest_verdict blocked_arc_offline_env_unavailable, EXIT.
        1. For 1-3 non-spatial games where level-ups are reachable, collect transitions where
           levels_completed increments; capture the grid-state at the win.
        2. Induce a goal_predicate(grid) -> bool that characterizes the win-state property (object/target
           coincidence, pattern match, etc.). Keep it grid-grounded (no oracle / no source-hardcoding).
        3. EVALUATE on held-out states: precision/recall of goal_predicate at flagging win-vs-non-win.

      REQUIRED ARTIFACT FIELDS (BARE scalars; principle: lines guide YOU):
        goal_predicate_precision, goal_predicate_recall: principle "Does the induced win-recognizer correctly flag wins on held-out states — the plan-ability gate."
        n_level_ups_observed: principle "How many real wins the induction trained on — too few = an under-determined predicate (FALSE_NEGATIVE_RISK)."
        games_covered: principle "Which games the predicate was induced/validated on."
        random_seed, honest_verdict, duration_s, inference_substrate: principle "Reproducibility + terminal-prefix verdict + substrate."

      honest_verdict MUST start with `complete:`/`success:` or `blocked_<resource>`.
      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_3948_goal_predicate_induction.py
      Do NOT push.

  - id: exp3949-hidden-state-latent-registers
    operator_override: >
      2026-06-08 operator directive (standing): versioned-lineage continuation — false-positive
      scope-match vs retired exp899-drift-hidden-state-probe (shared "hidden-state" keyword only). This
      is a NEW technique (latent boolean register augmentation to recover Markov dynamics on the 11
      determinism-probe hidden-state games), not a rerun of exp899's drift probe; forward difference is
      the register-augmentation method + the consistency-energy measurement.
    milestone: "2026.06.365"
    title: "Latent-register augmentation for the 11 HIDDEN-STATE games: the determinism probe (results/arc3_determinism_probe.json) found 11/25 games where the visible grid does NOT determine the dynamics (same frame_hash + action -> different next grid). Augment the state with inferred latent boolean registers (counter / collected-flag / phase) so the augmented state becomes Markov, and measure: does the induced model's consistency energy DROP on the hidden-state games vs the grid-only baseline?"
    priority: high
    track: research
    max_turns: 70
    agent_type: claude
    model: opus
    requires_claude: true
    inference_substrate: offline_arc_agi3_world_model_consistency_energy
    deliverable: results/experiment_3949_hidden_state_latent_registers.json
    prompt: |
      CONTEXT. 11/25 games are hidden-state (results/arc3_determinism_probe.json). For those, a grid->grid
      world-model is under-determined. This task adds latent registers to make the augmented state Markov.

      EXISTING CODE TO READ:
        - scripts/experiments/arc3_determinism_probe.py (the (frame_hash,action)->multiple-next detector)
        - python/carnot/agentic/arc_world_model_synth.py + arc_world_model_dsl.py (the inducers + grade_predictions)
        - results/arc3_determinism_probe.json (the 11 hidden-state games + their nondeterminism rates)

      CONCRETE STEPS:
        0. PRECONDITIONS: offline env loads. Else honest_verdict blocked_arc_offline_env_unavailable, EXIT.
        1. For 2-4 high-nondeterminism games (dc22 0.82, g50t 0.74, m0r0 0.72, cn04 0.71): infer candidate
           latent registers (a step counter, a per-color collected/visited flag, a phase bit) from the
           transition history; augment each state's signature with them.
        2. Re-measure the (augmented_state, action) -> next determinism, and the induced-model consistency
           energy vs the grid-only baseline. Does augmentation reduce apparent non-determinism + energy?
        3. Report which register types helped which games.

      REQUIRED ARTIFACT FIELDS (BARE scalars; principle: lines guide YOU):
        mean_energy_grid_only, mean_energy_with_latent_registers: principle "The headline — does latent augmentation lower the consistency energy on hidden-state games?"
        nondeterminism_reduction: principle "Does augmenting the state make (state,action)->next more deterministic (the Markov-recovery test)?"
        registers_that_helped: principle "Which latent register types reduced energy on which games — the reusable finding."
        random_seed, honest_verdict, duration_s, inference_substrate: principle "Reproducibility + terminal-prefix verdict + substrate."

      honest_verdict MUST start with `complete:`/`success:` or `blocked_<resource>`.
      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_3949_hidden_state_latent_registers.py
      Do NOT push.

