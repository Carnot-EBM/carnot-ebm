# archive/activate = claude + opus + requires_claude_verified (the exp4019/exp4008 lesson). All
# ARC solve tasks are INCREMENTAL (+1, never "solve all") per the Incremental-Progress rule.
#
# OPERATOR REVIEW: the G1 off-ARC transfer (exp4031/4032) is the operator's literal 2026-06-11 TOP
# PRIORITY; the G2 vc33 generalization (exp4034/4035) is the strategic bet on whether the .372
# search layer is real or game-specific. Adjust freely.
