    milestone: "2026.06.356"
    title: "Build the BALANCED step-error corpus the moat scissor needs: PRMBench (arXiv:2501.03124, 9 error axes) primary, FoVer v3 fallback — N>=1000, >=100 gold-INCORRECT steps, 9-axis labels preserved, seed-controlled. The precondition the .354 scissor (exp3844) blocked on."
    priority: critical
    track: research
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    requires_gpu: false
    estimated_wall_time_min: 40
    inference_substrate: aggregation_from_upstream_artifacts   # downloads/merges existing labeled datasets; no LLM loaded.
    deliverable: data/step_error_balanced_v2.json
    prompt: |
      CONTEXT. The moat scissor AT SCALE (exp3844, .354) BLOCKED because the cached FoVer v4 corpus is
      98%-correct-heavy (1286/1308 correct) — only ~22 gold-incorrect steps, far too few for a residual
      CI. The .355 corpus build (exp3846) SKIPPED under the poison-test wipeout. To measure the moat at
      scale we need a BALANCED corpus with a LARGE gold-incorrect set AND per-error-axis labels (for the
      independence decomposition). PRMBench (arXiv:2501.03124) is the canonical balanced successor to
      ProcessBench: 6,216 problems / 83,456 step labels across 9 fine-grained error axes. Fallback: the
      existing balanced FoVer v3 variants (data/fover_corpus_v3.json ~216 items ~47% incorrect;
      fover_test_v3.json; fover_train_v3.json; fover_corpus_expanded.json).

      EXISTING CODE TO READ FIRST:
        - scripts/experiment_2837_fover_memory_leakage_v3.py (the canonical step-candidate schema:
          {{question_id|question, step_text, label}} the ensemble scores — match it EXACTLY).
        - data/fover_corpus_v3.json, data/fover_test_v3.json, data/fover_train_v3.json (fallback + schema).
        - scripts/experiment_template.py (dataset helpers).

      TASK. Build data/step_error_balanced_v2.json: a single labeled step-error corpus, N>=1000, with
      >=100 gold-INCORRECT steps (target ~40-50% incorrect), seed-controlled, schema-compatible with the
      exp2837 ensemble scoring path, with the 9 PRMBench error-axis labels preserved where available
      (per-item `error_axis`; null for FoVer fallback items).

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE building; on failure write blocked_<resource> + EXIT, no fabrication):
           a. Network/HF reachable for PRMBench: `curl -sf -o /dev/null https://huggingface.co/api/datasets/hitsmy/PRMBench_Preview` (or the canonical PRMBench dataset id). If unreachable, fall through to the FoVer-v3 fallback (NOT a block — record primary_source=fover_v3_fallback).
           b. At least one FoVer v3 variant present for the fallback: `ls data/fover_corpus_v3.json data/fover_test_v3.json` returns a file.
           If NEITHER PRMBench nor any FoVer v3 file is available: honest_verdict `blocked_no_step_error_source` + preconditions_checked, EXIT.
        1. PRIMARY: download PRMBench (HF datasets), parse into {{question_id, step_text, label
           (correct/incorrect), error_axis (one of the 9 PRMBench categories)}}. Map PRMBench's
           step-correctness convention to a binary gold label faithfully; document it in `label_mapping_note`.
        2. Draw a balanced subset: N>=1000, n_incorrect>=100 (prefer ~45/55..55/45). Seed-controlled.
        3. FALLBACK (PRMBench unreachable): merge fover_corpus_v3 + fover_test_v3 + fover_train_v3 +
           fover_corpus_expanded.json into a deduped balanced set; error_axis=null. If merged incorrect
           count < 100, take the LARGEST balanced set available and record n_incorrect honestly (do NOT
           pad with synthetic items — the scissor will widen N or report INCONCLUSIVE downstream).
        4. Write data/step_error_balanced_v2.json + emit the result artifact. Validate every item is
           scoreable by loading 1 item through the exp2837 ensemble path.

      REQUIRED ARTIFACT FIELDS (each with a `principle` note; n_incorrect_steps is the GATE field):
        n_items: {{ principle: "Total corpus size; N>=1000 so downstream residual-catch CIs are not small-sample noise." }}
        n_incorrect_steps: {{ principle: "THE GATE field — emit as a BARE int (gated-fields-must-be-bare). The gold-incorrect set size; the scissor's residual is a SUBSET of this, so >=100 is required for a meaningful residual CI." }}
        incorrect_fraction: {{ principle: "Balance check — must be materially > the v4 corpus's 1.7% so a real residual set exists." }}
        primary_source: {{ principle: "prmbench | fover_v3_fallback — provenance + whether 9-axis labels are present." }}
        error_axis_coverage: {{ principle: "Which of the 9 PRMBench axes are represented (null for fover fallback) — enables exp3860's per-axis independence decomposition." }}
        label_mapping_note: {{ principle: "How PRMBench step-correctness mapped to the binary gold label — auditability." }}
        schema_compatible_with_2837: {{ principle: "Bare bool — confirms 1 item scored end-to-end through the frozen ensemble path." }}
        preconditions_checked: {{ principle: "Records source availability checked before building — pre-empts fabricating a corpus." }}
        random_seed: {{ principle: "Determinism for the balanced draw — a third party must reproduce the exact subset." }}
        reproducibility_checksum: {{ principle: "Content hash of (source, N, seed, balance) catches silent drift vs any replication." }}
        inference_substrate, duration_s: {{ principle: "aggregation substrate (no model loaded); real wall-clock of the ETL." }}

      ACCEPTANCE GATE:
        - complete (corpus built): n_items>=1000 AND n_incorrect_steps>=100 AND schema_compatible_with_2837==true.
          honest_verdict: `complete: balanced_step_error_corpus_v2_n<N>_nincorrect<K>_source<src>_9axis<bool>_schema_ok`
        - complete (best-effort fallback, smaller): PRMBench unreachable AND merged FoVer n_incorrect<100:
          `complete: balanced_corpus_v2_fover_fallback_n<N>_nincorrect<K>_below_target_scissor_will_widen_or_inconclusive`
        - honest_verdict MUST start with a terminal prefix or be `blocked_<resource>`.

      DISCIPLINE: do NOT synthesize/pad incorrect items. Do NOT touch the frozen ensemble. Emit
      n_incorrect_steps as a BARE int.
      Run: cd {project_root} && .venv/bin/python scripts/experiments/experiment_3858_build_balanced_step_error_corpus_v2.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3859-moat-scissor-at-scale-v3
    operator_override: >
      2026-06-05 operator directive (standing): re-issue of the .355 exp3847 scissor (which SKIPPED
      under the poison-test wipeout) AND legit continuation of the .354 exp3844 (which BLOCKED on a
      missing balanced corpus — an honest non-terminal state). The blocker is addressed by upstream
      exp3858; this re-runs the SAME measurement against the now-available corpus. requires_codex:
      live Qwen3.6-35B GGUF on the 3090; verdict is a deterministic CI gate.
    prior_failures:
