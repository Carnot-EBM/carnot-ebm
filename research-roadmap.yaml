        - {project_root}/scripts/experiments/experiment_value_q_head_v4.py (the SpatialValueNet 7.6x-offline routing positive) + experiment_value_q_head_v3.py (the position-preserving net)
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (E3AgentPolicy; value_weight=0.0 + the value_weight=5 REGRESSION comment ~line 60 -- the live depth-first explorer)
        - {project_root}/python/carnot/experiment_4545_cross_game_discrimination_v3.py (the LOO-AUROC 0.725 harness; per-game variance 0.379->1.0)

      TASK: a controlled three-arm experiment that ISOLATES the binding cause. Arm COMPUTE-COST: measure live
      solves/first-win at equal WALL-CLOCK vs equal NODE-BUDGET (if the value head wins at equal nodes but loses at
      equal wall-clock, compute-cost binds; fix = decision-point-only eval / cached features). Arm DISTRIBUTION-SHIFT:
      measure the value head's AUROC on WINNING-PATH states vs on OFF-PATH FRONTIER states the live search actually
      expands (if it is ~chance off-path, shift binds; fix = DAgger search-distribution retraining / use as bounded
      pruning). Arm CALIBRATION: measure the rank->cost calibration error (is the 0.725 ranking monotone in true
      steps-to-go; does an isotonic/Platt recalibration change the live routing?). Matched control = bare BFS + the
      value head as-is. Emit the BINDING cause + the indicated fix. verifier_is_oracle: false.

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
           b. `.venv/bin/python -c "from carnot.agentic.arc_value_learner import LearnedVerifier, cross_game_features_v3, collect_trajectory_data"` exits 0.
           ANY missing -> honest_verdict blocked_<resource>, populate preconditions_checked, EXIT. (--no-cov on focused pytest.)
        1. Build the three diagnostic arms (do NOT modify scripts/research_conductor.py): COMPUTE-COST (equal-wall-clock vs equal-node-budget on the clean-nav games where the value head wins offline), DISTRIBUTION-SHIFT (AUROC on winning-path vs live off-path frontier states), CALIBRATION (rank->cost monotonicity + an isotonic recalibration re-route). Use the existing SpatialValueNet (v3/v4) + cross_game_features_v3; do not invent a new representation.
        2. Run each arm with its matched control (bare BFS + value-head-as-is) over the public games x held-out variants. Record per-arm traceable evidence: node-count at equal wall-clock, off-path vs on-path AUROC delta, calibration error + post-recalibration routing change.
        3. POSITIVE CONTROL + FALSE_NEGATIVE_RISK: the bare-BFS arm IS the matched control. The DIAGNOSIS is valid only if the arms are separable on a corpus where the value head DOES win offline (else "no cause found" is uninformative -- confirm the offline win exists first; set positive_control_passed). Name the BINDING cause (or "inseparable / multi-cause" honestly) + the indicated fix for A2. Log the residual as a Missing-Verifier / bridge gap.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: bridge_cause_isolated_<compute|shift|calibration>_fix_identified OR complete: bridge_cause_inseparable_multi_cause_honest_residual_logged."
        inference_substrate:
          principle: "verifier_ensemble_against_cached_candidates -- offline value-head scoring + live-search arms over cached transitions (1s floor); if an LLM arm runs, declare live_llm_inference + the Qwen3.5-9B-MTP iGPU precondition (NEVER the 3090s)."
        verifier_is_oracle:
          principle: "MUST be false -- the SpatialValueNet is a learned value ranking states, oracle-DISTINCT from running the executable win-check."
        binding_bridge_cause:
          principle: "the HEADLINE -- which of {compute_cost, distribution_shift, calibration} binds (or 'inseparable_multi_cause'); the cause A2 fixes."
        compute_cost_evidence:
          principle: "value-head solves/first-win at equal NODE-budget vs equal WALL-CLOCK -- if it wins at equal nodes but loses at equal wall-clock, compute-cost binds."
        distribution_shift_evidence:
          principle: "the value head's AUROC on winning-path states vs on the live off-path frontier states it actually expands -- a large drop off-path means distribution-shift binds."
        calibration_evidence:
          principle: "rank->cost monotonicity + whether an isotonic/Platt recalibration changes the live routing -- a routing change from recalibration alone means calibration binds."
        indicated_fix:
          principle: "the concrete A2 fix the binding cause indicates (decision-point-only eval/cached features for compute-cost; DAgger search-distribution retraining/bounded-pruning for shift; isotonic calibration for calibration)."
        offline_win_confirmed:
          principle: "the POSITIVE CONTROL -- the value head DOES win offline on the diagnostic corpus (else 'no cause' is uninformative); a null is valid only if this passed."
        positive_control_passed:
          principle: "bare-BFS matched control ran AND the offline win exists; a no-separation null is valid only then (no broken-control / no-headroom trap)."
        false_negative_risk_checked:
          principle: "true with the matched control + offline-win confirmed -- a 'no cause found' null is valid only then."
        per_game_variance:
          principle: "the LOO-AUROC spread across games (0.379->1.0) -- whether the bridge cause is uniform or game-specific."
        residual_bridge_gaps:
          principle: "the Missing-Verifier / bridge gap logged for any cause not isolated -- the next-attack record."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "content-addressed hash catches silent harness/corpus drift on replay."
        preconditions_checked:
          principle: "records resources verified (offline arcade, value-learner importable); pre-empts missing-resource fabrication."

      Run: cd {project_root} && .venv/bin/python python/carnot/experiment_4616_offline_live_bridge_disambiguation.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

