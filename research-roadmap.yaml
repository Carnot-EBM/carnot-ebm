      TASK
      Build a bounded one-shot critical-variable enumeration control. Compare native exact search, random fixed subsets, and analytical fixed subsets. Enumerate the selected prefix once, hand every residual to the exact solver, and charge all selection and enumeration cost.

      CONCRETE STEPS
      0. Evaluate the Exp6507 gate. Record its path, hash, field, expected and observed values, solver versions, resources, and protected-file hashes.
