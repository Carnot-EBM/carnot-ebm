      - tests_or_checks_run: list (principle: formulaic verifier changes need execution evidence)
      - verified_count: int (principle: exact successes must be counted)
      - unresolved_count: int (principle: solver uncertainty must remain visible)
      - fallback_only_count: int (principle: fallback behavior must not be promoted as exact)
      - correction_sets: list (principle: solver feedback must localize failures)
      - spec_updates: list (principle: implementation changes must be spec-anchored)
      - model_specs: list (principle: if live LLM was used, mandated GGUFs must be recorded)
