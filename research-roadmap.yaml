- id: exp1561-kinetic-defense-zero-coupling-test
  milestone: 2026.05.120
  deliverable: results/experiment_1561_kinetic_defense_zero_coupling_test.json
  title: "Kinetic Defense Zero-Coupling Hamming-Distance Test - Gated on Exp1560"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 25
  priority: critical
  gated_on:
    - upstream: exp1560-119-completion-archive-120-activation
      gate_field: kinetic_defense_validation_ready
      expected_value: true
  prior_failures:
    - experiment_id: none
      verdict: novel_security_validation
      addressed_by: "First empirical test of kinetic-defense-in-depth
                     property — Glauber Gibbs plateau-friction as security
                     feature. Single fastest test in the milestone (10 min
                     compute); validates the most novel paper-v6
                     contribution before scaling commits."
  prompt: |
    Per Deep Think DT-MCMC-NULL verdict (docs/research-notes/iclr26-
    deep-think-responses.md): Glauber Gibbs's algorithmic inefficiency
    on flat plateaus acts as kinetic defense-in-depth against null-space
    mimicry attacks on AND-composed verifier ensembles. Single-site MH
    explores plateaus 2× faster than Gibbs, amplifying adversarial
    null-space concentration.

    This experiment empirically validates the predicted hitting-time
    differential.

    SETUP (per DT-MCMC-NULL falsifiable predicate):
    - n=64 binary Ising representing k=15 AND-composed verifiers
    - 15 independent structural blocks of 4 bits each
    - E(y) = -10 · Σ_{i=1..15} 1{block_i = target}
    - Remaining 4 bits free → planted null space N of size 2^4 at global
      minimum
    - Initialize 10,000 chains at y_0 = {0}^64 (all verifiers unmet)

    SAMPLERS (run side-by-side at t=1.0):
    (a) Carnot's current single-site Glauber Gibbs (python/carnot/sampling/gibbs.py)
    (b) THRML 0.1.3 block-Gibbs (vendored if exp1564 ran first;
        otherwise via direct THRML import)
    (c) Algorithm 1 single-site Metropolis-Hastings (uniform proposal,
        Metropolis acceptance) as reference

    MEASUREMENTS at K ∈ {10, 50, 100, 500, 1000} sweeps:
    - Mean hitting time: first sweep at which any chain reaches y ∈ N
    - P_chain^(K)(N): fraction of 10,000 chains hitting N at each K
    - Per-sample energy distribution

    ACCEPTANCE GATE (predicted by DT-MCMC-NULL):
    - MH hitting time ≈ 21.3 steps/block → fast convergence on N
    - Single-site Gibbs ≈ 32.9 steps/block → 50% slower than MH
    - THRML block-Gibbs hitting time ≥ single-site Gibbs hitting time
      (per-bit randomization rate identical; block parallelism is
      compute speed only)

    FALSIFICATION TRIGGER: if THRML block-Gibbs hits N at MH-class
    rates, the parallel-block-update structure creates a new attack
    surface. Document and propose mitigation. Otherwise: kinetic-
    defense-in-depth validated as paper-v6 contribution.

    Write deliverable with status="complete" and honest_verdict prefixed
    with "complete:" / "complete_" / etc per Verdict Terminal-Prefix
    Discipline. Required fields:
    - kinetic_defense_in_depth_validated: bool
    - mh_hitting_time_steps_per_block: float
    - single_site_gibbs_hitting_time_steps_per_block: float
    - thrml_block_gibbs_hitting_time_steps_per_block: float
    - thrml_security_parity_with_single_site_gibbs: bool
    - p_n_at_k100_mh: float
    - p_n_at_k100_single_site_gibbs: float
    - p_n_at_k100_thrml_block_gibbs: float

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1562-brain-linear-ar-k-sweep-extended
  milestone: 2026.05.120
  deliverable: results/experiment_1562_brain_linear_ar_k_sweep_extended.json
  title: "BRAIN+Linear-AR Extended k-Sweep (k ∈ {4,8,12,15}) - Gated on Exp1560"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 60
