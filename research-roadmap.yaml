  # ---- Continuous self-learning: does the at-risk grounding cause collapse? ----
  - id: exp3452-fr11-grounding-collapse-stress-test-v1
    operator_override: "2026-05-30 planner (Opus 4.8): the mandatory continuous-self-learning task. exp3439 (.317) measured the verifier ensemble's joint null space at-risk (lambda_min~0, eff-k 3.54). This task tests the CONSEQUENCE never tested: does a self-improvement (FR-11) loop driven by that at-risk grounding actually mode-collapse onto the null space (self-distillation collapse) or improve? A new question (collapse-under-measured-low-diversity), not a re-run of any FR-11 artifact. scope-match vs prior fr11 tasks is the intended continuation with a new grounding-collapse hypothesis."
    prior_failures:
      - experiment_id: exp3414-fr11-adversarial-robustness
        verdict: "success: fr11 metrics enabled and processed successfully"
        addressed_by: "exp3414 verified FR-11 metrics processing. This task asks a different question: feed the FR-11 self-improvement loop with the at-risk grounding signal measured in exp3439 (lambda_min~0) and measure whether the latent distribution COLLAPSES (entropy drop, mode-collapse onto the verifier null space) over iterations vs an entropy-regularized control. Tests the Q12 'Dark Room' / Hypothesis-B failure mode on real cached traces."
        retire_if_same_verdict: false
    milestone: "2026.05.318"
    title: "FR-11 grounding-collapse stress test — does at-risk diversity cause self-distillation collapse?"
    priority: high
    max_turns: 50
    agent_type: claude
    requires_claude: true   # gemini-cli is DOWN (.315/.316); cached-trace self-learning loop + judgment on the collapse vs control framing; claude is the only landing backend.
    estimated_wall_time_min: 25
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: "results/experiment_3452_fr11_grounding_collapse_stress_test_v1.json"
    prompt: |
      CONTEXT: The self-learning thesis (PRD FR-11 / continuous self-learning) rests
      on alpha_t grounding — the verifier signal that keeps a self-correcting model
      from collapsing onto its own null space (Zenil alpha_t; Q12 Dark Room /
      Hypothesis-B). exp3439 (.317) measured the production ensemble's joint null
      space AT-RISK: lambda_min(Sigma)~0, effective-k 3.54, null_space_collapse_
      confirmed. The CONSEQUENCE has never been tested: does an FR-11 self-improvement
      loop driven by that at-risk grounding actually mode-collapse, or does the
      residual eff-k 3.5 diversity hold the line? This is the milestone's mandatory
      continuous-self-learning experiment, run on cached traces (no live model -> no
      timeout).

      EXISTING CODE TO READ FIRST:
        - results/experiment_3439_verifier_ensemble_lambda_min_diversity_audit_v3.json (the at-risk grounding)
        - results/experiment_3414_fr11_adversarial_robustness.json + experiment_3410_fr11_updates_spills.json (FR-11 machinery)
        - python/carnot/ (the FR-11 controller-memory / self-learning module)
        - project_q12_hypothesis_b_and_dark_room (memory) + project_zenil_alpha_grounding (memory) — the theory

      TASK: Run a small FR-11 self-improvement loop over cached traces under TWO arms
      and measure whether the latent/answer distribution collapses.

      PRECONDITIONS (step 0):
        a. FR-11 self-learning module + cached traces present. If not ->
           complete: blocked_fr11_module_or_traces_unavailable.
        b. The verifier ensemble (at-risk grounding) is callable. If not ->
           complete: blocked_verifier_suite_uncallable.

      CONCRETE STEPS:
        1. ARM A (control): an FR-11 self-improvement loop over the cached traces with
           NO entropy regularization (the bare at-risk grounding from exp3439).
        2. ARM B (treatment): the same loop WITH entropy/diversity regularization (the
           Q12 Dark-Room antidote).
        3. Over N iterations, track per-arm: the output/latent distribution entropy,
           a mode-collapse indicator (fraction of mass on the top mode), and the
           verifier-pass rate. Collapse = entropy monotonically dropping + mass
           concentrating while pass-rate rises (gaming the null space).
        4. Report whether ARM A collapses and whether ARM B prevents it.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="complete:/success:/passed:/shipped_ prefix."
        inference_substrate: value=verifier_ensemble_against_cached_candidates
        n_iterations: principle="self-improvement iterations per arm."
        arm_a_final_entropy: principle="control (no regularization) final output entropy."
        arm_b_final_entropy: principle="treatment (entropy-regularized) final output entropy."
        arm_a_mode_collapse_detected: principle="boolean: control collapsed onto the null space (the Dark-Room failure)."
        arm_b_mode_collapse_detected: principle="boolean: treatment collapsed despite regularization."
        grounding_collapse_consequence: principle="honest string: does the exp3439 at-risk grounding cause collapse in the loop, and does regularization prevent it?"
        random_seed: principle="determinism."
        reproducibility_checksum: principle="content hash."
        duration_s: principle="cached-trace loop; 1s floor."

      ACCEPTANCE GATES:
        - condition: "arm_a_mode_collapse_detected and not arm_b_mode_collapse_detected"
          principle: "G1 COLLAPSE-CONFIRMED-AND-CURABLE: the at-risk grounding does cause self-distillation collapse AND entropy regularization is the antidote — actionable for the self-learning design."
        - condition: "not arm_a_mode_collapse_detected"
          principle: "G1' GROUNDING-HOLDS: the residual eff-k 3.5 diversity is enough; collapse does NOT occur even with the at-risk lambda_min — a reassuring honest negative."

      TERMINAL VERDICTS (all start with complete:):
        - arm A collapses, arm B does not -> "complete: at_risk_grounding_causes_collapse_entropy_reg_prevents_it"
        - arm A does not collapse -> "complete: residual_diversity_holds_no_collapse_in_fr11_loop"
        - both collapse -> "complete: collapse_not_prevented_by_entropy_reg_grounding_insufficient"
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3452_fr11_grounding_collapse_stress_test_v1.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

