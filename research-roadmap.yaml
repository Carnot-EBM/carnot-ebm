    (cached_sota_pair() pattern)\n  {project_root}/python/carnot/verify/semantic_energy.py
    (SemanticEnergy.score for energy computation)\n  {project_root}/results/experiment_2487_phase4_qwen_prc_divergence.json
    (prior attempt — note the mock_model disclosure)\n\nTASK: Generate PRC and neutral responses
    with REAL GGUF; test Carnot energy divergence.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS
    (check ALL before any inference — failure exits with blocked_* verdict):\n     a. Check for
