- id: exp586-symbolic-kan-energy
  milestone: 2026.04.44
  deliverable: results/experiment_586_symbolic_kan_energy.json
  title: 'Exp 586: Symbolic-KAN Energy Interpretability — Interpretable Constraint
    Rules (arXiv 2603.23854)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2603.23854\
    \ (Symbolic-KAN, March 2026) replaces KAN's continuous spline activations with\
    \ discrete symbolic equations. The result is a human-readable energy function:\
    \ instead of opaque splines, users see 'constraint fires when a + b ≠ c'. This\
    \ directly addresses a long-standing opacity problem — Carnot's users cannot currently\
    \ understand WHY the pipeline flags a response. Symbolic-KAN makes the energy\
    \ function interpretable. Filed in research-references.md since .43 planning,\
    \ not yet implemented. CPU-only.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/models/kaem_energy.py\
    \ — KAEMEnergy (Exp 447, the spline-based KAN energy tier we are extending)\n\
    - python/carnot/models/__init__.py — exports to add SymbolicKANEnergy\n- results/fover_corpus_v2.json\
    \ — 132-pair corpus (use for fitting symbolic functions)\n\nTASK: Implement SymbolicKANEnergy\
    \ — a KAN energy tier with interpretable symbolic activations.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Add REQ-MODEL-020 (SymbolicKANEnergy: KAN with discrete\
    \ symbolic activations for interpretable constraint rules), REQ-MODEL-021 (formula_export:\
    \ human-readable formula string per activation), SCENARIO-MODEL-030/031/032 to\
    \ training-inference/spec.md.\n3. Create python/carnot/models/symbolic_kan_energy.py:\n\
    \   a. SymbolicActivationType = Literal['linear', 'quadratic', 'tanh', 'relu',\
    \ 'abs'].\n   b. SymbolicActivation dataclass: activation_type (SymbolicActivationType),\
    \ coefficient (float), bias (float), formula_str (str). formula_str auto-generated:\
    \ e.g. '2.3 * x + 1.1' for linear, '1.5 * x^2' for quadratic.\n   c. SymbolicKANLayer\
    \ class:\n      - __init__(self, n_vars: int, activation_candidates: list[SymbolicActivationType])\n\
    \      - fit_activation(self, x_data: jnp.ndarray, y_data: jnp.ndarray) -> SymbolicActivation:\n\
    \          Try each activation type; select by minimum MSE on (x_data, y_data).\n\
    \      - forward(self, x: jnp.ndarray) -> jnp.ndarray: apply fitted activations\
    \ per variable.\n      - get_formula(self) -> str: return human-readable formula\
    \ string joining all per-variable formulas.\n   d. SymbolicKANEnergy class:\n\
    \      - __init__(self, n_vars: int, n_layers: int = 2)\n      - energy(self,\
    \ x: jnp.ndarray) -> float: sum of symbolic layer outputs.\n      - fit(self,\
    \ X: jnp.ndarray, y: jnp.ndarray) -> None: fit each layer sequentially.\n   \
    \   - explain(self) -> str: return full symbolic formula (e.g. 'E(x) = 2.1*x1\
    \ + 0.8*x2^2 + tanh(1.3*x3)').\n      - energy_interpretable: True (class attribute).\n\
    \   e. Export SymbolicKANEnergy, SymbolicActivation from carnot.models.__init__.\n\
    4. Write scripts/experiment_586_symbolic_kan_energy.py:\n   a. apply_env_autofix()\
    \ FIRST.\n   b. ExperimentTimeoutWatchdog(586, timeout_minutes=20).\n   c. ExperimentTemplate(586,\
    \ 'Symbolic-KAN Energy',\n      'results/experiment_586_symbolic_kan_energy.json',\
    \ requires_gpu=False).\n   d. Generate 200 synthetic (x, y) pairs from a simple\
    \ constraint function: E(x1,x2) = |x1+x2-1| (absolute constraint violation).\n\
    \   e. Fit SymbolicKANEnergy on 160 train pairs, validate on 40.\n   f. Call explain().\
    \ Check if 'abs' or 'tanh' appears in formula (should capture |x1+x2-1|).\n \
    \  g. Compare MSE vs KAEMEnergy on same data.\n   h. Build artifact: schema='carnot.symbolic_kan.v1',\n\
    \      n_vars=2, n_train=160, n_val=40,\n      symbolic_formula=<str from explain()>,\n\
    \      symbolic_mse=<float>, kaem_mse=<float>,\n      formula_interpretable=True,\n\
    \      honest_verdict='symbolic_viable' if symbolic_mse <= kaem_mse * 1.5 else\
    \ 'symbolic_accuracy_loss'.\n   i. tmpl.assert_deliverable_written() as FINAL\
    \ LINE.\n5. Write tests/python/test_symbolic_kan_energy.py (100% coverage on symbolic_kan_energy.py):\n\
    \   a. Test SymbolicActivation.formula_str for each type.\n   b. Test fit_activation\
    \ selects 'linear' for linear data.\n   c. Test forward() matches expected output.\n\
    \   d. Test explain() returns non-empty string.\n   e. 100% coverage.\n6. Run:\
    \ JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile: _bmad/traceability.md,\
    \ _bmad/architecture.md (add Symbolic-KAN tier), ops/conductor-log.md, ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT\
    \ modify scripts/research_conductor.py.\n"

- id: exp587-dsvd-adapter
  milestone: 2026.04.44
  deliverable: results/experiment_587_dsvd_adapter.json
  title: 'Exp 587: DSVD Dynamic Self-Verify Decoding Adapter — Mid-Generation Detection
    (arXiv 2503.03149)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2503.03149\
    \ (DSVD — Dynamic Self-Verify Decoding, EMNLP 2025) detects hallucinations in\
    \ real-time via hidden-state analysis during generation and applies dynamic rollback.\
    \ Carnot's current verify-repair is purely post-hoc (generate full response,\
    \ then check). DSVD shows that mid-generation detection is practical and more\
    \ precise. This experiment implements a lightweight CPU prototype: a linear probe\
    \ on FOVER corpus embeddings that predicts violation probability from hidden-state\
    \ features at step boundaries. If AUC > 0.60, this validates inserting DSVD as\
    \ Tier 2.5 between EORM and CoACEExtractor.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (understand\
    \ Tier 2 → Tier 3 gap)\n- _bmad/architecture.md — verification cascade table\
    \ (Tiers 0a through 3)\n- results/fover_corpus_v2.json — 132-pair corpus with\
    \ cot_steps and is_correct labels\n- python/carnot/models/eorm_model.py — EORMModel\
    \ (Tier 2, step-level scoring — DSVD is different but related)\n\nTASK: Implement\
    \ DSVDAdapter — lightweight hidden-state verification probe.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Add REQ-VERIFY-114 (DSVDAdapter: mid-generation arithmetic\
    \ violation probability from hidden-state features), SCENARIO-VERIFY-132/133/134\
    \ to verifiable-reasoning/spec.md.\n3. Create python/carnot/pipeline/dsvd_adapter.py:\n\
    \   a. DSVDProbeResult dataclass: step_idx (int), violation_probability (float),\
    \ step_text (str), feature_norm (float), detector_mode (str).\n   b. DSVDLinearProbe\
    \ class:\n      - __init__(self, hidden_dim: int = 64)\n      - _extract_features(step_text:\
    \ str) -> jnp.ndarray:\n          Compute simple text features: [len(step_text),\
    \ n_numbers, n_operators, char_entropy].\n          Project to hidden_dim via\
    \ random init (no GPU needed — random projection).\n      - fit(self, steps: list[str],\
    \ labels: list[float]) -> None:\n          Logistic regression on features.\n\
    \      - predict(self, step_text: str) -> float:\n          Return sigmoid(probe_weights\
    \ @ features) — violation probability.\n      - score(self, step_text: str) ->\
    \ DSVDProbeResult:\n          CI-safe: return DSVDProbeResult with detector_mode='linear_probe'.\n\
    \   c. DSVDAdapter class:\n      - __init__(self, probe: DSVDLinearProbe, violation_threshold:\
    \ float = 0.5)\n      - verify_step(self, step_text: str) -> DSVDProbeResult.\n\
    \      - verify_chain(self, cot_steps: list[str]) -> list[DSVDProbeResult].\n\
    \      - n_violations(self, results: list[DSVDProbeResult]) -> int:\n         \
    \ count results where violation_probability > self.violation_threshold.\n   d.\
    \ Export DSVDAdapter, DSVDLinearProbe, DSVDProbeResult from carnot.pipeline.__init__.\n\
    4. Write scripts/experiment_587_dsvd_adapter.py:\n   a. apply_env_autofix() FIRST.\n\
    \   b. ExperimentTimeoutWatchdog(587, timeout_minutes=20).\n   c. ExperimentTemplate(587,\
    \ 'DSVD Adapter',\n      'results/experiment_587_dsvd_adapter.json', requires_gpu=False).\n\
    \   d. Load 132-pair corpus from fover_corpus_v2.json.\n   e. Extract (cot_steps,\
    \ is_correct) pairs. Label each step from its chain's is_correct label.\n   f.\
    \ 80/20 split by question_id.\n   g. Fit DSVDLinearProbe on train steps.\n   h.\
    \ Predict violation probability on val steps.\n   i. Compute AUC-ROC (is_correct=False\
    \ = positive class).\n   j. Compare to CoACEExtractor v1 baseline AUC on same\
    \ steps (use CoACEExtractor.extract for binary flagged/not).\n   k. tier_2_5_viable\
    \ = dsvd_auc > 0.60.\n   l. Build artifact: schema='carnot.dsvd_adapter.v1',\n\
    \      n_train_steps=<int>, n_val_steps=<int>,\n      dsvd_auc=<float>, coace_v1_auc=<float>,\n\
    \      tier_2_5_viable=<bool>,\n      honest_verdict='tier_2_5_viable' if tier_2_5_viable\
    \ else 'tier_2_5_below_threshold'.\n   m. tmpl.assert_deliverable_written() as\
    \ FINAL LINE.\n5. Write tests/python/test_dsvd_adapter.py (100% coverage on dsvd_adapter.py):\n\
    \   a. Test _extract_features returns jnp.ndarray of shape (hidden_dim,).\n  \
    \ b. Test predict() returns float in [0,1].\n   c. Test verify_chain() returns\
    \ list of DSVDProbeResult.\n   d. Test n_violations counts correctly.\n   e. CI-safe:\
    \ test score() returns DSVDProbeResult with detector_mode='linear_probe'.\n  \
    \ f. 100% coverage.\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    7. Reconcile: _bmad/architecture.md (Tier 2.5 DSVD entry in cascade table), _bmad/traceability.md,\
    \ ops/conductor-log.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

