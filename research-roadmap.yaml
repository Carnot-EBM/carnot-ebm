- id: exp7477-native-readout-pilot
  title: Measure native Qwen option transport before source capture
  phase: 1
  track: verification
  priority: high
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 30
  per_unit_rows: true
  milestone: 2026.09.655
  deliverable: results/experiment_7477_v655_native_readout_pilot.json
  inference_substrate_class: model_load_no_generation
  prior_failures:
  - experiment_id: exp7463-semif-e0-logprob-parity
    verdict: complete_scored_runtime_unavailable_local_parity_null
    addressed_by: Use one native GGUF runtime for transport only; no cross-runtime equivalence assumption and
      no unchanged Blackwell probe.
    retire_if_same_verdict: true
  gated_on:
  - upstream: exp7476-option-qualification
    artifact_field: option_protocol_ready_score
    op: ==
    value: 1
  - upstream: exp7476-option-qualification
    artifact_field: verdict_class
    op: in
    value:
    - 'null'
    - positive
    - circular_positive
  - upstream: exp7476-option-qualification
    artifact_field: flagged_adversarial
    op: ==
    value: false
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.655. Exp7463 qualified native readout but cross-runtime parity failed its registered lower confidence bound: 63/64 agreements, Wilson lower 0.928. Scored runtime was unavailable. This study uses one authenticated native runtime and makes no server or Blackwell parity claim.
    Hypothesis: A bounded no-generation pilot can establish raw-logit transport and per-prompt cost without making predictive accuracy a prerequisite for measuring the model.

