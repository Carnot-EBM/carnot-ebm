             - Arm B (the verifier): demo-fit selection -- execute each candidate on the VISIBLE
               example tests in the restricted namespace, keep the demo_perfect ones (pass ALL
               visible tests), rerank/select among them (the model-free execution verifier).
           Measure held-out HIDDEN-test pass@1/pass@2 for A, A++, B. Compute the bootstrap CI95 of
           (B - A). Compute the oracle/best-of-pool hidden pass-rate (the POSITIVE CONTROL).
           Emit results/experiment_4032_offarc_exec_verifier_transfer_raw.json with model_specs,
           random_seed, reproducibility_checksum, truncation_rate (generation-eval truncation guard).
        2. SMOKE the runner on 2 tasks (assert it produces a well-formed raw artifact); commit the runner.
        3. LAUNCH the full run BACKGROUNDED (nohup python ... > logs/offarc_transfer_run.log 2>&1 &),
           record the PID, and EXIT. Do NOT hold the agent open for the full run.
