        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The public ARC solve registry is complete. V555 must not solve another public game. Exp6434 attempted a generic state-key reachability A/B but left a zero-byte artifact after a hard wall-clock failure. The Objective Is the Bottleneck suggests separating state representation from policy objective. This changed recovery uses bounded shards and measures held live-policy decisions only. It makes no game or level solve claim. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md, including ARC Live-Path Reachability Discipline
      - {project_root}/ops/arc_solve_registry.yaml and current live-path registry checks
      - {project_root}/results/experiment_6434_arc_state_key_reachability_ab.json, its source, tests, checkpoints, and Exp6435 capstone findings
      - the ARC live E3AgentPolicy, state-key, frontier, feature-router, legal-action, and reachability code under {project_root}/python/carnot
      - relevant immutable runtime observation and action traces; do not read game source
      - the V555 Objective Is the Bottleneck entry in {project_root}/research-references.md
      - relevant ARC OpenSpec files, {project_root}/scripts/arc_orphan_solver_lint.py, and {project_root}/ops/e2e-test-plan.md

      TASK
      Measure whether a generic collision-certified state suffix and a reachability-aware objective improve held live-policy decisions. Compare representation and objective interventions separately. Use disjoint tuning and held rosters, bounded CPU shards, atomic checkpoints, and resume. Do not claim or attempt a game or level solve.

      CONCRETE STEPS
      0. PRECONDITIONS: run the registry precheck, confirm the task makes no solve claim, hash the unchanged registry, require canonical adapter-bypassed live-path imports, readable observation/action traces, no game-source access, no per-game adapters, a monotonic clock, writable atomic checkpoints, and explicit shard budgets.
      1. Add ARC representation-objective generalization REQ-* and SCENARIO-* before implementation. Write focused tests first.
      2. Freeze disjoint tuning and held game rosters by hash. Tune only generic suffix thresholds and objective weights on the tuning roster.
      3. Define four matched arms: current state key plus current objective; collision-certified suffix plus current objective; collision-certified suffix plus reachability-aware objective; and suffix plus shuffled-objective placebo.
      4. Use only observations and actions available to the live policy. Do not read game source, run offline ground-truth BFS, inject hidden state, create a GameAdapter, or use outer-loop reverse engineering.
      5. Run bounded per-roster and per-seed CPU shards. Cap each shard, checkpoint atomically after every cell, print progress, resume completed cells without repetition, and always write a terminal partial or complete artifact.
      6. Emit per_unit_rows for every held game, trace prefix, seed, arm, state collision, legal-action set, chosen action, recorded next-state reachability, policy influence, state count, action cost, timeout, and checkpoint receipt.
      7. Recompute collision rate, legal-action coverage, held next-state reachability, policy choice changes, action cost, regressions, timeout rate, and paired effects from rows.
      8. Record no_game_or_level_solve_claim=true, solve_registry_unchanged=true, game_source_access_count=0, offline_ground_truth_bfs_count=0, and per_game_adapter_count=0. Do not add solve_provenance because no solve is claimed.
      9. Attack tuning-held leakage, source access, adapter use, oracle next-state access before action, registry mutation, completed-cell repetition, checkpoint truncation, placebo bias, timeout exclusion, and aggregate-row mismatch.
      10. Run focused tests, ARC live-path and orphan-solver lints, E2E checks, spec coverage, row consistency, current adversarial verification, determination preservation, and root-clutter checks.
      11. Set arc_objective_generalization_ready_score=1.0 only if the combined generic suffix and objective reduces collisions and improves held reachability or legal policy choice over both single-change arms, does not regress the frozen safety roster, all claims recompute from held rows, provenance boundaries pass, a nonzero held sample completes, and critical findings are zero.

      Required deliverable: {project_root}/results/experiment_6458_arc_representation_objective_generalization_ab.json.
