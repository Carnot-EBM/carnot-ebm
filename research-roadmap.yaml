       EBT 2507.02092 and ARM-EBM 2512.15605.
    3. Record direct URLs, dates, abstracts or method facts, code availability,
       and relevance. Separate peer-reviewed work, preprints, vendor claims,
       product pages, and repository discovery.
    4. Recheck these mandated repositories without downloading:
       unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and
       unsloth/gemma-4-26B-A4B-it-GGUF. Record exact cached file candidates,
