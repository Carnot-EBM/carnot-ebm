# - GEMINI_FORCE_EXPERIMENTS=1 still active until 2026-05-18 8:20 PM

scope_reduction_compliance:
  - "5 tasks total (4 research/ship + 1 retro); not the 13-14 synthesis pattern"
  - "Two build-on-real-findings tasks: exp1681 Phase 4 scaling sweep, exp1682 THRML systematic bias investigation"
  - "One Phase 1 ship-track task (exp1683 PyPI publish smoke) — overdue per the 1-per-3-milestones discipline"
  - "exp1680 PolarFire retry uses shorter prompt + smaller corpus to avoid the gemini-CLI-stall pattern that killed exp1675"
  - "All compute-bound tasks include random_seed + reproducibility_checksum + n_samples justification"

tasks:
  - id: exp1680-polarfire-verifier-smoke-v2
    title: "Exp 1680: PolarFire SoC verifier smoke v2 — minimal-deps retry"
    deliverable: results/experiment_1680_polarfire_smoke_v2.json
    agent_type: codex
    max_turns: 60
    prior_failures:
      - experiment_id: exp1675-polarfire-verifier-sovereignty-smoke
        verdict: gemini_cli_stall
        addressed_by: "exp1675 stalled 3× on the gemini CLI (600s silence) before retire. Hypothesis: the very long task prompt + complex multi-step install/scp/ssh sequence triggered the bail-out. v2 uses shorter prompt, smaller corpus (n=10 instead of n=30), and runs ONE narrow check at a time: install pure-Python carnot subset, run a single verifier call locally on board, report latency + correctness."
        retire_if_same_verdict: true
    prompt: |
      MANDATORY WORKFLOW: read CLAUDE.md (Decentralization rule 5;
      Adversarial Verification + Sample-Size Rigor).

      CONTEXT (falsifiable hypothesis): Carnot's pure-Python verifier
      subset (no torch / no jax / no llama-cpp deps) can be installed
      on the PolarFire SoC RISC-V Linux and run a single verifier
      check on a 10-example FoVer-or-equivalent corpus with TPR within
      10 percentage points of the x86 baseline.

      EXISTING CODE: python/carnot/verify/ (find a pure-Python
      verifier entry point that doesn't import torch/jax).

      CONCRETE STEPS (SHORTER than exp1675 — avoid the stall):
      1. `ssh polarfire 'cat /etc/os-release'` to confirm access.
      2. Pick ONE pure-Python verifier (e.g. semantic_grounding or
         z3-based — avoid GPU-dependent imports). Build a minimal
         tarball of just that verifier + its dependencies.
      3. scp the tarball to polarfire:/tmp/, extract, install with
         pip3 install --user.
      4. Run on 10 examples. Capture TPR + per-example latency.
      5. Read /sys/class/thermal/thermal_zone*/temp during the run.
      6. Write artifact with REQUIRED ARTIFACT FIELDS:
         - schema: "carnot.polarfire_sovereignty_smoke.v2"
         - n_examples: 10
         - n_samples: 10
         - n_samples_justification: "smoke test; n=10 is small for
           TPR claim but suffices for binary go/no-go"
         - random_seed: <int>
         - reproducibility_checksum: <hash>
         - install_succeeded: <bool>
         - tpr_observed: <float>
         - per_example_latency_ms_p50: <float>
         - soc_temp_max_c: <float|null>
         - thermal_note: "passively cooled"
         - run_duration_s: <int>
         - actual_agent_backend: "<gemini|codex|claude>"
         - acceptance_gate_passed: <bool> (install_succeeded AND
           tpr_observed >= 0.10 AND latency_p50 < 10000)
         - honest_verdict: prefix "complete:" or "shipped:".

      Run command. Do NOT push.

  - id: exp1681-phase4-active-inference-scaling-sweep
    title: "Exp 1681: Phase 4 active inference scaling sweep — n=8/16/32"
    deliverable: results/experiment_1681_phase4_scaling.json
    agent_type: codex
    max_turns: 100
    prior_failures:
      - experiment_id: exp1678-phase4-active-inference-v3
        verdict: "complete: successfully validated delta_alpha > 0.05 for k=6 vs k=1 verifiers"
        addressed_by: "exp1678 validated delta_alpha at n=8. v1681 scales to n=16 and n=32 to check whether alpha_t > 0 condition holds at larger substrate sizes, which is the prerequisite for Phase 3 substrate viability. Same falsifiable hypothesis structure; new scale dimension."
        retire_if_same_verdict: false
    prompt: |
      MANDATORY WORKFLOW: read CLAUDE.md (Adversarial Verification +
      Sample-Size Rigor); reference exp1678's success at n=8.

      CONTEXT (falsifiable hypothesis): exp1678 showed delta_alpha=0.150
      at n=8 (k=6 vs k=1 verifier ensembles, 100 MLD steps). This task
      scales the experiment to n=16 and n=32. Hypothesis: delta_alpha
      remains > 0.05 at both scales, OR if it collapses, the collapse
      scale itself is a finding (would inform Phase 3 substrate sizing
      constraints).

      EXISTING CODE: same as exp1678 (verifier ensemble + MLD sampler).

      CONCRETE STEPS:
      1. For n in [8, 16, 32]: run 100 MLD steps with k=6 and k=1
         ensembles. Same beta, same J distribution shape (scaled to n).
         Distinct seeds per n.
      2. Compute inf_t_alpha_k6[n], inf_t_alpha_k1[n], delta_alpha[n].
      3. Plot or tabulate the scaling: does delta_alpha decrease as n
         grows? Is there a critical n where k=6 also collapses?
      4. ACCEPTANCE GATE (any of these constitutes a finding):
         - delta_alpha[16] > 0.05 AND delta_alpha[32] > 0.05 (full
           scaling success)
         - OR delta_alpha[16] > 0.05 AND delta_alpha[32] < 0.05 (collapse
           between 16 and 32; documented finding)
         - OR delta_alpha[16] < 0.05 (collapse between 8 and 16;
           documented finding)
         All three are valid scientific outcomes. Gate failure is only
         if delta_alpha[8] < 0.05 (contradicting exp1678; would be a
         reproducibility crisis).
      5. Write artifact with REQUIRED ARTIFACT FIELDS:
         - schema: "carnot.phase4_active_inference_scaling.v1"
         - n_values: [8, 16, 32]
         - mld_steps: 100
         - n_samples_per_n: 100
         - n_samples_justification: "100 MLD steps per Zenil; for
           scaling the question is the trajectory's inf_t, not chain
           convergence"
         - random_seeds: [n_8_seed, n_16_seed, n_32_seed]
         - reproducibility_checksum: <hash>
         - inf_t_alpha_k6: [<float>, <float>, <float>]
         - inf_t_alpha_k1: [<float>, <float>, <float>]
         - delta_alpha: [<float>, <float>, <float>]
         - collapse_scale: <int|null>  # smallest n where k=6 also collapses
         - optimization_direction: "track minimum"
         - actual_agent_backend: "<gemini|codex|claude>"
         - methodology_note: "exp1678 baseline at n=8 was delta_alpha=0.150.
           If v1681 reproduces this at n=8 to within 10%, the
           methodology is sound."
         - acceptance_gate_passed: <bool>
         - honest_verdict: prefix "complete:" or "success:".

  - id: exp1682-thrml-systematic-bias-investigation
    title: "Exp 1682: THRML/Carnot joint bias investigation — varied beta sweep"
    deliverable: results/experiment_1682_thrml_bias.json
    agent_type: codex
    max_turns: 100
    prior_failures:
      - experiment_id: exp1677-thrml-parity-v3-curie-weiss
        verdict: "complete: thrml_parity_cw_v3_passed"
        addressed_by: "exp1677 showed BOTH Carnot AND THRML underestimate analytic_mean=0.6587 at beta=1.2*beta_c on n=128 Curie-Weiss (carnot 0.6187, thrml 0.6207 — joint underestimate by ~0.04). This v1682 investigates whether this is finite-N bias (would shrink with N→infinity) or systematic methodology error (would persist or grow with beta). Different falsifiable question; not a retry."
        retire_if_same_verdict: false
    prompt: |
      MANDATORY WORKFLOW: read CLAUDE.md (Adversarial Verification +
      Sample-Size Rigor). Reference exp1677's joint underestimate
      finding.

      CONTEXT (falsifiable hypothesis): the ~0.04 joint underestimate
      that exp1677 found is finite-N bias (i.e., shrinks as N grows)
      rather than systematic methodology error (i.e., persists or
      depends on beta). At n=128 Curie-Weiss, sample N=10000 was the
      smoothing budget for KL; for the MEAN estimator, true bias and
      sample variance separate as N grows. This task sweeps two
      dimensions:
      (a) N in [10000, 30000, 100000] at beta=1.2*beta_c
      (b) beta in [1.05*beta_c, 1.2*beta_c, 1.5*beta_c] at N=10000

      If the bias shrinks ~1/sqrt(N) along (a), it's finite-N. If it
      stays roughly constant along (a) but varies along (b), it's
      systematic (related to thermalization or coupling). If it stays
      constant along both, methodology has an unaccounted-for bias
      that needs paper-v6 §6 disclosure.

      EXISTING CODE: same as exp1677.

      CONCRETE STEPS:
      1. Fix the n=128 Curie-Weiss substrate (same J, h=0).
      2. Sweep (a): for N in [10000, 30000, 100000], run Carnot
         sampler. Compute empirical_mean[N], bias[N] = empirical -
         analytic.
      3. Sweep (b): for beta in [1.05*beta_c, 1.2*beta_c, 1.5*beta_c],
         run Carnot at N=10000. Compute empirical_mean[beta], bias[beta].
      4. Fit bias[N] vs 1/sqrt(N). Slope tells us if finite-N (slope
         ~analytic_mean/sqrt(N)) or systematic (slope ~0).
      5. ACCEPTANCE GATE: produce both sweep tables AND a fit verdict
         (finite_n / systematic / mixed). No pass/fail on the FINDING
         itself — all three outcomes are valid science.
      6. Write artifact with REQUIRED ARTIFACT FIELDS:
         - schema: "carnot.thrml_parity_bias_investigation.v1"
         - n_spins: 128, J, beta_c
         - sweep_a_N: [10000, 30000, 100000]
         - sweep_a_bias: [<float>, <float>, <float>]
         - sweep_b_beta: [1.05, 1.2, 1.5] (factors of beta_c)
         - sweep_b_bias: [<float>, <float>, <float>]
         - bias_fit_verdict: "finite_n" | "systematic" | "mixed"
         - random_seed: <int>
         - reproducibility_checksum: <hash>
         - actual_agent_backend: "<gemini|codex|claude>"
         - methodology_note: "exp1677 found ~0.04 joint underestimate
           at beta=1.2*beta_c, N=10000. This task investigates whether
           that's finite-N (paper-v6 says nothing) or systematic
           (paper-v6 §6 disclosure required)."
         - acceptance_gate_passed: <bool>
         - honest_verdict: prefix "complete:".

