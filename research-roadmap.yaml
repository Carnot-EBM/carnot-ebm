  - id: exp4604-a1
    milestone: 2026.06.425
    title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY; HEADLINE -- ORACLE-DISTINCT EBM MOAT) -- fix
      the degenerate WorldModelVerifier trust gate (the documented 0.08-wall root cause): replace the exact-full-
