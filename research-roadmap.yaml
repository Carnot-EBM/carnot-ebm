ly from exp2558; never inferred.\n  4. paper_errata_status: 'applied_and_verified' if exp2557+exp2558 both succeeded;\n     'applied_not_repackaged' if exp2557 succeeded but exp2558 failed;\n     'not_applied' if exp2557 failed.\n  5. gatemate_status: reflect exp2559 outcome (flashed/strtol_diagnosed/approach_a_or_b_result).\n  6. kv260_status: reflect exp2560 outcome (operator procedure documented + URL reachability).\n  7. jepa_auc_improved: True if exp2565.jepa_auc_improved=True.\n  8. halluscan_beats_baseline: True if exp2566.carnot_beats_halluscan_baseline=True.\n  9. n_new_viable_verifiers: count of tier0t/tier0v/tier0w with AUROC > 0.60.\n  10. top_3_successes: three most impactful positive findings in .246.\n  11. top_3_gaps_for_247: three most critical unresolved issues entering .247.\n  12. operator_recommendation: 'submit_now' if arxiv_ready_v4=True AND paper_errata_status='applied_and_verified';\n      'apply_errata_first' if arxiv_ready_v4=False due to errata;\n      'review_paper_first' if ambiguous;\n      'request_operator_decision' if multiple blocking issues.\n  13. honest_verdict: 'complete: best_246_auroc=X.XXXX; arxiv_ready_v4=True/False; gatemate=Y; jepa_improved=Z'\n\nHONESTY PROTOCOL:\n  - best_246_auroc: carry forward 0.9857 if ensemble v8 didn't improve or didn't run.\n  - arxiv_ready_v4: MUST be read from exp2558. Do NOT set to True if exp2558 is missing.\n  - If more than 3 of 11 tasks produced no artifacts: flag EXECUTION_LAYER_GAP in process_flags.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. Must start with complete:.\"\n  - best_246_auroc:\n      principle: \"Cite-safe headline AUROC. Carry-forward 0.9857 if ensemble v8 unavailable.\"\n  - arxiv_ready_v4:\n      principle: \"True only if exp2558.arxiv_ready_v4=True. Primary milestone success criterion.\"\n  - paper_errata_status:\n      principle: \"Tracks whether tier0s/tier0u inflated claims were corrected before operator submission.\"\n  - gatemate_status:\n      principle: \"Hardware continuity tracking — reflects exp2559 diagnosis and flash attempt.\"\n  - kv260_status:\n      principle: \"Hardware continuity tracking — reflects exp2560 operator procedure.\"\n  - jepa_auc_improved:\n      principle: \"Continuous self-learning mandate deliverable — was real-data training beneficial?\"\n  - halluscan_beats_baseline:\n      principle: \"External peer comparison — does Carnot beat the HalluScan 0.67 mean baseline?\"\n  - n_new_viable_verifiers:\n      principle: \"Count of new verifiers with real-corpus AUROC > 0.60 added in this milestone.\"\n  - external_baselines:\n      principle: \"HIVE peer (0.9236) and HalluScan peer (0.67 mean) carried forward for gap tracking.\"\n  - preconditions_checked:\n      principle: \"Records which source artifacts were present and read.\"\n  - duration_s:\n      principle: \"Wall-clock for capstone synthesis.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

