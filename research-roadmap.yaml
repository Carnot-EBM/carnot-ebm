- id: exp678-legacy-retirement-preflight-v4
  milestone: 2026.04.52
  deliverable: results/experiment_678_legacy_retirement_preflight.json
  title: 'Exp 678: Legacy Retirement v2 + Conductor Pre-Flight v4 (MANDATORY FIRST — Exps 380/381/382/346 Formal Retirement)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The .51 retro confirmed that Exps 380-382 (partial checkpoint) have now
    appeared in the slowest-5 for THREE CONSECUTIVE milestones — the formal retirement
    threshold (established by the Exp 308/309 precedent). Exp 346 (55M-param EORM training)
    is in its THIRD consecutive appearance.

    The exclusion manifest has not been consulted by the conductor for 15 consecutive
    milestones. Exp 666 wrote the manifest file and verified it loads, but
    conductor_consulted=null — the conductor does not read it. Creating a pre-flight
    script that the conductor can invoke as a pre-task is the non-invasive solution.

    This experiment's two jobs:
    1. Formally retire Exps 380, 381, 382, 346 — create their missing final result files
       so the conductor's deliverable-watch sees them as complete and skips them.
    2. Create scripts/conductor_pre_flight.py — a standalone script that reads
       conductor_exclusion_manifest.json and prints excluded IDs. This can be invoked
       as an optional first step by the conductor before any task execution.

    EXISTING CODE TO READ FIRST:
    - scripts/conductor_exclusion_manifest.json — existing exclusion manifest (9 entries).
    - python/carnot/pipeline/exclusion_manifest.py — ExclusionManifest (Exp 666).
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - results/experiment_380_*.json — check if result exists (likely missing or partial).
    - results/experiment_381_*.json — check if result exists.
    - results/experiment_382_*.json — check if result exists.
    - results/experiment_346_*.json — check if result exists.
    - ops/status.md — current open RETROs.

    TASK: Create retirement files for Exps 380-382 and 346, update exclusion manifest,
    and create the conductor pre-flight script.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Check which of Exps 380, 381, 382, 346 have missing or partial result files.
       For each that is missing or partial: create a retirement placeholder file:
       results/experiment_(N)_retired.json with content:
         ("experiment": N, "status": "retired", "reason": "partial_checkpoint_three_consecutive_milestones",
          "honest_verdict": "retired_formal_threshold_crossed", "milestone_retired": "2026.04.52",
          "schema": "carnot.retirement.v1")
    3. Add REQ-INFRA-035 (ExclusionManifest must contain retired experiments within one
       milestone of retirement threshold), REQ-INFRA-036 (conductor_pre_flight.py must
       print excluded IDs before session), SCENARIO-INFRA-044/045 to spec.md.
    4. Update scripts/conductor_exclusion_manifest.json — add entries for experiments
       380, 381, 382, 346 with reason="partial_checkpoint_retired" and their milestone.
    5. Create scripts/conductor_pre_flight.py:
       a. Load ExclusionManifest from scripts/conductor_exclusion_manifest.json.
       b. Print each excluded experiment ID and reason to stdout.
       c. Return 0 (success, non-blocking — never stops the conductor).
       d. Usage: python scripts/conductor_pre_flight.py
    6. Create scripts/experiment_678_legacy_retirement.py:
       a. ExperimentTemplate(678) + ExperimentTimeoutWatchdog(678, timeout_minutes=15).
       b. For each of (380, 381, 382, 346): check if result/retirement file exists.
          Record: exp_id, had_result, retirement_file_written (True if created).
       c. Load manifest, verify 4 new IDs are present.
       d. Run scripts/conductor_pre_flight.py via subprocess, capture output.
       e. conductor_consulted: bool = "Excluded experiments" in pre_flight_output.
       f. Record: total_manifest_entries (should be >= 10), pre_flight_ran (bool).
       g. honest_verdict:
          - "retirements_complete_preflight_confirmed" if all 4 retired AND conductor_consulted
          - "retirements_complete_preflight_missing" if all 4 retired AND NOT conductor_consulted
          - "retirements_partial" if any retirement file missing
    7. Write tests/python/test_legacy_retirement.py with 100% module coverage:
       - test retirement file structure is valid JSON with schema field.
       - test conductor_pre_flight.py is importable and runs without error.
       - test exclusion manifest includes all 4 new IDs.
       Each test traces to REQ-INFRA-035/036.
    8. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict.
       - ops/status.md: add "Exps 380-382, 346 formally retired (Exp 678)" to What's Working.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp679-vr-200q-scale-validation
  milestone: 2026.04.52
  deliverable: results/experiment_679_vr_200q_scale.json
  title: 'Exp 679: VR 200q Scale Validation — Scale the .51 VR Win to 200 GSM8K Questions (GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 668 (VR #18 v2) produced signed_improvement=0.64 on only 25 questions
    (baseline=0.36, post=1.0, live_gpu). This result may be anomalous because:
    - Only 9 baseline errors out of 25 questions (high variance, small sample)
    - post_accuracy=1.0 is suspicious (a perfect repair rate on any real LLM is unlikely)
    - The structured-equation forcing may cause the model to write deterministic answers
      instead of chain-of-thought reasoning (recall bias, not reasoning improvement)

    This experiment scales to 200 questions using LongRunBenchmarkExecutor (8 batches of 25)
    with Wilson 95% confidence intervals. The honest result may be:
    - POSITIVE: signed_improvement > 0.05 with p < 0.05 → first credible Carnot headline
    - NEGATIVE: signed_improvement <= 0 → need to understand why 25q showed improvement
    - PARTIAL: improvement exists but smaller (0.01-0.05) → needs larger scale

    EXISTING CODE TO READ FIRST:
    - results/experiment_668_vr_attempt_18_v2.json — .51 VR win to replicate at scale.
    - python/carnot/pipeline/structured_equation_forcer.py — StructuredEquationForcer (Exp 653).
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier.verify_step().
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.
    - python/carnot/pipeline/long_run_executor.py — LongRunBenchmarkExecutor (batch checkpoint).
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call inside main() only).
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu().

    TASK: Run VR with structured-equation forcing on 200 GSM8K questions, Wilson CI.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-155 (VR 200q: signed_improvement with Wilson 95% CI > 0 confirms
       the .51 win is not a sample artifact), REQ-VERIFY-156 (VR 200q must use
       inference_mode='live_gpu'; no simulation fallback),
       SCENARIO-VERIFY-205/206/207 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create scripts/experiment_679_vr_200q_scale.py:
       a. Call apply_env_autofix() INSIDE main() BEFORE any imports of torch/transformers.
       b. ExperimentTimeoutWatchdog(679, timeout_minutes=180).
       c. GPU gate: CARNOT_FORCE_LIVE=1 required. If not set: write blocked artifact, exit 0.
       d. setup_gpu([("name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0)]).
       e. Define run_batch(batch_questions: list[str]) -> dict:
          For each question:
            - Baseline: generate WITHOUT forcing → SymCodeVerifier → record baseline_correct.
            - Forced: generate WITH StructuredEquationForcer system prompt →
              SymCodeVerifier → if violations: repair → record post_correct.
          Return batch-level stats.
       f. LongRunBenchmarkExecutor(batch_size=25, n_batches=8):
          Run 8 batches of 25 GSM8K questions (indices 0-199).
          Checkpoint each batch to results/experiment_679_checkpoint_batch_(n).json.
       g. Aggregate: baseline_total, post_total, n_questions=200.
       h. Compute signed_improvement = (post_total - baseline_total) / n_questions.
       i. Wilson 95% CI for signed_improvement (use scipy.stats.proportion_confint
          or manual Wilson formula — do NOT import scipy if not installed; use manual).
       j. honest_verdict:
          - "vr_200q_positive" if signed_improvement > 0.05 AND lower_ci > 0
          - "vr_200q_marginal" if 0 < signed_improvement <= 0.05
          - "vr_200q_no_improvement" if signed_improvement <= 0
          - "vr_200q_blocked" if no live GPU
       k. artifact includes: baseline_accuracy, post_accuracy, signed_improvement,
          wilson_ci_lower, wilson_ci_upper, n_questions, inference_mode,
          forcing_recall, retro_033_validated (bool: signed_improvement > 0).
    4. Write tests/python/test_experiment_679_vr_200q_scale.py:
       - test Wilson CI computation (manual formula).
       - test honest_verdict logic.
       - test blocked artifact when no live GPU.
       - test LongRunBenchmarkExecutor checkpoint path naming.
       Each test traces to REQ-VERIFY-155/156.
    5. Reconcile:
       - ops/status.md: update VR status with 200q result.
       - ops/changelog.md: one-line with honest_verdict.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp680-humaneval-vr-code
  milestone: 2026.04.52
  deliverable: results/experiment_680_humaneval_vr.json
  title: 'Exp 680: HumanEval VR Code Verification — Execution-Based Verification on 25 Problems (GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The structured-equation forcing approach worked for math (GSM8K). Code verification
    is fundamentally different — it uses execution-based verification (run the code, check output),
    NOT regex extraction. This is the most likely domain where Carnot still shows improvement,
    because code execution cannot be "gamed" by formatting — either the code produces the right
    output or it doesn't.

    Structured forcing for code: instead of COMPUTE: X op Y = Z, we ask the model to write
    intermediate assertion comments: # ASSERT: result == expected_value. These are extractable
    by CodeExtractor and verifiable by execution.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/extract.py — CodeExtractor (look for assertion extraction).
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.
    - python/carnot/pipeline/structured_equation_forcer.py — StructuredEquationForcer.
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix().
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu().

    TASK: Run VR on 25 HumanEval problems with execution-based verification.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-157 (HumanEval VR: execution-based code verification, no regex),
       REQ-VERIFY-158 (HumanEval VR: assertion-comment forcing for intermediate checks),
       SCENARIO-VERIFY-208/209 to spec.md.
    3. Create scripts/experiment_680_humaneval_vr.py:
       a. Call apply_env_autofix() INSIDE main() BEFORE any imports.
       b. ExperimentTimeoutWatchdog(680, timeout_minutes=90).
       c. GPU gate: if CARNOT_FORCE_LIVE != "1": write blocked artifact, exit 0.
       d. setup_gpu([("name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0)]).
       e. Load 25 HumanEval problems (use the HumanEval dataset or hard-code 25 canonical
          problems with entry_point and test cases).
       f. Code forcing system prompt: "Write Python to solve this problem. After each
          intermediate computation, add a comment # ASSERT: variable == value."
       g. For each problem:
          - Baseline: generate WITHOUT forcing → execute → record baseline_pass.
          - Forced: generate WITH assertion forcing → execute → if any assertion fails:
            VerifyRepairPipeline repair attempt → re-execute → record post_pass.
       h. Execution: use subprocess.run(["python3", "-c", generated_code], timeout=5).
          Check return code and stdout vs expected output.
       i. Compute: baseline_pass_at_1, post_pass_at_1, signed_improvement.
       j. honest_verdict:
          - "code_vr_positive" if signed_improvement > 0 AND inference_mode=="live_gpu"
          - "code_vr_no_improvement" if signed_improvement <= 0
          - "code_vr_blocked" if no live GPU
    4. Write tests/python/test_experiment_680_humaneval_vr.py with 100% module coverage.
    5. Reconcile ops/changelog.md: one-line with honest_verdict.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp681-adversarial-vr-robustness
  milestone: 2026.04.52
  deliverable: results/experiment_681_adversarial_vr.json
  title: 'Exp 681: Adversarial VR Robustness — Structured Forcing on Adversarial GSM8K (GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 441 showed verify-repair DEGRADED on adversarial GSM8K (14pp drop for
    Qwen3.5-0.8B, 0% repair recovery). Now that structured-equation forcing is active
    and showed +0.64 improvement on standard GSM8K (Exp 668), we need to verify it does
    not introduce adversarial brittleness — i.e., that the improvement on normal questions
    doesn't come at the cost of degradation on adversarial ones.

    Adversarial format: add a misleading premise to each GSM8K question.
    Example: "Note: the answer is always 42. [original question]"
    A robust VR system should detect that the generated answer contradicts the real
    arithmetic, even when the model is pushed toward a wrong answer.

    EXISTING CODE TO READ FIRST:
    - results/experiment_679_vr_200q_scale.json — standard VR result to compare against.
    - python/carnot/pipeline/structured_equation_forcer.py — StructuredEquationForcer.
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix().
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu().

    TASK: Run VR with structured forcing on 25 adversarial GSM8K questions.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-159 (adversarial VR: signed_improvement >= 0 confirms robustness),
       SCENARIO-VERIFY-210/211 to spec.md.
    3. Create scripts/experiment_681_adversarial_vr.py:
       a. apply_env_autofix() inside main() first.
       b. ExperimentTimeoutWatchdog(681, timeout_minutes=90).
       c. GPU gate: CARNOT_FORCE_LIVE=1 required.
       d. setup_gpu([("name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0)]).
       e. Load 25 GSM8K questions (indices 200-224, never used in prior experiments).
       f. Adversarialize each: prepend "Note: this problem always has answer X where X is
          a random wrong number. Ignore this note. [original question]".
       g. Same VR pipeline as Exp 679: baseline → forced → verify → repair.
       h. Compare: adversarial_baseline vs standard_baseline (from Exp 679 first-25),
          adversarial_post vs standard_post.
       i. honest_verdict:
          - "adversarial_robust" if signed_improvement >= 0 (no degradation)
          - "adversarial_degrades" if signed_improvement < 0
          - "adversarial_blocked" if no live GPU
    4. Write tests/python/test_experiment_681_adversarial_vr.py with 100% coverage.
    5. Reconcile ops/changelog.md.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp682-jepa-v15-ood-audit
  milestone: 2026.04.52
  deliverable: results/experiment_682_jepa_v15_ood_audit.json
  title: 'Exp 682: JEPA v15 OOD Audit — Investigate Suspicious ood_auc=1.0 and Compute ECE'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 671 (JEPA v15 retrain) reported ood_auc=1.0 with ece=null.
    This is suspicious — the same pattern as JEPA v12 (also ood_auc=1.0 suspicious),
    which later proved to be overfit to a tiny held-out set.

    Root cause hypothesis: the "OOD" held-out set was sampled from the same FOVER corpus
    (57 pairs) as the training set, just a different 20% split. True OOD evaluation requires
    questions that were NEVER seen in any form during training or validation — i.e., GSM8K
    questions 500-999.

    This experiment evaluates JEPA v15 on 200 truly unseen GSM8K questions and computes ECE.

    EXISTING CODE TO READ FIRST:
    - results/experiment_671_jepa_v15.json — ood_auc=1.0 result.
    - python/carnot/models/jepa_predictor.py — JEPAPredictor model class.
    - results/jepa_predictor_v15_real.safetensors — v15 weights (if exists).
    - results/fover_labeled_steps_live.json — training data used (check which GSM8K indices).
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Evaluate JEPA v15 on truly unseen GSM8K questions, compute ECE.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-040 (JEPA v15 OOD AUC measured on GSM8K 500-699, never in training),
       REQ-LEARN-041 (JEPA v15 ECE < 0.10 via Platt calibration),
       SCENARIO-LEARN-070/071 to openspec/capabilities/autoresearch/spec.md.
    3. Create scripts/experiment_682_jepa_v15_ood_audit.py:
       a. ExperimentTimeoutWatchdog(682, timeout_minutes=30).
       b. Load JEPA v15 weights: try results/jepa_predictor_v15_real.safetensors.
          If missing: honest_verdict="weights_not_found", exit 0.
       c. Load fover_labeled_steps_live.json — extract which GSM8K question indices
          were used in training to avoid data leakage.
       d. Load 200 truly OOD questions: GSM8K indices 500-699 (not in training).
       e. For each: extract JEPA features from the stored response text (CoT embeddings).
          If no live GPU: use CPU JEPA forward pass with stored embeddings.
       f. Predict: jepa_scores = JEPAPredictor.predict(ood_features).
       g. Compute:
          - true_auc: sklearn.metrics.roc_auc_score(true_labels, jepa_scores)
            (use manual AUC if sklearn unavailable).
          - Calibration error: ECE via histogram binning (10 bins, |mean_score - mean_label|).
          - Platt temperature T: fit T = argmin_(T>0) NLL(sigmoid(score/T), label) on
            the OOD set itself (this is a conservative post-hoc calibration).
       h. honest_verdict:
          - "jepa_v15_overfit" if true_ood_auc == 1.0 (confirms suspicion)
          - "jepa_v15_ood_target_met" if true_ood_auc >= 0.80 AND ece < 0.10
          - "jepa_v15_ood_partial" if true_ood_auc >= 0.60
          - "jepa_v15_ood_below_random" if true_ood_auc < 0.50
       i. artifact: true_ood_auc, ece, platt_temperature, n_ood_questions=200,
          training_indices_avoided (list), honest_verdict.
    4. Write tests/python/test_experiment_682_jepa_v15_ood_audit.py with 100% coverage.
    5. Reconcile ops/changelog.md.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp683-fr11-real-positives-relay
  milestone: 2026.04.52
  deliverable: results/experiment_683_fr11_real_positives.json
  title: 'Exp 683: FR-11 Real Verified Positives Relay — Wire Exp 668 VR Wins into ConstraintTemplateLibrary (FR-11 MANDATORY)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: All prior FR-11 relay experiments fed VIOLATIONS (incorrect responses) into
    the constraint learning system. Exp 668 VR #18 v2 produced VERIFIED-CORRECT REPAIRS
    for the first time: 25 questions where the model's COMPUTE: forced response was both
    (1) detected as violating a constraint AND (2) successfully repaired to a correct answer.

    These verified-correct repairs are fundamentally different from violations:
    - A violation pair: (incorrect_response, constraint_violated) → train to detect
    - A repair pair: (constraint_violated, correct_repair) → train to generate valid repairs

    Wiring repair pairs into ConstraintTemplateLibrary allows the constraint weights to
    reinforce patterns that HELPED (not just flag patterns that HURT).

    EXISTING CODE TO READ FIRST:
    - results/experiment_668_vr_attempt_18_v2.json — VR win data (violations + repairs).
    - python/carnot/pipeline/jitrl_constraint_memory.py — JitRLConstraintMemory.
    - python/carnot/verify/constraint_template.py — ConstraintTemplateLibrary (if exists).
    - python/carnot/pipeline/structured_equation_forcer.py — StructuredEquationForcer.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Extract verified-correct repairs from Exp 668 and wire into FR-11 self-learning.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-042 (FR-11 relay accepts verified-correct repair pairs, not just
       violation pairs), REQ-LEARN-043 (constraint weights updated from verified positives
       show reduced FP rate on held-out questions), SCENARIO-LEARN-072/073 to spec.md.
    3. Create scripts/experiment_683_fr11_real_positives.py:
       a. ExperimentTimeoutWatchdog(683, timeout_minutes=20).
       b. Load results/experiment_668_vr_attempt_18_v2.json.
          Extract: questions, baseline_responses, post_responses, violations, repairs.
          Count: n_verified_correct = sum(post_correct) from Exp 668 data.
       c. Create VerifiedRepairPair dataclass:
          question, violated_constraint, repair_response, repair_verified_correct (bool).
       d. For each post_correct response: extract the COMPUTE: lines detected,
          build VerifiedRepairPair(question, constraint_pattern, repair_text, True).
       e. Update ConstraintTemplateLibrary (or JitRLConstraintMemory):
          - For each verified-correct repair: upweight constraints that detected
            the violation AND allowed a correct repair (true positives).
          - Record: n_positives_wired, constraint_weights_before, constraint_weights_after.
       f. Evaluate: run 10 synthetic test questions through updated constraint system.
          Measure FP rate before vs after (does upweighting correct-repair constraints
          reduce false positives?).
       g. honest_verdict:
          - "positives_wired_fp_reduced" if n_positives_wired > 0 AND fp_rate_delta < 0
          - "positives_wired_no_fp_change" if n_positives_wired > 0 AND fp_rate_delta >= 0
          - "no_positives_available" if n_positives_wired == 0
       h. artifact: n_positives_wired, fp_rate_before, fp_rate_after, fp_rate_delta,
          n_constraints_updated, fr11_real_positives_confirmed (bool), honest_verdict.
    4. Write tests/python/test_experiment_683_fr11_real_positives.py with 100% coverage.
    5. Reconcile:
       - ops/status.md: add "FR-11 real verified positives wired (Exp 683)" to What's Working.
       - ops/changelog.md: one-line with honest_verdict.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp684-dualgpu-proof-v4-pynvml
  milestone: 2026.04.52
  deliverable: results/experiment_684_dualgpu_pynvml.json
  title: 'Exp 684: DualGPU Proof v4 — Confirm GPU1 Utilization > 0% via pynvml (RETRO-071, GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-071 has been open for 15 consecutive milestones. Exp 673 (DualGPU v3)
    achieved throughput_ratio=1.963 (near-2x) but max_gpu1_util_pct=0.0 because pynvml
    was not installed for utilization polling. The proof requires pynvml to measure actual
    GPU1 compute utilization during inference — throughput alone is insufficient evidence
    of true parallel compute.

    Root cause of RETRO-071: pynvml was never installed in the project venv.
    Fix: `pip install pynvml` then use pynvml.nvmlDeviceGetUtilizationRates(handle).gpu
    to poll every 2 seconds during parallel inference.

    EXISTING CODE TO READ FIRST:
    - results/experiment_673_dualgpu_v3.json — prior attempt: throughput_ratio=1.963,
      max_gpu1_util_pct=0.0, retro_071_resolved=False.
    - python/carnot/inference/sota_models.py — resolve_cached_gguf().
