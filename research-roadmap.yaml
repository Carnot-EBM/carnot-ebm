- id: exp1225-llms-gaming-verifiers-defense
  milestone: 2026.04.95
  deliverable: results/experiment_1225_llms_gaming_verifiers_defense.json
  title: "LLMs Gaming Verifiers Defense — Single-Verifier RLVR Gaming vs k=5 AND-Compose Defense"
  agent_type: claude
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 35
  priority: medium
  requires_gpu: false
  prompt: |
    CONTEXT:
    arXiv 2604.15149 demonstrates that RLVR-trained LLMs systematically game rule-induction
    verifiers: models learn to output text patterns that score high on the verifier without
    actually performing the intended task. This is the empirical confirmation of Carnot's
    Phase-3 null-space mimicry attack prediction.

    arXiv 2509.15557 (Verifiable Composite Rewards) proposes composite reward functions with
    hacking penalties as a mitigation. Carnot's Tier-0 cascade (ThinkPRM, SpilledEnergy, NUP,
    HalluField, SinkProbe) is structurally a composite reward — behavioral constraints BEFORE
    the main energy verifier.

    This experiment measures whether Carnot's k=5 AND-composed verifier ensemble resists the
    gaming attack demonstrated in arXiv 2604.15149.

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write to results/experiment_1225_llms_gaming_verifiers_defense.json:
    {
      "experiment": "1225_llms_gaming_verifiers_defense",
      "status": "in_progress",
      "gaming_defense_measured": false,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/extract.py (Z3MathVerifier, CausalReasoningVerifier, all verifiers)
    - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline with cascade)
    - python/carnot/verify/ (ComposedEnergy, ConstraintTerm — AND-composition)

    TASK:
    1. Write skeleton artifact (STEP 0).

    2. REPRODUCE GAMING SCENARIO (single-verifier):
       Use a rule induction task: given 5 input→output examples, induce the arithmetic rule.
       Example: [(2,4), (3,6), (5,10)] → rule is "double".
       Use llama.cpp CPU with any available GGUF model.

       For 30 questions with a SINGLE verifier (Z3MathVerifier only):
         Generate 3 completions per question via GGUF
         Score each completion with Z3MathVerifier.verify_step()
         Select the highest-scoring completion
       Measure: single_verifier_accuracy (how often the selected completion is ACTUALLY correct
         vs just high-scoring — label "correct" using ground truth rule)

    3. APPLY k=5 AND-COMPOSED ENSEMBLE DEFENSE:
       For the SAME 30 questions, same 3 completions:
         Score each completion with k=5 AND-composed verifier ensemble:
           Z3MathVerifier + CausalReasoningVerifier + ThinkPRM + SCEnergyEnergyAdapter + NUPProbeV4
         Select the completion with highest composite score
       Measure: ensemble_accuracy

    4. COMPOSITE REWARD ANALYSIS (arXiv 2509.15557):
       Run 30 questions through Tier-0 cascade (behavioral checks only):
         ThinkPRM verdict, SpilledEnergyDetector, SinkProbe, NUPProbeV4
       Measure: tier0_accuracy (using just behavioral composite reward, no full verifier)
       Compare: single_verifier < tier0_composite < ensemble (expected ordering)

    5. Gaming detection rate:
       gaming_detected_count = cases where single-verifier accepted but ensemble rejected
       gaming_rate = gaming_detected_count / 30

