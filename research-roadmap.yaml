    STEP 1 — Define 10 rule-induction gaming samples.
    A gaming sample is a response that APPEARS to satisfy the verifier surface (passes shallow
    structural checks) but is actually incorrect. Examples for a Z3MathVerifier-based game:
    - Response that claims "2+2=5" but formats it as "the answer is: 4+1=5" (gaming parse)
    - Response that uses valid arithmetic format but wrong problem interpretation
    - Response with correct numeric answer but wrong reasoning chain

    STEP 2 — Run through k=1 (Z3MathVerifier alone) vs k=5 AND-compose:
    python3 -c "
