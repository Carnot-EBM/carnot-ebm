    1. Create results/experiment_1398_ngrpo_theory_probe.json immediately with status="in_progress".
    2. Read exp1383 artifact to get rollout reward distribution (all_rollouts_unknown=true, formal_reward_pass_rate=0.0).
    3. Simulate the ResZero procedure on a group of N=4 rollouts all with reward=0:
       a. Compute group mean reward: 0.0. b. Compute advantages: all 0.0. c. Verify zero gradient.
    4. Simulate NGRPO Advantage Calibration:
       a. Inject virtual max-reward sample with reward=1.0 into the group (N=5 total).
       b. Recompute group mean: (0+0+0+0+1)/5 = 0.2.
       c. Recompute advantages for original 4 rollouts: -0.2 each (non-zero).
