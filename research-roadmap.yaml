        conservative_default_beta: principle="the deployed beta value (from exp3521) — the rule under test."
        deployed_alpha_t_margin: principle="the alpha_t-grounding margin sustained over the loop — the Zenil grounding signal."
        collapse_detected_deploy_arm: principle="collapse under the conservative-default beta — should be False (the deployment claim)."
        collapse_detected_control_beta0: principle="collapse under beta=0 — should be True (proves the loop CAN collapse on this corpus)."
        deploy_arm_final_true_accuracy: principle="true ground-truth accuracy at N under the deployed rule — output quality on a corpus where quality is measurable."
        quality_maintained: principle="boolean: deploy_final_true_accuracy >= 0.9*initial_true_accuracy — the rule does not over-regularize away REAL capability (the question exp3533 could not answer)."
        pass_rate_vs_true_accuracy_distinct_assert: principle="boolean: pass_rate and true_accuracy verified element-wise distinct at runtime — keeps it de-flagged."
        random_seed: principle="determinism; content-derived, not the experiment number."
        reproducibility_checksum: principle="content hash."
        duration_s: principle="cached-trace closed-loop sweep to N>=200; 1s floor."

      ACCEPTANCE GATES:
        - condition: "nondegenerate_corpus_gate_passed == true AND collapse_detected_deploy_arm == false AND collapse_detected_control_beta0 == true"
          principle: "G1 DEPLOYS-ON-A-REAL-CORPUS: on a corpus with non-trivial starting accuracy, the conservative-default rule prevents depth-N>=200 collapse while beta=0 collapses — the Phase-5 self-learning default holds where quality is actually at stake."
        - condition: "pass_rate_vs_true_accuracy_distinct_assert == true AND quality_maintained == true"
          principle: "G0 DE-FLAG + REAL QUALITY: pass_rate and true_accuracy are distinct arrays (no tautology) AND the rule preserves REAL capability on a non-degenerate corpus (the answer exp3533's degenerate corpus could not give)."

      TERMINAL VERDICTS (all start with complete:):
