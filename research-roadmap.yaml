- id: exp462-deliverable-guard-dualGPU
  milestone: 2026.04.35
  deliverable: results/experiment_462_deliverable_guard.json
  title: 'Exp 462: DeliverableGuard + DualGPURunner — close RETRO-032/033/036 root cause'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: Three consecutive milestones (2026.04.33,\
    \ .34) ended with missing result JSON files — the headline research questions could not be\
    \ answered because experiment deliverables were absent at retrospective time. Root cause:\
    \ no assertion at experiment exit that the deliverable file actually exists. Additionally,\
    \ GPU 1 (RTX 3090) was idle the ENTIRE milestone .34 despite dual-GPU hardware being available.\
    \ DualGPURunner is not wired into ExperimentTemplate, so all dual-model experiments ran\
    \ single-GPU. This experiment implements two infrastructure fixes that affect all future experiments.\n\
    \nDoc-only test overhead: the full 3900+ test suite triggers after every commit, including\
    \ changelog and ops doc updates. At 60-90s per run × 80+ doc-only commits per milestone,\
    \ this wastes 80-120 min per milestone. A doc-only commit classifier should skip the full\
    \ suite and run only ruff+mypy (5-10s total).\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog\n\
    - scripts/experiment_template.py — ExperimentTemplate, build_result(), setup_gpu()\n\
    - python/carnot/pipeline/atomic_writer.py — AtomicResultWriter (from Exp 452)\n\
    - python/carnot/pipeline/long_run_executor.py — LongRunBenchmarkExecutor (from Exp 437)\n\
    - ops/known-issues.md — RETRO-032, RETRO-033, RETRO-036\n\n\
    TASK: Implement DeliverableGuard and wire DualGPURunner into ExperimentTemplate.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-INFRA-033 (ExperimentTemplate.assert_deliverable_written() raises FileNotFoundError\n\
    \   if deliverable JSON is absent after build_result() returns),\n\
    \   REQ-INFRA-034 (ExperimentTemplate.setup_gpu() uses DualGPURunner for dual-model experiments\n\
    \   when len(model_specs) >= 2 and CARNOT_FORCE_LIVE=1 and n_gpus >= 2),\n\
    \   REQ-INFRA-035 (doc-only commit classifier skips full test suite for *.md / ops/ / _bmad/ changes),\n\
    \   SCENARIO-INFRA-041/042/043 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - DeliverableGuard(path: str):\n\
    \     - assert_written() -> None: raises FileNotFoundError with clear message if path absent\n\
    \     - assert_written_or_partial(partial_path: str) -> None: passes if either file exists\n\
    \   - DocOnlyClassifier:\n\
    \     - is_doc_only_diff(changed_files: list[str]) -> bool: True if all files are *.md,\n\
    \       docs/, ops/, _bmad/, openspec/**/*.md\n\
    \   - DualGPUAssigner(model_specs: list[dict], n_gpus: int):\n\
    \     - assign() -> list[dict]: returns model_specs with device_map=('': 'cuda:N') set\n\
    \     - is_dual_gpu_eligible() -> bool: True when len>=2 and CARNOT_FORCE_LIVE=1 and n_gpus>=2\n\
    \   - Test: assert_written() passes when file exists\n\
    \   - Test: assert_written() raises FileNotFoundError when file absent\n\
    \   - Test: is_doc_only_diff(['ops/status.md', '_bmad/prd.md']) returns True\n\
    \   - Test: is_doc_only_diff(['python/carnot/models/ising.py']) returns False\n\
    \   - Test: DualGPUAssigner.assign() sets cuda:0 for first model, cuda:1 for second\n\
    \   - Test: DualGPUAssigner.is_dual_gpu_eligible() returns False in CI (CARNOT_FORCE_LIVE not set)\n\
    5. Implement python/carnot/pipeline/deliverable_guard.py (DeliverableGuard, DocOnlyClassifier).\n\
    \   Implement python/carnot/pipeline/dual_gpu_assigner.py (DualGPUAssigner).\n\
    \   Update scripts/experiment_template.py:\n\
    \   a. add self._guard = DeliverableGuard(output_path) in __init__\n\
    \   b. add assert_deliverable_written() as a public method that calls self._guard.assert_written()\n\
    \   c. in setup_gpu(), call DualGPUAssigner(model_specs, n_gpus).assign() when eligible\n\
    \   Verbose docstrings: WHY DeliverableGuard (RETRO-032/033/036 — 3 milestones lost to\n\
    \   missing deliverables), WHY DualGPURunner (GPU 1 idle entire milestone .34, 48GB wasted),\n\
    \   WHY doc-only classifier (80-120 min wasted on test suite for changelog edits).\n\
    6. Export DeliverableGuard, DocOnlyClassifier, DualGPUAssigner from carnot.pipeline.__init__.\n\
    7. Write scripts/experiment_462_deliverable_guard.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(462, timeout_minutes=20) as context manager\n\
    \   c. ExperimentTemplate(462, 'DeliverableGuard + DualGPURunner',\n\
    \      'results/experiment_462_deliverable_guard.json')\n\
    \   d. Instantiate DeliverableGuard('results/experiment_462_deliverable_guard.json')\n\
    \   e. Test DocOnlyClassifier on representative file lists (10 doc-only + 5 code-mix)\n\
    \   f. Test DualGPUAssigner on synthetic model_specs (CI mode: n_gpus=0, eligible=False)\n\
    \   g. Build artifact: schema='carnot.deliverable_guard.v1'\n\
    \      assert_deliverable_written_added=True\n\
    \      dual_gpu_assigner_wired=True\n\
    \      doc_only_classifier_implemented=True\n\
    \      retro_032_prevention=True\n\
    \      retro_033_prevention=True\n\
    \      retro_036_prevention=True\n\
    \      honest_verdict='infrastructure_hardened'\n\
    \   h. Call tmpl.assert_deliverable_written() AS THE FINAL LINE of main()\n\
    \   i. Output: results/experiment_462_deliverable_guard.json\n\
    8. Write tests/python/test_deliverable_guard.py (100% coverage).\n\
    9. Write tests/python/test_dual_gpu_assigner.py (100% coverage).\n\
    10. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    11. Reconcile: update ops/conductor-log.md (RETRO-032/033/036 root cause fixed),\n\
    \   ops/status.md, ops/changelog.md, _bmad/traceability.md (REQ-INFRA-033/034/035).\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp463-conductor-session-health
  milestone: 2026.04.35
  deliverable: results/experiment_463_session_health.json
  title: 'Exp 463: Conductor Session Health Check — zombie kill, env verify, GPU thermal gate'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: Milestone .34 retrospective identified\
    \ that GPU 0 was 97% saturated (23795MB, 0% utilization) due to three zombie processes holding\
    \ VRAM throughout the entire milestone. GPU thermal stress was observed (82°C during runaway\
    \ experiments). CARNOT_FORCE_LIVE failed to propagate for multiple milestones (RETRO-022,\
    \ workaround was per-experiment apply_env_autofix — correct but defensive). A conductor-level\
    \ session health check at startup would catch and fix all of these before the first experiment\
    \ runs.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog\n\
    - scripts/experiment_template.py — ExperimentTemplate\n\
    - python/carnot/pipeline/deliverable_guard.py — DeliverableGuard (from Exp 462)\n\
    - scripts/experiment_462_deliverable_guard.py — pattern to follow\n\n\
    TASK: Implement ConductorSessionHealthCheck and run it as session startup verification.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-INFRA-036 (ConductorSessionHealthCheck runs at conductor session start and\n\
    \   verifies: CARNOT_FORCE_LIVE propagates, both GPUs under 200MB VRAM, no GPU exceeds 80C,\n\
    \   no zombie processes exist — auto-remediates if possible),\n\
    \   REQ-INFRA-037 (health check kills zombie GPU processes before first experiment),\n\
    \   REQ-INFRA-038 (thermal gate pauses conductor if any GPU exceeds 80C and opens RETRO item),\n\
    \   SCENARIO-INFRA-044/045/046 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - GPUHealth(gpu_index: int, vram_used_mb: int, utilization_pct: int, temp_c: int):\n\
    \     - is_zombie_saturated: bool (vram_used_mb > 1000 and utilization_pct == 0)\n\
    \     - is_overheating: bool (temp_c >= 80)\n\
    \     - is_idle: bool (vram_used_mb < 200)\n\
    \   - ZombieProcess(pid: int, gpu_index: int, vram_mb: int, wall_time_s: float):\n\
    \     - should_kill: bool (wall_time_s > 300 and vram_mb > 500)\n\
    \   - ConductorSessionHealthCheck(auto_remediate: bool = True):\n\
    \     - run() -> SessionHealthResult\n\
    \     - _check_env() -> bool\n\
    \     - _check_gpu_health() -> list[GPUHealth]\n\
    \     - _kill_zombies(zombies: list[ZombieProcess]) -> int: returns count killed\n\
    \   - SessionHealthResult(env_ok, gpu_ok, zombies_killed, thermal_ok, honest_verdict)\n\
    \   - Test: GPUHealth(vram_used_mb=23000, utilization_pct=0, temp_c=45).is_zombie_saturated == True\n\
    \   - Test: GPUHealth(vram_used_mb=100, utilization_pct=0, temp_c=45).is_idle == True\n\
    \   - Test: ZombieProcess(wall_time_s=41335, vram_mb=5418).should_kill == True\n\
    \   - Test: ConductorSessionHealthCheck(auto_remediate=False).run() returns SessionHealthResult\n\
    \     without actually killing processes (safe for CI)\n\
    5. Implement python/carnot/pipeline/session_health_check.py.\n\
    \   Export ConductorSessionHealthCheck, GPUHealth, ZombieProcess, SessionHealthResult\n\
    \   from carnot.pipeline.__init__.\n\
    \   Verbose docstrings: WHY session-start check (zombie processes held 23.7GB for 11.5 hours\n\
    \   in milestone .34), WHY thermal gate (RTX 3090 at 82C shortens hardware life),\n\
    \   HOW zombie detection works (pynvml cross-referenced with psutil process list).\n\
    6. Write scripts/conductor_session_health.py:\n\
    \   Standalone script, no ExperimentTemplate (this runs BEFORE the conductor starts)\n\
    \   a. apply_env_autofix()\n\
    \   b. ConductorSessionHealthCheck(auto_remediate=True).run()\n\
    \   c. Print SessionHealthResult summary to stdout\n\
    \   d. If thermal_ok=False: print CONDUCTOR PAUSED — GPU temp >= 80C and sys.exit(1)\n\
    \   e. If not env_ok: print WARNING — CARNOT_FORCE_LIVE not propagating + remediation steps\n\
    7. Write scripts/experiment_463_session_health.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(463, timeout_minutes=20) as context manager\n\
    \   c. ExperimentTemplate(463, 'Conductor Session Health Check',\n\
    \      'results/experiment_463_session_health.json')\n\
    \   d. ConductorSessionHealthCheck(auto_remediate=False).run() — non-destructive in CI\n\
    \   e. Build artifact: schema='carnot.session_health.v1'\n\
    \      env_ok=<bool>\n\
    \      gpu0_health=<GPUHealth dict>\n\
    \      gpu1_health=<GPUHealth dict or null>\n\
    \      zombies_found=<int>\n\
    \      zombies_killed=<int> (0 in CI mode)\n\
    \      thermal_ok=<bool>\n\
    \      honest_verdict='session_healthy' or 'session_remediated' or 'session_thermal_blocked'\n\
    \   f. Call tmpl.assert_deliverable_written() as final line\n\
    \   g. Output: results/experiment_463_session_health.json\n\
    8. Write tests/python/test_session_health_check.py (100% coverage).\n\
    9. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    10. Reconcile: update ops/conductor-log.md (session health check implemented),\n\
    \   ops/status.md, ops/changelog.md, _bmad/traceability.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp464-live-precision-100q
