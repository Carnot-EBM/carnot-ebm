- id: exp806-milestone-prereqs-gate
  milestone: 2026.04.62
  deliverable: results/experiment_806_milestone_prereqs_gate.json
  title: 'Exp 806: MILESTONE_PREREQS.md Gate + JEPA Assertion Infrastructure'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The .61 retro explicitly called for MILESTONE_PREREQS.md — a checklist of
    IMMEDIATE-class actions from the prior retro that MUST be verified before .62 experiments
    run. The retro also identified the single most preventable failure: JEPA v21 ood_auc=0.2444
    (all-time low) caused by missing assert augmentation_ratio > 1.0 at JEPA script startup.
    This experiment implements both: the prereqs gate document and the JEPA wiring assertion.

    EXISTING CODE TO READ FIRST:
    - results/operational_retro_2026_04_61.json — improvements_suggested section
    - scripts/research_conductor.py — read (do NOT modify) to understand structure
    - openspec/capabilities/pipeline/spec.md — look for REQ-INFRA entries
    - openspec/capabilities/autoresearch/spec.md — look for REQ-LEARN entries

    TASK: Create MILESTONE_PREREQS.md gate, add JEPA wiring assertion infrastructure,
    write results/experiment_806_milestone_prereqs_gate.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/pipeline/spec.md:
       - REQ-INFRA-059: A MILESTONE_PREREQS.md file MUST exist at project root listing all
         IMMEDIATE-class actions from the prior milestone retro. Each action MUST be marked
         as either verified_complete or escalated_retro before any milestone experiment runs.
       - REQ-INFRA-060: JEPA retrain experiment scripts MUST assert augmentation_ratio > 1.0
         before any model training begins. Failure raises AssertionError with message:
         "CPMI corpus not wired in — check training data loader merges all sources."
       - SCENARIO-INFRA-068: Prereqs gate reads MILESTONE_PREREQS.md; all IMMEDIATE items
         marked verified_complete; gate passes; experiment proceeds normally.
       - SCENARIO-INFRA-069: JEPA retrain script startup: augmentation_ratio=1.0 detected;
         AssertionError raised; training does NOT begin; experiment writes blocked artifact.
    3. Create MILESTONE_PREREQS.md in project root:
       Header: "# Milestone 2026.04.62 Prerequisites — Verify Before ANY Experiment Runs"
       List from .61 retro improvements_suggested (IMMEDIATE items only):
       a. [ ] Apply manifest enforcement to ALL dequeue sites (Exp 793 audit documented patch)
       b. [ ] Install FPGA toolchain (Exp 807 — OSS-CAD-Suite, no sudo required)
       c. [ ] Add CPMI wiring assertion to JEPA retrain scripts (this experiment)
       d. [ ] Run source scripts/session_startup.sh before any GPU experiments
       Status column: each item has status: pending | verified_complete | escalated_retro
       Mark item c as verified_complete (implemented in this experiment).
       Leave others as pending (human must verify before running conductor).
    4. Implement python/carnot/pipeline/jepa_wiring_guard.py:
       a. check_cpmi_wiring(triples_path: str, min_augmentation_ratio: float = 1.5):
          - Load triples from triples_path (experiment_798_cpmi_pairs_triples.json or similar)
          - Compute augmentation_ratio = n_triples / max(n_input_pairs, 1)
          - Assert augmentation_ratio >= min_augmentation_ratio
          - Return: JEpaWiringCheckResult(triples_path, n_triples, n_input_pairs,
                                          augmentation_ratio, is_wired)
       b. JepaWiringCheckResult dataclass (triples_path, n_triples, n_input_pairs,
          augmentation_ratio, is_wired: bool, honest_verdict: str)
       c. Export JepaWiringCheckResult, check_cpmi_wiring from carnot.pipeline.__init__
    5. Create scripts/experiment_806_milestone_prereqs_gate.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(806) + ExperimentTimeoutWatchdog(806, timeout_minutes=30).
       c. Read MILESTONE_PREREQS.md — parse prereq items and their status.
       d. Check JEPA wiring guard: call check_cpmi_wiring("results/experiment_798_cpmi_pairs_triples.json").
          Record: is_wired, augmentation_ratio.
       e. Check GPU session startup: look for scripts/session_startup.sh existence.
       f. Artifact fields: prereqs_total, prereqs_verified, prereqs_pending,
          jepa_wiring_guard_implemented, cpmi_triples_present, augmentation_ratio,
          session_startup_exists, honest_verdict.
       g. honest_verdict:
          - "prereqs_gate_ready" if MILESTONE_PREREQS.md written AND jepa_wiring_guard_implemented
          - "prereqs_gate_partial" if MILESTONE_PREREQS.md written but guard not importable
          - "prereqs_gate_failed" if either missing
    6. Write tests/python/test_experiment_806_milestone_prereqs_gate.py with 100% coverage:
       - test check_cpmi_wiring raises AssertionError when ratio < min_augmentation_ratio
       - test check_cpmi_wiring returns is_wired=True when ratio >= min_augmentation_ratio
       - test JepaWiringCheckResult fields typed correctly
       Each test traces to REQ-INFRA-059/060.
    7. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict.
       - ops/status.md: "Exp 806: MILESTONE_PREREQS.md created. JEPA wiring guard implemented."
