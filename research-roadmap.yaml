- id: exp808-jepa-v22-cpmi-rewire
  milestone: 2026.04.62
  deliverable: results/experiment_808_jepa_v22_retrain.json
  title: 'Exp 808: JEPA v22 CPMI Corpus Rewire + Retrain (RETRO-JEPA-OOD attempt #10, FR-11 mandatory)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA v21 ood_auc=0.2444 is the all-time project low. Root cause: Exp 799
    training data loader loaded ONLY fover_labeled_steps_v21_multi.json (augmentation_ratio=1.0)
    and did NOT merge experiment_798_cpmi_pairs_triples.json (which had augmentation_ratio=2.5).
    The CPMI hypothesis — that hard negatives fix JEPA OOD — is UNTESTED. This experiment
    runs the correct v22 retrain with both files merged.
    CRITICAL: Add assert augmentation_ratio > 1.0 at startup. Do NOT train without this check.

    EXISTING CODE TO READ FIRST:
    - results/experiment_799_jepa_v21_retrain.json — v21 failure (ood_auc=0.2444, aug_ratio=1.0)
    - results/experiment_798_cpmi_pairs.json — CPMI generation result (augmentation_ratio=2.5)
    - results/experiment_798_cpmi_pairs_triples.json — CPMI triples to load for training
    - results/fover_labeled_steps_v21_multi.json — multi-source FoVer corpus (300 pairs)
    - results/fover_labeled_steps_live.json — Exp 442 OOD eval set (do NOT train on this)
    - python/carnot/models/jepa_predictor.py (or similar) — existing JEPA model architecture
    - python/carnot/pipeline/three_tier_pipeline.py — Tier 3.5 wire-in location
    - python/carnot/pipeline/jepa_wiring_guard.py — check_cpmi_wiring() from Exp 806
    - openspec/capabilities/autoresearch/spec.md — FR-11, REQ-LEARN entries

    TASK: Merge CPMI triples + FoVer corpus, retrain JEPA v22, evaluate OOD AUC,
    write results/experiment_808_jepa_v22_retrain.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/autoresearch/spec.md:
       - REQ-LEARN-063: JEPA v22 training data MUST merge multi-source FoVer corpus
         (fover_labeled_steps_v21_multi.json) WITH CPMI triples (experiment_798_cpmi_pairs_triples.json).
         augmentation_ratio = (n_fover_pairs + n_cpmi_triples) / n_fover_pairs MUST be >= 1.5
         before training begins.
       - REQ-LEARN-064: JEPA v22 training scripts MUST call check_cpmi_wiring() from
         python/carnot/pipeline/jepa_wiring_guard.py as the FIRST assertion before any model
         initialization or data loading.
       - SCENARIO-LEARN-101: CPMI triples loaded; augmentation_ratio=3.5; training proceeds;
         ood_auc evaluated on fover_labeled_steps_live.json; tier35_deployed if >= 0.75.
       - SCENARIO-LEARN-102: Training starts; check_cpmi_wiring() detects augmentation_ratio=1.0;
         AssertionError raised; experiment writes blocked_wiring_miss artifact; training stops.
    3. Create scripts/experiment_808_jepa_v22_retrain.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(808) + ExperimentTimeoutWatchdog(808, timeout_minutes=60).
       c. WIRING GUARD (mandatory — FIRST assertion):
          from python.carnot.pipeline.jepa_wiring_guard import check_cpmi_wiring
          guard = check_cpmi_wiring("{project_root}/results/experiment_798_cpmi_pairs_triples.json",
                                     min_augmentation_ratio=1.5)
          If not guard.is_wired: write blocked artifact with "CPMI corpus not wired", exit.
       d. Load training corpus: merge fover_labeled_steps_v21_multi.json (300 pairs)
          WITH experiment_798_cpmi_pairs_triples.json (750 CPMI triples).
          Each CPMI triple: (prefix, positive_step, negative_step) → 2 training pairs:
            (prefix+positive, label=1.0) and (prefix+negative, label=0.0 × 0.7 weight)
          Record: n_fover_pairs, n_cpmi_triples, total_training_items, augmentation_ratio.
       e. OOD eval set: fover_labeled_steps_live.json (57 Exp 442 steps — NOT in training set).
       f. Retrain JEPA with LambdaRank listwise loss + outcome-conditioned weighting:
          domain_accuracy = ("gsm8k": 0.14, "math500": 0.12, "humaneval": 0.20)
          weight_i = domain_accuracy.get(pair.get("source_domain", "gsm8k"), 0.14)
          Train for 80 epochs (more than v21's 50 to allow CPMI negatives to contribute).
          Evaluate in-distribution AUC + OOD AUC after each 20 epochs.
       g. If OOD AUC >= 0.75:
          - Save to results/jepa_predictor_v22.safetensors
          - Wire into ThreeTierPipeline as Tier 3.5
          - tier35_deployed = True
       h. If OOD AUC < 0.75: write per-domain AUC breakdown (gsm8k, math500, humaneval).
          Identify which domain shows largest training/OOD gap.
       i. honest_verdict:
          - "jepa_v22_tier35_deployed" if ood_auc >= 0.75
          - "jepa_v22_improvement_vs_v21" if 0.5 <= ood_auc < 0.75 (improvement, not gate)
          - "jepa_v22_below_random" if ood_auc < 0.5
          - "blocked_wiring_miss" if guard.is_wired=False
    4. Write tests/python/test_experiment_808_jepa_v22_retrain.py with 100% coverage:
       - test corpus merge produces augmentation_ratio > 1.0
       - test outcome-conditioned weighting maps source_domain to correct weight
       - test blocked_wiring_miss path when check_cpmi_wiring fails
       Each test traces to REQ-LEARN-063/064.
    5. Reconcile:
       - ops/changelog.md: one-line entry with ood_auc and honest_verdict.
       - ops/status.md: "Exp 808: JEPA v22 retrain. ood_auc=<value>. tier35_deployed=<bool>."
       - _bmad/traceability.md: update FR-11 Tier 3 implementation status.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp809-jepa-v22-rapbm-ood
  milestone: 2026.04.62
  deliverable: results/experiment_809_jepa_v22_rapbm.json
  title: 'Exp 809: JEPA v22 RA-PRM OOD Enhancement (arXiv 2502.14361) — Fallback + Held-Out Eval'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2502.14361 identifies two JEPA failure modes: step-OOD (unseen reasoning
    step type) and question-OOD (unseen domain). Retrieval-augmented PRM addresses step-OOD:
    for each training step, retrieve K similar labeled steps from the corpus and include their
    labels as soft supervision. This anchors OOD predictions to the training distribution.
    This experiment:
    (A) If Exp 808 ood_auc >= 0.75: evaluate JEPA v22 on an additional held-out benchmark
        (SVAMP or ARC) to confirm true OOD generalization.
    (B) If Exp 808 ood_auc < 0.75: apply RA-PRM — retrieval-augmented soft supervision
        using EmbeddingConstraintStore (AUC=0.92 from Exp 800).

    EXISTING CODE TO READ FIRST:
    - results/experiment_808_jepa_v22_retrain.json — v22 result (ood_auc and honest_verdict)
    - results/jepa_predictor_v22.safetensors — v22 model (if deployed)
    - python/carnot/pipeline/embedding_constraint_store.py — EmbeddingConstraintStore (Exp 800)
    - results/fover_labeled_steps_v21_multi.json — training corpus
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN entries

    TASK: Evaluate JEPA v22 OOD on held-out benchmark OR apply RA-PRM soft supervision.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/autoresearch/spec.md:
       - REQ-LEARN-065: If JEPA v22 ood_auc >= 0.75, held-out evaluation MUST run on a
         distinct domain (ARC, SVAMP, or StrategyQA) not present in training corpus.
       - REQ-LEARN-066: If JEPA v22 ood_auc < 0.75, RA-PRM MUST retrieve K=3 similar FoVer
         steps per training example via EmbeddingConstraintStore and include retrieved labels
         as soft targets (weight: retrieved_labels × 0.4, ground_truth × 1.0).
       - SCENARIO-LEARN-103: Path A — v22 ood_auc=0.80; held-out ARC eval: auc=0.72; true OOD
         confirmed; tier35 generalization validated on unseen domain.
       - SCENARIO-LEARN-104: Path B — v22 ood_auc=0.45; RA-PRM applied; retrieval retrieves
         3 similar steps per item; soft labels computed; retrain runs; improved ood_auc logged.
    3. Create scripts/experiment_809_jepa_v22_rapbm.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(809) + ExperimentTimeoutWatchdog(809, timeout_minutes=60).
       c. Load Exp 808 result: check honest_verdict and ood_auc.
       d. PATH A (if Exp 808 ood_auc >= 0.75):
          - Load 20 SVAMP or ARC reasoning problems (hardcoded, no live GPU needed)
          - For each: generate a synthetic CoT (template-based for CPU path)
          - Run FoVer annotation on generated CoT steps
          - Evaluate JEPA v22 (load jepa_predictor_v22.safetensors) on FoVer-labeled steps
          - Compute held_out_auc
          - honest_verdict = "v22_ood_confirmed" if held_out_auc >= 0.65 else "v22_ood_partial"
       e. PATH B (if Exp 808 ood_auc < 0.75):
          - Load EmbeddingConstraintStore (empty if no store, or from saved state)
          - Populate with all FoVer-labeled steps from fover_labeled_steps_v21_multi.json
          - For each training pair: retrieve 3 similar steps via EmbeddingConstraintStore.retrieve()
          - Build augmented training pairs: ground_truth_label × 1.0 + retrieved_labels × 0.4
          - Retrain JEPA v22-rapbm for 80 epochs on augmented pairs
          - Evaluate: in-distribution AUC + OOD AUC on fover_labeled_steps_live.json
          - Save model to results/jepa_predictor_v22_rapbm.safetensors if ood_auc improves
          - honest_verdict: "rapbm_ood_improved" if ood_auc > Exp 808 ood_auc else "rapbm_no_gain"
    4. Write tests/python/test_experiment_809_jepa_v22_rapbm.py with 100% coverage:
       - test Path A loads Exp 808 result and selects correct evaluation path
       - test RA-PRM soft label computation: ground_truth × 1.0 + retrieved × 0.4
       - test retrieve() integration with EmbeddingConstraintStore produces K=3 results
       Each test traces to REQ-LEARN-065/066.
    5. Reconcile:
       - ops/changelog.md: one-line entry with path taken and honest_verdict.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp810-gemma4-oom-fix-v5
  milestone: 2026.04.62
  deliverable: results/experiment_810_gemma4_oom_fix_v5.json
  title: 'Exp 810: Gemma4 OOM Fix v5 — nvidia-smi Loop Gate (RETRO-028, GPU REQUIRED, CARNOT_FORCE_LIVE=1)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-028 is unresolved after 4+ milestones (Exps 450, 787, 795). The .61 retro
    identifies the specific missing mechanism: Exp 795 (Fix v4) applied kill_gpu_zombies() and
    pkill ONCE but did NOT use a verification loop. If VRAM doesn't clear in one pass (other
    processes restart or hold VRAM), the model load proceeds into OOM. Fix v5 mandates:
    (1) kill_gpu_zombies(), (2) pkill loop with nvidia-smi verification (3 retries, 10s sleep),
    (3) ABORT if VRAM does not drop below 500MB after 3 retries — do NOT attempt model load.
    Add checkpoint_save() after each verification step so partial results survive timeout.

    EXISTING CODE TO READ FIRST:
    - results/experiment_795_gemma4_oom_fix_v4.json — Fix v4 partial_success details
    - python/carnot/pipeline/gemma_isolation.py — VRAMEvictionResult, evict_gpu_vram() (Exp 795)
    - python/carnot/pipeline/gpu_zombie_killer.py — kill_gpu_zombies() (Exp 780)
    - python/carnot/pipeline/gemma_loader.py — GemmaTransformersLoader (Exp 450)
    - results/operational_retro_2026_04_61.json — RETRO-028 resolution path (nvidia-smi loop)
    - openspec/capabilities/verifiable-reasoning/spec.md — REQ-LOADER entries

    TASK: Implement nvidia-smi verification loop, load Gemma4 on GPU 1, run 20 GSM8K questions.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/verifiable-reasoning/spec.md:
       - REQ-LOADER-005: VRAM eviction before Gemma4 load MUST use a verification loop:
         poll nvidia-smi every 5 seconds up to 3 retries. If VRAM does not drop below 500MB
         after 3 retries, the experiment MUST abort and write a blocked artifact.
         The model load MUST NOT proceed when VRAM >= 500MB after the retry loop.
       - SCENARIO-LOADER-005: VRAM stuck at 700MB; 3 retries x 10s sleep; VRAM still 600MB
         after 3rd retry; experiment writes blocked_vram_stuck artifact; NO model load attempt.
       - SCENARIO-LOADER-006: VRAM 700MB → retry 1 → 800MB → retry 2 → 300MB; threshold met;
         model load proceeds; n_valid_responses >= 8; retro_028_closed=True.
    3. Implement python/carnot/pipeline/vram_loop_eviction.py:
       a. VRAMLoopEvictionResult dataclass:
          (gpu_index, n_retries_attempted, vram_mb_per_retry: list[float], final_vram_mb,
           vram_cleared, abort_reason: str | None, honest_verdict)
       b. evict_vram_with_loop(gpu_index: int = 1, max_retries: int = 3,
                               retry_sleep_s: float = 10.0, threshold_mb: float = 500.0):
          - kill_gpu_zombies(gpu_index)
          - For i in range(max_retries):
              Run: nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader -i gpu_index
              Kill any PID using > 100 MB: os.kill(pid, signal.SIGKILL)
              time.sleep(retry_sleep_s)
              Check: nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits -i gpu_index
              If vram_used < threshold_mb: return VRAMLoopEvictionResult(vram_cleared=True, ...)
              Record vram_mb_per_retry.append(vram_used)
          - Return VRAMLoopEvictionResult(vram_cleared=False, abort_reason="max_retries_exceeded")
       c. Export VRAMLoopEvictionResult, evict_vram_with_loop from carnot.pipeline.__init__
    4. Create scripts/experiment_810_gemma4_oom_fix_v5.py:
       a. apply_env_autofix() FIRST.
