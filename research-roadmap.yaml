    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1123-adaptive-cascade-lagrangian
  milestone: 2026.04.87
  deliverable: results/experiment_1123_adaptive_cascade_lagrangian.json
  title: "Adaptive Cascade Routing with Lagrangian Dual — Compute-Optimal Verification"
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 30
  priority: medium
  requires_gpu: false
  prompt: |
    CONTEXT:
    Reference: arXiv 2604.14853 "Adaptive Test-Time Compute Allocation via Constrained Policy
    Optimization." Key result: global budget constraint (total cascade cost ≤ B) decomposes
    to per-instance supervised classification via Lagrangian dual. A lightweight MLP that
    predicts required cascade depth from input features achieves +12.8% on MATH vs fixed
    compute allocation.

    Carnot finding: exp1100 showed SOTA outputs need mean cascade_depth=2.20 vs FoVer's 1.08.
    Using fixed k=5 cascade for ALL queries wastes compute on easy queries (SemEnergy alone
    at 0.017ms suffices) while potentially under-verifying hard queries. Adaptive routing
    can right-size depth per query.

    INPUT FEATURES for the Lagrangian router:
    - initial_energy_score: SemEnergyProbe score (fast, 0.017ms)
    - question_length: word count of the question
    - response_length: word count of the LLM response
    - num_steps: number of CoT steps in response
    - thinkprm_confidence: ThinkPRM v2 raw score (fast path via 0.6B model)

    TARGET OUTPUT: predicted_cascade_depth ∈ {1, 2, 3, 4, 5}
    - depth 1: SemEnergyProbe only (0.017ms)
    - depth 2: + SOSKANEnergyV3 (1ms)
    - depth 3: + ASTStructureVerifier (5ms)
    - depth 4: + SemanticConsistencyVerifier (5ms)
    - depth 5: + Z3MathVerifier (100ms, full AND-compose)

    IMPLEMENTATION:
    1. Annotate FoVer v4/v5 corpus with actual cascade depth:
       For each FoVer example, compute the minimum depth at which a verifier correctly
       classified the example (verified=True for correct; verified=False for incorrect).
       If all 5 verifiers agree: depth=5. If SemEnergy alone was correct: depth=1.
    2. Extract features for each example.
    3. Train a 3-layer MLP (input=5 features, hidden=32, output=5 logits) via cross-entropy.
    4. Evaluate: on 500-pair FoVer holdout, compare:
       - Fixed k=5 cascade: cost = sum(per_tier_latency) for all 5 tiers
       - Adaptive Lagrangian routing: cost = sum(predicted_depth_latency) per query
    5. Report: cost_savings_pct = (fixed_cost - adaptive_cost) / fixed_cost * 100
              accuracy_delta = adaptive_tp_rate - fixed_tp_rate (should be near zero)

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py (find cascade invocation pattern)
    - results/experiment_1108_ensemble_diversity_v2_and_composition.json (verifier latencies)
    - data/fover_corpus.jsonl (check schema)

    CONCRETE STEPS:
    - (annotate corpus with cascade depth)
    - (extract features)
    - (train MLP)
    - (evaluate adaptive vs fixed cascade)
    - JAX_PLATFORMS=cpu pytest tests/python/ -k "cascade" -v (if tests exist)
    - Write results/experiment_1123_adaptive_cascade_lagrangian.json

    REQUIRED ARTIFACT FIELDS:
    - n_training_examples: int
    - mlp_hidden_size: int
    - mlp_val_accuracy: float (classification accuracy on holdout)
    - fixed_cascade_cost_ms: float (average total latency per query for k=5 fixed)
    - adaptive_cascade_cost_ms: float (average total latency per query for adaptive)
    - cost_savings_pct: float
    - adaptive_tp_rate: float
    - fixed_tp_rate: float
    - accuracy_delta: float
    - adaptive_cascade_savings_measured: bool (always True — means measurement done)
    - honest_verdict: "savings_positive_accuracy_maintained" | "savings_positive_accuracy_degraded" | "savings_negative" | "partial" | "failed"

