    deliverable: results/experiment_3849_thinkprm_complementarity.json
    prompt: |
      CONTEXT. arXiv:2504.16828 (ThinkPRM): a single strong GENERATIVE long-CoT PRM beats
      discriminative PRMs and LLM-judges and wins OOD — it is hard to out-AUROC. Therefore Carnot's
      moat must NOT be argued as "we beat the strong PRM on AUROC"; it must be argued as COMPLEMENTARY
      catch (error-independence). The Qwen3.6-35B long-CoT self-verification run in exp3847 IS a
      strong-single-generative-PRM baseline. This task asks: of the gold-incorrect steps that strong
      generative PRM MISSES, what fraction does Carnot's cheap NON-LLM k=15 ensemble catch — and vice
      versa? It reuses exp3847's persisted masks; no new GPU run.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3847_moat_scissor_at_scale_v2.json (per_item_error_masks: the generative
          PRM = reasoner self-verify mask; the carnot mask; gold labels).
        - research-references.md "arXiv:2504.16828" entry (the complementarity framing).

