- id: exp964-fast-path-probe-live-gpu
  milestone: 2026.04.75
  deliverable: results/experiment_964_fast_path_probe_live_gpu.json
  title: "Fast-Path Probe Live GPU Validation — SpilledEnergy + ThinkPRM + DRIFTProbe"
  prompt: |
    CONTEXT:
    Exp 954 (Fast-Path Probe Live GPU Validation) in .74 produced NO result file — the experiment
    appears to have never been launched by the conductor. This is a fresh attempt.

    Three CPU-proven probes need live GPU validation:
    - SpilledEnergy (Exp 949, CPU AUROC=1.0, arXiv 2602.18671): logit chain-rule energy
    - ThinkPRM (Exp 945, CPU AUROC=0.99, arXiv 2504.16828): generative CoT step verification
    - DRIFTProbe v3 (Exp 947, CPU probe_auc=0.5807): depth-recurrent attention pooling

    Per CLAUDE.md: "All headline results must have live GPU provenance." These cannot be
    claimed as headline results until validated on real model responses from a live GPU.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_949_spilled_energy.py (SpilledEnergyDetector implementation)
    - scripts/experiment_945_thinkprm.py (ThinkPRM CoT verification implementation)
    - scripts/experiment_947_driftprobe_v3.py (DRIFTProbe v3 implementation)
    - python/carnot/pipeline/verify_repair.py (pipeline integration pattern)

    TASK:
    1. Load Gemma4-31B-it-GGUF on ROCm GPU (sg render -c '...')
    2. Generate 100 real responses to factual questions with deliberate errors injected
       (at least 50 questions with known errors, 50 without; record ground-truth labels)
    3. Run SpilledEnergy on real responses; compute AUROC vs ground-truth labels
    4. Run ThinkPRM CoT verification on real responses; compute AUROC
    5. Run DRIFTProbe v3 (depth-recurrent attention pooling) on real responses; compute AUROC
    6. Write results with inference_mode=live_gpu

    Acceptance thresholds (degradation from CPU-synthetic expected on real data):
    - SpilledEnergy AUROC >= 0.70 (vs CPU 1.0)
    - ThinkPRM AUROC >= 0.80 (vs CPU 0.99)
    - DRIFTProbe AUROC >= 0.55 (vs CPU 0.5807 — marginal acceptable)

    Use unsloth/gemma-4-31B-it-GGUF. Pre-warm via tmpl.setup_gpu(MODEL_SPECS).
    Write results/experiment_964_fast_path_probe_live_gpu.json with schema:
      spilled_energy_auroc: float
      thinkprm_auroc: float
      driftprobe_auroc: float
      n_responses: int
      inference_mode: "live_gpu"
      model_used: str
      honest_verdict: str

    honest_verdict options:
      "live_gpu_probes_validated" if SpilledEnergy >= 0.70 AND ThinkPRM >= 0.80
      "live_gpu_probes_partial" if one passes, one fails
      "live_gpu_probes_failed" if both fail

    Run: python scripts/experiment_964_fast_path_probe_live_gpu.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

