    \ by how much they predict the final incorrect outcome, improving credit assignment.\
    \ (2) D-Wave dwave-ocean-sdk is free to install and provides a local Neal simulated\
    \ annealer plus optional cloud QPU access. This is the first Carnot experiment\
    \ to validate the D-Wave integration path described in research-hardware-wishlist.md.\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/constraint_addition.py\
    \ — ConstraintAdditionFromMemory (HISR extension target)\n- python/carnot/samplers/parallel_ising.py\
    \ — ParallelIsingSampler (D-Wave comparison baseline)\n- python/carnot/samplers/backend.py\
    \ — SamplerBackend protocol\n- research-hardware-wishlist.md — D-Wave justification\
    \ and dwave-ocean-sdk setup\n\nTASK: HISR hindsight credit assignment + D-Wave\
    \ integration.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-LEARN-067 (HISR:\
    \ hindsight importance scoring for constraint violations, arXiv 2603.18683), REQ-SAMPLE-020\
    \ (D-Wave SamplerBackend: Neal and QPU backends), SCENARIO-LEARN-103/104, SCENARIO-SAMPLE-035/036\
    \ to spec.\n3. Create python/carnot/pipeline/hisr_weights.py:\n   a. HISRViolationWeight\
    \ dataclass: violation_type (str), question_id (str), final_incorrect (bool),\
    \  hindsight_score (float).\n   b. HISRWeighter class:\n      - __init__(self).\n\
    \      - compute_hindsight_score(self, violations: list[ViolationPattern],\n  \
    \      final_correct: bool) -> list[HISRViolationWeight]:\n          * If final_correct=False:\
    \ violations that preceded an incorrect answer score higher.\n          * Score\
    \ = 1.0 / (1 + distance_from_final_error) where distance is position from last\
    \ violation to end.\n          * If final_correct=True: violations are false positives,\
    \ score = 0.0.\n      - weighted_violations(self, weights: list[HISRViolationWeight],\
    \ threshold=0.5) -> list[ViolationPattern]:\n          Filter to weights where\
    \ hindsight_score >= threshold.\n   c. Export HISRWeighter, HISRViolationWeight\
    \ from carnot.pipeline.__init__.\n4. Create python/carnot/samplers/dwave_backend.py:\n\
    \   a. DWaveNealBackend class implementing SamplerBackend protocol:\n      - __init__(self):\
    \ tries `import dwave.samplers; from dwave.samplers import SimulatedAnnealingSampler`.\n\
    \        If ImportError: self.available = False.\n      - sample(self, J: jnp.ndarray,\
    \ h: jnp.ndarray, n_samples: int = 100) -> jnp.ndarray:\n          * Convert J,\
    \ h to QUBO dict format.\n          * Run SimulatedAnnealingSampler.sample_ising(h_dict,\
    \ J_dict, num_reads=n_samples).\n          * Return samples as jnp.ndarray.\n \
    \         * If not available: return ParallelIsingSampler fallback.\n      - latency_ms(self,\
    \ n_spins: int) -> float: benchmark 10 calls, return mean ms.\n   b. Export DWaveNealBackend\
    \ from carnot.samplers.__init__.\n5. Write scripts/experiment_598_hisr_dwave.py:\n\
