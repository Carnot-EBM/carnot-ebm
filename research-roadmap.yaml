      CONTEXT:
      Rule 3 (CLAUDE.md Decentralization): "Distribution mirroring for any published artifact.
      HuggingFace as primary channel + IPFS as secondary channel."

      exp2614 (.250) added a citation stub and attempted IPFS pin. This task:
      1. Updates HF model card with adversarially-validated v9 AUROC
      2. Verifies the IPFS CID is accessible (not just claimed as pinned)
      3. Updates README Distribution Channels section

      EXISTING CODE TO READ FIRST:
      - results/experiment_2614_hf_model_card_ipfs.json (or exp2614 artifact)
      - results/experiment_2622_ensemble_v9_adversarial_val.json (v9 AUROC for model card)

      TASK: Post-v9 distribution update and IPFS CID verification.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. Network available: `curl -sf -o /dev/null https://huggingface.co/api/models` succeeds.
