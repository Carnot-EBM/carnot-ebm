    - experiment_id: exp706-gemma4-vr-diagnostic
      verdict: failure_mode_identified
      addressed_by: "FALSE-POSITIVE SCOPE MATCH. exp706 was a Gemma-4 visual-reasoning prompt diagnostic — investigating why VR prompts produce specific failure modes. exp1090 is an instrumentation library for verifier metrics. Different code path, different model class, different research question. Conductor's name-similarity matcher tripped on the keyword 'diagnostic' alone."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    CLAUDE.md Phase Prototype + Empirical Validation + Adversarial Check Discipline (MANDATORY):
    Every phase prototype must include diagnostic instrumentation for ALL theoretical concerns
    before scaling. Currently this instrumentation does not exist as a shared library.

    Milestone .84 also revealed that the planner consistently omits required prior_failures
    YAML declarations. A validation scan of research-complete.yaml is needed to confirm that
    .85 roadmap YAML has properly declared prior_failures for all carry-forward experiments.

    EXISTING CODE TO READ FIRST:
    - python/carnot/eval/ (list existing evaluation modules — look for any alpha_t or diagnostics)
    - python/carnot/eval/phi_test.py (Phi measurement module — understand existing patterns)
    - python/carnot/models/sos_kan.py (SOSKANEnergyV3 — the verifier to instrument)
    - research-roadmap-next.yaml (the .85 roadmap — read the prior_failures declarations)
    - results/experiment_1089_milestone_retro_84.json (understand what was blocked in .84)

    TASK PART 1 — DIAGNOSTIC LIBRARY:
    Create python/carnot/eval/diagnostics.py with the following classes:

    class AlphaT:
        """
        Tracks the fraction of training data that comes from exogenously-grounded
        sources (verifier signal vs. model self-generation). Per Zenil Theorem 5:
        inf_t alpha_t > 0 required for self-distillation convergence.
        Usage: alpha = AlphaT(); alpha.record(n_verified=45, n_self=55); print(alpha.current())
        """
        def __init__(self): self.total = 0; self.verified = 0
        def record(self, n_verified: int, n_self: int) -> None: ...
        def current(self) -> float: ...  # verified / total
        def series(self) -> list[float]: ...

    class KLDivergenceEstimator:
        """
        Estimates KL(P || Q) from finite samples using the Kullback-Leibler
        plug-in estimator with Laplace smoothing. Used to compare FPGA sampler
        distribution vs. correct CPU Gibbs distribution (Phase 2a audit).
        """
        def estimate(self, p_samples: np.ndarray, q_samples: np.ndarray,
                     n_bins: int = 50) -> float: ...
        def kl_confidence_interval(self, n_samples: int, alpha: float = 0.05) -> float: ...

    class NullSpaceEstimator:
        """
        Estimates the dimension of the joint kernel ∩_i ker(E_i) for k verifiers.
        Method: PCA on residuals — vectors where all verifiers score near-zero.
        Uses r-correlation metric from arXiv 2604.12086 to measure verifier diversity.
        """
        def fit(self, X: np.ndarray, verifier_scores: np.ndarray) -> None: ...
        def joint_null_space_fraction(self) -> float: ...  # dim(∩_i ker E_i) / dim(input space)
        def r_correlation(self, i: int, j: int) -> float: ...  # correlation between verifier i and j

    class DecodedTextDiversity:
        """
        Measures diversity of decoded text outputs — prevents degenerate decoder collapse.
        Entropy-based: E_diversity = -Σ p(token) log p(token) across k generated samples.
        Low diversity = decoder is ignoring bottleneck and using LM prior alone.
        """
        def compute(self, texts: list[str]) -> float: ...  # normalized entropy in [0,1]
        def is_degenerate(self, threshold: float = 0.3) -> bool: ...

    Include test utilities:
    def make_test_verifiers(n: int = 3) -> list[callable]:
        """Returns n simple test verifiers for unit testing diagnostics."""

    TASK PART 2 — WRITE TESTS (100% coverage, at least 6):
    tests/python/test_diagnostics.py:
    - alpha_t_tracks_verified_fraction_correctly
    - alpha_t_returns_zero_for_no_verified_examples
    - kl_divergence_is_zero_for_identical_distributions
    - kl_divergence_is_positive_for_different_distributions
    - null_space_fraction_is_small_for_diverse_verifiers
    - null_space_fraction_is_large_for_correlated_verifiers
    - decoded_text_diversity_is_low_for_repeated_outputs
    - decoded_text_diversity_is_high_for_diverse_outputs

    TASK PART 3 — PRIOR FAILURES SCAN:
    Read research-roadmap-next.yaml (the .85 roadmap).
    For each task with carry-forward scope, verify prior_failures is declared.
    Report: n_tasks_checked, n_tasks_with_prior_failures, any_missing.
    If any task is missing prior_failures: flag it (do NOT block the experiment, just report).

    CONCRETE STEPS:
    - python -c "import os; files = os.listdir('python/carnot/eval/'); print(sorted(files))"
    - (read existing eval modules for patterns)
    - (implement python/carnot/eval/diagnostics.py)
    - JAX_PLATFORMS=cpu python -c "from python.carnot.eval.diagnostics import AlphaT, KLDivergenceEstimator, NullSpaceEstimator; print('imports OK')"
    - JAX_PLATFORMS=cpu pytest tests/python/test_diagnostics.py -v --cov=python/carnot/eval/diagnostics
    - (scan research-roadmap-next.yaml for prior_failures completeness)
    - Write results/experiment_1090_diagnostic_instrumentation_library.json

    ARTIFACT FIELDS:
    - diagnostics_library_written: bool
    - diagnostics_library_path: str ("python/carnot/eval/diagnostics.py")
    - classes_implemented: list[str] (AlphaT, KLDivergenceEstimator, NullSpaceEstimator, DecodedTextDiversity)
    - tests_written: int
