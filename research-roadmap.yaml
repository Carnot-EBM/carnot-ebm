    \ unified flow + EBM framework; flow trajectory follows energy gradient with thermodynamic\
    \ noise toward low-energy regions.\n\nGenerative Thermodynamic Computing (arXiv 2506.15121):\
    \ Langevin dynamics from thermodynamic free energy; training minimizes heat emission by\
    \ reversing noising trajectories. Provides physically-motivated temperature schedule.\n\n\
    This experiment improves Exp 435a by using Langevin dynamics + Energy Matching trajectories\
    \ instead of pure gradient descent. Target: L2 < 0.5 (vs 2.69).\n\nCPU-only. Phase 3 seed work.\n\n\
