- id: exp963-math-repair-sota-v3-retry
  milestone: 2026.04.75
  deliverable: results/experiment_963_math_repair_sota_v3_retry.json
  title: "Math Repair SOTA v3 — Retry with Prior-Failures + External Scratchpad"
  prompt: |
    CONTEXT:
    Exp 953 (Math Repair SOTA v3) was blocked in .74 by the gate-checker because it matched
    6 prior experiments with the same scope and had no prior_failures field. This retry includes
    the complete prior_failures documentation required by the gate-checker. Additionally, it
    incorporates the external scratchpad approach from arXiv 2604.17121 (Mozer et al.) which
    explains WHY math repair has zero improvement: each retry's diagnostic state is lost into
    deep layers. The fix: re-feed prior-attempt errors as input text (external scratchpad).

    Prior failures in this domain:
    - Exp 930 (math-iterative-self-repair-v1): verdict=math_repair_zero; E4B model ceiling (12% baseline)
    - Exp 943 (math-repair-external-scratchpad): verdict=blocked_gate_check_failed; missing prior_failures
    - Exp 953 (math-repair-sota-v3): verdict=blocked_gate_check_failed; same root cause

    This attempt differs: (a) SOTA Gemma4-31B-it-GGUF (75%+ GSM8K baseline vs 12% for E4B);
    (b) external scratchpad feeds prior-attempt error text into the next attempt's prompt;
    (c) mandatory result-write guard wraps all code so a partial artifact is always written.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_930_math_iterative_self_repair_v1.py (baseline pattern to extend)
    - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline API)
    - scripts/experiment_template.py (ExperimentTemplate, BatchedInferenceRunner)

    TASK:
    Run IterativeSelfRepair with external scratchpad on 50 GSM8K math problems:
    1. Load Gemma4-31B-it-GGUF on ROCm GPU (sg render -c '...')
    2. Baseline pass: run 50 questions, record baseline_accuracy = correct/50
    3. For each wrong answer, generate a scratchpad: re-feed prior attempt's errors as input
       text: "Previous attempt was wrong. The error was: [error description]. Now try again."
    4. Measure repair_accuracy = correct_after_repair/total_repaired
    5. If delta == 0 with SOTA model: write honest_verdict=sota_ceiling_confirmed; retire the
       math-repair-iterative line entirely.

    MANDATORY: Wrap ALL code in:
      try:
        [experiment code]
        write success artifact
      except Exception as e:
        write partial artifact with status=blocked, stall_details=str(e)
        raise

    MODEL_SPECS:
      primary: unsloth/gemma-4-31B-it-GGUF
      fallback: unsloth/Qwen3.6-35B-A3B-GGUF

    Use BatchedInferenceRunner(batch_size=8). Pre-warm via tmpl.setup_gpu(MODEL_SPECS).
    Write results/experiment_963_math_repair_sota_v3_retry.json with schema:
      baseline_accuracy: float
      repair_accuracy: float
      repair_delta: float
      n_problems: int
      model_used: str
      scratchpad_used: bool
      honest_verdict: str

    Run: python scripts/experiment_963_math_repair_sota_v3_retry.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: critical
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 90
  prior_failures:
  - experiment_id: exp759-iterative-code-repair-live
    verdict: code_repair_zero
    addressed_by: "Exp 963 targets MATH domain (GSM8K), not code; different task structure"
