  - id: exp3647-fr11-continuous-self-learning-v8-online-correlation-aware
    operator_override: "2026-05-29 operator directive (standing): mandatory continuous-self-learning continuation (FR-11 vN+1) with a STATED forward difference (online CORRELATION-AWARE verifier weighting — down-weight redundant verifiers using the exp3644 matrix, not just noisy ones — closing Weaver's no-online-adaptation gap, with a conservative-default/uncertainty rule that prevents collapse) — false-positive scope-match vs prior fr11 exps; the .333 exp3632 crashed on the gemini quota wipeout and never ran."
    milestone: "2026.06.334"
    title: "FR-11 continuous self-learning v8 — online CORRELATION-AWARE verifier weighting without collapse (closes Weaver's no-online-adaptation gap)"
    priority: medium
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # gemini quota exhausted crashed the .333 version (exp3632); codex 0.135.0 verified working; requires_codex bypasses GEMINI_FORCE
    estimated_wall_time_min: 18
    track: self-learning
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3647_fr11_continuous_self_learning_v8.json
    prompt: |
      CONTEXT: every milestone includes one continuous-self-learning experiment. Forward difference from the
      prior FR-11 deploy (exp3604, v6): instead of only down-weighting NOISY verifiers, update weights ONLINE to
      down-weight REDUNDANT verifiers (high conditional correlation given the label -- the matrix exp3644
      measures), under a conservative-default / uncertainty-gated rule that provably prevents collapse. This
      closes Weaver's no-online-adaptation gap. Keep pass_rate vs true_accuracy element-wise distinct (de-flag
      tautology).
      EXISTING CODE TO READ FIRST: results/experiment_3604_fr11_continuous_self_learning_v6 (the prior FR-11
      deploy) + results/experiment_3644 (the correlation matrix, if landed) via scripts/summarize_artifact.py;
      the FR-11 module + cached traces.
      PRECONDITIONS (step 0): FR-11 module + cached traces present; if exp3644's correlation matrix landed, use
      it to seed the redundancy penalty, else compute correlation inline. If neither FR-11 module nor traces
      present -> "complete: blocked_fr11_module_or_traces_unavailable".
      CONCRETE STEPS:
        1. Run the closed FR-11 loop to N>=200 on a fresh non-degenerate corpus; deploy arm = conservative-
           default + correlation-aware redundancy penalty, control arm = naive online update (beta=0, no penalty).
        2. Measure ensemble AUROC + calibration (Brier/ECE) before vs after online adaptation; measure whether
           the redundancy penalty improves AUROC over the noise-only weighting.
        3. Confirm: deploy arm prevents collapse, control arm collapses, quality maintained, distinct-arrays
           assert holds.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; store the VALUE):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores cached traces; no LLM load)."
        n_online_updates:
          principle: "Sample-size of the self-learning sweep (>=200)."
        collapse_detected_deploy_arm:
          principle: "The conservative-default + correlation-aware rule must prevent self-distillation collapse (alpha_t grounding)."
        collapse_detected_control:
          principle: "Positive control: the naive online arm must collapse, else the test has no contrast."
        correlation_aware_auroc_gain:
          principle: "The forward difference -- does down-weighting redundant (not just noisy) verifiers improve AUROC?"
        calibration_improved:
          principle: "Brier/ECE before vs after online adaptation."
        pass_rate_vs_true_accuracy_distinct_assert:
          principle: "De-flags the tautology where pass_rate and true_accuracy are the same array."
        quality_maintained:
          principle: "Collapse-prevention must not come at the cost of detector quality."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "collapse_detected_deploy_arm == false AND collapse_detected_control == true AND pass_rate_vs_true_accuracy_distinct_assert == true"
          principle: "Self-learning is validated only when the guarded arm holds, the control collapses, and the two metrics are genuinely distinct (not a tautology)."
      TERMINAL VERDICTS: "complete: fr11_v8_online_correlation_aware_weighting_holds_no_collapse_quality_maintained" /
      "complete: fr11_v8_correlation_penalty_no_auroc_gain_noise_only_weighting_sufficient" /
      "complete: blocked_fr11_module_or_traces_unavailable"
      Run: cd {project_root} && python scripts/experiment_3647_fr11_continuous_self_learning_v8.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

