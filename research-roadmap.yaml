    title: "Phase 4: Lagrange Oscillatory Neural Networks (LagONN) Prototype"
    agent_type: codex
    max_turns: 40
    prompt: |
      CONTEXT: LagONN applies Lagrange multipliers to ONNs to guide toward feasible states for Max-3-SAT.
      EXISTING CODE TO READ FIRST: python/carnot/models/
      TASK: Prototype a LagONN solver for constraint satisfaction.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1675_lagonn.py`.
      2. Implement a Lagrange oscillator logic for a toy Max-3-SAT instance.
      3. Compare convergence against standard Ising soft penalties.
      4. Write `{project_root}/results/experiment_1675_lagonn.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

