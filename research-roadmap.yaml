    REQUIRED ARTIFACT FIELDS (principle-annotated):
      honest_verdict:
        principle: "terminal prefix; success_moat_harness_built_smoke_green."
      harness_module_path:
        principle: "python/carnot/moat_benchmark_harness.py -- the reusable library the D arms import (no duplicated metric code)."
      corpora_available:
        principle: "the list of loadable headroom-candidate corpora (MuSR + the 2nd-corpus options) so D4 can pick a confirmed-cached second corpus."
      tuned_sc_smoke:
        principle: "the TUNED self-consistency accuracy on the smoke slice -- the baseline to beat is tuned, not naive SC (headroom-control)."
      oracle_at_k_smoke:
        principle: "the selectable-headroom ceiling; (oracle@K - tuned_sc) is the headroom a verifier could capture."
      headroom_present_smoke:
        principle: "(oracle@K - tuned_sc) >= 0.10 AND flips>0 -- the FALSE_NEGATIVE_RISK guard a null must clear to be informative."
      oracle_distinctness_enforced:
        principle: "true -- the harness raises if a scorer reads gold/answer_index/model_id (verifier_is_oracle=False is mechanically enforced)."
      inference_substrate:
        principle: "verifier_ensemble_against_cached_candidates (scores cached candidates; 1s floor) -- no new LLM generation in the smoke."
      random_seed:
        principle: "determinism for the bootstrap CI + the smoke."
      preconditions_checked:
        principle: "records corpus/candidate-cache checks; a missing corpus emits blocked_, never a fabricated metric."

