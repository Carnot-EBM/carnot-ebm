      "status": "in_progress",
      "boltzmann_gpt_auroc_measured": false,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - python/carnot/phase3/continuous_ebm.py (ContinuousEBM, NRGPT integration from exp1163)
    - python/carnot/models/boltzmann.py (BoltzmannEBM — Carnot's existing Boltzmann tier)
    - results/experiment_1163_nrgpt_energy_prototype.json (NRGPT AUROC on FoVer traces)

    TASK:
    1. Write skeleton artifact (STEP 0).
    2. Read the NRGPT AUROC from exp1163: nrgpt_auroc = exp1163.get('nrgpt_auroc', ???)
    3. Implement BoltzmannGPTLayer in python/carnot/phase3/continuous_ebm.py:
       class BoltzmannGPTLayer:
         """Energy recurrence block inspired by arXiv 2601.17094 Boltzmann-GPT.

         Uses visible-hidden Boltzmann coupling: E(v,h) = -v^T W h - b^T v - c^T h.
         For a sequence of tokens, compute the energy of the visible-token state v conditioned
         on a learned hidden representation h. Higher energy = lower Boltzmann-GPT score.
         """
         def __init__(self, hidden_dim=16, visible_dim=16):
             self.W = zeros((visible_dim, hidden_dim))  # coupling matrix
             self.b = zeros(visible_dim)                # visible bias
             self.c = zeros(hidden_dim)                 # hidden bias

         def energy(self, v: ndarray[visible_dim], h: ndarray[hidden_dim]) -> float:
             """Boltzmann energy: E = -v^T W h - b^T v - c^T h"""
             return -(v @ self.W @ h) - (self.b @ v) - (self.c @ h)

         def score(self, token_sequence: list[str]) -> float:
             """Score a token sequence: lower energy = higher Boltzmann-GPT score."""
             v = self._embed_tokens(token_sequence)
             h = self._infer_hidden(v)
             return -self.energy(v, h)  # higher = more likely

    4. Test on 20 FoVer holdout examples:
       For each example (response_text, z3_label):
