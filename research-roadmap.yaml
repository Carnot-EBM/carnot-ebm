  - id: exp6437-generation-to-verdict-receipt-replay-contract
    milestone: "2026.08.554"
    deliverable: results/experiment_6437_generation_to_verdict_receipt_replay_contract.json
    title: "Gated on Exp6436 readiness: generation-to-verdict receipt and replay contract"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 90
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6436-v554-terminal-handoff-and-queue-preflight
        artifact_field: v554_queue_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      V553 authenticated task-level model execution, but a final exact score can still hide whether bytes changed at raw generation, factor compilation, checker transport, checker output, or final verdict. QuoteBench (arXiv:2608.13547) shows that matched aggregate scores can hide command-path failures. V554 needs a reusable immutable path receipt before attributing causal factor effects. This task may add a narrow helper and tests, but it must not modify the conductor. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6426_task_scoped_runtime_receipt_contract.json and source
      - {project_root}/results/experiment_6427_fresh_constraint_saturation_factor_corpus.json and {project_root}/results/experiment_6428_clean_write_time_factor_admission_ab.json
      - {project_root}/scripts/experiment_template.py, {project_root}/scripts/adversarial_verify.py, and {project_root}/scripts/verdict_row_consistency_lint.py
      - existing atomic-write, hash, subprocess, exact-checker, and receipt helpers under {project_root}/python/carnot
      - {project_root}/openspec/capabilities/verification/spec.md and relevant runtime receipt requirements
      - {project_root}/ops/e2e-test-plan.md

      TASK
      Build and validate a versioned generation-to-verdict receipt that binds raw generation bytes, compiled factor support, checker transport input, checker output, and final verdict. Use immutable V553 fixture bytes and deterministic exact validators. Do not execute an LLM in this task. Prove boundary localization with identity, injected-wrapper, and restored-wrapper replay controls.

      CONCRETE STEPS
      0. PRECONDITIONS: require Exp6436 v554_queue_ready_score=1.0, readable nonzero V553 fixture artifacts, monotonic clock, atomic local storage, and exact checker imports. On failure, write blocked_reason and gate_check_summary and stop scientific work.
      1. Add or update the relevant REQ-* and SCENARIO-* before implementation. Write focused tests first.
      2. Define a versioned path receipt with task and unit IDs, stage name, input and output byte counts, SHA-256 hashes, parent-child PID, command and config hashes, monotonic times, exit status, exception, and predecessor-stage hash.
      3. Implement the smallest reusable helper outside scripts/research_conductor.py. It must write atomically, preserve partial receipts, reject stage reordering, and reject a final verdict whose chain is incomplete.
      4. Freeze at least 12 independent V553 fixture units. Replay each through three matched arms: identity path, one deliberately injected serialization or wrapper fault, and a restored path. Use the same final exact validator in every arm.
      5. Emit per_unit_rows with every stage hash, changed boundary, exact final outcome, localization result, and replay determinism. Recompute aggregate detection and false-localization rates only from rows.
      6. Attack hash reuse, missing stage, stage reorder, stale predecessor, byte truncation, encoding change, forged PID, checker-output substitution, final-verdict substitution, atomic-write interruption, and wrapper disclosure without byte change.
      7. Require every injected fault to localize to the first changed boundary, every identity and restored replay to match, no final verdict to bypass an incomplete chain, and no false boundary localization.
      8. Run focused tests, applicable E2E checks, spec coverage, artifact convention, row consistency, adversarial verification, determination preservation, and root-clutter checks.
      9. Set command_path_receipt_ready_score=1.0 only when all controls and critical attacks pass.

      Required deliverable: {project_root}/results/experiment_6437_generation_to_verdict_receipt_replay_contract.json.
      REQUIRED ARTIFACT FIELDS:
      status, receipt_schema_version_and_hash, helper_source_and_test_hashes, frozen_fixture_manifest_and_hash, stage_contract, per_unit_rows, identity_injected_and_restored_control_rows, path_stage_hash_chains, exact_final_outcomes, first_changed_boundary_by_unit, replay_determinism_by_unit, injected_fault_detection_rate, false_localization_count, incomplete_chain_rejection_count, atomic_interruption_recovery, attack_matrix, command_path_receipt_ready_score, current_adversarial_findings, changed_files_and_hashes, protected_files_unchanged, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for the deterministic exact final-state validator, never for path authentication itself. per_unit_rows must contain one row per fixture and arm with all stage hashes and the exact outcome. field_principles must map every required field and the command_path_receipt_ready_score gate. field_provenance must classify every required field. If honest_verdict starts blocked_, gate_check_summary must name the failed check, expected condition, observed value, and evidence path. Otherwise honest_verdict must use a terminal success prefix.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6437_generation_to_verdict_receipt_replay_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6438-powered-verification-cost-repair-ab
    milestone: "2026.08.554"
    deliverable: results/experiment_6438_powered_verification_cost_repair_ab.json
    title: "Gated on Exp6437 readiness: powered verification-cost repair A/B"
    priority: critical
    track: verification
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6437-generation-to-verdict-receipt-replay-contract
        artifact_field: command_path_receipt_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6429-constraint-saturation-verification-cost-ab
        verdict: "complete: selective verification matched always-refine accuracy with lower median and tail cost"
        addressed_by: "This repair measures real monotonic checker work through the path receipt, uses at least five distinct source rows per cost cell, forbids synthetic or near-zero timing, and requires a clean current adversarial result."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6429 reported parity accuracy and lower checker work for selective verification, but its scientific claim is ineligible. The artifact has DURATION_TOO_SHORT and 96 underpowered cost cells. V553's capstone requires one clean rerun with measured deterministic duration and at least five rows per cell. This task changes the evidence substrate, not the exact authority or the research question. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6427_fresh_constraint_saturation_factor_corpus.json
      - {project_root}/results/experiment_6429_constraint_saturation_verification_cost_ab.json and its source and tests
      - {project_root}/results/experiment_6435_v553_adversarial_capstone.json
      - {project_root}/results/experiment_6437_generation_to_verdict_receipt_replay_contract.json and source
      - {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/verdict_row_consistency_lint.py, and exact checker implementations
      - {project_root}/openspec/capabilities/verification/spec.md and {project_root}/ops/e2e-test-plan.md

      TASK
      Rerun the V553 verification-cost question on the sealed clean factor corpus with a powered deterministic workload. Compare never-refine, always-refine, and exact-triggered selective arms under fixed budgets. Preserve exact release authority. Produce enough distinct rows to estimate each reported constraint-count, interaction, budget, and arm cell without duplication.

      CONCRETE STEPS
      0. PRECONDITIONS: require command_path_receipt_ready_score=1.0, readable Exp6427 per-unit rows and exact bindings, monotonic high-resolution timing, sufficient CPU and RAM, and no stale output path. Fail closed before measurement if any input hash differs from the sealed receipt.
      1. Update REQ-* and SCENARIO-* for powered verification-cost evidence before code. Write focused tests first.
      2. Freeze the source-row roster, arm assignment, constraint-count bins, interaction classes, budgets, and exclusion rules before timing. Use at least five distinct source row IDs in every reported cost cell. Repeated calls on one source row do not increase cell sample size.
      3. Run never-refine, always-refine, and exact-triggered selective verification with the same exact checker and fixed source rows. A selective arm may abstain or escalate. It may not turn an exact rejection into acceptance.
      4. Measure real monotonic phase intervals for input materialization, exact checks, routing, and artifact reduction. Run enough genuine checker work for total measured experiment work to exceed 1.0 second. Do not sleep, synthesize duration, copy a timestamp, or count setup outside the task.
      5. Emit per_unit_rows with source ID, arm, model family inherited from the sealed row, constraint bin, interaction, budget, exact outcome, accept or abstain decision, checker calls, monotonic start and end, elapsed time, path receipt hashes, and exclusion reason.
      6. Recompute exact accuracy, false accepts, abstention, checker calls, median and tail time, cost errors, and cell counts from rows. Report uncertainty over distinct source rows, not repeated calls.
      7. Attack zero and copied timings, row duplication, missing cost cells, selective false accept, budget overrun, changed exact checker, stage-hash break, aggregate-row mismatch, and timing that includes sleep or unrelated setup.
      8. Run unit tests, the powered control, E2E checks, spec coverage, row consistency, current adversarial verification, determination preservation, and root-clutter checks.
      9. Set verification_cost_ready_score=1.0 only if selective accuracy equals always-refine accuracy, false accepts do not increase, selective checker calls or measured exact-verification time decrease, every reported cell has at least five distinct rows, all aggregates recompute, duration is eligible, and critical adversarial findings are zero.

      Required deliverable: {project_root}/results/experiment_6438_powered_verification_cost_repair_ab.json.
      REQUIRED ARTIFACT FIELDS:
      status, sealed_source_manifest_and_hash, exact_checker_hashes, arm_budget_and_cell_precommitment, per_unit_rows, distinct_source_rows_per_cell, underpowered_cell_count, never_always_selective_exact_accuracy, never_always_selective_false_accepts, abstention_by_arm_and_cell, checker_calls_by_arm_and_cell, measured_time_by_arm_and_cell, verification_cost_errors_by_arm_and_cell, uncertainty_over_distinct_sources, path_receipt_hashes_by_unit, duration_phase_receipts, synthesized_or_sleep_duration_count, aggregate_row_recomputation, attack_matrix, current_adversarial_findings, verification_cost_ready_score, protected_files_unchanged, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for the deterministic exact checker. per_unit_rows must contain each distinct source, arm, budget, exact outcome, checker work, timing, and path hashes. field_principles must map every required field and every acceptance condition in verification_cost_ready_score. If honest_verdict starts blocked_, gate_check_summary must identify the failed check and observed evidence. Otherwise honest_verdict must use a terminal success prefix and must not repeat the Exp6429 verdict unless the same evidence defect really recurs.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6438_powered_verification_cost_repair_ab --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6439-factor-clause-influence-ab
    milestone: "2026.08.554"
    deliverable: results/experiment_6439_factor_clause_influence_ab.json
    title: "Gated on Exp6437 readiness: active, ablated, tombstoned, and placebo factor influence A/B"
    priority: critical
    track: verification
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 420
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6437-generation-to-verdict-receipt-replay-contract
        artifact_field: command_path_receipt_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Exp6428 proves a narrow association: exact-admitted factors improve future exact yield without contamination. It does not prove that factor content caused the outcome. A stored factor may be dead prompt text, or path transport may create the difference. Dead text or binding clause? (arXiv:2608.12599) proposes executable clauses, tombstones, compilation, and sequential ablation. V554 applies that black-box causal control to Carnot's exact-admitted factor memory. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md V554 planner refresh
      - {project_root}/results/experiment_6427_fresh_constraint_saturation_factor_corpus.json and source
      - {project_root}/results/experiment_6428_clean_write_time_factor_admission_ab.json and source
      - {project_root}/results/experiment_6437_generation_to_verdict_receipt_replay_contract.json and source
      - {project_root}/scripts/experiment_template.py and its cached_sota_pair() example
      - {project_root}/python/carnot/inference/sota_models.py and local llama.cpp GGUF helpers
      - exact factor, constraint, ledger, and checker code under {project_root}/python/carnot
      - {project_root}/openspec/capabilities/verification/spec.md and relevant memory specs
      - {project_root}/ops/e2e-test-plan.md

      TASK
      Measure whether exact-admitted factor clauses causally change future exact outcomes. Generate new matched outputs under active factor, sequential clause ablation, tombstone, no-factor, and length-matched placebo arms. Use all three mandatory local GGUF families as headline models. Keep task, target constraints, decoding budget, exact checker, and command path fixed within each matched unit.

      CONCRETE STEPS
      0. PRECONDITIONS: require command_path_receipt_ready_score=1.0; both RTX 3090 devices; sufficient free VRAM, RAM, disk, and wall-clock budget; cached model files; llama.cpp CUDA; embedded tokenizer metadata; monotonic clocks; unique output paths; and exact checker imports. If any headline model cannot run locally with authenticated CUDA evidence, fail closed.
      1. Update causal-factor REQ-* and SCENARIO-* before implementation. Write focused tests first.
      2. Define MODEL_SPECS with unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Resolve them with cached_sota_pair(), use embedded GGUF tokenizers, and never call AutoTokenizer.
      3. Freeze at least 24 independent development targets per model family. Give every factor clause an executable checker and stable clause ID. Seal targets, arm assignment, seeds, prompts, decoding budgets, and analysis before generation.
      4. For each matched unit, generate five fresh arms: fully active exact-admitted factor; one-clause-at-a-time ablation; explicit tombstone for an inapplicable or revoked clause; no factor; and length-matched semantically inert placebo. Never reuse raw output bytes across arms or units.
      5. Compile active ledger state ahead of generation. Preserve tombstones and applicability conditions. Keep the final target constraints and exact checker identical across matched arms.
      6. Bind model bytes, embedded tokenizer, prompt, ledger, compiled support, raw generation, checker transport, checker output, process, GPU samples, and final verdict through the Exp6437 receipt.
      7. Emit per_unit_rows with target, model, arm, clause state, prompt and output hashes, all path-stage hashes, exact clause outcomes, joint exact outcome, abstention, checker calls, and timing. Compute each clause's incremental exact effect by sequential ablation.
      8. Report active-over-ablated, active-over-no-factor, active-over-placebo, and tombstone relapse effects with paired uncertainty. Separate constraint knowledge availability from observed factor use. Do not use an LLM judge, logprob release score, or hidden-state scorer.
      9. Attack prompt-length confounding, output reuse, arm leakage, dead clause, stale tombstone, checker drift, path-stage mutation, factor overriding exact rejection, aggregate-row mismatch, CPU fallback, and underpowered cells.
      10. Run focused tests, live CUDA runs, E2E checks, spec coverage, row consistency, current adversarial verification, determination preservation, and root-clutter checks.
      11. Set factor_influence_ready_score=1.0 only if the paired active-over-ablated exact effect is positive with reported uncertainty, active factors do not increase false accepts, the placebo does not reproduce the active effect, tombstones block stale influence, all three models have eligible rows, all aggregates recompute, and critical findings are zero.

      Required deliverable: {project_root}/results/experiment_6439_factor_clause_influence_ab.json.
      REQUIRED ARTIFACT FIELDS:
      status, MODEL_SPECS, models_used, cached_sota_pair_receipts, model_file_and_embedded_tokenizer_hashes, autotokenizer_usage_count, device_and_runner_receipts, sealed_target_arm_and_analysis_manifest, executable_clause_registry_and_hash, compiled_ledger_contract, per_unit_rows, per_clause_sequential_ablation_rows, active_ablated_tombstoned_no_factor_and_placebo_exact_outcomes, joint_exact_outcomes_by_arm_and_model, false_accepts_and_abstentions_by_arm, incremental_exact_effect_by_clause, paired_effects_and_uncertainty, placebo_control_result, tombstone_relapse_result, command_path_receipts_by_unit, raw_output_reuse_count, cpu_fallback_count, aggregate_row_recomputation, attack_matrix, current_adversarial_findings, factor_causal_delta, factor_influence_ready_score, protected_files_unchanged, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for executable exact clause and joint checkers. Models, factors, ablation effects, and path receipts are not oracles. per_unit_rows must carry one row per target, model, arm, and clause state. field_principles must map every required field and each factor_influence_ready_score condition. If honest_verdict starts blocked_, gate_check_summary must name the failed precondition or gate, observed value, expected condition, and evidence path. Otherwise honest_verdict must use a terminal success prefix.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6439_factor_clause_influence_ab --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6440-held-factor-revocation-binding-shift-ab
    milestone: "2026.08.554"
    deliverable: results/experiment_6440_held_factor_revocation_binding_shift_ab.json
    title: "Gated on Exp6439 influence: held factor revocation and binding-shift A/B"
    priority: critical
    track: verification
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 420
    agent_type: codex
    model: gpt-5.5
    gated_on:
