  - id: exp357-llm-guided-z3-formalization
    milestone: "2026.05.20"
    deliverable: python/carnot/pipeline/llm_z3_formalizer.py
    title: "Exp 357: LLM-guided Z3 formalization — arXiv 2601.04675 approach for 80% improvement on ambiguous arithmetic"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Research-program.md Goal #1a: "NSVIF/Z3 SMT approach (arxiv 2601.17789):
      Formalize constraints as first-order logic, solve with Z3. Zero false positives by design."
      The related arXiv 2601.04675 (LLM-guided SMT) shows 80% improvement in Z3 success rate
      when an LLM rewrites ambiguous arithmetic into explicit Z3 assertion syntax.

      Current NL2Z3Extractor (Exp 310) produces Z3 assertions from natural language but fails
      on instruction-tuned output formats (markdown, numbered steps, mixed prose). LLM-guided
      formalization is different: instead of one LLM call producing both extraction AND
      formalization, the LLM receives the raw response text and outputs ONLY Python z3-syntax
      assertion strings. A second pass runs Z3. This separation reduces hallucination in the
      formalization step.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/nl2z3_extractor.py — NL2Z3Extractor (Exp 310)
      - python/carnot/pipeline/verge_refiner.py — VergeRefiner (Exp 334)
      - python/carnot/pipeline/extract.py — ConstraintExtractor protocol
      - python/carnot/pipeline/llm_extractor.py — LLMExtractor (Exp 356)

      TASK: Implement LLMz3Formalizer as complement to LLMExtractor.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-EXTRACT-019 (LLM-guided Z3 formalization), REQ-EXTRACT-020 (zero-FP Z3 path),
         SCENARIO-EXTRACT-039/040/041 to
         openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - Z3FormalizationResult: dataclass (z3_code, z3_result, n_assertions, is_sat,
           formalization_mode, source_response_length)
         - LLMz3Formalizer(llm_caller, model_id, max_iterations=2)
         - LLMz3Formalizer.formalize(question, response) → Z3FormalizationResult
         - LLMz3Formalizer.formalize: prompt LLM to produce Python z3 snippet;
           exec() the snippet in a sandbox; catch Z3 SAT/UNSAT; return result
         - exec() sandbox: only z3 module allowed; no os, sys, subprocess imports
           (NameError if attempted — security constraint)
         - CI-safe: when llm_caller is None, return hardcoded Z3 snippet for testing
         - build_z3_formalization_prompt(question, response) → str: structured prompt
