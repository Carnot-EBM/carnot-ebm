milestone: 2026.09.657
milestone_title: Measured window calibration, causal online updates, and recovered live-agent evidence
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp7503-contract-methods
  title: Bind thirteen tasks and ingest methods against terminal V656 evidence
  phase: 1
  track: reporting
  priority: high
  requires_gpu: false
  max_turns: 20
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.657
  deliverable: results/experiment_7503_v657_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  prior_failures:
  - experiment_id: exp7461-contract-methods
    verdict: complete_null_v654_contract_methods_ingested
    addressed_by: Prior reporting null completed its method map; this new contract binds V657 authorities, new methods
      and V656 raw-versus-terminal dispositions. Preserve null as reporting completion, never relabel it scientific
      failure.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.657. V656 has nine terminal producer artifacts and five absent producer paths. Exp7499 also has 18 completed raw episodes and an unpromoted candidate. Establish exact custody without treating raw completion as validated science.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/experiment_7358_v646_validation_contract.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/python/carnot/experiment_7489_v656_contract_methods.py
    - {project_root}/python/carnot/experiment_7502_v656_capstone.py
    - {project_root}/results/experiment_7502_v656_capstone.json
    - {project_root}/ops/known-issues.md
    - {project_root}/ops/north-star.md
    - {project_root}/research-references.md
    - {project_root}/research-studying.md
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7503_v657_contract_methods.json. Create scripts/experiments/experiment_7503_v657_contract_methods.py as a thin entrypoint and place only new reusable behavior in python/carnot/experiment_7503_v657_contract_methods.py; tests belong in tests/python/test_experiment_7503_v657_contract_methods.py. These TASK paths are outputs to create, not prerequisites. Reuse the earlier V657 helper outputs named below when they exist.

    CONCRETE STEPS:
    1. PRECONDITIONS: emit a flushed progress line immediately. Check the listed resources and relevant REQ-* spec before any measurement. Earlier V657 outputs are inputs only after their producers run. If an external prerequisite is absent, emit complete_blocked_<reason>, verdict_class=blocked and gate_check_summary with the exact observed failure; do not invent a result.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. In long loops print completed units and monotonic elapsed at least every 60 seconds. Stream child stdout unbuffered and send truthful pending-operation heartbeats every 60 seconds. Keep EVERY gap below 600 seconds: a silent task can die at 1200 seconds; continuing progress permits the 4800-second hard cap. Checkpoint completed work and terminate only owned processes.
    3. Keep each tool call small. Write ANY file over about 200 lines in several tool calls, preferably chunks of 100-150 lines, with a progress message between calls. Do not compose a module plus tests in one huge call. A heartbeat process cannot expose progress while the agent is generating one oversized tool call. Split reads, edits and checks into bounded calls too.
    4. Before implementation, extend the relevant OpenSpec REQ-* and SCENARIO-* items, then add meaningful failing tests. Reuse qualified helpers and thin entrypoints; do not copy a prior experiment main or its validation boilerplate. Preserve historical tests and their assertions. Record unrelated orphan-test baseline failures separately; do not suppress or delete tests.
    5. Declare inference_substrate_class=aggregation. Set inference_substrate=aggregation_from_upstream_artifacts EXACTLY, MODEL_SPECS=[], model_specs=[], model_invoked=false and zero current model calls. Historical evidence stays historical.
    6. Resolve the YAML by milestone: prefer research-roadmap-next.yaml only when milestone=2026.09.657, otherwise the matching active file after authorized activation. Compare the document table with all thirteen ordered task IDs, exact titles, phases, deliverables, substrate classes and gates. Reject private mutations of count, order, ID, title, path, gate field and milestone using the existing parser; do not change enforcement code.
    7. Read V656 terminal dispositions and the dated 937-second silent-authoring diagnosis. Record FAIL for Exp7495/7496 absent terminal artifacts and the retired upstream GATE_BLOCK for Exp7497/7501 as conductor statuses, not invented honest_verdict values. Hash the Exp7499 raw session/checkpoint/candidate separately. Neither the archive nor an OK marker establishes a scientific result.
    8. Ingest three to five methods from the V657 reference sweep: binary scoring-token expectation, equal detector access, aligned-versus-shuffled information, KAN retention, and whole-service hardware accounting. Read primary method sections through a bounded low-concurrency source pass. Write docs/research-notes/v657-method-map.md with source, adaptation, counterexample and named task. Mark research-studying.md entries ingested. A network failure limits that source row rather than creating fabricated content.
    9. Run unchanged roadmap schema, prior-failure, exclusion, gate, ARC-floor and overdue-priority checks. Record any real unresolved priority from ops/known-issues.md. Emit contract_ready_score and method_ingestion_complete_score independently. This advisory report is not a gate on every science branch. Do not activate, publish, or modify the active roadmap.
    10. Freeze the affected-file validation manifest and verify imports resolve to this worktree. Run scoped pytest -n 0 -o addopts= --no-cov with a private --basetemp; separately require 100 percent changed-module coverage with a command-local COVERAGE_FILE. Run scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Reuse the Exp7358/Exp7303 helpers. Do not run full_python_suite or an unscoped tests/python suite inside this task.
    11. Run the declared entrypoint and a fresh-process cold replay as capability E2E. No numbered runtime E2E applies to reporting-only work. Shared model/training/sampling changes require applicable E2E-001/002; bindings/serialization require E2E-003/004. ARC policy or transport changes require E2E-009/010, telemetry changes E2E-011, and the private LLM-off real-environment smoke from ops/e2e-test-plan.md. Retain actual outputs and scope; Rust changes also require cargo tests, fmt and clippy.
    12. Independently reduce per-unit rows, run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict against the exact candidate, and save their actual outputs. Failed required validation is disqualified; failed measured benefit is null; unchanged external absence is blocked. Atomically publish terminal JSON only after the required work and checks. Keep checkpoints outside the terminal deliverable path.
    13. Keep each committed artifact below 20 MiB with hash-bound sidecars; scratch work belongs in /tmp. Reconcile affected OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md to actual evidence. Preserve historical artifacts, generator weights, production defaults and research-roadmap.yaml. No activation, external publication, scored submission or push.

    ACCEPTANCE GATES:
    - Validity: all required scoped checks and independent replay pass. principle: favorable metrics cannot excuse invalid evidence.
    - Readiness: task-specific bare numeric ready/complete fields reflect observed completion, independent of benefit. principle: a valid null must not prevent unrelated measurements.
    - Benefit: apply the exact task thresholds below; never lower support or select favorable seeds. principle: exploratory results cannot become confirmatory claims.

    REQUIRED ARTIFACT FIELDS:
    - schema: principle: "Version, experiment_id, milestone and terminal status prevent reader drift."
    - run_date: principle: "Use {date}; retain actual UTC and monotonic timestamps and process identity."
    - preconditions_checked: principle: "Record exact paths, observed resources, input hashes and ownership before work."
    - MODEL_SPECS: principle: "Also emit model_specs. Current LLM work includes unsloth/Qwen3.8-27B-GGUF, resolved GGUF path/hash/quantization/runtime; no-load work uses []."
    - model_invoked: principle: "Separate current loads, forwards and generations from historical model provenance."
    - invocation_counts: principle: "Reconcile attempted, completed, failed, cancelled and in-flight operations; zero current calls for no-load work."
    - inference_substrate: principle: "Aggregation must spell aggregation_from_upstream_artifacts exactly; native option readout is live_llm_embedding_extraction with readout_kind=option_logits and zero generated tokens."
    - inference_substrate_class: principle: "Declare actual work: aggregation, no_model_load, model_load_no_generation (2s), model_bounded_generation (10s), or model_full_generation (60s). Never pad durations."
    - execution_venue: principle: "Current host CPU/CUDA work is distinct from archived FPGA fabric and board CPU evidence."
    - duration_s: principle: "Measure elapsed work; separate authoring, computation, validation and historical capture durations."
    - phase_spans: principle: "Flushed progress, operation heartbeats and bounded writes prevent silent timeouts."
    - random_seed: principle: "Freeze fitting, arrival, audit and bootstrap seeds before evaluation; seeds do not multiply sample size."
    - reproducibility_checksum: principle: "Bind source, data roles, settings, model identity where used, and raw evidence."
    - source_artifact_hashes: principle: "Preserve original bytes, flags and exposure history; raw checkpoints are not terminal results."
    - rows: principle: "Each independent group, game, arm or event carries metrics, failures and censoring; hash all sidecars."
    - sample_size_budget: principle: "Separate planned, attempted, completed, excluded, failed, censored and unstarted units."
    - acceptance_gate_results: principle: "Each validity, support or benefit check has expected, observed, op, passed and principle; positive requires its named claim gates."
    - gate_check_summary: principle: "Every blocked verdict names the failing check, upstream, exact field/path, expected and observed value, including missing/null."
    - honest_verdict: principle: "Use a complete_ terminal prefix. Preserve prior literal verdicts and conductor blocked_* records without rewriting them."
    - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. partial is retryable OWN unfinished work only; unchanged external absence is blocked."
    - verifier_is_oracle: principle: "Oracle-defined fixture gains are circular_positive at most. Independent human labels do not prove universal correctness."
    - flagged_adversarial: principle: "Retain actual guard findings; never clear a flag or weaken a guard to open a gate."
    - validation_receipts: principle: "Save exact scoped commands, exit codes, hashes and required-versus-baseline status."
    - field_principles: principle: "Every emitted field and acceptance gate explains the failure it prevents."
    - contract_ready_score: principle: "Bare 0/1 for exact paired authorities and mutation rejection; no scientific claim."
    - method_ingestion_complete_score: principle: "Bare 0/1 for source-grounded method dispositions."
    - task_contract_rows: principle: "Exactly thirteen ordered task identities and gates prevent document/YAML divergence."
    - prior_dispositions: principle: "Missing producers and unqualified raw work are distinct states."
    - method_rows: principle: "Cite source sections, adaptation and failure tests; paper results are not local results."

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} .venv/bin/python -u scripts/experiments/experiment_7503_v657_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
