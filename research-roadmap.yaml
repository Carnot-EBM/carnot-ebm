  # ──────────────────── Phase 1: Verifier-moat durability (the spine) ────────────────────
  - id: exp3846-build-balanced-step-error-corpus
    milestone: "2026.06.355"
    title: "Build the BALANCED step-error corpus that blocked exp3844: PRMBench (arXiv:2501.03124, 9 error axes) as primary, FoVer v3 as fallback — N>=1000, >=100 gold-INCORRECT steps, 9-axis labels preserved, seed-controlled. The precondition fix for the scissor-at-scale."
    priority: critical
    track: research
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true    # dataset-construction pipeline (download + parse + balance + label-preserve) — formulaic ETL, codex's strength; verdict is a deterministic count gate.
    requires_gpu: false
    estimated_wall_time_min: 40
    inference_substrate: aggregation_from_upstream_artifacts   # downloads/merges existing labeled datasets; no LLM loaded.
    deliverable: data/step_error_balanced_v1.json
    prompt: |
      CONTEXT. exp3844 (the moat scissor AT SCALE) BLOCKED because the cached FoVer v4 corpus is
      98%-correct-heavy (1286/1308 correct) — only ~22 gold-incorrect steps, far too few for a
      residual-catch CI. To measure the moat at scale we need a BALANCED corpus with a LARGE
      gold-incorrect set AND per-error-axis labels (for the .355 independence decomposition).
      PRMBench (arXiv:2501.03124) is the canonical balanced successor to ProcessBench: 6,216
      problems / 83,456 step labels across 9 fine-grained error axes. The Explore audit found the
      existing balanced FoVer v3 variants (fover_corpus_v3.json ~216 items, 47% incorrect;
      fover_test_v3.json; fover_train_v3.json) as a fallback if PRMBench is unreachable.

      EXISTING CODE TO READ FIRST:
        - scripts/experiment_2837_fover_memory_leakage_v3.py (the canonical step-candidate schema:
          {question_id|question, step_text, label} the ensemble scores — match it EXACTLY).
        - data/fover_corpus_v3.json, data/fover_test_v3.json, data/fover_train_v3.json (fallback +
          schema reference).
        - scripts/experiment_template.py (cached_sota_pair / dataset helpers).

      TASK. Build data/step_error_balanced_v1.json: a single labeled step-error corpus, N>=1000,
      with >=100 gold-INCORRECT steps (target ~40-50% incorrect), seed-controlled, schema-compatible
      with the exp2837 ensemble scoring path, with the 9 PRMBench error-axis labels preserved where
      available (a per-item `error_axis` field; null for FoVer fallback items).

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE building; on failure write blocked_<resource> + EXIT, no fabrication):
           a. Network/HF reachable for PRMBench: `curl -sf -o /dev/null https://huggingface.co/api/datasets/hitsmy/PRMBench_Preview` (or the canonical PRMBench dataset id). If unreachable, fall through to the FoVer-v3 fallback (NOT a block — record primary_source=fover_v3_fallback).
           b. At least one FoVer v3 variant present for the fallback path: `ls data/fover_corpus_v3.json data/fover_test_v3.json` returns a file.
           If NEITHER PRMBench nor any FoVer v3 file is available: honest_verdict
           `blocked_no_step_error_source` + preconditions_checked, EXIT.
        1. PRIMARY: download PRMBench (HF datasets), parse into {question_id, step_text, label
           (correct/incorrect), error_axis (one of the 9 PRMBench categories)}. Map PRMBench's
           step-correctness convention to a binary gold label faithfully; document the mapping in a
           `label_mapping_note` field.
        2. Draw a balanced subset: N>=1000, with n_incorrect>=100 (prefer ~45/55..55/45). Seed-controlled.
        3. FALLBACK (if PRMBench unreachable): merge fover_corpus_v3 + fover_test_v3 + fover_train_v3
           + fover_corpus_expanded.json into a deduped balanced set; error_axis=null. If the merged
           incorrect count is < 100, take the LARGEST balanced set available and record
           n_incorrect honestly (the scissor will widen N or report INCONCLUSIVE downstream — do
           NOT pad with synthetic items).
        4. Write data/step_error_balanced_v1.json + emit the result artifact with the fields below.
           Validate every item is scoreable by loading 1 item through the exp2837 ensemble path.

      REQUIRED ARTIFACT FIELDS (each with a `principle` note):
        n_items: { principle: "Total corpus size; N>=1000 so downstream residual-catch CIs are not small-sample noise." }
        n_incorrect_steps:
          principle: "THE gate field — the gold-incorrect set size; the scissor's residual (errors the reasoner misses) is a SUBSET of this, so >=100 is required for a meaningful residual CI."
        incorrect_fraction: { principle: "Balance check — must be materially > the v4 corpus's 1.7% so a real residual set exists." }
        primary_source: { principle: "prmbench | fover_v3_fallback — records provenance + whether 9-axis labels are present." }
        error_axis_coverage: { principle: "Which of the 9 PRMBench axes are represented (null for fover fallback) — enables exp3848's per-axis independence decomposition." }
        label_mapping_note: { principle: "How PRMBench step-correctness mapped to the binary gold label — auditability of the corpus construction." }
        schema_compatible_with_2837: { principle: "Bare bool — confirms 1 item scored end-to-end through the frozen ensemble path, so the scissor can reuse it without a schema bug." }
        preconditions_checked: { principle: "Records source availability checked before building — pre-empts fabricating a corpus." }
        random_seed: { principle: "Determinism for the balanced draw — a third party must reproduce the exact subset." }
        reproducibility_checksum: { principle: "Content hash of (source, N, seed, balance) catches silent drift vs any replication." }
        inference_substrate, duration_s: { principle: "aggregation substrate (no model loaded); real wall-clock of the ETL." }

      ACCEPTANCE GATE:
        - complete (corpus built): n_items>=1000 AND n_incorrect_steps>=100 AND schema_compatible_with_2837==true.
          honest_verdict: `complete: balanced_step_error_corpus_n<N>_nincorrect<K>_source<src>_9axis<bool>_schema_ok`
        - complete (best-effort fallback, smaller): if PRMBench unreachable AND the merged FoVer set
          yields n_incorrect<100, report honestly:
          `complete: balanced_corpus_fover_fallback_n<N>_nincorrect<K>_below_target_scissor_will_widen_or_inconclusive`
        - honest_verdict MUST start with a terminal prefix or be `blocked_<resource>`.

      DISCIPLINE: do NOT synthesize/pad incorrect items. Do NOT touch the frozen ensemble.
      Run: cd {project_root} && .venv/bin/python scripts/experiments/experiment_3846_build_balanced_step_error_corpus.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3847-moat-scissor-at-scale-v2
    operator_override: >
      2026-06-05 operator directive (standing): legit continuation of exp3844 (which BLOCKED on
      blocked_fover_balanced_corpus_not_available — an honest non-terminal state, not a failed
      method). The blocker is now addressed by upstream exp3846 building the balanced corpus; this
      re-runs the SAME scissor measurement against the now-available corpus. requires_codex: live
      Qwen3.6-35B GGUF on the 3090 (gemini crashes GPU workloads, exp3703); verdict is a
      deterministic CI gate so codex suffices.
    prior_failures:
      - experiment_id: exp3844-verifier-error-independence-scissor-at-scale
        verdict: blocked_fover_balanced_corpus_not_available
        addressed_by: "exp3844 blocked because FoVer v4 is 98% correct-heavy (~22 residual items). exp3846 (this milestone, upstream gate) builds data/step_error_balanced_v1.json with >=100 gold-incorrect steps; this attempt runs against THAT corpus, so the precondition is satisfied."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp3846-build-balanced-step-error-corpus
        artifact_field: n_incorrect_steps
        op: '>='
        value: 100
    milestone: "2026.06.355"
    title: "MOAT SCISSOR AT SCALE (supersedes exp3844): of the gold step-errors Qwen3.6-35B's OWN self-verification MISSES, what fraction does Carnot's k=15 ensemble independently catch? On the balanced corpus, N>=1000, residual_catch bootstrap CI95, TWO positive controls (reasoner non-degenerate; ensemble AUROC reproduces frozen 0.9131+/-0.02)."
    priority: critical
    track: research
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    requires_gpu: true      # Qwen3.6-35B self-verifies N>=1000 steps via llama.cpp on the internal RTX 3090.
    estimated_wall_time_min: 80
    inference_substrate: live_llm_inference   # loads + runs the SOTA GGUF for self-verification; duration floor 60s.
    deliverable: results/experiment_3847_moat_scissor_at_scale_v2.json
    prompt: |
      CONTEXT. The Deep-Think P2 reframe (memory deep-think-post-bounded-2026-06): Carnot's value is
      durable ONLY if it independently catches the step-errors a strong frontier reasoner's OWN
      self-verification misses. exp3827 gave a PRELIMINARY positive (residual_catch=0.9000,
      overlap=0.5000) on 100 items with suspiciously round numbers; exp3844 (at scale) BLOCKED on a
      missing balanced corpus. This task confirms-or-refutes the moat at scale on
      data/step_error_balanced_v1.json (built by exp3846, >=100 gold-incorrect steps). It is a
      PROPERTY MEASUREMENT (error-set independence), NOT a generation-beats-AR test — do NOT apply a
      generation headroom gate.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3827_verifier_error_independence_scissor.json + its script (the exact
          residual_catch / overlap definitions + reasoner self-verify prompt — reuse VERBATIM).
        - scripts/experiment_2837_fover_memory_leakage_v3.py (the frozen k=15 ensemble path -> 0.9131).
        - data/step_error_balanced_v1.json (the new balanced corpus; fall back to the largest
          fover_v3 balanced set if absent).

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE anything; on failure write blocked_<resource> + EXIT, no fabrication):
           a. `cd {project_root} && .venv/bin/python -c "import torch; assert torch.cuda.is_available() and torch.cuda.device_count()>0"` AND a FREE GPU (>=10GB). If the rig is busy, honest_verdict `blocked_no_free_gpu`, EXIT (never queue, never fabricate).
           b. SOTA GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/` returns a .gguf (fallback unsloth/gemma-4-26B-A4B-it-GGUF). Load via the .gguf model_path + llama.cpp (NOT AutoTokenizer on the GGUF repo id — no HF tokenizer files; use cached_sota_pair()).
           c. `import carnot.verify` succeeds AND data/step_error_balanced_v1.json present with n_incorrect>=100 (else fover_v3 fallback; if that too has n_incorrect<30, honest_verdict `blocked_residual_set_too_small`).
           If any fail: honest_verdict `blocked_<resource>` + preconditions_checked, EXIT.
        1. Draw N>=1000 balanced items (seed-controlled).
        2. STRONG REASONER SELF-VERIFICATION: ask Qwen3.6-35B (its own self-verify, exp3827 prompt
           verbatim) accept/reject per step. The live-GPU part.
        3. CARNOT ENSEMBLE: score each step with the k=15 ensemble (the 2837 path).
        4. Partition gold-INCORRECT steps into (A) caught by reasoner self-verify, (B) MISSED by
           reasoner (the residual). Compute:
             - residual_catch_rate = fraction of (B) Carnot catches at its operating threshold;
               BOOTSTRAP CI95 (>=1000 resamples).
             - error_overlap_jaccard = |reasoner-caught ∩ carnot-caught| / |union| over gold-incorrect.
        5. POSITIVE CONTROLS (both MUST pass or result is INCONCLUSIVE):
             - reasoner_self_verify_auroc in [0.55, 0.95] (reasoner genuinely self-verifies, not all-accept/all-reject).
             - carnot_ensemble_auroc reproduces the frozen 0.9131 within +/-0.02 on this corpus (ensemble path faithful; else deltas void, exp3820 mode).
        6. Apply the gate -> terminal verdict.

      REQUIRED ARTIFACT FIELDS (each with a `principle` note):
        residual_catch_rate: { principle: "THE moat metric — of the reasoner's MISSED errors, the fraction Carnot independently catches. High => durable; low => o1-subsumption risk (DT-P2)." }
        residual_catch_ci95: { principle: "Bootstrap CI95 — turns exp3827's round point estimate into a defensible interval; the LOWER bound is the gate field (Adversarial-Confirmation Discipline)." }
        error_overlap_jaccard: { principle: "Independence check — low overlap => reasoner & Carnot occupy different null spaces (the moat); high overlap => Carnot is redundant with frontier self-verify." }
        reasoner_self_verify_auroc: { principle: "Positive control — a degenerate reasoner would inflate residual_catch trivially; confirms genuine self-verification." }
        carnot_ensemble_auroc: { principle: "Positive control — MUST reproduce frozen 0.9131 +/-0.02 or ALL residual numbers are void (exp3820 mode)." }
        n_items: { principle: "N>=1000 — the residual CI is meaningful only at scale." }
        n_residual_errors: { principle: "Residual-set size — the downstream gate (exp3848/3849); if <30, widen N or report INCONCLUSIVE." }
        per_item_error_masks: { principle: "Persist the reasoner-mask + carnot-mask + gold-label per item so exp3848 (independence audit) + exp3849 (ThinkPRM complementarity) reuse them WITHOUT re-running the GPU." }
        preconditions_checked, cited_upstream_artifacts (exp3827 + 2837 + exp3846 with sha256),
        model_specs, random_seed, random_seeds_used, reproducibility_checksum, duration_s, inference_substrate:
          principle: "Pre-Launch + Adversarial-Verify + Inference-Substrate — a live 35B GGUF over N>=1000 takes real wall-clock; implausibly short = fabrication."

      FALSIFICATION GATE (acceptance):
        - MOAT_SURVIVES_AT_SCALE: both controls pass AND residual_catch_ci95 lower bound > 0.5 AND error_overlap_jaccard < 0.6.
          honest_verdict: `complete: scissor_at_scale_MOAT_SURVIVES_residcatch<mean>_ci<lo>-<hi>_overlap<j>_n<N>`
        - MOAT_SUBSUMED: both controls pass AND (residual_catch_ci95 upper < 0.3 OR error_overlap_jaccard > 0.7).
          honest_verdict: `complete: scissor_at_scale_MOAT_SUBSUMED_residcatch<mean>_overlap<j>_subsumption_risk_n<N>`
        - INCONCLUSIVE: a positive control fails (reasoner degenerate OR carnot_ensemble_auroc off frozen by >0.02 OR n_residual_errors<30).
          honest_verdict: `complete: scissor_at_scale_INCONCLUSIVE_<which>`
        - honest_verdict MUST start with a terminal prefix or `blocked_<resource>`.

      DISCIPLINE: populate seeds + checksum + preconditions + cited_upstream + model_specs. Report
      REAL duration (live LLM floor 60s). Do NOT aggregate flagged_adversarial:true artifacts.
      Do NOT move the frozen 0.9131. Persist per_item_error_masks for the CPU-reuse downstream tasks.
      Run: cd {project_root} && .venv/bin/python scripts/experiments/experiment_3847_moat_scissor_at_scale_v2.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3848-verifier-reasoner-independence-audit
    operator_override: >
      2026-06-05 operator directive (standing): NET-NEW measurement that scope-matches exp3844
      only on the "error-independence" keyword — it is NOT a rerun of the blocked scissor. exp3848
      consumes exp3847's persisted error-masks (CPU, no GPU) and measures verifier-vs-reasoner
      error CORRELATION (arXiv:2604.07650) to test whether the moat's independence is REAL or a
      shared blind spot — the measurement that makes the scissor's residual_catch defensible. The
      scissor itself (exp3847) is the rerun of exp3844; this is its mandatory companion audit.
    gated_on:
      - upstream: exp3847-moat-scissor-at-scale-v2
        artifact_field: n_residual_errors
        op: '>='
        value: 30
    milestone: "2026.06.355"
    title: "INDEPENDENCE AUDIT (arXiv:2604.07650): is Carnot's catch of the reasoner's residual errors REAL decorrelation or a shared blind spot? Measure error-mask correlation (phi/Matthews) reasoner-vs-ensemble AND per-verifier-vs-reasoner, decompose by the 9 PRMBench error axes. The measurement that makes the moat claim defensible vs the fake-independence trap."
    priority: critical
    track: research
    max_turns: 45
    agent_type: claude
    model: opus
    requires_claude: true   # interpreting whether measured correlation constitutes REAL decorrelation (per 2604.07650's entanglement caveat) vs a shared-lineage artifact is open-ended judgment, not a deterministic gate.
    requires_gpu: false      # reuses exp3847's persisted per_item_error_masks + re-scores cached candidates; NO GPU.
    estimated_wall_time_min: 40
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_3848_verifier_reasoner_independence_audit.json
    prompt: |
      CONTEXT. arXiv:2604.07650 (Behavioral Entanglement) is the load-bearing REFUTATION RISK for the
      moat: verifiers sharing an LLM lineage with the reasoner produce CORRELATED FAILURE masquerading
      as independence. A naive scissor (exp3847) can report a fake moat if the verifier and reasoner
      share blind spots. This task MEASURES the independence the moat claim assumes. Carnot's core
      verifiers are NON-LLM substrates (Z3/AST/SAT/energy), so the prior is that they ARE decorrelated
      from an LLM reasoner — but 2604.07650 says PROVE it, don't assume it.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3847_moat_scissor_at_scale_v2.json (per_item_error_masks: reasoner-mask,
          carnot-mask, gold-label, and per-item error_axis — reuse; do NOT re-run the GPU).
        - data/step_error_balanced_v1.json (the corpus + 9-axis error labels).
        - scripts/experiment_2837_fover_memory_leakage_v3.py (per-verifier scores if a per-verifier
          decomposition is needed beyond the ensemble mask).

      CONCRETE STEPS:
        0. PRECONDITIONS: exp3847 artifact exists with per_item_error_masks AND n_residual_errors>=30.
           If absent/too-small, honest_verdict `blocked_scissor_masks_unavailable`, EXIT.
        1. Build the 2x2 error-mask contingency over gold-INCORRECT steps: {reasoner caught/missed} x
           {carnot caught/missed}. Compute the phi / Matthews correlation between the reasoner-error-mask
           and the carnot-error-mask. NEAR-ZERO or NEGATIVE => genuinely independent moats (good);
