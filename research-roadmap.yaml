        verdict: status_unknown_drafted_during_bash_failure
        addressed_by: "exp1988 (.200) same drafting status."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: Outer-loop Bash failed 2026-05-16 ~06:40Z. Subsequent
      pre-stages (.200, .202, .204) drafted via Write only; activation
      states unknown. Phase 1 ship-track had several wins before the
      Bash failure (Fast-Slow codification .196, HF mirror .196) and
      several pending items (PyPI workflow operator approval, MCP/CLI
      docs, Independent Reproducer). This task consolidates 6
      milestones (.198 → .203) into a single audit + writes the Phase 1
      dashboard.

      FALSIFIABLE HYPOTHESIS: Reading 6 milestones of artifacts yields
      enough state to answer: (a) which Phase 1 prongs are SHIPPED vs
      PENDING vs BLOCKED, (b) any adversarial-verify flags across
      .198-.203, (c) whether the Bash-failure window correlates with
      any SKIP-cascade pattern, (d) the current ship-percentage with
      honest "shipped-pending-operator-approval" semantics.

      EXISTING CODE TO READ FIRST:
        - scripts/adversarial_verify.py
        - results/experiment_198*.json through results/experiment_204*.json
        - results/experiment_1929_fast_slow_codification.json (.196 baseline)
        - results/experiment_1931_huggingface_mirror.json (.196 baseline)
        - results/experiment_1930_pypi_status.json (PyPI baseline)
        - ops/conductor-log.md (SKIP/DOOMED_RERUN/GATE_BLOCK since
          2026-05-16T05:00Z)
        - ops/known-issues.md (Phase 1 MANDATORY entry)
        - ops/phase-1-dashboard.md (if exp1988 or exp2010 created it)

      TASK: Audit + dashboard in one pass.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. scripts/adversarial_verify.py importable.
           b. results/experiment_1929_fast_slow_codification.json AND
              results/experiment_1931_huggingface_mirror.json exist
              (already-shipped baselines).
           Record preconditions_checked.
        1. `python3 scripts/adversarial_verify.py --milestone-range
            1981 2040`. Classify flags.
        2. For each Phase 1 prong (PyPI / HF / MCP-docs / Reproducer
           / Fast-Slow codification): extract current status from
           latest evidence artifact. PyPI specifically: latest
           `gh run list --workflow=publish-pypi.yml` state via gh CLI.
        3. Write ops/phase-1-dashboard.md (NO emojis; CLAUDE.md
           no-pruning; APPEND-only if file exists). Single-page
           status table + ship-percentage + operator-action items.
        4. Update ops/status.md "What's Working" with link.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase1_dashboard_audit.v2"
        - experiment: 2040
        - run_date: ISO-8601 UTC
        - duration_s: > 60s
        - random_seed: 173240
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {{audit_target_milestones: ["2026.05.198",
          "2026.05.199", "2026.05.200", "2026.05.201", "2026.05.202",
          "2026.05.203"], adversarial_verify_version: git_rev,
          artifacts_scanned: int, artifacts_flagged: int,
          dashboard_path: "ops/phase-1-dashboard.md"}}
