    CONCRETE STEPS:
    1. Print a flushed start line. Check declared input paths, hashes, schemas, programs, source roles and current gate operands before compute. Missing external prerequisites end as complete_blocked_* with verdict_class=blocked and exact gate_check_summary; they are not partial work or a scientific producer.
    2. Print a flushed progress line at every phase boundary and before and after every model load, generation, benchmark and subprocess. Include elapsed time and completed units. Print inside long loops; supervise each owned child with a heartbeat at least every 60 seconds. Keep all output gaps below 600 seconds and tool waits at most 60 seconds. Silence can kill a task at 1200 seconds; progress permits the 4800-second hard cap. Never pad measured duration.
    3. Write any file over about 200 lines in several tool calls of at most 150 lines, with a progress message between calls. Keep each tool call bounded. Use input/code/configuration-bound checkpoints and resume without dropping unfavorable rows. Put scratch work in /tmp; never write one-off scripts at the repository root.
    4. Before implementation, add task-owned REQ-* and SCENARIO-* items to the applicable capability spec and write failing tests. Freeze an explicit affected dependency closure, existing consumer regressions, actual file paths, exact argv and deadlines BEFORE seeing results. Use the V684 validation contract in the design. Do not import or call a historical experiment main/run/validation dispatcher, synthesize commands by string replacement, edit QA guards, skip tests or weaken assertions.
    5. Use prospective affected-scope validation via experiment_7303_validation_scope, preserving every historical required failure as historical_required_failures. Repository-wide health is a separate declared diagnostic for NEW experiments, never a hidden science gate or a retroactive change to a prior required check. Preserve E2E-014 full-suite obligations if that old runner is reused; this task must instead exercise the directly named current primitives and E2Es. If the affected closure cannot be justified, block. Use private pytest basetemp, CLI outputs and explicit coverage files under /tmp; keep the child-results guard. Resolve imports by fully qualified name and actual __file__ path.
    6. Snapshot the design, staged YAML and genuinely activated roadmap bytes. Compare milestone 2026.09.684, exactly twelve IDs exp7879 through exp7890, order, titles, phases, paths, model lists, classes and gates with compare_contract(milestone='2026.09.684', first_id=7879, count=12). Before activation emit blocked_pending_activation; never pretend the still-active V683 file is V684. Do not gate every scientific branch on this administrative task.
    7. Reject private mutations of count, order, ID, title, phase, deliverable, model, class, gate and missing prior-failure subfields. Run schema, failure-lineage, exclusion, gate, harness-fit and ARC-floor readers. Build a method/command manifest with exact existing file paths, module/file coverage includes, expected measured statements and per-task E2E closure. Collect named tests before running. Add negative fixtures for the V683 nonexistent ARC path, empty coverage and illegal host_cpu venue. Do not change validators.
    8. Ingest the dated V684 literature review into a source-to-method ledger for calibration retention, delayed writes and source sufficiency. Check at most three primary pages for version deltas with bounded requests; unavailable pages retain the already verified version and an access receipt. Freeze cohort roles, nine training arms, seeds, policy costs and all analysis/stopping rules from the design. No new architecture sweep or broad benchmark harness.
    9. Record the specific historical failures separately from the prospective validation manifest. Invoke current pure libraries directly; dependency closure includes their actual consumers, not just a renamed wrapper. A changed inherited module retains its affected regressions. Verify imports beneath python/ and scripts/ against their actual package roots. Record unrelated full-suite debt as unresolved; never claim repository-wide qualification. Emit twelve contract rows and separate mutation/method rows.
    10. Run every frozen affected pytest command with PYTHONPATH=python:. and -n 0 -o addopts= --no-cov for ordinary tests. Use separate coverage runs with identical include settings for unit and real CLI success/failure paths; combine explicitly named completed data files, assert the expected modules have measured statements, and require coverage report --fail-under=100. Empty data is failure. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py over the named affected tests. Required checks must pass; preserve other repository debt separately.
    11. Run the assigned ops/e2e-test-plan.md checks and a private real CLI plus cold replay; declare inapplicable E2Es before execution. Recompute aggregates from primitive rows. Seal child logs after process exit and closed handles at immutable hash-addressed paths. Raw shards stay below 50 MiB and tracked files below 90 MB. Record monotonic phase timing without treating repeated seeds/views as independent families.
    12. Validate the exact terminal candidate with scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict. Derive flagged_adversarial from actual reports and inspect final bytes after required checks, not only a provisional candidate. Owned required failures imply disqualified and readiness zero. Publish the exact checked bytes atomically; retain validator reports as sidecars to avoid a self-hash cycle.
    13. Use complete_* honest_verdict for terminal positive | circular_positive | null | blocked | disqualified outcomes; use partial_* and partial only for retryably unfinished OWN work. An unchanged external block is terminal blocked. Separate validity, measurement readiness and benefit; a valid null may be ready. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve prior artifacts and production defaults. Retire an unchanged scope only on its identical prior verdict. Do not activate, publish externally or modify the active roadmap.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date: Numeric experiment_id, exact task ID, 2026.09.684 and {date}. principle: Bind evidence to this producer, not a historical alias.
    - honest_verdict, verdict_class: Closed class positive | circular_positive | null | blocked | disqualified | partial with the matching complete_* or partial_* prefix. principle: External missing work must not consume three retries.
    - flagged_adversarial: Boolean from exact terminal validation. principle: Flagged artifacts cannot open gates.
    - gate_check_summary: For every blocked_* or complete_blocked_* result, list upstream ID, artifact path/hash, artifact_field, op, expected and observed values. principle: Missing producer, missing field and failed value differ.
    - rows, sample_size_budget: Primitive family/unit/arm/seed metrics and intended, eligible, started, completed, censored, excluded and independent counts. principle: Every comparative headline must be reproducible from all units.
    - acceptance_gate_results: Separate validity, readiness, probability_quality, decision_benefit, retention and efficiency; null for unmeasured claims. principle: Passing mechanics is not scientific benefit.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Real monotonic timing and hashes of source bytes, code, seeds and configuration. principle: Authenticate measured work without duration padding.
    - source_artifact_hashes, preconditions_checked, resolved_imports: Exact source paths, dates, hashes, authority/exposure roles and fully qualified modules. principle: Public source bytes and evaluator labels have separate custody.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, historical_required_failures, repository_health: Exact argv, predeclared classification/deadline, exit, sealed log path/hash and measured coverage. principle: New scoped checks do not erase historical failures or repository debt.
    - verifier_is_oracle, claim_scope: True and circular_positive for oracle/fixture agreement; exposed_development for natural data. principle: Neither deterministic fixtures nor reused development families close the independent verifier gap.
    - field_principles: Explanation of each task-owned field and gate. principle: Preserve why the contract exists.
    - inference_substrate, inference_substrate_class, execution_venue: Use the TASK declaration and execution_venue=host for owned CPU/GPU work, never host_cpu. Keep planned class separate when blocked_no_run. principle: Venue is a closed enum and does not determine a duration floor.
    - MODEL_SPECS, model_specs, target_model, model_invocation_counts, trained_head_specs: Current LLM identities, actual loads/calls/tokens and hashes only. CPU tasks have empty model lists, target_model=none (no pretrained model) and zero LLM calls; tiny fitted heads have their own specs. principle: Citing Qwen is not loading it.
    - contract_ready_score: 1 only when actual design/staged/activated authorities and all owned required checks agree; otherwise 0. principle: Administrative agreement is not science.
    - contract_rows, mutation_rows, methods_manifest, authority_snapshots, validation_scope_manifest_path: Twelve rows plus hashes and exact prospective scopes. principle: The executed plan must match its written promise.
    - literature_adoption_decisions: Verified URLs, version dates, method choices and limitations. principle: Discovery must lead to a falsifiable test, not a popularity claim.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7879_v684_contract_methods.py --date {date}
