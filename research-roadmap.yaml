- id: exp787-sstar-energy-ranked-code-selection
  milestone: 2026.04.60
  deliverable: results/experiment_787_sstar_energy_ranked_code_selection.json
  title: 'Exp 787: S* Energy-Ranked Code Selection — Pre-filter Before Execution Tests (arXiv 2502.14382)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2502.14382 "S*: Test Time Scaling for Code Generation" (February 2026)
    introduces hybrid test-time scaling: generate N=4 candidates in parallel, then use
    distinguishing inputs (test cases that differentiate candidates) for tournament selection.
    S* achieves 3B models matching GPT-4o-mini on LiveCodeBench.

    Exp 773 showed Carnot has oracle_call_ratio=6.0 vs SETS (6x fewer oracle calls).
    S* uses execution tests as the selection oracle — expensive (run code + collect output).
    Carnot's hypothesis: energy pre-ranking can pre-filter candidates BEFORE running tests,
    reducing test executions by 30-50%. If energy correctly identifies the best candidate
    60%+ of the time, we save 40-60% of test suite runs.

    This is a CPU-only experiment using deterministic mock LLM and synthetic code problems.
    The goal is to measure whether energy rank correlates with code correctness rank,
    not to show production pass@1 improvement (that requires GPU — Exp 785).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; extract energy computation.
    - python/carnot/pipeline/extract.py — CodeExtractor for code energy.
    - results/experiment_773_carnot_vs_sets.json — SETS baseline for oracle call comparison.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement SStarEnergyRanker. Test energy-based pre-filtering on 20 synthetic Python
    problems (4 candidates each). Measure: energy_correct_rank_pct, tests_saved_pct.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-RANK-001 (SStarEnergyRanker MUST compute Carnot energy for each code candidate;
       MUST select the lowest-energy candidate as predicted-best before running execution tests),
       REQ-RANK-002 (energy_correct_rank_pct = fraction of problems where energy-selected
       candidate passes execution test; tests_saved_pct reported vs pure execution selection),
       SCENARIO-RANK-001/002 to openspec/capabilities/verification/spec.md.
    3. Implement python/carnot/pipeline/sstar_energy_ranker.py:
       a. SStarConfig(n_candidates=4, energy_top_k=1).
       b. SStarEnergyRanker(pipeline: VerifyRepairPipeline, config: SStarConfig):
          rank_by_energy(candidates: list[str], problem_context: str) -> list[str]:
            - Compute energy for each candidate via pipeline.compute_energy(candidate).
            - Sort by energy (ascending = more correct).
            - Return reordered candidate list (lowest energy first).
          select_top_k(candidates: list[str], problem_context: str, k: int = 1) -> list[str]:
            - Return top k candidates by energy rank.
    4. Build synthetic test corpus: 20 Python problems with N=4 candidates each:
       a. Problem: "def add(a, b): return ???" with 4 candidates:
          - Correct: "return a + b"
          - Wrong-1: "return a - b"
          - Wrong-2: "return a * b"
          - Wrong-3: "return a + b + 1"
       b. Build 20 such problems covering: addition, comparison, string ops, list ops, etc.
       c. Label: candidate 0 is always the correct candidate (for test reproducibility).
    5. For each problem:
       a. Compute energy for all 4 candidates.
       b. energy_selected_idx = argmin(energy) → which candidate has lowest energy?
       c. execution_test_passes = [execute_code(c) for c in candidates] (0=pass, 1=fail).
       d. energy_correct_rank = (energy_selected_idx == first_passing_idx).
    6. Compute:
       energy_correct_rank_pct = sum(energy_correct_rank) / 20
       tests_saved_pct = 1 - (1 / n_candidates) if energy_correct_rank_pct >= 0.60 else 0
       (Interpretation: if energy is right 60%+ of the time, skip 3/4 tests on 60% of problems)
    7. Create scripts/experiment_787_sstar_energy_ranked_code_selection.py:
       a. ExperimentTemplate(787) + ExperimentTimeoutWatchdog(787, timeout_minutes=20).
       b. Implement steps 3-6.
       c. honest_verdict:
          - "energy_prefilter_efficient" if energy_correct_rank_pct >= 0.60 (30%+ test savings)
          - "energy_prefilter_marginal" if 0.40 <= energy_correct_rank_pct < 0.60
          - "energy_prefilter_random" if energy_correct_rank_pct < 0.40 (energy uncorrelated)
       d. artifact: n_problems, n_candidates, energy_correct_rank_pct, tests_saved_pct,
          honest_verdict.
    8. Write tests/python/test_experiment_787_sstar_energy_ranked_code_selection.py with 100% coverage:
       - test SStarEnergyRanker.rank_by_energy returns candidates sorted by energy.
       - test energy_correct_rank_pct = sum(energy_selected == correct) / n_problems.
       - test tests_saved_pct = 0 when energy_correct_rank_pct < 0.60.
       Each test traces to REQ-RANK-001/002.
    9. Reconcile:
        - ops/status.md: "S* energy ranking (arXiv 2502.14382): energy_correct_rank_pct=X.
          tests_saved_pct=Y. honest_verdict=Z."
        - ops/changelog.md: one-line with honest_verdict.
    10. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp788-constraint-addition-from-memory
  milestone: 2026.04.60
  deliverable: results/experiment_788_constraint_addition_from_memory.json
  title: 'Exp 788: Constraint Addition from Memory — Tier 2 Upgrade (research-program.md Priority #1)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: research-program.md Priority #1: "Rebuild constraint extraction for real models.
    The fix: constraint ADDITION from memory patterns, not just weight changes. When memory
    detects 'arithmetic carry errors are common,' ADD a carry-check constraint — don't just
    upweight existing ones. Tier 2 memory (Exp 135) has the pattern data; wire it into
    constraint generation, not just weight adjustment."

    Exp 134 proved that precision-based REWEIGHTING shows 0% improvement: fixed=adaptive
    across 500 questions. The reason: changing weights on existing constraints doesn't add
    new detection capability when the constraint topology is wrong. The correct mechanism is
    to generate NEW IsingEBM coupling rows from accumulated error patterns.

    Research alignment: arXiv 2601.17223 (Beyond Outcome Verification) and arXiv 2604.14853
    (Adaptive Test-Time Compute) both validate constraint-set adaptation as the correct approach.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/self_learning_relay.py — SelfLearningRelay; session memory access.
    - python/carnot/models/ising.py — IsingEBM; how to add new coupling rows.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; where new constraints apply.
    - python/carnot/pipeline/extract.py — ArithmeticExtractor, constraint types defined.
    - results/experiment_134_* (if present) — Exp 134 reweighting baseline (0% improvement).
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement ConstraintGenerator that reads session memory error patterns and synthesizes
    new IsingEBM coupling rows. Test: 50 GSM8K questions with dynamic vs static constraints.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-056 (ConstraintGenerator MUST read session_memory error_pattern_counts;
       MUST synthesize new IsingEBM coupling rows for patterns with count >= PATTERN_THRESHOLD=3),
       REQ-LEARN-057 (dynamic constraint pipeline MUST report n_constraints_added and compare
       net_improvement vs static-constraint baseline on same 50-question set),
       SCENARIO-LEARN-100/101 to openspec/capabilities/self_learning/spec.md.
    3. Implement python/carnot/pipeline/constraint_generator.py:
       a. ErrorPattern(pattern_type: str, count: int, example_step: str):
          pattern_type in (carry_error, sign_error, unit_error, comparison_error, overflow_error)
       b. ConstraintGenerator(ising_model: IsingEBM, threshold: int = 3):
          synthesize_from_memory(error_patterns: list[ErrorPattern]) -> list[CouplingRow]:
            - For each error_pattern with count >= threshold:
              * "carry_error" → add coupling (carry_bit_var, result_bit_var, J=-1.0)
              * "sign_error" → add coupling (sign_var, magnitude_var, J=-1.0)
              * "unit_error" → add coupling (unit1_var, unit2_var, J=1.0)  [inconsistency]
              * "comparison_error" → add coupling (lhs_var, rhs_var, J=-1.0)
              * "overflow_error" → add coupling (overflow_var, capacity_var, J=1.0)
            - Return list of CouplingRow(var1, var2, J_value) to inject into IsingEBM.
          inject_couplings(coupling_rows: list[CouplingRow]) -> None:
            - Add coupling_rows to IsingEBM's J matrix (extend, do not replace).
    4. Run 50 GSM8K questions with TWO pipelines:
       a. Static baseline: VerifyRepairPipeline with standard fixed IsingEBM.
       b. Dynamic adaptive: VerifyRepairPipeline + ConstraintGenerator:
          - After each batch of 10 questions: read session_memory error patterns.
          - If any pattern count >= 3: synthesize new couplings, inject into IsingEBM.
          - Continue with enriched IsingEBM.
       c. For each pipeline: record baseline_accuracy, vr_accuracy, net_improvement.
    5. Compute:
       n_constraints_added (dynamic pipeline total)
       net_improvement_dynamic = dynamic vr_accuracy - dynamic baseline_accuracy
       net_improvement_static = static vr_accuracy - static baseline_accuracy
       constraint_addition_delta = net_improvement_dynamic - net_improvement_static
    6. Create scripts/experiment_788_constraint_addition_from_memory.py:
       a. ExperimentTemplate(788) + ExperimentTimeoutWatchdog(788, timeout_minutes=45).
       b. Implement steps 4-5 (use synthetic GSM8K-style questions if live GPU unavailable).
       c. honest_verdict:
          - "constraint_addition_positive" if constraint_addition_delta > 0
          - "constraint_addition_zero" if constraint_addition_delta == 0
          - "constraint_addition_negative" if constraint_addition_delta < 0 (regression)
          - "insufficient_patterns" if no patterns reached threshold in 50 questions
       d. artifact: n_constraints_added, net_improvement_dynamic, net_improvement_static,
          constraint_addition_delta, n_patterns_above_threshold, honest_verdict.
    7. Write tests/python/test_experiment_788_constraint_addition_from_memory.py with 100% coverage:
       - test ConstraintGenerator.synthesize_from_memory returns coupling for carry_error count>=3.
