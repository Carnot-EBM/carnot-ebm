       g. Load EORM AUC from prior result files (search Exps 556, 559, 383 results for eorm_auc).
          eorm_auc_baseline = max known EORM AUC from result files, else 0.60 as floor.
       h. Speedup: OTV forward = ~0.1ms (CPU dot product), EORM ~10ms.
          speedup_ratio = 10.0 / 0.1 = 100x (theoretical; verify with timeit).
       i. Build artifact: schema='carnot.otv_verifier.v1',
          n_train=<int>, n_test=<int>,
          otv_auc=<float>, eorm_auc_baseline=<float>,
          auc_gap=(eorm_auc_baseline - otv_auc),
          otv_viable=(otv_auc >= eorm_auc_baseline - 0.05),
          speedup_ratio=<float>,
          recommendation='OTV as Tier 2 default' if otv_viable else 'Keep EORM as Tier 2',
          honest_verdict='otv_viable_replace_eorm' if otv_viable
            else 'otv_not_viable_keep_eorm'.
       j. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_otv_verifier.py (100% coverage on otv_verifier.py).
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: _bmad/architecture.md (note OTV as Tier 2 candidate), ops/conductor-log.md,
