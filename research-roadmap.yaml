    2. Locate the 1508 fresh verified examples referenced by exp1395.
    3. Train or update DVI with a deterministic split and fixed seed.
    4. Compare dvi_v3_auroc_delta against exp1394 dvi_v2_auroc_delta=0.011458.
    5. Measure nonforgetting on replay examples from exp1395.
    6. Preserve SECL calibration if the combined verifier is touched.
    7. Write a checkpoint if deployed; otherwise write why it is blocked.
    8. Run focused tests or deterministic validation and record commands in tests_run.
