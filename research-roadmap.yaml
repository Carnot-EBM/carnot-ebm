      CONCRETE STEPS:
      1. Run benchmark_kaem_vs_mcmc with both the old KAEMEnergy and the new SineKAN.
      2. Measure wall-clock latency per 1000 samples.
      3. Write artifact with REQUIRED ARTIFACT FIELDS: schema, baseline_latency_ms, sinekan_latency_ms, speedup_ratio, acceptance_gate_passed.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

