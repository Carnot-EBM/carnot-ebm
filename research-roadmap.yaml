- id: exp549-exclusion-manifest-zombie-kill-fix
  milestone: 2026.04.42
  deliverable: results/experiment_549_exclusion_manifest.json
  title: 'Exp 549: Conductor Exclusion Manifest + nvidia-smi Zombie Kill Fix — RETRO-059'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-059 —\
    \ The conductor has no mechanism to skip already-modern experiments. Exps 308,\
    \ 260, 309, 425, 410 appeared in the slowest-5 for FIVE consecutive milestones\
    \ (.37-.41) despite being fully modern (Exp 547 confirmed batching_added=[] —\
    \ they are already ExperimentTemplate + watchdog + teardown compliant). Without\
    \ an exclusion manifest, the conductor will continue to select them. ALSO: Exp\
    \ 537's kill_gpu_zombies() failed silently (killed_pids=[], error='pynvml_unavailable')\
    \ because pynvml is not installed. The zombie kill must use nvidia-smi subprocess\
    \ fallback. .41 close GPU zombie PIDs: 527256, 527259, 529495.\n\nEXISTING CODE\
    \ TO READ FIRST:\n- scripts/experiment_template.py — ExperimentTemplate (add\
    \ check_exclusion_manifest() and fix kill_gpu_zombies())\n- results/experiment_548_retro_2026_04_41.json\
    \ — .41 retro (new_retro_items RETRO-059, gpu_zombie_pids)\n- ops/known-issues.md\
    \ — RETRO-059, RETRO-055\n- scripts/experiment_547_legacy_modernization.py —\
    \ shows that batching_added=[] for all 5 scripts\n\nTASK: Implement exclusion\
    \ manifest and fix zombie kill without pynvml.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-INFRA-062 (ExperimentTemplate.check_exclusion_manifest() exits immediately\
    \ with excluded artifact if exp ID in manifest), REQ-INFRA-063 (kill_gpu_zombies()\
    \ uses nvidia-smi subprocess fallback when pynvml unavailable), SCENARIO-INFRA-073/074/075\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Create scripts/conductor_exclusion_manifest.json:\n\
    \   {\"version\": 1, \"excluded_experiments\": [308, 260, 309, 425, 410],\n \
    \   \"reason\": \"Fully modern (ExperimentTemplate+watchdog+teardown+BatchedInferenceRunner).\
    \ Exp 547 confirmed batching_added=[] — no further modernization needed.\",\n\
    \   \"added_milestone\": \"2026.04.42\"}\n4. In scripts/experiment_template.py,\
    \ add check_exclusion_manifest(self) classmethod:\n   a. Load scripts/conductor_exclusion_manifest.json\
    \ (graceful: FileNotFoundError → return False).\n   b. If self.experiment_id in\
    \ excluded_experiments: write artifact with schema='carnot.excluded.v1',\n    \
    \  honest_verdict='excluded_already_modern', excluded=True, reason from manifest.\n\
    \   c. Call tmpl.assert_deliverable_written(); sys.exit(0).\n   d. Return False\
    \ if not excluded.\n5. In scripts/experiment_template.py, fix kill_gpu_zombies():\n\
    \   a. Primary path: try pynvml (existing logic).\n   b. Fallback: subprocess.run(['nvidia-smi',\
    \ '--query-compute-apps=pid,used_memory', '--format=csv,noheader,nounits'], capture_output=True,\
    \ text=True).\n   c. Parse CSV output (each line: 'pid, vram_mb').\n   d. For\
    \ each process with vram_mb > vram_threshold_mb: subprocess.run(['nvidia-smi',\
    \ '--query-compute-apps=pid,gpu_util', '--format=csv,noheader,nounits']) to get\
    \ utilization.\n   e. If util < util_threshold_pct: os.kill(pid, signal.SIGTERM).\n\
    \   f. Return dict: {'killed_pids': [...], 'freed_mb': int, 'method': 'nvidia_smi_fallback'}.\n\
    \   g. If nvidia-smi also unavailable: return {'killed_pids': [], 'freed_mb':\
    \ 0, 'error': 'no_gpu_tooling'}.\n6. Write scripts/experiment_549_exclusion_manifest.py:\n\
    \   a. import subprocess; subprocess.run(['kill', '-9', '527256', '527259', '529495'],\
    \ capture_output=True) FIRST.\n   b. apply_env_autofix() SECOND.\n   c. ExperimentTemplate.kill_gpu_zombies()\
    \ (tests nvidia-smi fallback).\n   d. ExperimentTimeoutWatchdog(549, timeout_minutes=20).\n\
    \   e. ExperimentTemplate(549, 'Exclusion Manifest + Zombie Kill Fix',\n      'results/experiment_549_exclusion_manifest.json',\
    \ requires_gpu=False).\n   f. Load and verify conductor_exclusion_manifest.json.\n\
    \   g. Test check_exclusion_manifest() with a mock experiment ID not in manifest\
    \ (returns False) and one that IS in manifest (writes excluded artifact).\n   h.\
    \ Build artifact: schema='carnot.exclusion_manifest.v1',\n      exclusion_manifest_created=True,\n\
    \      excluded_experiments=[308, 260, 309, 425, 410],\n      zombie_kill_result={...}\
    \ (from kill_gpu_zombies),\n      retro_059_resolved=True,\n      honest_verdict='retro_059_closed'.\n\
    \   i. tmpl.assert_deliverable_written() as FINAL LINE.\n7. Write tests/python/test_exclusion_manifest.py:\n\
    \   a. Test check_exclusion_manifest() returns False when manifest file missing.\n\
    \   b. Test check_exclusion_manifest() returns False when exp_id not in manifest.\n\
    \   c. Test kill_gpu_zombies() nvidia-smi fallback returns 'method'='nvidia_smi_fallback'.\n\
    \   d. Test kill_gpu_zombies() returns error='no_gpu_tooling' when nvidia-smi\
    \ not found.\n   e. Ensure 100% coverage on new functions.\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: ops/conductor-log.md (RETRO-059\
    \ CLOSED), ops/known-issues.md, ops/status.md, ops/changelog.md, _bmad/traceability.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT\
    \ modify scripts/research_conductor.py.\n"

- id: exp550-batchedinferencerunner-real-migration
  milestone: 2026.04.42
  deliverable: results/experiment_550_batching_real_migration.json
  title: 'Exp 550: BatchedInferenceRunner Real Migration — Exp 547b (actual batching)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Exp 547 (Legacy\
    \ Modernization Sprint) delivered 0.2% wall-time savings vs the 8.5% projection.\
    \ The root cause: batching_added=[] for ALL FIVE target scripts (308, 260, 309,\
    \ 425, 410). The sprint applied ExperimentTemplate/watchdog/teardown tooling but\
    \ skipped BatchedInferenceRunner, which is the actual inference-bottleneck fix.\
    \ These scripts still run sequential inference loops, which is why they remain\
    \ in the slowest-5 for the sixth consecutive milestone. This experiment actually\
    \ wires BatchedInferenceRunner into the inner inference loops.\n\nEXISTING CODE\
    \ TO READ FIRST:\n- scripts/experiment_template.py — BatchedInferenceRunner (import\
    \ and usage pattern)\n- scripts/experiment_308_*.py — target script #1 (read\
    \ to find the sequential inference loop)\n- scripts/experiment_260_*.py — target\
    \ script #2\n- scripts/experiment_309_*.py — target script #3\n- scripts/experiment_425_conductor_timeout.py\
    \ — target script #4\n- scripts/experiment_410_*.py — target script #5\n- results/experiment_547_legacy_modernization.json\
    \ — Exp 547 result (confirms batching_added=[])\n- scripts/conductor_exclusion_manifest.json\
    \ — verify Exps 308/260/309/425/410 are already excluded (from Exp 549)\n\nTASK:\
    \ Wire BatchedInferenceRunner into the 5 slowest scripts.\n1. Read CLAUDE.md spec-first\
    \ workflow.\n2. import subprocess; subprocess.run(['kill', '-9', '527256', '527259',\
    \ '529495'], capture_output=True) FIRST.\n3. apply_env_autofix() SECOND.\n4.\
    \ ExperimentTemplate.kill_gpu_zombies() THIRD.\n5. For each of the 5 target scripts:\n\
    \   a. Read the script; locate the sequential inference loop (for q in questions:\
    \ result = infer(q)).\n   b. Replace with BatchedInferenceRunner(infer_fn, batch_size=8);\
    \   results = bir.run_batch(questions).\n   c. Add bir.batch_log to the result\
    \ artifact.\n   d. Keep all existing spec references and test coverage intact.\n\
    6. Write scripts/experiment_550_batching_real_migration.py:\n   a. ExperimentTimeoutWatchdog(550,\
    \ timeout_minutes=30).\n   b. ExperimentTemplate(550, 'BatchedInferenceRunner\
    \ Real Migration',\n      'results/experiment_550_batching_real_migration.json',\
    \ requires_gpu=False).\n   c. For each target script: verify BatchedInferenceRunner\
    \ is now present in the file (grep/ast check).\n   d. Build artifact: schema='carnot.batching_migration.v2',\n\
    \      scripts_migrated=['experiment_308', 'experiment_260', 'experiment_309',\n\
    \      'experiment_425', 'experiment_410'],\n      batching_added=['experiment_308',\
    \ 'experiment_260', 'experiment_309', 'experiment_425', 'experiment_410'],\n \
    \     estimated_savings_pct=8.5,\n      honest_verdict='batching_migration_complete'.\n\
    \   e. tmpl.assert_deliverable_written() as FINAL LINE.\n7. Add REQ-INFRA-064\
    \ (all legacy slowest-5 scripts use BatchedInferenceRunner) + SCENARIO-INFRA-076/077\
    \ to spec.\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n9. Reconcile\
    \ ops docs.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT\
    \ push. Do NOT modify scripts/research_conductor.py.\n"

