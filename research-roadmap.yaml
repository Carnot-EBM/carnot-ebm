- id: exp1024-ppsebm-live-relay-v4
  milestone: 2026.04.79
  deliverable: results/experiment_1024_ppsebm_live_relay_v4.json
  title: "PPSEBM Live Relay v4 — FR-11 Cross-Session Memory on Expanded FoVer Violations"
  prompt: |
    CONTEXT:
    PPSEBM cross-session constraint memory achieved sessions_with_new_templates >= 3 on CPU
    synthetic (Exp 970, .75). FR-11 real-data relay: last confirmed Milestone .33 (46 milestones
    ago). Exp 1005 (.78) was gated on exp1003.n_live_violations_collected >= 10 but only 9
    were collected — 1 violation short of the gate.

    Exp 1016 (FoVer Corpus Expansion) produces 500+ labeled pairs including >= 100 violations.
    This experiment uses THAT corpus, not live GPU violations. This decouples FR-11 relay from
    GPU availability — the expanded corpus provides abundant real violations (Z3-verified, not
    just model outputs on easy benchmarks).

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/lsb_sampler.py (check for PPSEBM class)
    - python/carnot/pipeline/ppsebm.py (PPSEBM, if exists)
    - results/experiment_970_ppsebm_cpu_synthetic.json (baseline: sessions_with_new_templates >= 3)
    - results/experiment_1016_fover_corpus_expansion.json (n_violation_pairs)
    - results/fover_expanded_corpus.json (violation pairs for training signal)
    - scripts/experiment_template.py

    TASK:
    1. READ results/fover_expanded_corpus.json. Extract violation pairs:
       violations = [pair for pair in corpus if pair.get('n_violations', 0) > 0]
       If len(violations) < 10: emit honest_verdict='insufficient_violations' and stop.
    2. Run 5 PPSEBM sessions using the violation pairs as training signal:
       For each session i in range(5):
       - Sample a batch of violations from the expanded corpus
       - Run PPSEBM to generate new constraint templates
       - Count new templates added in this session
    3. Measure sessions_with_new_templates (target >= 3).
    4. Compare to synthetic baseline (Exp 970: sessions_with_new_templates >= 3 on synthetic)
    5. WRITE results/experiment_1024_ppsebm_live_relay_v4.json (try/finally):
       - n_violations_from_corpus: int
       - sessions_with_new_templates: int
       - total_new_templates: int
       - live_relay_confirmed: bool (sessions_with_new_templates >= 3 AND n_violations > 0)
       - vs_synthetic_baseline_delta: int (sessions_with_new_templates - 3)
       - inference_mode: "z3_labeled_corpus" | "insufficient_violations"
       - honest_verdict: "fr11_relay_confirmed" | "fr11_insufficient_data" | "fr11_no_new_templates"

    CONCRETE STEPS:
    - python3 -c "import json, os; corpus='results/fover_expanded_corpus.json'; d=json.load(open(corpus)) if os.path.exists(corpus) else []; viols=[p for p in d if p.get('n_violations',0)>0]; print(len(d),'total,',len(viols),'violations')"
    - grep -r "PPSEBM\|ppsebm" python/carnot/ --include="*.py" -l
    - python3 -c "import json; d=json.load(open('results/experiment_970_ppsebm_cpu_synthetic.json')); print('baseline sessions:', d.get('sessions_with_new_templates'))" 2>/dev/null || echo "EXP970_NOT_FOUND"

    Run: python scripts/experiment_1024_ppsebm_live_relay_v4.py
