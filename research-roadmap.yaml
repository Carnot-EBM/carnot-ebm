    deliverable: "results/experiment_1856_ltlzinc_eval.json"
    prompt: |
      CONTEXT: Continuous learning requires checking for catastrophic forgetting.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/
      TASK: Use LTLZinc constraint evaluations to check for memory retention on the model trained in Exp 1855.
      CONCRETE STEPS:
      1. Load the updated policy.
      2. Run evaluations using LTLZinc constraints.
      3. Record the nonforgetting rate.
      4. Save output to `{project_root}/results/experiment_1856_ltlzinc_eval.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1857-s2kan-primitives
    title: "Exp 1857: S2KAN primitives - implement differentiable symbolic gates"
    deliverable: "results/experiment_1857_s2kan.json"
    agent_type: "codex"
    prompt: |
      CONTEXT: We need verifiable KANs. Softly Symbolified KANs (S2KAN) introduce symbolic primitives.
      EXISTING CODE TO READ FIRST: python/carnot/models/
      TASK: Implement differentiable symbolic gates for KAN.
      CONCRETE STEPS:
      1. Create `python/carnot/models/s2kan.py`.
      2. Implement primitive functions (sin, exp, step) with differentiable gating.
      3. Write tests with 100% coverage.
      4. Save output to `{project_root}/results/experiment_1857_s2kan.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

