        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5733/Exp5734 proved a parse-safe sealed candidate channel but did not measure decision value. Opt-Verifier motivates separate formulation-structure and solution-validity checks, while Hard Rules, Soft Preferences motivates separate hard feasibility and soft objective receipts. Today is {date}.

