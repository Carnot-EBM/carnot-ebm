- id: exp4513-a3
  milestone: 2026.06.417
  title: 'PHASE A3 (ARC NORTH STAR; SCORE-LEVER) -- verifier-grounded ADAPTIVE per-step budget
    (ACT/PonderNet; LoopWM arXiv:2606.18208 citable): easy frame -> commit 1 candidate, ambiguous ->
    expand. Cuts actions by NOT expanding when the frame is easy.'
  priority: high
  track: arc-north-star
  max_turns: 130
  agent_type: codex
  model: gpt-5.5
  inference_substrate: verifier_ensemble_against_cached_candidates
  deliverable: results/experiment_4513_adaptive_per_step_budget.json
  prompt: |
    CONTEXT ({date}, ARC sprint SCORE-LEVER; candidate 6 from the LoopWM ingestion). The explorer spends
    the SAME search width/depth on every frame. This task adds a CHEAP per-step gate from ALREADY-computed
    signals (energy/value-head margin + predicted-no-op-under-the-induced-model + frame novelty): an
    easy/unambiguous frame commits 1 candidate immediately; an ambiguous frame expands the budget. Unlike
    A1 (prune the candidate set), this cuts actions by NOT EXPANDING when the frame is easy. This is
    fundamentally ACT / PonderNet (Graves 2016); LoopWM (arXiv:2606.18208) is the citable instance. Zero
    new model, zero training, 16GB/offline-safe. Frame it as "ACT-style adaptive budget for our explorer,"
    NOT "implementing LoopWM." (The Phase-3 "loop until E<tau" halt idea is note-and-file only, NOT this task.)

    EXISTING CODE TO READ FIRST:
      - {project_root}/docs/research-notes/loopwm-2606.18208-ingestion-2026-06-20.md (ACTION 1: the adaptive per-step budget)
      - {project_root}/docs/research-notes/arc-417-shaping-action-efficiency.md (candidate 6)
      - {project_root}/python/carnot/agentic/arc_competition_agent.py (StepwiseExplorer per-step budget -- the gate wires in here)
      - {project_root}/python/carnot/agentic/arc_value_learner.py (the value-head margin signal)
      - {project_root}/python/carnot/agentic/arc_solver_kit.py (offline_arcade, reproduce; frame-novelty from the state hash)
      - {project_root}/scripts/kaggle/arc_local_submission_gate.py (THE metric: median actions-to-solve, baseline 7760)

    TASK: add a per-step adaptive budget gate driven by already-computed signals; sweep its thresholds;
    SHOW it reduces median actions-to-first-levelup at equal solve-rate.

    CONCRETE STEPS:
      0. PRECONDITIONS (BEFORE any other step):
         a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
         Missing -> honest_verdict blocked_<resource>, EXIT. (--no-cov on any focused pytest.)
      1. Compute a cheap per-frame "ambiguity" score from existing signals: value-head margin (top-1 vs top-2), predicted-no-op fraction, frame-novelty (state-hash unseen).
      2. SOLVE-RATE-PRESERVING LEVER CONTRACT (outer-loop 2026-06-20, MANDATORY -- this OVERRIDES any "commit the single candidate / filter / budget 1" phrasing): the adaptive budget MUST be a DEFER, not a DELETE. On a low-ambiguity ("commit") frame, move the top candidate to the FRONT of node['untested'] and KEEP THE TAIL in the list -- never remove a candidate from node['untested'] nor a node from the graph. `apply_adaptive_budget` returning [rows[0]] is a destructive filter that reproduces the A1/A2 knife-edge failure (a 5%-recall prune still dropped m0r0); return the FULL REORDERED list. Commit ONLY on re-VISITED frames (frame_is_novel=False), never novel frames. Solve-rate is then preserved BY CONSTRUCTION; the only question the experiment answers is whether front-loading cuts actions.
      3. Measure median actions-to-first-levelup WITH vs WITHOUT the adaptive gate on the 8-game gate; report per-game + median + solve-rate. GATE = CORE set-containment over {lp85,m0r0,sp80,vc33} (NOT raw solved-count): report median_actions_on_core (median over the 4 CORE games, +inf for any CORE game not solved) and core_solves_preserved:bool. New solves outside CORE are a reported BONUS, never netted against a CORE loss. (The gate `_verdict` already implements this -- scripts/kaggle/arc_local_submission_gate.py.)
      4. POSITIVE CONTROL + FALSE_NEGATIVE_RISK guard: if the gate does not save actions, report the HONEST NULL. Add committed_frame_fraction_on_winning_path -- if ~0 the lever is architecturally inert (it acts on per-frame fan-out width, the axis A1 proved moves actions <=0.3%); report the honest null, do NOT chase a 4<->3 flip.
      5. Solves stay offline-reproduced via arc_solver_kit.reproduce.

    REQUIRED ARTIFACT FIELDS (principle-annotated):
      honest_verdict: principle "terminal prefix; e.g. success: adaptive_budget_median_actions_<n>_below_7760 OR complete: adaptive_budget_no_reduction_honest_null."
      inference_substrate: principle "verifier_ensemble_against_cached_candidates -- offline arcade, no LLM load (1s floor)."
      median_actions_baseline: principle "the 7760 control, fixed."
      median_actions_with_adaptive: principle "the headline -- did skipping expansion on easy frames cut actions."
      solve_rate_baseline: principle "no-regression reference."
      solve_rate_with_adaptive: principle "the gate must not drop solve-rate (committing 1 candidate on a truly-ambiguous frame would)."
      ambiguity_signal_components: principle "names the already-computed signals used (no new model/training) -- the zero-cost claim is auditable."
      positive_control_passed: principle "proves the harness detects a real reduction."
      false_negative_risk_checked: principle "a null is valid only if the positive control passed."
      random_seed: principle "determinism precondition for reproducibility."
      reproducibility_checksum: principle "catches silent drift on replay."
      preconditions_checked: principle "records resources verified; pre-empts missing-resource fabrication."

    Run: cd {project_root} && .venv/bin/python python/carnot/experiment_4513_adaptive_per_step_budget.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.
