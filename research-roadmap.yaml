    1. Create results/experiment_1538_residual_drift_commitment_ledger.json immediately with status="in_progress".
    2. Derive bounded multi-turn cases from the SATQuest manifest, product-line rescue cases, and runtime-contract prompts.
    3. Implement a commitment ledger that records constraints introduced at each turn and validates final answers against all prior commitments.
    4. Use the deterministic SAT/product-line/runtime validators to classify each failure as contradiction, satisfiable drift, or other blocker.
    5. Run at least one mandated SOTA headline model on the bounded case set and record model specs.
