    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/python/carnot/experiment_7671_v669_contract_methods.py
    - {project_root}/python/carnot/reporting/v669_capstone.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/research-references.md
    - {project_root}/research-complete.yaml
    - {project_root}/ops/conductor-log.md

    TASK:
    Produce results/experiment_7699_v671_contract_methods.json. Add REQ-REPORT-7699 and the affected capability requirement before code. Use a thin CLI at scripts/experiments/experiment_7699_v671_contract_methods.py; orchestration belongs in python/carnot/experiment_7699_v671_contract_methods.py. Reusable behavior belongs in its capability module. Tests: tests/python/test_experiment_7699_v671_contract_methods.py.
    Execution: inference_substrate_class=aggregation; MODEL_SPECS=[].

    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed progress line immediately. Resolve {project_root} absolutely. Authenticate required input bytes and current resource availability. Missing external inputs mean complete_blocked_<reason>, verdict_class=blocked, with gate_check_summary. partial is only unfinished owned work. Do not repair credentials or stop foreign processes. Record the effective agent backend and current successful invocation receipt. YAML routing is only a request: CODEX_FORCE_EXPERIMENTS may coerce it. Backend recovery must be verified before activation; never invent requires_claude_verified or change routing settings. A repeated usage-limit failure is an external block, not scientific evidence.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Print elapsed time and completed units INSIDE long loops at least every 60 seconds. Stream child output and maintain an owned heartbeat while waiting. Keep EVERY silence gap under 600 seconds to retain the 4800-second cap; a silent task can die at 1200 seconds. Checkpoint completed units.

    3. Bound EVERY tool call. Write any file over about 200 lines in several tool calls of about 100-150 lines, with a progress message BETWEEN calls. Split large reads and checks too. Put scratch in /tmp, real entrypoints in scripts/experiments and tests in tests/python.

    4. Before implementation, add the task REQ-* and SCENARIO-* to its capability spec. Write meaningful failing tests, then implement reusable behavior with a thin CLI. Freeze affected validation scope before measurement. Preserve existing artifacts, unrelated edits and all operator-curated documents.

    5. Select staged authority only when its milestone is 2026.09.671; otherwise use the matching activated roadmap. Compare fourteen ordered tasks Exp7699-Exp7712 against the design table and machine contract. Include titles, phases, paths, substrates, models and all gates. This accounting task gates no science.

    6. Account for all fourteen V670 dispositions from literal conductor-log entries, missing producer paths and the zero-commit operational retrospective. Six roots exhausted three usage-limit attempts; eight descendants skipped. No V670 honest_verdict exists. Preserve the V669 exposure and coverage corrections as historical findings, not V670 measurements. Read resolved dispatcher code and available launch metadata without executing another agent or exposing secrets; record declared/effective backend and the successful invocation that runs this task. Do not claim a setting change fixed quota.

    7. Write docs/research-notes/v671-method-map.md. Ingest Enoki anchoring, structured-versus-semantic decoding, bounded delayed feedback, ADOWIP update allocation and full orchestration cost from the dated V671 reference entry. Use a focused arXiv/Semantic Scholar delta check and record access failures. Record applicability limits and retired-scope exclusions in research-studying.md. No generator training or new sampler is required.

    8. E2E: test staged and activated-only authority in private copies. Reject deletion, reordering, a wrong producer field, missing mandated model and stale milestone. Run schema, exclusion, failure-lineage, gate, prompt-path, harness-fit, ARC and overdue-priority readers. Never activate the milestone.

    9. Run scoped pytest with -n 0 -o addopts=, pinned PYTHONPATH, private COVERAGE_FILE and a private --basetemp whose parent exists. Require 100 percent changed-module coverage, affected-test spec coverage, scoped Ruff check/format and changed-module mypy. Add scoped cargo tests/fmt/clippy for Rust changes. Run the task E2E and applicable numbered checks from ops/e2e-test-plan.md. Record unrelated full-suite debt separately; do not change acceptance scope after results.

    10. Cold-reduce raw rows independently in a fresh process. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Retain commands, exits and log hashes before atomic publication. Failed required checks disqualify and zero readiness scores. Fixture-oracle evidence is circular_positive; administrative readiness is null. Follow CLAUDE.md adversarial review requirements for non-trivial changes.

    11. Reconcile openspec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Apply every declared same-verdict retirement to its actual mechanism. Missing producer entries in prior_failures use explicit not_emitted custody markers, not invented scientific verdicts. Do not activate, edit research-roadmap.yaml, train generator weights, change production defaults, publish, submit, or buy hardware.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: Use a terminal complete_ prefix; task completion does not mean scientific benefit.; principle: A terminal disposition prevents retries of unchanged external blocks.
    - verdict_class: Exactly positive | circular_positive | null | blocked | disqualified | partial. External absent, retired or blocked upstreams are blocked, never partial.; principle: A closed enum carries claim eligibility into downstream readers.
    - flagged_adversarial: Actual terminal-reader boolean; flagged artifacts cannot open gates.; principle: Disqualified evidence must not pass a downstream readiness gate.
    - gate_check_summary: Every blocked result names check, upstream ID, artifact path, exact field, operator, expected and observed values.; principle: Exact upstream fields and observed values distinguish a false gate from missing evidence.
    - acceptance_gate_results: Separate validity, readiness, coverage, freshness, probability, utility, retention and efficiency with measured operands.; principle: This record makes the stated claim independently checkable and limits its scope.
    - rows: Per independent unit and arm: raw metrics, counts, exclusions, censoring and provenance. Seeds and transformed views never enlarge n.; principle: Unit observations let another reader recompute every comparison.
    - sample_size_budget: Intended, observed, eligible, excluded and censored groups, effective blocks, prior exposure and inference limits.; principle: This record makes the stated claim independently checkable and limits its scope.
    - inference_substrate: Actual current work in the established vocabulary. Historical model provenance stays separate.; principle: The declared execution path must match real computation and its duration floor.
    - inference_substrate_class: Actual and planned classes; full generation 60s, bounded generation 10s, model load without generation 2s. No time padding. If blocked before load, report actual no_model_load.; principle: The duration floor must describe actual generation or no-generation work.
    - MODEL_SPECS: Actual plus planned_MODEL_SPECS; current LLM is unsloth/Qwen3.8-27B-GGUF. CPU tasks use []. Also emit reader-compatible model_specs with an explicit no-model declaration.; principle: Experimental models must match actual invocations, not the coding agent.
    - model_invoked: Actual flag and invocation_counts for loads, forwards, generations, tokens, failures and cancellations.; principle: This record makes the stated claim independently checkable and limits its scope.
    - execution_venue: host | kv260 | polarfire | gatemate. execution_venue_details records host, PID and GPU UUID when used.; principle: This record makes the stated claim independently checkable and limits its scope.
    - phase_spans: Disjoint monotonic spans, heartbeat timestamps, completed units, checkpoints and duration_s for current work.; principle: This record makes the stated claim independently checkable and limits its scope.
    - random_seed: Seeds and purposes; reproducibility_checksum binds immutable source bytes, configuration and reducer code.; principle: Independent replay requires the same declared random inputs.
    - source_artifact_hashes: Producer, pre-gate and missing custody stay separate. A planned output cannot be its own immutable input.; principle: This record makes the stated claim independently checkable and limits its scope.
    - preconditions_checked: Measured checks of required inputs and resources, never a requirement that a planned output already exists.; principle: This record makes the stated claim independently checkable and limits its scope.
    - validation_receipts: Frozen affected scope, actual commands/exits/log hashes, cold reduction and terminal readers.; principle: This record makes the stated claim independently checkable and limits its scope.
    - verifier_is_oracle: True for exact fixture truth; it forbids positive. Learned-policy and evaluator roles remain distinct.; principle: Fixture correctness cannot establish an oracle-distinct verifier advantage.
    - field_principles: Echo each required field and each acceptance gate with its governing principle; readiness prevents invalid evidence propagation, quality thresholds prevent effects being inferred from plumbing, and retention bounds prevent improvement by forgetting.; principle: This record makes the stated claim independently checkable and limits its scope.
    - contract_ready_score: 1 only for exact contract equality and valid readers; administrative readiness.; principle: This record makes the stated claim independently checkable and limits its scope.
    - prior_dispositions: Fourteen V670 entries: six usage-limit root failures, eight gate skips and zero scientific producers; literal log custody, not invented verdicts.; principle: This record makes the stated claim independently checkable and limits its scope.
    - method_map_path: docs/research-notes/v671-method-map.md; principle: This record makes the stated claim independently checkable and limits its scope.

    - execution_recovery_receipt: Declared/effective backend, immutable launch receipt and successful current invocation; readiness does not promise future quota.; principle: This record makes the stated claim independently checkable and limits its scope.


    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7699_v671_contract_methods.py --date {date} --output results/experiment_7699_v671_contract_methods.json
    Do NOT push. Do NOT modify scripts/research_conductor.py.
