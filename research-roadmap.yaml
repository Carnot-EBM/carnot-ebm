    - scripts/experiment_template.py — ExperimentTemplate, DualGPURunner.
    - python/carnot/pipeline/experiment_watchdog.py — 90-min hard stop.

    TASK: Retrain JEPA v15 on real violation data with CPMI+PURE, evaluate OOD AUC.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-036 (JEPA v15 trained on real violations achieves OOD AUC >= 0.80),
       REQ-LEARN-037 (JEPA v15 ECE < 0.10 via Platt calibration after training),
       SCENARIO-LEARN-064/065/066 to openspec/capabilities/autoresearch/spec.md.
    3. Create scripts/experiment_671_jepa_v15.py:
       a. Call apply_env_autofix() inside main() first.
       b. ExperimentTimeoutWatchdog(671, timeout_minutes=90).
       c. GPU gate: LiveGPUGate.require_live_or_blocked() or CPU fallback mode.
