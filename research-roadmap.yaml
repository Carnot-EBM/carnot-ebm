- id: exp2393-codex-cli-diagnostic
  title: 'Phase 0: Codex CLI Infrastructure Diagnostic and Repair'
  milestone: 2026.05.233
  deliverable: results/experiment_2393_codex_diagnostic.json
  agent_type: claude
  model: claude-opus-4-7
  max_turns: 40
  requires_claude: true
  prompt: |-
    CONTEXT: All 11 implementation tasks in milestone .232 (exp2378-exp2388) failed with
    identical error: "Codex CLI error: u finish the real work inside 10 minutes, that is
    correct an". This truncated message indicates the Codex CLI agent is responding
    conversationally ("you finish the real work inside 10 minutes, that is correct answer")
    rather than executing the task. This is a catastrophic infrastructure failure that
    blocked the entire .232 milestone. Root cause is unknown.

    REQUIRES_CLAUDE JUSTIFICATION: codex has demonstrably failed x33 across 11 task
    categories in .232 (positive criterion 1). Diagnosing conductor-codex integration requires
    reading conductor-log.md, checking codex CLI binary, examining script invocation patterns
    across 5+ files, running subprocess tests (positive criterion 2). Root cause is unknown —
    requires hypothesis testing and interpretation under ambiguity (positive criterion 3).

    Do NOT modify scripts/research_conductor.py. Read it (read-only) to understand codex invocation.

    TASK: Diagnose the Codex CLI failure mode. Attempt to reproduce and fix it. Document
    root cause and repair status. Write artifact with infrastructure_repaired boolean.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Check if codex CLI is installed:
            which codex 2>/dev/null && codex --version 2>/dev/null || echo "codex_not_found"
         b. Check conductor log for the .232 error pattern:
            tail -200 {project_root}/ops/conductor-log.md | grep -A3 "Codex CLI error" | head -40
         c. Read ops/conductor-log.md last 100 lines for context around failures.

      1. Attempt minimal codex test:
         a. Create a temp test file: echo "# test" > /tmp/codex_test_hello.py
         b. Run codex on it with a trivial task:
            codex --model gpt-5.5 "Add a print hello world line to this file." /tmp/codex_test_hello.py 2>&1 | head -20
            (or whatever the actual codex CLI invocation pattern is from scripts/research_conductor.py)
         c. Record exit code, stdout first 20 lines, stderr first 20 lines.

      2. Read scripts/research_conductor.py (READ ONLY — do NOT modify) to understand:
         a. How codex subprocess is invoked (look for subprocess.run, Popen, or codex calls)
         b. What prompt template is passed to codex
         c. How the "Codex CLI error:" prefix is generated (find the error handler)
         d. Whether there is a 10-minute timeout configured anywhere

      3. Examine the exact failing task prompt from .232:
         Look at the research-roadmap.yaml for task exp2378 prompt to see if there's
         a "10 minutes" or timing instruction that could be echoed back.

      4. Diagnose root cause:
         Based on findings: hypothesize why codex is producing "u finish the real work
         inside 10 minutes, that is correct an" instead of executing the task.
         Likely hypotheses:
           H1: codex CLI version changed and its output format is now different
           H2: The prompt template contains a "10 minute" timing instruction that codex echoes
           H3: A system prompt or environment variable is being injected that causes this
           H4: codex CLI is not installed and the error is from a fallback path
           H5: Network/auth issue causing codex to fall back to a default response

      5. Attempt repair (if diagnosable without modifying research_conductor.py):
         a. If H4 (not installed): install codex CLI per documentation
         b. If H1 (version change): check release notes, try older invocation syntax
         c. If H2 (prompt echo): note which task prompt field contains "10 minutes" — this
            is a planner-side fix for .233 prompts (do NOT add "10 minutes" in any .233 task)
         d. Document the fix attempted and whether it resolved the issue

      6. Run a verification test after any repair attempt:
         Repeat step 1 minimal codex test. Record new result.

      7. Update ops/conductor-log.md with a "## 2026-05-18 Codex CLI Diagnostic" section
         documenting findings and repair status.

      8. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: if diagnostic ran fully. blocked_* if codex not accessible."
      - infrastructure_repaired:
          principle: "True if codex CLI now responds correctly to minimal test. False if still broken."
      - codex_cli_version:
          principle: "Version string from codex --version. null if not installed."
      - root_cause_diagnosed:
          principle: "True if root cause was identified. False if still unknown."
      - root_cause_summary:
          principle: "One sentence: what caused the .232 Codex CLI failures."
      - repair_action_taken:
          principle: "What was done to fix it (or 'none — requires operator action')."
      - minimal_codex_test_result:
          principle: "exit_code + first 5 lines of stdout from step 1 minimal test."
      - preconditions_checked:
          principle: "Records codex CLI check (present/absent), conductor-log line count."
      - duration_s:
          principle: "Guards against fabrication — diagnostic takes wall time."

    ACCEPTANCE GATES:
      - condition: "root_cause_diagnosed == true OR codex_cli_version != null"
        principle: "Must have gathered at minimum the version info; full diagnosis preferred."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2394-halt-tier0j-v2
  title: 'Phase 1: HALT Latent Probe Tier 0j v2 (arXiv:2601.14210) — Codex Recovery Rerun'
  milestone: 2026.05.233
  deliverable: results/experiment_2394_halt_tier0j.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2379-halt-tier0j-latent-probe
    verdict: codex_cli_error_failed
    addressed_by: "exp2379 failed 3 times with Codex CLI error in .232. exp2393 diagnosed
      and repaired the Codex CLI infrastructure. This attempt is otherwise identical in scope:
      implement HaltProbeDetector at python/carnot/verify/halt_probe.py using Proxy A/B/C
      on the telemetry manifest. Different milestone, post-infrastructure-repair context."
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT: HALT (Hallucination Assessment via Latent Testing, arXiv:2601.14210) uses
    lightweight residual probes on intermediate hidden states of question tokens to estimate
    hallucination risk. In the absence of direct hidden-state access, three proxy strategies
    work on cached logprob telemetry:
      Proxy A: variance of top-k logprob values (higher = more uncertain)
      Proxy B: kurtosis of softmax(logprobs) (heavy tail = hallucination signal)
      Proxy C: lightweight LogisticRegression probe trained on logprob features

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/semantic_energy.py (Tier 0g — follow this pattern)
      {project_root}/python/carnot/verify/laab_verifier.py (Tier 0h — reference architecture)
      {project_root}/results/experiment_2351_semantic_energy_real.json (baseline AUROC=0.685)

    TASK: Implement HaltProbeDetector and evaluate on 36 telemetry entries.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. sklearn importable: .venv/bin/python -c "import sklearn; print(sklearn.__version__)"
            If missing: .venv/bin/pip install scikit-learn -q
         b. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         c. Inspect telemetry fields:
            .venv/bin/python -c "
            import json
            with open('{project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl') as f:
                row = json.loads(f.readline())
            print(list(row.keys()))
            "

      1. Implement HaltProbeDetector at python/carnot/verify/halt_probe.py:
         - compute_halt_score(entry: dict) -> float using whichever proxy fields exist
         - verify(entry: dict) -> dict with halt_risk_score, is_high_risk, proxy_used
         - Tier 0j (cheap, training-free for Proxy A/B; lightweight train for Proxy C)

      2. Evaluate on 36 entries (same split as exp2351 for direct comparison):
         Load first 36 entries from live_sota_balanced_telemetry_manifest_1480.jsonl.
         Compute: halt_k19j_auroc, halt_k19j_mean_risk_score,
         halt_vs_semantic_energy_auroc_delta (baseline 0.685).

      3. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "halt" -v --no-cov 2>&1 | tail -15
         If no halt test exists, create tests/python/verify/test_halt_probe.py with 1 assertion.

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with AUROC result."
      - halt_k19j_validated:
          principle: "True if HaltProbeDetector ran and produced non-trivial risk scores."
      - halt_k19j_auroc:
          principle: "Primary metric — compare with baseline 0.685. No fabrication."
      - halt_vs_semantic_energy_auroc_delta:
          principle: "HALT - SemanticEnergy delta. Positive = improvement over baseline."
      - halt_proxy_used:
          principle: "Records which proxy strategy was used (A/B/C) for reproducibility."
      - n_eval_examples:
          principle: "Must be 36 for direct comparison with exp2351."
      - verifier_tier:
          principle: "Must be '0j'."
      - random_seed:
          principle: "Must be 42 for reproducibility."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records sklearn + telemetry manifest check."

    ACCEPTANCE GATES:
      - condition: "halt_k19j_validated == true"
        principle: "HALT must run and produce non-trivial risk scores on real data."
      - condition: "n_eval_examples >= 30"
        principle: "Minimum sample size for AUROC claim validity."

