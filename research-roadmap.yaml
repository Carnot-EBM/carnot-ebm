- id: exp1252-q11-tss-instrumentation
  milestone: 2026.04.97
  deliverable: results/experiment_1252_q11_tss_instrumentation.json
  title: "Q11 TSS Instrumentation — SMT Triviality + Orthant Occupancy Diagnostic for k=5 Ensemble"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 20
  priority: medium
  requires_gpu: false
  skip_pre_test: true
  prompt: |
    CONTEXT:
    Q11 (Transversal Spectral Synthesis) predicts that the sign(z) bottleneck in Carnot's
    Phase-3 DBAE enables polynomial-time attacks if the verifier ensemble has SMT-trivial
    components. SMT triviality: a verifier that returns energy=0 for all inputs (trivially
    never flags anything). Orthant occupancy: fraction of the Boolean orthant that ANY
    verifier accepts (energy < 0.5). High orthant occupancy = large exploitable null space.

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/and_composition_verifier.py (k=5 ensemble + verify() method)
    - results/experiment_1108_ensemble_diversity_v2_and_composition.json (baseline)
    - results/fover_corpus_v5.json (50 samples for diagnostic)

    TASK:

    STEP 0 — Write skeleton artifact:
    python3 -c "
    import json; d = {'experiment':'1252_q11_tss_instrumentation','run_date':'{date}',
        'status':'in_progress','q11_instrumentation_shipped':False,'honest_verdict':'in_progress'}
    open('results/experiment_1252_q11_tss_instrumentation.json','w').write(json.dumps(d,indent=2))
    print('STEP 0 written')" 2>&1

    STEP 1 — Write scripts/q11_tss_diagnostic.py:
    The script should:
    1. Load k=5 verifiers from and_composition_verifier.py
    2. Run 50 FoVer corpus v5 pairs through each verifier
    3. For each verifier, compute:
       - SMT_triviality_rate: fraction of inputs where energy = 0.0 (exact zero)
       - orthant_occupancy: fraction where energy < 0.5 (verifier accepts)
    4. For the AND-composition, compute:
       - AND_occupancy: fraction where ALL 5 verifiers accept (energy < 0.5)
