    - {project_root}/openspec/capabilities/research-harnesses/spec.md

    TASK:
    Implement and validate a reusable evidence-ingress helper that excludes
    adversarially flagged artifacts from aggregation and requires run_date on
    new evidence. Audit the 55 known historical capstone references without
    mutating old artifacts. Make this helper usable by Exp7115, Exp7119, and
    Exp7120.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable results, known-issues ledger, exclusion
       manifest, adversarial verifier output or deterministic replay, and
       writable source, test, spec, and artifact paths. If unavailable, write
       terminal `blocked`, `inference_substrate_class=blocked_no_run`, and exact
       gate_check_summary.
    1. Add REQ-REPORT-7110 and RED tests before implementation. Cover accepted
       clean input; artifact-level `flagged_adversarial=true`; sidecar/verifier
       flag; missing run_date; malformed date; absent artifact; duplicates;
