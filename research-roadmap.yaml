  title: 'Exp 534: PottsMachineVerifier — multi-value constraint states (arXiv 2602.04200)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Carnot's\
    \ IsingEBM uses binary spin states (+1/-1) for constraint verification: each\
    \ constraint is either satisfied or violated. Many real constraint states are\
