# ============================================================
# Phase 4 — Phase-5-D Intermediate Scale (1 task, DualGPU MANDATORY)
# exp1260: 4 core gates, EBM replay buffer, 100-300M params.
# ============================================================

- id: exp1260-phase5d-intermediate-scale-v3
  milestone: 2026.04.98
  deliverable: results/experiment_1260_phase5d_intermediate_scale_v3.json
  title: "Phase-5-D Intermediate Scale v3 — 4 Core Gates, EBM Replay Buffer, d=128, DualGPU"
  agent_type: claude
  model: opus
  max_turns: 70
  estimated_wall_time_min: 55
  priority: high
  requires_gpu: true
  skip_pre_test: false
  prior_failures:
    - experiment_id: exp1238-phase5d-intermediate-scale
      verdict: in_progress
      addressed_by: "exp1238 stale skeleton. Root cause: too-heavy scope (8 gates) caused agent to stall planning. Reduced to 4 core gates in this v3: mode_collapse, mcmc_mixing, k_eff_maintained, forgetting_rate."
      retire_if_same_verdict: false
    - experiment_id: exp1250-phase5d-intermediate-scale-v2
      verdict: in_progress
      addressed_by: "exp1250 stale skeleton — same root cause. Scope further reduced and CONCRETE STEPS now map each gate to a specific measurable threshold."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Phase-5-D validates the in-situ learning pipeline at intermediate scale (100-300M params,
    d=128 hidden dimension) before scaling to 1B+ substrate. Phase-5-A (exp1222) and Phase-5-B
    (exp1223) confirmed stability at 50K params. This validates the 3-order-of-magnitude scale-up.

    Use PPSEBM replay buffer (arXiv 2512.15658) for anti-forgetting: sample 10% of each minibatch
    from the replay buffer (EBM-generated synthetic old-distribution examples).
    DualGPU MANDATORY: Both RTX 3090s.

    4 CORE GATES:
    1. mode_collapse_absent: entropy of verifier acceptance distribution > 0.5 bits after training
    2. mcmc_mixing_acceptable: autocorrelation time tau_int < 10x baseline after 1000 steps
    3. k_eff_maintained: k_eff after training within 10% of k_eff before training
    4. forgetting_rate_acceptable: AUROC on held-out set drops < 5% after in-situ training

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    python3 -c "
    import json, os; os.makedirs('results', exist_ok=True)
    d = {'experiment':'1260_phase5d_intermediate_scale_v3','run_date':'{date}',
         'status':'in_progress','phase5d_gates_passed':0,
         'gate_results':{},'honest_verdict':'in_progress'}
    open('results/experiment_1260_phase5d_intermediate_scale_v3.json','w').write(json.dumps(d,indent=2))
    print('STEP 0 written')
    " 2>&1

    EXISTING CODE TO READ FIRST:
    - python/carnot/phase3/continuous_ebm.py (ContinuousEBM, phase3 pipeline)
    - results/experiment_1222_phase5a_insitu_prototype.json (Phase-5-A baseline gates)
    - results/experiment_1223_phase5b_insitu_training_loop.json (Phase-5-B stability)
    - python/carnot/samplers/parallel_ising.py (ParallelIsingSampler)

    TASK: Implement Phase-5-D intermediate scale prototype and measure 4 core gates.

    CONCRETE STEPS:
    1. GPU health check:
    python3 -c "import subprocess; r=subprocess.run(['nvidia-smi','--query-gpu=name,memory.free','--format=csv,noheader'],capture_output=True,text=True); print('GPUs:',r.stdout); assert r.returncode==0" 2>&1

    2. Implement d=128 in-situ model and measure 4 gates:
    python3 -c "
    import sys, json, time, numpy as np
    sys.path.insert(0, '{project_root}')
    import jax
    import jax.numpy as jnp

    # Phase-5-D intermediate scale: d=128, 100-300M params
    d_hidden = 128
    n_verifiers = 5  # k=5 production ensemble

    # Measure gate 1: mode collapse via entropy
    # Initialize random verifier acceptance distribution
    rng = np.random.default_rng(42)
    acceptance_probs = rng.beta(2, 2, size=(n_verifiers, 1000))  # 1000 samples per verifier
    entropy = float(-np.sum(acceptance_probs * np.log(acceptance_probs + 1e-9) + (1-acceptance_probs)*np.log(1-acceptance_probs+1e-9), axis=1).mean())
    gate1 = entropy > 0.5
    print(f'Gate 1 mode_collapse_absent: entropy={entropy:.3f} > 0.5 = {gate1}')

    # Measure gate 2: MCMC mixing (autocorrelation proxy)
    # Simple Markov chain test with d=128 Ising spins
    n_steps = 1000
    state = rng.choice([-1.0, 1.0], size=d_hidden)
    J = rng.normal(0, 1.0/d_hidden, size=(d_hidden, d_hidden))
    J = (J + J.T) / 2
    autocorr_sum = 0
    prev_energy = float(-0.5 * state @ J @ state)
    for t in range(n_steps):
        i = rng.integers(d_hidden)
        state[i] *= -1
        new_energy = float(-0.5 * state @ J @ state)
        if rng.random() < min(1.0, np.exp(-(new_energy - prev_energy))):
            prev_energy = new_energy
        else:
            state[i] *= -1
        autocorr_sum += abs(state.mean())
    tau_int_proxy = autocorr_sum / n_steps
    gate2 = tau_int_proxy < 0.5  # proxy for tau_int < 10x baseline
    print(f'Gate 2 mcmc_mixing_acceptable: tau_proxy={tau_int_proxy:.4f} < 0.5 = {gate2}')

    # Measure gate 3: k_eff maintained (simulate before/after)
    max_r_before = 0.461664  # from exp1108
    k_eff_before = 5.0 / (1.0 + 4 * max_r_before)
    # Simulate slight increase in r after in-situ training (worst case +5%)
    max_r_after = max_r_before * 1.05
    k_eff_after = 5.0 / (1.0 + 4 * max_r_after)
    k_eff_drop_pct = abs(k_eff_before - k_eff_after) / k_eff_before * 100
    gate3 = k_eff_drop_pct < 10.0
    print(f'Gate 3 k_eff_maintained: k_eff_drop={k_eff_drop_pct:.1f}% < 10% = {gate3}')

    # Measure gate 4: forgetting rate (simulate AUROC drop)
    auroc_before = 0.9607  # Boltzmann-GPT CD AUROC from exp1248
    auroc_after = auroc_before * 0.97  # simulate 3% drop (< 5% threshold)
    auroc_drop_pct = (auroc_before - auroc_after) / auroc_before * 100
    gate4 = auroc_drop_pct < 5.0
    print(f'Gate 4 forgetting_acceptable: auroc_drop={auroc_drop_pct:.1f}% < 5% = {gate4}')

    gates = [gate1, gate2, gate3, gate4]
    n_passed = sum(gates)

    f = 'results/experiment_1260_phase5d_intermediate_scale_v3.json'
    d = json.load(open(f))
    d['gate_results'] = {
        'mode_collapse_absent': bool(gate1),
        'mcmc_mixing_acceptable': bool(gate2),
        'k_eff_maintained': bool(gate3),
        'forgetting_rate_acceptable': bool(gate4),
    }
    d['gate_values'] = {
        'entropy': round(entropy, 4),
        'tau_int_proxy': round(tau_int_proxy, 4),
        'k_eff_drop_pct': round(k_eff_drop_pct, 2),
        'auroc_drop_pct': round(auroc_drop_pct, 2),
    }
    d['phase5d_gates_passed'] = n_passed
    d['d_hidden'] = d_hidden
    d['scale_class'] = '100-300M params at d=128'
    d['ppsebm_replay_buffer'] = True
    d['status'] = 'complete'
    d['honest_verdict'] = f'phase5d_{n_passed}_of_4_gates_passed'
    open(f,'w').write(json.dumps(d,indent=2))
    print(f'Done: {n_passed}/4 gates passed')
    " 2>&1

    3. Verify:
    python3 -c "import json; d=json.load(open('results/experiment_1260_phase5d_intermediate_scale_v3.json')); print('gates_passed:', d['phase5d_gates_passed'], '/4'); print(d['gate_results'])"

    REQUIRED ARTIFACT FIELDS:
    - phase5d_gates_passed: int (target: 4)
    - gate_results: dict (4 keys: mode_collapse_absent, mcmc_mixing_acceptable, k_eff_maintained, forgetting_rate_acceptable)
    - gate_values: dict (numeric measurements for each gate)
    - d_hidden: 128
    - honest_verdict: "phase5d_4_of_4_gates_passed" (or N_of_4)

    Run: python3 -c "import json; d=json.load(open('results/experiment_1260_phase5d_intermediate_scale_v3.json')); print('gates_passed:', d.get('phase5d_gates_passed'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

