  gated_on:
    - upstream: exp6903-bounded-relation-memory-self-learning
      artifact_field: self_learning_run_complete_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Exp6903 runs the controller and reports both protocol completion and utility. Cheap Verifiers,
    Large Blind Spots and verifier-induced support reshaping show why an in-loop dashboard cannot
    release its own update. This task replays all rows in a fresh process against sealed exact
    outcomes. It audits utility even when Exp6903 reports null.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V604 Planner Refresh
