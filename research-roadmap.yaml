  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: ThinkPRM (arXiv 2504.16828, OpenAI,\
    \ April 2025) shows that generative Process Reward Models — models that THINK about whether\
    \ a step is correct via chain-of-thought — are dramatically more sample-efficient than discriminative\
    \ classifiers (1% of supervision labels, SOTA on MATH-500 and AIME '24).\n\nCarnot's EORM is\
    \ discriminative (assigns a scalar score). CarnotThinkProbe is the generative alternative:\
    \ given an LLM response, ask a secondary Qwen3.5-0.8B to generate a 3-step verification CoT\
    \ ('Step 1: Extract the arithmetic claim. Step 2: Check if it is correct. Step 3: Verdict.').\
    \ If the CoT concludes 'incorrect', skip Ising and flag immediately (fast-path). Only run\
    \ Ising for 'uncertain' or 'correct' verdicts. This creates a fast-path/slow-path architecture.\n\n\
    CPU-only (CI stub if GPU absent). Always produces a result JSON.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST)\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog\n\
    - python/carnot/pipeline/sink_probe.py — SinkProbe (Exp 348) — fast-path pattern to follow\n\
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline (integration point)\n\
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline\n\
    \nTASK: Implement CarnotThinkProbe.\n\
    1. apply_env_autofix() FIRST.\n\
    2. Add REQ-VERIFY-094 (CarnotThinkProbe generates 3-step verification CoT to classify\n\
    \   responses as incorrect/uncertain/correct before running Ising),\n\
    \   REQ-VERIFY-095 (CI-safe stub returns uncertain verdict without GPU),\n\
    \   SCENARIO-VERIFY-126/127/128.\n\
    3. Write tests FIRST (100% coverage) for:\n\
    \   - ThinkVerdict(verdict: Literal['incorrect', 'uncertain', 'correct'],\n\
    \     confidence: float, reasoning_steps: list[str])\n\
    \   - ThinkProbeResult(response_text: str, verdict: ThinkVerdict,\n\
    \     should_run_ising: bool, latency_ms: float)\n\
    \   - build_think_probe_prompt(response: str) -> str:\n\
    \     Returns 3-step verification prompt template\n\
    \   - parse_think_probe_output(output: str) -> ThinkVerdict:\n\
