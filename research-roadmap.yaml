  title: 'Exp 448: Tier 2 Cross-Session Constraint Memory Relay — continuous self-learning (MANDATORY per research-program.md)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
