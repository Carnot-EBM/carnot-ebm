milestone: 2026.06.391
milestone_title: "FINISH WHAT .390 STARTED — the oracle-distinct headline gate was blocked on a FIXABLE DATA bug (the build looked for ARC candidate labels in the wrong file; the WORKING label path that yielded 8,041 labeled candidates + an oracle-distinct ARC detection AUROC of 0.90 is in-repo), and the verifier-as-reward run died on a FIXABLE HARNESS bug (PEFT refused the custom Gemma4ClippableLinear). .391 reuses the working label path to BUILD the oracle-distinct ARC verifier and RUN the beats-vote gate (matched control + ARBITER conservative-override, CI95-excl-0), and applies the .360 HARNESS-FIRST discipline to the recurring reward-training failure (fix the LoRA attach, smoke-test it, THEN run the 3-arm A-vs-B). ARC continues monotonic +1 (->17) + the live-env accuracy probe."
milestone_doc: openspec/change-proposals/research-roadmap-v391.md
milestone_overview: |
  .390 asked the right two questions and was blocked by INFRA on both load-bearing ones.
  HEADLINE (does a LEARNED, oracle-distinct verifier beat majority vote on ARC where execution is NOT
  the oracle?): the A2 build (exp4209) returned blocked_arc_pool_no_candidate_labels because it looked
  for per-candidate is_correct labels in results/arc3_trm_verifier_rerank.json (which holds rerank
  SUMMARIES, not training rows), so A3 (exp4210) gate-blocked on selector_trained=False -- the gate
  NEVER RAN. But the SAME milestone's detector probe (exp4208) labeled 8,041 ARC candidates and measured
  an oracle-distinct ARC detection AUROC of 0.9016 (CI95 [0.78, 0.998], verifier_is_oracle=false) via
  scripts/exp_verifier_detector_auroc.py:load_arc_rows() over arc3_gap3_stage2_eval_pool.json.gz +
  arc3_gap4_induced_programs.json (label = candidate grid == GAP-4 induced pred_grid). The oracle-distinct
  signal demonstrably EXISTS; only the selector's labeled pool was missing, and the working label path is
  in-repo. OWED verifier-as-reward A-vs-B (exp4211): failed a 3rd straight time on a NEW fixable harness
  bug -- ValueError: Target module Gemma4ClippableLinear is not supported (PEFT matched the custom Carnot
  Gemma4 wrapper instead of a standard nn.Linear); the operating point (Phase-0 0.956, Youden-J 0.4138) +
  N-matched corpora (A=776/B=776/C=742) + the checkpoint dir are intact on disk. .390 also: ARC advanced
  +1 to total_levels=16 (exp4213 sc25 L2); the live solver still completes 0 levels (efficiency-only,
  exp4214); the certified-corpus distill-lift came back ABSENT a 2nd time (exp4212, DROPPED here per
  Depth-Over-Breadth); 2 flagged artifacts (exp4212, exp4216). New literature confirms the headline
  mechanism is real and beatable: AggLM (arXiv:2509.06870) trains an aggregator that recovers
  minority-correct answers and beats reward-model baselines; AgentAuditor (2602.09341) beats BOTH vote and
  LLM-judge; GenSelect-BoN (2602.02143) beats vote on math+code.

  .391 is NOT a new direction -- it is the disciplined COLLECTION of the two reads .390 set up:
    PHASE A -- THE ORACLE-DISTINCT HEADLINE (the de-risked retry): A1 (exp4220) BUILD the labeled ARC
      candidate pool (OWN label construction -- reuse load_arc_rows() over the GAP-4 pools; the .390 block
      cannot recur) + train the V-STaR/AggLM-style oracle-distinct ARC verifier on ACCEPTED+REJECTED,
      stratified to wrong-majority tasks (oracle@K > vote), out-of-fold, verifier_is_oracle=false. A2
      (exp4221, gated_on A1 selector_trained) MEASURE does it BEAT vote off-oracle vs a MATCHED no-verifier
      control + an ARBITER conservative-override arm + oracle@K positive control, CI95-excl-0 -- THE
      HEADLINE GATE.
    PHASE B -- OWED verifier-as-reward + self-learning (FR-11), HARNESS-FIRST: B1 (exp4222) FIX + SMOKE the
      LoRA harness (load the NON-Qwen base via standard AutoModelForCausalLM with standard nn.Linear
      target_modules, NOT the custom Gemma4 wrapper) -- deliverable = a PASSING smoke asserting LoRA
      attaches + 1 finite training step on a fixture. B2 (exp4223, gated_on B1 harness_smoke_passed) RESUME
      the intact checkpoint + run the 3-arm A/B/C/D SYNCHRONOUSLY; A(certified) vs B(same-generator
      random-label = Spurious-Rewards control); gold-control + truncation guards; verifier_is_oracle=true
      (HONEST reward axis).
    PHASE C -- ARC NORTH STAR: C1 (exp4224) monotonic ARC +1 (total_levels>=17); C2 (exp4225) the LIVE
      solver ACCURACY probe with the ARBITER conservative-override applied to goal-predicate induction, NO
      leaderboard submission.
    PHASE D -- reserved: D1 (exp4226) SOTA-ingestion (learned-aggregator track), D2 (exp4227) registry+gaps
      hygiene (flag-fixed: declare inference_substrate + methodology fields), D3 (exp4228) hardware
      continuity, D4 (exp4229) capstone .391.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227, SIGTERM'd) and the conductor
  stays stood-down. NO task may launch TRM training, run pkill/kill against train.py, or WRITE
  results/trm_runs/sudoku_extreme_baseline/. Phase B trains a SEPARATE small NON-Qwen code base via LoRA
  on the RTX 3090 -- it does NOT touch the TRM checkpoint. Qwen is FORBIDDEN as the TRAINED base
  (Spurious-Rewards confound); Qwen GGUF as an off-policy teacher / certifier reference is fine.
  DiffusionGemma stays GATED (STILL-PENDING; activate ONLY on an oracle-distinct win with a matched
  control). Every verifier-value task MUST declare verifier_is_oracle honestly (Circularity Discipline).

