    7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    8. Reconcile: update ops/conductor-log.md (Tier 2 cross-session relay status),\n\
    \   ops/changelog.md, _bmad/traceability.md (FR-11 Tier 2 status).\n\
