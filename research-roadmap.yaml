- id: exp686-fover-z3-formal-labels
  milestone: 2026.04.52
  deliverable: results/experiment_686_fover_formal_v1.json
  title: 'Exp 686: FoVer Z3 Formal PRM Labels — Auto-Annotate 200 GSM8K CoT Steps (arXiv 2505.15960)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2505.15960 (FoVer) shows that Z3 SMT solver can automatically annotate
    step-level correctness in reasoning chains. Instead of expensive human annotation
    (our FOVER corpus has only 57 pairs), Z3 can verify whether each arithmetic step is
    logically entailed by the prior steps.

    Carnot's JEPA predictor is bottlenecked by training data quantity. FoVer provides a
    path to 10x more labeled data at zero human cost. The approach:
    1. Generate CoT responses with Qwen3.5-0.8B on 200 GSM8K questions (from stored data).
    2. For each step: extract arithmetic claims (using CoACEExtractor or SymCodeVerifier).
    3. Run Z3 on each claim: is this arithmetic step logically entailed by prior steps?
    4. Label: step_correct=True if Z3 confirms entailment, False if Z3 finds contradiction.

    EXISTING CODE TO READ FIRST:
    - results/fover_labeled_steps_live.json — existing 57 hand-labeled pairs (baseline).
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier (arithmetic extraction).
    - python/carnot/extraction/coace_extractor_v2.py — CoACEExtractorV2.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

