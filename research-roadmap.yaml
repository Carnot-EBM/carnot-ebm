- id: exp1042-dualgpu-rocm-torch-v4
  milestone: 2026.04.81
  deliverable: results/experiment_1042_dualgpu_rocm_torch_v4.json
  title: "DualGPU ROCm/CUDA Torch Install + Live Inference v4 — pip install fix"
  model: opus
  prior_failures:
    - experiment_id: exp1035-dualgpu-rocm-v3
      verdict: dualgpu_detected_torch_backend_missing
      addressed_by: "Root cause: torch 2.11.0+cpu installed in venv — CPU-only build cannot do GPU inference. nvidia-smi confirms 2x RTX 3090 present. Fix: install torch with CUDA support (for RTX 3090 = CUDA 12.x) OR install torch with ROCm support for the AMD 890M iGPU. Path A: pip install torch==2.2.0+cu121; Path B: pip install torch==2.11.0+rocm7.2; Path C: llama.cpp dispatch (no torch required)."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp 1035 confirmed: nvidia-smi sees 2x RTX 3090 (GeForce, 24GB each), but torch 2.11.0+cpu
    is installed in the venv — it has no CUDA or HIP support. DualGPU live inference has been
    blocked for 16+ consecutive milestones (~960 min cumulative foregone savings).

    This experiment tries THREE paths in order (stop at first success):

    EXISTING CODE TO READ FIRST:
    - results/experiment_1035_dualgpu_rocm_v3.json (torch_build: cpu_only, next_action suggestion)
    - scripts/experiment_template.py (_detect_gpu_count_rocm_aware — already patched)
    - python/carnot/pipeline/verify_repair.py (DualGPU path — understand the wiring)
    - scripts/experiment_template.py (setup_gpu() method — MODEL_SPECS parameter)

    TASK:
    DIAGNOSE FIRST:
    - python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
    - nvidia-smi --query-gpu=name,driver_version,uuid --format=csv,noheader
    - python -c "import sys; print(sys.executable)"
    - pip show torch | grep -E "Name|Version|Location"

    PATH A — Install CUDA-enabled torch for RTX 3090 (CUDA 12.x):
    - pip install "torch==2.2.2+cu121" --index-url https://download.pytorch.org/whl/cu121 2>&1 | tail -5
    - python -c "import torch; print('CUDA available:', torch.cuda.is_available(), 'GPUs:', torch.cuda.device_count())"
    - If cuda available: proceed to LIVE INFERENCE below.
    - If fails (conflict, network issue): try Path B.

    PATH B — Install ROCm-enabled torch for AMD Radeon 890M (gfx1150):
    - pip install "torch==2.4.0+rocm6.0" --index-url https://download.pytorch.org/whl/rocm6.0 2>&1 | tail -5
    - sg render -c 'python -c "import torch; print(torch.cuda.device_count())"'
    - If ROCm available: proceed to LIVE INFERENCE below.
    - If fails: try Path C.

    PATH C — llama.cpp dual-GPU dispatch (does not require torch CUDA):
    The RTX 3090 cards are accessible to llama.cpp via CUDA even when torch uses CPU.
    - pip install llama-cpp-python[cuda] --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu121 2>&1 | tail -5
    - python -c "from llama_cpp import Llama; m = Llama(model_path='...', n_gpu_layers=35, split_mode=2); print('llama.cpp CUDA path OK')"
    - If successful: adapt DualGPU path in verify_repair.py to use llama.cpp instead of torch.

    LIVE INFERENCE TEST (once any path above succeeds):
    - sg render -c 'CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1 python scripts/experiment_1042_dualgpu_rocm_torch_v4.py'
    - Load unsloth/gemma-4-26B-A4B-it-GGUF on GPU 0 (from cached_sota_pair())
    - Run 5 test questions; measure per-question latency
    - Target: gpu_count_detected >= 2, dualgpu_live=true

    CONCRETE STEPS:
    - python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
    - nvidia-smi --query-gpu=name,index --format=csv,noheader
    - (attempt Path A, B, or C as described)
    - sg render -c 'python -c "import torch; print(torch.cuda.is_available())"'
    - Write results/experiment_1042_dualgpu_rocm_torch_v4.json

    ARTIFACT FIELDS:
    - torch_version_before: str
    - torch_cuda_before: bool
    - install_path_tried: str ("cuda_wheel" | "rocm_wheel" | "llamacpp_cuda")
    - install_path_succeeded: bool
    - torch_version_after: str (null if llama.cpp path)
    - gpu_count_detected: int
    - dualgpu_live: bool
    - latency_p50_s: float (null if live failed)
    - honest_verdict: "dualgpu_live_confirmed" | "torch_installed_live_pending" | "llamacpp_path_only" | "all_paths_failed" | "failed"

    Run: python scripts/experiment_1042_dualgpu_rocm_torch_v4.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: high
  requires_gpu: true
  max_turns: 25
  estimated_wall_time_min: 30

- id: exp1043-fover-expansion-v3
  milestone: 2026.04.81
  deliverable: results/experiment_1043_fover_expansion_v3.json
  title: "FoVer Corpus Expansion v3 — MetaQA Generator Implementation (500+ pairs target)"
  prior_failures:
    - experiment_id: exp1029-fover-expansion-v2
      verdict: partial_z3_only
      addressed_by: "Root cause: MetaQA generator was not implemented (returned empty list in 2.267s — no actual LLM work). n_metamorphic_candidates=0 for all 500 problems. Fix: implement the MetaQA consistency query generator using unsloth/gemma-4-26B-A4B-it-GGUF. Also expand Z3 labeling to 1000+ MATH problems (v2 used 500 but collected only 85 total pairs — Z3 labeling also needs improvement)."
      retire_if_same_verdict: false
    - experiment_id: exp542-fover-expansion
      verdict: synthetic_fallback
      addressed_by: "Exp 542 used synthetic GSM8K templates. Exp 1029 fixed this with real MATH dataset. The MetaQA generator fix (this experiment) addresses the remaining gap."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    The FoVer corpus is at 85 pairs (target: 500+). Exp 1029 ran for only 2.267 seconds because
    the MetaQA generator was a stub that returned an empty list without calling any LLM.
    n_metamorphic_candidates=0 for all 500 problems attempted. Z3 labeling also needs improvement:
    only 28 new Z3-confirmed pairs were added on top of 57 existing = 85 total.

    All probe training (ThinkPRM v5, GS-KAN v5, NK-KAEM v3) depends on n_total_pairs >= 200.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_1029_fover_expansion_v2.py (understand what was implemented)
    - python/carnot/data/fover_corpus_expanded.json or data/fover_corpus_expanded.json (85-pair corpus)
    - data/fover_train.json + data/fover_test.json (80/20 split from v2)
    - python/carnot/verify/step_verifier.py or equivalent (VeriCoTStepValidator)
    - scripts/experiment_template.py (cached_sota_pair() for model loading)

    TASK:
    1. LOAD EXISTING CORPUS: Load the 85-pair corpus from Exp 1029.
    2. EXPANDED Z3 LABELING (target: 200+ Z3-confirmed pairs):
       - Load 1500 arithmetic problems from lighteval/MATH dataset (3x more than v2's 500)
       - For each: extract CoT steps, check each step with Z3 (or VeriCoTStepValidator)
       - Keep correct + incorrect steps with Z3-confirmed labels
       - Combine with existing 85 pairs (deduplicate by step_hash)
    3. METAMORPHIC QA GENERATOR — implement properly this time:
       Load unsloth/gemma-4-26B-A4B-it-GGUF (use cached_sota_pair() from experiment_template.py).
       For each of 100 candidate Z3-labeled steps, generate 2 metamorphic variants:
         a. Numeric paraphrase: ask the model "Express this calculation differently: [step].
            Does the result change? Answer yes/no and explain."
         b. Negation consistency: ask "If [step] is correct, what would an INCORRECT version look
            like? Give one example."
       If model is inconsistent across variants for a step originally labeled "correct" by Z3:
         flag the step as ambiguous (do NOT add to training set)
       If model is consistent: label confirms Z3 result
       Count n_metamorphic_validated = steps where MetaQA and Z3 agree
    4. COMBINE AND SAVE:
       - Merge Z3 confirmed + MetaQA validated pairs
       - Write data/fover_corpus_v3.json (full corpus, replacing or supplementing expanded.json)
       - Write data/fover_train_v3.json (80%) + data/fover_test_v3.json (20%)
       - Target: n_total_pairs >= 500
    5. PARTIAL SUCCESS HANDLING: If n_total_pairs < 500 but >= 200, report
