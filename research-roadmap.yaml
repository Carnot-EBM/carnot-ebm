      2. HuggingFace mirror: at least one model at huggingface.co/Carnot-EBM
      3. MCP server documentation exists in docs/
      4. CLI documentation exists in docs/
      5. External reproducer: CI workflow + at least one test-results entry

    This audit has been attempted 4 times without producing an artifact. This v4 attempt
    is gated on exp2421 Codex diagnostic, placed in Phase 3 (earlier in queue).

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Network accessible:
            curl -sf -o /dev/null https://pypi.org/pypi/carnot-ebm/json 2>/dev/null &&
            echo "pypi_reachable" || echo "pypi_unreachable"
            curl -sf -o /dev/null https://huggingface.co/Carnot-EBM 2>/dev/null &&
            echo "hf_reachable" || echo "hf_unreachable"

      1. PyPI check:
         pypi_response=$(curl -sf https://pypi.org/pypi/carnot-ebm/json 2>/dev/null)
         pypi_published: true if response contains '"version"'.
         pypi_version: extract from response.

      2. HuggingFace check:
         hf_response=$(curl -sf "https://huggingface.co/api/models?search=carnot-ebm&limit=5" 2>/dev/null)
         hf_mirror_up: true if at least 1 model found.

      3. MCP docs: mcp_docs_present: ls {project_root}/docs/*mcp* 2>/dev/null | wc -l > 0

      4. CLI docs: cli_docs_present: ls {project_root}/docs/*cli* 2>/dev/null | wc -l > 0

      5. External reproducer:
         ci_workflow_count: ls {project_root}/.github/workflows/*.yml 2>/dev/null | wc -l
         external_reproducer_exists: true if ci_workflow_count > 0 AND test-results.md exists.

      6. phase1_ship_gate_met: true if ALL 5 criteria pass.
         missing_criteria: list of failed criteria.

      7. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required."
      - phase1_ship_gate_met:
          principle: "True if ALL 5 criteria pass. Phase 1 completion gate."
      - pypi_published:
          principle: "PyPI carnot-ebm package exists."
      - pypi_version:
          principle: "Latest PyPI version (null if not published)."
      - hf_mirror_up:
          principle: "HF Carnot-EBM has >= 1 model — decentralization Rule 3."
      - mcp_docs_present:
          principle: "MCP documentation exists for external integrators."
      - cli_docs_present:
          principle: "CLI documentation exists."
      - external_reproducer_exists:
          principle: "CI + test-results.md present."
      - missing_criteria:
          principle: "List of failed criteria — actionable next steps."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records network reachability checks."

    ACCEPTANCE GATES:
      - condition: "phase1_ship_gate_met != null"
        principle: "Must evaluate and record gate boolean — even false is valid."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2432-paperv6-capstone-v235
