    \   i. Build artifact: schema='carnot.energy_magnitude_replay.v1'\n      isolation_score=<float>\n\
    \      sure_baseline=-0.1172\n      isolation_improvement=<float>\n      energy_magnitude_better=(isolation_improvement\
    \ > 0)\n      retro_050_closed=energy_magnitude_better\n      honest_verdict='energy_magnitude_wins'\
    \ if retro_050_closed\n        else 'energy_magnitude_no_improvement'\n   j.\
    \ Call tmpl.assert_deliverable_written() as FINAL LINE\n   k. Output: results/experiment_509_ppsebm_energy_magnitude_replay.json\n\
    7. Write tests/python/test_energy_magnitude_replay.py (100% coverage).\n8. Run:\
