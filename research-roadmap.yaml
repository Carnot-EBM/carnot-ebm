    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 90
    track: "substrate_provenance"
    inference_substrate: "live_llm_inference"
    gated_on:
      - upstream: exp3001-sota-gguf-cache-carry-forward-checksum-refresh
