    - results/experiment_801_embedding_constraint_addition.json — delta=0.0 (stub not wired)
    - openspec/capabilities/verifiable-reasoning/spec.md — REQ-VERIFY entries

    TASK: Wire EmbeddingConstraintStore into IsingEBM coupling matrix,
    test energy change when constraint fires vs no constraint, write artifact.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/verifiable-reasoning/spec.md:
       - REQ-VERIFY-095: When VerifyRepairPipeline.verify() has an EmbeddingConstraintStore,
         retrieved constraint embeddings MUST be projected to Ising spin space and added as
         soft bias terms on the coupling matrix J before sampling. The projection is a learned
         linear map from embedding_dim to n_spins.
       - REQ-VERIFY-096: Energy MUST be strictly greater with constraint injection when a
         relevant constraint fires (energy_with_constraint > energy_without_constraint).
       - SCENARIO-VERIFY-129: Retrieve carry_check constraint vector; project to spin bias;
         inject into IsingEBM; verify arithmetic carry violation; energy 25% higher than
         baseline (no injection). Test confirms constraint injection adds energy.
    3. Implement python/carnot/pipeline/ising_constraint_injector.py:
       a. ConstraintInjectionResult dataclass:
          (n_constraints_retrieved, embedding_dim, n_spins, projection_applied,
           energy_without_injection, energy_with_injection, energy_delta_pct, honest_verdict)
       b. IsingConstraintInjector:
          - __init__(embedding_dim: int = 384, n_spins: int = 64):
            self._projection = np.random.randn(embedding_dim, n_spins) * 0.01  # small init
          - project_to_spin_bias(constraint_embeddings: list[list[float]]) -> np.ndarray:
            For each embedding: bias_i = embedding @ self._projection  (shape: n_spins)
            Return mean bias across all retrieved constraints.
          - inject_into_coupling_matrix(J: np.ndarray, bias: np.ndarray) -> np.ndarray:
            J_injected = J.copy()
            # Add bias as diagonal (self-coupling, interpreted as external field h_i)
            np.fill_diagonal(J_injected, J_injected.diagonal() + bias)
            Return J_injected
          - compute_energy_with_injection(ising_ebm, spins, constraint_embeddings) -> float:
            bias = project_to_spin_bias(constraint_embeddings)
            J_injected = inject_into_coupling_matrix(ising_ebm.J, bias)
            return -0.5 * spins @ J_injected @ spins  # standard Ising energy formula
       c. Export IsingConstraintInjector, ConstraintInjectionResult from carnot.pipeline.__init__
    4. Modify python/carnot/pipeline/verify_repair.py (ADDITIVE):
       - Add optional param: ising_constraint_injector: IsingConstraintInjector | None = None
       - In verify(): if injector set AND embedding_constraint_store set:
