    prompt: |
      CONTEXT: KAN-CL (.221, exp2231) demonstrated per-knot importance regularization at small n.
      COOL (Springer 2026) shows on-device KAN updates at 20us latency on n=256-class tasks.
      We must validate that Carnot's KAN-CL scales to n=256 spin Ising without catastrophic
      forgetting and within acceptable latency.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/models/substrate_kan.py
        {project_root}/python/carnot/samplers/parallel_ising.py
        {project_root}/scripts/experiment_template.py
      TASK: Scale KAN-CL per-knot regularization to n=256 and n=512 spin Ising.
      CONCRETE STEPS:
        1. Construct an Ising model with n=256 spins (random J, random h, fixed seed).
        2. Train KAN-CL with per-knot importance enabled for 3 sequential constraint domains:
           Domain 1: ferro coupling pattern
           Domain 2: anti-ferro coupling pattern
           Domain 3: random coupling pattern
        3. Measure after each domain:
           - retention_rate: accuracy on Domain 1 constraints after Domain 3 training
           - per_knot_update_latency_us: mean time per update step in microseconds
           - n_active_knots: sparsity of importance mask
        4. Repeat for n=512.
        5. Set kancl_n256_validated: true if n256_retention_rate >= 0.85.
        6. Write deliverable to results/experiment_2247_kancl_n256.json.

