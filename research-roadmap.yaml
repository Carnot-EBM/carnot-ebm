      TASK:
      Reconcile all .509 evidence, tests, specifications, retirements, registries, and operations records, then emit results/experiment_5647_v509_capstone_reconciliation.json.

      CONCRETE STEPS:
      1. Read every upstream artifact directly, including structured gate-skip artifacts and adversarial-verification results. Verify hashes, IDs, milestone, terminal prefixes, required fields, provenance, and gate receipts.
      2. Promote FR-11 only if Exp5639 independently passes all benefit, pathwise-risk, group-coverage, exact-safety, retention, poison, and replay gates. Treat Exp5638 as schema evidence only. Report Exp5640 separately as disabled-by-default shadow integration, never as automatic production enablement.
