    Bind fourteen tasks with immutable evidence and separate historical failures. Deliver results/experiment_8178_v707_contract_custody.json, primitive evidence under results/raw/experiment_8178_v707_contract_custody/, and runnable scripts/experiments/experiment_8178_v707_contract_custody.py.
    CONCRETE STEPS:
    1. Emit a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess. Use PYTHONUNBUFFERED=1 and print(..., flush=True). Inside long loops and child waits, emit actual completed/pending counts at least every 60 seconds. Keep every silence gap below 600 seconds. Poll with tool calls of at most 60 seconds. Write any file over about 200 lines in several tool calls of at most about 150 lines. Send a progress message between writes. Never pad duration or invent activity.
    2. Check actual input paths, hashes, runtime and gate operands first. Read artifacts with scripts/summarize_artifact.py, then inspect primitives. Preserve historical primaries and failed receipts. Missing, retired or gate-blocked external evidence yields complete_blocked_<check> and verdict_class=blocked. gate_check_summary names the check and actual value. Only unfinished owned work may use partial.
    3. Extend relevant REQ-* and SCENARIO-* before implementation. Write failing tests first. Reuse qualified modules through a thin CLI. Keep fixtures outside results/ in private temporary directories. Preserve original assertions. Verify direct script execution outside the checkout without PYTHONPATH. Read historical methods from immutable versioned bytes, never mutable vNEXT headings.
    4. Load no LLM. Set MODEL_SPECS=[] and inference_substrate_class=no_model_load. Use aggregation_from_upstream_artifacts for reductions or verifier_ensemble_against_cached_candidates for CPU heads. Separate imported model provenance from zero current calls. Declare small trained heads in trained_head_specs.
    5. Bind exactly 14 tasks Exp8178 through Exp8191. Check visible table, full JSON and canonical full-task digest through the existing authority reader. Use activated authority when staged YAML has moved. Never activate this plan or edit the active roadmap.
    6. Freeze current design and task bytes in content-addressed custody before any later spec changes. Distinguish current contract_ready_score from historical_evidence_ready_score. Do not make historical failure an implicit prerequisite for independent branches.
    7. Preserve all fourteen V706 dispositions using exact deliverable paths from its task authority. Exp8168, Exp8169 and Exp8170 were gate-skipped. Do not invent scientific verdicts for absent primaries. Compare original expected hashes with current bytes and any authentic saved snapshots; a new snapshot cannot repair old provenance.
    8. Use immutable copies of completed validation logs for current work. Never rerun health checks into historical paths. Record mutable original path, observed version and captured version separately. An unresolved V706 mismatch remains blocked historical evidence without invalidating a correctly bound new contract.
    9. Freeze the scope ledger, literature mapping and validation manifest. Run private E2E-018 staged, activated, staged-absent, prompt-tamper and post-snapshot-spec-change cases. A changed historical hash must remain detected.
    10. Freeze owned validation argv before measurement. Give pytest node selectors only to pytest; give static tools actual file paths. Run scoped pytest, 100% changed-code statement coverage, Ruff check/format, strict mypy and explicit-path spec coverage. Run applicable private E2E success, missing-input, tamper and cold-replay cases. Record argv, expected/actual exit, duration and log hash. Every required check must exit normally. Report unrelated repository health separately. Copy completed logs into immutable custody; never rerun a command into a sealed log. Rust changes also require scoped cargo test/fmt/clippy, loaded-binding parity and E2E-003/004.
    11. Save primitive rows and source/code/config hashes. Recompute headlines independently. Run unmodified adversarial_verify.py and strict verdict_row_consistency_lint.py with progress during waits. Publish through primary_publication only after owned checks pass. Owned validation failure disqualifies and zeros readiness. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve operator-curated pages. No external publication.
    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: complete_*; verdict_class: positive | circular_positive | null | blocked | disqualified | partial. Principle: only unfinished owned work retries.
    - verifier_is_oracle, claim_scope, exposure_scope, independent_generalization_score: 0, generalized_learning_benefit_score: 0. Principle: fixtures and exposed development cannot establish independent benefit.
    - required_checks_passed, flagged_adversarial, validation_receipts, terminal_validation_sidecar_path, preconditions_checked. Principle: readiness requires normal owned validation.
    - gate_check_summary: check/upstream/path/hash/artifact_field/op/expected/observed/passed. Principle: a blocked result names its failed operand.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, trained_head_specs, model_invocation_counts, call_ledger, cited_upstream_artifacts: experiment_id/fields_imported/sha256. Principle: current execution differs from imported provenance.
    - rows: unit_id/source_cluster_id/arm/condition/metric/numerator/denominator/status/exclusion_reason. Principle: comparisons can be independently reduced per unit.
    - intended_count, eligible_count, independent_count, completed_count, excluded_count, censored_count, failed_count, sample_size_budget. Principle: repeats and sentences do not create independent sources.
    - run_date, duration_s, random_seed, reproducibility_checksum, source_artifact_hashes, raw_shard_hashes, code_config_hashes, phase_spans, acceptance_gates, field_principles. Principle: claims bind to actual work and frozen thresholds.
    - contract_ready_score: 0|1, historical_evidence_ready_score: 0|1, canonical_tasks_sha256, task_dispositions, immutable_authority_paths, historical_hash_failures, prior_scope_ledger, literature_mapping. Principle: new scheduling readiness cannot launder old evidence.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_8178_v707_contract_custody.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
