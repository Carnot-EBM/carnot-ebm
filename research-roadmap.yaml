    7. Authenticate all fourteen V660 dispositions from the preserved design, original artifacts and conductor log. Keep the Exp7546 stamped flag, Exp7549/7550 null, Exp7548 resource block and five missing source producers distinct. Read results/experiment_7551_native_pilot.json as pre-gate evidence, not a successful pilot. The completed ledger ends at V659 during planning; never invent an archive entry.
    8. Ingest three to five primary method sections from the V661 reference review. Include Calibeating Made Simple, proper-scoring limits, textual source interventions and the FPGA-ASIC revision. Write docs/research-notes/v661-method-map.md and update research-studying.md. Map each method to a test or a specific deferral; preserve access failures and retired mechanisms.
    9. Run unchanged schema, prior-failure, exclusion, gate, ARC-floor, harness-fit and overdue-priority guards against the selected authority. Keep E0 operator-blocked and E6 resolved. Read publication_gate.py --json for stable G1-G4. Preserve unrelated repository debt without launching a whole-suite diagnostic.
    10. Freeze the affected-file validation manifest. Prove imports resolve to this worktree. Run scoped pytest -n 0 -o addopts= --no-cov with private --basetemp, then 100 percent changed-module coverage using command-local COVERAGE_FILE. Run scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Reuse Exp7358/Exp7303 helpers. Never launch or require an unscoped full suite in this task; report pre-existing repository debt separately.
    11. Run the declared entrypoint and cold replay as capability E2E. Learning must exercise predict-release-update-persist-reload. ARC telemetry changes require applicable E2E-011/012/013 and the private LLM-off environment smoke from ops/e2e-test-plan.md; policy/transport changes also require E2E-009/010. Shared sampler or binding changes require E2E-001/002 or E2E-003/004 respectively. Read-only reporting has no numbered runtime E2E. Record actual command results.
