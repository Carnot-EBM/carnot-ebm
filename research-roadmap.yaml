    title: "OFF-ARC EXECUTION-VERIFIER TRANSFER -- BUILD+LAUNCH (operator TOP PRIORITY 2026-06-11; G1; split-long-codex BUILD half): write the standalone two-arm + positive-control runner that measures whether the SAME GAP-4 execution-consistency primitive transfers to CODE. Reuse the DOMAIN-GENERAL primitives (python/carnot/verify/sandbox.py restricted exec + the demo-fit/content-hash logic in python/carnot/agentic/arc_gap4_execution_verifier.py) -- do NOT write a code-specific verifier; the whole point is the primitive is SHARED. Corpus: MBPP (and/or HumanEval); visible example tests = the 'demos', hidden tests = held-out 'gold'. Smoke on 2 tasks, commit the runner, then LAUNCH the full run BACKGROUNDED (the run makes N>=30 x k>=8 local-GGUF generations and must not hold an agent past the 80-min cap)."
    priority: critical
    track: verifier
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4031_offarc_transfer_build.json
    prompt: |
      CONTEXT: the operator TOP PRIORITY (ops/known-issues.md, 2026-06-11): convert "the verifier is
      domain-general" from ARGUED to MEASURED. The GAP-4 execution primitive (induce a program from
      demos -> execute in a restricted namespace -> accept iff exact-output-match) is domain-general
      BY CONSTRUCTION but has only ever run on ARC grids. MBPP/HumanEval is the 1:1 off-ARC analog:
      visible example tests = demos, hidden tests = gold, restricted-exec + output-match = the
      verifier. This is the BUILD half of a split-long-codex pair (the RUN half is exp4032). Prior
      art (read first): DOCE arXiv:2408.13745 (the execution-based reranking protocol + baselines),
      ACES arXiv:2604.03922 (leave-one-out test-consistency = a STRONGER baseline than plain vote).

      EXISTING CODE TO READ FIRST:
        - python/carnot/agentic/arc_gap4_execution_verifier.py (the demo-fit / content-hash logic to REUSE)
        - python/carnot/verify/sandbox.py (the restricted-namespace executor to REUSE)
        - results/experiment_4012_gap4_local_best_of_n.json (the local-GGUF best-of-N pattern to mirror)
        - docs/research-notes/sota-ingestion-2026-06-11-offarc-and-search.md (exp4030 -- read if present)

      TASK: write scripts/experiments/offarc_exec_verifier_transfer_run.py and launch it backgrounded.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any inference; on ANY miss write honest_verdict
           blocked_<resource> and STOP -- no fabrication):
           a. local GGUF cached: ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-12B-it-GGUF/
              returns non-empty
           b. python -c "import llama_cpp" succeeds
           c. the code corpus loads: HF datasets MBPP (or HumanEval), or a cached copy
           d. python -c "from carnot.verify import sandbox" succeeds (the restricted exec primitive)
        1. Write the runner: for N>=30 code tasks (prefer >=40 for power; full MBPP is the stretch),
