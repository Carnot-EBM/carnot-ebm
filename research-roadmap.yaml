      Set verifier_is_oracle=false. The receipt proves execution, not semantic correctness. field_principles must map every receipt field, authentic_family_count, and authenticated_receipt_contract_ready_score. honest_verdict must begin with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6413_authenticated_sota_gguf_execution_receipts --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

