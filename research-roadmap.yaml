          principle: "Operationalizes the thesis as a falsifiable check."
        - transfer_verifiers: list[str]
          principle: "Verifiers that generalize."
        - corpus_specific_verifiers: list[str]
          principle: "Verifiers that don't."
        - recommended_headline_repin: bool
          principle: "True if operator should consider re-pinning the headline number."
        - gaps_for_266: list[{title, rationale}]
          principle: "Forward queue: HaluEval, FEVER, or other priorities."
        - acceptance_criteria_met: int
          principle: "Out of 10 declared criteria for this milestone."
        - duration_s: float
          principle: "Wall-time; expected 600-1800s for thorough synthesis."

      Do NOT push. Do NOT modify scripts/research_conductor.py.
