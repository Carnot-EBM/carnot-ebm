milestone: 2026.09.655
milestone_title: Authenticated source decisions, importance-anchored learning, and exclusive ARC cost
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp7475-contract-methods
  title: Bind fourteen tasks and ingest methods against terminal V654 evidence
  phase: 1
  track: reporting
  priority: high
  requires_gpu: false
  max_turns: 20
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.655
  deliverable: results/experiment_7475_v655_contract_methods.json
  inference_substrate_class: aggregation
  prior_failures:
  - experiment_id: exp7474-capstone
    verdict: complete_disqualified_required_v654_science_with_fourteen_dispositions
    addressed_by: Use a new advisory V655 contract and preserve all V654 invalid and absent branches; do not
      reuse capstone validity.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.655. V654 has fourteen dispositions but only ten producer artifacts. Exp7462 is disqualified; four dependent measurements never ran. Exp7467 is a valid extraction null, Exp7468 is analytic circular evidence, and Exp7474 is disqualified. Conductor completion is not scientific success.
    Hypothesis: An exact contract and a source-to-method map can make the next measurements executable without rehabilitating invalid historical evidence.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/experiment_7358_v646_validation_contract.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/results/experiment_7474_v654_capstone.json
    - {project_root}/results/experiment_7461_v654_contract_methods.json
    - {project_root}/python/carnot/experiment_7461_v654_contract_methods.py
    - {project_root}/research-references.md
    - {project_root}/research-studying.md
    - {project_root}/ops/known-issues.md
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7475_v655_contract_methods.json.
    Create scripts/experiments/experiment_7475_v655_contract_methods.py as the thin entrypoint and reuse or add small logic in python/carnot/experiment_7475_v655_contract_methods.py. Add tests/python/test_experiment_7475_v655_contract_methods.py for new behavior. These paths are deliverables to create, not existing prerequisites. Each acceptance gate below must record a one-line principle stating the failure mode it prevents.

    CONCRETE STEPS:
    1. Emit a flushed progress line immediately. Read the listed sources and relevant REQ-* capability. Authenticate preconditions and historical flags. New TASK paths are outputs to create; earlier same-milestone paths become inputs only after their producers execute.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed at least every 60 seconds. Stream child stdout unbuffered and emit truthful pending-operation heartbeats every 60 seconds during blocking calls, authoring and validation. Keep EVERY gap below 600 seconds: silence can kill at 1200 seconds; sustained progress permits the 4800-second hard cap. Checkpoint completed units and terminate only owned processes.
    3. Extend the relevant REQ-* and SCENARIO-* spec first, write meaningful failing tests for new behavior, then implement a small reusable helper and thin entrypoint. Reuse existing corrected helpers when sufficient; do not copy an old experiment main, stale constants or full-suite manifest.
    4. Declare inference_substrate_class=aggregation, execution_venue=host, MODEL_SPECS=[], model_invoked=false and zero current LLM calls. Numeric fitting has a separate small_ebm_training receipt. Archived/model-shaped scripted events are hash-bound sidecars, never current inference.
    5. Resolve only the YAML with milestone 2026.09.655: the next file before activation, the active file only after activation. Compare all fourteen ordered IDs exp7475 through exp7488, titles, phases, deliverables, substrate classes and complete gate triples against the markdown task contract. Mutate count, order, ID, field, path and milestone in private fixtures; every mismatch must fail.
    6. Authenticate all fourteen V654 dispositions from producer or conductor pre-gate bytes. Read the capstone paths, including results/experiment_7465_source_option_capture.json when that is the actual pre-gate path. Record absent producers explicitly. Keep original flags, validation failures and the extraction retirement. Do not require the lagging completion archive to be current.
    7. Ingest at most six primary methods from the V655 references review: SemIf native readout, KAN-CL anchoring, support-overlap limits, budgeted feedback, efficiency-claim controls and hardware locality. Write docs/research-notes/v655-method-ingestion.md and update research-studying.md with revision, usable component, failure mode and experiment mapping. Distinguish the KAN-CL component study from the full CNN/backbone system. Use low-concurrency source requests; no research-agent fan-out.
    8. Run schema, gate, exclusion, ARC-floor and overdue-priority checks unchanged. Map the live E6 follow-up to exp7478/7485/7486, calibration to exp7481, and FR-11 to exp7482/7483. Record the inaccessible scored Blackwell runtime and user-forbidden conductor obligation as deferred. This task is advisory; it is not a parent gate for independent science.
    9. Freeze the affected-file validation manifest before checks. Verify imports resolve to this worktree. Run affected pytest with -n 0 -o addopts= --no-cov and a private existing --basetemp parent; separately require 100 percent changed-module coverage with a command-local COVERAGE_FILE, scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Reuse Exp7358/Exp7303 scope helpers. Do not invoke full_python_suite or pytest tests/python without a scoped path, weaken checks or conceal unrelated baseline failures.
    10. Run the entrypoint and a fresh-process cold replay as the capability E2E. Pure reporting/planning has no numbered runtime E2E. Shared training/sampling/binding changes require applicable E2E-001/002/003/004 from ops/e2e-test-plan.md; shared ARC changes require E2E-009/010, telemetry changes require E2E-011, plus the applicable private real-environment smoke. Rust changes require affected cargo tests, fmt and clippy.
    11. Independently reduce per-unit rows and run scripts/adversarial_verify.py plus scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Preserve outputs and correct producer defects without changing guard semantics. Failed required validation is disqualified; a valid failed benefit gate is null. Publish terminal JSON atomically after measured work and checks; checkpoints never occupy the deliverable path.
    12. Keep each committed artifact below 20 MiB using hash-bound row shards and external data caches. Put scratch work in /tmp. Reconcile affected OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve historical artifacts, production defaults, generator weights and research-roadmap.yaml. No external publication or submission.

    ACCEPTANCE GATES:
    - Required validity: all scoped implementation, identity, accounting and independent-replay checks above pass. principle: a positive scientific metric cannot excuse invalid evidence.
    - Readiness: the exact task-specific ready/complete fields above follow their declared observed checks, separately from benefit. principle: a valid null must not suppress an independent measurement.
    - Scientific benefit: every task-specific support, effect-size, retention and multiplicity threshold above is preserved. principle: a small sample, a favorable seed or an analytic fixture cannot substitute for held-out value.

    REQUIRED ARTIFACT FIELDS:
    - schema: principle: "Versioned schema with exact roadmap experiment_id, milestone and terminal status prevents silent reader drift."
    - run_date: principle: "Use {date}; retain measured UTC and monotonic times with clock/process identity."
    - preconditions_checked: principle: "Name resources, exact paths, ownership and observed prerequisite values before dependent work."
    - MODEL_SPECS: principle: "Use unsloth/Qwen3.8-27B-GGUF for current model tasks, [] for numeric/reducer work; also emit lowercase model_specs."
    - model_invoked: principle: "Any attempted current model call differs from archived or scripted events."
    - invocation_counts: principle: "Balance attempted, complete, failed, cancelled and in-flight loads, forwards and generations."
    - inference_substrate: principle: "Name actual native readout, bounded generation, numeric learning or artifact aggregation."
    - inference_substrate_class: principle: "Use model_load_no_generation (2s), model_bounded_generation (10s), no_model_load or aggregation as declared; blocked_no_run only when nothing executed. Full generation (60s) is not used in this plan."
    - execution_venue: principle: "Use host and record actual CPU/CUDA identities; historical board evidence is separate."
    - duration_s: principle: "Measure current work without padding; separate load, forward, generation, numeric work and validation."
    - phase_spans: principle: "Timestamped flushed progress and checkpoints expose long silent or unfinished operations."
    - random_seed: principle: "Freeze ordering, fitting, audit and bootstrap seeds; deterministic reducers explain any null seed."
    - reproducibility_checksum: principle: "Bind code, protocol, data roles, model identity, raw shards and validation scope."
    - source_artifact_hashes: principle: "Preserve exact upstream bytes and their original flags/classes."
    - rows: principle: "One row per independent group/game/seed/arm or event, including failures and censoring; large lists use hash-bound shards."
    - sample_size_budget: principle: "Separate planned, attempted, complete, failed, censored, excluded and unstarted independent units."
    - acceptance_gate_results: principle: "Each check carries category, expected, observed, op, passed and principle; distinguish validity, support and benefit."
    - gate_check_summary: principle: "Every blocked verdict names failed check, upstream, exact field/path, expected and observed value."
    - honest_verdict: principle: "Use complete_ terminal findings, including complete_blocked_*; preserve a blocked_* conductor verdict if that is the actual source."
    - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. partial only for retryable own work, never unchanged external absence."
    - verifier_is_oracle: principle: "Declare whether the acceptance verifier is the evaluation oracle; if true, positive is forbidden and fixture positives are circular_positive."
    - flagged_adversarial: principle: "Keep real reader flags; never clear a flag to open a gate."
    - validation_receipts: principle: "Exact commands, exit codes, log hashes and required versus unrelated-baseline status establish validation scope."
    - field_principles: principle: "Echo why each field and gate exists so evidence is understandable independently."
    - contract_ready_score: principle: "Bare 0/1 for an exact fourteen-task contract; it does not certify scientific benefit."
    - method_rows: principle: "Each source maps a usable method and limitation to a task."
    - v654_dispositions: principle: "Fourteen immutable historical dispositions prevent completion from becoming a benefit claim."
    - unresolved_obligations: principle: "External runtime and forbidden conductor changes stay visible."

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} .venv/bin/python -u scripts/experiments/experiment_7475_v655_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
