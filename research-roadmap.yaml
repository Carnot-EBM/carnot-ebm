milestone: "2026.08.580"
milestone_title: "Receipt-Bound Verification and Prospective Memory"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6647-receipt-scoped-admission-boundary
    milestone: "2026.08.580"
    deliverable: results/experiment_6647_receipt_scoped_admission_boundary.json
    title: "Receipt-scoped model admission boundary"
    priority: critical
    track: execution-integrity
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 90
    model: opus
    prior_failures:
      - experiment_id: exp6633-gpu-lease-phase-journal
        verdict: "blocked_gpu_lease_scheduler_not_ready: infrastructure checks failed; no model-quality claim"
        addressed_by: "This attempt does not rebuild the lease; it preregisters a task-owned receipt reducer and records the unrelated repo-wide xdist/CWD baseline separately as non-gating evidence."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      V579 Exp6633 implemented and passed owner, race, recovery, and tamper fixtures, but its final reducer folded an unrelated repo-wide xdist/CWD failure into focused_tests and emitted readiness zero. This task changes the reduction boundary, not the lease mechanism. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6633_gpu_lease_phase_journal.json and the V579 rows in {project_root}/ops/conductor-log.md
      - {project_root}/python/carnot/gpu_lease_phase_journal.py, {project_root}/python/carnot/experiment_6633_gpu_lease_phase_journal.py, and their focused tests
      - {project_root}/python/carnot/testing/child_results_guard.py, {project_root}/python/carnot/testing/tracked_results_guard.py, and the current isolated/full-suite truth records
      - relevant execution-integrity and research-reporting specs, {project_root}/_bmad/traceability.md, and {project_root}/ops/e2e-test-plan.md

      TASK:
      Implement a receipt-scoped admission reducer that enumerates task-owned checks before execution, replays them, and computes readiness only from those checks. Preserve the full repo-wide suite result as a separate diagnostic. Do not edit the working lease implementation unless a focused red test proves a task-owned defect. Do not load an LLM or make a model-quality claim.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash research-roadmap.yaml and scripts/research_conductor.py; record Exp6633 artifact hash, task-owned fixture inventory, current global-suite receipt, Python, CPU, RAM, disk, and the no-LLM substrate.
      1. Add REQ-* and SCENARIO-* anchors for preregistered task-owned readiness, diagnostic-only global-suite truth, exact field ownership, and fail-closed missing receipts. Write focused tests first.
      2. Freeze the owned gate set: acquisition, same-device exclusion, independent-device allowance, token/PID-start/device binding, heartbeat, phase transitions, unload/release, crash recovery, tamper detection, atomic artifact write, focused tests, spec coverage, and applicable E2E checks.
      3. Replay every owned fixture in fresh temporary paths. Emit one row per check with expected value, observed value, source, command, exit, and receipt hash. Never coerce missing or null to zero.
      4. Record the repo-wide pytest/xDist/CWD result in global_suite_diagnostic with explicit non-gating rationale and known-issue linkage. Do not hide or relabel it.
      5. Set task_owned_admission_ready_score=1.0 only when every preregistered owned check passes. A ready result is verdict_class=null. Any block starts blocked_ and names its failed owned check and observed value in gate_check_summary.
      6. Write the artifact atomically; run focused tests, 100% scoped coverage, spec coverage, row-consistency lint, adversarial verification, relevant E2E checks, and git status. Reconcile only specs/traceability/status/changelog changed by this task.

      Required deliverable: {project_root}/results/experiment_6647_receipt_scoped_admission_boundary.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: receipt-bound infrastructure conclusion with no model-quality claim
        verdict_class: one of positive|circular_positive|null|blocked|disqualified|partial; ready infrastructure is null
        gate_check_summary: failed owned check and observed value for every blocked result
        prior_failure_receipt: Exp6633 verdict, artifact hash, exact failed reduction field, and changed boundary
        preregistered_task_owned_checks: immutable ordered gate definitions
        task_owned_check_rows: one expected/observed/source/hash row per gate
        global_suite_diagnostic: full-suite command, exit, summary, known-issue link, and non-gating status
        reducer_contract: exact inclusion and exclusion rules
        task_owned_admission_ready_score: exact binary field owned by this task
        per_unit_rows: every owned check and diagnostic row
        aggregate_row_recomputation: readiness rebuilt from rows
        preconditions_checked: inputs, tools, resources, and hashes
        protected_files_unchanged: hashes for research-roadmap.yaml and scripts/research_conductor.py
        inference_substrate: receipt_scoped_gpu_lease_reducer_no_llm
        verifier_is_oracle: true because fixture expectations define null infrastructure readiness
        field_provenance: source path, parser, function, hash, and schema per field
        random_seed: deterministic fixture order seed
        duration_s: monotonic runtime
        tests_run: commands, exits, and summaries
        reproducibility_checksum: final content hash

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6647_receipt_scoped_admission_boundary --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6648-three-family-gguf-canaries
    milestone: "2026.08.580"
    deliverable: results/experiment_6648_three_family_gguf_canaries.json
    title: "Three-family GGUF accelerator canaries"
    priority: critical
    track: model-admission
    requires:
      - exp6647-receipt-scoped-admission-boundary
    requires_gpu: true
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 150
    model: opus
    gated_on:
      - upstream: exp6647-receipt-scoped-admission-boundary
        artifact_field: task_owned_admission_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6634-mandated-model-admission
        verdict: "blocked_gate_check_failed"
        addressed_by: "The new upstream field is produced by a task-owned receipt reducer rather than the V579 global-suite-coupled readiness score."
        retire_if_same_verdict: true
      - experiment_id: exp6605-qwen36-direct-headroom
        verdict: "blocked_gpu_process_receipts: direct baseline integrity did not complete"
        addressed_by: "Each canary now runs in its own owner-bound process with model hash, PID-start, device UUID, phase, VRAM, unload, and release receipts before any quality corpus is attempted."
        retire_if_same_verdict: true
      - experiment_id: exp6607-gemma4-26b-a4b-direct-headroom
        verdict: "blocked_gpu_ownership: expected True, observed False"
        addressed_by: "The middle-MoE canary now uses the shipped lease journal and an independently verified fresh process instead of inferred GPU ownership."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp6647 owns the narrow admission gate. This task admits the three mandated SOTA local GGUF families independently and makes no performance claim. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/scripts/experiment_template.py, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6647_receipt_scoped_admission_boundary.json
      - {project_root}/python/carnot/inference/sota_models.py, {project_root}/python/carnot/pipeline/gemma4_quantized_loader.py, and {project_root}/python/carnot/gpu_lease_phase_journal.py
      - Exp6605, Exp6606, Exp6607, Exp6633, and Exp6634 modules, artifacts, and focused tests
      - relevant model-tier, inference, execution-integrity, evidence, safety, and reporting specs plus {project_root}/ops/e2e-test-plan.md

      TASK:
      Run independent fresh-process admission canaries for all three mandated GGUF families. Resolve the flagship MoE and middle MoE with cached_sota_pair(), resolve the dense flagship with resolve_cached_gguf(), and use only the embedded llama.cpp GGUF tokenizer path. Admission requires real local inference and owner-bound accelerator receipts; it is not a quality comparison.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify the structured upstream gate; hash protected files; record cache paths, exact GGUF hashes, CUDA/nvidia-smi, llama.cpp, CPU, RAM, disk, and both GPU UUIDs.
      1. Add REQ-* and SCENARIO-* anchors for independent per-family process admission and write focused tests first.
      2. Define MODEL_SPECS with exactly unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-26B-A4B-it-GGUF, and unsloth/gemma-4-31B-it-GGUF. Resolve Qwen plus middle MoE through cached_sota_pair(gpu_indices=(0,1), model_indices=(0,1)); resolve dense Gemma through resolve_cached_gguf().
      3. For each family, acquire an owned device, launch a fresh process, check the embedded tokenizer, load the exact GGUF, run a fixed short prompt, and record non-empty output plus token counts. Run families sequentially when a device must be reused.
      4. Emit identity, file hash, PID/start, executable/argv, device UUID, phases, VRAM before/resident/after, prompt/output hashes, exit, unload, release, and post-process absence per family. A legacy model may be a labeled CPU smoke row only and cannot satisfy admission.
      5. Set all_mandated_models_admitted=true only when all three independent canaries pass. A ready admission uses verdict_class=null. Any block starts blocked_ and populates gate_check_summary.
      6. Write atomically; run focused tests, scoped coverage, spec coverage, artifact/row/adversarial checks, model-load E2E, and git status. Reconcile only changed specs and ops docs.

      Required deliverable: {project_root}/results/experiment_6648_three_family_gguf_canaries.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: three-family admission conclusion without model-quality language
        verdict_class: closed enum; successful admission is null infrastructure evidence
        gate_check_summary: exact failed upstream or per-family check and observed value for blocked results
        upstream_gate_receipt: Exp6647 path, hash, field, expected value, and observed value
        defined_model_specs: exact three mandated hub IDs, roles, quantizations, and devices
        model_resolution_receipts: cached_sota_pair and dense resolve_cached_gguf results
        model_admission_rows: one complete identity/process/phase/accelerator/output row per family
        embedded_tokenizer_rows: llama.cpp GGUF tokenizer evidence; no AutoTokenizer
        lease_and_unload_receipts: acquisition through release and process absence
        all_mandated_models_admitted: boolean field owned by this task
        per_unit_rows: every family and attack row
        aggregate_row_recomputation: admission rebuilt from the three rows
        preconditions_checked: cache, hardware, tools, resources, and hashes
        protected_files_unchanged: protected path hashes
        inference_substrate: fresh_process_llama_cpp_cuda_gguf_canaries
        verifier_is_oracle: false
        field_provenance: source/hash/reducer lineage for every field
        random_seed: fixed prompt and launch order seed
        duration_s: monotonic runtime
        tests_run: commands, exits, and summaries
        reproducibility_checksum: final content hash

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6648_three_family_gguf_canaries --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6649-exact-certificate-proposal-corpus
    milestone: "2026.08.580"
    deliverable: results/experiment_6649_exact_certificate_proposal_corpus.json
    title: "Exact certificate proposal corpus"
    priority: critical
    track: verification-headroom
    requires:
      - exp6648-three-family-gguf-canaries
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    gated_on:
      - upstream: exp6648-three-family-gguf-canaries
        artifact_field: all_mandated_models_admitted
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp6635-matched-direct-headroom
        verdict: "no_terminal_artifact_after_upstream_admission_block"
        addressed_by: "This attempt uses the newly admitted process path and separates row completeness from the measured amount of regeneration headroom."
        retire_if_same_verdict: true
      - experiment_id: exp6605-qwen36-direct-headroom
        verdict: "blocked_gpu_process_receipts: direct baseline integrity did not complete"
        addressed_by: "Exp6648 must independently admit the exact Qwen and Gemma processes before this fixed corpus can collect any headline row."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      The exact two-level plan compiler exists, but no complete real-SOTA direct corpus survived the V576-V579 admission failures. This task creates a smaller fixed corpus whose completeness is independent of whether repair headroom is favorable. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/scripts/experiment_template.py, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6648_three_family_gguf_canaries.json
      - {project_root}/python/carnot/experiment_6604_exact_two_level_plan_corpus.py and its result/tests
      - Exp6590/6591 constraint-first stream code and Exp6605/6607 direct-headroom code, artifacts, and tests
      - {project_root}/python/carnot/inference/sota_models.py, GGUF loader helpers, exact plan compiler/checker, and artifact writers
      - relevant verification, inference, model-tier, evidence, and reporting specs plus the E2E plan

      TASK:
      Build a frozen exact-certificate proposal corpus on at least 24 preregistered tasks using the flagship Qwen MoE and middle Gemma MoE. Preserve every raw and parsed row, identify the first exact failing step and valid prefix, and measure regeneration headroom without attempting repair.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify all_mandated_models_admitted=true; hash inputs/protected files; record hardware, cache, task manifest, compiler/checker identity, and randomization plan.
      1. Add REQ-* and SCENARIO-* anchors for immutable corpus selection, raw-output retention, exact first-failure localization, and completeness independent of success rate. Write tests first.
      2. Define MODEL_SPECS with unsloth/Qwen3.6-35B-A3B-GGUF and unsloth/gemma-4-26B-A4B-it-GGUF, resolved by cached_sota_pair(gpu_indices=(0,1), model_indices=(0,1)). Legacy models are smoke-only and excluded from headline rows.
      3. Freeze at least 24 task IDs, prompts, exact targets, seeds, decoding parameters, parser version, and checker hashes before generation. Use identical tasks and comparable budgets for both models.
      4. For every model-task unit, record raw output/hash, parsed plan or explicit parse failure, exact final validity, per-step exact outcomes, first failing step, valid-prefix length, prompt/generated tokens, latency, process/accelerator receipt, and lineage.
      5. Set candidate_corpus_complete=true only if all expected headline rows exist and independently recheck. Set regeneration_headroom_count to the number of invalid rows with a non-empty exact-valid prefix and at least one remaining step. Do not equate missing parses with invalid zeroes.
      6. Emit honest model-level and pooled direct rates with uncertainty, but make no repair claim. Write atomically and run focused tests, coverage, spec, row, artifact, adversarial, model-tier, and applicable E2E checks.

      Required deliverable: {project_root}/results/experiment_6649_exact_certificate_proposal_corpus.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: complete direct-corpus and measured-headroom conclusion
        verdict_class: closed enum based on authentic complete rows and measured direct evidence
        gate_check_summary: failed upstream, identity, row, parser, or checker value for blocked results
        upstream_gate_receipt: exact Exp6648 field and hash
        defined_model_specs: exact Qwen and middle-MoE GGUF specs
        frozen_task_manifest: immutable task/prompt/target/seed/parameter hashes
        candidate_rows: raw, parsed, exact, prefix, token, timing, and receipt row per model-task unit
        parse_failure_rows: explicit failures with no zero coercion
        model_level_metrics: row-derived rates and uncertainty
        regeneration_headroom_rows: exact prefix-repairable subset with reasons
        candidate_corpus_complete: boolean completeness field owned by this task
        regeneration_headroom_count: integer field owned by this task
        per_unit_rows: every expected model-task unit
        aggregate_row_recomputation: all counts and rates rebuilt from rows
        preconditions_checked: inputs, models, hardware, tools, and hashes
        protected_files_unchanged: protected path hashes
        inference_substrate: local_llama_cpp_cuda_direct_exact_certificate_generation
        verifier_is_oracle: false because exact checking evaluates a separate proposal model and no intervention occurs
        field_provenance: source/hash/reducer lineage
        random_seed: task and generation seed schedule
        duration_s: monotonic runtime
        tests_run: commands, exits, and summaries
        reproducibility_checksum: final content hash

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6649_exact_certificate_proposal_corpus --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6650-twin-prefix-verifier-map
    milestone: "2026.08.580"
    deliverable: results/experiment_6650_twin_prefix_verifier_map.json
    title: "Twin-prefix verifier discrimination map"
    priority: high
    track: verification-calibration
    requires:
      - exp6649-exact-certificate-proposal-corpus
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 75
    gated_on:
      - upstream: exp6649-exact-certificate-proposal-corpus
        artifact_field: candidate_corpus_complete
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp6637-verifier-unit-calibration
        verdict: "no_terminal_artifact_after_upstream_candidate_corpus_block"
        addressed_by: "The exact candidate producer now owns and declares candidate_corpus_complete, and this task runs only on frozen rows with no model-generation dependency."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      V579 selected a verifier-unit calibration question but never produced the required candidate artifact. Exp6649 now owns a complete frozen corpus field. Recent twin-unit work warns that longer verification can be more rejective without becoming more discriminative. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-references.md, and the V580 roadmap doc
      - {project_root}/results/experiment_6649_exact_certificate_proposal_corpus.json
      - existing process/formal-step/draft-conditioned verifier modules and calibration utilities under {project_root}/python/carnot/pipeline and {project_root}/python/carnot/verify
      - Exp6593/6594 independent reducers, verifier calibration artifacts, row lint, and adversarial verifier
      - relevant verification, evidence, and reporting specs plus {project_root}/ops/e2e-test-plan.md

      TASK:
      On frozen exact-labeled candidate rows, build byte-matched clean/error twins and compare one-step, two-step, and full-remaining-suffix verification units. Separate discrimination from raw rejection. Do not invoke an LLM and do not let a learned signal authorize output.

      CONCRETE STEPS:
      0. PRECONDITIONS: validate candidate_corpus_complete, artifact hash, row count, exact checker identity, protected hashes, resources, and no-LLM substrate.
      1. Add REQ-* and SCENARIO-* anchors for twin construction, unit preregistration, catch/false-reject pairing, abstention, and exact-label authority. Write tests first.
      2. Construct clean/error twins that differ only at the localized step while preserving prefix, suffix length, task, and formatting. Reject non-pairable units explicitly.
      3. Freeze unit definitions and thresholds before scoring: one action/step, two steps, and full remaining suffix. Use the same scorer and rows for every unit.
      4. Emit per-twin predictions, scores, abstentions, latency, exact labels, catches, false rejects, and hash lineage. Report informedness, balanced accuracy, AUROC/AUPRC where defined, calibration, coverage, and rejection rate with uncertainty.
      5. Recommend a unit only if discrimination improves without an unsupported false-reject increase; otherwise emit a null or partial result. Exact labels remain release authority.
      6. Write atomically and run focused tests, scoped coverage, spec coverage, row consistency, adversarial checks, and applicable verifier E2E tests.

      Required deliverable: {project_root}/results/experiment_6650_twin_prefix_verifier_map.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: discrimination-versus-rejection conclusion
        verdict_class: closed enum
        gate_check_summary: failed gate/check and observed value for blocked results
        upstream_gate_receipt: Exp6649 field, value, path, and hash
        twin_construction_contract: pairability and byte-difference rules
        verifier_unit_preregistration: frozen unit definitions and thresholds
        twin_rows: exact label and per-unit score/decision/latency per clean-error pair
        unit_metric_rows: catch, false reject, informedness, calibration, coverage, and uncertainty
        recommended_verifier_unit: selected unit or explicit no-selection
        authority_boundary: learned scorer measures/routes; exact checker authorizes
        per_unit_rows: every twin, unit, and rejected-pair row
        aggregate_row_recomputation: metrics rebuilt from rows
        preconditions_checked: inputs, tools, resources, and hashes
        protected_files_unchanged: protected path hashes
        inference_substrate: frozen_candidate_verifier_unit_replay_no_llm
        verifier_is_oracle: false
        field_provenance: source/hash/reducer lineage
        random_seed: deterministic twin and bootstrap seed
        duration_s: monotonic runtime
        tests_run: commands, exits, and summaries
        reproducibility_checksum: final content hash

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6650_twin_prefix_verifier_map --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6651-failure-localized-suffix-regeneration
    milestone: "2026.08.580"
    deliverable: results/experiment_6651_failure_localized_suffix_regeneration.json
    title: "Failure-localized suffix regeneration A/B"
    priority: critical
    track: constrained-repair
    requires:
      - exp6649-exact-certificate-proposal-corpus
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 210
    gated_on:
      - upstream: exp6649-exact-certificate-proposal-corpus
        artifact_field: candidate_corpus_complete
        op: "=="
        value: true
      - upstream: exp6649-exact-certificate-proposal-corpus
        artifact_field: regeneration_headroom_count
        op: ">="
        value: 8
    prior_failures:
      - experiment_id: exp6636-delayed-two-level-decoding
        verdict: "blocked_gate_check_failed"
        addressed_by: "The method changes from two-level token masking to exact-checker-localized suffix regeneration over a completed frozen candidate corpus, with full retry at a matched proposal-token budget."
        retire_if_same_verdict: true
      - experiment_id: exp6609-two-level-constrained-decoding
        verdict: "blocked_headroom_gate"
        addressed_by: "Exp6649 directly owns a complete headroom count and this task forbids the retired finite-ID generated-answer transport mechanism."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Selective Regenerative Decoding suggests preserving useful prefixes and regenerating only degraded suffixes. Carnot can localize exact plan failures, but prior two-level token-constrained paths never reached valid evidence and finite-ID generated-answer transport is retired. This task tests a different post-prefix repair mechanism. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-references.md, and the V580 roadmap doc
      - {project_root}/results/experiment_6649_exact_certificate_proposal_corpus.json
      - {project_root}/python/carnot/experiment_6604_exact_two_level_plan_corpus.py, exact compiler/checker code, and tests
      - {project_root}/python/carnot/pipeline/certificate_repair_executor.py, repair ladder/search helpers, and Exp5910 verification-guided repair
      - Exp6609 and Exp6636 code/artifacts plus the finite-ID generated-answer retirement record in {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/python/carnot/inference/sota_models.py, GGUF loader, lease journal, and artifact writers
      - relevant verification, inference, constraint, safety, and reporting specs plus the E2E plan

      TASK:
      Compare direct candidates, full retry, and exact-failure-localized suffix regeneration on the fixed headroom rows. Preserve valid prefixes, match total generated proposal-token budgets per row, and keep exact checking authoritative. Do not implement token masking, answer-ID forcing, or semantic grammar transport.

      CONCRETE STEPS:
      0. PRECONDITIONS: validate both structured gates, freeze selected headroom row IDs, hash checker/compiler/protected files, and record hardware/cache/lease resources.
      1. Add REQ-* and SCENARIO-* anchors for accepted-prefix proof, first-failure localization, matched proposal-token budgets, independent fresh processes, forbidden transport paths, and circularity labeling. Write tests first.
      2. Define MODEL_SPECS with unsloth/Qwen3.6-35B-A3B-GGUF and unsloth/gemma-4-31B-it-GGUF. Resolve cached Qwen and dense Gemma locally; no legacy model may enter headline rows.
      3. Freeze three arms per model-task unit: original direct row, full retry from the original prompt, and suffix regeneration from the exact-valid prefix plus localized failure receipt. Allocate the same total generated proposal tokens to full retry and suffix regeneration.
      4. Run fresh owned processes and record raw outputs, prefix hashes, first edited position, generated tokens, exact step/final outcomes, attempts, latency, and accelerator receipts. Reject any suffix arm that changes the accepted prefix.
      5. Report exact-valid yield, solved-within-budget, preserved-prefix rate, tokens per valid result, latency, and failure taxonomy per model and pooled. A favorable result is verifier_is_oracle=true and verdict_class=circular_positive because the same exact checker localizes intervention.
      6. Set repair_comparison_complete=true only when every selected unit has all arms, budget parity, identity, exact labels, and raw lineage. Blocks start blocked_ with gate_check_summary.
      7. Write atomically and run focused tests, coverage, spec, row, artifact, model-tier, exclusion, adversarial, and applicable GGUF/E2E checks.

      Required deliverable: {project_root}/results/experiment_6651_failure_localized_suffix_regeneration.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal state
        honest_verdict: matched-budget suffix-regeneration conclusion with explicit oracle assistance
        verdict_class: circular_positive for a favorable oracle-localized result; otherwise null|blocked|disqualified|partial as supported
        gate_check_summary: exact failed gate/check and observed value for blocked results
        upstream_gate_receipts: both Exp6649 fields, values, path, and hash
