- id: exp1315-continuous-self-learning-cerce-nonforgetting-audit
  milestone: 2026.04.102
  deliverable: results/experiment_1315_continuous_self_learning_cerce_nonforgetting_audit.json
  title: "Continuous Self-Learning: CerCE Non-Forgetting Audit"
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  estimated_wall_time_min: 55
  priority: critical
  requires_gpu: false
  prior_failures:
