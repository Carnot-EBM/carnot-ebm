- id: exp1221-grpo-v6-fspo-vps-combined
  milestone: 2026.04.95
  deliverable: results/experiment_1221_grpo_v6_fspo_vps_combined.json
  title: "GRPO v6 — FSPO Per-Token Factuality Weighting + VPS Step Supervision Combined"
  agent_type: claude
  model: sonnet
  max_turns: 50
  estimated_wall_time_min: 45
  priority: high
  requires_gpu: false
  gated_on:
    - upstream: exp1220-grpo-vps-full-training
      artifact_field: grpo_vps_improvement_pp
      op: '>'
      value: 0.0
  prompt: |
    CONTEXT:
    exp1220 confirmed GRPO-VPS training improvement (gated_on check passed).
    This experiment adds FSPO-style per-token factuality weighting on top of VPS step rewards.

    arXiv 2505.24630 (FSPO): for each token T in reasoning step S, weight the advantage by
    a factuality score for step S. Factually correct steps get full advantage weight; incorrect
    steps get reduced advantage weight. This is more granular than VPS (step-level) — it
    attributes training signal to specific TOKENS within the responsible step.

    Carnot's CausalReasoningVerifier produces per-step factuality scores. FSPO turns those
    into per-token advantage weights.

    This is an EVALUATION experiment on 50 GSM8K questions (not a full training run) to
    measure whether adding FSPO token-level granularity further improves over VPS alone.

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write to results/experiment_1221_grpo_v6_fspo_vps_combined.json:
    {
      "experiment": "1221_grpo_v6_fspo_vps_combined",
      "status": "in_progress",
      "grpo_v6_fspo_delta_measured": false,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - results/experiment_1220_grpo_vps_full_training.json (VPS improvement baseline)
    - python/carnot/training/latent_grpo.py (GRPO implementation for reference)
    - python/carnot/pipeline/extract.py (CausalReasoningVerifier for factuality scores)

    TASK:
    1. Write skeleton artifact (STEP 0).
    2. Read exp1220 results: grpo_vps_improvement_pp (this is the VPS-only baseline).
    3. Implement FSPO token-level advantage weighting:
       For 50 GSM8K questions (questions 1800-1850):
       a. Generate 4 completions per question via llama.cpp CPU (any available GGUF)
       b. Split each completion into CoT steps
       c. Compute per-step factuality scores: CausalReasoningVerifier().verify_step(step_text)
       d. FSPO-VPS advantage for completion C, step S:
            vps_step_reward[S] = 0.5*causal_score[S] + 0.5*z3_score[S]
            fspo_weight[T in S] = factuality_score[S]  # token inherits step factuality
            advantage[T] = group_normalize(vps_step_reward) * fspo_weight[T]
       e. GRPO selection: pick completion with highest sum of token advantages
    4. Compare vs VPS-only selection (same 50 questions from exp1220's grpo_vps_fraction_correct):
       - vps_accuracy = exp1220.grpo_vps_fraction_correct_after (loaded from artifact)
       - fspo_vps_accuracy = accuracy with FSPO-weighted selection on 50 new questions
       - fspo_delta_pp = 100*(fspo_vps_accuracy - vps_accuracy)
    5. Update artifact.

    CONCRETE STEPS:
    - Write skeleton artifact (STEP 0)
    - python3 -c "import json; d=json.load(open('results/experiment_1220_grpo_vps_full_training.json')); print('vps_after:', d.get('grpo_vps_fraction_correct_after','MISSING'))" 2>&1
