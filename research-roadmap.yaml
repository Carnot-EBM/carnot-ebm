    gate skip. It proved useful BEAVER-lite bounds, FR-11 query-time utility,
    CCTU executable constraints, and injected-failure localization, while
    retiring Semantic Energy/logit telemetry and V_1 pairwise verification as
    headline signals. Use {project_root} as the project root and {date} as the
    run date.

