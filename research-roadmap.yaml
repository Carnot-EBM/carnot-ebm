    - results/experiment_1313_constrainprompt_nsvif_semantic_validator_mus_repair.json
    - research-references.md
    - python/carnot/
    - tests/

    TASK:
    Implement or replay a small safe-prefix acceptance audit. It should decide
    when a certificate prefix can be accepted, when it needs full verification,
    and when repair/abstain is required.

    REQUIRED ARTIFACT FIELDS:
