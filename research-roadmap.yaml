- id: exp648-parallel-ising-inertia
  milestone: 2026.04.49
  deliverable: results/experiment_648_parallel_ising_inertia.json
  title: 'Exp 648: Parallel Densely Connected Ising Machine with Inertia (arXiv 2604.17109) — KV260 v3 RTL Path'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2604.17109 (April 2026) introduces inertia dynamics for parallel probabilistic
    Ising machines. Key modification: the local field h_i is smoothed with an exponential moving
    average h_i(t+1) = alpha*h_i(t) + (1-alpha)*sum_j(J_ij*s_j(t)), where alpha is the inertia
    parameter. This prevents oscillation in dense coupling graphs and accelerates convergence
    by 20-35x vs standard synchronous Gibbs on FPGA. Carnot's KV260 work uses checkerboard
    parallel Gibbs (ising_sampler_v2.v). Inertia dynamics would be v3: same ~50% area as v2
    (vs v1), but faster convergence for dense arithmetic constraint graphs.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/parallel_ising.py — ParallelIsingSampler (checkerboard Gibbs)
    - hardware/kv260/ising_sampler_v2.v — synchronous v2 RTL (Exp 612)
    - hardware/kv260/synth_ising_v2.tcl — synthesis TCL (Exp 636)
    - results/experiment_585_kv260_live_benchmark_v3.json — CPU baseline latency
    - python/carnot/samplers/backend.py — SamplerBackend protocol

    TASK: Implement Python simulation of inertia Ising dynamics and benchmark vs checkerboard Gibbs.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-SAMPLE-023 (ParallelDenseIsingInertia: inertia EMA dynamics with alpha parameter),
       REQ-SAMPLE-024 (ParallelDenseIsingInertia: convergence in <= 80% steps vs checkerboard Gibbs
       on 100-spin dense graph), SCENARIO-SAMPLE-037/038/039 to
       openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/samplers/parallel_dense_ising.py:
       a. ParallelDenseIsingConfig dataclass: n_spins (int), alpha (float = 0.3),
          beta (float = 1.0), n_steps (int = 200).
       b. ParallelDenseIsingInertia class:
          __init__(self, config: ParallelDenseIsingConfig):
            self.config = config
            self.h_i: jnp.ndarray = jnp.zeros(config.n_spins)  (EMA local fields)
          _compute_local_fields(self, J: jnp.ndarray, s: jnp.ndarray) -> jnp.ndarray:
            'Compute J @ s (local fields from coupling matrix and spin state).'
            return J @ s
          _update_inertia(self, h_i: jnp.ndarray, local_fields: jnp.ndarray) -> jnp.ndarray:
            alpha = self.config.alpha
            return alpha * h_i + (1 - alpha) * local_fields
          _flip_probabilities(self, h_i: jnp.ndarray, biases: jnp.ndarray) -> jnp.ndarray:
            'P(s_i = +1) = sigmoid(2 * beta * (h_i + bias_i))'
            return jax.nn.sigmoid(2.0 * self.config.beta * (h_i + biases))
          sample(self, J: jnp.ndarray, biases: jnp.ndarray,
                 rng_key: jnp.ndarray, init_state: jnp.ndarray | None = None) -> dict:
            's ∈ {-1, +1}^n, returns final state + convergence statistics.'
            s = init_state if init_state is not None else jnp.ones(self.config.n_spins)
            h_i = self._compute_local_fields(J, s)
            energy_history = []
            for step in range(self.config.n_steps):
                local_fields = self._compute_local_fields(J, s)
                h_i = self._update_inertia(h_i, local_fields)
                flip_probs = self._flip_probabilities(h_i, biases)
                rng_key, subkey = jax.random.split(rng_key)
                s = jnp.where(jax.random.uniform(subkey, (self.config.n_spins,)) < flip_probs,
                              1.0, -1.0)
                energy = -0.5 * s @ J @ s - biases @ s
                energy_history.append(float(energy))
            return {'final_state': s, 'final_energy': energy_history[-1],
                    'energy_history': energy_history,
                    'n_steps': self.config.n_steps}
       c. Export ParallelDenseIsingInertia, ParallelDenseIsingConfig from carnot.samplers.
    4. Write scripts/experiment_648_parallel_ising_inertia.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(648, timeout_minutes=30).
       c. ExperimentTemplate(648, 'Parallel Dense Ising Inertia',
          'results/experiment_648_parallel_ising_inertia.json', requires_gpu=False).
       d. Generate test coupling matrices at n_spins in [50, 100, 200, 500]:
          Random dense J (Gaussian, normalized by n_spins), random biases.
       e. For each n_spins:
          Baseline: ParallelIsingSampler(n_spins, ...).parallel_sample_states()
            Record steps_to_converge = first step where energy stops decreasing by > 0.1%.
          Inertia: ParallelDenseIsingInertia(ParallelDenseIsingConfig(n_spins, alpha=0.3))
            Record steps_to_converge for same criterion.
          convergence_reduction_pct = (baseline_steps - inertia_steps) / baseline_steps
       f. Also test alpha in [0.1, 0.3, 0.5, 0.7]: find best alpha by convergence speed.
       g. Generate hardware/kv260/ising_sampler_v3_spec.md documenting the RTL changes
          needed for v3 (inertia register h_i, EMA update before flip probability computation).
       h. Build artifact: schema='carnot.parallel_ising_inertia.v1',
          n_spins_tested=[50, 100, 200, 500],
          baseline_steps_mean=<float>, inertia_steps_mean=<float>,
          convergence_reduction_pct=<float>,
          best_alpha=<float>,
          inertia_faster=(convergence_reduction_pct >= 0.20),
          v3_rtl_spec_path='hardware/kv260/ising_sampler_v3_spec.md',
          honest_verdict='inertia_faster_v3_path_clear' if convergence_reduction_pct >= 0.20
            else 'inertia_comparable_no_clear_win'.
       i. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_parallel_dense_ising.py (100% coverage on parallel_dense_ising.py).
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: research-hardware-wishlist.md (add v3 RTL note), ops/conductor-log.md,
