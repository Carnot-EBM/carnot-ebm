      CONTEXT:
      Paper arXiv:2502.20379 establishes that scaling the NUMBER of verifiers (k) at test time
      improves performance up to a saturation point (k=4-6 for diverse verifiers). Beyond
      saturation, additional verifiers add noise rather than signal. This experiment measures
      where Carnot's ensemble hits its saturation point.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (list all tier0* verifier modules — check what actually exists)
      - data/fover_corpus.jsonl (FoVer corpus — {{question, correct, incorrect}})
      - results/ensemble_v11_weights.json (if exists — component weights and list)

      TASK: Evaluate ensemble AUROC at k = [1, 2, 4, 6, 8, 12, 16] to find saturation curve.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo "0"` — FoVer corpus lines.
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
