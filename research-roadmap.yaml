  requires_gpu: true
  grace_period_s: 3600
  prompt: |
    CONTEXT:
    MANDATORY per ops/known-issues.md (.96/.97 pickup). Phase-5-A/B/C validated in-situ
    training at toy scale (50K params, d=16). Deep Think Q9 identified 3 production-scale
    failure modes STRUCTURALLY INVISIBLE at toy scale:

    1. Mode collapse: overparameterized degenerate attractors — requires 1B+ params to manifest
    2. MCMC mixing paralysis: PCD distillation degradation in high-d landscapes — requires d>=256
    3. Substrate shift: measure concentration in [-1,1]^d — geometric phase transition at large d

    Going directly from 50K to 1B+ without intermediate validation risks discovering these
    after 100-500 GPU-hours. Intermediate scale (100-300M params, d=128) catches them cheaply.

    Per ops/known-issues.md: acceptance gates for exp1238:
    - All 5 toy-detectable modes absent (same as exp1222-1224 acceptance criteria)
    - All 3 production-scale-only modes MEASURED (not necessarily absent — measurement is the gate)

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    {{
      "experiment": "1238_phase5d_intermediate_scale",
      "status": "in_progress",
      "phase5d_prototype_initialized": false,
