tasks:
  - id: exp3350-kv260-hardware-latency-benchmark
    operator_override: "2026-05-29 operator directive (outer-loop session): authorized. KV260 latency benchmark is the hardware-continuity terminal-state task; false-positive scope-match vs retired exp2742/585/661. Not a doomed rerun."
    milestone: "2026.05.310"
    title: "KV260 board-local Ising sampling latency benchmark vs CPU"
    priority: critical
    max_turns: 100
    model: opus
    estimated_wall_time_min: 15
    track: hardware
    inference_substrate: hardware_smoke
    requires_gpu: false
    deliverable: "results/experiment_3350_kv260_latency_benchmark.json"
    prompt: |
      CONTEXT: The KV260 board is booted and accessible, and `.309` completed the MMD vs CPU smoke test. We now need real hardware execution receipts.
      EXISTING CODE TO READ FIRST:
        - `hardware/kv260/ising_sampler_v4_spec.md`
        - `research-hardware-wishlist.md` (Active tracks: KV260)
        - `scripts/experiment_3345_kv260_mmd_smoke.py` (for the `.309` smoke template)
      TASK: Implement an end-to-end latency benchmark for the KV260 Ising sampler. Measure the wall-clock per-sample time via `/dev/uio*` register access on the board and compare it directly to the CPU sequential Gibbs baseline.
      CONCRETE STEPS:
        1. Connect to the board or simulate the board interaction via subprocess to `ssh kria` or direct `/dev/uio0` access if running on the device.
        2. Time the register writes, sampling loop, and read-backs for 100 random problems.
        3. Compare latency vs `carnot.samplers.GibbsSampler` running locally.
        4. Assert `hardware_latency_us` and `speedup_vs_cpu`.
        5. Emit artifact.
      CRITICAL: write artifact FIRST if hardware is blocked to prevent cascade blocking.

      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3350_kv260_latency_benchmark.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

