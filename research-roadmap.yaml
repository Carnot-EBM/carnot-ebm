- id: exp745-cocoa-tier0f
  milestone: 2026.04.57
  deliverable: results/experiment_745_cocoa_tier0f.json
  title: 'Exp 745: CoCoA Inter-Layer Disagreement Detector — Tier 0f (arXiv 2602.09486, GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2602.09486 "Listen to the Layers: Mitigating Hallucinations with
    Inter-Layer Disagreement" (March 2026) proposes CoCoA decoder — a training-free
    hallucination detector based on representational instability across model layers.
    The core insight: hallucinations occur when the model is "confused" between layers
    — hidden states shift significantly from early to late layers when the model is
    uncertain about a factual claim.

    Key implementation: ConMLDS (Contrastive Multi-Layer Disagreement Score) measures
    the cosine distance between hidden state representations at selected layer pairs
    (e.g., layer 8 vs layer 16 for Qwen3.5-0.8B). High disagreement = likely hallucination.

    Properties: (1) Training-free — no fine-tuning required. (2) Can reuse the same
    forward pass as Tier 2.1 JEPAReasonerProbe (which already extracts layer-16 hidden
    states). (3) Orthogonal to all existing Tier 0 probes (logit/energy/basin signals).
    (4) Works on the SAME tokens as the probe — question-end token hidden states.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_reasoner_probe.py — JEPAReasonerProbe; find hidden
      state extraction code to reuse.
    - python/carnot/cascade/tier21_probe.py — Tier 2.1 cascade wrapper.
    - results/fover_v2_labeled.json (or equivalent) — FoVer v2 with correct/incorrect labels.
    - results/experiment_732_probe_xval.json — baseline AUC for comparison.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement CoCoADetector (training-free inter-layer disagreement scorer).
    Evaluate AUC on FoVer v2. Wire as Tier 0f advisory signal. Target: AUC >= 0.65.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-151 (CoCoADetector MUST compute ConMLDS as mean cosine distance
       between hidden states at layer pairs (early, late) for the question-end token;
       no training required),
       REQ-VERIFY-152 (Tier 0f CoCoA MUST be advisory — it records is_unstable in
       ViolationCertificate but does NOT short-circuit the cascade),
       SCENARIO-VERIFY-201/202 to openspec/capabilities/verification/spec.md.
    3. Implement python/carnot/cascade/tier0f_cocoa.py:
       a. Class CoCoADetector:
          - __init__(model, early_layers=(8, 10, 12), late_layers=(14, 16)):
            Store model reference. Layer pairs to compare.
          - extract_hidden_states(text: str, layer_indices: list) -> Dict[int, Tensor]:
            Run model forward pass on text, extract hidden state at last token for
            each layer index in layer_indices.
          - compute_conmlds(early_state: Tensor, late_state: Tensor) -> float:
            cosine_distance = 1 - cosine_similarity(early_state, late_state).
            Return mean over all (early, late) layer pairs.
          - score(text: str) -> (conmlds: float, is_unstable: bool):
            Compute ConMLDS. is_unstable = conmlds > threshold.
            Default threshold = mean ConMLDS on FoVer v2 correct set (calibrated below).
    4. Calibrate threshold:
       a. Extract ConMLDS for all correct FoVer v2 entries (GPU batch=32).
       b. threshold = mean(correct_conmlds) + 1.0 * std(correct_conmlds).
          (1-sigma above mean of correct responses)
    5. Evaluate AUC on FoVer v2:
       a. For each entry in FoVer v2: compute conmlds score.
       b. AUC: roc_auc_score(labels, conmlds_scores).
       c. Compare to existing Tier 0 probe baselines.
    6. Wire as Tier 0f in python/carnot/cascade/cascade_router.py:
       a. After Tier 0e HalluField (existing): call CoCoADetector.score().
       b. Record conmlds and is_unstable in ViolationCertificate.
       c. Do NOT short-circuit — Tier 0f is advisory only.
       d. Log: tier0f_conmlds, tier0f_is_unstable per query.
    7. Create scripts/experiment_745_cocoa_tier0f.py:
       a. ExperimentTemplate(745, requires_gpu=True) +
          ExperimentTimeoutWatchdog(745, timeout_minutes=60).
       b. Implement steps 3-6. Use BatchedInferenceRunner(batch_size=32) for extraction.
       c. honest_verdict:
          - "cocoa_tier0f_deployed" if auc >= 0.65 AND wired advisory
          - "cocoa_tier0f_below_threshold" if auc < 0.65
          - "cocoa_tier0f_auc_high" if auc >= 0.75 (bonus: consider for hard gate)
       d. artifact: auc, threshold, mean_conmlds_correct, mean_conmlds_incorrect,
          n_evaluated, tier0f_wired (bool), honest_verdict.
    8. Write tests/python/test_experiment_745_cocoa_tier0f.py with 100% coverage:
       - test compute_conmlds returns 0 for identical vectors, 1 for orthogonal.
       - test extract_hidden_states produces shape (hidden_dim,) per layer.
       - test cascade_router records tier0f fields in ViolationCertificate.
       Each test traces to REQ-VERIFY-151/152.
    9. Reconcile:
       - ops/status.md: add "Tier 0f CoCoA deployed (advisory): AUC=X on FoVer v2."
         Update architecture diagram entry: "Tier 0f: CoCoA (advisory, .57)."
       - ops/changelog.md: one-line with honest_verdict.
    10. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0 (Qwen3.5-0.8B hidden state extraction).
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

