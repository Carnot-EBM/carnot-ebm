       grep -n "subprocess.run\|claude -p\|_build_agent\|dispatch\|agent_type" scripts/research_conductor.py | head -30
    2. Find the existing agent_type: gemini routing path.
       If it exists: verify it works with a dry-run.
       If not: add routing for agent_type: "gemini" tasks:
         dispatch = ["gemini", "--prompt", prompt_text, "--model", "gemini-3.1-pro-preview"]
         (or equivalent gemini CLI invocation)
    3. Add per-worktree state file suffix logic:
       if agent_type == "gemini": state_file = "ops/conductor-state_gemini.json"
       (parallel state tracking so gemini tasks don't interfere with claude tasks)

    TASK PART 2 — SYSTEMCTL SERVICE:
