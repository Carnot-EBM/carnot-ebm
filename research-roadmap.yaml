- id: exp555-confidence-weighted-filtering
  milestone: 2026.04.42
  deliverable: results/experiment_555_confidence_weighted.json
  title: 'Exp 555: Confidence-Weighted Constraint Filtering — Reduce FP on IT Models'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Exp 554's extraction\
    \ diagnostic likely revealed high FP rate (violations flagged on correct IT-model\
    \ responses). The root cause: VeriCoT/VPRM uses binary violated/not-violated,\
    \ but IT models write arithmetic in prose format ('we compute 47 + 28 = 75') where\
    \ boundary cases are ambiguous. Confidence-weighted filtering assigns each violation\
    \ a confidence score and only triggers repair above a threshold. High-confidence\
    \ violations: definitive arithmetic errors ('47 + 28 = 76' — off by 1). Low-confidence:\
    \ intermediate estimates, approximations, or format mismatches.\n\nEXISTING CODE\
    \ TO READ FIRST:\n- python/carnot/extraction/vprm_verifier.py — VPRMArithmeticVerifier,\
    \ RuleVerdict (has confidence field?)\n- python/carnot/extraction/vericot_step_validator.py\
    \ — VeriCoTStepValidator\n- python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.verify()\n\
    - results/experiment_554_extraction_diagnostic.json — Exp 554 result (see root_cause_hypothesis\
    \ and fp_rate)\n- python/carnot/pipeline/constraint_addition.py — ConstraintAdditionFromMemory\
    \ (for reference)\n\nTASK: Implement ConfidenceWeightedConstraint and evaluate\
    \ thresholds.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-EXTRACT-031\
    \ (confidence score for each violation, only repair above threshold), REQ-EXTRACT-032\
    \ (threshold sweep evaluation), SCENARIO-EXTRACT-058/059/060 to spec.\n3. Create\
    \ python/carnot/extraction/confidence_filter.py:\n   a. ViolationConfidence dataclass:\
    \ violation_text, confidence_score (0.0-1.0), violation_type, is_definitive.\n\
    \   b. ConfidenceWeightedExtractor(base_extractor, confidence_threshold=0.7):\n\
    \      - score_violation(violation_text) -> float: heuristics for confidence:\n\
    \        * 'X + Y = Z' where Z is clearly wrong (>5% off) → confidence=0.95\n\
    \        * Approximate statements ('approximately', 'roughly') → confidence=0.2\n\
    \        * Intermediate computation steps → confidence=0.4\n        * Clear final\
    \ answer error → confidence=0.9\n      - extract(response) -> list[ViolationConfidence]:\
    \ run base_extractor, score each violation.\n      - above_threshold(violations)\
