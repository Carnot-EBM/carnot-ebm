- id: exp738-step-probe-tier2-memory
  milestone: 2026.04.56
  deliverable: results/experiment_738_step_probe_tier2_memory.json
  title: 'Exp 738: Step-Level Latent Probe + Tier 2 Cross-Session Memory (arXiv 2511.06209, GATED on Exp 734)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    GATE CHECK (MANDATORY FIRST STEP): Read results/experiment_734_fr11_tier21_relay.json.
    If honest_verdict != "fr11_relay_operational": write
    results/experiment_738_step_probe_tier2_memory.json with
    ("experiment": 738, "status": "gated_blocked", "gate_source": "exp734",
     "honest_verdict": "gated_blocked_fr11_relay_not_operational",
     "schema": "carnot.result.v1")
    and STOP. Do not implement anything else.

    CONTEXT (only if gate passes): This experiment has two complementary parts that share
    the GPU pipeline and complete the FR-11 self-learning loop.

    PART 1 — STEP-LEVEL LATENT PROBE (arXiv 2511.06209):
    arXiv 2511.06209 "Efficient Test-Time Scaling via Probing Internal States" demonstrates
    that <10M-param probes trained on hidden states POOLED ACROSS ALL CoT STEPS achieve
    parity with much larger Process Reward Models (PRMs) on math, planning, and QA tasks.
    Current Tier 2.1 (JEPAReasonerProbe) operates at QUERY LEVEL: one hidden state
    extracted at the question-end token BEFORE generation. This misses individual step
    failures within the generation. Step-level probing: extract one hidden state per CoT
    step boundary (after each "." or "\n" separator), max-pool across steps, train probe
    on pooled features. Compare step-level AUC vs query-level AUC (baseline from Exp 732).

    PART 2 — TIER 2 CROSS-SESSION MEMORY (research-program.md Tier 2 requirement):
    The FR-11 relay (Exp 734) wires SessionMemory to ConstraintTemplateLibrary within
    a single session. Cross-session memory extends this: violation patterns from session
    S1 must be replayed into session S2 at start, improving S2 precision without re-learning.
    This is the "continuous self-learning" experiment required by the milestone spec.
    Implementation: wire SessionMemory.on_session_end() to persist violation_type →
    template_key mappings to a JSON file, and SessionMemory.on_session_start() to reload
    them. Simulate 3 sessions. Measure precision monotonically increasing S1 → S2 → S3.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_reasoner_probe.py — JEPAReasonerProbe (query-level).
    - python/carnot/cascade/tier21_probe.py — Tier 2.1 cascade wrapper.
    - python/carnot/pipeline/session_memory.py — SessionMemory (wired by Exp 734).
    - python/carnot/pipeline/constraint_template_library.py — ConstraintTemplateLibrary.
    - results/experiment_732_probe_xval.json — query-level mean_auc baseline.
    - results/experiment_734_fr11_tier21_relay.json — FR-11 relay operational status.
    - results/fover_v2_labeled.json (or equivalent) — FoVer v2 with step-level labels.
    - scripts/experiment_template.py — ExperimentTemplate with BatchedInferenceRunner.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK:
    Part 1: Upgrade JEPAReasonerProbe to step-level pooled features. Measure AUC delta.
    Part 2: Implement cross-session violation memory. Simulate 3-session replay.
    Both parts share the GPU pipeline (Qwen3.5-0.8B) and run in one experiment script.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VER-038 (step-level JEPAReasonerProbe MUST extract hidden states at each
       CoT step boundary token, max-pool across steps, and achieve AUC >= query-level
       baseline from Exp 732 OR both >= 0.75),
       REQ-FR11-005 (SessionMemory MUST persist violation_type → template_key mappings to
       disk on session_end; mappings MUST be reloaded on next session_start),
       REQ-FR11-006 (3-session simulation MUST show monotonically non-decreasing precision
       S1 → S2 → S3 OR fr11_tier2_relay_functional = True if any template from S1 fires
       in S2),
       SCENARIO-VER-047/FR11-005/006 to relevant spec files.
    3. Part 1 — Step-Level Probe implementation:
       a. Add StepLevelJEPAProbe class in python/carnot/samplers/jepa_reasoner_probe.py
          (or a new jepa_step_probe.py):
          - extract_step_states(text: str, model, layer=16) -> List[Tensor]:
            split text at CoT boundaries (". " or "\n"), run model forward on each
            prefix, extract layer-16 hidden state at last token of each segment.
          - pool_states(states: List[Tensor]) -> Tensor: max-pool across steps.
          - probe: same 2-layer MLP as query-level (Linear(1024,256) → ReLU →
            Linear(256,1) → sigmoid).
       b. Train StepLevelJEPAProbe on FoVer v2 (same data as Exp 726/732).
          Use ExperimentTemplate BatchedInferenceRunner for step extraction (GPU, batch=8;
          smaller batch because each item now generates multiple hidden states).
       c. Evaluate AUC on FoVer v2 OOD fold (same split as Exp 732).
       d. Compare step_auc vs query_auc_baseline (from results/experiment_732_probe_xval.json
          mean_auc field).
    4. Part 2 — Cross-Session Memory implementation:
       a. Add SessionMemory.persist(filepath: str) -> None:
          Write {violation_type: count, template_keys: [...]} to filepath as JSON.
       b. Add SessionMemory.load(filepath: str) -> None:
          Load persisted mappings. For each template_key: call
          ConstraintTemplateLibrary.replay_template(key) to pre-populate templates.
       c. Wire into pipeline:
          - on_session_end: call persist("data/session_memory_persistent.json").
          - on_session_start: call load("data/session_memory_persistent.json") if exists.
       d. 3-session simulation:
          - Session 1 (S1): run 20q FoVer v2 through cascade with FR-11 relay. Record
            precision_s1. Call on_session_end(). Confirm persist file written.
          - Session 2 (S2): call on_session_start(). Run same 20q. Record precision_s2.
            Measure templates_replayed_in_s2.
          - Session 3 (S3): after S2 session_end, start S3. Run same 20q. Record precision_s3.
          - Verify: templates_replayed_in_s2 > 0 (at least one template from S1 fires in S2).
    5. Create scripts/experiment_738_step_probe_tier2_memory.py:
       a. ExperimentTemplate(738, requires_gpu=True) +
          ExperimentTimeoutWatchdog(738, timeout_minutes=120).
       b. Part 1: extract step-level states, train probe, measure step_auc.
          Use BatchedInferenceRunner(batch_size=8) for step extraction.
       c. Part 2: 3-session simulation with cross-session memory.
       d. honest_verdict:
          - "step_probe_and_memory_both_pass" if step_auc >= query_auc_baseline AND
            templates_replayed_in_s2 > 0
          - "step_probe_pass_memory_fail" if step_auc >= query_auc_baseline AND
            templates_replayed_in_s2 == 0
          - "step_probe_fail_memory_pass" if step_auc < query_auc_baseline AND
            templates_replayed_in_s2 > 0
          - "both_below_threshold" if step_auc < query_auc_baseline AND
            templates_replayed_in_s2 == 0
       e. artifact: step_auc, query_auc_baseline, auc_delta, templates_replayed_in_s2,
          precision_s1, precision_s2, precision_s3, fr11_tier2_relay_functional (bool),
          honest_verdict.
    6. Write tests/python/test_experiment_738_step_probe_memory.py with 100% coverage:
       - test gated-blocked path writes correct status.
