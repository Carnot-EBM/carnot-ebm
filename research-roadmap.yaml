- id: exp453-vericot-step-validator
  milestone: 2026.04.34
  deliverable: results/experiment_453_vericot_validator.json
  title: 'Exp 453: VeriCoT Step Validator — FOL formalization + Z3 for IT model extraction'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: The ArithmeticExtractor regex\
    \ matches 'a + b = c' format that base models write. Instruction-tuned (IT) models like\
    \ Gemma4-E4B-it and Qwen3.5-0.8B write reasoning in natural language: 'the total is 47\
    \ plus 28, which gives us 75'. The regex finds 0 violations on IT model outputs, causing\
    \ the verify-repair loop to have 0% net effect even when the model makes errors.\n\n\
    VeriCoT (arXiv 2511.04662) fixes this: each CoT reasoning step is formalized into\
    \ First-Order Logic (FOL) premises using an LLM call, then Z3 checks logical consistency.\
    \ 'the total is 47 plus 28, which gives 75' → Z3 assertion: 47+28=75 → Z3 reports UNSAT\
    \ → violation detected. Published improvement: 46% relative pass rate improvement.\n\n\
    This is a CPU-only experiment. It uses a small LLM (Qwen3.5-0.8B via transformers) for\
    \ FOL extraction and z3-solver Python for verification. No GPU required for the validator\
    \ logic itself.\n\n\
    EXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/extraction/arithmetic_extractor.py — ArithmeticExtractor (to compare against)\n\
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline extraction interface\n\
    - scripts/experiment_template.py — ExperimentTemplate\n\
    - research-references.md — VeriCoT section (arXiv 2511.04662)\n\n\
    TASK: Implement VeriCoTStepValidator and compare detection rate vs ArithmeticExtractor.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-EXTRACT-010 (VeriCoTStepValidator extracts FOL premises from natural-language\n\
    \   CoT steps via LLM call), REQ-EXTRACT-011 (Z3 verifier checks FOL consistency,\n\
    \   returns UNSAT as violation signal), REQ-EXTRACT-012 (VeriCoTStepValidator detects\n\
    \   violations in IT model outputs that ArithmeticExtractor misses),\n\
    \   SCENARIO-EXTRACT-020/021/022 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - FOLPremise(expression: str, source_step: str):\n\
    \     - to_z3_assertion() -> z3.BoolRef or None\n\
    \   - VeriCoTStepValidator(extractor_llm: str = 'Qwen/Qwen3.5-0.8B',\n\
    \     use_mock: bool = False):\n\
    \     - extract_fol(step_text: str) -> list[FOLPremise]\n\
    \     - verify_step(step_text: str) -> StepVerdict (sat/unsat/unknown)\n\
    \     - detect_violations(cot_text: str) -> list[StepVerdict]\n\
    \   - StepVerdict(step_idx: int, step_text: str, status: str, fol_premises: list)\n\
    \   - Test (mock mode): 'the total is 47 plus 28, which gives 75' → verify gives UNSAT\n\
    \     (because 47+28=75 is SAT but Z3 checks the claim not the arithmetic — see docstring)\n\
    \   - Test (mock mode): 'the total is 47 plus 28, which gives 76' → UNSAT (76 ≠ 75)\n\
    \   - Test: ArithmeticExtractor finds 0 violations on IT natural-language input\n\
    \   - Test: VeriCoTStepValidator finds ≥1 violation on same input (improvement demonstrated)\n\
    5. Implement python/carnot/extraction/vericot_validator.py.\n\
    \   Export VeriCoTStepValidator, FOLPremise, StepVerdict from carnot.extraction.__init__.\n\
    \   Verbose docstrings: WHY FOL formalization beats regex (IT models don't write equations),\n\
    \   WHY Z3 (sound SMT solver, no neural judge, immune to reward hacking),\n\
    \   HOW the LLM prompt asks the model to emit Z3-compatible assertions,\n\
    \   WHY use_mock=True in tests (avoid GPU dependency in unit tests).\n\
    6. Write scripts/experiment_453_vericot_validator.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(453, timeout_minutes=30) as context manager\n\
    \   c. ExperimentTemplate(453, 'VeriCoT Step Validator',\n\
    \      'results/experiment_453_vericot_validator.json')\n\
    \   d. Prepare 20 IT-model-style reasoning samples (hardcoded, no GPU needed)\n\
    \      10 with arithmetic errors, 10 correct\n\
    \   e. Run ArithmeticExtractor.detect_violations() on all 20 → baseline_detected\n\
    \   f. Run VeriCoTStepValidator(use_mock=True).detect_violations() on all 20 → vericot_detected\n\
    \      (use_mock=True uses a rule-based FOL extractor for tests — does not call GPU)\n\
    \   g. Build artifact: schema='carnot.vericot_validator.v1'\n\
    \      baseline_detected=<int> (ArithmeticExtractor)\n\
    \      vericot_detected=<int> (VeriCoTStepValidator mock)\n\
    \      improvement_rate=vericot_detected/20 - baseline_detected/20\n\
    \      honest_verdict='vericot_better' if improvement_rate > 0 else 'no_improvement'\n\
    \   h. Output: results/experiment_453_vericot_validator.json\n\
    7. Write tests/python/test_vericot_validator.py (100% coverage).\n\
    8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    9. Reconcile: update _bmad/traceability.md (REQ-EXTRACT-010/011/012),\n\
    \   ops/conductor-log.md, ops/status.md, ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp454-vprm-arithmetic-verifier
  milestone: 2026.04.34
  deliverable: results/experiment_454_vprm_verifier.json
  title: 'Exp 454: VPRM Arithmetic Rule Verifier — rule-based step checking, no neural judge'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: VeriCoT (Exp 453) requires an LLM\
    \ call to extract FOL premises — it adds latency and a potential error source. VPRM\
    \ (arXiv 2601.17223, Verifiable Process Reward Models) complements it: pure rule-based\
    \ arithmetic step verifiers that work deterministically, with no neural judge. Published\
    \ improvement: 20% F1 gain. Rules implemented: addition, subtraction, multiplication,\
    \ division, percentage, unit consistency.\n\n\
    The key advantage: VPRM rules are immune to reward hacking (a neural judge can be fooled\
    \ with adversarial inputs; a rule cannot). Combined with VeriCoT FOL checking, the two\
    \ approaches form a complementary extraction front-end:\n\
    \  - VeriCoT: catches logical inconsistency in multi-step reasoning\n\
    \  - VPRM: catches arithmetic errors in individual steps\n\
    \  - ArithmeticExtractor: catches structured 'a op b = c' patterns (base model only)\n\n\
    DEPENDS ON: Exp 453 VeriCoTStepValidator (shares FOL/Z3 infrastructure).\n\
    REQUIRES: z3-solver, no GPU needed (CPU experiment).\n\n\
    EXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/extraction/arithmetic_extractor.py — ArithmeticExtractor (to compare)\n\
    - python/carnot/extraction/vericot_validator.py — VeriCoTStepValidator (Exp 453)\n\
    - scripts/experiment_template.py — ExperimentTemplate\n\
    - research-references.md — VPRM section (arXiv 2601.17223)\n\n\
    TASK: Implement VPRMArithmeticVerifier and compare against ArithmeticExtractor.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-EXTRACT-013 (VPRMArithmeticVerifier implements rule-based arithmetic step checks:\
    \ addition, subtraction, multiplication, division, percentage, unit consistency),\n\
    \   REQ-EXTRACT-014 (VPRM rules are deterministic — same input always produces same verdict),\n\
    \   REQ-EXTRACT-015 (VPRM detects IT model arithmetic errors with no LLM call),\n\
    \   SCENARIO-EXTRACT-023/024/025 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - ArithmeticRule (abstract base): check(step_text: str) -> RuleVerdict\n\
    \   - AdditionRule(ArithmeticRule): checks 'A plus B equals C'\n\
    \   - MultiplicationRule(ArithmeticRule): checks 'A times B equals C'\n\
    \   - PercentageRule(ArithmeticRule): checks 'X% of Y is Z'\n\
    \   - RuleVerdict(rule_name: str, passed: bool, computed_value: float | None,\n\
    \     stated_value: float | None, error_magnitude: float | None)\n\
    \   - VPRMArithmeticVerifier(rules: list[ArithmeticRule] | None = None):\n\
    \     - verify_step(step_text: str) -> list[RuleVerdict]\n\
    \     - detect_violations(cot_text: str) -> list[RuleVerdict]\n\
    \     - f1_score(ground_truth: list[bool], predicted: list[bool]) -> float\n\
    \   - Test: AdditionRule detects '47 plus 28 equals 76' (76 ≠ 75) as failed\n\
    \   - Test: AdditionRule accepts '47 plus 28 equals 75' as passed\n\
    \   - Test: PercentageRule detects '20% of 50 is 11' as failed (should be 10)\n\
    \   - Test: VPRMArithmeticVerifier.f1_score computes correctly\n\
    5. Implement python/carnot/extraction/vprm_verifier.py.\n\
    \   Export VPRMArithmeticVerifier, ArithmeticRule, RuleVerdict from carnot.extraction.__init__.\n\
    \   Verbose docstrings: WHY rule-based over neural (immune to reward hacking),\n\
    \   WHY complement VeriCoT (different failure modes: VPRM catches arithmetic, VeriCoT catches logic),\n\
    \   reference arXiv 2601.17223 (VPRM paper).\n\
    6. Write scripts/experiment_454_vprm_verifier.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(454, timeout_minutes=20) as context manager\n\
    \   c. ExperimentTemplate(454, 'VPRM Arithmetic Verifier',\n\
    \      'results/experiment_454_vprm_verifier.json')\n\
    \   d. Prepare 20 IT-model-style arithmetic CoT steps (hardcoded)\n\
    \      10 with arithmetic errors (wrong sums, percentages), 10 correct\n\
    \   e. Run ArithmeticExtractor on all 20 → baseline_f1\n\
    \   f. Run VPRMArithmeticVerifier on all 20 → vprm_f1\n\
    \   g. Build artifact: schema='carnot.vprm_verifier.v1'\n\
    \      baseline_f1=<float> (ArithmeticExtractor)\n\
    \      vprm_f1=<float>\n\
