      CONTEXT. The verifier moat-at-scale scissor needs an error-rich corpus the
      math-bound ensemble can actually score. The .357 attempt failed because
      PRMBench is OOD (carnot_ensemble_auroc=0.55); the .358 attempt SKIP'd behind a
