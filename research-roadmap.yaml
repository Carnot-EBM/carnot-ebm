       Identify why initial energy was 0 in exp1189 (likely: puzzle initialized in solved state,
       or energy function only measures partial constraints that are trivially satisfied).

    2. Fix the puzzle generator:
       - Add an explicit "scramble" step: after generating a goal state, apply N random valid
