- id: exp408-semantic-energy-scorer
  milestone: 2026.06.17
  deliverable: python/carnot/pipeline/semantic_energy_scorer.py
  title: 'Exp 408: Semantic Energy scorer — logit-space Boltzmann hallucination detection (purge corrupt file)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: python/carnot/pipeline/semantic_energy_scorer.py\
    \ contains JSON data (corrupt Exp 401 artifact). Call DeliverableContentValidator.validate_and_clear()\
    \ at the top to delete it before implementing.\n\narXiv 2508.14496 (Semantic Energy, 2025-08):\
    \ Operates on PENULTIMATE-LAYER LOGITS (pre-softmax) instead of post-softmax probabilities.\
    \ Post-softmax normalization loses intensity information — logit 100 vs logit 10 both normalize\
    \ to high probability, but represent very different confidence levels. Semantic Energy restores\
    \ this: compute Boltzmann-style E = -log(sum(exp(logits/T))) over semantic cluster. Higher\
    \ energy = more hallucination-prone. Consistently outperforms semantic entropy.\n\nWHY THIS\
    \ COMPLEMENTS ISING: Ising checks structural correctness AFTER generation. Semantic Energy\
    \ provides a FAST pre-filter DURING generation — if energy is high, trigger full Ising\
    \ verification; if low, skip. Same architecture as SinkProbe (Exp 348) but uses logit-space\
    \ energy instead of attention sink concentration.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/deliverable_validator.py\
    \ — DeliverableContentValidator (Exp 404)\n- python/carnot/pipeline/sink_probe.py — SinkProbe\
    \ (Exp 348) — fast-path pattern to follow\n- python/carnot/pipeline/three_tier_pipeline.py\
    \ — ThreeTierPipeline (Exp 360) — integration point\n- python/carnot/pipeline/live_gpu_diagnostic.py\
    \ — diagnose_live_gpu() for CI-safe mode\n\nTASK: Implement SemanticEnergyScorer and benchmark\
    \ vs SinkProbe.\n1. Read CLAUDE.md spec-first workflow.\n2. Call validate_and_clear at TOP.\n\
    3. Add REQ-VERIFY-090 (SemanticEnergyScorer detects hallucinations from logit-space energy),\n\
    \   REQ-VERIFY-091 (CI-safe mode with simulated logits),\n   SCENARIO-VERIFY-120/121/122\
    \ to spec.\n4. Write tests FIRST (100% coverage) for:\n   - SemanticCluster(response_texts:\
    \ list[str], logit_matrix: jnp.ndarray|None)\n   - compute_boltzmann_energy(logits: jnp.ndarray,\
    \ temperature=1.0) -> float:\n     E = -log(sum(exp(logits/temperature))). Returns scalar.\n\
    \   - SemanticEnergyResult(energy, is_uncertain, should_verify, n_tokens_scored, inference_mode)\n\
    \   - SemanticEnergyScorer(threshold=2.0, temperature=1.0)\n   - SemanticEnergyScorer.score(response,\
    \ logits=None) -> SemanticEnergyResult:\n     None logits: CI-safe mode, deterministic hash\
    \ of response text. inference_mode='ci_synthetic'.\n     Logits provided: compute Boltzmann\
    \ energy over last-token logit vector. inference_mode='live_gpu'.\n   - SemanticEnergyScorer.benchmark(responses,\
    \ logits|None, correctness_labels) -> dict:\n     Compute AUROC, skip_rate, fn_rate.\n \
    \  - Test: high-variance logits -> higher energy than uniform logits\n   - Test: CI-safe\
    \ mode never raises\n5. Implement python/carnot/pipeline/semantic_energy_scorer.py.\n  \
    \ Verbose docstrings: WHY pre-softmax logits preserve information (arXiv 2508.14496), WHY\
    \ Boltzmann maps to uncertainty, HOW this complements Ising, hardware path.\n6. Export SemanticEnergyScorer,\
    \ SemanticEnergyResult, compute_boltzmann_energy from carnot.pipeline.__init__.\n7. Write\
    \ scripts/experiment_408_semantic_energy.py using ExperimentTemplate(408):\n   a. Call validate_and_clear\
    \ at top\n   b. CI-safe mode: 50 synthetic responses, score with simulated logits\n   c.\
    \ Compute mean_energy_correct vs mean_energy_wrong on synthetic data\n   d. Benchmark vs\
    \ SinkProbe: compare skip_rate and fn_rate\n   e. If CARNOT_FORCE_LIVE=1 and GPU available:\
