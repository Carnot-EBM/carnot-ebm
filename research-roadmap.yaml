      which apply per domain (the route to OOD generalization). The anti-leak trap: the router must NOT just read the
      domain label -- prove it with a LABEL-ABLATION arm. A held-out-DOMAIN win is the strongest, hardest selection
      result; a collapse is a genuine scope boundary (decision-grade, consistent with the domain-bound finding).

