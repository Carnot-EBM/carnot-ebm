  max_turns: 50
  inference_substrate: verifier_ensemble_against_cached_candidates
  deliverable: results/experiment_5002_moat_benchmark_harness.json
  operator_override: '2026-06-30 operator directive (PHASE D execution) + reserved-infra-slot discipline: a NEW shared
    benchmark harness for the verifier-moat program -- false-positive scope-match vs prior harness/scaffold infra
    tasks; structurally never a doomed rerun. Enables D1-D5 to be comparable + honest (headroom-control + oracle-
    distinctness baked in).'
  prompt: |
    CONTEXT ({date}). PHASE B1 reserved infra slot (enabling). The PHASE D arms (D1 LoRA-EBM, D2 uPRM, D3 EBRM, D4
    cross-corpus, D5 gate) must all measure the SAME thing the SAME way: oracle-distinct selection accuracy vs TUNED
    self-consistency on a headroom-present corpus, with a paired CI. Build the shared harness ONCE so each D arm is a
    thin verifier plugged into it -- and so the anti-traps (headroom-control, oracle-distinctness, FALSE_NEGATIVE_RISK)
    are enforced mechanically, not per-arm.

    WHAT TO BUILD (python/carnot/moat_benchmark_harness.py -- a library, not a one-off):
      1. A CORPUS LOADER returning {{question, narrative/context, choices, gold}} rows for: MuSR/murder_mysteries
         (TAUR-Lab/mu_sr, already used), GPQA (if cached), MMLU-Pro-hard, and MATH-500-hard. Gold is for EVAL ONLY.
      2. CANDIDATE-CACHE REUSE: load the cached MuSR candidates from
         results/distributional_energy_verifier_musr_checkpoints/ (the cheap-proxy run already generated K per
         question -- reuse them, do NOT regenerate; anti-churn). Provide a generate-with-logprobs path (gemma-4-12B-
         it-GGUF on GPU-0 CUDA) for corpora/arms that need fresh candidates or per-token logprobs (D2 uPRM).
      3. METRICS, computed uniformly for ANY verifier scorer f(candidate)->energy:
         - tuned_self_consistency: majority vote, with the SC temperature/K swept (report the TUNED-SC accuracy as the
           baseline to beat -- not naive SC).
         - oracle_at_k: the accuracy achievable if you could always pick a correct candidate when present in the K pool
           (the selectable-headroom ceiling).
         - headroom_present: (oracle_at_k - tuned_sc) >= 0.10 AND n_flips_possible > 0 (the FALSE_NEGATIVE_RISK guard:
           a null is only informative where headroom exists).
         - verifier selection accuracy + paired bootstrap CI95(verifier - tuned_sc) + McNemar p.
         - oracle_distinctness assertions: the scorer never reads gold/answer_index/answer_choice/model_id (raise if it does).
      4. A small SMOKE over a cached MuSR slice (n<=30) proving the harness wires SC + oracle@K + a trivial verifier
         end-to-end. This is the deliverable's evidence; the full benchmark is the D arms' job.

    EXISTING CODE TO READ FIRST:
      - {project_root}/scripts/experiments/exp_distributional_energy_verifier_musr.py (the cheap-proxy MuSR runner -- the loader, _match_choice, SC, candidate cache to reuse)
      - {project_root}/python/carnot/experiment_4922_distributional_energy_verifier_scaffold.py + experiment_4984_distributional_energy_verifier_turnkey.py (the turnkey scaffold; three-column SC/energy/oracle wiring)
      - {project_root}/results/distributional_energy_verifier_musr.json (the n=200 null: SC 0.56, energy 0.515-0.535, sc_saturated=False)
      - {project_root}/scripts/adversarial_verify.py (check_circular_moat_overclaim -- the oracle-distinctness contract to satisfy)

    CONCRETE STEPS:
      0. PRECONDITIONS: MuSR cached (`.venv/bin/python -c "from datasets import load_dataset; load_dataset('TAUR-Lab/MuSR')"` or the local cache) AND the cached candidate checkpoints exist. A missing corpus -> honest_verdict blocked_<resource>, write deliverable, EXIT.
      1. Build python/carnot/moat_benchmark_harness.py with the loader + cache-reuse + metrics above.
      2. Run the smoke (n<=30 cached MuSR slice): report tuned_sc, oracle_at_k, headroom_present, and a trivial-verifier delta + CI to prove the wiring.
      3. WRITE results/experiment_5002_moat_benchmark_harness.json + minimal own-test (test the metrics on a tiny synthetic fixture; --no-cov).

    FALSIFIABLE GATE: the harness loads >=1 headroom-present corpus, computes tuned_sc + oracle_at_k + a paired CI on
    the smoke slice, and the oracle-distinctness assertions fire on a gold-peeking scorer. A blocked corpus records
