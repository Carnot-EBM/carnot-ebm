    1. Read CLAUDE.md spec-first workflow.\n2. Call validate_and_clear at TOP.\n3. Add REQ-EXTRACT-024\
    \ (CRANEExtractionGate elicits structured claims via prompt suffix),\n   REQ-EXTRACT-025\
