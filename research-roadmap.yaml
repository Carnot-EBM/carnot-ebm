y in research-complete.yaml:\n     python3 -c \"data=open('{project_root}/research-complete.yaml').read(); print('found' if '2026.05.244' in data else 'not_found')\"\n     If not found: append entry:\n       ---\n       id: '2026.05.244'\n       completed: '2026-05-19'\n       milestone_title: 'IsingVerifier Fix + Phase 4 ARM-EBM v4 + Ensemble v7b (Group D) + arXiv LaTeX Fix + JEPA Pipeline Integration'\n       best_auroc: 0.9750\n       phase4_final_status: blocked_precondition\n       arxiv_ready: false\n       n_experiments_completed: 5\n       top_successes:\n         - LaTeX compile fixed (exp2536); abstract 522->205 words\n         - GateMate bitstream generated (exp2537); 514.67 MHz max F\n         - JEPA fast-path integrated into VerifyRepairPipeline (exp2539)\n       execution_gap: exp2530-exp2534 produced no artifacts\n  2. cp {project_root}/research-roadmap-next.yaml {project_root}/research-roadmap.yaml\n  3. Append to ops/changelog.md:\n     '## 2026-05-19 (Milestone 2026.05.245 activated)'\n     '- Archive .244: arxiv_ready=False; best_auroc=0.9750; gatemate=bitstream_ready; kv260=flash_pending'\n     '- .245 priorities: Phase 4 Option B (honest negative §4), ensemble v7b, arXiv submission, hardware flash'\n  4. Write deliverable artifact.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required (complete:/success:/passed:/shipped:). Conductor reconciler classifies terminal verdicts by this prefix.\"\n  - archive_ready:\n      principle: \"True only after .244 entry confirmed in research-complete.yaml. Guards against partial archive.\"\n  - milestone_archived:\n      principle: \"Records which milestone was archived (2026.05.244) for audit trail.\"\n  - execution_gap_diagnosis:\n      principle: \"Documents the root-cause hypothesis for why exp2530-exp2534 had no artifacts. Required for .245 process improvement.\"\n  - preconditions_checked:\n      principle: \"Records which preconditions were verified before launching.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"archive_ready == true\"\n    principle: \"Ensures research-complete.yaml records .244 outcomes before .245 begins.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2544-phase4-option-b-honest-negative
  title: 'Phase 1a: Phase 4 Option B — Expand §4 with Full Honest Negative Subsection'
  milestone: 2026.05.245
  deliverable: results/experiment_2544_phase4_option_b.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2540-paper-v6-phase4-update-citations
    verdict: 'complete: paper_updated=true; phase4_section_updated=true with blocked_precondition paragraph'
    addressed_by: "exp2540 added a blocked_precondition paragraph to §4.4 documenting that IsingVerifier was a stub. This task expands that paragraph into a FULL honest negative-result subsection following Option (b) from the .244 capstone/retro decision: four experiments cited (exp2486, exp2508, exp2519, exp2532-not-run), the theoretical hypothesis stated clearly, the honest finding documented per CLAUDE.md scientific rigor standards. retire_if_same_verdict=false: this is a paper editing task, not a research replication."
    retire_if_same_verdict: false
  prompt: "CONTEXT: The .244 capstone recommends Option (b) for Phase 4: accept Phase 4 as empirically unsupported and proceed to arXiv. This task expands the existing §4 blocked_precondition paragraph (added by exp2540) into a full honest negative-result subsection.\n\nOPERATOR DECISION: Option (b) adopted. Do NOT propose any further Phase 4 ARM-EBM validation experiments. Document the honest negative and move on.\n\nPAPER SECTION TARGET: docs/arxiv-paper/main.tex, section §4 (or §4.4 if subsection exists). Find the Phase 4 content and expand it.\n\nHONEST NEGATIVE TEMPLATE (insert/expand at the Phase 4 location):\n  'We attempted to empirically validate the Phase 4 free-energy bijection hypothesis across\n   four consecutive milestones. The hypothesis predicts that Carnot constraint-violation energy\n   (IsingVerifier) correlates with ARM-EBM token-level free energy (sum of negative log-probabilities)\n   at per-CoT-step granularity. Four structured attempts were made:\n   (1) exp2486 (milestone .240): pearsonr=0.108, p=0.28 — below the |r|>0.30 threshold.\n   (2) exp2508 (milestone .242): step_granularity_achieved=False (semantic_energy_fallback\n       proxy used instead of direct IsingVerifier; methodology gap).\n   (3) exp2519 (milestone .243): blocked_ising_verifier_not_available (IsingVerifier class\n       was a stub with no methods).\n   (4) exp2532 (milestone .244): not executed (IsingVerifier stub not implemented before\n       the experiment ran).\n   Phase 4 remains a theoretical hypothesis. The active-inference free-energy framing\n   (arXiv:2605.04065, arXiv:2512.15605, arXiv:2605.09515) provides strong theoretical\n   motivation, but empirical validation of the bijection at step-level granularity was\n   not achieved. Future work should investigate token-level logprob integration with\n   constraint-based energy computation using a fully-implemented IsingVerifier.'\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/docs/arxiv-paper/main.tex (find §4 or §4.4 Phase 4 content)\n  {project_root}/results/experiment_2540_paper_update.json (what §4 says now)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. ls {project_root}/docs/arxiv-paper/main.tex\n        If not found: write honest_verdict 'blocked_paper_not_found' and exit.\n  1. Read main.tex. Find the Phase 4 / free-energy bijection section (search for 'phase 4',\n     'bijection', 'freia', 'arm-ebm', 'free energy' case-insensitively).\n  2. Locate the blocked_precondition paragraph added by exp2540 (if present).\n  3. Replace or expand that paragraph with the honest negative template above.\n     Preserve all other §4 content. Do not remove any existing text that is not the\n     blocked_precondition paragraph.\n  4. Verify the section looks correct:\n     grep -A5 'phase 4\\|freia\\|bijection\\|arm-ebm' {project_root}/docs/arxiv-paper/main.tex -i | head -30\n  5. Set phase4_section_expanded=True.\n  6. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - phase4_section_expanded:\n      principle: \"True if main.tex §4 now contains the full honest negative subsection with all four experiment references. This is the gating signal for arXiv submission package (exp2553).\"\n  - phase4_honest_negative_documented:\n      principle: \"True if the honest negative documentation (4 attempts, all failed/blocked) is in main.tex. This satisfies the redefined gate-3: phase4_resolved = phase4_validated_any OR phase4_honest_negative_documented.\"\n  - experiments_cited:\n      principle: \"List of experiment IDs cited in §4 negative subsection — exp2486, exp2508, exp2519, exp2532 expected.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"phase4_honest_negative_documented == true\"\n    principle: \"Phase 4 Option B is complete when the honest negative is in main.tex. This satisfies the redefined gate-3 and unblocks arXiv submission.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2545-ising-verifier-implementation
  title: 'Phase 1b: IsingVerifier.energy(step_text) Implementation (verifier quality fix, not Phase 4 retry)'
  milestone: 2026.05.245
  deliverable: results/experiment_2545_ising_verifier_impl.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  prior_failures:
  - experiment_id: exp2531-ising-verifier-implementation
    verdict: 'no artifact produced (execution-layer gap: exp2531 was at position 2 of .244 and produced no artifact)'
    addressed_by: "exp2531 was placed at position 2 of the .244 milestone as a codex task and produced no artifact — consistent with the execution-layer gap hypothesis (complex code-writing task at front of milestone in 45 turns). This .245 attempt provides the EXACT implementation verbatim in the prompt (do not re-invent; copy the code from the prompt) to minimize agent reasoning overhead. retire_if_same_verdict=true: if this implementation attempt ALSO fails to produce an artifact or produce a working energy() method, the IsingVerifier fix is added to the exclusion manifest and we proceed without it."
    retire_if_same_verdict: true
  prompt: "CONTEXT: python/carnot/verify/semantic_energy.py contains `class IsingVerifier: pass` — a completely empty stub. This is a verifier quality issue: IsingVerifier should compute constraint-violation energy for text steps. This task writes the real implementation.\n\nNOTE: This is NOT a Phase 4 validation task. Phase 4 was retired per Option (b) in .244 capstone. This fixes the broken class for verifier-stack correctness.\n\nIMPLEMENTATION (copy verbatim — do not modify the logic, only adjust imports if needed):\n\n```python\nclass IsingVerifier:\n    \"\"\"Compute arithmetic constraint-violation energy for a text step.\n\n    Returns float in [0,1]: 0.0 = no violations detected, 1.0 = all claims violated.\n    Detects claims of the form 'A op B = C' (e.g. '47+28=76') and checks\n    whether C equals the computed result of A op B.\n    \"\"\"\n\n    def __init__(self):\n        import re\n        self._arith_re = re.compile(\n            r'(\\d+(?:\\.\\d+)?)\\s*([+\\-*/])\\s*(\\d+(?:\\.\\d+)?)'  # A op B\n            r'\\s*(?:=|equals|is)\\s*(\\d+(?:\\.\\d+)?)',           # = C\n            re.IGNORECASE\n        )\n\n    def energy(self, step_text: str) -> float:\n        violations, total = 0, 0\n        for m in self._arith_re.finditer(step_text):\n            a, op, b, c = float(m.group(1)), m.group(2), float(m.group(3)), float(m.group(4))\n            total += 1\n            try:\n                expected = {{'+': a + b, '-': a - b, '*': a * b,\n                            '/': a / b if b != 0 else float('inf')}}[op]\n            except (ZeroDivisionError, KeyError):\n                continue\n            if abs(expected - c) > 1e-6:\n                violations += 1\n        return violations / total if total > 0 else 0.0\n```\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py (find IsingVerifier class — insert implementation)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. python3 -c \"from carnot.verify.semantic_energy import SemanticEnergyDetector; print('import ok')\"\n        If fails: write honest_verdict 'blocked_carnot_import_failed' and exit.\n     b. python3 -c \"from carnot.verify.semantic_energy import IsingVerifier; iv=IsingVerifier(); print('methods:', [m for m in dir(iv) if not m.startswith('_')])\"\n        If methods list is non-empty (implementation already exists): read it and evaluate if it works.\n        If 'energy' is already callable and returns float: set ising_verifier_text_energy_implemented=True and exit.\n  1. Open python/carnot/verify/semantic_energy.py. Find `class IsingVerifier:` and replace\n     the entire class (including `pass` or any stub body) with the implementation above.\n     Use the Edit tool to make this change.\n  2. Verify:\n     python3 -c \"\nfrom carnot.verify.semantic_energy import IsingVerifier\niv = IsingVerifier()\nassert iv.energy('The sum 2+3=5') == 0.0, f'Expected 0.0 got {{iv.energy(chr(84)+chr(104)+chr(101)+chr(32)+chr(115)+chr(117)+chr(109)+chr(32)+chr(50)+chr(43)+chr(51)+chr(61)+chr(53))}}'\nassert iv.energy('The sum 2+3=6') == 1.0, f'Expected 1.0 got {{iv.energy(chr(84)+chr(104)+chr(101)+chr(32)+chr(115)+chr(117)+chr(109)+chr(32)+chr(50)+chr(43)+chr(51)+chr(61)+chr(54))}}'\nassert iv.energy('no arithmetic here') == 0.0\nprint('all tests passed')\n\"\n  3. Write a brief unit test in tests/ (if tests/ directory exists and tests use pytest):\n     test_ising_verifier.py with 3 assertions: valid arithmetic=0.0, invalid arithmetic=1.0, no arithmetic=0.0.\n  4. Set ising_verifier_text_energy_implemented=True if energy() callable and tests pass.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - ising_verifier_text_energy_implemented:\n      principle: \"True only if IsingVerifier().energy(str) returns float in [0,1] and discrimination test passes. Gate condition for downstream callers.\"\n  - energy_test_correct:\n      principle: \"True if energy('2+3=5')=0.0 AND energy('2+3=6')=1.0. Confirms non-trivial discrimination.\"\n  - implementation_method:\n      principle: \"'regex_arith_re' or 'manual_search' — documents what approach was used for audit trail.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified before launching.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"ising_verifier_text_energy_implemented == true AND energy_test_correct == true\"\n    principle: \"Both conditions required: importability AND non-trivial discrimination. An implementation that always returns 0.0 passes importability but fails the correctness gate.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

