  - id: exp1764-phase4-thermodynamic-vs-fast-slow-comparison
    title: "Exp 1764: Phase 4 thermodynamic metric vs Fast-Slow Variant comparison (decision artifact)"
    deliverable: results/experiment_1764_phase4_method_comparison.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures: []
    prompt: |
      CONTEXT: .183 exp1754/1755 explore a thermodynamic metric as an
      alternative Phase 4 measurement (separate from the Fast-Slow rescue
      path which is exp1761 in .184). After both paths produce artifacts,
      Carnot needs a decision artifact comparing them on the same
      substrate. This task lands that comparison + recommends which
      path Phase 4 should pursue downstream.

      FALSIFIABLE HYPOTHESIS: Either (a) the thermodynamic metric
      (exp1754/1755) shows substrate-size scaling that ensemble-output
      alpha couldn't, (b) the Fast-Slow Variant (exp1761) achieves the
      paper's 3x sample efficiency + 70% KL targets, or (c) neither path
      produces a clean Phase 4 measurement. The decision artifact reports
      which.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1754_phase4_thermodynamic_metric.json (if
          exists from .183)
        - results/experiment_1755_phase4_substrate_scaling_thermo.json
          (if exists from .183)
        - results/experiment_1761_fast_slow_variant.json (if exists from
          .184's earlier exp1761)
        - feedback_active_inference_phase4_committed memory entry

      TASK: Three-path comparison + Phase 4 program recommendation.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `test -f results/experiment_1761_fast_slow_variant.json` —
              else `blocked_fast_slow_artifact_not_ready_run_after_1761`.
           b. At least one of exp1754 or exp1755 artifact readable — else
              `blocked_thermodynamic_artifacts_missing`.
           Record preconditions_checked.
        1. Tabulate the 3 methods (ensemble-alpha-original, thermodynamic-
           metric, fast-slow-variant) on key metrics:
             - Substrate-size discriminability (Phase 4 hypothesis testable?)
             - Sample efficiency (vs FR-11 baseline if applicable)
             - KL drift from base
             - Practical implementation cost
        2. Score each method: pass/fail on each criterion.
        3. Issue decision artifact: which method becomes "Phase 4
           canonical metric" for .185+ planner.
        4. Append note to ops/known-issues.md MANDATORY entry "Phase 4
           Canonical Metric Decision (.184+ MANDATORY)" with the
           recommended method.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase4_method_comparison.v1"
        - experiment: 1764
        - run_date: ISO-8601 UTC
        - duration_s: > 30s
        - random_seed: 172464
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {methods_compared: ["ensemble_alpha_original",
          "thermodynamic_metric_v1", "fast_slow_variant_v1"],
          comparison_criteria: ["substrate_discriminability",
          "sample_efficiency", "kl_drift", "implementation_cost"]}
        - n_samples: 3 (methods compared)
        - n_samples_justification: "Comparison task; n is the method count."
        - method_scorecards: dict method -> dict criterion -> {pass: bool,
          rationale: str}
        - recommended_canonical_method: str
        - known_issues_entry_added: bool
        - acceptance_gate_passed: bool (all 3 methods scored + decision rendered)
        - acceptance_gate_criteria: "All 3 methods scored + canonical
          decision recommendation written + known-issues entry appended."
        - methodology_note: "If all 3 methods fail substrate-discriminability,
          Phase 4 program needs operator-level scope review — escalate
          via known-issues entry."
        - optimization_direction: "neither — decision artifact"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push to git. Do NOT modify
      scripts/research_conductor.py.

