- id: exp968-symbolic-kan-deploy-hf-publish
  milestone: 2026.04.75
  deliverable: results/experiment_968_symbolic_kan_deploy_hf_publish.json
  title: "Symbolic-KAN v2 Deploy + HuggingFace Publish (Retry of Exp 960)"
  prompt: |
    CONTEXT:
    Exp 960 (Symbolic-KAN Deploy + HF Publish) was blocked in .74 by missing prior_failures.
    Symbolic-KAN (Exp 948) achieved AUC=1.0 on 57 real FoVer violation pairs — the strongest
    discriminative result in project history. It has never been deployed to ThreeTierPipeline
    or published to HuggingFace. This retry provides complete prior_failures.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_948_symbolic_kan_v2.py (Symbolic-KAN model training/checkpoint)
    - results/experiment_948_*.json (confirm AUC=1.0 result, get model checkpoint path)
    - python/carnot/pipeline/verify_repair.py (ThreeTierPipeline Tier 3 registration point)

    TASK:
    Deploy Symbolic-KAN (Exp 948, AUC=1.0) to production and publish:
    1. Load Symbolic-KAN checkpoint from Exp 948 results
    2. Register as Tier 3 verifier in ThreeTierPipeline
    3. Write integration test: 5 real FoVer examples, AUC must be >= 0.90
    4. Push model + config + README to huggingface.co/Carnot-EBM/symbolic-kan-v2
       using huggingface_hub Python client
    5. Pin to IPFS: ipfs add -r symbolic_kan_v2_model/ (dual-distribution per CLAUDE.md rule 3)
    6. Record IPFS CID in model card and ops/changelog.md

    Model card must be emoji-free (CLAUDE.md no-emoji rule) and include:
    - AUC=1.0 on 57 real FoVer pairs provenance (Exp 948, milestone 2026.04.73)
    - Training set size and violation types covered
