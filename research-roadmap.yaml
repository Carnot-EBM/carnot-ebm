  - id: exp3268-sota-receipt-methodology-supplement-v1
    milestone: "2026.05.303"
    deliverable: "results/experiment_3268_sota_receipt_methodology_supplement_v1.json"
    title: "SOTA receipt methodology supplement v1"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 70
    track: "evidence"
    inference_substrate: "live_llm_inference"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3263-sota-gguf-receipt-v9
        verdict: "complete: sota_gguf_receipt_ready=true; adversarial flag DURATION_TOO_SHORT"
        addressed_by: "This task is not another CUDA recovery attempt. CUDA already recovered; the new work is a methodology supplement and longer-duration receipt floor so downstream repair gates do not rely on a too-short SOTA evidence row."
        retire_if_same_verdict: true
      - experiment_id: exp3250-sota-gguf-receipt-v8
        verdict: "gate_block / retired: sota_gguf_receipt_ready=false while CUDA was broken"
        addressed_by: "The broken-CUDA blocker was resolved in .302. This task starts from the successful .302 receipt and repairs the remaining methodology/duration weakness."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      .302 produced a SOTA GGUF receipt, but the artifact was flagged because duration_s was too short for a clean headline evidence row. Downstream v4 labels and repair work need a clean receipt methodology boundary.

      MODEL_SPECS
      - unsloth/gemma-4-26B-A4B-it-GGUF
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - scripts/experiment_template.py
      - results/experiment_3263_sota_gguf_receipt_v9.json
      - results/experiment_3262_llama_cpp_cuda_receipt_smoke_v4.json
      - ops/verifier_authenticity_audit_report.md

      TASK
      Produce a SOTA receipt methodology supplement. If at least one mandated GGUF is cached, run a longer live receipt with CUDA offload and duration >= 60 seconds. If only the .302 receipt can be used, write a complete but non-eligible supplement that explains the blocker precisely.

      CONCRETE STEPS
      1. Check nvidia-smi and selected Python CUDA before loading any model.
      2. Determine which mandated GGUFs are cached or immediately resolvable.
      3. Run a live CUDA/offload generation for each available mandated model, targeting duration >= 60 seconds total.
      4. Record model load, GPU memory, tokens, duration, and whether the row is clean enough for downstream gates.
      5. Emit clean_sota_receipt_eligible only if the evidence is live, local, offloaded, non-empty, and methodology-clean.

      REQUIRED ARTIFACT FIELDS:
      - sota_receipt_methodology_supplement_v1_ready: bool (principle: downstream tasks need a stable evidence contract)
      - clean_sota_receipt_eligible: bool (principle: gates live-label and clean-verifier work)
      - model_specs: dict (principle: mandated SOTA GGUFs must be named)
      - models_used: list (principle: distinguish cached models from missing models)
      - missing_model_specs: list (principle: absence must be explicit, not inferred)
      - preconditions_checked: list (principle: compute-bound work must fail fast)
      - gpu_mem_used_mib: int (principle: prove GPU offload rather than CPU fallback)
      - tokens_generated: int (principle: prove real inference occurred)
      - receipt_duration_floor_met: bool (principle: directly resolves the DURATION_TOO_SHORT flag)
      - methodology_findings: list (principle: separate evidence hygiene from model quality)
      - random_seed: int (principle: reproducibility)
      - reproducibility_checksum: str (principle: artifact integrity)
      - duration_s: float (principle: timing evidence for adversarial checks)
      - honest_verdict: str (principle: must start with complete:/success:/passed:/shipped:)
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

