         energy_values = [pipeline.verify(prompts[i], responses[i]) for i in range(5)]
         verifier_discriminative = (
           any(e > 0.0 for e in energy_values) and
           (max(energy_values) - min(energy_values)) > 0.01
         )
         Update stub with energy_values, verifier_discriminative.

      4. Adversarial self-check (MANDATORY):
