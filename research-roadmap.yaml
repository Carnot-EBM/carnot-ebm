milestone: "2026.05.307"
milestone_title: "Phase-3 Path De-Risking — the two existential link tests"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
milestone_provenance: "Pre-staged 2026-05-29 by outer-loop session (Opus 4.8) per CLAUDE.md Pre-Staged Roadmap Convention, on operator directive, to GUARANTEE the two existential Phase-3 link tests run next milestone rather than waiting for the overdue-priority forcing function. These two experiments (P0.1 energy-descent-vs-AR, P0.2 verifier-diversity-audit) were the conclusion of the 2026-05-29 architecture review: they test whether the Phase-1 foundation composes toward the Kona endgame. Their de-risking predecessors were queued at .82/.83 and .94-.97 and never run; the loop spent 200+ milestones re-measuring Phase 1 instead. This milestone deliberately preempts Phase-1 re-measurement. Full task specs + rationale in ops/known-issues.md 'PHASE-3 PATH DE-RISKING ROADMAP' and ops/north-star.md."

