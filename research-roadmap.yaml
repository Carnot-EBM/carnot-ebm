      (baseline: energy_all_zero=True, condition_A_fraction_correct=0.5333)
    - results/experiment_1077_fr11_alpha_t_sota_v4.json
      (SOTA model used: Qwen3.6-35B-A3B-GGUF, inference_mode=live_gpu)

    MODEL_SPECS = [
      {"name": "Qwen3.6-35B-A3B", "hf_id": "unsloth/Qwen3.6-35B-A3B-GGUF",
       "gpu": "dual", "loader": "llama.cpp"}
    ]

    TASK:

    PART 1 — GENERATE FRESH CORPUS (DualGPU required):
    1. Setup DualGPURunner (use both RTX 3090s for inference throughput)
    2. Run Qwen3.6-35B-A3B-GGUF on 200 GSM8K questions (first 200 from standard split)
    3. For each question: generate 2 candidate answers (temperature=0.7 and temperature=0.1)
    4. For each answer: compute raw energy scores from individual verifiers:
       - SemEnergy (from python.carnot.verify.semenergy_probe)
       - Z3MathVerifier (from python.carnot.verify.z3_math_verifier if exp1107 succeeded)
       - Fallback: use vericot_validator.py VeriCoT score (TP rate from exp1101 fix)
    5. Verify energy distribution is non-degenerate: assert energy scores are NOT all 0.0
       (if energy_all_zero: report honest negative and stop)

    PART 2 — RLVR CONDITION (energy selection):
    From the 200-question corpus:
    - Condition A (baseline): use all 400 answers, no filtering
    - Condition B (RLVR): select top-30th-percentile by energy score (highest energy = more
      violations = harder examples to get right). Use ONLY these high-energy examples for
      RLVR signal (they were wrong; teach model to avoid them).
    - Compute fraction_correct for both conditions on a held-out 50-question eval set.

    PART 3 — SSD CONDITION (low-energy selection):
    - Condition C (SSD): select top-30th-percentile LOWEST energy answers (most correct).
      These are the teacher signals for self-distillation.
    - Compare fraction_correct with baseline.

    Note: "training" here means selection/weighting of examples for next iteration —
    we are NOT fine-tuning the GGUF model weights (that would require HF fine-tuning loop).
    Instead, we are EVALUATING whether energy-based filtering improves the effective accuracy
    of the answer selection process. This is the legitimate test of RLVR+SSD filtering.

