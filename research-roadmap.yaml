  - id: exp2624
    milestone: "2026.05.251"
    deliverable: "results/experiment_2624_ttt_loop_prototype.json"
    title: "Verifier-Driven TTT Loop Prototype (FR-11 Tier 3 Closure)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 45
    track: self_learning
    continuous_self_learning_task: true

    prior_failures:
      - experiment_id: exp2617-jepa-real-data-eval
        verdict: "complete: JEPA online_update() evaluated on 50 FoVer examples; AUC improved"
        addressed_by: "exp2617 evaluated JEPA online_update() in isolation. This implements the FULL Verifier-Driven TTT loop per arXiv:2505.19475: verifier scores responses → select high-confidence examples → use as few-shot context → measure improvement. Different scope: not online_update() instrumentation but the SELECT → ADAPT → EVAL cycle."
        retire_if_same_verdict: false
      - experiment_id: exp2576-jepa-v3-online-integration
        verdict: "complete: JEPA v3 online integration; session-level update wired"
        addressed_by: "exp2576 (.247) wired online_update() into VerifyRepairPipeline. This tests TTT effectiveness using verifier-selected examples as few-shot context — a different intervention (context augmentation vs. weight update)."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      FR-11 Tier 3 (JEPA online_update) is wired and evaluated. But the Verifier-Driven TTT loop
      from arXiv:2505.19475 ("Continuous Self-Improvement via Verifier-Driven TTT") has not been
      prototyped. The paper shows: AUROC > 0.65 verifier quality is sufficient for the loop to
      improve model quality by 32% relative on held-out examples. Carnot's ensemble v9 exceeds
      this threshold by >0.25 — the TTT loop should be effective.

      The TTT loop prototype (no gradient fine-tuning required — in-context TTT per the paper):
      1. Run verifier ensemble on a set of (context, claim) pairs from FoVer
      2. Select top-N high-confidence CORRECT examples (high verifier confidence = low energy)
      3. Use those examples as few-shot context prefix for the next inference pass
      4. Measure improvement on held-out examples

      This CLOSES FR-11 at prototype fidelity. FR-11 "Autonomous Self-Learning Loop" Tier 3
      TTT integration is the last missing piece.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline.online_update())
      - python/carnot/pipeline/jepa_fast_path.py (JEPAFastPathPredictor)
      - results/experiment_2617_jepa_real_eval.json (online_update() evaluation baseline)
      - results/experiment_2622_ensemble_v9_adversarial_val.json (v9 AUROC for TTT selection)

      TASK: Implement and evaluate the Verifier-Driven TTT loop prototype.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         b. FoVer corpus discoverable: check {project_root}/data/fover_corpus.jsonl (n_lines >= 100).
         c. Ensemble v9 AUROC from exp2622 >= 0.65 (the paper's minimum threshold for TTT).
            Read results/experiment_2622_ensemble_v9_adversarial_val.json.
            If AUROC < 0.65: write honest_verdict blocked_verifier_auroc_below_ttt_threshold; exit.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus. Use 500 examples as the "unlabeled" pool the TTT loop
         selects from, and 50 separate examples as the held-out evaluation set.
         random_seed=42 for split.

      2. Implement the TTT selection step in python/carnot/pipeline/ttt_loop.py:
         class VerifierDrivenTTT:
           """Verifier-driven test-time training loop per arXiv:2505.19475.
           Selects high-confidence examples via verifier ensemble, uses them as
           few-shot context to improve model performance on held-out examples.
           No gradient update required — pure in-context few-shot selection."""

           def __init__(self, pipeline: VerifyRepairPipeline, n_select: int = 5,
                        confidence_threshold: float = 0.65):
             ...

           def select_high_confidence(self, pool: list) -> list:
             """Return top-n_select examples where verifier confidence is highest
             (= ensemble score farthest from 0.5 in the correct direction)."""
             ...

           def evaluate_with_context(self, held_out: list,
                                     selected_context: list) -> dict:
             """For each held_out example, prepend selected_context as few-shot
             examples, re-run pipeline, measure whether correct label is recovered."""
             ...

           def run_loop(self, pool: list, held_out: list) -> dict:
             """Full TTT loop: select → contextualize → evaluate."""
             ...

      3. Run the TTT loop:
         a. Baseline: evaluate pipeline on held_out WITHOUT TTT context (n=50 examples)
            Record baseline_auroc, baseline_accuracy.
         b. TTT: select top-5 from pool. Evaluate held_out WITH selected few-shot context.
            Record ttt_auroc, ttt_accuracy, n_selected_examples.
         c. Compute improvement: ttt_delta_auroc = ttt_auroc - baseline_auroc
            ttt_loop_ran = True if n_selected_examples >= 5

      4. Write results/experiment_2624_ttt_loop_prototype.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - ttt_loop_ran: bool — True iff n_selected_examples >= 5
        principle: "Gate for FR-11 Tier 3 closure: TTT loop must actually run, not just be wired."
      - n_selected_examples: int — examples selected by verifier for context
        principle: "N < 5 means TTT context is too thin for meaningful few-shot signal."
      - baseline_auroc: float — pipeline AUROC on held-out without TTT context
        principle: "Comparison baseline: TTT improvement is delta above this."
      - ttt_auroc: float — pipeline AUROC on held-out with TTT context
        principle: "Primary TTT outcome metric."
      - ttt_delta_auroc: float — ttt_auroc - baseline_auroc
        principle: "Positive = TTT helps; negative = TTT hurts; near-zero = neutral. All outcomes documented."
      - fr11_tier3_ttt_closed: bool — True iff ttt_loop_ran AND prototype implements select+adapt+eval cycle
        principle: "FR-11 completion gate: not just wired, but the full cycle demonstrated."
      - module_created: str — path to python/carnot/pipeline/ttt_loop.py
        principle: "Deliverable is code artifact not just result; path confirms it was written."
      - random_seed: 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Real evaluation on 50 held-out examples takes >= 1s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication record."

      Run: `python -c "import sys; sys.path.insert(0, '{project_root}/python'); from carnot.pipeline.ttt_loop import VerifierDrivenTTT; print('TTT module OK')"`.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2625
    milestone: "2026.05.251"
    deliverable: "results/experiment_2625_fjd_safety_v2.json"
    title: "FJD Safety Tier 0x v2: Logit-Temperature Scaling (arXiv:2509.14558)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: safety_verifier

    prior_failures:
      - experiment_id: exp2613-safety-corpus-verifier
        verdict: "complete or blocked_sklearn — safety corpus built with Shannon entropy features"
        addressed_by: "exp2613 used Shannon entropy as the safety signal (basic tokenization-based). This implements FJD logit-temperature scaling per arXiv:2509.14558 — a different technique that exploits temperature sensitivity of unsafe content distributions. Different feature engineering, different paper, different score computation."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Safety Tier 0x v1 (exp2613, .250) used Shannon entropy over claim token frequency distributions
      as the safety signal. Target was safety_auroc > 0.60. FJD v2 uses a different approach:
      "LLM Jailbreak Detection for (Almost) Free!" (arXiv:2509.14558) — logit-temperature scaling.

      Core insight of FJD: unsafe prompts produce logit distributions that are MORE sensitive to
      temperature scaling than safe prompts. Specifically: for a fixed prompt, compute the KL
      divergence between the model's output distribution at temperature T=1 and at T=0.5.
      KL(T=1 || T=0.5) is larger for unsafe content because unsafe distributions are more
      concentrated (lower entropy) and thus amplified more by temperature reduction.

      This can be APPROXIMATED without a live LLM using TF-IDF: the "logit temperature scaling"
      is proxied by comparing TF-IDF unigram distributions at different smoothing factors.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/tier0x_safety.py (or equivalent from exp2613)
      - results/experiment_2613_safety_corpus_verifier.json (v1 baseline)
      - results/experiment_2616_safety_ensemble_group_f.json (Group F integration)

      TASK: Implement Tier 0x v2 with FJD logit-temperature scaling proxy.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import sklearn; import numpy"` succeeds.
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. Read results/experiment_2613_safety_corpus_verifier.json to get:
            v1 safety_auroc baseline AND corpus path. If file absent: record baseline=0.0.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load the safety corpus from exp2613 (200 safe/unsafe pairs) or rebuild it:
         - 100 safe examples: neutral factual claims with high vocabulary diversity
         - 100 unsafe examples: jailbreak-style prompts with command verbs, imperative structure
         Label: 0 = safe, 1 = unsafe.

      2. Implement the FJD temperature proxy in python/carnot/verify/tier0x_safety_v2.py:
         class FJDSafetyVerifier:
           """FJD logit-temperature scaling proxy for safety detection.
           Unsafe content produces logit distributions more sensitive to temperature.
           Approximated via TF-IDF unigram distribution sensitivity to Laplace smoothing.
           Per arXiv:2509.14558."""

           def score(self, claim: str) -> float:
             """Return unsafe probability in [0,1].
             Compute TF-IDF unigram distribution sensitivity to smoothing factor alpha.
             High sensitivity (unsafe) = distribution changes dramatically with alpha."""
             tokens = claim.lower().split()
             freq = Counter(tokens)
             total = max(sum(freq.values()), 1)
             # Unigram dist at alpha=1 (unsmoothed): p_i = count_i / total
             p_unsmoothed = {w: c/total for w, c in freq.items()}
             # Unigram dist at alpha=0.5 (half-smoothed): p_i = (count_i + 0.5) / (total + 0.5*vocab)
             vocab = len(freq)
             p_smoothed = {w: (c + 0.5)/(total + 0.5*vocab) for w, c in freq.items()}
             # KL divergence: sum p_smooth * log(p_smooth / p_unsmooth)
             kl = sum(p_smoothed[w] * math.log(p_smoothed[w] / p_unsmoothed[w])
                      for w in freq)
             # Unsafe content has lower entropy → higher KL on smoothing
             return 1.0 / (1.0 + math.exp(-kl))

      3. Evaluate on the safety corpus:
         - Compute score(claim) for each example
         - Compute AUROC, AUPRC, F1 (threshold=0.5)
         - Compare to v1 Shannon entropy AUROC baseline

      4. Write updated Group F ensemble integration:
         If safety_auroc_v2 > v1_baseline: update tier0x path in ensemble config to use v2.
         safety_tier_b_v2_viable = (safety_auroc_v2 > 0.65)

      5. Write results/experiment_2625_fjd_safety_v2.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - safety_auroc_v2: float — FJD proxy AUROC on safety corpus
        principle: "Primary metric; must exceed v1 Shannon entropy baseline to justify Group F update."
      - safety_auroc_v1_baseline: float — v1 baseline from exp2613 or 0.0 if not found
        principle: "Comparison baseline; delta = v2 - v1 documents whether FJD proxy helps."
      - safety_auroc_delta: float — v2 minus v1
        principle: "Positive delta = FJD proxy improves over Shannon entropy; paper-v6 §7 update."
      - safety_tier_b_v2_viable: bool — True iff safety_auroc_v2 > 0.65
        principle: "Gate for Group F update: only update ensemble if v2 is meaningfully better."
      - n_safe: int — safe examples in corpus
        principle: "Statistical validity: N < 30 per class means AUROC confidence interval too wide."
      - n_unsafe: int — unsafe examples in corpus
        principle: "Same statistical validity requirement as n_safe."
      - random_seed: 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Real sklearn evaluation >= 0.1s; near-zero implies skipped evaluation."
