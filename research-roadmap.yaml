       artifact honest_verdict="blocked_yosys_synthesis_failed" and exit cleanly.
    4. Check for nextpnr tools:
       a. `which nextpnr-ice40` — check if iCE40 P&R available.
       b. `which nextpnr-xilinx` — check if Xilinx P&R available (experimental).
       c. pip install yowasp-nextpnr-ice40 — try Python wrapper for iCE40.
       d. Record: nextpnr_ice40_found (bool), nextpnr_xilinx_found (bool).
    5. If nextpnr_ice40_found OR yowasp-nextpnr-ice40 installed:
