      reasoning accuracy of EBT energy-descent generation vs the matched AR baseline AT EQUAL TOTAL
      INFERENCE FLOPS. The P0.1 lesson is LOAD-BEARING: energy descent runs N forward passes per prediction,
      so a matched-PARAMS win is just extra inference FLOPs. The comparison MUST be matched-COMPUTE -- give
      the AR baseline an equal-FLOP best-of-M budget. A win counts ONLY at equal total inference compute.
      live gpu task; PRINT A HEARTBEAT.
      EXISTING CODE TO READ FIRST: scripts/experiment_3727_matched_compute_eval_harness.py + its unit tests
      tests/python/test_matched_compute_eval_harness.py (the BUILT + TESTED instrument -- USE IT, do not
      reinvent FLOP accounting); results/experiment_3735_*.json (EBT checkpoint); results/experiment_3737_*.json
      (n_descent_steps); research-references.md (arXiv:2503.21878 fair best-of-N baseline construction).
      PRECONDITIONS (check BEFORE the comparison; if ANY missing -> blocked_<resource>, EXIT, no fabrication):
        a. CUDA available.
        b. EBT importable via importlib.util.find_spec.
        c. Trained EBT + matched AR checkpoints present (exp3734/3735 absolute paths). If absent ->
           blocked_no_trained_checkpoints (graceful, honest).
        d. The exp3727 harness importable + its unit tests pass (re-run them; if they fail ->
           blocked_harness_tests_failing).
