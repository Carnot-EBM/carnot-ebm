- id: exp579-live-50q-c
  milestone: 2026.04.44
  deliverable: results/experiment_579_live_data_c.json
  title: 'Exp 579: Live 50q Data Collection C — GSM8K 200-249 (Corpus Expansion)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: FOVER corpus\
    \ v2 has 132 pairs from GSM8K batches B (50-99) and a mixed set. Expanding the\
