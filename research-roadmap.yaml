             Use the MOST AVAILABLE of these approaches (check in order):
             (a) `from sentence_transformers import CrossEncoder; model = CrossEncoder('cross-encoder/nli-deberta-v3-small'); score = model.predict([[premise, hypothesis]])[0][1]`  # entailment=0, neutral=1, contradiction=2
