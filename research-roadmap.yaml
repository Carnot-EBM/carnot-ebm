      status, registry_precheck_and_hash, no_game_or_level_solve_claim, solve_registry_unchanged, game_source_access_count, offline_ground_truth_bfs_count, per_game_adapter_count, canonical_live_path_receipts, tuning_and_held_roster_manifest_and_disjointness, arm_objective_and_suffix_precommitment, shard_budgets_and_checkpoint_manifest, resume_and_terminal_partial_receipts, per_unit_rows, collision_rates_by_arm, legal_action_coverage_by_arm, held_next_state_reachability_by_arm, policy_influence_by_arm, action_cost_timeout_and_regression_results, paired_effects_and_uncertainty, aggregate_row_recomputation, attack_matrix, current_adversarial_findings, arc_objective_generalization_ready_score, protected_files_unchanged, blocked_reason, gate_check_summary, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=false. Recorded next-state transitions are post-action evaluation evidence, not a pre-action oracle. per_unit_rows must contain every held game, prefix, seed, and arm. field_principles must map every field and readiness condition. A blocked_* verdict requires gate_check_summary. Otherwise use a terminal success prefix. Never update ARC solve credit from this task.

