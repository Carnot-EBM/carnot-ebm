        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Three consecutive milestones (.259 exp2727 DURATION_TOO_SHORT, .260 exp2740 blocked_qwen_not_cached,
