- id: exp425-conductor-timeout-watchdog
  milestone: 2026.04.32
  deliverable: results/experiment_425_conductor_timeout.json
  title: 'Exp 425: Conductor timeout watchdog — RETRO-003 (17+ milestones deferred, non-negotiable Experiment 1)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-003 has been carried for 17+\
    \ consecutive milestones without implementation. Exp 219 ran 117 minutes; PID 3509070 ran 144+\
    \ minutes with GPU0 at 82C. A 45-minute hard cap per experiment would have freed GPU0 99 minutes\
    \ early. This is the LONGEST-STANDING unimplemented infrastructure item in the project and MUST\
    \ be Experiment 1 of every milestone until it ships.\n\nIMPORTANT: This is a CPU-only experiment.\
    \ It does NOT require GPU. It always completes and produces a result JSON.\n\nEXISTING CODE TO\
    \ READ FIRST:\n- scripts/experiment_template.py — ExperimentTemplate, setup_gpu() patterns\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST, before any import)\n\
    - python/carnot/pipeline/deliverable_validator.py — DeliverableContentValidator\n\
    - scripts/session_startup.sh — session env setup\n\
    - results/operational_retro_2026_04_31.json — RETRO-003 details and PID 3509070 analysis\n\
    \nTASK: Implement ExperimentTimeoutWatchdog.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-INFRA-023 (ExperimentTimeoutWatchdog kills experiment subprocess after configurable\n\
    \   timeout, writes partial result, exits with code 1), REQ-INFRA-024 (default timeout is\n\
    \   45 minutes, configurable via CARNOT_CONDUCTOR_TIMEOUT_MINUTES env var),\n\
    \   SCENARIO-INFRA-028/029/030 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write tests FIRST (100% coverage) for ALL of the following:\n\
    \   - ExperimentTimeoutResult dataclass with fields:\n\
    \     experiment_id: int\n\
    \     timeout_minutes: int\n\
    \     elapsed_minutes: float\n\
    \     timed_out: bool\n\
    \     partial_result_path: str | None\n\
    \   - ExperimentTimeoutWatchdog(experiment_id: int, timeout_minutes: int = 45,\n\
    \     result_path: str | None = None):\n\
    \     - start() -> None: starts background thread; sets _start_time\n\
    \     - stop() -> None: cancels the timer, marks completed normally\n\
    \     - is_active() -> bool: True if running and not timed out\n\
    \     - elapsed_minutes() -> float\n\
    \     - _on_timeout() -> None: private; writes partial result JSON, calls sys.exit(1)\n\
    \     - as_context_manager: __enter__ calls start(), __exit__ calls stop()\n\
    \   - get_timeout_minutes() -> int: reads CARNOT_CONDUCTOR_TIMEOUT_MINUTES (default 45)\n\
    \   - build_timeout_artifact(result: ExperimentTimeoutResult) -> dict:\n\
    \     schema='carnot.timeout_watchdog.v1'\n\
    \     honest_verdict: 'watchdog_implemented' (always, since this is the implementation exp)\n\
    \     estimated_savings_minutes_per_runaway: int (based on PID 3509070 case: 144-45=99)\n\
    \   - Test: watchdog fires after timeout_minutes (use very short timeout in tests: 0.01 min)\n\
    \   - Test: stop() before timeout means _on_timeout never fires\n\
    \   - Test: context manager pattern works\n\
    \   - Test: get_timeout_minutes reads env var correctly; defaults to 45\n\
    4. Implement python/carnot/pipeline/experiment_watchdog.py with all above.\n\
    \   Export ExperimentTimeoutWatchdog, ExperimentTimeoutResult, get_timeout_minutes,\n\
    \   build_timeout_artifact from carnot.pipeline.__init__.\n\
    \   Verbose docstrings: WHY 45 min (PID 3509070 ran 3.2x over budget), WHY background thread\n\
    \   (non-blocking, lets experiment run normally until timeout), WHY partial result write\n\
    \   (conductor can diagnose what completed before timeout), hardware path (no hardware needed —\n\
    \   pure OS threading).\n\
    5. Write scripts/experiment_425_conductor_timeout.py using ExperimentTemplate(425):\n\
    \   a. Call apply_env_autofix() FIRST (before any import)\n\
    \   b. ExperimentTemplate(425, 'Conductor Timeout Watchdog', 'results/experiment_425_conductor_timeout.json')\n\
    \   c. tmpl.setup()\n\
    \   d. Demonstrate the watchdog in action: start a watchdog with 2-minute timeout\n\
    \   e. Run a test workload (10 synthetic constraint checks, ~10s total)\n\
    \   f. Stop watchdog normally (workload completed before timeout)\n\
    \   g. Build artifact: schema='carnot.timeout_watchdog.v1'\n\
    \      retro_003_resolved=True (watchdog implemented)\n\
    \      timeout_minutes=45 (the production default)\n\
    \      demo_elapsed_minutes (actual test run time)\n\
    \      demo_timed_out=False (workload finished before timeout)\n\
    \      estimated_savings_minutes_per_runaway=99\n\
    \      honest_verdict='watchdog_implemented'\n\
    \   h. Output: results/experiment_425_conductor_timeout.json\n\
    6. Write tests/python/test_experiment_425_conductor_timeout.py (100% coverage).\n\
    7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    8. Reconcile: update ops/conductor-log.md (RETRO-003 CLOSED — watchdog implemented),\n\
    \   ops/status.md, ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp426-dual-gpu-fix-temp-guard
  milestone: 2026.04.32
  deliverable: results/experiment_426_dual_gpu_fix.json
  title: 'Exp 426: DualGPURunner GPU-1 scheduling fix + temperature guard (RETRO-025)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-025 (first opened in milestone\
    \ 2026.04.31): PID 3509070 held 1786MB on GPU1 at 0% utilization while GPU0 ran at 88% for 144+\
    \ minutes. DualGPURunner is not asserting that GPU1 actually computes. Additionally, GPU0 reached\
    \ 82C (within 1-3C of RTX 3090 throttle threshold at 83-85C). Two fixes needed:\n\
    1. DualGPURunner health check: assert GPU1 utilization > 0% within 60s of model load; fail fast\
    \   with RETRO log if GPU1 is allocating VRAM but doing zero compute.\n\
    2. Temperature guard in ExperimentTemplate.setup_gpu(): if any GPU > 80C at pre-warm, log WARNING\
    \   and reduce batch_size by 25% in returned metadata.\n\nIMPORTANT: This is a CPU-only / light\
    \ GPU experiment. It does NOT require running live inference. All checks are metadata-level.\n\n\
    EXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST)\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog (Exp 425, use it)\n\
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu() method\n\
    - python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu(), LiveGPUDiagnostic\n\
    - python/carnot/pipeline/gpu_monitor.py — DualGPUMonitor (Exp 326)\n\
    - results/operational_retro_2026_04_31.json — RETRO-025 details\n\
    \nTASK: Implement DualGPUHealthCheck and temperature guard.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-INFRA-025 (DualGPUHealthCheck: assert GPU1 util > 0% within 60s of model load),\n\
    \   REQ-INFRA-026 (ExperimentTemplate.setup_gpu() reduces batch size by 25% when any GPU > 80C),\n\
    \   SCENARIO-INFRA-031/032/033 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write tests FIRST (100% coverage) for:\n\
    \   - DualGPUHealthResult dataclass:\n\
    \     gpu0_util_pct: float\n\
    \     gpu1_util_pct: float\n\
    \     gpu0_temp_c: float\n\
    \     gpu1_temp_c: float\n\
    \     gpu1_is_zombie: bool  # True if vram>500MB AND util<1%\n\
    \     temperature_warning: bool  # True if any GPU > 80C\n\
    \     recommended_batch_size_factor: float  # 0.75 if temp_warning, 1.0 otherwise\n\
    \   - check_dual_gpu_health(timeout_seconds: int = 60) -> DualGPUHealthResult:\n\
    \     Uses pynvml or nvidia-smi subprocess (fallback to mock in CI).\n\
    \     CI-safe: returns mock DualGPUHealthResult when pynvml/nvidia-smi unavailable.\n\
    \   - build_gpu_fix_artifact(health: DualGPUHealthResult, prior_retro_path: str) -> dict:\n\
    \     schema='carnot.dual_gpu_fix.v1'\n\
    \     honest_verdict: 'zombie_detected' if gpu1_is_zombie else 'gpu1_healthy'\n\
    \     retro_025_status: 'zombie_confirmed' or 'zombie_cleared'\n\
    \   - Test: util=0, vram>500 → gpu1_is_zombie=True\n\
    \   - Test: any GPU temp > 80 → temperature_warning=True, batch_factor=0.75\n\
    \   - Test: CI mode (no nvidia-smi) → returns safe defaults, no exception\n\
    4. Implement python/carnot/pipeline/dual_gpu_health.py.\n\
    \   Export DualGPUHealthCheck, DualGPUHealthResult, check_dual_gpu_health,\n\
    \   build_gpu_fix_artifact from carnot.pipeline.__init__.\n\
    5. ADDITIVE: Modify ExperimentTemplate.setup_gpu() in scripts/experiment_template.py:\n\
    \   After pre-warm completes, call check_dual_gpu_health() and:\n\
    \   a. If gpu1_is_zombie: log WARNING 'GPU1 allocated but idle — DualGPURunner may not be\n\
    \      scheduling GPU1. Check model loading in dual-model experiments.'\n\
    \   b. If temperature_warning: log WARNING 'GPU temp > 80C — reducing batch_size by 25%'\n\
    \   c. Add 'dual_gpu_health' key to the returned dict from setup_gpu()\n\
    6. Write scripts/experiment_426_dual_gpu_fix.py using ExperimentTemplate(426):\n\
    \   a. Call apply_env_autofix() FIRST\n\
    \   b. Use ExperimentTimeoutWatchdog(426) as context manager\n\
    \   c. ExperimentTemplate(426, 'DualGPU Fix + Temp Guard', 'results/experiment_426_dual_gpu_fix.json')\n\
    \   d. Run check_dual_gpu_health()\n\
    \   e. Read results/operational_retro_2026_04_31.json for RETRO-025 details\n\
    \   f. Build artifact with honest_verdict, retro_025_status, temperature_warning\n\
    \   g. Output: results/experiment_426_dual_gpu_fix.json\n\
    7. Write tests/python/test_dual_gpu_health.py and test_experiment_426_dual_gpu_fix.py (100% coverage).\n\
    8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    9. Reconcile: update ops/conductor-log.md (RETRO-025 status), ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

