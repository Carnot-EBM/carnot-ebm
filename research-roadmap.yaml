    1. ATOMIC FIRST WRITE (see above — do this before any other step)
    2. ROCm GPU probe patch — add to scripts/experiment_template.py:
       def _detect_gpu_count_rocm_aware():
           import subprocess, torch
           cuda_count = torch.cuda.device_count()
           if cuda_count > 0:
