- id: exp576-coace-recall-boost
  milestone: 2026.04.44
  deliverable: results/experiment_576_coace_recall_boost.json
  title: 'Exp 576: CoACE Recall Boost v2 — Expand Arithmetic Pattern Coverage (RETRO-064)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-064 CRITICAL\
    \ — CoACEExtractor v1 (Exp 564) achieves only 5.9% recall on live incorrect IT-model\
    \ responses (Exp 569: 7 violations found in 50 questions, only 1/17 incorrect\
    \ responses flagged). At 5.9% recall, the expected accuracy lift from verify-repair\
    \ is near-zero regardless of repair quality. Root cause: CoACE v1 only matches\
    \ simple 'A op B = C' one-step equations. IT models write multi-step chains ('first\
    \ X = A+B, then Y = X*C, so total = Y+D = E'), percentage arithmetic ('20% of\
    \ 150 is 30'), and cumulative variable tracking. All miss the current extractor.\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/extraction/coace_extractor.py\
    \ — CoACEExtractor v1 (from Exp 564, READ FIRST to understand what to extend)\n\
    - python/carnot/extraction/__init__.py — exports to add CoACEExtractorV2\n- results/experiment_565_coace_live_diagnostic.json\
    \ — 25 known-incorrect responses (load per_question_results for test cases)\n\
    - results/experiment_554_extraction_diagnostic.json — fallback if 565 has no\
    \ per_question_results\n- python/carnot/extraction/extraction_diagnostic.py —\
    \ ExtractionDiagnosticResult, run_extractor_diagnostic()\n\nTASK: Implement CoACEExtractorV2\
    \ with 3 new extraction capabilities.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-EXTRACT-034 (CoACEV2: multi-step chain tracking), REQ-EXTRACT-035\
    \ (CoACEV2: prose percentage/ratio/word patterns), REQ-EXTRACT-036 (CoACEV2:\
    \ numeric context dictionary for cumulative tracking), SCENARIO-EXTRACT-065/066/067/068\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Create python/carnot/extraction/coace_extractor_v2.py:\n\
    \   a. Import CoACEExtractor, ArithmeticEquation, CoACEViolation, CoACEResult\
    \ from coace_extractor (v1 to reuse).\n   b. NumericContext dict: maps variable\
    \ name → computed float. Updated as equations execute.\n   c. _parse_prose_arithmetic(text:\
    \ str) -> list[ArithmeticEquation]:\n      Handle: 'N% of M is/equals/gives P'\
    \ → lhs='N/100*M', rhs=P.\n      Handle: 'X times Y' → lhs='X*Y'.\n      Handle:\
    \ 'P divided by Q' → lhs='P/Q'.\n      Handle: 'difference between P and Q'\
    \ → lhs='P-Q'.\n      Handle: 'sum of A, B, and C' → lhs='A+B+C'.\n      Handle:\
    \ 'total = A + B + C = D' (chained equality) → eval the full lhs, compare to\
    \ rightmost D.\n   d. _extract_chain_equations(text: str) -> list[ArithmeticEquation]:\n\
    \      Parse CoT sentences in order. Find 'let X = expr', 'X = expr', 'so X =\
    \ expr'. Build NumericContext mapping X → eval(expr). Detect when a later equation\
    \ uses X but states a different value for X. Yields one ArithmeticEquation per\
    \ chain-tracked violation.\n   e. CoACEExtractorV2 class:\n      - Inherits from\
    \ CoACEExtractor (reuse _parse_arithmetic_equations, _safe_eval, extract).\n \
    \     - Override extract(self, response: str) -> CoACEResult:\n          * Call\
    \ v1's _parse_arithmetic_equations(response) → v1 equations.\n          * Call\
    \ _parse_prose_arithmetic(response) → prose equations.\n          * Call _extract_chain_equations(response)\
    \ → chain equations.\n          * Deduplicate by (lhs_expr, rhs_value) pairs.\n\
    \          * Run all through _safe_eval + violation detection.\n          * Return\
    \ CoACEResult with combined violations.\n      - Export CoACEExtractorV2 from\
    \ carnot.extraction.__init__.\n4. Write scripts/experiment_576_coace_recall_boost.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. ExperimentTimeoutWatchdog(576, timeout_minutes=20).\n\
    \   c. ExperimentTemplate(576, 'CoACE Recall Boost V2',\n      'results/experiment_576_coace_recall_boost.json',\
    \ requires_gpu=False).\n   d. Load 25 known-incorrect responses from results/experiment_565_coace_live_diagnostic.json\
    \ (or Exp 554 fallback).\n   e. Run run_extractor_diagnostic(CoACEExtractorV2(),\
    \ labeled_responses) → v2_tp, v2_fp, v2_recall.\n   f. Run run_extractor_diagnostic(CoACEExtractor(),\
    \ labeled_responses) → v1_recall (baseline).\n   g. Compute recall_improvement\
    \ = v2_recall - v1_recall.\n   h. retro_064_partial: v2_recall >= 0.20.\n   i.\
    \ retro_064_resolved: v2_recall >= 0.30.\n   j. Build artifact: schema='carnot.coace_v2.v1',\n\
    \      n_responses=<int>,\n      v1_recall=<float>, v2_recall=<float>,\n      recall_improvement=<float>,\n\
    \      v2_tp_rate=<float>, v2_fp_rate=<float>,\n      retro_064_partial=<bool>,\n\
    \      retro_064_resolved=<bool>,\n      honest_verdict='recall_resolved' if v2_recall>=0.30\
    \ else 'recall_partial' if v2_recall>=0.20 else 'recall_no_improvement'.\n  \
    \ k. tmpl.assert_deliverable_written() as FINAL LINE.\n5. Write tests/python/test_coace_extractor_v2.py\
    \ (100% coverage on coace_extractor_v2.py):\n   a. Test _parse_prose_arithmetic\
    \ finds '20% of 150 is 30'.\n   b. Test _parse_prose_arithmetic finds '47 times\
    \ 3 is 142' (47*3=141, violation).\n   c. Test _extract_chain_equations detects\
    \ 'let X = 47+28 = 75, then Y = X+5 = 81' when stated X=75 but later uses X=76.\n\
    \   d. Test extract() combines v1 + prose + chain results.\n   e. Test 100% coverage\
    \ on coace_extractor_v2.py.\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\n7. Reconcile: _bmad/traceability.md, ops/conductor-log.md (RETRO-064),\
    \ ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp577-jepa-cpmi-pair-builder
  milestone: 2026.04.44
  deliverable: results/experiment_577_jepa_cpmi_pairs.json
  title: 'Exp 577: JEPA CPMI Contrastive Pair Builder — Hard-Negative Mining (arXiv 2604.10660,
    RETRO-063 Path)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-063 CRITICAL\
    \ — JEPA predictor AUC stuck at 0.4444 (anti-correlated) across three consecutive\
    \ retrains (v8: 0.444, v9: 0.4286, v10: 0.4444). The PURE min-form objective\
    \ (arXiv 2504.15275) was implemented in .43 but did not resolve the anti-correlation.\
    \ Root cause: all three retrains used variants of scalar loss on step-level labels\
    \ — the model hedges to P=0.5 because step-level labels are noisy (intermediate\
    \ steps in correct chains can briefly look wrong). Fix (CPMI, arXiv 2604.10660):\
    \ construct EXPLICIT contrastive pairs — (correct_chain, incorrect_chain) for\
    \ the SAME question — and train with a hinge margin loss that forces incorrect\
    \ chains to have strictly higher energy than correct chains. No BCE. No PURE.\
    \ Pure contrastive margin.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/inference/jepa_pure_loss.py\
    \ — PUREMinFormLoss (from Exp 566, to understand what we are REPLACING)\n- python/carnot/pipeline/fover_corpus.py\
    \ — FOVERCorpusEntry, merge_fover_sources() (from Exp 553)\n- results/fover_corpus_v2.json\
    \ — 132-pair corpus (check structure: question_id, is_correct, cot_steps)\n-\
    \ python/carnot/inference/jepa_predictor.py — JEPAPredictor architecture\n- results/experiment_567_jepa_v10_retrain.json\
    \ — context for v10 failure\n\nTASK: Implement CPMI contrastive pair builder for\
    \ JEPA training.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-LEARN-055\
    \ (JEPACPMIPairBuilder: hard-negative contrastive pair construction from FOVER\
    \ corpus, arXiv 2604.10660), REQ-LEARN-056 (contrastive hinge margin loss for\
    \ JEPA pairs), SCENARIO-LEARN-090/091/092 to autoresearch/spec.md.\n3. Create\
    \ python/carnot/inference/jepa_cpmi_pairs.py:\n   a. JEPACPMIPair dataclass: question_id\
    \ (str), correct_embeddings (list[jnp.ndarray]), incorrect_embeddings (list[jnp.ndarray]),\
    \ hard_negative_step_idx (int | None), pair_quality (float: 0-1).\n   b. CPMIContrastiveLoss\
    \ class:\n      - __init__(self, margin: float = 1.0, chain_energy_mode: str\
    \ = 'mean'). chain_energy_mode in ('mean','max','min').\n      - chain_energy(self,\
    \ model, embeddings: list[jnp.ndarray]) -> float:\n          If mode='mean': mean(model.score(e)\
    \ for e in embeddings).\n          If mode='max': max(model.score(e) for e in\
    \ embeddings).\n          If mode='min': min(model.score(e) for e in embeddings).\n\
    \      - compute_loss(self, model, pairs: list[JEPACPMIPair]) -> float:\n    \
    \      * For each pair: L_i = max(0, margin - (E(incorrect) - E(correct))).\n\
    \          * Return mean(L_i) over all pairs.\n      - zero_if_empty(self, pairs)\
    \ -> float: return 0.0 if not pairs.\n   c. JEPACPMIPairBuilder class:\n    \
    \  - __init__(self, embed_fn: callable, min_pairs: int = 5).\n      - build_pairs(fover_entries:\
    \ list[FOVERCorpusEntry]) -> list[JEPACPMIPair]:\n          * Group by question_id.\n\
    \          * For each group with >= 1 correct AND >= 1 incorrect: pick best correct\
    \ + hardest incorrect.\n          * Hardest incorrect = entry where is_correct=False\
    \ with most cot_steps (more steps = more misleading).\n          * Embed each\
    \ cot_step using embed_fn.\n          * pair_quality = len(cot_steps_correct)\
    \ / max(len(cot_steps_incorrect), 1).\n          * Yield JEPACPMIPair.\n     \
    \ - build_synthetic_pairs(n_pairs: int) -> list[JEPACPMIPair]:\n          * Generate\
    \ synthetic pairs: correct chain has accurate arithmetic, incorrect injects one\
    \ error.\n          * Used as fallback when n_real_pairs < min_pairs.\n   d. Export\
    \ JEPACPMIPairBuilder, JEPACPMIPair, CPMIContrastiveLoss from carnot.inference.__init__.\n\
    4. Write scripts/experiment_577_jepa_cpmi_pairs.py:\n   a. apply_env_autofix()\
    \ FIRST.\n   b. ExperimentTimeoutWatchdog(577, timeout_minutes=20).\n   c. ExperimentTemplate(577,\
    \ 'JEPA CPMI Pair Builder',\n      'results/experiment_577_jepa_cpmi_pairs.json',\
    \ requires_gpu=False).\n   d. Load 132-pair corpus from results/fover_corpus_v2.json.\n\
    \   e. Build pairs: builder = JEPACPMIPairBuilder(embed_fn=lambda x: jnp.array([hash(x)\
    \ % 128]), min_pairs=5).\n   f. real_pairs = builder.build_pairs(corpus).\n  \
    \ g. If len(real_pairs) < 5: augment with builder.build_synthetic_pairs(10).\n\
    \   h. Compute: n_real_pairs, n_synthetic_pairs, mean_pair_quality.\n   i. Validate\
    \ CPMIContrastiveLoss: loss = loss_fn.compute_loss(fresh_model, pairs). Assert\
    \ loss >= 0.\n   j. Build artifact: schema='carnot.jepa_cpmi_pairs.v1',\n   \
    \   n_real_pairs=<int>, n_synthetic_pairs=<int>,\n      total_pairs=<int>, mean_pair_quality=<float>,\n\
    \      loss_mode='contrastive_hinge_margin',\n      loss_fn_validated=True,\n\
    \      retro_063_path='jepa_v11_retrain (Exp 580)',\n      honest_verdict='pairs_built_sufficient'\
    \ if total_pairs>=10 else 'pairs_built_insufficient'.\n   k. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_jepa_cpmi_pairs.py (100% coverage\
    \ on jepa_cpmi_pairs.py):\n   a. Test build_pairs groups by question_id correctly.\n\
    \   b. Test hardest incorrect selection picks entry with most cot_steps.\n   c.\
    \ Test CPMIContrastiveLoss.compute_loss returns 0.0 when gap > margin.\n   d.\
    \ Test compute_loss returns > 0.0 when gap < margin.\n   e. Test build_synthetic_pairs\
    \ returns requested n_pairs.\n   f. 100% coverage.\n6. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n7. Reconcile: _bmad/traceability.md (new\
    \ REQ rows), ops/conductor-log.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp578-live-50q-a-v3
