- id: exp7260-source-contract
  title: V639 source ingestion and exact execution contract
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 20
  estimated_wall_time_min: 15
  per_unit_rows: true
  milestone: 2026.09.639
  deliverable: results/experiment_7260_v639_source_contract.json
  agent_type: codex
  model: gpt-5.6-sol
  prior_failures:
  - experiment_id: exp7246-source-map
    verdict: complete_disqualified_v638_plan_contract_incomplete_or_mismatched
    addressed_by: The planner rewrites and independently checks both V639 files before execution; the previous
      V636 design mismatch is removed.
    retire_if_same_verdict: true
  operator_override: '2026-05-29 operator directive (standing), CLAUDE.md: routine milestone transition or
    required hardware continuity; this new dated receipt does not reopen a failed science mechanism.'
  prompt: |
    CONTEXT:
    V638 completed its queue but Exp7246/7259 found a V636 design paired with V638 YAML. Read the new V639 research refresh, ingest its methods and independently bind this complete plan. This receipt is advisory and gates no science.

    Work at {project_root}. Execution date {date}. Milestone 2026.09.639, phase 1.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/research-references.md
    - {project_root}/research-complete.yaml
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_consumer_checks.py
    - {project_root}/results/experiment_7259_v638_capstone.json
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7260_v639_source_contract.json. Create scripts/experiments/experiment_7260_v639_source_contract.py as the thin runnable entrypoint and tests/python/test_experiment_7260_v639_source_contract.py for new behavior. Use a reusable module only where the work requires one. An absent or quarantined external prerequisite is terminal blocked with gate_check_summary, never partial. Partial means this task's own incomplete work can finish on retry.

    CONCRETE STEPS:
    1. Print and flush immediately. Authenticate listed inputs and writable output paths. Confirm the driving capability has REQ-*; spec first, meaningful failing tests, implementation, scoped verification, then reconciliation. Reuse shipped functions and keep the new entrypoint thin. New exp-numbered files below are outputs, not existing prerequisites. No scratch files in the repository root. Save provisional work under results/checkpoints/ and raw rows under results/raw/; never write a success-shaped artifact before measurement.
    2. Print and flush a progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation call, benchmark and subprocess that can take minutes. Emit completed-unit counts and monotonic elapsed time INSIDE long loops at least every 60 seconds. Stream unbuffered subprocess output; monitor blocking calls with a truthful external heartbeat, also during authoring and tests. Keep EVERY output gap below 600 seconds. Silence can kill at 1200s; continued progress permits the 4800s hard cap. Bound the work as well as the silence; never sleep to meet a floor.
    3. No LLM invocation: MODEL_SPECS=[], model_invoked=false, and zero current model/load/generation counters. Use inference_substrate=cpu_exact_solver_or_simulator and inference_substrate_class=cpu_exact_solver_or_simulator when executing CPU algorithms/tests. A read-only raw-artifact reducer uses inference_substrate=aggregation_from_upstream_artifacts and inference_substrate_class=aggregation. execution_venue=host. Historical model receipts and injected model fixtures belong in hashed sidecars. Never relabel real model work as CPU work.
    4. Select the YAML whose milestone is 2026.09.639: next YAML before activation, active YAML after activation. Independently parse Markdown and YAML IDs, order, titles, paths and gates. Require exactly 14 tasks exp7260 through exp7273. Wrong milestone or mismatch is disqualified; do not activate, truncate or repair the roster from inside this experiment.
    5. Read the 2026-09-13 research refresh and recheck at most four primary URLs for version deltas with 20s request timeouts. Record warm-start recognition, interactive acquisition, span-grounding and cost-accounting as implement/adapt/defer rows, including input needs, falsifying controls and retirement overlap. Do not turn a literature result into local evidence.
    6. Use shipped schema, prior-failure, exclusion, prompt-path and gate checkers. E2E: temporary copies of the exact plan plus miniature artifacts through the real gate evaluator; true, false, missing-field and missing-file controls must produce distinct observations. Verify both selected files agree before source_contract_complete_score=1.
    7. Run focused pytest on tests/python/test_experiment_7260_v639_source_contract.py and the explicitly named affected suites, scoped 100% coverage, Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on those exact test paths. Use -n 0 and private --basetemp where isolation matters. Do not run a bare pytest or the full repository suite in this task, even through an imported historical validation runner; record unrelated baseline failures separately. Run the E2E specified above, independent raw-row reduction, scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py on the measured terminal candidate. Validate a complete/null candidate under results/raw/, never a nonterminal checkpoint or provisional positive. Publish the atomic terminal artifact only after measurement; record failed validation honestly. Reconcile the driving OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve tests and old evidence; no skipped, weakened, deleted or reverted tests. No upload, submission, publication, production-default change or external message. Do not modify research-roadmap.yaml.

    8. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Version the result; retain ordinary top-level experiment_id and milestone."
       - status: principle: "Use complete or blocked only for terminal work; unfinished work stays in a separate checkpoint."
       - run_date: principle: "Use {date}, with actual UTC start/end timestamps, so dated evidence is auditable."
       - field_principles: principle: "Store explanations here; consumers read ordinary top-level values, not nested wrappers."
       - preconditions_checked: principle: "Retain observed input hashes, resource ownership and failures before expensive work."
       - MODEL_SPECS: principle: "Declare models executable in this invocation; keep historical model metadata in hashed sidecars."
       - model_invoked: principle: "Derive from actual calls; a parse failure does not erase a model invocation."
       - invocation_counts: principle: "Separate attempted/completed loads and generation calls from usable answers."
       - inference_substrate: principle: "Use an existing recognized literal that describes actual computation."
       - inference_substrate_class: principle: "Declare actual compute: full generation 60s, bounded generation 10s, load-only 2s; never pad time."
       - execution_venue: principle: "Use host for host orchestration; identify real boards separately in board rows."
       - duration_s: principle: "Measure monotonic invocation time and disjoint phase spans; do not invent elapsed time."
       - random_seed: principle: "Freeze independent-unit seeds before inspecting outcomes."
       - reproducibility_checksum: principle: "Bind code, input manifests, configuration and raw evidence to the result."
       - source_artifact_hashes: principle: "Authenticate exact inputs and preserve quarantine and retirement state."
       - rows: principle: "Retain each independent unit, arm, seed, metric, error, abstention and censoring state for recomputation."
       - sample_size_budget: principle: "Record planned, attempted, completed and censored units and the fixed stopping rule."
       - acceptance_gate_results: principle: "Each criterion retains expected, observed, passed and principle; completion is separate from value."
       - gate_check_summary: principle: "For blocked_* name the upstream, exact field/check, observed value and expected value."
       - verifier_is_oracle: principle: "Expose shared evaluator/verifier authority; exact conformance is not learned correctness."
       - honest_verdict: principle: "Use complete_* for terminal measurements, blocked_* for external absence, and explain the finding."
       - verdict_class: principle: "Exactly positive | circular_positive | null | blocked | disqualified | partial. Oracle=true forbids positive; failed scientific gates forbid positive. Only incomplete own work is partial; unchanged external blocks are blocked."
       - validation_receipts: principle: "Record actual command, exit code and log hash; preserve failures and never suppress checks."
       - source_contract_complete_score: principle: "One means all 14 contract rows and bounded source-disposition rows are recorded and agree."
       - contract_rows: principle: "One literal row per YAML task detects stale design, missing paths and changed gates."
       - source_rows: principle: "Version, access status and method-to-task mappings separate discovery from adoption."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7260_v639_source_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
