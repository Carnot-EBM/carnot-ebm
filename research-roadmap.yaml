    - experiment_id: exp5786-sota-hardness-controlled-constraint-stream
      verdict: 'complete: sota_constraint_response_stream_collected_not_ready:parser_failure_threshold'
      addressed_by: 'V592 constructs topology-disjoint exact-enumerable graph rows from frozen structured sources; it does not retry the failed model response stream.'
      retire_if_same_verdict: true
    - experiment_id: exp5913-transactional-constraint-memory-fixture
      verdict: 'blocked_gate_check_failed'
      addressed_by: 'This deliverable is an immutable graph and hard-negative fixture, not a transactional memory fixture, and has no upstream memory gate.'
      retire_if_same_verdict: true

- id: exp6787-group-aware-soft-fixed-point
  title: Group-aware soft fixed-point proposer
  track: phase3-bridge
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.08.592
  deliverable: results/experiment_6787_group_aware_soft_fixed_point.json
  gated_on:
    - upstream: exp6786-constraint-dependency-hard-negative-fixture
      artifact_field: constraint_group_fixture_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6786 supplies exact-enumerable constraint graphs with declarative local groups, cross-group
    dependencies, topology-disjoint splits, and hard negatives. AS2 shows how grouped declarative
    constraints can participate in a differentiable fixed-point operator. Carnot needs only a
    bounded proposal mechanism. The exact checker must remain outside the forward path, loss,
    stopping rule, and repair loop.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md, Phase 3 bridge and exact-authority rules
    - {project_root}/results/experiment_6786_constraint_dependency_hard_negative_fixture.json
    - {project_root}/python/carnot/verify/constraint.py
    - {project_root}/python/carnot/experiment_5304_kan_dynamic_abstraction_spotcheck_v484.py
    - {project_root}/python/carnot/phase3/
    - {project_root}/openspec/capabilities/verification/spec.md
    - Primary source arXiv:2603.18436

    TASK:
    Implement an AS2-inspired CPU soft fixed-point proposer over Exp6786 constraint groups. The
    operator must preserve graph and group identities, use only allowed proposal features, and emit
    candidate assignments plus convergence telemetry. This task establishes mechanism readiness,
    not superiority or correctness.

    CONCRETE STEPS:
    0. PRECONDITIONS: require constraint_group_fixture_ready=true, exact artifact hash agreement,
       nonempty train/development/held-topology splits, and a clean feature denylist check. On
       failure write complete_blocked_soft_fixed_point with gate_check_summary, then stop.
    1. Confirm or add narrow REQ-* anchors. Write tests for group serialization, parameter count,
       deterministic initialization, recurrent update, convergence cap, finite values, candidate
       decoding, split isolation, and oracle-feature refusal.
    2. Implement a small group-aware recurrent operator. Represent variable state separately from
       group and dependency messages. Use an explicit soft conjunction/disjunction or attention
       aggregation. Preserve one inspectable message receipt per group and iteration.
    3. Freeze five seeds, training steps, optimizer, learning rate, hidden width, iteration cap,
       convergence tolerance, decoding threshold, and candidate count before training.
    4. Fit on the train-topology split only. Do not use exact test labels, exact checker feedback,
       target assignments, solver conflicts, or future rows for early stopping or hyperparameters.
    5. Emit candidates for every development and held-topology unit. Record state residual,
       iterations, group messages, candidate hash, finite-value checks, stop reason, and runtime.
    6. Re-run one seed in a fresh process and require byte-stable candidate hashes. Run focused
       tests, lint, spec coverage, adversarial verification, and row-consistency lint.
    7. REQUIRED ARTIFACT FIELDS: field_principles (one-line purpose for every required field);
       inference_substrate (CPU PyTorch or NumPy soft fixed-point proposal, no LLM); duration_s;
       random_seed; reproducibility_checksum; source_artifact_hash; frozen_hyperparameters;
       trainable_parameter_count; feature_allowlist; feature_denylist; oracle_feature_violations;
       rows (one row per unit-seed with iteration and group-message receipts); convergence_by_split;
       finite_value_failures; deterministic_replay_agreement; candidate_hashes;
       soft_fixed_point_proposer_ready (exact field consumed by Exp6788); gate_check_summary (failed
       check and observed value for any blocked_* verdict); verifier_is_oracle (false);
       verdict_class (closed enum: positive | circular_positive | null | blocked | disqualified |
       partial); and honest_verdict (terminal result; MUST start with complete: / complete_ /
       success: / success_ / passed: / passed_ / shipped: / shipped_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6787_group_aware_soft_fixed_point.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp5490-csl-kan-fixed-point-update-ledger-v498
      verdict: 'blocked_gate_check_failed'
      addressed_by: 'The V592 mechanism is a bounded AS2-inspired CPU proposer over a completed exact graph fixture; it does not perform KAN continual updates or depend on the old gate chain.'
      retire_if_same_verdict: true

- id: exp6788-soft-fixed-point-structural-control-ab
  title: Group-aware fixed point versus parameter-matched flat control
  track: phase3-bridge
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.08.592
  deliverable: results/experiment_6788_soft_fixed_point_structural_control_ab.json
  gated_on:
    - upstream: exp6787-group-aware-soft-fixed-point
      artifact_field: soft_fixed_point_proposer_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6787 provides a group-aware soft fixed-point proposer with frozen seeds and candidate
    telemetry. The scientific question is whether declarative group topology adds held-topology
    value beyond capacity and recurrence. A flat recurrent control must receive the same legal
    features, trainable-parameter budget, optimization steps, seeds, candidate count, and wall-time
    envelope. The independent exact checker evaluates both arms after proposal.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6786_constraint_dependency_hard_negative_fixture.json
    - {project_root}/results/experiment_6787_group_aware_soft_fixed_point.json
    - {project_root}/python/carnot/verify/constraint.py
    - {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/scripts/adversarial_verify.py
    - Primary sources arXiv:2603.18436, arXiv:2608.26836, and arXiv:2608.26329

    TASK:
    Run a paired held-topology comparison between the grouped fixed-point proposer and a flat,
    non-structural recurrent control. Match capacity and compute. Report exact-valid candidates,
    cross-dependency violations, nearest-valid distance, convergence, support, and hard-negative
    discrimination for every unit and seed.

    CONCRETE STEPS:
    0. PRECONDITIONS: require soft_fixed_point_proposer_ready=true; validate source hashes, frozen
       splits, five seeds, and the legal feature contract; and require the planned row count to fit
       the CPU wall budget. On failure write complete_blocked_fixed_point_control_ab with
       gate_check_summary and no smaller fallback.
    1. Confirm or add narrow REQ-* anchors. Write tests for arm isolation, paired keys, parameter
       matching, update-count matching, seed rotation, exact-check separation, checkpoint/resume,
       confidence intervals, and row-to-headline consistency.
    2. Implement the flat control without group adjacency or dependency edges. Match trainable
       parameters within five percent. Give both arms the same flattened legal observations,
       optimization steps, candidate budget, seeds, and initialization schedule.
    3. Freeze all unit IDs and run both arms on every development and held-topology unit for five
       seeds. Use the Exp6785 durable checkpoint contract when available, with a local equivalent
       test if its artifact is blocked. Do not gate science on unrelated infrastructure success.
    4. Preserve raw candidate vectors, candidate hashes, residuals, group-message presence, stop
       reason, iteration count, parameters, timing, and exact post-proposal outcomes for each row.
    5. Derive paired exact-valid delta, cross-dependency violation delta, distance-to-valid delta,
       convergence, unique-valid support, hard-negative AUROC, and per-topology effects. Bootstrap
       over units inside topology families and then aggregate family effects.
    6. Set fixed_point_comparison_completed when every planned row is attributable and aggregates
       cold-recompute. Positive requires grouped-minus-flat exact-valid LCB>0, parameter and compute
       matching, no support contraction beyond the frozen margin, and no convergence harm. A null or
       negative complete comparison still sets the completion field true.
    7. Run focused tests, lint, spec coverage, adversarial verification, and row-consistency lint.
    8. REQUIRED ARTIFACT FIELDS: field_principles (one-line purpose for every required field);
       inference_substrate (paired CPU neural proposal with independent exact evaluation, no LLM);
       duration_s; random_seed; reproducibility_checksum; source_artifact_hashes; frozen_manifest;
       arm_definitions; parameter_counts_by_arm; optimization_steps_by_arm; candidate_budget_by_arm;
       rows (every unit-seed-arm cell); metrics_by_arm; metrics_by_topology; paired_exact_valid_delta;
       paired_exact_valid_delta_ci95; dependency_violation_delta; distance_to_valid_delta;
       hard_negative_auroc_by_arm; unique_valid_support_by_arm; support_contraction;
       fixed_point_comparison_completed (exact field consumed by Exp6789); gate_check_summary
       (failed check and observed value for any blocked_* verdict); verifier_is_oracle (false because
       exact authority evaluates only after proposal); verdict_class (closed enum: positive |
       circular_positive | null | blocked | disqualified | partial); and honest_verdict (terminal
       result; MUST start with complete: / complete_ / success: / success_ / passed: / passed_ /
       shipped: / shipped_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6788_soft_fixed_point_structural_control_ab.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp5490-csl-kan-fixed-point-update-ledger-v498
      verdict: 'blocked_gate_check_failed'
      addressed_by: 'The completed Exp6787 AS2-style proposer and exact held-topology fixture replace the missing KAN update-ledger chain; this task uses a parameter-matched non-structural control.'
      retire_if_same_verdict: true

- id: exp6789-soft-fixed-point-cold-authority-audit
  title: Cold fixed-point authority and shortcut audit
  track: adversarial-verification
  priority: high
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.08.592
  deliverable: results/experiment_6789_soft_fixed_point_cold_authority_audit.json
  gated_on:
    - upstream: exp6788-soft-fixed-point-structural-control-ab
      artifact_field: fixed_point_comparison_completed
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6788 completes the grouped-versus-flat comparison regardless of effect sign. A soft residual,
    topology identifier, or accidental exact-label feature can manufacture a plausible result. The
    audit must recompute every headline from rows in a fresh process and apply destructive controls
    that distinguish useful group structure from row identity, label leakage, and optimization
    noise. It may confirm, downgrade, or disqualify the source verdict.

    Work at {project_root}. The execution date is {date}.

