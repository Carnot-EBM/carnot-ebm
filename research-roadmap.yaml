       d. Initialize IsingConstraintInjector(embedding_dim=384, n_spins=64).
       e. Create a test IsingEBM (n_spins=64) with random coupling matrix J.
       f. Build 10 test response texts — 5 with arithmetic carry errors, 5 without.
       g. For each response: retrieve constraints, compute energy WITH and WITHOUT injection.
          Record energy_delta_pct for each.
       h. Key test: energy_with_constraint > energy_without for error responses.
       i. honest_verdict:
          - "injection_works" if mean energy_delta_pct > 0 for error responses
          - "injection_no_delta" if delta <= 0 (constraint not affecting energy)
          - "injection_negative_delta" if energy actually decreases (sign error)
    6. Write tests/python/test_experiment_812_ising_constraint_injection.py with 100% coverage:
       - test project_to_spin_bias shapes output as (n_spins,)
       - test inject_into_coupling_matrix adds bias to diagonal of J
       - test compute_energy_with_injection returns scalar energy
       - test verify() with injector+store is ADDITIVE (no change when both are None)
       Each test traces to REQ-VERIFY-095/096.
    7. Reconcile:
