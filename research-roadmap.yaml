- id: exp526-env-autofix-retro053-fix
  milestone: 2026.04.40
  deliverable: results/experiment_526_env_autofix_retro053_fix.json
  title: 'Exp 526: env_autofix CARNOT_FORCE_LIVE=''0'' Fix — RETRO-053 root cause'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-053 is\
    \ the single remaining programmatic gate before live benchmarks execute. For seven\
    \ consecutive milestones (.33-.39) RETRO-033 (live 100q benchmark) missed. Exp\
    \ 524 retro identified the root cause: apply_env_autofix() checks for PRESENCE\
    \ of CARNOT_FORCE_LIVE (carnot_force_live_was_set=True) and skips injection even\
    \ when the value is '0'. The live experiment gates check truthiness — '0' is\
    \ falsy — so Exp 514 deferred immediately with final_env_value='0'. Fix: when\
    \ gpu_detected=True, treat CARNOT_FORCE_LIVE values of None, '', '0', 'false',\
    \ 'False' as equivalent to not-set, and inject '1'.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — EnvironmentAutoFix, apply_env_autofix()\
    \ (the function to fix)\n- tests/python/test_env_autofix.py — existing tests (must\
    \ remain 100% pass)\n- results/experiment_524_retro_2026_04_39.json — retro (see\
    \ env_autofix section and retro_033_new_blocker)\n- results/experiment_513_jit_vram_check.json\
    \ — JITVRAMCheck result (RETRO-051 closed)\n- scripts/experiment_template.py —\
    \ ExperimentTemplate\n- ops/known-issues.md — RETRO-053\n\nTASK: Fix apply_env_autofix()\
    \ to override CARNOT_FORCE_LIVE='0' when GPU is detected.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-INFRA-058 (apply_env_autofix overrides CARNOT_FORCE_LIVE falsy values\
    \ ['0','false','False',''] when gpu_detected=True), REQ-INFRA-059 (EnvironmentAutoFix\
    \ gains field 'override_applied: bool' tracking when a non-None falsy value was\
    \ overridden), SCENARIO-INFRA-067/068/069 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. In python/carnot/pipeline/env_autofix.py:\n\
    \   a. Add 'FALSY_OVERRIDE_VALUES = (None, \"\", \"0\", \"false\", \"False\")'.\n\
    \   b. In apply_env_autofix(), replace the condition that checks presence:\n\
    \      OLD: if not os.environ.get('CARNOT_FORCE_LIVE') and gpu_detected:\n\
    \      NEW: current_val = os.environ.get('CARNOT_FORCE_LIVE')\n\
    \           if gpu_detected and current_val in FALSY_OVERRIDE_VALUES:\n\
    \               os.environ['CARNOT_FORCE_LIVE'] = '1'\n\
    \               override_applied = (current_val is not None)  # True when overriding existing val\n\
    \   c. Add override_applied field to EnvironmentAutoFix dataclass.\n\
    \   d. Update build_env_autofix_artifact() to include override_applied in the artifact.\n\
    \   e. Update honest_verdict: add 'falsy_override_applied' as a new verdict when\n\
    \      carnot_force_live_was_set=True AND override_applied=True (i.e., value '0'\n\
    \      existed and was overridden to '1').\n\
    4. Update tests/python/test_env_autofix.py:\n\
    \   a. Add test: CARNOT_FORCE_LIVE='0' with gpu_detected=True → auto_fix_applied=True,\n\
    \      override_applied=True, final_env_value='1', honest_verdict='falsy_override_applied'.\n\
    \   b. Add test: CARNOT_FORCE_LIVE='false' with gpu_detected=True → same.\n\
    \   c. Add test: CARNOT_FORCE_LIVE='1' with gpu_detected=True → auto_fix_applied=False,\n\
    \      override_applied=False, honest_verdict='gpu_confirmed_live' (no change).\n\
    \   d. Add test: CARNOT_FORCE_LIVE=None with gpu_detected=True → auto_fix_applied=True,\n\
    \      override_applied=False (was not set), honest_verdict='auto_fix_applied'.\n\
    \   e. Ensure all existing tests still pass.\n\
    5. Write scripts/experiment_526_env_autofix_retro053_fix.py:\n\
    \   a. apply_env_autofix() FIRST (with the fixed version)\n\
    \   b. ExperimentTimeoutWatchdog(526, timeout_minutes=15)\n\
    \   c. ExperimentTemplate(526, 'env_autofix RETRO-053 Fix',\n\
    \      'results/experiment_526_env_autofix_retro053_fix.json', requires_gpu=False)\n\
    \   d. DeliverableGuard('results/experiment_526_env_autofix_retro053_fix.json')\n\
    \   e. Simulate the .39 failure scenario:\n\
    \      - Set os.environ['CARNOT_FORCE_LIVE'] = '0'\n\
    \      - Call apply_env_autofix() with mock gpu_detected=True\n\
    \      - Assert final_env_value == '1' and override_applied == True\n\
    \   f. Verify all four edge cases from the test plan above.\n\
    \   g. Build artifact: schema='carnot.env_autofix_fix.v1'\n\
    \      retro_053_resolved=True\n\
    \      override_applied_verified=True\n\
    \      honest_verdict='retro_053_closed'\n\
    \   h. Call tmpl.assert_deliverable_written() as FINAL LINE.\n\
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    7. Reconcile: ops/conductor-log.md (RETRO-053 CLOSED), ops/known-issues.md,\n\
    \  ops/status.md, ops/changelog.md, _bmad/traceability.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

