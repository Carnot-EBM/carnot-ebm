  - id: exp4616-a1
    milestone: 2026.06.426
    title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY; HEADLINE -- DISAMBIGUATE THE OFFLINE->LIVE
      BRIDGE) -- a controlled three-arm experiment isolating WHY a 0.725-LOO-AUROC discriminator / a 7.6x-offline
      SpatialValueNet Q-head REGRESSES the live depth-first explorer: (1) COMPUTE-COST (value-per-frontier-node
      slows bounded-time search -> fewer nodes -> fewer solves), (2) DISTRIBUTION-SHIFT (trained on winning-path,
      applied to off-path frontier states -> ~chance where it matters), (3) CALIBRATION (a ranking is not a usable
      A* cost). Each arm has a matched control (bare BFS + the value head as-is). Deliverable: the BINDING cause +
      the indicated fix, traceable (per-arm node-count, off-path AUROC, rank->cost calibration error).
      verifier_is_oracle: false. retire_if_same_verdict.'
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4616_offline_live_bridge_disambiguation.json
    operator_override: '2026-06-23 outer-loop re-diagnosis (commit 4b7782d41, docs/research-notes/arc-representation-not-the-bottleneck-2026-06-23.md):
      the explicit next step is to disambiguate compute-cost vs distribution-shift vs calibration as the cause the
      0.725 value head regresses the live search. NEW-scope mandatory-priority pickup (GAP-OFFLINE-LIVE-BRIDGE). The
      forward difference vs the prior bridge work is ISOLATION of the binding cause (bridge_v1/v2 plumbed + observed
      the failure but never isolated which of the three causes binds). Not a doomed rerun.'
    prior_failures:
      - experiment_id: arc_offline_to_live_bridge_v2
        verdict: 'complete_bridge_plumbed_v2_unlocks_cn04_offline_best_first_but_does_not_transfer_to_live_depth_first_explorer'
        addressed_by: 'bridge_v1/v2 PLUMBED the offline->live flywheel end-to-end and OBSERVED that the value head
          unlocks offline best-first but does NOT transfer to the live depth-first explorer -- but they never
          ISOLATED which of the three candidate causes (compute-cost / distribution-shift / calibration) binds.
          This task is a controlled three-arm DIAGNOSTIC that isolates the cause with matched controls + traceable
          per-arm evidence (node-count, off-path AUROC, rank->cost calibration error). If the diagnostic again
          fails to isolate a single binding cause (all three null / inseparable), the disambiguation-by-arm approach
          is retired and the bridge residual is logged as a verifier gap for a different attack.'
        retire_if_same_verdict: true
    prompt: |
      CONTEXT ({date}, ARC sprint HEADLINE -- the offline->live bridge is THE binding constraint). The decisive
      finding (outer-loop, 2026-06-23): the ARC representation is NOT the bottleneck (cross_game_features_v3
      LOO-AUROC 0.725, CI [0.649,0.806] -- not the 0.503 the .425 analysis cited). "Add more features" is NOT the
