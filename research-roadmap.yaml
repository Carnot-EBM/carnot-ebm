        addressed_by: "This transition uses the shipped exact-deliverable classifier, current roadmap schema and exclusion checks, and records every command result before declaring V539 activation-ready."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 2026.08.538 is terminal. Its capstone preserved partial runtime readiness, clean and flagged ARC A/Bs, safe deterministic self-learning, a blocked sampler A/B, and a gate-skipped executable-code chain. Archive that mixed truth before any V539 implementation. The architecture document is stale by the repository's 30-day rule; record that fact without rewriting architecture in this transition task.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
      - {project_root}/results/experiment_6224_v538_adversarial_capstone.json
      - {project_root}/results/operational_retro_2026_08_538.json
      - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md, and {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/audit_roadmap_gates.py, {project_root}/scripts/exclusion_manifest_lint.py, and {project_root}/scripts/summarize_artifact.py

      TASK
      Create an exact V538-to-V539 handoff. Classify every V538 task by its declared deliverable and current adversarial rules. Verify the V539 IDs, dependencies, prior-failure blocks, gates, model policy, task count, prompt endings, and protected-file rules. Do not activate the staged roadmap, edit research-roadmap.yaml, or reconcile stale architecture here.

      Required deliverable: {project_root}/results/experiment_6225_v539_terminal_transition.json.
      REQUIRED ARTIFACT FIELDS: status, v538_milestone_and_roadmap_hash, v538_task_terminal_matrix, v538_capstone_path_hash_and_summary, operational_retro_path_hash_and_summary, blocked_skipped_partial_flagged_and_ready_counts, research_complete_duplicate_record_note, v539_roadmap_path_and_hash, v539_task_ids_and_deliverables, task_count, phase_counts, dependency_validation, gated_on_validation, prior_failure_validation, retired_dependency_count, id_collision_count, model_policy_validation, prompt_contract_validation, architecture_staleness_receipt, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. Each load-bearing field must have a field_principles entry. retired_dependency_count and id_collision_count must be bare 0.

      CONCRETE STEPS
      0. PRECONDITIONS: verify the working tree, declared inputs, staged roadmap identity, and protected files; write preconditions_checked before any mutation.
      1. Add REQ-INFRA-6225 and scenarios to openspec/capabilities/research-harnesses/spec.md before implementation and trace focused tests.
      2. Read V538 artifacts with scripts/summarize_artifact.py before copying any conclusion. Preserve current-rule flags and all historical corrigenda.
      3. Validate exactly 14 V539 tasks in Exp6225-Exp6238 order. Reject duplicate IDs, retired dependencies, missing deliverables, malformed gates, and incomplete prior_failures entries.
      4. Verify every LLM task names a mandated GGUF and every ARC task carries the live-path provenance contract.
      5. Record research-complete.yaml duplicate milestones as an input caveat. Do not deduplicate or rewrite that file in this task.
      6. Add focused tests for exact-identity classification, fail-closed missing artifacts, collisions, and protected-file hashes.
      7. Run schema, gate, exclusion, prompt-ending, root-clutter, and applicable non-mutating e2e checks. Adversarial-verify the artifact.

      Run command: .venv/bin/python -m carnot.experiment_6225_v539_terminal_transition --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

