      guarantees headroom AT THE GREEDY LEVEL: keep a problem iff its GREEDY (temp-0) answer is WRONG
      but at least one of k>=16 sampled candidates is CORRECT. By construction the greedy/mode answer
      is wrong and a recoverable correct answer exists among the candidates, so oracle > greedy and
      (in the regime where SC tracks greedy) oracle > SC. k is DOUBLED (>=16 vs exp3530's >=8) so
      minority-correct answers actually surface. References: MoB arXiv:2511.18630, ranked-voting SC
      arXiv:2505.10772 (a stronger SC to beat), ThinkPRM arXiv:2504.16828, self-certainty BoN
      arXiv:2502.18581.

