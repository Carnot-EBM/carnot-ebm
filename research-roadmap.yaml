        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. LLM-42 / verified speculation suggests replay/fingerprint discipline for deterministic inference. This task is a small preflight, not a repair benchmark, and it must not claim pass-rate improvement.

      MODEL_SPECS
      Headline SOTA local GGUF candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Use at least one of these for any live LLM generation. Legacy small models are allowed only as legacy_smoke_only=true CPU smoke tests and cannot satisfy fingerprint_live_ready.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - python/carnot/inference/sota_models.py
      - results/experiment_3028_sota_repair_clean_methodology_rerun_v2.json
      - results/experiment_3041_matrix_capstone_adversarial_flag_hygiene_v1.json
      - research-references.md

      TASK
      Implement or run a minimal transcript fingerprint preflight for one mandated local SOTA GGUF. Record deterministic replay metadata that future repair experiments can require.

      CONCRETE STEPS
      0. PRECONDITIONS: record CUDA availability, GPU free memory, repo commit, Python environment, GGUF cache resolution, model path, model checksum feasibility, seed, batch size, decoding parameters, and wall-clock duration. If no mandated GGUF can load, write blocked_sota_gguf_unavailable and stop.
      1. Use cached_sota_pair() or the repository's SOTA loader pattern; do not hardcode legacy tiny models as headline.
      2. Run a tiny fixed prompt set, preferably 3 repair-style prompts from existing artifacts or static local fixtures.
      3. Generate deterministic replay metadata: prompt_hash, model_hash_or_cache_path, decode_config, seed, raw_output_hash, normalized_output_hash, and batch_context_hash.
      4. Re-run the same prompt/config at least once and report whether hashes match. If the runtime is nondeterministic, record the divergence rather than hiding it.
      5. Write the artifact with no performance or repair promotion claim.

      REQUIRED ARTIFACT FIELDS:
