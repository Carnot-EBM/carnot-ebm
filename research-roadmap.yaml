  - id: exp5733-sota-finite-choice-proposal-channel
    milestone: "2026.07.512"
    title: "Qualify a finite-choice proposal channel across the mandated SOTA GGUF families"
    priority: critical
    track: verification
    deliverable: results/experiment_5733_sota_finite_choice_proposal_channel.json
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 360
    prior_failures:
      - experiment_id: exp5719-sota-answer-channel-forensics
        verdict: "blocked: no_qualified_protocol,fewer_than_two_qualified_models,positive_control_parse_rate_below_one,cuda_offload_unauthenticated"
        addressed_by: "This removes free-form generation entirely: preregistered candidates map to unique one-token labels, next-token scores select only a proposal, and an independent exact validator remains the sole authority."
        retire_if_same_verdict: true
      - experiment_id: exp5708-sota-exact-constraint-canary
        verdict: "blocked: parse_failures"
        addressed_by: "No answer envelope is parsed or repaired; sealed finite candidate sets and model-specific tokenizer receipts replace the failed completion protocol on disjoint controls."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Two consecutive milestones failed at free-form answer parsing even though the required GGUF files were present. Generative Compilation motivates validator feedback at the partial-artifact boundary. This task tests a materially different interface: the model scores a sealed set of one-token labels that refer to preregistered candidate answers; exact validators alone decide truth. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/python/carnot/model_cache.py
      - {project_root}/results/experiment_5708_sota_exact_constraint_canary.json
      - {project_root}/results/experiment_5719_sota_answer_channel_forensics.json
      - {project_root}/python/carnot/verifiers
      - {project_root}/openspec/capabilities
      - {project_root}/tests/python

      TASK:
      Build and qualify a sealed finite-choice GGUF proposal channel on disjoint exact controls, and emit results/experiment_5733_sota_finite_choice_proposal_channel.json.

      CONCRETE STEPS:
      1. Add/extend the relevant OpenSpec capability with REQ-* before implementation. Declare `MODEL_SPECS` for `unsloth/Qwen3.6-35B-A3B-GGUF`, `unsloth/gemma-4-31B-it-GGUF`, and `unsloth/gemma-4-26B-A4B-it-GGUF`. Resolve cached immutable `.gguf` files; never use transformers for GGUF loading or tokenization.
      2. Precondition-check file hashes, quantizations, llama.cpp build, CUDA device visibility, positive layer offload, before/during/after GPU memory, free VRAM, and model-specific `vocab_only=True` tokenizer load. CPU runs are smoke-only and cannot qualify.
      3. Build at least 30 positive exact controls and 12 negative controls across finite-state reachability, finite-domain arithmetic, SAT/CSP, hard/soft preference, candidate omission, duplicate candidates, invalid labels, tokenizer collisions, and non-finite scores. No science rows from Exp5734 may appear.
      4. For every model/control, enumerate the complete bounded answer domain with an exact generator, create plausible hard distractors, randomly permute candidate-to-label mappings under sealed seeds, and require every label to tokenize to one unique token in that model's tokenizer. Do not leak which candidate is exact through ordering, label frequency, whitespace, token length, or prompt wording.
      5. Run one next-token scoring step and preserve the full candidate-label score vector. The argmax label selects a proposal only. Do not use free-form completion, a `FINAL:` parser, JSON/GBNF grammar, XGrammar, llguidance, an external scorer, an LLM judge, or a token/logit threshold as semantic authority.
      6. Run independent exact validators over selected candidates and double-check a stratified sample with enumeration. Set `verifier_is_oracle=true`; any validator disagreement, incomplete domain, label collision, missing/non-finite score, or provenance break blocks qualification.
      7. Qualify the channel only if all required controls have complete receipts, at least Qwen3.6-35B-A3B and Gemma-4-31B qualify, CUDA offload is authenticated, receipt_failure_count=0, and no retired runtime ran. Model accuracy is descriptive and not a verifier promotion gate.
      8. REQUIRED ARTIFACT FIELDS: `field_principles` with a principle for every field; `preconditions_checked`; `MODEL_SPECS`; `resolved_model_receipts`; `model_hashes`; `gguf_filenames`; `quantizations`; `llama_cpp_version`; `llama_cpp_build_info`; `cuda_device_receipts`; `n_gpu_layers_offloaded`; `gpu_memory_receipts`; `cuda_offload_authenticated`; `control_manifest`; `candidate_domain_receipts`; `label_token_receipts`; `label_permutation_hashes`; `score_vector_manifest_path`; `non_finite_score_count`; `label_collision_count`; `candidate_omission_count`; `receipt_failure_count`; `validator_versions`; `validator_disagreement_count`; `verifier_is_oracle=true`; `qualified_model_ids`; `qualified_flagship_model_count`; `proposal_channel_ready_score`; `freeform_generation_used=false`; `grammar_runtime_used=false`; `external_scorer_used=false`; `token_scores_are_semantic_authority=false`; `inference_substrate=local_llama_cpp_python_cuda_gguf_finite_choice_proposals`; `random_seeds`; `reproducibility_checksum`; `honest_verdict`.
      REQUIRED GATE SCALAR: `cuda_offload_authenticated_score` is 1.0 only when both flagship families have positive offload and memory-delta receipts; otherwise 0.0.
      9. Run model, tokenizer, CUDA, candidate-completeness, leakage, exact-validator, independent-validator, schema, adversarial, spec-coverage, and root-clutter tests. Release every model and GPU allocation on all paths.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5734-sota-exact-proposal-stream
    milestone: "2026.07.512"
    title: "Gated on Exp5733 readiness: build a sealed exact-attested SOTA proposal stream"
    priority: critical
    track: continuous-learning
    deliverable: results/experiment_5734_sota_exact_proposal_stream.json
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 420
    prior_failures:
      - experiment_id: exp5720-sota-attested-exact-envelope-canary
        verdict: "blocked_gate_check_failed"
        addressed_by: "This consumes a newly qualified finite-choice channel rather than the failed free-form envelope protocol and seals candidate, label, score, and exact-validator receipts for every row."
        retire_if_same_verdict: true
      - experiment_id: exp5708-sota-exact-constraint-canary
        verdict: "blocked: parse_failures"
        addressed_by: "The new stream has no model-authored answer syntax to parse; selection is a sealed candidate ID and exact validators mint all admitted labels."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp5733-sota-finite-choice-proposal-channel
        artifact_field: proposal_channel_ready_score
        op: ">="
        value: 1.0
        principle: "Science rows are inadmissible until the disjoint finite-choice interface passes every control receipt."
      - upstream: exp5733-sota-finite-choice-proposal-channel
        artifact_field: qualified_flagship_model_count
        op: ">="
        value: 2
        principle: "The headline stream requires both flagship model families."
      - upstream: exp5733-sota-finite-choice-proposal-channel
        artifact_field: cuda_offload_authenticated_score
        op: ">="
        value: 1.0
        principle: "CPU fallback cannot support the mandated local-SOTA stream claim."
      - upstream: exp5733-sota-finite-choice-proposal-channel
        artifact_field: receipt_failure_count
        op: "=="
        value: 0
        principle: "Every candidate, label, score, and validator control receipt must be complete."
    prompt: |
      CONTEXT:
      Exp5733 must qualify a finite-choice proposal interface on disjoint controls. This task uses that frozen interface to create a chronological SOTA-proposal stream. The GGUF only chooses a candidate; exact validators remain the sole label authority. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/results/experiment_5733_sota_finite_choice_proposal_channel.json
      - {project_root}/python/carnot/model_cache.py
      - {project_root}/python/carnot/verifiers
      - {project_root}/openspec/capabilities
      - {project_root}/tests/python

      TASK:
      Generate a sealed chronological exact-constraint stream from flagship GGUF finite-choice proposals, and emit results/experiment_5734_sota_exact_proposal_stream.json.

      CONCRETE STEPS:
      1. Enforce every structured gate and verify the Exp5733 artifact, channel hash, tokenizer receipts, and model hashes. Add/extend REQ-* before implementation.
      2. Declare `MODEL_SPECS` with `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF`. Resolve immutable local `.gguf` files and run through llama.cpp only; legacy small models are optional CPU smoke tests and cannot enter headline rows.
      3. Preregister and seal at least 96 balanced chronological rows across finite-state, finite-domain arithmetic, SAT/CSP, hard/soft preference, contradiction, abstention, and shortcut-trap families. Balance families and model assignments before inference.
      4. For every row, seal the complete candidate domain, adversarial distractors, model-specific one-token label permutation, prompt, seed, model hash, and expected exact-validator version before scoring. Use only the frozen Exp5733 interface.
      5. Preserve full candidate-label score vectors and selected proposal IDs. Independent deterministic FSM/arithmetic/SAT-or-MaxSAT validators mint the admitted label and exact conflict receipts. Set `verifier_is_oracle=true`; never treat score magnitude, margin, or proposal identity as truth.
      6. Double-check a stratified sample with independent enumeration. Any missing row, incomplete domain, non-finite score, label collision, validator disagreement, or attestation/provenance break blocks the stream; do not impute or repair.
      7. Commit row order before learner access. Seal a prospective prefix and untouched suffix with row/model/family strata, candidate/label/score/proposal/validator hashes, split hashes, and stream-root commitment.
      8. Set `sota_proposal_stream_ready_score=1.0` only when both models have authenticated CUDA, every row and receipt exists, all commitments verify, disagreement is zero, and no retired runtime/external scorer ran.
      9. REQUIRED ARTIFACT FIELDS: `field_principles` with a principle for every field; `preconditions_checked`; `MODEL_SPECS`; `resolved_model_receipts`; `model_hashes`; `gguf_filenames`; `quantizations`; `llama_cpp_runtime_receipt`; `cuda_device_receipts`; `n_gpu_layers_offloaded`; `gpu_memory_receipts`; `cuda_offload_authenticated`; `qualified_channel_hash`; `preregistered_panel`; `family_counts`; `model_family_counts`; `row_manifest_path`; `candidate_domain_hashes`; `label_permutation_hashes`; `score_vector_hashes`; `proposal_ids`; `exact_validator_versions`; `conflict_receipts`; `missing_row_count`; `non_finite_score_count`; `label_collision_count`; `validator_disagreement_count`; `verifier_is_oracle=true`; `prospective_prefix_hash`; `sealed_suffix_hash`; `stream_root_commitment`; `headline_model_count=2`; `sota_proposal_stream_ready_score`; `model_weight_mutation=false`; `freeform_generation_used=false`; `grammar_runtime_used=false`; `external_scorer_used=false`; `token_scores_are_semantic_authority=false`; `inference_substrate=local_llama_cpp_python_cuda_gguf_exact_proposal_stream`; `random_seeds`; `reproducibility_checksum`; `honest_verdict`.
      10. Run gate, model, CUDA, candidate/label, exact/conflict/independent-validator, commitment, schema, adversarial, spec-coverage, and root-clutter tests. Release GPU resources on every path.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5735-zero-gate-kan-continuous-self-learning
    milestone: "2026.07.512"
    title: "Run non-cascading zero-gated KAN continuous self-learning on the promoted exact stream"
    priority: critical
    track: continuous-learning
    deliverable: results/experiment_5735_zero_gate_kan_continuous_self_learning.json
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 300
    continuous_self_learning_task: true
    prior_failures:
      - experiment_id: exp5721-fr11-memops-lifecycle-shadow-stream
        verdict: "missing: no honest_verdict artifact; V511 capstone status=missing after the upstream exact-stream gate skip"
        addressed_by: "This task is independent of every SOTA-stream gate, uses the promoted Exp5616 exact stream, and adds function-preserving zero-gated KAN residual growth rather than replaying the missing lifecycle task."
        retire_if_same_verdict: true
      - experiment_id: exp5709-fr11-prospective-shadow-stream
        verdict: "blocked_gate_check_failed"
        addressed_by: "The retired parse-failed prospective stream is not reused; this consumes an existing sealed exact nonstationary stream with deterministic labels and a new zero-gate capacity mechanism."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      This is the milestone's mandatory continuous self-learning experiment and must run independently of Exp5733/Exp5734. Exp5616 provides a promoted exact nonstationary stream; Exp5628 provides the active-spline conformal KAN controller; Exp5639 provides anytime-valid audit machinery. Gate-Zero Growth motivates exact function preservation at capacity insertion, and SMC-ES motivates an explicit probabilistic release certificate. GGUF weights are not involved. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/python/carnot/experiment_5616_exact_nonstationary_constraint_stream.py
      - {project_root}/results/experiment_5616_exact_nonstationary_constraint_stream.json
      - {project_root}/python/carnot/experiment_5628_conformal_active_spline_kan_csl.py
      - {project_root}/results/experiment_5628_conformal_active_spline_kan_csl.json
      - {project_root}/python/carnot/experiment_5639_anytime_valid_csl_independent_audit.py
      - {project_root}/results/experiment_5639_anytime_valid_csl_independent_audit.json
      - {project_root}/python/carnot/verify
      - {project_root}/openspec/capabilities
      - {project_root}/tests/python

      TASK:
      Add and evaluate function-preserving zero-gated residual spline growth in the KAN constraint sidecar, and emit results/experiment_5735_zero_gate_kan_continuous_self_learning.json.

      CONCRETE STEPS:
      1. Add/extend OpenSpec REQ-* before implementation. Precondition-check upstream hashes, sealed chronological order, exact labels, random seeds, CPU/RAM/disk, and the absence of any production-default or GGUF-weight mutation.
      2. Add a minimal zero-gated residual spline component to the existing active-spline controller. At insertion the gate is exactly zero; prove output equivalence on the full protected prefix by bitwise equality where deterministic and a preregistered strict tolerance elsewhere.
      3. Process the committed stream once in chronological order. Record every pre-label prediction, exact label receipt, update decision, gate state, parameter/state hash, and post-update protected-prefix check. Never tune split/order after outcomes.
      4. Compare zero-gated growth with no-growth active spline, always-open residual, parameter-matched MLP residual, frozen controller, and corrupted-order controls under identical streams/seeds. The MLP control is a sidecar only.
      5. Preregister epsilon, delta, old-prefix retention margin, minimum new-suffix improvement, maximum parameter/memory growth, maximum update latency, and unsafe-update definition. Use N>=30 independent stream/seed sessions for percentage-point claims.
      6. Reject or roll back any gate opening that violates exact constraints or the protected-prefix certificate. Model weights and production defaults remain unchanged.
      7. Set `zero_gate_csl_ready_score=1.0` only if insertion equivalence passes, new-suffix improvement is positive, old-prefix retention stays within margin, unsafe_update_count=0, statistical certificate passes, and all checkpoints replay exactly.
