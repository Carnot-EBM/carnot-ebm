- id: exp2374-kancl-hard-domains
  title: 'Phase 5: KAN-CL Hard Domain Adversarial Stress Test — Non-Trivially-Separable + EWC Baseline'
  milestone: 2026.05.231
  deliverable: results/experiment_2374_kancl_hard_domains.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2356-kancl-n256-v9
    verdict: 'complete: kancl_n256_validated=true, forgetting_reduction_pct=100.0 (IMPLAUSIBLE_PERFECT on 3 trivially-separable tasks)'
    addressed_by: "exp2356 used 3 artificially-separable domains where KAN splines trivially
      partition the feature space (disjoint Gaussian clusters with no overlap). forgetting_reduction_pct=100.0
      is expected on zero-overlap domains — it proves the implementation is correct but
      does NOT prove it handles catastrophic forgetting in realistic settings. exp2374
      uses non-trivially-separable domains with overlapping feature distributions where
      catastrophic forgetting is a genuine risk. Different experimental design: harder
      tasks, EWC baseline comparison, realistic forgetting expected."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: exp2356 showed KAN-CL (Kolmogorov-Arnold Network Continual Learning) achieves
    100% forgetting reduction on 3 trivially-separable tasks. This IMPLAUSIBLE_PERFECT result
    is expected on zero-overlap domains but is not paper-worthy. exp2374 evaluates KAN-CL
    on HARD domains with overlapping feature distributions where catastrophic forgetting is
    a genuine challenge.

    KAN-CL uses B-spline basis functions (KAN: Kolmogorov-Arnold Networks) for continual
    learning, where the spline weights provide natural regularization that reduces forgetting.

    Adversarial requirement: expect forgetting_reduction_pct < 100% on hard domains.
    EWC (Elastic Weight Consolidation) is the standard continual learning baseline.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/models/kan.py (KAN implementation)
      {project_root}/python/carnot/ (look for continual learning modules)
      {project_root}/results/experiment_2356_kancl_n256.json (exp2356: trivial baseline)

    TASK: Evaluate KAN-CL on 3 hard non-trivially-separable domains with EWC comparison.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Verify KAN module importable:
            .venv/bin/python -c "from carnot.models.kan import KAN; print('OK')" 2>/dev/null || \
            .venv/bin/python -c "import carnot; print(dir(carnot))"
            Note: if KAN is not importable, implement a minimal KAN-CL stub locally.
         b. Verify numpy and sklearn available:
            .venv/bin/python -c "import numpy, sklearn; print('OK')"
         c. CPU-only confirmed.

      1. Create 3 HARD continual learning domains with overlapping feature distributions:
         Domain A: XOR-style feature interaction (class 0: x1*x2 > 0, class 1: x1*x2 < 0)
           → 500 samples per class, normally distributed features with overlap
         Domain B: Rotated boundary (same distribution, 45-degree rotated decision boundary)
           → 500 samples per class, substantial feature overlap with Domain A
         Domain C: Frequency-shifted sinusoidal pattern
           → 500 samples, non-linearly separable from A and B
         Overlap target: inter-domain feature correlation > 0.3 (verifiable via Pearson r)

      2. Train KAN-CL sequentially: Domain A → Domain B → Domain C.
         After each domain, measure forgetting on ALL prior domains.
         Record: accuracy_A_after_B, accuracy_A_after_C, accuracy_B_after_C.
         Compute:
           - forgetting_reduction_pct: how much KAN-CL reduces forgetting vs naive SGD baseline
           - Note: expect < 100% on hard domains (realistic target)

      3. Train EWC (Elastic Weight Consolidation) on same domains:
         Use standard EWC with Fisher Information diagonal estimate.
         Compute same forgetting metrics for EWC.

      4. Compute:
         - kancl_vs_ewc_forgetting_delta: KAN-CL forgetting_pct - EWC forgetting_pct
           (negative = KAN-CL is better)
         - kancl_hard_forgetting_reduction_pct: primary adversarial metric

      5. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with realistic forgetting_reduction_pct."
      - kancl_hard_validated:
          principle: "True if KAN-CL trained and evaluated on all 3 hard domains."
      - kancl_hard_forgetting_reduction_pct:
          principle: "Primary adversarial metric. Should be < 100% on overlapping domains."
      - kancl_vs_ewc_forgetting_delta:
          principle: "KAN-CL vs EWC comparison. Core paper-v6 claim requires this."
      - inter_domain_feature_correlation:
          principle: "Validates that domains are genuinely hard (overlap > 0.3)."
      - n_domains:
          principle: "Must be 3."
      - n_samples_per_domain:
          principle: "Must be >= 500 per class per domain for statistical validity."
      - random_seed:
          principle: "Reproducibility. Must be 42."
      - duration_s:
          principle: "Guards against fabrication."

    ACCEPTANCE GATES:
      - condition: "kancl_hard_validated == true"
        principle: "KAN-CL must train and evaluate on all hard domains."
      - condition: "inter_domain_feature_correlation > 0.3"
        principle: "Validates adversarial test design — domains must actually overlap."
      - condition: "kancl_hard_forgetting_reduction_pct < 100.0"
        principle: "Core adversarial requirement: realistic result, not IMPLAUSIBLE_PERFECT."

    Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

- id: exp2375-fr11-fst-real-csl
  title: 'Phase 5: FR-11 FST Real-Data Cross-Domain Retention (MANDATORY CSL) — Real GGUF Outputs'
  milestone: 2026.05.231
  deliverable: results/experiment_2375_fr11_real_csl.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  continuous_self_learning_task: true
  prior_failures:
  - experiment_id: exp2357-fr11-fst-multidomain-v7
    verdict: 'complete: fr11_multidomain_passed=true, cross_domain_retention_rate=1.0 (IMPLAUSIBLE_PERFECT on 3 trivially-synthetic domains)'
    addressed_by: "exp2357 used 3 synthetic domains where domain labels were artificially
      separated (e.g., weather/finance/sports with clearly distinct vocabulary). cross_domain_retention_rate=1.0
      is expected on well-separated synthetic domains — the FST fast/slow weights trivially
      distinguish them. exp2375 uses REAL model outputs from cached GGUF telemetry as domain
      labels, where the FST fast/slow mechanism must handle natural variation in real
      chain-of-thought patterns. Target: realistic retention >= 0.60 (relaxed gate for
      real-data complexity). Different scope: real-data validation, not synthetic task separation."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: FR-11 (Autonomous Self-Learning Loop) requires a continuous self-learning task
    that demonstrates FST fast/slow weight update across domains using REAL model outputs.
    exp2357 achieved cross_domain_retention_rate=1.0 on trivially-separable synthetic domains,
    which is an IMPLAUSIBLE_PERFECT result. exp2375 validates FR-11 on REAL Qwen3.6-35B
    outputs from cached telemetry where domain separation is not guaranteed.

    The FST fast/slow mechanism: "fast" weights update per-example via gradient descent on
    the energy loss; "slow" weights accumulate domain-level representations via moving average.
    Cross-domain retention measures whether fast weight updates for one domain disrupt
    performance on previously learned domains.

    Gate: cross_domain_retention_rate >= 0.60 (relaxed from 0.75 to account for real-data
    distribution complexity). Any realistic result < 1.0 satisfies the adversarial requirement.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/pipeline/fst_pipeline.py (from exp2365, if available)
      {project_root}/python/carnot/ (look for fast_slow, continual, or self_learning modules)
      {project_root}/results/experiment_2357_fr11_multidomain.json (prior: trivial domains)
      {project_root}/results/experiment_2365_fst_live_gen.json (if available)
      {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl

    TASK: Validate FR-11 FST fast/slow weight update on REAL model outputs from cached
    telemetry as a continuous self-learning task.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Verify telemetry manifest:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            wc -l {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         b. Check FST pipeline:
            .venv/bin/python -c "from carnot.pipeline.fst_pipeline import FSTFastSlowUpdater; print('OK')" 2>/dev/null || echo "NOT_FOUND"
         c. CPU-only confirmed.

      1. Load telemetry and create 3 real-data domains:
         Use ALL available rows from live_sota_balanced_telemetry_manifest_1480.jsonl.
         Partition rows into 3 domains by prompt type (use heuristic clustering by topic
         word overlap, or use the first word of the prompt as a rough domain indicator):
           Domain 1: first 1/3 of rows (sorted by prompt hash for reproducibility)
           Domain 2: middle 1/3 of rows
           Domain 3: final 1/3 of rows
         Record: n_rows_per_domain for each domain.

      2. Initialize FST fast/slow weight structure:
         If FSTFastSlowUpdater exists: use it.
         If not: implement a minimal fast/slow updater:
           - fast_weights: updated per-step via gradient of energy loss
           - slow_weights: updated as exponential moving average of fast_weights (alpha=0.01)
           - The energy loss: sum of |fast_weights - slow_weights|^2 (consistency loss)

      3. Sequential domain training (continuous self-learning):
         Train on Domain 1 (all rows): update fast weights, accumulate slow weights.
         Evaluate retention on Domain 1: record retention_1_after_1.
         Train on Domain 2: update fast weights.
         Evaluate retention on Domains 1 and 2: record retention_1_after_2, retention_2_after_2.
         Train on Domain 3: update fast weights.
         Evaluate retention on all 3 domains: record retention_1_after_3, retention_2_after_3, retention_3_after_3.

      4. Compute cross_domain_retention_rate:
         mean([retention_1_after_3, retention_2_after_3]) — mean retention of prior domains
         after training on all 3.
         Gate: cross_domain_retention_rate >= 0.60.

      5. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: fr11_real_csl_passed=true/false."
      - fr11_real_csl_passed:
          principle: "Primary gate: true if cross_domain_retention_rate >= 0.60."
      - cross_domain_retention_rate:
          principle: "Mean retention of prior domains after training on all 3. Should be < 1.0 on real data."
      - n_real_domains:
          principle: "Must be 3 (real data partitioned into 3 domains)."
      - n_total_real_examples:
          principle: "Total telemetry rows used. Records experiment scale."
      - continuous_self_learning_validated:
          principle: "True — this task IS the FR-11 continuous self-learning demonstration."
      - fast_slow_mechanism_used:
          principle: "Description of FST fast/slow mechanism (whether FSTFastSlowUpdater or stub)."
      - random_seed:
          principle: "Reproducibility. Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records resource verification."

    ACCEPTANCE GATES:
      - condition: "fr11_real_csl_passed == true"
        principle: "FR-11 mandatory: cross_domain_retention_rate >= 0.60 on real data."
      - condition: "cross_domain_retention_rate < 1.0"
        principle: "Adversarial requirement: realistic result on real data. 1.0 would indicate trivial domain separation."
      - condition: "n_total_real_examples >= 30"
        principle: "Minimum sample size."

    Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

