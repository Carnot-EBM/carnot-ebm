  title: 'Exp 903: Milestone 2026.04.69 Operational Retrospective (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Milestone 2026.04.69 (Exps 892-903) is complete. Read all result JSONs
    and compute the operational retrospective. Milestone goals:
    1. manifest_enforcement_verified: enforcement_wired=True OR escalated (Exp 892)
    2. svamp_root_cause_confirmed: labeling_mismatch_confirmed=True (Exp 893)
    3. vjepa_streaming_positive: signed_improvement > 0 (Exp 894)
    4. code_repair_50q_positive: signed_improvement > 0 (Exp 895)
    5. svamp_auc_above_threshold: svamp_auc > 0.60 (Exp 896)
    6. lagrange_forgetting_improves: constraint_precision_with_forget > constraint_precision_no_forget (Exp 897)
