    - {project_root}/results/experiment_7463_v654_semif_e0_logprob_parity.json
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/experiment_7448_v653_capture_lifecycle.py
    - {project_root}/results/experiment_7476_v655_option_qualification.json
    - {project_root}/openspec/capabilities/verification/spec.md

    TASK:
    Produce results/experiment_7477_v655_native_readout_pilot.json.
    Create scripts/experiments/experiment_7477_v655_native_readout_pilot.py as the thin entrypoint and reuse or add small logic in python/carnot/experiment_7477_v655_native_readout_pilot.py. Add tests/python/test_experiment_7477_v655_native_readout_pilot.py for new behavior. These paths are deliverables to create, not existing prerequisites. Each acceptance gate below must record a one-line principle stating the failure mode it prevents.

    CONCRETE STEPS:
    1. Emit a flushed progress line immediately. Read the listed sources and relevant REQ-* capability. Authenticate preconditions and historical flags. New TASK paths are outputs to create; earlier same-milestone paths become inputs only after their producers execute.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed at least every 60 seconds. Stream child stdout unbuffered and emit truthful pending-operation heartbeats every 60 seconds during blocking calls, authoring and validation. Keep EVERY gap below 600 seconds: silence can kill at 1200 seconds; sustained progress permits the 4800-second hard cap. Checkpoint completed units and terminate only owned processes.
    3. Extend the relevant REQ-* and SCENARIO-* spec first, write meaningful failing tests for new behavior, then implement a small reusable helper and thin entrypoint. Reuse existing corrected helpers when sufficient; do not copy an old experiment main, stale constants or full-suite manifest.
    4. Declare inference_substrate_class=model_load_no_generation and MODEL_SPECS including unsloth/Qwen3.8-27B-GGUF. Use cached_current_model(), the cached GGUF and embedded tokenizer, CARNOT_FORCE_LIVE=1, one owned GPU lease and observed CUDA-offload receipts. Keep requested and observed offload separate; no simulated or small-model headline fallback. Old small models may only be explicitly marked CPU smoke controls. Record actual class if execution stops before model work. Never pad duration or kill an operator server.
    5. Build one reusable native readout runner over the existing Qwen helper. Record weight SHA, tokenizer identity, chat-template bytes, llama.cpp build, prompt token IDs and actual last evaluated position. Use fresh KV state for each unrelated prompt. Do not introduce an HTTP adapter or prefix cache.
    6. Use twelve disjoint development source groups frozen by hash before outcomes; evaluate both label orders once, plus four deterministic transport controls, for at most 28 forwards. Freeze the prompt before looking at labels. MODEL_SPECS contains the mandated Qwen; call eval/forward only and generate zero tokens. Limit current live work to 600 seconds with one owned lease.
    7. Require all requested option logits and token-boundary receipts, finite values and complete invocation accounting. Detect label swaps, token-position mistakes, constant stub vectors and accidental state reuse through explicit controlled fixtures. Record natural uniform or inaccurate predictions as observations, not transport failure. Do not gate on predictive accuracy or on order agreement of real source cases.
