       - If task has agent_type: "codex": dispatch to codex CLI with the safe config from Part 1.
         Use separate state file: ops/conductor-state_codex.json (suffix _codex).
       - Otherwise: use existing Claude dispatch.
    4. Write systemctl service stub:
       ~/.config/systemd/user/carnot-conductor-codex.service
