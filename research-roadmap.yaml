    \     simulation_mode: bool = True):\n\
    \     - sample(config: SparsifiedIsingConfig, n_samples: int) -> jnp.ndarray\n\
    \     - update_couplings(new_J: jnp.ndarray) -> None: POSIX-atomic write\n\
    \     - benchmark(n_samples: int = 1000) -> float: ms per sample\n\
    \   - Test: FpgaBackend(simulation_mode=True).sample() returns correct shape\n\
    \   - Test: FpgaBackend with no bitfile defaults to simulation_mode automatically\n\
    \   - Test: update_couplings writes atomically (uses temp file + rename)\n\
    5. Implement python/carnot/hardware/fpga_backend.py (FpgaBackend, SparsifiedIsingConfig).\n\
    \   Export from carnot.hardware.__init__.\n\
    \   Generate hardware/kv260/ising_sampler_128_sparse.v — Verilog RTL:\n\
    \   - 128 spin registers (1-bit each)\n\
    \   - Sparsified coupling matrix (AXI-Lite writable, 10-bit precision)\n\
    \   - LFSR random number generator (32-bit, Galois polynomial)\n\
    \   - Metropolis update rule per spin (clock-driven, parallel)\n\
    \   - AXI-Lite slave interface for coupling matrix write and spin read\n\
    \   Generate docs/kv260_synthesis.md: step-by-step Vivado commands to synthesize and flash\n\
    \   the bitfile to KV260 (for human execution).\n\
    \   Verbose docstrings: WHY 128 spins (fits in KV260's 256K LUTs with room for control logic),\n\
    \   WHY sparsified connectivity (arXiv 2604.04606: 6x speedup, 4x scale improvement),\n\
    \   WHY LFSR (hardware-efficient pseudorandom source, approximates thermal noise),\n\
    \   WHY 10-bit coupling precision (arXiv 2505.02103: adequate for EP-trained Ising machines).\n\
    6. Write scripts/experiment_471_kv260_fpga_v2.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(471, timeout_minutes=30) as context manager\n\
