  - id: exp6434-arc-state-key-reachability-ab
    milestone: "2026.08.553"
    deliverable: results/experiment_6434_arc_state_key_reachability_ab.json
    title: "ARC generic state-key reachability invariant and full-roster A/B"
    priority: high
    track: arc
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 240
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6122-arc-primitive-reachability-loo
        verdict: "complete_null: no_supported_solver_kit_primitive_with_direct_causal_heldout_receipts_no_solve_claim"
        addressed_by: "This task repairs a measured generic state-key alias in the canonical adapter-bypassed live search and tests full-roster regression safety; it does not select a solver-kit primitive."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The current adapter-bypassed ARC public baseline clears at least one level in 8 of 25 games at 3000 expansions. ops/known-issues.md records that sc25 stops after 24 actions because the current state key aliases distinct live states and empties the frontier. A suffix restores normal exploration but does not solve the game. This is a generic live-path reachability defect, not permission for a per-game adapter or a solve claim. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/ops/known-issues.md entries for the ARC held-out baseline, sc25 collapse, and the small-object-first refusal
      - {project_root}/ops/arc_bench_latest.json, {project_root}/ops/arc_flag_ledger.yaml, and {project_root}/ops/arc_solve_registry.yaml
      - {project_root}/scripts/arc_bench.py and the canonical adapter-bypassed live ARC entrypoint
      - current state-key, observation-history, frontier, deduplication, budget, exact game-interface, and flag-selection code
      - {project_root}/results/experiment_6421_arc_opt_in_executed_policy_ab.json and {project_root}/results/experiment_6422_arc_held_family_policy_safety_audit.json
      - relevant ARC OpenSpec capability files and {project_root}/ops/e2e-test-plan.md

      TASK
      Implement and test a generic collision-certified state-key suffix. The arm may extend the key only when two distinct live observation histories alias under the current key. It must not contain a game ID, game-specific feature, source-derived rule, hand GameAdapter, or offline ground-truth search. Run a matched full-roster A/B. Make no game or level solve claim and do not modify the solve registry.

      CONCRETE STEPS
      0. Preflight CPU, RAM, disk, canonical environment, current 25-game roster, seeds, budgets, exact game interface, solve registry, adapter-bypass state, and current shipped flag defaults. Hash the baseline before edits.
      1. Registry-precheck every game. This task targets reachability behavior only. It must not duplicate, extend, or create solve credit.
      2. Add a generic collision certificate that records the base key, distinct observation-history hashes, alias evidence, and the minimal suffix selected. Keep the new behavior default OFF.
      3. Unit-test genuine collision, no collision, identical history, monotone HUD change, reset, process restart, and adversarial hash-substitution cases. No test may name or special-case sc25 in implementation logic.
      4. Run matched baseline and explicit-opt-in arms over all 25 adapter-bypassed public games and at least three seeds with identical expansion and action budgets.
      5. Record per-game and per-seed frontier exhaustion, unique states, alias certificates, environment steps, legal actions, exact observations, terminal reasons, cleared-state observations, errors, wall time, and action cost. A cleared-state observation is diagnostic only and does not create solve credit.
      6. Require zero regression on games cleared by baseline, zero new errors, no source access, no per-game adapter, no exhaustive search, and no solve-registry mutation. Report increased exploration as cost unless it improves a pre-registered reachability metric.
      7. Attack game-ID branching, hidden adapter use, source access, offline BFS, false collision certificates, history truncation, hash substitution, budget mismatch, seed mismatch, state leakage, and solve-credit leakage.
      8. Add or update REQ-* and SCENARIO-* entries. Write focused tests. Run the full ARC benchmark E2E, spec coverage, adversarial verification, determination preservation, artifact convention audit, and root-clutter checks.
      9. Set arc_state_key_reachability_ready_score=1.0 only when certified premature frontier collapse decreases, no baseline-cleared game regresses, no new error appears, all critical attacks fail closed, the default remains OFF, and no solve or registry claim occurs.

