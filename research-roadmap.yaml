      1. Read the listed .146 artifacts and conductor log entries around Exp 1864-1875.
      2. Record which .146 artifacts are usable evidence, which were blocked by missing gate fields, and which scopes must not be rerun without changed root cause.
      3. Write `{project_root}/results/experiment_1876_146_completion_147_gate_contract.json` with standard result fields and the required gate fields below.
