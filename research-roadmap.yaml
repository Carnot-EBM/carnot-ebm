    \nTASK: Improve ContinuousEBM with Langevin dynamics and Energy Matching.\n\
    1. apply_env_autofix() FIRST.\n\
    2. Add REQ-KONA-002 (Langevin dynamics sampling achieves L2 < 0.5 vs Ising ground state),\n\
    \   REQ-KONA-003 (Energy Matching trajectory converges faster than gradient descent),\n\
