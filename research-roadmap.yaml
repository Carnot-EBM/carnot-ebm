  - experiment_id: exp2550-jepa-real-corpus-evaluation
    verdict: 'complete: jepa_discrimination_achieved=True; fast_path_rate in [0.30, 0.80]'
    addressed_by: "exp2550 evaluated the fast-path discriminator and tuned its threshold (fast_path_rate in [0.30, 0.80]). It did NOT train the JEPA predictor on real data — it only evaluated the existing model. This task trains the JEPAFastPathPredictor on the 6548-example FoVer real corpus to improve the predictor's underlying AUC from 0.889 (exp2525) toward 0.95. Different deliverable: training vs evaluation."
    retire_if_same_verdict: false
  prompt: "CONTEXT: The JEPA fast-path predictor (JEPAFastPathPredictor in python/carnot/pipeline/jepa_fast_path.py) was integrated in exp2539 and had its discrimination threshold tuned in exp2550. Current fast_path AUC is ~0.889 (from exp2525). The predictor was trained on synthetic data; exp2548 found a real FoVer corpus of n=6548 labeled examples (violations vs non-violations). Training on this real data should push AUC toward 0.95.\n\nTHIS IS THE MANDATORY CONTINUOUS SELF-LEARNING EXPERIMENT for .246 (required by research-program.md).\n\nARCHITECTURE CONTEXT:\n  JEPAFastPathPredictor takes response features (response_length, logprob_variance, hedge_count, etc.)\n  and predicts p_violation_probability. If p < threshold → fast-path (skip full Ising verification).\n  Training: minimize binary cross-entropy on (features, label) pairs from FoVer corpus.\n  Labels: FoVer violation=1 (hallucination), non-violation=0 (correct).\n\nEXISTING CODE TO READ FIRST:\n  grep -r 'JEPAFastPath\\|jepa_fast_path\\|fast_path' {project_root}/python/ --include='*.py' -l\n  {project_root}/python/carnot/pipeline/jepa_fast_path.py (predictor architecture)\n  {project_root}/results/experiment_2548_real_corpus_validation.json (FoVer corpus with labels)\n  {project_root}/results/experiment_2550_jepa_real_eval.json (current threshold and fast_path_rate)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. JEPA predictor exists:\n        python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.pipeline.jepa_fast_path import JEPAFastPathPredictor; print('ok')\" 2>/dev/null\n        If fails: write honest_verdict 'blocked_jepa_fast_path_not_found' and exit.\n     b. FoVer corpus available:\n        python3 -c \"import json; d=json.load(open('results/experiment_2548_real_corpus_validation.json')); print('n_real:', d.get('n_real', 0))\"\n        If n_real < 100: write honest_verdict 'blocked_insufficient_training_data' and exit.\n  1. Load FoVer corpus from exp2548 results. Extract (response_text, label) pairs.\n  2. Compute feature vectors for each response:\n     response_length, hedge_word_count, number_count, sentence_count, avg_sentence_length\n  3. Split into train (80%) / eval (20%). Set random seed 42.\n  4. Train JEPAFastPathPredictor (or a compatible logistic regression if the predictor does not have\n     a train() method) on training split.\n  5. Evaluate on eval split. Compute AUC.\n  6. Compare to prior AUC baseline (0.889 from exp2525).\n  7. Save trained predictor checkpoint to python/carnot/pipeline/jepa_fast_path_v2_checkpoint.pkl\n     (or equivalent path).\n  8. Set jepa_auc_improved = (new_jepa_auc > 0.889).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - jepa_auc_real_data:\n      principle: \"AUC after training on real FoVer corpus. Directly comparable to 0.889 synthetic baseline.\"\n  - jepa_auc_improved:\n      principle: \"True if real-data AUC > 0.889 (exp2525 synthetic baseline). Continuous self-learning milestone deliverable.\"\n  - n_train:\n      principle: \"Training set size — documents how much real data was used.\"\n  - n_eval:\n      principle: \"Evaluation set size — determines reliability of AUC estimate.\"\n  - checkpoint_saved:\n      principle: \"True if trained predictor was persisted. Prevents regression to synthetic-only predictor.\"\n  - feature_set:\n      principle: \"List of features used — ensures reproducibility.\"\n  - prior_auc_baseline:\n      principle: \"0.889 from exp2525 — the comparison baseline.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"jepa_auc_real_data >= 0.889 OR n_train >= 100\"\n    principle: \"Continuous self-learning mandate: either AUC improved from synthetic baseline OR we trained on at least 100 real examples. Training on real data is the primary deliverable regardless of AUC delta.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2566-halluscan-benchmark-eval
  title: 'Phase 5b: HalluScan External Benchmark Evaluation (arXiv:2605.02443; peer comparison)'
  milestone: 2026.05.246
  deliverable: results/experiment_2566_halluscan_eval.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2548-real-corpus-verifier-validation
    verdict: 'complete: tier0r_real_auroc=0.9414; tier0s_real_auroc=0.3758; tier0u_real_auroc=0.5360; corpus_type=real; n_real=6548'
    addressed_by: "exp2548 evaluated on the FoVer corpus (Carnot's internal corpus). HalluScan is an EXTERNAL benchmark from a different source (arXiv:2605.02443), covering scientific/medical/legal/general domains. Different corpus source, different evaluation goal (external peer comparison vs internal validation). Not a rerun of exp2548."
    retire_if_same_verdict: false
  prompt: "CONTEXT: arXiv:2605.02443 'HalluScan: A Systematic Benchmark for Detecting and Mitigating Hallucinations in Instruction-Following LLMs' (May 2026) provides a multi-domain hallucination benchmark. Key finding: NLI-based verification achieves AUROC 1.0 in the scientific domain; mean AUROC 0.67 across domains. Carnot's ensemble v7b achieves AUROC=0.9857 on FoVer — we want to compare on HalluScan.\n\nNOTE: HalluScan may or may not be available via huggingface_hub or direct download at evaluation time. This task checks availability and falls back to a domain-representative subset if the full benchmark is not accessible.\n\nSPECIFIC COMPARISON TO MAKE:\n  Carnot ensemble v7b AUROCs on HalluScan domains vs reported NLI-based peer (1.0 science, 0.67 mean)\n  This provides the paper-v6 external comparison baseline for §5.\n\nEXISTING CODE TO READ FIRST:\n  python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.pipeline.verify_repair import VerifyRepairPipeline; print('ok')\"\n  {project_root}/results/experiment_2546_ensemble_v7b.json (v7b ensemble definition)\n  Calibration code location (from exp2546).\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. PYTHONPATH-aware carnot import:\n        python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.verify.semantic_energy import SemanticEnergyDetector; print('ok')\"\n        If fails: write honest_verdict 'blocked_carnot_import_failed' and exit.\n     b. Try to load HalluScan:\n        python3 -c \"from huggingface_hub import hf_hub_download; print('hf_hub ok')\" 2>/dev/null || echo 'hf_hub not available'\n        Try: python3 -c \"from datasets import load_dataset; ds=load_dataset('kpandl/HalluScan', split='test', streaming=True); sample=next(iter(ds)); print('ok:', list(sample.keys())[:5])\" 2>/dev/null || echo 'halluscan_not_found'\n        Set halluscan_available=(found or not).\n\n  1. If HalluScan available:\n     Sample n=100 examples per domain (scientific, medical, legal, general) if available.\n     Score each with Carnot's verifiers (use the ensemble's per-verifier score functions).\n     Compute per-domain AUROC and mean AUROC.\n\n  2. If HalluScan NOT available:\n     Construct n=100 diverse synthetic examples covering science/medical/legal/general:\n     20 scientific (chemistry facts, math proofs)\n     20 medical (drug interactions, anatomy)\n     20 legal (case citations, statutes)\n     40 general (common facts, history)\n     Label each: hallucination=1, correct=0.\n     Score and compute synthetic halluscan_auroc.\n\n  3. Compare Carnot mean AUROC to HalluScan paper baseline (0.67 mean, 1.0 scientific NLI).\n  4. Set carnot_beats_halluscan_baseline = (carnot_halluscan_auroc > 0.67).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - halluscan_available:\n      principle: \"True if real HalluScan benchmark was loaded. Determines paper-citable status.\"\n  - carnot_halluscan_auroc:\n      principle: \"Carnot ensemble v7b AUROC on HalluScan (or synthetic proxy). Peer comparison baseline.\"\n  - per_domain_auroc:\n      principle: \"Domain breakdown (scientific, medical, legal, general). Identifies strongest Carnot domains.\"\n  - halluscan_paper_baseline:\n      principle: \"0.67 (mean), 1.0 (scientific NLI) — from arXiv:2605.02443. Fixed reference.\"\n  - carnot_beats_halluscan_baseline:\n      principle: \"True if Carnot AUROC > 0.67. Provides external peer comparison for paper-v6 §5.\"\n  - corpus_type:\n      principle: \"'real_halluscan' or 'synthetic_proxy' — determines paper-citable status.\"\n  - n_eval:\n      principle: \"Total examples evaluated.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"carnot_halluscan_auroc IS NOT NULL\"\n    principle: \"External benchmark evaluation must produce a measured AUROC (real or synthetic proxy). This is the minimum for paper-v6 §5 external comparison.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

