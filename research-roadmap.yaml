- id: exp1565-soft-gibbs-residual-implementation
  milestone: 2026.05.120
  deliverable: results/experiment_1565_soft_gibbs_residual_implementation.json
  title: "Soft-Gibbs Residual Implementation + Hard-BRS Falsification - Gated on Exp1560"
  agent_type: codex
  model: gpt-5.5
  max_turns: 60
  estimated_wall_time_min: 60
  priority: critical
  gated_on:
    - upstream: exp1560-119-completion-archive-120-activation
      gate_field: soft_gibbs_residual_ready
      expected_value: true
  prior_failures:
    - experiment_id: none
      verdict: novel_construction
      addressed_by: "First implementation of Soft-Gibbs Residual
                     (Carnot's novel paper-v6 contribution). Validates
                     Hard-BRS catastrophic failure under k=15 AND-
                     composition while Soft-BRS decays exponentially."
  prompt: |
    Per Deep Think DT-OT-RESIDUAL: Hard-BRS fails operationally under
    k=15 AND-composition (M ~ 2^O(15), decay bound flatlines).
    Constructed Soft-Gibbs Residual:

      V(y) = Σ_{i=1..k} 1{y ∉ Ŝ_i}              # failed verifier count
      µ_res^β(y) = µ(y) · exp(-β V(y)) / Z_β     # Boltzmann-softened
      A(y) = exp(-β V(y)) ∈ (0, 1]               # accept probability
      Z_β ≥ ∏_{i=1..k} exp(-β α_i)               # Jensen coverage bound

    STEPS:
    1. Implement at python/carnot/sampling/brs_residual.py both:
       - hard_brs(prior_sampler, accept_set_S, n_steps): standard
         Hard-BRS rejection-sample
       - soft_brs(prior_sampler, verifiers, beta, n_steps): Soft-BRS
         using Soft-Gibbs Residual
       Both share the prior-sampler interface (returns y from µ).
    2. Build n=8 latent EBM prior (uniform pushforward through sgn).
    3. Construct k=3 deliberately-contradictory verifiers:
       - v_1: demands y_1 = +1
       - v_2: demands y_1 = -1
       - v_3: demands y_2 = +1 OR y_3 = +1
       Hard intersection ∩_i Ŝ_i is logically empty.
    4. Run both for N ∈ {10, 100, 1000, 10000} steps. Track:
       - Empirical SubOpt over time
       - Acceptance rate
       - Distribution over min-violation states
    5. Acceptance gate:
       - Hard-BRS empirical acceptance rate at all N: 0.0 (infinite
         rejection, falsifies operational Theorem 3.10)
       - Soft-BRS empirical SubOpt decays exponentially, matching
         (1 - Z_β)^N for at least one β value tested
       - Soft-BRS finds min-violation state correctly (V(y) = 1, since
         3 contradictory verifiers must miss at least 1)
    6. Repeat Soft-BRS sweep at β ∈ {0.5, 1.0, 2.0, 5.0} to map
       β-vs-acceptance-rate curve.

    Write deliverable with status="complete" and honest_verdict
    prefixed with "complete:". Required fields:
    - soft_gibbs_residual_implemented: bool
    - hard_brs_acceptance_rate: float (must be 0.0)
    - soft_brs_decay_confirmed: bool
    - min_violation_state_found: bool
    - z_beta_curve: list of {beta, empirical_acceptance_rate}

    Do NOT push. Do NOT modify scripts/research_conductor.py.

