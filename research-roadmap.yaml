    retire_if_same_verdict: false
  - experiment_id: exp134-tier1-precision-reweighting
    verdict: fixed_equals_adaptive
    addressed_by: "Exp 134 tested CONSTRAINT WEIGHT reweighting (adjust which constraints apply more strongly). Exp 1015 tests OUTPUT SELECTION filtering (which model outputs are used for self-training). Completely different intervention — reweighting changes the verifier, selection filtering changes the training set."
    retire_if_same_verdict: false
  - experiment_id: exp761-tier1-constraint-addition
    verdict: constraint_addition_works_single_session
    addressed_by: "Exp 761 tested adding new constraints from session memory. Exp 1015 tests using the energy function to select which model outputs are worth imitating for self-distillation. Different axis of self-learning: constraint addition vs output quality filtering."
    retire_if_same_verdict: false

- id: exp1016-fover-corpus-expansion
  milestone: 2026.04.79
  deliverable: results/experiment_1016_fover_corpus_expansion.json
  title: "FoVer Corpus Expansion — Z3 Auto-Label 500+ CoT Pairs for Probe Training"
  prompt: |
    CONTEXT:
    The FoVer corpus has 57 labeled CoT pairs (Exp 442, live GPU). All probe training
    (ThinkPRM, VPRM, GS-KAN, JEPA) uses this 57-pair corpus. It is too small for reliable
    generalization. Per arXiv 2505.15960 (Generalizable PRMs via Formal Annotations), Z3
    labels outperform human labels for PRM generalization by 12-18%.

    This experiment uses the existing VeriCoT/Z3 labeling pipeline (Exp 453/564) to
    auto-generate and label 500+ CoT steps from synthetic arithmetic problems. The expanded
    corpus unlocks better probe training in downstream experiments AND provides 100+ violation
    pairs for PPSEBM live relay (Exp 1024).

    EXISTING CODE TO READ FIRST:
    - python/carnot/extraction/vericot.py (VeriCoTStepValidator — Z3-based step labeler)
    - python/carnot/extraction/coace_extractor.py (CoACEExtractor — constraint extraction)
    - results/fover_labeled_steps_live.json (57-pair baseline)
    - results/experiment_453_vericot.json (VeriCoT baseline: 8/20 violations detected)
    - scripts/experiment_template.py (ExperimentTemplate)
    - openspec/capabilities/verifiable-reasoning/spec.md (FoVer corpus spec)

    TASK:
    1. GENERATE 200 synthetic arithmetic word problems (GSM8K-style):
       Format: "Alice has X apples. She gives Y to Bob. Then she buys Z more. How many does she have?"
       Generate with random parameters ensuring a mix of easy/medium/hard.
       For 30% of problems, intentionally inject arithmetic errors into a synthetic "model response."
    2. FOR EACH problem-response pair:
       a. Use VeriCoTStepValidator.validate_steps(response, problem) to get per-step labels.
       b. Each step labeled: correct/incorrect/uncertain by Z3 symbolic verification.
       c. Append to expanded corpus with provenance: {"source": "z3_synthetic", "problem": ...,
          "response": ..., "steps": [{text, label, z3_verdict}, ...]}
    3. ALSO include the 57 live GPU pairs (source: "live_gpu") for continuity.
    4. SAVE expanded corpus to results/fover_expanded_corpus.json:
       - List of {source, problem, response, steps, n_steps, n_violations, n_correct}
       - Target: n_labeled_pairs >= 500 (including steps from multi-step responses)
       - Violations (n_violations > 0) must be >= 100 pairs for PPSEBM gate
    5. WRITE results/experiment_1016_fover_corpus_expansion.json (try/finally):
       - n_synthetic_problems: int
       - n_labeled_pairs: int (target >= 500 step-level labels)
       - n_violation_pairs: int (target >= 100)
       - n_live_gpu_pairs: int (57 carried over)
       - corpus_file: "results/fover_expanded_corpus.json"
       - z3_label_rate: float (fraction successfully Z3-labeled vs uncertain)
       - honest_verdict: "corpus_expanded" (n_labeled >= 500) | "corpus_partial" | "z3_labeling_failed"

    CONCRETE STEPS:
    - python3 -c "from python.carnot.extraction.vericot import VeriCoTStepValidator; v=VeriCoTStepValidator(); print('import ok')" 2>&1
    - python3 -c "import json; d=json.load(open('results/fover_labeled_steps_live.json')); print(len(d), 'live pairs; first step labels:', d[0].get('steps', d[0].get('label', 'N/A'))[:2] if d else 'empty')"
    - grep -n "class VeriCoT\|def validate" python/carnot/extraction/vericot.py | head -15

    Run: python scripts/experiment_1016_fover_corpus_expansion.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: high
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 20

- id: exp1017-thinkprm-step-verifier-v3
  milestone: 2026.04.79
  deliverable: results/experiment_1017_thinkprm_step_verifier_v3.json
  title: "ThinkPRM Step Verifier v3 — Trained on Expanded FoVer Corpus (500+ Pairs)"
  prompt: |
    CONTEXT:
    ThinkPRMProbe was implemented in Exp 945 (.73) as a KAN-based CoT step verifier.
    Exp 1007 (.78) was DOOMED_RERUN_BLOCKed because the planning agent forgot to add
    prior_failures field to the YAML (conductor matched 7 prior think_probe experiments).
    Exp 1016 has now expanded the FoVer corpus to 500+ labeled pairs — 10x more training data.

    This v3 trains ThinkPRMProbe on the 500-pair expanded corpus and measures AUC improvement
    from more data. Hypothesis: 10x more data gives ≥10 AUC point improvement on held-out test.

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/thinkprm_probe.py (ThinkPRMProbe — look for it; check Exp 945/1007)
    - python/carnot/pipeline/think_probe.py (CarnotThinkProbe — zero-shot baseline)
    - results/experiment_1016_fover_corpus_expansion.json (n_labeled_pairs, corpus_file)
    - results/fover_expanded_corpus.json (500+ labeled pairs)
    - results/experiment_945_thinkprm_tier29.json (prior ThinkPRM training result)
    - openspec/capabilities/verifiable-reasoning/spec.md (REQ-PROBE-010/011 if added)

    TASK:
    1. READ results/fover_expanded_corpus.json. Confirm n_labeled >= 500.
       If file missing, use results/fover_labeled_steps_live.json (57 pairs) as fallback.
    2. FIND ThinkPRMProbe class. If not in python/carnot/verify/thinkprm_probe.py,
       search python/carnot/ for the implementation and document where it is.
    3. TRAIN ThinkPRMProbe on expanded corpus:
       Split: 80% train / 20% test (randomized with seed=42).
       For each pair: use generate_verification_cot() to create features.
       Train KAN classifier on extracted features.
    4. COMPUTE AUC on test set. Compare to:
       a. Zero-shot CarnotThinkProbe baseline
       b. 57-pair trained version (from Exp 945/1007, read their AUC from results JSON)
    5. ADD REQ-PROBE-010/011 to spec if not already present (check first).
    6. Write 100% coverage tests for thinkprm_probe.py changes.
    7. WRITE results/experiment_1017_thinkprm_step_verifier_v3.json (try/finally):
       - thinkprm_probe_auc_v3: float (trained on 500-pair corpus)
       - thinkprm_probe_auc_57: float (trained on 57-pair corpus, from prior experiment)
       - zero_shot_baseline_auc: float
       - auc_improvement_vs_57: float
       - n_training_pairs: int
       - n_test_pairs: int
       - honest_verdict: "thinkprm_v3_improved" (v3_auc > 57_auc by > 0.02) | "thinkprm_v3_parity" | "thinkprm_v3_no_improvement"

    CONCRETE STEPS:
    - python3 -c "import json; d=json.load(open('results/fover_expanded_corpus.json') if __import__('os').path.exists('results/fover_expanded_corpus.json') else open('results/fover_labeled_steps_live.json')); print(len(d), 'pairs')"
    - find python/carnot -name "*.py" | xargs grep -l "ThinkPRMProbe\|thinkprm_probe" 2>/dev/null | head -5
    - python3 -c "from python.carnot.pipeline.think_probe import CarnotThinkProbe; print('baseline importable')" 2>&1

    Run: python scripts/experiment_1017_thinkprm_step_verifier_v3.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: medium
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 20
  gated_on:
    - upstream: exp1016-fover-corpus-expansion
      artifact_field: n_labeled_pairs
      op: '>='
      value: 100
  prior_failures:
  - experiment_id: exp1007-thinkprm-step-verifier
    verdict: blocked_doomed_rerun_no_prior_failures
    addressed_by: "Exp 1007 (.78) was DOOMED_RERUN_BLOCKed because the planning agent forgot to add prior_failures YAML field. Conductor found 7 prior think_probe experiments. Exp 1017 v3 includes this prior_failures documentation. Uses 500-pair corpus (10x) vs 57-pair (.78 plan)."
    retire_if_same_verdict: false
  - experiment_id: exp945-thinkprm-tier29
    verdict: partial
    addressed_by: "Exp 945 (.73) implemented ThinkPRMProbe on the 57-pair corpus. AUC was limited by data. Exp 1017 uses the expanded 500-pair corpus from Exp 1016 — the primary change is data quantity, not algorithm."
    retire_if_same_verdict: false
  - experiment_id: exp444-think-probe
    verdict: timed_out
    addressed_by: "Exp 444 (.33) timed out at 20 min — budget was too small. Exp 455 redesigned with 60-min budget. ThinkPRMProbe is a different implementation (trained, not zero-shot). Budget issue is resolved."
    retire_if_same_verdict: false

- id: exp1018-vprm-rule-based-v3
  milestone: 2026.04.79
  deliverable: results/experiment_1018_vprm_rule_based_v3.json
  title: "VPRM Rule-Based Step Verifier v3 — 10 Rule Families on Expanded Corpus"
  prompt: |
