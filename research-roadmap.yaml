      - upstream: exp6114-phase-d-gpu-ladder-canary
        artifact_field: phase_d_compute_and_ladder_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT:
      Exp6114 must prove that the sealed ladder and the measured-fit SOTA GGUF can execute with attributable CUDA engagement and release. This task uses only Exp6103's calibration split to select a difficulty stratum and fixed decode policy. It is not a headline evaluation and may not inspect the 360 held labels. Explorative Modeling motivates measuring effective exploration rather than assuming K independent draws. Solver-Hard requires model accuracy and solver conflicts to remain separate. MODEL_SPECS: `unsloth/gemma-4-26B-A4B-it-GGUF`, exact cached Q4_K_M file and embedded tokenizer. Today is {date}.

