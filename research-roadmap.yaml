           ANY missing -> honest_verdict blocked_<resource> (e.g. blocked_human_replay_corpus_not_cached), populate preconditions_checked, EXIT. (--no-cov on any focused pytest.)
        1. Build the pooled (frame, action, frame_changed, change_location) corpus from BOTH local sources (human replays + self-captured transitions), across ALL 25 public games (cross-game pooling = the PersistentAEM idea). Train a small conv net (a few conv layers over 64x64x(color-onehot) -> click-heatmap head + 5-dim directional head). Add CBAM attention ONLY if the plain CNN underperforms.
        2. Wire the predictor into rich_action_candidates to RANK candidates by predicted P(frame-change) (try high-change actions first); keep the bare salience ordering as the no-regression fallback. verifier_is_oracle: false (this is a learned action-model, NOT the executable win-check).
        3. Measure on a HELD-OUT set of games/variants (reuse measure_generic_transfer_over_variants + arc_leaderboard_eval --variant): median actions-to-first-levelup WITH the predictor-ranked explorer vs WITHOUT (blind BFS), generic_transfer_rate_over_variants, solve-rate. The WIN: median actions-to-first-levelup STRICTLY lower with a bootstrap CI excluding the baseline AND solve-rate not dropped (efficiency cannot come from giving up on hard games).
        4. POSITIVE CONTROL + FALSE_NEGATIVE_RISK: a game where clickability is plainly learnable (most clicks are no-ops, a few aren't) -- the predictor-ranked explorer must beat blind on it (proves the harness detects a real win). A no-value null is valid only if this control passed; else report the honest null + which feature the predictor weights (the .423 refinement). Emit actions_delta explicitly + a null_delta_methodology_note when 0.0. Offline-reproduce any newly-solved variant.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: clickability_predictor_actions_to_levelup_<n>_below_blind OR complete: clickability_predictor_no_efficiency_gain_honest_null_gap_sharpened."
        inference_substrate:
