milestone: 2026.06.416
milestone_title: 'RE-MEASURE value_weight (A1 -- operator-directed: does the wired v3 head, LOO 0.674,
  at weight>0 BEAT bare-BFS live AND finish in budget? raise SUBMITTED_VALUE_WEIGHT only if both hold
  -- it was reverted 5->0 as a measured regression), RE-RUN the human-replay frame-change predictor (A2
  -- .415 B1 staged the 14,672-example corpus that blocked it), and USE the validated energy-augmentation
  (A3 -- rank by P(frame_change)*(-ΔE) over the v3 structural features that lifted cross-game LOO 0.503->0.674).
  Plus deepen ar25/ka59 + an adapter game to L2 (A4/A5 level-up guarantee). Reserved: submitted-agent
  scoreboard + lazy value-eval prototype (infra), hardware continuity, affordance-SOTA ingestion, capstone.
  ALL codex/gpt-5.5; planner/retro stay Claude Opus 4.8. reproducible_total_levels is NOT the headline
  -- held-out solve-rate + action efficiency are. NO leaderboard submission in-loop (operator-only).'
milestone_doc: openspec/change-proposals/research-roadmap-v416.md
milestone_overview: '.415 validated the energy-augmentation differentiator (v3 features, LOO 0.674) +
  wired the v3 head live, but the value_weight=5 it shipped was a regression (reverted 5->0). .416 closes
  the loop: re-measure whether the GOOD head earns a weight>0 within the eval''s time budget (A1), build
  the now-unblocked frame-change predictor from the staged human replays (A2), and USE the validated structural
  energy in the ranking (A3). The wall is still GENERALIZATION + action efficiency; every task is measured
  against the submitted-default held-out solve-rate, not banked levels.'
