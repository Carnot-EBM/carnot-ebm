    CONTEXT:
    exp1562 falsified the predicted BRAIN expressivity widening at k=15, but it did not test the Deep Think gradient-starvation argument. This experiment must train factorized Bernoulli and Linear-AR q_theta with REINFORCE on the same k=15 regime.

