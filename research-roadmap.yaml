  - id: exp2273-oss-cad-synthesis
    title: "Phase 2: OSS-CAD-Suite Yosys Synthesis from Lint-Passing RTL"
    milestone: "2026.05.224"
    deliverable: "results/experiment_2273_oss_cad_synthesis.json"
