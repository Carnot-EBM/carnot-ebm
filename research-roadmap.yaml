       change_fidelity_by_arm, change_fidelity_delta, change_fidelity_interval,
       noninferiority_margin, harmful_regressions, adoption_gate_passed,
       object_table_ab_completed (row-completeness boolean), solve_claim (must be false),
       source_receipts (must show no game source or offline BFS), gate_check_summary (failed check and
       observed value for blocked_*), verifier_is_oracle (false), verdict_class (positive |
       circular_positive | null | blocked | disqualified | partial), and honest_verdict (allowed
       complete/success/passed/shipped prefix; use complete_blocked_<reason> for task-owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6765_object_table_fetch_ab_v2.py --date {date}
