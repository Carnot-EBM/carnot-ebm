      on MATH improves code generation under test-time scaling by +4-8 pts (HumanEval+, MBPP+,
      LiveCodeBench, BigCodeBench). The counter-hypothesis is ThinkPRM (arXiv:2504.16828): discriminative
      verifiers are OOD-FRAGILE. This task runs the literature's exact positive control on Carnot: does the
      FoVer-math-trained verifier signal transfer to a CODE benchmark? A clean transfer means the .330 code
      AUROC of 0.44 was a wiring failure, not a real Carnot limit. NULL-RESULT DISCIPLINE
      (FALSE_NEGATIVE_RISK): a "does not transfer" verdict is only trustworthy if the code corpus has
