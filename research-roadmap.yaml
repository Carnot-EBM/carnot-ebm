        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6439 must first show a causal development effect. The next question is whether that effect survives new entity and value bindings without carrying stale clauses, and whether revocation tombstones stop behavioral relapse. Exp6431 addressed authority interference but all 400 reported cells were underpowered. This task uses fresh held units and a powered cell design. Work at {project_root}. The planning date is {date}.

