  - id: exp4116-sudoku-extreme-resume-pass1
    milestone: 2026.06.381
    title: "RESUMABLE Sudoku-Extreme baseline -- PASS 1 (establish the STABLE checkpoint lineage, beat the 80-min cap). Seed the stable path results/trm_runs/sudoku_extreme_baseline/ from exp4108's checkpoint if it loads (preserves ~57 min already trained), else start fresh; train <=60 min via trainer.max_time; save to the stable path; report cumulative epochs + best val exact-accuracy."
    priority: critical
    track: trm-baseline
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-12 operator directive: resumable Sudoku-Extreme training — false-positive scope-match vs exp4108 (single-shot, interrupted at the 80-min cap); forward difference = STABLE-path checkpoint + bounded per-task time (<=60 min) so training accumulates across tasks instead of being capped mid-run."
    inference_substrate: gpu_nanotrm_native_training
    deliverable: results/experiment_4116_sudoku_extreme_resume_pass1.json
    prompt: |
      CONTEXT: exp4108 reached only 0.0232 because the 80-min conductor cap interrupted a single ~1h
      run. Fix: bounded resumable training to a STABLE checkpoint path. nano-trm supports resume via
      `ckpt_path=` (verified: `trainer.fit(..., ckpt_path=cfg.get("ckpt_path"))`).

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE training):
           a. `command -v uv` succeeds; `ls nano-trm/src/nn/train.py` exists. Else -> `blocked_nanotrm_or_uv_missing`.
           b. CUDA: `python3 -c "import torch; assert torch.cuda.is_available()"`. Else -> `blocked_cuda_unavailable`.
           c. Dataset present: `ls nano-trm/data/sudoku_extreme_1k_aug_1k` (already generated by exp4108 -- do NOT regenerate). If absent, generate via scripts/data/build_sudoku_extreme_dataset.py.
           d. `mkdir -p results/trm_runs/sudoku_extreme_baseline` (the STABLE shared checkpoint dir for the whole resume lineage).
        1. SEED: if exp4108's checkpoint loads cleanly (torch.load ok), copy it to the stable path as the resume seed (preserves the ~57 min already trained). Else start fresh.
        2. TRAIN bounded: run from the nano-trm dir
           `uv run python src/nn/train.py experiment=trm_sudoku_extreme_1k_aug_1k logger=csv ckpt_path=<stable>/last.ckpt +trainer.max_time="00:01:00:00" <hydra overrides to write checkpoints into the STABLE dir>`.
           Bound to <=60 min (trainer.max_time; fallback trainer.max_steps tuned to ~55 min) so it stops + saves BEFORE the 80-min conductor cap. CHECKPOINT + PRINT-PROGRESS per validation interval so codex's 1201s idle-timeout never fires.
        3. After training: reload the saved checkpoint to confirm it is loadable; read the REAL val exact-accuracy (not q_halt) from the metrics csv; report cumulative epochs trained.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An honest 'val=0.NN still below 0.87' is a COMPLETE verdict; report the real number."
        val_exact_accuracy:
          principle: "The REAL solve metric after this pass; the load-bearing number tracking convergence toward 0.87."
        cumulative_epochs:
          principle: "Total epochs trained across the resume lineage; lets a reader judge whether more passes will converge."
        stable_checkpoint_path:
          principle: "The shared path the NEXT pass resumes from; the lineage breaks if this is a per-run dir (the .380 failure mode)."
        checkpoint_reload_ok:
          principle: "Bare bool: the saved checkpoint reloads -- the precondition for the next pass to resume from it."
        duration_s:
          principle: "Bounded training is a multi-minute GPU run that stops itself BEFORE the 80-min cap; an implausibly short or capped (>4800s) duration is the signal the bound did not hold."
        random_seed:
          principle: "Determinism precondition for reproducing the run."
      ACCEPTANCE GATE:
        - condition: "checkpoint_reload_ok==True AND duration_s < 4800 (stopped cleanly before the cap) AND val_exact_accuracy reported"
          principle: "Pass 1 succeeds if it produces a reloadable stable checkpoint via a CLEANLY-BOUNDED run (not a capped interruption) with a real val number -- regardless of whether 0.87 is reached yet."

