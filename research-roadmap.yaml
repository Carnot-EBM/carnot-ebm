# Pre-staged roadmap for milestone 2026.06.377 (outer-loop, Claude Opus 4.8, 2026-06-11).
#
# PROVENANCE: THE PIVOT. Operator decision 2026-06-11 ("it sounds like we should take the pivot
# seriously") after the overnight .371-.375 synthesis (4-agent evidence sweep). Priority-shifting,
# same class as the 2026-06-10 Deep-Think round that produced .372. Per the Pre-Staged Roadmap
# Convention + operator-trust directive, the outer-loop authors it to guarantee the pivot lands
# clean rather than be diluted by the planner's documented carry-forward bias (which re-ran the
# frontier-three .373->.376). Full directive: ops/known-issues.md TOP PRIORITY 2026-06-11.
#
# THE METRIC FLIPS: from "does the verifier SELECT better at inference" (answered across .371-.375:
# directional-not-significant, the selection moat is a commodity -- DONE, do not re-grind) to
# "does the verifier-as-REWARD TRAIN a better model." The verifier's durable value is as an
# un-hallucinating ground-truth signal that GENERATES training data (Deep-Think Q3 + the standing
# Sudoku +1.1% RFT signal -- HONEST: verdict `no_lift`, +1.12% on a ~5% base, "beat gold-SFT" only
# because the gold control was negative/broken; SUGGESTIVE, not a decision-grade beachhead -- this
# is a BET on the direction, gated on the .377 de-confound below). This unifies three threads in ONE
# experiment:
# (a) verifier-as-reward (the pivot), (b) decentralization-AS-distillation (the Invisible-Leash
# question answered as a TRAINING outcome), (c) ARC-induction progress (the north star).
#
# SUBSTRATE (operator decision 2026-06-11 -- corrects the outer-loop's initial gemma-4-12B default):
# the mechanism test (does RFT >= SFT from the verifier's LABEL-FREE signal?) trains a SMALL
# TRAINABLE-base LADDER (operator decision 2026-06-11; 2-3 cached HF safetensors bases, NOT GGUFs):
#   - HEADROOM rung (PRIMARY clean-signal): Qwen/Qwen3.5-0.8B -- current-gen, above the capacity
#     floor, but less aggressively post-trained -> the MOST room to show a clean RFT-beats-SFT gain.
#   - STRONG rung (robustness): openbmb/MiniCPM5-1B -- the current 1B-class SOTA (Llama-arch, so
#     peft-friendly); tests whether the mechanism holds even on an ALREADY-strong base. NB its
#     SOTA-ness comes from aggressive On-Policy-Distillation post-training, which LIMITS its headroom
#     -- which is exactly WHY "SOTA on leaderboards" is the wrong sole criterion for a headroom test.
#   - optional 3rd: Qwen/Qwen2.5-0.5B (max-headroom) or Qwen/Qwen3.5-2B (size-trend).
# Running the RFT-vs-SFT contrast ACROSS the ladder makes the mechanism claim robust (not a single-
# model artifact); a 1B LoRA finetune is cheap, so the ladder adds little wall-clock. trl 1.6.0 is
# installed (SFTTrainer for the SFT arm, GRPOTrainer for the verifier-reward RFT arm) + peft 0.19.1.
# Why small (vs the initial gemma-4-12B default): (1) THROUGHPUT -- a sub-1B LoRA finetune+eval fits
# ONE window, dissolving the accumulate-across-windows pain that wrecked the .374-.376 runs;
# (2) HEADROOM -- the beachhead prescribes a "0.5-1B headroom base"; (3) FORMAT -- LoRA trains HF
# weights, not GGUF; (4) SOVEREIGNTY -- runs anywhere. The gemma-4-12B 0.26->0.57 decentralization-
# MAGNITUDE arm is DECOUPLED as a .378 FOLLOW-ON, after the mechanism validates on the ladder.
# Capacity-floor guard: if the headroom rung floors at 0 on ARC-induction, the strong rung
# (MiniCPM5-1B) is the fallback, and/or the test falls back to the headroom domain (Sudoku control +
# a tractable ARC subset) -- a floored null is uninformative.
#
# HEADLINE EXPERIMENT (.377): verifier-certified RFT vs gold-SFT, held-out, on ARC-induction +
# a Sudoku positive control. RFT trains on DEMO-certified traces (the verifier's label-free signal,
# available at train time without test labels); SFT trains on TEST-gold traces (oracle labels).
# The claim under test: training on the verifier's cheap label-free signal does as well as / beats
# training on oracle labels -> you can self-improve WITHOUT oracle labels. Gate: RFT held-out gain
# over cold base with CI excl 0, AND RFT >= gold-SFT.
#
# DE-PRIORITIZED (preempt carry-forward churn): NO off-ARC-as-selector power grind (the execution
# primitive's role is now to LABEL training data); NO vc33 search (a WM-fidelity wall, parked);
# decentralization IS the distillation experiment, not a base-selection grind. KEPT: the demo-fit
# safety-gate as the shipped Phase-1 trust product; the ARC-accuracy + persistent-memory tracks
# (Deep-Think: move capital to distillation + search + memory).
#
# ROUTING: Codex-Default v2 (gemini BANNED). The RFT pipeline (corpus-build + GPU LoRA train + eval)
# is SPLIT per the long-codex-split rule and RESUMES per the accumulate-across-milestones rule
# (033e224d2): setsid-detached training survives the iteration boundary; checkpoint; report
# accumulated progress; retire only when the full corpus/train completes AND the gate fails.
# exp4076 archive = claude + opus + requires_claude_verified.
#
# OPERATOR REVIEW: the pivot is operator-endorsed; this roadmap operationalizes it. A north-star
# headline revision (verifier "selects" -> verifier "trains") is drafted separately as a proposal
# (ops/north-star-pivot-revision-proposal.md) for operator merge. Adjust freely.
milestone: "2026.06.377"
milestone_title: "TAKE THE PIVOT: verifier-as-REWARD, not verifier-as-SELECTOR. The .371-.375 evidence closed the selection question (the moat is a commodity; directional-not-significant off-ARC; the frontier-as-selector grind was spinning). The verifier's durable value is HYPOTHESIZED to be as an un-hallucinating REWARD that GENERATES training data (Deep-Think Q3; the Sudoku +1.1% signal is SUGGESTIVE-not-decision-grade, so .377 is a BET being tested, not a confirmed beachhead extended). HEADLINE (DE-CONFOUNDED per the 2026-06-12 review): a 3-arm test -- RFT-CORRECT (verifier-certified demo-perfect) vs RFT-ABLATION (verifier-label ablation: NOT-demo-perfect, same codex generator, N-matched) vs gold-SFT (oracle labels), held-out, on ARC-induction across a small-model LADDER. The LOAD-BEARING contrast is RFT-CORRECT vs RFT-ABLATION: does the VERIFIER'S LABEL carry training signal, or is 'RFT helps' just codex-distillation? (a Sudoku pipeline-sanity + a Phase-0 verifier-precision gate guard it) across a small-model LADDER (Qwen3.5-0.8B headroom rung + MiniCPM5-1B strong/SOTA rung, optional Qwen2.5-0.5B/3.5-2B -- run the contrast across bases so the claim is robust, not a single-model artifact; the gemma-12B sovereign-magnitude arm is a .378 follow-on)? Keep the shipped demo-fit safety-gate; keep ARC-accuracy (9th game) + memory; DROP the off-ARC-selector grind and the vc33 search. Capstone: did verifier-as-reward RFT beat gold-SFT held-out -- the pivot's first decision-grade result?"
milestone_doc: "docs/research-notes/verifier-as-self-improvement-reward-scoping.md"

