  - id: exp3598-diagnose-330-cascade-and-audit-auroc-1
    operator_override: "2026-05-29 operator directive (standing): per-milestone diagnostic/positive-control audit (Reading-Results + FALSE_NEGATIVE_RISK Discipline) — false-positive scope-match vs prior diagnose-* tasks; reads NEW .330 artifacts to characterize a NEW contamination, not a re-run."
    milestone: "2026.06.331"
    title: "Diagnose the .330 gate cascade + adversarially audit the exp3587 AUROC=1.0 grounding verifier (leak or real?) + enumerate the corpus-evidence gap and per-domain applicable verifiers"
    priority: critical
    max_turns: 50
    agent_type: gemini
    estimated_wall_time_min: 18
    track: evidence
    inference_substrate: aggregation_from_upstream_artifacts
    requires_gpu: false
    deliverable: results/experiment_3598_diagnose_330_cascade_audit.json
    prompt: |
      CONTEXT: a fair re-test cannot be trusted until the .330 contamination is characterized (Reading-Results
      + FALSE_NEGATIVE_RISK Discipline). This task establishes (a) the gate-cascade root cause, (b) whether
      the exp3587 AUROC=1.0 is a genuine signal or a label leak, (c) the corpus-evidence gap, (d) the
      per-domain structurally-applicable verifier sets. Its outputs are the spec the Phase-2/3 tasks consume.
      EXISTING CODE TO READ FIRST: results/experiment_3586/3587/3588/3589 via scripts/summarize_artifact.py
      AND raw JSON; scripts/conductor_gates.py (functions _eval_op + _coerce_gate_value -- the dict-vs-bare
      bug); data/realistic_factual_corpus_v1.jsonl (note its keys); python/carnot/verify/
      retrieval_nli_grounding_verifier.py (the exp3587 verifier); the verifier inventory under
      python/carnot/verify/ (factual-applicable: semantic_energy.py, nla_verifier_v3.py,
      canonical_answer_vericot_grounding_pilot_v1.py, suppressed_retrieval_probe.py, tier0g_semantic_energy.py,
      tier0u_logical_consistency.py, tier0v_set_consistency.py, tier0w_paraphrase_consistency.py,
      fover_semantic_calibration.py; code-applicable: ast_structure_verifier.py,
      code_structural_dependency_verifier.py, controlled_invariance_executor_v2.py,
      executable_monitor_runtime_adapter.py).
      CONCRETE STEPS:
        1. GATE CASCADE: confirm exp3586/3589 blocked_gate_check_failed and that exp3588 produced no
           artifact. Read the gates_evaluated block in exp3586 and show the actual value was a dict
           {{value:true,principle:...}} compared against bare true. State the forward rule: gated fields must
           be emitted bare.
        2. AUROC=1.0 AUDIT: inspect data/realistic_factual_corpus_v1.jsonl -- confirm it has NO independent
           evidence/reference column (only question/answer/is_hallucination/model_confidence). Read
           retrieval_nli_grounding_verifier.py and determine WHAT it grounded against. Adjudicate: is the
           1.0 a label leak / gold-answer-as-evidence / trivial separation (LEAK), or a defensible signal
           (REAL)? Default to LEAK if the verifier had access to anything correlated with the label.
        3. EVIDENCE GAP: state what a fair factual corpus must add -- an independent evidence passage held
           out from the gold label (e.g. the HaluEval QA `knowledge` field). Confirm whether HaluEval QA
           records (the exp3585 corpus_source) carry such a field.
        4. APPLICABLE VERIFIERS: enumerate, per domain (facts, code), the verifiers STRUCTURALLY APPLICABLE
           (could fire) vs STRUCTURALLY INERT. Output the per-domain applicable sets the fair test must use.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; store the VALUE):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "aggregation_from_upstream_artifacts (principle: reads .330 artifacts + source; no live inference)."
        gate_cascade_confirmed:
          principle: "Confirms the dict-vs-bare _eval_op mismatch took out exp3586/3588/3589 -- the operational root cause this milestone designs around."
        auroc_1_verdict:
          principle: "'leak' or 'real' for the exp3587 1.0 -- a 1.0 on a corpus with no evidence column is the IMPLAUSIBLE_PERFECT pattern; mislabeling it 'real' would propagate a fabricated factual claim."
        auroc_1_leak_mechanism:
          principle: "Names HOW the verifier reached 1.0 (gold-answer-as-evidence, label correlate, trivial separation) so the .331 grounding verifier avoids it."
        corpus_evidence_gap_confirmed:
          principle: "True iff the .330 corpus lacks an independent evidence column -- the precise gap exp3599 must close."
        halueval_has_knowledge_field:
          principle: "Whether HaluEval QA carries a held-out `knowledge` passage usable as independent evidence -- determines exp3599's corpus source."
        applicable_verifiers_facts:
          principle: "The factual-applicable verifier set a fair test must score -- the .329/.330 omission this milestone repairs."
        applicable_verifiers_code:
          principle: "The execution-applicable verifier set for the code re-test (the .330 code AUROC 0.44 means these never fired)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "gate_cascade_confirmed present AND auroc_1_verdict present AND applicable_verifiers_facts present AND applicable_verifiers_code present"
          principle: "The milestone cannot proceed to a fair re-test without the cascade root cause, the 1.0 adjudication, and the per-domain applicable verifier sets."
      TERMINAL VERDICTS: "complete: diagnosed_330_cascade_confirmed_auroc1_is_leak_evidence_gap_named_applicable_sets_enumerated" /
      "complete: diagnosed_330_cascade_confirmed_auroc1_is_real_applicable_sets_enumerated"
      Run: cd {project_root} && python scripts/experiment_3598_diagnose_330_cascade_audit.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3599-build-factual-corpus-v2-with-evidence
    prior_failures:
      - experiment_id: exp3585-build-realistic-factual-hallucination-corpus
        verdict: complete_realistic_factual_corpus_built_confidence_auroc_FF_headroom_confirmed
        addressed_by: "exp3585 built a corpus with NO independent evidence column ({{question,answer,is_hallucination,model_confidence}}), which is why exp3587's grounding verifier had nothing legitimate to ground against and leaked to AUROC=1.0. This task is DIFFERENT: it builds corpus v2 that CARRIES an independent evidence passage (the HaluEval QA `knowledge` field) held out from the gold label, AND validates the confidence baseline AUROC is in (0.5,0.95) -- real headroom AND a real grounding target."
        retire_if_same_verdict: false
    milestone: "2026.06.331"
    title: "Build factual corpus v2 WITH independent held-out evidence passages (HaluEval QA `knowledge`) + confidence headroom in (0.5, 0.95)"
    priority: critical
    max_turns: 60
    agent_type: gemini
    estimated_wall_time_min: 28
    track: evidence
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: results/experiment_3599_factual_corpus_v2_with_evidence.json
    prompt: |
      CONTEXT: the .330 factual corpus had no evidence column, so a grounding verifier could not honestly
      ground against anything (exp3587 leaked to AUROC=1.0). A fair factual test needs a corpus where each
      record carries an INDEPENDENT evidence passage (held out from the gold label) AND where model
      confidence is a MEDIOCRE detector (AUROC in (0.5,0.95) -- real headroom, not anti-correlated noise).
      Build corpus v2.
      EXISTING CODE TO READ FIRST: results/experiment_3598 (the diagnosis -- corpus_evidence_gap +
      halueval_has_knowledge_field) via scripts/summarize_artifact.py; scripts/experiment_template.py
      (cached_sota_pair() + BatchedInferenceRunner); data/realistic_factual_corpus_v1.jsonl (the v1 to
      IMPROVE on -- carry its records but ADD evidence).
      PRECONDITIONS (step 0, check BEFORE any generation):
        a. PREFER a labeled corpus that already ships evidence: if a HaluEval QA / FELM / FEVER / SHROOM file
           with per-record reference/knowledge passages is on disk OR fetchable via `curl -sf` to a public
           dataset URL, use its `knowledge`/`evidence`/`reference` field. Check
           `curl -sf -o /dev/null https://huggingface.co/api/datasets` for network.
        b. ELSE generate answers but attach retrieved evidence: verify a SOTA GGUF is cached --
           `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/` (or gemma-4-31B-it-GGUF /
           gemma-4-26B-A4B-it-GGUF) returns non-empty. If neither an evidence-bearing corpus nor a cached
           model is available -> honest_verdict "complete: blocked_no_evidence_corpus_and_no_cached_sota_model".
        c. If generating, CUDA/llama.cpp loadable:
           `python -c "from carnot.inference.sota_models import cached_sota_pair; assert cached_sota_pair(gpu_indices=(0,1))"`.
           If not -> "complete: blocked_sota_model_not_loadable".
      CONCRETE STEPS:
        1. Assemble >= 200 records, EACH carrying {{question, answer, is_hallucination, model_confidence,
           evidence_passage}}. REJECT the .330 placeholder corpus: if any record's `answer` matches the
           regex `^[RH]\d+$` (the toy R1/R2/H1/H2 label-tokens that leaked into exp3587's 1.0) or
           `question` matches `^Q\d+$`, the corpus is synthetic-degenerate -- do NOT use it; fetch or
           generate REAL factual records instead. The evidence_passage MUST be independent of the gold
           label (a real knowledge/reference passage, NOT the gold answer string, NOT the is_hallucination
           flag). If generating answers with a mandated SOTA GGUF (MODEL_SPECS MUST include >=1 of
           Qwen3.6-35B-A3B-GGUF / gemma-4-31B-it-GGUF / gemma-4-26B-A4B-it-GGUF via cached_sota_pair),
           include genuinely confident-but-wrong hallucinations (NOT random/empty strings).
        2. SANITY GATE A (headroom): compute the model-confidence / sequence-logprob AUROC. It MUST be in
           (0.50, 0.95). A value <= 0.50 (anti-correlated, like the v1 0.4573) OR >= 0.95 (no headroom)
           means the corpus or the confidence extraction is degenerate -- report honestly and do NOT ship.
        3. SANITY GATE B (evidence independence + real content): verify the evidence_passage does NOT
           contain the gold answer verbatim and is not a function of is_hallucination -- so a grounding
           verifier cannot leak. ALSO assert the records carry real factual text (answers are not the
           `^[RH]\d+$` placeholder tokens) -- a leak-free but vacuous corpus is still degenerate.
        4. Persist to data/realistic_factual_corpus_v2.jsonl with class balance recorded.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; the two gated fields corpus_v2_is_realistic and
      corpus_v2_has_evidence MUST be stored as BARE top-level booleans, NOT {{value,principle}} dicts, so the
      downstream gated_on checks succeed -- this is the .330 cascade fix):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "live_llm_inference (principle: declares live SOTA generation, 60s floor, if generated; honest about compute)."
        preconditions_checked:
          principle: "Records which resources were verified before generation -- pre-empts fabrication-when-resource-missing."
        corpus_source:
          principle: "Provenance: fetched dataset name+URL+field or generated-by-MODEL -- audit trail for the corpus and its evidence."
        n_examples:
          principle: "Sample-size rigor; >=200 for a percentage-point AUROC claim downstream."
        n_hallucinated:
          principle: "Class balance -- an AUROC on a 99/1 split is uninformative."
        n_correct:
          principle: "Class balance."
        confidence_baseline_auroc_on_corpus:
          principle: "THE realism gate: must be in (0.5,0.95) so verifiers have headroom AND confidence is not anti-correlated noise."
        evidence_independent_of_label:
          principle: "True iff the evidence passage does not leak the gold answer / label -- the precondition that prevents the exp3587 AUROC=1.0 leak from recurring."
        corpus_v2_has_evidence:
          principle: "BARE bool. True iff every record carries an independent held-out evidence passage -- gates exp3600. STORE AS BARE true/false."
        corpus_v2_is_realistic:
          principle: "BARE bool. True iff confidence_baseline_auroc_on_corpus in (0.5,0.95) AND evidence_independent_of_label -- gates exp3601. STORE AS BARE true/false."
        model_specs:
          principle: "Names the SOTA GGUF actually invoked (or the dataset) -- methodology traceability."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection across replications."
        duration_s:
          principle: "Plausibility floor -- live 35B generation cannot complete in <60s."
      ACCEPTANCE GATE:
        - condition: "n_examples >= 200 AND corpus_v2_has_evidence == true AND corpus_v2_is_realistic == true"
          principle: "A fair factual corpus is defined by independent held-out evidence AND confidence headroom; without both, the downstream grounding test repeats the .330 contamination."
      TERMINAL VERDICTS: "complete: factual_corpus_v2_built_with_held_out_evidence_confidence_headroom_confirmed" /
      "complete: corpus_v2_degenerate_confidence_out_of_band_or_evidence_leaks_factual_test_blocked" /
      "complete: blocked_<resource>"
      Run: cd {project_root} && python scripts/experiment_3599_factual_corpus_v2_with_evidence.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3600-real-nli-grounding-verifier
    operator_override: "2026-05-29 operator directive (standing): versioned verifier continuation with a STATED forward difference (the exp3587 grounding verifier used a text-statistical proxy and leaked to AUROC=1.0; this build uses a REAL NLI model scored against HELD-OUT evidence) — false-positive scope-match vs the exp3587 grounding-verifier build."
    milestone: "2026.06.331"
    title: "Build a REAL NLI-model atomic-claim factual-grounding verifier (HalluSearch/VeriScore recipe) scored against HELD-OUT evidence + honest eval vs confidence"
    priority: high
    max_turns: 60
    agent_type: gemini
    estimated_wall_time_min: 28
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: true
    gated_on:
      - upstream: exp3599-build-factual-corpus-v2-with-evidence
        artifact_field: corpus_v2_has_evidence
        op: '=='
        value: true
    deliverable: results/experiment_3600_real_nli_grounding_verifier.json
    prompt: |
      CONTEXT: the exp3587 grounding verifier reached AUROC=1.0 because it had no independent evidence to
      ground against (label leak) and used a text-statistical proxy, not a real NLI model. This task builds
      the verifier HONESTLY: decompose the answer into atomic claims -> retrieve evidence FROM THE CORPUS v2
      held-out evidence_passage (NEVER the gold answer / label) -> NLI entailment per claim with a REAL
      entailment model -> energy = fraction of unentailed/contradicted claims. This is the HalluSearch /
      VeriScore SOTA recipe (arXiv:2504.10168 / 2406.19276).
      VERIFIER AUTHENTICITY (CLAUDE.md -- MANDATORY): the implementation MUST match its docstring. If it
      claims NLI, it MUST invoke a real entailment model (a small DeBERTa/MiniLM-NLI checkpoint via
      transformers) OR be an HONEST text-statistical proxy with the gap DISCLOSED in the docstring per the
      pcib_probe.py pattern -- and record which path in nli_substrate. NO np.random features, NO
      sleep-padding, NO score-capping, NO min(score,0.99). Name it RetrievalNLIGroundingVerifier for what it
      does. An AUROC of exactly 1.0 on n>=200 is a RED FLAG -- if you see it, the evidence is leaking; fix
      the retrieval to exclude any label-correlated text and report the honest (lower) number.
      EXISTING CODE TO READ FIRST: results/experiment_3598 (auroc_1_leak_mechanism) + 3599 (the corpus v2
      path + evidence schema) via scripts/summarize_artifact.py; python/carnot/verify/
      retrieval_nli_grounding_verifier.py (the leaky exp3587 verifier -- FIX it, do not duplicate),
      canonical_answer_vericot_grounding_pilot_v1.py, suppressed_retrieval_probe.py, semantic_energy.py;
      CLAUDE.md "Verifier Authenticity Discipline".
      PRECONDITIONS (step 0):
        a. data/realistic_factual_corpus_v2.jsonl present with an evidence_passage field (exp3599). If not
           -> "complete: blocked_corpus_v2_unavailable".
        b. An NLI checkpoint loadable (e.g. `python -c "from transformers import AutoModelForSequenceClassification"`
           + a cached cross-encoder/nli checkpoint) OR fall back to a DISCLOSED text-statistical entailment
           proxy. Record which path in nli_substrate; never fabricate a model run.
      CONCRETE STEPS:
        1. Fix/implement python/carnot/verify/retrieval_nli_grounding_verifier.py: atomic-claim split ->
           evidence = corpus v2 evidence_passage ONLY (assert the gold answer is NOT in the evidence) ->
           per-claim entailment with the real NLI model (or disclosed proxy) -> aggregate energy. Honest
           docstring matching the implementation.
        2. Score it on corpus v2; error-detection AUROC (label=is_hallucination) + >=3 seeds + bootstrap CI.
        3. Compare vs (a) model-confidence baseline (exp3599), (b) the best existing factual verifier.
        4. Measure the ensemble WITH the new verifier vs WITHOUT (ablation).
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; the gated field grounding_leak_free MUST be a BARE
      top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores against the cached corpus; the NLI model is a verifier component, not the FoVer LLM)."
        nli_substrate:
          principle: "Declares model-based NLI vs disclosed text-statistical proxy -- verifier-authenticity honesty (implementation matches docstring)."
        evidence_excludes_gold_answer_assert:
          principle: "Asserts the retrieved evidence never contains the gold answer -- the explicit guard against the exp3587 leak."
        grounding_verifier_auroc:
          principle: "The new verifier's standalone factual signal + CI (an exact 1.0 here is a leak, not a win)."
        confidence_baseline_auroc:
          principle: "Strong baseline to beat or augment."
        best_existing_factual_verifier_auroc:
          principle: "Shows whether the new build adds signal the existing verifiers lacked."
        ensemble_with_grounding_auroc:
          principle: "Ensemble incl. the new verifier -- the additive-value test."
        ensemble_without_grounding_auroc:
          principle: "Ablation baseline -- isolates the grounding verifier's contribution."
        grounding_adds_factual_signal:
          principle: "True iff the grounding verifier's AUROC CI excludes 0.5 AND ensemble_with > ensemble_without -- the core build-success signal."
        grounding_leak_free:
          principle: "BARE bool. True iff evidence excludes the gold answer AND AUROC < 0.99 (not implausibly perfect) -- gates trust in the factual row. STORE AS BARE true/false."
        n_examples:
          principle: "Sample-size rigor (>=200)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "grounding_verifier_auroc present AND ensemble_with_grounding_auroc present AND ensemble_without_grounding_auroc present AND grounding_leak_free == true"
          principle: "The build is judged by a leak-free, NLI-grounded verifier giving the ensemble factual signal it structurally lacked -- measured as an ablation, not asserted, and never via a leaking 1.0."
      TERMINAL VERDICTS: "complete: real_nli_grounding_verifier_adds_leak_free_factual_signal" /
      "complete: real_nli_grounding_verifier_built_but_factual_signal_weak_facts_remain_hard" /
      "complete: blocked_corpus_v2_unavailable"
      Run: cd {project_root} && python scripts/experiment_3600_real_nli_grounding_verifier.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3601-corrected-cross-domain-remeasurement
    prior_failures:
      - experiment_id: exp3588-corrected-cross-domain-remeasurement
        verdict: blocked_gate_check_failed
        addressed_by: "exp3588 NEVER RAN -- it blocked because its upstream exp3586 cascade-failed on the dict-vs-bare gate bug. This task fixes the root cause (every gated field is now a BARE bool from exp3599) AND uses the genuinely fair apparatus exp3588 lacked: corpus v2 with held-out evidence (exp3599), the real NLI grounding verifier (exp3600), and execution-applicable verifiers re-wired on the code row. New gate plumbing + new corpus + new verifier composition + a valid positive control = the fair re-measurement, not a re-run."
        retire_if_same_verdict: false
      - experiment_id: exp3576-verifier-cross-domain-synthesis
        verdict: complete_verifier_cross_domain_synthesis_value_generalizes_math_only_domain_bound
