- id: exp2444-nco-negative-constraint-decoding
  title: 'Phase 3: NCO Negative Constraint Decoding (arXiv:2605.10065) -- WFSA-Based Constraint Rejection'
  milestone: 2026.05.236
  deliverable: results/experiment_2444_nco_negative_constraint.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2276-projected-langevin-baseline
    verdict: complete_projected_langevin_kl_delta_positive
    addressed_by: "exp2276 implemented Projected-Langevin as a SAMPLER (arXiv:2605.05387). NCO (arXiv:2605.10065)\
      \ is a CONSTRAINED DECODING technique using Weighted Finite State Automata — completely different approach,\
      \ different paper, different mechanism. Langevin methods sample from distributions; NCO rejects tokens at\
      \ decode time via finite automaton. The scope is decoding-time constraint rejection, not sampling. Genuinely\
      \ new scope with no prior attempt."
    retire_if_same_verdict: false
  prompt: "CONTEXT: NCO (Negative Constraint Optimization, arXiv:2605.10065) uses Weighted\nFinite State Automata (WFSA) to\
    \ represent negative constraints (patterns that MUST NOT\nappear in model output). The WFSA efficiently rejects tokens that\
    \ would complete a forbidden\npattern at decode time, without requiring energy evaluation.\n\nApplication to Carnot: encode\
    \ NSVIF Z3 UNSAT patterns as negative constraints in a WFSA.\nWhen a response token would complete a known hallucination-inducing\
    \ sequence, the WFSA\nrejects it. This is a complementary mechanism to MH-based energy filtering (exp2442/2443).\n\nThis\
    \ is a NEW scope: no NCO implementation exists in the codebase.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/nsvif_z3_extractor.py\
    \ (Z3 extractor for UNSAT patterns)\n  {project_root}/results/constraint_patterns_v4.json (if exists, from exp2425)\n  {project_root}/python/carnot/pipeline/mch_fst_filter.py\
    \ (FST pipeline reference)\n\nTASK: Implement NCOConstraintDecoder and evaluate on 20 telemetry entries.\n\nCONCRETE STEPS:\n\
    \  0. PRECONDITIONS:\n     a. z3-solver importable: .venv/bin/python -c \"import z3; print(z3.get_version_string())\"\n\
    \     b. Telemetry manifest:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n       \
    \ If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n     c. NSVIF importable:\n        .venv/bin/python\
    \ -c \"from carnot.verify.nsvif_z3_extractor import NSVIFExtractor; print('OK')\"\n\n  1. Implement NCOConstraintDecoder\
    \ at python/carnot/pipeline/nco_decoder.py:\n     WFSA representation (CPU-feasible, no GPU needed):\n       Negative constraint\
    \ patterns: extract UNSAT constraint cores from constraint_patterns_v4.json\n         (or from first 5 UNSAT telemetry examples\
    \ if patterns file missing).\n       WFSA states: {{INITIAL, TRACKING_k, REJECTED}} for each negative pattern k.\n     \
    \  For each token in response:\n         Check if token continues any tracked negative pattern.\n         If pattern k completes:\
    \ assign rejection_score += 1.\n     Output: nco_rejection_score, n_patterns_fired, wfsa_states_visited.\n\n  2. Evaluate\
    \ on 20 telemetry entries:\n     nco_constraint_rejection_rate: fraction of hallucinating entries where NCO fires\n     \
    \  (rejection_score > 0 AND label=hallucination).\n     nco_false_positive_rate: fraction of clean entries where NCO fires\n\
    \       (rejection_score > 0 AND label=clean).\n     nco_auroc: AUROC of nco_rejection_score vs ground truth labels.\n \
    \    n_patterns_used: number of WFSA patterns loaded.\n\n  3. Compare vs NSVIF baseline:\n     nco_vs_nsvif_tpr_delta:\
    \ difference in TPR at FPR=0.1 threshold.\n\n  4. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/pipeline/\
    \ -k \"nco\" -v --no-cov 2>&1 | tail -15\n     Create test if none exists.\n\n  5. Write deliverable.\n\nREQUIRED ARTIFACT\
    \ FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - nco_validated:\n      principle: \"\
    True if NCOConstraintDecoder ran on real telemetry.\"\n  - nco_auroc:\n      principle: \"AUROC of NCO rejection score.\
    \ Primary metric.\"\n  - nco_constraint_rejection_rate:\n      principle: \"Fraction of hallucinating entries where NCO\
    \ correctly fires.\"\n  - nco_false_positive_rate:\n      principle: \"Fraction of clean entries where NCO incorrectly\
    \ fires.\"\n  - n_patterns_used:\n      principle: \"Number of WFSA patterns. Zero patterns = degenerate result.\"\n  -\
    \ n_eval_examples:\n      principle: \"Must be 20.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n\
    \      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n      principle: \"Records z3, telemetry,\
    \ nsvif checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"nco_validated == true AND n_patterns_used > 0\"\n    principle:\
    \ \"NCO must run with real WFSA patterns — zero patterns is degenerate.\"\n  - condition: \"nco_auroc != null AND n_eval_examples\
    \ >= 15\"\n    principle: \"Must produce valid AUROC on sufficient data.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

