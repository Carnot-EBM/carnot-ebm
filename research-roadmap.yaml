milestone: 2026.06.437
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-25, operator-directed pre-stage "structural-alignment goal +
  action-effect model for .437"). Grounded in the 2026-06-25 end-to-end measurement (proto_l2_measure_fixstack
  v2, commit 611183119): with the truncation fix + goal-repair + split-fallback all shipped, lp85 L2 STILL does
  not bank, and the induction breakdown is decisive -- [0] the FREE-FORM LLM engine is only 0.12 held-out
  accurate (world_model_accuracy_below_threshold; the model writes a placeholder engine that does not capture
  lp85 click dynamics), [1] the L2 induction still proposer_failed. The binding wall is MODEL-CAPABILITY /
  induction-quality on the REAL prompts, not prompt-engineering (a budget bump and the split are both confirmed
  insufficient alone). .437 attacks the two structural levers, BOTH non-greenfield with existing scaffolding:
  A1 wires the EXISTING structured ProductWorldModel (programmatic object experts) as the dynamics engine,
  replacing the 0.12-accurate free-form codex engine; A2 fixes the EXISTING perception-grounded
  structural-alignment goal detector (arc_value_learner.py) whose over-segmentation (goal_count=42,
  aligned_piece_count=0) made exp4712 null (l2_perception_goal_no_deepening_residual_alignment_under_determined).
  A3 self-play banks +1 reproducible level + trains the verifier (Level-Up Guarantee). A4 held-out readiness
  (reuses the exp4729 checkpoint/resume soft-budget so it survives the codex 4800s cap). A5 persist+transfer,
  A6 SUBMITTED_AGENT_CONFIG. INFRA: B1 silent-bug audit of the .428-.433 generation-lever nulls (the operator
  note that _frame_grid/dict-candidate-class no-ops may lurk); B2 submission-package readiness (deadline-critical).
  C KV260 continuity. D SOTA-ingestion (the .438 frontier). E capstone. verifier_is_oracle:false on every value
  claim; solve_provenance on every solve; submission operator-only. 5 days to the ARC Prize Milestone #1
  deadline (2026-06-30).
milestone_title: 'FIX THE INDUCTION-QUALITY WALL: structured action-effect engine (replace the 0.12-accurate
  free-form codex engine with the existing ProductWorldModel programmatic experts) + the perception-grounded
  structural-alignment goal detector (resolve the over-segmentation that nulled exp4712). The 2026-06-25
  end-to-end measurement proved prompt-only levers (truncation/split/budget) are insufficient -- the wall is
  model-capability / induction-quality on real lp85 prompts. A3 self-play banks +1. A4 held-out readiness
  (cap-robust). INFRA B1 silent-bug audit, B2 submission-package readiness. C KV260. D SOTA. E capstone.'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  The .436 end-to-end measurement (proto_l2_measure_fixstack v2) is the grounding: every prompt-engineering
  lever for the L2 reinduction (truncation fix, goal-repair, separate-focused-goal-call split) is shipped and
  adversarially verified SOUND, yet lp85 L2 still does not bank. The induction breakdown shows two
  model-capability walls -- a 0.12-accurate free-form ENGINE and a still-failing L2 goal induction -- where the
  synthetic prompts masked the model's tendency to ramble placeholder code on the real 9290-char prompts.
  CRITICALLY, both .437 levers already have scaffolding and must NOT be rebuilt from scratch (doomed reruns):
  (1) a structured dynamics engine with the exact (grid,action,data)->next_grid signature already exists
  (ProductWorldModel.engine, arc_executable_world_model.py:427) fed by induce_programmatic_object_experts
  (:331); A1 wires it as load_engine in the live level-up reinduction in place of e3.load_engine's free-form
  codex engine. (2) the perception-grounded structural-alignment goal pipeline already exists end-to-end
  (arc_value_learner.py detect_marker_pair_shape_alignment:752 + structural_alignment_goal_candidate:845, wired
  at arc_competition_agent.py:2480-2504) but nulled in exp4712 because the detector over-segments lp85's frame
  (goal_count=42, aligned_piece_count=0, residual=alignment_under_determined); A2 fixes the detector
  segmentation/pairing, with the sanctioned fallback being the multi-exemplar variant (NOT the retired CNN
  driver). Both carry prior_failures. RETIRED (do NOT re-propose): the .435 online-action-learning driver
  (validly tested null); macro-action/horizon-collapse + click-heatmap-as-generator; single-exemplar goal-fix
  (exp4664) and goal-free Go-Explore deepening; a pure prompt-engineering retry of the L2 induction (confirmed
  insufficient 2026-06-25). 5 days to the ARC Prize Milestone #1 deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC (A1-A6); >=1
  level-up attempt that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee -- A3 self-play bank +
  A1/A2 L2 gates); self-play EVERY milestone (A3 trains+checkpoints the verifier); 2 reserved infra (B1
  silent-bug audit + B2 submission-package readiness); 1 per-board hardware (C/KV260); 1 SOTA-ingestion (D). All
  experiments codex/gpt-5.5; planner/retro stay Claude Opus. The frozen live generator is Qwen3.5-9B-MTP on the
  iGPU (NEVER the 3090s); live tasks declare live_llm_inference + construct the proposer on a FREE port +
  /props-verify Qwen (the port-8919 gemma-squat confound). 5 days to the deadline ($25K)."

