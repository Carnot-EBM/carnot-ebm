  - id: exp2253-archive-and-activate
    title: "Phase 0: Archive .222 and activate .223"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2253_archive.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 20
    prior_failures:
      - experiment_id: exp2239-archive-and-activate
        verdict: complete
        addressed_by: "Standard archive pattern; each milestone archive is genuinely new scope (different source milestone). Not a failed rerun."
    prompt: |
      CONTEXT: Milestone 2026.05.222 has completed. We must prepare for 2026.05.223.
      EXISTING CODE TO READ FIRST: {project_root}/research-complete.yaml, {project_root}/research-roadmap.yaml
      TASK: Archive 2026.05.222 to research-complete.yaml and initialize the .223 milestone in ops/changelog.md.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. Verify {project_root}/research-roadmap.yaml exists and contains milestone: "2026.05.222".
           If the file is missing or has the wrong milestone, write honest_verdict blocked_roadmap_missing and exit.
        1. Append all tasks from research-roadmap.yaml under a new "2026.05.222" entry in research-complete.yaml,
           setting completed_date to {date}.
        2. Replace research-roadmap.yaml contents with the new milestone structure from research-roadmap-next.yaml.
        3. Add a "## {date} (Milestone 2026.05.223 Operational Retrospective)" stub in ops/changelog.md.
