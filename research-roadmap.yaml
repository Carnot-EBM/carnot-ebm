- id: exp1080-semenergy-probe-v1
  milestone: 2026.04.84
  deliverable: results/experiment_1080_semenergy_probe_v1.json
  title: "SemEnergy Probe v1 — Tier 0c Logit-Space Energy Detector (arXiv 2508.14496)"
  prompt: |
    CONTEXT:
    arXiv 2508.14496 (Semantic Energy, August 2025) proposes detecting LLM hallucinations
    by computing a Boltzmann-inspired energy distribution on pre-softmax logits (penultimate
    layer), rather than post-softmax probabilities. Key insight: semantic entropy fails because
    softmax compression hides uncertainty; logit-space energy exposes it.

    This maps directly to Carnot's Tier 0c NUP Probe (bigram dot product on logits). This
    experiment UPGRADES Tier 0c with the Semantic Energy approach and evaluates on FoVer corpus.

    TARGET: AUROC > 0.70 on FoVer corpus (must beat random by a wide margin).
    CONSTRAINT: Inference time < 5ms per example (must be faster than Ising tier).

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/ (find the Tier 0c NUP probe implementation — look for "nup" or "bigram")
    - python/carnot/pipeline/verify_repair.py (how Tier 0c integrates into cascade)
    - data/fover_corpus_v4.json (6548 labeled pairs for evaluation)
    - results/experiment_1072_sos_kan_v3_neural_gram.json (AUROC=0.9545 — the bar to beat)

    TASK:
    1. FIND EXISTING TIER 0C:
       grep -rn "NUP\|nup\|bigram\|tier_0c\|Tier0c" python/carnot/ | head -20
       Read the existing implementation to understand current approach.

    2. IMPLEMENT SemEnergy PROBE:
       Create python/carnot/verify/semenergy_probe.py:

       class SemEnergyProbe:
           """
           Computes Boltzmann-inspired energy from pre-softmax logits.
           Per arXiv 2508.14496: E(x) = -log Z(x) where Z(x) = Σ_k exp(l_k / T)
           and l_k are the top-K penultimate-layer logits.
           Lower energy = model is confident = less likely hallucination.
           """
           def __init__(self, temperature=1.0, top_k=50):
               self.temperature = temperature
               self.top_k = top_k

           def compute_energy(self, logits: np.ndarray) -> float:
               """logits: (vocab_size,) pre-softmax logit vector for one token position"""
               top_logits = np.sort(logits)[-self.top_k:]
               log_z = np.log(np.sum(np.exp(top_logits / self.temperature)))
               return -log_z  # high energy = uncertain = potential hallucination

           def score_response(self, token_logits: list[np.ndarray]) -> float:
               """token_logits: list of per-token logit vectors. Returns mean energy."""
               energies = [self.compute_energy(l) for l in token_logits]
               return float(np.mean(energies))

    3. EVALUATE ON FOVER CORPUS:
       - Load data/fover_corpus_v4.json (6548 pairs)
       - For each pair: use stored logits if available, else simulate with Gaussian approx
         (Note: FoVer pairs have Z3-confirmed labels but may not have stored logits;
          if no logits: use response text statistics as proxy — e.g. response entropy from
          character-level distribution as a stand-in, clearly labeled as "logit_proxy")
       - Compute AUROC (sklearn.metrics.roc_auc_score)
       - Measure inference time per example

    4. COMPARE TO EXISTING TIERS:
       - Tier 0c NUP baseline AUROC (read from existing test results or recompute)
       - SemEnergy AUROC
       - SOS-KAN v3 AUROC (0.9545 from exp1072)
       - Report ranking

    5. WRITE TESTS (at least 4):
       tests/python/test_semenergy_probe.py:
       - semenergy_higher_for_uncertain_outputs
       - semenergy_lower_for_confident_outputs
       - semenergy_inference_time_under_5ms
       - semenergy_auroc_above_07_on_fover_proxy (may use proxy if no logits available)

    CONCRETE STEPS:
    - grep -rn "NUP\|nup\|bigram\|Tier0c" python/carnot/ | head -20
    - (read existing Tier 0c implementation)
    - (implement python/carnot/verify/semenergy_probe.py)
    - python -c "import json; d=json.load(open('data/fover_corpus_v4.json')); print(len(d), list(d[0].keys())[:5])"
    - JAX_PLATFORMS=cpu python scripts/experiment_1080_semenergy_probe_v1.py
    - pytest tests/python/test_semenergy_probe.py -v
    - Write results/experiment_1080_semenergy_probe_v1.json

    ARTIFACT FIELDS:
    - existing_tier_0c_auroc: float (or null if not found)
    - semenergy_auroc: float
    - auroc_vs_target: float (semenergy_auroc - 0.70)
    - inference_time_ms_per_example: float (must be < 5.0)
    - logit_mode: str ("real_logits" | "logit_proxy")
    - comparison_sos_kan_v3: float (0.9545)
    - tests_passing: int
    - honest_verdict: "semenergy_above_target_fast" | "semenergy_above_target_slow" | "semenergy_below_target" | "logit_proxy_only_needs_real_logits" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1080_semenergy_probe_v1.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

