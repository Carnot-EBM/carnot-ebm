milestone: 2026.05.146
milestone_title: "Research-Deep: Phase 6 Advanced Constraint Elicitation and Semantic Pruning"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"

tasks:
  - id: exp1864-roce-prototype
    title: "Exp 1864: Reasoning-Time Open Constraint Elicitation (ROCE) prototype"
    deliverable: "results/experiment_1864_roce.json"
    prompt: |
      CONTEXT: We must bridge the gap between natural language user instructions and rigid Carnot verifiers. ROCE extracts verifiable logic dynamically during generation.
      EXISTING CODE TO READ FIRST: python/carnot/verify/, python/carnot/pipeline/
      TASK: Implement an open constraint elicitation prototype that extracts structured logic from unconstrained SOTA generation.
      CONCRETE STEPS:
      1. Create `python/carnot/verify/roce_extractor.py`.
      2. Implement a method to extract dynamic verifiable logic from `unsloth/Qwen3.6-35B-A3B-GGUF` natural language output.
      3. Evaluate the extraction success rate on a 20-prompt dataset.
      4. Save output to `{project_root}/results/experiment_1864_roce.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1865-roce-z3-gate
    title: "Exp 1865: Gate ROCE outputs through Z3 with zero false accepts"
    deliverable: "results/experiment_1865_roce_z3.json"
    gated_on:
      - upstream: exp1864-roce-prototype
        artifact_field: "status"
        op: "=="
        value: "success"
    prompt: |
      CONTEXT: The dynamic constraints from ROCE must be deterministic and verifiable.
      EXISTING CODE TO READ FIRST: python/carnot/verify/roce_extractor.py, python/carnot/verify/z3_verifier.py
      TASK: Pipe the output of ROCE to the Z3 verifier to ensure strict deterministic gate checking.
      CONCRETE STEPS:
      1. Connect `roce_extractor.py` output to Z3 formulation.
      2. Test over the 20-prompt dataset to ensure 0% false accepts on constraint checking.
      3. Save output to `{project_root}/results/experiment_1865_roce_z3.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1866-latent-energy-pruning
    title: "Exp 1866: Implement Latent Energy Optimization for Semantic Pruning"
    deliverable: "results/experiment_1866_latent_pruning.json"
    agent_type: "codex"
    prompt: |
      CONTEXT: FR-11 continuous self-learning loops suffer from catastrophic forgetting without efficient pruning.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verification_learning.py, python/carnot/memory/
      TASK: Implement a semantic pruning mechanism that uses latent EBM optimization to discard redundant constraint memories.
      CONCRETE STEPS:
      1. Create `python/carnot/memory/semantic_pruning.py`.
      2. Implement the pruning logic based on semantic similarity of EBM embeddings.
      3. Write `tests/python/test_semantic_pruning.py` with 100% coverage.
      4. Save output to `{project_root}/results/experiment_1866_latent_pruning.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1867-fr11-scale-moe
    title: "Exp 1867: Scale FR-11 self-learning with latent pruning on SOTA MoE"
    deliverable: "results/experiment_1867_fr11_moe.json"
    gated_on:
      - upstream: exp1866-latent-energy-pruning
        artifact_field: "status"
        op: "=="
        value: "success"
    prompt: |
      CONTEXT: Testing the FR-11 learning loop with semantic pruning at SOTA scale.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/, python/carnot/memory/semantic_pruning.py
      TASK: Execute the FR-11 continual learning loop using `unsloth/Qwen3.6-35B-A3B-GGUF`.
      CONCRETE STEPS:
      1. Ensure MODEL_SPECS includes the MoE model.
      2. Run the loop to add constraint memories and trigger semantic pruning.
      3. Track memory retention and memory size bounds.
      4. Save output to `{project_root}/results/experiment_1867_fr11_moe.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1868-ltlzinc-forgetting-check
    title: "Exp 1868: Evaluate catastrophic forgetting on the MoE using LTLZinc"
    deliverable: "results/experiment_1868_ltlzinc.json"
    prompt: |
      CONTEXT: The semantic pruning mechanism must guarantee zero catastrophic forgetting.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/, python/carnot/memory/
      TASK: Use LTLZinc constraint evaluations to check for memory retention on the pruned memory traces.
      CONCRETE STEPS:
      1. Load the updated FR-11 memory.
      2. Run evaluations using temporal LTLZinc constraints.
      3. Record the nonforgetting rate (must be 1.0).
      4. Save output to `{project_root}/results/experiment_1868_ltlzinc.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1869-hiled-simulator
    title: "Exp 1869: Implement HILED (Hardware-In-The-Loop Energy Decoding) Simulator"
    deliverable: "results/experiment_1869_hiled.json"
    agent_type: "codex"
    prompt: |
      CONTEXT: Hardware integration must not be post-hoc. HILED integrates energy scoring tightly into autoregressive decoding.
      EXISTING CODE TO READ FIRST: python/carnot/inference/, hardware/kv260/
      TASK: Implement a CPU-based HILED simulator that mimics FPGA-based Gibbs/Potts sampling during decoding.
      CONCRETE STEPS:
      1. Create `python/carnot/inference/hiled_simulator.py`.
      2. Inject the simulator into the logprob rejection sampler.
      3. Measure the theoretical efficiency gains and constraint enforcement.
      4. Save output to `{project_root}/results/experiment_1869_hiled.json`.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

