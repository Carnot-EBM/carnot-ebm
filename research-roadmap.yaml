        positive_control_passed: principle "BARE BOOL — the positive control; must be true (best held-out AR in [0.4,0.95]) before any ARTIFACT/FUNDAMENTAL verdict."
        ar_best_accuracy: principle "Positive control value — in [0.4,0.95]; AR<0.3 means no headroom and INCONCLUSIVE (the v2 trap)."
        ebt_argmin_accuracy: principle "Greedy energy-argmin decode accuracy — the BOUNDED baseline (~0.0 in the scaled run)."
        ebt_beam_accuracy: principle "Global discrete beam-search accuracy — THE decisive probe; high => ARTIFACT, ~0 => FUNDAMENTAL."
        adjudication: principle "ARTIFACT | FUNDAMENTAL | INCONCLUSIVE — the Phase-3 generation verdict."
        matched_flops_ratio: principle "EBT/AR inference-FLOP ratio — a win only counts at equal compute (the P0.1 lesson)."
