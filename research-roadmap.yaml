- id: exp1352-truncproof-xgrammar-certificate-completion-preflight
  milestone: 2026.04.105
  deliverable: results/experiment_1352_truncproof_xgrammar_certificate_completion_preflight.json
  title: "TruncProof/XGrammar Certificate Completion Preflight - Gated SOTA Run Allowance"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 35
  priority: high
  requires_gpu: false
  gated_on:
    - upstream: exp1351-104-carryforward-artifact-integrity-audit
      artifact_field: terminal_certificate_required
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1340-triggered-certificate-extraction-v6-sota-gguf-semantic-guard
      verdict: missing_terminal_artifact_after_gate_order_failure
      addressed_by: "Run a local completion-budget and dynamic-branch preflight before spending GPU time on the replacement SOTA certificate experiment."
      retire_if_same_verdict: true
    - experiment_id: exp1339-xgrammar2-tagdispatch-certificate-grammar-dryrun
      verdict: dynamic_grammar_ready_but_xgrammar_absent_and_no_completion_budget_measure
      addressed_by: "Extend the dry-run with TruncProof-style max-token completion checks and an explicit SOTA run allowance field."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The .104 dynamic grammar dry-run supported SAT, UNSAT, UNKNOWN, and repair
    branches, but exp1340 did not run. The 2026 literature sweep added
    TruncProof and XGrammar-2 as evidence that completion-budget checks should
    precede any expensive constrained generation. Use {project_root} as the
    project root and {date} as the run date in artifact metadata.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - results/experiment_1339_xgrammar2_tagdispatch_certificate_grammar_dryrun.json
    - results/experiment_1351_104_carryforward_artifact_integrity_audit.json
    - python/carnot/
    - scripts/experiment_template.py
    - openspec/capabilities/pipeline/spec.md

    TASK:
    Perform a CPU-only certificate grammar and token-budget preflight. Do not
    call SOTA models. The output must say whether exp1353 is allowed to spend
    GPU time or should be blocked terminally.

    REQUIRED ARTIFACT FIELDS:
    - status
    - grammar_states
    - min_completion_tokens_by_state
    - max_token_budget_sufficient
    - structural_tag_supported
    - xgrammar_backend_available
    - dynamic_dispatch_preserved
    - sota_run_allowed
    - blocker_if_not_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1352_truncproof_xgrammar_certificate_completion_preflight.json immediately with status="in_progress".
    2. Read exp1339 and identify the local parser or grammar dispatch surface used for SAT, UNSAT, UNKNOWN, and repair states.
    3. Build tiny synthetic certificates for each grammar state and estimate the minimum completion tokens required for a structurally valid certificate.
    4. Check whether the current max-token settings can complete every state; record min_completion_tokens_by_state and max_token_budget_sufficient.
    5. Check whether structural tags can be emitted before grammar selection and whether dynamic_dispatch_preserved remains true under the synthetic cases.
    6. Record xgrammar_backend_available honestly; if XGrammar is absent, keep a pure-Python dispatch path as the tested fallback.
    7. Set sota_run_allowed=true only when max_token_budget_sufficient and dynamic_dispatch_preserved are true.
    8. If sota_run_allowed=false, write blocker_if_not_allowed with the exact blocker rather than leaving a missing artifact.
    9. Write all required fields, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1352_truncproof_xgrammar_certificate_completion_preflight.json')); print(d.get('max_token_budget_sufficient'), d.get('dynamic_dispatch_preserved'), d.get('sota_run_allowed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

