# Pre-staged roadmap — milestone 2026.05.265
#
# Author: outer-loop (Claude) per operator directive 2026-05-21:
#   "Authorized. MBPP + TruthfulQA + HumanEval first. We can re-visit
#   the rest after we see those results."
#
# Context: the deep audit on 2026-05-21 confirmed that the production
# headline AUROC=0.9857 (Ensemble v7b on FoVer, exp2546) is measured
# on a single corpus shape (math-step-error pairs). The Tier 0s
# verifier was confirmed to be a regex+arithmetic heuristic that
# returns 0.0 on non-arithmetic inputs (now honestly documented per
# CLAUDE.md "Verifier Authenticity Discipline"). Generalization
# beyond FoVer is unmeasured.
#
# This milestone expands the corpus surface to three independent
# benchmarks (MBPP code, TruthfulQA factuality, HumanEval full code
# generation) under the same 5-seed adversarial-replication
# protocol that produced the FoVer headline. After these land,
# operator will decide on HaluEval + FEVER (the deferred corpora).
#
# Per CLAUDE.md "Pre-Staged Roadmap Convention" — this file is
# preserved by the conductor's _plan_next_milestone() check at
# activation time. Per CLAUDE.md "Gemini-Default for Experiments"
# all experiment tasks default to agent_type: gemini.

milestone: "2026.05.265"

tasks:

  - id: exp2801
    milestone: "2026.05.265"
    deliverable: "results/experiment_2801_archive_v264.json"
    title: "Archive .264 + Activate .265"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 20
    track: admin
    prompt: |
      Read CLAUDE.md for project context.

      TASK: Standard milestone activation. Archive milestone 2026.05.264
      to research-complete.yaml; activate this milestone 2026.05.265
      from research-roadmap.yaml.

      CONCRETE STEPS:
        1. Read research-roadmap.yaml current milestone field.
        2. Read research-complete.yaml to confirm .264 isn't already archived.
        3. Append .264 milestone block from research-roadmap.yaml to research-complete.yaml.
