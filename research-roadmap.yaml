milestone: "2026.08.581"
milestone_title: "Typed Outcome Transport and Cross-Family Adaptation"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6660-v581-evidence-contract
    milestone: "2026.08.581"
    deliverable: results/experiment_6660_v581_evidence_contract.json
    title: "V581 evidence and retirement contract"
    priority: critical
    track: execution-integrity
    requires_gpu: false
    per_unit_rows: true
    max_turns: 20
    estimated_wall_time_min: 45
    agent_type: gemini
    model: gemini-3.1-pro-preview
    prior_failures:
      - experiment_id: exp6659-v580-capstone
        verdict: "complete_partial: V580 has authentic admission, direct-corpus, and bounded verifier-unit evidence; memory general benefit is null under independent uncertainty; ARC and Ising branches are blocked; one audit artifact is missing; no pooled success, ARC solve, repair win, or hardware speedup is claimed"
        addressed_by: "This is a pre-implementation scope and gate audit, not another scientific capstone; it checks V581 field ownership, retirement lineage, and non-retired dependencies before code work starts."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      V580 ended with one missing audit, a retired suffix branch, a null one-fixture memory result, missing exact ARC post-redirect outcomes, and an Ising reference whose algorithm rows passed while its readiness receipt failed. V581 must not repeat any scope without a material change. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6659_v580_capstone.json and every available Exp6647-Exp6658 artifact
      - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/scripts/conductor_exclusion_manifest.json
      - {project_root}/research-roadmap-next.yaml, {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, and {project_root}/scripts/audit_roadmap_gates.py
      - relevant evidence, reporting, ARC, memory, inference, and sampling specs plus {project_root}/ops/e2e-test-plan.md

      TASK:
      Audit the complete V581 plan before implementation. Confirm that each task has a distinct scope, complete prior-failure declarations where needed, no retired upstream dependency, exact producer-owned gate fields, and a valid same-verdict retirement path. Do not edit either roadmap, the exclusion manifest, the conductor, or implementation code.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash research-roadmap.yaml, research-roadmap-next.yaml, scripts/research_conductor.py, the V581 design doc, the exclusion manifest, and all V580 artifacts; record Python, CPU, RAM, disk, and the no-LLM substrate.
      1. Add REQ-* and SCENARIO-* anchors only if a capability spec already owns roadmap evidence-contract behavior. Write focused tests first for any new analysis module.
      2. Enumerate all 14 V581 tasks and compare title, scope, deliverable, requires, gated_on, prior_failures, agent routing, and prompt run command against the design document.
      3. For every gate, verify that the upstream task exists in this roadmap and declares the artifact_field with identical spelling in its REQUIRED ARTIFACT FIELDS. Reject a consumer of a retired task.
      4. Match task scopes against research-complete.yaml, V580 artifacts, and the exclusion manifest. Record the exact technique or prerequisite change and the retire_if_same_verdict value.
      5. Run YAML parse, roadmap schema, prior-failure, dependency, gate-contract, and exclusion-manifest pre-emit checks in read-only mode. Record all warnings and hard violations without patching the plan.
      6. Set v581_contract_ready=true only when there are zero hard violations. A blocked verdict must start blocked_ and populate gate_check_summary with the exact failed rule and value.
      7. Write the artifact atomically; run focused tests, row consistency, artifact validation, adversarial verification, and git status. Do not reconcile project claims because this task makes no scientific claim.

      Required deliverable: {project_root}/results/experiment_6660_v581_evidence_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal task state. Principle: deterministic process evidence.
        honest_verdict: pre-implementation contract conclusion with no scientific success claim. Principle: measured evidence only.
        verdict_class: one of positive|circular_positive|null|blocked|disqualified|partial; ready infrastructure is null. Principle: closed deterministic classification.
        gate_check_summary: exact failed rule, expected value, and observed value for blocked results. Principle: deterministic failure localization.
        task_contract_rows: one scope, path, dependency, gate, routing, and command row per task. Principle: raw per-unit evidence.
        prior_failure_match_rows: matched scope, prior verdict, changed condition, and retirement signal. Principle: measured lineage.
        producer_consumer_contract_rows: exact upstream field ownership and spelling per gate. Principle: deterministic contract evidence.
        retired_dependency_rows: every checked requires and gated_on target with retirement state. Principle: fail-closed safety evidence.
        validation_command_rows: command, exit, output summary, and hash. Principle: reproducible verification.
        v581_contract_ready: boolean owned by this task. Principle: deterministic reduction from declared checks.
        per_unit_rows: every task, prior-failure match, gate, and validator row. Principle: recheckable raw evidence.
        aggregate_row_recomputation: readiness rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: inputs, tools, resources, and hashes. Principle: measured runtime provenance.
        protected_files_unchanged: before/after hashes for both roadmaps and the conductor. Principle: deterministic integrity.
        inference_substrate: artifact_and_manifest_audit_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: true because declared roadmap rules define infrastructure readiness. Principle: explicit circularity boundary.
        field_provenance: source path, parser, function, and hash per field. Principle: traceable evidence.
        random_seed: deterministic audit order seed. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: final canonical content hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6660_v581_evidence_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6661-triggered-tail-fixture
    milestone: "2026.08.581"
    deliverable: results/experiment_6661_triggered_tail_fixture.json
    title: "Trigger-switched structured-tail fixture"
    priority: critical
    track: verification-transport
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 90
    agent_type: codex
    model: gpt-5.6-sol
    prior_failures:
      - experiment_id: exp5923-sota-schema-supported-constraintir-ab
        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "The new treatment preserves free reasoning and constrains only a short syntax tail after a trigger; the grammar cannot carry semantic answer choices, while immediate JSON is retained only as a control."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      V580 produced 48 real SOTA rows, but 38 did not parse. The retired schema-supported ConstraintIR reprompt constrained the output from the start and reached zero exact semantic success. This task builds a different, syntax-only delayed-tail fixture before any model run. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-references.md, and the V581 roadmap doc
      - {project_root}/results/experiment_6649_exact_certificate_proposal_corpus.json, {project_root}/results/experiment_6650_twin_prefix_verifier_map.json, and {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
      - Exp6604 exact two-level corpus, Exp6590/6591 constraint streams, and their exact compiler/checker modules and tests
      - local llama.cpp grammar and embedded-tokenizer helpers, without loading a model in this task
      - relevant verification, constraint-compiler, inference, evidence, safety, and reporting specs plus the E2E plan

      TASK:
      Build a frozen exact-checkable fixture for three output arms: natural extraction, immediate JSON, and free reasoning followed by a trigger-switched syntax-only tail. The grammar may enforce field names and primitive types, but it may not enumerate or encode the correct answer.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash protected files and source corpora; record exact checker/compiler identities, parser versions, CPU, RAM, disk, and the no-LLM substrate.
      1. Add REQ-* and SCENARIO-* anchors for delayed syntax enforcement, semantic-free grammar construction, immutable task manifests, and fail-closed parser outcomes. Write focused tests first.
      2. Freeze at least 18 tasks across scheduling, graph constraints, and arithmetic or logic certificates. Each task needs an independently executable exact checker and no finite answer-ID transport.
      3. Define the three arm prompts, trigger token, tail schema, natural parser, immediate-JSON parser, delayed-tail parser, token budgets, and checker hashes before execution.
      4. Add mutation and leakage attacks: answer permutation, label renaming, task-ID removal, grammar-only generation, trigger collision, premature trigger, missing trigger, malformed tail, unknown fields, and semantically wrong but syntactically valid tails.
      5. Emit one fixture row per task and one attack row per task-arm condition. Prove that syntax mutations do not change exact labels and that grammar-only sampling cannot recover the answer.
      6. Set triggered_tail_fixture_ready=true only if every expected task and attack row exists, exact checkers pass known positive/negative controls, and no semantic leakage is found.
      7. Write atomically; run focused tests, 100% scoped coverage, spec coverage, row/artifact/adversarial checks, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6661_triggered_tail_fixture.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal task state. Principle: deterministic process evidence.
        honest_verdict: fixture readiness or exact blocker with no model-quality claim. Principle: measured evidence only.
        verdict_class: closed enum; ready fixture infrastructure is null. Principle: deterministic classification.
        gate_check_summary: exact failed fixture, checker, parser, or leakage check and value. Principle: deterministic failure localization.
        frozen_task_manifest: task, family, prompt, target, checker, seed, and hash definitions. Principle: immutable raw evidence.
        arm_contracts: natural, immediate-JSON, and triggered-tail prompts, parsers, schemas, and budgets. Principle: deterministic method definition.
        syntax_only_grammar_receipt: allowed syntax and proof that answer semantics are absent. Principle: independently checkable safety evidence.
        exact_checker_rows: known positive and negative controls per family. Principle: independent executable authority.
        leakage_attack_rows: every mutation, trigger, parser, and grammar attack with expected and observed results. Principle: adversarial evidence.
        triggered_tail_fixture_ready: boolean field owned by this task. Principle: deterministic reduction from complete rows.
        per_unit_rows: every task, arm contract, checker control, and attack. Principle: recheckable raw evidence.
        aggregate_row_recomputation: all readiness counts rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: inputs, tools, resources, and hashes. Principle: measured runtime provenance.
        protected_files_unchanged: active roadmap and conductor before/after hashes. Principle: deterministic integrity.
        inference_substrate: cpu_fixture_and_exact_checker_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: true because exact fixture labels define readiness, not model quality. Principle: explicit circularity boundary.
        field_provenance: source path, parser, function, and hash per field. Principle: traceable evidence.
        random_seed: fixed task and attack order seed. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: final canonical content hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6661_triggered_tail_fixture --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6662-triggered-structured-tail-ab
    milestone: "2026.08.581"
    deliverable: results/experiment_6662_triggered_structured_tail_ab.json
    title: "Three-family trigger-switched structured-tail A/B"
    priority: critical
    track: verification-transport
    requires:
      - exp6661-triggered-tail-fixture
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 300
    gated_on:
      - upstream: exp6661-triggered-tail-fixture
        artifact_field: triggered_tail_fixture_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp5923-sota-schema-supported-constraintir-ab
        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "Immediate JSON is a negative control only; the treatment delays syntax enforcement until after unconstrained reasoning and keeps answer semantics outside the grammar."
        retire_if_same_verdict: true
      - experiment_id: exp6636-delayed-two-level-decoding
        verdict: "blocked_gate_check_failed"
        addressed_by: "The upstream producer now owns triggered_tail_fixture_ready in this roadmap, and the comparison does not depend on a missing headroom artifact."
        retire_if_same_verdict: true
      - experiment_id: exp6651-failure-localized-suffix-regeneration
        verdict: "blocked_gate_check_failed"
        addressed_by: "This task makes one preregistered generation per output arm and has no suffix repair or regeneration-headroom gate; it changes answer transport before failure rather than repairing a failed suffix."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      V580 admitted all three mandated GGUF families, but its direct corpus had 38 parse failures in 48 rows and only two repairable suffixes. Thinking Before Constraining suggests a syntax-only switch after free reasoning. This task tests that method against natural extraction and immediate JSON. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/scripts/experiment_template.py, and the V581 roadmap doc
      - {project_root}/results/experiment_6648_three_family_gguf_canaries.json, {project_root}/results/experiment_6649_exact_certificate_proposal_corpus.json, and {project_root}/results/experiment_6661_triggered_tail_fixture.json
      - {project_root}/python/carnot/inference/sota_models.py, the GGUF loader, lease journal, embedded tokenizer helpers, exact compilers/checkers, and atomic artifact writer
      - Exp5923, Exp6636, and Exp6651 modules, artifacts, and focused tests to preserve retirement boundaries
      - relevant model-tier, inference, verification, execution-integrity, evidence, safety, and reporting specs plus the E2E plan

      TASK:
      Compare natural extraction, immediate JSON, and trigger-switched syntax-only tails on the same frozen exact tasks with all three mandated GGUF families. Use matched prompts, task order, decoding settings, and proposal-token budgets. Exact semantic success is the primary outcome; parseability is secondary.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify the structured upstream gate; hash protected files, fixture, parsers, grammars, and checkers; confirm Exp6648 admission; resolve cache paths; record CUDA, nvidia-smi, llama.cpp, both GPU UUIDs, CPU, RAM, and disk before model load.
      1. Add REQ-* and SCENARIO-* anchors for delayed syntax-only generation, three-family MODEL_SPECS, matched budgets, complete model-task-arm rows, and no semantic grammar leakage. Write focused tests first.
      2. Define MODEL_SPECS with exactly unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Resolve Qwen plus middle MoE through cached_sota_pair() and dense Gemma through resolve_cached_gguf(). Use embedded GGUF tokenizers only.
      3. Freeze at least 18 fixture tasks, one seed schedule, arm order, prompt hashes, decoding parameters, trigger rule, tail grammar, parser versions, and equal proposal-token budgets. Legacy small models may be labeled CPU smoke tests only and cannot enter headline rows.
      4. For every model-task-arm unit, use a fresh owner-bound process receipt and record raw output/hash, trigger state and position, structured tail, parse success or explicit failure, parsed candidate, exact outcome, per-step checks, prompt/generated tokens, latency, PID/start, device UUID, phases, VRAM, unload, and release.
      5. Keep missing parses missing. Recompute model-level and pooled paired differences with task-level bootstrap intervals. Report exact semantic success first, then parse rate, syntactic validity, token cost, and latency.
      6. Set structured_tail_comparison_complete=true only if every expected headline row exists, identities and budgets validate, and all exact outcomes recheck. A favorable delayed-tail result may be positive because the checker does not guide generation; any leakage is disqualified.
      7. Write atomically; run focused tests, scoped coverage, spec coverage, model-tier, lease, row, artifact, adversarial, and applicable model-load E2E checks plus git status.

      Required deliverable: {project_root}/results/experiment_6662_triggered_structured_tail_ab.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal task state. Principle: deterministic process evidence.
        honest_verdict: exact three-arm transport conclusion with uncertainty and no repair claim. Principle: measured evidence only.
        verdict_class: closed enum based on complete authentic rows; leakage is disqualified. Principle: deterministic classification.
        gate_check_summary: exact upstream, model, row, budget, parser, checker, or receipt failure and value. Principle: deterministic failure localization.
        upstream_gate_receipt: Exp6661 path, hash, field, expected value, and observed value. Principle: traceable gate evidence.
        model_specs: canonical MODEL_SPECS with exact IDs, files, quantizations, roles, and devices for all three mandated families. Principle: measured model identity.
        frozen_comparison_manifest: task, arm, seed, prompt, parameter, budget, parser, grammar, and checker hashes. Principle: immutable method evidence.
        comparison_rows: one raw model-task-arm row with output, trigger, parse, exact, token, timing, process, and accelerator fields. Principle: raw comparative evidence.
        parse_failure_rows: explicit missing or malformed outputs with no zero coercion. Principle: honest missingness.
        model_level_metrics: row-derived exact and transport rates with uncertainty per model. Principle: deterministic aggregation.
        paired_arm_metrics: task-matched differences and confidence intervals for every arm pair. Principle: measured comparison.
        syntax_leakage_receipt: grammar and prompt attack results inherited and replayed from Exp6661. Principle: adversarial safety evidence.
        structured_tail_comparison_complete: boolean field owned by this task. Principle: deterministic completeness reduction.
        per_unit_rows: every expected model-task-arm unit and attack. Principle: recheckable raw evidence.
        aggregate_row_recomputation: all counts, rates, differences, and intervals rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: models, cache, hardware, tools, inputs, and hashes. Principle: measured runtime provenance.
        protected_files_unchanged: active roadmap and conductor before/after hashes. Principle: deterministic integrity.
        inference_substrate: fresh_process_llama_cpp_cuda_three_family_triggered_tail_generation. Principle: measured substrate identity.
        verifier_is_oracle: false because the exact checker evaluates frozen outputs after generation and does not guide decoding. Principle: explicit independence boundary.
        field_provenance: source path, parser, function, receipt, and hash per field. Principle: traceable evidence.
        random_seed: fixed task, arm, and model order schedule. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: final canonical content hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6662_triggered_structured_tail_ab --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6663-structured-tail-independent-audit
    milestone: "2026.08.581"
    deliverable: results/experiment_6663_structured_tail_independent_audit.json
    title: "Structured-tail independent row audit"
    priority: high
    track: verification-audit
    requires:
      - exp6662-triggered-structured-tail-ab
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 90
    gated_on:
      - upstream: exp6662-triggered-structured-tail-ab
        artifact_field: structured_tail_comparison_complete
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp6652-constraint-intervention-audit
        verdict: "no_terminal_artifact_after_upstream_repair_block"
        addressed_by: "The new producer owns structured_tail_comparison_complete and emits a full fixed corpus; this audit has no repair-headroom dependency and can recompute every planned row."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      V580's intervention audit never ran because the suffix task gate-blocked. Exp6662 owns a complete three-arm corpus field that is independent of treatment success. This task independently checks every transport and exact-semantic claim. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V581 roadmap doc
      - {project_root}/results/experiment_6661_triggered_tail_fixture.json and {project_root}/results/experiment_6662_triggered_structured_tail_ab.json
      - exact checker/compiler modules, parser and grammar definitions, raw output stores, model/lease receipts, and their focused tests
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, artifact validators, and model-tier checks
      - relevant verification, evidence, safety, model-tier, and reporting specs plus the E2E plan

      TASK:
      Audit Exp6662 from blinded raw rows. Recompute parsing, exact semantics, paired differences, uncertainty, budgets, model identities, and accelerator receipts. Attack grammar and prompt leakage. Do not call an LLM or reuse producer aggregate fields as authority.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify structured_tail_comparison_complete=true; hash source artifacts, sealed raw outputs, fixture, parsers, grammars, checkers, protected files, and audit environment.
      1. Add REQ-* and SCENARIO-* anchors for cold-process row recomputation, blinded exact checks, syntax-leakage attacks, and non-upgrade of circular or disqualified evidence. Write focused tests first.
      2. Reparse every raw output in a cold process and rerun every exact checker from task input plus candidate only. Record producer/auditor agreement without reading the producer label first.
      3. Recompute row counts, parse rates, exact success, paired differences, bootstrap intervals, token budgets, latency, model-level metrics, and pooled metrics. Keep missing values explicit.
      4. Verify exact model file hashes, PID/start, device UUID, phases, VRAM, unload, release, prompt hashes, and row lineage for all three families.
      5. Attack answer permutations, schema field order, grammar-only sampling, trigger collisions, hidden answer IDs, parser defaults, duplicate tasks, row omissions, unequal budgets, and model-identity substitution.
      6. Set structured_tail_audit_complete=true only if every expected raw row and receipt rechecks. The verdict class follows independently recomputed evidence and cannot be positive when leakage or identity substitution is present.
      7. Write atomically; run focused tests, coverage, spec coverage, row/artifact/adversarial/model-tier checks, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6663_structured_tail_independent_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal audit state. Principle: deterministic process evidence.
        honest_verdict: independently recomputed transport conclusion. Principle: measured evidence only.
        verdict_class: closed enum from independent rows; no producer-based upgrade. Principle: deterministic classification.
        gate_check_summary: exact failed gate, row, receipt, checker, or attack and value. Principle: deterministic failure localization.
        upstream_gate_receipt: Exp6662 path, hash, field, expected value, and observed value. Principle: traceable gate evidence.
        blinded_recheck_rows: producer-hidden parse and exact result per raw output. Principle: independent raw evidence.
        aggregate_recomputation: all counts, rates, differences, costs, and intervals rebuilt independently. Principle: deterministic aggregation.
        model_receipt_audit_rows: model, process, accelerator, unload, and release checks per row. Principle: measured identity evidence.
        leakage_and_integrity_attack_rows: every syntax, answer, parser, omission, duplication, and substitution attack. Principle: adversarial evidence.
        producer_auditor_disagreement_rows: every field mismatch with source hashes. Principle: honest contradiction evidence.
        structured_tail_audit_complete: boolean owned by this task. Principle: deterministic completeness reduction.
        per_unit_rows: every output, receipt, aggregate, and attack unit. Principle: recheckable raw evidence.
        preconditions_checked: inputs, tools, resources, and hashes. Principle: measured runtime provenance.
        protected_files_unchanged: active roadmap and conductor before/after hashes. Principle: deterministic integrity.
        inference_substrate: cold_process_exact_row_audit_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: false because the audit checker is independent of the frozen model outputs and producer reductions. Principle: explicit independence boundary.
        field_provenance: source path, parser, function, and hash per field. Principle: traceable evidence.
        random_seed: fixed blinding and bootstrap seed schedule. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: final canonical content hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6663_structured_tail_independent_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.
