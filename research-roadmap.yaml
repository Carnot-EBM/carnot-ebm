- id: exp7039-live-model-report-channel-forensics
  title: Official-live llama.cpp model report-channel forensic capture
  track: arc-infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: true
  max_turns: 100
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.617
  deliverable: results/experiment_7039_v617_model_report_forensics.json
  prior_failures:
    - experiment_id: exp7032-repaired-belief-shadow-live-trace
      verdict: "blocked_belief_shadow_live_trace:live_trace_execution"
      addressed_by: "Exp7039 stops before ARC action selection and records the live launch argument plus every raw /props identity field so the alias contract is measured before another validator change."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7032 passed its cache, GPU, ownership, CUDA, context, and official-access
    checks. It then failed because `/props` returned a model path that resolved
    to the right content blob but was itself an alias. Exp7030 and Exp7031 had
    tested the opposite assumption. V617 must capture the real report channel
    before it changes the identity contract. arXiv:2609.03147 shows why a
    constraint system must test report-channel consistency separately.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md section "V617 Planner Refresh"
    - {project_root}/results/experiment_7030_arc_gguf_model_identity_bridge.json
    - {project_root}/results/experiment_7031_arc_model_identity_cold_audit.json
    - {project_root}/results/experiment_7032_repaired_belief_shadow_live_trace.json
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/scripts/experiment_template.py cached_sota_pair() pattern
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Capture one owned live llama.cpp model identity report without taking an
    ARC action. Record the selected model specification, exact launch argument,
    complete raw `/props` payload, raw identity candidates, and separately
    resolved paths. Classify the report shape without changing the production
    validator or normalizing the raw report in place.

    CONCRETE STEPS:
    0. PRECONDITIONS: require an idle supported RTX 3090, enough VRAM, owned
       GPU and port leases, CUDA llama.cpp binary and library, clean stop
       authority, cached mandated GGUF, readable Exp7032 evidence, and writable
       result/checkpoint paths. On failure write a terminal blocked artifact
       with exact gate_check_summary. Do not use CPU or a small-model fallback.
    1. Add REQ-ARC-7039 and RED tests before implementation. Tests must keep a
       raw path and its resolved path distinct and must cover missing, relative,
       alias, canonical blob, direct file, and conflicting report fields.
    2. MODEL_SPECS must resolve through cached_sota_pair() and execute
       `unsloth/Qwen3.6-35B-A3B-GGUF`. Record the hub ID, revision, snapshot
       filename, quantization, exact file hash, GPU UUID, and server build.
    3. Start one owned CUDA server with the selected snapshot path. Send one
       fixed one-token diagnostic request so live_llm_inference is genuine.
       Do not open or act in an ARC game.
    4. Preserve the full raw `/props` JSON. Record `model_path`, `model`, and
       `model_alias` as separate raw fields. Record the launch `-m` argument
       and process command line independently.
    5. Resolve each absolute path in a separate derived field. Do not replace
       a raw field. Hash every reachable file and compare it with the selected
       model hash. Record missing and contradictory values as unknown or
       contradicted, not as inferred passes.
    6. Classify the observed report as snapshot_alias, resolved_blob,
       direct_file, conflicting, or unknown. Set
       arc_report_channel_forensics_ready_score=1 when the capture is complete,
       owned, reproducible, and safely cleaned up. The score describes evidence
       completeness, not validator correctness or belief value.
    7. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, ARC floor lint, spec coverage, and applicable
       live-path checks from ops/e2e-test-plan.md.
    8. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (live_llm_inference); duration_s;
       source_artifact_hashes; rows; MODEL_SPECS; model_specs; models_used;
       selected_model_spec; requested_model_path; requested_model_filename;
       requested_hf_id; requested_revision; launch_model_argument;
       process_command_rows; raw_server_props; raw_identity_field_rows;
       resolved_identity_field_rows; file_hash_rows; consistency_rows;
       report_channel_classification; one_token_probe_rows;
       server_process_rows; port_lease_rows; gpu_lease_rows; gpu_sample_rows;
       cuda_layer_offload_confirmed (true); cleanup_rows;
       generation_request_count (1); arc_action_count (0);
       game_level_solve_claim (false); arc_report_channel_forensics_ready_score;
       random_seed; reproducibility_checksum; gate_check_summary with failed
       check, expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7039_v617_model_report_forensics.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7040-typed-model-identity-report-bridge
  title: Typed raw-to-canonical ARC model identity report bridge
  track: arc-infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.617
  deliverable: results/experiment_7040_v617_typed_identity_bridge.json
  gated_on:
    - upstream: exp7039-live-model-report-channel-forensics
      artifact_field: arc_report_channel_forensics_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp7032-repaired-belief-shadow-live-trace
      verdict: "blocked_belief_shadow_live_trace:live_trace_execution"
      addressed_by: "Exp7040 uses Exp7039's measured live report shape and adds a raw observation plus a separate canonical resolution instead of requiring the raw server field itself to be canonical."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7039 measures the actual llama.cpp report contract. The current shared
    builder rejects an observed alias before it can compare the alias target
    with the requested snapshot and content blob. arXiv:2609.03153 suggests a
    safer form: typed obligations with supported, contradicted, or unknown
    states and explicit provenance. This task changes the shared identity
    representation. It must not weaken hub, revision, hash, or reachability
    checks.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md section "V617 Planner Refresh"
    - {project_root}/results/experiment_7039_v617_model_report_forensics.json
    - {project_root}/results/experiment_7030_arc_gguf_model_identity_bridge.json
    - {project_root}/results/experiment_7031_arc_model_identity_cold_audit.json
    - {project_root}/results/experiment_7032_repaired_belief_shadow_live_trace.json
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/python/carnot/experiment_7032_repaired_belief_shadow_live_trace.py
    - {project_root}/tests/python/test_arc_eval_provenance_contract_20260905.py
    - {project_root}/tests/python/test_arc_model_identity_bridge_20260905.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md

    TASK:
    Extend the shared ARC model identity receipt with a typed raw-report to
    canonical-resolution bridge. Preserve the server's raw path exactly. Add a
    separate resolved path and obligation rows. Accept identity only when the
    selected snapshot, launch argument, raw report resolution, content blob,
    hub, revision, filename, and hash all agree.

    CONCRETE STEPS:
    0. PRECONDITIONS: require a valid Exp7039 artifact with
       arc_report_channel_forensics_ready_score=1, unchanged cited sources,
       importable production modules, and writable code/test/artifact paths.
       On failure write a terminal blocked artifact with gate_check_summary.
    1. Add REQ-ARC-7040 and RED tests before implementation. Reproduce the
       exact raw report shape from Exp7039 with temporary files. Do not import
       mutable fixture values from the artifact at test execution time.
    2. Extend the current schema. Keep requested_model_path,
       requested_model_filename, requested_hf_id, requested_revision,
       launch_model_argument, observed_server_model_path,
       observed_server_resolved_path, resolved_model_path, and model_file_hash
       as separate fields.
    3. Emit typed obligation rows for absolute raw report, path resolution,
       selected snapshot relation, launch/report agreement, content hash, hub,
       revision, requested filename, and unique-file identity. Each row is
       supported, contradicted, or unknown and carries its evidence source.
    4. Accept a raw snapshot alias only when it resolves to the exact selected
       blob and every other obligation is supported. Accept a canonical blob
       report and a direct regular GGUF file under their explicit branches.
    5. Reject relative aliases, broken links, wrong snapshots, same-size
       different content, changed hub or revision, conflicting `/props`
       fields, hard-link ambiguity, and missing required evidence. Unknown is
       a block. It is never silently converted to supported.
    6. Wire the shared builder and validator into the canonical submitted ARC
       evaluator, reusable-server check, and belief-shadow consumer. Keep an
       explicit reader for complete legacy rows. Do not rewrite old artifacts.
    7. Set arc_typed_identity_bridge_ready_score=1 only when all positive
       branches pass, all negative branches fail closed, Exp7039's shape
       passes, legacy compatibility remains explicit, and every consumer uses
       the shared implementation.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, ARC floor lint, spec coverage, and applicable E2E
       checks from ops/e2e-test-plan.md.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (aggregation_from_upstream_artifacts); duration_s;
       source_artifact_hashes; cited_upstream_artifacts; upstream_gate_rows;
       rows; identity_schema_version; raw_report_reproduction_rows;
       identity_obligation_rows; positive_fixture_rows; negative_fixture_rows;
       unknown_evidence_rows; legacy_compatibility_rows; producer_wiring_rows;
       consumer_wiring_rows; requested_model_path; requested_model_filename;
       requested_hf_id; requested_revision; launch_model_argument;
       observed_server_model_path; observed_server_resolved_path;
       resolved_model_path; model_file_hash; arc_typed_identity_bridge_ready_score;
       random_seed; reproducibility_checksum; gate_check_summary with failed
       check, expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7040_v617_typed_identity_bridge.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7041-identity-report-channel-cold-audit
  title: Fresh-process ARC identity report-channel attack audit
  track: arc-infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
