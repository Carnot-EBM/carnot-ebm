           embeddings = [c.embedding for c in retrieved if c.embedding]
           if embeddings: modified_J = injector.inject_into_coupling_matrix(ising_ebm.J, injector.project_to_spin_bias(embeddings))
           (Temporarily substitute J before sampling; restore after)
