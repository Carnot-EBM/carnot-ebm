    milestone: "2026.04.22"
    deliverable: results/experiment_294_results.json
    title: "Exp 294: GPU stall diagnosis + Apple adversarial baseline re-run"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: The Apple adversarial GPU baseline (Exp 282) and verify-repair (Exp 283) have been
      INCONCLUSIVE for 2 consecutive milestones due to GPU stall during conductor runs. The scripts
      ARE correctly implemented. Both RTX 3090s show 0% utilization and 2MB residual VRAM at
      milestone end — they are IDLE, not busy. Root cause hypothesis: DualGPURunner initializes
      model loading lazily, and the model load itself stalls (not the inference). The fix is
      explicit model pre-warm with a separate health-check before any timed benchmark starts.

      This experiment: (1) diagnose the GPU stall root cause, (2) add pre-warm + health-check
      to the DualGPURunner pattern, (3) re-run Exp 282 (Apple baseline) with the fix applied.

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_282_apple_baseline_gpu.py — the existing baseline script
      - scripts/experiment_258_dual_gpu_harness.py — DualGPUBenchmarkHarness
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
      - data/research/gsm8k_adversarial_281.jsonl — the 400-row adversarial corpus
      - results/experiment_282_results.json — check if exists (likely absent due to stall)
      - ops/status.md — GPU stall notes

      TASK: Diagnose GPU stall, implement fix, re-run Apple adversarial GPU baseline.
      1. Read CLAUDE.md spec-first workflow
      2. Add REQ-VERIFY-077 (GPU pre-warm health-check for live inference) and
         SCENARIO-VERIFY-095/096 to openspec/capabilities/verifiable-reasoning/spec.md
      3. Write tests first for:
         - model_prewarm() function: loads model, runs a health-check prompt, returns health status
         - health_check timeout behavior (15s limit, returns False on timeout)
         - GPU stall detection: if model.generate() stalls >30s with no output, emit stall_detected=True
         - stall_root_cause field in artifact (lazy_load_stall / cuda_oom / unknown)
         - Apple baseline artifact schema: all required fields present
         - baseline accuracy in [0.0, 1.0] per variant per model
         - logit files created at 25/50/75/100% prefix fractions
      4. Implement scripts/experiment_294_gpu_baseline_apple.py:
         a. [STALL DIAGNOSIS] Before benchmarking, run GPU diagnostics:
            - Check VRAM usage on both GPUs (nvidia-smi)
            - Attempt to load Qwen3.5-0.8B on GPU 0 with 15s timeout — record load_time_s
            - Run a single health-check prompt ("What is 2+2?") with 10s timeout
            - If health-check fails: record stall_root_cause and emit blocked artifact
            - If health-check succeeds: proceed to benchmarking
         b. [PRE-WARM PATTERN] Wire DualGPURunner at construction time:
            - Load Qwen3.5-0.8B on GPU 0, Gemma4-E4B-it on GPU 1 at script start
            - Run 2 warm-up prompts per model before any timed benchmark
            - Record pre_warm_time_s and confirm both models respond
         c. [BASELINE BENCHMARK] Re-run the Exp 282 benchmark:
            - Load gsm8k_adversarial_281.jsonl (200 questions × 2 variant types + standard)
            - Run baseline inference (no verification): standard, number_swap, irrelevant_sentence
            - SAVE LOGITS at 25/50/75/100% prefix fractions → data/research/logits_294_(model)_(variant)_(pct)pct.npy
            - Checkpoint every 10 questions: results/checkpoints/experiment_294/
            - 60s per-call hard timeout; emit partial artifact with stall_at on timeout
         d. Report: stall_diagnosis, pre_warm_status, baseline accuracy per variant/model
         e. Primary check: does number_swap cause ≥15pp accuracy drop? (Apple 2410.05229)
         f. inference_mode: "live_gpu", CARNOT_FORCE_LIVE=1
         g. Output: results/experiment_294_results.json
      5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      6. Reconcile: update ops/changelog.md and ops/status.md
      7. Do NOT push. Do NOT modify scripts/research_conductor.py.

