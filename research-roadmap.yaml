    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Implement MetaJuLS-style online policy adapter for StructuredEquationForcer.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-038 (MetaJuLS adapter updates forcing strategy from live feedback),
       REQ-LEARN-039 (adapted strategy improves COMPUTE: recall vs static forcer),
       SCENARIO-LEARN-067/068/069 to openspec/capabilities/autoresearch/spec.md.
    3. Create python/carnot/pipeline/metajuls_adapter.py:
       a. ForcingFeedback dataclass: question (str), compute_lines_found (int),
          total_arithmetic_ops (int), recall (float), domain (str).
       b. MetaJuLSAdapter class:
          __init__(self, base_addendum: str, learning_rate: float = 0.1):
          update(self, feedback: ForcingFeedback) -> None:
            'Update forcing strategy based on feedback. Low recall → stronger addendum.'
            If feedback.domain not in self._domain_recalls:
              self._domain_recalls[feedback.domain] = []
            self._domain_recalls[feedback.domain].append(feedback.recall)
            If mean(self._domain_recalls[feedback.domain]) < 0.30:
              self._domain_emphasis[feedback.domain] = "CRITICAL: You MUST write..."
          get_adapted_addendum(self, question: str) -> str:
            'Return FORCER_SYSTEM_ADDENDUM adapted for this question domain.'
          save_state(self, path: str) -> None: persist domain_recalls + emphasis.
          load_state(cls, path: str) -> MetaJuLSAdapter: restore state.
    4. Create scripts/experiment_676_metajuls_adaptive.py:
       a. ExperimentTemplate(676) + ExperimentTimeoutWatchdog(676, timeout_minutes=25).
