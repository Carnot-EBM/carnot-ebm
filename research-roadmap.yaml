  milestone: 2026.04.84
  deliverable: results/experiment_1077_fr11_alpha_t_sota_v4.json
  title: "FR-11 alpha_t SOTA v4 — MANDATORY first: re-run with Qwen3.6-35B-A3B-GGUF (headline requires SOTA model)"
  model: opus
  prior_failures:
