- id: exp484-nup-probe
  milestone: 2026.04.36
  deliverable: results/experiment_484_nup_probe.json
  title: 'Exp 484: Neural Uncertainty Principle Probe — hallucination as under-constrained continuation (arXiv 2603.19562)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2603.19562\
    \ (Neural Uncertainty Principle, 2026) frames hallucination as an under-constrained\
    \ continuation problem. When a model is about to hallucinate, the entropy of its\
    \ next-token distribution is high because the continuation is under-constrained\
    \ — multiple continuations are nearly equally likely. Conversely, correct continuations\
    \ are highly constrained by logical and factual dependencies. This is mathematically\
    \ compatible with Carnot's constraint-satisfaction formulation: high entropy =\
    \ high energy = constraint violation likelihood. This experiment implements NUPProbe:\
    \ given a partial LLM response (from live CoT data in results/fover_labeled_steps_live.json\
    \ and results/exp476_cot_pairs.json), compute the continuation entropy as a proxy\
    \ for violation likelihood. If NUPProbe AUC > 0.700, it becomes Tier 0c in the\
    \ verification cascade — a zero-latency pre-filter that requires no LLM call. CPU-only\
    \ (uses frozen activations from live CoT data, no inference).\n\nEXISTING CODE\
    \ TO READ FIRST:\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/deliverable_guard.py — DeliverableGuard (Exp 462)\n-\
    \ python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline (Exp 360)\n\
    - python/carnot/pipeline/think_probe.py — CarnotThinkProbe, Tier 0a\n- python/carnot/pipeline/spilled_energy_detector.py\
    \ — SpilledEnergyDetector, Tier 0b\n- results/fover_labeled_steps_live.json —\
    \ 57 real labeled CoT steps\n- results/exp476_cot_pairs.json — 100 CoT pairs from\
    \ Exp 476 (if present)\n- research-references.md — Neural Uncertainty Principle\
    \ section\n\nTASK: Implement NUPProbe as Tier 0c pre-filter; evaluate on live CoT\
    \ data.\n1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-VERIFY-096 (NUPProbe computes per-step continuation entropy from token\
    \ log-probability distributions in CoT data), REQ-VERIFY-097 (NUPProbe AUC >\
    \ 0.700 on held-out live CoT pairs qualifies it as Tier 0c in ThreeTierPipeline),\
    \ SCENARIO-VERIFY-129/130 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - ContinuationEntropy(logprobs: list[float]):\n\
    \     - entropy: float (Shannon entropy of the distribution)\n     - is_high_entropy:\
    \ bool (entropy > threshold, default 1.5 nats)\n   - NUPProbe(entropy_threshold:\
    \ float = 1.5):\n     - score(cot_text: str, logprobs: list[float] | None = None)\
    \ -> float:\n       returns entropy if logprobs provided, else uses character-entropy\
    \ proxy\n     - predict_violation(cot_text: str, logprobs: list[float] | None)\
    \ -> bool\n     - evaluate_auc(labeled_pairs: list[dict]) -> float\n   - NUPProbeResult(n_pairs,\
    \ auc, threshold_used, probe_latency_ms):\n     - is_viable_tier_0c: bool (auc\
    \ > 0.700)\n   - Test: ContinuationEntropy with uniform logprobs returns max entropy\n\
    \   - Test: ContinuationEntropy with peaked logprobs returns near-zero entropy\n\
    \   - Test: NUPProbe.evaluate_auc returns float in [0, 1]\n5. Implement python/carnot/pipeline/nup_probe.py\
    \ (NUPProbe, ContinuationEntropy, NUPProbeResult).\n   Add NUPProbe as Tier 0c\
    \ to the pipeline cascade documentation in _bmad/architecture.md.\n   Export from\
    \ carnot.pipeline.__init__.\n   Verbose docstrings: WHY entropy as violation proxy\
    \ (arXiv 2603.19562: under-constrained continuations have high entropy because\
    \ multiple paths are nearly equally plausible; Carnot's constraint violation = high\
    \ energy = multiple low-energy configurations compete), WHY Tier 0c (zero latency\
    \ — no LLM call, no Ising sampling — pure arithmetic on logprobs; earlier cascade\
    \ position = higher skip rate = lower total verification cost), HOW character entropy\
    \ fallback (when logprobs absent from live CoT data, use character-level entropy\
    \ as structural proxy — less precise but still informative).\n6. Write scripts/experiment_484_nup_probe.py:\n\
    \   a. apply_env_autofix() FIRST\n   b. ExperimentTimeoutWatchdog(484, timeout_minutes=30)\
    \ as context manager\n   c. ExperimentTemplate(484, 'NUP Probe Tier 0c',\n   \
    \   'results/experiment_484_nup_probe.json')\n   d. DeliverableGuard('results/experiment_484_nup_probe.json')\n\
    \   e. Load labeled pairs: fover_labeled_steps_live.json (57 pairs) +\n      exp476_cot_pairs.json\
    \ (if present) — use character entropy fallback when logprobs absent\n   f. NUPProbe(entropy_threshold=1.5)\n\
    \   g. Evaluate AUC on held-out 20% of pairs\n   h. Build artifact: schema='carnot.nup_probe.v1'\n\
    \      n_pairs=<int>\n      n_with_logprobs=<int> (likely 0 for current live data\
    \ — char entropy fallback)\n      n_char_entropy_fallback=<int>\n      auc=<float>\n\
    \      threshold=1.5\n      probe_latency_ms=<float>\n      is_viable_tier_0c=auc\
    \ > 0.700\n      honest_verdict='tier_0c_viable' if is_viable_tier_0c else 'improvement_below_threshold'\n\
    \   i. Call tmpl.assert_deliverable_written() as FINAL LINE\n   j. Output: results/experiment_484_nup_probe.json\n\
    7. Write tests/python/test_nup_probe.py (100% coverage).\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: update _bmad/architecture.md\
    \ (Tier 0c NUPProbe in pipeline cascade table), ops/conductor-log.md, ops/status.md,\
    \ ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

