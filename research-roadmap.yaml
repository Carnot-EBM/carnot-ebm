- id: exp7121-v625-contract-preflight
  title: V625 Markdown and YAML task-contract preflight
  track: infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 45
  per_unit_rows: true
  milestone: 2026.09.625
  deliverable: results/experiment_7121_v625_contract_preflight.json
  prior_failures:
    - experiment_id: exp7109-v624-contract-preflight
      verdict: complete_disqualified_v624_markdown_yaml_contract_mismatch
      addressed_by: "V625 replaces both planning surfaces with one exact 13-row contract and independently checks the active YAML against the normative Markdown table."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V624 activated six YAML tasks while its Markdown contract promised 12.
    Exp7109 correctly disqualified that mismatch. V625 defines exactly 13 tasks,
    exp7121 through exp7133, in one order. This check is advisory. No science
    task gates on it, and the capstone remains ungated.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7109_v624_contract_preflight.json
    - {project_root}/scripts/experiments/experiment_7109_v624_contract_preflight.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_fit_lint.py
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/openspec/capabilities/research-harnesses/spec.md

    TASK:
    Build and run an independent active-YAML versus Markdown contract check.
    Check exact count, order, IDs, titles, deliverables, gates, producer fields,
    prior failures, model rules, routing, prompt tails, and capstone status. Do
    not activate or rewrite either roadmap.

    CONCRETE STEPS:
    0. Check readable active YAML, the V625 design document, the exclusion
       manifest, and a writable artifact path. Do not require the staging YAML
       at execution. On failure, write terminal blocked evidence with
       inference_substrate_class=blocked_no_run and exact gate_check_summary.
    1. Add REQ-REPORT-7121 and RED tests before implementation. Cover missing,
       extra, reordered, duplicated, renamed, and malformed task rows.
    2. Parse Markdown and YAML independently. Do not derive both views from one
       object, constant, parser result, or fixture.
    3. Require milestone 2026.09.625 and exactly 13 full IDs from
       exp7121-v625-contract-preflight through exp7133-v625-capstone.
    4. Normalize Markdown gates to full upstream IDs. Require each producer to
       occur earlier. Require artifact_field to match a bare top-level field in
       that producer's REQUIRED ARTIFACT FIELDS.
    5. Require all four prior_failures fields, per-unit rows for comparisons,
       run_date, field principles, allowed substrate classes, host venue,
       bounded wall times, routing, verdict_class, blocked diagnostics, and the
       exact two-line prompt tail.
    6. Require each local-LLM task to declare MODEL_SPECS and execute at least
       one mandated model in a headline cell. Require ARC level rows to declare
       solve_provenance. Require both ARC shards to have no structured gate.
    7. Set v625_task_contract_conforms_score=1 only when all 13 rows agree.
       Mismatch is disqualified. A missing prerequisite is blocked. Neither is
       partial.
    8. Run focused tests, YAML parsing, roadmap schema, gate audit, exclusion
       lint, harness-fit lint, artifact validation, adversarial verification,
       row consistency, scoped spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles for every field below;
       preconditions_checked; run_date; inference_substrate (independent
       Markdown and YAML parsing); inference_substrate_class (aggregation or
       blocked_no_run); execution_venue (host); duration_s;
       source_artifact_hashes; rows; markdown_task_rows; yaml_task_rows;
       task_contract_rows; title_parity_rows; deliverable_parity_rows;
       gate_contract_rows; gate_producer_rows; prior_failure_rows;
       model_compliance_rows; agent_routing_rows; wall_time_rows;
       artifact_field_rows; prompt_tail_rows; expected_task_count (13);
       observed_task_count; expected_id_order; observed_id_order;
       active_roadmap_path; staging_file_required_at_execution (false);
       v625_task_contract_conforms_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value whenever honest_verdict starts
       blocked_; verifier_is_oracle (false); verdict_class (positive |
       circular_positive | null | blocked | disqualified | partial);
       honest_verdict consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7121_v625_contract_preflight.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7122-v625-sota-ingestion
  title: V625 execution-time SOTA ingestion and method map
  track: infrastructure
  priority: high
  agent_type: gemini
  model: gemini-3.1-pro-preview
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 35
  per_unit_rows: true
  milestone: 2026.09.625
  deliverable: results/experiment_7122_v625_sota_ingestion.json
  prompt: |
    CONTEXT:
    Planning on 2026-09-07 added removal-based faithfulness, cross-model memory
    portability, persistent teacher anchoring, and learned multiscale sampling.
    V625 needs an execution-time refresh before interpreting later results. This
    task is independent and does not gate science.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/research-hardware-wishlist.md
    - {project_root}/research-roadmap.yaml
