  - id: exp3667-dependency-aware-weighting-clean-detautologized
    prior_failures:
      - experiment_id: exp3656-correlation-aware-weighting-paradox-diagnosis
        verdict: complete_paradox_resolved_naive_penalty_misspecified_dependency_aware_recovers
        addressed_by: "exp3656 found dependency-aware weighting beats Carnot (0.9326 vs 0.919) but the artifact was TAUTOLOGY-flagged (flagged_adversarial=true) because it stored the SAME correlation-aware AUROC under two field names (correlation_aware AND naive_correlation_aware, both 0.635312). This task re-runs the dependency-aware weighting CLEAN: store each distinct AUROC under exactly ONE field name (no aliasing), add >=5 seeds + bootstrap CI + a DeLong paired test vs Carnot's weighting, so the +0.013 win is a de-flagged, significance-tested, headline-advancement candidate -- not a quarantined finding."
        retire_if_same_verdict: false
    milestone: "2026.06.336"
    title: "Clean, de-tautologized dependency-aware ensemble weighting (arXiv:1903.05844 learned label-conditional dependency structure + Weaver arXiv:2506.18203) on FoVer — multi-seed + bootstrap CI + DeLong vs Carnot's 0.919; the headline-advancement candidate the exp3656 tautology flag quarantined"
    priority: critical
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # anti-wipeout codex routing for .336; multi-file weighting + significance test
    estimated_wall_time_min: 26
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3667_dependency_aware_weighting_clean.json
    prompt: |
      CONTEXT: exp3656 (.335) found that PROPER dependency-aware weighting (learning the label-conditional
      dependency graph, arXiv:1903.05844, NOT a naive marginal-correlation redundancy penalty) BEAT Carnot's
      current ensemble weighting on FoVer: 0.9326 vs 0.919 (+0.013) and recovered the -0.236 naive-penalty
      regression. This is the first lead in many milestones that could RAISE the headline AUROC. But exp3656
      was TAUTOLOGY-flagged (flagged_adversarial=true): it stored the SAME correlation-aware AUROC under two
      field names. This task re-runs it CLEAN so the win is de-flagged and significance-tested.
      DE-TAUTOLOGY RULE (MANDATORY): store each conceptually-distinct AUROC under exactly ONE field name. Do
      NOT alias the same value under two keys (the exp3656 flag). If two weighting schemes genuinely produce
      the same number, report ONE field and a note -- never two identical numeric fields.
      EXISTING CODE TO READ FIRST: results/experiment_3656 (the four AUROCs + the flag) and results/experiment_3644
      (the correlation matrix + Weaver-style baseline) and results/experiment_2837 (the FoVer corpus + the 4
      scoring verifiers) via scripts/summarize_artifact.py; project_orthogonality_stall and
      project_pathological_joint_null_space memories; research-references.md "Learning Dependency Structures for
      Weak Supervision (arXiv:1903.05844)" and "Weaver (arXiv:2506.18203)" and "Dependency Structure
      Misspecification (arXiv:2106.10302)" entries.
      PRECONDITIONS (step 0): the FoVer corpus + the 4 scoring verifiers loadable; the exp3656 dependency-aware
      implementation present. If not -> "complete: blocked_fover_corpus_or_dependency_weighting_unavailable".
      CONCRETE STEPS:
        1. Reproduce the weighting panel with NO aliased fields: unweighted / Weaver-style / Carnot-current /
           dependency-aware-proper. Each AUROC under exactly one field name.
        2. >=5 seeds + bootstrap CI on each; DeLong paired test of dependency-aware vs Carnot-current on the
           SAME corpus split (report the p-value and the paired delta CI).
        3. Run adversarial_verify on your own artifact (`python scripts/adversarial_verify.py <path>`) and
           CONFIRM no TAUTOLOGY/critical flag before finishing -- the whole point is to de-flag the finding.
        4. Honest verdict: does dependency-aware weighting beat Carnot with the delta CI excluding 0 AND a
           significant DeLong p? If yes, it is a headline-advancement CANDIDATE (NOT a silent headline swap --
           the frozen 0.9131 stays until a future re-freeze + re-reproduction).
      ANTI-POISON TEST DISCIPLINE (MANDATORY): parametrize any pytest over the honest outcomes
      (beats_carnot_significant / no_significant_gain / blocked) on synthetic fixtures; NEVER hard-assert one
      success string. Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; dependency_aware_beats_carnot MUST be a BARE top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores the cached FoVer corpus; no LLM load)."
        auroc_unweighted:
          principle: "Baseline -- one field, no alias."
        auroc_weaver_style:
          principle: "Weaver weak-supervision weighting (arXiv:2506.18203) -- one field, no alias."
        auroc_carnot_current:
          principle: "Carnot's current weighting (~0.919) -- the bar; one field, no alias."
        auroc_dependency_aware_proper:
          principle: "The arXiv:1903.05844 learned-dependency-structure weighting -- the candidate; one field, no alias."
        dependency_aware_vs_carnot_delta_ci:
          principle: "Paired delta + bootstrap CI of dependency-aware minus Carnot -- the headline-advancement magnitude."
        delong_p_dependency_vs_carnot:
          principle: "DeLong paired significance of the AUROC difference -- a point estimate alone is not enough to move a headline."
        adversarial_verify_clean:
          principle: "True iff the artifact passes adversarial_verify with no TAUTOLOGY/critical flag -- de-flags the exp3656 finding (the whole point)."
        dependency_aware_beats_carnot:
          principle: "BARE bool. True iff dependency-aware AUROC > Carnot AND the delta CI excludes 0 AND DeLong p<0.05 -- the headline-advancement-candidate gate. STORE AS BARE true/false -- gates exp3668."
        n_examples:
          principle: "Sample-size rigor (FoVer n>=1000)."
        n_seeds:
          principle: "Replication count (>=5)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "adversarial_verify_clean == true AND auroc_dependency_aware_proper present AND delong_p_dependency_vs_carnot present"
          principle: "A headline-advancement candidate requires a de-flagged artifact with a measured AUROC and a significance test -- a tautology-flagged or untested number cannot move a headline."
      TERMINAL VERDICTS: "complete: dependency_aware_weighting_beats_carnot_clean_significant_headline_candidate" /
      "complete: dependency_aware_weighting_no_significant_gain_clean_carnot_weighting_sufficient" /
      "complete: blocked_fover_corpus_or_dependency_weighting_unavailable"
      Run: cd {project_root} && python scripts/experiment_3667_dependency_aware_weighting_clean.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3668-dependency-aware-weighting-heldout-validation
    operator_override: "2026-06-01 outer-loop directive: NEW held-out validation step (does the dependency-aware weighting from exp3667 generalize to a FoVer split it was NOT fit on, or is the +0.013 an overfit of the weighting to the scoring corpus?) — gated on exp3667; no prior task ran the held-out validation, so this is forward de-risking before any headline re-freeze, not a rerun."
    milestone: "2026.06.336"
    title: "Held-out / cross-split validation of the dependency-aware weighting (fit the learned dependency structure on a FoVer train split, evaluate on a disjoint test split) — guard against overfitting the weighting before it can advance the frozen headline"
    priority: high
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # anti-wipeout codex routing for .336
    estimated_wall_time_min: 18
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    gated_on:
      - upstream: exp3667-dependency-aware-weighting-clean-detautologized
        artifact_field: dependency_aware_beats_carnot
        op: '=='
        value: true
    deliverable: results/experiment_3668_dependency_aware_weighting_heldout.json
    prompt: |
      CONTEXT: exp3667 showed dependency-aware weighting beats Carnot on FoVer (clean, significant). Before
      that can ever advance the frozen 0.9131 headline, it must be shown the learned dependency structure +
      weights generalize -- i.e. they were not overfit to the corpus they were estimated on. This task does a
      proper train/test split: learn the dependency structure + weights on a FoVer TRAIN split, evaluate AUROC
      on a DISJOINT TEST split, vs Carnot's weighting on the SAME test split. NULL DISCIPLINE: a held-out win
      is only meaningful if Carnot's weighting is also evaluated on the identical held-out split.
      EXISTING CODE TO READ FIRST: results/experiment_3667 (the clean weighting panel + the dependency-aware
      implementation) via scripts/summarize_artifact.py; results/experiment_2837 (the FoVer corpus).
      PRECONDITIONS (step 0): exp3667 dependency_aware_beats_carnot==true AND the dependency-aware weighting
      implementation present. If not -> "complete: blocked_dependency_aware_weighting_not_confirmed_upstream".
      CONCRETE STEPS:
        1. Split FoVer into disjoint train/test (>=5 seeded splits; report per-split + pooled).
        2. Fit the dependency structure + weights on TRAIN only; evaluate dependency-aware AUROC and
           Carnot-weighting AUROC on the held-out TEST split. Paired delta + bootstrap CI + DeLong on test.
        3. Honest verdict: does the held-out test delta still favor dependency-aware with CI excluding 0? If
           the train-fit win evaporates on held-out, the +0.013 was an overfit (report honestly -- a
           trustworthy negative, NOT a regression of paper_ready).
      ANTI-POISON TEST DISCIPLINE (MANDATORY): parametrize any pytest over the honest outcomes
      (generalizes_heldout / overfit_train_only / blocked) on synthetic fixtures; NEVER hard-assert one success
      string. Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; dependency_aware_generalizes_heldout MUST be a BARE top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores held-out FoVer splits; no LLM load)."
        heldout_auroc_dependency_aware:
          principle: "Dependency-aware AUROC on the disjoint TEST split (fit on TRAIN only) -- the generalization number."
        heldout_auroc_carnot:
          principle: "Carnot weighting on the identical TEST split -- the held-out bar."
        heldout_delta_ci:
          principle: "Paired held-out delta + bootstrap CI -- whether the win survives out-of-fit."
        heldout_delong_p:
          principle: "DeLong significance on the held-out split."
        n_splits:
          principle: "Replication count of train/test splits (>=5)."
        dependency_aware_generalizes_heldout:
          principle: "BARE bool. True iff the held-out delta favors dependency-aware with CI excluding 0 -- the de-risk gate before any headline re-freeze. STORE AS BARE true/false."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "heldout_auroc_dependency_aware present AND heldout_auroc_carnot present AND n_splits >= 5"
          principle: "A generalization verdict requires both weightings evaluated on the same disjoint held-out splits, replicated -- a single-split or train-only number cannot de-risk a headline change."
      TERMINAL VERDICTS: "complete: dependency_aware_weighting_generalizes_heldout_headline_re_freeze_candidate_for_v337" /
      "complete: dependency_aware_weighting_overfit_train_only_heldout_win_evaporates" /
      "complete: blocked_dependency_aware_weighting_not_confirmed_upstream"
      Run: cd {project_root} && python scripts/experiment_3668_dependency_aware_weighting_heldout.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3669-build-real-factual-hallucination-corpus
    operator_override: "2026-06-01 outer-loop directive: NEW real-data corpus build (RAGTruth arXiv:2401.00396 / FELM / HaluEval) to replace the .335 SYNTHETIC v3 facts corpus — exp3640 built a synthetic corpus successfully (not a failure); this is a forward difference (real external benchmark with evidence+labels+confidence), sanctioned by north-star rigor + the core escape-hallucinations mission."
    milestone: "2026.06.336"
    title: "Build a REAL factual-hallucination corpus from an external benchmark (RAGTruth arXiv:2401.00396, with FELM / HaluEval fallback) — evidence passages + binary hallucination labels + model-confidence — to stress-test whether the .335 'facts domain-bound' negative is a synthetic-corpus artifact"
    priority: high
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # anti-wipeout codex routing for .336; dataset-fetch + labeling pipeline
    estimated_wall_time_min: 24
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3669_build_real_factual_corpus.json
    prompt: |
      CONTEXT: .335 (exp3654/3655) earned "facts is domain-bound even with a real NLI verifier" -- but ONLY
      on a SYNTHETIC v3 corpus where confidence already reached 0.745. The real factual-hallucination
      benchmarks (RAGTruth arXiv:2401.00396, FELM, HaluEval) were never tried. This task builds a REAL corpus
      so .336 can test whether "facts domain-bound" is a synthetic-corpus artifact or genuine. RAGTruth is
      preferred (word/span-level hallucination annotations with retrieved context). NULL DISCIPLINE: the
      corpus must have real class balance AND confidence must NOT be a perfect detector (a confidence AUROC
      ~1.0 is the degenerate-corpus signature exp3574 hit -- reject such a corpus).
      EXISTING CODE TO READ FIRST: results/experiment_3640 (the synthetic v3 corpus schema:
      {question, answer, is_hallucination, evidence_passage, model_confidence}) via scripts/summarize_artifact.py;
      research-references.md "RAGTruth (arXiv:2401.00396)" + "HalluLens/HalluScan" entries; scripts/experiment_template.py.
      PRECONDITIONS (step 0):
        a. Network reachable to fetch the benchmark (`curl -sf -o /dev/null https://huggingface.co/api/models`)
           OR a cached copy present. If neither -> "complete: blocked_no_network_and_no_cached_real_corpus".
        b. If the primary (RAGTruth) is unavailable, fall back to FELM / HaluEval and record which was used.
      CONCRETE STEPS:
        1. Fetch RAGTruth (or fallback) and project to the v3 schema: {question/prompt, model_answer,
           is_hallucination (binary), evidence_passage (retrieved context), model_confidence}. Persist
           data/real_factual_corpus_ragtruth.jsonl.
        2. Record n, class balance (reject if either class < 20%), the source benchmark + version, and the
           confidence-baseline AUROC. ASSERT confidence AUROC < 0.95 (else the corpus is degenerate -- report
           real_factual_corpus_built=false and the degeneracy).
        3. Sanity: a few examples printed (real factual text, NOT placeholders) to confirm the projection.
