      to cold-start WITHOUT collapse or quality loss. This is the Tier-2 (constraint memory) -> Tier-4
      (adaptive structure) robustness step per research-program.md: a learned structure must not HURT when
      the new session is out-of-distribution. Keep pass_rate vs true_accuracy element-wise distinct
      (de-flag tautology).
      EXISTING CODE TO READ FIRST: results/experiment_3708 (FR-11 v13 + the bounded template library) and
      results/experiment_3697 (v12) and results/experiment_3667 (the dependency-aware structure) via
      scripts/summarize_artifact.py; the FR-11 module + cached traces + the v13 template-library path.
      PRECONDITIONS (step 0): FR-11 module + the v13 template library + cached traces present, with at
      least one DISTRIBUTIONALLY-DISTINCT (shifted) slice to serve as the OOD fresh session. If not ->
      "complete: blocked_fr11_module_or_shifted_slice_unavailable".
      INFERENCE-SUBSTRATE HYGIENE: verifier_ensemble_against_cached_candidates; NO GGUF/CUDA marker;
      adversarial_verify clean.
      NULL DISCIPLINE: "the template helps under shift" is a real positive only if deploy beats cold-start
      with a CI; "the template falls back gracefully (no worse than cold-start, no collapse)" is an
      acceptable conservative outcome; "the template HURTS under shift" is an honest negative that informs
      the deploy policy.
      CONCRETE STEPS:
