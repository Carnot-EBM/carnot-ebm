- id: exp1391-fullscale-pipeline-failure-diagnosis
  milestone: 2026.04.108
  deliverable: results/experiment_1391_fullscale_pipeline_failure_diagnosis.json
  title: "Full-Scale Pipeline Failure Diagnosis — Classify 41% Semantic Validation Failures"
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  estimated_wall_time_min: 40
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1382-fullscale-certificate-semantic-repair-100cases
      verdict: semantic_validation_pass_rate_0.59_full_pipeline_pass_rate_0.29
      addressed_by: "exp1382 ran 100 cases with certificate_parse_rate=1.0 but semantic_validation_pass_rate=0.59. 41 of 100 certificates passed parsing but failed semantic validation. Root cause is unknown — could be Z3 constraint mismatches, certificate field errors, validator logic bugs, or corpus-specific patterns. This diagnostic task classifies the 41 failures into categories without re-running inference."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Exp1382 (full-scale certificate + semantic repair, 100 cases) achieved
    certificate_parse_rate=1.0 but only semantic_validation_pass_rate=0.59
    and full_pipeline_pass_rate=0.29. Forty-one of 100 parsed certificates
    failed semantic validation. The full validation chain (NSVIF Z3 validator
    + semantic consistency checks) rejected 41% of certificates. Before we
    can fix the pass rate, we need to understand WHY they fail. This task
    reads the exp1382 artifact and any intermediate outputs, samples and
    classifies the failure modes, and produces a structured failure taxonomy
    that gates the fix in exp1396. Use {project_root} as the project root
    and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - results/experiment_1382_fullscale_certificate_semantic_repair_100cases.json
    - python/carnot/verify/
    - python/carnot/pipeline/
    - openspec/capabilities/verification/spec.md
    - openspec/capabilities/pipeline/spec.md

    TASK:
    Diagnose the 41% semantic validation failure rate from exp1382. Classify
    failures into named categories. Produce a ranked list of failure modes with
    estimated fix complexity for each.

    REQUIRED ARTIFACT FIELDS:
    - status
    - total_cases_analyzed
    - parse_rate_confirmed
    - semantic_validation_failures_classified
    - failure_categories
    - failure_category_counts
    - top_failure_category
    - fixable_failure_pct
    - estimated_semantic_validation_pass_rate_after_fixes
    - failure_analysis_complete
    - recommended_fixes
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1391_fullscale_pipeline_failure_diagnosis.json immediately with status="in_progress".
    2. Read results/experiment_1382_fullscale_certificate_semantic_repair_100cases.json.
    3. Identify where the intermediate failure data is stored (per-case results, failed case IDs, error messages).
    4. For each failed case (semantic_validation failed), categorize into one of:
       a. Z3_CONSTRAINT_MISMATCH: Z3 solver returned UNSAT for a certificate constraint that should be satisfiable.
       b. MISSING_CERTIFICATE_FIELD: Required field absent or malformed in extracted certificate.
       c. SEMANTIC_CONTRADICTION: Certificate claim contradicts another claim in the same certificate.
       d. CORPUS_SPECIFIC: Failure tied to specific FoVer question types (arithmetic vs. logical vs. code).
       e. VALIDATOR_BUG: Validator rejects a certificate that is logically valid (false negative).
       f. OTHER: Cannot classify.
    5. Count failure_category_counts for each category.
    6. Set top_failure_category to the highest-count category.
    7. Estimate fixable_failure_pct: fraction of failures in categories that have a tractable code fix (MISSING_FIELD, VALIDATOR_BUG, CORPUS_SPECIFIC) vs. fundamentally hard (Z3_CONSTRAINT_MISMATCH, SEMANTIC_CONTRADICTION).
    8. Estimate estimated_semantic_validation_pass_rate_after_fixes if fixable categories are resolved.
    9. Set failure_analysis_complete=true.
    10. List recommended_fixes for exp1396.
    11. Write all required fields, status="complete", honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1391_fullscale_pipeline_failure_diagnosis.json')); print(d.get('failure_analysis_complete'), d.get('top_failure_category'), d.get('estimated_semantic_validation_pass_rate_after_fixes'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

