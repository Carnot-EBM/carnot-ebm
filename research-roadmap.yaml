           (candidate maximizing the A1 LEARNED score -- NO demo execution at inference), oracle@K (any
           candidate exactly correct = the POSITIVE CONTROL), a MATCHED no-verifier control (same budget,
           random/first selection), and a MARGIN-TRIGGERED override (keep the vote candidate UNLESS the
           aggregator margin between top-1 and the vote candidate clears a threshold PRE-REGISTERED on the A1
           fold -- 2606.04323).
        2. POSITIVE CONTROL FIRST: if oracle@K ~= vote@1 (no recoverable headroom) the corpus is
           ceiling-saturated -> the null is UNINFORMATIVE (FALSE_NEGATIVE_RISK) -> report
           `complete_oracle_distinct_arc_no_headroom_uninformative`, do NOT claim the verifier fails.
