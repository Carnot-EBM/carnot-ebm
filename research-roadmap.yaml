- id: exp1020-almc-ode-v2
  milestone: 2026.04.79
  deliverable: results/experiment_1020_almc_ode_v2.json
  title: "ALMC-ODE Annealed Sampler v2 — Multimodal Escape + Mpemba Initialization"
  prompt: |
    CONTEXT:
    ALMC-ODE (arXiv 2604.20052, April 2026): Annealed Langevin Monte Carlo via ODE for
    high-dimensional multimodal distributions. Addresses Carnot's LSB sampler limitation:
    LSB doesn't explicitly handle multimodal energy landscapes and can get stuck in local minima.

    Exp 1011 (.78) was DOOMED_RERUN_BLOCKed because the planning agent forgot to add
    prior_failures YAML field. This v2 adds Mpemba-optimized initialization from
    arXiv 2603.24183 (Digitally Optimized Initializations for Fast Thermodynamic Computing):
    compute the mean-field equilibrium as warm start, reducing convergence steps by 2-5x vs
    random initialization.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/lsb_sampler.py (LSB sampler — baseline)
    - python/carnot/samplers/ (find sampler base class/protocol)
    - results/experiment_983_langevin_sb_boltzmann_sampler.json (LSB baseline results)
    - python/carnot/models/ising.py (IsingEBM — energy function being sampled)
    - openspec/capabilities/training-inference/spec.md (REQ-SAMPLE-007)

    TASK:
    1. IMPLEMENT ALMCODESampler in python/carnot/samplers/almc_ode_sampler.py:
       class MpembaInitializer:
           def compute_mean_field_equilibrium(energy_fn, n_spins) -> np.ndarray:
               # Mean-field: x_i = tanh(-beta * sum_j J_ij * x_j) solved iteratively
               # 10 iterations of fixed-point update from x=0 start
               # This is the "warm" state that's close to thermal equilibrium
       class ALMCODESampler:
           def sample(energy_fn, x0=None, n_steps=100, T_max=2.0, tau=50.0,
                      use_mpemba_init=True) -> np.ndarray:
               # If use_mpemba_init and x0 is None: use MpembaInitializer
               # Temperature schedule: T(t) = T_max * exp(-t/tau)
               # Langevin update: x_{t+1} = x_t - eta * grad_E(x_t, T(t)) + noise(T(t))
           def convergence_curve(energy_fn, x0=None, n_steps=100) -> list[float]
    2. BENCHMARK on 3 synthetic constraint problems:
       a. Unimodal: compare LSB, ALMC-random-init, ALMC-Mpemba-init (LSB expected best)
       b. Bimodal: two-well Ising — ALMC must escape local min; Mpemba should help find right well
       c. FoVer constraints: 10 pairs from fover_labeled or expanded corpus
    3. COMPARE convergence_steps_to_threshold AND multimodal_escape_rate for all three methods.
    4. ADD REQ-SAMPLE-022/023 + SCENARIO-SAMPLE-037/038 to spec.
    5. Write 100% coverage tests.
