- id: exp1309-sota-gguf-pair-resolver-repair
  milestone: 2026.04.102
  deliverable: results/experiment_1309_sota_gguf_pair_resolver_repair.json
  title: "SOTA GGUF Pair Resolver Repair - Two Cached Headline Models Are Enough"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 35
  priority: critical
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1297-sota-gguf-cache-provenance-preflight-v2
      verdict: sota_gguf_cache_not_ready
      addressed_by: "Repair the resolver behavior observed in .101: two mandated models were cached but cached_sota_pair() returned no loadable specs and missing optional cache state blocked headline work."
      retire_if_same_verdict: true
    - experiment_id: exp1282-sota-gguf-cache-provenance-preflight
      verdict: blocked_gate_check_failed
      addressed_by: "This task works after .101 activation hygiene and directly patches/tests the resolver instead of only rerunning preflight."
      retire_if_same_verdict: true
    - experiment_id: exp1271-triggered-certificate-extraction-sota-gguf
      verdict: blocked_gate_check_failed
      addressed_by: "Certificate extraction remains gated until the SOTA resolver emits usable local MODEL_SPECS."
      retire_if_same_verdict: true
    - experiment_id: exp785-sota-model-load
      verdict: blocked_model_load_failed
      addressed_by: "Use the current GGUF registry, cached_sota_pair() helper, and focused tests rather than retrying the old model-load path."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Milestone .101 found that two mandated headline GGUF models appeared cached
    but cached_sota_pair() returned no loadable specs and the missing middle MoE
    kept cached_sota_ready=false. This is now the main blocker for SOTA
    certificate work. Use {project_root} as the project root and {date} as the
    run date in artifact metadata.

    Required local headline model IDs:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - tests/
    - openspec/capabilities/pipeline/spec.md
    - openspec/capabilities/self-learning/spec.md
    - results/experiment_1297_sota_gguf_cache_provenance_preflight_v2.json
    - results/experiment_1308_milestone_retro_101.json

    TASK:
    Repair or confirm the SOTA GGUF pair resolver so that two cached mandated
    headline models are sufficient to produce two loadable MODEL_SPECS. If the
    current OpenSpec requires all three mandated models for every headline run,
    update the relevant spec requirement first; otherwise keep the change scoped
    to resolver/cache policy and tests. Do not modify research-roadmap.yaml.

    REQUIRED ARTIFACT FIELDS:
    - status
    - sota_pair_ready
    - cached_pair_specs_count
    - cached_mandated_models
    - missing_optional_models
    - resolver_code_changed
    - spec_updated
    - focused_tests_passed
    - headline_result_possible
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1309_sota_gguf_pair_resolver_repair.json immediately with status="in_progress".
    2. Inspect cached_sota_pair(), the SOTA model registry, cache discovery paths, and the exp1297 artifact fields that showed two cached models but zero returned specs.
    3. If the helper incorrectly treats the third model as mandatory for a pair, patch it so a deterministic two-model pair can be returned from cached mandated models while recording missing_optional_models.
    4. Add or update focused tests that cover: two cached mandated models, one cached mandated model, no cached mandated models, and missing optional third model.
    5. Run the focused resolver tests and any relevant import smoke test. Do not download models and do not run full GPU inference in this task.
    6. Write cached_mandated_models, missing_optional_models, cached_pair_specs_count, sota_pair_ready, headline_result_possible, resolver_code_changed, spec_updated, focused_tests_passed, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1309_sota_gguf_pair_resolver_repair.json')); print(d.get('sota_pair_ready'), d.get('cached_pair_specs_count'), d.get('headline_result_possible'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1310-sota-gguf-llamacpp-smoke-load
  milestone: 2026.04.102
  deliverable: results/experiment_1310_sota_gguf_llamacpp_smoke_load.json
  title: "SOTA GGUF llama.cpp Smoke Load + Throughput Probe - Gated on Resolver Ready"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 45
  priority: critical
  requires_gpu: true
  gated_on:
    - upstream: exp1309-sota-gguf-pair-resolver-repair
      artifact_field: sota_pair_ready
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1297-sota-gguf-cache-provenance-preflight-v2
      verdict: cached_sota_pair_returned_two_loadable_specs_false
      addressed_by: "Run only after exp1309 proves the resolver returns two loadable local specs."
      retire_if_same_verdict: true
    - experiment_id: exp785-sota-model-load
      verdict: blocked_model_load_failed
      addressed_by: "Use current cached GGUF specs and record import/runtime blockers instead of old loading paths."
      retire_if_same_verdict: true
    - experiment_id: exp811-sota-model-load
      verdict: blocked_model_load_failed
      addressed_by: "Perform a minimal smoke load and terminal blocker artifact, not a silent full benchmark attempt."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    exp1309 should repair the resolver. This task proves whether the resolved
    local SOTA pair can actually smoke-load through the available llama.cpp
    runtime and produce a small number of tokens. Use {project_root} as the
    project root and {date} as the run date in artifact metadata.

    MODEL_SPECS:
    Use python/carnot/inference/sota_models.py cached_sota_pair(gpu_indices=(0, 1)).
    Headline models must be drawn from:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models may only be used for CPU smoke tests with headline_result_possible=false.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - results/experiment_1309_sota_gguf_pair_resolver_repair.json
    - ops/known-issues.md
    - research-hardware-wishlist.md

    TASK:
    Run a minimal smoke load and throughput probe for the resolved local SOTA
    pair. Keep the workload tiny: this task only establishes readiness for
    downstream certificate runs.

    REQUIRED ARTIFACT FIELDS:
    - status
    - models_loaded
    - llama_cpp_import_ok
    - tokens_per_second
    - gpu_memory_gb
    - model_specs_count
    - models_used
    - headline_result_possible
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1310_sota_gguf_llamacpp_smoke_load.json immediately with status="in_progress".
    2. Load exp1309 and abort to a terminal blocker if sota_pair_ready is not true.
    3. Resolve MODEL_SPECS via cached_sota_pair(gpu_indices=(0, 1)) and record the exact model IDs, paths, quantization suffixes, and GPU assignment.
    4. Import the local llama.cpp binding or runner used by the project. If unavailable, record llama_cpp_import_ok=false with the exact exception and do not fake generation.
    5. For each resolved model, run one deterministic prompt with a very small max token budget and record load success, token count, elapsed seconds, tokens_per_second, and GPU memory if available.
    6. Write models_loaded, llama_cpp_import_ok, tokens_per_second, gpu_memory_gb, model_specs_count, models_used, headline_result_possible, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1310_sota_gguf_llamacpp_smoke_load.json')); print(d.get('models_loaded'), d.get('headline_result_possible'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

