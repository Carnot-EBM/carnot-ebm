    prompt: |
      CONTEXT: The self-learning thesis (PRD FR-11 / continuous self-learning) rests on alpha_t grounding
      — the verifier signal that keeps a self-correcting model from collapsing onto its own null space
      (Zenil alpha_t; Q12 Dark Room / Hypothesis-B). exp3555 (.327) DEPLOYED the conservative-default beta
      end-to-end on a NON-DEGENERATE corpus (initial true accuracy 0.34) and confirmed it prevents
      depth-N>=200 collapse while beta=0 collapses, preserving real quality. This task ADVANCES it on two
      axes: (1) ROBUSTNESS — run the loop on a 3-corpus non-degenerate BATTERY; (2) P0.2 VERIFIER
      DIVERSITY — test whether DIVERSE multi-verifier alpha_t grounding (combine the verifier ensemble
      Weaver-style, arXiv:2506.18203; BoN-MAV arXiv:2502.20379) sustains collapse-prevention + quality
      BETTER than single-verifier grounding. The orthogonality-stall theory (project_orthogonality_stall,
      project_pathological_joint_null_space) predicts single-verifier grounding has a compute-immune
      ceiling because the residual rotates into the verifier's null space — verifier DIVERSITY is the
      candidate antidote. Cached traces + cached verifier scoring -> no live model -> no timeout. This is
      the milestone's mandatory continuous-self-learning experiment.

      EXISTING CODE TO READ FIRST:
        - scripts/experiment_3555_fr11_conservative_default_deploy_nondegenerate_corpus_v3.py (REUSE the closed-loop harness + collapse detection + the pass_rate/true_accuracy distinct assert + the non-degenerate-corpus gate; ADD a multi-corpus loop + a single-vs-diverse grounding contrast)
        - results/experiment_3555_fr11_conservative_default_deploy_nondegenerate_corpus_v3.json (the single-corpus deploy: initial_true_accuracy 0.34, real quality maintained)
