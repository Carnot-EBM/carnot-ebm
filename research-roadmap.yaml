- id: exp7113-arc-generation-liveness-recovery
  title: Bounded ARC local-generation liveness and receipt recovery
  track: arc
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 100
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.09.624
  deliverable: results/experiment_7113_v624_arc_generation_liveness.json
  prior_failures:
    - experiment_id: exp7099-adapter-withheld-live-path-preflight
      verdict: complete_null_adapter_withheld_live_path_not_ready_no_solve_claim
      addressed_by: "Exp7113 narrows the retry to request-level local-generation liveness, records prompt/token/action/GPU receipts, and enforces model_bounded_generation instead of inferring success from process load."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7099 launched both local model processes but produced zero generation
    cells in 41.4 seconds and mislabeled the run as full generation. That cannot
    support adapter-withheld ARC measurement. This recovery task asks only
    whether two bounded prompts traverse the real local-generation path and
    yield parseable action receipts. It does not claim a game solve.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/ops/known-issues.md
    - {project_root}/ops/arc_solve_registry.yaml
    - {project_root}/results/experiment_7099_v623_adapter_withheld_preflight.json
    - {project_root}/scripts/experiments/experiment_7099_v623_adapter_withheld_preflight.py
