    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - results/experiment_1520_runtime_contract_e2e_harness.json
    - results/experiment_1522_cdg_root_cause_repair.json
    - python/carnot/verify/
    - python/carnot/energy/
    - tests/python/

    TASK:
    Build a bounded SATQuest-style CNF verifier benchmark with local solver
    authority and run mandated local SOTA GGUFs against it.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - satquest_benchmark_ready
    - model_specs
    - live_sota_model_inference_used
    - cnf_instances
    - formats_tested
    - solver_oracle_used
    - solver_oracle_false_accepts
    - baseline_accuracy
    - energy_ranked_accuracy
    - repair_hint_accuracy
    - false_accept_rate
    - benchmark_manifest_path
    - focused_tests_passed
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1536_satquest_cnf_verifier_benchmark.json immediately with status="in_progress".
    2. Generate or load a bounded CNF instance set with satisfiable and unsatisfiable cases. Prefer PySAT if available; otherwise use an existing local exact SAT solver or implement a small exhaustive solver for bounded sizes and record the fallback.
    3. Emit machine, symbolic, and narrative prompt formats for each instance.
    4. Run at least one mandated SOTA headline model using the existing local GGUF runner pattern. Record model specs and whether live inference was used.
    5. Compare baseline answer accuracy with Carnot energy-ranked candidates and repair-hint-assisted answers. PySAT/local exact solver remains final authority.
    6. Write a benchmark manifest under results/ or ops/ and add focused tests for label reproducibility.
    7. Record false accepts separately from ordinary wrong answers.
    8. Write the final artifact with status="complete".

