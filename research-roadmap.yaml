    3. Extend the relevant spec before implementation. Write meaningful failing spec-linked tests before behavior changes. Reuse narrow shipped helpers and a thin experiment wrapper. Do not clone an old experiment main or inherit its task count, paths, model settings or validation manifest. Pure reductions need tests only for new reducer behavior.
    4. Declare inference_substrate_class=aggregation and execution_venue=host. Set MODEL_SPECS=[], model_invoked=false and all current LLM invocation counts to zero. Compact numeric energy-head fitting uses separate small_ebm_training receipts. Archived and scripted model events stay in typed hash-bound sidecars.
    5. Read only fit, probability_calibration and policy_calibration rows for method design. Do not use final_test or prospective_stream labels, quantiles or metrics to select new policies. Hash the original partitions and source-group identities. Prior exposure of evaluation data must be disclosed even when this execution hides them.
    6. For every arm and action, count zero selected groups, nonzero but uncertified groups, and certified groups under the old thresholds. Emit score quantiles, harmful counts and exact binomial upper bounds. Compute the zero-error sample requirement n >= ceil(log(delta)/log(1-risk_budget)). Do not infer that multiplicity caused emptiness when the selected count itself is zero.
    7. Freeze three deployed heads: Gibbs 6-4-1, sparse spline 49, and raw L2 logistic. Average each head over the same five fixed training seeds before any policy fitting. These are three deployed functions, not five independent datasets. Keep dense spline logistic solely as an equivalence control.
    8. Use deterministic source-group halves of probability_calibration: one for scalar probability calibration, one for policy tuning. Define candidate accept/reject thresholds from tuning score quantiles at deciles plus both no-action sentinels. Use one label-blind representative per source group. Select exactly one pair per head on tuning data, with a fixed tie rule. Freeze a utility of +1 correct action, -20 harmful accept, -10 harmful reject and 0 escalation.
    9. Reserve policy_calibration solely for certification. For three frozen policies, allocate familywise delta=0.05 equally over nine checks: accept harm upper bound, reject harm upper bound, and non-escalation coverage lower bound per policy. Keep exact Clopper-Pearson bounds. Retain accept risk <=0.05, reject risk <=0.10 and certified coverage >=0.25. Disabled or empty actions have undefined risk, never zero risk. A failed policy becomes all-escalate.
