      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V616 executed five tasks, exp7028 through exp7032, while its design document
    still promised ten tasks through exp7037. Exp7028 correctly disqualified
    that contract. IDs exp7033 through exp7037 also remain embedded in active
    specifications and audit fixtures, so V617 does not reuse them. V617 has
    exactly 12 tasks, exp7038 through exp7049, in one order in the activated
    YAML and this design document. This task is advisory. It must not gate the
    science chain.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md section "V617 Planner Refresh"
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7028_v616_active_contract_preflight.json
    - {project_root}/results/experiment_7032_repaired_belief_shadow_live_trace.json
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/scripts/conductor_gates.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/validate_prior_failures.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and run an independent V617 active-YAML versus Markdown contract
    preflight. Check the exact count, order, IDs, titles, deliverables, gates,
    producer fields, prior-failure records, model declarations, prompt tails,
    and reserved-ID rule. Do not activate or rewrite a roadmap.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable `research-roadmap.yaml`, the V617 design
       document, Exp7028 evidence, the exclusion manifest, and a writable
       artifact path. The execution-time parser must not require the staging
       file. On failure write a terminal blocked artifact. Put the failed
       check, expected value, and observed value in gate_check_summary.
    1. Add REQ-REPORT-7038 and RED tests before implementation. Cover exactly
       12 tasks, ordered IDs exp7038-exp7049, one missing row, one reordered
       row, one changed gate field, one missing prompt tail, and attempted
       reuse of exp7033-exp7037.
    2. Parse Markdown and active YAML independently. Do not build both views
       from one shared task object.
    3. Require exact milestone, count, order, full ID, title, deliverable,
       structured gate, and task-field parity. Confirm the 12 IDs are unique
       and absent from completed or retired experiment ID sets.
    4. Require every gate producer to occur earlier in this YAML. Require the
       exact bare top-level artifact field in the producer's own REQUIRED
       ARTIFACT FIELDS block.
    5. Require all four prior_failures sub-fields, every comparative task's
       per_unit_rows flag, the closed verdict_class enum, gate diagnostics,
       legal inference substrates, and an ungated final capstone.
    6. Require every live-model task to name a mandated SOTA GGUF through the
       cached_sota_pair() pattern. Reject a legacy-small headline fallback.
    7. Set v617_task_contract_conforms_score=1 only when all 12 independent
       task rows agree. A contract mismatch is disqualified. A missing
       execution prerequisite is blocked. Neither is partial.
    8. Run focused tests, YAML parsing, prior-failure validation, roadmap gate
       audit, exclusion-manifest lint, artifact validation, adversarial
       verification, row-consistency lint, spec coverage, and root-clutter
       checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (aggregation_from_upstream_artifacts); duration_s;
       source_artifact_hashes; rows; markdown_task_rows; yaml_task_rows;
       task_contract_rows; title_parity_rows; deliverable_parity_rows;
       gate_contract_rows; gate_producer_rows; prior_failure_rows;
       reserved_id_rows; retired_id_rows; model_compliance_rows;
       substrate_compliance_rows; artifact_field_rows; prompt_tail_rows;
