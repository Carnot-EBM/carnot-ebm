    addressed_by: V672 design stopped at phase 1 and lacked its table/JSON; V673 supplies both and tests the real
      parser before activation.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.673. V672 qualified a finite alignment fixture but obtained no fresh cohort or empirical retained-learning evidence. This milestone tests changed mechanisms on explicitly exposed development data and adapter-withheld public games. It makes no fresh generalization claim.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/python/carnot/reporting/v672_contract.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/research-references.md
    - {project_root}/research-studying.md

    TASK:
    Produce results/experiment_7726_v673_contract_methods.json. Add REQ-REPORT-7726 plus the capability requirements before code. New thin CLI: scripts/experiments/experiment_7726_v673_contract_methods.py. Orchestration: python/carnot/experiment_7726_v673_contract_methods.py. Tests: tests/python/test_experiment_7726_v673_contract_methods.py. Raw evidence: results/raw/experiment_7726_v673_contract_methods/. These are planned outputs, not existing input preconditions.
    Execution: inference_substrate_class=aggregation; MODEL_SPECS=[]. The coding-agent model is separate from the experimental model.

    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed progress line immediately. Resolve {project_root} absolutely. Check input hashes, exact schemas and owned resources before work. Missing external prerequisites produce complete_blocked_<reason>, verdict_class=blocked and gate_check_summary. Preserve unrelated edits and credentials.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER EVERY potentially minutes-long model load, generation, benchmark and subprocess. Print elapsed time and completed units INSIDE long loops at least every 60 seconds. Stream child output with an owned heartbeat. Keep every silence gap under 600 seconds. A silent run can die at 1200 seconds despite the 4800-second hard cap. Checkpoint real completed work; do not pad durations.

    3. Bound every tool call. Write any file over about 200 lines in several tool calls of roughly 100-150 lines. Send a progress message BETWEEN calls. Split long reads and checks too. Put throwaway probes in /tmp, experiments in scripts/experiments, and tests in tests/python.

    4. Before implementation, add the task REQ-* and SCENARIO-* to the relevant capability spec. Write meaningful failing tests first. Freeze the affected validation scope before results. Keep entrypoints thin and reuse existing modules. Do not make the full repository suite a model-load or science-readiness precondition.

    5. Compare the staged V673 YAML with the design Exact Task Contract table and JSON block: thirteen tasks Exp7726-Exp7738. After activation accept only the matching V673 active roadmap. Parse all three sources independently. Test deletion, reorder, stale milestone, wrong producer field and missing mandated model in private copies. Do not regenerate missing design content during measurement. This administrative task gates no science.

    6. Write docs/research-notes/v673-method-map.md. Ingest SURE-RAG set coverage, HalluSpan input alignment, DCCD and delayed-feedback bounds from the V673 references entry. Run a focused sequential arXiv/Semantic Scholar delta search. Record failures without claiming exhaustive coverage. Mark ingested methods in research-studying.md. Preserve V672 verdicts and the preserved design hash.

    7. Run schema, exclusion, prior-failure, gate, harness-fit, ARC, overdue and prompt-path checks on the staged bytes. Required inputs must exist; explicitly planned outputs must not be required beforehand. Keep metadata inventory separate from source exposure. Audit actual dispatcher routing without changing it.

    8. Task E2E: Cold CLI replay from raw rows to the terminal JSON must agree.

    9. Run scoped pytest with -n 0 -o addopts=, pinned PYTHONPATH, private COVERAGE_FILE and private --basetemp. Create the basetemp parent first. Require 100 percent changed-module coverage, affected-test spec coverage, scoped Ruff check/format and changed-module mypy. For Rust changes require affected cargo test, fmt and clippy. Run the task-specific E2E and applicable ops/e2e-test-plan.md checks. Record global suite debt separately; never suppress an affected failure or weaken assertions.

    10. Cold-reduce raw rows in a fresh process. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the terminal candidate. Capture reader commands, exits and hashes before atomic publication. Fixture truth is circular_positive; administrative readiness is null. A valid scientific null can open measurement readiness; missing data or failed checks cannot.

    11. Reconcile openspec, _bmad/traceability.md, ops/status.md and ops/changelog.md from actual evidence. Preserve old artifact bytes. Apply each declared same-verdict retirement only to its matching scope. Keep defaults opt-in. Do not activate a roadmap, edit research-roadmap.yaml, train generator weights, publish, submit, purchase hardware or modify conductor settings.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: Use a terminal complete_ prefix. A complete task need not show benefit. principle: Terminal custody avoids retries of unchanged external failures.
    - verdict_class: Exactly positive | circular_positive | null | blocked | disqualified | partial. External absence, retirement or an unchanged upstream block is blocked. partial only means incomplete owned work that retry can finish. principle: The limits of a claim must travel with the result.
    - flagged_adversarial: Actual terminal-reader boolean. Flagged evidence opens no readiness gate. principle: Measured evidence bounds the claim and downstream use.
    - gate_check_summary: For every blocked_* or complete_blocked_* result: check, upstream ID, artifact path, field, operator, expected and observed value. principle: Measured evidence bounds the claim and downstream use.
    - acceptance_gate_results: Separate validity, readiness, Brier score, decision cost, coverage, retention and efficiency. Null means unmeasured. principle: Measured evidence bounds the claim and downstream use.
    - rows: One row per independent family or game/seed/arm. Include raw metrics, denominators, censoring, exclusions and input hashes. principle: A comparison must be recomputable without repeating model work.
    - sample_size_budget: Intended, observed, eligible, excluded and censored counts; effective independent families. Seeds, windows and arms do not increase independent N. principle: Measured evidence bounds the claim and downstream use.
    - claim_scope: development_only for reused RAGTruth; fixture_only for exact fixtures; adapter_withheld_public for ARC. fresh_generalization_eligible=false throughout this milestone. principle: Prior exposure cannot be erased by a new split or experiment ID.
    - inference_substrate: Actual computation in established vocabulary, separate from historical provenance. principle: Measured evidence bounds the claim and downstream use.
    - inference_substrate_class: Actual and planned class. model_full_generation has a 60s floor; model_bounded_generation has 10s; model_load_no_generation has 2s. no_model_load before an unsuccessful load. No padding. principle: Measured evidence bounds the claim and downstream use.
    - MODEL_SPECS: Also emit planned_MODEL_SPECS and reader-compatible model_specs. Every current LLM is unsloth/Qwen3.8-27B-GGUF. No-model tasks use []. principle: The declared model must match the process actually invoked.
    - model_invoked: Actual flag and counts of model loads, forwards, generations, input/output tokens, failures and cancellations. principle: Measured evidence bounds the claim and downstream use.
    - execution_venue: host, kv260, polarfire or gatemate. execution_venue_details records host/PID and GPU UUID only when used. principle: Measured evidence bounds the claim and downstream use.
    - phase_spans: Disjoint monotonic spans, duration_s, run_date, heartbeat times, completed units and checkpoint hashes. principle: Measured evidence bounds the claim and downstream use.
    - random_seed: Declare each seed purpose. reproducibility_checksum binds configuration, input bytes and reducer code. principle: Measured evidence bounds the claim and downstream use.
    - source_artifact_hashes: Distinguish eligible producers, flagged historical inputs, pre-gate receipts and absent sources. Never require the planned own output as input. principle: Measured evidence bounds the claim and downstream use.
    - preconditions_checked: Measured resources, existence and schema. State actual effective coding backend, not just requested YAML routing. principle: Measured evidence bounds the claim and downstream use.
    - validation_receipts: Frozen affected scope; actual commands, exits and log hashes; cold replay and applicable E2E. Record repository-wide debt separately. principle: A result is usable only after its registered checks pass.
    - verifier_is_oracle: True for exact fixture certification; this forbids positive and requires circular_positive for successful fixture claims. principle: Measured evidence bounds the claim and downstream use.
    - field_principles: Echo each required field and gate with the principle it enforces. principle: Measured evidence bounds the claim and downstream use.
    - contract_ready_score: 1 only when table, machine block and YAML agree on every task, path, model, substrate and gate. Administrative only. principle: Measured evidence bounds the claim and downstream use.
    - method_map_path: docs/research-notes/v673-method-map.md with primary URLs, review depth and local adaptations. principle: Measured evidence bounds the claim and downstream use.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7726_v673_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
