theme: 'The verifier moat is still UNTESTED -- .461 measured zero real trained verifiers (all three arms failed
  to execute: D1 skeleton-bail, D2 blocked on logprob cache, D3 degenerate always-abstain to a k=1 strawman SC).
  .462 is the FIRST REAL PHASE D test. It builds the two prerequisites the .461 degeneracy exposed (B1 a GENUINE
  K-way tuned-SC baseline -- not k=1 -- with the K-sweep reported + an always-abstain degeneracy guard; B2 a
  shared logprob-enriched candidate cache that unblocks D2 and feeds D1/D3/cascade, generated once = anti-churn),
  then re-executes the three constructions PROPERLY on headroom-present ORACLE-DISTINCT corpora: D1 TRAINS a
  Qwen3.5-1.7B LoRA-EBM holistic-quality scorer (train-first-not-skeleton-first; the gate REQUIRES train_loss
  non-null so a skeleton cannot pass), D2 replicates uPRM (arXiv:2605.10158, the published unsupervised process RM
  that beats SC by up to 6.9%) unblocked via the B2 cache with an LC-ERD (arXiv:2605.24005) fallback, D3 builds a
  NON-DEGENERATE EBRM that refines the REAL D1 trained scorer (gated_on D1) with the E1-ingested uncertainty heads
  (UARM 2606.19818, distributional-pessimistic 2606.09073, RewardUQ 2602.24040 calibration) and a capped
  abstention. All are oracle-distinct SELECTORS (verifier never sees gold at inference) vs the GENUINE tuned-SC.
  A north-star-§5 EFFICIENCY arm tests the uncertainty-routed cheap->strong-judge cascade (arXiv:2510.20369): a
  Pareto win = accuracy parity at materially fewer judge calls (charge the judge budget explicitly; the judge must
  not become the moat). D4 generalizes the best arm to a 2nd headroom-present corpus; D5 aggregates the
  falsifiable gate + the DiffusionGemma status (operator-gated -- not autonomously flipped). retire_if_same_verdict
  if the properly-executed LoRA-EBM AND uPRM both null (a publishable bounded null converging with the ARC tie); a
  skeleton/degenerate arm is a FAILED execution, NOT a null. Anti-traps: GENUINE tuned-SC (headroom-control),
  oracle@K + headroom_present on every arm (FALSE_NEGATIVE_RISK), n>=200, paired bootstrap + McNemar, oracle-
  distinctness lint, a train_loss-non-null gate (the anti-skeleton fix). Reserved: 2 infra (B1, B2), 1 hardware
  (C), 1 SOTA-ingestion (E1). Continuous self-learning (E2 ARC self-play / FR-11) + 1 opportunistic ARC level-up
  (E3, honest no-bank). Offline training/scoring on GPU-0 CUDA (2026-06-27), NOT iGPU-pinned. Do NOT re-propose any
  nulled/retired/concluded lever (energy-as-ARC [S0 CONCLUDED], verifier-as-reward [exp4247/exp4263], representation
  #5, dynamics-engine L2, macro, click-heatmap, trust-gate, MATM retrieval, perception-from-grid).'
