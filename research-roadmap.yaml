        verdict: "complete: full 15k KAN/Garak artifact missing after monolithic attempt"
        addressed_by: "This task evaluates only after the split corpus exists. It uses the .302 pilot as a starting point but computes full-corpus DeLong statistics and does not bundle labeling or Garak generation."
        retire_if_same_verdict: true
      - experiment_id: exp3265-prompt-injection-kan-train-eval-shard-v3
        verdict: "complete: shard_auroc=0.791096; n_train=1600; n_eval=400; non-headline"
        addressed_by: "The previous result was a 2k pilot. This task uses the full frozen 15k split and reports DeLong confidence intervals/non-inferiority."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      The KAN sidecar has only a shard-level AUROC. Evaluate it on the full v4 corpus with leakage-audited splits and statistical comparison against exact/baseline detectors.

