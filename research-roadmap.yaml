  - id: exp3352-live-sota-constrained-generation-pilot
    operator_override: "2026-05-29 operator directive (outer-loop session): authorized. Grammar-masked constrained-generation continuation; false-positive scope-match vs exp1758/1759/1959. New approach (grammar-masked extraction)."
    milestone: "2026.05.310"
    title: "Live SOTA constrained generation using grammar-masked extraction"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 10
    track: live-model
    inference_substrate: live_generation
    requires_gpu: true
    deliverable: "results/experiment_3352_constrained_generation.json"
    prompt: |
      CONTEXT: `.309` created a constrained structured-output extractor. We must now apply it to live SOTA generation to evaluate its impact on formatting consistency vs autoregressive free generation.
      EXISTING CODE TO READ FIRST:
        - `scripts/experiment_template.py` (for SOTA GGUF loading)
        - `python/carnot/pipeline/structured_equation_forcer.py`
      TASK: Implement grammar-masked (e.g., using `llguidance` or regex-based constraint masking) generation for a local SOTA GGUF model (`unsloth/gemma-4-26B-A4B-it-GGUF` or `unsloth/Qwen3.6-35B-A3B-GGUF`).
      CONCRETE STEPS:
        1. Load a SOTA GGUF model.
        2. Generate responses for 20 GSM8K problems using standard autoregressive decoding.
        3. Generate responses using constrained generation (enforcing strict structural output formats).
        4. Measure the malformed extraction rate and solver acceptance rate for both.
        5. Emit comparative metrics in the artifact.

      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3352_constrained_generation.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3353-deterministic-prefix-closed-bounds
    milestone: "2026.05.310"
    title: "Deterministic prefix-closed bounds pilot for live LLM sampling"
    priority: normal
    max_turns: 50
    agent_type: codex
    estimated_wall_time_min: 10
    track: verification
    inference_substrate: synthetic
    requires_gpu: false
    deliverable: "results/experiment_3353_deterministic_bounds.json"
    prompt: |
      CONTEXT: Based on 2026 BEAVER research (arXiv:2512.05439), deterministic bounds on constraint satisfaction outperform probabilistic sampling.
      EXISTING CODE TO READ FIRST:
        - `python/carnot/cascade/tier2_verifier.py`
      TASK: Implement a Token Trie and Frontier data structure to maintain prefix-closed bounds over constraint evaluations.
      CONCRETE STEPS:
        1. Create a `PrefixClosedBoundVerifier` that explores a generation space tree.
        2. Evaluate a synthetic problem space where prefixes deterministically violate constraints.
        3. Compute sound probability bounds and compare against loose sampling bounds.
        4. Validate that the bound is monotonic and tighter than sampling.

      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3353_deterministic_bounds.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3354-ebt-sidecar-scoring
    milestone: "2026.05.310"
    title: "Energy-Based Transformer (EBT) sidecar integration for sequence scoring"
    priority: normal
    max_turns: 50
    estimated_wall_time_min: 10
    track: verification
    inference_substrate: live_generation
