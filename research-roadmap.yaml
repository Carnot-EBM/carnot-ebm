milestone: "2026.05.184"
milestone_title: "Carnot Fast-Slow Variant Prototype + Phase 1 PyPI Retry + .183 Audit + Phase 4 Validation"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
scope_reduction_compliance:
  rationale: ".182 diagnostics produced 3 clean root-causes: (a) exp1745 Phase 4 invariance is SUBSTRATE-LEVEL not aggregation-level (distinguishable_steps=0 even per-step — ensemble-output metrics fundamentally inaccessible), (b) exp1746 QAOD/NLA TPR collapse root cause is corpus_identity_mismatch (exp1740 generated DIFFERENT corpus than exp1716), (c) exp1747 EBT 128% energy decrease root cause is energy_unbounded_below (NOT mode collapse). .183 carries forward (a/b/c) as exp1751-1755. The GAP in .183 is the operator-flagged Fast-Slow Variant (arXiv:2605.12484 Score 400) which is the EXPLICIT Phase 4 rescue path given exp1745's measurement-inaccessibility verdict. .184 lands that prototype + the still-stranded Phase 1 PyPI prong + .183 audit."
  carry_forwards_addressed: ["Fast-Slow Variant prototype (operator-flagged 400-score, Phase 4 rescue)", "Phase 1 PyPI prong (blocked_credentials since .175)", ".183 audit (11 tasks)", "Phase 4 thermodynamic metric validation if .183 exp1754/1755 ship"]
authored_by: outer-loop-claude

tasks:
  - id: exp1761-carnot-fast-slow-variant-prototype
    title: "Exp 1761: Carnot Fast-Slow Variant prototype (operator-flagged arXiv:2605.12484, Phase 4 rescue)"
    deliverable: results/experiment_1761_fast_slow_variant.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1745-phase4-per-step-alpha-disaggregation
        verdict: complete_phase4_metric_inaccessible_at_ensemble_level
        addressed_by: "exp1745 (.182) confirmed Phase 4 invariance is substrate-level: distinguishable_steps=0 even with per-step disaggregation. Ensemble-output metrics fundamentally cannot measure free-energy reduction. The Fast-Slow paper (arXiv:2605.12484, Score 400) provides an explicit alternative: measure on the FAST WEIGHTS (verifier-shaped context) not the slow weights (base LLM output). This task is the explicit rescue path."
        retire_if_same_verdict: false
      - experiment_id: exp1715-phase4-alpha-t-audit-retry-v3
        verdict: complete_bijection_invariance_artifact_confirmed
        addressed_by: "exp1715 (.176) was the original falsification. exp1721 (.178) max-caliber replacement also invariant. exp1741 (.181) confirmed scale invariance. exp1745 (.182) confirmed substrate-level. Four prior attempts on ensemble-output measurement failed. This task switches measurement target to fast-weight context per arXiv:2605.12484."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: arXiv:2605.12484 (May 2026, operator-flagged 2026-05-15
      13:15Z, Score 400) introduces Fast-Slow Training (FST): slow weights
      = model parameters (RL); fast weights = optimized context (ICL).
      Reports 3x sample efficiency over RL-only, 70% less KL divergence
      from base, less catastrophic forgetting, continual learning where
      parameter-only RL stalls.

      Carnot's verify-repair loop maps onto FST natively:
        - SLOW weights = k=16 verifier ensemble + base LLM (FROZEN at inference)
        - FAST weights = verifier-output-summary that re-prompts the LLM
          on the next verify-repair iteration

      This task implements a minimal Carnot Fast-Slow Variant + measures
      the 3 paper-headline numbers (sample efficiency, KL drift, continual
      learning plasticity).

      FALSIFIABLE HYPOTHESIS: A minimal Carnot Fast-Slow Variant, when
      compared head-to-head against FR-11 (verifier-as-reward RL baseline)
      on a 3-task continual-learning switch (e.g., GSM8K → BBH → MATH
      subset), achieves AT LEAST 2x sample efficiency to a fixed
      verification-pass-rate target AND <=0.5x KL drift from the base LLM,
      with no catastrophic forgetting (pass rate on prior task degrades
      < 5pp after switching).

      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/verify_repair.py (the existing repair loop;
          this is where the SLOW-weight ensemble lives)
        - python/carnot/pipeline/ebft_autoresearch_loop.py if exists (the
          FR-11 baseline for sample-efficiency comparison)
        - results/experiment_1745_phase4_per_step_alpha.json (the
          measurement-inaccessibility motivation)
        - feedback_nla_class_16th_verifier_committed memory (NLA is
          verifier #16 of slow weights)

      TASK: Implement the Fast-Slow Variant + 3-task continual-learning
      benchmark.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "from carnot.pipeline.verify_repair import
              VerifyRepairPipeline"` succeeds — else
              `blocked_verify_repair_pipeline_missing`.
           b. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              non-empty — else `blocked_model_not_cached`.
           c. At least one FR-11 baseline run exists in results/
              (grep for fr11 or fr_11) — else
              `blocked_no_fr11_baseline_for_comparison` (this is honest;
              cannot ship the comparison without the baseline).
           Record preconditions_checked.
        1. Implement fast_slow_variant(prompt, base_llm, verifier_ensemble,
           max_iters=10) that maintains a "fast-weight context" buffer:
             - Initial context = empty.
             - Each iter t: generate response with base_llm(prompt +
               context_t-1), evaluate with verifier_ensemble → energy.
               If energy below threshold, return. Otherwise, compute
               textual-feedback (summarize the verifier failures) and
               APPEND to context for iter t+1.
             - Slow weights (base_llm, verifier_ensemble) NEVER UPDATE.
        2. Build 3-task continual-learning benchmark:
             - Task A: 30 GSM8K-style arithmetic word problems.
             - Task B: 30 BBH-style logical-deduction problems.
             - Task C: 30 MATH-subset competition problems.
             - Same 90 examples for both FR-11 baseline AND fast-slow
               variant.
        3. Run both pipelines on the 3-task sequence (A → B → C). For
           each task, log: verification-pass-rate, iters-to-pass per
           example, base_llm KL divergence from initial.
        4. After full sequence: re-run task A. Measure plasticity =
           (passrate_A_after_C) - (passrate_A_initial). Same for FR-11.
        5. Acceptance: sample efficiency (iters-to-pass on task B) for
           Fast-Slow >= 2x FR-11 AND KL drift (post-sequence) <= 0.5x
           FR-11 AND |plasticity_fastslow - plasticity_fr11| <= 0.05.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.fast_slow_variant.v1"
        - experiment: 1761
        - run_date: ISO-8601 UTC
        - duration_s: > 300s (90 examples × ~150ms inference × ~10 iters
          per pipeline × 2 pipelines + KL eval; realistic floor)
        - random_seed: 172461 (NOT 1761 or 90)
        - reproducibility_checksum: sha256 of (corpus hash +
          base_llm git_rev + verifier_ensemble fingerprint)
        - preconditions_checked: list
        - model_specs: {target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          slow_weights: ["base_llm", "k=16_verifier_ensemble"],
          fast_weights: "verifier_output_summary_context",
          baseline: "fr11_verifier_as_reward",
          tasks: ["gsm8k_30", "bbh_30", "math_30"],
          continual_switch_order: "A_B_C_then_A"}
        - n_samples: 90 (30 per task × 3 tasks)
        - n_samples_justification: "30 examples per task gives Wilson 95%
          CI width ~0.30 on pass rate, matching the paper's evaluation
          granularity. Continual-switch test needs >=3 tasks to detect
          stall vs progress."
        - fast_slow_passrate_per_task: dict task -> {passrate, wilson_95_ci}
        - fr11_passrate_per_task: dict task -> {passrate, wilson_95_ci}
        - sample_efficiency_ratio: float (fast_slow_iters / fr11_iters
          on task B)
        - kl_drift_fast_slow: float (vs base LLM)
        - kl_drift_fr11: float
        - kl_drift_ratio: float (fast_slow / fr11)
        - plasticity_fast_slow: float (passrate_A_after_C - passrate_A_initial)
        - plasticity_fr11: float
        - catastrophic_forgetting_fast_slow: bool (plasticity < -0.05)
        - catastrophic_forgetting_fr11: bool
        - acceptance_gate_passed: bool (sample_efficiency_ratio >= 2.0
          AND kl_drift_ratio <= 0.5 AND NOT catastrophic_forgetting_fast_slow)
        - acceptance_gate_criteria: "Sample-eff >= 2x baseline AND KL drift
          <= 0.5x baseline AND no catastrophic forgetting."
        - methodology_note: "If sample_efficiency_ratio > 5x with no
          methodology_note, treat as IMPLAUSIBLE_PERFECT — paper's
          headline is 3x; lift > 5x on Carnot's setup without explanation
          is a fabrication signal."
        - optimization_direction: "maximize_sample_efficiency_minimize_kl_drift"
        - honest_verdict: MUST start with `complete:` / `complete_` /
          `success:` / `success_` / `passed:` / `passed_` / `shipped:` /
          `shipped_` per CLAUDE.md Verdict Terminal-Prefix Discipline.

      Run command. Do NOT push to git. Do NOT modify
      scripts/research_conductor.py.

  - id: exp1762-phase1-pypi-retry-with-blocked-honest-pattern
    title: "Exp 1762: Phase 1 PyPI retry (blocked since .175; HF parallel attempt in .183 exp1750)"
    deliverable: results/experiment_1762_pypi_retry.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1711-pypi-publish
        verdict: blocked_pypi_credentials_unavailable
        addressed_by: "exp1711 (.175) emitted honest blocked_credentials verdict — this is the exemplary pattern. This task retries with the same preconditions block per CLAUDE.md."
        retire_if_same_verdict: false
      - experiment_id: exp1704-phase1-pypi-publish-with-preconditions
        verdict: stranded_skip_wipeout_in_173
        addressed_by: "exp1704 (.173) stranded. exp1711 (.175) emitted honest blocked. This is the next attempt with the same discipline."
        retire_if_same_verdict: false
      - experiment_id: exp1685-pypi-publish-actual
        verdict: blocked_gate_check_failed
        addressed_by: "exp1685 (.170) blocked. Full chain: exp2103 -> exp1683 -> exp1685 -> exp1704 -> exp1711 -> exp1762. retire_if_same_verdict cleared each time the credentials state could potentially have changed."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: Phase 1 ship-track PyPI prong. Last attempt (exp1711 .175)
      emitted honest blocked_pypi_credentials_unavailable. If credentials
      have been provisioned since, this task ships; if still missing,
      another honest blocked verdict is the correct outcome (NOT a
      fabrication).

      FALSIFIABLE HYPOTHESIS: Either PyPI/TestPyPI credentials are
      available (success path: real upload + external pip install
      verification), OR they remain absent (failure path: honest blocked
      verdict matching exp1711 pattern). Fabrication is not a valid
      outcome.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1711_pypi_publish.json (the exemplary
          blocked-credentials pattern)
        - pyproject.toml (name="carnot-ebm" per CLAUDE.md memory)
        - scripts/publish_huggingface.py if present (HF parallel pattern)

      TASK: PyPI upload OR honest blocked verdict.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `pyproject.toml` has `name = "carnot-ebm"` — else
              `blocked_pypi_name_misconfigured`.
           b. `python -m build --version` succeeds — else
              `blocked_pypi_build_toolchain_missing`.
           c. `twine --version` succeeds — else
              `blocked_pypi_twine_missing`.
           d. PyPI credentials via env TWINE_PASSWORD OR keyring OR
              ~/.pypirc — else `blocked_pypi_credentials_unavailable`.
              Try TestPyPI credentials similarly.
           Record preconditions_checked.
        1. `python -m build` → dist/*.whl + dist/*.tar.gz.
        2. Compute SHA-256 of both artifacts.
        3. `twine check dist/*` — fix README rendering issues if any.
        4. `twine upload dist/*` (or --repository-url for TestPyPI).
        5. Fresh subprocess: `pip install carnot-ebm --target /tmp/x` +
           `python -c "import sys; sys.path.insert(0, '/tmp/x'); import
           carnot; print(carnot.__version__)"`.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.pypi_publish.v3"
        - experiment: 1762
        - run_date: ISO-8601 UTC
        - duration_s: > 30s if real upload; smaller if blocked is fine
        - random_seed: 172462
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {package_name: "carnot-ebm", version: str,
          publish_target: "pypi" | "testpypi" | "blocked",
          wheel_filename: str, sdist_filename: str,
          wheel_sha256: str, sdist_sha256: str}
        - n_samples: 1
        - n_samples_justification: "Ship task; n=1 publication artifact."
        - pypi_url: str or null
        - external_install_verified: bool
        - acceptance_gate_passed: bool (pypi_url non-null AND
          external_install_verified) OR honest blocked verdict
        - acceptance_gate_criteria: "Real upload + verify install OR
          honest blocked verdict."
        - methodology_note: "Per exp1711 precedent, blocked_credentials
          is a valid honest verdict — NOT a fabrication."
        - optimization_direction: "neither — ship task"
        - honest_verdict: MUST start with terminal prefix OR
          `blocked_<resource>`.

      Run command. Do NOT push to git. Do NOT modify
      scripts/research_conductor.py.

