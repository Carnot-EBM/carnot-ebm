- id: exp1104-failure-ledger-v2-issues-1-5-manifest
  milestone: 2026.04.86
  deliverable: results/experiment_1104_failure_ledger_v2_id_keyword_manifest.json
  title: "Failure-Ledger v2 (Issues 1+5+manifest) — experiment_id counting, keyword tightening, dispatch-time manifest enforcement"
  model: opus
  max_turns: 45
  estimated_wall_time_min: 40
  priority: critical
  requires_gpu: false
  prompt: |
    CONTEXT:
    Three conductor regressions caused task retirements in .84 and .85 that did not reflect
    legitimately-doomed research. This experiment fixes all three in a single surgery pass.
    EXCEPTION: This IS a conductor infrastructure experiment. You ARE permitted to modify
    scripts/research_conductor.py.

    ISSUE 1 — Title-prefix failure-count inheritance (HIGH PRIORITY):
    `pick_next_task()` calls `_count_failures_for_task(task)` which scans ops/conductor-log.md
    for entries whose title-prefix matches the current task. A .86 task with the same TITLE
    as a retired .84 task inherits .84's failure count, causing premature retirement before the
    prior_failures discipline check fires. Root: exp1096 SemEnergy and exp1097 N-Queens both
    retired in .85 from inherited .84 counts. Fix: count failures by experiment_id (from the
    artifact path in the log entry), NOT title prefix. Fall back to title-prefix only for legacy
    log entries written before this schema change.

    ISSUE 5 — Coarse keyword matcher triggers false doomed-rerun detection (HIGH PRIORITY):
    `FailureLedger.is_doomed_rerun()` (or equivalent) currently requires only 1 keyword overlap
    to flag a task as matching a prior failure. Root: exp1106 Phase 1a is blocked by 18 false-
    positive matches on the single keyword "adversarial" OR "verifier" alone. Fix: require ≥2
    scope-vocabulary keywords from the task title to match a prior failure title. Use exact word
    set intersection: |words(task_title) ∩ words(prior_title)| >= 2.

    MANIFEST ENFORCEMENT — Dispatch-time exclusion check missing (MEDIUM PRIORITY):
    ops/exclusion_manifest.yaml has exp906 listed as retired since milestone .80 (Preflight v30).
    exp906 has appeared as the slowest experiment for 3 CONSECUTIVE milestones (.83, .84, .85)
    despite this retirement. Root: the conductor checks the manifest at planning/validation time
    but NOT at dispatch time for experiments already indexed in research-complete.yaml's re-scan
    loop. Fix: add manifest check at dispatch time in `pick_next_task()` (or equivalent dispatch
    function): if task.id is in exclusion_manifest, skip it regardless of research-complete index.

    EXISTING CODE TO READ FIRST:
    - scripts/research_conductor.py (read fully — find _count_failures_for_task, is_doomed_rerun
      or equivalent, pick_next_task, dispatch logic)
    - ops/exclusion_manifest.yaml (confirm exp906 entry exists)
    - ops/conductor-log.md (read first 50 lines to understand log entry schema)
    - openspec/change-proposals/failure-ledger-v2-and-planner-discipline.md (full proposal)

    TASK:
    1. Find the exact function names in research_conductor.py for:
       - failure counting (by title-prefix currently)
       - doomed-rerun detection (keyword matching)
       - dispatch/task selection
       - exclusion manifest checking
    2. Implement Issue 1 fix: modify failure counting to use experiment_id when available
       in the log entry. The log entry format should be extended to include `id: <exp_id>` so
       future entries are parseable by ID. Add backward-compatible parsing.
    3. Implement Issue 5 fix: change keyword matching threshold from 1 → 2 keywords.
       Use word tokenization (split on whitespace, lowercase, strip punctuation).
    4. Implement manifest enforcement: add dispatch-time exclusion check. Any task whose
       ID or deliverable path matches an exclusion manifest entry must be skipped at dispatch
       with log entry: "SKIP: exclusion_manifest retirement [id] applied at dispatch".
    5. Write tests (at minimum 4):
       tests/python/test_failure_ledger_v2.py:
       - test_count_by_id_not_title_prefix
       - test_keyword_matcher_requires_two_keywords
       - test_manifest_dispatch_time_enforcement_skips_retired
       - test_legacy_log_entries_still_counted_by_prefix_fallback

    PLANNER SELF-AUDIT (P1 from known-issues.md):
    Read research-roadmap-next.yaml (this file). For each task in the .86 roadmap:
    Check whether its title shares ≥2 scope-vocabulary keywords with any entry in
    research-complete.yaml. For any task that does, verify prior_failures is declared.
    Report: n_tasks_checked, n_tasks_needing_prior_failures, n_tasks_with_prior_failures_declared.

    PLANNER COHERENCE CHECK (P2 from known-issues.md):
    Scan research-roadmap-next.yaml for any task where model: opus AND agent_type: codex
    (or any cross-vendor model/agent mismatch). Report any violations.

    CONCRETE STEPS:
    - grep -n "_count_failures\|is_doomed_rerun\|pick_next_task\|exclusion_manifest" scripts/research_conductor.py
    - (read relevant functions)
    - (implement Issue 1: id-based counting)
    - (implement Issue 5: 2-keyword threshold)
    - (implement manifest dispatch-time enforcement)
    - JAX_PLATFORMS=cpu pytest tests/python/test_failure_ledger_v2.py -v
    - (planner self-audit of research-roadmap-next.yaml)
    - Write results/experiment_1104_failure_ledger_v2_id_keyword_manifest.json

    REQUIRED ARTIFACT FIELDS:
    - failure_ledger_id_fix_deployed: bool (True if Issue 1 implemented and tested)
    - failure_ledger_keyword_threshold_deployed: bool (True if Issue 5 implemented)
    - manifest_dispatch_enforcement_deployed: bool (True if manifest check added)
    - tests_written: int
    - tests_passing: int
    - planner_audit_n_tasks_checked: int
    - planner_audit_n_needing_prior_failures: int
    - planner_audit_n_with_declarations: int
    - planner_audit_cross_vendor_violations: list[str] (should be empty)
    - honest_verdict: "all_three_fixes_deployed" | "two_of_three_deployed" | "partial" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1104_failure_ledger_v2_id_keyword_manifest.py
    Do NOT push.

- id: exp1105-failure-ledger-v2-issues-2-3-4
  milestone: 2026.04.86
  deliverable: results/experiment_1105_failure_ledger_v2_cap_mtime_fingerprint.json
  title: "Failure-Ledger v2 (Issues 2+3+4) — cap reset on fix-commit, stable-deliverable mtime, pre-test fingerprint cache"
  model: opus
  max_turns: 40
  estimated_wall_time_min: 35
  priority: high
  requires_gpu: false
  prompt: |
    CONTEXT:
    Three additional conductor bugs from .85 that caused incorrect task retirements and false
    stale-artifact kills. Fix all three in a single surgery pass.
    EXCEPTION: This IS a conductor infrastructure experiment. You ARE permitted to modify
    scripts/research_conductor.py.

    ISSUE 2 — 3-fail cap races operator patches (MEDIUM PRIORITY):
    When a task fails 3 times with 10-min sleeps, the cap fires in ~30 minutes. Operator
    response time (diagnose + patch + commit) is sometimes longer. Exp1092 retired 7 minutes
    before the operator patch landed. Fix: when a commit touches a task's roadmap entry,
    deliverable artifact path, or upstream dependency artifact since the most recent failure,
    reset the failure counter to 0 for that task. Detection: check git log --since=<last_failure_time>
    for commits touching the task's deliverable path or id.

    ISSUE 3 — Stable-deliverable-detection uses 60s unchanged mtime (HIGH PRIORITY):
    The conductor reads an existing artifact and checks whether it's been unchanged for 60s to
    determine if it's the "current" deliverable. Root: exp1090's Opus subagent was killed before
    writing the new artifact because a stale `blocked` artifact from a prior iteration was read
    as "deliverable already exists." Fix: require `artifact.mtime > task.start_time`. Any artifact
    older than the task's start timestamp is stale by definition. Use os.path.getmtime() and compare
    against the recorded task_start timestamp.

    ISSUE 4 — Pre-test fingerprint cache saves START state (LOW PRIORITY):
    The fingerprint cache is computed at the start of the pre-test run. If a commit lands during
    the pre-test, the cache misses on subsequent iterations because the START fingerprint no longer
    matches. Fix: save the END fingerprint (computed after the pre-test run completes, not before
    it starts). This allows cache hits when the pre-test files haven't changed since last run.

    DOC RECONCILIATION BATCHING (from .85 retro recommendations):
    The doc reconciler currently runs inline per-experiment in a 28-minute blocking pass.
    Add a simple batching flag: if CARNOT_BATCH_DOC_RECONCILE=1 (default: 0), defer all
    doc reconcile writes to an end-of-batch queue rather than executing inline. The queue
    flushes when the conductor finishes each experiment batch. This is a low-risk additive
    change — the flag is off by default.

    EXISTING CODE TO READ FIRST:
    - scripts/research_conductor.py (find cap checking, artifact mtime detection, pre-test
      fingerprint, doc reconciliation hooks)
    - openspec/change-proposals/failure-ledger-v2-and-planner-discipline.md (full proposal)

    TASK:
    1. Find the 3-fail cap enforcement code, artifact staleness check, and fingerprint cache
       in research_conductor.py.
    2. Implement Issue 2: git-log-based cap reset. On each task attempt, before incrementing
       the failure counter, check git log for commits since the last failure touching this
       task's deliverable path. If found, reset counter to 0.
    3. Implement Issue 3: mtime>task_start check. Replace the "unchanged for 60s" heuristic
       with `os.path.getmtime(deliverable_path) > task_start_time`.
    4. Implement Issue 4: end-fingerprint cache. Compute fingerprint AFTER pre-test, not BEFORE.
    5. Add CARNOT_BATCH_DOC_RECONCILE flag (no-op if 0, queue-and-flush if 1).
    6. Write tests (at minimum 3):
       tests/python/test_failure_ledger_v2_cap.py:
       - test_cap_resets_when_fix_commit_lands
       - test_stale_artifact_detected_by_mtime
       - test_end_fingerprint_cache_survives_mid_run_commit

    CONCRETE STEPS:
    - grep -n "mtime\|getmtime\|unchanged\|fingerprint\|fail_count\|cap\|doc_reconcile" scripts/research_conductor.py
    - (read relevant sections)
    - (implement fixes)
    - JAX_PLATFORMS=cpu pytest tests/python/test_failure_ledger_v2_cap.py -v
    - Write results/experiment_1105_failure_ledger_v2_cap_mtime_fingerprint.json

    REQUIRED ARTIFACT FIELDS:
    - failure_ledger_cap_reset_deployed: bool
    - stable_deliverable_mtime_fix_deployed: bool
    - end_fingerprint_cache_deployed: bool
    - doc_reconcile_batch_flag_added: bool
    - tests_written: int
    - tests_passing: int
    - honest_verdict: "all_four_fixes_deployed" | "three_of_four_deployed" | "partial" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1105_failure_ledger_v2_cap_mtime_fingerprint.py
    Do NOT push.

