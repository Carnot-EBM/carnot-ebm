    \   m. Build artifact: schema='carnot.live_precision.v8'\n\
    \      inference_mode='live_gpu' or 'gpu_required'\n\
    \      n_questions=100, baseline_accuracy, pipeline_accuracy\n\
    \      signed_improvement, wilson_95ci_lower, wilson_95ci_upper\n\
    \      is_positive=(pipeline_accuracy > baseline_accuracy)\n\
    \      retro_033_closed=(is_positive and inference_mode=='live_gpu')\n\
    \      cot_pairs_written='results/exp527_cot_pairs.json' if written else null\n\
    \      env_autofix_applied=True\n\
    \      honest_verdict='retro_033_closed' if retro_033_closed\n\
    \        else 'live_no_improvement' if inference_mode=='live_gpu'\n\
    \        else 'gpu_required'\n\
    \   n. Call tmpl.assert_deliverable_written() as FINAL LINE\n\
    6. Write tests/python/test_experiment_527_live_100q_v8.py (100% coverage new helpers).\n\
    7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    8. If CARNOT_FORCE_LIVE=1 in env (set by apply_env_autofix), execute the script.\n\
    9. Reconcile: ops/conductor-log.md (RETRO-033 status, miss_count update),\n\
    \  ops/status.md, ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

