          principle: "Boolean gate for exp2251 capstone."
        compute_reduction_pct:
          principle: "Primary ODAR gate: >= 30 validates the routing adds value."
        accuracy_delta:
          principle: "Guards against trading accuracy for speed; must be >= -2pp."
