- id: exp742-retro033-confirmation
  milestone: 2026.04.57
  deliverable: results/experiment_742_retro033_confirmation.json
  title: 'Exp 742: RETRO-033 VR Confirmation 200q Trial — Second Seed (GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-033 (verify-repair never positive on live GPU) was "marginally closed"
    by Exp 720 (.55 cycle) with signed_improvement_200q=0.00510 (0.51pp) on Qwen3.5-0.8B
    using seed 218. The .56 retro explicitly flagged this as "confirmation_trial_needed:
    true" — one positive result at 0.51pp is within statistical noise for 200 questions.
    A second 200q trial with a different random seed (999) either:
    (A) positive → RETRO-033 definitively closed, pipeline credibility established
    (B) negative → RETRO-033 re-opened, need new hypothesis about why Exp 720 was positive

    If negative: do NOT despair. Report honestly and investigate: was Exp 720 a fluke?
    Is the improvement domain-specific? Does Qwen3.5-0.8B improvement hold at 200q
    but not consistently across seeds?

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_720_vr_200q_qwen.py — the Exp 720 script; reuse same pipeline.
    - results/experiment_720_vr_200q_qwen.json — baseline: signed_improvement=0.00510,
      seed=218, model=Qwen/Qwen3.5-0.8B, n_questions=200.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.
    - python/carnot/pipeline/extract.py — ConstraintExtractor.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Run 200q GSM8K verify-repair with Qwen3.5-0.8B, random seed 999.
    Compare to Exp 720 baseline. Definitively close or reopen RETRO-033.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-150 (RETRO-033 closure MUST be confirmed with >= 2 independent
       200q trials with different random seeds showing signed_improvement > 0),
       SCENARIO-VERIFY-200 to openspec/capabilities/verification/spec.md.
    3. Create scripts/experiment_742_retro033_confirmation.py:
       a. ExperimentTemplate(742, requires_gpu=True) +
          ExperimentTimeoutWatchdog(742, timeout_minutes=90).
       b. Load GSM8K questions, shuffle with seed=999 (explicitly NOT seed=218).
       c. Run 200 questions through VerifyRepairPipeline with Qwen3.5-0.8B:
          - baseline_accuracy: pipeline disabled (raw model output)
          - verify_only_accuracy: pipeline with verification, no repair
          - verify_repair_accuracy: full verify-repair
          - signed_improvement = verify_repair_accuracy - baseline_accuracy
       d. Compare:
          - seed_999_signed_improvement vs seed_218_signed_improvement (0.00510)
          - Are both positive? Is the seed-999 improvement >= 0.005?
       e. honest_verdict:
          - "retro033_confirmed_closed" if signed_improvement > 0 AND > 0.003
            (conservative threshold: above measurement noise for 200q)
          - "retro033_marginal_inconclusive" if 0 < signed_improvement <= 0.003
            (positive but below noise floor — need larger trial)
          - "retro033_reopened" if signed_improvement <= 0
            (Exp 720 was likely statistical fluke — investigate)
       f. artifact: seed, n_questions, baseline_accuracy, verify_repair_accuracy,
          signed_improvement, seed_218_signed_improvement (from Exp 720),
          retro033_status, honest_verdict.
    4. Write tests/python/test_experiment_742_retro033_confirmation.py with 100% coverage:
       - test signed_improvement computed correctly from accuracy pair.
       - test seed=999 produces different question order from seed=218.
       - test honest_verdict maps correctly to signed_improvement thresholds.
       Each test traces to REQ-VERIFY-150.
    5. Reconcile:
       - ops/status.md: update RETRO-033 status based on honest_verdict.
         If confirmed_closed: "RETRO-033 DEFINITIVELY CLOSED — 2 independent 200q trials
         positive (Exps 720+742)." If reopened: "RETRO-033 REOPENED — seed 999 negative,
         Exp 720 may have been statistical. New hypothesis needed."
       - ops/changelog.md: one-line with honest_verdict.
    6. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0. Run setup_gpu([{"name": "Qwen3.5-0.8B",
    "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0}]) before inference.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp743-privacy-filter-v2-no-teacher
  milestone: 2026.04.57
  deliverable: results/experiment_743_privacy_filter_v2.json
  title: 'Exp 743: Privacy Filter KAN v2 — No Teacher Dependency (PII Feature Engineering)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Privacy filter Exps 729+730 were blocked for 2 consecutive cycles because the
    openai/privacy-filter teacher model was not downloadable (upstream dependency). Two
    consecutive blocked cycles meets the governance redesign threshold. This experiment
    redesigns the privacy filter WITHOUT a teacher model, using direct feature engineering
    instead:
    - PII regex features: credit card patterns (Luhn-valid), SSN patterns, email addresses,
      phone numbers, IP addresses, US mailing addresses
    - Token-level statistics: digit density, alpha/digit ratio, character entropy
    - N-gram features: bigram counts for PII-adjacent token pairs
    KAN is trained DIRECTLY on these features with contrastive loss (benign=low energy,
    PII=high energy). No teacher inference required. No HuggingFace model download needed.

    The gate for v2 is LOWER than the failed v1 gate (which required AUROC >= 0.90 AND
    teacher invariant). For v2 (no teacher): AUROC >= 0.80 AND per-dataset min_tp >= 1.
    If v2 achieves this gate, it is publication-ready. If it achieves AUROC >= 0.85,
    it supersedes the failed v1 target.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/kan_classifier.py (or equivalent) — KAN classifier from Exp 724.
    - python/carnot/invariants.py — invariant system (read to understand what checks fire).
    - results/experiment_729_privacy_filter_kan_true_distillation.json — v1 blocked reason.
    - results/experiment_730_privacy_filter_kan_cross_dataset.json — v1 cross-dataset result.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Build privacy filter KAN v2 using PII regex + token features (no teacher).
    Train on public data. Evaluate AUROC. Gate: AUROC >= 0.80 AND min_tp >= 1 per dataset.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-SAFE-019 (PrivacyFilterV2 MUST be trained without any teacher model;
       features MUST be purely regex PII patterns and token statistics),
       REQ-SAFE-020 (PrivacyFilterV2 gate: AUROC >= 0.80 AND per-dataset min_tp >= 1),
       SCENARIO-SAFE-019/020 to openspec/capabilities/safety/spec.md.
    3. Implement python/carnot/models/privacy_filter_kan_v2.py:
       a. PrivacyFilterFeatureExtractor:
          - pii_patterns: compile regexes for CC (Luhn), SSN (XXX-XX-XXXX), email,
            phone (US), IP (IPv4), zip code
          - extract(text: str) -> np.ndarray of shape (n_features,):
            For each pattern: match_count, max_match_length, fraction_matched_chars.
            Token stats: digit_density, alpha_digit_ratio, char_entropy, token_count.
            N-gram: bigram_pii_adj_count (bigrams where one token is PII-like).
       b. PrivacyFilterKANv2(KANClassifier or new):
          - 2-layer KAN, 32 units, degree-3 splines, input_dim = len(features)
          - contrastive loss: energy(benign) < energy(pii)
    4. Build corpus (no teacher needed):
       a. Benign: 1000 samples from GSM8K + HumanEval + clean Wikipedia sentences.
       b. PII: 1000 synthetic samples:
          - 200 credit card numbers (Luhn-valid, generated with luhn algorithm)
          - 200 SSN patterns (XXX-XX-XXXX format, fictional)
          - 200 email addresses (user@domain.tld format)
          - 200 phone numbers (US format)
          - 200 mailing addresses (fictional but realistic format)
       c. No Pile-of-Law download needed (avoids data dependency).
    5. Train KAN v2:
       a. 80/20 split, contrastive loss, 100 epochs, Adam lr=1e-3.
       b. Evaluate AUROC on held-out 20%.
    6. Cross-dataset evaluation:
       a. Dataset 1: Held-out synthetic PII (200 samples, novel Luhn cards + SSNs).
       b. Dataset 2: Mixed benign + PII GSM8K-style word problems with embedded PII.
       c. Dataset 3: Code snippets with PII (email addresses, API keys as SSN-like strings).
       d. For each: compute AUROC, confusion at threshold=0.5, min_tp.
    7. Gate check:
       - PASS: AUROC >= 0.80 AND min_tp >= 1 across all 3 datasets.
       - Write results/privacy_filter_v2_gate.json.
    8. Save weights to python/carnot/models/privacy_filter_kan_v2.json.
    9. Create scripts/experiment_743_privacy_filter_v2.py:
       a. ExperimentTemplate(743) + ExperimentTimeoutWatchdog(743, timeout_minutes=60).
       b. Implement steps 3-7.
       c. honest_verdict:
          - "privacy_filter_v2_gate_passed" if AUROC >= 0.80 AND min_tp >= 1
          - "privacy_filter_v2_gate_passed_high" if AUROC >= 0.85 AND min_tp >= 1
          - "privacy_filter_v2_auroc_fail" if AUROC < 0.80
          - "privacy_filter_v2_minfp_fail" if AUROC >= 0.80 but min_tp == 0 on any dataset
       d. artifact: auroc, per_dataset_auroc (list), per_dataset_min_tp (list),
          gate_passed (bool), weights_saved (bool), honest_verdict.
    10. Write tests/python/test_experiment_743_privacy_filter_v2.py with 100% coverage:
        - test PrivacyFilterFeatureExtractor extracts correct feature count.
        - test Luhn credit card pattern matches valid CC, rejects invalid.
        - test SSN pattern matches XXX-XX-XXXX, rejects other formats.
        - test AUROC and min_tp computed correctly from predictions.
        Each test traces to REQ-SAFE-019/020.
    11. Reconcile:
        - ops/status.md: add "Privacy filter v2 (no teacher): AUROC=X, gate=pass/fail."
          Mark Exps 729+730 upstream dependency as RETIRED (redesign succeeded/failed).
        - ops/changelog.md: one-line with honest_verdict.
    12. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp744-iterative-2round-code-repair
  milestone: 2026.04.57
  deliverable: results/experiment_744_iterative_2round_repair.json
  title: 'Exp 744: Iterative 2-Round Code Repair — HumanEval (arXiv 2604.10508, GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2604.10508 "How Many Tries Does It Take? Iterative Self-Repair in LLM
    Code Generation Across Model Scales and Benchmarks" (April 2026) shows:
    - Self-repair universally improves pass rates by +4.9 to +17.1pp on HumanEval
    - Most gains concentrate in the FIRST TWO ROUNDS (round 1 >> round 2 >> round 3+)
    - Even small models benefit significantly from 2-round repair
    - Assertion errors are hardest to repair (~45%); syntax and name errors easiest

    Carnot's code verification uses execution-based checking (CodeExtractor + runtime
    instrumentation), NOT regex extraction. This means the code path avoids the extraction
    problem that blocks VR on math tasks. The current pipeline is single-round.
    Implementing 2-round repair should yield measurable improvement on HumanEval.

    The repair prompt matters: the error message from execution failure is the key signal.
    Include the full traceback, the failed test case inputs, and the expected vs actual
    outputs in the repair prompt.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; find code repair path.
    - python/carnot/pipeline/extract.py — CodeExtractor; understand code extraction logic.
    - results/experiment_680_humaneval_code_verification.json (or latest HumanEval result)
      — baseline pass@1 for Qwen3.5-0.8B on HumanEval.
    - scripts/experiment_template.py — ExperimentTemplate with BatchedInferenceRunner.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement TwoRoundCodeRepairPipeline. Benchmark on HumanEval with Qwen3.5-0.8B.
    Measure pass@1 per round. Target: >= +2pp improvement vs single-round baseline.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-CODE-031 (TwoRoundCodeRepairPipeline MUST execute generated code, capture
       full traceback on failure, inject traceback + expected output into repair prompt,
       and re-generate for up to 2 repair rounds),
       REQ-CODE-032 (pass@1 improvement after 2 rounds MUST be reported per round:
       pass_round0, pass_round1, pass_round2),
       SCENARIO-CODE-029/030 to openspec/capabilities/verification/spec.md.
    3. Implement python/carnot/pipeline/two_round_repair.py:
       a. Class TwoRoundCodeRepairPipeline:
          - generate(problem: str, llm_caller) -> str: initial generation
          - execute(code: str, test_cases: list) -> ExecutionResult:
            run code with test cases, capture stdout/stderr/traceback
          - build_repair_prompt(original_problem, failed_code, traceback,
            expected_output, actual_output) -> str:
            Include: problem statement, failed code, full traceback, expected vs actual.
            Instruction: "The code above has a bug. Fix it."
          - repair(failed_code, repair_prompt, llm_caller) -> str: repair generation
          - run(problem, test_cases, llm_caller) -> TwoRoundResult:
            round0_pass (bool), round1_pass (bool), round2_pass (bool),
            round0_code, round1_code, round2_code, error_types (list)
