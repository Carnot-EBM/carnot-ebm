  - id: exp5935-non-pruning-atomic-constraint-support
    milestone: "2026.07.527"
    title: "Non-pruning atomic ConstraintIR support and exact-completion fixture"
    priority: critical
    track: constraint-extraction
    deliverable: results/experiment_5935_non_pruning_atomic_constraint_support.json
    agent_type: codex
    model: gpt-5.5
