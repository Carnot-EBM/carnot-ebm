- id: exp413-env-autofix-gpu-confirmed
  milestone: 2026.06.24
  deliverable: results/experiment_413_env_autofix.json
  title: 'Exp 413: EnvironmentAutoFix — self-configuring CARNOT_FORCE_LIVE + GPU preflight v3 (RETRO-022 final workaround)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-022 has blocked live GPU experiments\
    \ for SEVEN consecutive milestones. Root cause (Exp 404): CARNOT_FORCE_LIVE=1 is set in the\
    \ human shell but does NOT propagate into the Claude subprocess spawned by the conductor. The\
    \ conductor calls subprocess.run() without explicitly passing env vars. We CANNOT modify\
    \ research_conductor.py.\n\nThe workaround: implement EnvironmentAutoFix, a module that each\
    \ experiment script calls at startup. It detects GPU hardware (torch.cuda.is_available()), and\
    \ if GPU is present AND CARNOT_FORCE_LIVE is absent from os.environ, it sets\
    \ os.environ['CARNOT_FORCE_LIVE'] = '1' and logs a warning. This makes every GPU experiment\
    \ self-configuring — the env gate works without conductor propagation.\n\nThis is a CPU-only\
    \ experiment. It always completes and produces a result JSON.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/deliverable_validator.py — DeliverableContentValidator (Exp 404)\n\
    - python/carnot/pipeline/gpu_preflight.py — GPUPreflightResult, run_gpu_preflight (Exp 390)\n\
    - python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate (Exp 377)\n\
    - python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu() (Exp 352)\n\
    - scripts/session_startup.sh — GPU env setup\n\
    - scripts/experiment_template.py — ExperimentTemplate patterns\n\
    - results/experiment_404_preflight_v2.json — prior preflight result\n\
    \nTASK: Implement EnvironmentAutoFix and re-run GPU preflight.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-INFRA-021 (EnvironmentAutoFix self-injects CARNOT_FORCE_LIVE=1 when GPU hardware\
    \ is detected and the var is absent), REQ-INFRA-022 (auto-fix logs a warning when applied so\
    \ the human knows propagation is still broken), SCENARIO-INFRA-025/026/027 to\
    \ openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write tests FIRST (100% coverage required) for ALL of the following:\n\
    \   - EnvironmentAutoFix dataclass with fields:\n\
    \     gpu_detected: bool\n\
    \     carnot_force_live_was_set: bool (True if already in os.environ before fix)\n\
    \     auto_fix_applied: bool (True if fix was needed and applied)\n\
    \     final_env_value: str | None (os.environ.get('CARNOT_FORCE_LIVE') after fix)\n\
    \   - apply_env_autofix() -> EnvironmentAutoFix:\n\
    \     1. Check os.environ.get('CARNOT_FORCE_LIVE') — record carnot_force_live_was_set\n\
    \     2. Try to import torch; call torch.cuda.is_available() — record gpu_detected\n\
    \        If import fails: gpu_detected=False\n\
    \     3. If gpu_detected AND NOT carnot_force_live_was_set:\n\
    \        Set os.environ['CARNOT_FORCE_LIVE'] = '1'\n\
    \        Set auto_fix_applied=True\n\
    \        Log: WARNING: EnvironmentAutoFix applied CARNOT_FORCE_LIVE=1 (env propagation broken)\n\
    \     4. Else: auto_fix_applied=False\n\
    \     5. Return EnvironmentAutoFix instance\n\
    \   - build_env_autofix_artifact(result: EnvironmentAutoFix, preflight_result: dict) -> dict:\n\
    \     schema='carnot.env_autofix.v1'\n\
    \     honest_verdict: str — one of:\n\
    \       'gpu_confirmed_live' — gpu_detected AND CARNOT_FORCE_LIVE now '1' (either set or auto-fixed)\n\
    \       'gpu_detected_env_was_correct' — gpu_detected AND carnot_force_live_was_set (no fix needed)\n\
    \       'gpu_not_detected' — gpu_detected=False (hardware absent or driver issue)\n\
    \       'auto_fix_applied' — auto_fix_applied=True (workaround used)\n\
    \     retro_022_resolved: bool — True when honest_verdict in ['gpu_confirmed_live', 'gpu_detected_env_was_correct', 'auto_fix_applied']\n\
    \   - Test: no GPU → auto_fix_applied=False, honest_verdict='gpu_not_detected'\n\
    \   - Test: CARNOT_FORCE_LIVE already set + GPU present → gpu_detected_env_was_correct\n\
    \   - Test: GPU present + CARNOT_FORCE_LIVE absent → auto_fix_applied=True\n\
    4. Implement python/carnot/pipeline/env_autofix.py with all above.\n\
    \   Export EnvironmentAutoFix, apply_env_autofix, build_env_autofix_artifact from carnot.pipeline.__init__.\n\
    5. Write scripts/experiment_413_env_autofix.py using ExperimentTemplate(413):\n\
    \   a. Call apply_env_autofix() BEFORE ExperimentTemplate() or any GPU check\n\
    \   b. ExperimentTemplate(413, 'EnvironmentAutoFix + GPU preflight v3', 'results/experiment_413_env_autofix.json')\n\
    \   c. tmpl.setup()\n\
    \   d. Re-run gpu_preflight.run_gpu_preflight(project_root) to get updated verdict\n\
    \   e. Build artifact: schema='carnot.env_autofix.v1'\n\
    \      Include env_autofix result + gpu_preflight result\n\
    \      honest_verdict: use build_env_autofix_artifact logic\n\
    \      retro_022_resolved, auto_fix_applied, n_corrupt_files_remaining\n\
    \   f. If honest_verdict != 'gpu_confirmed_live' and != 'auto_fix_applied':\n\
    \      Print ACTION REQUIRED with cloud GPU options (see Exp 404 for Lambda/vast.ai/RunPod commands)\n\
    \   g. Output: results/experiment_413_env_autofix.json\n\
    6. Write tests/python/test_experiment_413_env_autofix.py (100% coverage).\n\
    7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    8. Reconcile: update ops/conductor-log.md with RETRO-022 status.\n\
    \   If retro_022_resolved=True: mark RETRO-022 CLOSED in ops/status.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp414-cikan-energy-final
  milestone: 2026.06.24
  deliverable: python/carnot/models/cikan_energy.py
  title: 'Exp 414: CIKANEnergy — constraint-informed KAN with hard boundary priors (RETRO-023 carry, purge + re-implement)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: python/carnot/models/cikan_energy.py\
    \ contains corrupt JSON data — NOT valid Python. This has persisted for FOUR consecutive\
    \ milestones (Exps 375, 391, 405, force-skipped). This experiment MUST call\
    \ DeliverableContentValidator.validate_and_clear() at the top before any implementation.\n\
    \narXiv 2412.03710 (CIKAN): Constraint-Informed KAN. Instead of learning arbitrary spline shapes,\
    \ CIKAN seeds each spline edge with known constraint boundaries. Regions that violate constraints\
    \ have infinite (or very large) energy because the spline knots are placed at boundary_value;\
    \ crossing them incurs a squared-distance penalty. arXiv 2602.07518 (Physical Analog KAN): each\
    \ ConstraintBoundary maps to one RNPU saturation voltage (~250 pJ/inference, ~600 ns latency).\
    \ This is Carnot's Phase 2 hardware path.\n\
    \nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/deliverable_validator.py — DeliverableContentValidator (Exp 404)\n\
    - python/carnot/models/kan.py — KANEnergy, KANSpline, KANLayer\n\
    - python/carnot/verify/energy.py — ConstraintTerm protocol, ComposedEnergy\n\
    - python/carnot/models/__init__.py — model exports\n\
    - tests/python/test_kan.py — KAN test patterns\n\
    \nTASK: Re-implement CIKANEnergy with content validator guard.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call DeliverableContentValidator().validate_and_clear('{project_root}/python/carnot/models/cikan_energy.py')\
    \ at the TOP of the script before any code generation.\n\
    3. Add REQ-ENERGY-010 (CIKANEnergy embeds constraint boundaries in spline activations),\n\
    \   REQ-ENERGY-011 (boundary_penalty guarantees energy >= 0),\n\
    \   REQ-ENERGY-012 (RNPU hardware mapping documented in docstring),\n\
    \   SCENARIO-ENERGY-015/016/017 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - ConstraintBoundary(variable_idx: int, boundary_value: float, boundary_type: Literal['lower_bound','upper_bound','equality'])\n\
    \   - seed_spline_from_constraint(spline: KANSpline, boundary: ConstraintBoundary) -> KANSpline\n\
    \   - CIKANEnergy(n_vars: int, n_hidden: int, constraint_boundaries: list[ConstraintBoundary])\n\
    \   - CIKANEnergy.energy(x: jnp.ndarray) -> float — always >= 0\n\
    \   - CIKANEnergy._boundary_penalty(x: jnp.ndarray) -> float\n\
    \   - CIKANEnergy.from_constraints(constraints: list[ConstraintTerm]) -> CIKANEnergy\n\
    \   - CIKANEnergy.energy_separation_ratio(satisfying, violating) -> float\n\
    \   - CIKANEnergy.save(path) / CIKANEnergy.load(path) via safetensors\n\
    \   - Test: 1000 random configs always produce energy >= 0\n\
    \   - Test: energy on violating configs > energy on satisfying configs\n\
    5. Implement python/carnot/models/cikan_energy.py (complete, valid Python):\n\
    \   Verbose docstrings explaining WHY constraint boundaries in splines prevent violations\n\
    \   structurally, WHY each ConstraintBoundary maps to one RNPU saturation voltage (arXiv\n\
    \   2602.07518), WHY energy is guaranteed non-negative (penalty is squared distance).\n\
    6. Export CIKANEnergy, ConstraintBoundary from carnot.models.__init__.\n\
    7. Write scripts/experiment_414_cikan_energy.py using ExperimentTemplate(414):\n\
    \   a. Call validate_and_clear at top\n\
    \   b. Create arithmetic constraint: x0 + x1 = x2 (carry-check)\n\
    \   c. Instantiate CIKANEnergy.from_constraints([constraint])\n\
    \   d. Sample 100 satisfying + 100 violating configs\n\
    \   e. Compute energy_separation_ratio\n\
    \   f. Build artifact: schema='carnot.cikan_energy.v1',\n\
    \      honest_verdict ('structural_prevention' when ratio>5.0; 'partial_separation'\n\
    \      when 1.0<ratio<=5.0; 'no_separation' when <=1.0)\n\
    \   g. Output: results/experiment_414_cikan_energy.json\n\
    8. Write tests/python/test_cikan_energy.py (100% coverage).\n\
    9. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    10. Reconcile: update ops/conductor-log.md (RETRO-023 item: cikan_energy CLOSED),\n\
    \   ops/changelog.md, ops/status.md, _bmad/architecture.md (add CIKANEnergy to Model Tiers table).\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp415-jitrl-constraint-memory
  milestone: 2026.06.24
  deliverable: python/carnot/pipeline/jitrl_memory.py
  title: 'Exp 415: JitRL constraint memory — threshold modulation without gradient updates (RETRO-023 carry, purge + re-implement)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: python/carnot/pipeline/jitrl_memory.py\
    \ contains corrupt JSON data (not Python). Carried forward from Exp 386 (interrupted), Exp 406\
    \ (force-skipped). Call DeliverableContentValidator.validate_and_clear() at top.\n\
    \narXiv 2601.18510 (JitRL): Just-In-Time Reinforcement Learning — continual learning WITHOUT\
    \ gradient updates. Maintains a dynamic non-parametric memory of (state, action, advantage)\
    \ triples. At inference: retrieve k similar triples, use advantages to modulate output policy\
    \ via KL-constrained logit adjustment. Provably equivalent to KL-constrained policy optimization.\
    \ WHY this is correct Tier 1: Exp 134 proved constraint REWEIGHTING failed. JitRL's fix:\
    \ modulate the ENERGY THRESHOLD at inference time based on historical (question_type,\
    \ constraint_type, outcome) triples. When carry_check has 8/10 false positives on rate problems,\
    \ raise its threshold for rate problems — not its weight globally.\n\
    \nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/deliverable_validator.py — DeliverableContentValidator (Exp 404)\n\
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (wire JitRL as optional param)\n\
    - python/carnot/pipeline/case_memory.py — CaseMemory patterns (Exp 136)\n\
    - python/carnot/training/adaptive_weights.py — PerModelFPTracker (the FAILED approach from Exp 132/134)\n\
    - python/carnot/pipeline/constraint_template_library.py — ConstraintTemplateLibrary (Exp 343)\n\
    \nTASK: Implement JitRL-style constraint memory.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call validate_and_clear('{project_root}/python/carnot/pipeline/jitrl_memory.py') at TOP.\n\
    3. Add REQ-LEARN-028 (JitRL modulates energy threshold without gradient updates),\n\
    \   REQ-LEARN-029 (modulation is KL-constrained optimal — proven in arXiv 2601.18510),\n\
    \   SCENARIO-LEARN-051/052/053 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - ConstraintTriple(question_type: str, constraint_type: str, energy_value: float,\n\
    \     repair_outcome: Literal['fixed','not_fixed','false_positive'],\n\
    \     question_embedding: list[float] | None = None)\n\
    \   - JitRLConstraintMemory(k: int = 5, kl_budget: float = 0.1, max_size: int = 1000)\n\
    \   - JitRLConstraintMemory.record(triple: ConstraintTriple) -> None\n\
    \   - JitRLConstraintMemory.retrieve(question: str, constraint_type: str, k: int) -> list[ConstraintTriple]\n\
    \   - JitRLConstraintMemory.compute_threshold_adjustment(triples: list[ConstraintTriple]) -> float:\n\
    \     delta = kl_budget * mean([1 if t.repair_outcome=='false_positive' else -1 for t in triples])\n\
    \   - JitRLConstraintMemory.get_adjusted_threshold(base_threshold: float, question: str,\n\
    \     constraint_type: str) -> float\n\
    \   - JitRLConstraintMemory.save(path: str) / load(path: str): JSON serialization\n\
    \   - Test: rate problem history (8/10 FP) -> positive threshold adjustment (>0)\n\
    \   - Test: arithmetic problem history (9/10 fixed) -> negative adjustment (<0)\n\
    \   - Wire as optional jitrl_memory param in VerifyRepairPipeline (additive, no breaking changes)\n\
    5. Implement python/carnot/pipeline/jitrl_memory.py.\n\
    \   Verbose docstrings: WHY JitRL works (non-parametric retrieval), WHY threshold modulation\n\
    \   beats weight reweighting (Exp 134 failure post-mortem), hardware path (CPU k-NN O(log n)).\n\
    6. Export JitRLConstraintMemory, ConstraintTriple from carnot.pipeline.__init__.\n\
    7. Write scripts/experiment_415_jitrl_memory.py using ExperimentTemplate(415):\n\
    \   a. Call validate_and_clear at top\n\
    \   b. Record 50 synthetic triples: 25 false_positive (carry_check on rate problems),\n\
    \      25 fixed (carry_check on arithmetic)\n\
    \   c. Query 'rate problem' carry_check → expect positive threshold adjustment\n\
    \   d. Query 'arithmetic problem' carry_check → expect negative/neutral\n\
    \   e. Run 100 simulated verify-repair with/without JitRL; measure fp_reduction_pct\n\
    \   f. Build artifact: schema='carnot.jitrl_memory.v1',\n\
    \      threshold_modulation_works (True when rate_adjustment > arith_adjustment),\n\
    \      simulated_fp_reduction_pct\n\
    \   g. Output: results/experiment_415_jitrl_memory.json\n\
    8. Write tests/python/test_jitrl_memory.py (100% coverage).\n\
    9. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    10. Reconcile: update ops/conductor-log.md (RETRO-023: jitrl_memory CLOSED),\n\
    \   ops/changelog.md, ops/status.md, _bmad/architecture.md (JitRL as Tier 1 self-learning).\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

