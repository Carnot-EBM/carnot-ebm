- id: exp405-cikan-energy-final-attempt
  milestone: 2026.06.17
  deliverable: python/carnot/models/cikan_energy.py
  title: 'Exp 405: CIKANEnergy — third and final attempt with content validator guard (RETRO-023)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-023 — python/carnot/models/cikan_energy.py\
    \ contains JSON artifact data (not Python) for the THIRD consecutive milestone. The root\
    \ cause is fixed in Exp 404 (DeliverableContentValidator). This experiment MUST call\
    \ validate_and_clear() at the top to delete the corrupt file before implementing.\n\n\
    arXiv 2412.03710 (CIKAN): Extends KAN with hard constraint priors baked into spline activations.\
    \ Instead of learning arbitrary spline shapes, CIKAN seeds each edge's spline with known\
    \ constraint boundaries — regions that violate constraints have infinite (or very large) energy.\
    \ arXiv 2602.07518 (Physical Analog KAN): each ConstraintBoundary maps to one RNPU saturation\
    \ voltage (~250 pJ/inference, ~600 ns latency). This is the Phase 2 hardware path.\n\n\
    EXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/deliverable_validator.py — DeliverableContentValidator\
    \ (Exp 404 — READ THIS FIRST)\n- python/carnot/models/kan.py — KANEnergy, KANSpline, KANLayer\n\
    - python/carnot/verify/energy.py — ConstraintTerm protocol, ComposedEnergy\n- python/carnot/models/__init__.py\
    \ — model exports\n- tests/python/test_kan.py — KAN test patterns\n\nTASK: Re-implement\
    \ CIKANEnergy with content validator guard.\n1. Read CLAUDE.md spec-first workflow.\n2. Call\
    \ DeliverableContentValidator().validate_and_clear('{project_root}/python/carnot/models/cikan_energy.py')\
    \ at the TOP of the script — before any code generation. If it returns False (corrupt file\
    \ deleted), log that RETRO-023 corrupt file was cleared.\n3. Add REQ-ENERGY-010 (CIKAN energy\
    \ tier), REQ-ENERGY-011 (constraint boundaries), REQ-ENERGY-012 (non-negative energy),\n\
    \   SCENARIO-ENERGY-015/016/017 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - ConstraintBoundary(variable_idx, boundary_value,\
    \ boundary_type: Literal['lower_bound','upper_bound','equality'])\n   - seed_spline_from_constraint(spline:\
    \ KANSpline, boundary: ConstraintBoundary) -> KANSpline:\n     places a knot at boundary_value;\
    \ crossing boundary increases energy (penalty = crossing_amount^2 * 1e6)\n   - CIKANEnergy(n_vars:\
    \ int, n_hidden: int, constraint_boundaries: list[ConstraintBoundary])\n   - CIKANEnergy.energy(x:\
    \ jnp.ndarray) -> float: always >= 0\n   - CIKANEnergy._boundary_penalty(x) -> float\n\
    \   - CIKANEnergy.from_constraints(constraints: list[ConstraintTerm]) -> CIKANEnergy\n\
    \   - CIKANEnergy.energy_separation_ratio(satisfying, violating) -> float\n   - CIKANEnergy.save(path)\
    \ / CIKANEnergy.load(path) via safetensors\n   - Test: 1000 random configs always produce\
    \ energy >= 0\n   - Test: energy on violating configs > energy on satisfying configs\n5.\
    \ Implement python/carnot/models/cikan_energy.py (complete file, valid Python):\n   Verbose\
    \ docstrings explaining WHY constraint boundaries in splines prevent violations structurally,\n\
    \   WHY each ConstraintBoundary maps to one RNPU saturation voltage (arXiv 2602.07518),\n\
    \   WHY energy is guaranteed non-negative (penalty is squared distance).\n6. Export CIKANEnergy,\
    \ ConstraintBoundary from carnot.models.__init__.\n7. Write scripts/experiment_405_cikan_energy.py\
    \ using ExperimentTemplate(405):\n   a. Call validate_and_clear at top (delete corrupt file\
    \ if present)\n   b. Create arithmetic constraint: x0 + x1 = x2 (carry-check)\n   c. Instantiate\
    \ CIKANEnergy.from_constraints([constraint])\n   d. Sample 100 satisfying + 100 violating\
    \ configs\n   e. Compute energy_separation_ratio and cikan_vs_kan_ratio\n   f. Build artifact:\
    \ schema='carnot.cikan_energy.v1', honest_verdict ('structural_prevention' when ratio>5.0;\
    \ 'partial_separation' when 1.0<ratio<=5.0; 'no_separation' when <=1.0)\n   g. Output:\
    \ results/experiment_405_cikan_energy.json\n8. Write tests/python/test_cikan_energy.py (100%\
    \ coverage).\n9. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n10. Reconcile:\
    \ update ops/conductor-log.md (RETRO-023 CLOSED), ops/changelog.md, ops/status.md,\n    _bmad/architecture.md\
    \ (add CIKANEnergy row to Model Tiers table).\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp406-jitrl-constraint-memory
  milestone: 2026.06.17
  deliverable: python/carnot/pipeline/jitrl_memory.py
  title: 'Exp 406: JitRL constraint memory — correct Tier 1 self-learning algorithm (purge corrupt file)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: python/carnot/pipeline/jitrl_memory.py\
    \ currently contains JSON data (not Python). This is a corruption artifact from Exp 386,\
    \ which was interrupted before implementing the real module. This experiment MUST call\
    \ DeliverableContentValidator.validate_and_clear() at the top to delete the corrupt file.\n\n\
    arXiv 2601.18510 (JitRL): Just-In-Time Reinforcement Learning — continual learning WITHOUT\
    \ gradient updates. Maintains a dynamic non-parametric memory of (state, action, advantage)\
    \ triples. At inference time, retrieves k most similar triples and uses their advantages to\
    \ modulate the output policy via KL-constrained logit adjustment. Provably equivalent to\
    \ KL-constrained policy optimization in closed form.\n\nWHY THIS IS THE CORRECT TIER 1 ALGORITHM:\
    \ Exp 134 proved that precision-based constraint REWEIGHTING doesn't improve accuracy. JitRL\
    \ reveals the fix: instead of reweighting constraint weights, maintain a memory of\
    \ (question_type, constraint_type, outcome) triples and MODULATE THE ENERGY THRESHOLD at\
    \ inference time. When Carnot has seen that 'rate problems' trigger carry_check incorrectly\
    \ 8/10 times, raise the energy threshold for carry_check on rate-type questions. This is\
    \ threshold modulation — not constraint reweighting.\n\nEXISTING CODE TO READ FIRST:\n-\
    \ python/carnot/pipeline/deliverable_validator.py — DeliverableContentValidator (Exp 404)\n\
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (wire JitRL as optional param)\n\
    - python/carnot/pipeline/case_memory.py — CaseMemory patterns (Exp 136)\n- python/carnot/training/adaptive_weights.py\
    \ — PerModelFPTracker (the failed approach Exp 132/134)\n- python/carnot/pipeline/constraint_template_library.py\
    \ — ConstraintTemplateLibrary (Exp 343)\n\nTASK: Implement JitRL-style constraint memory.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Call validate_and_clear('{project_root}/python/carnot/pipeline/jitrl_memory.py')\
    \ at TOP.\n3. Add REQ-LEARN-028 (JitRL memory modulates threshold without gradient updates),\n\
    \   REQ-LEARN-029 (modulation is KL-constrained optimal),\n   SCENARIO-LEARN-051/052/053\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n4. Write tests FIRST (100% coverage)\
    \ for:\n   - ConstraintTriple(question_type, constraint_type, energy_value, repair_outcome:\
    \ Literal['fixed','not_fixed','false_positive'], question_embedding: list[float]|None=None)\n\
    \   - JitRLConstraintMemory(k=5, kl_budget=0.1, max_size=1000)\n   - JitRLConstraintMemory.record(triple)\n\
    \   - JitRLConstraintMemory.retrieve(question, constraint_type, k) -> list[ConstraintTriple]\n\
    \   - JitRLConstraintMemory.compute_threshold_adjustment(triples) -> float:\n     delta =\
    \ kl_budget * mean([1 if t.repair_outcome=='false_positive' else -1 for t in triples])\n\
    \   - JitRLConstraintMemory.get_adjusted_threshold(base_threshold, question, constraint_type)\
    \ -> float\n   - JitRLConstraintMemory.save(path) / load(path): JSON serialization\n   -\
    \ Test: rate problem history -> positive threshold adjustment\n   - Test: arithmetic problem\
    \ history -> negative/neutral adjustment\n   - Wire into VerifyRepairPipeline as optional\
    \ jitrl_memory param (additive, no breaking changes)\n5. Implement python/carnot/pipeline/jitrl_memory.py.\n\
    \   Verbose docstrings explaining WHY JitRL works, WHY threshold modulation is the correct\
    \ Tier 1 algorithm, hardware path (CPU k-NN, O(log n)).\n6. Export JitRLConstraintMemory,\
    \ ConstraintTriple from carnot.pipeline.__init__.\n7. Write scripts/experiment_406_jitrl_memory.py\
    \ using ExperimentTemplate(406):\n   a. Call validate_and_clear at top\n   b. Record 50\
    \ synthetic triples: 25 false_positive (carry_check on rate problems),\n      25 fixed (carry_check\
    \ on arithmetic)\n   c. Query 'rate problem' carry_check -> expect positive threshold adjustment\n\
    \   d. Query 'arithmetic problem' carry_check -> expect negative/neutral\n   e. Run 100\
    \ simulated verify-repair with/without JitRL; measure fp_reduction_pct\n   f. Build artifact:\
    \ schema='carnot.jitrl_memory.v1', threshold_modulation_works\n      (True when rate_adjustment\
    \ > arith_adjustment), simulated_fp_reduction_pct\n   g. Output: results/experiment_406_jitrl_memory.json\n\
    8. Write tests/python/test_jitrl_memory.py (100% coverage).\n9. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n10. Reconcile: update ops/conductor-log.md, ops/changelog.md, ops/status.md,\n\
    \    _bmad/architecture.md (JitRL as Tier 1 self-learning component).\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp407-safety-kan-classifier
