    - prior_failures_scan_n_tasks: int
    - prior_failures_scan_n_with_declarations: int
    - prior_failures_scan_missing: list[str] (task IDs missing declarations, ideally empty)
    - honest_verdict: "library_complete_tests_pass" | "library_complete_tests_partial" | "library_stub_only" | "failed"

