    3. Require milestone 2026.09.619 and the ordered IDs exp7063-exp7075.
       Require exact title, deliverable, and structured gate parity.
    4. Require every gate producer to occur earlier and to name an exact bare
       top-level field in its producer's REQUIRED ARTIFACT FIELDS.
    5. Require all four prior_failures fields, per_unit_rows on comparisons,
