    TASK:
    Implement spaces/wopr-games/games/nqueens.py following the WOPRGame interface.

    N-Queens Ising encoding (N=8, 64 spins):
    - Spin s_(ij) ∈ {{0,1}} at row i, col j (queen placed / not placed)
    - Row constraint: Σ_j s_(ij) = 1 for each row i → J[i*8+j, i*8+k] = -penalty for j≠k
    - Column constraint: Σ_i s_(ij) = 1 for each col j → J[i*8+j, k*8+j] = -penalty for i≠k
    - Diagonal constraint: s_(ij) + s_(kl) ≤ 1 if |i-k|=|j-l| → J[i*8+j, k*8+l] = -penalty
    - Energy E = -Σ s_(ij) * s_(kl) * J[ij,kl] (ground state E=0 ↔ valid placement)

    WOPR display:
