    \ trajectories — early layers (surface syntax), middle layers (semantic integration),\
    \ late layers (generation decision) — which is exactly the richer feature set\
    \ RETRO-049 needs. Features to add: (a) per-token softmax entropy over vocabulary,\
    \ (b) top-k probability concentration (ratio top-1/top-5 probability mass),\
    \ (c) cross-layer attention head variance. Retrain NUP Probe v3 on real CoT\
    \ pairs from Exps 502-503. Target: AUC > 0.700 for Tier 0c promotion.\n\nEXISTING CODE TO READ FIRST:\n\
