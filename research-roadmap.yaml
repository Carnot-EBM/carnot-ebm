    1. Emit a flushed progress line at every phase boundary and before and after every model load, generation, benchmark and subprocess. Print actual completed/pending counts inside long loops. While a child runs, emit a heartbeat at least every 60 seconds. Keep every output gap below 600 seconds. Use unbuffered output, bounded child deadlines and process-group cleanup. Write any file over about 200 lines in several tool calls of at most about 150 lines each. Send a progress message between those calls. No single huge file-writing or benchmark call. Do not pad runtime.
    2. Extend the relevant REQ-* and SCENARIO-* before implementation. Write focused failing tests first, including the real CLI and failure paths. Reuse qualified helpers and keep all original assertions. Keep scratch outside the repository root and fixture artifacts outside results/. Follow the V710 design methods and claim limits; no generator weight changes, activation or external publication.
    3. Map arXiv:2510.25458 Appendix A and arXiv:2504.15206 to the bounded correction specified in the V710 design. Record theorem assumptions that do not transfer. Inspect fit/tune residuals only; evaluation and retention targets cannot select the method. Write openspec/change-proposals/v710-utility-patch-protocol.json with hashes of inputs, roles and exact numerical rules.
    4. Freeze five probability intervals [0,.1), [.1,.25), [.25,.5), [.5,.75), [.75,1]. Use the frozen baseline probability as interval membership. Add the global group and each interval intersected with the baseline reject action: at most eleven groups. Drop duplicate membership vectors using public fit identities only. Never add identity, label-derived or evaluation-selected features.
    5. Freeze a patch as p_new=clip(p_old+delta*group,1e-6,1-1e-6), delta=clip(.5*mean(y-p_old),-.05,.05). Select the group with largest absolute residual over all training rows, counting nonmembers as zero; require eight distinct group members. Tie-break by fixed group order. Limit four patches per candidate. Stop at residual<=.01. Serialize probabilities as E_good=-log(1-p), E_bad=-log(p). This is a bounded empirical adaptation; energy/logistic equivalence supplies no extra claim.
    6. Freeze static arms: original energy and simple heads, global-only correction on each, group correction on each, local-only ablation, and label-blind random-group control. Match labels, base-fit features, four-step budget and acceptance permissions. Select the strongest simple/global comparator by tune cost, then Brier, then fixed name. Keep 128 reserved slots and original missing masks. Costs are accept=5*y, reject=1-y, escalate=.5. Accept permission remains a subset of the original V707 baseline accepts; ties and missing evidence escalate.
    7. Freeze H1 and H2 as the only benefit hypotheses, each one-sided alpha=.025 with 10000 source/block bootstrap draws and at least9500 valid draws. Keep the support, retention, safety and .02 improvement margins from the design. Report utility residuals descriptively on a fixed finite witness class. No adaptive threshold search or new distribution-free safety claim on exposed data.
    8. Run applicable E2E-015/019 from ops/e2e-test-plan.md. Freeze exact owned validation commands before measurement. Run relevant unit and affected-consumer tests, measured 100% changed-code coverage including real child/CLI statements, scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Run the task-specific E2E checks in private scratch. Bound separate repository-health diagnostics and preserve existing failures; do not claim global green. Keep command argv, expected/actual exits, full stdout/stderr hashes and measured clocks. Failed owned checks mean disqualified and readiness zero.
