       - "marginal_improvement" if auc_v2 in (0.6144, 0.65)
       - "retired" if auc_v2 <= 0.6144 (same verdict, retire per discipline rule)
       - "below_v1" if auc_v2 < 0.6144 (regression — check implementation)
    7. Build artifact with: auc_v2, delta_auc_from_v1 (v2 - v1), top_features,
