        honest_verdict:
          principle: "Terminal-prefixed. A hardened Pareto win (beats well-prompted judges at lower cost), a parity-at-lower-cost, a 'a stronger judge closes the accuracy gap', and an honest blocked_window_exceeded are ALL COMPLETE -- the §5 efficiency axis is decision-grade either way."
        efficiency_pareto_holds:
          principle: "BARE bool: the capstone reads this (gated-fields-must-be-bare); true iff the energy verifier matches/beats the BEST-prompted judge (within/above CI) at <=0.1x cost -- the skeptic-proof §5 efficiency headline, the operator's stated win condition."
        accuracy_energy_verifier:
          principle: "BARE float: the learned energy verifier's selection accuracy on held-out families -- the cheap forward-pass arm (compare to the .396 0.654)."
        accuracy_best_judge:
          principle: "BARE float: the BEST of the WELL-prompted judges -- if a stronger prompt lifts the judge well above the .396 0.212, the weak-prompt confound was real and the win is now honest at the corrected number."
        accuracy_delta_ci95:
          principle: "Bootstrap CI95 of (energy - best judge) accuracy -- 'parity' means this CI includes 0 / is not significantly negative; a positive lower bound is a Pareto win even against a strong judge."
        cost_ratio:
          principle: "BARE float: energy-verifier cost / best-judge cost (wall-clock + FLOPs-proxy + $/1k) -- the efficiency multiplier; target <=0.1 (10x cheaper), ideally <=0.01 (100x)."
        iso_flops_curve:
          principle: "Accuracy-vs-total-FLOPs for the verifier and the judge (Budget-aware Discriminative Verification 2510.14913) -- the honest head-to-head metric (a fair iso-compute comparison, not '1 verifier call vs 1 judge call')."
        verifier_is_oracle:
          principle: "BARE bool=false -- the energy verifier on cross-family selection is oracle-distinct (NOT the executable oracle); keeps the efficiency measurement non-circular (unlike the retired code-efficiency)."
        preconditions_checked:
          principle: "Records the judge GGUF caches + candidate load + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the selection + bootstrap."
        reproducibility_checksum:
          principle: "Hash of the candidates + the selectors' outputs + the cost accounting; lets a third party re-run."
        model_specs:
          principle: "The judge GGUF ids + the stronger prompt + the energy verifier + the cost-accounting method; required methodology."
      ACCEPTANCE GATE:
        - condition: "efficiency_pareto_holds + accuracy_energy_verifier + accuracy_best_judge + accuracy_delta_ci95 + cost_ratio + iso_flops_curve reported with preconditions_checked AND verifier_is_oracle=false, OR an honest blocked_judge_models_not_cached / blocked_window_exceeded verdict"
          principle: "Hardening the .396 efficiency win against the weak-prompt confound on an iso-FLOPs curve converts a clean result into the skeptic-proof §5 headline (the operator's stated win condition); even a stronger judge reaching parity (not Pareto) is decision-grade at the corrected number."

