- id: exp571-hallufield-tier0e
  milestone: 2026.04.43
  deliverable: results/experiment_571_hallufield_tier0e.json
  title: 'Exp 571: HalluField Tier 0e — Thermodynamic Energy-Path Hallucination Detection
    (arXiv 2509.10753)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: New research\
    \ (arXiv 2509.10753, September 2025) — HalluField models LLM responses as token-path\
    \ ensembles, assigns energy and entropy to each path from output logits using field-theoretic\
    \ principles, and flags hallucinations via thermodynamic instability (high partition\
    \ function variance). No fine-tuning required — operates on logits directly. The\
    \ verification cascade already has Tiers 0a-0d. HalluField is a natural Tier 0e:\
    \ logit-level thermodynamic signal orthogonal to SinkProbe (attention geometry)\
    \ and NUP Probe (entropy-based). CPU-only — works on logits from prior responses.\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/spilled_energy.py —\
    \ SpilledEnergyDetector (Tier 0b pattern to follow)\n- python/carnot/pipeline/verify_repair.py\
    \ — VerifyRepairPipeline (how Tier 0 signals are wired)\n- _bmad/architecture.md\
    \ — verification cascade table (add Tier 0e row)\n- results/fover_corpus_v2.json\
    \ — 132-pair corpus (use for AUC benchmarking)\n\nTASK: Implement HalluField Tier\
    \ 0e and benchmark vs existing Tier 0 signals.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-VERIFY-113 (HalluField Tier 0e: thermodynamic partition function variance\
    \ as hallucination signal), SCENARIO-VERIFY-129/130/131 to verifiable-reasoning/spec.md.\n\
    3. Create python/carnot/pipeline/hallufield_detector.py:\n   a. HalluFieldResult\
    \ dataclass: partition_variance (float), mean_energy (float), is_unstable (bool),\
    \ token_path_count (int), detector_mode (str).\n   b. HalluFieldDetector class:\n\
    \      - __init__(self, n_paths=32, temperature=1.0, instability_threshold=0.5)\n\
    \      - _compute_token_path_energies(logits: jnp.ndarray) -> jnp.ndarray:\n \
    \         * logits shape: (seq_len, vocab_size) or (vocab_size,) for single token.\n\
    \         * Energy of each token: E_i = -log(softmax(logits)[i]) (negative log-probability).\n\
    \         * Sample n_paths token paths (multinomial sampling from logit distribution).\n\
    \         * Path energy = mean token energy along path.\n      - _compute_partition_variance(path_energies:\
    \ jnp.ndarray) -> float:\n         * Z = sum(exp(-beta * E_k) for k in paths)\
    \ (partition function).\n         * Var(E) = E[E^2] - E[E]^2 over sampled paths.\n\
    \         * High variance = thermodynamic instability = hallucination risk.\n \
    \     - score(response_logits: jnp.ndarray | None) -> HalluFieldResult:\n    \
    \     * CI-safe: if logits is None, return HalluFieldResult(is_unstable=False,\
    \ detector_mode='ci_stub').\n         * Compute partition variance, return result.\n\
    \   c. Export HalluFieldDetector, HalluFieldResult from carnot.pipeline.__init__.\n\
