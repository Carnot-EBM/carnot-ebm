  milestone: 2026.09.617
  deliverable: results/experiment_7041_v617_identity_attack_audit.json
  gated_on:
    - upstream: exp7040-typed-model-identity-report-bridge
      artifact_field: arc_typed_identity_bridge_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp7032-repaired-belief-shadow-live-trace
      verdict: "blocked_belief_shadow_live_trace:live_trace_execution"
      addressed_by: "Exp7041 independently attacks the new typed raw/resolved contract in a fresh process before the live trace can reuse it."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7040 changes a security-sensitive evidence boundary after two fixture
    suites missed the live alias shape. The new bridge needs an independent
    report-channel attack audit. The audit follows arXiv:2609.03147: feasibility
    projection is not enough when the constraint inputs can be misreported.
    It also follows arXiv:2609.03153 by preserving typed evidence and unknown.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_7039_v617_model_report_forensics.json
    - {project_root}/results/experiment_7040_v617_typed_identity_bridge.json
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/python/carnot/agentic/arc_belief_shadow_live_trace.py
    - {project_root}/tests/python/test_arc_model_identity_bridge_20260905.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and run a fresh-process mutation audit of the typed ARC identity
    bridge. Generate fixtures independently from Exp7040. Confirm all valid
    raw-report forms pass and one-factor report-channel attacks fail closed
    with exact reasons.

    CONCRETE STEPS:
    0. PRECONDITIONS: require a readable valid Exp7040 artifact with
       arc_typed_identity_bridge_ready_score=1, unchanged source hashes,
       importable shared production code, and writable temporary/artifact
       paths. On failure write a terminal blocked artifact. An upstream block
       is blocked, not partial, and names the check in gate_check_summary.
    1. Add REQ-ARC-7041 and RED tests first. Use a private temporary directory,
       minimal environment, and isolated Python process. Do not import
       Exp7040's fixture constructors or expected rows.
    2. Create positive rows for raw snapshot alias, canonical blob, and direct
       regular GGUF reports. Require serialized round-trip validation and one
       supported row for every required obligation.
    3. Mutate one factor per attack row: relative raw path, wrong alias target,
       broken alias, same-size wrong bytes, changed hash, wrong hub, wrong
       revision, changed launch `-m`, conflicting `/props` fields, stale file,
       directory, hard link, and unreadable target.
    4. Require every attack to yield contradicted or unknown with the expected
       exact rejection reason. No attack may receive a positive receipt.
    5. Recompute Exp7040's artifact and cited source hashes. Prove the canonical
       evaluator, reusable-server path, and belief consumer import the audited
       shared functions rather than local copies.
    6. Set arc_identity_report_attack_audit_ready_score=1 only when all
       positive rows pass, all attack rows fail closed, all source hashes
       agree, all required unknowns block, and consumer reachability passes.
    7. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, ARC floor lint, spec coverage, and root-clutter
       checks.
    8. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (aggregation_from_upstream_artifacts); duration_s;
       source_artifact_hashes; cited_upstream_artifacts; upstream_gate_rows;
       rows; positive_identity_rows; report_channel_attack_rows;
       alias_attack_rows; hash_attack_rows; hub_revision_attack_rows;
       conflict_attack_rows; unknown_evidence_rows; exact_rejection_rows;
       fresh_process_rows; source_drift_rows; consumer_reachability_rows;
       arc_identity_report_attack_audit_ready_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7041_v617_identity_attack_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

