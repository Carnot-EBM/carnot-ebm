         For each: compute individual AUROC on FoVer eval split (20% holdout, random_seed=42).
         Use TF-IDF cosine similarity between (question+response) vs corpus mean as proxy score.
         Sort by individual AUROC.
         Record: components_by_auroc (list of {{name, auroc}}).

