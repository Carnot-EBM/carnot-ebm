- id: exp687-hallusat-sparse-ae
  milestone: 2026.04.52
  deliverable: results/experiment_687_hallusat_sparse_ae.json
  title: 'Exp 687: HalluSAE Sparse Auto-Encoder Feature Attribution — Mechanistic Explanation for VR Win (arXiv 2604.16430)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2604.16430 (HalluSAE) shows that sparse auto-encoders trained on LLM
    hidden states identify monosemantic features causally linked to hallucinations. This
    provides mechanistic interpretability: instead of "energy is high", we can say "Feature
    47 (off-by-one arithmetic patterns) activated, causing the violation."

    Applied to Carnot's VR win (Exp 668): why did structured-equation forcing + repair
    improve accuracy from 36% to 100% on 25 questions? HalluSAE would reveal which latent
    features were causal — e.g., "the model activates an 'arithmetic uncertainty' feature
    when it produces carry errors, and the structured forcing prompt suppresses this feature."

    This is also relevant to JEPA training: instead of training on raw hidden states,
    train on sparse AE feature vectors (low-dimensional, causally meaningful).

    EXISTING CODE TO READ FIRST:
    - results/fover_labeled_steps_live.json — 57 live (step, label) pairs with hidden states
      if stored; otherwise use text-level representations.
    - python/carnot/models/jepa_predictor.py — JEPAPredictor input encoding (to understand
      what features JEPA currently uses).
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Train sparse auto-encoder on FOVER pairs, identify top-10 hallucination features.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-160 (HalluSAE: sparse AE identifies >= 10 distinct hallucination features
       from FOVER corpus), REQ-VERIFY-161 (top-10 features have feature_auroc >= 0.60),
       SCENARIO-VERIFY-212/213 to spec.md.
    3. Create python/carnot/models/hallusal_sparse_ae.py:
       a. SparseAutoEncoder(JAX nn.Module):
          __init__(self, input_dim, hidden_dim=512, sparsity_weight=0.01):
            self.encoder = nn.Dense(hidden_dim)
            self.decoder = nn.Dense(input_dim)
          __call__(self, x):
            h = nn.relu(self.encoder(x))
            h_sparse = h * (h == jnp.max(h, axis=-1, keepdims=True))  # top-k sparse
            x_recon = self.decoder(h_sparse)
            return x_recon, h_sparse
          loss = reconstruction_loss + sparsity_weight * L1(h_sparse)
       b. extract_text_features(text: str) -> jnp.ndarray:
          Simple bag-of-features: compute_hash_features(text, dim=128).
          Extract: digit_count, operator_count, equals_count, carry_pattern_count,
          compute_line_count (COMPUTE: occurrences), step_length.
          Return jnp.array([...], dtype=jnp.float32).
       c. identify_hallucination_features(ae: SparseAutoEncoder, pairs, dim=512) -> list:
          For each feature dimension: compute AUC of that feature vs hallucination label.
          Return top-10 by AUC, with: feature_idx, feature_auroc, feature_name (manual guess).
    4. Create scripts/experiment_687_hallusat_sparse_ae.py:
       a. ExperimentTimeoutWatchdog(687, timeout_minutes=20).
       b. Load FOVER pairs from results/fover_labeled_steps_live.json.
       c. Extract text features for each pair.
       d. Train SparseAutoEncoder: 200 epochs, Adam 1e-3.
       e. identify_hallucination_features() on test set.
       f. Check COMPUTE: correlation: does compute_line_count feature score in top-10?
          This validates the Exp 668 VR win mechanism.
       g. honest_verdict:
          - "hallusat_features_found" if top-10 features identified with max_auroc >= 0.60
          - "hallusat_compute_line_causal" if compute_line_count in top-10
          - "hallusat_below_threshold" if max_auroc < 0.60
    5. Write tests/python/test_hallusal_sparse_ae.py with 100% module coverage.
    6. Reconcile ops/changelog.md.
    7. tmpl.assert_deliverable_written() as final line.

