        retire_if_same_verdict: false
    milestone: "2026.06.331"
    title: "Additivity / 'second pair of eyes' — does ensemble-fused-with-confidence beat confidence alone? (conditional catch-rate + McNemar, on the fair re-measurement)"
    priority: high
    max_turns: 50
    agent_type: gemini
    estimated_wall_time_min: 20
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    gated_on:
