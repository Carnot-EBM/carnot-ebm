      EXISTING CODE TO READ FIRST:
        - scripts/exp_verifier_detector_auroc.py (load_arc_rows + arc_rows_from_entries -- the WORKING ARC label path; reuse it)
        - results/arc3_gap3_stage2_eval_pool.json.gz (entries[].candidates[] -- the candidate source) + results/arc3_gap4_induced_programs.json (programs[] demo_fit + pred_grid -- higher-correctness positives to fold in)
