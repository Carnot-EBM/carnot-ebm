    6. Write hardware/kv260/synth_yosys_ice40_n32.ys:
       read_verilog hardware/kv260/ising_sampler_v2.v
       chparam -set N_SPINS 32 -set MAX_DEGREE 8 ising_sampler_v2
       synth_ice40 -top ising_sampler_v2 -flatten
       stat  (to get LUT count before PNR)
       write_json hardware/kv260/ising_sampler_n32_ice40.json
