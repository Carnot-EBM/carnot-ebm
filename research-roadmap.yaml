       The fix was implemented in .80 but never verified via replay due to recurring pre-test failures.
    2. _evaluate_gate() does not normalize YAML string "True" to Python bool True.
       The fix (_coerce_gate_value()) was implemented in .80 but never verified via replay.

    Both fixes are ALREADY in scripts/research_conductor.py from milestone .80. This experiment
    closes them out: verify the fixes are present, run the 12 existing deliverable-status tests,
    and run replay scenarios.

