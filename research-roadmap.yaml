- id: exp1288-interwhen-dvi-verifier-feedback-replay
  milestone: 2026.04.100
  deliverable: results/experiment_1288_interwhen_dvi_verifier_feedback_replay.json
  title: "InterWhen + DVI Verifier-Feedback Replay - Ungated Self-Learning Requirement"
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  estimated_wall_time_min: 45
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prompt: |
    CONTEXT:
    Every milestone must advance continuous self-learning. This task is deliberately
    ungated: if SOTA certificates exist, use them; otherwise fall back to exp1274/FoVer
    replay and mark headline eligibility honestly. DVI, OnlineSpec, InterWhen, Once-More,
    self-verification training, and clause-prediction work all point to verifier feedback
    as an online learning signal.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - research-program.md
    - results/experiment_1274_online_self_learning_certificate_memory_v3.json
    - results/experiment_1285_triggered_certificate_extraction_v2.json if it exists
    - results/experiment_1286_grad_beaver_nsvif_semantic_routing.json if it exists
    - python/carnot/pipeline/self_learning_replay.py
    - python/carnot/pipeline/self_learning_policy.py
    - results/fover_corpus_v5.json

    TASK:
    Convert verifier accept/reject decisions into an online routing/drafter policy update
    and measure whether replay improves future acceptance and violation outcomes.

    CONCRETE STEPS:
    1. Create the deliverable artifact immediately with status="in_progress".
    2. Load SOTA certificate/routing outputs if available; otherwise load exp1274/FoVer replay data and set source="fover_fallback".
    3. Build chronological replay slices with before/after policy states.
    4. Compare post-hoc replay to an interleaved verifier-feedback pass where decisions update the policy before the next item.
    5. Record dvi_acceptance_delta, online_acceptance_delta, violation_delta, self_learning_delta_overall, self_verify_signal_used, verification_gain, reasoning_trace_length_delta when measurable, clause_prediction_records or claim_level_memory_entries, memory_update_written, headline_result_allowed, and honest_verdict.
    6. Write status="complete" even if deltas are zero or negative.

    Run: python3 -c "import json; d=json.load(open('results/experiment_1288_interwhen_dvi_verifier_feedback_replay.json')); print(d.get('honest_verdict'), d.get('dvi_acceptance_delta'), d.get('memory_update_written'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

