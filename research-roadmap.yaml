    title: "Exp 1996: NSVIF/Z3 SMT Constraint Extractor"
    deliverable: "results/experiment_1996_nsvif_smt_extractor.json"
    agent_type: "codex"
    prompt: |
      CONTEXT: Today is {date}. Workspace is {project_root}. ArithmeticExtractor regex is failing on IT models. We need a formal logic extractor (arxiv 2601.17789).
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/extract.py
      TASK: Implement an NSVIF/Z3 approach to formalize CoT constraints into first-order logic.
      MODEL_SPECS: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, unsloth/gemma-4-26B-A4B-it-GGUF
      CONCRETE STEPS:
      1. Build an extractor that parses chain-of-thought into logical steps.
      2. Integrate Z3 for solving and verifying each step.
      3. Ensure zero false positives by design.
      4. Write the results artifact.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

