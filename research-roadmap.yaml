  - id: exp2690
    milestone: "2026.05.256"
    deliverable: "results/experiment_2690_tier0f_semantic_calibration.json"
    title: "Tier 0f: Semantic Reward Calibration for Tier 0e EORM (arXiv:2605.15588)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: verifier

    prior_failures:
      - experiment_id: exp2676-tier0f-semantic-calibration
        verdict: "zero_execution_no_artifact_produced"
        addressed_by: "exp2676 was a .255 task (zero-execution, no artifact). This .256 attempt is the first actual execution of Tier 0f. If Tier 0e (exp2663) artifact is absent, task blocks cleanly with blocked_tier0e_module_missing rather than fabricating."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Paper arXiv:2605.15588 shows energy-based reward models trained on token-level (correct,
      incorrect) pair objectives have ~40% higher calibration error (ECE) on semantically-equivalent
      paraphrases. The fix: cluster FoVer responses by semantic equivalence (TF-IDF cosine >= 0.9),
      assign shared reward labels within clusters. This reduces false positives on paraphrase pairs.

      Tier 0e (planned in exp2663, .254) used TF-IDF margin-ranking logistic — the setup that
      arXiv:2605.15588 identifies as miscalibrated on paraphrases. If Tier 0e module/artifact
      doesn't exist yet, this task creates both Tier 0e and Tier 0f in one pass.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (check if tier0e_eorm.py exists)
      - results/experiment_2663_tier0e_eorm.json (check if exists — tier0e_auroc, model_path)
      - data/fover_corpus.jsonl (corpus format — {{question, correct, incorrect}} fields)

      TASK: Implement Tier 0f semantic calibration layer. If Tier 0e is absent, create it first.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo "0"` — FoVer corpus check.
            If 0 or missing: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         c. Check tier0e: `ls python/carnot/verify/tier0e_eorm.py 2>/dev/null && echo exists || echo missing`
            Record: tier0e_module_exists (bool).
         d. Check tier0e artifact: `ls results/experiment_2663_tier0e_eorm.json 2>/dev/null && echo exists || echo missing`
            Record: tier0e_artifact_exists (bool).
         Record: preconditions_checked.

      1. If tier0e_module_exists=false: create python/carnot/verify/tier0e_eorm.py with
         EORMVerifier class (TF-IDF margin-ranking logistic, fit on FoVer corpus, save to
         results/tier0e_model.pkl). Train on 80% FoVer, eval on 20%.
         Record: tier0e_created_this_task (bool), tier0e_auroc (float from eval).

      2. Load FoVer corpus. For each (correct, incorrect) pair:
         a. Compute TF-IDF vectors. Find pairs where cosine(correct_i, correct_j) >= 0.9.
         b. Assign to same cluster, give shared label.
         Record: n_paraphrase_clusters (int), n_pairs_in_clusters (int).

      3. Re-split with cluster-aware train/eval split (no cluster leakage). random_seed=42.
         Re-train Tier 0e logistic on cluster-calibrated labels.
         Save calibrated model to results/tier0f_semantic_calibrated_logistic.pkl.

      4. Evaluate Tier 0f on cluster-aware eval split:
         a. AUROC (sklearn roc_auc_score).
         b. ECE (10-bin calibration error).
         c. Paraphrase pair FPR.
         auroc_delta = tier0f_auroc - tier0e_auroc.
         tier0f_viable = tier0f_auroc >= 0.63 AND ece_improvement > 0.
         Record: tier0f_auroc, tier0f_ece, paraphrase_fpr, auroc_delta, tier0f_viable.

      5. Create python/carnot/verify/tier0f_semantic_calibration.py with SemanticCalibratedVerifier.
         Update python/carnot/verify/__init__.py to export it.
         Record: module_created (bool).

      6. Write results/experiment_2690_tier0f_semantic_calibration.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - tier0f_auroc: float
        principle: "Primary performance metric; comparable to tier0e_auroc."
      - tier0f_ece: float
        principle: "Calibration error; arXiv:2605.15588 primary improvement metric."
      - paraphrase_fpr: float
        principle: "Direct measure of the false-positive problem Tier 0f fixes."
      - auroc_delta: float
        principle: "Confirms calibration did not degrade AUROC (acceptable: delta >= -0.05)."
      - tier0f_viable: bool
        principle: "Gate for ensemble v12 inclusion."
      - n_paraphrase_clusters: int
