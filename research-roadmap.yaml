- id: exp460-amd-xdna-iron-npu-unblock
  milestone: 2026.04.34
  deliverable: results/experiment_460_npu_iron.json
  title: 'Exp 460: AMD XDNA IRON NPU Unblock — pip install mlir-aie, no cmake/ninja required'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: The AMD XDNA NPU has been blocked\
    \ for 5 consecutive milestones by a missing prerequisite: the mlir-aie build requires\
    \ ninja and openblas, neither of which are available in the Carnot build environment.\
    \ A new path was discovered: the IRON toolchain (arXiv 2504.03083, AMD) provides a\
    \ pip-installable mlir-aie package that requires ONLY Python and pip — no cmake, ninja,\
    \ or system libraries. Install command: pip install mlir-aie.\n\n\
    If the NPU runs the JEPA predictor ONNX model (results/jepa_predictor_291.onnx) faster\
    \ than CPU, this establishes the hardware path for production self-learning acceleration.\n\n\
    EXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - results/jepa_predictor_291.onnx — JEPA ONNX model (target for NPU execution)\n\
    - python/carnot/hardware/npu_runner.py — NPURunner (if exists)\n\
    - scripts/experiment_template.py — ExperimentTemplate\n\
    - research-references.md — AMD XDNA IRON section (arXiv 2504.03083)\n\n\
    TASK: Attempt mlir-aie pip install and run JEPA ONNX model on NPU.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-HARDWARE-010 (IRON toolchain installs via pip install mlir-aie),\n\
    \   REQ-HARDWARE-011 (NPURunner attempts JEPA ONNX execution on AMD XDNA NPU),\n\
    \   REQ-HARDWARE-012 (NPURunner falls back to CPU ONNX if NPU not available, honest_verdict\n\
    \   distinguishes 'npu_executed' from 'cpu_fallback'),\n\
    \   SCENARIO-HARDWARE-010/011/012 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n\
    \   - NPUEnvironment:\n\
    \     - iron_available() -> bool: try import mlir_aie\n\
    \     - npu_device_present() -> bool: check /dev/accel0 or equivalent\n\
    \     - install_iron() -> bool: subprocess pip install mlir-aie, returns success\n\
    \   - IRONRunner(model_path: str):\n\
    \     - compile_onnx(onnx_path: str) -> bytes: compile to AIE kernel\n\
    \     - run(inputs: dict) -> dict\n\
    \     - benchmark(inputs: dict, n_runs: int = 10) -> float: median ms\n\
    \   - Test: iron_available() returns False in test env (mock absent)\n\
    \   - Test: NPURunner falls back to onnxruntime CPU when NPU unavailable\n\
    5. Implement python/carnot/hardware/iron_runner.py.\n\
    \   Export NPUEnvironment, IRONRunner from carnot.hardware.__init__.\n\
    \   Verbose docstrings: WHY IRON unblocks NPU (pip-only, no ninja/cmake needed),\n\
    \   WHY CPU fallback is required (most devs lack NPU hardware),\n\
    \   reference arXiv 2504.03083 (IRON paper).\n\
    6. Write scripts/experiment_460_npu_iron.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(460, timeout_minutes=30) as context manager\n\
    \   c. ExperimentTemplate(460, 'AMD XDNA IRON NPU Unblock',\n\
    \      'results/experiment_460_npu_iron.json')\n\
    \   d. Attempt pip install mlir-aie via subprocess\n\
    \   e. Check NPUEnvironment.iron_available() and npu_device_present()\n\
    \   f. If JEPA ONNX file does not exist: note it, use a small synthetic ONNX model\n\
    \   g. Attempt IRONRunner.benchmark() — falls back to CPU if NPU absent\n\
    \   h. If CPU fallback: measure CPU ONNX time as baseline for future NPU comparison\n\
    \   i. Build artifact: schema='carnot.npu_iron.v1'\n\
    \      iron_installed=<bool>\n\
    \      npu_present=<bool>\n\
    \      npu_executed=<bool>\n\
    \      npu_ms=<float or null>\n\
    \      cpu_ms=<float> (fallback baseline)\n\
    \      speedup=npu_ms/cpu_ms if npu_executed else null\n\
    \      honest_verdict='npu_executed' or 'cpu_baseline_only' or 'install_failed'\n\
    \   j. Output: results/experiment_460_npu_iron.json\n\
    7. Write tests/python/test_iron_runner.py (100% coverage).\n\
    8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    9. Reconcile: update ops/conductor-log.md (NPU 5-milestone blockage resolved or diagnosed),\n\
    \   ops/status.md, ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

