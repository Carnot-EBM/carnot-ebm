      - {project_root}/results/experiment_6128_phase_d_calibration_pool_v2.json
      - {project_root}/results/experiment_6128_phase_d_calibration_pool_v2.rows.jsonl
      - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
      - {project_root}/scripts/adversarial_verify.py

      TASK:
      Conserve and rederive Exp6128's 720 frozen rows; diagnose family mixture, wrong-option/response modes, option position, permutation/relabel consistency, fallback clusters, saturation, chance-floor failure, and question-level empirical information with uncertainty; freeze a label-blind exact transformation specification or retire this source-domain recovery; and write results/experiment_6140_phase_d_exp6128_option_psychometrics.json without live inference.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash Exp6103/Exp6127/Exp6128 artifacts and raw rows, require exactly 720 unique row identities and 90 question groups, record the dirty worktree and protected-file hashes, and declare `inference_substrate=aggregation_from_upstream_artifacts`.
      1. Ensure REQ-* immutable-row conservation, family-conditional reporting, option-aware response modeling, position/fallback controls, question-grouped uncertainty, transformation-design isolation, no-held-label selection, and retirement requirements exist; add focused failing tests first.
      2. Recompute raw and question-clustered accuracy, oracle@K, tuned SC, headroom, all-wrong, effective K, duplicate entropy, and method-validity by family, nominal stratum, semantic group, answer position, relabel, and shortcut flags. Reconcile every value with the source artifact.
      3. For finite-choice rows, fit calibration-only nominal-response or transparent count-based diagnostics that separate correct-option difficulty, wrong-option identity, positional preference, and fallback concentration. For non-option families, compute response-cluster concentration and transformation consistency. Report uncertainty with question bootstrap or a documented posterior approximation; never treat individual draws as independent questions.
      4. Test whether any exact, label-blind transformation class can move a saturated family down or the below-floor family up without selecting on held outcomes: balanced option permutations, typed-choice normalization, controlled distractors, constraint-composition depth, proof-preserving relabels, and templated paraphrases. This step writes a specification only; it generates no new model rows.
      5. Set `empirical_item_bank_design_ready_score=1.0` only if at least one transformation class has a falsifiable exact construction, nonzero calibration information with uncertainty, zero held dependence, and no retired transport/scorer mechanism. Otherwise set zero and `retirement_triggered=true` for this Exp6128 source-domain recovery.
      6. REQUIRED ARTIFACT FIELDS: status, preconditions_checked, immutable_source_artifact_and_row_hashes, expected_observed_duplicate_and_missing_row_counts, rederived_source_metric_reconciliation, family_stratum_semantic_group_relabel_shortcut_and_position_metrics, wrong_option_identity_position_fallback_and_response_cluster_diagnostics, question_clustered_uncertainty_and_effective_information, saturation_and_below_chance_attribution, candidate_transformation_specification, label_blind_and_held_isolation_receipt, empirical_item_bank_design_ready_score, retirement_triggered, top_level_model_specs_methodology_gap_noted, protected_files_unchanged, duration_s, inference_substrate, verifier_is_oracle, missing_verifier_gaps, field_provenance, test_commands, test_exit_codes, reproducibility_checksum, honest_verdict.
         wrong_option_identity_position_fallback_and_response_cluster_diagnostics principle: binary correctness alone cannot define item difficulty after the measured family mixture.
         candidate_transformation_specification principle: every proposed transformation must preserve an independently checkable exact answer and be frozen before new model responses.
         empirical_item_bank_design_ready_score/retirement_triggered principle: readiness is exactly one only for a non-degenerate split-safe design; a repeated inability to define one retires this source pool.
         verifier_is_oracle principle: set false; the diagnostic reads exact labels for evaluation but does not define or alter them.
         honest_verdict principle: use `complete_ready:`, `complete_null:`, `retired:`, or `blocked:` and state whether the bimodality is distractor/position, saturation, true inability, or unresolved.
      7. Run focused unit/spec coverage, 720-row conservation, exact metric rederivation, grouped uncertainty, option/position controls, transformation isolation, no-live-model, exclusion, schema, adversarial-verify, protected-file, applicable E2E, and root-clutter checks.
