      artifact_field: envguard_fixed
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Milestone .82 produced two related failures:
    1. WOPR cartridges exp1060+exp1061 FAILED x3 each with "model_providers contains reserved"
       when launching the Codex CLI agent.
    2. exp1051 (Parallel Conductor Tier A) was GATE_BLOCK x3, meaning the conductor routing
       that would have dispatched Codex cartridges was never implemented.

    Both must be fixed in this experiment. Note: exp1063 has fixed the EnvGuard crash but
    pre-tests may not be fully green yet — this experiment does NOT depend on exp1064.
    It touches conductor code (routing logic only, not test infrastructure).

    EXISTING CODE TO READ FIRST:
    - openspec/change-proposals/parallel-multi-agent-conductor.md (full spec — read completely)
    - openspec/change-proposals/multi-agent-routing.md (agent_type field spec)
    - scripts/research_conductor.py (find where tasks are dispatched — look for "claude -p" or subprocess.run for agent dispatch)
    - research-roadmap.yaml (find tasks with agent_type: codex — understand the YAML structure)

    TASK PART 1 — CODEX CONFIG.TOML FIX:
    1. Find what config.toml the Codex CLI reads. Likely: ~/.claude/config.toml or project .claude/config.toml.
       python -c "import subprocess; r = subprocess.run(['codex', '--help'], capture_output=True, text=True); print(r.stdout[:500])"
       OR: grep -rn "config.toml\|model_providers" ~/.claude/ 2>/dev/null | head -10
    2. The error "model_providers contains reserved" means the config has a key that Codex
       treats as reserved. Find it: cat ~/.claude/config.toml (or equivalent)
    3. Fix: Create a Codex-specific config that omits the conflicting key, or pass --config to override.
       The conductor should use this when dispatching codex tasks.
    4. Verify the fix: codex --config /path/to/codex-safe-config.toml -q "echo hello" 2>&1 | head -5
       (or equivalent minimal test that the Codex CLI launches without the reserved-key error)

