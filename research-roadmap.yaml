    \   n. Build artifact: schema='carnot.live_data_collection.v1',\n      inference_mode='live_gpu',\
    \ n_questions=50, question_indices='0-49',\n      models=['google/gemma-4-E4B-it',\
    \ 'Qwen/Qwen3.5-0.8B'],\n      n_pairs_collected=<count>,\n      live_pairs_file='results/live_pairs_578.json',\n\
    \      retro_062_resolved=<n_pairs_collected>=40>,\n      honest_verdict='retro_062_resolved'\
    \ if n_pairs_collected>=40 else 'partial_collection_578'.\n   o. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n4. Write tests/python/test_experiment_578_live_data_a_v3.py\
