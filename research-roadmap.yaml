    - python/carnot/models/ (Boltzmann, Gibbs, Ising model tiers)

    Boltzmann-GPT provides a DIRECT comparison: does Boltzmann-machine-style energy scoring
    correlate better with Z3MathVerifier ground truth than NRGPT energy recurrence?

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write to results/experiment_1226_boltzmann_gpt_phase3_seed.json:
