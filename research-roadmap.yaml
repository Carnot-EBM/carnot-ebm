        addressed_by: "exp1811 baseline + exp1909 confirmation provide the FS pipeline this routing sits on top of. arXiv:2603.28135 CoT2-Meta (Score 320) provides the expand/prune/repair/stop/fallback formalism."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: exp1983 (.198) was queued to layer CoT2-Meta's expand/
      prune/repair/stop/fallback state machine on top of Fast-Slow
      Variant. Status of activation unknown due to Bash failure during
      .200 pre-stage. This task checks for the artifact and retries
      with the same spec if missing.

      FALSIFIABLE HYPOTHESIS: A Carnot CoT2-Meta routing prototype
      achieves AT LEAST 1.2x further iter reduction vs the pure
      Fast-Slow Variant baseline AND demonstrates non-trivial fallback-
      path usage (>= 5% of examples) AND maintains exp1811's pass-rate
      within +/-3pp per task.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1983*_cot2meta_routing.json (if exists;
          if yes, this task no-ops with verdict
          `complete_already_shipped_in_198`)
        - results/experiment_1811_fast_slow_variant.json (baseline)
        - results/experiment_1909_fast_slow_confirmation.json
        - python/carnot/pipeline/fast_slow_variant.py
        - arXiv:2603.28135 CoT2-Meta abstract

      TASK: Check for exp1983 artifact; retry if missing.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `python -c "from carnot.pipeline.fast_slow_variant import
              fast_slow_variant"` succeeds.
           b. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              non-empty.
           Record preconditions_checked.
        1. If results/experiment_1983*.json exists with
           acceptance_gate_passed=true: emit
           `complete_already_shipped_in_198` and exit with no-op.
        2. Else: implement cot2meta_state_machine() per .198 exp1983
           spec; run on 90-example 3-task corpus; record per-example
           action_sequence + final_action.
        3. Compute iters_reduction vs exp1811 baseline +
           fallback_usage_rate + passrate drift.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.cot2meta_routing.v1"
        - experiment: 2012
        - run_date: ISO-8601 UTC
        - duration_s: > 300s if retry; smaller if no-op
        - random_seed: 173212
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {{target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          baseline: "fast_slow_variant_v1 (exp1811)",
          state_machine: "cot2meta_v1"}}
        - n_samples: 90 if retry; 1 if no-op
        - n_samples_justification: "30 per task × 3 tasks matching exp1811;
          or no-op confirmation."
        - already_shipped_in_198: bool
        - cot2meta_passrate_per_task: dict (or copied from exp1983 if no-op)
