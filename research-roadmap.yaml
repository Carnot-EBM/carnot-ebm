- id: exp899-drift-hidden-state-probe
  milestone: 2026.04.69
  deliverable: results/experiment_899_drift_hidden_state_probe.json
  title: 'Exp 899: DRIFT Hidden-State HalluProbe — Tier 0i Multi-layer Linear Probe (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2601.14210 (DRIFT: multi-layer representational inconsistency) shows
    that hallucinating LLMs exhibit representational drift between adjacent Transformer
    layers for the same token position: cosine similarity between layer L and layer L+1
    hidden states is lower for hallucinating completions than for truthful ones.
    This is a white-box probe (requires access to hidden states) that is architecturally
    different from Carnot's existing probes (Tier 0a-0h are all logit-space or attention-space).

    This experiment adds Tier 0i: DRIFTProbe that extracts hidden states from Qwen3.5-0.8B
    (small enough for CPU inference) and trains a linear probe to classify hallucinations
    from drift signatures.

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/ — existing probe implementations (for pattern reference)
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline (for wiring Tier 0i)
    - python/carnot/pipeline/verification_certificate.py — VerificationCertificate (advisory flags)
    - tests/data/fover_pairs.json (or equivalent) — labeled FoVer pairs for training
    - openspec/change-proposals/research-roadmap-v69.md — .69 Phase 3 Exp 899

    TASK: Implement DRIFTProbe. Extract hidden states from Qwen3.5-0.8B at layers {4,8,12,16}.
    Compute drift signatures. Train linear probe on 50 FoVer pairs. Wire as Tier 0i advisory.
    Target: probe_auc > 0.65.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Implement python/carnot/verify/drift_probe.py:
       class DRIFTProbe:
         __init__(self, model_name: str = "Qwen/Qwen3.5-0.8B",
                  probe_layers: list = None):
           self.probe_layers = probe_layers or [4, 8, 12, 16]
           self.linear_probe = None  # sklearn.linear_model.LogisticRegression
         extract_drift_signature(self, text: str) -> np.ndarray:
           Load Qwen3.5-0.8B with output_hidden_states=True.
           Tokenize text. Run forward pass. Extract hidden_states at self.probe_layers.
           For each consecutive pair (layer_L, layer_L+1):
             drift_L = 1.0 - cosine_similarity(hidden_states[L], hidden_states[L+1])
             (per-token drift; take mean over token positions)
           Return drift_signature: np.ndarray shape (len(probe_layers)-1,)
           (3 values for layers [4,8,12,16]: drift 4->8, 8->12, 12->16)
         fit(pairs: list[dict]) -> None:
           X = np.vstack([self.extract_drift_signature(p["text"]) for p in pairs])
           y = np.array([p["label"] for p in pairs])
           self.linear_probe = LogisticRegression(max_iter=200).fit(X, y)
         predict_proba(text: str) -> float:
           sig = self.extract_drift_signature(text)
           return self.linear_probe.predict_proba([sig])[0][1]
         is_representationally_drifted(text: str, threshold: float = 0.6) -> bool:
           return self.predict_proba(text) > threshold
    3. Wire as Tier 0i advisory in python/carnot/pipeline/three_tier_pipeline.py:
       Add to VerificationCertificate: is_representationally_drifted: bool = False
       After Tier 0h: run drift_probe.is_representationally_drifted(response) if probe loaded.
       This is advisory — does NOT short-circuit cascade.
    4. Add spec entries: REQ-TIER0-009 (DRIFTProbe Tier 0i), SCENARIO-TIER0-009.
    5. Experiment script:
       a. Load 60 FoVer pairs. Split 50 train / 10 eval.
       b. Fit DRIFTProbe on 50 training pairs.
       c. Evaluate on 10 held-out pairs. Compute probe_auc (sklearn.metrics.roc_auc_score).
       d. Also run on 20 synthetic pairs (10 intentionally wrong, 10 correct Qwen answers
          on simple arithmetic questions) for out-of-distribution check.
       e. Collect: probe_auc, ood_auc, probe_layers, inference_mode="cpu",
          drift_signature_shape (should be (3,)), linear_probe_coef.
    6. honest_verdict:
       - "drift_probe_viable" if probe_auc > 0.65
       - "drift_probe_marginal" if 0.55 < probe_auc <= 0.65
       - "drift_probe_not_viable" if probe_auc <= 0.55
    7. Write tests: test extract_drift_signature returns correct shape (3,) for 4 layers.
       Test cosine similarity computation is between 0 and 2 (drift = 1 - cossim can be negative
       for aligned representations — clamp to [0, 2]). Test fit() trains probe. Test wiring
       to VerificationCertificate. Traces to REQ-TIER0-009.
    8. Update ops/changelog.md, ops/status.md.
    9. tmpl.assert_deliverable_written() as final line.
    10. Write results/experiment_899_drift_hidden_state_probe.json.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_899_drift_hidden_state_probe.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp900-draft-conditioned-verifier
  milestone: 2026.04.69
  deliverable: results/experiment_900_draft_conditioned_verifier.json
  title: 'Exp 900: Draft-Conditioned Verifier — Tier 2.8 (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2603.03305 (Draft-Conditioned Constrained Decoding) shows that generating
    a cheap draft response first and then conditioning the constraint set on the draft's
    structure significantly reduces constraint violations in the final response. The draft
    is cheap (small model, low temperature) and is used only for constraint conditioning —
    not as the final answer.

    This implements DraftConditionedVerifier as Tier 2.8 in the ThreeTierPipeline:
    positioned between Tier 2.7 (CausalReasoningVerifier) and Tier 3 (Ising).
    When the Tier 2.7 verifier is uncertain, DraftConditionedVerifier generates a
    Qwen3.5-0.8B draft and uses its structure to pre-condition the Ising constraint set.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline (Tier 2.7 and Tier 3)
    - python/carnot/pipeline/verify_repair_pipeline.py — VerifyRepairPipeline (Tier 3)
    - python/carnot/pipeline/vjepa_predictor.py — VJEPA (Tier 2 — for pattern reference)
    - openspec/change-proposals/research-roadmap-v69.md — .69 Phase 3 Exp 900

    TASK: Implement DraftConditionedVerifier. Wire as Tier 2.8. Benchmark on 20 GSM8K questions.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Implement python/carnot/verify/draft_conditioned_verifier.py:
       class DraftConditionedVerifier:
         __init__(self, draft_model_name: str = "Qwen/Qwen3.5-0.8B",
                  draft_max_tokens: int = 50, draft_temperature: float = 0.1):
           self.draft_model_name = draft_model_name
           self.draft_max_tokens = draft_max_tokens
           self.draft_temperature = draft_temperature
         generate_draft(self, question: str) -> str:
           Load Qwen3.5-0.8B (CPU). Generate response with temperature=0.1 (greedy-ish).
           Return first draft_max_tokens tokens of response.
         extract_structural_constraints(self, draft: str) -> list[str]:
           Parse draft for structural markers:
           - "= X" patterns (proposed answer values)
           - arithmetic operations present (add/sub/mul/div)
           - step count (number of sentences in draft)
           Return list of constraint strings for Ising injection.
           e.g.: ["answer_in_range_0_to_100", "arithmetic_op_subtract", "n_steps_3"]
         condition_and_verify(self, question: str, response: str) -> dict:
           draft = self.generate_draft(question)
           structural_constraints = self.extract_structural_constraints(draft)
           # Return constraints for Tier 3 to inject BEFORE Ising run
           return {
             "draft": draft,
             "structural_constraints": structural_constraints,
             "draft_mismatch": draft_differs_from_response(draft, response),
             "tier28_advisory": "draft_conditioned"
           }
    3. Wire as Tier 2.8 in python/carnot/pipeline/three_tier_pipeline.py:
       After Tier 2.7: run draft_conditioned_verifier.condition_and_verify(question, response)
       Inject structural_constraints into Ising constraint set BEFORE Tier 3 run.
       Add tier28_advisory to VerificationCertificate.
    4. Add spec entries: REQ-TIER2-010 (DraftConditionedVerifier Tier 2.8),
       SCENARIO-TIER2-010 (draft constraints reduce Ising violation rate).
    5. Experiment script:
       a. Load 20 GSM8K questions.
       b. Generate answers with Qwen3.5-0.8B (these are the "responses" to verify).
       c. Baseline: run Tier 3 Ising VerifyRepairPipeline WITHOUT draft conditioning.
          constraint_violations_baseline: int (total violations across 20 questions)
       d. With Tier 2.8: run same pipeline WITH draft conditioning injecting structural constraints.
          constraint_violations_draft_conditioned: int
       e. Compute:
          - constraint_violation_pre_correction: constraint_violations_baseline / 20
          - constraint_violation_post_correction: constraint_violations_draft_conditioned / 20
          - signed_improvement: constraint_violations_baseline - constraint_violations_draft_conditioned
          - draft_mismatch_rate: fraction where draft differs structurally from response
          - avg_structural_constraints_injected: mean(len(structural_constraints)) over 20 questions
    6. honest_verdict:
       - "draft_verifier_viable" if constraint_violation_post_correction < constraint_violation_pre_correction
       - "draft_verifier_neutral" if difference < 0.5 violations
       - "draft_verifier_hurts" if constraint_violation_post_correction > constraint_violation_pre_correction
    7. Write tests: test extract_structural_constraints on known arithmetic sentence.
       Test condition_and_verify returns correct keys. Test Tier 3 constraint injection
       path. Traces to REQ-TIER2-010.
    8. Update ops/changelog.md, ops/status.md.
    9. tmpl.assert_deliverable_written() as final line.
    10. Write results/experiment_900_draft_conditioned_verifier.json.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_900_draft_conditioned_verifier.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp901-pimi-sparse-adjacency-v4
