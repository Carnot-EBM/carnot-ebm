  priority: critical
  requires_gpu: false
  prompt: |
    CONTEXT:
    CLAUDE.md Phase Prototype + Empirical Validation + Adversarial Check Discipline (MANDATORY):
    This is the THIRD attempt at Phase 1a adversarial verifier robustness audit. The prior two
    attempts (exp1092 in .85, exp1092-first-attempt in .84) were both blocked by conductor gate
    mismatches. This attempt has ALL 18 prior_failures declared.

    Acceptance gate: phase1a_false_pass_below_5pct — max false-pass rate < 5% across 5 attack types.

    New reference papers for this experiment:
    - arXiv 2511.22888 (APRM): adversarial attack patterns — stylistic shortcuts inflate PRM scores
      on invalid trajectories by 43%. Use these attack patterns as the adversarial probe suite.
    - arXiv 2603.06621 (Reward Under Attack): gradient-based attacks inflate rewards via padding
      and formatting. Confirms the attack model.
    - arXiv 2604.15149 (LLMs Gaming Verifiers): Isomorphic Perturbation Testing (IPT) —
      structure-preserving permutation that should not change correctness score.

    EXISTING CODE TO READ FIRST:
    - python/carnot/eval/diagnostics.py (AlphaT, KLDivergenceEstimator, NullSpaceEstimator,
      DecodedTextDiversity — use NullSpaceEstimator for residual analysis)
    - python/carnot/models/sos_kan.py (SOSKANEnergyV3 — primary verifier to audit)
    - python/carnot/verify/semenergy_probe.py (SemEnergy probe from exp1096)
    - data/fover_corpus_v4.json (6548 labeled pairs — use for adversarial corpus generation)
    - results/experiment_1072_sos_kan_v3_neural_gram.json (AUROC=0.9545 — baseline)
    - results/experiment_1096_semenergy_probe_v1.json (AUROC=0.948 — baseline)

    TASK:
    1. LOAD VERIFIERS:
       - SOSKANEnergyV3 from python.carnot.models.sos_kan
       - SemEnergy probe from python.carnot.verify.semenergy_probe (if available)
       Fall back to dummy energy scorer if verifier cannot be loaded (report in artifact).

    2. BUILD ADVERSARIAL CORPUS (100 examples):
       Take 50 CORRECT and 50 INCORRECT examples from data/fover_corpus_v4.json.
       Apply 5 APRM-style attack patterns to INCORRECT examples (attacking to make verifier
       assign lower/better energy score to a wrong answer):
       a. Stylistic padding: prefix 3-5 filler sentences ("Let me think step by step...")
       b. Structured formatting: wrap in markdown headers + bullets without changing math
       c. IPT isomorphic perturbation: rename variables (x→y, John→Alice) in reasoning chain
       d. Verbosity inflation: repeat each key reasoning step twice with slight rewording
       e. Confidence signaling: append high-confidence phrases ("I am certain this is correct")

    3. MEASURE FALSE-PASS RATE per attack type:
       For each of 5 attack types:
       - Compute energy score for the ORIGINAL incorrect example
       - Compute energy score for the ATTACKED version
       - False pass: attacked_energy < original_energy * 0.8 (verifier fooled)
       false_pass_rate[attack] = count(false_passes) / 50

    4. MEASURE IPT CONSISTENCY on CORRECT examples:
       For correct examples with IPT permutation applied:
       ipt_delta = |E(permuted) - E(original)| / E(original)
       Should be < 0.10 (score shouldn't change for structure-preserving permutations)

    5. RUN NULLSPACEESTIMATOR on attack residuals:
       from python.carnot.eval.diagnostics import NullSpaceEstimator
       Fit on the (original, attacked) energy difference vectors to check if attacks
       exploit a systematic dimension.

    6. WRITE TESTS (at least 4):
       tests/python/test_phase1a_adversarial_audit_v2.py:
       - adversarial_corpus_100_examples_generated
       - all_5_attack_types_applied
       - false_pass_rate_computed_per_attack
       - ipt_consistency_measured_correct_examples

