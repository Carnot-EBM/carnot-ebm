         f. inference_mode: "live_gpu" or "simulated" (honest label)
         g. Output: results/experiment_309_tier3_pipeline.json
      5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      6. Reconcile: update _bmad/traceability.md, ops/changelog.md, ops/status.md
      7. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp310-nl2z3-extractor
    milestone: "2026.04.29"
    deliverable: python/carnot/pipeline/nl2z3_extractor.py
    title: "Exp 310: NL2Z3Extractor — LLM-translated Z3 SMT assertions from chain-of-thought"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: The constraint extraction bottleneck remains the #1 barrier to real verify-repair
      improvement. ArithmeticExtractor found 0 violations on Gemma4-E4B-it (Exp 203). LLMExtractor
      found 1/91 FP but 0/9 wrong answers detected (Exp 207). The root cause: regex and shallow
      pattern matching can't capture the logical structure of chain-of-thought responses.

      Emergent Formal Verification (arXiv 2603.21149) solves this: use an LLM to translate
      chain-of-thought reasoning steps into Z3 Python assertions, then run Z3 to check satisfiability.
      If UNSAT → the reasoning chain is internally inconsistent → violation detected.
      Z3 Security Verification (arXiv 2604.05292) extends this to code with 3,500 artifacts.

      Implementation: NL2Z3Extractor makes a second LLM call to Qwen3.5-0.8B with a system prompt
      asking it to "translate the following reasoning steps into Z3 Python code that checks
      arithmetic consistency." Run z3.solve() on the generated code. UNSAT = violation.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/extract.py — ConstraintExtractor protocol (NL2Z3Extractor adds here)
      - python/carnot/pipeline/formal_claim_verifier.py — FormalClaimVerifier (existing Z3-adjacent)
      - python/carnot/pipeline/verify_repair.py — additive integration point
      - python/carnot/pipeline/__init__.py — current exports

      TASK: Implement NL2Z3Extractor.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-EXTRACT-010 (NL2Z3Extractor), REQ-EXTRACT-011 (Z3 UNSAT detection),
         and SCENARIO-EXTRACT-020–024 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - Z3Result dataclass: sat_status ("sat"/"unsat"/"unknown"/"error"), z3_code, runtime_ms
         - is_violation: True only when sat_status="unsat"
         - build_z3_prompt(response): returns system+user prompt for Z3 code generation
         - prompt includes: "Translate the arithmetic in this response to Z3 Python code"
         - run_z3_code(code): executes Z3 Python code in sandbox, returns Z3Result
         - sandbox: uses subprocess with 2s timeout; catches SyntaxError, NameError, TimeoutExpired
         - NL2Z3Extractor.extract(response): calls LLM → gets Z3 code → runs z3 → Z3Result
         - fallback: if LLM unavailable, returns Z3Result(sat_status="unknown", z3_code="")
         - pipeline integration: VerifyRepairPipeline.verify_with_z3(response) → Z3Result
         - __init__.py exports NL2Z3Extractor, Z3Result
         - edge cases: empty response, non-arithmetic response, z3 not installed (skip test)
         - 2s subprocess timeout: Z3Result(sat_status="unknown", runtime_ms>2000)
      4. Implement python/carnot/pipeline/nl2z3_extractor.py:
         - Z3Result(sat_status, z3_code, runtime_ms, violations_found, error_message)
         - build_z3_prompt(response: str) → tuple[str, str]: returns (system, user) messages
           System: "You are a formal verification assistant. Translate arithmetic reasoning steps
           from the response below into Z3 Python code that checks consistency. Use z3.solve()
           at the end. The code must be self-contained and runnable with `import z3`."
         - run_z3_code(code: str, timeout_s: float = 2.0) → Z3Result:
           subprocess.run(["python", "-c", code], timeout=timeout_s, capture_output=True)
           Parse stdout for "unsat" → sat_status="unsat"; "sat" → "sat"; else "unknown"
         - NL2Z3Extractor class implementing ConstraintExtractor protocol:
           extract(question: str, response: str) → list[ConstraintViolation]
           1. build_z3_prompt(response)
           2. Call LLM (Qwen3.5-0.8B via transformers or fallback to mock in CI)
           3. Parse LLM output to extract Python code block (```python ... ```)
           4. run_z3_code(extracted_code)
           5. If unsat: return [ConstraintViolation(type="z3_unsat", evidence=z3_code)]
           6. Else: return []
         - LLM_AVAILABLE guard: skip real LLM call in CI (CARNOT_FORCE_LIVE=1 to enable)
      5. Add additive integration to VerifyRepairPipeline:
         - verify_with_z3(question, response, timeout_s=2.0) → Z3Result
      6. Export from python/carnot/pipeline/__init__.py
      7. Implement scripts/experiment_310_nl2z3_results.py:
         a. Load 50 responses from Exp 211 corpus (or synthetic fallback)
         b. Run NL2Z3Extractor on each response
         c. Record: sat_status, runtime_ms, z3_code per response
         d. Output: results/experiment_310_nl2z3_results.json
      8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      9. Reconcile: update ops/changelog.md and ops/status.md
      10. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp311-extractor-benchmark
    milestone: "2026.04.29"
    deliverable: results/experiment_311_extractor_benchmark.json
    title: "Exp 311: Extractor benchmark — regex vs LLM vs Z3 FP/TP on IT-model responses"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Three constraint extractors now exist in Carnot:
        1. ArithmeticExtractor (regex): 0/9 TP, 3/20 FP on Gemma4-E4B-it (Exp 203/207)
        2. LLMExtractor: 1/91 FP (good), 0/9 TP wrong detected (bad) (Exp 207)
        3. NL2Z3Extractor (Exp 310): new, performance unknown

      This benchmark uses the Exp 211 constraint IR corpus (81 examples: 9 live GSM8K + 36
      instruction + 36 code) plus Exp 235 semantic benchmark responses to measure FP/TP on
      instruction-tuned IT models (Gemma4-E4B-it and Qwen3.5-0.8B).

      The key metric: for each extractor, what fraction of CORRECT responses get flagged (FP)?
      What fraction of INCORRECT responses get detected (TP)? We're looking for:
        - FP < 5% (don't break correct answers)
        - TP > 0% on IT models (ANY improvement over current 0% detection)

      EXISTING CODE TO READ FIRST:
      - results/experiment_310_nl2z3_results.json — NL2Z3 first run results
      - python/carnot/pipeline/extract.py — ArithmeticExtractor, LLMExtractor
      - python/carnot/pipeline/nl2z3_extractor.py — NL2Z3Extractor (from Exp 310)
      - results/experiment_207_extractor_results.json — LLM extractor baseline (if exists)
      - results/experiment_203_extraction_results.json — regex extractor baseline (if exists)
      - scripts/experiment_template.py — ExperimentTemplate

      TASK: Run head-to-head extractor benchmark.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-EXTRACT-012 (extractor benchmark REQ) and SCENARIO-EXTRACT-025/026.
      3. Write tests FIRST (100% coverage required) for:
         - ExtractorBenchmarkRow: question, response, correct, extractor_name, fp, tp, runtime_ms
         - compute_fp_rate(rows): n_fp / n_correct_responses
         - compute_tp_rate(rows): n_tp / n_incorrect_responses
         - BenchmarkResult: extractor, fp_rate, tp_rate, mean_runtime_ms, n_total
         - artifact schema: experiment=311, extractors=[...], winner=str, fp_tp_table
         - honest: any extractor with tp_rate=0 is reported truthfully
      4. Implement scripts/experiment_311_extractor_benchmark.py using ExperimentTemplate:
         a. [CORPUS] Load 30 responses: 15 CORRECT (no errors) + 15 INCORRECT (known errors)
            Sources: Exp 235 semantic benchmark (Gemma4-E4B-it responses), Exp 211 corpus,
            or synthetic labeled fallback (deterministic, CI-safe).
            Correct/incorrect labels from Exp 235 results or explicit annotation.
         b. [BENCHMARK] For each extractor [ArithmeticExtractor, LLMExtractor, NL2Z3Extractor]:
            - Run extract(question, response) on all 30 responses with 5s per-call timeout
            - Record: violation_detected (bool), runtime_ms, error (if any)
            - FP: violation_detected=True on CORRECT response
            - TP: violation_detected=True on INCORRECT response
         c. [RESULTS] Compute FP rate, TP rate, mean_runtime_ms per extractor
         d. [WINNER] Select extractor with lowest FP while TP > 0 (prefer TP > FP)
         e. [OUTPUT] results/experiment_311_extractor_benchmark.json with fp_tp_table,
            winner, recommendation
         f. inference_mode: "live_gpu" if CARNOT_FORCE_LIVE=1, else "simulated"
      5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      6. Reconcile: update _bmad/traceability.md, ops/changelog.md, ops/status.md
      7. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp312-z3-gated-repair
    milestone: "2026.04.29"
    deliverable: python/carnot/pipeline/z3_gated_repair.py
    title: "Exp 312: Z3-gated repair — only repair when Z3 says UNSAT"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 311 benchmarked all three extractors. The Z3-based approach (NL2Z3Extractor)
      should give the lowest FP rate because Z3 either proves UNSAT (definitive violation) or
      returns SAT/unknown (repair skipped). This experiment wires Z3-gated repair into the
      pipeline: when NL2Z3Extractor returns UNSAT, trigger full Ising repair; when SAT, skip.

      The design principle: Z3 is the "first gate" (cheap, high precision). Ising is the "second
      gate" (expensive, higher recall). Z3 SAT → skip Ising. Z3 UNSAT → trigger Ising repair.
      Z3 unknown → use confidence-weighted Ising (existing fallback path).

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/nl2z3_extractor.py — NL2Z3Extractor, Z3Result
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
      - python/carnot/pipeline/confidence_verifier.py — ConfidenceVerifier (gate pattern)
      - results/experiment_311_extractor_benchmark.json — benchmark results for reference

      TASK: Implement Z3-gated repair and run a 30-question mini-benchmark.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-REPAIR-010 (Z3-gated repair), REQ-REPAIR-011 (Z3 SAT skip path) and
         SCENARIO-REPAIR-020–023 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - Z3GatedRepairResult: z3_status, ising_triggered, repaired, improvement
         - z3_unsat path: ising_triggered=True
         - z3_sat path: ising_triggered=False, repaired=False
         - z3_unknown path: falls back to confidence-weighted Ising (ising_triggered=True)
         - VerifyRepairPipeline.verify_repair_z3_gated(): returns Z3GatedRepairResult
         - skip_rate: fraction of questions where z3_sat → Ising skipped
         - 30-question benchmark: at least 10 correct + 10 incorrect responses tested
         - artifact schema: experiment=312, z3_gate_skip_rate, ising_trigger_rate, net_improvement
         - honest: net_improvement=0 is valid and reported
      4. Implement python/carnot/pipeline/z3_gated_repair.py:
         - Z3GatedRepairResult(z3_status, z3_code, ising_triggered, ising_violations,
           repair_attempted, repaired, improvement, runtime_ms)
         - Z3GatedRepair(nl2z3_extractor, ising_pipeline, confidence_threshold=0.8)
         - repair(question, response, domain) → Z3GatedRepairResult:
           1. Run NL2Z3Extractor → Z3Result
           2. If sat_status="sat": return early (skip Ising)
           3. If sat_status="unsat": trigger ConfidenceVerifier + Ising repair
