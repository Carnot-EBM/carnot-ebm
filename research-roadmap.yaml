    \ binary cross-entropy training collapses (all predictions = 0.5) when positive\
    \ and negative pairs have similar embeddings. The LeWorldModel two-term objective\
    \ (arXiv 2603.19312) adds Gaussian latent regularization that prevents embedding\
    \ collapse: L_total = L_prediction + λ * KL(q(z)||N(0,I)). This is CPU-trivial\
    \ and provides stable gradients even when pairs are similar.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/models/eorm_model.py — EORMModel (EORM training pattern)\n\
