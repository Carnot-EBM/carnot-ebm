    .117 achieved zero deterministic false accepts but did not estimate risk
    for unexplored prefixes. BEAVER suggests deterministic probability bounds
    over prefix-closed constraints. In Carnot, those bounds are routing signals
    only; runtime contracts remain authority. Use {project_root} as the
    project root and {date} as the run date.

