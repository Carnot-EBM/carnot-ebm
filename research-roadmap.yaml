    - python/carnot/training/ — contrastive divergence training\n\
    - results/experiment_419_precision_live.json — live CoT traces if available\n\
    - python/carnot/pipeline/extract.py — ArithmeticExtractor for step parsing\n\
    \nTASK: Implement VPRM training pipeline using FOVER-style Z3 step annotation.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-LEARN-030 (VPRM: IsingEBM trained on Z3-annotated step labels),\n\
    \   REQ-LEARN-031 (FOVER annotation: each step verified by Z3 without human labels),\n\
    \   REQ-LEARN-032 (VPRM generalizes: after training, evaluates steps without Z3),\n\
    \   SCENARIO-LEARN-054/055/056 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write tests FIRST (100% coverage) for:\n\
    \   - ReasoningStep(step_text: str, step_index: int, parent_question: str,\n\
    \     z3_label: Literal['correct','incorrect','not_formalizable'] | None = None)\n\
    \   - parse_cot_into_steps(response_text: str) -> list[ReasoningStep]:\n\
    \     Split on sentence boundaries and 'Step N:' markers.\n\
