  - id: exp300-memory-to-constraint-generator
    milestone: "2026.04.22"
    deliverable: python/carnot/pipeline/constraint_generator.py
    title: "Exp 300: Memory-to-Constraint Generator — Tier 2 patterns to new constraint types"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: The research program identified the critical self-learning fix: constraint ADDITION
      from memory patterns, NOT just weight adjustment. Exp 134 showed precision reweighting gives
      0% improvement. The fix: when CaseMemory/ConstraintMemory accumulates error patterns like
      "arithmetic carry errors are common," GENERATE and ADD new constraint types to the Ising model.

      Example: Memory sees 15/30 repair failures on "carry propagation in multi-digit addition."
      → Generate a new carry-check constraint: for operands a, b with carry c, verify c = (a+b >= 10).
      → Add this as a new IsingConstraint to the ArithmeticExtractor's constraint set.
      → Future verify-repair calls check carry propagation explicitly.

      The soundness bounds from arXiv 2603.03538 (CoT Verifier Online Learnability) tell us that
      a constraint is safe to add if it has high precision (rarely flags correct answers). Only
      generate constraints where observed_precision > 0.85 (85% of flagged cases were real errors).

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/case_memory.py — CaseMemory (error pattern storage)
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline, ArithmeticExtractor
      - python/carnot/pipeline/extract.py — ConstraintExtractor and constraint types
      - python/carnot/verify/terms.py — ConstraintTerm, IsingConstraint
      - results/experiment_223_results.json — prior memory precision numbers (12.6% reuse precision)

      TASK: Implement ConstraintGenerator that converts memory patterns to new constraint types.
      1. Read CLAUDE.md spec-first workflow
      2. Add REQ-LEARN-010 (constraint addition from memory), REQ-LEARN-011 (soundness bound),
         and SCENARIO-LEARN-015–018 to openspec/capabilities/*/spec.md (use self-learning spec)
      3. Write tests FIRST (100% coverage required) for:
         - ConstraintPattern: dataclass with pattern_type, observed_precision, support_count,
           example_violations, constraint_template
         - extract_patterns(case_memory): reads CaseMemory, groups by violation_family,
           computes observed_precision per group
         - soundness_filter(patterns, min_precision=0.85): only return high-precision patterns
         - generate_constraint(pattern): creates an IsingConstraint from a ConstraintPattern
         - constraint_already_exists(extractor, constraint_id): prevents duplicate adding
         - add_to_extractor(extractor, constraint): additive, does not remove existing constraints
         - rejected_for_soundness: patterns below min_precision are rejected, not silently dropped
         - empty memory: returns empty pattern list, does not crash
      4. Implement python/carnot/pipeline/constraint_generator.py:
         - ConstraintPattern(pattern_type, violation_family, observed_precision, support_count,
           example_violations, constraint_template, source_memory_keys)
         - extract_patterns(case_memory, min_support=3): group CaseMemory by violation_family;
           compute precision = accepted_repairs / total_flagged; return patterns with support ≥ 3
         - soundness_filter(patterns, min_precision=0.85): based on arXiv 2603.03538 bound
