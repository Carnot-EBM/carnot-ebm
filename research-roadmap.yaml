      Exp6342 and Exp6343 provide an exact e-value release ledger and an evidence-carrying factor lifecycle. Exp6344 and Exp6345 reported positive factor results, but their inference substrates show deterministic proposal replay and tokenizer-only model access. V547 must first prove that the three required local GGUF models can make real bounded factor proposals. This task is an authenticity and feasibility preflight. It makes no utility or continuous-learning claim.

