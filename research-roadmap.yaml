  max_turns: 30
  prior_failures:
  - experiment_id: exp433-spilled-energy-integration
    verdict: 'complete: spilled_energy integrated at k=15 (Tier 0b)'
    addressed_by: "exp285 and exp433 implemented SpilledEnergy at k=15 (Tier 0b). exp2369
      implements the k=18 VARIANT — a different hyperparameter extending the logprob window
      from 15 to 18 tokens, motivated by the ICLR 2026 paper (arXiv:2602.18671) which
      characterizes multi-k behavior. This is NOT a rerun of k=15; it tests whether the
      wider window improves AUROC. Different parameter, different hypothesis. The k=15
      result is the baseline being compared against."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: SpilledEnergy (arXiv:2602.18671, ICLR 2026) computes a token-level spilled
    energy metric from top-k logprob distributions. Tier 0b (SpilledEnergy k=15) is already
    implemented. exp2369 implements k=18 variant which uses a larger context window of
    top-18 logprobs, potentially capturing longer-range logical dependencies.

    SpilledEnergy formula: E_spilled(x) = sum_{i>k} p_i * log(p_i / p_k) where p_i are
    token probabilities sorted descending. k=18 extends the sum over 18 top-probability
    tokens vs the current k=15 baseline.

    This is k=18 in the ensemble notation (Tier 0i, extending Tier 0b SpilledEnergy k=15).

