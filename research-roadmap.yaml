    prompt: |
      CONTEXT: Today is {date}. Workspace is {project_root}. Based on recent HardNet++ (arXiv:2604.19669) research, differentiable closed-form projection layers enforce strict non-linear constraints during both training and inference.
      EXISTING CODE TO READ FIRST: python/carnot/inference/grammar.py and python/carnot/models/boltzmann.py
