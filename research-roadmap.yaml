       - unsloth/Qwen3.6-35B-A3B-GGUF
       - unsloth/gemma-4-26B-A4B-it-GGUF
       If any are missing, re-download before completing this task.

    4. VERIFY MANIFEST: Confirm ops/exclusion_manifest.yaml contains exp786, exp627, exp603, exp641.
       If any are missing, add them now.

    CONCRETE STEPS:
    - import json, glob, os
    - find and read experiment_906 result JSON
    - diagnose root cause
    - check for experiment_954 result files
    - run: ls ~/.cache/huggingface/hub/ | grep gemma-4-31B
