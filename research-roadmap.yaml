- id: exp509-ppsebm-energy-magnitude-replay
  milestone: 2026.04.38
  deliverable: results/experiment_509_ppsebm_energy_magnitude_replay.json
  title: 'Exp 509: PPSEBM Energy-Magnitude Replay — RETRO-050 fix replacing LLM-surprise with EBM energy priority'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-050 is\
