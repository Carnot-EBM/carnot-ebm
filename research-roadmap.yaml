milestone: "2026.05.211"
milestone_title: "Constraint-Aware Retrieval, DAB-Guided Generation, and Substrate-Aware KANs"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp2120-archive-and-activate
    title: "Phase 0: Archive .210 and activate .211"
    max_turns: 20
    prompt: |
      CONTEXT: Milestone 2026.05.210 has completed. We must prepare for 2026.05.211.
      EXISTING CODE TO READ FIRST: {project_root}/research-complete.yaml, {project_root}/research-roadmap.yaml
      TASK: Archive 2026.05.210 to research-complete.yaml and initialize the .211 milestone in ops/changelog.md.
      CONCRETE STEPS:
      1. Move all tasks from `research-roadmap.yaml` into `research-complete.yaml` under a new 2026.05.210 entry, setting completed date to {date}.
      2. Clear `research-roadmap.yaml` and copy the new milestone structure from `research-roadmap-next.yaml`.
      3. Add a "## {date} (Milestone 2026.05.211 Operational Retrospective)" stub in `ops/changelog.md`.
      4. Write deliverable to `results/experiment_2120_archive.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2121-carm-implementation
    title: "Phase 1: Constraint-Aware Retrieval Module (CARM)"
    max_turns: 50
    agent_type: "codex"
    prompt: |
      CONTEXT: ConstraintLLM requires a mechanism to fetch relevant formal constraints based on natural language prompts.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/pipeline/extract.py
      TASK: Implement the CARM to dynamically retrieve verifiable logic schemas.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/carm.py`.
      2. Implement semantic matching of prompt tokens against the existing static constraint library.
      3. Save to `results/experiment_2121_carm.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2122-constraint-llm-pipeline
    title: "Phase 1: ConstraintLLM Generation Pipeline"
    max_turns: 50
    prompt: |
      CONTEXT: Integrating CARM into the reasoning loop allows models to become ConstraintLLMs.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/llm_solver.py
      TASK: Wire the CARM module into the LLM solver for constraint-aware drafting.
      CONCRETE STEPS:
      1. Modify the solver to prepend CARM-retrieved constraints to the reasoning context.
      2. Support `unsloth/gemma-4-31B-it-GGUF`.
      3. Save to `results/experiment_2122_constraint_llm.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2123-dab-implementation
    title: "Phase 1: Discrete Auto-Regressive Biasing (DAB)"
    max_turns: 50
    prompt: |
      CONTEXT: DAB guides LLM decoding directly in discrete vocabulary space using energy gradients, bypassing continuous-space mapping bottlenecks.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/energy_decoding.py
      TASK: Implement DAB for the LLM decoding step.
      CONCRETE STEPS:
      1. Create `python/carnot/inference/dab.py`.
      2. Hook the energy landscape gradients into the top-k logit selection.
      3. Save to `results/experiment_2123_dab.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2124-dab-gsm8k-eval
    title: "Phase 1: DAB-Guided GSM8K Evaluation"
    max_turns: 50
    gated_on:
      - upstream: exp2123-dab-implementation
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: We must verify DAB improves constraint satisfaction on math reasoning.
      EXISTING CODE TO READ FIRST: {project_root}/tests/integration/test_gsm8k.py
      TASK: Run GSM8K using `unsloth/Qwen3.6-35B-A3B-GGUF` with DAB.
      CONCRETE STEPS:
      1. Execute a 50-problem evaluation with DAB enabled vs disabled.
      2. Record accuracy and energy bounds.
      3. Save to `results/experiment_2124_dab_eval.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2125-substrate-aware-kan
    title: "Phase 2: Substrate-Aware KAN Translation"
    max_turns: 100
    model: "opus"
    agent_type: "codex"
    prompt: |
      CONTEXT: KANs must be hardware-efficient. Substrate-aware mapping targets LUTs for FPGA simulation.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/models/ising/kan_tier.py
      TASK: Translate KAN nodes into LUT-compatible binary thresholds (BiKA/KANELÉ style).
      CONCRETE STEPS:
      1. Implement a LUT-friendly reparameterization of the continuous splines in `python/carnot/models/ising/substrate_kan.py`.
      2. Validate output equivalence within 1%.
      3. Save to `results/experiment_2125_substrate_kan.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2126-kan-hardware-accounting
    title: "Phase 2: Substrate-Aware KAN Hardware Accounting"
    max_turns: 30
    gated_on:
      - upstream: exp2125-substrate-aware-kan
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: Measure the theoretical FPGA speedup and area reduction (BOP/LUTs) of Substrate-Aware KANs.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/models/ising/substrate_kan.py
      TASK: Perform no-synthesis accounting for the new KAN architecture.
      CONCRETE STEPS:
      1. Compute RM (Real Multiplications), NABS, and LUT counts.
      2. Ensure no Vivado compilation is required.
      3. Save to `results/experiment_2126_kan_accounting.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2127-adamflip-optimization
    title: "Phase 2: AdamFLIP Hard Constrained PINN Training"
    max_turns: 50
    prompt: |
      CONTEXT: AdamFLIP applies adaptive momentum feedback linearization to solve hard constraints robustly.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/training/csl_loop.py
      TASK: Integrate AdamFLIP into the continuous learning optimizer.
      CONCRETE STEPS:
      1. Create `python/carnot/training/adamflip.py`.
      2. Apply it to the constraint residuals as a feedback input.
      3. Save to `results/experiment_2127_adamflip.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2128-dynamic-resolution-csl
    title: "Phase 3: Dynamic Resolution Continuous Self-Learning"
    max_turns: 50
    prompt: |
      CONTEXT: To stop catastrophic forgetting and mode collapse during continual learning, the EBM landscape resolution must adapt dynamically.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/training/csl_loop.py
      TASK: Implement Dynamic Resolution for the EBM landscape during FR-11 CSL.
      CONCRETE STEPS:
      1. Scale the energy grid resolution iteratively based on moving-average error.
      2. Update the CSL loop to support dynamic energy boundaries.
      3. Save to `results/experiment_2128_dynamic_res.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2129-rlvr-ebm-integration
    title: "Phase 3: RLVR Integration with Verifiable EBM Rewards"
    max_turns: 50
    prompt: |
      CONTEXT: Reinforcement Learning with Verifiable Rewards (RLVR) provides monotonic KL convergence for LLMs.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/verifier.py
      TASK: Use Carnot's energy scores as RLVR scalar potentials.
      CONCRETE STEPS:
      1. Wrap the solver output with an RLVR-style objective function.
      2. Test the backward pass gradients.
      3. Save to `results/experiment_2129_rlvr.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2130-full-e2e-benchmark
    title: "Phase 3: Full E2E Benchmark (CARM + DAB + Dynamic CSL)"
    max_turns: 50
    gated_on:
      - upstream: exp2128-dynamic-resolution-csl
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: Final validation of Milestone 211. 
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/pipeline/verify_repair.py
      TASK: Run the complete pipeline leveraging `unsloth/gemma-4-26B-A4B-it-GGUF`.
      CONCRETE STEPS:
      1. Assemble CARM extraction, DAB decoding, and Dynamic CSL.
      2. Verify catastrophic forgetting remains at 0% across 3 test scenarios.
      3. Save to `results/experiment_2130_e2e.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2131-milestone-211-retro
    title: "Phase 3: Milestone 2026.05.211 Retrospective"
    max_turns: 20
    prompt: |
      CONTEXT: End of milestone analysis for .211.
      EXISTING CODE TO READ FIRST: {project_root}/ops/conductor-log.md
      TASK: Generate the retrospective analysis of the .211 milestone.
      CONCRETE STEPS:
      1. Read all experiment results from the 212X and 213X series.
      2. Synthesize findings into `results/experiment_2131_retro.json` and update `ops/status.md`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
