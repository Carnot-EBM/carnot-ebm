  - id: exp4270-arc-family-provenance-recovery
    milestone: 2026.06.395
    title: "PHASE A1 (DEPTH; fix exp4258's root cause) -- FAMILY/GAME PROVENANCE RECOVERY + diversity audit. exp4258 (cross-game transfer) BLOCKED blocked_arc_game_ids_unrecoverable: the 52-task grown pool's gap3_stage2:XXXX task_ids could not be mapped to game/family identities, so no family-disjoint split could be built. FIX: recover a task-FAMILY id (and game id where applicable) for EVERY pool row by joining raw_task_id/source_id back to the source ARC task definitions -> the ARC-TGI family taxonomy (arXiv:2603.05099) and/or the 25-game survey (results/arc3_win_condition_survey.json). Materialize a FIRST-CLASS provenance manifest per the Reliability Gap discipline (arXiv:2606.03305): per-row {{source_kind, family_id, game_id, fold, target_hash}}. Emit family_split_feasible BARE bool := (>=4 distinct families AND each held-out fold has >=~10 tasks for bootstrap power) + distinct_family_n + per_family_task_count. This task makes the cross-family test POSSIBLE; it does NOT run the test. CPU-only; NO GGUF/GPU."
    priority: critical
    track: verifier-oracle-distinct
