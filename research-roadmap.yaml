  title: 'Exp 932: DualGPU Throughput Benchmark — Confirm 1.4x Speedup on Realistic Workload (GPU, CARNOT_DUAL_GPU=1)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 913 wired CARNOT_DUAL_GPU=1 into ThreeTierPipeline via wire_dual_gpu_runner()
    and measured 1.4x observed speedup on tiny synthetic workloads (20 questions, 0.003s total).
    That speedup was not quantitatively confirmed on realistic workloads. Exp 921 was blocked by
    missing prior_failures. This experiment runs 50 GSM8K questions through ThreeTierPipeline
    with CARNOT_DUAL_GPU=1 vs single-GPU baseline, measuring throughput (questions/minute) and
    wall time to confirm the 1.4x speedup is real and not just synthetic artifact.

    EXISTING CODE TO READ FIRST:
    - results/experiment_913_dualgpu_production_wiring.json — baseline result: 1.4x, 5067 qps
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline + wire_dual_gpu_runner()
    - python/carnot/pipeline/dual_gpu_runner.py — DualGPURunner implementation
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog

    TASK: Run throughput benchmark comparing single-GPU vs DualGPU on 50 questions.

    CONCRETE STEPS:
    1. Read CLAUDE.md.
    2. Write scripts/experiment_932_dualgpu_throughput_benchmark.py:
       a. ExperimentTemplate(932, ..., requires_gpu=True)
       b. Load 50 GSM8K questions (or 50 synthetic verification questions).
       c. Single-GPU baseline: run ThreeTierPipeline on all 50 questions WITHOUT CARNOT_DUAL_GPU.
          Record wall_time_single_s and throughput_single_qps.
       d. DualGPU: run ThreeTierPipeline.wire_dual_gpu_runner() then same 50 questions.
          Record wall_time_dual_s and throughput_dual_qps.
       e. Compute: observed_speedup = wall_time_single_s / wall_time_dual_s.
       f. honest_verdict: 'dualgpu_speedup_confirmed' if observed_speedup >= 1.4,
                          'dualgpu_speedup_partial' if 1.0 < observed_speedup < 1.4,
                          'dualgpu_no_speedup' if observed_speedup <= 1.0.
    3. Write tests (100% coverage). Mock GPU for CPU-only test execution.
    4. Run: CARNOT_DUAL_GPU=1 JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_932_dualgpu_throughput_benchmark.py
    5. Update ops/changelog.md.

    Run: CARNOT_DUAL_GPU=1 JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_932_dualgpu_throughput_benchmark.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

