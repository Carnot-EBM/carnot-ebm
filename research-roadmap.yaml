    prompt: |
      CONTEXT: The self-learning thesis (PRD FR-11 / continuous self-learning) rests on alpha_t grounding
      — the verifier signal that keeps a self-correcting model from collapsing onto its own null space
      (Zenil alpha_t; Q12 Dark Room / Hypothesis-B). exp3521 (.324) selected the conservative-default
      beta as the robust Phase-5 rule; exp3533 (.325) DEPLOYED it end-to-end and confirmed it prevents
      collapse where beta=0 collapses — BUT it ran on a DEGENERATE corpus (initial_true_accuracy=0.0067
      ~ 0), so its "over-regularizes, quality drops" finding is an ARTIFACT (there was no quality to
      preserve). exp3544 (.326) was meant to fix this but never ran (interrupt). This task re-deploys the
      SAME rule on a NON-DEGENERATE corpus (starting true accuracy ~0.3-0.6, verified at step 0) so the
      quality question is actually answerable. Independent precedent: ER-PRM (arXiv:2412.11006) entropy
      regularization stabilizes PRM training. Cached traces + cached verifier scoring -> no live model
      -> no timeout. This is the milestone's mandatory continuous-self-learning experiment.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3533_fr11_conservative_default_deploy_closed_loop_v1.json (the degenerate-corpus deploy: initial_true_accuracy 0.0067)
        - scripts/experiment_3533_fr11_conservative_default_deploy_closed_loop_v1.py (REUSE the closed-loop harness + collapse detection + the pass_rate/true_accuracy distinct assert; the ONLY required change is selecting a NON-DEGENERATE corpus + a step-0 true-accuracy floor)
