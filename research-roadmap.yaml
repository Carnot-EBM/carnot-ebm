  - id: exp2632
    milestone: "2026.05.251"
    deliverable: "results/experiment_2632_capstone_v251.json"
    title: "Capstone v251: Cross-Artifact Synthesis + Operator Recommendations"
    agent_type: claude
    model: opus
    max_turns: 100
    track: synthesis
    requires_claude: true

    prior_failures:
      - experiment_id: exp2619-capstone-v250
        verdict: "complete: single-seed synthesis of .250 results (sklearn fix, verifier chain unblocked)"
        addressed_by: "exp2619 synthesized 13 .250 experiments. This synthesizes 13 .251 experiments including adversarially-validated v9 AUROC (5-seed), external benchmark results (HalluScan + PARALLAX), TTT loop prototype (FR-11 Tier 3 closure), FJD v2 safety, BB-UCP conformal, KV260 continuity, paper polish, and GGUF smoke. Substantially different evidence base requiring multi-artifact cross-synthesis and operator recommendations under ambiguity."
