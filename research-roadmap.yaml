      verdict: calibration_auroc_delta_0.185_consistency_regularization_worsened_paraphrase_variance
      addressed_by: "exp1384 found hinge loss gave calibration_auroc_delta=+0.185 (strong positive) but consistency regularization WORSENED paraphrase energy variance. The two terms are in conflict: consistency regularization penalizes energy variance on paraphrases, but hinge loss drives variance toward the margin. This task uses hinge loss only (consistency_regularization_weight=0.0) to isolate the positive hinge signal and confirm calibration improvement without the counterproductive regularizer."
