    title: "Exp 1924: .195 Milestone Retrospective"
    deliverable: results/experiment_1924_retro.json
    max_turns: 20
    prompt: |
      CONTEXT: The .195 milestone is wrapping up.
      
      EXISTING CODE TO READ FIRST:
        - ops/changelog.md
        - ops/status.md
        - research-roadmap-next.yaml

      TASK: Write the milestone retrospective to prepare for .196.

      CONCRETE STEPS:
