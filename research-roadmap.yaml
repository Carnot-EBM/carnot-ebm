        verdict: "blocked_native_cuda_runtime_certificate_failed_terminal_retirement_evidence"
        addressed_by: "The retired native three-model JSON-grammar certificate is not retried: this is a single-model raw-response canary through the Python llama.cpp API with deterministic external exact validation."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      FR-11 has anytime-valid replay evidence but no prospective stream from a current local model. Earlier SOTA panels failed because CUDA offload was unauthenticated or native JSON grammar was brittle; that certificate is retired. The changed path is a raw-response llama-cpp-python canary using one mandated model with exact validators outside generation. TrapQA motivates salient-shortcut rows that conflict with prompt-supplied exact evidence. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/python/carnot/model_cache.py
      - {project_root}/results/experiment_5606_clean_sota_solve_verify_evidence_panel.json
      - {project_root}/results/experiment_5615_native_llamacpp_cuda_runtime_certificate.json
      - {project_root}/results/experiment_5639_anytime_valid_csl_independent_audit.json
      - {project_root}/results/experiment_5640_fr11_shadow_pipeline_integration.json
      - {project_root}/openspec/capabilities
      - {project_root}/tests/python

      TASK:
      Generate and seal a chronological exact-constraint stream from a mandated local SOTA GGUF with authenticated CUDA offload, then emit results/experiment_5708_sota_exact_constraint_canary.json.

      CONCRETE STEPS:
      1. Add/extend the relevant OpenSpec REQ-* before implementation. Declare `MODEL_SPECS` with headline `unsloth/gemma-4-26B-A4B-it-GGUF`; use repository cache helpers such as cached_sota_pair()/resolution patterns, never transformers tokenization for GGUF.
      2. Precondition: resolve/hash GGUF, identify quantization/size, import CUDA llama-cpp-python, confirm NVIDIA devices, reserve VRAM/RAM, and use GPU layers. Authenticate positive offloaded-layer evidence plus before/during/after memory telemetry. Block if unavailable; CPU-only is never headline.
      3. Freeze at least 48 balanced rows across exact finite-state, arithmetic/finite-domain, hard-soft preference, format stress, and TrapQA-style shortcut families. Include answer/abstention, shifts, and contradictions.
      4. Generate one raw response per row with fixed parameters/seeds and no JSON grammar. Preserve prompt, raw text, finish reason, tokens, timing, telemetry, hashes. Missing/truncated/unparsable rows are failures.
      5. Deterministically parse and label with independent exact FSM/arithmetic/MaxSAT-style validators. Double-check a stratified sample with a second implementation/enumeration; disagreement blocks.
      6. Commit order before learner access. Seal shadow prefix/unopened suffix with row IDs, families, timestamps, hashes, split hashes, and root commitment; no outcome-driven split tuning.
      7. Set `sota_canary_ready_score=1.0` only if mandated model ran with authenticated offload, all families/denominators exist, raw responses are lossless, disagreement is zero, commitments verify, and no retired runtime/external scorer ran. This is data/runtime readiness only.
      8. REQUIRED ARTIFACT FIELDS: with `field_principles`, `MODEL_SPECS` — model explicit; `resolved_model_path`, `model_repo_id`, `gguf_filename`, `model_hash`, and `quantization` — weights exact; `llama_cpp_version` and `llama_cpp_build_info` — runtime reconstructs; `cuda_device_receipt`, `n_gpu_layers_requested`, `n_gpu_layers_offloaded`, `gpu_memory_before_mb`, `gpu_memory_peak_mb`, `gpu_memory_after_mb`, and `cuda_offload_authenticated` — GPU evidence; `generation_config` and `random_seeds` — decoding replays; `preregistered_panel` and `family_counts` — coverage frozen; `row_manifest_path` and `raw_response_hashes` — output lossless; `missing_row_count` and `parse_failure_count` — failures visible; `exact_validator_versions` and `validator_disagreement_count` — labels authoritative; `shadow_prefix_hash`, `sealed_suffix_hash`, and `stream_root_commitment` — chronology immutable; `headline_model_count` — denominator honest; `sota_canary_ready_score` — gate scalar; `legacy_smoke_only=true`, `native_json_grammar_used=false`, and `external_scorer_used=false` — closed paths stay closed; `inference_substrate=local_llama_cpp_python_cuda_gguf` — execution declared; `reproducibility_checksum` — replay; `honest_verdict` — starts `complete:` or `blocked:`.
      REQUIRED GATE SCALAR: `cuda_offload_authenticated_score` — emit `1.0` only when `cuda_offload_authenticated=true` has positive layer and memory receipts, otherwise `0.0`.
      9. Run model-resolution, CUDA-authentication, validator, commitment, schema, adversarial, spec-coverage, and root-clutter tests. Release GPU resources on all paths.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

