    title: "Live GGUF Pipeline Smoke: Ensemble v9 End-to-End on Real Model Outputs"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: integration

    prior_failures:
      - experiment_id: exp443-eorm-jepa-live-data
        verdict: "complete: JEPA AUC improved 0.457→0.571 on 57 real FoVer-labeled CoT steps"
        addressed_by: "exp443 ran the EORM+JEPA pipeline on live GPU data in .447 era. This runs ensemble v9 (incorporating real-corpus tier0s/tier0u, Tier 0z) on outputs from a locally-cached SOTA GGUF model — a different ensemble and different model family. Goal is to validate that ensemble v9 works on real GGUF outputs, not FoVer corpus pairs."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Ensemble v9 has been evaluated on FoVer corpus (exp2622) and external benchmarks (exp2623).
      But FoVer is a labeled (context, claim) corpus — not real GGUF model outputs. This task
      validates that ensemble v9 correctly scores the outputs from a locally-cached SOTA GGUF model.

      SOTA models (CLAUDE.md mandate — must use at least one):
      1. unsloth/Qwen3.6-35B-A3B-GGUF (~Q4 quant, ~20GB)
      2. unsloth/gemma-4-31B-it-GGUF (~Q4 quant, ~18GB)
      3. unsloth/gemma-4-26B-A4B-it-GGUF (~Q4 quant, ~15GB)

      This task generates 20 test inputs, runs them through the locally-cached model (if available),
      and runs ensemble v9 on the outputs. If no SOTA model is cached, use Qwen3.5-0.8B-GGUF as
      a CPU smoke-test (NOT for headline results).

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline)
      - python/carnot/verify/ (ensemble v9 components)
      - scripts/experiment_template.py (cached_sota_pair() pattern)

      TASK: End-to-end pipeline smoke test with GGUF model outputs.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         b. Check for cached SOTA models (in priority order):
            - `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/` (non-empty)
            - `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF/` (non-empty)
            - `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/` (non-empty)
            - `ls ~/.cache/huggingface/hub/models--Qwen--Qwen3.5-0.8B-GGUF/` (CPU fallback only)
            Record which model is available as model_used.
         c. `command -v llama-cli || ls {project_root}/llama.cpp/llama-cli` succeeds.
            If llama.cpp not available: check for Python llama_cpp: `python -c "import llama_cpp"`.
            If neither: write honest_verdict blocked_llama_cpp_not_available; exit.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Generate 20 test prompts: 10 factual questions (expect correct responses) +
         10 misleading questions designed to induce hallucination (e.g., "What year did X happen
         (incorrect premise)?"). Log prompts_generated=True.

      2. Run model inference (if SOTA model cached; skip inference if CPU fallback only):
         WALL-CLOCK MINIMUM: GGUF model loading takes >= 30s for any model > 1B.
         For each prompt: llama-cli --model <model_path> --prompt "<prompt>" -n 50
         Record response text, inference_mode ('live_gguf' or 'cpu_smoke_only').

      3. For each (prompt, response) pair:
         - Construct (context=prompt, claim=response) for ensemble scoring
         - Run ensemble v9: score = pipeline.score(context, claim) (via VerifyRepairPipeline)
         - Record (score, inference_mode)
         Compute: mean_score, score_std, verification_rate (fraction flagged as hallucination).

      4. Compute pipeline_e2e_latency_mean_s = mean wall-clock time per (prompt → verify) cycle.
         Target: pipeline_e2e_latency_mean_s < 30.0.

      5. Write results/experiment_2630_gguf_pipeline_smoke.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - model_used: str — which SOTA model was available ('Qwen3.6-35B-A3B-GGUF', 'gemma-4-31B-it-GGUF', etc.) or 'cpu_smoke_fallback'
        principle: "CLAUDE.md mandate: at least one SOTA GGUF or documented CPU fallback."
      - inference_mode: str — 'live_gguf' or 'cpu_smoke_only'
        principle: "live_gguf = real GPU inference; cpu_smoke_only = not a headline-eligible result."
      - n_prompts: int — number of prompts tested (target: 20)
        principle: "Statistical minimum for pipeline latency measurement."
      - pipeline_e2e_latency_mean_s: float — mean verify latency per example
        principle: "Target < 30s; > 30s indicates a pipeline bottleneck to fix before deployment."
      - verification_rate: float — fraction of examples flagged by ensemble v9
        principle: "Expected ~0.5 on mixed corpus; 0.0 or 1.0 would suggest a degenerate verifier."
      - random_seed: 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "GGUF model inference >= 30s per example; total >= 600s for 20 examples."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records model cache check and llama.cpp availability."

      Run: `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"`.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2631
