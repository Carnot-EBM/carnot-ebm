  - id: exp4291-arcgen-cross-generator-nondegenerate
    milestone: 2026.06.397
    title: "PHASE A1 (THE HEADLINE; P0 oracle-distinct frontier) -- CLOSE the cross-GENERATOR axis with a NON-degenerate ARC-GEN pool. .395 proved the oracle-distinct verifier-beats-vote win generalizes across families CARVED FROM ONE POOL (exp4271 +0.40 held-out, leak-free, 5-seed). The .396 ARC-GEN 2nd-substrate attempt (exp4282) was FLAGGED DEGENERATE: the pool was wrong-majority-only (vote@1=0.0 structural) with 4 candidates/task (correct trivially separable -> set_encoder@1=1.0), giving a meaningless +1.0 CI[1.0,1.0] that measures pool degeneracy, NOT cross-generator transfer (audit: docs/research-notes/exp4282-arcgen-degenerate-audit-2026-06-16.md). The cross-GENERATOR axis -- whether the verifier transfers to a CONSTRUCTION-DISJOINT generator -- is the LAST open axis of the selection moat. REBUILD a NON-degenerate ARC-GEN pool (arXiv:2511.00162, github.com/google/ARC-GEN; gitignore the clone): realistic candidate counts (NOT wrong-majority-only -- include tasks where vote CAN win), report vote@1 well above 0 and an oracle ceiling BELOW 1.0 (headroom the verifier must EARN). Train the set-encoder on train-generators; test beats-vote on HELD-OUT generators. Report per-substrate lift SEPARATELY (original-ARC / ARC-TGI / ARC-GEN). Emit cross_generator_holds BARE bool := (held-out ARC-GEN delta>0 AND CI95-excl-0 AND vote_at_1>0.05 AND oracle_at_k<1.0 AND delta<0.95 -- the non-degenerate guards). verifier_is_oracle=false. HARD-CAP to the window; an honest partial pool (>=5 generators, >=~12 held-out tasks/fold) is fine."
    priority: critical
    track: verifier-oracle-distinct
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-14 P0 MANDATORY (oracle-distinct frontier: a learned verifier capturing ARC-class headroom where execution is NOT the oracle, matched control, CI95-excl-0) + the 2026-06-16 outer-loop degenerate audit recommendation (rebuild a NON-degenerate ARC-GEN pool) -- false-positive scope-match vs the .396 ARC-GEN attempt (exp4282, FLAGGED degenerate) / the .395 cross-family test (exp4271, SUCCEEDED) / retired GAP-3 content-EBM lineage; forward difference = a NON-degenerate pool construction (realistic candidate counts, vote@1>0, oracle<1.0) that makes the cross-GENERATOR test FAITHFUL where exp4282's degenerate pool could not. verifier_is_oracle=false."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4291_arcgen_cross_generator_nondegenerate.json
    prior_failures:
      - experiment_id: exp4282-arcgen-cross-family-stress
        verdict: complete_arcgen_cross_family_generalizes_FLAGGED_degenerate_separation
        addressed_by: "exp4282 reported +1.0 CI[1.0,1.0] but was FLAGGED DEGENERATE_SEPARATION: the pool was wrong-majority-only (vote@1=0.0 structural) with only 4 candidates/task (correct trivially separable). This attempt rebuilds a NON-degenerate pool -- realistic candidate counts INCLUDING tasks where vote can win (vote@1>0.05), with an oracle ceiling BELOW 1.0 -- so the cross-generator delta measures genuine transfer, not pool degeneracy. The non-degenerate guards (vote_at_1>0.05 AND oracle_at_k<1.0 AND delta<0.95) are gate conditions, so a recurrence of the degenerate pattern fails the gate rather than passing as a fake win."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: the LAST open axis of the selection moat. The .395 oracle-distinct win (exp4271 +0.40 held-out,
      leak-free, 5-seed) generalized across families YOU carved from ONE pool. A skeptic's only remaining critique:
      "that's your partition." ARC-GEN (arXiv:2511.00162; github.com/google/ARC-GEN, Moffitt/Google) is an
      INDEPENDENT mimetic procedural generator covering all 400 ARC-1 + 500 ARC-2 tasks, each with a native family
      id -- a construction-disjoint 2nd substrate. The .396 ARC-GEN test (exp4282) FAILED because the pool was built
      DEGENERATE (wrong-majority-only -> vote@1=0.0; 4 candidates -> correct trivially separable -> +1.0). The fix is
      the POOL CONSTRUCTION, not the substrate: build a pool with realistic candidate counts INCLUDING tasks where
      vote CAN win, report vote@1 well above 0 and oracle<1.0 (real headroom). adversarial_verify will gain a
      DEGENERATE_SEPARATION check (exp4297) -- so a degenerate pool will be FLAGGED, not silently pass.

      EXISTING CODE TO READ FIRST:
        - docs/research-notes/exp4282-arcgen-degenerate-audit-2026-06-16.md (WHY exp4282 was degenerate + the fix spec)
        - results/experiment_4282_arcgen_cross_family_stress.json + results/experiment_4282_arcgen_family_manifest.json (the degenerate pool to NOT repeat; the family-manifest schema to reuse)
        - results/experiment_4271_arc_cross_family_transfer_existing_pool.json (the GENUINE within-pool win: vote 0.25 / verifier 0.69, delta +0.40 -- the believable shape to match)
        - results/experiment_4244_arc_set_encoder_aggregator_build.json + _model.json (the set-encoder to retrain per generator-split)
        - python/carnot/agentic/arc_agi3_world_model.py (the explore-induce-verify solver, if candidate generation is needed)
        - scripts/exp_verifier_detector_auroc.py, scripts/adversarial_verify.py, scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "No embedded-repo gitlinks" (gitignore the clone), "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: build a NON-degenerate ARC-GEN cross-generator pool; run the held-out-generator beats-vote gate; report per-substrate lift.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any analysis):
           a. `git clone https://github.com/google/ARC-GEN` into a GITIGNORED path (e.g. external/ARC-GEN/ -- add to
              .gitignore FIRST so git add -A cannot swallow it as a mode-160000 gitlink). If the clone fails (network)
              AND no cached ARC-GEN exists -> honest_verdict `blocked_arcgen_unavailable` and STOP.
           b. The set-encoder + the .395 manifest load. CPU sufficient; no GGUF/GPU.
        1. Generate a NON-degenerate candidate pool from ARC-GEN generators: each row carries a NATIVE family_id +
           exact target_hash + source_kind=arcgen. CRITICAL anti-degeneracy: do NOT filter to wrong-majority-only --
           include tasks where the vote CAN win, and use realistic candidate counts (not a trivially-separable 4).
           Target a pool whose vote@1 is well above 0 and whose oracle@K is below 1.0. HARD-CAP generators x tasks x
           candidates to fit the window; an honest partial pool with >=5 ARC-GEN generators and >=~12 held-out
           tasks/fold is fine. Persist the pool + manifest.
        2. Train the set-encoder on train-generators; on HELD-OUT ARC-GEN generators compute set_encoder@1, vote@1,
           oracle@K, matched control. Report cross_generator_delta + task-level bootstrap CI95 (>=2000 resamples) +
           held_out_generator_n. Report original-ARC and ARC-TGI held-out reads SEPARATELY from ARC-GEN (do NOT pool).
        3. Emit cross_generator_holds BARE bool := (ARC-GEN held-out delta>0 AND CI95-excl-0 AND vote_at_1>0.05 AND
           oracle_at_k<1.0 AND delta<0.95 -- ALL non-degenerate guards). Run adversarial_verify.py (clean;
           verifier_is_oracle=false; the new DEGENERATE_SEPARATION check from exp4297 must NOT fire). Declare
           random_seed + reproducibility_checksum + model_specs (the ARC-GEN provenance + the NON-degenerate pool
           construction + the generator-disjoint split).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A faithful cross-generator survive (win transfers to construction-disjoint generators), a collapse (win was partition-specific), a degenerate-guard trip, and an honest blocked-clone are ALL COMPLETE and decision-grade."
        cross_generator_holds:
          principle: "BARE bool: the capstone reads this as the cross-GENERATOR verdict (gated-fields-must-be-bare); true iff held-out-generator set_encoder@1 - vote@1 > 0 AND CI95-excl-0 AND the non-degenerate guards pass -- closes the single-partition critique honestly."
        cross_generator_delta:
          principle: "BARE float: set_encoder@1 - vote@1 on held-out ARC-GEN generators -- compare to the .395 within-pool +0.40 (a similar delta on a NON-degenerate pool hardens the moat to cross-generator)."
        vote_at_1:
          principle: "BARE float: the vote baseline on held-out generators -- MUST be > 0.05 (if it is 0, the pool is wrong-majority-only and the delta is a degenerate artifact, NOT transfer)."
        oracle_at_k:
          principle: "BARE float: positive-control ceiling on held-out generators -- MUST be < 1.0 (if it is 1.0 the correct answer is trivially separable; real headroom requires a sub-1.0 ceiling the verifier must earn)."
        per_substrate_delta:
          principle: "The lift reported SEPARATELY on original-ARC / ARC-TGI / ARC-GEN -- guards the generators-become-their-own-distribution failure mode (a win only on generator data is weaker than one that holds on original ARC)."
        held_out_generator_n:
          principle: "BARE int: number of held-out ARC-GEN generators -- the cross-generator OOD breadth; report with held_out_task_n for power."
        verifier_is_oracle:
          principle: "BARE bool=false -- learned set-encoder over an independent procedural-generator pool, no demo execution."
        random_seed:
          principle: "Determinism precondition; the ARC-GEN sampling + generator-split reproducible."
        reproducibility_checksum:
          principle: "Hash of the ARC-GEN pool + generator manifest; lets a third party re-run."
        model_specs:
          principle: "The ARC-GEN generator provenance + the NON-degenerate pool construction + the generator-disjoint split protocol; required methodology."
      ACCEPTANCE GATE:
        - condition: "cross_generator_holds + cross_generator_delta + vote_at_1 + oracle_at_k + per_substrate_delta + held_out_generator_n reported AND verifier_is_oracle=false AND the pool is non-degenerate (vote_at_1>0.05 AND oracle_at_k<1.0), OR an honest blocked_/collapse verdict"
          principle: "A faithful (non-degenerate) cross-generator replication closes the LAST open axis of the selection moat; a collapse scopes the headline to within-pool; a degenerate guard-trip means rebuild the pool (all decision-grade, none churn)."

      Run: `python3 {project_root}/results/experiment_4291_arcgen_cross_generator_nondegenerate.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

