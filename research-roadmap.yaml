- id: exp1134-kv260-v4-parameter-tuning
  milestone: 2026.04.88
  deliverable: results/experiment_1134_kv260_v4_parameter_tuning.json
  title: "KV260 Ising Sampler v4 — Beta/Alpha Self-Adaptive Parameter Tuning"
  model: opus
  max_turns: 40
  estimated_wall_time_min: 35
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1122-kv260-v4-python-sim
      verdict: v4_kl_above_threshold
      addressed_by: "Wider parameter sweep: beta=2.0-5.0 (was only 2.0), alpha=0.02-0.3 (was 0.1-only). Adding self-adaptive Lagrange penalty coefficient update from arXiv 2501.04971 (updates lambda based on constraint violation measurements, avoids manual tuning). If KL still above 0.05, documents exact parameter space boundary and whether any combination reaches KL<0.05."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Exp 1122 Python simulation of KV260 v4 Ising sampler showed KL=0.134 at best (alpha=0.1,
    beta=2.0). The v4 design has sparse K=16 connectivity + EMA inertia. KL threshold is 0.05.
    The board is reachable at 192.168.51.98 but no Vivado means no hardware synthesis.

    From exp1122 artifact:
    - kl_v4_best: 0.134
    - kl_v4_threshold: 0.05
    - kl_v4_below_threshold: False
    - best_alpha_ema: 0.1
    - hardware_board_reachable: True

    Approach from arXiv 2501.04971 (self-adaptive Ising machines): instead of manual beta/alpha
    sweep, implement a self-adaptive λ update rule that automatically tunes penalty coefficients
    based on constraint violation measurements. The update: λ += η × violation_count after each
    Gibbs sweep (η=0.01 default). This converges to the optimal λ for the current topology.

    EXISTING CODE TO READ FIRST:
    - hardware/kv260/ising_sampler_v4.v (read v4 RTL spec to confirm inertia and sparse fields)
    - hardware/kv260/ising_sampler_v4_spec.md (read design constraints and alpha/beta ranges)
    - results/experiment_1122_kv260_v4_python_sim.json (read alpha_sweep_runtime_s and method)
    - scripts/experiment_1122_kv260_v4_python_sim.py (if exists, read simulation code)

    TASK:
    1. Read v4 Python simulation from exp1122.
    2. Add self-adaptive λ update from arXiv 2501.04971:
       - After each Gibbs sweep, count constraint violations in the current spin configuration
       - λ += 0.01 × n_violations (drives system toward satisfying constraints)
       - Run 500 sweeps; record λ trajectory and KL at each 50-sweep checkpoint
    3. Parameter sweeps:
       a. Beta sweep: [2.0, 3.0, 4.0, 5.0] at fixed alpha=0.1
       b. Alpha sweep: [0.02, 0.05, 0.1, 0.15, 0.2, 0.3] at best beta from (a)
       c. Combined: best_beta × best_alpha from (a) and (b)
    4. Report minimum KL achieved and corresponding parameters
    5. If KL < 0.05 achieved: kv260_v4_kl_below_05=True, record parameters
    6. If KL > 0.05 at all parameters: document the feasibility boundary:
       "KL < 0.05 is not achievable at beta ≤ 5.0 and alpha ≤ 0.3 for this topology"
       and estimate: "at what beta would KL < 0.05 be expected?" (extrapolate from trend)
       Update hardware/kv260/ising_sampler_v4_spec.md with the empirical feasibility limit.

    CONCRETE STEPS:
    - cat hardware/kv260/ising_sampler_v4_spec.md | head -50
    - python3 scripts/experiment_1134_kv260_v4_parameter_tuning.py

    REQUIRED ARTIFACT FIELDS:
    - kl_v4_prior: 0.134
    - kl_v4_best: float (best KL achieved in this run)
    - kl_v4_below_05: bool (True if best KL < 0.05)
    - best_beta: float
    - best_alpha: float
    - self_adaptive_lambda_applied: bool
    - kl_v4_with_self_adaptive: float (KL when self-adaptive λ is used)
    - parameter_space_mapped: bool (True if beta sweep + alpha sweep both run)
    - kv260_v4_kl_below_05_or_feasibility_documented: bool (always True)
    - feasibility_notes: str (if KL > 0.05, what would be needed to achieve it)
    - honest_verdict: "kl_below_threshold" | "kl_improved_not_below_threshold" | "kl_unchanged_parameter_space_mapped" | "self_adaptive_lambda_helped"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1134_kv260_v4_parameter_tuning.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

