- id: exp841-symcode-paragraph-batching
  milestone: 2026.04.64
  deliverable: results/experiment_841_symcode_paragraph_batching.json
  title: 'Exp 841: SymCodeVerifier Paragraph Batching (RETRO-SYMCODE-SERIAL, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-SYMCODE-SERIAL (opened milestone .63): SymCodeVerifier processes
    multi-paragraph responses one paragraph at a time, each as a separate exec() call
    (~50ms each). For Exp 627-style responses with 10+ paragraphs, this is 500ms+ total.
    Batch processing: collect all arithmetic expressions from all paragraphs in one pass,
    evaluate in a single exec() call with shared namespace. This eliminates redundant
    module imports (math, re) and namespace initialization per paragraph.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier.verify() implementation
    - openspec/capabilities/pipeline/spec.md — REQ-VERIFY entries
    - tests/python/test_symcode_verifier.py — existing tests to maintain

    TASK: Add SymCodeVerifier.batch_verify(paragraphs) method. Measure latency improvement.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. In python/carnot/pipeline/symcode_verifier.py, add:
       def batch_verify(self, paragraphs: list[str]) -> SymCodeBatchResult:
         '''Verify all paragraphs in a single exec() call. Faster than N serial verify() calls.'''
         a. Collect all arithmetic expressions from all paragraphs with one regex scan.
         b. Build a single exec_script with all expressions in one shared namespace.
         c. Run once with exec() / eval() + timeout.
         d. Map results back to per-paragraph violation flags.
         e. Return SymCodeBatchResult(per_paragraph_results, total_violations, batch_latency_ms).
    3. Add SymCodeBatchResult dataclass:
       @dataclass
       class SymCodeBatchResult:
           per_paragraph_results: list[SymCodeResult]
           total_violations: int
           batch_latency_ms: float
           n_paragraphs: int
    4. Add to openspec/capabilities/pipeline/spec.md:
       REQ-VERIFY-145: SymCodeVerifier.batch_verify() MUST process N paragraphs in a single
       exec() call, avoiding N separate exec() invocations. Latency for 10 paragraphs MUST
       be < 2× single paragraph latency (not N× single paragraph latency).
       SCENARIO-VERIFY-173: 10-paragraph response; batch_verify latency < 2× single paragraph;
       violations detected same as N separate verify() calls.
    5. Create scripts/experiment_841_symcode_paragraph_batching.py using ExperimentTemplate(841).
       ExperimentTimeoutWatchdog(841, timeout_minutes=20).
       Benchmark:
         a. 10 synthetic paragraphs with 1-2 arithmetic expressions each.
         b. Measure latency_single: N serial verify() calls.
         c. Measure latency_batch: single batch_verify() call.
         d. Compute speedup = latency_single / latency_batch.
         e. Verify: same violations detected in both modes.
       Write results/experiment_841_symcode_paragraph_batching.json with:
       latency_single_ms, latency_batch_ms, speedup, violations_match, n_paragraphs,
