        - prevents collapse but degrades real quality -> "complete: conservative_default_beta_prevents_collapse_but_degrades_real_quality_on_nondegenerate_corpus_needs_tuning"
        - cannot assemble corpus -> "complete: blocked_cannot_assemble_nondegenerate_corpus"
