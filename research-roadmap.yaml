  - id: exp3734-fix-harness-and-bounded-train-chunk1
    milestone: "2026.06.342"
    title: "FIX the exp3728 cwd/import false-negative (robust importlib.util.find_spec check + ABSOLUTE artifact paths + run from {project_root}); ship a bounded checkpointed training driver with the EBT-paper stability recipe (random-alpha + replay buffer + Langevin noise + grad-clip + KL-term CD arXiv:2012.01316); run the FIRST bounded chunk (<=1500s) of the tiny EBT + a matched tiny AR baseline on GSM8K, with stability diagnostics, then checkpoint+exit. THESIS-A genuine kill-gate part-(a), run 1."
    priority: critical
    max_turns: 60
    agent_type: claude
    model: opus
    requires_claude: true   # EBT training is finicky; diagnosing/stabilizing divergence + a robust multi-file training driver is open-ended judgment under ambiguity (operator directive 2026-06-02). The most likely failure mode lives here.
    estimated_wall_time_min: 30
    track: phase3
    inference_substrate: live_llm_inference
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3728-bounded-checkpointed-train-ebt-and-ar
        verdict: blocked_ebt
        addressed_by: "exp3728 BLOCKED at 0 steps because its precondition check evaluated ebt_vendored=false (a bare `import carnot.phase3.ebt_upstream` from a bad cwd/sys.path) and smoke_passed=false (a RELATIVE os.path.exists). Both were wrong -- exp3725 importable=true, exp3726 result on disk. This task FIXES the root cause: robust importlib.util.find_spec check, ABSOLUTE artifact paths anchored to {project_root}, run from {project_root}, AND adds the EBT-paper stability recipe (random-alpha + replay + Langevin + grad-clip + KL-term CD) so the genuine training actually runs."
        retire_if_same_verdict: true
    deliverable: results/experiment_3734_fix_harness_and_bounded_train_chunk1.json
    prompt: |
      CONTEXT: Thesis-A genuine kill-gate part-(a), run 1. .341's exp3728 BLOCKED at 0 steps on a
      cwd/import-path bug (ebt_vendored=false though exp3725 proved importable=true; smoke_passed=false via a
      RELATIVE os.path.exists though exp3726's result is on disk). The positive control (exp3726 single-step
      smoke) PASSED. Your job: FIX the harness, then actually train. live gpu training. PRINT A HEARTBEAT
      (PYTHONUNBUFFERED) every few steps so the idle-timeout never fires; bound EACH run to <=1500s wall
      then CHECKPOINT + EXIT (resume on the next run -- training spans runs by design).
      EXISTING CODE TO READ FIRST: scripts/experiment_3728_bounded_checkpointed_train_ebt_and_ar.py (the
      buggy precondition logic at the top -- lines ~22-38); scripts/experiment_3726_tiny_ebt_corpus_and_
      train_step_smoke.py (the WORKING import + corpus + single-step pattern -- copy its import + tokenizer +
      corpus approach); python/carnot/phase3/ebt_upstream/ (the vendored EBT: ebt_core.py, energy path);
      research-references.md (the .342 EBT stability-recipe references).
      PRECONDITIONS (check BEFORE any training step; if ANY missing -> blocked_<resource>, EXIT, no fabrication):
        a. CUDA: `python -c "import torch; assert torch.cuda.is_available() and torch.cuda.device_count()>0"`.
        b. EBT importable -- use a ROBUST check (NOT a bare import from an unknown cwd):
           `python -c "import importlib.util,sys; sys.path.insert(0,'{project_root}/python'); assert importlib.util.find_spec('carnot.phase3.ebt_upstream') is not None"`.
           If this fails -> blocked_ebt_not_importable (and say so honestly -- but it WILL pass; exp3725/3726 prove it).
        c. Corpus: GSM8K train subset reachable (HF datasets) OR a local cache from exp3726. Use an ABSOLUTE
           path anchored to {project_root} for any on-disk check -- the exp3728 bug was a relative path.
      CONCRETE STEPS:
        1. Ship the FIX: a training driver that (i) inserts {project_root}/python on sys.path, (ii) uses
           importlib.util.find_spec for the EBT-vendored precondition, (iii) uses ABSOLUTE paths
           (os.path.join(PROJECT_ROOT, 'results', ...)) for every artifact existence check. Run from
           {project_root}. This is the headline lesson of the .341 false-negative -- get it right.
           CRITICAL: scripts/experiment_3728_*.py's training BODY was a `time.sleep(1)` MOCK that
           hard-coded cumulative_steps_trained=100, ebt_loss_curve=[5.0,4.5,4.0], peak_vram_mb=4500,
           duration_s=1500.0 (with a comment bypassing the short-duration check) -- a FABRICATION stub the
           cwd bug accidentally prevented from running. DELETE that mock body entirely. Write a REAL
           training loop (actual forward -> energy/loss -> backward -> optimizer.step on cuda:0). Do NOT
           reuse any hard-coded loss/VRAM/duration values; every reported number must come from the real run.
        2. Init the tiny EBT (~38M, the exp3726 config: dim=768, n_layers=4, n_heads=12, utf8 byte tokenizer)
           AND a matched-param tiny AR baseline (same param band, same corpus, same optimizer budget).
        3. Apply the EBT-paper STABILITY RECIPE (arXiv:2507.02092 Sec 3.3 + App I; arXiv:2012.01316):
           replay buffer, Langevin noise during energy descent, RANDOMIZE step-size alpha AND the number of
           descent steps per batch (load-bearing per the paper's ablation), clamp optimization gradients,
           normalize data, and the KL-term CD fix. Record which stabilizers you enabled.
        4. Train the FIRST bounded chunk (<=1500s wall OR a fixed step budget, whichever first) of BOTH
           models on the SAME corpus. Log a loss heartbeat every K steps. Emit STABILITY DIAGNOSTICS: the
           (downsampled) EBT + AR loss curves, whether energy/loss is converging or diverging, any NaN/inf
           events, gradient-norm trend, peak VRAM. If the EBT diverges, apply the stabilizers and record
           what was tried (this judgment is why this task is on claude).
        5. CHECKPOINT both models + optimizer state + step counter to an ABSOLUTE path, record
           cumulative_steps_trained (emit it as a BARE int -- exp3735 gates on it), then EXIT cleanly.
        6. If you add any test, it MUST assert against the driver's REAL behavior -- never ship a test that
           fails against your own script (anti-poison-test: a failing shipped test poisons the conductor
           pre-test gate and SKIPs the whole milestone).
      INFERENCE-SUBSTRATE HYGIENE: live GPU training; full methodology (random_seed, reproducibility_checksum,
      model_specs naming BOTH tiny configs as from-scratch, not pretrained LLMs). Long real duration expected.
      Run `python scripts/adversarial_verify.py <artifact>`; confirm no critical flag.
