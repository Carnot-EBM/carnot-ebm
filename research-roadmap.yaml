  - id: exp2805
    milestone: "2026.05.265"
    deliverable: "results/experiment_2805_cross_corpus_verifier_analysis.json"
    title: "Cross-Corpus Per-Verifier Dual-Condition Discriminative Matrix"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 30
    track: analysis
    requires:
      - exp2802.condition_a_production_auroc_mean
      - exp2802.condition_b_architecture_only_auroc_mean
      - exp2803.condition_a_production_auroc_mean
      - exp2803.condition_b_architecture_only_auroc_mean
      - exp2804.condition_a_production_auroc_mean
      - exp2804.condition_b_architecture_only_auroc_mean
      - exp2807a.condition_a_auroc_mean
      - exp2807a.condition_b_auroc_mean
    prompt: |
      Read CLAUDE.md.

      CONTEXT: with exp2802 (MBPP), exp2803 (TruthfulQA), exp2804
      (HumanEval) artifacts produced, this task synthesizes a per-
      verifier matrix showing which verifiers transfer across corpus
      shapes and which are corpus-specific. Expected finding: Tier 0s
      (arithmetic-consistency heuristic per its honest docstring) will
      contribute on FoVer + parts of HumanEval+MBPP but near-zero on
      TruthfulQA factuality.

      TASK: Build a verifier × corpus × condition AUROC matrix and
      identify transfer patterns + memory-dependence patterns.

      OPERATOR DIRECTIVE 2026-05-21: matrix must be 3-D — rows =
      verifiers, columns = corpora (FoVer / MBPP / TruthfulQA /
      HumanEval), and EACH corpus has TWO conditions (architecture-
      only vs production). This makes the FR-11 self-learning
      contribution visible per-verifier per-corpus.

      CONCRETE STEPS:
        1. Load exp2802, exp2803, exp2804, exp2807a artifacts (each
           has per_verifier_condition_a_auroc + per_verifier_condition_b_auroc).
        2. Build dual matrix: verifier × corpus, separately for each
           condition. Then compute per-cell learning-contribution =
           A_cell - B_cell.
        3. Identify FOUR verifier classes:
           - ARCHITECTURE_TRANSFER: condition-B AUROC ≥ 0.75 on ALL
             corpora. The true cross-corpus workhorses.
           - MEMORY_AUGMENTED: condition-A AUROC ≥ 0.75 but condition-B
             AUROC < 0.65 on FoVer (or original training corpus).
             These verifiers carry the production headline but ARE
             contaminated by self-learning.
           - CORPUS_SPECIFIC: high on one corpus, near-random on others
             regardless of condition. e.g. Tier 0s (arithmetic-only).
           - LOW_SIGNAL: AUROC < 0.65 across all corpus×condition cells.
             Candidates for retirement.
        4. Surface diversity gap on each non-FoVer corpus: how many
           ARCHITECTURE_TRANSFER verifiers cover it?

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:'
          principle: "Terminal prefix."
        - verifier_corpus_dual_matrix: dict[verifier_id, dict[corpus, {production, architecture_only, delta}]]
          principle: "Full 3-D matrix; downstream paper-v6 §5 dual-condition table."
        - architecture_transfer_verifiers: list[str]
          principle: "Verifiers with condition-B AUROC >= 0.75 on ALL corpora — the cross-corpus workhorses, paper-v6 §5 headline."
        - memory_augmented_verifiers: list[str]
          principle: "Verifiers where production AUROC is high but architecture-only is low — FR-11 carries them. Must be disclosed in §5.1."
        - corpus_specific_verifiers: list[str]
          principle: "Verifiers that work on one corpus shape only (e.g. Tier 0s on arithmetic). Acceptable as cheap pre-filters but not headline contributors."
        - low_signal_verifiers: list[str]
          principle: "AUROC < 0.65 across all cells — retirement candidates."
        - diversity_gap_on_non_fover: bool
          principle: "True if fewer than 3 architecture-transfer verifiers cover each non-FoVer corpus — signals need for new diverse verifiers."
        - duration_s: float
          principle: "Pure analysis; expected 30-180s (no model inference)."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2806
    milestone: "2026.05.265"
    deliverable: "results/experiment_2806_verifier_energy_redirect_v6.json"
    title: "Verifier FoVer Redirect v6: Live-GPU Slow-Path Validation"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 50
    track: research

    prior_failures:
      - experiment_id: exp2727
        verdict: "complete: diagnosed zero-energy fast-path and added logging"
        addressed_by: "exp2727 diagnosed the Tier 0s short-circuit; subsequent v2/v3/v4/v5 chain was blocked or produced zero-energy due to other issues. The 2026-05-21 audit confirmed Tier 0s as an arithmetic-only heuristic (now disclosed in docstring); this v6 measures slow-path verifiers (KAN, Z3, semantic-consistency) DIRECTLY on FoVer + the three new corpora, bypassing Tier 0s entirely."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md, especially the "Verifier Authenticity Discipline"
      that shipped 2026-05-21.

      CONTEXT: exp2727 (.259) diagnosed the Tier 0s fast-path returning
      0.0 for non-arithmetic inputs. The .260+ v2-v5 chain produced
      blocked / zero-energy artifacts. The 2026-05-21 deep audit
      confirmed Tier 0s is an arithmetic-consistency heuristic by
      design (docstring updated). The remaining question: do the
      OTHER verifiers in the ensemble (KAN, Z3, semantic-consistency,
      AST) have similar fast-path-zero issues?

      TASK: Run each non-Tier-0s verifier in the ensemble against
      both FoVer and a small held-out non-arithmetic set; record per-
      verifier energy distribution.

      CONCRETE STEPS:
        0. PRECONDITIONS: CUDA available, model cached, FoVer corpus
           available. Record preconditions_checked.
        1. Pick 100 FoVer step pairs + 100 TruthfulQA Q&A pairs.
        2. For each non-Tier-0s verifier in the ensemble, score all
           200 inputs.
        3. Report energy distribution (mean, std, n_zeros) for each
           verifier × corpus shape.
        4. If any verifier returns 0.0 for >50% of TruthfulQA inputs,
           flag it as a likely arithmetic-only-shape verifier.
        5. Write artifact.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' (or 'blocked_*')
          principle: "Terminal prefix."
        - verifiers_tested: list[str]
          principle: "Names exactly which verifiers were probed."
        - per_verifier_energy_distribution: dict[verifier_id, {fover: {mean, std, n_zeros}, truthfulqa: {mean, std, n_zeros}}]
          principle: "Distributional summary identifies dead verifiers on non-arithmetic inputs."
        - suspected_shape_specific_verifiers: list[str]
          principle: "Anti-fabrication: lists verifiers with >50% zero-energy on TruthfulQA — same class of issue as Tier 0s, surfaced for operator review."
        - duration_s: float (expected ≥ 600s for 200 examples × N verifiers)
          principle: "Real compute takes wall-time."
        - preconditions_checked: list
          principle: "Anti-fabrication."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2807a
    milestone: "2026.05.265"
    deliverable: "results/experiment_2807a_fover_memory_leakage_isolation.json"
    title: "FoVer Memory-Leakage Isolation: AUROC With vs Without FR-11 Self-Learning State"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 50
    track: research
    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline" and
      "Adversarial Artifact Verification + Sample-Size Rigor".

      CONTEXT (2026-05-21 operator hypothesis): "could it be that the
      self-learning has internalized the entire FoVer set having seen
      it repeatedly and used that between runs?" Investigation
      confirmed multiple FR-11 self-learning state files persist FoVer-
      derived patterns across runs:
        - results/nexus_constraint_memory_v2.json (FoVer violation patterns)
        - data/constraint_templates_*.json (constraint templates)
        - data/fr11_ssd_training_v3.jsonl (FR-11 SSD training data)
        - data/fr11_zenil_distill_v2.jsonl (FR-11 Zenil distillation)
        - in-memory state via python/carnot/pipeline/{session_memory,
          cross_session_relay, self_learning_replay,
          query_time_memory_policy}.py
      The headline AUROC=0.9857 (exp2546) was an aggregator-of-cached-
      scores with 15ms wall time and 3/5 seeds saturated at 1.0 — the
      methodology gap compounds the leakage risk.

      TASK: Run the production verifier ensemble v7b against FoVer
      under two memory conditions and report the delta:
        Condition A: WITH full FR-11 self-learning state loaded
                     (current production config)
        Condition B: WITH all FR-11 self-learning state RESET
                     (architecture-only verification)

      Delta = condition_a_auroc - condition_b_auroc

      If delta > 0.05, self-learning leakage is a substantial
      contributor to the headline. If delta < 0.02, leakage is
      minimal and the architecture carries the AUROC.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `python3 -c "import torch; assert torch.cuda.is_available()"`
           b. `test -f data/fover_corpus.jsonl`
           c. `test -f results/nexus_constraint_memory_v2.json`
           d. Qwen3.6-35B-A3B-GGUF cached
           Record preconditions_checked.

        1. Identify ALL FR-11 state files; document SHA256, byte size.

        2. Condition A — production config:
           Load FoVer test set (n=1000 random subset, seed=42).
           Run ensemble v7b with all FR-11 state available.
           Record per-verifier scores + ensemble AUROC.

        3. Condition B — memory reset:
           Move FR-11 state files to /tmp/fr11_state_backup/ (NON-
           destructive — restore at end).
           Restart Python interpreter to clear in-memory state.
           Reload verifier ensemble; confirm import-time logs show NO
           NEXUS / constraint-template / session-memory loaded.
           Run on the SAME FoVer subset, same input order.
           Record per-verifier scores + ensemble AUROC.

        4. Repeat (2)-(3) for 5 seeds (42, 137, 271, 314, 1729).

        5. Restore FR-11 state from /tmp/fr11_state_backup/. Confirm
           SHAs match original. Verify with a smoke-test run that
           verifier ensemble loads NEXUS rules correctly.

        6. Compute condition-A and condition-B AUROC mean ± std.
           Compute delta = mean_A - mean_B.

        7. Per-verifier delta — which verifiers degrade most without
           memory? (This identifies which verifiers are "memory-
           dependent" vs "architecture-pure".)

        8. Write artifact. Be honest. A non-trivial delta is not a
           failure — it's an honest finding that changes the paper-v6
           narrative ("0.9857 is the production-config AUROC; the
           architecture-only AUROC is X; the gap is FR-11's
           contribution and operates as intended self-learning").

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:'
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - condition_a_auroc_mean: float
          principle: "Production-config AUROC (with FR-11 self-learning state)."
        - condition_a_auroc_std: float
          principle: "Replication noise on production-config across 5 seeds."
        - condition_b_auroc_mean: float
          principle: "Memory-reset AUROC — measures the architecture's actual generalization without self-learning contribution."
        - condition_b_auroc_std: float
          principle: "Replication noise on memory-reset across 5 seeds."
        - leakage_delta: float
          principle: "Direct measurement of self-learning contribution. > 0.05 = substantial; 0.02-0.05 = moderate; < 0.02 = minimal. Naming is neutral — substantial FR-11 contribution is the intended design, but the paper must disclose it."
        - per_verifier_leakage_delta: dict[str, float]
          principle: "Which specific verifiers rely on FR-11 memory vs which are architecture-pure."
        - fr11_state_files: list[{path, sha256, n_bytes}]
          principle: "Names the persisted state that was reset — operator can verify."
        - state_reset_protocol: str
          principle: "Documents HOW memory was reset (move-to-/tmp + interpreter restart)."
        - state_files_restored_sha_match: true
          principle: "Proves FR-11 state was restored to original SHAs after measurement (non-destructive)."
        - n_examples: 1000
          principle: "Sample size."
        - n_seeds: 5
          principle: "Adversarial replication."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism precondition for reproducibility."
        - reproducibility_checksum: str
          principle: "Catches corpus / model / state drift across replications."
        - model_specs: dict
          principle: "Names compute target."
        - duration_s: float
          principle: "Expected >= 3600s for 2 conditions x 5 seeds x N=1000 live inference. Sleep-padding forbidden per CLAUDE.md Verifier Authenticity Discipline."
        - preconditions_checked: list
          principle: "Anti-fabrication."
        - methodology_note: str
          principle: "Honest interpretation of the delta. If delta is large, frame as 'FR-11 self-learning contribution operates as designed, with operator awareness for paper-v6 narrative.' If delta is small, frame as 'architecture carries the headline, FR-11 is supplementary.' Either is publishable; misrepresenting it would not be."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2807
    milestone: "2026.05.265"
    deliverable: "results/experiment_2807_paper_v6_multicorpus_table.json"
    title: "Paper v6 §5: Multi-Corpus Dual-Condition Results Table + Per-Verifier Breakdown"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 30
    track: publication
    requires:
      - exp2802.condition_a_production_auroc_mean
      - exp2802.condition_b_architecture_only_auroc_mean
      - exp2803.condition_a_production_auroc_mean
      - exp2803.condition_b_architecture_only_auroc_mean
      - exp2804.condition_a_production_auroc_mean
      - exp2804.condition_b_architecture_only_auroc_mean
      - exp2807a.condition_a_auroc_mean
      - exp2807a.condition_b_auroc_mean
      - exp2805.verifier_corpus_matrix
    prompt: |
      Read CLAUDE.md, especially "Operator-Only External Publication"
      (this task only PREPARES the table; submission stays operator-only).

      OPERATOR DIRECTIVE 2026-05-21: report BOTH architecture-only and
      production AUROCs in the paper, so the FR-11 self-learning
      contribution is disclosed clearly.

      TASK: Integrate exp2802-2807a results into paper-v6 §5 as a
      dual-condition multi-corpus table.

      CONCRETE STEPS:
        1. Load exp2802 (MBPP), exp2803 (TruthfulQA), exp2804 (HumanEval),
           exp2807a (FoVer leakage isolation), exp2805 (verifier matrix).
        2. Add to docs/arxiv-paper/main.tex §5 results table — DUAL
           CONDITION format:

              Corpus    | N   | Architecture-only AUROC | Production AUROC | Learning Δ | Peer baseline
              FoVer     | 1000| <exp2807a B mean ± std> | <2807a A m±s>   | <Δ>        | HIVE 0.924
              MBPP      | 500 | <exp2802 B m±s>         | <2802 A m±s>    | <Δ>        | <peer>
              TruthfulQA| 817 | <exp2803 B m±s>         | <2803 A m±s>    | <Δ>        | GPT-3 MC1 ~28%
              HumanEval | 164 | <exp2804 B m±s>         | <2804 A m±s>    | <Δ>        | <peer>

           Architecture-only column establishes the naive baseline.
           Production column shows the deployed system. Learning Δ
           column makes the FR-11 contribution explicit and auditable.

        3. Add §5.1 subsection "Self-Learning Contribution Disclosure":
           Document that the production-config AUROC includes the
           contribution of FR-11 accumulated state (NEXUS rules,
           constraint templates, session memory derived from prior
           FoVer training). Cite exp2807a explicitly. Disclose that
           the architecture-only baseline measures the verifier
           ensemble without any accumulated learning.

        4. Add §5.2 per-verifier breakdown subsection citing exp2805.
           Show which verifiers are architecture-pure (transfer across
           corpora) vs which rely on FR-11 memory (degrade without it).

        5. Run pdflatex; confirm compile success.
        6. Do NOT submit. Update arxiv_ready_v5 flag for operator review.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:'
          principle: "Terminal prefix."
        - paper_v6_compile_success: bool
          principle: "Did pdflatex succeed."
        - corpora_in_table: list[str]
          principle: "Names corpora present in the results table."
        - submission_package_ready: bool
          principle: "True if package is operator-ready; the task itself NEVER submits per Operator-Only External Publication rule."
        - duration_s: float
          principle: "Wall-time; expected 30-120s for pdflatex + edits."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2808
    milestone: "2026.05.265"
    deliverable: "results/experiment_2808_capstone_v265.json"
    title: "Capstone v265: Multi-Corpus Headline Synthesis + Gap Analysis"
    agent_type: claude
    model: sonnet
    max_turns: 100
    track: capstone
    requires_claude: true
    # Justification: cross-artifact synthesis across 4 corpora,
    # per-verifier matrix, paper-v6 narrative implications, and
    # gap-list-for-.266 require multi-file judgment under ambiguity
    # — meets all 3 positive criteria of "requires_claude: true" per
    # CLAUDE.md "Gemini-Default for Experiments".

    prompt: |
      Read CLAUDE.md.

      TASK: Synthesize milestone .265 results into a multi-corpus
      headline narrative. Produce a structured capstone artifact that:
        - Confirms or refutes the FoVer-shape-overfit thesis
        - Identifies which verifiers transfer vs which are corpus-specific
        - Updates the paper-v6 narrative direction
        - Lists gaps for .266 (which deferred corpora to prioritize,
          which non-transferring verifiers need replacement or retirement)
        - Recommends to operator: re-pin headline, or keep FoVer-only
          as primary

      CONCRETE STEPS:
        1. Load all 7 prior task artifacts (exp2801-2807).
        2. Read CLAUDE.md "Verifier Authenticity Discipline" for
           context on the audit thesis that drove this milestone.
        3. Read ops/verifier_authenticity_audit_report.md if present.
        4. Build the multi-corpus narrative honestly. If TruthfulQA
           AUROC came in low, say so. If MBPP transfer worked, say so.
        5. Update ops/status.md with the multi-corpus results.
        6. Write capstone artifact.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:'
          principle: "Terminal prefix."
        - corpora_headline_table: dict[corpus, {n, auroc_mean, auroc_std, peer}]
          principle: "The actual multi-corpus headline."
