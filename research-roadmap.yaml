       simulated data; NOT validated on live GPU; for research exploration only."
    2. Publishes JEPA v23 model (if Exp 825 produced tier35_deployed=True) with cross-domain
       benchmark results from Exp 826.
    3. Publishes IsingConstraintInjector with external field fix (Exp 819) as a standalone
       artifact with example notebook.
    Use SOPS-encrypted HF token from .sops.yaml. NEVER commit plaintext tokens.
    Verify uploads with huggingface_hub.list_models(author="Carnot-EBM").

    EXISTING CODE TO READ FIRST:
    - results/experiment_825_jepa_v23_eval_fr11_tier3.json — tier35_deployed check
    - results/experiment_826_prm_cross_domain_benchmark.json — cross-domain metrics for README
    - results/experiment_819_injection_field_fix.json — retro_injection_closed check
    - python/carnot/inference/jepa_v23.py — model to publish (if tier35_deployed)
    - scripts/sops_helper.py — SOPS token decryption utility
    - openspec/capabilities/pipeline/spec.md — REQ-INFRA entries

    TASK: Update 16 existing model disclaimers, publish JEPA v23 and injection fix artifacts
    if validated, write results/experiment_829_huggingface_v3_publish.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/pipeline/spec.md:
       - REQ-INFRA-061: All HuggingFace model cards for Carnot-EBM MUST include a disclaimer
         section: "Phase 1 research artifact. Trained on simulated data unless explicitly stated
         as live-GPU-validated. Do not use in production without independent validation."
       - SCENARIO-INFRA-070: huggingface_hub.list_models(author="Carnot-EBM") returns >= 17
         models after this experiment (16 existing + >= 1 new). Each model card contains the
         Phase 1 disclaimer.
    3. Create scripts/experiment_829_huggingface_v3_publish.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(829) + ExperimentTimeoutWatchdog(829, timeout_minutes=60).
       c. Load HF token via SOPS: token = sops_helper.decrypt_secret("HF_TOKEN").
