    \ str, cot: str, correct: bool) -> None\n     - flush() -> int: atomic write, returns\
    \ n_pairs written\n   - Test: ci_95_wilson(n=100, p=0.05) returns tuple with width\
    \ < 0.10\n   - Test: CoTPairCollector.flush() writes valid JSON to output_path\n\
    5. Write scripts/experiment_476_live_100q_precision_v4.py:\n   a. apply_env_autofix()\
    \ FIRST\n   b. ExperimentTimeoutWatchdog(476, timeout_minutes=120) as context manager\n\
    \   c. ExperimentTemplate(476, 'Live 100q Precision v4',\n      'results/experiment_476_live_100q_precision_v4.json',\
    \ requires_gpu=True)\n   d. DeliverableGuard('results/experiment_476_live_100q_precision_v4.json')\n\
    \   e. GPUVRAMGate(min_free_gb=8.0, wait_seconds=60).__enter__() — kill zombies,\
