milestone: 2026.06.429
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-23). .428 grew capability 56->57 (A3 banked ft09 L3) but BOTH
  energy-driven GENERATION levers NULLED on live solve-rate: A1 (exp4640) graded is_goal as a live goal-ENERGY
  heuristic failed the uniform-energy ablation (excluded from headline); A2 (exp4641) action-effect ranker->expansion-prior
  showed no_deeper_solve (depth_delta 0, live_multi_level_solve_rate 0.0). This continues the .427 pattern: a GENERATION
  lever crossed the bridge for EFFICIENCY/first-win (0.407->0.591), but NOTHING has crossed for SOLVE-RATE/DEPTH -- the
  multi-level live solve-rate is stuck at 0.0-0.04. Across 2026-06-23 the outer loop FALSIFIED four candidate levers on
  real code/data: macro-action horizon-collapse RETIRED (corpus is breadth/guidance-bound not depth-bound), click-heatmap
  off-centroid generator RETIRED (99.1% of human effective clicks are centroid-covered), just-explore schedule-extraction
  CLOSED (mostly offline replay-overhead artifact), goal-energy heuristic NULL. The wall is LOCALIZED: generation GUIDANCE
  (which action/object, in what order, to chain a 2nd live level-up) -- NOT depth, NOT coverage, NOT exploration schedule,
  NOT representation (cross_game_features_v3 is LOO-AUROC 0.725). .429 attacks it with the two surviving best-motivated
  levers, both on the SCORED E3AgentPolicy, both verifier_is_oracle:false, both live-path-reachable: A1 (HEADLINE; de-risked)
  productionizes the PROVEN compute-cost fix (scipy.ndimage.label, 13ms->0.64ms/node, identical output, AUROC unchanged
  0.725; outer-loop handoff commit 0de16b09e) so the 0.725-AUROC discriminator becomes affordable live, then RAISES
  value_weight off the 0.0 floor (the arc_competition_agent.py:68-78 comment literally prescribes this) and proves the
  value head GUIDES the live search with NO timeout (disambiguating the prior value-head nulls as cost-vs-signal); A2
  (operator energy-config menu #2, the next sequenced generation lever, SOTA-flagged #1 by exp4649) wires energy-as-fitness
  QD/MAP-Elites evolution over action-SEQUENCES (fitness = goal-energy + action-effect cell-recall + efficiency) to GENERATE
  a winner the best-first search never proposed, gated on winner_generated + beating a random-mutation ablation. A3 banks +1
  reproducible level (57->58+) + trains the learned verifier; A4 keeps the package operator-resubmit-ready (>33). Plus
  self-learning persist+transfer (A5), SUBMITTED_AGENT_CONFIG integration (A6), 2 infra (B1 value-routing CI-gate +
  distribution-shift-vs-calibration diagnostic / B2 adversarial_verify QD-ablation + value-routing-cost guards), 1 hardware
  (C), 1 SOTA-ingestion (D), capstone (E). Submission stays operator-only. ARC Prize Milestone #1 deadline is 2026-06-30 (7 days).
milestone_title: 'GENERATION GUIDANCE -- .428 grew capability 56->57 (ft09 L3) but BOTH energy-GENERATION levers NULLED on
  live solve-rate (goal-energy ablation-failed; expansion-prior no-deeper-solve), and a week of outer-loop falsification
  RETIRED macro-depth + click-coverage + just-explore-schedule, LOCALIZING the 0.04 wall to generation GUIDANCE (not depth,
  not coverage, not representation -- cross_game_features_v3 is 0.725 AUROC). .429 takes the two surviving best-motivated
  levers on the SCORED agent: A1 (HEADLINE; de-risked) productionizes the PROVEN compute-cost fix (scipy.ndimage.label,
  13ms->0.64ms/node, identical output, AUROC unchanged) so the 0.725-AUROC discriminator is AFFORDABLE live, raises
  value_weight off the 0.0 floor (the code comment prescribes it), and proves the value head GUIDES the live search with no
  timeout; A2 (operator energy-config menu #2, SOTA-flagged) wires energy-as-fitness QD/MAP-Elites evolution over action
  SEQUENCES to GENERATE a winner the search never proposed (winner_generated gate + random-mutation ablation). Both
  verifier_is_oracle:false, both live-path-reachable. A3 banks +1 (57->58+) + trains the learned verifier; A4 keeps the
  package >33. Plus persist+transfer (A5), SUBMITTED_AGENT_CONFIG integration (A6), 2 infra (B1 value-routing CI-gate +
  dist-shift/calibration diagnostic / B2 adversarial_verify QD-ablation + value-routing-cost guards), 1 hardware (C), 1
  SOTA-ingestion (D), capstone (E). 7 days to the ARC Prize Milestone #1 deadline (2026-06-30).'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  The 0.04 live multi-level solve-rate is a GENERATION-GUIDANCE wall, now localized by a week of outer-loop falsification
  (macro-depth, click-coverage, just-explore-schedule, goal-energy all dead). .429 attacks the two surviving levers on the
  SCORED E3AgentPolicy. A1 (HEADLINE) makes the 0.725-AUROC discriminator AFFORDABLE live via the PROVEN compute-cost fix
  (scipy.ndimage.label, 13ms->0.64ms, identical output) and RAISES value_weight off 0.0 so the value head finally GUIDES the
  live search without the timeout that caused the prior value-head nulls -- a direct outer-loop->conductor productionization
  handoff. A2 (operator energy-config menu #2) wires energy-as-fitness QD/MAP-Elites evolution over action-SEQUENCES
  (fitness = goal-energy + action-effect cell-recall + efficiency; mutation insert/delete/swap/splice + crossover; behavior
  descriptors for diverse niches) to GENERATE a winner the best-first search never proposed -- population-based generation
  with diversity (NOT the dead horizon-collapse macros, NOT the nulled single-rollout goal-energy heuristic), the bet being
  that population-seeding + non-null QD priority escapes the de-novo-generation failure. Gates are sharp and ablation-guarded:
  A1 must beat the value_weight=0 baseline with no timeout (CI); A2 must produce winner_generated the search missed AND beat a
  random-mutation/no-energy-fitness ablation. CAPABILITY (A3): self-play banks +1 reproducible level (57->58+) + trains the
  learned verifier. SCORE (A4): keep the package operator-resubmit-ready (>33). Plus persist+transfer (A5), integration into
  SUBMITTED_AGENT_CONFIG (A6), 2 infra (B1/B2), 1 hardware (C), 1 SOTA-ingestion (D), capstone (E). verifier_is_oracle:false on
  every value claim; solve_provenance on every ARC solve task; submission operator-only. 7 days to the ARC Prize Milestone #1
  deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC; >=1 level-up attempt that
  BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A3); 2 reserved infra (B1/B2); 1 per-board hardware (C); 1
  SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus. 7 days to the ARC Prize Milestone #1
  deadline ($25K). The frozen live generator is Qwen3.5-9B-MTP on the iGPU (NEVER the 3090s); any LLM arm declares
  live_llm_inference for that arm only."

