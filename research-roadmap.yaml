    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Milestone 2026.05.251 is complete. This capstone synthesizes all 13 experiment results
      and produces operator action recommendations.

      EXISTING CODE TO READ FIRST (read each before synthesizing):
      - results/experiment_2621_archive_v250.json
      - results/experiment_2622_ensemble_v9_adversarial_val.json (PRIMARY: adversarially_verified, AUROC mean/std)
      - results/experiment_2623_external_benchmarks.json (halluscan_auroc, ood_generalization_delta)
      - results/experiment_2624_ttt_loop_prototype.json (ttt_loop_ran, fr11_tier3_ttt_closed)
      - results/experiment_2625_fjd_safety_v2.json (safety_auroc_v2, safety_tier_b_v2_viable)
      - results/experiment_2626_multi_exit_kan.json (multi_exit_viable, speedup_estimate)
      - results/experiment_2627_bb_ucp_conformal.json (coverage_at_90pct, bb_interval_width)
      - results/experiment_2628_kv260_continuity.json (kv260_sd_detected, branch, kv260_terminal_candidate)
      - results/experiment_2629_paper_v6_polish.json (submission_package_ready, latex_compile_success)
      - results/experiment_2630_gguf_pipeline_smoke.json (inference_mode, pipeline_e2e_latency_mean_s)
      - results/experiment_2631_distribution_final_mile.json (ipfs_cid_verified, readme_updated)
      - ops/status.md (most recent operational state)

      TASK: Synthesize all .251 results and produce operator recommendations.

      CONCRETE STEPS:
      0. Read all result files listed above. For each, record: honest_verdict, key metric(s), any blocked/failed state.

      1. Evaluate the 7 success criteria from research-roadmap-v251.md:
         a. adversarially_verified: true → ensemble v9 AUROC headline-eligible
         b. halluscan_auroc > 0.70 → OOD generalization confirmed
         c. ttt_loop_ran: true → FR-11 Tier 3 TTT prototype operational
         d. safety_auroc_v2 > 0.70 → FJD v2 improves over v1
         e. submission_package_ready: true → paper ready for operator arXiv submit
         f. pipeline_e2e_latency_mean_s < 30.0 → live GGUF smoke passes
         g. ipfs_cid_verified: true → content-addressed distribution confirmed

      2. Determine n_criteria_met (0-7) and overall milestone verdict.

      3. Assess Phase 1 ship readiness:
         Phase 1 gates: PyPI package (carnot-ebm) + HF mirror + docs + ≥1 reproducer.
         Are all 4 gates satisfied? Record phase1_ship_ready bool.

      4. Produce operator action checklist (OPERATOR-ONLY items per CLAUDE.md):
         a. arXiv submission: if submission_package_ready: true → recommend operator submit.
            Include: submission_package path, arXiv category (cs.LG + cs.AI), checklist.
         b. KV260 SD card: if kv260_sd_detected=False → remind operator to insert SD.
         c. Any other operator-facing action items from experiment results.

      5. Document the 3 biggest gaps for .252:
         Based on what failed or remained incomplete in .251.

      6. Update ops/status.md: add Session .251 Complete section.
         Update ops/changelog.md: add .251 entry.

      7. Write results/experiment_2632_capstone_v251.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix for conductor reconciler."
      - n_criteria_met: int — count of 7 success criteria met
        principle: "Milestone scorecard; < 5 suggests need for targeted .252 follow-up."
      - adversarially_verified: bool — from exp2622
        principle: "Primary gate: if false, ensemble v9 is not paper-citable; .252 must re-validate."
      - fr11_tier3_ttt_closed: bool — from exp2624
        principle: "FR-11 completion status; false = Phase 1 incomplete at FR-11 level."
      - phase1_ship_ready: bool — all 4 Phase 1 gates satisfied
        principle: "Phase 1 ship check; operator needs this to make the PyPI+HF announcement."
      - submission_package_ready: bool — from exp2629
        principle: "Operator-action gate: True = package ready for operator to submit to arXiv."
      - n_experiments_completed: int — count of experiments with terminal honest_verdict
        principle: "Sustained execution metric; target >= 7 to confirm drought is broken."
      - operator_action_checklist: list of str — ordered list of operator-facing actions
        principle: "Operator reads this as the session handoff; must be actionable and specific."
      - top_3_gaps_for_252: list of str — biggest gaps for next milestone
        principle: "Next planner reads this as the primary carry-forward signal."
      - duration_s: float
        principle: "Capstone cross-reads 12+ artifacts; >= 5s is expected."
      - preconditions_checked: list of {resource, available, check}
        principle: "Records which result files were actually read."

      Do NOT submit to arXiv. Do NOT push. Do NOT modify scripts/research_conductor.py.


