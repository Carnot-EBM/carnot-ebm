        verdict: blocked_fover_balanced_corpus_not_available
        addressed_by: "exp3844 blocked because FoVer v4 is 98% correct-heavy (~22 residual items). exp3858 (this milestone, upstream gate) builds data/step_error_balanced_v2.json with >=100 gold-incorrect steps; this attempt runs against THAT corpus, so the precondition is satisfied."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp3858-build-balanced-step-error-corpus-v2
        artifact_field: n_incorrect_steps
        op: '>='
        value: 100
    milestone: "2026.06.356"
    title: "MOAT SCISSOR AT SCALE (re-issue of exp3847; supersedes blocked exp3844): of the gold step-errors Qwen3.6-35B's OWN self-verification MISSES, what fraction does Carnot's k=15 ensemble independently catch? On the balanced corpus, N>=1000, residual_catch bootstrap CI95, TWO positive controls (reasoner non-degenerate; ensemble AUROC reproduces frozen 0.9131+/-0.02)."
    priority: critical
    track: research
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    requires_gpu: true      # Qwen3.6-35B self-verifies N>=1000 steps via llama.cpp on the internal RTX 3090.
    estimated_wall_time_min: 80
    inference_substrate: live_llm_inference   # loads + runs the SOTA GGUF for self-verification; duration floor 60s.
    deliverable: results/experiment_3859_moat_scissor_at_scale_v3.json
    prompt: |
      CONTEXT. The Deep-Think P2 reframe: Carnot's value is durable ONLY if it independently catches
      the step-errors a strong frontier reasoner's OWN self-verification misses. exp3827 gave a
      PRELIMINARY positive (residual_catch=0.9000, overlap=0.5000) on 100 items with suspiciously round
      numbers; exp3844 (at scale) BLOCKED on a missing balanced corpus; the .355 re-attempt (exp3847)
      SKIPPED under the poison-test wipeout. This confirms-or-refutes the moat at scale on
      data/step_error_balanced_v2.json (built by exp3858, >=100 gold-incorrect steps). It is a PROPERTY
      MEASUREMENT (error-set independence), NOT a generation-beats-AR test — do NOT apply a generation
      headroom gate.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3827_verifier_error_independence_scissor.json + its script (the exact
          residual_catch / overlap definitions + reasoner self-verify prompt — reuse VERBATIM).
        - scripts/experiment_2837_fover_memory_leakage_v3.py (the frozen k=15 ensemble path -> 0.9131).
        - data/step_error_balanced_v2.json (the new balanced corpus; fall back to the largest fover_v3
          balanced set if absent).

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE anything; on failure write blocked_<resource> + EXIT, no fabrication):
           a. `cd {project_root} && .venv/bin/python -c "import torch; assert torch.cuda.is_available() and torch.cuda.device_count()>0"` AND a FREE GPU (>=10GB). If the rig is busy, honest_verdict `blocked_no_free_gpu`, EXIT (never queue, never fabricate).
           b. SOTA GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/` returns a .gguf (fallback unsloth/gemma-4-26B-A4B-it-GGUF). Load via the .gguf model_path + llama.cpp (NOT AutoTokenizer on the GGUF repo id — no HF tokenizer files; use cached_sota_pair()).
           c. `import carnot.verify` succeeds AND data/step_error_balanced_v2.json present with n_incorrect>=100 (else fover_v3 fallback; if that too has n_incorrect<30, honest_verdict `blocked_residual_set_too_small`).
           If any fail: honest_verdict `blocked_<resource>` + preconditions_checked, EXIT.
        1. Draw N>=1000 balanced items (seed-controlled).
        2. STRONG REASONER SELF-VERIFICATION: ask Qwen3.6-35B (its own self-verify, exp3827 prompt
           verbatim) accept/reject per step. The live-GPU part.
        3. CARNOT ENSEMBLE: score each step with the k=15 ensemble (the 2837 path).
        4. Partition gold-INCORRECT steps into (A) caught by reasoner self-verify, (B) MISSED by reasoner
           (the residual). Compute:
             - residual_catch_rate = fraction of (B) Carnot catches at its operating threshold; BOOTSTRAP CI95 (>=1000 resamples).
             - error_overlap_jaccard = |reasoner-caught ∩ carnot-caught| / |union| over gold-incorrect.
        5. POSITIVE CONTROLS (both MUST pass or result is INCONCLUSIVE):
             - reasoner_self_verify_auroc in [0.55, 0.95] (genuine self-verify, not all-accept/all-reject).
             - carnot_ensemble_auroc reproduces frozen 0.9131 within +/-0.02 on this corpus (else deltas void, exp3820 mode).
        6. Apply the gate -> terminal verdict.

      REQUIRED ARTIFACT FIELDS (each with a `principle` note; n_residual_errors is a GATE field):
        residual_catch_rate: {{ principle: "THE moat metric — of the reasoner's MISSED errors, the fraction Carnot independently catches. High => durable; low => o1-subsumption risk." }}
        residual_catch_ci95: {{ principle: "Bootstrap CI95 — turns exp3827's round point estimate into a defensible interval; the LOWER bound is the gate field." }}
        error_overlap_jaccard: {{ principle: "Independence check — low overlap => reasoner & Carnot occupy different null spaces (the moat); high => Carnot is redundant with frontier self-verify." }}
        reasoner_self_verify_auroc: {{ principle: "Positive control — a degenerate reasoner would inflate residual_catch trivially." }}
        carnot_ensemble_auroc: {{ principle: "Positive control — MUST reproduce frozen 0.9131 +/-0.02 or ALL residual numbers are void." }}
        n_items: {{ principle: "N>=1000 — the residual CI is meaningful only at scale." }}
        n_residual_errors: {{ principle: "GATE field — emit as a BARE int. Residual-set size (downstream exp3860/3861/3864); if <30, widen N or report INCONCLUSIVE." }}
        per_item_error_masks: {{ principle: "Persist reasoner-mask + carnot-mask + gold-label + error_axis per item so exp3860/3861/3864 reuse them WITHOUT re-running the GPU." }}
        preconditions_checked, cited_upstream_artifacts (exp3827 + 2837 + exp3858 with sha256),
        model_specs, random_seed, random_seeds_used, reproducibility_checksum, duration_s, inference_substrate:
          principle: "Pre-Launch + Adversarial-Verify + Inference-Substrate — a live 35B GGUF over N>=1000 takes real wall-clock; implausibly short = fabrication."

      FALSIFICATION GATE (acceptance):
        - MOAT_SURVIVES_AT_SCALE: both controls pass AND residual_catch_ci95 lower bound > 0.5 AND error_overlap_jaccard < 0.6.
          honest_verdict: `complete: scissor_at_scale_MOAT_SURVIVES_residcatch<mean>_ci<lo>-<hi>_overlap<j>_n<N>`
        - MOAT_SUBSUMED: both controls pass AND (residual_catch_ci95 upper < 0.3 OR error_overlap_jaccard > 0.7).
          honest_verdict: `complete: scissor_at_scale_MOAT_SUBSUMED_residcatch<mean>_overlap<j>_subsumption_risk_n<N>`
        - INCONCLUSIVE: a positive control fails (reasoner degenerate OR carnot_ensemble_auroc off frozen by >0.02 OR n_residual_errors<30).
          honest_verdict: `complete: scissor_at_scale_INCONCLUSIVE_<which>`
        - honest_verdict MUST start with a terminal prefix or `blocked_<resource>`.

      DISCIPLINE: populate seeds + checksum + preconditions + cited_upstream + model_specs. Report REAL
      duration (live LLM floor 60s). Do NOT aggregate flagged_adversarial:true artifacts. Do NOT move the
      frozen 0.9131. Persist per_item_error_masks. Emit n_residual_errors as a BARE int.
      Run: cd {project_root} && .venv/bin/python scripts/experiments/experiment_3859_moat_scissor_at_scale_v3.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3860-verifier-reasoner-independence-audit-v2
    operator_override: >
      2026-06-05 operator directive (standing): re-issue of the .355 exp3848 independence audit (which
      GATE_BLOCKED under the wipeout). NET-NEW measurement that scope-matches the scissor only on the
      "error-independence" keyword — it is NOT a rerun of the blocked scissor. Consumes exp3859's
      persisted error-masks (CPU, no GPU) and measures verifier-vs-reasoner error CORRELATION
      (arXiv:2604.07650) to test whether the moat's independence is REAL or a shared blind spot.
    gated_on:
      - upstream: exp3859-moat-scissor-at-scale-v3
        artifact_field: n_residual_errors
        op: '>='
        value: 30
    milestone: "2026.06.356"
    title: "INDEPENDENCE AUDIT (arXiv:2604.07650): is Carnot's catch of the reasoner's residual errors REAL decorrelation or a shared blind spot? Measure error-mask correlation (phi/Matthews) reasoner-vs-ensemble AND per-verifier-vs-reasoner, decompose by the 9 PRMBench error axes. The measurement that makes the moat claim defensible vs the fake-independence trap."
    priority: critical
    track: research
    max_turns: 45
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # all-codex anti-wipeout; correlation computation + gate application is deterministic. Capstone (exp3868) does the interpretive synthesis.
    requires_gpu: false      # reuses exp3859's persisted per_item_error_masks + re-scores cached candidates; NO GPU.
    estimated_wall_time_min: 40
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_3860_verifier_reasoner_independence_audit_v2.json
    prompt: |
      CONTEXT. arXiv:2604.07650 (Behavioral Entanglement) is the load-bearing REFUTATION RISK for the
      moat: verifiers sharing an LLM lineage with the reasoner produce CORRELATED FAILURE masquerading
      as independence. A naive scissor (exp3859) can report a fake moat if the verifier and reasoner
