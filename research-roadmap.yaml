milestone: 2026.06.387
milestone_title: "PROVE-OR-BOUND THE VERIFIER MOAT WITH HEADROOM CONTROLS — headroom-gated executable moat test (positive-control) + V-STaR learned selector + GAP-3 Stage-1 model-native ARC energy (CPU; dump exists); DiffusionGemma stays GATED"
milestone_doc: openspec/change-proposals/research-roadmap-v387.md
milestone_overview: |
  The verifier is Carnot's existential value-add (north-star §5). Milestone .386 ran the decisive
  verifier-as-reward graft on the outer-loop-trained TRM Sudoku baseline (val 0.8227) and got a NULL
  (exp4168 verifier_value_added=false) — BUT the null is uninformative because oracle@k 0.8125 ≈ the
  0.82 baseline: Sudoku-Extreme at this checkpoint has almost no selectable headroom, so the test
  cannot distinguish "verifier fails" from "nothing to select" (FALSE_NEGATIVE_RISK). The two corpora
  show the two failure modes: Sudoku (verifier perfect, zero headroom) and ARC (real ~13pp headroom,
  hand-invariant verifier ANTI-ranks — GAP-3). Fresh lit (arXiv:2605.07395) adds that apparent
  headroom can itself be an evaluation artifact. So .387 answers the moat question PROPERLY:
    PHASE A — headroom-controlled moat test (positive-control): A1 build a headroom gate with an
      OBJECTIVE/EXECUTABLE oracle + census cached pools to FIND a headroom-present executable domain;
      A2 build the V-STaR learned selector (accepted+rejected traces); A3 the decisive moat test on
      that domain with a MATCHED no-verifier control, reporting accuracy AND cost.
    PHASE B — GAP-3 Stage-1 model-native ARC energy: the activation dump ALREADY EXISTS
      (results/arc3_gap3_stage1_candidate_table.npz, z_mean (8041,512)), so this is CPU-only — score
      with model-native basis + learned probe, run all gates + adversarial checks; does it reach the
      proven ~13pp headroom?
    PHASE C — ARC incremental +1 (monotonic; non-spatial exhausted → deeper level / spatial game).
    PHASE D — reserved slots: SOTA-ingestion, registry+gaps hygiene, hardware continuity, capstone.
  DiffusionGemma stays GATED: it activates only when a headroom-present executable domain shows
  verifier_value_added==true. .387 does NOT launch DiffusionGemma; the capstone resolves the gate.

  HARD RULE (every task): NO task may launch TRM training, run pkill/kill against train.py, or WRITE
  results/trm_runs/sudoku_extreme_baseline/. Training is DONE (SIGTERM'd at val 0.8227); the conductor
  stays stood-down. TRM-touching tasks are READ-ONLY.

