  - id: exp2041-pypi-workflow-escalation-check
    title: "Exp 2041: PyPI workflow ESCALATION check (10+ milestones pending operator approval)"
    deliverable: results/experiment_2041_pypi_escalation.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp2011-pypi-workflow-final-recheck
        verdict: status_unknown_drafted_during_bash_failure
        addressed_by: "exp2011 (.202) drafted; activation unknown. v0.1.0b1 workflow has now been pending operator approval across .194-.203 (10 milestones). This task checks final state + outputs an escalation summary if still waiting."
        retire_if_same_verdict: false
      - experiment_id: exp1930-pypi-workflow-status-check
        verdict: success_operator_approval_required
        addressed_by: "exp1930 (.196) identified the waiting state. 10 milestones later, escalation summary appropriate if no change."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: v0.1.0b1 tag pushed at .194 (~10 milestones ago).
      Workflow has been in 'waiting' state since first observed at
      .196 exp1930. .200 exp1987 and .202 exp2011 both drafted
      re-check tasks during Bash-failure window. This is the
      escalation check.

      FALSIFIABLE HYPOTHESIS: Workflow run for v0.1.0b1 is now in one
      of: (a) succeeded (PyPI 0.1.0b1 reachable + install works),
      (b) failed (operator approved but step errored), (c) still
      waiting (operator hasn't approved in ~10 milestones; needs
      explicit poke), (d) cancelled/expired (auto-timeout; needs
      workflow_dispatch re-trigger).

      EXISTING CODE TO READ FIRST:
        - results/experiment_1930_pypi_status.json (initial state)
        - results/experiment_1987_pypi_status_recheck.json if exists
        - results/experiment_2011_pypi_final_recheck.json if exists
        - .github/workflows/publish-pypi.yml

      TASK: Final state check; re-trigger if expired; verify PyPI.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `command -v gh` succeeds.
           b. `gh auth status` returns authenticated.
           c. Tag v0.1.0b1 exists on origin.
           Record preconditions_checked.
        1. `gh run list --workflow=publish-pypi.yml --limit 20
            --repo Carnot-EBM/carnot-ebm --json
            databaseId,status,conclusion,createdAt,url`. Find
           v0.1.0b1 runs (may be multiple if re-triggers were
           attempted).
        2. For latest run, classify state.
        3. If status=waiting AND age > 24h: report as
           `operator_approval_overdue` — escalation summary listing
           number of consecutive milestones the approval has been
           pending.
        4. If status=completed AND conclusion=success: verify PyPI
           install (fresh tmpdir, fresh venv).
        5. If status=cancelled/expired: attempt `gh workflow run
           publish-pypi.yml --ref v0.1.0b1 --repo Carnot-EBM/carnot-ebm`.
           Wait up to 10 minutes for completion.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.pypi_escalation.v1"
        - experiment: 2041
        - run_date: ISO-8601 UTC
        - duration_s: > 15s
        - random_seed: 173241
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {{workflow_file: ".github/workflows/publish-pypi.yml",
          tag_checked: "v0.1.0b1",
          milestones_pending: int (e.g., 10)}}
        - n_samples: 1
        - n_samples_justification: "Status escalation; n=1 workflow."
        - workflow_run_id: int or null
        - workflow_run_status: str
        - workflow_run_conclusion: str or null
        - milestones_pending_count: int
        - re_trigger_attempted: bool
        - re_trigger_outcome: str or null
        - pypi_url_reachable: bool
        - external_install_verified: bool
        - actionable_next_step: str
        - escalation_summary: str
        - acceptance_gate_passed: bool
        - acceptance_gate_criteria: "Status reported; escalation summary
          written if overdue; install verified if succeeded."
        - methodology_note: "NO new tag push. workflow_dispatch
          re-trigger only if cancelled/expired."
        - optimization_direction: "neither"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push tags. Do NOT modify
      scripts/research_conductor.py.

