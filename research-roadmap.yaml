- id: exp416-constraint-graph-builder
  milestone: 2026.06.17
  deliverable: python/carnot/pipeline/constraint_graph_builder.py
  title: 'Exp 416: MathAgent constraint graph builder — LLMExtractor → formal constraint graph (arXiv 2604.11188)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2604.11188 (MathAgent, 2026-04):\
    \ 'Legislator-Executor paradigm where a Legislator agent synthesizes a constraint graph as a\
    \ generation blueprint; an Executor agent generates text that must satisfy the graph. Constraint\
    \ graph encodes: variable types, value ranges, logical dependencies between steps. Seed-free\
    \ synthesis — no human-written examples needed.'\n\nWHY THIS MATTERS: The current LLMExtractor\
    \ (Exp 366) extracts free-form claims from model outputs. A ConstraintGraphBuilder instead\
    \ generates a FORMAL CONSTRAINT GRAPH from the problem statement itself — before generation\
    \ even starts. The graph then drives Ising verification directly: constraint graph → Ising\
    \ coupling matrix. This is what LLMExtractor should evolve into: a structured Legislator\
    \ that pre-computes the verification space for any problem.\n\nThis is also the first step\
    \ toward Phase 3 (Kona parity): instead of pattern-matching after generation, pre-compute\
    \ the constraint space and guide generation toward it.\n\nThis is CPU-only and independent\
    \ of GPU state.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/llm_extractor.py\
    \ — LLMExtractor (Exp 366) — what ConstraintGraphBuilder extends\n- python/carnot/pipeline/constraint_template_library.py\
    \ — ConstraintTemplateLibrary (Exp 343)\n- python/carnot/verify/energy.py — ConstraintTerm\
    \ protocol\n- python/carnot/models/ising.py — IsingEBM (coupling matrix structure)\n\n\
    TASK: Implement ConstraintGraphBuilder.\n1. Read CLAUDE.md spec-first workflow.\n2. Add\
    \ REQ-EXTRACT-026 (ConstraintGraphBuilder generates formal constraint graphs from problem\
    \ statements before generation),\n   REQ-EXTRACT-027 (constraint graph converts to Ising\
    \ coupling matrix),\n   SCENARIO-EXTRACT-052/053/054 to spec.\n3. Write tests FIRST (100%\
    \ coverage) for:\n   - ConstraintVariable(name: str, var_type: Literal['integer','float','boolean'],\
    \ lower_bound: float|None, upper_bound: float|None, description: str)\n   - ConstraintEdge(var_a:\
    \ str, var_b: str, relation: Literal['equal','less_than','greater_than','sum','product'],\n\
    \     coefficient_a: float = 1.0, coefficient_b: float = 1.0, rhs: float|None = None)\n\
    \   - ConstraintGraph(variables: list[ConstraintVariable], edges: list[ConstraintEdge],\
    \ problem_description: str)\n   - ConstraintGraph.to_ising_coupling_matrix() -> jnp.ndarray:\n\
    \     Returns n_vars x n_vars symmetric matrix. Equality edge (a+b=c): J[a][b]=1, J[b][c]=-1,\
    \ etc.\n     Range constraints become local bias terms (single-variable energy).\n   -\
    \ ConstraintGraphBuilder(llm_caller=None)\n   - ConstraintGraphBuilder.build_from_problem(problem_text:\
    \ str) -> ConstraintGraph:\n     CI-safe mode (llm_caller=None): parse simple 'what is\
    \ X+Y?' patterns deterministically.\n     LLM mode: prompt LLM to extract variables, bounds,\
    \ and relations in JSON format.\n   - ConstraintGraphBuilder.graph_to_constraint_terms(graph)\
    \ -> list[ConstraintTerm]:\n     Converts graph edges to ConstraintTerms usable by VerifyRepairPipeline.\n\
    4. Implement python/carnot/pipeline/constraint_graph_builder.py.\n   Verbose docstrings\
    \ explaining WHY constraint graphs pre-compute the verification space, WHY this is the\
    \ Legislator role (arXiv 2604.11188), HOW the coupling matrix maps to IsingEBM, the Phase\
    \ 3 path (constraint graph = Kona's energy landscape specification).\n5. Export ConstraintGraphBuilder,\
    \ ConstraintGraph, ConstraintVariable, ConstraintEdge from carnot.pipeline.__init__.\n6.\
    \ Write scripts/experiment_416_constraint_graph.py using ExperimentTemplate(416):\n   a.\
    \ CPU-only, no GPU required\n   b. Create 5 synthetic math problems (shopping totals, distance,\
    \ percentage, mixture, rate)\n   c. For each: ConstraintGraphBuilder().build_from_problem(problem)\n\
    \   d. Convert each graph to coupling matrix and constraint terms\n   e. Verify coupling\
    \ matrix is symmetric and non-trivial (has non-zero off-diagonal entries)\n   f. Run IsingEBM\
    \ with coupling matrix on satisfying vs violating configurations\n   g. Build artifact:\
    \ schema='carnot.constraint_graph.v1',\n      n_problems=5, graphs_generated, mean_n_variables,\
    \ mean_n_edges,\n      coupling_matrices_valid, ising_separation_ratio,\n      honest_verdict\
    \ ('graphs_viable' when all graphs generated AND coupling_matrices_valid AND ising_separation_ratio>1.0;\n\
    \      'partial' when some work; 'no_separation' otherwise)\n   h. Output: results/experiment_416_constraint_graph.json\n\
    7. Write tests/python/test_constraint_graph_builder.py (100% coverage).\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: update ops/conductor-log.md, ops/changelog.md,\
    \ ops/status.md.\n   Note: ConstraintGraphBuilder is the first step toward Phase 3 Kona-parity\
    \ architecture.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push.\
    \ Do NOT modify scripts/research_conductor.py.\n"

