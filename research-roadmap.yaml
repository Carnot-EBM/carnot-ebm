- id: exp764-ast-knowledge-verifier
  milestone: 2026.04.58
  deliverable: results/experiment_764_ast_knowledge_verifier.json
  title: 'Exp 764: AST-Based Code Hallucination Detector — Tier 0d Candidate (arXiv 2601.19106)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2601.19106 "Detecting and Correcting Hallucinations in LLM-Generated
    Code via Deterministic AST Analysis" proposes:
    - Parse generated code into Abstract Syntax Tree (AST)
    - Build a Knowledge Base (KB) via library introspection (inspect module, dir())
    - Validate AST against KB: detect API calls with non-existent methods, wrong argument
      counts, or non-existent attribute access patterns
    - Results: 100% precision, 87.6% recall on 200 Python snippets, 77% auto-correction

    This is EXECUTION-FREE hallucination detection for code. Unlike runtime instrumentation
    (which requires executing code), AST analysis is static and safe. Unlike regex, it
    understands Python syntax. It catches Knowledge Conflicting Hallucinations (KCHs) —
    hallucinations about API contracts that linters miss.

    For Carnot: integrate as Tier 0d pre-filter for code verification tasks. When LLM
    generates Python code, run ASTKnowledgeVerifier BEFORE executing. If KCHs detected:
    flag as high-confidence violation (no need to run expensive Ising verification).
    100% precision means zero false positives — every detection is a real error.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/extract.py — CodeExtractor; understand current code extraction.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; where to integrate.
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline Tier 0 slot.
    - scripts/experiment_764_ast_knowledge_verifier.py — does not exist yet (create it).
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement ASTKnowledgeVerifier. Evaluate on 50 Python code snippets (25 correct,
    25 with API hallucinations). Target: precision=1.0, recall≥0.75. Integrate as Tier 0d.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-EXTRACT-035 (ASTKnowledgeVerifier MUST parse Python code to AST and validate
       API calls against introspected module knowledge; precision MUST be 1.0 — zero FP),
       REQ-EXTRACT-036 (ASTKnowledgeVerifier Tier 0d MUST return violation_detected=True
       only when call target is absent from introspected module dict),
       SCENARIO-EXTRACT-070/071/072 to openspec/capabilities/verification/spec.md.
    3. Implement python/carnot/extraction/ast_knowledge_verifier.py:
       a. KnowledgeBase:
          build_from_modules(module_names: list[str]) -> KnowledgeBase:
            For each module: import it, call dir(), inspect.getmembers().
            Store: (module.attr: {"type", "signature", "exists": True)}.
          lookup(module: str, attr: str) -> bool:
            Return True if module.attr exists in KB.
       b. ASTKnowledgeViolation(node_text, module, attr, violation_type) dataclass.
       c. ASTKnowledgeVerifier(kb: KnowledgeBase):
          verify(code_text: str) -> list[ASTKnowledgeViolation]:
            Parse code with ast.parse().
            Walk AST: find ast.Attribute nodes (obj.attr patterns).
            For each: check kb.lookup(inferred_module, attr).
            Return violations where attr not in KB.
          verify_function(function_code: str) -> list[ASTKnowledgeViolation]:
            Same but for a single function definition.
    4. Build evaluation corpus (50 snippets, no external download needed):
       a. 25 CORRECT snippets using built-in Python APIs correctly:
          import os, sys, json, re, math, random, collections, itertools, functools
          Example: "import json; data = json.loads(text)" — json.loads exists → no violation.
       b. 25 HALLUCINATED snippets with plausible-sounding but non-existent APIs:
          "json.parse(text)" (parse doesn't exist; loads does)
          "os.read_file(path)" (no read_file; use open())
          "math.relu(x)" (no relu in math)
          "random.choice_weighted(lst, weights)" (no choice_weighted)
          "re.findall_named(pattern, text)" (no findall_named)
    5. Evaluate: for each snippet, run verify() and check if violation_detected matches label.
       a. precision = TP / (TP + FP) — must be 1.0 (zero FP)
       b. recall = TP / (TP + FN) — target ≥ 0.75
       c. f1 = 2 * precision * recall / (precision + recall)
    6. Integrate ASTKnowledgeVerifier into ThreeTierPipeline as Tier 0d:
       a. In python/carnot/pipeline/three_tier_pipeline.py: add Tier0dResult(violations, passed_tier0d).
       b. In ThreeTierPipeline: if code task, run ASTKnowledgeVerifier before Tier 1.
          If violations detected: skip Tier 1 Ising (already flagged as violation).
       c. The skip logic saves Ising computation time for high-confidence code KCHs.
    7. Create scripts/experiment_764_ast_knowledge_verifier.py:
       a. ExperimentTemplate(764) + ExperimentTimeoutWatchdog(764, timeout_minutes=30).
       b. Implement steps 3-6.
       c. honest_verdict:
          - "tier0d_viable" if precision=1.0 AND recall >= 0.75
          - "tier0d_partial" if precision=1.0 AND recall < 0.75 (safe but incomplete)
          - "false_positives_detected" if precision < 1.0 (unsafe — DO NOT deploy)
          - "corpus_construction_failed" if < 20 snippets available
       d. artifact: n_correct_snippets, n_hallucinated_snippets, precision, recall, f1,
          violations_per_snippet (list), tier0d_deployed (bool), honest_verdict.
    8. Write tests/python/test_experiment_764_ast_knowledge_verifier.py with 100% coverage:
        - test KnowledgeBase.lookup returns True for json.loads, False for json.parse.
        - test ASTKnowledgeVerifier.verify catches "json.parse(text)" as violation.
        - test ASTKnowledgeVerifier.verify does NOT flag "json.loads(text)" (no FP).
        - test precision/recall computation from TP, FP, FN counts.
        Each test traces to REQ-EXTRACT-035/036.
    9. Reconcile:
       - ops/status.md: "AST Knowledge Verifier (Tier 0d): precision=X, recall=X.
         Tier 0d deployed=True/False. honest_verdict=X."
       - ops/changelog.md: one-line with honest_verdict.
    10. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp765-jepa-v19-predictive
  milestone: 2026.04.58
  deliverable: results/experiment_765_jepa_v19_predictive.json
  title: 'Exp 765: JEPA v19 — Tier 3 Predictive Verification on Real Accumulated Violations'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: research-program.md Tier 3 (JEPA-Style Predictive Verification):
    "Train a model to predict constraint violations BEFORE the LLM finishes generating.
    Input: partial response (first N tokens) → predict which constraints will be violated
    in the full response. Enables preemptive guided decoding."

    JEPA versions so far have struggled with OOD generalization (Exps 704, 717 below 0.5 AUC).
    The root cause identified across milestones: training on synthetic data produces probes
    that don't generalize to real model outputs. JEPA v18 used LambdaRank on synthetic data
    (OOD AUC=0.5115 — barely above random). The key insight from arXiv 2511.06209:
    multi-step probes trained on REAL model hidden states generalize much better than
    probes trained on text embeddings or synthetic data.

    Exps 742, 759, and 760 should produce real violation data (live GPU inference):
    - Exp 742: 200q RETRO-033 confirmation (seed=999 VR data)
    - Exp 759: 50 HumanEval iterative repair results
    - Exp 760: 250q Gemma4 threshold grid VR results

    JEPA v19 trains on this REAL accumulated data. If Exps 759/760 did not produce live
    data (GPU blocked), fall back to Exp 442's 57 labeled FoVer steps.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_reasoner_probe.py — JEPAReasonerProbe current architecture.
    - results/experiment_732_jepa_5fold_cv.json — v18 baseline: probe_5fold_auc=0.993 (in-dist).
    - results/experiment_759_iterative_code_repair_live.json — load if available (real data).
    - results/experiment_760_gemma4_threshold_grid.json — load if available (real data).
    - results/experiment_742_retro033_confirmation.json — load (200q VR real data).
    - results/fover_labeled_steps_live.json — fallback: 57 real labeled steps.
    - python/carnot/pipeline/fover_annotator.py — FOVERAnnotator for step parsing.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Retrain JEPA v19 on real accumulated violation data from Exps 742+759+760.
    Target: OOD AUC > 0.75 (project milestone for Tier 3 viability).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-043 (JEPA v19 MUST be trained exclusively on real accumulated
       violation data from live GPU experiments; no synthetic data injection),
       REQ-LEARN-044 (JEPA v19 OOD AUC MUST exceed 0.75 for Tier 3 deployment;
       otherwise file new RETRO-JEPA-OOD), SCENARIO-LEARN-085/086 to
       openspec/capabilities/self_learning/spec.md.
    3. Collect training data:
       a. Load results/experiment_742_retro033_confirmation.json — extract VR violation pairs.
       b. Load results/experiment_759_iterative_code_repair_live.json — extract code repair pairs.
          If blocked: use results/fover_labeled_steps_live.json as code substitute.
       c. Load results/experiment_760_gemma4_threshold_grid.json — extract VR violation pairs.
          If blocked: use fover_labeled_steps_live.json as math substitute.
       d. Pool all real pairs. Minimum: 57 pairs (fover fallback). Target: 200+ pairs.
       e. Record: n_real_pairs, data_sources (list of experiments that contributed).
    4. Build JEPA v19 with multi-step architecture (arXiv 2511.06209 finding):
       a. Upgrade JEPAReasonerProbe to pool features across multiple CoT steps (not just one).
       b. MultiStepJEPAv19(hidden_dim=64, n_steps=3, output_dim=1):
          forward(steps: list[str]) -> float: pool TF-IDF embeddings across n_steps steps.
          train(step_sequences, labels, n_epochs=200, lr=1e-3) -> None.
       c. Create python/carnot/samplers/jepa_v19.py with MultiStepJEPAv19.
    5. Train on collected real data:
       a. 80/20 split (in-distribution).
       b. OOD test: use GSM8K questions 800-999 (never seen in Exps 742/759/760).
       c. Train MultiStepJEPAv19 for 200 epochs.
    6. Evaluate:
       a. In-distribution AUC (20% held-out).
       b. OOD AUC (GSM8K 800-999, 50 questions, synthetic violation pairs).
       c. Compare: OOD AUC vs prior JEPA versions (v18=0.5115, target v19 > 0.75).
    7. Create scripts/experiment_765_jepa_v19_predictive.py:
       a. ExperimentTemplate(765) + ExperimentTimeoutWatchdog(765, timeout_minutes=60).
       b. Implement steps 3-6.
       c. honest_verdict:
          - "jepa_v19_ood_viable" if ood_auc > 0.75 (Tier 3 deployment eligible)
          - "jepa_v19_improving" if 0.60 < ood_auc <= 0.75 (above v18=0.5115, below gate)
          - "jepa_v19_still_below_random" if ood_auc <= 0.5 (no progress)
          - "jepa_v19_insufficient_data" if n_real_pairs < 20 (too few for reliable train)
       d. artifact: n_real_pairs, data_sources, in_dist_auc, ood_auc,
          n_steps_pooled, model_saved_path, honest_verdict.
    8. Write tests/python/test_experiment_765_jepa_v19_predictive.py with 100% coverage:
        - test MultiStepJEPAv19.forward pools across n_steps step embeddings.
        - test training loop decreases loss over 10 epochs on synthetic data.
        - test OOD AUC computation from predictions and labels.
        Each test traces to REQ-LEARN-043/044.
    9. Reconcile:
