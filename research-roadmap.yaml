      retire_if_same_verdict: true

- id: exp6735-oracle-distinct-diagnostic-energy
  title: Oracle-distinct dual-encoding diagnostic energy on held-out families
  track: energy-verification
  priority: critical
  agent_type: codex
  model: gpt-5.5
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.08.587
  deliverable: results/experiment_6735_oracle_distinct_diagnostic_energy.json
  prompt: |
    CONTEXT:
    Earlier structural planning energy was blocked upstream. V587 instead has a frozen exact corpus
    with dual independent encodings and explicit translation-versus-reasoning labels. The learned
    score may diagnose and prioritize; it must not certify. A current-row exact outcome, answer key,
    solver-work counter, or certificate-validity bit in the feature vector would make the result
    circular and disqualify positive credit.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/openspec/capabilities/core-ebm/spec.md
    - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
    - {project_root}/openspec/capabilities/constraint-verification/spec.md
    - {project_root}/results/experiment_6733_hardness_controlled_certificate_stream.json
    - {project_root}/results/experiment_6734_sota_dual_encoding_proposal_corpus.json
    - {project_root}/results/experiment_6705_structural_plan_energy.json
    - Existing compact energy/calibration utilities under {project_root}/python/carnot

    TASK:
    Train a compact diagnostic energy from pre-oracle structural features and compare dual-encoding,
    single-encoding, and scalar-failure feature arms on held-out constraint families and
    proof-preserving relabelings. Predict translation versus reasoning errors without receiving any
    current-row exact-oracle information.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6734 and `dual_encoding_corpus_ready == true`; immutable row and
       split hashes; both encoder outputs; exact labels stored separately from admissible features;
       and enough class support to preregister held-family evaluation. Otherwise write
       `blocked_<gate>` with `gate_check_summary` and stop without backfilling labels.
    1. Confirm/add narrow REQ-* anchors in core-ebm and verifiable-reasoning specs. Write tests first
       for feature allowlists/denylists, split isolation, relabel pairing, seed determinism, metrics,
       and oracle-leak detection.
    2. Freeze admissible pre-oracle features and explicitly deny the exact verdict, ground-truth
       answer, certificate-validity bit, solver conflicts/decisions/runtime, post-check messages,
       and row IDs that encode family/label. Hash the frozen matrix before fitting.
    3. Use family-disjoint train/dev/test splits and keep proof-preserving relabel pairs together.
       Fit three comparable arms: dual-encoding disagreement/structure, single encoding, and one
       undifferentiated scalar-failure baseline. Match parameter/search budgets.
    4. Evaluate reasoning-error AUROC, translation-error AUROC, macro-F1, calibration error, and
       relabel stability per held-out row. Use order/family-aware bootstrap intervals and preserve
       all seeds, including failed fits.
    5. Run explicit oracle-leak probes: column/name audit, row-ID shuffle, label permutation, train
       only preprocessing, and a negative control. Set `oracle_leakage_detected` true on any breach.
       Set `verifier_is_oracle` false because an external exact checker owns labels and final truth.
    6. The repair gate is exactly `heldout_reasoning_error_auroc >= 0.65` AND
       `oracle_leakage_detected == false`. A finished sub-threshold run is `complete_null`/`null`,
       never blocked or partial.
    7. Run tests, spec coverage, lint, row-consistency lint, and adversarial verification; write the
       artifact atomically.
    8. REQUIRED ARTIFACT FIELDS, each documented in `field_principles`:
       `inference_substrate` (local compact energy on exact-corpus features), `duration_s` (wall
       time), `random_seed` (split/fit/bootstrap seeds), `reproducibility_checksum` (matrix/config
       hash), `upstream_corpus_hash` (immutable proposal rows), `feature_allowlist` (all admitted
       columns), `feature_denylist` (all oracle/post-check columns), `rows` (every evaluation
       unit/arm/seed), `metrics_by_arm_family` (row-derived), `heldout_reasoning_error_auroc` (exact
       downstream gate), `heldout_translation_error_auroc`, `macro_f1_by_arm`,
       `relabel_stability_by_arm`, `oracle_leakage_tests`, `oracle_leakage_detected` (exact downstream
       gate), `verifier_is_oracle` (false), `gate_check_summary` (failing upstream check/value on
       blocked paths), `verdict_class` (closed enum), and `honest_verdict` (terminal prefix). Use
       `local_compact_energy_heads_on_exact_solver_features_no_llm` as the substrate.

    Run command: `cd {project_root} && .venv/bin/python scripts/experiments/experiment_6735_oracle_distinct_diagnostic_energy.py`
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  gated_on:
    - upstream: exp6734-sota-dual-encoding-proposal-corpus
      artifact_field: dual_encoding_corpus_ready
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp6705-structural-plan-energy
      verdict: blocked_gate_check_failed
      addressed_by: 'The new energy trains on a completed dual-encoding exact corpus with family-disjoint splits and an explicit oracle-denylist, not the retired planning fixture chain.'
      retire_if_same_verdict: true
