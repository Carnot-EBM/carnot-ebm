  - id: exp6313-exact-code-safety-pair-fixture
    milestone: "2026.08.544"
    deliverable: results/experiment_6313_exact_code_safety_pair_fixture.json
    title: "Exact held-family vulnerable/fixed Python pair fixture"
    priority: critical
    track: energy_reasoning
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 90
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6311-v544-post-marker-source-scope-freeze
    prior_failures:
      - experiment_id: exp5853-paired-embedding-integrity-audit
        verdict: "disqualified: claim_flip_direction_cell_failure,disaggregated_cell_failure,label_or_pair_permutation_survives,norm_only_or_length_control_failure,raw_model_dimension_identity_shortcut"
        addressed_by: "This task builds a new exact code-safety label and split substrate before model inference; it does not fit or certify an embedding, and it adds held weakness families plus every control the prior fixture chain needed."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Activation Probes used paired vulnerable and fixed Python functions and held out weakness types. Carnot needs a local exact fixture before model inference. The fixture must prove only explicitly declared safety properties with executable and structural sidecars. It must not claim universal vulnerability coverage or use an LLM to assign labels.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md V544 Activation Probes entry
      - {project_root}/openspec/capabilities/code-verification/spec.md
      - {project_root}/openspec/capabilities/constraint-verification/spec.md
      - {project_root}/python/carnot/experiment_5840_exact_counterfactual_embedding_fixture.py
      - {project_root}/data and {project_root}/tests/python for existing exact code fixtures
      - {project_root}/ops/e2e-test-plan.md

      TASK
      Build a deterministic corpus of length-matched single-function vulnerable/fixed Python pairs across preregistered weakness families. Use exact compile checks, executable properties, AST or bounded constraint checks, and targeted mutations to prove each declared pair label. Split by complete weakness family, source family, template, and perturbation before any model state is extracted. Include A/A duplicates, semantically irrelevant edits, label permutations, pair swaps, and evaluator swaps as control manifests. Do not use generated labels or private external corpora without pinned license and provenance.

      Required deliverable: {project_root}/results/experiment_6313_exact_code_safety_pair_fixture.json.
      REQUIRED ARTIFACT FIELDS: status, fixture_scope_and_claim_boundary, weakness_family_taxonomy, source_and_license_receipts, pair_generator_version_and_hash, corpus_path_and_hash, sidecar_path_and_hash, control_manifest_path_and_hash, split_manifest_path_and_hash, pair_count_by_weakness_source_template_perturbation_and_split, compile_results, executable_property_results, ast_and_constraint_results, targeted_mutation_results, vulnerable_fixed_label_receipts, length_and_token_proxy_balance, duplicate_and_overlap_checks, held_weakness_source_template_and_perturbation_groups, evaluator_swap_definitions, positive_and_negative_control_results, invalid_or_excluded_rows, minimum_power_projection, exact_code_safety_fixture_ready_score, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, random_seeds, reproducibility_checksum, honest_verdict. verifier_is_oracle must be true because the sidecars assign exact fixture labels. Readiness requires zero split leakage and all exact sidecars to pass. field_principles must cover every required field.

      CONCRETE STEPS
      0. Inventory existing fixtures and licenses. Freeze weakness families, exact properties, split groups, minimum counts, and seeds before generation.
      1. Add REQ-CODE-6313 and scenarios before implementation. Update traceability.
      2. Generate pairs deterministically in a non-root data path. Match lengths without introducing label tokens or template IDs.
      3. Implement independent compile, executable property, AST or constraint, and mutation checks. Reject any pair without consistent sidecars.
      4. Freeze whole-group train, validation, and held splits. Prove no normalized-text, template, source, or mutation overlap.
      5. Create the adversarial control manifest without exposing held labels to later surface selection.
      6. Add unit, mutation, split-leakage, determinism, license, and 100% module coverage tests.
      7. Run focused and applicable e2e checks and adversarial verification.

      Run command: .venv/bin/python -m carnot.experiment_6313_exact_code_safety_pair_fixture --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6314-three-family-model-local-state-corpus
