      - upstream: exp5720-sota-attested-exact-envelope-canary
        artifact_field: validator_disagreement_count
        op: "=="
        value: 0
        principle: "The exact learning label must be unambiguous."
    prompt: |
      CONTEXT:
      This is the milestone's continuous self-learning experiment. The .509 active-spline conformal controller and disabled adapter remain the baseline; .510 produced no prospective evidence. Exp5720 supplies an attested prefix. MemOps motivates explicit remember, update, supersede, reflect, forget, reject, and rollback operations rather than final accuracy alone. GGUF weights stay immutable; no LLM runs here. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/results/experiment_5638_fr11_gate_schema_corrigendum.json
      - {project_root}/results/experiment_5639_anytime_valid_csl_independent_audit.json
      - {project_root}/results/experiment_5640_fr11_shadow_pipeline_integration.json
      - {project_root}/results/experiment_5720_sota_attested_exact_envelope_canary.json
      - {project_root}/python/carnot
      - {project_root}/openspec/capabilities
      - {project_root}/tests/python

      TASK:
      Consume Exp5720's committed prefix once in order, audit every FR-11 lifecycle operation prospectively, and emit results/experiment_5721_fr11_memops_lifecycle_shadow_stream.json.

      CONCRETE STEPS:
      1. Enforce gates; verify Exp5720 commitments and Exp5639/Exp5640 controller hashes. Prove the suffix remains unopened.
      2. Freeze controller parameters, label delay, groups, stopping times, baselines, retention margins, operation schema, and promotion rules before opening outcomes. Preserve chronology.
      3. Per row record frozen/current/previous-checkpoint decisions and losses before delayed exact label reveal. Exact rejection dominates and unusable rows cannot enter.
      4. Represent each event with trigger, target, scope, operation type, evidence, prior/proposed/committed hashes, and decision. Cover remember, update, supersede, reflect, forget, reject, rollback, and compositions.
      5. Update only the shadow active-spline/KAN controller when conformal rules permit. Never mutate GGUF weights, validators, prompts, order, or production defaults. Record no-op/abstention.
      6. Compare lifecycle adaptation with frozen, no-memory, last-window, inactive-KAN, always-adapt, always-abstain, corrupted-order, stale-evidence, and poisoned-label controls using paired metrics.
