  - id: exp4208-verifier-as-detector-auroc
    milestone: 2026.06.390
    title: "PHASE A1 (HEADLINE-COMPLEMENTARY; cheap, cached) -- verifier-as-DETECTOR measurement. The 2026-06-14 P0 item 2: where SELECTION headroom is ~0, can the verifier still FLAG/REJECT a wrong output? Compute detection AUROC (verifier_score ranking is_correct) + precision@recall=0.9 + the accuracy-vs-coverage abstention curve across cached pools {{Sudoku TRM snapshots, code HumanEval/MBPP, ARC GAP-4 pool, GSM8K}}, and report it AGAINST each domain's SELECTION headroom (.387/.388). The headline is the DIVERGENCE: detection value where selection had none. Positive/negative controls (base rate + random-AUROC~0.5); sanity-check decoding before trusting any number; declare verifier_is_oracle per domain. NO new generation, NO training."
    priority: high
    track: verifier-oracle-distinct
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4208_verifier_as_detector_auroc.json
    prompt: |
      CONTEXT: The 2026-06-14 P0 directive's COMPLEMENTARY axis. The SELECTOR metric (oracle@K - vote)
      only measures "can the verifier pick a better answer from a pool." It does NOT measure detection:
      can the verifier correctly FLAG/REJECT a wrong output (for abstention / "I don't know" /
      filtering). Detection has value EVEN where selection headroom is ~0 (e.g. Sudoku-at-convergence:
      no recoverable alternative to select, but the verifier can still tell you the answer is wrong).
      This isolates that axis. It is CHEAP -- uses data we ALREADY have, no new generation/training.

      EXISTING CODE TO READ FIRST:
        - docs/research-notes/verifier-as-detector-measurement-spec.md (THE SPEC -- follow it)
        - scripts/exp_verifier_detector_auroc.py (the probe -- extend/reuse, do NOT rewrite)
        - results/arc3_trm_verifier_rerank.json (ARC GAP-4 pool), results/experiment_4175_headroom_gate_executable_census.json (cached code/math pools + per-domain SELECTION headroom)
        - results/trm_runs/snapshots/ (Sudoku checkpoints) + nano-trm/src/nn/sudoku_evaluator.py (check_sudoku_validity)
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline" + "Adversarial Artifact Verification" (FALSE_NEGATIVE_RISK, the degenerate-detector trap)

      TASK: detection AUROC per domain vs SELECTION headroom; report the divergence; controls + decode sanity.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any compute): the cached pools above are loadable
           (`ls results/arc3_trm_verifier_rerank.json results/experiment_4175_headroom_gate_executable_census.json`)
           AND scripts/exp_verifier_detector_auroc.py imports. If any missing -> honest_verdict
           `blocked_detector_cached_pools_missing` and STOP. NO LLM generation in this task.
        1. For each domain load (output, is_correct) + compute the verifier_score per output (Sudoku:
           satisfied_constraints/total via check_sudoku_validity -- FIRST sanity-check that greedy exact
           reproduces ~0.79 test before trusting AUROC; code/math: the executable verifier; ARC: the
           GAP-4 demo-fit score).
        2. Compute detection_auroc (verifier_score vs is_correct) with bootstrap CI95, Brier,
           precision@recall=0.9, and the accuracy-vs-coverage abstention curve. CONTROLS: report the
           base rate (fraction correct) AND a random-score AUROC~0.5 baseline; AUROC must beat 0.5
           CI95-excl to count. On Sudoku ALSO report AUROC restricted to VALID-BUT-WRONG outputs (the
           hard detection case -- avoid over-claiming on the trivial invalid-grid split).
        3. Report per-domain {{detection_auroc, selector_headroom (from .387/.388), n, verifier_is_oracle}}.
           The headline is the DIVERGENCE: a high detection AUROC where selection headroom ~0.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A clean per-domain detector measurement (high AUROC where selection had none, OR AUROC~0.5 everywhere) is a COMPLETE, decision-grade result either way."
        detection_auroc_by_domain:
          principle: "BARE per-domain {{domain: auroc}} -- the detection axis the selector metric cannot see; value for abstention/precision even at zero selection headroom."
        selector_headroom_by_domain:
          principle: "BARE per-domain {{domain: oracle@K - vote}} from .387/.388 -- the contrast axis; the headline is detection >> 0.5 WHERE selector_headroom ~0."
        verifier_is_oracle_by_domain:
          principle: "Per-domain bool -- on code/Sudoku the executable check IS the oracle (circular/execution-grounded detector); declares honestly which domains' detection is oracle-distinct (Circularity Discipline)."
        controls:
          principle: "{{base_rate, random_auroc, valid_but_wrong_auroc(Sudoku)}} -- the positive/negative controls + the degenerate-detector guard that rule out a trivially-high AUROC (FALSE_NEGATIVE_RISK / the invalid-grid trap)."
        random_seed:
          principle: "Determinism precondition; the bootstrap AUROC must be reproducible."
        reproducibility_checksum:
          principle: "Hash of the cached pools scored; catches silent pool drift."
      ACCEPTANCE GATE:
        - condition: "detection_auroc_by_domain + selector_headroom_by_domain + controls all reported with bootstrap CI95 and decode sanity-checked, OR an honest blocked_* verdict"
          principle: "The detector axis is decided on the merits (divergence from the selector axis) with controls that rule out the degenerate near-perfect-on-invalid-grids trap."

      Run: `python3 {project_root}/results/experiment_4208_verifier_as_detector_auroc.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4209-oracle-distinct-arc-verifier-build
    milestone: 2026.06.390
    title: "PHASE A2 (HEADLINE BUILD) -- BUILD the ORACLE-DISTINCT learned ARC verifier. The 2026-06-14 P0 item 1: a LEARNED (not execution-oracle) verifier that scores ARC candidate solutions WITHOUT executing. REUSE the .386 V-STaR class (exp4176, arXiv:2402.06457: train on ACCEPTED + REJECTED traces -> a correctness boundary, not winner-imitation) on the ARC GAP-4 candidate pool (results/arc3_trm_verifier_rerank.json). Out-of-fold; report off-fold detection AUROC + the learned-verifier artifact path. verifier_is_oracle=false (it does NOT execute the demos). Deliverable consumed by A3. This is the oracle-distinct verifier CLASS the GAP-3 content energies lacked -- distilling the discriminating signal into a learned scorer."
    priority: high
    track: verifier-oracle-distinct
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct learned ARC verifier is MANDATED by the 2026-06-14 P0 directive (HEADLINE = an oracle-distinct learned/energy verifier closing GAP-3-ties-vote-on-ARC) -- false-positive scope-match vs the retired GAP-3 content-EBMs / prior V-STaR (exp4176); forward difference = the V-STaR learned-correctness-boundary class applied to the ARC GAP-4 pool, verifier_is_oracle=false, NOT a from-scratch content energy."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4209_oracle_distinct_arc_verifier_build.json
    prompt: |
      CONTEXT: The 2026-06-14 P0 HEADLINE. Carnot's verifier wins everywhere it can EXECUTE (code, ARC
      GAP-4) but those are CIRCULAR (verifier == executable oracle). The deep, defensible, UNPROVEN
      claim is an ORACLE-DISTINCT verifier: a LEARNED scorer that captures the discriminating signal
      WITHOUT executing -- generalizing off-oracle. The .386 V-STaR selector (exp4176, arXiv:2402.06457)
      is exactly this class (trains on accepted+rejected traces = a correctness boundary), already at
      AUROC 0.9792 on code. This task BUILDS the ARC version on the GAP-4 candidate pool; A3 measures
      whether it beats vote off-oracle.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4176_vstar_learned_selector.json + results/experiment_4176_vstar_selector_model.json (the V-STaR class + trainer to reuse)
        - results/arc3_trm_verifier_rerank.json (the ARC GAP-4 candidate pool: per-task candidate programs/outputs + is_correct labels)
        - python/carnot/agentic/arc_gap4_execution_verifier.py (the demo-fit/content-hash execution verifier -- its labels are the TRAINING TARGET, but the learned verifier must NOT call it at inference)
        - research-references.md ".390 planning sweep" (ARBITER 2605.26172, SCOPE 2512.15146, ThinkPRM 2504.16828, V-STaR 2402.06457)
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline" (verifier_is_oracle), "Principle-Annotated Artifact Fields"

      TASK: train an oracle-distinct learned ARC verifier (V-STaR-on-ARC) out-of-fold; report off-fold AUROC + artifact path.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE training): the ARC pool loads with candidate + is_correct labels
           (`python3 -c "import json; d=json.load(open('results/arc3_trm_verifier_rerank.json')); assert d"`)
           AND the V-STaR trainer is importable. If the pool lacks per-candidate correctness labels ->
           honest_verdict `blocked_arc_pool_no_candidate_labels` and STOP. CUDA optional (a small
           probe trains on CPU); if a GPU probe is used, `python3 -c "import torch; assert torch.cuda.is_available()"`.
        1. Featurize the ARC candidates oracle-distinctly: features the verifier can compute WITHOUT
           executing the demos at inference (e.g. learned embedding of the candidate program/output, grid
           statistics, per-region confidence a la SCOPE arXiv:2512.15146, self-consistency margin). The
           execution-verifier label (demo-fit) is the TRAINING TARGET only.
        2. Train the V-STaR selector on ACCEPTED + REJECTED candidates OUT-OF-FOLD (k-fold or
           held-out-task split so no task leaks train->test). Report off-fold detection AUROC + CI95.
        3. Persist the learned verifier (weights/artifact path) for A3. Set selector_trained=true and
           verifier_is_oracle=false. If the off-fold AUROC is ~0.5 (no learnable oracle-distinct signal)
           report honest_verdict `complete_oracle_distinct_arc_verifier_no_learnable_signal_auroc<x>` and
           still set the artifact path (A3 will read the null).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A trained off-fold verifier OR an honest 'no learnable oracle-distinct signal (AUROC~0.5)' is COMPLETE -- both feed A3."
        selector_trained:
          principle: "BARE bool: A3's gate compares this raw value (gated-fields-must-be-bare); true iff a learned ARC verifier artifact was persisted out-of-fold."
        oracle_distinct_auroc:
          principle: "BARE float: off-fold detection AUROC of the LEARNED verifier vs is_correct -- the oracle-distinct discrimination the GAP-3 content energies lacked; >0.5 CI95-excl is the precondition for an A3 beats-vote win."
        verifier_is_oracle:
          principle: "BARE bool=false -- the learned verifier scores WITHOUT executing the demos (Circularity Discipline); this is what makes an A3 win headline/gate-eligible, unlike the circular execution verifier."
        learned_verifier_path:
          principle: "The persisted artifact A3 loads to rerank held-out ARC candidates; the build deliverable."
        model_specs:
          principle: "The V-STaR probe architecture + feature set + any base used; required methodology."
        random_seed:
          principle: "Determinism precondition; the fold split + probe init seeded so the AUROC is reproducible."
        reproducibility_checksum:
          principle: "Hash of the ARC pool + fold split + features; catches silent pool/feature drift before A3 measures."
      ACCEPTANCE GATE:
        - condition: "selector_trained true with oracle_distinct_auroc + learned_verifier_path reported AND verifier_is_oracle=false, OR an honest no-learnable-signal / blocked_* verdict"
          principle: "A3 needs a persisted oracle-distinct verifier (or an honest null); a learned off-fold AUROC>0.5 is the precondition for testing whether it beats vote."

      Run: `python3 {project_root}/results/experiment_4209_oracle_distinct_arc_verifier_build.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4210-oracle-distinct-arc-verifier-beats-vote
    milestone: 2026.06.390
    title: "PHASE A3 (THE HEADLINE GATE, gated_on A2 selector_trained) -- does the ORACLE-DISTINCT learned ARC verifier BEAT majority vote OFF-ORACLE? On a HELD-OUT ARC candidate pool, rerank with the A2 learned verifier (verifier_is_oracle=false; does NOT execute the demos) vs majority-vote vs a MATCHED no-verifier control (same candidates/budget) vs oracle@K (the positive-control ceiling). The LOAD-BEARING gate: verifier@1 - vote@1, bootstrap CI95 EXCLUDES 0 AND headroom exists (oracle@K >> vote). Framed by ARBITER (arXiv:2605.26172) 'wrong-majority failures' -- the correct answer is in the pool but loses to a bigger wrong basin; the oracle-distinct verifier's job is to recover it. YES -> the first oracle-distinct verifier win (closes GAP-3-ties-vote; informs the DiffusionGemma gate). TIE-with-headroom -> honest null (GAP-3 frontier persists). No-headroom -> uninformative."
    priority: high
    track: verifier-oracle-distinct
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct beats-vote measurement is MANDATED by the 2026-06-14 P0 directive (HEADLINE; verifier_is_oracle=false + MATCHED control + CI95-excl-0) -- false-positive scope-match vs retired GAP-3 rerank/selector exps; forward difference = a LEARNED oracle-distinct verifier (A2), not the execution oracle, with the matched-control de-confound the prior circular wins lacked."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4210_oracle_distinct_arc_verifier_beats_vote.json
    gated_on:
      - upstream: exp4209-oracle-distinct-arc-verifier-build
        artifact_field: selector_trained
        op: '=='
        value: true
    prompt: |
      CONTEXT: THE .390 headline gate. A2 built an oracle-distinct learned ARC verifier (V-STaR-on-ARC,
      verifier_is_oracle=false). Now measure whether it BEATS majority vote on a HELD-OUT ARC pool --
      the deep, defensible claim the circular execution wins cannot make. ARBITER (arXiv:2605.26172)
      names the headroom precisely: "wrong-majority failures" -- sampled trajectories cluster into
      basins and vote picks the LARGEST basin, not the most accurate, so the correct answer is in the
      pool but loses. A learned verifier that recovers those is the oracle-distinct win. The MATCHED
      no-verifier control (same candidates, same budget) is the de-confound the prior circular wins
      lacked.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4209_oracle_distinct_arc_verifier_build.json (learned_verifier_path, oracle_distinct_auroc, verifier_is_oracle=false)
        - results/arc3_trm_verifier_rerank.json (the ARC candidate pool; use a HELD-OUT split disjoint from A2's training folds)
        - scripts/adversarial_verify.py (run it on the artifact -- check_circular_moat_overclaim), scripts/summarize_artifact.py
        - research-references.md ".390 sweep" (ARBITER 2605.26172 wrong-majority basins; SCOPE 2512.15146 minority-recovery; ThinkPRM 2504.16828 learned-verifier-beats-vote precedent)
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline" + "Adversarial Artifact Verification" (FALSE_NEGATIVE_RISK positive control)

      TASK: held-out ARC rerank -- learned verifier vs vote vs matched control vs oracle@K; the decisive CI95 gate.

      CONCRETE STEPS:
        0. PRECONDITIONS: A2 reported selector_trained=true with a readable learned_verifier_path. If
           missing/false -> honest_verdict `complete_oracle_distinct_arc_gate_deferred_no_built_verifier`
           and STOP.
        1. On a HELD-OUT ARC split (disjoint from A2 folds, N as large as the pool allows; if N<30 note
           the CLT-floor caveat), compute per-task: vote@1 (majority candidate), verifier@1 (candidate
           maximizing the A2 LEARNED score -- NO demo execution at inference), oracle@K (any candidate
           exactly correct = the POSITIVE CONTROL), and a MATCHED no-verifier control (same candidate
           budget, random/first selection) so the comparison is budget-equal (arXiv:2511.02886).
        2. POSITIVE CONTROL FIRST: if oracle@K ~= vote@1 (no recoverable headroom) the corpus is
           ceiling-saturated -> the null is UNINFORMATIVE (FALSE_NEGATIVE_RISK) -> report
           `complete_oracle_distinct_arc_no_headroom_uninformative`, do NOT claim the verifier fails.
        3. THE GATE: verifier_minus_vote = verifier@1 - vote@1, task-level bootstrap CI95 (>=2000
