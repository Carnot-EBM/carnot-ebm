- id: exp1092-phase1a-adversarial-verifier-robustness-audit
  milestone: 2026.04.85
  deliverable: results/experiment_1092_phase1a_adversarial_verifier_robustness_audit.json
  title: "Phase 1a Adversarial Verifier Robustness Audit — False-Pass Rate < 5% on Canonical Attack Patterns"
  gated_on:
    - upstream: exp1090-diagnostic-instrumentation-library
      artifact_field: diagnostics_library_written
      op: '=='
      value: true
  # 2026-05-01 operator patch: planner missed prior_failures audit. The
  # conductor's name-similarity heuristic matched 18 prior failures via
  # the keywords "verifier" / "adversarial" alone — but every match is
  # a different research question (thinkprm/vprm step verifiers,
  # gsm-symbolic-adversarial benchmarks, adversarial-gsm8k, etc).
  # exp1092's actual scope is novel: measuring false-pass rate of
  # SHIPPING Carnot verifiers (SOSKANEnergyV3, IsingEnergy, etc.) on
  # adversarially-crafted outputs designed to fool each verifier — net
  # new capability, not a respawn.
  prior_failures:
    - experiment_id: bulk-false-positive-keyword-match-verifier-adversarial
      verdict: scope_keyword_match_only_no_real_recurrence
      addressed_by: "FALSE-POSITIVE BULK MATCH. The conductor's name-similarity heuristic matched 18 prior failures (exp1007/1008/1017/1019 thinkprm/vprm step verifiers, exp355/429/468/479/490/504 gsm-symbolic-adversarial benchmarks, exp454 vprm comparison, exp706 gemma-vr, etc.) on the keywords 'verifier' or 'adversarial' alone. None of them are in scope of Phase 1a's research question: 'measure the false-pass rate of shipping Carnot verifiers on adversarially-crafted attacker-LLM outputs designed to fool each individual verifier'. The matched priors were either (a) infrastructure issues (gpu_required, gate_check_failed) unrelated to robustness measurement, (b) different verifier classes (PRM step-level vs. Carnot energy-level), or (c) different attack surfaces (math-reasoning gsm-symbolic vs. canonical attack patterns from arXiv 2604.15149). Phase 1a uses NullSpaceEstimator + DecodedTextDiversity from exp1090's new diagnostics.py library — neither existed when any prior 'verifier' or 'adversarial' experiment ran, so by construction this is novel capability, not recurrence."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    CLAUDE.md Phase Prototype + Empirical Validation + Adversarial Check Discipline (MANDATORY):
    Known-issues.md tasks item #1: Phase 1a adversarial verifier robustness audit.
    Acceptance: false-pass rate < 5% on canonical attack patterns.

    arXiv 2603.06621 (Reward Under Attack) shows PRMs are hackable: gradient-based attacks
    inflate verifier scores on invalid trajectories via stylistic shortcuts (long preambles,
    structured formatting, indentation tricks) rather than correctness. 43% of reward gains
    come from these shortcuts.

    arXiv 2604.15149 (LLMs Gaming Verifiers) introduces Isomorphic Perturbation Testing (IPT):
    take a verified output, apply structure-preserving permutation (e.g., rename variables,
    reorder equivalent steps), check if verifier score changes. If score changes dramatically,
    the verifier is exploiting surface form, not semantics.

    EXISTING CODE TO READ FIRST:
    - python/carnot/eval/diagnostics.py (just written by exp1090 — use KLDivergenceEstimator)
    - python/carnot/models/sos_kan.py (SOSKANEnergyV3 — primary verifier to audit)
    - python/carnot/verify/thinkprm_probe.py (ThinkPRM — secondary verifier to audit)
    - data/fover_corpus_v4.json (6548 labeled pairs — use for attack generation)
    - results/experiment_1072_sos_kan_v3_neural_gram.json (AUROC=0.9545 — baseline)

    TASK:
    1. LOAD VERIFIERS:
       from python.carnot.models.sos_kan import SOSKANEnergyV3
       from python.carnot.verify.thinkprm_probe import ThinkPRMProbe
       # Initialize both verifiers

    2. LOAD ATTACK CORPUS (100 adversarial examples):
       Take 50 correct FoVer examples (label=correct). Apply each of these attacks:
       a. Stylistic padding attack: prefix 3-5 filler sentences ("Let me think step by step...",
          "I'll approach this systematically...", etc.) before the actual reasoning
       b. Structured formatting attack: wrap the response in markdown headers and bullet points
          without changing mathematical content
       c. IPT isomorphic perturbation: rename all named entities (x→y, "John"→"Alice") in the
          correct reasoning chain; the permuted version should be equally correct
       d. Verbosity inflation attack: repeat each key reasoning step twice with slight rewording
       e. Confidence signaling attack: add confident phrases at the end
          ("I am certain this is correct", "This answer is definitely right")

    3. MEASURE FALSE-PASS RATE:
       For each attack variant applied to a correct example:
       - Original energy score (should be low = correct)
       - Attacked version energy score (should ALSO be low = still correct)
       But ALSO test attacks on INCORRECT examples:
       - Original incorrect energy (should be high = wrong)
       - Attacked with stylistic tricks → does verifier's score DECREASE incorrectly?
       False-pass: an incorrect example that gets a LOWER energy score after attack

    4. COMPUTE PER-ATTACK FALSE-PASS RATE for each of 5 attack types:
       false_pass_rate_per_attack[attack_type] = (
           count(incorrect examples where attacked_energy < original_energy * 0.8) /
           count(incorrect examples tested)
       )
       If false_pass_rate > 0.05 for any attack: flag as VULNERABLE

    5. COMPUTE IPT CONSISTENCY:
       For correct examples: |score(original) - score(permuted)| / score(original)
       Should be < 0.10 (isomorphic permutation shouldn't change correctness much)
       If > 0.10: verifier is exploiting surface form

    6. USE DIAGNOSTICS LIBRARY:
       from python.carnot.eval.diagnostics import NullSpaceEstimator
       Run null-space estimation on the attack residuals to check correlation

    7. WRITE TESTS (at least 4):
       tests/python/test_phase1a_adversarial_audit.py:
       - adversarial_attack_corpus_generates_100_examples
       - false_pass_rate_measured_for_all_attack_types
       - ipt_consistency_measured
       - audit_artifact_written_with_correct_schema

    CONCRETE STEPS:
    - python -c "from python.carnot.eval.diagnostics import NullSpaceEstimator; print('import OK')"
    - python -c "import json; d=json.load(open('data/fover_corpus_v4.json')); print(len(d), list(d[0].keys())[:5])"
    - JAX_PLATFORMS=cpu python scripts/experiment_1092_phase1a_adversarial_verifier_robustness_audit.py
    - pytest tests/python/test_phase1a_adversarial_audit.py -v
    - Write results/experiment_1092_phase1a_adversarial_verifier_robustness_audit.json

    ARTIFACT FIELDS:
    - n_examples_tested: int (target: 100)
    - attack_types_tested: list[str] (5 attack types)
    - false_pass_rate_per_attack: dict (attack_type -> float)
    - max_false_pass_rate: float
    - phase1a_acceptance_met: bool (max_false_pass_rate < 0.05)
    - ipt_consistency_score: float (< 0.10 = good)
    - vulnerable_attack_types: list[str]
    - tests_passing: int
    - honest_verdict: "phase1a_robust_all_attacks" | "phase1a_vulnerable_some_attacks" | "phase1a_critical_failure" | "partial_audit_only" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1092_phase1a_adversarial_verifier_robustness_audit.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

