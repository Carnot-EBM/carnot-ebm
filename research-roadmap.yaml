- id: exp1199-kantize-soskan-4bit-quantization
  milestone: 2026.04.93
  deliverable: results/experiment_1199_kantize_soskan_4bit_quantization.json
  title: "KANtize SOS-KAN 4-bit Quantization — Edge Deployment Prep (arXiv 2603.17230)"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 25
  priority: medium
  requires_gpu: false
  prompt: |
    CONTEXT:
    arXiv 2603.17230 (KANtize, March 2026) demonstrates that KAN spline functions can be
    quantized to 4-bit and 8-bit representations with minimal accuracy loss. 8-bit preserves
    >99% accuracy; 4-bit shows ~2% AUROC degradation but 2x memory reduction. Spline endpoint
    quantization is more sensitive than interior quantization.

    The SOS-KAN energy verifier achieves AUROC=0.9902 at full precision (32-bit float).
    If 4-bit quantization preserves AUROC > 0.97, the quantized model fits in ~2.2MB and is
    deployable on consumer edge hardware without a discrete GPU:
    - AMD XDNA NPU (Ryzen AI, DirectML execution provider)
    - Intel AI Boost (OpenVINO)
    - Apple Neural Engine (CoreML)

    This directly supports Carnot's sovereignty claim: constraint verification on the laptop
    you already own.

