    - experiment_id: exp7050-v618-active-contract-preflight
      verdict: complete_disqualified_v618_markdown_yaml_contract_mismatch
      addressed_by: "V621 uses one five-column 12-row Markdown contract and one YAML contract with identical order, titles, deliverables, and structured gates."
      retire_if_same_verdict: true
    - experiment_id: exp7076-v620-contract-preflight
      verdict: complete_disqualified_v620_markdown_yaml_contract_mismatch
      addressed_by: "V621 replaces the stale 13-task document and eight-task YAML with an exact 12-task pair and tests the Markdown row parser against every row."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V620 failed its own contract audit because the Markdown promised 13 tasks
    while the execution YAML held eight. V621 defines exactly 12 tasks,
    exp7084 through exp7095, in one order. This audit is advisory. No science
    task gates on it, and the capstone remains ungated.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md section "V621 planner refresh"
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7076_v620_contract_preflight.json
    - {project_root}/results/experiment_7063_v619_contract_preflight.json
    - {project_root}/python/carnot/experiment_7076_v620_contract_preflight.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_fit_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/openspec/capabilities/research-harnesses/spec.md

    TASK:
    Build and run an independent active-YAML versus Markdown contract check.
    Check count, order, full IDs, titles, deliverables, structured gates,
    producer fields, prior failures, agent routing, model declarations,
    substrate classes, prompt tails, and the ungated capstone. Do not activate
    or rewrite either roadmap.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable active `research-roadmap.yaml`, the V621
       design document, exclusion manifest, and writable artifact path. Do not
       require `research-roadmap-next.yaml` at execution. On failure write a
       terminal `blocked` verdict, `inference_substrate_class=blocked_no_run`,
       and exact gate_check_summary.
    1. Add REQ-REPORT-7084 and RED tests before implementation. Cover 12 exact
       five-column Markdown rows, missing, extra, and reordered rows, pipe-
       corrupted rows, changed titles and deliverables, malformed gates,
       incomplete prior failures, missing prompt tails, and a gated capstone.
    2. Parse Markdown and YAML independently. Do not generate both views from
       one object, constant, or parser result.
    3. Require milestone 2026.09.621 and ordered full IDs
       exp7084-v621-contract-preflight through exp7095-v621-capstone. Require
       exact title, deliverable, structured gate, and prior-failure parity.
    4. Require each gate producer to occur earlier and to name an exact bare
       top-level field in that producer's REQUIRED ARTIFACT FIELDS.
    5. Require all four prior_failures fields, per_unit_rows on comparisons,
       closed verdict_class values, blocked diagnostics, a closed
       inference_substrate_class, coherent agent routing, the exact prompt
       tail, and an ungated Exp7095.
    6. Require every local-LLM task to declare MODEL_SPECS, include at least one
       mandated SOTA GGUF, use cached_sota_pair(), and forbid a legacy-small
       headline fallback. Exp7085 and Exp7086 must include all three families.
    7. Set v621_task_contract_conforms_score=1 only if all 12 independently
       parsed rows agree. A mismatch is `disqualified`; a missing runtime
       prerequisite is `blocked`; neither is `partial`.
    8. Run focused tests, YAML parsing, roadmap schema validation, gate audit,
       exclusion-manifest lint, harness-fit lint, artifact validation,
       adversarial verification, row-consistency lint, scoped spec coverage,
       and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (independent Markdown and YAML contract replay);
       inference_substrate_class (aggregation, or blocked_no_run on a blocked
       precondition); duration_s; source_artifact_hashes; rows;
       markdown_task_rows; yaml_task_rows; task_contract_rows;
       title_parity_rows; deliverable_parity_rows; gate_contract_rows;
       gate_producer_rows; prior_failure_rows; model_compliance_rows;
       agent_routing_rows; substrate_class_rows; artifact_field_rows;
       prompt_tail_rows; expected_task_count (12); observed_task_count;
       expected_id_order; observed_id_order; active_roadmap_path;
       staging_file_required_at_execution (false);
       v621_task_contract_conforms_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

