  - id: exp1930-pypi-workflow-status-check
    title: "Exp 1930: PyPI workflow status check (v0.1.0b1 tag pushed; workflow waiting on operator approval)"
    deliverable: results/experiment_1930_pypi_status.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1910-phase1-pypi-publish-via-ci-tagged-release
        verdict: blocked_workflow_run_pending_at_pypi_environment_approval
        addressed_by: "exp1910 (.194) pushed the v0.1.0b1 tag successfully (visible at origin: 5a681a190cce5b33a14f247c2d14464d041f99ef) but the GitHub Actions workflow run entered 'Waiting' state — the `pypi` environment has a protection rule requiring manual reviewer approval (per .github/workflows/publish-pypi.yml line 77-79). PyPI itself confirms 404 for carnot-ebm/0.1.0b1 — package NOT YET PUBLISHED. This task does NOT push another tag (would fail with 'already tagged'); it CHECKS the workflow status + reports actionable next step."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: exp1910 (.194) successfully pushed git tag v0.1.0b1 to
      origin (commit 5a681a190cce5b33a14f247c2d14464d041f99ef on
      Carnot-EBM/carnot-ebm). The publish-pypi.yml workflow triggered
      but entered 'Waiting' state pending manual approval at the GitHub
      `pypi` Environment (protection rule requires reviewer per the
      workflow file lines 77-79: `environment: name: pypi, url:
      https://pypi.org/p/carnot-ebm`). PyPI API returns 404 for
      carnot-ebm 0.1.0b1 — package NOT YET PUBLISHED.

      FALSIFIABLE HYPOTHESIS: The workflow run for tag v0.1.0b1 is
      currently in one of three states: (a) still Waiting on operator
      environment approval, (b) approved-and-completed (PyPI 0.1.0b1
      reachable), or (c) approved-and-failed (workflow ran but build
      or publish step failed). This task identifies which.

      EXISTING CODE TO READ FIRST:
        - .github/workflows/publish-pypi.yml (the OIDC workflow;
          environment: pypi requires reviewer approval per lines 77-79)
        - results/experiment_1910_pypi_publish.json (the prior
          attempt's partial-success state)
        - feedback_pypi_publish_via_ci_tagged_release memory entry

      TASK: Check workflow status; report actionable next step.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `command -v gh` succeeds — else
              `blocked_gh_cli_unavailable_use_web_check`.
           b. `gh auth status` returns authenticated — else
              `blocked_gh_auth_needed`.
           c. `git ls-remote --tags origin | grep "v0.1.0b1"` returns
              the tag hash — else `blocked_tag_not_on_origin` (would
              need exp1910 retry).
           Record preconditions_checked.
        1. List recent workflow runs:
           `gh run list --workflow=publish-pypi.yml --limit 5
            --repo Carnot-EBM/carnot-ebm --json
            databaseId,status,conclusion,headBranch,event,createdAt,url`.
        2. Identify the run triggered by tag v0.1.0b1 (event=push,
           headBranch=refs/tags/v0.1.0b1 OR similar).
        3. Classify status:
           - status=waiting → operator approval needed. Output
             actionable line: "Approve at <url>".
           - status=completed AND conclusion=success → verify PyPI
             via fresh subprocess: `pip install --index-url
             https://pypi.org/simple/ carnot-ebm==0.1.0b1` in tmpdir.
           - status=completed AND conclusion=failure → fetch the
             failed-step logs: `gh run view <id> --log-failed
             --repo Carnot-EBM/carnot-ebm` (truncated to 50 lines).
        4. Optional: poll for up to 5 minutes if status=in_progress.
        5. Output: workflow_status + workflow_url + pypi_status (404
           if not published yet; reachable URL if published) +
           actionable_next_step (e.g., "Operator: approve at <url>"
           OR "Workflow succeeded; verify install").

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.pypi_workflow_status_check.v1"
        - experiment: 1930
        - run_date: ISO-8601 UTC
        - duration_s: > 15s (gh + pip verify)
        - random_seed: 173130
        - reproducibility_checksum: sha256 of (workflow file + tag
          ref + gh CLI version)
        - preconditions_checked: list
        - model_specs: {{workflow_file: ".github/workflows/publish-pypi.yml",
          tag_checked: "v0.1.0b1", tag_commit_origin: str}}
        - n_samples: 1 (status check; single workflow run)
        - n_samples_justification: "Status check task; n=1."
        - workflow_run_id: int or null
        - workflow_run_url: str
        - workflow_run_status: "waiting" | "in_progress" | "success" | "failure" | "not_triggered"
        - workflow_run_conclusion: str or null
        - pypi_url_reachable: bool
        - pypi_url: str or null
        - external_install_verified: bool
        - actionable_next_step: str (one of: "operator_approve",
          "verify_install", "investigate_workflow_failure", "no_action")
        - failed_step_excerpt: str or null (only if conclusion=failure)
        - acceptance_gate_passed: bool (status identified AND
          actionable_next_step set; NOT gated on PyPI being published)
        - acceptance_gate_criteria: "Workflow status accurately reported
          with an actionable next step for the operator."
        - methodology_note: "STATUS CHECK task. This does NOT push tags
          or re-publish. exp1910 pushed v0.1.0b1; this task only reports
          the downstream state. If status=waiting, the actionable next
          step is operator manual approval at GH Environment 'pypi'."
        - optimization_direction: "neither — status check"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push tags. Do NOT modify
      scripts/research_conductor.py.

