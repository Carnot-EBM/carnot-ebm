    \ and sequential inference. The fix: an InferenceBatchingAudit that scans harness\
    \ scripts for multi-model loads without explicit cuda:1 assignment and flags them.\
    \ Additionally, create DualGPUHarness: a mixin/wrapper that patches any model_specs\
    \ list to assign cuda:0/cuda:1 explicitly. This closes the harness-adoption gap\
    \ without requiring manual re-implementation of each benchmark script.\n\nEXISTING\
    \ CODE TO READ FIRST:\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/dual_gpu_assigner.py — DualGPUAssigner (Exp 462)\n- python/carnot/pipeline/deliverable_guard.py\
    \ — DeliverableGuard (Exp 462)\n- scripts/experiment_template.py — ExperimentTemplate,\
    \ setup_gpu()\n- scripts/experiment_476_live_100q_precision_v4.py — dual-model\
    \ benchmark\n- scripts/experiment_478_live_200q_vericot_vprm_v2.py — dual-model\
    \ benchmark\n\nTASK: Implement DualGPUHarness and HarnessAudit to enforce cuda:1\
