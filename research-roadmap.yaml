      live depth-first explorer (value_weight reverted 5.0->0.0, arc_competition_agent.py:60 "slower than bare BFS,
      solved fewer games, the 25-game sim timed out"; arc_offline_to_live_bridge_v2 "does not transfer to the live
      depth-first explorer"). Three candidate causes to ISOLATE (this is the explicit next step): (1) COMPUTE-COST
      -- computing the value per frontier node slows bounded-time search; (2) DISTRIBUTION-SHIFT -- trained on
      winning-path states, applied to off-path frontier states it never saw; (3) CALIBRATION -- a 0.725 RANKING is
      not a usable A* cost. NO 3090; any optional LLM arm runs on the iGPU Qwen3.5-9B-MTP and declares
      live_llm_inference for THAT arm only. verifier_is_oracle: false (a learned value, oracle-DISTINCT from the
      executable win-check). Honest result either way -- the DIAGNOSIS is the deliverable.

      EXISTING CODE TO READ FIRST:
        - {project_root}/docs/research-notes/arc-representation-not-the-bottleneck-2026-06-23.md (the re-diagnosis: the three candidate causes + the fixes they indicate)
        - {project_root}/results/arc_offline_to_live_bridge_v2.json + {project_root}/results/arc_offline_to_live_bridge_v1.json (the plumbed-but-non-transferring bridge -- the prior characterization)
