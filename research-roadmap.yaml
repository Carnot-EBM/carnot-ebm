      4. Launch owner-bound llama.cpp CUDA processes. Generate one matched proposal pool per event from all three models. Retain raw outputs and process receipts. Do not regenerate proposals based on arm state.
      5. Clone identical initial energy and optimizer state into frozen, immediate-write-through, and exact-admitted retention-safe arms. For every arm and event, rank and commit before exact labels become readable.
      6. After all arm predictions for an event commit, reveal exact validity and action gaps. Update only the two online arms between events. The safe arm must run protected-family probes and roll back any rejected update byte-exactly.
      7. After every event record pre-event state, selected proposal, exact post-event metrics, gradients, acceptance, rollback, old-family retention, and next-state hash. Checkpoint and restart at preregistered boundaries.
      8. Report per-order and pooled-by-independent-order prequential regret, exact validity, learning speed, update acceptance, old-family retention, negative transfer, restart equivalence, paired deltas, intervals, wins, losses, ties, no-headroom, and missing events. Do not treat events within one order as independent replicates.
      9. Attack future-label access, proposal regeneration, arm-specific pools, snapshot aliasing, duplicate admission, order leakage, poisoned labels, retention bypass, selective family omission, restart divergence, and missing-to-zero coercion.
      10. Set prequential_csl_ready=true when every planned stream/order/arm event and safety receipt is complete. Set csl_improvement_supported=true only if the safe arm improves the primary metric over frozen with its interval excluding zero, has no protected-family regression, and passes every attack.
      11. Write atomically. Unload servers and release leases. Run focused tests, scoped coverage, spec coverage, row/artifact/adversarial checks, applicable E2E checks, and git status.

