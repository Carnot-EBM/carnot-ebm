    arXiv:2602.06737 proposes replacing each KAN spline unit with a piecewise
    affine (PWA) abstraction with bounded error, then encoding property
    verification as a Mixed Integer Linear Program (MILP). For Carnot, formal
    verification of the GS-KAN energy tier would let us claim certified energy
    bounds: "for all inputs satisfying property P, GS-KAN energy is bounded
    above by E_max." This is a CPU-only formal software proof; no hardware
    execution is claimed. Use {project_root} as the project root and {date} as
    the run date.

