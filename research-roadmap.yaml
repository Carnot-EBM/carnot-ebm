- id: exp1093-phase1c-verifier-joint-null-space-measurement
  milestone: 2026.04.85
  deliverable: results/experiment_1093_phase1c_verifier_joint_null_space_measurement.json
  title: "Phase 1c Verifier Joint Null-Space Measurement — dim(∩ ker E_i) < 5% of Input Space"
  gated_on:
    - upstream: exp1090-diagnostic-instrumentation-library
      artifact_field: diagnostics_library_written
      op: '=='
      value: true
  # 2026-05-01 operator preemptive patch: 10 priors matched on 'verifier' /
  # 'null-space' keywords. None recur in scope — Phase 1c uses
  # NullSpaceEstimator from exp1090's new diagnostics.py (didn't exist
  # in any prior). Same pattern as exp1090/exp1092 patches.
  prior_failures:
    - experiment_id: bulk-false-positive-keyword-match-verifier-null-space
      verdict: scope_keyword_match_only_no_real_recurrence
      addressed_by: "FALSE-POSITIVE BULK MATCH. The conductor's name-similarity heuristic matched 10 prior failures on the keywords 'verifier' or 'null-space' alone. Phase 1c's actual research question is novel: empirically estimate dim(∩_i ker(E_i)) for the deployed Carnot verifier suite (SOSKANEnergyV3, IsingEnergy, etc.) using exp1090's new NullSpaceEstimator class. The matched priors are different verifier classes (PRM step-level, vprm comparisons) or different research questions (manifold-null-space ablation studies). Phase 1c's diagnostic class didn't exist when any matched prior ran, so by construction this is novel measurement work, not recurrence."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    CLAUDE.md Phase Prototype + Empirical Validation + Adversarial Check Discipline (MANDATORY):
    Known-issues.md task item #2: Phase 1c verifier joint null-space measurement.
    Acceptance: joint null-space dimension < 5% of input space.

    The joint null space ∩_i ker(E_i) is the set of inputs where ALL verifiers agree a response
    is correct (low energy) even though it may be wrong. As shown in research-notes/ Phase-3
    derivation, a single verifier's null space can be large (~50% of inputs). AND-composition
    of k verifiers shrinks the joint null space exponentially — but only if verifiers are
    sufficiently DIVERSE (low r-correlation per arXiv 2604.12086).

    This experiment empirically measures how diverse Carnot's current 4-6 verifiers are
    and whether the joint null space is acceptably small.

    EXISTING CODE TO READ FIRST:
    - python/carnot/eval/diagnostics.py (NullSpaceEstimator, r_correlation method)
    - python/carnot/models/sos_kan.py (SOSKANEnergyV3)
    - python/carnot/verify/thinkprm_probe.py (ThinkPRMProbe)
    - python/carnot/verify/ (list all verifier files — find all active verifiers)
    - data/fover_corpus_v4.json (6548 labeled pairs — evaluation corpus)
    - results/experiment_1092_phase1a_adversarial_verifier_robustness_audit.json (preceding experiment)

    TASK:
    1. ENUMERATE ACTIVE VERIFIERS:
       ls python/carnot/verify/
       ls python/carnot/models/
       Identify all verifiers: ThinkPRM, SOS-KAN v3, Ising EBM, SpilledEnergy, NUP probe, etc.

    2. LOAD EACH VERIFIER and score the FoVer corpus:
       Load 500 random examples from data/fover_corpus_v4.json (balanced: 250 correct, 250 wrong)
       For each example, get energy score from each active verifier.
       Record: verifier_name -> np.array(500,) of energy scores

