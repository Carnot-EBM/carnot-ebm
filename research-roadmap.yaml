- id: exp1086-wopr-nqueens-cartridge
  milestone: 2026.04.84
  deliverable: results/experiment_1086_wopr_nqueens_cartridge.json
  title: "WOPR N-Queens Cartridge — Ising Ground-State for Classical CSP (harder than Lights Out)"
  prompt: |
    CONTEXT:
    The WOPR Lights Out cartridge (exp1071) demonstrated Carnot's Ising energy as a
    real puzzle solver: E=0 at ground state = valid solution. N-Queens is the next harder
    puzzle: place N queens on an N×N board so no two share a row, column, or diagonal.
    This is a classical constraint satisfaction benchmark that EVERY AI system is tested on.

    Ising formulation for N-Queens:
    - Binary variables: s_(ij) ∈ (0,1) (queen placed at row i, col j)
    - Constraints:
      * Exactly one queen per row: (Σ_j s_(ij) - 1)^2 = 0 for each row i
      * Exactly one queen per column: (Σ_i s_(ij) - 1)^2 = 0 for each col j
      * At most one queen per diagonal: Σ_(k) s_(i+k,j+k) ≤ 1 for each diagonal
    - Energy: E = Σ (constraint_violations)^2  (ground state E=0 ↔ valid placement)

    N=8 (8-Queens) is the canonical version: E=0 has exactly 92 distinct solutions.

    EXISTING CODE TO READ FIRST:
    - spaces/wopr-games/games/ (existing cartridge files — understand WOPRGame interface)
    - spaces/wopr-games/games/lights_out.py (Ising solver pattern to reuse)
    - spaces/wopr-games/app.py (WOPRGame interface definition)
    - python/carnot/samplers/parallel_ising.py (ParallelIsingSampler)

    TASK:
    Implement spaces/wopr-games/games/nqueens.py following the WOPRGame interface.

    CARTRIDGE FLOW:
    1. WOPR shows: "THREAT ASSESSMENT: N-QUEENS CONFIGURATION"
    2. Display 8×8 chessboard with queens shown as 'Q' characters
    3. Start with random initial placement (8 queens, row-by-row)
    4. WOPR shows "COMPUTING OPTIMAL PLACEMENT..." as Ising sampler runs
    5. Animation: queens jump to new positions as energy decreases (show every 500 steps)
    6. When E=0 (valid 8-Queens solution): "OPTIMAL CONFIGURATION ACHIEVED. ENERGY = 0."
       Show final board with all 8 queens in valid positions.
    7. Show a 1-line explanation: "NO TWO PIECES THREATEN EACH OTHER. THREAT LEVEL: ZERO."
    8. Return to WOPR main menu.

    MAX ITERATIONS: 50000 for 8-Queens (harder than 25-spin Lights Out).
    Display every 1000 iterations or when energy drops.

    ISING ENCODING for 8-Queens (N=8, 64 spins):
    - Spin index: i*8 + j for row i, col j (64 spins total)
    - Coupling matrix J: negative coupling between same-row, same-col, same-diagonal spins
      (same-row: J[i*8+j, i*8+k] = -1 for j != k)
      (same-col: J[i*8+j, k*8+j] = -1 for i != k)
      (same-diag: J[i*8+j, k*8+l] = -1 where |i-k|==|j-l| and i!=k)
    - Use ParallelIsingSampler with temperature schedule (start high, anneal to 0.01)

    TESTS in tests/python/test_nqueens_cartridge.py (at least 5):
    - nqueens_coupling_matrix_has_correct_constraints
    - nqueens_energy_zero_for_valid_8queens_solution
    - nqueens_energy_positive_for_invalid_placement
    - nqueens_ising_reaches_ground_state_within_50000_iters
    - nqueens_final_placement_no_queens_threaten_each_other

    CONCRETE STEPS:
    - (read existing cartridges for interface)
    - (implement nqueens.py with Ising solver + board display)
    - pytest tests/python/test_nqueens_cartridge.py -v
    - Write results/experiment_1086_wopr_nqueens_cartridge.json

