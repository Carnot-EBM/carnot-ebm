    CONCRETE STEPS:
    1. Create results/experiment_1537_beaver_prefix_bound_contracts_v3.json immediately with status="in_progress".
    2. Select contract/decoder cases from exp1535 that expose prefix states and deterministic accept/reject labels.
    3. Implement a bounded prefix trie/frontier audit. Use local SOTA logprob/top-k data if the runner exposes it; otherwise record token_logprob_available=false and run a structural bound simulation.
    4. Produce high-risk instance rankings and compare them with deterministic validator outcomes.
