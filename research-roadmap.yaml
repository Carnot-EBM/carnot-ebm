        mechanism_attribution_note: principle="string: which optimizer actually did the work and whether PT was effective."
        random_seed: principle="determinism; content-derived, NOT the experiment number."
        reproducibility_checksum: principle="content hash of instance set + encoding + optimizer configs + seed."
        duration_s: principle="CPU global-opt over a HARD non-trivial corpus takes real wall time; honest value (not sub-second — exp3518's 0.49s signalled trivial instances)."

      ACCEPTANCE GATES:
        - condition: "encoding_validity_E0 == true AND vanilla_descent_solve_rate < 0.9 AND vanilla_descent_solve_rate_hard_tier < 1.0 AND exact_baseline_solve_rate == 1.0 AND n_instances >= 30"
          principle: "G0 HEADROOM-PRESERVED (the operator's full 3-conjunct gate): valid encoding, the trivial baseline below ceiling GLOBALLY AND on the HARD TIER specifically (a global <0.9 could hide a saturated hard tier), instances solvable, sample large enough — the exp3518 CEILING_SATURATION fix."
