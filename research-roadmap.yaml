#      Per project_energy_selection_thesis_bounded, energy selection is settled-bounded; exp3672 stands
#      as the earned-negative. .339 formally CLOSES the diagnosis question (recommend retirement) rather
#      than grinding a third attempt -- a convergence move, not a re-run.
#  (D) KV260 is SSH-reachable again (exp3698) after 8 unreachable milestones. Per north-star sec-3 it is
