      - cited_upstream_artifacts: list (principle: corrigendum claims must trace to source artifacts)
      - inference_substrate: dict (principle: aggregation artifacts must not claim live inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3031-dccd-structured-repair-panel
    milestone: "2026.05.284"
    deliverable: "results/experiment_3031_dccd_structured_repair_panel_v1.json"
    title: "Draft-conditioned constrained repair panel"
    priority: medium
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 50
    estimated_wall_time_min: 70
    track: "code_repair"
    inference_substrate: "local_sota_gguf"
    requires_gpu: true
    gated_on:
      - upstream: exp3027-adversarial-flag-methodology-corrigendum
        artifact_field: methodology_corrigendum_ready
        op: "=="
        value: true
      - upstream: exp3027-adversarial-flag-methodology-corrigendum
        artifact_field: sota_headline_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3015-cactus-style-repair-acceptance-controller
        verdict: "complete: cactus-style repair acceptance controller ready"
        addressed_by: "Adds a tiny draft-conditioned constrained repair panel to test whether preserving draft intent reduces structured repair drift beyond acceptance-only gating."
        retire_if_same_verdict: true
      - experiment_id: exp3016-sota-repair-rerun-with-acceptance-controller
        verdict: "complete: acceptance-controlled SOTA repair rerun gates passed"
        addressed_by: "Tests a different technique, DCCD-style draft conditioning, before any future broader repair expansion."
        retire_if_same_verdict: true
      - experiment_id: exp3003-gated-sota-repair-metamorphic-false-accept-rerun
        verdict: "flagged: metamorphic repair rerun did not clear gates"
        addressed_by: "Targets the earlier syntax/schema and false-accept failure mode with draft-conditioned structure enforcement and explicit intent-drift metrics."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Draft-Conditioned Constrained Decoding (DCCD) suggests generating an unconstrained semantic draft, then applying constrained decoding conditioned on that draft to preserve validity without losing intent. Carnot's use is narrower: a tiny repair panel that compares unconstrained repair, acceptance-only repair, and draft-conditioned constrained repair.

      MODEL_SPECS
      Headline SOTA local GGUF candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      At least one headline model must be used for live generation. Legacy small models are smoke tests only and cannot support headline claims.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3013_sota_gguf_logprob_telemetry_preflight_v1.json
      - results/experiment_3014_repair_syntax_schema_failure_taxonomy_v1.json
      - results/experiment_3015_cactus_style_repair_acceptance_controller_v1.json
      - results/experiment_3027_adversarial_flag_methodology_corrigendum_v1.json
      - datasets/repair_hard/manifest_v1.jsonl if present
      - python/carnot/verify/ if needed
      - tests/python/ if needed

      TASK
      Implement or script a tiny DCCD-style structured repair panel over existing repair-hard cases. Compare unconstrained draft repair, acceptance-only constrained acceptance, and draft-conditioned constrained repair. Keep the sample small and evidence-rich.

      CONCRETE STEPS
      0. PRECONDITIONS: record GPU/model cache status, repo commit, selected headline GGUF, and test fixture availability. If no headline model can load, write blocked_sota_headline_model_unavailable and stop.
      1. Select a tiny fixed panel from repair_hard or prior exp3003/exp3016 cases with known failing traces and validators.
      2. For each case, capture the unconstrained semantic draft before applying schema/syntax constraints.
      3. Apply the existing acceptance controller and a simple draft-conditioned constraint pass. Do not implement a broad decoding framework unless a small local helper is enough.
      4. Measure strict validity, pass rate, schema/syntax failures, false accepts, and intent_drift_count for each condition.
      5. Write tests only for new deterministic helpers. Keep all code changes scoped and list changed files in the artifact.

      REQUIRED ARTIFACT FIELDS:
      - dccd_panel_ready: bool (principle: the panel must be complete before it can influence the matrix)
