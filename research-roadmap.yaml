      4. Emit a structure-side receipt proving every declared variable, domain, hard constraint, soft preference, and transition is represented. Emit a solution-side receipt proving feasibility and objective value for every candidate. Solver exit success alone is insufficient.
      5. Include exact-solver native ordering, random permutation seeds, and a deterministic non-learned energy heuristic. Add adversarial omitted-constraint, omitted-candidate, duplicate-candidate, infeasible-best-score, shortcut, and objective-sign controls.
