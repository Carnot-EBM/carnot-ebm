    - Validity: scoped checks, raw custody and independent replay pass. principle: invalid evidence cannot support science.
    - Readiness: named ready/complete scores are bare numeric 0/1. principle: a valid null remains reusable.
    - Benefit: satisfy every task-specific support, effect and uncertainty criterion. principle: completion cannot substitute for empirical value.

