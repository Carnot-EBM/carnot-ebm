  - id: exp4231-oracle-distinct-arc-aggregator-build
    milestone: 2026.06.392
    title: "PHASE A1 (HEADLINE BUILD; STRENGTHEN) -- BUILD a CROSS-CANDIDATE SET-ENCODER AGGREGATOR for the oracle-distinct ARC verifier, fixing the .391 null's three causes. .391's build (exp4220) was a per-candidate LOGISTIC REGRESSION (scored each candidate in ISOLATION) trained on 14 ACCEPTED / 1782 REJECTED rows (base-rate 0.008, off-fold AUROC 0.779). FIX: (1) CROSS-CANDIDATE features/architecture -- a permutation-invariant set-encoder over the per-task candidate set (Set-Encoder 2404.06912; MSV 2603.03417 cross-sequence; AggLM 2509.06870 review/reconcile) so each candidate is scored CONDITIONED on its competitors (vote basin, cross-candidate agreement, competing transformation families); (2) CALIBRATED imbalance-aware loss (2509.19681: class-weighted/focal + temperature/isotonic calibration + stratified-balanced minibatches) so the 14-positive slice does not wash out; (3) GROW the labeled pool toward >=30 held-out wrong-majority tasks (reuse scripts/exp_verifier_detector_auroc.py:load_arc_rows over the GAP-4 pools; add games if available). Out-of-fold; verifier_is_oracle=false. Report off-fold AUROC + aggregator_trained + learned_verifier_path + wrong_majority_n + held_out_task_n. Honest no-learnable-signal is COMPLETE and still persists for A2."
    priority: high
    track: verifier-oracle-distinct
    max_turns: 80
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct learned ARC verifier is MANDATED by the 2026-06-14 P0 directive (HEADLINE = an oracle-distinct learned verifier closing GAP-3-ties-vote-on-ARC) -- false-positive scope-match vs retired GAP-3 content-EBMs / prior selector (exp4220); forward difference = a CROSS-CANDIDATE set-encoder AGGREGATOR (not isolated logistic regression) + a CALIBRATED imbalance-aware loss + a GROWN >=30-held-out pool, verifier_is_oracle=false."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4231_oracle_distinct_arc_aggregator_build.json
    prior_failures:
      - experiment_id: exp4220-oracle-distinct-arc-verifier-build-labeled
        verdict: complete_oracle_distinct_arc_verifier_trained_auroc_0.7790
        addressed_by: "exp4220 trained a per-candidate LOGISTIC REGRESSION that scored each candidate in ISOLATION on 14 accepted/1782 rejected rows (base-rate 0.008), off-fold AUROC 0.779 -- too weak/imbalanced to recover wrong-majority answers, and the downstream A2 gate (exp4221) consequently TIED vote on n=14. This attempt changes the ARCHITECTURE (a permutation-invariant CROSS-CANDIDATE set-encoder aggregator over the full per-task candidate set, per Set-Encoder 2404.06912 / MSV 2603.03417 / AggLM 2509.06870), the LOSS (calibrated imbalance-aware: class-weighted/focal + calibration + stratified-balanced minibatches, per 2509.19681), and GROWS the labeled pool toward >=30 held-out wrong-majority tasks -- the three named causes of the .391 null."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: The 2026-06-14 P0 HEADLINE, STRENGTHENED. .391 RAN the oracle-distinct beats-vote gate and the
      learned verifier TIED vote (exp4221, CLEAN), but the verifier was the WEAKEST possible build (a
      per-candidate logistic regression scoring each candidate in isolation, trained on 14 positives,
      off-fold AUROC 0.779) tested at the LOWEST power (n=14). Before concluding "oracle-distinct selection
      can't beat vote on ARC," it is owed the STRONGEST build at power. The .391 SOTA ingestion (exp4226)
      flagged exactly this: "train an ARC aggregator that recovers minority-correct answers instead of only
      assigning independent candidate scores."

      EXISTING CODE TO READ FIRST:
        - scripts/exp_verifier_detector_auroc.py (load_arc_rows + arc_rows_from_entries -- the WORKING ARC label path; reuse it; GROW the pool by including more games if available)
        - results/experiment_4220_oracle_distinct_arc_verifier_build_labeled.json + results/experiment_4220_oracle_distinct_arc_verifier_model.json (the .391 isolated logistic build to REPLACE: 14 accepted/1782 rejected, AUROC 0.779, wrong_majority_n 5)
        - results/experiment_4221_oracle_distinct_arc_verifier_beats_vote.json (the TIES gate the new build must improve on: delta -0.0714, n=14)
        - results/arc3_gap3_stage2_eval_pool.json.gz (entries[].candidates[]) + results/arc3_gap4_induced_programs.json (programs[] demo_fit + pred_grid)
        - research-references.md ".392 planning sweep" (Set-Encoder 2404.06912 cross-candidate attention; Calibrated Reasoning 2509.19681 imbalance-aware calibrated loss; MSV 2603.03417; AggLM 2509.06870; margin-trigger 2606.04323)
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline" (verifier_is_oracle), "Principle-Annotated Artifact Fields", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: build the GROWN labeled ARC pool + train the CROSS-CANDIDATE aggregator with a calibrated imbalance-aware loss, out-of-fold; report off-fold AUROC + artifact path.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE training): the GAP-4 pools load
           (`python3 -c "import json,gzip; json.load(gzip.open('results/arc3_gap3_stage2_eval_pool.json.gz')); json.load(open('results/arc3_gap4_induced_programs.json'))"`)
           AND scripts/exp_verifier_detector_auroc.py imports. If either missing -> honest_verdict
           `blocked_arc_gap4_pools_missing` and STOP. CPU is sufficient (small set-encoder); no GGUF/GPU needed.
        1. BUILD + GROW the labeled pool: reuse load_arc_rows() / arc_rows_from_entries() to construct
           per-candidate rows {{task_id, candidate_features, is_correct}}. is_correct = candidate grid matches
           the GAP-4 induced pred_grid (the TRAINING TARGET only; the learned aggregator must NOT call the
           execution verifier at inference). Add more games to the pool if the GAP-4 stage2 pool supports it;
           GROUP rows by task_id so the model sees the FULL candidate set per task. Target >=30 held-out
           wrong-majority tasks (oracle@K > vote@1). Report held_out_task_n + wrong_majority_n.
        2. CROSS-CANDIDATE architecture: train a permutation-invariant set-encoder / aggregator that scores
           each candidate CONDITIONED on the per-task candidate set -- features include vote_weight, self-
           consistency margin across the set (MSV), per-region/per-cell agreement vs the modal grid (SCOPE
           2512.15146 localized evidence), competing-transformation-family indicators, plus the per-candidate
           grid stats from .391 (height/width/cells/color_count/nonzero_frac/entropy/program_length). A simple
           sufficient form: per-task DeepSets/attention pooling -> per-candidate logits; OR augment the
           existing logistic features with explicit cross-candidate summary features (set-mean, set-max,
           rank-within-set, agreement-count) if a full set-encoder is too heavy for the window.
        3. CALIBRATED imbalance-aware training: use class-weighted or focal loss + stratified-balanced
           minibatches (each batch carries positives) + post-hoc calibration (temperature/isotonic), per
           2509.19681, so the ~0.8%-positive ratio does not collapse the discriminator. Train OUT-OF-FOLD
           (held-out-TASK split so no task leaks train->test). Report off-fold detection AUROC + bootstrap
           CI95. Persist the learned aggregator (weights/artifact path) for A2. Set aggregator_trained=true
           and verifier_is_oracle=false. If off-fold AUROC <= the .391 0.779 +/- noise (no improvement from
           cross-candidate + calibration) OR positives are too few even after growing, report honest_verdict
           `complete_oracle_distinct_arc_aggregator_no_learnable_gain_auroc<x>` and STILL persist the path
           (A2 reads it). NOTE methodology fields (random_seed, reproducibility_checksum, model_specs) to
           avoid the .391 TAUTOLOGY/METHODOLOGY flags: do NOT emit two identical raw counts as distinct
           metrics (the .391 detector_row_n==raw_candidate_n TAUTOLOGY false-positive) -- name set sizes once.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed (complete:/success:/passed:/shipped:). A trained off-fold aggregator OR an honest 'no learnable gain over the .391 logistic baseline' is COMPLETE -- both feed A2."
        aggregator_trained:
          principle: "BARE bool: A2's gate compares this raw value (gated-fields-must-be-bare); true iff a learned cross-candidate ARC aggregator artifact was persisted out-of-fold."
        oracle_distinct_auroc:
          principle: "BARE float: off-fold detection AUROC of the AGGREGATOR vs is_correct -- the oracle-distinct discrimination; must improve on the .391 logistic 0.779 for a stronger A2 read, and >0.5 CI95-excl is the precondition for a beats-vote win."
        held_out_task_n:
          principle: "BARE int: number of held-out tasks the A2 gate will score on -- target >=30 (CLT floor) so the A2 null/win is not under-powered like the .391 n=14."
        wrong_majority_n:
          principle: "BARE int: count of stratified tasks where oracle@K > vote@1 -- the ARBITER/AggLM headroom the aggregator targets; A2 measures vote-beating ON these."
        learned_verifier_path:
          principle: "The persisted aggregator artifact A2 loads to rerank held-out ARC candidates; the build deliverable."
        verifier_is_oracle:
          principle: "BARE bool=false -- the aggregator scores WITHOUT executing the demos (Circularity Discipline); this is what makes an A2 win headline/gate-eligible, unlike the circular execution verifier."
        model_specs:
          principle: "The set-encoder/aggregator architecture + the cross-candidate feature set + the calibrated imbalance-aware loss; required methodology."
        random_seed:
          principle: "Determinism precondition; the fold split + model init seeded so the AUROC is reproducible."
        reproducibility_checksum:
          principle: "Hash of the ARC pools + fold split + features; catches silent pool/feature drift before A2 measures."
      ACCEPTANCE GATE:
        - condition: "aggregator_trained true with oracle_distinct_auroc + learned_verifier_path + wrong_majority_n + held_out_task_n reported AND verifier_is_oracle=false, OR an honest no-learnable-gain / blocked_* verdict"
          principle: "A2 needs a persisted cross-candidate aggregator (or an honest null) at >=30 held-out tasks; a learned off-fold AUROC improving on 0.779 on wrong-majority strata is the precondition for testing whether it beats vote at power."

      Run: `python3 {project_root}/results/experiment_4231_oracle_distinct_arc_aggregator_build.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4232-oracle-distinct-arc-aggregator-beats-vote
    milestone: 2026.06.392
    title: "PHASE A2 (THE HEADLINE GATE, gated_on A1 aggregator_trained) -- does the STRONGER cross-candidate AGGREGATOR BEAT majority vote OFF-ORACLE at power? On a HELD-OUT ARC split (disjoint from A1 folds, target N>=30), rerank with the A1 aggregator (verifier_is_oracle=false; does NOT execute demos) vs majority-vote vs a MATCHED no-verifier control (same candidates/budget) vs oracle@K (the positive-control ceiling) vs a MARGIN-TRIGGERED override (2606.04323 / ARBITER 2605.26172: override vote ONLY when the aggregator margin clears a pre-registered threshold tuned on the A1 fold). The LOAD-BEARING gate: aggregator@1 - vote@1, bootstrap CI95 EXCLUDES 0 AND headroom exists. YES -> the first oracle-distinct verifier win (closes GAP-3-ties-vote; informs the DiffusionGemma gate). TIES-at-power -> a STRONGER null than .391's n=14. No-headroom -> uninformative (FALSE_NEGATIVE_RISK)."
    priority: high
    track: verifier-oracle-distinct
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct beats-vote measurement is MANDATED by the 2026-06-14 P0 directive (HEADLINE; verifier_is_oracle=false + MATCHED control + CI95-excl-0) -- false-positive scope-match vs prior selector/rerank exps; forward difference = the STRONGER cross-candidate AGGREGATOR (A1) + a MARGIN-TRIGGERED override (2606.04323, fixing the .391 keep-vote degeneracy) at N>=30 (fixing the .391 n=14 under-power)."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4232_oracle_distinct_arc_aggregator_beats_vote.json
    gated_on:
      - upstream: exp4231-oracle-distinct-arc-aggregator-build
        artifact_field: aggregator_trained
        op: '=='
        value: true
    prior_failures:
