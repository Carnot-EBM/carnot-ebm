- id: exp1379-paper-integrity-audit-v2
  milestone: 2026.04.107
  deliverable: results/experiment_1379_paper_integrity_audit_v2.json
  title: "Paper Integrity Audit v2 — .106 Results Integration + Claim Verification"
  agent_type: codex
  model: gpt-5.5
  max_turns: 55
  estimated_wall_time_min: 60
  priority: critical
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1378-publication-hold-v16-claim-boundary
