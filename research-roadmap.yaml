- id: exp791-kv260-n32-reduced-synthesis
  milestone: 2026.04.60
  deliverable: results/experiment_791_kv260_n32_reduced_synthesis.json
  title: 'Exp 791: KV260 N=32 Reduced Design — iCE40 Open-Source Synthesis (nextpnr-ice40)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 776 (.59) attempted iCE40 P&R on the existing ising_sampler_v2.v (N=64 default):
    honest_verdict="pnr_failed_timing". The N=64 design uses ~2821 LUTs. iCE40 HX8K has 7680 LUTs.
    The issue: after Yosys synth_ice40 (which re-maps for iCE40 LUTS), the design may have had
    critical path timing violations at 12 MHz iCE40 default clock. Fix: reduce to N=32 spins with
    MAX_DEGREE=8 — this halves the coupling matrix routing, directly reducing critical path length.
    N=32 uses ~600-800 LUTs (estimated) leaving 90% LUT headroom on HX8K for routing slack.

    Full Vivado flow (ops/status.md .59 session) showed N=64 fits at 48.5% LUT (115K/237K).
    But that's for ZynqUltraScale+, not iCE40. iCE40 has simpler LUT primitives — the synth
    maps less efficiently. N=32 with checkerboard partitioning should map cleanly.

    EXISTING CODE TO READ FIRST:
    - hardware/kv260/ising_sampler_v2.v — current RTL (N=64 default, parametric N_SPINS).
    - hardware/kv260/synth_yosys_ice40.ys — Exp 776 synth script (may need modification).
