    \ reduce false positives? This has never been tested across simulated sessions before.\n\n\
    Infrastructure: SessionMemory (Exp 345), ConstraintTemplateLibrary (Exp 343),\
    \ SelfLearningRelay (Exp 361). All exist — just need wiring.\n\nCPU-only. Always produces result.\n\n\
    EXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix() (call FIRST)\n\
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog\n\
    - python/carnot/pipeline/session_memory.py — SessionMemory, save/load/exists (Exp 345)\n\
    - python/carnot/pipeline/constraint_template_library.py — ConstraintTemplateLibrary (Exp 343)\n\
    - python/carnot/pipeline/case_memory_template_wiring.py — CaseMemoryTemplateWiring (Exp 344)\n\
    - python/carnot/pipeline/self_learning_relay.py — SelfLearningRelay (Exp 361)\n\
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline\n\
    \nTASK: Validate Tier 2 cross-session constraint memory relay.\n\
    1. apply_env_autofix() FIRST.\n\
    2. Add REQ-LEARN-037 (cross-session Tier 2 relay: templates learned in Session N reduce FP rate\n\
    \   in Session N+1 on the same error domain), REQ-LEARN-038 (session memory persists template\n\
    \   library state across simulated sessions without loss), SCENARIO-LEARN-066/067/068.\n\
    3. Write tests FIRST (100% coverage) for:\n\
    \   - CrossSessionResult(session_id: int, n_questions: int, fp_rate: float,\n\
    \     n_templates_active: int, n_templates_loaded_from_prior: int)\n\
    \   - simulate_session(session_id: int, questions: list, prior_memory_path: str | None,\n\
    \     memory_dir: str) -> CrossSessionResult:\n\
    \     Load prior session's ConstraintTemplateLibrary from SessionMemory if prior_memory_path set\n\
    \     Run VerifyRepairPipeline on questions with the loaded template library\n\
    \     Record violations and FP rate\n\
