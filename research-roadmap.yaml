        conservative_default_beta: principle="the deployed beta value (from exp3521)."
        collapse_prevented_deploy_single_all_corpora: principle="boolean: SINGLE-verifier grounding prevents N>=200 collapse on EVERY battery corpus."
        collapse_prevented_deploy_diverse_all_corpora: principle="boolean: DIVERSE multi-verifier grounding prevents N>=200 collapse on EVERY battery corpus."
