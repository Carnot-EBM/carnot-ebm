milestone: 2026.06.432
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-24). .431 grew capability 59->60 (A3 banked sb26 L2) but
  bridge_crossed_for_solve=FALSE for the 7th consecutive milestone, AND the .431 GENERATION pivot itself NULLED on
  live solve-rate. A1 (exp4676) hierarchical subgoal search ran its STEP-1 decisive diagnostic and DECIDED THE
  OPEN QUESTION: wall_diagnosis=l1_first_contact -- the generic E3AgentPolicy reaches first-win on only 1 of 25
  public games (lp85), first_win_rate=0.04; the subgoal-search build then nulled (generic_agent_reached_level=0,
  empty subgoal_decomposition, residual value_head_still_not_separating). A2 (exp4677) PoE-World factored planner
  nulled with coverage_delta=0.0, first_win_rate_delta=-0.04, residual experts_overfit_prefix. BOTH generation
  levers chose chosen_submitted_config=unchanged. THE DECISIVE READ: the wall is upstream of BOTH selection AND
  generation-by-search -- the winning L1 trajectory never enters the candidate pool because the EXPLORER'S
  ACTION-PROPOSAL DISTRIBUTION does not cover it (24/25 games never reach L1 regardless of how candidates are
  searched or ranked). The .431 D SOTA-ingestion (exp4685, directed-exploration-sota-ingestion-2026-06-24.md)
  mapped the fix and its "bottom line for the .432 roadmap" is explicit: build directed PROPOSAL coverage so a
  winning L1 trajectory APPEARS in the pool. .432 PIVOTS from generation-by-search to DIRECTED EXPLORATION: A1
  (HEADLINE) controllable-novelty E3 proposal policy (Never Give Up arXiv:2002.06038 + RND arXiv:1810.12894 +
  Strategy-Guided Exploration arXiv:2603.02045) reshaping the live StepwiseExplorer's action-proposal
  distribution at L1 first-contact via an episodic kNN + RND lifelong novelty score over a CONTROLLABLE-novelty
  embedding (frame-delta + action-EFFECT features -- the controllability gate is the noisy-TV fix for the .427
  dense-curiosity null); A2 (second independent mechanism) program-synthesis action-effect proposal FILTER
  (PoE-World arXiv:2505.10819 + Program-Synthesis-Guided RL arXiv:2102.11137) with HELD-OUT transition rejection
  (the direct fix for A2's experts_overfit_prefix). A3 banks +1 (60->61) + trains the verifier; A4 is RETARGETED
  per the 2026-06-24 operator directive to gate readiness on the HELD-OUT generic first-win lane (experiment_4605,
  bootstrap-CI>0) -- NOT replay-package depth (the replay path scores ~0 on the hidden leaderboard; first scored
  submission = 0.08). Plus persist+transfer (A5), SUBMITTED_AGENT_CONFIG integration (A6), 2 infra (B1
  proposal-coverage CI-metric + honest first-win floor / B2 adversarial_verify novelty-ablation +
  proposal-filter-heldout guards), 1 hardware (C), 1 SOTA-ingestion (D, amortized/transferable exploration
  fallback for .433), capstone (E). Submission operator-only. verifier_is_oracle:false on every value claim. ARC
  Prize Milestone #1 deadline 2026-06-30 (6 days).
milestone_title: 'DIRECTED EXPLORATION at L1 FIRST-CONTACT, not generation-by-search -- the 7th-consecutive
  bridge-not-crossed milestone (.431) ran the decisive diagnostic and CONFIRMED the wall: wall_diagnosis=l1_first_contact,
  generic first-win 0.04 (only 1/25 public games reach L1). BOTH .431 generation levers nulled (A1 hierarchical
  subgoal search value_head_still_not_separating + empty decomposition; A2 PoE-World coverage_delta=0.0
  experts_overfit_prefix). The winning L1 trajectory never enters the candidate pool because the EXPLORER''S
  action-proposal distribution misses it -- the wall is upstream of both selection AND generation-by-search. .432
  PIVOTS to DIRECTED EXPLORATION (the .431 D ingestion''s explicit "bottom line for the .432 roadmap"): A1
  (HEADLINE) controllable-novelty E3 proposal policy (NGU + RND + Strategy-Guided Exploration) reshaping the live
  explorer''s action-proposal distribution at L1 first-contact via episodic kNN + RND lifelong novelty over a
  CONTROLLABLE-novelty embedding (the controllability gate = the noisy-TV fix for the .427 dense-curiosity null);
  A2 (second mechanism) program-synthesis action-effect proposal FILTER with HELD-OUT transition rejection (the
  experts_overfit_prefix fix). A3 banks +1 (60->61) + trains the verifier; A4 RETARGETED to gate readiness on the
  HELD-OUT first-win lane (experiment_4605, NOT replay-package depth -- replay scores ~0; first scored sub=0.08).
  Plus persist+transfer (A5), integration (A6), 2 infra (B1/B2), 1 hardware (C), 1 SOTA-ingestion (D), capstone
  (E). 6 days to the ARC Prize Milestone #1 deadline (2026-06-30).'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  The 7th consecutive bridge_crossed_for_solve=FALSE proved the wall is the EXPLORER'S ACTION-PROPOSAL
  DISTRIBUTION at L1 first-contact, not selection and not generation-by-search. .431 ran the decisive STEP-1
  diagnostic and confirmed wall_diagnosis=l1_first_contact: the generic E3AgentPolicy reaches first-win on only
  1/25 public games (first_win_rate=0.04). Its two generation-by-search levers both nulled -- A1 hierarchical
  subgoal search (value_head_still_not_separating, empty decomposition), A2 PoE-World factored planner
  (coverage_delta=0.0, experts_overfit_prefix) -- because both search/plan OVER a candidate pool that never
  contains a winning L1 trajectory. The operator named the wall 2026-06-22 (make-a-winner-appear, not select); the
  .431 D ingestion (directed-exploration-sota-ingestion-2026-06-24.md) sharpened it: the winner is not in the
  pool because the explorer's PROPOSAL distribution does not cover it. .432 attacks the PROPOSAL distribution from
  TWO independent SOTA-flagged mechanisms on the SCORED E3AgentPolicy, both verifier_is_oracle:false, both
  live-path-reachable. A1 (HEADLINE) is the controllable-novelty E3 proposal policy: an episodic kNN novelty
  table + an RND lifelong novelty score over a CONTROLLABLE-novelty embedding (frame-delta + action-EFFECT
  features so cosmetic/noisy-TV changes are NOT rewarded), applied as an intrinsic proposal bonus that reshapes
  the live StepwiseExplorer's action-proposal distribution BEFORE value-ranking, with a small family of
  exploration temperatures. Gate: the GENERIC live agent's first-win rate rises on >=1 clean L1-only game where
  the winning L1 trajectory now APPEARS in the explored pool, offline-reproduced as a NEW generic level, with a
  NO-NOVELTY-BONUS ablation AND a COSMETIC-NOVELTY (controllability-gate-off) ablation that do NOT. A2 is the
  program-synthesis action-effect proposal FILTER: induce small per-game action->effect programs from observed
  prefixes, REJECT programs that fail held-out transitions (the experts_overfit_prefix fix), and prune the
  explorer's primitive proposals to mechanically-relevant clicks/keys. Gate: candidate-generation coverage up
  (the winner appears where the matched blind-proposal baseline did not) AND a held-out first-win lift (CI
  excludes baseline), offline-reproduced. CAPABILITY (A3): self-play banks +1 reproducible level (60->61) + trains
  the learned verifier. SCORE (A4): RETARGETED to gate readiness on the HELD-OUT first-win lane (experiment_4605
  first_win_rate_integrated, bootstrap-CI lower bound > 0), keeping the replay package as a reproduced FLOOR
  artifact only. Plus persist+transfer (A5), integration (A6), 2 infra (B1/B2), 1 hardware (C), 1 SOTA-ingestion
  (D), capstone (E). verifier_is_oracle:false on every value claim; solve_provenance on every ARC solve;
  submission operator-only. RETIRED (do NOT re-propose): the .431 A1 hierarchical-subgoal-search-over-the-pool
  (value_head_still_not_separating); the .431 A2 PoE-World composing prefix-overfit experts WITHOUT held-out
  rejection (experts_overfit_prefix); the .427 dense-curiosity REWARD with no controllability gate
  (dense_curiosity_loop_no_live_lift). 6 days to the ARC Prize Milestone #1 deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC (A1-A6); >=1
  level-up attempt that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A3); self-play loop EVERY
  milestone (A3 trains+checkpoints the verifier); 2 reserved infra (B1/B2); 1 per-board hardware (C); 1
  SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus. 6 days to the ARC Prize
  Milestone #1 deadline ($25K). The frozen live generator is Qwen3.5-9B-MTP on the iGPU (NEVER the 3090s); A1/A2
  arms that induce/strategize via the LLM declare live_llm_inference for that arm only and construct the proposer
  on a FREE port + /props-verify Qwen (the port-8919 gemma-squat confound)."

