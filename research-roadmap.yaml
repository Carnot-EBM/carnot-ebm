  - id: exp336-cot-circuit-verifier
    milestone: "2026.05.06"
    deliverable: python/carnot/pipeline/cot_circuit_verifier.py
    title: "Exp 336: CoTCircuitVerifier — CRV-style chain-of-thought computational graph verification"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: CRV (arXiv 2510.09312) introduces circuit-based reasoning verification:
      extract the computational dependency graph from a chain-of-thought response — which
      intermediate values depend on which others — then check structural consistency.
      A "broken circuit" (where a downstream value doesn't follow from upstream values)
      indicates a reasoning error.

      This approach is complementary to Z3 (which checks arithmetic consistency):
      - Z3: "Is 47+28=76 a valid arithmetic statement?" → answer: No
      - CRV: "Does step 5's answer follow from step 3 and step 4?" → structural check

      CRV catches reasoning chain errors that regex and Z3 miss: cases where each step
      is individually valid but the chain is inconsistent (wrong variable substituted,
      result from wrong step used, etc.).

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/extract.py — ConstraintExtractor protocol (CoTCircuitVerifier adds here)
      - python/carnot/pipeline/nl2z3_extractor.py — Z3Result (complement to CRV output)
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (integration point)
      - results/experiment_311_extractor_benchmark.json — extractor baseline for comparison

      TASK: Implement CoTCircuitVerifier.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-EXTRACT-015 (CoT circuit extraction), REQ-EXTRACT-016 (structural consistency),
         SCENARIO-EXTRACT-031–035 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - CoTStep dataclass: step_id, text, input_refs (list of step IDs this step uses),
           output_value (numeric or string result of step), is_final_answer bool
         - CoTCircuit dataclass: steps (list[CoTStep]), has_cycle bool, broken_links (list)
         - extract_cot_steps(response: str) → list[CoTStep]:
           split by step markers ("Step 1:", "First,", numbered lines, etc.)
           for each step: extract input_refs (references to previous step outputs)
           for each step: extract output_value (last numeric expression in step)
         - build_circuit(steps) → CoTCircuit: detect cycles, find broken links
         - broken_link: step i uses output of step j, but step j's output != step i's input value
         - find_broken_links(steps) → list[tuple[int, int, str, str]]:
           (downstream_step_id, upstream_step_id, expected_value, actual_value)
         - CoTCircuitVerifier.verify(response) → CoTCircuit
         - CoTCircuitVerifier.extract(question, response) → list[ConstraintViolation]:
           implements ConstraintExtractor protocol; violation per broken_link
         - edge case: single-step responses → no links to check, empty broken_links
         - edge case: non-numeric steps → no output_value, skip link check
      4. Implement python/carnot/pipeline/cot_circuit_verifier.py:
         - CoTStep(step_id, text, input_refs, output_value, is_final_answer)
         - CoTCircuit(steps, has_cycle, broken_links)
         - extract_cot_steps(response: str) → list[CoTStep]:
           Use regex to detect step boundaries: r"(?:step\s*\d+|^\d+\.|first[,:]|then[,:]|next[,:]|finally[,:])"
           For each step: scan for numeric results (last float/int in the step text)
           For each step: detect forward references ("from step N", "the {N} we computed")
         - build_circuit(steps) → CoTCircuit:
