    prompt: |
      CONTEXT: exp3540 (.326) is the most important P0.1 datapoint to date and it came back an HONEST
      NEGATIVE: with clean de-tautologized fields (0 CRITICAL flags), n expanded, and a paired
      significance test, energy global inference solve_rate 1.0 did NOT significantly beat a STRONG
      DSATUR baseline (0.99); paired diff 0.01, p=0.135. It still crushes naive greedy-AR (0.085). BUT
      a warn CEILING_SATURATION fired: DSATUR itself sat at 0.99 -> the corpus was NOT hard enough to
      DISCRIMINATE energy global inference from a strong classical heuristic. The neural-CO critique
      literature is exactly this trap — a method that matches a tuned classical baseline while only
      beating a weak one (arXiv:2502.03669 AI-vs-classical MIS; arXiv:2302.03602 Angelini/Ricci-Tersenghi
      GNN-vs-greedy; arXiv:2112.12251 ML4CO strong baselines). This task gives P0.1 Route-1 its TERMINAL
      verdict by forcing the STRONG baseline BELOW ceiling ON THE HARD TIER: sample instances near the
      chromatic/freezing threshold (k at or just above chi, higher average degree) so DSATUR solve_rate
      ON THE HARD TIER < 0.9 WHILE the exact solver confirms solvability (==1.0). NOTE — energy (PT/SA
      local search) is in the SAME solver class and will likely ALSO saturate on the easy/medium tiers
      (exp3540's energy was 1.0 on every tier); the discriminating comparison is therefore PER-INSTANCE
      ON THE HARD TIER, not global. On the hard tier, either energy SIGNIFICANTLY beats DSATUR (the
      rescued positive) or it ties/loses. A hard-tier TIE (energy ~= DSATUR) is the EXPECTED
      terminal-bounded outcome — energy-based global inference is competitive-with-but-not-superior-to
      strong classical CSP solvers, decisively beating only autoregressive generation — and is
      headline-acceptable; it is NOT a block. The ONLY block is if hard-tier DSATUR cannot be pushed
      below 0.9 at all while keeping instances solvable. Either measured outcome is a clean terminal
      datapoint. References: multi-state Ising graph coloring arXiv:2505.20250
      (one-hot encoding); freezing-transition recipe arXiv:2408.01503; energy-landscape structure
      arXiv:2403.01320; ML-enhanced MC beats SA arXiv:2510.19544 (beating SA is the EASY bar; beating
      DSATUR on a NON-saturated corpus is the discriminating one).

      EXISTING CODE TO READ FIRST:
        - scripts/experiment_3540_p01_graph_coloring_clean_rerun_detautology_ci_v2.py (REUSE the validated encoding + optimizer ladder + DSATUR baseline + de-aliased field storage + the bootstrap-CI/paired-significance machinery; the ONLY required change is making the corpus DISCRIMINATING — DSATUR < 0.9)
        - results/experiment_3540_p01_graph_coloring_clean_rerun_detautology_ci_v2.json (the clean negative on a saturated corpus: strong_baseline_solve_rate 0.99, warn CEILING_SATURATION — the field set to keep clean)
        - scripts/adversarial_verify.py (the TAUTOLOGY + CEILING_SATURATION checks — confirm 0 CRITICAL and no ceiling warn before finalizing)
        - python/carnot/ (Ising energy / sampler / parallel-tempering primitives)
        - ops/known-issues.md "NEW 2026-05-31: P0.1 GRAPH-COLORING RE-TEST" (the required design + acceptance gate)
        - research-references.md "2026-05-31 Post-.326 Planning Sweep" (neural-CO critique 2502.03669/2302.03602/2112.12251; multi-state Ising 2505.20250; freezing transition 2408.01503)

      TASK: Re-run the exp3540 protocol on a DISCRIMINATING corpus — sampled hard enough that the STRONG
      baseline DSATUR solve_rate is < 0.9 (globally AND on the hard tier) while the exact solver confirms
      solvability (== 1.0) — with clean de-aliased fields, bootstrap CI, and a paired significance test on
      the energy-vs-DSATUR per-instance solve difference.

      PRECONDITIONS (step 0):
        0a. ENCODING VALIDITY: encode a known-valid k-coloring and assert its Ising/QUBO energy E==0.
            If not -> complete: blocked_graph_coloring_encoding_invalid (report residual); STOP.
        0b. DISCRIMINATING-HEADROOM GATE (HARD TIER): assemble the corpus near the chromatic/freezing
            threshold and confirm the STRONG baseline (DSATUR) solve_rate ON THE HARD TIER < 0.9 WHILE
            exact_baseline_solve_rate == 1.0. The EASY tier may keep global DSATUR high — that is FINE;
            the hard tier is where the discrimination lives (vanilla_descent < 0.9 globally is the
            secondary headroom witness, already met at 0.68). If you cannot push HARD-TIER DSATUR below
            0.9 while keeping the instances solvable -> complete: blocked_cannot_construct_discriminating_corpus
            (report the DSATUR solve-rates you reached).

      CONCRETE STEPS:
        1. Re-assert Step 0a (E==0) and Step 0b (HARD-TIER DSATUR < 0.9, exact == 1.0).
        2. Assemble n>=60 (target 60-120) instances STRATIFIED by difficulty with a HARD tier >=30 near
           the chromatic/freezing threshold (k at or just above chi, higher average degree) so DSATUR
           genuinely FAILS on a meaningful fraction. Document graph family, (n_vertices, avg degree, k),
           planted-solution method, and seed.
        3. OPTIMIZER LADDER (solve-rate per variant): vanilla_descent, tuned geometric SA, K>=20
           SA-restarts, PARALLEL TEMPERING with instrumented swap-acceptance, and an EXACT baseline
           (CP-SAT). PRINT one flushed progress line per sweep — defeats idle-timeout.
        4. STRONG NON-AR BASELINE: report strong_baseline_solve_rate = best of {{DSATUR, tuned
           SA-restarts, backtracking-with-heuristic}} (global) AND strong_baseline_solve_rate_hard_tier —
           and CONFIRM the HARD-TIER value is < 0.9 (the discriminating condition; the global value may
           be higher if easy tiers saturate). AR baseline: greedy-AR (random/degree ordering).
        5. DE-TAUTOLOGY (carried from exp3540): store EACH measured quantity EXACTLY ONCE — no
           calibration/hard-tier alias, no pt_mean/pt_acceptance alias. Literature reference numbers go
           ONLY in methodology_note strings, NEVER in a numeric field equal to a measured one.
        6. STATISTICS (HARD TIER — where discrimination is possible): bootstrap CI95 on the per-instance
           PAIRED difference (energy_solved[i] - strong_solved[i]) ON THE HARD TIER; McNemar exact p (or
           paired-bootstrap p) for "energy solves strictly more than DSATUR on the hard tier". Also
           report global solve rates for context.
        7. MECHANISM ATTRIBUTION: report pt_swap_acceptance_rate (>0 if PT is claimed); else name which
           optimizer did the work.
        8. RUN adversarial_verify on the emitted artifact and CONFIRM zero CRITICAL flags. A
           CEILING_SATURATION *WARN* on the easy/medium tiers is EXPECTED and acceptable (both energy and
           DSATUR saturate there); the discrimination is the hard-tier paired comparison. HARD WALL-CLOCK
           BUDGET ~40 min: finalize + EXIT CLEAN (code 0); prioritize the HARD tier over total n if budget
           tightens. Content-derived seed.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="Terminal verdict starts complete:/success:/passed:/shipped_."
        inference_substrate: value=ising_energy_optimization_cpu
        encoding_validity_E0: principle="E of a known-valid k-coloring is 0 — the correctness-first precondition."
        n_instances: principle=">=60 with a hard tier >=30 so the DSATUR margin is statistically meaningful."
        strong_baseline_solve_rate: principle="best of DSATUR / tuned restarts / backtracking — MUST be < 0.9 (the DISCRIMINATING condition exp3540 lacked); a STRONG method that fails on a meaningful fraction."
        strong_baseline_solve_rate_hard_tier: principle="the strong baseline's solve-rate ON THE HARD TIER — MUST be < 0.9. STORED ONCE; do NOT alias."
        vanilla_descent_solve_rate: principle="the trivial-baseline witness (< 0.9). STORED ONCE."
        solve_rate: principle="energy global inference solve-rate (proper coloring verified) — the gate."
        solve_rate_ci95: principle="bootstrap CI95 on the energy solve-rate."
        solve_rate_by_difficulty: principle="per-tier; the hard tier must NOT be saturated for the STRONG baseline."
        energy_minus_strong_paired_diff_hard_tier: principle="the per-instance paired solve difference (energy - strong) ON THE HARD TIER — the discriminating quantity (where both saturate on easy tiers), with its own CI."
        energy_minus_strong_paired_diff_hard_tier_ci95: principle="bootstrap CI95 on the hard-tier paired difference — the rigor that decides terminal positive vs bound."
        energy_vs_strong_paired_p_hard_tier: principle="McNemar/paired-bootstrap p (HARD TIER) for energy solving strictly more than the STRONG baseline — significance on the tier where discrimination is possible."
        ar_greedy_solve_rate: principle="greedy-AR control (the Brooks-pathology baseline)."
        exact_baseline_solve_rate: principle="exact-solver reference — confirms the instances ARE solvable (==1.0)."
        pt_swap_acceptance_rate: principle="PT swap-acceptance (>0 if PT is the claimed mechanism). STORED ONCE; do NOT alias as pt_mean_swap_rate."
        mechanism_attribution_note: principle="string: which optimizer did the work; literature reference numbers live here, NOT in numeric fields."
        no_aliased_fields_assert: principle="boolean: runtime-verified that no two conceptually-distinct numeric fields are bit-identical to >5 sig figs — passes adversarial_verify with 0 CRITICAL flags."
        hard_tier_discriminating: principle="boolean: strong_baseline_solve_rate_hard_tier < 0.9 — the HARD TIER is not ceiling-saturated for the strong baseline, so energy-vs-DSATUR can actually discriminate there (easy-tier saturation for both solvers is expected and fine)."
        random_seed: principle="determinism; content-derived, NOT the experiment number."
        reproducibility_checksum: principle="content hash of instance set + encoding + optimizer configs + seed."
        duration_s: principle="CPU global-opt over a HARD non-trivial corpus takes real wall time; honest value."

      ACCEPTANCE GATES:
        - condition: "encoding_validity_E0 == true AND strong_baseline_solve_rate_hard_tier < 0.9 AND vanilla_descent_solve_rate < 0.9 AND exact_baseline_solve_rate == 1.0 AND n_instances >= 60 AND no_aliased_fields_assert == true AND hard_tier_discriminating == true"
          principle: "G0 DISCRIMINATING-ON-THE-HARD-TIER + CLEAN: valid encoding, the STRONG baseline forced below ceiling ON THE HARD TIER (where it must fail to discriminate energy from a strong heuristic; the EASY tier may keep global DSATUR high near the freezing transition), the global vanilla witness < 0.9, instances solvable, n large enough, zero aliased fields. Discriminating where it matters — the hard tier exp3540's saturated corpus could not provide."
        - condition: "energy_minus_strong_paired_diff_hard_tier > 0 AND energy_vs_strong_paired_p_hard_tier < 0.05"
          principle: "G1 TERMINAL: on the DISCRIMINATING HARD TIER energy global inference either SIGNIFICANTLY beats a STRONG non-AR baseline (the rescued P0.1 positive) OR ties/loses (P0.1 Route-1 terminally bounded — energy competitive-not-superior, beats only AR). A hard-tier TIE is the EXPECTED outcome and is EQUALLY a terminal datapoint; do NOT fall back to the greedy-AR comparison as the headline."

