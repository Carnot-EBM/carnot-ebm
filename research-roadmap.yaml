           d. At least one checkpoint under python/carnot/verify/ or
              models/ at < 50MB — else `blocked_no_checkpoint_available`.
           Record preconditions_checked.
        1. Pick smallest checkpoint < 50MB.
        2. Write model card: NO emojis, verbose layman explanations,
