  - id: exp2013-update-prd-status
    title: "Exp 2013: Update Dashboard & PRD Traceability"
    deliverable: "results/experiment_2013_prd.json"
    max_turns: 20
    prompt: |
      CONTEXT: The milestone is closing. We must update ops/status.md and _bmad/traceability.md.
      EXISTING CODE TO READ FIRST: `ops/status.md`, `_bmad/traceability.md`
      TASK: Reconcile specs and move completed work to 'What's Working'.
      CONCRETE STEPS:
      1. Update `ops/status.md` preserving historical results.
      2. Update `_bmad/traceability.md` implementation statuses.
      3. Generate a JSON summary into {deliverable}.
