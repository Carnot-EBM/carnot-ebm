           `blocked_scissor_masks_unavailable`, EXIT.
        1. Treat the reasoner-self-verify mask as the strong generative-PRM baseline B.
           carnot_catches_B_misses = fraction of gold-incorrect that B MISSES but Carnot catches.
           B_catches_carnot_misses = the symmetric fraction (where Carnot misses but B catches).
        2. union_catch_rate = fraction of gold-incorrect caught by (B OR Carnot). Compare to B-alone
           and Carnot-alone catch. The lift of the UNION over the best single is the complementarity value.
        3. Cost framing: note Carnot's ensemble is NON-LLM (no GGUF inference) — the union buys catch
