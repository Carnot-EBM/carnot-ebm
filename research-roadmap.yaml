      verdict: credentials_missing_manual_submission_checklist_generated_ready_bundle_verified
      addressed_by: "exp1390 proved the bundle exists and wrote the long manual checklist. The remaining blocker is operator action, not code. This task produces a terse submit-now action sheet and verifies the bundle path only; it does not retry credentialed API submission."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Milestone .108 ended with arXiv still not submitted. Exp1390 verified
    results/arxiv_bundle_v11.tar.gz and generated docs/arxiv-manual-submission-checklist.md,
    but SWORD API credentials were absent. The next useful deliverable is a
    terse operator action sheet that can be followed in under 5 minutes, not
    another credentialed submission attempt. Use {project_root} as the project
    root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - results/experiment_1390_arxiv_submission_sword_api.json
    - docs/arxiv-manual-submission-checklist.md
    - openspec/change-proposals/research-roadmap-vNEXT.md

    TASK:
    Verify the arXiv bundle is present and write a concise operator-facing
    action sheet at docs/arxiv-submit-now.md. Write the terminal JSON artifact.

    REQUIRED ARTIFACT FIELDS:
    - status
    - bundle_path
    - bundle_exists
    - bundle_size_bytes
    - manual_checklist_path
    - operator_action_sheet_path
    - submission_ready_for_operator
    - credentialed_submission_attempted
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1412_arxiv_operator_action_sheet_v3.json immediately with status="in_progress".
    2. Verify results/arxiv_bundle_v11.tar.gz exists and has size > 0.
    3. Read docs/arxiv-manual-submission-checklist.md and condense it into docs/arxiv-submit-now.md.
    4. The action sheet must include exact upload URL, bundle path, category, license, title, author, and one-line abstract pointer.
    5. Do not attempt SWORD/API submission and set credentialed_submission_attempted=false.
    6. Set submission_ready_for_operator=true if the bundle and action sheet are valid.
