- id: exp761-tier1-constraint-addition
  milestone: 2026.04.58
  deliverable: results/experiment_761_tier1_constraint_addition.json
  title: 'Exp 761: Tier 1 Real Constraint Addition from Memory — ConstraintAdditionEngine'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: research-program.md states (priority #1 for continuous self-learning):
    "Make Tier 1 self-learning actually work — Exp 134 showed that precision-based
    REWEIGHTING didn't improve accuracy. The fix: constraint ADDITION from memory patterns,
    not just weight changes. When memory detects 'arithmetic carry errors are common,'
    ADD a carry-check constraint — don't just upweight existing ones."

    Exp 748 showed cross-session memory plateaus at session 2 with total_templates_at_s10=0.
    This confirms the template accumulation is not wiring templates BACK into the active
    constraint set. This experiment implements that wire-in: when session memory has
    ≥3 instances of a violation pattern, it generates a new constraint and ADDS it to
    the VerifyRepairPipeline's active constraint list.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/self_learning_relay.py — SelfLearningRelay; where to add.
    - python/carnot/pipeline/session_memory.py — SessionMemory; how templates accumulate.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; constraint list.
    - python/carnot/pipeline/extract.py — ConstraintExtractor; constraint types.
    - results/experiment_748_cross_session_memory_10session.json — baseline: plateau at s2.
    - results/experiment_761_tier1_constraint_addition.json — does not exist yet.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement ConstraintAdditionEngine that generates new constraints from session
    memory patterns and injects them into VerifyRepairPipeline. Test on 10 sessions,
    50 questions each. Target: constraints_added_total > 0 AND precision_s10 >= precision_s1.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-040 (ConstraintAdditionEngine MUST generate new constraints from session
       memory when ≥3 instances of the same violation pattern are accumulated; new constraints
       MUST be added to VerifyRepairPipeline.active_constraints before the next session),
       REQ-LEARN-041 (monotonic non-decrease: precision across 10 sessions MUST be
       non-decreasing; any regression is a gate failure), SCENARIO-LEARN-080/081 to
       openspec/capabilities/self_learning/spec.md.
    3. Implement python/carnot/pipeline/constraint_addition_engine.py:
       a. ConstraintPattern(violation_type, count, example_text) dataclass.
       b. ConstraintAdditionEngine(session_memory, min_count=3):
          scan_for_patterns() -> list[ConstraintPattern]:
            - Read all entries in session_memory.
            - Group by violation_type (carry_error, sign_error, unit_error, etc.).
            - Return patterns where count >= min_count.
          generate_constraint(pattern) -> ConstraintTerm:
            - For "carry_error": create carry_check_constraint (verify addend carry digit).
            - For "sign_error": create sign_check_constraint (verify sign consistency).
            - For "unit_error": create unit_check_constraint (verify unit propagation).
            - For "comparison_error": create comparison_direction_constraint.
          inject_into_pipeline(pipeline) -> int:
            - Call scan_for_patterns(), generate_constraint() for each.
            - Append to pipeline.active_constraints (if not already present).
            - Return n_injected.
    4. Wire ConstraintAdditionEngine into SelfLearningRelay:
       a. After each session: call engine.inject_into_pipeline(pipeline).
       b. Record: constraints_added_this_session (int), cumulative_constraints_added (int).
    5. Run 10-session validation:
       a. 50 synthetic GSM8K-style questions per session.
       b. Start with base constraints (no additions).
       c. After session 1: scan memory, inject any patterns with count ≥ 3.
       d. Continue through session 10.
       e. Record: precision per session, constraints_added per session.
    6. Create scripts/experiment_761_tier1_constraint_addition.py:
       a. ExperimentTemplate(761) + ExperimentTimeoutWatchdog(761, timeout_minutes=60).
       b. Implement steps 3-5.
       c. honest_verdict:
          - "constraint_addition_works" if constraints_added_total > 0 AND
            precision_s10 >= precision_s1 (monotonic non-decrease)
          - "constraint_added_no_improvement" if constraints_added_total > 0 AND
            precision_s10 < precision_s1 (added constraints hurt)
          - "no_patterns_found" if constraints_added_total == 0 (threshold too high)
       d. artifact: constraints_added_per_session (list), cumulative_constraints_added,
          precision_per_session (list), precision_s1, precision_s10,
          monotonic_non_decreasing (bool), honest_verdict.
    7. Write tests/python/test_experiment_761_tier1_constraint_addition.py with 100% coverage:
        - test ConstraintAdditionEngine.scan_for_patterns groups by violation_type.
        - test generate_constraint returns ConstraintTerm for each pattern type.
        - test inject_into_pipeline avoids duplicate constraints.
        Each test traces to REQ-LEARN-040/041.
    8. Reconcile:
       - ops/status.md: "Tier 1 constraint addition: constraints_added=N, precision_s10=X.
         monotonic=True/False. Self-learning Tier 1: WORKING/BLOCKED."
       - ops/changelog.md: one-line with honest_verdict.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp762-ppsebm-constraint-select
  milestone: 2026.04.58
  deliverable: results/experiment_762_ppsebm_constraint_select.json
  title: 'Exp 762: PPSEBM Progressive Constraint Selection — EBM-Guided Parameter Freezing'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2512.15658 "PPSEBM: Progressive Parameter Selection with Energy-Based
    Model for Continual Learning" uses an EBM to identify which model parameters are
    task-relevant and freezes others during adaptation, preventing catastrophic forgetting.
    Applied to Carnot: when the VerifyRepairPipeline adapts to new question types during
    self-play, it should freeze constraint coupling weights that are already well-calibrated
    (low energy variance across recent questions) and update only those with high variance.

    This is complementary to the SRSA memory gate in Exp 756. The SRSA gate prevents bad
    data from entering memory. The PPS freezing prevents good coupling weights from being
    overwritten by gradient updates. Together they address both failure modes.

    The "energy variance" of a constraint coupling J_(ij) is: how much the contribution
    of that coupling to the energy fluctuates across the last N questions. Low variance =
    the coupling has settled; high variance = it is still learning.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/parallel_ising.py — ParallelIsingSampler; J coupling matrix.
    - python/carnot/pipeline/self_learning_relay.py — SelfLearningRelay; adaptation path.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; constraint weights.
    - python/carnot/pipeline/psv_diagnostic.py — PSVDiagnostic from Exp 755 (if available).
    - results/experiment_755_psv_relapse_diagnosis.json — read if available.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement PPSConstraintSelector that computes energy variance per coupling and
    freezes low-variance couplings. Test: does freezing prevent fp_rate_slope reversal?

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-042 (PPSConstraintSelector MUST compute energy variance per coupling
       over a rolling window of W=30 questions; couplings with variance < FREEZE_THRESHOLD
       MUST NOT be updated during self-play adaptation), SCENARIO-LEARN-082 to
       openspec/capabilities/self_learning/spec.md.
    3. Implement python/carnot/pipeline/pps_constraint_selector.py:
       a. CouplingVarianceTracker(n_couplings, window_size=30):
          update(coupling_contributions: np.ndarray) -> None:
            Record the energy contribution of each coupling for this question.
          get_variance() -> np.ndarray:
            Return variance of each coupling's contribution over the window.
          get_frozen_mask(freeze_threshold=0.01) -> np.ndarray:
            Return boolean mask: True = coupling is frozen (variance < threshold).
       b. PPSConstraintSelector(tracker, freeze_threshold=0.01):
          apply_mask(gradient: np.ndarray) -> np.ndarray:
            Zero out gradient for frozen couplings.
          frozen_count() -> int:
            Return number of frozen couplings.
    4. Integrate PPSConstraintSelector into SelfLearningRelay:
       a. After each constraint check: call tracker.update(coupling_contributions).
       b. Before each coupling weight update: call selector.apply_mask(gradient).
       c. Record: n_frozen at each step.
    5. Run comparison: 60 self-play steps WITHOUT PPS vs WITH PPS.
       - Measure fp_rate at steps 0, 10, 20, 30, 40, 50, 60.
       - Compare: does PPS prevent fp_rate reversal in steps 30-60?
    6. Create scripts/experiment_762_ppsebm_constraint_select.py:
       a. ExperimentTemplate(762) + ExperimentTimeoutWatchdog(762, timeout_minutes=45).
       b. Implement steps 3-5.
       c. honest_verdict:
          - "pps_prevents_relapse" if WITH_PPS: window1_slope < 0 AND window2_slope < 0
            AND WITHOUT_PPS: window2_slope >= 0 (relapse without PPS)
          - "pps_no_effect" if both WITH and WITHOUT show same slope pattern
          - "pps_hurts" if WITH_PPS shows worse stability than WITHOUT_PPS
       d. artifact: fp_rate_without_pps (list), fp_rate_with_pps (list),
          n_frozen_at_step30, pps_prevents_relapse (bool), honest_verdict.
    7. Write tests/python/test_experiment_762_ppsebm_constraint_select.py with 100% coverage:
        - test CouplingVarianceTracker.get_variance returns correct rolling variance.
        - test get_frozen_mask returns True for variance < freeze_threshold.
        - test apply_mask zeros out frozen coupling gradients.
        Each test traces to REQ-LEARN-042.
    8. Reconcile:
       - ops/status.md: "PPSEBM constraint selection: pps_prevents_relapse=True/False.
         n_frozen at step 30: N."
       - ops/changelog.md: one-line with honest_verdict.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp763-dual-pathway-probe
  milestone: 2026.04.58
  deliverable: results/experiment_763_dual_pathway_probe.json
  title: 'Exp 763: Dual-Pathway Hallucination Probe — MoP Fusion (arXiv 2601.07422)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2601.07422 "Two Pathways to Truthfulness: On the Intrinsic Encoding
    of LLM Hallucinations" identifies two distinct internal representation pathways:
    1. QUESTION-ANCHORED pathway: hallucination signal encoded relative to the question.
    2. ANSWER-ANCHORED pathway: hallucination signal encoded relative to the answer tokens.
    Mixture-of-Probes (MoP) fusing both pathways achieves up to +10% AUC gain vs single
    pathway. This was filed for .57 but deferred; now executing in .58.

    Carnot's JEPAReasonerProbe (Exp 726, AUC=0.993 in-distribution, OOD untested) is a
    single-pathway architecture. Adding the dual-pathway MoP may:
    a. Improve OOD generalization (the main JEPA failure mode)
    b. Catch hallucinations missed by single-pathway probes

    The practical implementation: train two separate 2-layer MLP probes (one on question-side
    hidden states, one on answer-side hidden states), then train a gate network to combine them.
    The gate network takes both probe outputs as input and produces a final score.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_reasoner_probe.py — JEPAReasonerProbe (single-pathway).
    - results/experiment_732_jepa_5fold_cv.json — probe 5-fold CV: AUC=0.993 baseline.
    - results/fover_labeled_steps_live.json — FoVer v2 real labeled steps for training.
    - python/carnot/pipeline/fover_annotator.py — FOVERAnnotator for step parsing.
    - scripts/experiment_template.py — ExperimentTemplate.
