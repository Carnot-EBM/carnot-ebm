milestone: 2026.06.400
milestone_title: "SCALE & HARDEN the IN-GENERATION oracle-distinct verifier-moat win (the one CLOSED moat: exp4315 reward-guided step-stitching beat the engaged control +0.225 AND the intrinsic self-reward SMC +0.35, CI95 [0.075,0.375] excl 0, verifier_is_oracle=false) -- replicate on a 2nd corpus + power, then an ADAPTIVE guided-generation scale-up, and DECIDE the DiffusionGemma gate. ATTACK the ARC DEEP TAIL with the EXECUTABLE-WORLD-MODEL solver (operator MANDATORY 2026-06-17: ar25/ka59/tr87/ft09, harness BUILT+validated, gpt-5.5 SOTA 15/25 RHAE 58.12% per arXiv:2605.05138) + an adapter-free DISCOVERY SWEEP over the shallow tail + tn36 click-schema RE. SELF-LEARNING = a LEARNED FRAME ENCODER for cross-game value transfer (the gap exp4318's generic-feature null logged). RETIRE the cross-domain selection scope (exp4314 repeated the domain-bound verdict -> retire_if_same_verdict fired). .399 close-state: in-generation moat CLOSED oracle-distinct (verifier_thesis_state=in_generation_moat_holds); cross-domain RETIRED domain-bound; efficiency always-energy-dominates; ARC 13 reproducible levels / 11 games + FIRST live submission (scorecard 0f6273ce); cross-game transfer NULL with generic features; off-ARC execution marginal-win (execution-grounded); paper_ready=True."
milestone_doc: openspec/change-proposals/research-roadmap-v400.md
milestone_overview: |
  .399 closed ONE of the two open moats DECISIVELY and oracle-distinctly (the in-generation moat: exp4315 reward-guided
  step-stitching beat both an engaged control and the model's own self-reward SMC, CI95-excl-0, verifier_is_oracle=false)
  and RETIRED the other (cross-domain selection is genuinely math/ARC domain-bound -- exp4314 repeated the exp4305
  verdict). .400 is DEPTH on exactly the proven-or-mandated directions (north-star §1 Depth-Over-Breadth), NOT breadth:

    PHASE 0 -- TRANSITION: exp4324 archive .399 -> activate .400; record the TRUE .399 close-state.

    PHASE A -- HEADLINE: SCALE & HARDEN the in-generation oracle-distinct moat win (-> the DiffusionGemma gate):
      A1 (exp4325) REPLICATE exp4315's reward-guided step-stitching on a 2ND oracle-distinct corpus + MORE power
        (n>=80, more seeds), same skeptic-proof harness (engaged control + self-reward SMC + no-op guard + independent
        leak re-check). Confirms the moat is NOT corpus-specific. verifier_is_oracle=false.
      A2 (exp4326) ADAPTIVE guided-generation SCALE-UP (2606.08501 reward-state alignment / 2606.13565 A2D2 /
        2509.25171 TR2-D2 -- VERIFY the IDs in PRECONDITIONS): the leak-checked scorer as the reward for bounded
        adaptive DiffusionGemma generation, with a NO-ADAPTATION control + frozen held-out + leak check. Aspiration:
        run on ARC-GRID generation (unifying the headline with the north star). verifier_is_oracle=false.

    PHASE B -- ARC NORTH STAR (operator MANDATORY 2026-06-17): EXECUTABLE-WORLD-MODEL solver on the DEEP TAIL:
      B1 (exp4327) E3 ar25 (the VALIDATED game: gpt-5.5 induced a genuine flood-fill world model, Carnot
        WorldModelVerifier grounded it at 61% vs 35% identity) -> drive the multi-round refactor + win-seeking
        exploration to L1. The codex agent IS the proposer (NO nested CodexProposer). verifier_is_oracle=true.
      B2 (exp4328) E3 ka59 -> L1.
      B3 (exp4329) E3 tr87 + ft09 (+1 level each, checkpoint per game, hard per-game wall-time cap).

    PHASE C -- ARC NORTH STAR (shallow tail): exp4330 adapter-free graph-explore DISCOVERY SWEEP (2512.24156, 12k
      budget) over the remaining unsolved shallow-tail games + reverse-engineer tn36's ACTION6 click-payload schema;
      capture + reproduction-gate any new L1 solves. Monotonic +1+. verifier_is_oracle=true.

    PHASE D -- CONTINUOUS SELF-LEARNING (mandated; NEW mechanism): exp4331 a LEARNED FRAME ENCODER over the 11 solved
      games' traces; re-test leave-one-game-out cross-game value transfer for SEARCH EFFICIENCY (the gap exp4318's
      generic-feature null logged). verifier_is_oracle=false.

    PHASE E -- INFRA + HYGIENE + CAPSTONE: exp4332 SOTA-ingestion -> .401; exp4333 registry/gaps hygiene + GAP-4
      regression guard; exp4334 hardware continuity (opportunistic); exp4335 capstone .400 + the DiffusionGemma gate
      decision + G1-G4.

  HARD RULE (every task): the conductor stays STOOD-DOWN on TRM training -- NO task may launch TRM training, run
  pkill/kill against train.py, or WRITE results/trm_runs/. Qwen is FORBIDDEN as the TRAINED base (Spurious-Rewards
  confound); Qwen/Gemma GGUF as an off-policy JUDGE/GENERATOR is fine. Every LEARNED-verifier value task MUST declare
  verifier_is_oracle honestly (Circularity Discipline): an EXECUTABLE-oracle win (E3 solve, adapter-free solve, demo-fit)
  is execution_grounded (verifier_is_oracle=true, ARC progress, NOT a moat headline); the moat is the oracle-DISTINCT
  learned result with a matched control + CI95-excl-0. NO autonomous edits to docs/index.html / README / paper prose.
  Online ARC play stays operator-gated (NO leaderboard submission). DiffusionGemma MUST use the llama.cpp PR binary,
  NOT a standard GGUF loader (known-issues 2026-06-15). The cross-domain SELECTION scope is RETIRED (exp4314) -- do NOT
  re-propose it. In-loop verifier-as-reward LLM TRAINING is OUT-OF-BAND/operator-owned -- do NOT propose it.

