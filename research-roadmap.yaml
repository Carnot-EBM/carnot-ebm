      verdict: phase5_import_fixed_but_unrelated_collection_debt_remains
      addressed_by: "exp1377 fixed the phase5 intermediate_scale_v3 import blocker (5/5 targeted tests pass). However, exp1377's notes indicate 'full tests/python still had unrelated collection debt'. This task identifies and fixes all remaining collection errors so the full test suite runs cleanly."
      retire_if_same_verdict: false
