         baseline) with bootstrap CI95. EMIT BARE decision_need_value_accuracy_delta_median (A1b's gated_on
         reads it raw).
      4. MIGRATION FORK (secondary -- only for games with a positive value delta): run plan_in_model with the
         decision-need representation and classify whether any NEVER_ENUMERATED game migrated to COVERED.
