- id: exp1046-zenil-alpha-t-fr11
  milestone: 2026.04.81
  deliverable: results/experiment_1046_zenil_alpha_t_fr11.json
  title: "Zenil alpha_t Grounding + Phase-3 AND-Composition k=5 (FR-11 MANDATORY SELF-LEARNING)"
  prior_failures:
    - experiment_id: exp1031-energy-ssd-v3
      verdict: fr11_loop_closed_but_synthetic_fallback
      addressed_by: "Exp 1031 closed FR-11 loop with 100 examples but used generation_mode=synthetic_fallback. Carnot energy filter accuracy was 0.196 vs temperature filter accuracy 1.0 — the energy filter was WRONG (negative energy gap). This experiment diagnoses why and implements the Zenil α_t grounding module (the formal framework for measuring Carnot's actual contribution as an exogenous signal). Must use LIVE SOTA model generation."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    This is the MANDATORY continuous self-learning experiment for milestone .81 per FR-11.

    Exp 1031 closed the FR-11 loop with 100 examples but used synthetic_fallback and showed
    energy filter accuracy=0.196 vs temperature=1.0 — Carnot's energy filter was WORSE than
    random temperature selection. The Zenil (2026, arXiv 2601.05280) framework explains why:
    Theorem 4 says α_t must be > 0 for self-distillation to converge. If Carnot's energy
    function is providing no better signal than temperature (or worse), α_t ≈ 0 and the loop
    will not converge.

    This experiment:
    1. Implements the Φ measurement module to compute α_t for Carnot's energy function.
    2. Deploys a Phase-3 AND-composition verifier (k=5 base verifiers) per the Deep Think
       Round-9 4-step recipe (FPGA-feasible variant with k_max=5, not k=15).
    3. Uses LIVE SOTA model generation (not synthetic_fallback) for the FR-11 training examples.
    4. From arXiv 2604.03128 (Self-Distilled RLVR): validates that the energy verifier provides
       stable grounding; from arXiv 2601.20802 (SDPO): the energy explanation IS the feedback signal.

    EXISTING CODE TO READ FIRST:
    - docs/research-notes/ — look for zenil-deep-think-*.md files (Round 6-9 derivations)
    - openspec/change-proposals/zenil-grounded-self-distillation-deployable-stack.md (full spec)
    - python/carnot/eval/metrics.py (AUROC etc. — use canonical metrics)
    - python/carnot/models/sc_energy.py or equivalent (SC-Energy Tier 2 — energy function)
    - python/carnot/pipeline/verify_repair.py (understand available verifiers)
    - scripts/experiment_template.py (cached_sota_pair() for SOTA model loading)
    - data/fr11_ssd_training_v3.jsonl (Exp 1031 training examples — understand schema)

    TASK:
    1. IMPLEMENT Φ MEASUREMENT MODULE (python/carnot/eval/phi_test.py):
       The α_t metric = fraction of examples where Carnot's energy verdict CHANGED the model's
       selection vs temperature-only baseline.
       def measure_alpha_t(energy_verdicts, temperature_verdicts):
           """Measure Carnot's exogenous grounding contribution as α_t.
           Args:
               energy_verdicts: list of (example_id, verdict, energy_score)
               temperature_verdicts: list of (example_id, verdict, temperature)
           Returns:
               alpha_t: float in [0, 1] — fraction where energy changed selection
               delta_examples: list of example_ids where they disagreed
           """
           assert len(energy_verdicts) == len(temperature_verdicts)
           disagreements = sum(1 for e, t in zip(energy_verdicts, temperature_verdicts)
                              if e[1] != t[1])
           return disagreements / len(energy_verdicts), [...]
       Write tests: alpha_t=0 when energy and temperature always agree; alpha_t=1 when always differ.
    2. PHASE-3 AND-COMPOSITION VERIFIER k=5:
       Implement AndComposedVerifier(verifiers, k=5):
       - Takes up to 5 individual verifier functions
       - Verdict is AND of all k verdicts: output "correct" only if ALL k agree
       - Records bypass_rate: fraction of examples where AND composition disagreed with any single verifier
       Available verifiers to compose (from python/carnot/ codebase):
         1. Z3 step verifier (VeriCoTStepValidator)
         2. Ising energy sampler (low energy = correct)
         3. KAEMEnergy classifier
         4. SC-Energy Tier 2
         5. ThinkPRM probe (if available from Exp 1045; else use a confidence threshold)
    3. LIVE SOTA GENERATION (not synthetic_fallback):
       Load unsloth/Qwen3.6-35B-A3B-GGUF using cached_sota_pair().
       Generate 8 candidates per question for 50 arithmetic+reasoning questions.
       This is the live version of Exp 1031 — MUST have inference_mode='live_gpu'.
       If GPU unavailable: write blocked_no_live_gpu verdict (do NOT use synthetic_fallback).
    4. MEASURE α_t:
       a. Temperature filter: keep bottom-25% by temperature (Exp 1031 baseline)
       b. Carnot AND-composed filter (k=5): keep candidates where ALL 5 verifiers say "correct"
       c. Compute α_t = fraction where AND-composed verdict != temperature verdict
       d. Compare accuracy on filtered sets using correctness evaluation
    5. FR-11 TRAINING EXAMPLES: Write 100+ examples where α_t > 0 to data/fr11_zenil_distill_v1.jsonl.
       Schema: {question, candidate, energy_verdict, temperature_verdict, alpha_t_contribution, seed}
    6. TESTS: Write tests/python/test_phi_test.py with at least 3 tests for measure_alpha_t().

    USE GPU: sg render -c 'JAX_PLATFORMS=cpu TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1 python scripts/experiment_1046_zenil_alpha_t_fr11.py'
