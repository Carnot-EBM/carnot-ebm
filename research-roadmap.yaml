    3. IMPLEMENT FROZEN-PREFIX EVALUATION:
       a. Take 10 test sequences from FoVer corpus (or generate simple examples)
       b. For each sequence s[0...N]:
          - FULL SEQUENCE: run NRGPT energy trace on s[0...N], measure monotonicity
          - ISOLATED FIRST TOKEN: run NRGPT on s[0] ONLY (no prefix), measure monotonicity
            (monotonic = each iteration t has E_t <= E_{{t-1}})
       c. Compare: is first-token trace monotonic? Count: n_monotonic_first_token of 10

    4. CLASSIFY REGIME:
