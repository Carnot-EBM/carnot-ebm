      6. Compare family, scale, surface, source, subset size, and solver-effort strata. Require exact answer equality across all arms.
      7. Attack label-aware selection, post-solve criticality, unequal prefix budgets, duplicate prefixes, free selection cost, and random-seed cherry-picking. Set enumerative_headroom_ready_score=1.0 only for held improvement over both native and random controls with charged-cost noninferiority.
      8. Emit the artifact. Run focused tests, coverage, lint, spec coverage, row lint, adversarial verification, exact-solver E2E checks, and git status. Reconcile specs and ops docs.

