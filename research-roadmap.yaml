  - id: exp2593
    title: "Capstone v248"
    agent_type: claude
    model: opus
    max_turns: 100
    requires_claude: true
    # Justification for requires_claude:
    # 1. CODEX HAS DEMONSTRABLY NOT EXECUTED at this task category: 22+ consecutive
    #    milestones with 0 substantive experiments completed (codex backend cascade).
    #    The capstone runs because Claude (outer-loop) executes it directly.
    # 2. MULTI-FILE TOOL CHOREOGRAPHY: reads 10+ experiment result files, compares
    #    AUROC trajectories, summarizes hardware states, assesses product viability,
    #    writes operator recommendation. Requires holding cross-file context.
    # 3. MULTI-STEP OPEN-ENDED JUDGMENT: recommends milestone directions, assesses
    #    whether AUROC improved, identifies paper-readiness, flags remaining blockers.
    #    No deterministic gate substitutes for synthesis across 10 experiments.

    context: |
      Capstone synthesis for milestone 2026.05.248. Read all experiment artifacts from
      results/experiment_258*.json (exp2582–exp2592) and produce a comprehensive
      milestone assessment.

      NO HARD GATE: this task runs regardless of upstream experiment outcomes.
      The honest assessment of which tasks succeeded/failed IS the capstone deliverable.

    existing_code_to_read:
      - results/experiment_2582_archive_v247.json
      - results/experiment_2583_tier0s_real_retrain.json
      - results/experiment_2584_tier0u_real_fix.json
      - results/experiment_2585_hf_model_card_citation.json
      - results/experiment_2586_ipfs_mirror.json
      - results/experiment_2587_safety_corpus_verifier.json
      - results/experiment_2588_safety_ensemble.json
      - results/experiment_2589_jepa_v3_online.json
      - results/experiment_2590_kv260_continuity.json
      - results/experiment_2591_ensemble_v9.json
      - results/experiment_2592_paper_update.json
      - ops/status.md
      - research-program.md

    concrete_steps: |
      1. Read all experiment artifacts (exp2582–exp2592). For each: record experiment_id,
         honest_verdict, key metrics, whether acceptance gates passed.

      2. Compute n_experiments_completed (count of verdicts starting with complete: or success:
         or passed: or shipped:).

      3. Assess headline AUROC: if ensemble v9 ran (exp2591 non-null), record
         best_248_auroc = exp2591.ensemble_v9_auroc. Else: best_248_auroc = 0.9857 (v7b carried).

      4. Assess hardware status:
         - GateMate: TERMINAL (confirmed .247). No new action needed.
         - KV260: read exp2590.kv260_terminal. If True → graduated. If False → still blocked.

      5. Assess product tracks:
         - Safety classifier: read exp2587.safety_verifier_viable. Record viable/not_viable.
         - JEPA online: read exp2589.checkpoint_loaded and online_update_implemented.
         - IPFS mirror: read exp2586.ipfs_cid (Rule 3 compliance).
         - FR-11: read exp2589.online_update_implemented.

      6. Write operator recommendation covering:
         - Top 3 gaps for .249
         - Whether arXiv submission is now appropriate (requires: paper compiled, AUROC confirmed,
           all headline claims adversarially verified, IPFS CID documented)
         - Structural planning-execution gap status: still active? improved?

      7. Write results/experiment_2593_capstone_v248.json with all required fields.

    required_artifact_fields:
