  - id: exp4325-in-generation-moat-replicate-second-corpus
    milestone: 2026.06.400
    title: "PHASE A1 (HEADLINE; HARDEN the CLOSED in-generation moat) -- REPLICATE exp4315's reward-guided step-stitching win on a 2ND oracle-distinct corpus + MORE power. .399 (exp4315) CLOSED the in-generation moat oracle-distinctly: reward-guided step-stitching (2602.22871) with the leak-rechecked exp4292 partial-state scorer beat the best engaged control (EntRGi, +0.225) AND the model's INTRINSIC self-reward SMC (2602.01849, +0.35), guidance_moat_ci95 [0.075,0.375] EXCLUDING 0, controls_differentiated=true, scorer_leak_recheck_passed=true -- BUT on n=40/arm and a SINGLE multiple-choice reasoning corpus. The operator was TWICE-burned by premature DiffusionGemma over-claims (.396/.397), so before any DiffusionGemma-gate-flip claim the win MUST replicate on a DIFFERENT oracle-distinct reasoning corpus at MORE power (n>=80/arm, >=3 seeds). Reuse the EXACT exp4315 harness: unguided + the engaged control (EntRGi 2602.05000) + self-reward SMC (2602.01849, intrinsic, the must-beat baseline) + Carnot reward-guided stitching; the no-op guard (controls_differentiated); an INDEPENDENT leak re-check on the exp4292 scorer on THIS corpus. Emit in_generation_moat_replicates BARE bool := (Carnot-stitched - best-engaged-control > 0 AND CI95-excl-0 AND controls_differentiated AND Carnot-stitched - self-reward-SMC > 0) ON THE 2ND CORPUS. verifier_is_oracle=false. A replication is the strongest evidence yet (gate-flip candidate); a powered failure-to-replicate is decision-grade (the win was corpus-specific). NO TRM training; NO leaderboard submission; DiffusionGemma via the llama.cpp PR binary."
    priority: critical
    track: diffusiongemma-scaleup
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "north-star §1 (advance the headline or it is noise) + the .399 SOTA-ingestion flag (exp4320 flagged_for_v400=scaled_external_verifier_guided_diffusiongemma_generation_v400) + the DiffusionGemma gate (diffusiongemma-energy-guided-diffusion-spec.md THE GATE requires an oracle-distinct learned-verifier win with a matched control, replicated) -- false-positive scope-match vs exp4315 (the .399 in-generation moat CLOSE, SUCCEEDED, NOT retired); forward difference = REPLICATION on a 2ND oracle-distinct corpus + MORE power (n>=80, >=3 seeds), the hardening the operator's twice-burned history requires before any gate-flip claim. verifier_is_oracle=false."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4325_in_generation_moat_replicate_second_corpus.json
    prompt: |
      CONTEXT: north-star §1 + §5 -- the in-generation moat (exp4315) is the project's FIRST oracle-distinct verifier
      win IN GENERATION (the external verifier steers DiffusionGemma generation better than the model's own confidence)
      and the candidate to flip the DiffusionGemma gate. But it is one modest-n multiple-choice corpus. The operator was
      TWICE-burned (.396/.397) -> REPLICATE on a 2ND oracle-distinct reasoning corpus + MORE power BEFORE any gate-flip
      claim. This is HARDENING the headline, not a new direction.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4315_diffusiongemma_reward_guided_stitching.json (the WIN to replicate: the EXACT harness --
          unguided + EntRGi engaged control + self-reward SMC + Carnot reward-guided stitching + the no-op guard + the
          independent leak re-check; the corpus shape, the per-arm accuracies, the bootstrap)
        - results/experiment_4292_partial_state_diffusion_scorer_build.json + the persisted scorer module (the partial-state scorer to reuse + re-check on the 2nd corpus)
        - scripts/exp_diffusiongemma_energy_prior_extract.py + results/diffusiongemma_energy_prior_extracted.json (the PR-binary call: llama-diffusion-gemma-eval <gguf> <prompt_ids.i32> <canvas_ids.i32> <out_logits.bin>; canvas=256 mask tokens id=4; vocab 262144)
        - docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md (THE GATE the replication serves)
        - scripts/experiment_template.py, scripts/adversarial_verify.py (DEGENERATE_CONTROLS check), scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Pre-Launch Preconditions", "Inference-Substrate Declaration", "GGUF tokenizer rule", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: replicate the exp4315 reward-guided step-stitching moat on a 2ND oracle-distinct reasoning corpus at n>=80/arm, >=3 seeds; report the replication verdict.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any inference):
           a. PR binary: `ls ~/.cache/llama.cpp-master/build/bin/llama-diffusion-gemma-eval` non-empty.
           b. DiffusionGemma GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--diffusiongemma-26B-A4B-it-GGUF/` non-empty. 1x RTX 3090 fits the Q4_K_M (16GB).
           c. The exp4292 scorer module loads AND a 2ND oracle-distinct reasoning corpus (DIFFERENT from exp4315's) is available (e.g. a different reasoning benchmark slice). If the 2nd corpus is unavailable -> honest_verdict `blocked_second_corpus_unavailable` and STOP.
           d. The conductor is stood-down on TRM training; this task does NO TRM training and does NOT touch results/trm_runs/.
           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate inference.
        1. INDEPENDENT LEAK RE-CHECK on the exp4292 scorer ON THE 2ND CORPUS: re-ablate the answer-bearing cells; if the
           scorer's signal collapses to chance with the answer masked -> emit scorer_leak_recheck_passed=false +
           honest_verdict `scorer_leaky_on_second_corpus` and STOP. If it survives -> scorer_leak_recheck_passed=true; proceed.
        2. WINDOW DISCIPLINE: synchronous, checkpoint after EVERY trajectory, print per-task progress. NO-OP GUARD: smoke
           that each arm CHANGES token selection; if any two arms tie bit-identically -> controls_differentiated=false +
           honest_verdict `controls_not_differentiable` and STOP.
        3. On the 2ND corpus (n>=80/arm, >=3 seeds for power), run the arms: unguided, EntRGi engaged control,
           self-reward SMC (the must-beat intrinsic baseline), Carnot reward-guided stitching. Report per-arm accuracy +
           Carnot-minus-(best engaged control) + Carnot-minus-self-reward-SMC + Carnot-minus-unguided + task-level
           bootstrap CI95 (>=2000 resamples) + the guidance-dynamics diagnostic (mask entropy / token-change covariance).
        4. Emit in_generation_moat_replicates BARE bool := (Carnot-stitched - best-engaged-control > 0 AND its CI95
           excludes 0 AND controls_differentiated AND Carnot-stitched - self-reward-SMC > 0) ON THE 2ND CORPUS. Run
           adversarial_verify.py (clean; verifier_is_oracle=false). Declare random_seed + reproducibility_checksum +
           model_specs (DiffusionGemma GGUF + PR binary + the partial-state scorer + the 2nd corpus + the stitching
           config + the control construction + denoising steps + n + seeds). Plausible duration (live 26B inference).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A replication (the moat holds on a 2nd corpus, CI95-excl-0 -- gate-flip candidate), a POWERED failure-to-replicate (corpus-specific -> the headline narrows), a controls_not_differentiable, and a scorer_leaky_on_second_corpus are ALL COMPLETE and decision-grade."
        in_generation_moat_replicates:
          principle: "BARE bool: the capstone reads this (gated-fields-must-be-bare); true iff the LEARNED (oracle-distinct) reward-guided-stitched run beats the BEST engaged control AND CI95-excl-0 AND controls_differentiated AND beats self-reward SMC ON THE 2ND CORPUS -- the replication that makes the in-generation moat headline/gate-grade."
        carnot_minus_best_control_delta:
          principle: "BARE float: Carnot-stitched minus the best engaged control on the 2nd corpus (compare to exp4315's +0.225)."
        carnot_minus_self_reward_smc_delta:
          principle: "BARE float: Carnot-stitched minus self-reward SMC on the 2nd corpus (the sharpest oracle-distinct test; compare to exp4315's +0.35)."
        replication_ci95:
          principle: "Task-level bootstrap CI95 (>=2000 resamples) of the Carnot-minus-best-engaged-control delta on the 2nd corpus -- excluding 0 is the decision-grade replication."
        controls_differentiated:
          principle: "BARE bool: true iff no two control arms tie bit-identically (the no-op guard) -- a moat off no-op controls is meaningless."
        scorer_leak_recheck_passed:
          principle: "BARE bool: the independent leak re-check on the 2nd corpus -- true iff the scorer's signal SURVIVES masking the answer cells."
        benchmark_n:
          principle: "BARE int: per-arm n on the 2nd corpus -- MUST be >= 80 (the power exp4315's n=40 lacked)."
        verifier_is_oracle:
          principle: "BARE bool=false -- the learned partial-state scorer is oracle-distinct (NOT the executable oracle); a circular guidance win cannot headline."
        preconditions_checked:
          principle: "Records the PR-binary + GGUF cache + scorer-loadable + 2nd-corpus + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the denoising + stitching + bootstrap."
        reproducibility_checksum:
          principle: "Hash of the 2nd corpus + stitching config + control construction + PR-binary inputs; lets a third party re-run."
        model_specs:
          principle: "DiffusionGemma GGUF + PR binary + the partial-state scorer + the reward-guided-stitching config + the self-reward-SMC baseline + the engaged control + denoising steps + the 2nd corpus + n + seeds; required methodology."
      ACCEPTANCE GATE:
        - condition: "in_generation_moat_replicates + carnot_minus_best_control_delta + carnot_minus_self_reward_smc_delta + replication_ci95 + controls_differentiated + scorer_leak_recheck_passed + benchmark_n (>=80) reported with verifier_is_oracle=false and preconditions_checked, OR an honest blocked_second_corpus_unavailable / controls_not_differentiable / scorer_leaky_on_second_corpus / powered-non-replication verdict"
          principle: "Replicating the in-generation oracle-distinct moat on a 2nd corpus at power is the hardening the operator's twice-burned DiffusionGemma history requires before the gate can flip; a powered non-replication narrows the headline honestly."

      Run: `python3 {project_root}/results/experiment_4325_in_generation_moat_replicate_second_corpus.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

