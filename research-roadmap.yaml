milestone: 2026.06.394
milestone_title: "HARDEN the first ARC oracle-distinct win then EXTEND selection->synthesis then STAGE DiffusionGemma -- .393 LANDED the program's FIRST genuine ARC oracle-distinct verifier-beats-vote win (exp4245 ARC-MOAT-WON: set_encoder@1 0.692 vs vote@1 0.25, delta +0.4423, bootstrap CI95 [0.308,0.596] EXCLUDES 0, verifier_is_oracle=false, oracle@K 0.827, n=52, adversarial-clean; flips diffusiongemma_gate_resolvable=true) but the win is SINGLE-SEED (4245), n=52, and carries a PROVENANCE-LEAK risk (positive labels = exact match to gold/GAP-4-induced pred_grid; features include shape/palette-family + duplicate-counts that could encode candidate ORIGIN not correctness) AND came from the GROWN POOL (A1 positives 20->48) NOT the set-encoder architecture (exp4244 DeepSets AUROC 0.963 UNDERPERFORMED the .392 logistic 0.980). Per CLAUDE.md 'cross-check surprising results', the program's #1 positive is NOT headline-eligible nor scale-up-eligible until it SURVIVES adversarial scrutiny. .394 is DEPTH on the headline: PHASE A HARDENS it -- A1 LEAK-AUDIT (provenance-blind features + an explicit candidate-ORIGIN probe), A2 MULTI-SEED (>=5 seeds) + independent clean-room replication, A3 CROSS-GAME transfer (train on a subset of games, test on HELD-OUT games -- the real OOD test, cf. ARC-1->ARC-2 collapse) -- then A4 EXTENDS selection->SYNTHESIS (AggLM grid-reconciliation, gated_on A1^A2, breaks the oracle@K=0.827 ceiling per Compute-as-Teacher 2509.14234). PHASE B STAGES the scale-up: B1 DiffusionGemma energy-guided PREFLIGHT only (cached; gated_on A1^A2; full run deferred to .395 on the win surviving) + B2 monotonic ARC +1 (->20) + B3 live-env accuracy probe. PHASE C RESOLVES the owed axes the disciplined way: C1 verifier-as-reward RE-SCOPED to OUT-OF-BAND (7th in-window failure = infeasible; prepare corpus+runner for operator execution like the TRM checkpoint, or RETIRE) + C2 code oracle-distinct replication on a FRESH 2nd corpus or retire. PHASE D: SOTA-ingestion + registry/gaps + hardware + capstone."
milestone_doc: openspec/change-proposals/research-roadmap-v394.md
milestone_overview: |
  .393 delivered the program's FIRST genuine oracle-distinct verifier-beats-vote win on ARC -- the north-star
  domain (exp4245 ARC-MOAT-WON: set_encoder@1 0.692 vs vote@1 0.25, delta +0.4423, CI95 [0.308,0.596] excl 0,
  verifier_is_oracle=false, oracle@K 0.827, matched-control 0.21, n=52, adversarial-clean). This flips
  diffusiongemma_gate_resolvable=true. The honest close-state and its three caveats:
    - THE WIN CAME FROM THE GROWN POOL, NOT THE SET-ENCODER. exp4244's DeepSets set-encoder (AUROC 0.963)
      UNDERPERFORMED the .392 augmented-logistic (0.980, delta -0.016). A1's data-sparsity fix (positives
      20->48, wrong_majority 9->30) was load-bearing; the flagged "full set-encoder" architecture was not.
    - THE WIN IS SURPRISING + SINGLE-SEED. +44pp from a TIE (0.0 at .392), n=52, seed 4245 only. CLAUDE.md
      mandates replication (n>1 seeds, same direction) before a surprising result headlines.
    - THE WIN HAS A PROVENANCE-LEAK RISK. Positive labels = exact match to gold-flagged OR the GAP-4 INDUCED
      pred_grid; features include shape/palette-family indicators + duplicate counts that could encode
      candidate ORIGIN (induced-program output vs sampled candidate) rather than correctness -> a leaked,
      circular detector would inflate AUROC to ~0.96 and the delta to +44pp while NOT being oracle-distinct.
    - ARC north star: 19 levels / exp4249 -> L5; live-env solver 0 levels, efficiency-only (exp4250).
    - OWED axes stuck: verifier-as-reward (FR-11) failed a 7th time (exp4247 OFFLINE pivot also
      cannot_run_in_window, flagged CRITICAL; exp4248 gate-blocked); live_lora_retired=true recorded. Code
      oracle-distinct replication BLOCKED (exp4246, second corpus missing) -- the .392 +3.1pp stays single-corpus.
    - SOTA-ingestion (exp4251) flagged the .394 direction: agglm_synthesize_corrected_grid_from_set_encoder_
      evidence (go beyond SELECTION to SYNTHESIS, since oracle@K=0.827 caps selection at 83%).

  .394 is DEPTH, not churn. It does ONE thing on the headline -- HARDEN the first ARC oracle-distinct win by
  closing the three caveats (leak-audit + multi-seed/repro + cross-game transfer) and only THEN extending it
  (selection->synthesis) and STAGING the scale-up (DiffusionGemma preflight, full run gated to .395) -- and
  RESOLVES the owed axes the disciplined way (re-scope reward to out-of-band, retry code on a fresh corpus).

    PHASE A -- HARDEN + EXTEND THE ARC ORACLE-DISTINCT HEADLINE:
      A1 (exp4256) LEAK-AUDIT: re-run the decisive gate with PROVENANCE-BLIND features (strip family/duplicate
        signals) + an explicit candidate-ORIGIN probe (predict induced-vs-sampled; leak iff highly predictive
        AND correlated with is_correct). Emit win_survives_provenance_blind BARE bool.
      A2 (exp4257) MULTI-SEED (>=5 fold reshuffles) -> mean delta + cross-seed CI, AND an independent
        clean-room re-score from the persisted pool via a separate path. Emit oracle_distinct_win_replicates BARE bool.
      A3 (exp4258) CROSS-GAME transfer: train on a subset of GAMES, test on HELD-OUT GAMES (the real OOD test).
      A4 (exp4259, gated_on A1 win_survives_provenance_blind AND A2 oracle_distinct_win_replicates) AggLM
        grid-SYNTHESIS: DeepSets-weighted per-cell reconciliation -> a synthesized grid validated by EXACT
        grid match; vote/selector-only/no-synthesis controls; target the oracle@K-fail 17%. verifier_is_oracle=false.
    PHASE B -- STAGE THE SCALE-UP + ARC NORTH STAR:
      B1 (exp4260, gated_on A1 AND A2) DiffusionGemma energy-guided PREFLIGHT (cached): wire the verifier
        ensemble as a guidance energy on a TINY denoising smoke; GO/NO-GO + cost estimate. FULL RUN DEFERRED TO .395.
      B2 (exp4261) monotonic ARC +1 (total_levels>=20). B3 (exp4262) live-env ACCURACY probe, NO submission.
    PHASE C -- RESOLVE OWED AXES (decision, not another doomed attempt):
      C1 (exp4263) verifier-as-reward RE-SCOPED to OUT-OF-BAND (prepare corpus+runner; operator runs like TRM)
        OR retire (FoVer +0.0185 stands). C2 (exp4264) code oracle-distinct replication on a FRESH 2nd corpus or retire.
    PHASE D: D1 (exp4265) SOTA-ingestion (.395 forks); D2 (exp4266) registry+gaps hygiene + GAP-4 regression
      guard + record .394; D3 (exp4267) hardware continuity; D4 (exp4268) capstone .394.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227) and the conductor stays stood-down.
  NO task may launch TRM training, run pkill/kill against train.py, or WRITE
  results/trm_runs/sudoku_extreme_baseline/. Qwen is FORBIDDEN as the TRAINED base (Spurious-Rewards confound);
  Qwen GGUF as an off-policy teacher/certifier is fine. DiffusionGemma full run stays DEFERRED to .395 (B1 is a
  PREFLIGHT only). Every verifier-value task MUST declare verifier_is_oracle honestly (Circularity Discipline).
  Online ARC play stays operator-gated (NO leaderboard submission).

