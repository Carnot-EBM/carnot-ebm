milestone: 2026.05.128
milestone_title: "Phase-6 NSVIF Extraction, EBCN Coherence, and Continuous Non-Forgetting"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1666-nsvif-dsl-parser
    title: "Phase 1: NSVIF Instruction-to-Constraint DSL Parser"
    agent_type: codex
    max_turns: 50
    prompt: |
      CONTEXT: We need to solve the primary product gap: turning NL prompts into executable Carnot constraints.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/
      TASK: Build an NSVIF-style instruction-to-constraint parser and bounded DSL.
      CONCRETE STEPS:
      1. Write a parser in `python/carnot/pipeline/nsvif_parser.py` that maps natural language into a small Carnot DSL.
      2. Compile logical constraints to PySAT/Z3 validators.
      3. Evaluate zero-false-accept behavior using `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF`.
      4. Write the results to `{project_root}/results/experiment_1666_nsvif.json` with fields `false_accepts` and `compilation_rate`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1667-ebcn-coherence
    title: "Phase 1: Energy-Based Constraint Networks (EBCN) Coherence Score"
    model: sonnet
    max_turns: 50
    gated_on:
      - upstream: exp1666-nsvif-dsl-parser
        artifact_field: false_accepts
        op: '=='
        value: 0
    prompt: |
      CONTEXT: Following Phase 3/Phase 4 goals for structural coherence without sequence generation.
      EXISTING CODE TO READ FIRST: python/carnot/models/
      TASK: Implement an EBCN prototype to score the coherence of reasoning traces.
      CONCRETE STEPS:
      1. Create `python/carnot/models/ebcn_coherence.py`.
      2. Implement a dual-head attention state-space model that produces a scalar energy score for contradiction detection.
      3. Evaluate against a small set of logical contradictions.
      4. Write `{project_root}/results/experiment_1667_ebcn.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1668-cerce-ledger
    title: "Phase 2: CerCE-style Certified Non-Forgetting Ledger for FR-11"
    agent_type: codex
    max_turns: 40
    prompt: |
      CONTEXT: FR-11 needs a CerCE-style certificate ledger to prevent mode collapse during policy promotion.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/
      TASK: Add a certificate ledger around FR-11 policy promotion.
      CONCRETE STEPS:
      1. Update or create `python/carnot/pipeline/cerce_ledger.py`.
      2. Implement pre/post constraint violation bounds, replay retention checks, and a reject-if-bound-worsens gate.
      3. Test the promotion gate with simulated memory updates.
      4. Write `{project_root}/results/experiment_1668_cerce.json` containing `nonforgetting_rate`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1669-ltlzinc-benchmark
    title: "Phase 2: LTLZinc Continual Learning Adapter"
    agent_type: codex
    max_turns: 30
    prompt: |
      CONTEXT: We need a temporal benchmark for the new CerCE non-forgetting ledger.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/cerce_ledger.py
      TASK: Build an LTLZinc continual learning adapter.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/ltlzinc_adapter.py`.
      2. Generate temporal/constraint cases using MiniZinc format logic.
      3. Measure the forgetting rate using the CerCE ledger on these cases.
      4. Write `{project_root}/results/experiment_1669_ltlzinc.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1670-egd-decoding
    title: "Phase 3: Energy-Guided Decoding (EGD) for Hallucination Mitigation"
    model: sonnet
    max_turns: 50
    prompt: |
      CONTEXT: EGD offers a hyperparameter-free strategy to select hidden states using minimal energy scores.
      EXISTING CODE TO READ FIRST: python/carnot/models/
      TASK: Port EGD to Carnot's SOTA models for structured generation.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/energy_guided_decoding.py`.
      2. Wrap inference calls to `unsloth/gemma-4-31B-it-GGUF` applying EGD selection.
      3. Test on a bounded dataset to evaluate the hallucination "Yes-ratio" bias.
      4. Write `{project_root}/results/experiment_1670_egd.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1671-rkan-audit
    title: "Phase 3: Exact-Rational KANs (RKANs) Verification Audit"
    agent_type: codex
    max_turns: 30
    prompt: |
      CONTEXT: We need a path to formally verify KAN tiers using exact rational math.
      EXISTING CODE TO READ FIRST: python/carnot/models/
      TASK: Conduct a no-synthesis accounting pass and CPU simulation for Exact-Rational KANs.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1671_rkan_audit.py`.
      2. Replace floating-point logic in a mock KAN with Hybrid Zeckendorf rational math.
      3. Report the complexity and bounding certificates.
      4. Write `{project_root}/results/experiment_1671_rkan.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1672-igd-smoke
    title: "Phase 3: Interleaved Gibbs Diffusion (IGD) Smoke Test"
    model: sonnet
    max_turns: 30
    prompt: |
      CONTEXT: IGD handles mixed continuous-discrete constrained generation.
      EXISTING CODE TO READ FIRST: python/carnot/models/
      TASK: Run a small continuous-discrete denoising smoke test.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1672_igd_smoke.py`.
      2. Implement a mock interleaved Markov chain for a 3-SAT style problem.
      3. Ensure execution on CPU.
      4. Write `{project_root}/results/experiment_1672_igd.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1673-thrml-rng-audit
    title: "Phase 4: Mandatory THRML Independent-RNG Audit"
    model: opus
    max_turns: 100
    prompt: |
      CONTEXT: Known-issues requires verifying that Carnot samplers and THRML-style samplers have independent PRNG lineages.
      EXISTING CODE TO READ FIRST: python/carnot/models/, ops/known-issues.md
      TASK: Perform an independent-RNG audit for THRML vs Carnot.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1673_thrml_rng_audit.py`.
      2. Setup disjoint root seeds and separate PRNG lineages.
      3. Perform exact n=32/n=64 parity sweeps.
      4. Confirm non-zero stochastic deltas and independent sample-path hashes.
      5. Write `{project_root}/results/experiment_1673_rng_audit.json` with field `simulator_only_no_hardware_claim: true`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1674-pipim-simulator
