    \ underspecified / ambiguous / violated (q=4). arXiv 2602.04200 (Restoring Sparsity\
    \ in Potts Machines via Mean-Field Constraints, February 2026) shows how to maintain\
    \ FPGA-compatible sparse coupling structure for q-state Potts machines. This is\
    \ the natural generalization of IsingEBM to 3-class constraint verification,\
    \ with a hardware path to the KV260 FPGA.\n\nEXISTING CODE TO READ FIRST:\n\
