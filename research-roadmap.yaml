         b. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/snapshots/ 2>/dev/null | head -3`
            Record: gemma_gguf_cached (bool). Update stub.
            If gemma_gguf_cached=false: update stub with honest_verdict='blocked_gguf_gemma4_26b_not_cached' and exit.
         c. `find ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/ -name '*.gguf' 2>/dev/null | head -3`
            Record: gguf_files (list of str). Update stub.
            If len(gguf_files)==0: update stub with honest_verdict='blocked_no_gguf_file_found' and exit.
         d. `.venv/bin/python -c "from llama_cpp import Llama; print('ok')" 2>/dev/null || echo missing`
            Record: llama_cpp_available (bool). Update stub.
            If llama_cpp_available=false: update stub with honest_verdict='blocked_llama_cpp_not_installed' and exit.
         e. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            Record: fover_corpus_lines (int).
         Record: preconditions_checked. Update stub with preconditions_checked.

      1. Record overall_start_time = time.perf_counter() BEFORE loading model.
         Load gemma-4-26B-A4B-it-GGUF:
         ```python
         import time
         from llama_cpp import Llama
         t_load_start = time.perf_counter()
         gguf_path = gguf_files[0]
         llm = Llama(model_path=gguf_path, n_gpu_layers=-1, n_ctx=512, seed=42, verbose=False)
         model_load_time_s = time.perf_counter() - t_load_start
         ```
         Update stub with model_load_time_s.
         If model_load_time_s < 5.0: add methodology_note="suspicious: real GGUF load >= 30s".

      2. Generate N=5 live responses (random_seed=42):
         prompts = [
           "What is 47 + 38?",
           "What is the capital of France?",
           "Write a function to reverse a string in Python.",
           "If a train travels 60mph for 2 hours, how far does it travel?",
