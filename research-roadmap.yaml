- id: exp2570-huggingface-model-card-citation
  title: 'Phase 1a: HuggingFace Model Card Update — Add arXiv Preprint Citation'
  milestone: 2026.05.247
  deliverable: results/experiment_2570_hf_model_cards.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 25
  prior_failures:
  - experiment_id: exp2441-phase1-ship-gate
    verdict: 'complete: phase1_ship_gate_met=True; hf_mirror_confirmed=True'
    addressed_by: "exp2441 verified that HuggingFace model cards exist and the mirror is live. This task adds arXiv preprint citation to the model card READMEs after paper submission — a new task (citation update) vs prior task (mirror existence verification). Not a scope-matched prior failure; retire_if_same_verdict=false."
    retire_if_same_verdict: false
  prompt: "CONTEXT: The Carnot arXiv preprint has been submitted (if operator acted on exp2558 checklist). The 16 HuggingFace model cards at huggingface.co/Carnot-EBM need to reference the arXiv preprint so users can find the paper. This task updates the model card README files on disk and prepares push commands for the operator.\n\nPer CLAUDE.md Operator-Only External Publication: this task prepares model card text and push commands. The operator pushes; the task never calls `huggingface-cli upload` or equivalent autonomously.\n\nEXISTING CODE TO READ FIRST:\n  find {project_root} -name 'README.md' | xargs grep -l 'Carnot-EBM\\|carnot' 2>/dev/null | head -5\n  {project_root}/results/experiment_2558_arxiv_package_v4.json (arxiv_ready_v4 and submission status)\n  ls {project_root}/models/ 2>/dev/null | head -10 (model directories if local)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Check if arXiv preprint exists:\n        python3 -c \"import json; d=json.load(open('results/experiment_2558_arxiv_package_v4.json')); print('arxiv_ready:', d.get('arxiv_ready_v4'), 'checklist:', type(d.get('operator_submission_checklist_v4')))\"\n        If exp2558 not found or arxiv_ready_v4=False: proceed anyway (operator may have submitted independently; still update cards to say 'preprint forthcoming').\n        Set arxiv_submitted=(arxiv_ready_v4==True).\n     b. Locate model card files:\n        find {project_root} -path '*/Carnot-EBM/*/README.md' 2>/dev/null | head -5\n        If no local model cards found: set local_model_cards_found=False.\n        If found: list them as model_cards_updated.\n  1. Draft the citation text to add to each model card:\n     If arxiv_submitted=True:\n       '## Citation\\n\\nIf you use this model, please cite:\\n\\n```bibtex\\n@misc{carnot2026,\\n  title={{Carnot: Energy-Based Verification for LLM Reasoning}},\\n  author={{Ian Blenke}},\\n  year={{2026}},\\n  eprint={{XXXX.XXXXX}},\\n  archivePrefix={{arXiv}},\\n  primaryClass={{cs.AI}}\\n}\\n```\\n\\nPaper: https://arxiv.org/abs/XXXX.XXXXX'\n     If arxiv_submitted=False:\n       '## Citation\\n\\nArXiv preprint forthcoming. See the [Carnot GitHub repository](https://github.com/Carnot-EBM/carnot-ebm) for updates.'\n  2. If local model cards found: append citation text to each README.md.\n  3. Produce operator_push_commands: list of `huggingface-cli upload Carnot-EBM/MODEL_NAME README.md` commands for operator to run.\n  4. Set hf_citation_update_ready=True.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - hf_citation_update_ready:\n      principle: \"True if citation text was drafted AND either applied locally OR operator commands produced.\"\n  - local_model_cards_found:\n      principle: \"Documents whether local model card files were available to edit.\"\n  - operator_push_commands:\n      principle: \"Copy-paste commands for operator to push updated model cards. Per Operator-Only External Publication rule, task never pushes autonomously.\"\n  - arxiv_submitted:\n      principle: \"Whether exp2558 indicated arxiv_ready_v4=True. Determines citation text format.\"\n  - model_cards_updated:\n      principle: \"List of README files edited (or empty if no local copies).\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"hf_citation_update_ready == true\"\n    principle: \"Citation update prepared even if arXiv submission is pending — publication trail maintenance is a recurring milestone deliverable per Rule 3.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2571-ipfs-mirror-arxiv-preprint
  title: 'Phase 1b: IPFS Mirror — Pin arXiv Preprint (Rule 3 Distribution)'
  milestone: 2026.05.247
  deliverable: results/experiment_2571_ipfs_mirror.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 25
  prior_failures:
  - experiment_id: exp2441-phase1-ship-gate
    verdict: 'complete: phase1_ship_gate_met=True; hf_mirror_confirmed=True'
    addressed_by: "exp2441 verified PyPI and HuggingFace mirrors. IPFS content-addressed pinning is a different distribution channel (Rule 3 IPFS-over-gitea directive from CLAUDE.md). First IPFS pinning attempt — not a rerun of exp2441 which did not attempt IPFS. retire_if_same_verdict=false."
    retire_if_same_verdict: false
  prompt: "CONTEXT: CLAUDE.md Rule 3 mandates distribution mirroring via IPFS as the secondary channel (preferred over gitea because IPFS is content-addressed and genuinely decentralized). The arXiv preprint PDF should be pinned on IPFS and its CID documented so users can access it without dependency on arxiv.org.\n\nIPFS IMPLEMENTATION GUIDANCE from CLAUDE.md:\n  - Pin via at least one Filecoin-backed pinning service (web3.storage, Storj, or Filebase) for durability\n  - Document CIDs alongside HuggingFace model cards + in README\n  - Users running their own IPFS node automatically become mirrors when they fetch artifacts\n\nTHIS TASK: Pin the arXiv preprint PDF (main.pdf from the LaTeX build) on IPFS and record the CID.\nIf the paper has been submitted and the arXiv ID is known: also pin the HTML abstract page screenshot.\nIf IPFS tools are not installed: document installation steps for operator + simulate the CID computation locally.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/docs/arxiv-paper/main.tex (to confirm paper exists and compile to get PDF)\n  {project_root}/results/experiment_2558_arxiv_package_v4.json (arxiv_ready_v4 status)\n  {project_root}/README.md (to find where to document the CID)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Check for IPFS tooling:\n        command -v ipfs && ipfs version | head -1 || echo 'ipfs_not_installed'\n        command -v w3 && w3 --version | head -1 || echo 'w3cli_not_installed'\n        Set ipfs_tools_available=(which tool is available).\n     b. Check for compiled paper PDF:\n        ls {project_root}/docs/arxiv-paper/main.pdf 2>/dev/null || echo 'pdf_not_found'\n        If not found: check if tectonic is available to compile:\n          command -v tectonic && cd {project_root}/docs/arxiv-paper && tectonic main.tex 2>&1 | tail -3\n        Set pdf_available=(True/False).\n  1. If IPFS daemon is running (`ipfs daemon --version`), pin the PDF:\n     ipfs add {project_root}/docs/arxiv-paper/main.pdf\n     Set ipfs_cid=(the returned CID starting with Qm or bafy).\n     If not running: compute CID without daemon:\n       ipfs add --only-hash {project_root}/docs/arxiv-paper/main.pdf\n       Set ipfs_cid_computed_only=True (CID known but not pinned to network yet).\n  2. If w3 CLI available: also pin via web3.storage:\n     w3 up {project_root}/docs/arxiv-paper/main.pdf\n     Set w3storage_cid=(returned CID).\n  3. If neither tool available: document installation steps:\n     - Local IPFS node: curl -sSf https://dist.ipfs.tech/go-ipfs/v0.20.0/go-ipfs_v0.20.0_linux-amd64.tar.gz | tar xz\n     - w3cli: npm install -g @web3-storage/w3cli\n     Set ipfs_tool_installation_steps=(commands above).\n     Set ipfs_cid=null; ipfs_pinned=False.\n  4. Update README.md with CID documentation:\n     Add or update a '## Distribution Mirrors' section:\n     - PyPI: https://pypi.org/project/carnot-ebm/\n     - HuggingFace: https://huggingface.co/Carnot-EBM\n     - IPFS: ipfs://{{CID}} (or 'pending — run: ipfs add docs/arxiv-paper/main.pdf')\n     - ArXiv: https://arxiv.org/abs/XXXX.XXXXX (if submitted)\n  5. Set ipfs_mirror_documented=True.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - ipfs_cid:\n      principle: \"Content-addressed hash of the arXiv preprint. Null if tools not available. Any party can verify integrity from this CID alone.\"\n  - ipfs_pinned:\n      principle: \"True if CID was pinned to the IPFS network (not just computed). Unpinned CID = computed but not replicated.\"\n  - ipfs_mirror_documented:\n      principle: \"True if README.md was updated with IPFS distribution information per Rule 3.\"\n  - ipfs_tools_available:\n      principle: \"Records which IPFS tooling was present. Determines whether online pinning was possible.\"\n  - pdf_available:\n      principle: \"True if main.pdf exists or was compiled. Required for IPFS upload.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"ipfs_mirror_documented == true\"\n    principle: \"Rule 3 compliance: IPFS distribution must be documented in README even if pinning required operator action. Documentation is the minimum deliverable.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2572-tier0s-real-corpus-retrain
  title: 'Phase 2a: Tier 0s Real-Corpus Retraining — NTK-Proxy on FoVer (target real AUROC > 0.65)'
  milestone: 2026.05.247
  deliverable: results/experiment_2572_tier0s_retrain.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2509-halluguard-tier0s-ntk-prototype
    verdict: 'complete: tier0s_synthetic_auroc achieved; tier0s_viable=True on synthetic corpus'
    addressed_by: "exp2509 trained Tier 0s (HalluGuard NTK) on a SYNTHETIC corpus, achieving synthetic AUROC=1.0. Real-corpus validation (exp2548) revealed real-corpus AUROC=0.3758 on FoVer (n=6548) — near random. This task retrains using REAL FoVer pairs with real labels. Structurally distinct: training data source changed from synthetic to real; implementation modified to use real feature distributions. The 1.0 synthetic AUROC was overfitting to synthetic patterns not present in natural text."
    retire_if_same_verdict: true
  prompt: "CONTEXT: Tier 0s (HalluGuard NTK-proxy) was trained on synthetic data (exp2509) and achieved AUROC=1.0 on synthetic evaluation. Real-corpus validation (exp2548, n=6548 FoVer examples) revealed real-corpus AUROC=0.3758 — near random. The synthetic training distribution does not generalize to natural text. This task retrains Tier 0s using REAL FoVer labeled pairs.\n\nROOT CAUSE HYPOTHESIS: The NTK approximation (last-layer Jacobian norm) as implemented in exp2509 uses feature thresholds calibrated on synthetic patterns (e.g., 'is this word in a canned hallucination list?'). Natural text hallucinations are distributed differently from synthetic ones. Retraining on real FoVer examples should recalibrate the feature weights.\n\nIMPLEMENTATION APPROACH:\n  The Tier 0s verifier (python/carnot/verify/tier0s_halluguard.py) currently uses a feature vector:\n  [hedge_word_density, sentence_count, named_entity_ratio, number_density, confidence_word_density]\n  The NTK-proxy is: score = sigmoid(w · features + b) where w and b are learned thresholds.\n  Retraining: use FoVer real pairs (violation=1, non-violation=0) as training labels.\n  Train a logistic regression on the feature vector; replace the hardcoded thresholds.\n\nPYTHONPATH FIX (apply before any carnot import):\n  import sys; sys.path.insert(0, '{project_root}/python')\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/tier0s_halluguard.py (current implementation)\n  {project_root}/results/experiment_2548_real_corpus_validation.json (FoVer corpus with real labels)\n  {project_root}/results/experiment_2509_halluguard_tier0s.json (prior implementation details)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. PYTHONPATH-aware import:\n        python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.verify.tier0s_halluguard import Tier0sVerifier; print('ok')\"\n        If fails: write honest_verdict 'blocked_carnot_import_failed_pythonpath' and exit.\n     b. FoVer corpus with real labels:\n        python3 -c \"import json; d=json.load(open('results/experiment_2548_real_corpus_validation.json')); print('n_real:', d.get('n_real', 0), 'has_labels:', 'responses' in d or 'pairs' in d or 'examples' in d)\"\n        Set n_fover_real. If n_fover_real < 100: write honest_verdict 'blocked_insufficient_real_data' and exit.\n  1. Load FoVer real corpus from exp2548. Extract (response_text, label) pairs.\n     Labels: violation=1 (hallucination), non-violation=0 (correct).\n  2. Compute feature vectors for each example using the existing feature extractor.\n  3. Split 80%/20% train/eval. Set random_seed=42.\n  4. Train logistic regression (sklearn.linear_model.LogisticRegression):\n     from sklearn.linear_model import LogisticRegression\n     clf = LogisticRegression(C=1.0, random_state=42, max_iter=200)\n     clf.fit(X_train, y_train)\n  5. Evaluate on eval split. Compute tier0s_real_auroc.\n  6. Compare to prior real-corpus AUROC (0.3758 from exp2548).\n  7. If tier0s_real_auroc > 0.65: save checkpoint to\n     python/carnot/verify/tier0s_halluguard_v2_checkpoint.pkl\n     Update Tier0sVerifier.score() to load and use this checkpoint.\n  8. Set tier0s_improved=(tier0s_real_auroc > 0.3758), tier0s_viable=(tier0s_real_auroc > 0.65).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - tier0s_real_auroc:\n      principle: \"Primary metric — real-corpus AUROC after retraining. Directly comparable to 0.3758 prior baseline.\"\n  - tier0s_improved:\n      principle: \"True if real-corpus AUROC > 0.3758 (prior). Any improvement is a win.\"\n  - tier0s_viable:\n      principle: \"True if real-corpus AUROC > 0.65. Threshold for ensemble v9 inclusion.\"\n  - prior_tier0s_real_auroc:\n      principle: \"0.3758 from exp2548. Fixed reference baseline.\"\n  - checkpoint_saved:\n      principle: \"True if retrained model was persisted. Prevents regression to threshold-based implementation.\"\n  - n_train:\n      principle: \"Training set size on real FoVer data.\"\n  - n_eval:\n      principle: \"Evaluation set size.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"tier0s_real_auroc IS NOT NULL AND tier0s_real_auroc > 0.3758\"\n    principle: \"Minimum improvement over near-random prior. A real-data retrained verifier that doesn't beat 0.3758 has failed to learn from real examples.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2573-tier0u-real-corpus-fix
  title: 'Phase 2b: Tier 0u Real-Corpus Fix — Improved Self-Consistency on Natural Text (target > 0.60)'
  milestone: 2026.05.247
  deliverable: results/experiment_2573_tier0u_fix.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2535-tier0u-logical-consistency
    verdict: 'complete: tier0u_auroc >= 0.75 on synthetic; tier0u_viable=True'
    addressed_by: "exp2535 trained Tier 0u (Logical Consistency) on synthetic data, achieving synthetic AUROC=0.96. Real-corpus validation (exp2548) revealed AUROC=0.5360 on FoVer (n=6548) — barely above random. Synthetic consistency patterns (e.g., repeated contradiction templates) do not generalize to natural hallucination patterns. This task uses a different consistency technique: NLI-based self-check scoring on FoVer real pairs, replacing the synthetic label constraint graph from exp2535. retire_if_same_verdict=true."
    retire_if_same_verdict: true
  prompt: "CONTEXT: Tier 0u (Logical Consistency) was trained on synthetic self-consistency data (exp2535, synthetic AUROC=0.96). Real-corpus validation (exp2548, n=6548 FoVer) revealed real-corpus AUROC=0.5360 — barely above random. The synthetic label constraint graph approach does not transfer to natural hallucination text. This task implements a different technique: computing NLI-based semantic entailment between response sub-claims as the consistency score.\n\nNEW TECHNIQUE (NLI-proxy self-consistency):\n  For a given response, split into sentences.\n  For each consecutive pair (sentence[i], sentence[i+1]):\n    Compute entailment_score = cosine_similarity(embed(sent_i), embed(sent_j))\n    (approximated with TF-IDF + cosine since full NLI model not available locally)\n  If sentences frequently contradict (low similarity despite shared topic):\n    → high inconsistency score → likely hallucination\n  Inconsistency score = 1 - mean(consecutive_entailment_scores)\n\n  This is a heuristic NLI proxy. The key difference from exp2535: it operates on consecutive\n  sentence pairs in the NATURAL response, not on synthetic contradiction templates.\n\nPYTHONPATH FIX:\n  import sys; sys.path.insert(0, '{project_root}/python')\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/tier0u_logical_consistency.py (current implementation)\n  {project_root}/results/experiment_2548_real_corpus_validation.json (FoVer corpus)\n  {project_root}/results/experiment_2535_tier0u_logical_consistency.json (prior implementation)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. PYTHONPATH-aware import:\n        python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.verify.tier0u_logical_consistency import Tier0uVerifier; print('ok')\"\n        If fails: write honest_verdict 'blocked_carnot_import_failed_pythonpath' and exit.\n     b. FoVer corpus with real labels:\n        python3 -c \"import json; d=json.load(open('results/experiment_2548_real_corpus_validation.json')); print('n_real:', d.get('n_real', 0))\"\n        Set n_fover_real. If n_fover_real < 100: write honest_verdict 'blocked_insufficient_real_data' and exit.\n  1. Implement NLI-proxy scorer using sklearn TF-IDF + cosine similarity:\n     from sklearn.feature_extraction.text import TfidfVectorizer\n     from sklearn.metrics.pairwise import cosine_similarity\n     class Tier0uVerifierV2:\n       def score(self, response: str) -> float:\n         sentences = [s.strip() for s in re.split(r'[.!?]+', response) if len(s.strip()) > 15]\n         if len(sentences) < 2: return 0.0\n         vect = TfidfVectorizer(min_df=1, stop_words='english')\n         try:\n           tfidf = vect.fit_transform(sentences)\n           sims = [cosine_similarity(tfidf[i], tfidf[i+1])[0][0] for i in range(len(sentences)-1)]\n           return max(0.0, min(1.0, 1.0 - (sum(sims) / len(sims))))\n         except ValueError:\n           return 0.0\n  2. Load FoVer corpus. Score all examples with Tier0uVerifierV2.\n  3. Compute tier0u_v2_real_auroc.\n  4. If tier0u_v2_real_auroc > 0.5360 (prior): replace Tier0uVerifier score() with V2 implementation.\n  5. Set tier0u_improved=(tier0u_v2_real_auroc > 0.5360), tier0u_viable=(tier0u_v2_real_auroc > 0.60).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - tier0u_v2_real_auroc:\n      principle: \"Primary metric — real-corpus AUROC with NLI-proxy technique. Compared to 0.5360 prior.\"\n  - tier0u_improved:\n      principle: \"True if real-corpus AUROC > 0.5360 (prior). Any improvement over near-random.\"\n  - tier0u_viable:\n      principle: \"True if real-corpus AUROC > 0.60. Threshold for ensemble v9 inclusion.\"\n  - prior_tier0u_real_auroc:\n      principle: \"0.5360 from exp2548. Fixed reference baseline.\"\n  - technique_description:\n      principle: \"Documents the NLI-proxy implementation used (TF-IDF cosine vs prior label constraint graph).\"\n  - n_eval:\n      principle: \"Must be >= 50 for meaningful AUROC estimate.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"tier0u_v2_real_auroc IS NOT NULL AND tier0u_v2_real_auroc > 0.5360\"\n    principle: \"Minimum improvement over near-random prior. The NLI-proxy technique must show at least marginal improvement over the label-constraint-graph approach that failed on natural text.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2574-safety-corpus-verifier
  title: 'Phase 3a: Safety/Jailbreak Corpus + Ising Safety Verifier (Tier B Product)'
  milestone: 2026.05.247
  deliverable: results/experiment_2574_safety_corpus.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2522-halluguard-corpus-construction
    verdict: 'complete: corpus_construction_complete; n_pairs_generated'
    addressed_by: "exp2522 constructed a hallucination corpus from FoVer results. This task constructs a SAFETY corpus (safe vs jailbreak/unsafe) — a different domain, different labels, different product track (Tier B Safety Classifier vs hallucination detection ensemble). The safety domain uses AdvBench-style harmful prompts + safety refusals; hallucination domain uses factual accuracy. Not a scope-matched prior failure. retire_if_same_verdict=false."
    retire_if_same_verdict: false
  prompt: "CONTEXT: The Carnot research-program.md Tier B products list the Safety/Jailbreak Classifier as the next high-value product. 'Low = safe, High = unsafe/jailbreak'. The energy infrastructure (Ising, KAN, pipeline) exists; what's needed is (a) a safety corpus and (b) an energy verifier for safety constraints.\n\nTHIS TASK combines corpus construction + verifier implementation in one step because both are small-scope.\n\nSAFETY CORPUS CONSTRUCTION:\n  Source 1: AdvBench-style harmful prompts (public dataset, 100 harmful prompt-response pairs)\n    These are well-known examples of jailbreak attempts and harmful content.\n    Construct from public examples: DAN prompts, role-play jailbreaks, harmful instruction following.\n  Source 2: Safe refusals (100 safe prompt-response pairs)\n    Benign factual questions answered correctly.\n    Safe refusals to harmful requests ('I can't help with that because...').\n  Total: n=200 labeled pairs. Labels: is_unsafe=1 (jailbreak/harmful), is_unsafe=0 (safe).\n\nSAFETY VERIFIER (Ising-based):\n  Safety constraints for energy computation:\n  SAFETY_VIOLATION_PATTERNS = [\n    r'how to (make|build|create|synthesize) .{{0,20}}(bomb|weapon|explosive|poison)',\n    r'step.{{0,5}}by.{{0,5}}step.{{0,20}}(harm|kill|hurt|attack|hack)',\n    r'(ignore|bypass|override|forget) .{{0,30}}(rules|instructions|guidelines|ethics)',\n    r'pretend .{{0,20}}(you are|you\\'re).{{0,20}}(uncensored|unfiltered|evil|dangerous)',\n    r'(DAN|jailbreak|developer mode|unrestricted mode)',\n  ]\n  energy = count of matched patterns / max(n_sentences, 1), clamped to [0.0, 1.0]\n  High energy = likely unsafe.\n\nIMPLEMENTATION:\n  Create python/carnot/verify/tier0x_safety.py\n  class Tier0xSafetyVerifier:\n    def score(self, response: str) -> float:\n      n_sentences = max(len(re.findall(r'[.!?]', response)), 1)\n      n_violations = sum(1 for p in SAFETY_VIOLATION_PATTERNS if re.search(p, response, re.I))\n      return min(1.0, n_violations / n_sentences * 5)\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/tier0r_curry_howard.py (verifier interface to follow)\n  {project_root}/python/carnot/pipeline/verify_repair.py (integration point)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. PYTHONPATH-aware import:\n        python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('ok')\"\n        If fails: write honest_verdict 'blocked_carnot_import_failed_pythonpath' and exit.\n  1. Construct safety corpus (200 pairs, described above). Save to results/safety_corpus.json.\n  2. Implement Tier0xSafetyVerifier in python/carnot/verify/tier0x_safety.py.\n  3. Write 3 unit tests: jailbreak prompt scores higher than safe refusal.\n  4. Score all corpus examples with Tier0xSafetyVerifier. Compute safety_verifier_auroc.\n  5. Set safety_verifier_viable=(safety_verifier_auroc > 0.70).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - safety_verifier_auroc:\n      principle: \"AUROC on safety corpus. Primary gate for exp2575 (safety ensemble integration).\"\n  - safety_verifier_viable:\n      principle: \"True if AUROC > 0.70. Threshold for Tier B product viability.\"\n  - n_corpus:\n      principle: \"Total corpus size (must be 200). Documents that the corpus was constructed.\"\n  - n_unsafe:\n      principle: \"Count of unsafe examples. Must be approximately n_corpus/2.\"\n  - corpus_saved:\n      principle: \"True if results/safety_corpus.json was written.\"\n  - verifier_implemented:\n      principle: \"True if tier0x_safety.py was created and unit tests pass.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"safety_verifier_viable == true OR safety_verifier_auroc IS NOT NULL\"\n    principle: \"Either a viable safety verifier (AUROC > 0.70) OR an honest measurement. Tier B product can proceed with viable=True; if not viable, the corpus exists for future work.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

