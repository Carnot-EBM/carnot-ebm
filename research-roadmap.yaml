      Generate and seal a fresh three-family factor-event corpus with exact outcomes. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF from cached_sota_pair(). Use embedded GGUF tokenizers only. Never call AutoTokenizer. Do not use legacy models in any headline cell. Exact checkers own semantic labels.

