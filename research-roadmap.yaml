  priority: medium
  track: hardware
  deliverable: results/experiment_5188_hardware_continuity_gatemate_diagnostic_v475.json
  operator_override: '2026-05-18 operator directive (standing, Hardware-Task Continuity Discipline):
    every milestone reserves >=1 task per attached board not yet at terminal state; this is that
    reserved slot, routine by construction, never a doomed rerun.'
  agent_type: claude
  model: opus
  requires_claude_verified: true
  max_turns: 100
  estimated_wall_time_min: 50
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. Three boards are attached: KV260 (near-terminal per
    `ops/north-star.md` §3 -- reachable every continuity check, light-touch mandate only), PolarFire
    (reachable, workload-validated terminal state not yet explicitly confirmed), and GateMate (NOT
    terminal -- `.474`'s exp5179 reports `blocked_gatemate_dirtyjtag_idcode_unresolved_after_diagnostics`:
    DirtyJTAG enumerates the USB programmer but cannot read the GM1Ax IDCODE `0x20000001` that worked
    cleanly in May 2026, and this has now recurred across at least two consecutive milestones,
    `.471`/`.473`/`.474`). This is a HARD requires_claude_verified task (hardware integration / dual-board
    debugging, matching the pre-emptive Opus-routing criteria) because the GateMate regression needs
    genuine root-cause diagnosis, not another `--detect` re-run.

    EXISTING CODE TO READ FIRST:
    - results/experiment_5179_hardware_continuity_board_timing_v474.json and
      results/experiment_5166_hardware_continuity_v473.json (the exact diagnostic steps already tried for
      GateMate -- do not repeat them verbatim).
    - research-hardware-wishlist.md (the GateMate section: the May 2026 working baseline, toolchain
      confirmation history).
    - ops/hardware-bringup-prep.md (KV260 terminal-state record, PolarFire status).
    - CLAUDE.md "KV260 SSH-Not-SD-Card Discipline" (KV260 precondition MUST be SSH-reachability via the
      board's network alias; a host-side removable-storage-device check is the permanently retired
      wrong-mechanism precondition per that rule -- do not use one).

    CONCRETE STEPS:
    0. PRECONDITIONS (check BEFORE any subsequent step, per board):
       a. KV260: `ssh -o ConnectTimeout=5 -o BatchMode=yes kria 'true'` — SSH-reachability ONLY, never a
          host SD-card check.
       b. PolarFire: `ssh -o ConnectTimeout=5 -o BatchMode=yes polarfire 'true'`.
       c. GateMate: `openFPGALoader -c dirtyJtag --detect` (the standard check) AND additionally
          `lsusb -v -d 1209:c0ca` (or the board's actual VID:PID) for full USB descriptor detail.
    1. KV260 (light-touch, terminal board): run the standard SSH-reachable workload smoke (hash-verified,
       `inference_substrate: hardware_smoke`). No new investigation needed -- this board is near-terminal
       per the north-star; keep this step brief.
    2. PolarFire: run the SSH-reachable workload smoke. If a hash-verified dispatch run has not yet been
       explicitly confirmed as meeting `polarfire_workload_validated: true` (the terminal-state bar), check
       whether this run closes that bar and report explicitly either way.
    3. GateMate ACTUAL DIAGNOSTIC (go beyond `--detect`, per the operator's own recommendation in prior
       milestones): try, in order, and record each outcome:
       a. `openFPGALoader --scan-usb` (full USB bus scan, not just the DirtyJTAG-specific `--detect`) to
          confirm the device is enumerating at all at the USB level.
       b. `dmesg | tail -50` immediately after a physical USB replug, to check for kernel-level
          enumeration errors (e.g. a failing/degrading USB controller, power delivery issue, or driver
          claim conflict) that would explain an IDCODE readback failure despite programmer enumeration.
       c. Check udev rules / device permissions (`ls -la /dev/bus/usb/*/` for the DirtyJTAG device,
          confirm the running user has access) -- a permissions regression could produce exactly this
          "programmer visible, IDCODE unreadable" signature.
       d. If `openFPGALoader` supports a `--freq` flag, try a slower JTAG clock rate (a marginal/degraded
          connection can fail IDCODE readback at the default clock but succeed slower).
       e. Physically power-cycle the board (document this as a manual step if it requires operator action
          -- this task can recommend it even if it cannot execute it) and re-attempt `--detect`.
       f. Compare the exact `openFPGALoader` / DirtyJTAG firmware version against the May 2026 working
          baseline recorded in `research-hardware-wishlist.md` -- a toolchain or firmware update between
          then and now is a plausible regression cause.
    4. Write a precise diagnostic report even if the IDCODE issue remains unresolved -- narrowing the
       failure mode (USB-level vs JTAG-protocol-level vs permissions vs clock-rate vs firmware-version) is
       itself valuable progress even without a fix, and tells a future attempt (or the operator, for a
       physical inspection) exactly where to look next.

    REQUIRED ARTIFACT FIELDS:
