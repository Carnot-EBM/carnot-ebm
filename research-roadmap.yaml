  prompt: |
    CONTEXT:
    research-program.md MANDATE: every milestone must include at least one continuous
    self-learning experiment (Tiers 1-4). This experiment is Tier 3 (JEPA-Style Predictive
    Verification): retrain the step-level process reward model (ThinkPRM) on the expanded
