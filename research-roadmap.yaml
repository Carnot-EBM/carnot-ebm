- id: exp1036-nk-kaem-v2
  milestone: 2026.04.80
  deliverable: results/experiment_1036_nk_kaem_v2.json
  title: "NK-KAEMEnergy + Multilevel KAN Training v2 — Warm-Start + LR Decay Fix"
  prompt: |
    CONTEXT:
    Newton-Kaczmarz optimizer (arXiv 2512.18921) combined with multilevel spline grid training
    (arXiv 2603.04827) is expected to give 3-10x convergence speedup for KAEMEnergy training.
    Exp 936 (.76, partial: optimizer unstable — NK diverged on cold initialization, deep layers
    destabilized). Exp 1021 (.79, DOOMED_RERUN_BLOCK — missing prior_failures for Exp 936 scope).

    Key fixes from Exp 936's instability:
    - Warm-start from Adam-converged weights before NK optimization
    - Per-layer LR decay: lr_layer = base_lr / (1 + layer_depth)
    - Gradient clipping: ||∇|| <= 1.0 per NK step
    - Multilevel grid schedule: G=4 → G=8 → G=16 (from arXiv 2603.04827)

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/kaem_energy.py (KAEMEnergy — NK optimizer would be added here)
    - research-references.md: NK optimizer section (arXiv 2512.18921) and Multilevel KAN (arXiv 2603.04827)
    - results/experiment_936_*.json (Exp 936 partial result — understand what "unstable" meant)
    - python/carnot/data/fover_corpus.py (57-pair corpus as baseline test data)
    - results/experiment_1029_fover_expansion_v2.json (if available, use expanded corpus)

    TASK:
    1. LOAD BASELINE: Run standard Adam single-level (G=8) KAEMEnergy training on FoVer corpus.
       Record: training_wall_time_s, final AUROC, epochs-to-convergence. This is the baseline.
    2. IMPLEMENT NK-KAEM:
       - Step 1: Train with Adam for 20 epochs at G=4 (warm-start). Save weights.
       - Step 2: Switch to Newton-Kaczmarz optimizer (K=10 rows per step per arXiv 2512.18921).
         NK step: w_new = w - (J^T J + λI)^(-1) J^T r where J is Jacobian, r is residual.
         Implement per-layer LR decay: lr_layer_i = base_lr / (1 + i).
         Implement gradient clipping: torch.nn.utils.clip_grad_norm_(params, 1.0).
       - Step 3: Multilevel promotion: once loss delta < 1e-4 at G=4, promote to G=8.
         Re-initialize knots (interpolate from G=4 grid). Continue NK at G=8.
       - Step 4: Promote to G=16 when G=8 converges.
    3. COMPARE: NK-multilevel wall time vs Adam single-level wall time.
       Target: convergence_speedup = adam_wall_time / nk_wall_time >= 2.0.
       Record: final AUROC for NK-multilevel. Must not regress by more than 0.02 vs Adam.
    4. FALLBACK: If NK diverges again (loss NaN or AUROC drops to < 0.4), try reducing NK
       step size (λ = 1.0 instead of 0.1). Report NK_lambda_used in artifact.

    ARTIFACT FIELDS:
    - adam_wall_time_s: float
    - nk_wall_time_s: float
    - convergence_speedup: float
    - auroc_adam: float
    - auroc_nk_multilevel: float
    - auroc_no_regression: bool (auroc_nk_multilevel >= auroc_adam - 0.02)
    - nk_lambda_used: float
    - grid_levels_used: list[int] (e.g. [4, 8, 16])
    - honest_verdict: "nk_speedup_confirmed" | "nk_partial_speedup_below_2x" | "nk_diverged_fallback_used" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1036_nk_kaem_v2.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

