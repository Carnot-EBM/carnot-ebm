    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; ops/exclusion_manifest.yaml; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/v726_contract_methods.py; python/carnot/reporting/v685_authority_lifecycle.py; results/experiment_8442_v726_capstone.json; openspec/change-proposals/v726-methods-protocol.json
