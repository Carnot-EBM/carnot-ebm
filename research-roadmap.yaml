- id: exp477-jepa-quality-gated-retrain
  milestone: 2026.04.36
  deliverable: results/experiment_477_jepa_quality_gated_retrain.json
  title: 'Exp 477: JEPA Quality-Gated Retrain — RETRO-040 fix, target AUC > 0.700'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-040 opened\
    \ in milestone .35: JEPA AUC regressed from 0.667 to 0.400 in Exp 472. Root cause:\
    \ the scale experiment trained on 54 real CoT pairs without quality validation.\
    \ Some of those pairs had labeling ambiguity (partially-verifiable steps annotated\
    \ as 'incorrect'). The fix is two-part: (1) quality-gate real CoT pairs before\
    \ training — require arithmetic_coverage >= 0.3 AND label_confidence >= 0.7; (2)\
    \ augment with EBM-generated synthetic pairs that sample from the learned violation\
    \ distribution (not random synthetic) to reach n_total >= 200 pairs. The EBM's\
    \ own energy landscape provides a principled source of synthetic violations. This\
    \ is a Tier 3 self-learning experiment (FR-11 JEPA). CPU-only.\n\nEXISTING CODE\
    \ TO READ FIRST:\n- python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/models/eorm.py — EORM\n- python/carnot/pipeline/deliverable_guard.py\
    \ — DeliverableGuard (Exp 462)\n- python/carnot/pipeline/fover_annotator.py — FOVERAnnotator,\
    \ FOVERCoTStep\n- results/experiment_443_eorm_jepa_retrain.json — 57 real CoT pairs\n\
    - results/experiment_442_fover_live_annotation.json — 57 real labeled pairs\n-\
    \ results/fover_labeled_steps_live.json — live labeled steps\n- results/exp476_cot_pairs.json\
    \ — 200 CoT pairs from Exp 476 (if present)\n- results/experiment_472_jepa_gpu_oim.json\
    \ — prior JEPA retrain (AUC regression)\n- ops/known-issues.md — RETRO-040\n\n\
    TASK: Implement CoTPairQualityFilter, retrain JEPA on quality-gated corpus, target\
    \ AUC > 0.700.\n1. Read CLAUDE.md spec-first workflow.\n2. Call apply_env_autofix()\
    \ FIRST.\n3. Add REQ-LEARN-037 (CoTPairQualityFilter rejects pairs with arithmetic_coverage\
    \ < 0.3 or label_confidence < 0.7), REQ-LEARN-038 (JEPAQualityAugmentor generates\
    \ EBM-guided synthetic pairs by sampling from Ising violation distribution, not\
    \ random), REQ-LEARN-039 (JEPA retrained on quality-gated corpus targets AUC >\
    \ 0.700 on held-out set), SCENARIO-LEARN-065/066/067 to openspec/capabilities/autoresearch/spec.md.\n\
    4. Write tests FIRST (100% coverage) for:\n   - CoTPairQuality(arithmetic_coverage:\
    \ float, label_confidence: float, n_steps: int):\n     - passes_gate: bool (arithmetic_coverage\
    \ >= 0.3 AND label_confidence >= 0.7)\n     - quality_score: float (harmonic mean\
    \ of coverage and confidence)\n   - CoTPairQualityFilter(min_coverage: float =\
    \ 0.3, min_confidence: float = 0.7):\n     - filter(pairs: list[dict]) -> list[dict]:\
    \ returns only pairs passing the gate\n     - compute_quality(pair: dict) -> CoTPairQuality\n\
    \   - JEPAQualityAugmentor(ising_model, n_samples: int = 50):\n     - generate_violation_pairs()\
    \ -> list[dict]: samples spin configs from Ising, labels high-energy as incorrect\n\
    \     - generate_correct_pairs() -> list[dict]: samples low-energy configs, labels\
    \ as correct\n   - JEPARetrainV2Result(n_pairs_raw, n_pairs_filtered, n_synthetic,\
    \ before_auc, after_auc):\n     - auc_improvement: float\n     - target_met: bool\
    \ (after_auc > 0.700)\n     - regression_recovered: bool (after_auc > 0.571)\n\
    \   - Test: CoTPairQualityFilter rejects pairs with coverage < 0.3\n   - Test:\
    \ JEPAQualityAugmentor.generate_violation_pairs() returns list with correct: False\n\
    \   - Test: JEPARetrainV2Result.regression_recovered=True when after_auc > 0.571\n\
    5. Implement python/carnot/models/jepa_retrain_v2.py (CoTPairQualityFilter, JEPAQualityAugmentor,\
    \ JEPARetrainV2Result).\n   Export from carnot.models.__init__.\n   Verbose docstrings:\
    \ WHY quality gate (Exp 472 AUC regression from 0.667 to 0.400 traced to low-quality\
    \ real pairs in training set — partially-verifiable steps labeled with low confidence),\
    \ WHY EBM-guided synthetic (random synthetic pairs sample uniformly from constraint\
    \ space; EBM-guided samples from the violation distribution actually seen in the\
    \ pipeline, making synthetic pairs more representative of the failure modes JEPA\
    \ must predict), reference RETRO-040 and data quality gate principle.\n6. Write\
    \ scripts/experiment_477_jepa_quality_gated_retrain.py:\n   a. apply_env_autofix()\
    \ FIRST\n   b. ExperimentTimeoutWatchdog(477, timeout_minutes=60) as context manager\n\
    \   c. ExperimentTemplate(477, 'JEPA Quality-Gated Retrain',\n      'results/experiment_477_jepa_quality_gated_retrain.json')\n\
    \   d. DeliverableGuard('results/experiment_477_jepa_quality_gated_retrain.json')\n\
    \   e. Load ALL available real CoT pairs:\n      - results/fover_labeled_steps_live.json\
    \ (Exp 442: 57 pairs)\n      - results/exp476_cot_pairs.json (Exp 476: up to 200\
    \ pairs if present)\n      - results/exp478_cot_pairs.json (Exp 478: up to 200\
    \ pairs if present)\n   f. CoTPairQualityFilter(min_coverage=0.3, min_confidence=0.7).filter(all_pairs)\n\
    \   g. JEPAQualityAugmentor: generate synthetic pairs to reach n_total = max(200,\
    \ n_filtered * 3)\n   h. Compute before_auc on current JEPA model (held-out 20%\
    \ of filtered pairs)\n   i. Retrain JEPA on 80% filtered + synthetic, 300 epochs,\
    \ learning_rate=0.001\n   j. Compute after_auc on held-out 20%\n   k. Save retrained\
    \ JEPA to results/jepa_model_477_quality_gated.safetensors\n   l. Build artifact:\
    \ schema='carnot.jepa_retrain.v2'\n      n_real_pairs_raw=<int>\n      n_pairs_filtered=<int>\
    \ (after quality gate)\n      n_synthetic_pairs=<int>\n      n_total_training=<int>\n\
    \      filter_rate=n_filtered / n_real_raw\n      before_auc=<float> (regression\
    \ baseline, should be ~0.400)\n      after_auc=<float>\n      auc_improvement=after_auc\
    \ - before_auc\n      target_met=after_auc > 0.700\n      regression_recovered=after_auc\
    \ > 0.571\n      retro_040_closed=after_auc > 0.600\n      honest_verdict='retro_040_closed'\
    \ if retro_040_closed else 'improvement_below_target'\n   m. Call tmpl.assert_deliverable_written()\
    \ as FINAL LINE\n   n. Output: results/experiment_477_jepa_quality_gated_retrain.json\n\
    7. Write tests/python/test_jepa_retrain_v2.py (100% coverage).\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: update _bmad/traceability.md\
    \ (FR-11 JEPA AUC), ops/conductor-log.md (RETRO-040 status), ops/status.md, ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"

- id: exp478-live-200q-vericot-vprm-v2
