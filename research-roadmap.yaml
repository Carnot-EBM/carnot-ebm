          - "preflight_v9_clean_manifest_enforced" if gpu_clean AND exp527_retired AND
            dualgpu_speedup >= 1.5 AND manifest_enforcement_applied=True
          - "preflight_v9_clean_manifest_pending" if gpu_clean AND exp527_retired AND
