        artifact_field: positive_control_passed
        op: "=="
        value: true
    title: "EBT System-2 diagnostic (gated on exp3871 positive_control_passed): on the SAME confirmed-headroom checkpoint, does held-out generation accuracy improve MONOTONICALLY as the energy-descent budget K grows (1,2,4,8,16 steps)? Tests the core EBT 'thinking = optimization' claim — monotone gain => thinking helps; flat/degrading => the landscape gives no usable descent signal at this scale."
    priority: high
    track: research
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    requires_gpu: true
    estimated_wall_time_min: 60
    inference_substrate: live_llm_inference
    deliverable: results/experiment_3872_ebt_energy_descent_system2_diagnostic.json
    prompt: |
      CONTEXT. EBT's headline claim (arXiv:2507.02092) is that "thinking" emerges as
      energy-descent optimization at inference: more descent steps K => better
      prediction. exp3871 adjudicates greedy-vs-beam on a confirmed-headroom
      checkpoint; THIS task isolates the K-scaling sub-claim on the SAME checkpoint.
      A monotone accuracy(K) curve is direct evidence energy-descent thinking helps;
      a flat/degrading curve bounds the System-2 story at our scale.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3871_thesis_a_partb_dtp1_headroom_confirmed.json (the checkpoint + decode path)
        - scripts/thesis_a_part_b_scaled.py (the EBT model + K-step Langevin energy-descent loop)
        - docs/research-notes/phase3-thesis-a-part-b-design.md (K = the System-2 budget)

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE anything; blocked_<resource>+EXIT on fail):
           a. `{project_root}/.venv/bin/python -c "import torch; assert torch.cuda.is_available()"` (blocked_no_cuda).
           b. exp3871 artifact exists AND positive_control_passed==true AND its checkpoint loads
              (blocked_upstream_no_headroom otherwise).
        1. Load the exp3871 confirmed-headroom checkpoint.
        2. For K in [1,2,4,8,16]: decode held-out with EBT energy-descent at that K (best decoder
