      - {project_root}/results/experiment_6121_gatemate_changed_state_gate_v530.json
      - {project_root}/results/experiment_6199_gatemate_terminal_action_audit_v537.json
      - {project_root}/results/experiment_6325_gatemate_dated_receipt_single_detect.json
      - {project_root}/results/experiment_3866_gatemate_ising_tile_flash_v2.json and exclusion manifest
      - GateMate specs, tests, safe command allowlist, ops known issues, and E2E plan

      TASK
      Close V564 GateMate continuity without repeating an unchanged hardware action. Search for a dated physical-state receipt newer than Exp6325. Run no hardware command when it is absent. If it exists and identifies a concrete cable, port, power, board, or DirtyJTAG change, permit exactly one bounded detect or flash step and stop at its first terminal result.

      CONCRETE STEPS
      0. Record git status, historical artifact paths and hashes, exclusion state, current time, protected-file hashes, and the exact receipt search locations. Do not infer physical change from USB enumeration alone.
      1. Add or confirm REQ-* and SCENARIO anchors for dated receipt ordering, no-command unchanged state, single-action budget, safe target validation, terminal stop, and no-performance claims. Write focused tests first.
      2. Search operator-authored known issues and approved receipt locations for a record later than Exp6325 that names the physical change. Reject planner-created, undated, stale, or USB-only evidence.
      3. If no valid receipt exists, run zero lsusb, openFPGALoader, yosys, nextpnr, gmpack, JTAG, flash, or reset commands. Emit blocked_missing_new_physical_receipt with the last known state and required operator action.
      4. If a valid receipt exists, resolve the exact board and bitstream paths safely. Run only the single predeclared bounded action. Stop on success, failure, timeout, or ambiguous target. Do not retry.
      5. Preserve Exp3866 exclusion and all historical verdicts. Do not claim flash, smoke, latency, energy, speedup, availability, or terminal state without same-run authenticated evidence.
      6. Emit one row per receipt candidate and, if authorized, one command row with argv, start/end, exit code, stdout/stderr hashes, device identity, and terminal disposition.
      7. Set gatemate_continuity_slot_complete_score=1.0 for an honest closed no-command or one-action record. Set gatemate_bitstream_flashed=true only on authenticated same-run flash evidence.
      8. Run focused tests, hardware safety and provenance lints, spec coverage, row lint, adversarial verification, applicable hardware E2E checks only when authorized, and git status.

