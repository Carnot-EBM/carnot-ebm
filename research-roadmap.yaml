        ebt_total_flops:
          principle: "EBT total inference FLOPs (params x tokens x descent passes) -- the matched-compute denominator."
        ar_total_flops:
          principle: "AR best-of-M total inference FLOPs -- must ~= ebt_total_flops for the comparison to be fair."
        flops_matched_within_tolerance:
          principle: "BARE bool. The load-bearing anti-P0.1-trap check -- a win is meaningless if AR got fewer FLOPs."
        n_heldout:
          principle: "Sample size for the accuracy delta; n>=100 for a CLT-valid claim (CLAUDE.md sample-size rigor)."
        ar_best_of_m:
          principle: "The M chosen to FLOP-match AR to the EBT -- documents how equal compute was achieved."
