    deliverable: "results/experiment_3356_fr11_cx_repair.json"
    prompt: |
      CONTEXT: Inspired by TraceFix (arXiv:2605.07935), FR-11 should repair coordination protocols/constraints using exact Z3/SMT counterexamples.
      EXISTING CODE TO READ FIRST:
        - `python/carnot/pipeline/constraint_template_library.py`
      TASK: Synthesize a repair loop for FR-11 that uses Z3 unsat cores to refine its constraint templates.
      CONCRETE STEPS:
