        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Paper arXiv:2602.23681 (ODAR) uses variational free energy (KL divergence between fast and slow
      agent distributions) as a routing criterion: verify only when KL is high, skip verification
      (fast path) when KL is low. This directly implements Phase 4 active inference for Carnot:
      the verifier IS the free-energy signal that determines whether deliberative verification is needed.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (current VerifyRepairPipeline — read verify() method)
      - python/carnot/verify/ (ensemble energy score interface)

      TASK: Add ODAR-style free-energy routing gate to VerifyRepairPipeline.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Read python/carnot/pipeline/verify_repair.py. Confirm verify() method exists.
            If absent: write honest_verdict 'blocked_verify_repair_pipeline_missing' and exit.
         b. `.venv/bin/python -c "import sys; sys.path.insert(0, 'python'); import carnot.pipeline"` — package importable.
            Record: preconditions_checked.

      1. Understand current verify() flow: what inputs does it take, what does it return?

      2. Add method compute_routing_free_energy(fast_score: float, slow_score: float) -> float:
         - Returns KL-proxy = abs(fast_score - slow_score) / (abs(fast_score) + abs(slow_score) + 1e-9)
         - This is a simplified free-energy proxy: 0 = fast and slow agree, 1 = maximal divergence
         Record: method_added (bool).

      3. Add method should_verify(text: str, routing_threshold: float = 0.3) -> tuple[bool, float]:
         - Computes a "fast" score (simple logprob or TF-IDF self-consistency proxy)
         - Computes routing_free_energy
         - Returns (verify=True, fe_score) if fe_score > routing_threshold, else (False, fe_score)
         Record: method_added (bool).

      4. Measure routing behavior on 20 synthetic examples:
         - 10 "likely correct" examples (low self-inconsistency proxy)
         - 10 "likely incorrect" examples (high self-inconsistency proxy)
         - Count: n_fast_path (should_verify=False), n_slow_path (should_verify=True)
         - Expected: fast path more common for "correct" examples
         Record: n_fast_path, n_slow_path, routing_overhead_reduction_pct (= n_fast_path / 20 * 100).

      5. Record odar_viable = True if routing_overhead_reduction_pct >= 20 (i.e., >= 4 of 20 examples
         routed to fast path — any non-zero benefit).

      6. Write results/experiment_2668_odar_free_energy_routing.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - odar_viable: bool
        principle: "Primary outcome: routing gate implemented and shows measurable fast-path savings."
