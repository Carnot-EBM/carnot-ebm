  - id: exp2240-fst-impl
    title: "Phase 1: Fast-Slow Training Decomposition for Verify-Repair Loop"
    milestone: "2026.05.222"
    deliverable: "results/experiment_2240_fst_impl.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    prior_failures:
      - experiment_id: exp57-verify-repair-loop
        verdict: complete
        addressed_by: "Different scope: exp57 built the verify-repair loop itself. This task adds Fast-Slow Training (arXiv:2605.12484) slow-fast weight decomposition ON TOP of the existing loop. New technique not previously attempted."
    prompt: |
      CONTEXT: The .96-.150+ FR-11 stalls are explained by arXiv:2605.12484 (Fast-Slow Training, FST):
      parameter-only RL is strictly dominated by dual slow-fast decomposition. FST achieves 3x sample
      efficiency and 70% less KL drift. Carnot's mapping: slow weights = frozen k=16 verifier ensemble +
      base LLM; fast weights = verifier-output-summary prepended to the next repair prompt (ICL update).
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/python/carnot/training/
      TASK: Implement FST slow-fast decomposition for Carnot's verify-repair iteration.
      CONCRETE STEPS:
        1. Create python/carnot/training/fast_slow.py implementing:
           - SlowWeights: wrapper marking verifier ensemble + base LLM as frozen
           - FastWeights: VerifierOutputSummary builder that formats verifier feedback
             into a context prefix prepended to the next repair prompt
           - FastSlowTrainer: orchestrator managing slow/fast update cycle
        2. Integrate FastSlowTrainer as an optional mode in VerifyRepairPipeline.verify()
           (gated by use_fst=False default).
        3. Write unit tests covering: fast-weight update step, slow-weight freeze assertion,
           context prefix injection into next-prompt call.
        4. Set fst_impl_ready: true in deliverable if all unit tests pass.
        5. Write deliverable to results/experiment_2240_fst_impl.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required."
        fst_impl_ready:
          principle: "Boolean gate for exp2241. True only when all unit tests pass and module imports cleanly."
        fst_module_path:
          principle: "Records exact file path created so downstream tasks can import it."
        slow_weights_frozen:
          principle: "Verifies the implementation actually freezes slow-weight gradients."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2241-fr11-fst-eval
    title: "Phase 1: FR-11 Fast-Slow Training Retention Validation"
    milestone: "2026.05.222"
    deliverable: "results/experiment_2241_fr11_fst_eval.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 50
    gated_on:
      - upstream: exp2240-fst-impl
        artifact_field: fst_impl_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp384-fr11-relay-live-execute
        verdict: partial
        addressed_by: "Prior FR-11 attempts used parameter-only RL, which arXiv:2605.12484 proves is strictly dominated. This experiment adopts FST's slow-fast decomposition — a fundamentally different mechanism."
    prompt: |
      CONTEXT: Milestone FR-11 continuous self-learning task. Validate that FST (exp2240) achieves
      sample efficiency >= 2x baseline and KL drift <= 0.5x vs parameter-only RL, as claimed
      by arXiv:2605.12484. This is the primary FR-11 rescue experiment for .222.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/scripts/experiment_template.py
      TASK: Execute an FR-11 continuous self-learning episode using FST.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. Import python/carnot/training/fast_slow.py succeeds — if not, write
              honest_verdict blocked_fst_module_missing and exit.
        1. Create a 30-example FoVer-class corpus using existing fixtures or synthetic
           arithmetic CoT pairs (do not call external LLM APIs).
        2. Run two learning regimes:
           Regime A (baseline): parameter-only RL on verifier weights, 5 iterations.
           Regime B (FST): slow weights frozen, fast weights (verifier-output-summary)
           updated each iteration, 5 iterations.
        3. Measure:
           - sample_efficiency_ratio: iterations_A_to_threshold / iterations_B_to_threshold
           - kl_drift_ratio: KL(regime_B_final || base) / KL(regime_A_final || base)
           - utility_delta: energy_reduction_regime_B - energy_reduction_regime_A
        4. Set fr11_fst_eval_passed: true if sample_efficiency_ratio >= 2.0 AND kl_drift_ratio <= 0.5.
        5. Write deliverable to results/experiment_2241_fr11_fst_eval.json with
           continuous_self_learning_task: true.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required. Use complete: if both acceptance gates pass."
        continuous_self_learning_task:
          principle: "Must be true — FR-11 mandate requires at least one CSL task per milestone."
        fr11_fst_eval_passed:
          principle: "Boolean gate for exp2242. True only when sample_efficiency_ratio >= 2.0 AND kl_drift_ratio <= 0.5."
        sample_efficiency_ratio:
          principle: "Primary FST gate: >= 2.0 validates the 3x claim from arXiv:2605.12484."
        kl_drift_ratio:
          principle: "Secondary FST gate: <= 0.5 validates 70% KL reduction claim."
        utility_delta:
          principle: "Measures raw FR-11 benefit — energy reduction delta between regimes."
        n_corpus:
          principle: "Records corpus size so statistical significance is auditable."
        preconditions_checked:
          principle: "Lists which resources were verified before running; pre-empts fabrication."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2242-actfocus-fst-integration
    title: "Phase 1: ActFocus + FST Unified Gradient Evaluation on SOTA GGUFs"
    milestone: "2026.05.222"
    deliverable: "results/experiment_2242_actfocus_fst.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 50
    gated_on:
      - upstream: exp2241-fr11-fst-eval
        artifact_field: fr11_fst_eval_passed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2229-actfocus-reweighting-impl
        verdict: complete
        addressed_by: "exp2229 implemented ActFocus in isolation (.221). This experiment integrates ActFocus with FST for the first time, producing the combined stack. New integration scope not previously attempted."
    prompt: |
      CONTEXT: ActFocus (exp2229, .221) downweights reasoning tokens and upweights action tokens by
      energy variance. FST (exp2241, .222) provides slow/fast weight decomposition for continual
      adaptation. This task integrates both on SOTA GGUFs: action-token energy signals inform
      which fast-weight updates are most valuable to retain.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/training/actfocus.py
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/scripts/experiment_template.py
      TASK: Evaluate the combined ActFocus+FST stack on local SOTA models.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/training/actfocus.py imports — else blocked_actfocus_missing.
           b. python/carnot/training/fast_slow.py imports — else blocked_fst_missing.
           c. ls ~/.cache/huggingface/hub/ | grep -i "Qwen\|gemma" returns non-empty files —
              else blocked_model_not_cached. Use cached_sota_pair() from experiment_template.py.
        1. MODEL_SPECS must include at least one of:
           - unsloth/Qwen3.6-35B-A3B-GGUF
           - unsloth/gemma-4-31B-it-GGUF
           - unsloth/gemma-4-26B-A4B-it-GGUF
        2. Run 20-example reasoning corpus through FST-enabled verify-repair with ActFocus weights.
        3. Record: energy_variance_correlation, fast_weight_retention_rate, energy_reduction.
        4. Set actfocus_fst_validated: true if fast_weight_retention_rate >= 0.85.
        5. Write deliverable to results/experiment_2242_actfocus_fst.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required."
        actfocus_fst_validated:
          principle: "Boolean gate for exp2251 capstone. True only when retention >= 0.85."
        models_used:
          principle: "Records which SOTA GGUF(s) ran so claims are model-specific."
        energy_variance_correlation:
          principle: "Validates ActFocus signal quality — action-token energy variance predicts useful fast-weight updates."
        fast_weight_retention_rate:
          principle: "Primary gate: >= 0.85 required to claim no catastrophic forgetting."
        preconditions_checked:
          principle: "Lists which resources were verified before inference; pre-empts fabrication."
        duration_s:
          principle: "Real compute takes wall-clock time; implausibly short duration flags fabrication."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2243-odar-routing-impl
    title: "Phase 2: ODAR Free-Energy Risk-Sensitive Routing Implementation"
    milestone: "2026.05.222"
    deliverable: "results/experiment_2243_odar_impl.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    prior_failures:
      - experiment_id: exp1822-carnot-odar-routing-prototype
        verdict: partial
        addressed_by: "exp1822 was a prototype without benchmark validation. This implementation adds the FreeEnergyRouter class, integration into VerifyRepairPipeline, and unit tests — a complete, testable module where exp1822 was incomplete."
      - experiment_id: exp1983-carnot-cot2meta-routing-prototype
        verdict: partial
        addressed_by: "Different routing mechanism (CoT metadata routing vs EFE-based risk-sensitive routing). This implements ODAR's free-energy computation, not metadata extraction."
    prompt: |
      CONTEXT: ODAR (arXiv:2602.23681) uses a free-energy-principled risk-sensitive fusion
      mechanism to route queries between fast and deliberative agents, reducing computational
      overhead 82% vs uniform sampling across 23 benchmarks. Carnot's cascade maps naturally:
      fast agent = Tier 0 probes (sub-1ms); deliberative agent = Tier 3 Ising verification.
      Prior prototype exp1822 was incomplete; this task delivers a fully tested module.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/python/carnot/verify/
      TASK: Implement ODAR-style routing for Carnot's verify-repair cascade.
      CONCRETE STEPS:
        1. Create python/carnot/pipeline/odar_router.py implementing:
           - FreeEnergyRouter: computes expected free energy (EFE) from Tier 0 probe outputs
           - risk_threshold parameter: if EFE < threshold, short-circuit to fast-path result
           - route(probe_outputs) -> RoutingDecision (FAST_PATH | DELIBERATIVE)
        2. Integrate FreeEnergyRouter into VerifyRepairPipeline.verify() as an optional
           routing gate between Tier 0e and Tier 1 (use_odar=False default).
        3. Write unit tests: fast-path routing on low-EFE inputs, deliberative routing on
           high-EFE inputs, threshold sensitivity.
        4. Set odar_impl_ready: true if unit tests pass and module imports.
        5. Write deliverable to results/experiment_2243_odar_impl.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required."
        odar_impl_ready:
          principle: "Boolean gate for exp2244 benchmark. True only when unit tests pass."
        router_module_path:
          principle: "Records file path for downstream benchmark task."
        efe_computation_validated:
          principle: "Boolean confirming EFE uses Tier 0 probe outputs correctly."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2244-odar-benchmark
    title: "Phase 2: ODAR Routing Computational Overhead Benchmark"
    milestone: "2026.05.222"
    deliverable: "results/experiment_2244_odar_benchmark.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2243-odar-routing-impl
        artifact_field: odar_impl_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp1822-carnot-odar-routing-prototype
        verdict: partial
        addressed_by: "exp1822 lacked a benchmark. This task explicitly measures compute_reduction_pct >= 30 on a 30-example corpus with a falsifiable acceptance gate."
    prompt: |
      CONTEXT: ODAR routing (exp2243) must demonstrate >= 30% compute reduction vs uniform
      cascade iteration on a 30-example reasoning corpus to be worth the integration overhead.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/odar_router.py
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/scripts/experiment_template.py
      TASK: Benchmark ODAR routing vs uniform cascade on 30-example reasoning corpus.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/pipeline/odar_router.py imports — else blocked_router_missing.
        1. Create 30-example corpus: 15 high-confidence (low EFE, should fast-path),
           15 ambiguous (high EFE, should route to deliberative).
        2. Run both regimes:
           Regime A (uniform): always run full Tier 0 to Tier 3 cascade.
           Regime B (ODAR): route by EFE threshold.
        3. Measure:
           - compute_reduction_pct: (tier_calls_A - tier_calls_B) / tier_calls_A * 100
           - accuracy_delta: accuracy_B - accuracy_A (must be >= -2pp)
           - fast_path_fraction: fraction routed to fast path
        4. Set odar_benchmark_passed: true if compute_reduction_pct >= 30 AND accuracy_delta >= -2.0.
        5. Write deliverable to results/experiment_2244_odar_benchmark.json.

      REQUIRED ARTIFACT FIELDS:
