          - "preflight_v9_dualgpu_fail" if dualgpu_speedup < 1.5
          - "preflight_v9_gpu_dirty" if any GPU VRAM >= 100MB after kill attempt
       d. artifact: gpu0_vram_mb, gpu1_vram_mb, exp527_retired (bool),
          dualgpu_speedup, manifest_enforcement_applied (bool),
          incremental_tests_selected, honest_verdict.
    9. Write tests/python/test_experiment_740_preflight_v9.py with 100% coverage:
       - test ExclusionManifest adds Exp 527 correctly.
       - test DualGPURetrain falls back to sequential when only 1 GPU available.
       - test DualGPURetrain ThreadPoolExecutor submits both tasks.
       Each test traces to REQ-INFRA-048/049.
    10. Reconcile:
        - ops/status.md: add "Pre-flight v9: Exp 527 retired, DualGPU fix implemented."
        - ops/changelog.md: one-line with honest_verdict.
    11. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp741-fr11-formal-closure
