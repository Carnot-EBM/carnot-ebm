- id: exp1236-grpo-execution-grounded-credit
  milestone: 2026.04.96
  deliverable: results/experiment_1236_grpo_execution_grounded_credit.json
  title: "GRPO Execution-Grounded Credit Assignment — Token-Level Constraint Violation Attribution"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 30
  priority: medium
  requires_gpu: false
  gated_on:
    - upstream: exp1235-grpo-v6-fspo-vps-extended
      artifact_field: grpo_v6_improvement_pp
      op: '>'
      value: 0.0
  prompt: |
    CONTEXT:
    arXiv 2603.16158 proposes execution-grounded credit assignment for GRPO: instead of
    spreading the reward signal uniformly across a program, use runtime execution traces to
    localize which tokens caused constraint violations. Carnot's Z3MathVerifier and
    CausalReasoningVerifier can produce token-level violation traces from constraint failures.

    This experiment implements execution-grounded credit as the next level of granularity
    beyond VPS step-level credit (exp1220) and FSPO token factuality (exp1235). The hypothesis:
    execution-level traces provide finer-grained signal than step-level attribution.

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/extract.py (Z3MathVerifier, CausalReasoningVerifier, violation extraction)
    - python/carnot/training/latent_grpo.py (GRPO implementation, reward function)
    - results/experiment_1235_grpo_v6_fspo_vps_extended.json (v6 baseline to compare against)

    TASK:
    1. Write skeleton artifact:
    {{
      "experiment": "1236_grpo_execution_grounded_credit",
      "status": "in_progress",
      "execution_credit_implemented": false,
      "honest_verdict": "in_progress"
    }}

    2. IMPLEMENT EXECUTION-GROUNDED CREDIT (read arXiv 2603.16158 pattern):
       a. For each response token stream T_1...T_N:
          - Parse into executable segments (arithmetic expressions, logical claims)
          - For each segment S: extract which tokens T_i...T_j form segment S
          - Run Z3MathVerifier on segment S → violation_flag and error_location
          - error_location maps back to specific token offsets in the stream
       b. Token-level credit:
          token_credit[i] = 1.0 if T_i is in a correctly-executing segment else 0.0
          token_credit[i] = penalty if T_i caused a verifier violation
       c. Incorporate into GRPO advantage:
          adjusted_advantage[i] = grpo_advantage * token_credit[i]

    3. WRITE COMPARISON EXPERIMENT (CPU-only, no live inference needed):
       - Generate 50 synthetic GSM8K-style responses (some correct, some with arithmetic errors)
       - Apply execution-grounded credit vs uniform credit vs FSPO credit
       - Measure: credit_signal_to_noise_ratio (how concentrated credit is near error tokens)
       - Report: mean credit assigned to error tokens vs non-error tokens

    4. Write 4 unit tests in tests/python/test_execution_grounded_credit.py:
       - test_credit_concentrates_at_violation_tokens
       - test_correct_response_gets_uniform_credit
       - test_z3_violation_maps_to_token_offset
       - test_integration_with_grpo_advantage

    CONCRETE STEPS:
    - python3 -c "import json; d={{'experiment':'1236_grpo_execution_grounded_credit','status':'in_progress','execution_credit_implemented':False,'honest_verdict':'in_progress'}}; open('results/experiment_1236_grpo_execution_grounded_credit.json','w').write(json.dumps(d,indent=2))" 2>&1
    - python3 -c "from carnot.verify.extract import Z3MathVerifier; print('Z3 ok')" 2>&1
    - [Implement execution-grounded credit module]
    - python3 -m pytest tests/python/test_execution_grounded_credit.py -v 2>&1 | tail -10
    - [Run comparison on 50 synthetic responses]
    - [Update artifact]

    REQUIRED ARTIFACT FIELDS:
    - execution_credit_implemented: bool
    - test_file_path: str
    - n_tests_pass: int
    - credit_snr_execution_grounded: float (signal-to-noise ratio for execution credit)
    - credit_snr_uniform: float (baseline uniform credit SNR)
    - credit_snr_fspo: float (FSPO credit SNR from exp1235)
