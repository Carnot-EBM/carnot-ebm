        direct_control_receipts:
          principle: "Immutable direct rows retain their original hashes and are not regenerated."
        token_syntax_intervention_receipts:
          principle: "Syntax treatment proves live token masking rather than prompt-only formatting."
        action_semantic_intervention_receipts:
          principle: "Two-level treatment proves action-state transitions and zeroes invalid continuations."
        raw_candidate_banks:
