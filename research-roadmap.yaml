- id: exp2396-typed-cot-tier28
  title: 'Phase 1: Typed CoT Curry-Howard Tier 2.8 (arXiv:2510.01069) — New Verifier'
  milestone: 2026.05.233
  deliverable: results/experiment_2396_typed_cot.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prompt: |-
    CONTEXT: Typed Chain-of-Thought (arXiv:2510.01069) maps informal CoT reasoning steps
    into formally-typed proof structures using the Curry-Howard isomorphism. Each reasoning
    step is inferred a type (Proposition, Inference, Conclusion) and checked for logical
    consistency. Achieves 85% proof-validity rate on FOLIO benchmark. This is cheaper than
    full Z3 SMT encoding for simple logical steps.

    This is a NEW scope — no prior Typed CoT implementation exists in the codebase.
    Candidate Tier 2.8 verifier: runs AFTER Tier 2 VERGE repair but BEFORE Tier 3 Ising.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/nsvif_z3_extractor.py (architecture reference)
      {project_root}/results/experiment_2351_semantic_energy_real.json (AUROC=0.685 baseline)

    TASK: Implement a TypedCoTVerifier that type-checks CoT steps and evaluates on telemetry.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         b. sklearn importable: .venv/bin/python -c "import sklearn; print(sklearn.__version__)"

      1. Implement TypedCoTVerifier at python/carnot/verify/typed_cot.py:
         Simple Curry-Howard type assignments using heuristic patterns (no full type inference):
         - Proposition type: sentences asserting facts (starts with "The", "A", noun phrase)
         - Inference type: sentences with logical connectives (if/then, because, therefore)
         - Conclusion type: final deductive step (thus, therefore, so, hence, consequently)
         Type consistency check: Inferences must follow from at least one Proposition.
         Conclusions must follow from at least one Inference.
         typed_cot_score: fraction of CoT steps that type-check correctly.

      2. Evaluate on 36 entries from telemetry:
         Extract any CoT/reasoning text from each telemetry entry (look for chain_of_thought,
         reasoning, or the response text itself).
         Compute: typed_cot_auroc, typed_cot_mean_score,
         typed_cot_vs_semantic_energy_delta (baseline 0.685).

      3. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "typed_cot" -v --no-cov 2>&1 | tail -15
         Create test if none exists.

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required."
      - typed_cot_validated:
          principle: "True if TypedCoTVerifier ran on real data."
      - typed_cot_auroc:
          principle: "Primary metric. May be low if telemetry lacks CoT fields — honest result."
      - typed_cot_vs_semantic_energy_delta:
          principle: "Delta vs baseline 0.685. Key improvement signal."
      - cot_fields_found:
          principle: "Which telemetry fields contained CoT content (empty list = no CoT in corpus)."
      - n_eval_examples:
          principle: "Must be 36."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records telemetry manifest check."

    ACCEPTANCE GATES:
      - condition: "typed_cot_validated == true"
        principle: "TypedCoTVerifier must run on real data — low AUROC is acceptable, zero run is not."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2397-frequency-aware-attention
  title: 'Phase 1: Frequency-Aware Attention Tier 0f (arXiv:2602.18145) — Queued Since .228'
  milestone: 2026.05.233
  deliverable: results/experiment_2397_freq_aware_attn.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prompt: |-
    CONTEXT: Frequency-Aware Attention (arXiv:2602.18145) detects hallucinations by measuring
    "high-frequency attention energy" in fragmented tokens. When LLMs hallucinate, they
    attend to high-frequency, semantically incoherent tokens (stopwords, punctuation fragments)
    rather than content-bearing tokens. This is orthogonal to SpilledEnergy (logit variance)
    and HalluField (token-path variance) — a different signal axis for Tier 0f.

    This scope has been queued since .228 but never attempted — new scope, no prior_failures.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/semantic_energy.py (architecture reference)
      {project_root}/results/experiment_2351_semantic_energy_real.json (AUROC=0.685 baseline)

    TASK: Implement a FreqAwareAttentionDetector proxy using available telemetry fields.
    In the absence of raw attention matrices (not available in cached telemetry), use a
    proxy: token-frequency score computed from the top-k token distribution.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         b. Inspect telemetry for token fields:
            .venv/bin/python -c "
            import json
            with open('{project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl') as f:
                row = json.loads(f.readline())
            print([k for k in row.keys()])
            "

      1. Implement FreqAwareAttentionDetector at python/carnot/verify/freq_aware_attention.py:
         Proxy approach (when raw attention unavailable):
         - Token frequency score: fraction of top-k tokens that are high-frequency stopwords
           (the, a, an, is, are, was, were, be, been, has, have, had, do, does, did, ...)
         - High stopword fraction = hallucination signal (model attending to noise tokens)
         - freq_attn_score: fraction of top-k tokens that are stopwords
         - verify(entry: dict) -> dict with freq_attn_score, is_high_freq_pattern, tier='0f'

      2. Evaluate on 36 entries (same split as exp2351):
         Compute: freq_attn_auroc, freq_attn_mean_score,
         freq_attn_vs_semantic_energy_delta (baseline 0.685).

      3. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "freq" -v --no-cov 2>&1 | tail -15

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required."
      - freq_attn_validated:
          principle: "True if FreqAwareAttentionDetector ran on real data."
      - freq_attn_auroc:
          principle: "Primary metric. Honest result vs baseline 0.685."
      - freq_attn_vs_semantic_energy_delta:
          principle: "Delta vs baseline. Key signal."
      - proxy_strategy:
          principle: "Records which proxy was used (stopword_fraction or direct_attention)."
      - n_eval_examples:
          principle: "Must be 36."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records telemetry manifest + field inspection."

    ACCEPTANCE GATES:
      - condition: "freq_attn_validated == true"
        principle: "Verifier must produce non-trivial scores on real data."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

