        - docs/research-notes/sota-ingestion-2026-06-11-unsaturated-execverif-and-verifier-pruner.md (exp4055, read if present)

      TASK: write the resume-and-accumulate runner (EvalPlus hidden-test evaluation) and launch it backgrounded.

