         memory: templates_replayed_in_s2=Z. FR-11 Tier 2 self-learning: OPERATIONAL."
         Update Continuous Self-Learning status to "Tier 2 wired (Exp 738)".
       - ops/changelog.md: one-line with honest_verdict.
