- id: exp606-interleaved-formal-logic
  milestone: 2026.04.46
  deliverable: results/experiment_606_interleaved_logic.json
  title: 'Exp 606: Interleaved Formal-Logic Verification During Generation (arXiv 2601.22642)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2601.22642\
    \ (Interleaved Formal-Logic Verification) achieves 10.4-14.2% gains by dynamically\
    \ interleaving symbolic verification during LLM generation — catching errors mid-chain\
    \ rather than post-hoc. This is architecturally complementary to DSVD (Tier 2.5:\
    \ hidden state rollback) and CoACE (Tier 3: pattern extraction). Interleaved\
    \ verification adds a lightweight Z3 check after each CoT step boundary; if\
    \ Z3 finds UNSAT (step violates prior constraints), the generation is flagged\
    \ before it continues. This is CPU-only (Z3 is fast).\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline\n- python/carnot/extraction/coace_extractor_v4.py\
    \ — CoACEExtractorV4 (from Exp 603)\n- python/carnot/verify/vericot_validator.py\
    \ (if exists) — VeriCoTStepValidator with Z3 (from Exp 453)\n- results/experiment_453_vericot_step_validator.json\
    \ — prior Z3 validator results\n\nTASK: Implement InterleavedLogicVerifier that\
    \ inserts lightweight Z3 checks at CoT step boundaries.\n1. Read CLAUDE.md spec-first\
    \ workflow.\n2. Add REQ-VERIFY-135 (InterleavedLogicVerifier: interleaved Z3\
    \ step-level checking per arXiv 2601.22642), SCENARIO-VERIFY-165/166/167 to spec.\n\
    3. Create python/carnot/pipeline/interleaved_verifier.py:\n   a. InterleavedStepResult\
    \ dataclass: step_text (str), step_idx (int), z3_sat (bool | None),\n      constraint_added\
    \ (str | None), violation_detected (bool).\n   b. InterleavedLogicVerifier class:\n\
    \      - __init__(self, z3_timeout_ms: int = 50).\n      - _split_steps(self, response:\
    \ str) -> list[str]:\n          Split on sentence boundaries containing arithmetic\
    \ operators or 'therefore/so/thus/hence'.\n      - _formalize_step(self, step:\
    \ str, prior_constraints: list[str]) -> str | None:\n          Extract numeric\
    \ equation from step text. Return as Z3 assertion string if found.\n          e.g.:\
    \ '47 + 28 = 75' → '47 + 28 != 75' (SAT means violation).\n      - verify_response(self,\
    \ response: str) -> list[InterleavedStepResult]:\n          Walk steps left-to-right.\
    \ For each step: formalize → Z3 check → if SAT (violation found):\n          record\
    \ violation_detected=True. Append constraint to running list for\n          future\
    \ steps.\n   c. Export InterleavedLogicVerifier, InterleavedStepResult from\
    \ carnot.pipeline.__init__.\n4. Write scripts/experiment_606_interleaved_logic.py:\n\
    \   a. apply_env_autofix() FIRST; from python.carnot.pipeline.live_assertion\
    \ import assert_live_or_ci_skip; assert_live_or_ci_skip().\n   b. ExperimentTimeoutWatchdog(606,\
    \ timeout_minutes=30).\n   c. ExperimentTemplate(606, 'Interleaved Formal Logic\
    \ Verifier',\n      'results/experiment_606_interleaved_logic.json', requires_gpu=False).\n\
    \   d. Load 25 incorrect + 10 correct live responses from results/live_pairs_578.json.\n\
    \   e. Run InterleavedLogicVerifier.verify_response() on all responses.\n   f.\
    \ Compute: ilv_recall = fraction of incorrect responses with violation_detected=True.\n\
    \      ilv_fp_rate = fraction of correct responses with violation_detected=True.\n\
    \   g. Compare to CoACEV3 baseline (recall=0.04).\n   h. Build artifact: schema='carnot.interleaved_logic.v1',\n\
    \      n_incorrect=25, n_correct=10,\n      ilv_recall=<float>, ilv_fp_rate=<float>,\n\
    \      coace_v3_recall_baseline=0.04,\n      improvement_over_coace_v3=(ilv_recall > 0.04),\n\
    \      z3_timeout_ms=50,\n      honest_verdict='ilv_viable' if ilv_recall>=0.20\
    \ else 'ilv_improved' if ilv_recall>0.04 else 'ilv_no_improvement'.\n   i. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_interleaved_verifier.py (100% coverage).\n\
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile:\
