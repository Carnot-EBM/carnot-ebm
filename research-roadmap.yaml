    claim -- verifier_is_oracle=false (the change-LOCATION model + learned verifier are oracle-DISTINCT from the
    env's level-up check; must pass check_circular_moat_overclaim). Do NOT inject the banked winning prefix into
    ranking, search, or progress scoring (the banked winner is classification ground truth ONLY -- B1 audits).
    WALL-CLOCK SAFE: checkpoint the per-game ledger after each game (atomic write) and honor a soft ELAPSED
    budget (~3500s, under the codex hard cap); on a budget stop emit a schema-valid partial:true artifact + exit
    0, resume next run; print per-game progress (codex idle-timeout guard). Emit the bare first-win delta FIRST.

