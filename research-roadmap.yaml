milestone: 2026.06.433
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-24). .432 grew capability 60->61 (A3 banked lf52 L2) but
  bridge_crossed_for_solve=FALSE for the 8th consecutive milestone, AND BOTH .432 DIRECTED-EXPLORATION generation
  levers NULLED on live solve-rate: A1 controllable-novelty proposal policy (exp4688) ended
  controllable_novelty_no_new_level_residual_winning_prefix_still_not_proposed (reshaping the proposal
  distribution with episodic kNN + RND lifelong novelty over a controllability-gated embedding still did NOT make
  the winning L1 prefix appear in the pool); A2 program-synthesis action-effect proposal filter (exp4689) ended
  program_synthesis_filter_no_coverage_gain_residual_logged (coverage_delta=0.0, first_win_rate_delta=-0.04,
  held-out rejection rejected all 2 induced programs as prefix-overfit). The wall is now DOUBLY confirmed UPSTREAM
  of selection, generation-by-search, AND directed-exploration-of-the-proposal-distribution: eight milestones of
  levers that all CONDITION ON THE SAME PERCEPTION have nulled. The operator's 2026-06-23 diagnosis names the
  unattacked root cause: the binding constraint is PERCEPTION -- frame-only order-1 features are at LOO=chance
  (cross_game_features_v2 LOO-AUROC 0.503), which is exactly why the .425 A2 wiring (exp4605) nulled; the
  relational v3 features escape chance offline (LOO-AUROC 0.674, exp4476) but were NEVER wired live (only the
  order-1 cheap subset was, into the value-HEAD as a near-zero tie-breaker, NEVER the explorer's PROPOSAL
  distribution). .433 attacks the two deepest unattacked root causes, each operator/SOTA-flagged. A1 (HEADLINE):
  object-centric/relational PERCEPTION wired into the live explorer's PROPOSAL distribution (the representation
  that conditions what gets generated), off-path calibrated, GATED by a decisive perception-vs-search DIAGNOSTIC
  that resolves the 8-milestone ambiguity -- SOLD arXiv:2410.08822 + FIOC-WM arXiv:2511.02225 + ObjectZero/MCTS
  arXiv:2601.06604, honestly bounded by arXiv:2511.06136. A2 (second independent mechanism, the .432
  SOTA-ingestion's explicit ".433 bottom line"): an AMORTIZED cross-game first-contact exploration prior (Algorithm
  Distillation arXiv:2210.14215 + AMAGO arXiv:2310.09971 + arXiv:2601.19810) + wiring the currently-ORPHANED
  arc_go_explore.py return-then-explore archive (arXiv:1901.10995 + arXiv:2004.12919) into the live E3 path for
  systematic state coverage. A3 banks +1 (61->62) + trains the verifier; A4 is the RETARGETED held-out first-win
  readiness lane (experiment_4605, bootstrap-CI>baseline) per the 2026-06-24 operator directive, now emitting the
  null-delta markers so an honest flat null is not quarantined. Plus persist+transfer (A5), SUBMITTED_AGENT_CONFIG
  integration (A6), 2 infra (B1 perception-quality LOO + off-path CI-metric / B2 adversarial_verify first-win-lane
  null-delta carve-out + perception-overclaim guard), 1 hardware (C), 1 SOTA-ingestion (D, the .434 fallback),
  capstone (E). Submission operator-only. verifier_is_oracle:false on every value claim; solve_provenance on every
  ARC solve. ARC Prize Milestone #1 deadline 2026-06-30 (6 days).
milestone_title: 'PERCEPTION (object-centric/relational into the live PROPOSAL distribution) + AMORTIZED EXPLORATION
  at L1 FIRST-CONTACT -- the 9th attack on the wall after .432 was the 8th-consecutive bridge-not-crossed milestone
  and BOTH directed-exploration generation levers NULLED (A1 controllable-novelty proposal ->
  winning_prefix_still_not_proposed; A2 program-synthesis filter -> coverage_delta=0.0, first_win_delta=-0.04). Eight
  milestones of selection + generation-by-search + directed-exploration levers all CONDITION ON THE SAME order-1
  PERCEPTION (cross_game_features_v2 LOO=0.503=chance) -- the operator-named unattacked root cause. .433 wires
  object-centric/relational PERCEPTION (the relational v3 LOO=0.674 features, NEVER live, NEVER in the proposal
  distribution) into the live explorer''s PROPOSAL distribution gated by a decisive perception-vs-search DIAGNOSTIC
  (A1, HEADLINE: SOLD/FIOC-WM/ObjectZero), and adds an AMORTIZED cross-game exploration prior + the orphaned
  Go-Explore archive wired live (A2, the .432 SOTA-ingestion''s explicit .433 bottom line: Algorithm-Distillation /
  AMAGO / Go-Explore). A3 banks +1 (61->62) + trains the verifier; A4 RETARGETED held-out first-win readiness (with
  null-delta markers); plus A5 persist, A6 integration, 2 infra (B1/B2), 1 hardware (C), 1 SOTA-ingestion (D),
  capstone (E). 6 days to the ARC Prize Milestone #1 deadline (2026-06-30).'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  The 8th consecutive bridge_crossed_for_solve=FALSE (.432) proved that reshaping the explorer's action-PROPOSAL
  distribution (directed exploration: controllable novelty + program-synthesis filtering) is NOT sufficient to make
  the winning L1 trajectory appear -- both .432 generation levers nulled (A1 winning_prefix_still_not_proposed; A2
  coverage_delta=0.0). Across eight milestones, EVERY lever (six selection, two generation-by-search, two
  directed-exploration) conditions on the SAME perception, and the operator's 2026-06-23 diagnosis names that
  perception as the binding constraint: frame-only order-1 features are at LOO=chance (cross_game_features_v2
  LOO-AUROC 0.503), which is precisely why the .425 A2 live wiring (exp4605) nulled. The richer relational v3
  representation escapes chance offline (LOO-AUROC 0.674, exp4476/exp4545) but was NEVER wired into the live agent
  (only the order-1 cheap subset was, into the value-HEAD as a near-zero-weight tie-breaker -- exp4605 -- and NEVER
  into the explorer's PROPOSAL distribution). .433 attacks the two deepest unattacked root causes, each
  operator/SOTA-flagged, both on the SCORED E3AgentPolicy, both verifier_is_oracle:false, both live-path-reachable.
  A1 (HEADLINE) wires a generic OBJECT-CENTRIC / RELATIONAL representation into the live explorer's PROPOSAL
  distribution (the representation that conditions what gets generated -- never done before; every prior perception
  experiment targeted cross-game discrimination / value-head ranking, never the proposal stage), off-path
  calibrated to fix the offline->live bridge, and is GATED by a DECISIVE perception-vs-search DIAGNOSTIC: does an
  upper-bound relational/object-centric representation make the winning L1 prefix proposable on a clean game where
  the order-1 representation does not? That diagnostic resolves the 8-milestone perception-vs-search ambiguity
  whether or not A1 banks a level. SOTA: SOLD arXiv:2410.08822 + FIOC-WM arXiv:2511.02225 + ObjectZero/MCTS
  arXiv:2601.06604, honestly bounded by "When Object-Centric World Models Meet Policy Learning... and Where It
  Breaks" arXiv:2511.06136. A2 (second independent mechanism) is the .432 SOTA-ingestion's explicit ".433 bottom
  line": an AMORTIZED cross-game first-contact exploration prior distilled from logged first-contact traces
  (Algorithm Distillation arXiv:2210.14215 + AMAGO arXiv:2310.09971 + Unsupervised Efficient Exploration
  arXiv:2601.19810) so the live explorer proposes from a learned cross-game prior instead of an empty per-game
  start, PLUS wiring the currently-ORPHANED arc_go_explore.py return-then-explore archive (Go-Explore
  arXiv:1901.10995 + First Return Then Explore arXiv:2004.12919) into the live E3 path for SYSTEMATIC state
  coverage. A1 and A2 are genuinely independent (A1 fixes WHAT the agent perceives; A2 fixes WHERE it looks first
  regardless of perception) -- two independent shots at the confirmed wall. CAPABILITY (A3): self-play banks +1
  reproducible level (61->62) + trains the learned verifier. SCORE (A4): the RETARGETED held-out first-win lane
  (experiment_4605 first_win_rate_integrated vs the 0.04/0.08 baseline, bootstrap-CI), now emitting the null-delta
  markers so an honest flat null is NOT quarantined (the exp4691 TAUTOLOGY-flag fix). Plus persist+transfer (A5),
  integration (A6), 2 infra (B1 perception-quality LOO + off-path CI-metric / B2 adversarial_verify first-win-lane
  null-delta carve-out + perception-overclaim guard), 1 hardware (C), 1 SOTA-ingestion (D, the .434 fallback),
  capstone (E). verifier_is_oracle:false on every value claim; solve_provenance on every ARC solve; submission
  operator-only. RETIRED (do NOT re-propose): the .432 A1 controllable-novelty PROPOSAL policy
  (winning_prefix_still_not_proposed); the .432 A2 program-synthesis filter WITHOUT a richer representation
  (coverage_delta=0.0); the .425 A2 order-1-subset-into-the-value-head wiring (live_integration_no_value); any A4
  that cites the replay-package level count as "the leaderboard score". 6 days to the ARC Prize Milestone #1
  deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC (A1-A6); >=1
  level-up attempt that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A3); self-play loop EVERY
  milestone (A3 trains+checkpoints the verifier); 2 reserved infra (B1/B2); 1 per-board hardware (C); 1
  SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus. 6 days to the ARC Prize
  Milestone #1 deadline ($25K). The frozen live generator is Qwen3.5-9B-MTP on the iGPU (NEVER the 3090s); A1/A2
  arms that induce/strategize via the LLM declare live_llm_inference for that arm only and construct the proposer
  on a FREE port + /props-verify Qwen (the port-8919 gemma-squat confound)."

