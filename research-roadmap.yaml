- id: exp1029-fover-expansion-v2
  milestone: 2026.04.80
  deliverable: results/experiment_1029_fover_expansion_v2.json
  title: "FoVer Corpus Expansion v2 — Z3 Real Labels + MetaQA Weak Labeler (500+ pairs)"
  prompt: |
    CONTEXT:
    The FoVer corpus has been stuck at 57 labeled CoT pairs since Exp 442. All probe training
    (ThinkPRM, VPRM, GS-KAN, PPSEBM relay) depends on this corpus. Exp 542 was blocked
    (synthetic_fallback: used GPT-generated GSM8K templates rather than real Z3 labels on real
    arithmetic problems). Exp 1016 in .79 was DOOMED_RERUN_BLOCKed because the planner forgot
    to add a prior_failures field. This experiment is STANDALONE — it does NOT gate on preflight
    and does not require any other experiment to complete first.

    Key improvements over prior attempts:
    - Real Z3 labels: use the MATH and AOPS arithmetic sub-corpus (real student solutions),
      not synthetic GSM8K templates
    - MetaQA weak labeler: apply 5 metamorphic relations as additional labeling signal

    EXISTING CODE TO READ FIRST:
    - python/carnot/data/fover_corpus.py (or wherever the 57-pair corpus lives — search for it)
    - python/carnot/verify/step_verifier.py or equivalent (VeriCoTStepValidator from Exp 453/564)
    - scripts/experiment_442_*.py (original corpus generation — understand the schema)
    - scripts/experiment_1016_*.py (if it exists — understand what was planned)
    - research-references.md section "MetaQA: Hallucination Detection" (new, 2026-04-28 scan)

    TASK:
    1. LOAD EXISTING CORPUS: Find and load the 57-pair FoVer corpus. Confirm schema:
       (step_text, label (correct/incorrect), violation_type, source_problem).
    2. COLLECT REAL ARITHMETIC PROBLEMS: Load 500+ arithmetic CoT problems from the MATH
       dataset (available via HuggingFace: lighteval/MATH). For each problem, extract
       individual reasoning steps using sentence boundaries. Target: 1000+ candidate steps.
    3. Z3 LABELING: For each candidate step, apply VeriCoTStepValidator:
       - If step contains arithmetic (addition, subtraction, multiplication, division,
         inequality), extract the assertion and check with Z3.
       - Label: correct (Z3 UNSAT for negation), incorrect (Z3 SAT for negation), unknown.
       - Keep only correct and incorrect labels. Discard unknown.
    4. MetaQA WEAK LABELER (NEW): For a 200-step sample, apply 5 metamorphic relations using
       unsloth/gemma-4-26B-A4B-it-GGUF (fast MoE model):
       a. Numeric paraphrase: restate calculation with different notation; expect same result
       b. Negation consistency: negate the step; expect model to agree it's now wrong
       c. Synonym substitution: replace "equals" with "is", "multiply" with "times"
       d. Unit replacement: change units; verify model flags inconsistency if units matter
       e. Step decomposition: split step into 2 sub-steps; expect equivalent result
       Any step where model gives INCONSISTENT answers under 2+ relations = candidate violation.
       Cross-validate MetaQA candidates against Z3 labels where overlap exists.
    5. COMBINE: Merge Z3 labels + MetaQA weak labels. Deduplicate by step_hash.
       Count: n_labeled_pairs (Z3-confirmed), n_metamorphic_candidates, n_violation_pairs.
    6. SAVE: Write expanded corpus to python/carnot/data/fover_corpus_expanded.json or
       data/fover_corpus_500plus.json. Also write a split: fover_train.json (80%) and
       fover_test.json (20%).

    USE GPU: sg render -c 'JAX_PLATFORMS=cpu TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1 python scripts/experiment_1029_fover_expansion_v2.py'
    MODEL: unsloth/gemma-4-26B-A4B-it-GGUF (use cached_sota_pair() from experiment_template.py)

    ARTIFACT FIELDS:
    - n_labeled_pairs: int (Z3-confirmed correct+incorrect labels)
    - n_violation_pairs: int (incorrect-labeled steps, Z3-confirmed)
    - n_metamorphic_candidates: int (MetaQA-flagged steps)
    - n_metamorphic_z3_agreement: int (MetaQA candidates confirmed by Z3)
    - corpus_path: str (path to saved expanded corpus)
    - honest_verdict: "corpus_expanded_500plus" | "partial_z3_only" | "below_target" | "failed"

    Run: python scripts/experiment_1029_fover_expansion_v2.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: high
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 60
  prior_failures:
