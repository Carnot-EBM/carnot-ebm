- id: exp1122-kv260-v4-python-sim
  milestone: 2026.04.87
  deliverable: results/experiment_1122_kv260_v4_python_sim.json
  title: "KV260 v4 Sparse+Inertia Python Simulation — Validate KL(v4||Gibbs) < 0.05"
  model: opus
  max_turns: 50
  estimated_wall_time_min: 30
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1109-kv260-ising-sampler-v3-sequential
      verdict: sequential_sampler_validates_detailed_balance_kl_under_threshold_hardware_pending
      addressed_by: "exp1109 validated v3 SEQUENTIAL single-site updates (KL=0.025) but noted
        that v4 SPARSE+INERTIA (ising_sampler_v4.v) was not yet Python-simulated. exp1122 fills
        this gap: run the Python simulation of v4 dynamics (sparse K=16 nearest-neighbor coupling
        + E-MVL majority vote + per-spin EMA inertia) and measure KL(v4||Gibbs). References:
        arXiv 2604.17109 (inertia enables correct PARALLEL updates) and arXiv 2602.16143 (Dual
        BRAM 800-node on KV260-class hardware). If v4 inertia achieves KL < 0.05 with parallel
        updates, it is superior to v3 sequential in throughput at equal correctness."
      retire_if_same_verdict: false
    - experiment_id: exp1094-phase2a-sampler-correctness-audit
      verdict: kl_fpga_parallel_fails_detailed_balance_kl_3p07
      addressed_by: "exp1094 confirmed that the v1 PARALLEL synchronous Glauber sampler violates
        detailed balance (KL=3.07). The v4 inertia architecture directly addresses this: the EMA
        momentum term damps frustrated spin oscillations, allowing parallel updates without
        period-2 oscillation. arXiv 2604.17109 proves this theoretically for dense p-bit machines;
        exp1122 validates it empirically for Carnot's sparse K=16 topology."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    KV260 v4 Verilog + spec exist: hardware/kv260/ising_sampler_v4.v and ising_sampler_v4_spec.md.
    The v4 architecture uses:
    - SPARSE coupling: K=16 nearest neighbors per spin (vs dense N×N)
    - E-MVL majority vote update rule: sign(h_ema) (vs Gibbs sigmoid)
    - Per-spin EMA inertia: h_ema[i] = alpha * h_ema[i] + (1-alpha) * h_new[i]
    - SYNCHRONOUS parallel updates (all spins in parallel, enabled by inertia)

    Reference papers:
    - arXiv 2604.17109: p-bit inertia enables correct parallel updates (35-150x speedup)
    - arXiv 2602.16143: Dual-BRAM Ising 800 nodes on KV260-class hardware
    - arXiv 2604.01564: time-multiplexed p-bit reuse achieves stable synchronous operation

    The v3 sequential sampler achieved KL=0.025 (exp1109) but is 23x slower than v1 parallel.
    If v4 inertia achieves KL < 0.05 with PARALLEL updates, it is the target architecture:
    fast (parallel) AND correct (detailed balance via inertia).

    SIMULATION TASK:
    1. Read hardware/kv260/ising_sampler_v4.v and ising_sampler_v4_spec.md to understand:
       - Exact EMA update rule (what alpha value? how is h_ema computed?)
       - E-MVL majority vote threshold (is it sign(h_ema) or sign(h_ema - threshold)?)
       - Sparse neighbor indexing (fixed graph or configurable via AXI?)
    2. Implement Python simulation of v4 dynamics:
       class SparseInertiaIsingSampler:
         - __init__(n_spins, k_neighbors, alpha_ema, beta_temperature)
         - sweep(spins, nbr_idx, J_sparse): one parallel synchronous sweep
         - build_ring_topology(n_spins, k): antiferromagnetic ring (same test as exp1094)
    3. Measure KL(v4_sim || Gibbs reference) using the same antiferromagnetic ring used in
       exp1094 (N=8 spins, J=-1 all edges). Use same burn_in=500 sweeps, n_record=60000.
    4. Sweep alpha_ema ∈ {0.1, 0.3, 0.5, 0.7} to find optimal inertia setting.
    5. Report: best_kl = min KL across alpha_ema sweep.
    6. Hardware deployment attempt:
       - SSH to 192.168.51.98 (KV260 board, known reachable per exp1109)
       - Attempt to load the v3 sequential bitstream (from exp1041 era, already on board)
       - If successful, run a short sampling test and compare hardware vs Python sim
       - If synthesis fails (Vivado not available), document the attempt

    ALSO CHECK: docs/kv260_synthesis.md for any Vivado installation notes. Check if
    openXC7 (open-source Xilinx synthesis alternative) is installable:
    `pip install openxc7` or check https://github.com/openxc7/openXC7 — note: Zynq-7000
    and Zynq UltraScale+ (KV260's XCZU5EV) are likely NOT supported (confirmed: only
    Artix-7/Kintex-7/Spartan-7 families). Document this definitively.

    CONCRETE STEPS:
    - cat hardware/kv260/ising_sampler_v4_spec.md
    - cat hardware/kv260/ising_sampler_v4.v | head -100
    - (implement SparseInertiaIsingSampler Python class)
    - (run KL measurement sweep over alpha_ema values)
    - ssh ianblenke@192.168.51.98 "ls /dev/xdma* 2>/dev/null && echo 'board reachable'"
    - pip show openxc7 || pip install openxc7 --dry-run 2>&1 | head -10
    - Write results/experiment_1122_kv260_v4_python_sim.json

    REQUIRED ARTIFACT FIELDS:
    - v4_spec_read: bool
    - kl_v4_best: float (min KL across alpha_ema sweep)
    - kl_v4_threshold: float (0.05 acceptance gate)
    - kv260_v4_kl_measured: bool (True if measurement completed)
    - kl_v4_below_threshold: bool (True if kl_v4_best < 0.05)
    - best_alpha_ema: float (alpha value achieving kl_v4_best)
    - kl_v3_sequential_baseline: float (0.025 from exp1109 — copy here for comparison)
    - kl_v1_parallel_baseline: float (3.07 from exp1094 — copy here for comparison)
    - hardware_board_reachable: bool
    - hardware_synthesis_attempted: bool
    - openxc7_zynq_supported: bool (expected False per tool scope)
    - openxc7_support_note: str
    - honest_verdict: "v4_kl_below_threshold_parallel_correct" | "v4_kl_above_threshold" | "simulation_only_hardware_pending" | "partial" | "failed"

