        retire_if_same_verdict: false
      - experiment_id: exp3231-capstone-v298
        verdict: "complete: capstone_v298_ready=true"
        addressed_by: "Same as above — standard operational task."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      Aggregate the .299 single-focus result (exp3222 v4) into the capstone
      artifact. Update publication_blocker_count + next_top_gap based on
      whether the v4 task hit replacement-grade, publication-grade, or below.

      CONCRETE STEPS
      1. Read exp3222 result.
      2. Update publication_blocker_count based on v4's headline outcome:
         - replacement_grade: -3 (closes the safety-classifier blocker tier)
         - publication_grade_garak_partial: -1 (publication-grade but
           adversarial-validation partial)
         - overfit_to_training: 0 (no change; new evidence of an OOD gap)
         - below_replacement_threshold: 0 (no change; corpus expansion alone
           didn't unblock)
      3. Set next_top_gap to either "cuda_chain_for_full_local_sota_receipts"
         (default, since CUDA was the .298 capstone's next_top_gap) or
         "v4_garak_adversarial_expansion" if Gates 1+2 pass but Gate 3
         partial.
      4. Emit the standard capstone artifact.

      REQUIRED ARTIFACT FIELDS:
      - capstone_v299_ready: bool
      - paper_ready: bool
      - publication_blocker_count: int
      - next_top_gap: str
      - v4_outcome: str (one of: replacement_grade / publication_grade_garak_partial / overfit_to_training / below_replacement_threshold / blocked_<resource>)
      - random_seed: int
      - reproducibility_checksum: str
      - duration_s: float
      - honest_verdict: str (principle: complete:/success:/passed:/shipped_ prefix)
