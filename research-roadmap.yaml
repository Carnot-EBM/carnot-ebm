#      re-wired on that 1.0 (exp3696, E2E green). So .339 MUST leak-audit + held-out-replicate the code
#      signal (TraceCoder execution-trace arXiv:2602.06875 + a DIFFERENT held-out corpus arXiv:2605.11006
