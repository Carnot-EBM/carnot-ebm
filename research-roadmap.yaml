tasks:
- id: exp7516-contract-methods
  title: Bind fourteen tasks and qualify the V657 scientific limits
  phase: 1
  track: reporting
  priority: high
  requires_gpu: false
  max_turns: 20
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.658
  deliverable: results/experiment_7516_v658_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  prior_failures:
  - experiment_id: exp7515-capstone
    verdict: complete_disqualified_required_v657_evidence
    addressed_by: New V658 reporting preserves the failed static audit and uses explicit absolute-cost null rows;
      it does not rerun or promote the old scientific comparison.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.658. V657 completed thirteen producer paths, but its static audit and capstone are disqualified. The static rows are exposed exploratory data; the online null is independently qualified. Bind V658 without rehabilitating either result.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/experiment_7358_v646_validation_contract.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/python/carnot/experiment_7503_v657_contract_methods.py
    - {project_root}/python/carnot/experiment_7515_v657_capstone.py
    - {project_root}/results/experiment_7515_v657_capstone.json
    - {project_root}/results/experiment_7508_v657_static_audit.json
    - {project_root}/results/raw/experiment_7508_v657_static_audit/validation/terminal/03_verdict_row_consistency_strict/00_verdict_row_consistency_strict.log
    - {project_root}/research-references.md
    - {project_root}/research-studying.md
    - {project_root}/ops/known-issues.md
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7516_v658_contract_methods.json. Create scripts/experiments/experiment_7516_v658_contract_methods.py as a thin entrypoint; new reusable behavior belongs in python/carnot/experiment_7516_v658_contract_methods.py and tests in tests/python/test_experiment_7516_v658_contract_methods.py. TASK paths are outputs to create, not existing prerequisites. Read earlier V658 outputs only after their producer runs.

    CONCRETE STEPS:
    1. PRECONDITIONS: print a flushed progress line immediately. Check the named files, applicable REQ-* specifications and external resources before measurement. Same-milestone outputs are inputs only after their producers run. An unchanged missing prerequisite produces complete_blocked_<reason>, verdict_class=blocked and gate_check_summary with the exact path/field, expected and observed value.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark and subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed at least every 60 seconds. Stream child stdout unbuffered and emit truthful pending-operation heartbeats every 60 seconds. Keep EVERY output gap below 600 seconds: silent work can die at 1200 seconds; continued progress permits the 4800-second hard cap. Checkpoint work; terminate only owned processes.
    3. Keep every tool call bounded. Write ANY file over about 200 lines in several tool calls, preferably 100-150 lines each, with a progress message between calls. Split module, test, read and validation calls. A heartbeat child does not expose progress while the agent composes an oversized file-writing call; never compose all source and tests in one call.
    4. Before implementation extend the relevant OpenSpec REQ-* and SCENARIO-* items, then add meaningful failing tests. Reuse existing readers, runners and validation helpers. Keep the entrypoint thin; do not copy an earlier thousand-line experiment framework. Preserve old artifacts and tests, including assertions. Use /tmp for scratch work.
    5. Declare inference_substrate_class=aggregation and inference_substrate=aggregation_from_upstream_artifacts exactly. MODEL_SPECS=[], model_specs=[], model_invoked=false and zero current model calls. Historical model receipts remain historical.
    6. Resolve the YAML with milestone 2026.09.658 (next before activation, active afterward). Compare all fourteen ordered IDs, exact titles, phases, deliverables, substrate classes and structured gates against the design table. Use private mutations to reject count, order, title, field, path and milestone drift; do not change guard code. This advisory task is not a global science gate.
    7. Inventory all thirteen V657 artifacts. Preserve the Exp7508 strict failure: eight NO_HEADROOM_MAJORITY advisories are fatal under --strict, despite zero blocking findings. Its signed cost differences were unsuitable headroom metrics. Do not weaken strict mode or rewrite upstream artifacts. Require new audits to report absolute arm costs plus factual no_headroom=true, positive_claim=false and headroom_explanation when supported by rows; prove guard compatibility on valid-null fixtures before measuring.
    8. Ingest three to five primary methods from the 2026-09-22 reference review, reading method sections in a bounded low-concurrency pass. Write docs/research-notes/v658-method-map.md with source URL/section, exact adaptation, counterexample and destination task. Mark corresponding research-studying.md leads ingested. Separate consistency, calibration, online proper loss and thermodynamic co-design; preserve access failures.
    9. Run unchanged schema, prior-failure, exclusion, gate, ARC-floor, harness-boundary and overdue-priority checks. Record exact open priorities and the outer-loop E6 timed profile as separate evidence from V657 coarse timers. Do not archive the active YAML or activate anything.
    10. Freeze the affected-file validation manifest and verify imports resolve to this worktree. Run scoped pytest -n 0 -o addopts= --no-cov with a private --basetemp; separately require 100 percent changed-module coverage with command-local COVERAGE_FILE. Run scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on the affected tests. Use the Exp7358/Exp7303 helpers. Record unrelated repository failures separately; do not gate model load on an unscoped full test suite.
    11. Run the declared entrypoint and fresh-process cold replay as capability E2E. Reporting-only work has no applicable numbered runtime E2E. Shared training/sampler changes require E2E-001/002; binding/serialization changes require E2E-003/004. ARC policy/transport changes require E2E-009/010; telemetry changes require E2E-011 and the private LLM-off real-environment smoke in ops/e2e-test-plan.md. Save actual commands and outputs. Rust changes also require affected cargo tests, fmt and clippy.
    12. Independently reduce all comparative rows and run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact candidate. Save receipts. All required checks must pass before atomic terminal publication. Failed required validation is disqualified; a failed measured benefit gate is null; unchanged external absence is blocked. partial means retryable unfinished OWN work only. Keep checkpoints outside the terminal deliverable path.
    13. Reconcile affected OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md to the measured evidence. Keep artifacts below 20 MiB using hash-bound sidecars. Preserve generator weights and production defaults. Do not activate a roadmap, submit a scored kernel, publish externally or change research-roadmap.yaml.

    ACCEPTANCE GATES:
    - Validity: all required scoped checks and cold independent replay pass. principle: favorable science cannot excuse invalid evidence.
    - Readiness: named ready/complete fields are bare numeric 0/1 values, independent of benefit. principle: a valid null remains eligible for auditing.
    - Benefit: apply exactly the task-specific support, effect and uncertainty gates above. principle: a hypothesis is not a result and insufficient support is not positive.

    REQUIRED ARTIFACT FIELDS:
    - schema: principle: "Version, experiment_id and milestone bind the terminal reader contract."
    - run_date: principle: "Use {date} and actual UTC/monotonic times, process identity and source revision."
    - preconditions_checked: principle: "Exact resource observations and input hashes prevent invented readiness."
    - MODEL_SPECS: principle: "Also emit model_specs; fresh LLM work requires unsloth/Qwen3.8-27B-GGUF and resolved path/hash/quantization/runtime, while no-load work uses []."
    - model_invoked: principle: "Distinguish current model work from historical model provenance."
    - invocation_counts: principle: "Reconcile attempted, completed, failed, cancelled and in-flight loads, forwards and generations."
    - inference_substrate_class: principle: "Use the declared actual class; floors are 2s for load/no generation, 10s for bounded generation and 60s for full generation. Never pad time."
    - inference_substrate: principle: "Aggregation is exactly aggregation_from_upstream_artifacts. Native option forwards use live_llm_embedding_extraction, readout_kind=option_logits and zero generated tokens."
    - execution_venue: principle: "Host CPU, real CUDA, historical board CPU and FPGA fabric are different evidence classes."
    - duration_s: principle: "Measure current elapsed work; separate authoring, validation and historical capture durations."
    - phase_spans: principle: "Record phase and heartbeat timing, including waiting and timeouts."
    - random_seed: principle: "Freeze selection, fitting, arrival and bootstrap seeds before labels or outcomes."
    - reproducibility_checksum: principle: "Bind code, settings, roles, raw rows and model identity when used."
    - source_artifact_hashes: principle: "Preserve original bytes, exposure history and adversarial flags."
    - rows: principle: "Every compared source, event, game or arm carries its metric and disposition; missing is not zero."
    - sample_size_budget: principle: "Separate planned, attempted, completed, excluded, failed, censored and unstarted independent units."
    - acceptance_gate_results: principle: "For each validity, support and benefit check emit expected, observed, op, passed and principle."
    - gate_check_summary: principle: "Every blocked result names the exact failed check, upstream, field/path and observed value, including absent/null."
    - honest_verdict: principle: "Use a complete_ terminal prefix and preserve literal prior verdicts."
    - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial; external absence is blocked, never partial."
    - verifier_is_oracle: principle: "An oracle-defined fixture can be circular_positive at most; human factuality labels are not formal proof."
    - flagged_adversarial: principle: "Retain actual findings; never clear a flag to open a gate."
    - validation_receipts: principle: "Store exact scoped commands, exit codes, output hashes and required-versus-baseline status."
    - field_principles: principle: "Every emitted field and acceptance gate explains the failure it prevents."
    - contract_ready_score: principle: "Bare 0/1 for both exact authorities and mutation rejection, independent of science."
    - method_ingestion_complete_score: principle: "Bare 0/1 for source-grounded method dispositions."
    - prior_dispositions: principle: "Preserve valid null, exposed data and disqualified evidence separately."
    - task_contract_rows: principle: "Exactly fourteen ordered identities and gates form the executable contract."

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} .venv/bin/python -u scripts/experiments/experiment_7516_v658_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
