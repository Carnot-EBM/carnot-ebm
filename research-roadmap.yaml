         If none found: use delta = 0.25 as a conservative estimate. Note clearly.
         four_over_delta = 4 / delta.
         Record: carnot_delta (float), four_over_delta_prediction (float),
         n_artifacts_checked (int), delta_source (str: "empirical" or "conservative_estimate").

      2. If tex_file_found: read main.tex. Add to §2 (theoretical background):
         ARM-EBM bijection paragraph (citing blondel2025arm).
         Add to §3 (architecture):
         - 4/delta bound paragraph (citing dantas2025four).
         - FST fast-slow training paragraph (citing hashimoto2026fst).
