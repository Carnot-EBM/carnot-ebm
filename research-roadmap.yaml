- id: exp7274-source-contract
  title: V640 source ingestion and exact execution contract
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.640
  deliverable: results/experiment_7274_v640_source_contract.json
  model: opus
  prior_failures:
  - experiment_id: exp7260-source-contract
    verdict: complete_disqualified_v639_source_contract_mismatched_or_invalid
    addressed_by: Replace the stale V636 Markdown with the planner-validated V640 document; independently check
      all fourteen rows before handoff.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V639 completed fourteen tasks but its declared Markdown still described V636. Exp7260 disqualified the contract. Bind the complete new design and YAML; this advisory receipt gates no science. Ingest the V640 literature refresh without treating external results as local proof.

    Work at {project_root}. Execution date {date}. Milestone 2026.09.640, phase 1.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/research-references.md
    - {project_root}/research-complete.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/research-roadmap.yaml
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_consumer_checks.py
    - {project_root}/scripts/conductor_gates.py
    - {project_root}/results/experiment_7273_v639_capstone.json
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7274_v640_source_contract.json. Create scripts/experiments/experiment_7274_v640_source_contract.py as the thin entrypoint and tests/python/test_experiment_7274_v640_source_contract.py for new behavior. Add a reusable module only where required. External missing, quarantined, or retired prerequisites are terminal blocked with gate_check_summary, never partial. Partial is reserved for this task's own unfinished work.

    CONCRETE STEPS:
    1. Print and flush immediately. Authenticate inputs and output paths. Confirm the driving capability has REQ-*; add the specific requirement and meaningful failing tests before implementation. Keep entrypoints thin and reuse shipped functions. New experiment paths named under TASK and same-milestone inputs are outputs, not existing prerequisites. Put scratch work in /tmp, provisional work in results/checkpoints/, and raw evidence in results/raw/. Never emit a success-shaped placeholder.
    2. Print and flush a progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark, and subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed time at least every 60 seconds. Stream unbuffered child output and use a truthful external heartbeat for blocking calls, authoring, and tests. Keep EVERY output gap below 600 seconds: silence can kill at 1200s; continued progress permits the 4800s hard cap. Bound work as well as silence. Never sleep to meet a duration floor.
    3. No LLM invocation: MODEL_SPECS=[], model_invoked=false, and zero current load/generation counters. Use inference_substrate=cpu_exact_solver_or_simulator and inference_substrate_class=cpu_exact_solver_or_simulator for CPU algorithms, replay execution, and tests. A read-only reducer uses inference_substrate=aggregation_from_upstream_artifacts and inference_substrate_class=aggregation. execution_venue=host. Historical model receipts and injected model fixtures belong in hashed sidecars; do not classify them as current calls.
    4. Select staged YAML before activation or active YAML after activation only when milestone equals 2026.09.640. Independently parse the Markdown and YAML: exactly 14 ordered IDs exp7274 through exp7287, titles, paths, and gates. Freeze both source bytes. A mismatch is disqualified; do not activate or repair the roster from this task.
    5. Read the V640 source refresh. Recheck at most four primary URLs with 20-second request limits. Record implement/adapt/defer decisions for source controls, world-model consumption, independent update admission, and acknowledgment costs; retain dates, version, access errors, falsifying controls, and retired overlap.
    6. Run the existing schema, prior-failure, exclusion, prompt-path, and gate-declaration checkers. Test every actual gate with temporary true, false, missing-field and missing-file artifacts. Keep this receipt advisory; a source fetch failure is an access observation, not a reason to block unrelated experiments.
    7. E2E: Exact plan copies -> schema/path/prior lint -> independently parsed Markdown/YAML rows -> real scripts.conductor_gates.evaluate_gates. No model or board run.
    8. Run focused pytest on tests/python/test_experiment_7274_v640_source_contract.py and the explicitly affected suites, scoped 100% coverage, Ruff check/format, changed-module mypy, and scripts/check_spec_coverage.py on those exact test files. Use -n 0, -o addopts= or --no-cov for noncoverage runs, and a private --basetemp. Never run bare pytest or the repository-wide suite, including through inherited validation helpers. Independently reduce raw rows; run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py on the measured terminal candidate under results/raw/. Only after actual validation, atomically write the declared terminal deliverable; retain failure receipts. Reconcile the driving OpenSpec, _bmad/traceability.md, ops/status.md, and ops/changelog.md. Preserve tests and historical evidence; no skipped, weakened, deleted, or reverted tests. No publication, upload, submission, production-default change, external message, or edit to research-roadmap.yaml.

    9. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Version the result and retain ordinary top-level experiment_id and milestone."
       - status: principle: "Use complete or blocked for terminal evidence; keep unfinished work in separate checkpoints."
       - run_date: principle: "Use {date} and actual UTC start and end times."
       - field_principles: principle: "Store explanations here; consumer values remain ordinary top-level fields."
       - preconditions_checked: principle: "Record actual input hashes, authority separation, resource ownership, and failures."
       - MODEL_SPECS: principle: "Declare models executable in this invocation; keep historical identities in hashed sidecars."
       - model_invoked: principle: "Derive from actual calls, including failed or unusable generation."
       - invocation_counts: principle: "Separate attempted and completed loads and generation from usable answers."
       - inference_substrate: principle: "Use the recognized literal for actual computation, not an invented task label."
       - inference_substrate_class: principle: "Use full generation 60s, bounded generation 10s, load-only 2s, or the correct no-LLM class; never pad duration."
       - execution_venue: principle: "Host orchestration is host; identify real device execution separately."
       - duration_s: principle: "Measure monotonic elapsed time and disjoint phase spans."
       - random_seed: principle: "Freeze independent-unit seeds before observing results."
       - reproducibility_checksum: principle: "Bind code, configuration, input manifests, and raw evidence."
       - source_artifact_hashes: principle: "Preserve exact input identity, retirement, and quarantine status."
       - rows: principle: "Keep each unit, arm, seed, error, abstention, cost, metric, and censoring state."
       - sample_size_budget: principle: "Record planned, attempted, completed, and censored units and the stopping rule."
       - acceptance_gate_results: principle: "Each criterion records expected, observed, passed, and principle; separate completeness and value."
       - gate_check_summary: principle: "For blocked_* name upstream, exact field or check, observed value, and expected value."
       - verifier_is_oracle: principle: "Expose shared verifier/evaluator authority; exact conformance is not learned correctness."
       - honest_verdict: principle: "Completed findings start complete_ or complete:; external absence starts blocked_; retain the measured finding."
       - verdict_class: principle: "Exactly positive | circular_positive | null | blocked | disqualified | partial. Oracle=true forbids positive. Failed efficacy gates forbid positive. Only incomplete own work is partial; unchanged external blocks are terminal blocked."
       - validation_receipts: principle: "Retain command, exit code, timing, and log hash; do not hide failures."
       - source_contract_complete_score: principle: "One only when both fourteen-task contracts and their exact gates agree."
       - contract_rows: principle: "One literal row per planned task, including title, path, and structured gates."
       - source_dispositions: principle: "Bound source claims and explain adaptation or deferral."
       - gate_control_rows: principle: "Keep four distinct observations for every real structured edge."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7274_v640_source_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
