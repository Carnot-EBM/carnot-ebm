- id: exp970-ppsebm-tier2-crosssession-memory
  milestone: 2026.04.75
  deliverable: results/experiment_970_ppsebm_tier2_crosssession_memory.json
  title: "PPSEBM Tier 2 Cross-Session Memory — Progressive Parameters Fix for Plateau"
  prompt: |
    CONTEXT:
    Continuous self-learning (MANDATORY per research-program.md) requires advancing Tier 2
    cross-session memory. Exp 748 (10-session stress test) showed plateau at session 2:
    templates added in S1, zero additions in S2-S10 despite new error patterns. Exp 761
    (constraint addition) confirmed the mechanism works at session 1 but doesn't sustain.

    Root cause (from arXiv 2512.15658 PPSEBM analysis): constraint memory store does not
    distinguish parameters relevant to new vs old constraint types. New patterns interfere
    with learned ones, causing saturation (the "catastrophic forgetting" analogy). PPSEBM
    fix: progressive parameter selection allocates a fresh parameter slice per new constraint
    category, preventing interference across constraint types.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/extract.py (constraint extraction pattern)
    - python/carnot/verify/ (ConstraintStateMachine, EmbeddingConstraintStore)
    - results/experiment_748_cross_session_memory_10session.json (plateau evidence)
    - results/experiment_761_tier1_constraint_addition.json (session 1 works)

    TASK:
    Implement PPSEBM-inspired progressive parameter selection in EmbeddingConstraintStore:
    1. Add constraint type clustering: TF-IDF cluster centroid tracking per constraint type
    2. When a new constraint arrives whose cluster centroid is > 0.5 cosine distance from
       all existing cluster centroids: create a new parameter group (fresh embedding slice)
    3. Replay: before each session, generate N=5 synthetic replay examples from each
       existing parameter group (using stored centroid embeddings as query anchors)
    4. Run 10-session relay with synthetic CPU model:
       - Session 1-10, 20 questions each
       - Track: templates_added_per_session, cluster_count_per_session, precision_per_session
    5. Target: non-zero templates_added in at least sessions 3-7 (vs zero in Exps 748/761)

    JAX_PLATFORMS=cpu for reproducibility (per CLAUDE.md).

    Write results/experiment_970_ppsebm_tier2_crosssession_memory.json with schema:
      templates_added_per_session: list[int]
      cluster_count_per_session: list[int]
      precision_per_session: list[float]
      sessions_with_new_templates: int
      plateau_broken: bool
      honest_verdict: str

    honest_verdict = "ppsebm_plateau_broken" if sessions_with_new_templates >= 3 (sessions 3+).
    honest_verdict = "ppsebm_plateau_persists" if same as Exp 748 (zero in sessions 2-10).

    Run: python scripts/experiment_970_ppsebm_tier2_crosssession_memory.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: medium
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 45
  prior_failures:
  - experiment_id: exp748-cross-session-memory-10session
    verdict: tier2_memory_plateau_at_s2
    addressed_by: "Root cause: EmbeddingConstraintStore mixes parameters across constraint types. PPSEBM progressive parameter selection allocates fresh parameter groups per new constraint type, preventing interference."
    retire_if_same_verdict: true
  - experiment_id: exp761-tier1-constraint-addition
    verdict: constraint_addition_works
    addressed_by: "Exp 761 proved single-session addition works; Exp 970 extends to cross-session persistence using PPSEBM progressive params."
    retire_if_same_verdict: false

