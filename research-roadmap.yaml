    title: "Exp 281: Apple adversarial GSM8K dataset generator"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: The Apple adversarial GSM8K benchmark (arXiv 2410.05229) is the #1
      carry-forward from milestones 2026.04.18-20. Semantic grounding (Exp 279)
      showed 100% stale-answer detection — and Apple adversarial's number-swap variant
      generates exactly stale errors: a model that memorizes the original answer uses
      original numbers on a swapped question. This is the first benchmark where
      Carnot's current pipeline should achieve high recall.

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_279_adversarial_semantic.py — number-swap template pattern
      - scripts/experiment_119_adversarial_gsm8k.py — existing template library
