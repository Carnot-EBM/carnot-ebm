tasks:
  - id: exp1991-egpu-thunderbolt-rocm-smoke
    title: "Exp 1991: eGPU Thunderbolt RX 7900 XTX ROCm/JAX initialization test"
    deliverable: results/experiment_1991_egpu_rocm.json
    max_turns: 100
    model: opus
    priority: critical
    prompt: |
      CONTEXT: The PRD and research-hardware-wishlist.md mandate live model inference benchmarking. Our eGPU path (RX 7900 XTX via Thunderbolt) is the highest priority hardware unblocker.

      EXISTING CODE TO READ FIRST:
        - research-hardware-wishlist.md

      TASK: Verify if ROCm detects the eGPU and if JAX can initialize the gfx1100 device over Thunderbolt.

      CONCRETE STEPS:
        1. Run `rocminfo` and `python3 -c "import jax; print(jax.devices())"`.
        2. Record the detected hardware and initialization state.
        3. If successful, run a trivial JAX multiplication to verify execution.
        4. Produce artifact with the hardware state and honest_verdict.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.hardware.v1"
        - experiment: 1991
        - honest_verdict: MUST start with terminal prefix.
      
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

