    sampler can appear faster because burn-in, sample thinning, conditional updates, or temporal
    coupling work was counted differently. Temporal coupling can also change the stationary law.
    This audit must independently recompute fidelity and work, then estimate mapping cost against
    existing board receipts without synthesis or physical timing claims.

