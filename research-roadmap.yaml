    2. Add tss_diagnose() function to ContinuousEBM (after existing methods):
    The function should:
    - Accept a list of (question, response, is_correct) triples
    - Compute sign(z) bottleneck activations using sample_exact() or sample()
    - Compute SC-Energy score and Z3 correctness for each triple
    - Return correlation(sc_energy, z3_label), optimal_transversal_k, vulnerability_score

    Minimal implementation (if full implementation fails, use stub):
    python3 -c "
    import sys, json, numpy as np
    sys.path.insert(0, '{project_root}')

    # Load 20 FoVer pairs
    d = json.load(open('results/fover_corpus_v5.json'))
    pairs = d['pairs'][:20]

    # Compute SC-Energy proxy (TF-IDF cosine similarity between question and response)
    from sklearn.feature_extraction.text import TfidfVectorizer
    from sklearn.metrics.pairwise import cosine_similarity

    questions = [p['question'] for p in pairs]
    responses = [p['response'] for p in pairs]
    labels = [int(p['is_correct']) for p in pairs]

    try:
        vec = TfidfVectorizer(max_features=500)
