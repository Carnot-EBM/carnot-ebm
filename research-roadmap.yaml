- id: exp621-metajuls-online-adaptation
  milestone: 2026.04.47
  deliverable: results/experiment_621_metajuls_adaptation.json
  title: 'Exp 621: MetaJuLS Online Adaptation — Meta-RL Constraint Propagation (arXiv 2601.00095)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: MetaJuLS\
    \ (arXiv 2601.00095) learns universal constraint propagation policies that adapt\
    \ across tasks via meta-RL. Applied to Carnot: after LLMAsExtractorV1 processes\
    \ a batch of live outputs, MetaJuLS-style meta-RL updates the extractor's policy\
    \ parameters (prompt temperature, claim confidence threshold, strategy weights)\
    \ based on observed precision/recall — online adaptation without full retraining.\
    \ This is Self-Learning Tier 2 (Constraint Memory) applied to the extractor itself.\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/extraction/llm_extractor_v1.py\
    \ — LLMAsExtractorV1 (policy parameters: temperature, threshold)\n- results/experiment_616_llm_extractor_v1.json\
    \ — best_strategy, v1_recall, gate_open\n- results/experiment_620_live_vr_attempt_15.json\
    \ — VR results with per-question violation/correct labels\n- python/carnot/pipeline/constraint_addition.py\
    \ — ConstraintAdditionFromMemory (examine Tier 1 self-learning structure)\n- research-program.md\
    \ section 'Tier 2: Constraint Memory / Trace2Skill'\n\nTASK: Implement MetaJuLS-style\
    \ online adaptation for LLMAsExtractorV1.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-LEARN-050 (MetaJuLS: extractor policy adapts from live batch feedback),\
    \ REQ-LEARN-051 (MetaJuLS: precision improves monotonically with experience across\
    \ batches), SCENARIO-LEARN-080/081/082 to\
    \ openspec/capabilities/autoresearch/spec.md.\n3. Create python/carnot/pipeline/metajuls_adapter.py:\n\
    \   a. ExtractorPolicy dataclass:\n      temperature: float = 0.1  # LLM sampling temperature\n\
    \      claim_confidence_threshold: float = 0.5  # min confidence to count a claim\n\
    \      strategy_weights: dict[str, float]  # {'json': 0.5, 'symcode': 0.3, 'chain':\
    \ 0.2}\n   b. MetaJuLSAdapter class:\n      __init__(self, initial_policy: ExtractorPolicy\
    \ | None = None):\n        self.policy = initial_policy or ExtractorPolicy(strategy_weights={'json':\
    \ 0.33, 'symcode': 0.33, 'chain': 0.34})\n        self.experience: list[dict]\
    \ = []  # [{batch_id, precision, recall, strategy_used}]\n      update_from_batch(self,\
    \ batch_results: list[dict]) -> ExtractorPolicy:\n        # batch_results: list\
    \ of {response, violation_detected, true_label}\n        tp = sum(r['violation_detected']\
    \ and not r['true_label'] == 'correct' for r in batch_results)\n        fp =\
    \ sum(r['violation_detected'] and r['true_label'] == 'correct' for r in batch_results)\n\
    \        precision = tp / (tp + fp + 1e-9)\n        # Meta-RL update: if precision\
    \ < 0.5, reduce temperature (be more conservative)\n        if precision < 0.5:\n\
    \          self.policy.temperature = max(0.01, self.policy.temperature * 0.9)\n\
    \          self.policy.claim_confidence_threshold = min(0.9, self.policy.claim_confidence_threshold\
    \ * 1.1)\n        elif precision > 0.8:  # high precision, can relax thresholds\n\
    \          self.policy.temperature = min(0.5, self.policy.temperature * 1.05)\n\
    \          self.policy.claim_confidence_threshold = max(0.3, self.policy.claim_confidence_threshold\
    \ * 0.95)\n        self.experience.append({'batch_id': len(self.experience),\
    \ 'precision': precision})\n        return self.policy\n      precision_trend(self)\
    \ -> float:\n        # Slope of precision over last 3 batches. Positive = improving.\n\
    \        if len(self.experience) < 2: return 0.0\n        precisions = [e['precision']\
    \ for e in self.experience[-3:]]\n        return precisions[-1] - precisions[0]\n\
    \   c. Export MetaJuLSAdapter, ExtractorPolicy from carnot.pipeline.\n4. Write\
    \ scripts/experiment_621_metajuls_adaptation.py:\n   a. apply_env_autofix() FIRST.\n\
    \   b. ExperimentTimeoutWatchdog(621, timeout_minutes=25).\n   c. ExperimentTemplate(621,\
    \ 'MetaJuLS Online Adaptation',\n      'results/experiment_621_metajuls_adaptation.json',\
    \ requires_gpu=False).\n   d. Simulate 3 batches using live corpus:\n      batch1\
    \ = first 10 responses from live_pairs_578.json\n      batch2 = next 10 responses\n\
    \      batch3 = next 10 responses (or overlap if corpus too small)\n   e. For\
    \ each batch:\n      adapter.update_from_batch([{'response': r.response,\n   \
    \     'violation_detected': bool(LLMAsExtractorV1(llm_caller=None).extract(r.response)),\n\
    \        'true_label': 'correct' if r.is_correct else 'incorrect'}\n        for\
    \ r in batch])\n   f. Compute: precision_trend = adapter.precision_trend().\n\
    \      adaptation_effective = precision_trend >= 0 (non-decreasing).\n   g. Build\
    \ artifact: schema='carnot.metajuls_adapter.v1',\n      n_batches=3, batch_size=10,\n\
    \      policy_initial=<initial policy dict>, policy_final=<final policy dict>,\n\
    \      precision_per_batch=<list[float]>, precision_trend=<float>,\n      adaptation_effective=<bool>,\n\
    \      honest_verdict='adaptation_effective' if adaptation_effective\n        else\
    \ 'adaptation_not_effective'.\n   h. tmpl.assert_deliverable_written() as FINAL\
    \ LINE.\n5. Write tests/python/test_metajuls_adapter.py (100% coverage).\n6. Run:\
    \ JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile: ops/conductor-log.md\
    \ (Tier 2 self-learning), ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

