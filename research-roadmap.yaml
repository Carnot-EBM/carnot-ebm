  - id: exp4158-verifier-rerank-recovery-moat
    milestone: 2026.06.385
    title: "THE DECISION-GRADE MOAT TEST (decidable at the INTERMEDIATE baseline): an ARBITER-grounded (arXiv:2605.26172) verifier-RERANK RECOVERY test. Snapshot the current baseline checkpoint; HEADROOM PRECHECK (oracle@K > vote@1 -- the positive control that makes a null informative); then rerank K TRM candidates by the EXECUTABLE Sudoku verifier and measure pass@1 lift vs majority vote (bootstrap CI95) AND the count of present-but-out-voted puzzles the verifier RECOVERS. Also record the verifier's per-candidate cost vs an LLM-judge estimate (the EFFICIENCY axis). Informative regardless of whether val reaches 0.85."
    priority: critical
    track: verifier-moat
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-13 planner: the verifier-RERANK arm of the Sudoku moat test, de-confounded to be decision-grade at the INTERMEDIATE baseline -- false-positive scope-match vs retired exp4089/exp4100 + the .380-.384 graft attempts; forward difference = ARBITER-grounded present-but-out-voted recovery with a mandatory headroom positive-control (oracle@K>vote@1), which is MORE informative at a lower baseline and does NOT require val>=0.85 (breaking the 3-milestone block-on-baseline pattern)."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4158_verifier_rerank_recovery_moat.json
    prompt: |
      CONTEXT: This is the result that makes .385 decision-grade on the verifier moat EVEN IF the
      baseline never reaches 0.85. ARBITER (arXiv:2605.26172) shows the correct answer is frequently
      PRESENT-BUT-OUT-VOTED and that internal-signal verifiers "measure self-consistency rather than
      correctness" and DEGRADE the vote. Carnot's EXECUTABLE Sudoku verifier is high-precision and
      ORTHOGONAL to the generator's vote (constraint validity, not generator confidence) -- exactly
      the property ARBITER says an external verifier needs to BEAT self-consistency. A LOWER
      (high-headroom) baseline makes this test MORE informative, not less.

      EXISTING CODE TO READ FIRST:
        - python/carnot/experiment_4109_carnot_verifier_graft_sudoku.py
          (score_sudoku_candidate() = the real executable verifier; sample_checkpoint_candidate_pools()
           = the TRM argmax + (K-1) multinomial decode; evaluate_rerank() = the rerank harness)
        - results/experiment_4157_*.json (current_val, max_val, stable_checkpoint_path)

      CONCRETE STEPS:
        0. PRECONDITIONS: CUDA available; read results/experiment_4157_*.json for stable_checkpoint_path + current_val. SNAPSHOT the checkpoint to a frozen path (`cp last.ckpt last-rerank-snapshot.ckpt`) BEFORE loading, so you never read a half-written file while the live run is checkpointing. Else -> `blocked_<resource>`.
        1. Sample K (>=8) candidates per held-out puzzle (>=64 puzzles) from the snapshot checkpoint via sample_checkpoint_candidate_pools().
        2. HEADROOM PRECHECK (the positive control): compute oracle@K (fraction of puzzles with >=1 exact-valid candidate) and vote@1 (majority-vote exact-accuracy). IF oracle@K <= vote@1 -> headroom_present=false; honest_verdict `complete: no_headroom_rerank_uninformative_at_val_0.NN` (the FALSE_NEGATIVE_RISK guard) and report the numbers WITHOUT claiming a moat result.
        3. IF headroom_present: rerank by the executable verifier; pass@1(rerank) vs vote@1, bootstrap CI95 over puzzles. Count verifier_recovers_outvoted = puzzles where the verifier selects an exact-valid candidate that majority vote missed (ARBITER recovery).
        4. EFFICIENCY axis: record the verifier's mean per-candidate wall-cost (constraint check, microseconds) and a 1-line estimate of an LLM-judge per-candidate cost, as cost_ratio_vs_llm_judge.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A real CI-excl-0 lift, an honest A~=vote null, OR an honest no-headroom report are ALL COMPLETE and decision-grade."
        headroom_present:
          principle: "Bare bool: oracle@K > vote@1. The positive control -- a null is only a moat finding when headroom exists (per the FALSE_NEGATIVE_RISK discipline)."
        oracle_at_k:
          principle: "Fraction of puzzles with >=1 exact-valid candidate; the ceiling the verifier could recover toward."
        vote_at_1:
          principle: "Majority-vote exact-accuracy; the self-consistency baseline the external verifier must beat."
        rerank_lift_vs_vote:
          principle: "pass@1(verifier-rerank) - vote@1, with bootstrap CI95. CI95 excluding 0 = the verifier moat at the rerank level (the .385 decision-grade headline)."
        verifier_recovers_outvoted:
          principle: "Count of present-but-out-voted puzzles the executable verifier recovers (ARBITER framing); the mechanistic evidence the external signal is orthogonal to the vote."
        cost_ratio_vs_llm_judge:
          principle: "The EFFICIENCY axis: the executable verifier is a microsecond forward constraint check vs an LLM-judge call; quantifies the 'parity at 10-100x cheaper' north-star claim cheaply."
        random_seed:
          principle: "Determinism precondition for the bootstrap CI."
      ACCEPTANCE GATE:
        - condition: "headroom_present reported; IF true -> rerank_lift_vs_vote with bootstrap CI95 AND verifier_recovers_outvoted AND cost_ratio_vs_llm_judge; IF false -> honest no_headroom report with oracle_at_k + vote_at_1"
          principle: "Decision-grade at any baseline: a headroom-backed CI-excl-0 lift (moat real), a headroom-backed null (moat absent at rerank), or an honest no-headroom report -- never an uninformative graft on a no-headroom corpus (the .383 mistake)."

      Run command: `python3 python/carnot/experiment_4158_verifier_rerank_recovery_moat.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4159-decisive-verifier-reward-graft
    milestone: 2026.06.385
    title: "THE decisive verifier-as-REWARD GRAFT (DEFENSIVE on val>=0.85). The publishable de-confound that resolves BOTH the moat training-question AND the DiffusionGemma gate. DEFENSIVE read of exp4157: IF val>=0.85, run the Phase-0 precision gate (P(test-gold|demo-perfect)>=0.85) then A=verifier-cert vs B=vote-cert RFT (N-matched, same TRM, resume-train each, held-out exact-accuracy delta, CI95 excl 0). IF val<0.85, DEFER honestly (graft_deferred=true) -- exp4158's rerank recovery carries the .385 moat signal; do NOT graft on a non-faithful baseline (the .383 FALSE_NEGATIVE mistake)."
    priority: high
    track: verifier-as-reward
    max_turns: 110
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-13 planner: THE decisive verifier-as-REWARD graft on a faithful nano-trm baseline -- false-positive scope-match vs retired exp4089/exp4100 + exp4150's deferral; forward difference = built on the contiguous-run baseline (the working fix) + adds the Phase-0 precision gate; remains defensive-deferred until val>=0.85 to avoid the .383 uninformative FALSE_NEGATIVE."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4159_decisive_verifier_reward_graft.json
    prompt: |
      CONTEXT: This is the publishable, de-confounded test of verifier-as-REWARD (the #1 strategic
      pivot: the verifier is a TRAINING reward, not an inference filter). It is the harder, faithful
      sibling of exp4158's rerank test. Its result resolves the moat training-question and the
      DiffusionGemma gate (docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md
      activates ONLY if verifier_value_added==true here).

      EXISTING CODE TO READ FIRST:
        - python/carnot/experiment_4150_decisive_verifier_graft_sudoku.py (the orchestrator; FAITHFUL_VAL_THRESHOLD=0.85; build_matched_corpora + evaluate_label_arms + bootstrap CI95)
        - python/carnot/experiment_4109_carnot_verifier_graft_sudoku.py (the verifier + decode + RFT arms)
        - results/experiment_4157_*.json (current_val, stable_checkpoint_path)

      CONCRETE STEPS:
        0. PRECONDITIONS: CUDA available; read results/experiment_4157_*.json for current_val + stable_checkpoint_path. Snapshot the checkpoint before loading.
        1. BRANCH:
           IF current_val>=0.85 (faithful):
             - Phase-0 precision gate: estimate P(test-gold | demo-perfect) on the verifier-certified corpus; require >=0.85, else report phase0_precision and DEFER (label noise too high to attribute a training delta).
             - RFT de-confound: A=verifier-certified vs B=vote-certified corpus, N-matched, same TRM init; resume-train each bounded (contiguous-style, NOT the bounded-pass chain); held-out exact-accuracy. LOAD-BEARING contrast A vs B, CI95 excl 0.
           ELSE: DEFER. graft_deferred=true + current_val + estimated_passes_to_converge for .386. Do NOT graft on a non-faithful baseline.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An honest deferral, an A>B win, or an A~=B null are ALL COMPLETE; an uninformative graft on a non-faithful baseline is the .383 anti-pattern."
        graft_deferred:
          principle: "Bare bool: True if val<0.85 -> deferred. Prevents the uninformative no-headroom false-negative .383/.384 produced."
        phase0_precision:
          principle: "P(test-gold | demo-perfect) on the verifier-certified corpus; the precondition that a verifier label means correctness, not just demo-fit (per the verifier-as-reward discipline)."
        rft_vs_ablation_delta:
          principle: "The de-confounded A-vs-B held-out delta with CI95 (if grafted): isolates the verifier LABEL's training contribution -- THE moat-at-training measurement."
        verifier_value_added:
          principle: "Bare bool: did verifier-cert RFT beat vote-cert RFT (CI95 excl 0)? The headline answer, ONLY meaningful when graft_deferred is False. Also the DiffusionGemma gate input."
        preconditions_checked:
          principle: "Records the baseline checkpoint + CUDA verified."
      ACCEPTANCE GATE:
        - condition: "graft_deferred True with current_val (if val<0.85), OR a real graft with phase0_precision + rft_vs_ablation_delta (CI95) + verifier_value_added"
          principle: "Either an honest deferral or a real, precision-gated, de-confounded graft -- an uninformative graft on a non-faithful baseline is forbidden (the .383 mistake)."

      Run command: `python3 python/carnot/experiment_4159_decisive_verifier_reward_graft.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

