- id: exp736-psv-specialization-diagnosis
  milestone: 2026.04.56
  deliverable: results/experiment_736_psv_specialization.json
  title: 'Exp 736: PSV Constraint Specialization Diagnosis (3rd consecutive degradation, pool exhaustion ruled out)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: PSV (Propose-Solve-Verify) self-play has degraded for 3 consecutive milestones.
    - .53: PSV fp_rate_slope = baseline (stable)
    - .54: PSV fp_rate_slope > 0 (degrading, first time)
    - .55 Exp 722: pool exhaustion hypothesis — RULED OUT. Condition B (rotating pool)
      slope=+0.007, WORSE than condition A (static pool). The fix made things worse.
    - .55 Exp 723: PSV pCore v2 — GATED BLOCKED (depended on Exp 722 gate, which was fail).

    New hypothesis: CONSTRAINT SPECIALIZATION. The PSV verifier overfits to arithmetic
    error patterns in GSM8K (the primary training domain), losing the ability to detect
    violations in other domains. When evaluated on held-out questions from different
    distributions, detection degrades. The mechanism: PSV self-play uses GSM8K questions
    exclusively, and the ConstraintTemplateLibrary fills up with arithmetic-specific templates.
    Cross-domain evaluation then shows increasing FP rate.

    Alternative hypothesis: GRADIENT INTERFERENCE. Different constraint types (arithmetic
    vs. logical vs. planning) produce conflicting weight updates in the shared constraint
    verifier, causing oscillation rather than improvement.

    This experiment tests both hypotheses with controlled conditions.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/psv_runner.py (or equivalent) — PSV self-play runner.
    - python/carnot/pipeline/constraint_template_library.py — ConstraintTemplateLibrary.
    - results/experiment_722_psv_pool_exhaustion.json — pool exhaustion diagnosis
      (condition_b_slope=0.007, pool exhaustion NOT confirmed).
    - results/experiment_680_psv_pcore_v1.json (or latest PSV baseline) — fp_rate_slope
      baseline.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Run 3-condition PSV experiment. Test constraint specialization and gradient
    interference hypotheses. Write gate file for Exp 737.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-PSV-010 (PSV diagnosis experiment MUST test at least 2 alternative root
       cause hypotheses before proposing a fix; hypotheses must be falsifiable),
       REQ-PSV-011 (PSV verifier training data MUST include at least 3 distinct question
       domains to prevent constraint specialization),
       SCENARIO-PSV-010/011 to openspec/capabilities/verification/spec.md.
    3. Design 3 controlled conditions (20 iterations each):
       a. Condition A (control): PSV with GSM8K only — current behavior.
          Use GSM8K questions 200-219 (held out from all prior training).
          Measure: fp_rate_trend_slope over 20 iterations.
       b. Condition B (domain diversity): PSV with rotating domain pool —
          GSM8K (10q) + MATH-Algebra (5q) + ARC-Challenge (5q) per iteration.
          Same iteration count as A. Measure fp_rate_trend_slope.
       c. Condition C (domain-generic verifier): PSV with GSM8K inputs, BUT verifier
          trained on FoVer v2 ALL-domain labels (not GSM8K-specialized).
          Measure fp_rate_trend_slope on HELD-OUT GSM8K questions 100-199.
    4. Implement condition changes in PSV runner (if needed):
       a. For condition B: add domain_pool parameter to PSVRunner (list of question loaders).
       b. For condition C: add verifier_weights parameter to load domain-generic weights.
          If no domain-generic weights exist: train a mini-EBM on mixed FoVer v2 subset
          (200 examples, 3 domains) as a proxy domain-generic verifier.
    5. Create scripts/experiment_736_psv_specialization.py:
       a. ExperimentTemplate(736) + ExperimentTimeoutWatchdog(736, timeout_minutes=60).
       b. Run conditions A, B, C. Collect fp_rate per iteration.
       c. Compute fp_rate_slope per condition (linear regression over 20 iterations).
       d. Gate logic:
          - "pass" if condition_b_slope < condition_a_slope → domain diversity helps.
            Write results/psv_specialization_gate.json {"gate": "pass",
            "root_cause": "constraint_specialization", "fix": "domain_diversity"}.
          - "pass_verifier" if condition_c_slope < condition_a_slope → verifier
            generalization helps. Write gate {"gate": "pass",
            "root_cause": "constraint_specialization_verifier",
            "fix": "domain_generic_verifier"}.
          - "fail" if both B and C worse than A → specialization not root cause.
            Write gate {"gate": "fail", "root_cause": "unknown"}.
       e. honest_verdict:
          - "psv_specialization_confirmed" if gate == "pass" or "pass_verifier"
          - "psv_specialization_not_root_cause" if gate == "fail"
       f. artifact: condition_a_slope, condition_b_slope, condition_c_slope,
          gate_written, root_cause_hypothesis, honest_verdict.
    6. Write tests/python/test_experiment_736_psv_specialization.py with 100% coverage:
       - test domain_pool parameter routes questions correctly to domains.
       - test fp_rate_slope computed correctly from iteration series.
       - test gate file written with correct root_cause field.
       Each test traces to REQ-PSV-010/011.
    7. Reconcile:
       - ops/status.md: add PSV specialization result. If gate fail: add note
         "PSV root cause STILL unknown after 2 hypotheses ruled out. New hypothesis needed."
       - ops/changelog.md: one-line with honest_verdict.
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

