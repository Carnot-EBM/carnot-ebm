# - PolarFire SoC Discovery Kit: BOOTED on RISC-V Linux, SSH-accessible
#   at `ssh polarfire` (mpfs-disco-kit.local / 192.168.51.197). 4× U54 cores,
#   545MiB RAM, Python 3.12.12, 111GB free rootfs. First-ever physical
#   sovereignty-anchor platform for Carnot's verifier ensemble.
# - GateMate A1-EVB-2M: JTAG-accessible via onboard RP2040 + DirtyJTAG.
#   `openFPGALoader -c dirtyJtag -b olimex_gatemateevb --detect` confirms
#   IDCODE 0x20000001 (CC GM1Ax, family GateMate Series). RTL synth works
#   (rtl/gatemate_ising_n16.v ~136 cells); place-and-route blocked on
#   yosys-vs-nextpnr-himbaechel CC_LUT3 mapping mismatch — addressable.
# - Carry-forwards still live: THRML parity v2 (exp1850 corrigendum) +
#   Phase 4 active inference (exp1849 + exp1165).
# - GEMINI_FORCE_EXPERIMENTS=1 is active until codex quota resets
