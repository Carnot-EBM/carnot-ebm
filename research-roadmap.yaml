    - research-hardware-wishlist.md — KV260 FPGA status (blocked on bitfile)\n\
    - scripts/experiment_template.py — ExperimentTemplate\n\nTASK: Implement\
    \ PottsMachineVerifier with q=3 states and Gibbs sampler.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-VERIFY-106 (PottsMachineVerifier: q-state constraint encoding),\
    \ REQ-VERIFY-107 (q=3 Gibbs sampler: each spin updated over (0,1,2)),\
