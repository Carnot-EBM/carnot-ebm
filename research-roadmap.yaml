milestone: 2026.06.422
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-21) -- the .421 capstone (exp4566) is a near-total honest
  null: the verifier-router HEADLINE (A1) nulled with a FAILED positive control (random_router_control_passed
  =false), the 4th re-induction attempt (A2) failed its positive control a 4th time -> the re-induction lever
  is RETIRED, A3/A4 banked 0 new levels, and the A6 transfer null exposed the ROOT CAUSE: a verifier that
  RE-RANKS a fixed candidate pool has ordering_gain=0 because the WINNING CANDIDATE IS NEVER IN THE POOL. The
  plateau is structural: core_efficiency 2.0074 for FOUR milestones (.418-.421), generic_transfer 0.04,
  reproducible_total_levels 52. .422 PIVOTS to ACTION EFFICIENCY -- the operator-flagged #1 score lever
  (2026-06-20 leaderboard dive: the leader StochasticGoose/Tufa 12.58% wins on a CNN action-effect/clickability
  predictor). The blocker is cleared: the 14.6k human-replay corpus + the 14.6k self-captured transition corpus
  are now LOCAL (exp4490 was blocked_corpus_not_cached). The outer-loop's pretrain-prior USED this data but
  aimed at the WRONG target (exact next-cell DYNAMICS, 0% acc both scratch+warm); .422 re-aims at the COARSE
  clickability target + the actions-to-first-levelup metric (A1), and uses the oracle-distinct verifier as a
  FRONTIER-EXPANSION priority so the winner is GENERATED not just re-ranked (A2, fixes the A6 root cause).
milestone_title: ACTION EFFICIENCY -- ship the leaderboard's #1 lever (CNN clickability/action-effect predictor) re-aimed at actions-to-first-levelup + verifier-guided candidate EXPANSION
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  THE BOTTLENECK IS CANDIDATE GENERATION, NOT RANKING. The .421 verifier-router nulled because re-ranking a
  fixed pool adds 0 value when the winning candidate is never in the pool (A6 ordering_gain=0). The lever is
  the GENERATOR. .422 HEADLINE (A1): the leaderboard's #1 technique -- a CNN clickability/action-effect
  predictor predict(frame)->(click_heatmap, directional_change) trained on the now-LOCAL 14.6k human-replay +
  transition corpora, wired into rich_action_candidates to RANK by predicted frame-change; measured by
  median actions-to-first-levelup vs blind BFS (the action-efficiency scoring lever min(human/agent,1)^2),
  verifier_is_oracle: false. A2: the oracle-distinct cross-game DiscriminativeVerifier (LOO-AUROC 0.674) as a
  FRONTIER-EXPANSION priority that GROWS the search toward the goal (fixes the winner-not-in-pool root cause).
  A1 re-aims the target the outer-loop pretrain-prior got wrong (clickability, not the 0% exact-dynamics
  target). Plus the level-up bank (A3, guarantee), single-game hidden-field probe (A4, gate-first), integration
  (A5), self-learning persist+transfer (A6), 2 infra (B1 action-efficiency co-headline metric / B2 learned-CNN
  substrate guard), 1 hardware (C), 1 SOTA-ingestion (D), capstone (E).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC; >=1
  level-up attempt (ARC Level-Up Attempt Guarantee, A3); 2 reserved infra (B1/B2); 1 per-board hardware (C);
  1 SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus."

