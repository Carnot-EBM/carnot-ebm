  - id: exp6310-v544-terminal-transition
    milestone: "2026.08.544"
    deliverable: results/experiment_6310_v544_terminal_transition.json
    title: "Exact terminal-boundary handoff from V543 into V544"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 45
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6309-v543-adversarial-capstone
        verdict: "complete: V543 capstone preserved exact artifact states; shared-state and licensed-transfer branches blocked; ARC route audit ready with no solve claim"
        addressed_by: "The V544 handoff consumes that terminal classification, closes the shared-state and licensed-transfer branches, and validates a different 13-task model-local and governed-learning roadmap."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 2026.08.543 is terminal. Exp6301 rejected the shared activation bus with readiness 0.0. Exp6302 repeated a blocked initializer gate, Exp6303 is missing, and Exp6305 repeated a blocked licensed-transfer gate. Exp6304 and Exp6306 are positive same-domain learning and safety results. Exp6307 and Exp6308 are ready route audits with no solve claim. Exp6309 preserves every state. V544 reserves Exp6310-Exp6322 and must not reactivate any retired branch.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md
      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6309_v543_adversarial_capstone.json
      - {project_root}/results/experiment_6301_activation_bus_integrity_audit.json
      - {project_root}/results/experiment_6304_reference_anchored_online_state_learning.json
      - {project_root}/results/experiment_6307_arc_target_validated_route_canary.json
      - {project_root}/results/experiment_6308_arc_target_validated_route_holdout.json
      - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md, and {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/exclusion_manifest_lint.py

      TASK
      Create an exact V543-to-V544 handoff. Classify every V543 declared artifact under current terminal and adversarial rules. Validate the staged V544 IDs, deliverables, dependencies, structured gates, prior-failure entries, Codex routing, model policy, prompt contracts, and protected files. Confirm that the roadmap contains 13 tasks in Exp6310-Exp6322 order and does not depend on a retired experiment. Do not activate research-roadmap-next.yaml and do not edit research-roadmap.yaml.

      Required deliverable: {project_root}/results/experiment_6310_v544_terminal_transition.json.
      REQUIRED ARTIFACT FIELDS: status, v543_roadmap_path_and_hash, v543_task_terminal_matrix, v543_capstone_path_hash_and_summary, operational_retro_path_hash_and_summary, missing_nonterminal_blocked_skipped_null_flagged_retired_ready_and_positive_counts, v544_roadmap_path_and_hash, v544_task_ids_and_deliverables, task_count, phase_counts, dependency_validation, gated_on_validation, prior_failure_validation, retired_dependency_count, id_collision_count, agent_routing_validation, model_policy_validation, prompt_contract_validation, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. task_count must be bare 13. retired_dependency_count and id_collision_count must be bare 0. honest_verdict must begin with a terminal prefix. field_principles must cover every required field.

      CONCRETE STEPS
      0. Record git status, input hashes, staged-roadmap identity, reserved-ID scan, active-roadmap hash, and protected-file hashes.
      1. Add REQ-INFRA-6310 and scenarios to openspec/capabilities/research-harnesses/spec.md before implementation. Update _bmad/traceability.md.
      2. Classify all V543 deliverables with python/carnot/terminal_artifacts.py. Preserve exact missing, flagged, null, skipped, blocked, safety-only, shadow-only, and ready states.
      3. Validate all 13 tasks, deliverable paths, same-milestone dependencies, structured gate fields, and prior_failures subfields.
      4. Prove the shared bus, shared-state initializer, licensed cross-family transfer, external text scorer, KAN, and unchanged hardware probes are not scheduled.
      5. Validate agent_type=codex and model=gpt-5.5 for every task. Validate the three mandated GGUF identities in every prompt that needs an LLM.
      6. Run schema, gate, exclusion, prompt-ending, collision, protected-file, and root-clutter checks. Record focused and broad validation separately.
      7. Adversarial-verify the artifact and preserve honest failures without rewriting the staged or active roadmap.

      Run command: .venv/bin/python -m carnot.experiment_6310_v544_terminal_transition --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6311-v544-post-marker-source-scope-freeze
    milestone: "2026.08.544"
    deliverable: results/experiment_6311_v544_post_marker_source_scope_freeze.json
    title: "Post-marker SOTA receipt and executable V544 scope freeze"
    priority: critical
    track: sota_refresh
    requires_gpu: false
    max_turns: 20
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6310-v544-terminal-transition
    prior_failures:
      - experiment_id: exp6299-v543-post-marker-source-scope-freeze
        verdict: "complete_null: accepted_count=0; no reproducible post-V543-marker findings; references unchanged; V543 contracts frozen"
        addressed_by: "This version scans strictly after the V544 marker and freezes a new model-local probe, versioned same-domain learning, protected-validation, and ARC shadow contract informed by newly indexed 2026-08-10 papers."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The planner already added the V544 literature refresh before this roadmap was designed. This task checks only work published or materially updated after the V544 marker and converts the planner's source set into an immutable execution contract. Zero accepted new findings is a valid terminal result. Source claims are hypotheses until local artifacts reproduce them.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md V544 planner refresh and its terminal marker
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6299_v543_post_marker_source_scope_freeze.json
      - {project_root}/results/experiment_6310_v544_terminal_transition.json
      - {project_root}/ops/exclusion_manifest.yaml and {project_root}/research-hardware-wishlist.md
      - {project_root}/scripts/experiment_template.py

      TASK
      Search arXiv first, then OpenReview, Hugging Face Papers, Semantic Scholar citation routes for EBT and ARM-EBM, Extropic, Logical Intelligence, and GitHub for work after the V544 planner marker. Record accepted, duplicate, watch-only, inaccessible, and excluded sources. Freeze the V544 model-local state surface, exact code-pair fixture, per-model energy, same-domain versioned learner, protected validation, ARC no-solve, and no-hardware-claim contracts. Do not widen V544 from new search results without a source receipt and explicit scope-delta record.

      Required deliverable: {project_root}/results/experiment_6311_v544_post_marker_source_scope_freeze.json.
      REQUIRED ARTIFACT FIELDS: status, v544_marker_text_and_line, search_window_start_utc, search_completed_utc, source_queries_by_channel, source_receipts, accepted_findings, accepted_count, duplicate_findings, watch_only_findings, inaccessible_sources, excluded_findings_and_reasons, semantic_scholar_ebt_and_arm_ebm_receipts, extropic_status, logical_intelligence_status, github_status, frozen_model_local_surface_contract, frozen_exact_pair_fixture_contract, frozen_model_local_energy_contract, frozen_versioned_learning_contract, frozen_protected_validation_contract, frozen_arc_shadow_no_solve_contract, frozen_hardware_exclusions, roadmap_scope_delta, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. accepted_count must be a bare integer. A zero-source delta must end complete_null, not remain nonterminal. field_principles must cover every required field.

      CONCRETE STEPS
      0. Hash the V544 marker, roadmap, reference file, active exclusion manifest, and protected files. Record UTC boundaries before searching.
      1. Add REQ-INFRA-6311 and scenarios before implementation. Update traceability.
      2. Search every required source channel and store direct URLs, query timestamps, dates, and disposition reasons.
      3. Deduplicate against all earlier planner markers. Do not promote a repeated title or a source without a local executable consequence.
      4. Freeze every branch contract and name all excluded retired mechanisms explicitly.
      5. Write accepted findings to research-references.md only if they are genuinely post-marker and promising. Preserve zero accepted findings honestly.
      6. Add deterministic tests for marker parsing, time windows, deduplication, zero-delta terminality, and scope hashes.
      7. Run focused checks, applicable e2e checks, and adversarial verification.

      Run command: .venv/bin/python -m carnot.experiment_6311_v544_post_marker_source_scope_freeze --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6312-model-local-representation-surface-preflight
    milestone: "2026.08.544"
    deliverable: results/experiment_6312_model_local_representation_surface_preflight.json
    title: "Three-family model-local representation surface preflight"
    priority: critical
    track: infrastructure
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 180
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6310-v544-terminal-transition
      - exp6311-v544-post-marker-source-scope-freeze
    prior_failures:
      - experiment_id: exp5853-paired-embedding-integrity-audit
        verdict: "disqualified: claim_flip_direction_cell_failure,disaggregated_cell_failure,label_or_pair_permutation_survives,norm_only_or_length_control_failure,raw_model_dimension_identity_shortcut"
        addressed_by: "The preflight does not reuse a raw final-pooled shared representation; it qualifies a separate native surface for each model and tests a hidden-state surface or preregistered output-free prefix trajectory on causal micro-pairs before corpus construction."
        retire_if_same_verdict: true
      - experiment_id: exp6300-three-family-universal-activation-bus
        verdict: "complete: shared activation bus ready on held folds without model identity leakage"
        addressed_by: "The V543 bus was later invalidated by Exp6301; V544 forbids shared adapters and cross-model alignment and records one independent surface receipt per model."
        retire_if_same_verdict: true
      - experiment_id: exp6301-activation-bus-integrity-audit
        verdict: "flagged: claim_flip_direction_cell_failure,disaggregated_cell_failure,evaluator_swap_disagreement,norm_only_shortcut,pair_swap_shortcut"
        addressed_by: "Every failed Exp6301 control is now a precondition on small causal cells, and any failed model closes the expensive corpus branch instead of being rescued by a pooled bus score."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V543 proved that an apparently ready shared activation bus can still fail causal controls. V544 changes the mechanism to one native representation surface per model. Activation Probes arXiv:2608.09643 motivates the direction but does not prove that the local GGUF runtime exposes the needed tensors. This task must fail fast before the expensive corpus. It may terminate complete_null with readiness 0.0.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py and cached_sota_pair() guidance
      - {project_root}/research-references.md V544 Activation Probes entry
      - {project_root}/results/experiment_5852_three_family_paired_embeddings.json
      - {project_root}/results/experiment_5853_paired_embedding_integrity_audit.json
      - {project_root}/results/experiment_6300_three_family_universal_activation_bus.json
      - {project_root}/results/experiment_6301_activation_bus_integrity_audit.json
      - {project_root}/python/carnot/experiment_5852_three_family_paired_embeddings.py
      - {project_root}/python/carnot/pipeline/gemma4_quantized_loader.py
      - {project_root}/openspec/capabilities/llm-ebm-inference/spec.md and {project_root}/ops/e2e-test-plan.md

      TASK
      Qualify one reproducible native representation surface for each mandated model: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. MODEL_SPECS must include all three with local file paths, hashes, revisions, quantizations, context, tokenizer, CUDA placement, and headline eligibility. Prefer a true hidden-state surface only if the installed runtime exposes it with tensor provenance. Otherwise use the preregistered output-free prefix-state trajectory built from repeated deterministic embeddings. Do not generate answers. Test causal vulnerable/fixed micro-pairs plus A/A, claim-flip, pair-swap, label-permutation, evaluator-swap, norm, length, truncation, duplicate, and model-identity controls. No cross-model adapter or pooled rescue is allowed.

