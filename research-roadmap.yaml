- id: exp815-vg-search-energy-scheduling
  milestone: 2026.04.62
  deliverable: results/experiment_815_vg_search_scheduling.json
  title: 'Exp 815: Variable Granularity Energy Scheduling (arXiv 2505.11730) — Reduce Ising Calls'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2505.11730 (Variable Granularity Search) shows that optimal verification
    frequency depends on question difficulty: high-uncertainty questions need frequent checks;
    low-uncertainty questions can skip expensive verification. Applied to Carnot: track rolling
    energy variance (last N checks on the current response). If variance < threshold, skip the
    current tier and fast-path to next. If variance > threshold, run full tier check.
    This reduces Ising calls without accuracy degradation and complements MARS (which skips
    based on LLM logit margin rather than energy history).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline (Exp 360)
    - python/carnot/pipeline/mars_margin_gate.py — MARSMarginGate (Exp 796)
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
    - openspec/capabilities/verifiable-reasoning/spec.md — REQ-VERIFY entries

    TASK: Implement VGSearchScheduler in ThreeTierPipeline, test on 50 synthetic responses.
    Write results/experiment_815_vg_search_scheduling.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/verifiable-reasoning/spec.md:
       - REQ-VERIFY-097: VGSearchScheduler MUST track rolling energy variance (last N=3 checks)
         per session. If variance < variance_threshold, the scheduler MUST skip the current
         tier's expensive computation and fast-path to the next tier or return early.
       - REQ-VERIFY-098: VGSearchScheduler MUST report ising_calls_saved (count of skipped
         Ising verification calls) and accuracy_delta (accuracy with vs without scheduling).
       - SCENARIO-VERIFY-130: 50 responses; 35 have variance < threshold (low uncertainty);
         35 are skipped; ising_calls_saved=35; accuracy_delta <= 0.01 (at most 1% drop).
    3. Implement python/carnot/pipeline/vg_search_scheduler.py:
       a. VGScheduleResult dataclass:
          (should_run_tier: bool, energy_variance, variance_threshold,
           skip_reason: str, honest_verdict)
       b. VGSearchScheduler:
          - __init__(variance_threshold: float = 0.05, window_size: int = 3):
            self._energy_history: list[float] = []
          - update(energy: float):
            self._energy_history.append(energy)
            if len > window_size: self._energy_history.pop(0)
          - should_skip() -> VGScheduleResult:
            if len(self._energy_history) < window_size:
              return VGScheduleResult(should_run_tier=True, ..., skip_reason="insufficient_history")
            variance = np.var(self._energy_history)
            if variance < variance_threshold:
              return VGScheduleResult(should_run_tier=False, skip_reason="low_variance_skip")
            return VGScheduleResult(should_run_tier=True, skip_reason="high_variance_run")
          - reset(): self._energy_history = []
       c. Wire into ThreeTierPipeline (ADDITIVE): add optional param
          vg_scheduler: VGSearchScheduler | None = None. If set, call should_skip() before
          each tier. If should_run_tier=False: skip tier, return early with previous energy.
       d. Export VGSearchScheduler, VGScheduleResult from carnot.pipeline.__init__
    4. Create scripts/experiment_815_vg_search_scheduling.py:
       a. ExperimentTemplate(815) + ExperimentTimeoutWatchdog(815, timeout_minutes=30).
       b. apply_env_autofix() FIRST.
       c. Generate 50 synthetic responses: 25 high-variance (random arithmetic, noisy energies)
          and 25 low-variance (consistent correct arithmetic, stable energies).
       d. Run ThreeTierPipeline with VGSearchScheduler vs without.
       e. Measure: ising_calls_saved, accuracy_delta, skip_rate.
       f. honest_verdict:
          - "vg_search_effective" if ising_calls_saved >= 20 AND accuracy_delta <= 0.01
          - "vg_search_partial" if ising_calls_saved >= 10 AND accuracy_delta <= 0.02
          - "vg_search_no_savings" if ising_calls_saved < 10
    5. Write tests with 100% coverage:
       - test should_skip returns True after N low-variance energies
       - test should_skip returns False when insufficient history
       - test ThreeTierPipeline with vg_scheduler is ADDITIVE
       Each test traces to REQ-VERIFY-097/098.
    6. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict and ising_calls_saved.
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

