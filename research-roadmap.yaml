milestone: 2026.06.393
milestone_title: "LAND THE ARC ORACLE-DISTINCT WIN -- .392 PROVED the oracle-distinct verifier BEATS vote on CODE (a LEARNED, NON-executing pass-predictor: predictor@1-vote@1 = +0.03125, bootstrap CI95 [0.00625, 0.0625] EXCLUDES 0, oracle@K 0.9625, off-fold AUROC 0.974, n=160, verifier_is_oracle=false -- the FIRST oracle-distinct win) but TIED on ARC (aggregator@1-vote@1 = 0.0, CI95 [0,0], n=52 held-out, oracle@K 0.365 so HEADROOM EXISTS) because the ARC candidate pool had only 20 positive/correct candidates across 28419 (base-rate 0.0007) -- the .392 capstone's disambiguation_read is ARC_NULL_IS_DATA_SPARSITY, NOT a thesis bound. .393 is DEPTH on the headline: A1 GROW the ARC pool toward >=40 wrong-majority held-out tasks + many more minority-correct positives (the data-sparsity fix the .392 SOTA-ingestion flagged: bigger_arc_pool_full_set_encoder_agglm_aggregator_v393); A2 train the FULL permutation-invariant SET-ENCODER cross-candidate aggregator (Set-Encoder 2404.06912, the architecture the .392 augmented-logistic form LACKED) with the calibrated imbalance-aware loss; A3 RE-TEST the decisive beats-vote gate at power -- THE HEADLINE (a first ARC oracle-distinct win closes GAP-3-ties-vote on the north-star domain and justifies activating the gated DiffusionGemma bet). A4 CONFIRM the code win generalizes on a SECOND balanced corpus. PHASE B FINISHES the owed verifier-as-reward pivot the RIGHT way: RETIRE the live-LoRA path (6th infra failure -- exp4234 blocked_lora_training_cannot_run_in_window, accumulate-floor met) and pivot to an OFFLINE reward-weighted form that FITS THE WINDOW (the de-confounded A-vs-B label-carries-signal test on the intact A/B/C corpora). PHASE C: monotonic ARC +1 (->19) + the live-env accuracy probe. PHASE D: SOTA-ingestion + registry/gaps hygiene + hardware continuity + capstone."
milestone_doc: openspec/change-proposals/research-roadmap-v393.md
milestone_overview: |
  .392 delivered the program's FIRST genuine oracle-distinct win and a clean diagnosis of where the
  frontier is reachable. The headline read (exp4241 capstone, headline_outcome
  oracle_distinct_arc_null_is_data_sparsity_code_wins):
    - CODE WON. A LEARNED pass/fail predictor scoring cached code candidates with ZERO test execution at
      inference (verifier_is_oracle=false; the hidden-test label is the TRAINING target only) BEAT majority
      vote: predictor@1 0.95 vs vote@1 0.91875, delta +0.03125, bootstrap CI95 [0.00625, 0.0625] EXCLUDES 0,
      matched-control delta +0.00625, oracle@K 0.9625, off-fold AUROC 0.974, n=160. adversarial_verify clean
      (no CIRCULAR_MOAT_OVERCLAIM). This is the first non-circular verifier-beats-vote result -- small but real.
    - ARC TIED AT POWER, diagnosed DATA-SPARSITY. The cross-candidate aggregator (exp4231/exp4232) tied vote
      on a held-out ARC split (aggregator@1 0.1923 == vote@1 0.1923, delta 0.0, CI95 [0,0], n=52); the
      margin-triggered override also tied (0.0). BUT oracle@K 0.365 (oracle_minus_vote 0.173) so the correct
      answer is PRESENT in 36% of tasks -- the headroom exists, vote just can't reach it. The reason the
      learned aggregator could not either: the pool had only 20 ACCEPTED (correct) candidates across 28419
      (base-rate 0.0007), wrong_majority_n collapsed to 0-9. The code win at power (balanced ~0.6 pass-rate)
      proves the oracle-distinct selection thesis is NOT bounded -- so the ARC null is a DATA problem, not a
      method problem (disambiguation_read = ARC_null_is_data_sparsity).
    - SOTA-ingestion flagged the .393 direction explicitly (exp4238): bigger_arc_pool_full_set_encoder_agglm_
      aggregator_v393 -- grow the ARC pool with minority-correct evidence AND replace the augmented-logistic
      reranker with a full permutation-invariant Set-Encoder (2404.06912) cross-candidate attention model.
    - verifier-as-reward (FR-11 self-learning) is STILL OWED and STILL STUCK ON INFRA. The live-LoRA harness
      failed for the 6th time (exp4234 blocked_lora_training_cannot_run_in_window, flagged-skipped); exp4235
      gate-blocked at the conductor pre-gate; live_lora_retired stayed FALSE (the auto-retire never fired
      because B2 never ran). The operator's accumulate-floor (3 consecutive no-usable windows) is long since
      met. The .392 roadmap itself prescribed the fix: re-scope to an OFFLINE reward-weighted form for .393.
    - ARC north star: 18 levels / 13 games (+1, exp4236); live-env solver reachable, completed 0 levels,
      beat the random floor on EFFICIENCY only (exp4237).
    - Hardware: KV260 terminal (SSH-only, opportunistic); PolarFire hash-verified CPU dispatch; GateMate
      unreachable (blocked).

  .393 is DEPTH, not churn. It does ONE thing on the headline -- LAND the ARC oracle-distinct win by fixing
  the SINGLE diagnosed cause (data-sparsity) with the SINGLE flagged method (full Set-Encoder on a grown
  pool) and re-testing the SAME decisive gate at power -- and FINISHES the owed verifier-as-reward pivot the
  disciplined way (retire the dead live-LoRA path, pivot to the offline form that fits the window).

    PHASE A -- THE ORACLE-DISTINCT ARC HEADLINE (fix data-sparsity + full set-encoder + re-test at power):
      A1 (exp4243) GROW the labeled ARC candidate pool: assemble the maximal cached pool (all GAP-4 stage2
        games + induced programs + the existing 28419) and, if positives remain < target, a BOUNDED candidate
        top-up via the cached explore-induce-verify solver, toward >=40 wrong-majority held-out tasks and many
        more minority-correct positives. Report arc_pool_grown + positive_candidate_n + wrong_majority_n.
      A2 (exp4244, gated_on A1 arc_pool_grown) TRAIN the FULL permutation-invariant SET-ENCODER cross-candidate
        aggregator (2404.06912) with the calibrated imbalance-aware loss (2509.19681), out-of-fold,
        verifier_is_oracle=false; ABLATE it against the .392 augmented-logistic aggregator on the same split.
      A3 (exp4245, gated_on A2 aggregator_trained) THE HEADLINE GATE: does the Set-Encoder aggregator BEAT
        vote off-oracle on a held-out ARC split at power (target N>=40) vs vote vs matched control vs
        margin-triggered override vs oracle@K, bootstrap CI95-excl-0, verifier_is_oracle=false.
      A4 (exp4246, independent) CONFIRM the .392 code win generalizes: the SAME learned no-execution
        pass-predictor on a SECOND balanced code corpus (MBPP/EvalPlus cached pool), beats-vote at power.
    PHASE B -- OWED verifier-as-reward / self-learning (FR-11): RETIRE live-LoRA, PIVOT to OFFLINE reward-weighting:
      B1 (exp4247) RETIRE the live-LoRA path (live_lora_retired=true; 6th failure + accumulate-floor met) and
        SMOKE the OFFLINE reward-weighted SFT harness: a positive control that PROVES real training in-window
        (>=20 real optimizer steps + loss moved + plausible duration) on a small NON-Qwen base over the intact
        A/B/C corpora. harness_smoke_passed BARE bool.
      B2 (exp4248, gated_on B1 harness_smoke_passed) the de-confounded OFFLINE A-vs-B-vs-C gate: offline
        reward-weighted SFT on (A) verifier-certified, (B) random-label ablation, (C) gold corpora; held-out
        pass@1; THE GATE A vs B (CI excl 0 = the verifier LABEL carries training signal beyond distillation);
        gold-control (C>=base) + truncation guard (<5%). verifier_is_oracle=true (HONEST reward axis).
    PHASE C -- ARC NORTH STAR: C1 (exp4249) monotonic ARC +1 (total_levels>=19); C2 (exp4250) the live-env
      ACCURACY probe targeting a level completion with the strengthened verifier routing, NO leaderboard submission.
    PHASE D -- reserved: D1 (exp4251) SOTA-ingestion (Set-Encoder / offline-RFT track), D2 (exp4252)
      registry+gaps hygiene (GAP-4 regression guard + record .393 outcomes), D3 (exp4253) hardware continuity,
      D4 (exp4254) capstone .393.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227, SIGTERM'd) and the conductor stays
  stood-down. NO task may launch TRM training, run pkill/kill against train.py, or WRITE
  results/trm_runs/sudoku_extreme_baseline/. Phase B trains a SEPARATE small NON-Qwen base via OFFLINE
  reward-weighted LoRA-SFT on the RTX 3090 -- it does NOT touch the TRM checkpoint. Qwen is FORBIDDEN as the
  TRAINED base (Spurious-Rewards confound); Qwen GGUF as an off-policy teacher / certifier reference is fine.
  DiffusionGemma stays GATED (STILL-PENDING; the gated forward-queue entry is NOT a .393 task -- the .393 job
  is to LAND the ARC oracle-distinct win that would later justify activating it). Every verifier-value task
  MUST declare verifier_is_oracle honestly (Circularity Discipline). Online ARC play stays operator-gated
  (no leaderboard submission).

