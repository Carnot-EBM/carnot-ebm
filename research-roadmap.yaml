#   3. POSITIVE CONTROL on every comparison: the competent judge must clear chance BEFORE any
#      parity verdict; the cascade must escalate (>0) BEFORE any cascade-wins claim.
#   4. NO hard gated_on on the critical path (.340 disk-fallback). Each downstream task disk-reads
