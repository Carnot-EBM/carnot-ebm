        2. On a held-out GSM8K reasoning set (n>=100 for a CLT-valid accuracy delta per CLAUDE.md
           sample-size rigor; record n_heldout), generate with the EBT (energy descent, n_descent_steps from
           exp3737) and compute its total inference FLOPs via the exp3727 harness.
        3. Tune the AR best-of-M so AR's total inference FLOPs ~= the EBT's (within the harness's
           budget_matcher_tolerance). Generate AR best-of-M on the same set.
