        0. PRECONDITIONS: uv + nano-trm + CUDA (as exp4116). Read results/experiment_4116_*.json for val_exact_accuracy + stable_checkpoint_path. If the stable checkpoint is missing/unloadable -> honest_verdict `blocked_stable_checkpoint_missing` and STOP (the lineage broke).
