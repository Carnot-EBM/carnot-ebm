    priority: critical
    prior_failures: []
    prompt: |
      CONTEXT: After Exp 1761 successfully prototyped the Fast-Slow Variant (arXiv:2605.12484), this task scales it to the mandated flagship local SOTA MoE (`unsloth/Qwen3.6-35B-A3B-GGUF`).

      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/verify_repair.py
        - results/experiment_1761_fast_slow_variant.json

      TASK: Run the Fast-Slow repair loop on Qwen3.6-35B-A3B-GGUF using the 3-task continual learning benchmark (GSM8K, BBH, MATH).

      CONCRETE STEPS:
        0. PRECONDITIONS: `unsloth/Qwen3.6-35B-A3B-GGUF` is cached and loadable.
        1. Instantiate the Fast-Slow loop using the token-level energy metrics from Exp 1766 as a fast-weight heuristic.
        2. Run the 3-task switch (A->B->C->A) benchmark with n=30 per task.
        3. Calculate sample efficiency, KL drift, and catastrophic forgetting metrics.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.fast_slow_variant.v2"
        - experiment: 1768
        - run_date: "{date}"
        - sample_efficiency_ratio: float
        - plasticity_fast_slow: float
