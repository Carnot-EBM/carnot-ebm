    1. Create results/experiment_1495_interwhen_monitor_prototype.json immediately with status="in_progress".
    2. Verify that both gated upstream artifacts exist and report readiness; if not, write a terminal gated/blocked artifact.
    3. Convert certificate rows and validator rows into replayable trace states with token offsets or synthetic polling intervals.
    4. Implement or script a minimal monitor loop: poll state, run deterministic validators/checks, emit monitor event, and mark interrupt/no-interrupt.
    5. Measure detection count, interruptions, false interruptions, and false accepts.
    6. Write results/interwhen_monitor_events_1495.jsonl with one event per poll.
    7. Add focused tests for monitor-event schema or replay helpers.
