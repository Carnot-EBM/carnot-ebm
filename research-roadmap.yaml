        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The original think A/B favored think on held-out exact admission but was underpowered and had routing confounds. Those confounds are fixed. An expanded-roster run was launched outside the conductor and may contain partial checkpointed rows. Determine the result without duplicating valid completed cells or hiding server failures.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md ARC and GGUF rules
      - {project_root}/ops/known-issues.md Phase 2a expanded think entry
      - {project_root}/docs/research-notes/arc-live-agent-improvement-plan-2026-08-08.md Phase 2a
      - {project_root}/python/carnot/experiment_6199_gemma_think_mode_ab.py
      - {project_root}/scripts/run_exp6199_expanded_roster.py and any checkpoint/log/result files
      - {project_root}/results/experiment_6228_supervised_three_family_runtime_endurance.json
      - {project_root}/ops/arc_solve_registry.yaml and canonical E3 entrypoint

      TASK
      Registry-precheck first. Validate and reuse completed expanded-roster cells. Resume only missing preregistered cells through Exp6228 supervision. Compare explicit think-on and explicit think-off arms with matched prompts, penalties, budgets, and seeds. Freeze the downstream think configuration from held-out exact-admission evidence. Do not read game source or mutate the solve registry.

