      CONTEXT: arXiv:2605.05387 proves that projected-Langevin dynamics under linear equality
      constraints Ax=b achieves Langevin mixing while guaranteeing exact constraint satisfaction
      throughout the trajectory (not just at convergence). The approach: at each step, after
      the Langevin update, project back onto the constraint manifold using a closed-form
      projection operator (P = I - A^T(AA^T)^-1 A). This is an alternative to CASAL's
      primal-dual split augmented approach.
