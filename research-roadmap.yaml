milestone: 2026.06.388
milestone_title: "HARDEN THE VERIFIER MOAT WHERE IT MATTERS — efficiency vs LLM-as-judge (the owed north-star §5 win) + GAP-4 execution-verifier production-safety + a SOVEREIGN local generator + the now-unlocked DiffusionGemma verifier-guided decoding"
milestone_doc: openspec/change-proposals/research-roadmap-v388.md
milestone_overview: |
  .387 PROVED the verifier moat on an executable domain (exp4177 code: verifier+V-STaR pass@1 0.84 vs
  SC-vote 0.66, +0.18 CI95[0.08,0.30], matched no-verifier control also 0.66, positive_control_confirmed),
  which the capstone OVER-CLAIMED as flipping the DiffusionGemma gate to MET -- CORRECTED 2026-06-14
  ("fix the MET") to STILL-PENDING: the code win is circular (the verifier == the unit-test oracle), so it
  does NOT show a non-trivial verifier adds value; the gate requires a NON-trivial/energy/learned verifier
  beating a matched control on an oracle-DISTINCT headroom domain (ARC), which is UNMET. The proof has three honest caveats, each load-bearing
  for the north star (solve ARC-AGI-3 accurately AND efficiently): (1) the EFFICIENCY axis was NOT won
  (efficiency_parity=false; the verifier was compared vs ~free self-consistency vote, never vs an
  LLM-as-judge — the actual north-star §5 win condition "parity at 10-100x cheaper"); (2) the code verifier
  is semi-circular (verifier ≈ unit-test oracle), and the harder claim — a verifier beats vote where it is
  NOT the oracle — is the ARC GAP-3 question, which came back BOUNDED (exp4178); (3) the only ARC verifier
  that reaches headroom is GAP-4 EXECUTION (vote 0.45 -> gated 0.58), unhardened and NOT sovereign (codex
  generator). So .388 converts "proven on the easy case" into the moat the north star needs:
    PHASE A — THE EFFICIENCY MOAT (decisive owed §5 win): A1 headroom re-census + LLM-as-judge baseline
      harness + REAL wall-clock/token cost meter; A2 (gated_on A1 headroom>=0.10) the head-to-head —
      Carnot executable/energy verifier vs LLM-as-judge: accuracy parity (CI95) AND cost ratio ->
      verifier_efficiency_win.
    PHASE B — THE ARC VERIFIER VIA THE PROVEN PATH (execution): B1 GAP-4 graded execution-energy gate
      (production-safe; tau=0.005 + vote-aware guard; NOT the retired agreement-selector); B2 a SOVEREIGN
      local open-weight generator + GAP-4-verified self-distillation (decentralization rule 1 + self-learning).
    PHASE C — UNLOCKED GENERATION + ARC PROGRESS + LIVE-ENV GROUNDING: C1 DiffusionGemma verifier-guided
      decoding (gate STILL-PENDING per the .387 correction; this C1 ran as a precondition-probe and BLOCKED on absent weights, exp4189); C2 ARC
      incremental +1 (monotonic, via the hardened GAP-4 stack); C3 a real ARC-AGI-3 LIVE-env grounding probe.
    PHASE D — reserved slots: D1 SOTA-ingestion, D2 registry+gaps hygiene, D3 hardware continuity, D4 capstone.
  GAP-3 trained ARC content energies stay RETIRED (operator-authorization required per
  ops/exclusion_manifest.yaml); .388 does NOT auto-run CEM (arXiv:2510.20607) — it re-flags it to the operator.

  HARD RULE (every task): NO task may launch TRM training, run pkill/kill against train.py, or WRITE
  results/trm_runs/sudoku_extreme_baseline/. Training is DONE (SIGTERM'd at val 0.8227); the conductor stays
  stood-down. TRM-touching tasks are READ-ONLY.

