  - id: exp2689
    milestone: "2026.05.256"
    deliverable: "results/experiment_2689_sota_gguf_live_eval.json"
    title: "SOTA GGUF Live Pipeline Validation: Ensemble v11 on N=50 Qwen3.6-35B + Gemma-4-31B"
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    track: evaluation

    prior_failures:
      - experiment_id: exp2675-sota-gguf-live-eval
        verdict: "zero_execution_no_artifact_produced"
        addressed_by: "exp2675 was a .255 task (zero-execution milestone, no artifact). This .256 attempt is the first actual execution of the GGUF live eval. Same scope: N=50 Qwen3.6-35B-A3B + Gemma-4-31B on FoVer corpus with ensemble v11."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Both RTX 3090s (48 GB VRAM total) have been idle since the conductor stalled around milestone
      .206. Ensemble v11 was planned in .254 but no artifact exists. This experiment runs the full
      VerifyRepairPipeline on N=50 live-generated responses from two SOTA GGUF models to produce
      the first genuine live-inference validation of the verifier pipeline.

      MODEL_SPECS (mandatory per CLAUDE.md — must use at least one SOTA GGUF):
        - name: Qwen3.6-35B-A3B-GGUF
          hf_id: unsloth/Qwen3.6-35B-A3B-GGUF
          role: primary_inference
        - name: gemma-4-31B-it-GGUF
          hf_id: unsloth/gemma-4-31B-it-GGUF
          role: secondary_inference

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline — verify(), should_verify())
      - python/carnot/verify/ (list all existing Tier 0* verifier modules — check what exists)
      - scripts/experiment_template.py (ExperimentTemplate and cached_sota_pair() pattern)
      - data/fover_corpus.jsonl (FoVer corpus — {{question, correct, incorrect}} fields)

      TASK: Run VerifyRepairPipeline on N=50 live GGUF outputs. Measure energy distribution.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any inference):
         a. Check Qwen3.6-35B-A3B-GGUF cached:
            `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/ 2>/dev/null | head -3`
            Record: qwen_cached (bool).
         b. Check gemma-4-31B-it-GGUF cached:
            `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF/ 2>/dev/null | head -3`
            Record: gemma31b_cached (bool).
         c. Check CUDA available:
            `.venv/bin/python -c "import torch; print(torch.cuda.is_available(), torch.cuda.device_count())"` OR
            `nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>/dev/null`
            Record: cuda_available (bool), n_gpus (int).
         d. Check FoVer corpus: `wc -l data/fover_corpus.jsonl 2>/dev/null || echo "0"`
            Record: fover_corpus_lines (int).
         If both GGUF models absent AND cuda_available=False: write honest_verdict
         'blocked_gguf_not_cached_and_no_cuda' and exit. DO NOT fabricate inference.
         If at least one GGUF cached AND cuda_available: proceed.
         If no GGUF cached but cuda_available AND fover_corpus_lines > 0: run CPU smoke
         with gemma-4-E4B-it (N=10), flag smoke_only=true in artifact.

      1. Prepare N=50 evaluation prompts from FoVer corpus or fallback arithmetic questions.
         Use random_seed=42. Record: n_prompts_prepared (int), prompt_source (str).

      2. Run inference for each prompt through available GGUF model(s) via llama.cpp or transformers.
         For each: generate response, pass through VerifyRepairPipeline.verify().
         batch_size=5, timeout per batch=300s.
         Record: inference_mode='live_gpu', n_examples_run (int), mean_inference_time_s (float).

      3. Compute pipeline metrics:
         a. energy_score_distribution: {{mean, std, min, max, p25, p75}}.
         b. fast_path_rate: fraction of examples where should_verify() returned False.
         Record: all metrics.

      4. Write results/experiment_2689_sota_gguf_live_eval.json.

