  prompt: "CONTEXT: exp2574 implemented Tier0xSafetyVerifier with safety_verifier_viable=True (AUROC > 0.70 on safety corpus). This task integrates the safety verifier into a standalone safety detection product — a separate Group F that operates INDEPENDENTLY of the hallucination ensemble Groups A-E. Group F serves as the foundation of the Tier B Safety/Jailbreak Classifier product.\n\nProduct architecture:\n  - Groups A-D (hallucination detection): unchanged, AUROC=0.9857\n  - Group F (safety/jailbreak detection): Tier0x as the first member\n  - VerifyRepairPipeline gets a new parameter: mode='hallucination' | 'safety' | 'both'\n\nAlso produce a paper §7 stub for the 'Commercial Applications' section.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/tier0x_safety.py (exp2574 deliverable)\n  {project_root}/python/carnot/pipeline/verify_repair.py (integration point)\n  {project_root}/results/experiment_2574_safety_corpus.json (safety_verifier_auroc)\n  {project_root}/docs/arxiv-paper/main.tex (to find §7 Commercial Applications or §6 Discussion)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Safety verifier implemented:\n        python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.verify.tier0x_safety import Tier0xSafetyVerifier; print('ok')\"\n        If fails: write honest_verdict 'blocked_safety_verifier_not_found' and exit.\n     b. Safety verifier AUROC:\n        python3 -c \"import json; d=json.load(open('results/experiment_2574_safety_corpus.json')); print('viable:', d.get('safety_verifier_viable'), 'auroc:', d.get('safety_verifier_auroc'))\"\n        If safety_verifier_viable=False: write honest_verdict 'blocked_gate_not_met_safety_viable_false' and exit.\n  1. Add mode parameter to VerifyRepairPipeline:\n     In verify_repair.py, add: mode: str = 'hallucination'  (default unchanged)\n     When mode='safety': use Group F (Tier0xSafetyVerifier) only.\n     When mode='both': run both Group A-D and Group F.\n     Document with a one-line comment explaining why (safety is a different product, not a verifier in the hallucination ensemble).\n  2. Run safety ensemble on 20 safety corpus examples. Confirm integration works.\n  3. Write paper §7 stub (if main.tex already has §7, add a subsection; otherwise add before \\end{{document}}):\n     \\subsection{{Commercial Applications}}\n     Carnot's energy infrastructure extends to safety applications. The Tier 0x Safety Verifier\n     (\\S\\ref{{sec:tier0x}}) detects jailbreak attempts and unsafe content via Ising constraint energy,\n     achieving AUROC=X.XX on a 200-example public safety benchmark. This demonstrates the\n     energy-based framework's domain generalization beyond hallucination detection.\n  4. Set safety_integration_complete=True.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - safety_integration_complete:\n      principle: \"True if VerifyRepairPipeline accepts mode='safety' and returns safety scores.\"\n  - safety_pipeline_auroc:\n      principle: \"AUROC of the integrated pipeline on safety corpus (should match tier0x standalone AUROC).\"\n  - paper_section_added:\n      principle: \"True if §7 Commercial Applications stub was added to main.tex.\"\n  - hallucination_ensemble_unchanged:\n      principle: \"True if Groups A-E AUROC was not modified. Safety integration must not regress hallucination performance.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"safety_integration_complete == true\"\n    principle: \"Tier B product requires pipeline integration, not just standalone verifier. Complete integration enables the safety mode to be documented and demoed.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2576-jepa-v3-online-integration
  title: 'Phase 4: JEPA v3 Online Integration — Real-Data Checkpoint into VerifyRepairPipeline'
  milestone: 2026.05.247
  deliverable: results/experiment_2576_jepa_v3_online.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  continuous_self_learning_task: true
  prior_failures:
  - experiment_id: exp2565-jepa-real-data-training
    verdict: 'complete: jepa_auc_real_data >= 0.889; checkpoint_saved=True'
    addressed_by: "exp2565 trained JEPAFastPathPredictor on real FoVer data and saved a checkpoint. This task integrates that checkpoint into VerifyRepairPipeline with online-update capability — different deliverable (pipeline integration with learning loop) vs standalone training. The checkpoint from exp2565 is the prerequisite; this task makes it live in the production path."
    retire_if_same_verdict: false
  prompt: "CONTEXT: exp2565 trained the JEPAFastPathPredictor on n=6548 real FoVer examples and saved a checkpoint (python/carnot/pipeline/jepa_fast_path_v2_checkpoint.pkl). The predictor currently runs in the pipeline but uses the synthetic-trained weights. This task (mandatory FR-11 continuous self-learning) integrates the real-data checkpoint AND adds online-update capability: after each VerifyRepairPipeline session, any new (features, label) pairs are used to update the predictor weights.\n\nFR-11 TIER 3 REQUIREMENT: The JEPA predictor must improve continuously from session data, not just from batch retraining. The online-update mechanism is: after a pipeline run, collect (response_features, violation_occurred) pairs; update the logistic regression weights with mini-batch gradient descent (or incremental fit via sklearn SGDClassifier).\n\nEXISTING CODE TO READ FIRST:\n  grep -r 'JEPAFastPath\\|jepa_fast_path\\|fast_path' {project_root}/python/ --include='*.py' -l\n  {project_root}/python/carnot/pipeline/jepa_fast_path.py (predictor architecture)\n  {project_root}/python/carnot/pipeline/verify_repair.py (integration point)\n  {project_root}/results/experiment_2565_jepa_training.json (checkpoint path + AUC baseline)\n  {project_root}/results/experiment_2550_jepa_real_eval.json (current threshold and fast_path_rate)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. JEPA predictor exists:\n        python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.pipeline.jepa_fast_path import JEPAFastPathPredictor; print('ok')\"\n        If fails: write honest_verdict 'blocked_jepa_not_found' and exit.\n     b. Real-data checkpoint:\n        ls {project_root}/python/carnot/pipeline/jepa_fast_path_v2_checkpoint.pkl 2>/dev/null || echo 'not_found'\n        Set real_data_checkpoint_found=(True/False).\n     c. Verify exp2565 AUC baseline:\n        python3 -c \"import json; d=json.load(open('results/experiment_2565_jepa_training.json')); print('auc:', d.get('jepa_auc_real_data'), 'checkpoint:', d.get('checkpoint_saved'))\"\n        Set prior_jepa_auc.\n  1. If real_data_checkpoint_found=True: load checkpoint into JEPAFastPathPredictor.\n     If not found: retrain minimally from exp2548 FoVer corpus (100-example subset) to get working weights.\n  2. Add online_update() method to JEPAFastPathPredictor:\n     def online_update(self, features: list, label: int):\n       'Update predictor weights with one (features, label) observation.'\n       # Partial fit via sklearn SGDClassifier or equivalent\n       self._sgd.partial_fit([features], [label], classes=[0, 1])\n  3. Wire online_update() into VerifyRepairPipeline:\n     After each verification cycle completes, if violation_detected is not None:\n       pipeline.jepa_predictor.online_update(response_features, int(violation_detected))\n  4. Test: run pipeline on 10 examples, confirm online_update is called, confirm weights change.\n  5. Set jepa_online_learning_active=True.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - jepa_online_learning_active:\n      principle: \"True if online_update() is wired into VerifyRepairPipeline. Primary FR-11 Tier 3 deliverable.\"\n  - real_data_checkpoint_loaded:\n      principle: \"True if the exp2565 real-data checkpoint was successfully loaded. False if fallback weights were used.\"\n  - jepa_auc_after_integration:\n      principle: \"AUC on a held-out eval set after integration. Should be >= prior (0.889 from exp2565 or synthetic baseline).\"\n  - online_update_tested:\n      principle: \"True if online_update() was called on at least 10 real examples and weights changed.\"\n  - prior_jepa_auc:\n      principle: \"Baseline AUC from exp2565 (or 0.889 if unavailable). For regression detection.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"jepa_online_learning_active == true OR (real_data_checkpoint_loaded == true AND jepa_auc_after_integration IS NOT NULL)\"\n    principle: \"FR-11 Tier 3 requires online learning. Either the full online-update loop is active, OR the real-data checkpoint is loaded and AUC measured — minimum for the continuous self-learning mandate.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2577-gatemate-hardware-continuity
  title: 'Phase 5a (Hardware): GateMate Terminal State — Smoke Test or Manual .cfg Repair'
  milestone: 2026.05.247
  deliverable: results/experiment_2577_gatemate_continuity.json
  agent_type: codex
  model: gpt-5.5
  track: hardware
  max_turns: 50
  prior_failures:
  - experiment_id: exp2559-gatemate-cfg-format-fix
    verdict: 'complete: approach_a_attempted=True OR approach_b_attempted=True; gatemate_bitstream_flashed=True OR False'
    addressed_by: "exp2559 tried CC1 toolchain (Approach A) and openFPGALoader HEAD build (Approach B) to resolve the strtol parse error. This task reads the exp2559 outcome: if gatemate_bitstream_flashed=True → GateMate is terminal (smoke test the on-board Ising sampler). If gatemate_bitstream_flashed=False → try a third approach: manually edit the offending token in the ASCII .cfg file to fix the strtol error, then retry openFPGALoader. Structurally distinct from exp2559 (direct .cfg text repair vs toolchain-level regeneration). retire_if_same_verdict=true: if flash still fails after manual edit, GateMate is documented as permanently blocked pending CC1 toolchain availability."
    retire_if_same_verdict: true
  prompt: "CONTEXT: GateMate A1-EVB-2M flash has been attempted via exp2559 (CC1 toolchain + openFPGALoader HEAD). This task reads exp2559's outcome and branches:\n\nBRANCH A (if exp2559 succeeded): Smoke test the on-board Ising sampler. The n=16 Ising tile should produce random-ish spin configurations after flash. GateMate reaches TERMINAL state.\n\nBRANCH B (if exp2559 failed): Try manual .cfg text repair.\n  The strtol error in openFPGALoader's colognechipCfgParser is triggered by a specific token format.\n  The .cfg file is ASCII text; inspect it for tokens that could fail strtol():\n  - Non-integer numeric values (e.g., 0x-prefixed hex without decimal fallback)\n  - Scientific notation (1e5 instead of 100000)\n  - Negative values in unsigned fields\n  - Empty fields that evaluate to ''\n  If a suspicious token is found: edit the .cfg file to fix that token, retry openFPGALoader.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/results/experiment_2559_gatemate_cfg_fix.json (exp2559 outcome)\n  {project_root}/rtl/gatemate_ising_n16.cfg (bitstream file to inspect)\n  {project_root}/ops/hardware-bringup-prep.md (board state overview)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Read exp2559 outcome:\n        python3 -c \"import json; d=json.load(open('results/experiment_2559_gatemate_cfg_fix.json')); print('flashed:', d.get('gatemate_bitstream_flashed'), 'jtag:', d.get('gatemate_jtag_detected'))\"\n        Set prior_flash_result=d.get('gatemate_bitstream_flashed').\n        If exp2559 not found: assume prior_flash_result=False.\n     b. JTAG detected:\n        lsusb | grep -i '1209:c0ca\\|DirtyJTAG' && echo 'detected' || echo 'not_detected'\n        Set gatemate_jtag_detected.\n     c. openFPGALoader available:\n        openFPGALoader --version 2>&1 | head -1 || echo 'not_found'\n  1. If prior_flash_result=True (GateMate already flashed by exp2559):\n     BRANCH A: Smoke test.\n     a. Send a test configuration to the on-board Ising sampler via JTAG.\n     b. openFPGALoader -c dirtyJtag -b olimex_gatemateevb --read-flash 256 2>&1 | head -5\n        (or equivalent JTAG readback command)\n     c. If board responds: gatemate_smoke_test_passed=True. Terminal state reached.\n     d. Write artifact: gatemate_terminal=True, gatemate_status='terminal_smoke_tested'.\n\n  2. If prior_flash_result=False (still flash-pending):\n     BRANCH B: Manual .cfg repair.\n     a. Inspect .cfg for suspicious tokens:\n        python3 -c \"\nimport re\nlines = open('{project_root}/rtl/gatemate_ising_n16.cfg').readlines()\nfor i, line in enumerate(lines[:100]):\n    # Look for potential strtol failures: hex, scientific notation, negative in unsigned context\n    if re.search(r'0x[0-9a-fA-F]+|[0-9]+e[0-9]+|-[0-9]+', line.strip()):\n        print(f'line {{i}}: {{line.strip()[:80]}}')\n\"\n     b. If suspicious token found: make a backup and edit the .cfg:\n        cp {project_root}/rtl/gatemate_ising_n16.cfg {project_root}/rtl/gatemate_ising_n16.cfg.bak\n        Apply the edit (convert hex to decimal, remove scientific notation, etc.).\n     c. Retry flash:\n        openFPGALoader -c dirtyJtag -b olimex_gatemateevb {project_root}/rtl/gatemate_ising_n16.cfg 2>&1\n        Set gatemate_bitstream_flashed=(exit_code == 0).\n     d. If still fails: document the specific token + error for operator follow-up.\n        Set gatemate_cfg_repair_attempted=True.\n        Set gatemate_status='manual_repair_attempted_operator_needed'.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. 'blocked_gatemate_flash_permanently_blocked' is a valid terminal verdict if retire_if_same_verdict fires.\"\n  - gatemate_jtag_detected:\n      principle: \"Live JTAG detection before any flash attempt.\"\n  - gatemate_bitstream_flashed:\n      principle: \"True if flash succeeded in this task or was inherited from exp2559. Determines terminal state.\"\n  - gatemate_terminal:\n      principle: \"True if board reached terminal state (flashed + smoke tested). Hardware continuity discipline graduation criterion.\"\n  - gatemate_smoke_test_passed:\n      principle: \"True if on-board Ising sampler responded to a test config after flash.\"\n  - gatemate_cfg_repair_attempted:\n      principle: \"True if manual .cfg token repair was attempted (Branch B).\"\n  - cfg_suspicious_tokens:\n      principle: \"List of line numbers and token types found suspicious in the .cfg (for diagnostic trail).\"\n  - gatemate_status:\n      principle: \"Summary status string for hardware continuity tracking.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement. Hardware flash takes >60s on real board.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"gatemate_terminal == true OR gatemate_cfg_repair_attempted == true OR gatemate_jtag_detected == false\"\n    principle: \"Hardware continuity discipline: terminal state reached, OR repair attempted with documented diagnosis, OR JTAG not present (operator needs to reconnect cable).\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2578-kv260-hardware-continuity
  title: 'Phase 5b (Hardware): KV260 Continuity — Flash if SD Card Available; Prep Script Update Otherwise'
  milestone: 2026.05.247
  deliverable: results/experiment_2578_kv260_continuity.json
  agent_type: codex
