- id: exp6812-sota-operational-handoff-corpus-v2
  title: Three-model operational-handoff proposal corpus v2
  track: verification
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: true
  max_turns: 100
  estimated_wall_time_min: 480
  per_unit_rows: true
  milestone: 2026.08.595
  deliverable: results/experiment_6812_sota_operational_handoff_corpus_v2.json
  gated_on:
    - upstream: exp6811-operational-obligation-automaton-v3
      artifact_field: operational_automaton_fixture_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6811 supplies an owned typed action contract. Measure whether authentic local models retain
    its operational force under direct typed handoff and length-matched prose compression. This
    recovers Exp6803 with a valid upstream contract. It builds a frozen proposal corpus and does not
    attempt a live ARC solve.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/scripts/experiment_template.py, cached_sota_pair() and GGUF notes
    - {project_root}/results/experiment_6811_operational_obligation_automaton_v3.json
    - {project_root}/python/carnot/llm/llama_cpp_backend.py
    - {project_root}/scripts/llama_server_manager.py
    - {project_root}/scripts/check_dual_gpu.py
    - {project_root}/results/experiment_6745_sota_dual_encoding_proposal_corpus.json
    - {project_root}/openspec/capabilities/constraint-verification/spec.md

    TASK:
    Generate a complete paired corpus of structured action proposals under direct typed and
    length-matched compressed handoffs. Invoke every mandated model through local llama.cpp CUDA.
    Freeze raw bytes and exact checks. Do not use a provider API or substitute a smaller model.

    CONCRETE STEPS:
    0. PRECONDITIONS: require operational_automaton_fixture_ready=true, model files and hashes,
       llama.cpp health, free disk, and task-owned GPU leases. Define MODEL_SPECS exactly as
       unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and
       unsloth/gemma-4-26B-A4B-it-GGUF. Never pass a GGUF repo to AutoTokenizer. On any bounded
       load failure write complete_blocked_sota_operational_handoff_corpus_v2 with
       gate_check_summary and stop. Do not shrink or substitute.
    1. Freeze at least 48 source-free scenarios across stale prerequisites, competing authorities,
       fallback, consequence, already-safe proposals, and soft conflict. Freeze both prompts before
       inference.
    2. Run all three models in sequential task-owned phases. Match scenario, seed, token, candidate,
       stop, and retry budgets. Save prompt/output bytes, first-token evidence, file hashes, GPU
       offload, VRAM, process IDs, phase duration, and teardown.
    3. Parse without repair. Apply the Exp6811 exact contract after generation. Record every
       operational field, parse state, hard and binding preservation, already-safe identity,
       candidate diversity, legal support, and retry demand.
    4. Use atomic checkpoints per model-scenario-arm cell. Resume only a byte-identical manifest.
       Never pool a missing model phase into a headline.
    5. Emit one row per model-scenario-seed-arm-candidate. Set operational_handoff_corpus_ready from
       complete rows, exact checks, raw bytes, MODEL_SPECS coverage, and teardown, independent of
       effect sign. This field is consumed by Exp6813 and Exp6815.
    6. Run focused tests, ruff, OpenSpec coverage, CUDA E2E checks, adversarial verification,
       artifact convention audit, and verdict-row consistency lint.
    7. REQUIRED ARTIFACT FIELDS AND PRINCIPLES: field_principles (principle per field);
       inference_substrate (local llama.cpp CUDA GGUF); duration_s (separate acquisition, load,
       inference, and teardown time); random_seed (frozen cell seeds); reproducibility_checksum
       (bind manifest and rows); MODEL_SPECS (exact three hub IDs); model_specs (paths, hashes,
       revisions, quantizations, roles, chat templates, embedded tokenizer receipts, and limits);
       models_used (all three complete); live_model_invoked (true only after first-token receipt);
       frozen_manifest (prompts and budgets); gpu_receipts (ownership and offload); checkpoint_
       receipts (atomic resume evidence); raw_output_manifest (immutable bytes); rows (every unit);
       operational_preservation_by_arm (row-derived); hard_violation_rate_by_arm (exact); safe_
       proposal_identity_by_arm (no needless changes); parse_completion_by_arm (separate from
       semantics); legal_support_by_arm (future candidate headroom); retry_demand_by_arm (matched);
       operational_handoff_corpus_ready (exact downstream field); solve_claim (false);
       solve_provenance (development_proxy); gate_check_summary (blocked diagnostic);
       verifier_is_oracle (false, exact checker is post-generation authority); verdict_class (closed
       enum: positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict (terminal and row-supported).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6812_sota_operational_handoff_corpus_v2.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6803-sota-operational-handoff-corpus
      verdict: 'blocked_gate_check_failed'
      addressed_by: 'The only failed gate now points to Exp6811, whose readiness field is backed by existing OpenSpec owners shipped and checked in Exp6810.'
      retire_if_same_verdict: true

- id: exp6813-selective-priority-arbiter-ab
  title: Selective priority arbiter versus flat retry A/B
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.08.595
  deliverable: results/experiment_6813_selective_priority_arbiter_ab.json
  gated_on:
    - upstream: exp6812-sota-operational-handoff-corpus-v2
      artifact_field: operational_handoff_corpus_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6812 freezes authentic proposals from the three mandated model families. xTRUCE motivates
    hard, binding, and soft priority. Selective Value-Filtered Decoding (arXiv:2605.14746) adds an
    important countermetric: avoid intervention when the base proposal is already safe. Compare an
    exact selective arbiter with flat reject-and-retry. Invoke no LLM.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V595 Planner Refresh
    - {project_root}/results/experiment_6811_operational_obligation_automaton_v3.json
    - {project_root}/results/experiment_6812_sota_operational_handoff_corpus_v2.json
    - {project_root}/python/carnot/agentic/arc_trajectory_supervisor.py
    - {project_root}/python/carnot/verify/constraint.py
    - {project_root}/openspec/capabilities/constraint-verification/spec.md
    - {project_root}/scripts/verdict_row_consistency_lint.py

    TASK:
    Build a deterministic selective priority arbiter over the frozen candidate sets. Compare it
    with flat reject-and-retry at matched candidate, exact-check, retry, and wall budgets. The exact
    transition evaluator stays outside both arms. Hard violations are always rejected.

    CONCRETE STEPS:
    0. PRECONDITIONS: require operational_handoff_corpus_ready=true, all three model families, raw
       hashes, complete paired rows, and the Exp6811 compiler. On failure write complete_blocked_
       selective_priority_arbiter_ab with gate_check_summary and stop.
    1. Write tests first for lexicographic dominance, stable ties, no legal candidate, no-op
       preservation, conflict certificates, false-intervention accounting, and budget parity.
    2. Freeze development and held scenario IDs. Fit public constants on development rows only.
       The arbiter first tests whether the base proposal is already valid. If so, preserve its bytes.
       Otherwise minimize hard violations, binding shortfall in declared authority order, then soft
       shortfall. The control retries in frozen order after any failed constraint.
    3. Deny model identity, family, exact answer, future outcome, and exact utility as selection
       features. Match candidates, checks, retry cap, and CPU allowance.
    4. Record selected bytes, legality, progress, retries, candidates, certificate, false
       intervention, safe-action identity, abstention, work, and latency for each unit.
    5. Positive requires zero accepted hard violations, a false-intervention upper bound within the
       frozen limit, a positive paired lower bound for progress or retry improvement, no family
       support loss, and no increase in harmful selection. A completed null is valid.
    6. Set selective_arbiter_ab_completed from complete rows, budgets, reducer, attacks, and
       manifest, independent of effect sign. This field is consumed by Exp6814.
    7. Run focused tests, ruff, OpenSpec coverage, adversarial verification, artifact convention
       audit, and verdict-row consistency lint.
    8. REQUIRED ARTIFACT FIELDS AND PRINCIPLES: field_principles (principle per field);
       inference_substrate (deterministic CPU replay, no LLM); duration_s (measured wall time);
       random_seed (frozen tie and interval seeds); reproducibility_checksum (bind source and rows);
       source_artifact_sha256 (authentic proposal source); frozen_manifest (splits and constants);
       arm_definitions (selective priority versus flat retry); feature_allowlist (proposal-time
       inputs); feature_denylist (oracle and identity inputs); budget_match_receipt (equal work);
       rows (every model-scenario-seed-arm unit); hard_violation_rate_by_arm (exact safety);
       accepted_progress_by_arm (post-selection utility); retry_cost_by_arm (matched);
       false_intervention_rate_by_arm (changes to already-valid proposals); safe_action_identity_
       by_arm (byte preservation); legal_support_by_arm (no family contraction); certificate_
       completeness_by_arm (first higher-priority conflict); harmful_selections_by_arm (exact);
       paired_progress_delta (row-derived); paired_retry_delta (row-derived); acceptance_gate_
       positive (predeclared conjunction); selective_arbiter_ab_completed (exact downstream field);
       gate_check_summary (blocked diagnostic); verifier_is_oracle (false, outcome evaluator is
       external); verdict_class (closed enum: positive | circular_positive | null | blocked |
       disqualified | partial); honest_verdict (terminal and row-supported).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6813_selective_priority_arbiter_ab.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6804-priority-arbiter-ab
      verdict: 'GATE_BLOCKED: pre-emptive skip after exp6803 retired'
      addressed_by: 'The authentic corpus is now produced by an in-roadmap owned-spec chain, and this design adds a frozen already-safe arm plus an explicit false-intervention bound.'
      retire_if_same_verdict: true

- id: exp6814-selective-priority-arbiter-cold-audit
