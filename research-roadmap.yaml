    MODEL_SPECS:
    Prefer replaying exp1312/exp1313 outputs. If fresh generation is required,
    use cached_sota_pair(gpu_indices=(0, 1)) and headline models from:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
