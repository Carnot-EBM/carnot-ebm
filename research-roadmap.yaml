tasks:
  - id: exp2040-phase1-dashboard-and-audit
    title: "Exp 2040: Phase 1 ship-track dashboard + .203 findings audit (consolidated)"
    deliverable: results/experiment_2040_phase1_dashboard_audit.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp2010-consolidated-audit-198-199-200-201
