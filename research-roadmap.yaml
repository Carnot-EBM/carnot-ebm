  deliverable: results/experiment_6767_v589_branch_disposition.json
  operator_override: 'Standing capstone continuation directive recorded 2026-05-29; synthesize the new milestone under a fresh ID.'
  prompt: |
    CONTEXT:
    V589 has four independent roots: proof transport and diagnostic repair; procedural continuous
    memory; leased live ARC fetch; and an independent stochastic compiler audit. The milestone is
    complete when every task is terminal, not when every branch is positive. This ungated capstone
    must preserve blocked, null, circular, partial, and disqualified evidence and update the three
    PRD gaps without pooling unrelated metrics.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md, {project_root}/_bmad/prd.md, and
      {project_root}/_bmad/architecture.md
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml if present
    - Every available V589 artifact from Exp6755 through Exp6766, including blocked artifacts
    - {project_root}/results/experiment_6754_v588_branch_disposition.json
    - {project_root}/ops/status.md, {project_root}/ops/changelog.md,
      {project_root}/ops/conductor-log.md, and {project_root}/research-complete.yaml
    - {project_root}/scripts/summarize_artifact.py, {project_root}/scripts/adversarial_verify.py,
      {project_root}/scripts/verdict_row_consistency_lint.py, and
      {project_root}/scripts/recurring_blocker_ledger.py

    TASK:
    Produce the terminal V589 branch disposition. Recompute each comparative headline from rows,
    preserve circularity and blocks, classify the three PRD gaps, record exact retired follow-ups,
    and reconcile the milestone evidence docs. Do not fill missing evidence with narrative success.

    CONCRETE STEPS:
    0. PRECONDITIONS: inspect the active roadmap and list all 13 expected task IDs and deliverables.
       Missing or nonterminal artifacts become explicit partial or blocked rows; they do not block
       this capstone. Write the capstone artifact atomically before doc reconciliation.
    1. Confirm the relevant research-reporting REQ-* anchors and add only narrow missing capstone
       coverage. Write branch-classification and row-recomputation tests first.
    2. Run summarize_artifact.py on every available V589 artifact. Record missing files, blocked
       gates, verdict classes, durations, substrates, model IDs, and raw-row availability.
    3. Independently recompute proof exact-valid deltas, diagnostic AUROC and leakage, repair paired
       intervals and harmful flips, CSL order-level intervals and transaction activity, ARC token
       savings and non-inferiority, and stochastic trajectory deltas and evaluator independence.
    4. Run adversarial verification and verdict-row consistency lint on every artifact. Preserve all
       CRITICAL, WARNING, circular, no-headroom, stale-stamp, and missing-row findings.
    5. Emit one rows entry per experiment and one branch_rows entry per proof transport, repair,
       continuous memory, ARC, stochastic portability, and infrastructure branch. Do not average or
       vote across branches.
    6. Classify each of the three roadmap gaps as narrowed, unchanged, widened, or blocked with
       direct artifact and row citations. FR11 continuous self-learning is positive only if the cold
       audit passes every activity, support, hard-case, poison, restart, and rollback gate.
    7. Reconcile research-complete.yaml, _bmad/traceability.md, ops/status.md, and ops/changelog.md
       with only terminal evidence. Do not activate or modify research-roadmap.yaml and do not write
       a successor roadmap.
    8. Write explicit branch disposition and next_action values. Any recovered scope that repeats
       its prior verdict with retire_if_same_verdict=true must be named for exclusion-manifest
       retirement; do not silently propose it again.
    9. Run focused tests, lint, spec coverage, adversarial verification, row consistency, recurring
       blocker ledger, and the applicable documentation E2E checks.
    10. REQUIRED ARTIFACT FIELDS: field_principles, inference_substrate (cold local artifact and row
        synthesis), duration_s, random_seed, reproducibility_checksum, milestone,
        expected_task_ids, available_artifacts, missing_artifacts, rows (one per experiment),
        branch_rows (one per independent branch), row_recomputed_headlines, adversarial_findings,
        verdict_row_consistency_findings, recurring_blockers, prior_verdict_recurrences,
        retirement_recommendations, prd_gap_disposition (all three gaps), fr12_disposition,
        fr11_disposition, live_hardware_disposition, docs_reconciled, protected_files_unchanged
        (must include scripts/research_conductor.py and research-roadmap.yaml),
        gate_check_summary (failed check and observed value for any blocked_* verdict),
        verifier_is_oracle (false; synthesis is not a verifier), verdict_class (positive |
        circular_positive | null | blocked | disqualified | partial), and honest_verdict (allowed
        complete/success/passed/shipped prefix; partial is expected if any branch lacks evidence).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6767_v589_branch_disposition.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
