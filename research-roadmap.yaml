           [0.3,0.6]. If you cannot assemble >=2 such corpora -> complete: blocked_cannot_assemble_nondegenerate_battery
           (report the candidates' true accuracies). Do NOT run on true_acc~0 corpora.

      CONCRETE STEPS:
        1. Assemble the non-degenerate battery; verify each corpus starting true accuracy in [0.3,0.6].
           Build the SINGLE-verifier and DIVERSE multi-verifier grounding configs; record each config's
           verifier decision covariance + lambda_min + effective_k.
        2. Run the FR-11 loop to N>=200 per corpus under the three arms. Track entropy, top-mode mass,
           pass_rate, true_accuracy (distinct arrays — runtime assert). PRINT one flushed line per
           corpus/arm every ~20 steps — defeats idle-timeout.
        3. Report collapse_detected per arm per corpus; deployment robustness = DEPLOY arms prevent
           collapse on EVERY battery corpus while CONTROL collapses.
        4. P0.2 CONTRAST: compare DEPLOY-DIVERSE vs DEPLOY-SINGLE on (a) collapse-prevention margin and
           (b) final true accuracy, pooled across the battery. diverse_grounding_helps = DEPLOY-DIVERSE
           final true accuracy and/or alpha_t margin materially exceeds DEPLOY-SINGLE.
        5. Emit the artifact, clean methodology. random_seed CONTENT-DERIVED, NOT 3566.

