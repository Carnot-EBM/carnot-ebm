- id: exp1147-hardnet-projection-repair
  milestone: 2026.04.89
  deliverable: results/experiment_1147_hardnet_projection_repair.json
  title: "HardNet++-Style Projection Repair Layer for Arithmetic Constraints"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 30
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp905-math-iterative-self-repair
      verdict: code_repair_viable_math_ceiling
      addressed_by: |
        exp905 showed code repair works but math repair hits model-size ceiling with small
        models. exp1147 addresses this differently: instead of prompt-based repair (ask the
        LLM to fix itself), it uses PROJECTION-BASED repair for NUMERIC constraints. If the
        model outputs "47+28=76" and the constraint is "the sum must equal the component
        numbers", a projection computes the feasible nearest integer solution directly —
        no second LLM call required. This is fundamentally different from the prompt-repair
        architecture.
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    arXiv 2604.19669 HardNet++: differentiable constraint layer that adjusts neural outputs
    through damped local linearizations to satisfy linear and nonlinear constraints.
    arXiv 2507.08124 KKT-Hardnet: enforces constraints to machine precision using KKT projection.

    Current Carnot repair: when a verifier flags a violation, a prompt is sent to the LLM asking
    it to repair the response. This is slow (another LLM call) and fails on small models.

    For NUMERIC constraints, a projection repair is feasible and much faster:
    - Constraint: "the arithmetic result must satisfy c(x) = 0" where c is a simple function
    - Projection: given the LLM's answer x, find the nearest valid x* that satisfies c(x*) = 0
    - For arithmetic: if "a + b = answer" and model said "a + b = wrong", the projection is exact

    This experiment prototypes the projection repair for GSM8K arithmetic constraints.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py (find the repair invocation)
    - python/carnot/verify/z3_math.py (find Z3MathVerifier constraint extraction)
    - results/experiment_905_math_iterative_self_repair.json (if it exists) OR
      results/experiment_906_*.json (find current self-repair results)

    TASK:
    1. Read how Z3MathVerifier extracts arithmetic constraints from responses.
    2. Implement python/carnot/repair/projection_repair.py with:
       class ArithmeticProjectionRepair:
         def repair(self, response: str, violation: dict) -> str:
           '''
           Given a response and a Z3MathVerifier violation (which includes the violated
           constraint and the specific numbers involved), compute the nearest valid answer
           by direct arithmetic and return a patched response.
           '''
       The repair should:
       a. Extract the violated equation from the Z3 violation dict
          (e.g., "47 + 28 = 76" where the correct sum is 75)
       b. Compute the correct value directly (no LLM call)
       c. Replace the incorrect answer in the response with the correct value
    3. Test on 20 synthetic violations:
       - violating_responses = ["47 + 28 = 76", "3 * 7 = 22", "100 - 37 = 64", ...]
       - correct_answers = [75, 21, 63, ...]
       - For each: apply projection repair, verify corrected response passes Z3MathVerifier
    4. Compare latency: projection repair (μs) vs prompt repair (LLM call, seconds)
    5. Report: projection_repair_accuracy (fraction of 20 violations correctly repaired)

    CONCRETE STEPS:
    - python3 -c "from python.carnot.verify.z3_math import Z3MathVerifier; v = Z3MathVerifier(); print('Z3 available')" 2>/dev/null || echo "z3 not available"
    - (Implement python/carnot/repair/projection_repair.py)
    - python3 -c "
      from python.carnot.repair.projection_repair import ArithmeticProjectionRepair
      r = ArithmeticProjectionRepair()
      fixed = r.repair('47 + 28 = 76', {'type': 'arithmetic', 'lhs': 75, 'rhs': 76})
      print('Fixed:', fixed)
      "
    - python3 scripts/experiment_1147_hardnet_projection_repair.py

    REQUIRED ARTIFACT FIELDS:
    - projection_repair_written: bool
    - module_path: "python/carnot/repair/projection_repair.py"
    - n_violations_tested: int (20)
    - projection_repair_accuracy: float (fraction correctly repaired)
    - projection_repair_latency_us: float (mean per repair, microseconds)
    - prompt_repair_latency_s: float (estimated, from prior experiments)
    - speedup_factor: float (prompt_repair / projection_repair)
    - hardnet_projection_repair_written: bool (always True)
    - honest_verdict: "projection_accurate_and_fast" | "projection_partial_not_all_repaired" | "projection_fails_complex_constraints"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1147_hardnet_projection_repair.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1148-metacluster-sos-kan-compression
  milestone: 2026.04.89
  deliverable: results/experiment_1148_metacluster_sos_kan_compression.json
  title: "MetaCluster SOS-KAN Compression — 5x Checkpoint Shrink Without AUROC Loss"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 25
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1128-sos-kan-root-cause-k5-fix
      verdict: fixed_k5_above_08
      addressed_by: |
        exp1128 fixed SOSKANEnergyV3 (AUROC 0.9902) by correcting training normalization.
        exp1148 is a COMPRESSION experiment on top of the now-working model, not another fix.
        Different scope: exp1128 was about correctness; exp1148 is about efficiency for
        cheap-tier and hardware deployment use cases.
      retire_if_same_verdict: false
    - experiment_id: exp1072-sos-kan-v3-neural-gram
      verdict: neural_gram_shipped
      addressed_by: |
        exp1072 evolved the architecture. exp1148 compresses the trained checkpoint using
        MetaCluster centroid codebook compression (arXiv 2510.19105). Different scope.
      retire_if_same_verdict: false
    - experiment_id: exp1047-sos-kan-reparameterization
      verdict: kan_reparam_partial
      addressed_by: |
        exp1047 introduced SOS reparameterization. exp1148 applies post-training compression
        to the resulting checkpoint. Different scope: architectural change vs compression.
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    arXiv 2510.19105 MetaCluster: compresses KAN coefficient vectors with a meta-learner plus
    centroid codebook. Reports up to 80x parameter reduction on standard tasks and 124.1x on
    equation modeling, with minimal AUROC loss.

    SOSKANEnergyV3 (exp1128) now has AUROC=0.9902 but may be too large for cheap-tier routing
    and hardware paths. This experiment tests whether MetaCluster-style compression preserves
    AUROC while shrinking the model for NPU/FPGA portability.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/kaem_energy.py (find SOSKANEnergyV3 class, coefficient structure)
    - results/experiment_1128_sos_kan_root_cause_k5_fix.json (read sos_kan_individual_auroc_after=0.9902)
