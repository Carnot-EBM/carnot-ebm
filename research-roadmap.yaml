      transitions only + a non-degeneracy requirement (>=1 correctly-predicted real change), and (b) a learned/
      calibrated TRUST ENERGY that ranks induced world-models by HELD-OUT (not prefix) misprediction. Gate: a
      world-model path now PASSES the trust gate AND is USED by the planner on hidden-state games where it
      currently 0/6 fails, first-win-rate/efficiency up on held-out variants vs the binary-gate baseline (matched
      control + positive-control + FALSE_NEGATIVE_RISK guard). verifier_is_oracle: false. retire_if_same_verdict.'
    priority: critical
    track: arc-north-star
    max_turns: 160
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4604_world_model_trust_energy.json
    operator_override: '2026-06-20 operator directive "lean into energy models that augment others'' approaches"
      (energy-augmented ARC = the research spine, graft #3) + 2026-06-21 docs/research-notes/arc-008-wall-root-
      cause-2026-06-21.md (the degenerate WorldModelVerifier is the SINGLE binding cause of the 0.08 ceiling).
      NEW-scope mandatory-priority pickup (GAP-ARCH-WORLD-MODEL-TRUST-ENERGY / GAP-WM-TRUST-GATE, ops/verifier_gaps.md)
      -- NOT a rerun of the retired generation scopes (generation-completeness-wiring, energy-generation-prior).
      False-positive fuzzy-token scope-match vs prior world-model/energy tasks; the forward difference is the
      change-weighted + held-out TRUST ENERGY replacing the exact-match gate. Not a doomed rerun.'
    prior_failures:
      - experiment_id: exp4594-a3
        verdict: 'complete: goal_energy_prior_no_value_honest_null_gap_sharpened'
        addressed_by: 'exp4594 (.424 A3) used a hand goal-distance ENERGY as a GENERATION PROPOSAL prior over the
          variant explorer and nulled (FALSE_NEGATIVE_RISK; targeted classes had no headroom). This task is a
          DIFFERENT mechanism on a DIFFERENT surface: it does NOT bias generation proposals -- it fixes the
          SCORED agent''s world-model TRUST GATE (the documented 0.08-wall root cause) with a change-weighted
          consistency score + a learned held-out TRUST ENERGY that RANKS induced world-models, so a world-model
          path PASSES the gate and gets USED by the planner where it currently 0/6 fails. It carries a matched
