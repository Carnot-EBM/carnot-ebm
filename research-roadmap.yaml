- id: exp523-nup-probe-v4-contrastive
  milestone: 2026.04.39
  deliverable: results/experiment_523_nup_probe_v4.json
  title: 'Exp 523: NUP Probe v4 — Contrastive Training Objective (RETRO-049 redesign)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-049:\
    \ NUP Probe v3 AUC = 0.400 (below 0.700 Tier 0c threshold). v1 used character\
    \ entropy (AUC 0.600), v2 added Bayesian SE features (delta ~1e-16 vs v1),\
    \ v3 added CLAP cross-layer attention (AUC 0.400 — worse). Feature enrichment\
    \ is not the problem. The training OBJECTIVE is the problem: binary cross-entropy\
    \ on individual steps cannot distinguish high-energy from low-energy steps when\
    \ they are embedded similarly. The fix: CONTRASTIVE training. Train the probe\
    \ to maximize the energy gap between correct and incorrect CoT steps, using a\
    \ margin-based contrastive loss. This directly trains the metric that Carnot\
    \ cares about: E(incorrect) >> E(correct).\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/nup_probe.py — NUPProbe v1/v2/v3 (wherever defined)\n\
    - results/experiment_507_nup_probe_v3.json — v3 result (AUC 0.400)\n\
    - results/fover_labeled_steps_live.json — 57 real (step, label) pairs (Exp 442)\n\
