- id: exp868-preflight-v16
  milestone: 2026.04.67
  deliverable: results/experiment_868_preflight_v16.json
  title: 'Exp 868: Pre-flight v16 — Manifest Enforcement Module + 7-RETRO Audit (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Milestone 2026.04.66 completed (Exps 855-867). Key wins: LIVE-ENV permanently
    fixed (EnvPropagationGuard, Exp 855), DualGPURunner deployed (Exp 856), FR-11 Tier 2
    confirmed (Exp 864), constraint memory 31.25x compression (Exp 865), iCE40 N=8 134 LUTs
    (Exp 859), StreamingCoT tier_0g_viable (Exp 861), Lagrange adaptive Ising
    fr11_self_learning_confirmed (Exp 862). DualGPU wired = 1.979x throughput.
    STILL BLOCKED: SOTA code repair (RETRO-SOTA-MODEL-DOWNLOAD), JEPA OOD < 0.75
    (RETRO-JEPA-OOD), SVAMP AUC=0 (RETRO-SVAMP-ZERO-AUC), manifest patch unapplied
    for EIGHT consecutive milestones (RETRO-MANIFEST-FULL-SCOPE), inertia 2x vs 5x target
    (RETRO-INERTIA-SWEEPS-TARGET-MISSED), HalluSAE 0.6144 < 0.65
    (RETRO-HALLUSAE-AUC-BELOW-THRESHOLD), Vivado missing (RETRO-XILINX-TOOLS-UNAVAILABLE).

    CRITICAL: The manifest patch (results/manifest_fix_patch.txt) has been documented
    but never applied for EIGHT consecutive milestones. The patch modifies
    scripts/research_conductor.py, which CLAUDE.md forbids. Instead, implement a
    manifest_enforcer.py side-channel that writes blocked experiment IDs to
    MILESTONE_PREREQS.md, which the conductor reads for gate checks.

    EXISTING CODE TO READ FIRST:
    - results/operational_retro_2026_04_66.json — full .66 retro, open_retros
    - results/experiment_855_preflight_v15.json — prior preflight format
    - results/manifest_fix_patch.txt — understand the retired experiment IDs
    - MILESTONE_PREREQS.md — current prereqs structure
    - ops/exclusion_manifest.yaml — retired experiment IDs
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog pattern
    - openspec/change-proposals/research-roadmap-v67.md — .67 design doc

    TASK: Create ExclusionManifestEnforcer module that reads ops/exclusion_manifest.yaml
    and writes a PREREQS section. Audit all 7 open RETROs. Update MILESTONE_PREREQS.md.
    Produce preflight artifact with manifest_enforcer_deployed=True.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/operational_retro_2026_04_66.json. Extract open_retros (7),
       experiment_count (794), wall_time_minutes, per_experiment_avg.
    3. Read ops/exclusion_manifest.yaml. Note retired experiment IDs.
    4. Create python/carnot/pipeline/manifest_enforcer.py:
       a. Class ExclusionManifestEnforcer with:
          - load_manifest(yaml_path) -> dict of retired experiment IDs + reasons
          - is_retired(experiment_id: int) -> bool
          - get_retirement_reason(experiment_id: int) -> str
          - write_prereqs_section(prereqs_path: str) -> None
            Writes "## Exclusion Manifest Gate" section to PREREQS file with
            list of retired IDs that must not be re-queued.
          - check_queue(task_ids: list[int]) -> list[int]: returns blocked IDs
       b. Export ExclusionManifestEnforcer from carnot.pipeline.__init__
    5. Add spec update to openspec/capabilities/verify-repair/spec.md:
       REQ-INFRA-072: ExclusionManifestEnforcer MUST prevent retired experiments
       from re-entering the queue by writing gate entries to MILESTONE_PREREQS.md.
       SCENARIO-INFRA-081: Given ops/exclusion_manifest.yaml with retired IDs,
       write_prereqs_section() MUST append "## Exclusion Manifest Gate" with all IDs.
    6. Update MILESTONE_PREREQS.md with .67 section:
       ## Milestone 2026.04.67 Pre-flight
       Open RETROs (7): RETRO-MANIFEST-FULL-SCOPE, RETRO-JEPA-OOD, RETRO-SVAMP-ZERO-AUC,
         RETRO-XILINX-TOOLS-UNAVAILABLE, RETRO-SOTA-MODEL-DOWNLOAD,
         RETRO-HALLUSAE-AUC-BELOW-THRESHOLD, RETRO-INERTIA-SWEEPS-TARGET-MISSED
       Closed in .66: RETRO-CONSTRAINT-ZERO-DELTA, RETRO-ISING-INJECTION-NO-DISCRIMINATION,
         RETRO-ICE40-PNR-LUT-OVERFLOW, RETRO-ICE40-N16-UNEXPECTED-EXPANSION,
         RETRO-LIVE-ENV-NOT-PROPAGATED
       Key assertions for .67 experiments:
         * Exp 870 GATED on Exp 869 download_verified=True
         * Exp 871 GATED on Exp 856 dual_gpu_deployed=True (DONE)
         * Exp 873 GATED on Exp 872 ood_auc > 0.65
         * CARNOT_FORCE_LIVE=1 mandatory for Exps 870, 871
       Exclusion manifest: retired IDs blocked from .67 queue
    7. Run ExclusionManifestEnforcer().write_prereqs_section("MILESTONE_PREREQS.md")
       to append the gate section.
    8. Create scripts/experiment_868_preflight_v16.py using ExperimentTemplate(868).
       tmpl = ExperimentTemplate(868, "Pre-flight v16 manifest enforcement",
                                  "results/experiment_868_preflight_v16.json",
                                  requires_gpu=False)
       tmpl.setup()
       Collect:
         - manifest_enforcer_deployed: True if import works and write_prereqs_section runs
         - open_retros_count: 7
         - open_retros: [list of 7 RETRO IDs]
         - retros_closed_in_66: [list of 5 closed]
         - prereqs_updated: True if MILESTONE_PREREQS.md has .67 section
         - experiment_count_at_close: 794
         - wall_time_at_close: from retro JSON
         - slowest_5_frozen_milestones: 7 (seven consecutive unchanged)
       honest_verdict:
         - "governance_ready" if manifest_enforcer_deployed=True AND prereqs_updated=True
         - "governance_partial" otherwise
       Build artifact and write results/experiment_868_preflight_v16.json.
    9. Write tests/python/test_experiment_868_preflight_v16.py with 100% coverage.
       Test ExclusionManifestEnforcer.load_manifest() loads YAML correctly.
       Test is_retired() returns True/False correctly.
       Test write_prereqs_section() appends correct section.
       Test check_queue() returns blocked IDs.
       Traces to REQ-INFRA-072 (new), SCENARIO-INFRA-081 (new).
    10. Reconcile:
        - ops/changelog.md: one-line entry
        - ops/status.md: "Exp 868: ExclusionManifestEnforcer deployed. 7 RETROs open.
          Manifest enforcement side-channel via MILESTONE_PREREQS.md."
    11. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_868_preflight_v16.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp869-gguf-predownload
  milestone: 2026.04.67
  deliverable: results/experiment_869_gguf_predownload.json
  title: 'Exp 869: GGUFCacheResolver v2 — Prove Download Works on Qwen3.5-0.8B (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-SOTA-MODEL-DOWNLOAD: Exp 857 implemented GGUFCacheResolver.download()
    but the actual download of Qwen3.6-35B-A3B-GGUF failed at runtime. The root cause
    is unknown — either huggingface_hub timeout, missing auth token, or incorrect filename.
    This experiment explicitly tests the download path with a SMALL model (Qwen3.5-0.8B GGUF,
    ~500MB) to prove the mechanism works end-to-end before trusting it for the 20GB+ model.
    If download works here, Exp 870 can safely use it. If it fails again, we know the
    root cause before burning GPU time.

    EXISTING CODE TO READ FIRST:
    - results/experiment_869_gguf_predownload.json — if already exists, check status
    - results/experiment_857_sota_code_repair_v6.json — blocked_by reason
    - python/carnot/resolvers/gguf_cache.py — current GGUFCacheResolver
    - results/experiment_849_gguf_cache.json — v1 implementation details
    - openspec/change-proposals/research-roadmap-v67.md — .67 design doc Phase 0

    TASK: Extend GGUFCacheResolver with pre_download_and_verify() method. Test it on
    Qwen3.5-0.8B GGUF. Produce artifact with download_verified=True gating Exp 870.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/resolvers/gguf_cache.py. Note current resolve() and download() methods.
    3. Extend GGUFCacheResolver:
       a. Add pre_download_and_verify(hf_repo: str, filename: str, dest_dir: str) -> dict:
          - Call huggingface_hub.hf_hub_download(repo_id=hf_repo, filename=filename,
            local_dir=dest_dir, force_download=False)
          - Verify file exists at returned path
          - Verify file size > 0 bytes
          - Return {"success": bool, "path": str, "size_mb": float, "error": str}
       b. Add method resolve_or_download(hf_repo: str, filename: str, dest_dir: str) -> Path:
          - First try resolve() (checks cache dirs)
          - If not found, call pre_download_and_verify()
          - Return path if success, raise FileNotFoundError otherwise
       c. Add attribute download_tested: bool = False (set to True after first successful download)
    4. Add spec entries to openspec/capabilities/verify-repair/spec.md:
       REQ-INFRA-073: GGUFCacheResolver MUST support pre_download_and_verify() for
       pre-flight model download verification.
       SCENARIO-INFRA-082: pre_download_and_verify() on a valid HF repo MUST return
       success=True and size_mb > 0.
    5. Create scripts/experiment_869_gguf_predownload.py using ExperimentTemplate(869).
       tmpl = ExperimentTemplate(869, "GGUF pre-download verification",
                                  "results/experiment_869_gguf_predownload.json",
                                  requires_gpu=False)
       tmpl.setup()
       Test target: Qwen/Qwen3.5-0.8B-GGUF (small model, Q4_K_M if available, else Q8)
       filename: "qwen3.5-0.8b-q4_k_m.gguf" or similar — check HF repo for actual filename
       If huggingface_hub import fails: honest_verdict="hf_hub_missing", download_verified=False
       If download succeeds: honest_verdict="download_verified", download_verified=True
       If download fails: honest_verdict="download_failed", error=(message), download_verified=False
       Collect:
         - download_verified: bool
         - model_id: "Qwen/Qwen3.5-0.8B-GGUF"
         - file_size_mb: float (or null)
         - cache_path: str (or null)
         - hf_hub_available: bool
         - error: str (or null)
       Build artifact and write results/experiment_869_gguf_predownload.json.
    6. Write tests/python/test_experiment_869_gguf_predownload.py with 100% coverage.
       Mock huggingface_hub.hf_hub_download to avoid network calls in tests.
       Test success path: mock returns temp file, verify download_verified=True.
       Test failure path: mock raises OSError, verify download_verified=False.
       Test resolve_or_download() falls back to download when not in cache.
       Traces to REQ-INFRA-073 (new), SCENARIO-INFRA-082 (new).
    7. Reconcile:
       - ops/changelog.md: one-line entry
       - ops/status.md: "Exp 869: GGUFCacheResolver v2. download_verified=(result).
         RETRO-SOTA-MODEL-DOWNLOAD status: (closed if True, open if False)."
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_869_gguf_predownload.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp870-sota-code-repair-v7
  milestone: 2026.04.67
  deliverable: results/experiment_870_sota_code_repair_v7.json
  title: 'Exp 870: SOTA Code Repair v7 — Qwen3.5-0.8B Live HumanEval (GPU, GATED on 869)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: GATED — do not run unless Exp 869 artifact has download_verified=True.
    If gate not met, write artifact with status="blocked" and exit immediately.

    This is the 11th attempt at a positive live code repair result. Prior attempts
    failed for various reasons: GPU OOM (Exps 785, 796), CARNOT_FORCE_LIVE not set
    (Exp 853), model download failed (Exps 850, 857). All three blockers are now
    addressed: EnvPropagationGuard (Exp 855), GGUFCacheResolver v2 (Exp 869).

    KEY STRATEGY CHANGE from all prior attempts: use Qwen3.5-0.8B (not Qwen3.6-35B).
    The 35B model download has failed repeatedly. Qwen3.5-0.8B is already cached and
    runs reliably. Getting ANY positive live code repair result is the milestone goal.
    Exp 871 can scale to larger models once we know the pipeline works end-to-end.

    EXISTING CODE TO READ FIRST:
    - results/experiment_869_gguf_predownload.json — gate check: download_verified
    - results/experiment_856_dualgpu_production.json — gate check: dual_gpu_deployed
    - results/experiment_855_preflight_v15.json — gate check: live_env_fixed
    - python/carnot/pipeline/verify_repair.py — code repair entry point
    - python/carnot/pipeline/extract.py — CodeExtractor
    - openspec/change-proposals/research-roadmap-v67.md — .67 design doc Phase 1

    TASK: Run 25 HumanEval problems with Qwen3.5-0.8B via live GPU. Apply
    VerifyRepairPipeline with CodeExtractor. Report signed_improvement and
    inference_mode=live_gpu. This is the experiment that has been blocked 10+ times.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. GATE CHECKS:
       a. Read results/experiment_869_gguf_predownload.json.
          If download_verified != True: write artifact status="blocked",
          blocked_by="exp869_download_not_verified" and exit.
       b. Read results/experiment_855_preflight_v15.json.
          If live_env_fixed != True: write artifact status="blocked",
          blocked_by="exp855_live_env_not_fixed" and exit.
    3. Instantiate ExperimentTemplate(870, requires_gpu=True).
       Call tmpl.setup(). Apply EnvPropagationGuard.load_session_env() (auto-called).
       Assert CARNOT_FORCE_LIVE in os.environ — raise RuntimeError if missing.
    4. Load 25 HumanEval problems from human_eval package (problems 0-24).
       If human_eval not installed, use local copy in data/humaneval/ or download.
    5. tmpl.setup_gpu([{"name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B",
                        "gpu": 0}])
       If not gpu_status["all_healthy"]: write blocked artifact, exit.
    6. Load Qwen3.5-0.8B model using GemmaTransformersLoader or equivalent.
       Warmup with one synthetic prompt before starting benchmark.
    7. For each of 25 HumanEval problems:
       a. Generate solution with Qwen3.5-0.8B (inference_mode must be "live_gpu")
       b. Run CodeExtractor on generated code
       c. Apply VerifyRepairPipeline.verify_and_repair() if extraction finds constraints
       d. Execute the repaired code against HumanEval test cases
       e. Record: problem_id, passed_baseline (before repair), passed_repaired (after)
    8. Compute:
       - baseline_pass_rate: fraction passing without repair
       - carnot_pass_rate: fraction passing with repair
       - signed_improvement: carnot_pass_rate - baseline_pass_rate
       - inference_mode: "live_gpu" (verified by CARNOT_FORCE_LIVE in env)
       - n_problems: 25
    9. honest_verdict:
       - "positive_repair" if signed_improvement > 0 AND inference_mode="live_gpu"
       - "live_no_improvement" if inference_mode="live_gpu" AND signed_improvement <= 0
       - "simulation_fallback" if inference_mode != "live_gpu"
       - "blocked" if any gate failed
    10. Build artifact and write results/experiment_870_sota_code_repair_v7.json.
    11. Write tests/python/test_experiment_870_sota_code_repair_v7.py with 100% coverage.
        Test gate check logic (blocked when exp869 not ready).
        Mock CodeExtractor and VerifyRepairPipeline for unit tests.
        Test signed_improvement computation.
        Traces to REQ-VR-020 (verify-repair live), SCENARIO-VR-030 (HumanEval live).
    12. Reconcile:
        - ops/changelog.md: one-line entry
        - ops/status.md: "Exp 870: Code repair v7. inference_mode=(result).
          signed_improvement=(result). 11th attempt, KEY MILESTONE result."
    13. tmpl.assert_deliverable_written() as final line.

    Run: CARNOT_FORCE_LIVE=1 CARNOT_DUAL_GPU=0 .venv/bin/python scripts/experiment_870_sota_code_repair_v7.py
    For tests: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_870_sota_code_repair_v7.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp871-live-benchmark-v6
  milestone: 2026.04.67
  deliverable: results/experiment_871_live_benchmark_v6.json
  title: 'Exp 871: Live Benchmark v6 — DualGPU + Full Cascade on 50 GSM8K (GPU, GATED on 856)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: GATED — do not run unless Exp 856 artifact has dual_gpu_deployed=True.
    If gate not met, write blocked artifact and exit.

    This is live benchmark v6. Prior live benchmark (Exp 858, .66) produced
    simulation_fallback — the cascade ran but inference_mode was not live_gpu because
    the second model (Gemma4) failed to load. This experiment fixes that by using
    only Qwen3.5-0.8B on GPU 0 (single model, reliably available) and running all
    cascade tiers in sequence. DualGPU is used for energy computation parallelism,
    not for model loading.

    EXISTING CODE TO READ FIRST:
    - results/experiment_856_dualgpu_production.json — gate check: dual_gpu_deployed
    - results/experiment_858_live_benchmark_v5.json — what went wrong in v5
    - results/experiment_855_preflight_v15.json — live_env_fixed
    - python/carnot/pipeline/three_tier.py — ThreeTierPipeline
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
    - openspec/change-proposals/research-roadmap-v67.md — .67 design doc Phase 1

    TASK: Run 50 GSM8K questions with Qwen3.5-0.8B + full cascade (Tiers 0-3).
    Measure: skip_rate (how many tiers 0-2 cleared early), cascade_auc, throughput.
    Report inference_mode=live_gpu.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. GATE CHECK: Read results/experiment_856_dualgpu_production.json.
       If dual_gpu_deployed != True: write blocked artifact, exit.
    3. Instantiate ExperimentTemplate(871, requires_gpu=True). setup().
       Assert CARNOT_FORCE_LIVE in os.environ.
    4. tmpl.setup_gpu([{"name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0}])
       If not all_healthy: write blocked artifact, exit.
    5. Load 50 GSM8K questions (questions 0-49 from gsm8k test split).
    6. For each question:
       a. Generate CoT response with Qwen3.5-0.8B (live GPU, not simulated)
       b. Run ThreeTierPipeline on response (Tiers 0-2 cascade, early-exit on clear)
       c. If not cleared by cascade: run VerifyRepairPipeline (Tier 3 Ising)
       d. Record: tier_exited_at, was_correct (compare to GSM8K answer), repaired
    7. Compute:
       - baseline_accuracy: correct without repair / 50
       - carnot_accuracy: correct with repair / 50
       - signed_improvement: carnot_accuracy - baseline_accuracy
       - cascade_skip_rate: fraction cleared by Tier 0-2 (no Ising needed)
       - inference_mode: "live_gpu"
       - cascade_tiers_active: count of distinct tiers that fired at least once
    8. honest_verdict:
       - "positive_improvement" if signed_improvement > 0 AND inference_mode="live_gpu"
       - "live_no_improvement" if inference_mode="live_gpu" AND signed_improvement <= 0
       - "cascade_running" if inference_mode="live_gpu" AND cascade_tiers_active >= 4
       - "simulation_fallback" if inference_mode != "live_gpu"
       - "blocked" if gate failed
    9. Build artifact and write results/experiment_871_live_benchmark_v6.json.
    10. Write tests/python/test_experiment_871_live_benchmark_v6.py with 100% coverage.
        Mock ThreeTierPipeline and VerifyRepairPipeline.
        Test gate logic. Test signed_improvement computation.
        Traces to REQ-BENCH-015 (live cascade), SCENARIO-BENCH-034 (DualGPU cascade).
    11. Reconcile: ops/changelog.md, ops/status.md.
    12. tmpl.assert_deliverable_written() as final line.

    Run: CARNOT_FORCE_LIVE=1 CARNOT_DUAL_GPU=1 .venv/bin/python scripts/experiment_871_live_benchmark_v6.py
    For tests: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_871_live_benchmark_v6.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp872-jepa-v25-dg-prm
  milestone: 2026.04.67
  deliverable: results/experiment_872_jepa_v25_dg_prm.json
  title: 'Exp 872: JEPA v25 — DG-PRM Domain Reweighting + SVAMP Corpus (RETRO-JEPA-OOD + RETRO-SVAMP-ZERO-AUC) (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA has failed OOD generalization in 9+ consecutive retrains. Root cause:
    all prior retrains used GSM8K + HumanEval only. On ARC and SVAMP (domain shift),
    the discriminative BCE loss overfits to in-distribution feature patterns.
    RETRO-JEPA-OOD: OOD AUC < 0.65 target. RETRO-SVAMP-ZERO-AUC: SVAMP AUC=0.0.

    Fix: DG-PRM domain reweighting (arXiv 2507.17849) + SVAMP corpus addition.
    1. Add 20 SVAMP-style pairs (concrete word problems with arithmetic steps)
    2. Per-domain loss weight: w_domain = 1.0 / (val_loss_domain + 1e-6) normalized
    3. Train with balanced corpus: GSM8K(20) + HumanEval(20) + ARC(20) + SVAMP(20)
    This is the 10th JEPA retrain attempt. The domain reweighting + SVAMP corpus are
    the two diagnosed missing pieces from prior failures.

    prior_failures:
      - experiment_ids: [exp783, exp799, exp804, exp809, exp825, exp834]
        verdict: jepa_still_below_random
        addressed_by: "DG-PRM per-domain loss reweighting (arXiv 2507.17849) + SVAMP
          corpus (20 pairs) added — neither was present in any prior retrain"
        retire_if_same_verdict: true

    EXISTING CODE TO READ FIRST:
    - results/experiment_834_jepa_v24_dg_prm.json — last JEPA retrain + DG-PRM result
    - python/carnot/models/jepa_predictor.py — current JEPA predictor
    - python/carnot/pipeline/fover_annotator.py — FoVer labeling
    - results/fover_labeled_steps_live.json — real training pairs (from Exp 442)
    - openspec/change-proposals/research-roadmap-v67.md — .67 Phase 2

    TASK: Implement per-domain loss weighting. Add SVAMP corpus. Train JEPA v25.
    Report in_dist_auc and ood_auc. Gate Exp 873 on ood_auc > 0.65.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_834_jepa_v24_dg_prm.json. Note what was different
       from v25 — specifically whether SVAMP pairs were included in that run.
    3. Read python/carnot/models/jepa_predictor.py. Note training loop and loss function.
    4. Implement DomainReweightedLoss in python/carnot/models/jepa_predictor.py:
       a. Class DomainReweightedLoss with:
          - compute_domain_weights(corpus: list[dict]) -> dict[str, float]:
            group pairs by domain field; compute weight = 1.0 / (n_domain + 1e-6)
            normalized to sum to 1.0
          - weighted_loss(logits, labels, domain_ids) -> scalar:
            per-sample loss * domain_weight, mean over batch
       b. Modify JEPAPredictor.train() to accept use_domain_reweighting=True flag
          and use DomainReweightedLoss when set.
    5. Build SVAMP-style training corpus (20 pairs):
       Synthetic SVAMP pairs follow the pattern: word problem + arithmetic chain.
       Example: "Sarah has 45 apples. She gives away 12. Then buys 7. How many now?
       Step 1: 45 - 12 = 33. Step 2: 33 + 7 = 40." (correct)
       vs "Step 1: 45 - 12 = 34." (incorrect: arithmetic error)
       Generate 20 such pairs in scripts/experiment_872_jepa_v25_dg_prm.py.
       Tag each with domain="svamp".
    6. Load existing FoVer training pairs from results/fover_labeled_steps_live.json.
       Augment with 20 SVAMP pairs and 20 ARC-style pairs (logical reasoning chains).
       Target total corpus: at least 60 pairs across 4 domains.
    7. Train JEPA v25 with DomainReweightedLoss, n_epochs=50, lr=0.001.
       Save to results/jepa_predictor_v25.safetensors.
