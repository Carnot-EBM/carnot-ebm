    TASK:
    Bind V681 authority and preregister the length-confounding and bounded-feedback hypotheses using unchanged readers.
    Deliverable: {project_root}/results/experiment_7837_v681_contract_methods.json.

    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Check exact source paths, hashes, resource ownership and gate operands before compute. Missing, retired or disqualified external evidence gives complete_blocked_* with verdict_class=blocked and gate_check_summary, not partial. Never substitute a conductor skip receipt for a science producer.
    2. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess call. Include elapsed seconds and completed units. Print inside long loops and supervise children with a heartbeat at least every 60 seconds; keep every gap below 600 seconds and tool waits at most 60 seconds. Enforce owned-child deadlines without touching unrelated jobs. Never pad runtime.
    3. Write any file over about 200 lines in several tool calls of at most 150 lines, with a progress message between calls. Keep each tool call bounded. Checkpoint completed units by input/configuration hash so a retry resumes without replacing unfavorable observations.
    4. Before implementation, add task-owned REQ-* and SCENARIO-* to the applicable capability spec. Freeze the complete affected source/test closure and exact command names, argv, deadlines and classifications. Write meaningful failing tests first. Required checks are worktree_imports, affected_pytest, changed_coverage, ruff_check, ruff_format, mypy, scoped_spec, cli_e2e, cold_replay, adversarial_verify and strict_rows. A new task has one separately named repository_health_180s diagnostic. No implicit all-tests command may enter the required list. Preserve every historical required failure and its artifact unchanged; if a legacy orchestration path is reused, its full-suite obligation still applies and failure keeps readiness zero.
    5. Reuse unnumbered library functions and current_work_receipt; do not import or call historical experiment main/run/validation dispatchers. Old source may be read for diagnosis. Record the actual import/call closure and exercise every affected library consumer. In worktree_imports emit nonempty JSON resolved_imports with actual module __file__ paths under the worktree; a success string is insufficient. Require real CLI execution in a private output root; never recursively execute validation from a validation child. Seal child logs only after exit and closed handles into unique content-addressed paths, then cold-check their bytes.
    6. Compare exactly fourteen ordered tasks Exp7837 through Exp7850 across literal table, embedded V681 JSON and matching staged/active YAML: IDs, titles, phases, deliverables, MODEL_SPECS, substrate classes and gates. Snapshot immutable bytes/hashes under docs/research-notes/v681-authority-snapshots/. Do not make science depend on this administrative gate.
    7. Run the unchanged schema, prior-failure, exclusion, gate, harness-fit, ARC-floor and priority readers on the explicit V681 YAML. Reject private missing/reordered-task, stale-doc, missing-retirement-flag, wrong-model and misspelled-gate mutations. Fix the plan itself if a reader finds an owned contract defect; never edit a guard to accept it.
    8. Read the V681 source review and primary method sections for arXiv:2508.08285, 2608.15804, 2606.11711, 2609.06921 and 2605.18871. Write docs/research-notes/v681-method-map.md with local adaptations, controls and claim limits; mark these ingested in research-studying.md. This is a continuation with new controls, not a new generator architecture.
    9. Freeze the 640 exposed development roles, fixed costs, nine fit arms, three seeds 68101/68102/68103, all primary contrasts, family bootstrap/Holm rules, capacity intervention and length permutation before science. Include each acceptance gate rationale. Record two infrastructure slots (this task and Exp7839) and the separate ARC and continuous-learning slots.
    10. Publish the V680 failure-to-remedy map, including 27% coverage, full-suite timeout, missing resolved_imports and integer/slug confusion. Keep the old requirements and failed receipts unchanged. No contract, fixture or literature result supplies scientific readiness.
    11. Run the frozen affected unit tests and require 100% statement coverage for all new/changed library and CLI code. Use identical coverage settings and explicitly named completed data files for unit and real CLI shards. Run scoped Ruff check and format, strict mypy, and scripts/check_spec_coverage.py on the exact tests. Use PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov for ordinary runs. Do not skip, xfail, weaken assertions, delete failures or alter a frozen required list after observing its result.
    12. Run the specified task E2E plus applicable ops/e2e-test-plan.md checks; preregister inapplicable entries with reasons. Independently cold-reduce primitive rows and run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the exact candidate. Keep failed, censored, excluded and unstarted units visible. Run the separately frozen 180-second serial repository-health diagnostic with a heartbeat; a timeout is failed health, never a full-suite pass.
    13. Atomically write the exact deliverable only after owned validation, with numeric experiment_id and separate exact task_id. Failed required checks disqualify and zero readiness. Scientific nulls are valid terminal outcomes. Partial means unfinished owned work only; external absence is blocked. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Apply retire_if_same_verdict only to the listed repeated scope. Preserve old artifacts, production defaults and guards; no activation or publication.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date: Use numeric experiment_id, exact YAML task_id, 2026.09.681 and {date}. principle: Readers must not confuse an integer experiment number with a task slug.
    - honest_verdict, verdict_class: Use a complete_* terminal string and one of positive | circular_positive | null | blocked | disqualified | partial; partial is owned retryable incompleteness only. principle: External blocks must terminate once; claim strength travels with the result.
    - flagged_adversarial: Actual terminal-reader boolean; never hardcode false. principle: Quarantined evidence cannot open gates.
    - gate_check_summary: An empty list or exact failed checks with upstream id, path/hash, artifact_field, op, expected and observed; required for any blocked verdict. principle: Missing and wrong-valued operands are distinct failures.
    - rows, sample_size_budget: Per-unit raw metrics, paths, arm, family, seed, status and intended/eligible/started/completed/censored/excluded/independent counts. principle: Aggregates must be recomputable; seeds and views do not increase independent N.
    - acceptance_gate_results: Separate validity, readiness, probability_quality, decision_benefit, retention and efficiency; unmeasured values are null. principle: Successful fixtures cannot become scientific benefit.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Measured monotonic timings and hashes of code, inputs, config and seeds. principle: Actual compute and replay provenance must remain auditable.
    - source_artifact_hashes, preconditions_checked: Exact source paths, dates, hashes, roles, eligibility and observed prerequisites; do not hash this output as its own source. principle: Historical and current evidence have different authority.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, repository_health: Frozen argv/classifications, exits, durable log hashes, coverage, E2E and cold replay; retain historical failed obligations separately. principle: A smaller renamed wrapper cannot erase an inherited failure.
    - verifier_is_oracle, claim_scope: Fixtures and exact-label conformance are circular_positive; independently human-labeled development evidence is exposure-limited, never fresh generalization. principle: Low energy and oracle agreement do not prove an independent verification advantage.
    - field_principles: Store each field and gate rationale with the artifact. principle: The evidence contract must remain understandable.
    - inference_substrate, inference_substrate_class: aggregation_from_upstream_artifacts, aggregation; record planned and actual class when blocked before compute. principle: Duration checks must match actual work.
    - MODEL_SPECS, model_specs, model_invocation_counts: []; record actual calls, tokens and file hashes; zero calls and [] for no LLM. principle: The model mandate applies only to real model use.
    - contract_ready_score: 1 only after unchanged readers and exact table/JSON/YAML agreement pass. principle: Open compute only on qualified evidence, never on an administrative OK.
    - authority_snapshot_paths, method_map_path: Immutable paths and hashes. principle: Rollover must not change prior authority.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7837_v681_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
