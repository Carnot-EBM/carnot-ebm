      - verifier_discriminative: bool
        principle: "PRIMARY GATE: True clears exp2727+exp2740 adversarial flags. n_non_zero>=10, std>0.01."
      - energy_values: list of float (30 values)
        principle: "Adversarial audit: all-zero = verifier still broken; variance > 0.01 = non-degenerate."
      - n_non_zero: int
        principle: "Count of examples with non-zero energy; expected >= 10 of 30."
      - energy_mean: float
