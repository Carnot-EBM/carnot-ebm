milestone: "2026.05.195"
milestone_title: "Continuous Self-Learning Repair + Hardware LUT Accounting + DAB Generation"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
scope_reduction_compliance:
  rationale: ".194 completed Fast-Slow adversarial confirmation. Now returning to FR-11 continual learning repair, hardware accounting (no-synthesis), and DAB constraints."
  carry_forwards_addressed: ["Continuous Self-Learning Repair", "LUT Accounting without Vivado synthesis", "Discrete Auto-Regressive Biasing (DAB)"]
authored_by: outer-loop-claude

tasks:
  - id: exp1914-194-archive-195-activation
    title: "Exp 1914: .194 archive / .195 activation"
    deliverable: results/experiment_1914_init.json
    max_turns: 20
    prompt: |
      CONTEXT: Milestone .194 has completed. We need to initialize the .195 environment.
      
      EXISTING CODE TO READ FIRST:
        - ops/changelog.md
        - ops/status.md
        - research-complete.yaml

      TASK: Update the status tracking to reflect the start of milestone 2026.05.195.

      CONCRETE STEPS:
        1. Read ops/status.md and move .194 to Completed.
        2. Set active milestone to 2026.05.195 in ops/status.md.
        3. Write a small JSON artifact verifying completion.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.init.v1"
        - experiment: 1914
        - status_updated: bool
        - honest_verdict: "complete: initialized .195"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1915-dynamic-resolution-continual-learning
    title: "Exp 1915: Dynamic Resolution Continual EBM Learning Prototype (FR-11 fix)"
    deliverable: results/experiment_1915_dynamic_res.json
    agent_type: codex
    prompt: |
      CONTEXT: The FR-11 baseline exhibited catastrophic forgetting. ArXiv research suggests Dynamic Resolution replay to fix this.
      
      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/ebft_autoresearch_loop.py

      TASK: Implement a prototype of Dynamic Resolution continual learning in carnot.

      CONCRETE STEPS:
        1. Create `python/carnot/pipeline/dynamic_resolution.py`.
        2. Implement a dynamic buffer that scales replay probability based on sample energy loss.
        3. Write a unit test in `tests/python/test_dynamic_resolution.py`.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.continual_learning.v1"
        - experiment: 1915
        - implementation_path: "python/carnot/pipeline/dynamic_resolution.py"
        - tests_passed: bool
        - honest_verdict: "complete: prototype built"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1916-live-eval-dynamic-resolution
    title: "Exp 1916: FR-11 Continual Learning Live Data Evaluation"
    deliverable: results/experiment_1916_live_eval.json
    gated_on:
      - upstream: exp1915-dynamic-resolution-continual-learning
        artifact_field: tests_passed
        op: '=='
        value: true
    prompt: |
      CONTEXT: We must evaluate if Dynamic Resolution actually prevents catastrophic forgetting on BBH+MATH tasks.
      
      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/dynamic_resolution.py
        - results/experiment_1909_fast_slow_confirmation.json

      TASK: Run a continual learning loop on rotated BBH and MATH datasets.

      CONCRETE STEPS:
        1. Create `scripts/experiment_1916_live_eval.py`.
        2. Run 2 epochs of sequential training.
        3. Evaluate passrate on older tasks to measure forgetting.
        4. Target: passrate > 0.70 on older tasks.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.eval.v1"
        - experiment: 1916
        - passrate_retained: float
        - forgetting_prevented: bool
        - honest_verdict: "complete: evaluated dynamic resolution"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1917-substrate-aware-kan-lut
    title: "Exp 1917: Substrate-Aware KAN LUT Accounting (No Synthesis)"
    deliverable: results/experiment_1917_kan_lut.json
    model: opus
    max_turns: 100
    prompt: |
      CONTEXT: We deferred FPGA execution to avoid Vivado toolchain failures, but we still need LUT (Look-Up Table) accounting for our continuous latent KAN tiers.
      
      EXISTING CODE TO READ FIRST:
        - python/carnot/models/boltzmann.py (or equivalent KAN tier)
        - docs/technical-report.md (for hardware claims)

      TASK: Build an analytical script that maps our continuous EBM layers to a 6-LUT boolean graph and estimates LUT count.

      CONCRETE STEPS:
        1. Create `scripts/experiment_1917_kan_lut_accounting.py`.
        2. Parse the parameter shapes of the Carnot-Ising tier.
        3. Estimate 6-input LUTs required for an INT8 quantized pass.
        4. Save LUT counts to artifact.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.lut_accounting.v1"
        - experiment: 1917
        - estimated_6_luts: int
        - meets_kv260_budget: bool
        - honest_verdict: "complete: LUT accounting done"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1918-kan-mapping-verify
    title: "Exp 1918: Verify KAN boolean mapping correctness"
    deliverable: results/experiment_1918_kan_verify.json
    gated_on:
      - upstream: exp1917-substrate-aware-kan-lut
        artifact_field: meets_kv260_budget
        op: '=='
        value: true
    prompt: |
      CONTEXT: The analytical LUT count must be verified against a symbolic boolean simulation to ensure the approximation holds.
      
      EXISTING CODE TO READ FIRST:
        - scripts/experiment_1917_kan_lut_accounting.py

      TASK: Create a Python test simulating the INT8 boolean mapping on 5 random vectors.

      CONCRETE STEPS:
        1. Create `scripts/experiment_1918_verify_mapping.py`.
        2. Generate 5 random test vectors.
        3. Forward pass through continuous layer vs boolean approximation.
        4. Calculate MSE.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.verify.v1"
        - experiment: 1918
        - mse: float
        - mapping_accurate: bool
        - honest_verdict: "complete: verified kan mapping"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1919-dab-decoder-adapter
    title: "Exp 1919: Discrete Auto-Regressive Biasing (DAB) Decoder Adapter"
    deliverable: results/experiment_1919_dab_adapter.json
    agent_type: codex
    prompt: |
      CONTEXT: To constrain LLMs with EBMs at generation time, we need a DAB adapter that modifies logits before sampling.
      
      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/

      TASK: Implement a DAB adapter for HuggingFace `LogitsProcessor`.

      CONCRETE STEPS:
        1. Create `python/carnot/pipeline/dab_adapter.py`.
        2. Subclass `LogitsProcessor` from `transformers`.
        3. Accept a generic Carnot EBM that evaluates state energy and subtracts it from logits.
        4. Unit test the adapter with dummy logits.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.dab.v1"
        - experiment: 1919
        - tests_passed: bool
        - honest_verdict: "complete: built DAB adapter"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1920-thermo-constrained-gen
    title: "Exp 1920: Thermodynamically Constrained Neural Generation Smoke Test"
    deliverable: results/experiment_1920_thermo_gen.json
    max_turns: 30
    gated_on:
      - upstream: exp1919-dab-decoder-adapter
        artifact_field: tests_passed
        op: '=='
        value: true
    prompt: |
      CONTEXT: We must verify the DAB adapter with a thermodynamically constrained generation constraint (e.g., token-length or character-level constraint).
      
      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/dab_adapter.py

      TASK: Run a quick CPU-based smoke test of DAB using a small model.

      CONCRETE STEPS:
        1. Create `scripts/experiment_1920_thermo_smoke.py`.
        2. Use `transformers` with a tiny model (e.g., `gpt2` or small cached model).
        3. Apply a constraint (e.g., never generate the letter "e").
        4. Verify output length > 10 tokens and no "e" characters.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.smoke.v1"
        - experiment: 1920
        - constraint_violated: bool
        - honest_verdict: "complete: thermodynamics smoke test passed"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1921-dab-sota-live
    title: "Exp 1921: DAB + SOTA GGUF Live Generation benchmark"
    deliverable: results/experiment_1921_dab_sota.json
    gated_on:
      - upstream: exp1920-thermo-constrained-gen
        artifact_field: constraint_violated
        op: '=='
        value: false
    prompt: |
      CONTEXT: The DAB adapter works on small models. Now scale to the mandated SOTA model.
      
      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/dab_adapter.py
        - CLAUDE.md (for SOTA model requirements)

      TASK: Run the DAB adapter using `unsloth/gemma-4-26B-A4B-it-GGUF`.

      CONCRETE STEPS:
        1. Create `scripts/experiment_1921_dab_sota.py`.
        2. Load `unsloth/gemma-4-26B-A4B-it-GGUF` (use llama-cpp-python logit processors if HF is unavailable).
        3. Constrain generation to output valid JSON only.
        4. Verify output schema validity.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.benchmark.v1"
        - experiment: 1921
        - model_specs: {{target_model: "unsloth/gemma-4-26B-A4B-it-GGUF"}}
        - output_valid_json: bool
        - honest_verdict: "complete: DAB scaled to SOTA"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1922-cem-architecture-design
    title: "Exp 1922: Compositional Energy Minimization (CEM) Architecture Design"
    deliverable: results/experiment_1922_cem_design.json
    agent_type: gemini
    prompt: |
      CONTEXT: We must chain multiple EBM constraints sequentially to reduce hallucinations in long-horizon reasoning.
      
      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/dab_adapter.py

      TASK: Design the CEM architecture that allows composing multiple DAB processors (e.g., SyntaxEBM + SemanticsEBM).

      CONCRETE STEPS:
        1. Create `openspec/change-proposals/cem-architecture.md`.
        2. Explain how to combine energies (e.g., sum, max, or learned temperature).
        3. Save a JSON artifact confirming completion.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.design.v1"
        - experiment: 1922
        - design_file: "openspec/change-proposals/cem-architecture.md"
        - honest_verdict: "complete: CEM designed"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1923-cem-poc-3sat
    title: "Exp 1923: CEM Proof of Concept on 3-SAT (Local SOTA)"
    deliverable: results/experiment_1923_cem_poc.json
    gated_on:
      - upstream: exp1922-cem-architecture-design
        artifact_field: design_file
        op: 'contains'
        value: "cem-architecture.md"
    prompt: |
      CONTEXT: We test CEM by composing clause-level EBMs to solve a 3-SAT formula.
      
      EXISTING CODE TO READ FIRST:
        - openspec/change-proposals/cem-architecture.md

      TASK: Use SOTA GGUF + CEM composed adapters to sample satisfying assignments for a 3-SAT problem.

      CONCRETE STEPS:
        1. Create `scripts/experiment_1923_cem_3sat.py`.
        2. Define a small 3-SAT problem (10 variables, 20 clauses).
        3. Create 20 independent Clause-EBMs and compose them using CEM.
        4. Target: Find a valid assignment with 0 energy.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.poc.v1"
        - experiment: 1923
        - model_specs: {{target_model: "unsloth/gemma-4-26B-A4B-it-GGUF"}}
        - 3sat_solved: bool
        - total_energy: float
        - honest_verdict: "complete: 3-SAT solved with CEM"

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

