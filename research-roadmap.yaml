           write honest_verdict 'blocked_suspicious_duration_too_short' and exit.
         Record: duration_s (= total_elapsed), reproducibility_checksum (md5 of gguf_path + n_responses + random_seed + energy_mean).

      5. FoVer diagnostic baseline (no GGUF — just verifier on FoVer examples):
         Load 5 FoVer examples (correct + incorrect pairs). Run pipeline.verify() on each.
         Record: fover_energies (list of 5 floats), fover_non_zero (bool = any > 0.0).

      6. Write results/experiment_2752_verifier_live_gpu_v3.json.

