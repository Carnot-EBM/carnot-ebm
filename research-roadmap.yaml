milestone: "2026.08.553"
milestone_title: "Evidence-Complete Energy and Safe Online Memory"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp6424-v553-terminal-handoff-and-queue-preflight
    milestone: "2026.08.553"
    deliverable: results/experiment_6424_v553_terminal_handoff_and_queue_preflight.json
    title: "V552 terminal evidence handoff and V553 queue preflight"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 100
    estimated_wall_time_min: 90
    agent_type: claude
    model: opus
    prior_failures:
      - experiment_id: exp6404-v551-terminal-handoff-and-queue-preflight
        verdict: "complete_blocked_v551_queue_incomplete: active V551 queue has 6 of 12 expected tasks; V550 evidence preserved without roadmap or conductor edit"
        addressed_by: "V553 is pre-staged as one complete twelve-task queue and this handoff begins from all fourteen terminal V552 artifacts instead of an incomplete active queue."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      All fourteen tasks in milestone 2026.08.552 are terminal. Exp6413 preserved authenticated local CUDA receipts for the three mandated GGUF families. Exp6414 and Exp6417 are current adversarial failures because their duration evidence is below the declared substrate floor. Exp6420 nullified the prospective CSL claim after eight row-recomputation mismatches, raw-output reuse, cache resurrection, and underpowered cells. Exp6421 and Exp6422 preserve only an internal default-off ARC policy-influence result with no solve claim. Milestone 2026.08.553 has twelve tasks and must preserve those boundaries. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6410_v552_terminal_handoff_and_queue_preflight.json through {project_root}/results/experiment_6423_v552_adversarial_capstone.json
      - {project_root}/ops/conductor-log.md, {project_root}/ops/status.md, {project_root}/ops/changelog.md, and {project_root}/ops/known-issues.md
      - {project_root}/research-complete.yaml, {project_root}/ops/exclusion_manifest.yaml, {project_root}/ops/north-star.md, and {project_root}/ops/arc_solve_registry.yaml
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/exclusion_manifest_lint.py

      TASK
      Create an exact V552-to-V553 evidence handoff and preflight the complete twelve-task V553 queue. Preserve artifact verdicts, conductor outcomes, current adversarial findings, and scientific eligibility as separate facts. Do not rewrite a historical determination. Do not alter the active roadmap or conductor.

      CONCRETE STEPS
      0. Hash the active and next roadmaps, milestone document, conductor, exclusion manifest, known issues, north star, solve registry, claim records, and all V552 terminal artifacts and sidecars. Record available CPU, RAM, disk, GPU, and model-cache state without starting research compute.
      1. Summarize Exp6410 through Exp6423 with scripts/summarize_artifact.py. Record their honest verdict, conductor outcome, current flag state, duration, substrate, and claim eligibility.
      2. Preserve the Exp6414 and Exp6417 duration flags, the Exp6420 CSL null, and the Exp6421/6422 no-solve boundary. Do not infer eligibility from an upstream positive summary.
      3. Validate twelve unique V553 IDs, deliverables, order, agent/model routes, structured gates, gate field types, prior-failure entries, and absence of retired ID reuse or retired dependency chains.
      4. Check every prompt for CONTEXT, EXISTING CODE TO READ FIRST, TASK, CONCRETE STEPS, {project_root}, {date}, a Run command, and the exact final prohibition line.
      5. Check every LLM task for MODEL_SPECS, cached_sota_pair(), at least one mandated GGUF ID, embedded tokenizers, no AutoTokenizer, fresh raw-output requirements, and no legacy headline model.
      6. Confirm the ARC task claims no game or level solve, does not update the solve registry, and uses the canonical live path without game source, exhaustive ground-truth search, or a per-game adapter.
      7. Add or update applicable REQ-* and SCENARIO-* entries before implementation. Write focused tests. Run schema, prior-failure, gate, exclusion, spec-coverage, adversarial, determination-preservation, artifact-convention, and root-clutter checks.
      8. Write the artifact atomically. If the queue is incomplete or a required contract is malformed, fail closed with blocked_reason naming the exact task and field.

      Required deliverable: {project_root}/results/experiment_6424_v553_terminal_handoff_and_queue_preflight.json.
      REQUIRED ARTIFACT FIELDS:
      status, v552_active_roadmap_path_and_hash, v552_task_ids, v552_terminal_artifacts_and_sidecars_by_task, v552_artifact_verdicts, v552_conductor_outcomes, v552_current_adversarial_findings, v552_scientific_claim_eligibility_by_task, exp6414_6417_6420_6421_6422_boundary, v553_milestone_doc_and_queue_hashes, v553_task_ids, v553_id_and_deliverable_checks, v553_dependency_and_gate_checks, v553_gate_field_cross_reference_checks, v553_prior_failure_checks, v553_exclusion_manifest_checks, v553_agent_model_and_llm_policy_checks, v553_arc_no_solve_checks, prompt_contract_checks, active_roadmap_modified, conductor_modified, solve_registry_modified, protected_files_unchanged, blocked_reason, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      field_principles must map every required field and gate to its purpose. field_provenance must classify every field as measured, derived, constant, or upstream. Set verifier_is_oracle=false. honest_verdict must begin with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6424_v553_terminal_handoff_and_queue_preflight --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6425-recurring-gate-block-root-cause
    milestone: "2026.08.553"
    deliverable: results/experiment_6425_recurring_gate_block_root_cause.json
    title: "Recurring blocked-gate root cause and diagnostic contract"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 100
    estimated_wall_time_min: 150
    agent_type: claude
    model: opus
    prior_failures:
      - experiment_id: exp6393-arc-scalar-gate-metric-contract
        verdict: "complete: scalar_gate_metric_contract_ready_no_live_route_or_solve_claim"
        addressed_by: "This task analyzes the full 31-occurrence cross-milestone blocker population and adds failed-gate diagnostics; it is not another scalar ARC gate contract."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      ops/known-issues.md records one mandatory-next issue: blocked_gate_check_failed stopped 31 tasks across milestones 2026.08.536 through 2026.08.549, but the artifacts did not identify the failed gate. A correct refusal is useful. A recurring refusal with no diagnostic is unattended failure. This task investigates the lineage. It must not rerun the blocked experiments or modify the conductor. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/ops/known-issues.md section "recurring blockers nobody has investigated"
      - {project_root}/scripts/recurring_blocker_ledger.py, {project_root}/scripts/conductor_gates.py, and {project_root}/python/carnot/terminal_artifacts.py
      - {project_root}/scripts/artifact_convention_audit.py and {project_root}/scripts/verdict_row_consistency_lint.py
      - all artifacts named by a fresh scripts/recurring_blocker_ledger.py run, including {project_root}/results/experiment_6188_livecodebench_headroom_audit.json
      - the matching roadmap tasks in {project_root}/research-complete.yaml and previous roadmap documents
      - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/conductor-log.md
      - relevant OpenSpec capability files for any shared producer changed

      TASK
      Diagnose every recent blocked_gate_check_failed occurrence. Classify correct scientific refusals separately from missing artifacts, field-name drift, field-type drift, stale reads, retired dependencies, and diagnostic loss. Implement the smallest shared producer or artifact-contract fix outside scripts/research_conductor.py when a code defect is proved. If every block is correct, preserve it and add exact failed-gate diagnostics.

      CONCRETE STEPS
      0. Run a read-only preflight for repository state, CPU, RAM, disk, artifact availability, and current lint health. Freeze the blocker population before classification.
      1. Rebuild the recurring-blocker ledger. Bind every occurrence to milestone, task ID, upstream ID, gate field, operator, expected type, observed value or absence, and terminal artifact.
      2. Re-evaluate each structured gate with scripts/conductor_gates.py in read-only mode. Do not infer a gate from title prose when a structured gate exists.
      3. Classify each row as correct_expected_refusal, missing_upstream, wrong_field_name, wrong_field_type, stale_artifact, retired_dependency, diagnostic_loss, or other_with_evidence.
      4. Trace the highest-count root cause to its producer. If a shared code defect exists outside the conductor, add or update its OpenSpec requirement, write tests first, and implement the smallest repair. Do not bypass a scientific gate.
      5. Require blocked artifacts to expose blocked_reason, failed upstream, field, operator, expected value, observed value, and evidence path. Preserve old artifacts unchanged.
      6. Mutation-test missing fields, strings in numeric gates, NaN, stale hashes, retired upstream IDs, and contradictory status fields. Each case must fail closed with a specific diagnostic.
      7. Run focused unit tests, spec coverage, gate audit, exclusion lint, artifact convention audit, determination preservation, and root-clutter checks. Do not rerun any historical research task.
      8. Write one per-occurrence row and an aggregate root-cause decision. If the root cause remains unknown, return a complete_null verdict with the unresolved evidence listed.

      Required deliverable: {project_root}/results/experiment_6425_recurring_gate_block_root_cause.json.
      REQUIRED ARTIFACT FIELDS:
      status, frozen_blocker_population_receipt, blocker_count_by_milestone, per_unit_rows, per_occurrence_task_upstream_field_op_expected_observed_type_hash_and_artifact_bindings, root_cause_class_counts, correct_expected_refusal_count, infrastructure_defect_count, diagnostic_loss_count, highest_count_root_cause, source_trace, shared_fix_applied, changed_files_and_hashes, no_scientific_gate_bypassed, no_historical_task_rerun, blocked_diagnostic_contract, mutation_attack_matrix, recurring_gate_diagnostic_ready_score, protected_files_unchanged, blocked_reason, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=false. Gate evaluation is deterministic contract checking, not semantic truth. field_principles must map every classification, repair decision, and readiness score. per_unit_rows must contain one row per blocker occurrence. honest_verdict must begin with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6425_recurring_gate_block_root_cause --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6426-task-scoped-runtime-receipt-contract
    milestone: "2026.08.553"
    deliverable: results/experiment_6426_task_scoped_runtime_receipt_contract.json
    title: "Task-scoped runtime, GPU, concurrency, and runner receipt contract"
    priority: critical
    track: infrastructure
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 180
    agent_type: claude
    model: opus
    prior_failures:
      - experiment_id: exp6170-v535-task-artifact-isolation-canary
        verdict: "complete_partial: Exp6169-Exp6182 declared .535 canary surface ready_score=0, isolation_violation_count=1, repository_wide_closure_claimed=false."
        addressed_by: "The new contract authenticates per-task phases, PIDs, runners, GPU samples, concurrency, and raw bytes across success, block, interruption, and powered controls instead of testing artifact-file isolation alone."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The V552 retrospective could not attribute phase time, GPU samples, model concurrency, or runner selection to individual tasks. Exp6414 and Exp6417 then failed current duration checks. V553 needs one reusable contract before another powered claim. This task validates that contract with one mandated local GGUF smoke and deterministic CPU, blocked, and interrupted controls. It must not modify scripts/research_conductor.py. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6413_authenticated_sota_gguf_execution_receipts.json and source
      - {project_root}/results/experiment_6414_fresh_three_family_factor_event_corpus.json and {project_root}/results/experiment_6417_authentic_write_time_factor_admission_ab.json
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/scripts/adversarial_verify.py and its duration/substrate rules
      - existing process, nvidia-smi, llama.cpp, telemetry, runner-selection, and receipt helpers
      - {project_root}/openspec/capabilities/verification/spec.md and relevant runtime specs

      TASK
      Build and validate a reusable task-scoped runtime receipt contract. MODEL_SPECS must include unsloth/gemma-4-26B-A4B-it-GGUF from cached_sota_pair(). Use its embedded GGUF tokenizer and never call AutoTokenizer. Capture enough evidence to attribute a powered result to one task without trusting a model-name string or aggregate GPU sample.

      CONCRETE STEPS
      0. Preflight both RTX 3090 devices, free VRAM, model cache, llama.cpp CUDA support, runner binary, tokenizer metadata, disk, CPU, RAM, and monotonic clock. If the powered smoke cannot run, fail closed with blocked_reason and still test CPU, blocked, and interrupted paths.
      1. Define a versioned receipt schema with task ID, phase, monotonic start/end, wall-clock start/end, parent and child PIDs, command/config/model hashes, runner selection, device IDs, concurrency group, raw-output hash, exit status, and attribution confidence.
      2. Add a narrow reusable helper outside the conductor. Make it write atomically and preserve partial receipts after interruption.
      3. Run four controls: deterministic CPU success, explicit preflight block, interrupted child process, and one real mandated GGUF CUDA smoke. Record MODEL_SPECS, cached_sota_pair(), embedded tokenizer, raw bytes, first-token or completion evidence, and PID-linked nvidia-smi samples.
      4. Recompute task duration from phase intervals. Reject negative, overlapping-unexplained, missing, synthesized, or wall-clock-only intervals. Separate queue wait, model load, generation, exact verification, and artifact write.
      5. Attack forged PID, stale nvidia sample, model-name-only substitution, raw-output reuse, runner swap, clock rollback, truncated receipt, concurrency collision, CPU fallback, and child exit omission.
      6. Add or update REQ-* and SCENARIO-* entries. Write focused tests. Run the real runtime smoke plus unit, E2E, spec-coverage, adversarial, determination-preservation, and root-clutter checks.
      7. Set runtime_receipt_contract_ready_score=1.0 only when all four control paths are represented, the powered path is authentic, every phase recomputes, and all critical attacks fail closed.

      Required deliverable: {project_root}/results/experiment_6426_task_scoped_runtime_receipt_contract.json.
      REQUIRED ARTIFACT FIELDS:
      status, receipt_schema_version_and_hash, helper_source_and_test_hashes, MODEL_SPECS, models_used, cached_sota_pair_receipts, model_file_and_embedded_tokenizer_hashes, autotokenizer_usage_count, runner_binary_and_selection_receipts, device_inventory_and_preflight_receipts, per_unit_rows, cpu_blocked_interrupted_and_powered_control_rows, per_phase_monotonic_and_wall_clock_receipts, parent_child_pid_and_exit_receipts, pid_linked_gpu_samples, concurrency_group_receipts, command_config_model_and_raw_output_hashes, synthesized_runtime_field_count, cpu_fallback_count, attribution_failure_count, recomputed_duration_s, reported_vs_recomputed_duration_delta, attack_matrix, runtime_receipt_contract_ready_score, current_adversarial_findings, protected_files_unchanged, blocked_reason, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=false. Process and hash checks authenticate execution but do not prove semantic correctness. field_principles must map every receipt component, attack, and readiness score. per_unit_rows must contain one row per control and phase. honest_verdict must begin with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6426_task_scoped_runtime_receipt_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6427-fresh-constraint-saturation-factor-corpus
    milestone: "2026.08.553"
    deliverable: results/experiment_6427_fresh_constraint_saturation_factor_corpus.json
    title: "Gated on Exp6426 readiness: fresh row-recomputable constraint-saturation factor corpus"
    priority: critical
    track: verification
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 360
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6426-task-scoped-runtime-receipt-contract
        artifact_field: runtime_receipt_contract_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6414-fresh-three-family-factor-event-corpus
        verdict: "complete: fresh three-family factor-event corpus is sealed and exact-checker bound"
        addressed_by: "This attempt uses task-scoped monotonic phase receipts, fresh unique raw bytes, per-unit rows, and constraint-count strata; it cannot inherit Exp6414 timing or outputs."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6414 created a useful three-family corpus but is adversarial-flagged because its 48.151455055-second duration is below the declared 60-second live-model floor. The exact rerun question is whether a fresh corpus can preserve the scientific structure with clean execution evidence. arXiv:2608.12426 adds a new axis: simultaneous constraint count can cause a phase transition in joint success even when per-constraint results degrade gradually. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6426_task_scoped_runtime_receipt_contract.json and receipt helper
      - {project_root}/results/experiment_6413_authenticated_sota_gguf_execution_receipts.json
      - {project_root}/results/experiment_6414_fresh_three_family_factor_event_corpus.json, sidecars, source, and tests
      - {project_root}/research-references.md V553 entry for arXiv:2608.12426
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - exact factor-event checkers and relevant verification and continuous-learning specs

      TASK
      Create a new factor-event corpus with fresh local-model outputs and immutable per-unit rows. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF from cached_sota_pair(). Use embedded GGUF tokenizers only. Never call AutoTokenizer. Stratify by factor family, model family, simultaneous constraint count, and interaction class. Exact rules score each constraint and joint satisfaction.

      CONCRETE STEPS
      0. Revalidate the Exp6426 gate, GPUs, VRAM, model bytes, embedded tokenizers, runner, receipt helper, exact checkers, licenses, disk, source manifests, and absence of the new raw-output directory before generation.
      1. Pre-register at least 144 cells balanced across three models, three factor families, constraint-count buckets 1-2, 3-4, 5-6, and 7-8, independent versus interacting constraints, and fixed seeds. Seal acquisition, calibration, and untouched future partitions.
      2. Generate every event through the task-scoped receipt helper. Give each event a unique prompt hash, raw-output byte hash, model hash, PID, GPU sample binding, event time, and source identity. Do not reuse Exp6414 bytes or a raw output across event IDs.
      3. Parse only the factor proposal surface. This is not a finite-ID generated-answer, grammar, parser-retry, hidden-state, or external-text-scoring experiment.
      4. Run deterministic per-constraint and joint exact checks. Record evaluable, correct, abstained, malformed, truncated, duplicate, unsupported, and unlicensed outcomes without model pooling.
      5. Write per_unit_rows before computing any aggregate. Recompute per-constraint success, joint success, exact yield, abstention, and cost by model, family, constraint count, and interaction class from those rows.
      6. Attack model substitution, raw-output reuse, prompt leakage, event reordering, source fabrication, checker swap, duplicated effects, pooled identities, CPU fallback, clock truncation, future-label leakage, and adversarial duration under-reporting.
      7. Add or update REQ-* and SCENARIO-* entries. Write focused tests. Run live inference E2E, row-recomputation, spec coverage, adversarial verification, determination preservation, artifact convention audit, and root-clutter checks.
      8. Set fresh_row_recomputable_factor_corpus_ready_score=1.0 only when all three model families have authentic cells, every aggregate recomputes from rows, protected leakage and raw-output reuse are zero, all attacks fail closed, and current_adversarial_flag_count=0.

      Required deliverable: {project_root}/results/experiment_6427_fresh_constraint_saturation_factor_corpus.json.
      REQUIRED ARTIFACT FIELDS:
      status, exp6426_gate_receipt, MODEL_SPECS, models_used, cached_sota_pair_receipts, model_file_and_embedded_tokenizer_hashes, autotokenizer_usage_count, runner_and_task_scoped_runtime_receipts, manifest_path_hash_counts_balance_and_partition_seals, preregistered_model_family_constraint_count_interaction_and_seed_matrix, per_unit_rows, per_row_prompt_raw_output_model_pid_gpu_source_license_checker_event_time_and_partition_bindings, per_row_constraint_results_and_joint_exact_outcome, per_model_family_constraint_count_and_interaction_results, per_constraint_success, joint_success, exact_yield, abstention_rate, malformed_count, truncation_count, duplicate_count, raw_output_reuse_count, cpu_fallback_count, protected_leakage_count, aggregate_recomputation_receipts, reported_vs_recomputed_deltas, task_phase_duration_receipts, attack_matrix, fresh_row_recomputable_factor_corpus_ready_score, current_adversarial_flag_count, harm_underpowered_missing_and_flagged_cells, protected_files_unchanged, blocked_reason, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for deterministic per-constraint and joint exact checks. Model output and factor proposals are not oracles. field_principles must map the gate, each stratum, every aggregate, the flag count, and readiness score. per_unit_rows is required because this task makes comparative claims. honest_verdict must begin with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6427_fresh_constraint_saturation_factor_corpus --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6428-clean-write-time-factor-admission-ab
    milestone: "2026.08.553"
    deliverable: results/experiment_6428_clean_write_time_factor_admission_ab.json
    title: "Gated on Exp6427 clean corpus: exact write-time factor admission A/B"
    priority: critical
    track: self-learning
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 180
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6427-fresh-constraint-saturation-factor-corpus
        artifact_field: fresh_row_recomputable_factor_corpus_ready_score
        op: "=="
        value: 1.0
      - upstream: exp6427-fresh-constraint-saturation-factor-corpus
        artifact_field: current_adversarial_flag_count
        op: "=="
        value: 0
    prior_failures:
      - experiment_id: exp6417-authentic-write-time-factor-admission-ab
        verdict: "complete: authentic exact admission improved future yield without contamination or retention harm"
        addressed_by: "This attempt consumes only clean Exp6427 rows, writes per-unit arm outcomes before aggregates, and measures real monotonic execution time instead of an implausible near-zero duration."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6417 reported a positive future-yield delta but remains adversarial-flagged because duration_s=2.7e-07 is implausible for its declared deterministic replay. Exp6423 names a clean rerun of the corpus plus admission A/B as the next falsifiable factor question. This task uses no new model generation. It consumes only a clean Exp6427 corpus and tests untouched future value. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6427_fresh_constraint_saturation_factor_corpus.json and immutable rows
      - {project_root}/results/experiment_6417_authentic_write_time_factor_admission_ab.json, source, sidecars, and tests
      - {project_root}/results/experiment_6416_selective_exact_refinement_ab.json
      - {project_root}/python/carnot/experiment_6397_transactional_continuous_factor_learning.py and factor lifecycle code
      - {project_root}/scripts/adversarial_verify.py and {project_root}/scripts/artifact_convention_audit.py
      - {project_root}/openspec/capabilities/continuous-learning/spec.md and {project_root}/openspec/capabilities/self-learning/spec.md

      TASK
      Run a chronological frozen versus write-everything versus exact-admission A/B over the clean Exp6427 rows. Exact support, source provenance, predecessor freshness, license validity, unique effect, and protected retention control commits. Upstream model outputs remain evidence only. Write all per-unit arm outcomes before aggregate calculation.

      CONCRETE STEPS
      0. Revalidate both structured gates, corpus row hashes, task receipts, event order, partitions, exact checkers, licenses, initial heads, disk, CPU, RAM, and untouched future seal.
      1. Freeze acquisition, retention, and future partitions. Prove future outcomes were unavailable when each proposal and disposition was recorded.
      2. Run frozen, write-everything, and exact-admission arms at matched row order, evidence, checker calls, consumer budget, and initial head. Measure the full task with monotonic phase clocks.
      3. Bind every proposal to raw event, model, prompt, source, license, checker, predecessor, expiry, supersession, and refinement hashes.
      4. Atomically record Commit, Reject, Quarantine, or Defer. Contradicted, implicit, stale, duplicate, replayed, superseded, poisoned, malformed, and unlicensed rows must fail closed.
