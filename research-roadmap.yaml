          data/arc_transition_corpus/*.npz (14,628 self-captured transitions, 25 public games) are LOCAL on
          disk (outer-loop commits 352ebc043 + bdbe369e4). This attempt also re-aims the TARGET: the outer-loop
          arc_pretrain_prior used this same corpus but predicted exact next-cell DYNAMICS and scored 0% accuracy
          (warm_wins 0/5, both scratch and warm). This task targets the COARSE clickability/action-effect signal
          (click_heatmap + per-action frame-change probability) and is measured by ACTIONS-TO-FIRST-LEVELUP (the
          leaderboard scoring lever), NOT exact-cell dynamics accuracy -- the StochasticGoose/Tufa framing.'
        retire_if_same_verdict: true
    prompt: |
      CONTEXT ({date}, ARC sprint HEADLINE -- the operator-flagged #1 score lever). The ARC-AGI-3 leaderboard
      metric is ACTION EFFICIENCY on first contact (min(human/agent,1)^2, arXiv:2603.24621); the leader
      StochasticGoose/Tufa Labs (12.58%) and the top public agents all win on a learned CNN action-effect /
      clickability predictor -- they predict which actions/clicks cause a FRAME CHANGE so the agent stops
      wasting the budget on no-ops ("wasted ~350 moves clicking with no result, then exploited the learned
      clickability map"). Our agent is effect-blind (centroid-click + RESET-replay). The .421 A6 proved the
      bottleneck is candidate GENERATION, not ranking: a verifier can't promote a winner that was never
      generated. A better-ORDERED explorer puts the winner in the pool earlier.

      THE BLOCKER IS CLEARED: exp4490 was blocked_human_replay_corpus_not_cached; the corpus is now LOCAL
      (data/arc_public_demo_human_replay_corpus, 14,672 rows; data/arc_transition_corpus/*.npz, 14,628 rows).
      THE TARGET IS RE-AIMED: the outer-loop arc_pretrain_prior predicted exact next-cell DYNAMICS and got 0%;
      this task predicts the COARSE clickability/action-effect signal and is measured by actions-to-first-levelup.
      This is a LEARNED action-model -- a different paradigm that COMPLEMENTS the verifier thesis (it makes the
      tier-1 explorer action-efficient; the verifier still routes+grounds). NO LLM, zero quota (CPU/iGPU CNN).

      EXISTING CODE TO READ FIRST:
        - {project_root}/docs/research-notes/arc-frame-change-predictor-spec.md (THE SPEC -- architecture, target, gate)
        - {project_root}/docs/research-notes/arc-human-replay-application-spec.md (the replay corpus format frame_action_delta.v1)
        - {project_root}/python/carnot/agentic/arc_human_replay_corpus.py + {project_root}/python/carnot/agentic/arc_transition_capture.py (TransitionCorpus.load ~116, ingest_human_replays ~144 -- the LOCAL corpora loaders)
        - {project_root}/python/carnot/agentic/arc_graph_explore.py (rich_action_candidates ~44 -- the RANKING slot; graph_explore_solve_v2 ~231 -- the explorer)
        - {project_root}/python/carnot/experiment_4490_human_replay_frame_change_predictor.py (the blocked predecessor -- reuse its scaffold now the corpus is local)
        - {project_root}/python/carnot/experiment_4550_honest_sprint_metric.py (measure_generic_transfer_over_variants ~190 -- reuse for the held-out variant metric)
        - {project_root}/results/arc_pretrain_prior.json (the 0% exact-dynamics null -- the WRONG target this corrects)

      TASK: train a small CNN predict(frame)->(click_heatmap[H,W], directional_change[5]) self-supervised on
      the LOCAL corpora (label = did the action change the frame (binary) + where); wire it into
      rich_action_candidates to RANK candidates by predicted frame-change; measure median actions-to-first-
      levelup WITH vs WITHOUT (blind BFS) on held-out games/variants + generic_transfer; verifier_is_oracle:
      false. Honest null if ranking does not reduce actions.

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
           b. `.venv/bin/python -c "import torch; print(torch.__version__)"` exits 0.
