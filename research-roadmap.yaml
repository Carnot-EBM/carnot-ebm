- id: exp1201-wopr-nonogram-cartridge
  milestone: 2026.04.93
  deliverable: results/experiment_1201_wopr_nonogram_cartridge.json
  title: "WOPR Nonogram (Picross) Game Cartridge — Row/Column Run-Length Constraints"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 20
  priority: medium
  requires_gpu: false
  prompt: |
    CONTEXT:
    WOPR is Carnot's game cartridge gallery — each puzzle is encoded as an Ising EBM where
    E=0 at a valid solution. Existing cartridges: Hex (exp1188), Connect Four (exp1175),
    Hashi (exp1124), N-Queens (exp1097), Slitherlink (exp1141).

    Nonogram (Picross) is a classic constraint-satisfaction puzzle:
    - Binary grid of size NxN (each cell = filled or empty)
    - Each row has a "clue" = ordered list of run lengths (e.g., [3, 1, 2] means the row
      has a run of 3 filled cells, then gap, then 1 filled cell, then gap, then 2 filled cells)
    - Same for each column
    - The unique valid grid satisfying all row and column clues is the solution

    Constraint encoding for Ising:
    - Spin x_ij = +1 (filled) or -1 (empty) for each cell (i,j)
    - Row constraint energy: for row i with clue [l1, l2, ...]:
      E_row_i = (sum of spins in row i must form runs matching [l1, l2, ...])
      Exact match is hard to encode directly; approximate as:
      E_row_i = ||actual_runs_row_i - target_runs_row_i||^2
      where actual_runs = RLE(spin signs in row i)
    - E_total = Σ_i E_row_i + Σ_j E_col_j
    - E=0 iff all row and column clues are satisfied

    EXISTING CODE TO READ FIRST:
    - python/carnot/games/hex.py (Hex cartridge from exp1188 — follow this structure)
    - python/carnot/games/__init__.py (how games are registered)

    TASK:
    1. Implement python/carnot/games/nonogram.py:
       - class NonogramPuzzle: stores grid_size, row_clues, col_clues, initial_spins
       - class NonogramIsingEBM: energy(spins) using run-length matching
         - Helper: compute_runs(spin_row) → list of run lengths
         - Helper: run_length_mismatch(actual_runs, target_runs) → int (edit distance)
         - energy = Σ_i run_length_mismatch(row_i) + Σ_j run_length_mismatch(col_j)
       - class NonogramSolver: uses ParallelIsingSampler to minimize energy
       - class NonogramEasterEgg: a hidden state (all filled grid, all empty grid, etc.)

    2. Register in python/carnot/games/__init__.py.

    3. Generate a 5x5 Nonogram puzzle with known solution (for testing):
       Example: 5x5 grid with row clues [[1,1],[3],[1],[2,1],[5]] and matching col clues
       Verify E=0 at the known solution.

    4. Run the Ising solver from random initialization and measure:
       - convergence_energy (final E after sampling)
       - convergence_steps (MCMC steps to reach E<0.5)
       - is_valid_solution (final spins satisfy all clues)

    5. Write tests in tests/python/test_nonogram_cartridge.py:
       - test_energy_zero_at_solution: verify E(known_solution)=0
       - test_energy_nonzero_at_random: verify E(random)>0 with high probability
       - test_solver_converges: verify solver reduces energy from initial

    6. Write results artifact.

    CONCRETE STEPS:
    - cat python/carnot/games/hex.py | head -60 2>&1  # understand the structure
    - cat python/carnot/games/__init__.py 2>&1
    - [Implement python/carnot/games/nonogram.py]
    - [Register in __init__.py]
    - python3 -c "
      from carnot.games.nonogram import NonogramPuzzle, NonogramIsingEBM, NonogramSolver
      p = NonogramPuzzle.from_clues(5, row_clues=[[1,1],[3],[1],[2,1],[5]], col_clues=[[3],[1,1],[2,1],[1,2],[2,1]])
      ebm = NonogramIsingEBM(p)
      print('E at solution:', ebm.energy(p.solution_spins))
      solver = NonogramSolver(ebm)
      result = solver.solve()
      print('solver result:', result.convergence_energy, result.is_valid_solution)
      " 2>&1
    - pytest tests/python/test_nonogram_cartridge.py -v 2>&1 | tail -20
    - Write results/experiment_1201_wopr_nonogram_cartridge.json

    REQUIRED ARTIFACT FIELDS:
    - nonogram_module_shipped: bool
    - energy_at_solution: float (must be 0.0)
    - energy_at_random: float (must be > 0.0)
    - solver_convergence_energy: float
    - solver_is_valid_solution: bool
    - solver_convergence_steps: int
    - n_tests_pass: int (must be 3)
    - registered_in_game_gallery: bool
    - nonogram_cartridge_shipped: bool (True iff nonogram_module_shipped AND energy_at_solution==0.0 AND n_tests_pass==3)
    - honest_verdict: "nonogram_shipped_e0_at_solution" | "partial_implementation_e_not_zero" | "blocked"

    Run: pytest tests/python/test_nonogram_cartridge.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

