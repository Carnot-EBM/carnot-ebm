    2. Read the .104 roadmap, conductor log, changelog/status, and result artifacts for exp1337 through exp1350.
    3. Record artifact_paths_checked and list missing_artifacts explicitly, including exp1340 if no terminal artifact exists.
    4. Classify stale_or_blocked_artifacts without rewriting them.
    5. Set gates_open only for branches that have terminal upstream evidence; keep semantic validator, scheduler, DVI, and GRPO gates closed if exp1340/semantic artifacts are missing.
