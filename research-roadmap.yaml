    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/python/carnot/experiment_7358_v646_validation_contract.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/validate_prior_failures.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/python/carnot/experiment_7369_v647_contract.py
    - {project_root}/python/carnot/experiment_7329_v644_contract.py
    - {project_root}/research-references.md
    - {project_root}/research-studying.md
    - {project_root}/results/experiment_7380_v647_capstone.json

    TASK:
    Produce results/experiment_7381_v648_contract.json. Create scripts/experiments/experiment_7381_v648_contract.py as a thin executable entrypoint. Reusable behavior belongs in python/carnot/experiment_7381_v648_contract.py only when needed; reuse shipped helpers without copying whole launchers. Add meaningful spec-linked tests in tests/python/test_experiment_7381_v648_contract.py before implementation. No experiment is executed by the planner.
    No structured prerequisite. Account for unavailable inputs without inventing results; labeled historical diagnosis is allowed.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print and flush immediately. Read the driving capability and confirm REQ-* exists; add specific requirements and failing tests before implementation. Check exact inputs before dependent work. For gates reject missing, quarantined, blocked, partial or disqualified science and emit terminal blocked_* with gate_check_summary. Historical diagnostic inputs are never promoted into current readiness. Scratch belongs in /tmp, never the repository root.
    1. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER any model load, generation, benchmark or subprocess that can take minutes. Inside EVERY long loop emit completed units and monotonic elapsed at least every 60 seconds. Stream subprocess output unbuffered and emit truthful pending-operation heartbeats every 60 seconds while a blocking call runs. Keep EVERY silence gap below 600 seconds, including authoring and validation: a silent task can die at 1200 seconds; continued progress permits the 4800-second hard cap. Checkpoint work and cancel only owned operations on timeout; never pad elapsed time.
    2. Declare inference_substrate_class=aggregation, execution_venue=host, MODEL_SPECS=[], model_invoked=false and zero CURRENT LLM invocation counts. Record actual CPU/JAX work and any small Gibbs fitting in small_ebm_training; that is not a 27B model load. No LLM is needed. Historical model receipts retain their original hash, class and flag in labeled sidecars. Never reload a model to inflate this task.
    3. Choose the staged YAML only when milestone is exactly 2026.09.648; otherwise select the active YAML only if it has that milestone. Parse the single Exact Task Contract table independently. Compare all fourteen IDs, order, titles, paths, phases, substrate classes and gates. The exact range is exp7381 through exp7394.
    4. Use the existing schema, gate and exclusion audits. Reject retired dependency chains. Check every prior-failure entry has all four fields. Mutate private copies: missing/reordered task, wrong milestone/path/title/phase/substrate, missing producer field and missing retirement flag. Each must fail the relevant check.
    5. Ingest the dated V648 source review into research-studying.md. Record source-to-method links for SHIP, CalArena, CalVerT, online calibration and thermodynamic learning. Make one bounded source-delta check. Preserve unavailable-source diagnostics. Do not alter the frozen task roster or claim a full Semantic Scholar citation census.
    6. Check the archived V647 design hash against its preserved copy. Record that research-complete.yaml still ends at V646 in the planning snapshot; use V647 terminal artifacts and conductor records to fill the evidence boundary. Ledger lag is not a license to rerun completed work.
    7. Emit contract_complete_score=1 only for exact agreement and valid executed checks. Keep science_value_score=0 and promotion_score=0. A contract defect disqualifies this receipt without suppressing independent tasks.
    8. Build the required validation set from the actual Exp7358 scoped command plan, then execute it through Exp7303. Create private --basetemp parents. Require worktree imports, affected pytest -n 0 -o addopts= --no-cov, separate 100% changed-module coverage, scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Preserve command-local COVERAGE_FILE through subprocesses. Apply focused Rust test/fmt/clippy only if Rust changes. Do not append an unexecuted full_python_suite requirement, call an old experiment main(), weaken tests or modify validation guards to pass. Keep unrelated global-health findings separate from required checks.
    9. No numbered E2E applies to this isolated experiment. Execute its declared entrypoint and independently cold-replay its artifact as the capability-level end-to-end check; run any additional applicable checks in ops/e2e-test-plan.md if shared behavior changes.
    10. Independently reload and reduce the candidate raw evidence. Run scripts/adversarial_verify.py on the artifact and scripts/verdict_row_consistency_lint.py --strict. Preserve failed gates and critical findings. Required validation/safety failures disqualify; a valid failed scientific-benefit gate is null, never positive. Missing unchanged external inputs are blocked, never partial. Readiness/value scores stay zero for blocked/disqualified science; completion is not promotion. Write terminal JSON atomically and reconcile relevant OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Keep production defaults, active research-roadmap.yaml and scripts/research_conductor.py unchanged.

    11. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Versioned schema with ordinary top-level experiment_id and milestone."
       - status: principle: "Terminal only after actual work and required validation; no success-shaped bootstrap artifact."
       - run_date: principle: "Use {date} plus actual start/end UTC timestamps."
       - preconditions_checked: principle: "Exact paths, producer identity/hash/class and resource checks before dependent work."
       - MODEL_SPECS: principle: "Include unsloth/Qwen3.8-27B-GGUF for current LLM work; [] for no current LLM work. Record small Gibbs training separately."
       - model_invoked: principle: "True for any attempted current LLM load or generation, even a failed attempt; distinguish small EBM training."
       - invocation_counts: principle: "Attempted/completed/failed/cancelled/in-flight current LLM loads and generations, with raw receipts; no historical calls counted as current."
       - inference_substrate: principle: "Actual CPU/JAX or owned native CUDA computation, device identity and resource lease; historical provenance stays labeled."
       - inference_substrate_class: principle: "Closed class matching the actual current computation and authentic duration; no padding."
       - execution_venue: principle: "Exactly host in V648. This is a closed string, never host_cpu, a device name or a dictionary; put device details in inference_substrate."
       - duration_s: principle: "Measured monotonic duration, never invented time or sleep to meet a floor."
       - phase_spans: principle: "Measured read/build/load/generate/evaluate/validate/write spans and checkpoint timestamps."
       - random_seed: principle: "Frozen experiment and resampling seeds; null only when not applicable."
       - reproducibility_checksum: principle: "Bind exact code, settings, protocol, data/source versions and raw rows."
       - source_artifact_hashes: principle: "Exact producer paths and byte hashes; preserve original verdicts and flags."
       - rows: principle: "Every unit/arm/seed outcome, metric, cost, failure and censoring disposition behind comparative claims."
       - sample_size_budget: principle: "Predeclared planned/attempted/completed/censored/unstarted units, stopping rules and remaining work."
       - acceptance_gate_results: principle: "Expected/observed/operator/passed separated for required validation, safety, completion and scientific efficacy; no equality substituted for >=."
       - gate_check_summary: principle: "Every blocked_* names the failed check/upstream, exact field/path, expected value and observed value, including missing or None."
       - verifier_is_oracle: principle: "True when formal evaluator defines truth; independently coded oracle checks do not remove circularity."
       - honest_verdict: principle: "Completed work uses complete_ or complete: with precise scope; blocked_* names an unavailable prerequisite."
       - verdict_class: principle: "Exactly positive | circular_positive | null | blocked | disqualified | partial. Oracle-positive claims are circular_positive. Only retryable unfinished OWN work is partial; unchanged external absence is blocked."
       - flagged_adversarial: principle: "True for a critical independent finding; excludes producer from readiness gates."
       - validation_receipts: principle: "Executed argv/environment/scope/return code/duration/log hash, including failures and exact required-check list."
       - repository_health: principle: "Dated unrelated failures distinct from required affected checks; never hide affected failures."
       - field_principles: principle: "Explain every output field without wrapping ordinary dictionaries or numeric gate values."
       - promotion_score: principle: "Always zero: no automatic production rollout, generator weight change or external publication."
       - contract_complete_score: principle: "One only when both authorities and all relevant checks agree; advisory, never a science gate."
       - science_value_score: principle: "Always zero for contract work."
       - source_method_rows: principle: "Primary URL, checked date, adopted control or defer reason, and access status."
       - mutation_rows: principle: "Private changed contract and actual rejecting check."

