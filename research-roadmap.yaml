  - id: exp3718-risk-coverage-abstention-characterization
    operator_override: "2026-06-02 outer-loop directive: the ONE sanctioned NEW direction (Depth-retirement note: 'the verifier ensemble's discriminating value where SC is NOT near-optimal'). Forward diff vs the CLOSED selection question (exp3707): this is SELECTIVE PREDICTION / ABSTENTION (a risk-coverage operating envelope for the shipped math-only-with-abstain detector), NOT best-of-N SELECTION-beats-SC. It characterizes the DEPLOYABLE value of the proven 0.9131 discriminator as an energy-based abstention signal (arXiv:2603.21172 'entropy alone insufficient' + AURC). Explicitly NOT a selection re-grind. False-positive scope-match vs prior selection/detector exps."
