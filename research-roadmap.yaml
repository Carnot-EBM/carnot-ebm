    requires_claude: true
    requires_hardware: true
    hardware: "GateMate"
    max_turns: 100
    estimated_wall_time_min: 90
    track: "hardware"
    inference_substrate: "hardware_smoke"
    prior_failures:
      - experiment_id: exp2984-gatemate-readback-smoke-vector
        verdict: "complete: gatemate_no_readback_no_host_smoke_io"
        addressed_by: "Focuses on adding or conclusively testing host-visible IO/readback rather than repeating flash-only evidence."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp 2984 detected and flashed GateMate but produced no host-visible readback or smoke-vector output. The only acceptable .281 hardware advancement is observable IO/readback evidence or a precise blocked diagnosis. No sampler or speedup claim is allowed.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - research-hardware-wishlist.md
      - ops/known-issues.md
      - results/experiment_2984_gatemate_readback_smoke_vector_v4.json
      - any GateMate scripts or RTL under hardware/, fpga/, rtl/, scripts/
      - ops/conductor-log.md entries around exp2984

      TASK:
      Attempt to add or exercise host-visible GateMate readback/smoke-vector IO. If the current bitstream or board wiring cannot expose output, document the exact missing interface and emit a terminal artifact. Do not claim sampling, Boltzmann correctness, thermodynamic behavior, or speedup.

      CONCRETE STEPS:
      0. PRECONDITIONS: identify board connection, toolchain versions, target bitstream/RTL, programmer command, and the intended host-visible IO path before flashing.
      1. Inspect existing GateMate RTL/scripts for UART, GPIO, JTAG, or status-register output options.
      2. Prefer a minimal deterministic smoke vector: write/flash, trigger a simple known state, read or observe host-visible output, and hash the transcript.
      3. If no readback path exists, add the smallest bounded IO shim only if it fits existing patterns; otherwise report the blocked reason without broad refactor.
      4. Capture command transcripts, board identifiers, output bytes/status, and timing only for smoke/readback.
      5. Write the artifact with strict claim boundaries and run any available hardware smoke command.

      REQUIRED ARTIFACT FIELDS:
      - hardware_smoke_boundary_recorded: bool (principle: downstream hardware tasks need an explicit smoke/readback boundary)
      - preconditions_checked: bool (principle: board failures must distinguish setup from design failure)
      - board_detected: bool (principle: board contact must be explicit)
      - flash_attempted: bool (principle: programming attempt must be explicit)
      - flash_succeeded: bool (principle: flash evidence must be separated from readback)
      - readback_attempted: bool (principle: readback absence must be explicit)
      - readback_supported: bool (principle: unsupported readback must block claims)
      - smoke_vector_attempted: bool (principle: smoke output attempt must be explicit)
      - smoke_vector_passed: bool (principle: hardware success must be observable)
      - host_visible_output_path: str (principle: observed output must be inspectable)
      - transcript_paths: list (principle: hardware evidence must be replayable)
      - sampler_claim_made: bool (principle: sampler claims are out of scope)
      - speedup_claim_made: bool (principle: speedup claims require timing/sample evidence not expected here)
      - honest_verdict: str (principle: terminal verdict must state smoke passed, flagged, or blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

