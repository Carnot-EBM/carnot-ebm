- id: exp2564-feasibility-aware-conformal
  title: 'Phase 4a: Feasibility-Aware Conformal Calibration (arXiv:2603.22966 MRL Estimation)'
  milestone: 2026.05.246
  deliverable: results/experiment_2564_feasibility_conformal.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  prior_failures:
  - experiment_id: exp2547-adaptive-conformal-v2-acse
    verdict: 'complete: adaptive_conformal_auroc achieved; no regression from v7b baseline'
    addressed_by: "exp2547 implemented prompt-adaptive calibration (arXiv:2604.13991) with ACSE entropy weighting. This task implements feasibility-aware calibration (arXiv:2603.22966) which is structurally different: it estimates the Minimum Achievable Risk Level (MRL) — a theoretical lower bound on calibration error given finite data and verifier signal strength. MRL estimation would explicitly acknowledge that tier0s/tier0u have low information content on real corpus, and shrink their contribution accordingly. Different paper, different mechanism, different deliverable."
    retire_if_same_verdict: false
  prompt: "CONTEXT: arXiv:2603.22966 'Set-Valued Prediction for LLMs with Feasibility-Aware Coverage Guarantees' introduces the Minimum Achievable Risk Level (MRL) — the theoretical lower bound on calibration error given finite samples and verifier signal strength. This is directly relevant to Carnot's situation: tier0s (real-corpus AUROC=0.3758) and tier0u (0.5360) have near-noise-floor signal. Standard conformal calibration treats all verifiers equally; MRL estimation would correctly shrink weak verifiers' contributions.\n\nKEY INSIGHT FOR CARNOT: The MRL for a verifier with AUROC near 0.50 should be high (near random), meaning the framework acknowledges that verifier's contribution to coverage cannot be guaranteed. This would prevent the ensemble from over-weighting tier0s/tier0u in future calibrations.\n\nPRACTICAL APPROXIMATION:\n  For each verifier, compute information_ratio = (AUROC - 0.5) / 0.5  (0 = random, 1 = perfect)\n  Compute MRL = 1 - information_ratio  (high MRL = weak verifier)\n  Apply MRL weighting: verifier_weight = max(0, 1 - MRL)\n  Recalibrate the ensemble using MRL-weighted Fisher combination.\n\nEXISTING CODE TO READ FIRST:\n  Calibration code (located by exp2546/exp2563):\n    grep -r 'group_conditional\\|fisher\\|conformal' {project_root}/python/ --include='*.py' -l\n  {project_root}/results/experiment_2546_ensemble_v7b.json (v7b baseline AUROC per group)\n  {project_root}/results/experiment_2548_real_corpus_validation.json (per-verifier real-corpus AUROCs)\n  {project_root}/results/experiment_2563_ensemble_v8.json (v8 baseline if available)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Locate calibration module:\n        grep -r 'fisher\\|conformal\\|group_conditional' {project_root}/python/ --include='*.py' -l | head -3\n        If not found: write honest_verdict 'blocked_calibration_module_not_found' and exit.\n  1. Read per-verifier real-corpus AUROCs from exp2548 (tier0r=0.9414, tier0s=0.3758, tier0u=0.5360).\n     Read ensemble group mapping from exp2546.\n  2. Compute information_ratio and MRL for each verifier.\n  3. Implement MRL-weighted Fisher combination in a new calibration variant.\n  4. Run MRL-calibrated ensemble across 5 seeds.\n  5. Compute mrl_ensemble_auroc and compare to v7b baseline (0.9857).\n  6. Set mrl_calibration_viable = (mrl_ensemble_auroc >= 0.970).\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - mrl_ensemble_auroc:\n      principle: \"Primary metric — AUROC with MRL-weighted calibration. Compared to 0.9857 v7b baseline.\"\n  - per_verifier_mrl:\n      principle: \"Dict of {{verifier_id: mrl_value}}. Documents which verifiers were down-weighted.\"\n  - tier0s_mrl:\n      principle: \"MRL for tier0s (expected high, near 1.0, since real AUROC=0.3758 ≈ random).\"\n  - tier0u_mrl:\n      principle: \"MRL for tier0u (expected moderate-high, since real AUROC=0.5360 ≈ slightly above random).\"\n  - mrl_calibration_viable:\n      principle: \"True if mrl_ensemble_auroc >= 0.970. Determines whether MRL calibration advances the ensemble.\"\n  - n_seeds:\n      principle: \"Must be >= 3 for meaningful std.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"mrl_ensemble_auroc >= 0.970 OR per_verifier_mrl IS NOT NULL\"\n    principle: \"Either improved calibration OR the MRL values were computed (documents weak verifiers). Either advances the calibration track.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

