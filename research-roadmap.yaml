           d. Record model path from exp2836.cached_sota_pair_result.
        1. Enumerate all FR-11/NEXUS/session memory files, byte sizes, and SHA256.
        2. For seeds 42, 137, 271, 314, 1729, score the same FoVer N=1000 subset
           under Condition A and Condition B.
        3. Restart Python between conditions and verify no FR-11 state is loaded in B.
