        verdict: complete_oracle_distinct_verifier_ties_vote_with_headroom
        addressed_by: "exp4221 TIED vote (verifier@1-vote@1 -0.0714, CI95 [-0.214,0.0]) but on n=14 held-out tasks, with an isolated logistic-regression verifier, and the ARBITER override degenerated to keep-vote (never fired). This attempt is gated on exp4231 (the STRONGER cross-candidate aggregator + calibrated loss at >=30 held-out tasks) and uses a MARGIN-TRIGGERED override with a pre-registered threshold tuned on the A1 fold (2606.04323) -- so the gate tests a strong build at adequate power, and the override can actually fire on confident wrong-majority cases."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: THE .392 headline gate. A1 (exp4231) built a STRONGER oracle-distinct aggregator
      (cross-candidate set-encoder + calibrated imbalance-aware loss, verifier_is_oracle=false) on a grown
      labeled pool. Now measure whether it BEATS majority vote on a HELD-OUT ARC pool at power. ARBITER
      (2605.26172) names the headroom -- "wrong-majority failures": sampled candidates cluster into basins
      and vote picks the LARGEST basin, not the most accurate, so the correct answer is present but loses.
      AggLM (2509.06870) shows a learned aggregator recovers exactly those. The .391 ARBITER override never
      fired (kept vote on every task); 2606.04323's MARGIN-TRIGGERED re-arbitration fixes that with a
      pre-registered margin threshold. The MATCHED no-verifier control (same candidates/budget) is the
      de-confound.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4231_oracle_distinct_arc_aggregator_build.json (learned_verifier_path, oracle_distinct_auroc, wrong_majority_n, held_out_task_n, verifier_is_oracle=false)
        - results/experiment_4221_oracle_distinct_arc_verifier_beats_vote.json (the .391 TIES read to beat: delta -0.0714, CI95 [-0.214,0.0], oracle@K 1.0, n=14)
        - scripts/exp_verifier_detector_auroc.py:load_arc_rows (build the HELD-OUT split the SAME way, disjoint from A1's folds)
        - scripts/adversarial_verify.py (run it -- check_circular_moat_overclaim must stay clean since verifier_is_oracle=false), scripts/summarize_artifact.py
        - research-references.md ".392 sweep" (margin-trigger 2606.04323; AggLM 2509.06870; ARBITER 2605.26172; AgentAuditor 2602.09341 beats vote AND LLM-judge)
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline" + "Adversarial Artifact Verification" (FALSE_NEGATIVE_RISK positive control)

      TASK: held-out ARC rerank at power -- aggregator vs vote vs matched control vs margin-triggered override vs oracle@K; the decisive CI95 gate.

      CONCRETE STEPS:
        0. PRECONDITIONS: A1 reported aggregator_trained=true with a readable learned_verifier_path. If
           missing/false -> honest_verdict `complete_oracle_distinct_arc_gate_deferred_no_built_aggregator`
