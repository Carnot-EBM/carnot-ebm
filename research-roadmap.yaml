milestone: 2026.05.135
milestone_title: "Phase-12: System-2 Latency Scaling, Symbolic-KAN Integration, and Multi-Agent Verification"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1746-eqm-cuda-profile
    title: "Exp 1746: Profile EqM CUDA overhead with SOTA MoE"
    max_turns: 30
    prompt: >
      CONTEXT: The milestone .134 retrospective identified EqM latency overhead (~150.5 ms/step) as a blocker for real-time inference.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/eqm_sampler.py`, `tests/python/test_eqm.py`.
      TASK: Profile the EqM sampling bottleneck during test-time guidance using the local SOTA MoE model. The profile should measure where time is spent in the gradient updates.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1746_eqm_profile.py`.
      2. Configure MODEL_SPECS to use `unsloth/Qwen3.6-35B-A3B-GGUF`.
      3. Implement PyTorch/CUDA profiling around the EqM test-time sampler.
      4. Write `{project_root}/results/experiment_1746_profile.json` with the timing metrics.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1747-eqm-sparse-updates
    title: "Exp 1747: gated on Exp 1746: Implement sparse updates for EqM"
    gated_on:
      - upstream: exp1746-eqm-cuda-profile
        artifact_field: honest_verdict
        op: in
        value: ["success", "complete", "profiled"]
    prompt: >
      CONTEXT: Based on the profile from Exp 1746, we need to implement sparse gradient updates to lower the overhead of EqM sampling.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/eqm_sampler.py`.
      TASK: Implement sparse tensor updates in the EqM sampling loop to skip near-zero gradients during energy minimization.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1747_eqm_sparse.py`.
      2. Modify the EqM sampler to conditionally apply sparse updates.
      3. Validate output distribution matches dense updates.
      4. Write `{project_root}/results/experiment_1747_sparse.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1748-eqm-hardware-benchmark
    title: "Exp 1748: Hardware benchmark of sparse EqM sampler (Target <100ms)"
    model: opus
    max_turns: 100
    prompt: >
      CONTEXT: The goal is to verify if the sparse EqM sampler drops the latency under 100ms on Dual GPU setups.
      EXISTING CODE TO READ FIRST: `scripts/experiment_1747_eqm_sparse.py`.
      TASK: Benchmark the new sparse EqM sampler on a hardware setup.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1748_benchmark.py`.
      2. Run the hardware benchmark across a batch of 100 samples.
      3. Write `{project_root}/results/experiment_1748_benchmark.json` detailing latency statistics.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1749-symbolic-kan-prototype
    title: "Exp 1749: Symbolic-KAN structure mapping prototype"
    agent_type: codex
    max_turns: 50
    prompt: >
      CONTEXT: Based on arXiv:2603.23854, Symbolic-KANs bridge discrete symbolic regression with neural networks. We want to prototype this mapping into Carnot's tensor space.
      EXISTING CODE TO READ FIRST: `python/carnot/models/kan/`.
      TASK: Prototype a Symbolic-KAN module that embeds discrete symbolic structures.
      CONCRETE STEPS:
      1. Create `python/carnot/models/kan/symbolic_kan.py`.
      2. Implement a symbolic routing layer.
      3. Add comprehensive unit tests in `tests/python/test_symbolic_kan.py`.
      4. Write `{project_root}/results/experiment_1749_symbolic_kan.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1750-symbolic-kan-eval
    title: "Exp 1750: Evaluate Symbolic-KAN constraint accuracy vs CIKAN"
    prompt: >
      CONTEXT: Compare the new Symbolic-KAN module against the baseline Constraint-Informed KAN (CIKAN).
      EXISTING CODE TO READ FIRST: `python/carnot/models/kan/symbolic_kan.py`, `python/carnot/models/kan/cikan.py`.
      TASK: Run a constraint accuracy evaluation.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1750_symbolic_eval.py`.
      2. Train both models on a toy dataset mapping simple logic rules.
      3. Compare constraint preservation rate.
      4. Write `{project_root}/results/experiment_1750_symbolic_eval.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1751-symbolic-kan-e2e
    title: "Exp 1751: End-to-End Symbolic-KAN verifiable tier integration"
    prompt: >
      CONTEXT: Integrate the Symbolic-KAN prototype as a verifiable tier in the main reasoning pipeline.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/`.
      TASK: Plug Symbolic-KANs into the E2E verification tier.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1751_e2e.py`.
      2. Ensure the verifiable tier routes through the Symbolic-KAN when applicable.
      3. Write `{project_root}/results/experiment_1751_e2e.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1752-ltlzinc-spatial
    title: "Exp 1752: Expand LTLZinc benchmark to include spatial reasoning tasks"
    agent_type: codex
    prompt: >
      CONTEXT: The continual learning curriculum needs broadening. The LTLZinc benchmark must expand to spatial reasoning.
      EXISTING CODE TO READ FIRST: `data/ltlzinc_benchmark.json`.
      TASK: Generate new spatial reasoning tasks for LTLZinc.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1752_expand_ltlzinc.py`.
      2. Generate 100 spatial reasoning constraints (e.g. topological map routing).
      3. Append to or create `data/ltlzinc_spatial_benchmark.json`.
      4. Write `{project_root}/results/experiment_1752_spatial.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1753-continual-stability
    title: "Exp 1753: Continuous self-learning stability test on expanded LTLZinc"
    prompt: >
      CONTEXT: Test stability using the new spatial benchmarks on the flagship dense model.
      EXISTING CODE TO READ FIRST: `scripts/experiment_1752_expand_ltlzinc.py`.
      TASK: Run a continual learning loop with `unsloth/gemma-4-31B-it-GGUF`.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1753_continual_stability.py`.
      2. Run the continual stability evaluation loop over the expanded dataset.
      3. Write `{project_root}/results/experiment_1753_continual.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1754-semantic-distillation
    title: "Exp 1754: Continual learning memory buffer semantic distillation"
    prompt: >
      CONTEXT: The continual learning buffer scales indefinitely unless distilled. We need semantic distillation to prune redundant memory states.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/continual_memory.py`.
      TASK: Implement semantic distillation.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1754_distillation.py`.
      2. Group memory states by semantic clustering and retain only representative vectors.
      3. Write `{project_root}/results/experiment_1754_distillation.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1755-multi-agent-framework
    title: "Exp 1755: Multi-agent orchestrator framework prototype"
    model: opus
    max_turns: 100
    prompt: >
      CONTEXT: We need parallel System-2 validation where multiple agents independently verify constraints.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/`.
      TASK: Design a multi-agent orchestrator framework.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/multi_agent_orchestrator.py`.
      2. Implement asynchronous dispatch and quorum-based consensus aggregation.
      3. Write `{project_root}/results/experiment_1755_orchestrator.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1756-multi-agent-putnambench
    title: "Exp 1756: Evaluate multi-agent orchestration on PutnamBench subset"
    prompt: >
      CONTEXT: Evaluate the new multi-agent orchestrator on formal reasoning.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/multi_agent_orchestrator.py`.
      TASK: Run a PutnamBench subset to see if multi-agent orchestration raises the verification bound.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1756_putnambench.py`.
      2. Route 20 PutnamBench formal math tasks through the multi-agent verifier.
      3. Write `{project_root}/results/experiment_1756_putnambench.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1757-e2e-multi-agent
    title: "Exp 1757: E2E Pipeline Live SOTA Eval (EqM + Symbolic-KAN + Multi-Agent)"
    model: opus
    max_turns: 100
    prompt: >
      CONTEXT: The final E2E test combining latency-optimized EqM, Symbolic-KAN, and Multi-Agent Orchestration on a mandated SOTA GGUF.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/`.
      TASK: Execute the full combined pipeline.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1757_e2e_live.py`.
      2. Initialize `unsloth/gemma-4-26B-A4B-it-GGUF`.
      3. Run end-to-end inference incorporating all new milestone capabilities.
      4. Write `{project_root}/results/experiment_1757_e2e.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1758-retro
    title: "Exp 1758: Milestone .135 Retrospective"
    max_turns: 20
    prompt: >
      CONTEXT: Phase 5 Operations. Aggregate the results of Milestone .135.
      EXISTING CODE TO READ FIRST: `results/experiment_1746_*.json` to `results/experiment_1757_*.json`.
      TASK: Write the retrospective.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1758_retro.py`.
      2. Parse all milestone result JSONs.
      3. Output `{project_root}/results/experiment_1758_retro.json` detailing honest_verdict and new gaps.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
