      retire_if_same_verdict: false
    - experiment_id: exp1083-rlvr-ssd-integration-v1
      verdict: blocked_gate_check_failed
      addressed_by: "exp1083 in .84 was blocked by missing prior_failures gate. exp1110 declares all prior failures including exp1083."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    exp1099 (.85) honest_verdict=no_improvement (energy_all_zero=True). Root cause:
    the training corpus was pre-filtered by carnot_and_compose_k5 — meaning every example
    ALREADY had energy=0.0 (all verifiers agreed = no violations). The energy filter was
    completely degenerate: selecting by "energy < median = 0.0" accepts everything.

    This experiment fixes both root causes:
    1. Generate a FRESH, UNFILTERED corpus from SOTA model live inference
    2. Use top-k energy selection instead of median threshold

    CRITICAL: DualGPU (both RTX 3090s) MUST be used for SOTA model inference.
    This is the 18th consecutive milestone with both GPUs at 0% utilization.
    Use DualGPURunner from python/carnot/pipeline/dualgpu.py (or equivalent).

    MODEL: unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE) for inference.
    This is MANDATORY per CLAUDE.md. Do not use 0.8B or E4B models as headline.

    Reference papers:
    - arXiv 2604.03128 (Self-Distilled RLVR): on-policy self-distillation training recipe
    - arXiv 2601.20802 (SDPO): self-teacher advantage estimation
    - arXiv 2601.18734 (Self-Distilled Reasoner): per-token divergence training objective

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/ (list directory — find DualGPURunner)
    - python/carnot/verify/semenergy_probe.py (fast energy scorer for corpus filtering)
    - python/carnot/models/sos_kan.py (SOSKANEnergyV3 — for energy scoring)
