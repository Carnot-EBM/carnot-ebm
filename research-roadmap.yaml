  - id: exp3871-thesis-a-partb-dtp1-adjudication-headroom-confirmed
    operator_override: >
      2026-06-05 operator-outer-loop directive (standing): operator-seeded
      Thesis-A (EBT, arXiv:2507.02092) Phase-3 forward bet — versioned lineage
      continuation of thesis_a_p1_discrete_search_v2 with a STATED forward
      difference (confirmed-headroom checkpoint gating, not retrain-and-gamble).
      Not a doomed rerun; the prior INCONCLUSIVE was a positive-control collapse,
      addressed below.
    milestone: "2026.06.358"
    prior_failures:
      - experiment_id: thesis_a_p1_discrete_search_v2
        verdict: "complete: thesis_a_p1_v2_INCONCLUSIVE_positive_control_failed_ar_best_0.010_below_0.3_cannot_adjudicate"
        addressed_by: "v2 RE-TRAINED the AR control and it collapsed to 0.01 (<0.3 guard). This run does NOT retrain-and-gamble: it loads/selects a CONFIRMED-HEADROOM checkpoint where AR in [0.4,0.95] (the scaled run already produced AR=0.84/EBT-argmin=0.0, thesis_a_part_b_scaled_seed1.json) and only then runs the global-beam-search probe. The positive control is asserted BEFORE the expensive adjudication."
        retire_if_same_verdict: true
    title: "THESIS-A PART-(b) DT-P1 ADJUDICATION on a CONFIRMED-HEADROOM checkpoint: with AR in [0.4,0.95] proven first, does a GLOBAL discrete beam search over cumulative EBT energy recover AR-level accuracy (greedy was the bottleneck -> ARTIFACT) or also fail (energy landscape misshaped for algorithmic generation -> FUNDAMENTAL)? The Phase-3 energy-as-GENERATOR kill-gate."
    priority: critical
    track: research
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    requires_gpu: true
    estimated_wall_time_min: 120
    inference_substrate: live_llm_inference
    deliverable: results/experiment_3871_thesis_a_partb_dtp1_headroom_confirmed.json
    prompt: |
      CONTEXT. Phase-3 Thesis A (energy-as-GENERATOR, EBT arXiv:2507.02092, the
      operator-seeded foundation-model bet). Part-(a) PASSED (stable training +
      generalizing energy landscape). Part-(b) is the kill-gate: does energy-descent
      GENERATION beat autoregression at matched compute? A scaled run cleanly
      measured AR=0.84, EBT-greedy-argmin=0.0 with confirmed headroom (verdict
      BOUNDED, results/thesis_a_part_b_scaled_seed1.json). The Deep-Think-P1
      DECISIVE probe asks WHY EBT-argmin=0: replace greedy per-token energy-argmin
      with a GLOBAL discrete beam search minimizing CUMULATIVE per-position EBT
      energy over candidate token embeddings.
        - beam >> argmin and approaches AR  => greedy decode was the bottleneck => ARTIFACT
        - beam ~= argmin ~= 0 while AR succeeds => global search ALSO fails => energy
          landscape misshaped for algorithmic generation => FUNDAMENTAL
      The .357 v2 attempt was INCONCLUSIVE ONLY because it re-trained and the AR
      control collapsed to 0.01. THIS run asserts the positive control FIRST.

      EXISTING CODE TO READ FIRST:
        - docs/research-notes/phase3-thesis-a-part-b-design.md (the full design)
        - scripts/thesis_a_p1_discrete_search_v2.py (the global-beam-search probe;
          reuse its beam-search + decode logic VERBATIM)
        - scripts/thesis_a_part_b_scaled.py (the scaled dim=768/4L harness that
          produced AR=0.84; reuse its model + training + AR best-of-N path)
        - results/thesis_a_part_b_scaled_seed1.json (the confirmed-headroom result)
        - scripts/experiment_3727_matched_compute_eval_harness.py (matched-FLOP budget)

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE anything; on failure write blocked_<resource> + EXIT):
           a. `{project_root}/.venv/bin/python -c "import torch; assert torch.cuda.is_available() and torch.cuda.device_count() > 0"`.
              (Run EVERYTHING via .venv/bin/python — bare python has no torch and silently
              drops to CPU; that silent-CPU-drop blocked this kill-gate twice. blocked_no_cuda on fail.)
           b. The scaled harness imports (scripts/thesis_a_part_b_scaled.py loads).
        1. CONFIRMED-HEADROOM CHECKPOINT (the load-bearing fix vs v2):
           - If results/thesis_a_part_b_scaled_seed1.json's checkpoint is reusable, load it.
           - ELSE train the scaled EBT + matched AR across >=3 seeds with checkpointing,
             and SELECT a seed whose held-out AR accuracy is in [0.4, 0.95].
           - ASSERT positive_control_passed := (best held-out AR in [0.4, 0.95]) BEFORE step 2.
             If NO seed reaches AR>=0.4 within the bounded compute budget, write
             honest_verdict `complete: thesis_a_partb_INCONCLUSIVE_no_headroom_seed_ar<best>` and EXIT
             (FALSE_NEGATIVE_RISK guard — do NOT adjudicate ARTIFACT/FUNDAMENTAL without headroom).
        2. On the headroom checkpoint, decode held-out with (i) AR best-of-N at matched FLOPs,
           (ii) EBT greedy per-token energy-argmin, (iii) EBT GLOBAL discrete beam search over
           cumulative energy (beam>=8). All at EQUAL inference FLOPs (use exp3727 harness).
        3. Compute held-out accuracy for all three. Adjudicate per the gate below. >=3 seeds.

      REQUIRED ARTIFACT FIELDS:
        positive_control_passed: BARE BOOL  # gated_on field — emit a bare true/false, NOT a {value,principle} dict.
        ar_best_accuracy: {{ principle: "The positive control — must be in [0.4,0.95]; AR<0.3 means no headroom and INCONCLUSIVE, never FUNDAMENTAL (the v2 trap)." }}
        ebt_argmin_accuracy: {{ principle: "Greedy energy-argmin decode accuracy — the BOUNDED baseline (~0.0 in the scaled run)." }}
        ebt_beam_accuracy: {{ principle: "Global discrete beam-search accuracy — THE decisive probe; high => greedy was the bottleneck (ARTIFACT), ~0 => landscape misshaped (FUNDAMENTAL)." }}
        adjudication: {{ principle: "ARTIFACT | FUNDAMENTAL | INCONCLUSIVE — the Phase-3 generation verdict; FUNDAMENTAL honestly bounds energy-as-generator at this scale, ARTIFACT motivates a better decoder." }}
        matched_flops_ratio: {{ principle: "EBT/AR inference-FLOP ratio — a win only counts at equal compute (the P0.1 lesson; a params-matched win that spends more passes does not count)." }}
        seeds_used, n_heldout, preconditions_checked, model_specs, random_seed,
        random_seeds_used, reproducibility_checksum, duration_s, inference_substrate:
          {{ principle: "Pre-Launch + Adversarial-Verify + Inference-Substrate methodology — a real EBT train+generate run takes real wall-clock; implausibly short = fabrication." }}

      FALSIFICATION GATE:
        - ARTIFACT: positive_control_passed AND ebt_beam_accuracy >= 0.5*ar_best_accuracy.
          honest_verdict: `complete: thesis_a_partb_ARTIFACT_beam<b>_recovers_vs_argmin<a>_ar<ar>_greedy_was_bottleneck`
        - FUNDAMENTAL: positive_control_passed AND ebt_beam_accuracy < 0.2*ar_best_accuracy AND ebt_argmin_accuracy < 0.2*ar_best_accuracy.
          honest_verdict: `complete: thesis_a_partb_FUNDAMENTAL_beam<b>_argmin<a>_both_fail_vs_ar<ar>_landscape_misshaped`
        - INCONCLUSIVE: NOT positive_control_passed (no seed AR in [0.4,0.95]).
          honest_verdict: `complete: thesis_a_partb_INCONCLUSIVE_no_headroom_ar<best>`
        honest_verdict MUST start with a terminal prefix or `blocked_<resource>`.

      DISCIPLINE: populate seeds + checksum + preconditions_checked + model_specs.
      Report REAL duration (live training floor 60s). Frozen FoVer 0.9131 unchanged
      (this is GENERATION, a different mechanism from the SELECTION P0.1 negative).
      Run: {project_root}/.venv/bin/python scripts/experiments/experiment_3871_thesis_a_partb_dtp1_headroom_confirmed.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3872-ebt-energy-descent-system2-diagnostic
    operator_override: >
