    \ val_pairs=<int>,\n      v5_auc=0.739, v6_val_auc=<float>,\n      capo_applied=True,\
    \ lambda_cal=0.1,\n      model_saved=(v6_val_auc>=0.80),\n      tier_0c_deployable=(v6_val_auc>=0.80),\n\
    \      retro_049_resolved=(v6_val_auc>=0.80),\n      honest_verdict='nup_v6_tier0c_ready'\
    \ if v6_val_auc>=0.80 else 'nup_v6_improved' if v6_val_auc>0.739 else 'no_improvement'.\n\
    \   m. tmpl.assert_deliverable_written() as FINAL LINE.\n5. Write tests/python/test_capo_calibration.py\
    \ (100% coverage on capo_calibration.py) and tests/python/test_nup_probe_v6.py\
