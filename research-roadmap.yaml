      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/results/experiment_5733_sota_finite_choice_proposal_channel.json
      - {project_root}/results/experiment_5734_sota_exact_proposal_stream.json
      - {project_root}/results/experiment_5746_exact_proposal_utility_benchmark.json
      - {project_root}/python/carnot/verifiers
      - {project_root}/openspec/capabilities
      - {project_root}/tests/python

      TASK:
      Run a matched-budget proposal-utility panel across all mandated SOTA GGUF families and emit results/experiment_5747_sota_exact_proposal_utility_panel.json.

      CONCRETE STEPS:
      0. PRECONDITIONS: enforce all structured gates; verify benchmark/model hashes, immutable cached `.gguf` files, CUDA visibility, llama.cpp CUDA build, free VRAM/disk/RAM, and tokenizer availability. Record before/during/after GPU memory and positive layer-offload receipts. Bail before science if two flagship models cannot authenticate CUDA.
      1. Add/extend REQ-* before implementation. Declare `MODEL_SPECS` for `unsloth/Qwen3.6-35B-A3B-GGUF`, `unsloth/gemma-4-31B-it-GGUF`, and `unsloth/gemma-4-26B-A4B-it-GGUF`. Resolve local immutable GGUFs through the cache helper and use llama.cpp tokenization/score access only.
      2. Freeze the Exp5733 finite-choice interface and Exp5746 science manifest before inference. Randomize model-specific one-token labels with sealed seeds and preserve every full candidate score vector.
      3. For every instance/model, compare model ordering with at least 20 sealed random permutations, the deterministic energy heuristic, and solver-native branching under identical candidate pools, exact-validator call budgets, stopping rules, and timeouts.
      4. Exact structure and solution validators remain authority. Model score, label, margin, tokenizer property, CUDA receipt, and heuristic energy cannot admit a candidate or repair an incomplete benchmark row.
      5. Report paired deltas and confidence intervals for top-1/top-k feasible discovery, nodes/verifier-calls to first valid and optimal, hard violations, normalized optimality gap, and descriptive end-to-end latency. Stratify by model and benchmark family.
      6. Set `proposal_utility_ready_score=1.0` only if the preregistered overall paired lower confidence bound is positive for at least one decision-cost metric, no hard-feasibility metric regresses, and both flagship families have non-negative primary deltas. Accuracy alone cannot promote.
