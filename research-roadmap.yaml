- id: exp466-ebm-cot-v3
  milestone: 2026.04.35
  deliverable: results/experiment_466_ebm_cot_v3.json
  title: 'Exp 466: EBM-CoT Calibration v3 — RETRO-034 closure (target AUC > 0.650)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-034 opened in milestone\
    \ 2026.04.34: EBM-CoT calibration (Exp 458) reached AUC 0.5554 vs 0.600 target. Two\
    \ root causes: (1) only 10 Langevin steps is insufficient for full hidden-state relaxation\
    \ to the low-energy manifold, (2) only 57 training pairs from one source (Exp 443). This\
    \ experiment fixes both: (1) increase to 50 Langevin steps, (2) add synthetic pairs from\
    \ ContinuousEBM energy matching, and (3) apply OIM-style Equilibrium Propagation coupling\
    \ update (arXiv 2510.12934) to update EORM coupling matrix via free/clamped phase spin\
    \ correlations — no backpropagation needed. Target: AUC > 0.650.\n\n\
    CPU-only experiment. Depends on: Exp 462 (DeliverableGuard).\n\n\
    EXISTING CODE TO READ FIRST:\n\
