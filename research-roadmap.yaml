- id: exp967-iterativeselfrepair-100q-debugrepair
  milestone: 2026.04.75
  deliverable: results/experiment_967_iterativeselfrepair_100q_debugrepair.json
  title: "IterativeSelfRepair 100q + DebugRepair Hypothesis Step (Retry of Exp 959)"
  prompt: |
    CONTEXT:
    Exp 959 (IterativeSelfRepair 100q + DebugRepair) was blocked in .74 by missing prior_failures.
    This retry provides complete prior_failures. The experiment itself is unchanged: scale
    IterativeSelfRepair from 25q (Exp 905, code: +68pp) and 50q (Exp 906, code: strong improvement)
    to 100q, and add the DebugRepair hypothesis step from arXiv 2604.19305 (+8.2pp HumanEval).

    DebugRepair hypothesis step: before generating a repair, generate a hypothesis about WHY the
    initial response is wrong. Feed the hypothesis into the repair prompt as context:
    "My diagnosis of the error: [hypothesis]. Now generate a corrected response."

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_905_iterative_self_repair_v1.py (25q baseline pattern)
    - scripts/experiment_906_code_repair_50q_scaleup.py (50q pattern)
    - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline for energy selection)

    TASK:
    Scale IterativeSelfRepair to 100q with DebugRepair hypothesis step:
    1. CODE domain: 100 HumanEval problems, 3 repair attempts each
       - baseline: pass@1 before repair
       - repair: execute code, capture error, generate hypothesis, repair with hypothesis context
       - selection: use Carnot energy to select lowest-energy attempt
    2. MATH domain: 50 GSM8K problems (different from math repair track — no energy scoring here,
       just external feedback re-feeding)
    3. Measure hypothesis_contribution: AUC(with_hypothesis) - AUC(without_hypothesis)

    MODEL_SPECS:
      primary: unsloth/gemma-4-31B-it-GGUF
      fallback: unsloth/Qwen3.6-35B-A3B-GGUF

    Use BatchedInferenceRunner(batch_size=8). Pre-warm via tmpl.setup_gpu(MODEL_SPECS).
    honest_verdict = "iterative_repair_100q_viable" if either domain shows delta > 0.

    Write results/experiment_967_iterativeselfrepair_100q_debugrepair.json with schema:
      code_repair_delta: float
      math_repair_delta: float
      hypothesis_contribution: float
      n_problems_code: int
      n_problems_math: int
      model_used: str
      honest_verdict: str

    Run: python scripts/experiment_967_iterativeselfrepair_100q_debugrepair.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: medium
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 120
  prior_failures:
