milestone: 2026.06.395
milestone_title: "CLOSE the cross-family/cross-game OOD question -- DOES the hardened ARC oracle-distinct selector win GENERALIZE beyond the pool it was tuned on? .394 HARDENED the program's first ARC oracle-distinct verifier-beats-vote win on 2 of 3 axes (exp4256 win_survives_provenance_blind: de-leaked delta +0.385 AUROC 0.990; exp4257 oracle_distinct_win_replicates: mean +0.458 across >=5 seeds + independent re-score +0.442 matching single-seed, oracle@K 0.827 n=52) BUT the decisive cross-game OOD test BLOCKED on a data-provenance bug (exp4258 blocked_arc_game_ids_unrecoverable -- the 52-task grown pool's gap3_stage2 task_ids could not be mapped to game/family identities, so no family-disjoint split could be built). The capstone (exp4268) therefore set hardened_win=False and held the diffusiongemma_full_run_gate CLOSED -- NOT because the win collapsed, but because the load-bearing OOD test NEVER RAN. .395 is DEPTH (north-star §1, Depth-Over-Breadth): it does ONE thing -- CLOSE the cross-family question. PHASE A recovers the missing FAMILY/GAME provenance (fixing exp4258's root cause per Reliability Gap 2606.03305 provenance discipline) and runs the held-out-FAMILY test -- on the existing pool if family-diverse enough (A2), else on a fresh ARC-TGI (2603.05099) family-disjoint pool (A3) -- plus a Tier-1 online-adaptation self-learning arm (A4). GENERALIZES (cross_family_delta>0 CI95-excl-0) -> a GENERAL selection signal (north-star-grade; opens the DiffusionGemma gate). COLLAPSES -> scope the headline to within-pool and refocus. PHASE B repairs the DiffusionGemma discrete-diffusion GGUF loader (exp4260 blocked) + re-preflights so the scale-up is READY the moment the win generalizes (full run DEFERRED to .396). PHASE C advances ARC accuracy +1 on a NEW game. PHASE D records the owed-axis decisions (code oracle-distinct -> corpus-specific/RETIRED exp4264; verifier-as-reward -> out-of-band operator-owned exp4263) + SOTA-ingestion + registry/gaps + hardware + capstone."
milestone_doc: openspec/change-proposals/research-roadmap-v395.md
milestone_overview: |
  .394 hardened the first ARC oracle-distinct win on 2 of 3 axes (leak-audit SURVIVED, multi-seed REPLICATED)
  but the real OOD test -- held-out GAMES/FAMILIES -- BLOCKED because the grown pool's task_ids were not
  mappable to game/family identities (exp4258 blocked_arc_game_ids_unrecoverable). hardened_win stayed False
  and the DiffusionGemma scale-up gate stayed CLOSED for that single reason. The synthesis fork did NOT break
  the oracle@K ceiling (exp4259 synthesis_underperforms_selection: -0.283 vs oracle), so selection IS the
  ceiling on this corpus and per-cell reconciliation is a dead end here. The DiffusionGemma preflight BLOCKED on
  the discrete-diffusion GGUF loader (exp4260). ARC held at 19 levels. The owed axes resolved: verifier-as-reward
  moved OUT-OF-BAND (exp4263 ready_for_out_of_band=true, operator-owned like the TRM checkpoint), and the code
  oracle-distinct replication came back CORPUS-SPECIFIC (exp4264 delta -0.006, did not replicate). paper_ready
  stays True (FoVer 0.9131 headline, G1-G4 met).

  .395 is DEPTH, not churn. It does ONE thing: CLOSE the cross-family/cross-game generalization question that
  gates everything (the headline-eligibility of the +44pp win AND the DiffusionGemma scale-up).

    PHASE A -- CLOSE THE CROSS-FAMILY OOD QUESTION:
      A1 (exp4270) FAMILY/GAME PROVENANCE RECOVERY: fix exp4258's root cause -- recover a task-FAMILY id for
        every pool row (join raw_task_id/source_id -> source ARC task -> ARC-TGI family taxonomy / the 25-game
        survey); materialize a first-class provenance manifest (Reliability Gap 2606.03305). Emit
        family_split_feasible BARE bool + distinct_family_n.
      A2 (exp4271, gated_on A1 family_split_feasible==true) CROSS-FAMILY transfer on the EXISTING pool:
        train on a subset of families, test beats-vote on HELD-OUT families; static + online-adapt arms.
        Emit cross_family_win_holds BARE bool. verifier_is_oracle=false.
      A3 (exp4272, gated_on A1 family_split_feasible==false) FRESH ARC-TGI family-disjoint pool + cross-family
        transfer (the fallback when the existing pool is too concentrated). Emit cross_family_win_holds. verifier_is_oracle=false.
      A4 (exp4273, gated_on A1 family_split_feasible==true) SELF-LEARNING Tier-1 online verifier-weight
        adaptation across the family folds (the mandated continuous-self-learning experiment; CPU reweighting,
        NOT the retired live-LoRA path).
    PHASE B -- REPAIR THE LOADER + RE-PREFLIGHT (infra de-risk; NO full run):
      B1 (exp4274) DiffusionGemma discrete-diffusion GGUF LOADER FIX + tiny guidance preflight. Emit
        preflight_go + guidance_changes_selection + cost. Full run DEFERRED to .396 (gated on hardened_win).
    PHASE C -- ARC NORTH STAR:
      C1 (exp4275) offline ARC incremental +1 on a NEW game (total_levels>=20). NO TRM; NO submission.
    PHASE D -- HYGIENE, DECISIONS & CAPSTONE:
      D1 (exp4276) SOTA-ingestion -> .396 forks. D2 (exp4277) registry/gaps hygiene + GAP-4 regression guard +
        RECORD the code/reward retirements. D3 (exp4278) hardware continuity opportunistic. D4 (exp4279)
        capstone .395 -- emit cross_family_generalizes + hardened_win + diffusiongemma_full_run_gate + G1-G4.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227) and the conductor stays stood-down.
  NO task may launch TRM training, run pkill/kill against train.py, or WRITE results/trm_runs/. Qwen is
  FORBIDDEN as the TRAINED base (Spurious-Rewards confound); Qwen GGUF as an off-policy teacher/certifier is
  fine. DiffusionGemma FULL RUN stays DEFERRED to .396 (B1 is a loader-fix + preflight only). Every
  verifier-value task MUST declare verifier_is_oracle honestly (Circularity Discipline). Online ARC play stays
  operator-gated (NO leaderboard submission).

