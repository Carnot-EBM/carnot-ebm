- id: exp470-ppsebm-constraint-learner
  milestone: 2026.04.35
  deliverable: results/experiment_470_ppsebm_constraint_learner.json
  title: 'Exp 470: PPSEBM Tier 2 Progressive Constraint Parameter Isolation — self-learning upgrade'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: LSEBMCL (Exp 457, arXiv 2501.05495)\
    \ improved cross-session FP rate from 0.46 to 0.0 via EBM replay warm-starting. However,\
    \ it treats all constraint domains (arithmetic, code, logical) as a single parameter space.\
    \ PPSEBM (arXiv 2512.15658) adds Progressive Parameter Selection: each constraint domain\
    \ gets an ISOLATED parameter partition. When learning arithmetic constraint patterns, only\
    \ the arithmetic partition is updated — code and logic partitions remain stable. The EBM\
    \ generates synthetic boundary violations to reinforce partition isolation. This prevents\
    \ the case where improving arithmetic constraint detection accidentally degrades code constraint\
    \ detection (catastrophic interference).\n\nThis is the MANDATORY self-learning experiment\
    \ for milestone .35. CPU-only. Depends on: Exp 457 (LSEBMCL baseline), Exp 462 (DeliverableGuard).\n\n\
    EXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()\n\
    - python/carnot/pipeline/lsebm_replayer.py — LSEBMConstraintReplayer (Exp 457)\n\
    - python/carnot/pipeline/constraint_addition.py — ConstraintAdditionFromMemory (Exp 456)\n\
    - python/carnot/pipeline/session_memory.py — SessionMemory\n\
    - python/carnot/pipeline/deliverable_guard.py — DeliverableGuard (Exp 462)\n\
    - results/experiment_457_lsebmcl_replay.json — LSEBMCL baseline (fp_rate=0.0)\n\
    - research-references.md — PPSEBM section (arXiv 2512.15658)\n\n\
    TASK: Implement PPSConstraintLearner with domain-partitioned parameter isolation.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-SELFLEARN-016 (PPSConstraintLearner isolates constraint weight updates by domain:\n\
    \   arithmetic / code / logical — updates to one domain do not modify others),\n\
    \   REQ-SELFLEARN-017 (EBM generates synthetic boundary violations per domain to reinforce\n\
    \   partition isolation),\n\
    \   REQ-SELFLEARN-018 (partition_isolation_score > 0.8 measured as cosine distance between\n\
