    \ verifiers to score EACH REASONING STEP — not just the final answer. Achieves up to 20%\
    \ higher F1 than neural judges, zero reward hacking. Carnot's Ising/KAN IS a VPRM: energy\
    \ IS the deterministic verifier.\n\
    - arXiv 2505.15960 (FOVER): Synthesizes PRM training data via Z3/Isabelle annotations.\
    \ Take a reasoning trace, split into steps, send each step to Z3, get correct/incorrect labels.\
    \ Train PRM on those labels. No human annotation needed.\n\
    \nWHY THIS CLOSES FR-11: The self-learning loop was blocked because we had no REAL training\
    \ signal. FOVER provides it: Z3 annotates each GSM8K reasoning step as correct or incorrect.\
    \ IsingEBM trains on those labels via CD. After training, Ising can evaluate step correctness\
    \ WITHOUT Z3. This is genuine learning from real data — the energy function becomes the process\
    \ reward model.\n\
    \nIMPORTANT: This experiment can run on CPU (CD training is CPU-fast). If live GPU results\
    \ are available from Exp 419 (CoT traces), use them; otherwise generate synthetic reasoning\
    \ traces with known step errors.\n\
