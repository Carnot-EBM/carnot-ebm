      - relevant arc-agi, arc-world-model-trust-energy, continuous-learning, core-ebm, verification, evidence, and reporting specs; traceability; status; changelog; and E2E plan

      TASK
      Wire a game-agnostic invariant projector into the default-off live E3 world-model proposal path. Replay archived live transitions with disjoint calibration and held-out games. Compare no projection, selected invariant projection, and norm-matched random projection using exact observed next frames. Make no solve claim and perform no new LLM inference.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected hashes, Exp6595 path and hash, ARC solve-registry receipt, live entrypoint hashes, archive source paths and hashes, valid world-model transition count, game IDs, proposed split, seeds, CPU and RAM, and no-LLM substrate. If there are too few game-disjoint live transitions, block with exact counts rather than using a per-game development proxy.
      1. Registry-precheck every game and confirm the task makes no game-level or level-level solve claim. Add REQ-* and SCENARIO-* anchors for live import reachability, default-off behavior, game-blind features, disjoint splits, immutable archive replay, exact next-frame evaluation, controls, failure retention, and atomic output. Write focused tests first.
      2. Extract only the general projector math from Exp6595 into a reusable module. Wire it behind a default-off configuration in make_carnot_agent and E3AgentPolicy. No per-game class, source read, exhaustive solver, hidden state, or game identity may influence projection.
      3. Build game-identity-blind trajectory features from the live policy's own observations and executable world-model predictions. Fit and choose an invariant on calibration games only. Freeze basis, thresholds, hashes, and cost budget before held replay.
      4. Replay the same archived live transition through no_projection, selected_invariant_projection, and norm_matched_random_projection. Preserve invalid engines, exceptions, no-headroom rows, and unchanged predictions.
      5. Emit per_unit_rows for every game, transition, seed, and arm with live entrypoint receipt, input and predicted grids, observed next grid, feature values, drift, projection distance, iterations, exact mismatch, runtime validity, cost, and failure.
