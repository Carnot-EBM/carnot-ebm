- id: exp2371-lagonn-constraint-satisfaction
  title: 'Phase 4: LagONN Deterministic Constraint Satisfaction (arXiv:2505.07179) — vs Self-Adaptive Ising'
  milestone: 2026.05.231
  deliverable: results/experiment_2371_lagonn.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp174-lagoon-constraint-solver
    verdict: 'complete: lagoon solver prototype (different algorithm)'
    addressed_by: "exp174 'lagoon' is a different algorithm — the naming similarity to
      LagONN is coincidental. LagONN (arXiv:2505.07179, May 2025) uses Kuramoto coupled-oscillator
      dynamics with Lagrange multiplier enforcement, published 2025 and not cited in exp174.
      exp174's lagoon solver used Lagrangian relaxation on a static constraint graph (no
      oscillator dynamics). These are mechanistically distinct algorithms. The 'lagoon' vs
      'lagonn' difference is spelling not scope. Genuinely new scope: LagONN Kuramoto
      dynamics were not available or implemented at exp174 time."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: LagONN (arXiv:2505.07179, Lagrange Oscillatory Neural Networks) is a
    deterministic constraint satisfaction method using Hopfield-style oscillatory dynamics
    with Lagrange multipliers for constraint enforcement. It is a noiseless alternative to
    simulated annealing (CASAL, Self-Adaptive Ising) that may achieve better solutions on
    structured constraint satisfaction problems.

    LagONN applies Kuramoto-like coupled oscillator dynamics where nodes represent variables,
    and Lagrange multipliers enforce constraints via penalty gradients. Convergence is
    deterministic (no random restarts needed), making it reproducible and potentially faster.

    exp2371 compares LagONN against Self-Adaptive Ising (exp2359: 12.75x speedup over fixed
    penalty) on the SAME 2-problem constraint satisfaction suite used in exp2359.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/samplers/ (existing samplers: CASAL, Projected-Langevin, Self-Adaptive)
      {project_root}/results/experiment_2359_self_adaptive_ising.json (baseline: 12.75x speedup)
      {project_root}/results/experiment_2355_projected_langevin.json (CASAL comparison)
      {project_root}/python/carnot/samplers/casal.py (or equivalent)

    TASK: Implement LagONN sampler and compare against Self-Adaptive Ising on 2-problem suite.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Verify numpy and scipy available:
            .venv/bin/python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
            If scipy missing: .venv/bin/pip install scipy -q
         b. Read exp2359 artifact to get the 2-problem suite definition:
            python3 -c "import json; d=json.load(open('{project_root}/results/experiment_2359_self_adaptive_ising.json')); print(list(d.keys()))"
         c. CPU-only confirmed — no GPU preconditions needed.

      2. Implement LagONN sampler at python/carnot/samplers/lagonn.py:
         - LagOnnSampler class with:
           - step(x: ndarray, coupling: ndarray, lagrange_multipliers: ndarray) -> ndarray
           - solve(problem: dict, max_iters: int = 1000) -> dict
         - Oscillator dynamics: dx/dt = -sin(x) + coupling @ sin(x) + lambda_grad
         - Lagrange update: d_lambda/dt = constraint_violation
         - Convergence criterion: |dx| < 1e-6 for 100 consecutive steps

      3. Run LagONN on same 2-problem suite as exp2359:
         For each problem: record solution_quality, n_iters_to_convergence, wall_time_s.

      4. Run Self-Adaptive Ising on same problems (re-run or use exp2359 numbers):
         Record baseline: adaptive_ising_speedup=12.75x from exp2359.

      5. Compare:
         - lagonn_vs_ising_speedup: LagONN convergence time / Self-Adaptive Ising time
         - lagonn_constraint_satisfaction_rate vs ising_constraint_satisfaction_rate
         - lagonn_solution_quality vs ising_solution_quality

      6. Write unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/ -k "lagonn" -v --no-cov 2>&1 | tail -15

      7. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with LagONN vs Ising comparison."
      - lagonn_validated:
          principle: "True if LagONN solved at least 1 constraint satisfaction problem."
      - lagonn_constraint_satisfaction_rate:
          principle: "Fraction of constraint satisfaction problems solved. Compare with Ising."
      - lagonn_vs_ising_speedup:
          principle: "LagONN wall-time vs Self-Adaptive Ising. > 1.0 means LagONN is slower."
      - lagonn_n_iters_mean:
          principle: "Mean iterations to convergence. Detects non-convergent runs."
      - n_problems:
          principle: "Must be 2 (same suite as exp2359) for direct comparison validity."
      - random_seed:
          principle: "Reproducibility. Must be 42. LagONN is deterministic but seed guards initialization."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records resource verification."

    ACCEPTANCE GATES:
