- id: exp650-kaem-multilevel-sparse
  milestone: 2026.04.49
  deliverable: results/experiment_650_kaem_multilevel_sparse.json
  title: 'Exp 650: LowRankKAEM Multilevel + Sparse Combined — RETRO-057 Closure Attempt'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-057 (carry 5): LowRankKAEM energy accuracy outside 5% tolerance.
    Exp 637 SparseKAEM showed sparse_vs_dense_error=0.429 — far outside 5% threshold.
    Sparse-only redesign is insufficient. New hypothesis: sparse compression ALONE discards
    significant eigenvalues; multilevel training ALONE may not converge to the right minimum
    with sparse couplings. The combination — train at coarse resolution first (K=16 knots),
    then progressively refine (K=32, K=64) while maintaining sparsity at each level — should
    combine the benefits: coarse-to-fine avoids local minima, and sparsity provides parameter
    reduction. Both MultilevelKAEMTrainer (Exp 634) and SparseKAEMEnergy (Exp 637) are built.

    EXISTING CODE TO READ FIRST:
    - python/carnot/training/multilevel_kan_trainer.py — MultilevelKAEMTrainer,
      KnotRefinementInterpolator (Exp 634)
    - python/carnot/models/sparse_kaem_energy.py — SparseKAEMEnergy (Exp 637)
    - python/carnot/models/kaem_energy.py — KAEMEnergy, UnivariateKAEMLayer
    - results/experiment_634_multilevel_kan_kaem.json — accuracy_multilevel, total_epochs_multilevel
    - results/experiment_637_lowrank_kaem_sparse.json — energy_accuracy_sparse, sparse_vs_dense_error

    TASK: Implement multilevel training specifically for SparseKAEMEnergy.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-SAMPLE-025 (MultilevelSparseKAEM: multilevel training with sparsity at each level,
       energy accuracy within 5% vs dense baseline), SCENARIO-SAMPLE-040/041 to
       openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/training/multilevel_sparse_kaem.py:
       a. MultilevelSparseKAEMTrainer class:
          __init__(self, schedule: list[int] = [16, 32, 64],
                   epochs_per_level: int = 20,
                   top_k_fraction: float = 0.1):
            self.schedule = schedule
            self.epochs_per_level = epochs_per_level
            self.top_k_fraction = top_k_fraction
          train(self, n_vars: int, data: jnp.ndarray) -> SparseKAEMEnergy:
            'Multilevel training for SparseKAEMEnergy.'
            model = SparseKAEMEnergy(n_vars=n_vars, n_knots=self.schedule[0],
                top_k_fraction=self.top_k_fraction)
            for i, K in enumerate(self.schedule):
                if i > 0:
                    model = self._refine_to_level(model, K)
                model = self._train_level(model, data, self.epochs_per_level)
                model = self._sparsify_level(model)
            return model
          _refine_to_level(self, model: SparseKAEMEnergy, K: int) -> SparseKAEMEnergy:
            'Interpolate UnivariateKAEMLayers to finer K knots.'
            new_layers = []
            for layer in model.layers:
                interpolator = KnotRefinementInterpolator(layer, K)
                new_layers.append(interpolator.interpolate())
            return model.replace(layers=new_layers, n_knots=K)
          _train_level(self, model, data, n_epochs): standard gradient descent.
          _sparsify_level(self, model): apply model.sparsify() to coupling matrix.
       b. Export MultilevelSparseKAEMTrainer from carnot.training.
    4. Write scripts/experiment_650_kaem_multilevel_sparse.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(650, timeout_minutes=35).
       c. ExperimentTemplate(650, 'KAEM Multilevel Sparse',
          'results/experiment_650_kaem_multilevel_sparse.json', requires_gpu=False).
       d. Generate synthetic energy landscape (same as Exps 634/637: 20 vars, known ground truth).
       e. Load prior baselines:
          accuracy_standard = exp637.get('energy_accuracy_dense', None)
          accuracy_sparse_only = exp637.get('energy_accuracy_sparse', None)
          sparse_vs_dense_error_prior = exp637.get('sparse_vs_dense_error', 0.429)
       f. Train MultilevelSparseKAEMTrainer(schedule=[16,32,64], epochs_per_level=20, top_k_fraction=0.1).
          Record accuracy_multilevel_sparse, total_epochs.
       g. Also try top_k_fraction in [0.05, 0.10, 0.20]: find best that achieves < 5% error.
       h. Compare:
          multilevel_sparse_vs_dense_error = abs(accuracy_multilevel_sparse - accuracy_standard) / accuracy_standard
          retro_057_resolved = multilevel_sparse_vs_dense_error < 0.05
          improvement_over_sparse_only = sparse_vs_dense_error_prior - multilevel_sparse_vs_dense_error
       i. Build artifact: schema='carnot.kaem_multilevel_sparse.v1',
          accuracy_standard=<float>, accuracy_sparse_only=<float>,
          accuracy_multilevel_sparse=<float>,
          sparse_vs_dense_error_prior=sparse_vs_dense_error_prior,
          multilevel_sparse_vs_dense_error=<float>,
          improvement_over_sparse_only=<float>,
          best_top_k_fraction=<float>,
          retro_057_resolved=<bool>,
          honest_verdict='multilevel_sparse_resolves_retro_057' if retro_057_resolved
            else 'multilevel_sparse_improved' if multilevel_sparse_vs_dense_error < sparse_vs_dense_error_prior
            else 'multilevel_sparse_no_improvement'.
       j. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_multilevel_sparse_kaem.py (100% coverage).
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: ops/conductor-log.md (RETRO-057 status), ops/changelog.md.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

