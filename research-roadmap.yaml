        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "This deterministic task does not reprompt or decode full ConstraintIR; it defines an overcomplete atom-level proposal protocol that forbids model-side hard pruning, unions independent semantic views before exact completion, and audits the excluded pool."
        retire_if_same_verdict: true
      - experiment_id: exp5909-sota-constraint-synthesis-ab
        verdict: "complete_null: structured prompt arms did not improve exact synthesis"
        addressed_by: "The deliverable changes from one-shot structured emission to a generic candidate-atom universe, non-pruning support, exact subset completion, and hidden-label coverage audit with no model inference."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5921-Exp5922 provide reusable grammar/type/scope and tokenizer support, but Exp5923 retired schema-supported full-IR decoding after zero exact semantic successes on every mandated model. `arXiv:2607.19635` shows that exact search becomes inert when a first neural pass has deleted the true value; `arXiv:2607.21480` shows that accepted-pool inspection cannot certify what a high-recall generator omitted. Carnot needs an open atomic proposal surface that keeps multiple semantic hypotheses alive until exact completion. This task performs no LLM inference. Today is {date}.

      EXISTING CODE TO READ FIRST:
