  - id: exp2790
    milestone: "2026.05.264"
    deliverable: "results/experiment_2790_verifier_fover_redirect_v5.json"
    title: "Verifier FoVer Redirect v5: Diagnose Zero-Energy via Known Violation Corpus"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 50
    track: research
    continuous_self_learning_task: false

    prior_failures:
      - experiment_id: exp2779-verifier-fover-redirect-v5
        verdict: "SKIP — pre-tests failing (WeakStrongRouter ImportError cascade)"
        addressed_by: "exp2779 was SKIPPED due to pre-test cascade. Outer-loop commit b729ba788 fixes the cascade. Same research scope (FoVer corpus redirect); blocked only by pre-test infra, not by a research failure."
        retire_if_same_verdict: false
      - experiment_id: exp2765-verifier-live-gpu-v4
        verdict: "complete:verifier_live_gpu_v4 — verifier_discriminative=false, energy=[0,0,0,0,0], DURATION_TOO_SHORT flagged"
        addressed_by: "exp2765 confirmed ArithmeticExtractor finds 0 constraints in IT model outputs (all 5 gemma-4-26B responses). This exp2790 tests FoVer corpus (known violations) instead of fresh inference to isolate whether the extractor works on structured data."
        retire_if_same_verdict: false
      - experiment_id: exp2752-verifier-live-gpu-v3
        verdict: "Gemini CLI error: Stalled after 600s silence (3rd ABSENT)"
        addressed_by: "exp2752 was absent (agent stalled). exp2765 fixed the stall with STUB-FIRST protocol. This exp2790 uses FoVer corpus, independent of model loading."
        retire_if_same_verdict: false
      - experiment_id: exp2740-verifier-energy-debug-v2-live-gpu
        verdict: "blocked_gguf_qwen36_not_cached"
        addressed_by: "exp2740 blocked because Qwen3.6 GGUF was not cached. exp2790 uses gemma-4-26B-A4B-it-GGUF (confirmed cached in exp2765). More importantly, FoVer corpus approach is independent of GGUF availability."
        retire_if_same_verdict: false
      - experiment_id: exp2727-verifier-energy-debug-v1
        verdict: "complete: verifier_energy_zero_root_cause diagnosed (adversarial-flagged DURATION_TOO_SHORT + METHODOLOGY_MISSING)"
        addressed_by: "exp2727 found energy=0 with too-short duration. Root cause now clearer from exp2765: ArithmeticExtractor returns 0 constraints for IT outputs. This exp2790 tests FoVer pairs to isolate whether the extractor works on structured violations."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      The verifier produces energy=0.0 on all live GGUF model outputs (confirmed in exp2765:
      5 responses from gemma-4-26B-A4B-it-GGUF all gave energy=0). The root cause is the
      ArithmeticExtractor: it uses regex patterns like "X + Y = Z" to find arithmetic constraints,
      but instruction-tuned models write natural language answers, not arithmetic equations.

      This is the 5th consecutive attempt to validate verifier discriminativeness. Previous approaches
      all tried to extract constraints from FRESH model generations. This attempt uses a different
      strategy: TEST ON FOVER CORPUS (known violation pairs).

      The FoVer corpus contains labeled pairs where the model response VIOLATES a formal constraint.
      If the verifier produces energy > 0 on FoVer violation pairs, the extractor DOES work on structured
      data but NOT on fresh IT model outputs. This proves we need an LLM-as-extractor fallback.
      If the verifier produces energy = 0 even on FoVer pairs, the problem is deeper.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/extract.py (ArithmeticExtractor, AutoExtractor — understand extraction)
      - python/carnot/pipeline/verify_repair.py lines 1299-1500 (verify() method — understand flow)
      - data/fover_corpus.jsonl (first 5 lines — understand the data format)

      TASK: Test the verifier on FoVer corpus pairs and diagnose the zero-energy root cause.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `ls {project_root}/data/fover_corpus.jsonl` — confirm corpus exists and has content.
            If not: try `ls {project_root}/data/` for similar files. If no corpus: write
            honest_verdict 'blocked_fover_corpus_missing' and exit.
         b. `cd {project_root} && .venv/bin/python -c "from carnot.pipeline.verify_repair import VerifyRepairPipeline; print('import OK')"` — confirm importable.
         c. `wc -l {project_root}/data/fover_corpus.jsonl` — record corpus size.
         Record: preconditions_checked.

      1. Load 20 FoVer violation pairs from data/fover_corpus.jsonl.
         Parse as JSONL. For each pair, extract: question (or context), violated_response, violation_type.
         If the JSONL format differs, read the first line to understand structure.

      2. Initialize VerifyRepairPipeline WITHOUT a model (verify-only mode):
         ```python
         from carnot.pipeline.verify_repair import VerifyRepairPipeline
         pipeline = VerifyRepairPipeline()
         ```

      3. For each of the 20 FoVer pairs, call:
         ```python
         result = pipeline.verify(question=pair.get("question",""), response=pair.get("violated_response",""))
         energy = result.energy
         n_constraints = len(result.constraints)
         ```
         Record energy and n_constraints for each pair.

      4. Compute summary statistics:
         - fover_energies: list of float
         - n_nonzero_energy: count of pairs with energy > 0
         - n_constraints_extracted: list of int (how many constraints each pair got)
         - energy_mean: mean across pairs
         - fraction_nonzero: n_nonzero_energy / 20

      5. DIAGNOSE based on results:
         CASE A: fraction_nonzero > 0.5 (most FoVer pairs get non-zero energy):
           → diagnosis = "extractor_works_on_fover_but_not_live_outputs"
           → fix_required = "add LLM-as-extractor fallback for non-structured inputs"
           → Implement the fallback: in AutoExtractor, if all extractors return 0 constraints
             AND response_length > 50, call a simple NL claim extractor that extracts
             factual claims using heuristics (sentences containing numbers, comparisons).
             Test on the 5 GGUF responses from exp2765 if available in
             results/experiment_2765_verifier_live_gpu_v4.json.

         CASE B: fraction_nonzero < 0.2 (FoVer pairs ALSO get zero energy):
           → diagnosis = "energy_computation_broken_at_deeper_level"
           → Add debug logging to extract.py AutoExtractor: log each extractor's input and output.
           → Run 3 FoVer pairs with debug logging to identify where the pipeline breaks.
           → Report the specific failure point.

      6. Write artifact with diagnosis, fix summary (or fix code if implemented), and test results.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal prefix required; must start with complete:/success:/passed:/shipped:."
        fover_energy_nonzero: bool
          principle: "Primary gate — downstream exp2798 paper theory is gated on this field."
        diagnosis: str
          principle: "Human-readable diagnosis string; maps directly to fix strategy."
        fraction_nonzero: float
          principle: "Fraction of FoVer pairs with non-zero energy; statistical summary."
        n_fover_pairs_tested: int
          principle: "Sample size for claim validation."
        energy_values_fover: list of float
        n_constraints_extracted_per_pair: list of int
        fix_implemented: bool
        fix_description: str
        preconditions_checked: list
        duration_s: float
        random_seed: 42
        reproducibility_checksum: str

      Run `date -u +"%Y-%m-%dT%H:%M:%SZ"` at start and end.
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2791
    milestone: "2026.05.264"
    deliverable: "results/experiment_2791_delta_h2_regression_fix.json"
    title: "Delta H2 Regression Fix: Git Bisect + Repair Pipeline Repair (Claude Opus)"
    agent_type: claude
    model: opus
    max_turns: 100
    requires_claude: true
    track: research

    prior_failures:
      - experiment_id: exp2780-delta-h2-regression-fix
        verdict: "SKIP — pre-tests failing (WeakStrongRouter ImportError cascade)"
        addressed_by: "exp2780 was SKIPPED due to pre-test cascade. Outer-loop commit b729ba788 fixes this. Same Claude Opus scope; unblocked."
        retire_if_same_verdict: false
      - experiment_id: exp2767-delta-h2-regression-fix
        verdict: "FAIL x3 — Gemini CLI 'Too Many Requests' rate-limited; stalled 600s each attempt"
        addressed_by: "exp2767 stalled 3 times due to Gemini API rate limiting on the complex git bisect + multi-file pipeline debug scope. This exp2791 routes to Claude Opus which does not have the same rate-limiting pattern for tool-use-heavy tasks. The git bisect + file inspection scope is unchanged, but the agent backend has been replaced."
        retire_if_same_verdict: false
      - experiment_id: exp2754-empirical-delta-audit
        verdict: "complete: root_cause=H2_regression, delta=0.000, 0/60 successes"
        addressed_by: "exp2754 diagnosed the H2 regression (verbose per-attempt logging confirmed 0/60 repairs succeed). This exp2791 uses git bisect to FIND the regression commit and then FIX it. Different goal: repair the pipeline, not diagnose the symptom."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      The VerifyRepairPipeline's repair stage produces empirical_delta=0.000. All 0/131 repair
      attempts succeed (exp2754). The root cause was identified as "H2 regression" — a regression
      introduced in the repair pipeline code between the last known-good delta milestone and .261.

      Per arXiv:2605.12270 (Failure Modes of LLM Repair), 22% of repair failures are "regression
      introductions" — the repair succeeds at the target error but introduces new violations. This
      matches the H2 pattern: the repair generates a response, but the verify-after-repair step
      detects the repaired response as equally or more violated.

      Previous attempt (exp2767) stalled 3x due to Gemini rate limiting. This attempt uses Claude Opus.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (verify_and_repair method — the repair loop)
      - python/carnot/pipeline/repair_prompt.py (if exists — repair prompt construction)
      - results/experiment_2754_empirical_delta_audit.json (root_cause, verbose_repair_log if present)
      - git log --oneline python/carnot/pipeline/ -30 (recent changes to repair pipeline)

      TASK: Find and fix the H2 regression in the repair pipeline.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `cd {project_root} && .venv/bin/python -c "from carnot.pipeline.verify_repair import VerifyRepairPipeline; print('import OK')"` — confirm importable.
         b. `ls {project_root}/data/fover_corpus.jsonl` — confirm corpus exists.
         c. Read results/experiment_2754_empirical_delta_audit.json — understand what verbose logging revealed.
         d. Run `cd {project_root} && git log --oneline python/carnot/pipeline/ -30 2>&1 | head -30` — identify recent commits.
         Record: preconditions_checked.

      1. Read results/experiment_2754_empirical_delta_audit.json carefully.
         Note: what is the root_cause field? What does verbose_repair_log show?
         Identify the specific failure pattern: does repair generate an empty response? Does it return
         the same response? Does the re-verify step show energy increasing?

      2. Inspect the repair pipeline code:
         - Read python/carnot/pipeline/verify_repair.py: the verify_and_repair() method
         - Trace the repair loop: how is the repair prompt constructed? How is the repaired response
           scored? What determines if repair "succeeded"?

      3. Run a minimal reproduction test WITHOUT a live model (use the FoVer corpus to simulate):
         ```python
         from carnot.pipeline.verify_repair import VerifyRepairPipeline
         import json
         pairs = [json.loads(l) for l in open("data/fover_corpus.jsonl")][:5]
         pipeline = VerifyRepairPipeline()
         for p in pairs:
             result = pipeline.verify(p.get("question",""), p.get("violated_response",""))
             print(f"energy={result.energy}, n_constraints={len(result.constraints)}")
         ```
         This tests whether the verify stage produces non-zero energy (prerequisite for delta > 0).

      4. Based on results:
         CASE A (verify produces non-zero energy on FoVer):
           The verify stage works. The delta=0 issue is in the repair stage.
           Read the repair loop logic. Look for these regression patterns:
           - Repair prompt that asks to "rewrite" without specifying what to fix → model may produce same response
           - Delta check that uses the SAME verify call before and after → same energy = delta=0 by construction
           - Off-by-one: comparing energy of wrong iteration
           Fix the specific bug found. Test with N=10 FoVer pairs.

         CASE B (verify produces zero energy on FoVer):
           The zero-energy issue is not yet fixed (exp2790 should address this, but if it
           didn't, report the same energy=0 diagnosis).
           Set delta_fixed=false, root_cause_identified=true with diagnosis="energy_zero_upstream".

      5. If fix found and implemented: run N=20 FoVer pairs through verify_and_repair() with a mock
         repair function (just return "The corrected answer is 42."):
         ```python
         def mock_repair_fn(violation_context):
             return "The corrected answer is 42."
         ```
         Check that empirical_delta > 0 (mock repair produces different energy than original).

      6. Record findings, write artifact.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal prefix required for conductor classification."
        delta_fixed: bool
          principle: "Primary gate — exp2798 paper theory v5 depends on this."
        root_cause_identified: bool
        regression_commit: str or null
          principle: "Git commit hash of the regression, if found via bisect."
        fix_description: str
        empirical_delta_post_fix: float
          principle: "Measured delta after fix; must be > 0.10 for paper claim to be valid."
        n_pairs_tested: int
        preconditions_checked: list
        duration_s: float
        random_seed: 42
        reproducibility_checksum: str

      Run `date -u +"%Y-%m-%dT%H:%M:%SZ"` at start and end.
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2792
    milestone: "2026.05.264"
    deliverable: "results/experiment_2792_fr11_full_benchmark_n50.json"
    title: "FR-11 Tier 4 Full Benchmark N=50: Real Production Validation"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 40
    track: research
    continuous_self_learning_task: true

    prior_failures:
      - experiment_id: exp2781-fr11-full-benchmark-n50
        verdict: "SKIP — pre-tests failing (WeakStrongRouter ImportError cascade)"
        addressed_by: "exp2781 was SKIPPED due to pre-test cascade. Outer-loop commit b729ba788 fixes this. Same N=50 benchmark scope."
        retire_if_same_verdict: true
      - experiment_id: exp2768-fr11-production-integration
        verdict: "complete: smoke test passed (N=3, duration=8s — suspicious low duration)"
        addressed_by: "exp2768 only ran N=3 examples with duration=8s — too short to be a real benchmark. This exp2792 targets N=50 with proper timing gates and verifies cycle-to-cycle AUROC progression is not fabricated."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      FR-11 Tier 4 (ORCA-NEXUS continuous self-learning) was validated in exp2755 (AUROC=0.9275,
      34 rules, cycle3 with pool_test_overlap=0). The production integration in exp2768 was a
      smoke test (N=3, duration=8s) — insufficient for a headline claim.

      This experiment runs the full FR-11 Tier 4 benchmark at N=50 with proper statistical gates.
      This is the primary continuous_self_learning_task for milestone .264 per the FR-11 mandate.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (learning_mode parameter added in exp2768)
      - results/experiment_2755_fr11_tier4_adversarial_recheck_v2.json (benchmark protocol)
      - results/experiment_2768_fr11_production_integration.json (smoke test config)

      TASK: Run FR-11 Tier 4 benchmark at N=50 with real cycle-to-cycle progression measurement.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `cd {project_root} && .venv/bin/python -c "from carnot.pipeline.verify_repair import VerifyRepairPipeline; vr = VerifyRepairPipeline(learning_mode=True); print('learning_mode OK')"` — confirm learning_mode works.
         b. `ls {project_root}/data/fover_corpus.jsonl && wc -l {project_root}/data/fover_corpus.jsonl` — confirm corpus has ≥ 150 examples (50 for learning pool + 50 for cycle2 pool + 50 for held-out test).
         c. Read results/experiment_2755_fr11_tier4_adversarial_recheck_v2.json to understand cycle structure.
         If any precondition fails: write honest_verdict 'blocked_<resource>' and exit.
         Record: preconditions_checked.

      1. Set up FR-11 Tier 4 benchmark with 3 cycles:
         - Seed 42. Load N=150 FoVer pairs. Split: first 50 = learning pool (cycle1), next 50 = cycle2 pool, last 50 = held-out test.
         - Cycle 1: train NEXUS constraint memory on learning pool (50 pairs). Evaluate on held-out test → auroc_cycle1.
         - Cycle 2: add cycle2 pool to NEXUS memory. Re-evaluate on SAME held-out test → auroc_cycle2.
         - Cycle 3: re-evaluate without adding new data → auroc_cycle3.
         - pool_test_overlap: verify learning pool and test set have 0 overlap by ID.

      2. Compute learning progression metrics:
         - delta_cycle1_to_cycle3 = auroc_cycle3 - auroc_cycle1
         - n_rules_after_cycle2: count unique rules in NEXUS memory

      3. Adversarial check:
         - If auroc_cycle1 == auroc_cycle2 to 5 sig figs AND duration_s < 30: set adversarial_flag=true, honest_verdict='blocked_suspicious_tautology'
         - If total duration_s < 5: set honest_verdict='blocked_duration_too_short'

      4. Write artifact with full benchmark results.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal prefix required; blocked_* if adversarial check fails."
        fr11_full_benchmark_validated: bool
          principle: "True if N≥50 AND AUROC > 0.85 AND pool_test_overlap=0 — headline claim gate."
        auroc_cycle1: float
        auroc_cycle2: float
        auroc_cycle3: float
        delta_cycle1_to_cycle3: float
          principle: "Learning progression metric; must be > 0 for the self-learning claim to hold."
        pool_test_overlap: int
          principle: "Must be 0; non-zero overlap means AUROC is inflated by train-test leakage."
        n_rules_final: int
