        5. Write deliverable to results/experiment_2253_archive.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required (complete:/success:) so conductor classifies this as a closed task, not a partial."
        archive_ready:
          principle: "Boolean gate for downstream tasks confirming .222 was appended to research-complete.yaml before roadmap swap."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2254-pretest-fix
    title: "Phase 0: Fix Duplicate test_compositional_energy Module (Pre-Test Failure)"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2254_pretest_fix.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 20
    prior_failures:
      - experiment_id: exp2249-kv260-rtl-verilator
        verdict: blocked_gate_check_failed
        addressed_by: "exp2249 was blocked by gate_check_failed. Root cause diagnosed post-.222: pytest import collision between tests/python/phase3/test_compositional_energy.py and tests/python/models/test_compositional_energy.py (same module name). This task resolves the systemic pre-test failure directly."
    prompt: |
      CONTEXT: A systemic pre-test failure has been causing SKIP and GATE_BLOCK events across
      milestones .216-.222. Root cause: pytest discovers two files with the same basename
      'test_compositional_energy.py' in different directories:
        - tests/python/models/test_compositional_energy.py
        - tests/python/phase3/test_compositional_energy.py
      pytest's import system cannot distinguish them, causing: "import file mismatch" error and
      stopping all tests. This blocks the conductor's pre-test check, causing downstream tasks to
      be SKIPped or gate-blocked.
      EXISTING CODE TO READ FIRST:
        {project_root}/tests/python/phase3/test_compositional_energy.py
        {project_root}/tests/python/models/test_compositional_energy.py
      TASK: Rename the phase3 test file to avoid the duplicate module name and verify tests pass.
      CONCRETE STEPS:
        1. Rename tests/python/phase3/test_compositional_energy.py to
           tests/python/phase3/test_phase3_compositional_energy.py
           (use git mv so version control tracks the rename).
        2. Update any imports in the renamed file if needed (check for
           'from test_compositional_energy import ...' patterns).
        3. Run: cd {project_root} && .venv/bin/python -m pytest tests/python -x -q --no-cov
           -p no:cacheprovider 2>&1 | tail -5
           Record: n_failures, n_errors, n_warnings.
        4. Set pretest_fixed: true if n_errors == 0 AND n_failures == 0.
        5. Write deliverable to results/experiment_2254_pretest_fix.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: Terminal-prefix required. complete: if pre-test errors resolved.
        - pretest_fixed: Boolean gate for all downstream tasks previously gate-blocked by the pre-test failure.
        - n_errors: Records post-fix pytest error count; must be 0 for gate to open.
        - n_failures: Records post-fix test failure count; must be 0 to confirm no regressions.
        - renamed_file: Records the new file path so reviewers can verify the fix.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2255-fst-real-scale-live-gen
    title: "Phase 1: FST+ODAR+CASAL Real-Scale Live Generation Benchmark"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2255_fst_live_gen.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 50
    gated_on:
      - upstream: exp2254-pretest-fix
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2251-capstone-v222
        verdict: complete
        addressed_by: "exp2251 was the .222 capstone but only performed a one-token GGUF probe (not full answer generation). This task explicitly requires full multi-sentence answer generation as the primary deliverable — a materially different acceptance gate."
    prompt: |
      CONTEXT: The .222 capstone (exp2251) demonstrated that FST+ODAR+CASAL interoperate, but
      the 'live hardware evidence was limited to a successful one-token GGUF probe on GPU 0,
      not full live answer generation.' This is the key gap to close in .223. We need full
      answer generation (multi-sentence, not single token) to validate the verify-repair stack
      at the product level.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/python/carnot/pipeline/odar_router.py
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/scripts/experiment_template.py
      TASK: Run 20 full generate+verify passes on a cached SOTA GGUF, generating complete answers.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. python/carnot/pipeline/odar_router.py imports — else blocked_odar_missing.
           b. python/carnot/training/fast_slow.py imports — else blocked_fst_missing.
           c. python/carnot/samplers/casal.py imports — else blocked_casal_missing.
           d. ls ~/.cache/huggingface/hub/ | grep -i "gemma-4-26B\|Qwen3.6-35B\|gemma-4-31B" returns non-empty —
              else blocked_model_not_cached. Do NOT fabricate GPU inference.
        1. MODEL_SPECS must include at least one of:
           - unsloth/Qwen3.6-35B-A3B-GGUF
           - unsloth/gemma-4-31B-it-GGUF
           - unsloth/gemma-4-26B-A4B-it-GGUF
        2. Construct 20 math/reasoning prompts (e.g., multi-step arithmetic, simple logic).
        3. For each prompt: generate a FULL ANSWER (minimum 50 tokens, not just next-token).
           Record the full generated text.
        4. For each answer: run ODAR routing (does this answer need deliberative verification?);
           if yes, run FST context prep + CASAL constraint enforcement on the answer.
        5. Measure:
           - n_violations_found: count of answers where a constraint violation was detected
           - n_violations_repaired: count where repair reduced energy
           - mean_constraint_violation_after_repair
           - mean_answer_length_tokens: must be >= 50 (not a one-token probe)
           - odar_fast_path_fraction: fraction routed to fast path
        6. Set fst_live_validated: true if n_violations_found >= 1 AND
           mean_answer_length_tokens >= 50.
        7. Write deliverable to results/experiment_2255_fst_live_gen.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: Terminal-prefix required. complete: if fst_live_validated is true.
        - fst_live_validated: Primary gate for exp2264 capstone. True only when violations were found in FULL answers (not token probes).
        - mean_answer_length_tokens: Must be >= 50 to claim full answer generation; prevents single-token probe from satisfying the gate.
        - n_violations_found: At least 1 required to demonstrate the pipeline is actually running verification, not just generating.
        - n_violations_repaired: Records repair effectiveness; 0 is acceptable (honest finding) but > 0 is the headline claim.
        - models_used: Records which SOTA GGUF ran so claims are model-specific.
        - preconditions_checked: Lists which resources were verified before inference; pre-empts fabrication.
        - duration_s: Real compute takes wall-clock time; implausibly short duration flags fabrication.
        - random_seed: Reproducibility for the 20-example corpus.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2256-fr11-fst-multidomain
    title: "Phase 1: FR-11 FST Multi-Domain Retention Validation"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2256_fr11_multidomain.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2255-fst-real-scale-live-gen
        artifact_field: fst_live_validated
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2241-fr11-fst-eval
        verdict: complete
        addressed_by: "exp2241 validated FST on a single-domain synthetic corpus (30 examples, single arithmetic domain). This task extends to multi-domain retention (math, code, logic) using live-generated data — a new evaluation scope testing cross-domain generalization."
    prompt: |
      CONTEXT: FR-11 continuous self-learning mandate. exp2241 proved FST achieves 4x sample
      efficiency on a single-domain corpus. This task validates that FST fast-weight updates
      generalize across domains: fast weights learned on math problems should partially help
      with code and logic problems. Cross-domain retention is the critical FR-11 property that
      distinguishes Carnot from per-task fine-tuning.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/scripts/experiment_template.py
        {project_root}/results/experiment_2255_fst_live_gen.json
      TASK: Validate FST fast-weight retention across 3 reasoning domains.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/training/fast_slow.py imports — else blocked_fst_missing.
        1. Create 3 domain corpora (10 examples each, synthetic, no external LLM calls):
           Domain A: arithmetic (a + b = c style)
           Domain B: code constraints (loop bounds, array indices)
           Domain C: logic propositions (if P then Q style)
        2. Run FST learning in sequence: Domain A → Domain B → Domain C.
        3. After Domain C training, evaluate fast-weight performance on held-out Domain A examples.
        4. Measure:
           - cross_domain_retention_rate: accuracy on Domain A after Domain C training / accuracy
             on Domain A after Domain A training
           - per_domain_utility_delta: energy reduction per domain
        5. Set fr11_multidomain_passed: true if cross_domain_retention_rate >= 0.75.
        6. Write deliverable with continuous_self_learning_task: true.
        7. Write deliverable to results/experiment_2256_fr11_multidomain.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required. complete: if cross_domain_retention_rate >= 0.75."
        continuous_self_learning_task:
          principle: "Must be true — FR-11 mandate requires at least one CSL task per milestone."
        fr11_multidomain_passed:
          principle: "Boolean gate. True only when cross-domain retention >= 0.75."
        cross_domain_retention_rate:
          principle: "Primary FR-11 gate at multi-domain scale; below 0.75 means FST overfits to each domain independently."
        per_domain_utility_delta:
          principle: "Per-domain energy reduction records whether FST helps each domain independently."
        n_corpus_per_domain:
          principle: "Must be >= 10 per domain for the retention claim to be statistically non-trivial."
        preconditions_checked:
          principle: "Lists FST module availability check."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2257-odar-real-inference-benchmark
    title: "Phase 1: ODAR Real-Inference Routing Overhead Benchmark"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2257_odar_real_benchmark.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    prior_failures:
      - experiment_id: exp2244-odar-benchmark
        verdict: complete
        addressed_by: "exp2244 benchmarked ODAR on a 30-example SYNTHETIC corpus with artificially classified EFE values. This task benchmarks on a 100-example corpus using REAL EFE computation from Tier 0 probe outputs — the first time ODAR's routing overhead is measured on genuine inference data rather than synthetic oracle labels."
    prompt: |
      CONTEXT: exp2244 validated ODAR's compute reduction on a synthetic corpus where EFE values
      were constructed artificially. To claim ODAR reduces real inference overhead, we need a
      benchmark on actual Tier 0 probe outputs from the verify-repair pipeline. This also
      measures routing_overhead_ms, which was not measured in exp2244.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/odar_router.py
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/scripts/experiment_template.py
      TASK: Benchmark ODAR on 100 examples using real Tier 0 probe EFE computation.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/pipeline/odar_router.py imports — else blocked_odar_missing.
        1. Construct 100 reasoning examples (synthetic text, no external LLM calls).
        2. For each example:
           - Run Tier 0 probes (existing verify pipeline) to get real probe outputs.
           - Compute EFE from those outputs via FreeEnergyRouter.
           - Route: FAST_PATH or DELIBERATIVE.
           - Record wall-clock time for routing decision (routing_overhead_ms).
        3. Regime A (uniform): always run full verification cascade.
           Regime B (ODAR): route by EFE threshold.
        4. Measure:
           - compute_reduction_pct vs uniform
           - routing_overhead_ms (median per decision)
           - fast_path_fraction
           - accuracy_delta (must be >= -2pp)
        5. Set odar_real_validated: true if compute_reduction_pct >= 25 AND routing_overhead_ms <= 5.
        6. Write deliverable to results/experiment_2257_odar_real_benchmark.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required. complete: if odar_real_validated is true."
        odar_real_validated:
          principle: "Boolean gate. True only when compute_reduction_pct >= 25 from real probe EFE."
        compute_reduction_pct:
          principle: "Primary gate: must be >= 25 on real inference data (not synthetic labels)."
        routing_overhead_ms:
          principle: "Records EFE computation cost; must be <= 5ms to be negligible vs cascade cost."
        accuracy_delta:
          principle: "Guards against trading accuracy for speed; must be >= -2pp."
        n_corpus:
          principle: "Must be 100 for statistical significance claims."
        preconditions_checked:
          principle: "Lists ODAR module availability check."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2258-kancl-n256-clean-reattempt
    title: "Phase 2: KAN-CL n=256 Per-Knot Regularization Clean Re-attempt"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2258_kancl_n256.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2254-pretest-fix
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2247-kancl-n256-scaling
        verdict: blocked_gate_check_failed
        addressed_by: "exp2247 had blocked_gate_check_failed because the .222 YAML included exp2248 (titled 'THRML/Carnot Parity at n=256 with KAN-CL') which matched the retired exclusion pattern 'THRML/Carnot parity n=256', cascade-blocking exp2247 at activation time. Root cause: scope contamination from exp2248 in the same milestone YAML. Fix: this task's title, description, and ALL deliverable fields reference ONLY KAN-CL per-knot importance regularization — no THRML parity measurement, no bounded_kl field, no reference to THRML at all. This task is purely about catastrophic forgetting in KAN's spline parameterization at n=256 spin Ising scale."
    prompt: |
      CONTEXT: KAN-CL per-knot importance regularization was proven at small n in .221 (exp2231).
      The .222 re-attempt at n=256 (exp2247) was blocked because the SAME YAML included exp2248
      (THRML/Carnot Parity at n=256) which matched a retired exclusion pattern. This task is
      a CLEAN re-attempt: NO THRML parity, NO bounded_kl metric — purely per-knot importance
      regularization and retention across sequential constraint domains.
      COOL (Springer 2026) demonstrated 20μs update latency with KANs on n=256-class tasks.
      We validate that Carnot's KAN-CL achieves >= 0.85 retention on Domain 1 after Domain 3
      training, at n=256 spin Ising scale.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/models/substrate_kan.py
        {project_root}/python/carnot/samplers/parallel_ising.py
        {project_root}/scripts/experiment_template.py
      TASK: Validate KAN-CL per-knot importance at n=256 without THRML parity measurement.
      CONCRETE STEPS:
        1. Construct an Ising model with n=256 spins (random J and h, random_seed=42).
        2. Define 3 sequential constraint domains:
           Domain 1: ferromagnetic coupling pattern (J_ij = +1 for nearest neighbors)
           Domain 2: antiferromagnetic coupling (J_ij = -1 for nearest neighbors)
           Domain 3: random sparse coupling (random J, 20% non-zero)
        3. Train KAN-CL with per-knot importance enabled for each domain in sequence.
        4. After Domain 3 training, evaluate accuracy on held-out Domain 1 test instances.
        5. Measure:
           - n256_retention_rate: accuracy on Domain 1 after Domain 3 / accuracy after Domain 1
           - per_knot_update_latency_us: mean update time per step in microseconds
           - n_active_knots: count of importance-weighted active knots after Domain 3
        6. Set kancl_n256_validated: true if n256_retention_rate >= 0.85.
        7. Write deliverable to results/experiment_2258_kancl_n256.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: Terminal-prefix required. complete: if n256_retention_rate >= 0.85.
        - kancl_n256_validated: Boolean gate for exp2259 and exp2264. True only if retention >= 0.85 at n=256.
        - n256_retention_rate: Primary COOL-parity gate. >= 0.85 means per-knot importance prevents catastrophic forgetting at this scale.
        - per_knot_update_latency_us: Records whether COOL's 20us budget is achievable; informs hardware feasibility story.
        - n_active_knots: Sparsity metric; fewer active knots = more efficient; records importance mask effectiveness.
        - random_seed: Reproducibility for sequential domain training; must be 42.
        - n_spins: Must be 256 to confirm this is the n=256 scale experiment, not a smaller surrogate.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2259-kancl-casal-joint
    title: "Phase 2: KAN-CL n=256 + CASAL Joint Constraint Enforcement"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2259_kancl_casal_joint.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2258-kancl-n256-clean-reattempt
        artifact_field: kancl_n256_validated
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2248-thrml-parity-n256
        verdict: blocked_gate_check_failed
        addressed_by: "exp2248 was titled 'THRML/Carnot Parity at n=256 with KAN-CL' — it matched the retired pattern 'THRML/Carnot parity n=256' and was blocked. This task instead measures KAN-CL importance weights + CASAL primal-dual sampling JOINTLY, with no THRML comparison. The scope is integration testing of two .222-.223 modules, not parity measurement."
    prompt: |
      CONTEXT: KAN-CL (exp2258) provides per-knot importance regularization at n=256.
      CASAL (.222 exp2245) provides primal-dual hard-constraint sampling. Integrating them:
      when a constraint equality is violated in the energy landscape, CASAL enforces hard
      satisfaction while KAN-CL importance weights determine which spline knots are updated
      to remember this constraint pattern.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/models/substrate_kan.py
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/scripts/experiment_template.py
      TASK: Evaluate KAN-CL importance weighting + CASAL hard-constraint sampling jointly.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/samplers/casal.py imports — else blocked_casal_missing.
        1. Define 2D continuous EBM with n=256 binary variables and 3 hard equality constraints.
        2. Run joint training loop (10 iterations):
           - CASAL sampler generates constraint-satisfying samples
           - KAN-CL importance weights updated based on which knots activated on violations
        3. Measure:
           - joint_constraint_satisfaction_rate: fraction of samples satisfying all 3 constraints
           - importance_weight_coverage: fraction of violated-constraint knots with high importance
        4. Set kancl_casal_joint_validated: true if joint_constraint_satisfaction_rate >= 0.90.
        5. Write deliverable to results/experiment_2259_kancl_casal_joint.json.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefix required. complete: if joint_constraint_satisfaction_rate >= 0.90."
        kancl_casal_joint_validated:
          principle: "Boolean gate. True when >= 90% of samples satisfy all hard constraints."
        joint_constraint_satisfaction_rate:
          principle: "Primary integration gate: CASAL must enforce hard constraints even as KAN-CL updates."
        importance_weight_coverage:
          principle: "Validates that importance weighting targets the right knots (those activated by violations)."
        preconditions_checked:
          principle: "Lists CASAL module availability check."
        random_seed:
          principle: "Reproducibility for the joint training loop."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2260-kv260-rtl-clean-reattempt
    title: "Phase 3: KV260 RTL Verilator Lint + Icarus Simulation Clean Re-attempt"
    milestone: "2026.05.223"
    deliverable: "results/experiment_2260_kv260_rtl.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2254-pretest-fix
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2249-kv260-rtl-verilator
        verdict: blocked_gate_check_failed
        addressed_by: "exp2249 was blocked_gate_check_failed because verilator/iverilog toolchain availability was not checked as a PRECONDITION before activation — the conductor's activation guard failed. This task adds explicit PRECONDITIONS (check verilator AND iverilog BEFORE any RTL work) per CLAUDE.md Pre-Launch Preconditions Discipline. If tools missing, emit blocked_toolchain_missing immediately."
      - experiment_id: exp2247-kancl-n256-scaling
        verdict: blocked_gate_check_failed
        addressed_by: "exp2247 cascade-blocked exp2248 which cascade-blocked exp2249 via dependency contamination. This task is independent and does not depend on any KAN-CL or THRML results."
    prompt: |
      CONTEXT: The KV260 RTL track (architecture.md active track) has been blocked for multiple
      milestones. The .222 attempt (exp2249) had blocked_gate_check_failed because verilator and
      iverilog availability was not checked as preconditions before activation. Claim boundary:
      source-level only — no bitfile or board claim until Vivado synthesis runs.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/hardware/transpiler/
        {project_root}/python/carnot/samplers/parallel_ising.py
      TASK: Run Verilator lint and Icarus 10-cycle simulation on Carnot's parallel Ising RTL.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. command -v verilator succeeds — else write honest_verdict blocked_verilator_missing
              and exit. DO NOT fabricate lint output.
           b. command -v iverilog succeeds — else write honest_verdict blocked_iverilog_missing
              and exit.
        1. Locate existing Verilog RTL under {project_root}/python/carnot/hardware/ OR generate
           a minimal parallel Ising Gibbs structural stub if no .v file exists. Record rtl_source_path.
        2. Run: verilator --lint-only <rtl_file>
           Record lint_warnings_count and lint_errors_count.
        3. If lint_errors_count == 0: run iverilog -o /tmp/ising_sim <rtl_file> && vvp /tmp/ising_sim
           Record simulation_cycles_completed.
        4. Write deliverable to results/experiment_2260_kv260_rtl.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: Terminal-prefix required. complete: if lint executed (even with warnings). blocked_verilator_missing or blocked_iverilog_missing if tools absent.
        - lint_errors_count: Zero is the gate for exp2261 synthesis. Even one error prevents synthesis claims.
        - lint_warnings_count: Non-zero is acceptable; records RTL quality baseline.
        - rtl_source_path: Records which RTL file was linted; prevents re-runs on stale or fabricated sources.
        - simulation_cycles_completed: Records iverilog run evidence; zero means simulation was skipped (lint errors present).
        - preconditions_checked: Lists Verilator and Icarus availability checks. MANDATORY per Pre-Launch Preconditions Discipline.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2261-oss-cad-synthesis
    title: "Phase 3: OSS-CAD-Suite Yosys Synthesis from Lint-Passing RTL"
