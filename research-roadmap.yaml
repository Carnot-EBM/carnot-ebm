    retire_if_same_verdict: false
  prompt: "CONTEXT: Milestone 2026.05.245 completed. arxiv_ready=True for the first time (exp2553). AUROC 0.9857 (ensemble v7b). Phase 4 retired as honest negative. This task archives .245 to research-complete.yaml and activates .246.\n\nKEY .245 RESULTS:\n  best_245_auroc=0.9857 (ensemble v7b, 5-seed, adversarially verified)\n  phase4_final_status=retired_negative_option_b\n  arxiv_ready=True (all 4 gates satisfied)\n  operator_recommendation=submit_now\n  gatemate_status=jtag_detected_strtol_parse_error (not flashed)\n  kv260_status=sd_media_absent_pynq_url_unreachable (not flashed)\n  jepa_discrimination_improved=True (fast_path_rate in [0.30, 0.80])\n  tier0s_real_auroc=0.3758 (synthetic claim was 1.0 — inflated)\n  tier0u_real_auroc=0.5360 (synthetic claim was 0.96 — inflated)\n  tier0r_real_auroc=0.9414 (solid)\n  tier0v_hallufield=blocked_carnot_import_failed\n  n_experiments_completed=9 of 11 capstone inputs\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/research-complete.yaml (last 5 lines — check if .245 entry already exists)\n  {project_root}/research-roadmap.yaml (first 3 lines — check milestone field)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. python3 -c \"import yaml, sys; d=list(yaml.safe_load_all(open('{project_root}/research-roadmap.yaml')))[0]; print(d.get('milestone','not_found'))\"\n        If milestone == '2026.05.245': proceed.\n        If milestone == '2026.05.246': conductor already swapped; check research-complete.yaml for '2026.05.245' entry; if present: write archive_ready=true and exit.\n        If other: write honest_verdict 'blocked_roadmap_unexpected_milestone' and exit.\n  1. Check if .245 entry already in research-complete.yaml:\n     python3 -c \"data=open('{project_root}/research-complete.yaml').read(); print('found' if '2026.05.245' in data else 'not_found')\"\n     If not found: append entry:\n       ---\n       id: '2026.05.245'\n       completed: '2026-05-20'\n       milestone_title: 'Post-arXiv Paper Integrity + Hardware Terminal + Ensemble Expansion v8'\n       best_auroc: 0.9857\n       phase4_final_status: retired_negative_option_b\n       arxiv_ready: true\n       n_experiments_completed: 9\n       top_successes:\n         - arxiv_ready=True (first time; exp2553 all 4 gates satisfied)\n         - ensemble v7b AUROC 0.9857 (exp2546; 5-seed adversarially verified)\n         - Phase 4 Option B executed (exp2544; honest negative in main.tex)\n  2. cp {project_root}/research-roadmap-next.yaml {project_root}/research-roadmap.yaml\n  3. Append to ops/changelog.md:\n     '## 2026-05-20 (Milestone 2026.05.246 activated)'\n     '- Archive .245: arxiv_ready=True; best_auroc=0.9857; phase4=retired_negative; gatemate=strtol_error; kv260=sd_absent'\n     '- .246 priorities: paper errata (tier0s/tier0u inflated claims), hardware terminal, ensemble v8'\n  4. Write deliverable artifact.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required (complete:/success:/passed:/shipped:). Conductor reconciler classifies terminal verdicts by this prefix.\"\n  - archive_ready:\n      principle: \"True only after .245 entry confirmed in research-complete.yaml. Guards against partial archive.\"\n  - milestone_archived:\n      principle: \"Records which milestone was archived (2026.05.245) for audit trail.\"\n  - preconditions_checked:\n      principle: \"Records which preconditions were verified before launching.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"archive_ready == true\"\n    principle: \"Ensures research-complete.yaml records .245 outcomes before .246 begins.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2557-paper-errata-tier0s-tier0u
  title: 'Phase 1a: Paper-v6 Errata — Retire Inflated tier0s/tier0u Synthetic AUROC Claims'
  milestone: 2026.05.246
  deliverable: results/experiment_2557_paper_errata.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2552-paper-v6-final-writethrough
    verdict: 'complete: paper_updated=True; citations_added=[arXiv:2512.18730, arXiv:2604.17109, arXiv:2605.09515]'
    addressed_by: "exp2552 updated §5 with ensemble v7b AUROC and added citations. It did NOT retire the inflated tier0s/tier0u synthetic AUROC claims (0.3758 and 0.5360 real-corpus vs 1.0 and 0.96 synthetic). The .246 real-corpus results (exp2548) revealed these inflations AFTER exp2552 ran. This is a subsequent errata pass addressing a different section edit with new information. Not a rerun of exp2552."
    retire_if_same_verdict: false
  prompt: "CONTEXT: Milestone .245 exp2548 revealed severe synthetic-vs-real AUROC gaps:\n  Tier 0s (HalluGuard NTK): synthetic AUROC=1.0 → real-corpus AUROC=0.3758 (n=6548 FoVer)\n  Tier 0u (Logical Consistency): synthetic AUROC=0.96 → real-corpus AUROC=0.5360 (n=6548 FoVer)\n  Tier 0r (Curry-Howard): synthetic AUROC=0.8256 → real-corpus AUROC=0.9414 (solid)\n\nIf operator submits to arXiv with tier0s=1.0 and tier0u=0.96 in the paper, Carnot's scientific credibility is at risk. This task updates main.tex BEFORE the operator submits.\n\nTHREE EDITS REQUIRED:\n  1. Find any table or text claiming tier0s_auroc=1.0 or tier0u_auroc=0.96 and replace with real-corpus values (0.3758 and 0.5360). Label them as synthetic-only if they appear in a synthetic-eval section.\n  2. Add a footnote or caveat near tier0s/tier0u entries: 'synthetic corpus only; real-corpus AUROC = X.XXXX (FoVer, n=6548, exp2548)'\n  3. If tier0s/tier0u appear in any headline claim or abstract, replace with the honest values OR remove them from the headline claim (the headline AUROC 0.9857 is ensemble v7b, which is cite-safe).\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/docs/arxiv-paper/main.tex (search for tier0s, tier0u, 0.96, 1.0 hallucination values near verifier tables)\n  {project_root}/results/experiment_2548_real_corpus_validation.json (real-corpus AUROC values)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. ls {project_root}/docs/arxiv-paper/main.tex\n        If not found: write honest_verdict 'blocked_paper_not_found' and exit.\n     b. python3 -c \"import json; d=json.load(open('results/experiment_2548_real_corpus_validation.json')); print('tier0s:', d.get('tier0s_real_auroc'), 'tier0u:', d.get('tier0u_real_auroc'), 'n:', d.get('n_real'))\"\n        If exp2548 artifact not found: use known values tier0s=0.3758, tier0u=0.5360, n=6548.\n  1. Search for inflated values in main.tex:\n     grep -n 'tier0s\\|tier0u\\|0\\.96\\|1\\.0\\|NTK\\|logical.consist' {project_root}/docs/arxiv-paper/main.tex -i | head -20\n  2. For each found location: replace the AUROC value with real-corpus value and add the caveat label.\n  3. Verify the headline AUROC (0.9857, ensemble v7b) is unchanged.\n  4. Run LaTeX compile to confirm no regressions:\n     command -v tectonic && cd {project_root}/docs/arxiv-paper && tectonic main.tex 2>&1 | tail -5\n  5. Set paper_errata_applied=True, tier0s_corrected=True, tier0u_corrected=True.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - paper_errata_applied:\n      principle: \"True if main.tex was updated with real-corpus AUROC values. Primary gate for exp2558 (arxiv final package).\"\n  - tier0s_corrected:\n      principle: \"True if the 1.0 synthetic AUROC for tier0s was replaced or clearly labeled as synthetic-only. Prevents false scientific claim.\"\n  - tier0u_corrected:\n      principle: \"True if the 0.96 synthetic AUROC for tier0u was replaced or clearly labeled as synthetic-only. Prevents false scientific claim.\"\n  - headline_auroc_unchanged:\n      principle: \"True if ensemble v7b AUROC 0.9857 is still the headline metric — errata must not accidentally downgrade the cite-safe headline number.\"\n  - latex_compile_success:\n      principle: \"Must remain True after errata — broken LaTeX would block arXiv submission.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"paper_errata_applied == true AND latex_compile_success == true\"\n    principle: \"Both conditions required: errata applied AND paper still compiles. An errata that breaks LaTeX is worse than no errata.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2558-arxiv-final-package-v4
  title: 'Phase 1b: arXiv Final Submission Package v4 (post-errata; operator submits)'
  milestone: 2026.05.246
  deliverable: results/experiment_2558_arxiv_package_v4.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 25
  gated_on:
  - upstream: exp2557-paper-errata-tier0s-tier0u
    artifact_field: paper_errata_applied
    op: '=='
    value: true
  prior_failures:
  - experiment_id: exp2553-arxiv-final-package-v3
    verdict: 'complete: arxiv_ready=True; latex_compile_success=True; abstract_word_count=212; gate_3_phase4_resolved=True'
    addressed_by: "exp2553 produced the v3 submission package with arxiv_ready=True. This v4 package incorporates the exp2557 errata (corrected tier0s/tier0u AUROC values). Different content from v3 (errata-updated main.tex). Recurring paper-prep task. retire_if_same_verdict=false."
    retire_if_same_verdict: false
  prompt: "CONTEXT: exp2557 has corrected inflated tier0s/tier0u AUROC claims in main.tex. This task produces the final arXiv submission package v4 incorporating the errata and verifies all 4 gates still hold.\n\nOPERATOR-ONLY SUBMISSION RULE: This task PREPARES the package for operator submission. Per CLAUDE.md Operator-Only External Publication, this task NEVER runs 'arxiv submit' or equivalent. Submission is OPERATOR-ONLY.\n\nFOUR GATES:\n  gate_1_phase1_ship: True (PyPI shipped, Apache-2.0)\n  gate_2_audit: True (paper integrity audit passed exp2468 + exp2479)\n  gate_3_phase4_resolved: True (phase4_honest_negative_documented=True from exp2544)\n  gate_4_auroc_adversarially_verified: True (0.9857 from exp2546, 5-seed clean)\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/docs/arxiv-paper/main.tex\n  {project_root}/results/experiment_2557_paper_errata.json (errata applied?)\n  {project_root}/results/experiment_2553_arxiv_package_v3.json (v3 baseline)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. ls {project_root}/docs/arxiv-paper/main.tex\n        If not found: write honest_verdict 'blocked_paper_not_found' and exit.\n     b. python3 -c \"import json; d=json.load(open('results/experiment_2557_paper_errata.json')); assert d.get('paper_errata_applied')==True, 'errata not applied'; print('errata ok')\"\n        If exp2557 artifact not found or errata_applied=False: write honest_verdict 'blocked_errata_not_applied' and exit.\n  1. Compile paper:\n     command -v tectonic && cd {project_root}/docs/arxiv-paper && tectonic main.tex 2>&1 | tail -5\n     Set latex_compile_success=(exit_code == 0).\n  2. Count abstract words:\n     python3 -c \"import re; t=open('docs/arxiv-paper/main.tex').read(); ab=re.search(r'\\\\\\\\begin{{abstract}}(.+?)\\\\\\\\end{{abstract}}',t,re.DOTALL); print(len(ab.group(1).split()) if ab else 'not_found')\"\n     Set abstract_word_count.\n  3. Verify all 4 gates still hold (read from known artifact values above).\n  4. Set arxiv_ready_v4 = (latex_compile_success AND abstract_word_count <= 250 AND\n        gate_1 AND gate_2 AND gate_3 AND gate_4 AND tier0s_corrected AND tier0u_corrected).\n     Where tier0s_corrected and tier0u_corrected are read from exp2557 artifact.\n  5. Produce operator_submission_checklist_v4:\n     - [ ] Confirm tier0s real-corpus AUROC (0.3758) and tier0u (0.5360) labeled correctly in §5\n     - [ ] Confirm headline ensemble v7b AUROC=0.9857 in abstract and results section\n     - [ ] Confirm §4.4 Phase 4 honest negative subsection (exp2544) is present\n     - [ ] Confirm author list and affiliation are correct\n     - [ ] Submit to arXiv at arxiv.org/submit (category: cs.AI, cs.LG)\n  6. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - arxiv_ready_v4:\n      principle: \"True if all 4 gates AND errata corrections verified. Supersedes exp2553 v3 package.\"\n  - submission_package_ready:\n      principle: \"True if mechanically ready for operator submission.\"\n  - tier0s_errata_verified:\n      principle: \"Confirms inflated 1.0 synthetic claim is corrected in this package version.\"\n  - tier0u_errata_verified:\n      principle: \"Confirms inflated 0.96 synthetic claim is corrected in this package version.\"\n  - latex_compile_success:\n      principle: \"Must be True — arXiv LaTeX compiler is strict.\"\n  - abstract_word_count:\n      principle: \"Must be <= 250 for arXiv.\"\n  - operator_submission_checklist_v4:\n      principle: \"Concrete operator action items. Per Operator-Only External Publication rule, the task ends here; operator submits.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"arxiv_ready_v4 == true\"\n    principle: \"All 4 gates plus errata corrections must be satisfied for the post-errata package to be submission-ready.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2559-gatemate-cfg-format-fix
  title: 'Phase 2a (Hardware): GateMate .cfg Format Fix — CC1 Toolchain or openFPGALoader HEAD Build'
  milestone: 2026.05.246
  deliverable: results/experiment_2559_gatemate_cfg_fix.json
  agent_type: claude
  model: opus
  requires_claude: true
  track: hardware
  max_turns: 60
  prior_failures:
  - experiment_id: exp2551-hardware-gatemate-flash-kv260-flash
    verdict: 'complete: gatemate_flash_attempted=True; gatemate_bitstream_flashed=False (openFPGALoader strtol parse error on .cfg — nextpnr-himbaechel dialect incompatibility with openFPGALoader 0.13 parser)'
    addressed_by: "exp2551 identified the root cause: nextpnr-himbaechel 0.10 emits a .cfg dialect that openFPGALoader 0.13 colognechipCfgParser cannot parse (strtol fails mid-bitstream). This task tries two approaches: (A) regenerate using the official Cologne Chip CC1 toolchain (Docker image or binary) which produces a CC1-native .cfg; (B) build openFPGALoader from git HEAD which may have a more permissive parser. Different approach from exp2551 which simply retried flash with existing .cfg."
    retire_if_same_verdict: false
  prompt: "CONTEXT: GateMate A1-EVB-2M is in 'flash-pending' state. The existing bitstream (rtl/gatemate_ising_n16.cfg, 16392 bytes) was generated by nextpnr-himbaechel 0.10 but openFPGALoader 0.13 aborts programming with strtol() parse error mid-bitstream. The .cfg file is ASCII text beginning with '.device CCGM1A1' — the Cologne Chip configuration format — but the specific dialect from nextpnr-himbaechel appears to contain a token that openFPGALoader's colognechipCfgParser.cpp cannot convert to integer.\n\nTWO APPROACHES (try in order):\n  Approach A (preferred): Use the official Cologne Chip CC1 toolchain to re-synthesize the RTL and produce a CC1-native .cfg file that openFPGALoader's parser definitely supports.\n    CC1 toolchain is available at: https://colognechip.com/programmable-logic/gatemate/toolchain/\n    Docker image: colognechip/cc_toolchain (if Docker available) or download the cc_toolchain binary.\n    The Carnot RTL source is at: {project_root}/rtl/ — look for the top-level .v or .vhd file.\n  Approach B (fallback): Build openFPGALoader from git HEAD (https://github.com/trabucayre/openFPGALoader) which may have a more permissive colognechipCfgParser.\n    Build: git clone https://github.com/trabucayre/openFPGALoader && cd openFPGALoader && cmake -B build && cmake --build build -j4\n    Then retry: ./build/openFPGALoader -c dirtyJtag -b olimex_gatemateevb {project_root}/rtl/gatemate_ising_n16.cfg\n\nWHY requires_claude: true — Hardware multi-step coordination: (1) CC1 toolchain download/install/run OR openFPGALoader build from source; (2) diagnose openFPGALoader parser failure; (3) multiple fallback paths; (4) physical JTAG device interaction with real hardware response interpretation. Meets all 3 positive criteria per CLAUDE.md Codex-Default discipline.\n\nEXISTING CODE TO READ FIRST:\n  find {project_root}/rtl -name '*.v' -o -name '*.vhd' -o -name '*.sv' 2>/dev/null | head -5 (locate RTL source)\n  {project_root}/results/experiment_2551_hardware_flash.json (exact strtol error output + JTAG state)\n  {project_root}/ops/hardware-bringup-prep.md (board state overview)\n  ls {project_root}/rtl/ (list RTL files)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. GateMate bitstream exists:\n        ls {project_root}/rtl/gatemate_ising_n16.cfg\n        If not found: write honest_verdict 'blocked_bitstream_not_found' and exit.\n     b. DirtyJTAG USB device:\n        lsusb | grep -i '1209:c0ca\\|DirtyJTAG' || echo 'not_detected'\n        Set gatemate_jtag_detected=(detected or not).\n     c. openFPGALoader current version:\n        openFPGALoader --version 2>&1 | head -1 || echo 'not_found'\n        Set current_openfpgaloader_version.\n     d. Docker available:\n        command -v docker && docker --version | head -1 || echo 'not_found'\n     e. CMake/gcc for building from source:\n        command -v cmake && command -v gcc || echo 'build_tools_not_found'\n\n  1. Inspect the failing .cfg file:\n     head -20 {project_root}/rtl/gatemate_ising_n16.cfg\n     Look for the token that strtol() might fail on. Common issues: hex values without '0x' prefix,\n     scientific notation, or negative numbers in unexpected fields.\n     Set cfg_inspection_note=(description of any suspicious tokens found).\n\n  2. Attempt Approach B first (faster): build openFPGALoader from HEAD:\n     git clone --depth=1 https://github.com/trabucayre/openFPGALoader /tmp/ofl_head 2>&1 | tail -3\n     If clone succeeds:\n       cd /tmp/ofl_head && cmake -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -3\n       cmake --build build -j$(nproc) 2>&1 | tail -5\n       If build succeeds:\n         /tmp/ofl_head/build/openFPGALoader -c dirtyJtag -b olimex_gatemateevb {project_root}/rtl/gatemate_ising_n16.cfg 2>&1\n         Set gatemate_bitstream_flashed=(exit_code == 0).\n\n  3. If Approach B failed or still strtol error: Approach A — CC1 toolchain:\n     Locate RTL source (Verilog or VHDL) in {project_root}/rtl/.\n     Try: docker pull colognechip/cc_toolchain:latest 2>&1 | tail -3\n     If Docker available and pull succeeded:\n       Run synthesis via CC1 toolchain Docker container.\n       Command pattern: docker run --rm -v {project_root}/rtl:/work colognechip/cc_toolchain:latest\n       cc_map top_module -p GateMate_Evaluation_Board -o /work/gatemate_ising_cc1.cfg\n       If CC1 .cfg generated: retry openFPGALoader with the CC1 output.\n\n  4. If both approaches fail: document which specific strtol error token was found and\n     what manual edit might fix it (e.g., convert hex literals, remove comment lines).\n     Set gatemate_bitstream_flashed=False; approach_a_attempted, approach_b_attempted.\n\n  5. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. 'blocked_*' verdicts are valid for physical hardware failures.\"\n  - gatemate_jtag_detected:\n      principle: \"Live JTAG detection confirms hardware is present and accessible.\"\n  - gatemate_bitstream_flashed:\n      principle: \"True if openFPGALoader returned exit code 0. GateMate terminal state requires this.\"\n  - approach_b_attempted:\n      principle: \"True if openFPGALoader HEAD build was attempted.\"\n  - approach_a_attempted:\n      principle: \"True if CC1 toolchain regeneration was attempted.\"\n  - cfg_inspection_note:\n      principle: \"Documents what suspicious tokens (if any) were found in the .cfg that could cause strtol failure.\"\n  - gatemate_smoke_test_result:\n      principle: \"On-board Ising sampler response if flash succeeded.\"\n  - preconditions_checked:\n      principle: \"Records which tools and devices were verified.\"\n  - duration_s:\n      principle: \"Wall-clock. Hardware flash operations take >60s minimum for a real board write.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"gatemate_bitstream_flashed == true OR (approach_a_attempted == true AND approach_b_attempted == true AND preconditions_checked IS NOT NULL)\"\n    principle: \"Hardware continuity discipline: physical flash success OR both approaches exhausted with documented diagnosis. No silent pass-without-attempt.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2560-kv260-operator-docs-update
  title: 'Phase 2b (Hardware): KV260 Operator Flash Documentation Update'
  milestone: 2026.05.246
  deliverable: results/experiment_2560_kv260_operator_docs.json
  agent_type: codex
  model: gpt-5.5
  track: hardware
  max_turns: 25
  prior_failures:
  - experiment_id: exp2551-hardware-gatemate-flash-kv260-flash
    verdict: 'complete: kv260_flash_attempted=False; kv260_pynq_url_reachable=False; kv260_sd_media_inserted=False'
    addressed_by: "exp2551 documented that the KV260 flash is blocked by two operator actions: (1) insert SD card into /dev/sdb; (2) download PYNQ image from pynq.io. This task provides confirmed-reachable PYNQ image URLs, verifies the /dev/sdb slot is the right target, and produces a copy-paste-ready operator procedure. Different deliverable from exp2551 which attempted the flash; this task focuses on documentation + URL verification."
    retire_if_same_verdict: false
  prompt: "CONTEXT: KV260 is in 'operator-action-required' state. The board has bitstream + .hwh generated; /dev/sdb is the SD card slot; but no SD media was inserted and the PYNQ v3.0 image URL was unreachable from this host. This task verifies current PYNQ image URLs and produces a copy-paste-ready operator procedure.\n\nKEY STATE FROM exp2551:\n  kv260_sd_devices: ['/dev/sdb'] (detected)\n  kv260_pynq_url_reachable: False (https://github.com/Xilinx/PYNQ/releases/download/v3.0/kv260-starter-kit-3.0.img.zip)\n  bitstream_ready: True\n  hwh_ready: True\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/results/experiment_2551_hardware_flash.json (operator_commands and device state)\n  {project_root}/results/experiment_2538_kv260_sd_flash.json (prior operator_commands)\n  {project_root}/ops/hardware-bringup-prep.md (board state)\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. SD card device check:\n        ls /dev/sdb /dev/sda /dev/mmcblk* 2>/dev/null | head -5\n        Set kv260_sd_devices_present=(list of detected devices).\n\n  1. Check PYNQ image URL availability (try in order, 30-second timeout each):\n     URLs to try:\n       https://www.pynq.io/board.html — operator browser download page\n       wget -q --timeout=30 --spider https://github.com/Xilinx/PYNQ/releases/download/v3.0.2/kv260-starter-kit-3.0.2.img.zip && echo 'v3.0.2_reachable' || echo 'v3.0.2_unreachable'\n       wget -q --timeout=30 --spider https://github.com/Xilinx/PYNQ/releases/download/v3.0/kv260-starter-kit-3.0.img.zip && echo 'v3.0_reachable' || echo 'v3.0_unreachable'\n     Record which URLs are reachable.\n\n  2. Identify the bitstream and .hwh files:\n     find {project_root}/output -name '*.bit' -o -name '*.hwh' 2>/dev/null | head -5\n     Set bitstream_path and hwh_path.\n\n  3. Produce operator_flash_procedure (copy-paste-ready 10-step sequence):\n     Step 1: Insert a blank ≥16GB SD card into the KV260's SD slot.\n     Step 2: Identify the SD device: lsblk | grep 'sd[b-z]' (look for your card size)\n     Step 3: Download PYNQ image from pynq.io (use confirmed-reachable URL from step 1 above).\n     Step 4: Unzip: unzip kv260-starter-kit-*.img.zip\n     Step 5: Flash: sudo dd if=kv260-starter-kit-*.img of=/dev/sdX bs=4M status=progress (replace sdX)\n     Step 6: Sync: sync && sudo eject /dev/sdX\n     Step 7: Insert SD into KV260 micro-SD slot. Power on.\n     Step 8: Connect via UART (USB-UART bridge on J14): screen /dev/ttyUSB0 115200\n     Step 9: On board login (xilinx/xilinx): run Carnot validation.\n     Step 10: SSH to board: ssh xilinx@board_ip (board_ip from DHCP or USB-UART).\n\n  4. Set kv260_operator_procedure_documented=True.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - kv260_pynq_url_reachable:\n      principle: \"Whether any PYNQ image URL was reachable from this host. Documents connectivity constraint.\"\n  - kv260_confirmed_reachable_url:\n      principle: \"The specific URL that was confirmed reachable, or null if none. Operator uses this for download.\"\n  - kv260_sd_devices_present:\n      principle: \"List of detected SD devices. Confirms /dev/sdb is still present.\"\n  - operator_flash_procedure:\n      principle: \"Copy-paste-ready 10-step procedure for operator to complete KV260 terminal state.\"\n  - kv260_operator_procedure_documented:\n      principle: \"True if a complete operator procedure was written. Hardware continuity discipline.\"\n  - preconditions_checked:\n      principle: \"Records which devices and URLs were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n\nACCEPTANCE GATES:\n  - condition: \"kv260_operator_procedure_documented == true\"\n    principle: \"Hardware continuity discipline: KV260 task must produce actionable operator procedure even if physical flash is not possible from this host.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2561-tier0t-dynamical-system
  title: 'Phase 3a: Tier 0t Dynamical System Verifier (arXiv:2605.05134 — fix PYTHONPATH issue)'
  milestone: 2026.05.246
  deliverable: results/experiment_2561_tier0t_dynamical.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  prior_failures:
  - experiment_id: exp2549-tier0v-hallufield-prototype
    verdict: 'blocked_carnot_import_failed: required precondition command failed before implementation'
    addressed_by: "exp2549 was Tier 0v (HalluField), not Tier 0t (Dynamical System) — different verifier scope. However, exp2549's root cause was the same PYTHONPATH issue that blocked all new verifier implementations in .245. This Tier 0t task uses PYTHONPATH-aware preconditions (sys.path.insert before import, or PYTHONPATH env var) to avoid the same failure. Structurally distinct: arXiv:2605.05134 trajectory divergence scorer vs exp2549's hedge-word field energy."
    retire_if_same_verdict: false
  prompt: "CONTEXT: Tier 0t implements the dynamical system hallucination detection approach from arXiv:2605.05134 — 'Low-Cost Black-Box Detection of LLM Hallucinations via Dynamical System Prediction'. The method treats LLM generation as a discrete-time trajectory in token-probability space and measures trajectory divergence from a learned stable attractor.\n\nPRACTICAL APPROXIMATION (no live inference needed):\n  For each response, compute a trajectory divergence score based on:\n  - Token-length distribution entropy: longer responses have more opportunity to diverge\n  - Logprob variance proxy: use inter-sentence variation in response perplexity (approximated from\n    sentence-level token counts and response structure)\n  - Trajectory stability score: fraction of consecutive sentence pairs that are semantically consistent\n    (approximated by checking if named entities or key numbers appear in both sentences)\n  Divergence = weighted_entropy + logprob_variance_proxy, clamped to [0.0, 1.0]\n  High divergence = likely hallucination.\n\nIMPLEMENTATION PATH:\n  Create python/carnot/verify/tier0t_dynamical_system.py\n  class Tier0tVerifier:\n    def score(self, response: str) -> float:\n        'Returns trajectory-divergence score in [0,1]; 1=high divergence=likely hallucination.'\n        sentences = [s.strip() for s in re.split(r'[.!?]+', response) if len(s.strip()) > 10]\n        n = max(len(sentences), 1)\n        # Length entropy: log(n) normalized\n        length_entropy = min(1.0, math.log(n + 1) / math.log(20))\n        # Structural variance: variance in sentence lengths normalized\n        lengths = [len(s.split()) for s in sentences]\n        if len(lengths) > 1:\n            mean_len = sum(lengths) / len(lengths)\n            variance = sum((l - mean_len)**2 for l in lengths) / len(lengths)\n            struct_variance = min(1.0, variance / 100.0)\n        else:\n            struct_variance = 0.0\n        # Number inconsistency: count distinct numbers; many distinct numbers = higher risk\n        numbers = re.findall(r'\\b\\d+(?:\\.\\d+)?\\b', response)\n        distinct_ratio = len(set(numbers)) / max(len(numbers), 1) if numbers else 0.0\n        return min(1.0, 0.4 * length_entropy + 0.3 * struct_variance + 0.3 * distinct_ratio)\n\nFIX FOR PYTHONPATH ISSUE (root cause of .245 Tier 0v block):\n  Before any 'from carnot...' import, ensure:\n  import sys, os\n  project_root = os.environ.get('PROJECT_ROOT', '{project_root}')\n  if project_root + '/python' not in sys.path:\n      sys.path.insert(0, project_root + '/python')\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/tier0r_curry_howard.py (Tier0rVerifier interface to follow)\n  {project_root}/results/experiment_2548_real_corpus_validation.json (FoVer corpus for evaluation)\n  {project_root}/scripts/experiment_template.py\n  PYTHONPATH fix: python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('PYTHONPATH ok')\"\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. PYTHONPATH-aware import test:\n        python3 -c \"import sys; sys.path.insert(0, '{project_root}/python'); from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('ok')\"\n        If fails: write honest_verdict 'blocked_carnot_import_failed_pythonpath' and exit.\n     b. FoVer corpus available:\n        python3 -c \"import json; d=json.load(open('results/experiment_2548_real_corpus_validation.json')); print('n_real:', d.get('n_real', 0))\"\n        Set n_fover_available.\n  1. Implement Tier0tVerifier in python/carnot/verify/tier0t_dynamical_system.py.\n     Use implementation from IMPLEMENTATION PATH above. Import sys and insert project_root/python first.\n  2. Write 3 unit tests: high-divergence response > low-divergence response.\n  3. Load FoVer corpus from exp2548 results (or construct n=100 balanced corpus if unavailable).\n  4. Score all examples. Compute tier0t_auroc vs ground-truth labels.\n  5. Set tier0t_viable = (tier0t_auroc > 0.60).\n  6. Write deliverable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\"\n  - tier0t_auroc:\n      principle: \"Primary viability metric. >0.60 threshold for ensemble candidacy.\"\n  - tier0t_viable:\n      principle: \"Explicit viability flag for ensemble v8 integration gate.\"\n  - corpus_type:\n      principle: \"'real_fover' or 'diverse_synthetic' — distinguishes paper-citable from non-citable.\"\n  - n_eval:\n      principle: \"Sample size for AUROC claim — must be >= 50 for meaningful measurement.\"\n  - pythonpath_fix_applied:\n      principle: \"True if sys.path.insert was used to resolve the .245 PYTHONPATH issue. Documents fix for audit trail.\"\n  - preconditions_checked:\n      principle: \"Records which resources were verified.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle: \"Set to 42.\"\n\nACCEPTANCE GATES:\n  - condition: \"tier0t_viable == true OR tier0t_auroc IS NOT NULL\"\n    principle: \"Either a viable verifier (AUROC > 0.60) OR an honest measurement was completed. Either advances the ensemble expansion track.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2562-tier0v-tier0w-hallufield-diffutruth
  title: 'Phase 3b: Tier 0v HalluField Retry + Tier 0w DiffuTruth Prototype (PYTHONPATH fix)'
  milestone: 2026.05.246
  deliverable: results/experiment_2562_tier0v_tier0w.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  prior_failures:
