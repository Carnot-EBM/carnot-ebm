milestone_title: 'CROSS THE OFFLINE->LIVE BRIDGE -- the representation is solved (0.725 LOO-AUROC) and the dense-gradient positive (SpatialValueNet Q-head, 7.6x offline) is proven, but both REGRESS the live depth-first explorer; .426 DISAMBIGUATES why (A1: compute-cost vs distribution-shift vs calibration) and GRADUATES the position-preserving value head from prototype to the LIVE path (A2: replace the linear verifier that "actively misled", apply the A1 fix, measure first-win-rate/efficiency on the SCORED E3AgentPolicy vs linear+bare controls); bank +1 level via self-play (A3, 55->56+); keep the package operator-resubmit-ready (A4, beat 33)'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  THE 55 LEVELS ARE A LEADERBOARD MIRAGE UNTIL THE SCORED AGENT USES CARNOT'S VERIFIER -- and .425 proved a
  verifier wired naively (tie-break + router) earns no place (A2 null), while the outer-loop re-diagnosis proved the
  representation is NOT the bottleneck (0.725, not chance). The single binding constraint is the OFFLINE->LIVE BRIDGE:
  a 0.725 offline discriminator + a 7.6x-offline SpatialValueNet Q-head both make the LIVE search WORSE. .426 HEADLINE
  (A1): a controlled three-arm experiment isolating the binding cause -- COMPUTE-COST (value-per-node slows bounded-time
  search), DISTRIBUTION-SHIFT (trained on winning-path, applied to off-path frontier), or CALIBRATION (a ranking is not
  an A* cost). HIGHEST MANDATORY (A2; GAP-OFFLINE-LIVE-BRIDGE + GAP-LIVE-INTEGRATION): GRADUATE the position-preserving
  SpatialValueNet (4x4 pool) from scripts/experiments into a LIVE-PATH-REACHABLE python/carnot/agentic module
  (arc_loop_solve warm-start + fed to E3AgentPolicy -- NOT an orphaned solver), replace the LINEAR LearnedVerifier that
  "actively misled", apply the A1-diagnosed fix, and measure LIVE first-win-rate/actions on the SCORED agent vs the
  linear baseline AND bare BFS (matched controls). CAPABILITY (A3): self-play banks +1 NEW reproducible level
  (55->56+) + trains the learned verifier. SCORE (A4): keep the refreshed package operator-resubmit-ready (beat 33).
  Plus self-learning persist+transfer (A5), integration (A6), 2 infra (B1 offline_to_live_transfer_ratio co-headline
  metric / B2 adversarial_verify hardening = offline-vs-live overclaim guard + cheap-value substrate floor), 1 hardware
  (C), 1 SOTA-ingestion (D), capstone (E). verifier_is_oracle: false on every value claim. Submission stays operator-only.
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC; >=1 level-up
  attempt that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A3); 2 reserved infra (B1/B2); 1
  per-board hardware (C); 1 SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus.
  7 days to deadline. The frozen live generator is Qwen3.5-9B-MTP on the iGPU (NEVER the 3090s)."

