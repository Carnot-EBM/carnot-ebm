    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_fit_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and run an independent active-YAML versus Markdown contract check.
    Check count, order, full IDs, titles, deliverables, structured gates,
    producer fields, prior failures, model declarations, prompt tails, and the
    ungated capstone. Do not activate or rewrite either roadmap.

