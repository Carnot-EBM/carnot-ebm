  - id: exp6413-authenticated-sota-gguf-execution-receipts
    milestone: "2026.08.552"
    deliverable: results/experiment_6413_authenticated_sota_gguf_execution_receipts.json
    title: "Authenticated three-family SOTA GGUF execution receipt layer"
    priority: critical
    track: infrastructure
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 240
    agent_type: claude
    model: opus
    prior_failures:
      - experiment_id: exp5284-sota-runtime-offload-receipt-repair-v483
        verdict: "blocked_preconditions: sota_offload_ready=false flagship_moe:blocked_no_gpu_offload_evidence:offload=False"
        addressed_by: "This attempt uses the changed current llama.cpp CUDA substrate and requires PID-bound GPU telemetry plus raw generation evidence before readiness; it cannot pass on model resolution or CPU output alone."
        retire_if_same_verdict: true
      - experiment_id: exp6408-powered-write-time-factor-admission-ab
        verdict: "complete: powered write-time admission ran in four Exp6395 licensed cells and beat write-everything with lower contamination"
        addressed_by: "The new reusable layer measures subprocess and model activity directly instead of deriving duration and memory constants inside the scientific experiment."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V552 needs one reusable definition of authentic local-model execution. A model name, cached path, tokenizer call, or derived GPU-looking value is insufficient. The receipt must bind an actual process to immutable model bytes, raw generated output, monotonic clocks, GPU samples, and exit status. The host has two RTX 3090 GPUs and cached mandated GGUF families, subject to fresh preconditions. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/python/carnot/inference/gguf_loader.py, {project_root}/python/carnot/verify/gguf_inference.py, and current llama.cpp-backed loaders
      - {project_root}/results/experiment_5284_sota_runtime_offload_receipt_repair_v483.json
      - {project_root}/results/experiment_6412_v551_powered_claim_integrity_audit.json
      - {project_root}/python/carnot/experiment_6408_powered_write_time_factor_admission_ab.py
      - {project_root}/scripts/adversarial_verify.py and {project_root}/openspec/capabilities/research-harnesses/spec.md

      TASK
      Implement and mutation-test an authenticated GGUF execution receipt layer. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF resolved through cached_sota_pair(). Use embedded GGUF tokenizers only. Never call AutoTokenizer. Run one bounded real generation canary per family. Legacy small models are CPU smoke tests only and cannot satisfy readiness.

      CONCRETE STEPS
      0. Preflight both GPUs, free VRAM, CUDA support, llama.cpp offload capability, cached model shards, embedded tokenizer metadata, storage, exact commands, and protected training processes. Emit a terminal blocked artifact before loading if any required condition fails.
      1. Define a receipt schema containing process PID, parent PID, executable and command/config hash, model hub ID/revision/quantization/file hash, tokenizer source/hash, device UUID, start/load/first-token/completion/end monotonic clocks, sampled PID-bound GPU memory/utilization, prompt hash, raw output byte hash and length, token counts, exit status, stderr hash, and cleanup result.
      2. Execute one bounded non-headline canary per mandated family through the actual generation call. Store raw bytes before parsing. Use sequential scheduling and declared GPU assignment to avoid oversubscription.
      3. Cross-check process lifetime against clocks, model file access, output mutation, token counts, GPU samples, and exit status. Reject constant, inherited, zero-length, model-name-only, or CPU-only receipts.
      4. Attack forged PID, reused raw hash, substituted model file, missing first-token clock, constant memory, telemetry from another process, tokenizer substitution, early process exit, and inherited upstream receipt.
      5. Add or update REQ-* and SCENARIO-* entries before implementation. Write focused tests with injectable process and telemetry probes. Run focused coverage, inference E2E, spec coverage, adversarial verification, determination preservation, and root-clutter checks.
      6. Set authenticated_receipt_contract_ready_score=1.0 only when all three families produce distinct, internally consistent real-generation receipts with CUDA offload and every mutation attack fails closed.

      Required deliverable: {project_root}/results/experiment_6413_authenticated_sota_gguf_execution_receipts.json.
