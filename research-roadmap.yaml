    1. Add REQ-ARC-7026 and REQ-CSL-7026 plus RED tests first. Cover roster
       freeze, arm isolation, equal budgets, model identity, resume, no-
       headroom rows, ties, solves, registry checks, provenance, receipts,
       row recomputation, and positive/null/disqualified verdicts.
    2. Define MODEL_SPECS through `cached_sota_pair()` with exact IDs
       `unsloth/Qwen3.6-35B-A3B-GGUF` and
       `unsloth/gemma-4-26B-A4B-it-GGUF`. The primary gate uses Qwen. Gemma is
       a family canary and cannot replace a missing primary run.
    3. Freeze held mechanic groups, games, seeds, budgets, model settings,
       arm definitions, metrics, and gates before running cells. Registry-
       precheck every game/level. Do not select a roster from treatment gains.
    4. Run four isolated arms: base; simulation-only; belief-only; combined.
       Each cell starts with fresh policy, environment, proposer, server-side
       request state, and ledger. It may learn only from its own earlier
       observations in that cell.
    5. Match action budgets and maximum model calls. Record actual calls and
       wall time. Use one process per GPU. Use the dual-GPU runner only when
       the two model processes are concurrent and record that choice.
    6. Prohibit game source, offline ground-truth BFS, hand-built game models,
       public-game adapters, and future outcomes. The belief query may rank or
       abstain. It may not use the scored action's outcome before selection.
    7. Checkpoint after each model/game/seed/arm cell. Emit per-action and
       per-game rows with progress, level before/after, actions, invalid or
       contradicted proposals, queries, abstentions, model calls, latency,
       GPU samples, wins, losses, ties, and no-headroom labels.
    8. Set held_mechanic_ab_complete_score=1 when all planned or explicitly
       blocked cells have rows. Set belief_live_value_positive_score=1 only if
       belief-only or combined beats both base and simulation-only on progress
       per 100 actions, the paired interval lower bound is at least zero, at
       least two held mechanic groups are non-negative, and invalid proposals,
       completed levels, and protected behavior do not regress materially.
    9. Credit a game-level solve only when the row records
       solve_provenance=live_agent_self_discovery, the solve registry did not
       already contain it, and the agent reached it from its own live attempts.
       Development proxies and outer-loop RE never enter the headline.
    10. Run focused tests, artifact validation, adversarial verification,
        row-consistency lint, ARC floor lint, spec coverage, and applicable
        live E2E checks. Tear down only owned processes and leases.
    11. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
        principle for every field below; preconditions_checked;
        inference_substrate (live_llm_arc_belief_simulation_ab);
        duration_s; MODEL_SPECS; models_used; model_file_hashes;
        cited_upstream_artifacts with experiment_id, fields_imported, and
        sha256; source_artifact_hashes; frozen_roster; frozen_arm_definitions;
        budget_rows; rows; per_action_results; per_game_results;
        per_model_results; per_mechanic_results; no_headroom_rows; tie_rows;
        progress_rows; action_efficiency_rows; invalid_proposal_rows;
        contradiction_avoidance_rows; belief_query_rows; simulation_rows;
        model_call_rows; latency_rows; phase_receipt_rows; gpu_sample_rows;
        runner_decision_rows; server_rows; lease_rows; checkpoint_rows;
        teardown_rows; paired_delta_rows; confidence_intervals;
        aggregate_row_recomputation; solve_registry_precheck_rows;
        solve_provenance (live_agent_self_discovery | development_proxy |
