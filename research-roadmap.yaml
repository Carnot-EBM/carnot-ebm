- id: exp772-semantic-energy-probe
  milestone: 2026.04.59
  deliverable: results/experiment_772_semantic_energy_probe.json
  title: 'Exp 772: Semantic Energy Probe — Tier 0g Candidate (arXiv 2508.14496)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2508.14496 "Semantic Energy: Detecting LLM Hallucination Beyond Entropy"
    (August 2025) shows logit-space energy E = -log p(x) evaluated over semantic equivalence
    classes outperforms standard semantic entropy for hallucination detection. The key insight:
    logits retain intensity information lost during softmax normalization — a response can have
    high probability but low energy (confident and correct) or high probability but high energy
    (confident but hallucinating). Semantic energy groups responses by meaning and sums energy
    across each semantic cluster.

    Carnot's Tier 0 stack currently uses logit-based probes (SpilledEnergyDetector Tier 0b,
    NUP Probe v4 Tier 0c). Semantic energy is the theoretically grounded formulation of what
    these probes approximate. Implementing it as SemanticEnergyProbe (Tier 0g) provides:
    1. Better AUC on FoVer v2 (hypothesis).
    2. Theoretical grounding for Carnot publications (energy = -log p(x)).
    3. Independence from existing probes (orthogonal signal from different semantic grouping).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/nup_probe_v4.py — NUP Probe v4 (Tier 0c, AUC=1.0 on synthetic).
    - python/carnot/pipeline/spilled_energy_detector.py — SpilledEnergyDetector (Tier 0b).
    - python/carnot/pipeline/three_tier_pipeline.py — pipeline Tier 0 slot structure.
    - results/fover_labeled_steps_live.json — 57 real labeled CoT steps for evaluation.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement SemanticEnergyProbe using logit-space energy. Evaluate on FoVer v2.
    Compare AUC to NUP Probe v4 (Tier 0c baseline). Wire as Tier 0g if AUC competitive.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-PROBE-020 (SemanticEnergyProbe MUST compute energy as E = -sum_i log p(t_i)
       where p(t_i) is token probability from logits; MUST group responses by semantic cluster
       via TF-IDF cosine similarity with threshold=0.9), REQ-PROBE-021 (Tier 0g MUST report
       semantic_energy_score and is_high_energy=True when score exceeds threshold),
       SCENARIO-PROBE-030/031 to openspec/capabilities/verification/spec.md.
    3. Implement python/carnot/pipeline/semantic_energy_probe.py:
       a. SemanticCluster:
          compute_cluster_energy(responses: list[str]) -> float:
            - For each response: compute per-token log-prob (use TF-IDF scores as proxy
              for log-prob when actual logits unavailable; note this limitation).
            - Sum negative log-probs: energy = -sum(log(tfidf_score(token) + eps)).
            - Average across responses in cluster: cluster_energy = mean(energies).
          group_by_semantics(responses: list[str], threshold=0.9) -> list[list[str]]:
            - Compute TF-IDF matrix. Cosine similarity between all pairs.
            - Cluster responses with similarity >= threshold into same group.
       b. SemanticEnergyProbe(energy_threshold=5.0):
          score(response_text: str) -> float:
            - Compute single-response energy: -sum(log(tfidf_score(token) + eps)).
            - Normalize by response length.
            - Return energy_score.
          is_high_energy(response_text: str) -> bool:
            - Return score(response) > self.energy_threshold.
    4. Load FoVer labeled steps from results/fover_labeled_steps_live.json.
       For each step: compute SemanticEnergyProbe.score(step_text). Record (score, label).
    5. Compute AUROC from (score, label) pairs.
    6. Compare to NUP Probe v4 baseline:
       - Load NUP Probe v4 AUC from results (or run NUPProbeV4 on same FoVer v2 steps).
       - auc_delta = semantic_energy_auc - nup_probe_v4_auc.
    7. Wire SemanticEnergyProbe into ThreeTierPipeline as Tier 0g (advisory, after HalluField):
       a. Add Tier0gResult(energy_score, is_high_energy, passed_tier0g) to pipeline.
       b. If is_high_energy: set advisory flag in VerificationResult (does not short-circuit).
    8. Create scripts/experiment_772_semantic_energy_probe.py:
       a. ExperimentTemplate(772) + ExperimentTimeoutWatchdog(772, timeout_minutes=30).
       b. Implement steps 3-7.
       c. honest_verdict:
          - "semantic_energy_tier0g_viable" if auc >= NUP v4 baseline AUC
          - "semantic_energy_competitive" if auc >= NUP v4 - 0.05 (within 5pp)
          - "semantic_energy_below_baseline" if auc < NUP v4 - 0.05
          - "insufficient_data" if test_set_size < 10
       d. artifact: semantic_energy_auc, nup_probe_v4_auc (baseline), auc_delta,
          tier0g_deployed (bool), energy_threshold, honest_verdict.
    9. Write tests/python/test_experiment_772_semantic_energy_probe.py with 100% coverage:
        - test SemanticCluster.compute_cluster_energy returns sum of negative log scores.
        - test is_high_energy returns True when score > threshold, False below.
        - test AUROC computation from probe scores and binary labels.
        Each test traces to REQ-PROBE-020/021.
    10. Reconcile:
        - ops/status.md: "Semantic Energy Probe (Tier 0g, arXiv 2508.14496): AUC=X vs NUP v4=Y.
          tier0g_deployed=True/False. honest_verdict=X."
        - ops/changelog.md: one-line with honest_verdict.
    11. tmpl.assert_deliverable_written() as final line.

