    title: "PRECISION RESCUE (THE de-risk; OFFLINE, fabrication-immune; THE GATE for Phase B). Extend python/carnot/agentic/gap5_cross_example_selector.py into a certification-filter SWEEP over the cached GAP-4 ARC-1+ARC-2 program pools (results/arc3_gap4_induced_programs.json + arc3_gap4_arc2_induced_programs.json). Measure P(test-gold | certified) under a STACK of cheap model-free filters: (i) demo-perfect alone (the 0.68 baseline), (ii) + augmentation-invariance (color-permutation + D4 symmetry of the demos -- a correct rule is invariant, an overfit one is not), (iii) + k-of-n independent-induction agreement (multiple programs agree on the held-out prediction), (iv) + graded min-Hamming energy threshold. Sweep the precision-recall frontier; emit the bare bool precision_rescue_succeeded = (any stack reaches precision >=0.85 at recall >=0.20). ZERO GPU, ZERO codex -- pure offline replay; cannot fabricate a duration. Honest 'no stack reaches 0.85' is a COMPLETE verdict that bounds verifier-as-reward on ARC."
    priority: critical
    track: verifier-precision
    max_turns: 80
    agent_type: codex
    model: gpt-5.5
    inference_substrate: offline_saved_gap4_program_replay_precision_rescue
    deliverable: results/experiment_4087_certification_precision_rescue.json
    prompt: |
      CONTEXT: The .377 verifier-as-reward pivot blocked because demo-perfect ARC programs only predict
      test-gold at P=0.6818 (< the 0.85 corpus-trust gate). This task asks the load-bearing follow-up:
      can stacked cheap model-free filters RAISE that precision to >=0.85 at usable recall? This is the
      gate that decides whether the clean RFT (Phase B) runs. It is OFFLINE on cached pools -- no GPU,
      no codex generation -> fabrication-immune (a real run is seconds-to-minutes of grid replay).

      EXISTING CODE TO READ FIRST:
        - python/carnot/agentic/gap5_cross_example_selector.py (computes cross_example_precision =
          P(gold | consistency-selected) by replaying saved GAP-4 programs -- EXTEND this)
        - python/carnot/agentic/arc_gap4_execution_verifier.py + scripts/experiments/
          arc3_gap4_rule_exec_verifier.py (safe_transform_from_code, demo-perfect certification)
        - results/arc3_gap4_induced_programs.json (ARC-1 pool) + results/arc3_gap4_arc2_induced_programs.json
          (ARC-2 pool) + results/arc3_gap4_arc2_consistency_ensemble.json
        - ops/verifier_gaps.md (the open GAP-5 demo-underdetermination detector -- this IS that gap)

      TASK: Build a certification-filter sweep and find the operating point (if any) reaching precision
      >=0.85 at recall >=0.20.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any work; miss -> honest_verdict blocked_<resource>, no fabrication):
           (a) the cached pools load: ls results/arc3_gap4_induced_programs.json
               results/arc3_gap4_arc2_induced_programs.json -> both non-empty;
           (b) gap5_cross_example_selector + safe_transform_from_code import.
        1. For each task in the pools, recover the candidate `def transform(grid)` programs + their
           demo pairs + the held-out test pair (the gold). A program is demo-perfect if it reproduces
           ALL demo outputs exactly.
        2. Define the cheap filters (all model-free, deterministic, GPU-free):
           (ii) AUGMENTATION-INVARIANCE: apply each color-permutation + D4 symmetry to the demos; a
                program is invariance-certified iff it remains demo-perfect under the augmented demos
                (BARC/ARChitects: a correct rule is augmentation-invariant; an overfit one breaks).
           (iii) k-OF-n AGREEMENT: among the demo-perfect programs for a task, certify the held-out
                prediction iff >=k of n distinct programs agree on it.
           (iv) GRADED MIN-HAMMING: certify iff the min consistency-energy (cell-disagreement) over the
                demo set is <= tau; sweep tau.
        3. SWEEP the precision-recall frontier for each filter and each stack (demo-perfect;
           +invariance; +invariance+agreement; +all). Precision = P(test-gold | certified); recall =
           fraction of test-gold tasks certified. Report the frontier (list of {filter_stack, threshold,
           precision, recall, n_certified}).
        4. Emit precision_rescue_succeeded = True iff some stack achieves precision >=0.85 AND recall
           >=0.20 simultaneously; record the best operating point.
        5. Append a GAP-5 entry to ops/verifier_gaps.md (the precision-rescue outcome).

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict (str; terminal prefix; e.g. complete: precision_rescue_succeeded_best_0.XX_at_recall_0.YY
          or complete: precision_rescue_FAILED_max_0.XX_verifier_as_reward_arc_precision_bounded)
        - precision_rescue_succeeded (bare bool; principle: THE gate -- gates the entire Phase B RFT
          chain; emit it BARE, not as a {{value,principle}} dict, or the conductor gate breaks)
        - best_certified_precision (bare float; principle: the headline number -- did 0.68 move toward 0.85?)
        - best_op_point_recall (bare float; principle: precision is only usable with enough recall to
          build a corpus)
        - frontier (list of {{filter_stack, threshold, precision, recall, n_certified}}; principle: the
          full precision-recall curve so a third party can pick a different operating point)
        - n_tasks_scored (int), n_codex_calls (int; principle: must be 0 -- this is offline replay)
        - random_seed (int) + reproducibility_checksum (str; principle: determinism = reproducible by
          a third party offline)
        - inference_substrate: offline_saved_gap4_program_replay_precision_rescue (principle: declares
          offline replay so the adversarial-verify duration floor is 1s, not 60s)

