    \ - simulate_regime(regime: str, n_epochs=100) -> float: regime in\n       ['all_pairs',\
    \ 'quality_gated', 'curriculum_high_to_low', 'random_50pct']\n       returns AUC\
    \ on held-out 20%\n   - Test: CorpusAnalysis.is_imbalanced=True when n_correct=80,\
