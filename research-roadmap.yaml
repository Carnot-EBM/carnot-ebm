    CONTEXT: Exp 758 (.58) confirmed Yosys synthesizes ising_sampler_v2.v to 2821 LUTs
    and 2237 DFFs with 0 errors (honest_verdict="synthesis_successful"). The next step in
    the open-source FPGA flow is nextpnr — place-and-route to produce a bitstream.

    nextpnr-xilinx is an experimental open-source place-and-route tool for Xilinx FPGAs,
    part of the prjxray effort (part of F4PGA / OpenXC7 ecosystem). It targets Xilinx
    Series 7 devices. The KV260 uses an XCZU5EV (Zynq UltraScale+) which has Kintex-7
    architecture-compatible programmable logic. While nextpnr-xilinx primarily targets
    Series 7, the OpenXC7 project (openxc7.readthedocs.io) provides open-source toolchain
    targeting Kintex-7-class devices.

    Alternative: nextpnr also supports ice40 (iCE40 FPGAs). Exp 758 showed 2821 LUTs.
    The iCE40 HX8K has 7680 LUTs — the Ising sampler fits! Synthesizing for iCE40 HX8K
    gives a real bitstream and validates the RTL is complete, even if the board is KV260.

    EXISTING CODE TO READ FIRST:
    - results/experiment_758_yosys_synthesis.json — Exp 758 result: synthesis_successful,
      2821 LUTs, 2237 DFFs. Read yosys JSON netlist path if recorded.
