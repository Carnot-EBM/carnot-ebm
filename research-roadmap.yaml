- id: exp1286-grad-beaver-nsvif-semantic-routing
  milestone: 2026.04.100
  deliverable: results/experiment_1286_grad_beaver_nsvif_semantic_routing.json
  title: "GRAD + BEAVER + NSVIF Semantic Routing - Gated on Certificate Parse Rate"
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  estimated_wall_time_min: 45
  priority: high
  requires_gpu: false
  skip_pre_test: true
  gated_on:
    - upstream: exp1285-triggered-certificate-extraction-v2
      artifact_field: certificate_parse_rate
      op: ">="
      value: 0.8
  prompt: |
    CONTEXT:
    Successful certificates are only useful if claims route to deterministic verifiers.
    Recent work suggests adding GRAD-style evidence graphs, BEAVER-lite semantic bounds,
    NSVIF-style CSP checks, proof-carrying numbers, LaSy-style typed warrants, temporal
    claim metadata, and MCS/MUS repair diagnostics.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1285_triggered_certificate_extraction_v2.json
    - python/carnot/pipeline/formal_claim_verifier.py
    - python/carnot/pipeline/process_verifier.py
    - python/carnot/pipeline/verify_repair.py
    - python/carnot/pipeline/extract.py
    - results/fover_corpus_v5.json

    TASK:
    Convert parsed certificates into routed verifier claims and measure coverage.

    CONCRETE STEPS:
    1. Create the deliverable artifact immediately with status="in_progress".
    2. Load exp1285 certificate outputs and extract typed claims, equations, proof_numbers, verifier_routes, and final_answer.
    3. Build a lightweight evidence graph over claim -> evidence -> verifier route.
    4. Route claims through available deterministic verifiers: arithmetic, comparison, set/cardinality, boolean entailment, SymCode/Z3 where present.
    5. Add BEAVER-lite prefix/risk bound proxies, NSVIF CSP pass/fail, proof_carrying_number_coverage, typed_warrant_coverage, temporal_claim_count, stateful_constraint_ready, ConstraintBench-style micro-eval results, MCS/MUS diagnostics, and residual_drift_cases.
    6. Write semantic_routing_coverage, routed_claim_count, abstention_rate, false_positive_rate, status, and honest_verdict.

    Run: python3 -c "import json; d=json.load(open('results/experiment_1286_grad_beaver_nsvif_semantic_routing.json')); print(d.get('honest_verdict'), d.get('semantic_routing_coverage'), d.get('routed_claim_count'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

