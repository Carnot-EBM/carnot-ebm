    - scripts/experiment_502_live_100q_precision_v6.py — prior attempt (read for pattern)\n\
    - results/experiment_502_live_100q_precision_v6.json — prior result (deferred)\n\
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu()\n\
    - ops/known-issues.md — RETRO-033, RETRO-051\n\nTASK: Run the live 100q precision\
    \ benchmark with JIT VRAM gating.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Call apply_env_autofix() FIRST.\n\
    3. Add REQ-BENCH-014 (Live 100q benchmark with JIT VRAM gating), REQ-BENCH-015\
    \ (CoT pairs written to exp514_cot_pairs.json), SCENARIO-BENCH-033/034 to\
    \ openspec/capabilities/verifiable-reasoning/spec.md.\n\
    4. Write tests FIRST (100% coverage) for new helpers:\n\
    \   - load_jit_gated_model(loader_class, model_id, required_gb, device) -> Optional[model]:\n\
    \     JITVRAMCheck.gate_model_load(); if not cleared, return None\n\
    \   - run_100q_benchmark(gemma4_model, qwen_model, questions) -> PrecisionBenchmarkResult\n\
    \   - write_cot_pairs(responses, labels, path) -> int: writes FOVER-format pairs\n\
    5. Write scripts/experiment_514_live_100q_precision_v7.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(514, timeout_minutes=120)\n\
    \   c. ExperimentTemplate(514, 'Live 100q Precision v7',\n\
    \      'results/experiment_514_live_100q_precision_v7.json', requires_gpu=True)\n\
    \   d. DeliverableGuard('results/experiment_514_live_100q_precision_v7.json')\n\
    \   e. GPUVRAMGateV2(min_free_gb=5.0, kill_first=True).__enter__()\n\
    \   f. JIT gate Gemma4-INT4 load on cuda:0: JITVRAMCheck(0).gate_model_load(\
    \ 'gemma4-int4', required_gb=10.0); if not cleared emit deferred artifact\n\
    \   g. JIT gate Qwen3.5-0.8B load on cuda:1: JITVRAMCheck(1).gate_model_load(\
    \ 'qwen3.5-0.8b', required_gb=1.5); if not cleared emit deferred artifact\n\
    \   h. Load 100 GSM8K questions\n\
    \   i. LongRunBenchmarkExecutor batch_size=25, checkpoint after each batch\n\
    \   j. For each question: baseline inference → VeriCoT+VPRM+CRANE extraction\
    \ → repair if violations found → record baseline_correct, pipeline_correct\n\
    \   k. Compute Wilson 95% CI for baseline and pipeline accuracy\n\
    \   l. Write CoT pairs to results/exp514_cot_pairs.json (FOVER format)\n\
    \   m. Build artifact: schema='carnot.live_precision.v7'\n\
    \      inference_mode='live_gpu' (if ran) or 'gpu_required'\n\
    \      n_questions=100, baseline_accuracy, pipeline_accuracy\n\
    \      signed_improvement, wilson_95ci_lower, wilson_95ci_upper\n\
    \      is_positive=(pipeline_accuracy > baseline_accuracy)\n\
    \      retro_033_closed=(is_positive and inference_mode=='live_gpu')\n\
    \      cot_pairs_written=(path to exp514_cot_pairs.json if written)\n\
    \      honest_verdict='retro_033_closed' if retro_033_closed\n\
    \        else 'live_no_improvement' if inference_mode=='live_gpu'\n\
    \        else 'gpu_required'\n\
    \      jit_vram_check_applied=True\n\
    \   n. Call tmpl.assert_deliverable_written() as FINAL LINE\n\
    6. Write tests/python/test_experiment_514_live_100q_v7.py (100% coverage on\
    \ new helpers).\n\
    7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    8. If CARNOT_FORCE_LIVE=1 and GPU available, execute the script.\n\
    9. Reconcile: update ops/conductor-log.md (RETRO-033 status), ops/status.md,\
    \ ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

