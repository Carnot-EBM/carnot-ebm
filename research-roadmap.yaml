  - id: exp2766
    milestone: "2026.05.262"
    deliverable: "results/experiment_2766_phase4_fep_adversarial_recheck.json"
    title: "Phase 4 FEP Adversarial Recheck: LOO Cross-Validation + Held-Out Corpus (TAUTOLOGY Resolution)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 40
    track: research

    prior_failures:
      - experiment_id: exp2753-phase4-fep-redesign-v2
        verdict: "complete: fep_viable=true best_fep_auroc=0.9947 strategy2_auroc=0.9947 — adversarial-flagged TAUTOLOGY (two metrics agree to >5 sig figs; duration_s=6.49s for logistic regression training)"
        addressed_by: "exp2753 (.261) was adversarial-flagged because best_fep_auroc and strategy2_auroc are bit-for-bit identical (the code sets best_fep_auroc=strategy2_auroc, then adversarial_verify treats them as independently computed metrics). The 6.49s duration suggests the logistic regression was evaluated IN-SAMPLE (trained and tested on the same FoVer examples). This exp2766 implements (a) leave-one-out cross-validation over the entire FoVer corpus so training and evaluation are always on different folds, (b) a HELD-OUT evaluation set (N>=200) never touched during LOO fitting, (c) reports both in-sample and out-of-fold AUROC with sample-size justification."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      exp2753 (.261) implemented Phase 4 FEP strategy2 (learned logistic regression over verifier
      ensemble alpha weights) and reported AUROC=0.9947. The artifact was adversarial-flagged because:
      (a) best_fep_auroc and strategy2_auroc are bit-for-bit identical (not independently computed),
      (b) duration_s=6.49s is too fast for any genuine cross-validated training on N>=100 examples.

      Root cause hypothesis: the logistic regression was trained and evaluated on the SAME FoVer corpus
      (in-sample evaluation). A 0.9947 in-sample AUROC on a small dataset is consistent with overfitting,
      not genuine Phase 4 empirical validation.

      This experiment resolves the TAUTOLOGY flag by running:
        (1) Leave-one-out cross-validation (LOO-CV) over the full FoVer corpus
        (2) A separate held-out evaluation set (N>=200) never seen during LOO fitting
        (3) Explicit out-of-fold AUROC reported separately from in-sample AUROC

      EXISTING CODE TO READ FIRST:
      - results/experiment_2753_phase4_fep_redesign_v2.json (strategy2 logistic implementation details)
      - results/experiment_2748_phase4_fep_factor_graph.json (original alpha values)
      - python/carnot/verify/ (list all tier0*.py files — identify which 8 verifiers are in ensemble)
      - data/fover_corpus.jsonl (corpus lines — check total N available)

      TASK: Resolve TAUTOLOGY flag by running LOO-CV + held-out evaluation of strategy2 FEP aggregator.
      Report in-sample vs out-of-fold AUROC. If held_out_auroc > 0.8: FEP empirically valid.
      If held_out_auroc <= 0.8: FEP claim invalid — produce paper-v6 removal recommendation.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sys; sys.path.insert(0,'python'); import carnot.verify; print('ok')"` succeeds
            Record: carnot_importable (bool).
            If carnot_importable=false: honest_verdict='blocked_carnot_not_importable' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null`
            Record: fover_n_total (int).
            If fover_n_total < 50: honest_verdict='blocked_fover_corpus_too_small' and exit.
         c. `ls python/carnot/verify/tier0*.py 2>/dev/null | wc -l`
            Record: n_verifier_modules (int). Identify which verifiers are in the ensemble.
         Record: preconditions_checked.

      1. Load FoVer corpus (all N examples). Split into:
         - LOO pool: all N examples (used for LOO-CV)
         - Held-out set: randomly sample min(200, N//3) examples from pool using random_seed=99
           AFTER removing held-out examples from the LOO pool (no overlap guaranteed)
         Record: n_loo_pool (int), n_held_out (int).
         ASSERT n_loo_pool + n_held_out <= fover_n_total AND NO overlap.

      2. For each verifier in the 8-verifier ensemble from exp2753:
         Run verifier.score(example) for every example in the full FoVer corpus.
         Build feature matrix X (N x 8) and labels y (N).

      3. LOO-CV of strategy2 logistic regression:
         from sklearn.linear_model import LogisticRegression
         from sklearn.model_selection import LeaveOneOut, cross_val_score
         from sklearn.metrics import roc_auc_score
         loo = LeaveOneOut()
         loo_preds = cross_val_score(LogisticRegression(), X_loo, y_loo, cv=loo, scoring='roc_auc')
         loo_auroc = loo_preds.mean()
         Record: loo_auroc (float), loo_std (float).

      4. Fit logistic regression on LOO pool, evaluate on HELD-OUT set:
         clf = LogisticRegression().fit(X_loo, y_loo)
         y_proba_held_out = clf.predict_proba(X_held_out)[:, 1]
         held_out_auroc = roc_auc_score(y_held_out, y_proba_held_out)
         Record: held_out_auroc (float), n_held_out_evaluated (int = len(y_held_out)).

      5. Compare in-sample (from exp2753) vs cross-validated:
         in_sample_auroc = 0.9947  # from exp2753
         auroc_gap = in_sample_auroc - held_out_auroc
         overfitting_confirmed = auroc_gap > 0.10
         fep_viable = held_out_auroc > 0.8 and not overfitting_confirmed
         delta_vs_odar = held_out_auroc - 0.9730  # ODAR AUROC from exp2720

      6. Write results/experiment_2766_phase4_fep_adversarial_recheck.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix; blocked_* if preconditions fail."
      - fep_tautology_resolved: bool
        principle: "Primary gate: True if LOO-CV + held-out analysis is complete without TAUTOLOGY flag."
      - in_sample_auroc: float — expected 0.9947 (from exp2753)
        principle: "Baseline: exp2753 in-sample number being cross-checked."
      - loo_auroc: float
        principle: "Leave-one-out AUROC: closer to held_out_auroc means less overfitting."
      - held_out_auroc: float
        principle: "PRIMARY VALIDATION GATE: > 0.8 = FEP empirically viable; <= 0.8 = overfitting confirmed."
      - overfitting_confirmed: bool
        principle: "True if in_sample - held_out > 0.10; confirms exp2753 was in-sample evaluation."
      - fep_viable: bool
        principle: "held_out_auroc > 0.8 AND NOT overfitting_confirmed = FEP claim valid for paper-v6."
      - delta_vs_odar: float
        principle: "FEP advantage over ODAR; must be > 0.05 for a meaningful paper contribution."
      - paper_recommendation: str — 'fep_claim_valid' or 'fep_claim_blocked_overfitting'
        principle: "Operator needs a clear yes/no on whether Phase 4 Section of paper-v6 can proceed."
      - n_loo_pool: int
        principle: "Sample size for LOO-CV; must be >= 50 for meaningful AUROC estimate."
      - n_held_out: int
        principle: "Sample size for held-out evaluation; must be >= 50 (per Adversarial Verification rule: N>=30 for CLT)."
