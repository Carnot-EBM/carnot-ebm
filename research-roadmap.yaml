    \ post_acc: float, n: int,\n     extractor_name: str, inference_mode: str):\n\
    \     - signed_improvement: float\n     - ci_95_wilson: tuple[float, float]\n\
    \     - is_statistically_positive: bool (lower_ci_bound > 0.0)\n     - to_dict():\
    \ dict\n   - Test: ci_95_wilson(n=200, p=0.10) gives interval width < 0.07\n\
    \   - Test: is_statistically_positive=False when signed_improvement=0.02, n=200\n\
    5. Write scripts/experiment_503_live_200q_vericot_vprm_v4.py:\n   a. apply_env_autofix()\
    \ FIRST\n   b. ExperimentTimeoutWatchdog(503, timeout_minutes=150) as context\
    \ manager\n   c. ExperimentTemplate(503, 'Live 200q VeriCoT+VPRM v4',\n      'results/experiment_503_live_200q_vericot_vprm_v4.json',\
    \ requires_gpu=True)\n   d. DeliverableGuard('results/experiment_503_live_200q_vericot_vprm_v4.json')\n\
    \   e. VRAMBudgetLedger: check exp503 feasibility\n   f. GPUVRAMGateV2(min_free_gb=6.0,\
