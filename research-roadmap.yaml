      CONCRETE STEPS:
      1. Build a checked-in corpus of outcome-vs-process labels from existing semantic and code traces instead of inventing a new benchmark.
      2. Include at least these process labels: right_answer_wrong_process, wrong_answer_partially_sound_process, unsupported_step, repair_fixed_outcome_only, and repair_fixed_process_and_outcome.
      3. Preserve step structure or code-trace structure, gold process label, outcome label, and provenance to the source artifact.
