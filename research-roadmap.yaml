# Pre-staged roadmap — milestone 2026.05.265
#
# Author: outer-loop (Claude) per operator directive 2026-05-21:
#   "Authorized. MBPP + TruthfulQA + HumanEval first. We can re-visit
#   the rest after we see those results."
#
# Context: the deep audit on 2026-05-21 confirmed that the production
# headline AUROC=0.9857 (Ensemble v7b on FoVer, exp2546) is measured
# on a single corpus shape (math-step-error pairs). The Tier 0s
# verifier was confirmed to be a regex+arithmetic heuristic that
# returns 0.0 on non-arithmetic inputs (now honestly documented per
# CLAUDE.md "Verifier Authenticity Discipline"). Generalization
# beyond FoVer is unmeasured.
#
# This milestone expands the corpus surface to three independent
# benchmarks (MBPP code, TruthfulQA factuality, HumanEval full code
# generation) under the same 5-seed adversarial-replication
# protocol that produced the FoVer headline. After these land,
# operator will decide on HaluEval + FEVER (the deferred corpora).
#
# Per CLAUDE.md "Pre-Staged Roadmap Convention" — this file is
# preserved by the conductor's _plan_next_milestone() check at
# activation time. Per CLAUDE.md "Gemini-Default for Experiments"
# all experiment tasks default to agent_type: gemini.

milestone: "2026.05.265"

tasks:

  - id: exp2801
    milestone: "2026.05.265"
    deliverable: "results/experiment_2801_archive_v264.json"
    title: "Archive .264 + Activate .265"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 20
    track: admin
    prompt: |
      Read CLAUDE.md for project context.

      TASK: Standard milestone activation. Archive milestone 2026.05.264
      to research-complete.yaml; activate this milestone 2026.05.265
      from research-roadmap.yaml.

      CONCRETE STEPS:
        1. Read research-roadmap.yaml current milestone field.
        2. Read research-complete.yaml to confirm .264 isn't already archived.
        3. Append .264 milestone block from research-roadmap.yaml to research-complete.yaml.
        4. Confirm .265 is the active milestone field in research-roadmap.yaml.
        5. Write deliverable artifact.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' or 'complete_'
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - archived_milestone: str
          principle: "Records which milestone was archived."
        - activated_milestone: str
          principle: "Records which milestone is now active."
        - duration_s: float
          principle: "Wall-time measurement; expected 5-30s for admin."

  - id: exp2802
    milestone: "2026.05.265"
    deliverable: "results/experiment_2802_mbpp_ensemble_eval.json"
    title: "MBPP Corpus — Both Memory Conditions (Architecture-Only + Production, 5 seeds each)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 60
    track: corpus
    prompt: |
      Read CLAUDE.md for project context, especially "Verifier Authenticity
      Discipline" (no sleep-padding, no score-capping, no random-data
      evaluation) and "Adversarial Artifact Verification + Sample-Size
      Rigor" (random_seed + reproducibility_checksum mandatory).

      CONTEXT: per operator directive 2026-05-21, expand evaluation
      surface beyond FoVer (the single corpus driving the 0.9857
      headline). MBPP is industry-standard for Python code generation;
      execution-based ground-truth makes hallucination detection
      well-defined (correct code passes tests; incorrect code fails).

      TASK: Run the production verifier ensemble v7b against MBPP test
      split (500 problems) and compute AUROC under 5-seed adversarial
      replication.

      OPERATOR DIRECTIVE 2026-05-21: "we want to report both with and
      without learning so we know both how effective our naive answers
      are as well as what benefit the learning is affording our
      solution." Therefore this task runs the ensemble TWICE — once
      with FR-11 self-learning state RESET (architecture-only) and
      once with full FR-11 state loaded (production config). The
      reported headline is BOTH numbers, not just one.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. `python3 -c "import torch; assert torch.cuda.is_available()"`
              — if false, blocked_cuda_not_available
           b. `python3 -c "from datasets import load_dataset; load_dataset('mbpp', 'sanitized', split='test')"`
              — if HF unreachable, blocked_huggingface_mbpp_unreachable
           c. `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/`
              — if empty, blocked_model_not_cached_qwen36
           d. FR-11 state files present (nexus_constraint_memory_v2.json
              etc. — see exp2807a for the full list)
           Record preconditions_checked.

        1. Load MBPP test split via `datasets.load_dataset("mbpp",
           "sanitized", split="test")` (500 problems).

        2. For each problem, run live-GPU inference (Qwen3.6-35B-A3B-GGUF
           via llama.cpp) to generate a candidate solution.

        3. Execute the candidate against the test cases — this gives
           ground-truth (pass/fail). Real execution; no static-analysis
           proxy.

        4. CONDITION A — production config (full FR-11 self-learning
           state loaded): score each (problem, candidate) with the
           verifier ensemble v7b. Record per-verifier scores and
           ensemble AUROC for this condition.

        5. CONDITION B — architecture-only (FR-11 state RESET): move
           all FR-11 state files to /tmp/fr11_state_backup_<seed>/
           NON-destructively, restart Python interpreter to clear
           in-memory state, reload ensemble (confirm via logs that
           no NEXUS/constraint-template/session-memory loaded), score
           the same (problem, candidate) pairs. Record per-verifier
           scores and ensemble AUROC for this condition.

        6. Restore FR-11 state files to original location; verify
           SHA256 match.

        7. Repeat steps 2-6 with 5 random seeds (42, 137, 271, 314,
           1729). For each seed: compute and record BOTH condition-A
           and condition-B AUROC.

        8. Compute headline for both conditions: mean ± std across 5
           seeds. Compute learning_contribution = mean_A - mean_B.

        9. Compare to MBPP peer baselines: vanilla Qwen3.6 pass@1 +
           any published verifier baselines on MBPP.

        10. Write artifact with BOTH conditions reported as primary
            headline (NOT just the production config).

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:' /
          'passed:' / 'shipped:' (or 'blocked_<resource>' on precondition fail)
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - corpus: "MBPP-sanitized-test"
          principle: "Identifies which corpus was used."
        - n_problems: 500
          principle: "Sample size for statistical claims."
        - n_seeds: 5
          principle: "Adversarial replication seed count per .241 5-seed protocol."

        # BOTH CONDITIONS — operator directive 2026-05-21: report both
        # naive (architecture-only) and learning-augmented numbers so
        # the paper can disclose the learning's contribution honestly.

        - condition_a_production_auroc_per_seed: list[float] (length 5)
          principle: "Per-seed AUROC with full FR-11 self-learning state loaded — the production config."
        - condition_a_production_auroc_mean: float
          principle: "Production-config headline; what users get out-of-the-box with FR-11 enabled."
        - condition_a_production_auroc_std: float
          principle: "Replication noise on production config."

        - condition_b_architecture_only_auroc_per_seed: list[float] (length 5)
          principle: "Per-seed AUROC with FR-11 state RESET — the naive architecture-only baseline."
        - condition_b_architecture_only_auroc_mean: float
          principle: "Architecture-only headline; what the verifier ensemble achieves without any accumulated learning."
        - condition_b_architecture_only_auroc_std: float
          principle: "Replication noise on architecture-only."

        - learning_contribution: float
          principle: "= condition_a_mean - condition_b_mean. Direct measurement of the benefit FR-11 self-learning provides on this corpus."

        - per_verifier_condition_a_auroc: dict[str, list[float]]
          principle: "Per-verifier per-seed AUROC under production config; exposes which verifiers contribute most when memory is available."
        - per_verifier_condition_b_auroc: dict[str, list[float]]
          principle: "Per-verifier per-seed AUROC under architecture-only; exposes which verifiers are pure architecture vs which rely on accumulated memory."

        - vanilla_qwen36_pass_at_1: float
          principle: "Baseline for the model without Carnot — establishes the headroom Carnot operates in."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism precondition for reproducibility."
        - reproducibility_checksum: str
          principle: "Catches silent corpus or model-version drift between this artifact and any future replication."
        - model_specs: {name: "Qwen3.6-35B-A3B-GGUF", quant: "...", revision_sha: "..."}
          principle: "Real compute requires naming what was compute'd on."
        - duration_s: float
          principle: "Real compute takes wall-time; expected >=3600s for 2 conditions x 5 seeds x N=500 live inference. Sleep-padding forbidden per CLAUDE.md Verifier Authenticity Discipline."
        - preconditions_checked: list[{resource, available, check}]
          principle: "Anti-fabrication."
        - fr11_state_files: list[{path, sha256, n_bytes}]
          principle: "Names the persisted state that was reset for condition B — operator can verify."
        - state_files_restored_sha_match: true
          principle: "Proves FR-11 state restored to original SHAs (non-destructive)."
        - methodology_note: str
          principle: "Honest interpretation. Examples: 'Architecture carries the headline; FR-11 supplementary' (small learning_contribution) or 'FR-11 self-learning provides substantial benefit; ensemble v7b's headline AUROC is the production-config number, with architecture-only baseline at X' (large learning_contribution). Either is publishable; misrepresenting is not."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2803
    milestone: "2026.05.265"
    deliverable: "results/experiment_2803_truthfulqa_ensemble_eval.json"
    title: "TruthfulQA Corpus — Both Memory Conditions (Architecture-Only + Production, 5 seeds each)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 60
    track: corpus
    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline" and
      "Adversarial Artifact Verification".

      CONTEXT: per operator directive 2026-05-21, expand evaluation
      beyond FoVer to test factuality generalization. TruthfulQA is the
      industry-standard adversarial-truthfulness benchmark (Lin et al.
      2022, arXiv:2109.07958, 817 Qs across 38 categories). Carnot has
      never been measured on TruthfulQA; FoVer-trained verifiers may
      perform near-random.

      OPERATOR DIRECTIVE 2026-05-21: run BOTH memory conditions — see
      exp2802 for the dual-condition protocol. Report architecture-only
      AND production-config AUROCs, plus learning_contribution delta.

      TASK: Run the verifier ensemble v7b against TruthfulQA generation
      split under TWO memory conditions (architecture-only / FR-11
      reset, AND production / full FR-11 state loaded). Compute AUROC
      for each condition under 5-seed adversarial replication.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `python3 -c "import torch; assert torch.cuda.is_available()"`
           b. `python3 -c "from datasets import load_dataset; load_dataset('truthful_qa', 'generation')"`
              — if HF unreachable, blocked_huggingface_truthfulqa_unreachable
           c. Qwen3.6-35B-A3B-GGUF cached (same check as exp2802)
           d. FR-11 state files present
           Record preconditions_checked.

        1. Load TruthfulQA generation split (817 questions).
        2. For each question, run live-GPU Qwen3.6-35B inference to
           generate a candidate answer.
        3. Compute ground-truth via BLEURT-base-128 semantic similarity
           against the reference best_answer (NO closed-weight judge per
           CLAUDE.md Decentralization rule 2). Threshold tuned on a
           held-out 50-Q calibration set.
        4. CONDITION A — production config: score with verifier
           ensemble v7b (full FR-11 state loaded). Record per-verifier
           scores + ensemble AUROC.
        5. CONDITION B — architecture-only: move FR-11 state files to
           /tmp/fr11_state_backup_<seed>/ non-destructively, restart
           Python, reload ensemble, confirm no NEXUS/constraint-
           template/session-memory loaded, score the same (q, c) pairs.
           Record per-verifier scores + ensemble AUROC.
        6. Restore FR-11 state files; verify SHA256 match.
        7. Repeat 2-6 with 5 seeds (42, 137, 271, 314, 1729).
        8. Compute both conditions' mean ± std; learning_contribution = A - B.
        9. Compare to TruthfulQA peer baselines: GPT-3 MC1 ~28%, any
           published BLEURT verifier comparator.
        10. Write artifact with BOTH conditions as primary headline.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:' / 'passed:' / 'shipped:'
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - corpus: "TruthfulQA-generation"
          principle: "Identifies which corpus was used."
        - n_questions: 817
          principle: "Sample size."
        - n_seeds: 5
          principle: "Adversarial replication seed count."

        # Both conditions per operator directive 2026-05-21.
        - condition_a_production_auroc_per_seed: list[float]
          principle: "Per-seed AUROC with full FR-11 state loaded (production config)."
        - condition_a_production_auroc_mean: float
          principle: "Production-config headline for TruthfulQA."
        - condition_a_production_auroc_std: float
          principle: "Replication noise."
        - condition_b_architecture_only_auroc_per_seed: list[float]
          principle: "Per-seed AUROC with FR-11 state reset (architecture-only)."
        - condition_b_architecture_only_auroc_mean: float
          principle: "Architecture-only headline for TruthfulQA — naive baseline."
        - condition_b_architecture_only_auroc_std: float
          principle: "Replication noise on architecture-only."
        - learning_contribution: float
          principle: "= A - B. Direct measurement. On TruthfulQA the contribution is expected to be near zero (FR-11 state is FoVer-derived); a positive contribution means rules transferred."
        - per_verifier_condition_a_auroc: dict[str, list[float]]
          principle: "Per-verifier production-config AUROC."
        - per_verifier_condition_b_auroc: dict[str, list[float]]
          principle: "Per-verifier architecture-only AUROC — KEY finding is which verifiers transfer from FoVer-math to TruthfulQA-factual."

        - scoring_method: "BLEURT-base-128, threshold tuned on 50-Q held-out"
          principle: "Documents how 'truthful' was operationalized."
        - bleurt_threshold: float
          principle: "Reproducibility — anyone replicating must use the same threshold."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism precondition for reproducibility."
        - reproducibility_checksum: str
          principle: "Catches corpus or model drift."
        - model_specs: dict
          principle: "Names the compute target."
        - duration_s: float
          principle: "Real compute takes wall-time; expected >=3600s for 2 conditions x 5 seeds x N=817 live inference. Sleep-padding forbidden per CLAUDE.md Verifier Authenticity Discipline."
        - preconditions_checked: list
          principle: "Anti-fabrication."
        - fr11_state_files: list[{path, sha256, n_bytes}]
          principle: "Names the persisted state reset for condition B."
        - state_files_restored_sha_match: true
          principle: "Proves FR-11 state restored to original SHAs (non-destructive)."
        - methodology_note: str — REQUIRED if either AUROC mean < 0.7
          principle: "Low AUROC on a new corpus is an honest finding (FoVer-shape overfit thesis), not a failure — but the artifact must say so explicitly. Same for low architecture-only AUROC: it's the naive baseline, not a target."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2804
    milestone: "2026.05.265"
