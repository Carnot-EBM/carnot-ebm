    track: research
    max_turns: 40
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # formulaic: per-category confusion-matrix tabulation over cached scores + gold labels; well-known pattern, deterministic, no open-ended judgment. Codex generates the breakdown efficiently.
