        - research-references.md "2026-05-31 Post-.324 Planning Sweep" (freezing transition, arXiv:2408.01503, DIFUSCO, 2410.14157)

      TASK: Build a HARD, headroom-preserving graph k-coloring corpus and run energy global inference
      vs greedy-AR AND a STRONG non-AR baseline, reporting solve-rate by difficulty + by optimizer
      variant. The corpus must NOT be ceiling-saturated.

      PRECONDITIONS (step 0):
        0a. ENCODING VALIDITY: encode a known-valid k-coloring of a small graph and assert its Ising/QUBO
            energy E==0. If not -> complete: blocked_graph_coloring_encoding_invalid (report residual); STOP.
        0b. HARDNESS GATE: assemble candidate instances and measure vanilla_descent solve_rate. ESCALATE
