- id: exp6901-independent-model-relation-qualification
  title: Independent held qualification of model-produced relations
  track: verification
  priority: critical
  agent_type: claude
  model: sonnet
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.09.604
  deliverable: results/experiment_6901_independent_model_relation_qualification.json
  gated_on:
    - upstream: exp6900-authentic-anchored-relation-corpus
      artifact_field: relation_corpus_complete_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Exp6900 owns acquisition only. V603's qualification score was satisfied by the lexical rule arm
    even though all model-produced arms had zero parse coverage. V604 needs a separate field that
    can be satisfied only by a GGUF or Enoki arm. Proposal coverage, tuple quality, exact ASP
    validity, and verifier completeness are separate claims.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V604 Planner Refresh
    - {project_root}/results/experiment_5909_sota_constraint_synthesis_ab.json
    - {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
    - {project_root}/results/experiment_6274_asp_energy_semantic_compiler.json
    - {project_root}/results/experiment_6886_enoki_exact_relation_fixture.json
    - {project_root}/results/experiment_6888_independent_relation_qualification.json
    - {project_root}/results/experiment_6900_authentic_anchored_relation_corpus.json
    - {project_root}/python/carnot/asp_energy_semantic_compiler.py
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/constraint-verification/spec.md

    TASK:
    In a fresh process, re-run adversarial admission on Exp6900, open the sealed held sidecar once,
    and independently score every proposal arm. Compute source grounding, tuple precision/recall,
    parse coverage, abstention, family floors, perturbation robustness, ASP compilation, and exact
    answer-set parity. The rule arm remains a diagnostic control and cannot satisfy model readiness.
    Do not run new model inference or repair an output.

    CONCRETE STEPS:
    0. PRECONDITIONS: require `relation_corpus_complete_score=1`, an unflagged Exp6900 artifact,
       exact source hashes, complete terminal rows, sealed held labels, the qualified compiler, and
       an independent ASP solver. On failure, write complete_blocked_independent_model_relation_qualification
       with gate_check_summary.
    1. Add REQ-VERIFY-6901 and focused tests first. Cover source drift, flagged-source admission,
       held leakage, missing cells, offset mismatch, duplicate credit, unsupported atoms, solver
       timeout, rule-only readiness, pooling, and aggregate-versus-row disagreement.
    2. Freeze thresholds from calibration only. Include minimum parse coverage, span F1, tuple
       precision, tuple recall, exact validity, family floor, perturbation floor, and abstention cost.
    3. Open the held sidecar once in a fresh reducer. Match rows by frozen record, arm, model, and
       seed IDs. Refuse any input containing held labels, answer sets, or solver receipts.
    4. Emit one row per arm, record, relation, family, perturbation, and exact check. Keep false
       positives, false negatives, malformed output, abstention, timeout, and missing proposals.
    5. Compile accepted tuples and compare zero-energy states with independent answer sets. Report
       proposal coverage separately from exact admitted correctness and completeness blind spots.
    6. Compute `qualified_model_relation_event_count` from GGUF and Enoki arms only. Set
       `model_relation_qualification_ready_score=1` only when at least one model-produced arm passes
       every frozen held threshold and contributes at least 90 exact-admitted events.
    7. The lexical rule arm may be reported but cannot satisfy either outgoing field. Because the
       exact verifier is oracle authority, use `circular_positive` for a passing verdict and never
       use `positive`.
    8. Run focused tests, Ruff, OpenSpec coverage, E2E-006, independent solver parity, adversarial
       verification, artifact-convention audit, verdict-row consistency lint, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one principle per required field and every
       gate field; preconditions_checked; inference_substrate
       (fresh_process_sealed_relation_reduction_no_llm); duration_s; source_artifact_hashes;
       adversarial_admission_rows; sealed_sidecar_hashes; frozen_thresholds; rows (one arm, record,
       relation, family, perturbation, and exact check per row); span_metric_rows; tuple_metric_rows;
       parse_coverage_rows; abstention_rows; family_rows; perturbation_rows; asp_compilation_rows;
       solver_parity_rows; completeness_blind_spot_rows; reported_vs_recomputed_metrics;
       independent_solver_receipts; held_leakage_count (zero); model_eligible_arm_rows;
       rule_control_rows; qualified_model_relation_event_count;
       model_relation_qualification_ready_score; random_seed; reproducibility_checksum;
       gate_check_summary with failed check, expected value, and observed value for any blocked
       verdict; verifier_is_oracle (true); verdict_class (circular_positive | null | blocked |
       disqualified | partial; never positive); honest_verdict (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6901_independent_model_relation_qualification.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp5909-sota-constraint-synthesis-ab
      verdict: 'complete_null: structured prompt arms did not improve exact synthesis'
      addressed_by: 'This task scores source-grounded relation proposals from frozen raw outputs and separates proposal coverage from exact atom validity instead of testing answer synthesis prompts.'
      retire_if_same_verdict: true
    - experiment_id: exp5923-sota-schema-supported-constraintir-ab
      verdict: 'retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates'
