    \   - sample_langevin(model: ContinuousEBM, n_steps: int = 2000, lr: float = 0.005,\n\
    \     noise_scale: float = 0.1, temp_schedule: str = 'cosine') -> np.ndarray:\n\
    \     Gradient descent + Gaussian noise injection.\n\
    \     x_{t+1} = x_t - lr * grad_E(x_t) + noise_scale * sqrt(2*lr) * eps_t\n\
