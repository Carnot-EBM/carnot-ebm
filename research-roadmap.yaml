#   G2: GENERALIZE the search/navigator to a SECOND game's wall -- vc33, the canonical 99%-accurate-
#      WM-still-fails case the .372 doc itself named but exp4021 substituted r11l for -- with a
#      NON-bespoke heuristic + subgoal decomposition + an HONEST node count (exp4034 + exp4035).
#      General planner, or r11l-specific trick? This is the strategic depth test.
