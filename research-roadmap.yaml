    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: medium
    prior_failures: []
    prompt: |
      CONTEXT: Per memory entry feedback_sweep_dedupe_protocol, every 4th
      keyword sweep should run sweep_citations.py on top-3 active queue
      anchors. CoT2-Meta (arXiv:2603.28135 Score 320, surfaced
      2026-05-16T04:35Z via routine citation-sweep on ODAR) has never
      been depth-swept itself. Same Ma/Gao/Liu author line as ODAR
      suggests further coherent research-program work may surface.

      FALSIFIABLE HYPOTHESIS: Citation-sweep on arXiv:2603.28135 surfaces
      at least 1 newly-relevant 2026 paper (post-dedupe) that ties to
      Carnot's verify-repair architecture or active research questions.

      EXISTING CODE TO READ FIRST:
        - scripts/sweep_citations.py (helper; arXiv:2602.23681 ODAR
          sweep surfaced 15 IDs incl. CoT2-Meta)
        - scripts/sweep_dedupe.py --filter
        - research-studying.md (current 64+ known-ID catalogue)

      TASK: Citation-sweep + dedupe + score new candidates.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `python3 scripts/sweep_citations.py --help` succeeds.
           b. `python3 scripts/sweep_dedupe.py --help` succeeds.
           Record preconditions_checked.
        1. `python3 scripts/sweep_citations.py 2603.28135 |
            python3 scripts/sweep_dedupe.py --filter
            --include-version-bumps`. Capture stderr summary.
        2. For each NEW arxiv ID (post-dedupe), fetch abstract via
           arXiv API; score per the relevance × novelty × feasibility ×
           urgency rubric (1-5 each).
        3. For Score >= 300, promote to research-studying.md Active
           Research Queue (Edit tool; CLAUDE.md no-pruning).
        4. For Score >= 400, add to ops/known-issues.md RESEARCH-STUDYING
           CANDIDATES (Edit tool; APPEND only).
        5. Append a Sweep YYYY-MM-DDTHH:MMZ subsection to
           research-studying.md noting the citation-anchor + new IDs +
           promotions.

      REQUIRED ARTIFACT FIELDS:
