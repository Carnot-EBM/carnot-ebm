  - id: exp2663
    milestone: "2026.05.254"
    deliverable: "results/experiment_2663_tier0e_eorm.json"
    title: "Tier 0e: EORM Energy Outcome Reward Model Verifier (arXiv:2505.14999)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: verifier

    gated_on:
      - upstream: exp2661-pretest-venv-hardening
        artifact_field: pre_tests_passing
        op: '=='
        value: true

    prior_failures:
      - experiment_id: exp2649-tier0e-eorm
        verdict: "skip_pre_tests_failing_no_artifact"
        addressed_by: "exp2649 SKIPPED in .253 due to missing .venv/bin/pytest. Pre-tests fixed in exp2661. Root cause was infrastructure (missing venv packages), not task content. exp2649 was auto-retired by conductor after 3 SKIPs; exp2663 uses new ID to reset failure counter. Same scope (EORM TF-IDF logistic regression on FoVer corpus) but in confirmed-working .254 environment."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Paper arXiv:2505.14999 introduces EORM (Energy Outcome Reward Model): a 55M-param energy-based
      framework that ranks CoT solutions via contrastive energy scoring (low energy = correct,
      high energy = incorrect). Carnot implements a TF-IDF proxy EORM on the FoVer corpus.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (existing verifier modules — follow naming/structure)
      - data/fover_corpus.jsonl (FoVer corpus — check format: expected {question, correct, incorrect} fields)
      - python/carnot/verify/tier0s.py (reference: logistic regression verifier pattern)
      - results/experiment_2636_tier0w_avgwd_eigenwd.json (Tier 0w pattern to follow for AUROC reporting)

      TASK: Implement Tier 0e EORM verifier as python/carnot/verify/tier0e_eorm.py.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn available.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `python -c "import json; lines=open('data/fover_corpus.jsonl').readlines(); print(len(lines))"` — FoVer corpus non-empty.
            If absent or empty: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Load FoVer corpus from data/fover_corpus.jsonl. Extract (correct, incorrect) pairs.
         For each pair: feature = TF-IDF cosine similarity between the response text and a
         "low-energy anchor" (the correct text). Label: 1 = correct (low energy), 0 = incorrect.
         Use sklearn TfidfVectorizer + cosine_similarity.
         Record: n_pairs_loaded, n_pairs_used.

      2. Implement margin ranking loss proxy: instead of binary logistic, use the signed
         difference between correct-score and incorrect-score as the logistic input.
         feature_vector = [tfidf_sim_correct - tfidf_sim_incorrect, tfidf_sim_correct, len_ratio]
         Train sklearn LogisticRegression on 80% train / 20% eval split.
         Record: train_size, eval_size.

      3. Evaluate on eval split: compute AUROC (sklearn roc_auc_score).
         Record: tier0e_auroc (float), tier0e_viable (bool = tier0e_auroc >= 0.65).

      4. Save model to results/tier0e_eorm_logistic.pkl via joblib.dump.
         Record: model_path.

      5. Create python/carnot/verify/tier0e_eorm.py with:
         - EORMVerifier class (matches Tier 0s/0u/0w interface: verify(text) -> float energy score)
         - load_model() class method loading from model_path
         - __init__.py export
         Record: module_created (bool).

      6. Write results/experiment_2663_tier0e_eorm.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - tier0e_auroc: float
        principle: "Primary evaluation metric for downstream gating; exp2667 gates on tier0e_viable."
      - tier0e_viable: bool — tier0e_auroc >= 0.65
        principle: "Gate field for exp2667 ensemble v11; missing or false means ensemble v11 skips Tier 0e."
      - n_pairs_loaded: int
        principle: "Confirms FoVer corpus was actually read (expected ~8829 lines)."
      - model_path: str
        principle: "Path to saved model so exp2667 can reload without retraining."
      - random_seed: int
        principle: "Reproducibility: train/eval split must be deterministic for 5-seed replication."
      - reproducibility_checksum: str
        principle: "sha256 of FoVer corpus slice used for training — detects corpus drift."
      - duration_s: float
        principle: "sklearn LogisticRegression on TF-IDF features should take 5-30s; < 1s = suspicious."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records actual precondition results."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2664
    milestone: "2026.05.254"
    deliverable: "results/experiment_2664_tier0l_layer_wise.json"
    title: "Tier 0l: Layer-Wise Information Drift Verifier (arXiv:2604.16217)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: verifier

    gated_on:
      - upstream: exp2661-pretest-venv-hardening
        artifact_field: pre_tests_passing
        op: '=='
        value: true

    prior_failures:
      - experiment_id: exp2650-tier0l-layer-wise
        verdict: "skip_pre_tests_failing_no_artifact"
        addressed_by: "exp2650 SKIPPED in .253 due to missing .venv/bin/pytest. Pre-tests fixed in exp2661. Same scope (TF-IDF inter-sentence drift proxy) but in confirmed-working .254 environment."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Paper arXiv:2604.16217 uses layer-wise information scores from internal LLM representations
      for conformal prediction. Key insight: internal representations remain stable under distribution
      shift while surface token distributions shift. TF-IDF proxy: inter-sentence cosine drift
      between early (sentence 1) and late (last sentence) TF-IDF vectors.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (existing verifier modules)
      - python/carnot/verify/tier0s.py (reference logistic regression pattern)
      - data/fover_corpus.jsonl (corpus format)
      - results/experiment_2636_tier0w_avgwd_eigenwd.json (Tier 0w AUROC reporting pattern)

      TASK: Implement Tier 0l layer-wise information drift verifier.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn available.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `python -c "import json; lines=open('data/fover_corpus.jsonl').readlines(); print(len(lines))"` — FoVer corpus non-empty.
            Record: preconditions_checked.

      1. Load FoVer corpus. For each response text:
         a. Split into sentences (simple: split on '. ', '? ', '! ').
         b. Compute TF-IDF vector for first sentence (early_vec) and last sentence (late_vec).
         c. information_drift = 1 - cosine_similarity(early_vec, late_vec) [higher drift = hallucination risk].
         d. Also compute: mean inter-sentence drift over all consecutive pairs.
         Record: feature_engineering_complete (bool).

      2. Train sklearn LogisticRegression on [information_drift, mean_inter_sentence_drift] features.
         Label: 1 = hallucination (high drift), 0 = correct (low drift).
         Use 80/20 train/eval split with random_seed=42.

      3. Evaluate AUROC on eval split.
         Record: tier0l_auroc (float), tier0l_viable (bool = tier0l_auroc >= 0.60).

      4. Save model to results/tier0l_layer_wise_logistic.pkl.

      5. Create python/carnot/verify/tier0l_layer_wise.py with LayerWiseDriftVerifier class
         (matches Tier 0 interface: verify(text) -> float energy score).

      6. Write results/experiment_2664_tier0l_layer_wise.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - tier0l_auroc: float
        principle: "Primary evaluation metric; gate for ensemble v11 inclusion."
      - tier0l_viable: bool — tier0l_auroc >= 0.60
        principle: "Gate field for exp2667 ensemble v11."
      - random_seed: int — must be 42
        principle: "Reproducibility: deterministic split for 5-seed replication in exp2667."
      - duration_s: float
        principle: "TF-IDF + logistic on 8k corpus should take 2-15s; < 1s is suspicious."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records actual precondition results."

