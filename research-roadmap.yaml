  - id: exp1878-roce-validator-tree
    milestone: 2026.05.147
    title: "Exp 1878: ROCE-to-Validator Tree Compiler"
    deliverable: "results/experiment_1878_roce_validator_tree.json"
    agent_type: codex
    model: gpt-5.5
    max_turns: 30
    gated_on:
      - upstream: exp1877-artifact-contract-normalization
        artifact_field: gate_contract_normalization_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp1864-roce-prototype
        verdict: unspecified
        addressed_by: "Exp 1864 extracted toy constraints with 0.80 success rate but did not compile executable validators or emit standard fields. This task changes the deliverable to a validator-tree compiler with zero-false-accept fixtures and schema-complete artifacts."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: Research references now point to ConstrainPrompt, NSVIF, and BEAVER as the right bridge from natural-language instructions to deterministic validators. Carnot needs ROCE output compiled into a local evaluation tree before it can trust live SOTA outputs.
      EXISTING CODE TO READ FIRST: python/carnot/verify/, python/carnot/pipeline/extract.py, python/carnot/pipeline/verdict_record.py, results/experiment_1864_roce.json, research-references.md
      TASK: Implement or extend a ROCE-to-validator tree compiler that maps extracted constraints into local Python/Z3/PySAT-compatible validation leaves with explicit conditional guards.
      CONCRETE STEPS:
      1. Reuse existing extractor and verifier patterns instead of inventing a separate framework.
      2. Support at least length, contains/forbidden-term, JSON shape, arithmetic equality, and conditional guard constraints.
      3. Add a fixture set with valid and adversarial invalid outputs and prove zero false accepts on those fixtures.
      4. Record constraint coverage and unsupported-constraint categories.
      5. Save `{project_root}/results/experiment_1878_roce_validator_tree.json`.
      REQUIRED ARTIFACT FIELDS:
      - status
      - honest_verdict
      - validator_tree_compiler_ready
      - zero_false_accepts
      - false_accept_count
      - constraint_coverage_rate
      - unsupported_constraint_types
      - tests_run

