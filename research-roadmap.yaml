      0. PRECONDITIONS:
         a. Check docs/arxiv-submission/ for .tex file:
            `ls docs/arxiv-submission/*.tex 2>/dev/null | head -3`
            Record: tex_file_found (bool), tex_file_path (str or "missing").
         b. Check results/ for any verify-repair run artifact with n_repair_attempts field:
            `ls results/experiment_4*.json results/experiment_5*.json 2>/dev/null | head -5`
            Record: repair_run_artifacts_found (list of str, up to 5).
         Record: preconditions_checked.

