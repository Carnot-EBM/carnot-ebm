        - python/carnot/ (the FR-11 controller-memory / self-learning module) + python/carnot/verify/ (the verifier ensemble for alpha_t grounding — the verifiers to combine Weaver-style)
        - data/fover_corpus.jsonl + data/p01_difficulty_matched_generations.jsonl (candidate corpora — build a 3-corpus battery with non-trivial true accuracy)
        - project_q12_hypothesis_b_and_dark_room + project_zenil_alpha_grounding + project_orthogonality_stall + project_pathological_joint_null_space (memory) — the theory
        - research-references.md "2026-05-31 Post-.327 Planning Sweep" (Weaver 2506.18203, BoN-MAV 2502.20379)

      TASK: Run the FR-11 closed loop to N>=200 on a 3-corpus NON-DEGENERATE battery (each corpus starting
      true accuracy in [0.3,0.6]) under THREE arms:
        - Arm DEPLOY-SINGLE (conservative-default beta, SINGLE-verifier grounding): the exp3555 condition.
        - Arm DEPLOY-DIVERSE (conservative-default beta, DIVERSE multi-verifier Weaver-style grounding): the P0.2 condition.
        - Arm CONTROL (beta=0): expected to COLLAPSE.
      Track DISTINCT metrics (output entropy, top-mode mass, verifier-PASS rate, TRUE ground-truth accuracy
      — ASSERT pass_rate and true_accuracy are different arrays).

      PRECONDITIONS (step 0):
        a. FR-11 self-learning module + cached traces present. If not -> complete: blocked_fr11_module_or_traces_unavailable.
        b. The verifier ensemble is callable in batch (single AND combinable). If not -> complete: blocked_verifier_suite_uncallable.
