      - experiment_id: exp6458-arc-representation-objective-generalization-ab
        verdict: "complete: Exp6458 audit finished with readiness gates unmet: frozen_safety_roster_not_regressed"
        addressed_by: "This A/B can run only after a direct same-roadmap held alignment result, uses the shipped generic live-path shield, freezes the full safety roster, and requires no-regression per-game cells before any policy claim."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6499 is the direct diagnostic gate. Only a positive held energy-to-progress alignment permits this default-off live policy A/B. The experiment compares the existing generic shield off and on under identical public games, seeds, model, and action budgets. The live agent must discover from its own attempts and runtime reverse engineering. Any incidental level reachability is credited only with live_agent_self_discovery provenance. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md, especially GGUF policy and ARC live-path reachability discipline
      - {project_root}/research-program.md, {project_root}/_bmad/prd.md, and the V560 roadmap document
      - {project_root}/results/experiment_6458_arc_representation_objective_generalization_ab.json
      - the exact Exp6471 generic safety-shield artifact and implementation recorded in research-complete.yaml
      - {project_root}/results/experiment_6499_arc_energy_progress_alignment.json
      - {project_root}/ops/arc_solve_registry.yaml, {project_root}/ops/arc_bench_latest.json, and frozen public roster records
      - {project_root}/scripts/experiment_template.py cached_sota_pair() documentation
      - arc_loop_solve, live-agent, model-runtime, prefix-energy, shield, budget, and progress code under {project_root}/python/carnot/
      - relevant tests, OpenSpec files, exclusion manifest, and ops/e2e-test-plan.md

      TASK
      Run a matched default-off live ARC A/B with the generic energy shield disabled versus enabled. Use a mandated local SOTA GGUF model identically in both arms. Measure progress, invalid actions, regressions, cost, and incidental live-path level reachability without source inspection, offline BFS, or per-game adapters.

      CONCRETE STEPS
      0. Evaluate the Exp6499 gate and persist exact artifact path, hash, field, expected, observed, and type. Run the ARC solve-registry precheck before freezing targets.
      1. Add REQ-* and SCENARIO anchors for gated default-off policy, matched live-agent A/B, local SOTA GGUF receipts, full safety roster, solve provenance, and no source/off-path solver. Write tests first.
      2. Define MODEL_SPECS with at least unsloth/Qwen3.6-35B-A3B-GGUF as the headline live agent. A second mandated Gemma model may be a predeclared robustness cell. Use llama_cpp and the embedded GGUF tokenizer; never use transformers.AutoTokenizer for GGUF.
      3. Freeze public games, eligible levels after registry precheck, seeds, action/time/token budgets, model file, quantization, runtime, prompts, progress metric, shield threshold, tie rules, stopping, and regression gates before execution.
      4. Run shield-off and shield-on arms with identical model bytes, prompts, initial states, seeds, and budgets. Randomize arm order without cross-arm memory. Charge energy and shield work explicitly.
      5. Keep all behavior on the live reachable path: agent attempts, runtime environment feedback, generic shield, and runtime reverse engineering. Prohibit game-source reading, exhaustive offline ground-truth BFS, hand GameAdapters, per-game calibration, and outer-loop action injection.
      6. Emit per game, level, seed, step, arm, action, energy, intervention, validity, progress, cost, and termination rows. Report the full frozen safety roster, headroom, confidence intervals, and all regressions.
      7. If a new level is incidentally reached, verify it independently and record solve_provenance=live_agent_self_discovery plus trace/action/environment receipts. Do not headline a level already reproduced in the registry.
      8. Set arc_policy_ab_execution_complete_score=1.0 when every frozen unit and attack is accounted for. Set arc_policy_ab_ready_score=1.0 only if shield-on improves the predeclared live objective beyond shield-off with no game-level safety regression, matched budgets, and valid live-path provenance. Emit the artifact and run focused tests, coverage, spec coverage, model/ARC receipts, row lint, adversarial verification, ARC E2E checks, and git status. Reconcile specs and ops docs.

      Required deliverable: {project_root}/results/experiment_6500_arc_live_energy_policy_ab.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal gated live A/B state."
        upstream_gate_receipt: "Exp6499 path, hash, field, expected, and observed value."
        arc_registry_precheck: "Registry path, hash, and already reproduced games/levels."
        model_specs: "Mandated local GGUF repository, file, quantization, and role."
        model_runtime_receipts: "Model hash, llama_cpp version, embedded tokenizer, backend, and n_gpu_layers."
        frozen_ab_manifest: "Roster, levels, seeds, budgets, model, prompts, metric, shield, ties, and gates."
        live_path_receipts: "Agent attempts, environment feedback, runtime RE, and generic shield path."
        rows: "Per game, level, seed, step, arm, action, energy, intervention, progress, validity, and cost."
        matched_budget_rows: "Tokens, actions, time, model calls, energy calls, and shield charges by paired unit."
        safety_roster_rows: "Full frozen roster with headroom and regressions."
        confidence_intervals: "Predeclared paired row-derived uncertainty."
        regression_rows: "Every game/level/safety/cost regression."
        solve_provenance: "live_agent_self_discovery for any incidental credited level reachability."
        solve_trace_receipts: "Action and environment receipts for any new incidental reachability."
        off_path_prohibition_receipts: "No source, offline BFS, per-game adapter, calibration, or outer-loop injection."
        arc_attack_matrix: "Gate, registry, budget, memory, source, adapter, provenance, filtering, and regression attacks."
        arc_policy_ab_execution_complete_score: "Execution-completeness field."
        arc_policy_ab_ready_score: "Policy-readiness result field."
        per_unit_rows: "Required game/level/seed/step/arm rows."
        aggregate_row_recomputation: "Every headline and gate recomputed from rows."
        gate_check_summary: "Exact gate evaluation or blocked_* reason and observed value."
        preconditions_checked: "Alignment gate, registry, model cache, live path, shield, and roster."
        protected_files_unchanged: "Active roadmap and conductor unchanged."
        inference_substrate: "local_llama_cpp_gguf_live_arc_agent_with_exact_environment_feedback."
        verifier_is_oracle: "False for model and energy; environment feedback is authoritative only for observed game state."
        field_principles: "Reason for every model, policy, safety, and provenance field."
        field_provenance: "Model bytes, prompts, traces, registry, environment receipts, and reducers."
        random_seed: "All model, arm-order, game, and interval seeds."
        duration_s: "Measured inference, environment, and task wall time."
        tests_run: "Commands and exit codes."
        reproducibility_checksum: "Hash over gate, registry, model, manifest, traces, and rows."
        honest_verdict: "complete_positive, complete_null, disqualified, or blocked_* with gate_check_summary."
      ACCEPTANCE GATES:
        - condition: "arc_policy_ab_execution_complete_score == 1.0 and every frozen paired unit is accounted for."
        - condition: "arc_policy_ab_ready_score is positive only with matched-budget objective benefit, full-roster no-regression, and live_agent_self_discovery provenance."
      Set inference_substrate=local_llama_cpp_gguf_live_arc_agent_with_exact_environment_feedback. Set verifier_is_oracle=false for model and energy.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6500_arc_live_energy_policy_ab --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6501-v560-independent-capstone-v561-handoff
    milestone: "2026.08.560"
    deliverable: results/experiment_6501_v560_capstone.json
    title: "V560 independent adversarial capstone and V561 evidence handoff"
    priority: critical
    track: milestone-reconciliation
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6459-v555-adversarial-capstone
        verdict: "complete_blocked: V555 capstone complete; no requested science, public ARC, or hardware claim is eligible"
        addressed_by: "V560 supplies new immutable solver trajectories, exact causal replay, executed anytime continuous learning, direct ARC alignment gates, and per-unit capstone recomputation; it still accepts a complete blocked outcome honestly if those new claims remain ineligible."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V560 contains 13 upstream tasks across trajectory energy, exact factor replay, checker routing, continuous self-learning, and ARC decision alignment. Several branches are deliberately gated; a closed gate is evidence, not a missing milestone. This capstone always runs. It independently verifies artifacts and rows, distinguishes valid nulls from broken contracts, applies prior-failure retirement, assesses the three PRD gaps, and creates a bounded V561 handoff. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/_bmad/prd.md, and {project_root}/_bmad/architecture.md
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md and {project_root}/research-roadmap-next.yaml
      - every available V560 artifact from {project_root}/results/experiment_6488_*.json through experiment_6500_*.json
      - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md, and {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/ops/arc_solve_registry.yaml, {project_root}/ops/status.md, {project_root}/ops/changelog.md, and {project_root}/_bmad/traceability.md
      - generic artifact, gate, verdict-row, recurrence-ledger, ARC live-path, spec-coverage, and adversarial verification tools; do not trust experiment-local aggregate reducers
      - {project_root}/ops/e2e-test-plan.md

      TASK
      Independently reconcile V560. Verify artifact existence and hashes, recompute headlines and gates from per-unit rows, validate blocked diagnostics and upstream field contracts, enforce prior-failure retirement, assess trajectory-energy, continuous-learning, and ARC claim eligibility, and write a V561 decision handoff. Do not rerun missing science or repair upstream results.

      CONCRETE STEPS
      0. Record repository state and create a manifest of expected Exp6488-Exp6500 artifacts. Classify each as complete, valid_null, blocked_by_scientific_gate, broken_gate_contract, missing, invalid, or disqualified.
      1. Add or confirm REQ-* and SCENARIO anchors for independent milestone reconciliation, gate-chain verification, row-derived claims, prior-failure retirement, and bounded handoff. Write tests first.
      2. Hash every artifact and independently recompute task counts, readiness fields, comparative headlines, confidence summaries, harmful flips, safety cells, continuous-learning dose/support, and ARC roster/provenance from raw rows.
      3. Verify every gated_on contract against the exact upstream artifact field and type. For every blocked_* artifact, require gate_check_summary to name the failed check, expected value, observed value, and upstream receipt.
      4. Check prior_failures entries, changed-scope receipts, retire_if_same_verdict outcomes, and exclusion-manifest consequences. Never require or reuse a retired upstream task.
      5. Red-team model authority, GGUF receipts, exact solver authority, shortcut leakage, event chronology, sequential evidence, durable actions, matched dose, future support, ARC registry, live-path provenance, and no special-hardware claim.
      6. Emit one claim row per experiment and one gap row for: leakage-resistant authentic energy, executed continuous self-learning, and ARC decision alignment. Separate execution completeness from scientific claim eligibility.
      7. Produce a V561 handoff with exactly one recommended branch per observed evidence combination, explicit retire/defer/scale actions, required prerequisites, and hardware access boundaries. Do not create or activate a new roadmap.
      8. Reconcile the applicable OpenSpec files, research-complete.yaml if appropriate to the normal conductor workflow, _bmad/traceability.md, ops/status.md, and ops/changelog.md. Do not edit research-roadmap.yaml.
      9. Emit the artifact and run focused tests, coverage, YAML/schema validation, gate audit, prior-failure lint, row/verdict consistency lint, recurrence ledger, spec coverage, documentation audit, adversarial verification, relevant E2E checks from ops/e2e-test-plan.md, and git status.

      Required deliverable: {project_root}/results/experiment_6501_v560_capstone.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal V560 capstone state."
        milestone_manifest_rows: "Expected Exp6488-Exp6500 artifact path, hash, and classification."
        gate_contract_rows: "Every downstream gate, upstream field, type, expected, observed, and result."
        blocked_diagnostic_rows: "Every blocked_* verdict and gate_check_summary quality."
        headline_recomputation_rows: "Independent task-level aggregate recomputations."
        claim_rows: "One evidence and eligibility row per experiment."
        trajectory_energy_claim_eligible: "Boolean and exact row-derived reasons."
        continuous_learning_claim_eligible: "Boolean and exact row-derived reasons."
        arc_policy_claim_eligible: "Boolean and exact row-derived reasons."
        hardware_claim_eligible: "False unless direct authenticated local hardware evidence unexpectedly exists."
        gap_closure_rows: "The three PRD gaps, evidence, residual risk, and disposition."
        prior_failure_retirement_rows: "Each prior verdict, changed scope, repeated verdict, and retirement action."
        exclusion_manifest_receipt: "Hash and any mechanically required additions."
        model_authority_audit: "GGUF receipts and no model-oracle boundary."
        csl_integrity_audit: "Chronology, evidence, actions, dose, future support, and safety."
        arc_integrity_audit: "Registry, full roster, live path, solve_provenance, and no off-path solver."
        hardware_boundary: "Direct local evidence versus external paper/vendor context."
        adversarial_attack_matrix: "Gate, row, authority, leakage, lifecycle, support, ARC, and hardware attacks."
        v561_handoff: "Evidence-conditional recommended branch, prerequisites, retirements, and deferrals."
        documentation_reconciliation_rows: "Specs, traceability, status, changelog, and completion ledger checks."
        v560_capstone_ready_score: "1.0 only when all expected outcomes are honestly classified and recomputed."
        per_unit_rows: "Required experiment/claim/gap/gate/attack rows."
        aggregate_row_recomputation: "Every capstone headline recomputed from rows."
        gate_check_summary: "No upstream execution gate; records capstone precondition and any blocked_* reason."
        preconditions_checked: "Roadmap, expected artifacts, lints, registries, and protected files."
        protected_files_unchanged: "Active roadmap and conductor unchanged."
        inference_substrate: "independent_milestone_artifact_replay_no_llm."
        verifier_is_oracle: "True only for deterministic artifact/row/hash checks and declared exact domains."
        field_principles: "Reason for every claim and reconciliation field."
        field_provenance: "Artifact paths, JSON pointers, hashes, independent reducers, and documents."
        random_seed: "Fixed audit and attack ordering seed."
        duration_s: "Measured audit wall time."
        tests_run: "Commands and exit codes."
        reproducibility_checksum: "Hash over the milestone manifest, rows, gates, attacks, and handoff."
        honest_verdict: "complete_* when reconciliation is valid, otherwise blocked_* with gate_check_summary."
      ACCEPTANCE GATES:
        - condition: "v560_capstone_ready_score == 1.0 and all Exp6488-Exp6500 outcomes are classified without treating a valid gate closure as missing science."
        - condition: "Every eligible headline and gate recomputes from rows; discrepancies remain explicit and downgrade the relevant claim."
      Set inference_substrate=independent_milestone_artifact_replay_no_llm. Set verifier_is_oracle=true only for deterministic artifact, row, and hash checks.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6501_v560_capstone --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.
