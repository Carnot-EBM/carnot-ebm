milestone: 2026.06.430
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-24). .429 grew capability 57->58 (A3 banked vc33 L3->L2) but BOTH
  generation-GUIDANCE levers NULLED on live solve-rate AGAIN: A1 (exp4652) productionized the PROVEN compute-cost fix
  (scipy.ndimage.label, per-node <1ms, no timeout -- the cost fix WORKED) but raising value_weight gave
  first_win_rate_delta=0.0/solve_rate_delta=0.0; A2 (exp4653) energy-as-fitness QD generated no_winner_generated. The live
  multi-level solve-rate is still 0.0 -- the 5th consecutive milestone where a lever crosses for first-win/efficiency but
  NOTHING crosses for SOLVE-RATE/DEPTH. THE DECISIVE NEW INPUT: a clean-Qwen, fully-instrumented outer-loop diagnosis
  (multi-level-deepening-diagnostic-2026-06-23.md, commit 8bb8a4cfd; root-cause workflow wf_fcab5470-68f) PINPOINTED the wall
  and the operator PRE-STAGED the fix (known-issues 2026-06-24). The binding constraint is the DEGENERATE L2 GOAL PREDICATE:
  the live level_up_reinduction pipeline dies at no_reachable_plan because the L2 is_level_complete is induced from ZERO L2-win
  positives (the induce prompt's WIN-STATE block is absent at the L2 boundary) and is NEVER verified (the held-out gate checks
  DYNAMICS only) -> unsatisfiable goal -> the planner has no reachable goal. The cheap levers are DEAD (gate-relax is a NO-OP
  vacuous-pass; evidence-delay BACKFIRES into explored_out). PLUS the live_multi_level_solve_rate metric is a HARNESS ARTIFACT
  (the rollout breaks at the first level-up -> depth>=2 is impossible by construction). And .429 B1 (exp4658) LOCALIZED A1's
  value-routing null to DISTRIBUTION_SHIFT (score 0.699, calibration_changes_routing=False), not calibration. .430 attacks the
  multi-level wall from TWO independent measured high-confidence mechanisms, both on the SCORED E3AgentPolicy, both
  verifier_is_oracle:false, both live-path-reachable: A1 (HEADLINE; operator pre-staged) fixes L2-GOAL-PREDICATE INDUCTION
  (capture the L1 win-grid as the WIN-STATE exemplar + add a GOAL-satisfiability check before planning) AND fixes the degenerate
  metric harness, gated on the GENERIC live agent reaching L2 on lp85 AND sc25 offline-reproduced (live_agent_self_discovery --
  the real ARC deliverable); A2 attacks A1's .429 value-routing null at its localized cause via DAgger-lite (re-train the value
  head on the SEARCH-DISTRIBUTION off-path states the agent actually visits). A3 banks +1 reproducible level (58->59+) + trains
  the learned verifier; A4 keeps the package operator-resubmit-ready (>33). Plus persist+transfer (A5), SUBMITTED_AGENT_CONFIG
  integration (A6), 2 infra (B1 multi-level-harness CI-gate + port-hygiene guard / B2 adversarial_verify L2-goal +
  degenerate-metric guards), 1 hardware (C), 1 SOTA-ingestion (D, structural-deepening fallback for .431), capstone (E).
  Submission operator-only. SOTA confirms both .430 directions (A1: arXiv:2511.19355/2506.06303/2603.09036 LLM goal/reward
  induction; A2: arXiv:2605.12913/1011.0686/2506.23793 DAgger distribution-shift). ARC Prize Milestone #1 deadline 2026-06-30 (6 days).
milestone_title: 'L2-GOAL-PREDICATE INDUCTION -- the multi-level wall is the DEGENERATE L2 GOAL PREDICATE (diagnosed
  clean-Qwen instrumented, operator pre-staged). .429 grew capability 57->58 (A3 vc33 L2) but BOTH generation-guidance levers
  NULLED on live solve-rate (value-routing no-live-lift [residual localized to DISTRIBUTION_SHIFT 0.699 by B1]; energy-fitness
  QD no-winner), live multi-level solve-rate STILL 0.0. .430 attacks the wall from TWO independent measured mechanisms on the
  SCORED E3AgentPolicy: A1 (HEADLINE; operator pre-staged) fixes L2-goal induction -- capture the L1 win-grid as the missing
  WIN-STATE exemplar + add a GOAL-satisfiability check before planning (the held-out gate checks DYNAMICS only, so a
  constant-False goal sails through -> no_reachable_plan) + fix the degenerate live_multi_level_solve_rate harness
  (target_levels>=2, no early break, non-colliding Qwen port), gated on the GENERIC live agent reaching L2 on lp85 AND sc25
  offline-reproduced (live_agent_self_discovery); A2 attacks A1''s value-routing null at its B1-localized cause via DAgger-lite
  (re-train the value head on search-distribution off-path states). Both verifier_is_oracle:false, both live-path-reachable. A3
  banks +1 (58->59+) + trains the verifier; A4 keeps the package >33. Plus persist+transfer (A5), integration (A6), 2 infra
  (B1/B2), 1 hardware (C), 1 SOTA-ingestion (D), capstone (E). 6 days to the ARC Prize Milestone #1 deadline (2026-06-30).'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  The 0.0 live multi-level solve-rate is the DEGENERATE L2 GOAL PREDICATE (clean-Qwen instrumented diagnosis, operator
  pre-staged). The live level_up_reinduction dies at no_reachable_plan: the L2 is_level_complete is induced from ZERO L2-win
  positives (WIN-STATE block absent at the boundary) and never verified (held-out gate is DYNAMICS-only) -> unsatisfiable. .430
  attacks it from TWO independent measured mechanisms. A1 (HEADLINE; operator pre-staged) is the precise fix: (1) capture the
  L1 win-grid at _begin_level_goal_episode and inject it as the WIN-STATE exemplar into the L2 induce prompt
  (arc_executable_world_model._transitions_block, which only emits WIN STATE when a transition has level_after>level_before --
  absent at L2), labeled "a state that COMPLETED the previous level; the next likely looks structurally similar"; (2) add a
  GOAL-satisfiability check (reject a constant-False is_level_complete with counterexample degenerate_goal_predicate, refine);
  (3) FIX the degenerate metric harness (target_levels>=2, drop the break-at-first-win, construct the proposer on a
  non-colliding port + verify via /props it serves Qwen not the gemma squatting 8919). Gate: generic live agent reaches L2 on
  lp85 AND sc25, offline-reproduced. A2 attacks A1''s .429 value-routing null at its B1-localized cause (DISTRIBUTION_SHIFT
  0.699): DAgger-lite -- re-collect value training data on the off-path search-distribution states the live agent visits,
  re-train the win-reachability head, re-route, measure live first-win/solve-rate vs the winning-path-trained baseline. Gates
  are sharp + control-guarded: A1 needs a non-degenerate goal (True on >=1 reachable grid) AND a reachable plan AND an
  offline-reproduced generic L2; A2 needs a CI excluding the .429 baseline AND a dropped distribution-shift score. CAPABILITY
  (A3): self-play banks +1 reproducible level (58->59+) + trains the learned verifier. SCORE (A4): keep the package
  operator-resubmit-ready (>33). Plus persist+transfer (A5), integration (A6), 2 infra (B1/B2), 1 hardware (C), 1
  SOTA-ingestion (D), capstone (E). verifier_is_oracle:false on every value claim; solve_provenance on every ARC solve task;
  submission operator-only. DEAD-ENDS (do NOT propose): held-out-gate-relax (NO-OP), evidence-delay (BACKFIRE). 6 days to the
  ARC Prize Milestone #1 deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC (A1-A6); >=1 level-up attempt
  that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A3); self-play loop EVERY milestone (A3 trains+checkpoints
  the verifier); 2 reserved infra (B1/B2); 1 per-board hardware (C); 1 SOTA-ingestion (D). All experiments codex/gpt-5.5;
  planner/retro stay Claude Opus. 6 days to the ARC Prize Milestone #1 deadline ($25K). The frozen live generator is
  Qwen3.5-9B-MTP on the iGPU (NEVER the 3090s); A1's induction arm declares live_llm_inference for that arm only."

