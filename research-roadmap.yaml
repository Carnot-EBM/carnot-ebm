- id: exp1112-llm-failure-exemplar-corpus-v1
  milestone: 2026.04.86
  deliverable: results/experiment_1112_llm_failure_exemplar_corpus_v1.json
  title: "LLM Failure Exemplar Corpus v1 — Goodfire Silico Comparison + Carnot Cascade TP Rate"
  agent_type: codex
  max_turns: 35
  estimated_wall_time_min: 35
  priority: medium
  requires_gpu: false
  prompt: |
    CONTEXT:
    ops/known-issues.md SHOULD entry: LLM Failure Exemplar Corpus + Goodfire Silico Comparison.

    Goodfire's Silico (MIT Tech Review 2026-04-30) is a closed-source white-box mechanistic
    interpretability tool that catalogs named, reproducible LLM failure modes:
    - 9.11 > 9.9: mathematical comparison error from Bible/version-numbering interference
    - Trolley problem moral framing bias
    - Deceptive disclosure suppression

    Carnot's complementary positioning: Silico tells you WHY a model said something wrong
    (white-box neuron tracing). Carnot tells you THAT it said something wrong and HOW to
    fix it (black-box energy verification + repair). A complete stack uses both.

    This experiment builds data/llm_failure_exemplars.jsonl and tests Carnot's cascade on it.

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/ (list all verifier files — understand cascade structure)
    - python/carnot/eval/diagnostics.py (use for analysis)
    - data/fover_corpus_v4.json (first 3 entries — understand format for comparison)

    TASK PART 1 — BUILD data/llm_failure_exemplars.jsonl:
    Create ≥30 exemplars in JSONL format, each entry:
    {
      "id": "exemplar_001",
      "category": "arithmetic_comparison" | "logical_consistency" | "factual_error" |
                   "moral_framing" | "numeric_precision" | "code_bug" | ... (≥10 categories),
      "source": "goodfire_published" | "carnot_internal" | "literature",
      "prompt": "What is larger, 9.11 or 9.9?",
      "buggy_response": "9.11 is larger because 11 > 9",
      "correct_response": "9.9 is larger because 0.11 < 0.9",
      "mechanistic_root_cause": "decimal comparison confusion — model treats 9.11 as version number",
      "carnot_energy_score": null,  # filled in by Part 2
      "carnot_verdict": null,       # filled in by Part 2
      "carnot_tier_detected": null  # filled in by Part 2
    }

    Required exemplar categories (build ≥3 per category, ≥10 categories):
    1. arithmetic_comparison: 9.11>9.9, version numbers, float comparison errors
    2. arithmetic_computation: wrong arithmetic with plausible-looking steps
    3. logical_consistency: contradicts itself within a reasoning chain
    4. factual_grounding: states incorrect facts with high confidence
    5. code_syntax: valid-looking code with subtle syntax error
    6. code_logic: valid syntax but logical bug (off-by-one, wrong operator)
    7. overconfidence: wrong answer stated with absolute certainty
    8. underspecification: ambiguous prompt answered without clarifying assumptions
    9. hallucination_numeric: fabricated statistics or numbers that sound plausible
    10. format_compliance: correct content but wrong output format

    TASK PART 2 — CASCADE EVALUATION:
    For each exemplar, score the BUGGY RESPONSE through the Carnot cascade:
    - Z3MathVerifier (from exp1107 if available — arithmetic_comparison should catch 9.11>9.9)
    - SemEnergy (from python.carnot.verify.semenergy_probe)
    - SOSKANEnergyV3 (if available)
    Report per-tier TP rate:
    TP[tier] = count(exemplars where tier detects bug) / count(exemplars in scope for tier)
    Report: mathematical_objective_tier_tp_rate (Z3, should be >0.9 for arithmetic_comparison)
    vs learned_tier_tp_rate (SOS-KAN, expected lower for structural bugs)

    TASK PART 3 — CARNOT vs SILICO POSITIONING:
    Write a brief positioning note (≤300 words) in results:
    "Carnot catches: [categories with TP>0.5] | Carnot misses: [categories with TP<0.2]
     Silico's advantage: mechanistic root cause explanation (white-box)
     Carnot's advantage: Apache 2.0, local-first, model-agnostic, actionable repair"

    CONCRETE STEPS:
    - (design 30+ exemplar entries covering 10+ categories)
    - (write data/llm_failure_exemplars.jsonl)
    - python -c "import json; exs = [json.loads(l) for l in open('data/llm_failure_exemplars.jsonl')]; print(len(exs), set(e['category'] for e in exs))"
    - (score each exemplar through cascade)
    - (compute per-tier TP rates)
    - Write results/experiment_1112_llm_failure_exemplar_corpus_v1.json

    REQUIRED ARTIFACT FIELDS:
    - n_exemplars: int (target: >= 30)
    - n_categories: int (target: >= 10)
    - exemplar_path: str ("data/llm_failure_exemplars.jsonl")
    - tier_tp_rates: dict (tier_name -> tp_rate)
    - mathematical_objective_tier_tp_rate: float (Z3Math on arithmetic_comparison)
    - learned_tier_tp_rate: float (SOS-KAN overall)
    - llm_failure_exemplar_corpus_30_exemplars: bool (n_exemplars >= 30)
    - goodfire_cascade_tp_rate_measured: bool
    - positioning_note_written: bool
    - honest_verdict: "corpus_complete_high_tp" | "corpus_complete_low_tp" | "corpus_partial" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1112_llm_failure_exemplar_corpus_v1.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

