       - "batching_incorrect" if violations_match=False (correctness regression)
    7. Write tests/python/test_experiment_841_symcode_batching.py with 100% coverage.
       Ensure existing SymCodeVerifier tests still pass.
       Traces to REQ-VERIFY-145, SCENARIO-VERIFY-173.
    8. Reconcile ops/changelog.md and ops/status.md.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_841_symcode_batching.py -v
