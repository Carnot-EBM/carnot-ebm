    \ JSON artifact data instead of Python code; the conductor's \"deliverable already exists\" fast-path\
    \ fires on file existence without validating Python content via ast.parse().\n\nThis is the\
    \ FIRST experiment of the milestone. It has two jobs:\n1. Fix RETRO-023 at the root: implement\
    \ DeliverableContentValidator as a reusable utility module that every future experiment\
    \ can import to guard against corrupt deliverables.\n2. GPU preflight v2: confirm GPU state\
    \ and generate cloud GPU setup instructions if local GPU is offline.\n\nThis experiment is\
    \ CPU-only. Regardless of GPU state, it MUST complete and produce a result JSON.\n\nEXISTING\
    \ CODE TO READ FIRST:\n- python/carnot/pipeline/gpu_preflight.py — GPUPreflightResult,\
    \ run_gpu_preflight (Exp 390)\n- python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate\
    \ (Exp 377)\n- python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu() (Exp 352)\n\
    - scripts/session_startup.sh — GPU env setup\n- scripts/experiment_template.py — ExperimentTemplate\
    \ patterns\n- results/experiment_390_gpu_preflight.json — prior preflight result (if exists)\n\n\
    TASK: Implement DeliverableContentValidator and GPU preflight v2.\n1. Read CLAUDE.md spec-first\
    \ workflow.\n2. Add REQ-INFRA-019 (DeliverableContentValidator verifies Python deliverables\
    \ contain valid Python via ast.parse before conductor fast-path can accept them),\n   REQ-INFRA-020\
    \ (cloud GPU setup script generated when local GPU unavailable),\n   SCENARIO-INFRA-022/023/024\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Write tests FIRST (100% coverage\
    \ required) for ALL of the following:\n   - DeliverableContentValidator: utility class\n   \
    \  - DeliverableContentValidator.is_valid_python(path: str) -> bool:\n     Reads file, calls\
