    - {project_root}/results/experiment_6803_sota_operational_handoff_corpus.json
    - {project_root}/openspec/capabilities/agentic-harness/spec.md
    - {project_root}/openspec/capabilities/constraint-verification/spec.md
    - {project_root}/openspec/capabilities/continuous-learning/spec.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/scripts/validate_prior_failures.py

    TASK:
    Map every V595 contract to an existing capability owner. Add explicit REQ-* anchors for the
    operational-obligation interface, exact priority arbiter, transactional verified memory, and
    live stepwise strategy path. Validate the activated V595 manifest against the design document.
    Do not implement the experiments and do not invent a fourth capability spec.

    CONCRETE STEPS:
    0. PRECONDITIONS: hash the V595 design, active roadmap, three owned specs, .594 artifacts,
       exclusion manifest, and validator. If the activated roadmap is not milestone 2026.08.595,
       write complete_blocked_v595_contract_manifest_preflight with gate_check_summary and stop.
    1. Add tests first for the contract map. Then add V595 REQ anchors to agentic-harness,
       constraint-verification, and continuous-learning. Each anchor names its implementing task,
       exact artifact path, gate field, authority boundary, and failure behavior.
    2. Parse the design and active YAML. Require exactly 14 unique tasks, consecutive Exp6810-
       Exp6823 IDs, one unique deliverable per task, four phases in the document, and an ungated
       Exp6823 disposition task.
    3. Resolve every gated_on upstream in this roadmap. Require the upstream prompt to declare the
       same artifact field verbatim in REQUIRED ARTIFACT FIELDS. Reject positivity gates, retired
       upstream dependencies, duplicate IDs, missing deliverables, and missing prior_failures.
    4. Verify every LLM task declares a permitted MODEL_SPECS value, every comparison has
       per_unit_rows=true, and every prompt ends with the required run command and prohibition.
    5. Emit one row per task and one row per REQ owner. Set v595_contract_map_ready=true only when
