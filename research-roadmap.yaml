    \   f. Identify optimal_threshold (min fp_delta < -0.3 with max tp_loss < 0.2).\n\
    \   g. Build artifact: schema='carnot.confidence_filter.v1',\n      threshold_sweep=[{threshold,\
    \ fp_rate, tp_rate, repair_trigger_rate}, ...],\n      baseline_fp_rate=<from\
    \ Exp 554>,\n      optimal_threshold=<float>,\n      fp_reduction_at_optimal=<float>,\n\
    \      tp_loss_at_optimal=<float>,\n      honest_verdict='fp_reduced_significantly'\
    \ if fp_delta<-0.3 else 'marginal_improvement'.\n   h. tmpl.assert_deliverable_written()\
