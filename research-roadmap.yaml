      (target parity at 10-100x cheaper). 2026 practice corroborates the thesis: lightweight verifiers run
      60-1000x cheaper than a frontier LLM-judge (the Meta-EBM Cascade Router). Run it head-to-head with REAL
      wall-clock/token cost (NOT the .387 abstract selection-operation units).

      EXISTING CODE TO READ FIRST:
        - results/experiment_4185_headroom_recensus_llm_judge_harness.json (headroom_present_domain, the judge arm, judge_cost_meter)
        - results/experiment_4176_vstar_selector_model.json (the .387 V-STaR deployable selector)
        - results/experiment_4177_decisive_headroom_controlled_moat_test.json (the .387 accuracy moat to extend with cost)
