  - id: exp2770
    milestone: "2026.05.262"
    deliverable: "results/experiment_2770_repair_pipeline_forensic.json"
    title: "Repair Pipeline Forensic: Detect-Repair-Verify Stage Analysis (arXiv:2603.23633)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 30
    track: research

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      exp2754 (.261) found empirical_delta=0.000 (0/60 repair attempts succeed). Per
      arXiv:2603.23633 (Detect-Repair-Verify empirical study): the DETECT stage failure rate
      (verifier false negatives) is the dominant bottleneck in repair pipelines — 47% of failures
      are due to incorrect fault localization.

      Per arXiv:2605.12270 (Failure Modes of LLM Repair): 22% of failures are regression
      introductions (repair fixes target error but breaks other constraints).

      This forensic experiment diagnoses WHICH stage fails in Carnot's verify-repair pipeline:
      (1) DETECT stage: are violations actually being detected (non-zero energy)?
      (2) REPAIR stage: are repairs actually being attempted?
      (3) VERIFY stage: are repaired outputs being evaluated correctly?
      (4) REGRESSION: does repair break other constraints that were previously satisfied?

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (the repair pipeline — full method signatures)
      - results/experiment_2754_empirical_delta_audit.json (H2 regression diagnosis)

      TASK: Instrument the verify-repair pipeline to diagnose which stage is failing.
      Run N=20 FoVer violation examples with detailed per-stage logging. Identify bottleneck stage.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sys; sys.path.insert(0,'python'); from carnot.pipeline.verify_repair import VerifyRepairPipeline; print('ok')"` succeeds
            Record: pipeline_importable (bool).
         b. `wc -l data/fover_corpus.jsonl`
            Record: fover_n (int).
         Record: preconditions_checked.

      1. For N=20 FoVer violation examples (random_seed=42), run each through the pipeline with
         per-stage instrumentation:
         For each example:
           a. DETECT: energy_before = pipeline.verify(prompt, response)
              detected = energy_before > 0.0
           b. REPAIR: repaired = pipeline.repair(prompt, response) if detected else None
              repair_attempted = repaired is not None and repaired != response
           c. VERIFY: energy_after = pipeline.verify(prompt, repaired) if repair_attempted else None
              improved = energy_after < energy_before if energy_after else False
           d. REGRESSION CHECK: run verifier on 5 additional non-violation examples before and after repair
              regression_introduced = any(energy_increases on previously-zero-energy examples)

      2. Compute per-stage failure rates:
         detect_failure_rate = sum(not detected) / N
         repair_failure_rate = sum(detected but not repair_attempted) / sum(detected)
         improve_failure_rate = sum(repair_attempted but not improved) / sum(repair_attempted)
         regression_rate = sum(regression_introduced) / sum(repair_attempted)

      3. Identify bottleneck:
         bottleneck_stage = argmax(detect_failure_rate, repair_failure_rate, improve_failure_rate)
         Record: bottleneck_stage (str in {"detect", "repair", "verify", "regression", "multiple"}).

      4. Cross-reference with exp2767 findings if available.

      5. Write results/experiment_2770_repair_pipeline_forensic.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix."
      - bottleneck_stage: str
        principle: "Primary finding: which stage fails most; informs exp2767 fix strategy."
      - detect_failure_rate: float
        principle: "Fraction of examples with energy_before=0 (verifier not detecting violation)."
      - repair_failure_rate: float
        principle: "Fraction of detected examples where repair was not attempted."
      - improve_failure_rate: float
        principle: "Fraction of repaired examples where energy didn't decrease."
      - regression_rate: float
        principle: "Fraction of repairs that introduced new violations (H2 regression proxy)."
      - n_examples: int — 20
        principle: "Sample size for forensic; small enough to be fast, large enough to see pattern."
      - per_example_results: list of {detected, repair_attempted, improved, regression_introduced}
        principle: "Full per-example audit trail for debugging."
      - duration_s: float
        principle: "Instrument + run 20 examples: expected > 5s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication."

