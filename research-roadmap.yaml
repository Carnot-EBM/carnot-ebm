      - openspec/capabilities/verifiable-reasoning/spec.md
      - openspec/capabilities/verification/spec.md
      - python/carnot/verify/
      - python/carnot/verifiers/

      TASK:
      Train or fit a lightweight in-domain FoVer selector over train examples and evaluate on held-out examples from the same FoVer domain. Compare against vote@1, tuned self-consistency, simple length/format heuristics, and shuffled-label controls. The headline gate is a clean selector win over tuned self-consistency with CI95 excluding 0 and label-ablation failing.

      CONCRETE STEPS:
      1. Load the exp5111 pool and verify pool_n>=150, headroom_present=true, verifier_is_oracle=false, and pool checksum.
      2. Create train/test splits within the same FoVer domain. Do not hold out a different domain and do not claim cross-domain generalization.
      3. Implement selector features that cannot directly read answer labels. Prefer formal step/support evidence, contradiction markers, graph support, and process features.
      4. Fit a simple, auditable selector or energy scoring rule with deterministic seeds.
      5. Evaluate selected-answer accuracy versus tuned self-consistency, vote@1, oracle@K, random, length/format, and shuffled-label controls.
      6. Bootstrap CI95 for selector_delta_over_tuned_sc and emit selection_result_available=true.
      7. Emit fover_in_domain_selector_holds only if delta>0, CI95 excludes 0, non-degenerate guards pass, and label-ablation/shuffled-label controls fail to reproduce the win.

