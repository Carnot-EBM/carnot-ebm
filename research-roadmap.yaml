tasks:
- id: exp8136-contract-custody
  title: Bind fourteen tasks and preserve the terminal V703 dispositions
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 25
  per_unit_rows: true
  milestone: 2026.10.704
  deliverable: results/experiment_8136_v704_contract_custody.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prior_failures:
  - experiment_id: exp8110-contract-custody
    verdict: complete_blocked_design_exact_task_contract
    addressed_by: Reuse the now-qualified Exp8123 reader and exercise the exact V704 heading/table/full-task
      digest before activation.
    retire_if_same_verdict: true
  - experiment_id: exp8083-contract-custody
    verdict: complete_disqualified_research-roadmap-vNEXT_md
    addressed_by: Generate both documents from all14 actual dictionaries and preserve predecessor design bytes.
    retire_if_same_verdict: true
  agent_type: claude
  model: opus
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V703 scheduled13 tasks but published only5 primaries. Exp8124 failed before publication and7 dependents were skipped. Exp8123 proved exact authority binding. The archive ends at V702; use the active V703 roadmap and conductor log for this closure.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py; python/carnot/reporting/primary_publication.py; tests/python/test_primary_publication_7928.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/v685_authority_lifecycle.py; tests/python/test_experiment_7891_v685_authority_lifecycle.py; results/experiment_8123_v703_contract_custody.json; results/experiment_8135_v703_capstone.json; openspec/change-proposals/research-roadmap-v703-preserved-20261004.md; ops/conductor-log.md
    TASK:
    Bind fourteen tasks and preserve the terminal V703 dispositions. Deliver results/experiment_8136_v704_contract_custody.json, primitive evidence under results/raw/experiment_8136_v704_contract_custody/ and runnable scripts/experiments/experiment_8136_v704_contract_custody.py.
    CONCRETE STEPS:
    1. Emit a flushed progress line at every phase boundary. Emit one before and after each model load, generation, benchmark and subprocess. Set PYTHONUNBUFFERED=1 and use print(..., flush=True). Print real completed/pending counts inside long loops and child waits at least every60 seconds. Keep each silence gap below600 seconds. Poll children in tool calls of at most60 seconds. Write files over about200 lines in several tool calls of at most about150 lines. Send a progress message between writes. Never pad duration or invent progress.
    2. Check input paths, hashes and prerequisites with bounded calls. Read cited results through scripts/summarize_artifact.py. Preserve historical failed primaries. An unchanged missing or retired upstream is terminal complete_blocked_<check>, verdict_class=blocked. Record its exact field, expected value and observed value in gate_check_summary. Never use partial for an external block.
    3. Extend the relevant REQ-* and SCENARIO-* before implementation. Write failing tests first. Reuse existing qualified modules through a thin CLI. Keep test and validation outputs in private temporary directories outside results/. Preserve original assertions. Require script-path execution outside the checkout without PYTHONPATH.
    4. Load no LLM. Declare MODEL_SPECS=[] and inference_substrate_class=no_model_load. Use aggregation_from_upstream_artifacts for reductions, or verifier_ensemble_against_cached_candidates for CPU head evaluation. Put historical Qwen identity under cited_upstream_artifacts, not current invocation evidence. Describe trained small heads in trained_head_specs.
    5. Bind exactly14 full task dictionaries Exp8136 through Exp8149. Require the literal heading ## Exact task contract, five-column table, V704_TASK_CONTRACT_START JSON and canonical tasks_digest. Compare prompts, models, gates and complete failure history with the actual activated authority.
    6. Preserve the V703 design bytes separately from its activation snapshot. Reconstruct13 dispositions: five primaries, one failed unpublished producer and seven gate skips. A missing honest_verdict remains missing; label conductor statuses as conductor statuses. Never manufacture a scientific verdict for skipped work.
    7. Exercise staging, activation, staging disappearance and immutable snapshots with the existing parameterized reader. Planning simulation uses private copies only. Never change research-roadmap.yaml. Reject omitted/extra/reordered tasks, stale digest, prompt mutation and gate-field drift.
    8. Run E2E-018 through a private authority CLI and twelve mutations. Export administrative contract readiness independently of every research branch. Do not make this receipt a universal science gate.
    9. Freeze owned validation argv before measurement. Run scoped unit and consumer tests, Ruff check and format, strict mypy, 100% changed-code statement coverage and scoped spec coverage. Run applicable E2E private CLI success, external block, mutation and cold replay. Capture argv, expected/actual exits, normal exit, duration and log hash. If Rust changes, run cargo test, fmt, clippy and the actual loaded binding. Keep existing repository-health failures separate; do not turn an unrelated full-suite rerun into a science prerequisite.
    10. Save primitive rows and transcripts with source/code/config hashes. Independently recompute reductions. Run unmodified scripts/adversarial_verify.py and strict scripts/verdict_row_consistency_lint.py with a60s heartbeat and normal exits. Publish through primary_publication only after owned validation passes. An owned validation failure disqualifies the result and sets readiness0. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md without deleting history. Do not edit operator-curated publication pages or publish externally.
    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: complete_* terminal string; principle: completed nulls and external blocks are recorded once.
    - verdict_class: positive | circular_positive | null | blocked | disqualified | partial; principle: partial means unfinished owned work only.
    - verifier_is_oracle, claim_scope, exposure_scope; principle: fixture truth is circular_positive, never a positive natural-data result.
    - independent_generalization_score: 0; generalized_learning_benefit_score: 0; principle: exposed development cannot prove external generalization.
    - required_checks_passed, flagged_adversarial, validation_receipts, terminal_validation_sidecar_path; principle: normal owned checks precede publication.
    - gate_check_summary: check/upstream/path/hash/artifact_field/op/expected/observed/passed; principle: every blocked result names the failed operand.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, call_ledger, trained_head_specs; principle: distinguish current execution from imported model provenance.
    - rows: unit_id/source_cluster_id/arm/condition/metric/numerator/denominator/status/exclusion_reason; principle: comparative headlines reduce from per-unit evidence with missing units retained.
    - intended_count, eligible_count, independent_count, completed_count, excluded_count, censored_count, failed_count, sample_size_budget; principle: repeats do not create independent sources.
    - run_date, duration_s, random_seed, reproducibility_checksum, source_artifact_hashes, raw_shard_hashes, code_config_hashes, phase_spans; principle: bind real work to exact bytes.
    - acceptance_gates, field_principles, cited_upstream_artifacts; principle: explain thresholds and imported fields.
    - contract_ready_score: 0|1; principle: authority agreement is administrative, not scientific benefit.
    - task_contract, canonical_tasks_sha256, authority_snapshots, historical_dispositions; principle: preserve the actual13 predecessor outcomes and14 planned tasks.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_8136_v704_contract_custody.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
