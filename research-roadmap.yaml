           EvalPlus hidden tests -- no wasted generation); extend generation to NEW tasks toward
           ACCUMULATED N>=160. For each task, generate k>=8 candidates from the LOCAL gemma-4-12B GGUF
           (BATCHED). Four arms over the SAME candidate pool, all EVALUATED against EvalPlus HIDDEN tests:
