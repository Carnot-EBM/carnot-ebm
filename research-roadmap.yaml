- id: exp789-ebm-calibration-alignment
  milestone: 2026.04.60
  deliverable: results/experiment_789_ebm_calibration_alignment.json
  title: 'Exp 789: EBM Calibration Alignment — Energy as Probability Signal (arXiv 2603.06604 + 2602.11364)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Two arxiv papers motivate this experiment:
    1. arXiv 2603.06604 "Know When You're Wrong" (March 2026): shows supervised fine-tuning
       yields well-calibrated confidence; RL induces overconfidence. Key finding: probability
       != correctness — calibration gap is 15-25pp across tasks. Carnot's energy should be
       a calibration target: low energy = high P(correct).
    2. arXiv 2602.11364 "Energy of Falsehood" (February 2026): diffusion model reconstruction
       energy detects hallucinations with AUROC 0.725 on FEVER. The "reconstruction energy"
       (how badly the diffusion model reconstructs a claim) is a proxy for correctness.

    Current Carnot pipeline uses energy as a DISCRIMINATIVE signal (is this violated or not?).
    But energy should also be a CALIBRATED signal: energy decile should predict accuracy decile.
    If calibrated, energy enables probabilistic reasoning: "this response has 80% P(correct)."
    If uncalibrated, energy is just a binary detector, not a reasoning tool.

    This experiment measures calibration and applies isotonic regression to fix it.
    Uses only CPU and pre-collected data (no GPU required).

    EXISTING CODE TO READ FIRST:
    - results/fover_labeled_steps_live.json — 57 real labeled CoT steps.
    - results/fover_labeled_steps_live_v2.json — Exp 781 new pairs (load if exists).
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline; energy computation.
    - python/carnot/models/ising.py — IsingEBM energy function.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Compute Carnot energy on pooled FoVer labeled steps. Measure calibration (ECE).
    Apply isotonic regression. Compare: ECE before/after calibration. Report calibration curve.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-CALIB-001 (EBMCalibrator MUST compute Expected Calibration Error (ECE) from
       energy-binned accuracy; MUST use 10 equal-frequency bins; MUST apply isotonic regression
       to learn energy → P(correct) mapping), REQ-CALIB-002 (calibration curve MUST be saved
       to results/ebm_calibration_curve.json; ECE_before and ECE_after MUST be reported),
       SCENARIO-CALIB-001/002 to openspec/capabilities/verification/spec.md.
    3. Implement python/carnot/pipeline/ebm_calibrator.py:
       a. CalibrationBin(energy_low, energy_high, accuracy, n_samples, bin_confidence):
          - bin_confidence = mean(sigmoid(-energy)) for samples in bin
       b. EBMCalibrator(n_bins=10):
          compute_ece(energies: list[float], labels: list[int]) -> float:
            - Sort by energy. Split into n_bins equal-frequency bins.
            - For each bin: accuracy = mean(labels). confidence = mean(sigmoid(-energy)).
            - ECE = sum(|accuracy - confidence| * bin_size) / total_samples.
          fit_isotonic(energies: list[float], labels: list[int]) -> IsotonicRegression:
            - Fit sklearn.isotonic.IsotonicRegression(y_min=0, y_max=1) on (-energy, label).
            - Returns fitted calibrator.
          save_curve(bins: list[CalibrationBin], path: str) -> None:
            - Write JSON with calibration curve data (for plotting).
    4. Load pooled labeled steps:
       a. Load fover_labeled_steps_live.json (57 steps).
       b. Load fover_labeled_steps_live_v2.json (Exp 781) if available.
       c. Pool all (step_text, label) pairs.
    5. Compute Carnot energy for each step:
       - Use VerifyRepairPipeline or IsingEBM directly.
       - If pipeline not available for text steps: use TF-IDF + IsingEBM energy proxy.
       - Record energy values.
    6. Compute ECE_before = EBMCalibrator.compute_ece(energies, labels).
    7. Fit isotonic regression: iso_reg = calibrator.fit_isotonic(energies, labels).
    8. Apply calibration: calibrated_probs = iso_reg.predict(-energies).
    9. Compute ECE_after from calibrated_probs vs labels.
       ece_improvement = ECE_before - ECE_after (positive = better after calibration).
    10. Save calibration curve to results/ebm_calibration_curve.json.
    11. Create scripts/experiment_789_ebm_calibration_alignment.py:
        a. ExperimentTemplate(789) + ExperimentTimeoutWatchdog(789, timeout_minutes=20).
        b. Implement steps 4-10.
        c. honest_verdict:
           - "energy_well_calibrated" if ECE_before <= 0.10 (good calibration already)
           - "calibration_improved" if ece_improvement >= 0.05 (significant improvement)
           - "calibration_marginal" if 0 < ece_improvement < 0.05 (minor improvement)
           - "calibration_no_improvement" if ece_improvement <= 0 (isotonic doesn't help)
           - "insufficient_data" if n_total_steps < 20
        d. artifact: n_total_steps, ECE_before, ECE_after, ece_improvement,
           calibration_curve_saved (bool), honest_verdict.
    12. Write tests/python/test_experiment_789_ebm_calibration_alignment.py with 100% coverage:
        - test EBMCalibrator.compute_ece returns 0.0 for perfectly calibrated energies.
        - test calibration bins: equal-frequency binning produces n_bins equal-size bins.
        - test ece_improvement = ECE_before - ECE_after.
        Each test traces to REQ-CALIB-001/002.
    13. Reconcile:
        - ops/status.md: "EBM calibration alignment (arXiv 2603.06604): ECE_before=X,
          ECE_after=Y, ece_improvement=Z. Calibration curve saved. honest_verdict=W."
        - ops/changelog.md: one-line with honest_verdict.
    14. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

