- id: exp2421-codex-cli-diagnostic-v2
  title: 'Phase 0: Codex CLI Infrastructure Diagnostic v2 — Complexity-Graded Health Check'
  milestone: 2026.05.235
  deliverable: results/experiment_2421_codex_diagnostic_v2.json
  requires_claude: true
  max_turns: 30
  prior_failures:
  - experiment_id: exp2393-codex-cli-diagnostic
    verdict: complete_codex_cli_healthy_232_was_transient_backend_error
    addressed_by: "exp2393 in .233 diagnosed the .232 failure as a transient OpenAI backend
      error that resolved naturally. However the SAME pattern recurred in .234 (all 13 tasks
      failed). This v2 diagnostic runs a complexity-graded health check (simple + medium +
      complex) to detect whether the backend issue affects all task complexity levels or
      only complex tasks. Also checks Codex CLI version and quota status."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: Milestone .234 failed with 0/13 tasks producing artifacts — all failed with
    "Codex CLI error: you finish the real work inside 10 minutes, that is correct".
    This is the SECOND time this pattern has occurred (.232 was the first, diagnosed in
    .233 as a transient backend error). This diagnostic v2 uses a COMPLEXITY-GRADED test
    to determine:
      a) Is Codex CLI working at all?
      b) Is it working for simple tasks but failing for complex ones?
      c) What is the reliability threshold?

    REQUIRES_CLAUDE JUSTIFICATION: (1) Claude must run Codex to test whether Codex works —
    a Codex task cannot diagnose Codex's own failure. (2) Requires multi-step orchestration:
    launch 3 Codex subprocess invocations with increasing complexity, interpret output,
    classify failure mode, write a structured diagnostic artifact. (3) Open-ended judgment:
    interpreting partial Codex output to distinguish "transient backend" from "capability
    threshold" is ambiguous and cannot be reduced to deterministic gate checks.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Check Codex version: codex --version 2>/dev/null || echo "codex_not_found"
            Record codex_version.
         b. Check conductor config for Codex routing:
            grep -n "codex" {project_root}/scripts/research_conductor.py | head -20

      1. TEST LEVEL 1 — Simple (2-sentence math answer):
         timeout 60 codex exec --color never --model gpt-5.5 --ephemeral - <<'EOF'
         What is 17 + 25? Reply with just the number.
         EOF
         Record level1_exit_code, level1_stdout_first_100_chars, level1_success (true if
         exit code 0 AND output contains "42").

      2. TEST LEVEL 2 — Medium (read a file, write a JSON artifact):
         Create /tmp/codex_test_input.txt with content "Test input: EBM verification."
         timeout 120 codex exec --color never --model gpt-5.5 --ephemeral - <<'EOF'
         Read the file /tmp/codex_test_input.txt. Then write a JSON file at
         /tmp/codex_test_output.json containing {"read_content": "<content>",
         "status": "ok", "experiment": "codex_level2_test"}.
         Write the file then say Done.
         EOF
         Record level2_exit_code, level2_success (true if /tmp/codex_test_output.json
         exists and contains "status": "ok").

      3. TEST LEVEL 3 — Complex (multi-step Python script + JSON result):
         timeout 180 codex exec --color never --model gpt-5.5 --ephemeral - <<'EOF'
         Write a Python script at /tmp/codex_test_complex.py that:
           1. Imports json, time, random
           2. Computes random.seed(42); values = [random.random() for _ in range(10)]
           3. Writes {"values": values, "mean": sum(values)/len(values), "status": "ok"}
              to /tmp/codex_test_complex.json
           4. Prints "Done."
         Then run the script: python3 /tmp/codex_test_complex.py
         Then read and print the output JSON.
         EOF
         Record level3_exit_code, level3_success (true if /tmp/codex_test_complex.json
         exists and "status" == "ok").

      4. Classify failure mode:
         - If all 3 levels pass: codex_cli_healthy=true, complexity_threshold=3
         - If level1 passes but level2 fails: codex_cli_healthy=false,
           complexity_threshold=1, failure_mode="medium_complexity_failure"
         - If level1+2 pass but level3 fails: codex_cli_healthy=false,
           complexity_threshold=2, failure_mode="complex_task_failure"
         - If level1 fails: codex_cli_healthy=false, complexity_threshold=0,
           failure_mode="complete_backend_failure"

      5. Failure signature check: look for the exact string "you finish the real work
         inside 10 minutes, that is correct" in any level's stdout. If found:
           failure_signature_matched=true, root_cause_hypothesis="transient_backend_echo"

      6. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with codex_cli_healthy boolean."
      - codex_cli_healthy:
          principle: "True only if ALL 3 levels pass — conservative gate for downstream tasks."
      - codex_version:
          principle: "Version string for reproducibility / regression detection."
      - complexity_threshold:
          principle: "Max complexity level (0-3) Codex handles reliably. 3 = fully healthy."
      - failure_mode:
          principle: "Classification of failure type — guides future diagnostic efforts."
      - failure_signature_matched:
          principle: "True if the .232/.234 prompt-echo signature is observed — confirms recurring pattern."
      - level1_success:
          principle: "Codex can answer trivial questions — baseline health check."
      - level2_success:
          principle: "Codex can read files and write JSON — conductor-task-level health."
      - level3_success:
          principle: "Codex can execute multi-step Python — full-task-level health."
      - duration_s:
          principle: "Guards against fabrication."

    ACCEPTANCE GATES:
      - condition: "codex_cli_healthy != null"
        principle: "Must produce a definitive health boolean — even false is a valid result."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2422-hive-full-4verifier-v4
  title: 'Phase 1: Full HIVE 4-Verifier Ensemble v4 (Tier 0f+0g+0h+0j) — Target AUROC > 0.90'
  milestone: 2026.05.235
  deliverable: results/experiment_2422_hive_full_v4.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  gated_on:
  - upstream: exp2421-codex-cli-diagnostic-v2
    artifact_field: codex_cli_healthy
    op: '=='
    value: true
  prior_failures:
  - experiment_id: exp2408-hive-full-4verifier-v3
    verdict: codex_cli_error_failed
    addressed_by: "exp2408 in .234 failed x3 with Codex CLI error (same backend pattern
      as .232). exp2421 (Codex diagnostic v2) gates this task — only runs if Codex is
      confirmed healthy at complexity level 3."
    retire_if_same_verdict: true
  - experiment_id: exp2398-hive-4verifier-ensemble-v2
    verdict: complete_only_3_verifiers_fused
    addressed_by: "exp2398 in .233 fused only 3 verifiers (AUROC=0.8539) because Tier 0f
      (FreqAwareAttn, exp2397) was available but not read. This v4 explicitly reads
      exp2397 artifact and fuses all 4 Tier 0 verifiers with calibrated abstention."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: HIVE (arXiv:2604.26139) achieves AUROC=0.9236 via 4-verifier soft-voting.
    .233's HIVE ensemble (exp2398) achieved 0.8539 using only 3 verifiers — Tier 0f
    (FreqAwareAttn, AUROC=0.7045) was available but NOT included. .234's attempt
    (exp2408) failed via Codex CLI error. This v4 attempt is gated on the Codex
    diagnostic confirming healthy CLI.

    Available .233 verifier artifacts:
      Tier 0f: results/experiment_2397_freq_aware_attn.json (freq_attn_auroc=0.7045)
      Tier 0g: results/experiment_2351_semantic_energy_real.json (AUROC=0.6852)
      Tier 0h: results/experiment_2368_laab_k17.json (LaaB logical consistency)
      Tier 0j: results/experiment_2394_halt_tier0j.json (halt_k19j_auroc=0.8539)

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/hive_ensemble.py (from exp2398 if present)
      {project_root}/python/carnot/verify/freq_aware_attention.py (Tier 0f)
      {project_root}/python/carnot/verify/halt_probe.py (Tier 0j)
      {project_root}/python/carnot/verify/semantic_energy.py (Tier 0g)
      {project_root}/python/carnot/verify/laab_verifier.py (Tier 0h)
      {project_root}/results/experiment_2397_freq_aware_attn.json (Tier 0f scores)
      {project_root}/results/experiment_2394_halt_tier0j.json (Tier 0j scores)
      {project_root}/results/experiment_2398_hive_ensemble.json (.233 ensemble baseline)

    TASK: Implement HiveEnsembleV4 fusing all 4 Tier 0 verifiers with calibrated abstention.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. sklearn importable: .venv/bin/python -c "import sklearn; print(sklearn.__version__)"
            If missing: .venv/bin/pip install scikit-learn -q
         b. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         c. Count available Tier 0 verifier modules:
            .venv/bin/python -c "
            count = 0
            for mod in ['carnot.verify.freq_aware_attention', 'carnot.verify.semantic_energy',
                        'carnot.verify.laab_verifier', 'carnot.verify.halt_probe']:
                try: __import__(mod); count += 1; print(f'OK: {mod}')
                except Exception as e: print(f'MISSING: {mod}: {e}')
            print(f'{count} verifiers available')
            "
            If count < 3: write honest_verdict blocked_insufficient_verifiers and exit.

      1. Load verifier scores for all 36 telemetry entries used in exp2351:
         a. For each of the 4 Tier 0 verifiers, call verify(entry) to get a score.
         b. Build feature matrix X (n=36, d=4) and label vector y (ground truth labels).

      2. Implement HiveEnsembleV4 at python/carnot/verify/hive_ensemble_v4.py:
         a. Learn soft-vote weights via LogisticRegression with 5-fold CV
            (CalibratedClassifierCV for probability calibration — HALT-RAG abstention pattern).
         b. Calibrated abstention: when ensemble confidence < 0.6 (neither P(halluc)
            nor P(clean) exceeds 0.6), set verdict = "uncertain" and score = 0.5.
         c. AUROC computed on ALL 36 examples including uncertain ones.

      3. Compute:
         - hive_v4_auroc: AUROC on 36 examples
         - hive_v4_vs_v2_delta: hive_v4_auroc - 0.8539 (.233 HIVE v2 baseline)
         - ensemble_auroc_improved: hive_v4_auroc > 0.8539
         - abstention_rate: fraction flagged "uncertain"
         - n_verifiers_fused: must be 4
         - verifier_weights: soft-vote weights per verifier

      4. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "hive_v4 or hive_ensemble_v4" -v --no-cov 2>&1 | tail -15
         Create test if none exists.

      5. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with ensemble AUROC."
      - hive_v4_auroc:
          principle: "Primary metric. Target > 0.9236 (HIVE peer). Honest result."
      - hive_v4_vs_v2_delta:
          principle: "hive_v4_auroc - 0.8539. Positive = improvement over .233 ensemble."
      - ensemble_auroc_improved:
          principle: "True if hive_v4_auroc > 0.8539 (.233 HIVE v2 baseline). Gate for capstone."
      - n_verifiers_fused:
          principle: "Must be 4 — all Tier 0 verifiers included."
      - verifier_weights:
          principle: "Soft-vote weights per verifier — reproducibility."
      - abstention_rate:
          principle: "Fraction of uncertain examples. HALT-RAG calibration signal."
      - n_eval_examples:
          principle: "Must be 36."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records verifier count, sklearn, telemetry checks."

    ACCEPTANCE GATES:
      - condition: "ensemble_auroc_improved == true"
        principle: "v4 must beat v2 baseline 0.8539 — 4-verifier fusion improves over 3."
      - condition: "n_verifiers_fused == 4"
        principle: "All 4 Tier 0 verifiers must be fused — key change vs .233."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2423-hierarchical-logcons-v2
  title: 'Phase 1: Hierarchical Alignment LogCons v2 (arXiv:2604.09075) — Z3 Instruction Hierarchy'
  milestone: 2026.05.235
  deliverable: results/experiment_2423_hierarchical_logcons_v2.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  gated_on:
  - upstream: exp2421-codex-cli-diagnostic-v2
    artifact_field: codex_cli_healthy
    op: '=='
    value: true
  prior_failures:
  - experiment_id: exp2409-hierarchical-logcons
    verdict: codex_cli_error_failed
    addressed_by: "exp2409 in .234 failed x3 with Codex CLI error. Gated on exp2421
      Codex diagnostic — only runs when Codex is confirmed healthy."
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT: Hierarchical Alignment via Logical Consistency (arXiv:2604.09075, April 2026)
    enforces hierarchical instruction compliance via Z3 partial-order constraint checking.
    Achieves 91% adherence vs 67% baseline in nested instruction scenarios. This is a new
    scope — no HierarchicalLogCons exists in the codebase. Baseline: FregeLogic AUROC=0.8831.
    Note: Also integrate TruncProof grammar grounding (arXiv:2605.13076) as a structural
    pre-check for syntactic validity before passing claims to Z3.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/fregelogic_hybrid.py (architecture reference)
      {project_root}/python/carnot/verify/nsvif_z3_extractor.py (Z3 encoding reference)
      {project_root}/results/experiment_2395_fregelogic.json (AUROC=0.8831 baseline)

    TASK: Implement HierarchicalLogConsVerifier and evaluate on 36 telemetry entries.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. z3-solver importable: .venv/bin/python -c "import z3; print(z3.get_version_string())"
            If missing: .venv/bin/pip install z3-solver -q
         b. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         c. Inspect telemetry for instruction fields:
            .venv/bin/python -c "
            import json
            with open('{project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl') as f:
                row = json.loads(f.readline())
            instr_fields = [k for k in row.keys() if any(x in k.lower() for x in
                            ['instruction', 'prompt', 'system', 'task', 'question'])]
            print('instruction-like fields:', instr_fields)
            "

      1. Implement HierarchicalLogConsVerifier at python/carnot/verify/hierarchical_logcons.py:
         Priority model:
           Level 0 (highest): system-level constraints (safety, format)
           Level 1: user-level instructions
           Level 2: task-level requirements
         TruncProof structural pre-check (arXiv:2605.13076):
           Parse response for structural validity markers (balanced brackets, complete sentences).
           If structural_valid=False: add structural_penalty=0.3 to logcons_score.
         Consistency check via Z3:
           Z3 assertion: claimed_level >= required_level (higher priority first).
           If UNSAT: hierarchy_violation=True → hallucination signal.
         Fallback (when hierarchy not detectable): use FregeLogic's Z3 verification with
           priority_consistency_bonus based on sentence-level logical flow.
         Output: logcons_score, hierarchy_violation, priority_level_used.

      2. Evaluate on 36 entries (same split as exp2351):
         logcons_auroc, logcons_vs_fregelogic_delta (baseline 0.8831),
         hierarchy_violation_rate.

      3. Unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "logcons" -v --no-cov 2>&1 | tail -15

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required."
      - logcons_auroc:
          principle: "Primary metric. Compare with FregeLogic 0.8831. Honest result."
      - logcons_vs_fregelogic_delta:
          principle: "LogCons - FregeLogic delta. Positive = improvement."
      - hierarchy_violation_rate:
          principle: "Fraction of examples with detected hierarchy violations."
      - z3_encoding_used:
          principle: "Whether Z3 partial-order was used or fallback."
      - truncproof_structural_checks:
          principle: "Number of examples where structural pre-check fired."
      - n_eval_examples:
          principle: "Must be 36."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records z3, telemetry, instruction-field checks."

    ACCEPTANCE GATES:
      - condition: "logcons_auroc != null AND n_eval_examples >= 30"
        principle: "Must produce valid AUROC on sufficient data."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2424-halt-rag-nli-v2
  title: 'Phase 1: HALT-RAG Calibrated NLI Ensemble v2 (arXiv:2509.07475) — Precision via Abstention'
  milestone: 2026.05.235
  deliverable: results/experiment_2424_halt_rag_nli_v2.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  gated_on:
  - upstream: exp2421-codex-cli-diagnostic-v2
    artifact_field: codex_cli_healthy
    op: '=='
    value: true
  prior_failures:
  - experiment_id: exp2410-halt-rag-nli-ensemble
    verdict: codex_cli_error_failed
    addressed_by: "exp2410 in .234 failed x3 with Codex CLI error. Gated on exp2421
      Codex diagnostic — only runs when Codex is confirmed healthy."
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT: HALT-RAG (arXiv:2509.07475) combines frozen NLI model ensembles with
    feature-based abstention for RAG hallucination detection. When ensemble confidence
    < threshold, system abstains rather than making a low-confidence prediction.
    This improves calibration and AUROC by removing lowest-confidence (highest-noise)
    examples from the scored set.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/nsvif_z3_extractor.py (logical consistency)
      {project_root}/python/carnot/verify/semantic_energy.py (logit-based score)
      {project_root}/results/experiment_2395_fregelogic.json (AUROC=0.8831 baseline)

    TASK: Implement HaltRagNliDetector v2 with calibrated abstention. Evaluate on 36 entries.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         b. sklearn importable: .venv/bin/python -c "import sklearn; print(sklearn.__version__)"
         c. scipy importable: .venv/bin/python -c "import scipy; print(scipy.__version__)"

      1. Implement HaltRagNliDetector at python/carnot/verify/halt_rag_nli.py:
         NLI proxy (without pretrained NLI model):
           Signal 1: SemanticEnergy score (logit variance proxy)
           Signal 2: FreqAwareAttn score (stopword-frequency proxy)
           Signal 3: HALT probe score (logprob kurtosis proxy)
           Ensemble via CalibratedClassifierCV (sklearn) for probability calibration.
         Abstention threshold: if max(P(halluc), P(clean)) < 0.65, abstain.
         Output: halt_rag_score, abstained (bool), confidence, nli_signals_used.

      2. Evaluate on 36 entries:
         halt_rag_auroc_full: AUROC including abstained examples (score=0.5).
         halt_rag_auroc_confident: AUROC on non-abstained examples only.
         abstention_rate: fraction abstained.
         halt_rag_vs_fregelogic_delta: halt_rag_auroc_full - 0.8831.

      3. Unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "halt_rag" -v --no-cov 2>&1 | tail -15

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required."
      - halt_rag_auroc_full:
          principle: "AUROC on all 36 examples. Primary metric — honest result."
      - halt_rag_auroc_confident:
          principle: "AUROC on non-abstained only — calibration benefit."
      - halt_rag_vs_fregelogic_delta:
          principle: "halt_rag_auroc_full - 0.8831. Positive = improvement."
      - abstention_rate:
          principle: "Core HALT-RAG mechanism signal."
      - n_verifiers_fused:
          principle: "Number of NLI proxy signals used (should be 3)."
      - n_eval_examples:
          principle: "Must be 36."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records telemetry, sklearn, scipy checks."

    ACCEPTANCE GATES:
      - condition: "halt_rag_auroc_full != null AND n_eval_examples >= 30"
        principle: "Must produce valid AUROC — even below baseline is a finding."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2425-fr11-nsvif-online-v4
