      - {project_root}/tests/python/test_experiment_6121_gatemate_changed_state_gate_v530.py

      TASK
      Implement a cached GateMate terminal-action audit. Compare the canonical prior physical-state hash with any newer dated operator receipt. Unchanged state must execute zero hardware/tool commands and emit the exact action packet. Only a materially changed cable/port/power/board/DirtyJTAG receipt may authorize the single bounded non-destructive detect already specified by REQ-HW-6121. Do not synthesize, place, route, pack, flash, time, or claim hardware performance.

      Required deliverable: {project_root}/results/experiment_6199_gatemate_terminal_action_audit_v537.json.
