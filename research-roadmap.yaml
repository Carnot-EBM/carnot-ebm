milestone: 2026.09.668
milestone_title: Format-aware evidence, causal decision learning, and live goal confirmation
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp7657-contract-methods
  title: Bind fourteen tasks and distinguish evidence-format failure from scientific nulls
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 40
  per_unit_rows: true
  milestone: 2026.09.668
  deliverable: results/experiment_7657_v668_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  agent_type: claude
  model: opus
  prior_failures:
  - experiment_id: exp7643-contract-methods
    verdict: complete_disqualified_v667_validation
    addressed_by: The prior prompt-path check treated consumed staging as an existing input; select authority
      by milestone and test both lifecycle states before terminal validation.
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.668. V667 checked zero real source predicates because its source and claim grammars missed the corpus. Its learning chain did not run. The new source mechanism preserves real formats and partial semantic scope. Invalid validation receipts are distinct from scientific nulls.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/results/experiment_7656_v667_capstone.json
    - {project_root}/python/carnot/experiment_7643_v667_contract_methods.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/publication_gate.py
    - {project_root}/research-references.md

    TASK:
    Produce results/experiment_7657_v668_contract_methods.json. Write a thin CLI at scripts/experiments/experiment_7657_v668_contract_methods.py. Put reusable behavior in its capability module and orchestration in python/carnot/experiment_7657_v668_contract_methods.py. Focused tests go in tests/python/test_experiment_7657_v668_contract_methods.py.
    Execution: inference_substrate_class=aggregation; MODEL_SPECS=[].

    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed progress line immediately. Resolve {project_root} absolutely. Authenticate real inputs and declare resource checks. Missing external evidence is complete_blocked_<reason> with verdict_class=blocked and gate_check_summary. Never retry unchanged absence as partial.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER any model load, generation, benchmark or subprocess that can take minutes. Inside long loops print completed units and elapsed time at least every 60 seconds. Stream child output and maintain an owned heartbeat during waits. Keep EVERY silence gap below 600 seconds to retain the 4800-second hard cap; a silent task can die at 1200 seconds. Checkpoint each completed unit.

    3. Bound EVERY tool call. Write any file over about 200 lines in several calls of about 100-150 lines. Send a progress message BETWEEN calls. Split large reads and validation commands. Put scratch in /tmp, real experiment entrypoints in scripts/experiments, and tests in tests/python.

    4. Add REQ-REPORT-7657 and meaningful SCENARIO-* items before implementation. Update the affected capability spec as needed. Write failing tests first. Reuse existing modules and thin wrappers; do not copy a large experiment harness. Preserve historical artifacts and unrelated edits.

    5. Resolve the authority by milestone: prefer staged YAML only when it is 2026.09.668; otherwise use the activated 2026.09.668 roadmap. Compare the design machine block and table against all fourteen ordered tasks, exp7657-exp7670, including titles, phases, paths, classes, models and gates. Treat a consumed staging alias as optional; never require an absent staging file after activation. This task gates no science.

    6. Write docs/research-notes/v668-method-map.md. Ingest the dated V668 literature review. Rank ideas by relevance, novelty, feasibility and urgency in research-studying.md. Preserve EAEV identity-versus-meaning, delayed-feedback limits, Z1T excluded costs and the existing ARC cycle-verifier implementation. Keep the generator frozen.

    7. Account for all fourteen V667 tasks from its preserved design, active/archive authority, actual artifacts and conductor pre-gate receipts. The archive may lag completion. Record the source grammar mismatch, 39 percent coverage failure, full-suite gate contamination and six rejected ARC inductions separately. Do not declare unrun head/learning tasks scientific nulls.

    8. E2E: cold-read the staged and consumed-authority cases in a private directory. Reject deletion, reorder, changed gate names, stale milestone and self-input mutations. Run roadmap schema, prior-failure, exclusion, gate, harness-fit, prompt-path, ARC and overdue-priority readers. Compute stable publication G1-G4 unchanged; no activation.

    9. Freeze the affected-file validation manifest BEFORE measurement. Run focused pytest with -n 0 -o addopts=, pinned PYTHONPATH, private COVERAGE_FILE and a private --basetemp whose parent exists. Require 100 percent coverage of changed behavior, scoped Ruff check/format, changed-module mypy and affected-test spec coverage. Rust changes also need scoped cargo tests, fmt and clippy. Record unrelated full-suite debt separately; never add a repository-wide suite to this experiment's preconditions or acceptance gates after seeing results.

    10. Run the declared entrypoint and task E2E checks. Independently cold-reduce raw rows in a fresh process. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict against the exact terminal candidate. Store reader exits and log hashes before atomic publication. A failed required check makes the artifact disqualified; fixture success is circular_positive; readiness alone is null. Set all readiness scores to zero if required validation fails.

    11. Reconcile openspec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve prior determinations. Apply the declared same-verdict retirement to the failed mechanism; external resource absence does not disprove science. Do not activate or edit research-roadmap.yaml. No push, external publication, submission, purchase, generator-weight training or production default promotion.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: Use a terminal complete_ prefix. Completion and scientific benefit are separate.
    - verdict_class: Exactly positive | circular_positive | null | blocked | disqualified | partial. Partial is unfinished owned work only. Unchanged missing external evidence is blocked.
    - flagged_adversarial: Boolean terminal reader result. Flagged evidence cannot open a gate.
    - gate_check_summary: Every blocked result names check, upstream, path, exact field, operator, expected and observed values.
    - acceptance_gate_results: Separate validity, readiness, coverage, probability benefit, utility, retention and freshness. Record measured operands and governing principles.
    - rows: One record per independent unit and arm, including raw metrics, counts, exclusions, censoring and provenance. Repeated views and seeds do not enlarge the sample.
    - sample_size_budget: Intended, observed, eligible, excluded and censored independent groups; prior exposure and claim limits.
    - inference_substrate: Actual current work in the established vocabulary. Historical model provenance is separate; CPU source work is not a current model run.
    - inference_substrate_class: Actual class plus planned_inference_substrate_class. Full generation floor 60s; bounded generation 10s; load without generation 2s. Never pad duration.
    - MODEL_SPECS: Actual identities plus planned_MODEL_SPECS. Include unsloth/Qwen3.8-27B-GGUF for every current LLM task. CPU-only work uses []. Also emit the reader-compatible model_specs field, including an explicit no-model declaration when required; never invent a target model.
    - model_invoked: Current invocation flag and invocation_counts for loads, forwards, generations and tokens, including attempted and cancelled work.
    - execution_venue: Closed enum host | kv260 | polarfire | gatemate. Put host, GPU UUID and owned PID details in execution_venue_details.
    - phase_spans: Disjoint monotonic stage timings, completed units, heartbeat times and checkpoint positions; duration_s measures actual current work.
    - random_seed: Seed values and purposes. reproducibility_checksum binds immutable input bytes, configuration and reducer code.
    - source_artifact_hashes: Distinguish producers, pre-gate receipts and missing inputs. Planned outputs are never their own immutable inputs.
    - preconditions_checked: Actual resource and input checks, not a requirement that a planned output already exists.
    - validation_receipts: Frozen affected scope, actual commands, exits, log hashes, cold reduction and exact-candidate terminal readers. Preserve unrelated repository-suite debt separately.
    - verifier_is_oracle: True for exact fixture truth. Such results are circular_positive, never learned-verifier advantage.
    - field_principles: State the governing principle beside each measured field and each gate.
    - contract_ready_score: 1 only after full authority equality and required validation; accounting only.
    - method_map_path: docs/research-notes/v668-method-map.md
    - prior_dispositions: Exactly fourteen V667 dispositions, including absent producers and actual pre-gate paths.

    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7657_v668_contract_methods.py --date {date} --output results/experiment_7657_v668_contract_methods.json
    Do NOT push. Do NOT modify scripts/research_conductor.py.
