    \     Run Z3. Label as 'correct' (sat), 'incorrect' (unsat), 'not_formalizable'.\n\
    \   - build_vprm_training_pairs(steps: list[ReasoningStep]) -> list[tuple[ReasoningStep, ReasoningStep]]:\n\
    \     Contrastive pairs: (correct step, incorrect step) from same question.\n\
    \   - VPRMTrainingResult(n_steps_annotated: int, n_correct: int, n_incorrect: int,\n\
    \     n_not_formalizable: int, before_auroc: float, after_auroc: float,\n\
    \     honest_verdict: str)\n\
    \   - train_ising_as_vprm(pairs: list, n_epochs: int = 50) -> tuple[IsingEBM, float]:\n\
    \     Train IsingEBM via CD on (correct_step, incorrect_step) pairs.\n\
    \     Return (trained_model, after_auroc).\n\
    \   - Test: parsing splits 'Step 1: ... Step 2: ...' correctly\n\
    \   - Test: Z3 stub labels arithmetic equalities as correct, inequalities as incorrect\n\
