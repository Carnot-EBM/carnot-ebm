        diverse_grounding_helps: principle="boolean: diverse multi-verifier grounding materially beats single-verifier grounding on collapse margin and/or final quality — the P0.2 verifier-diversity answer."
        pass_rate_vs_true_accuracy_distinct_assert: principle="boolean: pass_rate and true_accuracy verified element-wise distinct at runtime — keeps it de-flagged."
        random_seed: principle="determinism; content-derived, not the experiment number."
