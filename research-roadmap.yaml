- id: exp1146-grpo-reflection-reward-v3
  milestone: 2026.04.89
  deliverable: results/experiment_1146_grpo_reflection_reward_v3.json
  title: "GRPO Reflection Reward v3 — Energy-Delta Repair Signal, DualGPU MANDATORY"
  model: opus
  max_turns: 60
  estimated_wall_time_min: 55
  priority: high
  requires_gpu: true
  grace_period_s: 2400
  prior_failures:
    - experiment_id: exp1129-grpo-energy-prm-v2
      verdict: positive_improvement
      addressed_by: |
        exp1129 produced +8.51pp improvement but the evaluation budget hit at 47/50 questions.
        The advantage_stdev=0.125 is better than exp1118's 0.106 but still below the 0.15
        diversity target. exp1146 introduces a repair-grounded reward: r_reflect = E_before -
        E_after, where E_before is the energy of the original response and E_after is the energy
        of a guided-repair attempt. This is a new training signal that exp1129 did not use.
      retire_if_same_verdict: false
    - experiment_id: exp1118-grpo-energy-prm-v1
      verdict: training_wall_budget_hit
      addressed_by: |
        exp1118 hit the training budget at 42/50 questions. exp1146 extends the budget to 900s
        and adds the repair-grounded reward on top of exp1129's DRA+CPPO improvements.
      retire_if_same_verdict: false
    - experiment_id: exp1110-rlvr-ssd-integration-v2
      verdict: degenerate_corpus_all_zero
      addressed_by: |
        RLVR+SSD was retired after 3 consecutive negatives due to the binary reward structure.
        exp1146 uses GRPO's group-relative advantage (exp1129's approach, which IS positive)
        with an additional energy-delta component, not the RLVR+SSD architecture.
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    The Zenil alpha_t framework shows that self-distillation stability depends on the exogenous
    grounding signal. Carnot's alpha_t is 0.52 (exp1130) — above 0.5, meaning the verifier signal
    dominates random drift. But GRPO (exp1129) still uses ThinkPRM as the proxy reward, not the
    actual energy function.

    This experiment adds a REPAIR-GROUNDED reward that closes the FR-11 self-learning loop:
      r_total = r_thinkprm + w_reflect * r_reflect
    where:
      r_reflect = E_before - E_after
      E_before = energy of the original model response (before repair)
      E_after = energy of a quick repair attempt using Carnot's verifier feedback
      w_reflect = 0.3 (weight of reflection reward)

    The reflection reward creates a closed self-learning loop: the model learns to write
    responses that ARE easy to repair, not just ones that score well on ThinkPRM.

    CRITICAL: DualGPU is MANDATORY. If cuda_device_count < 2, write a blocked artifact.

    From exp1129:
    - model_used: unsloth/Qwen3.6-35B-A3B-GGUF
    - n_training_questions: 100
    - training_seconds: 360.237
    - improvement_over_baseline: 0.0851

    New parameters for v3:
    - n_training_questions: 100 (same)
    - training_budget_s: 900 (was 600)
    - group_size_n: 8
    - advantage_weight: 0.1
    - diversity_penalty: 0.05 (DRA-GRPO, from exp1129)
    - proxy_reuse_k: 3 (CPPO, from exp1129)
    - reflection_weight: 0.3 (NEW — energy-delta repair signal)
    - n_eval_questions: 50 (target; was 47/50 in exp1129)

    EXISTING CODE TO READ FIRST:
    - results/experiment_1129_grpo_energy_prm_v2.json (read full artifact for training details)
    - scripts/experiment_1129_grpo_energy_prm_v2.py (if exists, read the training loop)
    - python/carnot/pipeline/verify_repair.py (find repair loop and energy computation)
    - results/experiment_1130_zenil_alpha_t_post_retrain.json (alpha_t=0.52, for reporting)

    TASK:
    1. Verify DualGPU: assert torch.cuda.device_count() >= 2. If not, write blocked artifact.
    2. Load Qwen3.6-35B-A3B-GGUF. Confirm loads on GPU.
    3. Load ThinkPRM v2 (from exp1111 artifact path).
    4. Implement reflection reward r_reflect = E_before - E_after:
       a. For each GRPO completion, run Carnot's repair once (1 repair step, not full loop)
       b. Compute energy before and after the 1-step repair
       c. r_reflect = (E_before - E_after) / E_before if E_before > 0 else 0.0
       d. Clip to [-1, 1]
    5. Training loop (900s budget):
       - GSM8K questions 600-700 (avoid exp1129's 500-600 range)
       - N=8 completions per question
       - r_total = r_thinkprm + 0.3 * r_reflect
       - Diversity penalty (DRA-GRPO) applied
       - CPPO proxy reuse
    6. Evaluation (50 holdout questions, GSM8K 750-800):
       - baseline_fraction_correct
       - trained_fraction_correct
       - improvement_over_baseline
       Target: improvement_over_baseline >= 0.09 (above exp1129's 0.0851)

    CONCRETE STEPS:
    - python3 -c "import torch; print(f'GPUs: {torch.cuda.device_count()}'); [print(torch.cuda.get_device_name(i)) for i in range(torch.cuda.device_count())]"
    - python3 scripts/experiment_1146_grpo_reflection_reward_v3.py

