        artifact_field: asp_continuous_relaxation_ready_score
        op: '=='
        value: 1
    prior_failures:
      - experiment_id: exp6275-flagship-asp-constraint-verification-benchmark
        verdict: "complete_partial: test_exit_codes"
        addressed_by: "This offline task does not repeat full-output parsing or inference. It extracts only explicit atom evidence from provenance-clean raw rows and tests warm-start value against blank and random controls."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6286 identifies immutable provenance-clean raw rows from the flagged V541 benchmark. Exp6287 supplies an exact-vertex relaxation. This task tests a changed transport mechanism. It treats ordinary model text as partial positive, negative, or unknown atom evidence. It fails closed on contradictions and unsupported atoms. It does not ask the model to emit finite IDs, JSON, or a formal theory.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6286_v541_evidence_eligibility_ledger.json
      - {project_root}/results/experiment_6287_asp_continuous_relaxation.json
      - {project_root}/results/experiment_6275_flagship_asp_constraint_verification_benchmark.sealed_manifest.json
      - {project_root}/results/experiment_6275_flagship_asp_constraint_verification_benchmark.formal_sidecar.json
      - {project_root}/results/experiment_6275_flagship_asp_raw/
      - {project_root}/python/carnot/asp_energy.py
      - {project_root}/python/carnot/experiment_6275_flagship_asp_constraint_verification_benchmark.py
      - {project_root}/openspec/capabilities/constraint-verification/spec.md
      - {project_root}/openspec/capabilities/phase3-kona/spec.md

      TASK
      Implement a fail-closed partial atom evidence adapter. Replay only eligible immutable raw rows. Extract explicit positive and negative atoms from ordinary text. Mark all other atoms unknown. Reject contradictions, foreign atoms, and ambiguous negation. Measure evidence precision and coverage against the sealed exact sidecar. Compare evidence-warm continuous refinement and exact completion with blank and random starts under fixed budgets. Do not run an LLM.

