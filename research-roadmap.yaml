- id: exp1493-trigger-token-certificate-export-v1
  milestone: 2026.04.115
  deliverable: results/experiment_1493_trigger_token_certificate_export_v1.json
  title: "Trigger-Token Certificate Export v1"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 100
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1486-cctu-executable-constraint-microbenchmark
      verdict: executable_constraints_ready_but_generation_quality_gap
      addressed_by: "Exp1486 created validators and exposed low tool/final validity. This task changes the generation boundary by using trigger-token certificate export rather than another hand-authored benchmark."
      retire_if_same_verdict: false
    - experiment_id: exp1481-semantic-energy-feasibility-audit
      verdict: retired_semantic_energy_confounded_by_superficial_baseline
      addressed_by: "This task uses executable certificates and deterministic validators, not Semantic Energy/logit telemetry as a diagnostic."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp1486 produced a 20-case CCTU-style executable constraint benchmark with
    a perfect verifier catch rate but low tool-call and final-answer validity.
    The post-.114 literature sweep added "Thinking Before Constraining":
    free-form reasoning until a trigger token, then constrained structured
    certificate export. Use {project_root} as the project root and {date} as
    the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE; primary certificate model)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense; secondary certificate model)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE; secondary certificate model)
    Legacy small models are allowed only as CPU smoke-tests and must not be
    used for headline certificate results.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - results/experiment_1486_cctu_executable_constraint_microbenchmark.json
    - results/experiment_1482_beaver_lite_prefix_calibration_live.json
    - python/carnot/verify/
    - python/carnot/pipeline/
    - tests/python/

    TASK:
    Add a bounded trigger-token certificate export lane for CCTU-style cases:
    free-form solve, explicit trigger token, structured certificate, then
    deterministic validation. Compare it to an always-constrained baseline.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - live_sota_model_inference_used
    - trigger_certificate_ready
    - cctu_cases_attempted
    - cctu_cases_completed
    - certificate_parse_rate
    - certificate_validation_rate
    - always_constrained_parse_rate
    - always_constrained_validation_rate
    - verifier_false_accept_rate
    - certificate_manifest_path
    - models_used
    - gpu_probe
    - blockers
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1493_trigger_token_certificate_export_v1.json immediately with status="in_progress".
    2. Reuse the exp1486 CCTU cases and validators where possible; add only the minimum helper code needed for certificate formatting and parsing.
    3. Use cached_sota_pair() or the established local SOTA GGUF cache pattern from scripts/experiment_template.py.
    4. Run at least one mandated SOTA GGUF model for headline rows. If GPU/model loading fails, write a terminal artifact explaining the blocker instead of silently falling back to a legacy small model.
    5. For each case, collect free-form reasoning text, trigger token presence, structured certificate JSON, parser result, deterministic validator result, and false-accept status.
    6. Run an always-constrained baseline on the same cases or a clearly matched subset.
    7. Write results/cctu_trigger_certificates_1493.jsonl with one row per case/model/baseline.
    8. Run focused tests for any new certificate parser or validator glue.
    9. Set trigger_certificate_ready=true only if a live SOTA headline subset exists and parser/validator rates are reported.
    10. Write all required artifact fields with status="complete" or an honest terminal blocker.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1493_trigger_token_certificate_export_v1.json')); print(d.get('trigger_certificate_ready'), d.get('certificate_parse_rate'), d.get('certificate_validation_rate'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1494-constrainprompt-validator-compiler-audit
  milestone: 2026.04.115
  deliverable: results/experiment_1494_constrainprompt_validator_compiler_audit.json
  title: "ConstrainPrompt Validator Compiler Audit"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 75
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1486-cctu-executable-constraint-microbenchmark
      verdict: cctu_validators_hand_authored_only
      addressed_by: "This task changes the scope from hand-authored validators to prompt-derived validator skeletons with deterministic compile and false-accept accounting."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp1486 proved executable constraints are useful but hand-authored the
    validators. The post-.114 sweep added ConstrainPrompt: extracting
    code-verifiable constraints from prompt text. Carnot needs a bounded
    prompt-to-validator compiler audit before scaling CCTU coverage. Use
    {project_root} as the project root and {date} as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE; primary validator-skeleton model)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense; secondary validator-skeleton model)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE; secondary validator-skeleton model)
    Legacy small models are allowed only as CPU smoke-tests and must not be
    used for headline validator compiler results.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - results/experiment_1486_cctu_executable_constraint_microbenchmark.json
    - python/carnot/verify/
    - python/carnot/schemas/
    - tests/python/

    TASK:
    Prototype a bounded ConstrainPrompt-style prompt-to-validator compiler for
    30 CCTU-style prompts. The goal is not broad program synthesis; it is a
    deterministic manifest that reports validator compile rate, false accepts,
    and where human review is still required.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - live_sota_model_inference_used
    - validator_compiler_ready
    - prompts_attempted
    - validator_skeletons_generated
    - validators_compiled
    - validator_compile_rate
    - known_good_pass_rate
    - known_bad_reject_rate
    - verifier_false_accept_rate
    - manual_review_required_count
    - validator_manifest_path
    - models_used
    - gpu_probe
    - blockers
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1494_constrainprompt_validator_compiler_audit.json immediately with status="in_progress".
    2. Build a 30-prompt CCTU-style prompt set from exp1486 plus new arithmetic, schema, simple code, and graph/path cases.
    3. Use at least one mandated local SOTA GGUF model to propose constraint fields or validator skeletons. If model loading fails, record a terminal blocker.
    4. Keep generated validators sandboxed and deterministic. Prefer a small safe DSL or explicit Python functions with restricted inputs over arbitrary eval.
    5. Test each compiled validator against at least one known-good and one known-bad output.
    6. Record compile failures, manual-review markers, false accepts, and false rejects.
    7. Write results/constrainprompt_validator_manifest_1494.jsonl with one row per prompt.
    8. Run focused tests for any validator compiler/parser code.
    9. Set validator_compiler_ready=true only if compile and false-accept metrics are present and no arbitrary-code execution path is introduced.
    10. Write all required artifact fields with status="complete" or an honest terminal blocker.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1494_constrainprompt_validator_compiler_audit.json')); print(d.get('validator_compiler_ready'), d.get('validator_compile_rate'), d.get('verifier_false_accept_rate'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

