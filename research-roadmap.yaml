- id: exp1014-triple-integration-v5
  milestone: 2026.04.79
  deliverable: results/experiment_1014_triple_integration_v5.json
  title: "Triple Integration E2E v5 — SC-Energy + SpilledEnergy + ThinkPRM Cascade (Post Pre-Test Fix)"
  prompt: |
    CONTEXT:
    The full 3-tier cascade (ThinkPRM Tier 0a → SpilledEnergy Tier 0b → SC-Energy Tier 2 →
    Ising) has been attempted 4 times and blocked every time:
    - .75: deliverable_already_exists without fresh results
    - .76/.77: gate cascade from EnvPropagationGuard field mismatch
    - .78: pre-test "comparison failed" errors (Exp 1013 has now fixed this)

    SC-Energy is deployed as production Tier 2 (Exp 1001). The pre-test fix from Exp 1013
    (gate_schema_v79=True) means the test suite now passes. This experiment validates the full
    cascade end-to-end with fresh results and a {date} run_date.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py (full pipeline — ThinkPRM + SpilledEnergy + SC-Energy)
    - results/experiment_1001_sc_energy_tier2_v4.json (tier2_wired=True confirmed)
    - results/experiment_1013_preflight_v29.json (pre_test_fixed=True confirmed)
    - python/carnot/pipeline/think_probe.py (CarnotThinkProbe — Tier 0a)
    - python/carnot/verify/spilled_energy.py (SpilledEnergyDetector — Tier 0b)
    - python/carnot/verify/sc_energy.py or similar (SC-Energy Tier 2 — find the class)

    TASK:
    1. CONFIRM Exp 1013 fixed the pre-test: python3 -c "import json; d=json.load(open('results/experiment_1013_preflight_v29.json')); print('pre_test_fixed:', d.get('pre_test_fixed'))"
    2. IMPORT VerifyRepairPipeline and confirm all tiers are present:
       python3 -c "from python.carnot.pipeline.verify_repair import VerifyRepairPipeline; p=VerifyRepairPipeline(); print(dir(p))"
    3. RUN cascade on 50 synthetic GSM8K questions (CPU, no GPU needed):
       For each question, generate a synthetic response (use a deterministic Python function to
       produce a response with ~30% arithmetic errors for realistic violation rates).
       Run the full cascade: ThinkPRM → SpilledEnergy → SC-Energy → Ising.
       Measure:
       - tier0a_skip_rate: fraction passing ThinkPRM without reaching SpilledEnergy
       - tier0b_skip_rate: fraction passing SpilledEnergy without reaching SC-Energy
       - tier2_skip_rate: fraction passing SC-Energy without reaching Ising (MUST be > 0)
       - full_pipeline_skip_rate: fraction never reaching Ising
    4. MEASURE accuracy_delta_vs_ising_only: run same 50 questions through Ising-only,
       compare accuracy. Cascade must not regress.
    5. WRITE results/experiment_1014_triple_integration_v5.json (try/finally):
       - cascade_validated: bool (tier2_skip_rate > 0 AND accuracy_delta >= 0)
       - tier0a_skip_rate: float
       - tier0b_skip_rate: float
       - tier2_skip_rate: float (target > 0.05)
       - full_pipeline_skip_rate: float
       - accuracy_delta_vs_ising_only: float (must be >= -0.02)
       - run_date: "{date}"
       - honest_verdict: "cascade_validated" | "tier2_not_skipping" | "regression_detected"

    CONCRETE STEPS:
    - python3 -c "import json; d=json.load(open('results/experiment_1013_preflight_v29.json')); print('gate_schema_v79:', d.get('gate_schema_v79'))"
    - python3 -c "from python.carnot.pipeline.verify_repair import VerifyRepairPipeline; print('import ok')" 2>&1
    - grep -n "SCEnergy\|SpilledEnergy\|CarnotThinkProbe\|tier0a\|tier0b\|tier2" python/carnot/pipeline/verify_repair.py | head -30

    Run: python scripts/experiment_1014_triple_integration_v5.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

