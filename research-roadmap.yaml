    \   WHY we validate output (silent failure produces all-unused tokens with no error),\n\
    \   what the <unused8> token ID is (token_id=14 in Gemma4 tokenizer).\n\
    6. Write scripts/experiment_450_gemma4_fix.py:\n\
    \   a. apply_env_autofix() FIRST\n\
    \   b. ExperimentTimeoutWatchdog(450, timeout_minutes=30) as context manager\n\
    \   c. ExperimentTemplate(450, 'Gemma4 Tokenizer Fix', 'results/experiment_450_gemma4_fix.json')\n\
    \   d. Load 10 GSM8K questions from datasets or hardcoded sample\n\
    \   e. Attempt to instantiate GemmaTransformersLoader('google/gemma-4-E4B-it')\n\
    \   f. If GPU unavailable or model download fails: set status='gpu_required' and emit\n\
    \      diagnostic_only=True artifact explaining the fix is ready but needs GPU to verify\n\
    \   g. If GPU available: run 10 questions, count valid outputs (is_valid_output check)\n\
    \   h. Build artifact: schema='carnot.gemma_loader.v1'\n\
