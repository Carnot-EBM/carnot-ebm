milestone: 2026.06.397
milestone_title: "CLOSE THE LAST OPEN MOAT AXIS (cross-GENERATOR) + UNBLOCK THE §5 IN-GENERATION THESIS (a learned PARTIAL-STATE diffusion scorer) + HARDEN THE EFFICIENCY PARETO WIN. .396 gave a sharp honest scorecard: EFFICIENCY = a clean oracle-distinct PARETO WIN (energy verifier 0.654 vs Qwen3.6-35B LLM-judge 0.212, accuracy delta CI95 [0.308,0.577] excludes 0, ~50M× cheaper, exp4284) -- but the judge scored below random so it needs hardening; DiffusionGemma in-generation guidance = BLOCKED (exp4281 cannot_score_partial_states -- no learned verifier can score masked denoising canvases); cross-GENERATOR = STILL OPEN (exp4282 FLAGGED degenerate: wrong-majority-only pool + 4 candidates = trivially separable +1.0, measures pool degeneracy not transfer; the within-pool win exp4271 +0.40 STANDS); self-learning = powered static-is-the-ceiling but the tier-2 arm was a no-op bug (exp4283 FLAGGED tautology); ARC +1 to 21 levels (exp4285 ls20); paper_ready=True (FoVer 0.9131, G1-G4). .397 attacks the two hardest open questions (cross-GENERATOR transfer + does the verifier IMPROVE generation) plus hardens the one clean win. Oracle-distinct frontier (P0 2026-06-14): every verifier task verifier_is_oracle=false with a matched control, CI95-excl-0."
milestone_doc: openspec/change-proposals/research-roadmap-v397.md
milestone_overview: |
  .396 proved the verifier's SELECTOR value is efficiency-strong (a Pareto win vs a 35B LLM-judge at ~free cost)
  but left the two hardest open questions unanswered: (A) does the oracle-distinct selection win transfer to a
  construction-disjoint GENERATOR (the .396 ARC-GEN test was degenerate), and (B) can the verifier IMPROVE
  generation, not just rank it (blocked -- no learned verifier can score masked DiffusionGemma canvases). .397 is
  DEPTH on exactly those (north-star §1 Depth-Over-Breadth), in order of load-bearing-ness:

    PHASE 0 -- TRANSITION: exp4290 archive .396 -> activate .397; record the scorecard truthfully.

    PHASE A -- CLOSE THE CROSS-GENERATOR AXIS (THE HEADLINE; P0 oracle-distinct frontier):
      A1 (exp4291) rebuild a NON-degenerate ARC-GEN cross-generator pool (realistic candidate counts, NOT
        wrong-majority-only; vote@1 in (0,1); oracle ceiling < 1.0), train the set-encoder on train-generators,
        test beats-vote on HELD-OUT generators. Emit cross_generator_holds := (held-out delta>0 AND CI95-excl-0
        AND non-degenerate guards pass). verifier_is_oracle=false. Closes the single-partition critique on the
        .395 within-pool win -- the LAST open axis of the selection moat.

    PHASE B -- UNBLOCK THE §5 IN-GENERATION THESIS (harness-first; build the missing capability, then run gated):
      B1 (exp4292) BUILD + GATE a learned PARTIAL-STATE diffusion scorer (Prism 2602.01842 / Manta-LM 2605.14531)
        for DiffusionGemma masked canvases, with a LEAK audit (partial-state scoring must NOT read the final
        answer -> circular). Deliverable = a tested scorer + the leak verdict. Emit partial_state_scorer_built +
        partial_state_leak_free (BARE bools) + partial_state_auroc. verifier_is_oracle=false.
      B2 (exp4293, GATED on B1 leak-free build) DiffusionGemma energy-guided full run USING the partial-state
        scorer + matched no-Carnot-verifier controls (unguided / RFG 2509.25604 / EntRGi 2602.05000) + a
        guidance-dynamics diagnostic (2506.10971). Emit diffusiongemma_guidance_moat := (Carnot-guided - RFG > 0
        AND CI95-excl-0). verifier_is_oracle=false.

    PHASE C -- HARDEN THE EFFICIENCY HEADLINE (§5 efficiency; oracle-distinct; skeptic-proof):
      C1 (exp4294) replicate energy-verifier vs LLM-judge on cross-family ARC selection with a STRONGER judge
        prompt + a 2nd judge model (gemma-4-31B) -- rule out the weak-prompt critique (the .396 judge scored below
        random). Emit efficiency_pareto_holds := (energy accuracy within/above the best-prompted judge CI AND
        cost_ratio <= 0.1). verifier_is_oracle=false.

    PHASE D -- CONTINUOUS SELF-LEARNING (mandated; fix the .396 tier-2 no-op bug):
      D1 (exp4295) re-run with the Tier-2 constraint-memory arm FIXED + a Tier-2 RETRIEVAL-augmented
        selector-context arm (Decocted 2604.04373: retrieval-only context, NO weight mutation, NO LoRA). Emit
        online_adaptation_helps := (best-adaptive - static > 0 AND CI95-excl-0). verifier_is_oracle=false.

    PHASE E -- ARC NORTH STAR (mandated monotonic +1):
      E1 (exp4296) offline ARC +1 on a NEW game (total_levels >= 22; NOT ls20/wa30/sc25).

    PHASE F -- INFRA + HYGIENE + CAPSTONE:
      F0 (exp4297) INFRA safety net: add a DEGENERATE_SEPARATION check to scripts/adversarial_verify.py +
        a unit test (must now flag exp4282). F1 (exp4298) SOTA-ingestion -> .398. F2 (exp4299) registry/gaps
        hygiene + GAP-4 regression guard. F3 (exp4300) hardware continuity opportunistic. F4 (exp4301) capstone .397.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227) and the conductor stays stood-down. NO
  task may launch TRM training, run pkill/kill against train.py, or WRITE results/trm_runs/. Qwen is FORBIDDEN as
  the TRAINED base (Spurious-Rewards confound); Qwen GGUF as an off-policy judge is fine. Every verifier-value task
  MUST declare verifier_is_oracle honestly (Circularity Discipline): an EXECUTABLE-oracle win is execution_grounded
  (cheap, valid, NOT a moat); the moat is the LEARNED-energy result with a matched control, CI95-excl-0. NO
  autonomous edits to docs/index.html / README / paper prose. Online ARC play stays operator-gated (NO leaderboard
  submission). DiffusionGemma MUST use the llama.cpp PR binary, not a standard GGUF loader.

