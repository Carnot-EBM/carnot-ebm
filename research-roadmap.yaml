- id: exp2402-kinetic-langevin-v2
  title: 'Phase 3: Kinetic Langevin vs CASAL v2 (arXiv:2603.23397) — Codex Recovery Rerun'
  milestone: 2026.05.233
  deliverable: results/experiment_2402_kinetic_langevin.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2385-kinetic-langevin
    verdict: codex_cli_error_failed
    addressed_by: "exp2385 failed 3 times with Codex CLI error in .232. exp2393 repaired
      the Codex CLI infrastructure. Kinetic Langevin scope unchanged: implement underdamped
      Langevin splitting sampler and benchmark against CASAL on a small Ising problem."
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT: Kinetic Langevin (arXiv:2603.23397) uses underdamped (second-order) Langevin
    dynamics with momentum for constrained sampling. The splitting scheme decomposes the
    dynamics into friction, noise, and Hamiltonian components, enabling 2-4x faster mixing
    than overdamped (first-order) Langevin on constrained distributions.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/samplers/casal_sampler.py (CASAL baseline)
      {project_root}/python/carnot/samplers/projected_langevin.py (Projected-Langevin for reference)
      {project_root}/results/experiment_2355_projected_langevin.json (PL vs CASAL: +0.333 KL delta)

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. scipy importable: .venv/bin/python -c "import scipy; print(scipy.__version__)"
            If missing: .venv/bin/pip install scipy -q
         b. numpy importable: .venv/bin/python -c "import numpy; print(numpy.__version__)"
         c. CPU only — no GPU needed.

      1. Implement KineticLangevinSampler at python/carnot/samplers/kinetic_langevin.py:
         Underdamped Langevin with momentum vector p:
           dq = p dt
           dp = -gamma*p dt - grad_V(q) dt + sqrt(2*gamma*kT) dW
         Discretize via BAOAB splitting:
           B: p += -0.5*dt*grad_V(q)
           A: q += 0.5*dt*p
           O: p = alpha*p + sqrt(1-alpha^2)*xi, xi~N(0,1), alpha=exp(-gamma*dt)
           A: q += 0.5*dt*p
           B: p += -0.5*dt*grad_V(q)
         Parameters: gamma=1.0, kT=1.0, dt=0.01, n_steps=1000

      2. Benchmark on 4x4 ferromagnetic Ising (N=16) with 1000 samples:
         Compare KineticLangevin vs CASAL on KL(P_sampler || P_exact).
         kinetic_langevin_kl, casal_kl, kinetic_vs_casal_kl_delta.

      3. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/samplers/ -k "kinetic" -v --no-cov 2>&1 | tail -15

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required."
      - kinetic_langevin_validated:
          principle: "True if KineticLangevinSampler ran on real Ising problem."
      - kinetic_langevin_kl:
          principle: "KL divergence of KineticLangevin samples from exact distribution."
      - casal_kl:
          principle: "KL divergence of CASAL samples — baseline comparison."
      - kinetic_vs_casal_kl_delta:
          principle: "casal_kl - kinetic_langevin_kl. Positive = KineticLangevin better."
      - n_samples:
          principle: "Must be 1000. CLT minimum for KL estimation."
      - n_spins:
          principle: "Must be 16 (4x4 Ising)."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records scipy + numpy checks."

    ACCEPTANCE GATES:
      - condition: "kinetic_langevin_validated == true"
        principle: "Sampler must produce samples and KL estimate on real Ising problem."

