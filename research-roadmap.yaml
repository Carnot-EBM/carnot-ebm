  - id: exp4749-a1
    milestone: 2026.06.437
    title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; HEADLINE) -- REPLACE THE 0.12-ACCURATE FREE-FORM ENGINE WITH THE
      EXISTING STRUCTURED ProductWorldModel. The 2026-06-25 end-to-end measurement proved the free-form LLM engine
      induction is the binding wall: lp85''s L1 world model reproduced only 0.12 of observed transitions
      (world_model_accuracy_below_threshold) -- the model writes a placeholder engine. A structured engine with
      the EXACT (grid,action,data)->next_grid signature ALREADY EXISTS (ProductWorldModel.engine,
      arc_executable_world_model.py:427) fed by induce_programmatic_object_experts (:331). Build a load_engine
      adapter that returns (ProductWorldModel(induced experts).engine, goal) and wire it (env-gated
      CARNOT_ARC_STRUCTURED_ENGINE=1) into the live level_up_reinduction call site
      (arc_competition_agent.py:2494, in place of e3.load_engine). NON-DEGENERACY GATE INLINE: PROVE the structured
      engine actually changes cells (engine output differs from the input grid on >0 actions) BEFORE any accuracy
      claim. WIN: the structured engine''s held-out transition accuracy on >=1 real game (lp85/sc25/m0r0) beats
      the free-form 0.12 by a wide margin (target >=0.5) AND the L2 reinduction runs on it without proposer_failed
      OR a multi-level probe reaches L2 offline-reproduced. verifier_is_oracle:false. live_agent_self_discovery.
      retire_if_same_verdict.'
    priority: critical
    track: arc-north-star
    max_turns: 180
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4749_structured_engine_vs_freeform.json
    operator_override: '2026-06-25 end-to-end measurement (proto_l2_measure_fixstack v2, commit 611183119) +
      operator pre-stage directive "action-effect model for .437": the free-form engine''s 0.12 held-out accuracy
      is the binding wall; wiring the EXISTING structured ProductWorldModel as the engine is the evidence-based
      lever. False-positive scope-match vs prior engine-induction tasks -- this is a NEW wiring of existing
      structured scaffolding, not a free-form-engine rerun. Routes to codex (ARC sprint).'
    prior_failures:
      - experiment_id: proto_l2_measure_fixstack-v2-freeform-engine
        verdict: 'complete: l2_no_bank_freeform_engine_accuracy_0.12_model_capability_wall'
        addressed_by: 'the 2026-06-25 end-to-end measurement showed the FREE-FORM LLM engine induction
          (e3.load_engine''s codex-written engine) reproduces only 0.12 of lp85 transitions -- a model-capability
          wall that prompt-engineering (truncation fix, goal-repair, split-fallback all shipped) does NOT clear.
          THIS task is STRUCTURALLY DIFFERENT: it does NOT induce a free-form engine at all -- it wires the EXISTING
          structured ProductWorldModel (composed programmatic object experts, held-out-trust>=0.75) as the engine,
          a fundamentally different (program-synthesis, not free-form-LLM) inducer. If the structured engine ALSO
          fails to beat 0.12 OR is degenerate (never changes a cell), the lever retires with the markers emitted.'
        retire_if_same_verdict: true
    prompt: |
      CONTEXT ({date}, ARC sprint HEADLINE). The 2026-06-25 end-to-end measurement (results/proto_l2_measure_fixstack_v2_with_split.json)
      proved that even with the L2 truncation fix + goal-repair + separate-focused-goal split all shipped, lp85 L2
      does not bank because the FREE-FORM LLM engine is only 0.12 held-out accurate -- a model-capability wall. The
      structured fix already exists: ProductWorldModel.engine composes trusted ProgrammaticExpert factors and has
      the exact dynamics signature; induce_programmatic_object_experts builds + held-out-scores those experts.

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_executable_world_model.py (ProductWorldModel.engine:427; induce_programmatic_object_experts:331; ProgrammaticExpert.applies/predict:101; e3.load_engine the free-form path: def at ~:721)
        - {project_root}/python/carnot/agentic/arc_llm_reinduction.py (execute_bounded_llm_reinduction:631; load_engine param ~:639; WorldModelCandidate.engine signature:59; select_trusted_world_model call site:729 [def in arc_world_model_trust_energy.py]; min_heldout_accuracy threshold param ~:642 + accept-compare ~:752)
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (the level_up_reinduction call site:2487-2505 -- load_engine=e3.load_engine:2494, min_heldout_accuracy=1.0:2497)
        - {project_root}/docs/research-notes/l2-fixstack-measurement-2026-06-25.md (the end-to-end finding)

      TASK: build a load_engine-shaped adapter `structured_load_engine(game)->(engine, goal)` that induces
      programmatic object experts (induce_programmatic_object_experts), composes them into a ProductWorldModel, and
      returns ProductWorldModel.engine as the dynamics engine (goal: reuse the existing is_level_complete provider
      / structural goal). Wire it env-gated (CARNOT_ARC_STRUCTURED_ENGINE=1) into the level_up_reinduction call
      site so it REPLACES e3.load_engine. Measure held-out transition accuracy vs the free-form engine on the same
      transitions. Keep it live-path-reachable (arc_orphan_solver_lint).

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. Qwen3.5-9B-MTP GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-MTP-GGUF/snapshots/*/ *.gguf` non-empty.
           b. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
           c. `.venv/bin/python -c "from carnot.agentic.arc_executable_world_model import ProductWorldModel, induce_programmatic_object_experts; print('ok')"` exits 0.
           Missing -> honest_verdict blocked_<resource>, EXIT.
        1. Build structured_load_engine; assert ProductWorldModel.engine has the (grid,action,data)->ndarray signature and the NON-DEGENERACY gate (engine changes >0 cells on >=1 action on a real frame).
        2. Wire it env-gated into the level_up_reinduction call site (env OFF by default).
        3. A/B: run the held-out transition accuracy of the structured engine vs the free-form engine on >=1 real game; if structured beats 0.12 by a wide margin, run the L2 reinduction with it and check it does NOT proposer_fail and (if it reaches L2) reproduce offline.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix complete:/success:/passed:/shipped:; a wide structured-vs-freeform accuracy win OR an L2 bank is success_, an honest no-improvement null is complete_."
        inference_substrate:
          principle: "live_llm_inference (the experts are induced via the live proposer + scored on real transitions); 60s duration floor."
        preconditions_checked:
          principle: "records the GGUF/arcade/import checks so a silent-missing-resource run cannot fabricate an accuracy number."
        structured_engine_non_degenerate:
          principle: "the structured engine must CHANGE >0 cells on >=1 action before any accuracy claim -- guards the dead-engine (identity) failure the .428-.433 audit found."
        freeform_heldout_accuracy:
          principle: "the baseline 0.12 the structured engine must beat -- the explicit comparator, not a moving goalpost."
        structured_heldout_accuracy:
          principle: "the structured engine's held-out transition accuracy -- the load-bearing measurement (target >=0.5)."
        l2_proposer_failed:
          principle: "did the L2 reinduction still proposer_fail with the structured engine -- the direct test of whether the engine wall is cleared."
        offline_reproduced:
          principle: "true only if a NEW level is independently re-derived by arc_solver_kit.reproduce -- the only real level-up signal."
        solve_provenance:
          principle: "live_agent_self_discovery if the live agent advanced via its own attempts; development_proxy for the offline twin -- never over-credit."
        verifier_is_oracle:
          principle: "false -- the held-out accuracy is execution-grounded against observed transitions, not a learned-verifier moat claim."

      Run: cd {project_root} && CARNOT_ARC_STRUCTURED_ENGINE=1 .venv/bin/python python/carnot/experiment_4749_structured_engine_vs_freeform.py
      Do NOT push. Submission is operator-only.

  - id: exp4750-a2
