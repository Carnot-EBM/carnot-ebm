    - results/experiment_447_kaem_exact_sampling.json — KAEM baseline (mean_speedup=1.29x)\n\
    - scripts/experiment_template.py — ExperimentTemplate\n\nTASK: Implement LowRankKAEMEnergy.\n\
    1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-SAMPLE-019 (LowRankKAEMEnergy: project to top-k singular vectors\
    \ before spline computation), REQ-SAMPLE-020 (rank auto-selection: choose\
    \ minimum k s.t. explained variance > 0.90), SCENARIO-SAMPLE-033/034/035\
    \ to training-inference/spec.md.\n\
    3. Write tests FIRST (100% coverage) for python/carnot/models/lowrank_kaem.py:\n\
    \   - LowRankProjector(data: jnp.ndarray, k: int = 11):\n\
    \     .project(x: jnp.ndarray) -> jnp.ndarray: project x into top-k SVD space\n\
    \     .explained_variance_ratio(k: int) -> float: fraction of variance in top-k\n\
    \     .auto_k(threshold=0.90) -> int: minimum k where explained_variance > threshold\n\
    \   - LowRankKAEMEnergy(n_vars, k: int = 11, auto_k: bool = False):\n\
    \     extends KAEMEnergy but projects input to k dimensions before spline computation\n\
