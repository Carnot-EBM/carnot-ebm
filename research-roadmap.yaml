  - id: exp2758
    milestone: "2026.05.261"
    deliverable: "results/experiment_2758_weak_strong_policy_fix_v2.json"
    title: "Weak-Strong Policy Fix v2: Diagnose Inverted Thresholds + Fix Calibration Orientation"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 30
    track: pipeline

    prior_failures:
      - experiment_id: exp2745-weak-strong-verification-policy
        verdict: "complete: weak_strong_policy_added=true; policy_viable=true; policy_savings_pct=82%; false_negative_rate=0.0; t_low=0.184; t_high=0.107"
        addressed_by: "exp2745 (.260) produced inverted thresholds (t_low=0.184 > t_high=0.107). Per two-threshold theory, t_low < t_high is required: below t_low = accept; above t_high = full verification; between = partial. The inversion means ALL examples are classified as 'uncertain' by the threshold comparison, then the sorting produces 82% savings with 0% FNR which is IMPLAUSIBLE_PERFECT. Root cause: Platt calibration orientation bug — the calibrator learned the WRONG direction (high energy = correct rather than high energy = incorrect). This exp2758 fixes the orientation by ensuring the calibration target is P(incorrect | energy) not P(correct | energy). Different: exp2745 had orientation bug; exp2758 adds explicit orientation check."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      exp2745 (.260): t_low=0.184 > t_high=0.107 (INVERTED). Policy_savings_pct=82%, FNR=0.0
      — both are suspicious (IMPLAUSIBLE_PERFECT pattern).

      Root cause: in Platt calibration, the logistic sigmoid maps a score to P(class=1). If the
      "positive class" (class=1) is defined as CORRECT (instead of INCORRECT), then:
      - High energy → high P(correct) → low "risk" → threshold maps high-energy to "accept"
      - Low energy → low P(correct) → high "risk" → threshold maps low-energy to "full verify"
      This is backwards: high energy should mean HIGH risk (incorrect), not low risk.

      Fix: set y_correct = 0 (incorrect is class=1) in the calibration fitting step, so Platt
      calibration maps high energy → high P(incorrect) → high routing score → escalate.
      Alternative fix: use isotonic regression with explicit monotone_increasing=True
      (energy increases → correctness probability decreases).

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (WeakStrongRouter from exp2745)
      - results/experiment_2745_weak_strong_verification_policy.json (t_low, t_high values)
      - data/fover_corpus.jsonl (FoVer corpus)

      TASK: Fix calibration orientation. Verify t_low < t_high after fix. Re-evaluate routing.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `ls python/carnot/pipeline/verify_repair.py && echo exists || echo missing`
            Record: verify_repair_exists (bool).
            If false: write honest_verdict 'blocked_verify_repair_missing' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Read WeakStrongRouter from verify_repair.py. Identify the calibration fitting code.
         Record: calibration_method_found (str), orientation_bug_confirmed (bool).

      2. Fix calibration orientation:
         OPTION A: Change labels from y=1 for correct to y=1 for incorrect:
           # Before: y = [1 if example.is_correct else 0 for example in examples]
           # After:  y = [0 if example.is_correct else 1 for example in examples]
         OPTION B: Use isotonic regression with explicit direction:
           from sklearn.isotonic import IsotonicRegression
           ir = IsotonicRegression(increasing=False)  # energy increases → correctness decreases
           ir.fit(energy_scores, correct_labels)
         Record: fix_method (str — 'label_inversion' or 'isotonic_monotone').

      3. Re-calibrate thresholds with fixed orientation (random_seed=42, 80/20 split):
         t_low_fixed, t_high_fixed = calibrate_thresholds(energy_scores_train, labels_train, fix_method)
         thresholds_correct = (t_low_fixed < t_high_fixed)
         Record: t_low_fixed (float), t_high_fixed (float), thresholds_correct (bool).

      4. Re-evaluate policy with fixed thresholds (N=100 examples, random_seed=42):
         For each: route based on fixed t_low_fixed and t_high_fixed.
         n_accepted = examples with energy < t_low_fixed (low risk — skip full verification)
         n_full = examples with energy > t_high_fixed (high risk — full ensemble)
         n_partial = examples in between
         policy_savings_pct_v2 = (n_accepted + n_partial * 0.5) / 100 * 100
         false_negative_rate_v2 = accepted incorrects / n_accepted
         policy_viable_v2 = (policy_savings_pct_v2 >= 20.0 AND false_negative_rate_v2 <= 0.10
                              AND thresholds_correct)
         Record: n_accepted, n_partial, n_full, policy_savings_pct_v2 (float),
         false_negative_rate_v2 (float), policy_viable_v2 (bool).

      5. Write results/experiment_2758_weak_strong_policy_fix_v2.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - thresholds_correct: bool
        principle: "PRIMARY GATE: True if t_low_fixed < t_high_fixed (not inverted)."
      - policy_viable_v2: bool
        principle: "Secondary gate: routing is useful (savings >= 20%) AND safe (FNR <= 10%)."
      - t_low_fixed: float
        principle: "Fixed accept-threshold: must be < t_high_fixed for policy to work correctly."
      - t_high_fixed: float
        principle: "Fixed escalate-threshold: must be > t_low_fixed."
      - policy_savings_pct_v2: float
        principle: "Post-fix routing savings: expected 20-60% (not 82% which was adversarial)."
      - false_negative_rate_v2: float
        principle: "Safety metric: expected > 0.0 (was suspiciously 0.0 in exp2745)."
      - orientation_bug_confirmed: bool
        principle: "Confirms the Platt calibration orientation was the root cause."
      - fix_method: str
        principle: "Names the fix applied — cited in paper-v6 routing methods."
      - random_seed: int — 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Code read + calibration fix + re-evaluation: expected 5-20s."
      - preconditions_checked: list of {{resource, available, check}}
        principle: "Anti-fabrication: records verify_repair module + FoVer corpus."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2759
    milestone: "2026.05.261"
    deliverable: "results/experiment_2759_differentiable_conformal_calibration.json"
    title: "Differentiable Conformal Training Tier 0y (arXiv:2604.20098): End-to-End Calibration for Tier 0e EORM"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 40
    track: verifier

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .261 — no prior failures for this specific scope.

      arXiv:2604.20098 "Differentiable Conformal Training for LLM Reasoning Factuality"
      (Hittesdorf, Salzetta, Cheng, Apr 2026):
      Unlike post-hoc Platt calibration or isotonic regression, differentiable conformal
      training learns the calibration module jointly with the energy predictor. The calibration
      loss is derived from conformal prediction theory:
        L_conformal = E[max(0, score_incorrect - score_correct + margin)]
      This makes the calibration differentiable and optimizable with gradient descent.

      Carnot context: Tier 0e EORM (exp2663/2716) uses TF-IDF features as a proxy for the
      55M-param energy model. The static Platt calibration post-training (exp2718) achieved
      ECE=0.0087. Differentiable conformal training could improve ECE further by jointly
      training the TF-IDF feature weights + logistic calibration head end-to-end.

      Implementation approach (lightweight, no deep neural network required):
      - TF-IDF features are differentiable via sklearn → torch bridge
      - Calibration head = single linear layer (same as Platt calibration but trained end-to-end)
      - Loss = conformal margin loss on FoVer (correct, incorrect) pairs

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/tier0e_eorm.py (EORM from exp2663/2716 — TF-IDF energy model)
      - python/carnot/verify/tier0f_semantic_calibration.py (Tier 0f calibration from exp2716)
      - data/fover_corpus.jsonl (FoVer corpus for training)

      TASK: Implement differentiable conformal training for Tier 0e EORM calibration.
      Measure ECE improvement over static Platt calibration baseline.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; import sys; sys.path.insert(0,'python'); import carnot.verify.tier0e_eorm"`
            Record: tier0e_importable (bool).
            If false: write honest_verdict 'blocked_tier0e_module_missing' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            Record: fover_corpus_lines (int).
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         c. `.venv/bin/python -c "import numpy; import sklearn.linear_model; print('ok')"`
            Record: sklearn_numpy_available (bool).
         Record: preconditions_checked.

      1. Build FoVer (correct, incorrect) pairs for conformal training:
         From FoVer corpus, extract (correct_answer, incorrect_answer) pairs for the same question.
         n_pairs = count of valid pairs.
         Record: n_pairs (int).
         If n_pairs < 20: write honest_verdict 'blocked_insufficient_conformal_pairs' and exit.

      2. Compute TF-IDF features for all answers (same feature extraction as Tier 0e):
         vectorizer = TfidfVectorizer(max_features=1000, analyzer='char_wb', ngram_range=(3,5))
         X = vectorizer.fit_transform([correct_answer, incorrect_answer, ... for all pairs])
         Record: n_features (int), vectorizer_fitted (bool).

      3. Implement differentiable conformal calibration (numpy-based gradient descent):
         Initialize: w = np.zeros(n_features), b = 0.0  (linear calibration head)
         For each training step (n_steps=100):
           For each (correct, incorrect) pair:
             score_correct = X_correct @ w + b
             score_incorrect = X_incorrect @ w + b
             conformal_loss = max(0, score_incorrect - score_correct + 0.1)  # margin=0.1
           Gradient: dL/dw = X_incorrect.T @ grad_correct_pairs - X_correct.T @ grad_correct_pairs
           w -= learning_rate * dL/dw; b -= learning_rate * dL/db
         Record: training_loss_final (float), training_converged (bool = loss decreasing).

      4. Evaluate calibration quality:
         On held-out test set (20% of FoVer, random_seed=42):
           predictions = X_test @ w + b
           predicted_probs = sigmoid(predictions)
           # ECE (Expected Calibration Error) in 10 bins
           from sklearn.calibration import calibration_curve
           prob_true, prob_pred = calibration_curve(y_test, predicted_probs, n_bins=10)
           tier0y_ece = np.mean(np.abs(prob_true - prob_pred))
           tier0y_auroc = roc_auc_score(y_test, predictions)
         baseline_ece = 0.0087  # from exp2718 Platt calibration
         ece_improvement = baseline_ece - tier0y_ece
         tier0y_viable = (tier0y_ece < 0.01 AND tier0y_auroc >= 0.70)
         Record: tier0y_ece (float), tier0y_auroc (float), ece_improvement (float),
         tier0y_viable (bool).

      5. Save calibration weights as Tier 0y module:
         Create python/carnot/verify/tier0y_conformal_calibration.py with:
         class ConformalCalibrationVerifier that wraps (vectorizer, w, b) and exposes
         compute_energy(question, response) -> float (energy score).
         Update __init__.py to export it.
         Record: tier0y_module_created (bool).

      6. Write results/experiment_2759_differentiable_conformal_calibration.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - tier0y_viable: bool
        principle: "Gate: True if tier0y_ece < 0.01 AND tier0y_auroc >= 0.70."
      - tier0y_ece: float
        principle: "Calibration quality: lower is better (baseline is 0.0087 from exp2718)."
      - ece_improvement: float
        principle: "ECE improvement over Platt calibration baseline: positive = better calibration."
      - tier0y_auroc: float
        principle: "Discrimination accuracy of conformal calibration head."
      - training_converged: bool
        principle: "Confirms gradient descent did not diverge (loss decreasing)."
      - tier0y_module_created: bool
        principle: "Tier 0y module exists in python/carnot/verify/ for ensemble v12 candidate."
      - n_pairs: int
        principle: "Dataset scale: confirms FoVer pairs extraction worked."
      - random_seed: int — 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Feature extraction + gradient descent (100 steps) + eval: expected 5-30s."
      - preconditions_checked: list of {{resource, available, check}}
        principle: "Anti-fabrication: records tier0e import + FoVer corpus + sklearn."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


