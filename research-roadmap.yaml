milestone: 2026.06.417
milestone_title: 'ACTION EFFICIENCY -- the ARC live wall (score = min(human/agent,1)^2; the explorer
  uses ~7760 actions for ~21-action solutions -> ~0.08). .416 closed the RANKING era: value_weight,
  frame-change predictor, and energy-augmented ranking ALL returned honest NULLs because the explorer
  still EXPANDS every salient candidate per node. The lesson: PRUNE don''t rank, and don''t expand on
  easy frames. .417 drives median actions-to-first-levelup DOWN off the 7760 baseline four ways -- a
  WORKING (self-supervised, offline-arcade) frame-change predictor that PRUNES no-ops (A1), a human-
  imitation action prior (A2), an ACT/PonderNet adaptive per-step budget (A3, LoopWM citable), and
  best-first over the now-cheap lazy value head (A4, .416 B2 232x) -- then WIRES the winners into the
  submitted agent + re-measures the 8-game gate (A6). Plus a level-up deepen (A5, guarantee). Reserved:
  timing-detector repair (overdue infra) + metric-harness canonicalization (infra), hardware continuity,
  action-efficiency SOTA ingestion, capstone. ALL experiments codex/gpt-5.5; planner/retro stay Claude
  Opus 4.8. Metric = median actions-to-solve (baseline 7760), NOT reproducible_total_levels. NO
  leaderboard submission in-loop (operator-only).'
milestone_doc: openspec/change-proposals/research-roadmap-v417.md
milestone_overview: '.414/.415/.416 proved the wall is action efficiency: 3 score-levers nulled and 3
  cascade fixes restored speed+solve-rate but left median actions flat at ~7760. The score multiplies
  by (human/agent)^2, so fewer actions IS the score. .417 attacks the explorer''s EXPANSION strategy
  (architectural), not config (exhausted). Every ARC task is measured by median actions-to-first-levelup
  on scripts/kaggle/arc_local_submission_gate.py (baseline 7760) at equal-or-better solve-rate, with a
  positive control + FALSE_NEGATIVE_RISK null guard. The .416 B2 lazy value-eval (232x) unblocks A4; the
  full human-replay corpus + the self-supervised offline-arcade corpus unblock A1/A2.'
