      addressed_by: "This task runs after exp1378 completes. If exp1378 sets publication_hold_state=lift_recommended, the audit updates the paper for submission. If hold remains active, audit documents what specific paper changes are needed to lift it."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Milestone .106 produced terminal positive evidence for all three primary
    publication hold blockers. This task updates the paper (docs/paper/main.tex
    or equivalent) to incorporate .106 results: (1) certificate v8 parse_rate=1.0
    via tag-first CRANE prefix injection, (2) full semantic validation + MCS
    repair + scheduler chain operational, (3) headline self-learning via primary
    semantic verified path (fresh_verified_sample_count=4), (4) GS-KAN formal
    energy bound verified via MILP. Also adds the DiffuTruth complementary
    energy signal (AUROC=0.867, KAN correlation=0.961) and Eidoku CSP viability
    (feasibility_rate=0.740). Prior paper integrity audit from earlier milestones
    (exp1205 and relatives) identified 5 critical issues. This audit verifies
    whether those 5 issues are resolved with .106 evidence. Use {project_root} as
    the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - results/experiment_1378_publication_hold_v16_claim_boundary.json
    - docs/paper/main.tex (or docs/main.tex — find the correct path)
    - docs/position-paper-outline.md (if exists)
    - results/experiment_1366_certificate_v8_tag_first_prefix_injection_crane.json
    - results/experiment_1367_diffutruth_energy_of_falsehood_probe.json
    - results/experiment_1369_semantic_validator_v2_nsvif_z3_constraints.json
    - results/experiment_1372_optimal_kan_pwa_formal_verification.json
    - results/experiment_1374_continuous_self_learning_v3_verifier_selected_or_csp_fallback.json
