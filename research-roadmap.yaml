        verdict: "complete: DCCD repair replication did not clear promotion gates; pass@1_delta=-0.2, syntax_failure_rate_delta=0.30000000000000004, false_accept_delta=-0.05"
        addressed_by: "The failed replication is converted into a diagnostic protocol that directly targets schema/syntax regression and pass-rate damage."
