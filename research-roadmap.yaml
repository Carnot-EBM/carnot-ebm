  - id: exp6406-clean-v550-factor-evidence-boundary
    milestone: "2026.08.551"
    deliverable: results/experiment_6406_clean_v550_factor_evidence_boundary.json
    title: "Clean V550-only factor evidence boundary and claim ledger"
    priority: critical
    track: safety
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 75
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6399-capability-learning-safety-audit
        verdict: "complete_null: V550 audit preserved narrow licenses and blocked public general factor utility promotion"
        addressed_by: "This diagnostic changes the evidence boundary: it registers only Exp6394-Exp6399 and Exp6403 terminal receipts, excludes the already flagged Exp6385 input from clean eligibility, and creates no new utility evidence."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6394 through Exp6398 produced clean internal factor evidence. Exp6399's attack groups failed closed, but its public readiness stayed zero because the audit registration included Exp6385, which the conductor had already quarantined. Exp6403 therefore preserved public ineligibility. V551 needs an immutable, V550-only evidence boundary before new powered replication. This task cannot repair Exp6385, rerun Exp6399, or create a public claim. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6394_model_family_factor_harness_freeze.json through {project_root}/results/experiment_6399_capability_learning_safety_audit.json
