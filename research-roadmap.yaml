- id: exp1232-verifier-joint-orthogonality-audit
  milestone: 2026.04.96
  deliverable: results/experiment_1232_verifier_joint_orthogonality_audit.json
  title: "Verifier Joint Orthogonality Audit — 6x6 P(V_i|V_j) Matrix on k=6 Production Ensemble"
  agent_type: claude
  model: opus
  max_turns: 60
  estimated_wall_time_min: 50
  priority: critical
  requires_gpu: false
  requires_claude: true
  prompt: |
    CONTEXT:
    MANDATORY per ops/known-issues.md (.96 pickup). exp1224 (adversarial probe, .95) empirically
    demonstrated Spera Theorem 9.2 on Carnot's k=3 in-situ ensemble: Attack 2 (pairwise verifier
    correlation exploitation) succeeded with P(V_i|V_j)=1.000 across ALL pairs — effective ensemble
    size collapsed from k=3 to k=1. The root cause: snap_to_action quadrant-anchor decoder
    structurally guaranteed V0 (in_bounds) and V2 (no_duplicate_cells) for ALL inputs.

    The k=6 PRODUCTION ensemble has the central novelty claim for paper-v6: "unprecedented scale
    of formal distinctness." If production verifiers are also correlated, the headline claim weakens.
    This must be measured BEFORE paper-v6 submits.

    k=6 production ensemble:
    V1: Z3MathVerifier (Tier 3, logic grounding)
    V2: ASTStructureVerifier (Tier 2.5, structural)
    V3: SemanticConsistencyVerifier (Tier 2.7, causal)
    V4: ThinkPRMv2 (Tier 0a, pre-trained PRM)
    V5: SOSKANEnergyV3 4-bit (Tier 1, energy)
    V6: SemEnergyProbe (Tier 0c, logit-space)

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write to results/experiment_1232_verifier_joint_orthogonality_audit.json:
    {{
      "experiment": "1232_verifier_joint_orthogonality_audit",
      "status": "in_progress",
      "pairwise_correlation_matrix_measured": false,
      "k_eff": null,
      "honest_verdict": "in_progress"
    }}

    EXISTING CODE TO READ FIRST:
    - python/carnot/verify/pipeline.py (VerifyRepairPipeline, ensemble config)
    - python/carnot/verify/and_composition.py (k=5 AND-compose, verifier list)
    - python/carnot/models/ising.py (SOSKANEnergyV3 or energy computation)
    - results/experiment_1128_soskan_k5_fix.json (r_corr measurement precedent)
    - results/experiment_1224_phase5c_adversarial_probe.json (exp1224 adversarial probe method)
    - ops/known-issues.md lines 200-265 (MANDATORY .96 pickup specification)

    TASK:
    1. Write skeleton artifact (STEP 0).

    2. LOAD FoVer test corpus (held-out, NOT training distribution):
       - Use python/carnot/data/fover.py or equivalent loader
       - Target: 200 test samples from FoVer that weren't in training data
       - If full test split unavailable, use a diverse 200-sample bootstrap

    3. RUN ALL 6 VERIFIERS on each test sample:
       For each sample s in test_corpus:
         for each verifier V_i in [Z3Math, AST, SemanticConsistency, ThinkPRM, SOSKAN, SemEnergy]:
           accept[i][s] = V_i.verify(s.response, s.context)  # True=pass, False=fail

    4. COMPUTE 6x6 CONDITIONAL ACCEPTANCE MATRIX P(V_i|V_j):
       For each pair (i, j):
         P(V_i | V_j) = sum(accept[i][s] AND accept[j][s]) / sum(accept[j][s])
         (fraction of V_j-accepted samples that V_i also accepts)
       Diagonal: P(V_i | V_i) = 1.0 (trivially)
       Flag any off-diagonal entry > 0.7 per Spera Theorem 9.2 threshold

    5. COMPUTE k_eff:
       k_eff = count of verifiers V_i such that:
         for all j != i: P(V_i | V_j) < 0.7  (V_i is genuinely independent of all others)
       Report k_eff and list of fully-independent verifiers

    6. FOR EACH FLAGGED PAIR with P(V_i|V_j) > 0.7:
       Diagnose WHY correlation exists:
       - "Shared acceptance region due to similar semantic scope"
       - "Structural guarantees from upstream decode/generation"
       - "Training data bias (both verifiers see same examples)"
       Propose replacement candidate from known available verifiers or new verifier idea

    7. GENERATE HEATMAP DATA for paper-v6 figure:
       Write correlation_matrix_6x6 as a 2D list in the artifact
       Write verifier_labels_for_figure list

    8. Update artifact with final results.

    CONCRETE STEPS:
    - python3 -c "import json; d={{'experiment':'1232_verifier_joint_orthogonality_audit','status':'in_progress','pairwise_correlation_matrix_measured':False,'k_eff':None,'honest_verdict':'in_progress'}}; open('results/experiment_1232_verifier_joint_orthogonality_audit.json','w').write(json.dumps(d,indent=2))" 2>&1
    - python3 -c "from carnot.verify.pipeline import VerifyRepairPipeline; p=VerifyRepairPipeline(); print('verifiers:', [type(v).__name__ for v in p.verifiers])" 2>&1
    - python3 -c "from carnot.data.fover import FoVerDataset; ds=FoVerDataset(); print('n_samples:', len(ds))" 2>&1
    - [Load 200 held-out test samples]
    - [Run all 6 verifiers, compute 6x6 conditional acceptance matrix]
    - [Compute k_eff, flag correlated pairs, propose replacements]
    - [Update artifact with matrix, k_eff, flags, proposals]

    REQUIRED ARTIFACT FIELDS:
    - n_test_samples: int (samples used for measurement, min 100)
    - correlation_matrix_6x6: list[list[float]] (6x6 P(V_i|V_j) values)
    - verifier_labels: list[str] (6 verifier names for heatmap)
    - k_eff: int (count of structurally independent verifiers)
    - correlated_pairs: list[dict] (pairs with P>0.7: {{v_i, v_j, correlation, diagnosis, proposed_replacement}})
    - pairwise_correlation_matrix_measured: bool (true)
    - paper_v6_honest_k: str (what paper-v6 should claim: e.g. "k_eff=5 of k=6")
    - honest_verdict: "orthogonality_measured_k_eff_6" | "orthogonality_measured_k_eff_partial" | "orthogonality_measured_revision_needed" | "blocked"

    Run: python3 -c "import json; d=json.load(open('results/experiment_1232_verifier_joint_orthogonality_audit.json')); print('k_eff:', d.get('k_eff'), '| matrix_measured:', d.get('pairwise_correlation_matrix_measured'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

