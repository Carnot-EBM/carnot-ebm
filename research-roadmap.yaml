       - Gate 1: energy decreases by >= 30% over training
       - Gate 2: no representation drift (latent variance stable)
       - Gate 3: no autocatalytic spiral (energy oscillation < 5%)
       - Gate 4: no null-space excavation (latent rank > 0.5 * 128)
       - Gate 5: no catastrophic forgetting (oracle accuracy unchanged)

    5. MEASURE 3 PRODUCTION-SCALE-ONLY GATES:
       - Gate 6 (mode collapse): conditional output entropy H(z|query) > threshold
         threshold = 0.5 * log(2^128) / 128 = min entropy floor at d=128
         Measure: empirical entropy of z samples over 100 random queries
       - Gate 7 (MCMC mixing): Gibbs chain autocorrelation for first 100 samples
         acf_1 = autocorrelation at lag 1 (should be < 0.9 for good mixing)
         Also: L2(positive_z, negative_z) distance should be > 1.0 at d=128 scale
       - Gate 8 (substrate shift): L∞(z) saturation — fraction of latent dims at |z_i| > 0.95
         threshold: < 5% of dims should saturate (saturation → loss of numerical precision)
         Also: histogram modality — check if z distribution is unimodal vs multimodal

    6. Also include PPSEBM-style replay buffer (arXiv 2512.15658):
       Maintain a 100-sample replay buffer from early training. Mix 10% replay into each batch.
       Measure: oracle accuracy WITH vs WITHOUT replay (anti-forgetting effectiveness).

