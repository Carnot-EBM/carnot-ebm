  deliverable: results/experiment_7047_v617_selective_belief_csl.json
  gated_on:
    - upstream: exp7046-frontier-stratified-exact-outcome-curriculum
      artifact_field: belief_frontier_curriculum_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp7021-prospective-belief-utility
      verdict: complete_null_prospective_belief_utility_not_demonstrated
      addressed_by: "Exp7047 changes the mechanism from uniform deterministic belief use to a bounded online abstention policy updated only by exact later intervention advantage across frozen frontier strata."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    This is V617's required continuous self-learning experiment. Uniform belief
    use can be null or harmful on some decisions. FlowBalance keeps guidance
    only for positive verifier advantage and abstains on no preference.
    Environment Evolution motivates balanced frontier strata. Carnot has a
    stronger update authority than either self-guidance or rubrics: the later
    exact ARC observation. The GGUF weights remain frozen.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md section "Continuous Self-Learning"
    - {project_root}/research-references.md section "V617 Planner Refresh"
    - {project_root}/results/experiment_7045_v617_uniform_belief_cold_audit.json
    - {project_root}/results/experiment_7046_v617_frontier_stratified_curriculum.json
    - {project_root}/python/carnot/agentic/arc_belief_ledger.py
    - {project_root}/python/carnot/agentic/arc_belief_query.py
    - {project_root}/python/carnot/agentic/arc_belief_aware_e3_selector.py
    - {project_root}/python/carnot/pipeline/constraint_generator.py
    - {project_root}/openspec/capabilities/continuous-learning/spec.md

    TASK:
    Implement and evaluate a bounded online belief-use policy. On each
    development decision, choose use or abstain from serving-visible features,
    then update only after the later exact outcome reveals signed intervention
    advantage. Freeze the policy and evaluate it on the disjoint chronological
    holdout against always-off, always-on, and matched-rate shuffled controls.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp7046 with
       belief_frontier_curriculum_ready_score=1, exact partition hashes,
       complete allowed/prohibited schemas, and writable code/test/artifact
       paths. A uniform null is valid input. On failure write terminal blocked
       with exact gate_check_summary.
    1. Add REQ-LEARN-7047 and RED tests before implementation. Cover delayed
       labels, no-preference abstention, harmful reversal, rollback, restart,
       bounded memory, poison rows, deterministic replay, protected retention,
       and frozen holdout evaluation.
    2. Implement a small hardware-friendly policy sidecar. Use a bounded table,
       sparse linear head, or contextual bandit over the allowed features. Do
       not update GGUF weights. Record no_model_weight_mutation=true.
    3. For each development row, log the pre-update decision and policy hash.
       Reveal the exact later outcome. Update toward use only for positive
       advantage, away from use for harmful advantage, and abstain for zero or
       unknown preference. Never update from model confidence or a rubric.
    4. Retain protected earlier cases and all soundness failures in bounded
       replay. Prove restart determinism, rollback, capacity bounds, and
       nonforgetting by support and difficulty stratum.
    5. Freeze one final policy hash before opening holdout labels. Compare
       frozen selective, always-off, always-on, and matched-rate shuffled
       controls on every holdout unit. Recompute exact advantage from rows.
    6. Set selective_belief_policy_safety_score=1 only when there are zero
       protected-case regressions, zero future-label accesses, bounded state,
       stable replay, and no weight mutation. Set
       selective_belief_policy_nontrivial_score=1 only when the frozen policy
       makes at least one use and one abstain decision, reduces harmful
       interventions versus always-on, has positive exact advantage over
       always-off, and beats the matched-rate shuffled control. An all-abstain
       safe result is terminal null, not positive or partial.
    7. Set continuous_self_learning_task=true. Report soundness mistakes,
       completeness mistakes, abstentions, helpful uses, harmful uses, and
       retention per unit and per stratum.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, spec coverage, and applicable continuous-learning
       E2E checks from ops/e2e-test-plan.md.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (aggregation_from_upstream_artifacts); duration_s;
       source_artifact_hashes; cited_upstream_artifacts; upstream_gate_rows;
       rows; per_game_results; development_decision_rows; delayed_label_rows;
       update_rows; rollback_rows; restart_rows; poison_rows;
       bounded_state_rows; replay_retention_rows; protected_case_rows;
       nonforgetting_rows; holdout_rows; policy_arm_rows;
       stratum_result_rows; matched_rate_control_rows; soundness_mistakes;
       completeness_mistakes; abstention_count; helpful_use_count;
       harmful_use_count; exact_advantage_over_off;
       exact_advantage_over_always_on; final_policy_hash;
       no_model_weight_mutation (true); continuous_self_learning_task (true);
       selective_belief_policy_safety_score;
       selective_belief_policy_nontrivial_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

