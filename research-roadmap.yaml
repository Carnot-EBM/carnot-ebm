# Carnot Research Roadmap - Milestone 2026.04.20
# "Revalidation Sweep: Confirm or Rule Out Pre-Provenance Approaches"
#
# CONTEXT: Many earlier experiments (Exp 91-178) lack live GPU provenance.
# Some approaches may genuinely work but were tested with bad methodology.
# This milestone re-runs the most promising ones with live inference and
# modern extractors to either confirm or definitively rule them out.

milestone: "2026.04.20"
milestone_title: "Revalidation Sweep: Confirm or Rule Out Pre-Provenance Approaches"

tasks:
  - id: exp271-consistency-checker-live
    milestone: "2026.04.20"
    deliverable: results/experiment_271_results.json
    title: "Exp 271: Global consistency checker on live multi-turn chains"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.

      CONTEXT: The global consistency checker (Exp 172/176) detected 100%
      of contradictions on synthetic chains. But those were synthetic, not
      live. Re-run on real multi-turn Gemma4/Qwen outputs.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
      - python/carnot/verify/constraint.py — ConstraintStateMachine

      TASK: Run the consistency checker on live multi-turn LLM outputs.
      1. Generate 20 multi-turn chains (10 consistent, 10 with injected contradictions) using live Gemma4-E4B-it
      2. Run GlobalConsistencyChecker on each chain
      3. Measure: detection rate on contradictions, false positive rate on consistent chains
      4. Compare to Exp 172/176 synthetic results
      5. Write tests and results JSON
      6. Run: .venv/bin/pytest tests/python -q
      7. Do NOT push. Do NOT modify scripts/research_conductor.py.

