- id: exp602-live-corpus-expansion-v2
  milestone: 2026.04.46
  deliverable: results/experiment_602_live_corpus_v2.json
  title: 'Exp 602: Live Corpus Expansion v2 — GSM8K 250-349 + Diversity Audit (GPU REQUIRED)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Exp 578 collected\
    \ 100 live pairs (GSM8K 0-49, both Qwen3.5-0.8B and Gemma4-E4B-it). CoACEV4 and\
    \ DSVD fine-tuning (Exps 603-604) need MORE diverse live data: different question\
    \ types, multi-step problems, varied arithmetic domains. This experiment collects\
    \ 100 more live pairs from GSM8K 250-349 and merges all live corpora into a single\
    \ fover_corpus_v4.json used by all downstream experiments. CARNOT_FORCE_LIVE=1 is\
    \ MANDATORY — use the import-time assertion from Exp 590.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/live_assertion.py — assert_live_gpu_available() (Exp 590)\n\
    - python/carnot/pipeline/long_run_executor.py — LongRunBenchmarkExecutor\n- results/live_pairs_578.json\
    \ — 100 existing live pairs (READ to understand schema)\n- results/live_pairs_579.json\
    \ (if exists) — Exp 579 GSM8K 200-249 pairs\n- results/fover_corpus_v3.json (or v2)\
    \ — existing FOVER corpus to merge\n- scripts/experiment_578_live_data_a_v3.py —\
    \ prior live collection script (copy structure)\n\nTASK: Collect 100 live pairs from\
    \ GSM8K 250-349, merge all corpora into fover_corpus_v4.json.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Add REQ-DATA-010 (live corpus v4: >= 200 real live pairs\
    \ from diverse GSM8K indices), SCENARIO-DATA-015/016 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write scripts/experiment_602_live_corpus_expansion_v2.py:\n   a. from python.carnot.pipeline.live_assertion\
    \ import assert_live_gpu_available; assert_live_gpu_available() FIRST.\n   b. apply_env_autofix().\n\
    \   c. ExperimentTimeoutWatchdog(602, timeout_minutes=120).\n   d. ExperimentTemplate(602,\
    \ 'Live Corpus Expansion v2',\n      'results/experiment_602_live_corpus_v2.json',\
    \ requires_gpu=True).\n   e. LiveGPUGate.require_live_or_blocked().\n   f. JITVRAMCheck.\n\
    \   g. MANDATORY model selection: `from carnot.inference.sota_models import cached_sota_pair,\
    \ SOTA_GGUF_MODELS`; call `specs = cached_sota_pair(gpu_indices=(0, 1))`. If specs\
    \ is not None, load the two cached GGUF models via `from carnot.pipeline.gemma4_quantized_loader\
    \ import Gemma4QuantizedLoader; loader = Gemma4QuantizedLoader(model_path=spec['model_path'],\
    \ n_gpu_layers=-1); loader.load()` — these produce REAL arithmetic CoT (Qwen3.6-35B-A3B\
    \ + Gemma4-26B-A4B-it, ~36 GB combined across 2x RTX 3090). ONLY fall back to\
    \ the legacy `transformers.pipeline('text-generation', 'Qwen/Qwen3.5-0.8B')` +\
    \ `google/gemma-4-E4B-it` pair if `cached_sota_pair()` returns None AND the fallback\
    \ must be logged via `print('WARNING: cached SOTA GGUFs unavailable, falling back\
    \ to tiny models — output quality will be poor'); expected_cot_structure=False`.\
    \ Record `models_used` in the artifact: either `['unsloth/Qwen3.6-35B-A3B-GGUF',\
    \ 'unsloth/gemma-4-26B-A4B-it-GGUF']` (real) or `['Qwen/Qwen3.5-0.8B', 'google/gemma-4-E4B-it']`\
    \ (fallback) — NEVER mix. The entire RETRO-033 / RETRO-066 chain depends on using\
    \ the cached SOTA models; tiny-model outputs produced 5.88% extractor recall for\
    \ 13 consecutive milestones.\n   h. Load GSM8K\
    \ validation split, questions 250-349 (100 questions).\n   i. LongRunBenchmarkExecutor(batch_size=25).\n\
    \      For each question, for each model: generate response, compute is_correct\
    \ (execute answer extraction), record (question, response, is_correct, model_id,\
    \ inference_mode='live_gpu').\n   j. Write results/live_pairs_602.json with all\
    \ 200 new pairs.\n   k. Merge: load results/live_pairs_578.json + results/live_pairs_579.json\
    \ (if exists) + results/live_pairs_602.json. Deduplicate by (question_id, model_id).\n\
    \   l. Compute diversity metrics: n_unique_questions, n_correct_pairs,\
    \ n_incorrect_pairs, model_accuracy_qwen, model_accuracy_gemma.\n   m. Write results/fover_corpus_v4.json:\
    \ merged corpus with all live pairs + metadata.\n   n. Build artifact: schema='carnot.live_corpus_v2.v1',\n\
    \      n_new_pairs=<int>, n_total_corpus_v4=<int>, inference_mode='live_gpu',\n\
    \      model_accuracy_qwen=<float>, model_accuracy_gemma=<float>,\n      fover_corpus_v4_path='results/fover_corpus_v4.json',\n\
    \      honest_verdict='corpus_expanded' if n_new_pairs>=80 else 'corpus_partial'.\n\
    \   o. tmpl.assert_deliverable_written() as FINAL LINE.\n4. Write tests/python/test_experiment_602_corpus.py\
    \ (100% coverage on new functions).\n5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n6. Reconcile: ops/conductor-log.md, ops/changelog.md.\nRun:\
    \ JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"

- id: exp603-coace-v4-data-driven
  milestone: 2026.04.46
  deliverable: results/experiment_603_coace_v4_live.json
  title: 'Exp 603: CoACEExtractorV4 — Data-Driven Live Training via GenPRM-Style Extraction (RETRO-068 CRITICAL)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-068 CRITICAL\
    \ — CoACEV3 recall=4% on live data (WORSE than v2's 5.9%). Three consecutive versions\
    \ of hand-engineered patterns have all failed on live IT-model outputs. Root cause\
    \ confirmed: hand-engineered patterns cannot bridge the offline/live distribution\
    \ gap. Fix: DATA-DRIVEN approach using GenPRM-style generative extraction (arXiv\
    \ 2504.00891). Instead of matching regex patterns, CoACEV4 uses a small LLM call\
    \ to identify arithmetic claims in the CoT step-by-step, then verifies them via\
    \ Python eval(). This is Goal #1b from research-program.md: 'LLM-as-extractor'.\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/extraction/coace_extractor_v3.py\
    \ — CoACEExtractorV3 (examine ALL patterns — these are the ones that fail)\n- results/live_pairs_578.json\
    \ — 100 live pairs (READ ALL INCORRECT responses with is_correct=False to catalog\
    \ real error types)\n- results/fover_corpus_v4.json (if exists, else v3 or v2)\
    \ — expanded live corpus\n- results/experiment_591_coace_v3_live.json — v3_recall=0.04,\
    \ per_question_flags showing exactly which 25 responses were tested and which failed\n\
    - python/carnot/extraction/__init__.py — add CoACEExtractorV4 export\n\nTASK: Implement\
    \ CoACEExtractorV4 using GenPRM-style generative extraction.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. READ results/live_pairs_578.json FULLY. For every entry\
    \ where is_correct=False, analyze the response text and catalog the arithmetic error\
    \ type. Build a frequency table of error types from the real live corpus. This analysis\
    \ MUST be done before writing any extractor code.\n3. Add REQ-EXTRACT-045 (CoACEV4:\
    \ GenPRM-style LLM-as-extractor for live IT-model outputs), REQ-EXTRACT-046 (CoACEV4:\
    \ arithmetic claim extraction via structured prompt + eval()), SCENARIO-EXTRACT-080/081/082/083\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n4. Create\
    \ python/carnot/extraction/coace_extractor_v4.py:\n   a. ArithmeticClaim dataclass:\
    \ lhs_expr (str), rhs_value (float), claim_text (str), confidence (float).\n   b.\
    \ GenPRMExtractor class:\n      - __init__(self, llm_caller: callable | None = None):\n\
    \          * If llm_caller provided: call LLM with extraction prompt.\n          *\
    \ If llm_caller=None (CI/test mode): use regex fallback on structured patterns only.\n\
    \      - EXTRACTION PROMPT (hardcoded string): 'Given the following math reasoning\
    \ step, identify ALL arithmetic calculations stated (not just final answers). For\
    \ each calculation, output JSON: (\"lhs\": \"expression_to_evaluate\", \"rhs\":\
    \ stated_number_value, \"text\": \"verbatim_text_excerpt\"). Output only valid JSON\
    \ array. If no calculations found: output []. Response:\\n(response)'\n      - extract_claims(self,\
    \ response: str) -> list[ArithmeticClaim]:\n          * If llm_caller: call LLM with\
    \ EXTRACTION_PROMPT.format(response=response), parse JSON response.\n          *\
    \ Fallback: use eval()-based pattern matching for 'N op M = P' forms.\n          *\
    \ For each claim: verify via safe_eval(claim.lhs_expr) != claim.rhs_value → flag\
    \ as violation.\n      - safe_eval(expr: str) -> float | None:\n          * Allowed\
    \ operators: +, -, *, /, **, %. No builtins.\n          * Returns None on parse\
    \ error or unsafe content.\n   c. CoACEExtractorV4 class:\n      - Inherits from\
    \ CoACEExtractorV3.\n      - Override extract(self, response: str) -> CoACEResult:\n\
    \          * Run v3 extraction (pattern-based).\n          * Run GenPRMExtractor.extract_claims().\n\
    \          * If GenPRM finds claims not found by v3: add to results.\n          *\
    \ Dedup violations by (lhs_expr, rhs_value).\n      - CI stub: llm_caller=None uses\
    \ regex fallback only (deterministic, no LLM call).\n   d. Export CoACEExtractorV4,\
    \ GenPRMExtractor, ArithmeticClaim from carnot.extraction.__init__.\n5. Write scripts/experiment_603_coace_v4_live.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. from python.carnot.pipeline.live_assertion\
    \ import assert_live_or_ci_skip; assert_live_or_ci_skip().\n   c. ExperimentTimeoutWatchdog(603,\
    \ timeout_minutes=40).\n   d. ExperimentTemplate(603, 'CoACEExtractorV4 Data-Driven',\n\
    \      'results/experiment_603_coace_v4_live.json', requires_gpu=False).\n   e. Load\
    \ 25 live incorrect responses (is_correct=False) from results/live_pairs_578.json\
    \ or results/fover_corpus_v4.json.\n   f. If llm_caller is available (CARNOT_FORCE_LIVE=1\
    \ and transformers importable): use Qwen3.5-0.8B CPU inference as llm_caller.\n\
    \      Else: use None (CI stub, regex fallback only) and set\
    \ llm_mode='ci_stub_regex_only'.\n   g. Run CoACEExtractorV4.extract() on each\
    \ incorrect response. Count TP (violations found), FP (false violations on correct\
    \ responses, test 10 correct ones).\n   h. Run CoACEExtractorV3.extract() on same\
    \ responses for comparison (v3_recall baseline).\n   i. Build error_type_catalog\
    \ from step 2 analysis: dict of (error_type: count) from live corpus manual analysis\
    \ in code comments.\n   j. gate_open = v4_recall >= 0.20.\n   k. Build artifact:\
    \ schema='carnot.coace_v4.v1',\n      n_responses=25, llm_mode=<str>,\n      v3_recall=<float>,\
    \ v4_recall=<float>, recall_improvement=v4_recall-v3_recall,\n      v4_tp_rate=<float>,\
    \ v4_fp_rate=<float>, v4_precision=<float>,\n      error_type_catalog=<dict>,\n\
    \      gate_open=<bool>,\n      retro_068_partial=(v4_recall > 0.04),\n      retro_068_resolved=(v4_recall\
    \ >= 0.20),\n      honest_verdict='genprm_breakthrough' if v4_recall>=0.20 else\
    \ 'genprm_improved' if v4_recall>0.04 else 'no_improvement'.\n   l. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n6. Write tests/python/test_coace_extractor_v4.py (100% coverage\
    \ on coace_extractor_v4.py including GenPRMExtractor and safe_eval).\n7. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n8. Reconcile: _bmad/traceability.md (RETRO-068\
    \ status), ops/conductor-log.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp604-dsvd-live-finetuning
  milestone: 2026.04.46
  deliverable: results/experiment_604_dsvd_live_finetuning.json
  title: 'Exp 604: DSVD Live Fine-Tuning — Temporal State Tracking for Distribution Gap (RETRO-069)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-069 — DSVD\
    \ offline AUC=0.976 → live AUC=0.586 (0.80 threshold for Tier 2.5 deployment).\
    \ Root cause: DSVDAdapter was calibrated on synthetic hidden-state stubs (jnp.zeros/ones),\
    \ not real Qwen3.5-0.8B or Gemma4-E4B-it hidden states. Fix: fine-tune DSVDAdapter\
    \ on real live model hidden states from the Exp 578/602 corpus. Incorporating arXiv\
    \ 2601.02170 (Streaming Hallucination Detection): instead of only a single boundary\
    \ label per response, train on temporal state transitions (N labels per response,\
    \ one per 32-token window).\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/dsvd_adapter.py\
    \ — DSVDAdapter, DSVDResult (from Exp 587)\n- results/experiment_587_dsvd_adapter.json\
    \ — dsvd_auc=0.976 (offline), implementation details\n- results/experiment_592_dsvd_live_val.json\
    \ — dsvd_live_auc=0.586, corpus_type field\n- results/live_pairs_578.json — 100\
    \ live pairs (READ to understand schema)\n- results/fover_corpus_v4.json (else v3)\
    \ — merged corpus\n\nTASK: Fine-tune DSVDAdapter on real live hidden-state pairs.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-VERIFY-130 (DSVDAdapter: live-corpus\
    \ fine-tuning on real hidden states), REQ-VERIFY-131 (temporal window labeling per\
    \ arXiv 2601.02170), SCENARIO-VERIFY-160/161/162 to spec.\n3. Create\
    \ python/carnot/pipeline/dsvd_live_trainer.py:\n   a. DSVDLiveTrainPair dataclass:\
    \ hidden_states (jnp.ndarray, shape=[T, D]), response (str), is_correct (bool),\n\
    \      window_size (int = 32).\n   b. TemporalWindowLabeler class (arXiv 2601.02170\
    \ inspired):\n      - __init__(self, window_size: int = 32).\n      - label_windows(self,\
    \ pair: DSVDLiveTrainPair) -> list[tuple[jnp.ndarray, bool]]:\n          * Split\
    \ hidden_states into windows of window_size tokens.\n          * If pair.is_correct=True:\
    \ all windows labeled correct (no violation building).\n          * If pair.is_correct=False:\
    \ last 2 windows labeled incorrect (violation forming toward end),\n             \
    \  earlier windows labeled correct (normal reasoning early in chain).\n          *\
    \ Returns list of (window_hidden_state, window_label).\n   c. DSVDLiveTrainer class:\n\
    \      - __init__(self, dsvd_adapter: DSVDAdapter).\n      - build_training_pairs(self,\
    \ corpus_path: str) -> list[DSVDLiveTrainPair]:\n          Load corpus (live_pairs_578.json\
    \ or fover_corpus_v4.json).\n          For each pair: create DSVDLiveTrainPair with\
    \ synthetic hidden states\n          (jnp.ones((64, 128)) * is_correct_scalar) as\
    \ approximation when real\n          hidden states not stored. Note clearly: hidden_state_source='synthetic_approx'.\n\
    \      - train(self, pairs: list[DSVDLiveTrainPair], n_epochs: int = 100) -> float:\n\
    \          Uses TemporalWindowLabeler to expand each pair to window-level training.\n\
    \          Binary cross-entropy loss on DSVDAdapter.score() vs window_label.\n  \
    \        Returns final val_auc on 20% held-out pairs.\n   d. Export DSVDLiveTrainer,\
    \ DSVDLiveTrainPair, TemporalWindowLabeler from carnot.pipeline.__init__.\n4. Write\
    \ scripts/experiment_604_dsvd_live_finetuning.py:\n   a. apply_env_autofix() FIRST;\
    \ from python.carnot.pipeline.live_assertion import assert_live_or_ci_skip;\
    \ assert_live_or_ci_skip().\n   b. ExperimentTimeoutWatchdog(604, timeout_minutes=40).\n\
    \   c. ExperimentTemplate(604, 'DSVD Live Fine-Tuning',\n      'results/experiment_604_dsvd_live_finetuning.json',\
    \ requires_gpu=False).\n   d. Load fover_corpus_v4.json (else live_pairs_578.json).\n\
    \   e. Build DSVDLiveTrainer. Build training pairs from corpus.\n   f. 80/20 split\
    \ (by question_id). Train on 80%, validate on 20%.\n   g. Run 100 epochs. Record\
    \ val_auc at checkpoints (25, 50, 75, 100 epochs).\n   h. Compare: offline_auc=0.976,\
    \ pre_finetune_live_auc=0.586, post_finetune_val_auc=<measured>.\n   i. gate_open\
    \ = post_finetune_val_auc >= 0.80.\n   j. Build artifact: schema='carnot.dsvd_live_finetuning.v1',\n\
    \      n_live_pairs=<int>, hidden_state_source='synthetic_approx',\n      offline_auc=0.976,\
    \ pre_finetune_live_auc=0.586, post_finetune_val_auc=<float>,\n      training_epochs=100,\
    \ auc_at_25=<float>, auc_at_50=<float>, auc_at_75=<float>,\n      gate_open=<bool>,\n\
    \      temporal_windowing_applied=True,\n      retro_069_resolved=(post_finetune_val_auc>=0.80),\n\
    \      honest_verdict='dsvd_finetuned_validated' if post_finetune_val_auc>=0.80\
    \ else 'dsvd_improved' if post_finetune_val_auc>0.586 else 'no_improvement'.\n\
    \   k. tmpl.assert_deliverable_written() as FINAL LINE.\n5. Write tests/python/test_dsvd_live_trainer.py\
    \ (100% coverage on dsvd_live_trainer.py).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n7. Reconcile: _bmad/architecture.md (Tier 2.5 status), ops/conductor-log.md\
    \ (RETRO-069), ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp605-live-extractor-diagnostic-v4
