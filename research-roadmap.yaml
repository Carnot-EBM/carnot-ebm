- id: exp2472-llm-as-judge-tier0p
  title: 'Phase 1: LLM-as-Judge Tier 0p -- SOTA GGUF Direct Hallucination Scoring (MANDATORY SOTA GGUF per CLAUDE.md)'
  milestone: 2026.05.239
  deliverable: results/experiment_2472_tier0p_llm_judge.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  prior_failures:
  - experiment_id: exp2461-conformal-ensemble-v3-stouffer
    verdict: 'complete: with best AUROC 0.916700'
    addressed_by: 'exp2461 tried Stouffer Z-score (0.818) and Logistic regression (0.825) as aggregation methods but BOTH
      were worse than Fisher (0.9167). The ceiling is in the current 9-verifier set''s information content, not the aggregation
      method. exp2472 introduces a QUALITATIVELY DIFFERENT verifier: a SOTA GGUF LLM directly asked to judge hallucination
      (Yes/No + confidence). LLM-as-judge has higher individual AUROC potential because the model has broad world knowledge
      for factual verification, unlike logprob-derived signals. Different mechanism: live LLM inference vs logprob statistics.'
    retire_if_same_verdict: false
  prompt: "CONTEXT: All three ensemble aggregation methods have been tried on the current\n9-verifier set: Fisher (AUROC=0.9167),\
    \ Stouffer (0.818), Logistic (0.825). All hit a ceiling.\nThe gap to HIVE peer (0.9236) = 0.0069. A new HIGH-AUROC verifier\
    \ with independent signal\nis needed.\n\nLLM-as-judge approach: use a SOTA GGUF model as a direct hallucination judge.\n\
    For each telemetry entry (36 entries), ask the model:\n  \"Does the following response contain factual errors or hallucinations?\n\
    \   Response: [response_text]\n   Answer: YES or NO. Confidence: 0.0-1.0\"\nMap YES\u2192score=confidence, NO\u2192score=(1-confidence).\n\
    \nArXiv:2604.06216 (March 2026) shows vanilla LLM-as-judge achieves 54% accuracy without\ndomain expertise. With few-shot\
    \ examples of known hallucinations (from telemetry manifest),\nthe model should substantially exceed 54% on this binary\
    \ task.\n\nMANDATORY per CLAUDE.md SOTA Local Models section: this task MUST include at least one of:\n  - unsloth/Qwen3.6-35B-A3B-GGUF\n\
    \  - unsloth/gemma-4-31B-it-GGUF\n  - unsloth/gemma-4-26B-A4B-it-GGUF\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py\
    \ (telemetry loading pattern)\n  {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl (first 3 lines\
    \ \u2014 schema)\n  {project_root}/scripts/experiment_template.py (cached_sota_pair() pattern)\n\nTASK: Implement Tier\
    \ 0p LLM-as-Judge verifier using cached GGUF model.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS (check ALL before any inference):\n\
    \     a. Check for cached SOTA GGUF models:\n        for model_dir in ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF\n\
    \                         ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF\n                        \
    \ ~/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF; do\n           ls $model_dir/*.gguf 2>/dev/null | head\
    \ -1 && break\n        done\n        Record: model_path (first found GGUF file), model_family\n        If NO gguf file\
    \ found in any path: write honest_verdict blocked_model_not_cached and exit.\n     b. llama-cpp-python importable:\n \
    \       {project_root}/.venv/bin/python -c \"from llama_cpp import Llama; print('llama_cpp ok')\"\n        If fails: write\
    \ honest_verdict blocked_llama_cpp_not_installed and exit.\n     c. sklearn importable:\n        {project_root}/.venv/bin/python\
    \ -c \"import sklearn; print(sklearn.__version__)\"\n     d. Telemetry manifest present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n     Record: preconditions_checked\
    \ list with all results.\n\n  1. Load 3 few-shot examples from telemetry manifest (1 known hallucination, 1 correct, 1\
    \ borderline):\n     Use entries where known_verifier_label is available (correctness_label field).\n     Format as few-shot\
    \ prompt prefix.\n\n  2. For each of 36 telemetry entries:\n     Construct prompt:\n       \"[FEW-SHOT EXAMPLES]\n   \
    \     New entry:\n        Response: {{entry.response_text[:500]}}  # truncate to 500 chars\n        Does this response contain\
    \ factual errors or hallucinations?\n        Answer with YES or NO, then a confidence score 0.0-1.0.\"\n     Call Llama(model_path,\
    \ n_ctx=1024, verbose=False) with max_tokens=20.\n     Parse response:\n       if 'YES' in output.upper(): score = extract_float(output,\
    \ default=0.8)\n       if 'NO' in output.upper(): score = 1.0 - extract_float(output, default=0.2)\n       else: score\
    \ = 0.5  # uncertain\n     timer: record inference time per entry.\n\n  3. Compute evaluation metrics:\n     tier0p_auroc:\
    \ sklearn.metrics.roc_auc_score(labels, scores)\n     tier0p_vs_semantic_energy_delta: tier0p_auroc - 0.810\n     mean_inference_time_s:\
    \ mean per-entry inference time\n     orthogonality_vs_fregelogic: Pearson r(tier0p_scores, fregelogic_scores)\n     \
    \  (load fregelogic scores from existing verifier score files if available)\n\n  4. Write verifier score file for ensemble:\n\
    \     {project_root}/results/experiment_2472_tier0p_scores.json:\n     {\"verifier\": \"llm_judge\", \"model_used\": model_path,\
    \ \"scores\": [{{\"idx\": i, \"score\": s, \"label\": l}} for all 36]}\n\n  5. Write deliverable. Validate JSON before writing.\n\
    \nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with tier0p_auroc.\
    \ Blocked if GGUF not cached.\"\n  - tier0p_auroc:\n      principle: \"Primary AUROC on 36 examples. Honest result regardless\
    \ of sign vs baseline.\"\n  - tier0p_vs_semantic_energy_delta:\n      principle: \"tier0p_auroc - 0.810. Positive = exceeds\
    \ SemanticEnergy.\"\n  - model_used:\n      principle: \"Which GGUF file was loaded. Documents sovereignty claim (local\
    \ inference).\"\n  - model_family:\n      principle: \"Which SOTA family (Qwen3.6, Gemma-4-26B, Gemma-4-31B).\"\n  - n_eval_examples:\n\
    \      principle: \"Must be 36.\"\n  - mean_inference_time_s:\n      principle: \"Mean per-entry inference time. > 1s\
    \ validates real inference ran.\"\n  - orthogonality_vs_fregelogic:\n      principle: \"Pearson r with FregeLogic. Low\
    \ abs(r) = independent signal for ensemble.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n \
    \     principle: \"Total wall time. Must be > n_eval_examples * mean_inference_time_s.\"\n  - preconditions_checked:\n\
    \      principle: \"Records GGUF model path, llama_cpp status, telemetry status. Anti-fabrication anchor.\"\n\nACCEPTANCE\
    \ GATES:\n  - condition: \"tier0p_auroc != null AND preconditions_checked != null\"\n    principle: \"Must produce valid\
    \ AUROC with documented preconditions \u2014 even below baseline useful for ensemble diversity.\"\n  - condition: \"mean_inference_time_s\
    \ > 0.5\"\n    principle: \"LLM inference takes > 0.5s per call; faster indicates fabrication.\"\n\nDo NOT push. Do NOT\
    \ modify scripts/research_conductor.py."
- id: exp2473-calibrated-conformal-ensemble-v4
  title: 'Phase 1: Calibrated Conformal Ensemble v4 -- Platt Scaling + Isotonic Regression on All 9 Verifiers'
  milestone: 2026.05.239
  deliverable: results/experiment_2473_calibrated_ensemble_v4.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  prior_failures:
  - experiment_id: exp2461-conformal-ensemble-v3-stouffer
    verdict: 'complete: with best AUROC 0.916700'
    addressed_by: "exp2461 applied Stouffer Z-score (quality-weighted aggregation) and Logistic regression \u2014 both WORSE\
      \ than Fisher (0.818 and 0.825 vs 0.9167). The issue is not the aggregation method but potentially the calibration of\
      \ individual verifier scores. exp2473 tests a different hypothesis: apply per-verifier Platt scaling (sigmoid calibration)\
      \ and isotonic regression BEFORE Fisher combination. If verifier scores are miscalibrated (their probability estimates\
      \ are poorly calibrated to true hallucination rates), then calibration alone could unlock the 0.0069 gap. Different\
      \ from exp2461: calibration layer not aggregation method change."
    retire_if_same_verdict: true
  - experiment_id: exp2448-conformal-ensemble-v2
    verdict: 'complete: with conformal_ensemble_auroc=0.916667'
    addressed_by: 'exp2448 added PCIB as 8th verifier to Fisher''s method but got AUROC=0.9167 (identical to v1). exp2473
      applies Platt/isotonic calibration to all 9 verifiers and checks whether calibration unlocks additional discriminative
      power. Different hypothesis: calibration quality vs verifier count.'
    retire_if_same_verdict: false
  prompt: "CONTEXT: Fisher's conformal ensemble: AUROC=0.9167 with 9 verifiers.\nStouffer (0.818), Logistic (0.825) BOTH WORSE\
    \ than Fisher.\nGap to HIVE peer: 0.9236 - 0.9167 = 0.0069.\n\nNew hypothesis: the Fisher ceiling may partly reflect uncalibrated\
    \ per-verifier scores.\nPlatt scaling maps raw verifier scores to calibrated probabilities before aggregation.\nIsotonic\
    \ regression provides a monotone calibration alternative.\n\nCalibration protocol (36 examples, small set):\n  - Leave-one-out\
    \ calibration: for each example, calibrate on the other 35\n  - OR 5-fold cross-calibration (more stable with n=36)\n\n\
    EXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/conformal_ensemble.py\n  {project_root}/results/experiment_2461_conformal_ensemble_v3.json\n\
    \nTASK: Apply Platt scaling and isotonic calibration to all 9 verifier scores, rebuild ensemble.\n\nCONCRETE STEPS:\n\
    \  0. PRECONDITIONS:\n     a. sklearn importable with version >= 1.0:\n        {project_root}/.venv/bin/python -c \"import\
    \ sklearn; print(sklearn.__version__)\"\n     b. conformal_ensemble.py exists:\n        ls {project_root}/python/carnot/verify/conformal_ensemble.py\n\
    \        If missing: write honest_verdict blocked_conformal_module_missing and exit.\n     c. LaaB meta scores:\n    \
    \    ls {project_root}/results/experiment_2450_laab_meta_scores.json\n        Record laab_meta_available=True/False.\n\
    \     d. Telemetry manifest:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n   \
    \     If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Load all 9 verifier score\
    \ files (same as exp2461, including LaaB meta):\n     Verifiers: semantic_energy (0.810), halt (0.8539), laab (0.8539),\
    \ fregelogic (0.8831),\n               diffutruth (0.588), pcib (0.802), logcons_z3 (0.607), hierarchical_logcons (0.8896),\n\
    \               laab_meta (0.854)\n\n  2. Apply Platt scaling to each verifier:\n     from sklearn.calibration import\
    \ CalibratedClassifierCV\n     from sklearn.linear_model import LogisticRegression\n     For each verifier v:\n      \
    \ scores_v = [s['score'] for s in verifier_data_v]  # 36 scores\n       labels = hallucination_labels  # 36 binary labels\n\
    \       # 5-fold cross-calibration\n       from sklearn.model_selection import StratifiedKFold\n       calibrated_scores_v\
    \ = []\n       kf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n       for train_idx, test_idx in kf.split(scores_v,\
    \ labels):\n         lr = LogisticRegression()\n         lr.fit([[s] for s in [scores_v[i] for i in train_idx]], [labels[i]\
    \ for i in train_idx])\n         calibrated_scores_v.extend(zip(test_idx, lr.predict_proba([[scores_v[i]] for i in test_idx])[:,1]))\n\
    \       calibrated_v = [s for _,s in sorted(calibrated_scores_v)]\n\n  3. Rebuild Fisher ensemble with calibrated scores:\n\
    \     (calibrated p-values instead of raw scores)\n     platt_auroc: AUROC with Platt-calibrated verifier scores.\n\n\
    \  4. Apply isotonic regression calibration:\n     from sklearn.isotonic import IsotonicRegression\n     Same 5-fold protocol\
    \ but with IsotonicRegression.\n     isotonic_auroc: AUROC with isotonic-calibrated scores.\n\n  5. Also try Tier 0p scores\
    \ if exp2472 ran:\n     ls {project_root}/results/experiment_2472_tier0p_scores.json\n     If present: add as 10th verifier\
    \ and compute platt_with_tier0p_auroc.\n\n  6. Report best_calibrated_auroc = max(platt_auroc, isotonic_auroc, platt_with_tier0p_auroc\
    \ if available, fisher_v3=0.9167).\n     calibration_helped = best_calibrated_auroc > 0.9167.\n\n  7. Write deliverable.\
    \ Validate JSON before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix\
    \ required. complete: with best_calibrated_auroc.\"\n  - platt_auroc:\n      principle: \"AUROC with Platt-calibrated\
    \ verifier scores. Documents calibration hypothesis test.\"\n  - isotonic_auroc:\n      principle: \"AUROC with isotonic\
    \ calibration. Alternative calibration method.\"\n  - best_calibrated_auroc:\n      principle: \"Best AUROC achieved by\
    \ any calibration method. Primary metric for .239.\"\n  - calibration_helped:\n      principle: \"True if best_calibrated_auroc\
    \ > 0.9167. Tests whether Fisher ceiling is a calibration artifact.\"\n  - conformal_vs_hive_peer_delta_v4:\n      principle:\
    \ \"best_calibrated_auroc - 0.9236. Negative = gap remains.\"\n  - n_verifiers_fused:\n      principle: \"9 base verifiers\
    \ + optionally Tier 0p (10). Documents ensemble composition.\"\n  - json_validation_passed:\n      principle: \"json.loads(result_str)\
    \ succeeded before write.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n      principle: \"\
    Guards against fabrication.\"\n  - preconditions_checked:\n      principle: \"Records sklearn, conformal module, telemetry\
    \ checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"json_validation_passed == true\"\n    principle: \"JSON must be valid.\"\
    \n  - condition: \"platt_auroc != null AND isotonic_auroc != null\"\n    principle: \"Both calibration methods must be\
    \ attempted.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."
- id: exp2474-phase4-odar-free-energy-empirical
  title: 'Phase 1: Phase 4 ODAR Free-Energy Empirical Validation -- Does Routing Energy Correlate with Hallucination?'
  milestone: 2026.05.239
  deliverable: results/experiment_2474_phase4_odar_empirical.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2455-odar-free-energy-routing
    verdict: complete_odar_routing_implemented_True
    addressed_by: 'exp2455 (.237) IMPLEMENTED the ODAR router (odar_routing_implemented=True) as a pipeline component. exp2474
      is the EMPIRICAL VALIDATION step: does the ODAR routing energy actually correlate with hallucination ground truth? exp2455
      was implementation; exp2474 is evaluation. Different deliverable: correlation metrics vs implementation artifact.'
    retire_if_same_verdict: false
  prompt: "CONTEXT: Phase 4 hypothesis: 'verifier-as-free-energy' \u2014 Carnot's energy score\nIS the variational free energy\
    \ in an active inference framework (ODAR, arXiv:2602.23681).\n\nThe ODAR router was implemented in exp2455 (odar_routing_implemented=True).\n\
    The fast-slow variant theory is documented in arXiv:2605.12484 (FST).\n\nEmpirical test: given 36 telemetry entries with\
    \ known hallucination labels,\ndoes the ODAR routing energy (energy assigned by OdarRouter to each query) predict\nhallucination\
    \ better than chance? Key metric: Pearson r(odar_energy, hallucination_label)\nand odar_energy_auroc (AUROC of routing\
    \ energy as a hallucination predictor).\n\nIf odar_energy_auroc > 0.6: Phase 4 free-energy hypothesis is empirically grounded.\n\
    This is the CRITICAL task for the arXiv hold: operator directive requires Phase 4\nempirical validation before arXiv submission.\n\
    \nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/pipeline/odar_router.py (ODAR routing, from exp2455)\n\
    \  {project_root}/results/experiment_2455_odar_free_energy_routing.json (ODAR implementation result)\n  {project_root}/python/carnot/verify/semantic_energy.py\
    \ (telemetry loading pattern)\n\nTASK: Compute ODAR routing energies for 36 telemetry entries; evaluate correlation with\
    \ hallucination labels.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. ODAR router module exists:\n        ls {project_root}/python/carnot/pipeline/odar_router.py\n\
    \        If missing: write honest_verdict blocked_odar_module_missing and exit.\n     b. numpy importable:\n        {project_root}/.venv/bin/python\
    \ -c \"import numpy; print(numpy.__version__)\"\n     c. Telemetry manifest:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Load ODAR router:\n   \
    \  from carnot.pipeline.odar_router import OdarRouter\n     (or read the module and instantiate manually if import path\
    \ differs)\n     router = OdarRouter()\n\n  2. For each of 36 telemetry entries:\n     Load entry: logprobs, response_text,\
    \ correctness_label.\n     Compute ODAR routing energy proxy:\n       # ODAR routes by minimizing free energy (surprise\
    \ + complexity)\n       # Proxy using available logprob data:\n       log_probs = entry.token_logprobs or entry.logprobs\n\
    \       # Surprise component: negative mean log probability\n       surprise = -mean(log_probs)   # high surprise = potential\
    \ hallucination\n       # Complexity component: variance of log probs\n       complexity = var(log_probs)    # high variance\
    \ = inconsistent routing\n       # ODAR free energy proxy:\n       odar_energy = surprise + 0.5 * complexity  # weighted\
    \ sum\n\n  3. Evaluate:\n     odar_energy_auroc: AUROC of odar_energy as hallucination predictor.\n     pearson_r: Pearson\
    \ r(odar_energy, hallucination_label).\n     phase4_validated: odar_energy_auroc > 0.60 (better than random but not threshold-matched).\n\
    \     odar_vs_semantic_energy_delta: odar_energy_auroc - 0.810 (comparison to SemanticEnergy).\n\n  4. Compute per-component\
    \ correlation:\n     surprise_auroc: AUROC of surprise component alone.\n     complexity_auroc: AUROC of complexity component\
    \ alone.\n     (This shows which component of free energy drives hallucination detection)\n\n  5. Write deliverable. Validate\
    \ JSON before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\
    \ complete: with odar_energy_auroc and phase4_validated.\"\n  - odar_energy_auroc:\n      principle: \"AUROC of ODAR routing\
    \ energy as hallucination predictor. Key Phase 4 metric.\"\n  - pearson_r:\n      principle: \"Pearson correlation between\
    \ energy and hallucination label. Positive = energy predicts hallucination.\"\n  - phase4_validated:\n      principle:\
    \ \"True if odar_energy_auroc > 0.60. This is the empirical Phase 4 validation signal for arXiv hold.\"\n  - surprise_auroc:\n\
