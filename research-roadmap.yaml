        template_library_bounded:
          principle: "True iff the template library stays under its size cap."
        pass_rate_vs_true_accuracy_distinct_assert:
          principle: "De-flags the tautology where pass_rate and true_accuracy are the same array."
        n_online_updates:
          principle: "Sample-size of the self-learning sweep (>=200)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "template_robust_or_graceful_fallback == true AND collapse_detected_deploy_arm == false AND template_library_bounded == true AND pass_rate_vs_true_accuracy_distinct_assert == true"
          principle: "Distribution-shift robustness is validated only when the template helps OR falls back gracefully (never hurts via collapse), the library stays bounded, and the two metrics are genuinely distinct."
