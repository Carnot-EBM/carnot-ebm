       independent_arbiter_id (separate authority); independent_reducer_id (separate aggregation);
       rows (one cold row per source unit and attack); aggregate_recomputation (all headlines);
       headline_differences (producer versus cold); budget_recomputation (parity); priority_attack_
       results (fail-closed); prohibited_feature_findings (no leakage); false_intervention_
       recomputation (safe proposals); certificate_findings (local conflict truth); hard_safety_
       supported (separate from utility); utility_claim_supported (row-derived); source_verdict_
       supported (closed decision); selective_arbiter_audit_completed (exact downstream field);
       gate_check_summary (blocked diagnostic); verifier_is_oracle (false, independent evaluator);
       verdict_class (closed enum: positive | circular_positive | null | blocked | disqualified |
       partial); honest_verdict (terminal and cold-row-supported).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6814_selective_priority_arbiter_cold_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6805-priority-arbiter-cold-audit
      verdict: 'GATE_BLOCKED: pre-emptive skip after exp6803 retired'
      addressed_by: 'The audited producer now has a complete in-roadmap corpus and completion field, and this cold audit adds independent false-intervention reconstruction.'
      retire_if_same_verdict: true

