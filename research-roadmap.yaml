    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed start line. Authenticate source bytes, terminal sidecars and actual authority. Check private scratch, tools and resources before measurement. Record missing external operands as complete_blocked_<operand> with verdict_class=blocked and exact gate_check_summary. Never replace missing observations with fixtures.
    2. Emit a flushed progress line at every phase boundary. Emit one before and after every model load, generation, benchmark and subprocess. Print completed/pending counts inside long loops. Poll owned children with a heartbeat at least every60 seconds. Keep every silence gap below600 seconds. Use unbuffered output and bounded child deadlines. Write any file over about200 lines in several tool calls of at most about150 lines. Send a progress message between calls. No single huge tool call; no artificial runtime padding.
