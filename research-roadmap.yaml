    verdict: blocked_gate_check_failed
    addressed_by: Same pre-test cascade. NSVIF has never actually run in any prior
      milestone.
    retire_if_same_verdict: true
  prompt: "CONTEXT: research-program.md lists \"Rebuild constraint extraction for\
    \ real models\" as\nthe HIGHEST PRIORITY since 2026-04-11. NSVIF (arXiv:2601.17789)\
