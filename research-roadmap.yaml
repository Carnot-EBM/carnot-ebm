- id: exp1239-nrgpt-frozen-prefix-evaluation
  milestone: 2026.04.96
  deliverable: results/experiment_1239_nrgpt_frozen_prefix_evaluation.json
  title: "NRGPT Frozen-Prefix Evaluation — Resolve Non-Monotonicity: Causal-Context vs Non-Conservative"
  agent_type: codex
  model: gpt-5.5
  max_turns: 20
  estimated_wall_time_min: 20
  priority: medium
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1163-nrgpt-energy-native-prototype
      verdict: nrgpt_auroc_above_dbae
      addressed_by: "exp1163 measured AUROC=0.9158 and found n_iters_monotone=False. This is a FOLLOW-UP experiment to resolve WHAT CAUSES the non-monotonicity, not a retry of exp1163. Known-issues.md (2026-05-03) specifies Frozen-Prefix as the diagnostic."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    exp1163 (NRGPT prototype) found n_iters_monotone=False: the NRGPT energy recurrence trace
    does NOT monotonically decrease across iterations. Two competing interpretations exist:
    (b) Pure causal-context shifting — Markov blanket updates beneath each token;
        the first token IS monotonic, prefix energy shifts cause apparent non-monotonicity
    (c) Non-conservative learned preconditioner — NRGPT trades monotonicity for AUROC explicitly;
        even isolated first-token trace is non-monotonic

    Deep Think Q10 specified the diagnostic: re-run NRGPT energy recurrence on only the FIRST
    TOKEN (which has no prefix, so per NRGPT §2.3 IS guaranteed monotonic if (b) dominates).
    If first-token isolated trace is monotonic → (b) dominant.
    If still non-monotonic → (c) dominant.

    Result affects paper-v6 §4 (NRGPT framing): (b) = "causal multi-agent inference" framing;
    (c) = "learned non-conservative preconditioner" framing (different implications for Phase-3).

    EXISTING CODE TO READ FIRST:
