      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/z3_gated_repair.py`
      TASK: Implement an Eidoku-style structural verification gate.
      CONCRETE STEPS:
      1. Create `EidokuGate` in `python/carnot/pipeline/eidoku_gate.py` that computes structural violation costs over constraint graphs.
      2. Write unit tests.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

