    \   - PottsState(q: int = 3): represents one q-state spin as int in (0,..,q-1)\n\
    \   - PottsCoupling(J: jnp.ndarray): coupling matrix for q-state system;\
    \ energy contribution = sum_(i,j) J[s_i, s_j, i, j]\n\
    \   - PottsMachineVerifier(n_spins: int, q: int = 3):\n\
    \     energy(config: jnp.ndarray) -> float:\
    \ sum coupling energies over current spin config\n\
    \     gibbs_update(config: jnp.ndarray, beta: float = 1.0) -> jnp.ndarray:\
    \ one Gibbs sweep over all spins, updating each by computing q marginals\n\
    \     sample(n_steps: int = 100) -> jnp.ndarray:\
