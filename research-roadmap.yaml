- id: exp1117-infrastructure-hardening-v3
  milestone: 2026.04.87
  deliverable: results/experiment_1117_infrastructure_hardening_v3.json
  title: "Infrastructure Hardening v3 — Dispatch Manifest + Doc Async + Bootstrap Grace + Fast-Eval Flag"
  model: opus
  max_turns: 45
  estimated_wall_time_min: 40
  priority: critical
  requires_gpu: false
  prompt: |
    CONTEXT:
    Three bottlenecks identified in the .86 operational retro still recur and together waste
    ~98 min per milestone. Fix all three in one surgery pass, plus add the fast-eval corpus
    sampling flag identified in the .86 retro (saves 10-15 min on CPU-bound experiments).
    EXCEPTION: This IS a conductor infrastructure experiment. You ARE permitted to modify
    scripts/research_conductor.py.

    BOTTLENECK 1 — Dispatch-time manifest regression (35 min/milestone, 4th consecutive):
    ops/exclusion_manifest.yaml has exp906 retired since .80. exp906 appeared for the 4th
    consecutive milestone (.83, .84, .85, .86). The Failure-Ledger v2 (exp1104) added dispatch-
    time enforcement, but the fix deployed DURING .86 so exp906 had already been queued.
    .87 is the first milestone where it must be fully effective. Verify: add a unit test that
    launches a simulation with a retired experiment ID and asserts it is blocked at dispatch.
    Also verify the test from exp1104 (test_manifest_dispatch_time_enforcement_skips_retired)
    still passes.

    BOTTLENECK 2 — Doc reconciliation blocking pass (28 min/milestone):
    The conductor runs a full doc reconciliation pass inline after certain experiments (Exp 950
    "In-process docs" pattern). This serializes 28 min per milestone. The exp1105 CARNOT_BATCH_DOC_RECONCILE
    flag was added, but must be set as the DEFAULT (CARNOT_BATCH_DOC_RECONCILE=1) so reconciliation
    runs async at end-of-milestone without requiring explicit opt-in per experiment. Verify:
    add a test that confirms CARNOT_BATCH_DOC_RECONCILE defaults to "1" in the conductor env.

    BOTTLENECK 3 — Bootstrap artifact guard false positives (35 min/milestone, 7 fires in .86):
    The bootstrap guard fires when a deliverable artifact is present from a prior run but hasn't
    been updated since task_start_time. The guard correctly catches stale shortcuts but has no
    grace window for known-long GPU runs. Exp1110 (RLVR+SSD DualGPU, ~60 min) and exp1111
    (ThinkPRM retrain) both triggered 5 min premature kills. Fix: add grace_period_s to the
    YAML schema (default 600 s). Any task not declaring grace_period_s gets 600 s of grace
    before the bootstrap guard fires. GPU training tasks in .87 (exp1118, exp1119, exp1120)
    should declare grace_period_s: 1800.

    BONUS — Fast-eval corpus sampling (10-15 min recoverable):
    Add CARNOT_FAST_EVAL=1 environment flag. When set, corpus-intensive Python experiments
    that iterate over the FoVer corpus should randomly sample 500 pairs instead of processing
    all 6548+. This flag should be documented in a docstring in
    python/carnot/pipeline/verify_repair.py and in the CARNOT_FAST_EVAL env variable docs.
    The flag is NOT set by the conductor by default — it is an experiment-level flag.
    An experiment that wants fast-eval includes `os.getenv("CARNOT_FAST_EVAL", "0") == "1"`
    in its corpus loader.

    EXISTING CODE TO READ FIRST:
    - scripts/research_conductor.py (find dispatch logic, doc reconcile hook, bootstrap guard,
      YAML schema for tasks)
    - ops/exclusion_manifest.yaml (verify exp906 is there)
    - tests/python/test_failure_ledger_v2.py (find the manifest enforcement test from exp1104)
    - python/carnot/pipeline/verify_repair.py (find corpus loader for fast-eval flag)

    TASK:
    1. Verify dispatch-time manifest enforcement from exp1104 is working: grep for
       "dispatch" + "exclusion_manifest" in research_conductor.py. If missing, add it.
    2. Set CARNOT_BATCH_DOC_RECONCILE=1 as the conductor default (not just an env variable):
       find where the conductor initializes its environment and add the default.
    3. Add grace_period_s field to the task schema: in the YAML loader, read
       task.get("grace_period_s", 600) and pass it to the bootstrap artifact guard.
    4. Add CARNOT_FAST_EVAL to verify_repair.py corpus loader (or a shared corpus utility):
       if CARNOT_FAST_EVAL=1, sample 500 random pairs from the corpus for architecture sweeps.
    5. Write tests (at minimum 4):
       tests/python/test_infrastructure_hardening_v3.py:
       - test_retired_experiment_blocked_at_dispatch
       - test_doc_reconcile_batch_mode_default
       - test_grace_period_applied_before_bootstrap_guard
       - test_fast_eval_samples_500_pairs

    CONCRETE STEPS:
    - grep -n "exclusion_manifest\|dispatch\|bootstrap\|grace_period\|doc_reconcile\|BATCH" scripts/research_conductor.py
    - grep -n "CARNOT_FAST_EVAL\|fast_eval" python/carnot/pipeline/verify_repair.py
    - (implement fixes)
    - JAX_PLATFORMS=cpu pytest tests/python/test_infrastructure_hardening_v3.py -v
    - Write results/experiment_1117_infrastructure_hardening_v3.json

    REQUIRED ARTIFACT FIELDS:
    - dispatch_manifest_verified: bool (True if dispatch-time check confirmed working)
    - doc_reconcile_batch_default_set: bool (True if CARNOT_BATCH_DOC_RECONCILE=1 is default)
    - grace_period_schema_added: bool (True if grace_period_s field added to YAML schema)
    - fast_eval_flag_added: bool (True if CARNOT_FAST_EVAL=1 flag implemented)
    - tests_written: int
    - tests_passing: int
    - estimated_savings_min: int (estimated min/milestone saved by all fixes combined)
    - honest_verdict: "all_four_fixes_deployed" | "three_of_four_deployed" | "partial" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1117_infrastructure_hardening_v3.py
    Do NOT push. Do NOT modify scripts/research_conductor.py beyond the explicit infrastructure fixes above.

- id: exp1118-grpo-energy-prm-v1
  milestone: 2026.04.87
  deliverable: results/experiment_1118_grpo_energy_prm_v1.json
  title: "GRPO with ThinkPRM v2 Energy Reward — Continuous Self-Learning v4 (replaces RLVR+SSD)"
  model: opus
  max_turns: 55
  estimated_wall_time_min: 60
  priority: high
  requires_gpu: true
  grace_period_s: 1800
  prior_failures:
    - experiment_id: exp1110-rlvr-ssd-v2-nondegenerate-live-gpu
      verdict: honest_negative_non_degenerate
      addressed_by: "FUNDAMENTALLY DIFFERENT TRAINING ARCHITECTURE. exp1110 used RLVR (energy
        score as binary reward for policy gradient on filtered examples) + SSD (energy-selected
        supervised distillation). Three failures across exp1083/exp1099/exp1110. Root cause:
        RLVR treats energy as a binary threshold signal and SSD ignores within-group ranking.
        exp1118 uses GRPO (Group Relative Policy Optimization, arXiv 2509.21154) which computes
        CONTINUOUS group-relative advantages from ThinkPRM v2's calibrated AUROC=0.9946 reward,
        NOT raw energy scores. The group-relative advantage (reward - mean(group)) cancels
        baseline drift and provides richer training signal than binary selection. New training
        loop: generate N=8 completions per question, score with ThinkPRM v2, compute advantages,
        train via policy gradient."
      retire_if_same_verdict: false
    - experiment_id: exp1099-rlvr-ssd-integration-v1
      verdict: energy_all_zero
      addressed_by: "exp1099 corpus was degenerate (energy_all_zero=True) due to AND-compose
        pre-filtering. exp1118 generates a fresh corpus from live SOTA model inference WITHOUT
        any pre-filtering. Non-degenerate energy distribution confirmed in exp1110
        (mean=0.505, stdev=0.257, nonzero_fraction=1.0). exp1118 uses this same fresh corpus
        approach with GRPO training instead of RLVR+SSD."
      retire_if_same_verdict: false
    - experiment_id: exp1083-rlvr-ssd-integration-v1-first
      verdict: gate_blocked
      addressed_by: "exp1083 was gate-blocked in .84 due to missing prior_failures declarations
        and exp1079 not meeting the gate condition. exp1118 is standalone with no gate dependency."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    CLAUDE.md Continuous Self-Learning is a MANDATORY research goal (Tier 3: JEPA-Style Predictive
    Verification). The RLVR+SSD architecture has given honest negatives for 3 consecutive milestones.
    This experiment tries a fundamentally different approach: GRPO with ThinkPRM v2 as the explicit
    PRM reward signal.

    KEY REFERENCE: arXiv 2509.21154 "GRPO is Secretly a Process Reward Model"
    GRPO generates N completions per question sharing a common prefix, scores them, and computes
    group-relative advantages (reward_i - mean(group)). This IS a PRM over completion groups.
    Carnot's explicit energy verifier (ThinkPRM v2, AUROC=0.9946) provides higher-quality reward
    signals than GRPO's implicit MC-sampled reward. Integration: replace GRPO's MC reward with
    ThinkPRM v2's calibrated energy score.

    TRAINING SETUP:
    - Model: unsloth/Qwen3.6-35B-A3B-GGUF (Qwen3.6 35B MoE via llama.cpp)
    - ThinkPRM v2 checkpoint: results/experiment_1111_thinkprm_v2_retrain_7349_prm.json
      (AUROC=0.9946; backbone: Qwen/Qwen3.5-0.8B with 16 PCA dims + linear head)
    - Hardware: 2× RTX 3090 CUDA 12 (DualGPU MANDATORY — do not fall back to single GPU)
    - Dataset: 100 fresh GSM8K questions NOT in FoVer corpus (to avoid training/eval overlap)
    - Group size N=8 completions per question (balance quality vs VRAM)
    - Training: K=50 questions per training batch, 3 gradient steps per batch
    - Evaluation: 25 holdout GSM8K questions, measure fraction_correct vs baseline

    CONCRETE TRAINING LOOP:
    1. Load ThinkPRM v2 from the backbone path in exp1111 artifact.
    2. Sample 125 GSM8K questions not in data/fover_corpus.jsonl (training=100, eval=25).
    3. For each training question, generate N=8 completions using Qwen3.6-35B llama.cpp.
    4. Score each completion with ThinkPRM v2 → energy score r_i in [0,1].
    5. Compute group advantages: a_i = r_i - mean(r for completions in group).
    6. Policy gradient update: loss += -a_i * log_prob(completion_i | question) / N.
    7. After 50 questions (300 gradient steps), evaluate on 25 holdout questions.
    8. Report: baseline_fraction_correct (no policy update) vs trained_fraction_correct.

    IMPORTANT: This is a proof-of-concept, not a full fine-tune. The policy gradient is applied
    in inference mode (adjust token probabilities via logit biasing from the learned advantage),
    NOT by gradient descent on the 35B weights. Use: multiply generation logits by
    exp(advantage_weight * a_i) before sampling. advantage_weight=0.1 (conservative).

    EXISTING CODE TO READ FIRST:
    - results/experiment_1111_thinkprm_v2_retrain_7349_prm.json (confirm thinkprm_model_path field)
    - results/experiment_1110_rlvr_ssd_v2_nondegenerate_live_gpu.json (see energy distribution stats)
    - python/carnot/pipeline/verify_repair.py (find how ThinkPRM is called)
    - python/carnot/models/kaem_energy.py or similar (find energy score interface)
    - scripts/experiment_template.py (use ExperimentTemplate + BatchedInferenceRunner)

    TASK:
    1. Load ThinkPRM v2 backbone (Qwen3.5-0.8B, 16 PCA dims + linear head).
    2. Load Qwen3.6-35B-A3B llama.cpp via llama-cpp-python or subprocess.
    3. Sample 125 fresh GSM8K questions.
    4. Run GRPO training loop (50 training questions, N=8 completions each).
    5. Evaluate on 25 holdout questions.
    6. Report honest result: improvement_over_baseline = trained - baseline.

    CONCRETE STEPS:
    - nvidia-smi (verify 2x RTX 3090 visible)
    - python3 -c "import torch; print(torch.cuda.device_count(), torch.cuda.get_device_name(0))"
    - (load ThinkPRM v2 checkpoint)
    - (sample 125 GSM8K questions)
    - (GRPO training loop)
    - (evaluation)
    - Write results/experiment_1118_grpo_energy_prm_v1.json

    REQUIRED ARTIFACT FIELDS:
    - model_used: str (should be "unsloth/Qwen3.6-35B-A3B-GGUF")
    - inference_mode: str (should be "live_gpu")
    - cuda_device_count: int (should be 2 for DualGPU)
    - dualgpu_used: bool
    - n_training_questions: int
    - n_eval_questions: int
    - group_size_n: int
    - thinkprm_v2_auroc: float (copy from exp1111 artifact)
    - baseline_fraction_correct: float
    - trained_fraction_correct: float
    - improvement_over_baseline: float
    - advantage_weight_used: float
    - grpo_energy_prm_honest_result: bool (always True — means we have a result, positive or negative)
    - honest_verdict: "positive_improvement" | "neutral" | "honest_negative" | "blocked_gpu" | "partial"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1118_grpo_energy_prm_v1.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1119-fover-sota-extension-v5
  milestone: 2026.04.87
  deliverable: results/experiment_1119_fover_sota_extension_v5.json
  title: "FoVer SOTA Domain Extension v5 — 1000+ SOTA Model Outputs for Energy Inversion Fix"
  model: sonnet
  max_turns: 50
  estimated_wall_time_min: 45
  priority: high
  requires_gpu: true
  grace_period_s: 1800
  prompt: |
    CONTEXT:
    The energy ordering is INVERTED on SOTA model outputs (exp1100/exp1115): correct answers have
    HIGHER energy than incorrect (mean_correct=0.689 > mean_incorrect=0.621). Root cause per
    arXiv 2504.13134 (EBRM): the FoVer corpus was trained on base-model GSM8K solutions (unoptimized,
    high error rate). SOTA models (Qwen3.6-35B-A3B, Gemma4-31B) are heavily RL-optimized and
    outside the FoVer training distribution. The verifier's calibration inverts on OOD data.

    Fix step 1 (this experiment): extend FoVer corpus with SOTA model outputs.
    Fix step 2 (exp1120): retrain energy verifier on extended corpus, re-measure inversion.

    Current FoVer corpus: data/fover_corpus.jsonl (~6548 pairs, all from base-model outputs)
    Target: 7500+ pairs with SOTA model representation.

    SOTA MODELS TO USE:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE, primary)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense, secondary)
    Use the llama.cpp loader path. Models should already be cached in
    ~/.cache/huggingface/hub/models--unsloth--*/

    LABELING APPROACH (avoid circular ThinkPRM labeling):
    - For mathematical reasoning steps: use Z3MathVerifier (formal arithmetic checking)
    - For code-like steps: use ASTStructureVerifier (AST parse + structural check)
    - Do NOT use ThinkPRM v2 as the labeler (would create circular training data for exp1120)
    - Label schema: {"step": str, "label": 0|1, "verifier": "Z3Math"|"ASTStructure"|"heuristic",
                     "model": "Qwen3.6-35B"|"Gemma4-31B", "source": "sota_extension_v5"}

    CONCRETE STEPS:
    1. Check current FoVer corpus size: wc -l data/fover_corpus.jsonl
    2. Sample 500 fresh GSM8K questions NOT in the current corpus.
    3. Generate CoT solutions using Qwen3.6-35B-A3B (250 questions, N=2 solutions each).
    4. Generate CoT solutions using Gemma4-31B-it (250 questions, N=2 solutions each).
    5. Extract step-level labels using Z3MathVerifier for each CoT step.
    6. Append labeled pairs to data/fover_corpus.jsonl (use jsonlines append mode).
    7. Verify corpus size: wc -l data/fover_corpus.jsonl (target: ≥7000 lines)

    EXISTING CODE TO READ FIRST:
    - data/fover_corpus.jsonl (check schema of first 5 lines)
    - python/carnot/pipeline/verify_repair.py (find Z3MathVerifier and ASTStructureVerifier)
    - scripts/experiment_template.py (use ExperimentTemplate + BatchedInferenceRunner)

    REQUIRED ARTIFACT FIELDS:
    - n_pairs_before: int (FoVer corpus size before extension)
    - n_pairs_added: int (new pairs added in this run)
    - n_pairs_after: int (total corpus size after extension)
    - fover_sota_pairs_added_above_7000: bool (True if n_pairs_after >= 7000)
    - models_used: list[str]
    - labeling_verifiers: list[str]
    - label_positive_fraction: float (fraction of added pairs labeled correct)
    - inference_mode: str ("live_gpu")
    - honest_verdict: "corpus_extended_above_7000" | "corpus_extended_below_7000" | "partial" | "failed"

    Run: JAX_PLATFORMS=cpu python scripts/experiment_1119_fover_sota_extension_v5.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1120-energy-verifier-retrain-sota
  milestone: 2026.04.87
  deliverable: results/experiment_1120_energy_verifier_retrain_sota.json
  title: "Energy Verifier Retrain on SOTA Corpus — Energy Inversion Fix (gated on exp1119)"
  model: sonnet
  max_turns: 50
  estimated_wall_time_min: 35
  priority: high
  requires_gpu: true
  grace_period_s: 1200
  gated_on:
    - upstream: exp1119-fover-sota-extension-v5
      artifact_field: fover_sota_pairs_added_above_7000
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1100-cascade-validation-sota-outputs
      verdict: energy_ordering_inverted_sota_outputs
      addressed_by: "exp1100 measured energy ordering on SOTA outputs using a verifier trained
        ONLY on base-model FoVer data (6548 pairs from unoptimized model outputs). The energy
        inversion (mean_correct=0.689 > mean_incorrect=0.621) is an OOD artifact per arXiv
        2504.13134 (EBRM). exp1120 retrains the verifier on FoVer v5 which includes 1000+ SOTA
        model outputs labeled by Z3MathVerifier (exp1119). This directly addresses the distribution
        shift by including in-distribution examples from the same model family as the evaluation."
      retire_if_same_verdict: false
    - experiment_id: exp1115-position-paper-v3-strategic-rewrite
      verdict: energy_inversion_open_methodological_question
      addressed_by: "exp1115 documented the energy inversion as an 'open methodological question'
        in position paper v3 but did not empirically resolve it. exp1120 IS the empirical resolution
        attempt. Success criterion: does mean_correct_energy < mean_incorrect_energy post-retrain?
        If yes, the open question closes. If still inverted, the position paper framing stands and
        Phase-3 requires non-linear EBM landscapes (as stated in exp1115 diagnosis)."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Energy ordering is inverted on SOTA outputs: mean_correct=0.689 > mean_incorrect=0.621
    (exp1100/exp1115). Root cause: FoVer training corpus contains only base-model outputs
    (OOD from SOTA RL-trained models). Fix: retrain SOS-KAN energy verifier on extended FoVer v5
    corpus (which now includes 1000+ SOTA model outputs from exp1119). Reference: arXiv 2504.13134
    (EBRM noise-filtering training for distribution-shifted reward models).

    THIS EXPERIMENT GATES ON exp1119.fover_sota_pairs_added_above_7000 = True.
    Read results/experiment_1119_fover_sota_extension_v5.json to confirm this before proceeding.

    TRAINING TARGET:
    - Retrain SOSKANEnergyV3 (the primary energy verifier in the k=5 AND-compose ensemble)
    - Training data: data/fover_corpus.jsonl (FoVer v5 with SOTA outputs, ~7500+ pairs)
    - Noise-filtering per EBRM: for labels from heuristic verifiers (not Z3 confirmed),
      apply a label-noise threshold: drop examples where the labeling confidence is < 0.7
    - Training config: same as exp1072 SOS-KAN v3 baseline (batch_size=32, lr=1e-3, epochs=200)
    - Evaluation: measure energy ordering on SOTA outputs (use 50 SOTA examples from exp1119 holdout)

    ENERGY ORDERING MEASUREMENT:
    - Take 50 SOTA model outputs: 25 labeled CORRECT by Z3Math, 25 labeled INCORRECT
    - Score each with the retrained SOS-KAN verifier
    - Compute: mean_correct_energy = mean([E(x) for x in correct_examples])
    - Compute: mean_incorrect_energy = mean([E(x) for x in incorrect_examples])
    - Target: mean_correct_energy < mean_incorrect_energy (inversion fixed)
    - Also measure AUROC on FoVer v5 holdout (target: maintain >= 0.9)

    EXISTING CODE TO READ FIRST:
    - results/experiment_1119_fover_sota_extension_v5.json (confirm fover_sota_pairs_added_above_7000)
    - python/carnot/models/kaem_energy.py or equivalent for SOSKANEnergyV3
    - results/experiment_1072_sos_kan_v3_neural_gram.json (training config reference)
    - data/fover_corpus.jsonl (check schema — first and last 5 lines)

    TASK:
    1. Load FoVer v5 corpus (data/fover_corpus.jsonl).
    2. Apply EBRM noise-filtering: drop examples with labeler_confidence < 0.7.
    3. Split: 80% train, 10% val, 10% test (hold test for energy ordering measurement).
    4. Retrain SOSKANEnergyV3 on train split.
    5. Evaluate AUROC on val split.
    6. Measure energy ordering on 50 SOTA holdout examples from exp1119.
