- id: exp832-jepa-arc-collapse-diagnosis
  milestone: 2026.04.64
  deliverable: results/experiment_832_jepa_arc_collapse_diagnosis.json
  title: 'Exp 832: JEPA v23 ARC Domain Collapse Diagnosis (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 825 showed JEPA v23 collapses on ARC-Challenge: auc_arc=0.04 (below random),
    auc_humaneval=0.76, auc_gsm8k=0.36. This is surprising because Exp 824 showed training
    eval OOD AUC=0.811. Root cause hypothesis: the LIMO corpus had zero ARC training examples,
    causing the model to systematically misclassify all ARC planning steps.

    EXISTING CODE TO READ FIRST:
    - results/experiment_824_jepa_v23_limo_corpus.json — model checkpoint path, training corpus
    - results/experiment_825_jepa_v23_eval_fr11_tier3.json — per-domain AUC breakdown
    - python/carnot/pipeline/jepa_predictor.py or similar — JEPAPredictor class
    - python/carnot/pipeline/eorm_model.py — EORMModel for feature extraction
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN entries

    TASK: Load JEPA v23 weights, extract feature statistics per domain, identify why ARC collapses.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Load JEPA v23 from checkpoint (results/experiment_824_jepa_v23_limo_corpus.json,
       look for checkpoint_path or model_weights field).
    3. Generate 10 synthetic test steps per domain (CPU, no GPU needed):
       - GSM8K: arithmetic CoT steps (e.g., "Step 1: 47 + 28 = 75, carry 1" — label: correct)
       - HumanEval: code steps (e.g., "def add(a, b): return a + b" — label: correct)
       - ARC-Challenge: planning steps (e.g., "Since A implies B and B implies C, we conclude A
         implies C" — label: correct) vs wrong planning steps (label: incorrect)
    4. For each step: compute JEPA prediction score, EORM energy, and 8-dimensional feature vector.
    5. Analysis:
       a. Compute mean JEPA score per domain for correct steps and incorrect steps.
       b. Compute variance of JEPA scores per domain.
       c. For ARC: if mean_score_correct ~= mean_score_incorrect (~0.5), model is uncertain.
          If mean_score_correct < mean_score_incorrect (inverted), ARC is anti-correlated.
       d. Compute feature vector norms per domain — are ARC features near-zero?
    6. Build diagnosis_finding dict: {domain: {mean_score_correct, mean_score_incorrect,
       variance, feature_norm, is_anti_correlated, is_uncertain, n_arc_training_pairs}}.
    7. Recommendation: "add N ARC training pairs in Exp 834" or "rebalance loss weights".
    8. Add to openspec/capabilities/autoresearch/spec.md:
       REQ-LEARN-047: JEPA training corpus MUST contain >= 10 samples per reasoning domain
       (arithmetic, code, planning). Domain coverage failure causes systematic AUC collapse.
       SCENARIO-LEARN-059: JEPA trained with 0 ARC samples; deployment AUC on ARC < 0.10.
       Diagnosis: ARC feature vectors outside training distribution.
    9. Create scripts/experiment_832_jepa_arc_diagnosis.py using ExperimentTemplate(832).
       ExperimentTimeoutWatchdog(832, timeout_minutes=30).
       Write results/experiment_832_jepa_arc_collapse_diagnosis.json.
    10. honest_verdict:
        - "arc_diagnosis_found" if ARC is_anti_correlated or feature_norm near-zero
        - "arc_diagnosis_uncertain" if cannot determine root cause
        - "arc_unexpected_viable" if ARC scores are actually reasonable (unexpected)
    11. Write tests/python/test_experiment_832_jepa_arc_diagnosis.py with 100% coverage.
        Traces to REQ-LEARN-047, SCENARIO-LEARN-059.
    12. Reconcile ops/changelog.md and ops/status.md.
    13. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_832_jepa_arc_diagnosis.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp833-constraint-delta-root-cause
  milestone: 2026.04.64
  deliverable: results/experiment_833_constraint_delta_root_cause.json
  title: 'Exp 833: Constraint Accumulation Root Cause Diagnosis (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 821 ran constraint accumulation with the external field injection fix from
    Exp 819. Result: delta_overall=0.0 across 3 sessions of 30 GSM8K questions.
    Three hypotheses for why delta=0 despite injection fix:
    H1: VerifyRepairPipeline detects violations but never calls EmbeddingConstraintStore.write().
    H2: EmbeddingConstraintStore.write() is called but retrieval returns zero-vectors.
    H3: compute_energy_with_external_field is never called; legacy energy() path used instead.
    This experiment instruments the pipeline to find which hypothesis is correct.

    EXISTING CODE TO READ FIRST:
    - results/experiment_821_constraint_addition_live_v2.json — delta_overall=0.0
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.verify()
    - python/carnot/pipeline/embedding_constraint_store.py — EmbeddingConstraintStore
    - python/carnot/pipeline/ising_constraint_injector.py — compute_energy_with_external_field
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN entries

    TASK: Add instrumentation to identify which pipeline stage breaks constraint accumulation.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add instrumentation to VerifyRepairPipeline.verify() WITHOUT changing behavior:
       - Before and after EmbeddingConstraintStore operations: log call counts
       - Track: n_store_write_calls, n_store_retrieve_calls, mean_retrieved_vector_norm,
         n_external_field_calls, n_legacy_energy_calls
       - Use a simple in-memory counter dict passed as optional debug_counters param
    3. Create test runner: 5 synthetic GSM8K questions with KNOWN violations
       (e.g., "Step 1: 47 + 28 = 76 (correct)" [fake correct], "Step 2: sum = 76 + 15 = 90")
       where ground_truth_correct = [False, True, True, False, True].
    4. Run the test with debug_counters:
       session = EmbeddingConstraintStore()
       pipeline = VerifyRepairPipeline(constraint_store=session, debug_counters=counters)
       results = [pipeline.verify(q, answer) for q, answer in test_cases]
    5. Examine counters after run:
       - If n_store_write_calls == 0: H1 confirmed (write never called)
       - If n_store_write_calls > 0 AND mean_retrieved_vector_norm < 0.01: H2 confirmed
       - If n_external_field_calls == 0 AND n_legacy_energy_calls > 0: H3 confirmed
    6. Also check: does VerifyRepairPipeline.__init__ accept a constraint_store parameter?
       If not, the store is never passed in — H1 structural issue.
    7. Add to openspec/capabilities/autoresearch/spec.md:
       REQ-LEARN-048: VerifyRepairPipeline MUST call EmbeddingConstraintStore.write() with
       detected violations when enable_constraint_accumulation=True.
       REQ-LEARN-049: VerifyRepairPipeline MUST route energy computation through
       compute_energy_with_external_field when IsingConstraintInjector is provided.
       SCENARIO-LEARN-060: Pipeline detects 2 violations; EmbeddingConstraintStore.write()
       called exactly 2 times; n_store_write_calls == 2.
    8. Create scripts/experiment_833_constraint_delta_root_cause.py using ExperimentTemplate(833).
       ExperimentTimeoutWatchdog(833, timeout_minutes=30).
       Write results/experiment_833_constraint_delta_root_cause.json with:
       {hypothesis_confirmed, n_store_write_calls, n_store_retrieve_calls,
       mean_retrieved_vector_norm, n_external_field_calls, n_legacy_energy_calls,
       root_cause, fix_recommendation}
    9. honest_verdict:
       - "write_path_missing" if n_store_write_calls == 0
       - "retrieval_returns_zeros" if writes>0 but vector_norm < 0.01
       - "external_field_not_called" if legacy_energy_calls > 0 AND external_field_calls == 0
       - "pipeline_wiring_correct" if write+retrieve+external_field all correct
       - "diagnosis_inconclusive" if cannot determine
    10. Write tests/python/test_experiment_833_constraint_root_cause.py with 100% coverage.
        Traces to REQ-LEARN-048, REQ-LEARN-049, SCENARIO-LEARN-060.
    11. Reconcile ops/changelog.md and ops/status.md.
    12. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_833_constraint_root_cause.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp834-jepa-v24-dg-prm-domain-balanced
  milestone: 2026.04.64
  deliverable: results/experiment_834_jepa_v24_dg_prm.json
  title: 'Exp 834: JEPA v24 DG-PRM Domain-Balanced Training (RETRO-JEPA-OOD, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA v23 collapsed on ARC (AUC=0.04) because the LIMO corpus had zero ARC
    training examples. Exp 832 diagnosed the root cause. This experiment builds JEPA v24 with:
    1. Balanced corpus: 20 GSM8K + 20 HumanEval + 20 ARC + 10 SVAMP = 70 pairs
    2. DG-PRM domain reweighting (arXiv 2507.17849): domain classifier head
    3. DreamPRM per-domain loss weighting (arXiv 2505.20241): upweight rare domains
    4. ΔEnergy triplet loss (arXiv 2510.11296): weight by energy-delta magnitude

    EXISTING CODE TO READ FIRST:
    - results/experiment_832_jepa_arc_collapse_diagnosis.json — domain diagnosis, feature stats
    - results/experiment_824_jepa_v23_limo_corpus.json — v23 architecture, training code
    - python/carnot/pipeline/jepa_predictor.py or equivalent — JEPAPredictor class
    - python/carnot/pipeline/eorm_model.py — EORMModel for feature extraction
    - research-references.md — DG-PRM (2507.17849), DreamPRM (2505.20241), ΔEnergy (2510.11296)
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN entries

    TASK: Train JEPA v24 with domain-balanced corpus and domain reweighting. Target: all
    per-domain AUCs > 0.55. Write results/experiment_834_jepa_v24_dg_prm.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Assert domain coverage in corpus builder: `assert n_arc_pairs >= 10` at start.
    3. Build balanced corpus:
       a. GSM8K (20 pairs): arithmetic CoT correct/incorrect steps. Use FoVer-labeled
          results from prior sessions if available; otherwise generate synthetically with
          Z3-verified arithmetic (correct: a+b=c where c==a+b; incorrect: c!=a+b).
       b. HumanEval (20 pairs): code correct/incorrect steps from Exp 820 results
          or synthetic (correct: return a+b; incorrect: return a-b).
       c. ARC-Challenge (20 pairs): CRITICAL — planning steps.
          Generate: correct = deductive syllogism step (If A→B and B→C, then A→C),
          incorrect = invalid deduction (If A→B, then B→A). Use at least 5 different
          syllogism patterns for variety.
       d. SVAMP (10 pairs): word problem arithmetic steps similar to GSM8K but different
          phrasing. Helps generalization.
    4. Implement DG-PRM domain head in JEPAPredictor:
       - Add 4-class softmax domain classifier alongside binary correctness head
       - At training: jointly train correctness + domain labels
       - At inference: multiply correctness_score by domain_weight[predicted_domain]
       - Domain weights initialized: {gsm8k: 1.0, humaneval: 1.5, arc: 3.0, svamp: 1.5}
         (ARC gets 3x because it has historically lowest AUC)
    5. DreamPRM per-domain loss weighting:
       - Compute per-domain validation loss from Exp 825: arc=highest loss, gsm8k=medium
       - Set loss_weight per domain proportional to validation loss
       - arc_weight = 5.0, humaneval_weight = 1.5, gsm8k_weight = 1.0, svamp_weight = 1.5
    6. ΔEnergy triplet weighting:
       - For each triplet (anchor, positive, negative): compute energy delta =
         |EORM_energy(negative) - EORM_energy(positive)|
       - Weight triplet loss by energy_delta (higher gap = clearer example = higher weight)
       - Clamp weights to [0.5, 3.0] to prevent degenerate cases
    7. Train 200 epochs with triplet loss + domain reweighting + delta weighting.
    8. Evaluate: per-domain AUC on held-out set (20% of corpus).
       Report: auc_gsm8k, auc_humaneval, auc_arc, auc_svamp, overall_ood_auc.
       min_domain_auc = min(auc_gsm8k, auc_humaneval, auc_arc, auc_svamp).
    9. Add to openspec/capabilities/autoresearch/spec.md:
       REQ-LEARN-050: JEPA training MUST use domain-reweighted loss with ARC weight >= 3.0
       when ARC is not represented in prior training data.
       SCENARIO-LEARN-061: JEPA v24 trained with DG-PRM; ARC AUC improves from 0.04 to > 0.55.
    10. Create scripts/experiment_834_jepa_v24_dg_prm.py using ExperimentTemplate(834).
        ExperimentTimeoutWatchdog(834, timeout_minutes=60).
        Save checkpoint: tmpl.checkpoint_save({"model_state": ...}, step=100).
        Write results/experiment_834_jepa_v24_dg_prm.json with: auc_gsm8k, auc_humaneval,
        auc_arc, auc_svamp, overall_ood_auc, min_domain_auc, domain_weights_used,
        corpus_composition, retro_jepa_ood_improving (True if min_domain_auc > 0.55).
    11. honest_verdict:
        - "jepa_v24_domain_balanced" if min_domain_auc > 0.55
        - "jepa_v24_improvement" if overall_ood_auc > 0.65 but min_domain_auc <= 0.55
        - "jepa_v24_arc_improved" if auc_arc > 0.40 (progress even if below gate)
        - "jepa_v24_still_unbalanced" if auc_arc <= 0.40
    12. Write tests/python/test_experiment_834_jepa_v24_dg_prm.py with 100% coverage.
        Traces to REQ-LEARN-047, REQ-LEARN-050, SCENARIO-LEARN-059, SCENARIO-LEARN-061.
    13. Reconcile ops/changelog.md, ops/status.md, _bmad/traceability.md (FR-11 status).
    14. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_834_jepa_v24_dg_prm.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp835-arbiter-calibration-fix-v2
  milestone: 2026.04.64
  deliverable: results/experiment_835_arbiter_calibration_fix_v2.json
  title: 'Exp 835: Multi-Agent Arbiter Energy Calibration Fix v2 (RETRO-ARBITER-FLAT-ENERGY, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 822 showed arbiter_still_wrong with accuracy_standard=0.17. Analysis:
    energies ARE non-zero (range -0.07 to +0.23) but arbiter still picks wrong answers in
    standard scenarios. Root cause: MultiAgentArbiter.score_agent_outputs() calls legacy
    IsingEBM.energy() instead of compute_energy_with_external_field. Additionally, the
    energy magnitudes are small and vary per-query, so the arbiter needs per-query normalization.

    EXISTING CODE TO READ FIRST:
    - results/experiment_822_arbiter_fix_v2_agent_auditor.json — scenario results, raw energies
    - python/carnot/inference/multi_agent_arbiter.py — MultiAgentArbiter class
    - python/carnot/pipeline/ising_constraint_injector.py — compute_energy_with_external_field
    - python/carnot/verify/ising_ebm.py — IsingEBM.energy() (legacy)
    - openspec/capabilities/pipeline/spec.md — REQ-VERIFY entries

    TASK: Fix arbiter to use external field energy + per-query z-score normalization.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. In python/carnot/inference/multi_agent_arbiter.py:
       a. Find the energy scoring call (likely `energy = self.ising_model.energy(response)`)
       b. Replace with: `result = self.injector.compute_energy_with_external_field(J, spins, embeddings)`
          where J is the IsingEBM coupling matrix and spins/embeddings are derived from the response.
       c. Add `injector: Optional[IsingConstraintInjector] = None` parameter to __init__.
          If injector is None: fall back to legacy IsingEBM.energy() (backward compat).
       d. Add per-query z-score normalization: for N agent responses to same query,
          compute mu = mean(energies), sigma = std(energies).
          If sigma > 1e-6: normalized_energies = (energies - mu) / sigma.
          If sigma <= 1e-6: normalized_energies = energies (all same = random tie-break).
       e. Arbiter selects agent with LOWEST normalized energy (lowest = best = least violation).
    3. Add sign convention validation: unit test that correct response has lower energy than
       wrong response for a known arithmetic error case.
    4. Add to openspec/capabilities/pipeline/spec.md:
       REQ-VERIFY-143: MultiAgentArbiter MUST use IsingConstraintInjector.compute_energy_with_external_field
       when injector is provided, not the legacy IsingEBM.energy() method.
       REQ-VERIFY-144: MultiAgentArbiter MUST z-score normalize per-query energies before ranking.
       SCENARIO-VERIFY-172: 3 agents, 2 wrong (high energy), 1 correct (low energy);
       arbiter returns correct agent in >= 4/6 standard scenarios.
    5. Create scripts/experiment_835_arbiter_calibration_fix_v2.py using ExperimentTemplate(835).
       ExperimentTimeoutWatchdog(835, timeout_minutes=30).
       Re-run the 12 scenarios from Exp 822 (6 standard + 6 adversarial) with fixed arbiter.
       Report: accuracy_standard, accuracy_adversarial, accuracy_overall.
       Record per-scenario: energies_raw, energies_normalized, arbiter_index, is_correct.
       Write results/experiment_835_arbiter_calibration_fix_v2.json.
    6. honest_verdict:
       - "arbiter_calibrated" if accuracy_standard >= 0.67
       - "arbiter_partial" if accuracy_standard in [0.50, 0.67)
       - "arbiter_improvement" if accuracy_standard > 0.17 (Exp 822 baseline) but < 0.50
       - "arbiter_still_wrong" if accuracy_standard <= 0.17
    7. Write tests/python/test_experiment_835_arbiter_calibration_v2.py with 100% coverage.
       Traces to REQ-VERIFY-143, REQ-VERIFY-144, SCENARIO-VERIFY-172.
    8. Reconcile ops/changelog.md and ops/status.md.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_835_arbiter_calibration_v2.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp836-constraint-accumulation-fix-v3
  milestone: 2026.04.64
  deliverable: results/experiment_836_constraint_accumulation_fix_v3.json
  title: 'Exp 836: Constraint Accumulation Fix v3 (RETRO-CONSTRAINT-ZERO-DELTA, GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: This experiment is GATED on Exp 833 root_cause_found (any diagnosis other than
    "pipeline_wiring_correct" or "diagnosis_inconclusive"). Read
    results/experiment_833_constraint_delta_root_cause.json first. If honest_verdict is
    "pipeline_wiring_correct", write a blocked artifact: the delta=0 issue is elsewhere.

    The fix targets whatever root cause Exp 833 identified:
    - "write_path_missing": add EmbeddingConstraintStore.write() call in VerifyRepairPipeline
    - "retrieval_returns_zeros": fix sentence-transformer initialization in EmbeddingConstraintStore
    - "external_field_not_called": wire compute_energy_with_external_field into verify() path

    After fix: validate on live GPU with 30 GSM8K × 3 sessions.

    EXISTING CODE TO READ FIRST:
    - results/experiment_833_constraint_delta_root_cause.json — root_cause, fix_recommendation
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
    - python/carnot/pipeline/embedding_constraint_store.py — EmbeddingConstraintStore
    - python/carnot/pipeline/ising_constraint_injector.py — compute_energy_with_external_field
    - research-references.md — Schema-Constrained Memory (2604.20117)
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN-048, REQ-LEARN-049

    TASK: Apply root-cause fix, validate on live GPU (30 GSM8K × 3 sessions).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_833_constraint_delta_root_cause.json.
       If honest_verdict in ["pipeline_wiring_correct", "diagnosis_inconclusive"]:
         write blocked artifact: {blocked: True, gate: "exp833_no_root_cause",
         honest_verdict: "blocked_no_diagnosis"}.
