      addressed_by: "Empirically validates DT-MCMC-STATELESS χ²-penalty
                     argument and rules out cached-state as deployment
                     pattern."
  prompt: |
    Per Deep Think DT-MCMC-STATELESS: Carnot's API payload {prompt,
    candidate} contains a structurally valid warm start. Predicted
    χ² penalty for cold-start at K=100 dominates accuracy; cached
    state from a different prompt acts as adversarial initialization.

    Empirically benchmark three init policies on the now-vendored
    THRML block-Gibbs sampler.

    SETUP:
    - Held-out verification corpus: N ≥ 200 (prompt, candidate,
      oracle_verdict) tuples spanning correct/incorrect/edge cases
    - THRML block-Gibbs (vendored from exp1564), K ∈ {10, 50, 100,
