- id: exp983-langevin-sb-boltzmann-sampler
  milestone: 2026.04.76
  deliverable: results/experiment_983_langevin_sb_boltzmann_sampler.json
  title: "Langevin SB Parallelizable Boltzmann Sampler — arXiv 2512.02323 Implementation"
  prompt: |
    CONTEXT:
    arXiv 2512.02323 (December 2025) introduces Langevin Stochastic Boltzmann (LSB) sampler:
    a parallelizable Boltzmann sampling method using Langevin dynamics rather than sequential
    Gibbs sampling. Key advantages for Carnot:
    - All spins update simultaneously (no checkerboard ordering needed)
    - Langevin update: s_i += lr * h_i + sqrt(2*lr/beta) * noise_i
    - Naturally parallel on CPU (vectorized JAX) and FPGA (parallel MAC units)
    - Conditional expectation matching (CEM) for automatic temperature estimation

    Carnot's current parallel Ising sampler (IsingParallelSampler) uses a custom parallel
    Gibbs scheme. LSB provides a principled alternative that should converge faster on
    non-frustrated constraint graphs.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/ising_sampler.py (current IsingParallelSampler)
    - python/carnot/models/ising_tier.py (IsingEBM model using the sampler)
    - tests/python/test_ising_sampler.py (existing tests — must all still pass)

    TASK:
    Implement LangevinSBSampler as an alternative sampler conforming to SamplerBackend protocol:
    1. Implement class LangevinSBSampler(SamplerBackend) in python/carnot/samplers/lsb_sampler.py:
       - update rule: s += lr * h + sqrt(2*lr/beta) * noise (Langevin dynamics)
       - temperature parameter: start from CEM estimate (compute expected energy, adjust beta)
       - parallel across all spins simultaneously (no checkerboard)
    2. Benchmark LangevinSBSampler vs IsingParallelSampler on the existing constraint benchmark:
       - Same 5 constraint problems used in Exp 285 (parallelism benchmark)
       - Measure: convergence iterations to reach target energy, wall-clock time
    3. If LSB converges faster or at same speed: set as the default sampler
       If LSB is slower: keep as optional alternative behind CARNOT_USE_LSB=1 flag
    4. Write unit tests in tests/python/test_lsb_sampler.py (100% coverage required)
    5. Run cargo test --workspace --exclude carnot-python (Rust unaffected, confirm no regression)

    JAX_PLATFORMS=cpu for reproducibility (per CLAUDE.md).

    Write results/experiment_983_langevin_sb_boltzmann_sampler.json with fields:
      lsb_convergence_iterations: list[int]
      ising_convergence_iterations: list[int]
      lsb_wall_time_s: float
      ising_wall_time_s: float
      lsb_speedup_ratio: float
      lsb_set_as_default: bool
      unit_tests_pass: bool
      honest_verdict: str

    honest_verdict = "lsb_faster_set_default" if lsb_speedup_ratio > 1.0.
    honest_verdict = "lsb_comparable_optional" if lsb_speedup_ratio between 0.8-1.0.
    honest_verdict = "lsb_slower_optional" if lsb_speedup_ratio < 0.8.

    Run: python scripts/experiment_983_langevin_sb_boltzmann_sampler.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: medium
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 60

