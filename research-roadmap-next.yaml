- id: exp800-embedding-constraint-store
  milestone: 2026.04.61
  deliverable: results/experiment_800_embedding_constraint_store.json
  title: 'Exp 800: EmbeddingConstraintStore — SPO Format + Orthogonality (RETRO-CONSTRAINT-ZERO-DELTA, arXiv 2601.15313)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-CONSTRAINT-ZERO-DELTA: Exp 788 constraint_addition_delta=0.0. Root cause
    identified via arXiv 2601.15313 (Semantic Interference): scalar keyword-count encoding of
    carry/sign/unit error patterns causes embedding collapse — semantically similar constraints
    become indistinguishable. Fix: encode constraints as SPO (Subject-Predicate-Object) tuples
    using sentence-transformer embeddings, with orthogonality regularization to prevent
    semantic interference. The sentence-transformer (all-MiniLM-L6-v2) runs on CPU.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/casememory.py (or similar) — existing CaseMemoryTemplateWiring
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline constraint integration
    - results/experiment_788_constraint_addition_from_memory.json — Exp 788 failure details
    - openspec/capabilities/verifiable-reasoning/spec.md — REQ-LEARN entries

    TASK: Implement EmbeddingConstraintStore with SPO format + orthogonality regularization,
    test retrieval AUC on 5 constraint types, export from carnot.pipeline.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/verifiable-reasoning/spec.md:
       - REQ-LEARN-057: EmbeddingConstraintStore MUST encode constraints as SPO tuples
         {subject: str, predicate: str, object: str} using sentence-transformer embeddings.
       - REQ-LEARN-058: EmbeddingConstraintStore MUST apply orthogonality regularization:
         when storing a new constraint embedding e_new, project out components along all
         existing constraint embeddings to reduce semantic interference.
       - REQ-LEARN-059: Retrieval MUST use cosine similarity on SPO embeddings, not keyword
         matching. A query (error context string) retrieves top-K constraint SPO tuples.
       - SCENARIO-LEARN-098: Store 5 constraint types (carry/sign/unit/comparison/causal);
         retrieve by error context; retrieval_auc > 0.70 across all 5 types.
    3. Implement python/carnot/pipeline/embedding_constraint_store.py:
       a. ConstraintSPOTuple dataclass:
          {subject: str, predicate: str, object: str, embedding: list[float] | None,
           source_violation_type: str, timestamp: str}
       b. EmbeddingConstraintStore:
          - __init__(model_name: str = "all-MiniLM-L6-v2"):
            Try to import sentence_transformers. If unavailable (CI), use hash-based
            384-dim dummy embedding. Record embedding_mode: "sentence_transformer" | "ci_hash"
          - _encode(text: str) -> list[float]: encode text as embedding
          - _orthogonalize(new_embedding: list[float]) -> list[float]:
            For each stored embedding e_i:
              projection = dot(new_embedding, e_i) / dot(e_i, e_i)
              new_embedding -= projection * e_i
            Return L2-normalized result
          - store(spo: ConstraintSPOTuple):
            Encode SPO text = f"{spo.subject} {spo.predicate} {spo.object}"
            Apply _orthogonalize(embedding) before storing
            Append to self._store list
          - retrieve(query: str, top_k: int = 3) -> list[ConstraintSPOTuple]:
            Encode query, compute cosine similarity to all stored embeddings
            Return top_k by similarity
          - retrieval_auc(queries: list[str], labels: list[str]) -> float:
            For each query, retrieve top-1. Match if top-1 source_violation_type == label.
            AUC = fraction of correct retrievals.
          - from_casememory_patterns(patterns: dict) -> None:
            Convert existing keyword patterns to SPO format:
              carry → {subject:"arithmetic_carry", predicate:"violates", object:"carry_propagation"}
              sign → {subject:"numeric_sign", predicate:"violates", object:"sign_preservation"}
              unit → {subject:"unit_label", predicate:"violates", object:"unit_consistency"}
              comparison → {subject:"comparison_direction", predicate:"violates", object:"inequality_direction"}
              causal → {subject:"causal_entailment", predicate:"violates", object:"step_causality"}
       c. Export ConstraintSPOTuple, EmbeddingConstraintStore from carnot.pipeline.__init__
    4. Create scripts/experiment_800_embedding_constraint_store.py:
       a. ExperimentTemplate(800) + ExperimentTimeoutWatchdog(800, timeout_minutes=45).
       b. apply_env_autofix() FIRST.
       c. Initialize EmbeddingConstraintStore. Call from_casememory_patterns() to load 5 types.
       d. Build test queries for each constraint type (10 queries each = 50 total).
       e. Compute retrieval_auc(queries, labels).
       f. Compare orthogonalized vs non-orthogonalized retrieval AUC (run both).
       g. honest_verdict:
          - "retrieval_auc_exceeds_target" if retrieval_auc > 0.70
          - "retrieval_auc_partial" if retrieval_auc in [0.50, 0.70]
          - "retrieval_auc_below_chance" if retrieval_auc < 0.50
    5. Write tests/python/test_experiment_800_embedding_constraint_store.py with 100% coverage:
       - test ConstraintSPOTuple fields present
       - test _orthogonalize reduces dot product between stored embeddings
       - test retrieve returns top-K by cosine similarity
       - test from_casememory_patterns produces 5 SPO tuples
       - test CI hash mode produces deterministic embedding without sentence_transformers
       Each test traces to REQ-LEARN-057/058/059.
    6. Reconcile:
       - ops/changelog.md: one-line with retrieval_auc and embedding_mode.
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

