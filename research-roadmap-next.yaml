      EXISTING CODE TO READ FIRST:
        - {project_root}/scripts/arc_loop_solve.py (the STANDING entrypoint: transfer-route -> verifier-routed solve -> reproduction gate -> TRAIN+CHECKPOINT the learned verifier -> registry update)
        - {project_root}/ops/arc_solve_registry.yaml (current reproducible levels + per-game dead_ends; L1 games sk48/ar25/lf52/dc22/sb26/re86/bp35/vc33/g50t/s5i5/ka59; L2 games cd82/sp80/su15/m0r0/cn04)
        - {project_root}/python/carnot/agentic/arc_solver_kit.py (reusable primitives + reproduce gate)
        - {project_root}/python/carnot/agentic/arc_solve_learning.py (recommend_approach -> route a deepen attempt to the closest solved recipe)
        - {project_root}/python/carnot/agentic/arc_value_learner.py (the learned verifier trained on pos/neg traces; models/arc_verifier_<game>.json checkpoint)

      TASK: bank a NEW level -- gate: offline_reproduced=true AND reproduced_levels>=1 -- via the self-play loop,
      AND persist the trained/updated learned-verifier checkpoint. Prefer DEEPENING a rotated game to its next
      level (RE only the next-level win/action/state DELTA via a derive-from-env GameAdapter). Only OFFLINE-
