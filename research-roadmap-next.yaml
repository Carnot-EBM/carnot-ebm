      - {project_root}/results/experiment_6339_incremental_prefix_enforcement_substrate.json
      - {project_root}/results/experiment_6327_three_family_guarded_policy_synthesis.json
      - {project_root}/results/experiment_6329_prospective_held_family_guarded_policy_ab.json
      - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md and {project_root}/ops/e2e-test-plan.md

      TASK
      Build MODEL_SPECS from cached_sota_pair(gpu_indices=(0, 1)). It must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Use canonical llama.cpp and each GGUF embedded tokenizer. Do not use AutoTokenizer. Compare four matched arms: unconstrained sampling, grammar masking, deterministic parser-state correction, and JIT SMT prefix enforcement. Freeze call, token, candidate, wall-time, and checker budgets. Use development families only. Report unique valid normalized semantics, validity, parser failures, utility, fallback, and verification cost by model and family. Set semantic_diversity_gain_score to 1.0 only if a pre-declared prefix arm beats both unconstrained and grammar arms without any accepted contract violation.

      Required deliverable: {project_root}/results/experiment_6340_parser_jit_semantic_diversity_canary.json.
