    prior_failures:
      - experiment_id: exp3066-capstone-v286
        verdict: "complete: capstone_ready=true; paper_ready=false; publication_blocker_count=33"
        addressed_by: "Summarizes .287 with matrix v21 authority, preserving paper_ready=false unless blockers are actually resolved."
