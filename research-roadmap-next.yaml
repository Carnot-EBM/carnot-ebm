tasks:
  - id: exp3365-kv260-ssh-recovery
    milestone: "2026.05.311"
    title: "KV260 SSH and Network Recovery"
    priority: critical
    max_turns: 50
    model: opus
    estimated_wall_time_min: 15
    track: hardware
    inference_substrate: hardware_smoke
    requires_gpu: false
    deliverable: "results/experiment_3365_kv260_ssh_recovery.json"
    prompt: |
      CONTEXT: The KV260 board was unreachable via SSH in milestone .310 (exp3350).
      TASK: Diagnose and restore network/SSH connectivity to the KV260.
      CONCRETE STEPS:
        1. Check local network routes and ARP cache.
        2. Attempt serial console connection if SSH fails.
        3. Restore SSH access and verify simple command execution.
        4. Emit artifact with connectivity status.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3365_kv260_ssh_recovery.py.

