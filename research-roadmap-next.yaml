          principle: "Terminal-prefixed. A win (the synthetic-data-trained contrastive localizer beats the 0.096 ensemble baseline on a HELD-OUT REAL split, cross-domain -- the detector graduates 'detects'->'localizes') and a CLEAN null (synthetic data does not transfer to the real first-error distribution) are BOTH decision-grade."
