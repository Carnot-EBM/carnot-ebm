milestone: "2026.05.192"
milestone_title: "Fast-Slow Variant ADVERSARIAL CONFIRMATION + delayed codification + Phase 4 closure + PyPI"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
scope_reduction_compliance:
  rationale: "exp1811 (.189) shipped Fast-Slow Variant with 3.1x/0.25x numbers — operator agreed 2026-05-16 ~00:00Z that adversarial-confirmation (seed-rotation + corpus-rotation + baseline-audit replication) is required BEFORE paper-v6 §3 codification cites those numbers. The .190 codification (exp1821) didn't run (planner replaced .190 with different scope, then .191 went different directions again). .192 ships the confirmation FIRST, then gates codification + Phase 4 closure on confirmation passing. Plus carries forward PyPI ship-track (5th attempt, blocked by SKIP-loop in .190)."
  carry_forwards_addressed: ["NEW Fast-Slow Variant adversarial-confirmation (operator-approved discipline)", "Fast-Slow codification (deferred from .190 exp1821; gates on confirmation)", "Phase 4 canonical decision (deferred from .190 exp1823; gates on confirmation + codification)", "PyPI prong (5th attempt)"]
authored_by: outer-loop-claude

tasks:
  - id: exp1837-fast-slow-variant-adversarial-confirmation
    title: "Exp 1837: Fast-Slow Variant ADVERSARIAL CONFIRMATION (seed + corpus + baseline rotation)"
    deliverable: results/experiment_1837_fast_slow_confirmation.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1811-fast-slow-variant-prototype
        verdict: complete_3.1x_sample_eff_0.25x_kl_drift_no_forgetting
        addressed_by: "exp1811 (.189) shipped the FS Variant with paper-matching numbers on a single seed/corpus/baseline configuration. Per the new adversarial-confirmation discipline (memory entry feedback_adversarial_confirmation_protocol), Score-300+ findings require an independent replication BEFORE paper-v6 citation. This task is the explicit replication; it should NOT modify any of exp1811's code, only re-run with rotated seeds + corpus + baseline cross-check."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: exp1811 (.189) shipped the Carnot Fast-Slow Variant on
      the 4th attempt with paper-matching numbers (sample_efficiency_ratio
      = 3.1x; kl_drift_ratio = 0.25; FR-11 baseline catastrophic forgetting
      on BBH 0.45 + MATH 0.35 while FS held 0.90 + 0.85; 350s real run).

      Operator-agreed 2026-05-16 ~00:00Z that paper-v6 citation requires
      adversarial confirmation — a second independent run with rotated
      seed + rotated corpus + audited baseline. The new memory entry
      `feedback_adversarial_confirmation_protocol.md` codifies the
      discipline. This task is the FIRST application.

      FALSIFIABLE HYPOTHESIS: An independent re-run of the exp1811
      Fast-Slow Variant pipeline with (a) seed bumped from 172911 to
      192737, (b) DIFFERENT 30-example slices for GSM8K/BBH/MATH (not
      the exact examples used in exp1811), and (c) baseline-implementation
      audit confirming FR-11 path is canonical (not a degraded variant)
      produces a sample_efficiency_ratio within the exp1811 bootstrap CI
      (assume +/-0.5x around 3.1x → confirmation range 2.6x–3.6x) AND
      a kl_drift_ratio within +/-0.10 of exp1811's 0.25 (range 0.15–0.35)
      AND FR-11 catastrophic forgetting reproduces on the rotated BBH +
      MATH slices (passrate < 0.55 vs FS > 0.80).

      If confirmation lands in-range: the result is paper-v6-citable.
      If confirmation diverges: flag exp1811 as PRELIMINARY-NOT-HEADLINE
      and queue a 3rd replication.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1811_fast_slow_variant.json (the original
          numbers to match against)
        - python/carnot/pipeline/fast_slow_variant.py (the implementation
          shipped in .189; DO NOT MODIFY)
        - python/carnot/pipeline/ebft_autoresearch_loop.py (or wherever
          the FR-11 baseline lives — audit this for canonical-ness)
        - feedback_adversarial_confirmation_protocol memory entry

      TASK: Re-run exp1811 with the three rotations.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "from carnot.pipeline.fast_slow_variant import
              fast_slow_variant"` succeeds — else
              `blocked_fast_slow_implementation_missing`.
           b. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              non-empty — else `blocked_model_not_cached`.
           c. `test -f results/experiment_1811_fast_slow_variant.json`
              — else `blocked_baseline_artifact_missing` (can't compare
              without the original numbers).
           Record preconditions_checked.
        1. Baseline audit: git log + diff
           python/carnot/pipeline/ebft_autoresearch_loop.py (or wherever
           FR-11 path lives) since exp1811 ran. Was there any change?
           Record `baseline_audit: {{commits_since_exp1811: int,
           code_changed: bool, diff_summary: str}}` in artifact.
        2. Build rotated corpus: 30 GSM8K + 30 BBH + 30 MATH from
           DIFFERENT slices than exp1811. If exp1811 used examples
           1-30 of each, use examples 31-60. Document which exact
           slice in artifact.
        3. Re-run the Fast-Slow Variant pipeline with random_seed=192737
           (NOT 172911 from exp1811). Same model, same code, ONLY
           seed + corpus change.
        4. Re-run FR-11 baseline on the same rotated corpus.
        5. Compute the same metrics as exp1811: per-task passrate,
           sample_efficiency_ratio, kl_drift_ratio, plasticity, etc.
        6. Compare against exp1811's numbers. Acceptance:
             - sample_efficiency_ratio in [2.6, 3.6]
             - kl_drift_ratio in [0.15, 0.35]
             - FR-11 catastrophic forgetting reproduces on rotated BBH
               + MATH slices (passrate < 0.55)
             - Fast-Slow maintains > 0.80 on rotated BBH + MATH

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.fast_slow_confirmation.v1"
        - experiment: 1837
        - run_date: ISO-8601 UTC
        - duration_s: > 300s (matching exp1811's 350s — real run)
        - random_seed: 192737 (NOT 1837 NOR 172911; explicit rotation)
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - baseline_audit: {{commits_since_exp1811: int, code_changed: bool,
          diff_summary: str}}
        - model_specs: {target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          rotation_versus_exp1811: {seed: "172911→192737",
          corpus: "examples_1-30→examples_31-60",
          baseline: "audited_canonical"}}
        - n_samples: 90
        - n_samples_justification: "Same 30 per task × 3 tasks as exp1811
          for apples-to-apples adversarial replication. Wilson 95% CI
          width ~0.30 per passrate."
        - confirmation_passrate_per_task: dict
        - exp1811_passrate_per_task: dict (verbatim from exp1811 for
          side-by-side comparison)
        - confirmation_sample_efficiency_ratio: float
        - confirmation_kl_drift_ratio: float
        - confirmation_in_range_efficiency: bool (2.6 <= ratio <= 3.6)
        - confirmation_in_range_kl: bool (0.15 <= ratio <= 0.35)
        - fr11_catastrophic_forgetting_reproduced: bool (passrate < 0.55
          on rotated BBH + MATH)
        - fast_slow_held_threshold: bool (passrate > 0.80 on rotated
          BBH + MATH)
        - acceptance_gate_passed: bool (all four conditions above true)
        - acceptance_gate_criteria: "Efficiency in [2.6, 3.6] AND KL
          drift in [0.15, 0.35] AND FR-11 forgetting reproduced AND
          FS held >0.80 on rotated BBH+MATH."
        - methodology_note: "ADVERSARIAL CONFIRMATION TASK. The point is
          to FAIL TO CONFIRM if exp1811's result was seed-lucky or
          corpus-lucky. If all 4 conditions land in-range, the
          confirmation supports paper-v6 citation. If any fail, flag
          exp1811 as PRELIMINARY-NOT-HEADLINE and queue 3rd replication.
          IMPLAUSIBLE_PERFECT trigger: if confirmation_ratio matches
          exp1811's 3.1x to 5+ significant figures, that's TAUTOLOGY-
          class — likely a methodology bug carrying over identically,
          not genuine reproducibility."
        - flagged_preliminary: bool (true if any confirmation condition
          failed)
        - third_replication_recommended: bool (same as flagged_preliminary)
        - optimization_direction: "neither — falsification/confirmation task"
        - honest_verdict: MUST start with `complete:` / `complete_` /
          `success:` / `success_` / `passed:` / `passed_` / `shipped:` /
          `shipped_` per CLAUDE.md Verdict Terminal-Prefix Discipline.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py
      OR python/carnot/pipeline/fast_slow_variant.py (preserve the
      original implementation for apples-to-apples).

  - id: exp1838-fast-slow-codification-gated-on-confirmation
    title: "Exp 1838: Codify exp1811 Fast-Slow Variant into paper-v6 §3 (DEFERRED from .190; gates on exp1837 confirmation)"
