- id: exp1339-xgrammar2-tagdispatch-certificate-grammar-dryrun
  milestone: 2026.04.104
  deliverable: results/experiment_1339_xgrammar2_tagdispatch_certificate_grammar_dryrun.json
  title: "XGrammar2/TagDispatch Certificate Grammar Dry-Run - Dynamic UNKNOWN/SAT/UNSAT Branches"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 35
  priority: high
  requires_gpu: false
  gated_on:
    - upstream: exp1337-environment-gate-disk-pretest-stale-skeleton-audit
      artifact_field: environment_ready
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1325-triggered-certificate-extraction-v5-runtime-fixed-dccd-gbnf
      verdict: stale_in_progress_without_grammar_evidence
      addressed_by: "Dry-run the dynamic grammar branch without SOTA generation before spending GPU time."
      retire_if_same_verdict: true
    - experiment_id: exp1312-triggered-certificate-extraction-dccd-gbnf
      verdict: certificate_parse_rate_0_71223_below_0_75_gate
      addressed_by: "Test whether branch-specific certificate grammars can cover UNKNOWN, SAT, UNSAT, and repair states better than static GBNF."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The .104 literature sweep found XGrammar 2 and trigger-switched structured
    generation as the most relevant recovery path for .103's stalled certificate
    branch. This task is a dry-run over local parser/grammar code and should not
    call a SOTA model. Use {project_root} as the project root and {date} as the
    run date in artifact metadata.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - results/experiment_1324_certificate_failure_taxonomy_formalizer_reality_check.json
    - results/experiment_1337_environment_gate_disk_pretest_stale_skeleton_audit.json
    - python/carnot/
    - scripts/experiment_template.py
    - openspec/capabilities/pipeline/spec.md

    TASK:
    Prototype or dry-run dynamic certificate grammar dispatch for UNKNOWN,
    SAT, UNSAT, and repair branches. Prefer existing parser abstractions and
    record backend availability honestly if XGrammar itself is not installed.

    REQUIRED ARTIFACT FIELDS:
    - status
    - grammar_backend_candidates
    - dynamic_grammar_compile_ms
    - mask_generation_ms_per_token_proxy
    - certificate_states_supported
    - unknown_state_supported
    - state_transition_error_count
    - parse_rate_delta_over_static_gbnf_proxy
    - dynamic_grammar_ready
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1339_xgrammar2_tagdispatch_certificate_grammar_dryrun.json immediately with status="in_progress".
    2. Read current parser, certificate, and grammar-related code under python/carnot and identify the smallest local extension point for dynamic branch dispatch.
    3. Define a tiny set of synthetic certificate strings for UNKNOWN, SAT, UNSAT, and repair-hint states.
    4. Test those strings through the existing parser and a branch-specific grammar or parser shim; do not add a heavy new dependency unless it is already present.
    5. Estimate dynamic_grammar_compile_ms and mask_generation_ms_per_token_proxy from actual timing if possible, otherwise record a proxy method and limitations.
    6. Set state_transition_error_count to the number of synthetic cases that dispatch to the wrong branch or lose UNKNOWN semantics.
    7. Set dynamic_grammar_ready=true only if the dry-run supports all required states without transition errors.
    8. Write all required fields, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1339_xgrammar2_tagdispatch_certificate_grammar_dryrun.json')); print(d.get('dynamic_grammar_ready'), d.get('state_transition_error_count'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1340-trigger-before-constrain-certificate-v6-sota
  milestone: 2026.04.104
  deliverable: results/experiment_1340_trigger_before_constrain_certificate_v6_sota.json
  title: "Triggered Certificate Extraction v6 - Thinking-Before-Constraining + Dynamic Grammar"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 90
  priority: critical
  requires_gpu: true
  gated_on:
    - upstream: exp1337-environment-gate-disk-pretest-stale-skeleton-audit
      artifact_field: environment_ready
      op: '=='
      value: true
    - upstream: exp1339-xgrammar2-tagdispatch-certificate-grammar-dryrun
      artifact_field: dynamic_grammar_ready
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1325-triggered-certificate-extraction-v5-runtime-fixed-dccd-gbnf
      verdict: disk_quota_stale_skeleton_no_substantive_sota_rerun
      addressed_by: "Replace the blind rerun with trigger-before-constrain decoding and dynamic grammar dispatch."
      retire_if_same_verdict: true
    - experiment_id: exp1312-triggered-certificate-extraction-dccd-gbnf
      verdict: certificate_parse_rate_0_71223_below_0_75_gate
      addressed_by: "Target the missing 0.03777 parse-rate delta while preserving truthfulness and UNKNOWN states."
      retire_if_same_verdict: true
    - experiment_id: exp1299-triggered-certificate-extraction-sota-v3
      verdict: blocked_or_missing_headline_artifact
      addressed_by: "Use mandated SOTA GGUF cached model specs and explicit runtime settings."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    exp1323 recovered multi-token SOTA outputs, exp1324 showed the parse gate
    only missed by 0.03777, and exp1325 never produced scientific evidence
    because of environment failure. This task is the substantive certificate
    replacement: let the model think before the certificate trigger, then
    switch into dynamic constrained output. Use {project_root} as the project
    root and {date} as the run date in artifact metadata.

    MODEL_SPECS:
    Use cached_sota_pair(gpu_indices=(0, 1)) from python/carnot/inference/sota_models.py.
    Headline generations must include at least one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models may only be CPU smoke tests with headline_result_allowed=false.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - results/experiment_1323_sota_gguf_token_health_prompt_runtime_diagnostic.json
    - results/experiment_1324_certificate_failure_taxonomy_formalizer_reality_check.json
    - results/experiment_1337_environment_gate_disk_pretest_stale_skeleton_audit.json
    - results/experiment_1339_xgrammar2_tagdispatch_certificate_grammar_dryrun.json
    - research-references.md
    - openspec/capabilities/pipeline/spec.md

    TASK:
    Run a small verifier-backed SOTA certificate extraction slice using a
    trigger-before-constrain prompt and dynamic certificate grammar branch. This
    is not a blind rerun of exp1325; record method differences explicitly.

    REQUIRED ARTIFACT FIELDS:
    - status
    - models_used
    - runtime_settings_used
    - trigger_token_hit_rate
    - certificate_parse_rate
    - certificate_truthfulness_rate
    - parse_rate_delta_over_exp1312
    - truthfulness_delta_over_exp1312
    - extra_token_overhead
    - projection_tax_delta
    - unknown_preservation_rate
    - hardcoded_solution_leakage_proxy
    - headline_result_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1340_trigger_before_constrain_certificate_v6_sota.json immediately with status="in_progress".
    2. Load exp1323 runtime settings, exp1324 failure taxonomy, exp1337 environment gate, and exp1339 grammar dry-run.
    3. Abort to a terminal blocked artifact if environment_ready or dynamic_grammar_ready is not true.
    4. Resolve MODEL_SPECS through cached_sota_pair(gpu_indices=(0, 1)) and record the exact model IDs, GPU indices, llama.cpp settings, stop strings, and max-token budget.
    5. Run a small deterministic case set that covers SAT, UNSAT, UNKNOWN, and repair-hint outputs. Compare static GBNF or previous-parser behavior against the triggered dynamic branch when feasible.
    6. Verify each parsed certificate with the local solver or validator and compute parse rate, truthfulness rate, trigger hit rate, UNKNOWN preservation, projection tax, and leakage proxy.
    7. Set headline_result_allowed=true only if a mandated SOTA GGUF model produced the headline generations and verifier-backed cases are present.
    8. Write all required fields, status="complete", and honest_verdict. If certificate_parse_rate remains below 0.75, name the remaining blocker and keep semantic downstream gates closed.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1340_trigger_before_constrain_certificate_v6_sota.json')); print(d.get('certificate_parse_rate'), d.get('certificate_truthfulness_rate'), d.get('parse_rate_delta_over_exp1312'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1341-halluguard-certificate-failure-split
  milestone: 2026.04.104
  deliverable: results/experiment_1341_halluguard_certificate_failure_split.json
  title: "HalluGuard-Style Certificate Failure Split - Data vs Reasoning vs Parser Risk"
  agent_type: codex
