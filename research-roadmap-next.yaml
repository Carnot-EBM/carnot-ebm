  # ---- FR-11 grounding-collapse CLEAN re-run (de-flag; mandatory self-learning) -
  - id: exp3462-fr11-grounding-collapse-clean-rerun-v2
    operator_override: "2026-05-30 planner (Opus 4.8): the mandatory continuous-self-learning task. exp3452 (.318) found at-risk grounding causes FR-11 self-distillation collapse and entropy-reg prevents it (entropy 0.028 vs 4.98) — a VALUABLE finding, but it was FLAGGED for a pass_rate==true_accuracy bit-identical tautology, so it is quarantined from forward claims per the fabrication gate. This task de-flags it by recording pass_rate (verifier-pass) and true_accuracy (vs ground truth) as genuinely distinct measurements, with more iterations + significance. New deliverable: a CITABLE clean version of the finding. scope-match vs exp3452 is the intended de-flag continuation."
    prior_failures:
      - experiment_id: exp3452-fr11-grounding-collapse-stress-test-v1
        verdict: "complete: at_risk_grounding_causes_collapse_entropy_reg_prevents_it (FLAGGED adversarial_verify CRITICAL: TAUTOLOGY pass_rate==true_accuracy)"
        addressed_by: "exp3452's collapse finding (ARM A entropy 0.028, ARM B 4.98) is real but it forced arm_*_final_pass_rate == arm_*_final_true_accuracy bit-identical (verifier-pass and ground-truth-accuracy computed identically — a real harness bug). This task computes pass_rate (fraction passing the verifier ensemble) and true_accuracy (fraction matching ground truth) as DISTINCT measurements, runs more iterations, adds a significance test on the entropy trajectory, and reports the collapse via the (distinct) entropy + mode-mass curves so it de-flags and can be cited."
        retire_if_same_verdict: true
    milestone: "2026.05.319"
    title: "FR-11 grounding-collapse CLEAN re-run — distinct pass-rate vs accuracy, de-flagged (mandatory self-learning)"
    priority: high
    max_turns: 50
    agent_type: claude
    requires_claude: true   # gemini-cli is DOWN; cached-trace self-learning loop + judgment on the distinct-metrics framing; claude is the only landing backend.
    estimated_wall_time_min: 20
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: "results/experiment_3462_fr11_grounding_collapse_clean_rerun_v2.json"
    prompt: |
      CONTEXT: The self-learning thesis (PRD FR-11 / continuous self-learning) rests on
      alpha_t grounding — the verifier signal that keeps a self-correcting model from
      collapsing onto its own null space (Zenil alpha_t; Q12 Dark Room / Hypothesis-B).
      exp3452 (.318) found that the production ensemble's at-risk grounding (exp3439:
      lambda_min~0, eff-k 3.54) DOES cause FR-11 self-distillation mode-collapse (ARM A
      entropy ->0.028, mode-mass ->1) and that entropy regularization prevents it (ARM B
      entropy 4.98). That is a valuable, actionable result — but it was FLAGGED for a
      TAUTOLOGY: arm_*_final_pass_rate == arm_*_final_true_accuracy to >5 sig figs (the
      verifier-pass rate and the ground-truth accuracy were computed identically, a real
      harness bug), so it is quarantined from forward claims. This task produces a CLEAN,
      CITABLE version. It is the milestone's mandatory continuous-self-learning experiment,
      on cached traces (no live model -> no timeout).

      EXISTING CODE TO READ FIRST:
        - results/experiment_3452_fr11_grounding_collapse_stress_test_v1.json (the flagged predecessor — see its corrigendum_pending)
        - scripts/experiment_3452_fr11_grounding_collapse_stress_test_v1.py (reuse/adapt; FIX the pass_rate==accuracy bug)
        - results/experiment_3439_verifier_ensemble_lambda_min_diversity_audit_v3.json (the at-risk grounding)
        - python/carnot/ (the FR-11 controller-memory / self-learning module)
        - project_q12_hypothesis_b_and_dark_room + project_zenil_alpha_grounding (memory) — the theory

      TASK: Re-run the two-arm FR-11 self-improvement loop on cached traces with pass_rate
      and true_accuracy as GENUINELY DISTINCT measurements, more iterations, and a
      significance test on the entropy trajectory, so the collapse finding de-flags.

      PRECONDITIONS (step 0):
        a. FR-11 self-learning module + cached traces present. If not ->
           complete: blocked_fr11_module_or_traces_unavailable.
        b. The verifier ensemble (at-risk grounding) is callable. If not ->
           complete: blocked_verifier_suite_uncallable.

      CONCRETE STEPS:
        1. ARM A (control): FR-11 self-improvement loop over cached traces, NO entropy
           regularization (the bare at-risk grounding).
        2. ARM B (treatment): same loop WITH entropy/diversity regularization.
        3. Over N>=30 iterations, track per-arm DISTINCT metrics: (i) output/latent
           entropy, (ii) mode-collapse indicator (top-mode mass fraction), (iii)
           verifier-PASS rate (fraction of outputs the verifier ensemble accepts), and
           (iv) TRUE accuracy (fraction matching GROUND TRUTH). pass_rate and
           true_accuracy MUST be computed from different sources (verifier vs gold) and
           MUST NOT be forced equal — if they coincide numerically, that itself is the
           gaming signal (verifier-pass rises while true accuracy does not), report both.
        4. Test collapse: entropy monotonically dropping + mode-mass concentrating +
           pass_rate rising while true_accuracy stagnates/drops = gaming the null space.
           Add a significance test (e.g. trend test) on the ARM A entropy trajectory.
        5. Report whether ARM A collapses and whether ARM B prevents it, via the DISTINCT
           entropy + mode-mass + (pass_rate vs true_accuracy GAP) curves.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="complete:/success:/passed:/shipped_ prefix."
        inference_substrate: value=verifier_ensemble_against_cached_candidates
        n_iterations: principle="self-improvement iterations per arm (>=30)."
        arm_a_final_entropy: principle="control final output entropy (the primary collapse signal)."
        arm_b_final_entropy: principle="treatment final output entropy."
        arm_a_final_mode_mass: principle="control top-mode mass fraction (distinct from entropy)."
        arm_a_pass_rate_vs_true_accuracy_gap: principle="verifier-pass MINUS ground-truth accuracy at convergence — the gaming signal; MUST be computed from distinct sources (the exp3452 de-flag)."
        arm_a_mode_collapse_detected: principle="boolean: control collapsed onto the null space (the Dark-Room failure)."
        arm_b_mode_collapse_detected: principle="boolean: treatment collapsed despite regularization."
        entropy_trend_significance: principle="significance of the ARM A entropy decline — makes the collapse claim defensible, not eyeballed."
        grounding_collapse_consequence: principle="honest string: does at-risk grounding cause collapse, and does regularization prevent it?"
        random_seed: principle="determinism."
        reproducibility_checksum: principle="content hash."
        duration_s: principle="cached-trace loop; 1s floor."

      ACCEPTANCE GATES:
        - condition: "arm_a_mode_collapse_detected and not arm_b_mode_collapse_detected"
          principle: "G1 COLLAPSE-CONFIRMED-AND-CURABLE (de-flagged): at-risk grounding causes self-distillation collapse AND entropy regularization is the antidote — actionable for Phase-5 self-learning, now citable."
        - condition: "not arm_a_mode_collapse_detected"
          principle: "G1' GROUNDING-HOLDS: residual eff-k 3.5 diversity is enough; collapse does not occur — a reassuring honest negative."

      TERMINAL VERDICTS (all start with complete:):
        - arm A collapses, arm B does not -> "complete: at_risk_grounding_causes_collapse_entropy_reg_prevents_it_deflagged"
        - arm A does not collapse -> "complete: residual_diversity_holds_no_collapse_in_fr11_loop_deflagged"
        - both collapse -> "complete: collapse_not_prevented_by_entropy_reg_grounding_insufficient"
