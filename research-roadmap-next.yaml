  - id: exp3153-repair-gate-unlock-decision-v2
    milestone: "2026.05.293"
    deliverable: "results/experiment_3153_repair_gate_unlock_decision_v2.json"
    title: "Repair gate unlock decision v2"
    priority: critical
    max_turns: 30
    estimated_wall_time_min: 35
    track: "repair"
    inference_substrate: "aggregation_and_policy"
    requires_gpu: false
    gated_on:
      - upstream: exp3152-clean-live-sota-verifier-rerun-v8
        artifact_field: clean_live_verifier_rerun_v8_ready
        op: "=="
        value: true
      - upstream: exp3152-clean-live-sota-verifier-rerun-v8
        artifact_field: flagged_adversarial
        op: "=="
        value: false
      - upstream: exp3152-clean-live-sota-verifier-rerun-v8
        artifact_field: false_accept_gate_passed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3140-repair-gate-unlock-decision
        verdict: "blocked_other: exp3139 flagged_adversarial=true"
        addressed_by: "Consumes the clean v8 rerun and refuses to unlock if any adversarial evidence remains."
        retire_if_same_verdict: true
      - experiment_id: exp3127-multi-turn-monitored-repair-ladder-v1
        verdict: "blocked_gate_check_failed"
        addressed_by: "Keeps repair execution behind a structured gate so the model call is skipped when verifier prerequisites fail."
        retire_if_same_verdict: true
      - experiment_id: exp3115-explicit-repair-gate-micro-panel-v4
        verdict: "complete: repair_success_delta=0.0; false_repair_accept_rate=0.0; intent_preservation_rate=0.0"
        addressed_by: "Uses clean verifier evidence and exact regression rows before permitting another repair measurement."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .292 repair was correctly blocked because the live verifier artifact was flagged. This task decides whether the clean v8 verifier rerun is safe enough to spend repair calls.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3150_adversarial_verifier_evidence_corrigendum_v1.json
      - results/experiment_3152_clean_live_sota_verifier_rerun_v8.json
      - results/experiment_3137_exact_safe_accept_abstain_contract_v1.json
      - results/experiment_3138_canonical_answer_vericot_grounding_pilot_v1.json
      - results/experiment_3140_repair_gate_unlock_decision_v1.json
      - results/experiment_3115_explicit_repair_gate_micro_panel_v4.json

      TASK
      Write a conservative repair-gate unlock decision v2. It may unlock only if the clean rerun is unflagged, exact-authority backed, and false-accept safe.

      CONCRETE STEPS
      1. Load the clean verifier rerun, evidence corrigendum, exact-safe contract, canonical grounding, and prior repair gate artifacts.
      2. Apply gate criteria: false_accept_rate <= 0.10, false_accept_gate_passed=true, flagged_adversarial=false, regression_rows_included=true, exact labels present, ledger replay available, and headline_claim_allowed=true.
      3. Set repair_gate_state to unblocked, blocked_false_accept, blocked_flagged_verifier, blocked_missing_live_model, blocked_missing_exact_labels, or blocked_other.
      4. If unblocked, list repair rows and exact authority constraints; if blocked, list exact blockers and avoid calling models.
      5. Write only the decision artifact.

      REQUIRED ARTIFACT FIELDS:
      - repair_gate_decision_v2_ready: bool (principle: repair execution must be explicitly gated)
      - repair_gate_state: str (principle: conductor should gate on one field)
      - false_accept_rate: float (principle: central blocker must be carried forward)
      - false_accept_gate_passed: bool (principle: repair cannot run if false accepts remain high)
      - flagged_adversarial: bool (principle: tainted verifier evidence must block repair)
      - regression_rows_included: bool (principle: known failures must be retested)
      - exact_authority_ready: bool (principle: repair needs exact tests/solvers)
      - monitor_ledger_ready: bool (principle: repair needs ledger replay)
      - selected_repair_rows: list (principle: repair denominator must be explicit)
      - repair_blockers: list (principle: blocked decisions must be actionable)
      - source_artifacts: list (principle: gate must trace to files)
      - inference_substrate: dict (principle: aggregation work must declare no live inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

