milestone: "2026.08.567"
milestone_title: "Production Safety Net, Reversible Learning, and Constraint Saturation"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6548-v567-evidence-eligibility-contract
    milestone: "2026.08.567"
    deliverable: results/experiment_6548_v567_evidence_eligibility_contract.json
    title: "V567 evidence eligibility, architecture freshness, and gate contract"
    priority: critical
    track: infrastructure-governance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 90
    model: opus
    prior_failures:
      - experiment_id: exp6541-v566-direct-source-contract
        verdict: "complete_v566_direct_source_contract_ready: direct DRIFT source, local replay, model cache, split, field, and dependency contracts are implementable"
        addressed_by: "This task does not repeat source intake or imply live-model execution; it independently rechecks immutable V566 artifacts, quarantines Exp6541's duration and model-receipt inconsistency, and imports only clean Exp6542-Exp6547 evidence by path and hash."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V566 completed Exp6541 through Exp6547. Exp6542 through Exp6547 pass live adversarial rechecks. Exp6541 reports readiness but its live recheck is CRITICAL because its duration is below an inferred live-model floor and its model receipt is incomplete. V567 must establish an additive evidence ledger before production integration. It must not rerun the external intake. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6541_v566_direct_source_contract.json through {project_root}/results/experiment_6547_external_transfer_independent_audit.json
      - {project_root}/research-complete.yaml, {project_root}/research-references.md, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/conductor-log.md
      - {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/conductor_gates.py, and {project_root}/scripts/roadmap_schema.py
      - {project_root}/_bmad/architecture.md, relevant capability specs, {project_root}/_bmad/traceability.md, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build the V567 evidence eligibility, architecture freshness, model, hardware, and gate contract. Preserve the V566 determination trail. Import only artifacts that pass path, hash, row, and live-verifier checks.

      CONCRETE STEPS
      0. PRECONDITIONS: record git status, CPU/RAM/disk, Python and verifier versions, required artifact existence and hashes, architecture freshness date, protected-file hashes, and network status. This task needs no live GGUF load.
      1. Add or confirm REQ-* and SCENARIO anchors for additive evidence correction, immutable import, architecture freshness, exact gate spelling, model policy, retired-scope isolation, and atomic terminal output. Write focused tests first.
      2. Run live adversarial verification and row-consistency checks on Exp6541 through Exp6547. Record command, version, exit status, artifact hash, stamped flags, live flags, and eligibility for each artifact.
      3. Quarantine Exp6541 as clean evidence unless the independent checks resolve both the duration classification and model-receipt gap without editing history. Do not rerun DRIFT intake. Import Exp6542 through Exp6547 only when their checks remain clean.
      4. Verify the V567 roadmap against current code and the 2026-07-03 architecture document. Freeze every task ID, deliverable, readiness field, structured gate, sample floor, MODEL_SPECS rule, ARC no-solve rule, and GateMate receipt rule.
      5. Confirm that no gate names a task outside V567, no artifact field is misspelled, no task requires a retired ID, and no natural-language schema-reprompt or generated-text verifier scope is reopened.
      6. Attack aggregate-only eligibility, hash aliases, live-versus-stamped flag disagreement, missing readiness fields, stale architecture assumptions, legacy-model headline substitution, and retired-chain dependencies.
      7. Set v567_evidence_contract_ready_score=1.0 only when the task, field, gate, model, hardware, and scope contracts close. Set v566_external_transfer_eligible_score=1.0 only when Exp6542 through Exp6547 are independently eligible; Exp6541 is not required for that score.
      8. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, exclusion-manifest lint, roadmap schema validation, adversarial verification, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6548_v567_evidence_eligibility_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal lifecycle state prevents a bootstrap artifact from posing as completed work."
        honest_verdict:
          principle: "The verdict must state the evidence boundary and start with complete_, partial_, blocked_, or disqualified_."
        verdict_class:
          principle: "A closed class carries null, partial, blocked, or disqualified status into downstream aggregation."
        v566_artifact_eligibility_rows:
          principle: "One row per artifact makes each eligibility decision independently recheckable."
        exp6541_disposition:
          principle: "The live CRITICAL inconsistency must remain visible and cannot be washed out by a milestone summary."
        clean_v566_import_ledger:
          principle: "Only content-addressed clean evidence may become a V567 input."
        architecture_freshness_receipt:
          principle: "A 51-day-old architecture document must be checked against current code before it anchors integration."
        v567_gate_contract_rows:
          principle: "Every gate must name an in-roadmap task and an upstream field with identical spelling."
        v567_model_and_hardware_contract:
          principle: "Headline model and physical-resource rules must be frozen before outcomes exist."
        v567_evidence_contract_ready_score:
          principle: "A binary readiness field gives downstream production work one explicit contract gate."
        v566_external_transfer_eligible_score:
          principle: "Downstream science needs a clean external root that does not depend on quarantined Exp6541."
        per_unit_rows:
          principle: "Artifact-level rows prevent aggregate eligibility claims from hiding one failed input."
        gate_check_summary:
          principle: "Any blocked verdict must name the failed check and observed value."
        preconditions_checked:
          principle: "Resource receipts distinguish unavailable inputs from null science."
        protected_files_unchanged:
          principle: "The planning task must not mutate the active roadmap or conductor."
        inference_substrate:
          principle: "Declaring no-LLM aggregation prevents fabricated live-model provenance."
        verifier_is_oracle:
          principle: "Hash and schema checks are audit authority, not an oracle-distinct scientific verifier."
        field_provenance:
          principle: "Each headline field must identify the source rows and recomputation path."
        duration_s:
          principle: "Monotonic wall time exposes implausible or stale execution receipts."
        tests_run:
          principle: "Named commands and exit codes make validation reproducible."
        reproducibility_checksum:
          principle: "A content hash detects later mutation of the terminal record."
      Set inference_substrate=aggregation_from_upstream_artifacts_no_llm and verifier_is_oracle=true for hash, field, schema, and gate checks only. A clean contract uses verdict_class=null, a usable subset uses partial, a missing prerequisite uses blocked, and false provenance uses disqualified.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6548_v567_evidence_eligibility_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6549-production-safety-net-adapter
    milestone: "2026.08.567"
    deliverable: results/experiment_6549_production_safety_net_adapter.json
    title: "Default-off production Safety-Net adapter with exact fallback"
    priority: critical
    track: production-integration
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6545-external-safety-net-router
        verdict: "complete_external_safety_net_router_positive: selected held charged linear_compact_router_abstention_exception_exact_fallback beats certified structural control with exact equality, calibrated abstention, immutable train-only exceptions, and reachable native fallback"
        addressed_by: "Exp6545 evaluated an experiment-local router. This task adds a typed, default-off VerifyRepairPipeline adapter, proves byte-identical disabled behavior, preserves every candidate, and keeps native exact fallback reachable on the production path."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6548-v567-evidence-eligibility-contract
        artifact_field: v567_evidence_contract_ready_score
        op: "=="
        value: 1.0
        principle: "Production code may consume V566 evidence only after the additive eligibility and field contract closes."
    prompt: |
      CONTEXT
      Exp6545 and Exp6547 support an external compact Safety-Net router with calibrated abstention, a train-only exception table, and native exact fallback. The mechanism remains experiment-local. V567 needs a typed, default-off adapter on the real VerifyRepairPipeline path. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V567 roadmap document
      - {project_root}/results/experiment_6548_v567_evidence_eligibility_contract.json
      - {project_root}/results/experiment_6545_external_safety_net_router.json and {project_root}/results/experiment_6547_external_transfer_independent_audit.json
      - {project_root}/python/carnot/pipeline/verify_repair.py, {project_root}/python/carnot/pipeline/factor_cache_shadow_adapter.py, and related pipeline tests
      - {project_root}/python/carnot/experiment_6545_external_safety_net_router.py and reusable exact fallback, feature, calibration, and exception-table code
      - relevant capability specs, traceability, exclusions, status, changelog, and E2E plan

      TASK
      Implement and evaluate a default-off production Safety-Net adapter. Disabled behavior must be byte-identical to native VerifyRepairPipeline behavior. Enabled routing may reorder or abstain but must preserve all candidates and native exact fallback.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate the structured gate; record expected and observed values, upstream artifact path and hash, Python and Z3 versions, CPU/RAM/disk, fixture and router hashes, and protected-file hashes.
      1. Ensure the relevant production-adapter capability spec has REQ-* and SCENARIO anchors for default-off identity, typed configuration, candidate preservation, abstention, exception immutability, exact fallback, rollback, and errors. Write tests first.
      2. Add the smallest production module under python/carnot/pipeline/. Reuse the frozen V566 feature and router contract. Do not copy held rows, outcomes, or entity identifiers into policy state.
      3. Make the adapter disabled by default. Prove byte-identical serialized requests, candidate order, checker calls, outputs, error types, side effects, and persistence behavior on a frozen regression bank.
      4. In the enabled arm, preserve every candidate. Record route, abstention, exception lookup, fallback reason, exact result, and charged adapter overhead. Any unsupported or uncertain input must fall back.
      5. Compare native, disabled-adapter, enabled-router, forced-abstain, forced-fallback, rollback, and malformed-input conditions on identical units and seeds.
      6. Attack model and family IDs, source IDs, entity names, row order, held table writes, candidate deletion, fallback recursion, serialization changes, stale configuration, and disabled-path side effects.
      7. Set production_safety_net_adapter_ready_score=1.0 only when disabled identity is exact, enabled decisions match the frozen router, all exact outputs remain equal, fallback is reachable, and every attack fails closed.
      8. Write one terminal artifact atomically. Run focused tests with full new-module coverage, lint, spec coverage, row lint, gate audit, adversarial verification, pipeline E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6549_production_safety_net_adapter.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state distinguishes a shipped adapter result from setup-only output."
        honest_verdict:
          principle: "The verdict must name disabled identity and enabled fallback status and use a terminal prefix."
        verdict_class:
          principle: "The closed class prevents a partial integration from becoming a positive scientific claim."
        upstream_gate_receipt:
          principle: "The adapter must prove which eligible evidence contract authorized integration."
        adapter_configuration_contract:
          principle: "A typed default-off contract prevents accidental activation and configuration drift."
        disabled_identity_rows:
          principle: "Per-unit native-versus-disabled bytes expose any supposedly inert behavior change."
        enabled_decision_rows:
          principle: "Per-unit routes, abstentions, exceptions, and fallback outcomes make the fast path auditable."
        exact_output_equality_receipt:
          principle: "A learned route is eligible only when exact accepted outputs remain unchanged."
        candidate_preservation_receipt:
          principle: "Keeping the full candidate set preserves completeness and native fallback."
        exception_table_immutability_receipt:
          principle: "Held or live writes would leak outcomes into the production policy."
        fallback_and_rollback_receipts:
          principle: "A safe fast path must prove both escape and recovery paths."
        shortcut_attack_matrix:
          principle: "Identity, ordering, and serialization attacks test whether the adapter learned the intended structure."
        production_safety_net_adapter_ready_score:
          principle: "One binary field gives bindings and audits an exact integration gate."
        per_unit_rows:
          principle: "Comparative claims must be recomputable for every unit and condition."
        aggregate_row_recomputation:
          principle: "Headlines must derive from emitted rows, not parallel counters."
        gate_check_summary:
          principle: "A blocked run must name the failed upstream or runtime check and value."
        preconditions_checked:
          principle: "Resource and input receipts separate blocked integration from null behavior."
        protected_files_unchanged:
          principle: "The task must preserve the active roadmap and conductor while editing scoped production files."
        inference_substrate:
          principle: "The no-LLM adapter evaluation must not imply fresh model inference."
        verifier_is_oracle:
          principle: "The compared router is not ground truth; Z3 remains separate exact authority."
        field_provenance:
          principle: "Each readiness and equality field must point to rows, hashes, and code versions."
        random_seed:
          principle: "Fixed seeds make matched routing and fallback comparisons repeatable."
        duration_s:
          principle: "Charged wall time detects omitted adapter and fallback overhead."
        tests_run:
          principle: "Named test and E2E receipts show the production path was exercised."
        reproducibility_checksum:
          principle: "A final hash detects mutation after the verdict."
      Set inference_substrate=production_verify_repair_compact_router_and_exact_fallback_no_llm and verifier_is_oracle=false. Use verdict_class=positive only for a charged enabled-path benefit with exact disabled identity and exact output equality; use null for no benefit, partial for incomplete integration, blocked for failed preconditions, or disqualified for leakage or changed accepted outputs.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6549_production_safety_net_adapter --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6550-rust-pyo3-safety-net-parity
    milestone: "2026.08.567"
    deliverable: results/experiment_6550_rust_pyo3_safety_net_parity.json
    title: "Rust/PyO3 Safety-Net request and decision parity"
    priority: high
    track: cross-language-core
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp5646-two-axis-tempering-rust-parity
        verdict: "blocked_gate_check_failed"
        addressed_by: "Exp5646 never reached Rust parity because its two-axis tempering quality gates were zero. This task removes that upstream chain and implements only the compact Safety-Net request and decision ABI after the in-roadmap production adapter passes."
        retire_if_same_verdict: true
      - experiment_id: exp6545-external-safety-net-router
        verdict: "complete_external_safety_net_router_positive: selected held charged linear_compact_router_abstention_exception_exact_fallback beats certified structural control with exact equality, calibrated abstention, immutable train-only exceptions, and reachable native fallback"
        addressed_by: "Exp6545 had no Rust or PyO3 deliverable. This task freezes a versioned cross-language schema and proves byte, decision, error, fallback, and rollback parity without moving model inference or exact authority into Rust."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6549-production-safety-net-adapter
        artifact_field: production_safety_net_adapter_ready_score
        op: "=="
        value: 1.0
        principle: "A cross-language ABI should freeze only after the default-off Python production contract passes."
    prompt: |
      CONTEXT
      Exp6549 places the compact Safety Net on the Python production path. The PRD and architecture call for reliable Rust-core behavior through PyO3. V567 needs parity for the small routing decision contract, not a rewrite of language extraction, model inference, or Z3 authority. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/_bmad/prd.md, {project_root}/_bmad/architecture.md, and the V567 roadmap document
      - {project_root}/results/experiment_6549_production_safety_net_adapter.json
      - {project_root}/python/carnot/pipeline/ and the adapter module created by Exp6549
      - {project_root}/crates/, {project_root}/Cargo.toml, existing PyO3 bindings, serialization code, and cross-language tests
      - relevant capability specs, traceability, exclusions, status, changelog, and E2E plan

      TASK
      Define the smallest typed Rust/PyO3 ABI for Safety-Net feature requests and routing decisions. Prove Python/Rust parity for route, abstention, exception lookup, fallback reason, serialization, and errors.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate the structured gate; record upstream hash, Rust, Cargo, Python, maturin or binding tool versions, CPU/RAM/disk, build cache, fixture hash, and protected-file hashes.
      1. Ensure the relevant cross-language capability spec has REQ-* and SCENARIO anchors for schema versioning, numeric normalization, deterministic serialization, error semantics, parity, fallback, and ABI rollback. Write Rust and Python tests first.
      2. Freeze a minimal request type with safe structural features only. Freeze a decision type with route, abstain, uncertainty bucket, exception hit, fallback reason, and schema version.
      3. Implement formulaic Rust and PyO3 bindings in the existing crate structure. Do not add model loading, hidden states, natural-language parsing, labels, or release authority.
      4. Replay train-free held, boundary, malformed, null, extreme numeric, version-skew, and unknown-feature cases through Python and Rust on identical bytes.
      5. Emit one parity row per unit and condition with input hash, both outputs, output hashes, error types, decision equality, exact downstream result, FFI time, and fallback reachability.
      6. Attack float and integer coercion, NaN, field order, missing keys, extra keys, Unicode, stale schema versions, endianness assumptions, exception-table mutation, and nondeterministic map order.
      7. Set cross_language_router_parity_ready_score=1.0 only when every supported row is decision- and byte-equal, unsupported rows fail closed to fallback, and the Python-only rollback remains exact.
      8. Write one terminal artifact atomically. Run focused Python and Rust tests, clippy or scoped lint, spec coverage, row lint, gate audit, adversarial verification, binding E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6550_rust_pyo3_safety_net_parity.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state proves the binding task progressed beyond compilation setup."
        honest_verdict:
          principle: "The verdict must state parity, fallback, and rollback outcomes with a terminal prefix."
        verdict_class:
          principle: "A closed class prevents partial ABI coverage from becoming a positive parity claim."
        upstream_gate_receipt:
          principle: "The ABI must identify the exact production adapter contract it implements."
        abi_schema_and_version_contract:
          principle: "Explicit versions prevent silent Python/Rust semantic drift."
        build_and_binding_receipts:
          principle: "Compiler and extension hashes prove which native code actually ran."
        parity_rows:
          principle: "One row per unit and condition makes every cross-language comparison recheckable."
        serialization_equality_receipt:
          principle: "Equal decisions with different bytes can still break caches and downstream contracts."
        error_semantics_rows:
          principle: "Malformed and unsupported inputs must fail closed in the same way across languages."
        exact_downstream_equality_receipt:
          principle: "The ABI may not change accepted exact results."
        fallback_and_python_rollback_receipt:
          principle: "Production safety requires a reachable native fallback and a complete binding rollback."
        abi_attack_matrix:
          principle: "Coercion, ordering, version, and Unicode attacks expose hidden language-boundary assumptions."
        cross_language_router_parity_ready_score:
          principle: "A binary parity gate gives the independent audit an unambiguous input."
        per_unit_rows:
          principle: "Comparative parity claims require a row for each evaluated unit."
        aggregate_row_recomputation:
          principle: "The parity headline must derive only from emitted rows."
        gate_check_summary:
          principle: "A blocked artifact must name the failed build, input, or upstream check and value."
        preconditions_checked:
          principle: "Toolchain receipts distinguish unavailable bindings from null parity."
        protected_files_unchanged:
          principle: "Scoped binding work must preserve the active roadmap and conductor."
        inference_substrate:
          principle: "This is a deterministic binding replay, not live model inference."
        verifier_is_oracle:
          principle: "Parity is checked against independent exact outputs, not treated as a learned verifier win."
        field_provenance:
          principle: "Each decision and readiness field must point to bytes, builds, and rows."
        random_seed:
          principle: "Stable case generation and order make parity failures reproducible."
        duration_s:
          principle: "Charged build and FFI time prevents a cost-free cross-language claim."
        tests_run:
          principle: "Named Python, Rust, and binding checks prove both sides executed."
        reproducibility_checksum:
          principle: "A content hash detects later changes to the parity record."
      Set inference_substrate=rust_pyo3_and_python_compact_router_replay_no_llm and verifier_is_oracle=false. Use verdict_class=positive only for full supported-case parity, fail-closed unsupported cases, exact downstream equality, and rollback; use null for no production value, partial for bounded parity, blocked for toolchain or gate failure, or disqualified for false native execution or changed exact outputs.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6550_rust_pyo3_safety_net_parity --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6551-production-safety-net-independent-audit
    milestone: "2026.08.567"
    deliverable: results/experiment_6551_production_safety_net_independent_audit.json
    title: "Independent production Safety-Net and cross-language audit"
    priority: critical
    track: infrastructure-audit
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 75
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6545-external-safety-net-router
        verdict: "complete_external_safety_net_router_positive: selected held charged linear_compact_router_abstention_exception_exact_fallback beats certified structural control with exact equality, calibrated abstention, immutable train-only exceptions, and reachable native fallback"
        addressed_by: "Exp6545 measured the experiment-local router and did not audit a production adapter or Rust/PyO3 boundary. This always-run task independently recomputes disabled identity, enabled decisions, cross-language parity, exact fallback, rollback, and shortcut resistance."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6549 and Exp6550 attempt production and cross-language integration. This audit must always run. It must not trust their readiness fields, selected rows, aggregate counters, or claimed build identities. Missing inputs are a terminal blocked result with diagnostics. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V567 roadmap document
      - {project_root}/results/experiment_6548_v567_evidence_eligibility_contract.json if present
      - {project_root}/results/experiment_6549_production_safety_net_adapter.json if present
      - {project_root}/results/experiment_6550_rust_pyo3_safety_net_parity.json if present
      - the production adapter, Rust/PyO3 binding, native VerifyRepairPipeline, exact fallback, fixtures, specs, and tests
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, traceability, exclusions, and E2E plan

      TASK
      Independently audit disabled-path identity, enabled routing, exact fallback, Python/Rust parity, build provenance, rollback, and shortcut resistance. Always emit production_safety_net_audited_ready_score.

      CONCRETE STEPS
      0. PRECONDITIONS: record input existence, paths and hashes, current Python and Rust build hashes, CPU/RAM/disk, Z3 version, fixture hash, random audit seed, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for independent replay, missing-input disposition, disabled identity, ABI parity, exact equality, fallback, rollback, row recomputation, and atomic output. Write tests first.
      2. Rebuild or independently load the current binding. Do not accept an upstream build receipt as proof that native code ran.
      3. Draw a deterministic stratified audit sample plus every mismatch, abstention, exception, fallback, malformed, timeout, and boundary row. Replay native, disabled, Python-enabled, and Rust-enabled paths.
      4. Recompute byte identity, decision equality, exact downstream equality, charged time, fallback reachability, exception immutability, and rollback from raw rows.
      5. Attack missing artifacts, empty success artifacts, duplicated rows, aggregate tampering, Python fallback posing as Rust, source or model identity shortcuts, candidate deletion, table writes, and stale builds.
      6. Set production_safety_net_audited_ready_score=1.0 only when the independent rows prove disabled identity, enabled exact equality, binding parity, fallback, immutability, and rollback. Otherwise set zero and name every failed check.
      7. Write one terminal artifact atomically. Run focused tests, scoped Rust checks, lint, spec coverage, row lint, adversarial verification, production E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6551_production_safety_net_independent_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "An always-run audit needs a terminal state even when integration inputs are absent."
        honest_verdict:
          principle: "The verdict must state adopted, blocked, partial, null, or disqualified disposition with a terminal prefix."
        verdict_class:
          principle: "The closed class prevents audit circularity or missing inputs from becoming a positive claim."
        input_existence_and_hash_receipts:
          principle: "The audit must identify the exact artifacts and binaries it evaluated."
        independent_build_identity_receipt:
          principle: "A fresh native build check prevents Python fallback from posing as Rust execution."
        independent_disabled_identity_rows:
          principle: "Fresh native-versus-disabled rows test the central default-off promise."
        independent_enabled_and_parity_rows:
          principle: "Fresh route and binding rows prevent self-audit by copied upstream outcomes."
        independent_exact_equality_receipt:
          principle: "Production adoption requires unchanged exact accepted outputs."
        fallback_exception_and_rollback_audit:
          principle: "The audit must cover every safety escape and persistent-state boundary."
        independent_cost_recomputation:
          principle: "Adapter, FFI, and fallback overhead must be charged from raw clocks."
        missing_input_disposition:
          principle: "Absent or partial upstream work must close honestly instead of producing null rows."
        shortcut_attack_matrix:
          principle: "Independent attacks test identities, candidate preservation, mutation, and build substitution."
        production_safety_net_audited_ready_score:
