      addressed_by: "This v3 task is gated on exp1299 parse rate and exp1300 routing coverage."
      retire_if_same_verdict: true
    - experiment_id: exp1277-cactus-constrained-acceptance
      verdict: gate_blocked_no_certificate_parse_rate
      addressed_by: "The certificate parse-rate dependency is now a structured current-milestone gate."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Cactus constrained acceptance stayed blocked because certificate parsing never
    ran. With parsed and semantically routed certificates, measure low-risk
    acceptance using HoVer/Token-Guard-style safe-prefix filters. Use
    {project_root} as the project root and {date} as the run date in artifact metadata.

    MODEL_SPECS:
    If this task generates new candidate text, use cached_sota_pair(gpu_indices=(0, 1)).
    Headline models must include at least one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models are smoke-only and must set headline_result_allowed=false.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1299_triggered_certificate_extraction_v3.json
    - results/experiment_1300_semantic_routing_v2.json
    - python/carnot/inference/sota_models.py
    - research-references.md

    TASK:
    Measure whether certificate/routing evidence can safely accept low-risk
    prefixes or complete outputs without increasing verified violations.

    REQUIRED ARTIFACT FIELDS:
    - status
    - low_risk_acceptance_rate
    - token_guard_risk_score
    - risk_bound_proxy
    - cactus_acceptance_delta
    - headline_result_allowed
    - models_used
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1301_safe_prefix_cactus_acceptance_v3.json immediately with status="in_progress".
    2. Load certificate and semantic-routing examples from exp1299 and exp1300.
    3. Define a conservative low-risk acceptance rule using parsed certificate validity, semantic verifier pass, and token/safe-prefix risk scores.
    4. Compare acceptance rate and verified violation rate against reject-all and syntax-only baselines.
    5. If generating new samples, use mandated SOTA GGUF MODEL_SPECS; otherwise mark replay_only=true and headline_result_allowed according to the evidence source.
    6. Write low_risk_acceptance_rate, token_guard_risk_score, risk_bound_proxy, cactus_acceptance_delta, models_used, headline_result_allowed, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1301_safe_prefix_cactus_acceptance_v3.json')); print(d.get('low_risk_acceptance_rate'), d.get('cactus_acceptance_delta'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

