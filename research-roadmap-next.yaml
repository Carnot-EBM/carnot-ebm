      TASK:
      Run a parser-grounded paired solve-versus-verify panel and emit results/experiment_5581_clean_sota_solve_verify_remeasurement.json.

      CONCRETE STEPS:
      1. Enforce gates before loading models. Use `cached_sota_pair(gpu_indices=(0,1))` and llama.cpp-backed cached `model_path` values.
      2. MODEL_SPECS headline models must include `unsloth/Qwen3.6-35B-A3B-GGUF` and at least one of `unsloth/gemma-4-31B-it-GGUF` or `unsloth/gemma-4-26B-A4B-it-GGUF`. Legacy models may only run a labeled CPU smoke test and cannot enter headline metrics.
