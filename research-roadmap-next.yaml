    4. Define p(error)=sigmoid(a*z+b), where z is the frozen, temperature-calibrated relational-energy logit. Initialize a=1,b=0; clamp base probabilities to[1e-6,1-1e-6] only for logit conversion. Freeze four arms: frozen, bias-only update, slope-and-bias update, and slope-and-bias with permuted released labels. Update with one SGD step of size0.05 on binary log loss plus0.01*((a-1)^2+b^2), a in[0.25,4],b in[-2,2]. Bias-only keeps a=1. No encoder/head or generator weights change.
    5. Freeze 24 streams of 32 distinct real responses with prediction seal before release; release labels 1-4 only after prediction 8, labels 5-8 after prediction 12, and so on (delay 4-7 queries), promotion only if the 64 historical guard graphs have Brier increase<=0.005 and classification-error increase<=0 relative to the initial adapter. Repeated guard use supplies a development safeguard, not a statistical guarantee. All arms see the same releases. In each released block of 4, apply a fixed label permutation within that already-released block for the negative control; never use future labels.
    6. Use constructed private probabilities only to verify mechanics: nonzero parameter updates, actual-arm disagreement, future-label invariance, refusal of retention-label access, pending feedback, and exact restart at query 16. The runtime label broker alone reads sealed online labels; detector adapters cannot access sidecars. Declare methods ready regardless of whether development performance improves.
