- id: exp1468-live-sota-logprob-telemetry-preflight
  milestone: 2026.04.113
  deliverable: results/experiment_1468_live_sota_logprob_telemetry_preflight.json
  title: "Live SOTA GGUF Logprob Telemetry Preflight"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 90
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1442-live-sota-repair-runtime-preflight
      verdict: blocked_no_live_sota_runtime
      addressed_by: "Exp1463 repaired the exact runtime/cache blockers and produced a live usable Qwen3.6 GGUF response; this task measures telemetry rather than repairing runtime again."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp1463 repaired the local SOTA GGUF runtime. The next credibility gap is
    whether live local SOTA generations can emit per-token telemetry, especially
    top-k logprobs for HALT, Spilled Energy, and BEAVER-lite bounds. Use
    {project_root} as the project root and {date} as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE; primary telemetry model)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense; secondary telemetry model)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE; secondary telemetry model)
    Legacy small models are allowed only as CPU smoke-tests and must not be
    used for headline telemetry.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - python/carnot/reporting/live_sota_repair_runtime_preflight.py
    - results/experiment_1463_local_sota_gguf_runtime_repair.json
    - research-references.md
    - ops/milestone_113_activation_manifest.md

    TASK:
    Build a small live local SOTA telemetry manifest: generate a bounded set of
    outputs from at least one mandated GGUF model and record whether token
    logprobs, top-k alternatives, logits, and response text are available.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - live_sota_model_inference_used
    - telemetry_cases_requested
    - telemetry_cases_completed
    - topk_logprobs_available
    - logits_available
    - telemetry_manifest_path
    - models_used
    - gpu_probe
    - blockers
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1468_live_sota_logprob_telemetry_preflight.json immediately with status="in_progress".
    2. Use cached_sota_pair() or the exp1463 model paths; do not hardcode legacy small models as headline models.
    3. Generate 10-20 bounded prompts from verified FoVer/GSM8K-style cases with at least one mandated SOTA GGUF.
    4. Attempt to capture token text, token logprob, top-k alternatives, and logits where the local llama.cpp path exposes them.
    5. Write results/live_sota_telemetry_manifest_1468.jsonl with one row per generated case.
    6. Set topk_logprobs_available=true only if enough per-token top-k data exists for downstream HALT/Spilled Energy features.
    7. Record precise blockers for any model that cannot emit telemetry; do not run repair experiments here.
    8. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1468_live_sota_logprob_telemetry_preflight.json')); print(d.get('live_sota_model_inference_used'), d.get('topk_logprobs_available'), d.get('telemetry_cases_completed'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

