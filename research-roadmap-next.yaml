         e. Compare multi-signal ensemble (SinkProbe + Ising) vs Ising-only on 50 questions
         f. Build artifact: schema="carnot.sink_probe.v1", skip_rate, fnr, tnr,
            ensemble_improvement_vs_ising_only, inference_mode
         g. Output: results/experiment_348_sink_probe.json
      7. Write tests/python/test_sink_probe.py (100% coverage required).
      8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      9. Reconcile: update ops/changelog.md, ops/status.md.
      10. Do NOT push. Do NOT modify scripts/research_conductor.py.

