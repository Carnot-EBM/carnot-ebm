           marker-coverage, ft09 local-color-cycle, vc33 support-clearance, g50t target-offset) as few-shot.
        2. Counterexample-guided grounding: Qwen proposes dc22 is_win()/toggle-plan; ground on the offline
           env; on rejection feed the rejecting state back + re-induce (bounded budget); register a dc22
           GameAdapter (toggle blockers, then navigate jfva->goknoi).
        3. Drive the OfflineSolver; run arc_solver_kit.reproduce on dc22 L1.
        4. EMIT inference_substrate matching what step 2 did: live_llm_inference if the Qwen induction ran
           LIVE (>60s), else verifier_ensemble_against_cached_candidates AND ensure duration_s clears its 1s
           floor. NEVER inference_substrate=None. Update ops/arc_solve_registry.yaml dc22 -> reproduced,
