      - {project_root}/results/operational_retro_2026_08_539.json
      - {project_root}/results/experiment_6227_llama_server_signal_sender_diagnostic.json
      - {project_root}/results/experiment_6228_supervised_three_family_runtime_endurance.json
      - {project_root}/results/experiment_6237_activated_mode_jump_sampler_ab.json
      - {project_root}/python/carnot/terminal_artifacts.py
