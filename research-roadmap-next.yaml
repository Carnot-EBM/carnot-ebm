      - CODEX.md
      - scripts/experiment_template.py
      - research-references.md
      - results/experiment_3070_first_token_abstention_sota_panel_v1.json
      - results/experiment_3083_verifier_hardness_autopsy_protocol_v1.json
      - results/experiment_3084_resyn_exact_fixture_bank_generator_v1.json

      TASK
      Run a local SOTA GGUF abstention panel using exact fixtures and report accept, reject, and abstain behavior separately.

      CONCRETE STEPS
      0. PRECONDITIONS: confirm CUDA/GPU/model cache availability, at least one mandated GGUF can load, and the exp3084 fixture manifest exists. If not, write blocked_sota_or_fixture_precondition_failed and stop.
      1. Sample balanced fixtures across families without label leakage.
      2. Run at least one mandated GGUF with baseline prompts and I-CALM/task-abstention prompts.
      3. Measure first-token confidence when available, verbal confidence, answer correctness, abstention, rejection, and overacceptance.
      4. Compare against exp3070 metrics and record whether abstention_precision reaches 0.7.
      5. Write prompt hashes, decode settings, and model specs.

      REQUIRED ARTIFACT FIELDS:
