  - id: exp5459-constraint-distortion-guard-v496
    milestone: "2026.07.496"
    title: "Constraint-distortion guard for factual and semantic rewrites"
    priority: high
    track: verification
    deliverable: results/experiment_5459_constraint_distortion_guard_v496.json
    agent_type: codex
    model: gpt-5.5
    max_turns: 45
    estimated_wall_time_min: 70
    prior_failures:
      - experiment_id: exp5444-gated-sota-energy-guided-decoding-v495
        verdict: "flagged_adversarial: TAUTOLOGY, TAUTOLOGY; result quarantined as not a clean local SOTA guided-decoding success."
        addressed_by: "This task is deterministic and specifically separates truth preservation from constraint satisfaction before future decoding claims."
        retire_if_same_verdict: true
      - experiment_id: exp5458-minimal-core-claim-repair-v496
        verdict: "planned prerequisite: minimal-core repair will expose exact constraint conflicts for distortion rows if already run."
        addressed_by: "This task can consume minimal-core repair IDs when available but still emits its own deterministic distortion guard."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Recent work shows strict constraints can convert honest violations into factual distortions. Carnot must detect when a response satisfies a constraint by rewriting the facts. This task is deterministic; it prepares a guard that Exp5457 and future SOTA panels can consume.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/research-references.md
      - {project_root}/results/experiment_5445_static_ast_kb_witness_constraints_v495.json
      - {project_root}/results/experiment_5458_minimal_core_claim_repair_v496.json
      - {project_root}/python/carnot
      - {project_root}/tests/python

      TASK:
      Build a deterministic constraint-distortion guard that labels truth-preserving constraint compliance, honest constraint violation, unsupported fabrication, and constraint-induced factual distortion.

      CONCRETE STEPS:
      1. Create bounded rows where a constraint conflicts with authoritative facts, ontology triples, API facts, or arithmetic facts.
      2. Encode authoritative facts separately from requested output constraints.
      3. Label rows into truth_preserving_compliance, honest_violation, unsupported_fabrication, and constraint_induced_distortion.
      4. Use exact KB/AST/ontology/arithmetic verifiers as authority; do not use model self-judgment.
      5. Add tests that distinguish a refusal or abstention from a fact rewrite.
      6. Emit the deliverable JSON with REQUIRED ARTIFACT FIELDS:
         - fixture_count: int
         - conflict_family_counts: dict
         - authoritative_fact_source_paths: list
         - distortion_label_counts: dict
         - truth_preserving_compliance_rate: number
         - honest_violation_rate: number
         - constraint_induced_distortion_rate: number
         - unsupported_fabrication_rate: number
         - exact_final_authority: true
         - distortion_guard_ready: bool
         - inference_substrate: deterministic_distortion_guard_no_llm
