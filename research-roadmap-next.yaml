      item 3 "run the self-play loop EVERY milestone") + 2026-06-19 ARC Level-Up Attempt Guarantee (standing):
      versioned lineage continuation of the deepen/self-play tasks (exp4570 cn04 L2, exp4546 su15 L2, which
      SUCCEED); false-positive scope-match vs prior deepen/self-play tasks; the forward difference is the NEXT
      rotation target (a game NOT deepened in .419-.422) + the verifier train/checkpoint on the run pos/neg
      traces. Not a doomed rerun.'
    prompt: |
      CONTEXT ({date}, ARC sprint LEVEL-UP ATTEMPT GUARANTEE + the self-improvement engine). CLAUDE.md mandates
      >=1 task per roadmap that actually BANKS a new reproducible level, AND the operator's 2026-06-21 directive
      mandates running the self-play loop EVERY milestone (the more local self-play, the more the learned verifier
      improves and the live agent warm-starts from it). This task does BOTH: run the standing loop to bank +1
      level AND train+checkpoint the learned verifier on the run's positive (steps-to-go) + negative (off-path/
      dead-end) traces. This is INDEPENDENT of A1/A3/A4 so the guarantee holds even if they null. TARGET ROTATION:
      cn04 was .422, m0r0 was .421 -- rotate to a game NOT deepened in .419-.422. PREFER sk48/ar25 (currently L1;
      graph/world-model family, closest to the proven graph_astar_action_cost + object_motion_world_model
      primitives) for L1->L2; alternatively cd82/sp80/su15 (L2) for L2->L3. Check the registry dead_ends per game
