        addressed_by: "exp2735 (.259) verified SSH reachability + bitstream loaded + uio0 first word readable (kv260_terminal=false — smoke only, not TERMINAL). This exp2742 is the NEXT STEP per CLAUDE.md Hardware-Task Continuity table: 'if uio0_first_word_read=true → ready for board-level latency transcript task (terminal-step).' Different scope: exp2735 was a smoke test; exp2742 is the TERMINAL step that measures actual Ising sampler latency via repeated UIO register reads + spin-read loop on the board. If successful: kv260_synthesis_succeeded=true and KV260 graduates to TERMINAL status."
