  - id: exp381-adversarial-gsm8k-live-execute
    milestone: "2026.06.03"
    deliverable: results/experiment_381_adversarial_execute.json
    title: "Exp 381: Live adversarial GSM8K execution — Carnot's headline credibility experiment"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: THIS IS CARNOT'S HEADLINE CREDIBILITY EXPERIMENT. Apple researchers (arXiv
      2410.05229) showed frontier LLMs drop up to 65% accuracy when one irrelevant sentence
      is appended to GSM8K math problems. Even o1-preview drops 92.7% → 77.4%.

      Carnot's hypothesis: constraint verification (LLMExtractor + Ising energy) is INVARIANT
      to irrelevant context — it parses verifiable claims regardless of surrounding text. So
      verify-repair should maintain accuracy on adversarial variants, showing improvement LARGER
      than on standard variants.

      scripts/experiment_370_adversarial_live.py is a complete, tested script (23 tests pass)
      with a hard CARNOT_FORCE_LIVE=1 gate. It was blocked in milestone 2026.05.27 because the
      env var was never set. Exp 377 fixed this.

      The three conditions: standard (original GSM8K), adversarial (original + irrelevant sentence),
      repaired_adversarial (adversarial + verify-repair with LLMExtractor).

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_370_adversarial_live.py — the existing benchmark script (READ CAREFULLY)
      - python/carnot/pipeline/adversarial_gsm8k.py — AdversarialGSMQuestion, harness (Exp 354)
      - python/carnot/pipeline/llm_extractor.py — LLMExtractor (Exp 366)
      - python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate (Exp 377)
      - results/experiment_354_adversarial_gsm8k_harness.json — harness validation

      TASK: Execute the live adversarial GSM8K benchmark.
      1. Read CLAUDE.md spec-first workflow.
      2. No new spec changes needed (SCENARIO-BENCH-022 from Exp 370 covers this).
      3. Write tests FIRST (100% coverage) for any NEW helper functions only.
      4. Implement scripts/experiment_381_adversarial_execute.py:
         a. ExperimentTemplate(381, "Live adversarial GSM8K — Carnot credibility",
