      - {project_root}/research-references.md V545 planner refresh and terminal marker
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6311_v544_post_marker_source_scope_freeze.json
      - {project_root}/results/experiment_6323_v545_terminal_transition.json
      - {project_root}/ops/exclusion_manifest.yaml, {project_root}/ops/known-issues.md, and {project_root}/research-hardware-wishlist.md
      - {project_root}/scripts/experiment_template.py

      TASK
      Search arXiv first. Then search OpenReview, Hugging Face Papers, Semantic Scholar citation routes for EBT and ARM-EBM, Extropic, Logical Intelligence, and GitHub for work after the V545 planner marker. Record accepted, duplicate, watch-only, inaccessible, and excluded sources. Freeze the restricted policy DSL, exact factor contract, verified fallback, blind checker, anytime-valid certificate, exact counterexample update, protected validation, ARC no-solve influence, and one-detect GateMate contracts. Do not widen V545 without a source receipt and scope-delta record.

