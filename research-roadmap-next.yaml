        1. Pick >=1 corpus where SELECTION headroom is ~0 (oracle@K == vote@1 within noise -- per the spec). Confirm the ~0-headroom condition (report oracle@K and vote@1). If a prior detector artifact measured corpus X, use a NEW corpus/condition (no churn).
        2. Score the verifier ensemble against the cached (input, candidate, error-label) triples; compute detection AUROC + CI95 (5 seeds where the ensemble has stochastic components; else bootstrap CI95 over the corpus, >=2000 resamples). n>=1000 for a sub-percentage detection claim (CLAUDE.md sample-size rigor).
