# Pre-staged roadmap for milestone 2026.06.372 (outer-loop, Claude Opus 4.8, 2026-06-10/11).
#
# PROVENANCE: this is the operator-directed pivot from the 2026-06-10 Deep Think round
# (docs/research-notes/deep-think-results-2026-06-10.md + the outer-loop calibrated assessment).
# Operator authorized pre-staging a .372 that COMMITS to the search/heuristic layer while
# DATA-GATING the decentralization approach on exp4012's result. Per the Pre-Staged Roadmap
# Convention, the conductor preserves this and skips the planner (which, left alone, would
# carry-forward more selection-verifier experiments — the line the evidence says is dead).
#
# THE PIVOT (high-confidence parts, accepted; specific prescriptions held loosely):
#   1. SELECTION MOAT INVERTED (our 5x-adversarial evidence): every smart-selector elaboration
#      flatlines; the GAP-4 lift is generator-attributable. STOP polishing selection. KEEP the
#      zero-loss demo-fit safety gate as the shipped trust product (do NOT delete it), but RETIRE
#      the agreement-as-selector R&D line (exp4023).
#   2. dynamics != heuristics (near-theorem): a verifier gives VALIDITY (legal move?) but ZERO
#      directional gradient (closer to goal?). It cannot crack the L4/Sokoban planning wall alone.
#      The verifier's home is as the SIMULATOR/ENVIRONMENT; a SEPARATE goal-induction + heuristic-
#      search NAVIGATOR is the unsolved layer. THIS MILESTONE BUILDS IT (exp4020 goal-induction +
#      exp4021 search-over-verified-world-model = the central bet).
#   3. Our own vc33 data (99%-accurate verified world model that still fails to solve) REFUTES the
#      Deep Think modality-mismatch steelman: code CAN represent the dynamics; the wall is SEARCH,
#      not representation. exp4021 tests this directly (if search over the verified WM solves it,
#      the wall was search).
#   4. DECENTRALIZATION is data-gated (exp4022): Deep Think confidently claimed best-of-N is
#      hopeless, but exp4012 is measuring exactly that RIGHT NOW. Read its verdict first, then
#      branch (scale if viable; verifier-reward-distillation FEASIBILITY if not). Do not pre-commit
#      to distillation on Deep Think's confidence alone.
#   5. KEEP what works: ARC-3 accuracy via explore-first (exp4024), ArcMemo persistent memory
#      (exp4025) -- both proven this session.
#
# ROUTING: Codex-Default v2 (gemini BANNED -- 2 global-stall incidents). The search tasks run
# over ALREADY-INDUCED world models (no new induction sweeps) so they are CPU/GPU-bounded, not
# many-codex-call long tasks -- they respect the split-long-experiments planner discipline filed
# 2026-06-10. exp4019 archive task = claude + requires_claude_verified (the exp4008 lesson: the
# archive/activate multi-file task hits the codex wall-clock cap; route it to Opus).
#
# OPERATOR REVIEW: pre-staged overnight; will auto-execute when .371 closes. Flagged for morning
# review -- the search-layer commitment (exp4020/4021) is the strategic bet; adjust if desired.
milestone: "2026.06.372"
milestone_title: "THE DEEP-THINK PIVOT: build the SEARCH/HEURISTIC layer the planning wall demands. The session's 5x-adversarial evidence + the 2026-06-10 Deep Think round converged: the selection-verifier moat has inverted (every smart selector flatlines; the lift is generator-attributable), and a verifier gives VALIDITY not directional gradient -- so it cannot crack the L4/Sokoban planning wall alone. The verifier's principled home is as the SIMULATOR/ENVIRONMENT; the unsolved layer is a SEPARATE goal-induction + heuristic-search NAVIGATOR. This milestone builds it: induce the GOAL PREDICATE separately from the dynamics rule (exp4020), then run heuristic search over the induced+verified world model to break a planning wall single-step re-induction stalled on (exp4021, the central bet -- which also tests whether the wall is SEARCH vs REPRESENTATION, our vc33 99%-WM data says search). Decentralization is DATA-GATED on exp4012 (exp4022, branch on the actual best-of-N number, not Deep Think's confidence). DEMOTE the dead selection line: retire the agreement-as-selector claim, keep the shipped safety gate (exp4023). KEEP the proven tracks: 5th-game first-solve (exp4024), ArcMemo transfer (exp4025). Capstone: did adding a search/heuristic layer over the verified world model advance ARC-3 accuracy past the planning wall (exp4028)."
milestone_doc: "docs/research-notes/deep-think-results-2026-06-10.md"

