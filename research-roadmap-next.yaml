        principle: "A flagged memory policy cannot control adaptation."
      - upstream: exp5583-causal-memory-metric-corrigendum
        artifact_field: flagged_adversarial
        op: "=="
        value: false
        principle: "Metric integrity is a prerequisite to promotion."
