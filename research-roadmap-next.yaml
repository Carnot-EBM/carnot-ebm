tasks:
  - id: exp1714-exp1709-codification-paperv6
    title: "Exp 1714: Codify exp1709 near-critical sampler finding into paper-v6 §6 + research-references.md"
    deliverable: results/experiment_1714_exp1709_codification.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures: []
    prompt: |
      CONTEXT: exp1709 (.175) ran a 54-cell ablation (burn-in × h_schedule
      × sampler × beta) at n=128 Curie-Weiss with 10k samples per cell and
      analytic ground-truth comparison. Findings:
        - beta=1.50 (deep symmetry-broken): default 500-step burn-in
          recovers ground-truth within delta_m=0.006. WORKING.
        - beta=1.20 (intermediate): 50,000-step burn-in closes the gap
          to delta_m=0.019 — order of magnitude longer warmup needed.
        - beta=1.05 (near critical beta_c=1.0): NO intervention in the
          54-cell ablation closes the gap (smallest_intervention_closing_gap
          ['1.05'] = null). Bimodal distribution observed at both 1.05
          and 1.20 — confirms symmetry-breaking failure mode.
      This is paper-v6 §6 (limitations) ship-eligible AND has direct Z1
      hardware-mapping implications (Z1 inherits whichever Carnot
      sampler primitive is wired through). The paper-v6 §3 substrate
      prose needs to be updated to acknowledge this regime boundary
      BEFORE arXiv submission, not after.

      FALSIFIABLE HYPOTHESIS: The exp1709 critical-fluctuation finding
      can be codified into (a) a paper-v6 §6 limitation paragraph with
      citation to exp1709 + exp1692, (b) a research-references.md entry,
      and (c) an ops/known-issues.md MANDATORY entry for Phase 4/Z1
      downstream planning, with verbatim quoted numerical results
      preserved per CLAUDE.md no-pruning policy.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1709_thrml_critical_fluctuation.json (the
          source artifact — all 54 cells + bimodality detection)
        - results/experiment_1692_thrml_curie_weiss_ground_truth.json
          (the .171 ground-truth comparison that surfaced the gap)
        - results/experiment_1850_thrml_parity_n128.json (the .144 corrigendum
          that pre-flagged the issue)
        - openspec/papers/paper-v6/section-6-limitations.md (or wherever
          paper-v6 §6 lives — grep for "Limitations" under openspec/)
        - research-references.md (canonical references file)
        - ops/known-issues.md (where the codified MANDATORY entry lands)

      TASK: Write the codification across three documents (§6, references,
      known-issues), preserving all original numerical values.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md Pre-Launch Preconditions Discipline):
           a. `test -f results/experiment_1709_thrml_critical_fluctuation.json`
              succeeds — else `blocked_exp1709_artifact_missing`.
           b. `find openspec/ -name "*.md" | xargs grep -l -i "limitations"`
              returns a paper-v6 §6 file path — else
              `blocked_paperv6_section6_not_locatable`; create it under
              openspec/papers/paper-v6/section-6-limitations.md.
           c. `git status` shows clean working tree on relevant files
              (or only the new task delta) — else record dirty state in
              preconditions_checked but proceed.
           Record preconditions_checked.
        1. Read the exp1709 artifact end-to-end. Extract the verbatim
           numbers: per-beta delta_m at default burn-in, smallest
           intervention that closes the gap, bimodality flags.
        2. Draft a 3-paragraph paper-v6 §6 limitation entry:
             - Paragraph A: state the finding (Carnot + THRML samplers
               miss analytic Curie-Weiss equilibrium near critical beta;
               cite exp1692 + exp1709 by experiment ID and verdict).
             - Paragraph B: characterize the regime boundary (working
               at beta >= 1.50; gap-closable with 100x burn-in at beta=1.20;
               fundamental limit at beta=1.05 over the ablation grid).
             - Paragraph C: Z1 implications + mitigation paths (longer
               burn-in budget where feasible; explicit symmetry-breaking
               field if hardware supports; deferred-to-future-work for
               beta < 1.10).
           NO emojis per CLAUDE.md. Verbose layman explanations.
        3. Add an entry to research-references.md citing the exp1709
           artifact + the analytic Curie-Weiss mean-field reference
           (Stanley 1971 OR another standard reference for the
           m = tanh(beta * m) self-consistency equation).
        4. Add a NEW MANDATORY-NEXT-MILESTONE entry to ops/known-issues.md
           titled "exp1709 Near-Critical Sampler Limit (.176+ MANDATORY
           Z1 + Phase 4 downstream)". CLAUDE.md no-pruning: APPEND, do
           not modify any existing entries.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.codification.v1"
        - experiment: 1714
        - run_date: ISO-8601 UTC
        - duration_s: actual wall time (MUST be > 60s for real prose
          drafting + 3 file edits + diff review)
        - random_seed: 171614 (no random sampling; methodology field)
        - reproducibility_checksum: sha256 of (exp1709 artifact path +
          paper-v6 §6 edit content + research-references diff +
          known-issues edit)
        - preconditions_checked: list
        - model_specs: {{source_artifact: "exp1709",
          files_edited: ["paper-v6 §6", "research-references.md",
          "ops/known-issues.md"], word_count_added: int}}
        - n_samples: 1 (codification task)
        - n_samples_justification: "Ship/codification task; n=1 codification artifact."
        - paper_v6_section_6_word_count_added: int
        - research_references_entries_added: int
        - known_issues_mandatory_added: bool
        - exp1709_numerical_values_preserved: bool (verify by grepping
          edited files for the verbatim delta_m=0.019, delta_m=0.006,
          smallest_intervention values from exp1709)
        - has_emojis_in_paper_v6: false (CLAUDE.md compliance)
        - acceptance_gate_passed: bool (all 3 documents updated AND
          numerical_values_preserved AND not has_emojis)
        - acceptance_gate_criteria: "3 documents updated + verbatim
          numerical values preserved + emoji-free."
        - methodology_note: "Codification task. If word_count_added is
          very low (< 200 across all 3 files combined), the codification
          was likely a stub — disclose honestly."
        - optimization_direction: "neither — codification task"
        - honest_verdict: MUST start with terminal prefix per CLAUDE.md
          Verdict Terminal-Prefix Discipline.

      Run command. Do NOT push to git (operator may want to review).
      Do NOT modify scripts/research_conductor.py.

  - id: exp1715-phase4-alpha-t-audit-retry-v3
    title: "Exp 1715: Phase 4 alpha_t adversarial audit retry v3 — recovers .172/.175 if blocked"
    deliverable: results/experiment_1715_phase4_alpha_t_audit.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1699-phase4-alpha-t-adversarial-audit
        verdict: skipped_pretest_failing_in_172
        addressed_by: "exp1699 (.172) SKIPPED 3 retries. exp1710 (.175) attempted recovery but artifact_not_updated_past_bootstrap (still failing as of .176 draft). This v3 attempt uses an even more explicit precondition check + per-cell artifact write to avoid bootstrap timeout."
        retire_if_same_verdict: true
      - experiment_id: exp1710-phase4-alpha-t-adversarial-audit-retry
        verdict: artifact_not_updated_past_bootstrap_in_175
        addressed_by: "exp1710 (.175) failed because the agent produced the bootstrap artifact but didn't update it within the conductor's stability window. This v3 writes the artifact INCREMENTALLY (one row per cell completed) so the conductor sees activity, AND emits a duration-floor-guarded honest blocked verdict if Phase 4 module is missing."
        retire_if_same_verdict: true
      - experiment_id: exp1693-phase4-active-inference-n64
        verdict: complete_no_collapse_but_implausible_tight_ci
        addressed_by: "exp1693 reported delta_alpha=0.15054 at n=64 with CI [0.15040, 0.15070] — 21x tighter than sample-variance floor per new IMPLAUSIBLE_TIGHT_CI rule #8. Falsifies whether the invariance is real or a measurement artifact."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: This is the THIRD attempt at the Phase 4 alpha_t adversarial
      audit. exp1699 (.172) SKIPPED. exp1710 (.175) artifact_not_updated_
      past_bootstrap. The substantive scope is unchanged — falsify whether
      delta_alpha = inf_t alpha_k6 - inf_t alpha_k1 actually depends on
      verifier content via random-verifier-injection ablation.

      FALSIFIABLE HYPOTHESIS: If alpha_t genuinely measures verifier-induced
      free-energy reduction, then random-verifier injection should drop
      delta_alpha monotonically toward zero. If delta_alpha stays at ~0.15
      EVEN with all-random verifiers, the Phase 4 measurement is a
      bijection-invariance artifact (per arXiv:2512.15605).

      EXISTING CODE TO READ FIRST:
        - results/experiment_1693_phase4_n64.json (the suspicious result)
        - results/experiment_1681_phase4_scaling.json (prior n-sweep)
        - results/experiment_1710_phase4_alpha_t_audit.json (if exists,
          even bootstrap-only — read to see what state it reached)
        - python/carnot/phase4/* if exists; otherwise `grep -rn "alpha_t"
          python/`

      TASK: 4-cell random-verifier ablation at n=32, with incremental
      artifact write to avoid bootstrap-timeout failure mode.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "import sys; sys.path.insert(0,'python'); from
              carnot.phase4 import alpha_t"` succeeds OR grep finds an
              alpha_t implementation under python/carnot/ — if neither,
              emit `blocked_phase4_alpha_t_implementation_missing` and exit.
           b. exp1693 artifact exists and is readable — else
              `blocked_no_baseline_to_compare`.
           Record preconditions_checked.
        1. Write the initial bootstrap artifact with status="in_progress",
           random_fraction_grid_results=[], experiment=1715, schema
           "carnot.phase4_alpha_t_audit.v1".
        2. For each random_fraction in [0, 0.333, 0.667, 1.0]:
             a. Run 30 seeds × 100 MLD steps at n=32 with the
                corresponding mix of real + random verifiers.
             b. Compute delta_alpha + bootstrap_ci_95 for the cell.
             c. APPEND the cell result to random_fraction_grid_results
                in the artifact. REWRITE THE ARTIFACT to disk so the
                conductor sees activity.
        3. After all 4 cells: compute monotonic_decay_observed AND
           artifact_detected flags. Update status="complete".

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase4_alpha_t_audit.v1"
        - experiment: 1715
        - run_date: ISO-8601 UTC
        - duration_s: > 60s (4 cells * 30 seeds is real measurement)
        - random_seed: 171615 (NOT 1715 or 32)
        - reproducibility_checksum: sha256 of (verifier ensemble + random
          seed + alpha_t implementation git_rev)
        - preconditions_checked: list
        - model_specs: {{n_spins: 32, ensemble_k_total: 6,
          random_fraction_grid: [0, 0.333, 0.667, 1.0], mld_steps: 100,
          n_seeds: 30, n_cells: 4}}
        - n_samples: 12000
        - n_samples_justification: "30 seeds × 100 MLD × 4 cells. Bootstrap
          CI on delta_alpha at N=30 has natural width ~0.18/sqrt(30)~0.03
          on metric scale; sub-0.001 CIs trigger IMPLAUSIBLE_TIGHT_CI."
        - random_fraction_grid_results: list of {{random_fraction,
          inf_t_alpha_k6, inf_t_alpha_k1, delta_alpha,
          delta_alpha_bootstrap_ci_95}}
        - monotonic_decay_observed: bool
        - artifact_detected: bool
        - acceptance_gate_passed: true (falsification task — both outcomes
          are findings)
        - acceptance_gate_criteria: "4-cell ablation reported with bootstrap
          CIs; flags set per actual data."
        - methodology_note: "If delta_alpha invariant across 4 cells AND
          bootstrap_ci_95 widths are sub-0.001 across all 4, this confirms
          the bijection-invariance hypothesis from arXiv:2512.15605 —
          disclose honestly in this field. Alternatively if monotonic
          decay observed, Phase 4 hypothesis confirmed empirically."
        - optimization_direction: "neither — falsification audit"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1716-nla-eval-awareness-carry-forward
    title: "Exp 1716: NLA 16th verifier eval-awareness test (carry-forward .172 exp1700, never ran)"
