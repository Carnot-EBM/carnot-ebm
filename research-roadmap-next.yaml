      - results/experiment_3286_clean_verifier_abstention_root_cause_v1.json
      - results/experiment_3275_clean_sota_verifier_rerun_v14.json
      - results/experiment_3268_sota_receipt_methodology_supplement_v1.json if present
      - ops/verifier_authenticity_audit_report.md

      TASK
      Implement or configure the abstention-calibrated clean verifier rerun v15 and emit a repair-gate-ready artifact only if exact-row coverage is non-trivial and false accepts remain zero.

      CONCRETE STEPS
      1. Check nvidia-smi, selected-Python CUDA, and mandated GGUF cache readiness.
      2. Use cached_sota_pair(gpu_indices=(0, 1)) where possible and record every missing mandated model.
      3. Build the exact-row evaluation set from exp3286's plan, with at least 20 exact-checkable rows when available.
      4. Apply the calibrated abstention policy from exp3286.
      5. Report false accepts, false rejects, abstentions, coverage, and per-class reasons. Do not open repair if abstention is still 1.0.

      REQUIRED ARTIFACT FIELDS:
      - abstention_calibrated_clean_verifier_v15_ready: bool (principle: rerun status must be machine-readable)
      - clean_verifier_rerun_ready: bool (principle: gates repair decision)
      - repair_gate_input_clean_enough: bool (principle: repair cannot rely on abstain-all verification)
      - model_specs: dict (principle: mandated SOTA GGUFs must be named)
      - models_used: list (principle: distinguish real SOTA evidence from fallback)
      - missing_model_specs: list (principle: absence must be explicit)
