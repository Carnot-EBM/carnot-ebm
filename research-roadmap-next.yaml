tasks:
  # ===================== PHASE A — recursive-refiner cheap kill-gates =====================
  - id: exp3821-latent-symbol-bridge-unblocked
    milestone: "2026.06.351"
    title: "Latent-Symbol Bridge Task 0 RE-RUN (UNBLOCKED): can an external discrete verifier read a recursive refiner's intermediate latents in-loop, or is offline distillation the only path?"
    priority: critical
    track: research
    max_turns: 50
    agent_type: claude
    model: opus
    requires_claude: true   # judgment: interpret whether intermediate latents are parseable + whether the verifier signal monotonically tracks refinement (open-ended, not a deterministic gate); AND gemini crashes real model/GPU workloads (exp3703, incident_333)
    requires_gpu: false     # arcprize checkpoint loads on CPU; small-Sudoku tiny-train is GPU-opportunistic only; kept loop-safe to avoid kill_zombies contention
    estimated_wall_time_min: 60
    inference_substrate: live_llm_inference
    deliverable: results/experiment_3821_latent_symbol_bridge_unblocked.json
    prior_failures:
      - experiment_id: exp3819-latent-symbol-bridge
        verdict: blocked_trm_checkpoint_not_available
        addressed_by: "The .351 literature sweep RESOLVED the sole blocker: a concrete pretrained TRM checkpoint (huggingface.co/arcprize/trm_arc_prize_verification, loadable via the Samsung TRM repo) AND a clean tiny-train fallback (github.com/olivkoch/nano-trm, small-Sudoku in minutes). exp3819 emitted no scientific result; this attempt downloads/loads a real checkpoint in PRECONDITIONS before probing."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT. Deep Think (2026-06-04, P3, 99%) ruled that using Carnot's EXTERNAL discrete
      verifier (SAT/Z3/AST/programmatic) as the RUNTIME internal Q-head of a recursive latent
      refiner (TRM-class) is likely a FATAL CATEGORY ERROR: intermediate recursive latents are
      continuous + half-baked and decode to gibberish until the final steps, so an external
      verifier in the inner loop throws syntax errors / returns a flat signal -> dead halt
      criterion. The pivot (if confirmed): Carnot's verifier is the OFFLINE DISTILLATION ORACLE
      that trains a continuous learned Q-head (exp3825 builds it). THIS TASK falsifies (or
      confirms) the in-loop assumption for ~$0 scaling compute. The .350 attempt (exp3819)
      BLOCKED on a missing checkpoint; the .351 sweep resolved it. Full framing:
      docs/research-notes/phase3-recursive-refiner-thesis.md (§"Revised plan", TASK 0).

      This is NOT a generation-beats-AR test (no baseline to beat) — do NOT apply a headroom
      gate. Both outcomes are valuable: FALSIFIED confirms the distillation pivot (expected);
      VIABLE is a surprising positive reopening in-loop integration.

      EXISTING CODE TO READ FIRST:
        - docs/research-notes/phase3-recursive-refiner-thesis.md (TASK 0 spec)
        - results/experiment_3819_latent_symbol_bridge.json (the prior blocked attempt)
        - research-references.md (.351 additions: arcprize checkpoint + nano-trm + PTRM)
        - python/carnot/verify/ (the external discrete verifier the in-loop role stands in for)

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE anything else; if any fail, write the blocked verdict and EXIT — DO NOT fabricate):
           a. `{project_root}/.venv/bin/python -c "import torch; print(torch.__version__)"` succeeds
              (use .venv/bin/python, NOT bare python — the venv/CUDA infra trap).
           b. A pretrained TRM checkpoint is obtainable. TRY IN ORDER, stop at first success:
              (i) `huggingface-cli download arcprize/trm_arc_prize_verification` (ARC-AGI TRM
                  state_dicts) loadable via the official TRM repo's load_checkpoint;
              (ii) clone github.com/olivkoch/nano-trm and tiny-train a SMALL Sudoku (4x4/6x6)
                   TRM within a bounded budget (<= ~20 min CPU/GPU) as the toy grid task.
              Prefer a Sudoku/maze grid (clean programmatic verifier, no ARC identity-conditioning
              crutch per arXiv:2512.11847) when both are available.
           c. The grid task's PROGRAMMATIC verifier exists (Sudoku validity / maze-solved /
              ARC-cell-match checker) — this stands in for "Carnot's external discrete verifier
              as the in-loop Q-head".
           If (b) yields no checkpoint AND a bounded tiny-train is infeasible, write honest_verdict
           `blocked_trm_checkpoint_not_available` with preconditions_checked populated, and EXIT.
        1. Load the (pretrained or tiny-trained) TRM + the programmatic grid verifier.
        2. Run the TRM's recursive refinement loop on N >= 100 held-out instances, capturing the
           intermediate latent state h_t at EVERY refinement step t (inner+outer loop).
        3. At each step t, DECODE h_t to a discrete board state via the model's own output head (argmax).
        4. Feed each decoded intermediate state to the PROGRAMMATIC verifier. Record per (t):
           is it structurally parseable / well-formed? and the verifier's scalar signal
           (#constraints satisfied, or accept/reject).
        5. Compute the metrics below.
        6. Apply the falsification gate -> emit the terminal verdict.

      REQUIRED ARTIFACT FIELDS (each with a `principle` note):
        intermediate_state_unparseable_rate_by_step:
          principle: "If early/mid-step decoded states are mostly unparseable, an external discrete verifier physically cannot read them in-loop (DT P3). High early-step unparseable rate = in-loop integration dead."
        verifier_signal_step_spearman:
          principle: "A usable in-loop Q-head signal must MONOTONICALLY track refinement progress; Spearman(verifier_signal, step) not significantly > 0 means the external verifier gives no useful halt gradient."
        verifier_signal_vs_final_correctness_auroc:
          principle: "If the per-step external-verifier reading does not predict final-trajectory correctness, it is useless as a halt criterion regardless of parseability."
        decode_verify_latency_overhead_x:
          principle: "In-loop decode+verify must not balloon per-step latency vs a bare refinement step (DT P3); a large multiplier kills the runtime-integration case on cost alone."
        n_trajectories:
          principle: "N>=100 so the parseable/monotonicity rates are not single-trajectory noise."
        n_steps_per_trajectory:
          principle: "Records the refinement depth over which the bridge was probed."
        trm_checkpoint_source:
          principle: "Records WHICH checkpoint/train path was used (arcprize vs nano-trm tiny-train) so the result is reproducible and the .350 blocker is provably resolved."
        preconditions_checked:
          principle: "Records WHICH resources (torch via .venv, TRM checkpoint, grid verifier) were verified before running; pre-empts the fabrication mode where the agent lacked the model and synthesized a result."
        inference_substrate:
          principle: "Declares this loaded + ran a real model so the duration floor + methodology checks apply."
        random_seed:
          principle: "Determinism precondition for a third party to reproduce the parseable/monotonicity numbers."
        reproducibility_checksum:
          principle: "Content hash of (checkpoint id, task, N, seed) catches silent drift between this run and any replication."
        duration_s:
          principle: "Real model inference over N trajectories takes wall-clock time; implausibly short = fabrication signal."

      FALSIFICATION GATE (acceptance):
        - FALSIFIED (in-loop dead -> distillation is the only path; EXPECTED per DT): early/mid-step
          intermediate_state_unparseable_rate high (>50% unparseable before the final ~20% of steps)
          OR verifier_signal_step_spearman not significantly positive OR decode_verify_latency_overhead_x large.
          honest_verdict: `complete: latent_symbol_bridge_FALSIFIED_inloop_verifier_dead_distillation_only_path`
        - VIABLE (surprising positive — reopens in-loop integration): intermediate states mostly
          parseable through the loop AND verifier_signal_step_spearman > 0.5 AND latency overhead modest.
          honest_verdict: `complete: latent_symbol_bridge_VIABLE_inloop_signal_monotonic`
        - PARTIAL/mixed: honest_verdict `complete: latent_symbol_bridge_PARTIAL_<metrics>`.
        - honest_verdict MUST start with a terminal prefix (`complete:`/`complete_`/`success:`/`passed:`/`shipped:`)
          per CLAUDE.md Verdict Terminal-Prefix Discipline; or `blocked_<resource>` if a precondition failed.

      DISCIPLINE: populate random_seed + reproducibility_checksum + preconditions_checked. Report the
      REAL duration. Small off-the-shelf-model probe — do NOT pad wall-time, do NOT fabricate if the
      TRM checkpoint is unavailable (emit blocked_*).

      Run command: `{project_root}/.venv/bin/python {project_root}/scripts/experiments/experiment_3821_latent_symbol_bridge_unblocked.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3822-trm-escapes-grids-p1
    operator_override: >
      2026-06-04 operator directive (recursive-refiner thesis, net-new DT-P1 falsification):
      NOT a generation-vs-AR rerun of energy-selection/Thesis-A. Distinct question — does the
      recursive-refinement PARADIGM escape fixed-grid topology onto a strictly-1D variable-length
      task with AR headroom? Both outcomes informative; no banked baseline to game.
    milestone: "2026.06.351"
    title: "DT-P1 falsification: vanilla TRM vs matched-COMPUTE AR on a strictly-1D variable-length headroom task (algorithmic sequence correction / multi-step parity) — does the paradigm escape grids?"
    priority: high
    track: research
    max_turns: 50
    agent_type: claude
    model: opus
    requires_claude: true   # judgment: design a fair matched-COMPUTE comparison + interpret whether a length-generalization collapse is real; gemini crashes real GPU workloads
    requires_gpu: false
    estimated_wall_time_min: 60
    inference_substrate: live_llm_inference
    deliverable: results/experiment_3822_trm_escapes_grids_p1.json
    prompt: |
      CONTEXT. Deep Think P1 (90%): our EBM negative was regime-polluted, but TRM's refine-in-place
      success may lean on the FIXED SPATIAL TOPOLOGY of grids. Text/sequence reasoning needs
      variable length + strict left-to-right causality. Cheap falsification: run a vanilla TRM vs a
      matched-COMPUTE autoregressive baseline on a strictly-1D, variable-length task where AR has
      real headroom (e.g. multi-step parity, long-addition-with-carry, or algorithmic string
      correction where the trace must grow with input length). If TRM collapses on unseen lengths
      where AR trivially scratchpads, the paradigm is GRID-BOUND and cannot reach the
      foundation-model mission. Framing: docs/research-notes/phase3-recursive-refiner-thesis.md
      (§"Revised plan", TASK 0.5 + P1). This is a paradigm-scope probe, NOT a banked-product claim.

      EXISTING CODE TO READ FIRST:
        - docs/research-notes/phase3-recursive-refiner-thesis.md (P1, TASK 0.5)
        - research-references.md (.351: nano-trm, 2603.08082 AR-TRM honest-negative)
        - scripts/experiment_template.py (cached_sota_pair / BatchedInferenceRunner patterns)

      CONCRETE STEPS:
        0. PRECONDITIONS (check first; blocked_* + EXIT if any fail — no fabrication):
           a. `{project_root}/.venv/bin/python -c "import torch"` succeeds (use .venv/bin/python).
           b. A TRM substrate is trainable on a 1D task (reuse nano-trm or a minimal TRM block);
              if infeasible within a bounded budget, honest_verdict `blocked_trm_substrate_unavailable`.
        1. Build a 1D variable-length task with a programmatic checker AND confirmed AR headroom:
           AR greedy materially < oracle on held-out lengths. Stratify train lengths vs strictly
           LONGER held-out lengths (the generalization tier).
        2. Train (a) a vanilla TRM and (b) a matched-COMPUTE AR baseline (give AR an equal-FLOP
           best-of-N / scratchpad budget so the comparison is at equal total inference compute,
           NOT equal params — the P0.1 trap).
        3. Evaluate both on the train-length tier AND the longer held-out tier. N >= 100 per tier.
        4. Report per-tier solve rates + the length-generalization gap for each model.
        5. Apply the gate -> terminal verdict.

      REQUIRED ARTIFACT FIELDS (each with a `principle`):
        trm_solve_rate_trainlen / trm_solve_rate_heldout_longer:
          principle: "TRM accuracy on train vs strictly-longer lengths; a large drop = grid/fixed-length-bound, cannot reach variable-length reasoning."
        ar_solve_rate_trainlen / ar_solve_rate_heldout_longer:
          principle: "Matched-COMPUTE AR baseline; AR scratchpads naturally to longer lengths, so this is the headroom reference."
        matched_compute_basis:
          principle: "Documents HOW compute was equalized (FLOP/best-of-N budget) so the comparison is not a params confound (the P0.1 trap)."
        ar_headroom_confirmed:
          principle: "Positive control: AR greedy must be materially below oracle on held-out lengths, else the task is ceiling-polluted and the comparison is uninformative (FALSE_NEGATIVE_RISK)."
        n_per_tier:
          principle: "N>=100 per length tier so solve-rate deltas are not noise."
        preconditions_checked / inference_substrate / random_seed / reproducibility_checksum / duration_s:
          principle: "Standard Pre-Launch + Adversarial-Verify methodology fields; real model training/inference takes wall-clock, implausibly short = fabrication."

      GATE (terminal prefix required):
        - GRID-BOUND (TRM collapses on longer lengths while AR holds): `complete: trm_grid_bound_p1_falsified_paradigm_does_not_escape_grids`
        - ESCAPES (TRM holds length-generalization >= matched-compute AR): `complete: trm_escapes_grids_p1_paradigm_generalizes_1d`
        - INCONCLUSIVE if ar_headroom_confirmed is false (ceiling-polluted task): `complete: INCONCLUSIVE_p1_task_ceiling_polluted_fix_corpus`
        - blocked_trm_substrate_unavailable if a precondition fails.

      Run command: `{project_root}/.venv/bin/python {project_root}/scripts/experiments/experiment_3822_trm_escapes_grids_p1.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3823-trm-not-ebt-curlfree
    operator_override: >
      2026-06-04 operator directive (recursive-refiner thesis, net-new DT-P2 falsification):
      NOT a rerun of Thesis-A EBT bring-up. Distinct deterministic test — fit a scalar energy to a
      trained TRM's latent updates under the curl-free constraint; failure PROVES TRM expresses an
      asymmetric vector field EBT cannot, so the bounded-EBT result does not cover TRM.
    milestone: "2026.06.351"
    title: "DT-P2 falsification: energy-fit to a trained TRM's latent updates Δh under the curl-free constraint (Δh ≈ −∇E(h)) — confirm TRM ≠ EBT (asymmetric vector field, not energy descent)."
    priority: high
    track: research
    max_turns: 40
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # formulaic numerical: Jacobian-symmetry / Helmholtz-decomposition test + least-squares energy fit; well-defined correctness criterion (curl residual), no open-ended judgment
    requires_gpu: false
    estimated_wall_time_min: 30
    inference_substrate: aggregation_from_upstream_artifacts   # consumes exp3821's trained-TRM latents/updates; numerical fit, no new model inference beyond replaying captured Δh
    gated_on:
      - upstream: exp3821-latent-symbol-bridge-unblocked
        artifact_field: trm_checkpoint_source
        op: not_contains
        value: "none"
    deliverable: results/experiment_3823_trm_not_ebt_curlfree.json
    prompt: |
      CONTEXT. Deep Think P2 (95%, strongest defense of the pivot): EBT's inference update field is
      mathematically restricted to be CONSERVATIVE (curl-free; the gradient of a scalar energy, so
      its Jacobian is symmetric). TRM learns a GENERIC discrete-time dynamical system — an arbitrary
      (asymmetric) vector field — so it can express conditional logic / asymmetric attractors / limit
      cycles EBT is mathematically INCAPABLE of. Therefore our bounded EBT result does NOT cover TRM.
      Falsification: capture a trained TRM's latent updates Δh = h_{t+1} − h_t over many states, then
      try to fit a scalar E(h) such that Δh ≈ −∇E(h). The curl-free / symmetric-Jacobian constraint
      should make this FAIL (large curl residual). If it SUCCEEDS, TRM is secretly energy descent
      (also a valuable, surprising finding). Framing: docs/research-notes/phase3-recursive-refiner-thesis.md
      (§"Revised plan", TASK 0.5b + P2).

      EXISTING CODE TO READ FIRST:
        - docs/research-notes/phase3-recursive-refiner-thesis.md (P2, TASK 0.5b)
        - results/experiment_3821_latent_symbol_bridge_unblocked.json (the trained TRM + checkpoint source)
        - research-references.md (.351: 2512.15605 ARM-EBM bijection — the theory frame)

      CONCRETE STEPS:
        0. PRECONDITIONS (blocked_* + EXIT if any fail):
           a. `{project_root}/.venv/bin/python -c "import torch, numpy"` succeeds.
           b. The exp3821 TRM checkpoint/source is loadable (read trm_checkpoint_source from its artifact);
              if not, honest_verdict `blocked_trm_checkpoint_not_available`.
        1. Load the trained TRM; run it on M >= 50 instances, capturing (h_t, Δh_t) pairs at every step.
        2. Estimate the vector field's curl / Jacobian asymmetry directly: for the learned update map
           F(h) = Δh, measure the antisymmetric part of its Jacobian (finite-diff or autograd) — a
           conservative field has (near-)zero antisymmetric Jacobian / zero curl.
        3. ALSO attempt a least-squares scalar-potential fit: parameterize E_φ(h), fit so that
           −∇E_φ(h) ≈ F(h); report the residual ||F + ∇E_φ||/||F|| after convergence.
        4. Compute a positive control: run the SAME pipeline on a KNOWN conservative field (e.g. an
           actual EBT/Langevin update or a synthetic −∇E) — the fit MUST succeed there (residual ~0),
           proving the test can detect conservativity when it exists.
        5. Apply the gate -> terminal verdict.

      REQUIRED ARTIFACT FIELDS (each with a `principle`):
        jacobian_antisymmetry_fraction:
          principle: "Fraction of the update Jacobian that is antisymmetric; >0 implies a non-conservative (curl-bearing) field EBT cannot express."
        scalar_potential_fit_residual:
          principle: "Relative residual of the best −∇E fit to TRM's update field; large residual = TRM ≠ energy descent."
        positive_control_fit_residual:
          principle: "Same fit on a KNOWN conservative field must give ~0 residual — proves the test detects conservativity and a large TRM residual is real, not a fitter failure."
        n_states_sampled:
          principle: "M>=50 instances so the curl/residual estimates are not single-trajectory artifacts."
        preconditions_checked / inference_substrate / random_seed / reproducibility_checksum / duration_s:
          principle: "Standard methodology fields; deterministic numerical test, real compute over M states."

      GATE (terminal prefix required):
        - TRM ≠ EBT (curl present, fit fails, positive control passes): `complete: trm_not_ebt_curlfree_falsified_asymmetric_field_bounded_ebt_does_not_cover_trm`
        - TRM ⊆ EBT (fit succeeds, low residual): `complete: trm_is_secretly_energy_descent_surprising_residual<X>`
        - INCONCLUSIVE if positive control fails (fitter broken): `complete: INCONCLUSIVE_curlfree_positive_control_failed`
        - blocked_trm_checkpoint_not_available if a precondition fails.

      Run command: `{project_root}/.venv/bin/python {project_root}/scripts/experiments/experiment_3823_trm_not_ebt_curlfree.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  # ===================== PHASE B — the distillation-oracle path =====================
  - id: exp3824-headroom-gate-corpus
    operator_override: >
      2026-06-04 operator directive (recursive-refiner thesis, MANDATORY positive-control per DT):
      net-new combinatorial-grid headroom corpus with an ABORT-if-ceiling gate. NOT a P0.1/Kona
      rerun — explicitly a grid regime with confirmed oracle>AR headroom, the opposite of the
      NL-math near-ceiling regime that bounded both energy routes.
    milestone: "2026.06.351"
    title: "Headroom-gate corpus + positive control (MANDATORY before any generator training): curate a grid corpus where AR greedy ≈ 20% AND AR+SC@32 < 50%; ABORT if AR+SC@32 > 75% (the ceiling-pollution trap)."
    priority: critical
    track: research
    max_turns: 50
    agent_type: claude
    model: opus
    requires_claude: true   # judgment: corpus curation + difficulty stratification to hit a precise headroom band, and the abort decision; the FALSE_NEGATIVE_RISK trap is a judgment call gemini cannot be trusted with on GPU
    requires_gpu: false
    estimated_wall_time_min: 50
    inference_substrate: live_llm_inference
    deliverable: results/experiment_3824_headroom_gate_corpus.json
    prompt: |
      CONTEXT. The single non-negotiable precondition before any TRM-vs-AR generator training is a
      corpus with REAL headroom — the lesson from two prior expensive false negatives (P0.1
      energy-selection, Thesis-A EBT), both regime-polluted because self-consistency was already
      near-ceiling. DT tightened the gate: curate a combinatorial-grid corpus where AR greedy ≈ 20%
      AND AR + Self-Consistency@32 plateaus FIRMLY < 50%, and ABORT IMMEDIATELY if AR+SC@32 > 75%.
      This corpus feeds exp3825 (distillation-oracle training). Framing:
      docs/research-notes/phase3-recursive-refiner-thesis.md (§"MANDATORY positive-control gate").

      CRITICAL: emit the gate field `headroom_confirmed` as a BARE boolean (true/false), NOT a
      principle-annotated {value, principle} dict — the conductor's gated_on compares the raw value
      and a dict breaks the downstream gate (feedback_gated_fields_must_be_bare).

      EXISTING CODE TO READ FIRST:
        - docs/research-notes/phase3-recursive-refiner-thesis.md (positive-control gate)
        - research-references.md (.351: nano-trm Sudoku/Maze tasks; 2512.11847 ARC TTC/identity caveat)
        - results/experiment_3518* and any prior graph-coloring/grid corpus builders (avoid saturation)

      CONCRETE STEPS:
        0. PRECONDITIONS (blocked_* + EXIT if any fail):
           a. `{project_root}/.venv/bin/python -c "import torch"` succeeds.
           b. A grid task generator + programmatic verifier is available (Sudoku-Extreme / Maze-Hard
              via nano-trm, or an in-repo grid generator). If not, honest_verdict `blocked_grid_generator_unavailable`.
        1. Generate a difficulty-stratified grid corpus (n >= 50, target 50-100), with an oracle/optimal
           solver to compute the upper bound per instance.
        2. Measure a matched-COMPUTE AR baseline: greedy solve rate AND Self-Consistency@32 solve rate.
        3. Compute the headroom band: oracle_solve_rate − ar_sc32_solve_rate.
        4. Apply the gate:
           - CONFIRMED: ar_greedy ≈ 0.20 (loose) AND ar_sc32 < 0.50 AND oracle materially > ar_sc32.
             Set headroom_confirmed = true.
           - ABORT: ar_sc32 > 0.75 -> set headroom_confirmed = false; corpus is ceiling-polluted.
        5. Persist the corpus path + the gate verdict.

      REQUIRED ARTIFACT FIELDS (each with a `principle`):
        headroom_confirmed:
          principle: "BARE boolean gate for exp3825. True iff AR is far from ceiling AND oracle materially exceeds AR+SC@32 — the precondition that the two prior energy false-negatives lacked."
        ar_greedy_solve_rate / ar_sc32_solve_rate / oracle_solve_rate:
          principle: "The three numbers the gate is computed from; AR+SC@32 > 0.75 is the hard ABORT (ceiling-pollution trap)."
        headroom_margin:
          principle: "oracle − ar_sc32; the selectable headroom any generator must exploit to claim a win (FALSE_NEGATIVE_RISK guard)."
        corpus_path / n_instances / difficulty_strata:
          principle: "The curated corpus exp3825 will train against; stratification documents non-saturation."
        preconditions_checked / inference_substrate / random_seed / reproducibility_checksum / duration_s:
          principle: "Standard methodology fields; AR+SC@32 over n instances takes real wall-clock."

      GATE (terminal prefix required):
        - headroom confirmed: `complete: headroom_gate_CONFIRMED_argreedy<X>_arsc32<Y>_oracle<Z>_corpus_ready_for_distillation`
        - aborted (ceiling-polluted): `complete: headroom_gate_ABORT_arsc32<Y>_ceiling_polluted_fix_corpus_before_training`
        - blocked_grid_generator_unavailable if a precondition fails.

      Run command: `{project_root}/.venv/bin/python {project_root}/scripts/experiments/experiment_3824_headroom_gate_corpus.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3825-distillation-oracle-qhead
    operator_override: >
      2026-06-04 operator directive (recursive-refiner thesis, the DT-revised integration path):
      net-new offline Q-head distillation pipeline (VerifierQ/RL^V machinery). NOT a rerun of FR-11
      Tier-3 predictor — distinct artifact (continuous Q-head reading TRM latents, distilled from the
      verifier oracle over FINAL trajectories), and the milestone's continuous-self-learning task.
    milestone: "2026.06.351"
    title: "Distillation-oracle prototype: Carnot verifier scores final TRM trajectories -> train a continuous Q-head (offline Q-learning / BCE-MSE) that natively reads continuous latents. [CONTINUOUS SELF-LEARNING — Tier 3/4]"
    priority: high
    track: research
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # scaffolding-heavy + well-documented recipe (VerifierQ IQL/conservative-Q + a BCE/MSE head over captured latents); established pipeline pattern, deterministic training-loss correctness criterion
    requires_gpu: false
    estimated_wall_time_min: 60
    inference_substrate: live_llm_inference
    gated_on:
