          'spilled_energy_marginal' if 0.50 < auroc <= 0.60
          'spilled_energy_below_random' if auroc <= 0.50
    4. Write tests in tests/python/test_spilled_energy_detector.py (100% coverage).
       100% spec coverage: tests reference REQ-PROBE-011 / SCENARIO-PROBE-016.
