  - id: exp388-saver-live-execute
    milestone: "2026.06.03"
    deliverable: results/experiment_388_saver_live.json
    title: "Exp 388: SAVeR live multi-turn verification — faithfulness on real reasoning chains"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 362 implemented SAVeRVerifier (arXiv 2604.08401 pattern) — an auditor-before-
      commit loop for multi-turn agent reasoning. The module is complete (31 tests, CI-safe) but
      has never run with live GPU. This experiment executes the SAVeR pipeline with live inference:
      a reasoning chain of 5 steps, each step verified by VerifyRepairPipeline before being
      committed to accumulated facts.

      SAVeR hypothesis: if each reasoning step is verified before commitment, the final answer's
      faithfulness (fraction of committed steps) will be higher than without verification because
      errors are caught and repaired before they propagate.

      Test scenarios (5 multi-step chains):
        1. Shopping total with tax (3 steps)
        2. Train schedule intersection (4 steps)
        3. Rectangle area with unit conversion (3 steps)
        4. Discount stacking (4 steps)
        5. Worker productivity comparison (5 steps)

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/saver_verifier.py — SAVeRVerifier, AgentStep (Exp 362)
      - scripts/experiment_362_saver_multi_turn.py — prior CI-safe script (READ CAREFULLY)
      - python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate (Exp 377)
      - python/carnot/pipeline/llm_extractor.py — LLMExtractor (Exp 366)

      TASK: Execute SAVeR multi-turn verification with live GPU.
      1. Read CLAUDE.md spec-first workflow.
      2. Add SCENARIO-AGENT-004 (live SAVeR faithfulness confirmed) if not in spec.
      3. Write tests FIRST (100% coverage) for any NEW helper functions.
      4. Implement scripts/experiment_388_saver_live.py:
         a. ExperimentTemplate(388, "SAVeR live multi-turn verification",
            "results/experiment_388_saver_live.json", requires_gpu=True)
         b. tmpl.setup()
         c. blocked = LiveGPUGate.require_live_or_blocked(tmpl, ["google/gemma-4-E4B-it",
            "Qwen/Qwen3.5-0.8B"])
            If blocked is not None: write blocked artifact, exit.
         d. gpu_status = tmpl.setup_gpu([{"name": "Gemma4-E4B-it",
            "hf_id": "google/gemma-4-E4B-it", "gpu": 0},
            {"name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 1}])
            If not gpu_status["all_healthy"]: write blocked artifact, exit.
         e. Create VerifyRepairPipeline with LLMExtractor(llm_caller=live_qwen)
         f. Create SAVeRVerifier(pipeline=live_pipeline, max_repair_attempts=3)
         g. Define 5 reasoning chains with step prompts (questions to Gemma4-E4B-it)
         h. For each chain: run SAVeRVerifier.run_chain(steps, initial_state=ConstraintState())
            Each step: Gemma4-E4B-it generates chain-of-thought → SAVeR verifies → commit/block
         i. Compute per-chain: faithfulness (fraction committed), n_repairs, n_blocked_steps
         j. Compute overall: mean_faithfulness, comparison to CI-safe mode (Exp 362: 1.0 faithfulness
            expected with empty pipeline, but now with real verification it may be <1.0 when errors found)
         k. Build artifact: schema="carnot.saver_live.v1",
            inference_mode="live_gpu", n_chains=5, per_chain_results,
            mean_faithfulness, total_repairs_made, total_steps_blocked,
            honest_verdict: "live_verification_active" when inference_mode=="live_gpu" AND
            any repair or block occurred (proof that real violations were detected);
            "live_no_violations_found" when live but faithfulness=1.0 everywhere;
            "blocked" when not live
         l. Output: results/experiment_388_saver_live.json
      5. Write tests/python/test_experiment_388_saver_live.py (100% coverage).
      6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      7. Reconcile: update ops/conductor-log.md, ops/changelog.md, ops/status.md.
      Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      Do NOT push. Do NOT modify scripts/research_conductor.py.

