        1. BRANCH:
           IF val>=0.85 (faithful):
             - RERANK arm: sample K candidate solutions per held-out puzzle; rerank by the executable Sudoku verifier; pass@1 lift vs TRM-vote + vs oracle, bootstrap CI.
