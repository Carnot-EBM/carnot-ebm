milestone: 2026.06.414
milestone_title: 'CLOSE the 25 public games to 25/25 first-contact (re86 sprite-resize verifier + bp35/lf52
  adapter-free first-contact -- the 3 remaining unsolved) + DEEPEN a shallow game, SHIP the durable --no-cov
  precondition lint so the dc22-class throughput block (a whole .412 milestone lost) is structurally impossible,
  DECOUPLE solve tasks from gated_on cascades, and BOOST the verifier training pipeline with REFLECTION-augmented
  v2 data (validated this session: regularizes an overfit position-specific weight 214->42 toward the
  reflection-invariance the held-out 110 eval games reward) + BUILD the variant transfer benchmark (exp4472
  test exists, module unbuilt). ALL experiments agent_type=codex/gpt-5.5 (ARC sprint quota-conserve; planner/retro
  stay Claude). Reserved: 2 infra + 1 hardware-continuity (KV260/GateMate/PolarFire) + 1 SOTA-ingestion.
  >=4 LEVEL-UP attempts (re86, bp35, lf52, deepen) per the ARC Level-Up Attempt Guarantee. Live generator
  Qwen3.5-9B-MTP, NEVER the 3090s. NO leaderboard submission in-loop (operator-only).'
milestone_doc: openspec/change-proposals/research-roadmap-v414.md
milestone_overview: '.413 banked dc22+sc25(L2-L5)+sb26 (39->45 reproducible levels, 22/25 games first-contacted).
  .414 closes the breadth gap: the 3 remaining unsolved public games (re86 needs a sprite-resize verifier;
  bp35/lf52 never first-contacted) + one deepen, while shipping the throughput fixes the .412/.413 diagnosis
  identified (the --no-cov precondition default as a durable lint; gated_on decoupling) and consuming
  the reflection-augmentation verifier bridge built 2026-06-19 (wire+measure vs un-augmented; honest null
  allowed). Variant work targets the generalization the hidden eval rewards, the cheapest way to manufacture
  unseen-but-known-correct data since the 25 public games are all there are.'
