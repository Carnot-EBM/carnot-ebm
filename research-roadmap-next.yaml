            def run_iteration(self, questions: list[str],
                              model_a_device: str, model_b_device: str,
                              temp_a: float = 0.7, temp_b: float = 1.0) -> IterationResult:
              - Generate responses with model on device A (temp_a) and device B (temp_b).
              - Score each response pair with SymCodeVerifier (violation energy).
