- id: exp7151-v629-active-contract-preflight
  title: V629 active Markdown and YAML task-contract preflight
  track: infrastructure
  priority: critical
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 45
  per_unit_rows: true
  milestone: 2026.09.629
  deliverable: results/experiment_7151_v629_contract_preflight.json
  prior_failures:
    - experiment_id: exp7148-v628-contract-preflight
      verdict: blocked_v628_contract_preflight_prerequisite_missing
      addressed_by: "V629 reads the active research-roadmap.yaml after activation and never requires the consumed research-roadmap-next.yaml."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V628 claimed 12 tasks in its design document, but its active YAML held only
    three. Exp7148 then read research-roadmap-next.yaml after activation had
    consumed that file. V629 defines exactly 14 tasks, exp7151 through exp7164.
    The execution-time YAML authority is research-roadmap.yaml. This advisory
    preflight does not gate science tasks.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7148_v628_contract_preflight.json
    - {project_root}/python/carnot/experiment_7148_v628_contract_preflight.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/validate_prior_failures.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_fit_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and run an independent active-YAML-versus-Markdown contract check.
    Check exact count, order, IDs, titles, deliverables, structured gates,
    producer fields, failure histories, model rules, routing, focused tests,
    progress duties, and prompt tails. Do not rewrite or activate a roadmap.

    CONCRETE STEPS:
    0. Create the schema-complete artifact before any check. Set status=running,
       flush it, complete local prerequisite checks, then leave running state.
       If an input is missing, finish once as blocked_no_run with an exact
       gate_check_summary. Do not leave a bootstrap-only artifact.
    1. At every numbered phase boundary, print a flushed progress line. Print
       flushed start and end lines immediately before and after every call that
       can take minutes, including a model load, generation, benchmark, or
       subprocess. Print a flushed heartbeat at least every 300 seconds inside
       long loops. Keep every stdout gap below 600 seconds.
    2. Add REQ-REPORT-7151 and focused RED tests in
       tests/python/test_experiment_7151_v629_contract_preflight.py before code.
    3. Parse the exact-task table in the Markdown and the task list in active
       research-roadmap.yaml independently. Never derive both views from one
       constant, parser result, fixture, or object.
    4. Require milestone 2026.09.629 and exactly 14 full IDs in order, from
       exp7151-v629-active-contract-preflight through exp7164-v629-capstone.
    5. Compare exact titles, deliverables, task order, agent routing, and every
       structured gate. Normalize Markdown gates to full IDs.
    6. For each gate, require an earlier upstream task in this roadmap and the
       identical bare top-level field in the producer's own REQUIRED ARTIFACT
       FIELDS. Check prior_failures four-field completeness and operator
       override format.
    7. Check all comparative tasks for per_unit_rows, all prompts for a closed
       verdict_class and blocked gate_check_summary, all LLM tasks for mandated
       MODEL_SPECS, and every prompt for the flushed progress contract and
       exact final two lines.
    8. Run roadmap schema, prior-failure, gate, exclusion-manifest,
       harness-fit, artifact, adversarial, row-consistency, scoped
       spec-coverage, and root-clutter checks. Use only the focused test file.
    9. Set v629_task_contract_conforms_score=1 only if all 14 rows agree.
       Contract mismatch is disqualified. Missing input is blocked. Neither
       case is partial.
    10. REQUIRED ARTIFACT FIELDS: field_principles for every field below;
       preconditions_checked; run_date; inference_substrate
       (aggregation_from_active_contract: independent Markdown and active YAML
       parses); inference_substrate_class (aggregation or blocked_no_run);
       execution_venue (host); duration_s; source_artifact_hashes; rows;
       markdown_task_rows; yaml_task_rows; task_contract_rows;
       deliverable_parity_rows; gate_contract_rows; gate_producer_rows;
       prior_failure_rows; operator_override_rows; model_compliance_rows;
       agent_routing_rows; focused_test_rows; prompt_tail_rows;
       progress_contract_rows; expected_task_count (14); observed_task_count;
       expected_id_order; observed_id_order;
       v629_task_contract_conforms_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value whenever honest_verdict starts
       blocked_; verifier_is_oracle (false); verdict_class (positive |
       circular_positive | null | blocked | disqualified | partial);
       honest_verdict consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7151_v629_contract_preflight.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7152-v629-source-and-cache-delta
