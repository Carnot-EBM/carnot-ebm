    \ monitor on the extended diagnostic set and computes gate_open for VR attempt\
    \ #16. gate_open = recall >= 0.20 on 25 known-incorrect responses is REQUIRED\
    \ before Exp 630 (VR #16) can be scheduled. READ Exp 627 result first.\
    \ Also run HERMES-style step-boundary verification (read Exp 633 approach if\
    \ available) as an alternative extractor candidate.\n\nEXISTING CODE TO READ FIRST:\n\
    - results/experiment_627_interwhen_monitor.json — interwhen_recall, gate_open\
    \ from Exp 627\n- python/carnot/pipeline/interwhen_monitor.py — InterWhenMonitor\
    \ (Exp 627)\n- python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier (Exp\
    \ 619)\n- results/live_pairs_578.json or results/fover_corpus_v5.json — live corpus\n\
    - results/experiment_617_extractor_diagnostic_v5.json — prior gate result (gate_open=False)\n\
    \nTASK: Run InterWhenMonitor on extended diagnostic set (50 incorrect + 20 correct\
    \ for statistical confidence). Compute gate.\n1. Read CLAUDE.md spec-first workflow.\n\
    2. Add REQ-VERIFY-132 (interwhen gate: recall >= 0.20 on 25 known-incorrect live\
    \ responses gates VR #16), SCENARIO-VERIFY-171/172 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write scripts/experiment_629_interwhen_diagnostic.py:\n   a. apply_env_autofix()\
    \ FIRST.\n   b. from python.carnot.pipeline.live_assertion import assert_live_or_ci_skip;\
    \ assert_live_or_ci_skip().\n   c. ExperimentTimeoutWatchdog(629, timeout_minutes=40).\n\
    \   d. ExperimentTemplate(629, 'InterWhen Diagnostic Gate',\n      'results/experiment_629_interwhen_diagnostic.json',\
    \ requires_gpu=False).\n   e. Load 25 incorrect + 10 correct from live corpus\
    \ (primary gate set) AND\n      25 more incorrect + 10 more correct if available\
    \ (extended set for confidence).\n      llm_caller: Qwen3.5-0.8B CPU if CARNOT_FORCE_LIVE=1.\n\
    \   f. monitor = InterWhenMonitor(SymCodeVerifier(llm_caller=llm_caller)).\n  \
    \    Primary set (25 incorrect, 10 correct):\n      interwhen_tp_primary = sum(monitor.any_violation(r)\
    \ for r in primary_incorrect)\n      interwhen_fp_primary = sum(monitor.any_violation(r)\
    \ for r in primary_correct)\n      interwhen_recall_primary = interwhen_tp_primary\
    \ / 25\n      interwhen_fp_rate_primary = interwhen_fp_primary / 10\n      Extended\
    \ set (if available):\n      interwhen_recall_extended = same on 50 incorrect\n\
    \   g. gate_open = interwhen_recall_primary >= 0.20.\n   h. Build artifact: schema='carnot.interwhen_diagnostic.v1',\n\
    \      n_primary_incorrect=25, n_primary_correct=10,\n      interwhen_tp_primary=<int>,\
    \ interwhen_fp_primary=<int>,\n      interwhen_recall_primary=<float>, interwhen_fp_rate_primary=<float>,\n\
    \      interwhen_recall_extended=<float | None>,\n      prior_best_recall=0.04,\n\
    \      gate_open=<bool>,\n      gate_note='Exp 630 GATED — do not schedule without\
    \ gate_open=True' if not gate_open\n               else 'Exp 630 UNBLOCKED —\
    \ schedule VR attempt #16',\n      retro_070_partial=(interwhen_recall_primary\
    \ > 0.04),\n      retro_070_resolved=(interwhen_recall_primary >= 0.20),\n    \
    \  honest_verdict='gate_open_vr_unblocked' if gate_open else 'gate_closed_do_not_retry'.\n\
    \   i. tmpl.assert_deliverable_written() as FINAL LINE.\n4. Write tests/python/test_experiment_629_interwhen_diagnostic.py\
    \ (100% coverage on new functions).\n5. Run: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\n6. Reconcile: ops/conductor-log.md (gate decision for VR #16),\
    \ ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp630-live-vr-attempt-16
