- id: exp5200-hidden-state-verifier-v2-mmlu-pro-v476
  milestone: 2026.07.476
  title: PHASE C1 re-attempt (never ran in .475, poison-test cascade) -- hidden-state verifier v2 on the
    zero-shot MMLU-Pro headroom pool, PHSV-style trained probe vs THREE zero-training baselines including
    Radial Consensus Score; this milestone's continuous self-learning experiment
  priority: high
  track: research
  deliverable: results/experiment_5200_hidden_state_verifier_v2_mmlu_pro_v476.json
  prior_failures:
  - experiment_id: exp5178-hidden-state-verifier-pilot-v474
    verdict: complete_hidden_state_verifier_ties_tuned_sc_accuracy_point_lower_efficiency_loses_to_sc_extra_hidden_forward_wins_vs_llm_judge_no_decode_hidden0.000_sc0.333_delta-0.333
    addressed_by: "exp5178's failure had two plausible causes conflated: (1) too small a sample (n=6
      questions, 48 candidates) to draw any conclusion, and (2) too weak a probe (a naive trained
      centroid on final-token-only embeddings, not a proper trained classifier). This task fixes BOTH:
      uses the already-confirmed-headroom, ZERO-SHOT MMLU-Pro pool (240 candidate rows,
      results/experiment_mmlu_pro_verifier_candidate_pool.jsonl, oracle_at_k=0.350 vs sc_vote=0.075,
      CI95=[0.150,0.425] excluding 0, per results/experiment_mmlu_pro_fresh_headroom_check.json --
      NOTE: do not confuse this with exp5163's DIFFERENT 5-shot-rescaled MMLU-Pro numbers
      (oracle_at_k=0.5, sc_vote=0.125) which is a different measurement of a different corpus
      configuration; this task uses the zero-shot fresh_headroom_check pool specifically), and implements
      PHSV's (arXiv:2504.05419) concrete recipe (small trained MLP on chunk-boundary hidden states, not a
      centroid) instead of the naive probe. This is PHASE D's sanctioned hidden-state-verifier exception,
      explicitly preserved by ops/exclusion_manifest.yaml:phase_d_external_text_scorer_retired_exp5163_v474
      -- this task's scope is architecturally distinct (internal representations, not generated-text/
      logprob scoring)."
    retire_if_same_verdict: true
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 60
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. Hidden-state / internal-representation verifiers
    (TrajSelector-style, arXiv:2510.16449) are the ONE sanctioned exception to PHASE D's external-text-
    scorer retirement (`ops/exclusion_manifest.yaml:phase_d_external_text_scorer_retired_exp5163_v474`) --
    an architecturally distinct mechanism (scores the generator's OWN hidden activations, not its
    generated text or logprobs). `.474`'s exp5178 pilot was honest but underpowered (n=6) and used a weak
    probe design (a naive centroid, not a trained classifier). This task retries with both fixes.

    THE CORPUS: `results/experiment_mmlu_pro_verifier_candidate_pool.jsonl` (240 rows) is a REAL,
    already-measured, headroom-CONFIRMED zero-shot pool (`results/experiment_mmlu_pro_fresh_headroom_check.json`:
    `oracle_at_k=0.350`, `sc_vote=0.075`, `headroom=0.275`, `headroom_ci95=[0.150,0.425]` -- clearly
    excludes 0, adversarial_verify 0-flagged). USE THIS FILE SPECIFICALLY -- do not substitute
    `experiment_5163_mmlu_pro_verifier_rescale_v473.json`'s numbers (a DIFFERENT, 5-shot-rescaled
    measurement of MMLU-Pro with oracle_at_k=0.5/sc_vote=0.125; citing those numbers for this task's
    zero-shot corpus would be a methodology error). Per arXiv:2512.02304's headroom-precondition
    formalism, a verifier can only conceivably beat self-consistency where real headroom exists -- this
    corpus has it; exp5178's MuSR slice largely did not (near-ceiling).

    THE PROBE DESIGN (PHSV, arXiv:2504.05419 -- "Reasoning Models Know When They're Right: Probing Hidden
    States for Self-Verification"): chunk reasoning traces at natural boundary markers ("wait",
    "double-check", step transitions), extract last-token/last-layer hidden state at each chunk boundary,
    train a small 2-layer MLP classifier on (hidden_state, correctness_label) pairs, reported AUROC
    0.75-0.91 on comparable open-weight local models.

    KNOWN EXTRACTION CONSTRAINT: `llama_cpp.Llama(embedding=True, pooling_type=LAST).embed` -- the
    extraction path already validated in this repo for `unsloth/gemma-4-26B-A4B-it-GGUF` -- exposes ONLY
    the final-token, final-layer embedding vector; llama.cpp does not expose per-layer hidden states or
    steering hooks. PHSV's chunk-boundary recipe is compatible with final-layer extraction (it also uses
    last-token/last-layer as its primary recipe), but a layer-sweep (checking whether intermediate layers
    beat final-layer, per FEPoID arXiv:2605.26366) is NOT achievable through this extraction path without
    a heavier `transformers`-library load (`output_hidden_states=True`). Treat the layer-sweep as
    OPTIONAL/stretch: attempt it if a `transformers` load path is straightforward given this milestone's
    exp5196 DiffusionGemma device-placement work; otherwise proceed final-layer-only and note the
    limitation explicitly.

    MANDATORY CONTROL ARMS (a trained probe's extraction overhead must earn its keep against FOUR
    alternatives, not one):
    - Self-certainty (arXiv:2502.18581): zero-training baseline from logit-distribution divergence from
      uniform -- no hidden-state extraction at all.
    - CLUE (arXiv:2510.01591): non-parametric hidden-state clustering, training-free (reuses the same
      extracted vectors as the trained probe, but no MLP fit).
    - Radial Consensus Score (arXiv:2604.12196, "Beyond Majority Voting: Efficient Best-Of-N with Radial
      Consensus Score" -- WebFetch-verified real this planning session): a weighted Frechet mean
      (semantic center) of answer embeddings, ranking candidates by radial distance to that center -- a
      training-free, black-box, embedding-geometry replacement for majority voting.
    - Tuned self-consistency (the baseline every verifier-moat claim in this project must beat).

    This task doubles as the milestone's continuous-self-learning experiment (research-program.md requires
    at least one per milestone): the probe is trained on the model's own accumulated correct/incorrect
    experience over the 240-row pool. Per CLAUDE.md's Missing-Verifier Gap Logging discipline, log any
    residual failure mode (a candidate class the probe cannot discriminate) to `ops/verifier_gaps.md`.

    EXISTING CODE TO READ FIRST:
    - results/experiment_5178_hidden_state_verifier_pilot_v474.json (the prior pilot's exact extraction
      path, `hidden_state_access_metadata`, and probe design -- avoid repeating the naive-centroid mistake).
    - results/experiment_mmlu_pro_fresh_headroom_check.json and
      results/experiment_mmlu_pro_verifier_candidate_pool.jsonl (the target corpus -- the ZERO-SHOT one).
    - python/carnot/experiment_5178_hidden_state_verifier_pilot_v474.py (the extraction harness -- extend
      with the chunk-boundary/MLP probe, do not rewrite the GGUF-loading plumbing).
    - CLAUDE.md "Circularity / Oracle-Distinctness Discipline" (must declare `verifier_is_oracle: false` --
      gold labels are for training/eval splits only, per exp5178's own correct precedent).

    CONCRETE STEPS:
    0. PRECONDITIONS: confirm the GGUF model is cached and the candidate pool file exists with 240 rows.
       If either is missing, `blocked_<resource>`.
    1. Extract hidden-state vectors for every candidate via the validated llama.cpp embedding path (reuse
       exp5178's exact extraction call).
    2. Split the pool into train/eval with NO leakage across the same question (k-fold or held-out by
       question_id).
    3. Train the PHSV-style 2-layer MLP probe on the training split.
    4. Compute self-certainty, CLUE, and Radial Consensus Score control-arm scores on the SAME eval split
       (self-certainty needs no extra LLM calls; CLUE and RCS reuse the already-extracted vectors).
    5. Score all FIVE methods (trained probe, self-certainty, CLUE, RCS, tuned self-consistency) on the
       eval split's selection accuracy; compute paired bootstrap CI95 and McNemar p-value for
       probe-vs-SC and probe-vs-each-of-the-other-three control arms.
    6. If straightforward, attempt the FEPoID-style layer-sweep as a stretch goal; otherwise report
       final-layer-only and note the limitation.
    7. Update `ops/verifier_gaps.md` with the residual failure-mode analysis per Missing-Verifier Gap
       Logging.

    REQUIRED ARTIFACT FIELDS:
      probe_accuracy:
        value: float
      self_certainty_accuracy:
        value: float
      clue_accuracy:
        value: float
      radial_consensus_score_accuracy:
        value: float
      tuned_sc_accuracy:
        value: float
      probe_vs_sc_delta_ci95:
        value: "[lo, hi]"
      probe_vs_sc_mcnemar_p:
        value: float
      probe_vs_rcs_delta_ci95:
        value: "[lo, hi]"
      n_questions:
        value: int
        principle: "Must be materially larger than exp5178's n=6 -- direct fix for the prior pilot's
          underpowered sample."
      layer_sweep_attempted:
        value: bool
      headroom_present:
        value: true
      verifier_is_oracle:
        value: false
        principle: "Gold labels are for training/eval splits only; must be false per the
          Circularity/Oracle-Distinctness Discipline."
      missing_verifier_gaps:
        value: "residual failure-mode entries logged to ops/verifier_gaps.md"
      random_seed:
        value: int
      reproducibility_checksum:
        value: string
      inference_substrate:
        value: live_llm_embedding_extraction
        principle: "Matches exp5178's corrected substrate declaration -- a single forward pass per
          candidate for embedding extraction, not full autoregressive generation; 2.0s floor applies."
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_, and state plainly whether the
          trained probe beats tuned SC AND beats all THREE zero-training control arms -- beating SC alone
          is insufficient if any zero-training baseline (self-certainty, CLUE, or RCS) does equally well."

