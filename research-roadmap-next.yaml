    title: "Post-V538-marker SOTA delta and causal-scope preregistration"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 50
    agent_type: codex
    model: gpt-5.5
