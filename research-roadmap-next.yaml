  - id: exp4020-goal-induction-separation
    milestone: "2026.06.372"
    title: "GOAL-INDUCTION SEPARATION (the planning-layer prerequisite Deep Think Q2 named): on an ARC-AGI-3 game where we ALREADY have a verifier-certified world model (r11l L1-L3, or vc33 at 99% dynamics accuracy), induce the GOAL PREDICATE -- the function over a state that returns solved/not-solved -- SEPARATELY from the dynamics rule, from the OBSERVED level-up transitions (the frame just before a level_completed signal). The dynamics model (T(s,a)->s') and the goal predicate (is_goal(s)) are DIFFERENT objects; this milestone treats them separately because a verifier gives validity, not direction -- the goal predicate is half of the missing navigator."
    priority: critical
    track: planning
    max_turns: 80
    agent_type: codex
    model: gpt-5.5
    inference_substrate: offline_arc_agi3_goal_predicate_induction_no_oracle
    deliverable: results/experiment_4020_goal_induction_separation.json
    prompt: |
      For ONE game with an existing verifier-certified world model (prefer r11l or vc33; reuse the
      saved transition store / induced model -- NO new env exploration sweep), induce a GOAL
      PREDICATE is_goal(state) -> bool from the observed level-completion transitions (the states
      at/just-before a level_completed). Codex writes is_goal() in the restricted sandbox; verify
      it on HELD-OUT level-ups (does it fire exactly on the solved states, not before?). This is
      oracle-free: the level_completed signal is the env's own, used as the label.
      REQUIRED ARTIFACT FIELDS: honest_verdict (terminal prefix; e.g. complete: goal_predicate_
      induced_heldout_precision_X or complete: goal_predicate_not_separable_<reason>),
      goal_predicate_heldout_precision (float; principle: a goal test that fires early or late
      makes any search unsolvable -- this is the search target, it must be exact),
      goal_predicate_code (the induced predicate, for exp4021 to consume),
      game (str), n_levelup_transitions (int), inference_substrate.

  - id: exp4021-heuristic-search-over-verified-wm
    milestone: "2026.06.372"
    title: "HEURISTIC SEARCH OVER THE VERIFIED WORLD MODEL (THE CENTRAL BET of the Deep-Think pivot): implement a planning search -- bounded best-first / A* / depth-limited MCTS -- over the induced+verifier-certified world model from exp4020, with the VERIFIER as the forward simulator (legal next-state expansion + the exp4020 goal test) and a heuristic value (distance-to-goal proxy: cells-to-goal, progress-bar delta, object-alignment, or a learned/coded heuristic) providing the directional gradient the verifier cannot. TARGET: break a planning wall that single-step re-induce->validate->act STALLED on (r11l L4, or vc33 -- where a 99%-accurate verified WM still failed to solve). This is the direct test of Deep Think Q2 (dynamics != heuristics: does adding a SEPARATE navigator over the verified simulator advance past the wall?) AND of the modality-mismatch steelman (if search over the code-represented WM SOLVES it, the wall was SEARCH not representation -- which our vc33 99%-WM data predicts)."
    priority: critical
    track: planning
    max_turns: 120
    agent_type: codex
    model: gpt-5.5
    inference_substrate: offline_arc_agi3_planning_search_over_verified_world_model
    deliverable: results/experiment_4021_heuristic_search_over_verified_wm.json
    prompt: |
      Build a planning search over the verifier-certified world model (reuse exp4020's dynamics
      model + goal predicate; NO new induction). The verifier is the forward simulator: it expands
      legal next states T(s,a) and tests is_goal(s). Add a HEURISTIC value h(s) (a coded
      distance-to-goal proxy -- e.g. unmet goal-predicate components, manhattan-to-target,
      progress-bar delta) to order the search frontier (best-first / A* / depth-limited MCTS;
      bound node expansions, e.g. <= 50k, to stay tractable). Run it on the game's wall level
      (r11l L4 or vc33). REAL-ENV-CONFIRM any claimed solve via the live env's level_completed.
      Honest no-solve is a complete verdict, NOT a fabrication. Report whether the search advanced
      past where single-step re-induction stalled, and the representation-vs-search diagnosis.
      REQUIRED ARTIFACT FIELDS: honest_verdict (terminal prefix; e.g. complete: search_layer_
      solved_<game>_L<k>_real_env_confirmed, or complete: search_layer_no_solve_<game>_L<k>_
      <bottleneck>), new_levels_solved_this_task (int; principle: monotonic ARC progress per the
      Incremental-Progress rule), wall_was_search_not_representation (bool; principle: resolves the
      Deep Think Q4 modality-mismatch steelman -- if search over the code WM solves it, code is not
      the wrong substrate), nodes_expanded (int), heuristic_used (str), real_env_confirmed (bool),
      inference_substrate.

