        status:
          principle: "A terminal capstone state distinguishes complete adjudication from partial aggregation."
        honest_verdict:
          principle: "The verdict must state production, CSL, saturation, ARC, hardware, and publication dispositions with a terminal prefix."
        verdict_class:
          principle: "A closed class prevents mixed or blocked milestone evidence from becoming positive."
        expected_and_observed_task_inventory:
