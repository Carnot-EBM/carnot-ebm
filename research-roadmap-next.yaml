# OUTER-LOOP / OPERATOR PRE-STAGED ROADMAP (2026-06-04, Claude Opus 4.8). PROVENANCE:
# .347 landed all tasks. Banked/confirmed at .347: P1 discrete-search adjudication RETRIED and BLOCKED on
# no-free-GPU a 2nd time (exp3787, handoff_to_operator=true -> HANDED to operator, NOT re-queued); EDLM
# next-thesis preflight returned GO (exp3793, repo MinkaiXu/Energy-Diffusion-LLM, one-command seed emitted --
# operator's call to seed); product headline PARTIALLY restorable (exp3792: exp2090 CRANE +15pp PASSES G4,
# exp1999 code-repair +18pp FAILS G4 -- no seed/checksum/n/substrate on disk -> not_yet_headline_eligible);
# Tier-3 predictor TRAINED but UNUSED (exp3788, predictive AUROC 0.9715, headline ensemble unchanged, memory
# preserved); abstention CLI+batch surface added (exp3789); gaming-resistance characterized -- DEGRADES under
# context_compaction (exp3790, n=240); Anomaly-Escalation classifier validated but NOT usable yet (exp3791,
# false-escalation 0.83, supports_wiring_in=false -> needs tuning). paper_ready=TRUE (G1-G4).
#
# .348 is a LEAN, NON-CHURN maintenance milestone (north-star sec-1). With both energy routes bounded, the
# moat closed, and the P1 GPU question handed off, the loop's legitimate forward surface is exactly: ADVANCE
# the headline (G4-restore the demoted code-repair number -- north-star sec-1's OWN definition of a non-noise
# milestone), HARDEN/REPAIR the banked product (mitigate the real context_compaction evasion + a 3rd surface),
# REPAIR the endorsed process tool (tune the over-firing classifier), and APPLY the mandated Tier-3 self-learning
# (wire the trained predictor as a real fast-path gate). It re-grinds NOTHING bounded (no scissor-plot/moat
# sweep, no P0.1/Thesis-A re-test, no P1 GPU re-queue) and self-seeds NO paradigm (EDLM stays operator-gated).
#
# OPERATOR FLAG (north-star sec-1): the project is CONVERGED and the EDLM preflight is GO. The substantive next
# move -- SEED EDLM (one command, ready) or FREEZE the loop into product-maintenance -- is the OPERATOR's to make
# (the P3 Verification Trap: the loop cannot self-seed a paradigm). .348 spends only on the four legitimate
# surfaces. Continued milestones WITHOUT an operator seed will increasingly approach the churn boundary -- the
# next milestone after .348 should be either the EDLM seed or an explicit freeze.
#
# ROUTING: gemini CRASHES real GPU workloads + has wiped milestones via 429 (incident_333), so the cheap-default
# is CODEX (requires_codex). The ONE GPU + open-ended task is exp3798 (G4 re-run): CLAUDE+opus+max_turns:100
# (GPU/bootstrap + open-ended pipeline restoration -> opus per the hardware-integration routing rule; C+E
# escalation is claude-only). It is GPU-PREFERRED with a reduced-n CPU-GGUF fallback + a clean blocked exit, so
# it never half-runs and never fabricates. Everything else is codex (mechanical/aggregation/verifier-scoring/wiring).
#
# INTERPRETER DISCIPLINE (incident_ebt_training_venv_python_cuda): EVERY Run command pins .venv/bin/python --
# bare `python` is /usr/bin/python3 with NO torch/yaml/sklearn. Even CPU tasks need project deps for
# scripts/adversarial_verify.py + scripts/summarize_artifact.py + verifier scoring.
#
# ANTI-POISON-TEST (the .344 ROOT CAUSE): any shipped test MUST assert against the script's REAL behavior and
# any new research-complete.yaml value containing a colon MUST be quoted. A failing shipped test -- or a stray
# unquoted colon -- poisons the conductor pre-test gate and SKIPs the whole milestone.
#
# GATING: ONE hard gated_on (exp3799 on exp3798 producing a clean artifact -- pure provenance aggregation over
# the re-run, meaningless if it blocked). Every other task reads upstream with a graceful disk-presence
# fallback -- never crash on a missing field, never label un-run/blocked work as a negative.
# INVARIANTS re-asserted at capstone: paper_ready TRUE; FoVer 0.9131 frozen; both energy routes bounded.

