    4. Authenticate and preserve the three actual V700 terminal primaries and their failed or passing receipts. Record the eleven promised but unscheduled IDs8086-8096 as unexecuted scope, not completed experiments. Export contract_ready_score independently of historical scientific validity.
    5. Qualify the actual Exp8085 public kernel input and immutable historical control paths separately. A circular_positive fixture can have kernel_ready_score=1. A consumer must not require a positive science class for fixture readiness. Exercise all twelve E2E-018 authority mutations and missing-stage activation with private files.
