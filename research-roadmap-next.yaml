  - id: exp4107-nanotrm-mechanism-smoke
    milestone: 2026.06.380
    title: "NANO-TRM TRAINER MECHANISM SMOKE (THE de-risk; minutes). Run nano-trm's OWN published trainer end-to-end on our 3090 -- `uv run python src/nn/train.py experiment=trm_sudoku_4x4` with a PERSISTENT save_dir -- and assert it produces a real CHECKPOINT FILE + a REAL exact-accuracy metric (not the trivial q_halt the 2026-06-06 runs reported). This is the exact step our own LoRA/TRM trainers never cleared across .377-.379, done via nano-trm's loop not ours."
    priority: critical
    track: trm-baseline
    max_turns: 80
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-12 operator directive (this session): TRM-trainer mechanism validation — false-positive scope-match vs the retired LoRA/TRM-train lineage (exp4088/exp4089/exp4100); forward difference = nano-trm's NATIVE published trainer (uv-turnkey, reproduces official numbers) instead of our from-scratch trainers that never produced a checkpoint."
    inference_substrate: gpu_nanotrm_native_training
    deliverable: results/experiment_4107_nanotrm_mechanism_smoke.json
    prompt: |
      CONTEXT: nano-trm (olivkoch/nano-trm, installed under nano-trm/, uv-managed) reproduces the
      official TRM numbers and trains a small Sudoku TRM "in a few minutes on an A10". Use IT to
      de-risk the training mechanism that has blocked the verifier-as-reward pivot for 3 milestones.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE anything else):
           a. `command -v uv` succeeds; `ls nano-trm/src/nn/train.py` exists. If not -> honest_verdict `blocked_nanotrm_or_uv_missing` and STOP.
           b. CUDA: `python3 -c "import torch; assert torch.cuda.is_available()"`. If not -> `blocked_cuda_unavailable`.
           c. A PERSISTENT, writable save_dir under the repo (e.g. results/trm_runs/) -- NOT /tmp/ml-experiments (the 2026-06-06 runs lost their checkpoints to /tmp). `mkdir -p results/trm_runs`.
        1. Generate the small Sudoku data if needed (`bash nano-trm/bash/generate_sudoku_data.sh` or the documented builder), then run from the nano-trm dir:
           `uv run python src/nn/train.py experiment=trm_sudoku_4x4 save_dir=<persistent path>` (override save_dir via hydra). CHECKPOINT + PRINT-PROGRESS so codex's 1201s idle-timeout never fires.
        2. After training, ASSERT: a `.ckpt` file exists at the persistent save_dir AND a REAL exact/solve accuracy metric was logged (NOT just val/q_halt_accuracy). Reload the checkpoint to confirm it is loadable.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An honest `blocked_<resource>` or a real failure-to-train is a COMPLETE verdict; do NOT fabricate a checkpoint."
        nanotrm_trainer_checkpoint_ok:
          principle: "Bare bool: did nano-trm's native trainer produce + reload a checkpoint. This is the load-bearing mechanism de-risk independent of any verifier work."
        exact_accuracy:
          principle: "The REAL solve metric (not q_halt). Distinguishes a genuine training run from the degenerate 2026-06-06 q_halt=1.0 smoke that trained nothing useful."
        checkpoint_path:
          principle: "Persistent path to the saved checkpoint so exp4108/exp4109 can build on a real artifact, not a lost /tmp file."
        duration_s:
          principle: "Real training takes wall-clock minutes; a sub-60s duration on a claimed training run is the fabrication signal."
        preconditions_checked:
          principle: "Records uv/CUDA/save_dir verified; pre-empts the silent-missing-resource fabrication that produced blocked_lora_smoke_checkpoints."
        random_seed:
          principle: "Determinism precondition for reproducing the run."
      ACCEPTANCE GATE:
        - condition: "nanotrm_trainer_checkpoint_ok == True AND a real exact_accuracy is reported AND duration_s > 60"
          principle: "The mechanism is de-risked ONLY if a reloadable checkpoint + a real solve metric were produced by a genuine (>60s) training run. q_halt-only or a lost checkpoint does NOT clear it."

  - id: exp4108-nanotrm-sudoku-extreme-baseline
    milestone: 2026.06.380
    title: "REPRODUCE the PUBLISHED Sudoku-Extreme TRM baseline (~87% exact accuracy). DEFENSIVE read of exp4107: if the mechanism smoke passed, run `uv run python src/nn/train.py experiment=trm_sudoku_extreme_1k_aug_1k` with a PERSISTENT save_dir and report whether val exact-accuracy reaches the published ~0.87. This is the validated baseline the Carnot verifier graft (exp4109) builds on."
