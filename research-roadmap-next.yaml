- id: exp631-jepa-v14-oracle-calibrated
  milestone: 2026.04.48
  deliverable: results/experiment_631_jepa_v14_oracle.json
  title: 'Exp 631: JEPA v14 ORACLE-Calibrated Retrain — Target OOD AUC >= 0.80, ECE < 0.10'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: JEPA v13 achieved\
    \ OOD AUC=0.868 (architecture sound) but ECE=0.207 (calibration target <0.10\
    \ not met). Root cause: all training data came from synthetic violations or binary\
    \ correct/incorrect labels — not step-level constraint labels matching live LLM\
    \ output style. Exp 628 built fover_corpus_v5_oracle.json with per-step SymCodeVerifier\
    \ labels derived from real live responses. JEPA v14 trains on this corpus with\
    \ CAPO calibration loss (arXiv 2604.12632) from python/carnot/training/capo_loss.py.\n\
    \nEXISTING CODE TO READ FIRST:\n- results/fover_corpus_v5_oracle.json — ORACLE\
    \ corpus (Exp 628); READ schema: OracleChain with step_labels\n- results/experiment_628_oracle_fover_v5.json\
    \ — n_chains, corpus_ready\n- python/carnot/training/capo_loss.py — capo_loss,\
    \ ece_loss (Exp 618)\n- python/carnot/inference/ — JEPAPredictor training code\n\
    - results/experiment_618_jepa_v13_capo.json — v13 OOD AUC=0.868, ECE=0.207,\
    \ training config\n- results/jepa_v13_capo.npz — v13 model weights (load as init\
    \ for v14 if ECE improvement needed)\n\nTASK: Train JEPA v14 on ORACLE-labeled\
    \ corpus. Target ECE < 0.10.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-VERIFY-134\
    \ (JEPA v14: trained on ORACLE step-level labels, ECE < 0.10), REQ-VERIFY-135\
    \ (JEPA v14: OOD AUC >= 0.80), SCENARIO-VERIFY-175/176/177 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write scripts/experiment_631_jepa_v14_oracle.py:\n   a. apply_env_autofix() FIRST.\n\
