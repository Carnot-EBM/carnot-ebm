        0. PRECONDITIONS (check FIRST; on any miss write honest_verdict blocked_<resource> and STOP, no
           fabrication): (a) offline env files exist: `ls environment_files/g50t/` non-empty; (b)
           `.venv/bin/python -c "import carnot.agentic.arc_solver_kit"` succeeds; (c) the live generator
           is reachable -- EITHER the cached GGUF
           (`ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-MTP-GGUF/` non-empty) OR the local
           iGPU llama-server (NEVER the 3090s -- conductor-sacrosanct).
        1. Gather >=3 solved-game grounded win-rules (ka59 count_4==32, s5i5 marker-coverage, ft09
           local-color-cycle) as few-shot examples; hand g50t's object-centric digest + those examples
