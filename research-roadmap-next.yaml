tasks:
  - id: exp1627-nabla-reasoner-debug
    title: "Exp 1627: Nabla-Reasoner convergence debugging and learning rate sweep"
    deliverable: results/experiment_1627_nabla_debug.json
    prompt: |
      CONTEXT: The Nabla-Reasoner in Exp 1616/1617 failed to converge on the validation set.
      EXISTING CODE TO READ FIRST: results/experiment_1616_nabla.json, python/carnot/pipeline/
      TASK: Debug the continuous latent optimizer convergence. Perform a learning rate and momentum sweep.
      CONCRETE STEPS:
      1. Write a script `scripts/experiment_1627_nabla_debug.py` to test learning rates.
      2. Record `optimizer_converges` boolean and the optimal learning rate in the JSON result.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1628-ebrm-scoring-prototype
