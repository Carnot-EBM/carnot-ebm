- id: exp7154-qwen-dual-side-grounding-pilot
  title: Qwen dual-side source-grounding pilot
  track: verification
  priority: critical
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 75
  per_unit_rows: true
  milestone: 2026.09.629
  deliverable: results/experiment_7154_v629_qwen_dual_side_grounding.json
  prior_failures:
    - experiment_id: exp7139-three-family-symbolic-grounding-ab
      verdict: blocked_native_llama_server
      addressed_by: "Exp7153 now qualifies the fixed native runtime first, and V629 adds a source-side structure check to the prior SQL-only intervention."
      retire_if_same_verdict: true
  gated_on:
    - upstream: exp7153-grounding-runtime-postfix-qualification
      artifact_field: grounding_runtime_ready_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Exp7138 supplies exact source rows. Exp7153 supplies a frozen 24-row schedule
    and a qualified Qwen runtime. OptiVer suggests checking both the generated
    formal structure against the source and the solution against that structure.
    Carnot must test this as an intervention, not as a model-judge claim.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/results/experiment_7138_v627_relational_fixture.json
    - {project_root}/results/experiment_7153_v629_grounding_runtime.json
    - {project_root}/python/carnot/experiment_7138_v627_relational_fixture.py
    - {project_root}/python/carnot/experiment_7139_v627_symbolic_grounding_ab.py
    - {project_root}/python/carnot/experiment_7150_v628_grounding_preflight.py
    - {project_root}/python/carnot/inference/llama_server_supervisor.py
    - {project_root}/scripts/experiment_template.py
    - {project_root}/openspec/capabilities/verification/spec.md

    TASK:
    Run a paired four-arm Qwen pilot on the frozen 24 rows. Compare direct,
    self-check, relational-SQL, and dual-side verification. Keep source labels
    sealed until all model calls finish. Treat relations, SQL, and answers from
    the model as untrusted.

    CONCRETE STEPS:
    0. Create the schema-complete artifact before checks. Verify the Exp7153
       artifact, gate field, model hash, fixture hash, frozen IDs, schedule hash,
       output directory, and exact-label authority. Record passed preconditions
       and leave running state before the model load. A failed gate is blocked,
       not partial, and names the exact upstream field in gate_check_summary.
    1. At every numbered phase boundary, print a flushed progress line. Print
       flushed start and end lines immediately before and after every call that
       can take minutes, including a model load, generation, benchmark, or
       subprocess. Print a flushed heartbeat at least every 300 seconds and at
       least every eight generations inside loops. Keep every stdout gap below
       600 seconds.
    2. Add REQ-VERIFY-7154 and focused RED tests in
       tests/python/test_experiment_7154_v629_qwen_dual_side_grounding.py before
       implementation. Test sealing, schedule identity, structure checks,
       exact SQL checks, arm accounting, and row completeness.
    3. Implement python/carnot/experiment_7154_v629_qwen_dual_side_grounding.py
       and its thin script entry point. Reuse fixture and runtime helpers.
    4. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF. Resolve the same
       cached Q4 file with cached_sota_pair(), use the embedded tokenizer and
       chat template, and download nothing. A legacy small model may only run a
       non-headline CPU smoke.
    5. Load Qwen once. Print flushed lines before and after the load. Run all
       direct, self-check, relational-SQL, and dual-side call opportunities in
       the frozen order. Print flushed lines before and after each generation
       batch and periodic heartbeats inside the batch.
    6. For the dual-side arm, parse a typed relation schema. Check table, field,
       join, filter, aggregation, and comparison requirements against the
       source record before executing SQL. Use a restricted read-only SQLite
       connection. Exact query output checks the solution side.
    7. Open labels only after all raw outputs and prompt hashes are immutable.
       Compute per-row correctness, accepted correctness, detection, repair,
       harmful flips, abstention, structure validity, SQL validity, latency,
       and tokens. Preserve failures and parse errors as rows.
    8. Use paired bootstrap intervals over rows. Report every source family and
       arm separately. Disqualify a value claim if schedules differ, labels leak,
       control headroom is absent, rows are missing, or all arms are identical.
    9. Set qwen_dual_side_pilot_complete_score=1 when the complete qualified
       comparison ran, even if the scientific result is null. Use positive only
       for external-label-backed improvement with no hidden harmful-flip breach.
    10. Run the focused tests, artifact and adversarial validators,
       row-consistency lint, scoped spec coverage, and root-clutter check. Print
       flushed lines around every subprocess.
    11. REQUIRED ARTIFACT FIELDS: field_principles for every field below;
       preconditions_checked; run_date; inference_substrate
       (live_llm_inference: paired Qwen dual-side grounding pilot);
       inference_substrate_class (model_full_generation or blocked_no_run);
       execution_venue (host); duration_s; source_artifact_hashes; rows;
       MODEL_SPECS; model_identity_rows; gpu_rows; model_load_receipts;
       frozen_fixture_ids; frozen_schedule_hash; prompt_hash_rows;
       raw_output_rows; parse_rows; source_structure_rows; sql_execution_rows;
       arm_metric_rows; source_family_metric_rows; paired_comparison_rows;
       bootstrap_rows; harmful_flip_rows; abstention_rows; latency_rows;
       token_rows; label_exposure_count; schedule_identity_score;
       qwen_dual_side_pilot_complete_score; random_seed;
       reproducibility_checksum; gate_check_summary with upstream, field,
