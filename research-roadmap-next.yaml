    milestone: "2026.05.321"
    title: "P0.1 v7 — process-aware step-level energy + optimal SC+energy aggregation vs Self-Consistency on the IN-BAND difficulty-matched corpus (cached, held-out, matched compute, flip-count tautology-clean)"
    priority: critical
    max_turns: 80
    model: opus
    agent_type: claude
    requires_claude: true   # (1) gemini-cli is DOWN; (2) 5+ files: in-band corpus reader + per-step FoVer process scorer + trained EORM reranker + optimal-aggregation fit + 7 condition scorers + flip-count/McNemar/bootstrap; (3) open-ended judgment on the held-out protocol, flip-count design, optimal-aggregation fit, matched-compute accounting — no deterministic gate substitutes.
