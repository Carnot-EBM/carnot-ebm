        4. Write the deliverable JSON.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        inference_substrate: "hardware_smoke"
        preconditions_checked: list
        polarfire_ssh_uptime_at_run: str
        polarfire_kernel: str
        polarfire_arch: "riscv64"
        sat_instance_sha256: str
        scorer_output_sha256: str
        scorer_output_hash_verified: bool
        per_clause_wall_clock_us: list[float]
        total_wall_clock_s: float
        duration_s: float

      ACCEPTANCE GATES:
        - condition: "scorer_output_hash_verified is True"
          principle: "Hash match is what distinguishes a real run from
                      a fabricated one. If the hash doesn't match, the
                      run did not happen as claimed."
        - condition: "duration_s >= 10"
          principle: "SCP + remote python invocation + hash verification
                      cannot finish faster than this. Below threshold
                      signals fabrication (exp1680 reported 0.0)."

