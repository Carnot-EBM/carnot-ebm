  - id: exp1725-phase4-genuine-scaling-with-alpha-t-prime
    title: "Exp 1725: Phase 4 GENUINE scaling sweep with alpha_t' — replaces bijection-invariant exp1678/1681/1693"
    deliverable: results/experiment_1725_phase4_genuine_scaling.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1715-phase4-alpha-t-audit-retry-v3
        verdict: complete_bijection_invariance_artifact_confirmed
        addressed_by: "exp1715 falsified the original alpha_t. exp1721 (.178) derived alpha_t' replacement showing monotonic decay across random-verifier ablation cells. This task uses alpha_t' to run the GENUINE substrate-size scaling sweep at n=8/16/32/64 — the measurement that exp1678/1681/1693 attempted but produced bijection-invariant artifacts."
        retire_if_same_verdict: false
      - experiment_id: exp1721-phase4-alpha-t-replacement-derivation
        verdict: complete_alpha_t_prime_monotonic_decay
        addressed_by: "exp1721 (.178) confirmed alpha_t' on the 4-cell random-verifier ablation. This task extends to the substrate-size axis — the original Phase 4 scaling question. Independent confirmation needed."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: exp1721 (.178) derived alpha_t' (maximum-caliber per
      arXiv:2605.12536) and confirmed monotonic decay on the random-
      verifier injection ablation at n=32. The next question is whether
      alpha_t' (a) ALSO scales monotonically with substrate size n, OR
      (b) is itself n-invariant (in which case Phase 4 substrate-size
      scaling is fundamentally not measurable from ensemble metrics).

      FALSIFIABLE HYPOTHESIS: delta_alpha_prime measured at n in
      {8, 16, 32, 64} produces statistically distinguishable values
      (overlap < 5% between adjacent n bootstrap CIs at the 95% level).
      If all 4 measurements overlap heavily, alpha_t' is ALSO bijection-
      or scale-invariant — Phase 4 scaling claims become inaccessible.

      EXISTING CODE TO READ FIRST:
        - python/carnot/phase4/alpha_t_max_caliber.py (the alpha_t'
          implementation from exp1721)
        - results/experiment_1721_alpha_t_replacement.json (the .178
          confirmation on random-verifier ablation)
        - results/experiment_1715_phase4_alpha_t_audit.json (the
          original alpha_t ablation; sanity-check that alpha_t' diverges
          from alpha_t on at least one cell)

      TASK: Substrate-size sweep using alpha_t'.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "from carnot.phase4.alpha_t_max_caliber import
              alpha_t_prime"` succeeds — else
              `blocked_alpha_t_prime_implementation_missing`.
           b. exp1721 artifact readable — else
              `blocked_no_replacement_baseline`.
           Record preconditions_checked.
        1. For each n in {8, 16, 32, 64}: run 30 seeds × 100 MLD steps
           with the k=6 verifier ensemble + k=1 baseline. Compute
           inf_t_alpha_k6_prime and inf_t_alpha_k1_prime per seed.
        2. Aggregate: delta_alpha_prime(n) = bootstrap mean of
           inf_t_alpha_k6_prime - inf_t_alpha_k1_prime over 30 seeds.
           Report bootstrap_ci_95 per n.
        3. Check overlap between adjacent n CIs. If overlap > 5%
           on any adjacent pair (n=8 vs n=16, n=16 vs n=32, n=32 vs
           n=64), record scale_invariance_at_n_pair: [a, b]. If
           all 3 adjacent pairs show overlap > 5%, alpha_t' is also
           scale-invariant.
        4. Acceptance: at least 2 of 3 adjacent pairs show overlap < 5%
           (statistically distinguishable substrate-size scaling).
           If less than that, emit honest finding — Phase 4 substrate
           scaling not measurable from this metric either.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase4_alpha_t_prime_scaling.v1"
        - experiment: 1725
        - run_date: ISO-8601 UTC
        - duration_s: > 200s (4 n-points * 30 seeds * 100 MLD steps =
          real measurement; if completes faster than 200s, the inner
          loop was likely short-circuited)
        - random_seed: 171925 (NOT 1725 or 64)
        - reproducibility_checksum: sha256 of (verifier ensemble
          fingerprint + alpha_t_max_caliber git_rev + scaling grid spec)
        - preconditions_checked: list
        - model_specs: {n_grid: [8, 16, 32, 64], ensemble_k_total: 6,
          ensemble_k_baseline: 1, mld_steps: 100, n_seeds: 30,
          alpha_t_variant: "max_caliber_v1"}
        - n_samples: 12000 (4 n-points × 30 seeds × 100 MLD)
        - n_samples_justification: "30 seeds per n-point gives bootstrap
          CI width ~0.18/sqrt(30) ~ 0.03 on delta_alpha_prime, matching
          the gate threshold for 5% overlap detection at 4 n-points."
        - per_n_results: list of {n, inf_t_alpha_k6_prime,
          inf_t_alpha_k1_prime, delta_alpha_prime,
          delta_alpha_prime_bootstrap_ci_95}
        - adjacent_pair_overlap_pct: list of {pair: [n_a, n_b],
          overlap_pct: float}
        - scale_invariance_detected: bool (all 3 adjacent pairs >5% overlap)
        - statistically_distinguishable_pairs: int (count where <5% overlap)
        - acceptance_gate_passed: bool (statistically_distinguishable_pairs >= 2)
        - acceptance_gate_criteria: "At least 2 of 3 adjacent n-pairs
          show overlap < 5% — substrate scaling is genuinely measurable
          with alpha_t'."
        - methodology_note: "If scale_invariance_detected=true with
          alpha_t' AS WELL, Phase 4 substrate-size scaling is
          fundamentally inaccessible from ensemble metrics. Disclose
          this honestly — would be a paper-v6 §6 limitation entry,
          not a planner-blocking failure."
        - optimization_direction: "neither — measurement task"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

