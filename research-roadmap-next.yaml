      Exp5552 should prove deterministic schema reachability for the hard/soft candidate table. This task checks whether the mandated local SOTA GGUF models can actually emit complete grammar-forced rows under that schema. This is a smoke test, not a headline quality panel.

      MODEL_SPECS for any LLM call in this experiment:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
