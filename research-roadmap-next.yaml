    track: verifier-oracle-distinct
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): the oracle-distinct ARC verifier is MANDATED by the 2026-06-14 P0 directive + the .395 cross-family win generalized on ONE substrate and the SOTA-ingestion (exp4276) flagged ARC-GEN (2511.00162) as the 2nd-substrate stress for v396 -- false-positive scope-match vs retired GAP-3 content-EBM lineage / the .393 ARC gate (exp4245) / the .395 cross-family test (exp4271, which SUCCEEDED); forward difference = an INDEPENDENT procedural-generator substrate (ARC-GEN native family ids) that closes the single-partition critique exp4271 could not. verifier_is_oracle=false."
