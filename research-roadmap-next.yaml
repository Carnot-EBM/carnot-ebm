    CONCRETE STEPS:
    0. PRECONDITIONS: print a flushed start line. Check named inputs, primary hashes, terminal sidecars, the Python environment and required tools with bounded commands. Missing external resources yield complete_blocked_<resource>, verdict_class=blocked and gate_check_summary with the exact failed operand. Do not fabricate absent evidence.
    1. Emit a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess. Set PYTHONUNBUFFERED=1 and use print(..., flush=True). Inside long loops and while children run, print elapsed time and real completed/pending units at least every 60 seconds; keep every gap below 600 seconds. Bound each tool call. Write files over about 200 lines in several calls of at most about 150 lines, with a progress message between calls. Never pad duration or invent progress.
    2. Read the named sources; add the applicable REQ-* and SCENARIO-* specification before implementation. Write failing tests first with those references, then implement the smallest reusable change. Keep tests in private temporary directories outside protected results paths. Reuse existing receipt and publication helpers; preserve prior artifacts and all existing assertions.
    3. Freeze the complete V698 design, staged YAML and activated invocation YAML using the existing parameterized authority reader. Compare all 13 ordered tasks, all prompt bytes and metadata, the visible task table and canonical digest. Administrative validity must not depend on scientific benefit. Preserve previous complete authority; do not activate or rewrite the live roadmap yourself.
    4. Reproduce the exact V697 gate failure against Exp8045. Test a fixture-only consumer allowing circular_positive together with scorer_fixture_ready_score=1, clean terminal hashes and flagged_adversarial=false. Keep scientific consumers restricted to positive/null and verifier_is_oracle=false. Include all six verdict classes, ready=0, missing field, tampered hash and quarantined-input controls. Do not broaden shared conductor policy.
