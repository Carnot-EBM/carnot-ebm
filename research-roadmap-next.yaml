  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V704 scheduled 14 tasks. Ten primary artifacts exist and four source tasks were gate-skipped. Contract custody passed; source validation failed, later learning benefit was null, and full-service readiness was zero. The capstone primary is blocked even though the changelog records an earlier disqualification.
