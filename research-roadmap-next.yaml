      - model_specs: list (principle: live LLM evidence must name exact model IDs and cache/runtime paths)
      - legacy_smoke_only_used: bool (principle: tiny models cannot become headline evidence)
      - preconditions_checked: dict (principle: compute and cache assumptions must be explicit)
      - prompt_hashes: list (principle: inputs must be auditable without embedding full prompts)
      - inference_substrate: dict (principle: local GGUF evidence must declare hardware, runtime, cache, and confidence support)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

