      toward the genuine "Live Hidden-Game Discovery Agent" deliverable (env-adaptive re-solve, not frozen
      replay). NO LLM at submit-time, zero quota (offline arcade + cached solves). Submission is OPERATOR-ONLY
      (External Publication) -- this task PREPARES + offline-validates ONLY.

      EXISTING CODE TO READ FIRST:
        - {project_root}/scripts/arc3_live_submit.py (the live-submit driver: Mode-1 flat-replay; _latest_package; the 9 no-trajectory skips; CLAIMED_FALLBACK)
        - {project_root}/results/arc3_live_submit.json (the 33-level submission state + per_game env_match + claimed_caps)
        - {project_root}/python/carnot/experiment_4473_submission_package_prep_refresh.py (the package-prep builder -- extend it to current banked depth)
        - {project_root}/python/carnot/agentic/arc_solver_kit.py (reproduce() -- the gate that REPLAYS the winning action sequence; the source of a bankable trajectory)
        - {project_root}/ops/arc_solve_registry.yaml (per-game solver + reproduce entries; the deeper banked levels to include)
        - {project_root}/scripts/arc3_replay_scorecard_metaharness.py (the offline reproduction harness -- the offline analogue of live env_match)

      TASK: raise the offline-reproduction-gated LIVE-SUBMITTABLE level count above 33 by (1) refreshing the
      validated package to current banked depth, (2) banking a replayable action trajectory for every
      offline-reproduced level that lacks one, (3) making the replay ENV-ADAPTIVE for version-drift games. Honest
      accounting: a level counts as live-submittable ONLY if it offline-reproduces AND has a banked trajectory
      (or an env-adaptive re-solver) that replays on a fresh/drift-perturbed env. verifier_is_oracle: false.

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
           b. `.venv/bin/python -c "import yaml; yaml.safe_load(open('{project_root}/ops/arc_solve_registry.yaml')); print('registry_ok')"` exits 0.
           ANY missing -> honest_verdict blocked_<resource>, populate preconditions_checked, EXIT. (--no-cov on focused pytest.)
        1. REFRESH the package: rebuild the validated submission package from the CURRENT registry (include sc25 L5, tu93 L5, lp85 L5, cn04/cd82/sp80/su15/m0r0 L2 and all reproduced levels). Record per-game claimed-vs-offline-reached so no level is claimed above its offline-reproduced depth (the claimed_caps discipline).
        2. BANK trajectories: for each offline-reproduced level that has NO banked action sequence (the 9 graph-explore/config-rule solves), extract the winning action sequence that arc_solver_kit.reproduce() replays and persist it as a replayable trajectory the live-submit loader can load. Verify each banked trajectory offline-reproduces its claimed level on a FRESH env.
        3. ENV-ADAPTIVE re-solve: for at least sc25 (env_match=false), make the replay discover coords/layout FROM the env it is given (the discover_coords_never_hardcode + per-game adapter pattern) and re-derive the plan, instead of a frozen flat-replay. Validate it recovers the level on a DRIFT-PERTURBED offline env (e.g. a layout/color-permuted variant) where a frozen flat-replay fails -- the offline proxy for live version-drift.
        4. COUNT + GATE: compute the offline-reproduction-gated live-submittable level count (sum of per-game offline-reproduced levels that have a replayable trajectory or env-adaptive re-solver). The WIN: count STRICTLY > 33 AND env-adaptive re-solve recovers >=1 drift-perturbed game vs frozen flat-replay. Emit count_delta explicitly + a null_delta_methodology_note if ==33. Do NOT submit (operator-only) -- emit ready_for_operator_submit + the refreshed package path.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: live_submittable_count_<n>_above_33 OR complete: live_submission_gap_partially_closed_<n>_gaps_sharpened."
        inference_substrate:
          principle: "verifier_ensemble_against_cached_candidates -- offline reproduction-gated packaging, no LLM load (1s floor); a fast real run must NOT be DURATION_TOO_SHORT/METHODOLOGY false-flagged (declare the offline substrate)."
        verifier_is_oracle:
          principle: "MUST be false -- packaging + env-adaptive replay are not the executable win-check; they bank already-earned solves (no circular moat claim)."
        live_submittable_level_count:
          principle: "the HEADLINE -- offline-reproduction-gated count of levels with a replayable trajectory or env-adaptive re-solver (the honest submittable score, NOT raw reproducible_total_levels)."
        live_submittable_count_baseline:
          principle: "33 -- the 2026-06-21 live scorecard, measured the SAME way (the apples-to-apples control)."
        count_delta:
          principle: "live_submittable_level_count - 33 (positive = more submittable levels = win), emitted explicitly so a null (0) is annotated, not a control==best false-positive."
        trajectories_banked:
          principle: "names the games whose offline-reproduced levels gained a replayable banked trajectory this task (the 9 no-trajectory solves are the target) -- the integration fix."
        env_adaptive_resolve_recovered:
          principle: "the version-drift games (sc25) whose env-adaptive re-solve recovered the level on a drift-perturbed env where frozen flat-replay failed -- the Live-Discovery-Agent step + the env_match fix."
        refreshed_package_path:
          principle: "the path to the refreshed validated package the operator's live-submit driver will load -- the deliverable the operator submits."
        per_game_submittable:
          principle: "per-game offline-reproduced level + has-trajectory + drift-robust flags -- the audit trail that no level is over-claimed above its offline depth."
        ready_for_operator_submit:
          principle: "True if the refreshed package's live-submittable count beats 33 and every claim is offline-reproduction-gated; the task NEVER submits (operator-only)."
        null_delta_methodology_note:
          principle: "present when count_delta==0 -- states the equality is an honest no-gain result, not a measurement bug."
        offline_reproduced:
          principle: "every claimed-submittable level must offline-reproduce to count (no frozen-trajectory over-claim)."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "content-addressed hash catches silent registry/trajectory drift on replay."
        preconditions_checked:
          principle: "records resources verified (offline arcade, registry loadable); pre-empts missing-resource fabrication."

