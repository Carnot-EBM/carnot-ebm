    4. Compare exactly twelve ordered tasks, exp7409 through exp7420, in the single Exact Task Contract table and the YAML whose milestone is 2026.09.650. Check titles, paths, phases, substrates, producer fields and structured gates. Use the shipped generic parsers; do not inherit a predecessor's hard-coded milestone or count. Exercise removed, reordered, stale-milestone, wrong-field and quarantined-input mutations. The result is advisory to independent science.
    5. Inspect only named Exp7397/7399 producer paths, their existing scripts, tracked history, and hash-bound raw/checkpoint evidence. Record present, missing, stripped, untracked or unknown separately. Do not infer that the September 18 history rewrite caused either absence without matching evidence. Recover bytes only into a new diagnostic sidecar when exact prior identity can be authenticated. Do not regenerate old science, edit old artifacts, or requalify their unavailable claims.
    6. Prototype a small task-local evidence bundle using the existing atomic receipt helper. Checkpoint numeric state and raw unit rows before aggregation. Bind each final JSON to its raw files and required-check logs. Fault-inject a kill before rename, a missing sidecar, corrupted bytes, stale completion and oversized payload. A restart must recover completed units exactly once. Do not place a running/bootstrap JSON at the declared terminal path.
    7. Record file sizes before writing. Keep each committed result below 20 MiB; shard raw rows with a hash manifest when needed. Keep models, downloaded datasets and large caches outside the repository. Produce a reviewable proposal for the known commit-time size gap; do not claim the conductor is protected or edit its source. Track this as deferred outer-loop work.
    8. Set evidence_custody_ready_score=1 only after the bundle fault tests and contract checks pass. Record the missing V649 producers as unavailable regardless of helper readiness. Copy the dated V650 literature decisions into research-studying.md. Do not launch another literature sweep or activate any roadmap.
    9. Freeze the affected-check list before running validation. Use the Exp7358 scoped command plan and Exp7303 runner; do not import an old main() or blindly copy its checks. Run worktree import checks; affected pytest with -n 0 -o addopts= --no-cov and a private existing --basetemp parent; separate changed-module coverage at 100%; scoped Ruff check and format; changed-module mypy; and scripts/check_spec_coverage.py on the exact affected tests. Preserve a command-local COVERAGE_FILE through child processes. Do not launch full_python_suite or weaken a test or authenticity guard. Genuine affected failures disqualify; unrelated repository health is separate.
    10. Run the declared entrypoint and a fresh-process cold artifact replay as the capability E2E. No numbered ops/e2e-test-plan.md scenario applies to an isolated reporting/feature experiment. If shared training, sampling, serialization or PyO3 behavior changes, also run its applicable numbered E2E checks. Add focused Rust tests, fmt and clippy only for actual Rust changes.
    11. Independently recompute rows and run scripts/adversarial_verify.py plus scripts/verdict_row_consistency_lint.py --strict on the exact candidate file. Preserve their output and unchanged semantics. Fix producer defects and rerun affected checks; unresolved defects disqualify. Write terminal JSON atomically only after measured work and required validation. Save partial work outside the declared terminal path. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve historical artifacts, active research-roadmap.yaml, scripts/research_conductor.py and production defaults. Scratch belongs in /tmp. Keep model/data caches outside the repository.

    12. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Versioned ordinary top-level fields, including experiment_id, milestone and terminal status."
       - run_date: principle: "Use {date}, with actual UTC start and end timestamps."
       - preconditions_checked: principle: "Exact paths, hashes and resource checks before dependent work."
       - MODEL_SPECS: principle: "Current LLM calls require unsloth/Qwen3.8-27B-GGUF; [] for no current LLM."
       - model_invoked: principle: "True for actual current attempted LLM use; scripted and historical calls are false."
       - invocation_counts: principle: "Current owned attempted/completed/failed/cancelled/in-flight counts from events."
       - inference_substrate: principle: "A truthful STRING; keep device/software detail in inference_substrate_details."
       - inference_substrate_class: principle: "The declared actual class of current work; no padding to meet a floor."
       - execution_venue: principle: "The closed STRING host; device details are separate."
       - duration_s: principle: "Measured monotonic current duration, separated from historical and validation time."
       - phase_spans: principle: "Real phase times, checkpoints and heartbeat records."
       - random_seed: principle: "Frozen fitting, sampling and resampling seeds; null only if inapplicable."
       - reproducibility_checksum: principle: "Bind code, frozen protocol, input bytes and raw rows."
       - source_artifact_hashes: principle: "Exact source paths and hashes, with original flags preserved in sidecars."
       - rows: principle: "Every comparative unit, arm, seed and condition, including failed/censored/unstarted units."
       - sample_size_budget: principle: "Planned/attempted/completed/failed/censored/unstarted counts, independent groups and stop rule."
       - acceptance_gate_results: principle: "Each check has category, operator, expected, observed, passed and principle; validity is separate from benefit."
       - gate_check_summary: principle: "Every blocked_* names exact upstream/path/check/field and expected/observed values, including missing/None."
       - verifier_is_oracle: principle: "Declare whether deployed verification shares the correctness authority; source-defined proofs do."
       - honest_verdict: principle: "Completed findings start complete_ or complete:; unavailable unchanged prerequisites start blocked_*."
       - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. Oracle-positive is circular_positive. Partial only means unfinished OWN retryable work; unchanged external absence is blocked."
       - flagged_adversarial: principle: "Preserve all critical findings; flagged science cannot supply readiness."
       - validation_receipts: principle: "Exact argv, scoped environment, required-check names, exit codes, durations and hashed logs."
       - field_principles: principle: "Explain fields separately; keep gate scalars ordinary numbers rather than value/principle wrappers."
       - promotion_score: principle: "Always zero; no automatic rollout, external publication or generator weight updates."
       - evidence_custody_ready_score: principle: "One only for the current bundle and twelve-task checks; never gates unrelated branches."
       - missing_producer_rows: principle: "Exact prior path, observed bytes, recorded hashes and bounded recovery disposition."
       - contract_rows: principle: "Twelve records parsed independently from both authorities."
       - custody_fault_rows: principle: "Each interruption/corruption fixture and its expected recovery."
       - deferred_size_gate: principle: "Reviewable outer-loop change needed; no conductor protection is asserted."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu PYTHONPATH={project_root}/python:{project_root} CARNOT_FORCE_LIVE=1 {project_root}/.venv/bin/python -u scripts/experiments/experiment_7409_v650_evidence_custody.py --date {date}
