       - schema: principle: "Version the artifact and bind experiment_id and milestone to this task."
       - status: principle: "Terminal complete or blocked only; unfinished work uses a separate checkpoint path."
       - run_date: principle: "Use {date}; retain actual UTC start and end timestamps."
       - field_principles: principle: "Keep ordinary values at top level; put their explanations in this map."
       - preconditions_checked: principle: "Observed paths, resources, model identity and upstream checks before expensive work."
       - inference_substrate: principle: "Use the recognized literal for the operation actually executed."
       - inference_substrate_class: principle: "Actual class determines the duration floor; never pad duration or relabel to pass."
       - execution_venue: principle: "Top-level orchestration is host; board rows name kv260, gatemate or polarfire."
       - execution_host: principle: "Actual hostname, distinct from execution_venue."
       - duration_s: principle: "Measured monotonic elapsed work; record phase spans separately."
       - MODEL_SPECS: principle: "Models actually invoked; [] for tasks with no LLM."
       - model_invoked: principle: "Current task execution only; historical sources and injected fixtures are separate."
       - source_artifact_hashes: principle: "Hash source code, public inputs, private evaluator inputs and raw output files."
       - rows: principle: "Every comparison retains one row per independent unit and arm, with errors and abstentions."
       - sample_size_budget: principle: "Predeclared independent units, attempted/completed/censored units, and stopping rule."
       - random_seed: principle: "Freeze seeds and schedules before observing evaluation labels."
       - reproducibility_checksum: principle: "Hash the exact settings, inputs and raw rows supporting the result."
       - gate_check_summary: principle: "Every blocked_* verdict names check, upstream, artifact_field, expected and observed value."
       - verifier_is_oracle: principle: "True when the verification authority also defines correctness; separate code is insufficient independence."
       - verdict_class: principle: "Exactly positive | circular_positive | null | blocked | disqualified | partial. External incompleteness is blocked."
       - honest_verdict: principle: "Completed findings start complete_ or complete:. External absence starts blocked_. Failed acceptance forbids positive."
       - acceptance_gate_results: principle: "Preserve each frozen criterion, actual value and pass/fail independently of task completion."
       - source_contract_complete_score: principle: "One only after all thirteen contract records and validation receipts are complete."
       - contract_rows: principle: "Independently parsed task order, title, deliverable and exact structured gates."
       - gate_replay_rows: principle: "Real evaluate_gates outcomes for positive and negative temporary cases."
       - source_method_rows: principle: "Primary URL, retrieved date, version and adoption limit."
       - classifier_receipt_path: principle: "Hashed sidecar preserves injected negative fixtures outside current invocation fields."

