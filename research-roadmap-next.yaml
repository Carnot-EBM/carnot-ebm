    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 20
    estimated_wall_time_min: 10
    track: admin
    inference_substrate: aggregation_from_upstream_artifacts
    prior_failures:
      - experiment_id: exp2897
        verdict: "complete: archive_ready=true; archived_milestone=2026.05.273; activated_milestone=2026.05.274; paper_ready=true; clean_artifacts=7; flagged_artifacts=2; blocked_artifacts=0; missing_artifacts=0; pilot_only_artifacts=1"
        addressed_by: "Recurring archive/activation task with new source milestone .274 and target milestone .275."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Project root: {project_root}. Run date: {date}.
        Milestone 2026.05.274 has completed. Its terminal capstone is
        results/experiment_2908_capstone_v274.json. This task performs the
        standard archive/activation bookkeeping for 2026.05.275.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - research-complete.yaml
        - research-roadmap-next.yaml
        - results/experiment_2908_capstone_v274.json

      TASK:
        Archive milestone 2026.05.274 into research-complete.yaml, confirm the
        next active milestone is 2026.05.275, and write the deliverable.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. test -f results/experiment_2908_capstone_v274.json. If absent,
              write honest_verdict: blocked_capstone_missing and exit.
        1. Load research-complete.yaml and check whether 2026.05.274 is already
