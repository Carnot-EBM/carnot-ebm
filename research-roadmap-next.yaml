    9. Write tests with 100% coverage. Test gate check logic.
       Test ThreeTierPipeline._load_jepa_model() priority order. Traces to REQ-VERIFY-145.
    10. Reconcile: ops/changelog.md, ops/status.md.
    11. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_884_vjepa_cascade_deploy.py -v
