    Create a small reusable train/calibrate/reload runner with tested two-view loss hooks. Qualify it on fixtures independently of sentence-protocol readiness. Do not run natural fitting here.
    Deliverable: {project_root}/results/experiment_7755_v675_training_runtime.json.

