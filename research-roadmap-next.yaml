- id: exp7094-matched-hardness-entrance-diagnostic
  title: Matched-hardness entrance difficulty diagnostic
  track: constraint-science
  priority: high
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.622
  deliverable: results/experiment_7094_v622_matched_hardness_diagnostic.json
  gated_on:
    - upstream: exp7093-recovered-entrance-bank-sufficiency-audit
      artifact_field: entrance_support_audit_ready_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Solver-Hard Is Not Model-Hard shows that solver effort can fail to predict
    model difficulty. Exp7093 authenticates the three-family entrance bank.
    Before fitting a selector, V622 needs a matched diagnostic that separates
    structural effort, proposal diversity, and generator outcome.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md section "V622 planner refresh"
    - {project_root}/results/experiment_7064_v619_exact_entrance_fixture.json
    - {project_root}/results/experiment_7086_v621_three_family_entrance_bank.json
    - {project_root}/results/experiment_7093_v622_entrance_bank_sufficiency_audit.json
    - {project_root}/results/experiment_5868_hardness_controlled_constraint_fixture.json
    - {project_root}/results/experiment_5869_hardness_surface_headroom_audit.json
    - {project_root}/python/carnot/experiment_7064_v619_exact_entrance_fixture.py
    - {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/openspec/capabilities/verification/spec.md

    TASK:
    Build a Solver-Hard-style diagnostic over the authenticated entrance bank.
    Measure structural solver effort and proposal-set geometry separately from
    SOTA model outcomes. Form predeclared matched strata and preserve null or
    sparse cells instead of forcing a relationship.

    CONCRETE STEPS:
    0. PRECONDITIONS: require entrance_support_audit_ready_score=1, exact
       upstream hashes, complete three-family rows, readable enumerator traces,
       and writable paths. On failure write terminal `blocked`,
       `inference_substrate_class=blocked_no_run`, and exact
       gate_check_summary.
    1. Add REQ-VERIFY-7094 and RED tests before implementation. Test split and
       outcome leakage, matching imbalance, empty overlap, family pooling,
       dropped source groups, tie handling, deterministic seeds, and aggregate
       recomputation.
    2. Freeze structural measures before inspecting generator outcomes:
       enumeration node count, branch count, depth, reachable-family count,
       residual magnitude, operand symmetry, and exact solution multiplicity.
    3. Freeze proposal-set measures separately: unique proposals, family
       coverage, entropy, duplicate rate, parse rate, and token budget. Do not
       use exact outcome fields in these measures.
    4. Predeclare quantile strata and nearest-neighbor matching tolerances.
       Form matched cells within held source groups and report balance before
       comparing model outcome. Keep unmatched and empty cells in the artifact.
    5. For every model, source group, and seed, compare solver effort,
       proposal geometry, reachability, and exact success. Report correlations,
       conditional rates, overlap, sensitivity to matching tolerance, and
       family interaction without causal language.
    6. Emit a frozen difficulty_stratum_id for later evaluation only. Exp7095
       may stratify by it but may not fit on held outcomes or exact solver
       effort unavailable at decision time.
    7. Set matched_difficulty_diagnostic_complete_score=1 when every declared
       stratum, matching tolerance, family, group, null cell, and sensitivity
       row is present and recomputable. The relationship itself may be null.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, scoped spec coverage, and root-clutter checks.
    9. A successful exact diagnostic sets verifier_is_oracle=true and
       verdict_class=circular_positive. Do not use that class for a learned
       selector claim.
    10. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (deterministic exact hardness and frozen bank
       diagnostic); inference_substrate_class (no_model_load, or
       blocked_no_run on a blocked precondition); execution_venue (host);
       duration_s; source_artifact_hashes; cited_upstream_artifacts;
       upstream_gate_rows; rows; per_game_results; split_manifest_hash;
       structural_measure_schema; proposal_geometry_schema;
       forbidden_feature_scan; matching_protocol; matching_tolerance_rows;
       structural_effort_rows; proposal_geometry_rows; matched_pair_rows;
       unmatched_rows; empty_cell_rows; balance_rows; difficulty_stratum_rows;
       per_model_rows; per_source_group_rows; per_seed_rows; correlation_rows;
       conditional_outcome_rows; sensitivity_rows;
       matched_difficulty_diagnostic_complete_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (true); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7094_v622_matched_hardness_diagnostic.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

