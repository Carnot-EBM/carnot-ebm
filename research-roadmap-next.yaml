  - id: exp338-host-prereqs-dual-gpu-default
    milestone: "2026.05.13"
    deliverable: ops/host-prereqs.md
    title: "Exp 338: Host prereqs registry + DualGPURunner as default for two-model benchmarks (RETRO-004 + RETRO-006)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: RETRO-006 (host prereqs registry) and RETRO-004 (DualGPURunner default for
      two-model benchmarks) were identified in the milestone 2026.05.06 retrospective.
      RETRO-006 root cause: AMD XDNA NPU experiments (Exps 292, 303, 314, 335) each
      independently discovered the same two missing packages (ninja, openblas), wasting
      ~4 experiment slots. A host-prereqs registry would short-circuit these retries.
      RETRO-004 root cause: DualGPURunner was implemented in Exp 326 but is NOT the
      default for experiments running two LLM models — they still run sequentially on GPU 0.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/dual_gpu_monitor.py — DualGPUMonitor (Exp 326 implementation)
      - scripts/experiment_template.py — ExperimentTemplate.setup_gpu() (to update)
      - results/operational_retro_2026_05_06.json — RETRO-004, RETRO-006 details
      - research-hardware-wishlist.md — AMD XDNA NPU blocked packages listed

      TASK: Create host prereqs registry and wire DualGPURunner as default.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-INFRA-006 (host prereqs registry), REQ-INFRA-007 (dual GPU default),
         SCENARIO-INFRA-009/010/011 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - HostPrereqRegistry: loads ops/host-prereqs.md, parses YAML front-matter or
           markdown table of (package_name, install_command, required_for_class) entries
         - HostPrereqRegistry.check_prereqs(experiment_class) → list[str] missing packages
         - HostPrereqRegistry.check_prereqs(): subprocess check for each package (graceful)
         - DualGPURunner default: ExperimentTemplate.setup_gpu(model_specs) detects when
           len(model_specs) >= 2 and automatically assigns models to separate GPU indices
         - Auto-assignment: model_specs[0] → gpu_index=0, model_specs[1] → gpu_index=1
         - Auto-assignment: if only 1 GPU available, log warning and assign both to gpu_index=0
         - CARNOT_FORCE_LIVE guard: auto-assignment only active when CARNOT_FORCE_LIVE=1
      4. Create ops/host-prereqs.md — system package registry:
         Format as a markdown table:
         | Package | Check Command | Install (Arch) | Install (Debian) | Required For |
         Add entries for:
           - ninja (ninja --version) — AMD XDNA NPU source build
           - openblas (pkg-config --libs openblas) — AMD XDNA NPU source build
           - CARNOT_FORCE_LIVE=1 (env var, not package) — all live GPU experiments
           - nvidia-smi (nvidia-smi --version) — all GPU experiments
           - yosys (yosys --version) — FPGA synthesis experiments
           - nextpnr-xilinx (nextpnr-xilinx --version) — KV260 bitfile generation
         Add human-action note: these are host-level prerequisites that must be installed
         BEFORE the relevant experiment class will succeed. Check this file when an
         experiment is blocked by a missing dependency.
      5. Update ExperimentTemplate.setup_gpu() in scripts/experiment_template.py (additive):
         a. When len(model_specs) >= 2 and CARNOT_FORCE_LIVE=1:
            - Assign model_specs[i]['gpu'] = i (up to n_gpus_detected)
            - If n_gpus_detected == 1: assign all to gpu 0, log "RETRO-004 warning: DualGPU
              auto-assignment requested but only 1 GPU detected; running sequentially"
         b. Add dual_gpu_auto_assigned: bool to returned setup_gpu() dict
         c. Preserve all existing return keys (no regressions)
      6. Write scripts/experiment_338_host_prereqs.py using ExperimentTemplate(338, ...):
