    \ + CI95.\n     Controls on identical folds: (a) majority-class (chance 0.5); (b) the v2 frame-marginal\
    \ head.\n  4. LEAK AUDITS (the whole point of S0'): (a) origin-probe -- with origin matched it must\
    \ now be < 0.6\n     (ideally ~0.5); (b) SHUFFLED-LABEL control -- re-run the LOO with permuted labels;\
    \ AUROC must be <= ~0.55\n     (else the pipeline leaks label via a nuisance path). Per-family ablation:\
    \ each family's individual LOO.\n  5. WRITE the artifact with verifier_is_oracle=false.\n\nFALSIFIABLE\
    \ GATE (the decisive disentangling test):\n  REOPEN-TO-S1 iff ALL hold: structural LOO CI95 lower\
    \ bound > 0.5 AND point > 0.60; AND structural-minus-\n  marginal delta CI95 excludes 0; AND >=1 structural\
    \ family individually clears 0.55; AND the origin-probe is\n  < 0.6 (origin matched, so it should\
    \ be ~chance); AND the shuffled-label control AUROC <= 0.55; AND in-sample\n  positive control > 0.60.\n\
    \  retire_if_same_verdict: true -- if the structural LOO COLLAPSES to chance (CI includes 0.5) once\
    \ origin is\n  matched, the S0 0.746 was driven by the origin leak and the ENTIRE energy-guided direction\
    \ RETIRES for real.\n  If it SURVIVES all gates, the direction is REAL and REOPENS to S1 (contrastive\
