        Test is_anomalous() threshold logic.
        Test AUC computation on synthetic data.
        Test VerificationCertificate has geometric_energy and hallusae_anomalous.
        Traces to REQ-PROBE-050 (new), SCENARIO-PROBE-060 (Tier 0i AUC).
    11. Reconcile:
