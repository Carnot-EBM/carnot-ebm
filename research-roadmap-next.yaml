      TASK
      Audit the exact fixture pipeline and write a .289 stratified evaluation protocol for abstention, formal feedback, verifier calibration, FR-11 stress, and repair gating.

      CONCRETE STEPS
      1. Inspect the .288 fixture-bank artifact and any checked-in fixture manifest.
      2. Determine why exp3085 used only 9 exact cases and whether the remaining fixtures are usable, malformed, duplicate, or missing.
      3. Define a stratified manifest or manifest specification with at least the fields needed for task_family, expected_answer, solver_label, perturbation_type, verifier_target, and repair_target.
