# .331 was the THIRD attempt (after .329/.330) to answer: does verifier value generalize beyond MATH to
# CODE and FACTS? It again did NOT finish honestly. The capstone DECLARED ".329 math-only CONFIRMED" but the
# non-math rows were BLOCKED, not measured: exp3599 (facts corpus v2) wrote an empty {{}} artifact so its
# gated_on fields read None -> exp3600 (NLI grounding verifier) + exp3601 (the CENTERPIECE cross-domain
# re-measurement) both blocked_gate_check_failed; exp3602 (math->code transfer) blocked_no_labeled_code_corpus
# with verifiers_fired_on_code=false; exp3603 (additivity) never ran. Asserting a null with no valid positive
# control is the exact FALSE_NEGATIVE_RISK failure mode. BUT the apparatus EXISTS: data/realistic_factual_
# corpus_v2.jsonl has 200 records with a real evidence_passage column -- the .331 failure was artifact-write +
# over-gating, not inability to build. .332 finishes it: (1) validate the facts corpus + emit BARE gated
# fields (the .330 cascade fix); (2) build/label the CODE corpus so the execution-applicable verifiers FIRE +
# fold in the math->code PRM transfer stress-test (arXiv:2506.00027 vs ThinkPRM arXiv:2504.16828); (3) RUN the
# centerpiece cross-domain re-measurement with graceful per-row degradation + a VALID positive control;
# (4) the additive second-pair-of-eyes McNemar test; then resume NEW breadth (north-star sec-retirement):
# (5) position Carnot vs Weaver (arXiv:2506.18203) incl. the inter-verifier CORRELATION matrix Weaver assumes
# away; (6) build a corpus where oracle > SC and measure verifier-vs-SC + the hybrid detector (arXiv:2510.14913).
# INVARIANTS: paper_ready=true (G1-G4 met; do NOT regress). P0.1 stays honest-negative (do NOT re-test
# Route-1/Route-2; Depth-Over-Breadth retired 2026-05-31). Every gated_on field is a BARE scalar
# (feedback_gated_fields_must_be_bare). exp3612/3613/3614 -> claude (gemini demonstrably failed this exact
# category in .331); all other tasks default agent_type: gemini.

