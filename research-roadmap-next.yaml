      symbolic rules from violation patterns. The proof-of-concept used 10 simulated events.
      This version (v2) replaces simulation with REAL FoVer corpus violation events:
      the FoVer (incorrect) labels are genuine violations; the (correct) labels are non-violations.
      Synthesized rules should reflect ACTUAL patterns in hallucination violations, not simulated ones.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/nexus_constraint_memory.py (NexusConstraintMemory class from exp2666)
      - results/experiment_2666_nexus_tier2_symbolic_memory.json (constraints_synthesized, memory_path)
