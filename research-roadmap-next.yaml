          runner: "ubuntu-latest", target_python: "3.11",
          package_source: "pypi_pinned" | "clone_editable"}}
        - n_samples: 1
        - n_samples_justification: "Ship task; one workflow."
        - workflow_drafted: bool
        - workflow_run_triggered: bool
        - workflow_run_url: str or null
        - workflow_run_status: "success" | "failure" | "pending" | "not_yet_triggered"
        - workflow_run_conclusion: str or null
        - reproducer_doc_updated: bool
        - reproducer_doc_path: "ops/phase-1-reproducers.md"
        - acceptance_gate_passed: bool
        - acceptance_gate_criteria: "Workflow drafted + run triggered
          (or noted-pending) + reproducer doc appended."
        - methodology_note: "An ubuntu-latest runner is a legitimate
          'independent reproducer' per operator-stated criteria. PyPI
          dependency optional — `pip install -e .` from the clone is
          acceptable if PyPI 0.1.0b1 still awaiting approval."
        - optimization_direction: "neither — ship task"
        - honest_verdict: MUST start with terminal prefix.

