    arXiv 2604.03128 (SDPO: Self-Distilled Policy Optimization) converts sparse binary outcome
    rewards into token-level dense supervision by using the same model as teacher+student with
    the verifier as "privileged information". The model generates N completions; the verifier
    scores the full completion; SDPO distills that signal to token-level via KL divergence
    between teacher (privileged = knows verifier score) and student (no privileged info).

    Carnot's energy verifier produces a scalar E per response. SDPO could convert this binary
    pass/fail into a token-level training signal without needing per-step annotations:
    - Teacher: conditioned on E_low completion (knows it's correct) → generates token probs
    - Student: conditioned only on question → generates token probs
    - KL(student || teacher) = training loss signal at token level

    This is a principled complement to GRPO-VPS (which needs step-level verifiers).
    SDPO works with any output-level verifier — including Carnot's energy function.

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write to results/experiment_1213_sdpo_dense_reward_distillation.json:
    {
      "experiment": "1213_sdpo_dense_reward_distillation",
      "status": "in_progress",
      "sdpo_dense_reward_delta_measured": false,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py (energy verifier output)
    - python/carnot/training/latent_grpo.py (GRPO training implementation for reference)

    TASK:
    1. Write skeleton (STEP 0).
    2. Implement SDPO-style dense distillation with Carnot's energy verifier:
       For 50 GSM8K questions, generate 4 completions each via llama.cpp CPU.
       Score all 4 completions with energy verifier E(response).
       Identify "teacher completion" = the one with lowest energy (best = privileged info).
       SDPO distillation signal at token level:
         teacher_logprobs = logprobs of the lowest-energy completion (tokenized)
         student_logprobs = logprobs of each other completion
         sdpo_loss = mean(KL(student_logprobs || teacher_logprobs)) for all non-teacher completions
    3. Compare vs binary-reward baseline (fraction correct from greedy teacher selection):
       - Binary baseline: pick lowest-energy completion as the model's output
       - SDPO baseline: pick lowest KL-distance completion as the model's output
       Both should pick the "best" completion; measure which has higher accuracy on the 50 questions.
    4. Record: teacher selection accuracy (binary E), student accuracy (KL-distance selection),
       sdpo_token_coverage_rate (fraction of tokens with well-defined logprob gradient).
    5. Update artifact.

    CONCRETE STEPS:
    - Write skeleton (STEP 0)
    - find /home -name "*.gguf" 2>/dev/null | grep -iE "qwen3|gemma" | head -3 2>&1
    - python3 -c "from carnot.pipeline.verify_repair import VerifyRepairPipeline; print('ok')" 2>&1
    - [Implement SDPO distillation for 50 GSM8K questions]
    - [Generate 4 completions each, score with energy verifier]
    - [Compute SDPO signal and compare selection methods]
    - Update results/experiment_1213_sdpo_dense_reward_distillation.json

    REQUIRED ARTIFACT FIELDS:
    - n_questions_evaluated: int (50)
    - n_completions_per_question: int (4)
