  - id: exp3612-validate-factual-corpus-v2-emit-bare-fields
    prior_failures:
      - experiment_id: exp3599-build-factual-corpus-v2-with-evidence
        verdict: empty_artifact_no_verdict_corpus_data_landed_but_json_was_empty_braces
        addressed_by: "exp3599 BUILT the corpus (data/realistic_factual_corpus_v2.jsonl, 200 records with a real evidence_passage column) but wrote an empty {{}} artifact, so its gated_on fields read None and cascade-blocked exp3600/3601. This task is DIFFERENT: it does NOT regenerate via fragile live SOTA inference -- it VALIDATES the existing 200-record corpus (evidence independence + confidence headroom) and re-emits a CLEAN artifact with the gated fields as BARE top-level booleans (the .330/.331 cascade fix). If the existing corpus fails the sanity gates, it deterministically rebuilds from a real evidence-bearing labeled dataset (HaluEval QA `knowledge` / RAGTruth / FELM)."
        retire_if_same_verdict: false
    milestone: "2026.06.332"
    title: "Validate the existing factual corpus v2 (200 recs, held-out evidence) — evidence independence + confidence headroom in (0.5,0.95) — and re-emit a CLEAN artifact with BARE gated fields"
    priority: critical
    max_turns: 50
    agent_type: claude
    requires_claude: true   # gemini wrote an empty {{}} artifact for exactly this task in .331 (exp3599); judgment-heavy leak/independence checks + bare-field emit discipline
    estimated_wall_time_min: 16
    track: evidence
    inference_substrate: aggregation_from_upstream_artifacts
    requires_gpu: false
    deliverable: results/experiment_3612_validate_factual_corpus_v2.json
    prompt: |
      CONTEXT: the .331 facts row was blocked because exp3599 wrote an empty {{}} artifact even though it
      successfully built data/realistic_factual_corpus_v2.jsonl (200 records: {{question, answer,
      is_hallucination, evidence_passage, model_confidence}}). This task makes the facts apparatus USABLE:
      validate the corpus and emit a clean artifact whose gated fields are BARE top-level booleans so the
      downstream gated_on checks succeed (the .330/.331 cascade fix per feedback_gated_fields_must_be_bare).
      EXISTING CODE TO READ FIRST: data/realistic_factual_corpus_v2.jsonl (the 200-record corpus to VALIDATE,
      not rebuild); results/experiment_3598/3599 via scripts/summarize_artifact.py (the leak diagnosis +
      what exp3599 intended); scripts/experiment_template.py.
      PRECONDITIONS (step 0, check BEFORE validation):
        a. data/realistic_factual_corpus_v2.jsonl present AND >= 200 lines of valid JSON. If absent or < 50
           valid records -> deterministic rebuild path (step 1b). If neither the file nor a fetchable
           evidence-bearing dataset is available -> honest_verdict "complete: blocked_no_evidence_corpus".
        b. (rebuild fallback only) network check `curl -sf -o /dev/null https://huggingface.co/api/datasets`.
      CONCRETE STEPS:
        1a. VALIDATE the existing corpus: confirm every record carries a non-empty evidence_passage; confirm
            answers are REAL factual strings (reject any `^[RH]\d+$` / `^Q\d+$` placeholder tokens -- those
            are the toy tokens that leaked into the .330 AUROC=1.0). Record n_examples, n_hallucinated,
            n_correct (class balance).
        1b. IF validation fails (placeholder tokens, missing evidence, n<50): rebuild deterministically from a
            real evidence-bearing labeled dataset (HaluEval QA `knowledge` field / RAGTruth reference passages
            / FELM) -- prefer fetch over live generation; write data/realistic_factual_corpus_v3.jsonl and
            validate THAT.
        2. SANITY GATE A (headroom): compute the model-confidence (or sequence-logprob) AUROC on the corpus.
           It MUST be in (0.50, 0.95). <=0.50 (anti-correlated noise) OR >=0.95 (no headroom) means the corpus
           or confidence extraction is degenerate -- report honestly, set facts_corpus_validated=false.
        3. SANITY GATE B (evidence independence): assert the evidence_passage is NOT a function of
           is_hallucination (e.g. evidence present for both classes; passage does not trivially flag the
           label) so a grounding verifier cannot leak the way exp3587 did.
        4. Emit the validated corpus path + class balance.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; the gated fields facts_corpus_validated and
      facts_corpus_has_evidence MUST be stored as BARE top-level booleans, NOT {{value,principle}} dicts):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "aggregation_from_upstream_artifacts (principle: validates an existing on-disk corpus + reads upstream diagnosis; no live LLM unless the rebuild fallback fires)."
        corpus_path_used:
          principle: "Which corpus the downstream rows must score (v2 validated, or v3 rebuilt) -- single source of truth."
        corpus_source:
          principle: "Provenance: validated-existing-v2 or rebuilt-from-DATASET+URL+field -- audit trail."
        n_examples:
          principle: "Sample-size rigor; >=200 for a percentage-point AUROC claim downstream."
        n_hallucinated:
          principle: "Class balance -- an AUROC on a 99/1 split is uninformative."
        n_correct:
          principle: "Class balance."
        confidence_baseline_auroc_on_corpus:
          principle: "THE realism gate: must be in (0.5,0.95) so verifiers have headroom AND confidence is not anti-correlated noise."
        evidence_independent_of_label:
          principle: "True iff the evidence passage does not leak the gold answer / label -- the precondition that prevents the exp3587 AUROC=1.0 leak from recurring."
        facts_corpus_has_evidence:
          principle: "BARE bool. True iff every record carries an independent held-out evidence passage. STORE AS BARE true/false (gates the grounding-verifier path inside exp3614)."
        facts_corpus_validated:
          principle: "BARE bool. True iff confidence_baseline_auroc in (0.5,0.95) AND evidence_independent_of_label AND no placeholder tokens. STORE AS BARE true/false."
        placeholder_tokens_rejected:
          principle: "Confirms the toy R1/H1/Q1 tokens that produced the .330 leak are absent -- a leak-free but vacuous corpus is still degenerate."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection across replications."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "n_examples >= 200 AND facts_corpus_has_evidence == true AND facts_corpus_validated == true"
          principle: "A fair factual corpus is defined by independent held-out evidence AND confidence headroom; without both, the downstream grounding test repeats the .330/.331 contamination."
      TERMINAL VERDICTS: "complete: factual_corpus_v2_validated_held_out_evidence_confidence_headroom_confirmed_bare_fields_emitted" /
      "complete: factual_corpus_rebuilt_v3_validated_bare_fields_emitted" /
      "complete: factual_corpus_degenerate_confidence_out_of_band_or_evidence_leaks_facts_row_blocked" /
      "complete: blocked_no_evidence_corpus"
      Run: cd {project_root} && python scripts/experiment_3612_validate_factual_corpus_v2.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3613-code-corpus-verifiers-fire-math-to-code-transfer
    prior_failures:
      - experiment_id: exp3602-math-to-code-prm-transfer-positive-control
        verdict: complete_blocked_no_labeled_code_corpus_verifiers_fired_on_code_false
        addressed_by: "exp3602 blocked because no labeled code corpus was loadable and the execution-applicable verifiers never scored (verifiers_fired_on_code=false). This task is DIFFERENT: it BUILDS the labeled code corpus from the EXISTING results/experiment_1999_code_verification_humaneval.json (per-candidate correctness labels) and explicitly WIRES the four execution-applicable verifiers (controlled_invariance_executor_v2, executable_monitor_runtime_adapter, ast_structure_verifier, code_structural_dependency_verifier) to score completions, asserting n_scored>0 and not-all-0.5 BEFORE reporting any transfer number. New corpus + new verifier wiring + a headroom check = a runnable test, not a re-run of a blocked one."
        retire_if_same_verdict: false
    milestone: "2026.06.332"
    title: "Build the labeled CODE corpus + make the execution-applicable verifiers actually FIRE + math→code PRM-transfer stress-test (arXiv:2506.00027 vs ThinkPRM arXiv:2504.16828)"
    priority: critical
    max_turns: 60
    agent_type: claude
    requires_claude: true   # gemini left the code verifiers inert in .331 (exp3602); multi-file verifier wiring + execution choreography + OOD judgment
    estimated_wall_time_min: 24
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3613_code_corpus_verifiers_fire_transfer.json
    prompt: |
      CONTEXT: the .331 code row was a non-result because there was no labeled code corpus and the
      execution-applicable verifiers never fired. This task makes the code apparatus REAL and runs the
      literature's positive control: arXiv:2506.00027 found math-trained PRMs transfer to code AS WELL AS OR
      BETTER than code-trained PRMs (HumanEval+ best-of-8: PRM-Math 91.5% vs PRM-Code 89.0%); ThinkPRM
      (arXiv:2504.16828) is the counter-hypothesis (discriminative verifiers are OOD-fragile). Does the
      FoVer-math-derived verifier signal transfer to a CODE benchmark on Carnot?
      VERIFIER AUTHENTICITY (CLAUDE.md -- MANDATORY): the verifiers must do what their docstrings claim; the
      execution-applicable verifiers must actually execute/parse the candidate code, not return a constant.
      NULL DISCIPLINE (FALSE_NEGATIVE_RISK): a "does not transfer" verdict is only trustworthy if the code
      corpus has headroom (confidence/SC baseline materially < 1.0) AND the verifiers fired (n_scored>0,
      not all 0.5).
      EXISTING CODE TO READ FIRST: results/experiment_1999_code_verification_humaneval.json + its corpus
      (baseline 0.66 -> repair 0.84) via scripts/summarize_artifact.py; results/experiment_3598 (the
      applicable_verifiers_code list) if present; the four code-applicable verifiers under python/carnot/
      verify/ -- controlled_invariance_executor_v2.py, executable_monitor_runtime_adapter.py,
      ast_structure_verifier.py, code_structural_dependency_verifier.py.
      PRECONDITIONS (step 0):
        a. A code benchmark with per-candidate correctness labels loadable (exp1999 HumanEval; or MBPP/
           LiveCodeBench if on disk). If none -> "complete: blocked_no_labeled_code_corpus".
        b. The four code-applicable verifiers importable; record any import-inert verifier and continue.
      CONCRETE STEPS:
        1. Assemble the labeled code corpus from exp1999 (>= 50 candidates with correctness labels). Persist
           data/code_verification_corpus_v1.jsonl with the candidate, the label, and the test outcome.
        2. Score the four execution-applicable verifiers on each candidate. ASSERT they fired: code_verifiers_
           fire = (n_scored > 0 AND score variance > 0). If they do not fire, DIAGNOSE why (interface
           mismatch? sandbox?) and report code_verifiers_fire=false honestly -- do NOT fabricate scores.
        3. Score the FoVer-math-derived verifier signal on the SAME corpus; error-detection AUROC + >=3 seeds
           + CI. Compute the confidence/SC baseline AUROC (the headroom check).
        4. Report the transfer delta vs the +4-8pt arXiv:2506.00027 anchor and which hypothesis it supports
           (transfer vs discriminative-fragility).
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; the gated field code_verifiers_fire MUST be a BARE
      top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores the cached code corpus; no LLM load)."
        code_corpus_path:
          principle: "Where the labeled code corpus lives -- the apparatus exp3614 reuses for the code row."
        code_corpus_name:
          principle: "Which labeled code benchmark was scored -- provenance."
        n_examples:
          principle: "Sample-size rigor (>=50 candidates with labels)."
        code_verifiers_fire:
          principle: "BARE bool. True iff the execution-applicable verifiers scored (n_scored>0, variance>0) -- distinguishes 'transfer failed' from 'verifiers never ran' (the .331 AUROC 0.44 cause). STORE AS BARE true/false."
        execution_verifier_auroc:
          principle: "The execution-applicable verifiers' standalone code-error signal + CI."
        math_signal_code_auroc:
          principle: "The transferred FoVer-math verifier signal on code -- the core transfer number."
        code_confidence_baseline_auroc:
          principle: "Headroom check: a baseline near 1.0 means no room to discriminate, so a null is uninformative (the .331 code failure mode)."
        transfer_delta_vs_literature:
          principle: "Signed comparison to the +4-8pt arXiv:2506.00027 anchor -- contextualizes Carnot against the published positive control."
        hypothesis_supported:
          principle: "'transfer' (2506.00027) or 'discriminative_fragility' (2504.16828) -- the falsifiable mechanism for the cross-domain result."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "n_examples >= 50 AND code_verifiers_fire == true AND code_confidence_baseline_auroc present"
          principle: "A code transfer verdict requires the verifiers actually fired on a headroom-bearing labeled corpus; a null without that is the .331 wiring failure, not evidence."
      TERMINAL VERDICTS: "complete: code_corpus_built_verifiers_fire_math_signal_transfers_to_code" /
      "complete: code_corpus_built_verifiers_fire_math_signal_does_not_transfer_discriminative_fragility" /
      "complete: code_corpus_built_but_execution_verifiers_inert_diagnosed" /
      "complete: blocked_no_labeled_code_corpus"
      Run: cd {project_root} && python scripts/experiment_3613_code_corpus_verifiers_fire_transfer.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3614-corrected-cross-domain-remeasurement-v2
    prior_failures:
      - experiment_id: exp3601-corrected-cross-domain-remeasurement
        verdict: blocked_gate_check_failed
        addressed_by: "exp3601 NEVER RAN -- it blocked because its upstream exp3599 wrote an empty artifact (the .331 cascade). This task fixes the root cause (the corpus is validated with BARE gated fields by exp3612; the code verifiers fire per exp3613) AND removes the brittle hard gate: the centerpiece is NOT gated_on anything -- it degrades GRACEFULLY per row (math always lands; a missing non-math corpus runs as a 'blocked' row, never skips the whole task). New gate plumbing + validated corpus + firing verifiers + graceful degradation = the fair re-measurement."
        retire_if_same_verdict: false
      - experiment_id: exp3588-corrected-cross-domain-remeasurement
        verdict: blocked_gate_check_failed
        addressed_by: "exp3588 (the .330 centerpiece) also blocked on the dict-vs-bare gate cascade and never produced an artifact. Same structural fix: bare gated fields upstream + no hard gate on this task + graceful per-row degradation."
        retire_if_same_verdict: false
    milestone: "2026.06.332"
    title: "CENTERPIECE: corrected cross-domain re-measurement — math (0.9131, frozen) | code (execution verifiers, exp3613) | facts (real NLI grounding verifier, validated corpus exp3612) vs strong confidence baseline, VALID positive control"
    priority: critical
    max_turns: 60
    agent_type: claude
    requires_claude: true   # the .330+.331 centerpieces both cascade-failed under gemini; multi-file (NLI verifier + execution verifiers + scoring) + leak judgment + graceful-degradation logic
    model: opus
    estimated_wall_time_min: 28
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: true
    deliverable: results/experiment_3614_corrected_cross_domain_remeasurement_v2.json
    prompt: |
      CONTEXT: the fair cross-domain test that .329/.330/.331 each tried and failed to run honestly. Measure
      the verifier ensemble's error-detection generalization across math | code | facts, each with its
      APPLICABLE verifier set on a corpus WITH headroom, vs a strong model-confidence baseline. CRITICAL
      LESSON FROM .331: do NOT assert a null when a row is blocked. This task NEVER asserts "math-only" from a
      blocked row -- it runs each row that CAN run and marks rows that cannot as explicitly "blocked" (not as
      AUROC~0.5). positive_control_valid is TRUE only if the non-math rows actually RAN with real headroom.
      VERIFIER AUTHENTICITY (CLAUDE.md -- MANDATORY): the facts row uses a REAL NLI-model atomic-claim
      grounding verifier (HalluSearch/VeriScore recipe, arXiv:2504.10168/2406.19276): decompose the MODEL'S
      answer into atomic claims -> score each claim's entailment against the corpus evidence_passage ONLY ->
      energy = fraction of unentailed/contradicted claims. Use a real DeBERTa/MiniLM-NLI checkpoint via
      transformers, OR a DISCLOSED text-statistical proxy (pcib_probe.py pattern) -- record which in
      nli_substrate. CRITICAL LEAK GUARDS: (i) the existing python/carnot/verify/
      retrieval_nli_grounding_verifier.py is the LEAKY exp3587 verifier -- its proxy literally checks whether
      the answer string contains the character 'H' (the toy H1/H2 label-correlate exp3598 caught). You MUST
      DELETE that substring/'H'-token logic entirely, not merely tweak it. (ii) the verifier scores the
      MODEL's answer against the evidence ONLY -- it must NEVER read the corpus `answer` (gold) field or the
      `is_hallucination` label; pass it only (model_answer, evidence_passage). (iii) An AUROC of exactly 1.0
      (or >=0.99) on n>=200 is a RED FLAG = leak; if you see it, the retrieval/feature is leaking -- diagnose,
      fix, and report the honest lower number. Note: it is EXPECTED and NOT a leak that a correct answer's
      evidence entails it while a hallucinated answer's evidence does not -- that is exactly what grounding
      should measure; the leak is any path from the gold answer/label into the score.
      EXISTING CODE TO READ FIRST: results/experiment_3612 (corpus_path_used + facts_corpus_validated) +
      results/experiment_3613 (code_corpus_path + code_verifiers_fire) via scripts/summarize_artifact.py;
      results/experiment_2837_fover_memory_leakage_v3.json (the frozen FoVer math 0.9131 headline -- NO
      re-run); python/carnot/verify/retrieval_nli_grounding_verifier.py + the code-applicable verifiers;
      CLAUDE.md "Verifier Authenticity Discipline".
      PRECONDITIONS (step 0):
        a. Math row = the frozen exp2837 0.9131 headline (always lands, no dependency).
        b. Facts row: if results/experiment_3612 facts_corpus_validated==true AND a NLI checkpoint (or
           disclosed proxy) is loadable, RUN it; else mark the facts row "blocked_facts_corpus" and continue.
        c. Code row: if results/experiment_3613 code_verifiers_fire==true, RUN it on code_corpus_path; else
           mark the code row "blocked_code_verifiers" and continue.
      CONCRETE STEPS:
        1. Build the generalization table: rows = {{math (0.9131, frozen), code (execution-applicable verifiers
           on exp3613 corpus), facts (real NLI grounding verifier on exp3612 corpus)}}. Each row: ensemble
           AUROC + CI, confidence-baseline AUROC + CI, ensemble-minus-confidence delta + paired CI.
        2. >=3 seeds per row that runs; bootstrap CI; class balance recorded per row.
        3. Per-domain honest verdict: generalizes (ensemble materially > 0.5 AND >= confidence) / domain-bound
           (ensemble ~0.5 OR < confidence) / blocked (row could not run) -- against a VALID positive control.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; the gated field positive_control_valid MUST be a
      BARE top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores cached corpora + a small NLI checkpoint; not the FoVer LLM)."
        nli_substrate:
          principle: "Declares model-based NLI vs disclosed text-statistical proxy -- verifier-authenticity honesty."
        evidence_excludes_gold_answer_assert:
          principle: "Asserts the retrieved evidence never contains the gold answer -- the explicit guard against the exp3587 leak."
        generalization_table:
          principle: "domain -> {{ensemble_auroc, confidence_auroc, delta, ci, ran_or_blocked}} -- the milestone's central evidence object, measured fairly."
        math_ensemble_auroc:
          principle: "The frozen FoVer math headline (0.9131) re-stated as the row baseline."
        code_generalizes:
          principle: "Code re-tested with execution-applicable verifiers that fired -- distinguishes a wiring bug from a real code limitation."
        facts_generalize:
          principle: "Facts re-tested with the real leak-free grounding verifier on a corpus with held-out evidence -- the core-motivation result."
        grounding_verifier_auroc:
