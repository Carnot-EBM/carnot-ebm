      5 experiments (exp1715/1721/1741/1745/1811). exp1745 confirmed
      ensemble-output alpha is substrate-inaccessible. exp1811 shipped
      Fast-Slow Variant. exp1837 (this milestone) is the adversarial
      confirmation of exp1811's win. If both pass, Fast-Slow Variant
