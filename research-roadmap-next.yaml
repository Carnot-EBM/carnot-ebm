    7. Run VJEPA v2 on labeled SVAMP pairs. Compute svamp_auc_post_filter.
    8. Compute labeling_mismatch_confirmed:
       True iff: mean_cot_depth_svamp < 2.0
             AND mean_cot_depth_gsm8k > 4.0
