  - id: exp4370-llm-generated-action-cost-heuristics
    milestone: 2026.06.404
    title: "PHASE A1 (HEADLINE; oracle-distinct EFFICIENCY moat, STRONGER function class) -- LLM-GENERATED ACTION-COST HEURISTICS (arXiv:2503.18809 VERIFIED 'Classical Planning with LLM-Generated Heuristics: Challenging the State of the Art with Python Code', Correa/Pereira/Seipp). .403 (exp4364) PROVED a LINEAR learned A* action-cost heuristic COMPOUNDS (held-out env-actions 25->16, positive-control-passed, reproduction-gated, DEPLOYED into arc_solver_kit, verifier_is_oracle=false) -- but the stronger LLM-generated-PROGRAM arm did NOT run (llm_heuristic_arm.ran=false). This is the flagged_for_v404 HEADLINE: does a STRONGER function class deepen the efficiency moat? The codex agent (the proposer -- NO nested CodexProposer) writes several DOMAIN-DEPENDENT Python heuristic functions h(state)->cost-to-go per ARC game, selects the strongest by GREEDY-BEST-FIRST-SEARCH on TRAINING levels (the 2503.18809 method), then evaluates on FRESH HELD-OUT levels vs the DEPLOYED linear heuristic (exp4364). Skeptic-proof by construction: STATIC-LEAKAGE analysis on every generated program (reject any that reads answer cells / env internals / hard-codes a level layout), a reproduction gate on every counted plan (arc_solver_kit.reproduce), and a fixed held-out split. Emit llm_heuristic_beats_linear BARE bool := (the best CLEAN LLM-generated heuristic reduces held-out actions-to-solve BELOW the deployed linear heuristic AND static_leakage_clean AND every counted plan reproduces). verifier_is_oracle=false (the heuristic ESTIMATES cost-to-go; the executable env defines the win -- oracle-distinct). A win = the efficiency moat DEEPENS (a stronger learned heuristic generalizes better); a CLEAN null (the linear cost is already near-optimal on our solved games) is decision-grade (the function class is settled). NO TRM training; CPU-offline search; the codex agent generates the programs (zero extra GGUF load)."
    priority: critical
    track: self-learning-efficiency-headline
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-17 planner self-learning-mandate continuation + SOTA-ingestion exp4365 flagged_for_v404 (standing) auto-override class 3 (versioned-lineage continuation with a STATED forward difference): this BUILDS ON the SUCCESSFUL exp4364 linear action-cost heuristic (25->16, a WIN) with a STRONGER function class (LLM-generated Python heuristic programs, arXiv:2503.18809) -- false-positive scope-match vs the RETIRED cross-game value-TRANSFER line (exp4318/4331/4342) which is a DIFFERENT scope (transfer a value head across games); this is per-game LLM-generated heuristic synthesis selected by held-out reproduced action count, the explicit flagged_for_v404 follow-up. NOT cross-game transfer."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4370_llm_generated_action_cost_heuristics.json
    prompt: |
      CONTEXT: research-program.md "Continuous Self-Learning" (mandated; learning that COMPOUNDS) + north-star §0/§5
      (EFFICIENCY is first-class -- ARC-AGI-3 scores action-efficiency vs a human baseline, arXiv:2603.24621; the verifier
      earns its place at LOWER COST). .403 PROVED a LINEAR action-cost heuristic compounds + deploys (exp4364, 25->16).
      The flagged_for_v404 HEADLINE is the STRONGER function class: arXiv:2503.18809 -- ask the LLM to generate several
      DOMAIN-DEPENDENT Python heuristic functions per planning domain, evaluate them on training tasks in greedy-best-first
      search, keep the strongest; it beats SOTA domain-independent heuristics on unseen tasks. YOU (codex) are the
      proposer (write the heuristic programs directly -- NO nested CodexProposer). Skeptic-proof: static-leakage analysis +
      reproduction gate + fresh held-out levels.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4364_self_learning_action_cost_compounds.json (the .403 WIN: the deployed linear heuristic, the compounding curve, the held-out split, positive_control_passed) + its experiment script
        - python/carnot/agentic/arc_solver_kit.py (OfflineSolver, the A* cost hook, reproduce()) + python/carnot/agentic/arc_graph_explore.py (the A*-style goal heuristic hook) + python/carnot/agentic/arc_heuristic_select.py (the goal-distance heuristics cell_count/region_count/bfs; recommend_order) + python/carnot/agentic/arc_value_learner.py (the LearnedVerifier state->steps-to-go)
        - ops/arc_solve_registry.yaml (the 33 solved levels / 17 games -- the training corpus of solve traces; the learning_loop section)
        - research-references.md (.404 sweep: arXiv:2503.18809 LLM-generated heuristics; arXiv:2603.24621 ARC-AGI-3 action-efficiency framing) + results/experiment_4365_sota_ingestion_v404.json (the .404 method map + failure mode)
        - scripts/experiment_template.py, scripts/adversarial_verify.py (FALSE_NEGATIVE_RISK aware), scripts/summarize_artifact.py
        - CLAUDE.md "ARC Solve Reproducibility + Solver-Reuse Discipline", "Missing-Verifier Gap Logging", "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification + Sample-Size Rigor", "SOTA Local Models"

      TASK: generate domain-dependent LLM heuristic programs per ARC game, select the strongest by training-level GBFS, evaluate on FRESH held-out levels vs the deployed linear heuristic; report whether the stronger function class deepens the efficiency moat, leakage-clean and reproduction-gated.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any generation):
           a. The solved-level trajectories + the deployed linear heuristic load (ops/arc_solve_registry.yaml + the exp4364 heuristic). If <8 reproduced levels with action traces are loadable -> honest_verdict `blocked_insufficient_solve_traces` and STOP.
           b. arc_solver_kit imports + reproduce() runs. If not -> honest_verdict `blocked_solver_kit_unavailable` and STOP.
           c. Conductor stood-down on TRM training; this is CPU heuristic SYNTHESIS + offline search, NOT model training.
           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate.
        1. GENERATE (the 2503.18809 method): for each game with >=2 reproduced levels, WRITE several (>=3) candidate Python heuristic functions h(state)->cost-to-go (the codex agent IS the generator -- a SOTA GGUF, unsloth/gemma-4-12B-it-GGUF, is the declared reproducible-alternative generator in model_specs). The heuristics estimate actions-to-win from observable grid features ONLY.
        2. STATIC-LEAKAGE ANALYSIS on every generated program (BEFORE any selection): reject any heuristic that reads answer cells / env internals / hard-codes a specific level layout / imports the solver's goal predicate. Record static_leakage_clean per program. A program that fails the static analysis is DROPPED, not scored.
        3. SELECT by GREEDY-BEST-FIRST-SEARCH on TRAINING levels (per game): plug each CLEAN heuristic into arc_solver_kit's A* cost, run GBFS on the game's TRAINING levels, keep the strongest (fewest expansions/actions to the reproduced solution).
        4. EVALUATE on FRESH HELD-OUT levels (leave-some-levels-out, never seen during selection): measure held-out env-actions-to-solve for the selected LLM heuristic vs the DEPLOYED linear heuristic (exp4364) vs the BFS/region-count baseline. REPRODUCTION-GATE every counted plan (only plans that still arc_solver_kit.reproduce count). n>=8 held-out levels; report per-game + aggregate.
        5. Emit llm_heuristic_beats_linear BARE bool := (best clean LLM heuristic held-out actions < deployed linear held-out actions AND static_leakage_clean AND all counted plans reproduce). Log any held-out level where NO clean heuristic reduced actions as a missing-verifier gap (ops/verifier_gaps.md). Run adversarial_verify.py (clean; FALSE_NEGATIVE_RISK -- a null with the linear baseline as the positive control is informative). Declare random_seed + reproducibility_checksum + model_specs (the GGUF + the codex-proposer + the held-out split + n).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A win (the stronger function class reduces held-out actions, leakage-clean + reproduction-gated -- the efficiency moat deepens) and a CLEAN null (the linear cost is already near-optimal on our solved games -> the function class is settled) are BOTH decision-grade."
        llm_heuristic_beats_linear:
          principle: "BARE bool: the capstone + the A2 gate read this (gated-fields-must-be-bare); true iff the best CLEAN LLM-generated heuristic reduces held-out actions-to-solve BELOW the deployed linear heuristic AND static_leakage_clean AND every counted plan reproduces -- the stronger function class deepening the oracle-distinct efficiency moat."
        held_out_actions_by_heuristic:
          principle: "dict {{linear, llm_generated, bfs_baseline}} -> held-out env-actions-to-solve -- the head-to-head efficiency numbers (the north-star action-efficiency axis)."
        per_game_scorecard:
          principle: "list of {{game, best_heuristic_src, held_out_actions_llm, held_out_actions_linear, static_leakage_clean, reproduced}} -- the per-game record."
        static_leakage_clean:
          principle: "BARE bool: true iff every SELECTED heuristic passed the static-leakage analysis (no answer-cell / env-internal / hard-coded-layout access) -- the no-cheating guard a twice-burned operator requires."
        reproduction_gated:
          principle: "BARE bool: true iff every counted plan still passes arc_solver_kit.reproduce -- an action-minimal plan that does not reproduce does NOT count."
        n_held_out_levels:
          principle: "BARE int: held-out level count -- MUST be >= 8 (power; CLT minimum for the action-delta claim)."
        verifier_is_oracle:
          principle: "BARE bool=false -- the learned/generated action-cost heuristic ESTIMATES cost-to-go; the executable env defines the win -- it is oracle-DISTINCT, not the oracle."
        preconditions_checked:
          principle: "Records the solve-trace + solver-kit + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the heuristic synthesis + the held-out split + the GBFS selection."
        reproducibility_checksum:
          principle: "Hash of the training corpus + the held-out split + the selected heuristic programs + the reproduce() results; lets a third party re-run."
        model_specs:
          principle: "The generator (codex/gpt-5.5 proposer + the declared unsloth/gemma-4-12B-it-GGUF reproducible alternative) + the deployed linear heuristic baseline + the held-out split + n; required methodology + SOTA-model compliance."
      ACCEPTANCE GATE:
        - condition: "llm_heuristic_beats_linear + held_out_actions_by_heuristic + per_game_scorecard + static_leakage_clean + reproduction_gated + n_held_out_levels (>=8) reported with verifier_is_oracle=false and preconditions_checked and adversarial_verify CLEAN, OR an honest blocked_insufficient_solve_traces / blocked_solver_kit_unavailable / clean-powered-null verdict"
          principle: "A STRONGER learned heuristic class (LLM-generated Python programs, 2503.18809) that reduces held-out actions-to-solve below the deployed linear cost -- leakage-clean + reproduction-gated -- DEEPENS the oracle-distinct EFFICIENCY moat (the north-star §5 'verifier earns its place at lower cost' realized on ARC action-efficiency); a clean null settles the function class (decision-grade)."

      Run: `python3 {project_root}/results/experiment_4370_llm_generated_action_cost_heuristics.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

