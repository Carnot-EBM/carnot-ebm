- id: exp693-jepa-v15-root-cause-audit
  milestone: 2026.04.53
  deliverable: results/experiment_693_jepa_v15_root_cause.json
  title: 'Exp 693: JEPA v15 Root Cause Audit + v16 Architecture Design (OOD AUC=0.4751 below random)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 682 (JEPA v15 OOD Audit) confirmed OOD AUC=0.4751 on GSM8K 500-699
    — below random (0.5). This is WORSE than chance: the model is actively predicting
    the WRONG label on truly unseen data. Three root cause hypotheses:

    H1 (CPMI pair distribution mismatch): The CPMI pairs in fover_labeled_formal_v1.json
    were all generated from GSM8K 0-499 with Qwen3.5-0.8B forced responses. On GSM8K
    500-699 (different questions, different difficulty distribution), the latent feature
    distribution shifts — JEPA's contrastive embeddings do not transfer. Evidence: check
    if latent mean and variance differ significantly between train/OOD splits.

    H2 (PUREMinFormLoss anti-correlation): PUREMinFormLoss minimizes the "minimum formal
    representation" — it may inadvertently push embeddings AWAY from hallucination signal
    on OOD data where the formal structure is different. If the loss gradient points in
    the wrong direction for OOD inputs, AUC < 0.5 is the expected outcome.

    H3 (Latent collapse / compositional gap): JEPA v15 was trained on 57 hand-labeled
    pairs — too small for generalization. The latent space may have collapsed to a
    low-rank representation that memorizes training distributions.

    arXiv 2603.20327 (JEPA Latent Probing for Discrete Symbol Extraction) proposes
    probing JEPA latent vectors for discrete symbolic features (variable binding, formula
    structure). If JEPA latents capture symbolic structure, H1 is most likely. If they
    do not, H3 (collapse) is more likely.

    EXISTING CODE TO READ FIRST:
    - results/experiment_682_jepa_v15_ood_audit.json — true_ood_auc=0.4751, ece, Platt T.
    - python/carnot/models/jepa_predictor.py — JEPAPredictor architecture.
    - python/carnot/models/pure_min_form_loss.py — PUREMinFormLoss implementation.
    - python/carnot/pipeline/jepa_cpmi_pair_builder.py — CPMI pair construction.
    - results/fover_labeled_formal_v1.json — Z3-labeled training pairs from Exp 686.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Identify root cause of JEPA v15 OOD failure; specify v16 architecture changes.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-049 (JEPA v16 design must address identified root cause from v15 audit),
       REQ-LEARN-050 (JEPA v16 OOD AUC target >= 0.75 on GSM8K 500-699),
       SCENARIO-LEARN-081/082/083 to openspec/capabilities/autoresearch/spec.md.
    3. Create scripts/experiment_693_jepa_v15_root_cause.py:
       a. ExperimentTimeoutWatchdog(693, timeout_minutes=30).
       b. Load fover_labeled_formal_v1.json — extract training pairs.
          Split: train (GSM8K 0-399), OOD probe (GSM8K 500-699).
       c. Load JEPA v15 weights (results/jepa_predictor_v15_real.safetensors).
          If missing: use v15.1 from Exp 685 (results/jepa_predictor_v15_1_dualgpu.safetensors).
          If both missing: run probe on random init (H3 diagnosis only).
       d. H1 probe (CPMI distribution shift):
          Extract latent embeddings for train pairs and OOD pairs.
          Compute: train_mean, ood_mean, distribution_shift_l2 = ||train_mean - ood_mean||.
          Compute: train_var, ood_var, variance_ratio = ood_var / train_var.
          H1_confirmed: distribution_shift_l2 > 0.5 OR variance_ratio > 2.0.
       e. H2 probe (PUREMinFormLoss gradient direction):
          For 10 OOD pairs: compute loss gradient w.r.t. input embeddings.
          Check gradient sign: positive = pushing AWAY from correct class (H2 confirmed).
          H2_confirmed: mean gradient sign is positive on OOD inputs.
       f. H3 probe (latent rank / collapse):
          Compute SVD of train latent matrix. Count singular values > 0.01 (effective rank).
          H3_confirmed: effective_rank < 5 (collapsed) OR top singular value captures > 90% variance.
       g. Symbolic probing (arXiv 2603.20327):
          For each latent: compute correlation with symbolic features:
            digit_density (count of digit characters / len), operator_density,
            compute_line_count, step_index (position in CoT), step_length.
          symbolic_probe_r2 = max correlation^2 across features and latent dims.
          symbolic_structured: symbolic_probe_r2 > 0.3 (latents encode symbolic info).
       h. Determine primary root cause:
          If H1_confirmed: root_cause = "cpmi_distribution_mismatch"
          Elif H2_confirmed: root_cause = "pure_loss_anti_correlation"
          Elif H3_confirmed: root_cause = "latent_collapse_small_data"
          Else: root_cause = "unknown_requires_ablation"
       i. Write v16 architecture spec based on root cause:
          H1 -> "domain-adaptive CPMI: include OOD-sampled pairs in training"
          H2 -> "replace PUREMinFormLoss with InfoNCE loss (standard contrastive)"
          H3 -> "increase training data to >= 500 pairs via FoVer Z3 labeler"
          Record in artifact: v16_architecture_spec (str), v16_training_data_target (int).
       j. honest_verdict:
          - "root_cause_identified_v16_specced" if root_cause != "unknown_requires_ablation"
          - "root_cause_ambiguous_ablation_needed" otherwise
       k. artifact: H1_confirmed, H2_confirmed, H3_confirmed, root_cause,
          distribution_shift_l2, variance_ratio, effective_rank, symbolic_probe_r2,
          v16_architecture_spec, v16_training_data_target, honest_verdict.
    4. Write tests/python/test_experiment_693_jepa_root_cause.py with 100% coverage:
       - test H1/H2/H3 probe logic.
       - test root_cause assignment from probe flags.
       - test v16_architecture_spec is non-empty.
       Each test traces to REQ-LEARN-049/050.
    5. Reconcile:
       - ops/status.md: add "JEPA v15 root cause identified: {root_cause} (Exp 693)".
       - ops/changelog.md: one-line with root_cause and honest_verdict.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

