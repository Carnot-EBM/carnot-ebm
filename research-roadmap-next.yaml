      EXISTING CODE TO READ FIRST: `python/carnot/verify/python_types.py`.
      TASK: Build the formal verification orchestrator.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/formal_orchestrator.py`.
      2. Implement iterative solver-querying (e.g., Z3) within the generation loop.
      3. Write `{project_root}/results/experiment_1787_formal_orchestrator.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

