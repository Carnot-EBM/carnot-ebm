tasks:
  - id: exp1986-combined-audit-198-199
    title: "Exp 1986: Combined .198 + .199 findings audit + corrigenda"
    deliverable: results/experiment_1986_findings_audit_198_199.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures: []
    prompt: |
      CONTEXT: Combined audit of .198 (exp1981-1985: Phase 1 MCP docs +
      Independent Reproducer + CoT2-Meta routing + audit + retro) and
      .199 (exp1991+: eGPU/CLaRa/strict-epsilon scope per outer-loop draft).
      Routine audit cadence; double-milestone scope because the .200
      outer-loop pre-stage couldn't run the linter due to bash failure
      and wanted to consolidate audit coverage.

      FALSIFIABLE HYPOTHESIS: At least 3 .198/.199 artifacts will be
      flagged by the 9-rule adversarial-verify linter. Classify each
      REAL_BUG / FALSE_POSITIVE / NEEDS_REVISION. Special check: any
      `blocked_*` honest verdicts get NEEDS_REVISION-not-flagged
      classification (they're honest, not bugs).

      EXISTING CODE TO READ FIRST:
        - scripts/adversarial_verify.py (9-rule linter; rule #8
          IMPLAUSIBLE_TIGHT_CI is the newest)
        - results/experiment_198[1-5]*.json + experiment_199[0-9]*.json
        - ops/conductor-log.md (for any SKIP/DOOMED_RERUN/GATE_BLOCK
          pattern in .198/.199)

      TASK: Audit + corrigenda + SKIP-cascade diagnosis if applicable.

      CONCRETE STEPS:
        0. PRECONDITIONS: scripts/adversarial_verify.py importable.
        1. `python3 scripts/adversarial_verify.py --milestone-range
           1981 2000`.
        2. Classify each flag; append corrigendum_2026_05_200_audit
           (CLAUDE.md no-pruning: APPEND only).
        3. Scan ops/conductor-log.md for SKIP/DOOMED_RERUN/GATE_BLOCK
           entries since 2026-05-16T06:00Z; if any, diagnose root cause.
        4. For REAL_BUG findings, propose .201+ follow-ups.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.findings_audit_corrigenda.v12"
