  - id: exp4381-biprm-detector-localization-abstention
    milestone: 2026.06.405
    title: "PHASE A1 (HEADLINE; oracle-distinct DETECTOR made ACTIONABLE; verifier_is_oracle=false) -- BiPRM BIDIRECTIONAL step-error LOCALIZATION + selective-prediction ABSTENTION (arXiv:2508.01682 VERIFIED 'Bidirectional Process Reward Model', the .404 SOTA-ingestion flagged_for_v405). .404 (exp4375) PROVED the verifier ensemble DETECTS step-errors (AUROC 0.918, CI95 lower 0.909, beats chance) on a corpus where SELECTION headroom is ~0 (oracle@K==vote@1) -- but 'beats chance' is NOT a usable capability. This is the depth step: make the positive detector signal ACTIONABLE. (1) LOCALIZATION: run an L2R AND an R2L detector pass over the cached step-labeled FoVer corpus (the exp4375 corpus), FUSE the two scores (BiPRM bidirectional), and measure earliest-error-step localization (ProcessBench-style first-error accuracy/F1) for the bidirectional fusion vs a unidirectional L2R baseline. (2) ABSTENTION: from the detection score, report the selective-prediction operating point -- the accuracy-vs-coverage / risk-coverage curve, precision@high-recall, and the selective risk at a useful coverage (the 'I don't know' gate the detector spec named). (3) ONLINE-ACTOR HONESTY (the SOTA failure-mode): the R2L pass uses FUTURE context unavailable to an in-loop actor -> report bidirectional localization as an OFFLINE post-hoc detector, and keep a CAUSAL/L2R-only variant as the online-actionable number; NEVER conflate the two. Emit detector_localization_actionable BARE bool := (bidirectional fusion improves first-error localization over unidirectional L2R, CI95-excl-0, AND the risk-coverage curve yields a useful selective operating point). verifier_is_oracle=false (a learned/energy detection signal scored against cached candidates, oracle-distinct). A win = the oracle-distinct verifier graduates 'beats chance'->'localizes + abstains usefully'; a clean null (the unidirectional detector is already as good as bidirectional, or abstention gives no useful operating point) is decision-grade. Cached candidates, CPU, zero quota -- NOT hostage to any live LLM or the retired DiffusionGemma infra. NO TRM training."
    priority: critical
    track: detector-actionable-headline
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-14 operator P0 MANDATORY-NEXT-MILESTONE directive (oracle-distinct frontier; the verifier-as-detector measurement is the COMPLEMENTARY vehicle) + the .404 SOTA-ingestion exp4376 flagged_for_v405 = biprm_processbench_detector_localization_v405 (standing) auto-override class 3 (versioned-lineage continuation with a STATED forward difference): this BUILDS ON the SUCCESSFUL exp4375 detector win (AUROC 0.918, a POSITIVE) by making it ACTIONABLE (BiPRM bidirectional localization + selective-prediction abstention, arXiv:2508.01682) -- false-positive scope-match vs the RETIRED cross-domain SELECTION line (exp4314, a DIFFERENT scope: select a better answer across domains); this is step-error DETECTION localization where selection headroom is ~0. NOT a selection rerun."
