      true -- if A1 cannot even produce a non-degenerate coverage measurement (e.g. proposer never runs, or the
      positive control fails so the measurement is a harness artifact), the proposer-coverage diagnostic approach
      is retired and .448 must instrument generation differently.'
    retire_if_same_verdict: true
  prompt: |
    CONTEXT ({date}). HEADLINE. The forward focus (standing operator directive, ops/known-issues.md) is
    "the L1-first-contact GENERATION wall (the actual multi-level live-solve blocker)". Across ~17 nulled
    levers (.425-.446) EVERY residual_dead_end is the same: "candidate generation is the bottleneck; the
    winning prefix is never proposed, so ranking/routing/perception only reorders a pool without the winner".
    Energy is CONCLUDED; exploration-prior CLOSED; perception-from-grid a proven null (.446 A1). We have
    NEVER MEASURED the wall. This headline does, as a Phase-Prototype DIAGNOSTIC (measurable, positive
    control, B1 adversarial check) -- NOT an 18th lever.

    THE MEASUREMENT. For a set of public games whose winning L1 prefix is ALREADY banked offline as ground
    truth (ops/arc_solve_registry.yaml, 25 games), run the LIVE generic first-contact proposer -- the
    StepwiseExplorer / OfflineSolver proposal step used by the live agent -- on each game's L1 from a COLD
    start, with NO GameAdapter and the proposer BLIND to the banked solution (this blindness is load-bearing;
    B1 will verify it). Capture the proposer's enumerated candidate pool within the standard action budget.
    For each game classify into exactly one bucket:
      - COVERED: the winning L1 prefix (or any prefix that reaches the L1 win) IS in the pool and reachable
        within budget -> the wall is RANKING/SELECTION (a ranker/learned verifier could still help).
      - ENUMERATED-BUT-LOST: the winning prefix is enumerated but pruned/truncated by the search budget ->
        the wall is SEARCH DEPTH / PRUNING.
      - NEVER-ENUMERATED: the winner's action primitives are never proposed -> the wall is EXPRESSIBILITY /
        VOCABULARY (no ranker can fix it; need program synthesis over richer primitives).
    Report the per-game bucket and the DOMINANT bucket. POSITIVE CONTROL: a game WITH a GameAdapter (e.g.
    tu93) must come out COVERED -- else a global "never covered" is a harness artifact, not a finding.

    SCOPE: a PROBE/DIAGNOSTIC (Phase-Prototype+Validation discipline). It must be LIVE-PATH-REACHABLE -- an
    instrumentation hook on the EXISTING OfflineSolver/StepwiseExplorer (importable by the live agent;
    arc_orphan_solver_lint must pass), NOT a parallel solver. Do NOT inject the banked answer into the
    proposer. Keep the action budget bounded so the run fits the codex wall-clock cap; checkpoint per game.

    verifier_is_oracle: the reproduction gate that defines "the winning prefix" is the executable oracle ->
    declare verifier_is_oracle=true (circularity discipline); this is a GROUNDING measurement, not a moat.

    EXISTING CODE TO READ FIRST:
      - {project_root}/python/carnot/agentic/arc_solver_kit.py (offline_arcade, reproduce, the proposal/search engine)
      - {project_root}/scripts/arc_loop_solve.py (OfflineSolver; the live development twin)
      - {project_root}/python/carnot/agentic/arc_competition_agent.py (StepwiseExplorer; the scored live proposer)
      - {project_root}/ops/arc_solve_registry.yaml (banked winning prefixes = ground truth)
      - {project_root}/scripts/summarize_artifact.py (read upstream artifacts via this)

    CONCRETE STEPS:
      0. PRECONDITIONS (BEFORE any other step):
         a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
            Else honest_verdict blocked_offline_arcade_missing, write the deliverable, EXIT.
         b. Qwen3.5-9B-MTP available on the iGPU (NEVER the 3090s) IF the proposer invokes the LLM; if the
            generator is unavailable -> blocked_generator_unavailable, write deliverable, EXIT.
         c. >=3 games with a banked L1 winning prefix are present in the registry + offline env; if NONE
            -> blocked_no_banked_ground_truth, EXIT.
      1. Build the coverage instrumentation as a hook on the live proposer (no injected answer).
      2. Run the proposer cold on each selected game's L1 within the bounded action budget; capture the pool.
      3. Classify each game COVERED / ENUMERATED-BUT-LOST / NEVER-ENUMERATED; record the dominant bucket.
      4. POSITIVE CONTROL: confirm an adaptered game (tu93) is COVERED.
      5. WRITE the artifact (solve_provenance=development_proxy -- an offline coverage measurement, NOT a live first-win).

    FALSIFIABLE GATE:
      PASS iff (i) the positive control (an adaptered game) is COVERED -- proving the measurement is real,
      not a harness artifact; AND (ii) a non-degenerate per-game bucket distribution is produced over >=3
      held-out games with a named dominant bucket. The FINDING (whichever bucket dominates) is the headline
      and redirects .448. retire_if_same_verdict: true -- if the positive control FAILS or no non-degenerate
      distribution is produced, the proposer-coverage diagnostic is retired (the measurement itself is broken).

    REQUIRED ARTIFACT FIELDS (principle-annotated):
      honest_verdict:
        principle: "terminal prefix; a measured decomposition is complete_generation_wall_<dominant_bucket>_dominant
          (e.g. complete_generation_wall_never_enumerated_dominant)."
      per_game_coverage:
        principle: "per-game mapping game -> {bucket in COVERED|ENUMERATED_BUT_LOST|NEVER_ENUMERATED,
          winning_prefix_len, pool_size, reached_l1_win, budget_actions} -- the quantitative measurement."
      dominant_bucket:
        principle: "the bucket the majority of held-out games fall in -- the headline that redirects .448
          (never_enumerated -> generation expressibility; enumerated_but_lost -> budget/pruning; covered -> ranking)."
      positive_control_game:
        principle: "the adaptered game used as positive control; it MUST be COVERED or the measurement is a
          harness artifact (a Phase-Prototype positive control)."
      positive_control_covered:
        principle: "true iff the positive control came out COVERED -- the load-bearing not-a-harness-artifact check."
      proposer_blind_to_banked_answer:
        principle: "true -- the banked winning prefix was NOT injected into the proposer (the tautology trap B1 audits)."
      n_games_measured:
        principle: ">=3 held-out games for a non-degenerate distribution."
      verifier_is_oracle:
        principle: "true -- the reproduction gate defining the winner is the executable oracle (circularity discipline)."
      live_path_reachable:
        principle: "the instrumentation hooks the live proposer (arc_orphan_solver_lint passes) -- a diagnostic
          the live agent cannot reach is wasted effort."
      solve_provenance:
        principle: "development_proxy -- an offline coverage measurement, NOT a live first-win; declared honestly."
      inference_substrate:
        principle: "live_llm_inference if the proposer invokes the LLM (60s floor), else
          verifier_ensemble_against_cached_candidates -- declare what actually ran."
      preconditions_checked:
        principle: "records arcade/generator/ground-truth checks; a missing resource emits blocked_, never a fabricated bucket."
      random_seed:
        principle: "determinism for the proposer's stochastic search."
      reproducibility_checksum:
        principle: "content hash of (games, proposer config, budget) so a replication catches drift."

