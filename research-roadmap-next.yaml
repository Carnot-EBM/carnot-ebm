- id: exp2456-nco-corrigendum-v2
  title: 'Phase 4: NCO Corrigendum v2 -- Fix AUROC=0.500 Tautology from exp2444'
  milestone: 2026.05.237
  deliverable: results/experiment_2456_nco_corrigendum_v2.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp2444-nco-negative-constraint
    verdict: complete_AUROC_0.500
    addressed_by: "exp2444 (.236) implemented NCO (arXiv:2605.10065) but achieved AUROC=0.500 — adversarially
      flagged as tautology (exact chance-level on a 50/50 split). Root cause diagnosis: the evaluation
      used the same 36 entries for both training the FSM pattern matcher and testing, resulting in
      perfect memorization but no generalization (or alternatively, the constraint automaton accepted
      all tokens equally, giving a degenerate score). Fix: (a) use 5-fold stratified CV instead of
      single train/test split, (b) verify that nco_score variance is > 0 across examples (non-degenerate),
      (c) run adversarial_verify.py on the artifact before submission."
    retire_if_same_verdict: true
  prompt: "CONTEXT: exp2444 (.236) implemented NCO Negative Constraint Decoding (arXiv:2605.10065) but\n\
    achieved AUROC=0.500 — adversarially flagged by adversarial_verify.py as a tautology (exact\nchance level\
    \ on a binary task with balanced classes). The retro identified this as an adversarial\nflag requiring corrigendum.\n\
    \nRoot causes to check:\n  1. If all 36 examples received the same nco_score: the automaton is degenerate\
    \ (no discrimination).\n  2. If nco_score has positive variance but AUROC=0.5: likely train/test leakage.\n\
    \  3. If the automaton matched every token or no token: NCO constraint too broad/narrow.\n\nThis v2 diagnoses\
    \ the root cause and fixes the evaluation protocol.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/nco_constraint.py\
    \ (from exp2444, if present)\n  {project_root}/results/experiment_2444_nco_negative_constraint.json (exp2444\
    \ result)\n\nTASK: Diagnose NCO tautology root cause, fix, re-evaluate with 5-fold CV.\n\nCONCRETE STEPS:\n\
    \  0. PRECONDITIONS:\n     a. sklearn importable: .venv/bin/python -c \"import sklearn; print(sklearn.__version__)\"\
    \n     b. Telemetry manifest: ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n     c. adversarial_verify.py\
    \ exists:\n        ls {project_root}/scripts/adversarial_verify.py\n\n  1. Read nco_constraint.py (if present)\
    \ and exp2444 artifact.\n     Compute score variance from exp2444: if all scores are identical, diagnose\
    \ degenerate automaton.\n     Identify: was there train/test split? What was the constraint automaton pattern?\n\
    \n  2. Fix evaluation:\n     a. Load 36 telemetry entries from live_sota_balanced_telemetry_manifest_1480.jsonl.\n\
    \     b. For each entry: compute nco_score as number of tokens the constraint automaton REJECTS\n       \
    \  divided by total tokens (rejection rate = proxy for constraint violation).\n        Use a simple constraint:\
    \ reject tokens with log-probability < -10 (high-uncertainty tokens).\n     c. Verify nco_score has non-zero\
    \ variance across 36 examples: std(scores) > 0.\n        If std=0: adjust constraint to rejection_rate\
    \ using 25th percentile logprob threshold.\n     d. Evaluate via stratified 5-fold CV:\n        from sklearn.model_selection\
    \ import StratifiedKFold\n        from sklearn.metrics import roc_auc_score\n        nco_auroc = mean AUROC\
    \ across 5 folds.\n\n  3. Run adversarial_verify.py on the new artifact before finalizing:\n     .venv/bin/python\
    \ scripts/adversarial_verify.py --artifact /tmp/exp2456_draft.json 2>&1 | tail -10\n     If TAUTOLOGY flag:\
    \ investigate further; do NOT submit tautology artifact.\n     If clean: proceed.\n\n  4. Write deliverable.\
    \ Validate JSON before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix\
    \ required.\"\n  - nco_auroc:\n      principle: \"Primary metric via 5-fold CV. Must differ from 0.500 to\
    \ show non-degenerate discrimination.\"\n  - nco_vs_exp2444_delta:\n      principle: \"nco_auroc - 0.500.\
    \ Positive = improvement over tautology baseline.\"\n  - root_cause_of_tautology:\n      principle: \"Documents\
    \ why exp2444 got AUROC=0.5. Required for corrigendum record.\"\n  - score_variance:\n      principle: \"std(nco_scores)\
    \ across 36 examples. Non-zero proves non-degenerate automation.\"\n  - adversarial_verify_passed:\n     \
    \ principle: \"True if adversarial_verify.py returned no TAUTOLOGY or CRITICAL flags.\"\n  - n_folds:\n \
    \     principle: \"Must be 5 (5-fold CV).\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n\
    \      principle: \"Guards against fabrication.\"\n\nACCEPTANCE GATES:\n  - condition: \"nco_auroc != 0.500\
    \ AND score_variance > 0\"\n    principle: \"Non-degenerate AUROC is the minimum viable result. If still\
    \ 0.5 with positive variance, NCO approach may not work on this telemetry — still a valid finding.\"\n\
    \nDo NOT push. Do NOT modify scripts/research_conductor.py."

