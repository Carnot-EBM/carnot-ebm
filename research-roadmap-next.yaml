    \ soundness_mistakes, completeness_mistakes.\n     Gate check: n_violations_processed >= 10.\n\n  3. Compute\
    \ summary metrics:\n     soundness_tracking_enabled: True (if SoundnessCompletenessTracker was used)\n     completeness_tracking_enabled:\
    \ True\n     soundness_error_rate: soundness_mistakes / n_violations_processed\n     completeness_error_rate:\
