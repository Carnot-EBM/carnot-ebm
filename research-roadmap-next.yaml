  - id: exp2743
    milestone: "2026.05.260"
    deliverable: "results/experiment_2743_tier0v_set_consistency.json"
    title: "Set-Consistency Energy Network Tier 0v (arXiv:2503.10695): Verifier for Multi-Statement Coherence"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 40
    track: verifier

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .260 — no prior failures for this specific scope.

      arXiv:2503.10695 "Introducing Verification Task of Set Consistency with Set-Consistency Energy
      Networks" (Mar 2025, Mooho Song, Hyeryung Son, Jay-Yoon Lee):
      Uses contrastive loss to learn compatibility among statement COLLECTIONS (sets), not just pairs.
      SC-Energy assigns low energy to internally-consistent sets, high energy to contradictory sets.
      Validated on logical consistency benchmarks.

      Carnot context: Carnot's tier0u verifier checks global pairwise consistency. Set-Consistency
      extends this to multi-statement coherence: given N statements (across a multi-step CoT), does the
      FULL SET form a coherent, non-contradictory argument? Individual pairwise checks miss contradictions
      that only emerge at the set level (e.g., Step 3 is consistent with Step 1 AND with Step 2, but
      Steps 1+2+3 together imply a contradiction).

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (list all tier0* modules — add tier0v_set_consistency.py after tier0u)
      - data/fover_corpus.jsonl (FoVer corpus for training)
      - python/carnot/verify/__init__.py (export pattern)

      TASK: Implement Tier 0v Set-Consistency Energy Network. Evaluate on FoVer corpus.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            Record: fover_corpus_lines (int).
            If 0 or missing: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Load FoVer corpus. Build sets: for each question, combine the correct answer + 2 incorrect
         answers to form triplets (sets of 3 statements). Correct set = [q, a_correct, a_correct_step2].
         Inconsistent set = [q, a_correct, a_incorrect] (one member breaks consistency).
         n_sets = number of such triplets built.
         Record: n_sets (int), n_corpus_entries (int).

      2. Implement SetConsistencyVerifier:
         For a set of N statements:
           a. TF-IDF feature vector for each statement
           b. Set-level energy = contrastive score:
              E(set) = max_pair_distance(TF-IDF pairwise cosine sim) scaled to [0, 1]
              (high inconsistency = low min similarity = high energy)
           c. Energy normalized to [0, 1]: 0 = perfectly consistent set, 1 = contradictory
         Record: module_created (bool).

      3. Evaluate on held-out FoVer sets (80/20 split, random_seed=42):
         For consistent sets: energy should be LOW (< 0.5)
         For inconsistent sets: energy should be HIGH (> 0.5)
         tier0v_auroc = roc_auc_score(inconsistency_labels, set_energies)
         tier0v_precision_at_k = precision for top-k (k=10) flagged inconsistent sets
         Record: tier0v_auroc (float), tier0v_precision_at_k (float), tier0v_viable (bool = tier0v_auroc >= 0.65).

      4. Adversarial check: construct 3 synthetic inconsistent sets (known contradictions):
         - "The sum of 2+3 is 5" + "The sum of 2+3 is 7" (arithmetic contradiction)
         - "The cat is alive" + "The cat is dead" (logical contradiction)
         - "X > Y" + "X < Y" (logical contradiction)
         Each should have high energy (> 0.5).
         Record: synthetic_inconsistency_energies (list of 3 floats), all_high_energy (bool = all > 0.4).

      5. Create python/carnot/verify/tier0v_set_consistency.py with SetConsistencyVerifier.
         Update python/carnot/verify/__init__.py to export it.

      6. Write results/experiment_2743_tier0v_set_consistency.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - tier0v_auroc: float
        principle: "Primary accuracy metric: set-consistency AUROC on FoVer inconsistency labels."
      - tier0v_viable: bool
        principle: "Gate: True if tier0v_auroc >= 0.65 (better than random, complementary to tier0u)."
      - synthetic_inconsistency_energies: list of float (3 values)
        principle: "Adversarial sanity check: known contradictions must produce high energy."
      - all_high_energy: bool
        principle: "Confirms verifier detects obvious contradictions (if False, fundamental flaw)."
      - tier0v_precision_at_k: float
        principle: "Precision-at-10: practical metric for flagging top inconsistent responses."
      - module_created: bool
        principle: "Tier 0v module exists in python/carnot/verify/ after this task."
      - n_sets: int
        principle: "Dataset scale: confirms set construction produced usable training data."
      - random_seed: int — 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "TF-IDF + contrastive eval + export: expected 5-60s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records sklearn + FoVer corpus checks."

