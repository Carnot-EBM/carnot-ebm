      addressed_by: "Refine the failure taxonomy into repair policies inspired by HalluGuard's data-driven versus reasoning-driven split."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    exp1324 identified parser/schema mismatch, undergeneration, semantic
    invalidity, solver disagreement, UNKNOWN mishandling, and leakage risk.
    HalluGuard suggests separating data-driven failures from reasoning-driven
    instability instead of treating hallucination as one class. Use
    {project_root} as the project root and {date} as the run date in artifact
    metadata.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - results/experiment_1323_sota_gguf_token_health_prompt_runtime_diagnostic.json
    - results/experiment_1324_certificate_failure_taxonomy_formalizer_reality_check.json
    - results/experiment_1340_trigger_before_constrain_certificate_v6_sota.json
    - docs/research-notes/literature-priority-audit.md
    - openspec/capabilities/pipeline/spec.md

    TASK:
    Produce a refined certificate failure split and repair policy. This is a
    replay/audit task over available artifacts; do not run fresh SOTA models.

    REQUIRED ARTIFACT FIELDS:
    - status
    - source_cases_available
    - data_driven_risk_proxy
    - reasoning_driven_risk_proxy
    - parser_schema_risk_count
    - undergeneration_risk_count
    - semantic_invalidity_count
    - unknown_mishandling_count
    - repair_policy_by_failure_type
    - universal_detector_claim_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1341_halluguard_certificate_failure_split.json immediately with status="in_progress".
    2. Read exp1323, exp1324, and exp1340 if present. If exp1340 is absent or blocked, proceed from exp1324 only and record the limitation.
    3. Map each observed failure class into data-driven risk, reasoning-driven risk, parser/schema risk, undergeneration risk, semantic invalidity, or UNKNOWN mishandling.
    4. Avoid claiming a universal hallucination detector; set universal_detector_claim_allowed=false unless there is direct evidence beyond the local certificate slice.
    5. Write repair_policy_by_failure_type with concrete next actions such as prompt retrieval, reasoning budget, grammar branch, semantic validator, or UNKNOWN-preserving fallback.
    6. Write all required fields, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1341_halluguard_certificate_failure_split.json')); print(d.get('source_cases_available'), d.get('universal_detector_claim_allowed'), d.get('honest_verdict'))"
