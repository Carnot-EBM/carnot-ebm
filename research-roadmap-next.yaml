- id: exp846-arbiter-gibbs-warmstart
  milestone: 2026.04.65
  deliverable: results/experiment_846_arbiter_gibbs_warmstart.json
  title: 'Exp 846: Multi-Agent Arbiter Gibbs Warm-Start Fix v3 (RETRO-ARBITER-FLAT-ENERGY, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: MultiAgentArbiter has been non-functional for three consecutive milestones (.62, .63,
    .64). accuracy_standard=0.0 in Exp 835 despite Z-score normalization. Root cause: the Gibbs
    sampler initializes all spins to zero and runs only N_sweeps=10 before measuring energy. At
    beta=1.0, an MCMC chain cold-started from zero needs hundreds of sweeps to reach equilibrium.
    The measured "energies" are initialization noise, not Boltzmann-distributed values. Z-score
    normalization of noise = still noise. The fix is a warm-start initialization.

    EXISTING CODE TO READ FIRST:
    - results/experiment_835_arbiter_calibration_fix_v2.json — energies_raw diagnostic,
      accuracy_standard=0.0, Z-score application details
    - python/carnot/models/ising.py or crates/carnot-ising/src/ — IsingEBM Gibbs implementation
    - python/carnot/pipeline/verify_repair.py — MultiAgentArbiter or arbiter energy scoring path
    - openspec/capabilities/pipeline/spec.md — REQ-SAMPLE-* entries

    TASK: Implement Gibbs warm-start with 500 burn-in sweeps from mean-field initialization.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_835_arbiter_calibration_fix_v2.json.
       Extract: energies_raw list, accuracy_standard=0.0. Confirm energy magnitudes are
       small (|energy| < 0.5 for most entries).
    3. Find the Gibbs sampler implementation in the Python IsingEBM:
       a. Search for Gibbs sweep logic (look for spin flip, conditional energy computation).
       b. Find N_sweeps parameter (default 10 in most EBM implementations).
       c. Find initial spin state (likely zeros or random).
    4. Implement GibbsWarmStart:
       a. Mean-field initialization: for each spin i, compute h_eff_i = h_i + sum_j J_ij * 0.
          Since we start from zero: h_eff_i = h_i (bias only).
          Set s_i = sign(h_i) if h_i != 0, else random ±1.
          (This is the one-step mean-field approximation for the zero-magnetization state.)
       b. Burn-in: run 500 Gibbs sweeps after MF initialization before any energy measurement.
       c. Add warm_start_sweeps parameter to IsingEBM.energy() or equivalent measurement call.
          Default: warm_start_sweeps=500.
          Legacy behavior preserved with warm_start_sweeps=0.
    5. Apply warm-start in MultiAgentArbiter.score_agent_outputs():
       a. For each agent response, call IsingEBM with warm_start_sweeps=500.
       b. Preserve Z-score normalization from Exp 835 (do not remove it).
       c. Add energy_magnitude_check: assert abs(mean_energy) > 0.5 after warm-start.
          If this fails: log diagnostic and fall back to legacy mode.
    6. Test: 12 scenarios from Exp 822 (reconstruct 6 standard + 6 adversarial from stored data).
       If Exp 822 data not available: generate 12 synthetic scenarios:
         - Standard: 3 agents answer same math question; agent A correct (should have low energy),
           agents B and C wrong (should have high energy).
         - Adversarial: 3 agents; agents B and C share the same wrong answer (majority wrong),
           agent A has correct but minority answer.
       Compute: accuracy_standard (did arbiter pick correct agent for standard scenarios?).
       Compute: accuracy_adversarial (did arbiter pick correct agent against wrong majority?).
       Target: accuracy_standard >= 0.67 (4/6 correct).
       Verify: energy magnitude check — abs(mean(energies)) > 1.0 for at least 75% of scenarios.
    7. Add to openspec/capabilities/pipeline/spec.md:
       REQ-SAMPLE-020: GibbsWarmStart MUST initialize from sign(h_i) with burn_in >= 500 sweeps
         when measuring energy for arbitration or constraint injection.
       SCENARIO-SAMPLE-030: MultiAgentArbiter with 3 agents; warm-start active; energies_raw
         show abs(energy) > 1.0; accuracy_standard >= 0.67.
    8. honest_verdict:
       - "arbiter_calibrated" if accuracy_standard >= 0.67 AND mean_energy_magnitude > 1.0
       - "arbiter_partial" if accuracy_standard >= 0.50 but < 0.67
       - "arbiter_still_wrong" if accuracy_standard < 0.50
    9. Write tests/python/test_experiment_846_arbiter_warmstart.py with 100% coverage.
       Include: test_cold_start_vs_warm_start_energy_magnitude, test_mf_initialization,
       test_accuracy_standard_above_threshold, test_arbiter_energy_magnitude_check.
       Traces to REQ-SAMPLE-020, SCENARIO-SAMPLE-030.
    10. Reconcile:
        - ops/changelog.md: one-line entry
        - ops/status.md: "Exp 846: Arbiter warm-start v3. accuracy_standard=<val>. RETRO status."
    11. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_846_arbiter_warmstart.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp847-constraint-retrieval-l2-fix
  milestone: 2026.04.65
  deliverable: results/experiment_847_constraint_retrieval_l2_fix.json
  title: 'Exp 847: EmbeddingConstraintStore L2-Norm Retrieval Fix (RETRO-CONSTRAINT-ZERO-DELTA, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 836 fixed the write path (15 constraints stored across 3 sessions). But
    delta_overall=0.0 persists because the retrieval path is broken: cosine similarity is computed
    on un-normalized vectors. Raw sentence-transformer embeddings have L2 norm ~0.9-1.1 but not
    exactly 1.0. Cosine similarity without normalization is inconsistent and often near-random.
    The default cosine threshold (0.7) is rarely crossed, so retrieve() returns empty lists.
    IsingEBM external field receives zero-magnitude inputs → energy delta = 0.

    EXISTING CODE TO READ FIRST:
    - results/experiment_836_constraint_accumulation_fix_v3.json — write path confirmed working,
      n_constraints_written=15, delta_overall=0.0, retrieval diagnostic fields
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline and constraint retrieval path
    - python/carnot/verify/ — EmbeddingConstraintStore and ConstraintRetriever implementation
    - openspec/capabilities/pipeline/spec.md — REQ-VERIFY entries for constraint memory

    TASK: Fix EmbeddingConstraintStore to L2-normalize vectors on write and retrieve.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_836_constraint_accumulation_fix_v3.json.
       Find retrieval diagnostic fields: cosine_similarities_observed, n_constraints_retrieved_per_query.
       Confirm they show near-zero cosine similarities or empty retrieval results.
    3. Find EmbeddingConstraintStore.write() and .retrieve() in the codebase:
       Search python/carnot/verify/ for EmbeddingConstraintStore or ConstraintRetriever.
       Read the storage and retrieval code.
    4. Diagnose: compute cosine similarity between 5 stored constraints and 5 known-similar queries
       WITHOUT normalization. Confirm: similarities are in range [0.0, 0.3] (low).
    5. Fix EmbeddingConstraintStore.write():
       Add: embedding = embedding / (np.linalg.norm(embedding) + 1e-8)
       before storing. Store the normalized vector.
       Add: assert retrieval_l2_normalized == True (class invariant flag).
    6. Fix EmbeddingConstraintStore.retrieve():
       Add: query = query / (np.linalg.norm(query) + 1e-8)
       before computing cosine similarities. (Dot product of two L2-normalized vectors = cosine similarity.)
    7. Lower default cosine threshold from 0.7 to 0.5:
       Sentence-transformer vectors for constraint-type variations (different wording, same semantics)
       typically have cosine similarity 0.5-0.7, not the 0.8-0.95 seen in document retrieval.
    8. Validate retrieval quality on held-out constraint pairs:
       a. Generate 5 constraint types × 5 query variations = 25 (query, correct_type) pairs.
       b. For each query: retrieve top-1 constraint from a set of 5 stored constraints.
       c. Compute AUROC: does the correct type rank highest?
       d. Target: retrieval_auroc > 0.80.
    9. Run 3 simulated sessions (synthetic, CPU-only, no GPU) with fixed retrieval:
       a. Session 1: 10 synthetic GSM8K violations. Write to store. Retrieve before session 2.
       b. Session 2: 10 questions; IsingEBM uses retrieved constraints as external field.
       c. Session 3: same.
       d. Measure delta_simulated = precision_s3 - precision_s1.
       (This is synthetic only; live GPU validation is in Exp 848.)
    10. Add to openspec/capabilities/pipeline/spec.md:
        REQ-VERIFY-150: EmbeddingConstraintStore MUST L2-normalize embeddings before storage
          and before similarity computation.
        SCENARIO-VERIFY-175: Store 5 constraints; retrieve with similar query; cosine similarity
          > 0.5 (not ~0.1 as with un-normalized vectors); correct type ranked first.
    11. honest_verdict:
        - "retrieval_fixed" if retrieval_auroc > 0.80
        - "retrieval_partial" if retrieval_auroc >= 0.60 but < 0.80
