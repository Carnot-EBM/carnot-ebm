      - paper_ready: bool (principle: readiness must not be inferred)
      - publication_blocker_count: int (principle: blockers must be counted)
      - blocker_delta_from_v24: int (principle: progress must be measured)
      - next_top_gap: str (principle: next milestone should target the largest residual gap)
