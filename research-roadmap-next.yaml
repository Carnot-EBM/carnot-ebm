    - {project_root}/scripts/arc_leaderboard_eval.py
    - {project_root}/python/carnot/agentic/arc_competition_agent.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/python/carnot/agentic/arc_induction_tool_loop.py
    - {project_root}/python/carnot/agentic/arc_tool_gap_receipt.py
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/python/carnot/experiment_7193_v634_arc_direct_tool.py
    - {project_root}/results/experiment_7193_v634_arc_direct_tool.json
    - {project_root}/results/experiment_7194_v634_arc_gap_audit.json
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/inference/llama_server_supervisor.py
    - {project_root}/python/carnot/gpu_lease_phase_journal.py
    - {project_root}/openspec/capabilities/arc-world-model-trust-energy/spec.md

    TASK:
    Produce results/experiment_7206_v635_arc_volume_a.json. Create scripts/experiments/experiment_7206_v635_arc_volume_a.py as the executable entrypoint. Reuse shipped code; new implementation follows spec-first, tests-first development.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print and flush before checking anything. Confirm the driving capability spec contains REQ-* requirements; add scoped specs and meaningful failing tests before new implementation. Verify cited source bytes, imports, tools, directories, exact producer gate fields and upstream authentication. Reject quarantined upstream artifacts independently of structured field gates. Unwrap only actual principle/value wrappers, never arbitrary dictionaries. Missing unchanged external prerequisites require terminal blocked plus gate_check_summary; a known failed value must not be promoted. Checkpoints belong under results/checkpoints/, not the terminal deliverable. Never run the whole project test suite as a precondition.
    1. Print a flushed progress line at EVERY numbered phase boundary, before and after any model load, generation, benchmark or subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed time at least every 60 seconds. Start a truthful external heartbeat around blocking native calls, stream subprocess output unbuffered, and bound each call. Keep every output gap below 600 seconds: a silent task can die at 1200 seconds despite the 4800-second hard cap. Heartbeats report observed state, never fabricated progress.
    2. MODEL_SPECS = [{{"hf_id": "unsloth/Qwen3.8-27B-GGUF", "quantization": "Q4_K_M"}}]. Resolve cached_current_model(), record GGUF path/revision/hash, and use its embedded tokenizer/chat template with native llama.cpp. Set CARNOT_FORCE_LIVE=1; acquire a task-owned GPU lease after a read-only conflict check. Never kill, share or replace an unowned model process. A cache/CUDA/lease miss is blocked, with no simulation or legacy small-model substitution. Record model_count=1 and runner choice; no DualGPURunner is needed for one model. This task is planned as inference_substrate_class=model_full_generation. Real full generation has a 60-second floor; a canary or small fixed token budget is model_bounded_generation with a 10-second floor; load/embeddings without generation are model_load_no_generation with a 2-second floor. If execution stops at a canary, declare bounded generation even if the planned task was full. Use inference_substrate=live_llm_inference and inference_mode=live_gpu only when actual CUDA inference occurred. Never wait to satisfy a floor. Set execution_venue=host and put hostname in execution_host. Record phase_spans, task-owned GPU samples, model identity and actual completions.
    3. Before launch, let the evaluator inspect the solve registry and confirm r11l is already reproduced. Keep its per-game GameAdapter, routes, solved trajectories, source, registry and historical world models unavailable to the policy. Use the actual E3AgentPolicy/make_carnot_agent path through scripts/arc_leaderboard_eval.py:run_game with a fresh isolated state. The environment may execute its own game source. Verify the policy access boundary; an offline hand-built adapter is not a substitute.
    4. Set CARNOT_ARC_INDUCE_TOOL_LOOP=selfparse and leave CARNOT_ARC_SUPERVISOR_TOOL_ARM unset. Keep the validated sampler settings and 4096 completion budget. Set CARNOT_ARC_INDUCE_N_CTX=49152 before proposer construction; validate actual KV allocation and free VRAM on the task-owned GPU. Do not raise induction token budgets or alter the curated arm table.
    5. Run exactly one fresh r11l session with seed 7206001, at most 4000 environment actions, a 3600-second session deadline and 2400-second induction-call deadline. Reserve 600 seconds for setup and 600 for validation within the 4800-second hard cap. The empirical induction cost is about 1500-1730 seconds. Target one or two new inductions if reached naturally; do not force ten into this task or reset repeatedly until a favorable outcome appears.
    6. Preserve induction IDs, raw completion hashes, terminal outcome, model-validity errors, individual tool-call names, counts and gap events. Trace the Exp7193 per-name aggregation loss before using its receipt reducer: the call total was six but the name map was empty. Derive both counts from the same actual event stream; if a correction is needed, scope it to the experiment receipt helper with a failing regression test. Never invent unknown names from the aggregate count.
    7. Merge authenticated historical receipts and all available current-milestone ARC session receipts by unique induction ID. Missing sibling output does not block this independent session. Record historical_tool_loop_inductions, new_tool_loop_inductions, cumulative_unique_inductions, evidence_target=10 and distinct session/seed counts. Do not count the same historical row twice. Ten is an operational collection target, not a statistical proof of absent tool demand. Report zero events as no observed demand, with the observed denominator and dependence limitations.
    8. Record banked levels and transient level transitions separately, plus world-model nondegeneracy and actions. solve_provenance=live_agent_self_discovery; new_solve_claimed=false and paired_efficacy_reported=false. Set arc_session_complete_score=1 after the scheduled terminal receipt exists, including an honest zero-induction or timed-out null. Do not claim tool engagement without real calls. Do not submit or alter the live default. A missing external model or lease is blocked; an executed low-quality session is null.
    9. Validate the changed scope with focused unit tests, Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on explicit changed test paths, using a private pytest basetemp. Meet applicable coverage requirements; do not edit protected checks or suppress real failures to pass. Run applicable E2E checks from ops/e2e-test-plan.md: E2E-009/010 for ARC plumbing, E2E-007 for memory/certificate and rollback paths, E2E-003/004 for compiled binding and serialization. For grounding, exercise public input -> actual compiler/extractor -> executor -> independently scored labels. For samplers, run law -> sampled trace -> independent quality calculation. For this planning handoff, exercise file -> parser -> real gate evaluator with /tmp validation fixtures. Run adversarial_verify.py and verdict_row_consistency_lint.py on the terminal artifact as applicable; retain exact command outputs and pre-existing failures separately. Reconcile driving specs, _bmad/traceability.md, ops/status.md and ops/changelog.md. Flush before and after validation and final atomic artifact write.

    10. REQUIRED ARTIFACT FIELDS:
       - field_principles: principle: "Echo the reason for each field beside its actual evidence."
       - status: principle: "Write a terminal artifact only after completion or a diagnosed external block."
       - run_date: principle: "Use {date}; do not substitute an upstream experiment date."
       - preconditions_checked: principle: "Record the actual resource, code and gate observations."
       - inference_substrate: principle: "Describe executed computation, not the intended workload."
       - inference_substrate_class: principle: "The actual operation determines its duration floor."
       - execution_venue: principle: "Use exactly host, kv260, gatemate or polarfire; these tasks execute on host."
       - execution_host: principle: "Put the actual hostname here, never inside execution_venue."
       - duration_s: principle: "Measure monotonic work time; do not pad it to pass a floor."
       - source_artifact_hashes: principle: "Bind source code, input data and frozen contracts to the claim."
       - rows: principle: "Keep unit_id, arm, seed, metric, error and abstention for each comparison; do not replace numeric rows with a task roster."
       - sample_size_budget: principle: "Retain planned, attempted, completed, censored and independent-unit counts."
       - random_seed: principle: "Freeze stochastic choices before held-out outcomes are read."
       - reproducibility_checksum: principle: "Hash the inputs, code, settings and raw rows."
       - gate_check_summary: principle: "Every blocked_* verdict names failed check, upstream, field, expected and observed value."
       - verifier_is_oracle: principle: "Same correctness authority remains circular even with a separate implementation."
       - verdict_class: principle: "Use exactly positive | circular_positive | null | blocked | disqualified | partial; only incomplete own work can be partial."
       - honest_verdict: principle: "Use complete_ or complete: for completed findings; blocked_* for external absence. Readiness is not scientific value."
       - arc_session_complete_score: principle: "A terminal scheduled session can honestly contain zero useful inductions."
       - solve_provenance: principle: "Use live_agent_self_discovery for the reachable policy path."
       - per_game_results: principle: "Keep the full session denominator, banked levels and action count."
       - tool_induction_rows: principle: "Unique IDs and per-name events prevent duplicated or lost tool evidence."
       - cumulative_induction_rows: principle: "Only authenticated distinct inductions count toward the cumulative target."
       - adapter_isolation_receipt: principle: "A withheld-adapter claim requires an observed policy access boundary."
       - new_solve_claimed: principle: "False because r11l has already been reproduced."
       - paired_efficacy_reported: principle: "False because the two new sessions are replication units, not causal arms."
       - MODEL_SPECS: principle: "Include the mandated Qwen3.8 GGUF for every LLM call."
       - model_invoked: principle: "Record whether generation actually occurred."
       - phase_spans: principle: "Separate loading, prefill, generation, parsing and verification costs."
       - gpu_receipts: principle: "Task-owned CUDA evidence must overlap actual model work."
       - model_identity_receipt: principle: "Record repository ID, revision, GGUF hash and actual runtime."
       - runner_receipt: principle: "Model count and execution runner explain compute allocation."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH=python JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_7206_v635_arc_volume_a.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
