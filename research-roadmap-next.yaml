  - id: exp2954
    milestone: "2026.05.278"
    deliverable: "results/experiment_2954_fr11_utility_gated_replay_curriculum_v2.json"
    title: "FR-11 Utility-Gated Replay Curriculum v2"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 60
    track: self_learning
    inference_substrate: aggregation_from_upstream_artifacts
    continuous_self_learning: true
    prior_failures:
      - experiment_id: exp2947
        verdict: "complete: nonuniform_continuation_replay_curriculum_piloted"
        addressed_by: "This continuation adds held-out utility, forgetting guard, and rollback semantics instead of only piloting nonuniform replay."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Run from {project_root} on {date}. research-program.md requires a
        continuous self-learning experiment. exp2947 piloted nonuniform replay,
        but did not prove held-out utility or rollback. This task tests whether
        verifier-weighted replay improves a held-out repair/verification slice
        without forgetting.

      EXISTING CODE TO READ FIRST:
        - research-program.md (Continuous Self-Learning section)
        - _bmad/prd.md (FR-11)
        - CLAUDE.md (FR-11 / inference substrate / authenticity rules)
        - results/experiment_2947_fr11_continuation_replay_curriculum_v1.json
        - results/experiment_2946_sota_code_generation_continuation_v1.json
        - results/experiment_2940_verifier_ensemble_auprc_code_corpora_v1.json

      TASK:
        Build an offline utility-gated replay policy that updates replay weights
        only when verifier-grounded held-out utility improves and rolls back when
        a forgetting guard fails. This is self-learning at the scheduler/memory
        layer, not closed-model weight retraining.

      CONCRETE STEPS:
        0. PRECONDITIONS: exp2947, exp2946, and exp2940 artifacts exist.
        1. Define train/replay and held-out slices from existing artifacts.
        2. Compare flat replay, nonuniform replay, and utility-gated replay.
        3. Use verifier outcomes and repair taxonomy as the reward/energy signal.
        4. Add a forgetting guard on a stable held-out slice; rollback any policy
           update that degrades it.
        5. Record whether utility-gated replay improves held-out utility over
           the .277 nonuniform pilot.
        6. Include a note on Soft-Radial Projection only as future design context
           for differentiable constraint-preserving adaptation.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        continuous_self_learning_task: true
        self_learning_utility_artifact_ready: bool
        source_artifacts: list
        replay_policies_compared: list
        heldout_utility_baseline: float
        heldout_utility_after: float
        heldout_utility_delta: float
        self_learning_utility_positive: bool
        forgetting_guard_metric_before: float
        forgetting_guard_metric_after: float
        forgetting_guard_passed: bool
        rollback_triggered: bool
        update_rule: object
        inference_substrate: "aggregation_from_upstream_artifacts"
        duration_s: float
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

