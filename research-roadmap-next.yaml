milestone: "2026.05.220"
milestone_title: "Dynamic EBCN Extraction, HILED, and Continuous Semantic Pruning"
milestone_doc: "openspec/change-proposals/research-roadmap-v220.md"
tasks:
  - id: exp2217-archive-and-activate
    title: "Phase 0: Archive .219 and activate .220"
    milestone: "2026.05.220"
    deliverable: "results/experiment_2217_archive.json"
    max_turns: 20
    prompt: |
      CONTEXT: Milestone 2026.05.219 has completed. We must prepare for 2026.05.220.
      EXISTING CODE TO READ FIRST: {project_root}/research-complete.yaml, {project_root}/research-roadmap.yaml
      TASK: Archive 2026.05.219 to research-complete.yaml and initialize the .220 milestone in ops/changelog.md.
      CONCRETE STEPS:
      1. Move all tasks from `research-roadmap.yaml` into `research-complete.yaml` under a new 2026.05.219 entry, setting completed date to {date}.
      2. Clear `research-roadmap.yaml` and copy the new milestone structure from `research-roadmap-next.yaml`.
      3. Add a "## {date} (Milestone 2026.05.220 Operational Retrospective)" stub in `ops/changelog.md`.
      4. Write deliverable to `results/experiment_2217_archive.json`.
      
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "The honest_verdict field MUST start with one of the terminal prefixes: complete: / complete_ / success: / success_ / passed: / passed_ / shipped: / shipped_."
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2218-jle-dynamic-elicitation
    title: "Phase 1: Joint Latent Energy Dynamic Constraint Elicitation"
    milestone: "2026.05.220"
    deliverable: "results/experiment_2218_jle_dce.json"
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: Legacy extraction is fragile. Joint Latent Energy and Dynamic Constraint Elicitation (JLE-DCE, arxiv:2605.16102) maps unstructured text to formal constraints dynamically using continuous latent EBM scoring.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/pipeline/extract.py, {project_root}/python/carnot/models/ebcn.py
      TASK: Implement JLE-DCE integration to parse prompts directly into EBCN State-Space formats.
      CONCRETE STEPS:
      1. Create a `python/carnot/pipeline/dynamic_extract.py` adapter.
      2. Implement a latent projection head mapping text embeddings to the structural coherence score defined in EBCN.
      3. Ensure MODEL_SPECS includes `unsloth/Qwen3.6-35B-A3B-GGUF` for the embedding extraction process.
      4. Write deliverable to `results/experiment_2218_jle_dce.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2219-sota-extraction-eval
    title: "Phase 1: Local SOTA Model Extraction Evaluation"
    milestone: "2026.05.220"
    deliverable: "results/experiment_2219_sota_extract.json"
    gated_on:
      - upstream: exp2218-jle-dynamic-elicitation
        artifact_field: honest_verdict
        op: "contains"
        value: "complete"
    prompt: |
      CONTEXT: We must verify the JLE-DCE extraction on flagship local GGUF models to ensure zero-false-accept logic constraints are formulated correctly before passing them to the verify-repair solver.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/pipeline/dynamic_extract.py, {project_root}/scripts/check_spec_coverage.py
      TASK: Evaluate extraction fidelity using `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF`.
      CONCRETE STEPS:
      1. Run the test suite for the dynamic extraction adapter against 10 sample unstructured rule prompts.
      2. Ensure constraint validation rate and false accept rate are recorded.
      3. Write deliverable to `results/experiment_2219_sota_extract.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2220-primal-dual-integration
    title: "Phase 1: Primal-Dual Decoding with JLE Constraints"
    milestone: "2026.05.220"
    deliverable: "results/experiment_2220_pd_integration.json"
    agent_type: "codex"
    model: "gpt-5.5"
    gated_on:
      - upstream: exp2219-sota-extraction-eval
        artifact_field: honest_verdict
        op: "contains"
        value: "complete"
    prompt: |
      CONTEXT: Combine the new dynamically elicited constraints with the Primal-Dual Guided Decoding pipeline from .219.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/guided_decoding.py
      TASK: Wire the dynamic extraction pipeline output to the Primal-Dual logit modification Lagrangian loop.
      CONCRETE STEPS:
      1. Modify `guided_decoding.py` to accept the new JLE structural tensors.
      2. Write deliverable to `results/experiment_2220_pd_integration.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2221-hiled-software-bridge
    title: "Phase 2: HILED PCIe/AXI Software Bridge Mock"
    milestone: "2026.05.220"
    deliverable: "results/experiment_2221_hiled_bridge.json"
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: We must offload the energy computation. Hardware-in-the-Loop Energy Decoding (HILED) requires an interface bridge to push the KAN array evaluation to hardware via AXI/PCIe.
      EXISTING CODE TO READ FIRST: {project_root}/hardware/kv260/, {project_root}/python/carnot/inference/guided_decoding.py
      TASK: Create a Python-to-C++-to-Hardware bridge (mocked for now) to simulate HILED latency.
      CONCRETE STEPS:
      1. Implement `python/carnot/hardware/hiled_bridge.py` establishing an asynchronous offload interface.
      2. Simulate a fixed latency penalty and check asynchronous non-blocking throughput.
      3. Write deliverable to `results/experiment_2221_hiled_bridge.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2222-kv260-hiled-deployment
    title: "Phase 2: KV260 Physical/Simulation Deployment Integration"
    milestone: "2026.05.220"
    deliverable: "results/experiment_2222_kv260_hiled.json"
    model: "opus"
    max_turns: 100
    gated_on:
      - upstream: exp2221-hiled-software-bridge
        artifact_field: honest_verdict
        op: "contains"
        value: "complete"
    prompt: |
      CONTEXT: The KANELÉ bitstream must process HILED requests. We need resilient integration code to interact with Vivado/KV260 simulations.
      EXISTING CODE TO READ FIRST: {project_root}/hardware/kv260/kanele_lut_array_v2.v
      TASK: Wire the KV260 Verilog simulation bindings to the HILED bridge.
      CONCRETE STEPS:
      0. PRECONDITIONS: Check `command -v yosys` and verify RTL logic paths.
      1. Compile the hardware-side receiver logic for energy scores.
      2. Record theoretical or simulated latency overhead for the hardware accounting ledger.
      3. Write deliverable to `results/experiment_2222_kv260_hiled.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2223-hiled-decoding-smoke
    title: "Phase 2: HILED Decoder Smoke Test"
    milestone: "2026.05.220"
