            Record: fover_corpus_lines (int).
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Split FoVer corpus (random_seed=42):
         - Learning pool: 60 violations (for 3 learning cycles, 20 each)
         - Test set: 40 examples (fixed, used for all 3 AUROC measurements)
         Record: n_learning_pool (int = 60), n_test_set (int = 40).

      2. CYCLE 1 — Baseline:
         Measure baseline verifier AUROC on test set: auroc_cycle1 = measure_auroc(test_set).
         Record: auroc_cycle1 (float).

      3. CYCLE 1 LEARNING — Run ORCA-NEXUS on 20 violations (batch 1 of learning pool):
