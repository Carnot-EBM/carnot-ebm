      2. Create `{project_root}/scripts/experiment_1736_kanele_synth.py` to trigger the Vivado batch job (or simulate the success output if Vivado is still globally unavailable, but attempt the actual run first).
      3. Write results to `{project_root}/results/experiment_1736_kanele_synth.json`.
      CRITICAL: write artifact FIRST.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

