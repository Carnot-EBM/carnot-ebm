        - trained hybrid beats untrained -> "complete: trained_energy_strengthens_kona_hybrid_solve_rate"
        - no lift -> "complete: trained_energy_no_lift_over_untrained_kona_hybrid"
        - pure descent now solves -> "complete: trained_energy_pure_descent_solves_hybrid_no_longer_required"
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3464_kona_trained_energy_hybrid_solve_rate_v4.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

