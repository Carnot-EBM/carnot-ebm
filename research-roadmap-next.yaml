- id: exp905-iterative-self-repair-v1
  milestone: 2026.04.70
  deliverable: results/experiment_905_iterative_self_repair_v1.json
  max_turns: 50
  prior_failures:
    - experiment_id: exp881-code-repair-v8-gemma4-live
      verdict: zero_constraints
      addressed_by: >
        Exp 881 (and 12 prior attempts) used ArithmeticExtractor with regex 'a+b=c' which
        never matches IT model natural-language responses. The new approach (arXiv 2604.10508)
        bypasses ArithmeticExtractor entirely: execute the generated code, feed the error
        traceback back to the LLM as a correction prompt, retry up to 3x, then use Carnot
        energy to select the best attempt. No constraint extraction needed.
      retire_if_same_verdict: false
  title: 'Exp 905: IterativeSelfRepair v1 — Execute-Feedback-Retry on 25 HumanEval Questions (GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Code repair has failed 12+ consecutive times due to ArithmeticExtractor
    using regex 'a+b=c' which never matches IT model natural-language responses (zero
    constraints extracted). The new approach (arXiv 2604.10508, Iterative Self-Repair)
    BYPASSES ArithmeticExtractor entirely. Instead: (1) generate code with LLM,
    (2) execute it in a sandbox, (3) if error: feed traceback back to LLM as correction
    prompt, (4) retry up to 3x, (5) Carnot energy selects best attempt.

    This approach requires no constraint extraction. The execution error IS the
    constraint signal. arXiv 2604.10508 showed +4.9pp to +17.1pp improvement on HumanEval
    and MBPP with this technique using GPT-4 and Claude 3. We implement for local Qwen3 MoE.

    EXISTING CODE TO READ FIRST:
    - results/experiment_881_code_repair_v8_gemma4_live.json — last failure: zero_constraints
    - python/carnot/verify/arithmetic_extractor.py — the broken extractor (DO NOT USE)
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline
    - python/carnot/samplers/ising_sampler.py — Ising energy scorer
    - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner
    - openspec/change-proposals/research-roadmap-v70.md — .70 Phase 1 design

    TASK: Implement IterativeSelfRepair pipeline. Run on 25 HumanEval questions.
    Use unsloth/Qwen3.6-35B-A3B-GGUF (llama.cpp, GPU). Measure signed_improvement
    vs baseline (first-attempt pass rate).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Create python/carnot/pipeline/iterative_self_repair.py:
       class IterativeSelfRepair:
         __init__(self, llm_runner, energy_scorer, max_retries: int = 3,
                  sandbox: bool = True):
           self.llm = llm_runner
           self.energy = energy_scorer
           self.max_retries = max_retries
           self.sandbox = sandbox
           self._attempt_log = []
         repair(self, problem: str, test_cases: list[str]) -> RepairResult:
           attempts = []
           response = self.llm.generate(problem)
           for i in range(self.max_retries + 1):
             exec_result = self._sandbox_exec(response, test_cases)
             score = self.energy.score(response)
             attempts.append(("attempt": i, "response": response,
                               "exec_passed": exec_result.passed,
                               "exec_error": exec_result.error,
                               "energy_score": score))
             if exec_result.passed:
               break
             if i < self.max_retries:
               correction_prompt = (
                 f"The following code had an error:\n(response)\n\n"
                 f"Error traceback:\n(exec_result.error)\n\n"
                 f"Fix the code to pass the tests.")
               response = self.llm.generate(correction_prompt)
           best = min(attempts, key=lambda a: a["energy_score"])
           return RepairResult(best_attempt=best, all_attempts=attempts,
                               n_retries=len(attempts)-1)
         _sandbox_exec(self, code: str, test_cases: list[str]) -> ExecResult:
           Use RestrictedPython or subprocess with timeout=10s.
           If CARNOT_USE_SANDBOX=1: use gVisor. Else: subprocess.
           Return ExecResult(passed=bool, error=str_or_None)
    3. Add spec entries: REQ-CODE-010 (IterativeSelfRepair pipeline),
       SCENARIO-CODE-010 (code repair retries with execution feedback until passing or budget).
    4. Create scripts/experiment_905_iterative_self_repair_v1.py:
       a. tmpl = ExperimentTemplate(905, "Iterative Self-Repair v1 — 25 HumanEval GPU",
                                     "results/experiment_905_iterative_self_repair_v1.json",
                                     requires_gpu=True)
       b. tmpl.setup()
       c. MODEL_SPECS = [("name": "Qwen3.6-35B-A3B-GGUF",
                           "hf_id": "unsloth/Qwen3.6-35B-A3B-GGUF", "gpu": 0)]
       d. gpu_status = tmpl.setup_gpu(MODEL_SPECS)
       e. Load 25 HumanEval questions from datasets or construct representative ones
          covering: basic functions, string manipulation, list operations, arithmetic.
       f. Baseline: measure first-attempt pass rate (attempt 0 only, no repair).
       g. Repair: run IterativeSelfRepair(max_retries=3) on all 25 questions.
       h. Compute:
          - baseline_pass_rate: fraction passing on first attempt
          - repair_pass_rate: fraction passing after iterative repair
          - signed_improvement: repair_pass_rate - baseline_pass_rate
          - mean_retries_needed: mean retries for repaired-passing questions
          - energy_selected_correctly: fraction where energy selected the passing attempt
       i. honest_verdict logic:
          if signed_improvement > 0.05: "improvement_significant_gate_open"
          elif signed_improvement > 0: "improvement_marginal_gate_open"
          else: "no_improvement_gate_blocked"
    5. Write tests with 100% coverage. Test IterativeSelfRepair retry logic.
       Test energy selection. Test sandbox execution. Traces to REQ-CODE-010.
    6. Write results/experiment_905_iterative_self_repair_v1.json.
    7. Update ops/changelog.md: one-line entry.
    8. tmpl.assert_deliverable_written() as final line.

    Run: CARNOT_USE_SANDBOX=0 .venv/bin/python scripts/experiment_905_iterative_self_repair_v1.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

