    \    principle: \"verifier_ensemble_against_cached_candidates (scores the energy over cached candidate\
    \ induced engines off-path predictions, no fresh LLM; 1s floor).\"\n  preconditions_checked:\n   \
    \ principle: \"records the arcade / WorldModelVerifier import checks so a silent-missing-resource\
    \ run cannot fabricate a cell_recall.\"\n  energy_selected_offpath_cell_recall:\n    principle: \"\
    the held-out off-path cell_recall of the engine the structural energy selected -- the load-bearing\
    \ measurement.\"\n  accuracy_gate_selected_offpath_cell_recall:\n    principle: \"the held-out off-path\
