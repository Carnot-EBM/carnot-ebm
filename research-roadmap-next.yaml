        verdict: "complete: null logit-energy unsupported-minus-supported delta=0.004811"
        addressed_by: "Different from Exp5263: no unsupported logits/attention claims are made; the diagnostic uses only per-token features actually exposed by Exp5353."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Run from {project_root} on {date}. This task runs only if Exp5353 proves real token-probability rows. `The Shape of Addition` suggests arithmetic carry is a useful tiny probe for token/internal slippage, but only as a bounded diagnostic.

      EXISTING CODE TO READ FIRST:
      - CODEX.md
      - CLAUDE.md
      - ops/exclusion_manifest.yaml
      - research-references.md
      - results/experiment_5353_tokenprob_feature_audit_corrigendum_v488.json
      - scripts/experiment_template.py
      - python/carnot
      - tests/python

      TASK:
      Run a tiny synthetic arithmetic carry diagnostic using only the token-probability features confirmed by Exp5353. Do not train a scorer or rerank generated text.

      Deliverable: `results/experiment_5354_arithmetic_carry_token_energy_v488.json`.

      CONCRETE STEPS:
      0. PRECONDITIONS: confirm Exp5353 `tokenprob_feature_rows_ready`, selected model/backend, GPU visibility, and no retired external-scorer scope.
      1. Define MODEL_SPECS in the artifact:
         - unsloth/Qwen3.6-35B-A3B-GGUF
         - unsloth/gemma-4-31B-it-GGUF
         - unsloth/gemma-4-26B-A4B-it-GGUF
      2. Build 12-20 deterministic addition prompts balanced across no-carry, single-carry, multi-carry, and perturbed-answer controls.
      3. Compute transparent token-energy features from available per-token rows only: answer-token negative logprob, carry-position contrast, perturbed-vs-correct margin, and missing-feature fallbacks.
      4. Report separability but do not claim broad hallucination detection or reasoning verification.
      5. Set `carry_token_energy_signal_ready` true only if every row is feature-complete, correct-vs-perturbed margin is positive, and unsafe false accepts are zero.

      REQUIRED ARTIFACT FIELDS:
