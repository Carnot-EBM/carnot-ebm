  - id: exp2318-ml-assisted-ising-init
    title: "Phase 3: ML-Assisted Ising Machine Initialization (arXiv:2503.23966) — NEW"
    milestone: "2026.05.227"
    deliverable: "results/experiment_2318_ml_ising_init.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2309-pretest-fix-completion
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prompt: |
      CONTEXT: arXiv:2503.23966 demonstrates that ML heuristics can dramatically reduce
      Ising machine convergence time by providing better initial spin configurations.
      The key insight: random initialization requires O(T_mix) Gibbs sweeps to reach the
      low-energy basin; a learned initializer (trained offline on similar problem distributions)
      can start near the basin, requiring only O(T_refine) sweeps where T_refine << T_mix.

      Carnot's parallel Ising sampler (parallel_ising.py) currently uses random spin
      initialization. This experiment implements and evaluates a lightweight ML-assisted
      initializer (no GPU needed — gradient-free, CPU-only) to measure convergence speedup.

      This is a new experiment (no prior attempts). First introduction of ML-assisted
      initialization into Carnot's hardware sampler stack.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/samplers/parallel_ising.py
        {project_root}/python/carnot/hardware/transpiler/
        {project_root}/scripts/experiment_template.py
      TASK: Implement and benchmark ML-assisted Ising initialization vs random initialization.
      CONCRETE STEPS:
        1. Create python/carnot/samplers/ml_ising_init.py implementing:
           class MLIsingInitializer:
             - __init__(n_spins: int, coupling_type: str)
             - fit(J: np.ndarray, h: np.ndarray, n_training_samples: int = 200)
               Learns a lightweight initialization policy from random restarts.
               Policy: for each spin, estimate the majority ground-state sign from
               the local field h_i + sum_j J_ij * mean_neighbor_sign.
             - initialize(J: np.ndarray, h: np.ndarray, random_seed: int) -> np.ndarray
               Returns initial spin configuration as {-1, +1}^n_spins.
        2. Write 2 unit tests in tests/python/samplers/test_ml_ising_init.py:
           Test 1: initialize() returns a valid {-1, +1} spin vector of correct shape.
           Test 2: on a ferromagnetic chain (J_ij = +1), ML initializer aligns spins better
                   than chance (majority_aligned_pct > 60%).
        3. Run unit tests; record n_tests_passed.
        4. Benchmark on 3 Ising problem sizes (random_seed=42 for J/h generation):
           Size 1: n=64 spins (dense J, max_degree=63)
           Size 2: n=128 spins (dense J)
           Size 3: n=256 spins (dense J)
           For each size:
             a. Fit the ML initializer (200 training samples).
             b. Run 50 convergence trials with ML initialization (T_ml sweeps to reach E_target).
             c. Run 50 convergence trials with random initialization (T_random sweeps).
             d. Measure convergence_speedup = T_random / T_ml.
             e. Measure final_energy_delta = mean(E_final_ml) - mean(E_final_random).
        5. Set ml_init_speedup_validated: true if convergence_speedup >= 1.5 on n=256 problem.
        6. Write deliverable to results/experiment_2318_ml_ising_init.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if benchmark ran to completion (speedup < 1.5 is an honest research finding)."
        - ml_init_speedup_validated:
            principle: "Boolean. True if convergence_speedup >= 1.5 at n=256; validates the ML-assisted initialization for KV260 RTL integration."
        - convergence_speedup_by_size:
            principle: "Per-size speedup ratio; records whether ML init scales with problem size."
        - final_energy_delta_by_size:
            principle: "Measures solution quality improvement (negative = ML init finds better solutions)."
        - n_tests_passed:
            principle: "Unit tests must pass; implementation quality gate."
        - module_path:
            principle: "Records where MLIsingInitializer was written for integration with parallel_ising.py."
        - random_seed:
            principle: "Must be 42 for J/h generation; reproducibility for convergence trials."
        - n_training_samples:
            principle: "Records policy training budget; must be 200 to match the task specification."

