milestone: 2026.06.405
milestone_title: "DEEPEN the one surviving oracle-distinct verifier vehicle -- the verifier-as-DETECTOR (exp4375, AUROC 0.918, beats chance where SELECTION headroom is ~0, verifier_is_oracle=false) -- from 'beats chance' into an ACTIONABLE capability: BiPRM-style bidirectional step-error LOCALIZATION + selective-prediction ABSTENTION (arXiv:2508.01682, the .404 SOTA-ingestion flagged_for_v405), with a twice-burned-operator skeptic-proof. Probe whether the detector GENERALIZES beyond FoVer (the domain-bound concern; north-star step 2) and whether it SELF-LEARNS / COMPOUNDS (the mandated continuous-self-learning slot, on the live vehicle). Drive the ARC north star DEEPER (operator MANDATORY 2026-06-17), augmented by Mind-Studio lookahead-fidelity (arXiv:2606.16070). .404 CLOSED two of three oracle-distinct vehicles: the EFFICIENCY moat is SETTLED (exp4370 LLM-heuristic clean null, linear near-optimal) and the in-generation DiffusionGemma moat is RETIRED (exp4374, 4th block). DETECTION is the one ALIVE vehicle. paper_ready=True (FoVer 0.9131, G1-G4)."
milestone_doc: openspec/change-proposals/research-roadmap-v405.md
milestone_overview: |
  .404 (exp4379 capstone, verifier_thesis_state: linear_settled_in_generation_retired_detector_positive) tested THREE
  vehicles for "the oracle-distinct verifier earns its place"; two closed, one is alive:
    - EFFICIENCY moat -> SETTLED. exp4370 LLM-generated-heuristic (arXiv:2503.18809) did NOT beat the deployed linear
      action-cost baseline (clean powered null, all tied at 646 held-out actions). The moat is REAL + DEPLOYED (exp4364,
      25->16, verifier_is_oracle=false) but the function class is settled -- no remaining headroom.
    - IN-GENERATION (DiffusionGemma) moat -> RETIRED (4th block). exp4374 retired_in_generation_conversion_unmeasurable
      (scorer irreparably leaky on the generation corpus + CoDiLA control could not differentiate the arms). OUT of the loop.
    - DETECTION -> POSITIVE (the live vehicle). exp4375 detector_auroc=0.918, CI95 lower 0.909, beats chance, n=8829,
      selection_headroom=0.0, verifier_is_oracle=false. The verifier DETECTS step-errors where it cannot SELECT.
    - ARC north star -> 34 reproducible levels / 17 games (lp85 +1 via exp4372; ar25/ka59/ft09 L2 still blocked).
    - paper_ready=True (G1-G4, FoVer 0.9131).
  The SOTA-ingestion (exp4376) flagged_for_v405 = biprm_processbench_detector_localization_v405. .405 takes the depth step:

    PHASE 0 -- TRANSITION: exp4380 archive .404 -> activate .405; record the TRUE close-state.

    PHASE A -- HEADLINE (oracle-distinct DETECTOR made ACTIONABLE; verifier_is_oracle=false):
      A1 (exp4381) BiPRM bidirectional step-error LOCALIZATION (arXiv:2508.01682) + selective-prediction ABSTENTION:
        L2R + R2L detector passes over the cached step-labeled FoVer corpus, FUSE, report earliest-error localization
        (ProcessBench-style, bidirectional vs unidirectional) + the risk-coverage / accuracy-vs-coverage operating point.
        Online-actor honesty: R2L uses future context -> bidirectional is OFFLINE post-hoc; keep a causal/L2R-only online
        number separate. Emit detector_localization_actionable BARE bool. Cheap, cached, CPU -- infra-independent.
      A2 (exp4382, GATED on A1 detector_localization_actionable==true) skeptic-proof: position/length bias? R2L
        future-context leak (online-invalid)? single-split overfit? Emit localization_win_is_genuine BARE bool.

    PHASE B -- ARC NORTH STAR (operator MANDATORY 2026-06-17; +1..+n per game; verifier_is_oracle=true):
      B1 (exp4383) E3 DEEPER high-headroom: lp85 L6 + tu93 L5 + tn36 L8 (program-editor control) + tr87 L7, augmented by
        Mind-Studio lookahead-fidelity (arXiv:2606.16070).
      B2 (exp4384) E3 BLOCKED-mechanic tails: ar25 L2 (action7 undo-stack) + ka59 L2 (step-counter HUD) + ft09 L2,
        active-data + lookahead (prior_failures: exp4373).

    PHASE C -- CONTINUOUS SELF-LEARNING (mandated; the DETECTOR compounds; verifier_is_oracle=false):
      exp4385 does the detector COMPOUND as labeled traces accumulate? (the exp4364 compounding-curve discipline, on the
        live detector vehicle). Emit detector_compounds BARE bool.

    PHASE D -- ORACLE-DISTINCT cross-domain DETECTION (complementary; cheap; verifier_is_oracle=false):
      exp4386 does detection GENERALIZE beyond FoVer to a NON-FoVer cached corpus (GAP-4 ARC / code / GSM8K)? Report
        detection AUROC vs selection-headroom per domain -- the divergence. Emit detector_generalizes_cross_domain BARE
        bool. NOT the retired cross-domain SELECTION axis (exp4314) -- DETECTION where selection headroom is ~0.

    PHASE E -- INFRA + HYGIENE + CAPSTONE: exp4387 SOTA-ingestion -> .406; exp4388 registry/gaps hygiene + GAP-4 guard;
      exp4389 KV260 continuity (opportunistic); exp4390 capstone .405 + the headline decision + G1-G4.

  HARD RULE (every task): conductor STOOD-DOWN on TRM training -- NO task launches TRM training, runs pkill/kill against
  train.py, or writes results/trm_runs/. Qwen FORBIDDEN as the TRAINED base (Spurious-Rewards confound); Qwen/Gemma GGUF
  as an off-policy judge/generator is fine. A2D2 (2606.13565) + SEPO (2502.01384) verifier-as-reward GENERATOR-training
  are OUT-OF-BAND/operator-owned (NOT auto-run). Every verifier-value task declares verifier_is_oracle honestly
  (Circularity Discipline): the detector/efficiency/detection-generalization claims are oracle-DISTINCT
  (verifier_is_oracle=false + matched control + CI95-excl-0); ARC E3 SOLVEs are execution-grounded
  (verifier_is_oracle=true, ARC progress NOT a moat headline). DiffusionGemma in-generation conversion is RETIRED (4th
  block, exp4374) -- do NOT re-propose. The LLM-generated-heuristic efficiency arm is SETTLED (exp4370 null) -- use only as
  a control, do NOT re-headline. NO autonomous edits to docs/index.html / README / paper prose. Online ARC play stays
  operator-gated (NO leaderboard submission; only offline-reproduced levels count). Cross-game value TRANSFER (exp4342) +
  cross-domain SELECTION (exp4314) are RETIRED -- do NOT re-propose either (Phase D is cross-domain DETECTION, distinct).
  paper_ready=True (FoVer 0.9131) is the FROZEN headline -- .405 adds LENSES, never a substitute.

