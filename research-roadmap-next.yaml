    track: "evidence"
    inference_substrate: "artifact_aggregation_only"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3270-teacher-label-shards-2-4-v1
        verdict: "complete: shard labels written with adversarial duration/methodology flags"
        addressed_by: "This task does not relabel shards. It audits provenance, duration, and headline eligibility so later results do not overstate .303 teacher-label evidence."
        retire_if_same_verdict: true
      - experiment_id: exp3272-full-corpus-assembly-leakage-audit-v1
        verdict: "complete: full corpus assembled with TAUTOLOGY/metadata flags requiring corrigendum"
