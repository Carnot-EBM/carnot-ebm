    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date: Exact producer identity, 2026.09.688 and {date}. Principle: Evidence belongs to its executing producer.
    - honest_verdict, verdict_class: Closed enum positive | circular_positive | null | blocked | disqualified | partial. Principle: External incompleteness is terminal blocked, not retriable partial.
    - flagged_adversarial: Actual terminal validator result. Principle: Flagged evidence cannot open a gate.
    - gate_check_summary: Every blocked_* or complete_blocked_* names upstream ID, path/hash, field, op, expected and observed values. Principle: Missing inputs differ from failed thresholds.
    - rows, sample_size_budget: Unit/arm/seed values plus intended, eligible, started, completed, failed, censored, excluded and independent counts. Principle: Every comparison must be recomputable.
    - acceptance_gate_results: Separate validity, readiness, calibration, decision benefit, retention and efficiency. Principle: Successful execution does not establish scientific benefit.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Monotonic spans and real code/config/data hashes. Principle: Never infer execution from model names.
    - source_artifact_hashes, preconditions_checked, resolved_imports: Exact paths, transitive hashes and exposure roles. Principle: Prior qualification requires current custody.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, coverage_statement_counts, historical_required_failures, repository_health: Actual argv/exits/deadlines/logs and affected files. Principle: Historical failures stay visible.
    - primary_resolution_receipt, terminal_validation_sidecar_path: Primary path/hash returned by actual readers; sidecars under results/raw/. Principle: A valid artifact must be the artifact the runtime reads.
    - verifier_is_oracle, claim_scope: Explicit circularity and exposed_development status. Principle: A reused development cohort cannot prove independent generalization.
    - inference_substrate, inference_substrate_class, execution_venue: Actual task compute and host venue. Principle: Workload determines the duration floor; a blocked no-run records the planned class separately.
    - MODEL_SPECS, model_specs, target_model, model_invocation_counts, trained_head_specs: Invoked pretrained models or empty lists and zero calls; fitted heads separately. Principle: Referenced models are not invoked models.
    - field_principles: Explain each task-owned field and gate. Principle: Fields preserve their scientific purpose.
    - hardware_evidence_ready_score: 1 for authenticated historical custody and all owned checks; independent of optional service data. Principle: Historical device evidence is not new board execution.
    - board_rows, terminal_receipt_hashes, changed_physical_receipts, workload_feasibility_rows, workload_attachment_operands, current_device_execution_count, hardware_speedup_claimed: Three board dispositions, zero current device operations and no speedup. Principle: Workload estimates cannot expand hardware scope.

