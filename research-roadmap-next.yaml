      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6377_v549_terminal_handoff_and_queue_preflight --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6378-v549-post-marker-source-scope-freeze
