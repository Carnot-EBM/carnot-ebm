milestone: "2026.05.216"
milestone_title: "FPGA Synthesis, KAN Continual Learning (KAN-CL), and Energy-Guided Decoding"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp2180-archive-and-activate
    title: "Phase 0: Archive .215 and activate .216"
    max_turns: 20
    prompt: |
      CONTEXT: Milestone 2026.05.215 has completed. We must prepare for 2026.05.216.
      EXISTING CODE TO READ FIRST: {project_root}/research-complete.yaml, {project_root}/research-roadmap.yaml
      TASK: Archive 2026.05.215 to research-complete.yaml and initialize the .216 milestone in ops/changelog.md.
      CONCRETE STEPS:
      1. Move all tasks from `research-roadmap.yaml` into `research-complete.yaml` under a new 2026.05.215 entry, setting completed date to {date}.
      2. Clear `research-roadmap.yaml` and copy the new milestone structure from `research-roadmap-next.yaml`.
      3. Add a "## {date} (Milestone 2026.05.216 Operational Retrospective)" stub in `ops/changelog.md`.
      4. Write deliverable to `results/experiment_2180_archive.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2181-kan-cl-regularization
    title: "Phase 1: KAN-CL Per-Knot Importance Regularization"
    max_turns: 50
    agent_type: "codex"
    prompt: |
      CONTEXT: Tier 3 continuous self-learning suffers from catastrophic forgetting. We must implement KAN-CL (arxiv:2605.12306) to anchor KAN spline knots based on their importance.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/models/substrate_kan.py
      TASK: Add a KAN-CL regularization loss term to the KAN parameter updates.
      CONCRETE STEPS:
      1. Modify `substrate_kan.py` to track the importance (Fisher information or similar metric) of each knot during training.
      2. Implement the per-knot anchoring loss constraint.
      3. Write deliverable to `results/experiment_2181_kan_cl.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2182-actfocus-token-reweighting
    title: "Phase 1: ActFocus Token-Level Energy Reweighting"
    max_turns: 50
    gated_on:
      - upstream: exp2181-kan-cl-regularization
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: The Action Bottleneck (arxiv:2605.14558) dilutes error signals across reasoning tokens. We need an ActFocus mechanism to upweight the loss on the specific action tokens that violate constraints.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/models/jepa_predictor.py
      TASK: Implement energy-based gradient redistribution in the JEPA predictor.
      CONCRETE STEPS:
      1. Update the loss function in `jepa_predictor.py` to apply ActFocus reweighting, identifying the boundary between reasoning and action tokens.
      2. Write deliverable to `results/experiment_2182_actfocus.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2183-energy-guided-decoding
    title: "Phase 2: Energy-Guided Decoding Integration"
    max_turns: 50
    prompt: |
      CONTEXT: To mitigate hallucination dynamically during generation (arxiv:2507.07731), we must implement Energy-Guided Decoding that selects hidden states minimizing the KAN energy score.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/guided_decoding.py
      TASK: Refactor guided decoding to directly poll the `substrate_kan.py` energy landscape.
      CONCRETE STEPS:
      1. Implement dynamic layer/state selection in `guided_decoding.py` based on the predicted energy.
      2. Write deliverable to `results/experiment_2183_guided_decoding.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2184-kv260-k5-rtl-design
    title: "Phase 3: KV260 k_max=5 Verilog RTL Design"
    max_turns: 100
    model: "opus"
    agent_type: "codex"
    prompt: |
      CONTEXT: In milestone .215 we established the k_max=5 architecture. Now we must write the Verilog.
      EXISTING CODE TO READ FIRST: {project_root}/hardware/kv260/ising_sampler_v4_spec.md
      TASK: Create `hardware/kv260/ising_sampler_v5.v` implementing the k_max=5 parallel PT-SB chains.
      CONCRETE STEPS:
      1. Create `hardware/kv260/ising_sampler_v5.v`.
      2. Ensure it strictly abides by the 5-connection limit for Manifold Substitution.
      3. Write deliverable to `results/experiment_2184_k5_rtl.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2185-oss-cad-suite-synthesis
    title: "Phase 3: OSS-CAD-Suite Hardware Synthesis"
    max_turns: 100
    model: "opus"
    gated_on:
      - upstream: exp2184-kv260-k5-rtl-design
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: We must verify that our new k_max=5 RTL actually fits on the KV260 by performing synthesis.
      EXISTING CODE TO READ FIRST: {project_root}/hardware/kv260/synth_ising.tcl
      TASK: Use `yosys` via the installed OSS-CAD-Suite to synthesize `ising_sampler_v5.v`.
      CONCRETE STEPS:
      1. Write a synthesis script for `yosys` targeting the v5 RTL.
      2. Verify the LUT/BRAM allocation fits within the KV260 limits (117K LUTs).
      3. Generate the artifact bitfile (or intermediate synthesis report).
      4. Write deliverable to `results/experiment_2185_synthesis.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2186-live-capstone-benchmark
    title: "Phase 4: Capstone Live GPU Benchmark"
    max_turns: 50
    gated_on:
      - upstream: exp2183-energy-guided-decoding
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: Final evaluation of KAN-CL, ActFocus, and Energy-Guided Decoding on live GPU.
      EXISTING CODE TO READ FIRST: {project_root}/scripts/benchmark_pipeline.py
      TASK: Run the pipeline benchmark on GSM8K using `unsloth/gemma-4-31B-it-GGUF`.
      CONCRETE STEPS:
      1. Ensure `CARNOT_FORCE_LIVE=1` is set.
      2. Run the evaluation and confirm `nonforgetting_rate` and `task_success_delta` are captured.
      3. Write deliverable to `results/experiment_2186_capstone.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2187-milestone-216-retro
    title: "Phase 4: Milestone 2026.05.216 Retrospective"
    max_turns: 20
    prompt: |
      CONTEXT: Conclude milestone .216.
      EXISTING CODE TO READ FIRST: {project_root}/ops/conductor-log.md
      TASK: Write the retrospective and update ops/status.md.
      CONCRETE STEPS:
      1. Summarize findings from experiments 2181 through 2186.
      2. Write deliverable to `results/experiment_2187_retro.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'