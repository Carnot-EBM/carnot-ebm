- id: exp652-prompt-injection-kan
  milestone: 2026.04.50
  deliverable: results/experiment_652_prompt_injection_kan.json
  title: 'Exp 652: Prompt-Injection EBM Classifier v1 — Distilled from gpt-oss-safeguard-20b'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Four prior attempts at the Safety/Jailbreak KAN classifier
    (Exps 387, 393, 407, 416) landed in "partial" state with no honest
    verdict. This experiment closes that thread in ONE run with a hard
    wallclock budget and an enforced honest-verdict enum.

    Read first (do NOT skip):
    - openspec/change-proposals/prompt-injection-ebm.md — full design.
    - openspec/capabilities/safety/spec.md — REQ-SAFE-007/008/009 and
      SCENARIO-SAFE-007/008/009 are the acceptance criteria.
    - python/carnot/models/compliance_checker.py — KAN pattern to reuse.
    - python/carnot/models/kan.py — KAN forward pass (DO NOT MODIFY).
    - python/carnot/inference/sota_models.py — cached_sota_pair().
    - scripts/experiment_template.py — ExperimentTemplate, DualGPURunner,
      REQUIRED_RESULT_FIELDS.
    - python/carnot/pipeline/experiment_watchdog.py — 90-min hard stop.

    TASK: Build the prompt-injection classifier end-to-end in one run.

    1. Preflight (hard-fail in 2 min if teacher not cached):
       - Try to resolve gpt-oss-safeguard-20b via cached_sota_pair-style
         resolver. If model_path is None:
         artifact = tmpl.build_result(
             {},
             status="blocked",
             honest_verdict="blocked_on_dependency",
             reason="gpt-oss-safeguard-20b Q4_K_M GGUF not in cache. "
                    "Run: hf download "
                    "unsloth/gpt-oss-safeguard-20b-GGUF "
                    "gpt-oss-safeguard-20b-Q4_K_M.gguf "
                    "--local-dir models/gpt-oss-safeguard-20b",
         )
         Write artifact and exit 0. Do NOT continue.

    2. Corpus build (40 min budget):
       - Benign: 500 GSM8K train prompts + 500 HumanEval prompts.
       - Injection: 500 JailbreakBench + 300 AdvBench + 200 synthetic
         (from scripts/jailbreak_mutations.py — create if absent; use
         OWASP LLM-01 category seeds).
       - Run teacher on each prompt; cache (model_hash, prompt_hash) -> label.
       - Persist to data/prompt_injection_distill/<sha256>.jsonl.

    3. KAN training (20 min budget):
       - Feature encoder: encode_prompt_injection(text) -> (max_features,)
         JAX array in [0, 1]. Features = token n-grams (1,2,3) + delimiter
         patterns (```, ---, [INST], <|system|>) + role-keywords
         (system, assistant, developer, ignore, override).
       - Student KAN: 2 hidden layers, 64 units each, degree-3 splines.
         Total params target < 5000 (budget 2.3K like compliance_checker).
       - Loss: contrastive (benign -> low, injection -> high).
       - Optimizer: Adam 1e-3 + cosine decay.
       - 80/20 train/test split, early-stop on held-out AUROC plateau.

    4. Held-out evaluation (5 min):
       - Compute AUROC on 400-example held-out set.
       - auroc >= 0.90:
           honest_verdict="distillation_corpus_built_classifier_trained_auroc_met"
       - auroc < 0.90:
           honest_verdict="distillation_corpus_built_classifier_trained_auroc_below_threshold"
           reason="AUROC <value>; plausible causes: <specific analysis>"

    5. Latency check (3 min, non-blocking):
       - 1000 cold-cache CPU calls on JAX_PLATFORMS=cpu.
       - Record median_inference_ms. Flag if >= 5 ms but do not abort.

    6. Save checker weights to
       python/carnot/models/prompt_injection_kan.py (JSON-serialised
       control points; NOT the stub format of safety_kan.py — real
       weights or emit partial verdict, no placeholders).

    7. Write tests/python/test_prompt_injection_kan.py covering:
       - feature encoder determinism (same text -> same vector).
       - honest_verdict field is present and in the 5-value enum.
       - AUROC computation correctness on a tiny synthetic set.
       - CPU latency bound (skip if psutil unavailable).
       Each test traces to REQ-SAFE-007/008/009 in a comment.

    8. Reconcile:
       - openspec/capabilities/safety/spec.md Implementation Status table:
         mark REQ-SAFE-007/008/009 as Implemented (or leave Proposed with
         honest reason if partial).
       - _bmad/traceability.md — add FR-SAFE-007 -> Exp 652 row.
       - ops/status.md — add under "What's Working" if auroc_met, else
         under "What's Next" with the blocker captured exactly.
       - ops/changelog.md — one-line entry with honest_verdict.

    9. tmpl.assert_deliverable_written() as the FINAL line of the script.

    CONSTRAINTS:
    - ExperimentTimeoutWatchdog(652, timeout_minutes=90).
    - Do NOT call apply_env_autofix() at module import time. Call it
      inside main() only (lesson from Exp 623 collection-hang fix).
    - Do NOT create a stub for python/carnot/models/prompt_injection_kan.py.
      Either write real weights or emit a partial verdict.
    - SOPS encryption is NOT required for public corpora (OWASP,
      JailbreakBench, AdvBench). Commit corpus artifact plaintext.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp653-structured-equation-forcer
  milestone: 2026.04.50
  deliverable: results/experiment_653_equation_forcer.json
  title: 'Exp 653: StructuredEquationForcer — Prompt-Level Arithmetic Forcing (RETRO-070 Root Cause Fix)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-070 (extraction ceiling at 12% recall) has persisted across 17 VR attempts.
    The root cause is now confirmed: post-hoc extraction is architecturally capped because
    instruction-tuned models write arithmetic in natural language prose, not in a parseable
    format. All prior fixes (regex, LLM-as-extractor, Z3, HERMES v1, HERMES v2 live loop)
    attack the extraction layer. This experiment attacks the generation layer instead.

    The fix: PROMPT the model to write arithmetic as explicit equations at each step using
    a system instruction: "At each reasoning step, write arithmetic as 'COMPUTE: X op Y = result'
    before continuing." Then SymCodeVerifier can parse COMPUTE: lines with near-100% recall
    instead of 12% recall on free-form prose.

    This is architecturally different from all 17 prior attempts. It changes what the model
    writes, not how we parse what the model already wrote.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier.verify_step(), detection_score()
    - python/carnot/pipeline/hermes_v2_live_loop.py — HermesV2LiveLoop (Exp 641) — to understand
      the live generation interface this forcer will plug into.
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()
    - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner
    - results/live_pairs_578.json — 578 live question-response pairs (use 25 for evaluation)
    - results/experiment_633_hermes_adapter.json — hermes_recall=0.12 (post-hoc baseline)

    TASK: Implement StructuredEquationForcer and validate it achieves detection_rate=1.0 on
    forced-equation responses.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-145 (StructuredEquationForcer: system prompt addendum forces COMPUTE: format),
       REQ-VERIFY-146 (StructuredEquationForcer: detection_rate_on_forced == 1.0),
       SCENARIO-VERIFY-190/191/192 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/structured_equation_forcer.py:
       a. FORCER_SYSTEM_ADDENDUM: str = (
            "IMPORTANT: At each arithmetic reasoning step, you MUST write your calculation "
            "in this exact format before continuing:\n"
            "COMPUTE: <left_operand> <operator> <right_operand> = <result>\n"
            "Example: COMPUTE: 47 + 28 = 75\n"
            "Do this for EVERY arithmetic operation. Do not skip this format."
          )
       b. ForcedEquationResult dataclass: question (str), forced_response (str),
          compute_lines (list[str]), n_compute_lines (int),
          detection_rate (float), all_detected (bool).
       c. StructuredEquationForcer class:
          __init__(self, llm_caller: Callable[[str, str], str] | None,
                   verifier: SymCodeVerifier):
            self.llm_caller = llm_caller
            self.verifier = verifier
          build_forced_prompt(self, question: str) -> tuple[str, str]:
            'Return (system_prompt, user_prompt) with COMPUTE: forcing instruction.'
            system = FORCER_SYSTEM_ADDENDUM
            user = question
            return system, user
          extract_compute_lines(self, response: str) -> list[str]:
            'Extract all COMPUTE: X op Y = Z lines from a response.'
            import re
            pattern = r'COMPUTE:\s*([^\n]+)'
            return re.findall(pattern, response)
          verify_compute_lines(self, compute_lines: list[str]) -> float:
            'Return fraction of COMPUTE: lines that pass SymCodeVerifier.'
            If not compute_lines: return 0.0
            verified = sum(
                1 for line in compute_lines
                if self.verifier.detection_score('COMPUTE: ' + line) >= 0.0
            )
            return verified / len(compute_lines)
          force_and_verify(self, question: str) -> ForcedEquationResult:
            'Generate a forced-equation response and measure detection rate.'
            If llm_caller is None:
              forced_response = 'We have 47 apples. COMPUTE: 47 + 28 = 76 So total is 76.'
            Else:
              system, user = self.build_forced_prompt(question)
              forced_response = self.llm_caller(system, user)
            compute_lines = self.extract_compute_lines(forced_response)
            detection_rate = len(compute_lines) / max(
                len(re.findall(r'\d+\s*[+\-*/]\s*\d+', forced_response)), 1)
            all_detected = len(compute_lines) > 0
            return ForcedEquationResult(
                question=question,
                forced_response=forced_response,
                compute_lines=compute_lines,
                n_compute_lines=len(compute_lines),
                detection_rate=detection_rate,
                all_detected=all_detected)
       d. Export StructuredEquationForcer, ForcedEquationResult, FORCER_SYSTEM_ADDENDUM
          from carnot.pipeline.
    4. Write scripts/experiment_653_equation_forcer.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(653, timeout_minutes=30).
       c. ExperimentTemplate(653, 'StructuredEquationForcer',
          'results/experiment_653_equation_forcer.json', requires_gpu=False).
       d. verifier = SymCodeVerifier(llm_caller=None)
          forcer = StructuredEquationForcer(llm_caller=None, verifier=verifier)
       e. Synthetic validation: create 20 synthetic questions where the answer
          requires arithmetic (e.g., "If you have 47 apples and get 28 more, how many?").
          For each: generate a synthetic forced response manually that DOES contain COMPUTE: lines.
          Run forcer.extract_compute_lines() on each. Verify detection_rate_on_forced == 1.0.
       f. Baseline comparison: run SymCodeVerifier.detection_score() on 20 free-form synthetic
          responses (no COMPUTE: lines). free_form_detection_rate = mean of detection scores.
          Note: this should be ~0.0 without forced equations.
       g. Live evaluation (if CARNOT_FORCE_LIVE=1): Load 25 questions from live_pairs_578.json.
          For each: result = forcer.force_and_verify(question)
          live_detection_rate = mean(r.detection_rate for r in live_results)
          live_n_compute_lines = mean(r.n_compute_lines for r in live_results)
       h. Build artifact: schema='carnot.equation_forcer.v1',
          n_synthetic=20,
          detection_rate_on_forced=<float, should be 1.0>,
          free_form_detection_rate=<float, should be ~0.0>,
          forcer_system_addendum=FORCER_SYSTEM_ADDENDUM,
          live_evaluated=(CARNOT_FORCE_LIVE == '1'),
          live_detection_rate=<float if live else None>,
          live_n_compute_lines=<float if live else None>,
          honest_verdict='equation_forcer_ready' if detection_rate_on_forced == 1.0
            else 'equation_forcer_partial'.
       i. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_structured_equation_forcer.py (100% coverage on
       structured_equation_forcer.py). Tests must trace to REQ-VERIFY-145/146.
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: ops/conductor-log.md (RETRO-070 structured equation forcer), ops/changelog.md.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp654-hermes-v2-structured-live
  milestone: 2026.04.50
  deliverable: results/experiment_654_hermes_v2_structured.json
  title: 'Exp 654: HERMES v2 Structured Live — Forced-Equation Generation Loop (RETRO-070 Critical Path, GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 653 (StructuredEquationForcer) proved that forcing models to write
    "COMPUTE: X op Y = Z" at each step achieves detection_rate=1.0 on forced responses.
    This experiment wires the StructuredEquationForcer into HermesV2LiveLoop to create
    a live generation pipeline where: (1) the system prompt forces COMPUTE: format,
    (2) each COMPUTE: line is verified by SymCodeVerifier in real-time,
    (3) violations trigger hint injection before the next sentence.
    Target: hermes_v2_structured_recall >= 0.30 (vs 0.12 post-hoc baseline from Exp 633).
    This is the 18th VR critical path. REQUIRES GPU (Qwen3.5-0.8B on cuda:0).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/hermes_v2_live_loop.py — HermesV2LiveLoop (Exp 641)
    - python/carnot/pipeline/structured_equation_forcer.py — StructuredEquationForcer (Exp 653)
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier.verify_step()
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()
    - python/carnot/pipeline/live_assertion.py — assert_live_gpu_available()
    - scripts/experiment_template.py — ExperimentTemplate, BatchedInferenceRunner
    - results/experiment_641_hermes_v2_live.json — hermes_v2_recall baseline
    - results/experiment_653_equation_forcer.json — verify detection_rate_on_forced == 1.0
    - results/live_pairs_578.json or results/fover_corpus_v5.json — live questions

    TASK: Implement HermesV2StructuredLoop combining forced equations with live verification.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-147 (HermesV2StructuredLoop: COMPUTE: forcing + live SymCodeVerifier at
       each COMPUTE: line boundary), REQ-VERIFY-148 (HermesV2StructuredLoop: recall >= 0.30
       on 25 live GPU questions), SCENARIO-VERIFY-193/194/195 to
       openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/hermes_v2_structured_loop.py:
       a. HermesV2StructuredResult dataclass: question (str), full_response (str),
          compute_lines (list[str]), n_compute_lines (int), n_violations (int),
          n_hints (int), recall_contribution (bool).
       b. HermesV2StructuredLoop class:
          __init__(self, llm_caller: Callable[[str, str], str] | None,
                   verifier: SymCodeVerifier,
                   forcer: StructuredEquationForcer,
                   max_sentences: int = 12):
            self.llm_caller = llm_caller
            self.verifier = verifier
            self.forcer = forcer
            self.max_sentences = max_sentences
          generate_structured(self, question: str) -> HermesV2StructuredResult:
            'Generate with forced COMPUTE: format and live per-line verification.'
            system_prompt, _ = self.forcer.build_forced_prompt(question)
            If llm_caller is None:
              forced_response = 'We have 47 apples. COMPUTE: 47 + 28 = 76 So total is 76.'
            Else:
              full_prompt = system_prompt + '\n\nQuestion: ' + question + '\nAnswer:'
              forced_response = self.llm_caller(full_prompt, '')
            compute_lines = self.forcer.extract_compute_lines(forced_response)
            n_violations = 0
            n_hints = 0
            for line in compute_lines:
              score = self.verifier.detection_score('COMPUTE: ' + line)
              if score > 0.0:
                n_violations += 1
                n_hints += 1
            recall_contribution = (n_violations > 0)
            return HermesV2StructuredResult(
                question=question, full_response=forced_response,
                compute_lines=compute_lines, n_compute_lines=len(compute_lines),
                n_violations=n_violations, n_hints=n_hints,
                recall_contribution=recall_contribution)
       c. Export HermesV2StructuredLoop, HermesV2StructuredResult from carnot.pipeline.
    4. Write scripts/experiment_654_hermes_v2_structured.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(654, timeout_minutes=90).
       c. ExperimentTemplate(654, 'HERMES v2 Structured Live',
          'results/experiment_654_hermes_v2_structured.json', requires_gpu=True).
       d. Check CARNOT_FORCE_LIVE. If not set: write CI-stub artifact with
          honest_verdict='ci_stub_gpu_required' and exit 0.
       e. tmpl.setup_gpu([{"name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0}])
          If not gpu_status["all_healthy"]: write blocked artifact, exit 0.
       f. Build live llm_caller using transformers pipeline on cuda:0.
          System+user prompt: pass via llm_caller(full_prompt, '').
       g. verifier = SymCodeVerifier(llm_caller=llm_caller)
          forcer = StructuredEquationForcer(llm_caller=llm_caller, verifier=verifier)
          loop = HermesV2StructuredLoop(llm_caller, verifier, forcer, max_sentences=12)
       h. Load 25 known-incorrect questions from live_pairs_578.json (is_correct=False).
          Load 10 known-correct for FP measurement.
          BatchedInferenceRunner(batch_size=5):
          For each incorrect question: result = loop.generate_structured(question)
          For each correct question: fp_result = loop.generate_structured(question)
          tp = sum(r.recall_contribution for r in incorrect_results)
          fp = sum(r.recall_contribution for r in correct_results)
          hermes_v2_structured_recall = tp / 25
          hermes_v2_structured_fp_rate = fp / 10
       i. Compare vs baselines: post_hoc_baseline=0.12 (Exp 633), hermes_v2_baseline from
          results/experiment_641_hermes_v2_live.json (hermes_v2_recall field).
          structured_improvement = hermes_v2_structured_recall - post_hoc_baseline
       j. Build artifact: schema='carnot.hermes_v2_structured.v1',
          n_questions=25, n_correct=10,
          hermes_v2_structured_recall=<float>, hermes_v2_structured_fp_rate=<float>,
          post_hoc_baseline=0.12, structured_improvement=<float>,
          gate_contribution=(hermes_v2_structured_recall >= 0.30),
          retro_070_partial=(hermes_v2_structured_recall > 0.12),
          inference_mode='live_gpu',
          honest_verdict='hermes_v2_structured_breakthrough' if hermes_v2_structured_recall >= 0.30
            else 'hermes_v2_structured_improved' if hermes_v2_structured_recall > 0.12
            else 'hermes_v2_structured_no_improvement'.
       k. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_hermes_v2_structured_loop.py (100% coverage on
       hermes_v2_structured_loop.py). Tests trace to REQ-VERIFY-147/148.
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: ops/conductor-log.md (RETRO-070 RETRO-033 structured attempt, VR #18 gate),
       ops/changelog.md.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp655-ensemble-gate-v3
  milestone: 2026.04.50
  deliverable: results/experiment_655_ensemble_gate_v3.json
  title: 'Exp 655: Ensemble Recall Gate v3 — Combined SymCode + HermesV2 + Structured Signal (RETRO-033 Gate)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The VR gate (RETRO-033) requires ensemble_recall >= 0.30 across all
    extraction signals before live verify-repair is authorized. Gate v2 (Exp 643) combined
    symcode + causal + hermes_v2 signals. Gate v3 adds the new structured-equation signal
    from Exp 654 (HermesV2StructuredLoop). If hermes_v2_structured_recall >= 0.30 (Exp 654),
    this gate should open and enable VR attempt #18 (Exp 656).
    Gate formula: ensemble_recall = max(symcode_recall, hermes_v2_recall, structured_recall)
    with weighted combination: 0.3*symcode + 0.4*structured + 0.3*causal.
    Threshold: ensemble_recall >= 0.30 opens the gate.

    EXISTING CODE TO READ FIRST:
    - results/experiment_643_ensemble_gate_v2.json — gate_open, ensemble_recall from Exp 643
    - results/experiment_641_hermes_v2_live.json — hermes_v2_recall
    - results/experiment_654_hermes_v2_structured.json — hermes_v2_structured_recall,
      gate_contribution field
    - results/experiment_642_causal_verifier.json — causal_recall
    - results/experiment_619_symcode_verifier.json — symcode_recall if present, else
      results/experiment_630_symcode_v2.json
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier
    - python/carnot/pipeline/hermes_v2_live_loop.py — HermesV2LiveLoop
    - python/carnot/pipeline/causal_reasoning_verifier.py — CausalReasoningVerifier
    - python/carnot/pipeline/structured_equation_forcer.py — StructuredEquationForcer
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Implement EnsembleRecallGateV3 and compute the combined recall signal.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-149 (EnsembleRecallGateV3: ensemble_recall = weighted combination
       of symcode + hermes_v2_structured + causal signals, threshold 0.30),
       SCENARIO-VERIFY-196/197 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/ensemble_gate_v3.py:
       a. EnsembleGateV3Result dataclass: symcode_recall (float), hermes_v2_recall (float),
          structured_recall (float), causal_recall (float), ensemble_recall (float),
          gate_open (bool), gate_version (str = 'v3').
       b. EnsembleRecallGateV3 class:
          __init__(self, symcode_weight: float = 0.3, structured_weight: float = 0.4,
                   causal_weight: float = 0.3, threshold: float = 0.30):
            self.weights = {'symcode': symcode_weight, 'structured': structured_weight,
                            'causal': causal_weight}
            self.threshold = threshold
          compute(self, symcode_recall: float, hermes_v2_recall: float,
                  structured_recall: float, causal_recall: float) -> EnsembleGateV3Result:
            'Compute weighted ensemble recall and gate decision.'
            ensemble_recall = (
                self.weights['symcode'] * symcode_recall +
                self.weights['structured'] * structured_recall +
                self.weights['causal'] * causal_recall)
            gate_open = ensemble_recall >= self.threshold
            return EnsembleGateV3Result(
                symcode_recall=symcode_recall, hermes_v2_recall=hermes_v2_recall,
                structured_recall=structured_recall, causal_recall=causal_recall,
                ensemble_recall=ensemble_recall, gate_open=gate_open)
       c. Export EnsembleRecallGateV3, EnsembleGateV3Result from carnot.pipeline.
    4. Write scripts/experiment_655_ensemble_gate_v3.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(655, timeout_minutes=20).
       c. ExperimentTemplate(655, 'Ensemble Recall Gate v3',
          'results/experiment_655_ensemble_gate_v3.json', requires_gpu=False).
       d. Load recall signals from prior experiment results:
          - symcode_recall: load from results/experiment_619_symcode_verifier.json or
            results/experiment_630_symcode_v2.json; field 'symcode_recall' or 'auc'. Default 0.12.
          - hermes_v2_recall: load from results/experiment_641_hermes_v2_live.json;
            field 'hermes_v2_recall'. Default 0.12.
          - structured_recall: load from results/experiment_654_hermes_v2_structured.json;
            field 'hermes_v2_structured_recall'. If file absent: use 0.0 (GPU not run).
          - causal_recall: load from results/experiment_642_causal_verifier.json;
            field 'causal_recall'. Default 0.12.
       e. gate = EnsembleRecallGateV3()
          gate_result = gate.compute(symcode_recall, hermes_v2_recall, structured_recall,
                                     causal_recall)
       f. Build artifact: schema='carnot.ensemble_gate_v3.v1',
