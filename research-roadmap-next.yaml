        'shipped:' (or 'blocked_kv260_ssh_unreachable' if precondition failed)
        principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
      - kv260_synthesis_succeeded: bool
        principle: "Primary TERMINAL gate: True if UIO latency measured and physically plausible (< 1ms)."
      - kv260_terminal: bool
        principle: "Matches kv260_synthesis_succeeded — per CLAUDE.md terminal-state graduation criteria."
      - kv260_latency_mean_us: float
        principle: "Primary latency metric — mean UIO register read latency in microseconds."
      - kv260_latency_std_us: float
        principle: "Latency consistency — low std = deterministic hardware timing."
      - kv260_latency_min_us: float
        principle: "Best-case latency — useful for paper-v6 hardware performance table."
      - kv260_latency_max_us: float
        principle: "Worst-case latency — reveals jitter from OS scheduling on the board."
      - n_cycles_measured: int — 100
