  - id: exp3069-solver-verifier-failure-autopsy-protocol
    milestone: "2026.05.287"
    deliverable: "results/experiment_3069_solver_verifier_failure_autopsy_protocol_v1.json"
    title: "Solver-verifier failure autopsy and recovery protocol"
    priority: critical
    max_turns: 40
    estimated_wall_time_min: 35
    track: "verification"
    inference_substrate: "aggregation"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3057-local-sota-solution-verifier-gain-panel
        verdict: "complete: solution_verifier_calibration_ready=true; verifier_gain_delta=-0.125; false_negative_rate=1.0"
        addressed_by: "Diagnoses why the local SOTA verifier panel reduced accuracy before proposing another verifier-gain or repair rerun."
        retire_if_same_verdict: true
      - experiment_id: exp3058-aquaforte-style-llm-guided-smt-pilot
        verdict: "complete: llm_guided_smt_pilot_ready=true; guided_success_count=6; solver_only_success_count=6"
        addressed_by: "Adds calibration and correction-feedback criteria instead of treating no-lift SMT guidance as promotable."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. The .286 verifier panel produced negative verifier gain and the LLM-guided SMT pilot matched solver-only success. This task is protocol/autopsy work and must not run live LLM inference.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3057_local_sota_solution_verifier_gain_panel_v1.json
      - results/experiment_3058_aquaforte_style_llm_guided_smt_pilot_v1.json
      - results/experiment_3065_cross_corpus_matrix_v20.json
      - results/experiment_3066_capstone_v286.json
      - research-references.md

      TASK
      Write a failure autopsy and recovery protocol for local SOTA verifier calibration before repair or SMT guidance can be promoted.

      CONCRETE STEPS
      1. Extract the exp3057 and exp3058 metrics and classify the failure modes: false negatives, no verifier gain, no SMT lift, self-verification risk, and solver-only equivalence.
      2. Translate the new research references into local diagnostics: first-token entropy, abstention precision, rejection recall, confidence coverage, Lyapunov-style perturbation sensitivity if accessible, and VERGE/MCS feedback.
      3. Define disqualifiers for exp3070, exp3071, exp3072, and exp3075.
      4. Define minimum artifact fields and exact-solver authority requirements for a bounded verifier-gain recovery.
      5. Set verifier_failure_autopsy_ready=true only if the next experiments can consume the protocol directly.

      REQUIRED ARTIFACT FIELDS:
      - verifier_failure_autopsy_ready: bool (principle: failed verifier gain must be explained before rerun)
      - root_cause_hypotheses: list (principle: failure modes must be explicit)
      - recovery_protocol: dict (principle: next experiments must have concrete acceptance fields)
      - abstention_policy: dict (principle: uncertain cases must not be forced into accept/reject)
      - candidate_signals: list (principle: confidence diagnostics must be predeclared)
      - promotion_disqualifiers: list (principle: bad calibration must block repair)
      - source_artifacts: list (principle: autopsy must trace to concrete results)
      - inference_substrate: dict (principle: protocol work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3070-first-token-abstention-sota-panel
    milestone: "2026.05.287"
    deliverable: "results/experiment_3070_first_token_abstention_sota_panel_v1.json"
    title: "First-token entropy and abstention SOTA panel"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 90
    track: "verification"
    inference_substrate: "local_sota_gguf_logprob"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3057-local-sota-solution-verifier-gain-panel
        verdict: "complete: verifier_gain_delta=-0.125; false_positive_rate=0.0; false_negative_rate=1.0"
        addressed_by: "Changes the method by measuring first-token entropy, abstention coverage, and calibrated acceptance before any verifier-selected repair run."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Recent work suggests first-token entropy and calibrated abstention can detect hallucination risk. This task measures whether those signals repair the negative .286 verifier result on tiny exact-labeled fixtures.

      MODEL_SPECS
      Headline SOTA local GGUF candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Use at least one of these for live LLM scoring or generation. Legacy small models are allowed only as legacy_smoke_only=true CPU smoke tests and cannot satisfy first_token_panel_ready.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - python/carnot/inference/sota_models.py
      - results/experiment_3057_local_sota_solution_verifier_gain_panel_v1.json
      - results/experiment_3069_solver_verifier_failure_autopsy_protocol_v1.json
      - research-references.md

      TASK
      Run a tiny local SOTA panel that records first-token/logprob confidence, abstention, and exact-label agreement on verifier fixtures.

      CONCRETE STEPS
      0. PRECONDITIONS: record CUDA availability, GPU memory, GGUF cache paths, model IDs, quantization, seeds, prompt hashes, decode settings, logprob support, and wall-clock duration. If no mandated GGUF can load or no confidence signal can be captured, write blocked_sota_confidence_unavailable and stop.
      1. Reuse the exp3057 exact-labeled fixtures or rebuild 6-12 deterministic SAT/SMT-style fixtures with known valid/invalid outcomes.
      2. Use at least one mandated local GGUF to score candidate solutions. Capture first-token entropy or the closest available confidence proxy and record the limitation if true logprobs are unavailable.
      3. Define an abstention threshold from only the calibration split, then evaluate on a held-out tiny split.
      4. Report acceptance precision, rejection recall, abstention coverage, false positives, false negatives, and whether confidence improves verifier selection versus exp3057.
      5. Set first_token_panel_ready=true only if exact labels, model_specs, confidence fields, and abstention metrics are non-vacuous.

      REQUIRED ARTIFACT FIELDS:
      - first_token_panel_ready: bool (principle: downstream gates need a calibrated confidence artifact)
      - confidence_signal: str (principle: first-token entropy or proxy must be explicit)
      - first_token_auc: float (principle: confidence discrimination must be numeric)
      - abstention_precision: float (principle: accepted cases must be reliable)
      - rejection_recall: float (principle: bad cases must be caught)
      - abstention_coverage: float (principle: withheld cases must be counted)
      - verifier_gain_delta_with_abstention: float (principle: confidence must improve selection, not just produce scores)
      - false_positive_rate: float (principle: unsafe accepts must be visible)
      - false_negative_rate: float (principle: unsafe rejects must be visible)
      - exact_ground_truth_count: int (principle: labels must be exact)
      - models_used: list (principle: mandated GGUF use must be auditable)
      - model_specs: list (principle: live LLM evidence must name exact model IDs and cache/runtime paths)
      - legacy_smoke_only_used: bool (principle: tiny models cannot become headline evidence)
      - prompt_hashes: list (principle: inputs must be auditable without embedding full prompts)
      - inference_substrate: dict (principle: local GGUF evidence must declare hardware, runtime, cache, and confidence support)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3071-verge-mcs-smt-correction-pilot
    milestone: "2026.05.287"
    deliverable: "results/experiment_3071_verge_mcs_smt_correction_pilot_v1.json"
    title: "VERGE/MCS SMT correction feedback pilot"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 90
    track: "verification"
    inference_substrate: "local_sota_gguf_plus_exact_solver"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3058-aquaforte-style-llm-guided-smt-pilot
        verdict: "complete: llm_guided_smt_pilot_ready=true; formal_fallback_preserved=true; guided_success_count=6; solver_only_success_count=6"
        addressed_by: "Changes the guidance channel from proposal-only SMT to formal correction subset feedback while preserving solver authority."
        retire_if_same_verdict: true
      - experiment_id: exp3044-smt-sat-validator-tree-exactness-upgrade
        verdict: "complete: validator_tree_exactness_ready=true; verified=1; unresolved=1; fallback_only=1; correction_sets=1"
        addressed_by: "Uses the correction-set lineage directly rather than only counting verified/unresolved cases."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. VERGE-style formal feedback suggests using minimal correction subsets or refinement information to guide the model while exact solvers remain authority.

      MODEL_SPECS
      Headline SOTA local GGUF candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Use at least one of these for live LLM proposal or repair of SMT encodings. Legacy small models are allowed only as legacy_smoke_only=true CPU smoke tests and cannot satisfy mcs_feedback_ready.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3044_smt_sat_validator_tree_exactness_upgrade_v1.json
      - results/experiment_3058_aquaforte_style_llm_guided_smt_pilot_v1.json
      - results/experiment_3069_solver_verifier_failure_autopsy_protocol_v1.json
      - python/carnot/verification if present
      - tests/python relevant to SMT/SAT behavior
      - research-references.md

      TASK
      Run a tiny correction-feedback pilot where exact solvers produce MCS/refinement signals and a mandated local GGUF proposes a corrected candidate.

      CONCRETE STEPS
      0. PRECONDITIONS: confirm exact solver tooling is available and at least one mandated GGUF can load. If not, write blocked_solver_or_sota_unavailable and stop.
      1. Select 4-8 tiny fixtures where a candidate can be invalid, overconstrained, underconstrained, or corrected by a small subset/refinement signal.
      2. Generate exact correction feedback using an existing validator, a small Z3 script, or a documented fallback approximation. Record the exact path.
      3. Ask the mandated local GGUF to propose a corrected candidate using only the correction feedback, with prompt hashes and decode settings recorded.
      4. Validate every corrected candidate with the exact solver and compare against solver-only fallback.
      5. Set mcs_feedback_ready=true only if correction feedback and exact validation are both non-vacuous.

      REQUIRED ARTIFACT FIELDS:
      - mcs_feedback_ready: bool (principle: formal correction feedback must be available before gated calibration)
      - formal_fallback_preserved: bool (principle: LLM guidance must not replace solver authority)
      - mcs_count: int (principle: correction feedback must be counted)
      - guided_success_count: int (principle: LLM-guided correction benefit must be measured)
      - solver_only_success_count: int (principle: exact baseline must be measured)
      - invalid_llm_proposal_count: int (principle: proposal failures must be visible)
      - correction_subset_useful_count: int (principle: correction signals must show utility)
      - exact_solver_path: str (principle: authority implementation must be explicit)
      - models_used: list (principle: mandated GGUF use must be auditable)
      - model_specs: list (principle: live LLM evidence must name exact model IDs and cache/runtime paths)
      - legacy_smoke_only_used: bool (principle: tiny models cannot become headline evidence)
      - prompt_hashes: list (principle: inputs must be auditable without embedding full prompts)
      - inference_substrate: dict (principle: local GGUF plus exact solver evidence must declare both runtimes)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3072-gated-local-sota-verifier-calibration-v2
    milestone: "2026.05.287"
