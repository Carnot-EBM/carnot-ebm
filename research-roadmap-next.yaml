    verdict: 'complete: tier0r_auroc=0.9123 (different verifier — Curry-Howard, not
      logical consistency)'
    addressed_by: "exp2504 was Tier 0r Curry-Howard — a type-theoretic verifier. Tier
      0u (this task) is structurally different: it tests logical consistency between
      a response and the model's own self-check, following arXiv:2605.03971 (Logical
      Consistency as a Bridge, May 2026). Different theoretical foundation, different
      implementation, different group placement. Not a rerun of exp2504."
    retire_if_same_verdict: false
  prompt: "CONTEXT: New arxiv finding from Post-.243 planning sweep: arXiv:2605.03971
    'Logical Consistency as a Bridge: Improving LLM Hallucination Detection via Label
    Constraint Modeling' (May 2026). This paper uses self-consistency constraints
    — checking whether a model's response is logically consistent with the model's
    own self-check verification — achieving 4.7pp improvement over LLM-judge baselines
    on FaithDial and HaluEval.\n\nFor Carnot: Tier 0u computes a self-consistency
    score: given a response, simulate what the model would say if asked 'does this
    response contain any arithmetic or logical errors?' and check whether the self-check
    verdict is consistent with the response's internal claims. The score reflects
    cross-check consistency (low score = high self-inconsistency = likely hallucination).\n\nPractical
    approximation (no live LLM call needed): pattern-match the response for self-referential
    consistency signals:\n  - Does the response contain explicit self-corrections ('I
    made an error', 'actually', 'wait')? → inconsistency signal\n  - Do the final
    answer and intermediate steps agree? → check final number matches last computed
    value\n  - Are there contradiction markers ('but', 'however', 'yet') near numerical
    claims? → inconsistency signal\nScore = weighted count of self-inconsistency markers
    / total claims\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/tier0r_curry_howard.py
    (Tier0rVerifier interface — follow this pattern)\n  {project_root}/python/carnot/verify/semantic_energy.py
    (BaseVerifier interface)\n  {project_root}/results/experiment_2522_halluguard_tier0s.json
    (HalluGuard eval corpus — reuse if available)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE
    STEPS:\n  0. PRECONDITIONS:\n     a. Verify carnot.verify imports work:\n        python3
    -c \"from carnot.verify.tier0r_curry_howard import Tier0rVerifier; print('ok')\"\n
    \       If fails: write honest_verdict blocked_carnot_import_failed and exit.\n
    \    b. Find evaluation corpus (reuse from exp2522 or earlier if available):\n
    \       ls {project_root}/results/experiment_2522_halluguard_tier0s.json 2>/dev/null
    || echo 'will generate synthetic'\n  1. Implement Tier0uVerifier in python/carnot/verify/tier0u_logical_consistency.py:\n
    \    class Tier0uVerifier:\n       def score(self, response: str) -> float:\n
    \          '''Returns self-inconsistency score in [0,1]; 0=consistent, 1=fully
    inconsistent.'''\n       Key signals to check:\n         - Self-correction phrases:
    'actually', 'wait', 'I made an error', 'let me redo'\n         - Contradiction
    markers near numbers: 'but', 'however', 'yet' within 10 tokens of a number\n
    \        - Final answer vs intermediate steps mismatch (regex final number != last
