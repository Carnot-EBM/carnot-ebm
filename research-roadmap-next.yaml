  - id: exp3140-repair-gate-unlock-decision
    milestone: "2026.05.292"
    deliverable: "results/experiment_3140_repair_gate_unlock_decision_v1.json"
    title: "Repair gate unlock decision"
    priority: critical
    max_turns: 30
    estimated_wall_time_min: 30
    track: "repair"
    inference_substrate: "aggregation_and_policy"
    requires_gpu: false
    gated_on:
      - upstream: exp3139-live-sota-verifier-rerun-v7
        artifact_field: live_verifier_rerun_v7_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3127-multi-turn-monitored-repair-ladder-v1
        verdict: "blocked_gate_check_failed"
        addressed_by: "Adds an explicit repair-gate decision artifact between verifier rerun and repair execution so downstream repair can skip without a model call."
        retire_if_same_verdict: true
      - experiment_id: exp3124-difficulty-stratified-live-sota-verifier-panel-v6
        verdict: "complete_blocked_false_accept: false_accept_rate=0.5; live_call_count=6; headline_claim_allowed=false"
        addressed_by: "Consumes the rerun false-accept gate instead of using the blocked .291 verifier result."
        retire_if_same_verdict: true
      - experiment_id: exp3115-explicit-repair-gate-micro-panel-v4
        verdict: "complete: explicit_repair_gate_micro_panel_v4_ready=true; repair_success_delta=0.0; false_repair_accept_rate=0.0; intent_preservation_rate=0.0"
        addressed_by: "Separates gate unlock from repair measurement and keeps zero-delta repair history visible."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .291 repair was correctly gate-blocked by live verifier false accepts. This task decides whether the .292 verifier rerun is safe enough to spend live repair calls.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3139_live_sota_verifier_rerun_v7.json
      - results/experiment_3137_exact_safe_accept_abstain_contract_v1.json
      - results/experiment_3126_fragment_time_monitor_satisfiable_drift_audit_v1.json
      - results/experiment_3125_prefix_closed_deterministic_verifier_bound_pilot_v1.json
      - results/experiment_3115_explicit_repair_gate_micro_panel_v4.json

      TASK
      Write a repair-gate unlock decision artifact. It must be conservative: if false accepts are not below gate, repair stays blocked.

      CONCRETE STEPS
      1. Load the verifier rerun, acceptance contract, monitor, prefix-bound, and prior repair micro-panel artifacts.
      2. Apply gate criteria: false_accept_rate <= 0.10, regression_rows_included=true, known false accepts blocked, exact labels present, ledger replay available, and no headline-claim disqualifier.
      3. Set repair_gate_state to unblocked, blocked_false_accept, blocked_missing_live_model, blocked_missing_exact_labels, or blocked_other.
      4. If unblocked, list repair rows and constraints; if blocked, list exact blockers and avoid calling models.
      5. Write only the decision artifact.

      REQUIRED ARTIFACT FIELDS:
      - repair_gate_decision_v1_ready: bool (principle: repair execution must be explicitly gated)
      - repair_gate_state: str (principle: conductor should gate on one field)
      - false_accept_rate: float (principle: central blocker must be carried forward)
      - false_accept_gate_passed: bool (principle: repair cannot run if false accepts remain high)
