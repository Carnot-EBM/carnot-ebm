  - id: exp6274-asp-energy-semantic-compiler
    milestone: "2026.08.541"
    deliverable: results/experiment_6274_asp_energy_semantic_compiler.json
    title: "Bounded ASP-to-energy semantic compiler with independent exact parity"
    priority: critical
    track: constraint_semantics
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6273-v541-post-marker-source-scope-freeze
    prior_failures:
      - experiment_id: exp5714-one-axis-tempering-rust-parity
        verdict: "complete: one-axis corrected-cDLS Rust/Python parity is exact within frozen tolerances; portability only, no speed claim"
        addressed_by: "This task is not another sampler parity test. It builds a new ASP semantic compiler and checks answer-set conformance against an independent solver across five constraint families."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Carnot has exact validators and many energy components, but it lacks one executable declarative bridge for non-monotonic constraints. arXiv:2607.08136 combines ASP semantics with energy-based learning. V541 uses a narrower local goal: a bounded, inspectable ASP-to-energy compiler checked against an independent exact solver. This task consumes trusted formal fixtures. It does not consume model-authored theories.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md V541 ASP entries
      - {project_root}/openspec/capabilities/constraint-verification/spec.md
      - {project_root}/openspec/capabilities/verification/spec.md
      - {project_root}/python/carnot/verify/constraint.py
      - {project_root}/python/carnot/pipeline/constraint_graph_builder.py
      - {project_root}/python/carnot/models/ebrm_sampler.py
      - {project_root}/python/carnot/eval/cctu_executable_constraint_microbenchmark.py
      - {project_root}/tests/python/test_constraint_generation.py
      - {project_root}/ops/e2e-test-plan.md

      TASK
      Implement a bounded ASP semantic compiler. Support ground facts, grounded normal rules, default negation, integrity constraints, and bounded cardinality constraints. Emit inspectable energy terms and per-rule violation receipts. Compare every state with an independent ASP solver. Use at least 40 exact fixtures across graph coloring, scheduling, non-monotonic defaults, contradictions, and positive or negative controls. Do not train a model. Do not make an oracle-distinct verifier claim.

      Required deliverable: {project_root}/results/experiment_6274_asp_energy_semantic_compiler.json.
      REQUIRED ARTIFACT FIELDS: status, paper_source_and_claim_boundary, supported_asp_subset, unsupported_constructs_and_fail_closed_behavior, compiler_source_paths_and_hashes, independent_solver_name_version_and_receipt, fixture_manifest_path_and_hash, fixture_family_counts, fixture_count, exact_state_count_by_fixture, asp_theory_hash_by_fixture, energy_term_decomposition_by_fixture, solver_answer_sets_by_fixture, zero_energy_states_by_fixture, semantic_parity_by_fixture, per_rule_violation_localization, contradiction_controls, default_negation_controls, cardinality_controls, label_permutation_controls, unsupported_syntax_controls, parity_failure_count, oracle_claim_boundary, asp_energy_semantic_ready_score, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, random_seed, reproducibility_checksum, honest_verdict. fixture_count must be at least 40. parity_failure_count must be a bare integer. verifier_is_oracle must be true. field_principles must give one short principle for every required field.

      CONCRETE STEPS
      0. PRECONDITIONS: record git status, Python and solver versions, dependency state, size bounds, exact tolerances, seed, and protected hashes.
      1. Add REQ-CONSTRAINT-6274 and scenarios to openspec/capabilities/constraint-verification/spec.md before implementation. Update traceability.
      2. Add the smallest ASP module under python/carnot/. Keep the accepted grammar explicit. Reject unsupported syntax before energy construction.
      3. Build at least eight fixtures per required family. Bound every grounded state space so exact enumeration is feasible.
      4. Compute answer sets with the independent solver. Compute zero-energy states through the new compiler. Require set equality, not score correlation.
      5. Add rule-local violation receipts. Test default negation, contradiction, cardinality, label permutation, malformed syntax, and energy-sign errors.
      6. Report verifier_is_oracle=true. State that both methods derive from the formal sidecar. Make no learned-verifier or moat claim.
      7. Run focused tests, spec coverage, applicable e2e checks, and adversarial verification. Record git status after tests.

      Run command: .venv/bin/python -m carnot.experiment_6274_asp_energy_semantic_compiler --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

