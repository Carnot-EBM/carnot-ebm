milestone: 2026.06.379
milestone_title: "Verifier-as-reward on the TRM substrate — discrimination probe FIRST, conditional native-trainer RFT SECOND"
milestone_doc: |
  Operator directive 2026-06-12 (this session): the LoRA-on-1B-LLM generator route is too
  expensive AND has been blocked at the trl/peft training mechanism for three milestones
  (.377: exp4077 blocked_precision_gate + exp4078 blocked_corpora_missing; .378: corpus-build
  exp4088 blocked_lora_smoke_checkpoints + train exp4089 RETIRED). Pivot the verifier-as-reward
  TRAINING substrate to the cached ArcPrize TRM (models--arcprize--trm_arc_prize_verification,
  nano-trm installed, baseline already run). Rationale: (1) ~7M params -> full-FT is cheap on a
  3090 and full-FT > LoRA for OOD (TTA-TRM 2511.02886); (2) the TRM has a MEASURED present-but-
  misvoted gap (pass@2 ~0.52, pass@1000 ~0.62; oracle 0.61 vs vote 0.48) -> real headroom the
  verifier could capture; (3) it sidesteps the broken trl/peft trainer via nano-trm's native
  loop.

  CAVEAT THAT SETS THE MILESTONE ORDER: the binding constraint is NOT the generator, it is the
  verifier's DISCRIMINATION on the outputs. We already have a warning sign: arc3_trm_verifier_
  rerank_gap1 shows the OLD verifier reranking TRM outputs captured 0.0pp of the ~13pp gap
  (best ranker = TRM_VOTE; oracle 0.6129 vs achieved 0.4839). RFT trains on the verifier's
  labels, so if the verifier carries no signal on TRM outputs at rerank, RFT will not help
  either. THEREFORE: prove discrimination FIRST (cheap, offline, fabrication-immune), and only
  RFT the TRM if a verifier beats TRM-vote. The .378 precision-rescue primitives (augmentation-
  invariance, k-of-n induction agreement, graded min-Hamming) were NEVER applied to the TRM
  pool — that is the new lever this milestone tests.

  POWER CAVEAT (sets the realistic headline): the cached TRM rerank pool is n=31 with ~13pp
  headroom — too small for a CI95-excludes-0 discrimination verdict (a real small signal would
  not clear it). exp4099 therefore EXPANDS the pool to n>=100 via the TRM eval harness BEFORE
  reranking, and reports BOTH the strict CI95-excludes-0 gate (which feeds exp4100's RFT branch)
  AND the directional captured_pp point-estimate (which informs the .380 decision even if the
  strict gate does not fire). The achievable decision-grade outcomes are: (a) a POWERED
  discrimination verdict -> conditional RFT; (b) an honest no-discrimination null with the
  directional estimate + a logged verifier_gap; (c) the native TRM trainer de-risked (a checkpoint
  produced) independent of the science. We do NOT promise "verifier-as-reward validated" — that
  requires (a) to land AND exp4100's A>B.

tasks:
