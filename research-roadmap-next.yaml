        flip_count_optimal_vs_sc: principle="problems where optimal-aggregation differs from SC — the tautology-clean primary signal (0 -> they agree, no separate bit-identical field)."
        flips_correct_optimal: principle="flips that became CORRECT (the win mechanism: recovering minority-yet-correct answers)."
