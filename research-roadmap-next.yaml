      5. Compare scheduler decisions with always-full-verification and no-memory baselines. Report preserved_correctness, false_accepts, false_rejects, full_verifier_calls_avoided, and any wall-clock measurements as secondary only.
      6. Ensure the scheduler never overrides a deterministic verifier failure or missing provenance receipt.
      7. Run focused tests for routing rules and artifact schema.
