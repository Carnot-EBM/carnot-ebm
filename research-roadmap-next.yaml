      CLAUDE.md "ARC Solve Reproducibility" + "Inference-Substrate Declaration Discipline".
      TASK: SOLVE dc22 L1 and BANK it. Extend config_rule_verifier with a counterexample-guided grounding
      loop (propose is_win/toggle-plan with Qwen3.5-9B-MTP few-shot from the grounded config/toggle win-rules
