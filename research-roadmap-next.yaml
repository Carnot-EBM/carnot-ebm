    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Per CLAUDE.md Hardware-Task Continuity Discipline:
      - KV260 terminal state criteria: "board-level latency transcript landed in a non-fabricated
        artifact + kv260_synthesis_succeeded: true"
      - exp2735 (.259) confirmed: ssh_kria_reachable=true, bitstream_loaded=true, uio_count=5,
