          n_templates_before=<int>, n_templates_added=<int>,
          n_templates_total=<int>, cross_session_fp_rate=<float>,
          fr11_real_violations_confirmed=<bool>,
          source_experiment=656,
          honest_verdict='fr11_relay_complete_violations_wired' if fr11_real_violations_confirmed
            else 'fr11_relay_complete_synthetic_only'.
       h. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_constraint_template_library.py (100% coverage on
       constraint_template_library.py). Tests trace to REQ-SELF-020.
