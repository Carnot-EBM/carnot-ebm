  - id: exp2650
    milestone: "2026.05.253"
    deliverable: "results/experiment_2650_tier0l_layer_wise.json"
    title: "Tier 0l: Layer-Wise Information Drift Verifier (arXiv:2604.16217)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: verifier

    prior_failures:
      - experiment_id: exp2641-pasc-pipeline-conformal
        verdict: "complete: PASC joint coverage implemented; coverage_joint_90pct documented"
        addressed_by: "exp2641 implemented PASC multi-stage conformal prediction (pipeline-level calibration). Tier 0l is a fundamentally different scope: it is a NEW VERIFIER (per-claim hallucination scorer) using layer-wise information drift as the discriminative signal — per arXiv:2604.16217. Different paper, different mechanism (verifier score vs. pipeline calibration), different deliverable (tier0l.py module vs. conformal calibration artifact)."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      arXiv:2604.16217 shows that layer-wise information scores from LLM internal representations
      are more robust to distribution shift than output-level token probabilities. Key insight:
      hallucinated content introduces NOVEL information NOT grounded in the context — measurable as
      high drift between the information content of early vs. late parts of the claim relative to
      the context.

      TF-IDF proxy implementation (no access to model internals required):
      - "Information drift" proxy: cosine distance between TF-IDF(context + claim_first_half) and
        TF-IDF(context + claim_second_half). Hallucinated claims often introduce novel terms in the
        second half that don't align with the context established in the first half.
      - "Context anchoring" proxy: 1 - cosine_similarity(TF-IDF(context), TF-IDF(claim)).
        Correctly grounded claims have high similarity to the context.

      Hypothesis: high information drift AND low context anchoring → hallucination.
      Target: tier0l_auroc >= 0.65 on FoVer real corpus (N >= 200).

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (examine tier0w_avgwd_eigenwd.py for TF-IDF pattern)
      - python/carnot/verify/base_verifier.py (BaseVerifier interface)
      - data/fover_corpus.jsonl (corpus format)

      TASK: Implement Tier 0l layer-wise information drift verifier and evaluate on FoVer.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import numpy; import sklearn; import scipy"` succeeds.
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. FoVer corpus: {project_root}/data/fover_corpus.jsonl (n_lines >= 200).
            If absent: write honest_verdict blocked_fover_corpus_not_found; exit.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer corpus. Parse (context, claim, label) triples. n_corpus = count.

      2. Implement Tier0lVerifier in python/carnot/verify/tier0l_layer_wise.py:

         from sklearn.feature_extraction.text import TfidfVectorizer
         from sklearn.metrics.pairwise import cosine_similarity
         import numpy as np

         class Tier0lVerifier:
             """Layer-wise information drift verifier.
             Per arXiv:2604.16217: hallucinations introduce novel information not grounded in context,
             detectable as drift between early and late claim content relative to context.
             Implemented as TF-IDF proxy for layer-wise representation drift.

             Why this works: factually correct claims should 'anchor' to context-established facts
             throughout. Hallucinated claims often drift toward invented content in later sentences.
             This drift is measurable without model access via TF-IDF cosine distances."""

             def __init__(self):
                 self.vectorizer = TfidfVectorizer(ngram_range=(1,2), max_features=500)

             def fit(self, texts: list):
                 self.vectorizer.fit(texts)

             def _information_drift(self, context: str, claim: str) -> float:
                 """Drift = cosine distance between context+claim_first_half and context+claim_second_half."""
                 words = claim.split()
                 mid = max(1, len(words) // 2)
                 first_half = ' '.join(words[:mid])
                 second_half = ' '.join(words[mid:]) if words[mid:] else first_half
                 try:
                     v1 = self.vectorizer.transform([context + ' ' + first_half]).toarray()
                     v2 = self.vectorizer.transform([context + ' ' + second_half]).toarray()
                     cos_sim = cosine_similarity(v1, v2)[0][0]
                     return 1.0 - cos_sim  # drift = 1 - similarity
                 except Exception:
                     return 0.5

             def _context_anchoring(self, context: str, claim: str) -> float:
                 """Anchoring score = 1 - cosine_similarity(context, claim). High = poorly anchored."""
                 try:
                     vc = self.vectorizer.transform([context]).toarray()
                     vl = self.vectorizer.transform([claim]).toarray()
                     cos_sim = cosine_similarity(vc, vl)[0][0]
                     return 1.0 - cos_sim  # anchoring_score
                 except Exception:
                     return 0.5

             def score(self, context: str, claim: str) -> float:
                 """Return hallucination probability in [0,1]. Higher = more likely hallucinated."""
                 drift = self._information_drift(context, claim)
                 anchoring = self._context_anchoring(context, claim)
                 return (drift + anchoring) / 2.0  # combined score

      3. Fit vectorizer on 80% of corpus texts (random_seed=42).
         Compute tier0l scores for all test examples.

      4. Evaluate on test split (20%, n_test >= 40):
         tier0l_auroc = roc_auc_score(labels, [verifier.score(ctx, clm) for ctx, clm in test]).
         drift_only_auroc = roc_auc_score(labels, drift_scores only).
         anchoring_only_auroc = roc_auc_score(labels, anchoring_scores only).
         dominant_signal = 'drift' if drift_only_auroc > anchoring_only_auroc else 'anchoring'.

      5. tier0l_viable = (tier0l_auroc >= 0.65).

      6. Run adversarial_verify.py. Capture CRITICAL flags.

      7. Write results/experiment_2650_tier0l_layer_wise.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - tier0l_auroc: float — combined drift+anchoring AUROC
        principle: "Primary viability metric: >= 0.65 required for exp2653 ensemble v11 integration."
