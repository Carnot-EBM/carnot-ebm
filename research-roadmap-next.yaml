- id: exp2531-ising-verifier-implementation
  title: 'Phase 1a: Implement IsingVerifier.energy(step_text:str) -> float (fix stub
    class)'
  milestone: 2026.05.244
  deliverable: results/experiment_2531_ising_verifier_implementation.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  prior_failures:
  - experiment_id: exp2519-phase4-arm-ebm-v3-no-fallback
    verdict: 'complete: blocked_ising_verifier_not_available'
    addressed_by: "exp2519 was blocked because IsingVerifier() takes no arguments
      and has no .energy() method — the class is a stub (`class IsingVerifier: pass`).
      This task implements the IsingVerifier class with a real energy(step_text: str)
      -> float method. Root cause fixed: the stub is replaced with a working implementation.
      This is a code-writing task (different scope from exp2519's correlation test)."
    retire_if_same_verdict: false
  prompt: "CONTEXT: `python/carnot/verify/semantic_energy.py` defines `class IsingVerifier:
    pass` — completely empty. Every Phase 4 ARM-EBM attempt (exp2486, exp2508, exp2519)
    that required IsingVerifier.energy() was blocked because this class has no methods.\n\nThis
    task WRITES the real IsingVerifier implementation. Once energy(text) works, exp2532
    (Phase 4 ARM-EBM v4) can finally run the structural test.\n\nTHEORY: Carnot's
    constraint-based energy should measure: how many arithmetic/logical claims in a
    text step are internally inconsistent? A step with 'The sum of 47+28 is 76' has
    energy=1.0 (violation). A step with 'The sum of 47+28 is 75' has energy=1.0. A
    step with 'The sum of 47+28 is 75. Therefore the answer is 75.' has energy=0.0
    (consistent, even if wrong for a different problem — energy measures internal
    consistency of claims within the step, not external correctness).\n\nEXISTING
    CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py
    (IsingVerifier stub at bottom — add implementation there)\n  {project_root}/python/carnot/verify/tier0r_curry_howard.py
    (Tier0rVerifier — example of a working verifier implementation to follow)\n  {project_root}/scripts/experiment_template.py
    (ExperimentTemplate boilerplate)\n\nTASK: Implement IsingVerifier.energy(step_text:
    str) -> float.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. Verify carnot.verify
    imports work:\n        python3 -c \"from carnot.verify.semantic_energy import SemanticEnergyDetector;
    print('ok')\"\n        If fails: write honest_verdict blocked_carnot_import_failed
    and exit.\n     b. Confirm IsingVerifier is a stub:\n        python3 -c \"from
    carnot.verify.semantic_energy import IsingVerifier; print(dir(IsingVerifier))\"\n
    \       If dir() shows methods beyond __init__/__class__ etc: implementation may
    already exist; read it and evaluate.\n  1. Implement IsingVerifier in python/carnot/verify/semantic_energy.py:\n
    \    class IsingVerifier:\n       def __init__(self):\n           import re\n           self._num_re
    = re.compile(r'\\b(\\d+(?:\\.\\d+)?)\\b')\n           self._arith_re = re.compile(\n
    \              r'(\\d+(?:\\.\\d+)?)\\s*([+\\-*/])\\s*(\\d+(?:\\.\\d+)?)\\s*(?:=|equals|is)\\s*(\\d+(?:\\.\\d+)?)'\n
    \          )\n       def energy(self, step_text: str) -> float:\n           '''Compute
    constraint-violation energy for a text step.\n           Returns float in [0,1]:
    0.0=no violations detected, 1.0=all claims violate.'''\n           violations,
    total = 0, 0\n           # Check arithmetic claims: 'A op B = C'\n           for
    m in self._arith_re.finditer(step_text):\n               a, op, b, c = float(m.group(1)),
    m.group(2), float(m.group(3)), float(m.group(4))\n               total += 1\n
    \              expected = {'+': a+b, '-': a-b, '*': a*b, '/': a/b if b!=0 else
    float('inf')}[op]\n               if abs(expected - c) > 1e-6: violations += 1\n
    \          if total == 0:\n               return 0.0  # No verifiable claims =
    no violations\n           return violations / total\n  2. Verify: python3 -c \"from
    carnot.verify.semantic_energy import IsingVerifier; v=IsingVerifier(); e=v.energy('2+3=5');
    assert e==0.0; e2=v.energy('2+3=6'); assert e2==1.0; print('IsingVerifier.energy()
    working, e1=', e, 'e2=', e2)\"\n  3. Write unit tests in tests/ confirming energy()
    returns 0.0 for valid arithmetic and 1.0 for violations.\n  4. Confirm importability:\n
    \    python3 -c \"from carnot.verify.semantic_energy import IsingVerifier; v=IsingVerifier();
    print('ok, energy test:', v.energy('The sum 2+3=5'))\"\n  5. Set ising_verifier_text_energy_implemented=True
    if energy() callable.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle:
    \"Terminal-prefix required.\"\n  - ising_verifier_text_energy_implemented:\n      principle:
    \"True only if IsingVerifier().energy(str) is callable and returns float in [0,1].
    This is the gate condition for exp2532.\"\n  - energy_test_correct:\n      principle:
    \"True if energy('2+3=5')=0.0 AND energy('2+3=6')=1.0. Confirms non-trivial
    discrimination.\"\n  - implementation_notes:\n      principle: \"Documents which
    heuristic was used for claim extraction — required for paper-v6 §3 methodology.\"\n
    \ - preconditions_checked:\n      principle: \"Records which resources were verified
    before launching.\"\n  - duration_s:\n      principle: \"Wall-clock measurement.\"\n
    \ - random_seed:\n      principle: \"Reproducibility seed.\"\n\nACCEPTANCE GATES:\n
    \ - condition: \"ising_verifier_text_energy_implemented == true AND energy_test_correct
    == true\"\n    principle: \"Both conditions: importability AND correctness test
    (non-trivial discrimination). An implementation that always returns 0.0 would
    pass importability but fail the correctness gate.\"\n\nDo NOT push. Do NOT modify
    scripts/research_conductor.py."

