  - id: exp3345-fr11-online-memory-nonforgetting-v5
    milestone: "2026.05.309"
    title: "FR-11 online verifier-memory nonforgetting v5 with rollback and soundness/completeness costs"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 60
    track: continuous-self-learning
    inference_substrate: cached_verifier_corpus
    requires_gpu: false
    continuous_self_learning_task: true
    deliverable: "results/experiment_3345_fr11_online_memory_nonforgetting_v5.json"
