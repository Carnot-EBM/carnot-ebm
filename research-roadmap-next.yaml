    - rows: source_id/unit_id/arm/condition/issued_state/metric/numerator/denominator/status/exclusion_reason; principle: comparative claims must reduce from individual observations.
    - intended_count, eligible_count, independent_count, completed_count, excluded_count, censored_count, failed_count, sample_size_budget; principle: repetitions and seeds do not create independent sources.
