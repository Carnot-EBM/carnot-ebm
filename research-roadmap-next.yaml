      Exp5383 produced strong aggregate overwrite-guidance numbers, but the conductor/adversarial verifier flagged it CRITICAL TAUTOLOGY. Downstream solver and p-bit work must not rely on Exp5383 until a corrigendum recomputes claims from row-level evidence.

