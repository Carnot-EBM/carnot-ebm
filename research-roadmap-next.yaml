      board's network alias, never a host-side removable-storage check).

    CONCRETE STEPS:
    0. PRECONDITIONS (per board):
       a. KV260: `ssh -o ConnectTimeout=5 -o BatchMode=yes kria 'true'` -- SSH-reachability only.
       b. PolarFire: `ssh -o ConnectTimeout=5 -o BatchMode=yes polarfire 'true'`.
       c. GateMate: `openFPGALoader -c dirtyJtag --detect` AND `lsusb -v -d 1209:c0ca` (or the board's
