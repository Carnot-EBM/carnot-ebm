tasks:
  - id: exp1735-dual-gpu-smoke
    title: "Exp 1735: Dual RTX 3090 SOTA CUDA Runtime Smoke Test"
    deliverable: results/experiment_1735_dual_gpu_smoke.json
    model: opus
    max_turns: 100
    prompt: |
      CONTEXT: Milestone .134 Phase 1. We must unblock the dual RTX 3090 CUDA runtime for live SOTA model inference, which has been blocked by llama.cpp runtime errors.
      EXISTING CODE TO READ FIRST: python/carnot/inference/model_loader.py
      TASK: Implement a robust smoke test that successfully loads a SOTA GGUF model across two RTX 3090s and generates a valid response.
      CONCRETE STEPS:
      1. Create `{project_root}/scripts/experiment_1735_dual_gpu_smoke.py`.
      2. Ensure CUDA is correctly detected. If not, implement a structured fallback/diagnostic.
      3. Use `MODEL_SPECS` with `unsloth/Qwen3.6-35B-A3B-GGUF` (or `unsloth/gemma-4-31B-it-GGUF`) via the `cached_sota_pair()` pattern.
      4. Run a simple inference query and record `usable_response=True` upon success.
      5. Write results to `{project_root}/results/experiment_1735_dual_gpu_smoke.json`.
      CRITICAL: write artifact FIRST.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

