    - CLAUDE.md
    - scripts/experiment_template.py
    - results/experiment_1427_repair_executor_rejection_ledger.json
    - results/experiment_1414_certificate_llm_repair_executor_v1.json
    - results/experiment_1419_fullscale_pipeline_v3_repair_executor.json
    - python/carnot/pipeline/
    - python/carnot/verify/
    - openspec/capabilities/pipeline/spec.md
    - openspec/capabilities/verification/spec.md

    TASK:
    Implement or prototype repair executor v2 using draft-conditioned,
    schema-constrained repair. Validate on a bounded repair-hint micro sample
    and write a terminal artifact with nonzero-repair evidence or an honest
    blocked verdict.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - local_sota_model_used
    - repair_executor_v2_deployed
    - repair_hint_cases_tested
    - repaired_cases_successful
    - repaired_case_success_rate
    - schema_valid_rate
    - semantic_acceptance_rate
    - rejection_reason_counts
    - tests_run
    - honest_verdict

