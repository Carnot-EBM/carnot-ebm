    at some path. exp2489 must:\n  1. Check multiple candidate paths for the model\n  2. If found: apply LipNeXt λ·local_lip²
    penalty fine-tuning\n  3. If NOT found: retrain from scratch WITH LipNeXt penalty from the start\n  Target: mean_local_lipschitz
    < 5.0, certified_coverage > 0.5, new_kan_auroc > 0.97\n\narXiv:2601.18513 (LipNeXt): adds adaptive penalty λ·max(0,
    local_lip - target_lip)^2 to training loss.\nFor KAN splines: local_lip computed as max singular value of Jacobian
    over local input window.\nλ=0.1 with target_lip=5.0 achieves certified_coverage=0.91 on hallucination benchmarks.\n\nEXISTING
    CODE TO READ FIRST:\n  {project_root}/results/experiment_2467_kan_formal_verification.json (check preconditions_checked
    for the path it found)\n  {project_root}/python/carnot/models/kan/__init__.py (KAN model class)\n  {project_root}/python/carnot/verify/semantic_energy.py
    (telemetry loading pattern)\n\nTASK: Locate or retrain KAN model; apply LipNeXt Lipschitz regularization.\n\nCONCRETE
    STEPS:\n  0. PRECONDITIONS:\n     a. numpy importable: {project_root}/.venv/bin/python -c \"import numpy; print(numpy.__version__)\"\n
    \    b. Telemetry manifest present: ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n     Record:
    preconditions_checked list.\n\n  1. Search for KAN model at candidate paths (in order):\n     a. Read exp2467 artifact
