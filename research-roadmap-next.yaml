- id: exp540-grpo-eorm-retrain
  milestone: 2026.04.41
  deliverable: results/experiment_540_grpo_eorm_retrain.json
  title: 'Exp 540: GRPO Contrastive EORM Retrain — arXiv 2503.06639 self-learning'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: GRPO (arXiv\
    \ 2503.06639) shows that verifiable binary rewards (correct/incorrect) naturally\
    \ induce a contrastive loss structure: problems the model gets right and wrong\
    \ are automatically paired as positive/negative examples. NUP Probe v4 (Exp 523)\
    \ already validated that energy-gap contrastive training dramatically outperforms\
    \ BCE (AUC=1.0 vs 0.40). Now apply the same GRPO contrastive pairing to retrain\
    \ EORM (55M param energy reward model) on live correct/incorrect pairs from Exp\
    \ 538. No additional labeling needed — the live benchmark binary verdicts ARE\
    \ the contrastive signal.\n\nEXISTING CODE TO READ FIRST:\n- results/experiment_538_live_25q_precision_v9.json\
    \ — Exp 538 result (contains per-question baseline_correct, pipeline_correct fields)\n\
    - python/carnot/models/eorm_model.py — EORMModel (the 55M param model to retrain)\n\
    - python/carnot/models/eorm_retrain.py — EORMRetrainResult, load_real_cot_pairs,\
    \ merge_cot_corpora\n- results/exp538_cot_pairs.json — CoT pairs written by Exp\
    \ 538 (if present)\n- results/fover_labeled_steps_live.json — Exp 442 FOVER labels\
    \ (57 pairs)\n- scripts/experiment_template.py — ExperimentTemplate (with teardown)\n\
    \nTASK: Implement GRPO-style contrastive EORM retrain.\n1. Read CLAUDE.md spec-first\
    \ workflow.\n2. Add REQ-LEARN-046 (GRPO contrastive pairing for EORM retrain from\
    \ live binary verdicts), REQ-LEARN-047 (contrastive loss: L = max(0, margin -\
    \ (E(incorrect) - E(correct)))), SCENARIO-LEARN-074/075/076 to openspec/capabilities/autoresearch/spec.md.\n\
    3. Create python/carnot/models/grpo_eorm_retrain.py:\n   a. GRPOContrastivePair(question_id,\
    \ correct_response, incorrect_response) dataclass.\n   b. build_grpo_pairs_from_benchmark(benchmark_result_path)\
    \ → List[GRPOContrastivePair]:\n      - Load benchmark JSON (Exp 538 format).\n\
    \      - For each question where baseline_correct=False and pipeline_correct=True:\
    \ pair (correct=pipeline_response, incorrect=baseline_response).\n      - For\
    \ each question where baseline_correct=True and pipeline_correct=False: pair (correct=baseline,\
    \ incorrect=pipeline) [pipeline broke it].\n   c. train_eorm_grpo(eorm_model,\
    \ pairs, margin=1.0, epochs=50, lr=1e-4) → training_loss, before_auc, after_auc:\n\
    \      - Contrastive loss: L = mean(max(0, margin - (E(incorrect) - E(correct))))\n\
    \      - Optimize to maximize energy gap.\n   d. GRPOEORMRetrainResult(n_pairs,\
    \ before_auc, after_auc, auc_improvement, honest_verdict).\n4. Write tests/python/test_grpo_eorm_retrain.py:\
    \ pair building from benchmark JSON, contrastive loss computation, train_eorm_grpo\
    \ on 5 synthetic pairs. 100% coverage.\n5. Write scripts/experiment_540_grpo_eorm_retrain.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. ExperimentTimeoutWatchdog(540, timeout_minutes=30).\n\
    \   c. ExperimentTemplate(540, 'GRPO Contrastive EORM Retrain',\n      'results/experiment_540_grpo_eorm_retrain.json',\
    \ requires_gpu=False).\n   d. Load Exp 538 benchmark result; build GRPO pairs.\n\
    \   e. If n_pairs < 5: use synthetic fallback pairs (pairs from FOVER fover_labeled_steps_live.json).\n\
    \   f. Train EORM for 50 epochs with contrastive loss.\n   g. Save retrained model\
    \ to results/eorm_model_540_grpo.safetensors.\n   h. Build artifact: schema='carnot.grpo_eorm_retrain.v1'\n\
    \      n_pairs, before_auc, after_auc, auc_improvement\n      honest_verdict='grpo_improved'\
    \ (auc_improvement > 0.05) / 'no_improvement' / 'synthetic_fallback'\n   i. tmpl.assert_deliverable_written().\n\
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile ops/conductor-log.md,\
    \ ops/changelog.md, _bmad/traceability.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp541-constraint-addition-live-wire-in
  milestone: 2026.04.41
  deliverable: results/experiment_541_constraint_addition_live.json
  title: 'Exp 541: ConstraintAdditionFromMemory Live Wire-In — FR-11 Tier 2 self-learning'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: ConstraintAdditionFromMemory\
    \ (Exp 456) was built and validated in isolation (session2_fp_rate=0.0 vs session1_fp_rate=1.0).\
    \ It has never been wired into the live VerifyRepairPipeline. The live benchmark\
    \ (Exp 538) produced real violation patterns. This experiment wires Tier 2 self-learning\
    \ into the live pipeline: after each verify-repair cycle, violation patterns accumulate\
    \ in memory, and when a pattern fires >3 times, a new constraint is added for\
    \ subsequent queries.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/constraint_addition.py\
    \ — ConstraintAdditionFromMemory, ViolationPattern\n- python/carnot/pipeline/verify_repair.py\
    \ — VerifyRepairPipeline.verify() and repair() (wire-in point)\n- python/carnot/pipeline/self_learning_relay.py\
    \ — SelfLearningRelay (existing Tier 1+2+3 relay)\n- results/experiment_538_live_25q_precision_v9.json\
    \ — Exp 538 violations (real violation patterns)\n- results/experiment_456_constraint_addition.json\
    \ — Exp 456 result (fr11_tier1_confirmed)\n- scripts/experiment_template.py —\
    \ ExperimentTemplate\n\nTASK: Wire ConstraintAdditionFromMemory into VerifyRepairPipeline.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-LEARN-048 (VerifyRepairPipeline\
    \ accepts optional constraint_memory: ConstraintAdditionFromMemory), REQ-LEARN-049\
    \ (after each repair cycle, pipeline calls constraint_memory.record_violation()),\
    \ SCENARIO-LEARN-077/078/079 to openspec/capabilities/autoresearch/spec.md.\n\
    3. In python/carnot/pipeline/verify_repair.py:\n   a. Add optional constraint_memory:\
    \ Optional[ConstraintAdditionFromMemory] = None param to __init__().\n   b. In\
    \ repair() or verify_and_repair(): after recording a violation, call\n      self.constraint_memory.record_violation(violation_type,\
    \ context) if self.constraint_memory is not None.\n   c. In verify(): if self.constraint_memory\
    \ is not None, call self.constraint_memory.get_additional_constraints() and\n\
    \      add them to the active constraint set before running Ising.\n4. Write tests/python/test_constraint_addition_wire_in.py:\n\
    \   a. Test VerifyRepairPipeline with constraint_memory=None (existing behavior\
    \ unchanged).\n   b. Test constraint_memory.record_violation() is called on violation.\n\
    \   c. Test additional constraints are applied on next verify() call.\n   d. 100%\
    \ coverage of the new wire-in code paths.\n5. Write scripts/experiment_541_constraint_addition_live.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. ExperimentTimeoutWatchdog(541, timeout_minutes=30).\n\
    \   c. ExperimentTemplate(541, 'ConstraintAdditionFromMemory Live Wire-In',\n\
    \      'results/experiment_541_constraint_addition_live.json', requires_gpu=False).\n\
    \   d. Load Exp 538 violation patterns from result JSON.\n   e. Pre-seed ConstraintAdditionFromMemory\
    \ with real violation types from Exp 538.\n   f. Run a 50-question simulation:\
    \ session 1 (no constraint addition, baseline fp_rate), session 2 (with constraint\
    \ addition from session 1 patterns, measure fp_rate_delta).\n   g. Build artifact:\
    \ schema='carnot.constraint_addition_live.v1'\n      session1_fp_rate, session2_fp_rate,\
    \ fp_rate_delta\n      constraints_added (list of added constraint types)\n  \
    \    honest_verdict='tier2_live_improved' (fp_rate_delta < -0.1) / 'no_improvement'\
    \ / 'wire_in_complete'\n   h. tmpl.assert_deliverable_written().\n6. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n7. Reconcile ops/conductor-log.md, ops/changelog.md,\
    \ _bmad/traceability.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

