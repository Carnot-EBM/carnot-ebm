  - id: exp3136-false-accept-root-cause-autopsy
    milestone: "2026.05.292"
    deliverable: "results/experiment_3136_false_accept_root_cause_autopsy_v1.json"
    title: "False-accept root-cause autopsy"
    priority: critical
    max_turns: 30
    estimated_wall_time_min: 35
    track: "verification"
    inference_substrate: "aggregation_and_exact_tests"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3124-difficulty-stratified-live-sota-verifier-panel-v6
        verdict: "complete_blocked_false_accept: false_accept_rate=0.5; live_call_count=6; headline_claim_allowed=false"
        addressed_by: "Performs row-level false-accept autopsy before rerun, separating extraction, prompt, exact-label, difficulty, and failure-mechanism causes instead of repeating the same live panel."
        retire_if_same_verdict: true
      - experiment_id: exp3134-capstone-v291
        verdict: "complete: capstone_ready=true; paper_ready=false; publication_blocker_count=46; blocker_delta_from_v24=10; next_top_gap=live_verifier_false_accept_repair_gate"
        addressed_by: "Targets the capstone's named top gap directly rather than continuing broad architecture work."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .291 found false_accept_rate=0.5 on the live SOTA verifier panel, blocking repair. Recent verification literature warns that LLM verification can be harder than solving, so the next step is root-cause accounting rather than another blind rerun.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-references.md
      - results/experiment_3124_difficulty_stratified_live_sota_verifier_panel_v6.json
      - results/experiment_3125_prefix_closed_deterministic_verifier_bound_pilot_v1.json
      - results/experiment_3126_fragment_time_monitor_satisfiable_drift_audit_v1.json
      - results/experiment_3133_cross_corpus_matrix_v25.json
      - results/experiment_3134_capstone_v291.json
      - results/local_sota_confidence_abstention_panel_3099/rows.jsonl if present

      TASK
      Diagnose the .291 false accepts at row level and produce a machine-readable root-cause map for the next verifier contract.

      CONCRETE STEPS
      1. Load every available .291 verifier row, exact label, live model verdict, extracted answer, difficulty bucket, fixture family, prompt hash, and monitor event.
      2. Recompute false_accept_rate and identify the exact row IDs responsible for false accepts.
      3. Classify each false accept as answer-extraction failure, prompt ambiguity, exact-label mismatch, premise/step grounding failure, SAT/validity-token confusion, model prior/data mismatch, contradiction miss, or unknown.
      4. Compare false-accept rows against prefix-bound coverage and fragment monitor ledger fields.
      5. Write a mitigation recommendation with concrete contract changes and rows that must be in the rerun regression set.

      REQUIRED ARTIFACT FIELDS:
      - false_accept_autopsy_v1_ready: bool (principle: reruns need root-cause evidence)
      - source_false_accept_rate: float (principle: baseline failure must be preserved)
      - false_accept_row_ids: list (principle: failures must be inspectable)
      - false_accept_mechanism_counts: dict (principle: different failure causes require different fixes)
      - extraction_failure_count: int (principle: parse bugs differ from reasoning bugs)
      - prompt_ambiguity_count: int (principle: ambiguous instructions can create false accepts)
      - exact_label_mismatch_count: int (principle: ground truth must be audited)
      - contradiction_miss_count: int (principle: contradiction rows are the central blocker)
      - regression_row_set: list (principle: rerun must cover known failures)
      - recommended_contract_changes: list (principle: next task needs actionable changes)
      - source_artifacts: list (principle: claims must trace to concrete files)
      - inference_substrate: dict (principle: no live inference should be implicit)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

