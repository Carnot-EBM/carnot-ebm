milestone: 2026.06.427
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-23). .426 closed FLAT (capstone
  `bridge_characterized_cause_isolated_no_live_lift`, reproducible_total_levels 55->55, delta=0) -- the
  SECOND consecutive flat milestone. A1 (exp4616) ISOLATED compute-cost as a bridge cause
  (`bridge_cause_isolated_compute_fix_identified`), but A2 (exp4617) GRADUATED the position-preserving
  SpatialValueNet to the live path AND applied the compute fix and got NO live lift
  (`spatial_value_head_graduated_no_live_value_honest_null_gap_sharpened`: first_win_delta=0, actions_delta=0,
  solve_rate stuck 0.04 across bare==graduated==linear). So the VALUE-HEAD-RERANKER-INTO-THE-LIVE-SEARCH lever
  is now FALSIFIED TWICE (.425 linear verifier null; .426 SpatialValueNet+compute-fix null) -- and applying the
  compute fix without crossing the bridge implicates the OTHER causes (distribution-shift / calibration) that A1
  left standing. A3 (exp4618) sk48 L1->L2 did NOT bank (levels stuck 55). The DECISIVE steer is the outer-loop
  critique's DEFENSIBLE ORDERING (memory project_arc_live_agent_learning_gaps + commit 4b7782d41): the
  representation is NOT the bottleneck (0.725 LOO-AUROC); the binding constraint is the OFFLINE->LIVE BRIDGE; and
  the next real step is NOT another frontier-reranker but the CHEAPEST CLOSED LOOP -- reuse the live world-model's
  OWN per-step prediction-error as a DENSE online learning-progress/curiosity signal + single-step value-backup
  over the explored GameGraph (temporal credit-assignment, gap #1; addresses distribution-shift BY CONSTRUCTION
  because the signal is computed online from the agent's own transitions). SOTA-confirmed by Curiosity-Critic
  (arXiv:2604.18701, Apr 2026: intrinsic reward from the IMPROVEMENT of cumulative prediction error, separating
  reducible/epistemic from irreducible/aleatoric error online). So .427 PIVOTS from RERANKING the live search to
  GENERATING better live exploration: A1 wires the dense curiosity/learning-progress loop into the live explorer
  (raise live solve-rate); A2 graduates the leaderboard-PROVEN CNN action-effect/frame-change predictor into the
  live explorer candidate ranking (raise live ACTION EFFICIENCY -- the leaderboard score term we have NONE of,
  the StochasticGoose 12.58% steal). Both measured on the SCORED E3AgentPolicy vs matched controls, both
  live-path-reachable (arc_orphan_solver_lint). A3 banks +1 via self-play (rotate to ls20, the cleanest-nav game).
  verifier_is_oracle: false on every value claim. Submission stays operator-only. ARC Prize Milestone #1 deadline
  is 2026-06-30 (7 days) -- this is one of the LAST milestones before it.
milestone_title: 'GENERATE BETTER LIVE EXPLORATION, STOP RERANKING IT -- the value-head-reranker-into-the-live-search lever is FALSIFIED twice (.425 linear null, .426 SpatialValueNet+compute-fix null); the representation is solved (0.725); the binding constraint is the OFFLINE->LIVE BRIDGE. .427 takes the critique''s cheapest-closed-loop next step: A1 wires the live world-model''s OWN prediction-error as a DENSE learning-progress/curiosity exploration signal + single-step value-backup over the explored GameGraph (Curiosity-Critic arXiv:2604.18701; raise live solve-rate; addresses distribution-shift by construction); A2 graduates the leaderboard-PROVEN CNN action-effect/frame-change predictor into the live explorer candidate ranking (raise live action-efficiency -- the score term we have NONE of); both on the SCORED E3AgentPolicy vs matched controls, both live-path-reachable. A3 banks +1 via self-play (ls20, 55->56+); package operator-resubmit-ready (A4, beat 33). 7 days to the ARC Prize Milestone #1 deadline.'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  THE 55 LEVELS ARE A LEADERBOARD MIRAGE UNTIL THE SCORED AGENT SELF-DISCOVERS LIVE -- and two milestones of
  wiring a verifier/value-head as a frontier RERANKER into the live depth-first explorer have NULLED (.425 linear,
  .426 SpatialValueNet+compute-fix; solve_rate stuck 0.04). The outer-loop critique's defensible ordering is
  decisive: the representation is solved (0.725 LOO-AUROC), the bridge is the wall, and the next step is the
  CHEAPEST CLOSED LOOP -- not a better ranker but a DENSE online signal that improves the agent's own EXPLORATION.
  .427 PIVOTS to GENERATION: A1 (HEADLINE; GAP-ARCH-WORLD-MODEL-TRUST-ENERGY-adjacent) reuses the live
  world-model's OWN per-step prediction-error as a dense learning-progress/curiosity exploration bonus
  (epistemic-vs-aleatoric separated online, Curiosity-Critic arXiv:2604.18701) + single-step value-backup over the
  explored GameGraph edges the explorer ALREADY keeps (no new net, no offline winning-path training -> no
  distribution-shift), measured on the SCORED E3AgentPolicy's live solve-rate/coverage vs bare exploration. A2
  (GAP-ARCH-FRAME-CHANGE-PREDICTOR -- priority HIGH, the most direct leaderboard-leader steal; StochasticGoose
  12.58% on a CNN clickability/action-effect predictor) graduates the action-effect/frame-change predictor into
  the LIVE explorer's rich_action_candidates ranking and measures live ACTION EFFICIENCY (min(human/agent,1)^2 --
  the score term we have NONE of) vs the bare explorer. Both live-path-reachable (arc_orphan_solver_lint), both
  verifier_is_oracle: false (oracle-distinct learned signals doing the action-pruner job, north-star §5). CAPABILITY
  (A3): self-play banks +1 NEW reproducible level (ls20 L1->L2; 55->56+) + trains the learned verifier. SCORE (A4):
  keep the refreshed package operator-resubmit-ready (beat 33). Plus self-learning persist+transfer (A5),
  integration into SUBMITTED_AGENT_CONFIG (A6), 2 infra (B1 live_action_efficiency co-headline metric / B2
  adversarial_verify hardening = intrinsic-reward-without-downstream-gain overclaim guard + self-supervised-CNN
  substrate floor), 1 hardware (C), 1 SOTA-ingestion (D), capstone (E). verifier_is_oracle: false on every value
  claim. Submission stays operator-only. 7 days to the ARC Prize Milestone #1 deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC; >=1 level-up
  attempt that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A3); 2 reserved infra (B1/B2); 1
  per-board hardware (C); 1 SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus.
  7 days to the ARC Prize Milestone #1 deadline ($25K). The frozen live generator is Qwen3.5-9B-MTP on the iGPU
  (NEVER the 3090s); any LLM arm declares live_llm_inference for that arm only."

