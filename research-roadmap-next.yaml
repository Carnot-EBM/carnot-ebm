  - id: exp2824
    milestone: "2026.05.267"
    deliverable: "results/experiment_2824_cross_corpus_verifier_matrix.json"
    title: "Cross-Corpus Per-Verifier Dual-Condition Discriminative Matrix"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 30
    track: analysis
    requires:
      - exp2820.condition_a_production_auroc_mean
      - exp2820.condition_b_architecture_only_auroc_mean
      - exp2821.condition_a_production_auroc_mean
      - exp2821.condition_b_architecture_only_auroc_mean
      - exp2822.condition_a_production_auroc_mean
      - exp2822.condition_b_architecture_only_auroc_mean
      - exp2823.condition_a_production_auroc_mean
      - exp2823.condition_b_architecture_only_auroc_mean
    prompt: |
      Read CLAUDE.md.

      TASK: Build a verifier × corpus × condition AUROC matrix (3-D)
      and classify each verifier in ensemble v7b into one of four
      categories per its cross-corpus + dual-condition behavior.

      CONCRETE STEPS:
        1. Load exp2820 (FoVer), exp2821 (MBPP), exp2822 (HumanEval),
           exp2823 (TruthfulQA) artifacts.
        2. Build dual matrix: verifier × corpus, separately for each
           condition. Per-cell learning-contribution = A - B.
        3. Classify FOUR verifier classes:
           - ARCHITECTURE_TRANSFER: condition-B AUROC >= 0.75 on ALL
             corpora (the true cross-corpus workhorses)
           - MEMORY_AUGMENTED: condition-A AUROC >= 0.75 but condition-B
             AUROC < 0.65 on FoVer (carry production headline but
             contaminated by self-learning)
           - CORPUS_SPECIFIC: high on one corpus, near-random elsewhere
             regardless of condition (e.g. Tier 0s arithmetic-only)
           - LOW_SIGNAL: AUROC < 0.65 across all corpus×condition cells
             (retirement candidates)
        4. Diversity-gap audit: how many ARCHITECTURE_TRANSFER verifiers
           cover each non-FoVer corpus?

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:'
          principle: "Terminal prefix."
        - verifier_corpus_dual_matrix: dict[verifier_id, dict[corpus, {production, architecture_only, delta}]]
          principle: "Full 3-D matrix; downstream paper-v6 §5 dual-condition table."
        - architecture_transfer_verifiers: list[str]
          principle: "Verifiers with condition-B AUROC >= 0.75 on ALL corpora — the cross-corpus workhorses, paper-v6 §5 headline."
        - memory_augmented_verifiers: list[str]
          principle: "Verifiers where production AUROC is high but architecture-only is low — FR-11 carries them. Must be disclosed in §5.1."
        - corpus_specific_verifiers: list[str]
          principle: "Verifiers that work on one corpus shape only."
        - low_signal_verifiers: list[str]
          principle: "AUROC < 0.65 everywhere — retirement candidates."
        - diversity_gap_on_non_fover: bool
          principle: "True if fewer than 3 architecture-transfer verifiers cover each non-FoVer corpus."
        - duration_s: float
          principle: "Pure analysis; expected 30-180s (no model inference)."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

