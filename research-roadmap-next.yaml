  - id: exp3728-bounded-checkpointed-train-ebt-and-ar
    milestone: "2026.06.341"
    title: "Bounded CHECKPOINTED training of the tiny EBT + a matched tiny AR baseline (same params-band, same corpus, same budget) on the 3090, with stability diagnostics (loss curve, convergence, NaN/divergence watch). Each task run trains a BOUNDED chunk (<=1500s wall) then checkpoints + exits so it fits the loop; resumes from checkpoint. THESIS-A bring-up step 4 (the GPU-budget half of the kill-gate)."
    priority: critical
    max_turns: 60
    agent_type: claude
    model: opus
    requires_claude: true   # EBT training is known finicky/unstable; diagnosing + stabilizing divergence is open-ended judgment under ambiguity, the most likely failure mode -- meets the requires_claude bar (operator directive 2026-06-02)
    estimated_wall_time_min: 30
    track: phase3
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: results/experiment_3728_bounded_checkpointed_train_ebt_and_ar.json
    prompt: |
      CONTEXT: Thesis-A bring-up, the GPU-budget half of the kill-gate. Train the tiny EBT AND a matched
      tiny AR baseline so .342 can compare them at matched compute. EBT training is FINICKY -- diagnosing
      and stabilizing instability IS the task. live gpu training. PRINT A HEARTBEAT every few steps so the
      idle-timeout never fires; bound EACH run to <=1500s wall-clock then CHECKPOINT + EXIT (resume from the
      checkpoint on the next run -- training spans multiple task runs by design).
      PRECONDITIONS (check BEFORE any step; if ANY missing -> blocked_<resource>, EXIT, no fabrication):
        a. CUDA available (torch.cuda.is_available(), device_count>0).
        b. EBT vendored + importable (carnot.phase3.ebt_upstream) AND exp3726 single-step smoke passed.
        c. Train corpus available (GSM8K subset from exp3726, cached).
      CONCRETE STEPS:
        1. Resume from the latest checkpoint if present; else init the tiny EBT + a matched-param tiny AR.
        2. Train a BOUNDED chunk (<=1500s wall OR a fixed step budget, whichever first) of BOTH models on the
           SAME corpus with the SAME optimizer budget. Log a loss heartbeat every K steps (PYTHONUNBUFFERED).
        3. Emit STABILITY DIAGNOSTICS: the loss curve (downsampled), whether the EBT energy/loss converged or
           diverged, any NaN/inf events, gradient-norm trend. If the EBT diverges, apply standard
           stabilizers (lr warmup/decay, grad clip, the upstream's recommended energy-regularization) and
           record what was tried -- this judgment is why this task is on claude.
        4. CHECKPOINT both models + the optimizer state + the step counter, then EXIT cleanly. Record
           cumulative_steps_trained so a later run / .342 knows the training progress.
      Set honest_verdict to a TERMINAL prefix that states the stability outcome of THIS chunk: stable-so-far,
      converged, or diverged. (The kill-gate VERDICT is exp3729's job -- this task reports the diagnostics.)
      INFERENCE-SUBSTRATE HYGIENE: live GPU training; full methodology (random_seed, reproducibility_checksum,
      model_specs naming BOTH tiny configs as from-scratch). Run `python scripts/adversarial_verify.py <artifact>`;
      confirm no critical flag.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; store the bare VALUE):
        honest_verdict:
          principle: "Terminal prefix stating THIS chunk's stability outcome (stable/converged/diverged); blocked_<resource> if a precondition failed."
        inference_substrate: "live_llm_inference (principle: real GPU training; strict floor, easily cleared)."
        cumulative_steps_trained:
          principle: "Records training progress across checkpoint-spanning runs so .342 knows how much budget was spent."
        ebt_loss_curve:
          principle: "Downsampled loss trajectory -- the direct evidence for whether EBT training is stable (the kill-gate's core question)."
        ar_loss_curve:
          principle: "The matched AR baseline's trajectory -- needed so .342's comparison is apples-to-apples (same corpus/budget)."
        ebt_converged:
          principle: "Boolean/:did the EBT energy/loss converge within budget -- the kill-gate part-(a) signal."
        nan_or_divergence_events:
          principle: "EBT instability is the most likely failure mode; recording NaN/divergence is the honest fail signal, not a hidden one."
        stabilizers_applied:
          principle: "What was tried to stabilize divergence -- the open-ended judgment that justifies routing this to claude; also tells .342 the recipe."
        peak_vram_mb:
          principle: "Confirms the bounded train stayed within the 3090's 24GB."
        preconditions_checked:
          principle: "CUDA + EBT-vendored + smoke-passed + corpus verified before training; pre-empts silent-missing-resource fabrication."
        model_specs:
          principle: "Names BOTH tiny configs (from-scratch, matched param-band) so the substrate + the comparison fairness are honest."
        random_seed:
          principle: "Determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "Content hash catches silent corpus/config drift."
        duration_s:
          principle: "Wall-clock plausibility floor; long real duration expected for training."
      TERMINAL VERDICT example: "complete: ebt_train_chunk_<steps>_steps_stable_so_far_loss_converging_no_nan_ar_baseline_co_trained_checkpointed"
      (or "complete: ebt_train_chunk_diverged_at_step_<N>_nan_after_<stabilizers>_kill_gate_part_a_failing" if it diverges)
      Run: cd {project_root} && python scripts/experiment_3728_bounded_checkpointed_train_ebt_and_ar.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

