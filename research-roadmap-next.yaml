    1. Create results/experiment_1428_dccd_schema_constrained_repair_v2.json immediately with status="in_progress".
    2. If public behavior changes, add or update OpenSpec REQ-* and SCENARIO-* before implementation code changes.
    3. Define a bounded repair schema that separates draft certificate, repair action, final certificate, and validator metadata.
    4. Add schema validation before semantic validation; every rejected candidate must record a rejection reason.
    5. Use the mandated SOTA GGUF models through the existing local cache path; record missing cache blockers instead of fabricating model results.
