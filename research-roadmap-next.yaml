      - results/experiment_3306_capstone_v305.json
      - scripts/experiment_template.py
      - ops/conductor-log.md

      TASK
      Diagnose the exact root causes behind the current critical quality flags and repair provenance blockers, then emit rerun requirements for .306.

      CONCRETE STEPS
      1. Enumerate all current quality flags on exp3300, exp3302, and exp3303.
      2. For TAUTOLOGY, determine whether the artifact conflated refusal rate, aligned false-positive rate, or derived metrics.
      3. For DURATION_TOO_SHORT, identify the referenced live-model markers and the evidence missing from runtime provenance.
      4. For repair substrate inconsistency, identify which fields disagree between the panel and audit.
      5. Write concrete acceptance requirements for exp3309, exp3312, and exp3316.

      REQUIRED ARTIFACT FIELDS:
      - quality_flag_autopsy_ready
      - analyzed_artifacts
      - garak_quality_flags
      - repair_quality_flags
      - root_cause_hypotheses
      - rerun_requirements
      - no_new_model_execution
      - honest_verdict

