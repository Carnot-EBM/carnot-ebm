    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc Phase 1 section

    TASK: Extend GGUFCacheResolver with download capability (huggingface-hub pull). Run
    25 HumanEval problems with Qwen3.6-35B-A3B-GGUF via live GPU. Produce artifact with
    signed_improvement and inference_mode=live_gpu.

