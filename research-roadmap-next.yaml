    - {project_root}/python/carnot/agentic/arc_induction_tools.py
    - {project_root}/python/carnot/agentic/arc_induction_tool_loop.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/python/carnot/agentic/arc_agi3_agent.py and production E3AgentPolicy route
    - {project_root}/ops/arc_solve_registry.yaml

    TASK:
    Run a same-game, same-seed paired comparison of inline object-table ON against table absent plus
    production find_objects fetch. Preserve the immutable live generator, public agent route,
    budgets, context, and seeds. Measure change_fidelity, transition utility, prompt tokens, tool
    use, and useful evidence. Do not claim a level solve.

    MODEL_SPECS:
    - unsloth/Qwen3.8-27B-GGUF: immutable scored ARC generator for both science arms.
    - unsloth/Qwen3.6-35B-A3B-GGUF: mandated SOTA same-task transport canary; run bounded call-shape
      rows only and never pool them with the scored Qwen3.8 result.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6752 arc_context_tool_preflight_ready == true, CUDA offload,
       cached exact Qwen3.8 and Qwen3.6 paths, task-owned 32K context, the exact 20 games/seeds and
       within-arm noise floor from the 2026-08-01 artifact, and a registry check proving no new or
       duplicate solve target. On failure emit complete_blocked_object_table_ab with
       gate_check_summary; do not change games, model, context, or denominator.
    1. Confirm or add a narrow REQ-* anchor in
       openspec/capabilities/arc-world-model-trust-energy/spec.md. Add focused tests for arm
       isolation, prompt construction, useful-fetch accounting, pairing, and no-solve claims.
    2. Freeze games, seeds, arm order, budgets, timeout, 32K context, generator configuration,
       production agent factory, and adoption thresholds before live runs.
    3. Baseline arm: current default inline object table. Treatment arm: omit the inline table and
       make bounded find_objects available through production selfparse. Change no other prompt or
       tool surface.
    4. Run Qwen3.8 on both arms. Run Qwen3.6 only as a bounded transport/control sidecar for the same
       query shape; keep its rows separate from science aggregates.
    5. Record raw prompt hash, prompt tokens, tool emissions, arguments, bounded results, whether
       fetched evidence entered later reasoning, transition result, change_fidelity, latency,
       actions, stop reason, and failure class per game/seed/arm.
    6. Compute paired change_fidelity and transition-utility deltas, confidence intervals, token
       savings, fetch rate, useful-fetch rate, and harmful regressions. Adoption requires positive
       token savings and change_fidelity non-inferiority within the pre-registered noise floor.
    7. Set object_table_ab_completed true only when every planned paired Qwen3.8 row and mandated
       Qwen3.6 sidecar row exists with valid provenance. Completion is not adoption.
    8. Run focused tests, ARC spec coverage, lint, row-consistency lint, and adversarial verification.
    9. REQUIRED ARTIFACT FIELDS: field_principles (entry for every field),
       inference_substrate (production E3AgentPolicy local CUDA GGUF), duration_s (monotonic),
       random_seed (all game/arm seeds), reproducibility_checksum (games/config/prompts/rows),
       models_used (exact roles), live_model_invoked (true), context_requested (32768),
       gpu_receipts (per load), rows (every game/seed/arm and sidecar),
       mean_prompt_token_savings (paired row result), useful_fetch_rate (row-derived),
       change_fidelity_delta (paired row result), change_fidelity_ci95 (paired interval),
       transition_utility_delta (paired row result), noninferiority_margin (frozen noise floor),
       adoption_gate_passed (all pre-registered conditions), object_table_ab_completed
       (all-row completion), solve_claim (false), gate_check_summary (failed check and observed
       value for blocked_*),
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial),
       and honest_verdict (allowed terminal prefix;
       complete_blocked_<reason> for owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6753_object_table_fetch_on_demand_ab.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.
