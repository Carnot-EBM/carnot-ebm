  - id: exp4359-prism-hardened-verifier-guided-search
    milestone: 2026.06.403
    title: "PHASE A1 (HEADLINE; convert the PROVEN moat into a generation GAIN, FIXED harness) -- PRISM-HARDENED VERIFIER-GUIDED DENOISING SEARCH (arXiv:2602.01842 VERIFIED, ICML 2026) using the .401 LEAK-ROBUST scorer. .402's S3 test (exp4348) was a HARNESS BUG, not a null: it framed the arms as multiple-choice SELECTION (pick option A/B/C/D from option-logits), so best-of-K/self-reward-SMC/unguided all collapsed to argmax-logit -> the three deltas were bit-identical (0.266667) -> CRITICAL TAUTOLOGY + controls_not_differentiable -> s3_moat_utility=OPEN. The conversion question (does the PROVEN leak-robust scorer INSIDE the denoising loop Pareto-improve generation at FIXED compute? -- the north-star §5 'verifier earns its place' realized in-generation) has NEVER been validly tested. FIX it: run a REAL token-by-token DENOISING-GENERATION loop on a free-form executable task (NOT MCQ selection), use Prism Hierarchical Trajectory Search (HTS, prune/reallocate compute in an early-to-mid denoising window) + Local branching with partial remasking (diverse implementations, preserve high-confidence tokens), with the .401 leak-robust scorer (exp4337 .pkl) as the EXTERNAL in-loop guidance. The DECISIVE test at FIXED NFE vs DIFFERENTIATED controls: (a) unguided single-pass, (b) best-of-N@matched-NFE (compute-matched must-beat), (c) Prism INTRINSIC Self-Verified Feedback / self-reward SMC (the model's OWN self-verification -- the SHARPEST oracle-distinct must-beat). Skeptic-proof by construction: the no-op DEGENERATE_CONTROLS guard (controls_differentiated), a metric-TAUTOLOGY guard (reject bit-identical deltas), an INDEPENDENT scorer leak re-check, branch-DIVERSITY receipts (Prism warns HTS can hide diversity collapse), and scorer-DISAGREEMENT rows (where the external scorer and intrinsic SVF disagree). Emit s3_guided_beats_control BARE bool := (S3-Carnot - best-of-N@NFE > 0 AND its CI95 excludes 0 AND controls_differentiated AND S3-Carnot - intrinsic-SVF > 0) at FIXED NFE, n>=80, >=3 seeds. verifier_is_oracle=false. A win = the moat graduates 'exists'->'useful' (Pareto-improves generation). A clean null (controls differentiated, scorer leak-free, but Carnot does NOT beat best-of-N/SVF) is decision-grade. NO TRAINING (test-time search only); NO TRM training; DiffusionGemma via the llama.cpp PR binary."
    priority: critical
    track: diffusiongemma-headline
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4359_prism_hardened_verifier_guided_search.json
    prior_failures:
      - experiment_id: exp4348-s3-stratified-verifier-guided-search
        verdict: controls_not_differentiable
        addressed_by: "exp4348 (.402) ran S3 stratified verifier-guided search but FRAMED THE ARMS AS MULTIPLE-CHOICE SELECTION (pick option A/B/C/D from option-logits), so best-of-K/self-reward-SMC/unguided collapsed to argmax-logit -> bit-identical deltas -> CRITICAL TAUTOLOGY + controls_not_differentiable (a HARNESS bug, not a science null). This attempt FIXES the harness three ways: (1) a REAL token-by-token DENOISING-GENERATION loop on a free-form executable task (the arms genuinely produce different completions), NOT MCQ selection; (2) Prism HTS + partial-remask branching (arXiv:2602.01842) as the search mechanism, with the external leak-robust exp4337 scorer as guidance and Prism intrinsic SVF as the sharpest oracle-distinct must-beat; (3) the no-op DEGENERATE_CONTROLS guard + a metric-TAUTOLOGY guard + branch-diversity receipts + scorer-disagreement rows so the controls are differentiated BY CONSTRUCTION. retire_if_same_verdict: true -- if the FIXED harness STILL returns controls_not_differentiable (the arms genuinely cannot be differentiated even with real generation + Prism HTS), the in-generation conversion direction is not measurable with our stack and retires; a CLEAN differentiated null (Carnot does not beat best-of-N/SVF) is a DIFFERENT, decision-grade verdict and does NOT trigger retirement."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: north-star §1 + §5 -- the in-generation oracle-distinct moat is PROVEN (exp4338, leak-robust, replicated)
      but its UTILITY is UNTESTED because the .402 conversion instrument (exp4348 S3) broke as a HARNESS (MCQ-selection
      framing -> controls collapsed -> TAUTOLOGY). The forward question is UTILITY: does the verifier improve generation
      at equal compute? Prism (arXiv:2602.01842, ICML 2026) is the efficient search mechanism: Hierarchical Trajectory
      Search + local branching with partial remasking, matching best-of-N at fewer NFE. Guide it with Carnot's EXTERNAL
      leak-robust scorer and use Prism's intrinsic Self-Verified Feedback (SVF) as the SHARPEST oracle-distinct must-beat
      (external verifier vs the model verifying itself). The operator was twice-burned on DiffusionGemma over-claims ->
      skeptic-proof by construction (differentiated controls, tautology guard, branch-diversity + leak + disagreement receipts).

      EXISTING CODE TO READ FIRST:
        - results/experiment_4348_s3_stratified_verifier_guided_search.json (the .402 HARNESS FAILURE -- read benchmark_records_preview to SEE the MCQ-selection collapse; do NOT repeat it)
        - results/experiment_4337_leak_robust_partial_state_scorer_build.json (scorer_module_path = results/dina_lrm_partial_state_scorer_exp4337.pkl, the external leak-robust scorer) + results/experiment_4338_in_generation_moat_replicate_leak_robust.json (the proven moat: the exact harness, controls, leak re-check, bootstrap)
        - results/experiment_4315_diffusiongemma_reward_guided_stitching.json (the .399 stitching harness -- the arms unguided/EntRGi/self-reward-SMC/Carnot; the no-op guard; the bootstrap CI)
        - scripts/exp_diffusiongemma_energy_prior_extract.py + results/diffusiongemma_energy_prior_extracted.json (the PR-binary call: ~/.cache/llama.cpp-master/build/bin/llama-diffusion-gemma-eval <gguf> <prompt_ids.i32> <canvas_ids.i32> <out_logits.bin>; canvas=256 mask tokens id=4; vocab 262144)
        - research-references.md (the .403 sweep: Prism HTS 2602.01842; self-reward SMC 2602.01849; S3 2604.06260)
        - scripts/experiment_template.py, scripts/adversarial_verify.py (DEGENERATE_CONTROLS + TAUTOLOGY), scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Pre-Launch Preconditions", "Inference-Substrate Declaration", "GGUF tokenizer rule", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: run a REAL Prism-hardened verifier-guided DENOISING-GENERATION search with the leak-robust scorer; report whether it beats the compute-matched + intrinsic controls at FIXED NFE, with controls differentiated by construction.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any inference):
           a. PR binary: `ls ~/.cache/llama.cpp-master/build/bin/llama-diffusion-gemma-eval` non-empty.
           b. DiffusionGemma GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--diffusiongemma-26B-A4B-it-GGUF/` non-empty. 1x RTX 3090 fits the Q4_K_M (16GB).
           c. The leak-robust scorer loads: `python3 -c "import pickle; pickle.load(open('results/dina_lrm_partial_state_scorer_exp4337.pkl','rb'))"` succeeds. If absent -> honest_verdict `blocked_leak_robust_scorer_unavailable` and STOP.
           d. Conductor stood-down on TRM training; this task does NO training of any kind (test-time search only).
           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate inference.
        1. FRAMING FIX (the load-bearing change vs exp4348): run a REAL token-by-token DENOISING-GENERATION loop on a
           FREE-FORM executable task (math/code generation over a denoising canvas), NOT a multiple-choice option pick.
           Each arm must genuinely produce a DIFFERENT completion. Verify the arms diverge BEFORE scoring (the no-op guard, step 3).
        2. INDEPENDENT LEAK RE-CHECK on the scorer (re-ablate the answer cells); if it now leaks -> scorer_leak_recheck_passed=false + honest_verdict `scorer_leaky_in_search_corpus` and STOP.
        3. NO-OP GUARD + TAUTOLOGY GUARD: smoke that each arm CHANGES the generated tokens; if any two arms tie bit-identically OR any two delta metrics agree to >5 sig figs -> controls_differentiated=false + honest_verdict `controls_not_differentiable` and STOP (do NOT report a TAUTOLOGY-flagged result).
        4. WINDOW DISCIPLINE: synchronous, checkpoint after every seed, print per-arm/per-seed progress (codex idle-timeout fix). FIX an NFE (denoising-step x candidate) budget B. Run the arms at the SAME B: (a) unguided single-pass; (b) best-of-N@B (N independent samples + final selection, N chosen so total NFE == B); (c) intrinsic Self-Verified-Feedback / self-reward SMC@B (the model's own self-evaluation -- NO external scorer); (d) Prism-Carnot@B (HTS + partial-remask local branching + the leak-robust-scorer scoring the frontier). n>=80, >=3 seeds. Report per-arm accuracy + S3-Carnot minus each control + task-level bootstrap CI95 (>=2000 resamples) of (S3-Carnot - best-of-N@NFE), PLUS branch_diversity (unique completions per frontier) + scorer_disagreement_rate (external scorer vs intrinsic SVF).
        5. Emit s3_guided_beats_control BARE bool := (S3-Carnot - best-of-N@NFE > 0 AND its CI95 excludes 0 AND controls_differentiated AND S3-Carnot - intrinsic-SVF > 0). Run adversarial_verify.py (must be CLEAN -- no TAUTOLOGY; verifier_is_oracle=false). Declare random_seed + reproducibility_checksum + model_specs (GGUF + PR binary + the leak-robust scorer + the Prism/HTS config + N + NFE budget B + the controls + n + seeds).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A generation gain (Carnot beats the compute-matched + intrinsic controls at fixed NFE -- moat is USEFUL), a CLEAN powered null (controls differentiated + scorer leak-free, but Carnot does not beat best-of-N/SVF -> the in-generation scale-up retires), a controls_not_differentiable (the harness STILL cannot differentiate the arms -> direction retires), and a scorer_leaky_in_search_corpus are ALL decision-grade."
        s3_guided_beats_control:
          principle: "BARE bool: the capstone reads this (gated-fields-must-be-bare); true iff Carnot-guided search beats best-of-N@matched-NFE AND CI95-excl-0 AND controls_differentiated AND beats intrinsic SVF -- the moat graduating from 'exists' to 'useful' (Pareto-improves generation at equal compute)."
        s3_minus_best_of_n_delta:
          principle: "BARE float: Carnot minus best-of-N at matched NFE -- the headline Pareto claim (more accurate at equal compute)."
        s3_minus_intrinsic_svf_delta:
          principle: "BARE float: Carnot minus intrinsic Self-Verified-Feedback -- the sharpest oracle-distinct test (external leak-robust verifier vs the model verifying itself)."
        s3_gain_ci95:
          principle: "Task-level bootstrap CI95 (>=2000 resamples) of the Carnot minus best-of-N@NFE delta -- excluding 0 is the decision-grade gain."
        nfe_budget:
          principle: "BARE int: the FIXED denoising-compute (NFE) budget held equal across all arms -- the compute-matching that makes the Pareto claim honest."
        controls_differentiated:
          principle: "BARE bool: true iff no two arms tie bit-identically AND no two delta metrics agree to >5 sig figs (the no-op + tautology guards that exp4348 failed)."
        branch_diversity:
          principle: "Per-frontier unique-completion count -- Prism warns HTS can hide diversity collapse; a collapsed frontier invalidates a gain."
        scorer_disagreement_rate:
          principle: "BARE float: fraction of cases where the external leak-robust scorer and intrinsic SVF pick different frontiers -- the external verifier only adds value where it DISAGREES with self-verification."
        scorer_leak_recheck_passed:
          principle: "BARE bool: the independent leak re-check of the scorer on the search corpus -- true iff its signal SURVIVES masking the answer cells."
        benchmark_n:
          principle: "BARE int: per-arm n -- MUST be >= 80 (power)."
        verifier_is_oracle:
          principle: "BARE bool=false -- the leak-robust reward head is oracle-distinct (NOT the executable oracle)."
        preconditions_checked:
          principle: "Records the PR-binary + GGUF + leak-robust-scorer + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the denoising + search + bootstrap."
        reproducibility_checksum:
          principle: "Hash of the search corpus + the Prism config + the controls + PR-binary inputs; lets a third party re-run."
        model_specs:
          principle: "DiffusionGemma GGUF + PR binary + the leak-robust scorer + the Prism/HTS config + the best-of-N/intrinsic-SVF baselines + the NFE budget + denoising steps + n + seeds; required methodology."
      ACCEPTANCE GATE:
        - condition: "s3_guided_beats_control + s3_minus_best_of_n_delta + s3_minus_intrinsic_svf_delta + s3_gain_ci95 + nfe_budget + controls_differentiated + branch_diversity + scorer_disagreement_rate + scorer_leak_recheck_passed + benchmark_n (>=80) reported with verifier_is_oracle=false and preconditions_checked and adversarial_verify CLEAN (no TAUTOLOGY), OR an honest blocked_leak_robust_scorer_unavailable / controls_not_differentiable / scorer_leaky_in_search_corpus / clean-powered-null verdict"
          principle: "A fixed-NFE generation gain from putting the proven oracle-distinct scorer inside a REAL denoising loop (vs best-of-N AND the model's own self-verification) converts the moat from a measurement to a Pareto-improvement of generation -- the north-star §5 win condition realized in-generation; a clean powered null retires the in-generation scale-up direction (decision-grade)."

      Run: `python3 {project_root}/results/experiment_4359_prism_hardened_verifier_guided_search.py`
