      (n_descent_steps); research-references.md '.343 additions' (arXiv:2408.03314 FLOP-matched template,
      arXiv:2511.05562 NFE accounting, arXiv:2503.21878 fair best-of-N).
      PRECONDITIONS (check BEFORE the comparison; if ANY missing -> blocked_<resource>, EXIT, no fabrication, NO CPU FALLBACK):
        a. INTERPRETER: run under .venv/bin/python; torch importable.
