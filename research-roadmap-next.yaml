      covariance Sigma (the P0.2 diversity keystone). A fitted law is not a validated deployment.
      This task DEPLOYS the law: in a closed FR-11 self-improvement loop, MEASURE lambda_min,
      SET beta = f(lambda_min) per the formula, run to N>=200, and confirm it prevents collapse
      vs controls. Independent precedent: ER-PRM (arXiv:2412.11006) entropy regularization
      stabilizes PRM training. Cached traces + cached verifier scoring -> no live model -> no
      timeout. This is the milestone's mandatory continuous-self-learning experiment, fused with
      the P0.2 diversity keystone.

