         Metropolis-Hastings filter for FST token acceptance:
           accept_prob(token, energy_before, energy_after) = min(1, exp(-(energy_after - energy_before)))
           If energy_after > energy_before: accept with probability exp(-delta_E)
           If energy_after <= energy_before: always accept
         Use Carnot's Ising energy evaluator as the energy function.

