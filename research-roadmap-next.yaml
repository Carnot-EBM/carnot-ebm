  - id: exp4392-verifiable-process-data-localizer
    milestone: 2026.06.406
    title: "PHASE A1 (HEADLINE; oracle-distinct LOCALIZER; verifier_is_oracle=false) -- VERIFIABLE PROCESS DATA SYNTHESIS + contrastive earliest-error LOCALIZER (arXiv:2605.02395 VERIFIED 'Controllable and Verifiable Process Data Synthesis for Process Reward Models', the .405 SOTA-ingestion flagged_for_v406). .405 (exp4381) PROVED the detector DETECTS trace-level errors (AUROC 0.92-0.98) but CANNOT LOCALIZE the earliest causal error (first-error F1 0.096, IDENTICAL across unidirectional/bidirectional/causal -> bidirectional fusion is a measured no-op, delta CI95 [0,0], 103/114 missed). The paper's OWN finding: 'first-error localization remains substantially more challenging than overall step classification' -- the .405 null is a DATA problem (no ground-truth first-error supervision), NOT a fusion-method problem. THE FIX: SYNTHESIZE verifiable process data -- (1) take/construct a correct symbolic reasoning chain, (2) inject a template-aware error at a KNOWN intermediate step, (3) recompute subsequent steps under the corrupted state, (4) VERIFY the injected step is NOT derivable from its prefix (prefix-invalid, trajectory-consistent) -> ground-truth earliest-error labels. Train a CONTRASTIVE earliest-error localizer on those labels. EVALUATE first-error localization F1 on a HELD-OUT REAL FoVer split AND the GAP-4 ARC split vs the .405 ensemble baseline (0.096). (5) ABSTENTION: report a STRUCTURED report/abstain signal (Prover-Verifier-Deliberation 2605.25133 -- accept only localizer verdicts that survive a bounded checkable-subclaim challenge) alongside the raw-threshold risk-coverage curve. Emit localizer_beats_ensemble_baseline BARE bool := (the synthetic-data-trained localizer's first-error F1 on the HELD-OUT REAL split exceeds the .405 ensemble baseline 0.096, delta CI95-excl-0, on >=1 domain). verifier_is_oracle=false (a learned localizer scored against ground-truth-labeled candidates; the symbolic/executable check defines correctness, the localizer estimates WHICH step -- oracle-distinct). A win = the detector graduates 'detects'->'localizes the earliest error', cross-domain; a clean null (synthetic data does not transfer to the real first-error distribution) is decision-grade + logs the residual as a missing-verifier gap. Cached + CPU; symbolic synthesis needs no live LLM. NO TRM training."
