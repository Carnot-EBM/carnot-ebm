  - id: exp4281-diffusiongemma-energy-guided-full-run
    milestone: 2026.06.396
    title: "PHASE A1 (THE HEADLINE; the deferred-from-.395 scale-up, gate now OPEN) -- DiffusionGemma energy-guided FULL benchmark with matched no-Carnot-verifier controls. The .395 capstone flipped diffusiongemma_full_run_gate=True (hardened_win=True AND exp4274 preflight_go=True). RUN the full benchmark via the llama.cpp PR binary (~/.cache/llama.cpp-master/build/bin/llama-diffusion-gemma-eval -- the ONLY working loader). Wire the verifier ensemble as a per-step GUIDANCE energy reweighting denoising token selection. On n>=30 per arm: HEADLINE/oracle-distinct arm (verifier_is_oracle=false) = a LEARNED energy verifier guiding on a REASONING domain (FoVer-step/math, where the verifier is NOT the executable oracle) vs unguided vs RFG (arXiv:2509.25604, the model's own log-likelihood-ratio self-guidance -- the NO-external-verifier control) vs EntRGi (arXiv:2602.05000); emit diffusiongemma_guidance_moat BARE bool := (Carnot-guided - RFG > 0 AND CI95-excl-0). SUPPORTING/execution-grounded arm (verifier_is_oracle=true) = an executable-oracle verifier on code/Sudoku, reported as execution_grounded (cheap/automatic/decentralized, NOT a moat). If the learned verifier cannot score partial (masked) denoising states, that is an HONEST finding (the moat arm blocks; the control comparison + execution-grounded arm still land). NO TRM training; NO leaderboard submission."
    priority: critical
    track: diffusiongemma-scaleup
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-13/2026-06-14 gated forward-queue (DiffusionGemma) NOW RESOLVABLE: the .395 capstone (exp4279) flipped diffusiongemma_full_run_gate=True (hardened_win=True on all 3 axes AND exp4274 preflight_go=True), which is exactly the spec gate (diffusiongemma-energy-guided-diffusion-spec.md THE GATE: activate when an oracle-distinct learned-verifier win lands with a matched control, CI95-excl-0). False-positive scope-match vs the retired EDLM/energy-guided preflight lineage (exp3793) and the .395 preflight (exp4274, which SUCCEEDED); forward difference = the FULL benchmark the .395 roadmap explicitly DEFERRED to .396, now activatable, run WITH matched RFG/EntRGi no-Carnot-verifier controls. verifier_is_oracle declared per-arm honestly."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4281_diffusiongemma_energy_guided_full_run.json
    prior_failures:
      - experiment_id: exp4260-diffusiongemma-energy-guided-preflight
        verdict: blocked_diffusiongemma_gguf_loader_failed
        addressed_by: "exp4260's preflight blocked because the discrete-diffusion GGUF loader failed; exp4274 (.395) REPAIRED it (loader_repaired=true, preflight_go=true) via the llama.cpp PR binary llama-diffusion-gemma-eval. This task runs ON that repaired loader path -- the root cause (broken loader) is fixed upstream, confirmed by the PR-binary preflight, not assumed."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: north-star §5 -- energy VERIFIES, refinement GENERATES. .395 proved the verifier RANKS candidates
      from unseen families (the post-hoc selection moat). This task asks the deeper question: does the EXTERNAL
      energy verifier improve GENERATION when wired into a 26B discrete-diffusion LLM's denoising loop -- beating
      the model's OWN reward-free self-guidance (RFG)? The gate is OPEN (diffusiongemma_full_run_gate=True). The
      operator was TWICE-BURNED by premature DiffusionGemma over-claims, so this run is gated on matched
      no-Carnot-verifier controls (unguided / RFG / EntRGi) and per-arm verifier_is_oracle honesty -- a "win"
      requires beating RFG with CI95-excl-0 using a LEARNED (oracle-distinct) verifier, NOT just beating unguided
      and NOT a circular execution-grounded win. Methods: RFG log-likelihood-ratio guidance (arXiv:2509.25604),
      EntRGi entropy-aware guidance (arXiv:2602.05000), EDLM energy-reweighted denoising (arXiv:2506.13759).

      EXISTING CODE TO READ FIRST:
        - results/experiment_4274_diffusiongemma_loader_fix_preflight.json (the repaired loader + guidance hook: how it wired the verifier as per-step energy; preflight_go, guidance_changes_selection, full_run_cost_estimate_s)
        - scripts/exp_diffusiongemma_energy_prior_extract.py + results/diffusiongemma_energy_prior_extracted.json (the PR-binary call: llama-diffusion-gemma-eval <gguf> <prompt_ids.i32> <canvas_ids.i32> <out_logits.bin>; canvas=256 mask tokens id=4; vocab 262144 -> the (256,262144) energy-prior)
        - docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md (THE GATE + the guidance design)
        - python/carnot/verify/ (the verifier ensemble to wire as the guidance energy; the LEARNED verifiers for the oracle-distinct arm vs the EXECUTABLE oracle for the execution-grounded arm)
        - scripts/experiment_template.py (cached_sota_pair), scripts/adversarial_verify.py, scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Pre-Launch Preconditions", "Inference-Substrate Declaration", "GGUF tokenizer rule", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: run the DiffusionGemma energy-guided full benchmark; report guided-vs-controls deltas + the moat verdict.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any inference):
           a. PR binary: `ls ~/.cache/llama.cpp-master/build/bin/llama-diffusion-gemma-eval` returns non-empty (confirmed 2026-06-16).
           b. DiffusionGemma GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--diffusiongemma-26B-A4B-it-GGUF/` non-empty (confirmed 2026-06-16). 1x RTX 3090 fits the Q4_K_M (16GB).
           c. The conductor is stood-down on TRM training; this task does NO training and does NOT touch results/trm_runs/.
           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate inference.
        1. Build the guidance harness on the repaired PR-binary path: extract the per-position energy-prior, wire
           the verifier ensemble as a per-step guidance energy reweighting token selection (the exp4274 hook).
           Confirm guidance_changes_selection on a 2-example smoke before the full run.
        2. HEADLINE / oracle-distinct arm (verifier_is_oracle=false): on a REASONING corpus (FoVer-step / math,
           n>=30), run four conditions -- unguided, RFG (arXiv:2509.25604 log-likelihood-ratio self-guidance),
           EntRGi (arXiv:2602.05000), Carnot-verifier-guided (a LEARNED energy verifier, NOT the executable oracle).
           Report per-condition accuracy/pass + the Carnot-minus-RFG and Carnot-minus-unguided deltas + task-level
           bootstrap CI95 (>=2000 resamples). Emit diffusiongemma_guidance_moat BARE bool := (Carnot-guided - RFG
           > 0 AND its CI95 excludes 0). If the learned verifier cannot score partial/masked denoising states ->
           honest_verdict `complete_diffusiongemma_learned_verifier_cannot_score_partial_states` with the diagnosis
           (the moat arm blocks; still report the unguided/RFG/EntRGi control comparison + the execution-grounded arm).
        3. SUPPORTING / execution-grounded arm (verifier_is_oracle=true): on code/Sudoku (n>=30), guide with an
           EXECUTABLE-oracle verifier; report execution_grounded_guidance_delta. Frame as cheap/automatic/decentralized,
           explicitly NOT a moat (circular -- the verifier IS the oracle).
        4. Run adversarial_verify.py (clean). Declare random_seed + reproducibility_checksum + model_specs
           (DiffusionGemma GGUF id + the PR binary + the verifier ensemble + denoising step count + the corpora).
           Plausible duration (live 26B inference -- minutes, DURATION floor applies). Checkpoint periodically; an
           HONEST partial (>=30 per arm on the headline arm) is fine. NO leaderboard submission.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A guidance moat (learned-verifier beats RFG, CI95-excl-0), a bounded null (ties RFG), and a partial-state-blocked finding are ALL COMPLETE and decision-grade for the §5 thesis."
        diffusiongemma_guidance_moat:
          principle: "BARE bool: the capstone reads this (gated-fields-must-be-bare); true iff the LEARNED (oracle-distinct) verifier-guided run beats RFG model-self-guidance AND CI95-excl-0 -- the moat-scissor realized in generation at LLM scale."
        carnot_minus_rfg_delta:
          principle: "BARE float: Carnot-verifier-guided minus RFG accuracy on the reasoning corpus -- the load-bearing comparison (beating the model's own self-guidance is what shows an EXTERNAL verifier adds value in-generation)."
        carnot_minus_unguided_delta:
          principle: "BARE float: Carnot-verifier-guided minus unguided -- the weaker control (a guidance hook that does anything beats unguided; the moat needs the RFG comparison too)."
        guidance_moat_ci95:
          principle: "Task-level bootstrap CI95 of the Carnot-minus-RFG delta -- excluding 0 means the external verifier genuinely steers generation better than model self-guidance."
        execution_grounded_guidance_delta:
          principle: "The executable-oracle arm's guided-minus-unguided delta -- valid but CIRCULAR (verifier_is_oracle=true); framed as cheap/automatic/decentralized, NOT a moat headline."
        verifier_is_oracle:
          principle: "BARE bool: declared PER ARM (false for the learned-verifier headline arm, true for the execution-grounded arm) -- honoring the Circularity Discipline so a circular guidance win cannot headline."
        preconditions_checked:
          principle: "Records the PR-binary + GGUF cache + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the denoising + bootstrap."
        reproducibility_checksum:
          principle: "Hash of the corpora + guidance config + PR-binary inputs; lets a third party re-run."
        model_specs:
          principle: "DiffusionGemma GGUF id + the PR binary + the verifier ensemble wired as guidance + denoising steps + the four conditions + the corpora; required methodology."
      ACCEPTANCE GATE:
        - condition: "diffusiongemma_guidance_moat + carnot_minus_rfg_delta + guidance_moat_ci95 + execution_grounded_guidance_delta reported with per-arm verifier_is_oracle declared and preconditions_checked, OR an honest blocked_/partial-state verdict"
          principle: "The deferred scale-up answers the deepest open §5 question (does the external verifier improve GENERATION, beating model self-guidance) with matched controls + circularity honesty -- defusing the twice-burned over-claim trap mechanically."

      Run: `python3 {project_root}/results/experiment_4281_diffusiongemma_energy_guided_full_run.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4282-arcgen-cross-family-stress
    milestone: 2026.06.396
    title: "PHASE B1 (HARDEN the cross-family win on a 2nd, construction-disjoint substrate) -- ARC-GEN family-disjoint cross-family stress. .395 proved cross-family generalization (exp4271 +0.4038 held-out) but on ONE substrate (the recovered 52-task manifest), inviting the 'specific to your partition' critique. ARC-GEN (arXiv:2511.00162, github.com/google/ARC-GEN) is Google's mimetic procedural generator faithfully covering ALL 400 ARC-AGI-1 + 500 ARC-AGI-2 tasks, each a parameterized generator with a NATIVE family id -- an INDEPENDENT family substrate. Clone it (GITIGNORED -- no embedded-repo gitlink), build a family-disjoint candidate pool with native family ids + exact target hashes, train the set-encoder on train-families, test beats-vote on HELD-OUT generator-families. Report cross_family_delta SEPARATELY on original-ARC / ARC-TGI / ARC-GEN families (the generators-become-their-own-distribution failure mode) + a randomized family-rich stress split (arXiv:2601.18217). Emit arcgen_cross_family_holds BARE bool := (held-out-family delta>0 AND CI95-excl-0 on the ARC-GEN families). verifier_is_oracle=false. HARD-CAP to the window; an honest partial pool (>=4 families, >=~10 held-out tasks/fold) is fine."
