    track: verifier-reward
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4198_verifier_reward_3arm_rft_launch.json
    gated_on:
      - upstream: exp4197-verifier-reward-phase0-headroom-harness-build
        artifact_field: phase0_precision
        op: '>='
        value: 0.85
      - upstream: exp4197-verifier-reward-phase0-headroom-harness-build
        artifact_field: harness_ready
        op: '=='
        value: true
    prior_failures:
      - experiment_id: exp4089-verifier-reward-rft-train
        verdict: blocked_gate_check_failed
        addressed_by: "exp4089 blocked because its upstream corpus-build runner was not ready. This task is gated_on A1 harness_ready==true AND phase0_precision>=0.85 (a clean, built harness on a Phase-0-clearing code operating point), and uses on-policy generation (not the off-policy p01-distill that the 2026-06-08 discipline retired as truncation-confounded)."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: THE decisive verifier-as-reward training. A1 found a CODE operating point where the execution
      verifier clears Phase-0 (precision>=0.85) with Youden J>0 and the base has training headroom. Now launch
      the de-confounded 3-arm on-policy LoRA-RFT. The LOAD-BEARING contrast is A vs B: B is the SAME generator's
      random-label / non-certified traces (|B|=|A|) -- exactly the Spurious-Rewards control (arXiv:2506.10947:
      random labels recover ~74% of RLVR gains on Qwen). If A>>B the verifier's LABEL carries signal; if A~=B
      it is just distillation/spurious-reward. This is a long GPU run -> LAUNCH backgrounded and let A3 collect;
      do NOT hold the agent past the 80-min cap (split-long-codex + powering-run-accumulate disciplines).

      EXISTING CODE TO READ FIRST:
        - results/experiment_4197_verifier_reward_phase0_headroom_harness_build.json (operating_point, the built runner, phase0_precision, youden_j)
        - the on-policy 3-arm runner committed by A1 (the harness)
        - ops/known-issues.md: TRUNCATION GUARD (<5%), GOLD-CONTROL GATE (Arm C must stay >= base or the harness is broken), STATISTICAL-POWER discipline (seed torch generation, >=100 eval Q, >=3 seeds), POWERING-RUNS-MUST-ACCUMULATE (resume-not-restart, setsid-detach)
        - scripts/experiment_template.py (setup_gpu pre-warm before timed inference)

      TASK: launch the 3-arm (+cold) on-policy LoRA-RFT backgrounded; report launch + checkpoint status.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE launching): A1 reported phase0_precision>=0.85 AND harness_ready=true.
           If the gate fields are missing/below threshold -> honest_verdict
           `complete_verifier_reward_train_deferred_no_clean_operating_point` and STOP. CUDA available
           (`python3 -c "import torch; assert torch.cuda.is_available()"`), else `blocked_cuda_unavailable`.
        1. Build the on-policy corpora from the SAME generator at the A1 operating point: Arm A =
           visible-test-perfect (execution-certified) own-traces; Arm B = same-generator non-certified /
           random-label traces, |B|=|A| (the spurious control); Arm C = hidden-test-gold (oracle); Arm D = cold
           base (no train). Seed torch generation (reproducibility). Resume the STABLE (corpus+base+config-keyed)
           checkpoint if a prior window exists (accumulate, do NOT restart).
        2. LAUNCH identical-config LoRA-SFT for arms A/B/C BACKGROUNDED (setsid-detach so it survives the
           iteration boundary), with per-arm checkpoints. Held-out hidden-test eval instrumented with the
           truncation guard. Do NOT block the agent for the full train -- launch, verify the process is alive +
           checkpointing, and return.
        3. Report launch status, the stable checkpoint path, accumulated-N so far, and the gold-control
           early read (Arm C vs base) if available.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A clean launch + live checkpointing is COMPLETE for this split half; an honest gated deferral when A1 found no clean operating point is also COMPLETE."
        training_launched:
          principle: "BARE bool: the 3-arm LoRA-RFT is running detached and checkpointing; A3's collect gate depends on it."
        stable_checkpoint_path:
          principle: "The corpus+base+config-keyed checkpoint A3 reads + future windows resume (resume-not-restart, NOT exp-id-keyed)."
        arm_corpus_sizes:
          principle: "{{A,B,C}} N-matched counts -- |A|=|B| is the de-confound precondition (the spurious-reward control must be size-matched to the certified arm)."
        gold_control_early_read:
          principle: "Arm C vs base early signal -- if gold-SFT degrades below base the HARNESS is broken (over-fit/forgetting); A3 must NOT report A-vs-B until the gold control passes."
        model_specs:
          principle: "The NON-Qwen base + the on-policy generator; required methodology for a live-LLM training artifact."
        random_seed:
          principle: "Determinism precondition; torch generation + LoRA init seeded so the run is reproducible across windows."
        reproducibility_checksum:
          principle: "Hash of the corpora + LoRA config; lets A3 / a third party confirm the same training inputs."
      ACCEPTANCE GATE:
        - condition: "training_launched true with stable_checkpoint_path + N-matched arm_corpus_sizes, OR an honest gated deferral verdict"
          principle: "The decisive test must actually be running on N-matched arms with the gold control instrumented; otherwise honestly defer."

      Run: `python3 results/experiment_4198_verifier_reward_3arm_rft_launch.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4199-verifier-reward-decisive-a-vs-b-collect
    milestone: 2026.06.389
    title: "PHASE A3 (COLLECT, gated_on A2 training_launched) -- the DECISIVE A-vs-B verdict. Poll the backgrounded 3-arm run; the LOAD-BEARING GATE is A (verifier-certified) vs B (same-generator random-label, the spurious control) on held-out hidden-test pass@1: bootstrap CI95 excludes 0? YES -> the verifier's LABEL carries training signal beyond distillation/spurious-reward -> verifier-as-reward is REAL (the project's first clean positive). A~=B -> 'RFT helps' is just distillation/spurious-reward; the verifier adds nothing (honest NULL, NOT a partial win). Secondary: A-vs-C (label-free >= oracle?), A-vs-D (any lift?). Gold-control gate (C>=base) + truncation guard (<5%) MUST pass or the result is INVALID. Apply the accumulate-floor (3 no-usable-data windows -> auto-retire)."
