  - id: exp6323-v545-terminal-transition
    milestone: "2026.08.545"
    deliverable: results/experiment_6323_v545_terminal_transition.json
    title: "Exact terminal-boundary handoff from V544 into V545"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 45
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6322-v544-adversarial-capstone
