    and, for games whose winning L1 prefix is offline-banked as GROUND TRUTH (proposer BLIND to it),
    measure whether the proposer ever EMITS the winning prefix within the standard action budget.
    Decompose every miss into COVERED / ENUMERATED-BUT-LOST / NEVER-ENUMERATED. Positive control: a
