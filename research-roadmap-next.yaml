      4. If no mandated model is usable, write an honest diagnostic/precondition-blocked artifact that preserves fixture metadata and blocks headline lift.
      5. Report per-bucket false accepts, false rejects, recall, precision, live lift over solver-only routing where meaningful, and repair_gate_state.
