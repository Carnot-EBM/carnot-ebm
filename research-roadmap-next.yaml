        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Project root: {project_root}. Run date: {date}.
        .275 produced matrix v9 and a capstone with useful paper boundaries, but
        both were adversarially flagged because aggregation-only artifacts
        inherited compute-bound markers from upstream live-model rows. This task
        repairs metadata and provenance only; it must not rerun any LLM or
        hardware experiment.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (Verifier Authenticity; Failed-Experiment Rerun Discipline)
        - results/experiment_2921_cross_corpus_matrix_v9_paper_boundary_v1.json
        - results/experiment_2922_capstone_v275.json
        - scripts/adversarial_artifact_audit.py
        - research-references.md (2026-05-23 Post-.275 Planning Sweep)

      TASK:
        Write a corrigendum artifact that makes the aggregation-only nature of
        matrix v9 and the .275 capstone explicit, computes source checksums,
        and states exactly which upstream rows remain flagged versus which flags
        were metadata false positives.

      CONCRETE STEPS:
        0. PRECONDITION: if either exp2921 or exp2922 artifact is missing,
           write blocked_upstream_artifact_missing and exit.
        1. Load both upstream JSON artifacts.
        2. Compute SHA256 checksums for all source artifacts directly consumed
           by exp2921 and exp2922.
        3. Build an aggregation_provenance table with:
           artifact_path, checksum, row_role, source_inference_substrate, and
           whether the current task reran any compute. The answer must be false.
        4. Separate upstream row flags from current-artifact flags. Do not erase
           the fact that exp2911, exp2919, and exp2921 were flagged in .275.
        5. Run the local adversarial artifact audit if available. If it still
           flags the corrigendum, record the exact audit findings and write
           aggregation_metadata_clean: false.
