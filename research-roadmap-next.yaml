      - upstream: exp3093-cross-corpus-matrix-v22
        artifact_field: matrix_v22_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3080-capstone-v287
        verdict: "complete: capstone_ready=true; paper_ready=false; publication_blocker_count=42"
        addressed_by: "Summarizes .288 blocker movement and preserves paper_ready=false unless matrix v22 has no blockers."
        retire_if_same_verdict: true
      - experiment_id: exp3066-capstone-v286
        verdict: "complete: capstone_ready=true; paper_ready=false; publication_blocker_count=33"
        addressed_by: "Maintains strict capstone honesty across repeated non-paper-ready milestones."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Capstone .288 is the final authority for this milestone. It must use matrix v22 and keep claim boundaries strict.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-program.md
      - _bmad/prd.md
      - _bmad/architecture.md
      - results/experiment_3093_cross_corpus_matrix_v22.json
      - results/experiment_3080_capstone_v287.json
      - ops/status.md
      - ops/changelog.md
      - ops/conductor-log.md

      TASK
      Write the .288 capstone artifact, summarize what moved, and define the next-milestone recommendation without inflating claims.

      CONCRETE STEPS
      1. Load matrix v22 and all capstone input artifacts named by exp3093.
      2. Summarize results by PRD gap: verifier/repair, FR-11, EBT/ARM bridge, hardware evidence, and publication readiness.
      3. Set paper_ready=true only if publication_blocker_count is zero and headline claims have exact-grounded evidence.
      4. Preserve blocked/gated/bounded/projection-only statuses exactly.
      5. Recommend the next milestone from the remaining highest-impact blockers.

      REQUIRED ARTIFACT FIELDS:
      - capstone_ready: bool (principle: milestone closure must be explicit)
      - paper_ready: bool (principle: paper readiness must be earned by matrix evidence)
      - publication_blocker_count: int (principle: blocker count is the paper gate)
      - verifier_gain_status: str (principle: verifier claim must match exact evidence)
      - repair_claim_status: str (principle: repair claim must remain gated by verifier evidence)
      - fr11_self_learning_status: str (principle: continuous learning claim must preserve soundness/completeness boundaries)
      - ebt_arm_status: str (principle: sidecar/schema work must not imply model integration)
      - gatemate_status: str (principle: hardware evidence must not imply speedup)
      - ssqa_status: str (principle: readback claims need host-visible evidence)
      - next_milestone_recommendation: str (principle: carry-forward must be actionable)
      - source_artifacts: list (principle: capstone must cite concrete authorities)
      - inference_substrate: dict (principle: aggregation work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
