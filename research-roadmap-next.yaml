      verdict: repeated_grpo_vprm_marginal_no_improvement_or_non_headline_results
      addressed_by: "This task consolidates the lineage into one retirement artifact and updates the exclusion manifest instead of proposing GRPO v15."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The scope-reduction directive identifies GRPO/VPRM v1-v14 as a noisy
    lineage with repeated marginal, no-improvement, or non-headline verdicts.
    The goal is not another GRPO variant; it is consolidation and retirement.
    Use {project_root} as the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
