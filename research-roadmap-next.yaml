    11. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Versioned plain top-level schema, experiment_id, milestone and terminal status."
       - run_date: principle: "Use {date}, with actual UTC start/end and monotonic timing."
       - preconditions_checked: principle: "Exact resource/path/identity checks and observed values before dependent work."
       - MODEL_SPECS: principle: "Every current LLM uses unsloth/Qwen3.8-27B-GGUF; [] for no current LLM."
       - model_invoked: principle: "True only for actual current attempted model use; archives and scripted transport are false."
       - invocation_counts: principle: "Actual owned current load/generation attempted/completed/failed/cancelled/in-flight counts."
       - inference_substrate: principle: "Truthful string; device detail belongs in inference_substrate_details."
       - inference_substrate_class: principle: "Actual current compute class, never padding or historical inference."
       - execution_venue: principle: "Closed string host; CPU/CUDA and external board identities are separate details."
       - duration_s: principle: "Measured current work, with validation/model/cold-start phase durations separated."
       - phase_spans: principle: "Real phase times, flushed progress events and resumable checkpoint references."
       - random_seed: principle: "Frozen fit/sampling/resampling seeds; null only where inapplicable."
       - reproducibility_checksum: principle: "Bind code, protocol, input bytes, raw rows and validation scope."
       - source_artifact_hashes: principle: "Exact input identity and original flags; historical model-shaped payloads in typed sidecars."
       - rows: principle: "Every comparative unit, arm, seed and condition, including failed/censored/unstarted rows."
       - sample_size_budget: principle: "Planned/attempted/completed/failed/censored/unstarted counts, independent groups and stop rule."
       - acceptance_gate_results: principle: "Each check has category, operator, expected, observed, passed and principle; validity is separate from benefit."
       - gate_check_summary: principle: "Every blocked_* names exact upstream, path, check, field, expected and observed, including missing/None/zero."
       - verifier_is_oracle: principle: "True where deployed verification shares correctness authority; positive formal-fixture claims are circular."
       - honest_verdict: principle: "Completed findings start complete_ or complete:; unchanged unavailable prerequisites start blocked_*."
       - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. partial only for unfinished OWN retryable work; external absence is blocked."
       - flagged_adversarial: principle: "Preserve critical findings; flagged evidence cannot supply scientific readiness."
       - validation_receipts: principle: "Exact scoped argv/environment, exit codes, durations, names and hashed logs."
       - field_principles: principle: "Explain field intent separately; keep gate scalars plain numbers, not value/principle wrappers."
       - promotion_score: principle: "Always zero; no rollout, external publication or generator weight updates."
       - contract_ready_score: principle: "One only for the exact thirteen-row contract; advisory, never science."
       - task_contract_rows: principle: "All thirteen rows with independently parsed authorities."
       - method_mapping_rows: principle: "Primary URLs, versions, access state, proposed test and method limits."
       - prior_dispositions: principle: "Original V650 classes, missing paths and failed gates."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu PYTHONPATH={project_root}/python:{project_root} CARNOT_FORCE_LIVE=1 {project_root}/.venv/bin/python -u scripts/experiments/experiment_7421_v651_contract_ingestion.py --date {date}
