        1. SCORER REQUALIFICATION ON THE GENERATION CORPUS: re-ablate the answer cells on the FREE-FORM GENERATION canvas (not just the .401 selection corpus); if the scorer's signal does NOT survive masking on the generation corpus, REPAIR it (re-fit on partial states with the answer cells masked) and re-test. Record scorer_requalified_leak_clean BARE bool. If it CANNOT be made leak-clean on the generation corpus -> proceed with the CoDiLA control ONLY (step 2), and if that also fails -> retirement (step 5).
        2. SCORER-INDEPENDENT CoDiLA CONTROL (arXiv:2603.20216): build a small local AR verifier / deterministic block-coherence penalty that scores the denoising frontier WITHOUT the external scorer. This makes the in-generation arms measurable even if the external scorer is irreparably leaky. Record codila_control_differentiates BARE bool (does the CoDiLA control produce non-degenerate, differentiated arm rankings?).
        3. NO-OP GUARD + TAUTOLOGY GUARD: run a REAL token-by-token denoising-generation loop on a free-form executable task; smoke that each arm CHANGES the generated tokens; if any two arms tie bit-identically OR any two delta metrics agree to >5 sig figs -> controls_differentiated=false + honest_verdict `controls_not_differentiable` (and consult the retirement gate). WINDOW DISCIPLINE: synchronous, checkpoint after every seed, print per-arm/per-seed progress.
        4. FIXED-NFE SEARCH: FIX an NFE budget B. Run the arms at the SAME B: (a) unguided single-pass; (b) best-of-N@B; (c) intrinsic self-verified-feedback@B (no external scorer); (d) Carnot@B (Prism HTS + partial-remask branching, guided by the REQUALIFIED leak-clean scorer if step 1 passed, ELSE by the CoDiLA control). n>=80, >=3 seeds. Report per-arm accuracy + Carnot minus each control + task-level bootstrap CI95 (>=2000 resamples) + branch_diversity + scorer_disagreement_rate.
        5. Emit s3_guided_beats_control BARE bool := (Carnot - best-of-N@NFE > 0 AND CI95-excl-0 AND controls_differentiated AND Carnot - intrinsic-SVF > 0). RETIREMENT GATE: if (scorer leaks again after requalification AND codila_control_differentiates==false) OR (controls_not_differentiable again) -> honest_verdict `retired_in_generation_conversion_unmeasurable` (the 4th block; triggers the prior_failures retirement). Run adversarial_verify.py (CLEAN -- no TAUTOLOGY; verifier_is_oracle=false). Declare random_seed + reproducibility_checksum + model_specs (GGUF + PR binary + the requalified scorer + the CoDiLA control + the Prism/HTS config + N + NFE B + the controls + n + seeds).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A generation gain (Carnot beats the compute-matched + intrinsic controls -- moat USEFUL), a CLEAN powered null (controls differentiated + scorer/CoDiLA clean, Carnot does not beat best-of-N/SVF -> the in-generation scale-up retires), and a retired_in_generation_conversion_unmeasurable (4th block, the scorer is irreparably leaky AND CoDiLA cannot differentiate -> the direction retires) are ALL decision-grade."
        s3_guided_beats_control:
          principle: "BARE bool: the capstone reads this (gated-fields-must-be-bare); true iff the search (scorer-guided OR CoDiLA-grounded) beats best-of-N@matched-NFE AND CI95-excl-0 AND controls_differentiated AND beats intrinsic SVF -- the moat graduating 'exists'->'useful'."
        scorer_requalified_leak_clean:
          principle: "BARE bool: true iff the .401 scorer's signal SURVIVES masking the answer cells ON THE GENERATION corpus after requalification -- the corpus-specific leak repair that the .403 block exposed."
        codila_control_differentiates:
          principle: "BARE bool: true iff the scorer-INDEPENDENT CoDiLA local-coherence control (2603.20216) produces non-degenerate, differentiated arm rankings -- the measurement that is NOT hostage to the leaky external scorer."
        s3_minus_best_of_n_delta:
          principle: "BARE float: Carnot minus best-of-N at matched NFE -- the headline Pareto claim (more accurate at equal compute)."
        s3_gain_ci95:
          principle: "Task-level bootstrap CI95 (>=2000 resamples) of the Carnot minus best-of-N@NFE delta -- excluding 0 is the decision-grade gain."
        controls_differentiated:
          principle: "BARE bool: true iff no two arms tie bit-identically AND no two delta metrics agree to >5 sig figs (the no-op + tautology guards)."
        nfe_budget:
          principle: "BARE int: the FIXED denoising-compute (NFE) budget held equal across all arms -- the compute-matching that makes the Pareto claim honest."
