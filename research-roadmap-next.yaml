milestone: "2026.05.167"
milestone_title: "Phase 3/4 Pivot: Differentiable Constraint Projection, KAN Hardware Prep, and Continuous Self-Learning"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1670-pinet-splitting
    title: "Exp 1670: PiNet convex operator splitting forward pass prototype"
    deliverable: "results/experiment_1670_pinet_splitting.json"
    agent_type: "codex"
    max_turns: 50
    prompt: |
      CONTEXT: The previous milestone identified synthesis tasks as the primary bottleneck. We are pivoting to differentiable constraint projections using the PiNet (arXiv:2508.10480) methodology.
      EXISTING CODE TO READ FIRST: python/carnot/solvers/
      TASK: Implement a prototype of PiNet's Douglas-Rachford operator splitting for convex constraint projection in JAX.
      CONCRETE STEPS:
      1. Write `python/carnot/solvers/pinet_prototype.py`.
      2. Implement a Douglas-Rachford splitting loop that enforces a simple linear equality constraint in the forward pass.
      3. Create a unit test against PySAT.
      4. Write output to deliverable JSON.
      Run command: DATE="{date}" python {project_root}/scripts/run_experiment_1670.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1671-hardnet-linearization
    title: "Exp 1671: HardNet++ damped local linearization layer prototype"
    deliverable: "results/experiment_1671_hardnet_layer.json"
    max_turns: 50
    prompt: |
      CONTEXT: Based on HardNet++ (arXiv:2604.19669), nonlinear constraints require damped local linearizations to project predictions successfully.
      EXISTING CODE TO READ FIRST: python/carnot/solvers/pinet_prototype.py
      TASK: Create a HardNet++ projection prototype targeting nonlinear inequalities.
      CONCRETE STEPS:
      1. Implement `hardnet_projection.py` in `python/carnot/solvers/`.
      2. Define a damped root-finding logic block based on HardNet++ equations.
      3. Simulate 5 random nonlinear constraint configurations and evaluate error delta.
      4. Write output to deliverable JSON.
      Run command: DATE="{date}" python {project_root}/scripts/run_experiment_1671.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1672-differentiable-vs-pysat
    title: "Exp 1672: End-to-end PiNet/HardNet++ solver vs PySAT equivalence check"
    deliverable: "results/experiment_1672_solver_equivalence.json"
    gated_on:
      - upstream: exp1670-pinet-splitting
        artifact_field: pinet_success
        op: "=="
        value: true
    max_turns: 50
    prompt: |
      CONTEXT: We must verify that differentiable layers respect zero-false-accept bounds.
      EXISTING CODE TO READ FIRST: python/carnot/solvers/pinet_prototype.py
      TASK: Evaluate the continuous projection layer against a PySAT ground truth baseline.
      CONCRETE STEPS:
      1. Construct a batch of 100 constraint sets.
      2. Record execution time and accuracy of PiNet/HardNet++ vs PySAT.
      3. Assert zero-false-accepts on the final verification check.
      4. Write output to deliverable JSON.
      Run command: DATE="{date}" python {project_root}/scripts/run_experiment_1672.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

