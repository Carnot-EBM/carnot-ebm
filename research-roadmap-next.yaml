- id: exp5204-exclusion-manifest-lint-real-bug-fix-v476
  milestone: 2026.07.476
  title: fix scripts/exclusion_manifest_lint.py's documented REAL_BUG -- substring matching without word
    boundaries, principle-wrapped-field blindness, and partial negation handling
  priority: high
  track: infrastructure
  deliverable: results/experiment_5204_exclusion_manifest_lint_real_bug_fix_v476.json
  prior_failures:
  - experiment_id: exp589-exclusion-manifest-wire-in
    verdict: wrapper_created_human_action_required
    addressed_by: "exp589 was the ORIGINAL conductor wire-in of the exclusion-manifest mechanism itself
      (RETRO-067, many months prior, before the manifest was even active at activation time). This task
      fixes four SPECIFIC bugs (word-boundary matching, principle-wrapped-field unwrapping, general
