      CONTEXT
      This is the recovered version of the missing .307 Phase-3 premise test. The question is narrow: does an energy-descent/refinement loop improve exact verifier outcomes over baseline autoregressive generation on the same local SOTA GGUF models?

      EXISTING CODE TO READ FIRST
      - CLAUDE.md, especially SOTA Local Models, live inference duration, and sample-size rigor
      - CODEX.md
      - scripts/experiment_template.py
      - carnot/inference/sota_models.py
      - openspec/capabilities/phase3-kona/spec.md
      - openspec/capabilities/verifiable-reasoning/spec.md
      - openspec/capabilities/llm-ebm-inference/spec.md
      - results/experiment_3326_phase3_path_preflight_manifest_v1.json
      - results/experiment_3327_energy_descent_substrate_bootstrap_v1.json
      - research-references.md, especially EBT, hallucination commitment, and energy-guided decoding notes

      TASK
      Run a statistically honest live SOTA panel comparing baseline autoregressive generation to energy-guided refinement/reranking under exact verifier authority. The result may be positive, negative, or blocked; do not overclaim.

      CONCRETE STEPS
      1. Confirm the exp3327 gate artifact says energy_descent_bootstrap_ready=true.
      2. Define MODEL_SPECS using cached_sota_pair(gpu_indices=(0, 1)); include at least one mandated SOTA GGUF in the artifact: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, or unsloth/gemma-4-26B-A4B-it-GGUF.
      3. Preflight GPU/cache/runtime. If preconditions fail, write a blocked artifact with exact root cause and stop.
      4. Build or reuse a balanced benchmark of at least n=200 scored cases unless runtime constraints force a diagnostic-only run. Include arithmetic/constraint tasks with exact labels and no prompt-injection headline reuse.
      5. For each case, collect baseline autoregressive output, energy-guided/refined output, exact verifier verdicts, energy trajectory, commitment/abstention telemetry, and unsupported-claim flags when available.
      6. Compute paired deltas, confidence intervals, refusal/abstention deltas, and failure slices. If n<200, mark the result diagnostic-only.
      7. Write results/experiment_3328_energy_descent_vs_ar_sota_panel_v2.json with fields: honest_verdict, inference_substrate, random_seed, reproducibility_checksum, duration_s, model_specs, n_cases, panel_scale, delta_verified_accuracy, ci95_delta_verified_accuracy, energy_descent_vs_ar_panel_v2_ready, commitment_telemetry_summary, blocked_reasons.
      8. Update ops/status.md and ops/changelog.md with the verdict and whether the Phase-3 premise remains blocked.

      Run command: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3328_energy_descent_vs_ar_sota_panel_v2.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

