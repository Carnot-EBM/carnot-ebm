  - id: exp1707-ipfs-sovereignty-mirror-poc
    title: "Exp 1707: IPFS sovereignty mirror POC (per CLAUDE.md Rule 3)"
    deliverable: results/experiment_1707_ipfs_mirror_poc.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures: []
    prompt: |
      CONTEXT: CLAUDE.md "Decentralization-Respecting Design Constraints"
      Rule 3 mandates IPFS as the secondary distribution channel for
      Carnot artifacts. Per operator directive 2026-05-08 (memory entry
      feedback_ipfs_over_gitea_for_mirror_channel), IPFS was chosen over
      gitea for content-addressability + sovereignty-multiplier effect.
      This is a POC task: get ONE Carnot artifact pinned to IPFS, get
      its CID, and verify retrieval from at least two independent
      gateways. NOT a production rollout.

      FALSIFIABLE HYPOTHESIS: A Carnot model checkpoint can be (a) pinned
      to a Filecoin-backed pinning service, (b) retrieved by its CID
      from cloudflare-ipfs.com AND ipfs.io gateways AND w3s.link, with
      content-hash matching across all three retrievals. SHA-256 of
      retrieved content must equal SHA-256 of source content.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md "Decentralization-Respecting Design Constraints" §3
        - feedback_ipfs_over_gitea_for_mirror_channel memory
        - python/carnot/distribution/ (if exists)

      TASK: POC IPFS mirror setup.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. At least one Filecoin-backed pinning service credential
              available in env: ONE of `WEB3STORAGE_TOKEN`,
              `STORJ_TOKEN`, `FILEBASE_KEY`. If NONE, emit
              `blocked_ipfs_pinning_credentials_unavailable` and exit.
           b. `curl --version` succeeds (for gateway retrieval test).
           c. At least one artifact under python/carnot/verify/ or
              models/ exists to pin — if none, emit
              `blocked_no_artifact_to_pin` and exit.
        1. Pick smallest available checkpoint (< 50MB to keep pinning
           cost bounded for POC).
        2. Pin via chosen service. Capture the IPFS CID.
        3. Retrieve from three independent gateways:
             - https://cloudflare-ipfs.com/ipfs/<CID>
             - https://ipfs.io/ipfs/<CID>
             - https://w3s.link/ipfs/<CID> (if web3.storage)
           Verify SHA-256 matches source on each retrieval.
        4. Write `python/carnot/distribution/ipfs.py` minimal module:
             - `fetch_via_gateway(cid, gateway_url) -> bytes`
             - `verify_cid(content, expected_cid) -> bool`
             - Documented in module docstring as POC, NOT production.
        5. Document the CID in a new file `docs/ipfs-pinned-artifacts.md`.
           CLAUDE.md no-pruning policy: ADD, don't delete.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.ipfs_mirror_poc.v1"
        - experiment: 1707
        - run_date: ISO-8601 UTC
        - duration_s: actual wall time. MUST be > 60s (pinning + 3
          gateway retrievals + hash verifications take time).
        - random_seed: 171307
        - reproducibility_checksum: sha256 of (chosen_artifact_path +
          ipfs_cid + pinning_service)
        - preconditions_checked: list
        - model_specs: {pinned_artifact_path: str,
          pinning_service: "web3.storage" | "storj" | "filebase",
          ipfs_cid: str, artifact_size_bytes: int}
        - n_samples: 3 (gateway retrievals — methodology field)
        - n_samples_justification: "POC; n is the gateway count. Three
          gateways tested per CLAUDE.md Rule 3 implementation guidance."
        - gateway_retrieval_results: list of {gateway_url, retrieval_ok,
          sha256_match, retrieved_size_bytes}
        - all_gateways_consistent: bool
        - acceptance_gate_passed: bool (all_gateways_consistent AND
          ipfs_cid is non-null)
        - acceptance_gate_criteria: "Pin succeeded + 3 gateways retrieve
          identical content."
        - methodology_note: "POC scope: one small artifact. Full
          production rollout (all Carnot checkpoints pinned) is a
          separate future task."
        - optimization_direction: "neither — POC ship task"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push to git. Do NOT modify
      scripts/research_conductor.py.

