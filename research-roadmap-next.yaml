      4. Run all four arms on identical eligible tasks. Count every fallback as the fallback utility and full cost.
      5. Keep exact guard safety separate from model utility. Do not aggregate away a failed model or family.
      6. Add tests for gate replay, tokenizer path, budget parity, raw-row hashing, parser failure, fallback accounting, model mutation, and oracle boundaries.
