- id: exp795-gemma4-oom-fix-v4
  milestone: 2026.04.61
  deliverable: results/experiment_795_gemma4_oom_fix_v4.json
  title: 'Exp 795: Gemma4 OOM Fix v4 — Four-Step GPU Isolation (RETRO-028, GPU REQUIRED, CARNOT_FORCE_LIVE=1)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-028 has failed to close across three dedicated attempts (.58, .59, .60).
    Root cause: Gemma4-E4B-it (14.89 GiB allocation) fails with CUDA OOM because GPU memory
    is occupied by zombie processes before model load. The .60 retro provides the four-step
    isolation protocol:
    (1) kill_gpu_zombies() — deployed in Exp 780
    (2) Explicit VRAM eviction of ALL processes >100MB via pkill + nvidia-smi verification
    (3) Verify <500MB used on target GPU before model load
    (4) Use GPU 1 (cooler, 8-10C thermal headroom) as the Gemma4 target
    This experiment implements Fix v4 with all four steps.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/gpu_zombie_killer.py — kill_gpu_zombies() (Exp 780)
    - python/carnot/pipeline/gemma_loader.py — GemmaTransformersLoader (Exp 450)
    - results/experiment_786_gemma4_oom_fix_v3_vr_grid.json — Fix v3 failure details
    - results/operational_retro_2026_04_60.json — RETRO-028 resolution path
    - scripts/experiment_template.py — ExperimentTemplate.setup_gpu()
    - openspec/capabilities/verifiable-reasoning/spec.md — existing REQ-LOADER entries

    TASK: Implement Fix v4 four-step isolation, load Gemma4 on GPU 1, run 10 GSM8K questions.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/verifiable-reasoning/spec.md:
       - REQ-LOADER-003: Before loading Gemma4-E4B-it, the system MUST evict all GPU processes
         holding >100MB VRAM via kill_gpu_zombies() followed by explicit pkill + verification
         that nvidia-smi reports <500MB used on the target GPU.
       - REQ-LOADER-004: Gemma4-E4B-it MUST be loaded on GPU 1 (device index 1) when dual-GPU
         configuration is present, to preserve GPU 0 thermal headroom.
       - SCENARIO-LOADER-003: GPU has zombie processes; kill_gpu_zombies() kills them;
         pkill sweep runs; nvidia-smi shows <500MB; Gemma4 loads successfully.
       - SCENARIO-LOADER-004: GPU 1 is at 44C; GPU 0 is at 52C; Gemma4 loads on GPU 1;
         thermal headroom confirmed in artifact.
    3. Implement python/carnot/pipeline/gemma_isolation.py:
       a. VRAMEvictionResult dataclass:
          {gpu_index, vram_before_mb, pids_killed, pkill_attempts, vram_after_mb,
           vram_clear (bool: <500MB), honest_verdict}
       b. evict_gpu_vram(gpu_index: int = 1) -> VRAMEvictionResult:
          - Run kill_gpu_zombies(gpu_index) first
          - Run: nvidia-smi --query-compute-apps=pid --format=csv,noheader,nounits -i gpu_index
          - For any PID > 0 holding >100MB VRAM: os.kill(pid, signal.SIGKILL)
          - Wait 3 seconds
          - Re-check VRAM: read nvidia-smi --query-gpu=memory.used --format=...
          - vram_clear = (vram_after_mb < 500)
       c. load_gemma4_on_gpu1(model_id: str = "google/gemma-4-E4B-it") -> dict:
          - Call evict_gpu_vram(gpu_index=1)
          - If not vram_clear: return {"loaded": False, "reason": "vram_not_cleared"}
          - Load via GemmaTransformersLoader with device_map={"": "cuda:1"}
          - Return {"loaded": True, "device": "cuda:1", "vram_after_mb": ...}
       d. Export VRAMEvictionResult, evict_gpu_vram, load_gemma4_on_gpu1 from carnot.pipeline
    4. Create scripts/experiment_795_gemma4_oom_fix_v4.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(795) + ExperimentTimeoutWatchdog(795, timeout_minutes=60).
       c. LiveGPUGate.require_live_or_blocked() — hard gate, no simulated fallback.
       d. Step 1: kill_gpu_zombies(1) — log result.
       e. Step 2: evict_gpu_vram(1) — log vram_before_mb, pids_killed, vram_after_mb.
       f. Step 3: verify vram_clear; if False → write blocked artifact, exit.
       g. Step 4: load_gemma4_on_gpu1(). If not loaded → write blocked artifact, exit.
       h. Run 10 GSM8K questions with loaded Gemma4. Count n_valid_responses
          (not empty, not all <unusedN> tokens per GemmaTransformersLoader.is_valid_output).
       i. honest_verdict:
          - "retro_028_closed" if n_valid_responses >= 8
          - "partial_success" if n_valid_responses in [4, 7]
          - "model_loaded_no_valid_output" if model loaded but n_valid < 4
          - "vram_not_cleared" if eviction failed
          - "blocked_no_live_gpu" if LiveGPUGate blocks
       j. Artifact fields: step1_zombies_killed, step2_vram_before_mb, step2_pids_killed,
          step3_vram_after_mb, step3_vram_clear, step4_model_loaded, n_valid_responses,
          honest_verdict, retro_028_closed (bool).
    5. Write tests/python/test_experiment_795_gemma4_oom_fix_v4.py with 100% coverage:
       - test evict_gpu_vram returns correct verdict on mocked nvidia-smi (mock subprocess)
       - test load_gemma4_on_gpu1 skips load when vram_not_cleared
       - test VRAMEvictionResult fields typed correctly
       Each test traces to REQ-LOADER-003/004.
    6. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict.
       - ops/status.md: "Exp 795: Gemma4 OOM Fix v4. retro_028_closed=<bool>."
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp796-sota-gguf-code-repair-v3
  milestone: 2026.04.61
  deliverable: results/experiment_796_sota_gguf_code_repair_v3.json
  title: 'Exp 796: SOTA GGUF Code Repair v3 — Batched 10q (RETRO-SOTA-GGUF-TIMEOUT, GPU, GATED on Exp 795)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-SOTA-GGUF-TIMEOUT has failed twice — Exp 769 (120 min timeout) and
    Exp 785 (90 min timeout, blocked_model_load_failed). Root causes: GPU OOM before model
    load (fixed by Exp 795) and insufficient budget per question when all questions run serially.
    Fix: batch 25 HumanEval problems into 5 batches of 5, checkpoint after each batch,
    ExperimentTimeoutWatchdog at 90 min. Also add MARS margin gate (arXiv 2601.15498) to
    skip test execution for high-margin outputs, reducing oracle call count.

    PREREQUISITE: Check results/experiment_795_gemma4_oom_fix_v4.json. If retro_028_closed
    is not True, write a blocked artifact and exit. GPU 1 must be isolated before this experiment.

    EXISTING CODE TO READ FIRST:
    - results/experiment_795_gemma4_oom_fix_v4.json — GATING: retro_028_closed must be True
    - results/experiment_785_sota_gguf_code_repair_v2.json — Fix v2 failure details
    - python/carnot/pipeline/long_run_executor.py — LongRunBenchmarkExecutor (Exp 437)
    - python/carnot/pipeline/gpu_zombie_killer.py — kill_gpu_zombies() (Exp 780)
    - python/carnot/pipeline/atomic_writer.py — AtomicResultWriter (Exp 452)
    - scripts/experiment_template.py — ExperimentTemplate, setup_gpu()
    - openspec/capabilities/verifiable-reasoning/spec.md — existing REQ-BENCH entries

    TASK: Run 25 HumanEval problems in 5 batches of 5 with Qwen3.6-35B-A3B GGUF, apply
    MARS margin gate, checkpoint per batch, target pass@1_repair > pass@1_baseline.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/verifiable-reasoning/spec.md:
       - REQ-BENCH-014: SOTA GGUF code repair MUST use batched execution (max 5 problems/batch)
         with AtomicResultWriter checkpoint after each batch to prevent total data loss on timeout.
       - REQ-BENCH-015: MARS margin gate MUST be applied before test oracle execution —
         if token_margin > margin_threshold, skip test execution and count as clean.
       - SCENARIO-BENCH-033: 5-problem batch completes in <18 min, checkpoint written, next
         batch starts; total wall time under 90 min for 25 problems.
       - SCENARIO-BENCH-034: High-margin output skips oracle; oracle_calls_saved > 0.
    3. Implement MARSMarginGate in python/carnot/pipeline/mars_margin_gate.py:
       a. MARSMarginResult dataclass:
          {logit_margin, margin_threshold, skip_oracle, honest_verdict}
       b. compute_logit_margin(logits: list[float]) -> float:
          top2 = sorted(logits, reverse=True)[:2]
          return top2[0] - top2[1]  # margin = top1 - top2
       c. MARSMarginGate(threshold: float = 2.0):
          decide(logits) -> MARSMarginResult
          If logits unavailable (CI mode): skip_oracle=False, verdict="ci_logits_unavailable"
       d. Export from carnot.pipeline.__init__
    4. Create scripts/experiment_796_sota_gguf_code_repair_v3.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(796) + ExperimentTimeoutWatchdog(796, timeout_minutes=90).
       c. LiveGPUGate.require_live_or_blocked() — hard gate.
       d. Check GATE: load results/experiment_795_gemma4_oom_fix_v4.json.
          If retro_028_closed != True → write blocked artifact, exit.
       e. kill_gpu_zombies(1) then evict_gpu_vram(1) per Exp 795 protocol.
       f. Load Qwen3.6-35B-A3B Q4_K_M GGUF from models/ cache via resolve_cached_gguf().
          Use GPU 1 with explicit device_map={"": "cuda:1"}.
       g. Load 25 HumanEval problems (problems 0-24 from humaneval dataset).
       h. Batch into 5 batches of 5 problems each:
          For each batch:
            - Run baseline (no repair): generate code, run tests, count pass@1_baseline_batch
            - Run repair (with CodeExtractor + VerifyRepairPipeline):
              Apply MARS margin gate on generation logits. If skip_oracle: record as "margin_skip".
              Else: run test oracle, apply repair if violations found.
            - Count pass@1_repair_batch, oracle_calls_saved_batch
            - AtomicResultWriter checkpoint: write partial artifact
       i. Aggregate: pass@1_baseline = avg, pass@1_repair = avg, signed_improvement = repair - baseline
       j. honest_verdict:
          - "code_repair_positive" if signed_improvement > 0 and inference_mode="live_gpu"
          - "code_no_improvement" if signed_improvement <= 0 and live_gpu
          - "partial_N_of_25" if timeout with N < 25 completed
          - "gated_retro028_not_closed" if prerequisite gate fails
          - "blocked_no_live_gpu" if LiveGPUGate blocks
    5. Write tests/python/test_experiment_796_sota_gguf_code_repair_v3.py with 100% coverage:
       - test MARSMarginGate.decide() returns skip_oracle=True when margin > threshold
       - test MARSMarginGate.decide() returns ci_logits_unavailable in CI mode
       - test compute_logit_margin returns top1 - top2
       Each test traces to REQ-BENCH-014/015.
    6. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict.
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp797-jepa-v21-multi-source-data
  milestone: 2026.04.61
  deliverable: results/experiment_797_jepa_v21_data_collection.json
  title: 'Exp 797: JEPA v21 Multi-Source Data Collection (RETRO-JEPA-V20-NO-DATA, GPU REQUIRED, CARNOT_FORCE_LIVE=1)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-JEPA-V20-NO-DATA: Exp 781 collected n_labeled=0 because CARNOT_FORCE_LIVE
    was not set. RETRO-JEPA-OOD: 8 consecutive failed retrains (v13-v20, ood_auc < 0.75).
    Root cause: all 57 real pairs come from a single source (Qwen3.5-0.8B, GSM8K q1-300).
    Fix: collect from 3 diverse sources:
      Source A: 60 GSM8K questions with Qwen3.5-0.8B (new range: q301-360)
      Source B: 30 MATH-500 questions with Qwen3.5-0.8B (harder distribution)
      Source C: 30 HumanEval problems with Qwen3.5-0.8B (code domain)
    (Use Qwen3.5-0.8B for all sources to control model-level variance; diversity is in domain.)
    FOVER Z3 annotator labels each step. Target: n_labeled >= 80 across >= 2 sources.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/fover_live.py — LiveFOVERResult, build_live_fover_artifact()
    - python/carnot/pipeline/fover_annotator.py — FOVERAnnotator, parse_cot_into_steps()
    - results/experiment_442_fover_live_annotation.json — 57 pairs from Exp 442 (baseline)
    - results/fover_labeled_steps_live.json — existing pairs file (do NOT overwrite; append)
    - scripts/experiment_template.py — ExperimentTemplate.setup_gpu()
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN-048/049 from Exp 781

    TASK: Collect real CoT steps from 3 domains with live GPU, label with FOVER Z3,
    write multi-source corpus to results/fover_labeled_steps_v21_multi.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/autoresearch/spec.md:
       - REQ-LEARN-050: JEPA v21 training data MUST span >= 2 distinct benchmark domains
         (GSM8K, MATH-500, HumanEval) to support OOD generalization.
       - REQ-LEARN-051: Multi-source FOVER annotation MUST write a single merged corpus file
         (fover_labeled_steps_v21_multi.json) with source_domain field per pair.
       - SCENARIO-LEARN-094: Data collection completes; n_labeled >= 80; source breakdown
         shows >= 2 domains; corpus written to fover_labeled_steps_v21_multi.json.
    3. Create scripts/experiment_797_jepa_v21_data_collection.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTemplate(797) + ExperimentTimeoutWatchdog(797, timeout_minutes=60).
       c. LiveGPUGate.require_live_or_blocked() — HARD GATE. No simulated fallback.
          If CARNOT_FORCE_LIVE not set or GPU unavailable: write blocked artifact, exit.
       d. kill_gpu_zombies(0). Load Qwen3.5-0.8B on GPU 0.
       e. Source A (GSM8K q301-360, 60 questions):
          - Generate CoT responses for each question
          - FOVERAnnotator.annotate_corpus(responses) → labeled steps
          - Record: n_responses_a, n_labeled_a
       f. Source B (MATH-500 q0-29, 30 questions):
          - Load 30 MATH-500 problems (from datasets or hardcoded subset)
          - Generate CoT responses
          - FOVERAnnotator.annotate_corpus(responses) → labeled steps
          - Record: n_responses_b, n_labeled_b
       g. Source C (HumanEval p0-29, 30 problems):
          - Load 30 HumanEval problems
          - Generate code solutions with CoT
          - FOVERAnnotator.annotate_corpus(responses) → labeled steps
          - Record: n_responses_c, n_labeled_c
       h. Merge all labeled steps into one corpus. Add source_domain field per pair.
       i. Write to results/fover_labeled_steps_v21_multi.json (AtomicResultWriter).
          Do NOT overwrite results/fover_labeled_steps_live.json (Exp 442 corpus is separate).
       j. honest_verdict:
          - "multi_source_corpus_adequate" if n_labeled_total >= 80 and sources_with_data >= 2
          - "multi_source_insufficient" if n_labeled_total < 80 but > 0
          - "single_source_only" if only 1 domain produced labeled pairs
