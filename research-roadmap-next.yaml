  prompt: |
    CONTEXT
    Work in {project_root} on {date}. Milestone 2026.10.692. V691 qualified role export, 358 Qwen judgments, scalar calibration and cached service timing. Scalar Gibbs tied Platt/isotonic action cost. Four science tasks were dispatch-blocked. Exp7978 failed its owned blocked-replay CLI. Completed scheduling does not mean a scientific win.

    EXISTING CODE TO READ FIRST
    CLAUDE.md; CODEX.md; research-program.md; ops/exclusion_manifest.yaml; scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; ops/e2e-test-plan.md; python/carnot/reporting/v691_contract_methods.py; python/carnot/reporting/v691_capstone.py; python/carnot/reporting/v691_capstone_validation.py; results/experiment_7966_v691_contract_methods.json; results/experiment_7978_v691_capstone.json; research-references.md

    TASK
    Freeze thirteen tasks and separate historical authority from new evidence. Deliver results/experiment_7979_v692_contract_methods.json. Implement the bounded entrypoint scripts/experiments/experiment_7979_v692_contract_methods.py. MODEL_SPECS: []. SUBSTRATE CLASS: no_model_load. Use verifier_ensemble_against_cached_candidates for numerical scoring, or aggregation_from_upstream_artifacts for a pure audit. Zero current pretrained-model loads/calls. Small fitted heads are separate trained_head_specs.

    CONCRETE STEPS
    1. Print a flushed progress line at each phase boundary and before and after every model load, generation call, benchmark, and subprocess. Print inside long loops and from a supervising thread while an owned child is silent, at most 60 seconds apart. Keep every output gap below 600 seconds. Use tool waits of at most 60 seconds. Silence can end a run near 1200 seconds; progress permits the 4800-second hard cap. Report measured work; never pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Keep each edit and tool call small. Put temporary scripts and mutable test files in private /tmp directories outside the checkout. Keep the pytest artifact guard enabled. Archive immutable receipts only after children exit.
    3. Authenticate the exact input paths, hashes, roles, producer invocation dates, and readiness fields below. A historical date need not equal {date}. Missing inputs or failed external gates yield verdict_class=blocked and exact gate_check_summary operands. Do not retry unchanged external blocks as partial. Preserve historical failures and all source artifacts.
    4. Before implementation, append task-specific REQ-REPORT and, where applicable, REQ-VERIFY requirements and scenarios. Write tests first. Reuse qualified components below; implement only the stated difference. Freeze the required validation command manifest before running science. Keep unrelated repository health separate; never remove a failed owned check or weaken an assertion to qualify.
    5. Compare the visible design table, V692_TASK_CONTRACT JSON and YAML: exactly 13 IDs exp7979 through exp7991, in order, with identical titles, phases, deliverables, models and gates. Bind the canonical full-task digest. Freeze authority snapshots. Separate staged planning from observed activation; never recreate consumed staging or edit the active roadmap.
    6. Freeze the methods below before numerical work: eight source features plus one Qwen probability; 96 reserved evaluation sources; original 640 roles unchanged; class/sample floors; six primary cost/Brier comparisons; delayed learning and retention gates. Record each paper mechanism, local adaptation and explicit deferred scope. Include EBT, ARM-EBM, evidence alignment, delayed ACI and sparse spline learning.
    7. Reuse the qualified contract reader and bounded private fixture runner. Check task deletion, reordering, gate spelling drift, changed prompt, duplicate ID, changed source hash, legitimate producer date rollover and forged date. Expected rejection must be asserted by a wrapper that exits zero only when the inner negative CLI exits one. Preserve Exp7978 failure; do not relabel its receipt.
    8. Write an authority and methods artifact with a disposition for each historical V691 task. Distinguish planned producer paths from conductor skip receipts. No universal downstream gate depends on this administrative task. A correct fixture result is circular_positive, never scientific benefit.
    9. Run affected unit and consumer tests, nonempty 100% changed-statement coverage including real private CLI routes, scoped Ruff check/format, strict mypy, and scripts/check_spec_coverage.py on the actual test paths. Run applicable E2Es listed below with private outputs. Cold-replay the primary from outside the checkout without PYTHONPATH. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the final primary. Check both conductor_gates.evaluate_gates and in_process_doc_reconcile.find_artifact resolve that primary. Failed owned required validation means disqualified and readiness zero. Use one atomic declared primary and nested sidecars. Reconcile specs, _bmad/traceability.md, ops/status.md, and ops/changelog.md. Keep generator weights and production defaults fixed. Applicable end-to-end checks: E2E-018 private authority lifecycle CLI test; do not rerun its historical primary producer.
    REQUIRED ARTIFACT FIELDS
    - experiment_id, task_id, milestone, run_date, execution_date: principle: Bind identity to this invocation, not an inherited producer.
    - honest_verdict: principle: Use complete_positive_*, complete_null_*, complete_blocked_*, complete_disqualified_*, or complete_circular_positive_* with an accurate reason.
    - verdict_class: principle: Choose exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished OWN work that a retry can finish; other classes are terminal.
    - gate_check_summary: principle: Every blocked disposition names upstream, path/hash, field, operator, expected value and actual value. Distinguish missing from zero.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_specs, model_invocation_counts: principle: Declare actual compute and zero calls for cached scoring. Separate planned models from actual blocked invocations.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: principle: Make timing, progress and reconstruction checkable.
    - cited_upstream_artifacts, code_config_hashes, raw_shard_hashes: principle: Bind imported fields and current computations to their source bytes.
    - preconditions_checked, validation_command_manifest_path, validation_receipts, coverage_statement_counts: principle: Required checks need observed exit codes and logs, not a claimed green status.
    - rows, sample_size_budget: principle: Keep one primitive row per source/arm/seed or check. Include intended, eligible, started, completed, failed, censored, excluded and independent counts. Seeds do not multiply independent sources.
    - verifier_is_oracle, claim_scope, acceptance_gate_results: principle: Keep circular fixtures separate from independent natural-data evidence. A failed benefit gate forbids a positive class.
    - flagged_adversarial, terminal_validation_sidecar_path: principle: Final-byte checks must travel with the primary; never self-certify a failed verifier.
    - canonical_tasks_sha256, task_contract, authority_snapshots: principle: Bind all prompt and dispatch fields while retaining prior milestone authority.
    - method_registry, literature_map, historical_dispositions, mutation_rows: principle: Keep research choices and expected negative checks explicit.
    - contract_ready_score: principle: Exact downstream readiness field. Set 1 only after complete valid measurement and owned checks; a scientific null can still be ready. Set 0 on blocked/disqualified work.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_7979_v692_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
