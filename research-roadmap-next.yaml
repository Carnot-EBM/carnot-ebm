  - id: exp3381-kv260-latency-benchmark
    operator_override: "2026-05-29 operator directive (standing, mechanical auto-stamp): structural false-positive — active hardware-continuity task scope-matched a retired exp; not a doomed rerun."
    milestone: "2026.05.312"
    title: "KV260 Hardware Latency Baseline"
    priority: critical
    max_turns: 100
    model: opus
    estimated_wall_time_min: 20
    track: hardware
    inference_substrate: hardware_smoke
    requires_gpu: false
    deliverable: "results/experiment_3381_kv260_latency_benchmark.json"
    prompt: |
      CONTEXT: The KV260 board SSH connectivity was restored in exp3365, and the `carnot_ising_v4` bitstream is present.
      EXISTING CODE TO READ FIRST: hardware/kv260/synth_ising.tcl, scripts/experiment_568_kv260_bringup_v2.py
      TASK: Execute an Ising sampling run on the KV260 using the hardware bitstream via `/dev/uio0` and measure true hardware latency versus CPU.
      CONCRETE STEPS:
        1. Write a Python script to memory-map the KV260 UIO registers.
        2. Upload a small Ising problem, trigger synthesis/sampling, and poll for completion.
        3. Record the latency and compare against a CPU baseline.
        4. Emit an artifact with the measured `hardware_latency_us`.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3381_kv260_latency_benchmark.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

