    requires_claude_verified: true
    operator_override: "2026-06-12 operator directive (standing 2026-05-29 auto-override class 1): routine milestone-transition task (archive-vN-activate-vN+1) — false-positive scope-match vs all prior archive-v* tasks; structurally never a doomed rerun."
