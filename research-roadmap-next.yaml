  - id: exp2715
    milestone: "2026.05.258"
    deliverable: "results/experiment_2715_sota_gguf_live_eval_v3.json"
    title: "SOTA GGUF Live Pipeline Validation v3: Ensemble on N=50 Qwen3.6-35B + Gemma-4-31B"
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    track: evaluation

    gated_on:
      - upstream: exp2713-pretest-cascade-fix-v1
        artifact_field: pretest_cascade_fixed
        op: '=='
        value: true

    prior_failures:
      - experiment_id: exp2702-sota-gguf-live-eval-v2
        verdict: "zero_execution_no_artifact_produced"
        addressed_by: "exp2702 (.257), exp2689 (.256), exp2675 (.255) all failed due to conductor pre-test cascade (now fixed in exp2713). This .258 attempt is gated on exp2713.pretest_cascade_fixed == true. Identical scope: N=50 live GGUF outputs from Qwen3.6-35B + Gemma-4-31B through VerifyRepairPipeline. If cascade is fixed and RTX 3090 available, this is the first actual live eval in the series."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Both RTX 3090s (48 GB VRAM total) have been idle since conductor stall at ~.206.
      The pre-test cascade has been fixed by exp2713 (gated). This is the first opportunity for
      genuine live GGUF pipeline validation.

      MODEL_SPECS (mandatory per CLAUDE.md SOTA GGUF requirement):
        - name: Qwen3.6-35B-A3B-GGUF
          hf_id: unsloth/Qwen3.6-35B-A3B-GGUF
          role: primary_inference
        - name: gemma-4-31B-it-GGUF
          hf_id: unsloth/gemma-4-31B-it-GGUF
          role: secondary_inference

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline.verify(), should_verify())
      - python/carnot/verify/ (list all existing Tier 0* verifier modules)
      - scripts/experiment_template.py (cached_sota_pair() pattern)
      - data/fover_corpus.jsonl (FoVer corpus — {question, correct, incorrect} fields)

      TASK: Run VerifyRepairPipeline on N=50 live GGUF outputs. Measure energy distribution.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any inference):
         a. Check Qwen3.6-35B-A3B-GGUF cached:
            `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/ 2>/dev/null | head -3`
            Record: qwen_cached (bool).
         b. Check gemma-4-31B-it-GGUF cached:
            `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF/ 2>/dev/null | head -3`
            Record: gemma31b_cached (bool).
         c. Check RTX 3090 GPUs:
            `nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>/dev/null`
            Record: cuda_available (bool), n_gpus (int), gpu_names (list).
            Adversarial note: if gpu_names includes 'RTX 3090', cuda_available=true; do NOT accept gfx1100 (fabrication signal).
         d. Check FoVer corpus: `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            Record: fover_corpus_lines (int).
         e. Check CUDA torch:
            `.venv/bin/python -c "import torch; print(torch.cuda.is_available())" 2>/dev/null || echo false`
            Record: torch_cuda_available (bool).
         If BOTH GGUF models absent AND cuda_available=False:
            write honest_verdict 'blocked_gguf_not_cached_and_no_cuda' and exit. DO NOT fabricate inference.
         If at least one GGUF cached AND (cuda_available OR torch_cuda_available): proceed.
         If no GGUF cached but CUDA available: attempt CPU smoke with gemma-4-E4B-it (N=10),
         flag smoke_only=true.

      1. Prepare N=50 evaluation prompts from FoVer corpus (random_seed=42).
         Record: n_prompts_prepared (int), prompt_source (str).
         reproducibility_checksum = sha256 of first 50 question strings concatenated.

      2. Run inference for each prompt via available GGUF model(s) (llama.cpp or transformers).
         batch_size=5, timeout per batch=300s.
         Record: inference_mode ('live_gpu', 'live_cpu', 'smoke_only'),
         n_examples_run (int), mean_inference_time_s (float), model_used (str).

      3. Pass each response through VerifyRepairPipeline.verify().
         Compute:
         a. energy_score_distribution: {mean, std, min, max, p25, p75}
         b. fast_path_rate: fraction where should_verify() returned False
         Record all metrics.

      4. Write results/experiment_2715_sota_gguf_live_eval_v3.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required; 'blocked_' is honest if no GGUF and no CUDA."
      - inference_mode: str — 'live_gpu', 'live_cpu', or 'smoke_only'
        principle: "paper-v6 claims require live_gpu; smoke_only is insufficient for headline."
      - n_examples_run: int
        principle: "Sample size validates statistical estimates of energy distribution."
      - energy_score_distribution: dict — {mean, std, min, max, p25, p75}
        principle: "Primary pipeline validation output: energy scores on live GGUF data."
      - fast_path_rate: float
        principle: "ODAR/Phase 4 metric: high rate = verification overhead reduced."
      - model_used: str
        principle: "Traceability: which SOTA model generated evaluated outputs."
      - models_checked: list of str — PRECONDITIONS check result
        principle: "Anti-fabrication: records which GGUF models were found cached."
      - cuda_available: bool
        principle: "Hardware availability; False -> CPU fallback path taken."
      - gpu_names: list of str
        principle: "Adversarial check: must contain RTX 3090, not gfx1100 (fabrication signal)."
      - random_seed: int — 42
        principle: "Reproducibility."
      - reproducibility_checksum: str — sha256 of first 50 prompts
        principle: "Content-addressed prompt selection prevents corpus drift on re-runs."
      - duration_s: float
        principle: "Live GGUF inference on 50 examples: expected >= 120s; < 30s = suspicious."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records GGUF cache check + CUDA check."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2716
    milestone: "2026.05.258"
    deliverable: "results/experiment_2716_tier0f_semantic_calibration_v2.json"
    title: "Tier 0f: Semantic Reward Calibration for Tier 0e EORM v2 (arXiv:2605.15588)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: verifier

    gated_on:
      - upstream: exp2713-pretest-cascade-fix-v1
        artifact_field: pretest_cascade_fixed
        op: '=='
        value: true

    prior_failures:
      - experiment_id: exp2703-tier0f-semantic-calibration
        verdict: "zero_execution_no_artifact_produced"
        addressed_by: "exp2703 (.257) failed due to conductor pre-test cascade (now fixed in exp2713). Gated on exp2713.pretest_cascade_fixed. Same scope: cluster-aware paraphrase calibration on FoVer corpus. If Tier 0e absent, creates both Tier 0e + 0f in this task."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      arXiv:2605.15588 shows energy-based reward models trained on token-level (correct, incorrect)
      pair objectives have ~40% higher calibration error (ECE) on semantically-equivalent paraphrases.
      Fix: cluster FoVer responses by semantic equivalence (TF-IDF cosine >= 0.9), assign shared
      reward labels within clusters.

