    TASK:
    Produce results/experiment_7219_v636_source_contract.json. Create the thin executable entrypoint scripts/experiments/experiment_7219_v636_source_contract.py. Prefer reusing the listed production modules; any new core implementation stays small and follows the driving spec.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print and flush immediately before checking anything. Verify existing cited paths, driving capability REQ-* requirements, imports, exact upstream fields and writable raw/checkpoint outputs. Inspect resources before extensive coding; never run the whole test suite as a model-load prerequisite. Scope new implementation through spec-first, meaningful failing tests, then code. Reuse shipped modules and entrypoints; do not generate another large generic framework. Reject quarantined or unauthenticated upstream artifacts even if a structured field equals one. Unwrap only dictionaries containing both principle and value. Missing unchanged external prerequisites require terminal blocked with gate_check_summary and prompt exit; do not spend the remaining budget testing an unlaunchable run.
    1. Print a flushed progress line at EVERY numbered phase boundary and BEFORE AND AFTER any model load, generation, benchmark or subprocess that can take minutes. Inside long loops emit completed units and monotonic elapsed time at least every 60 seconds. For a blocking native call or subprocess use an external truthful heartbeat and unbuffered streamed output, with an explicit timeout. Keep EVERY output gap below 600 seconds throughout authoring, execution and tests: silent tasks can die at 1200 seconds; continued real status output permits the 4800-second hard cap. Heartbeats report observed state, never invented progress.
    2. This task invokes no LLM: MODEL_SPECS=[], model_invoked=false. Planned inference_substrate_class=aggregation; inference_substrate=aggregation_from_upstream_artifacts. These are recognized literals, not free-text descriptions. Upstream Qwen outputs are cached evidence, not fresh inference. If this audit executes a new CPU replay/compiler rather than only aggregates, use cpu_exact_solver_or_simulator for both fields. If no qualifying work ran, use blocked_no_run. execution_venue=host; hostname belongs in execution_host. Record actual operation timing without sleeps.
    3. Select research-roadmap-next.yaml before activation or research-roadmap.yaml afterward ONLY by milestone == 2026.09.636. Freeze both selected YAML and V636 design under results/raw/experiment_7219/. Independently parse the Markdown contract table and require exactly 14 IDs, exp7219 through exp7232, in identical execution order with the same titles, deliverables and gates. Do not compare V636 design against V635 YAML.
    4. Run shipped schema, prior-failure, exclusion, prompt-path and gate-declaration checks. Exp7205 failed on a nonexistent python/carnot/experiment_7204_v634_capstone.py. Verify every EXISTING path really exists; distinguish this roster's forward outputs. Use the actual Exp7218 module/script paths. Do not add an invented prerequisite or amend a protected linter.
    5. Exercise conductor_gates.evaluate_gates through temporary passing, failed, missing-field and missing-file inputs for every V636 edge. Record that field gates alone do not enforce quarantine; each consumer must authenticate and reject flagged inputs. Check class/substrate pairs with the real adversarial duration classifier, including the Exp7208 negative counterexample; do not modify classifier code.
    6. Read the V636 source refresh; check up to five primary URLs for execution-time changes, prioritizing compact constraint networks, Memoir, vLLM parser/GGUF docs and KANELE. Record retrieval dates, exact titles, access failures and no-delta results. Add only verified new findings. Record the V635 archive lag without rewriting research-complete.yaml or activating this plan.
    7. Set source_contract_complete_score=1 only after the complete advisory receipt. No science branch depends on this task. Readable contract mismatch is disqualified. Missing external source access is recorded separately from local structural correctness.
    8. Validate only changed scope: focused unit tests, scoped coverage required by CLAUDE.md, Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on explicit affected test paths with a private pytest basetemp. Do not suppress errors, weaken checks or run a repo-wide suite as a precondition. Run the applicable E2E steps from ops/e2e-test-plan.md: grounding public input -> actual extractor/compiler -> executor -> independent labels; memory E2E-007 certificate/retention/rollback; native E2E-003/004 binding/serialization; ARC E2E-009/010 plus LLM-disabled r11l environment smoke. For the planning contract, use file -> parser -> real evaluate_gates with temporary fixtures. For read-only audits, replay actual producer inputs through the relevant reducer. Run unchanged adversarial_verify.py and verdict_row_consistency_lint.py on the completed artifact as applicable; record exact results and unrelated pre-existing failures. Reconcile the driving specs, _bmad/traceability.md, ops/status.md and ops/changelog.md. Print and flush before/after final validation and atomic terminal write; provisional work belongs under results/checkpoints/.

    9. REQUIRED ARTIFACT FIELDS:
       - field_principles: principle: "Annotate actual values in this map; do not wrap arbitrary dictionaries as principle/value records."
       - status: principle: "Write a terminal artifact only when done or externally blocked; running checkpoints use a different path."
       - run_date: principle: "Use {date} and record actual UTC timestamps, never copy an upstream run date."
       - preconditions_checked: principle: "Actual code, resource, identity and gate observations before expensive work."
       - inference_substrate: principle: "Use the recognized literal for the work actually executed; custom free text caused the Exp7208 quarantine."
       - inference_substrate_class: principle: "Match actual generation, load-only, CPU or aggregation work and its duration floor."
       - execution_venue: principle: "Exactly host, kv260, gatemate or polarfire; the top-level orchestration here is host."
       - execution_host: principle: "Actual hostname separate from venue."
       - duration_s: principle: "Measured monotonic work time; no padding or reclassification to evade a floor."
       - source_artifact_hashes: principle: "Bind code, source documents, manifests and raw evidence to claims."
       - rows: principle: "Per unit/arm/seed metric, error and abstention for every comparison; retain full denominators."
       - sample_size_budget: principle: "Planned, attempted, completed, censored and independent units; no silent removal."
       - random_seed: principle: "Freeze random choices before reading held-out outcomes."
       - reproducibility_checksum: principle: "Hash exact source, inputs, settings and raw unit rows."
       - gate_check_summary: principle: "Every blocked_* verdict names failed check, upstream, field, expected and observed value."
       - verifier_is_oracle: principle: "True when correctness authority is reused as the verifier; independent code alone is not distinct authority."
       - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. partial means unfinished own work only."
       - honest_verdict: principle: "Use complete_ or complete: for completed findings; blocked_* for external absence. A failed acceptance gate forbids positive."
       - MODEL_SPECS: principle: "Only models actually invoked; [] for CPU/aggregation, mandated Qwen3.8 for every model task."
       - model_invoked: principle: "True only for actual model execution; upstream model outputs are cached evidence."
       - source_contract_complete_score: principle: "One means structural/source receipt complete, not scientific value."
       - contract_rows: principle: "All fourteen independently parsed task records."
       - activation_validation_rows: principle: "Real validators and isolated gate cases, including negative controls."
       - source_method_rows: principle: "Primary URL, date, access outcome and bounded use."

