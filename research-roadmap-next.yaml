        addressed_by: "The V545 transition preserves the failed validation receipts and validates a new 14-task observable-contract and certified-learning roadmap instead of promoting V544 broadly."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 2026.08.544 is scientifically terminal. Exp6312 closed the model-local representation branch. Exp6318 and Exp6319 proved versioned factor-local same-domain learning. Exp6321 proved a target-licensed live ARC shadow without a solve. Exp6322 also recorded broad pytest exit 3 and determination-lint exit 1. V545 reserves Exp6323-Exp6336. It must preserve every terminal state and failed command.

