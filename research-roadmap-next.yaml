      addressed_by: "V629 keeps source pages non-oracular, separates local cache receipts, and accepts an empty decision-changing delta as terminal null evidence."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The V629 planner added OptiVer, SkillGLoW, Trace2Tower, and CAPTURE to
    research-references.md. Exp7149 stopped before it checked any prerequisite.
    V629 needs one dated execution-time refresh and exact cache receipts. Source
    pages are method receipts. They are not Carnot execution oracles.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/research-hardware-wishlist.md
    - {project_root}/research-roadmap.yaml
    - {project_root}/results/experiment_7149_v628_source_delta.json
    - {project_root}/scripts/experiments/experiment_7137_v627_source_delta.py
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Refresh the selected 2025-2026 sources and the local model cache. Map only
    methods that change a V629 task. Append one idempotent dated execution delta
    to research-references.md and write a reproducible artifact. Download no
    model and make no external product claim.

    CONCRETE STEPS:
    0. Create the schema-complete artifact first, then check source, cache,
       reference, and output paths. Record preconditions_checked before any
       network call. Leave running state after the checks. A missing local
       prerequisite is blocked_no_run with an exact gate_check_summary.
    1. At every numbered phase boundary, print a flushed progress line. Print
       flushed start and end lines immediately before and after every call that
       can take minutes, including a model load, generation, benchmark, or
       subprocess. Print a flushed heartbeat at least every 300 seconds inside
       long loops. Keep every stdout gap below 600 seconds.
    2. Recheck current arXiv work on EBM reasoning, neural constraints, Ising,
       hallucination control, KANs, constrained generation, hardware sampling,
       and continual learning. Restrict new claims to 2025-2026.
    3. Recheck OpenReview, Extropic writing, Semantic Scholar citations to EBT
       2507.02092 and ARM-EBM 2512.15605, Hugging Face Papers, GitHub weekly
       discovery, and Logical Intelligence. Record access limits as rows.
    4. Recheck these exact repositories with cached_sota_pair() and no download:
       unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and
       unsloth/gemma-4-26B-A4B-it-GGUF. Record candidate path, quantization,
