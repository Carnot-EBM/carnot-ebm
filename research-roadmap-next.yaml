    model: opus
    max_turns: 100
    prompt: >
      CONTEXT: We must synthesize the bitfile for the KV260 FPGA to execute the HILED software prototype built in .136.
      EXISTING CODE TO READ FIRST: `hardware/kv260/synth_ising.tcl`, `hardware/kv260/ising_sampler_v2.v`.
      TASK: Synthesize the HILED FPGA bitfile.
      CONCRETE STEPS:
      1. Update TCL scripts to include the HILED endpoints.
      2. Attempt bitfile synthesis (mock the output if Vivado is unavailable but document the TCL/RTL correctness).
      3. Write `{project_root}/results/experiment_1778_kv260_synthesis.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

