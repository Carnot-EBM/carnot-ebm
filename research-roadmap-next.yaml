- id: exp6753-object-table-fetch-on-demand-ab
  title: Live ARC object-table fetch-on-demand paired comparison
  track: arc-agi3
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 360
  per_unit_rows: true
  milestone: 2026.08.588
  deliverable: results/experiment_6753_object_table_fetch_on_demand_ab.json
  prompt: |
    CONTEXT:
    The static object table consumes about 54-56 percent of measured ARC induce prompts, but the
    prior default-ON table improved held change_fidelity by +0.0720 across 20 paired games.
    Exp6716 did not start because its context setting was external and unset. Exp6752 now owns the
    32K context and proves the live code-carrying tool shape. The question is non-inferiority with
    realized token savings, not whether deleting text shortens a prompt.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/openspec/capabilities/arc-world-model-trust-energy/spec.md
    - {project_root}/docs/research-notes/arc-context-frame-compression-and-callable-tools-2026-08-28.md
    - {project_root}/results/outer_loop_arc_object_perception_heldout_ab_change_fidelity_20260801.json
    - {project_root}/results/experiment_6716_object_table_fetch_on_demand_ab.json
