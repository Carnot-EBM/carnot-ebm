    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Matrix v23 flagged a model-spec metadata gap even though exp3099 listed the mandated model IDs. .290 needs a manifest that downstream experiments can consume before making local SOTA claims.

      MODEL_SPECS
