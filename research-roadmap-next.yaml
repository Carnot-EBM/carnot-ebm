  - id: exp2013-tier3-predictive-verification-fr11
    milestone: "2026.05.157"
    title: "Exp 2013: Tier 3 Predictive Verification (FR-11)"
    deliverable: "results/experiment_2013_tier3_predictive_verification_fr11.json"
    agent_type: "codex"
    prompt: |
      CONTEXT: Today is {date}. Workspace is {project_root}. Mandatory continuous self-learning task. Tier 3 requires preemptively predicting constraint violations before LLMs finish generation.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verify_repair.py
      TASK: Train and implement a JEPA-style predictor for preemptive verification.
      MODEL_SPECS: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-26B-A4B-it-GGUF
      CONCRETE STEPS:
      1. Construct a small predictor model mapping partial generated tokens to eventual constraint violations.
      2. Integrate into a preemptive guided decoding loop.
      3. Emit `continuous_self_learning_task` metrics.
      4. Write the results artifact.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

