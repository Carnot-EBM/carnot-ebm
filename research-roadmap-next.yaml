# OUTER-LOOP / OPERATOR PRE-STAGED ROADMAP (2026-06-03, Claude Opus 4.8). PROVENANCE:
# .345 fully landed (11/11): G2 re-reproduced locally (auroc 0.913134 in CI), certified abstention point
# shipped (exp3771: threshold 0.733, coverage 0.998 at risk<=0.05, split-conformal delta=0.05 n=2619),
# Thesis-A definitive reconcile restored, G3 narrowing lint wired, pkg/CLI/MCP E2E smoke passed, FR-11 v17
# (Tier-1 verifier-precision tracker) ran, PRM positioning done, KV260 terminal confirmed, paper_ready=TRUE.
#
# .346 is a CONVERGENCE milestone, NOT breadth churn (north-star sec-1). The verifier-moat (P2) thread is
# CLOSED for ~zero GPU per the 2026-06-03 Deep Think round (reference_deep_think_post_bounded_2026_06):
# on standard MATH, SC AUROC ~0.95 near-ceiling and the SC-failure residual was ~5 items, all answer-
# NORMALIZATION false-negatives -- so the verifier's defensible claim is the banked math step-error product,
# NOT a general independence-moat. A scissor-plot GPU sweep would re-grind a closed thread -- it is NOT here.
#
# THE ONE GENUINELY-OPEN energy-existential question is P1 (artifact-vs-fundamental for energy-as-generator
# on discrete text). The discrete-search test ran TWICE today (thesis_a_p1_discrete_search v1/v2) and is
# INCONCLUSIVE -- NOT because the energy side failed, but because the from-scratch AR POSITIVE CONTROL
# collapsed to 0.0 (v1 used the too-small model; v2 used n_train=20000, which starves AR on 3-digit MSD-first
# addition). Root cause diagnosed; harness n_train fixed to 40000 (where AR=0.84) + post-train checkpoint
# added. v3 (exp3777) reruns with a VALID positive control and an ar_best>=0.3 gate -> settles artifact-vs-
# fundamental. This satisfies the Failed-Experiment Rerun Discipline cleanly (prior_failures block names v1/v2,
# the diagnosed cause, what is different, retire_if_same_verdict). energy-as-generator stays BOUNDED from
# part-b REGARDLESS of the v3 outcome -- P1 only sharpens the mechanism.
#
# ROUTING: gemini CRASHES real GPU workloads + has wiped milestones via 429 (incident_333), so the cheap-
# default is CODEX (requires_codex). The ONE GPU task (exp3777) is CLAUDE+opus+max_turns:100 (GPU/bootstrap
# risk -> opus per the hardware-integration routing rule; C+E escalation is claude-only). The other judgment
# task is exp3781 (EDLM feasibility synthesis) -> claude. Everything else is codex (mechanical/aggregation).
#
# INTERPRETER DISCIPLINE (incident_ebt_training_venv_python_cuda): EVERY Run command pins .venv/bin/python --
# bare `python` is /usr/bin/python3 with NO torch/yaml/sklearn. Even CPU tasks need project deps for
# scripts/adversarial_verify.py + scripts/summarize_artifact.py + verifier scoring.
#
# ANTI-POISON-TEST (the .344 ROOT CAUSE): any shipped test MUST assert against the script's REAL behavior and
# any new research-complete.yaml value containing a colon MUST be quoted. A failing shipped test -- or a stray
# unquoted colon -- poisons the conductor pre-test gate and SKIPs the whole milestone.
#
# GATING: NO hard gated_on this milestone (the .340 proven-safe pattern). Every task reads upstream with a
# graceful disk-presence fallback -- never crash on a missing field, never label un-run work as a negative.
# INVARIANTS re-asserted at capstone: paper_ready TRUE; FoVer 0.9131 frozen; both energy routes bounded.

