  # ---- P0.1 v3: THE crux — does energy beat self-consistency at equal compute?
  - id: exp3437-energy-vote-vs-self-consistency-real-harness-premise-v3
    operator_override: "2026-05-29 operator directive (standing): P0.1 is the hand-authored Phase-3 de-risking experiment in ops/known-issues.md. exp3426 (.316) ran but its multi-sample harness broke (every k-sample condition = 0.0 accuracy = degenerate 0.0-vs-0.0 tie); this v3 is the intended clean supersession that FIXES the sampling/extraction/vote path and verifies the SC baseline is non-degenerate before any energy comparison — not a doomed rerun."
