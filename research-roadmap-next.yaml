    8. Freeze complete service work: feature extraction, score, feedback release, guard evaluations, bounded two-scalar update, durable writes and restart. CPU is the current path; batch matrix work can map to GPU/NPU and scalar adapters to Rust/SIMD. No100x claim follows without measured removable cost. Use verifier_ensemble_against_cached_candidates/no_model_load and empty MODEL_SPECS.
    9. Before implementation, extend the named REQ/SCENARIO and write failing tests. Reuse existing helpers. Run scoped pytest with measured 100-percent newly owned unit/child statement coverage and zero exclusions, Ruff check and format --check, strict mypy, and scripts/check_spec_coverage.py with positional test paths. Exercise applicable private E2E-018/021 CLI publication, cold replay and rehashed-tamper refusal; keep tests in private scratch. Record global debt separately and never waive failed owned checks. Reconcile specs, _bmad/traceability.md, ops/status.md and ops/changelog.md from actual outcomes.
