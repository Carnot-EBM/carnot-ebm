      - experiment_id: exp2266-archive-and-activate
        verdict: "complete: blocked_roadmap_missing"
        addressed_by: "exp2266 checked for milestone: '2026.05.223' in research-roadmap.yaml, but the file already showed '2026.05.224' (the .224 planning agent wrote tasks directly to the active roadmap). This attempt corrects the precondition to check for '2026.05.224', which is what the file now contains."
    prompt: |
      CONTEXT: Milestone 2026.05.224 has completed. We must archive it and activate 2026.05.225.
      exp2266 (prior archive attempt) failed because its PRECONDITION checked for
      milestone: "2026.05.223" but research-roadmap.yaml already contained "2026.05.224".
      This task uses the CORRECTED precondition.
      EXISTING CODE TO READ FIRST: {project_root}/research-complete.yaml, {project_root}/research-roadmap.yaml
      TASK: Archive 2026.05.224 to research-complete.yaml and initialize the .225 milestone.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. Verify {project_root}/research-roadmap.yaml exists and contains milestone: "2026.05.224".
              If the file is missing or does NOT contain "2026.05.224", write honest_verdict
              blocked_roadmap_missing and exit.
        1. Append all tasks from research-roadmap.yaml under a new "2026.05.224" entry in
           research-complete.yaml, setting completed_date to {date}.
        2. Replace research-roadmap.yaml contents with the contents of research-roadmap-next.yaml.
