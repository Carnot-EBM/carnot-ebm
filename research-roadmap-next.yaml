        random_seed:
          principle: "Determinism precondition (the field exp1999 lacked)."
        reproducibility_checksum:
          principle: "Content hash of the run inputs (the field exp1999 lacked)."
        duration_s:
          principle: "Wall-clock plausibility floor; a real generation+repair run takes minutes (a blocked exit is fast and honest)."
