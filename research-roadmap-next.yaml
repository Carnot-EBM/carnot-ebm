milestone: "2026.08.557"
milestone_title: "Identifiable Constraint Energy and Production-Shadow Self-Learning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6473-v556-terminal-evidence-and-retirement-boundary
    milestone: "2026.08.557"
    deliverable: results/experiment_6473_v556_terminal_evidence_and_retirement_boundary.json
    title: "V556 terminal evidence and retirement boundary"
    priority: critical
    track: infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 20
    estimated_wall_time_min: 45
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6460-v556-terminal-handoff-and-queue-integrity
        verdict: "complete_blocked_v556_queue_integrity_failed: V555 terminal facts are preserved but a V556 queue contract failed"
        addressed_by: "This task does not validate or activate a new queue. It freezes completed V556 artifacts, recomputes capstone eligibility, and records the corpus retirement boundary from terminal evidence only."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V556 completed all 13 tasks. Exp6472 granted narrow continuous-learning and ARC eligibility, denied the constraint-routing science claim, and retired three repeated blocked shapes. Exp6460 itself repeated a retired transition shape. V557 must start from a stable evidence boundary without another queue-transition experiment. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6460_v556_terminal_handoff_and_queue_integrity.json through {project_root}/results/experiment_6472_v556_adversarial_capstone.json where present
      - {project_root}/python/carnot/experiment_6472_v556_adversarial_capstone.py and its focused tests
      - {project_root}/ops/conductor-log.md, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/known-issues.md
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, and {project_root}/ops/e2e-test-plan.md

      TASK
      Freeze the V556 terminal evidence, independently recompute claim eligibility, and record which failed scopes are retired. Do not validate research-roadmap-next.yaml, activate a queue, repair V556, or let this task gate any science branch.

      CONCRETE STEPS
      0. Resolve all 13 expected V556 artifact paths, bytes, hashes, terminal verdicts, and current git state. Record absent and zero-byte files.
      1. Add or confirm narrow research-reporting REQ-* and SCENARIO-* entries. Write focused tests first.
      2. Emit one immutable terminal row per V556 task with status, honest_verdict, readiness fields, eligibility, gate diagnostics, path, bytes, and SHA-256.
      3. Recompute science, continuous-learning, ARC, and hardware eligibility from the declared row rules in Exp6472. Compare the result with the capstone.
      4. Recompute the repeated-verdict retirement rows for Exp6460, Exp6464, and Exp6466. Distinguish mechanically retired scope from a merely blocked task.
      5. State that Exp6465 and Exp6467 did not execute and cannot support a result. Do not turn absence into a negative science finding.
      6. Set staged_queue_validation_performed=false and downstream_gate_count=0.
      7. Run focused tests, row-consistency lint, adversarial verification, and applicable reporting E2E checks. Inspect git status after tests and report unrelated mutations.

      Required deliverable: {project_root}/results/experiment_6473_v556_terminal_evidence_and_retirement_boundary.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state separates completed evidence aggregation from an interrupted handoff."
        v556_terminal_rows:
          principle: "One row per task prevents missing artifacts from disappearing inside a milestone summary."
        artifact_hash_manifest:
          principle: "Content hashes bind each determination to the exact evidence bytes that were audited."
        capstone_eligibility_recomputation:
          principle: "Independent recomputation prevents inherited capstone booleans from becoming circular proof."
        retirement_boundary_rows:
          principle: "Explicit retirement rows stop repeated blocked techniques from returning under new names."
        staged_queue_validation_performed:
          principle: "A false value proves this task did not repeat the retired queue-transition scope."
        downstream_gate_count:
          principle: "Zero downstream gates prevents an infrastructure finding from suppressing independent science."
        per_unit_rows:
          principle: "Task-level rows make every aggregate and eligibility decision independently checkable."
        aggregate_row_recomputation:
          principle: "Row-derived aggregates catch summaries that disagree with their own evidence."
        protected_files_unchanged:
          principle: "Protected-file receipts prevent evidence aggregation from rewriting the system it audits."
        gate_check_summary:
          principle: "Any blocked verdict must name the failed check and observed value instead of hiding behind a status label."
        preconditions_checked:
          principle: "Precondition receipts prove the expected artifacts and repository state existed before aggregation."
        inference_substrate:
          principle: "Declaring aggregation_from_upstream_artifacts prevents a no-model audit from being misread as live inference."
        verifier_is_oracle:
          principle: "Only deterministic hash and row arithmetic may be treated as authoritative in this task."
        field_principles:
          principle: "A field-to-principle map preserves why each evidence contract exists."
        field_provenance:
          principle: "Exact source paths make each field traceable to a row, artifact, or deterministic reducer."
        random_seed:
          principle: "A fixed seed makes any ordering or attack sampling reproducible."
        duration_s:
          principle: "Measured wall time detects bootstrap-only or fabricated completion."
        tests_run:
          principle: "Recorded commands distinguish executed verification from intended verification."
        reproducibility_checksum:
          principle: "A stable checksum detects later drift in inputs or the terminal artifact."
        honest_verdict:
          principle: "A self-declared terminal result forces completion, blocking, and eligibility to be stated plainly."
      ACCEPTANCE GATES:
        - condition: "All 13 V556 task IDs have a row or an explicit missing-artifact row."
          principle: "Complete accounting prevents selection of only favorable terminal evidence."
        - condition: "staged_queue_validation_performed=false AND downstream_gate_count=0."
          principle: "The condition prevents recurrence of the retired queue-transition and cascade pattern."
      Set inference_substrate=aggregation_from_upstream_artifacts. Set verifier_is_oracle=true only for hashes and deterministic row arithmetic. A blocked_* verdict requires gate_check_summary with check, expected value, observed value, and evidence path.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6473_v556_terminal_evidence_and_retirement_boundary --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6474-protocol-identifiability-and-receipt-preflight
    milestone: "2026.08.557"
    deliverable: results/experiment_6474_protocol_identifiability_and_receipt_preflight.json
    title: "Protocol-identifiability and receipt-conformance preflight"
    priority: critical
    track: infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    prompt: |
      CONTEXT
      Recent work on protocol-level identifiability (arXiv:2608.13326) and sampling-verification danger (arXiv:2608.17956) shows that local accuracy can be precise while the observation support does not identify the claimed intervention effect. V557 needs a reusable zero-inference preflight before held causal selection. It also needs the existing task-scoped receipt contract to cover queue, load, execution, exact verification, and artifact phases. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - the V557 refresh in {project_root}/research-references.md
      - {project_root}/python/carnot/task_runtime_receipts.py
      - {project_root}/python/carnot/experiment_6426_task_scoped_runtime_receipt_contract.py and focused tests
      - exact constraint, candidate-selection, and row-reducer helpers under {project_root}/python/carnot
      - relevant infrastructure and verification OpenSpec files
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build a reusable structural identifiability audit over a finite policy class, observation support, and scalar estimand. Emit constructive collision witnesses for non-identifying supports and a minimum identifying support for the declared V557 held-selection policy class. Verify task-scoped runtime receipt conformance without running an LLM.

      CONCRETE STEPS
      0. Record repository state, exact runtime dependencies, existing receipt schema hash, policy-class fixture hash, and available exact reducers.
      1. Add REQ-* and SCENARIO-* entries for protocol identifiability and receipt conformance. Write focused tests first.
      2. Implement a finite deterministic API that groups policies by their outcomes on observation support and detects cross-estimand collisions.
      3. Emit a constructive pair of policies for every collision. Preserve the differing target effect and the identical observed outcomes.
      4. Synthesize a minimum identifying support for the frozen held-selection policy class. Verify it by exhaustive enumeration.
      5. Include positive controls, leave-one-support-out collisions, duplicated observations, empty support, constant estimand, and changed-policy-class attacks.
      6. Validate queue_wait, model_load_or_fixture_load, execution, exact_verification, and artifact_write receipt phases with monotonic times, hashes, PIDs, exit status, and CPU fallback state.
      7. Emit one row per policy pair, support condition, attack, and receipt phase. Recompute all aggregates from rows.
      8. Run focused tests, 100% task-module coverage, spec coverage, row lint, adversarial verification, and applicable E2E checks. Inspect git status after tests.
      9. Set protocol_identifying_score=1.0 only when the declared support has no cross-estimand collision, every required receipt phase is conformant, and every non-identifying control yields a witness.

      Required deliverable: {project_root}/results/experiment_6474_protocol_identifiability_and_receipt_preflight.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal status distinguishes a completed structural proof from an interrupted search."
        policy_class_manifest:
          principle: "A frozen finite policy class makes the scope of the identifiability claim explicit."
        observation_support_manifest:
          principle: "The exact observed cells determine what behavioral differences the protocol can see."
        estimand_definition:
          principle: "A named target effect prevents the audit from proving identifiability for the wrong claim."
        collision_witnesses:
          principle: "Constructive policy pairs turn a failed audit into replayable evidence instead of an opaque score."
        minimum_identifying_support:
          principle: "A minimal support exposes which observations are load-bearing for the causal claim."
        leave_one_support_out_rows:
          principle: "Leave-one-out rows detect supports that appear sufficient only because a critical cell was not challenged."
        task_scoped_receipt_rows:
          principle: "Phase receipts attribute time, process, bytes, and exact verification to this task rather than global activity."
        per_unit_rows:
          principle: "Pair, support, attack, and phase rows let an auditor recompute every conclusion."
        aggregate_row_recomputation:
          principle: "Independent reduction catches identifiability or conformance summaries that contradict rows."
        attack_matrix:
          principle: "Explicit attacks test empty, duplicate, stale, and changed-class failure modes before reuse."
        protocol_identifying_score:
          principle: "A conjunctive binary gate prevents downstream inference when the observation protocol cannot identify the target effect."
        protected_files_unchanged:
          principle: "The preflight must not alter protected evaluators or roadmap machinery."
        gate_check_summary:
          principle: "A blocked state must identify the failed structural or receipt check and its observed value."
        preconditions_checked:
          principle: "Preflight receipts prove the declared policy class, reducer, and runtime schema existed before testing."
        inference_substrate:
          principle: "Declaring deterministic_synthetic_protocol_audit_no_llm prevents fixture enumeration from being reported as model evidence."
        verifier_is_oracle:
          principle: "Exhaustive finite enumeration and receipt arithmetic are exact within the frozen policy class only."
        field_principles:
          principle: "A principle map carries design intent into later audits and artifacts."
        field_provenance:
          principle: "Per-field source paths and hashes prevent unsupported summary values."
        random_seed:
          principle: "A fixed seed reproduces any support-search ordering and attack sampling."
        duration_s:
          principle: "Wall time catches a structural audit that never completed enumeration."
        tests_run:
          principle: "Recorded commands prove the reusable API and attacks were executed."
        reproducibility_checksum:
          principle: "The checksum binds policy class, support, estimand, code, and result."
        honest_verdict:
          principle: "The verdict states whether the protocol is identifying without converting class-relative proof into a global claim."
      ACCEPTANCE GATES:
        - condition: "protocol_identifying_score == 1.0"
          principle: "Downstream causal selection is invalid when two policies with different target effects remain observationally identical."
        - condition: "Every required task-scoped receipt phase is present and internally consistent."
          principle: "Complete phase attribution prevents global runtime or stale process activity from masquerading as task execution."
      Set inference_substrate=deterministic_synthetic_protocol_audit_no_llm. Set verifier_is_oracle=true only within the enumerated finite class and for receipt arithmetic. A blocked_* verdict requires gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6474_protocol_identifiability_and_receipt_preflight --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6475-v557-primary-source-and-product-state
    milestone: "2026.08.557"
    deliverable: results/experiment_6475_v557_primary_source_and_product_state.json
    title: "V557 primary-source and product-state receipt"
    priority: high
    track: sota-ingestion
    requires_gpu: false
    per_unit_rows: true
    max_turns: 20
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6461-v556-primary-source-freshness-receipt
        verdict: "blocked_primary_source_receipt: primary pages are source receipts only; no product, hardware, model, or ARC execution oracle was invoked."
        addressed_by: "This task treats source-only evidence as a successful receipt when hashes and timestamps are complete. It covers a new arXiv release and Extropic's August 2026 stack update without turning pages into execution claims."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The V557 planning sweep found new work on protocol identifiability, backend-neutral exact constraints, MoE hallucination signals, and the Extropic Torx/Thermalizers/Z1 stack. Exp6461 used a blocked prefix even though source-only evidence was the intended output. This task uses terminal complete_* or success_* for a complete receipt and reserves blocked_* for actual network or evidence failure. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - the V556 and V557 refresh sections in {project_root}/research-references.md
      - {project_root}/results/experiment_6461_v556_sota_source_and_benchmark_delta.json and source
      - {project_root}/scripts/sweep_citations.py, {project_root}/scripts/sweep_semscholar.py, and current source-receipt helpers
      - {project_root}/ops/known-issues.md, {project_root}/ops/arc_solve_registry.yaml, and current ARC benchmark records
      - relevant research-reporting OpenSpec files and {project_root}/ops/e2e-test-plan.md

      TASK
      Produce a dated primary-source receipt for the 2026-08-14 through 2026-08-18 arXiv releases and the requested secondary sources. Verify EBT and ARM-EBM citation trails, OpenReview, Hugging Face Papers, GitHub Trending, Extropic, Logical Intelligence, and the rendered ARC leaderboard. Do not claim execution of an unavailable model, product, API, or hardware device.

      CONCRETE STEPS
      0. Record network availability, query timestamp, URL, HTTP state, response hash, and cache path for every source.
      1. Add or confirm source-receipt REQ-* and SCENARIO-* entries. Write focused tests first.
      2. Query arXiv for the requested EBM, constraint, Ising, hallucination, KAN, guided-decoding, hardware-sampling, and continual-learning clusters.
      3. Query Semantic Scholar citations for arXiv:2507.02092 and arXiv:2512.15605. Report arXiv-indexed records separately from total counts. Do not invent counts after rate limits.
      4. Recheck OpenReview, Hugging Face Papers, GitHub Trending, Extropic first-party writing and API landing page, and Logical Intelligence first-party pages.
      5. Record Extropic's stated Z1 and simulator/API status as source claims. Do not authenticate, benchmark, or infer local availability.
      6. Render the current ARC leaderboard. Distinguish displayed state from snippets and cached records.
      7. Emit one row per source and finding with prior state, current state, evidence hash, novelty, relevance, and disposition.
      8. Append to research-references.md only if a primary finding is newer than the V557 planner cutoff. Do not duplicate the existing V557 section.
      9. Run focused tests and source-row consistency checks. Inspect git status after tests.

      Required deliverable: {project_root}/results/experiment_6475_v557_primary_source_and_product_state.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A complete source receipt is a valid terminal outcome even though sources are not execution oracles."
        query_manifest:
          principle: "Exact queries make literature coverage reproducible and expose search blind spots."
        source_timestamps_and_hashes:
          principle: "Timestamps and hashes distinguish current primary pages from stale snippets or cached paraphrases."
        arxiv_release_boundary:
          principle: "A dated cutoff prevents old papers from being presented as a new milestone delta."
        ebt_citation_rows:
          principle: "Paper-level rows prevent citation totals from hiding missing identifiers or irrelevant records."
        arm_ebm_citation_rows:
          principle: "Separate rows keep the two anchor citation trails auditable."
        openreview_rows:
          principle: "Venue rows preserve review status and avoid treating submissions as established results."
        huggingface_rows:
          principle: "Paper-page rows separate community promotion from primary experimental authority."
        github_rows:
          principle: "Repository rows prevent popularity or recency from becoming an unexamined dependency decision."
        extropic_first_party_status:
          principle: "First-party product state may guide planning but cannot prove authenticated Carnot execution."
        logical_intelligence_first_party_status:
          principle: "Kona claims remain product context until weights and a reproducible local runner exist."
        rendered_arc_leaderboard_receipt:
          principle: "A rendered receipt prevents public scores from being inferred from snippets or stale local files."
        per_unit_rows:
          principle: "One source row per check makes novelty and disposition independently reviewable."
        promoted_findings:
          principle: "Explicit promotion reasons connect current work to bounded Carnot experiments."
        unavailable_substrates:
          principle: "Named missing credentials, weights, or devices stop source pages from becoming fabricated execution claims."
        protected_files_unchanged:
          principle: "Source ingestion must not rewrite protected evaluators or conductor logic."
        gate_check_summary:
          principle: "A blocked source must name the failed URL, expected response, observed response, and cached evidence."
        preconditions_checked:
          principle: "Network and cache checks prove the task knew which sources were reachable before drawing conclusions."
        inference_substrate:
          principle: "Declaring primary_source_receipt_no_model_execution keeps document research separate from model inference."
        verifier_is_oracle:
          principle: "Source hashes verify page identity only; they do not verify product or model performance."
        field_principles:
          principle: "A principle map keeps each source field tied to its epistemic boundary."
        field_provenance:
          principle: "URLs, response hashes, and row IDs make every summary traceable."
        random_seed:
          principle: "A declared seed reproduces any deterministic result ordering or sampling."
        duration_s:
          principle: "Wall time detects a receipt that skipped the requested source set."
        tests_run:
          principle: "Executed checks distinguish verified receipt machinery from prose-only research."
        reproducibility_checksum:
          principle: "The checksum binds query, cutoff, response hashes, and result."
        honest_verdict:
          principle: "The verdict must separate complete receipt, partial network block, and unsupported execution claim."
      ACCEPTANCE GATES:
        - condition: "Every requested source has a current row or a source-specific blocked row."
          principle: "Full accounting prevents quiet omission of inaccessible or contradictory sources."
        - condition: "No source row is promoted as model, product, API, ARC, or hardware execution evidence."
          principle: "Primary pages describe claims but cannot authenticate Carnot's runtime path."
      Set inference_substrate=primary_source_receipt_no_model_execution. Set verifier_is_oracle=false except for response identity and hash checks. A blocked_* verdict requires gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6475_v557_primary_source_and_product_state --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6476-v556-corpus-label-commitment-forensic
    milestone: "2026.08.557"
    deliverable: results/experiment_6476_v556_corpus_label_commitment_forensic.json
    title: "V556 corpus label-commitment forensic and retirement adjudication"
    priority: critical
    track: evidence-integrity
    requires_gpu: false
    per_unit_rows: true
    max_turns: 20
    estimated_wall_time_min: 75
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6463-sota-fixed-policy-candidate-corpus-v2
        verdict: "complete: fixed-policy corpus v2 finished but readiness gate stayed closed"
        addressed_by: "This task performs no generation and cannot reconstruct a commitment. It forensically tests whether pre-inference label and partition receipts already exist; otherwise it recommends permanent retirement of this corpus lineage."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6463 produced valid raw bytes and held candidate headroom, but its critical label_commitments gate failed. Exp6464 and Exp6466 then repeated blocked verdicts and were retired. V557 must not regenerate the same corpus or infer that a later manifest proves an earlier seal. This task examines historical bytes only and has no downstream gate. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6462_sota_raw_persistence_uniqueness_canary.json and source
      - {project_root}/results/experiment_6463_sota_fixed_policy_candidate_corpus_v2.json, sidecars, checkpoints, raw manifests, and source
      - {project_root}/results/experiment_6472_v556_adversarial_capstone.json
      - label-commitment and corpus requirements in {project_root}/openspec/capabilities/verification/spec.md
      - {project_root}/ops/exclusion_manifest.yaml, {project_root}/ops/conductor-log.md, and git history for the relevant paths
      - {project_root}/scripts/adversarial_verify.py, row lint, artifact convention checks, and {project_root}/ops/e2e-test-plan.md

      TASK
      Determine whether the existing Exp6463 on-disk evidence proves that labels and partition membership were committed before the first inference event. Generate no new model output, labels, manifests, or repaired timestamps. Emit a narrow salvage score or a retirement recommendation.

      CONCRETE STEPS
      0. Hash all existing Exp6462 and Exp6463 artifacts, raw files, checkpoints, manifests, source, tests, and relevant git objects before analysis.
      1. Add a forensic REQ-* and SCENARIO-* entry. Write focused tests first.
      2. Build one row per unit and partition with label hash, membership hash, prompt hash, first raw-event time, checkpoint time, file metadata, git presence, and any signed or content-addressed precommit receipt.
      3. Use content and causal order, not mutable mtime alone. A post-inference file that repeats the labels is not a precommitment.
      4. Verify held membership, exact labels, and prompt template independently. Distinguish a sealed unit list from sealed labels.
      5. Attack reconstructed manifests, copied timestamps, git commits after inference, label hashes without membership hashes, partial partition receipts, and path-only commitments.
      6. Emit corpus_lineage_disposition as salvage_existing_bytes, development_only, or retire_lineage. Do not write ops/exclusion_manifest.yaml; the capstone owns reconciliation.
      7. Set corpus_label_commitment_salvage_score=1.0 only if every held unit has immutable pre-inference label and membership proof. Otherwise set zero and preserve constructive missing-proof rows.
      8. Run focused tests, row lint, adversarial verification, artifact-convention checks, and applicable E2E checks. Inspect git status after tests.

      Required deliverable: {project_root}/results/experiment_6476_v556_corpus_label_commitment_forensic.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal forensic state distinguishes completed adjudication from an interrupted search for receipts."
        upstream_artifact_hashes:
          principle: "Frozen hashes prevent the forensic from silently changing the evidence it evaluates."
        first_inference_event_receipt:
          principle: "The earliest generation event defines the causal deadline for every valid commitment."
        label_and_membership_commitment_rows:
          principle: "Per-unit rows distinguish sealed labels, sealed membership, and merely present later files."
        file_time_and_git_receipts:
          principle: "Multiple clocks and git objects reduce reliance on mutable filesystem metadata."
        missing_or_posthoc_proof_rows:
          principle: "Constructive failure rows show exactly why a held unit cannot be credited."
        attack_matrix:
          principle: "Adversarial reconstructions test whether the forensic mistakenly accepts post-hoc evidence."
        corpus_lineage_disposition:
          principle: "A finite disposition prevents an ambiguous corpus from returning as held evidence later."
        corpus_label_commitment_salvage_score:
          principle: "A conjunctive score blocks salvage unless every held label and membership commitment predates inference."
        per_unit_rows:
          principle: "Unit-level receipts let a reviewer reproduce the all-or-nothing salvage decision."
        aggregate_row_recomputation:
          principle: "Row reduction catches a positive salvage summary with even one uncovered held unit."
        protected_files_unchanged:
          principle: "The forensic cannot manufacture validity by editing the corpus, conductor, or protected records."
        gate_check_summary:
          principle: "Any blocked forensic must name the missing evidence path and observed state."
        preconditions_checked:
          principle: "Input hashes and path inventory prove the historical evidence was frozen before examination."
        inference_substrate:
          principle: "Declaring aggregation_from_upstream_artifacts prevents historical replay from being reported as new SOTA inference."
        verifier_is_oracle:
          principle: "Hash and causal-order checks are authoritative only for the recorded bytes and times."
        field_principles:
          principle: "A principle map prevents later reinterpretation of a receipt field as stronger evidence."
        field_provenance:
          principle: "Path, hash, git object, and reducer provenance make every adjudication traceable."
        random_seed:
          principle: "A fixed seed reproduces attack and row ordering."
        duration_s:
          principle: "Measured duration detects a forensic that emitted before reading the historical evidence."
        tests_run:
          principle: "Executed tests prove the post-hoc and timestamp attacks were exercised."
        reproducibility_checksum:
          principle: "The checksum binds the frozen historical evidence and forensic result."
        honest_verdict:
          principle: "The verdict must state salvage, development-only use, or retirement without inventing a science result."
      ACCEPTANCE GATES:
        - condition: "corpus_label_commitment_salvage_score == 1.0 only if every held unit has label and membership proof older than first inference."
          principle: "A later artifact cannot causally establish an earlier held-label commitment."
        - condition: "No new inference, labels, membership manifest, or repaired timestamps are created."
          principle: "Forensic analysis may discover evidence but cannot manufacture the event it is supposed to prove."
      Set inference_substrate=aggregation_from_upstream_artifacts. Set verifier_is_oracle=true only for hash, git-object, and causal-order checks. A blocked_* verdict requires gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6476_v556_corpus_label_commitment_forensic --date {date}
