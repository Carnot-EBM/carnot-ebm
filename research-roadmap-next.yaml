    verdict: blocked_fover_indomain_pool_retracted_see_experiment_fover_stepverifier_vs_cheap_baseline
    addressed_by: "This task drops FoVer entirely and builds a new exact-constraint multi-candidate structured-reasoning pool with deterministic ground truth and oracle headroom."
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The FoVer selector pool is retired for same-verdict reruns. Build a non-FoVer structured reasoning pool inspired by Distributional EBMs: deterministic constraints are the ground truth, candidate diversity creates oracle headroom, and local SOTA GGUF models generate candidates only if exp5124 is clean.

