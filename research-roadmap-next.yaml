tasks:
  - id: exp3833-ldt-gap-ensemble-as-sound-abstraction-lattice
    operator_override: >
      2026-06-04 operator directive (LDT-gap re-stage): NET-NEW lattice-property
      measurement, NOT a rerun of the exp3821-class HRM/TRM latent-bridge probe
      (superseded — Huginn already confirms recursive latents are non-decodable,
      re-reading HRM's would only re-confirm the DT-P3 negative). Distinct question:
      does the EXISTING k=15 verifier ensemble exhibit LDT's two abstraction-lattice
      properties (sound elimination + informative conflict detection) on an OPEN-ENDED
      domain with NO hand-built lattice? Re-scores cached FoVer candidates; $0, CPU,
      no generator. No baseline-to-beat-AR, so the headroom trap does not apply; the
      degenerate-null case is guarded by a random-elimination positive control.
    milestone: "2026.06.354"
    title: "Verifier-ensemble-as-sound-abstraction-lattice: measure elimination SOUNDNESS (never reject a correct candidate) + INFORMATIVENESS (shrink the wrong set) on FoVer math, the two properties LDT's hand-built lattice provides."
    priority: high
    track: research
    max_turns: 45
    agent_type: claude
    model: opus
    requires_claude: true   # judgment: re-framing the ensemble as a lattice OPERATOR (precision/recall of REJECTION, soundness-matched comparison vs random) rather than a classifier (AUROC); interpreting whether the soundness/informativeness operating point clears LDT's bar is open-ended, not a deterministic gate. gemini crashes nothing here (CPU/$0) but mis-frames the lattice view; codex acceptable fallback if claude quota-blocked.
    requires_gpu: false     # re-scores cached candidates with the existing ensemble; deliberately CPU-only to stay loop-safe (no kill_zombies / eGPU contention).
    estimated_wall_time_min: 50
    inference_substrate: verifier_ensemble_against_cached_candidates   # scores the k=15 ensemble against pre-existing (question, step_text, label) triples; does NOT load any LLM. Duration floor 1s.
    deliverable: results/experiment_3833_ldt_gap_ensemble_as_sound_lattice.json
    prompt: |
      CONTEXT. The LDT + Huginn deep-read (2026-06-04; docs/research-notes/
      phase3-recursive-refiner-thesis.md; memory reference_tiny_recursive_reasoning_models)
      established: LDT (arXiv:2605.08605) is Carnot's transpilation+abstention thesis
      built and SOTA, but it works ONLY because it has a HAND-BUILT abstract-interpretation
      lattice for a CLOSED grid domain (Sudoku). LDT's power is two lattice properties:
        (1) SOUND elimination  — its elimination head NEVER rules out a candidate that is
            actually correct (the w+/w- = 8 "never false-eliminate" margin);
        (2) informative CONFLICT detection — it actually SHRINKS the set of wrong
            candidates (a lattice that eliminates nothing is useless).
      Carnot's differentiated bet is that a GENERAL multi-domain verifier ENSEMBLE (k=15)
      can stand in for the hand-built lattice on OPEN-ENDED domains where no lattice can be
      authored by hand. THIS TASK measures whether the EXISTING ensemble actually has those
      two properties on a non-grid domain, by re-scoring CACHED candidates. It is a property
      measurement — NOT a generation-beats-AR test. There is no baseline to beat; do NOT
      apply a generation headroom gate. The degenerate-null case (ensemble eliminates
      nothing, or only by also eliminating correct answers) is guarded by a random-
      elimination positive control at MATCHED soundness.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE anything else; if any fail, write the blocked verdict and EXIT — DO NOT fabricate):
           a. `python -c "import carnot.verify"` succeeds (the k=15 ensemble module imports).
           b. A cached FoVer step-level corpus with gold labels is present and non-empty:
              `python -c "import json; d=json.load(open('data/fover_test_v4.json')); assert len(d) > 200 and {{'question_id','step_text','label'}} <= set(d[0])"`.
              (Fallback corpora if v4 absent: data/fover_test_v3.json, data/fover_test.json.)
           c. The ensemble exposes a per-candidate scalar score (e.g. and_composition_verifier
              `.score(text)` / `.verify(question, response)`; or the canonical ensemble entry
              used by experiment_2837 / experiment_3430). Confirm you can score ONE candidate
              end-to-end before scaling.
           If (a)/(b)/(c) fail, write honest_verdict `blocked_<resource>` (e.g.
           `blocked_fover_corpus_not_available` / `blocked_verify_module_import`) with
           preconditions_checked populated, and EXIT.
        1. Load the cached FoVer corpus (N >= 200 step-candidates with gold correct/incorrect
           labels). Use the SAME ensemble scoring path as the frozen-0.9131 headline
           (experiment_2837 / experiment_3430) so the operating point is comparable; cite the
           upstream artifact ids you reuse in cited_upstream_artifacts.
        2. Score every candidate with the ensemble. This produces a scalar per candidate.
        3. Treat the ensemble as an ELIMINATION OPERATOR: eliminate every candidate whose
           score falls on the "reject" side of a threshold tau. Sweep tau across its range.
        4. For each tau compute, over the corpus:
             - elimination_soundness(tau) = P(candidate RETAINED | candidate is gold-CORRECT)
               = 1 - false_elimination_rate. LDT requires this == 1.0 (sound).
             - elimination_informativeness(tau) = fraction of gold-INCORRECT candidates that
               are eliminated (recall of rejection / wrong-set shrinkage).
        5. Read off the operating point at the HIGHEST soundness the ensemble can sustain
           (report informativeness at soundness >= 0.99 and >= 0.98 and >= 0.95). This is the
           sound-elimination curve — the lattice-operator analogue of an ROC.
        6. POSITIVE CONTROL: a RANDOM elimination operator that eliminates the same NUMBER of
           candidates as the ensemble does at a chosen soundness target. Because random
           elimination cannot preferentially spare correct candidates, its soundness at a
           matched elimination COUNT is the chance baseline. The ensemble is a real lattice
           operator ONLY if, at matched elimination count, its soundness materially exceeds
           the random operator's (i.e. it eliminates wrong candidates while sparing correct
           ones, which random cannot). Report both.
        7. Apply the acceptance gate -> emit the terminal verdict.

      REQUIRED ARTIFACT FIELDS (each with a `principle` note):
        elimination_soundness_at_informativeness_curve:
          principle: "The lattice-operator analogue of an ROC: informativeness as a function of soundness. LDT's lattice sits at soundness==1.0; how much can the ensemble eliminate while staying sound is THE measurement."
        informativeness_at_soundness_0_99:
          principle: "At near-LDT soundness (<=1% false-elimination of correct candidates), how much of the wrong-candidate set does the ensemble remove? Near 0 => a scorer, not a usable lattice operator on this domain."
        false_elimination_rate_at_operating_point:
          principle: "The direct soundness violation rate — how often the ensemble rules OUT a gold-correct candidate. LDT's whole guarantee is that this is 0; a non-zero floor here bounds how 'sound' the open-domain lattice can be."
        random_control_soundness_at_matched_elimination_count:
          principle: "Guards the degenerate null: if the ensemble's soundness does not exceed random elimination at the same elimination COUNT, the ensemble carries no real deductive (lattice) power — it is just deleting candidates. Positive control per the FALSE_NEGATIVE_RISK discipline."
        ensemble_vs_random_soundness_margin:
          principle: "The load-bearing number: (ensemble soundness - random soundness) at matched elimination count. >0 and material => the ensemble functions as a SOUND abstraction lattice on an open-ended domain; ~0 => LDT-style integration still needs the hand-built lattice."
        n_candidates:
          principle: "N>=200 so the soundness/informativeness rates are not small-sample noise (CLT minimum for percentage-point claims)."
        cited_upstream_artifacts:
          principle: "Records WHICH cached candidate set + ensemble path was reused (experiment_2837 / experiment_3430), with sha256, so the lattice-property numbers trace to the same substrate as the frozen-0.9131 headline."
        preconditions_checked:
          principle: "Records that the ensemble import + corpus + single-candidate score were verified before scaling; pre-empts the fabrication mode where the agent lacked the corpus and synthesized a curve."
        inference_substrate:
          principle: "Declares verifier_ensemble_against_cached_candidates so the linter applies the 1s floor and skips the live-LLM methodology check (no model is loaded)."
        random_seed:
          principle: "Determinism precondition: the random-elimination control + any tie-breaking must be reproducible for a third party to re-derive the margin."
        reproducibility_checksum:
          principle: "Content hash of (corpus id, ensemble path, N, seed, tau grid) catches silent drift between this run and any replication."
        duration_s:
          principle: "Re-scoring N candidates with the k=15 ensemble takes real wall-clock; implausibly short = fabrication signal (but the 1s verifier-scoring floor, not the 60s LLM floor, applies)."

      FALSIFICATION GATE (acceptance):
        - LATTICE-VIABLE (the ensemble IS a sound abstraction lattice on an open-ended
          domain — the strongest result, validates Carnot's differentiated gap-fill):
          at soundness >= 0.99 the ensemble removes a MATERIAL fraction of incorrect
          candidates (informativeness_at_soundness_0_99 >= 0.30) AND
          ensemble_vs_random_soundness_margin is materially > 0 at matched elimination count.
          honest_verdict: `complete: ldt_gap_LATTICE_VIABLE_ensemble_sound_abstraction_inform<I>_soundmargin<M>`
          principle: "The k=15 ensemble supplies LDT's two lattice properties without a hand-built lattice -> Carnot fills the open-domain gap LDT leaves; a deeper recursive-refiner integration is worth pursuing."
        - LATTICE-WEAK (the ensemble is a scorer, not a sound lattice operator — EXPECTED-
          PLAUSIBLE given the verifier is math-domain-bound): it CANNOT sustain high soundness
          while eliminating (informativeness_at_soundness_0_99 < 0.30) OR
          ensemble_vs_random_soundness_margin ~ 0 (no edge over random at matched count).
          honest_verdict: `complete: ldt_gap_LATTICE_WEAK_ensemble_is_scorer_not_sound_lattice_inform<I>_soundmargin<M>`
          principle: "LDT-style sound-abstraction integration still requires a hand-built lattice; the ensemble's value remains as a graded scorer (frozen-0.9131 AUROC), not a sound elimination operator. Honest-negative, bounds the transpilation thesis to closed domains."
        - PARTIAL/mixed (sound but uninformative, or informative but not sound):
          honest_verdict: `complete: ldt_gap_PARTIAL_<metrics>`.
        - honest_verdict MUST start with a terminal prefix (`complete:`/`complete_`/`success:`/`passed:`/`shipped:`)
          per CLAUDE.md Verdict Terminal-Prefix Discipline; or `blocked_<resource>` if a precondition failed.

      DISCIPLINE: populate random_seed + reproducibility_checksum + preconditions_checked +
      cited_upstream_artifacts (Adversarial-Verify + Pre-Launch + Inference-Substrate rules).
      Report the REAL duration. Do NOT aggregate any artifact carrying flagged_adversarial:true.
      Do NOT touch the frozen-0.9131 headline — this is a NEW lattice-property lens on the
      SAME ensemble, not a re-measurement of the AUROC. This re-frame SUPERSEDES the
      exp3821-class HRM/TRM latent-symbol-bridge probe (Huginn already settled that recursive
      latents are non-decodable; re-reading HRM's would only re-confirm the DT-P3 negative).

  - id: exp3837-verifier-error-independence-scissor-at-scale
    operator_override: >
      2026-06-04 operator directive (moat-durability confirmation-at-scale): exp3827
      reported the error-independence moat SURVIVES (residual_catch=0.9000,
      overlap=0.5000) but on a 100-item subset with suspiciously round numbers —
      a candidate small-sample artifact. The Adversarial-Confirmation Discipline
      requires a score-300+ finding to be replicated at scale with a CI before it is
      paper-citable. This is the confirmation, NOT a doomed rerun: prior attempt
      exp3827 SUCCEEDED; this widens N 100->1000+ and adds bootstrap CI + two positive
      controls. requires_codex because it is a live GPU (Qwen3.6-35B GGUF) workload and
      gemini crashes real GPU workloads (exp3703); the moat verdict is a deterministic
      CI gate so codex suffices (no claude judgment needed).
    milestone: "2026.06.354"
    title: "Verifier error-INDEPENDENCE scissor AT SCALE (DT-P2 moat-durability): of the gold step-errors a strong SOTA reasoner (Qwen3.6-35B) self-verification MISSES, what fraction does Carnot's k=15 ensemble independently catch? N>=1000, bootstrap CI95, two positive controls. Confirms or refutes exp3827's small-sample 'moat survives'."
    priority: critical
    track: research
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true    # live GPU (Qwen3.6-35B GGUF) self-verification; gemini crashes GPU workloads (exp3703). Verdict is a deterministic CI gate, so codex suffices.
    requires_gpu: true      # the SOTA reasoner must self-verify N>=1000 steps via llama.cpp on the internal RTX 3090.
    estimated_wall_time_min: 75
    inference_substrate: live_llm_inference   # loads + runs Qwen3.6-35B-A3B-GGUF for self-verification over N>=1000 items; duration floor 60s.
    deliverable: results/experiment_3837_verifier_error_independence_scissor_at_scale.json
    prompt: |
      CONTEXT. The Deep-Think post-bounded round (memory deep-think-post-bounded-2026-06,
      P2) reframed the verifier MOAT as error-INDEPENDENCE, not raw AUROC: Carnot's value
      is durable only if it independently catches errors that a strong frontier reasoner's
      OWN self-verification MISSES. If Carnot mostly re-catches what the reasoner already
      catches, the product is at o1-subsumption risk. exp3827
      (results/experiment_3827_verifier_error_independence_scissor.json) gave a PRELIMINARY
      positive — `verifier_moat_survives_error_independent_residualcatch0.9000_overlap0.5000`
      — but on a 100-item FoVer subset with suspiciously round numbers (0.90 / 0.50). THIS
      TASK confirms or refutes that at scale (N>=1000) with a bootstrap CI and two positive
      controls. It is a PROPERTY MEASUREMENT (error-set independence), NOT a generation-beats-
      AR test — do NOT apply a generation headroom gate.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3827_verifier_error_independence_scissor.json (the 100-item
          method + exact residual_catch / overlap definitions — reuse them verbatim).
        - scripts/experiments/experiment_3827_verifier_error_independence_scissor.py (the
          Exp3827 class: reasoner self-verification path + Carnot ensemble scoring path).
        - scripts/experiment_2837_fover_memory_leakage_v3.py (the production k=15 ensemble
          aggregation that yields the frozen 0.9131 — the positive-control reference).
        - data/fover_test_v4.json (cached corpus, N>=1000, gold step labels).

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE anything; on failure write blocked_<resource> + EXIT, no fabrication):
           a. `/home/ianblenke/github.com/ianblenke/carnot/.venv/bin/python -c "import torch; assert torch.cuda.is_available() and torch.cuda.device_count() > 0"` succeeds.
           b. The SOTA reasoner GGUF is cached: `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/` returns a .gguf (else fallback unsloth/gemma-4-26B-A4B-it-GGUF). Load via the .gguf path + llama.cpp (NOT AutoTokenizer on the GGUF repo id — it has no HF tokenizer files; use cached_sota_pair()/the .gguf model_path).
           c. `import carnot.verify` succeeds AND data/fover_test_v4.json present with {question_id|question, step_text, label} (fallback v3, then test.json).
           If any fail: honest_verdict `blocked_<resource>` (e.g. blocked_no_cuda / blocked_model_not_cached_qwen3.6_35b / blocked_fover_corpus_not_available), preconditions_checked populated, EXIT.
        1. Draw N>=1000 balanced (≈50/50 correct/incorrect-step) FoVer items, seed-controlled.
        2. STRONG REASONER SELF-VERIFICATION: for each step, ask Qwen3.6-35B (its own
           self-verification, same prompt as exp3827) whether the step is correct. Record
           the reasoner's per-step accept/reject. This is the live-GPU part.
        3. CARNOT ENSEMBLE: score each step with the k=15 ensemble (the 2837 path).
        4. Partition the gold-INCORRECT steps into: (A) caught by the reasoner's self-verify,
           (B) MISSED by the reasoner (the residual). Compute:
             - residual_catch_rate = fraction of set (B) that Carnot's ensemble catches
               (flags as incorrect at its operating threshold). BOOTSTRAP CI95 (>=1000 resamples).
             - error_overlap_jaccard = |reasoner-caught ∩ carnot-caught| / |reasoner-caught ∪ carnot-caught| over gold-incorrect steps. Low => independent moats.
        5. POSITIVE CONTROLS (both MUST pass or the result is INCONCLUSIVE):
             - reasoner_self_verify_auroc in a sane non-degenerate range (e.g. [0.55, 0.95]) — the reasoner is actually doing self-verification, not all-accept/all-reject.
             - carnot_ensemble_auroc reproduces the frozen headline within +/-0.02 (~0.913 on this corpus) — the ensemble path is faithful (else deltas are void, exp3820 mode).
        6. Apply the gate -> emit the terminal verdict.

      REQUIRED ARTIFACT FIELDS (each with a `principle` note):
        residual_catch_rate:
          principle: "THE moat metric — of the reasoner's MISSED errors, what fraction Carnot independently catches. High => error-independent durable value; low => o1-subsumption risk (DT-P2)."
        residual_catch_ci95:
          principle: "Bootstrap CI95 — turns exp3827's round-number point estimate into a defensible interval; the lower bound is the gate field (Adversarial-Confirmation Discipline)."
        error_overlap_jaccard:
          principle: "Independence check — low overlap between reasoner-caught and Carnot-caught errors means the two verifiers occupy different null spaces (the moat); high overlap means Carnot is redundant with frontier self-verification."
        reasoner_self_verify_auroc:
          principle: "Positive control — a degenerate (all-accept/all-reject) reasoner would inflate residual_catch trivially; this confirms the reasoner genuinely self-verifies."
        carnot_ensemble_auroc:
          principle: "Positive control — MUST reproduce the frozen 0.9131 +/-0.02 on this corpus or the ensemble path is unfaithful and ALL residual numbers are void (exp3820 mode)."
        n_items, n_residual_errors:
          principle: "N>=1000 and the residual-set size — the residual_catch CI is only meaningful if the residual error set is itself large enough (report n_residual_errors; if <30, widen N)."
        preconditions_checked, cited_upstream_artifacts (exp3827 + 2837 with sha256),
        model_specs, random_seed, random_seeds_used, reproducibility_checksum,
        duration_s, inference_substrate:
          principle: "Pre-Launch + Adversarial-Verify + Inference-Substrate methodology — a live 35B GGUF run over N>=1000 takes real wall-clock; implausibly short = fabrication."

      FALSIFICATION GATE (acceptance):
        - MOAT_SURVIVES_AT_SCALE: both positive controls pass AND residual_catch_ci95 lower
          bound > 0.5 AND error_overlap_jaccard < 0.6.
          honest_verdict: `complete: scissor_at_scale_MOAT_SURVIVES_residcatch<mean>_ci<lo>-<hi>_overlap<j>_n<N>`
          principle: "Confirms exp3827 at scale — Carnot's verifier catches a majority of the strong reasoner's residual errors independently; durable, paper-citable moat."
        - MOAT_SUBSUMED: positive controls pass AND (residual_catch_ci95 upper < 0.3 OR error_overlap_jaccard > 0.7).
          honest_verdict: `complete: scissor_at_scale_MOAT_SUBSUMED_residcatch<mean>_overlap<j>_o1_subsumption_risk_n<N>`
          principle: "Refutes the durable-moat claim — Carnot largely re-catches what the reasoner already catches; the product is at frontier-subsumption risk and the paper must scope the claim down."
        - INCONCLUSIVE: a positive control fails (reasoner degenerate OR carnot_ensemble_auroc off frozen by >0.02).
          honest_verdict: `complete: scissor_at_scale_INCONCLUSIVE_<which_control_failed>`
        - honest_verdict MUST start with a terminal prefix (`complete:`/`complete_`/`success:`/`passed:`/`shipped:`) or `blocked_<resource>`.

      DISCIPLINE: populate random_seed(s) + reproducibility_checksum + preconditions_checked +
      cited_upstream_artifacts + model_specs. Report the REAL duration (live LLM floor 60s).
      Do NOT aggregate any artifact carrying flagged_adversarial:true. Do NOT move the frozen
      0.9131. Do NOT push. Do NOT modify scripts/research_conductor.py.
