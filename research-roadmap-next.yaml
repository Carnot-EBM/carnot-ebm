    - flagged_adversarial, gate_check_summary: Actual final validator flag; every blocked_* or complete_blocked_* records upstream ID, path/hash, field, op, expected and observed values. principle: Missing inputs differ from failed thresholds.
    - rows, sample_size_budget: Each unit/arm/seed metric; intended, eligible, started, completed, failed, censored, excluded and independent counts with named units. principle: Repeated seeds and masks do not create independent samples.
