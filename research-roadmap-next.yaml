    title: "EXTERNAL comparator for the re-freeze candidate — does Carnot's label-conditional dependency-aware weighting (exp3680) beat a PUBLISHED weak-supervision reweighting baseline (de-entangled / CIG-style, arXiv:2604.07650) on the SAME FoVer corpus + protocol, not just Carnot-current? A headline candidate is stronger if it beats an external published method, not only the internal prior"
