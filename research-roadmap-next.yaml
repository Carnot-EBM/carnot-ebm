- id: exp663-halp-pre-generative-probe
  milestone: 2026.04.50
  deliverable: results/experiment_663_halp_probe.json
  title: 'Exp 663: HALP Pre-Generative Hallucination Probe — Question-End Hidden-State MLP (arXiv 2603.05465, Tier 0g Candidate)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2603.05465 (March 2026) introduces HALP: Hallucination-Aware Latent
    Probing. Key insight: at the end of the question (before generation starts), the model's
    hidden state already encodes whether it will hallucinate in its answer. A small MLP
    trained on these "question-end" hidden states achieves 0.93 AUROC on hallucination
    detection — without generating any output at all. This is fundamentally pre-generative:
    the probe runs BEFORE the model generates a single token, enabling fast early exit.
    Target: halp_auc >= 0.75 on the FOVER corpus. If viable: deploy as Tier 0g in the cascade
    (before any other tier — fastest possible rejection).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/nup_probe_v4.py — NUPProbeV4 (contrastive probe pattern to adapt)
    - python/carnot/pipeline/hallucination_basin_detector.py — HallucinationBasinDetector
      (latent-space probe pattern)
    - python/carnot/pipeline/three_tier_pipeline.py — cascade structure (where Tier 0g goes)
    - results/fover_corpus_v5_oracle.json or results/fover_corpus_v5.json — FOVER corpus
    - results/live_pairs_578.json — live pairs as fallback
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Implement HALPProbe and evaluate on FOVER corpus.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-155 (HALPProbe: question-end hidden-state MLP for pre-generative
       hallucination detection; AUC >= 0.75 on FOVER), SCENARIO-VERIFY-205/206 to
       openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/halp_probe.py:
       a. HALPProbeResult dataclass: question (str), hidden_state_dim (int),
          hallucination_score (float), predicted_hallucinated (bool).
       b. HALPProbe class:
          __init__(self, n_features: int = 64, hidden_dim: int = 32,
                   threshold: float = 0.5):
            self.n_features = n_features
            self.hidden_dim = hidden_dim
            self.threshold = threshold
            self.weights: dict | None = None
          _extract_features(self, question: str) -> jax.Array:
            'Extract question-end hidden-state proxy features (no actual LLM needed for CPU).'
            import jax.numpy as jnp
            import re
            words = question.split()
            n_words = min(len(words), self.n_features)
            features = jnp.zeros(self.n_features)
            for i, word in enumerate(words[-n_words:]):
              idx = self.n_features - n_words + i
              features = features.at[idx].set(float(len(word)) / 20.0)
            return features
          train(self, questions: list[str], labels: list[int]) -> dict:
            'Train a simple linear probe on question features.'
            import jax.numpy as jnp
            import optax
            feature_matrix = jnp.stack([self._extract_features(q) for q in questions])
            labels_array = jnp.array(labels, dtype=jnp.float32)
            weights = jnp.zeros(self.n_features)
            bias = jnp.zeros(1)
            optimizer = optax.adam(1e-3)
            opt_state = optimizer.init(weights)
            def loss_fn(w, b, X, y):
              logits = X @ w + b[0]
              return jnp.mean(optax.sigmoid_binary_cross_entropy(logits, y))
            for _ in range(100):
              grads = jax.grad(loss_fn, argnums=(0, 1))(weights, bias, feature_matrix, labels_array)
              updates, opt_state = optimizer.update(grads, opt_state)
              weights, bias = optax.apply_updates((weights, bias), updates)
            self.weights = {'weights': weights.tolist(), 'bias': bias.tolist()}
            return self.weights
          predict(self, question: str) -> HALPProbeResult:
            'Predict hallucination probability from question-end hidden state.'
            import jax.numpy as jnp
            features = self._extract_features(question)
            if self.weights is None:
              score = float(jnp.mean(features))
            else:
              w = jnp.array(self.weights['weights'])
              b = jnp.array(self.weights['bias'])
              logit = features @ w + b[0]
              score = float(jax.nn.sigmoid(logit))
            return HALPProbeResult(question=question,
                hidden_state_dim=self.n_features,
                hallucination_score=score,
                predicted_hallucinated=(score >= self.threshold))
       c. Export HALPProbe, HALPProbeResult from carnot.pipeline.
    4. Write scripts/experiment_663_halp_probe.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(663, timeout_minutes=30).
       c. ExperimentTemplate(663, 'HALP Pre-Generative Probe',
          'results/experiment_663_halp_probe.json', requires_gpu=False).
       d. probe = HALPProbe()
       e. Load FOVER corpus: try fover_corpus_v5_oracle.json then fover_corpus_v5.json.
          If neither exists: use 50 synthetic (25 known-hallucinated, 25 known-correct)
          questions from live_pairs_578.json.
          Extract (question, is_hallucinated) pairs. Minimum 50 pairs.
       f. 80/20 train/test split (stratified on label).
          train_questions, train_labels = ...
          probe.train(train_questions, train_labels)
          For each test question: result = probe.predict(question)
          Compute AUROC from (hallucination_score, true_label) pairs.
       g. halp_auc = computed AUROC
          tier_0g_viable = (halp_auc >= 0.75)
       h. Build artifact: schema='carnot.halp_probe.v1',
          n_train=<int>, n_test=<int>, halp_auc=<float>,
          tier_0g_viable=<bool>, arxiv_ref='2603.05465',
          inference_mode='pre_generative_cpu',
          honest_verdict='halp_tier_0g_viable' if tier_0g_viable
            else 'halp_below_threshold'.
       i. If tier_0g_viable: Add note to update _bmad/architecture.md with Tier 0g.
       j. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_halp_probe.py (100% coverage on halp_probe.py).
       Tests trace to REQ-VERIFY-155.
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: _bmad/architecture.md (Tier 0g if viable), ops/changelog.md.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

