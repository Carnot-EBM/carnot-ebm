milestone: "2026.05.183"
milestone_title: "Phase 4 Thermodynamic Measurement + Continuous Resolution Self-Learning + SOTA Decoding"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
scope_reduction_compliance:
