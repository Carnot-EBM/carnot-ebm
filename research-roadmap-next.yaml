  - id: exp2704
    milestone: "2026.05.257"
    deliverable: "results/experiment_2704_multi_agent_scaling_audit.json"
    title: "Multi-Agent Scaling Audit: AUROC vs k Curve + ME Routing (arXiv:2502.20379 + arXiv:2605.00419)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 30
    track: verifier

    prior_failures:
      - experiment_id: exp2692-multi-agent-scaling-audit
        verdict: "zero_execution_no_artifact_produced"
        addressed_by: "exp2692 was a .256 task (conductor stall, no artifact). This .257 attempt is the first actual execution. EXPANDED scope vs exp2692: adds Mixture-model Ensemble (ME) stochastic routing comparison (arXiv:2605.00419) to the standard k-sweep, measuring whether ME achieves equivalent saturation_auroc at O(1) routing cost vs O(k)."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      arXiv:2502.20379: scaling verifier count k improves AUROC up to a saturation point (k=4-6
      for diverse verifiers). arXiv:2605.00419 (Mixture-model Ensemble, ME): stochastic routing
      selects one verifier per step (O(1) cost) rather than computing full ensemble distribution
      (O(k) cost). This experiment measures Carnot's saturation curve AND compares ME routing.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (list all tier0* verifier modules — check what exists)
      - data/fover_corpus.jsonl (FoVer corpus)
      - results/experiment_2703_tier0f_semantic_calibration.json (if exists — tier0f_auroc for AUROC baseline)

      TASK: Evaluate ensemble AUROC at k=[1,2,4,6,8,12,16] and compare ME routing.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0` — FoVer corpus.
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         c. `ls python/carnot/verify/tier0*.py 2>/dev/null | wc -l` — count available modules.
            Record: n_components_available (int).
         Record: preconditions_checked.

      1. List all tier0* modules. Compute individual AUROC on FoVer eval split (20% holdout,
         random_seed=42). Use TF-IDF cosine proxy. Sort by AUROC.
         Record: components_by_auroc (list of {name, auroc}).

      2. For k=[1,2,4,6,8,12,min(16,n_components_available)]:
         a. Select top-k verifiers (greedy).
         b. Ensemble score = mean of individual scores.
         c. Compute ensemble AUROC.
         Record: k_auroc_pairs (list of {k, auroc}).

      3. ME routing: for k=[4,6,8]:
         Simulate ME by sampling one verifier uniformly at each inference step (100 trials).
         me_auroc_at_k = mean of AUROC over 100 trials.
         Compare: standard ensemble AUROC vs ME AUROC. Record: me_auroc_by_k.

      4. Saturation point: first k where AUROC improvement < 0.005.
         Record: saturation_k (int), saturation_auroc (float), total_lift (float).
         me_adequate: me_auroc_at_saturation_k >= saturation_auroc - 0.01 (within 1% of ensemble).

      5. Write results/experiment_2704_multi_agent_scaling_audit.json.

