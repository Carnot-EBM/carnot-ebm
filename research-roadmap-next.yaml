    0. PRECONDITIONS (before subsequent work): print a flushed start line; verify named local inputs, terminal sidecars, Python environment and required tooling with bounded commands. Missing resources produce complete_blocked_<resource>, verdict_class=blocked and exact gate_check_summary; do not manufacture missing evidence.
