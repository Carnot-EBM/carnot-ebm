- id: exp1271-triggered-certificate-extraction-sota-gguf
  milestone: 2026.04.99
  deliverable: results/experiment_1271_triggered_certificate_extraction_sota_gguf.json
  title: "Triggered Certificate Extraction on SOTA GGUF - Qwen/Gemma Headline Models"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 60
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  prompt: |
    CONTEXT:
    Carnot's highest product gap remains extraction on real local instruction-tuned models.
    Thinking Before Constraining suggests letting the model reason freely, then triggering
    a structured certificate tail. RACE suggests measuring whether the certificate aligns
    with the free-form reasoning and final answer.

    MODEL_SPECS REQUIREMENT:
    This experiment needs an LLM. Use cached_sota_pair() first and record exact models_used.
    MODEL_SPECS must include at least one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy Qwen3.5-0.8B or gemma-4-E4B-it may be used only as CPU smoke-test fallbacks
    with headline_result_allowed=false.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - python/carnot/pipeline/extract.py
    - python/carnot/pipeline/fover_annotator.py
    - results/fover_corpus_v5.json

    TASK:
    Run a 30-50 prompt triggered-certificate extraction evaluation with local SOTA GGUF models.
    The model should answer normally, then emit a <CARNOT_CERT> JSON-like tail with claims,
    equations, final_answer, and confidence.

    CONCRETE STEPS:
    1. Create an in-progress artifact immediately.
    2. Resolve MODEL_SPECS using cached_sota_pair(gpu_indices=(0, 1)). If it returns None,
       write a blocked or smoke-test artifact; do not headline tiny-model results.
    3. Sample 30-50 FoVer/GSM8K-style prompts from results/fover_corpus_v5.json.
    4. For each response, attempt to parse the certificate tail and verify claims with existing
       Z3/SymCode/FoVer helpers where available.
    5. Compute certificate_parse_rate, verified_claim_coverage, false_positive_rate,
       answer_reasoning_consistency_score, models_used, expected_cot_structure,
       headline_result_allowed, and batch_log.
    6. Write a terminal artifact with honest_verdict:
       certificate_extraction_viable, certificate_extraction_partial, blocked_no_sota_gguf,
       or smoke_only_not_headline.

    Run: python3 -c "import json; d=json.load(open('results/experiment_1271_triggered_certificate_extraction_sota_gguf.json')); print(d.get('honest_verdict'), d.get('models_used'), d.get('certificate_parse_rate'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1272-prime-verifier-selection-audit
  milestone: 2026.04.99
  deliverable: results/experiment_1272_prime_verifier_selection_audit.json
  title: "PRIME Verifier Selection Audit - Process/Outcome Alignment Before GRPO"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 30
  priority: high
  requires_gpu: false
  skip_pre_test: true
  prompt: |
    CONTEXT:
    PRIME argues that verifier process/outcome alignment predicts RLVR usefulness.
    .98 left GRPO v7 stale. The next GRPO attempt must first select a verifier
    weight vector from measured verifier behavior instead of rerunning broad training.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - results/fover_corpus_v5.json
    - results/experiment_1256_verifier_orthogonality_audit_v3.json
    - results/experiment_1264_q11_tss_instrumentation_v2.json
    - results/experiment_1271_triggered_certificate_extraction_sota_gguf.json if it exists
    - python/carnot/pipeline/verify_repair.py
    - python/carnot/pipeline/extract.py

    TASK:
    Compute a PRIME-style verifier selection audit over existing FoVer/certificate data.
    Output a verifier_weight_vector_written boolean and a verifier_weight_vector dict for GRPO.

    CONCRETE STEPS:
    1. Create an in-progress artifact.
    2. Load available FoVer labels and any certificate outputs from exp1271.
    3. Evaluate or reconstruct per-verifier process and outcome signals for:
       Z3MathVerifier, CausalReasoningVerifier, SymCodeVerifier, SemEnergy/SOS-KAN if available,
       and the k=5 ensemble summary from exp1256.
    4. Compute process_error_detection_rate, final_answer_agreement, answer_reasoning_consistency,
       pairwise_correlation_penalty, and a normalized verifier_weight_vector.
    5. If data is insufficient, write verifier_weight_vector_written=false with missing_fields.
    6. Otherwise write verifier_weight_vector_written=true and status="complete".

    Run: python3 -c "import json; d=json.load(open('results/experiment_1272_prime_verifier_selection_audit.json')); print(d.get('verifier_weight_vector_written'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

