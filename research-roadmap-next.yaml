- id: exp860-inertia-ising-benchmark
  milestone: 2026.04.66
  deliverable: results/experiment_860_inertia_ising_benchmark.json
  title: 'Exp 860: Inertia Ising Sampler Benchmark — arXiv 2604.17109 + Mpemba Init (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2604.17109 (Fully Parallel Inertia Ising Machine) introduces an EMA
    per-spin inertia term that biases each spin's flip probability toward its recent
    trajectory. This reduces mixing sweeps by 15-25x in simulation. The inertia term is:
      p_flip(s_i) = sigmoid(-2 * s_i * (h_eff_i + alpha * m_i))
    where m_i = EMA of s_i over recent sweeps (alpha=0.5 typical). This smooths the energy
    landscape and prevents spin-glass freezing.

    arXiv 2603.24183 (Mpemba Initialization) proposes initializing spins from a
    spectral-optimal magnetization (the leading eigenvector of J) rather than random.
    This can reduce thermalization time further.

    Current IsingEBM (carnot-ising crate / python/carnot/models/ising.py) uses standard
    Metropolis-Hastings without inertia. The discrimination problem (RETRO-ISING-INJECTION-NO-
    DISCRIMINATION): energy delta is identical for error/clean code configurations, suggesting
    the sampler is not mixing well enough to distinguish them.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/ising.py — IsingEBM, current sampler (find the sweep loop)
    - python/carnot/samplers/ — sampler backends (if separate from model)
    - results/experiment_860_inertia_ising_benchmark.json — does NOT exist yet (new experiment)
    - research-references.md — arXiv 2604.17109 and 2603.24183 entries
    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc Phase 2 section

    TASK: Implement InertiaIsingSampler with EMA inertia term. Add Mpemba initialization
    option. Benchmark discrimination_delta between error/clean constraint configurations.
    Compare mixing_sweeps_to_convergence vs standard sampler.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/models/ising.py. Find the Gibbs/Metropolis sweep loop.
       Note: spin update rule, number of sweeps, how energy is computed.
    3. Implement python/carnot/samplers/inertia_ising.py — InertiaIsingSampler:
       class InertiaIsingSampler:
         def __init__(self, J: np.ndarray, h: np.ndarray, alpha: float = 0.5,
                      use_mpemba: bool = True):
           # J: NxN coupling matrix; h: N bias vector; alpha: EMA momentum
           self.J = J; self.h = h; self.alpha = alpha; self.use_mpemba = use_mpemba
           self.m = np.zeros(len(h))  # EMA momentum per spin

         def _mpemba_init(self) -> np.ndarray:
           # Initialize spins from leading eigenvector of J (Mpemba init)
           eigvals, eigvecs = np.linalg.eigh(self.J)
           leading = eigvecs[:, -1]  # leading eigenvector
           return np.sign(leading).astype(np.float32)

         def sample(self, n_sweeps: int = 100, n_samples: int = 1) -> np.ndarray:
           N = len(self.h)
           s = self._mpemba_init() if self.use_mpemba else (2*np.random.randint(0,2,N)-1).astype(np.float32)
           samples = []
           for sweep in range(n_sweeps):
             for i in np.random.permutation(N):
               h_eff = self.h[i] + self.J[i] @ s
               # Inertia term: EMA of spin trajectory
               p_flip = 1 / (1 + np.exp(2 * s[i] * (h_eff + self.alpha * self.m[i])))
               if np.random.rand() < p_flip:
                 s[i] = -s[i]
               self.m[i] = self.alpha * s[i] + (1 - self.alpha) * self.m[i]
             if sweep >= n_sweeps - n_samples:
               samples.append(s.copy())
           return np.stack(samples)

         def energy(self, s: np.ndarray) -> float:
           return -0.5 * s @ self.J @ s - self.h @ s

         def sweeps_to_convergence(self, threshold: float = 0.01) -> int:
           # Run until magnetization change < threshold; return sweep count
           ...
    4. Implement discrimination benchmark:
       - Build N=10 Ising problem encoding a correct Python snippet (e.g., x = 2 + 2)
         as constraints in J matrix. Build a second J matrix encoding an incorrect snippet
         (e.g., x = 2 + 3 where correct is x = 4).
       - Run InertiaIsingSampler on each for 200 sweeps.
       - energy_correct = sampler_correct.energy(sample_correct)
       - energy_error = sampler_error.energy(sample_error)
       - discrimination_delta = energy_error - energy_correct
         (positive means error config has higher energy — correct!)
       - Also run standard Metropolis (no inertia, no Mpemba) as baseline.
       - Compare mixing_sweeps_to_convergence for both.
    5. Create scripts/experiment_860_inertia_ising_benchmark.py using ExperimentTemplate(860).
       tmpl = ExperimentTemplate(860, "Inertia Ising sampler benchmark",
                                  "results/experiment_860_inertia_ising_benchmark.json",
                                  requires_gpu=False)
       tmpl.setup()
       Collect:
         - discrimination_delta: float (positive = good)
         - inertia_mixing_sweeps: int
         - baseline_mixing_sweeps: int
         - mixing_sweeps_reduction: baseline / inertia (target >= 5x)
         - mpemba_init_used: True
         - alpha: 0.5
       honest_verdict:
         - "discrimination_improved" if discrimination_delta > 0 AND mixing_sweeps_reduction >= 5
         - "partial_improvement" if discrimination_delta > 0 but mixing_sweeps_reduction < 5
         - "no_discrimination" if discrimination_delta <= 0
       Build artifact and write results/experiment_860_inertia_ising_benchmark.json.
    6. Add spec update: openspec/capabilities/ising-backend/spec.md — add REQ-ISING-020
       "IsingEBM MUST support InertiaIsingSampler (arXiv 2604.17109) with EMA inertia
       and Mpemba initialization as alternative to standard Metropolis-Hastings."
    7. Write tests/python/test_experiment_860_inertia_ising_benchmark.py with 100% coverage.
       Test InertiaIsingSampler.sample() returns correct shape.
       Test energy() is consistent with J and h.
       Test sweeps_to_convergence() returns int.
       Test discrimination_delta computation.
       Traces to REQ-ISING-020 (new), SCENARIO-ISING-030 (discrimination).
    8. Reconcile:
       - ops/changelog.md: one-line entry
       - ops/status.md: "Exp 860: InertiaIsingSampler benchmarked. discrimination_delta={result}.
         mixing_sweeps_reduction={result}x. Mpemba init used."
    9. tmpl.assert_deliverable_written() as final line.

