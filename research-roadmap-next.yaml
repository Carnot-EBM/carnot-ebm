      transitions, then plans through accepted GOAL+DYNAMICS, with bounded counterexample-guided
      refinement (arXiv:2606.11521). GATE FIRST on positive_control_passed=True (the .420 break: the live
      proposer produced ZERO reachable plans), THEN measure deeper CORE level / core_efficiency.
      retire_if_same_verdict.'
