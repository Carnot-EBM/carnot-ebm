- id: exp634-multilevel-kan-kaem
  milestone: 2026.04.48
  deliverable: results/experiment_634_multilevel_kan_kaem.json
  title: 'Exp 634: Multilevel KAN Training for KAEMEnergy — Orders-of-Magnitude Accuracy Improvement (arXiv 2603.04827)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Multilevel\
    \ Training for KANs (arXiv 2603.04827, March 2026) trains a sequence of KANs\
    \ at increasing spline knot resolution using analytic geometric interpolation operators\
    \ between levels. Start coarse (K=16 knots), train to convergence, interpolate\
    \ weights to K=32, repeat to K=64 and K=128. This achieves orders-of-magnitude\
    \ accuracy improvement vs standard single-level training. KAEMEnergy (Exp 447)\
    \ uses UnivariateKAEMLayer splines — it starts training directly at K=256, which\
    \ may be over-parameterized for early training steps and under-regularized near\
    \ the energy minimum. Multilevel training fixes this by finding the global energy\
    \ minimum at coarse resolution first, then refining. This also addresses RETRO-057\
    \ (LowRankKAEM energy accuracy gap) by improving the base KAEM's accuracy before\
    \ applying any rank reduction.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/models/kaem_energy.py\
    \ — KAEMEnergy, UnivariateKAEMLayer, marginal_cdf, sample_exact (Exp 447)\n-\
    \ python/carnot/training/ — training loops (find what training infrastructure\
    \ exists)\n- results/experiment_447_kaem_energy.json (or similar) — KAEM baseline\
    \ energy accuracy\n\nTASK: Implement multilevel training for KAEMEnergy and benchmark\
    \ accuracy vs epochs.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-SAMPLE-018\
    \ (multilevel KAEM: knot refinement schedule K=16->32->64->128), REQ-SAMPLE-019\
    \ (multilevel KAEM: energy accuracy >= standard training at equal parameter count),\
    \ SCENARIO-SAMPLE-032/033 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Create python/carnot/training/multilevel_kan_trainer.py:\n   a. KnotRefinementInterpolator\
    \ class:\n      __init__(self, coarse_layer: UnivariateKAEMLayer, fine_n_knots:\
    \ int):\n        self.coarse = coarse_layer; self.fine_n = fine_n_knots\n     \
    \ interpolate(self) -> UnivariateKAEMLayer:\n        'Create fine-resolution layer\
    \ by linear interpolation of coarse spline knot values.'\n        coarse_knots\
    \ = self.coarse.knot_positions  # shape (K_coarse,)\n        fine_knots = jnp.linspace(coarse_knots[0],\
    \ coarse_knots[-1], self.fine_n)\n        # Interpolate coarse coefficients to\
    \ fine grid using jnp.interp\n        fine_coeffs = jnp.interp(fine_knots, coarse_knots,\
    \ self.coarse.spline_coeffs)\n        fine_layer = UnivariateKAEMLayer(self.fine_n)\n\
    \        fine_layer = fine_layer.replace(spline_coeffs=fine_coeffs, knot_positions=fine_knots)\n\
    \        return fine_layer\n   b. MultilevelKAEMTrainer class:\n      __init__(self,\
    \ schedule: list[int] = [16, 32, 64, 128], epochs_per_level: int = 20):\n    \
    \    self.schedule = schedule\n        self.epochs_per_level = epochs_per_level\n\
    \      train(self, n_vars: int, data: jnp.ndarray) -> KAEMEnergy:\n        'Multilevel\
    \ training: train at K=schedule[0], interpolate to schedule[1], etc.'\n      \
    \  model = KAEMEnergy(n_vars=n_vars, n_knots=self.schedule[0])\n        for i,\
    \ K in enumerate(self.schedule):\n            if i > 0:\n                interpolator\
    \ = KnotRefinementInterpolator(model.layers[0], K)\n                model = model.replace(layers=[interpolator.interpolate()])\n\
    \            model = self._train_level(model, data, self.epochs_per_level)\n  \
    \      return model\n      _train_level(self, model, data, n_epochs):\n       \
    \ 'Standard gradient descent on model energy for n_epochs.'\n   c. Export MultilevelKAEMTrainer,\
    \ KnotRefinementInterpolator from carnot.training.\n4. Write scripts/experiment_634_multilevel_kan_kaem.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. ExperimentTimeoutWatchdog(634, timeout_minutes=30).\n\
    \   c. ExperimentTemplate(634, 'Multilevel KAN KAEMEnergy',\n      'results/experiment_634_multilevel_kan_kaem.json',\
    \ requires_gpu=False).\n   d. Generate synthetic energy landscape: 20 variables,\
    \ known ground-truth energy function (sinusoidal + quadratic). This serves as the\
    \ energy accuracy benchmark.\n   e. Standard training baseline: KAEMEnergy(n_vars=20,\
    \ n_knots=128) trained for 80 epochs. Record accuracy_standard, epochs_to_converge.\n\
    \   f. Multilevel training: MultilevelKAEMTrainer(schedule=[16,32,64,128], epochs_per_level=20).\n\
    \      Train on same data. Record accuracy_multilevel, total_epochs_multilevel.\n\
    \   g. Compare: accuracy_improvement = (accuracy_multilevel - accuracy_standard)\
    \ / abs(accuracy_standard).\n      epoch_reduction = (80 - total_epochs_multilevel)\
    \ / 80  (fraction of epochs saved at equal accuracy).\n   h. Build artifact: schema='carnot.multilevel_kan_kaem.v1',\n\
    \      n_vars=20, standard_n_knots=128,\n      accuracy_standard=<float>, accuracy_multilevel=<float>,\n\
    \      accuracy_improvement=<float>, epoch_reduction=<float>,\n      total_epochs_multilevel=<int>,\n\
    \      multilevel_faster=(total_epochs_multilevel < 80),\n      honest_verdict='multilevel_wins'\
    \ if accuracy_improvement>0.01 else 'multilevel_no_improvement'.\n   i. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_multilevel_kan_trainer.py (100% coverage).\n\
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n7. Reconcile: ops/conductor-log.md,\
    \ ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
