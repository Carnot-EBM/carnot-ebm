    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      arXiv:2505.14999 introduces Energy Outcome Reward Model (EORM) — a 55M-parameter verifier that
      learns to rank CoT solutions by energy. Key insight: train a verifier on (correct_claim,
      incorrect_claim) PAIRS with a margin ranking loss, so correct outputs always have lower energy
      than incorrect ones. Achieves 90.7% GSM8k verification coverage.

      For Carnot, implement a TF-IDF-proxy EORM (no external embedding model required):
      - Feature: TF-IDF vector of (context + correct_claim) MINUS TF-IDF vector of (context + incorrect_claim)
      - Label: +1 (correct_claim has lower energy = margin satisfied)
      - Model: LogisticRegression on the difference vector
      - Prediction: sigmoid(dot(w, claim_vec - incorrect_baseline)) approximates energy score

      This is the TRAINED complement to Tier 0z (training-free Boltzmann) and Tier 0w (training-free AvgWD).

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (examine tier0z_semantic_energy.py and tier0w_avgwd_eigenwd.py for patterns)
      - python/carnot/verify/base_verifier.py (BaseVerifier interface)
      - data/fover_corpus.jsonl (corpus format — (context, claim, label))

      TASK: Implement Tier 0e EORM energy ranking verifier and evaluate on FoVer real corpus.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import numpy; import sklearn; import scipy"` succeeds.
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. FoVer corpus discoverable: check paths:
            {project_root}/data/fover_corpus.jsonl (n_lines >= 200)
            If absent: try {project_root}/python/carnot/verify/foVer_corpus.jsonl
            If none found: write honest_verdict blocked_fover_corpus_not_found; exit.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus (JSONL). Parse (context, claim, label) triples.
         n_corpus = number of valid triples with label in {0, 1, 'hallucination', 'correct'}.
         Require n_corpus >= 200.

      2. Construct PAIRWISE training data for EORM:
         - From the corpus, pair each correct example (label=0) with a randomly sampled incorrect
           example (label=1) from the same batch.
         - For each pair: compute difference features:
           diff_features = tfidf(context + correct_claim) - tfidf(context + incorrect_claim)
         - Label: +1 (the difference should be positive for correct < incorrect energy).
         - n_pairs = min(n_corpus // 2, 1000)  # At most 1000 pairs for training.
         Record n_pairs.

      3. Implement Tier0eEROM in python/carnot/verify/tier0e_eorm.py:

         from sklearn.feature_extraction.text import TfidfVectorizer
         from sklearn.linear_model import LogisticRegression
         import numpy as np

         class Tier0eEROM:
             """Energy Outcome Reward Model verifier.
             Per arXiv:2505.14999: trains on (correct_claim, incorrect_claim) pairs with a margin
             ranking loss. In this TF-IDF proxy implementation, the margin is learned via
             LogisticRegression on (correct_features - incorrect_features). The result is a
             directional energy scorer: score(correct) < score(incorrect) for well-trained model.

             Why pairwise training matters: unlike binary classification on individual claims,
             pairwise EORM explicitly encodes the energy ordering. Correct outputs occupy a lower-
             energy region of the feature space than incorrect outputs — which is EXACTLY the
             theoretical claim of Carnot's energy-basin framework. EORM provides empirical
             validation of this claim via supervised pairwise ranking."""

             def __init__(self):
                 self.vectorizer = TfidfVectorizer(ngram_range=(1,2), max_features=500)
                 self.model = LogisticRegression(C=1.0, max_iter=500)
                 self._fitted = False

             def fit(self, contexts, correct_claims, incorrect_claims):
                 """Train on (context, correct, incorrect) triples.
                 Learns that feature(context+correct) - feature(context+incorrect) predicts +1."""
                 all_texts = [c + ' ' + cl for c, cl in
                              zip(contexts + contexts,
                                  correct_claims + incorrect_claims)]
                 self.vectorizer.fit(all_texts)
                 X_pos = self.vectorizer.transform([c + ' ' + cl for c, cl in zip(contexts, correct_claims)]).toarray()
                 X_neg = self.vectorizer.transform([c + ' ' + cl for c, cl in zip(contexts, incorrect_claims)]).toarray()
                 X_diff = X_pos - X_neg
                 y = np.ones(len(X_diff))
                 self.model.fit(X_diff, y)
                 self._fitted = True

             def score(self, context: str, claim: str) -> float:
                 """Return hallucination probability in [0,1]. Higher = more likely hallucinated.
                 Computed as 1 - P(this claim is the 'correct' member of an implicit pair)."""
                 if not self._fitted:
                     return 0.5
                 try:
                     x = self.vectorizer.transform([context + ' ' + claim]).toarray()
                     # Score = P(claim acts like incorrect_claim = hallucinated)
                     # We use 1 - P(+1 class) as hallucination probability
                     prob = self.model.predict_proba(x)[0]
                     return float(1.0 - prob[1])  # prob[1] = P(correct), so 1-prob[1] = P(hallucinated)
                 except Exception:
                     return 0.5

      4. Train Tier0eEROM:
         - Split corpus 80/20 stratified (random_seed=42).
         - From TRAINING split: construct n_pairs pairs (pair correct+incorrect within label groups).
         - Call tier0e.fit(contexts_train, correct_claims, incorrect_claims).
         Record: n_pairs_trained.

      5. Evaluate on test split (20%, n_test >= 40):
