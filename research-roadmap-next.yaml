- id: exp537-teardown-fix-zombie-kill
  milestone: 2026.04.41
  deliverable: results/experiment_537_teardown_fix.json
  title: 'Exp 537: ExperimentTemplate.teardown() + GPU Zombie Kill — RETRO-054 closure'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-054 has\
    \ carried for FIVE consecutive milestones (.36-.40) without implementation. The\
    \ .40 retro found 47,653 MB of zombie VRAM at close (worst ever). PIDs 430009\
    \ (18,678 MB GPU 0) and 430012 (4,894 MB GPU 0 + 24,072 MB GPU 1) must be killed\
    \ immediately. ExperimentTemplate.teardown() with atexit registration is the highest-leverage\
    \ single infrastructure fix: without it, GPU state degrades monotonically across\
    \ every milestone.\n\nEXISTING CODE TO READ FIRST:\n- scripts/experiment_template.py\
    \ — ExperimentTemplate (add teardown() here)\n- python/carnot/pipeline/env_autofix.py\
    \ — apply_env_autofix() (call at top of experiment)\n- python/carnot/pipeline/experiment_watchdog.py\
    \ — ExperimentTimeoutWatchdog\n- results/experiment_536_retro_2026_04_40.json\
    \ — .40 retro (see gpu_zombie_pids, new_retro_items, RETRO-054)\n- ops/known-issues.md\
    \ — RETRO-054, RETRO-055\n- scripts/experiment_template.py — ExperimentTemplate.setup_gpu()\n\
    \nTASK: Implement ExperimentTemplate.teardown() and kill .40 zombie PIDs.\n1.\
    \ Read CLAUDE.md spec-first workflow.\n2. Add REQ-INFRA-060 (ExperimentTemplate.teardown()\
    \ clears GPU VRAM and registers via atexit), REQ-INFRA-061 (startup zombie kill\
    \ via pynvml — any PID holding >5% VRAM at 0% utilization is killed before experiment\
    \ begins), SCENARIO-INFRA-070/071/072 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. In scripts/experiment_template.py:\n   a. Add import atexit, gc at top.\n\
    \   b. Add teardown(self, clear_gpu: bool = True) method:\n      - Call torch.cuda.empty_cache()\
    \ if torch.cuda.is_available() and clear_gpu.\n      - Call gc.collect().\n  \
    \    - Log 'ExperimentTemplate.teardown() called for exp NNN' at INFO level.\n\
    \   c. In __init__(), add: atexit.register(self.teardown) after existing init\
    \ logic.\n   d. Add kill_gpu_zombies(vram_threshold_mb: int = 1000, util_threshold_pct:\
    \ float = 5.0) classmethod:\n      - Use pynvml to enumerate processes on each\
    \ GPU.\n      - For each process: if vram_mb > vram_threshold_mb AND\
    \ util < util_threshold_pct, kill it via os.kill(pid, signal.SIGTERM).\n    \
    \  - Log killed PIDs and their VRAM at WARNING level.\n      - Return dict: {'killed_pids':\
    \ [...], 'freed_mb': int}.\n      - Graceful: pynvml import failure → return\
    \ {'killed_pids': [], 'freed_mb': 0, 'error': 'pynvml_unavailable'}.\n   e.\
    \ Call ExperimentTemplate.kill_gpu_zombies() as the FIRST action in setup() before\
    \ any model loading.\n4. Write tests/python/test_experiment_teardown.py:\n   a.\
    \ Test teardown() calls gc.collect() (patch gc.collect, assert called).\n   b.\
    \ Test teardown() calls torch.cuda.empty_cache() when GPU available (patch torch.cuda).\n\
    \   c. Test kill_gpu_zombies() returns {'killed_pids': [], 'freed_mb': 0, 'error':\
    \ 'pynvml_unavailable'} when pynvml not importable.\n   d. Test __init__ registers\
    \ teardown via atexit (patch atexit.register, assert called).\n   e. Ensure 100%\
    \ coverage on teardown() and kill_gpu_zombies().\n5. Write scripts/experiment_537_teardown_fix.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. ExperimentTimeoutWatchdog(537, timeout_minutes=20).\n\
    \   c. ExperimentTemplate(537, 'ExperimentTemplate Teardown Fix',\n      'results/experiment_537_teardown_fix.json',\
    \ requires_gpu=False).\n   d. Call ExperimentTemplate.kill_gpu_zombies() explicitly\
    \ and record result.\n   e. Call tmpl.teardown() manually and verify it completes\
    \ without error.\n   f. Build artifact: schema='carnot.teardown_fix.v1'\n    \
    \  teardown_implemented=True\n      atexit_registered=True\n      zombie_kill_result={...}\
    \ (from kill_gpu_zombies)\n      retro_054_resolved=True\n      honest_verdict='retro_054_closed'\n\
    \   g. Call tmpl.assert_deliverable_written() as FINAL LINE.\n6. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n7. Reconcile: ops/conductor-log.md (RETRO-054\
    \ CLOSED), ops/known-issues.md, ops/status.md, ops/changelog.md, _bmad/traceability.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT\
    \ modify scripts/research_conductor.py.\n"

