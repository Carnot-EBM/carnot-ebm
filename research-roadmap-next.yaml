  prompt: |
    CONTEXT
    Work in {project_root} on {date}. Milestone 2026.10.692. V691 Gibbs calibration beat neither Platt nor isotonic on decision cost. Its only input was q. Add the eight source features and compare against equally informed classical heads. Reuse Exp7972 numerical fitting; do not depend on disqualified Exp7967 or absent Exp7970.

    EXISTING CODE TO READ FIRST
    CLAUDE.md; CODEX.md; research-program.md; ops/exclusion_manifest.yaml; scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; ops/e2e-test-plan.md; python/carnot/verify/qwen_energy_calibration_7972.py; python/carnot/experiment_7972_v691_qwen_energy_calibration.py; python/carnot/models/gibbs/__init__.py; results/experiment_7972_v691_qwen_energy_calibration.json; python/carnot/verify/source_projection.py

    TASK
    Fit a small conditional energy using Qwen and source evidence. Deliver results/experiment_7982_v692_multivariate_energy.json. Implement the bounded entrypoint scripts/experiments/experiment_7982_v692_multivariate_energy.py. MODEL_SPECS: []. SUBSTRATE CLASS: no_model_load. Use verifier_ensemble_against_cached_candidates for numerical scoring, or aggregation_from_upstream_artifacts for a pure audit. Zero current pretrained-model loads/calls. Small fitted heads are separate trained_head_specs.

    CONCRETE STEPS
    1. Print a flushed progress line at each phase boundary and before and after every model load, generation call, benchmark, and subprocess. Print inside long loops and from a supervising thread while an owned child is silent, at most 60 seconds apart. Keep every output gap below 600 seconds. Use tool waits of at most 60 seconds. Silence can end a run near 1200 seconds; progress permits the 4800-second hard cap. Report measured work; never pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Keep each edit and tool call small. Put temporary scripts and mutable test files in private /tmp directories outside the checkout. Keep the pytest artifact guard enabled. Archive immutable receipts only after children exit.
    3. Authenticate the exact input paths, hashes, roles, producer invocation dates, and readiness fields below. A historical date need not equal {date}. Missing inputs or failed external gates yield verdict_class=blocked and exact gate_check_summary operands. Do not retry unchanged external blocks as partial. Preserve historical failures and all source artifacts.
    4. Before implementation, append task-specific REQ-REPORT and, where applicable, REQ-VERIFY requirements and scenarios. Write tests first. Reuse qualified components below; implement only the stated difference. Freeze the required validation command manifest before running science. Keep unrelated repository health separate; never remove a failed owned check or weaken an assertion to qualify.
    5. Join original fit/tune/policy roles from Exp7980 to authenticated Exp7969 q. Use fit labels for optimization and tune labels for temperature selection only. Require >=128 fit groups with16 per class and >=32 tune groups with4 per class. Freeze feature means/scales from fit data only. Reject role overlap, hidden evaluator fields or unknown-label substitution.
    6. Fit normalized p(y|x)=exp(-E(x,y))/sum_y exp(-E(x,y)), with x=[clipped logit(q),eight features] and an eight-unit tanh conditional Gibbs head. Use exact two-label normalization and the qualified analytical-gradient pattern; verify gradients by finite differences. Do not claim a new EBT foundation model.
    7. Use matched inputs for logistic regression, quadratic logistic regression and a sixteen-unit sigmoid MLP. Add a no-fit conversion of the conditional binary energy into its exact sigmoid(E0-E1) classifier and require prediction parity1e-12. The comparator is same-information and at least comparable capacity; any gain is a bounded architecture/training comparison, not evidence that normalization alone helps. Give all parametric heads three seeds69201/69202/69203, Adam200 steps, learning rate.01, L2=.001 and the same17 temperature choices from.25 to4 on tune Brier. Average the three probabilities for each arm; seeds are not independent data. Retain frozen scalar Exp7972 heads as descriptive controls. No hyperparameter expansion after evaluation.
    8. Fit a descriptive additive cubic-spline residual control with fixed fit-quantile knots and record touched coefficients. It cannot replace the primary Gibbs arm after outcomes are seen. Freeze checkpoints and predictions before policy-design or evaluation targets are read. Record numerical optimizer work and model parameter counts.
    9. Use synthetic separable and shuffled-label fixtures to test wiring; identify them as circular controls. Export qualified checkpoints even when fit gains are small. Scientific decision benefit belongs to Exp7983; readiness means reproducible fitting, never advantage.
    10. Run affected unit and consumer tests, nonempty 100% changed-statement coverage including real private CLI routes, scoped Ruff check/format, strict mypy, and scripts/check_spec_coverage.py on the actual test paths. Run applicable E2Es listed below with private outputs. Cold-replay the primary from outside the checkout without PYTHONPATH. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the final primary. Check both conductor_gates.evaluate_gates and in_process_doc_reconcile.find_artifact resolve that primary. Failed owned required validation means disqualified and readiness zero. Use one atomic declared primary and nested sidecars. Reconcile specs, _bmad/traceability.md, ops/status.md, and ops/changelog.md. Keep generator weights and production defaults fixed. Applicable end-to-end checks: E2E-015 and E2E-019 private CLI tests.
    REQUIRED ARTIFACT FIELDS
    - experiment_id, task_id, milestone, run_date, execution_date: principle: Bind identity to this invocation, not an inherited producer.
    - honest_verdict: principle: Use complete_positive_*, complete_null_*, complete_blocked_*, complete_disqualified_*, or complete_circular_positive_* with an accurate reason.
    - verdict_class: principle: Choose exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished OWN work that a retry can finish; other classes are terminal.
    - gate_check_summary: principle: Every blocked disposition names upstream, path/hash, field, operator, expected value and actual value. Distinguish missing from zero.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_specs, model_invocation_counts: principle: Declare actual compute and zero calls for cached scoring. Separate planned models from actual blocked invocations.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: principle: Make timing, progress and reconstruction checkable.
    - cited_upstream_artifacts, code_config_hashes, raw_shard_hashes: principle: Bind imported fields and current computations to their source bytes.
    - preconditions_checked, validation_command_manifest_path, validation_receipts, coverage_statement_counts: principle: Required checks need observed exit codes and logs, not a claimed green status.
    - rows, sample_size_budget: principle: Keep one primitive row per source/arm/seed or check. Include intended, eligible, started, completed, failed, censored, excluded and independent counts. Seeds do not multiply independent sources.
    - verifier_is_oracle, claim_scope, acceptance_gate_results: principle: Keep circular fixtures separate from independent natural-data evidence. A failed benefit gate forbids a positive class.
    - flagged_adversarial, terminal_validation_sidecar_path: principle: Final-byte checks must travel with the primary; never self-certify a failed verifier.
    - energy_fit_ready_score: principle: A completed reproducible fit can be ready without any benefit claim.
    - trained_head_specs, checkpoints, fit_support, tune_support, gradient_checks: principle: Distinguish actual trained small heads from pretrained model calls.
    - feature_normalization, optimizer_work, heads_seal, label_access_events: principle: Prevent target leakage and post-evaluation tuning.
    - energy_fit_ready_score: principle: Exact downstream readiness field. Set 1 only after complete valid measurement and owned checks; a scientific null can still be ready. Set 0 on blocked/disqualified work.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_7982_v692_multivariate_energy.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
