    \nFALSIFIABLE GATE:\n  PASS (-> S3 generation lift, authorized for .442) iff the energy-selected engine's\
    \ held-out off-path\n  cell_recall MINUS the binary-accuracy-gate-selected engine's > 0 with bootstrap\
    \ CI95 EXCLUDING 0, on >=N\n  held-out games. retire_if_same_verdict: true -- if the energy-ranked\
    \ selection does NOT beat the binary\n  accuracy gate (CI95 includes 0), S2 is BOUNDED at 'usable\
    \ landscape but no live trust-gate value' and the\n  direction pauses there (the energy discriminates\
    \ offline but adds nothing the cheap execution-grounded gate\n  doesn't already capture).\n\n  CONTROL\
    \ (mandatory): the incumbent binary WorldModelVerifier accuracy<0.5 gate (verifier_is_oracle=TRUE)\n\
    \  on the IDENTICAL candidate engine sets -- the energy must beat THIS, not a strawman.\n\nREQUIRED\
    \ ARTIFACT FIELDS (principle-annotated):\n  honest_verdict:\n    principle: \"terminal prefix; a live\
    \ trust-gate win is success_structural_energy_s2_trust_gate_authorizes_s3, a bound is complete_structural_energy_s2_no_live_trust_value.\"\
    \n  verifier_is_oracle:\n    principle: \"MUST be false for the energy ranking (oracle-distinct);\
    \ the binary-accuracy CONTROL is execution-grounded (true) -- S2 measures whether oracle-distinct\
    \ energy beats execution-grounded selection.\"\n  live_path_reachable:\n    principle: \"the energy\
