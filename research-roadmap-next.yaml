  - id: exp3617-headroom-corpus-hybrid-verifier-vs-sc
    operator_override: "2026-05-31 outer-loop directive: NEW research direction (build a corpus where oracle > self-consistency and measure the verifier-vs-SC margin + the hybrid detector, arXiv:2510.14913) sanctioned by north-star sec-retirement (find where SC is NOT near-optimal); forward work, not a scope-matched rerun."
    milestone: "2026.06.332"
    title: "Where does a verifier beat self-consistency? Build a corpus where oracle > SC (real headroom) and measure verifier-vs-SC + the hybrid detector under a compute budget (arXiv:2510.14913)"
    priority: high
    max_turns: 50
    agent_type: gemini
    model: gemini-3.1-pro-preview
    estimated_wall_time_min: 22
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3617_headroom_hybrid_verifier_vs_sc.json
    prompt: |
      CONTEXT: P0.1 is honest-negative because self-consistency (SC) is near-optimal on the corpora tested,
      leaving a verifier no headroom (FALSE_NEGATIVE_RISK: oracle ~ SC). arXiv:2510.14913 shows the productive
      framing is corpora where oracle > SC, and that a HYBRID (verification + SC) is best under a compute
      budget. This task builds the positive control P0.1 lacked and measures where the verifier genuinely
      helps. This is NOT a re-test of energy-vs-AR -- it is the complementary "find the headroom" study.
      EXISTING CODE TO READ FIRST: results/experiment_3507 (the P0.1 honest-negative where oracle==SC==0.653)
      + any best-of-N / SC scaffolding under scripts/ or python/carnot/ via scripts/summarize_artifact.py;
      results/experiment_2837 (the FoVer corpus where the verifier DOES have signal).
      PRECONDITIONS (step 0): a multi-candidate corpus with per-candidate correctness labels loadable (FoVer,
      or a best-of-N math/code set). If none -> "complete: blocked_no_multicandidate_corpus".
      CONCRETE STEPS:
        1. Construct / select a corpus stratum where the ORACLE (best-of-N upper bound) materially exceeds the
           SC (majority-vote) accuracy -- i.e. real selectable headroom. Record oracle, SC, and the gap.
           ASSERT oracle - SC > 0 (else report "no headroom found, verifier study uninformative on this corpus").
        2. On that headroom-bearing stratum: measure best-of-N reranked by the verifier ensemble vs SC vs
           oracle. Report verifier-over-SC lift + CI.
        3. Measure the HYBRID (verifier + SC vote fusion) accuracy at matched compute vs SC-alone and
           verifier-alone -- the arXiv:2510.14913 budget-aware comparison.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; store the VALUE):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: reranks cached candidates; no LLM load)."
        oracle_minus_sc_headroom:
          principle: "The selectable headroom; a verifier study is only informative when this is > 0 (the P0.1 positive control)."
        sc_accuracy:
          principle: "Self-consistency majority-vote baseline -- the bar to beat."
        verifier_reranked_accuracy:
          principle: "Best-of-N reranked by the ensemble -- the verifier's selection value where headroom exists."
        verifier_over_sc_lift:
          principle: "verifier_reranked - sc + CI -- does the verifier beat SC when there IS headroom?"
        hybrid_accuracy:
          principle: "Verifier+SC fusion at matched compute -- the arXiv:2510.14913 budget-aware hybrid."
        hybrid_beats_both:
          principle: "True iff the hybrid materially beats both SC-alone and verifier-alone -- the deployable recommendation."
        verifier_beats_sc_where_headroom_exists:
          principle: "The core finding: the verifier DOES add selection value on headroom-bearing corpora (complements P0.1's no-headroom null)."
        n_examples:
          principle: "Sample-size rigor."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "oracle_minus_sc_headroom present AND verifier_over_sc_lift present AND hybrid_accuracy present"
          principle: "A verifier-vs-SC verdict requires a measured headroom (oracle>SC); without it the study repeats the P0.1 degenerate null."
      TERMINAL VERDICTS: "complete: verifier_beats_sc_on_headroom_corpus_hybrid_wins_under_budget" /
      "complete: verifier_does_not_beat_sc_even_with_headroom_selection_value_weak" /
      "complete: no_headroom_corpus_found_verifier_study_uninformative" /
      "complete: blocked_no_multicandidate_corpus"
