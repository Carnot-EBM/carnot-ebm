        retire_if_same_verdict: true
      - experiment_id: exp3080-capstone-v287
        verdict: "complete: capstone_ready=true; paper_ready=false; publication_blocker_count=42"
        addressed_by: "Turns capstone blockers into a reduction plan with owners, gates, and evidence boundaries."
        retire_if_same_verdict: true
      - experiment_id: exp3068-matrix-v20-artifact-alias-blocker-normalization
        verdict: "complete: matrix_v20_normalization_ready=true; normalized_blocker_count_estimate=32"
        addressed_by: "Moves from alias hygiene to publication blocker retirement criteria using matrix v21 as the authority."
        retire_if_same_verdict: true
    prompt: |
