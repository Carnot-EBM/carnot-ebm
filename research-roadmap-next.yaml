    5. Compare the complete markdown table and matching V653 YAML: exactly 14 task IDs exp7447 through exp7460 in order, exact titles, phases, deliverables, substrate classes and gate fields. Resolve the YAML by milestone: use research-roadmap-next.yaml before activation or research-roadmap.yaml only if its milestone is V653. Never compare the V653 document to the V652 active YAML. Test private mutations of count, ID, order, path, field and milestone.
    6. Authenticate V652 producer rows and the independent audit. Keep the static null, missing expert predictions, parse_status exception, lost lease continuity, 62-action ARC exposure and persistence bound separate. Record archive lag explicitly; do not rewrite old results.
    7. Ingest at most six primary-source pages from the dated V653 reference review. Map hidden-representation probing, cross-block conditioning, delayed expert losses and on-chip locality to this task list. Use the public FaithBench release as a challenge corpus. Write docs/research-notes/v653-method-ingestion.md and mark the relevant research-studying.md entries ingested. Distinguish rechecked papers, inaccessible pages and new findings.
    8. Run the schema, exclusion-manifest, gate and overdue-priority checks without changing their semantics. Preserve the unresolved conductor artifact-size obligation as user-forbidden work. Do not activate this roadmap.
    9. Freeze an affected-file validation manifest. Run worktree import checks and affected pytest with -n 0 -o addopts= --no-cov and a private existing --basetemp parent. Run separate 100 percent changed-module coverage with a command-local COVERAGE_FILE, scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on the exact affected tests. Reuse the Exp7358 command plan and Exp7303 scope runner. Do not invoke full_python_suite, weaken tests or write over historical results. Report unrelated baseline failures separately.
