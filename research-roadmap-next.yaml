    title: "Verifier-product HONEST positioning vs PRM SOTA: build a structured comparison of Carnot's discriminative 0.9131 step-error ensemble against the generative-PRM and label-free-PRM frontier (GenPRM, ThinkPRM, uPRM, ProcessBench reasoning-LLM verifiers), stating PLAINLY where Carnot leads (cheap, objective, energy-grounded CPU scoring + a CERTIFIED abstention operating point) and where it does NOT (raw F1 vs a 32B reasoning verifier; OOD generalization -- settled domain-bound). A paper/product positioning deliverable; NO generalization re-test."
