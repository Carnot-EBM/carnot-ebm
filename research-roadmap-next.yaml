    milestone: "2026.05.320"
    title: "P0.1 v6 — process-aware step-level energy + optimal SC+energy aggregation vs Self-Consistency on a HEADROOM benchmark (cached, held-out, matched compute, flip-count tautology-clean)"
    priority: critical
    max_turns: 80
    model: opus
    agent_type: claude
    requires_claude: true   # (1) gemini-cli is DOWN; (2) 5+ files: headroom corpus reader + per-step FoVer process scorer + trained EORM reranker + optimal-aggregation fit + 7 condition scorers + flip-count/McNemar/bootstrap; (3) open-ended judgment on the held-out protocol, the flip-count tautology-clean design, the optimal-aggregation fit, and matched-compute accounting — no deterministic gate substitutes.
    estimated_wall_time_min: 35
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: "results/experiment_3472_p01_process_energy_vs_self_consistency_headroom_v6.json"
    prompt: |
      CONTEXT: This is THE decisive P0.1 test for .320. .319 cleanly established that on a
      CEILING benchmark (GSM8K SC 0.908) a trained energy (correctness AUROC 0.629) TIES SC
      exactly (exp3460) because a near-perfect majority vote leaves no room for a selector —
      the energy-weighted vote degenerates onto the majority answer (the exact tie flagged as
      a tautology). The literature says the win appears WITH HEADROOM and from PROCESS-level
      verification: arXiv:2602.11570 (PRIME) reports process-aware verification beats
      outcome-only by +8-9% on AIME; arXiv:2510.13918 gives optimal SC+PRM aggregation; the
      sweep nuance is that verifiers fail to recover the minority-yet-correct answer (a tiny
      fraction at ceiling, a large fraction with headroom). The never-asked question: on a
      HEADROOM benchmark (SC ~0.4-0.7) does a PROCESS-AWARE step-level energy + OPTIMAL
      aggregation BEAT SC at matched compute? It invokes NO live model (scores exp3471's
      cached corpus) so it completes in seconds and CANNOT time out.

      EXISTING CODE TO READ FIRST:
        - data/p01_hardmath_generations.jsonl (the HEADROOM cached corpus from exp3471 —
          each candidate has raw text, extracted answer, correctness label, mean-token
          logprob, AND a parsed step list for process scoring)
        - results/experiment_3460_p01_trained_energy_reranker_vs_self_consistency_v5.json
          (the GSM8K predecessor + its tautology flag — what to avoid; reuse its trained-reranker recipe)
        - results/experiment_3461_energy_correctness_calibration_trained_vs_untrained_v2.json (AUROC 0.629 trained, 0.606 FoVer)
        - python/carnot/verify/ (the FoVer 4-verifier step-error ensemble: fr11_session_memory,
          tier0r_curry_howard, tier0s_arithmetic_gap, tier0u_logical_consistency — applied PER STEP here)
        - python/carnot/ (the EORM / energy-reranker module from Exp 443)
        - research-references.md "2026-05-30 Post-.319 Planning Sweep" (PRIME + optimal-aggregation refs)

      TASK: On the HEADROOM corpus, train a process-aware energy (the FoVer step-error
      verifier scored PER STEP + the trained EORM reranker) with a documented held-out split,
      fit an OPTIMAL SC+energy aggregation, and compare to a VERIFIED-NON-DEGENERATE
      self-consistency baseline at matched compute. PRIMARY metric: the FLIP-COUNT (problems
      where the energy/aggregation choice differs from the SC majority answer) and the net
      correctness change among flips — tautology-clean by construction.

      PRECONDITIONS (step 0, before any comparison is reported):
        a. data/p01_hardmath_generations.jsonl present with >=40 problems, each with a greedy +
           k>=5 sampled generations + per-step traces + correctness labels + logprobs. If absent
           or n<40 -> honest_verdict complete: blocked_p01_corpus_too_small_n=NN (a clean
           complete: so downstream gate-synth/capstone are NOT cascade-blocked).
        b. The FoVer step-error ensemble + EORM/reranker substrate loadable. If not ->
           complete: blocked_energy_substrate_unavailable.
        c. HEADROOM GATE: SC (majority-vote) accuracy over the full corpus in [0.4, 0.78].
           If SC > 0.78 the corpus is at ceiling (no headroom; the GSM8K problem) -> write
           complete: blocked_corpus_at_ceiling_no_headroom_sc=SS and report no energy comparison.

      CONCRETE STEPS:
        1. Split by PROBLEM id into TRAIN / HELD-OUT folds (never split samples of one problem
           across folds — leakage). Use k-fold CV if n is small; document split + seed. ALL
           accuracies are held-out only.
        2. PROCESS ENERGY: score each candidate's PARSED STEPS with the FoVer 4-verifier
           step-error ensemble (per-step), aggregate to a candidate process-energy.
        3. TRAINED ENERGY: train the EORM reranker on outcome labels (features = process-energy
           components + logprob + verifier signals); record param count.
        4. OPTIMAL AGGREGATION: fit a principled SC+energy combiner (arXiv:2510.13918) on TRAIN,
           apply on HELD-OUT.
        5. Score 7 conditions on held-out: (1) greedy AR floor; (2) self-consistency (PRIMARY
           control, majority vote); (3) self-certainty BoN (arXiv:2502.18581); (4) process-energy
           argmin; (5) trained-energy-weighted vote; (6) trained-energy x SC hybrid; (7) OPTIMAL
           SC+energy aggregation (the headline condition).
        6. MATCHED COMPUTE: conditions 2-7 consume the SAME k cached generations; energy adds only
           scoring (no extra samples). Report per-condition generation budget + reranker/aggregator
           param count.
        7. PRIMARY FLIP-COUNT METRIC (tautology-clean by construction): for each energy/aggregation
           condition vs SC, compute (i) flip_count = problems where the condition's selected answer
           differs from the SC majority answer, (ii) flips_correct = flips that are now CORRECT,
           (iii) flips_incorrect = flips now WRONG, (iv) net_correctness_gain = flips_correct -
           flips_incorrect. Report accuracies too, but when a condition agrees with SC, that is
           flip_count=0 reported ONCE with a methodology_note — NEVER two conceptually-distinct
           accuracy fields with bit-identical values (the exp3460 flag).
        8. Compute held-out accuracy per condition + the PRIMARY paired delta (optimal-aggregation
           minus SC) AND the process-energy/trained-energy/hybrid deltas, each with McNemar exact p
           + paired bootstrap CI95.
        9. Emit results with clean methodology (real duration, seed, checksum,
           inference_substrate=verifier_ensemble_against_cached_candidates).

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="complete:/success:/passed:/shipped_ prefix."
        inference_substrate: value=verifier_ensemble_against_cached_candidates
        benchmark_id: principle="the headroom benchmark scored (distinct from GSM8K)."
        n_problems_heldout: principle="held-out problems scored; >=20 preliminary, >=40 headline-eligible (with CV)."
