milestone: 2026.06.412
milestone_title: >-
  CLOSE THE THREE OPEN ARC GENERIC-SOLVER GAPS with counterexample-guided induction, BANK sc25's
  provisional levels, and PREP an updated operator submission package. .411 proved the example corpus +
  generic operators take generic_loo_solve_count 2->5 and bank g50t + vc33 (registry 39/20), but
  generic_solver_gap_state stayed PARTIAL: THREE gaps remain OPEN -- (1) GAP-4423-DC22 (the .411
  config_rule_verifier resolved ft09 generically but did NOT ground dc22, the last open first-contact
  game), (2) GAP-4432-LOO-TR87 (tr87 re-solves only via its hand adapter -- needs a GENERIC glyph-rewrite
  operator), (3) GAP-4432-LOO-SC25 (sc25 re-solves only via its hand recipe -- a GENERIC cast-grid
  phase-FSM world-model operator closes it AND can BANK sc25's 4 PROVISIONAL live-recorded levels L2-L5,
  the biggest reproduced-level opportunity). All three are grounding/induction failures; the .412 fresh
  lever is COUNTEREXAMPLE-GUIDED inductive synthesis (arXiv:2309.16436 / 2606.11521) -- re-induce from the
  rejecting execution-state when a proposed predicate does not reproduce. Monotonically grow
  reproducible_total_levels from 39/20 (target 40-44 via dc22 +1 and sc25 +1..+4). THE .410/.411 LESSON,
  ENFORCED: inference_substrate is a REQUIRED ARTIFACT FIELD on EVERY ARC solve/scoring task (the agent
  must EMIT it). ALL experiments agent_type=codex/gpt-5.5 (operator quota-conserve 2026-06-19 sprint; the
  Claude planner is SKIPPED via this pre-staged roadmap; planner/retro stay Claude). The live generator is
  Qwen3.5-9B-MTP ([[project_arc_live_generator]]); NEVER the 3090s. paper_ready=True (FoVer 0.9131, G1-G4)
  is the FROZEN headline. NO leaderboard submission in-loop (operator-only; A6 PREPARES a package).
milestone_doc: openspec/change-proposals/research-roadmap-v412.md
milestone_overview: |
  .411 attacked the generic gap with the example corpus + new operators and answered "partial": the count
  rose 2->5 and g50t/vc33 banked, but THREE generic operators still cannot GROUND/INDUCE the rule for
  dc22 (config/toggle), tr87 (glyph-rewrite, generically), and sc25 (cast-grid, generically). .412 turns
  that diagnosis into banked progress with one unifying fresh lever -- counterexample-guided induction.
  Every ARC SOLVE task is reproduction-gated (arc_solver_kit.reproduce -> only reproduced levels count),
  Incremental-Progress-scoped (+1..+n levels on ONE game; never "solve them all"), EMITS inference_substrate
  as a REQUIRED ARTIFACT FIELD, and uses a TERMINAL-prefixed honest_verdict (a routed-no-level run is
  complete:, never partial:). Reserved: 2 infra slots, 1 per attached FPGA board (Hardware-Task Continuity),
  1 SOTA-ingestion slot. The ARC submission sprint forcing function (CLAUDE.md, through 2026-06-30) mandates
  the MAJORITY on ARC live-solving -- here 6 of 6 discretionary slots (A1-A6).

    PHASE 0 -- TRANSITION: exp4454 archive .411 -> activate .412; record the TRUE .411 close-state.

    PHASE A -- GENERIC LIVE SOLVING (operator MANDATORY; the headline; majority):
      A1 (exp4455) SOLVE dc22 L1: extend the .411 config_rule_verifier with COUNTEREXAMPLE-GUIDED grounding
        (re-induce from the rejecting execution-state), per-game RE the toggle/maze delta, register a
        GameAdapter -> +1 game/level (39/20 -> 40/21); closes GAP-4423-DC22.
      A2 (exp4456) GENERIC glyph-rewrite-rule verifier operator -> tr87 re-solves WITHOUT its hand adapter;
        closes GAP-4432-LOO-TR87 (raises generic_loo_solve_count).
      A3 (exp4457) GENERIC cast-grid phase-FSM world-model operator + BANK sc25 provisional L2-L5
        (reproduction-gated) -> +1..+4 levels; closes GAP-4432-LOO-SC25.
      A4 (exp4458) FIRST-CONTACT a NEW never-attempted survey game (sb26/bp35/lf52/re86) via the full
        generic stack -> +1 game/level or a terminal complete: with the residual logged.
      A5 (exp4459) LEAVE-ONE-OUT generic-solve benchmark v3 -- re-measure generic_loo_solve_count after
        A2/A3 land (v2 was 5; target >=6). The falsifiable progress metric.
      A6 (exp4460) SUBMISSION PACKAGE PREP (operator-only submit) -- validate + assemble the env-matched
        offline-reproduced replay package (>=39 levels >> the 13-level prior baseline); does NOT submit.
    PHASE B -- RESERVED INFRA (2 slots): exp4461 (registry/gaps hygiene + GAP-4 regression guard +
      reconcile .412), exp4462 (provisional-vs-reproduced count-integrity lint + submission-replay env-match
      guard so the monotonic metric cannot silently inflate).
    PHASE C -- HARDWARE CONTINUITY (1 per attached board): exp4463 (KV260 SSH + GateMate + PolarFire).
    PHASE D -- SOTA-INGESTION (.412 bleeding-edge track -- counterexample-guided generic rule/world-model
      induction for interactive games): exp4464 (map the strongest methods onto the .413 roadmap).
    PHASE E -- CAPSTONE: exp4465 (the .412 scorecard + the generic-solver-gap DECISION + the submission-
      readiness decision: did A1-A3 close gaps, raise generic_loo_solve_count, and bank new levels?).

