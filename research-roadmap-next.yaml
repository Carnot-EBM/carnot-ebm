    addressed_by: Remove the unnecessary natural-data gate from fixture qualification; split the oversized
      runner into tested numerical components and a thin CLI.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.675. Compute raw response risk per view first. Average A/B risks for two-view arms, then apply one response-level temperature to the mean risk logit, then choose one typed decision. Tune selection uses uncalibrated deployed response NLL; temperature fits the same aggregated tune risk. Canonical arms use A; logistic averages features before its shared head. Never average losses as a substitute for this deployment rule. Exp7741 was gate-blocked behind Exp7740. Its numerical qualification can run on fixtures without a natural corpus. Exp7730 previously covered only 30% of its large runner.

