        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Planning-time research is sealed at <!-- V538-PLANNER-REFRESH-20260807-END --> in research-references.md. The next milestone must preserve a dated SOTA ingress and freeze the causal boundaries for four operator-authorized ARC lever A/Bs before any live measurement. Planning-time ARCANA, Cost-Effective Agent Harnesses, Hyper-SET, and audited skill-graph findings are not runtime deltas.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md around the V538 marker
      - {project_root}/ops/known-issues.md 2026-08-07 ARC six-lever directive and progress log
      - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/arc_solve_registry.yaml
      - {project_root}/python/carnot/experiment_6198_v537_post_marker_source_scope_audit.py
      - {project_root}/scripts/sweep_clusters.py, {project_root}/scripts/sweep_semscholar.py, and {project_root}/scripts/exclusion_manifest_lint.py
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/audit_roadmap_gates.py, {project_root}/research-roadmap-next.yaml, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md

      TASK
      Search only evidence dated strictly after the V538 planning marker across the required arXiv topics, OpenReview, Extropic, EBT and ARM-EBM Semantic Scholar citations, Hugging Face Papers, targeted GitHub, and Logical Intelligence. Append only reproducible new findings. Independently lint the staged roadmap and freeze the outcome vocabulary, no-solve boundary, matched-control requirements, and registry-nonmutation contract for the ARC A/Bs.

      Required deliverable: {project_root}/results/experiment_6211_v538_post_marker_source_scope_prereg.json.
      REQUIRED ARTIFACT FIELDS: status, planner_marker_and_hash, query_window, source_channel_receipts, discovered_candidates, accepted_findings, rejected_or_duplicate_findings, accepted_count, references_append_receipt, roadmap_path_and_hash, roadmap_schema_result, exclusion_manifest_lint_result, retired_scope_match_count, prior_failure_contract_result, gate_structure_result, model_specs_rule_result, task_count, phase_counts, arc_task_count, continuous_self_learning_slot_count, hardware_boundary_result, arc_outcome_vocabulary, matched_control_contract, no_solve_and_registry_nonmutation_contract, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. Each load-bearing field must have a field_principles entry. retired_scope_match_count must be bare 0.

      CONCRETE STEPS
      1. Add REQ-INFRA-6211 and scenarios to openspec/capabilities/research-harnesses/spec.md before implementation and trace focused tests.
      2. Hash the exact V538 marker and search only a strictly later time window. Record every required source channel even when it is unavailable or null.
      3. Deduplicate against research-references.md and append only dated, reproducible, technically relevant findings. A null is a valid result.
      4. Run the roadmap schema, gate, prompt-ending, model, exclusion-manifest, retired-dependency, and prior-failure checks without changing research-roadmap.yaml.
      5. Freeze ARC treatment activation, A/A, matched-budget, per-game-loss, no-solve, forbidden-access, and registry-hash requirements as machine-readable fields.
      6. Add focused tests for marker exclusivity, duplicate suppression, null handling, roadmap counts, and fail-closed causal contracts.
      7. Run applicable non-mutating e2e checks and adversarial-verify the final artifact. Do not rewrite historical results.

