  - id: exp2009-ebm-cot-latent-calibration
    milestone: "2026.05.157"
    title: "Exp 2009: EBM-CoT Latent Thought Calibration"
    deliverable: "results/experiment_2009_ebm_cot_latent_calibration.json"
    agent_type: "codex"
    prompt: |
      CONTEXT: Today is {date}. Workspace is {project_root}. Recent research (arXiv:2511.07124) shows that refining latent "thought" representations via energy functions prevents cascading reasoning errors.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verify_repair.py
      TASK: Implement EBM-CoT latent representation refinement.
      MODEL_SPECS: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, unsloth/gemma-4-26B-A4B-it-GGUF
      CONCRETE STEPS:
      1. Extract intermediate hidden states from local SOTA models.
      2. Apply an energy function and Langevin dynamics to pull the representations to lower-energy regions.
      3. Evaluate downstream accuracy compared to uncalibrated generation.
      4. Write the results artifact.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

