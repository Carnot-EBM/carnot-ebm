  - id: exp3055-repair-headline-retirement-and-blocker-ledger
    milestone: "2026.05.286"
    deliverable: "results/experiment_3055_repair_headline_retirement_and_blocker_ledger_v1.json"
    title: "Repair headline retirement and blocker ledger"
    priority: critical
    max_turns: 100
    estimated_wall_time_min: 45
    track: "methodology"
    inference_substrate: "aggregation"
    requires_gpu: false
    model: "opus"
    prior_failures:
      - experiment_id: exp3042-repair-promotion-reconciliation-v3
        verdict: "complete: repair_reconciliation_ready=true; repair_promotion_candidate=false; repair_claim_status=bounded; remaining_blockers=9"
        addressed_by: "Retires unsupported repair headline wording before any live rerun instead of reinterpreting bounded evidence as promotable."
        retire_if_same_verdict: true
      - experiment_id: exp3053-capstone-v285
        verdict: "complete: capstone_ready=true; paper_ready=false; repair_claim_status=bounded"
        addressed_by: "Turns the capstone recommendation to retire gate-rerun blockers into a concrete blocker ledger."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. The .285 capstone recommends retiring unsupported repair headline wording and gate-rerun blockers. This is a methodology and manifest-readiness task, not a live repair rerun.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - ops/exclusion_manifest.yaml
      - results/experiment_3041_matrix_capstone_adversarial_flag_hygiene_v1.json
      - results/experiment_3042_repair_promotion_reconciliation_v3.json
      - results/experiment_3052_cross_corpus_matrix_v19.json
      - results/experiment_3053_capstone_v285.json
      - ops/changelog.md

      TASK
      Produce a repair blocker ledger that identifies unsupported headline wording, rows that should be retired, and the exact evidence needed before a repair rerun can be considered again.

      CONCRETE STEPS
      1. Load exp3041, exp3042, exp3052, and exp3053 and extract every repair-related blocker and retired/bounded row.
      2. Identify any repair headline wording that lacks support under the .285 matrix and mark it as retired_for_headline_use.
      3. If a repo manifest update is clearly required by CLAUDE.md discipline, update only the minimal ops/exclusion_manifest.yaml entry and cite the change; otherwise write the artifact with no file edits.
      4. Define rerun prerequisites: deterministic fingerprint, seed, duration sanity, de-tautology metrics, verifier gain, and exact checker authority.
      5. Set repair_headline_retirement_ready=true only if matrix v20 can consume the retirement/blocker decision.

      REQUIRED ARTIFACT FIELDS:
      - repair_headline_retirement_ready: bool (principle: unsupported claims must be retired before reruns)
      - retired_repair_claims: list (principle: retired wording must be machine-readable)
      - still_bounded_repair_claims: list (principle: bounded evidence must not be promoted by wording)
      - rerun_prerequisites: list (principle: future reruns must have explicit gates)
      - manifest_updates: list (principle: any exclusion-manifest changes must be traceable)
      - source_artifacts: list (principle: retirement decisions must cite concrete files)
      - inference_substrate: dict (principle: aggregation work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3056-repair-de-tautology-protocol-v1
