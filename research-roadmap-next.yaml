    track: "verification"
    inference_substrate: "offline_exact_fixtures"
    requires_gpu: false
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp3102-gated-structured-repair-micro-panel-v3
        verdict: "blocked_gate_check_failed: upstream exp3101 retired or unavailable"
        addressed_by: "Adds localized fragment/constraint verification targets before the repair micro-panel decides whether to execute."
        retire_if_same_verdict: true
      - experiment_id: exp3089-gated-structured-repair-micro-panel-v2
        verdict: "missing_or_gated: repair micro-panel did not produce promoted evidence"
        addressed_by: "Creates a deterministic target manifest that repair can consume even when full repair remains blocked."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Repair has repeatedly blocked or gone missing because the verifier gate was not satisfied. Before full repair, Carnot needs localized fragment/constraint verification targets that identify where a candidate violates exact constraints.

      EXISTING CODE TO READ FIRST
