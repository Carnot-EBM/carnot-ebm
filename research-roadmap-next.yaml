    - {project_root}/openspec/capabilities/continuous-learning/spec.md
    - {project_root}/results/experiment_7385_v648_decision_training.json

    TASK:
    Produce results/experiment_7397_v649_delayed_adapter.json. Use scripts/experiments/experiment_7397_v649_delayed_adapter.py as a thin executable entrypoint. Put necessary reusable behavior in python/carnot/experiment_7397_v649_delayed_adapter.py or the explicitly named shared module, with tests/python/test_experiment_7397_v649_delayed_adapter.py and any shared-module tests. All new paths are deliverables to create, not missing preconditions. Do not execute a future task early.
    Structured prerequisites:
    No whole-task structured prerequisite. Authenticate named inputs locally; diagnostic reading never promotes ineligible science.

    CONCRETE STEPS:
    1. PRECONDITIONS: Read the driving capability and confirm REQ-* requirements exist. Extend the relevant spec and write meaningful failing spec-linked tests before implementation. Check exact input identity and eligibility before dependent work; failed structured gates emit terminal blocked_* with gate_check_summary. Reuse shipped helpers and thin entrypoints instead of copying entire launchers.
    2. Emit a flushed progress line immediately, at EVERY phase boundary, and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Inside every long loop print completed units and monotonic elapsed at least every 60 seconds. Stream subprocess output unbuffered and print truthful pending-operation heartbeats every 60 seconds during blocking calls, authoring and validation. Keep every silence gap below 600 seconds: a silent task can die at 1200 seconds, while continued progress permits the 4800-second hard cap. Checkpoint each unit; cancel only owned processes on timeout. Never sleep to satisfy a duration floor.
    3. Declare inference_substrate_class=no_model_load, execution_venue=host, MODEL_SPECS=[], model_invoked=false and zero current LLM invocation counts. Describe real CPU/JAX/exact-solver work in a STRING inference_substrate and put device detail separately. Small Gibbs/affine training belongs in small_ebm_training and does not imply an LLM load. Archived and scripted model receipts live in hash-bound sidecar files; do not nest their positive invocation counters in the current artifact or copy historical substrate declarations.
    4. Add an experiment-local adapter in python/carnot/learning/delayed_energy_calibration.py. Use p_incorrect=sigmoid(a*E+b), projected a in [0.25,4] and b in [-8,8]. Freeze Gibbs weights within the stream. Initialize a,b from training-only initial groups, not the full Exp7385 checkpoint if it saw future stream groups. Fit initial 2-4-1 Gibbs weights by natural-prevalence Bernoulli loss, five fixed seeds 7397001..7397005, at most 500 steps; no sweep.
