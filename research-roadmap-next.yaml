milestone: 2026.06.410
milestone_title: >-
  CLOSE THE GENERIC-SOLVER GAP: turn the corpus of WORKING per-game solutions into a GENERIC live
  solver that solves UNSEEN games WITHOUT per-game reverse-engineering. Today the 20 reproducible
  games are solved by a HETEROGENEOUS mix (hand-RE'd GameAdapters tr87/tu93, per-game E3
  world_models sc25/ar25/ka59/ft09, frozen trajectory replays r11l/ls20/wa30, graph-explore
  trajectories, config-rule induction) -- only arc_loop_solve's standing loop is truly generic, and
  every unseen game still needs delta-RE. The Kaggle eval is HELD-OUT private games, so GENERIC
  solving is the entire competitive value. Operator insight 2026-06-19: "we have examples of working
  level solutions -- that should help us get generic live solves." .410 mines that example corpus:
  (A) a LEAVE-ONE-OUT generic-solve benchmark that QUANTIFIES how many solved games are re-derivable
  from the OTHER games' examples alone; (B) example-corpus-conditioned win-condition + action-model
  induction for held-out games; (C) the A3 generic-first-contact fix so a routed game actually SOLVES;
  (D) consolidation of the per-game solver primitives into composable generic operators in
  arc_solver_kit. Monotonically grow reproducible_total_levels (currently 35/18). ALL experiments
  agent_type=codex/gpt-5.5 (operator quota-conserve 2026-06-19; the Claude planner is SKIPPED via this
  pre-staged roadmap; planner/retro stay Claude). The live generator is Qwen3.5-9B-MTP
  ([[project_arc_live_generator]]). paper_ready=True (FoVer 0.9131, G1-G4) is the FROZEN headline.
milestone_overview: |
  .409 accelerated the per-game pipeline; .410 attacks the GENERIC gap directly using the working
  solutions as an example library, because the leaderboard is unseen games. Every ARC SOLVE task is
  reproduction-gated (arc_solver_kit.reproduce -> only reproduced levels count) and Incremental-
  Progress-scoped (+1..+n levels on ONE game; never "solve them all"). Every task DECLARES
  inference_substrate (fixes the .409 DURATION_TOO_SHORT false-positive class) and uses a TERMINAL-
  prefixed honest_verdict (fixes the .409 exp4423 partial: FAIL-loop). Reserved: 2 infra slots, 1 per
  attached FPGA board (Hardware-Task Continuity), 1 SOTA-ingestion slot.

    PHASE 0 -- TRANSITION: exp4431 archive .409 -> activate .410; record the TRUE close-state.

    PHASE A -- GENERIC LIVE SOLVING FROM THE EXAMPLE CORPUS (operator MANDATORY; the headline):
      A1 (exp4432) LEAVE-ONE-OUT generic-solve benchmark -- how many solved games re-solve from the
        OTHER games' registry recipes alone (the falsifiable measure of generic capability).
      A2 (exp4433) example-corpus-conditioned WIN-CONDITION induction on a HELD-OUT game.
      A3 (exp4434) example-corpus-conditioned ACTION-MODEL (E3 world_model) induction on a HELD-OUT game.
      A4 (exp4435) FIX + harden the generic first-contact solver (the .409 exp4423 partial: bug) so a
        ROUTED game actually banks +1 reproducible level.
      A5 (exp4436) DEEPER (+1 level on an already-solved game) + consolidate per-game solver PRIMITIVES
        into composable generic operators in arc_solver_kit.
    PHASE B -- RESERVED INFRA (2 slots): exp4437 (ARC-task artifact-discipline template + lint),
      exp4438 (registry/gaps hygiene + GAP-4 regression guard).
    PHASE C -- HARDWARE CONTINUITY (1 per attached board): exp4439.
    PHASE D -- SOTA-INGESTION (.410 bleeding-edge track -- generic program-induction / few-shot
      world-model induction): exp4440.
    PHASE E -- CAPSTONE: exp4441.

tasks:
  - id: exp4431-archive-409-activate-410
    milestone: 2026.06.410
    title: "PHASE 0 (TRANSITION) -- archive .409 -> activate .410; assert YAML parses + smart-subset pre-test gate green; RECORD the TRUE .409 close-state."
    priority: critical
    track: infra
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing): routine milestone-transition task -- false-positive scope-match vs prior archive-v* tasks; mechanical archive+activate, never a doomed rerun."
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4431_archive_409_activate_410.json
    prompt: |
      Archive .409 into research-complete.yaml and activate .410. Assert research-complete.yaml +
      ops/exclusion_manifest.yaml + research-roadmap-next.yaml parse under yaml.safe_load; run the
      smart-subset pre-test gate green. RECORD the TRUE .409 close-state truthfully from the .409
      capstone: which PHASE A tasks banked reproducible levels (A2 glyph +1; A4 deeper) vs were
      quarantined (A1 DURATION_TOO_SHORT) or skipped (A3 partial: verdict), the final
      reproducible_total_levels/games, and the config-rule-vocabulary transfer outcome. SKIP any
      flagged_adversarial artifact; HONOR verifier_is_oracle (a circular/execution-grounded ARC solve
      is NOT a moat headline). REQUIRED ARTIFACT FIELDS:
        honest_verdict: {{principle: "terminal-prefixed self-declared state lets the reconciler classify without re-running"}}
        reproducible_total_levels: {{principle: "the bare authoritative count from ops/arc_solve_registry.yaml; the sprint's monotonic progress metric"}}
      honest_verdict MUST start with complete:/complete_/success:/success_/passed:/passed_/shipped:/shipped_.
      verifier_is_oracle=true (execution-grounded). NO TRM training; NO leaderboard submission.

  - id: exp4432-loo-generic-solve-benchmark
    milestone: 2026.06.410
    title: "PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY) -- LEAVE-ONE-OUT generic-solve benchmark: how many solved games re-solve from the OTHER games' example recipes alone (the falsifiable measure of the generic gap)."
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-19 operator direction: we have working per-game solutions -- measure how much generic transfer they already enable, the prerequisite to closing the per-game-RE gap for live unseen-game solving. New benchmark (no prior failure); the falsifiable baseline for .410+ generic work."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4432_loo_generic_solve_benchmark.json
    prompt: |
      GOAL: QUANTIFY the current generic capability. For a held-out set of K>=6 already-solved games
      with CLEAN reproducible solves (pick from: tr87, tu93, lp85, vc33, sc25, ka59, ar25, ft09 -- read
      ops/arc_solve_registry.yaml for the current reproducible set), run a LEAVE-ONE-OUT test: for each
      target game, TEMPORARILY withhold its OWN per-game recipe (its GameAdapter / world_model /
      trajectory / config-rule) and attempt to solve it from scratch using ONLY (a) the generic
      arc_loop_solve standing loop, (b) transfer-routing (arc_solve_learning.recommend_approach routes
      to the closest OTHER solved game's recipe), and (c) the OTHER games' registry general_gotchas +
      primitives. Run the reproduction gate (arc_solver_kit.reproduce) on each attempt -- only an
      offline-reproduced solve counts.
      PRECONDITIONS (check FIRST; on any miss write honest_verdict blocked_<resource> and STOP, no
      fabrication): (a) the offline env files exist (ls environment_files/ non-empty);
      (b) python -c "import carnot.agentic.arc_solver_kit, carnot.agentic.arc_solve_learning" succeeds;
      (c) the live generator GGUF is cached IF a game needs LLM induction
      (ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-MTP-GGUF/ non-empty) -- else mark that
      game blocked_model_not_cached and continue the rest.
      Do NOT mutate the real registry during the test -- snapshot/restore, or route around the target's
      own entry in-memory. Record per-game: solved_without_own_recipe (bool, reproduction-gated),
      routed_to (which other game's recipe), residual_delta (the mechanic the generic path could NOT
      induce). FALSIFIABLE GATE: generic_loo_solve_count >= 2 of K (at least 2 solved games are
      re-derivable from the example corpus alone => the example corpus already enables some generic
      transfer; if 0, the gap is total and A2/A3 are the levers). This counts NO new levels (it
      re-solves known games) -- it is the BASELINE measurement, not a level-banking task.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict: {{principle: "terminal-prefixed (this benchmark ALWAYS completes with a measurement -- positive, partial, or zero -- so it is terminal, never partial:)"}}
        generic_loo_solve_count: {{principle: "bare int: the count of games re-solved from the example corpus WITHOUT their own recipe -- the headline generic-capability number"}}
        per_game: {principle: "list of {{game, solved_without_own_recipe, routed_to, residual_delta}} -- shows EXACTLY which mechanics the example corpus does and does not transfer"}
        offline_reproduced: {{principle: "every claimed re-solve is reproduction-gated -- a non-reproducible solve does not count (ARC Solve Reproducibility Discipline)"}}
        missing_verifier_gaps: {{principle: "each residual_delta the generic path could not induce is a missing-verifier/missing-primitive gap -- the .410 A2-A5 build backlog"}}
        random_seed: {{principle: "determinism precondition for a third party to re-run the benchmark"}}
        reproducibility_checksum: {{principle: "content hash of the example-corpus snapshot used, so the LOO result is reproducible"}}
      honest_verdict MUST start with complete:/success:/passed:/shipped:. verifier_is_oracle=true
      (execution-grounded reproduction). NO leaderboard submission.

  - id: exp4433-example-conditioned-win-condition-induction
    milestone: 2026.06.410
    title: "PHASE A2 (ARC NORTH STAR) -- example-corpus-conditioned WIN-CONDITION induction: few-shot the solved games' grounded win-rules to induce is_win() for a HELD-OUT game (+1 reproducible level if it grounds + solves)."
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-19 operator direction: use working level solutions as few-shot examples to generalize win-condition induction to unseen games. Versioned continuation of the .408/.409 config-rule inducer with a STATED forward difference: the prompt is now CONDITIONED on the registry's solved-game win-rules as few-shot examples (not a single-game inducer)."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4433_example_conditioned_win_induction.json
    prior_failures:
      - experiment_id: exp4421
        verdict: config_rule_grounded_but_duration_too_short_quarantined
        addressed_by: "Declares inference_substrate=live_llm_inference (real LLM induction >60s) so a real solve is not DURATION_TOO_SHORT-quarantined; and conditions induction on the solved-game win-rule corpus instead of inducing one game cold."
        retire_if_same_verdict: true
    prompt: |
      GOAL: take ONE HELD-OUT config/toggle game (NOT already solved) from 0 -> +1 reproducible level by
      inducing its win-condition USING the corpus of already-grounded win-rules as few-shot examples.
      PRECONDITIONS (check FIRST; on any miss write honest_verdict blocked_<resource> and STOP, no
      fabrication): (a) live generator GGUF cached
      (ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-MTP-GGUF/ non-empty) OR the local
      iGPU llama-server path (NEVER the 3090s -- conductor-sacrosanct); (b) the offline env files exist;
      (c) ops/arc_solve_registry.yaml has >=3 grounded win-rule examples to few-shot from.
      METHOD: gather the grounded win-rules of the SOLVED config/relational games (ka59 count_4==32,
      s5i5, etc.) as few-shot examples; hand the held-out game's object-centric digest (values+counts +
      component features -- the structured scaffolding validated 2026-06-18) PLUS those examples to the
      Qwen3.5-9B-MTP generator; have it PROPOSE is_win(grid); the verifier GROUNDS/REJECTS the proposed
      predicate (propose-then-ground, verifier_is_oracle=true); drive the grounded predicate as the
      OfflineSolver win-check and run arc_solver_kit.reproduce. INCREMENTAL: +1 level (L1).
      FALSIFIABLE GATE: offline_reproduced=true AND reproduced_levels>=1 on the HELD-OUT game; an honest
      partial (grounded Tier-2 predicate but no reproduced level, with the residual logged as a gap) is
      PROGRESS but is reported with a TERMINAL complete: prefix, never partial:.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict: {{principle: "terminal-prefixed -- a fully-run induction that grounds-but-does-not-solve is COMPLETE (a negative-but-real outcome), so use complete: not partial: (the .409 exp4423 FAIL-loop fix)"}}
        reproduced_levels: {{principle: "bare int; only reproduction-gated levels count (ARC Solve Reproducibility)"}}
        offline_reproduced: {{principle: "the reproduction gate -- a live-only solve does not count"}}
        few_shot_examples_used: {{principle: "list of which solved-game win-rules conditioned the induction -- proves the example corpus is the lever, the core .410 hypothesis"}}
        verifier_is_oracle: {{principle: "true: the verifier GROUNDS the LLM-proposed predicate (execution-grounded), so this is NOT a learned-verifier moat claim -- honest framing per Circularity Discipline"}}
        random_seed: {{principle: "determinism for re-run"}}
        reproducibility_checksum: {{principle: "content hash of corpus+prompt for reproducibility"}}
      honest_verdict MUST start with complete:/success:/passed:/shipped:. NO 3090 inference; NO
      leaderboard submission.

  - id: exp4434-example-conditioned-action-model-induction
    milestone: 2026.06.410
    title: "PHASE A3 (ARC NORTH STAR) -- example-corpus-conditioned ACTION-MODEL (E3 world_model) induction: few-shot the solved games' world_models to synthesize a HELD-OUT game's transition model faster/more accurately."
    priority: high
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-19 operator direction: reuse the solved E3 world_models (sc25/ar25/ka59/ft09) as examples so an unseen game's action-model is induced from analogy, not cold. Versioned continuation of the .402 E3 explore-verify-plan with a STATED forward difference: few-shot conditioning on the existing world_model corpus."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4434_example_conditioned_action_model.json
    prompt: |
      GOAL: on ONE HELD-OUT (non-spatial, mechanic-limited) game, measure whether conditioning the E3
      world-model synthesis on the EXISTING solved world_models raises world-model accuracy and/or
      reaches +1 reproducible level vs cold synthesis.
      PRECONDITIONS (check FIRST; on any miss honest_verdict blocked_<resource>, STOP, no fabrication):
      (a) offline env files exist; (b) codex is the world-model proposer (it WRITES
      results/arc_e3/<game>/world_model.py); (c) >=2 existing world_models present under results/arc_e3/
      to few-shot from.
      METHOD: gather the solved games' world_model.py files (sc25/ar25/ka59/ft09) as few-shot examples;
      run active-data collection (coverage-driven: balance every action, diverse object-config
      signatures, avoid deadly) THEN codex synthesizes the held-out game's world_model.py CONDITIONED on
      the examples; explore-verify-plan (AERA 2605.25931 + Agent2World 2512.22336); reproduction-gate any
      plan. INCREMENTAL: +1 level (L1). Report world_model_accuracy WITH-examples vs a cold-synthesis
      control arm (positive control: does conditioning actually help, or is the held-out mechanic just
      out-of-distribution relative to the example corpus?).
      FALSIFIABLE GATE: EITHER offline_reproduced=true AND reproduced_levels>=1, OR
      world_model_accuracy_with_examples > world_model_accuracy_cold by a real margin (positive control
      confirming the example corpus helps). A clean negative (examples did NOT help; the mechanic is OOD)
      is a REAL finding reported with a terminal complete: prefix + the residual as a missing-world-model
      gap.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict: {{principle: "terminal-prefixed; a measured no-help result is complete (negative-but-real), not partial:"}}
        reproduced_levels: {{principle: "bare int; reproduction-gated"}}
        offline_reproduced: {{principle: "the gate"}}
        world_model_accuracy_with_examples: {{principle: "the example-conditioned arm metric -- the .410 hypothesis under test"}}
        world_model_accuracy_cold: {{principle: "the cold-synthesis positive-control arm -- without it a no-improvement result is uninterpretable (FALSE_NEGATIVE_RISK)"}}
        missing_verifier_gaps: {{principle: "the residual mechanic class the examples could not transfer -- the build backlog"}}
        random_seed: {{principle: "determinism"}}
        reproducibility_checksum: {{principle: "content hash for reproducibility"}}
      honest_verdict MUST start with complete:/success:/passed:/shipped:. verifier_is_oracle=true. NO 3090
      inference; NO leaderboard submission.

  - id: exp4435-fix-generic-first-contact-solver
    milestone: 2026.06.410
    title: "PHASE A4 (ARC NORTH STAR; operator MANDATORY) -- FIX the generic first-contact solver (the .409 exp4423 partial: FAIL-loop) so a ROUTED unseen game actually banks +1 reproducible level."
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-19 operator direction: the generic first-contact solver is the live-solver capability and it 3-fail-SKIPPED every .409 milestone on a verdict-vocabulary bug; fixing it is required forward work. Versioned continuation of exp4423 with a STATED forward difference: the atomic verdict-contract fix + a real routed-solve target."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4435_generic_first_contact_fixed.json
