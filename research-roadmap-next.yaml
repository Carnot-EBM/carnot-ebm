milestone: "2026.08.575"
milestone_title: "Constraint Memory and Latent Energy Correction"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6592-v575-terminal-intake-and-method-lock
    milestone: "2026.08.575"
    deliverable: results/experiment_6592_v575_terminal_intake_and_method_lock.json
    title: "V575 terminal intake and method lock"
    priority: critical
    track: evidence-infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 45
    operator_override: "2026-05-29 standing operator directive: versioned lineage continuation; Exp6592 binds new V575 evidence and gate fields without rerunning the completed V574 model streams."
    prompt: |
      CONTEXT
      Milestone 574 completed four tasks. Exp6588 opened the bounded CFR path. Exp6589 remained blocked at terminal report validation. Exp6590 and Exp6591 produced complete Qwen3.6 and Gemma 4 31B CFR row streams but made no quality claim. V575 must bind those facts, lock the new literature-derived methods, and create same-roadmap gates without rewriting history. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V575 roadmap document
      - {project_root}/results/experiment_6588_v574_bounded_cfr_launch_root.json through {project_root}/results/experiment_6591_gemma4_31b_constraint_first_stream.json
      - {project_root}/research-references.md V575 refresh and the cited arXiv method pages
      - {project_root}/scripts/summarize_artifact.py, artifact unwrapping, gate, hash, GGUF cache, GPU ownership, atomic output, and protected-file helpers plus their tests
      - relevant evidence, exact-verification, continuous-latent, sampling, inference, and continual-learning capability specs; _bmad/traceability.md; ops/status.md; ops/changelog.md; and ops/e2e-test-plan.md

      TASK
      Build the V575 terminal evidence root. Replay Exp6588-Exp6591 from raw fields, preserve Exp6589 as blocked, bind the two completed CFR streams to their nested methodology receipts, lock the new canary methods, and emit the exact same-roadmap gate map. Perform no LLM inference and do not rewrite a historical artifact.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected-file hashes, dirty-worktree state, all four source artifact paths and hashes, current roadmap and reference hashes, CPU, RAM, disk, local mandated GGUF cache identities, visible GPU ownership, and the no-LLM substrate.
      1. Add or confirm REQ-* and SCENARIO-* anchors for V575 terminal replay, nested methodology binding, method-source locking, same-roadmap gates, protected historical artifacts, and atomic output. Write focused tests first.
      2. Use scripts/summarize_artifact.py and raw field replay. Preserve each upstream honest_verdict, verdict_class, gate_check_summary, readiness score, adversarial disposition, and hash. Never infer GREEN from Exp6589.
      3. For Exp6590 and Exp6591, bind every per-unit row to model_spec_and_identity, prompt_source_router_hashes, raw_stage_receipts, exact_checker_receipts, checkpoint_receipts, gpu_process_receipts, failure_rows, and stream recomputation. Record missing top-level methodology fields as warnings, not invented values.
      4. Lock arXiv:2608.23526, arXiv:2608.23551, and arXiv:2608.21466 source IDs, retrieved titles, method boundaries, controls, metrics, and non-claims. No source result counts as Carnot evidence.
      5. Resolve content-derived cache identities for unsloth/Qwen3.6-35B-A3B-GGUF and unsloth/gemma-4-31B-it-GGUF without loading or downloading a model. Record whether two idle, runtime-owned RTX 3090 devices are available.
      6. Freeze the exact gate fields. Exp6593 reads v575_cfr_reducer_ready_score. Exp6602 reads v575_dual_gpu_canary_ready_score. Confirm every upstream task and artifact field exists in this roadmap and is spelled identically in the owning task's REQUIRED ARTIFACT FIELDS.
      7. Attack invented CFR benefit, Exp6589 block erasure, principle-wrapper misread, missing row hashes, methodology invention, paper-result transfer, legacy-model substitution, unowned GPU eviction, gate-field drift, and historical artifact mutation.
      8. Set v575_cfr_reducer_ready_score=1.0 only when both CFR row streams replay completely. Set v575_dual_gpu_canary_ready_score=1.0 only when both mandated caches resolve and two idle owned GPUs are visible. A zero dual-GPU score must not block the scientific phases.
      9. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, artifact convention checks, adversarial verification, applicable evidence E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6592_v575_terminal_intake_and_method_lock.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The intake is terminal and cannot pose bootstrap work as evidence."
        honest_verdict:
          principle: "The verdict reports evidence and method readiness without creating a science result."
        verdict_class:
          principle: "Use only positive, circular_positive, null, blocked, disqualified, or partial; a ready intake is null infrastructure."
        gate_check_summary:
          principle: "Any blocked outcome names the failed artifact, hash, cache, resource, gate, or protection check and its observed value."
        v574_terminal_replay_rows:
          principle: "Exp6588 through Exp6591 retain their actual terminal states, fields, adversarial dispositions, and hashes."
        cfr_stream_methodology_binding_rows:
          principle: "Each immutable CFR row binds nested model, source, seed, exact-check, checkpoint, failure, cost, and process receipts without invention."
        method_source_lock_rows:
          principle: "Each new paper method has a source ID, bounded import, controls, metrics, and explicit non-claims."
        model_cache_identity_rows:
          principle: "Both mandated flagship caches resolve by content without model load or download."
        gpu_ownership_rows:
          principle: "Dual-GPU readiness follows from two idle runtime-owned devices and cannot evict unowned work."
        current_roadmap_gate_contract_rows:
          principle: "Every downstream gate names a current upstream task and an exact owner-declared field."
        v575_cfr_reducer_ready_score:
          principle: "This exact binary field gates Exp6593 only when both immutable CFR streams replay."
        v575_dual_gpu_canary_ready_score:
          principle: "This exact binary field gates Exp6602 without blocking science tasks."
        attack_rows:
          principle: "Invented science, block erasure, wrapper errors, drift, substitution, eviction, and historical mutation fail closed."
        preconditions_checked:
          principle: "Artifacts, hashes, caches, resources, ownership, methods, and protected files are explicit."
        protected_files_unchanged:
          principle: "research-roadmap.yaml and scripts/research_conductor.py retain their original hashes."
        inference_substrate:
          principle: "The task declares terminal artifact and method replay with no LLM."
        verifier_is_oracle:
          principle: "Exact receipt replay owns readiness but cannot create positive research science."
        field_provenance:
          principle: "Every field names source artifacts, raw rows, hashes, and reducer code."
        duration_s:
          principle: "Monotonic duration exposes a source-only shortcut."
        tests_run:
          principle: "Named commands, exits, and durations make intake validation reproducible."
        reproducibility_checksum:
          principle: "A final content hash detects terminal mutation."
      Set inference_substrate=v574_terminal_and_v575_method_replay_no_llm and verifier_is_oracle=true. A ready intake uses verdict_class=null. Use a terminal honest_verdict prefix complete:, success:, passed:, or shipped:. A genuine block uses blocked_* and populates gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6592_v575_terminal_intake_and_method_lock --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6593-cfr-independent-row-reducer
    milestone: "2026.08.575"
    deliverable: results/experiment_6593_cfr_independent_row_reducer.json
    title: "Independent CFR row reducer, gated on Exp6592 readiness"
    priority: critical
    track: constraint-first-adjudication
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 75
    agent_type: codex
    model: gpt-5.6-sol
    gated_on:
      - upstream: exp6592-v575-terminal-intake-and-method-lock
        artifact_field: v575_cfr_reducer_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Exp6590 and Exp6591 contain immutable direct, always-on CFR, and routed CFR rows for Qwen3.6 and Gemma 4 31B. The model tasks made no headline claim. Exp6592 has bound their methodology and exact gate. This task is the first independent comparison and must compute every result from rows without loading a model. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V575 roadmap document
      - {project_root}/results/experiment_6590_qwen36_constraint_first_stream.json, {project_root}/results/experiment_6591_gemma4_31b_constraint_first_stream.json, and {project_root}/results/experiment_6592_v575_terminal_intake_and_method_lock.json
      - the frozen Exp6587 CFR method contract and its source, router, metric, and exact-check registry hashes
      - paired-statistics, artifact unwrapping, row-consistency, failure retention, cost accounting, atomic output, and adversarial verification helpers plus tests
      - relevant extraction, exact-verification, evidence, and inference specs; traceability; status; changelog; and E2E plan

      TASK
      Independently replay and compare direct, always-on CFR, and routed CFR rows by model family and pooled unit. Compute exact success, headroom, supported and contradictory constraints, abstention, unsafe release, tokens, latency, and failure outcomes. Do not load an LLM and do not trust upstream aggregates.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected hashes, structured gate value, source artifact hashes, method and registry hashes, expected unit and arm counts, model identity bindings, seeds, paired-test plan, and CPU-only substrate.
      1. Add or confirm REQ-* and SCENARIO-* anchors for immutable CFR reduction, per-unit replay, family isolation, paired statistics, no-headroom handling, exact-authority circularity, failure retention, and atomic output. Write focused tests first.
      2. Recompute expected units, arms, source hashes, model identities, prompt and router hashes, raw-stage presence, exact results, tokens, latency, and failures from each stream. Fail closed on duplicate, missing, reordered, or cross-family rows.
      3. Emit one per_unit_rows entry for every family, source unit, and arm. Preserve raw outcome references and all null, timeout, parse, contradiction, unsupported, abstention, and exact-rejection states.
      4. Compute direct versus always-on and routed CFR deltas by family and pooled paired unit. Report wins, losses, ties, headroom, McNemar or exact sign tests where valid, paired bootstrap intervals, Stage 1 precision and recall, unsupported and contradictory rates, unsafe release, tokens, latency, and charged failures.
      5. Preregister the acceptance gate from the frozen Exp6587 contract. A candidate CFR win needs positive exact-success delta, nonnegative paired lower bound, no unsafe-release increase, the Stage 1 precision floor, and the frozen cost limit. Report no-headroom and underpowered cases directly.
      6. Keep Qwen and Gemma proposals independent. Do not let one family's output repair, label, or select the other. Pool only byte-identical shared units after both family results are fixed.
      7. Attack aggregate-only claims, dropped failures, family-label swap, identical control and treatment, one-win promotion, no-headroom promotion, seed drift, source drift, exact-check substitution, cost omission, and recomputation disagreement.
      8. Set cfr_reducer_ready_score=1.0 only when every expected row and aggregate replays. Classify an acceptance-gate win as circular_positive because the exact checker defines the target. Otherwise report null, partial, blocked, or disqualified honestly.
      9. Write atomically. Run focused tests, lint, spec coverage, artifact convention and verdict-row consistency checks, adversarial verification, applicable verification E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6593_cfr_independent_row_reducer.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The reducer ends with a complete comparison or a named evidence block."
        honest_verdict:
          principle: "The verdict states family and pooled CFR effects without upgrading row completeness to benefit."
        verdict_class:
          principle: "Use the closed enum; an exact-checker-defined CFR win is circular_positive, never positive."
        gate_check_summary:
          principle: "Any block names the failed gate, artifact, row, hash, pairing, or method check and observed value."
        per_unit_rows:
          principle: "Every family, unit, and arm carries exact outcome, headroom, constraints, abstention, tokens, latency, failures, and raw references."
        source_artifact_receipts:
          principle: "Both immutable stream artifacts and the Exp6592 evidence root bind by path and hash."
        model_identity_replay_rows:
          principle: "Nested mandated GGUF identities and process receipts bind every family result."
        row_completeness_recomputation:
          principle: "Expected, present, duplicate, missing, reordered, and failure row counts derive from raw rows."
        family_effect_rows:
          principle: "Qwen and Gemma direct-versus-CFR effects are computed before pooling."
        pooled_effect_summary:
          principle: "Pooling uses only shared byte-identical paired units and cannot erase family heterogeneity."
        paired_statistical_receipts:
          principle: "Wins, losses, ties, headroom, tests, intervals, and underpowered cases remain explicit."
        constraint_quality_summary:
          principle: "Supported, unsupported, contradictory, precision, recall, and leakage measures replay from Stage 1 rows."
        safety_and_cost_summary:
          principle: "Unsafe release, abstention, tokens, latency, and failures are charged to each arm."
        acceptance_gate_rows:
          principle: "Every preregistered benefit condition records expected, observed, and passed values."
        cfr_reducer_ready_score:
          principle: "This exact binary field gates Exp6599 only when all rows and aggregates replay."
        attack_rows:
          principle: "Aggregate, drop, swap, identity, no-headroom, drift, authority, cost, and recomputation attacks fail closed."
        preconditions_checked:
          principle: "Gates, hashes, units, arms, identities, seeds, tests, and protected files are explicit."
        protected_files_unchanged:
          principle: "Both protected orchestration files retain their original hashes."
        inference_substrate:
          principle: "The task declares immutable CFR row reduction with no LLM."
        verifier_is_oracle:
          principle: "The exact checker defines CFR success, so any benefit is circular-positive."
        field_provenance:
          principle: "Every field points to raw rows, hashes, and reducer functions."
        duration_s:
          principle: "Monotonic duration exposes truncated replay."
        tests_run:
          principle: "Focused reducer and consistency commands include exits and durations."
        reproducibility_checksum:
          principle: "A final content hash protects the independent result."
      Set inference_substrate=immutable_qwen_gemma_cfr_row_reducer_no_llm and verifier_is_oracle=true. A complete null uses verdict_class=null. A valid CFR gate win uses verdict_class=circular_positive. Any blocked_* verdict populates gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6593_cfr_independent_row_reducer --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6594-cfr-counterfactual-authority-audit
    milestone: "2026.08.575"
    deliverable: results/experiment_6594_cfr_counterfactual_authority_audit.json
    title: "CFR counterfactual and exact-authority audit"
    priority: critical
    track: constraint-first-adjudication
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 70
    agent_type: codex
    model: gpt-5.6-sol
    prompt: |
      CONTEXT
      Exp6593 is the decision reducer for the completed flagship CFR streams. This audit always runs so that missing or null science evidence still gets an exact diagnosis. It must test whether source, constraints, stages, model family, raw bytes, and the named exact checker are causally bound to the result. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V575 roadmap document
      - Exp6587's frozen CFR method contract; Exp6590 and Exp6591 row streams; Exp6592 intake; and Exp6593 reducer artifact when present
      - counterfactual receipt, tamper detection, exact-check registry, source-span, row replay, artifact unwrapping, atomic output, and adversarial verification helpers plus tests
      - relevant evidence, extraction, and exact-verification specs; traceability; status; changelog; and E2E plan

      TASK
      Independently attack the CFR evidence and authority chain without model inference. Replay controls plus source replacement, constraint deletion, contradiction injection, Stage 1 and Stage 2 swap, family-label swap, raw-byte tamper, answer leakage, and exact-authority substitution. Preserve one row per unit and attack.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected hashes, all available upstream paths and hashes, expected row keys, exact registry hash, attack seeds, immutable copies or safe temporary fixtures, and no-LLM substrate. Missing Exp6593 is diagnosable input, not a reason to skip the audit.
      1. Add or confirm REQ-* and SCENARIO-* anchors for CFR counterfactual receipts, source and stage causality, family isolation, tamper detection, leakage rejection, exact-authority substitution, missing-input blocks, and atomic output. Write focused tests first.
      2. Recompute the unmodified control rows. Bind each attack to a source family, unit, arm, input hash, expected effect, observed effect, exact checker, and release decision.
      3. Run source replacement, source-span deletion, supported-constraint deletion, contradiction injection, Stage 1/Stage 2 swap, family-label swap, raw-byte tamper, answer leak, exact-checker removal, and exact-checker substitution. Never generate replacement model output.
      4. Require content tamper and answer leakage to fail closed. Require authority removal or substitution to block release. A family-label swap alone must not create an unexplained score or release change.
      5. Recompute any Exp6593 headline from the clean rows. Record whether attacks change the minimal expected links and whether the reducer rejects altered evidence.
      6. If an upstream artifact is absent or a required field is None, write blocked_missing_cfr_evidence with gate_check_summary naming the path, field, and observed value. Do not emit null science or fabricate substitute rows.
      7. Attack zero-row completion, silent attack skip, control/treatment identity, expected-effect rewriting, source repair after outcome, model-as-authority, exact-check substitution, family collapse, and historical artifact mutation.
      8. Set cfr_authority_audit_ready_score=1.0 only when clean replay and every applicable attack behave as preregistered. An audit can pass when the CFR scientific effect is null.
      9. Write atomically. Run focused tests, lint, spec coverage, artifact convention and verdict-row consistency checks, adversarial verification, applicable evidence E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6594_cfr_counterfactual_authority_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The always-run audit ends as complete attack evidence or a named missing-input block."
        honest_verdict:
          principle: "The verdict separates authority integrity from CFR scientific benefit."
        verdict_class:
          principle: "Use the closed enum; a complete integrity audit is null infrastructure, not positive science."
        gate_check_summary:
          principle: "Any block names the missing path, field, hash, row, or checker and observed value."
        per_unit_rows:
          principle: "Every family, unit, control, and attack records inputs, expected effect, observed effect, checker, and release decision."
        clean_replay_receipts:
          principle: "Unmodified rows and any reducer headline recompute before attacks."
        source_counterfactual_rows:
          principle: "Replacement and span deletion test source causality without model regeneration."
        constraint_counterfactual_rows:
          principle: "Deletion and contradiction attacks test whether bound constraints affect the named rows."
        stage_and_family_attack_rows:
          principle: "Stage and family swaps expose hidden coupling or identity shortcuts."
        tamper_and_leakage_rows:
          principle: "Raw-byte tamper and answer leakage fail closed with explicit receipts."
        authority_substitution_rows:
          principle: "Missing or substituted exact authority cannot release an answer."
        reducer_recomputation:
          principle: "Any Exp6593 headline is independently reproduced from clean rows."
        cfr_authority_audit_ready_score:
          principle: "This exact binary field gates Exp6599 only when clean replay and attacks pass."
        attack_rows:
          principle: "Zero-row, skipped, identical, rewritten, repaired, collapsed, and mutating audits fail closed."
        preconditions_checked:
          principle: "Inputs, hashes, row keys, registry, seeds, temporary paths, and protected files are explicit."
        protected_files_unchanged:
          principle: "Both protected orchestration files and all historical result artifacts retain their hashes."
        inference_substrate:
          principle: "The task declares deterministic counterfactual row replay with no LLM."
        verifier_is_oracle:
          principle: "The exact registry owns release authority but cannot create a non-circular benefit claim."
        field_provenance:
          principle: "Every field points to source rows, attack fixtures, checkers, hashes, and reducers."
        duration_s:
          principle: "Monotonic duration exposes a skipped attack matrix."
        tests_run:
          principle: "Focused authority and tamper commands include exits and durations."
        reproducibility_checksum:
          principle: "A final content hash protects the audit."
      Set inference_substrate=cfr_counterfactual_exact_authority_audit_no_llm and verifier_is_oracle=true. A complete audit uses verdict_class=null. A blocked_* verdict must populate gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6594_cfr_counterfactual_authority_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6595-invariant-projection-world-model-canary
    milestone: "2026.08.575"
    deliverable: results/experiment_6595_invariant_projection_world_model_canary.json
    title: "Frozen world-model invariant-projection canary"
    priority: high
    track: continuous-latent-energy
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 90
    prompt: |
      CONTEXT
      Carnot's long-term architecture needs energy correction inside continuous latent reasoning, not only exact checks after text generation. ArXiv:2608.23526 reports that projecting a frozen world model toward a learned energy-like invariant improves conservative rollouts while random constraints usually hurt. This task tests the mechanism on bounded local fixtures without claiming an ARC solve or importing the paper's result. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V575 roadmap document
      - {project_root}/research-references.md V575 entry and https://arxiv.org/abs/2608.23526
      - {project_root}/python/carnot/phase3/continuous_ebm.py, continuous latent state and projection modules, world-model fixtures, exact simulators, seeded statistics, and their tests
      - relevant continuous-latent, KONA, energy, evidence, and sampling specs; traceability; status; changelog; and E2E-008

      TASK
      Build a frozen-world-model invariant-projection canary. On preregistered conservative and damped fixtures, select a low-capacity invariant using calibration trajectories only, freeze it, and compare held rollouts under no projection, learned-invariant projection, an exact-invariant diagnostic control, and a norm-matched random constraint.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected hashes, arXiv source and method hash, existing module hashes, fixture equations and parameters, calibration and held split hashes, candidate invariant basis, seeds, horizons, tolerances, and CPU resources.
      1. Add REQ-* and SCENARIO-* anchors for calibration-only invariant selection, frozen held evaluation, conservative and damped controls, norm-matched random constraints, projection stability, per-row evidence, and atomic output. Write focused tests first.
      2. Use at least two conservative and two matched damped fixtures with analytically checked transitions. Freeze at least five seeds, multiple rollout horizons, and a low-capacity invariant basis before fitting.
      3. Fit or select the invariant on calibration trajectories only. Preserve candidate scores, selected expression or parameters, capacity, optimizer, seed, and split receipt. Do not use held outcomes for selection or tuning.
      4. Freeze the world model and invariant. Run no projection, learned projection, exact-invariant diagnostic, and norm-matched random projection on identical held initial states and disturbances.
      5. Emit one per_unit_rows entry per fixture, regime, horizon, seed, and arm with rollout error, invariant drift, energy, projection distance, iterations, convergence, failures, and wall time.
      6. A positive mechanism result requires learned projection to improve held conservative rollout error over no projection with a positive paired interval, beat the random control, avoid instability, and avoid finding a comparable conserved invariant or false benefit in damped controls. The exact-invariant arm is diagnostic and cannot be the headline.
      7. Attack held-split leakage, exact-invariant substitution, random-control norm mismatch, world-model mutation, post-outcome basis change, dropped unstable rows, one-seed promotion, damped-control omission, and aggregate-only reporting.
      8. Write a terminal honest verdict. Keep verifier_is_oracle=false because the held simulator evaluates a frozen predictor independently from the learned projection. Do not claim exact certification of the learned invariant.
      9. Write atomically. Run focused tests, lint, spec coverage, artifact convention and verdict-row consistency checks, adversarial verification, E2E-008, and final git status.

      Required deliverable: {project_root}/results/experiment_6595_invariant_projection_world_model_canary.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The canary ends with held comparative evidence or a named precondition block."
        honest_verdict:
          principle: "The verdict is limited to frozen local world-model fixtures and names null or harmful controls."
        verdict_class:
          principle: "Use only positive, circular_positive, null, blocked, disqualified, or partial."
        gate_check_summary:
          principle: "Any block names the missing module, fixture, split, resource, or numerical check and observed value."
        per_unit_rows:
          principle: "Every fixture, regime, horizon, seed, and arm carries rollout, drift, energy, projection, convergence, cost, and failure metrics."
        method_source_receipt:
          principle: "The imported paper mechanism and Carnot-specific non-claims bind by source and hash."
        fixture_and_split_receipts:
          principle: "Equations, parameters, initial states, disturbances, and calibration versus held membership are immutable."
        invariant_selection_rows:
          principle: "Every candidate, capacity, calibration score, seed, and selected invariant is visible before held evaluation."
        frozen_model_receipts:
          principle: "World-model and invariant hashes prove that held evaluation mutates neither."
        arm_summary_rows:
          principle: "No projection, learned, exact diagnostic, and random controls recompute from per-unit rows."
        paired_statistical_receipts:
          principle: "Effects, intervals, wins, losses, ties, and underpowered cases remain explicit."
        conservative_damped_specificity:
          principle: "A claimed invariant benefit must distinguish conservative from damped dynamics."
        acceptance_gate_rows:
          principle: "Held improvement, random-control separation, stability, and specificity record expected and observed values."
        attack_rows:
          principle: "Leakage, substitution, mismatch, mutation, tuning, row drop, seed, control, and aggregate attacks fail closed."
        preconditions_checked:
          principle: "Sources, modules, fixtures, splits, basis, seeds, horizons, resources, and protected files are explicit."
        protected_files_unchanged:
          principle: "Both protected orchestration files retain their original hashes."
        inference_substrate:
          principle: "The task declares deterministic frozen-world-model continuous latent evaluation with no LLM."
        verifier_is_oracle:
          principle: "The held exact simulator is independent of invariant selection and projection."
        field_provenance:
          principle: "Every field points to fixtures, split rows, model hashes, and reducer functions."
        duration_s:
          principle: "Monotonic duration exposes a calibration-only shortcut."
        tests_run:
          principle: "Focused numerical and E2E commands include exits and durations."
        reproducibility_checksum:
