        retire_if_same_verdict: true
      - experiment_id: exp2840-truthfulqa-dual-condition-v4
        verdict: "blocked_truthfulqa_generation_split"
        addressed_by: "This task materializes or verifies the TruthfulQA generation split before the next TruthfulQA evaluation."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Exp 2838, Exp 2839, and Exp 2840 all blocked because the local
        benchmark datasets or splits were missing. This task creates explicit
        local manifests so downstream corpus tasks can gate before spending an
        agent call.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - research-program.md
        - results/experiment_2838_mbpp_dual_condition_v3.json
        - results/experiment_2839_humaneval_dual_condition_v3.json
        - results/experiment_2840_truthfulqa_dual_condition_v4.json
        - results/experiment_2841_halueval_fever_pilot.json
        - data/
        - scripts/

      TASK:
        Materialize or verify local manifests for MBPP, HumanEval, TruthfulQA
        generation split, HaluEval, and FEVER. Prefer existing local datasets.
        If network/HuggingFace access is needed and unavailable, write an honest
        blocked_* verdict with the exact missing resource.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. cd {project_root}
           b. .venv/bin/python3 -c "import json, pathlib; print('python ok')"
