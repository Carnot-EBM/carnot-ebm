milestone: "2026.05.203"
milestone_title: "Continuous Self-Learning, HardNet++ Constraints, and Symbolic-KAN Integration"
milestone_doc: "openspec/change-proposals/research-roadmap-v2026.05.203.md"
tasks:
  - id: "exp2030-rls-feedback-stub"
    title: "Phase 1: RLS Feedback Loop Stub for Continuous Self-Learning"
    prompt: |
      CONTEXT: We are starting Phase 1 of milestone 2026.05.203. We need to implement a Recursive Logic Subsystem (RLS) feedback loop stub to provide dense verification signals for Energy-Based Transformers (EBTs).
      EXISTING CODE TO READ FIRST: python/carnot/models/boltzmann/
      TASK: Create an RLS verifier stub that evaluates partial reasoning traces and returns a scalar energy value.
      CONCRETE STEPS:
      1. Create a new module `python/carnot/models/boltzmann/rls_verifier.py`.
      2. Implement a `verify_trace` function that penalizes logical inconsistencies.
      3. Write unit tests in `tests/python/test_rls_verifier.py`.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.
    max_turns: 30

  - id: "exp2031-ebt-gemma-integration"
    title: "Phase 1: Integrate Gladstone EBT objective with Gemma-4-31B"
    prompt: |
      CONTEXT: Based on Gladstone 2025, Energy-Based Transformers frame training as energy minimization. We will integrate this with SOTA GGUFs.
      EXISTING CODE TO READ FIRST: python/carnot/models/boltzmann/rls_verifier.py
      TASK: Wrap `unsloth/gemma-4-31B-it-GGUF` inference to score partial traces using the EBT energy objective.
      CONCRETE STEPS:
      1. Create `python/carnot/models/boltzmann/ebt_wrapper.py`.
      2. Set up the `MODEL_SPECS` to use `unsloth/gemma-4-31B-it-GGUF`.
      3. Implement energy-guided decoding loop utilizing the RLS verifier.
      4. Add an integration test.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: "exp2032-continuous-self-learning-pipeline"
    title: "Phase 1: Continuous Self-Learning In-situ Updates"
    prompt: |
      CONTEXT: We need the system to update its energy landscape from streaming RLS feedback, satisfying the continuous self-learning PRD requirement.
      EXISTING CODE TO READ FIRST: python/carnot/models/boltzmann/ebt_wrapper.py
      TASK: Implement an in-situ gradient update mechanism based on the EBT energy signal.
      CONCRETE STEPS:
      1. Create `python/carnot/models/boltzmann/self_learning.py`.
      2. Implement the `update_energy_landscape` function using JAX/Optax.
      3. Write a small training loop test confirming weights update to lower energy on failed traces.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: "exp2033-symbolic-kan-prototype"
    title: "Phase 2: Prototype Symbolic-KAN Constraint Splines"
    prompt: |
      CONTEXT: Transitioning to Phase 2. Symbolic-KANs (2026) embed discrete structures into continuous splines.
      EXISTING CODE TO READ FIRST: python/carnot/models/ising/
      TASK: Implement a 1D spline representation for basic logical constraints.
      CONCRETE STEPS:
      1. Create `python/carnot/models/ising/symbolic_kan.py`.
      2. Implement learnable activation functions on edges representing AND/OR gates.
      3. Write tests validating the splines approximate the discrete logic tables.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.
    agent_type: codex
    max_turns: 30

  - id: "exp2034-kagnn-verifier"
    title: "Phase 2: KAGNN Verifier for Graph Coloring"
    prompt: |
      CONTEXT: We need a specialized Graph Neural Network verifier based on Kolmogorov-Arnold networks (KAGNN).
      EXISTING CODE TO READ FIRST: python/carnot/models/ising/symbolic_kan.py
      TASK: Implement a KAGNN verifier for the Graph Coloring constraint.
      CONCRETE STEPS:
      1. Create `python/carnot/models/ising/kagnn.py`.
      2. Build a GNN layer using Symbolic-KAN splines instead of linear weights.
      3. Write a test suite solving small graph coloring instances.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.
    agent_type: codex

  - id: "exp2035-kagnn-evaluation"
    title: "Phase 2: Evaluate KAGNN vs MLP Baseline"
    prompt: |
      CONTEXT: Validate that KAGNN provides a tangible efficiency or accuracy benefit.
      EXISTING CODE TO READ FIRST: python/carnot/models/ising/kagnn.py
      TASK: Run a comparative evaluation.
      CONCRETE STEPS:
      1. Create an evaluation script `scripts/eval_kagnn_vs_mlp.py`.
      2. Generate a synthetic dataset of constraint graphs.
      3. Run the evaluation and save results to `results/exp2035_kagnn_eval.json`.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: "exp2036-hardnet-damped-linearizations"
    title: "Phase 3: HardNet++ Differentiable Layer Implementation"
    prompt: |
      CONTEXT: Phase 3. HardNet++ uses damped local linearizations to enforce nonlinear constraints strictly.
      EXISTING CODE TO READ FIRST: python/carnot/models/gibbs/
      TASK: Implement the HardNet++ projection layer in JAX.
      CONCRETE STEPS:
      1. Create `python/carnot/models/gibbs/hardnet.py`.
      2. Implement the `DampedLinearizationLayer` ensuring outputs strictly satisfy provided boundary conditions.
      3. Write unit tests with basic polynomial inequalities.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: "exp2037-hardnet-gibbs-integration"
    title: "Phase 3: Integrate HardNet++ into Carnot-Gibbs Tier"
    prompt: |
      CONTEXT: Integrate the HardNet++ layer into our mid-tier framework.
      EXISTING CODE TO READ FIRST: python/carnot/models/gibbs/hardnet.py
      TASK: Modify the Gibbs sampler to utilize the HardNet layer to prune infeasible states.
      CONCRETE STEPS:
      1. Update `python/carnot/models/gibbs/sampler.py` to route through `hardnet.py`.
      2. Verify that sampled outputs never violate the strict boundaries defined.
      3. Write an end-to-end integration test.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: "exp2038-igd-sampler-mixed-data"
    title: "Phase 3: Interleaved Gibbs Diffusion (IGD) Sampler"
    prompt: |
      CONTEXT: IGD is needed for mixed continuous-discrete constraint generation.
      EXISTING CODE TO READ FIRST: python/carnot/models/gibbs/sampler.py
      TASK: Implement an IGD sampler.
      CONCRETE STEPS:
      1. Create `python/carnot/models/gibbs/igd_sampler.py`.
      2. Interleave discrete boolean jumps with continuous Langevin steps.
      3. Write unit tests targeting 3-SAT structure generation.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.
    agent_type: codex

