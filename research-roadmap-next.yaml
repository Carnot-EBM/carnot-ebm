      Define and test an exact-safe accept/abstain/reject contract that blocks .291 false-accept rows and exposes the contract as artifact data for the live rerun.

      CONCRETE STEPS
      1. Load the false-accept autopsy, prefix-bound pilot, and fragment monitor outputs.
      2. Define accept, abstain, and reject conditions using exact labels, parse confidence, premise/answer consistency, prefix-bound coverage, monitor ledger replay, and known-failure-family rules.
      3. Replay the contract on .291 live rows and prior exact fixture rows.
      4. Verify that all known false-accept regression rows are no longer accepted; abstention is acceptable, false accept is not.
      5. Add deterministic self-checks or tests for contract ordering and regression row behavior.

