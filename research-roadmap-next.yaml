milestone: "2026.05.161"
milestone_title: "Mouth/Brain EBT Architecture, ARM-EBM Bijection, and Thermodynamic Hardware Sampling"
milestone_doc: "openspec/change-proposals/research-roadmap-v161.md"

tasks:
  - id: exp2053-mouth-brain-architecture-audit
    title: "Exp 2053: Mouth vs Brain Architecture Audit"
    deliverable: results/experiment_2053_mouth_brain_audit.json
    max_turns: 20
    agent_type: gemini
    prompt: |
      CONTEXT: Recent EBT papers (arXiv:2507.02092) dictate separating the language generator ("mouth") from the energy verifier ("brain").
      EXISTING CODE TO READ FIRST: `_bmad/architecture.md`, `ops/status.md`.
      TASK: Audit the Carnot codebase to identify coupling between the LLM and the verifier and plan a clean separation.
      CONCRETE STEPS:
      1. Analyze Python and Rust layers for LLM/Verifier tight coupling.
      2. Draft a `_bmad/mouth_brain_separation.md` proposal.
      3. Format findings as `{project_root}/results/experiment_2053_mouth_brain_audit.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2054-ebt-scaffolding
    title: "Exp 2054: EBT Computation Layer Scaffolding"
    deliverable: results/experiment_2054_ebt_scaffold.json
    max_turns: 50
    prompt: |
      CONTEXT: EBTs assign energy values directly to input-prediction pairs.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/`.
      TASK: Implement the Energy-Based Transformer computation layer bridging the MoE outputs to PyO3 safetensors.
      CONCRETE STEPS:
      1. Scaffold an `EBTLayer` in `python/carnot/models/`.
      2. Use `cached_sota_pair()` with `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF` to extract hidden states on 5 queries.
      3. Evaluate latency overhead. Save results to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2055-compositional-energy-minimization
    title: "Exp 2055: Compositional Energy Minimization"
    deliverable: results/experiment_2055_comp_energy.json
    max_turns: 50
    prompt: |
      CONTEXT: NeurIPS 2025 demonstrated composing subproblem energy landscapes for complex multi-step reasoning.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Implement global energy landscape composition over small tractable subproblems.
      CONCRETE STEPS:
      1. Create a `CompositionalEnergyMinimizer` class.
      2. Apply it to a 10-step pathfinding or constraint problem.
      3. Measure the energy drop per step and record to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2056-soft-bellman-equation-solver
    title: "Exp 2056: Soft Bellman Equation Solver"
    deliverable: results/experiment_2056_soft_bellman.json
    max_turns: 50
    agent_type: codex
    prompt: |
      CONTEXT: arXiv:2512.15605 shows ARMs are EBMs via the Soft Bellman equation.
      EXISTING CODE TO READ FIRST: `crates/carnot-boltzmann/src/`.
      TASK: Implement the Soft Bellman equation solver in Rust to map ARM logprobs to EBM energies.
      CONCRETE STEPS:
      1. Implement `soft_bellman_solve` in Rust.
      2. Expose it via PyO3 to the Python layer.
      3. Add exhaustive unit tests and save test results to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2057-arm-ebm-bijection-test
    title: "Exp 2057: gated on Exp 2056: ARM-EBM Bijection Validation"
    deliverable: results/experiment_2057_arm_ebm_bijection.json
    max_turns: 50
    gated_on:
      - upstream: exp2056-soft-bellman-equation-solver
        artifact_field: success
        op: '=='
        value: true
    prompt: |
      CONTEXT: Validating the soft Bellman mapping empirically.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Validate the mathematical bijection on a small Sudoku dataset using the solver from Exp 2056.
      CONCRETE STEPS:
      1. Load a 10-puzzle Sudoku dataset.
      2. Use `unsloth/gemma-4-26B-A4B-it-GGUF` to generate logits.
      3. Map logits to energy using the soft Bellman solver. Compare with true constraint energy.
      4. Save error bounds to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2058-ebft-pipeline-scaffold
    title: "Exp 2058: EBFT Fine-Tuning Pipeline"
    deliverable: results/experiment_2058_ebft_scaffold.json
    max_turns: 50
    prompt: |
      CONTEXT: Energy-Based Fine-Tuning (EBFT) targets sequence-level stats instead of next-token prediction.
      EXISTING CODE TO READ FIRST: `python/carnot/training/`.
      TASK: Scaffold an EBFT objective function using our new verifiers.
      CONCRETE STEPS:
      1. Write an `EBFTLoss` function in JAX/Flax.
      2. Run a micro-training loop for 10 epochs on a simulated dataset.
      3. Log loss curve to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2059-thrml-sdk-integration-stub
    title: "Exp 2059: Extropic thrml SDK Integration Stub"
    deliverable: results/experiment_2059_thrml_integration.json
    max_turns: 50
    prompt: |
      CONTEXT: Extropic AI's TSU requires using the `thrml` Python library for thermodynamic machine learning algorithms.
      EXISTING CODE TO READ FIRST: `python/carnot/samplers/`.
      TASK: Create an integration stub for the `thrml` SDK.
      CONCRETE STEPS:
      1. Define a `TSUSampler` interface that mocks the `thrml` API.
      2. Wire it into the Carnot sampler registry.
      3. Save the interface validation to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2060-dtm-thermodynamic-model
    title: "Exp 2060: Denoising Thermodynamic Model Algorithm"
    deliverable: results/experiment_2060_dtm_algorithm.json
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    prompt: |
      CONTEXT: The TSU runs Denoising Thermodynamic Models (DTM) tailored for probability distributions driven by thermal noise.
      EXISTING CODE TO READ FIRST: `python/carnot/models/`.
      TASK: Implement the mathematical scaffolding for DTM.
      CONCRETE STEPS:
      1. Implement a `DenoisingThermodynamicModel` class.
      2. Write a unit test simulating a thermal relaxation step.
      3. Save validation to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2061-tsu-hardware-accounting
    title: "Exp 2061: TSU Hardware Resource Accounting"
    deliverable: results/experiment_2061_tsu_accounting.json
    max_turns: 100
    model: opus
    prompt: |
      CONTEXT: CRITICAL: We need latency and energy estimates for the TSU vs our AIA simulations. Hardware integration tasks require Opus.
      EXISTING CODE TO READ FIRST: `ops/status.md`.
      TASK: Estimate the energy efficiency and sampling latency for the upcoming Z1 chip based on Extropic specs.
      CONCRETE STEPS:
      1. Perform an analytical comparison between the `KnuthYaoSampler` (AIA) and the `TSUSampler`.
      2. Update the hardware telemetry. Output the metrics with `hardware_execution_claim=false`.
      3. Save the telemetry to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2062-unsupervised-system-2-pretraining
    title: "Exp 2062: Unsupervised Continuous Self-Learning"
    deliverable: results/experiment_2062_unsupervised_learning.json
    max_turns: 50
    prompt: |
      CONTEXT: PRD requires continuous self-learning. We must establish an unsupervised loop where the energy landscape refines itself.
      EXISTING CODE TO READ FIRST: `research-program.md`.
      TASK: Set up a continuous self-learning loop using `unsloth/Qwen3.6-35B-A3B-GGUF` and the compositional energy minimizer.
      CONCRETE STEPS:
      1. Create a `ContinuousSelfLearner` loop processing 5 unlabelled scenarios.
      2. Run the optimization steps, updating the EBM constraints.
      3. Save the post-training energy deltas to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2063-kona-style-reasoning-benchmark
    title: "Exp 2063: Kona-Style System Reasoning Benchmark"
    deliverable: results/experiment_2063_kona_benchmark.json
    max_turns: 50
    prompt: |
      CONTEXT: Evaluate our new architecture against the Kona 1.0 Sudoku/planning constraints approach.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Run a system-wide reasoning benchmark using the full Mouth/Brain pipeline.
      CONCRETE STEPS:
      1. Define a 10-problem reasoning set (Sudoku + Constraints).
      2. Evaluate using `unsloth/gemma-4-31B-it-GGUF` with our EBM verifier.
      3. Verify if we achieve < 500ms latency.
      4. Save benchmark stats to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

