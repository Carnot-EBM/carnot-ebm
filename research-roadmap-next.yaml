  - id: exp2617
    milestone: "2026.05.250"
    deliverable: "results/experiment_2617_jepa_online_eval.json"
    title: "JEPA v3 Online Learning Evaluation: Real FoVer Corpus Throughput"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: self_learning
    continuous_self_learning_task: true

    prior_failures:
      - experiment_id: exp2602-jepa-v3-online-wired
        verdict: "complete: online_update() wired; partial_fit tested with SYNTHETIC observations only"
        addressed_by: "exp2602 tested online_update() with 15 synthetic observations. This evaluates on REAL FoVer examples (50 real labeled pairs through VerifyRepairPipeline). Different data source and different evaluation goal — not re-wiring JEPA but measuring whether it adapts on real data."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      FR-11 (Continuous Self-Learning) mandate: JEPA v3 online_update() was wired in exp2602 and
      tested on synthetic observations. This task measures whether it adapts meaningfully on REAL
      FoVer corpus examples — the first end-to-end FR-11 evaluation on real data.

      Reference: arXiv:2505.19475 (Verifier-Driven TTT) proves that even a weak verifier (AUROC >
      0.65) provides meaningful improvement signal for online learning. Carnot's ensemble exceeds
      this threshold; this experiment validates that the online_update() mechanism correctly
      processes real FoVer observations.

      Per arXiv:2603.03538 (Online Learnability): soundness-completeness guarantees can be maintained
      with O(log T) mistakes over T examples — exactly the expected behavior from partial_fit.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (look for online_update, get_session_stats)
      - python/carnot/verify/jepa_predictor.py (or jepa_fast_path_predictor.py)
      - results/experiment_2602_jepa_v3_online.json (confirms online_update() exists)
      - results/experiment_2609_sklearn_prereq_fix.json (foVer_corpus_path)

      TASK: Run 50 real FoVer examples through VerifyRepairPipeline with online learning active.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. python/carnot/pipeline/verify_repair.py contains online_update method (confirmed by exp2602).
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. FoVer corpus discoverable (foVer_corpus_path from exp2609 or fallback).
         If precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load 50 real FoVer examples (random_state=42 sample from the corpus).
         Note: we do NOT need live LLM inference for this evaluation. The VerifyRepairPipeline's
         verify-only mode can process (context, claim, label) tuples without generating new text.

      2. Construct VerifyRepairPipeline with jepa_online=True.
         For each example:
           a. Call pipeline.verify(text=claim, context=context) to get energy score.
           b. Call pipeline.online_update({{
                text: claim,
                label: label,  # 1 = hallucination, 0 = correct
                energy: energy_score,
                fast_path_taken: (energy_score < threshold)
              }})

      3. After 50 examples: call pipeline.get_session_stats().
         Record: n_observations, n_partial_fits, final_fast_path_rate.

      4. Evaluate: did the fast_path_rate change over the 50 examples?
         Compute fast_path_rate_first_10 (examples 0-9) vs fast_path_rate_last_10 (examples 40-49).
         online_adaptation_detected = abs(fast_path_rate_last_10 - fast_path_rate_first_10) > 0.05.

      5. Write results/experiment_2617_jepa_online_eval.json with required fields.

      REQUIRED ARTIFACT FIELDS:
