- id: exp859-ice40-n8-combinational
  milestone: 2026.04.66
  deliverable: results/experiment_859_ice40_n8_combinational.json
  title: 'Exp 859: iCE40 N=8 Combinational Energy Oracle — Fix Register Expansion (CPU + iCE40 tools)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 851 exposed a fundamental mismatch: N=16 sequential Verilog expanded to
    12258 LCs at P&R (from 2 LCs at synthesis) because nextpnr-ice40 inferred 16 flip-flops
    for the spin state registers plus ~800 LUTs per spin for the MAC combinational logic
    (16 spins × 16 MACs × ~50 LUTs each ≈ 12,800 LUTs total). The iCE40 HX8K has only
    7680 LUTs. The fix: reduce N to 8 and remove ALL sequential logic. This experiment
    implements a pure combinational energy oracle: input=spin configuration, output=energy.
    No clk, no flip-flops, no Gibbs sweep inside the FPGA. The Gibbs sampling runs in
    Python; the FPGA evaluates E(s) for a given configuration only.

    OSS-CAD-Suite is installed at ~/tools/oss-cad-suite. Source it with:
      source ~/tools/oss-cad-suite/environment

    Target device: iCE40 HX8K (8k LUTs). Tool flow: yosys (synthesis) → nextpnr-ice40
    (P&R) → icepack (bitstream). Expected LUT count for N=8 combinational: ~64 MACs
    (N^2) × 2 LUTs each + adder tree = ~144 LUTs total (well within 7680 budget).

    EXISTING CODE TO READ FIRST:
    - results/experiment_851_ice40_n16_expansion.json — root cause details, Verilog used
    - hardware/fpga/ising_n16.v — the sequential N=16 Verilog (to understand what NOT to do)
    - hardware/fpga/ — directory of existing FPGA artifacts
    - python/carnot/backends/fpga.py — FpgaBackend that will dispatch to PYNQ overlay
    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc Gap 3 section

    TASK: Write pure combinational N=8 Verilog energy oracle. Synthesize + P&R with
