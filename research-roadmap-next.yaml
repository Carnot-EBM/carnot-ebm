- id: exp8248-evidence-intervention-methods
  title: Bind fourteen tasks and freeze matched source-evidence interventions
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 40
  per_unit_rows: true
  milestone: 2026.10.713
  deliverable: results/experiment_8248_v713_evidence_intervention_methods.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prior_failures:
  - experiment_id: exp8239-margin-decision-audit
    verdict: complete_null_margin_decision_audit
    addressed_by: The retired margin-only objective is replaced by new matched source-removal features;
      all loss coefficients stay unweighted.
    retire_if_same_verdict: true
  - experiment_id: exp8247-capstone
    verdict: complete_blocked_upstream_evidence
    addressed_by: Bind current task authority directly and preserve blocked scientific inputs without
      requiring them for the administrative contract.
    retire_if_same_verdict: true
  model: opus
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V712 executed fourteen tasks. Exp8239 found mean cost gain -0.01953125 with lower bound -0.04296875. Exp8241 found zero incremental group-memory gain. Stop margin-only tuning. Test new source intervention features on the qualified sentence transport.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/v711_current_contract.py; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/decision_margin_methods_8234.py; python/carnot/verify/sentence_transport_8179.py; python/carnot/verify/sentence_energy_8183.py; results/experiment_8239_v712_margin_decision_audit.json; results/experiment_8241_v712_delayed_benefit_audit.json; results/experiment_8247_v712_capstone.json; research-references.md
    TASK:
    Bind fourteen tasks and freeze matched source-evidence interventions. Deliver results/experiment_8248_v713_evidence_intervention_methods.json. Create the thin runner scripts/experiments/experiment_8248_v713_evidence_intervention_methods.py. Store primitive evidence under results/raw/experiment_8248_v713_evidence_intervention_methods/. Keep execution readiness separate from scientific benefit.
    CONCRETE STEPS:
    0. PRECONDITIONS: Emit a flushed start line. Authenticate required inputs and qualified terminal sidecars. Check private scratch and required tools before measurement. Missing external resources produce complete_blocked_<operand>, verdict_class=blocked. Record failed operands in gate_check_summary. Do not invent data or replace missing units.
    1. Emit a flushed progress line at every phase boundary. Emit one before and after every model load, generation, benchmark and subprocess. Print completed/pending counts inside long loops. Print a heartbeat at least every 60 seconds while children run. Keep every output gap below 600 seconds. Use unbuffered output, bounded deadlines and process-group cleanup. Write any file over about 200 lines in several tool calls of at most about 150 lines. Send a progress message between calls. Split work into resumable batches; no single huge tool call. Do not pad runtime.
    2. Add relevant REQ-* and SCENARIO-* before implementation. Write focused failing tests first. Preserve existing tests and assertions. Reuse qualified modules through small adapters. Freeze owned validation commands before measurement. Use private fixtures outside results/ and scratch outside the repository root. Do not update generator weights or publish externally.
    3. Declare no_model_load, MODEL_SPECS=[] and zero current LLM calls. Use aggregation_from_upstream_artifacts for reductions or verifier_ensemble_against_cached_candidates for small-head fitting/scoring. Record trained_head_specs separately. Reading the embedded vocabulary without neural weights is tokenizer-only work, not a model inference call.
    4. Bind exactly fourteen tasks, Exp8248 through Exp8261. Snapshot full task objects, the design, and active/staged authorities. During planning, activation is not required. At execution, verify the actual activated contract. Reuse the existing canonical digest and authority readers. Preserve V712 and its fourteen dispositions. Do not modify the active roadmap or reconstruct archived primaries.
    5. Write openspec/change-proposals/v713-evidence-intervention-protocol.json. Preserve V707 original fit=128, tune=64 and evaluation=128 source slots. Partition the 128 evaluation slots by ascending original source_cluster_id into stream=96 and retention=32. The static audit may evaluate all 128, but neither static fitting nor the online learner may read retention targets. Prove fit/tune/evaluation disjointness by original source hash. All are exposed development. Reject any stream/retention overlap with fit/tune roles; do not invent replacement sources. Seal labels separately from public inputs.
    6. Freeze one focal complete answer sentence per source using the highest cached V707 p_unsupported; break ties by sentence index. Choose one complete source sentence by maximum Jaccard overlap of casefolded Unicode word-token sets with the focal sentence; ties use the original sentence index, including zero-overlap ties. This lexical selector uses no cached citation or human label. Keep the complete original answer in each prompt. Build original, selected-evidence-deleted and nonselected-deletion source views. The control is the different complete source sentence with nearest embedded-token length; ties use its original index. Record signed removed-token difference divided by original source token count as a fifth feature. A control is nonselected, not certified irrelevant. No second complete source sentence means a named unavailable feature row. Record lexical-overlap strength and match distance as diagnostics. Never use a human error span to select a view.
    7. Freeze five added features: current original-view p_unsupported, selected-deletion probability change, control-deletion probability change, their difference, and normalized removal-length difference. Keep the sixteen historical features. These are model predictions, not entailment certificates. Measure the difference against matched controls with independent human targets. No compact rewritten claims, answer-option reranking or source-specific certificate gates.
    8. Freeze three 22-coefficient heads on the twenty-one inputs: radial energy with twenty-one fit-only centers, linear logistic, and additive with twenty-one fixed scalar bases. Reuse qualified optimization and tune-role calibration. Copy exact inherited ridge candidates and solver constants into this protocol before capture. Also fit the sixteen-feature energy ablation and a control-deletion-only energy head on nineteen inputs: the original sixteen, current original probability, control delta and removal-length difference. Give both ablations twenty-one fit-only centers and independent geometry. Retain frozen V707 decisions. Use unweighted log loss, no retired margin weighting. Split the 64 tune sources by ascending original source_cluster_id into calibration=32 and selection=32 before any fitting. Freeze comparator selection by selection-role decision cost, then Brier, then fixed arm order.
    9. Freeze cost C(accept,y)=5y, C(reject,y)=1-y, C(escalate,y)=0.5, with y=1 meaning unsupported. Keep accept limited to the frozen V707 accepted set. Choose the allowed action with lowest expected cost; ties escalate. When new views are unavailable, every current head uses the same frozen V707 probability/action; if that is unavailable, all escalate. Fallback rows cannot earn treatment gain. H1 requires a one-sided 97.5 percent source-cluster bootstrap lower cost gain above .02, at least five improved sources, at least 72 complete evaluation sources and twelve per class. Require no extra false accepts, Brier worsening <=.01 and cost worsening <=.02 versus every equal-information control and frozen baseline. Use 10,000 draws, seed 7138248; missing slots remain in the 128 denominator. H1 is development evidence only.
    10. Freeze the new continuous mechanism: add reusable soft constraint terms from released evidence-dependence groups, using delayed Beta counts and a global backoff. Keys may contain only coarse bins of the three view probabilities and relation type. They must never contain source IDs, hashes, quoted text or gold error types. Exp8255 implements this rule and Exp8256 audits it. Reserve alpha=.025 separately for H2. Use 96 stream slots, minimum 64 complete, eight per class and eight nonoverlapping blocks of eight slots. Hold 32 retention slots, minimum 20 complete and five per class. H2 requires a 97.5 percent moving-block-bootstrap lower cost gain above .02 versus global-only, five improved sources, no extra false accepts, Brier worsening <=.01 and cost worsening <=.02 versus all controls. Test block lengths 8, 4 and 16 with 10,000 draws and seed 7138256. Require retention Brier worsening <=.01, cost worsening <=.02 and zero extra false accepts versus frozen and global-only. Serialize all exact constants before capture.
    11. Run applicable private E2E-018/021 checks from ops/e2e-test-plan.md. Run relevant unit and consumer tests. Measure 100 percent changed-code statement coverage, including real CLI and child statements. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Preserve actual argv, exits, clocks and stdout/stderr hashes. Keep bounded repository-health diagnostics separate; known failures do not establish a global pass.
    12. Cold-replay primitive evidence in a fresh process. Include negative and rehashed-tamper cases. Validate a private candidate with unchanged primary_publication terminal checks, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Publish atomically after normal exit and required checks. Preserve historical primary bytes and honest failure artifacts. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. Do not modify research-roadmap.yaml.
    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Identify the actual invocation.
    honest_verdict, verdict_class: principle: Use complete_* terminal verdicts and one of positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished owned work. Unchanged external failures mean blocked.
    gate_check_summary: principle: Each block names the upstream, actual path/hash, exact field, operator, expected value and observed value. Missing evidence differs from a measured zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts: principle: Record actual current calls separately from historical model provenance.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count: principle: Preserve every source, condition and arm, including missing units. Record metric numerators and denominators. Repeats and seeds do not add independent sources.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle-defined success is circular_positive. All reused sources are exposed development. Both generalization scores remain zero in this milestone.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path: principle: Failed owned checks disqualify the result and set readiness to zero. Readiness does not imply benefit.
    preconditions_checked, duration_s, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes, phase_spans: principle: Bind real work to replayable primitive evidence and actual code/configuration bytes.
    cited_upstream_artifacts, field_principles: principle: Name each imported field and hash. Explain the evidentiary purpose of each added field.
    current_contract_ready_score, intervention_protocol_ready_score, protocol_path, protocol_sha256, canonical_tasks_sha256, role_manifest_hashes: principle: Administrative agreement and a frozen method are separate prerequisites.
    H1, H2, feature_definitions, control_matching_rule, intervention_scope: principle: Fix methods before outcomes; altered evidence does not change the original truth label.
