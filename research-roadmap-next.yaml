      CONTEXT: research-program.md mandates one continuous-self-learning experiment per milestone (Tiers 1-4). v17
      (.345) was Tier-1 (online precision tracker); v18 (.346) was Tier-2 (constraint memory); v19 (.347) TRAINED a
      Tier-3 predictor (FR11ExtendedJEPA, predictive AUROC 0.9715 on held-out FoVer) but did NOT use it. v20 makes
      the predictor PAY OFF at inference: wire it as a fast-path / early-exit CASCADE GATE so that when the
      predictor is confident a candidate is correct (or incorrect), the pipeline SHORT-CIRCUITS the full 4-verifier
      ensemble scoring; only uncertain candidates fall through to full scoring. This realizes the PRD's 'learning at
      inference speed' principle and the Partial-Reward-Model early-rejection pattern (arXiv:2508.01969 -- partial
      scores are predictive of final scores after short prefixes). CRITICAL: the fast-path must NOT regress accuracy
      -- the effective AUROC at the chosen confidence threshold must stay within the frozen 0.9131 CI; the gate
      trades compute for nothing if it degrades the verdict.
      EXISTING CODE TO READ FIRST: python/carnot/fr11/tier3_jepa.py (the FR11ExtendedJEPA API: predict(...),
      energy(...) -- REUSE the persisted predictor); results/experiment_3788_fr11_self_learning_v19_tier3_
      predictive.json (the trained predictor state path + the predictive AUROC + the feature protocol);
      results/experiment_2837_fover_memory_leakage_v3.json (the 4 scoring verifiers + the 0.9131 ensemble + the
      frozen CI [0.9027, 0.9235]); ops/reproduction-runbook-fover-headline.md (the full-ensemble scoring protocol --
      the fall-through path); research-references.md '.348 additions' arXiv:2508.01969 (the early-rejection anchor,
      as-reported); research-program.md 'Continuous Self-Learning' Tier-3 section.
      PRECONDITIONS (check BEFORE wiring; if ANY missing -> blocked_<resource>, EXIT, no fabrication):
        a. INTERPRETER: run under .venv/bin/python; jax/numpy/sklearn importable; FR11ExtendedJEPA importable; the
           v19 persisted predictor state loadable. If the persisted state is absent -> blocked_tier3_predictor_state_
           missing (graceful, honest -- do NOT retrain here; this is the APPLICATION step).
        b. Cached FoVer scores/labels reachable (the runbook's path, ABSOLUTE). If absent -> blocked_fover_corpus_
           missing.
      CONCRETE STEPS:
        1. Load the v19 persisted Tier-3 predictor + a held-out FoVer split (NOT the predictor's training split --
           report split sizes; a fast-path measured on the training split is leakage).
        2. Define a confidence gate: if the predictor's confidence (|score - 0.5| or its calibrated probability) is
           above a threshold, ACCEPT the predictor's verdict and SKIP full ensemble scoring; else FALL THROUGH to
           full 4-verifier scoring. Sweep the threshold to produce a compute-saving vs accuracy curve.
        3. Measure (a) SKIP RATE (fraction of candidates short-circuited) and (b) the EFFECTIVE AUROC of the
           combined fast-path+fallthrough system vs full scoring on the held-out split. Pick an operating point
           where effective AUROC stays within the frozen 0.9131 CI [0.9027, 0.9235] and report the skip rate there.
        4. Report HONESTLY: the compute saving at no-accuracy-regression, AND the trade-off curve. If NO threshold
           gives a meaningful skip rate without regressing AUROC, that is a valid finding (the predictor is not yet
           a useful fast-path) -- do NOT claim a saving that regresses accuracy (FALSE_NEGATIVE_RISK / IMPLAUSIBLE_
           PERFECT).
        5. Confirm the frozen 0.9131 full-scoring ensemble is UNCHANGED (the gate is additive; full scoring is still
           the fall-through). Persist the chosen operating point so a future milestone resumes it. If you ship
           code+tests, the test MUST assert the real gate behavior (anti-poison-test, the .344 root cause).
      INFERENCE-SUBSTRATE HYGIENE: verifier-scoring; reuses cached scores + the persisted predictor; full
      methodology (random_seed, reproducibility_checksum, model_specs naming the corpus + 4 verifiers + the Tier-3
      predictor). Run `.venv/bin/python scripts/adversarial_verify.py <artifact>`; confirm no critical flag.
      REQUIRED ARTIFACT FIELDS (principle documents WHY; store the bare VALUE):
        honest_verdict:
          principle: "Terminal prefix; the fast-path outcome; blocked_<resource> if a precondition failed."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: reads cached scores + the persisted predictor, no live model)."
        skip_rate_at_no_regression:
          principle: "Fraction of candidates the fast-path short-circuits at the operating point where effective AUROC stays in the frozen CI -- the core compute-saving deliverable."
        effective_auroc_at_operating_point:
          principle: "The combined fast-path+fallthrough AUROC at the chosen threshold -- MUST be within the frozen 0.9131 CI [0.9027, 0.9235] (no accuracy regression)."
        compute_saving_vs_accuracy_curve:
          principle: "The threshold sweep (skip rate vs effective AUROC) -- so the operator can pick a different operating point; honest trade-off."
        accuracy_regression:
          principle: "BARE bool, false at the reported operating point -- the gate trades compute for nothing if it degrades the verdict."
        held_out_split_sizes:
          principle: "Sample-size + leakage hygiene -- the fast-path is measured on a split DISJOINT from the predictor's training split."
        headline_ensemble_unchanged:
          principle: "BARE bool, true -- the frozen 0.9131 full-scoring ensemble is the fall-through and is UNTOUCHED; the gate is additive."
        is_tier3_application_not_retrain:
          principle: "BARE bool, true -- confirms v20 APPLIES the v19-trained predictor as a gate (it does not retrain) -- the lineage-continuation forward difference."
        operating_point_persisted:
          principle: "BARE bool, true -- the chosen gate operating point was persisted so a future milestone resumes it (continuous, not one-shot)."
        model_specs:
          principle: "Names the corpus + 4 verifiers + the Tier-3 predictor -- honest substrate."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Content hash catches drift."
        duration_s:
          principle: "Wall-clock plausibility floor; verifier-scoring + a gate sweep is modest."
      TERMINAL VERDICT: "complete: fr11_v20_tier3_fast_path_gate_skip_rate_<x>_effective_auroc_<y>_in_frozen_ci_no_accuracy_regression_headline_ensemble_unchanged_operating_point_persisted"
      Run: cd {project_root} && .venv/bin/python scripts/experiment_3803_fr11_v20_tier3_fast_path_gate.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

