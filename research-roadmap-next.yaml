      Build at least 120 exact-labeled ASP/FSM valid and controlled near-miss rows and emit results/experiment_5566_exact_asp_fsm_near_miss_corpus.json plus a reusable corpus under results/.

      CONCRETE STEPS:
      1. Reuse the exact fixture parser/validator; do not depend on Exp5552's missing grammar backend.
      2. Cover at least four families: defaults/exceptions, contradictions, soft-preference optimality, and FSM transition consistency.
      3. Generate balanced valid candidates and one-/two-edit corruptions with recorded mutation operators and distances; prevent duplicate leakage across train/dev/test partitions.
