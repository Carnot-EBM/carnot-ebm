  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 35
  priority: high
  requires_gpu: false
  skip_pre_test: false
  prompt: |
    CONTEXT:
    FSNet integrates a feasibility-seeking step into neural constrained optimization.
    Carnot's Phase-3 continuous EBM substrate currently measures energy but needs a
    concrete repair operator that reduces constraint violations without collapsing diversity.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - python/carnot/phase3/continuous_ebm.py
    - tests/python/test_continuous_ebm.py
    - results/experiment_1264_q11_tss_instrumentation_v2.json
    - openspec/capabilities/sampling/spec.md

    TASK:
    Add or prototype a small FSNet-style feasibility step for continuous EBM states and
    compare it against raw Langevin updates.

    CONCRETE STEPS:
    1. Create an in-progress artifact.
    2. Implement a minimal feasibility_step function or local experiment helper that takes a
       latent state and minimizes violation energy separately from task energy.
    3. Run on deterministic synthetic/FoVer-like latent states.
    4. Compare raw Langevin vs feasibility_step on final energy, violation count, convergence
       steps, state distortion, and diversity.
    5. Add focused tests if a public helper is added.
    6. Write feasibility_delta_overall, energy_delta, violation_delta, distortion_mean,
       feasibility_step_viable, and honest_verdict.

    Run: python3 -c "import json; d=json.load(open('results/experiment_1275_fsnet_feasibility_step_continuous_ebm.json')); print(d.get('honest_verdict'), d.get('feasibility_delta_overall'))"
