        addressed_by: "Moves from audit specification to an executor over exact authority rows and any receipt-backed transcripts from exp3179."
        retire_if_same_verdict: true
      - experiment_id: exp3167-clean-live-sota-verifier-rerun-v9
        verdict: "complete_gated_skip_preflight_failed: controlled_invariance_passed=false; flagged_adversarial=true"
        addressed_by: "Computes the controls independently before another clean verifier rerun can clear the adversarial flag."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .294 audited the needed controls but did not clear controlled invariance because the live SOTA rerun was gated. This task executes the controls with exact authority as the only acceptance source.

      EXISTING CODE TO READ FIRST
