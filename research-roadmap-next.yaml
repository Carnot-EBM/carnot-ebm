        verdict: "complete: paired local SOTA panel had 648 parser failures and zero-valued solve and verification cells."
        addressed_by: "The fixed parser is independently gated, semantic false accepts are forbidden, and this single remeasurement retires on the same collapse."
        retire_if_same_verdict: true
