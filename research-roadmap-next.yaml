        supervisor_receipt_schema_and_code_hashes:
          principle: "Exact schema and implementation identities prevent a test-only receipt path from posing as live."
        redirect_to_next_outcome_rows:
          principle: "Each firing must link to its next exact observed outcome without reassignment."
        no_firing_run_rows:
          principle: "An empty ledger is a valid measured state and must not force churn."
        curated_arm_support_rows:
          principle: "Selection changes require prospective support for existing human-curated arms."
        selection_policy_disposition:
          principle: "The record must say changed, unchanged, or future-arm-specification and why."
        no_solve_and_no_source_receipt:
          principle: "The task must prove that it read no game source, used no per-game adapter, and claimed no level solve."
        attack_matrix:
          principle: "Receipt, leakage, source, adapter, support, and off-path attacks test the generalization claim."
        arc_live_redirect_ledger_ready_score:
          principle: "One binary field records live receipt closure without requiring a manufactured policy change."
        per_unit_rows:
          principle: "Every run, firing, arm, and outcome disposition must remain recheckable."
        aggregate_row_recomputation:
          principle: "Fired, helped, unresolved, and unredirected totals must derive from rows."
        gate_check_summary:
          principle: "A blocked result must name the missing live path, receipt, or input check and observed value."
        preconditions_checked:
          principle: "Code, schema, artifact, registry, and resource receipts separate a block from no firings."
        protected_files_unchanged:
          principle: "The ARC task must preserve the active roadmap and conductor."
        inference_substrate:
          principle: "Receipt tracing and decision replay invoke no LLM and no offline solver."
        verifier_is_oracle:
          principle: "Supervisor outcomes are live observations, not an oracle-distinct EBM verifier."
        field_provenance:
          principle: "Every reachability and selection field must point to run rows, code hashes, and reducer logic."
        random_seed:
          principle: "A fixed audit and replay order makes receipt analysis repeatable."
        duration_s:
          principle: "Monotonic time exposes a task that skipped code tracing or receipt inspection."
        tests_run:
          principle: "Named ARC lint, unit, and E2E receipts show the shared live path was checked."
        reproducibility_checksum:
          principle: "A final hash protects the generalization determination trail."
      Set inference_substrate=live_arc_trajectory_supervisor_receipt_reachability_and_selection_replay_no_llm and verifier_is_oracle=false. Use verdict_class=positive only for a supported prospective selection improvement, null for a reachable path with no supported change, partial for narrow receipt coverage, blocked for missing live-path prerequisites, or disqualified for source access, a per-game fix, off-path work, leakage, or a solve claim.

