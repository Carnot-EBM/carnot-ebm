- id: exp7126-arc-loo-phase-receipt-forensics
  title: ARC leave-one-game-out phase and receipt forensics
  track: arc
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 30
  per_unit_rows: true
  milestone: 2026.09.626
  deliverable: results/experiment_7126_v626_arc_loo_phase_receipts.json
  prior_failures:
    - experiment_id: exp7099-adapter-withheld-live-path-preflight
      verdict: complete_null_adapter_withheld_live_path_not_ready_no_solve_claim
      addressed_by: "Exp7126 does not rerun generation; it reconstructs phase evidence and defines observable subprocess caps from existing receipts."
      retire_if_same_verdict: true
    - experiment_id: exp7113-arc-generation-liveness-recovery
      verdict: complete_blocked_arc_generation_liveness_precondition_failed
      addressed_by: "Exp7126 removes GPU readiness from the diagnostic scope and localizes the first absent start receipt without loading a model."
      retire_if_same_verdict: true
    - experiment_id: exp7123-adapter-withheld-arc-loo-shard-a
      verdict: "complete_partial: artifact_initialized_and_registry_rank_one_frozen"
      addressed_by: "Exp7126 changes the deliverable from a value cell to offline phase forensics with a fixed receipt schema and no solve claim."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7123 wrote its artifact and froze registry rank one, then consumed almost
    the full task window without starting either arm. The artifact has no phase
    timing, request, token, action, process, or stop-reason rows. Before another
    value run, V626 must identify the first missing receipt and define hard
    phase caps that can be audited. This is a diagnostic, not a preflight gate.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md ARC section
    - {project_root}/ops/status.md
    - {project_root}/ops/known-issues.md
    - {project_root}/ops/conductor-log.md
    - {project_root}/ops/arc_solve_registry.yaml
    - {project_root}/results/experiment_7099_v623_adapter_withheld_preflight.json
    - {project_root}/results/experiment_7113_v624_arc_generation_liveness.json
    - {project_root}/results/experiment_7123_v625_arc_loo_shard_a.json
    - {project_root}/python/carnot/experiment_7099_v623_adapter_withheld_preflight.py
    - {project_root}/python/carnot/experiment_7113_v624_arc_generation_liveness.py
    - {project_root}/python/carnot/agentic/arc_competition_agent.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/python/carnot/agentic/arc_live_runner_capability_lease.py
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Reconstruct the Exp7123 phase timeline from existing evidence. Identify the
    first phase with no start receipt. Define and validate a reusable receipt
    schema and fixed time budget for one future paired cell. Do not invoke a
    model, run an ARC game, or claim a level result.

    CONCRETE STEPS:
    0. Check that all named historical artifacts and logs are readable and the
       new artifact path is writable. On missing evidence, record the exact gap
       and continue if the remaining sources can bound it. Use blocked only
       when no defensible timeline can be built.
    1. Add REQ-REPORT-7126 and RED tests before implementation. Cover missing
       timestamps, contradictory clocks, absent start and end receipts,
       negative intervals, duplicate events, and fabricated phase completion.
    2. Parse the Exp7123 artifact, conductor rows, filesystem timestamps, and
       any existing process or raw-trace receipts independently. Preserve source
       paths, byte hashes, clock domains, and timestamp precision.
    3. Emit one row for artifact initialization, registry freeze, setup,
       model resolution, lease, server start, withheld arm, control arm,
       validation, and finalization. Use bounded intervals when exact times are
       unavailable. Never fill an absent timestamp with an estimate.
    4. Name the first phase whose required start receipt is absent. Separate
       missing evidence, observed stall, conductor timeout, and task exit.
    5. Define a thin phase receipt with phase, monotonic start and end,
       wall-clock start and end, deadline, subprocess PID, exit state,
       timeout state, and evidence hash. Validate it against synthetic attacks.
    6. Fix the future budget at setup <=5 minutes, withheld arm <=25 minutes,
       control arm <=25 minutes, and finalization <=5 minutes. Reserve the
       remaining task time for agent work and validation. These caps are a
       method contract, not evidence that Exp7123 used them.
    7. Set arc_phase_receipt_contract_ready_score=1 only when every phase has a
       required receipt schema, deadlines sum to 60 minutes or less, and the
       forensic rows recompute. A complete diagnosis may be positive even when
       the root interval remains bounded rather than exact.
    8. Run focused tests, artifact validation, adversarial verification, row
       consistency, scoped spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles for every field below;
       preconditions_checked; run_date; inference_substrate
       (aggregation_from_upstream_artifacts: offline ARC phase forensics);
       inference_substrate_class (aggregation or blocked_no_run);
       execution_venue (host); duration_s; source_artifact_hashes; rows;
       source_timeline_rows; phase_timing_rows; clock_domain_rows;
       missing_receipt_rows; contradiction_rows; first_absent_start_receipt;
       observed_stall_interval; phase_receipt_schema; phase_budget_rows;
       setup_cap_s (300); withheld_arm_cap_s (1500); control_arm_cap_s (1500);
       finalization_cap_s (300); value_measurement_run (false);
       solve_claim_made (false); arc_phase_receipt_contract_ready_score;
       random_seed; reproducibility_checksum; gate_check_summary with failed
       check, expected value, and observed value whenever honest_verdict starts
       blocked_; verifier_is_oracle (false); verdict_class (positive |
       circular_positive | null | blocked | disqualified | partial);
       honest_verdict consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7126_v626_arc_loo_phase_receipts.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
