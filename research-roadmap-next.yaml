tasks:
- id: exp6742-v588-handoff-contract-audit
  title: Activated V588 handoff and binding-contract audit
  track: infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.5
  requires_gpu: false
  max_turns: 20
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.08.588
  deliverable: results/experiment_6742_v588_handoff_contract_audit.json
  prompt: |
    CONTEXT:
    Milestone 2026.08.587 activated seven tasks although its design described thirteen, and the
    staged next-roadmap file was absent. Exp6729 therefore blocked the entire graph before science
    ran. HarnessLens (arXiv 2608.27311), ABE-Ralph (arXiv 2608.26753), and When "Must" Becomes
    "Maybe" (arXiv 2608.24569) motivate attributable checks and typed binding state. V588 was
    statically checked before handoff. This audit does not gate any science branch.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/research-roadmap.yaml
    - {project_root}/research-references.md, section V588 Planner Refresh - 2026-08-29
    - {project_root}/results/experiment_6729_v587_activation_evidence_contract.json
    - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/conductor_gates.py,
      {project_root}/scripts/exclusion_manifest_lint.py, and
      {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/conductor-log.md
    - Primary sources arXiv 2608.27311, 2608.26753, and 2608.24569.

    TASK:
    Build a row-level audit of the activated 13-task V588 manifest and design. Verify that binding
    conditions, exact authority, fallbacks, gate fields, prior-failure mechanics, model roles,
    deliverables, and claim boundaries survived the handoff. Diagnose mismatches without editing
    research-roadmap.yaml and without blocking unrelated experiments.

    CONCRETE STEPS:
    0. PRECONDITIONS: require the active roadmap, design, source refresh, schema, and exclusion
       manifest to exist and parse. If not, write the artifact atomically with
       complete_blocked_handoff_input, include the failed check and observed value in
       gate_check_summary, and stop. Do not fall back to an absent next-roadmap file.
    1. Confirm the relevant REQ-* anchors exist in
       openspec/capabilities/research-harnesses/spec.md and
       openspec/capabilities/research-reporting/spec.md before implementation. Add only a narrow
       missing requirement and focused test.
    2. Verify exactly 13 unique task IDs, 13 unique JSON deliverables, milestone 2026.08.588, four
       phases in the design, at least two infrastructure tasks, and an ungated Exp6754.
    3. Emit one binding_contract_rows row per task and gate with prerequisite, authority, fallback,
       execution consequence, blocked-artifact behavior, model role, claim boundary, and whether
       each item is operationally preserved rather than merely mentioned.
    4. Verify every gate upstream exists and the artifact field is spelled identically in the
       upstream REQUIRED ARTIFACT FIELDS. Do not normalize aliases.
    5. Verify every prompt contains CONTEXT, EXISTING CODE TO READ FIRST, TASK, CONCRETE STEPS,
       {project_root}, {date}, a Run command, and both final prohibitions. Verify every prompt
       declares verdict_class exactly as positive | circular_positive | null | blocked |
       disqualified | partial.
    6. Verify each recovery has all four prior-failure fields including
       retire_if_same_verdict: true; no task reuses a retired ID; all comparisons set
       per_unit_rows: true; and all LLM tasks name a mandated local GGUF.
    7. Run focused schema, gate-contract, exclusion-manifest, and prompt-contract checks. Do not run
       the known-red repository-wide suite as a precondition. The legacy
       audit_roadmap_gates.py currently hardcodes agent_type=codex to model=gpt-5.5. Record its
       model-only findings as a validator-compatibility row; validate the operator-requested
       gpt-5.6-sol formulaic routing against roadmap_schema.py and this manifest. Do not edit the
       audit tool in this experiment.
    8. REQUIRED ARTIFACT FIELDS: field_principles (explanatory entry for every required field,
       including itself), inference_substrate (exact static-audit path), duration_s (monotonic wall
       time), random_seed (explicit even when unused), reproducibility_checksum (canonical input
       hash), source_cutoff (2026-08-29), rows (one row per task and gate),
       binding_contract_rows (typed prerequisite, authority, fallback, and consequence),
       task_count (observed active count), handoff_contract_preserved (all-check boolean),
       science_branches_independent_of_handoff_audit (structural boolean),
       gate_check_summary (failed check and observed value for any blocked_* verdict),
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial),
       and honest_verdict (must start with complete:, complete_, success:, success_, passed:,
       passed_, shipped:, or shipped_; use complete_blocked_<reason> for task-owned blocks).
       Use activated_manifest_binding_contract_static_audit_no_llm as the substrate.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6742_v588_handoff_contract_audit.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6729-v587-activation-evidence-contract
      verdict: 'blocked_v587_activation_contract: one or more source, manifest, gate, prior, or model checks failed.'
      addressed_by: 'V588 is statically complete before handoff, audits only the activated manifest, preserves binding state as typed rows, and is removed from every science gate.'
      retire_if_same_verdict: true

- id: exp6743-task-owned-phase-accelerator-canary
  title: Task-owned phase clock and three-family accelerator canary
  track: infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 30
  estimated_wall_time_min: 60
  per_unit_rows: true
  milestone: 2026.08.588
  deliverable: results/experiment_6743_task_owned_phase_accelerator_canary.json
  prompt: |
    CONTEXT:
    The V587 retrospective found five 0.0-minute entries, including compute-bearing
    classifications, with no task-owned evidence showing whether a model loaded, decoded, or used
    an accelerator. This second infrastructure slot runs a tiny real canary on each mandated model
    and emits monotonic phase receipts. It does not compare model quality or speed, and no science
    branch depends on it.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/scripts/experiment_template.py and its cached_sota_pair() pattern
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/pipeline/gpu_monitor.py
    - {project_root}/python/carnot/pipeline/run_stop_authority.py
    - {project_root}/results/experiment_6634_mandated_model_admission.json
    - {project_root}/ops/status.md and {project_root}/ops/conductor-log.md

    TASK:
    Run a bounded sequential CUDA canary for all three mandated GGUF families. Prove cache identity,
    GPU offload, first-token reachability, teardown, and monotonic phase accounting with one raw row
    per model. Do not infer a model ranking from this tiny workload.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF: flagship MoE canary.
    - unsloth/gemma-4-31B-it-GGUF: flagship dense canary.
    - unsloth/gemma-4-26B-A4B-it-GGUF: middle MoE canary.
    Legacy Qwen3.5-0.8B or Gemma4-E4B may be labeled CPU smoke tests only. They cannot satisfy
    readiness, and a remote API cannot replace a missing local model.

    CONCRETE STEPS:
    0. PRECONDITIONS: require llama.cpp CUDA offload, exact cached paths for all MODEL_SPECS, and
       enough free VRAM for one model at a time. On failure write
       complete_blocked_accelerator_canary with gate_check_summary; do not use CPU or remote
       inference as headline evidence.
    1. Confirm or add a narrow REQ-* anchor in
       openspec/capabilities/research-harnesses/spec.md. Add focused tests for monotonic phase order,
       real elapsed time, and accelerator receipt integrity.
    2. Load models sequentially in fresh task-owned subprocesses. Use a fixed, checksum-recorded
       one-prompt decode with a small non-zero output budget. Release each model before the next.
    3. Emit phase markers for preflight, cache resolved, subprocess started, model loaded, first
       token, decode complete, teardown complete, and artifact write. Use monotonic timestamps.
    4. Record exact model ID, resolved-path hash, quantization/file identity, assigned device, GPU
       layers, peak VRAM, prompt/output tokens, stop reason, and raw-output hash. Capture NVML or
       nvidia-smi evidence before, during, and after decode.
    5. Set accelerator_receipt_ready only when every model reaches first token on CUDA and teardown
       leaves no owned process. This is not a downstream gate.
    6. Run focused tests, lint, spec coverage, and adversarial verification.
    7. REQUIRED ARTIFACT FIELDS: field_principles (entry for every required field),
       inference_substrate (local llama.cpp CUDA GGUF), duration_s (monotonic wall time),
       random_seed (fixed decode seed), reproducibility_checksum (config and row hash),
       models_used (exact hub IDs), live_model_invoked (true only after real decode),
       rows (one row per model), task_phase_rows (all phases), phase_clock_monotonic (row-derived
       boolean), gpu_receipts (before/during/after evidence), accelerator_receipt_ready
       (all-three-model activity result), claim_boundary (no quality or speed comparison),
       gate_check_summary (failed check and observed value for blocked_*),
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial),
       and honest_verdict (allowed complete/success/passed/shipped prefix; use
       complete_blocked_<reason> for task-owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6743_task_owned_phase_accelerator_canary.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6634-mandated-model-admission
      verdict: blocked_gate_check_failed
      addressed_by: 'The canary removes the retired scheduler dependency, owns sequential leases and teardown, and emits first-token plus monotonic phase evidence instead of a gate-only admission artifact.'
      retire_if_same_verdict: true

- id: exp6744-hardness-controlled-certificate-stream
  title: Hardness-controlled exact certificate stream with relabel pairs
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 90
  per_unit_rows: true
  milestone: 2026.08.588
  deliverable: results/experiment_6744_hardness_controlled_certificate_stream.json
  prompt: |
    CONTEXT:
    Exp6733 never tested its stream because it was gated on the failed V587 activation task.
    Solver-Hard Is Not Model-Hard (arXiv 2607.17047) shows that solver conflicts and density do not
    measure model difficulty, and proof-preserving relabeling can expose surface sensitivity. V588
    makes the exact stream an independent science root.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
    - {project_root}/openspec/capabilities/energy-verification/spec.md
    - {project_root}/scripts/experiments/experiment_6733_hardness_controlled_certificate_stream.py
      if present, and {project_root}/results/experiment_6733_hardness_controlled_certificate_stream.json
    - {project_root}/scripts/experiments/experiment_6678_constraint_family_stream.py
    - {project_root}/python/carnot/verify/ and existing SAT/certificate helpers
    - {project_root}/research-references.md, V588 entry for arXiv 2607.17047

    TASK:
    Generate and independently verify a frozen 72-instance SAT/UNSAT certificate stream with
    proof-preserving relabel pairs, family-disjoint splits, and solver-work metadata that is never
    promoted into a model-hardness or answer label.

    CONCRETE STEPS:
    0. PRECONDITIONS: require two independent exact checking paths or one solver plus a separate
       certificate checker, deterministic seeds, and a writable task result path. If unavailable,
       emit complete_blocked_exact_checker with gate_check_summary.
    1. Confirm or add a narrow REQ-* anchor in
       openspec/capabilities/verifiable-reasoning/spec.md before code. Add generator, certificate,
       relabel-invariance, split-isolation, and replay tests under tests/python/.
    2. Generate exactly 72 instances across expander-Tseitin, ladder-Tseitin, and
       pigeonhole-anchor families, fixed size bins, SAT/UNSAT labels, and at least three seeds.
       Pre-register counts before solving.
    3. Create a proof-preserving symbol relabel for each pair. Verify label, certificate, clause
       multiset, and graph invariants after relabeling.
    4. Emit satisfying assignments for SAT rows and independently checkable UNSAT evidence for
       UNSAT rows. Record checker identities, versions, exit codes, and hashes.
    5. Freeze family-disjoint train/dev/test splits. Record conflicts, decisions, propagations, and
       wall time only as solver-work metadata. Do not derive the label or a model-hard field from
       those counters.
    6. Set hardness_stream_ready true only when all 72 rows, certificates, relabel pairs, and
       split-leak checks pass. This is the exact downstream gate.
    7. Run focused tests, lint, spec coverage, row-consistency lint, and adversarial verification.
    8. REQUIRED ARTIFACT FIELDS: field_principles (entry for every field and future gate),
       inference_substrate (exact CPU generator/checker), duration_s (monotonic), random_seed (all
       seeds), reproducibility_checksum (canonical stream hash), rows (one row per instance and
       relabel mate), family_counts (pre-registered counts), split_manifest (family-disjoint
       assignments), certificate_checker_receipts (independent evidence), relabel_pair_receipts
       (invariance checks), solver_work_metadata (non-label diagnostics),
       hardness_stream_ready (all-row exact readiness gate), gate_check_summary (failed check and
       observed value for blocked_*),
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial),
       and honest_verdict (allowed terminal prefix;
       complete_blocked_<reason> for owned blocks). Use
       deterministic_cpu_exact_certificate_generation_and_independent_checking as substrate.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6744_hardness_controlled_certificate_stream.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6733-hardness-controlled-certificate-stream
      verdict: blocked_gate_check_failed
      addressed_by: 'The stream is now an independent root with task-owned exact generators and checkers; it no longer depends on a global activation artifact.'
      retire_if_same_verdict: true

- id: exp6745-sota-dual-encoding-proposal-corpus
  title: Three-model SOTA dual-encoding proof-carrying corpus
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 480
  per_unit_rows: true
  milestone: 2026.08.588
  deliverable: results/experiment_6745_sota_dual_encoding_proposal_corpus.json
  prompt: |
    CONTEXT:
    The existing direct certificate corpus has only 8/48 exact successes. Exp6734 was preempted,
    so no all-three-model dual-encoding corpus exists. SymDiag (arXiv 2608.08786) motivates two
    independent encodings that distinguish translation disagreement from reasoning error. This
    task values attributable complete rows over a flattering accuracy gate.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/scripts/experiment_template.py and cached_sota_pair()
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/results/experiment_6744_hardness_controlled_certificate_stream.json
    - {project_root}/scripts/experiments/experiment_6649_exact_certificate_proposal_corpus.py
    - {project_root}/results/experiment_6649_exact_certificate_proposal_corpus.json
    - {project_root}/python/carnot/verify/ and the two candidate encoder modules
    - {project_root}/research-references.md, V588 entry for arXiv 2608.08786

    TASK:
    Run all three mandated local GGUF families on the frozen exact stream, retain every attempt,
    encode each parseable certificate through two independent implementations, exact-check it, and
    emit a closed diagnostic taxonomy without using model self-judgment as authority.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF: flagship MoE headline arm.
    - unsloth/gemma-4-31B-it-GGUF: flagship dense headline arm.
    - unsloth/gemma-4-26B-A4B-it-GGUF: middle MoE headline arm.
    Legacy small models may run a separately labeled CPU smoke row only. They cannot satisfy the
    corpus gate or enter headline aggregates.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6744 and hardness_stream_ready == true, exact cached paths for all
       MODEL_SPECS, llama.cpp CUDA offload, and enough free VRAM for sequential loads. On failure,
       emit complete_blocked_proposal_corpus with gate_check_summary; do not substitute remote or
       small models.
    1. Confirm or add a narrow REQ-* anchor in
       openspec/capabilities/verifiable-reasoning/spec.md. Add focused tests for DSL parsing,
       independent encoder disagreement, exact checking, timeout retention, and row completeness.
    2. Freeze one prompt, decoding configuration, token cap, stop contract, and stream checksum
       before inference. Run each model sequentially on every eligible row with fixed seeds.
    3. Store raw output hash, parser status, timeout/stop reason, tokens, latency, and abstention.
       Never drop malformed, failed, or timed-out rows.
    4. Pass each parseable proposal through two separately implemented encoders. Compare normalized
       constraints, not serialized strings. Exact-check both encodings.
    5. Assign exactly one diagnosis per row from exact_valid, malformed_certificate,
       translation_disagreement, reasoning_error, or abstention. If exact authority is unavailable,
       the row is blocked, not guessed.
    6. Set dual_encoding_corpus_ready true only when every planned model-instance row exists,
       attribution and budgets are present, and both encoders/checker paths were attempted where
       applicable. Accuracy is not the readiness threshold.
    7. Run focused tests, lint, spec coverage, row-consistency lint, and adversarial verification.
    8. REQUIRED ARTIFACT FIELDS: field_principles (entry for every field and downstream gate),
       inference_substrate (local llama.cpp CUDA GGUF), duration_s (monotonic wall time),
       random_seed (decode seeds), reproducibility_checksum (prompt/config/stream/rows hash),
       models_used (exact IDs and roles), live_model_invoked (real inference boolean),
       gpu_receipts (per-load CUDA evidence), planned_row_count (frozen denominator),
       rows (every model-instance attempt), diagnosis_counts (row-derived taxonomy),
       encoder_agreement_matrix (two-encoder outcomes), exact_success_by_model (row-derived),
       dual_encoding_corpus_ready (complete attributable corpus gate),
       gate_check_summary (failed check and observed value for blocked_*),
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial),
       and honest_verdict (allowed terminal prefix; complete_blocked_<reason> for owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6745_sota_dual_encoding_proposal_corpus.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  gated_on:
    - upstream: exp6744-hardness-controlled-certificate-stream
      artifact_field: hardness_stream_ready
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp6718-sota-planning-proposal-bank
      verdict: blocked_gate_check_failed
      addressed_by: 'The corpus consumes a completed task-owned exact stream, uses proof-carrying rows rather than the retired planning chain, and defines readiness by attributable completion rather than accuracy.'
      retire_if_same_verdict: true

- id: exp6746-oracle-distinct-diagnostic-energy
  title: Held-family oracle-distinct dual-encoding diagnostic energy
  track: energy-verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.08.588
  deliverable: results/experiment_6746_oracle_distinct_diagnostic_energy.json
  prompt: |
    CONTEXT:
    Exp6735 only wrote a missing-upstream gate artifact. V588 now has a frozen exact corpus with
    two independent symbolic views and closed failure diagnoses. The learned energy may diagnose or
    prioritize, but it cannot certify. Current-row exact outcomes, labels, answer keys, solver work,
    certificate validity, and proxies derived from them are prohibited model inputs.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/openspec/capabilities/energy-verification/spec.md
    - {project_root}/results/experiment_6745_sota_dual_encoding_proposal_corpus.json
    - {project_root}/scripts/experiments/experiment_6705_structural_plan_energy.py
    - {project_root}/results/experiment_6705_structural_plan_energy.json
    - {project_root}/python/carnot/verify/constraint.py and structural feature helpers
    - {project_root}/scripts/verdict_row_consistency_lint.py and
      {project_root}/scripts/adversarial_verify.py

    TASK:
    Compare a dual-encoding structural diagnostic energy with single-encoding and scalar-failure
    controls on family-held-out and relabel tests. Measure reasoning-error discrimination and
    localization without current-row oracle leakage.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6745 and dual_encoding_corpus_ready == true, immutable family
       splits, at least two outcome classes per evaluable held family, and enough rows for a
       pre-registered bootstrap. If not, emit complete_blocked_diagnostic_energy with
       gate_check_summary.
    1. Confirm or add a narrow REQ-* anchor in
       openspec/capabilities/energy-verification/spec.md. Add tests for feature denylists,
       family-disjoint splits, relabel pairing, and metric recomputation.
    2. Freeze the feature schema before labels are joined. Allow only pre-oracle syntax, topology,
       encoder structure, local inconsistency descriptors, and model-independent format features.
    3. Build an explicit denylist and taint audit for exact outcomes, diagnoses, answers, solver
       counters, validity bits, and deterministic proxies. Any leak disqualifies positive credit.
    4. Train identical-capacity dual-encoding, encoder-A-only, encoder-B-only, and
       undifferentiated-scalar baselines on allowed training families with fixed seeds and budgets.
    5. Evaluate on held families and relabel mates. Emit row-level energy, prediction, target,
       localization, and paired relabel consistency for every arm.
    6. Report AUROC, AUPRC, calibration, localization accuracy, bootstrap intervals, and paired
       deltas. Set heldout_reasoning_error_auroc from raw held rows.
    7. Set oracle_leakage_detected true on any denylist, split, taint, or proxy failure. Set
       diagnostic_energy_ready true only when all arms and audits complete; readiness does not mean
       positive science.
    8. Run focused tests, lint, spec coverage, row-consistency lint, and adversarial verification.
    9. REQUIRED ARTIFACT FIELDS: field_principles (entry for every field and gate),
       inference_substrate (local CPU structural-energy training/evaluation), duration_s
       (monotonic), random_seed (all split/train/bootstrap seeds), reproducibility_checksum
       (feature/split/config/row hash), verifier_is_oracle (false), feature_schema (allowed inputs),
       oracle_feature_denylist (prohibited inputs), rows (unit-arm predictions),
       heldout_metrics_by_family (row-derived), paired_relabel_metrics (row-derived),
       heldout_reasoning_error_auroc (exact downstream threshold field),
       oracle_leakage_detected (exact downstream boolean field),
       diagnostic_energy_ready (completion boolean), gate_check_summary (failed check and observed
       value for blocked_*),
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial),
       and honest_verdict (allowed terminal prefix;
       complete_blocked_<reason> for owned blocks).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6746_oracle_distinct_diagnostic_energy.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  gated_on:
    - upstream: exp6745-sota-dual-encoding-proposal-corpus
      artifact_field: dual_encoding_corpus_ready
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp6735-oracle-distinct-diagnostic-energy
      verdict: blocked_gate_check_failed
      addressed_by: 'The new task has a present dual-encoding corpus, family-disjoint rows, and an explicit pre-oracle feature denylist instead of reading a missing proposal artifact.'
      retire_if_same_verdict: true

