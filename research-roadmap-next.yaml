    gated_on:
      - upstream: exp1588-nsvif-dsl
        artifact_field: dsl_compiled
        op: '=='
        value: true
    prompt: |
      CONTEXT: Testing the DSL against live SOTA models.
      EXISTING CODE TO READ FIRST: python/carnot/verifiers/dsl.py
      TASK: Evaluate zero-false-accept behavior using mandated local SOTA models. Use MODEL_SPECS: ["unsloth/Qwen3.6-35B-A3B-GGUF", "unsloth/gemma-4-31B-it-GGUF"].
      CONCRETE STEPS:
      1. Load compiled DSL constraints.
      2. Execute 10 generation trials per model.
      3. Save structured artifact to results/experiment_1589_dsl_sota.json.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

