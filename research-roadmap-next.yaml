        verdict: "complete: bounded prefix-closed deterministic verifier pilot ready; no live LLM correctness claim beyond explored frontier"
        addressed_by: "This task adds structured taxonomy families, exact final authority, and reward-budget fields for downstream local SOTA decoding."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      On {date}, .494 produced clean structured row-level verification, but it remained mostly post-hoc. V495 starts by building deterministic verifier potentials that can score partial prefixes while exact solvers retain final authority. This task must not invoke a live LLM; it prepares the fixture and accounting needed by the gated SOTA decoding pilot.

      EXISTING CODE TO READ FIRST:
