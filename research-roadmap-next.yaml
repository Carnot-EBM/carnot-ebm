  - id: exp4126-lr-resume-correctness-fix
    milestone: 2026.06.382
    title: "RESUME-CORRECTNESS FIX (THE headline; the prerequisite for effective accumulation). DIAGNOSE + FIX the LR-scheduler re-warm found in .381 (train/lr resets to 2.45e-6 each pass instead of continuing the global schedule). Inspect nano-trm's scheduler config + train.py resume path; make the schedule CONTINUE across resume; VALIDATE by reading a fresh resumed pass's metrics CSV and confirming train/lr does NOT reset to the warmup value."
    priority: critical
    track: trm-baseline
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-13 operator directive: fix the LR-scheduler-resume bug diagnosed in .381 — false-positive scope-match vs the .381 resume passes (exp4116/4117/4118); forward difference = this DIAGNOSES + FIXES the re-warm root cause (LR resets each pass) rather than running more blind passes."
    inference_substrate: gpu_nanotrm_native_training
    deliverable: results/experiment_4126_lr_resume_correctness_fix.json
    prompt: |
      CONTEXT: .381 evidence (from the metrics CSVs at results/trm_runs/experiment_411[678]_*_hydra/
      csv/version_*/metrics.csv): train/lr = first 2.45e-6 -> max 4.95e-6 -> last 4.95e-6, IDENTICAL
      across pass1/pass2/pass3, while `epoch` continues 4049->4099->4149->... So `ckpt_path` resume
      restores the optimizer/epoch but the LR scheduler RESTARTS its warmup each pass. This starves
      training; the model never follows the intended decay schedule. Fix it.

      CONCRETE STEPS:
        0. PRECONDITIONS: `command -v uv`; `ls nano-trm/src/nn/train.py`; CUDA available; the stable checkpoint `results/trm_runs/sudoku_extreme_baseline/last.ckpt` exists. Else -> `blocked_<resource>`.
        1. DIAGNOSE: read nano-trm/src/nn/train.py (how the LightningModule builds optimizer + lr_scheduler, and whether the scheduler is `interval: step` global-step-based or restarts) and src/nn/configs/model/trm.yaml + the trm_sudoku_extreme experiment config (scheduler type, warmup, peak LR, total horizon). Confirm WHY the LR re-warms on `ckpt_path` resume (scheduler state not in the checkpoint / scheduler re-instantiated fresh / warmup defined over local not global steps).
        2. FIX: make the schedule CONTINUE across resume. Likely fixes (pick what the code needs): ensure the lr_scheduler is returned in `configure_optimizers` so Lightning saves+restores its state in the checkpoint; make warmup/decay a function of GLOBAL step (trainer.global_step) not per-fit local step; or persist+restore the scheduler's last_epoch. Keep the change minimal + local to nano-trm.
        3. VALIDATE (the gate): run ONE bounded (<=60 min, trainer.max_time) resumed pass from the stable checkpoint, then READ the new pass's metrics CSV: confirm train/lr at the START of the pass is NOT the 2.45e-6 fresh-warmup value but CONTINUES the prior schedule (monotonic, not reset). Report the observed first-LR of the validation pass vs the prior pass's last-LR.
        4. If the re-warm cannot be fixed cleanly (scheduler architecture forbids it), report that + recommend the CONTIGUOUS alternative (a monitored detached run outside the 80-min cap, OR a shorter-horizon config) as the .383 path. Do NOT force a broken fix.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An honest 'cannot fix bounded-resume -> contiguous run needed' is a COMPLETE verdict."
        lr_rewarm_root_cause:
          principle: "The diagnosed reason the LR resets on resume (scheduler-not-restored / local-step-warmup / etc.); the audit trail for the fix."
        lr_continuous_across_resume:
          principle: "Bare bool: after the fix, does a resumed pass CONTINUE the schedule (start-LR != fresh-warmup value)? THE gate -- the prerequisite for exp4127's accumulation to work."
        validation_first_lr:
          principle: "The observed train/lr at the start of the validation pass; compared to the prior pass's last-LR proves continuation (not re-warm)."
        val_exact_accuracy:
          principle: "Val after the validation pass; should improve faster than .381's +1pp/pass if the schedule now continues."
        stable_checkpoint_path:
          principle: "The path exp4127 resumes from with the corrected schedule."
        duration_s:
          principle: "Bounded GPU run < 4800s (stopped before the cap)."
      ACCEPTANCE GATE:
        - condition: "lr_continuous_across_resume == True (validation pass start-LR continues the schedule, NOT a 2.45e-6 reset) OR an honest 'bounded-resume unfixable, contiguous run recommended' verdict with the root cause"
          principle: "Either the LR-resume is fixed (resume now accumulates correctly) or we have a diagnosed reason it cannot be and a concrete alternative -- both unblock the baseline; running more re-warming passes is the anti-pattern this task ends."

