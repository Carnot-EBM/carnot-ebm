  prompt: |
    CONTEXT:
    V590 has three independent science branches: exact proof generation and claim-localized repair;
    prospective procedural continuous memory; and live ARC supervisor and selfparse adoption
    evidence. The milestone is complete when every task is terminal, not when every branch is
    positive. This ungated capstone must preserve blocked, null, circular, partial, and disqualified
    evidence and update the three PRD gaps without pooling unrelated metrics.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md, {project_root}/_bmad/prd.md, and
      {project_root}/_bmad/architecture.md
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
    - Every available V590 artifact from Exp6768 through Exp6779, including blocked artifacts
    - {project_root}/results/experiment_6767_v589_branch_disposition.json
    - {project_root}/ops/status.md, {project_root}/ops/changelog.md,
      {project_root}/ops/conductor-log.md, and {project_root}/research-complete.yaml
    - {project_root}/scripts/summarize_artifact.py, {project_root}/scripts/adversarial_verify.py,
      {project_root}/scripts/verdict_row_consistency_lint.py,
      {project_root}/scripts/recurring_blocker_ledger.py, and
      {project_root}/ops/e2e-test-plan.md

    TASK:
    Produce the terminal V590 branch disposition. Recompute every comparative headline from rows,
    preserve blocks and circularity, classify the three PRD gaps, record retirements, and reconcile
    evidence documents. Do not fill missing evidence with narrative success and do not activate a
    successor roadmap.

    CONCRETE STEPS:
    0. PRECONDITIONS: inspect research-roadmap-next.yaml and list all 13 expected task IDs and
       deliverables. Missing or nonterminal artifacts become explicit partial or blocked rows; they
       do not block this capstone. Write the capstone artifact atomically before doc reconciliation.
    1. Confirm the relevant research-reporting REQ-* anchors. Add only narrow missing capstone
       coverage. Write branch-classification and row-recomputation tests first.
    2. Run summarize_artifact.py on every available V590 artifact. Record missing files, gates,
       verdict classes, durations, substrates, model IDs, and raw-row availability.
    3. Independently recompute proof exact-valid deltas, repair paired intervals and harmful flips,
       CSL order-level intervals, historical loss and transaction activity, ARC actions-to-progress
       effects, supervisor evidence, tool-gap transport, and adoption decisions.
    4. Run adversarial verification and verdict-row consistency lint on every artifact. Preserve all
       CRITICAL, WARNING, circular, no-headroom, stale-stamp, missing-field, and missing-row findings.
    5. Emit one rows entry per experiment and one branch_rows entry per proof, continuous-memory,
       ARC, and execution-contract branch. Do not average or vote across branches.
    6. Classify the three roadmap gaps as narrowed, unchanged, widened, or blocked with direct
       artifact and row citations. FR11 is positive only if the cold audit passes activity,
       retention, support, hard-case, poison, restart, and rollback gates. ARC adoption is positive
       only from the cold actions-to-progress audit, not transport.
    7. Reconcile research-complete.yaml, _bmad/traceability.md, ops/status.md, and ops/changelog.md
       with terminal evidence only. Do not modify or activate research-roadmap.yaml and do not write
       a successor roadmap.
    8. Write explicit branch disposition and next_action values. Any repeated verdict carrying
       retire_if_same_verdict=true must be named for exclusion-manifest retirement.
    9. Run focused tests, lint, spec coverage, adversarial verification, row consistency, recurring
       blocker ledger, determination-preservation lint, and applicable documentation E2E checks.
    10. REQUIRED ARTIFACT FIELDS: field_principles (one-line purpose for every required field);
        inference_substrate (cold local artifact, row, and ledger synthesis); duration_s (monotonic
        task wall time); random_seed (fixed synthesis reducer seed); reproducibility_checksum (hash
        of roadmap, sources, code, and rows); milestone (must be 2026.08.590); expected_task_ids
        (all 13 roadmap IDs); available_artifacts (found terminal files); missing_artifacts (missing
        or nonterminal files); rows (one per experiment); branch_rows (one per independent branch);
        row_recomputed_headlines (cold comparative values); adversarial_findings (artifact audit
        output); verdict_row_consistency_findings (headline versus row checks); recurring_blockers
        (ledger matches); prior_verdict_recurrences (same-verdict matches); retirement_recommendations
        (mechanical exclusions to apply); prd_gap_disposition (all three ranked gaps);
        fr12_disposition (proof generation and repair); fr11_disposition (prospective continuous
        learning); arc_disposition (supervisor, tool-gap, and selfparse adoption);
        hardware_disposition (CUDA receipts and no physical TSU claim); docs_reconciled (files
        updated from terminal evidence); protected_files_unchanged (must include
        scripts/research_conductor.py and research-roadmap.yaml); gate_check_summary (failed check
        and observed value for any blocked_* verdict); verifier_is_oracle (false because synthesis
        is not a verifier); verdict_class (closed enum: positive | circular_positive | null |
        blocked | disqualified | partial); and honest_verdict (terminal result; MUST start with
        complete: / complete_ / success: / success_ / passed: / passed_ / shipped: / shipped_;
        complete_partial is expected if any branch lacks evidence).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6780_v590_branch_disposition.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6767-v589-branch-disposition
      verdict: 'complete_partial: V589 preserved narrowed proof transport, blocked repair, blocked continuous memory, blocked ARC quality, circular simulator portability, and no pooled success claim.'
      addressed_by: 'V590 expands the proof panel before decoding, repairs the memory lease and model_specs contract before the prospective A/B, and executes the mandatory supervisor-to-tool-gap-to-actions-to-progress chain before this fresh capstone.'
      retire_if_same_verdict: true
