      CONCRETE STEPS
      0. Replay the structured gate. Check all model files, embedded tokenizers, CUDA devices, VRAM, RAM, disk, timeouts, seeds, fixture hashes, budgets, fallback hashes, and protected hashes in preconditions_checked.
