      - formal_fallback_preserved: bool (principle: LLM guidance must not replace solver authority)
      - guided_success_count: int (principle: LLM guidance benefit must be counted)
      - solver_only_success_count: int (principle: baseline fallback must be counted)
      - unresolved_count: int (principle: uncertainty must remain visible)
      - invalid_llm_proposal_count: int (principle: proposal failures must be visible)
      - models_used: list (principle: mandated GGUF use must be auditable)
      - model_specs: list (principle: live LLM evidence must name exact model IDs and cache/runtime paths)
      - legacy_smoke_only_used: bool (principle: tiny models cannot become headline evidence)
      - exact_solver_path: str (principle: authority implementation must be explicit)
      - prompt_hashes: list (principle: inputs must be auditable without embedding full prompts)
      - inference_substrate: dict (principle: hybrid LLM/solver work must declare both substrates)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

