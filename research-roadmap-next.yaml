      research-program.md), validating the persisted structure survives a session boundary and still prevents
      collapse. Keep pass_rate vs true_accuracy element-wise distinct (de-flag tautology).
      EXISTING CODE TO READ FIRST: results/experiment_3685 (FR-11 v11) and results/experiment_3673 (v10) and
      results/experiment_3667 (the dependency-aware structure) via scripts/summarize_artifact.py; the FR-11 module +
      cached traces.
      PRECONDITIONS (step 0): FR-11 module + cached traces (per-verifier votes + labels) present, with >=2
      distributionally-distinct slices to simulate recoverable AND non-recoverable drift. If not -> "complete:
      blocked_fr11_module_or_traces_unavailable".
      INFERENCE-SUBSTRATE HYGIENE: verifier_ensemble_against_cached_candidates; NO GGUF/CUDA marker; adversarial_verify clean.
      CONCRETE STEPS:
        1. Run the closed FR-11 loop to N>=200 across a drifting trace stream with BOTH a recoverable drift (re-estimate)
           and a transient/non-recoverable drift (should trigger RESET). Deploy arm = drift-detect + window-gated
           reset-to-last-known-good + conservative-default; control arm = v11 continuous re-estimation (no reset).
        2. Persist the learned structure to disk; reload it in a fresh "session" (new process/state) and confirm it
           restores correctly (SHA256 round-trip) and still prevents collapse.
        3. Measure ensemble AUROC through both drift events in each arm; whether the reset policy preserves quality
           through transient drift better than v11's continuous chase, and whether persistence survives the session.
        4. Confirm: deploy arm detects drift, resets on transient drift, persists+restores, prevents collapse;
           control degrades on transient drift OR fails to persist; distinct-arrays assert holds.
      ANTI-POISON TEST DISCIPLINE (MANDATORY): parametrize any pytest over the honest outcomes
      (reset_and_persist_succeed_no_collapse / no_gain_over_v11 / blocked) on synthetic fixtures; NEVER hard-assert
      one success string against real traces; never use Q/R/H-number placeholder tokens. Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; store the bare VALUE):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores cached traces; no LLM load; no compute-bound marker)."
        n_online_updates:
          principle: "Sample-size of the self-learning sweep (>=200)."
        drift_detected_deploy_arm:
          principle: "The deploy arm must detect both injected drifts."
        reset_triggered_on_transient_drift:
          principle: "The v12 forward difference -- the reset policy must fire on the non-recoverable/transient drift."
        structure_persisted_and_restored:
          principle: "Cross-session Tier-2 persistence -- the learned structure survives a session boundary (SHA256 round-trip)."
        collapse_detected_deploy_arm:
          principle: "The conservative-default rule must prevent weight collapse (alpha_t grounding)."
        post_transient_drift_quality_gain_over_v11:
          principle: "The forward difference -- does reset-on-transient beat v11's continuous chase through transient drift?"
        pass_rate_vs_true_accuracy_distinct_assert:
          principle: "De-flags the tautology where pass_rate and true_accuracy are the same array."
        quality_maintained:
          principle: "Reset + persistence + collapse-prevention must not cost ensemble quality."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection (of the artifact, vs the corpus drift it measures)."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "drift_detected_deploy_arm == true AND reset_triggered_on_transient_drift == true AND structure_persisted_and_restored == true AND collapse_detected_deploy_arm == false AND pass_rate_vs_true_accuracy_distinct_assert == true"
          principle: "Drift-reset self-learning is validated only when the deploy arm detects drift, resets on transient drift, persists+restores across a session, does not collapse, and the two metrics are genuinely distinct (not a tautology)."
      TERMINAL VERDICTS: "complete: fr11_v12_drift_reset_and_cross_session_persistence_no_collapse_quality_maintained" /
      "complete: fr11_v12_no_gain_over_v11_continuous_reestimation_sufficient" /
      "complete: blocked_fr11_module_or_traces_unavailable"
