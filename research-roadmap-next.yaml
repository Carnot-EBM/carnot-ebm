           b. `ls nano-trm/src/arc_evaluator.py scripts/experiments/trm_arc_eval_harness.py` returns both (the TRM substrate is present). NOTE: nano-trm is NOT pip-installed and `import nano_trm` does NOT exist — modules live under `nano-trm/src/` (import via `sys.path.insert(0,'nano-trm/src')`).
