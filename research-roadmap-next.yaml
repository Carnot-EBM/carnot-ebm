        retire_if_same_verdict: true
    prompt: |
      CONTEXT: In .410, exp4433 transferred ka59's grounded win-rule (count_4==32) and other solved-game
      win-rules as few-shot examples to a Qwen3.5-9B-MTP induction that PROPOSED is_win() for held-out
      g50t; the verifier GROUNDED it (player.x==target.x+1 and player.y==target.y+1), the OfflineSolver
      drove it, and arc_solver_kit.reproduce REPRODUCED g50t L1 (offline_reproduced=true) -- the FIRST
      example-corpus generic-transfer solve. BUT the artifact wrote inference_substrate=None, so
      adversarial_verify applied the strict 60s live-model floor to the 0.75s deterministic run and
      flagged it DURATION_TOO_SHORT -> the level was NOT banked. The solve is real; the artifact was
      mis-declared. .411 BANKS it cleanly.
      EXISTING CODE TO READ FIRST: results/experiment_4433_example_conditioned_win_induction.json (the
      quarantined solve -- the grounded predicate, the 17-action solution, the object-centric digest),
