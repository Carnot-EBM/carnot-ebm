    8. REQUIRED ARTIFACT FIELDS: field_principles for every field below;
       preconditions_checked; run_date; inference_substrate
       (aggregation_from_external_primary_sources: V629 source and cache delta);
       inference_substrate_class (aggregation or blocked_no_run);
       execution_venue (host); duration_s; source_artifact_hashes; rows;
       arxiv_rows; openreview_rows; semantic_scholar_rows; huggingface_rows;
       github_rows; extropic_rows; logical_intelligence_rows;
       source_class_rows; model_repository_rows; cached_model_rows;
       task_method_map_rows; deferred_rows;
       source_pages_are_execution_oracles (false); reference_append_marker;
       v629_source_delta_complete_score; random_seed; reproducibility_checksum;
