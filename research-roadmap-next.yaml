      - experiment_id: exp2952
        verdict: "complete: taxonomy-guided repair delta passed; pass@1_delta=0.25, syntax_failure_rate_delta=-0.0625, false_accept_delta=-0.125"
        addressed_by: "The small-N flagged repair result is converted into a pre-registered replication protocol requiring n_tasks>=20 and false-accept audit fields."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Run from {project_root} on {date}. .278 showed a positive but flagged
        code repair delta. The next step is not another ad hoc prompt; it is a
        DCCD-style protocol that separates semantic draft generation from
        constrained repair and deterministic acceptance.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (SOTA Local Models; Failed-Experiment Rerun Discipline)
        - CODEX.md
        - research-references.md (2026-05-24 Post-.278 DCCD / BEAVER / llguidance entries)
        - scripts/experiment_template.py (cached_sota_pair docstring)
        - results/experiment_2950_code_taxonomy_repair_prompt_manifest_v1.json
        - results/experiment_2951_structured_candidate_manifest_adapter_v1.json
        - results/experiment_2952_sota_taxonomy_guided_code_repair_eval_v1.json
        - results/experiment_2953_code_verifier_threshold_policy_v1.json

      TASK:
        Build a pre-registered DCCD structured-repair protocol and manifest for
        the downstream live SOTA replication. This task prepares the evaluation
        and may not claim pass-rate improvement.

      CONCRETE STEPS:
        0. PRECONDITIONS: .278 artifacts exp2950, exp2951, exp2952, and exp2953
           exist and are readable.
        1. Extract the .278 failure taxonomy, candidate schema, threshold policy,
           and known false-accept constraints.
        2. Define a DCCD flow: unconstrained draft, taxonomy-conditioned repair,
           constrained manifest emission, parser/static/test checks, verifier
           threshold check, and false-accept audit.
        3. Define the downstream replication cohort with n_tasks>=20 and fixed
           seeds; explicitly separate pass@1/pass@k, syntax/schema failures,
           test failures, and verifier-only accepts.
        4. Record local structured-output backends to check downstream:
           llguidance, llama.cpp grammar, and JSON schema validation fallback.
        5. Include MODEL_SPECS for downstream live use:
           - unsloth/Qwen3.6-35B-A3B-GGUF
           - unsloth/gemma-4-31B-it-GGUF
           - unsloth/gemma-4-26B-A4B-it-GGUF
           Legacy small models may appear only as CPU smoke tests.
        6. Write the manifest artifact.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        dccd_repair_protocol_ready: bool
        source_artifacts: list
        model_specs: list
        legacy_models_only_for_smoke: bool
        n_tasks_planned_min: int
        fixed_seed_plan: list
        dccd_steps: list
