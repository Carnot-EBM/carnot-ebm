    prompt: |
      CONTEXT: exp3505 (.322->.323) produced P0.1's FIRST CLEAN POSITIVE: on the VALIDATED
      Sudoku-Ising encoding (E==0), real combinatorial optimizers solve at solve_rate=1.0
      (discrete_sa_single, discrete_sa_restarts20, exact_cp all 1.0) while the autoregressive
