milestone: 2026.06.411
milestone_title: >-
  CONTINUE CLOSING THE GENERIC-SOLVER GAP using the example corpus as a self-learning library. .410
  proved the example corpus enables PARTIAL generic transfer -- a LEAVE-ONE-OUT benchmark re-solved
  2/7 already-solved games from the OTHER games' recipes alone (generic_loo_solve_count=2), example-
  conditioning lifted world-model accuracy +0.286 vs cold, and example-conditioned WIN-induction
  actually SOLVED held-out g50t L1 (offline-reproduced, the FIRST example-corpus generic-transfer
  solve) -- BUT that g50t win was QUARANTINED DURATION_TOO_SHORT because the artifact wrote
  inference_substrate=None, and the LOO surfaced 5 residual mechanic-class deltas the generic path
  cannot yet induce. .411 banks the real-but-quarantined win, converts the 5 LOO residuals into
  composable generic operators, ships a LILO-style documented primitive library (the .410-flagged
  SOTA, arXiv:2310.19791) the first-contact solver retrieves before the generator, drives the
  .410-fixed generic first-contact solver to actually BANK a routed solve, and re-measures the
  falsifiable generic_loo_solve_count. Monotonically grow reproducible_total_levels from 37/18 (the
  guaranteed win: bank g50t -> 38/19). THE .410 LESSON, ENFORCED THIS MILESTONE: inference_substrate
  is a REQUIRED ARTIFACT FIELD on EVERY ARC solve/scoring task (adversarial_verify reads it from the
  ARTIFACT, so the agent must EMIT it, not just declare it at the task level). ALL experiments
  agent_type=codex/gpt-5.5 (operator quota-conserve 2026-06-19 sprint; the Claude planner is SKIPPED
  via this pre-staged roadmap; planner/retro stay Claude). The live generator is Qwen3.5-9B-MTP
  ([[project_arc_live_generator]]); NEVER the 3090s. paper_ready=True (FoVer 0.9131, G1-G4) is the
  FROZEN headline. NO leaderboard submission in-loop (operator-only).
milestone_doc: openspec/change-proposals/research-roadmap-v411.md
milestone_overview: |
  .410 attacked the generic gap with the example corpus and answered "partial": the corpus already
  enables SOME generic transfer, but a real win was lost to an artifact-discipline bug and 5
  mechanic-class deltas remain un-inducible generically. .411 turns that diagnosis into banked
  progress. Every ARC SOLVE task is reproduction-gated (arc_solver_kit.reproduce -> only reproduced
  levels count), Incremental-Progress-scoped (+1..+n levels on ONE game; never "solve them all"),
  EMITS inference_substrate as a REQUIRED ARTIFACT FIELD (the .410 g50t-quarantine fix), and uses a
  TERMINAL-prefixed honest_verdict. Reserved: 2 infra slots, 1 per attached FPGA board (Hardware-Task
  Continuity), 1 SOTA-ingestion slot. The ARC submission sprint forcing function (CLAUDE.md, through
  2026-06-30) mandates the MAJORITY of the milestone on ARC live-solving progress -- here 6 of 6
  discretionary slots (A1-A6).

    PHASE 0 -- TRANSITION: exp4442 archive .410 -> activate .411; record the TRUE .410 close-state.

    PHASE A -- GENERIC LIVE SOLVING FROM THE EXAMPLE CORPUS (operator MANDATORY; the headline; majority):
      A1 (exp4443) BANK the .410-quarantined example-conditioned win-induction solve (g50t L1) CLEANLY
        -- EMIT inference_substrate correctly; +1 reproducible game/level (37/18 -> 38/19).
      A2 (exp4444) GENERIC config-rule / local-constraint predicate-VERIFIER operator -> close the ft09
        LOO residual + attack the open dc22 first-contact gap (a config/toggle game).
      A3 (exp4445) GENERIC object-motion WORLD-MODEL operator (Loop-OWM-style reflection/push/translate)
        -> close the ar25 + ka59 LOO residuals; re-test LOO re-solve WITHOUT their own recipe.
      A4 (exp4446) DRIVE the .410-fixed generic first-contact solver to actually BANK a routed solve on
        an unsolved game (vc33 / unseen), not just route -- the live-solver capability.
      A5 (exp4447) LILO-style DOCUMENTED PRIMITIVE LIBRARY [continuous self-learning Tier 2] the
        first-contact solver retrieves before the generator (arXiv:2310.19791; the .410-flagged SOTA).
      A6 (exp4448) LEAVE-ONE-OUT generic-solve benchmark v2 -- re-measure generic_loo_solve_count after
        A2/A3/A5 land the new generic operators (the falsifiable progress metric; v1 was 2/7).
    PHASE B -- RESERVED INFRA (2 slots): exp4449 (registry/gaps hygiene + GAP-4 regression guard +
      reconcile .411), exp4450 (harden + CI-guard the inference_substrate-emission lint so the .410
      g50t false-positive-quarantine class cannot recur).
    PHASE C -- HARDWARE CONTINUITY (1 per attached board): exp4451 (KV260 SSH + GateMate + PolarFire).
    PHASE D -- SOTA-INGESTION (.411 bleeding-edge track -- library learning / object-centric world-model
      transfer): exp4452 (map the strongest methods onto the .412 roadmap).
    PHASE E -- CAPSTONE: exp4453 (the .411 scorecard + the generic-solver-gap DECISION: did the example
      corpus + new operators measurably raise generic_loo_solve_count and bank new levels?).

