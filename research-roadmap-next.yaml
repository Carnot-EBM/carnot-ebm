    TASK
    Measure complete decision and durable learning costs by available branch. Deliver results/experiment_7989_v692_service_cost.json. Implement the bounded entrypoint scripts/experiments/experiment_7989_v692_service_cost.py. MODEL_SPECS: []. SUBSTRATE CLASS: no_model_load. Use verifier_ensemble_against_cached_candidates for numerical scoring, or aggregation_from_upstream_artifacts for a pure audit. Zero current pretrained-model loads/calls. Small fitted heads are separate trained_head_specs.

    CONCRETE STEPS
    1. Print a flushed progress line at each phase boundary and before and after every model load, generation call, benchmark, and subprocess. Print inside long loops and from a supervising thread while an owned child is silent, at most 60 seconds apart. Keep every output gap below 600 seconds. Use tool waits of at most 60 seconds. Silence can end a run near 1200 seconds; progress permits the 4800-second hard cap. Report measured work; never pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Keep each edit and tool call small. Put temporary scripts and mutable test files in private /tmp directories outside the checkout. Keep the pytest artifact guard enabled. Archive immutable receipts only after children exit.
    3. Authenticate the exact input paths, hashes, roles, producer invocation dates, and readiness fields below. A historical date need not equal {date}. Missing inputs or failed external gates yield verdict_class=blocked and exact gate_check_summary operands. Do not retry unchanged external blocks as partial. Preserve historical failures and all source artifacts.
    4. Before implementation, append task-specific REQ-REPORT and, where applicable, REQ-VERIFY requirements and scenarios. Write tests first. Reuse qualified components below; implement only the stated difference. Freeze the required validation command manifest before running science. Keep unrelated repository health separate; never remove a failed owned check or weaken an assertion to qualify.
    5. Use internal OR qualification: the new Exp7982 multivariate checkpoint, the Exp7985 replay, or the qualified historical Exp7972 scalar control with current Exp7981 requests. Authenticate every branch independently and record each failed operand. Do not use conjunctive conductor gates that discard a valid branch. If none qualifies, emit blocked with exact sources.
    6. For up to64 fixed source groups, run one named warmup and ten paired CPU repetitions per available arm. Include public-byte reading, source feature extraction, normalization, scoring, typed decision, serialization and durable storage. Measure online gradient, admission, checkpoint fsync and restart separately when Exp7985 qualifies. Preserve all statuses and environmental observations.
    7. Separate exclusive CPU timings from complete service reconstructed using matching authenticated GPU acquisition receipts. Historical and current load setup remain separately identified and amortized only over their actual completed requests. Report p50/p95, throughput, memory, coefficient touches, bytes and uncertainty over source groups; timing repeats do not increase scientific sample size.
    8. Compare new versus existing scalar CPU service on the same inputs with a paired95% interval. Report engineering overhead or speedup, not an independent verification win. Include no-write versus fsync cost without weakening durability. A scientific accuracy null does not invalidate measured cost.
    9. Export an operation inventory naming real quadratic-Ising, dense/sparse head, byte handling and storage spans. If no operation matches an authenticated board capability, compatible_fraction=0. Keep missing model cost as unknown instead of zero. Never sum overlapping spans or compare cached CPU time against an entire live LLM call as an acceleration ratio.
    10. Run affected unit and consumer tests, nonempty 100% changed-statement coverage including real private CLI routes, scoped Ruff check/format, strict mypy, and scripts/check_spec_coverage.py on the actual test paths. Run applicable E2Es listed below with private outputs. Cold-replay the primary from outside the checkout without PYTHONPATH. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the final primary. Check both conductor_gates.evaluate_gates and in_process_doc_reconcile.find_artifact resolve that primary. Failed owned required validation means disqualified and readiness zero. Use one atomic declared primary and nested sidecars. Reconcile specs, _bmad/traceability.md, ops/status.md, and ops/changelog.md. Keep generator weights and production defaults fixed. Applicable end-to-end checks: E2E-015 plus private service-cost CLI and cold replay tests.
    REQUIRED ARTIFACT FIELDS
    - experiment_id, task_id, milestone, run_date, execution_date: principle: Bind identity to this invocation, not an inherited producer.
    - honest_verdict: principle: Use complete_positive_*, complete_null_*, complete_blocked_*, complete_disqualified_*, or complete_circular_positive_* with an accurate reason.
    - verdict_class: principle: Choose exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished OWN work that a retry can finish; other classes are terminal.
    - gate_check_summary: principle: Every blocked disposition names upstream, path/hash, field, operator, expected value and actual value. Distinguish missing from zero.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_specs, model_invocation_counts: principle: Declare actual compute and zero calls for cached scoring. Separate planned models from actual blocked invocations.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: principle: Make timing, progress and reconstruction checkable.
    - cited_upstream_artifacts, code_config_hashes, raw_shard_hashes: principle: Bind imported fields and current computations to their source bytes.
    - preconditions_checked, validation_command_manifest_path, validation_receipts, coverage_statement_counts: principle: Required checks need observed exit codes and logs, not a claimed green status.
    - rows, sample_size_budget: principle: Keep one primitive row per source/arm/seed or check. Include intended, eligible, started, completed, failed, censored, excluded and independent counts. Seeds do not multiply independent sources.
    - verifier_is_oracle, claim_scope, acceptance_gate_results: principle: Keep circular fixtures separate from independent natural-data evidence. A failed benefit gate forbids a positive class.
    - flagged_adversarial, terminal_validation_sidecar_path: principle: Final-byte checks must travel with the primary; never self-certify a failed verifier.
    - service_measurement_ready_score, branch_readiness, branch_gate_check_summary: principle: Allow independent qualified branches while preserving missing-science reasons.
    - rows, exclusive_phase_spans, complete_service_cost, acquisition_setup, durable_costs: principle: Bind service cost to matching work, setup and persistence.
    - hardware_compatible_operations, compatible_fraction, transfer_bytes: principle: Only measured compatible operations can support a later accelerator bound.
    - service_measurement_ready_score: principle: Exact downstream readiness field. Set 1 only after complete valid measurement and owned checks; a scientific null can still be ready. Set 0 on blocked/disqualified work.
