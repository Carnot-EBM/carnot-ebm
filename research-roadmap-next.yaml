  - id: exp1810-capstone-gemma26
    title: 'Exp 1810: Capstone E2E Pipeline with Gemma4-26B-A4B-it'
    max_turns: 50
    prompt: |
      CONTEXT: Capstone testing of Phase 16 improvements on middle MoE.
      EXISTING CODE TO READ FIRST: scripts/experiment_1808_capstone_qwen.py
      TASK: Run the E2E pipeline with Gemma4-26B-A4B-it-GGUF.
      CONCRETE STEPS:
      1. Write `scripts/experiment_1810_capstone_gemma26.py` targeting `unsloth/gemma-4-26B-A4B-it-GGUF`.
