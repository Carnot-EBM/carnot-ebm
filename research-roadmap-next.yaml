    prompt: |
      CONTEXT: VERGE (arXiv:2601.20055) uses SMT Minimal Correction Subsets (MCS) to localize
      and repair Z3-encodable constraint violations. An MCS is the smallest subset of constraints
      that, when removed, makes the remaining system satisfiable. This enables targeted repair:
      rather than regenerating the full response, VERGE identifies which specific steps violated
      the constraints and patches only those steps.
      This is the repair-side complement to NSVIF (exp2327, which extracts violations).
      NOTE: Requires z3-solver Python package (shared dependency with exp2327).
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/python/carnot/verify/
        {project_root}/scripts/experiment_template.py
      TASK: Implement VERGE-style MCS repair and evaluate on 20 synthetic violations.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. python -c "import z3; print(z3.get_version_string())" succeeds — else
              run: {project_root}/.venv/bin/pip install z3-solver -q
              If install fails: write honest_verdict blocked_z3_unavailable and exit.
        1. Create python/carnot/verify/verge_repair.py implementing:
           class VERGERepair:
             - find_mcs(solver: z3.Solver, constraints: list) -> list[int]
               Returns indices of the Minimal Correction Subset.
             - repair(original_text: str, mcs_indices: list, violations: list[str]) -> str
               Returns patched text with minimal corrections applied.
        2. Write 2 unit tests in tests/python/verify/test_verge_repair.py.
        3. Run unit tests; record n_tests_passed.
        4. Evaluate on 20 synthetic violated (instruction, response) pairs:
           - Find MCS for each violation
           - Apply repair
           - Verify repaired text reduces constraint violation count
        5. Measure:
           - mcs_avg_size: mean size of found MCS (smaller = more targeted)
           - repair_violation_reduction_rate: fraction where repair reduces violations
           - mean_mcs_solve_time_ms: mean MCS computation latency
        6. Set verge_repair_validated: true if repair_violation_reduction_rate >= 0.60.
        7. Write deliverable to results/experiment_2328_verge_repair.json.

