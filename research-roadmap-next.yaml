  - id: exp6143-test-artifact-isolation
    milestone: "2026.08.533"
    title: "Tracked-result test artifact isolation and quarantine preservation"
    priority: critical
    track: infrastructure
    deliverable: results/experiment_6143_test_artifact_isolation.json
    agent_type: codex
    model: gpt-5.5
    max_turns: 100
    estimated_wall_time_min: 240
    requires_gpu: false
    prompt: |
      CONTEXT:
      ops/known-issues.md records that the full Python test suite can rewrite at least 45 tracked files under results/ and strip `flagged_adversarial`, `corrigendum_pending`, and related quarantine fields. This can silently re-admit invalid evidence to publication/capstone aggregation. The structural fix is a redirectable experiment artifact root used automatically by tests, with mutation sentinels and determination-preservation checks. Today is {date}.

