  - id: exp339-session-startup-automation
    milestone: "2026.05.13"
    deliverable: scripts/session_startup.sh
    title: "Exp 339: Pre-session GPU health + zombie cleanup automation (RETRO-007 + RETRO-008)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: RETRO-007 and RETRO-008 from the 2026.05.06 retro call for automating
      pre-session health checks. The retro found zombie GPU processes consuming VRAM at
      session start and no standardized pre-flight check before conductor launches.
      The DualGPUMonitor (Exp 326) detects zombies but isn't called before experiments.
      A session_startup.sh would: (1) detect and optionally kill zombie GPU processes,
      (2) verify both RTX 3090s are visible and healthy, (3) print a summary report.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/dual_gpu_monitor.py — DualGPUMonitor, detect_zombies()
      - scripts/run_experiment_with_timeout.sh — timeout wrapper pattern (Exp 325)
      - results/operational_retro_2026_05_06.json — RETRO-007, RETRO-008 details
      - results/experiment_326_dual_gpu_config.json — DualGPUMonitor output schema

      TASK: Implement pre-session startup automation.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-INFRA-008 (session startup health check), SCENARIO-INFRA-012/013 to
         openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - parse_session_startup_output(output: str) → dict: parses stdout of session_startup.sh
           Expected keys: n_gpus_detected, n_zombies_found, n_zombies_killed, all_healthy
         - run_session_startup(dry_run=True) → dict: calls session_startup.sh, parses output
         - run_session_startup(dry_run=True): never kills processes when dry_run=True
         - all_healthy: True when n_gpus_detected >= 2 AND n_zombies_found == 0
         - CI-safe: when nvidia-smi not available, reports n_gpus_detected=0, all_healthy=False
           without raising exceptions
      4. Write scripts/session_startup.sh:
         a. Shebang: #!/usr/bin/env bash
         b. Args: [--dry-run] [--kill-zombies]
         c. Check nvidia-smi availability; if absent print "nvidia-smi not found" and exit 0
         d. List GPUs: nvidia-smi -L; count detected GPUs
         e. Detect zombie processes: run DualGPUMonitor via python (CI-safe import)
            `python -c "from carnot.pipeline.dual_gpu_monitor import DualGPUMonitor; ..."`
            Fallback: parse nvidia-smi --query-compute-apps=pid,used_memory --format=csv
         f. If --kill-zombies and zombies found: kill -9 each zombie PID (with sudo warning)
            If --dry-run: print zombie PIDs but do NOT kill
         g. Print summary: "SESSION STARTUP: n_gpus=X zombies=Y killed=Z all_healthy=T/F"
         h. Exit 0 always (health check, not a blocking requirement)
         i. chmod +x scripts/session_startup.sh
      5. Write scripts/experiment_339_session_startup.py using ExperimentTemplate(339, ...):
         a. Call run_session_startup(dry_run=True); record results in artifact
         b. Build artifact: schema="carnot.session_startup.v1", n_gpus_detected, n_zombies_found,
            all_healthy, retro_items_implemented=["RETRO-007", "RETRO-008"]
         c. Output: results/experiment_339_session_startup.json
      6. Write tests/python/test_experiment_339_session_startup.py (100% coverage required).
      7. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      8. Reconcile: update ops/conductor-log.md (RETRO-007, RETRO-008 implemented),
         ops/changelog.md, ops/status.md.
      9. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp340-live-full-precision-benchmark
    milestone: "2026.05.13"
    deliverable: results/experiment_340_live_precision_benchmark.json
    title: "Exp 340: Live full precision pipeline benchmark — VERGE + CRV + confidence + adaptive on RTX 3090"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Experiments 332-336 (confidence-weighted repair, model-adaptive thresholds,
      VERGE iterative Z3 refinement, CoTCircuitVerifier) were all implemented and benchmarked
      SYNTHETICALLY. Exp 328 ran the live GPU benchmark but used the OLD pipeline (pre-332).
      We have never measured the combined precision stack on real LLM output. This is the
      experiment that tells us whether the 2026.05.06 precision work actually helped.

      The hypothesis: confidence-weighted repair (86.7% synthetic FP reduction) + model-adaptive
      thresholds (auto-disabling high-FP constraint types) + VERGE (targeted step repair) +
      CRV (structural graph check) in combination will move verify-repair from "harmful" to
      "helpful" on live Gemma4-E4B-it output. If the hypothesis is correct, this is Carnot's
      first credible positive result on instruction-tuned models.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline, verify_repair_confidence_weighted(),
        verify_repair_verge(), verify_cot_circuit()
      - python/carnot/pipeline/confidence_weighted_repair.py — ConfidenceWeightedRepair (Exp 332)
      - python/carnot/pipeline/adaptive_thresholds.py — ModelAdaptiveThresholds (Exp 333)
      - python/carnot/pipeline/verge_refiner.py — VergeRefiner (Exp 334)
      - python/carnot/pipeline/cot_circuit_verifier.py — CoTCircuitVerifier (Exp 336)
      - scripts/experiment_template.py — ExperimentTemplate, DualGPURunner, BatchedInferenceRunner
      - results/experiment_328_live_benchmark.json — Exp 328 live GPU baseline results
      - results/experiment_331_fp_autopsy.json — FP taxonomy (VALID_INTERMEDIATE dominates)
      - scripts/experiment_315_full_scale_benchmark.py — script from Exp 315 (if present)

      TASK: Run live full precision pipeline benchmark with both models on two RTX 3090s.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-BENCH-003 (precision stack live benchmark), SCENARIO-BENCH-007/008/009 to
         openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - PrecisionStackResult dataclass: model_id, n_questions, baseline_accuracy,
           precision_stack_accuracy, signed_improvement, pipeline_variant, inference_mode
         - compute_signed_improvement(baseline_acc, stack_acc) → float (no clamping; honest)
         - PipelineVariant enum: BASELINE, CONFIDENCE_ONLY, CONFIDENCE_ADAPTIVE,
           CONFIDENCE_ADAPTIVE_VERGE, FULL_STACK (all five ablation conditions)
         - build_precision_benchmark_artifact(results: list[PrecisionStackResult]) → dict:
           schema="carnot.precision_benchmark.v1", headline_result, inference_mode
         - headline_result: signed_improvement of FULL_STACK on Gemma4-E4B-it
         - CI-safe: when CARNOT_FORCE_LIVE=0, all pipeline variants produce
           inference_mode="simulated" with honesty flag honest_verdict="simulated_only"
      4. Write scripts/experiment_340_live_precision_benchmark.py using
         ExperimentTemplate(340, "Live full precision pipeline benchmark", requires_gpu=True):
         a. MODEL_SPECS = [
              {"name": "Gemma4-E4B-it", "hf_id": "google/gemma-4-E4B-it", "gpu": 0},
              {"name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 1}
            ]
         b. Call tmpl.setup_gpu(MODEL_SPECS); if not all_healthy → blocked artifact
         c. Load 200 GSM8K questions (use same subset as Exp 328 for comparability)
         d. For each model, run 5 pipeline variants on 200 questions:
