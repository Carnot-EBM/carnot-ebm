milestone: 2026.06.407
milestone_title: "DECONFOUND the one alive oracle-distinct vehicle -- the verifier-as-first-error-LOCALIZER -- with REAL intervention data (arXiv:2601.14209), retire-if-it-ties-position-only-again. .406 attacked the .405 localization NULL (first-error F1 0.096) with SYNTHETIC verifiable process data (arXiv:2605.02395) and came back MOSTLY NULL: exp4392 reported a localizer 'win' (FoVer F1 1.0) but exp4393's skeptic-proof QUARANTINED it as pure POSITION BIAS (localizer_win_is_genuine=false, beats_position_only_baseline=false, template_ablation_drop=0.0 -- the F1=1.0 is the IMPLAUSIBLE_PERFECT tell; synthetic template-injected data does not carry the REAL first-error distribution); exp4396 SELF-LEARNING saturated (F1=1.0 flat 566->5661, localizer_compounds=false); exp4397 CROSS-DOMAIN calibration false (code_humaneval underpowered n=100 + base-rate confound); ARC STUCK at 34 reproducible levels / 17 games (exp4394/4395 both 0 new -- the lookahead-fidelity GATE 0.73-0.875 was UNREACHABLE; gating on AGGREGATE fidelity only CONFIRMED the blocker). The .406 SOTA-ingestion (exp4398) flagged_for_v407 = intervention_active_real_first_error_deconfounding_v407 (arXiv:2601.14209): use REAL verifier-checked intervention first-error data, stratified by position + template family, with the deconfounding controls BUILT INTO the headline. PRIMARY work = the operator-MANDATORY ARC north star: DECOMPOSE the fidelity blocker into per-mechanic EXECUTABLE UNIT TESTS (which transition the world model gets wrong), fix the engine test-by-test (arXiv:2606.16070), plan deeper. Plus active-learning self-learning (arXiv:2504.10559) + a repaired cross-domain calibration contract (arXiv:2602.07842). paper_ready=True (FoVer 0.9131, G1-G4) is the FROZEN headline."
milestone_doc: openspec/change-proposals/research-roadmap-v407.md
milestone_overview: |
  .406 (exp4401 capstone, verdict v406_localizer_localizes_but_not_genuine_compounds_false_calibrated_false_arc_levels_34_publication_ready)
  attacked the .405 first-error localization NULL with SYNTHETIC verifiable process data and came back mostly null:
    - LOCALIZER -> "localizes_but_not_genuine" (QUARANTINED). exp4392 reported the synthetic localizer beats the 0.096
      ensemble baseline (FoVer F1 1.0, GAP-4 ARC 0.69), but exp4393 skeptic-proof QUARANTINED it: localizer_win_is_genuine
      =false, beats_position_only_baseline=false, template_ablation_drop=0.0 -- PURE POSITION BIAS. Synthetic template-injected
      data does not carry the REAL first-error distribution.
    - SELF-LEARNING / COMPOUNDS -> false (saturated null, exp4396): learning curve F1=1.0 FLAT across corpus 566->5661.
    - CROSS-DOMAIN CALIBRATION -> false (exp4397): code_humaneval detection AUROC 0.98 but n=100 underpowered + multi-valid /
      base-rate confound; leave-one-domain-out ECE not below the uncalibrated baseline.
    - ARC north star -> STILL 34 reproducible levels / 17 games. exp4394 (deeper lp85/tu93/tn36/tr87) + exp4395 (tails
      ar25/ka59/ft09) both new_levels_reproduced=0; the lookahead-fidelity GATE was UNREACHABLE (ar25 0.73, tu93 0.80, lp85
      0.83, tr87 0.86, tn36 0.875 -- all below ~0.95). Gating on AGGREGATE fidelity only CONFIRMED the blocker.
    - paper_ready=True (G1-G4, FoVer 0.9131, unmet_gates: []).
  The .406 SOTA-ingestion (exp4398) flagged_for_v407 = intervention_active_real_first_error_deconfounding_v407
  (arXiv:2601.14209 InT self-proposed interventions -- REAL intervention first-error data instead of synthetic injection).
  .407 takes the honest next step:

    PHASE 0 -- TRANSITION: exp4402 archive .406 -> activate .407; record the TRUE close-state.

    PHASE A -- HEADLINE (deconfound the oracle-distinct LOCALIZER; verifier_is_oracle=false):
      A1 (exp4403) REAL INTERVENTION first-error data (arXiv:2601.14209): collect verifier-checked real traces where a
        single-step intervention redirects a failed trajectory; stratify by first-error position + template family; train a
        contrastive localizer; evaluate on a HELD-OUT REAL split with the deconfounding controls BUILT IN (a content-blind
        position-only baseline + a template-family holdout). Emit localizer_genuinely_beats_position_only BARE bool.
        prior_failures exp4392 (synthetic = position bias); retire_if_same_verdict: true.
      A2 (exp4404, GATED on A1 localizer_genuinely_beats_position_only==true) typed first-error taxonomy cross-check
        (arXiv:2603.25412) + cross-domain (GAP-4 ARC + held-out FoVer family) generalization. Emit localizer_generalizes_typed
        BARE bool.

    PHASE B -- ARC NORTH STAR (operator MANDATORY 2026-06-17; +1..+n per game; verifier_is_oracle=true):
      B1 (exp4405) E3 DEEPER via per-mechanic EXECUTABLE UNIT TESTS (arXiv:2606.16070): decompose the .406 fidelity blocker --
        write an executable unit test for each mismatched transition, fix the engine to pass it, raise per-mechanic fidelity,
        plan deeper. lp85 L6 + tu93 L5 + tn36 L8 + tr87 L7. prior_failures exp4394.
      B2 (exp4406) E3 BLOCKED-mechanic tails via per-mechanic unit tests on the NAMED registers: ar25 L2 (action7 undo-stack)
        + ka59 L2 (step-counter HUD + object-relevance) + ft09 L2. prior_failures exp4395.

    PHASE C -- CONTINUOUS SELF-LEARNING (mandated; verifier_is_oracle=false):
      exp4407 ACTIVE-learning compounding (arXiv:2504.10559): the .406 SIZE-only growth saturated (exp4396). NEW mechanism =
        active selection (uncertainty + first-error-POSITION diversity) of REAL first-error traces -- does active selection
        compound where size-only could not, on the best available first-error localizer? Emit localizer_compounds BARE bool.
        prior_failures exp4396. Keeps template-family holdouts + a position-only control IN the active loop. NOT gated.

    PHASE D -- CROSS-DOMAIN DETECTION CALIBRATION (complementary; cached; verifier_is_oracle=false):
      exp4408 repair the false calibrated-multi-domain contract (arXiv:2602.07842): build PROPER pools (code n>=300, GSM
        n>=300 -- not the .406 underpowered n=100) + semantic confidence aggregation + per-domain base-rate separation +
        leave-one-domain-out calibration. Emit detection_calibrated_multi_domain BARE bool. prior_failures exp4397.

    PHASE E -- INFRA + HYGIENE + CAPSTONE: exp4409 SOTA-ingestion -> .408; exp4410 registry/gaps hygiene + GAP-4 guard;
      exp4411 KV260 continuity (opportunistic); exp4412 capstone .407 + the headline decision + G1-G4.

  HARD RULE (every task): conductor STOOD-DOWN on TRM training -- NO task launches TRM training, runs pkill/kill against
  train.py, or writes results/trm_runs/. Qwen FORBIDDEN as the TRAINED base (Spurious-Rewards confound); Qwen/Gemma GGUF as
  an off-policy judge/generator is fine. A2D2 (2606.13565) + SEPO (2502.01384) verifier-as-reward GENERATOR-training are
  OUT-OF-BAND/operator-owned (NOT auto-run). Every verifier-value task declares verifier_is_oracle honestly (Circularity
  Discipline): the localizer/calibration/compounding claims are oracle-DISTINCT (verifier_is_oracle=false + matched control +
  CI95-excl-0); ARC E3 SOLVEs are execution-grounded (verifier_is_oracle=true, ARC progress NOT a moat headline). DO NOT
  re-propose: cross-game ARC value transfer (RETIRED exp4318/4331/4342), in-generation DiffusionGemma (RETIRED exp4374),
  LLM-heuristic efficiency (SETTLED exp4370), cross-domain SELECTION (RETIRED exp4314), or the SYNTHETIC localizer route
  (.406 artifact-confounded -- .407 uses REAL intervention data). NO autonomous edits to docs/index.html / README / paper
  prose. Online ARC stays operator-gated (NO leaderboard submission; only offline-reproduced levels count). paper_ready=True
  (FoVer 0.9131) is the FROZEN headline -- .407 adds genuine lenses, never a substitute.

