  title: "Environment Gate Audit - Disk Quota, Pretest Signature, and Stale .103 Skeletons"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 25
  priority: critical
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1325-triggered-certificate-extraction-v5-runtime-fixed-dccd-gbnf
      verdict: disk_quota_exceeded_then_stale_in_progress_skeleton
      addressed_by: "Measure disk/inode/pretest state before any expensive SOTA rerun and classify stale .103 artifacts without rewriting them."
      retire_if_same_verdict: true
    - experiment_id: exp1328-graphcontrol-drafter-probe-sanity-spectrum-v2
      verdict: skipped_repeated_pretest_failure_signature_1_failed_86_passed
      addressed_by: "Record the repeated pre-test signature as an explicit environment gate instead of allowing repeated conductor retries."
      retire_if_same_verdict: true
    - experiment_id: exp1336-milestone-103-retrospective-and-carryforward
      verdict: skipped_repeated_pretest_failure_signature_1_failed_86_passed
      addressed_by: "Prevent the milestone retro class from being blocked by an unclassified pre-test signature."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Milestone .103 reached operator closeout, but the local artifacts show that
    exp1325 stalled after disk-quota failures and later tasks were skipped by a
    repeated pre-test failure signature. This task makes the environment state
    explicit before .104 launches scientific work. Use {project_root} as the
    project root and {date} as the run date in artifact metadata.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - ops/conductor-log.md
    - results/operational_retro_2026_04_103.json
    - results/experiment_1323_sota_gguf_token_health_prompt_runtime_diagnostic.json
    - results/experiment_1324_certificate_failure_taxonomy_formalizer_reality_check.json
    - results/experiment_1325_triggered_certificate_extraction_v5_runtime_fixed_dccd_gbnf.json
    - scripts/validate_prior_failures.py
    - scripts/audit_roadmap_gates.py
    - research-references.md

    TASK:
    Create an environment gate artifact that measures disk, inode, focused
    pre-test, stale .103 skeleton, and roadmap-gate health. Do not modify
    existing .103 artifacts, research-roadmap.yaml, or scripts/research_conductor.py.

    REQUIRED ARTIFACT FIELDS:
    - status
    - disk_free_gb
    - inode_free_pct
    - disk_quota_ok
    - repeated_pretest_signature
    - focused_pretest_status
    - stale_artifact_paths
    - stale_skeleton_count
    - environment_ready
    - recommended_task_pruning
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1337_environment_gate_disk_pretest_stale_skeleton_audit.json immediately with status="in_progress".
    2. Measure filesystem free space and inode availability for {project_root}; do not delete files or caches.
    3. Read ops/conductor-log.md and results/operational_retro_2026_04_103.json to extract the exact disk-quota and repeated pre-test signatures from .103.
    4. Inspect .103 result artifacts and list any status="in_progress" or bootstrap-only skeleton artifacts as stale_artifact_paths.
    5. Run a lightweight focused pre-test command only if the relevant script exists; otherwise record focused_pretest_status="not_available" with the missing path.
    6. Run python3 scripts/validate_prior_failures.py research-roadmap-next.yaml and python3 scripts/audit_roadmap_gates.py research-roadmap-next.yaml if those scripts are available, and summarize any actionable failures.
    7. Set environment_ready=true only when disk_quota_ok is true, no repeated focused pre-test signature is active, and stale artifacts are classified rather than silently reused.
    8. Write recommended_task_pruning for any .104 tasks that should remain blocked until the gate is fixed, then write all required fields, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1337_environment_gate_disk_pretest_stale_skeleton_audit.json')); print(d.get('disk_quota_ok'), d.get('environment_ready'), d.get('stale_skeleton_count'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

