      EXISTING CODE TO READ FIRST: python/carnot/samplers/equilibrium_matching.py
      TASK: Port the EqM sampler core to a GPU-accelerated backend.
      CONCRETE STEPS:
      1. Modify `{project_root}/python/carnot/samplers/equilibrium_matching.py` to add a JAX/CUDA path.
      2. Create `{project_root}/scripts/experiment_1740_eqm_gpu.py` to benchmark CPU vs GPU latency for the EqM update rule.
      3. Write results to `{project_root}/results/experiment_1740_eqm_gpu.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

