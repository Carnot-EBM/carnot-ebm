      - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
      - {project_root}/openspec/capabilities/verification/spec.md

      TASK:
      Build a sealed calibration/test difficulty ladder from harder parameter draws of the exact Exp5785/Exp5786 constraint families; separate solver hardness, model-facing surface, semantic family, answer-space chance floor, shortcut salience, and exact method-validity labels; write immutable row/split manifests and results/experiment_6103_phase_d_difficulty_ladder_fixture.json without invoking an LLM.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash all source fixtures, generators, exact Python/Z3 validators, prior corrigenda, split manifests, output paths, disk/RAM, root-clutter inventory, and protected files. Confirm no candidate-generation or model-response artifact is imported as a fixture row.
      1. Add REQ-* exact-generation, low-chance answer-space, calibration/test sealing, solver-vs-model hardness separation, proof-preserving transform, shortcut/path-validity, leakage, and tamper requirements plus failing tests first.
      2. Generate at least 600 calibration and 360 held-test questions across at least three exact low-chance families, with answer-space floors no greater than 0.25. Parameterize family size/density/width and solver conflicts independently where feasible.
      3. Add proof-preserving relabels, meaning-preserving paraphrases, surface-order changes, boundary conditions, salient shortcut distractors, and derivation/method-validity labels. Record transforms and exact inverses; do not expose hidden answers or validator traces to later model prompts.
      4. Freeze semantic-group-disjoint calibration/test splits before inference. No base instance, sibling relabel, paraphrase, near-negative, or answer permutation may cross a split.
      5. Replay every answer and method-validity label through independent Python and Z3 authorities. Reject disagreements, unreachable truths, duplicate semantic groups, chance-floor ambiguity, or answer-order dependence.
      6. Publish a bounded calibration policy for Exp6104: calibration may select difficulty strata, temperature, and fixed decoding parameters but may not inspect held-test labels or change held rows. The target per-candidate test band is 0.40-0.70, measured later rather than promised here.
      7. REQUIRED ARTIFACT FIELDS: status, preconditions_checked, immutable_source_hashes, family_parameter_and_exact_generation_contract, calibration_and_held_test_counts, semantic_group_splits, answer_space_and_enumerated_chance_floors, solver_hardness_model_surface_and_semantic_strata, proof_preserving_relabel_paraphrase_and_inverse_receipts, shortcut_salience_and_method_validity_manifest, python_z3_parity, duplicate_leakage_unreachable_and_order_dependence_counts, calibration_policy_and_test_secrecy, row_paths_hashes_and_prefix_chain, phase_d_ladder_fixture_ready_score, protected_files_unchanged, duration_s, inference_substrate, verifier_is_oracle, missing_verifier_gaps, field_provenance, test_commands, test_exit_codes, reproducibility_checksum, honest_verdict.
