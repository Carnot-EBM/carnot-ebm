      TASK: Across MANY (>=4) fresh grounding configs, run the FR-11 self-improvement loop to
      N>=200 under FOUR arms and report which deployable rule robustly prevents collapse:
        - Arm A (ADAPTIVE ONLINE): measure lambda_min(Sigma) ONLINE each step (or each window),
          set beta = clamp(f(lambda_min), beta_floor) — adapts as the ensemble diversity drifts.
        - Arm B (beta=0 control): expect collapse (proves the loop CAN collapse).
        - Arm C (conservative-default beta, e.g. 0.5): the exp3509 recommendation.
        - Arm D (STATIC offline law, exp3498's formula at a one-shot lambda_min): the rule shown to
          fail in exp3509, kept as the contrast.
