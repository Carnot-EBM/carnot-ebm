  - id: exp1811-retro
    title: 'Exp 1811: Milestone .139 Retrospective'
    max_turns: 20
    prompt: |
      CONTEXT: End of milestone retrospective and artifact aggregation.
      EXISTING CODE TO READ FIRST: ops/conductor-log.md
      TASK: Audit all JSON results from Exp 1799 through 1810 and prepare the Phase-16 finding summary.
      CONCRETE STEPS:
      1. Write `scripts/experiment_1811_retro.py`.
      2. Parse all milestone result JSONs and extract key metrics (accuracy_delta, dpo_improvement_pp, etc.).
