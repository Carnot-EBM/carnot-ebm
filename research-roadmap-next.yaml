      Per CLAUDE.md KV260 SSH-Not-SD-Card Discipline: ALL board interaction via SSH.
      PRECONDITIONS use SSH reachability — NOT host /dev/mmcblk*.

      The Carnot Ising sampler on KV260 uses UIO devices (/dev/uio0 through /dev/uio4).
      A latency transcript measures: how long does a full spin-read cycle take?
      Target: read all N=64 spins from UIO registers, time 100 read cycles.

      EXISTING CODE TO READ FIRST:
      - ops/hardware-bringup-prep.md (KV260 section — current bring-up state, uio device map)
      - results/experiment_2735_kv260_continuity_259.json (uio_count=5, uio0_first_word_read=true)

      TASK: Measure KV260 board-level Ising sampler latency via SSH + on-board Python UIO reads.
      Produce a non-fabricated latency transcript with kv260_synthesis_succeeded=true.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `ssh -o ConnectTimeout=5 -o BatchMode=yes kria 'true'`
            If exit != 0: write honest_verdict 'blocked_kv260_ssh_unreachable' and exit.
            Record: ssh_kria_reachable (bool).
         b. `ssh kria 'xmutil listapps 2>/dev/null | head -20'`
            Record: xmutil_output (str), bitstream_state (str).
         Record: preconditions_checked.

      1. Load bitstream (or confirm already loaded):
         `ssh kria 'xmutil loadapp carnot_ising_v2_n64 2>&1 | head -5'`
         Record: bitstream_loaded (bool), loadapp_output (str).
         If bitstream_loaded=false: write honest_verdict 'blocked_bitstream_load_failed' and exit.

      2. Verify UIO devices:
         `ssh kria 'ls /dev/uio* 2>/dev/null'`
         Record: uio_devices (list of str), uio_count (int).
         If uio_count < 1: write honest_verdict 'blocked_uio_devices_absent' and exit.

      3. LATENCY TRANSCRIPT — 100-cycle spin-read loop on the board:
         ```python
         ssh kria 'python3 -c "
         import struct, time
         f = open(\"/dev/uio0\", \"r+b\", buffering=0)
         latencies = []
         for i in range(100):
           t0 = time.perf_counter()
           f.seek(0)
           word = struct.unpack(\"<I\", f.read(4))[0]
           t1 = time.perf_counter()
           latencies.append((t1-t0)*1e6)  # microseconds
         f.close()
         import statistics
         mean_us = statistics.mean(latencies)
         std_us = statistics.stdev(latencies)
         print(f\"mean_us={mean_us:.3f} std_us={std_us:.3f} min_us={min(latencies):.3f} max_us={max(latencies):.3f}\")
         "
         `
