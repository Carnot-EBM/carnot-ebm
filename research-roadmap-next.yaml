milestone: 2026.05.129
milestone_title: "Phase-6 Energy-Driven Steering, KArAt Attention, and CRANE Decoding"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1677-eds-prototype
    title: "Phase 1: Energy-Driven Steering (EDS) for Hidden States"
    model: sonnet
    max_turns: 50
    prompt: |
      CONTEXT: We need to guide generation without restrictive grammar masks by directly steering hidden states using energy gradients (arXiv:2605.xxxxx EDS).
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/
      TASK: Build an Energy-Driven Steering (EDS) prototype for local SOTA GGUF models.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/energy_driven_steering.py`.
      2. Implement a lightweight external EBM adapter that maps internal model activations to an energy landscape.
      3. Use gradients of this energy to steer hidden states during generation for `unsloth/gemma-4-31B-it-GGUF` and `unsloth/Qwen3.6-35B-A3B-GGUF`.
      4. Evaluate on a small logical task and write the results to `{project_root}/results/experiment_1677_eds.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1678-crane-decoding
    title: "Phase 1: CRANE Reasoning-Augmented Constrained Decoding"
    agent_type: codex
    max_turns: 40
    prompt: |
      CONTEXT: Strict zero-false-accept parsing reduces semantic reasoning quality (the "reasoning tax"). CRANE (arXiv:2405.20485) interleaves free "thinking" and structured generation.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/
      TASK: Implement CRANE decoding to alternate between unconstrained reasoning and grammar-enforced generation.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/crane_decoding.py`.
      2. Implement the state machine that toggles between free-text and strict constraint enforcement.
      3. Test the mechanism on `unsloth/gemma-4-26B-A4B-it-GGUF` ensuring semantic coherence improves compared to strict grammar decoding.
      4. Write `{project_root}/results/experiment_1678_crane.json` containing `reasoning_quality_delta` and `parse_rate`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1679-karat-attention
    title: "Phase 2: Kolmogorov-Arnold Attention (KArAt) Prototype"
    model: sonnet
    max_turns: 50
    prompt: |
      CONTEXT: Moving beyond standard MLP and attention to fully learnable, verifiable bases (arXiv:2503.10632).
      EXISTING CODE TO READ FIRST: python/carnot/models/
      TASK: Build a miniature KArAt attention block replacing Softmax with learnable spline/rational bases.
      CONCRETE STEPS:
      1. Create `python/carnot/models/karat_attention.py`.
      2. Implement a single KArAt layer designed for energy calculation.
      3. Verify the parameter counts and bounding bounds using rational abstractions.
      4. Write `{project_root}/results/experiment_1679_karat.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1680-continual-learning-eds
    title: "Phase 3: Continuous Self-Learning Verification for EDS"
    agent_type: codex
    max_turns: 40
    gated_on:
      - upstream: exp1677-eds-prototype
        artifact_field: success
        op: '=='
        value: true
    prompt: |
      CONTEXT: We must guarantee that our Energy-Driven Steering and CRANE mechanisms do not induce recursive forgetting during continuous self-learning.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/cerce_ledger.py
      TASK: Evaluate the new EDS and CRANE decoding with the CerCE non-forgetting ledger.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1680_eds_learning.py`.
      2. Run the FR-11 query-time update cycle over the EDS trace candidates.
      3. Confirm that the `nonforgetting_rate` stays strictly at 1.0.
      4. Write `{project_root}/results/experiment_1680_continual_eds.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1681-milestone-retro
    title: "Phase 3: Milestone 2026.05.129 Retrospective"
    model: sonnet
    max_turns: 30
    prompt: |
      CONTEXT: Finalizing the 2026.05.129 milestone.
      EXISTING CODE TO READ FIRST: ops/status.md, ops/changelog.md
      TASK: Summarize the findings of EDS, CRANE, and KArAt implementations.
      CONCRETE STEPS:
      1. Compile outcomes and create `scripts/experiment_1681_retro.py` to aggregate JSON artifacts.
      2. Update `ops/status.md` and `ops/changelog.md` to reflect the new pipeline capabilities.
      3. Write `{project_root}/results/experiment_1681_retro.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
