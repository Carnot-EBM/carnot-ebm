    TASK:
    Bind activation-aware authority and freeze current research methods.
    Deliverable: {project_root}/results/experiment_7953_v690_contract_methods.json.
    Actual compute: aggregation_from_upstream_artifacts; inference_substrate_class=no_model_load; MODEL_SPECS=[]; execution_venue=host.

    CONCRETE STEPS:
    1. Print a flushed start line. Authenticate exact inputs and current gate operands. An absent or failed external prerequisite produces complete_blocked_* with verdict_class=blocked and gate_check_summary. Do not retry unchanged external incompleteness.
    2. Print a flushed progress line at every phase boundary and before and after each model load, generation, benchmark and subprocess. Print completed units and monotonic elapsed time inside long loops. Supervise owned children with heartbeats at most 60 seconds apart. Keep every output gap below 600 seconds and each tool wait at most 60 seconds. Silence can limit execution to 1200 seconds; continuing progress permits the 4800-second cap. Never pad duration.
    3. Write every file over about 200 lines in several tool calls, with at most 150 lines per call. Emit a progress message between calls. Bound analysis intervals as well as shell commands. Put throwaway probes in /tmp and real experiments in scripts/experiments/. Resume only code/config/input-bound checkpoints.
    4. Add task-owned REQ-* and SCENARIO-* requirements before implementation. Write failing tests first. Freeze exact affected files, transitive consumers, argv, expected exits and failure reasons, deadlines and coverage includes before results. Preserve old assertions, required failures and artifacts. Reuse callable libraries through a small parameterized CLI.
    5. Give each private CLI scenario its own publication directory, including negative, blocked, success and replay routes. Publish one top-level experiment_7953_*.json primary. Put rows, attempts and validators below results/raw/experiment_7953_v690_contract_methods/. Keep the publisher uniqueness check. Verify conductor_gates.evaluate_gates and in_process_doc_reconcile select the primary path/hash after nested sidecars get newer mtimes. Do not rely on a running conductor reloading modules.
    6. Reproduce both Exp7940 authority failures in private fixtures. Bind exactly 13 tasks, Exp7953 through Exp7965, the V690_TASK_CONTRACT_START JSON, visible table and complete-task SHA-256. At planning, matching staged/document bytes establish planning readiness only. After activation, matching active/document bytes establish observed activation; absent consumed staging is unknown historical custody, not fabricated staging and not by itself a mismatch. Existing contradictory staging or preserved snapshot bytes must still fail. Keep observed_activation and staging_custody_status separate. Never write or activate either roadmap from this experiment.
    7. Test the conditional prior-failure rule: a genuinely new task may have an empty list only when the unchanged exclusion/lineage readers find no required history. Scope-matched tasks require all four prior fields and retirement true. Do not invent historical failures to satisfy the old universal boolean. Write regressions for both cases, absent consumed staging, staged-only state, changed active prompts and conflicting preserved snapshots. Retain the twelve contract mutations: count, ID, order, phase, path, prompt, gate field, model, substrate, prior failure, digest and authority date. Fixture agreement is circular_positive.
    8. Authenticate Exp7892 source custody, Exp7916 numerical runtime, Exp7917 intervention protocol and Exp7941 publication receipts from their exact primaries. Preserve the 640 intended families and historical exclusions. Freeze current code and configuration hashes independently of historical eligibility. The contract is an audit branch, never a universal science pre-gate.
    9. Ingest the V690 source review into research-studying.md. Record EAEV/span-alignment target boundaries, fixed-grammar accuracy, delayed ACI, KAN retention limits and sparse hardware cost accounting. Record Semantic Scholar HTTP 429 and OpenReview challenges without claiming a complete citation census. Freeze the nine energy arms, full-response annotation target, typed loss, causal order and confidence formula before results.
    10. Freeze task-specific validation command manifests. Run private E2E-018 lifecycle regressions plus E2E-015/016. Preserve fixture dates. Keep required owned checks distinct from repository health. Reuse helpers; limit repairs to the task-owned authority path and its tests, not conductor activation or global guard semantics.
    11. Run affected unit and consumer tests with PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov. Combine unit and real CLI success, expected-failure, cold-replay and terminal-recheck coverage with identical includes. Require nonempty coverage and 100 percent changed-module and CLI statements. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py on explicit affected test filenames. Record existing repository-wide health receipts without calling them current passes. Run a new bounded health check only when changed shared dependencies require it; keep every affected check mandatory.
    12. Run the task-specific E2Es named above in private directories. Both fixture and cold replay calls to the historical E2E-016 Exp7868 CLI must use --date 20260929; record current {date} separately. Preserve assertions and date validation. Never invoke historical publishing CLIs against current authorities. Keep raw shards below 50 MiB and tracked files below 90 MB.
    13. Cold-reduce every claim from primitive rows. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Inspect both reports. Owned required failures mean disqualified and readiness zero. Recheck final bytes after verdict changes. Sidecars bind the final hash. Atomically publish only checked bytes. Fixture agreement or a model predicting its own labels is circular_positive, never independent scientific benefit.
    14. Preserve the September 28 oracle-distinct corrigendum. Use complete_* terminal verdicts and verdict_class from positive | circular_positive | null | blocked | disqualified | partial. Reserve partial for unfinished owned work that a retry can finish. Valid null results can satisfy measurement-readiness gates. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Retire unchanged prior verdicts. Keep production defaults, generator weights, historical determinations and external publication unchanged.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date: Exact current producer identity and {date}. principle: Evidence belongs to its executing producer.
    - honest_verdict, verdict_class: Closed enum positive | circular_positive | null | blocked | disqualified | partial. principle: External incompleteness is terminal blocked.
    - flagged_adversarial, gate_check_summary: Actual final validator flag; every blocked_* or complete_blocked_* records upstream ID, path/hash, field, op, expected and observed values. principle: Missing inputs differ from failed thresholds.
    - rows, sample_size_budget: Each unit/arm/seed metric; intended, eligible, started, completed, failed, censored, excluded and independent counts with named units. principle: Repeated seeds and masks do not create independent samples.
    - acceptance_gate_results: Separate validity, readiness, probability quality, calibration, decision benefit, retention and efficiency. principle: Running successfully is not a benefit claim.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Real monotonic spans plus code/config/data hashes. principle: Never infer execution from a model name.
    - source_artifact_hashes, preconditions_checked, resolved_imports: Exact paths, transitive dependencies and exposed roles. principle: Reuse requires current custody.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, coverage_statement_counts, historical_required_failures, repository_health: Actual commands, exits, deadlines, logs and measured files. principle: Historical failures remain visible.
    - primary_resolution_receipt, terminal_validation_sidecar_path: Paths and hashes selected by the actual readers, sidecars below results/raw/. principle: The runtime must read the validated primary.
    - verifier_is_oracle, claim_scope: Explicit circularity and exposed_development status. principle: Existing human labels are model-independent, but reused source groups are not a fresh confirmatory holdout.
    - inference_substrate, inference_substrate_class, execution_venue: Actual compute and host venue; blocked_no_run records planned class separately. principle: The workload determines the duration floor.
    - MODEL_SPECS, model_specs, target_model, model_invocation_counts, trained_head_specs: Invoked pretrained models or empty lists with zero calls; fitted small heads separately. principle: Cited models are not invoked models.
    - field_principles: Explain all task-owned fields and gates. principle: Each field preserves a scientific purpose.
    - contract_ready_score, activation_confirmed: Readiness 1 with matching observed active/document authority and passed owned checks; staging-only remains planning readiness. principle: Staging is not activation.
    - contract_rows, mutation_rows, authority_snapshots, canonical_tasks_sha256, source_custody_rows, literature_adoption_decisions: Thirteen tasks and twelve negative mutations. principle: The task list and method choices are binding.
    - historical_fixture_date, execution_date, lifecycle_task_count: 20260929, {date} and 13. principle: Fixture identity is separate from execution time.

    - staging_custody_status, planning_ready_score, observed_activation: Observed states, never reconstructed staging. principle: Consumed staging does not erase verified active identity.
    - lineage_applicability_rows: Per-task scope-match result and reader receipt. principle: Empty legitimate history differs from an omitted required failure.
    - cited_upstream_artifacts: List of experiment_id, fields_imported, path and sha256. principle: Inherited facts keep their original evidence identity.
    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7953_v690_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
