    deliverable: "results/experiment_3121_capstone_v290.json"
    title: "Capstone v290"
    priority: critical
    max_turns: 100
    model: opus
    estimated_wall_time_min: 60
    track: "ops"
    inference_substrate: "aggregation"
    requires_gpu: false
    gated_on:
      - upstream: exp3120-cross-corpus-matrix-v24
