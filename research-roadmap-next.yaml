        0. PRECONDITIONS (check BEFORE any labeling/training):
           a. The cached step-labeled FoVer corpus (exp2850) + the GAP-4 ARC pool + the verifier ensemble load. If absent -> honest_verdict `blocked_cached_corpus_or_ensemble_unavailable` and STOP.
