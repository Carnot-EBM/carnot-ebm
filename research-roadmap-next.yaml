      artifact_field: source_grounding_fixture_ready_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Exp7138 provides a sealed source-backed fixture and a bounded SQL sandbox.
    Recent source-grounding work suggests that building low-level relations and
    querying them can expose hallucinations. This task compares that method
    with direct and matched self-verification controls on all three mandated
    local model families. Hidden RAGTruth labels remain the scorer.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/results/experiment_7138_v627_relational_fixture.json
