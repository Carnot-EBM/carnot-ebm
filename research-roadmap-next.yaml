milestone: 2026.05.139
milestone_title: "Phase-16: Formal KAN Verification, EBM-Guided Reasoning, and Thermodynamic Denoising Simulation"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1799-partial-trace-energy
    title: 'Exp 1799: Implement partial-trace energy scoring prototype'
    prompt: |
      CONTEXT: The recent shift towards Energy-Based Transformers (EBT) suggests using partial-trace energy to evaluate intermediate steps.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verify_repair.py
      TASK: Implement an EBT-style partial-trace energy scoring prototype that evaluates intermediate reasoning steps before full certificate generation.
      CONCRETE STEPS:
      1. Write `python/carnot/pipeline/partial_trace_energy.py` extending the current verify pipeline.
      2. Run tests to measure `energy_converges` and `accuracy_delta` on a 50-case benchmark using cached_sota_pair().
      3. Output results to `{project_root}/results/experiment_1799_partial_trace.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1800-verified-traces-dataset
    title: 'Exp 1800: gated on Exp 1799 accuracy_delta>0: Generate 2000 verified reasoning traces'
    gated_on:
      - upstream: exp1799-partial-trace-energy
        artifact_field: accuracy_delta
        op: '>'
        value: 0.0
    prompt: |
      CONTEXT: To fulfill the continuous self-learning loop (FR-11), we need a dataset of verified traces.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/long_run_executor.py
      TASK: Generate 2000 verified reasoning traces (correct/incorrect pairs) using local SOTA GGUF models.
      CONCRETE STEPS:
      1. Write `scripts/experiment_1800_generate_traces.py` to run Qwen3.6-35B-A3B and Gemma-4-31B-it via `cached_sota_pair()`.
      2. Use partial-trace energy to rank and filter cases.
      3. Output `{project_root}/data/verified_traces_1800.jsonl`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1801-dpo-training
    title: 'Exp 1801: gated on Exp 1800 generated_count>=2000: DPO training on verified pairs'
    gated_on:
      - upstream: exp1800-verified-traces-dataset
        artifact_field: generated_count
        op: '>='
        value: 2000
    prompt: |
      CONTEXT: GRPO was retired; we now use DPO on verified pairs to fine-tune the reasoning adapter.
      EXISTING CODE TO READ FIRST: python/carnot/training/
      TASK: Run DPO training on the 2000 verified pairs generated in Exp 1800.
      CONCRETE STEPS:
      1. Write `scripts/experiment_1801_dpo_train.py` applying DPO to the verifier adapter.
      2. Measure `dpo_improvement_pp` and `dpo_vs_baseline_auroc`.
      3. Save weights and output metrics to `{project_root}/results/experiment_1801_dpo.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1802-self-learning-eval
    title: 'Exp 1802: Evaluate continuous self-learning non-forgetting'
    prompt: |
      CONTEXT: We must verify that the DPO-trained adapter does not suffer from catastrophic forgetting.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verify_repair.py
      TASK: Evaluate continuous self-learning non-forgetting and soundness mistakes after DPO.
      CONCRETE STEPS:
      1. Write `scripts/experiment_1802_eval_forgetting.py` running the LTLZinc temporal benchmarks.
      2. Measure `nonforgetting_rate`, `soundness_mistakes`, and `completeness_mistakes`.
      3. Write to `{project_root}/results/experiment_1802_eval.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1803-pwa-abstraction
    title: 'Exp 1803: Piecewise affine (PWA) abstraction of KAEMEnergy'
    agent_type: codex
    prompt: |
      CONTEXT: Recent papers (arXiv:2602.06737) propose Piecewise Affine (PWA) abstractions for verifying KAN properties.
      EXISTING CODE TO READ FIRST: python/carnot/models/kaem_energy.py
      TASK: Implement PWA abstractions for the univariate spline layers in KAEMEnergy.
      CONCRETE STEPS:
      1. Write `python/carnot/models/pwa_kan.py` to approximate `UnivariateKAEMLayer` with PWA functions.
      2. Calculate abstraction error bounds.
      3. Save `{project_root}/results/experiment_1803_pwa.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1804-milp-encoding
    title: 'Exp 1804: MILP encoding of PWA abstractions'
    agent_type: codex
    prompt: |
      CONTEXT: PWA abstractions allow formal verification via Mixed Integer Linear Programming (MILP).
      EXISTING CODE TO READ FIRST: python/carnot/models/pwa_kan.py
      TASK: Encode the PWA KAN approximations into a MILP problem using PySAT or Z3.
      CONCRETE STEPS:
      1. Write `python/carnot/verify/milp_kan.py` integrating with `carnot-constraints`.
      2. Test the encoding on small constraint geometries.
      3. Output `{project_root}/results/experiment_1804_milp.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1805-formal-verify-smoke
    title: 'Exp 1805: End-to-end formal verification smoke test on KAEM'
    prompt: |
      CONTEXT: We must validate the full formal verification pipeline for KANs.
      EXISTING CODE TO READ FIRST: python/carnot/verify/milp_kan.py
      TASK: Run an end-to-end formal verification smoke test of the KAEM model on a 10-constraint task.
      CONCRETE STEPS:
      1. Write `scripts/experiment_1805_kan_verify.py` defining 10 formal safety constraints.
      2. Run the MILP solver and report `verification_time_ms` and `bounds_soundness`.
      3. Output `{project_root}/results/experiment_1805_smoke.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1806-dtm-simulation
    title: 'Exp 1806: Denoising Thermodynamic Model (DTM) simulation using thrml'
    prompt: |
      CONTEXT: DTMs (arXiv:2510.23972) repurpose EBMs as denoising steps.
      EXISTING CODE TO READ FIRST: python/carnot/samplers/parallel_ising.py
      TASK: Simulate a Denoising Thermodynamic Model using the `thrml` library.
      CONCRETE STEPS:
      1. Write `scripts/experiment_1806_dtm_sim.py` using `thrml` to run diffusion-like sampling.
      2. Measure distribution convergence and `thrml_import_ready`.
      3. Output `{project_root}/results/experiment_1806_dtm.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1807-eddp-benchmarking
    title: 'Exp 1807: EDDP benchmarking of the DTM simulator'
    prompt: |
      CONTEXT: The Energy-Delay-Deficiency Product (EDDP) is the new rigorous metric for thermodynamic computers (arXiv:2601.04358).
      EXISTING CODE TO READ FIRST: scripts/experiment_1806_dtm_sim.py
      TASK: Benchmark the DTM simulator against baseline MCMC using the EDDP metric.
      CONCRETE STEPS:
      1. Write `scripts/experiment_1807_eddp.py`.
      2. Compute Energy, Delay, and Deficiency metrics for both `thrml` and `ParallelIsingSampler`.
      3. Output `{project_root}/results/experiment_1807_eddp.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1808-capstone-qwen
    title: 'Exp 1808: Capstone E2E Pipeline with Qwen3.6-35B-A3B'
    max_turns: 50
    prompt: |
      CONTEXT: Capstone testing of Phase 16 improvements on flagship MoE.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verify_repair.py
      TASK: Run the full E2E pipeline incorporating the DPO adapter and KAN MILP verifier on Qwen3.6-35B-A3B.
      CONCRETE STEPS:
      1. Write `scripts/experiment_1808_capstone_qwen.py` using the MODEL_SPECS config for `unsloth/Qwen3.6-35B-A3B-GGUF`.
      2. Run the E2E verification loop and record `repair_success_rate`.
      3. Output `{project_root}/results/experiment_1808_qwen.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
