- id: exp908-estimation-verifier
  milestone: 2026.04.70
  deliverable: results/experiment_908_estimation_verifier.json
  max_turns: 40
  gated_on: "results/experiment_907_svamp_root_cause_v2.json labeling_mismatch_confirmed == True"
  title: 'Exp 908: EstimationVerifier — Range-Based Word Problem Checking (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 907 confirmed FoVer labeling is inapplicable to SVAMP single-step
    word problems (labeling_mismatch_confirmed=True). The fix: an EstimationVerifier
    that checks whether the LLM's numeric answer falls within a plausible arithmetic
    range for the question, without requiring CoT step labeling.

    GATE CHECK (run first): Read results/experiment_907_svamp_root_cause_v2.json.
    If labeling_mismatch_confirmed != True: write artifact with
    honest_verdict="skipped_gate_blocked_mismatch_not_confirmed" and exit.

    EXISTING CODE TO READ FIRST:
    - results/experiment_907_svamp_root_cause_v2.json — gate result, labeling stats
    - python/carnot/verify/fover_labeler.py — FoVer (for reference; do NOT extend)
    - python/carnot/pipeline/three_tier_pipeline.py — pipeline (for integration point)
    - openspec/capabilities/verify/spec.md — REQ-VER-085 (added in Exp 907)

    TASK: Implement EstimationVerifier. Run on 20 SVAMP questions. Measure
    svamp_auc improvement vs FoVer baseline (0.125).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. GATE CHECK: read Exp 907 result. Skip if gate blocked.
    3. Create python/carnot/verify/estimation_verifier.py:
       class EstimationVerifier:
         __init__(self, plausibility_multiplier: float = 10.0):
           self.multiplier = plausibility_multiplier
         verify(self, question: str, response: str) -> VerificationResult:
           1. Extract all numbers from question text (operands)
           2. Compute plausible_range = [min_operand / multiplier,
                                         max(all_operands) * all_numbers_count * multiplier]
           3. Extract numeric answer from response (last number or "= N" pattern)
           4. violation_prob = 0.0 if answer in plausible_range else 1.0
           5. Return VerificationResult(violation_prob=violation_prob,
                                        plausible_range=plausible_range,
                                        extracted_answer=answer)
    4. Add spec entry: SCENARIO-VER-085a (EstimationVerifier correctly ranges SVAMP questions).
    5. Create scripts/experiment_908_estimation_verifier.py:
       a. Load 20 SVAMP questions + correct answers.
       b. Run Qwen3.5-0.8B (CPU) to generate responses.
       c. Run EstimationVerifier on all (question, response) pairs.
       d. Compute svamp_auc using EstimationVerifier.violation_prob as discriminator.
       e. Compare: svamp_auc_estimation vs svamp_auc_fover_baseline (0.125).
       f. signed_improvement = svamp_auc_estimation - 0.125
       g. honest_verdict:
          "svamp_auc_improved" if svamp_auc_estimation > 0.5 (closes RETRO-SVAMP-ZERO-AUC)
          "svamp_auc_marginal" if svamp_auc_estimation > 0.125
          "svamp_auc_no_improvement" if svamp_auc_estimation <= 0.125
    6. If honest_verdict == "svamp_auc_improved":
       Mark RETRO-SVAMP-ZERO-AUC as closed in MILESTONE_PREREQS.md and ops/changelog.md.
    7. Write tests with 100% coverage. Test EstimationVerifier range logic.
       Traces to REQ-VER-085, SCENARIO-VER-085.
    8. Write results/experiment_908_estimation_verifier.json.
    9. Update ops/changelog.md: one-line entry.
    10. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_908_estimation_verifier.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp909-lagrange-forgetting-curve
  milestone: 2026.04.70
  deliverable: results/experiment_909_lagrange_forgetting_curve.json
  max_turns: 40
  title: 'Exp 909: Lagrange Forgetting Curve — FR-11 Tier 1 Adaptive Weight Decay (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: FR-11 Self-Learning Loop Tier 1 (Lagrange multiplier weight updates) was
    confirmed working in milestone .67. However the Lagrange weights never decay for
    constraints that have not been violated recently. This leads to weight accumulation
    and increased Tier 3 rejection rate over time. This experiment implements an
    exponential forgetting curve: weights decay toward a floor between updates, modeling
    the intuition that constraints not recently violated are less urgently enforced.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/lagrange_updater.py — LagrangeMultiplierUpdater (Tier 1)
    - python/carnot/pipeline/constraint_memory.py — ConstraintMemory (Tier 2)
    - results/experiment_883_vjepa_v2_expanded_corpus.json — pipeline baseline metrics
    - openspec/capabilities/self_learning/spec.md — FR-11 requirements
    - openspec/change-proposals/research-roadmap-v70.md — .70 Phase 3 design

    TASK: Add exponential weight decay to LagrangeMultiplierUpdater. Measure impact
    on weight distribution entropy and Tier 3 rejection rate.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/pipeline/lagrange_updater.py fully. Understand current
       update rule: weight += learning_rate * constraint_violation_indicator.
    3. Implement forgetting curve extension:
       In LagrangeMultiplierUpdater.__init__: add decay_rate: float = 0.95 parameter.
       In LagrangeMultiplierUpdater.update(): before the gradient step, apply:
         self.weights *= self.decay_rate  # exponential decay toward 0
         self.weights = np.clip(self.weights, self.weight_floor, self.weight_ceiling)
       Add property weight_entropy -> float:
         p = self.weights / self.weights.sum()
         return -np.sum(p * np.log(p + 1e-10))
    4. Add spec entries: REQ-SELF-007 (Lagrange forgetting curve reduces weight staleness),
       SCENARIO-SELF-007 (weight entropy stays above floor after 100 update steps).
    5. Create scripts/experiment_909_lagrange_forgetting_curve.py:
       a. tmpl = ExperimentTemplate(909, ..., requires_gpu=False). tmpl.setup().
       b. Construct synthetic constraint violation sequence: 100-step simulation.
          Steps 1-50: high violation rate (violation=1 with prob 0.7).
          Steps 51-100: low violation rate (violation=1 with prob 0.1).
       c. Run both: baseline (no decay) and decay=0.95 LagrangeUpdater.
       d. Measure at each 10-step interval: weight_entropy, max_weight, mean_weight,
          tier3_rejection_rate (simulated as fraction weights > threshold).
       e. Compute: entropy_sustained_with_decay (entropy at step 100, decay=0.95)
                   entropy_collapse_without_decay (entropy at step 100, no decay)
                   signed_entropy_improvement = entropy_with_decay - entropy_without_decay
       f. honest_verdict:
          "forgetting_curve_improves_entropy" if signed_entropy_improvement > 0.5
          "marginal_improvement" if signed_entropy_improvement > 0
          "no_improvement" otherwise
    6. Write tests. Traces to REQ-SELF-007.
    7. Write results/experiment_909_lagrange_forgetting_curve.json.
    8. Update ops/changelog.md: one-line entry.
    9. tmpl.assert_deliverable_written() as final line.

