      0. PRECONDITIONS:
         a. Read results/experiment_2665_vegas_candidate_selection.json.
            Confirm vegas_viable=true.
            If absent or False: write honest_verdict 'blocked_vegas_not_viable' and exit.
         b. `.venv/bin/python -c "import sys; sys.path.insert(0, 'python'); import carnot.pipeline"` — importable.
