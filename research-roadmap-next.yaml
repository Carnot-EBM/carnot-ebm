    title: "PHASE C (CONTINUOUS SELF-LEARNING; mandated; PIVOT to the working+compounding mechanism) -- a learned A* ACTION-COST heuristic for ARC ACTION-EFFICIENCY, trained on our OWN solved-level traces. Cross-game VALUE-TRANSFER is RETIRED (3 powered nulls: exp4318 generic features, exp4331 learned-frame encoder, exp4342 action-role encoder -- all reduction ~1.0, on the exclusion manifest; the registry's own conclusion: generic/learned grid features do NOT transfer a search-value signal). The self-learning mandate PIVOTS to the mechanism the registry shows WORKS and COMPOUNDS: the per-game learned verifier (lp85: trained on L1-L2, cut HELD-OUT L3 search 9.36x). .402 advances it from a steps-to-go VALUE head (search-compute) to a learned PATH-COST heuristic that produces ACTION-MINIMAL plans -- directly serving the north-star EFFICIENCY axis (fewer ENV actions per solve / lower RHAE, the second first-class north-star metric), NOT just search compute. Train an A* path-cost heuristic on the 21 solved-level traces (state -> minimal-actions-to-win), wire it into the OfflineSolver/graph_explore as the A* cost, and measure the ACTIONS-TO-SOLVE reduction vs the current BFS/region-count plans on HELD-OUT levels (leave-some-levels-out), reproduction-gated (only plans that still reproduce count). Emit action_efficiency_improves BARE bool := (held-out actions-to-solve REDUCED vs the baseline planner, with a positive control: a level whose optimal is known). verifier_is_oracle=false (the learned heuristic is not the executable oracle). A null is COMPLETE (the value head already captures the efficiency signal). NO TRM training; do NOT re-attempt cross-game value transfer."
    priority: high
    track: self-learning
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-17 planner self-learning-mandate PIVOT (standing): cross-game value-TRANSFER is RETIRED (exp4318/4331/4342, 3 powered nulls, exclusion manifest). This task is a DIFFERENT mechanism -- a learned A* ACTION-COST heuristic for action-efficiency (north-star efficiency axis), built on the WORKING per-game learned-verifier (arc_value_learner, lp85 9.36x), NOT a 4th cross-game value-transfer attempt. False-positive scope-match vs the retired transfer line; STATED forward difference = path-cost-for-action-minimality, not value-transfer-for-search-compute."
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4353_learned_action_cost_heuristic_efficiency.json
    prompt: |
      CONTEXT: research-program.md "Continuous Self-Learning" (mandated every milestone) + north-star §0 (EFFICIENCY is a
      first-class metric: fewer ENV actions per solve). Cross-game value TRANSFER is RETIRED (3 nulls). The WORKING,
      compounding self-learning mechanism is the per-game learned verifier (arc_value_learner; lp85 cut held-out L3 search
      9.36x). This task advances it from a search-compute VALUE head to an ACTION-COST heuristic that produces
      ACTION-MINIMAL plans -- self-learning that directly lowers the north-star action-efficiency metric. CPU-only,
      offline, zero quota.

      EXISTING CODE TO READ FIRST:
        - python/carnot/agentic/arc_value_learner.py (the LearnedVerifier: state -> steps-to-go; trains on our solve traces) + scripts/arc3_learned_verifier_demo.py (the 9.36x held-out demo)
        - python/carnot/agentic/arc_solver_kit.py (OfflineSolver verifier= ; reproduce()) + python/carnot/agentic/arc_heuristic_select.py (the goal-distance heuristics: cell_count / region_count / bfs; recommend_order) + python/carnot/agentic/arc_graph_explore.py (graph_explore_solve_v2/v3, the A*-style goal heuristic hook)
        - ops/arc_solve_registry.yaml (the 21 solved levels / 13 games -- the training corpus of solve traces; the learning_loop section; the 'Next: A* (path-cost + learned heuristic) for leaderboard action-efficiency' note)
        - results/experiment_4342_self_learning_action_role_cross_game_encoder.json (the RETIRED cross-game transfer null -- do NOT repeat this scope)
        - CLAUDE.md "Missing-Verifier Gap Logging", "ARC Solve Reproducibility + Solver-Reuse Discipline", "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: train a learned A* path-cost (action-cost) heuristic on the solved-level traces; measure the held-out actions-to-solve reduction vs the baseline planner, reproduction-gated.

      CONCRETE STEPS:
        0. PRECONDITIONS: the solved-level trajectories are present (ops/arc_solve_registry.yaml + results/arc_explore_trajectory_*.json + the per-game solvers). If <5 reproduced levels with action traces are loadable -> honest_verdict `blocked_insufficient_solve_traces` and STOP. Conductor stood-down on TRM training (this is CPU heuristic learning, NOT model training).
        1. Build the training corpus: for each reproduced level, extract (state -> minimal-actions-to-win) pairs from the offline-reproduced solve trace. Train an A* PATH-COST heuristic h(state) approximating minimal ENV-actions-to-win (a light regression on generic grid features; CPU). LEAVE-SOME-LEVELS-OUT (held-out split) so the measurement is honest.
        2. Wire h(state) into the OfflineSolver / graph_explore as the A* cost; on the HELD-OUT levels, plan with (a) the baseline (BFS / region-count goal-distance) and (b) A*-with-h; measure ACTIONS-TO-SOLVE for each (the env-action count of the reproduced plan, NOT search expansions). REPRODUCTION-GATE both (a plan only counts if arc_solver_kit.reproduce passes). POSITIVE CONTROL: include >=1 level whose optimal action-count is known (a short solve) so a no-reduction is distinguishable from no-headroom.
        3. Emit action_efficiency_improves BARE bool := (held-out total actions-to-solve with A*-h < baseline, AND the positive control confirms headroom existed). Log any level where the heuristic could NOT reduce actions as a missing-verifier gap (ops/verifier_gaps.md). Run adversarial_verify.py (clean; FALSE_NEGATIVE_RISK aware -- a null with the positive control passing is informative). Declare random_seed + reproducibility_checksum.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An action-efficiency improvement (the learned heuristic lowers env-actions-to-solve on held-out levels) and an honest null with the positive control passing (the value head already captures it) are BOTH decision-grade."
        action_efficiency_improves:
          principle: "BARE bool: the capstone reads this; true iff held-out actions-to-solve is REDUCED with the learned A* path-cost heuristic vs the baseline planner AND the positive control confirms headroom existed (not a degenerate no-headroom null)."
        held_out_actions_baseline:
          principle: "BARE int: total env-actions-to-solve across held-out levels with the baseline planner -- the efficiency baseline."
        held_out_actions_learned:
          principle: "BARE int: total env-actions-to-solve across held-out levels with the learned A* heuristic -- the efficiency result (lower is better; the north-star action-efficiency metric)."
        positive_control_passed:
          principle: "BARE bool: a level with known optimal action-count confirms headroom existed, so a null is 'the value head already captures it', not 'no headroom' (FALSE_NEGATIVE_RISK guard)."
        reproduction_gated:
          principle: "BARE bool: true iff every counted plan still passes arc_solver_kit.reproduce -- an action-minimal plan that does not reproduce does NOT count."
        verifier_is_oracle:
          principle: "BARE bool=false -- the learned action-cost heuristic is not the executable oracle."
        preconditions_checked:
          principle: "Records the solve-trace availability + TRM-stand-down; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the heuristic training + the held-out split + the planning."
        reproducibility_checksum:
          principle: "Hash of the training corpus + the held-out split + the heuristic config; lets a third party re-run."
      ACCEPTANCE GATE:
        - condition: "action_efficiency_improves + held_out_actions_baseline + held_out_actions_learned + positive_control_passed + reproduction_gated reported with verifier_is_oracle=false and preconditions_checked, OR an honest blocked_insufficient_solve_traces verdict"
          principle: "A learned heuristic that lowers env-actions-to-solve is continuous self-learning that COMPOUNDS (each solve improves the next) AND serves the north-star EFFICIENCY axis -- the working mechanism, distinct from the RETIRED cross-game value-transfer line."

      Run: `python3 {project_root}/results/experiment_4353_learned_action_cost_heuristic_efficiency.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

