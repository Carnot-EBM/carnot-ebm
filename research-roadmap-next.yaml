        verdict: blocked_baseline_pytest_coverage
        addressed_by: "exp4455 (.412 A1) NEVER attempted the dc22 CEGIS solve -- its PRECONDITIONS ran `.venv/bin/pytest -k \"config_rule or arc_solver_kit\" -q`, which inherits the global --cov-fail-under=99 from pyproject addopts; a -k subset = 26.71% coverage = exit 1, and the codex agent treated exit-1 as a hard block (honest_verdict blocked_baseline_pytest_coverage, dc22_grounded=false, counterexample_rounds=0, inference_substrate=precondition_blocked_no_inference). The .411 SUCCESSFUL solve (exp4446) used `--no-cov` and ran clean. This attempt is DIFFERENT: (1) the PRECONDITIONS pytest command uses `--no-cov` (a smoke gate, not a coverage gate) so the counterexample-guided grounding loop ACTUALLY RUNS; (2) the durable B2 lint flags any ARC precondition missing --no-cov so this never recurs. The root cause was a brittle precondition design, NOT a dc22 research dead-end -- the CEGIS approach has never had a real attempt."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: dc22 is the LAST OPEN ARC config/toggle first-contact game (GAP-4423-DC22). It is a
      config/toggle maze: navigate the player sprite (jfva) to the goal (goknoi); clickable buezna sprites
      toggle piyqze blockers to open a path (is_spatial_planning=false per the survey, medium). The .411
      generic config_rule_verifier (exp4444) re-solved ft09 generically but proposed a predicate for dc22
      that did NOT ground (dc22_state=not_grounded). The .412 attempt (exp4455) DESIGNED a
      counterexample-guided grounding loop but was BLOCKED at the pytest-coverage precondition and never
      ran. .413 runs it with the corrected --no-cov precondition.
      EXISTING CODE TO READ FIRST: results/experiment_4455_solve_dc22_cegis_config_rule.json (the .412
      blocked artifact -- note baseline_exit_code=1, baseline_failure='Coverage failure ... 26.71% < 99%'),
      python/carnot/experiment_4444_generic_config_rule_verifier_operator.py +
      results/experiment_4444_generic_config_rule_verifier_operator.json (the operator + the dc22
      not-grounded residual), python/carnot/experiment_4446_drive_generic_first_contact_bank.py (the
      SUCCESSFUL .411 solve -- copy its `--no-cov` pytest precondition pattern, around line 220),
      python/carnot/agentic/arc_solver_kit.py (config_rule_verifier + reproduce),
      python/carnot/agentic/arc_solve_learning.py (recommend_approach), python/carnot/agentic/arc_game_adapters.py
