milestone: "2026.05.191"
milestone_title: "ActFocus Agentic RL + KAN-CL Continual Learning + Thermodynamic Langevin Sampler"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1826-kan-cl-implementation
    title: "Exp 1826: Implement Per-Knot Importance Regularization for KAN continual learning"
    deliverable: "python/carnot/models/kan_cl.py"
    agent_type: codex
    prompt: |
      CONTEXT: The PRD mandates continuous self-learning, but past attempts suffered from catastrophic forgetting in the KAN energy tiers. A new paper (KAN-CL, arXiv 2605.11181) proposes per-knot importance regularization.
      EXISTING CODE TO READ FIRST: python/carnot/models/kan.py
      TASK: Implement the KAN-CL algorithm for our Kolmogorov-Arnold Network implementation in {project_root}.
      CONCRETE STEPS:
      1. Extend the KAN implementation in python/carnot/models/kan_cl.py.
      2. Add importance weight tracking for B-spline knots during training.
      3. Implement the regularization penalty term for subsequent learning phases.
      4. Write a unit test ensuring the penalty computes correctly.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1827-muon-ogd-projection
    title: "Exp 1827: Implement Muon-OGD Spectral Orthogonal Gradient Projection"
    deliverable: "python/carnot/models/muon_ogd.py"
    agent_type: codex
    prompt: |
      CONTEXT: We are exploring multiple paths for continuous learning (FR-11). Muon-OGD (arXiv 2604.14818) uses spectral orthogonal gradient projections to protect previously learned knowledge during LLM continual learning.
      EXISTING CODE TO READ FIRST: python/carnot/models/continual_gibbs.py
      TASK: Implement the Muon-OGD optimizer/wrapper for our continual learning stack.
      CONCRETE STEPS:
      1. Create python/carnot/models/muon_ogd.py.
      2. Implement a custom Optax optimizer or wrapper that computes orthogonal projections of gradients based on a running memory matrix.
      3. Add a basic smoke test.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1828-continual-learning-eval
    title: "Exp 1828: Evaluate KAN-CL vs Muon-OGD on FR-11 retention task"
    deliverable: "results/experiment_1828_cl_eval.json"
    prompt: |
      CONTEXT: We need to determine the canonical continual learning technique for Phase 4. We will evaluate KAN-CL and Muon-OGD on retention of logic constraints using the Fast-Slow Variant data from milestone .190.
      EXISTING CODE TO READ FIRST: scripts/experiment_template.py, python/carnot/models/kan_cl.py, python/carnot/models/muon_ogd.py
      TASK: Write an evaluation script that simulates sequential task learning and measures catastrophic forgetting.
      CONCRETE STEPS:
      1. Create scripts/experiment_1828_cl_eval.py.
      2. Use unsloth/gemma-4-31B-it-GGUF as the baseline reference model in MODEL_SPECS.
      3. Train sequentially on two disjoint constraint sets.
      4. Measure retention on set 1 after training on set 2.
      5. Output results to {project_root}/results/experiment_1828_cl_eval.json.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1829-actfocus-token-energy
    title: "Exp 1829: Implement ActFocus Token-Level Energy Reweighting for GRPO"
    deliverable: "python/carnot/pipeline/actfocus_grpo.py"
    prompt: |
      CONTEXT: Agentic RL approaches like GRPO treat all tokens equally. ActFocus (arXiv 2605.14558) weights tokens using an energy function to focus updates on reasoning/action bottlenecks.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/generation.py
      TASK: Implement ActFocus token reweighting.
      CONCRETE STEPS:
      1. Create python/carnot/pipeline/actfocus_grpo.py.
      2. Implement a function that computes token-level energy from logits and applies it as a masking/weighting factor for policy gradients.
      3. Write unit tests validating that high-energy (surprising/critical) tokens receive larger weights.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1830-actfocus-grpo-training
    title: "Exp 1830: Train model using ActFocus GRPO on reasoning trajectories"
    deliverable: "results/experiment_1830_actfocus_train.json"
    gated_on:
      - upstream: exp1829-actfocus-token-energy
        artifact_field: status
        op: "=="
        value: "success"
    prompt: |
      CONTEXT: We need to validate the ActFocus approach on a real model.
      EXISTING CODE TO READ FIRST: scripts/experiment_template.py, python/carnot/pipeline/actfocus_grpo.py
      TASK: Write a training loop for ActFocus GRPO.
      CONCRETE STEPS:
      1. Create scripts/experiment_1830_actfocus_train.py.
      2. Load unsloth/gemma-4-26B-A4B-it-GGUF.
      3. Simulate a short GRPO update step using ActFocus weights on a mocked batch of GSM8K-like reasoning trajectories.
      4. Output the training dynamics (loss, weight distribution) to the deliverable file.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

