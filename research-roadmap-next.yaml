tasks:
- id: exp6768-targetable-proof-panel-expansion
  title: Exact-invalid targetable proof panel expansion
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 90
  per_unit_rows: true
  milestone: 2026.08.590
  deliverable: results/experiment_6768_targetable_proof_panel_expansion.json
  prompt: |
    CONTEXT:
    Exp6755 losslessly replayed all 216 SOTA proof outputs and found 11 exact-valid rows. It also
    found only 21 parseable exact-invalid rows covered by the planned environment-grammar error
    classes. Exp6756 required 24, so the conductor correctly closed that branch before code or LLM
    work. Lowering the threshold would not add evidence. This task creates a powered, exact-audited
    panel by applying answer-blind certificate counterfactuals to the observed failure shapes.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md and
      {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_6755_lossless_gguf_output_reparse.json
    - {project_root}/results/experiment_6745_sota_dual_encoding_proposal_corpus.json
    - {project_root}/python/carnot/experiment_6745_certificate_encoder_a.py and
      {project_root}/python/carnot/experiment_6745_certificate_encoder_b.py
    - {project_root}/python/carnot/experiment_6755_lossless_gguf_output_reparse.py
    - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/conductor-log.md

    TASK:
    Build a frozen panel of at least 36 parseable exact-invalid certificate rows across all held
    proof families. Expand only with deterministic, answer-blind counterfactual operators over
    source candidates. Preserve provenance and exact failure receipts. Do not call an LLM and do
    not change the Exp6755 artifact.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6755 to parse, declare transport_reparse_ready=true, contain 216
       unique rows, preserve raw and normalized hashes, expose exactly 21 targetable source rows,
       and preserve the Exp6745 source-row lineage. On failure write
       complete_blocked_targetable_panel with the failed check and observed value in
       gate_check_summary, then stop.
    1. Confirm the relevant REQ-* anchors in
       openspec/capabilities/verifiable-reasoning/spec.md and
       openspec/capabilities/research-reporting/spec.md. Add only a narrow missing requirement and
       focused tests before implementation.
    2. Freeze source row IDs and define deterministic operators for undefined variable, invalid
       clause, non-binary value, duplicate evidence, missing evidence, and premature terminal.
       Operators may read certificate structure and the problem environment. They may not read the
       answer label, exact-valid bit, solver trace, or a ground-truth certificate.
    3. Preserve the CNF, family, size, source output and hash, mutation operator, target region,
       before/after certificate, parser receipt, both encoder receipts, and exact failure receipt.
       Keep every mutation within one preregistered error class.
    4. Build at least 36 unique rows. Require every held family and every target class to have at
       least two rows. Keep proof-preserving relabel pairs in the same split and record pair IDs.
    5. Reject any mutation that becomes exact-valid, unparsable, duplicates another row, changes
       the source problem, or lacks an attributable smallest responsible region.
    6. Emit one rows entry per candidate mutation. Derive all counts, strata, and hashes only from
       rows. Cold-replay the parser, encoders, and exact checker in a fresh process.
    7. Set targetable_panel_ready only when the row count, class and family coverage, leakage,
       uniqueness, cold replay, and provenance checks all pass. Readiness is a fixture property,
       not a model-quality claim.
    8. Run focused tests, lint, spec coverage, adversarial verification, and row-consistency lint.
    9. REQUIRED ARTIFACT FIELDS: field_principles (one-line purpose for every required field,
       including itself); inference_substrate (deterministic local certificate mutation with no
       LLM); duration_s (monotonic task wall time); random_seed (fixed operator and ordering seed);
       reproducibility_checksum (hash of inputs, code, and rows); source_artifact_sha256 (binds the
       Exp6755 input); rows (one receipt per source and mutation); targetable_row_count (cold
       row-derived panel size); counts_by_family (coverage by held family); counts_by_error_class
       (coverage by target class); proof_preserving_relabel_receipts (pair invariance evidence);
       future_or_answer_features_read (must be empty); exact_valid_mutations (must be zero);
       duplicate_rows (must be zero); targetable_panel_ready (all fixture gates boolean, and the
       exact field consumed by Exp6769); gate_check_summary (failed check and observed value for
       any blocked_* verdict); verifier_is_oracle (false because exact checks evaluate mutations
       but do not generate them); verdict_class (closed enum: positive | circular_positive | null |
       blocked | disqualified | partial); and honest_verdict (terminal result; MUST start with
       complete: / complete_ / success: / success_ / passed: / passed_ / shipped: / shipped_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6768_targetable_proof_panel_expansion.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6756-environment-indexed-proof-grammar-fixture
      verdict: 'blocked_gate_check_failed: exp6755 environment_grammar_targetable_rows observed 21, expected at least 24'
      addressed_by: 'This task does not lower the old gate or rerun the grammar. It creates a larger answer-blind, exact-audited counterfactual panel with family and error-class coverage before the grammar agent runs.'
      retire_if_same_verdict: true

- id: exp6769-environment-indexed-proof-grammar-v2
  title: Environment-indexed proof grammar fixture v2
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.08.590
  deliverable: results/experiment_6769_environment_indexed_proof_grammar_v2.json
  gated_on:
    - upstream: exp6768-targetable-proof-panel-expansion
      artifact_field: targetable_panel_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6756 never ran because its 24-row prerequisite saw only 21 targetable rows. Exp6768 changes
    that prerequisite by producing a powered, answer-blind panel. Decode-Time Grammars
    (arXiv:2607.18357) refines grammar fragments from a runtime environment. DCCD
    (arXiv:2603.03305) separates semantic drafting from structural rendering. Carnot previously
    retired schema-supported ConstraintIR after zero exact semantics. This task uses a different
    mechanism: instance-bound variables, clause IDs, domains, uniqueness, and completion state
    enforced during token generation.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, section V590 Planner Refresh - 2026-08-30
    - {project_root}/results/experiment_6768_targetable_proof_panel_expansion.json
    - {project_root}/results/experiment_6755_lossless_gguf_output_reparse.json
    - {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
    - {project_root}/python/carnot/experiment_6745_sota_dual_encoding_proposal_corpus.py
    - {project_root}/tests/python/test_experiment_1312_triggered_certificate_extraction_dccd_gbnf.py
    - {project_root}/tests/python/test_experiment_1352_truncproof_xgrammar_certificate_completion_preflight.py
    - {project_root}/tests/python/test_experiment_1339_xgrammar2_tagdispatch_certificate_grammar_dryrun.py
    - Primary sources arXiv 2607.18357, 2603.03305, and 2601.14290.

    TASK:
    Build and adversarially test an environment-indexed runtime grammar for Carnot's proof DSL.
    Prove that the invoked token-mask path preserves exact-valid SAT and UNSAT support while making
    ghost symbols, invalid values, duplicates, and incomplete terminals unreachable. Add the
    draft-conditioned rendering interface but do not run a live SOTA comparison.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6768 targetable_panel_ready=true, at least 36 rows, every held
       family and target class represented, local grammar backend import, and exact checker import.
       On failure write complete_blocked_dynamic_grammar_v2 with gate_check_summary.
    1. Confirm or add narrow REQ-* anchors in
       openspec/capabilities/verifiable-reasoning/spec.md. Write focused tests first.
    2. Define a runtime environment per CNF with the exact variable set, clause-ID set, binary
       domain, claim branch, remaining required slots, and used-symbol state. Do not include the
       answer label or current-row exact outcome.
    3. Implement prefix-dependent policy resolution for SAT, UNSAT, and ABSTAIN. Record actual
       grammar or mask invocations. A post-hoc parser filter, canned fixture, or exact-answer mask
       is disqualified.
    4. Implement a draft-conditioned renderer that consumes only the model draft and runtime
       environment. It may preserve intent. It may not call the exact checker or synthesize a
       ground-truth proof.
    5. Build exact-valid fixtures and attacks for undefined variables, invalid clauses, non-binary
       values, duplicates, premature stop, extra text, confusables, adversarial prefixes, and
       support collapse. Compare static CFG, environment-indexed, and draft-conditioned behavior.
    6. Prove at least one exact-valid SAT and UNSAT certificate remains reachable per supported size
       bin. Record support receipts. Do not claim enumeration of all valid proofs.
    7. Set dynamic_proof_grammar_ready only when runtime invocation, no-ghost, reachability, parser,
       exact-authority separation, determinism, and focused tests pass. This is the exact gate field
       consumed by Exp6770.
    8. Run focused tests, lint, spec coverage, adversarial verification, and row consistency.
    9. REQUIRED ARTIFACT FIELDS: field_principles (one-line purpose for every required field);
       inference_substrate (invoked local runtime grammar fixture with no LLM); duration_s
       (monotonic task wall time); random_seed (fixed attack and fixture seed);
       reproducibility_checksum (hash of code, inputs, and rows); source_artifact_sha256 (binds
       Exp6768); gamma_schema (runtime environment contract); rows (one row per mode, fixture, and
       attack); runtime_mask_invocation_count (proves live token-policy calls); no_ghost_violations
       (must be zero); valid_sat_reachable (support receipt boolean); valid_unsat_reachable (support
       receipt boolean); support_contraction_receipts (reachable-support checks);
       exact_authority_features_in_grammar (must be empty); dynamic_proof_grammar_ready (all fixture
       gates boolean and exact field consumed by Exp6770); gate_check_summary (failed check and
       observed value for blocked_*); verifier_is_oracle (false because exact authority is excluded
       from the mechanism); verdict_class (closed enum: positive | circular_positive | null |
       blocked | disqualified | partial); and honest_verdict (terminal result; MUST start with
       complete: / complete_ / success: / success_ / passed: / passed_ / shipped: / shipped_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6769_environment_indexed_proof_grammar_v2.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6756-environment-indexed-proof-grammar-fixture
      verdict: 'blocked_gate_check_failed: exp6755 environment_grammar_targetable_rows observed 21, expected at least 24'
      addressed_by: 'Exp6768 now supplies at least 36 exact-audited targetable rows with required family and class coverage, so this grammar task no longer depends on the failed 21-row gate.'
      retire_if_same_verdict: true
    - experiment_id: exp5923-sota-schema-supported-constraintir-ab
      verdict: 'retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates'
      addressed_by: 'The new mechanism invokes an instance-bound prefix policy over live variables, clauses, domains, uniqueness, and completion, and proves SAT and UNSAT support before any model run.'
      retire_if_same_verdict: true

- id: exp6770-dccd-environment-grammar-ab-v2
  title: Three-model DCCD environment-grammar A/B v2
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 360
  per_unit_rows: true
  milestone: 2026.08.590
  deliverable: results/experiment_6770_dccd_environment_grammar_ab_v2.json
  gated_on:
    - upstream: exp6769-environment-indexed-proof-grammar-v2
      artifact_field: dynamic_proof_grammar_ready
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Exp6755 closed the bytes-to-text transport bug. Exp6768 expands the exact-invalid panel, and
    Exp6769 supplies an invoked runtime grammar. This experiment asks whether static grammar or
    draft-conditioned environment grammar raises exact certificate yield on the mandated local
    SOTA families. Parseability is not success. Exact semantics is the headline.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/scripts/experiment_template.py and cached_sota_pair()
    - {project_root}/results/experiment_6768_targetable_proof_panel_expansion.json
    - {project_root}/results/experiment_6769_environment_indexed_proof_grammar_v2.json
    - {project_root}/results/experiment_6755_lossless_gguf_output_reparse.json
    - {project_root}/python/carnot/experiment_6745_sota_dual_encoding_proposal_corpus.py
    - {project_root}/python/carnot/inference and local llama.cpp lifecycle helpers
    - Primary sources arXiv 2607.18357, 2603.03305, 2604.03616, and 2607.17047.

    TASK:
    Run a paired three-arm, three-model local GGUF comparison on a frozen family- and
    size-stratified proof set. Compare repaired direct output, static grammar, and
    draft-conditioned environment-indexed grammar under matched total generation and exact-check
    budgets. Report exact-valid yield and semantic failures, not syntax alone.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF: flagship MoE headline model.
    - unsloth/gemma-4-31B-it-GGUF: flagship dense headline model.
    - unsloth/gemma-4-26B-A4B-it-GGUF: middle MoE headline model.
    Resolve exact cached GGUF files and embedded tokenizers. Use llama.cpp CUDA. Load models one at
    a time and tear each down before the next. Legacy small models are labeled CPU smoke tests only
    and cannot satisfy a gate. Remote inference cannot replace a missing local model.

    CONCRETE STEPS:
    0. PRECONDITIONS: require dynamic_proof_grammar_ready=true; freeze at least 36 Exp6768 rows
       balanced by held family, size, error class, SAT/UNSAT role, and relabel role; resolve every
       MODEL_SPEC; and confirm hashes, tokenizer, CUDA offload, task-owned lease, one-model VRAM,
       ports, exact authority, RAM, and disk. On failure write complete_blocked_proof_transport_ab_v2
       with gate_check_summary and no CPU or remote headline fallback.
    1. Confirm the relevant REQ-* anchors. Write focused tests for pairing, runtime invocation,
       budget equality, teardown, cold reducers, and blocked artifacts before live execution.
    2. Freeze instance IDs, model order, arm-order rotation, seeds, prompts, context, total output
       tokens, DCCD draft/render split, stop rules, temperatures, and exact-check budget.
    3. Run three arms per model-instance cell: repaired direct output; static syntax grammar; and an
       unconstrained semantic draft followed by environment-indexed constrained rendering. Match
       total generated-token ceilings across arms.
    4. Record actual grammar-policy calls. Disqualify a constrained arm if it falls back to
       post-hoc filtering, a fixture, a substituted model, or answer-conditioned masks.
    5. Preserve raw output, hashes, parsed proof, both encoder receipts, exact result, latency,
       tokens, device, peak VRAM, seed, stop reason, and failure for every row.
    6. Compute paired exact-valid delta, semantic-correct delta, parseability, abstention,
       invalid-reference rate, invalid-domain rate, support contraction, token cost, and latency by
       model, family, size, error class, and relabel role. Solver conflicts remain metadata.
    7. Set proof_transport_ab_completed when every planned row is attributable, cold aggregate
       recomputation agrees, and teardown passes. Completion does not require a positive delta.
       This is the exact gate field consumed by Exp6771.
    8. Run focused tests, lint, spec coverage, applicable CUDA E2E checks, adversarial verification,
       and row-consistency lint.
    9. REQUIRED ARTIFACT FIELDS: field_principles (one-line purpose for every required field);
       inference_substrate (local llama.cpp CUDA GGUF with invoked runtime grammar); duration_s
       (monotonic task wall time); random_seed (frozen paired seed schedule);
       reproducibility_checksum (hash of manifest, code, and rows); model_specs (exact hub IDs,
       paths, hashes, roles, tokenizers, and limits); models_used (models that actually produced
       rows); live_model_invoked (true only after real first-token inference); frozen_manifest
       (instances, arms, orders, and budgets); gpu_receipts (lease, offload, VRAM, and teardown);
       rows (every model-instance-arm unit); runtime_mask_invocations_by_arm (actual policy calls);
       exact_valid_rate_by_arm (row-derived exact headline); semantic_correct_rate_by_arm
       (row-derived semantic outcome); paired_exact_valid_deltas (paired arm effects);
       support_contraction_by_arm (valid-support loss); proof_transport_ab_completed (row and
       teardown completeness boolean, exact field consumed by Exp6771); claim_boundary (exact
       validity, not parseability); gate_check_summary (failed check and observed value for
       blocked_*); verifier_is_oracle (false because exact authority evaluates but is not an arm);
       verdict_class (closed enum: positive | circular_positive | null | blocked | disqualified |
       partial); and honest_verdict (terminal result; MUST start with complete: / complete_ /
       success: / success_ / passed: / passed_ / shipped: / shipped_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6770_dccd_environment_grammar_ab_v2.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6757-dccd-environment-grammar-ab
      verdict: 'GATE_BLOCK: preempted after exp6756 retired on the 21 below 24 targetable-row gate; no artifact was produced'
      addressed_by: 'The new chain first expands and cold-validates at least 36 targetable rows, then proves the invoked grammar fixture under a fresh in-roadmap gate before this SOTA run.'
      retire_if_same_verdict: true
    - experiment_id: exp5923-sota-schema-supported-constraintir-ab
      verdict: 'retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates'
      addressed_by: 'This A/B uses a proof DSL with runtime instance-bound masks, DCCD, and exact-valid headline metrics rather than another schema-supported prompt.'
      retire_if_same_verdict: true

- id: exp6771-proof-transport-localization-audit
  title: Independent proof transport and localization audit
  track: verifiable-reasoning
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.08.590
  deliverable: results/experiment_6771_proof_transport_localization_audit.json
  gated_on:
    - upstream: exp6770-dccd-environment-grammar-ab-v2
      artifact_field: proof_transport_ab_completed
      op: '=='
      value: true
  prompt: |
    CONTEXT:
    Structured generation can improve syntax while shrinking semantic support. Exp6770 therefore
    needs a cold evaluator that does not import its parser, exact checker, or reducers. Project
    Aletheia (arXiv:2601.14290) and Claim-Level Reliability Assessment (arXiv:2608.11994) motivate
    explicit conflict localization before backtracking. This task audits the comparison and creates
    a repair panel using only pre-oracle grammar conflicts and certificate structure.

    Work at {project_root}. The planning date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6770_dccd_environment_grammar_ab_v2.json
    - {project_root}/results/experiment_6769_environment_indexed_proof_grammar_v2.json
    - {project_root}/results/experiment_6768_targetable_proof_panel_expansion.json
    - {project_root}/results/experiment_6758_proof_transport_independent_audit.json
    - {project_root}/scripts/adversarial_verify.py and
      {project_root}/scripts/verdict_row_consistency_lint.py
    - Primary sources arXiv 2601.14290, 2608.11994, and 2607.17047.

    TASK:
    Cold-recompute Exp6770 with an independently implemented parser, exact checker, and reducer.
    Verify runtime invocation, matched budgets, support, and leakage. For every parseable
    exact-invalid row, identify the smallest responsible region from grammar-prefix and certificate
    structure without reading the answer or current-row exact result during localization.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp6770 to parse, declare proof_transport_ab_completed=true, contain
       every frozen row, preserve raw hashes, and expose model_specs, runtime calls, budgets, and
       teardown receipts. On failure write complete_blocked_transport_localization_audit with
       gate_check_summary.
    1. Confirm or add narrow audit requirements in
       openspec/capabilities/research-reporting/spec.md and verifiable-reasoning specs. Write cold
       parser, checker, reducer, leakage, and localization tests first.
    2. Implement the cold parser and exact checker without importing Exp6755, Exp6769, or Exp6770
       parser, encoder, checker, grammar, or reducer functions. It may consume the frozen CNF schema.
    3. Recompute parseability, exact validity, semantic correctness, abstention, invalid references,
       paired deltas, and model/family/error strata from rows. Fail closed on producer disagreement.
    4. Inspect prompts, environments, mask traces, and feature manifests for answer labels, current
       exact outcomes, ground-truth proofs, solver labels, or equivalent proxies.
    5. Verify identical total token ceilings, context, seed policy, exact-check budgets, and honest
       DCCD draft-plus-render accounting. Recompute support contraction and harmful flips.
    6. Localize each parseable exact-invalid candidate from the earliest runtime grammar conflict,
       typed-slot inconsistency, duplicate, incomplete region, or encoder structural disagreement.
       Compute the region before calling the cold exact checker for its label.
    7. Set proof_transport_audit_ready only when cold replay, leakage, runtime, and budget checks
       pass. Set repair_panel_ready only when at least 24 attributable parseable exact-invalid rows
       span every held family and at least three conflict classes. These exact fields are consumed
       by Exp6772.
    8. Run focused tests, lint, spec coverage, adversarial verification, and row consistency.
    9. REQUIRED ARTIFACT FIELDS: field_principles (one-line purpose for every required field);
       inference_substrate (cold independent CPU parser, checker, and reducer); duration_s
       (monotonic task wall time); random_seed (fixed audit ordering seed);
       reproducibility_checksum (hash of source, code, and cold rows); source_artifact_sha256
       (binds Exp6770); rows (one cold audit row per source unit); independent_parser_id (cold
       implementation identity); independent_exact_checker_id (cold authority identity);
       independent_reducer_id (cold aggregation identity); aggregate_recomputation (producer versus
       cold metrics); paired_exact_valid_deltas (cold paired effects); support_contraction_by_arm
       (cold support loss); harmful_flips_by_arm (baseline-valid harm); runtime_invocation_verified
       (mask-trace audit); prohibited_feature_findings (answer and oracle leakage checks);
       localization_rows (smallest responsible region per eligible row); localization_feature_manifest
       (pre-oracle inputs only); proof_transport_audit_ready (all-audit boolean, exact field consumed
       by Exp6772); repair_panel_ready (coverage and size boolean, exact field consumed by Exp6772);
       gate_check_summary (failed check and observed value for blocked_*); verifier_is_oracle (false
       because this task evaluates and audits, not proposes); verdict_class (closed enum: positive |
       circular_positive | null | blocked | disqualified | partial); and honest_verdict (terminal
       result; MUST start with complete: / complete_ / success: / success_ / passed: / passed_ /
       shipped: / shipped_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6771_proof_transport_localization_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6758-proof-transport-independent-audit
      verdict: 'blocked_gate_check_failed: upstream exp6757 artifact was not found'
      addressed_by: 'Exp6770 is now gated by a powered panel and invoked grammar fixture and must preserve all raw rows, model_specs, runtime traces, and budgets before this independent audit runs.'
      retire_if_same_verdict: true
    - experiment_id: exp6570-proof-obligation-independent-audit
      verdict: 'blocked_proof_obligation_independent_audit: provenance, spans, compiler, exact release, harm, and cost were not replayable'
      addressed_by: 'The new producer contract preserves raw candidate hashes, exact inputs, runtime traces, budgets, and per-unit rows, and this audit uses separate implementations.'
      retire_if_same_verdict: true

