    gated_on:
      - upstream: exp1727-eqm-sampler
        artifact_field: status
        op: ==
        value: "success"
    prompt: |
      CONTEXT: Benchmarking our EBT + EqM System-2 reasoning stack against GSM8k and MATH using SOTA GGUF models.
      EXISTING CODE TO READ FIRST: scripts/experiment_1727_eqm.py
      TASK: Execute the GSM8k/MATH benchmark.
      CONCRETE STEPS:
      1. Create `{project_root}/scripts/experiment_1728_system2_benchmark.py`.
      2. Use `unsloth/gemma-4-31B-it-GGUF` and the EqM sampler.
      3. Run on a subset of GSM8k and record accuracy and inference latency.
      4. Write results to `{project_root}/results/experiment_1728_system2_benchmark.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1729-kanele-synthesis
