      5. Write tests/python/test_experiment_342_live_extractor_comparison.py (100% coverage required).
      6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      7. Reconcile: update ops/changelog.md, ops/status.md with extractor comparison findings.
      8. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp343-constraint-template-library
    milestone: "2026.05.13"
    deliverable: python/carnot/pipeline/constraint_template_library.py
    title: "Exp 343: ConstraintTemplateLibrary — error patterns generate NEW constraint types (Tier 1+2 fusion)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Research-program.md priority #1: "constraint ADDITION from memory patterns,
      not just weight changes." Exp 134 proved that precision-based REWEIGHTING (upweighting
      existing constraint types when they fire) does NOT improve accuracy — fixed=adaptive
      across all 500 questions. The root cause: if the existing constraint set doesn't cover
      the real error type, upweighting existing constraints just increases noise.

      The fix: when CaseMemory detects that a specific ERROR PATTERN is common (e.g.,
      "carry errors appear in 40% of Qwen3.5-0.8B arithmetic responses"), ADD a new
      constraint template that checks carry propagation — rather than upweighting the
      existing range_check constraint which doesn't catch this error.

      ConstraintTemplateLibrary maps observed error patterns to callable constraint templates.
      Each template is a function that takes a response string and returns a list of
      Constraint objects. When a pattern crosses a frequency threshold in CaseMemory,
      the library instantiates the template and adds it to the active constraint set.

      This implements research-program.md Tier 2 → Tier 1 feedback loop, informed by
      arXiv 2603.03538 (Online CoT verifier learnability bounds) and Eidoku (2512.20664)
      constraint type taxonomy.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/extract.py — ConstraintExtractor protocol, existing extractor types
      - python/carnot/pipeline/case_memory.py — CaseMemory, constraint pattern tracking
      - python/carnot/pipeline/adaptive_thresholds.py — PerModelFPTracker (Exp 333)
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline integration pattern
      - python/carnot/pipeline/__init__.py — exports to extend
      - research-references.md — Eidoku (2512.20664), Online CoT learnability (2603.03538)

      TASK: Implement ConstraintTemplateLibrary for Tier 1+2 constraint addition.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-LEARN-017 (constraint template addition), REQ-LEARN-018 (template threshold),
         SCENARIO-LEARN-029/030/031/032 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - ConstraintTemplate dataclass: pattern_key, description, min_frequency, template_fn,
           is_active bool, activation_count int
         - ConstraintTemplateLibrary():
           - add_template(template: ConstraintTemplate): registers template
           - observe_pattern(pattern_key, model_id, count=1): increments pattern count
           - get_active_templates(model_id) → list[ConstraintTemplate]:
             returns templates where observed_count >= min_frequency
           - apply_active_templates(response, model_id) → list[Constraint]:
             calls template_fn for each active template; collects all constraints
           - to_dict() / from_dict(): serialization for persistence
           - register_builtin_templates(): registers standard templates:
             carry_check (min_freq=5), sign_check (min_freq=5),
             unit_consistency (min_freq=3), comparison_direction (min_freq=5)
         - carry_check_template(response) → list[Constraint]:
           checks multi-digit carry propagation (a * 10 + carry == next_step_value)
         - sign_check_template(response) → list[Constraint]:
           checks that negative × negative = positive, etc.
         - unit_consistency_template(response) → list[Constraint]:
           checks that units in intermediate steps are consistent
         - comparison_direction_template(response) → list[Constraint]:
           checks that "X > Y" comparisons are consistent with subsequent "X−Y=Z"
         - CI-safe: when response has no parseable arithmetic, returns []
      4. Implement python/carnot/pipeline/constraint_template_library.py:
         Follow the test spec exactly. All templates must implement ConstraintExtractor
         protocol (or return Constraint-compatible objects).
      5. Wire ConstraintTemplateLibrary into VerifyRepairPipeline (additive):
