    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/llama_server.py
    - {project_root}/results/experiment_3670_facts_row_real_benchmark.json
    - {project_root}/results/experiment_5163_mmlu_pro_verifier_rescale_v473.json
    - {project_root}/openspec/capabilities/verification/spec.md

    TASK:
    Compare direct detection, matched two-pass self-verification, and matched
    two-pass SQL-grounded verification on the same frozen rows. Run all three
    mandated cached GGUF families. Score only with sealed labels. Preserve all
    prompts, outputs, relations, queries, executor results, and per-unit rows.

    CONCRETE STEPS:
    0. Unconditionally create the schema-complete artifact before checking the
       structured gate, GPU, models, server, or fixture. If any check fails,
       finish once as blocked with inference_substrate_class=blocked_no_run and
       gate_check_summary that names the exact field and observed value.
    1. Add REQ-VERIFY-7139 and focused RED tests in
       tests/python/test_experiment_7139_v627_symbolic_grounding_ab.py.
    2. Implement python/carnot/experiment_7139_v627_symbolic_grounding_ab.py and
       scripts/experiments/experiment_7139_v627_symbolic_grounding_ab.py.
    3. MODEL_SPECS must contain unsloth/Qwen3.6-35B-A3B-GGUF,
       unsloth/gemma-4-31B-it-GGUF, and
       unsloth/gemma-4-26B-A4B-it-GGUF. Resolve cached Q4 paths with
       cached_sota_pair(), use correct chat templates, and download nothing.
    4. Preflight each cached file, GPU, backend, prompt rendering, and one real
