  - id: exp3286-clean-verifier-abstention-root-cause-v1
    milestone: "2026.05.304"
    deliverable: "results/experiment_3286_clean_verifier_abstention_root_cause_v1.json"
    title: "Clean verifier abstention root-cause audit v1"
    priority: high
    max_turns: 30
    estimated_wall_time_min: 30
    track: "verification"
    inference_substrate: "artifact_and_fixture_analysis_only"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3275-clean-sota-verifier-rerun-v14
        verdict: "complete: clean_verifier_rerun_ready=false; abstention_rate=1.0; false_accept_rate=0.0; false_reject_rate=0.0"
        addressed_by: "This task does not rerun the verifier. It diagnoses the abstain-all root cause in fixtures, exact-answer coverage, thresholds, and row extraction before any calibrated verifier attempt."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      .303 clean verifier v14 did not fail by accepting wrong answers. It failed by abstaining on every exact-check row. Carnot needs a root-cause audit before spending GPU time on another live verifier rerun.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3275_clean_sota_verifier_rerun_v14.json
      - results/experiment_3268_sota_receipt_methodology_supplement_v1.json if present
      - ops/verifier_authenticity_audit_report.md
      - carnot/verifiers/ if present
      - tests/ if verifier tests exist

      TASK
      Diagnose why the clean verifier abstained on every exact row and produce a calibrated rerun plan with measurable coverage and false-accept constraints.

      CONCRETE STEPS
      1. Read the clean verifier artifact and identify the evaluated rows, answerability fields, exact-answer fields, thresholds, and abstention reasons.
      2. Check whether abstentions come from missing canonical answers, fixture mismatch, row extraction failure, score thresholds, model output parsing, or safety policy.
      3. Build a minimal exact-row audit table that separates answerable, unanswerable, malformed, and unknown rows.
      4. Define rerun acceptance criteria for exp3287, including no false accepts and a non-trivial coverage target.
      5. Do not modify the conductor.

      REQUIRED ARTIFACT FIELDS:
      - abstention_root_cause_audit_ready: bool (principle: diagnosis must be machine-readable)
      - abstention_root_cause_identified: bool (principle: gates calibrated rerun)
      - prior_abstention_rate: float (principle: carry the .303 blocker)
      - audited_exact_row_count: int (principle: coverage denominator must be visible)
      - answerable_row_count: int (principle: abstention depends on answerability)
      - malformed_or_missing_answer_count: int (principle: fixture failures must not be blamed on verifier policy)
      - threshold_or_policy_findings: list (principle: distinguish calibration from data quality)
      - parser_or_extraction_findings: list (principle: extraction bugs can mimic abstention)
      - calibrated_rerun_plan: dict (principle: downstream rerun needs explicit criteria)
      - target_max_abstention_rate: float (principle: abstain-all cannot pass)
      - target_false_accept_rate: float (principle: exact verifier must protect correctness)
      - random_seed: int (principle: reproducibility)
      - reproducibility_checksum: str (principle: artifact integrity)
      - duration_s: float (principle: timing evidence)
      - honest_verdict: str (principle: must start with complete:/success:/passed:/shipped:)
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3287-abstention-calibrated-clean-verifier-v15
