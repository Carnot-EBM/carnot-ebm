  - id: exp2862
    milestone: "2026.05.271"
    deliverable: "results/experiment_2862_sota_runtime_cache_offload_resolver_v3.json"
    title: "SOTA Runtime Cache + GPU Offload Resolver v3"
    priority: critical
    agent_type: claude
    model: opus
    max_turns: 100
    estimated_wall_time_min: 120
    requires_gpu: true
    track: infrastructure
    prior_failures:
      - experiment_id: exp2848
        verdict: "blocked_llama_cpp_gpu_offload: precondition c failed before model selection or inference; cached_sota_pair also failed to return the required two-model local SOTA pair"
        addressed_by: "This attempt changes scope from evidence-only rerun to resolver: diagnose/fix or document the llama_cpp GPU-offload build and cached_sota_pair path before any downstream live task runs."
        retire_if_same_verdict: true
      - experiment_id: exp2836-sota-runtime-preflight
        verdict: "success: .venv CUDA torch available and at least one mandated SOTA GGUF load-smoked; adversarially flagged for too-short duration and missing methodology fields"
        addressed_by: "This attempt requires usable_response=true, seed/checksum/methodology fields, and no live claim unless the mandated GGUF actually generates output."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Exp 2848 blocked because .venv CUDA torch sees two RTX 3090s but
        llama_cpp reports no GPU offload support and cached_sota_pair() returns
        None. This task is the replacement resolver, not another blind runtime
        evidence rerun.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - CODEX.md
        - scripts/experiment_template.py
        - python/carnot/inference/sota_models.py
        - python/carnot/reporting/sota_gguf_preflight.py
        - results/experiment_2848_sota_runtime_evidence_v2.json
        - results/experiment_2836_sota_runtime_preflight.json
        - tests/python/test_inference_sota_models.py

      TASK:
        Diagnose and resolve the local SOTA GGUF runtime path as far as possible
        without modifying scripts/research_conductor.py. If code changes are
        needed, follow CODEX.md: verify the relevant openspec capability spec
        exists before implementation, update tests, and keep the change scoped.
        Write an artifact that gates all downstream live-model work through
        sota_runtime_ready_v3.

      MODEL_SPECS:
        Mandated headline candidates:
          - unsloth/Qwen3.6-35B-A3B-GGUF
          - unsloth/gemma-4-31B-it-GGUF
          - unsloth/gemma-4-26B-A4B-it-GGUF
        Legacy Qwen3.5-0.8B and gemma-4-E4B-it may be used only for CPU smoke
        tests and must never set sota_runtime_ready_v3=true.

      CONCRETE STEPS:
        1. cd {project_root}
        2. Run preconditions: CUDA torch availability, nvidia-smi inventory,
           llama_cpp import/version/origin, llama_supports_gpu_offload(), and
           cached_sota_pair(gpu_indices=(0,1)).
        3. Inspect local HF cache and project models/ layout for all three
           mandated GGUF IDs; record exact resolved paths or missing status.
        4. If llama_cpp lacks GPU offload because of local build flags, repair or
           document the exact reinstall command/environment needed; do not fake
           the boolean.
        5. If cached_sota_pair() fails because resolver search paths are stale,
           fix the resolver with tests.
        6. If a mandated GGUF can be loaded, run one bounded prompt and record
           usable_response_count, tokens_per_second, model_path, GPU memory, and
           wall-clock duration. Do not sleep-pad.
        7. Run relevant unit tests for modified code and a focused runtime smoke.
        8. Write the deliverable JSON.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: str
        - sota_runtime_ready_v3: bool
        - model_specs: list
        - selected_model_hf_id: str
        - selected_model_path: str
        - cached_sota_pair_returned_two_loadable_specs: bool
        - llama_cpp_gpu_offload_verified: bool
        - preconditions_checked: list
        - usable_response_count: int
        - total_tokens_generated: int
        - tokens_per_second: float
        - legacy_small_models_used_only_for_smoke: bool
        - random_seed: int
        - reproducibility_checksum: str
        - tests_run: list
        - field_principles: dict
        - run_date: "{date}"
        - duration_s: float

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

