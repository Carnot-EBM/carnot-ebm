    - results/experiment_794_fpga_toolchain_install.json — GATING: tools must be installed
    - hardware/kv260/ising_sampler_v3.v — target RTL (v3 with EMA h_ema register)
    - hardware/kv260/synth_ising.tcl — existing Vivado TCL (for reference, not for yosys)
    - results/experiment_791_kv260_n32_reduced_synthesis.json — previous failure
    - research-hardware-wishlist.md — KV260 synthesis status

    TASK: Synthesize ising_sampler_v3.v at N=32 using yosys, report LUT utilization and
    any synthesis errors, write results/experiment_804_kv260_synthesis_attempt.json.

