        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "The model emits only the executable policy DSL through deterministic prefix controls. There is no natural-language ConstraintIR repair loop."
        retire_if_same_verdict: true
      - experiment_id: exp6327-three-family-guarded-policy-synthesis
        verdict: "complete_null: bounded exact-factor search did not clear the preregistered readiness gate"
        addressed_by: "The primary endpoint is unique valid semantics caused by parser-state or JIT intervention during decoding, not utility from ranking completed candidates."
        retire_if_same_verdict: true
      - experiment_id: exp6329-prospective-held-family-guarded-policy-ab
        verdict: "complete_null: held search did not clear every preregistered cell gate"
        addressed_by: "This is a small development canary. A zero semantic-diversity gain mechanically skips the prospective held-family task."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6339 must prove an exact incremental prefix substrate. This task asks one fail-fast question: does a during-decoding constraint method produce more unique valid normalized policy semantics at matched cost? It does not reopen V545 post-hoc energy search. It uses all three mandatory local GGUFs. The exact compiler remains an oracle and cannot count as model verification.

      EXISTING CODE TO READ FIRST
