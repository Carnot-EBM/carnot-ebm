  - id: exp2816
    milestone: "2026.05.266"
    deliverable: "results/experiment_2816_fuse_zero_labeled_ensemble_weighting.json"
    title: "FUSE Zero-Labeled Ensemble Weighting (arXiv:2604.18547) on Cross-Corpus Data"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 50
    track: research

    gated_on:
      - upstream: exp2810
        artifact_field: pretest_cascade_fixed
        op: '=='
        value: true

    prompt: |
      Read CLAUDE.md. Read research-references.md section on "FUSE:
      Zero-Label Verifier Ensemble Composition" (arXiv:2604.18547).

      CONTEXT: Carnot's verifier ensemble v12 (k=18) weights verifiers via a
      labeled FoVer training set. This creates a potential leakage problem on
      non-FoVer corpora: the weights are tuned to the FoVer distribution.
      FUSE (arXiv:2604.18547) provides a method to combine verifiers using ONLY
      their mutual agreement patterns — no labeled data needed. This directly
      addresses the cross-corpus generalization gap identified in exp2815.

      TASK: Implement a prototype FUSE-style zero-labeled ensemble weighting
      and compare it to the current labeled (FoVer-supervised) ensemble weights.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. CUDA available
           b. exp2815 artifact exists (for per-verifier correlation data)
           c. Qwen3.6-35B-A3B-GGUF or gemma-4-26B-A4B-it-GGUF cached
           Record preconditions_checked. If exp2815 blocked, proceed with
           FoVer-only per-verifier scores from exp2811.

        1. Load per-verifier scores from exp2811 (FoVer, both conditions) and
           exp2815 (cross-corpus matrix if available).

        2. Implement FUSE weighting prototype:
           a. Compute pairwise verifier agreement matrix using CONDITION B
              (architecture-only) scores only — no labeled data.
           b. Derive zero-labeled weights via the mutual-agreement inversion:
              verifiers that agree less with others get higher weight (high
              contribution to ensemble diversity).
           c. Apply zero-labeled weights to compute a new ensemble AUROC on FoVer.

        3. Compare FUSE-weighted ensemble AUROC to:
           a. Labeled-weighted (FoVer-supervised) ensemble AUROC
           b. Uniform-weighted ensemble AUROC
           Record all three and the lift/drop at each corpus.

        4. If exp2813 (HumanEval) and exp2814 (TruthfulQA) produced valid results,
           compute FUSE-weighted AUROC on those corpora too and compare to labeled.
           The hypothesis: FUSE weighting generalizes better to non-FoVer corpora
           than FoVer-supervised weighting.

        5. Save a prototype FUSE weight file to results/fuse_ensemble_weights_v1.json
           if the approach shows AUROC lift > 0 on any non-FoVer corpus.

        6. Write artifact.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:'
          principle: "Terminal prefix."
        - fuse_labeled_auroc_fover: float
          principle: "Labeled ensemble AUROC on FoVer — comparison baseline."
        - fuse_zero_labeled_auroc_fover: float
          principle: "FUSE-weighted ensemble AUROC on FoVer."
        - fuse_uniform_auroc_fover: float
          principle: "Uniform-weighted AUROC — simplest baseline."
        - fuse_lift_vs_labeled_fover: float
          principle: "= zero_labeled - labeled. Positive = FUSE improves even in-domain."
        - fuse_non_fover_results: dict[corpus, {labeled, zero_labeled, uniform, lift}]
          principle: "Cross-corpus comparison. Key thesis: FUSE improves generalization."
        - fuse_weights_saved: bool
          principle: "True if FUSE weight file was saved for future ensemble use."
        - verifier_agreement_matrix: dict
          principle: "The pairwise agreement matrix underlying the weighting."
        - duration_s: float
          principle: "Wall-time."
        - preconditions_checked: list
          principle: "Anti-fabrication."
        - methodology_note: str
          principle: "Honest assessment: does FUSE improve cross-corpus generalization?
                       If not, say so — the negative result informs paper-v6 §4."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

