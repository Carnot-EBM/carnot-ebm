    deliverable: results/experiment_1628_ebrm_scoring.json
    gated_on:
      - upstream: exp1627-nabla-reasoner-debug
        artifact_field: optimizer_converges
        op: '=='
        value: true
    prompt: |
      CONTEXT: Building an EBRM-style latent trace scoring mechanism using the converged Nabla-Reasoner.
      EXISTING CODE TO READ FIRST: python/carnot/models/
      TASK: Implement continuous latent trace scoring using the repaired Nabla-Reasoner. 
      CONCRETE STEPS:
      1. Write `scripts/experiment_1628_ebrm_scoring.py` to evaluate the trace scoring.
      2. Record `scoring_accuracy` in the JSON deliverable.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

