- id: exp658-specguard-step-verifier
  milestone: 2026.04.50
  deliverable: results/experiment_658_specguard_verifier.json
  title: 'Exp 658: SpecGuard Step Verifier — Log-Prob + Attention Grounding (arXiv 2604.15244, Tier 0f Candidate)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2604.15244 (April 2026) introduces SpecGuard: a spec-based guardrail
    system that uses two signals for step-level verification:
    (1) Log-Probability-Based Verification (LPBV): detects steps where the model assigns
    low log-prob to its own output, indicating uncertainty or hallucination.
    (2) Attention-Based Grounding Verification (ABGV): detects steps where attention
    weights do not concentrate on specification-relevant tokens, indicating the model
    is not grounded in the problem constraints.
    Combined: SpecGuardVerifier can reject hallucinated steps sub-millisecond using cached
    generation logits. Target: specguard_auc >= 0.70 on live_pairs_578.json.
    If viable: deploy as Tier 0f in ThreeTierPipeline (faster than any current tier).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/three_tier_pipeline.py — cascade structure, how tiers are ordered
    - python/carnot/pipeline/nup_probe_v4.py — NUPProbeV4: contrastive probe pattern to reuse
    - python/carnot/pipeline/spilled_energy_detector.py — per-token logit signal pattern
    - results/live_pairs_578.json — live pairs with generation logits if cached
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Implement SpecGuardVerifier as a CPU-safe Tier 0f candidate.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-152 (SpecGuardVerifier: LPBV log-prob step rejection),
       REQ-VERIFY-153 (SpecGuardVerifier: ABGV attention grounding check),
       REQ-VERIFY-154 (SpecGuardVerifier: AUC >= 0.70 on live_pairs_578),
       SCENARIO-VERIFY-202/203/204 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/specguard_verifier.py:
       a. SpecGuardStepResult dataclass: step_index (int), step_text (str),
          lpbv_score (float), abgv_score (float), combined_score (float),
          step_rejected (bool).
       b. SpecGuardVerifier class:
          __init__(self, lpbv_threshold: float = 0.3, abgv_threshold: float = 0.3,
                   combined_threshold: float = 0.5):
            self.lpbv_threshold = lpbv_threshold
            self.abgv_threshold = abgv_threshold
            self.combined_threshold = combined_threshold
          _compute_lpbv(self, step_text: str, token_logprobs: list[float] | None) -> float:
            'Log-prob verification: low mean logprob = high uncertainty = high score.'
            If token_logprobs is None:
              Estimate from text: score = min(1.0, max(0.0, len(step_text) / 200.0))
              Return score (naive proxy without actual logprobs).
            mean_logprob = sum(token_logprobs) / len(token_logprobs)
            return max(0.0, min(1.0, -mean_logprob / 10.0))
          _compute_abgv(self, step_text: str, attention_weights: list[float] | None) -> float:
            'Attention grounding: low max-attention = ungrounded = high score.'
            If attention_weights is None:
              import re
              numbers = re.findall(r'\d+', step_text)
              return 0.0 if numbers else 0.5
            max_attn = max(attention_weights) if attention_weights else 0.0
            return max(0.0, min(1.0, 1.0 - max_attn))
          verify_step(self, step_index: int, step_text: str,
                      token_logprobs: list[float] | None = None,
                      attention_weights: list[float] | None = None) -> SpecGuardStepResult:
            lpbv = self._compute_lpbv(step_text, token_logprobs)
            abgv = self._compute_abgv(step_text, attention_weights)
            combined = 0.5 * lpbv + 0.5 * abgv
            rejected = combined >= self.combined_threshold
            return SpecGuardStepResult(step_index, step_text, lpbv, abgv, combined, rejected)
          detection_score(self, response: str,
                          all_logprobs: list[list[float]] | None = None,
                          all_attentions: list[list[float]] | None = None) -> float:
            'Return max combined score across all step segments.'
            import re
            steps = [s.strip() for s in re.split(r'[.!?\n]+', response) if s.strip()]
            scores = []
            for i, step in enumerate(steps):
              lp = all_logprobs[i] if all_logprobs and i < len(all_logprobs) else None
              at = all_attentions[i] if all_attentions and i < len(all_attentions) else None
              result = self.verify_step(i, step, lp, at)
              scores.append(result.combined_score)
            return max(scores) if scores else 0.0
       c. Export SpecGuardVerifier, SpecGuardStepResult from carnot.pipeline.
    4. Write scripts/experiment_658_specguard_verifier.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(658, timeout_minutes=30).
       c. ExperimentTemplate(658, 'SpecGuard Step Verifier',
          'results/experiment_658_specguard_verifier.json', requires_gpu=False).
       d. verifier = SpecGuardVerifier()
       e. Load live_pairs_578.json. For each pair (is_correct label, response):
          score = verifier.detection_score(response)
          predicted_hallucinated = (score >= 0.5)
          true_incorrect = (is_correct == False)
          Compute TP, FP, TN, FN. Compute AUROC.
       f. specguard_auc = computed AUROC
          tier_0f_viable = (specguard_auc >= 0.70)
       g. Build artifact: schema='carnot.specguard_verifier.v1',
          n_pairs=<int>, specguard_auc=<float>,
          tier_0f_viable=<bool>,
          arxiv_ref='2604.15244',
          honest_verdict='specguard_tier_0f_viable' if tier_0f_viable
            else 'specguard_below_threshold'.
       h. If tier_0f_viable: Update python/carnot/pipeline/three_tier_pipeline.py to add
          SpecGuardVerifier as Tier 0f (before Tier 1 SinkProbe). Add skip logic:
          if specguard_score <= specguard_threshold: skip.
       i. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_specguard_verifier.py (100% coverage on specguard_verifier.py).
       Tests trace to REQ-VERIFY-152/153/154.
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: _bmad/architecture.md (Tier 0f SpecGuard if deployed), ops/changelog.md.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp659-tier2-fr11-relay
  milestone: 2026.04.50
  deliverable: results/experiment_659_tier2_fr11_relay.json
  title: 'Exp 659: FR-11 Tier 2 Cross-Session Relay — Wire VR Violations into ConstraintTemplateLibrary (MANDATORY)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: FR-11 (autonomous self-learning loop) is MANDATORY every milestone.
    This experiment wires Exp 656 VR attempt #18 violations into ConstraintTemplateLibrary
