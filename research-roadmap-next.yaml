        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      .305 produced useful but non-promotable live evidence because runtime duration, model provenance, and metric-independence signals were not strong enough for headline use. .306 live tasks need a shared contract before expensive reruns.

