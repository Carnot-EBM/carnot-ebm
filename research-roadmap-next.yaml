    --include='*.py' -l | head -5\n  {project_root}/results/experiment_2525_fr11_tier3_jepa_integration.json
    (JEPA model state — what features? where is model saved?)\n  {project_root}/scripts/experiment_template.py\n\nCONCRETE
    STEPS:\n  0. PRECONDITIONS:\n     a. Verify JEPA code exists:\n        grep -r
    'jepa' {project_root}/python/carnot/ --include='*.py' -l | head -3\n        If
