  - id: exp4348-s3-stratified-verifier-guided-search
    milestone: 2026.06.402
    title: "PHASE A1 (HEADLINE; convert the PROVEN moat into a generation GAIN) -- S3 STRATIFIED VERIFIER-GUIDED DENOISING SEARCH (arXiv:2604.06260 VERIFIED) using the .401 LEAK-ROBUST scorer. .401 PROVED the in-generation oracle-distinct moat exists (exp4338, leak-robust, replicated, CI95-excl-0) -- but a proven moat is a MEASUREMENT; the north-star §5 win condition is UTILITY: the verifier earns its place when it makes generation MORE ACCURATE AT EQUAL COMPUTE (Pareto-improve the base generator). S3 (Stratified Scaling Search, 2604.06260) is the instrument: at each DiffusionGemma denoising step, expand K candidate partial states, score them with the leak-robust exp4337 scorer (the in-loop verifier), resample the promising ones while preserving frontier diversity -> a reward-tilted sampling distribution anchored to the model prior. The DECISIVE test is at a FIXED NFE (denoising compute) budget: does S3-Carnot beat (a) best-of-K@matched-NFE (the same compute spent on K independent samples + final selection -- the must-beat compute-matched baseline), (b) unguided single-pass, and (c) self-reward SMC (2602.01849, the model's INTRINSIC confidence -- the sharpest oracle-distinct test)? Reuse the .401 skeptic-proof harness: the no-op DEGENERATE_CONTROLS guard (controls_differentiated) + an INDEPENDENT leak re-check on the scorer. Emit s3_guided_beats_control BARE bool := (S3-Carnot - best-of-K@NFE > 0 AND its CI95 excludes 0 AND controls_differentiated AND S3-Carnot - self-reward-SMC > 0) at FIXED NFE, n>=80, >=3 seeds. verifier_is_oracle=false. A win = the moat graduates 'exists'->'useful' (Pareto-improves generation). An honest null (the proven scorer does NOT convert to a fixed-NFE generation gain) is decision-grade. NO TRAINING (test-time search only); NO TRM training; DiffusionGemma via the llama.cpp PR binary."
    priority: critical
    track: diffusiongemma-headline
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4348_s3_stratified_verifier_guided_search.json
    prior_failures:
      - experiment_id: exp4326-adaptive-guided-generation-scaleup
        verdict: complete_adaptive_guidance_bounded_to_stitching_null
        addressed_by: "exp4326 (.400) tried a SCHEDULE-only adaptive guidance scale-up and found it bounded to post-hoc stitching (adaptive_guidance_beats_control=false, CI95 [-0.075,0.35] incl 0) -- AND it used the LEAKY exp4292 scorer. This attempt is a DIFFERENT method: S3 stratified verifier-guided SEARCH (2604.06260 -- per-step frontier expansion + verifier scoring + resampling with diversity preservation, not a fixed schedule) AND it uses the now-PROVEN LEAK-ROBUST exp4337 scorer (the moat replicated leak-robust in exp4338, so scale-up is legitimate) AND the decisive test is at FIXED NFE vs best-of-K (compute-matched), which exp4326 did not run. retire_if_same_verdict: true -- if S3 with a proven leak-robust scorer ALSO cannot beat the compute-matched controls at fixed NFE, the in-generation moat does not convert to a generation gain (decision-grade; the in-generation-guidance scale-up direction retires)."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: north-star §1 + §5 -- the in-generation oracle-distinct moat is PROVEN (exp4338, leak-robust, replicated).
      The forward question is UTILITY: does the verifier improve generation at equal compute? S3 (arXiv:2604.06260) puts
      the leak-robust scorer INSIDE the denoising loop as a verifier-guided search. The decisive comparison is at FIXED
      NFE vs best-of-K (compute-matched) + unguided + self-reward SMC (intrinsic). A win = the moat is USEFUL, not just
      real. The operator was twice-burned on DiffusionGemma over-claims -> skeptic-proof by construction.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4337_leak_robust_partial_state_scorer_build.json (scorer_module_path = the persisted leak-robust scorer, results/dina_lrm_partial_state_scorer_exp4337.pkl) + results/experiment_4338_in_generation_moat_replicate_leak_robust.json (the proven moat: the exact harness, controls, leak re-check, bootstrap)
        - results/experiment_4315_diffusiongemma_reward_guided_stitching.json (the .399 stitching harness -- the arms unguided/EntRGi/self-reward-SMC/Carnot; the no-op guard; the bootstrap CI)
        - scripts/exp_diffusiongemma_energy_prior_extract.py + results/diffusiongemma_energy_prior_extracted.json (the PR-binary call: llama-diffusion-gemma-eval <gguf> <prompt_ids.i32> <canvas_ids.i32> <out_logits.bin>; canvas=256 mask tokens id=4; vocab 262144)
        - research-references.md (the .402 sweep: S3 2604.06260 stratified scaling search; self-reward SMC 2602.01849)
        - scripts/experiment_template.py, scripts/adversarial_verify.py (DEGENERATE_CONTROLS), scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Pre-Launch Preconditions", "Inference-Substrate Declaration", "GGUF tokenizer rule", "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: run S3 stratified verifier-guided denoising search with the leak-robust scorer; report whether it beats the compute-matched + intrinsic controls at FIXED NFE.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any inference):
           a. PR binary: `ls ~/.cache/llama.cpp-master/build/bin/llama-diffusion-gemma-eval` non-empty.
           b. DiffusionGemma GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--diffusiongemma-26B-A4B-it-GGUF/` non-empty. 1x RTX 3090 fits the Q4_K_M (16GB).
           c. The leak-robust scorer loads: `python3 -c "import pickle; pickle.load(open('results/dina_lrm_partial_state_scorer_exp4337.pkl','rb'))"` succeeds. If absent -> honest_verdict `blocked_leak_robust_scorer_unavailable` and STOP.
           d. Conductor stood-down on TRM training; this task does NO training of any kind (test-time search only).
           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate inference.
        1. INDEPENDENT LEAK RE-CHECK on the scorer (re-ablate the answer cells); if it now leaks -> scorer_leak_recheck_passed=false + honest_verdict `scorer_leaky_in_search_corpus` and STOP.
        2. NO-OP GUARD: smoke that each arm CHANGES token selection; if any two arms tie bit-identically -> controls_differentiated=false + honest_verdict `controls_not_differentiable` and STOP.
        3. WINDOW DISCIPLINE: synchronous, checkpoint after every seed, print per-arm/per-seed progress (codex idle-timeout fix). FIX an NFE (denoising-step x candidate) budget B. Run the arms at the SAME B: (a) unguided single-pass; (b) best-of-K@B (K independent samples + final selection, K chosen so total NFE == B); (c) self-reward SMC@B (intrinsic confidence particle filter); (d) S3-Carnot@B (per-step frontier expansion + leak-robust-scorer scoring + stratified resample with diversity preservation). n>=80, >=3 seeds. Report per-arm accuracy + S3-Carnot minus each control + task-level bootstrap CI95 (>=2000 resamples) of (S3-Carnot - best-of-K@NFE).
        4. Emit s3_guided_beats_control BARE bool := (S3-Carnot - best-of-K@NFE > 0 AND its CI95 excludes 0 AND controls_differentiated AND S3-Carnot - self-reward-SMC > 0). Run adversarial_verify.py (clean; verifier_is_oracle=false). Declare random_seed + reproducibility_checksum + model_specs (GGUF + PR binary + the leak-robust scorer + the S3 config + K + NFE budget B + the controls + n + seeds).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A generation gain (S3 beats the compute-matched + intrinsic controls at fixed NFE -- moat is USEFUL), a powered null (the proven scorer does not convert to a fixed-NFE gain -> retire the in-generation scale-up direction), a controls_not_differentiable, and a scorer_leaky_in_search_corpus are ALL decision-grade."
        s3_guided_beats_control:
          principle: "BARE bool: the capstone reads this (gated-fields-must-be-bare); true iff S3-Carnot beats best-of-K@matched-NFE AND CI95-excl-0 AND controls_differentiated AND beats self-reward SMC -- the moat graduating from 'exists' to 'useful' (Pareto-improves generation at equal compute)."
        s3_minus_best_of_k_delta:
          principle: "BARE float: S3-Carnot minus best-of-K at matched NFE -- the headline Pareto claim (more accurate at equal compute)."
        s3_minus_self_reward_smc_delta:
          principle: "BARE float: S3-Carnot minus self-reward SMC -- the sharpest oracle-distinct test (external leak-robust verifier vs the model's intrinsic confidence)."
        s3_gain_ci95:
          principle: "Task-level bootstrap CI95 (>=2000 resamples) of the S3-Carnot minus best-of-K@NFE delta -- excluding 0 is the decision-grade gain."
        nfe_budget:
          principle: "BARE int: the FIXED denoising-compute (NFE) budget held equal across all arms -- the compute-matching that makes the Pareto claim honest."
        controls_differentiated:
          principle: "BARE bool: true iff no two arms tie bit-identically (the no-op guard)."
        scorer_leak_recheck_passed:
          principle: "BARE bool: the independent leak re-check of the scorer on the search corpus -- true iff its signal SURVIVES masking the answer cells."
        benchmark_n:
          principle: "BARE int: per-arm n -- MUST be >= 80 (power)."
        verifier_is_oracle:
          principle: "BARE bool=false -- the leak-robust reward head is oracle-distinct (NOT the executable oracle)."
        preconditions_checked:
          principle: "Records the PR-binary + GGUF + leak-robust-scorer + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the denoising + search + bootstrap."
        reproducibility_checksum:
          principle: "Hash of the search corpus + the S3 config + the controls + PR-binary inputs; lets a third party re-run."
        model_specs:
          principle: "DiffusionGemma GGUF + PR binary + the leak-robust scorer + the S3 config + the best-of-K/self-reward-SMC baselines + the NFE budget + denoising steps + n + seeds; required methodology."
      ACCEPTANCE GATE:
        - condition: "s3_guided_beats_control + s3_minus_best_of_k_delta + s3_minus_self_reward_smc_delta + s3_gain_ci95 + nfe_budget + controls_differentiated + scorer_leak_recheck_passed + benchmark_n (>=80) reported with verifier_is_oracle=false and preconditions_checked, OR an honest blocked_leak_robust_scorer_unavailable / controls_not_differentiable / scorer_leaky_in_search_corpus / powered-null verdict"
          principle: "A fixed-NFE generation gain from putting the proven oracle-distinct scorer inside the denoising loop converts the moat from a measurement to a Pareto-improvement of generation -- the north-star §5 win condition realized in-generation; a powered null retires the in-generation scale-up direction (decision-grade)."

      Run: `python3 {project_root}/results/experiment_4348_s3_stratified_verifier_guided_search.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

