      - tests if solver/verifier tests exist

      TASK
      Build certified coherence feedback v3 over the exact fixture protocol using solver/test authority, MaxSAT-style hard/soft constraints, contradiction localization, and minimal-change repair distance. Do not require live LLM inference or cached_sota_pair_available for readiness.

      CONCRETE STEPS
      1. Load the .289 exact fixture protocol and MaxSAT routing policy.
      2. Implement or script a small Z3/MCS/MUS-compatible certificate generator for at least the exact fixture families that have formal labels.
      3. Emit per-case coherence status, unsat core or minimal correction set where available, coherence_gap or repair_distance where computable, solver_only_success_count, and vacuity_guard results.
      4. Compare against exp3100 solver-only and guided counts without claiming live LLM lift unless live mandated SOTA traces are actually used.
      5. Add focused tests or a deterministic self-check command for the certificate path.
      6. Write the deliverable artifact.

