  - id: exp1987-pypi-workflow-status-recheck
    title: "Exp 1987: PyPI workflow status RE-CHECK (v0.1.0b1 awaiting operator approval since .194)"
    deliverable: results/experiment_1987_pypi_status_recheck.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1930-pypi-workflow-status-check
        verdict: success_operator_approval_required
        addressed_by: "exp1930 (.196) identified the GitHub Actions workflow as waiting on operator manual approval at the `pypi` environment. This task re-checks N hours later — operator may have approved, workflow may have succeeded and PyPI 0.1.0b1 may now be reachable. NOT another tag-push; just status re-check + install verification."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: exp1930 (.196) found the v0.1.0b1 workflow run waiting on
      operator approval at GH Environment 'pypi'. N hours later, the
      operator may have approved. This task RE-CHECKS — if pypi is now
      reachable, verify install in fresh venv; if still waiting,
      re-report the actionable next step (operator approve at <url>).

      FALSIFIABLE HYPOTHESIS: The workflow run for tag v0.1.0b1 has
      transitioned from 'waiting' to one of: (a) approved-and-succeeded
      (PyPI 0.1.0b1 reachable; install works), (b) approved-and-failed
      (workflow ran but a step failed), (c) still-waiting (operator
      hasn't approved yet). This task identifies which.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1930_pypi_status.json (the prior status check)
        - .github/workflows/publish-pypi.yml
        - feedback_pypi_publish_via_ci_tagged_release memory entry

      TASK: Re-check workflow status; verify PyPI if succeeded.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `command -v gh` succeeds — else
              `blocked_gh_cli_unavailable_use_web_check`.
           b. `gh auth status` returns authenticated — else
              `blocked_gh_auth_needed`.
           c. `git ls-remote --tags origin | grep "v0.1.0b1"` returns
              the tag hash — else `blocked_tag_unexpectedly_missing`.
           Record preconditions_checked.
        1. `gh run list --workflow=publish-pypi.yml --limit 5
            --repo Carnot-EBM/carnot-ebm --json
            databaseId,status,conclusion,createdAt,url`. Identify the
           v0.1.0b1 run.
        2. Classify:
           - status=waiting → output "Operator: approve at <url>".
           - status=completed AND conclusion=success → verify PyPI:
             fresh tmpdir, `pip install --index-url
             https://pypi.org/simple/ carnot-ebm==0.1.0b1`, then
             `python -c "import carnot; print(carnot.__version__)"`.
           - status=completed AND conclusion=failure → fetch failed-
             step log: `gh run view <id> --log-failed
             --repo Carnot-EBM/carnot-ebm` (truncate 50 lines).

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.pypi_workflow_status_recheck.v1"
        - experiment: 1987
        - run_date: ISO-8601 UTC
        - duration_s: > 15s
        - random_seed: 173187
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {workflow_file: ".github/workflows/publish-pypi.yml",
          tag_checked: "v0.1.0b1",
          prior_status_artifact: "exp1930"}
        - n_samples: 1
        - n_samples_justification: "Status re-check; single workflow run."
        - workflow_run_id: int or null
        - workflow_run_url: str
        - workflow_run_status: "waiting" | "in_progress" | "success" | "failure"
        - workflow_run_conclusion: str or null
        - state_change_from_exp1930: "no_change" | "now_succeeded" | "now_failed"
        - pypi_url_reachable: bool
        - pypi_url: str or null
        - external_install_verified: bool
        - actionable_next_step: str
        - failed_step_excerpt: str or null
        - acceptance_gate_passed: bool (status identified AND actionable
          next step set)
        - acceptance_gate_criteria: "Status accurately reported; if
          succeeded, install verified."
        - methodology_note: "RE-CHECK task. Does NOT push tags. Honest
          report of current state; if still waiting, no fabrication."
        - optimization_direction: "neither — status check"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push tags. Do NOT modify
      scripts/research_conductor.py.

  - id: exp1988-phase1-ship-track-dashboard
    title: "Exp 1988: Phase 1 ship-track dashboard — operator-visible single-page status of all 4 prongs"
    deliverable: results/experiment_1988_phase1_dashboard.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: medium
    prior_failures: []
    prompt: |
      CONTEXT: Phase 1 ship-track has 4 prongs per CLAUDE.md Project
      Vision + ops/known-issues.md ".121+ MANDATORY". As of .197+:
      Fast-Slow codification done (.196 exp1929), HF mirror done
      (.196 exp1931 → huggingface.co/Carnot-EBM/ThinkPRM-v3), PyPI tag
      pushed (.194 exp1910) but awaiting operator approval. MCP/CLI
      docs + Independent Reproducer attempts in .198. This task
      synthesizes the current state into a single operator-visible
      dashboard at ops/phase-1-dashboard.md so the operator doesn't
      have to grep multiple artifacts.

      FALSIFIABLE HYPOTHESIS: A single-page dashboard at
      ops/phase-1-dashboard.md can accurately report the status of all
      4 ship-track prongs (PyPI / HF / MCP-docs / Independent-Reproducer)
      with links to evidence artifacts and a single overall
      ship-percentage figure.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1929_fast_slow_codification.json (paper-v6 §3)
        - results/experiment_1930_pypi_status.json (PyPI workflow status)
        - results/experiment_1931_huggingface_mirror.json (HF URL)
        - results/experiment_1981*_mcp*.json (MCP docs, if shipped)
        - results/experiment_1982*_reproducer*.json (Reproducer, if shipped)
        - ops/known-issues.md (Phase 1 MANDATORY entry)
        - ops/phase-1-reproducers.md (if exists)

      TASK: Write ops/phase-1-dashboard.md + update ops/status.md to
      cite it.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. results/experiment_1929_fast_slow_codification.json exists
              — else `blocked_fast_slow_codification_artifact_missing`.
           b. results/experiment_1931_huggingface_mirror.json exists —
              else `blocked_hf_mirror_artifact_missing`.
           Record preconditions_checked.
        1. Read each prong's evidence artifact. Extract:
           per-prong status (shipped/pending/blocked), URL/artifact-path,
           date.
        2. Write ops/phase-1-dashboard.md:
             - Header: "Phase 1 Ship-Track Status" + last-updated date
             - 4-row table: prong / status / evidence URL / date / next-action
             - Single ship-percentage figure (count_shipped / 4 × 100%)
             - Operator action items: bullet list (e.g., "approve PyPI
               workflow at <url>")
             - Cross-references to relevant memory entries
             - NO emojis per CLAUDE.md
        3. Update ops/status.md "What's Working" section to LINK to
           ops/phase-1-dashboard.md (do NOT replace prior content).

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase1_dashboard.v1"
        - experiment: 1988
        - run_date: ISO-8601 UTC
        - duration_s: > 30s
        - random_seed: 173188
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {dashboard_path: "ops/phase-1-dashboard.md",
          prongs_audited: ["pypi", "huggingface", "mcp_docs",
          "independent_reproducer"]}
        - n_samples: 4
        - n_samples_justification: "Dashboard; n is prong count."
        - per_prong_status: dict prong -> {status: str, evidence: str,
          date: str, next_action: str}
        - phase_1_ship_percentage: int (0-100)
        - operator_action_items: list
        - dashboard_word_count: int
        - dashboard_has_emojis: false
        - acceptance_gate_passed: bool (4 prongs audited + dashboard
          written + status.md linked + emoji-free)
        - acceptance_gate_criteria: "All 4 prongs audited; dashboard
          single-page; emoji-free; status.md cross-references."
        - methodology_note: "Dashboard reflects current state honestly.
          PyPI is shipped-pending-operator-approval is NOT 'shipped' —
          it's 'pending'. No status inflation."
        - optimization_direction: "neither — synthesis task"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1989-phase1-ship-track-recovery
