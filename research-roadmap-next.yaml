  - id: exp6339-incremental-prefix-enforcement-substrate
    milestone: "2026.08.546"
    deliverable: results/experiment_6339_incremental_prefix_enforcement_substrate.json
    title: "Incremental parser-state and JIT prefix-feasibility substrate"
    priority: critical
    track: energy_reasoning
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 180
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6338-v546-post-marker-source-scope-freeze
    prior_failures:
      - experiment_id: exp5923-sota-schema-supported-constraintir-ab
        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "This substrate uses a bounded executable policy DSL, deterministic incremental parser states, and exact SMT prefix feasibility. It does not reprompt natural-language ConstraintIR."
        retire_if_same_verdict: true
      - experiment_id: exp6327-three-family-guarded-policy-synthesis
        verdict: "complete_null: bounded exact-factor search did not clear the preregistered readiness gate"
        addressed_by: "The changed mechanism acts on each prefix before candidate completion. It does not rank complete candidates with the failed post-hoc energy search."
        retire_if_same_verdict: true
      - experiment_id: exp6329-prospective-held-family-guarded-policy-ab
        verdict: "complete_null: held search did not clear every preregistered cell gate"
        addressed_by: "This task proves only incremental soundness and completion parity. A later diversity canary must pass before any new held utility test."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6326 proved a bounded policy DSL, canonical semantics, exact factor compilation, and hash-pinned fallbacks. Exp6327 and Exp6329 proved that post-hoc exact-energy search added no value. New work on parser-state bias correction and LeJIT suggests a different intervention point: reject or correct an infeasible token prefix before the model completes a candidate. This task builds the deterministic substrate only. It makes no LLM call and no utility claim.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md V546 parser and LeJIT entries
      - {project_root}/results/experiment_6326_restricted_policy_contract_compiler.json
      - {project_root}/results/experiment_6327_three_family_guarded_policy_synthesis.json
      - {project_root}/results/experiment_6329_prospective_held_family_guarded_policy_ab.json
      - {project_root}/python/carnot/experiment_6326_restricted_policy_contract_compiler.py
      - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
      - {project_root}/openspec/capabilities/constraint-verification/spec.md
      - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/e2e-test-plan.md

      TASK
      Implement a deterministic incremental lexer and parser for the existing restricted policy DSL. Expose canonical parser-state features without reading model hidden state. Implement a JIT SMT prefix-feasibility checker with bounded timeouts and fail-closed results. Prove that every accepted completed program matches Exp6326 canonical semantics. Prove that no feasible completion is rejected on the exhaustive fixture domain. Record checker cost and a verification-cost-error table. Do not implement learned scoring, natural-language repair, or post-hoc candidate ranking.

      Required deliverable: {project_root}/results/experiment_6339_incremental_prefix_enforcement_substrate.json.
      REQUIRED ARTIFACT FIELDS: status, upstream_contract_path_hash_and_ready_score, source_claim_boundary, incremental_lexer_path_and_hash, incremental_parser_path_and_hash, parser_state_schema_path_and_hash, parser_state_observable_only_receipt, jit_smt_prefix_checker_path_and_hash, timeout_and_fail_closed_contract, prefix_fixture_manifest_path_and_hash, exhaustive_prefix_count, feasible_infeasible_and_timeout_counts, prefix_soundness_results, feasible_completion_recall_results, completed_program_semantic_parity_results, parser_state_determinism_results, adversarial_prefix_results, verification_calls_time_and_cost_distribution, verification_cost_error_table, hidden_state_access_count, generated_label_count, llm_call_count, exact_oracle_claim_boundary, prefix_enforcement_substrate_ready_score, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, random_seeds, reproducibility_checksum, honest_verdict. hidden_state_access_count, generated_label_count, and llm_call_count must be bare 0. verifier_is_oracle must be true. Readiness is 1.0 only for exhaustive soundness, full feasible-completion recall, semantic parity, deterministic states, and bounded fail-closed timeouts. field_principles must cover every required field.

      CONCRETE STEPS
      0. Replay Exp6326 readiness. Freeze grammar and semantic hashes, finite bounds, timeout budgets, exhaustive fixtures, seeds, Z3 version, resource limits, and protected hashes in preconditions_checked.
      1. Add REQ-KONA-6339 and scenarios before implementation. Update traceability.
      2. Reuse the Exp6326 lexer, parser, normalizer, and exact semantics. Add incremental state without changing completed-program meaning.
      3. Build the JIT SMT interface. Return accept, reject, or timeout. Treat timeout as fail-closed and report it separately.
      4. Enumerate every prefix in the bounded fixture domain. Check soundness, feasible-completion recall, determinism, and final semantic parity.
      5. Attack invalid UTF-8, token splits, whitespace aliases, prefix bombs, solver timeouts, unknown symbols, and normalization collisions.
      6. Add property tests for all invariants and cost accounting.
      7. Run focused tests, full relevant tests, spec coverage, applicable e2e checks, and adversarial verification.

      Run command: .venv/bin/python -m carnot.experiment_6339_incremental_prefix_enforcement_substrate --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6340-parser-jit-semantic-diversity-canary
    milestone: "2026.08.546"
    deliverable: results/experiment_6340_parser_jit_semantic_diversity_canary.json
    title: "Three-model parser-state and JIT semantic-diversity canary"
    priority: critical
    track: energy_reasoning
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 300
    agent_type: codex
