        - method_scorecards: dict
        - recommended_canonical_method: str
        - known_issues_entry_added: bool
        - acceptance_gate_passed: bool
        - acceptance_gate_criteria: "All scored + decision + known-issues entry."
        - methodology_note: "If all 3 fail, escalate to operator."
        - optimization_direction: "neither — decision artifact"
        - honest_verdict: MUST start with terminal prefix.

