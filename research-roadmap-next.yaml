        verdict: "complete but flagged: policy metric tautology prevented promotion."
        addressed_by: "This task consumes only the independently corrected policy and adds a distinct active-spline timescale, held-out admission, budget ledger, and rollback."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5570 shipped a clean active-spline KAN updater. PACE motivates low-risk policy refinement before higher-risk control/energy changes; EvoPolicyGym motivates fixed budgets and trajectory-level decision attribution. Build one bounded controller with frozen LLM weights and exact ASP/FSM authority.

