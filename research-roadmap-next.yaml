    agent_type: "codex"
    max_turns: 30
    prompt: |
      CONTEXT: Preparing for FPGA/LUT deployments using complexity metrics from arXiv:2604.03345 without running Vivado synthesis.
      EXISTING CODE TO READ FIRST: python/carnot/models/
      TASK: Implement platform-independent accounting scripts for KAN layers.
      CONCRETE STEPS:
      1. Create `scripts/kan_hardware_accounting.py`.
      2. Implement RM (Real Multiplications), BOP (Bit Operations), and NABS (Additions/Bit-Shifts) estimators for B-spline and Fourier representations.
      3. Write output metrics to the deliverable JSON.
      Run command: DATE="{date}" python {project_root}/scripts/run_experiment_1674.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

