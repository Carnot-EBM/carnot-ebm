      CONTEXT:
      Paper arXiv:2604.01411 (T²) shows that the compute-optimal number of inference samples K
      (candidates) depends on verifier quality: if AUROC ≈ 0.87, T² gives optimal K ≈ 3-5.
      If AUROC drops below 0.7, more K helps less because the verifier can't discriminate candidates
      reliably. This experiment evaluates Carnot's VegAS at K=[1,2,3,5,8] to build the efficiency
      frontier and verify whether K=3 is indeed optimal for ensemble v11's AUROC.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (score_candidates, select_best_candidate — VegAS methods)
      - results/experiment_2665_vegas_candidate_selection.json (vegas_viable, vegas_delta_vs_argmax)
      - results/experiment_2667_ensemble_v11_adversarial_val.json (ensemble_v11_auroc_mean)

      TASK: Evaluate VegAS at K=[1,2,3,5,8] and find the compute-optimal K.

