    - source_artifact_hashes, preconditions_checked, resolved_imports: Exact paths, transitive dependencies and exposed roles. principle: Reuse requires current custody.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, coverage_statement_counts, historical_required_failures, repository_health: Actual commands, exits, deadlines, logs and measured files. principle: Historical failures remain visible.
    - primary_resolution_receipt, terminal_validation_sidecar_path: Paths and hashes selected by the actual readers, sidecars below results/raw/. principle: The runtime must read the validated primary.
    - verifier_is_oracle, claim_scope: Explicit circularity and exposed_development status. principle: Existing human labels are model-independent, but reused source groups are not a fresh confirmatory holdout.
    - inference_substrate, inference_substrate_class, execution_venue: Actual compute and host venue; blocked_no_run records planned class separately. principle: The workload determines the duration floor.
    - MODEL_SPECS, model_specs, target_model, model_invocation_counts, trained_head_specs: Invoked pretrained models or empty lists with zero calls; fitted small heads separately. principle: Cited models are not invoked models.
    - field_principles: Explain all task-owned fields and gates. principle: Each field preserves a scientific purpose.
    - service_measurement_ready_score: 1 for complete static service accounting and required checks. principle: Missing optional update cost does not erase measured static cost.
    - service_rows, timing_spans, useful_work_denominators, memory_traffic_rows, acceleration_ceiling_rows, optional_learning_attachment: Raw paired cost and byte counts. principle: Fast kernels matter only through whole-service work.
    - service_cost_ready_score: 1 only after complete task-specific measurement and validation. principle: Valid null evidence may be ready.
    - execution_telemetry, telemetry_gaps, process_overlap: Samples joined to the measured task interval. principle: A later idle snapshot cannot explain an earlier run.


    - cited_upstream_artifacts: List of experiment_id, fields_imported, path and sha256. principle: Inherited facts keep their original evidence identity.
    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7963_v690_service_cost.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
