milestone: 2026.09.666
milestone_title: Owned evidence capture, retained decision learning, and goal-safe ARC planning
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp7629-contract-methods
  title: Bind fourteen tasks and ingest evidence and planner methods
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 40
  per_unit_rows: true
  milestone: 2026.09.666
  deliverable: results/experiment_7629_v666_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  agent_type: claude
  model: opus
  prior_failures:
  - experiment_id: exp7628-capstone
    verdict: complete_blocked_required_v665_external_evidence
    addressed_by: New V666 inputs and explicit ownership qualification; account for the previous external block
      without retrying its capstone.
    retire_if_same_verdict: true
  operator_override: '2026-05-29 operator directive (standing): routine milestone transition; scope match to exp7628
    is accounting for new V666 work, not a retry of absent V665 science.'
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.666. V665 ended complete_blocked_required_v665_external_evidence. Schema custody and native parity passed; the pilot made no model call. Record fourteen terminal dispositions without treating conductor OK as scientific success.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/research-roadmap-next.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7628_v665_capstone.json
    - {project_root}/python/carnot/experiment_7615_v665_contract_methods.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/publication_gate.py
    - {project_root}/research-references.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7629_v666_contract_methods.json. Implement a thin CLI at scripts/experiments/experiment_7629_v666_contract_methods.py over reusable behavior in python/carnot/experiment_7629_v666_contract_methods.py, with focused tests at tests/python/test_experiment_7629_v666_contract_methods.py. Reuse existing helpers.

    Execution: inference_substrate_class=aggregation; MODEL_SPECS=[].

    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed progress line immediately. Resolve {project_root} absolutely; authenticate named inputs and resource ownership. Outputs are never their own preconditions. Missing external inputs produce complete_blocked_<reason>, verdict_class=blocked and gate_check_summary with check, upstream, path, exact field, operator, expected and observed values. Never retry unchanged external blocks as partial.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark and subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed time every 60 seconds. Stream child output; use an owned heartbeat worker during synchronous waits. Keep EVERY gap below 600 seconds to retain the 4800-second cap instead of dying at 1200 seconds. Checkpoint units and terminate only processes this task created.

    3. Bound EVERY tool call. Write any file over about 200 lines in several tool calls of about 100-150 lines, with a progress message BETWEEN calls. Split large reads and validation commands. Use /tmp for scratch, scripts/experiments for entrypoints, tests/python for tests. Reuse reporting helpers instead of copying a large experiment module.

    4. Before implementation, add the named REQ-* and meaningful SCENARIO-* entries to the capability spec and write failing tests for new behavior. Preserve historical artifacts, working-tree edits and production defaults. Work only within the declared deliverable scope.

    5. Add REQ-REPORT-7629. Select staged or activated authority by milestone 2026.09.666. Compare exactly fourteen ordered IDs exp7629-exp7642, titles, phases, paths, substrates and complete gates with the V666 machine contract. Test deleted/reordered IDs, altered paths, misspelled gate fields and consumed staging. Do not activate or archive a roadmap.

    6. Write docs/research-notes/v666-method-map.md. Recheck the readable JSONSchemaBench, EAEV, Proper Calibeating and spline-local KAN methods using low-concurrency primary-source reads. Distinguish rechecks from new AS2/ERM leads and inaccessible Semantic Scholar/OpenReview pages. Map adopted controls to 7631, 7635-7637 and the independent goal-check principle to 7639-7640. Update research-studying.md; no paper theorem transfers automatically.

    7. Preserve V665 source dispositions, especially the unobserved pilot and missing scientific producers. Read the full exclusion manifest and operator priorities. Run schema, gate, exclusion, harness-fit, ARC generalization and overdue-priority guards plus unchanged publication G1-G4. This infrastructure task gates no science. E2E is authority selection and negative contract mutations.

    8. Freeze an affected-file validation manifest. Run scoped pytest with -n 0 -o addopts=, a private --basetemp, pinned PYTHONPATH and command-local COVERAGE_FILE; require 100 percent changed-behavior coverage. Run scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. For Rust changes run scoped cargo test, fmt and clippy. Report existing repository debt separately; never use the full suite as a model precondition.

    9. Run the declared entrypoint and task-specific E2E checks. Cold-reduce the raw rows in a fresh process and independently recompute comparisons. Save command exits and log hashes. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact terminal artifact candidate; persist reader outcomes before atomic publication. A failed claimed-benefit gate forbids positive; exact oracle fixtures use circular_positive; readiness alone uses null.

    10. Reconcile openspec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Apply retirement only to the exact failed mechanism; resource or custody blocks do not falsify science. Preserve old verdicts. No external publication, submission, purchase, generator training or default promotion. Do not modify research-roadmap.yaml.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: Terminal complete_ prefix; completion and benefit are different.
    - verdict_class: Exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished owned work; external absence is blocked.
    - flagged_adversarial: Persist the terminal reader result; flagged evidence opens no downstream gate.
    - gate_check_summary: Required for every blocked result, including complete_blocked_*; name the check and exact observed operands.
    - acceptance_gate_results: Separate validity, readiness, probability benefit, utility, retention and freshness; give each condition and governing principle.
    - rows: Per independent unit and arm, keep absolute metrics, numerators, denominators, seeds, direction, censoring and raw provenance.
    - sample_size_budget: Intended, observed, excluded and censored independent units. Repeated orders, views and seeds do not multiply sample size.
    - preconditions_checked: Actual input/resource checks; unavailable evidence cannot become fabricated work.
    - inference_substrate: Describe current work; inherited GPU evidence is not a model invocation.
    - inference_substrate_class: Actual class plus planned_inference_substrate_class; bounded generation floor 10s, full generation 60s, load without generation 2s. Never pad duration.
    - MODEL_SPECS: Actual current model specifications; every LLM task plans unsloth/Qwen3.8-27B-GGUF. No-call work uses [] and names historical models separately. Preserve planned_MODEL_SPECS when blocked before loading.
    - model_invoked: Whether a real current model load or generation was attempted; inherited rows do not count.
    - execution_venue: Actual host, device UUID and owned PID where applicable; board receipts retain their historical scope.
    - phase_spans: Measured disjoint stages, completed units, pending operations and checkpoint positions.
    - invocation_counts: Current loads, forwards, generations and tokens, separately from historical counts.
    - duration_s: Measured monotonic elapsed time; do not inherit old durations.
    - random_seed: Seeds and purposes for each stochastic stage.
    - reproducibility_checksum: Immutable inputs, config, feature/schema authority and reduction code.
    - source_artifact_hashes: Distinguish producers, pre-gate receipts, missing inputs and planned outputs; never hash the current artifact as its own input.
    - validation_receipts: Actual commands, exits, log hashes and final independent reader outcomes.
    - verifier_is_oracle: Exact execution/control truth cannot establish an oracle-distinct learned advantage.
    - field_principles: State the governing principle beside each field and acceptance gate.
    - contract_ready_score: 1 only for exact fourteen-task parity and clean structural checks.
    - method_map_path: docs/research-notes/v666-method-map.md
    - task_contract_rows: All fourteen new tasks and fourteen prior dispositions.
    - publication_gates: Fixed G1-G4 with historical FoVer eligibility kept separate.

    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7629_v666_contract_methods.py --date {date} --output results/experiment_7629_v666_contract_methods.json
    Do NOT push. Do NOT modify scripts/research_conductor.py.
