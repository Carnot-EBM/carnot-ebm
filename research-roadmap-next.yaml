    - CLAUDE.md
    - ops/experiment_signal_noise_classification.csv
    - ops/exclusion_manifest.yaml
    - research-complete.yaml
    - results/experiment_1452_milestone_111_retro.json
    - ops/known-issues.md
    - results/

    TASK:
    Walk the GRPO/VPRM lineage from roughly exp1063 through exp1393, summarize
    the useful lessons, retire the lineage as active research scope, and block
    future GRPO v15-style proposals unless the operator explicitly reopens it.

    REQUIRED ARTIFACT FIELDS:
    - status
    - lineage_name
    - experiments_reviewed
    - consolidation_note_path
    - grpo_lineage_retired
    - exclusion_manifest_updated
    - lessons_retained
    - future_reopen_conditions
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1456_grpo_vprm_lineage_consolidation_retirement.json immediately with status="in_progress".
    2. Search research-complete.yaml and results/ for GRPO, VPRM, TinyV, preference, and related ids from exp1063 through exp1393.
    3. Write ops/lineage-retirements/grpo_vprm_lineage_retired.md with experiment ids, verdicts, measured positives, repeated blockers, and final decision.
    4. Update ops/exclusion_manifest.yaml or the repo's active exclusion mechanism to block GRPO v15 / VPRM v15 unless an operator reopens the scope.
    5. Preserve any genuinely useful lesson, such as candidate-pool saturation or false-negative correction, as future reference instead of deleting it.
    6. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1456_grpo_vprm_lineage_consolidation_retirement.json')); print(d.get('experiments_reviewed'), d.get('grpo_lineage_retired'), d.get('exclusion_manifest_updated'))"
