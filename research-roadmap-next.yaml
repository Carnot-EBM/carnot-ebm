        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp5351-v488-trigger-constrain-structured-protocol
        verdict: "blocked_structured_protocol_clean_false"
        addressed_by: "The rerun is gated on a new deterministic grammar-budget preflight and must record completion slack plus schema reachability before live local GGUF inference."
        retire_if_same_verdict: true
      - experiment_id: exp5338-v487-trigger-constrain-structured-sota
        verdict: "blocked_structured_sota_protocol_methodology"
        addressed_by: "The live attempt now has explicit methodology duration, MODEL_SPECS, GPU/offload receipt, no-AutoTokenizer evidence, and separate parse/schema/final-json metrics."
        retire_if_same_verdict: true
      - experiment_id: exp5284-sota-offload-cpu-only-path
        verdict: "retired_cpu_only_offload_path"
        addressed_by: "This task requires a fresh GPU/offload receipt or writes an honest blocked artifact; it must not produce a CPU-only headline SOTA result."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      This task runs the live local SOTA structured protocol only if Exp5365 reports grammar_budget_protocol_ready=true. The prior live protocol failed schema cleanliness. Legacy small models may be used only as CPU smoke tests, never as headline models.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/results/experiment_5365_grammar_budget_protocol_preflight_v489.json
      - {project_root}/results/experiment_5351_trigger_constrain_structured_protocol_v488.json
      - {project_root}/python/carnot/
      - {project_root}/tests/python/

      TASK:
      Run a live grammar-budgeted structured-output protocol with the mandated local GGUF SOTA models. Fail closed if the runtime cannot provide a non-retired GPU/offload path.

      CONCRETE STEPS:
      0. PRECONDITIONS: verify CUDA/GPU visibility and GGUF runtime availability. If only a CPU-only path is available for headline SOTA, write a blocked artifact and stop.
      1. Use the Exp5365 preflight output to set schema grammar, completion slack, and max-token budget.
      2. MODEL_SPECS for headline-eligible local runs must include:
         - unsloth/Qwen3.6-35B-A3B-GGUF
         - unsloth/gemma-4-31B-it-GGUF
         - unsloth/gemma-4-26B-A4B-it-GGUF
      3. Use llama.cpp/GGUF-compatible loading only. Do not use AutoTokenizer or AutoModel directly on a -GGUF repository.
      4. Run at least one mandated SOTA model if available, with enough prompts to measure parse, schema, final JSON extraction, and unsafe false accepts. Prefer cached_sota_pair() style patterns from scripts/experiment_template.py if present.
      5. Separate truncation failures from schema failures and semantic failures.
      6. Write {project_root}/results/experiment_5366_live_grammar_budgeted_sota_protocol_v489.json.

      REQUIRED ARTIFACT FIELDS:
      - status: principle: complete only if live local SOTA inference ran; blocked if preconditions fail.
      - grammar_budget_protocol_ready: principle: copied from Exp5365 gate source for audit.
      - structured_protocol_clean: principle: boolean gate for downstream constraint-tax work; true only if parse_success_rate>=0.95, schema_success_rate>=0.90, final_json_extraction_rate>=0.95, unsafe_false_accepts=0, and methodology_duration_s>=60.
      - MODEL_SPECS: principle: list containing the mandated local GGUF model specs considered for headline results.
      - selected_model_spec: principle: exact model spec used for headline measurements.
      - inference_substrate: principle: concrete runtime path, GPU/offload status, and GGUF loader family.
      - gpu_or_offload_receipt: principle: machine-readable evidence that this was not the retired CPU-only headline path.
      - no_autotokenizer_used: principle: must be true for GGUF repos.
      - prompt_count: principle: number of live prompts evaluated.
      - parse_success_rate: principle: fraction of responses with parseable JSON.
      - schema_success_rate: principle: fraction of responses satisfying the schema.
      - final_json_extraction_rate: principle: fraction with unambiguous final JSON extraction.
      - semantic_success_rate: principle: fraction satisfying task semantics after schema validity.
      - truncation_failure_rate: principle: fraction classified as token-budget truncation failures.
      - unsafe_false_accepts: principle: count of invalid/unsafe outputs accepted as valid.
      - completion_slack_min_tokens: principle: minimum JSON completion slack observed or inherited from Exp5365.
      - methodology_duration_s: principle: live measurement duration excluding planning prose.
      - honest_verdict: principle: one-line clean/block verdict.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5367-v489-constraint-tax-tool-action-panel-v2
