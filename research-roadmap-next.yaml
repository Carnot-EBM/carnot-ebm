  - id: exp3693-external-comparator-dependency-vs-deentangled-reweighting
    operator_override: "2026-06-02 outer-loop directive: NEW external-comparator step strengthening the re-freeze (north-star sec-1: every headline must survive a stronger baseline; literature-priority two-source rule). Forward difference vs exp3667/3680 (which compared dependency-aware only to Carnot-current): adds a PUBLISHED weak-supervision reweighting comparator (de-entangled / CIG-style, arXiv:2604.07650) the candidate must beat. False-positive scope-match vs prior dependency-aware exps."
