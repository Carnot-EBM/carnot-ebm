  - id: exp348-sink-probe-hallucination-signal
    milestone: "2026.05.13"
    deliverable: python/carnot/pipeline/sink_probe.py
    title: "Exp 348: SinkProbe attention-sink hallucination pre-filter (arXiv 2604.10697)"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: arXiv 2604.10697 (SinkProbe) detects hallucination via attention sink analysis.
      Specific attention heads concentrate probability mass on "sink" tokens ([BOS], period, etc.)
      when the model is generating factually uncertain content. This is detectable via a single
      forward pass with attention output capture — no auxiliary model needed.

      For Carnot, SinkProbe is a FAST PRE-FILTER: if sink concentration is below a threshold,
      skip the expensive Ising verification entirely (fast path). This reduces Ising calls on
      responses the LLM is confident about while preserving full verification on uncertain ones.
      Estimated fast-path rate: 40-60% of responses (those below threshold).

      Combined three-tier pipeline:
        SinkProbe (fast, 0ms overhead except attention capture) →
        EORM ranker (55M GPU, ~10ms) →
        Ising verification (CPU, 0.006ms per constraint)

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/extract.py — ConstraintExtractor protocol
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline integration pattern
      - python/carnot/pipeline/__init__.py — exports
      - research-references.md — SinkProbe entry (2604.10697)
      - results/experiment_340_live_precision_benchmark.json — live responses with attention
        tensors (if present; check artifact schema for attention_tensors key)

      TASK: Implement SinkProbe as fast hallucination pre-filter.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-VERIFY-086 (SinkProbe pre-filter), REQ-VERIFY-087 (sink concentration threshold),
         SCENARIO-VERIFY-113/114/115 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - SinkTokenType enum: BOS, EOS, PERIOD, COMMA (common sink tokens)
         - SinkConcentration dataclass: per_head_sink_scores (list[float]),
           mean_sink_score float, max_sink_score float
         - compute_sink_concentration(attention_matrix: jnp.ndarray, sink_positions: list[int])
           → SinkConcentration:
           attention_matrix shape: (n_heads, seq_len, seq_len); compute concentration of
           attention mass at sink_positions for each head
         - SinkProbeResult dataclass: sink_concentration, is_uncertain bool,
           should_skip_verification bool
         - SinkProbe(threshold=0.3, sink_token_types=(BOS, PERIOD)):
           - score(attention_matrix, sink_positions) → SinkConcentration
           - decide(sink_concentration) → SinkProbeResult:
             is_uncertain = mean_sink_score < threshold (low sink = uncertainty)
             should_skip_verification = not is_uncertain
           - benchmark(responses_with_attention, correctness_labels) → dict:
             skip_rate, false_negative_rate (skipped a response that was wrong),
             true_negative_rate (correctly skipped a response that was right)
         - CI-safe: compute_sink_concentration works on random jnp arrays (no real model needed)
      4. Implement python/carnot/pipeline/sink_probe.py (follow test spec exactly).
      5. Export SinkProbe, SinkConcentration, SinkProbeResult from python/carnot/pipeline/__init__.py.
      6. Write scripts/experiment_348_sink_probe.py using ExperimentTemplate(348, ...):
         a. Generate 50 synthetic attention matrices (random jnp arrays, CI-safe)
