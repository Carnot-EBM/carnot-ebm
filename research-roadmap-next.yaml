    2. Implement python/carnot/verify/spectral_attention_probe.py:
       a. Class SpectralAttentionProbe:
          - build_cooccurrence_matrix(text: str, window=3) -> np.ndarray (NxN sparse):
            For each pair of tokens within window, increment co-occurrence count.
            N = vocabulary size (use token set from text).
          - compute_laplacian(cooccurrence: np.ndarray) -> np.ndarray:
            L = D - A where D is degree matrix (diagonal), A is adjacency.
          - compute_spectral_entropy(L: np.ndarray) -> float:
            Eigenvalues lambda_i = eigh(L, subset_by_index=[0, min(10, N-1)])
            Normalize: p_i = lambda_i / (sum(lambda_i) + 1e-8)
            E_spectral = -sum(p_i * log(p_i + 1e-8))
          - compute_trajectory(steps: list[str]) -> np.ndarray:
            [compute_spectral_entropy(build_cooccurrence_matrix(s)) for s in steps]
          - is_diffuse(trajectory: np.ndarray, threshold=2.0) -> bool:
            Mean trajectory > threshold AND monotonically increasing fraction > 0.5
          - train(pos_corpus, neg_corpus):
