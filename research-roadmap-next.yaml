      CONTEXT:
      Exp5500 spent SOTA GGUF effort but emitted missing-candidate rows. Before another SOTA hard/soft panel runs, prove that Carnot can obtain parseable proof/claim structures from the local inference path or a documented structured-output fallback. Exact validators remain the authority.

