milestone: "2026.05.206"
milestone_title: "KAN Formal Verification, EBM-CoT Latent Calibration, and Thermodynamic Sampling"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: "exp2059-archive-and-activate"
    title: "Phase 0: Archive .205 and activate .206"
    max_turns: 20
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: We are beginning milestone 2026.05.206. We must archive the previous milestone and update the tracking docs.
      
      EXISTING CODE TO READ FIRST:
      - ops/status.md
      - ops/changelog.md
      - openspec/change-proposals/research-roadmap-vNEXT.md
      
      TASK: Rename the vNEXT roadmap doc to match the current milestone and record the activation in ops/status.md and ops/changelog.md.
      
      CONCRETE STEPS:
      1. Move openspec/change-proposals/research-roadmap-vNEXT.md to openspec/change-proposals/research-roadmap-v2026.05.206.md
      2. Update ops/changelog.md to log the start of milestone 2026.05.206.
      3. Update ops/status.md to reflect the new active milestone and Phase 0 completion.
      4. Write the terminal deliverable artifact results/experiment_2059_activation.json with honest_verdict="activation_complete".
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2060-kan-symbolization-extractor"
    title: "Phase 1: KAN Symbolization Extractor"
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: Carnot's KAN tiers currently lack a way to extract exact symbolic formulas. KAN4CBC relies on symbolization of 1D splines to generate SMT-verifiable expressions.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/models/kaem_energy.py
      
      TASK: Implement a KANSymbolizer class that extracts piecewise algebraic expressions from trained KAN energy functions.
      
      CONCRETE STEPS:
      1. Create python/carnot/verify/kan_symbolizer.py.
      2. Implement a method to extract knot points and polynomial coefficients from UnivariateKAEMLayer.
      3. Generate a symbolic AST (Abstract Syntax Tree) string representing the constraints.
      4. Write tests with 100% coverage in tests/python/verify/test_kan_symbolizer.py.
      5. Save results to results/experiment_2060_kan_symbolizer.json including artifact field symbolization_ready=true.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2061-kan4cbc-smt-integration"
    title: "Phase 1: KAN4CBC SMT Verification Integration"
    gated_on:
      - upstream: "exp2060-kan-symbolization-extractor"
        artifact_field: "symbolization_ready"
        op: "=="
        value: true
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: With the KAN symbolizer implemented, we need to pass these expressions to Z3 to formally verify that no False Accepts are possible under given inputs.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/kan_symbolizer.py
      - python/carnot/pipeline/extract.py
      
      TASK: Implement SMT verification via Z3 for KAN symbolic formulas.
      
      CONCRETE STEPS:
      1. Create python/carnot/verify/kan_smt_verifier.py.
      2. Translate the KAN symbolic AST into z3.Real/z3.Int variables and assertions.
      3. Implement verify_zero_false_accept() that queries the solver for constraint violations.
      4. Write test coverage in tests/python/verify/test_kan_smt_verifier.py.
      5. Output results to results/experiment_2061_kan_smt.json.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2062-lut-kan-simulation"
    title: "Phase 1: LUT-based KAN deployment simulation"
    max_turns: 30
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: KANELÉ (arXiv:2512.12850) shows that KAN splines can map to FPGA LUTs. We need to measure the projected KV260 hardware resource usage for our KAN verification models.
      
      EXISTING CODE TO READ FIRST:
      - hardware/kv260/ising_sampler_v4_spec.md
      - python/carnot/models/kaem_energy.py
      
      TASK: Write a hardware accounting script that calculates LUTs and BRAM utilization for Carnot's KAN models if synthesized via LUT formulation.
      
      CONCRETE STEPS:
      1. Create scripts/hardware_account_lut_kan.py.
      2. The script should load a sample KAN model and compute the number of required 6-input LUTs for the spline resolutions.
      3. Ensure it runs and outputs a report.
      4. Save to results/experiment_2062_lut_kan_accounting.json.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2063-ebm-cot-latent-calibration"
    title: "Phase 2: EBM-CoT Latent Calibration Hook"
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: EBM-CoT (arXiv:2511.07124) applies energy-based calibration to latent thought embeddings. We must hook our energy tiers to the LLM's continuous representations.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py
      
      TASK: Implement an adapter that takes hidden states from local SOTA GGUFs and applies energy gradients to them.
      
      CONCRETE STEPS:
      1. Create python/carnot/inference/ebm_cot_adapter.py.
      2. Implement a method that perturbs the latent state based on the gradient of the energy function.
      3. In MODEL_SPECS, include 'unsloth/Qwen3.6-35B-A3B-GGUF' and 'unsloth/gemma-4-26B-A4B-it-GGUF'.
      4. Write a unit test ensuring the adapter modifies embeddings in the correct direction.
      5. Save to results/experiment_2063_ebm_cot_adapter.json with ebm_cot_ready=true.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2064-geometric-regulation-ising"
    title: "Phase 2: Geometric Regulation via Ising"
    gated_on:
      - upstream: "exp2063-ebm-cot-latent-calibration"
        artifact_field: "ebm_cot_ready"
        op: "=="
        value: true
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: Geometric Regulation (arXiv:2605.00435) prevents mode collapse in latent generation by using an Ising model phase transition metric.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/inference/ebm_cot_adapter.py
      
      TASK: Augment the EBM-CoT adapter with Geometric Regulation to maintain trajectory dimensionality.
      
      CONCRETE STEPS:
      1. Add a geometric regularizer penalty based on the pairwise Ising coupling variance in ebm_cot_adapter.py.
      2. If dimensionality collapses, increase temperature (simulated annealing).
      3. Add tests demonstrating escaping mode collapse.
      4. Save to results/experiment_2064_geometric_regulation.json.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2065-nrgpt-gradient-block"
    title: "Phase 2: NRGPT Gradient-based Block Simulator"
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: NRGPT (arXiv:2602.15002) uses the gradient of a parameterized energy function as the transformer generation step.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/phase3/continuous_ebm.py
      
      TASK: Implement an NRGPT continuous generation stub that proves energy descent maps to sequence generation.
      
      CONCRETE STEPS:
      1. Create python/carnot/phase3/nrgpt_stub.py.
      2. Implement a step function returning the negative gradient of the Phase 3 energy space.
      3. Write a test showing the sequence of gradients converges.
      4. Save to results/experiment_2065_nrgpt_stub.json.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2066-ebrm-training"
    title: "Phase 3: EBRM (Energy-Based Reward Model) Training"
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: The continuous self-learning loop needs stable rewards. Energy-Based Reward Models (EBRM) are robust against reward hacking.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/training/
      
      TASK: Implement a lightweight EBRM training loop using Contrastive Divergence on logical derivations.
      
      CONCRETE STEPS:
      1. Create python/carnot/training/ebrm_trainer.py.
      2. Train a small JAX MLP to act as the Energy Reward Model on synthetic logical traces.
      3. Save the trained artifact and write test coverage.
      4. Save to results/experiment_2066_ebrm_training.json with ebrm_trained=true.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2067-dtm-simulation"
    title: "Phase 3: DTM Simulation for Carnot Samplers"
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: Denoising Thermodynamic Models (DTM) repurpose EBMs for thermodynamic computing. We need a CPU simulator of this process.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/samplers/parallel_ising.py
      
      TASK: Implement a DTM simulator integrating Langevin thermal noise with Carnot's energy function.
      
      CONCRETE STEPS:
      1. Create python/carnot/samplers/dtm_sampler.py.
      2. Implement the DTM algorithm (arXiv:2510.23972) mapping state updates to thermal noise profiles.
      3. Write tests validating sampling convergence properties.
      4. Save to results/experiment_2067_dtm_simulation.json with dtm_sim_ready=true.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

