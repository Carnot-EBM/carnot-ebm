- id: exp862-lagrange-adaptive-ising
  milestone: 2026.04.66
  deliverable: results/experiment_862_lagrange_adaptive_ising.json
  title: 'Exp 862: LagrangeAdaptiveIsingConstraints — FR-11 Self-Learning Tier 1 (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: FR-11 (Autonomous Self-Learning Loop) requires at least one self-learning
    experiment per milestone. This is the mandatory FR-11 experiment for milestone .66.

    arXiv 2501.04971 (Self-Adaptive Ising Machine for Constrained Optimization) proposes
    Lagrange relaxation of Ising constraint weights: when a constraint is violated, its
    coupling weight lambda_k increases proportionally to the violation severity. After
    enough iterations, the energy landscape is shaped so that the minimum-energy state
    satisfies all constraints. This is adaptive self-learning: the system modifies its OWN
    coupling matrix based on what it gets wrong.

    Applied to Carnot's FR-11: LagrangeAdaptiveIsingConstraints runs a 5-session relay.
    Each session: sample N constraint problems (from EmbeddingConstraintStore), run Ising
    solver, check violations, update lambda weights. Session N+1 starts from updated weights.
    After 5 sessions, delta_s1_to_s5 = improvement in violation rate from session 1 to 5.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/ising.py — IsingEBM (current Ising implementation)
    - python/carnot/samplers/inertia_ising.py — InertiaIsingSampler (from Exp 860)
    - python/carnot/stores/embedding_constraint_store.py — EmbeddingConstraintStore
    - python/carnot/_bmad/prd.md — FR-11 definition
    - research-references.md — arXiv 2501.04971 entry
    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc Phase 3 section

    TASK: Implement LagrangeAdaptiveIsingConstraints. Run 5-session relay on synthetic
    constraint problems. Report delta_s1_to_s5 and violation rate per session.
    This is an FR-11 mandatory experiment — honest_verdict must report whether self-learning
    is occurring (not just whether AUC is high).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/models/ising.py and python/carnot/samplers/inertia_ising.py.
       Understand: how J matrix is built from constraints, how sampling works.
    3. Read python/carnot/stores/embedding_constraint_store.py.
       Find: how constraints are stored and retrieved.
    4. Implement python/carnot/samplers/lagrange_adaptive.py:
       class LagrangeAdaptiveIsingConstraints:
         def __init__(self, n_spins: int, n_constraints: int, lambda_init: float = 1.0,
                      lambda_lr: float = 0.1):
           self.n_spins = n_spins
           self.lambdas = np.ones(n_constraints) * lambda_init  # per-constraint weights
           self.lambda_lr = lambda_lr
           self.J_base = np.zeros((n_spins, n_spins))  # base coupling (from data)
           self.h = np.zeros(n_spins)

         def build_J(self, constraints: list[dict]) -> np.ndarray:
           # Build J from constraints, weighted by current lambdas.
           # constraint format: {"spins": [i, j], "sign": +1/-1, "penalty": float}
           J = self.J_base.copy()
           for k, c in enumerate(constraints):
             i, j = c["spins"]
             J[i, j] += self.lambdas[k] * c["sign"] * c["penalty"]
             J[j, i] += self.lambdas[k] * c["sign"] * c["penalty"]
           return J

         def run_session(self, constraints: list[dict], n_sweeps: int = 100) -> dict:
           J = self.build_J(constraints)
           sampler = InertiaIsingSampler(J, self.h)
           samples = sampler.sample(n_sweeps=n_sweeps, n_samples=10)
           # Compute violations: for each sample, count constraints not satisfied
           violations = self._count_violations(samples, constraints)
           violation_rate = violations.mean()
           # Lagrange update: increase lambda for violated constraints
           for k, c in enumerate(constraints):
             avg_violation = self._constraint_violation(samples, c)
             self.lambdas[k] += self.lambda_lr * avg_violation
           return {"violation_rate": float(violation_rate), "lambdas": self.lambdas.tolist()}

         def _count_violations(self, samples, constraints) -> np.ndarray: ...
         def _constraint_violation(self, samples, constraint) -> float: ...

    5. Build synthetic constraint relay:
       - Create 10 synthetic binary constraints (e.g., "spin i and j must agree").
       - 5 of 10 start violated (J matrix encourages wrong alignment).
       - Run 5 sessions with LagrangeAdaptiveIsingConstraints.
       - Record violation_rate per session: [vr_s1, vr_s2, vr_s3, vr_s4, vr_s5].
       - delta_s1_to_s5 = vr_s1 - vr_s5 (positive = improvement = self-learning).
    6. Create scripts/experiment_862_lagrange_adaptive_ising.py using ExperimentTemplate(862).
       tmpl = ExperimentTemplate(862, "LagrangeAdaptive Ising FR-11 self-learning",
                                  "results/experiment_862_lagrange_adaptive_ising.json",
                                  requires_gpu=False)
       tmpl.setup()
       Collect:
         - violation_rates: [float x 5]
         - delta_s1_to_s5: float (positive = self-learning confirmed)
         - lambda_trajectory: list of lambda arrays per session
         - fr11_self_learning_confirmed: delta_s1_to_s5 > 0
       honest_verdict:
         - "fr11_self_learning_confirmed" if delta_s1_to_s5 > 0
         - "fr11_no_improvement" if delta_s1_to_s5 <= 0
         (FR-11 requires this experiment; "no_improvement" is still a valid result)
       Build artifact and write results/experiment_862_lagrange_adaptive_ising.json.
    7. Add spec update: openspec/capabilities/self-learning/spec.md — add REQ-FR11-020
       "LagrangeAdaptiveIsingConstraints (arXiv 2501.04971) MUST implement violation-
       driven lambda weight updates over multi-session relays as Tier 1 FR-11 mechanism."
       Add SCENARIO-FR11-030: "Given 5 sessions on synthetic constraints, delta_s1_to_s5 > 0."
    8. Write tests/python/test_experiment_862_lagrange_adaptive_ising.py with 100% coverage.
       Test build_J() weights constraints by lambdas.
       Test run_session() returns violation_rate and updated lambdas.
       Test delta_s1_to_s5 computation.
       Traces to REQ-FR11-020 (new), SCENARIO-FR11-030 (new).
    9. Reconcile:
       - ops/changelog.md: one-line entry
       - ops/status.md: "Exp 862: LagrangeAdaptive Ising FR-11. delta_s1_to_s5={result}.
         fr11_self_learning_confirmed={result}."
    10. tmpl.assert_deliverable_written() as final line.

