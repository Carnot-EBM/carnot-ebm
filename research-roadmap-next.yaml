        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        The Microchip PolarFire SoC Discovery Kit is SSH-attached via
        FlashPro5 (1514:2008). The board runs Linux on the riscv64 hart
        cluster (kernel 6.18.17-linux4microchip-2026.04.1 confirmed via
