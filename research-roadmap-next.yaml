      field_principles must map every required field and the downstream gguf_runtime_observability_ready_score gate to one short sentence that explains why it exists. field_provenance must identify measured child data, source hash, derived check, or constant for every required field. Set verifier_is_oracle=false because this task verifies runtime authenticity, not proposal correctness.

