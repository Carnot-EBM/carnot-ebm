milestone: "2026.08.582"
milestone_title: "Exact Transport and Prospective Adaptation"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6674-v582-manifest-parity-contract
    milestone: "2026.08.582"
    deliverable: results/experiment_6674_v582_manifest_parity_contract.json
    title: "V582 document-to-manifest parity contract"
    priority: critical
    track: execution-integrity
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 45
    agent_type: claude
    model: opus
    prior_failures:
      - experiment_id: exp6660-v581-evidence-contract
        verdict: "missing_terminal_artifact: three Gemini dispatch attempts failed before experiment execution"
        addressed_by: "This attempt uses an executable Claude Opus preflight and compares the exact design and YAML task sets; it does not depend on Gemini metadata."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      V581 reached a terminal conductor state with only four active YAML tasks even though its design document declared fourteen. Its first task failed on unavailable Gemini metadata. V582 must prove that the active execution contract matches the design before scientific work proceeds. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml when present
      - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md, {project_root}/ops/exclusion_manifest.yaml, and all available Exp6660-Exp6663 records
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/audit_roadmap_gates.py, {project_root}/scripts/exclusion_manifest_lint.py, and {project_root}/scripts/conductor_gates.py
      - relevant evidence, reporting, and pipeline specs plus {project_root}/ops/e2e-test-plan.md

      TASK:
      Audit the complete V582 execution contract. Confirm exact document-to-YAML task-set parity, conductor order, deliverables, dependencies, structured gates, producer field spelling, prior-failure entries, routes, and run commands. Do not patch the roadmap, validators, exclusion manifest, conductor, or implementation code.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash the active and next roadmaps when present, the V582 design, the conductor, the exclusion manifest, and the V581 records; record Python, CPU, RAM, disk, and the no-LLM substrate.
      1. Parse the V582 design and manifest. Require exactly exp6674 through exp6687 in identical order with one unique JSON deliverable each.
      2. Compare title, track, resource flag, dependency, gate, route, prior-failure block, required artifact field, and run command for every task.
      3. For every gate, prove that the upstream task exists in V582 and declares the artifact_field with identical spelling in its own REQUIRED ARTIFACT FIELDS.
      4. Check each dependency and prior experiment against the exclusion manifest and completed record. Reject a reference to a retired upstream task.
      5. Run YAML parse, roadmap schema, prior-failure, gate-contract, and exclusion-manifest checks in read-only mode. Record the stale audit rule that pins Codex to gpt-5.5 as a validator mismatch because this operator plan requires gpt-5.6-sol; do not silently treat it as a task defect and do not patch it.
      6. Set v582_manifest_parity_ready=true only if task sets, order, fields, gates, paths, and commands match and there is no activation-hard violation.
      7. Write atomically. Run focused validation, row consistency, artifact validation, adversarial verification, and git status.

      Required deliverable: {project_root}/results/experiment_6674_v582_manifest_parity_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal task state. Principle: deterministic process evidence.
        honest_verdict: parity conclusion with no scientific claim. Principle: measured evidence only.
        verdict_class: one of positive|circular_positive|null|blocked|disqualified|partial; ready infrastructure is null. Principle: closed classification.
        gate_check_summary: exact failed check, expected value, and observed value for any blocked result. Principle: deterministic failure localization.
        design_task_rows: ordered task IDs and declared fields from the design. Principle: raw contract evidence.
        manifest_task_rows: ordered task IDs and declared fields from YAML. Principle: raw execution evidence.
        producer_consumer_rows: gate producer, field, consumer, operator, and value. Principle: deterministic cross-reference evidence.
        prior_failure_rows: prior scope, verdict, changed condition, and retirement signal. Principle: traceable lineage.
        validator_rows: command, exit, output, classification, and hash. Principle: reproducible verification.
        validator_mismatch_rows: dated operator-schema conflicts with no silent suppression. Principle: honest tool-boundary evidence.
        v582_manifest_parity_ready: boolean owned by this task. Principle: deterministic reduction from complete rows.
        per_unit_rows: every task, gate, prior, and validator row. Principle: recheckable raw evidence.
        aggregate_row_recomputation: readiness rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: inputs, resources, and hashes. Principle: measured provenance.
        protected_files_unchanged: before and after hashes for both roadmaps and the conductor. Principle: deterministic integrity.
        inference_substrate: artifact_and_manifest_audit_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: true for this infrastructure contract. Principle: explicit circularity boundary.
        field_provenance: source path, parser, function, and hash per field. Principle: traceable evidence.
        random_seed: deterministic audit-order seed. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6674_v582_manifest_parity_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6675-triggered-tail-scope-receipt
    milestone: "2026.08.582"
    deliverable: results/experiment_6675_triggered_tail_scope_receipt.json
    title: "Triggered-tail task-owned verification receipt"
    priority: critical
    track: verification-transport
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.6-sol
    prior_failures:
      - experiment_id: exp6661-triggered-tail-fixture
        verdict: "blocked_triggered_tail_fixture: tests failed"
        addressed_by: "The fixture already passes every owned check; this task uses the approved task-owned verification scope and keeps the unrelated full-suite failure diagnostic."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp6661 built the frozen triggered-tail fixture. Its 33 focused tests, scoped coverage, lint, format, and spec coverage passed. Readiness was false only because the task also required the known-red repository-wide suite, whose 3,923 cached failures contained zero Exp6661 nodes. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V582 roadmap doc, and the V582 research-reference refresh
      - {project_root}/results/experiment_6661_triggered_tail_fixture.json and {project_root}/results/experiment_6662_triggered_structured_tail_ab.json
      - {project_root}/python/carnot/experiment_6661_triggered_tail_fixture.py and {project_root}/tests/python/test_experiment_6661_triggered_tail_fixture.py
      - {project_root}/ops/known-issues.md entries on the red repository suite and verification scope
      - relevant verification, evidence, reporting, and pipeline specs plus the E2E plan

      TASK:
      Qualify the existing fixture with task-owned evidence. Do not rebuild the corpus. Do not remove or hide the repository-wide suite diagnostic. If an owned check fails, diagnose and fix only the owned defect under spec-first and tests-first discipline.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash Exp6661 inputs, module, tests, specs, active roadmap, conductor, and global-suite diagnostic; record CPU, RAM, disk, and the no-LLM substrate.
      1. Recompute the frozen manifest, arm contracts, semantic-free grammar receipt, exact positive and negative controls, leakage attacks, and all row counts from Exp6661.
      2. Run the 33 focused tests, 100% scoped coverage, ruff check, format check, and spec coverage with the commands recorded in Exp6661.
      3. Attribute every failing node to owned or unrelated scope. The readiness reducer may use only owned nodes. Record the full-suite failure count and cache hash as a non-gating diagnostic.
      4. Attack answer permutation, label renaming, grammar-only recovery, trigger collision, premature trigger, missing trigger, malformed tail, unknown fields, and syntactically valid wrong answers.
      5. Set triggered_tail_fixture_ready=true only if every owned check and attack passes and the frozen input hashes match.
      6. If an owned defect exists, add or update REQ-* and SCENARIO-* anchors, write the focused failing test first, fix only that defect, and rerun all owned checks.
      7. Write atomically. Run row consistency, artifact validation, adversarial verification, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6675_triggered_tail_scope_receipt.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal task state. Principle: deterministic process evidence.
        honest_verdict: owned-scope readiness or exact blocker. Principle: measured evidence only.
        verdict_class: closed enum; a ready fixture is null infrastructure. Principle: deterministic classification.
        gate_check_summary: failed owned check and observed value for blocked results. Principle: deterministic failure localization.
        frozen_input_receipts: Exp6661 artifact, source, test, spec, parser, grammar, and checker hashes. Principle: immutable provenance.
        owned_test_rows: command, node set, exit, coverage, and duration. Principle: task-scoped verification.
        global_suite_diagnostic: command, failure count, Exp6661-owned failure count, and cache hash. Principle: visible non-gating repository state.
        exact_checker_rows: positive and negative controls per family. Principle: executable authority.
        leakage_attack_rows: attack, expected result, observed result, and receipt. Principle: adversarial evidence.
        triggered_tail_fixture_ready: boolean owned by this task. Principle: deterministic reduction from owned checks.
        per_unit_rows: every test, checker, task, and attack row. Principle: recheckable raw evidence.
        aggregate_row_recomputation: readiness rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: inputs, resources, and hashes. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: cpu_fixture_receipt_and_exact_checks_no_llm. Principle: measured substrate identity.
        verifier_is_oracle: true because exact fixtures define readiness. Principle: explicit circularity boundary.
        field_provenance: source path, function, and hash per field. Principle: traceable evidence.
        random_seed: deterministic attack-order seed. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6675_triggered_tail_scope_receipt --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6676-three-family-triggered-tail-ab
    milestone: "2026.08.582"
    deliverable: results/experiment_6676_three_family_triggered_tail_ab.json
    title: "Three-family delayed syntax-tail A/B"
    priority: critical
    track: verification-transport
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 240
    gated_on:
      - upstream: exp6675-triggered-tail-scope-receipt
        artifact_field: triggered_tail_fixture_ready
        op: in
        value: [true]
    prior_failures:
      - experiment_id: exp5923-sota-schema-supported-constraintir-ab
        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "The treatment preserves free reasoning and constrains only a short semantic-free tail; immediate JSON is a control and no answer-ID transport is used."
        retire_if_same_verdict: true
      - experiment_id: exp6662-triggered-structured-tail-ab
        verdict: "blocked_gate_check_failed"
        addressed_by: "Exp6675 replaces the false global-suite readiness gate with an owned-scope receipt before this comparison runs."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      V580 parsed 10 of 48 direct exact-certificate rows. V581's A/B never ran because its valid fixture was held behind an unrelated global-suite failure. This task now compares three output transports on the same frozen exact corpus. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/scripts/experiment_template.py, and the V582 roadmap doc
      - {project_root}/results/experiment_6675_triggered_tail_scope_receipt.json, Exp6661, Exp6648, Exp6649, Exp6650, and Exp5923 artifacts
      - {project_root}/python/carnot/inference/sota_models.py, GGUF loaders, embedded-tokenizer helpers, and lease/process receipt code
      - exact corpus, parser, compiler, checker, evidence, inference, safety, and reporting specs plus the E2E plan

      TASK:
      Compare natural extraction, immediate JSON, and free reasoning followed by a trigger-switched semantic-free syntax tail on all three mandated local GGUF families. Exact executable checkers remain the only semantic authority.

      CONCRETE STEPS:
      0. PRECONDITIONS: resolve all model files from the local cache; verify GGUF magic, hashes, embedded tokenizers, CUDA visibility, VRAM, disk, RAM, lease ownership, port ownership, and no conflicting workload. If a mandated model cannot run on CUDA, write a blocked artifact and stop.
      1. Use MODEL_SPECS containing unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Resolve through cached_sota_pair() and resolve_cached_gguf(). Legacy small models may run CPU smoke tests only and cannot satisfy a headline row.
      2. Freeze tasks, prompts, three arm contracts, seeds, generation settings, proposal-token budgets, stopping rules, parsers, grammar hash, checker hashes, model order, and missing-row policy before inference.
      3. Launch fresh owner-bound llama.cpp CUDA processes. Run matched model-task-arm units. Record raw text, reasoning text, trigger position, tail, parse outcome, exact outcome, harmful flip, token counts, latency, process identity, and accelerator evidence.
      4. Keep one planned generation per unit. Do not use suffix regeneration, answer IDs, hidden gold fields, solver-generated answers in prompts, or grammar alternatives that encode the answer.
      5. Compute exact success and parse yield overall, per model, and per held family. Report paired deltas, intervals, wins, losses, ties, harmful flips, missing rows, and no-headroom rows.
      6. Set triggered_tail_ab_ready=true only when every preregistered unit is present or explicitly missing with cause, all raw outputs and receipts exist, and aggregates recompute from rows.
      7. Write atomically. Cleanly unload servers and release leases. Run focused tests, scoped coverage, spec coverage, row/artifact/adversarial checks, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6676_three_family_triggered_tail_ab.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal task state. Principle: deterministic process evidence.
        honest_verdict: exact transport result or precise blocker. Principle: measured evidence only.
        verdict_class: closed enum; verifier_is_oracle=true forbids independent positive. Principle: deterministic classification.
        gate_check_summary: upstream or runtime failed check with expected and observed values. Principle: deterministic failure localization.
        model_specs: exact hub IDs, paths, hashes, tokenizer sources, quantization, GPU assignments, and roles. Principle: substrate identity.
        models_used: exact mandated hub IDs that completed rows. Principle: measured model provenance.
        frozen_run_manifest: tasks, arms, seeds, budgets, settings, order, parsers, grammar, and checker hashes. Principle: preregistered comparison.
        per_model_process_receipts: PID/start, port, owner token, model hash, phase, CUDA UUID, VRAM, inference count, unload, and release. Principle: authentic accelerator use.
        per_unit_rows: every model-task-arm unit with raw output, trigger, parse, exact result, tokens, latency, and receipt links. Principle: recheckable comparative evidence.
        held_family_rows: per-family exact outcomes and paired arm deltas. Principle: transfer evidence.
        harmful_flip_rows: baseline-correct units made wrong by a constrained arm. Principle: safety accounting.
        exact_success_summary: exact counts, rates, paired deltas, and intervals rebuilt from rows. Principle: deterministic aggregation.
        parse_transport_summary: parse counts and rates separated from semantic success. Principle: claim separation.
        triggered_tail_ab_ready: boolean owned by this task. Principle: completeness reduction from rows.
        aggregate_row_recomputation: all headlines rebuilt from per-unit rows. Principle: deterministic aggregation.
        preconditions_checked: cache, CUDA, lease, process, memory, disk, and input receipts. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: local_llamacpp_cuda_mandated_gguf_three_family. Principle: measured substrate identity.
        verifier_is_oracle: true because executable task checkers define correctness. Principle: explicit circularity boundary.
        field_provenance: raw source, parser, checker, function, and hash per field. Principle: traceable evidence.
        random_seed: base and per-unit seeds. Principle: reproducibility.
        duration_s: total monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6676_three_family_triggered_tail_ab --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6677-triggered-tail-independent-audit
    milestone: "2026.08.582"
    deliverable: results/experiment_6677_triggered_tail_independent_audit.json
    title: "Delayed syntax-tail blinded row audit"
    priority: high
    track: verification-transport
    requires_gpu: false
    per_unit_rows: true
    max_turns: 40
    estimated_wall_time_min: 90
    gated_on:
      - upstream: exp6676-three-family-triggered-tail-ab
        artifact_field: triggered_tail_ab_ready
        op: in
        value: [true]
    prior_failures:
      - experiment_id: exp6652-constraint-intervention-audit
        verdict: "blocked_gate_check_failed"
        addressed_by: "This audit consumes a complete fixed-arm row set instead of the retired suffix-regeneration headroom chain."
        retire_if_same_verdict: true
      - experiment_id: exp6663-structured-tail-independent-audit
        verdict: "preemptive_skip: upstream gate chain terminated before a terminal artifact was produced"
        addressed_by: "Exp6676 now owns an explicit completeness field and this audit is gated on that exact producer field."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp6676 makes a comparative claim over three models and three output transports. This task must reproduce that claim from blinded raw rows and test whether the delayed grammar contains answer information. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V582 roadmap doc, and the V582 reference refresh
      - {project_root}/results/experiment_6676_three_family_triggered_tail_ab.json, Exp6675, Exp6661, Exp6652, and Exp5923 artifacts
      - exact checker, parser, GGUF receipt, row-consistency, artifact-validation, and adversarial-verification code and tests
      - relevant verification, evidence, reporting, safety, and inference specs plus the E2E plan

      TASK:
      Blind model and arm labels, rerun exact checkers in cold processes, rebuild all aggregates, and attack syntax leakage, parser coercion, missing-row handling, duplicates, and budget equality. Do not generate new model answers.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash Exp6676, raw output stores, frozen manifest, checkers, parsers, grammar, active roadmap, and conductor; record CPU, RAM, disk, and the no-new-LLM substrate.
      1. Freeze a deterministic blinding map. Verify one-to-one coverage of every preregistered model-task-arm unit.
      2. Rerun exact executable checks from raw output bytes in isolated cold processes. Recompute parse yield, exact success, paired deltas, intervals, harmful flips, and held-family results.
      3. Attack answer permutation, label renaming, grammar-only recovery, trigger collision, tail removal, malformed JSON, unknown fields, parser coercion, duplicate rows, dropped failures, unequal budgets, and model-receipt substitution.
      4. Compare reported and recomputed fields. Missing values remain missing. A parse gain without exact gain remains a transport-only result.
      5. Set independent_audit_passed=true only if row coverage, cold checks, aggregates, budgets, receipts, and leakage tests all pass.
      6. Classify any result with executable-oracle correctness as circular_positive at most. Do not promote it to an oracle-distinct verifier claim.
      7. Write atomically. Run focused tests, scoped coverage, spec coverage, row/artifact/adversarial checks, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6677_triggered_tail_independent_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal audit state. Principle: deterministic process evidence.
        honest_verdict: reproduced, corrected, null, or blocked conclusion. Principle: measured evidence only.
        verdict_class: closed enum with oracle circularity preserved. Principle: deterministic classification.
        gate_check_summary: failed upstream or audit check with expected and observed values. Principle: deterministic failure localization.
        blinding_receipt: sealed label map hash and reveal procedure. Principle: independent evaluation.
        row_coverage_rows: expected and observed unit identities. Principle: completeness evidence.
        cold_checker_rows: raw-output hash, checker identity, expected field, and recomputed result per unit. Principle: executable authority.
        leakage_attack_rows: attack, expected result, observed result, and implicated field. Principle: adversarial evidence.
        budget_equality_rows: matched token and generation budgets per paired unit. Principle: fair comparison.
        harmful_flip_rows: all correct-to-wrong interventions. Principle: safety accounting.
        reported_vs_recomputed: field-level differences and corrections. Principle: deterministic audit.
        independent_audit_passed: boolean owned by this task. Principle: deterministic reduction from audit checks.
        per_unit_rows: every unit, check, attack, and comparison. Principle: recheckable raw evidence.
        aggregate_row_recomputation: all audited headlines rebuilt from rows. Principle: deterministic aggregation.
        preconditions_checked: inputs, tools, resources, and hashes. Principle: measured provenance.
        protected_files_unchanged: active roadmap and conductor hashes before and after. Principle: deterministic integrity.
        inference_substrate: cold_exact_replay_no_new_llm. Principle: measured substrate identity.
        verifier_is_oracle: true. Principle: explicit circularity boundary.
        field_provenance: source bytes, parser, checker, function, and hash per field. Principle: traceable evidence.
        random_seed: blinding and attack-order seeds. Principle: reproducibility.
        duration_s: monotonic runtime. Principle: measured value.
        tests_run: commands, exits, and summaries. Principle: reproducible verification.
        reproducibility_checksum: canonical artifact hash. Principle: deterministic identity.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6677_triggered_tail_independent_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6678-constraint-family-stream
    milestone: "2026.08.582"
    deliverable: results/experiment_6678_constraint_family_stream.json
    title: "Independent constraint-family prequential stream"
    priority: critical
    track: continuous-self-learning
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.6-sol
    prior_failures:
      - experiment_id: exp5709-fr11-prospective-shadow-stream
        verdict: "blocked_gate_check_failed"
        addressed_by: "This attempt builds a sealed no-LLM multi-family fixture before any prospective run and owns its exact stream-readiness field in the same roadmap."
        retire_if_same_verdict: true
      - experiment_id: exp5786-sota-hardness-controlled-constraint-stream
        verdict: "complete: sota_constraint_response_stream_collected_not_ready:parser_failure_threshold"
        addressed_by: "This task emits exact-checkable event definitions without model responses, so parser failure cannot suppress fixture readiness."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      V580's repair memory was safe and reversible, but all evidence came from one fixture. The next continuous-learning test needs independent constraint families, sealed order manifests, and exact event authority before any model run. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md Continuous Self-Learning section, and the V582 roadmap doc
      - {project_root}/results/experiment_6653_state_grounded_repair_memory_fixture.json, Exp6654, Exp6655, Exp6675, and Exp6661 artifacts
      - repair-memory stores, atomic state writers, inverse-patch code, exact scheduling, graph, logic, plan-state checkers, and their tests
      - relevant self-learning, verification, constraint-compiler, evidence, safety, and reporting specs plus the E2E plan

      TASK:
      Build a frozen prequential stream across at least four independent exact-checkable constraint families. Define a family-blind typed repair record, held-family partitions, five or more event orders, and byte-exact restart and rollback fixtures. Do not run an LLM.

      CONCRETE STEPS:
      0. PRECONDITIONS: hash all source corpora, checkers, repair-memory modules, state schemas, active roadmap, and conductor; record CPU, RAM, disk, writable state path, and the no-LLM substrate.
      1. Add REQ-* and SCENARIO-* anchors for prequential ordering, between-event admission, family-blind keys, exact validation, retirement, restart, and inverse-patch rollback. Write focused tests first.
      2. Build scheduling, graph, arithmetic or logic, and plan-state event families. Each family needs executable positive and negative controls and at least one transferable repair operator.
      3. Freeze calibration and held-family partitions plus at least five event orders. Prevent task identity, family label, future outcome, hidden gold, and future state from entering retrieval keys.
      4. Define each event with visible pre-event state, exact violation witness, candidate operator, applicability key, support, anchors, version, provenance, and inverse patch.
      5. Attack future leakage, family-specific keys, duplicate events, shuffled timestamps, poison patches, support collapse, anchor regression, partial writes, restart corruption, and non-invertible rollback.
      6. Set constraint_family_stream_ready=true only if every family, order, checker control, isolation test, restart test, and rollback test passes.
      7. Write atomically. Run focused tests, 100% scoped coverage, lint, format, spec coverage, row/artifact/adversarial checks, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6678_constraint_family_stream.json.
      REQUIRED ARTIFACT FIELDS:
        status: terminal fixture state. Principle: deterministic process evidence.
        honest_verdict: stream readiness or exact blocker with no benefit claim. Principle: measured evidence only.
        verdict_class: closed enum; a ready stream is null infrastructure. Principle: deterministic classification.
        gate_check_summary: failed family, checker, isolation, state, or test check with observed value. Principle: deterministic failure localization.
