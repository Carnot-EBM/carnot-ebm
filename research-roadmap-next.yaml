        retire_if_same_verdict: true
      - experiment_id: exp3126-fragment-time-monitor-satisfiable-drift-audit
        verdict: "complete: fragment_time_monitor_v1_ready=true; monitored_fixture_count=72; monitor_violation_count=2; ledger_consistency_rate=0.666667"
        addressed_by: "Adds premise/answer grounding to improve ledger consistency and block false accepts before repair."
