- id: exp1456-grpo-vprm-lineage-consolidation-retirement
  milestone: 2026.04.112
  deliverable: results/experiment_1456_grpo_vprm_lineage_consolidation_retirement.json
  title: "GRPO/VPRM Lineage Consolidation + Retirement — Block GRPO v15 Unless Operator Reopens"
