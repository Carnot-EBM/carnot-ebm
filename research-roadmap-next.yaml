    hallucination signal. The key insight: during hallucination, the CoT trajectory visits
    regions of SAE feature space that are geometrically distant from the grounded reasoning
    manifold. The energy signal is:
      E_geo(trajectory) = sum_t || f_SAE(step_t) - centroid_grounded ||_2
    where f_SAE(step_t) is the SAE feature activation for step t, and centroid_grounded
    is the mean activation of a reference set of correct reasoning steps.

    For Carnot, we don't have a trained SAE. We can approximate: use a bigram TF-IDF
    feature representation of CoT steps (lightweight, no GPU needed). The geometric
    energy is then the L2 distance from the grounded centroid in TF-IDF space.
    This is an approximation of the full SAE approach, explicitly labeled as such.

    This is Tier 0i in the cascade (advisory, does not block repair).

    EXISTING CODE TO READ FIRST:
    - python/carnot/probes/ — existing probe implementations
    - python/carnot/pipeline/verify_repair.py — VerificationCertificate structure
    - python/carnot/probes/streaming_cot_detector.py — Tier 0g (from Exp 861, reference for probe pattern)
    - research-references.md — arXiv 2604.16430 entry
    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc Phase 3 section

    TASK: Implement HalluSAEGeometricProbe (Tier 0i) using TF-IDF bigram as SAE proxy.
    Add geometric_energy field to VerificationCertificate. Benchmark AUC on 50 synthetic
    CoT pairs.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/probes/ directory. Note the probe interface pattern (likely
       probe.score(text) -> float, probe.is_anomalous() -> bool).
    3. Read python/carnot/probes/streaming_cot_detector.py. Use as a template for
       the new probe's structure.
    4. Implement python/carnot/probes/hallusae_geometric_probe.py:
       from sklearn.feature_extraction.text import TfidfVectorizer
       import numpy as np

       class HalluSAEGeometricProbe:
         def __init__(self, reference_steps: list[str], threshold: float = 0.8):
           # reference_steps: list of correct reasoning steps (grounded manifold)
           self.vectorizer = TfidfVectorizer(ngram_range=(1,2), max_features=512)
           ref_features = self.vectorizer.fit_transform(reference_steps).toarray()
           self.centroid = ref_features.mean(axis=0)
           self.threshold = threshold

         def geometric_energy(self, cot_steps: list[str]) -> float:
           # Mean L2 distance from grounded centroid over trajectory
           features = self.vectorizer.transform(cot_steps).toarray()
           distances = np.linalg.norm(features - self.centroid, axis=1)
           return float(distances.mean())

         def is_anomalous(self, cot_steps: list[str]) -> bool:
           return self.geometric_energy(cot_steps) > self.threshold
    5. Extend VerificationCertificate:
       Add field: geometric_energy: float = 0.0
       Add field: hallusae_anomalous: bool = False
    6. Create 50 synthetic CoT pairs for AUC benchmark:
       - 25 correct: math reasoning steps with correct intermediate results.
       - 25 incorrect: same problems with injected nonsense step (e.g., "therefore X = 42"
         when X should be 7). The nonsense step should be geometrically distant from
         correct steps in TF-IDF space.
       - Build reference set from the 25 correct CoT steps.
    7. Compute AUC_geometric:
       - Probe = HalluSAEGeometricProbe(reference_steps=correct_steps)
       - For each pair: energy = probe.geometric_energy(steps)
       - Labels: 1 if hallucinated, 0 if correct
       - AUC_geometric = roc_auc_score(labels, energies)
    8. Create scripts/experiment_863_hallusae_geometric_probe.py using ExperimentTemplate(863).
