  - id: exp2636
    milestone: "2026.05.252"
    deliverable: "results/experiment_2636_tier0w_avgwd_eigenwd.json"
    title: "Tier 0w: AvgWD/EigenWD Embedding-Geometry Hallucination Verifier (arXiv:2603.22303)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: verifier

    prior_failures:
      - experiment_id: exp878-hallusae-sae-geometry-v2
        verdict: "below_v1: auc_v2=0.45 < v1=0.61; SAE geometry approach does not discriminate"
        addressed_by: "HalluSAEGeometricProbe used sparse autoencoder geometry (retired scope per exclusion manifest). AvgWD/EigenWD uses fundamentally different signal: (a) AvgWD = average Wasserstein-1 distance between consecutive token embedding distributions; (b) EigenWD = dominant eigenvalue of the covariance matrix of last-layer embeddings. Different paper (arXiv:2603.22303), different metric family (Wasserstein/eigenvalue vs SAE probe geometry), different root cause for why hallucinations differ from correct outputs."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      arXiv:2603.22303 introduces two training-free hallucination detection signals from last-layer token
      embeddings: AvgWD (average Wasserstein distance between token embedding distribution pairs) and
      EigenWD (dominant eigenvalue of the covariance matrix of the token embedding set).

      Key insight: hallucinated content produces HIGHER embedding-space variance (higher EigenWD) and
      LESS consistent token-to-token transitions (higher AvgWD) compared to factually correct content.
      Both signals require only embedding access — no logit export, no model fine-tuning.

      Implementation strategy (no embedding model required — use TF-IDF approximation):
      - AvgWD proxy: Wasserstein-1 distance between TF-IDF bigram distributions of the first and
        second halves of the claim (or between claim and context distributions).
      - EigenWD proxy: dominant eigenvalue of the TF-IDF term-frequency matrix across sentences in
        the claim.

      Hypothesis: claims with high embedding variance are more likely hallucinated.
      Target: tier0w_auroc >= 0.65 on FoVer real corpus (N >= 200 examples).

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (examine existing tier0*.py files for pattern — especially tier0z_semantic_energy.py)
      - python/carnot/verify/base_verifier.py (BaseVerifier interface)
      - data/fover_corpus.jsonl (corpus format — (context, claim, label))

      TASK: Implement Tier 0w AvgWD/EigenWD verifier and evaluate on FoVer real corpus.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import numpy; import sklearn; import scipy"` succeeds.
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. FoVer corpus discoverable: check paths:
            {project_root}/data/fover_corpus.jsonl (n_lines >= 100)
            If absent: try {project_root}/python/carnot/verify/foVer_corpus.jsonl
            If none found: write honest_verdict blocked_fover_corpus_not_found; exit.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus (JSONL). Parse (context, claim, label) triples.
         n_corpus = number of valid triples with label in {0, 1, 'hallucination', 'correct'}.
         Require n_corpus >= 200 for statistical validity.

      2. Implement Tier0wVerifier in python/carnot/verify/tier0w_avgwd_eigenwd.py:

         from sklearn.feature_extraction.text import TfidfVectorizer
         import numpy as np
         from scipy.stats import wasserstein_distance

         class Tier0wVerifier:
             """AvgWD/EigenWD embedding-geometry hallucination verifier.
             Per arXiv:2603.22303: hallucinations exhibit higher Wasserstein distance between
             token embedding sub-distributions and higher dominant eigenvalue of the embedding
             covariance matrix compared to factually correct content.
             Implemented here via TF-IDF proxy (no external embedding model required)."""

             def __init__(self):
                 self.vectorizer = TfidfVectorizer(ngram_range=(1,2), max_features=500)

             def fit(self, texts: list):
                 """Fit TF-IDF vocabulary on training texts."""
                 self.vectorizer.fit(texts)

             def _avg_wd(self, context: str, claim: str) -> float:
                 """AvgWD: Wasserstein-1 distance between context and claim TF-IDF distributions."""
                 try:
                     ctx_vec = self.vectorizer.transform([context]).toarray()[0]
                     clm_vec = self.vectorizer.transform([claim]).toarray()[0]
                     # Normalize to probability distributions
                     ctx_sum = ctx_vec.sum(); clm_sum = clm_vec.sum()
                     if ctx_sum == 0 or clm_sum == 0:
                         return 0.5
                     ctx_prob = ctx_vec / ctx_sum
                     clm_prob = clm_vec / clm_sum
                     return wasserstein_distance(ctx_prob, clm_prob)
                 except Exception:
                     return 0.5

             def _eigen_wd(self, claim: str) -> float:
                 """EigenWD: dominant eigenvalue of sentence-level TF-IDF covariance."""
                 sentences = claim.split('. ')
                 if len(sentences) < 2:
                     return 0.5
                 vecs = self.vectorizer.transform(sentences).toarray()
                 cov = np.cov(vecs.T)
                 if cov.ndim == 0:
                     return float(cov)
                 eigenvalues = np.linalg.eigvalsh(cov)
                 return float(eigenvalues[-1])  # dominant eigenvalue

             def score(self, context: str, claim: str) -> float:
                 """Return hallucination probability in [0,1]. Higher = more likely hallucinated."""
                 avgwd = self._avg_wd(context, claim)
                 eigenwd = self._eigen_wd(claim)
                 # Combine: normalize each to [0,1] relative to corpus distribution
                 # (calibration happens during evaluate() below)
                 return (avgwd + eigenwd) / 2.0  # raw score; calibrated in pipeline

      3. Train Tier0wVerifier on 80% of FoVer corpus (random_seed=42, stratified split).
         Fit vectorizer on training texts.

      4. Evaluate on remaining 20% (n_test >= 40):
         For each (context, claim, label) in test split:
           raw_score = verifier.score(context, claim)
           Calibrate scores to [0,1] using min-max normalization on test scores.
         Compute: tier0w_auroc (sklearn.metrics.roc_auc_score), tier0w_auprc (average_precision_score).
         Compute separately: avgwd_auroc, eigenwd_auroc (each signal individually).
         tier0w_combined_auroc = roc_auc_score using (avgwd + eigenwd)/2.

      5. Compute which signal dominates: record dominant_signal ('avgwd' if avgwd_auroc > eigenwd_auroc).

      6. Run `python scripts/adversarial_verify.py results/experiment_2636_tier0w_avgwd_eigenwd.json`
         Capture any CRITICAL flags.

      7. Write results/experiment_2636_tier0w_avgwd_eigenwd.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required for conductor reconciler."
      - tier0w_auroc: float — AUROC of combined AvgWD+EigenWD signal on FoVer test set
        principle: "Primary viability gate: >= 0.65 required for exp2638 ensemble v10 integration."
      - avgwd_auroc: float — AUROC of AvgWD signal alone
        principle: "Component decomposition; paper-v6 §5 can cite if avgwd is the dominant contributor."
      - eigenwd_auroc: float — AUROC of EigenWD signal alone
        principle: "Component decomposition; isolates the eigenvalue contribution."
      - dominant_signal: str — 'avgwd' or 'eigenwd' (whichever has higher AUROC)
        principle: "Informs which signal to use in ensemble if only one verifier slot is available."
      - n_train: int — training set size
        principle: "Statistical validity of vectorizer fitting."
      - n_test: int — test set size (must be >= 40)
        principle: "AUROC estimate on n < 40 has confidence interval > 0.1 — too wide for paper citation."
      - tier0w_viable: bool — True iff tier0w_auroc >= 0.65
        principle: "Gate for exp2638: viability flag enables ensemble v10 integration decision."
      - module_created: str — path to python/carnot/verify/tier0w_avgwd_eigenwd.py
        principle: "Deliverable is code artifact; path confirms it was actually written."
      - adversarial_flags: list — CRITICAL flags from adversarial_verify.py
        principle: "Adversarial verification required before any AUROC claim enters paper-v6."
      - random_seed: 42
        principle: "Reproducibility of train/test split."
      - duration_s: float
        principle: "Real sklearn evaluation on 200+ examples takes >= 1s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records corpus discovery and sklearn availability."

      Run: `python -c "import sys; sys.path.insert(0, '{project_root}/python');
           from carnot.verify.tier0w_avgwd_eigenwd import Tier0wVerifier; print('Tier0w OK')"`.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2637
    milestone: "2026.05.252"
    deliverable: "results/experiment_2637_entanglement_audit.json"
    title: "Verifier Behavioral Entanglement Audit + De-Entangled Reweighting (arXiv:2604.07650)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: ensemble

    prior_failures:
      - experiment_id: exp2622-ensemble-v9-adversarial-val
        verdict: "complete: ensemble_v9 5-seed adversarially validated"
        addressed_by: "exp2622 validated ensemble v9's AUROC via 5-seed replication. This task audits BEHAVIORAL ENTANGLEMENT between individual verifiers — computing pairwise correlation of per-example scores to identify which verifiers make identical errors (correlated failures = wasted ensemble capacity). Different scope: validation vs. independence audit."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      arXiv:2604.07650 shows that supposedly diverse classifiers often exhibit hidden behavioral
      entanglement: they make correlated errors because they were trained on overlapping feature sets
      or share distributional biases. For ensemble classifiers, entanglement reduces the diversity
      benefit — two entangled verifiers contribute only marginally more than one.

      Key finding: de-entangled reweighting (inverse-entanglement-weight ensemble aggregation) achieves
      4.5% accuracy gain over majority voting by downweighting correlated verifiers.

      For Carnot: tier0s and tier0u were both retrained using TF-IDF features on FoVer in .250.
      They may be behaviorally entangled. Tier0z (semantic energy) is training-free — likely less
      entangled. The entanglement audit will reveal the actual independence structure.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (all tier0*.py files — identify active verifiers in ensemble v9)
      - results/experiment_2622_ensemble_v9_adversarial_val.json (ensemble v9 composition)
      - data/fover_corpus.jsonl (evaluation corpus)

      TASK: Compute pairwise behavioral entanglement matrix for ensemble v9; apply de-entangled reweighting.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import numpy; import sklearn; import scipy"` succeeds.
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. FoVer corpus: check {project_root}/data/fover_corpus.jsonl (n_lines >= 200).
            If absent: write honest_verdict blocked_fover_corpus_not_found; exit.
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus (n >= 200 examples). Split: 200 evaluation examples (random_seed=42).

      2. Identify all active verifiers in ensemble v9. For each verifier tier (tier0a through tier0z
         plus any others in python/carnot/verify/):
         - Run verifier.score(context, claim) for each of the 200 FoVer evaluation examples.
         - Collect scores as a vector s_i (length 200) for verifier i.
         Record: n_verifiers_active, verifier_names list.

      3. Compute pairwise entanglement coefficient matrix:
         For each pair (i, j): entanglement_ij = abs(pearsonr(s_i, s_j)[0])
         Where pearsonr is scipy.stats.pearsonr.
         Record entanglement_matrix (N_verifiers x N_verifiers numpy array).

      4. Identify highly entangled pairs (entanglement_ij > 0.7):
         For each such pair: record (verifier_i, verifier_j, entanglement_ij).
         Record highly_entangled_pairs list.

      5. Compute de-entangled weights:
         For each verifier i: independence_score_i = 1 - mean(entanglement_ij for j != i)
         deentangled_weight_i = independence_score_i / sum(independence_scores)
         Record deentangled_weights dict {verifier_name: weight}.

      6. Compute de-entangled ensemble AUROC:
         weighted_score = sum(deentangled_weight_i * s_i) for each example
         deentangled_auroc = roc_auc_score(labels, weighted_scores)

      7. Compute standard equal-weight ensemble AUROC for comparison:
         equal_weight_auroc = roc_auc_score(labels, mean(s_i for all i))

      8. delta_auroc_from_deentangling = deentangled_auroc - equal_weight_auroc
         reweighting_applied = True (reweighting was computed and evaluated)

      9. Save de-entangled weights to python/carnot/verify/ensemble_deentangled_weights.json
         (this file is read by exp2638 to build ensemble v10).

      10. Write results/experiment_2637_entanglement_audit.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - n_verifiers_active: int — number of active verifiers in ensemble v9
        principle: "Documents ensemble composition size for reproducibility."
      - entanglement_matrix_shape: list [N, N] — shape of the entanglement matrix
        principle: "Confirms the full ensemble was audited, not a subset."
      - highly_entangled_pairs: list of {verifier_i, verifier_j, entanglement} — pairs with corr > 0.7
        principle: "Primary finding: which verifiers should be downweighted for independence."
      - n_highly_entangled_pairs: int
        principle: "Count of entangled pairs quantifies the severity of the entanglement problem."
      - deentangled_auroc: float — ensemble AUROC with de-entangled reweighting
        principle: "Primary metric: if higher than equal_weight_auroc, de-entangling helps."
      - equal_weight_auroc: float — ensemble AUROC with equal weights (baseline)
