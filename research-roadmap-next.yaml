milestone: 2026.06.406
milestone_title: "Turn the verifier-as-DETECTOR from 'detects but cannot LOCALIZE' (.405 exp4381: first-error F1 0.096, bidirectional fusion a measured no-op, 103/114 missed first-error traces -- a clean powered null) into an actionable CROSS-DOMAIN first-error LOCALIZER via VERIFIABLE PROCESS DATA SYNTHESIS (arXiv:2605.02395, the .405 SOTA-ingestion flagged_for_v406): construct a correct symbolic chain -> inject a template-aware error at a KNOWN step -> recompute the suffix under the corrupted state -> VERIFY prefix-invalidity -> train a contrastive earliest-error localizer on ground-truth labels, with a twice-burned-operator skeptic-proof (train-synthetic/test-REAL, position-only baseline, template-ablation). The .405 localization null is a DATA problem (no first-error supervision), NOT a fusion-method problem. CALIBRATE cross-domain detection across FoVer+ARC+code+GSM with leave-one-domain-out (arXiv:2102.10395) + build the pools .405 could not reach (the one-non-FoVer-domain limit). PROVE the LOCALIZER COMPOUNDS (the mandated continuous-self-learning slot, on the live vehicle where headroom is now REAL: F1 0.096, not a saturated AUROC). Drive the ARC north star DEEPER by raising world-model lookahead-fidelity past the planning threshold (operator MANDATORY 2026-06-17; the .405 partials stalled at fidelity 0.80-0.875). .405 CLOSED the localization route as a method problem and confirmed the detector COMPOUNDS (exp4385) + GENERALIZES cross-domain (exp4386, GAP-4 ARC AUROC 0.963). paper_ready=True (FoVer 0.9131, G1-G4)."
milestone_doc: openspec/change-proposals/research-roadmap-v406.md
milestone_overview: |
  .405 (exp4390 capstone, verdict v405_detector_detects_but_not_actionable_compounds_true_generalizes_true_arc_levels_34_publication_ready)
  split the one alive oracle-distinct vehicle -- the verifier-as-DETECTOR -- into three readings:
    - LOCALIZATION -> clean powered NULL (exp4381). The detector DETECTS trace-level error risk well (abstention-curve
      AUROC 0.980) but localization_f1_by_direction is IDENTICAL across unidirectional/bidirectional/causal (all F1 0.096,
      11/114 error traces, localization_delta_ci95=[0,0]). Bidirectional fusion is a measured no-op; the detector flags a
      downstream consequence, not the earliest causal error. GAP-FOVER-BIPRM-LOCALIZATION logged. A2 (exp4382) gate-skipped.
    - ABSTENTION -> works mechanically (retained-acc 0.999 at 90% coverage) but thin (base rate 98.3% correct ->
      threshold-only gives 'no useful operating point'; needs a structured report/abstain signal).
    - COMPOUNDS -> TRUE but weak (exp4385): held-out localization-F1 0.371->0.387 as corpus 491->4911 (delta CI95
      [0.0034,0.0328], positive control passed); AUROC saturated at 0.986 (little headroom to climb).
    - GENERALIZES cross-domain -> TRUE (exp4386): GAP-4 ARC detection AUROC 0.963, CI95 [0.922,0.991], n=28443,
      verifier_is_oracle=false, domains_at_chance=[]. But ONLY one non-FoVer domain reached -- code/GSM pools unavailable.
    - ARC north star -> STALLED at 34 reproducible levels / 17 games. exp4383 (deeper) + exp4384 (blocked tails) both
      new_levels_reproduced=0; root cause is world-model lookahead-fidelity 0.80-0.875 (below the planning threshold).
    - paper_ready=True (G1-G4, FoVer 0.9131, unmet_gates: []).
  The SOTA-ingestion (exp4387) flagged_for_v406 = verifiable_process_data_cross_domain_localization_v406 (arXiv:2605.02395,
  whose own headline finding is 'first-error localization remains substantially more challenging than overall step
  classification' -- exactly the .405 result). .406 takes the depth step:

    PHASE 0 -- TRANSITION: exp4391 archive .405 -> activate .406; record the TRUE close-state.

    PHASE A -- HEADLINE (turn detection into an actionable cross-domain first-error LOCALIZER; verifier_is_oracle=false):
      A1 (exp4392) VERIFIABLE PROCESS DATA SYNTHESIS + contrastive earliest-error localizer (arXiv:2605.02395):
        symbolic chain -> template-aware error injection at a KNOWN step -> suffix recomputation -> prefix-invalidity
        verification -> ground-truth first-error labels -> contrastive localizer. Evaluate first-error localization F1 on a
        HELD-OUT real FoVer split AND the GAP-4 ARC split vs the .405 ensemble baseline (0.096). Report a structured
        abstention signal (Prover-Verifier-Deliberation 2605.25133) alongside the raw-threshold curve. Emit
        localizer_beats_ensemble_baseline BARE bool. Cached, CPU; symbolic synthesis needs no live LLM.
      A2 (exp4393, GATED on A1 localizer_beats_ensemble_baseline==true) skeptic-proof: template-artifact leakage
        (train-synthetic/test-REAL)? position/length bias (position-only baseline)? synthetic-overfit (held-out split +
        2nd seed)? Emit localizer_win_is_genuine BARE bool.

    PHASE B -- ARC NORTH STAR (operator MANDATORY 2026-06-17; +1..+n per game; verifier_is_oracle=true):
      B1 (exp4394) E3 DEEPER with a lookahead-fidelity GATE BEFORE planning (raise fidelity 0.85->the planning threshold
        via Mind-Studio 2606.16070 K-step rollout matching): lp85 L6 + tu93 L5 + tn36 L8 + tr87 L7 (prior_failures exp4383).
      B2 (exp4395) E3 BLOCKED-mechanic tails: ar25 L2 (action7 undo-stack) + ka59 L2 (step-counter HUD + the outer-loop's
        fresh object-RELEVANCE finding) + ft09 L2 (prior_failures exp4384/exp4373).

    PHASE C -- CONTINUOUS SELF-LEARNING (mandated; the LOCALIZER compounds; verifier_is_oracle=false):
      exp4396 does the LOCALIZER COMPOUND as verifiable-synthetic + real first-error labels accumulate? (the exp4364/4385
        compounding discipline, on the live localizer where headroom is REAL -- F1 0.096, not a saturated AUROC). Emit
        localizer_compounds BARE bool. Falls back to the ensemble-detector localization-compounding reading if A1 built none.

    PHASE D -- CROSS-DOMAIN DETECTION CALIBRATION + POOL EXPANSION (complementary; cached; verifier_is_oracle=false):
      exp4397 scale the cross-domain win (arXiv:2102.10395): score the detector against FoVer + GAP-4 ARC + code (HumanEval,
        cached exp1999/2838/2839) + GSM8K (cached) with leave-one-domain-out calibration; detection AUROC + risk-coverage +
        localization-F1 BY domain; build any pool assemblable from EXISTING cached candidates (no new live inference); log
        chance-detection domains as missing-verifier gaps. Emit detection_calibrated_multi_domain BARE bool. This is
        cross-domain DETECTION, NOT the RETIRED cross-domain SELECTION axis (exp4314).

    PHASE E -- INFRA + HYGIENE + CAPSTONE: exp4398 SOTA-ingestion -> .407; exp4399 registry/gaps hygiene + GAP-4 guard;
      exp4400 KV260 continuity (opportunistic); exp4401 capstone .406 + the headline decision + G1-G4.

  HARD RULE (every task): conductor STOOD-DOWN on TRM training -- NO task launches TRM training, runs pkill/kill against
  train.py, or writes results/trm_runs/. Qwen FORBIDDEN as the TRAINED base (Spurious-Rewards confound); Qwen/Gemma GGUF as
  an off-policy judge/generator is fine. A2D2 (2606.13565) + SEPO (2502.01384) verifier-as-reward GENERATOR-training are
  OUT-OF-BAND/operator-owned (NOT auto-run). Every verifier-value task declares verifier_is_oracle honestly (Circularity
  Discipline): the localizer/detection/compounding claims are oracle-DISTINCT (verifier_is_oracle=false + matched control +
  CI95-excl-0); ARC E3 SOLVEs are execution-grounded (verifier_is_oracle=true, ARC progress NOT a moat headline). The
  in-generation DiffusionGemma conversion is RETIRED (4th block, exp4374) -- do NOT re-propose. The LLM-generated-heuristic
  efficiency arm is SETTLED (exp4370 null) -- control only, do NOT re-headline. NO autonomous edits to docs/index.html /
  README / paper prose. Online ARC play stays operator-gated (NO leaderboard submission; only offline-reproduced levels
  count). Cross-game value TRANSFER (exp4342) + cross-domain SELECTION (exp4314) are RETIRED -- do NOT re-propose either
  (Phase A/D are DETECTION/LOCALIZATION, a distinct measurement). paper_ready=True (FoVer 0.9131) is the FROZEN headline --
  .406 adds LENSES, never a substitute.

