  - id: exp3282-garak-install-and-probe-manifest-v1
    milestone: "2026.05.304"
    deliverable: "results/experiment_3282_garak_install_and_probe_manifest_v1.json"
    title: "Garak install and probe manifest v1"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 45
    track: "redteam"
    inference_substrate: "toolchain_probe_only"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3274-garak-dataflip-redteam-v1
        verdict: "complete: garak_available=false; garak_redteam_eval_ready=false; blocked_reasons=['blocked_garak_unavailable']"
        addressed_by: "This task does not attempt the red-team eval again. It first creates an isolated Garak install/probe manifest and records exact command-level readiness or blocker reasons."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      .303 did not run Garak because results/experiment_3274_garak_dataflip_redteam_v1.json reported garak_available=false. The next milestone must convert this from an ambiguous missing-tool condition into a precise toolchain artifact.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3274_garak_dataflip_redteam_v1.json
      - research-references.md
      - ops/e2e-test-plan.md
      - pyproject.toml
      - requirements.txt if present

      TASK
      Build a Garak install/probe manifest without running the full red-team benchmark. The artifact must state whether Garak can be imported and invoked, which PromptInject-style probes exist, and how a local GGUF/llama.cpp target will be connected in downstream tasks.

      CONCRETE STEPS
      1. Check whether garak is importable and whether a garak CLI is available.
      2. If unavailable, try the least invasive isolated path allowed by the repo, such as a local virtual environment or documented package command. Do not alter scripts/research_conductor.py.
      3. Inventory PromptInject, jailbreak, encoding, leakage, and hallucination probes that are relevant to prompt-injection evaluation.
      4. Identify the local generator adapter path for mandated GGUF models, including llama.cpp or REST command shape.
      5. Emit a blocked artifact if install or invocation fails, including exact commands, stderr summaries, and next action.

      REQUIRED ARTIFACT FIELDS:
      - garak_install_probe_manifest_ready: bool (principle: downstream tasks need a stable toolchain contract)
      - garak_runner_ready: bool (principle: gates Garak smoke without spending a Sonnet call)
      - garak_available: bool (principle: preserve the .303 blocker field)
      - garak_version: str (principle: toolchain evidence must be versioned)
      - garak_import_command: str (principle: reproduce import status)
      - garak_cli_command: str (principle: reproduce CLI status)
      - probe_inventory: list (principle: full eval must know which probes exist)
      - promptinject_probe_count: int (principle: prompt-injection readiness must be explicit)
      - local_target_adapter_plan: dict (principle: smoke/full eval must know how to call local GGUFs)
      - install_blockers: list (principle: unavailable tools must fail precisely)
      - preconditions_checked: list (principle: toolchain work must fail fast)
      - random_seed: int (principle: reproducibility)
      - reproducibility_checksum: str (principle: artifact integrity)
      - duration_s: float (principle: timing evidence)
      - honest_verdict: str (principle: must start with complete:/success:/passed:/shipped: when manifest is written)
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3283-prompt-injection-corrigendum-duration-audit-v1
    milestone: "2026.05.304"
    deliverable: "results/experiment_3283_prompt_injection_corrigendum_duration_audit_v1.json"
