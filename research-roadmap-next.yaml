      Deliverable: `results/experiment_5350_sota_source_delta_v488.json`.

      CONCRETE STEPS:
      1. Search the source families listed in the milestone doc, emphasizing EBMs for reasoning, neural constraint satisfaction, Ising/annealing, hallucination detection, KAN verification, energy-guided decoding, hardware sampling, continual constraint learning, and ARC perception/salience work.
      2. Do not reopen retired scopes: no retired external generated-text scoring, no broad GRPO/fine-tuning reruns, no TSU/Kona execution claims, no CPU-only GGUF offload rerun, and no retired ARC exploration-signal rerun.
