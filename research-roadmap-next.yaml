  - id: exp4467-solve-dc22-cegis-nocov
    milestone: 2026.06.413
    title: "PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY) -- SOLVE dc22 L1: run the counterexample-guided config-rule grounding loop the .412 attempt DESIGNED BUT NEVER RAN, with the CORRECTED --no-cov pytest precondition (the .412 attempt was blocked_baseline_pytest_coverage). +1 reproducible game/level (39/20 -> 40/21). Closes GAP-4423-DC22."
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4467_solve_dc22_cegis_nocov.json
    prior_failures:
