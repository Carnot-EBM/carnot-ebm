  bridge_crossed_for_solve=FALSE milestone, but its real output was a sharp TRUST-CORRECTION. A1 (the leader's
  online action-learning driver) was the ONLY .435 lever VALIDLY tested (arms_non_degenerate=True: 66 online
  Adam steps, distinct per-arm action distributions, coordinate head differs from frozen) and it GENUINELY
  NULLED (online_warm_vs_frozen_delta=0.0, all arms at the 0.04 baseline) -- the operator's highest-leverage
  2026-06-24 bet is ANSWERED: the frame-change online CNN does NOT lift first-win -> the online-action-learning
  lever RETIRES. A2 (active probe) tested DEAD CODE (probe_actions_taken=0, hypothesis_posterior_built=False,
  probe_mechanism_did_not_run). DECISIVELY: the operator-MANDATED B1 silent-bug audit (exp4725) found 12 nulls,
  5 must reopen -- the guidance-class GENERATION levers were ALL tested on dead/byte-identical code: P2
  goal-energy generation (exp4640: the goal-energy arm CLONED cached baseline, goal_energy_neutral_on_cached_frame),
  P3 energy-fitness QD (exp4653: QD/random/search arms BYTE-IDENTICAL), P1 Go-Explore (1,64,64) archive, P4
  hierarchical subgoal (empty decomposition). The guidance-class generation hypothesis -- the operator's own
  2026-06-23 redirect ("the 0.04 wall is generation-GUIDANCE, NOT depth/coverage; concentrate on goal-energy /
  expansion-prior") -- was NEVER VALIDLY TESTED. .436 VALID-TESTS the two strongest guidance-class generation
  levers, each with the non-degeneracy gate applied INLINE (the .435-A1 discipline) + the null-delta carve-out
  markers so an honest no-lift null is NOT quarantined (the .435-A1 escape): A1 (HEADLINE) goal-energy candidate
  generation (reopen exp4640, score REAL candidate states), A2 energy-fitness QD generation (reopen exp4653,
  distinct QD + random-mutation pools; MAP-Elites + gradients). A3 self-play banks +1 (64->65) + trains the
  verifier. A4 held-out readiness (robust to the codex cap) + submission-config confirm. A5 persist, A6
  integration. INFRA (both fix a .435 escape): B1 the adversarial_verify carve-out hardening (don't quarantine
  honest non-degenerate-zero-lift generation nulls + flag the A2-class declared-but-unrun mechanism), B2
  submission-package readiness validation (deadline-critical). C KV260 continuity. D SOTA-ingestion (the .437
  frontier: epistemic-MCTS + causal-probe + MATM efficiency). E capstone. verifier_is_oracle:false on every
  value claim; solve_provenance on every solve; submission operator-only; FoVer 0.9131 / G1-G4 paper_ready
  frozen. 5 days to the ARC Prize Milestone #1 deadline (2026-06-30).
