  - id: exp3073-ebt-arm-ebm-adapter-feasibility-audit
    milestone: "2026.05.287"
    deliverable: "results/experiment_3073_ebt_arm_ebm_adapter_feasibility_audit_v1.json"
    title: "EBT and ARM-EBM adapter feasibility audit"
    priority: medium
    max_turns: 40
    estimated_wall_time_min: 35
    track: "architecture"
    inference_substrate: "literature_and_code_audit"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3066-capstone-v286
        verdict: "complete: capstone_ready=true; paper_ready=false; solver_grounding_status=flagged_solver_grounded_no_gain"
        addressed_by: "Adds a bounded EBT/ARM-EBM feasibility map instead of implying the current architecture already implements those theory tracks."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. EBT and ARM-EBM are relevant to Carnot's EBM vision, but .287 must not claim adapter implementation without local code and tests.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-program.md
      - _bmad/prd.md
      - _bmad/architecture.md
      - research-references.md
      - python/carnot if relevant
      - openspec/capabilities/*/spec.md relevant to EBM or verification if present

      TASK
      Produce a feasibility audit for adapting EBT or ARM-EBM ideas to Carnot's verifier/energy architecture.

      CONCRETE STEPS
      1. Summarize the local architecture surfaces that could host EBT-style latent reasoning or ARM-EBM-style recurrent energy refinement.
      2. Compare those surfaces to the current codebase and capability specs without adding implementation code.
      3. Identify exact prerequisites for a future implementation: data shape, energy objective, verifier interface, sampling path, evaluation metric, and rollback/claim boundaries.
      4. Separate near-term adapter opportunities from paper-context-only references.
      5. Set ebt_arm_adapter_feasible=true only for a concrete future path with local prerequisites; otherwise set bounded_theory_context_only.

      REQUIRED ARTIFACT FIELDS:
      - ebt_arm_adapter_feasibility_ready: bool (principle: architecture audits must be consumable by matrix v21)
      - ebt_arm_adapter_feasible: bool (principle: feasibility and implementation must be separated)
      - adapter_surface: list (principle: integration points must map to local code/specs)
