    Then proceed with the fixes. Update the artifact after each issue is resolved.

    Strategy: MINIMAL FIRST. Each fix takes < 5 turns. Don't attempt the ideal fix;
    apply the smallest valid fix that satisfies the 4-test integrity framework.

    4-test framework for every fix:
    1. SOURCE-ARTIFACT: every number traces to a specific results/ JSON field
    2. SAME-BASIS: speedup comparisons use same measurement basis both sides
    3. PROMINENT CAVEATS: extrapolated claims carry equally-prominent caveats
    4. NO HALLUCINATED CITES: every \cite{} is real published work

    EXISTING CODE TO READ FIRST:
    - docs/arxiv-paper/main.tex
    - docs/arxiv-paper/carnot.bib
    - openspec/change-proposals/paper-v5-integrity-remediation.md (full remediation spec)
    - results/experiment_1068_ising_sampler_v3_fpga.json (FPGA latency measurements)
    - results/experiment_1147_hardnet_constraint_verification.json (117µs measurement)

    TASK:

    ISSUE-1 (fig3 11680x fabricated speedup) — DROP THE FIGURE:
    - grep -n "fig3\|11680\|11,680" docs/arxiv-paper/main.tex | head -10
    - Remove the \begin{figure}...\end{figure} block containing fig3 from main.tex entirely.
    - Replace the in-text reference with:
      "The FPGA achieves {fpga_latency_us:.2f} µs per sweep (exp1068); a rigorous
      CPU comparison requires matching N and per-sample basis and will be reported
      in follow-up work."
    - Update artifact: issue_1_fig3_handled=true

    ISSUE-2 (KL=3.07 cited as FPGA-measured, is software proxy):
    - grep -n "KL=3\.07\|KL = 3\.07\|3\.07.*kl\|kl.*3\.07" docs/arxiv-paper/main.tex
    - Replace each "FPGA KL=3.07" with:
      "software-proxy KL=3.07 (exp1094 simulation; bitstream on-board KL not yet measured)"
    - Update artifact: issue_2_kl_instances_remaining=0

    ISSUE-3 (15.6x speedup baseline is hand-typed constant):
    - grep -n "15\.6x\|15\.6-fold\|15\.6 x" docs/arxiv-paper/main.tex
    - Replace each with: "exp1094's measured CPU latency (details in supplemental)"
    - Update artifact: issue_3_15p6x_removed=true

    ISSUE-4 (76,130x HardNet apples-to-oranges):
    - grep -n "76.130\|76130\|76,130" docs/arxiv-paper/main.tex
    - Replace with: "117 µs per case vs 8.9 s prompt repair (exp1147); the two approaches
      address different failure modes and are not directly comparable on a single metric."
    - Update artifact: issue_4_76130x_removed=true

    ISSUE-5 (SOSKANEnergyV3 OOD collapse hidden):
    - grep -n "exp1121\|0\.3333\|0\.9545" docs/arxiv-paper/main.tex | head -10
    - Add after exp1121 cite:
      "On the FoVer training corpus, SOSKANEnergyV3 achieves AUROC=0.9545 (exp1072).
      On the production evaluation corpus (exp1121), the same verifier drops to
      AUROC=0.3333 — an out-of-distribution energy-inversion example that motivates
      multi-verifier AND-composition."
    - Update artifact: issue_5_ood_narrative_added=true

    SHIP figure_integrity_audit.py (if not already shipped by exp1193):
    - Check if scripts/figure_integrity_audit.py exists
    - If not: write a minimal version that greps docs/figures/*.py for numerical constants
      and checks each against results/*.json; exits 1 if untraced constants found

    Update artifact to critical_issues_fixed=5 and honest_verdict="all_5_critical_resolved".

    CONCRETE STEPS:
    - Write skeleton artifact (STEP 0)
    - grep -n "11680\|76130\|76,130\|15\.6x\|KL=3\.07\|KL = 3" docs/arxiv-paper/main.tex 2>&1
    - [Apply ISSUE-1 minimal fix: drop fig3 block]
    - python3 -c "import json; print(open('results/experiment_1205_paper_v5_critical_issues_retry_v3.json').read())" 2>&1  # verify artifact updating
    - [Apply ISSUE-2 KL text substitution]
    - [Apply ISSUE-3 15.6x removal]
    - [Apply ISSUE-4 76,130x removal]
    - [Apply ISSUE-5 OOD collapse narrative]
    - grep -n "11680\|76130\|15\.6x\|KL=3\.07" docs/arxiv-paper/main.tex 2>&1
    - ls scripts/figure_integrity_audit.py 2>&1
    - [Write or verify figure_integrity_audit.py]
    - python3 scripts/figure_integrity_audit.py 2>&1 | tail -10
    - Update results/experiment_1205_paper_v5_critical_issues_retry_v3.json (final)

    REQUIRED ARTIFACT FIELDS:
    - issue_1_fig3_handled: bool
    - issue_1_strategy: str ("dropped" | "rewritten_with_honest_ratio")
    - issue_2_kl_instances_remaining: int (must be 0)
