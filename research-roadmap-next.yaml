- id: exp1207-llama-cpp-gpu-offload-fix-v3
  milestone: 2026.04.94
  deliverable: results/experiment_1207_llama_cpp_gpu_offload_fix_v3.json
  title: "llama.cpp GPU Offload Fix v3 — STEP 0 + skip_pre_test + Pre-built or Source CUDA Build"
  agent_type: claude
  model: opus
  max_turns: 50
  estimated_wall_time_min: 45
  priority: critical
  requires_gpu: true
  prior_failures:
    - experiment_id: exp1179-llama-cpp-gpu-offload-fix
      verdict: MISSING
      addressed_by: "exp1179 timed out before producing an artifact. pip install from abetlen CUDA wheel index requires source compilation (45-90 min). This attempt uses STEP 0 and skip_pre_test."
      retire_if_same_verdict: false
    - experiment_id: exp1192-llama-cpp-gpu-offload-fix-v2
      verdict: MISSING
      addressed_by: "exp1192 was SKIP'd 3x due to broken pre-test suite (not a scientific failure). This attempt uses skip_pre_test:true to bypass the pre-test gate and STEP 0 to ensure artifact is written immediately."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    GRPO v5 (exp1208) requires llama.cpp with CUDA GPU offload to run Qwen3.6-35B at
    >= 50 tok/s. Three prior attempts failed due to infrastructure issues, not scientific ones:
    - exp1179: pip install timed out at 60 min (source compilation too slow)
    - exp1192: SKIP'd 3x because the pre-test suite was broken

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write this to results/experiment_1207_llama_cpp_gpu_offload_fix_v3.json:
    {
      "experiment": "1207_llama_cpp_gpu_offload_fix_v3",
      "status": "in_progress",
      "llama_cpp_gpu_offload_verified": false,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - results/experiment_1184_grpo_v5_tinyv_v2_dualGPU.json (confirms n_gpu_layers=-1,
      cuda_device_count=2, but llama_cpp_gpu_offload=false)

    TASK:
    1. Write the skeleton artifact (STEP 0).

    2. Check current state:
       python3 -c "from llama_cpp import llama_cpp; print('gpu_offload:', llama_cpp.llama_supports_gpu_offload())" 2>&1
       nvidia-smi | grep "CUDA Version" 2>&1
       python3 -c "import torch; print('cuda:', torch.version.cuda, 'devices:', torch.cuda.device_count())" 2>&1

    3. If llama_cpp.llama_supports_gpu_offload() is already True AND throughput >= 50 tok/s:
       Run throughput test and write PASS artifact immediately.

    4. If GPU offload is not supported, install with CUDA:
       Method A (pre-built wheel from GitHub Releases):
       VER=$(curl -s https://api.github.com/repos/abetlen/llama-cpp-python/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'][1:])" 2>&1)
       # Find the cublas/CUDA 12 wheel from the assets list
       curl -s https://api.github.com/repos/abetlen/llama-cpp-python/releases/latest | python3 -c "import sys,json; r=json.load(sys.stdin); [print(a['browser_download_url']) for a in r.get('assets',[]) if 'cu' in a['name'].lower() and 'linux' in a['name'].lower() and 'x86_64' in a['name'].lower()]" 2>&1
       # pip install the downloaded wheel

       Method B (source build with CUDA — fallback if wheel not found):
       CMAKE_ARGS="-DGGML_CUDA=on" pip install llama-cpp-python --upgrade --force-reinstall --no-cache-dir 2>&1 | tail -20

    5. Verify GPU offload:
       python3 -c "from llama_cpp import llama_cpp; print('gpu_offload:', llama_cpp.llama_supports_gpu_offload())" 2>&1

    6. Find a GGUF model and test throughput:
       find /home -name "*.gguf" 2>/dev/null | head -5
       # Use the smallest available GGUF for the throughput test
       python3 -c "
       import glob, time
       from llama_cpp import Llama
       ggufs = sorted(glob.glob('/home/**/*.gguf', recursive=True))
       if not ggufs: print('NO GGUF FOUND'); exit(1)
       m = Llama(ggufs[0], n_gpu_layers=10, verbose=False)
       t0 = time.time()
       out = m('Hello world, what is 2+2?', max_tokens=20)
       dt = time.time() - t0
       toks = out['usage']['completion_tokens']
       print(f'throughput={toks/dt:.1f} tok/s  n_gpu_layers=10  model={ggufs[0]}')
       " 2>&1

    7. Update the artifact with final results.

    CONCRETE STEPS:
    - Write skeleton artifact (STEP 0)
    - python3 -c "from llama_cpp import llama_cpp; print(llama_cpp.llama_supports_gpu_offload())" 2>&1
    - nvidia-smi | grep "CUDA Version" 2>&1
    - [If not supported: download pre-built wheel OR source build with GGML_CUDA=on]
    - [Verify GPU offload + throughput test]
    - Update results/experiment_1207_llama_cpp_gpu_offload_fix_v3.json

    REQUIRED ARTIFACT FIELDS:
    - llama_cpp_version: str
    - cuda_version_detected: str
