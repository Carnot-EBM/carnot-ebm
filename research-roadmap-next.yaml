    the verifier LLM must generate a chain-of-thought explaining why a step is correct or
    incorrect, then output CORRECT/INCORRECT. With model-generated CoT, ThinkPRM outperforms
    discriminative PRMs using only 1% of labels: +8% on GPQA-Diamond, +4.5% on LiveCodeBench,
    +7.2% over LLM-as-a-Judge under equivalent token budgets.

    This experiment implements ThinkPRM for Carnot:
    - Input: a reasoning step from a GSM8K solution (e.g., "47 + 28 = 76")
    - Prompt: "Verify the following reasoning step. Generate a step-by-step explanation of
      whether this step is mathematically correct. Then output VERDICT: CORRECT or VERDICT: INCORRECT."
    - Parse P(CORRECT) from the output token probabilities or the VERDICT: text
    - Use P(CORRECT) as the step-level reward score, replacing Ising energy for this tier

