  title: 'Exp 709: PSV PaCoRe K=2 Parallel Self-Play — DualGPU Diversity Recovery (arXiv 2601.05593, GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: PSV self-play REVERSED in .53 (Exp 697): fp_rate_trend_slope=+0.004242.
    This is a degradation from .52 (Exp 688) where slope was negative (improving).

    Hypothesis: Single-chain K=1 PSV saturates after ~10 iterations because:
    - The same 10 questions are retried with the same model, producing similar errors
    - The constraint pool accumulates FP noise from repeated near-correct responses
    - Diversity of violation types is insufficient for learning signal

    Fix: PaCoRe-style K=2 parallel chains (arXiv 2601.05593). For each PSV iteration:
    - Chain A on cuda:0: Qwen3.5-0.8B generates responses, SymCodeVerifier verifies
    - Chain B on cuda:1: same questions, same model, but different generation temperature
      (temp_A=0.7, temp_B=1.0) → diverse responses → diverse violation patterns
    - Merge: for each question, select the chain response with LOWER violation energy
      (lower energy = fewer constraint violations = more reliable response)
    - Update constraint pool with verified violations from BOTH chains (more diverse data)

    This uses DualGPU infrastructure confirmed in Exp 685 (2.0175x speedup for EORM+JEPA).

    EXISTING CODE TO READ FIRST:
    - results/experiment_697_psv_real_selfplay.json — .53 PSV result (degrading slope).
