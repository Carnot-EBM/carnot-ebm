      CONCRETE STEPS
      1. Define canonical forms for VALID/INVALID/SAT labels, numeric answers, JSON-like bounded outputs, and code-fragment verdicts.
      2. Map CoT or explanation steps to simple premise records when available; mark absent premise grounding explicitly.
      3. Check premise-to-answer and answer-to-premise consistency against exact labels and solver certificates.
