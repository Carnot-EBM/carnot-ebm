    6. Preserve the real shorter-path Exp8047 skip receipt and log-only dispositions for Exp8048-8050 without inventing missing primary files. Resolve future artifacts by declared path plus authenticated task ID and reject ambiguous fallback paths. Run private consumer-gate evaluation through scripts/conductor_gates.py.
    9. Freeze the required validation-command manifest before measurement. Run focused unit and consumer tests, Ruff check/format, strict mypy on changed Python, scoped spec coverage, 100% changed-code statement coverage and the applicable E2E cases named below. Native changes also require cargo tests, fmt, clippy and loaded-binding checks. Run actual CLI success, blocked and mutation routes from outside the checkout; unit stubs alone cannot qualify a runner. Record argv, exit code, duration and log hash for each required check. Keep the existing bounded full-suite failure as separate repository-health evidence, not a new scientific gate or a claim of a global pass.
    10. Persist primitive rows, source/config/model/checkpoint hashes, intended/eligible/completed/censored/excluded/failed counts and denominators. Independently cold-replay reductions, run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py in strict mode, then publish through primary_publication only after normal process exit. If required checks fail, readiness is zero and class is disqualified. External missing evidence is blocked, not retryable partial. Reconcile specs, _bmad/traceability.md, ops/status.md and ops/changelog.md without deleting history.
    11. Exercise E2E-018 private authority CLI plus scorer success and mutation CLIs. Keep current execution and historical evidence separate. Read the V698 design's statistical contract and branch-specific acceptance rules before reporting any gain.
    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: terminal complete_* string; principle: terminal results must not trigger accidental retries.
    - verdict_class: positive | circular_positive | null | blocked | disqualified | partial; principle: fixture credit and scientific credit remain distinct; partial is only unfinished work another attempt can fix.
    - verifier_is_oracle and claim_scope; principle: oracle/fixture-derived success cannot become non-circular scientific benefit.
    - flagged_adversarial, required_checks_passed, validation_receipts, terminal_validation_sidecar_path; principle: current evidence must survive owned checks and independent readers.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts; principle: duration floors match actual model work, not cited historical models.
    - rows with unit/source/arm/seed, raw numerator/denominator, status and exclusion reason; principle: all comparisons can be recomputed from primitive observations.
    - intended_count, eligible_count, independent_count, completed_count, censored_count, excluded_count, failed_count, sample_size_budget; principle: seeds, duplicate calls and bootstrap draws do not inflate independent sample size.
    - gate_check_summary: check/upstream/path/hash/field/op/expected/observed for every failure; principle: distinguish a failed scientific gate from a missing artifact or misspelled field.
    - random_seed, reproducibility_checksum, source_artifact_hashes, raw_shard_hashes, code_config_hashes, phase_spans; principle: exact inputs and execution remain attributable.
    - generalized_learning_benefit_score: 0; principle: finite historically exposed development studies cannot close generalized lifelong learning.
    - field_principles: one explanatory entry for every additional field; principle: new metrics must name the inference error they prevent.
    - fixture_consumer_ready_score: 0|1; principle: a circular fixture can qualify measurement machinery without qualifying science.
    - contract_ready_score, canonical_tasks_sha256, authority_snapshots, gate_matrix_rows, scorer_code_hashes, historical_disposition_rows; principle: producer classes and complete task authority must survive rollover and actual reader evaluation.
    - substrate_declaration: aggregation_from_upstream_artifacts, no_model_load, MODEL_SPECS=[]; principle: fixture and authority checks perform zero LLM work.
    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8057_v698_fixture_consumer_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
