  - id: exp3615-additivity-second-pair-of-eyes-mcnemar-v2
    prior_failures:
      - experiment_id: exp3603-additivity-second-pair-of-eyes-mcnemar
        verdict: never_ran_upstream_centerpiece_blocked
        addressed_by: "exp3603 never ran because its upstream exp3601 cascade-failed. This task gates on exp3614's BARE positive_control_valid (the corrected, ungated, gracefully-degrading centerpiece) and re-derives the additive second-pair-of-eyes value from the genuinely fair re-measurement on the validated corpora -- new upstream + bare gate + fair measurement, not a re-run."
        retire_if_same_verdict: false
    milestone: "2026.06.332"
    title: "Additivity / 'second pair of eyes' — does ensemble-fused-with-confidence beat confidence alone? (conditional catch-rate + McNemar, on the fair re-measurement)"
    priority: high
    max_turns: 50
    agent_type: gemini
    model: gemini-3.1-pro-preview
    estimated_wall_time_min: 20
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    gated_on:
      - upstream: exp3614-corrected-cross-domain-remeasurement-v2
        artifact_field: at_least_one_nonmath_row_ran
        op: '=='
        value: true
    deliverable: results/experiment_3615_additivity_second_pair_of_eyes_v2.json
    prompt: |
      CONTEXT: AUROC alone hides the product claim. The "second pair of eyes" value is that the verifier
      catches errors a STRONG confidence baseline MISSES -- additive, not redundant. .329/.330/.331 claimed
      this confirmed from blocked/contaminated rows. Re-derive it from the corrected, fairly-measured rows
      (exp3614).
      EXISTING CODE TO READ FIRST: results/experiment_3614 (the corrected generalization table) via
      scripts/summarize_artifact.py.
      PRECONDITIONS (step 0): exp3614 landed with at_least_one_nonmath_row_ran==true. If not ->
      "complete: blocked_no_nonmath_row_ran". Degrade PER DOMAIN: compute the additive value for EACH non-math
      row that actually ran in exp3614 (code and/or facts); if only one ran, report that one and mark the
      other "not_measured" -- do NOT block the whole task on the missing row (the .331 all-or-nothing trap).
      CONCRETE STEPS:
        1. Per domain that ran (code, facts): at a fixed confidence-baseline FPR, compute (a) recall of
           confidence, (b) recall of the ensemble, (c) the CONDITIONAL catch-rate: errors the ensemble catches
           that confidence MISSES (and vice versa). McNemar paired test on the disagreement + CI.
        2. Compute the FUSED detector (ensemble OR confidence, or a calibrated combination) AUROC and
           recall-at-fixed-FPR; compare to confidence alone -- the genuine additive-value number.
        3. Honest verdict: additive (fusion materially beats confidence) / redundant (no conditional lift).
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; store the VALUE):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores cached corpora; no LLM load)."
        code_conditional_catch_rate_ensemble_over_confidence:
          principle: "Errors the ensemble catches that confidence misses -- the second-pair-of-eyes signal for code."
        factual_conditional_catch_rate_ensemble_over_confidence:
          principle: "Same for facts -- the core-motivation product signal."
        mcnemar_p_code:
          principle: "Paired significance of the ensemble-vs-confidence disagreement (not just a point estimate)."
        mcnemar_p_factual:
          principle: "Same for facts."
        fused_detector_auroc:
          principle: "ensemble OR confidence -- the deployable detector's headline number."
        fusion_beats_confidence_alone:
          principle: "True iff the fused detector materially beats confidence -- the real 'is the verifier worth adding' answer."
        second_pair_of_eyes_real:
          principle: "True iff the ensemble catches a significant set confidence misses in >=1 domain with McNemar p<0.05 -- re-derived honestly vs the contaminated prior claim."
        n_errors_per_domain:
          principle: "Sample-size rigor for the conditional-catch claim."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "fused_detector_auroc present AND mcnemar_p_code present AND fusion_beats_confidence_alone present"
          principle: "Product value is conditional, additive coverage measured with a paired significance test -- a higher AUROC alone is not the second-pair-of-eyes claim."
      TERMINAL VERDICTS: "complete: ensemble_additive_to_confidence_second_pair_of_eyes_real_fusion_wins" /
      "complete: ensemble_redundant_with_confidence_no_additive_value_value_prop_weak" /
      "complete: blocked_corrected_remeasurement_invalid_positive_control"
