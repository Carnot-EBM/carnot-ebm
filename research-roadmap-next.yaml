  - id: exp2742
    milestone: "2026.05.260"
    deliverable: "results/experiment_2742_kv260_latency_transcript_terminal.json"
    title: "KV260 Board-Level Latency Transcript (TERMINAL Step) via SSH"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 30
    track: hardware

    prior_failures:
      - experiment_id: exp2735-kv260-continuity-259
