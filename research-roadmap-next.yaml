  - id: exp6325-gatemate-dated-receipt-single-detect
    milestone: "2026.08.545"
    deliverable: results/experiment_6325_gatemate_dated_receipt_single_detect.json
    title: "GateMate dated-receipt single non-destructive detect"
    priority: high
    track: hardware
    requires_gpu: false
    max_turns: 100
    estimated_wall_time_min: 45
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6323-v545-terminal-transition
    prior_failures:
      - experiment_id: exp6121-gatemate-changed-state-gate-v530
        verdict: "blocked_physical_action: unchanged GateMate cable/port/power/board/DirtyJTAG state; no JTAG command run; operator must change physical state and record a dated receipt"
        addressed_by: "ops/known-issues.md now contains a dated 2026-08-11 physical GateMate power-cycle receipt, so this task permits one detect and still forbids programming or build commands."
        retire_if_same_verdict: true
      - experiment_id: exp6199-gatemate-dated-receipt-gate
        verdict: "blocked_missing_receipt: no newer dated GateMate physical receipt exists; zero hardware commands run and Exp3866 remains excluded"
        addressed_by: "The missing prerequisite changed: the 2026-08-11 operator receipt is newer and names the physical power-cycle action. Exactly one non-destructive detection attempt is authorized."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Earlier GateMate tasks stopped because no new physical-state receipt existed. ops/known-issues.md now records a dated 2026-08-11 physical power cycle. This changed prerequisite permits exactly one non-destructive detection command. It does not permit flashing, synthesis, place and route, timing, or a retry loop. The result may still be blocked after the single command.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/ops/known-issues.md dated 2026-08-11 GateMate receipt
      - {project_root}/research-hardware-wishlist.md
      - {project_root}/openspec/capabilities/hardware/spec.md
      - {project_root}/python/carnot/experiment_6121_gatemate_changed_state_gate_v530.py
      - {project_root}/results/experiment_6121_gatemate_changed_state_gate_v530.json
      - {project_root}/results/experiment_6199_gatemate_dated_receipt_gate.json
      - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/e2e-test-plan.md

      TASK
      Validate the dated physical receipt and the exact GateMate target. Capture read-only USB and tool-version state. Then run exactly one command: openFPGALoader -c dirtyJtag --detect. Capture the command, UTC time, stdout, stderr, exit code, timeout state, and detected chain. Stop after this attempt for every outcome. Do not flash, erase, reset, synthesize, place, route, time, or repeat detection. Do not run any command against KV260 or PolarFire.

