  - id: exp3777-p1-discrete-search-adjudication-v3
    milestone: "2026.06.346"
    title: "P1 discrete-search adjudication v3 (the LAST open energy-existential question): rerun the discrete-search EBT decode with a VALID positive control (n_train=40000, the regime where from-scratch AR reaches 0.84) and an ar_best>=0.3 gate, to settle artifact-vs-fundamental for energy-as-generator on discrete text. v1/v2 today were INCONCLUSIVE because the AR positive control was STARVED (n_train=20000); root cause diagnosed + harness fixed. Outcome: EBT discrete-search acc >0% -> decode-ARTIFACT-bounded (reopen narrow); still 0% with AR>=0.3 -> Causal-Inductive-Bias-Gap FUNDAMENTAL (writes the closing theorem). energy-as-generator stays BOUNDED from part-b regardless -- this sharpens the MECHANISM, not the strategic conclusion."
    priority: critical
    max_turns: 100
    agent_type: claude
    model: opus
    requires_claude: true   # GPU from-scratch training + bootstrap risk + open-ended mechanistic adjudication (artifact-vs-fundamental) is exactly the hardware-integration + multi-step-reasoning class that routes to claude/opus; gemini crashes GPU, codex risks bailing mid-train
    requires_gpu: true
    estimated_wall_time_min: 110
    track: phase3
    inference_substrate: live_llm_inference
    prior_failures:
      - experiment_id: thesis_a_p1_discrete_search
        verdict: "complete: thesis_a_p1_v1_INCONCLUSIVE_positive_control_failed_ar_0.000_superseded_by_v2_see_corrigendum"
        addressed_by: "v1 reused the SMALL matched-compute model at 3-digit, so the from-scratch AR positive control collapsed to 0.0 (no headroom -- cannot distinguish 'energy landscape misshaped' from 'tiny model learned nothing'). v3 uses the SCALED harness where AR reaches 0.84, giving a valid positive control."
        retire_if_same_verdict: true
      - experiment_id: thesis_a_p1_discrete_search_v2
        verdict: "complete: thesis_a_p1_v2_INCONCLUSIVE_positive_control_failed_ar_best_0.000_below_0.3_cannot_adjudicate_artifact_vs_fundamental_rerun_with_stronger_ar"
        addressed_by: "v2 used n_train=min(20000,...) which starved the from-scratch AR (ar_best=0.0); the ar_best<0.3 guard correctly returned INCONCLUSIVE. Root cause diagnosed: the scaled harness that achieved AR=0.84 uses min(40000,...). v3 deletes the stale checkpoint and reruns the corrected harness (n_train=40000); the ar_best>=0.3 positive-control gate must PASS before any artifact-vs-fundamental claim is made."
        retire_if_same_verdict: true
    deliverable: results/experiment_3777_p1_discrete_search_adjudication_v3.json
    prompt: |
      CONTEXT: This is the ONE genuinely-open energy-existential question. Both energy-foundation routes are
      already empirically BOUNDED -- this task does NOT reopen that conclusion; it sharpens the MECHANISM behind
      the energy-as-generator bound: is it an ARTIFACT of the decode method (Langevin + a learned emb->token
      decoder descend off-manifold into the void between valid token embeddings) or FUNDAMENTAL (a global
      symmetric energy E(y_1..y_T) cannot enforce AR's step-by-step causal factorization -- the "Causal Inductive
      Bias Gap")? The decisive cheap test: discard Langevin + the learned decoder; decode by PURE DISCRETE SEARCH
      over VALID-token embeddings ONLY (beam / discrete-MCMC). The test ran TWICE today and is INCONCLUSIVE --
      NOT because the energy side failed, but because the from-scratch AR POSITIVE CONTROL collapsed to 0.0 (v1
      used the too-small model; v2 used n_train=20000, which starves AR on 3-digit MSD-first addition). The
      ar_best<0.3 guard CORRECTLY returned INCONCLUSIVE rather than falsely claiming FUNDAMENTAL (a starved
      control is FALSE_NEGATIVE_RISK per CLAUDE.md). Root cause diagnosed; the harness n_train is fixed to 40000
      (the regime where AR reaches 0.84) and a post-train checkpoint was added. This v3 reruns the corrected
      harness with a VALID positive control. energy-as-generator stays BOUNDED from part-b REGARDLESS of the
      outcome; the strategic conclusion does not move.
      EXISTING CODE TO READ FIRST (read via scripts/summarize_artifact.py where useful):
      scripts/thesis_a_p1_discrete_search_v2.py (the harness -- CONFIRM n_train is fixed to 40000; if it still
      reads min(20000,...) FIX it to min(40000,...) before running, since that is the diagnosed root cause);
      results/thesis_a_p1_discrete_search_v2.json (the v2 INCONCLUSIVE artifact + its root_cause_diagnosis block);
      results/thesis_a_p1_discrete_search.json (the v1 corrigendum); results/thesis_a_part_b_scaled_seed1.json
      (the part-b bounded run where AR=0.84 -- the regime to match); scripts/thesis_a_part_b_scaled.py (the
      n_train=40000 reference harness); docs/research-notes/phase3-post-bounded-deep-think-prompts.md (the P1
      frame); CLAUDE.md "Adversarial Artifact Verification" FALSE_NEGATIVE_RISK (the positive-control discipline).
      PRECONDITIONS (check BEFORE training; if ANY missing -> honest_verdict blocked_<resource>, EXIT, no fabrication):
        a. INTERPRETER: run under .venv/bin/python; `import torch` succeeds and torch.cuda.is_available() is True
           with >=1 device. If torch missing or no CUDA -> blocked_cuda_unavailable.
        b. GPU FREE: a CUDA device is not already saturated by a competing job (check nvidia-smi free memory >=
           ~10GB on at least one device). If no free GPU -> blocked_no_free_gpu (the operator will run the
           corrected harness directly -- the v1/v2 pattern). Do NOT queue behind another GPU job.
        c. DELETE the stale checkpoint from v2 before training (the v2 diagnosis says the stale ckpt must be
           deleted), so v3 trains fresh in the corrected n_train=40000 regime.
      CONCRETE STEPS:
        1. Confirm/fix n_train=40000 in the harness (the diagnosed root cause). Train the from-scratch tiny EBT
           AND the matched-compute AR baseline in the SCALED regime (dim=768/4L, ~12000 steps + the learned-
           decoder phase), n_eval>=100, with the post-train checkpoint.
        2. POSITIVE-CONTROL GATE (load-bearing): compute ar_best = max(ar_greedy_acc, ar_selfconsistency_acc).
           If ar_best < 0.3 -> the positive control is STILL starved -> honest_verdict
           "complete: thesis_a_p1_v3_INCONCLUSIVE_positive_control_failed_ar_best_<x>_below_0.3" and STOP (do NOT
           claim artifact-or-fundamental). Set positive_control_passed=false. (Per retire_if_same_verdict, a third
           INCONCLUSIVE retires the in-loop discrete-search approach -> hand to operator.)
        3. ONLY IF ar_best>=0.3: read the EBT discrete-search accuracy (ebt_beam_search_acc / ebt_energy_argmin_acc).
           ebt_best = max over the discrete-search decodes. ADJUDICATE:
             - ebt_best > 0.0  -> "decode-ARTIFACT-bounded": discrete search beats Langevin+learned-decoder ->
               the bound was (partly) a decode artifact -> a NARROW reopen of energy-as-generator decode is
               warranted (record as a finding for the operator; this is NOT a paradigm seed, NOT a re-grind).
             - ebt_best == 0.0 -> "FUNDAMENTAL (Causal-Inductive-Bias-Gap)": even pure on-manifold discrete
               search cannot generate -> supports the closing theorem that a symmetric energy cannot enforce
               causal factorization on discrete text. Record the theorem-support finding.
        4. Report per-method accuracies, sample outputs, training_diverged, n_train used, seeds. Be HONEST: a
           starved control or a divergence is a blocked/inconclusive result, never a fabricated 'FUNDAMENTAL'.
        5. If you ship a test it MUST assert against the script's real behavior (anti-poison-test, the .344 root
           cause).
      INFERENCE-SUBSTRATE HYGIENE: live_llm_inference (from-scratch training + decode); full methodology
      (random_seed, reproducibility_checksum, model_specs naming the EBT + matched AR + n_train). A ~100-min GPU
      run has a large real duration (no DURATION_TOO_SHORT risk). Run `.venv/bin/python
      scripts/adversarial_verify.py <artifact>`; confirm no critical flag (watch FALSE_NEGATIVE_RISK -- a null
      'FUNDAMENTAL' claim is INVALID unless positive_control_passed=true).
      REQUIRED ARTIFACT FIELDS (principle documents WHY; store the bare VALUE):
        honest_verdict:
          principle: "Terminal prefix; blocked_<resource> if a precondition failed; INCONCLUSIVE if the positive control failed."
        inference_substrate: "live_llm_inference (principle: from-scratch EBT+AR training and decode on GPU)."
        positive_control_passed:
          principle: "BARE bool -- ar_best>=0.3. The LOAD-BEARING gate: a null 'FUNDAMENTAL' claim is only valid if the AR positive control reached non-trivial accuracy (else it is FALSE_NEGATIVE_RISK, the v1/v2 failure)."
        ar_best:
          principle: "max(ar_greedy, ar_selfconsistency) -- the positive-control accuracy; must be >=0.3 (and ideally ~0.84, the part-b regime) to adjudicate."
        ebt_best:
          principle: "max EBT accuracy over the discrete-search decodes (beam / energy-argmin) -- the energy-as-generator signal under on-manifold discrete search."
        adjudication:
          principle: "BARE string in {decode_artifact_bounded, fundamental_causal_inductive_bias_gap, inconclusive_positive_control_failed} -- the milestone-defining mechanistic verdict."
        n_train:
          principle: "BARE int -- MUST be 40000 (the diagnosed-fixed value); records that the starved-control root cause was addressed."
        per_method_accuracies:
          principle: "ar_greedy/ar_selfconsistency/ebt_argmin/ebt_beam -- the full table, so a reviewer can audit the adjudication."
        training_diverged:
          principle: "BARE bool -- a divergence invalidates the run (report as blocked/inconclusive, not a finding)."
        energy_as_generator_still_bounded:
          principle: "BARE bool, MUST be true -- this task sharpens the MECHANISM only; the part-b strategic bound stands regardless of the v3 outcome."
        preconditions_checked:
          principle: "CUDA + free-GPU + stale-ckpt-deleted verified before training; the anti-fabrication gate."
        model_specs:
          principle: "Names the from-scratch EBT + matched AR + n_train -- honest substrate."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Content hash catches drift vs the v2 run."
        duration_s:
          principle: "Wall-clock plausibility floor; a ~100-min GPU train is expected."
      TERMINAL VERDICT examples:
        "complete: thesis_a_p1_v3_decode_artifact_bounded_ar_best_<x>_ebt_best_<y>_positive_control_passed_energy_as_generator_still_bounded"
        "complete: thesis_a_p1_v3_FUNDAMENTAL_causal_inductive_bias_gap_ar_best_<x>_ebt_best_0.000_positive_control_passed"
        "complete: thesis_a_p1_v3_INCONCLUSIVE_positive_control_failed_ar_best_<x>_below_0.3"
      Run: cd {project_root} && .venv/bin/python scripts/experiment_3777_p1_discrete_search_adjudication_v3.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3778-fr11-self-learning-v18-tier2-constraint-memory
    operator_override: "2026-05-29 operator directive (standing): versioned lineage continuation (FR-11 vN+1). STATED forward difference: v17 (.345) was a Tier-1 online per-verifier PRECISION tracker; v18 is a Tier-2 CONSTRAINT-MEMORY consolidation (a DIFFERENT self-learning tier, python/carnot/fr11/tier2_memory.py) -- it consolidates per-domain threshold deltas across the corpus, not per-verifier precision counters. False-positive scope-match vs prior FR-11 exps."
    milestone: "2026.06.346"
    title: "FR-11 continuous self-learning v18 -- Tier-2 CONSTRAINT-MEMORY consolidation on the LIVE verifier (distinct from v17's Tier-1 precision tracker): use the Tier2ThresholdMemory module to learn per-domain score-threshold deltas across the FoVer corpus, persist them, and CONFIRM the consolidated deltas do not regress the banked discriminator (ensemble AUROC stays >= the frozen 0.9131 within CI, and the +0.0185 memory contribution is preserved). CPU only (Tier-2 hardware path: CPU+system-memory, <1ms/lookup). The self-learning experiment mandated by research-program.md."
    priority: high
    max_turns: 40
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # a CPU memory-consolidation tracker over cached verifier scores using the existing Tier2ThresholdMemory API -- formulaic; codex is the standing cheap-default
    estimated_wall_time_min: 14
    track: self-learning
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3778_fr11_self_learning_v18_tier2_constraint_memory.json
    prompt: |
      CONTEXT: research-program.md mandates one continuous-self-learning experiment per milestone (Tiers 1-4).
      v17 (.345, exp3772) was the Tier-1 online per-verifier PRECISION tracker. v18 advances to TIER-2 (constraint
      memory): consolidate per-domain score-threshold deltas across the FoVer corpus so a future deployment
      resumes learned thresholds (the Tier-2 hardware path: CPU + system memory, <1ms/lookup -- NOT a model
      retrain). This is a genuine forward step, not a re-run of v17.
      EXISTING CODE TO READ FIRST: python/carnot/fr11/tier2_memory.py (the Tier2ThresholdMemory API:
      __init__(db_path), update_domain_delta(domain_key, examples, labels), get_domain_delta(domain_key),
      apply_delta(domain_key, raw_score) -- REUSE this, do not reinvent); results/experiment_2837_fover_memory_
      leakage_v3.json (the 4 scoring verifiers fr11_session_memory/tier0r_curry_howard/tier0s_arithmetic_gap/
      tier0u_logical_consistency + the +0.0185 memory-ablation contribution to preserve); ops/reproduction-
      runbook-fover-headline.md (the scoring protocol); results/experiment_3772_fr11_self_learning_v17_*.json
      (v17, to confirm v18 is a different tier); research-program.md 'Continuous Self-Learning' Tier-2 section.
      PRECONDITIONS (check BEFORE consolidation; if ANY missing -> blocked_<resource>, EXIT, no fabrication):
        a. INTERPRETER: run under .venv/bin/python; pyyaml/numpy/sklearn importable; Tier2ThresholdMemory importable.
        b. FoVer scores/labels reachable (the cached candidate triples from the runbook's path, ABSOLUTE path).
           If absent -> blocked_fover_corpus_missing (graceful, honest -- record 'no corpus to consolidate from',
           NOT a fabricated delta table).
      CONCRETE STEPS:
        1. Score the 4-verifier ensemble against the cached FoVer triples (verifier-scoring, ~16s, no live LLM).
        2. Consolidate per-domain threshold deltas via Tier2ThresholdMemory.update_domain_delta over the corpus;
           persist to the db_path so a future milestone resumes them (tracker_state_persisted=true).
        3. Recompute the ensemble AUROC with the consolidated deltas applied (apply_delta). CONFIRM it does NOT
           regress the banked discriminator: ensemble AUROC stays within/above the frozen CI95 [0.9027, 0.9235]
           AND the +0.0185 fr11_session_memory (memory) contribution is preserved (the learned consolidation must
           not silently drop the self-learning component the headline depends on).
        4. Report per-domain deltas + the AUROC under consolidation. If you ship code+tests, the test MUST assert
           against the tracker's real behavior (anti-poison-test, the .344 root cause).
      INFERENCE-SUBSTRATE HYGIENE: verifier-scoring; reuses cached scores; full methodology (random_seed,
      reproducibility_checksum, model_specs naming the corpus + 4 verifiers). Run `.venv/bin/python
      scripts/adversarial_verify.py <artifact>`; confirm no critical flag.
      REQUIRED ARTIFACT FIELDS (principle documents WHY; store the bare VALUE):
        honest_verdict:
          principle: "Terminal prefix; the self-learning outcome; blocked_<resource> if a precondition failed."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: reads cached verifier scores, no live model)."
        per_domain_threshold_deltas:
          principle: "The consolidated per-domain deltas -- the Tier-2 learned knowledge; the core deliverable."
