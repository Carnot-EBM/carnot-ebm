    prompt: |
      CONTEXT
      Milestone 2026.08.548 is terminal. Its active roadmap contained four tasks, Exp6363 through Exp6366. Exp6363 reported blocked_v548_queue_incomplete because the proposal named 14 tasks while the activated queue had four. The four active tasks are now the correct evidence boundary. Exp6365 proved complete observable GGUF execution for all three mandated families. Exp6366 produced three nonempty raw outputs but zero parse-valid factor edits and zero exact-checker calls. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
