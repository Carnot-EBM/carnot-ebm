        verdict: "complete_below_gate: abstention_precision=0.5; rejection_recall=0.25"
        addressed_by: "Moves beyond first-token/tiny-panel evidence with stratified exact fixtures and explicit minimum live counts."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .288 generated 72 exact fixtures, but the live SOTA abstention panel reported exact_ground_truth_count=9 and abstention_precision=0.0. Before another model run, Carnot needs a non-tiny, stratified evaluation protocol.

