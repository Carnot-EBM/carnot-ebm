        - python/carnot/ (the FR-11 controller-memory / self-learning module)
        - data/fover_corpus.jsonl (the cached corpus for verifier decision scoring)
        - project_q12_hypothesis_b_and_dark_room + project_zenil_alpha_grounding (memory) — the theory

      TASK: At >=2 FRESH grounding configurations (different verifier subsets/ACTIVE_WEIGHTs):
      (a) MEASURE lambda_min(Sigma); (b) SET beta = f(lambda_min) using exp3498's fitted law;
      (c) run the FR-11 self-improvement loop to N>=200 under THREE arms — Arm A (deployed
      beta=f(lambda_min)), Arm B (beta=0 control, expect collapse), Arm C (fixed-conservative
      beta, e.g. 0.5); (d) report collapse_detected per arm and whether the deployed-law arm
      prevents collapse while not over-regularizing relative to the conservative arm.

