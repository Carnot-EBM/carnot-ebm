           or a simple latent-truth EM over the verifier votes) vs Carnot's current weighting. Report
           ensemble AUROC under: unweighted, Weaver-style weighted, Carnot weighted.
        3. Honest verdict: does correlation-awareness matter (does accounting for the measured correlation
