  - id: exp2639
    milestone: "2026.05.252"
    deliverable: "results/experiment_2639_ttt_scaleup.json"
    title: "VerifierDrivenTTT Scale-Up: 100-Example FR-11 Tier 3 with Statistical Significance"
    agent_type: codex
    model: gpt-5.5
    max_turns: 45
    track: self_learning
    continuous_self_learning_task: true

    prior_failures:
      - experiment_id: exp2624-ttt-loop-prototype
        verdict: "complete: VerifierDrivenTTT prototype 50 examples; ttt_loop_ran=true"
        addressed_by: "exp2624 (.251) prototyped the TTT loop at N=50 with 5 selected examples. CLAUDE.md sample-size rigor: 'N >= 30 for any percentage-point delta claim; N >= 1000 for sub-pp claims.' ttt_delta_auroc on 50 examples lacks the statistical power to confirm direction. This scale-up runs N=100, 5 seeds, bootstrap confidence interval, and paired t-test. Different statistical scope: significance testing with H0: delta == 0."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      FR-11 Tier 3 TTT loop was prototyped in exp2624 (.251) at N=50 examples, 5 selected.
      ttt_delta_auroc was positive but without statistical significance testing.

      Per CLAUDE.md: "N >= 30 examples for any percentage-point delta claim AND a successful
      replication artifact (n>1 seeds, same direction)." This scale-up provides N=100, 5 seeds,
      and a bootstrap CI for ttt_delta_auroc.

      FR-11 Tier 3 headline-closure gate:
        ttt_delta_auroc_mean > 0.01 AND p_value < 0.05 AND n_samples >= 100 AND n_seeds_positive >= 3

      Also incorporates ANCORA's anti-collapse strategy (arXiv:2604.27644): manifold-anchored
      selection prevents the selected examples from being all near the decision boundary.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/ttt_loop.py (VerifierDrivenTTT class from exp2624)
      - results/experiment_2624_ttt_loop_prototype.json (N=50 baseline; ttt_delta_auroc)
      - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline)
      - data/fover_corpus.jsonl (larger pool for 100-example run)

      TASK: Scale TTT loop to 100 examples with 5 seeds and statistical significance testing.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         b. python/carnot/pipeline/ttt_loop.py exists (written in exp2624).
            If absent: write honest_verdict blocked_ttt_module_not_found; exit.
         c. FoVer corpus: {project_root}/data/fover_corpus.jsonl (n_lines >= 300 for 100+200 pool+eval).
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer real corpus. Use:
         - 500-example pool (the "unlabeled" set TTT selects from)
         - 100-example held-out evaluation set (separate from pool)
         Split with random_seed=42 stratified.

      2. Load VerifierDrivenTTT from python/carnot/pipeline/ttt_loop.py.
         If the class needs updates to support ANCORA manifold anchoring:
         Add a `manifold_anchor` parameter (default=False) to select_high_confidence():
         When manifold_anchor=True: filter out examples where verifier score is exactly 0.0 or 1.0
         (extreme scores may indicate distribution extremes, not manifold representatives).
         manifold_anchored_selection = [e for e in high_conf if 0.05 < score(e) < 0.95]
         Select top-n_select from manifold_anchored_selection.

      3. For each seed in [42, 7, 99, 1234, 2026]:
         a. Baseline: evaluate pipeline on held_out (N=100) WITHOUT TTT context.
            Record baseline_auroc_seed, baseline_accuracy_seed.
         b. TTT: select top-5 from pool WITH manifold anchoring (ANCORA pattern).
            Evaluate held_out WITH selected few-shot context.
            Record ttt_auroc_seed, ttt_accuracy_seed, n_selected_seed.
         c. delta_seed = ttt_auroc_seed - baseline_auroc_seed

      4. Aggregate across 5 seeds:
         baseline_auroc_mean = mean(baseline_auroc_seeds)
         ttt_auroc_mean = mean(ttt_auroc_seeds)
         ttt_delta_auroc_mean = ttt_auroc_mean - baseline_auroc_mean
         ttt_delta_auroc_std = std(delta_per_seed)
         n_seeds_positive = count(delta_seed > 0)

      5. Statistical significance testing:
         Paired t-test: H0: mean(delta_seeds) == 0
         from scipy.stats import ttest_1samp
         t_stat, p_value = ttest_1samp(delta_seeds, 0.0)
         Record t_stat, p_value.
         fr11_tier3_headline_closed = (ttt_delta_auroc_mean > 0.01) AND (p_value < 0.05) AND
                                       (n_samples >= 100) AND (n_seeds_positive >= 3)

      6. Bootstrap CI on ttt_delta_auroc_mean (1000 bootstrap samples):
         delta_ci_95pct = (lower_5th_pct, upper_95th_pct) of bootstrap distribution.

      7. Write results/experiment_2639_ttt_scaleup.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - ttt_delta_auroc_mean: float — mean TTT improvement across 5 seeds
        principle: "Primary FR-11 Tier 3 metric; headline-eligible only if p_value < 0.05."
      - ttt_delta_auroc_std: float — std of delta across seeds
        principle: "Measures seed stability of the TTT effect."
      - p_value: float — one-sample t-test H0: delta == 0
        principle: "Statistical significance gate; p < 0.05 required for FR-11 Tier 3 headline closure."
      - fr11_tier3_headline_closed: bool
        principle: "FR-11 completion gate: True iff all 4 criteria met (delta>0.01, p<0.05, N>=100, n_positive>=3)."
      - n_seeds_positive: int — count of seeds with ttt_delta > 0
        principle: "Directional consistency: >= 3 of 5 seeds positive required for reliable effect direction."
      - n_samples: int — per-seed evaluation size (must be >= 100)
        principle: "Statistical minimum per CLAUDE.md: N >= 100 for percentage-point claims."
      - manifold_anchored: bool — True iff ANCORA anti-collapse selection was applied
        principle: "Documents whether the Dark Room failure mode (null-space collapse) was guarded against."
      - delta_ci_95pct: list [lower, upper] — bootstrap confidence interval on mean delta
        principle: "CI crossing zero = effect not reliably positive; paper-v6 must document CI."
      - baseline_auroc_mean: float
        principle: "Without-TTT baseline; all improvement claims are relative to this."
      - ttt_auroc_mean: float
        principle: "With-TTT mean AUROC."
      - random_seed: 42
        principle: "Reproducibility of corpus split."
      - duration_s: float
        principle: "5-seed evaluation on 100 examples per seed takes >= 3s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication record."

      Run: `python -c "import sys; sys.path.insert(0, '{project_root}/python');
           from carnot.pipeline.ttt_loop import VerifierDrivenTTT; print('TTT scale-up OK')"`.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2640
    milestone: "2026.05.252"
    deliverable: "results/experiment_2640_symbolic_kan.json"
    title: "Symbolic-KAN Energy Tier: Interpretable Activation Functions (arXiv:2603.23854)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: architecture

    prior_failures:
      - experiment_id: exp980-sos-kan-reparameterization
        verdict: "complete: SOS-KAN reparameterization with monotonicity type-level invariants"
        addressed_by: "exp980 added SOS-on-derivative monotonicity invariants to the KAN spline basis (CLAUDE.md reference: 'SOS-Integrated KAN'). Symbolic-KAN (arXiv:2603.23854) is a different architectural change: replaces continuous spline activations with discrete symbolic function library (linear, quadratic, entropy, cosine). Different paper, different technique, different goal (interpretability vs constraint-enforcement). No scope overlap."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      arXiv:2603.23854 (Symbolic-KAN) replaces KAN's continuous spline activations with a discrete
      library of symbolic functions: linear (w*x + b), quadratic (w*x^2 + b), entropy (-x*log(x)),
      cosine (cos(w*x + b)), and a learned residual. Each edge in the KAN competes over this library;
      the winning function is selected by minimum reconstruction error during training.

      Key benefits for Carnot:
      - Interpretability: "the verifier fires because it computes entropy(token_distribution) > threshold"
        is auditable; a generic spline is not
      - Efficiency: discrete library has fewer parameters than continuous splines
      - Potential for AUROC parity or improvement (the paper shows >90% correct primitive identification)

      Target: symbolic_kan_auroc >= standard_kan_auroc - 0.005 (within 0.5% of standard KAN).
      If target met: symbolic_kan_viable = True (update production KAN energy tier).

      EXISTING CODE TO READ FIRST:
      - python/carnot/models/kan.py (or python/carnot/verify/ for KAN energy verifier module)
      - python/carnot/verify/base_verifier.py (BaseVerifier interface)
      - results/experiment_2622_ensemble_v9_adversarial_val.json (standard KAN AUROC contribution)

      TASK: Implement Symbolic-KAN energy verifier and evaluate against standard KAN.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import numpy; import sklearn"` succeeds.
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. Locate the KAN energy verifier module: search python/carnot/ for kan*.py.
            If not found: implement a simple KAN from scratch (3-layer, 4 features).
         d. FoVer corpus: {project_root}/data/fover_corpus.jsonl (n_lines >= 200).
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Define symbolic function library (4 primitives):
         SYMBOL_LIB = {
           'linear': lambda x, w, b: w * x + b,
           'quadratic': lambda x, w, b: w * x**2 + b,
           'entropy': lambda x, w, b: -w * (x + 1e-8) * np.log(x + 1e-8) + b,
           'cosine': lambda x, w, b: w * np.cos(x) + b,
         }

      2. Implement SymbolicKANVerifier (3-layer, 4 input features per layer):
         class SymbolicKANVerifier:
           """KAN with discrete symbolic activation library per arXiv:2603.23854.
           Each edge learns WHICH symbolic function to use (linear, quadratic, entropy, cosine)
           plus the function's parameters (w, b). Interpretability benefit: each edge's
           contribution can be described in closed form as a named mathematical operation."""

           def select_primitive(self, edge_inputs, edge_outputs):
             """Select the best-fitting primitive from SYMBOL_LIB for this edge."""
             best = None; best_err = float('inf')
             for name, func in SYMBOL_LIB.items():
               w_fit, b_fit = self._fit_linear([func(x, 1, 0) for x in edge_inputs], edge_outputs)
               predicted = [func(x, w_fit, b_fit) for x in edge_inputs]
               err = np.mean((np.array(predicted) - np.array(edge_outputs))**2)
               if err < best_err:
                 best = (name, w_fit, b_fit); best_err = err
             return best, best_err

      3. Train SymbolicKANVerifier on 80% of FoVer corpus (random_seed=42) with input features:
         [claim_length, token_diversity, bigram_entropy, context_overlap]
         Record: symbolic_activation_assignments (which primitive each edge selected)

      4. Evaluate on 20% test split:
         symbolic_kan_auroc = roc_auc_score(labels, symbolic_scores)
         Generate human_readable_explanation for 3 examples: describe which primitive fired and
         why it flagged the claim. Store in symbolic_kan_explanations list.

      5. Compare: delta_vs_standard = symbolic_kan_auroc - standard_kan_auroc
         (standard_kan_auroc: use the KAN AUROC from the existing production KAN verifier;
          if not available separately: use 0.994 from research-program.md as reference)
         symbolic_kan_viable = (symbolic_kan_auroc >= 0.994 - 0.005)

      6. If symbolic_kan_viable: write updated KAN verifier to
         python/carnot/verify/tier_kan_symbolic.py

      7. Write results/experiment_2640_symbolic_kan.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - symbolic_kan_auroc: float — AUROC on FoVer test set
        principle: "Primary viability metric: must be within 0.005 of standard KAN AUROC."
      - standard_kan_auroc_reference: float — standard KAN AUROC used for comparison
        principle: "Documents the comparison baseline; 0.994 from literature if not measured locally."
      - delta_vs_standard: float — symbolic_kan_auroc - standard_kan_auroc_reference
        principle: "Negative within 0.005 = acceptable accuracy cost for interpretability gain."
      - symbolic_kan_viable: bool — True iff within 0.005 of standard
        principle: "Production adoption gate: interpretability upgrade without AUROC regression."
      - symbolic_activation_assignments: dict {layer_edge: primitive_name}
        principle: "Core interpretability deliverable: which function each edge uses."
      - human_readable_explanations: list of str — 3 example explanations
        principle: "Demonstrates interpretability claim: paper-v6 appendix can show these."
      - random_seed: 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "KAN training + evaluation on 200 examples takes >= 1s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication record."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2641
    milestone: "2026.05.252"
    deliverable: "results/experiment_2641_pasc_pipeline_conformal.json"
    title: "PASC Pipeline-Aware Conformal Prediction: Joint Coverage for Multi-Stage Verification"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: calibration

    prior_failures:
      - experiment_id: exp2627-bb-ucp-conformal
        verdict: "complete: BB-UCP label-free conformal calibration; coverage_at_90pct documented"
        addressed_by: "exp2627 (.251) implemented BB-UCP for single-stage calibration. PASC (arXiv:2605.18812) addresses multi-stage pipeline uncertainty: it provides JOINT coverage guarantees across Carnot's sequential stages (extract → verify → repair). Different algorithm (pipeline-aware vs bootstrap), different coverage target (joint vs marginal), different paper."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      arXiv:2605.18812 (PASC: Pipeline-Aware Conformal Prediction) provides joint coverage guarantees
      for multi-stage NLP pipelines. Key contribution: instead of calibrating each stage independently
      (which under-covers the joint event "all stages correct"), PASC models inter-stage score
      correlations and provides a single prediction interval covering the full pipeline output.

      Carnot's pipeline is: extract(context) → verify(context, claims) → repair(context, claims) →
      re-verify(context, repaired_claims). The existing BB-UCP (exp2627) provides single-stage
      calibration on the verify stage. PASC extends this to the full 3-stage pipeline.

      Target: coverage_joint_90pct >= 0.90 (PASC coverage across all 3 pipeline stages).

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline stages)
      - results/experiment_2627_bb_ucp_conformal.json (single-stage BB-UCP baseline)
      - data/fover_corpus.jsonl (evaluation corpus)

      TASK: Implement PASC joint coverage for Carnot's verify-repair pipeline.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import numpy; import sklearn; import scipy"` succeeds.
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. FoVer corpus: {project_root}/data/fover_corpus.jsonl (n_lines >= 200).
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Load FoVer corpus (200 examples, random_seed=42 split). Define 3 "stages":
         Stage 1 (extract): extract claims from context → score = len(claims) / max_claims
         Stage 2 (verify): ensemble v9 score on each claim → score = max ensemble score
         Stage 3 (repair): pipeline repair applied if score > 0.5 → score = post_repair_score
         For FoVer corpus: stage 1 is trivial (claim is given), stage 2 is the AUROC-relevant stage.

      2. Simulate multi-stage PASC for Carnot:
         For each of 200 examples:
           s1 = 1.0 (claim extraction always succeeds on FoVer format)
           s2 = ensemble_v9.score(context, claim)  (verify stage)
           s3 = max(0, s2 - 0.1) if s2 > 0.5 else s2  (repair stage reduces score by 0.1 for
                                                         high-confidence hallucinations)
         Record (s1, s2, s3, label) for each example.

      3. Compute Bonferroni single-stage interval for comparison:
         For each stage separately: use BB-UCP 90th-pct interval.
         Bonferroni joint = intersection of all 3 intervals (conservative).
         bonferroni_coverage = fraction of examples where all 3 stages' scores fall within intervals.

      4. Implement PASC joint coverage (covariance-aware):
         Compute score vector [s2, s3] (main stages). (Ignore s1 as it's trivially 1.0.)
         Compute covariance matrix of [s2, s3] across calibration set (half the corpus).
         Compute Mahalanobis distance of each example from the center.
         PASC interval: all examples within the (1-alpha) Mahalanobis ellipsoid.
         target_alpha = 0.10 (90% nominal coverage).
         Tune radius r so that 90% of calibration examples fall within ellipsoid.
         Evaluate on remaining half: pasc_coverage = fraction within the ellipsoid.

      5. Compare:
         coverage_joint_90pct = pasc_coverage (PASC joint coverage)
         coverage_bonferroni_90pct = bonferroni_coverage (Bonferroni comparison)
         pasc_tighter_than_bonferroni = (pasc joint interval volume < bonferroni volume)

      6. Write results/experiment_2641_pasc_pipeline_conformal.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
