- id: exp701-kv260-ising-v3-synthesis
  milestone: 2026.04.53
  deliverable: results/experiment_701_kv260_ising_v3_synthesis.json
  title: 'Exp 701: KV260 Ising v3 RTL Synthesis Attempt — Vivado Install Check + Bitstream Gate'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The KV260 FPGA board arrived 2026-04-20 (RETRO-070 CLOSED in .52 via Exp 648).
    The Ising v3 RTL (ising_sampler_v3.v) was written with EMA inertia dynamics (Exp 648).
    RETRO-072 (opened in .52) is: Vivado was not installed when the board arrived — synthesis
    could not run. This experiment attempts to:
    1. Check if Vivado is now installed (or install AMD Vitis/Vivado 2024.2 free tier).
    2. If available: run synthesis on ising_sampler_v3.v and report timing/resource usage.
    3. If unavailable: fall back to yosys open-source synthesis as proxy.

    This experiment does NOT require a bitstream deploy — synthesis report is sufficient for
    .53. Full implementation and flashing will be RETRO-073 in .54.

    EXISTING CODE TO READ FIRST:
    - rtl/ising_sampler_v3.v — Ising v3 RTL with EMA inertia dynamics.
    - results/experiment_648_kv260_ising_v3_rtl.json — RTL spec from .52 (RETRO-070 outcome).
    - ops/status.md — RETRO-072 status.
    - research-hardware-wishlist.md — KV260 hardware details.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Attempt Vivado synthesis of ising_sampler_v3.v; if unavailable use yosys;
    report FPGA resource utilization or proxy LUT estimate.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-HW-037 (KV260 Ising v3 synthesis: timing closure at >= 50 MHz target),
       REQ-HW-038 (LUT utilization < 20% of KV260 fabric for Ising v3 N=64),
       SCENARIO-HW-037/038 to spec.md (create openspec/capabilities/fpga/spec.md if not exists).
    3. Create scripts/experiment_701_kv260_synthesis.py:
       a. ExperimentTimeoutWatchdog(701, timeout_minutes=120).
       b. Check Vivado: try subprocess.run(["vivado", "-version"], capture_output=True).
          vivado_available = returncode == 0.
       c. Check yosys: try subprocess.run(["yosys", "-V"], capture_output=True).
          yosys_available = returncode == 0.
       d. If vivado_available:
          Run Vivado non-project synthesis:
          Write tcl/synth_ising_v3.tcl:
            read_verilog rtl/ising_sampler_v3.v
            synth_design -top ising_sampler_v3 -part xck26-sfvc784-2LV-c
            report_utilization -file results/ising_v3_utilization.rpt
            report_timing_summary -file results/ising_v3_timing.rpt
          subprocess.run(["vivado", "-mode", "batch", "-source", "tcl/synth_ising_v3.tcl"]).
          Parse utilization report: extract LUT_count, FF_count, BRAM_count.
          Parse timing report: extract WNS (worst negative slack). timing_met = WNS >= 0.
          synthesis_tool = "vivado"
       e. Elif yosys_available:
          Run yosys proxy synthesis:
          Write yosys_script.ys:
            read_verilog rtl/ising_sampler_v3.v
            synth -top ising_sampler_v3
            stat
          subprocess.run(["yosys", "yosys_script.ys"], capture_output=True).
          Parse stat output: extract estimated LUT count from "cells" line.
          LUT_count = parsed; timing_met = None (yosys does not do timing).
          synthesis_tool = "yosys"
       f. Else:
          synthesis_tool = "none_available"
          LUT_count = None; timing_met = None.
          Write ops/known-issues.md note: "RETRO-072: Vivado not installed; yosys not found."
       g. honest_verdict:
          - "synthesis_timing_met" if vivado AND timing_met == True
          - "synthesis_lut_estimate_only" if yosys AND LUT_count is not None
          - "synthesis_blocked_no_tool" if synthesis_tool == "none_available"
          - "synthesis_timing_failed" if vivado AND timing_met == False
       h. If honest_verdict includes "met" or "estimate": close RETRO-072 in ops/status.md.
          Else: update RETRO-072 with this attempt, open RETRO-073 for .54.
       i. artifact: synthesis_tool, LUT_count, FF_count, BRAM_count, timing_met,
          WNS_ns, retro_072_resolved (bool), honest_verdict.
    4. Write tests/python/test_experiment_701_synthesis.py with 100% coverage:
       - test Vivado/yosys availability check logic.
       - test utilization report parser.
       - test timing report parser.
       Each test traces to REQ-HW-037/038.
    5. Reconcile:
       - ops/status.md: update RETRO-072 with synthesis result.
       - ops/changelog.md: one-line with synthesis_tool and honest_verdict.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

