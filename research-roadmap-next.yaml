        structured_abstention:
          principle: "The Prover-Verifier-Deliberation structured report/abstain operating point (survive-challenge accept-rate, abstention-rate, retained-accuracy) + the raw-threshold risk-coverage curve -- the .405 'no useful threshold-only point' answered with structure, not a raw threshold."
