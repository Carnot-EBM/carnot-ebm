        retire_if_same_verdict: true
      - experiment_id: exp3057-local-sota-solution-verifier-gain-panel
        verdict: "complete: verifier_gain_delta=-0.125; false_negative_rate=1.0"
        addressed_by: "Routes accept/reject/abstain decisions through exact labels and hard safety constraints rather than a single verifier score."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. OpenReview `Qmr9VbwRaB` frames LLM routing as weighted MaxSAT/MaxSMT. Carnot needs an auditable accept/reject/abstain policy before rerunning local SOTA verifier calibration.

