        target_game: {{principle: "dc22 -- the last open config/toggle first-contact game"}}
        dc22_grounded: {{principle: "bare bool: the counterexample-guided loop produced a GROUNDED is_win() that reproduces -- the GAP-4423-DC22 closure premise"}}
        reproduced_levels: {{principle: "bare int; only reproduction-gated levels count (ARC Solve Reproducibility)"}}
        offline_reproduced: {{principle: "the reproduction gate -- a live-only solve does not count"}}
        counterexample_rounds: {{principle: "bare int: how many refute->re-induce rounds the grounding took -- proves the CEGIS lever ran (exp4455 had 0 because it was blocked)"}}
        baseline_pytest_nocov_green: {{principle: "bare bool: the --no-cov smoke gate passed -- proves the .413 precondition fix (exp4455 was blocked here with --cov)"}}
        few_shot_examples_used: {{principle: "list of which grounded config/toggle win-rules conditioned the induction -- proves the example corpus is the lever"}}
        missing_verifier_gaps: {{principle: "if no bank, the residual dc22 mechanic -- the .414 build backlog"}}
        verifier_is_oracle: {{principle: "true: the verifier GROUNDS the LLM-proposed predicate (execution-grounded), NOT a learned-verifier moat (Circularity Discipline)"}}
        reproducible_total_levels: {{principle: "the new authoritative count after banking (target 40)"}}
        random_seed: {{principle: "determinism for re-run"}}
        reproducibility_checksum: {{principle: "content hash of corpus+prompt+plan for reproducibility"}}
      honest_verdict MUST start with complete:/success:/passed:/shipped:. NO 3090 inference; NO leaderboard submission.
      Run command: `.venv/bin/python python/carnot/experiment_4467_solve_dc22_cegis_nocov.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

