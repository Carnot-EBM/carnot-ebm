milestone: "2026.05.181"
milestone_title: "QAOD vs NLA-SAE Head-to-Head + Phase 4 Genuine Scaling with alpha_t' + EBT Refinement Retry + .179/.180 Audit"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
scope_reduction_compliance:
  rationale: ".179 produced 2 substantive results (exp1725 LM-EBM bijection re-derivation; exp1732 de-entangled reweighting +2.86pp lift). .180 in flight with mixed outcomes (exp1736 EBT gradient refinement doomed-rerun-blocked 3x). .181 lands the top sweep finding (QAOD vs NLA-SAE head-to-head per arXiv:2605.14449 Score 320), runs the genuine Phase 4 substrate scaling that exp1725's bijection theory motivates, retries exp1736 with explicit prior_failures, and audits ."
  carry_forwards_addressed: ["QAOD head-to-head NEW (Score 320)", "Phase 4 genuine scaling with alpha_t' from .178 exp1721", "exp1736 EBT refinement doomed-rerun retry", ".179/.180 findings audit"]
authored_by: outer-loop-claude

tasks:
  - id: exp1740-qaod-vs-nla-sae-head-to-head
    title: "Exp 1740: QAOD vs NLA-SAE head-to-head on shared gemma-4-26B substrate"
    deliverable: results/experiment_1740_qaod_vs_nla_head_to_head.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1720-nla-task-4-ensemble-integration
        verdict: complete_acceptance_passed_k16_shipped
        addressed_by: "exp1720 (.178) shipped NLA-SAE as verifier #16 in production. This head-to-head adds QAOD (arXiv:2605.14449, Score 320 from 2026-05-15T08:45Z sweep) as a parallel candidate probe — NOT replacing NLA, evaluating alongside on the same 60-example test set."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: The 2026-05-15T08:45Z literature sweep surfaced
      arXiv:2605.14449v1 (Yao/Feng/Xia, May 14 2026, Score 320) — QAOD,
      a white-box probing framework using orthogonal decomposition of
      answer representations against question context. Reports 21%
      improvement on BioASQ for hallucination detection. Carnot's
      NLA-SAE probe (exp1694 prototype + exp1720 production
      integration) shipped at TPR=0.73/FPR=0.0 on gemma-4-26B-A4B-it-GGUF.
      This task runs a head-to-head on the SAME 60-example held-out
      test corpus used by exp1716 (NLA eval-awareness, delta_tpr=-0.042).

      FALSIFIABLE HYPOTHESIS: On the shared 60-example test set, QAOD
      outperforms NLA-SAE by at least 5pp on TPR with FPR <= 0.20 (the
      same FPR cap NLA-SAE met). If lift < 5pp, NLA-SAE remains the
      production probe. If QAOD outperforms by > 5pp AND maintains
      eval-awareness safety (delta_tpr < 5pp on the eval-vs-prod split),
      it becomes a candidate verifier #17 (k=16 → k=17 ensemble).

      EXISTING CODE TO READ FIRST:
        - python/carnot/verify/nla_verifier_v3.py (NLA-SAE probe)
        - results/experiment_1694_nla_v3.json (NLA TPR=0.73 baseline)
        - results/experiment_1716_nla_eval_awareness.json (60-example
          test corpus + eval-vs-prod split)
        - results/experiment_1720_nla_ensemble_integration.json (k=16
          production integration)

      TASK: Implement minimal QAOD probe, run on shared corpus, report
      head-to-head TPR/FPR.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md Pre-Launch Preconditions Discipline):
           a. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              returns non-empty — else `blocked_model_not_cached`.
           b. `test -f python/carnot/verify/nla_verifier_v3.py` — else
              `blocked_nla_v3_implementation_missing`.
           c. `test -f results/experiment_1716_nla_eval_awareness.json`
              — else `blocked_no_shared_test_corpus`.
           d. `python -c "import numpy as np; import scipy.linalg"`
              succeeds — else `blocked_scipy_missing`.
           Record preconditions_checked.
        1. Implement QAOD: orthogonal decomposition of answer
           representations against question context. Per arXiv:2605.14449
           abstract: project each answer representation onto the
           orthogonal complement of the question context subspace; the
           residual magnitude (or the projection onto question-aligned
           subspace) is the hallucination indicator.
        2. Reuse the exp1716 60-example test corpus (30 eval-style +
           30 production-style; same labels = k=15 ensemble agreement).
        3. Run NLA-SAE probe (from exp1720) on all 60. Record TPR/FPR
           with Wilson 95% CI.
        4. Run QAOD probe on all 60. Record TPR/FPR with Wilson 95% CI.
        5. Compute delta_tpr_qaod_minus_nla and bootstrap CI.
        6. Acceptance: report all numbers honestly. The "gate" is task
           completion, NOT a specific direction — either finding is
           publishable (NLA-SAE wins → strengthens .178 ship claim;
           QAOD wins → motivates verifier #17 expansion).

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.qaod_vs_nla_head_to_head.v1"
        - experiment: 1740
        - run_date: ISO-8601 UTC
        - duration_s: > 120s (60 examples × 26B GGUF inference @ 150ms +
          QAOD/NLA forward passes + scoring)
        - random_seed: 172040 (NOT 1740 or 60)
        - reproducibility_checksum: sha256 of (corpus hash + NLA weights
          + QAOD implementation git_rev)
        - preconditions_checked: list
        - model_specs: {target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          n_test: 60, probes_compared: ["nla_sae_v3", "qaod_v1"],
          test_corpus_from: "exp1716"}
        - n_samples: 60
        - n_samples_justification: "Same 60-example corpus as exp1716
          for apples-to-apples comparison. Wilson 95% CI width ~0.20
          per probe; delta_tpr bootstrap CI ~0.28 — sufficient for 5pp
          gate detection at reasonable power."
        - nla_sae_tpr, nla_sae_fpr, nla_sae_tpr_wilson_95_ci
        - qaod_tpr, qaod_fpr, qaod_tpr_wilson_95_ci
        - delta_tpr_qaod_minus_nla, delta_tpr_bootstrap_ci_95
        - per_example_inference_latency_ms_p50: > 100 ms (real GGUF)
        - qaod_wins: bool (delta_tpr_qaod_minus_nla > 0.05 AND
          delta_tpr_lower_ci > 0)
        - acceptance_gate_passed: true (measurement task; honest report
          is the gate)
        - acceptance_gate_criteria: "Both probes evaluated; head-to-head
          reported with bootstrap CIs."
        - methodology_note: "Either outcome is a finding. If qaod_tpr=1.0
          on 30-example positive set, treat as IMPLAUSIBLE_PERFECT —
          test set too easy / label leak. Disclose honestly."
        - optimization_direction: "neither — comparison task"
        - honest_verdict: MUST start with `complete:` / `complete_` /
          `success:` / `success_` / `passed:` / `passed_` / `shipped:`
          / `shipped_` per CLAUDE.md Verdict Terminal-Prefix Discipline.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1741-phase4-genuine-scaling-alpha-t-prime
    title: "Exp 1741: Phase 4 GENUINE substrate scaling sweep with alpha_t' (n=8/16/32/64)"
    deliverable: results/experiment_1741_phase4_genuine_scaling.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1715-phase4-alpha-t-audit-retry-v3
        verdict: complete_bijection_invariance_artifact_confirmed
        addressed_by: "exp1715 (.176) falsified the original alpha_t. exp1721 (.178) derived alpha_t' replacement. This task runs the substrate-size scaling sweep that exp1678/1681/1693 attempted but couldn't answer (they were measuring a bijection-invariant quantity)."
        retire_if_same_verdict: false
      - experiment_id: exp1721-phase4-alpha-t-replacement-derivation
        verdict: complete_alpha_t_prime_monotonic_decay_4_cell_ablation
        addressed_by: "exp1721 (.178) confirmed alpha_t' on the random-verifier injection ablation at n=32. THIS task extends to the substrate-size axis — the original Phase 4 scaling question. Independent confirmation needed."
        retire_if_same_verdict: false
      - experiment_id: exp1725
        verdict: complete_theoretical_derivation_lm_ebm_bijection
        addressed_by: "exp1725 (.179) re-derived the LM-EBM bijection per arXiv:2512.15605 and noted exp1693 alpha_t invariance is a direct corollary. This task EMPIRICALLY tests whether alpha_t' (the max-caliber replacement) avoids the corollary."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: The Phase 4 substrate-size scaling question was attempted
      with the original alpha_t metric in exp1678 (.168 n=8), exp1681
      (.169 n=8/16/32), exp1693 (.171 n=64) — all producing the same
      ~0.15054 value with IMPLAUSIBLE_TIGHT_CI flags. exp1715 (.176)
      proved this was bijection-invariance, not measurement noise.
      exp1721 (.178) derived alpha_t' (max-caliber per arXiv:2605.12536)
      and confirmed monotonic decay on random-verifier injection. THIS
      task uses alpha_t' on the substrate-size axis to finally answer
      whether Phase 4 free-energy reduction genuinely scales with n.

      FALSIFIABLE HYPOTHESIS: delta_alpha_prime measured at n in
      {8, 16, 32, 64} produces statistically distinguishable values
      (overlap < 5% between at least 2 of 3 adjacent n bootstrap CIs).
      If overlap >= 5% on all 3 adjacent pairs, alpha_t' is ALSO
      scale-invariant — Phase 4 substrate-scaling becomes inaccessible
      from ensemble-level metrics. Either outcome is a finding.

      EXISTING CODE TO READ FIRST:
        - python/carnot/phase4/alpha_t_max_caliber.py (the alpha_t'
          implementation from exp1721)
        - results/experiment_1721_alpha_t_replacement.json (the .178
          confirmation on random-verifier ablation)
        - results/experiment_1715_phase4_alpha_t_audit.json (the
          original alpha_t ablation; sanity-check)

      TASK: 4-cell substrate-size sweep using alpha_t'.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "from carnot.phase4.alpha_t_max_caliber import
              alpha_t_prime"` succeeds — else
              `blocked_alpha_t_prime_implementation_missing`.
           b. exp1721 artifact readable — else
              `blocked_no_replacement_baseline`.
           Record preconditions_checked.
        1. For each n in {8, 16, 32, 64}: run 30 seeds × 100 MLD steps
           with k=6 verifier ensemble + k=1 baseline. Compute
           inf_t_alpha_k6_prime, inf_t_alpha_k1_prime per seed.
        2. Aggregate: delta_alpha_prime(n) = bootstrap mean over 30 seeds.
           Report bootstrap_ci_95 per n.
        3. Check overlap between adjacent n CIs (n=8 vs 16; 16 vs 32;
           32 vs 64). Record adjacent_pair_overlap_pct per pair.
        4. Acceptance: at least 2 of 3 adjacent pairs show overlap <5%.
           Both outcomes are findings; do NOT optimize toward (a).

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase4_alpha_t_prime_scaling.v1"
        - experiment: 1741
        - run_date: ISO-8601 UTC
        - duration_s: > 200s (4 n-points × 30 seeds × 100 MLD; real)
        - random_seed: 172041 (NOT 1741 or 64)
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {n_grid: [8, 16, 32, 64], ensemble_k_total: 6,
          ensemble_k_baseline: 1, mld_steps: 100, n_seeds: 30,
          alpha_t_variant: "max_caliber_v1"}
        - n_samples: 12000
        - n_samples_justification: "30 seeds per n-point gives CI width
          ~0.18/sqrt(30) ~ 0.03 — matches 5% overlap detection at 4
          n-points."
        - per_n_results: list of {n, inf_t_alpha_k6_prime,
          inf_t_alpha_k1_prime, delta_alpha_prime,
          delta_alpha_prime_bootstrap_ci_95}
        - adjacent_pair_overlap_pct: list of {pair, overlap_pct}
        - scale_invariance_detected: bool
        - statistically_distinguishable_pairs: int
        - acceptance_gate_passed: bool (statistically_distinguishable_pairs >= 2)
        - acceptance_gate_criteria: "At least 2 of 3 adjacent n-pairs
          show overlap <5%."
        - methodology_note: "If CI widths are sub-0.001 across all n,
          the new IMPLAUSIBLE_TIGHT_CI rule #8 will flag — disclose
          whether alpha_t' is also deterministic-by-construction."
        - optimization_direction: "neither — measurement task"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1742-ebt-gradient-refinement-retry
    title: "Exp 1742: EBT-style gradient refinement loop retry — .180 exp1736 doomed-rerun-blocked 3x"
    deliverable: results/experiment_1742_ebt_gradient_refinement.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1736-ebt-gradient-refinement
        verdict: doomed_rerun_blocked_3x_no_prior_failures_field
        addressed_by: "exp1736 (.180) was doomed-rerun-blocked 3x because the planner-drafted task lacked a prior_failures block; the conductor's ledger matched the scope against an earlier EBT-style task but couldn't distinguish. This retry includes explicit prior_failures with retire_if_same_verdict=true to break the loop."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: exp1736 (.180) was a planner-drafted EBT-style gradient
      refinement loop prototype that doomed-rerun-blocked 3x because it
      lacked a prior_failures field. The ledger flagged a scope match
      against a prior EBT-class task but couldn't proceed without an
      explicit addressed_by note. This retry breaks the loop with the
      prior_failures block above.

      FALSIFIABLE HYPOTHESIS: A minimal EBT-style gradient refinement
      loop (energy gradient descent over verifier ensemble output) on a
      n=16 Ising substrate converges to a local minimum within 100
      iterations with energy decrease of at least 20% from initial.
      If energy increases or stalls within 5% of initial, the gradient
      direction is inconsistent with the ensemble energy — the EBT
      hypothesis needs methodology revision.

      EXISTING CODE TO READ FIRST:
        - Search python/carnot/ for `gradient_refinement` or
          `ebt` or `energy_based` modules.
        - results/experiment_1721_alpha_t_replacement.json (max-caliber
          alpha_t' — the gradient-refinement loop should target this)

      TASK: Implement minimal EBT gradient refinement loop + run.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "import jax; import jax.numpy as jnp"` succeeds —
              else `blocked_jax_missing`.
           b. Energy function from the k=6 verifier ensemble locatable —
              else `blocked_verifier_ensemble_energy_missing`.
           Record preconditions_checked.
        1. Implement gradient_refinement_loop(initial_state, energy_fn,
           n_iters=100, lr=0.01) using jax.grad on energy_fn.
        2. Run on a fresh n=16 Ising state initialized uniformly.
        3. Record energy at each iteration. Compute
           energy_decrease_pct = (E_init - E_final) / abs(E_init).
        4. Acceptance: energy_decrease_pct >= 0.20 (gradient is
           informative). If energy increases or stalls within 5%,
           record SIGN_ANOMALY honestly.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.ebt_gradient_refinement.v1"
        - experiment: 1742
        - run_date: ISO-8601 UTC
        - duration_s: > 30s (100 iters × jax forward + grad)
        - random_seed: 172042 (NOT 1742 or 16)
        - reproducibility_checksum: sha256 of (energy_fn git_rev +
          n_spins + initial_state seed + lr)
        - preconditions_checked: list
        - model_specs: {n_spins: 16, n_iters: 100, lr: 0.01,
          energy_source: "k=6_verifier_ensemble"}
        - n_samples: 30 (30 random seeds for stability)
        - n_samples_justification: "30 seeds gives Wilson CI on
          convergence rate; <30 too noisy on this stochastic loop."
        - initial_energy_mean, final_energy_mean (over 30 seeds)
        - energy_decrease_pct_mean, energy_decrease_pct_ci_95
        - convergence_rate: int (count of 30 seeds reaching the gate)
        - acceptance_gate_passed: bool (energy_decrease_pct_mean >= 0.20)
        - acceptance_gate_criteria: "Mean energy decrease >= 20% across
          30 seeds; gradient is informative."
        - methodology_note: "If energy increases, this is SIGN_ANOMALY —
          gradient pointing wrong direction. Disclose honestly. If
          mean decrease is 100% (energy → 0), check for trivial
          collapse — adversarial-verify IMPLAUSIBLE_PERFECT flag."
        - optimization_direction: "minimize_energy"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

