  - id: exp4456-generic-glyph-rewrite-operator
    milestone: 2026.06.412
    title: "PHASE A2 (ARC NORTH STAR) -- GENERIC glyph-rewrite-rule verifier operator: generalize tr87's hand glyph_rewrite_matcher into a composable operator so tr87 re-solves WITHOUT its own adapter. Closes GAP-4432-LOO-TR87 (raises generic_loo_solve_count); reproduction-gated."
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-19 operator direction (ARC submission sprint): convert the .411 LOO residual GAP-4432-LOO-TR87 into a composable generic operator so the live solver solves unseen config-substitution games. Versioned continuation of the .411 generic-operator line (config_rule_verifier exp4444, object_motion_world_model exp4445) with a STATED forward difference: a GENERIC glyph_rewrite_rule_verifier operator (SOAR-style self-improving rule synthesis, arXiv:2507.14172) in arc_solver_kit -- NOT tr87's single-game hand adapter -- tested by re-solving tr87 WITHOUT its own recipe. False-positive scope-match vs tr87's prior hand solve, which is a SUCCESS being generalized, not a doomed rerun."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4456_generic_glyph_rewrite_operator.json
    prompt: |
      CONTEXT: The .411 LOO benchmark v2 (exp4448) found tr87 does NOT re-solve from the other games' recipes
      -- residual delta "missing_glyph_rewrite_rule_verifier_without_tr87_adapter" (GAP-4432-LOO-TR87). tr87
      (the deepest single-game solve, 6 levels, 5 distinct config-substitution mechanics) currently re-solves
      ONLY via its hand GameAdapter _tr87. The win is a REWRITE-rule match: the editable glyph sequence must
      equal the greedy multi-glyph-LHS->RHS rewrite of the target through the visible reference grid (with
      double_translation / alter_rules variants at deeper levels). The consolidated glyph_rewrite_matcher
      primitive (general_gotchas) exists but is NOT a generic operator that handles a new config-substitution
      game.
      EXISTING CODE TO READ FIRST: python/carnot/agentic/arc_game_adapters.py (the _tr87 adapter + verifier),
      python/carnot/agentic/arc_solver_kit.py (the consolidated glyph_rewrite_matcher primitive + the .411
      config_rule_verifier / object_motion_world_model operators -- mirror their generic-operator shape),
      results/arc_loop_solve_tr87.json, ops/arc_solve_registry.yaml (tr87 entry + general_gotchas
      primitive_glyph_rewrite_matcher), ops/verifier_gaps.md (GAP-4432-LOO-TR87), research-references.md
      (.412 sweep: SOAR self-improving evolutionary program synthesis 2507.14172; neurally-guided induction
      2411.17708).
      TASK: build a GENERIC, composable `glyph_rewrite_rule_verifier` operator in arc_solver_kit that, given a
      game's object-centric digest + the corpus of grounded config-substitution win-rules as few-shot examples,
      INDUCES (propose-then-ground, verifier_is_oracle=true; SOAR-style self-improving rule synthesis with a
      counterexample-guided refine on rejection) the greedy multi-glyph-LHS->RHS rewrite predicate (including
      the N-pass / alter_rules variants), GROUNDS it, and drives the OfflineSolver. PROVE it generically by
      re-solving tr87 (>=L1, ideally deeper) WITHOUT tr87's own hand recipe -- closing the LOO residual.
      ADDITIVE + backward-compatible (tr87's existing reproduced L6 + all other solves must still reproduce).
      This counts NO new levels (re-solves a known game); it RAISES generic capability.
      CONCRETE STEPS:
        0. PRECONDITIONS (on any miss honest_verdict blocked_<resource>, STOP, no fabrication): `ls
           environment_files/tr87/` non-empty; the live generator GGUF cached OR iGPU llama-server (NEVER
           3090s); `.venv/bin/pytest -k "arc_solver_kit or glyph or tr87"` GREEN baseline.
        1. Generalize glyph_rewrite_matcher -> a `glyph_rewrite_rule_verifier` operator (few-shot from the
           grounded config-substitution win-rules; induce + ground the rewrite predicate; counterexample-guided
           re-induce on rejection; reject non-grounding).
        2. Re-solve tr87 via the GENERIC operator (NOT tr87's hand recipe) -> arc_solver_kit.reproduce.
        3. EMIT inference_substrate matching what step 1 did (live_llm_inference if induction ran live >60s,
