  - id: exp2612
    milestone: "2026.05.250"
    deliverable: "results/experiment_2612_tier0z_semantic_energy.json"
    title: "Tier 0z Semantic Energy Verifier (arXiv:2508.14496 Boltzmann Logit-Space Energy)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: new_verifier

    prior_failures:
      - experiment_id: exp103-early-kan-energy-tier
        verdict: "complete: early KAN energy tier experiment"
        addressed_by: "exp103 implemented a KAN-based energy tier (early milestone). This implements Tier 0z — a training-FREE Boltzmann energy from semantic clustering of logit predictions. No KAN, no training, different architecture and theoretical motivation (arXiv:2508.14496)."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      New paper: "Semantic Energy: Detecting LLM Hallucination Beyond Entropy" (arXiv:2508.14496).
      Key finding: Boltzmann-inspired energy distribution over SEMANTIC CLUSTERS of token predictions
      is more discriminative than raw entropy for hallucination detection. The energy is:
        E = -log Z  where Z = sum(exp(-beta * distance_to_centroid_i) * cluster_mass_i)
      Intuitively: correct outputs concentrate probability mass in ONE semantic cluster (low energy);
      hallucinations spread mass across MULTIPLE clusters (high energy).

      CRITICAL PROPERTY: No training required — computed purely from TF-IDF similarity structure
      of the claim text. This avoids the synthetic-to-real distribution collapse that broke
      tier0s (0.3758) and tier0u (0.5360). Per arXiv:2603.03538 (Littlestone dimension criterion),
      simple consistent no-training verifiers outperform complex trained ones OOD.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (base_verifier.py for interface)
      - results/experiment_2609_sklearn_prereq_fix.json (foVer_corpus_path)

      TASK: Implement Tier 0z and evaluate on FoVer real corpus.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         b. FoVer corpus discoverable (use foVer_corpus_path from exp2609 or fallback paths).
         If precondition fails: write honest_verdict blocked_<resource> and exit.
         Note: sklearn NOT required for this task (training-free verifier).

      1. Implement python/carnot/verify/tier0z_semantic_energy.py:

         import math
         from collections import Counter

         class Tier0zSemanticEnergyVerifier:
           """Boltzmann-inspired energy from semantic clustering of token predictions.
           Low energy = claim concentrates on one semantic cluster = likely correct.
           High energy = claim spreads across multiple semantic clusters = likely hallucination.
           No training required. Per arXiv:2508.14496."""

           def __init__(self, beta: float = 1.0, n_clusters: int = 5):
             self.beta = beta
             self.n_clusters = n_clusters

           def _tokenize(self, text: str) -> list:
             return text.lower().split()

           def _bigrams(self, tokens: list) -> list:
             return list(zip(tokens[:-1], tokens[1:])) if len(tokens) > 1 else []

           def _cluster_mass(self, tokens: list) -> list:
             """Approximate semantic clustering via bigram frequency bands."""
             if len(tokens) < 2:
               return [1.0]
             freq = Counter(self._bigrams(tokens))
             total = max(sum(freq.values()), 1)
             sorted_freqs = sorted(freq.values(), reverse=True)
             # Split into n_clusters roughly equal bands
             n = self.n_clusters
             band_size = max(1, len(sorted_freqs) // n)
             clusters = [sum(sorted_freqs[i*band_size:(i+1)*band_size]) / total
                         for i in range(n)]
             # Pad remaining
             if len(clusters) < n:
               clusters += [0.0] * (n - len(clusters))
             return clusters[:n]

           def score(self, context: str, claim: str) -> float:
             """Return energy in [0, 1]. Higher = more likely hallucination."""
             tokens_c = self._tokenize(claim)
             tokens_x = self._tokenize(context)
             if len(tokens_c) < 2:
               return 0.5
             # Cluster mass of claim
             masses = self._cluster_mass(tokens_c)
             # Context overlap as prior: Jaccard similarity biases toward 0 energy if high overlap
             context_set = set(tokens_x)
             claim_set = set(tokens_c)
             jaccard = len(context_set & claim_set) / max(len(context_set | claim_set), 1)
             # Boltzmann partition function: Z = sum(exp(-beta * rank_i) * mass_i)
             Z = sum(math.exp(-self.beta * i) * m for i, m in enumerate(masses))
             # Energy E = -log Z, normalized to [0, 1] via sigmoid
             if Z <= 0:
               return 0.5
             E = -math.log(Z)
             # Higher context overlap -> lower energy (claim uses context concepts)
             E = E * (1.0 - 0.5 * jaccard)
             # Sigmoid to [0, 1]
             return 1.0 / (1.0 + math.exp(-E))

      2. Load FoVer real corpus (from foVer_corpus_path or fallback).
         Split 80/20 test (random_state=42). Evaluate:
           For each (context, claim, label) in test split:
             score = verifier.score(context, claim)
             hallucination label = 1 (positive class)
         Compute AUROC, AUPRC, F1 (threshold=0.5).

      3. Compare to tier0s baseline (0.3758) and tier0u baseline (0.5360) from exp2596/exp2597.
         tier0z_viable = tier0z_auroc > 0.55.

      4. If tier0z_viable: also evaluate soundness (precision@0.5) and completeness (recall@0.5).

      5. Write results/experiment_2612_tier0z_semantic_energy.json with required fields.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required for conductor reconciler."
      - tier0z_auroc: float — primary metric on real FoVer corpus
        principle: "Real-corpus AUROC (not synthetic) is the only credible measure for OOD robustness."
      - tier0z_viable: bool — True iff tier0z_auroc > 0.55
        principle: "Gate field: verifier must exceed random baseline (0.5) by margin before ensemble inclusion."
