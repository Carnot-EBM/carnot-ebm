    6. Reuse the qualified Exp7926 private scratch and board-custody callables. Authenticate its primary and terminal receipt hashes. Add operation-by-operation workload mapping to KV260, PolarFire and GateMate; frozen neural source heads are not automatically quadratic Ising workloads. Preserve original failure history. Run existing board-reader tests, E2E-016 and private CLI/replay validation without touching any board.
