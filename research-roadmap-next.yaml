tasks:
  - id: exp377-fix-retro015-gpu-session-startup
    milestone: "2026.06.03"
    deliverable: results/experiment_377_gpu_session_fix.json
    title: "Exp 377: Fix RETRO-015 — session_startup.sh auto-sources GPU env, LiveGPUGate"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: RETRO-015 is the highest-priority item in Carnot history — FOUR consecutive
      milestones (2026.05.06, 2026.05.13, 2026.05.20, 2026.05.27) produced zero live GPU
      results because CARNOT_FORCE_LIVE=1 was never exported into conductor subprocess
      environments. The hardware has been confirmed ready since Exp 352 (is_live_capable=True).
      Exp 365 created scripts/conductor_gpu_env.sh with "export CARNOT_FORCE_LIVE=1" but never
      wired it into the conductor launch sequence.

      The fix strategy:
      1. Create scripts/session_startup.sh — sourced at conductor session start. This script:
         - Sources scripts/conductor_gpu_env.sh (which exports CARNOT_FORCE_LIVE=1)
         - Exports CARNOT_FORCE_LIVE=1 directly as a belt-and-suspenders measure
         - Prints a human-readable confirmation line: "[session_startup] CARNOT_FORCE_LIVE=1 exported"
      2. Implement LiveGPUGate in python/carnot/pipeline/live_gpu_gate.py — a hard gate that
         ALL GPU experiments call at their start. If CARNOT_FORCE_LIVE != "1" or GPU is not
         confirmed live, it raises RuntimeError immediately. This makes failures loud and fast.
      3. Implement a subprocess propagation test: spawn a subprocess, verify the env var inherits.
         This is the PROOF that the fix actually works, not just that the script exists.

      EXISTING CODE TO READ FIRST:
      - scripts/conductor_gpu_env.sh — the env script from Exp 365
      - python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu() (Exp 352)
      - python/carnot/pipeline/smoke_test.py — SmokeTestResult (Exp 353)
      - scripts/experiment_template.py — ExperimentTemplate patterns
      - results/experiment_365_retro_close.json — RETRO-012 close status

      TASK: Fix RETRO-015 by creating session_startup.sh and LiveGPUGate.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-INFRA-017 (session startup must export CARNOT_FORCE_LIVE=1 before GPU experiments),
         REQ-INFRA-018 (LiveGPUGate must be called at start of any GPU experiment),
         SCENARIO-INFRA-019/020/021 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - LiveGPUGate: check_env_var() → bool; check_gpu_live() → bool;
           require_live(model_ids=[]) → None (raises RuntimeError if either check fails)
         - LiveGPUGate.require_live_or_blocked(tmpl, model_ids) → dict | None:
           returns blocked artifact dict if not live (for experiments that prefer blocked to raising)
         - verify_subprocess_env_propagation(env_var="CARNOT_FORCE_LIVE") → bool:
           spawns subprocess with current env, checks var is present
         - build_session_startup_script(project_root) → str: returns the shell script content
         - check_session_startup_exists(project_root) → bool
      4. Implement scripts/session_startup.sh:
         #!/usr/bin/env bash
         # Source this at the start of a conductor session to propagate GPU env variables.
         # RETRO-015 fix: ensures CARNOT_FORCE_LIVE=1 is inherited by all subprocesses.
         set -euo pipefail
         SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
         if [ -f "$SCRIPT_DIR/conductor_gpu_env.sh" ]; then
           source "$SCRIPT_DIR/conductor_gpu_env.sh"
         fi
         export CARNOT_FORCE_LIVE=1
         echo "[session_startup] CARNOT_FORCE_LIVE=1 exported at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      5. Implement python/carnot/pipeline/live_gpu_gate.py:
         - LiveGPUGate dataclass or class (stateless — all methods are static/class methods)
         - check_env_var() → bool: returns True iff os.environ.get("CARNOT_FORCE_LIVE") == "1"
         - check_gpu_live() → bool: calls diagnose_live_gpu() from Exp 352; returns is_live_capable
         - require_live(model_ids=[]) → None: calls check_env_var() + check_gpu_live(); raises
           RuntimeError("LiveGPUGate: CARNOT_FORCE_LIVE not set — source scripts/session_startup.sh")
           if env var missing; RuntimeError("LiveGPUGate: GPU not live — is_live_capable=False") if GPU
           not ready. model_ids optionally used by check_gpu_live for model-loadability check.
         - require_live_or_blocked(tmpl, model_ids) → dict | None: calls require_live();
           on RuntimeError, returns tmpl.build_result({}, status="blocked",
           blocked_reason=str(e)) so the caller can write the artifact and exit cleanly.
         - verify_subprocess_env_propagation(env_var="CARNOT_FORCE_LIVE") → bool:
           runs subprocess.run(["python3", "-c", f"import os; print(os.environ.get('{env_var}', ''))"],
           env=os.environ, capture_output=True, text=True); returns "1" in result.stdout
      6. Export LiveGPUGate from carnot.pipeline.__init__.
      7. Write scripts/experiment_377_gpu_session_fix.py using ExperimentTemplate(377):
         a. CPU-only experiment. No GPU needed (testing env propagation, not inference).
         b. Read scripts/conductor_gpu_env.sh — verify CARNOT_FORCE_LIVE=1 present.
         c. Read scripts/session_startup.sh — verify it sources conductor_gpu_env.sh.
         d. Call LiveGPUGate.check_env_var() — records whether var is currently set.
         e. Call LiveGPUGate.verify_subprocess_env_propagation() — subprocess inherits env.
         f. Call diagnose_live_gpu() — records is_live_capable (hardware state, not this fix).
         g. Record: env_var_set, subprocess_inherits_env, session_startup_exists,
            conductor_gpu_env_exists, is_live_capable, retro_015_infrastructure_fixed.
         h. retro_015_infrastructure_fixed = env_var_set AND subprocess_inherits_env
            AND session_startup_exists AND conductor_gpu_env_exists
            (Note: is_live_capable may be False in CI — that is not a failure of this fix)
         i. Build artifact: schema="carnot.gpu_session_fix.v1", all fields above, honest_verdict:
            "infrastructure_fixed" when retro_015_infrastructure_fixed=True;
            "env_propagation_failed" when subprocess_inherits_env=False;
            "scripts_missing" when session_startup_exists=False or conductor_gpu_env_exists=False
         j. Output: results/experiment_377_gpu_session_fix.json
      8. Write tests/python/test_experiment_377_gpu_session_fix.py (100% coverage required).
      9. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      10. Reconcile: update ops/conductor-log.md with RETRO-015 status,
          ops/changelog.md, ops/status.md. Mark RETRO-015 CLOSED if infrastructure_fixed=True.
      Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp378-cikan-reimplementation
    milestone: "2026.06.03"
    deliverable: python/carnot/models/cikan_energy.py
    title: "Exp 378: Fix RETRO-018 — CIKANEnergy proper Python implementation"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: RETRO-018 — Exp 375 created python/carnot/models/cikan_energy.py but it contains
      JSON artifact data, not Python code. The file must be completely replaced with a proper
      Python implementation of the CIKAN (Constraint-Informed KAN) energy tier.

      arXiv 2412.03710 (CIKAN): Extends KAN with hard constraint priors baked into spline
      activations. Instead of learning arbitrary spline shapes, CIKAN seeds each edge's spline
      with known constraint boundaries — regions that violate constraints have infinite energy.

      arXiv 2602.07518 (Physical Analog KAN): Shows that KAN spline activations can be
      implemented in silicon using Reconfigurable Nonlinear-Processing Units (RNPUs). Each
      ConstraintBoundary maps to one RNPU saturation voltage: crossing the boundary drives output
      to saturation (effectively infinite energy). System-level result: ~250 pJ/inference,
      ~600 ns latency — 10^2-10^3x cheaper than GPU MLP.

      WHY THIS MATTERS: CIKAN is the first Carnot energy tier with a documented path from
      Python → FPGA LUT saturation points → aKAN silicon RNPU. This is the Phase 2 hardware
      path and the Tier 4 adaptive structure mechanism.

      EXISTING CODE TO READ FIRST:
      - python/carnot/models/kan.py — KANEnergy, KANSpline, KANLayer (existing KAN tier)
      - python/carnot/verify/energy.py — ConstraintTerm protocol, ComposedEnergy
      - python/carnot/models/__init__.py — model exports
      - tests/python/test_kan.py — KAN test patterns to follow
      - python/carnot/models/cikan_energy.py — CURRENT FILE (contains JSON, must be rewritten)

      TASK: Re-implement CIKANEnergy as a constrained KAN subclass.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-ENERGY-010 (CIKAN energy tier with constraint-seeded splines),
         REQ-ENERGY-011 (constraint boundaries produce infinite energy barrier at boundary crossing),
         REQ-ENERGY-012 (CIKANEnergy.energy() is always non-negative),
         SCENARIO-ENERGY-015/016/017 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - ConstraintBoundary: dataclass (variable_idx: int, boundary_value: float,
           boundary_type: Literal["lower_bound", "upper_bound", "equality"])
         - seed_spline_from_constraint(spline: KANSpline, boundary: ConstraintBoundary) → KANSpline:
           places a knot at boundary_value; energy approaches +inf as activation crosses boundary
           (saturation behavior); returns modified spline with same interface
         - CIKANEnergy(n_vars: int, n_hidden: int, constraint_boundaries: list[ConstraintBoundary])
         - CIKANEnergy inherits KANEnergy OR wraps it (pick the approach with less coupling)
         - CIKANEnergy.energy(x) → float: always >= 0 (test: energy on 1000 random configs >= 0)
         - CIKANEnergy.from_constraints(constraints: list[ConstraintTerm]) → CIKANEnergy:
           classmethod that extracts variable indices and boundary values from arithmetic constraints
         - CIKANEnergy._boundary_penalty(x: jnp.ndarray) → float: returns sum of penalties for
           each boundary crossing: penalty = (crossing_amount)^2 * 1e6 (large but finite)
         - CIKANEnergy.energy_separation_ratio(satisfying, violating) → float:
           mean_energy(violating) / max(mean_energy(satisfying), 1e-6)
         - CIKANEnergy.save(path) / load(path) via safetensors
         - HARDWARE DOCSTRING: Each ConstraintBoundary maps to one RNPU saturation voltage in
           Physical Analog KAN silicon (arXiv 2602.07518). FPGA compilation: each boundary
           becomes a LUT saturation point. Hardware cannot output configurations crossing boundaries.
      4. Implement python/carnot/models/cikan_energy.py (complete rewrite):
         - ConstraintBoundary dataclass with validation
         - seed_spline_from_constraint — modifies KANSpline knot placement
         - CIKANEnergy class with energy(), from_constraints(), _boundary_penalty(), save(), load()
         - energy_separation_ratio() convenience method
         - Verbose docstrings explaining WHY (not just what)
         - Do NOT preserve any of the existing JSON content
      5. Export CIKANEnergy, ConstraintBoundary from carnot.models.__init__.
      6. Write scripts/experiment_378_cikan_energy.py using ExperimentTemplate(378):
         a. Create arithmetic constraint: x0 + x1 = x2 (carry-check style, boundary at exact sum)
         b. Instantiate CIKANEnergy.from_constraints([arithmetic_constraint])
         c. Sample 100 satisfying configs (x0+x1 == x2) and 100 violating (x0+x1 != x2)
         d. Compute mean_energy_satisfying, mean_energy_violating, energy_separation_ratio
         e. Instantiate standard KANEnergy with same n_vars, n_hidden, compare separation ratio
         f. cikan_vs_kan_ratio = cikan_separation / max(kan_separation, 1e-6)
         g. Build artifact: schema="carnot.cikan_energy.v1",
            n_satisfying=100, n_violating=100, mean_energy_satisfying, mean_energy_violating,
            energy_separation_ratio, cikan_vs_kan_ratio, n_constraint_boundaries_used,
            hardware_path_note="Each ConstraintBoundary → 1 RNPU saturation point (arXiv 2602.07518)"
         h. honest_verdict="structural_prevention" when separation_ratio > 5.0;
            "partial_separation" when 1.0 < ratio <= 5.0; "no_separation" when ratio <= 1.0
         i. Output: results/experiment_378_cikan_energy.json
      7. Write tests/python/test_cikan_energy.py (100% coverage required).
      8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      9. Reconcile: update ops/conductor-log.md with CIKAN status (RETRO-018 CLOSED),
         ops/changelog.md, ops/status.md, _bmad/architecture.md (CIKANEnergy in model tiers).
      Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp379-precision-pipeline-live-execute
    milestone: "2026.06.03"
