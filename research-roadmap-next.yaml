      - verifier_claim_status: str (principle: verifier evidence must be bounded to artifacts)
      - repair_claim_status: str (principle: repair promotion must remain evidence-gated)
      - fr11_self_learning_status: str (principle: continuous self-learning must be summarized)
      - ebt_arm_status: str (principle: energy sidecars must not imply integration)
      - kan_status: str (principle: KAN verifier status must be bounded)
      - sampler_hardware_status: str (principle: hardware/sampler claims must remain authenticated)
