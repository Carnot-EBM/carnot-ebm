    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures: []
    prompt: |
      CONTEXT: exp1715 (.176) ran the 4-cell random-verifier-injection
      ablation and confirmed `complete: Bijection-invariance artifact
      confirmed; delta_alpha does not genuinely [depend on n]`. This
      MAJOR finding falsifies four prior Phase 4 scaling claims: exp1678
      (.168 baseline), exp1681 (.169 n=8/16/32 sweep), exp1693 (.171
      n=64), and the implicit reading of exp1715 itself as "Phase 4
      scales." All three were detecting bijection invariance per
      arXiv:2512.15605, not genuine free-energy reduction.

      FALSIFIABLE HYPOTHESIS: The exp1715 finding can be codified into
      (a) a paper-v6 §3 corrigendum block on the Phase 4 framing,
      (b) a research-references.md entry tying the bijection paper
      (arXiv:2512.15605) to the exp1715 falsification, and (c) an
      ops/known-issues.md MANDATORY entry warning future planners NOT
      to propose Phase 4 "scaling" experiments without first verifying
      the alpha_t computation has a non-bijection-invariant derivation.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1715_phase4_alpha_t_audit.json (the falsification)
        - results/experiment_1693_phase4_n64.json (the n=64 measurement
          flagged IMPLAUSIBLE_TIGHT_CI per rule #8)
        - results/experiment_1681_phase4_scaling.json (the n=8/16/32 sweep)
        - results/experiment_1678_phase4_baseline.json (n=8 baseline)
        - arXiv:2512.15605 (the bijection paper; reference only)
        - openspec/papers/paper-v6/ (paper §3 substrate framing location)
        - research-references.md
        - ops/known-issues.md

      TASK: Codification across three documents.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md Pre-Launch Preconditions Discipline):
           a. `test -f results/experiment_1715_phase4_alpha_t_audit.json`
              succeeds — else `blocked_exp1715_artifact_missing`.
           b. paper-v6 §3 locatable — else
              `blocked_paperv6_section3_not_locatable`.
           Record preconditions_checked.
        1. Read exp1715 end-to-end. Extract verbatim:
             - random_fraction_grid_results (all 4 cells)
             - monotonic_decay_observed (false)
             - artifact_detected (true)
             - bootstrap CIs per cell
        2. Draft a 3-paragraph paper-v6 §3 corrigendum:
             - Paragraph A: state the bijection-invariance finding
               (alpha_t metric is bijection-invariant under AR-LM↔EBM
               bijection per arXiv:2512.15605; verified empirically
               via exp1715 random-verifier-injection ablation).
             - Paragraph B: list the four affected prior experiments
               (exp1678, exp1681, exp1693, original reading of exp1715)
               with explicit acknowledgment that "Phase 4 scales" was a
               measurement artifact, NOT a falsified hypothesis (the
               hypothesis itself remains testable; just not with the
               current alpha_t computation).
             - Paragraph C: replacement-path forward. Cite arXiv:2605.12536
               (IIT↔FEP maximum-caliber bridge) as the candidate
               alternative variational principle that may yield a
               non-bijection-invariant alpha_t. Future work.
           NO emojis per CLAUDE.md.
        3. Add an entry to research-references.md citing both papers
           + the exp1715 falsification result.
        4. Add a NEW MANDATORY-NEXT-MILESTONE entry to ops/known-issues.md
           titled "Phase 4 alpha_t Bijection-Invariance Artifact Confirmed
           (.178+ MANDATORY: do not propose Phase 4 substrate-scaling
