    title: "PHASE E3 (HARDWARE CONTINUITY; KV260 opportunistic per north-star §3) -- KV260 SSH-reachability + loaded-bitstream continuity check. Per north-star §3, KV260 is THE sovereignty story (drive to terminal, then freeze); GateMate/PolarFire are opportunistic-only. SSH-reachability precondition ONLY (NEVER a host SD-card precondition per KV260 SSH-Not-SD-Card Discipline). If the board is reachable, record the loaded overlay (xmutil listapps) + a lightweight liveness check (the carnot_ising bitstream UIO device present); if it is the terminal board-latency transcript, capture it. If unreachable -> honest_verdict blocked_kv260_ssh_unreachable (a clean documented skip, NOT a fabrication). This keeps the board visible in the milestone retro without burning a deep task slot. NO host SD-card-device precondition (the retired mechanism). NO TRM training."
    priority: low
    track: hardware
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-18 Hardware-Task Continuity Discipline + 2026-05-29 standing auto-override class 2 (active hardware-continuity task, KV260 not yet terminal): false-positive scope-match vs prior KV260 continuity tasks (exp4367); required forward hardware work until the board reaches its terminal state (north-star §3)."
    inference_substrate: hardware_smoke
    deliverable: results/experiment_4378_hardware_continuity_kv260.json
    prompt: |
      CONTEXT: Hardware-Task Continuity Discipline (>=1 KV260 task/milestone until terminal) + north-star §3 (KV260 is THE
      sovereignty story, opportunistic for the others). This is a LIGHTWEIGHT SSH-reachability + loaded-bitstream
      continuity check, NOT a deep hardware build. KV260 SSH-Not-SD-Card Discipline: the precondition is SSH-reachability,
      NEVER host SD-card presence.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4367_hardware_continuity_kv260.json (the prior KV260 continuity artifact -- the reachability + overlay pattern)
        - ops/north-star.md §3 (KV260 = THE sovereignty story; the terminal state = board-latency transcript + kv260_synthesis_succeeded)
        - CLAUDE.md "KV260 SSH-Not-SD-Card Discipline" (the SSH precondition; NEVER a host SD-card device path), "Pre-Launch Preconditions Discipline" (the KV260 row), "Hardware-Task Continuity Discipline"
        - ops/hardware-bringup-prep.md (the current board state)

      TASK: KV260 SSH-reachability + loaded-bitstream continuity check (opportunistic; clean documented skip if unreachable).

      CONCRETE STEPS:
        0. PRECONDITIONS (SSH, NEVER host SD card): `ssh -o ConnectTimeout=5 -o BatchMode=yes kria 'true'` returns 0. If non-zero -> honest_verdict `blocked_kv260_ssh_unreachable` + preconditions_checked populated, and STOP (a clean documented skip, NOT a fabrication). DO NOT probe the host SD-card device path (the retired wrong-mechanism precondition).
        1. If reachable: record the loaded overlay (`ssh kria 'xmutil listapps'`) + the carnot_ising UIO device presence (`ssh kria 'ls /dev/uio*'`). If this is the terminal board-latency transcript step, capture the latency transcript (a real on-board measurement, not fabricated).
        2. Record kv260_reachable + the loaded overlay + whether terminal state is reached. Declare preconditions_checked.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed (success_kv260_continuity_<state> or blocked_kv260_ssh_unreachable). A reachable continuity check and a clean unreachable skip are BOTH honest terminal states."
        kv260_reachable:
          principle: "BARE bool: SSH reachability -- the only valid KV260 precondition (NEVER host SD-card presence)."
        loaded_overlay:
          principle: "The xmutil listapps result -- records whether the carnot_ising bitstream is loaded (board continuity)."
        kv260_terminal_state_reached:
          principle: "BARE bool: true iff the board-latency transcript + kv260_synthesis_succeeded terminal state is met (north-star §3) -- after which the per-milestone KV260 mandate lifts."
        preconditions_checked:
          principle: "Records the SSH-reachability check (NOT host SD card); pre-empts the wrong-mechanism SD-card confusion + the silent-missing-resource fabrication mode."
      ACCEPTANCE GATE:
        - condition: "kv260_reachable + loaded_overlay (if reachable) + kv260_terminal_state_reached reported with preconditions_checked, OR an honest blocked_kv260_ssh_unreachable verdict"
          principle: "Hardware-Task Continuity keeps KV260 (the sovereignty story) visible each milestone via a lightweight SSH check; a clean unreachable skip is honest, NOT a fabrication, and NEVER a host SD-card escalation."

      Run: `python3 {project_root}/results/experiment_4378_hardware_continuity_kv260.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4379-capstone-v404
    milestone: 2026.06.404
    title: "PHASE E4 (CAPSTONE .404) -- the milestone scorecard + the HEADLINE DECISION. Headline questions: (1) did the STRONGER learned-heuristic class (LLM-generated Python action-cost heuristics, exp4370) DEEPEN the oracle-distinct EFFICIENCY moat -- beat the deployed linear heuristic on held-out actions, leakage-clean + reproduction-gated (exp4370 llm_heuristic_beats_linear) + contamination-free (exp4371 win_is_contamination_free)? -> the efficiency moat graduates from 'linear' to 'stronger-function-class', or a clean null settles the function class. (2) ARC north star: the new reproducible_total_levels (>=33?) across exp4372 (deeper high-headroom) + exp4373 (ar25/ka59/ft09 L2); how many NEW levels/games. (3) DiffusionGemma in-generation moat: did the scorer-repair + CoDiLA scorer-independent control CONVERT the moat (exp4374 s3_guided_beats_control), produce a clean null, or RETIRE the direction (4th block)? (4) oracle-distinct ACCURACY frontier: did the verifier-as-detector beat chance where selection headroom is ~0 (exp4375 detector_beats_chance)? Aggregate (SKIP any flagged_adversarial artifact; HONOR verifier_is_oracle -- a circular/execution-grounded win is NOT a moat). Emit verifier_thesis_state (one honest string) + efficiency_moat_state (one of: deepened_stronger_class / linear_is_settled / open) + s3_moat_utility (one of: useful_generation_gain / proven_but_not_useful / retired / open) + reproducible_total_levels + detector_beats_chance. Compute the G1-G4 publication gate via publication_gate.py. Use the robust aggregate-available-report-gaps helper (NO hard-block-all-False). CARRY verifier_is_oracle correctly (the durable exp4355 stamp fix) so this capstone does NOT trip CIRCULAR_MOAT_OVERCLAIM. NO gated_on."
    priority: critical
    track: capstone
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 1 (routine milestone-capstone task): capstone-vN -- false-positive scope-match vs all prior capstone-v* tasks (exp4368); structurally a per-milestone aggregation, never a doomed rerun. 2026-06-12 quota-conserve: capstone on codex."
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4379_capstone_v404.json
    prompt: |
      CONTEXT: close .404. The headline question is whether the EFFICIENCY moat DEEPENED -- did a STRONGER learned-heuristic
      class (LLM-generated Python heuristics, exp4370) beat the deployed linear cost on held-out actions, leakage-clean +
      reproduction-gated + contamination-free (exp4371)? Plus the ARC north-star reproducible-total (exp4372/4373), the
      DiffusionGemma repair-or-retire decision (exp4374), and the oracle-distinct detector reading (exp4375). SKIP flagged
      artifacts; HONOR verifier_is_oracle; carry verifier_is_oracle correctly (the durable exp4355 stamp fix) so THIS
      capstone is not flagged.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4370_llm_generated_action_cost_heuristics.json (llm_heuristic_beats_linear + the held-out actions) + results/experiment_4371_llm_heuristic_contamination_skeptic_proof.json (win_is_contamination_free -- the headline validation)
        - results/experiment_4372_*.json + results/experiment_4373_*.json (the ARC E3 outcomes) + ops/arc_solve_registry.yaml (reproducible_total_levels -- authoritative)
        - results/experiment_4374_diffusiongemma_scorer_repair_or_retire.json (s3_guided_beats_control + scorer_requalified_leak_clean + codila_control_differentiates -- the convert/null/retire decision)
        - results/experiment_4375_verifier_as_detector_measurement.json (detector_auroc + detector_beats_chance + selection_headroom)
        - results/experiment_4368_capstone_v403.json (the .403 capstone template + the robust aggregate-available helper + the durable verifier_is_oracle stamp fix)
        - scripts/publication_gate.py (G1-G4), scripts/adversarial_verify.py, scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification + Sample-Size Rigor", "Reading-Results Discipline"

      TASK: aggregate the .404 outcomes into the capstone scorecard + the headline decision; compute G1-G4; carry verifier_is_oracle correctly.

      CONCRETE STEPS:
        0. PRECONDITIONS: the upstream .404 artifacts are present (read what exists; report missing as per-axis gaps, do NOT hard-block-all-False). If publication_gate.py is unrunnable -> honest_verdict `blocked_publication_gate_unrunnable` and STOP.
        1. Read each upstream artifact via scripts/summarize_artifact.py (Reading-Results Discipline). SKIP any flagged_adversarial artifact (never aggregate a flagged number). HONOR verifier_is_oracle (a circular/execution-grounded win is NOT a moat headline).
        2. HEADLINE: from exp4370 llm_heuristic_beats_linear + exp4371 win_is_contamination_free, decide efficiency_moat_state (deepened_stronger_class iff the LLM-heuristic beats the deployed linear cost on held-out actions AND contamination-free; linear_is_settled iff a clean null; open otherwise). ARC: reproducible_total_levels (from the registry) + new levels/games (exp4372/4373). DiffusionGemma: s3_moat_utility (useful_generation_gain / proven_but_not_useful / retired / open) from exp4374. DETECTOR: detector_beats_chance from exp4375.
        3. Emit verifier_thesis_state (one honest string) + efficiency_moat_state + s3_moat_utility + reproducible_total_levels + detector_beats_chance. Compute G1-G4 via publication_gate.py. CARRY verifier_is_oracle correctly (false for the oracle-distinct moat reads) so adversarial_verify.py does NOT fire CIRCULAR_MOAT_OVERCLAIM. Declare inference_substrate=aggregation_from_upstream_artifacts + cited_upstream_artifacts.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. The .404 scorecard string (whether the stronger learned-heuristic class deepened the efficiency moat, the ARC reproducible-total, the DiffusionGemma convert/null/retire decision, the detector reading)."
        efficiency_moat_state:
          principle: "One of deepened_stronger_class / linear_is_settled / open -- the headline decision: did a stronger learned-heuristic class (LLM-generated Python heuristics) deepen the oracle-distinct efficiency moat beyond the linear cost, leakage-clean + contamination-free?"
        s3_moat_utility:
          principle: "One of useful_generation_gain / proven_but_not_useful / retired / open -- the DiffusionGemma in-generation decision: did the scorer-repair + CoDiLA control convert the moat, null cleanly, or retire the direction (4th block)?"
        reproducible_total_levels:
          principle: "BARE int: the ARC reproducible-level count after .404 (>= the prior 33) -- the monotonic north-star accuracy signal."
        detector_beats_chance:
          principle: "BARE bool: did the verifier-as-detector beat chance where selection headroom is ~0 (the oracle-distinct ACCURACY complementary probe)?"
        verifier_thesis_state:
          principle: "One honest string summarizing where the verifier-moat thesis stands after .404 (efficiency-moat deepened / linear-settled / in-generation-converted / in-generation-retired / detector-positive / etc.)."
        publication_gate:
          principle: "G1-G4 via publication_gate.py (paper_ready + unmet_gates) -- the stable finish line (north-star §2)."
        verifier_is_oracle:
          principle: "BARE bool=false for the oracle-distinct moat reads (the durable exp4355 stamp fix) -- so this capstone does NOT trip CIRCULAR_MOAT_OVERCLAIM."
        cited_upstream_artifacts:
          principle: "list of {{experiment_id, fields_imported}} -- the audit trail so the capstone numbers trace to real measurements."
        preconditions_checked:
          principle: "Records the upstream-artifact + publication_gate availability; pre-empts the silent-missing-resource fabrication mode."
      ACCEPTANCE GATE:
        - condition: "efficiency_moat_state + s3_moat_utility + reproducible_total_levels + detector_beats_chance + verifier_thesis_state + publication_gate + cited_upstream_artifacts reported with verifier_is_oracle carried correctly (no CIRCULAR_MOAT_OVERCLAIM), OR an honest blocked_publication_gate_unrunnable verdict"
          principle: "The capstone is the milestone's honest scorecard: whether the stronger learned-heuristic class deepened the efficiency moat, the ARC reproducible-total, the DiffusionGemma convert/null/retire decision, the detector reading, and the publication gate -- aggregating only non-flagged, oracle-honest artifacts."

      Run: `python3 {project_root}/results/experiment_4379_capstone_v404.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.
