            Record: ttt_loop_exists (bool).
         Record: preconditions_checked.

      1. If ttt_loop.py absent: create with VerifierDrivenTTT:
         - __init__(self, pipeline, k_max=10, alpha=0.1)
         - iterate(self, prompt, initial_response) -> dict (basic TTT loop)
         Record: ttt_loop_created (bool).

      2. Add ORCA conformal stopping criterion:
         conformal_stopping_criterion(energy_scores: list[float], alpha=0.1, min_iterations=2) -> (bool, float):
         interval_width = max(scores) - min(scores)
         should_stop = (interval_width < alpha) AND (len(scores) >= min_iterations)
         Record: orca_method_added (bool).

      3. Add Grounded Continuation stopping criterion (arXiv:2605.14175):
         dependency_graph_stopping(response_segments: list[str], verified_mask: list[bool]) -> bool:
