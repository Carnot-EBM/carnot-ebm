- id: exp1511-product-line-solver-oracle-benchmark
  milestone: 2026.04.116
  deliverable: results/experiment_1511_product_line_solver_oracle_benchmark.json
  title: "Product-Line Solver Oracle Benchmark"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 95
  priority: high
  requires_gpu: true
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1486-cctu-executable-constraint-microbenchmark
      verdict: cctu_domain_only_quality_gap
      addressed_by: "This task changes domain to product-line feature-model constraints with a deterministic solver oracle, rather than extending CCTU with more similar cases."
      retire_if_same_verdict: false
    - experiment_id: exp1494-constrainprompt-validator-compiler-audit
      verdict: safe_prompt_derived_validators_bounded_to_cctu
      addressed_by: "This task uses solver-backed feature-model feasibility as a new oracle family and records parsing/feasibility failures separately."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Recent product-line validation work shows LLMs can approach solver
    correctness on semi-formal feature-model blueprints but still make
    structural parsing and constraint reasoning errors. ConstraintBench also
    shows feasibility is often the main bottleneck. Carnot needs a benchmark
    outside CCTU that keeps a deterministic oracle. Use {project_root} as the
    project root and {date} as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE; primary feature-model solver model)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense; secondary feature-model solver model)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE; secondary feature-model solver model)
    Legacy small models are allowed only as CPU smoke-tests and must not be
    used for headline benchmark results.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - results/experiment_1486_cctu_executable_constraint_microbenchmark.json
    - python/carnot/verify/
    - python/carnot/pipeline/
    - tests/python/

    TASK:
    Create a bounded feature-model/product-line constraint benchmark with a
    deterministic solver oracle. Run at least one mandated local SOTA GGUF
    model for headline rows and report parse, feasibility, optimality/answer,
    and false-accept metrics.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - live_sota_model_inference_used
    - product_line_benchmark_ready
    - feature_models_defined
    - cases_attempted
    - parse_rate
    - solver_oracle_ready
    - feasibility_rate
    - oracle_agreement_rate
    - verifier_false_accept_rate
    - benchmark_manifest_path
    - models_used
    - gpu_probe
    - blockers
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1511_product_line_solver_oracle_benchmark.json immediately with status="in_progress".
    2. Define a small set of semi-formal product-line blueprints with optional/mandatory/excludes/requires constraints and expected analysis operations.
    3. Implement or reuse a deterministic solver/oracle path using available local tooling. If a full solver is not available, write a bounded brute-force oracle for small feature models.
    4. Use cached_sota_pair() or the established local SOTA GGUF cache pattern from scripts/experiment_template.py.
    5. Run at least one mandated SOTA GGUF model for headline rows. If GPU/model loading fails, write a terminal blocker rather than using a legacy small headline model.
    6. Parse model outputs into structured feature selections or analysis answers and check them against the oracle.
    7. Separate parse failures, infeasible answers, feasible-but-suboptimal or wrong answers, and verifier false accepts.
    8. Write results/product_line_solver_oracle_1511.jsonl with one row per case/model.
    9. Add focused tests for blueprint parsing and oracle checking.
