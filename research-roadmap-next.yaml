- id: exp950-emvl-sparsified-ising
  milestone: 2026.04.73
  deliverable: results/experiment_950_emvl_sparsified_ising.json
  max_turns: 30
  prior_failures:
    - experiment_id: exp648-parallel-ising-inertia
      verdict: inertia_comparable_no_clear_win
      addressed_by: "Exp 648 added per-spin inertia (EMA dynamics) to the Ising sampler — result: comparable to baseline at alpha=0.5, no clear win because Python float simulation doesn't reproduce FPGA fixed-point gains. This experiment adds SPARSE CONNECTIVITY (E-MVL pattern, arXiv 2604.04606) orthogonally — sparse connections reduce the O(N^2) coupling cost to O(N log N), directly cutting LUT count for KV260 RTL. Independent improvement from inertia, can combine with v3 spec."
      retire_if_same_verdict: false
  title: 'Exp 950: E-MVL Sparsified Ising — Sparse Connectivity for KV260 RTL Optimization (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2604.04606 (E-MVL: extraction-type majority voting logic, April 2026)
    achieves ~6x speedup over simulated annealing on FPGA by sparsifying spin connectivity.
    Key insight: instead of computing E_i = sum_j(J_ij * s_j) for ALL j (O(N^2)), E-MVL
    computes only the majority vote over K nearest neighbors (K << N, O(N*K)).
    For KV260 RTL: the N=128 dense Ising sampler overflowed at 290K LUTs (vs 117K budget).
    Sparse connectivity (K=16 neighbors instead of N=128) would reduce the per-spin coupling
    logic from 128 multipliers to 16 — cutting LUT count by ~8x. This would bring N=128
    within the XCK26 budget without needing to reduce N.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/ising.py — IsingEBM (dense coupling)
    - hardware/kv260/ising_sampler_v3_spec.md — v3 RTL spec (inertia + dense)
    - results/experiment_648_parallel_ising_inertia.json — inertia_comparable_no_clear_win
    - results/experiment_585_kv260_live_benchmark_v3.json — blocked_no_bitfile (LUT overflow)

    TASK: Implement sparse Ising sampler (E-MVL pattern) in Python. Compare convergence and
    AUC vs dense Ising. Write RTL spec update for v4 (sparse + inertia combined).

    CONCRETE STEPS:
    1. Read CLAUDE.md.
    2. Write python/carnot/models/sparse_ising.py:
       a. Class SparseIsingEBM(IsingEBM):
          - __init__(self, n_vars, n_neighbors=16): creates sparse coupling matrix J_sparse
            of shape (n_vars, n_neighbors) — each spin connected to K neighbors only
          - _build_sparse_neighbors(self, n_vars, n_neighbors): random K-regular graph
            (each spin has exactly K neighbors, symmetric)
          - energy(self, spins): compute E = -sum_i(sum_(j in neighbors(i)) J_ij * s_i * s_j) / 2
          - sample_gibbs(self, n_steps): Gibbs sampling using only K-neighbor sum
          - compare_with_dense(self, n_trials=10): benchmark sparse vs dense convergence
       b. E-MVL majority vote rule: for each spin i, new_s_i = sign(sum_(j in neighbors(i)) J_ij * s_j)
          (majority vote over K neighbors instead of Gibbs probability)
       c. Add spec entries: REQ-SAMPLE-020 (SparseIsingEBM K-regular graph),
          SCENARIO-SAMPLE-035 (sparse vs dense convergence comparison).
    3. Write scripts/experiment_950_emvl_sparsified_ising.py:
       a. ExperimentTemplate(950, ...) — CPU, no GPU.
       b. Test at n_vars=64 (KV260 current default), K=[8, 16, 32]:
          For each K: measure convergence speed (steps to reach low energy) and AUC
          on synthetic constraint verification vs dense Ising baseline.
       c. Compute speedup_ratio = steps_dense / steps_sparse_K16.
       d. Write hardware/kv260/ising_sampler_v4_spec.md (RTL update):
          - Inherit from v3 spec (inertia dynamics, EMA per-spin)
          - Add: sparse coupling (K=16 neighbors per spin, random K-regular graph)
          - LUT estimate: 16 multipliers × 16-bit × N spins vs 128 × N dense
          - Expected LUT count at N=128: ~290K × (16/128) = ~36K LUTs (well within 117K budget)
       e. honest_verdict:
          'emvl_speedup_confirmed' if speedup_ratio >= 1.5x (convergence steps)
          'emvl_comparable' if 0.8 < speedup_ratio < 1.5
          'emvl_slower' if speedup_ratio < 0.8
    4. Write tests (100% coverage). 100% spec coverage.
    5. Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_950_emvl_sparsified_ising.py
    6. Update research-hardware-wishlist.md: add E-MVL section for KV260 v4 RTL plan.
    7. Update ops/changelog.md.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_950_emvl_sparsified_ising.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

