    addressed_by: "exp2388 failed 3 times with Codex CLI error in .232. Codex CLI
      confirmed healthy by exp2393. Infrastructure failure resolved."
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT: Phase 1 ship gate criteria (per CLAUDE.md Phase Vision):
      1. PyPI package carnot-ebm published (pip install carnot-ebm works)
      2. HuggingFace mirror: at least one model at huggingface.co/Carnot-EBM
      3. MCP server documentation exists in docs/
      4. CLI documentation exists in docs/
      5. External reproducer: CI workflow + at least one test-results entry

    This audit has been attempted 3 times without producing an artifact. This v3 attempt
    has no upstream dependencies and is placed in Phase 4 of .234.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Network accessible:
            curl -sf -o /dev/null https://pypi.org/pypi/carnot-ebm/json 2>/dev/null &&
            echo "pypi_reachable" || echo "pypi_unreachable"
            curl -sf -o /dev/null https://huggingface.co/Carnot-EBM 2>/dev/null &&
            echo "hf_reachable" || echo "hf_unreachable"

      1. PyPI check:
         pypi_response=$(curl -sf https://pypi.org/pypi/carnot-ebm/json 2>/dev/null)
         pypi_published: true if response contains '"version"', false otherwise.
         pypi_version: extract from response.

      2. HuggingFace check:
         hf_response=$(curl -sf "https://huggingface.co/api/models?search=carnot-ebm&limit=5" 2>/dev/null)
         hf_mirror_up: true if at least 1 model found, false otherwise.

      3. MCP docs check:
         mcp_docs_present: ls {project_root}/docs/*mcp* 2>/dev/null | wc -l > 0

      4. CLI docs check:
         cli_docs_present: ls {project_root}/docs/*cli* 2>/dev/null | wc -l > 0

      5. External reproducer check:
         ci_workflow_count: ls {project_root}/.github/workflows/*.yml 2>/dev/null | wc -l
         test_results_content: head -20 {project_root}/ops/test-results.md 2>/dev/null
         external_reproducer_exists: true if ci_workflow_count > 0 AND test-results.md exists.

      6. phase1_ship_gate_met: true if ALL 5 criteria pass, false otherwise.
         missing_criteria: list of failed criteria.

      7. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with gate_met boolean."
      - phase1_ship_gate_met:
          principle: "True if ALL 5 criteria pass. Phase 1 completion gate."
      - pypi_published:
          principle: "PyPI carnot-ebm package exists — primary distribution."
      - pypi_version:
          principle: "Latest PyPI version (null if not published)."
      - hf_mirror_up:
          principle: "HF Carnot-EBM has >= 1 model — decentralization Rule 3."
      - mcp_docs_present:
          principle: "MCP documentation exists for external integrators."
      - cli_docs_present:
          principle: "CLI documentation exists."
      - external_reproducer_exists:
          principle: "CI + test-results.md present — Phase 1 completion signal."
      - missing_criteria:
          principle: "List of failed criteria — actionable next steps."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records network reachability checks."

    ACCEPTANCE GATES:
      - condition: "phase1_ship_gate_met != null"
        principle: "Must evaluate and record the gate boolean — even false is a valid result."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2418-paperv6-capstone-v234
  title: 'Phase 5: Paper-v6 Results Table + Capstone v234 — AUROC Ceiling Assault Synthesis'
  milestone: 2026.05.234
  deliverable: results/experiment_2418_capstone_v234.json
  model: opus
  max_turns: 60
  requires_claude: true
  prior_failures:
  - experiment_id: exp2404-paperv6-capstone-v233
    verdict: complete_233_capstone_synthesis
    addressed_by: "exp2404 synthesized .233 milestone results. This task synthesizes .234
      results — different milestone, new verifier AUROC data from exp2408-2410, ship gate
      status from exp2417. Standard recurring capstone; not a scope failure."
    retire_if_same_verdict: false
  - experiment_id: exp2390-capstone-v232
    verdict: complete_232_capstone_synthesis
    addressed_by: "exp2390 synthesized .232 results. exp2418 synthesizes .234 results.
      Standard recurring milestone capstone — different data, not a scope failure."
    retire_if_same_verdict: false
  gated_on:
  - upstream: exp2408-hive-full-4verifier-v3
    artifact_field: ensemble_auroc_improved
    op: '=='
    value: true
  prompt: |-
    CONTEXT: Milestone 2026.05.234 (AUROC Ceiling Assault) targets pushing AUROC past the
    HIVE peer ceiling of 0.9236. Key .233 baseline: FregeLogic=0.8831, HIVE 3-verifier=0.8539.
    .234 adds: Full 4-verifier HIVE ensemble (exp2408), Hierarchical LogCons (exp2409),
    HALT-RAG NLI abstention (exp2410), FST Constrained MCMC (exp2412), 3 new samplers
    (exp2413-exp2416), Phase 1 ship gate (exp2417).

    REQUIRES_CLAUDE JUSTIFICATION: (1) Codex has never successfully synthesized multi-
    milestone AUROC capstones — prior successful capstones were all Claude (exp2376,
    exp2404). (2) Reads 12+ experiment artifacts across 5+ directories with cross-
    experiment AUROC reasoning. (3) Open-ended synthesis: which results close the HIVE
    peer gap? Does Phase 1 ship gate progress change the paper submission timeline? These
    require multi-step reasoning under ambiguity — not mechanical computation.

    EXISTING ARTIFACTS TO READ:
      {project_root}/results/experiment_2408_hive_full_v3.json (HIVE v3 AUROC)
      {project_root}/results/experiment_2409_hierarchical_logcons.json (LogCons AUROC)
      {project_root}/results/experiment_2410_halt_rag_nli.json (HALT-RAG AUROC)
      {project_root}/results/experiment_2411_fr11_nsvif_online_v3.json (FR-11 result)
      {project_root}/results/experiment_2412_fst_constrained_mcmc.json (MH acceptance)
      {project_root}/results/experiment_2413_kv260_yosys_v3.json (synthesis result)
      {project_root}/results/experiment_2414_kinetic_langevin_v3.json (KL delta)
      {project_root}/results/experiment_2415_dikin_langevin.json (Dikin KL delta)
      {project_root}/results/experiment_2416_de_psgld.json (DE-PSGLD KL delta)
      {project_root}/results/experiment_2417_phase1_ship_gate_v3.json (ship gate)
      {project_root}/results/experiment_2404_capstone.json (.233 capstone baseline)
      {project_root}/results/experiment_2395_fregelogic.json (FregeLogic 0.8831 baseline)

    TASK: Compile paper-v6 results table. Synthesize .234 key findings. Update ops/status.md.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. At least exp2408 artifact must exist (gate condition):
            ls {project_root}/results/experiment_2408_hive_full_v3.json
            If missing: write honest_verdict blocked_no_auroc_artifacts and exit.

      1. Read all available artifacts. Extract:
         - best_auroc_achieved: max AUROC across all .234 verifiers
         - hive_v3_auroc: from exp2408
         - logcons_auroc: from exp2409
         - halt_rag_auroc_full: from exp2410
         - auroc_gap_to_hive_peer: 0.9236 - best_auroc_achieved
         - fr11_satisfied: from exp2411.fr11_nsvif_online_passed
         - kv260_yosys_succeeded: from exp2413.synthesis_succeeded
         - best_sampler_kl_delta: max(kinetic_vs_casal, dikin_vs_casal, de_psgld_vs_casal)
         - phase1_ship_gate_met: from exp2417

      2. Compile updated paper-v6 results table in Markdown:
         | Verifier | AUROC | vs Baseline | Source |
         |---|---|---|---|
         (Include all verifiers from .233 + new .234 results)

      3. Write synthesis: what .234 proved, what gap remains, what the hardware track status is.

      4. Append paper_v6_results_table and synthesis to ops/status.md (add new section — do NOT replace).

      5. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with best_auroc and gap."
      - best_auroc_achieved:
          principle: "Best AUROC from any .234 verifier. Paper-v6 headline metric."
      - auroc_gap_to_hive_peer:
          principle: "0.9236 - best_auroc_achieved. Primary progress signal."
      - hive_v3_auroc:
          principle: "HIVE 4-verifier ensemble AUROC (null if exp2408 failed)."
      - fr11_satisfied:
          principle: "FR-11 mandatory: true if exp2411.fr11_nsvif_online_passed=true."
      - kv260_yosys_succeeded:
          principle: "KV260 hardware track milestone: true if synthesis completed."
      - best_sampler_kl_delta:
          principle: "Best KL improvement from new samplers. Sampling track progress."
      - phase1_ship_gate_met:
          principle: "Phase 1 completion gate — true if all 5 criteria pass."
      - paper_v6_results_table:
          principle: "Markdown table for paper-v6 Section 5 — complete verifier landscape."
      - n_paper_ready_results:
          principle: "Count of verifiers with AUROC > 0.685 baseline — paper-v6 table rows."
      - duration_s:
          principle: "Guards against fabrication."

    ACCEPTANCE GATES:
      - condition: "best_auroc_achieved != null"
        principle: "Must have at least one AUROC result from .234."
      - condition: "fr11_satisfied != null"
        principle: "FR-11 status must be explicitly recorded — mandatory per CLAUDE.md."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

