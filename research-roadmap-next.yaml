       e. library = ConstraintTemplateLibrary('data/constraint_templates.json')
          n_before = len(library.templates)
          For each violation pattern from Exp 656 (or synthetic):
            library.add_template(pattern, violation_type='arithmetic', source_experiment=656)
          n_added = len(library.templates) - n_before
