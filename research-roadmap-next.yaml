  - id: exp1720-nla-task-4-ensemble-integration
    title: "Exp 1720: NLA 16th verifier Task 4 (final) — ensemble integration as production verifier #16"
    deliverable: results/experiment_1720_nla_ensemble_integration.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1716-nla-eval-awareness-carry-forward
        verdict: complete_eval_awareness_safe_gap_negative_4.2pp
        addressed_by: "exp1716 (.176) closed Task 3 of the 4-task chain with delta_tpr=-0.042 (within 5pp gate, eval-awareness-SAFE). This Task 4 integrates the exp1694-trained probe as verifier #16 in the production k=15 ensemble, growing it to k=16. NOT a duplicate; this is the next chain step."
        retire_if_same_verdict: false
      - experiment_id: exp1694-nla-class-16th-verifier-prototype-v3
        verdict: complete_prototype_tpr_0.73_fpr_0
        addressed_by: "exp1694 (.171) shipped the prototype probe. This task integrates that probe into VerifyRepairPipeline as the 16th verifier and tests end-to-end."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: NLA-class 16th verifier 4-task chain per CLAUDE.md operator
      directive 2026-05-09. Task 1 (design), Task 2 (prototype = exp1694),
      Task 3 (eval-awareness = exp1716) all shipped. This is Task 4
      (final): integrate the exp1694-trained probe into Carnot's k=15
      verifier ensemble as verifier #16, producing k=16 in production.

      FALSIFIABLE HYPOTHESIS: With the NLA probe added as verifier #16,
      Carnot's joint verifier ensemble agreement rate on a 60-example
      held-out test set improves by at least 3pp over k=15 baseline,
      measured as (#examples where >= 8 of k pass for k=16) − (#examples
      where >= 8 of k pass for k=15). If lift < 3pp, NLA adds noise
      rather than signal and should remain experimental.

      EXISTING CODE TO READ FIRST:
        - python/carnot/verify/nla_verifier_v3.py (the exp1694 probe)
        - python/carnot/pipeline/verify_repair.py (the k=15 ensemble
          integration point)
        - results/experiment_1694_nla_v3.json (TPR=0.73, FPR=0.0)
        - results/experiment_1716_nla_eval_awareness.json (delta_tpr=-0.042)
        - feedback_nla_class_16th_verifier_committed memory entry

      TASK: Wire the NLA probe into the production verifier ensemble.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "from carnot.verify.nla_verifier_v3 import
              NLAVerifierV3"` succeeds — else `blocked_nla_v3_import_failed`.
           b. `python -c "from carnot.pipeline.verify_repair import
              VerifyRepairPipeline"` succeeds — else
              `blocked_verify_repair_pipeline_import_failed`.
           c. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              returns non-empty — else `blocked_model_not_cached`.
           Record preconditions_checked.
        1. Add NLA verifier to the k=15 list in VerifyRepairPipeline
           (the integration point — grep for `verifiers` or `verifier_list`
           in pipeline/verify_repair.py).
        2. Build a 60-example held-out test corpus (NOT the same examples
           used by exp1694 train OR exp1716 eval-awareness train).
        3. Run the ensemble at k=15 (baseline) and k=16 (with NLA probe
           added). For each example, record per-verifier pass/fail AND
           the joint k-of-N agreement count.
        4. Compute lift: (#examples passing >=8 of 16 with NLA) −
           (#examples passing >=8 of 15 baseline). Report Wilson 95% CI.
        5. Acceptance: lift >= 0.03 (3pp) AND lift_wilson_lower > 0
           (lift is statistically positive). If lift < 0 or CI contains
           zero, the NLA probe should not be promoted to production —
           emit verdict honestly.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.nla_ensemble_integration.v1"
        - experiment: 1720
        - run_date: ISO-8601 UTC
        - duration_s: > 100s (60 examples * (k=15 baseline + k=16 with NLA)
