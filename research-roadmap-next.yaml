  prompt: |
    CONTEXT
    Work in {project_root} on {date}. Milestone 2026.10.692. V691 capstone correctly found missing science but failed its own negative replay. V692 must distinguish administrative completion, null results, external blocks, and independent benefit. Its branches deliberately have separate prerequisites.

    EXISTING CODE TO READ FIRST
    CLAUDE.md; CODEX.md; research-program.md; ops/exclusion_manifest.yaml; scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; ops/e2e-test-plan.md; python/carnot/reporting/v691_capstone.py; python/carnot/reporting/v691_capstone_validation.py; scripts/publication_gate.py; scripts/conductor_gates.py; scripts/in_process_doc_reconcile.py; ops/verifier_gaps.md; ops/exclusion_manifest.yaml

    TASK
    Independently reduce thirteen outcomes and decide the three PRD gaps. Deliver results/experiment_7991_v692_capstone.json. Implement the bounded entrypoint scripts/experiments/experiment_7991_v692_capstone.py. MODEL_SPECS: []. SUBSTRATE CLASS: no_model_load. Use verifier_ensemble_against_cached_candidates for numerical scoring, or aggregation_from_upstream_artifacts for a pure audit. Zero current pretrained-model loads/calls. Small fitted heads are separate trained_head_specs.

    CONCRETE STEPS
    1. Print a flushed progress line at each phase boundary and before and after every model load, generation call, benchmark, and subprocess. Print inside long loops and from a supervising thread while an owned child is silent, at most 60 seconds apart. Keep every output gap below 600 seconds. Use tool waits of at most 60 seconds. Silence can end a run near 1200 seconds; progress permits the 4800-second hard cap. Report measured work; never pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Keep each edit and tool call small. Put temporary scripts and mutable test files in private /tmp directories outside the checkout. Keep the pytest artifact guard enabled. Archive immutable receipts only after children exit.
    3. Authenticate the exact input paths, hashes, roles, producer invocation dates, and readiness fields below. A historical date need not equal {date}. Missing inputs or failed external gates yield verdict_class=blocked and exact gate_check_summary operands. Do not retry unchanged external blocks as partial. Preserve historical failures and all source artifacts.
    4. Before implementation, append task-specific REQ-REPORT and, where applicable, REQ-VERIFY requirements and scenarios. Write tests first. Reuse qualified components below; implement only the stated difference. Freeze the required validation command manifest before running science. Keep unrelated repository health separate; never remove a failed owned check or weaken an assertion to qualify.
    5. Bind exactly13 tasks exp7979 through exp7991 to the current design contract and frozen YAML. Read declared primaries and conductor dispatch records separately. Produce a disposition for all13 including this capstone; do not require all to succeed. Use producer-specific date/hash custody across UTC rollover and frozen previous design snapshots.
    6. Independently recompute source counts, probability/cost metrics, causal label reads, restart equality, retention, calibration, service spans and hardware bounds from primitive rows and checkpoints. Do not import headline booleans as proof. Verify every same-information comparison uses the same sources and unknown-label rule. Unavailable branches stay unavailable.
    7. Run the owned expected-negative CLI tests in private scratch with a wrapper that asserts the child exit1; wrapper exit0 is the passing validation receipt. Include missing upstream, frozen authority drift, malformed rows and legitimate blocked cold replay. Reuse retained repository-health failures as historical diagnostics only. Do not rerun an unrelated full suite to qualify the capstone.
    8. Decide three gaps: independent source-support decisions FR-12/FR-06; causal persistent learning FR-11; complete qualified service and acceleration path FR-05/08 and NFR-01. Distinguish exposure-audited reserved data from known exposed development. Record explicit continue/retire/reopen conditions. An unchanged repeat verdict with retire_if_same_verdict=true enters ops/exclusion_manifest.yaml with source hashes; do not retire different scopes by keyword.
    9. Run scripts/publication_gate.py --json and preserve its stable G1/G2/G3/G4 and unmet_gates. The historical gate may be green while current research is null or blocked; keep paper_ready separate from science_ready. Missing external required science means verdict_class=blocked, not partial. Complete valid null science is terminal null; failed owned validation is disqualified. Reconcile only evidence-supported docs and leave public publication to the operator.
    10. Run affected unit and consumer tests, nonempty 100% changed-statement coverage including real private CLI routes, scoped Ruff check/format, strict mypy, and scripts/check_spec_coverage.py on the actual test paths. Run applicable E2Es listed below with private outputs. Cold-replay the primary from outside the checkout without PYTHONPATH. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the final primary. Check both conductor_gates.evaluate_gates and in_process_doc_reconcile.find_artifact resolve that primary. Failed owned required validation means disqualified and readiness zero. Use one atomic declared primary and nested sidecars. Reconcile specs, _bmad/traceability.md, ops/status.md, and ops/changelog.md. Keep generator weights and production defaults fixed. Applicable end-to-end checks: E2E-018 private authority CLI plus current capstone successful and blocked cold replay.
    REQUIRED ARTIFACT FIELDS
    - experiment_id, task_id, milestone, run_date, execution_date: principle: Bind identity to this invocation, not an inherited producer.
    - honest_verdict: principle: Use complete_positive_*, complete_null_*, complete_blocked_*, complete_disqualified_*, or complete_circular_positive_* with an accurate reason.
    - verdict_class: principle: Choose exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished OWN work that a retry can finish; other classes are terminal.
    - gate_check_summary: principle: Every blocked disposition names upstream, path/hash, field, operator, expected value and actual value. Distinguish missing from zero.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_specs, model_invocation_counts: principle: Declare actual compute and zero calls for cached scoring. Separate planned models from actual blocked invocations.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: principle: Make timing, progress and reconstruction checkable.
    - cited_upstream_artifacts, code_config_hashes, raw_shard_hashes: principle: Bind imported fields and current computations to their source bytes.
    - preconditions_checked, validation_command_manifest_path, validation_receipts, coverage_statement_counts: principle: Required checks need observed exit codes and logs, not a claimed green status.
    - rows, sample_size_budget: principle: Keep one primitive row per source/arm/seed or check. Include intended, eligible, started, completed, failed, censored, excluded and independent counts. Seeds do not multiply independent sources.
    - verifier_is_oracle, claim_scope, acceptance_gate_results: principle: Keep circular fixtures separate from independent natural-data evidence. A failed benefit gate forbids a positive class.
    - flagged_adversarial, terminal_validation_sidecar_path: principle: Final-byte checks must travel with the primary; never self-certify a failed verifier.
    - outcome_rows, independent_reduction_rows, gap_decisions: principle: Account for every planned task and derive claims from source observations.
    - G1, G2, G3, G4, paper_ready, unmet_gates, science_ready: principle: Do not redefine the publication gate or confuse it with new scientific benefit.
    - retirement_decisions, next_reopen_conditions, authority_snapshots: principle: Prevent unchanged failed chains from reappearing and preserve the exact plan that ran.
    - capstone_execution_ready_score: principle: Exact downstream readiness field. Set 1 only after complete valid measurement and owned checks; a scientific null can still be ready. Set 0 on blocked/disqualified work.
