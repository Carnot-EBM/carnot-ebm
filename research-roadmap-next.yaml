  - id: exp2836
    milestone: "2026.05.269"
    deliverable: "results/experiment_2836_fover_memory_leakage_isolation.json"
    title: "FoVer Memory-Leakage Isolation v3 (CODEX, post-torch-fix)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 60
    track: research

    prior_failures:
      - experiment_id: exp2828
        verdict: "blocked_cuda_unavailable (.268, torch+cpu wheel)"
        addressed_by: "torch reinstalled to 2.11.0+cu128 at commit 1e75b6739 (2026-05-21 18:15 EDT); pre-commit guard scripts/check_torch_cuda.py at commit 27666136d refuses commits with CPU-only torch. Both 3090s now visible via .venv/bin/python3 -c 'import torch; assert torch.cuda.is_available()'. This task is a fresh attempt under codex with verified CUDA."
        retire_if_same_verdict: true
      - experiment_id: exp2820
        verdict: "SKIP (gemini-cli chunk-VWGAOW57.js crash, .267)"
        addressed_by: "Conductor flipped to codex/gpt-5.5 at commit b024b58d1 (14:45 EDT 2026-05-21)."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline" and
      "Adversarial Artifact Verification + Sample-Size Rigor".

      CONTEXT: operator hypothesis 2026-05-21 — "could it be that the
      self-learning has internalized the entire FoVer set having seen
      it repeatedly and used that between runs?" Investigation
      confirmed multiple FR-11 self-learning state files persist
      FoVer-derived patterns across runs. Third attempt at the
      dual-condition measurement under codex with verified CUDA.

      Operator directive 2026-05-21: "we want to report both with and
      without learning so we know both how effective our naive answers
      are as well as what benefit the learning is affording our
      solution."

      ABSOLUTE PROHIBITION: no sleep-padding duration_s; no min(x, 0.99)
      score-capping; no IMPLAUSIBLE_PERFECT / DURATION_TOO_SHORT
      references; no np.random fabrication. Real 5-seed x dual-
      condition x N=1000 live-GPU eval requires >= 3600s wall time.
      If you cannot produce real measurements, emit
      blocked_<resource>.

      TASK: Run the production verifier ensemble v7b against FoVer
      (n=1000 random subset, seed=42) under TWO memory conditions:
        Condition A: WITH full FR-11 self-learning state loaded
        Condition B: WITH all FR-11 self-learning state RESET
                     (non-destructive move to /tmp + Python restart)
      Compute AUROC for each condition under 5-seed adversarial
      replication. learning_contribution = A_mean - B_mean.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `.venv/bin/python3 -c "import torch; assert torch.cuda.is_available() and torch.cuda.device_count() >= 1"`
              NOTE: MUST use .venv/bin/python3 (not bare python3 which
              has no torch). If the assertion fails after the
              2026-05-21 torch+cu128 fix, that's a real regression
              — emit blocked_cuda_post_fix_regression with the full
              torch.version output.
           b. `test -f data/fover_corpus.jsonl`
           c. `test -f results/nexus_constraint_memory_v2.json`
           d. Qwen3.6-35B-A3B-GGUF cached
           Record preconditions_checked.

        1. Identify all FR-11 state files; document SHA256 + byte size.

        2. Condition A — production: load FoVer 1000 subset (seed=42),
           score with verifier ensemble v7b (full FR-11 state).
           Record per-verifier scores + ensemble AUROC.

        3. Condition B — architecture-only: move FR-11 state files to
           /tmp/fr11_state_backup_<seed>/ non-destructively, restart
           Python, reload ensemble (confirm via logs that no NEXUS
           / constraint-template / session-memory loaded), score the
           same FoVer subset.

        4. Restore FR-11 state files; verify SHA256 match.

        5. Repeat 2-4 with 5 seeds (42, 137, 271, 314, 1729).

        6. Compute condition-A and condition-B AUROC mean ± std.
           Compute learning_contribution = mean_A - mean_B.

        7. Per-verifier learning contribution.

        8. Write artifact. Honest framing.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:' (or 'blocked_<resource>')
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - condition_a_production_auroc_mean: float
          principle: "Production-config AUROC (full FR-11 state)."
        - condition_a_production_auroc_std: float
          principle: "Replication noise on production-config."
        - condition_b_architecture_only_auroc_mean: float
          principle: "Memory-reset AUROC — the architecture's actual generalization."
        - condition_b_architecture_only_auroc_std: float
          principle: "Replication noise on architecture-only."
        - learning_contribution: float
          principle: "= A - B. Direct measurement of FR-11 self-learning contribution."
        - per_verifier_learning_contribution: dict[str, float]
          principle: "Which specific verifiers degrade most without FR-11 memory."
        - fr11_state_files: list[{path, sha256, n_bytes}]
          principle: "Names the persisted state that was reset."
        - state_files_restored_sha_match: true
          principle: "Proves FR-11 state was restored to original SHAs (non-destructive)."
        - n_examples: 1000
          principle: "Sample size."
        - n_seeds: 5
          principle: "Adversarial replication."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism."
        - reproducibility_checksum: str
          principle: "Catches drift."
        - model_specs: {name: "Qwen3.6-35B-A3B-GGUF", quant: "...", revision_sha: "..."}
          principle: "Names compute target."
        - duration_s: float
          principle: "Expected >= 3600s. Sleep-padding forbidden."
        - preconditions_checked: list
          principle: "Anti-fabrication. MUST use .venv/bin/python3 in the check command."
        - methodology_note: str
          principle: "Honest interpretation of the delta."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

