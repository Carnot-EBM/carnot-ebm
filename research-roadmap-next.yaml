    title: "Phase 2: NeSy MAP Inference Alternating Training"
    gated_on:
      - upstream: "exp2074-nesy-symbolic-encoder"
        artifact_field: "nesy_encoder_ready"
        op: "=="
        value: true
    max_turns: 50
    prompt: |
      CONTEXT: NeSy-EBMs train via MAP inference alternating training, learning both neural parameters and enforcing symbolic priors.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/embeddings/nesy_encoder.py
      - python/carnot/training/ebrm_trainer.py
      
      TASK: Implement MAP inference alternating training for the NeSy framework.
      
      CONCRETE STEPS:
      1. Create python/carnot/training/nesy_trainer.py.
      2. Implement an alternating optimization loop updating neural weights and projecting onto the symbolic constraints.
      3. Save to results/experiment_2075_nesy_map_inference.json with map_inference_ready=true.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2076-nesy-smt-verification-loop"
    title: "Phase 2: NeSy to SMT Verification Loop"
    gated_on:
      - upstream: "exp2075-nesy-map-inference"
        artifact_field: "map_inference_ready"
        op: "=="
        value: true
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: Prove that the NeSy mapping correctly produces results that have zero-false-accepts when checked via formal SMT.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/kan_smt_verifier.py
      - python/carnot/training/nesy_trainer.py
      
      TASK: Connect MAP inference outputs to the KAN4CBC SMT verifier, proving zero-false-accepts on a neuro-symbolic toy problem.
      
      CONCRETE STEPS:
      1. Create scripts/experiment_2076_nesy_verification.py.
      2. Train a small model to solve a path-continuity problem using NeSy.
      3. Verify the generated paths via the SMT verifier to confirm zero false accepts.
      4. Save to results/experiment_2076_nesy_verification.json.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

