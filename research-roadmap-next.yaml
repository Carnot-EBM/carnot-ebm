    \ - n_eval:\n      principle: \"Sample size for AUROC claim — must be >= 50.\"\n
    \ - corpus_type:\n      principle: \"'real' or 'synthetic' — distinguishes paper-citable
    AUROC.\"\n  - methodology_note:\n      principle: \"Documents which self-consistency
    signals were used — required for paper-v6 disclosure.\"\n  - preconditions_checked:\n
    \     principle: \"Records which resources were verified.\"\n  - duration_s:\n
    \     principle: \"Wall-clock measurement.\"\n  - random_seed:\n      principle:
    \"Reproducibility seed.\"\n\nACCEPTANCE GATES:\n  - condition: \"tier0u_viable
