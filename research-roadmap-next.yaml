        retire_if_same_verdict: false
      - experiment_id: exp1982-phase1-independent-reproducer-github-actions
        verdict: status_unknown_at_200_prestage
        addressed_by: "exp1982 (.198) Reproducer task status unknown; same conditional retry."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: .198 had exp1981 (MCP/CLI docs) + exp1982 (Independent
      Reproducer) as Phase 1 ship-track completion tasks. Status
      unknown at .200 pre-stage. This task checks both; retries any
      that didn't ship cleanly.

      FALSIFIABLE HYPOTHESIS: Of exp1981 + exp1982, each is either
      (a) shipped (artifact exists, acceptance_gate_passed=true), or
      (b) not-shipped (artifact missing, blocked, or
      acceptance_gate_passed=false). For each (b) case, retry with
      same no-gate + direct-preconditions discipline.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1981*_mcp*.json (if exists)
        - results/experiment_1982*_reproducer*.json (if exists)
        - .github/workflows/phase1-reproducer.yml (if drafted by .198)
        - docs/integrator-guide.md (if drafted by .198)

      TASK: Status-check each .198 ship task; conditional retry.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. The audit artifacts from exp1986 are readable OR can be
              read directly from results/ — else
              `blocked_no_audit_baseline`. (Allowed to proceed
              without exp1986 by directly checking the .198 artifacts.)
           Record preconditions_checked.
        1. For exp1981 MCP/CLI docs:
           a. Check results/experiment_1981*.json exists +
              acceptance_gate_passed=true. If yes, mark `mcp_docs_status:
              shipped` and skip retry.
           b. If artifact missing or blocked/failed, retry the MCP/CLI
              docs work per the exp1981 spec.
        2. For exp1982 Independent Reproducer:
           a. Check results/experiment_1982*.json exists +
              acceptance_gate_passed=true.
           b. If artifact missing or blocked/failed, retry per exp1982 spec.
        3. Record per-task: status, retry_needed, retry_outcome.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase1_recovery.v1"
        - experiment: 1989
        - run_date: ISO-8601 UTC
        - duration_s: > 30s if no retries needed; > 120s if retries
