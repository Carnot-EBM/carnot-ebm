- id: exp698-jepa-v16-retrain-fover-formal
  milestone: 2026.04.53
  deliverable: results/experiment_698_jepa_v16.json
  title: 'Exp 698: JEPA v16 Retrain on FoVer Formal v1 — Address Root Cause from Exp 693'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 693 identified the root cause of JEPA v15 OOD AUC=0.4751 (below random).
    This experiment implements the v16 architecture changes specified by Exp 693 and retrains
    on the expanded FoVer formal v1 corpus (Exp 686, 200+ Z3-labeled pairs).

    Expected changes by root cause (read from Exp 693 artifact):
    - "cpmi_distribution_mismatch": retrain CPMI pairs to include OOD-sampled questions
      (GSM8K 500-699), not just training distribution.
    - "pure_loss_anti_correlation": replace PUREMinFormLoss with InfoNCE contrastive loss.
