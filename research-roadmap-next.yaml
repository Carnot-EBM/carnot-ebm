        addressed_by: "Addresses the later .285 adversarial finding that equal pass@1/pass@k deltas, perfect zero-delta rows, too-short duration, and missing seed metadata keep the row bounded."
        retire_if_same_verdict: true
      - experiment_id: exp3042-repair-promotion-reconciliation-v3
        verdict: "complete: repair_claim_status=bounded; remaining_blockers=9"
        addressed_by: "Builds a predeclared de-tautology protocol before any new SOTA repair rerun."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Repair cannot rerun safely until the exp3028-style methodology blockers are predeclared and mechanically checked. This task must not run live LLM inference.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3028_sota_repair_clean_methodology_rerun_v2.json
      - results/experiment_3042_repair_promotion_reconciliation_v3.json
      - results/experiment_3043_verified_speculation_transcript_fingerprint_v1.json
      - results/experiment_3055_repair_headline_retirement_and_blocker_ledger_v1.json
      - research-references.md

      TASK
      Define a mechanically checkable repair de-tautology protocol for any future local SOTA repair run.

      CONCRETE STEPS
      1. Extract the exact exp3028/exp3042 blocker fields: tautology, implausible perfect results, duration, missing seed, and unresolved methodology.
      2. Define acceptance checks for pass@1 vs pass@k, non-vacuous task outcomes, wall-clock sanity, seed/logging, model_specs, fingerprint linkage, and checker authority.
      3. Add AprAD-inspired intent-preservation language as a protocol requirement, but do not claim an AprAD implementation unless one exists.
      4. Define the JSON fields exp3059 must emit to be eligible for matrix v20 promotion.
      5. Set repair_de_tautology_protocol_ready=true only if exp3059 can consume the protocol without inference.

      REQUIRED ARTIFACT FIELDS:
      - repair_de_tautology_protocol_ready: bool (principle: live repair reruns must be gated by predeclared methodology)
      - blocked_prior_fields: dict (principle: prior blockers must map to explicit checks)
      - required_live_run_fields: list (principle: future live artifacts must be schema-checkable)
      - intent_preservation_checks: list (principle: verifier-valid repairs must not drift from the task)
      - duration_sanity_rule: dict (principle: too-fast live claims must be caught)
      - fingerprint_requirements: list (principle: local SOTA output must be replayable)
      - promotion_disqualifiers: list (principle: failure modes must be predeclared)
      - inference_substrate: dict (principle: protocol work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3057-local-sota-solution-verifier-gain-panel
    milestone: "2026.05.286"
    deliverable: "results/experiment_3057_local_sota_solution_verifier_gain_panel_v1.json"
    title: "Local SOTA solution-verifier gain panel"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 90
    track: "verification"
    inference_substrate: "local_sota_gguf"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3043-verified-speculation-transcript-fingerprint
        verdict: "complete: fingerprint_live_ready=true; deterministic_replay_passed=true; models_used=[unsloth/gemma-4-26B-A4B-it-GGUF]"
        addressed_by: "Uses the established local SOTA fingerprint discipline before measuring a tiny solver-verifier panel."
        retire_if_same_verdict: true
      - experiment_id: exp3044-smt-sat-validator-tree-exactness-upgrade
        verdict: "complete: validator_tree_exactness_ready=true; verified=1; unresolved=1; fallback_only=1; correction_sets=1"
        addressed_by: "Adds LLM verifier-gain measurement on top of exact solver authority rather than replacing exact validation."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. OpenReview "Beyond Solving" argues that solution-verifier value depends on solver/verifier relationship and false positives. This task measures a tiny local SOTA panel with exact ground truth.

      MODEL_SPECS
      Headline SOTA local GGUF candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Use at least one of these for any live LLM generation or verification. Legacy small models are allowed only as legacy_smoke_only=true CPU smoke tests and cannot satisfy solution_verifier_calibration_ready.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - python/carnot/inference/sota_models.py
      - results/experiment_3043_verified_speculation_transcript_fingerprint_v1.json
      - results/experiment_3044_smt_sat_validator_tree_exactness_upgrade_v1.json
      - research-references.md

      TASK
      Run a tiny local SOTA solver-verifier panel over SAT/SMT-style fixtures and report verifier gain, false positives, and exact-solver agreement.

      CONCRETE STEPS
      0. PRECONDITIONS: record CUDA availability, GPU memory, model cache paths, model IDs, seeds, prompt hashes, decode settings, and wall-clock duration. If no mandated GGUF can load, write blocked_sota_gguf_unavailable and stop.
      1. Build 6-12 deterministic fixtures with exact ground truth from existing SAT/SMT artifacts or tiny generated fixtures.
      2. Use at least one mandated local GGUF to produce or judge candidate solutions. If two mandated models are available, separate solver and verifier families.
      3. Compare one-shot solver accuracy with verifier-selected accuracy from a small candidate pool.
      4. Report verifier_gain_delta, false_positive_rate, false_negative_rate, cross_family_used, exact_solver_authority, and legacy_smoke_only_used.
      5. Set solution_verifier_calibration_ready=true only if exact ground truth, model_specs, and verifier-gain fields are non-vacuous.

      REQUIRED ARTIFACT FIELDS:
      - solution_verifier_calibration_ready: bool (principle: downstream repair should gate on measured verifier utility)
      - verifier_gain_delta: float (principle: verifier selection must improve over baseline before use)
      - false_positive_rate: float (principle: verifier acceptance errors must be visible)
      - false_negative_rate: float (principle: verifier rejection errors must be visible)
      - exact_ground_truth_count: int (principle: verifier gain must anchor to exact labels)
      - models_used: list (principle: mandated GGUF use must be auditable)
      - model_specs: list (principle: live LLM evidence must name exact model IDs and cache/runtime paths)
      - legacy_smoke_only_used: bool (principle: tiny models cannot become headline evidence)
      - cross_family_used: bool (principle: self-verification and cross-family verification must be separated)
      - prompt_hashes: list (principle: inputs must be auditable without embedding full prompts)
      - inference_substrate: dict (principle: local GGUF evidence must declare hardware, runtime, and cache)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3058-aquaforte-style-llm-guided-smt-pilot
    milestone: "2026.05.286"
    deliverable: "results/experiment_3058_aquaforte_style_llm_guided_smt_pilot_v1.json"
    title: "AquaForte-style LLM-guided SMT pilot"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 90
    track: "verification"
    inference_substrate: "local_sota_gguf_plus_exact_solver"
    requires_gpu: true
    gated_on:
      - upstream: exp3057-local-sota-solution-verifier-gain-panel
        artifact_field: solution_verifier_calibration_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3044-smt-sat-validator-tree-exactness-upgrade
        verdict: "complete: validator_tree_exactness_ready=true; verified=1; unresolved=1; fallback_only=1; correction_sets=1"
        addressed_by: "Extends exact validator evidence with LLM-proposed SMT instantiations while preserving solver fallback authority."
        retire_if_same_verdict: true
      - experiment_id: exp3030-validator-frontier-corrigendum-v2
        verdict: "complete: verified=40; irrelevant=2; unresolved=2; fallback_only=1; missing_authority=0"
        addressed_by: "Tests whether LLM semantic guidance can reduce unresolved/fallback-only cases without weakening soundness."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. AquaForte uses LLM semantic guidance for SMT instantiation while preserving formal validation and fallback. This task must keep solvers as authority.

      MODEL_SPECS
      Headline SOTA local GGUF candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Use at least one of these for any live LLM proposal. Legacy small models are allowed only as legacy_smoke_only=true CPU smoke tests and cannot satisfy llm_guided_smt_pilot_ready.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3044_smt_sat_validator_tree_exactness_upgrade_v1.json
      - results/experiment_3057_local_sota_solution_verifier_gain_panel_v1.json
      - python/carnot/verification if present
      - tests/python relevant to SMT/SAT behavior
      - research-references.md

      TASK
      Run a tiny LLM-guided SMT instantiation pilot where a mandated local GGUF proposes candidate instantiations and exact solver checks decide validity.

      CONCRETE STEPS
      0. PRECONDITIONS: confirm exp3057 is ready, exact solver tooling is available, and at least one mandated GGUF can load. If not, write the appropriate blocked verdict and stop.
      1. Select 4-8 tiny quantified or uninterpreted-function-inspired fixtures, or simpler SMT fixtures if UF support is not present locally.
      2. Ask the mandated local GGUF to propose instantiations or variable/function mappings, with prompt hashes and decode settings recorded.
      3. Validate every proposal with Z3/CVC5 or the repo's exact solver path. Never accept an LLM proposal without solver confirmation.
      4. Compare against solver-only fallback and report whether guidance reduced timeout/unresolved/fallback-only cases.
      5. Set formal_fallback_preserved=true only if solver-only fallback remains available and authoritative.

      REQUIRED ARTIFACT FIELDS:
