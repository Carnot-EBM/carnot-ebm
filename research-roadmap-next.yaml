    \ result is complete_structural_energy_s2v3_inconclusive_insufficient_corpus_diversity.\"\n  verifier_is_oracle:\n\
    \    principle: \"MUST be false for the energy ranking (oracle-distinct); the binary-accuracy CONTROL\
    \ is execution-grounded.\"\n  n_available_games:\n    principle: \"the full offline corpus size (ls\
    \ environment_files/) -- the .443 B1 audit verifies this against the real corpus; the gate requires\
    \ effective >= max(10, 0.6*this).\"\n  n_games_attempted:\n    principle: \"must ~= n_available_games\
    \ -- S2-v2's failure was testing 5 of 25; a corpus-wide test attempts ALL games.\"\n  n_effective_games:\n\
    \    principle: \"games whose candidate pool spans > 1e-3 off-path cell_recall -- must be >= max(10,\
    \ ceil(0.6*n_available)) for a PASS/BOUNDED verdict; else INCONCLUSIVE.\"\n  game_results:\n    principle:\
    \ \"per-game candidate_rows (heldout_cell_recall + offpath_structural_energy + accuracy) + energy-selected\
    \ vs accuracy-selected candidate -- the corpus-wide per-game log.\"\n  energy_minus_accuracy_delta_ci95:\n\
    \    principle: \"must EXCLUDE 0 for PASS, on >= the required effective games -- a corpus-wide delta,\
    \ not n=5.\"\n  positive_control_passed:\n    principle: \"REQUIRED for a BOUNDED verdict -- a documented\
    \ headroom upper bound proving the diverse pool contains a candidate the accuracy gate misses, so\
    \ BOUNDED means 'energy could have won but didn't'.\"\n  candidates_genuinely_induced:\n    principle:\
    \ \"the diversity must come from genuinely-induced engines (varied rounds/seeds), NOT an injected\
    \ broken 0.0-recall sabotage candidate.\"\n  live_path_reachable:\n    principle: \"the energy gate\
    \ must be in the E3AgentPolicy import closure (arc_orphan_solver_lint).\"\n  preconditions_checked:\n\
    \    principle: \"records the arcade / corpus checks so a silent-missing-resource run cannot fabricate\
