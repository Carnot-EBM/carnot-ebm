  title: Bind fourteen tasks and freeze decision-margin training controls
  phase: 1
  track: science
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 40
  per_unit_rows: true
  milestone: 2026.10.712
  deliverable: results/experiment_8234_v712_decision_margin_methods.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prior_failures:
  - experiment_id: exp8224-utility-audit
    verdict: complete_null_utility_audit
    addressed_by: Replace fixed-head residual patches with label-independent decision-margin weighting during
      fitting; require matched weighted simple controls and retire this objective if the registered benefit
      remains null.
    retire_if_same_verdict: true
  model: opus
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V711 scheduled fourteen tasks; twelve executed and two were pre-gate blocked. Exp8224 found zero action gain over energy_global. Residual calibration did not change the useful decision boundary. The new mechanism changes the training objective, not evidence, action permissions or generator weights.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/v711_current_contract.py; python/carnot/verify/restricted_energy_8208.py; python/carnot/verify/restricted_action_rule_8207.py; python/carnot/verify/utility_patch_methods_8219.py; results/experiment_8224_v711_utility_audit.json; results/experiment_8233_v711_capstone.json; research-references.md
    TASK:
    Bind fourteen tasks and freeze decision-margin training controls. Deliver results/experiment_8234_v712_decision_margin_methods.json. Create the thin runner scripts/experiments/experiment_8234_v712_decision_margin_methods.py. Store primitive evidence under results/raw/experiment_8234_v712_decision_margin_methods/. Separate execution readiness from benefit.
    CONCRETE STEPS:
    0. PRECONDITIONS: Emit a flushed start line. Authenticate input schemas and hashes, current writable private scratch and required resources. Record commands and exits. Missing external operands produce complete_blocked_<operand>, verdict_class=blocked. Do not invent inputs or silently replace missing rows.
    1. Emit a flushed progress line at every phase boundary and before and after every model load, generation, benchmark and subprocess. Print completed/pending counts inside long loops and a heartbeat at least every 60 seconds while children run. Keep every output gap below 600 seconds. Use unbuffered output, bounded child deadlines and process-group cleanup. Write any file over about 200 lines in several tool calls of at most about 150 lines, with a progress message between calls. Split long work into resumable batches; no single huge tool call. Do not pad runtime.
    2. Extend the relevant REQ-* and SCENARIO-* before implementation. Write focused failing tests first. Preserve existing tests and assertions. Use private fixtures outside results/ and scratch outside the repository root. Freeze owned validation commands before measurement. No generator weight updates or external publication.
    3. Declare no_model_load, MODEL_SPECS=[] and zero current LLM calls. Use aggregation_from_upstream_artifacts for reductions or verifier_ensemble_against_cached_candidates for fitting/scoring. Describe trained_head_specs separately; historical Qwen provenance is not a current call.
    4. Bind first_id=8234 and count=14 against the visible table, complete JSON and canonical digest. Compare staged authority now and actual active authority after activation; never copy staged YAML into the active slot. Preserve V711 in research-roadmap-v711-preserved-20261007.md. Snapshot owned current sources; no archive-wide reconstruction. Contract readiness is independent of scientific method readiness.
    5. Freeze openspec/change-proposals/v712-decision-margin-protocol.json before fitting. Authenticate the original V707/V709 sixteen-feature source rows, head_fit/temperature_fit/calibration/reserved roles and 128 reserved slots. Keep already exposed sources explicitly exposed development. Do not select new roles using outcomes or access official test data.
    6. Use p0 from the frozen native Qwen probability before any label-trained calibration. Compute expected losses accept=5*p0, reject=1-p0, escalate=.5; accept is feasible only in the historical V707 accepted set. Let d be second-smallest minus smallest feasible loss. Set w=1+4*exp(-d/.05), computed without labels and bounded in [1,5]. Missing p0 or features preserves a missing slot. This decision-sensitive weighting is a heuristic inspired by arXiv:2606.10187, not conformal inference.
    7. Freeze six fits: radial energy, additive and logistic, each uniform-weighted and margin-weighted. Reuse each original 17-coefficient basis and parameter initialization. Minimize weighted mean binary log loss plus the existing ridge term; uniform means w=1. Keep identical fold geometry, ridge candidates, folds, iteration/deadline budget and unweighted temperature calibration across paired arms. Do not add post-fit utility patches. Freeze exact numerical constants from qualified source code into the protocol.
    8. Choose the primary comparator only on calibration-role data from four simple-head variants plus uniform energy and the frozen V711 energy_global. Choose lowest all-slot decision cost, then unweighted Brier, then fixed arm order. Require weighted energy comparisons with both equally weighted simple heads. Freeze H1 lower 97.5% paired source-bootstrap gain>.02, >=5 improved sources, >=96 complete/128 and >=12/class; Brier worsening<=.01, zero extra false accepts, and cost worsening<=.02 against each simple control and historical accepted baseline. Ten thousand draws, seed7128239; no widening acceptance permissions.
    9. Freeze H2 as the unchanged V710/V711 delayed protocol, including alpha=.025 and independent retention. H1/H2 each spend alpha=.025. Validate weight derivatives by finite differences and the uniform limit, duplicate roles, label-independent weights and non-firing null controls on private fixtures. Methods readiness means executable methods, not an observed benefit.
    10. Run applicable private E2E-018/021 from ops/e2e-test-plan.md. Run relevant unit and consumer tests, measured 100% changed-code coverage including real CLI/child statements, scoped Ruff check/format, strict mypy, and scripts/check_spec_coverage.py --files <owned-test-files>. Preserve argv, expected/actual exits, clocks and full stdout/stderr hashes. Keep bounded repository-health diagnostics separate; known failures do not become a global pass.
    11. Cold-replay primitives in a fresh process, including negative/tamper cases. Validate a private candidate through unchanged primary_publication terminal checks, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Publish atomically to results/experiment_8234_v712_decision_margin_methods.json after normal exit and required checks; retain honest failure artifacts and historical primary bytes. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. Do not modify research-roadmap.yaml.
