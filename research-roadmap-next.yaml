      CONTEXT:
      Exp5525 classified the live SOTA structured-output failure modes. This task may run only after the taxonomy artifact is ready. The goal is not to score reasoning quality yet; it is to produce schema-valid candidate rows that exact validators can read.

      MODEL_SPECS for any LLM call in this experiment:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
