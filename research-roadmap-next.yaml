        addressed_by: "This experiment preserves the clean spline-local substrate but changes the question to a multi-duration nonstationary map with frozen, retain/replay, reset/adapt, and loss-smoothed arms and independent ALE components."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      The exact Exp5616 fixture makes it possible to test the central V507 hypothesis from arXiv:2607.05609: retained knowledge can be a warm-start advantage for short shifts and a stationary bias for long conflicting tasks. Exp5608 is the clean KAN prerequisite, not a result to assume. Today is {date}.

