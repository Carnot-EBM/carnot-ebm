  - id: exp3139-live-sota-verifier-rerun-v7
    milestone: "2026.05.292"
    deliverable: "results/experiment_3139_live_sota_verifier_rerun_v7.json"
    title: "Live SOTA verifier rerun v7"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 110
    track: "verification"
    inference_substrate: "local_sota_or_blocked"
    requires_gpu: true
    gated_on:
      - upstream: exp3138-canonical-answer-vericot-grounding-pilot
        artifact_field: canonical_grounding_pilot_v1_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3124-difficulty-stratified-live-sota-verifier-panel-v6
        verdict: "complete_blocked_false_accept: false_accept_rate=0.5; live_call_count=6; headline_claim_allowed=false"
        addressed_by: "Reruns only after root-cause autopsy, exact-safe contract, and canonical/premise grounding; known false-accept rows are mandatory regression rows."
        retire_if_same_verdict: true
      - experiment_id: exp3113-diagnostic-local-sota-verifier-calibration-v5
        verdict: "complete: diagnostic_local_sota_verifier_calibration_v5_ready=true; verifier_gain_delta=0.518519; diagnostic_only=true"
        addressed_by: "Moves from diagnostic calibration to live SOTA false-accept-gated evidence under exact labels."
        retire_if_same_verdict: true
      - experiment_id: exp3099-local-sota-confidence-abstention-panel
        verdict: "complete: abstention_panel_v3_ready=true; abstention_precision=0.0; rejection_recall=1.0; false_accept_rate=0.0"
        addressed_by: "Uses the .291/.292 exact false-accept regression set rather than confidence-only abstention."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. This is the live verifier rerun after the .291 false-accept autopsy and acceptance contract. Success requires reducing false accepts, not just producing another live artifact.

      PRECONDITIONS
      0. Read results/experiment_3123_sota_cache_preconditions_manifest_v2.json, results/experiment_3137_exact_safe_accept_abstain_contract_v1.json, and results/experiment_3138_canonical_answer_vericot_grounding_pilot_v1.json first. If no mandated model is locally usable, write a complete blocked/diagnostic artifact with live_call_count=0 and headline_claim_allowed=false.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
      - unsloth/gemma-4-31B-it-GGUF (flagship dense)
      - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE)
      Legacy small models may be recorded only as CPU smoke-tests and must not headline results.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3123_sota_cache_preconditions_manifest_v2.json
      - results/experiment_3136_false_accept_root_cause_autopsy_v1.json
      - results/experiment_3137_exact_safe_accept_abstain_contract_v1.json
      - results/experiment_3138_canonical_answer_vericot_grounding_pilot_v1.json
      - results/experiment_3124_difficulty_stratified_live_sota_verifier_panel_v6.json
      - python/carnot/verify if present
      - tests if verifier tests exist

      TASK
      Rerun the difficulty-stratified local SOTA verifier panel with the exact-safe contract and regression rows. Exact solvers/tests remain the only authority.

      CONCRETE STEPS
      1. Build the rerun set from .291 false-accept regression rows plus balanced exact fixtures across contradiction, satisfiable drift, medium/hard, and fragment-code families.
      2. Use cached_sota_pair() or the cache manifest to select mandated local GGUF models; do not use legacy small models for headline evidence.
      3. Run bounded live calls if a mandated model is usable; record prompt hashes, model paths, selected model IDs, extracted/canonical answers, exact labels, and contract decisions.
      4. Apply the exact-safe contract and report false_accept_rate, false_reject_rate, abstention_rate, verifier_gain_delta, and repair_gate_candidate_state.
      5. Add deterministic metric checks or tests for the new result aggregation.

      REQUIRED ARTIFACT FIELDS:
      - live_verifier_rerun_v7_ready: bool (principle: repair gate needs a rerun readiness field)
      - model_specs: list (principle: mandated local model policy must be visible)
