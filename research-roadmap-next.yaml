milestone: "2026.08.570"
milestone_title: "Joint Proof Graphs and Prospective Self-Learning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6571-v570-evidence-gate-and-retirement-root
    milestone: "2026.08.570"
    deliverable: results/experiment_6571_v570_evidence_gate_and_retirement_root.json
    title: "V570 immutable evidence, gate, and retirement root"
    priority: critical
    track: infrastructure-governance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 90
    model: opus
    prior_failures:
      - experiment_id: exp6565-v569-evidence-and-retirement-contract
        verdict: "complete_v569_evidence_and_retirement_contract_ready: V568 artifacts are content-addressed; Exp6562 is disqualified science; Exp6563 and Exp6564 are clean nulls; V569 gate, failure, model, ARC, hardware, Rust-fusion, and protected-file contracts close"
        addressed_by: "Exp6565 first carried a stale DURATION_TOO_SHORT stamp even though its later live replay was clean. Exp6571 rebuilds every V570 eligibility row and gate from the terminal V569 artifacts, preserves both stamped and fresh verifier results, and records the exact GGUF admission root cause."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 2026.08.569 completed six tasks. Exp6565 and Exp6566 closed evidence and method contracts. Exp6567 resolved all three mandated model blobs, tokenizers, CUDA llama.cpp support, and sequential memory conditions, but blocked before inference because hash-only Hugging Face blob paths failed filename-derived language-model and quantization checks. Exp6568 gate-blocked, Exp6569 produced no artifact, and Exp6570 correctly blocked on missing proof rows. V570 needs one additive evidence root before any rerun. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6565_v569_evidence_and_retirement_contract.json through {project_root}/results/experiment_6570_proof_obligation_independent_audit.json; confirm the exact missing Exp6569 path
      - {project_root}/research-complete.yaml, {project_root}/research-references.md, {project_root}/ops/exclusion_manifest.yaml, {project_root}/ops/conductor-log.md, and {project_root}/ops/known-issues.md
      - {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/artifact_convention_audit.py, {project_root}/scripts/conductor_gates.py, {project_root}/scripts/roadmap_schema.py, and {project_root}/scripts/exclusion_manifest_lint.py
      - {project_root}/_bmad/prd.md, {project_root}/_bmad/architecture.md, relevant capability specs, {project_root}/_bmad/traceability.md, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build the immutable V570 evidence, gate, failed-scope, and retirement root. Import V569 evidence only by exact path and content hash. Freeze every V570 task ID, deliverable, gate field, prior-failure entry, model rule, ARC boundary, hardware boundary, and terminal verdict rule.

      CONCRETE STEPS
      0. PRECONDITIONS: record git status, CPU, RAM, disk, Python, Rust, PyO3, Z3, model-cache paths, artifact paths and hashes, protected-file hashes, monotonic timer resolution, architecture freshness, and network status. Perform no LLM load and no hardware command.
      1. Add or confirm REQ-* and SCENARIO anchors for immutable evidence import, live verifier replay, closed verdict classes, exact gate spelling, prior-failure completeness, flagship policy, ARC provenance, hardware receipts, and atomic terminal output. Write focused tests first if implementation changes are needed.
      2. Run fresh adversarial verification, row-consistency, and artifact-convention checks on Exp6565 through Exp6570. Emit one eligibility row per expected artifact, including missing Exp6569, with path, hash, status, verdict, verdict_class, stamped flags, fresh flags, command, exit, duration, and reason.
      3. Record the Exp6567 root cause from rows, not prose: the three large blobs resolved; embedded tokenizers, CUDA runtime, and memory checks passed; `model_identity_and_file_shape` failed because hash-only paths produced `language_model_file=false` and `quantization_known=false`; no generation ran.
      4. Classify Exp6568 as a gate-block with a corrected blocked class for V570 import. Classify Exp6569 as missing, not null. Classify Exp6570 as a valid blocked audit. Do not claim source extraction or graph-Potts utility ran.
      5. Freeze every structured gate. Confirm each upstream task exists in this roadmap and each artifact field is spelled identically in that task's REQUIRED ARTIFACT FIELDS. Confirm no requires-chain references a retired experiment ID.
      6. Freeze the changed-mechanism and repeat-retirement map. Permit GGUF rerun only through content-derived header metadata plus actual execution. Permit source extraction only through source spans and joint sufficiency. Permit Rust only as one fused end-to-end workload. Permit hardware only after a changed receipt.
      7. Attack hash aliases, missing artifacts, aggregate-only claims, stamped-versus-live verifier disagreement, false model admission, wrong verdict classes, field drift, legacy-model substitution, retired ConstraintIR reuse, ARC solve laundering, unchanged hardware commands, and protected-file mutation.
      8. Set v570_evidence_contract_ready_score=1.0 only when all eligibility, gate, failure, model, ARC, hardware, and protected-file contracts close. Set rust_fusion_reopen_ready_score=1.0 only when the V570 fused workload is materially different from Exps6563-6564 and the repeat-retirement rule is frozen.
      9. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, roadmap schema validation, gate audit, exclusion-manifest lint, prior-failure validation, row lint, adversarial verification, applicable E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6571_v570_evidence_gate_and_retirement_root.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state prevents a bootstrap record from posing as the evidence root."
        honest_verdict:
          principle: "The verdict must state eligibility, failed scopes, and retirement boundaries with a terminal prefix."
        verdict_class:
          principle: "A closed enum carries null, blocked, partial, and disqualified state downstream."
        v569_artifact_eligibility_rows:
          principle: "One row per expected V569 artifact makes missing and unusable evidence visible."
        live_verifier_and_duration_rows:
          principle: "Fresh commands, exits, flags, and monotonic durations resolve stale stamped findings."
        gguf_admission_root_cause:
          principle: "The next mechanism must target the observed hash-only path defect, not repeat generic fit prediction."
        v570_gate_contract_rows:
          principle: "Every downstream gate must name an in-roadmap task and exact upstream field."
        prior_failure_and_retirement_rows:
          principle: "Every scope match needs a changed mechanism and repeat-retirement rule."
        model_arc_and_hardware_boundary:
          principle: "The root freezes flagship, live-ARC, and zero-unchanged-command rules."
        v570_evidence_contract_ready_score:
          principle: "One binary field gates tasks that require the full V570 evidence contract."
        rust_fusion_reopen_ready_score:
          principle: "A separate binary field permits only the changed fused workload and freezes retirement."
        per_unit_rows:
          principle: "Artifact-level rows prevent one missing or invalid input from hiding in an aggregate."
        aggregate_row_recomputation:
          principle: "Readiness fields must derive only from emitted rows."
        gate_check_summary:
          principle: "A blocked verdict must name the failed check and observed value."
        preconditions_checked:
          principle: "Resource and input receipts distinguish missing prerequisites from evidence failure."
        protected_files_unchanged:
          principle: "The task must not mutate research-roadmap.yaml or scripts/research_conductor.py."
        inference_substrate:
          principle: "This is immutable artifact audit with no new LLM inference."
        verifier_is_oracle:
          principle: "Artifact validation is audit authority, so a clean result cannot use a positive class."
        field_provenance:
          principle: "Every headline field identifies source rows, hashes, and reducer."
        duration_s:
          principle: "Monotonic duration exposes skipped contract work."
        tests_run:
          principle: "Named commands and exit codes make the contract reproducible."
        reproducibility_checksum:
          principle: "A final content hash detects terminal-record mutation."
      Set inference_substrate=immutable_v569_artifact_gate_failure_and_retirement_audit_no_llm and verifier_is_oracle=true. A ready contract uses verdict_class=null, a usable subset uses partial, missing prerequisites use blocked, and false provenance uses disqualified.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6571_v570_evidence_gate_and_retirement_root --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6572-content-derived-gguf-metadata-resolver
    milestone: "2026.08.570"
    deliverable: results/experiment_6572_content_derived_gguf_metadata_resolver.json
    title: "Content-derived GGUF metadata for hash-only cache blobs"
    priority: critical
    track: model-runtime-infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 90
    agent_type: codex
    model: gpt-5.6-sol
    prior_failures:
      - experiment_id: exp6567-sequential-flagship-gguf-admission
        verdict: "blocked: no flagship family completed authentic runtime admission; admitted=[]; blocked=[unsloth/Qwen3.6-35B-A3B-GGUF,unsloth/gemma-4-31B-it-GGUF,unsloth/gemma-4-26B-A4B-it-GGUF]"
        addressed_by: "Exp6567 inferred language-model and quantization identity from hash-only cache paths. Exp6572 reads bounded GGUF header and llama.cpp metadata from content, verifies repository provenance separately, and fails closed on tokenizer-only, truncated, or mismatched blobs."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6571-v570-evidence-gate-and-retirement-root
        artifact_field: v570_evidence_contract_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Exp6567 found the three mandated cached model blobs and a usable CUDA llama.cpp runtime. Admission stopped because Hugging Face stores blobs under hash-only paths. A filename and suffix check therefore misclassified real model GGUFs and could not infer quantization. V570 needs a small content-derived metadata layer before it retries inference. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, scripts/experiment_template.py, and the V570 roadmap document
      - {project_root}/results/experiment_6567_sequential_flagship_gguf_admission.json and {project_root}/results/experiment_6571_v570_evidence_gate_and_retirement_root.json
      - resolve_cached_gguf(), cached_sota_pair(), model preflight, embedded-tokenizer, llama.cpp launch, and Hugging Face cache-provenance helpers plus their tests
      - the local GGUF reader dependency or llama.cpp metadata command already installed; do not add a large new dependency when bounded header parsing is sufficient
      - relevant model-ingestion specs, exclusions, architecture, traceability, status, changelog, and E2E plan

      TASK
      Implement and validate content-derived GGUF identity for hash-only Hugging Face cache blobs. Preserve repository and revision provenance independently of the local filename. Produce a reusable admission record, not a one-off path exception.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate the structured gate and record expected and observed values, upstream hash, disk, RAM, Python, installed GGUF or llama.cpp metadata support, cache layout, blob sizes, trusted existing hashes, and protected-file hashes. Do not load an LLM and do not read every multi-GB tensor byte.
      1. Add or confirm REQ-* and SCENARIO anchors for hash-only blob support, bounded header reads, repository provenance, shard identity, tokenizer-only rejection, truncation rejection, mismatch rejection, and atomic output. Write focused tests first.
      2. Inspect the current resolver and reproduce Exp6567's false negatives on all three blobs. Preserve that reproduction as failing-before rows.
      3. Implement one reusable reader that validates GGUF magic and version and extracts architecture, general file type or quantization metadata, tokenizer metadata, model-vs-tokenizer identity, tensor count, shard metadata when present, and content length needed for sanity checks.
      4. Bind the local blob to repository ID, revision or snapshot, manifest or symlink target, expected shard order, and existing trusted hash. Do not infer repository identity from model metadata alone.
      5. Add positive fixtures for the three cached flagship blobs and negative fixtures for a non-GGUF file, truncated header, tokenizer-only GGUF, wrong repository mapping, unsupported version, and inconsistent shard metadata. Read only bounded bytes for negative tests.
      6. Confirm the resolver produces an explicit quantization/file-type value from content or a supported llama.cpp metadata surface. A filename guess cannot satisfy the gate.
      7. Attack renamed blobs, symlink aliases, prefix-only magic collisions, huge declared metadata lengths, malformed UTF-8, tensor-count overflow, tokenizer-only false admission, repository swaps, and partial shards.
      8. Set gguf_blob_metadata_ready_score=1.0 only when all three flagship blobs pass content and provenance checks and every negative fixture fails closed. Emit one row per blob and fixture.
      9. Write one terminal artifact atomically. Run focused unit tests, lint, spec coverage, row consistency, adversarial verification, applicable model-ingestion E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6572_content_derived_gguf_metadata_resolver.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The resolver task must end as ready, partial, blocked, or disqualified."
        honest_verdict:
          principle: "The verdict distinguishes fixed content identity from another blocked admission attempt."
        verdict_class:
          principle: "Infrastructure readiness cannot masquerade as scientific utility."
        gate_check_summary:
          principle: "A blocked task names the upstream gate and observed value."
        failing_before_rows:
          principle: "The exact Exp6567 false negatives prove the repair targets the observed defect."
        gguf_blob_metadata_rows:
          principle: "Each flagship blob reports content metadata and repository provenance independently."
        negative_fixture_rows:
          principle: "Malformed, tokenizer-only, truncated, and mismatched inputs must fail closed."
        bounded_read_receipts:
          principle: "Metadata inspection must not silently scan or copy all tensor bytes."
        repository_revision_and_hash_receipts:
          principle: "Content type alone cannot establish model provenance."
        gguf_blob_metadata_ready_score:
          principle: "This exact binary field gates real sequential admission."
        per_unit_rows:
          principle: "Every blob and fixture remains independently recheckable."
        aggregate_row_recomputation:
          principle: "Readiness derives only from emitted blob and fixture rows."
        preconditions_checked:
          principle: "Tool and cache receipts separate missing inputs from parser failure."
        protected_files_unchanged:
          principle: "The resolver must preserve both protected orchestration files."
        inference_substrate:
          principle: "This task reads bounded file metadata and invokes no model."
        verifier_is_oracle:
          principle: "Exact format checks are oracle authority, so readiness is classed null."
        field_provenance:
          principle: "Every metadata field identifies byte offsets, tool output, or cache manifest source."
        duration_s:
          principle: "Runtime reveals skipped fixtures or accidental full-file scans."
        tests_run:
          principle: "Named tests and exits prove the reusable resolver behavior."
        reproducibility_checksum:
          principle: "A content hash protects the terminal metadata record."
      Set inference_substrate=bounded_gguf_header_and_cache_provenance_inspection_no_llm and verifier_is_oracle=true. Use verdict_class=null when ready, partial for a usable subset, blocked for missing cache or tools, and disqualified for unbounded or filename-derived evidence.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6572_content_derived_gguf_metadata_resolver --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6573-sequential-flagship-gguf-admission-v2
    milestone: "2026.08.570"
    deliverable: results/experiment_6573_sequential_flagship_gguf_admission_v2.json
    title: "Sequential flagship GGUF admission v2 by actual execution"
    priority: critical
    track: model-runtime
    requires_gpu: true
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 240
    model: opus
    prior_failures:
      - experiment_id: exp6567-sequential-flagship-gguf-admission
        verdict: "blocked: no flagship family completed authentic runtime admission; admitted=[]; blocked=[unsloth/Qwen3.6-35B-A3B-GGUF,unsloth/gemma-4-31B-it-GGUF,unsloth/gemma-4-26B-A4B-it-GGUF]"
        addressed_by: "Exp6572 replaces Exp6567's filename-derived model and quantization checks with content-derived GGUF metadata. Exp6573 then requires actual one-model-at-a-time generation, sampled GPU use, clean exit, unload, and bounded recovery for each family."
        retire_if_same_verdict: true
      - experiment_id: exp6553-prospective-sota-continuous-self-learning
        verdict: "blocked: current, retention, and future-support not evaluated; safety not promoted; receipts failed gpu_vram_contract"
        addressed_by: "Exp6553 predicted fit from an impossible free-VRAM equality and loaded no model. Exp6573 uses execution as fit authority and keeps quality and learning claims out of the admission task."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6571-v570-evidence-gate-and-retirement-root
        artifact_field: v570_evidence_contract_ready_score
        op: "=="
        value: 1.0
      - upstream: exp6572-content-derived-gguf-metadata-resolver
        artifact_field: gguf_blob_metadata_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      V569 did not invoke any flagship model. V570 now has a content-derived metadata prerequisite for hash-only cache blobs. This task admits each mandated family only through authentic sequential execution. It measures runtime availability, not model quality. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, scripts/experiment_template.py, and the V570 roadmap document
      - {project_root}/results/experiment_6567_sequential_flagship_gguf_admission.json, {project_root}/results/experiment_6571_v570_evidence_gate_and_retirement_root.json, and {project_root}/results/experiment_6572_content_derived_gguf_metadata_resolver.json
      - cached_sota_pair(), resolve_cached_gguf(), content-derived GGUF metadata, embedded-tokenizer, llama.cpp launch, process receipt, GPU telemetry, timeout, cleanup, and unload helpers plus their tests
      - current model-ingestion specs, exclusions including Exp5284's CPU-only path retirement, architecture, traceability, status, changelog, and E2E plan

      TASK
      Admit every mandated flagship GGUF family through a real one-at-a-time llama.cpp load, bounded generation, clean exit, unload, and recovery check. Emit authentic model, process, GPU, token, output, timing, exit, and unload receipts. Do not infer fit from memory arithmetic.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Legacy Qwen3.5-0.8B and gemma-4-E4B-it may run CPU smoke only. They cannot satisfy admission.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate both structured gates and record expected and observed values, upstream paths and hashes, CPU, RAM, disk, CUDA and llama.cpp build receipts, per-GPU free memory and utilization, active processes, model metadata rows, timeout policy, protected-file hashes, and model load order. Do not kill unrelated GPU work.
      1. Add or confirm REQ-* and SCENARIO anchors for sequential admission, content identity, one-model residency, authentic GPU/process evidence, bounded generation, clean unload, recovery, legacy smoke exclusion, and atomic output. Write focused tests first for changed runtime logic.
      2. Freeze model order before loading. Choose an idle supported GPU from live receipts. Record why it is eligible. Preserve any busy GPU and active process.
      3. For each mandated family, resolve repository, revision, content-derived model metadata, embedded tokenizer, and exact blob hash. Launch exactly one model. Record PID, command digest, CUDA device, GPU memory before/during/after, sampled utilization, load time, token count, output hash, stop reason, exit code, and stderr hash.
      4. Require a bounded nonempty generation that follows the prompt enough to prove token flow. Do not use answer accuracy, self-report, or tokenizer-only output as admission evidence.
      5. Shut down normally. Confirm the PID is gone, the port is closed, and memory returns within a preregistered tolerance. Run a bounded recovery smoke before the next family. Never call a broad zombie reaper that can kill work on another GPU.
      6. If a model fails, record the exact failing stage and observed value. Attempt only the frozen bounded recovery. Continue to other families when safe. Do not substitute a smoke model.
      7. Attack stale PIDs, fake CUDA builds, zero-layer offload, tokenizer-only loads, reused output, wrong repository, split-shard omissions, process-wrapper exit confusion, unload failure, cross-GPU interference, and aggregate readiness with one missing family.
      8. Set each family_admitted_score from its row. Set all_mandated_models_loaded_score=1.0 only when all three authentic family rows pass. A partial admission stays partial and cannot open downstream model science.
      9. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, row consistency, adversarial verification, applicable model-runtime E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6573_sequential_flagship_gguf_admission_v2.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "Admission must close terminally even when one family fails."
        honest_verdict:
          principle: "The verdict names admitted and blocked families without making a quality claim."
        verdict_class:
          principle: "Runtime readiness is null or partial evidence, not positive science."
        gate_check_summary:
          principle: "A gate block names both exact fields and observed values."
        model_specs:
          principle: "The artifact must list all three mandated repositories and selected blobs."
        model_metadata_and_hash_rows:
          principle: "Every load binds content identity to repository provenance."
        sequential_load_generation_rows:
          principle: "Each family reports authentic process, GPU, token, output, timing, and exit evidence."
        unload_and_recovery_rows:
          principle: "One-model-at-a-time isolation requires clean unload before the next load."
        gpu_process_receipts:
          principle: "Sampled telemetry and PIDs distinguish real CUDA execution from prediction."
        family_admitted_scores:
          principle: "Per-family scores prevent partial success from hiding."
        all_mandated_models_loaded_score:
          principle: "This exact binary field gates the immutable source stream."
        per_unit_rows:
          principle: "One row per family and stage makes admission independently checkable."
        aggregate_row_recomputation:
          principle: "Overall readiness is the conjunction of emitted family rows."
        preconditions_checked:
          principle: "Live resource receipts separate environment blocks from model defects."
        protected_files_unchanged:
          principle: "Admission preserves both protected orchestration files."
        inference_substrate:
          principle: "The artifact names actual llama.cpp CUDA execution and selected GGUF files."
        verifier_is_oracle:
          principle: "Runtime checks are admission authority and cannot yield a scientific positive."
        field_provenance:
          principle: "Every field points to metadata, process, GPU, token, or reducer rows."
        duration_s:
          principle: "Monotonic duration exposes skipped loads and bounded recovery cost."
        tests_run:
          principle: "Named tests and exits prove admission and cleanup behavior."
        reproducibility_checksum:
          principle: "A final hash protects the terminal admission record."
      Set inference_substrate=sequential_local_llama_cpp_cuda_flagship_gguf_execution and verifier_is_oracle=true. Use verdict_class=null when all models admit, partial when a usable subset admits, blocked when no authentic model run is possible, and disqualified for predicted or fabricated receipts.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6573_sequential_flagship_gguf_admission_v2 --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6574-joint-sufficiency-method-contract
    milestone: "2026.08.570"
    deliverable: results/experiment_6574_joint_sufficiency_method_contract.json
    title: "SOTA hop-conditioned joint-sufficiency method contract"
    priority: critical
    track: research-method-sota-ingestion
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    prior_failures:
      - experiment_id: exp5923-sota-schema-supported-constraintir-ab
        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "Exp6574 does not generate or repair full ConstraintIR. It freezes source-byte-bound atomic obligations, compiler-owned exact semantics, a hop dependency graph, and joint-sufficiency abstention based on arXiv:2608.00585."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6571-v570-evidence-gate-and-retirement-root
        artifact_field: v570_evidence_contract_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Exp6566 preregistered source-span-bound proof obligations and graph-Potts learning. The V570 literature refresh adds a missing control from arXiv:2608.00585: independently supported pieces can still be insufficient for a composed multi-hop claim. V570 must freeze a hop-conditioned dependency graph and joint release rule before seeing live extraction outcomes. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, {project_root}/research-references.md, and the V570 roadmap document
      - {project_root}/results/experiment_6566_proof_obligation_and_graph_potts_method_contract.json and {project_root}/results/experiment_6571_v570_evidence_gate_and_retirement_root.json
      - {project_root}/python/carnot/extraction/, {project_root}/python/carnot/constraints/, {project_root}/python/carnot/verify/, current DRIFT intake, source-binding, exact-replay, and conflict-memory modules plus tests
      - {project_root}/results/experiment_5909_sota_constraint_synthesis_ab.json, {project_root}/results/experiment_5910_verification_guided_constraint_repair.json, and {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
      - arXiv:2608.00585 primary page and any content-pinned method notes added to research-references.md
      - relevant specs, exclusions, architecture, traceability, status, changelog, and E2E plan

      TASK
      Preregister and conformance-test source-byte-bound atomic proof obligations, hop-conditioned obligation nodes, dependency edges, joint-sufficiency release, abstention, frozen splits, comparative arms, attacks, acceptance gates, and retirement rules. Implement only bounded fixtures and contracts needed to make the method executable.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate the structured gate and record source availability and hash, Exp6566 hash, compiler and solver versions, corpus paths and hashes, CPU, RAM, disk, protected-file hashes, and no-LLM/no-hardware status.
