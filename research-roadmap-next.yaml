  - id: exp4457-generic-cast-grid-fsm-bank-sc25
    milestone: 2026.06.412
    title: "PHASE A3 (ARC NORTH STAR; operator MANDATORY) -- GENERIC cast-grid phase-FSM world-model operator + BANK sc25 provisional L2-L5: generalize sc25's per-game world model into a two-phase-FSM operator and drive it to REPRODUCE sc25's live-recorded deeper levels (provisional -> reproduced). Closes GAP-4432-LOO-SC25; +1..+4 levels."
