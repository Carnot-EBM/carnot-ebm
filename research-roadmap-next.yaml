  priority: critical
  track: arc-north-star
  max_turns: 200
  inference_substrate: live_llm_inference
  deliverable: results/experiment_4851_generation_coverage_diagnostic.json
  operator_override: '2026-06-26/2026-06-19 standing: the forward focus is the L1-first-contact GENERATION
    wall (energy CONCLUDED, exploration-prior CLOSED, perception-from-grid a proven null). This A1 is a
    DIAGNOSTIC measurement of proposer coverage (different deliverable shape from every prior lever) -- it
    does not rank/route/perceive a pool; it measures whether the pool can contain the winner. Reserved ARC
    headline slot.'
  prior_failures:
  - experiment_id: exp4704-object-centric-representation-builder
    verdict: 'complete: candidate_generation_coverage_delta_0.0 (object slots built but no winning-prefix
      coverage, first-win, or solve-rate lift on held-out games)'
    addressed_by: 'exp4704 (and the .432 generation-by-search + .433 controllable-novelty + the other ~14
      levers) all BUILT a generation/ranking/perception mechanism and reported a coverage/solve DELTA that
      nulled. This A1 does NOT build a lever: it MEASURES, for the EXISTING live proposer, whether the
      known-winning prefix is ever enumerated, and DECOMPOSES the loss (never-enumerated vs enumerated-but-lost
