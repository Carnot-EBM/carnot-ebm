milestone: "2026.05.176"
milestone_title: "exp1709 Findings Codification + Phase 4 / NLA Carry-Forwards + .174 Findings Audit"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
scope_reduction_compliance:
  rationale: "exp1709 (.175) discovered a FUNDAMENTAL near-critical sampler limit at beta=1.05 (no intervention in the 54-cell ablation closed the ground-truth gap; bimodal distribution observed). This finding is paper-v6 §6 ship-eligible and needs codification before paper-v6 §3 substrate prose locks in incorrect assumptions. .176 prioritizes that codification + the .172/.173 carry-forwards still SKIP-stranded."
