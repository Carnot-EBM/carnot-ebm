    milestone must preserve the key guardrails before any new experiment runs:
    live telemetry exists but the headline claim is blocked, FR-11 memory
    growth is positive but needs query-time utility, and hardware evidence
    remains bounded to dual RTX 3090 runtime, KV260 RTL source/sim, and THRML
    simulator preflight. Use {project_root} as the project root and {date} as
    the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - research-roadmap.yaml
    - research-complete.yaml
    - ops/conductor-log.md
    - ops/changelog.md
    - ops/status.md
    - results/experiment_1478_milestone_113_retro.json

    TASK:
    Write a terminal activation artifact for .114 that summarizes .113
    completion, records carry-forward guardrails, and writes the .114
    activation manifest without modifying research-roadmap.yaml or
    scripts/research_conductor.py.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - predecessor_milestone
    - predecessor_criteria_met
    - predecessor_criteria_total
    - activation_manifest_complete
    - telemetry_headline_block_preserved
    - self_learning_followup_allowed
    - hardware_claim_boundaries
