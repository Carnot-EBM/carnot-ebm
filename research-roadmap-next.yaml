      1. Add REQ-INFRA-6297 and scenarios to openspec/capabilities/research-harnesses/spec.md before implementation. Update _bmad/traceability.md.
      2. Classify all V542 deliverables with python/carnot/terminal_artifacts.py. Preserve exact missing, flagged, null, skipped, blocked, oracle-only, and ready states.
      3. Verify exactly 13 V543 tasks in Exp6297-Exp6309 order and prove no tracked or untracked ID or deliverable collision.
      4. Validate every structured gate against its upstream REQUIRED ARTIFACT FIELDS. Reject retired dependencies and incomplete prior_failures entries.
      5. Validate Codex routing and confirm that each live LLM task includes a mandated GGUF family in MODEL_SPECS.
      6. Run schema, gate, exclusion, prompt-ending, collision, and root-clutter checks. Keep focused and broad-suite receipts separate.
      7. Record post-test git status and adversarial-verify the artifact. Do not let an unrelated broad-suite failure erase focused results.

