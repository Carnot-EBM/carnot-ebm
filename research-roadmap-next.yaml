  - id: exp2815
    milestone: "2026.05.266"
    deliverable: "results/experiment_2815_cross_corpus_verifier_matrix.json"
    title: "Cross-Corpus Per-Verifier Dual-Condition Discriminative Matrix"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 30
    track: analysis

    gated_on:
      - upstream: exp2811
        artifact_field: leakage_delta
        op: '>='
        value: -1.0

    prior_failures:
      - experiment_id: exp2805
        verdict: "complete: SKIP due to pre-test cascade — no artifact produced"
        addressed_by: "exp2810 pre-test cascade fix resolves the blocking condition;
                       this carry-forward requires exp2811-2814 results to exist (upstream
                       artifacts). Upstream has new IDs (exp2811-2814) vs exp2807a/2802/2804/2803
                       in .265, but the scope is identical."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md.

      CONTEXT: With exp2811 (FoVer leakage isolation), exp2812 (MBPP), exp2813
      (HumanEval), exp2814 (TruthfulQA) artifacts produced, synthesize a per-
      verifier matrix showing which verifiers transfer across corpus shapes under
      both memory conditions.

      TASK: Build a verifier × corpus × condition AUROC matrix.

      CONCRETE STEPS:
        1. Load exp2811, exp2812, exp2813, exp2814 artifacts. For each, extract
           per_verifier_condition_a_auroc and per_verifier_condition_b_auroc.
           If any upstream artifact is a blocked_* verdict (precondition failed),
           mark those corpus cells as N/A and proceed with available data.

        2. Build a 3-D matrix: verifier × corpus × condition. The FoVer row
           comes from exp2811; MBPP from exp2812; HumanEval from exp2813;
           TruthfulQA from exp2814. Each cell = {production, architecture_only,
           learning_delta = production - architecture_only}.

        3. Classify verifiers into FOUR classes:
           - ARCHITECTURE_TRANSFER: condition-B AUROC >= 0.70 on ALL corpora
             with data. These are the cross-corpus workhorses.
           - MEMORY_AUGMENTED: condition-A >= 0.70 but condition-B < 0.60 on
             the primary corpus (FoVer). These rely on FR-11 state.
           - CORPUS_SPECIFIC: high (>= 0.70) on one corpus, < 0.60 on others,
             both conditions. e.g. Tier 0s (arithmetic-only heuristic).
           - LOW_SIGNAL: AUROC < 0.60 across all corpus×condition cells.

        4. Check diversity_gap_on_non_fover: how many ARCHITECTURE_TRANSFER
           verifiers cover each non-FoVer corpus with condition-B >= 0.70?

        5. Write artifact.

      REQUIRED ARTIFACT FIELDS:
