      Build and independently qualify a sealed context/candidate-atom benchmark from the ready hardness-controlled and non-pruning fixtures, with deterministic legal-atom enumeration, compatible/incompatible labels, near-semantic negatives, proof-preserving relabels, paraphrases, held families, claim flips, and shortcut controls; write results/experiment_5963_exact_atom_pair_fixture.json and its declared row files.

