  estimated_wall_time_min: 90
  per_unit_rows: true
  milestone: 2026.09.613
  deliverable: results/experiment_6996_v613_source_contract_preflight.json
  prompt: |
    CONTEXT:
    V612 completed all 12 conductor slots. Its capstone found one disqualified
    science boundary: mutation metadata predicted exact validity with AUROC
    0.9532275. V613 has exactly 13 tasks, exp6996 through exp7008. This first
    task freezes the execution-time literature delta and independently checks
    that the Markdown and YAML describe the same executable contract. It is
    advisory and may not gate another task.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/_bmad/prd.md
    - {project_root}/_bmad/architecture.md
    - {project_root}/research-references.md V613 Planner Refresh
    - {project_root}/research-roadmap-next.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_6995_v612_capstone.json
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/scripts/conductor_gates.py
    - {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Run a post-marker 2025-2026 source delta and build an independent V613
    document-YAML contract preflight. Verify task count, ordered IDs, exact
    titles, deliverables, structured gates, gate producers, model rules,
    comparative-row declarations, prior-failure discipline, and required
    artifact fields. Report findings without editing the conductor.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable V613 Markdown and YAML, V612 capstone,
       exclusion manifest, reference file, network access for the source
       search, and a writable artifact path. On failure, write
       blocked_v613_source_contract_preflight with gate_check_summary. Do not
       declare partial for an external missing input.
    1. Add REQ-REPORT-6996 and RED tests before implementation. Cover exact
       count 13, ordered range exp6996-exp7008, title and deliverable parity,
       gate parity, missing producers, misspelled fields, prior-failure schema,
       MODEL_SPECS rules, verdict_class, and prompt-tail requirements.
    2. Search arXiv, OpenReview, Hugging Face Papers, Semantic Scholar citation
       routes for EBT 2507.02092 and ARM-EBM 2512.15605, Extropic writing,
       GitHub discovery, and Logical Intelligence. Limit the delta to sources
       published or changed after the V613 planner marker. Prefer primary
       sources and preserve URL, date, query, and access outcome per source.
    3. If a genuinely new relevant source appears, append a dated post-marker
       subsection to research-references.md. Do not rewrite earlier entries.
       Record a no-change row when no source changes the plan.
    4. Parse the Markdown task table and YAML independently. Require milestone
       2026.09.613, exactly 13 tasks, and the exact ordered IDs exp6996 through
       exp7008. Compare every title, deliverable, order, and structured gate.
    5. For each gated task, prove the upstream task occurs earlier in this
       roadmap and declares the exact bare artifact field in its own REQUIRED
       ARTIFACT FIELDS. Reject cross-milestone structured gates.
    6. Check that every task declares verdict_class and blocked diagnostics,
       every comparative task has per_unit_rows=true, and every reused failed
       scope has all four prior_failures fields. Check that no task uses a
       retired exp_id or depends on one.
    7. Check that every LLM experiment declares at least one required GGUF in
       MODEL_SPECS. Confirm Exp6998 declares all three. Confirm legacy small
       models are smoke-only. Check that no-LLM substrate names end in _no_llm.
    8. Set v613_source_delta_complete_score=1 when every requested source route
       has a terminal row. Set v613_task_contract_conforms_score=1 only when all
       13 contract rows agree and every gate producer resolves. A mismatch is
       disqualified, not partial, and this task must not repair it silently.
    9. Run focused tests, YAML parsing, artifact validation, adversarial
       verification, row-consistency lint, OpenSpec coverage, and root-clutter
       checks. Do not activate or archive a roadmap.
    10. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
        principle per required field and both
        v613_source_delta_complete_score and
        v613_task_contract_conforms_score; preconditions_checked;
        inference_substrate (deterministic_source_and_contract_audit_no_llm);
        duration_s; source_artifact_hashes; source_query_rows;
        primary_source_rows; secondary_source_rows; semantic_scholar_rows;
        post_marker_delta_rows; reference_append_rows; rows;
        markdown_task_rows; yaml_task_rows; task_contract_rows;
        title_parity_rows; deliverable_parity_rows; gate_contract_rows;
        gate_producer_rows; prior_failure_rows; retired_id_rows;
        model_compliance_rows; substrate_name_rows; artifact_field_rows;
        command_receipt_rows; expected_task_count (13); observed_task_count;
        expected_id_order; observed_id_order;
        v613_source_delta_complete_score;
        v613_task_contract_conforms_score; random_seed;
        reproducibility_checksum; gate_check_summary with failed check,
        expected value, and observed value for any blocked verdict;
        verifier_is_oracle (false); verdict_class
        (positive | circular_positive | null | blocked | disqualified | partial);
        honest_verdict with a terminal prefix consistent with verdict_class.

