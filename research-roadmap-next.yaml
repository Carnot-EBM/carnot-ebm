- id: exp798-cpmi-contrastive-pair-builder
  milestone: 2026.04.61
  deliverable: results/experiment_798_cpmi_pairs.json
  title: 'Exp 798: CPMI Contrastive Pair Builder (arXiv 2604.10660) — Hard Negative Mining for JEPA v21'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA v21 OOD failure is partly caused by insufficiently contrastive training pairs.
    Standard correct/incorrect pairs from FOVER are "easy" — clearly-wrong vs clearly-right.
    CPMI (Contrastive Pointwise Mutual Information, arXiv 2604.10660) provides hard negatives:
    steps that are plausible-but-wrong (CPMI score 0.15-0.60 range). Hard negatives force the
    JEPA predictor to learn finer-grained violation detection, improving OOD generalization.
    This experiment builds CPMI-augmented triples from the Exp 797 corpus (fover_labeled_steps_v21_multi.json).

    EXISTING CODE TO READ FIRST:
    - results/experiment_797_jepa_v21_data_collection.json — check n_labeled_total
    - results/fover_labeled_steps_v21_multi.json — input corpus (from Exp 797)
    - results/fover_labeled_steps_live.json — fallback corpus from Exp 442 if v21 missing
    - python/carnot/pipeline/fover_annotator.py — FOVERCoTStep structure
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN entries

    TASK: Implement CPMIContrastivePairBuilder, generate hard-negative triples from the
    multi-source corpus, write to results/experiment_798_cpmi_pairs.json.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/autoresearch/spec.md:
       - REQ-LEARN-052: CPMIContrastivePairBuilder MUST produce (prefix, positive_step,
         hard_negative_step) triples where hard_negative is sampled from the model distribution
         at temperature=0.9 with CPMI score in [0.15, 0.60].
       - REQ-LEARN-053: Augmented corpus MUST have augmentation_ratio >= 2.0 (triples / input pairs).
       - SCENARIO-LEARN-095: 80 input pairs produce >= 160 contrastive triples with CPMI scores
         in the target range; augmentation_ratio >= 2.0.
    3. Implement python/carnot/pipeline/cpmi_builder.py:
       a. CPMITriple dataclass:
          {prefix_text, positive_step, negative_step, cpmi_score, source_domain}
       b. compute_cpmi_score(step_text: str, prefix: str, model_logprobs: dict) -> float:
          CPMI approximation (without full model): use text similarity as proxy in CI mode.
          In CI mode: cpmi_score = 1.0 - cosine_similarity(positive_embedding, negative_embedding)
          Record cpmi_mode: "ci_proxy" or "model_logprob".
       c. generate_hard_negative(step_text: str, prefix: str, n_candidates: int = 5) -> str:
          In CI mode: perturb step by replacing numbers (+1 or -1), swapping operators (+/-),
          or inserting a plausible carry error. Return perturbed step as hard_negative.
       d. CPMIContrastivePairBuilder:
          build_triples(corpus: list[dict], n_candidates: int = 5) -> list[CPMITriple]:
            For each (step, label=incorrect) pair in corpus:
              Generate n_candidates negatives via generate_hard_negative
              Compute CPMI proxy score for each
              Select candidate with CPMI in [0.15, 0.60]; if none, use closest to 0.40
              Add CPMITriple to list
            Also add original (step, label=correct) pairs as positive triples (cpmi_score=0.0)
            Return all triples
       e. Export CPMIContrastivePairBuilder, CPMITriple from carnot.pipeline.__init__
    4. Create scripts/experiment_798_cpmi_pairs.py:
       a. ExperimentTemplate(798) + ExperimentTimeoutWatchdog(798, timeout_minutes=30).
       b. apply_env_autofix() FIRST.
       c. Load corpus: try fover_labeled_steps_v21_multi.json first, fallback to
          fover_labeled_steps_live.json (Exp 442), fallback to 50 synthetic pairs.
       d. CPMIContrastivePairBuilder().build_triples(corpus, n_candidates=5).
       e. Write triples to results/experiment_798_cpmi_pairs_triples.json.
       f. Artifact fields: n_input_pairs, n_output_triples, augmentation_ratio,
          cpmi_score_mean, cpmi_score_std, cpmi_mode, corpus_source, honest_verdict.
       g. honest_verdict:
          - "cpmi_augmentation_adequate" if augmentation_ratio >= 2.0 and n_output >= 40
          - "cpmi_augmentation_partial" if ratio >= 1.5 but < 2.0
          - "cpmi_augmentation_insufficient" if ratio < 1.5
    5. Write tests/python/test_experiment_798_cpmi_pairs.py with 100% coverage:
       - test CPMITriple dataclass fields present
       - test compute_cpmi_score CI proxy uses cosine similarity fallback
       - test generate_hard_negative produces perturbed step different from input
       - test build_triples augmentation_ratio >= 2.0 on 10-pair synthetic corpus
       Each test traces to REQ-LEARN-052/053.
    6. Reconcile:
       - ops/changelog.md: one-line entry with augmentation_ratio.
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

