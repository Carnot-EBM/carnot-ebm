- id: exp886-constrained-decoding-prefilter
  milestone: 2026.04.68
  deliverable: results/experiment_886_constrained_decoding_prefilter.json
  title: 'Exp 886: ConstrainedDecodingPreFilter — AST-Guided Token Masking for Code (arXiv 2508.15866) (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2508.15866 implements AST-guided token masking that achieves 100%
    syntactic correctness at <5% latency overhead. Carnot currently repairs code POST-HOC;
    this adds PRE-GENERATION constraint to prevent syntactic violations before they appear.
    Combined effect: CodeExtractor false-positive rate drops because all generated code is
    syntactically valid — the extractor only needs to handle semantic errors.

    This is a CPU-only capability: the AST validator runs on partial code strings without
    GPU. Integration point: VerifyRepairPipeline or a new ConstrainedDecodingWrapper.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/extract.py — CodeExtractor (post-hoc extraction)
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
    - openspec/change-proposals/research-roadmap-v68.md — .68 Phase 3

    TASK: Implement ConstrainedDecodingPreFilter using Python's ast module for partial
    parse validation. Measure FP rate reduction on 30 synthetic code generation problems.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Implement python/carnot/pipeline/constrained_decoding.py:
       a. Class ASTValidator:
          - is_recoverable_partial(partial_code: str) -> bool:
            Try ast.parse(partial_code). If SyntaxError: check if it's a recoverable
            partial (e.g., unterminated string, incomplete expression — these are OK)
            vs irrecoverable (e.g., invalid indentation, unknown keyword).
            Heuristic: recoverable if the error is at the end of the string (incomplete)
            vs in the middle (genuinely invalid).
          - would_be_valid(partial_code: str, candidate_token: str) -> bool:
            Try ast.parse(partial_code + candidate_token). Return True if no error
            OR if error is recoverable partial.
          - filter_invalid_tokens(partial_code: str, candidate_tokens: list[str]) -> list[str]:
            Return only tokens that produce recoverable partials.
       b. Class ConstrainedDecodingPreFilter:
          - __init__(validator: ASTValidator): store validator
          - apply(generated_tokens: list[str], candidate_logits: dict[str, float]) -> dict[str, float]:
            Filter candidate_logits to only valid continuations.
            If no valid continuations remain: return original logits (safety fallback).
          - measure_fp_rate(code_samples: list[str]) -> float:
            For each code sample: run CodeExtractor, count FP extractions where
            code is actually syntactically valid but flagged as violation.
            Return fraction of FP over total extractions.
    3. Add spec entries: REQ-VERIFY-147 (ConstrainedDecodingPreFilter reduces FP rate),
       SCENARIO-VERIFY-175/176.
    4. Benchmark on 30 synthetic code generation outputs:
       10 correct Python functions, 10 with semantic errors (wrong logic, not syntax),
       10 with syntactic errors (missing colon, bad indent).
       Measure:
         - fp_rate_without_filter: CodeExtractor FP rate without pre-filter
         - fp_rate_with_filter: CodeExtractor FP rate with pre-filter applied to inputs
         - fp_rate_delta: fp_rate_without - fp_rate_with (target: > 0.20)
         - syntactically_clean_fraction: fraction of outputs that are syntactically valid
    5. Create scripts/experiment_886_constrained_decoding_prefilter.py:
       honest_verdict:
         - "fp_reduction_achieved" if fp_rate_delta >= 0.20
         - "partial_fp_reduction" if fp_rate_delta in (0.05, 0.20)
         - "no_fp_reduction" if fp_rate_delta <= 0.05
    6. Write tests with 100% coverage. Test is_recoverable_partial on known cases.
       Test filter_invalid_tokens removes invalid tokens. Test fp_rate_delta measurement.
       Traces to REQ-VERIFY-147, SCENARIO-VERIFY-175/176.
    7. Reconcile: ops/changelog.md, ops/status.md.
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_886_constrained_decoding_prefilter.py -v
