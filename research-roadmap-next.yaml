  - id: exp2224-semantic-memory-pruning
    title: "Phase 3: Continuous Learning Semantic Pruning"
    milestone: "2026.05.220"
    deliverable: "results/experiment_2224_semantic_pruning.json"
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: FR-11 continuous self-learning stores too many constraints, causing catastrophic forgetting or mode collapse. We must implement a semantic similarity pruner for the replay buffer.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/pipeline/verify_repair.py
      TASK: Implement a replay buffer pruner that removes redundant formal constraints.
      CONCRETE STEPS:
      1. Add `prune_redundant_constraints` function to the continuous memory class using embedding distance thresholds.
      2. Validate that it does not accidentally prune structurally distinct rules.
      3. Guarantee that `continuous_self_learning_task: true` is set in the JSON artifact.
      4. Write deliverable to `results/experiment_2224_semantic_pruning.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2225-pruning-retention-test
    title: "Phase 3: FR-11 CSL Pruning Retention Validation"
    milestone: "2026.05.220"
    deliverable: "results/experiment_2225_pruning_test.json"
    gated_on:
      - upstream: exp2224-semantic-memory-pruning
        artifact_field: honest_verdict
        op: "contains"
        value: "complete"
    prompt: |
      CONTEXT: Ensure the pruned memory buffer does not cause the model to regress on previously learned constraints.
      EXISTING CODE TO READ FIRST: {project_root}/scripts/check_spec_coverage.py
      TASK: Run a retention cycle validation.
      CONCRETE STEPS:
      1. Simulate multiple self-learning episodes with heavy constraint injection.
      2. Trigger the pruner and measure post-pruning constraint satisfaction rate.
      3. Ensure `nonforgetting_rate` and `soundness_mistakes` are logged.
      4. Write deliverable to `results/experiment_2225_pruning_test.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

