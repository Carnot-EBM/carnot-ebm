- id: exp714-npu-iron-toolchain
  milestone: 2026.04.54
  deliverable: results/experiment_714_npu_iron_unblock.json
  title: 'Exp 714: AMD XDNA NPU Unblock v8 — IRON Toolchain Fresh Approach (mlir-aie, No ninja/openblas)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: AMD XDNA NPU has been blocked for 7 consecutive milestones (Exps 292, 303, 314,
    335, 435, and two others) because VitisAI path requires ninja + openblas, which have not
    been installed despite 7 retro recommendations. The IRON toolchain (mlir-aie) is an
    alternative: bare-metal NPU programming via MLIR dialects, no ninja/openblas required.
    arXiv 2504.03083 demonstrates 2.8x GEMM speedup over CPU using IRON on AMD NPU.

    The IRON approach:
    - pip install mlir-aie (Python-only install, no system dependencies)
    - If importable: write a minimal GEMM kernel in AIE MLIR dialect
    - Compile and run on NPU: validate AI Engine execution

    Additionally: AMD now distributes custom onnxruntime wheels for Python 3.12 at
    ryzenai.docs.amd.com. The .venv-npu/ (Python 3.12) environment is ready. The wheel
    might be downloadable without the full Ryzen AI Software installer.

    EXISTING CODE TO READ FIRST:
    - results/experiment_435_npu_unblock.json — v7 failure (blocked_prereq).
    - research-hardware-wishlist.md — AMD XDNA NPU status and setup steps.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Try IRON toolchain (pip install mlir-aie). If unavailable, try AMD custom
    onnxruntime wheel discovery. Report NPU access status.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-HW-039 (XDNA NPU: GEMM kernel via IRON toolchain achieves >2x CPU speedup),
       SCENARIO-HW-039 to openspec/capabilities/fpga/spec.md.
    3. Create scripts/experiment_714_npu_iron_unblock.py:
       a. ExperimentTemplate(714) + ExperimentTimeoutWatchdog(714, timeout_minutes=45).
       b. Strategy 1 — IRON toolchain:
            Try: subprocess.run([".venv/bin/pip", "install", "mlir-aie"], capture_output=True).
            Check: import mlir_aie → iron_available: bool.
            If iron_available:
              Write minimal AIE MLIR kernel (16x16 GEMM as in arXiv 2504.03083).
              Compile via mlir_aie.compile() → npu_available: True if compile succeeds.
              Benchmark: run 100 iterations, compare CPU vs NPU GEMM latency.
              gemm_speedup = cpu_time / npu_time.
            Else: iron_available = False, strategy_1_blocked = True.
       c. Strategy 2 — AMD custom onnxruntime wheel (if strategy 1 fails):
            Try subprocess to check if AMD wheel URL is reachable.
            Try pip install from AMD's onnxruntime-vitisai package (public PyPI check).
            Check import onnxruntime; "VitisAIExecutionProvider" in available_providers.
            vitis_available: bool.
       d. Synthesize result:
            npu_benchmarkable = iron_available OR vitis_available.
       e. honest_verdict:
            - "npu_iron_working" if iron_available AND gemm_speedup >= 2.0
            - "npu_iron_installed_no_speedup" if iron_available AND gemm_speedup < 2.0
            - "npu_vitisai_working" if vitis_available (IRON failed)
            - "npu_still_blocked" if neither approach succeeded
            - "npu_iron_install_failed" if pip install mlir-aie failed
       f. If npu_still_blocked:
            Write escalation note to ops/known-issues.md:
            "RETRO-NPU-v8: IRON path tried (pip install mlir-aie), VitisAI path tried.
             Both blocked. Manual hardware action required: install Ryzen AI Software
             from AMD or request IT to install ninja + openblas."
       g. artifact: iron_available, vitis_available, gemm_speedup (if benchmarked),
          npu_benchmarkable, honest_verdict.
    4. Write tests/python/test_experiment_714_npu_iron.py with 100% coverage:
       - test IRON availability detection.
       - test VitisAI availability detection.
       - test honest_verdict classification.
       Each test traces to REQ-HW-039.
    5. Update research-hardware-wishlist.md: add Exp 714 result to XDNA NPU status section.
    6. ops/changelog.md: one-line with honest_verdict.
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

