    0. PRECONDITIONS: emit a flushed start line. Check exact input paths, hashes, terminal sidecars and required tools with bounded calls. Record actual observations. Missing external resources end complete_blocked_<resource>, verdict_class=blocked. Name the check and observed operand in gate_check_summary. Never fabricate inputs.
