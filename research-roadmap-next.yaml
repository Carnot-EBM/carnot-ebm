  - id: exp4523-a1
    milestone: 2026.06.418
    title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY; HEADLINE) -- FORWARD-WALK NAVIGATION
      fix: collapse the RESET-replay tax. Batch-expand a frontier node''s untested actions per visit +
      nav-cost frontier tie-break. Gate: CORE median actions STRICTLY < baseline at preserved solve-rate.'
    priority: critical
    track: arc-north-star
    max_turns: 160
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4523_forward_walk_navigation.json
    prior_failures:
      - experiment_id: exp4516-a6
        verdict: 'complete: no_lever_beats_7760_honest_null (nav fix half-engaged: 6 exact + 20 partial forward-walk hits vs 1546 reset-replay fallbacks)'
        addressed_by: 'A6 PROVED the RESET-replay tax is the 97%-of-cost axis but only built the forward-walk
          SKELETON (_shortest_path/_partial_forward_path/_record_forward_edge). It barely engaged because
          forward edges in adj are parent->child only, while the depth-primary _frontier selects SHALLOW
          nodes elsewhere in the tree -> navigating deep-cur -> shallow-frontier needs to go BACKWARD, and
          the only backward op is RESET-to-root -> _shortest_path returns None -> RESET-replay. This task
          attacks the cost DIRECTLY (amortize replay via batch-expansion + nav-cost tie-break), not by
          adding more forward edges (which cannot express backward moves). Different mechanism, falsifiable
          gate.'
        retire_if_same_verdict: true
    prompt: |
      CONTEXT ({date}, ARC sprint HEADLINE). The ~7760 actions-to-solve are dominated by RESET-replay
      navigation, NOT candidate fan-out (which is why .417 A1-A4 candidate-levers all nulled at <=0.3%).
      A6 (exp4516) MEASURED it: 1546 reset_replay_fallbacks vs 6 exact + 20 partial forward-walk hits.

      ROOT CAUSE (verified in python/carnot/agentic/arc_competition_agent.py):
        - Forward edges in self.adj are PARENT->CHILD only (_record_forward_edge, ~line 497).
        - _frontier (~line 568) is depth-primary (BFS): it picks the globally-SHALLOWEST unexpanded node,
          which is usually NOT a descendant of the deep current node.
        - To navigate deep-cur -> shallow-frontier you must go BACKWARD; the ONLY backward op live is
          RESET-to-root then replay-from-root (next_move ~line 743-748). _shortest_path (forward BFS over
          adj, ~line 628) therefore returns None almost always -> RESET-replay of node["path"] steps.
        - After arriving at a frontier th, next_move expands ONE untested action (~line 722) then rides;
          taking th's OTHER untested actions later requires another full RESET-replay to th.

      THE FIX (two levers that change navigation COST and expansion BATCHING, NOT the reachable set).
      CAUTION (do NOT trust "by construction"): the run terminates on a FIXED explore_budget (transition
      count: arc_competition_agent.py stalled = len(self.transitions) >= explore_budget), NOT on exhausting
      the reachable set. So reordering/batching changes WHICH states are explored before the budget is
      spent -- it CAN drop a knife-edge CORE solve via the exact order-perturbation mechanism that dropped
      m0r0 in .417 A1. Therefore core_solves_preserved is a HARD EMPIRICAL GATE measured on
      {{lp85,m0r0,sp80,vc33}}, NOT a formality: a dropped CORE solve FAILS the lever regardless of action
      savings. Investigate any dropped CORE solve; do not dismiss it as noise. The two levers:
        1. BATCH-EXPAND PER VISIT: when navigation pays to reach a frontier node th (RESET-replay OR
           forward-walk), expand ALL (or up to a bounded k) of th's untested SALIENT actions in that one
           visit -- queue them as a batch -- BEFORE the search is allowed to jump elsewhere. This amortizes
           the one expensive replay-to-th over k expansions instead of paying a fresh replay per action.
        2. NAV-COST FRONTIER TIE-BREAK: among eligible frontiers of EQUAL depth-priority (depth MUST stay
           the primary key -- it is the provable no-regression control; do NOT let nav-cost override depth),
           prefer the one with the smallest navigation cost from cur: forward-reachable via _shortest_path
           (cost = path len) > shorter node["path"] for replay. Pure tie-break -> reachable set unchanged.

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (next_move ~694, _frontier ~568, _serve ~678, _ingest ~507, _shortest_path ~628, _partial_forward_path ~650, _record_forward_edge ~497, _navigation_diagnostics ~380)
        - {project_root}/scripts/kaggle/arc_local_submission_gate.py (THE gate: CORE set-containment, baseline 7760)
        - {project_root}/results/experiment_4516_integration_8game_gate.json (A6 nav_loop_finding -- the 1546 vs 6)
        - {project_root}/tests/python/test_arc_submitted_agent_parity.py (keep parity green if SUBMITTED config changes)
        - {project_root}/tests/python/test_arc_submission_gate_verdict.py (the CORE-containment gate fixtures -- the metric to report against)

      TASK: implement BOTH levers in the StepwiseExplorer; measure CORE median actions + nav diagnostics
      WITH vs WITHOUT; wire into SUBMITTED_AGENT_CONFIG only if it passes the CORE-containment gate.

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
           Missing -> honest_verdict blocked_<resource>, EXIT. (--no-cov on any focused pytest.)
        1. Implement BATCH-EXPAND-PER-VISIT: when next_move navigates to a frontier th (the nav branch ~line 728-749), queue up to k of th's untested salient actions to expand at th before jumping. k is a bounded sweep param (try k in {{1(control),3,8,all}}). Keep the depth-ride behavior for the arrival subtree.
        2. Implement NAV-COST TIE-BREAK in _frontier: keep depth PRIMARY; among equal-depth eligible nodes, tie-break by navigation cost from cur (forward-reachable shortest_path len, else node["path"] replay len). k=1 + no-tie-break is the CONTROL == today's behavior.
        3. Measure on the 8-game gate: per config report median_actions_on_core, core_solves_preserved, AND the nav diagnostics (reset_replay_fallbacks, reset_replay_steps, forward_walk_hit_rate). The WIN condition: core_solves_preserved=True AND median_actions_on_core STRICTLY < the k=1/no-tie-break control AND reset_replay_steps materially down.
        4. METRIC DISCIPLINE (A3 false-win lesson): measure BOTH conditions on the SAME action field. The gate's canonical metric is TOTAL actions on solved games (per .417 B2). Do NOT compare a treatment's actions_to_first_levelup against a baseline's total-actions -- that produced A3's flagged false win.
        5. POSITIVE CONTROL + FALSE_NEGATIVE_RISK guard: a config known to reduce replay (e.g. batch-all on a game with many backtracks) must register a reduction; if no config beats the control, report the HONEST NULL.
        6. WIRE ONLY ON A STRICT IMPROVEMENT: the gate's PASS includes "non-inferior" (cm <= baseline x 1.10, i.e. up to 10% WORSE still passes). Do NOT wire a non-inferior config -- wire into SUBMITTED_AGENT_CONFIG ONLY if the gate verdict tag is IMPROVED (median_actions_on_core STRICTLY < the k=1/no-tie-break control) AND core_solves_preserved=True; then update test_arc_submitted_agent_parity.py consistently. Else keep the bare explorer + honest null. Solves stay offline-reproduced via arc_solver_kit.reproduce.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; e.g. success: forward_walk_median_actions_on_core_<n>_below_<control> OR complete: forward_walk_no_reduction_honest_null."
        inference_substrate:
          principle: "verifier_ensemble_against_cached_candidates -- offline arcade search, no GGUF/LLM load (1s floor)."
        median_actions_on_core_control:
          principle: "the k=1/no-tie-break baseline measured the SAME way -- the apples-to-apples control (A3 false-win guard)."
        median_actions_on_core_best:
          principle: "the headline -- did amortizing the replay cut TOTAL actions on the CORE games."
        core_solves_preserved:
          principle: "HARD empirical gate on {{lp85,m0r0,sp80,vc33}} -- under the fixed explore_budget, batch/reorder CAN drop a knife-edge solve (the .417 m0r0 mechanism); a dropped CORE solve FAILS the lever regardless of action savings."
        nav_diagnostics_before_after:
          principle: "reset_replay_fallbacks + reset_replay_steps + forward_walk_hit_rate WITH vs WITHOUT -- the causal mechanism witness (did replay actually drop, or is any action change incidental)."
        action_field_used:
          principle: "names the SINGLE action field both conditions were measured on (total actions on solved) -- the A3 metric-mismatch guard."
        config_sweep:
          principle: "the full {{k, tie_break -> (median_actions_on_core, core_solves_preserved, reset_replay_steps)}} table so the decision is auditable, not asserted."
        chosen_submitted_config:
          principle: "what was wired into SUBMITTED_AGENT_CONFIG (or 'unchanged' if null); must keep test_arc_submitted_agent_parity.py consistent."
        positive_control_passed:
          principle: "proves the harness can detect a real replay reduction (guards a silently-broken metric)."
        false_negative_risk_checked:
          principle: "a null is valid only if the positive control passed."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "content-addressed hash catches silent corpus/model drift on replay."
        preconditions_checked:
          principle: "records resources verified; pre-empts missing-resource fabrication."

      Run: cd {project_root} && .venv/bin/python python/carnot/experiment_4523_forward_walk_navigation.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4524-a2
    milestone: 2026.06.418
    title: 'PHASE A2 (ARC NORTH STAR; SCORE-LEVER) -- STOP-after-target-levelup: the explorer runs to
      ~7760 even after reaching levelups. If the run can stop once target_levels is reached, total actions
      collapse. Measure actions-to-target-levelup vs total-run. Gate: CORE actions down, solve-rate preserved.'
    priority: high
    track: arc-north-star
    max_turns: 130
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4524_stop_after_levelup.json
    prompt: |
      CONTEXT ({date}, ARC sprint SCORE-LEVER). .417 A3 forensics revealed actions_to_first_levelup
      (lp85=20, near the offline-BFS optimum of 21) is FAR below the total run length (7792): the explorer
      keeps exploring long after reaching levelups. is_done (~line 752) stops when best_level >= start_level
      + target_levels OR explored_out. If the agent over-runs past the target, total actions (the scored
      metric) are inflated. This task measures whether the explorer can STOP earlier WITHOUT losing levels.

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (is_done ~752, target_levels, best_level, next_move)
        - {project_root}/scripts/kaggle/arc_local_submission_gate.py (CORE-containment gate, baseline 7760)
        - {project_root}/results/experiment_4513_adaptive_per_step_budget.json (the A3 corrigendum: actions_to_first_levelup << total run)

      TASK: characterize the gap between actions-to-reach-target-levels and total-run actions on the 8-game
      gate; if the explorer over-runs, make is_done / the run loop stop once the SCORED target is reached
      (preserving every CORE solve). Honest null if stopping earlier drops a CORE solve.

      CONCRETE STEPS:
        0. PRECONDITIONS: `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0. Missing -> blocked_<resource>, EXIT.
        1. Per CORE game, log actions-to-reach-each-level vs total-run actions. Quantify the over-run.
        2. If a stop-at-target policy cuts total actions while preserving every CORE solve AND every game's banked LEVEL DEPTH -> apply it. CRITICAL: ARC games are multi-level and the competition scores total solved LEVELS; the CORE-containment gate checks the game SET only, NOT levels-per-game, so stopping early could cut actions, keep the CORE set, and silently SHED deeper levels while the gate PASSES. Guard against this explicitly (levels_per_game_preserved below). The target must match the competition's scored objective (all reachable levels), not just first-levelup.
        3. Measure on the gate with CORE-containment; report BOTH conditions on the SAME action field (A3 metric-mismatch guard). Record per-game best_level before vs after.
        4. Honest null + FALSE_NEGATIVE_RISK control if stopping earlier loses a CORE solve or no over-run exists.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: stop_after_levelup_core_actions_<n>_below_control OR complete: no_overrun_or_drops_solve_honest_null."
        inference_substrate:
          principle: "verifier_ensemble_against_cached_candidates -- offline arcade, no LLM load (1s floor)."
        core_solves_preserved:
          principle: "stopping earlier MUST NOT drop a CORE solve (set-containment over {{lp85,m0r0,sp80,vc33}})."
        levels_per_game_preserved:
          principle: "HARD gate: per-game best_level before vs after -- stopping early MUST NOT shed any game's banked level depth (the CORE gate checks the game set only; the competition scores total LEVELS, so a level-depth regression that the gate would PASS must be caught here)."
        median_actions_on_core_control:
          principle: "the run-to-completion baseline, same action field."
        median_actions_on_core_best:
          principle: "the headline -- did stopping at the scored target cut total actions."
        action_field_used:
          principle: "single action field both conditions measured on (A3 metric-mismatch guard)."
        positive_control_passed:
          principle: "proves the harness detects a real reduction."
        false_negative_risk_checked:
          principle: "a null is valid only with the control present."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "catches silent drift on replay."
        preconditions_checked:
          principle: "records resources verified; pre-empts missing-resource fabrication."

      Run: cd {project_root} && .venv/bin/python python/carnot/experiment_4524_stop_after_levelup.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4525-a3
    milestone: 2026.06.418
    title: 'PHASE A3 (ARC NORTH STAR; operator MANDATORY; LEVEL-UP ATTEMPT GUARANTEE) -- bank +1 NEW
      reproducible level: first-contact on an UNSOLVED public game (re86/sb26/bp35/lf52) via the standing
