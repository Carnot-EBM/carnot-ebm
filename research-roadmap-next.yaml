      - all available results/experiment_3122_*.json through results/experiment_3132_*.json
      - ops/status.md
      - ops/changelog.md

      TASK
      Write the milestone .291 capstone from actual artifacts. Decide whether Carnot is closer to paper readiness and identify the highest-leverage next gap.

      CONCRETE STEPS
      1. Load matrix v25 and all available .291 source artifacts.
      2. Summarize what .291 proved, what stayed blocked, what must remain bounded, and which claims are allowed.
      3. Determine paper_ready, capstone_ready, publication_blocker_count, blocker_delta_from_v24, and next_top_gap.
      4. Report statuses for SOTA cache, live verifier, prefix bounds, monitors, repair, FR-11 EvoEnv, FR-11 memory, ARM/EBT, KAN, cLUT/sampler, GateMate/SSQA, and hardware.
      5. Recommend the next milestone direction from evidence, not ambition.

      REQUIRED ARTIFACT FIELDS:
