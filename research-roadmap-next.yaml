      Python world model (Family-B, arXiv:2605.05138), VERIFY it against held-out transitions, refactor
      toward simpler state, then plan ONLY through accepted GOAL+DYNAMICS candidates, with bounded
      counterexample-guided refinement (arXiv:2606.11521).

      THIS IS A retire_if_same_verdict ATTEMPT. The gate is positive-control-FIRST: if the executable
      proposer cannot produce the KNOWN reachable fixture plan (the .420 break), emit the honest verdict +
      barrier and EXIT -- do NOT fabricate an efficiency number. The generator runs on the iGPU (Radeon
      890M), NEVER the RTX 3090s (frozen live-generator selection).

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_executable_world_model.py (WorldModelVerifier ~146, induce_prompt ~301, induce ~360/620, LocalGGUFProposer ~460, plan_in_model ~667 -- the Family-B inducer)
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (E3AgentPolicy _proposer / _induce_and_plan ~1340-1450; CARNOT_ARC_DISABLE_INDUCTION ~1363; SUBMITTED_TARGET_LEVELS ~69)
        - {project_root}/python/carnot/agentic/arc_world_model_trust_energy.py (select_trusted_world_model -- the oracle-distinct ranking energy for candidate models)
        - {project_root}/results/experiment_4544_llm_proposer_reinduction.json (.420 A1: positive_control FAILED, barrier_refinement -- the exact break this addresses)
        - {project_root}/results/experiment_4553_sota_ingestion_llm_inducer.json (.420 D: the Family-B + CEGIS mapping flagged_for_v421)
        - {project_root}/scripts/kaggle/arc_local_submission_gate.py (the per-level efficiency gate; baseline 2.0074)

      TASK: re-build the re-induction proposer as a Family-B EXECUTABLE world-model inducer with held-out
      transition verification + bounded counterexample-guided refinement; GATE FIRST on
      positive_control_passed=True; then measure deeper CORE level / core_efficiency vs the .420 baseline
