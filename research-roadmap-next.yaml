- id: exp889-ice40-pimi-v3-parallel
  milestone: 2026.04.68
  deliverable: results/experiment_889_ice40_pimi_v3_parallel.json
  title: 'Exp 889: iCE40 PIMI v3 — Full Parallel Spin Updates (RETRO-INERTIA-SWEEPS-TARGET-MISSED) (CPU+FPGA)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-INERTIA-SWEEPS-TARGET-MISSED: Exp 860 and Exp 876 both achieved only
    2x sweep reduction (target: 5x). Root cause confirmed by re-reading arXiv 2604.17109:
    The 15-25x speedup in the PIMI paper requires FULLY PARALLEL spin updates — ALL spins
    flip simultaneously based on h_ema from the PREVIOUS cycle. Both Exp 860 and 876
    used checkerboard (sequential even/odd) updates with EMA, which is NOT the PIMI
    algorithm. This explains the 2x vs 15-25x gap.

    prior_failures:
      - experiment_id: exp876
        verdict: sweeps_improved_below_5x
        addressed_by: "Implementing truly parallel updates: all spins update simultaneously
                       using h_ema from previous cycle — architectural change from
                       checkerboard to synchronous parallel (the actual PIMI algorithm)."
      - experiment_id: exp860
        verdict: sweeps_improved_below_5x
        addressed_by: "Same root cause fix: parallel vs checkerboard."
        retire_if_same_verdict: true

    EXISTING CODE TO READ FIRST:
    - results/experiment_876_ice40_inertia_v2.json — v2 result (2x, checkerboard+EMA)
    - python/carnot/samplers/sparse_inertia_ising.py — SparseInertiaIsingSampler (from Exp 876)
    - hardware/kv260/ising_inertia_n8_sparse_v2.v — v2 Verilog (checkerboard)
    - python/carnot/samplers/parallel_ising.py — ParallelIsingSampler (baseline)
    - ~/tools/oss-cad-suite/ — OSS-CAD-Suite (yosys, nextpnr-ice40)

    TASK: Implement SynchronousPIMISampler with truly parallel spin updates.
    Target: sweeps_reduction >= 5.0 in Python simulation. Synthesize on iCE40.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_876_ice40_inertia_v2.json. Note baseline_sweeps, best_alpha.
    3. Implement python/carnot/samplers/synchronous_pimi.py:
       a. Class SynchronousPIMISampler(n_spins, J, h, alpha=0.125, beta=1.0):
          - h_ema: np.ndarray shape (n_spins,) — per-spin EMA of local field
          - sample_once(s_current: np.ndarray) -> np.ndarray:
            STEP 1 (compute): h_local[i] = sum_j J[i,j] * s_current[j] + h[i]  (ALL spins)
            STEP 2 (EMA):     h_ema = alpha * h_ema + (1-alpha) * h_local  (ALL spins)
            STEP 3 (flip):    For each i: p_flip = sigmoid(-2*beta*h_ema[i]*s_current[i])
                              s_new[i] = -s_current[i] if rand() < p_flip else s_current[i]
                              (ALL spins use s_CURRENT, not s_new — true parallel)
            Return s_new
          - run(n_sweeps, init_state) -> (final_state, energy_trajectory)
          - measure_convergence(n_trials, target_energy, max_sweeps) -> int:
            Return mean sweeps_to_converge over n_trials
       b. CRITICAL: s_new[i] must use s_CURRENT[j] for ALL j (not updated neighbors).
          This is what makes it truly parallel — no checkerboard, no sequential.
    4. Python simulation benchmark:
       N=8 constraint graph, same as Exp 876 (K=12 non-zero pairs for complete N=8).
       Compare: SynchronousPIMISampler vs SparseInertiaIsingSampler (Exp 876, checkerboard).
       Run 100 trials each. Measure sweeps_to_converge.
       Also compare alpha in {0.5, 0.25, 0.125, 0.0625} for synchronous PIMI.
    5. Verilog implementation for iCE40:
       Write hardware/kv260/ising_pimi_n8_synchronous_v3.v:
       - N=8 spins, all-parallel update in one clock cycle
       - Pipeline stages: STAGE 0 (register s_current), STAGE 1 (compute h_local, all spins),
         STAGE 2 (EMA update: h_ema_new), STAGE 3 (flip decision, all spins)
       - KEY: STAGE 3 uses h_ema_new from STAGE 2, s_current from STAGE 0 (not stage 3 outputs)
    6. Synthesize with OSS-CAD-Suite:
       ~/tools/oss-cad-suite/bin/yosys -p "synth_ice40 -top ising_pimi_n8_synchronous_v3 -json /tmp/pimi_v3.json" hardware/kv260/ising_pimi_n8_synchronous_v3.v
       ~/tools/oss-cad-suite/bin/nextpnr-ice40 --hx8k --package ct256 --json /tmp/pimi_v3.json 2>&1 | tee /tmp/pimi_v3_pnr.log
       Parse output for LUT count. Target: <= 250 LUTs.
    7. Report:
       - parallel_sweeps: int (mean convergence with synchronous PIMI)
       - checkerboard_sweeps: int (from Exp 876 baseline)
       - sweeps_reduction: float = checkerboard_sweeps / parallel_sweeps (target >= 5.0)
       - best_alpha: float
       - lut_count: int
       - synthesis_clean: bool
    8. honest_verdict:
       - "pimi_5x_retro_closed" if sweeps_reduction >= 5.0 AND lut_count <= 250
       - "pimi_5x_synthesis_over_budget" if sweeps_reduction >= 5.0 AND lut_count > 250
       - "pimi_improved_below_5x" if sweeps_reduction in [3, 5)
       - "pimi_retired" if sweeps_reduction < 3 (retire per discipline — add to exclusion manifest)
       - "synthesis_blocked" if OSS-CAD tools not found
    9. If sweeps_reduction < 3: add iCE40 PIMI research to ops/exclusion_manifest.yaml.
    10. Add spec entries: REQ-HW-036 (synchronous parallel PIMI), SCENARIO-HW-036.
    11. Build artifact and write results/experiment_889_ice40_pimi_v3_parallel.json.
    12. Write tests with 100% coverage. Test SynchronousPIMISampler.sample_once() uses
        s_current (not s_new) for all j. Test sweeps_reduction computation.
        Mock synthesis for unit tests. Traces to REQ-HW-036.
    13. Reconcile: ops/changelog.md, ops/status.md, research-hardware-wishlist.md.
    14. tmpl.assert_deliverable_written() as final line.

