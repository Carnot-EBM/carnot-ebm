milestone: 2026.09.635
milestone_title: Source-span semantics, causal constraint memory, and cumulative live discovery
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp7205-source-contract
  title: V635 source delta and exact execution contract
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.635
  deliverable: results/experiment_7205_v635_source_contract.json
  agent_type: claude
  model: opus
  prior_failures:
  - experiment_id: exp7179-contract-receipt
    verdict: complete_disqualified_v633_markdown_yaml_contract_mismatch
    addressed_by: Use the already validated V634 contract method with a newly emitted complete fourteen-task
      record and milestone-aware source selection.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V634 finally had an exact thirteen-task contract. Preserve that result and independently check the new fourteen-task handoff. Read the V635 planning source refresh before checking execution-time deltas. This advisory receipt gates no science.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/conductor_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/validate_prior_failures.py
    - {project_root}/scripts/harness_consumer_checks.py
    - {project_root}/python/carnot/experiment_7192_v634_source_contract.py
    - {project_root}/results/experiment_7192_v634_source_contract.json
    - {project_root}/results/experiment_7204_v634_capstone.json
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7205_v635_source_contract.json. Create scripts/experiments/experiment_7205_v635_source_contract.py as the executable entrypoint. Reuse shipped code; new implementation follows spec-first, tests-first development.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print and flush before checking anything. Confirm the driving capability spec contains REQ-* requirements; add scoped specs and meaningful failing tests before new implementation. Verify cited source bytes, imports, tools, directories, exact producer gate fields and upstream authentication. Reject quarantined upstream artifacts independently of structured field gates. Unwrap only actual principle/value wrappers, never arbitrary dictionaries. Missing unchanged external prerequisites require terminal blocked plus gate_check_summary; a known failed value must not be promoted. Checkpoints belong under results/checkpoints/, not the terminal deliverable. Never run the whole project test suite as a precondition.
    1. Print a flushed progress line at EVERY numbered phase boundary, before and after any model load, generation, benchmark or subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed time at least every 60 seconds. Start a truthful external heartbeat around blocking native calls, stream subprocess output unbuffered, and bound each call. Keep every output gap below 600 seconds: a silent task can die at 1200 seconds despite the 4800-second hard cap. Heartbeats report observed state, never fabricated progress.
    2. This task invokes no LLM. Set MODEL_SPECS=[] and model_invoked=false. Use inference_substrate_class=aggregation for the described work; aggregation applies to read-only upstream analysis, cpu_exact_solver_or_simulator to executed CPU algorithms, and blocked_no_run only when no qualifying work ran. Use inference_substrate=aggregation_from_upstream_artifacts for aggregation or describe the exact CPU kernel/replay as appropriate. Upstream Qwen outputs are not fresh live inference. Set execution_venue=host and record the hostname in execution_host.
    3. Select the YAML whose milestone equals 2026.09.635: research-roadmap-next.yaml before activation or research-roadmap.yaml afterward. Freeze it and the design under results/raw/experiment_7205/. Parse the design contract table independently. Require exactly fourteen IDs, exp7205 through exp7218, in identical order, with identical titles, deliverables and structured gates. A readable mismatch is disqualified. Never compare this new design against V634 YAML.
    4. Run the shipped schema, prior-failure, exclusion-manifest, invented-path and ARC-floor checks without changing them. Check that every gate references an earlier task in THIS roster and the producer declares the identical top-level field in REQUIRED ARTIFACT FIELDS. Confirm each prior_failures entry has all four mandatory fields, including retire_if_same_verdict=true.
    5. Run the real conductor_gates.evaluate_gates on isolated /tmp fixtures for each edge: passing field, failed field, missing field and missing file. Also record its actual quarantined-input behavior: the field evaluator alone does not reject flagged_adversarial. Prompts must independently reject quarantined inputs. These are validation fixtures, never research evidence. Check execution_venue literals against host, kv260, gatemate, polarfire; hostname belongs in execution_host.
    6. Read the V635 source table in research-references.md. Check up to five primary URLs for changes since planning, prioritizing arXiv:2509.00360, 2509.24489, 2609.08873 and 2608.00585 plus the Extropic Z1T release. Record access failures and no-delta findings. Add real deltas only; do not launch agent fan-out, invent paper contents, or reopen retired external-text scorers.
    7. Write source_contract_complete_score=1 only after the complete structural receipt and source-method mapping exist. Retain exact input hashes, all fourteen contract rows, all gate fixture outcomes, source dates and source limitations. A source access limit does not erase locally available method evidence.
    8. Validate the changed scope with focused unit tests, Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on explicit changed test paths, using a private pytest basetemp. Meet applicable coverage requirements; do not edit protected checks or suppress real failures to pass. Run applicable E2E checks from ops/e2e-test-plan.md: E2E-009/010 for ARC plumbing, E2E-007 for memory/certificate and rollback paths, E2E-003/004 for compiled binding and serialization. For grounding, exercise public input -> actual compiler/extractor -> executor -> independently scored labels. For samplers, run law -> sampled trace -> independent quality calculation. For this planning handoff, exercise file -> parser -> real gate evaluator with /tmp validation fixtures. Run adversarial_verify.py and verdict_row_consistency_lint.py on the terminal artifact as applicable; retain exact command outputs and pre-existing failures separately. Reconcile driving specs, _bmad/traceability.md, ops/status.md and ops/changelog.md. Flush before and after validation and final atomic artifact write.

    9. REQUIRED ARTIFACT FIELDS:
       - field_principles: principle: "Echo the reason for each field beside its actual evidence."
       - status: principle: "Write a terminal artifact only after completion or a diagnosed external block."
       - run_date: principle: "Use {date}; do not substitute an upstream experiment date."
       - preconditions_checked: principle: "Record the actual resource, code and gate observations."
       - inference_substrate: principle: "Describe executed computation, not the intended workload."
       - inference_substrate_class: principle: "The actual operation determines its duration floor."
       - execution_venue: principle: "Use exactly host, kv260, gatemate or polarfire; these tasks execute on host."
       - execution_host: principle: "Put the actual hostname here, never inside execution_venue."
       - duration_s: principle: "Measure monotonic work time; do not pad it to pass a floor."
       - source_artifact_hashes: principle: "Bind source code, input data and frozen contracts to the claim."
       - rows: principle: "Keep unit_id, arm, seed, metric, error and abstention for each comparison; do not replace numeric rows with a task roster."
       - sample_size_budget: principle: "Retain planned, attempted, completed, censored and independent-unit counts."
       - random_seed: principle: "Freeze stochastic choices before held-out outcomes are read."
       - reproducibility_checksum: principle: "Hash the inputs, code, settings and raw rows."
       - gate_check_summary: principle: "Every blocked_* verdict names failed check, upstream, field, expected and observed value."
       - verifier_is_oracle: principle: "Same correctness authority remains circular even with a separate implementation."
       - verdict_class: principle: "Use exactly positive | circular_positive | null | blocked | disqualified | partial; only incomplete own work can be partial."
       - honest_verdict: principle: "Use complete_ or complete: for completed findings; blocked_* for external absence. Readiness is not scientific value."
       - source_contract_complete_score: principle: "One means the advisory receipt is complete, not that science succeeded."
       - contract_rows: principle: "Every contracted task is independently recovered from both files."
       - activation_validation_rows: principle: "Actual parsers and gates must accept the emitted format."
       - source_method_rows: principle: "URLs, dates and access outcomes distinguish source ingestion from invention."
       - MODEL_SPECS: principle: "Empty because this task invokes no LLM."
       - model_invoked: principle: "False; upstream inference is only cited."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH=python JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_7205_v635_source_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
- id: exp7206-arc-volume-a
  title: Live ARC adapter-withheld cumulative session A
  track: research
  priority: high
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 75
  per_unit_rows: true
