    CONCRETE STEPS:
    1. Create results/experiment_1508_trigger_grammar_certificate_decoder_audit.json immediately with status="in_progress".
    2. Verify exp1507 verifier_induction_ready=true; if absent, write a terminal gated artifact.
    3. Reuse .115 CCTU prompts and .116 selected verifier set where possible.
