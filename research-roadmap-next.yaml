    priority: critical
    max_turns: 50
    prompt: |
      CONTEXT: CEM allows solving complex constraints by summing subproblem energy landscapes. This aligns with Phase 4 architecture.
      EXISTING CODE TO READ FIRST: `python/carnot/models/`.
      TASK: Prototype a Compositional Energy Minimizer for a toy constraint satisfaction problem.
      CONCRETE STEPS:
      1. Implement `CompositionalEnergyMinimizer` which sums multiple independent `IsingEBM` instances.
