    track: verifier-reward
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4199_verifier_reward_decisive_a_vs_b_collect.json
    gated_on:
      - upstream: exp4198-verifier-reward-3arm-rft-launch
        artifact_field: training_launched
        op: '=='
        value: true
    prior_failures:
      - experiment_id: exp4079-verifier-reward-rft-eval-collect
        verdict: blocked_gate_check_failed
        addressed_by: "exp4079 (and exp4089) blocked because the upstream corpus/train half was not ready on the GRID/Sudoku substrate. This collect is gated_on A2 training_launched==true for an on-policy CODE run where Phase-0 cleared (>=0.85) and Youden J>0 -- a built, running test on a Phase-0-clearing operating point, not a blocked-upstream chain."
        retire_if_same_verdict: true
