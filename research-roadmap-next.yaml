  - id: exp2814
    milestone: "2026.05.266"
    deliverable: "results/experiment_2814_truthfulqa_ensemble_eval.json"
    title: "TruthfulQA Corpus — Both Memory Conditions (Architecture-Only + Production, 5 seeds)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 60
    track: corpus

    gated_on:
      - upstream: exp2810
        artifact_field: pretest_cascade_fixed
        op: '=='
        value: true

    prior_failures:
      - experiment_id: exp2803
        verdict: "complete: SKIP due to pre-test cascade — no artifact produced"
        addressed_by: "exp2810 pre-test cascade fix resolves the blocking condition; this
                       carry-forward from .265 is identical in scope to exp2803. TruthfulQA
                       factuality is the key out-of-distribution test: FoVer-derived arithmetic
                       verifiers are expected to transfer poorly, which would confirm the
                       FoVer-shape-overfit thesis."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline" and
      "Adversarial Artifact Verification + Sample-Size Rigor".

      CONTEXT: TruthfulQA (Lin et al. 2022, arXiv:2109.07958, 817 questions across
      38 categories) tests factuality, not arithmetic. Carnot's FoVer-trained
      verifiers may perform near-random on factuality questions. If so, this confirms
      the "FoVer-shape overfit" thesis — important for paper credibility.

      OPERATOR DIRECTIVE 2026-05-21: run BOTH memory conditions. See exp2812 for
      the dual-condition protocol. Report architecture-only AND production AUROCs.

      TASK: Run verifier ensemble v7b against TruthfulQA generation split under
      TWO memory conditions, 5 seeds each.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. CUDA available
           b. `python3 -c "from datasets import load_dataset;
              load_dataset('truthful_qa', 'generation')"`
              — if HF unreachable, blocked_huggingface_truthfulqa_unreachable
           c. Qwen3.6-35B-A3B-GGUF or gemma-4-26B-A4B-it-GGUF cached
           d. FR-11 state files present
           Record preconditions_checked.

        1. Load TruthfulQA generation split (817 questions).

        2. For each question, run live-GPU inference to generate a candidate answer.

        3. Compute ground-truth via BLEURT-base-128 semantic similarity against the
           reference best_answer. Threshold tuned on a held-out 50-question calibration
           set. Per CLAUDE.md Decentralization rule 2: NO closed-weight judge allowed.

        4. CONDITION A — production config: score with verifier ensemble v7b (full
           FR-11 state). Record per-verifier scores + ensemble AUROC.

        5. CONDITION B — architecture-only: move FR-11 state files NON-destructively
           to /tmp/fr11_truthfulqa_backup_<seed>/, restart Python, reload ensemble,
           confirm no NEXUS/template/session-memory loaded, score the SAME pairs.
           Record per-verifier scores + ensemble AUROC.

        6. Restore FR-11 state files; verify SHA256 match.

        7. Repeat 2-6 for 5 seeds (42, 137, 271, 314, 1729).

        8. Compute both conditions' mean ± std; learning_contribution = A - B.

        9. Compare to GPT-3 TruthfulQA MC1 baseline (~28%) or any published
           BLEURT-verifier comparator.

        10. Write artifact. If AUROC is low for both conditions (< 0.65), that
            IS the finding — document it explicitly as evidence of FoVer overfit,
            not a failure.

      REQUIRED ARTIFACT FIELDS:
