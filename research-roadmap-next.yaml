           c. Conductor stood-down on TRM training; this is offline label construction + a contrastive localizer fit against cached candidates, NOT model/generator training. Interventions are OFFLINE labels ONLY (NO generator SFT/RL). If a SOTA GGUF is used ONLY to realize an intervention into NL, cache-check it first (model_specs).
           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate.
        1. REAL INTERVENTION LABELS (2601.14209): for each REAL failed trace, find the EARLIEST step k whose single-step correction (verifier-checked) redirects the trajectory to success = the ground-truth first-error index. STRATIFY by first-error POSITION and template/problem FAMILY. n>=1000 real labeled traces. Record n per position-bin and per family (the controls need these).
        2. LOCALIZER: train a CONTRASTIVE earliest-error localizer on the real labels. EVALUATE first-error F1 on a HELD-OUT-FAMILY REAL split (train on some template families, test on held-out families -- NOT the same distribution). Bootstrap CI95 (>=2000 resamples).
        3. DECONFOUNDING CONTROLS BUILT IN (the .406 lesson): (a) a content-blind POSITION-ONLY baseline that predicts the first-error step from the empirical first-error-step distribution ALONE -- the localizer MUST beat it CI95-excl-0; (b) a TEMPLATE-FAMILY HOLDOUT drop -- the held-out-family F1 must be MATERIALLY above what a template-memorizer would score (report the drop when families are scrambled; ~0 drop = the localizer is template/position-only). Report both alongside the head-to-head vs the 0.096 ensemble baseline.
        4. Emit localizer_genuinely_beats_position_only BARE bool := (held-out-family first-error F1 EXCEEDS the content-blind position-only baseline with delta CI95-excl-0 AND the localizer depends on CONTENT not position -- a non-trivial template-holdout signal). Any error CLASS the localizer cannot localize -> missing-verifier gap (ops/verifier_gaps.md). Run adversarial_verify.py (CLEAN; an F1=1.0 with the position-only baseline NOT beaten would trip IMPLAUSIBLE_PERFECT/FALSE_NEGATIVE_RISK -- report honestly). Declare random_seed/random_seeds_used + reproducibility_checksum + model_specs.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A win (the real-intervention localizer GENUINELY beats the content-blind position-only baseline on a held-out-family REAL split, content-dependent) and a CLEAN null (it still ties position-only -> retire the localizer-as-headline) are BOTH decision-grade."
        localizer_genuinely_beats_position_only:
