tasks:
  - id: exp1781-carnot-fast-slow-variant-retry
    title: "Exp 1781: Carnot Fast-Slow Variant prototype retry — .184 exp1761 SKIPPED"
    deliverable: results/experiment_1781_fast_slow_variant.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1761-carnot-fast-slow-variant-prototype
        verdict: skipped_pretest_failing_in_184_readme_truncation
        addressed_by: "exp1761 (.184) was SKIPPED due to README.md truncation in .184 retro losing test_docs.py-required sections. Pretest fix shipped 2026-05-15 16:30Z (restored known-good README + added verify_code_with_pbt mention). Same task scope; PRECONDITIONS step 0 unchanged."
        retire_if_same_verdict: false
      - experiment_id: exp1745-phase4-per-step-alpha-disaggregation
        verdict: complete_phase4_metric_inaccessible_at_ensemble_level
        addressed_by: "exp1745 (.182) confirmed Phase 4 invariance is substrate-level (distinguishable_steps=0). Fast-Slow Variant (arXiv:2605.12484 Score 400) is the explicit rescue path: measure on fast-weight context, not ensemble output."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: arXiv:2605.12484 (operator-flagged 2026-05-15 13:15Z,
      Score 400) introduces Fast-Slow Training (FST). Carnot's
      verify-repair loop maps natively: SLOW = k=16 ensemble + base LLM
      (frozen); FAST = verifier-output-summary context that re-prompts
      iteration-to-iteration. exp1745 (.182) confirmed ensemble-output
      Phase 4 metrics are substrate-inaccessible — Fast-Slow is the
      explicit rescue.

      FALSIFIABLE HYPOTHESIS: A minimal Carnot Fast-Slow Variant on a
      3-task continual-learning switch (GSM8K → BBH → MATH-subset)
      achieves AT LEAST 2x sample efficiency to a fixed verification-
      pass-rate target AND <=0.5x KL drift from base LLM vs FR-11
      (verifier-as-reward RL) baseline, with no catastrophic forgetting
      (pass rate on prior task degrades < 5pp after switching).

      EXISTING CODE TO READ FIRST:
        - python/carnot/pipeline/verify_repair.py (the SLOW-weight ensemble)
        - python/carnot/pipeline/ebft_autoresearch_loop.py if exists
          (FR-11 baseline)
        - results/experiment_1745_phase4_per_step_alpha.json (the
          motivation: ensemble-level alpha is inaccessible)

      TASK: Implement Fast-Slow Variant + 3-task continual-learning
      benchmark.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "from carnot.pipeline.verify_repair import
              VerifyRepairPipeline"` succeeds — else
              `blocked_verify_repair_pipeline_missing`.
           b. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              non-empty — else `blocked_model_not_cached`.
           c. At least one FR-11 baseline run in results/ (grep for
              fr11 or fr_11) — else `blocked_no_fr11_baseline`.
           Record preconditions_checked.
        1. Implement fast_slow_variant(prompt, base_llm, verifier_ensemble,
           max_iters=10) with a fast-weight context buffer that
           accumulates verifier-failure-summaries across iterations.
           Slow weights NEVER update.
        2. Build 3-task corpus: 30 GSM8K + 30 BBH + 30 MATH = 90 examples.
        3. Run both pipelines (Fast-Slow + FR-11 baseline) on A → B → C
           sequence. Log pass-rate, iters-to-pass per example, KL
           divergence from base.
        4. Post-sequence: re-run task A. Measure plasticity gap.
        5. Acceptance: sample_efficiency_ratio (FS_iters / FR11_iters
           on task B) >= 2.0 AND kl_drift_ratio <= 0.5 AND no catastrophic
           forgetting.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.fast_slow_variant.v1"
        - experiment: 1781
        - run_date: ISO-8601 UTC
        - duration_s: > 300s
        - random_seed: 172681 (NOT 1781 or 90)
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          slow_weights: ["base_llm", "k=16_verifier_ensemble"],
          fast_weights: "verifier_output_summary_context",
          baseline: "fr11_verifier_as_reward",
          tasks: ["gsm8k_30", "bbh_30", "math_30"],
          continual_switch_order: "A_B_C_then_A"}
        - n_samples: 90
        - n_samples_justification: "30 per task × 3 tasks. Wilson 95% CI
          width ~0.30 per pass rate, matching paper's eval granularity."
        - fast_slow_passrate_per_task: dict task -> {passrate, wilson_95_ci}
        - fr11_passrate_per_task: dict task -> {passrate, wilson_95_ci}
        - sample_efficiency_ratio: float
        - kl_drift_fast_slow, kl_drift_fr11, kl_drift_ratio: float
        - plasticity_fast_slow, plasticity_fr11: float
        - catastrophic_forgetting_fast_slow: bool
        - catastrophic_forgetting_fr11: bool
        - acceptance_gate_passed: bool
        - acceptance_gate_criteria: "Sample-eff >= 2x AND KL drift <= 0.5x
          AND no catastrophic forgetting."
        - methodology_note: "If sample_efficiency_ratio > 5x with no
          methodology_note, treat as IMPLAUSIBLE_PERFECT — paper headline
          is 3x; lift > 5x on Carnot's setup without explanation is a
          fabrication signal."
        - optimization_direction: "maximize_sample_efficiency_minimize_kl_drift"
        - honest_verdict: MUST start with `complete:` / `complete_` /
          `success:` / `success_` / `passed:` / `passed_` / `shipped:` /
          `shipped_` per CLAUDE.md Verdict Terminal-Prefix Discipline.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

