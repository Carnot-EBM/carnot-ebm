milestone: 2026.06.396
milestone_title: "RUN the now-unlocked DiffusionGemma energy-guided FULL benchmark (does the EXTERNAL verifier improve GENERATION, not just rank it? -- the §5 energy-VERIFIES-shapes-GENERATION thesis at LLM scale, with matched no-Carnot-verifier RFG/EntRGi controls so the twice-burned over-claim trap cannot recur) + HARDEN the cross-family selection win on a 2nd, construction-disjoint substrate (ARC-GEN) + pay the owed north-star §5 EFFICIENCY-parity axis + re-power continuous self-learning + advance ARC +1. .395 LANDED A LANDMARK: the hardened ARC oracle-distinct verifier-beats-vote win GENERALIZED cross-family (exp4271 cross_family_delta +0.4038 held-out, CI95-excl-0, within_minus_cross_gap only 0.0385, verifier_is_oracle=false) -> hardened_win=True (all 3 axes) -> diffusiongemma_full_run_gate FLIPPED True; the DiffusionGemma loader was REPAIRED (exp4274 preflight_go) via the llama.cpp PR binary; ARC +1 to 20 levels (exp4275 wa30 L1); self-learning hit a ceiling (exp4273 static-is-the-ceiling, online-adaptation CI touched 0 at n=52); paper_ready=True (FoVer 0.9131, G1-G4)."
milestone_doc: openspec/change-proposals/research-roadmap-v396.md
milestone_overview: |
  .395 hardened the SELECTION moat on all three axes (provenance-blind leak-audit +0.385, multi-seed +0.458,
  cross-family OOD +0.404 -- the win barely shrinks out-of-distribution) and FLIPPED the DiffusionGemma full-run
  gate OPEN. The DiffusionGemma discrete-diffusion loader was repaired (exp4274, via the llama.cpp PR binary
  llama-diffusion-gemma-eval -- the ONLY working path; llama-cpp-python/transformers/vLLM all crash on the arch).
  ARC reached 20 levels. Self-learning found static is the ceiling, but at n=52 the (online-static) CI only
  TOUCHED 0 (an n-limit, not a proven null). paper_ready=True (FoVer 0.9131 headline, G1-G4 met).

  .396 is DEPTH on the now-hardened thesis (north-star §1 Depth-Over-Breadth). It does five things, in order of
  load-bearing-ness:

    PHASE A -- RUN THE DEFERRED DiffusionGemma ENERGY-GUIDED FULL BENCHMARK (the headline scale-up):
      A1 (exp4281) the verifier ensemble as a per-step GUIDANCE energy reweighting DiffusionGemma's denoising,
        via the PR binary, on n>=30 per arm. HEADLINE arm = a LEARNED energy verifier (verifier_is_oracle=false)
        on a REASONING domain vs unguided vs RFG (the model's own self-guidance, arXiv:2509.25604) vs EntRGi
        (arXiv:2602.05000) -- emit diffusiongemma_guidance_moat := (Carnot-guided - RFG > 0 AND CI95-excl-0).
        SUPPORTING arm = an executable-oracle verifier on code/Sudoku (verifier_is_oracle=true) reported as
        execution_grounded (cheap/automatic/decentralized, NOT a moat). Matched controls defuse the over-claim trap.
    PHASE B -- HARDEN THE CROSS-FAMILY WIN ON A 2ND SUBSTRATE:
      B1 (exp4282) ARC-GEN (arXiv:2511.00162, github.com/google/ARC-GEN) family-disjoint cross-family stress;
        report lift SEPARATELY on original-ARC / ARC-TGI / ARC-GEN + a randomized family-rich stress split. Emit
        arcgen_cross_family_holds. verifier_is_oracle=false. Closes the single-partition critique.
    PHASE C -- CONTINUOUS SELF-LEARNING, RE-POWERED (mandated):
      C1 (exp4283) Tier-1 online verifier-weight adaptation re-run on the COMBINED family set (.395 manifest +
        ARC-GEN's many families) so the CI is POWERED, + a Tier-2 constraint-memory arm. Emit online_adaptation_helps.
    PHASE D -- PAY THE OWED §5 EFFICIENCY AXIS:
      D1 (exp4284) energy-verifier vs LLM-as-judge on the ORACLE-DISTINCT cross-family ARC selection (NOT code):
        accuracy parity (within CI) + cost/latency ratio. Emit efficiency_parity_at_lower_cost. Target 10-100x cheaper.
    PHASE E -- ARC NORTH STAR:
      E1 (exp4285) offline ARC +1 on a NEW game (NOT wa30, NOT sc25); total_levels >= 21.
    PHASE F -- HYGIENE & CAPSTONE:
      F0 (exp4280) archive .395 -> activate .396. F1 (exp4286) SOTA-ingestion -> .397. F2 (exp4287) registry/gaps
        hygiene + GAP-4 regression guard. F3 (exp4288) hardware continuity opportunistic. F4 (exp4289) capstone .396.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227) and the conductor stays stood-down. NO
  task may launch TRM training, run pkill/kill against train.py, or WRITE results/trm_runs/. Qwen is FORBIDDEN as
  the TRAINED base (Spurious-Rewards confound); Qwen GGUF as an off-policy teacher/judge is fine. Every
  verifier-value task MUST declare verifier_is_oracle honestly (Circularity Discipline): an EXECUTABLE-oracle
  guidance/selection win is execution_grounded (cheap, valid, NOT a moat); the moat is the LEARNED-energy result
  with a matched control, CI95-excl-0. NO autonomous edits to docs/index.html / README / paper prose. Online ARC
  play stays operator-gated (NO leaderboard submission). The code-oracle-distinct-replication and
  verifier-as-reward-in-loop axes are RETIRED/operator-owned -- do NOT re-propose them.

