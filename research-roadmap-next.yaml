       matched difference, and every zero, timeout, crash, and invalid-action
       cell. No outcome-based game or seed replacement is allowed.
    9. Run focused tests, model and GPU telemetry checks, cleanup checks,
       artifact validation, ARC provenance and level-up lints, adversarial
       verification, row-consistency lint, scoped spec coverage, and root-
       clutter checks.
