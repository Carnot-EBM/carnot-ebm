        4. METRIC DISCIPLINE: emit efficiency_delta explicitly + a null_delta_methodology_note when 0.0 (TAUTOLOGY carve-out). WIRE ONLY ON A STRICT IMPROVEMENT (update SUBMITTED_AGENT_CONFIG + raise SUBMITTED_TARGET_LEVELS + keep test_arc_submitted_agent_parity.py consistent) iff a CORE game reaches L2 with core_solves_preserved. Else keep the bare explorer + the honest barrier. Offline-reproduce any new level.

