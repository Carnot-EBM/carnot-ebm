    prompt: |
      CONTEXT: The self-learning thesis (PRD FR-11 / continuous self-learning) rests on alpha_t
      grounding — the verifier signal that keeps a self-correcting model from collapsing onto
      its own null space (Zenil alpha_t; Q12 Dark Room / Hypothesis-B). exp3498 (.322, CLEAN)
      FIT a deployable law: beta_min = -0.300 + 1.846*lambda_min (r2=0.989, p=0.006, holds out of
