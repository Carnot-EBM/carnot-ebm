milestone: 2026.05.136
milestone_title: "Phase-13: Energy-Based Fine-Tuning, ROCE, and Hierarchical Constraints"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1759-ebft-objective
    title: "Exp 1759: Implement EBFT sequence-level objective"
    max_turns: 50
    prompt: >
      CONTEXT: Energy-Based Fine-Tuning (EBFT) allows sequence-level learning without explicit external verifiers, matching features over continuous rollouts.
      EXISTING CODE TO READ FIRST: `python/carnot/training/`.
      TASK: Implement the EBFT objective.
      CONCRETE STEPS:
      1. Create `python/carnot/training/ebft_objective.py`.
      2. Implement sequence-level feature matching.
      3. Add unit tests for gradient flow and objective calculation.
      4. Write `{project_root}/results/experiment_1759_ebft.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1760-ebft-continual
    title: "Exp 1760: gated on Exp 1759: Continual self-learning with EBFT"
    gated_on:
      - upstream: exp1759-ebft-objective
        artifact_field: honest_verdict
        op: in
        value: ["success", "complete"]
    prompt: >
      CONTEXT: Apply EBFT to continuous self-learning to evaluate calibration stability.
      EXISTING CODE TO READ FIRST: `python/carnot/training/ebft_objective.py`, `python/carnot/pipeline/`.
      TASK: Train the continuous self-learning loop using EBFT.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1760_ebft_continual.py`.
      2. Set up MODEL_SPECS with `unsloth/gemma-4-26B-A4B-it-GGUF`.
      3. Execute continual learning loop and measure energy convergence.
      4. Write `{project_root}/results/experiment_1760_ebft_continual.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1761-semantic-pruning
    title: "Exp 1761: Semantic pruning for FR-11 memory buffer"
    prompt: >
      CONTEXT: The continuous learning memory buffer bloats without semantic pruning. We need to discard redundant constraints.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/continual_memory.py`.
      TASK: Implement semantic pruning.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/semantic_pruning.py`.
      2. Implement redundancy detection based on semantic similarity of constraints.
      3. Write `{project_root}/results/experiment_1761_semantic_pruning.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1762-stability-ltlzinc
    title: "Exp 1762: Continuous stability test on LTLZinc"
    prompt: >
      CONTEXT: Validate the pruned, EBFT-trained system on LTLZinc spatial dataset.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/semantic_pruning.py`, `scripts/experiment_1760_ebft_continual.py`.
      TASK: Run stability testing.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1762_stability.py`.
      2. Measure forgetting rates and reasoning stability using `unsloth/gemma-4-31B-it-GGUF`.
      3. Write `{project_root}/results/experiment_1762_stability.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

