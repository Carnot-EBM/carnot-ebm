- id: exp721-vr-gemma4-graduated
  milestone: 2026.04.55
  deliverable: results/experiment_721_vr_gemma4_graduated.json
  title: 'Exp 721: Live VR Gemma4 Graduated Threshold Search (constraint-induced distortion diagnosis)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Gemma4-A4B VR always produces signed_improvement <= 0. The paper arXiv 2601.01490
    "Constraint-Induced Distortion in Small LLMs" explains why: when a model in the 1-5B
    active parameter range is subjected to tight constraint satisfaction pressure (threshold
    <= 0.20), internal representations shift away from factual recall to constraint compliance.
    The result: constrained outputs hallucinate MORE than unconstrained, flipping signed_improvement
    negative.

    HYPOTHESIS: A looser threshold (0.30-0.40) applies only high-confidence constraints,
    avoiding the distortion regime. Abstain mode (apply constraint only if confidence > 0.90)
    may eliminate distortion entirely while still catching obvious violations.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/vr_pipeline.py — VR pipeline with threshold parameter.
    - results/experiment_709_vr_gemma4_diagnostic.json — most recent Gemma4 VR data.
    - scripts/experiment_template.py — ExperimentTemplate with BatchedInferenceRunner.

    TASK: Test 5 threshold conditions on Gemma4-A4B. Find the condition with
    signed_improvement > 0 (if any). Identify optimal threshold for deployment.

    CONCRETE STEPS:
    1. Add REQ-VER-031 (Gemma4 VR threshold MUST be calibrated per arXiv 2601.01490
       distortion analysis before deployment),
       SCENARIO-VER-038 to openspec/capabilities/verification/spec.md.
    2. Create scripts/experiment_721_vr_gemma4_graduated.py:
       a. ExperimentTemplate(721, requires_gpu=True) + ExperimentTimeoutWatchdog.
       b. Pre-warm Gemma4-A4B-GGUF on GPU 1.
       c. 5 conditions x 50q = 250q total, BatchedInferenceRunner (8q batches).
          Conditions: {"threshold": [0.10, 0.20, 0.30, 0.40, "abstain"]}
          Abstain mode: apply constraint ONLY if EORM confidence > 0.90.
       d. Measure signed_improvement per condition.
       e. honest_verdict:
          - "gemma4_optimal_threshold_found" if any condition signed_improvement > 0
          - "gemma4_distortion_confirmed_all_negative" if all conditions <= 0
          - "gemma4_abstain_wins" if only abstain condition > 0
       f. artifact: results_per_condition (list of {threshold, signed_improvement}),
          optimal_threshold (float or "abstain" or null), honest_verdict.
    3. Write tests/python/test_experiment_721_vr_gemma4_graduated.py with 100% coverage:
       - test results_per_condition has 5 entries.
       - test abstain mode only fires when confidence > 0.90.
       Each test traces to REQ-VER-031.
    4. Reconcile ops/status.md and ops/changelog.md.
    5. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 1 (Gemma4). Run setup_gpu() before inference.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp722-psv-pool-exhaustion
  milestone: 2026.04.55
  deliverable: results/experiment_722_psv_pool_exhaustion.json
  title: 'Exp 722: PSV Root Cause Analysis — Question Pool Exhaustion Diagnosis (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: PSV (Propose-Solve-Verify) self-play has been degrading for 2 consecutive
    milestones. Milestone .54 measured PaCoRe K=2 fp_rate_trend_slope=+0.001212 (positive =
    degrading, though improved from +0.004242 in .53). The self-play loop has a fixed
    10-question pool. After ~10 iterations, the model has seen each question multiple times.

    HYPOTHESIS: The model's constraint-satisfaction weight updates overfit to the 10 specific
    questions. When evaluated on held-out questions, performance has deteriorated — not because
    self-play is fundamentally flawed, but because the pool is too small and too fixed.

    CONTROLLED EXPERIMENT:
