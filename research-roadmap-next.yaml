        retire_if_same_verdict: true
      - experiment_id: exp5271-sota-telemetry-receipt-harness-v482
        verdict: "complete: SOTA GGUF telemetry harness was ready, but it did not prove the generation/offload path required by SOTA extraction."
        addressed_by: "This task targets live generation/offload receipts and exposes a bare sota_offload_ready gate instead of claiming verifier quality."
        retire_if_same_verdict: true
      - experiment_id: exp5259-sota-gguf-gpu-offload-preflight-v481
        verdict: "complete: mandated SOTA GGUF runtime became preflight-ready with llama.cpp receipts but did not guarantee all later extraction workloads could run."
        addressed_by: "This task reruns the precondition at .483 execution time and records exact failure modes if the offload path regressed."
        retire_if_same_verdict: true
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 60
    prompt: |
      CONTEXT:
      Repo at {project_root}, run on or after {date}. Exp5274 was blocked by local SOTA GGUF GPU/offload preconditions even though earlier telemetry was ready. This task is a runtime repair and receipt gate. It must not claim verifier quality.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - carnot/inference/sota_models.py or the current cached_sota_pair implementation
      - local GGUF/llama.cpp inference helpers and tests
      - results/experiment_5271_sota_telemetry_receipt_harness_v482.json
      - results/experiment_5274_solver_constraint_extraction_retry_gated_v482.json
      - ops/exclusion_manifest.yaml

      TASK:
      Build or repair a strict local SOTA GGUF generation/offload preflight that downstream .483 SOTA tasks can gate on. If the runtime remains unavailable, emit an honest blocked artifact with the exact precondition failure.

      CONCRETE STEPS:
      1. Step 0 PRECONDITIONS: confirm GPU visibility, driver/CUDA or ROCm facts, llama.cpp or llama-cpp-python version, model cache paths, free disk, and that at least one mandated SOTA GGUF model is locally resolvable without using AutoTokenizer on a GGUF repo.
      2. MODEL_SPECS for headline runtime receipts:
         - unsloth/Qwen3.6-35B-A3B-GGUF as flagship_moe
         - unsloth/gemma-4-31B-it-GGUF as flagship_dense
         - unsloth/gemma-4-26B-A4B-it-GGUF as middle_moe
         Tiny legacy models may be used only for CPU smoke tests and must be labeled smoke_test_not_headline.
      3. Use cached_sota_pair() or the repo's current SOTA helper; load GGUFs through local GGUF paths and llama.cpp-backed APIs only.
      4. For each available mandated model, run a tiny deterministic prompt that exercises live generation or scoring and records prompt checksum, output checksum, wall-clock duration, model file, quantization, context length, n_gpu_layers/offload settings, and GPU memory receipts.
      5. If the live generation path cannot run, do not fall back to a tiny headline model. Record blocked_preconditions and leave sota_offload_ready=false.
      6. Add focused tests for any helper changed by this runtime repair. Do not modify scripts/research_conductor.py.
      7. Write results/experiment_5284_sota_runtime_offload_receipt_repair_v483.json with REQUIRED ARTIFACT FIELDS:
         - honest_verdict: object with value/principle; value must start with complete: or blocked_ and state whether SOTA offload receipts are ready.
         - inference_substrate: object with value/principle; use live_llm_inference_local_gguf_sota if a mandated model actually generated/scored, otherwise blocked_preconditions_with_no_quality_claim.
         - preconditions_checked: object with value/principle.
