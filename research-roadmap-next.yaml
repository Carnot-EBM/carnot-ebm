      CONCRETE STEPS
      0. Replay the structured gate. Check all GGUF files, embedded tokenizers, CUDA devices, VRAM, RAM, disk, timeouts, seeds, fixture hashes, budgets, and protected hashes in preconditions_checked.
      1. Add REQ-KONA-6340 and scenarios before implementation. Update traceability.
      2. Build MODEL_SPECS with the canonical helper. Record model and tokenizer receipts before generation.
      3. Seal prompts, arm rules, budgets, and the primary semantic-diversity endpoint. Generate raw rows atomically. Load one placement at a time and prove memory release.
      4. Run all four arms on identical eligible tasks. Preserve every rejected prefix and final candidate receipt.
      5. Deduplicate only after canonical normalization. Keep each model and family visible. Do not pool away a failed cell.
      6. Add tests for gate replay, tokenizer use, intervention logs, budget parity, semantic deduplication, fallback accounting, and oracle boundaries.
      7. Run focused tests, spec coverage, applicable e2e checks, and adversarial verification.

      Run command: .venv/bin/python -m carnot.experiment_6340_parser_jit_semantic_diversity_canary --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6341-prospective-prefix-utility-ab
