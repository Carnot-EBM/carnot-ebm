      with no hardware dependency -- a different scope entirely, matched only by shared
      'exclusion'/'manifest' tokens in FailureLedger's scope-signature overlap check."
    retire_if_same_verdict: false
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 55
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. `ops/qa_layer_authenticity_audit_report.md`
    (2026-07-02) found a `REAL_BUG` in `scripts/exclusion_manifest_lint.py` with a concrete
    counterexample, per CLAUDE.md's QA-Layer Authenticity Discipline. Fix per the discipline's own
    "How to apply (operator)" section: write the regression test reproducing the counterexample FIRST,
    then fix, then run the full `adversarial_verify.py` test suite, then a corpus-wide `--backfill`
    dry-run sanity check before committing.

    THE EXACT COUNTEREXAMPLE (from the audit report):
    ```yaml
    tasks:
      - id: exp9001-v472-fover-guard
        title: Guard against FoVer premise reuse
        prompt: "Do not reuse the FoVer in-domain candidate-selection-pool premise; verify all candidate-pool
          analysis avoids it."
    ```
    This gets misclassified `BLOCKED_PATTERN_MATCHED` because a task that explicitly PREVENTS a retired
    scope gets flagged the same as a task that RE-PROPOSES it -- the check has no negation awareness.

    THE FOUR DOCUMENTED ISSUES (fix ALL FOUR, not just the one counterexample above):
    1. `BLOCKED_PATTERN_MATCHED` uses raw substring matching (`pattern_str.lower() in haystack`) with no
       word boundaries -- can match inside unrelated longer words.
    2. Principle-wrapped fields are not unwrapped: `id`, `requires`, `operator_override`, `title`, and
       `prompt` are treated as bare values, so `{principle: ..., value: "exp2091..."}` can evade
       `EXP_ID_RETIRED` / `REQUIRES_RETIRED_EXP` or fail override recognition (per CLAUDE.md's
       "Principle-Annotated Artifact Fields" convention -- ANY field may legally be written in this
       wrapped form).
    3. Negation handling is partial (only ONE existing check -- the retired host-storage-precondition
       check documented in CLAUDE.md's KV260 SSH-Not-SD-Card Discipline section -- has negation awareness;
       nothing else does).
    4. Terminal verdict prefixes (complete:/success:/etc.) are not classified in this file at all.

    EXISTING CODE TO READ FIRST:
    - scripts/exclusion_manifest_lint.py (the full file -- read completely before editing).
    - ops/qa_layer_authenticity_audit_report.md (the full audit finding, for any additional nuance beyond
      the summary above).
    - CLAUDE.md "QA-Layer Authenticity Discipline" "How to apply (operator)" section (the exact process:
      regression test first, fix, full adversarial_verify.py suite, backfill dry-run, then commit).
    - CLAUDE.md "Principle-Annotated Artifact Fields" (the wrapping convention this lint must unwrap
      correctly -- check whether `adversarial_verify.py` already has a shared unwrap helper to reuse here
      rather than duplicating the logic).
    - tests/python/test_exclusion_manifest_lint.py (or wherever this linter's existing tests live -- read
      before adding, to match the existing test style).

    CONCRETE STEPS:
    1. Write the regression test reproducing the exact counterexample above (a task whose prompt
       explicitly NEGATES/prevents a blocked_pattern phrase gets misclassified BLOCKED_PATTERN_MATCHED).
       Confirm it currently FAILS (proves the bug is real, not already fixed).
    2. Fix issue 1 (word-boundary-aware matching): use a regex with `\b` boundaries (or equivalent
       tokenization) instead of raw substring `in` checks for `BLOCKED_PATTERN_MATCHED`.
    3. Fix issue 2 (principle-wrapped fields): check whether `adversarial_verify.py` has an existing
       field-unwrap helper; if so, import and reuse it here rather than writing a second implementation.
       If not, write one unwrap helper used consistently for `id`, `requires`, `operator_override`,
       `title`, and `prompt`.
    4. Fix issue 3 (negation handling): generalize the existing KV260-specific negation check into a
       general negation-context detector (phrases like "do not", "avoid", "never", "guard against",
       "prevent" appearing near the matched pattern) applied to ALL blocked_patterns checks, not just one.
    5. Fix issue 4 (terminal verdict prefixes): add recognition of complete:/complete_/success:/success_/
       passed:/passed_/shipped:/shipped_ prefixes where relevant to this linter's classification logic.
    6. Confirm the regression test from step 1 now PASSES.
    7. Run the FULL `adversarial_verify.py` test suite (not just this linter's own tests) to confirm no
       regressions from the shared-helper reuse in step 3.
    8. Run a corpus-wide `--backfill` dry-run sanity check (per the discipline's own specified process) to
       confirm the fix does not introduce new false negatives across the historical artifact corpus.

    REQUIRED ARTIFACT FIELDS:
      counterexample_regression_test_fails_before_fix:
        value: bool
        principle: "Proves the bug is real and the test genuinely detects it, not a tautology."
      counterexample_regression_test_passes_after_fix:
        value: bool
      four_issues_fixed:
        value: "{word_boundary: bool, principle_unwrap: bool, general_negation: bool, terminal_prefix: bool}"
      shared_unwrap_helper_reused_or_created:
        value: string
      full_adversarial_verify_test_suite_result:
        value: "{passed: int, failed: int}"
      backfill_dry_run_result:
        value: "summary of the corpus-wide sanity check"
      inference_substrate:
        value: aggregation_from_upstream_artifacts
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_, and must confirm all FOUR
          documented issues were addressed, not just the one counterexample."

    Do not push. Do not modify scripts/research_conductor.py.

- id: exp5205-autopyverifier-gap1-pilot-v476
  milestone: 2026.07.476
  title: an AutoPyVerifier-inspired pilot targeting GAP-1 (transpose/orientation discrimination) -- search
    a compact SET of cheap candidate discriminators instead of one hand-crafted invariant
  priority: medium
  track: research
  deliverable: results/experiment_5205_autopyverifier_gap1_pilot_v476.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 55
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. `ops/verifier_gaps.md` GAP-1 (transpose/orientation
    discrimination): the always-on content families (`object_count`, `palette_histogram_shape`) are
    PROVABLY transpose-invariant (a grid and its transpose have identical object statistics and color
    histograms), so they cannot distinguish a correct output from its transpose. A single hand-invariant
    candidate (`arc_invariant_directional_adjacency_draft`) was TESTED AND REFUTED 2026-06-09: it degraded
    TRM HYBRID rerank pass@2 0.452->0.419 and captured 0/2 transpose mis-votes. This task is a
    structurally DIFFERENT approach, not a rerun: AutoPyVerifier (arXiv:2604.22937, "AutoPyVerifier:
    Learning Compact Executable Verifiers for Large Language Model Outputs" -- WebFetch-verified real this
    planning session) demonstrates the core method of searching a compact SET of cheap discriminators
    (via LLM-synthesis + DAG search for joint satisfaction in the original paper) beats any single
    hand-crafted invariant by up to +55 F1. This pilot borrows that CORE INSIGHT -- search a set, not one
    invariant -- WITHOUT the LLM-synthesis step (kept cheap and deterministic): hand-author a small library
    of candidate cheap discriminators, then combinatorially search which SUBSET jointly best predicts
    correctness, exactly mirroring AutoPyVerifier's set-search idea at lower cost and with no LLM call.

    EXISTING CODE TO READ FIRST:
    - ops/verifier_gaps.md GAP-1 section (the exact refutation details -- 0.452->0.419 degradation,
      0/2 transpose mis-votes captured).
    - results/arc_grid_verifier_invariants_v2.json (the 239-task square-transpose distractor subset the
      original refutation used -- evaluate against the SAME subset so this result is directly comparable).
    - Whatever module implements `arc_invariant_directional_adjacency_draft` (grep for it) -- read its
      exact formulation to avoid re-deriving the SAME refuted invariant as one of the candidate set
      members (it may still be included as ONE candidate among several, but must not be presented as the
      whole story again).
    - python/carnot/verify/ (existing invariant-family implementations, e.g. `object_count`,
      `palette_histogram_shape`, for the interface pattern new candidate discriminators should follow).

    CONCRETE STEPS:
    1. Hand-author a small library (5-10) of candidate cheap discriminators sensitive to SPATIAL
       ARRANGEMENT / orientation that are NOT transpose-invariant -- e.g. row-ordered vs column-ordered
       edge statistics, oriented content-overlap that does not symmetrize over the dihedral group,
       diagonal-adjacency asymmetry, corner-anchored positional histograms, or similar. Include the
       already-refuted directional-adjacency candidate as ONE member of the set (not the sole candidate).
    2. Implement a combinatorial/greedy subset search (mirroring AutoPyVerifier's DAG-search intent at
       small scale -- with only 5-10 candidates, an exhaustive or near-exhaustive subset search is
       tractable) over which JOINT combination of discriminators best predicts correctness on a held-out
       split of the 239-task distractor subset.
    3. Evaluate the best-found subset against the SAME square-transpose distractor subset
       (`results/arc_grid_verifier_invariants_v2.json`) the original refutation used, using the SAME
       TRM HYBRID rerank pass@2 metric, so the result is directly comparable.
    4. Report whether the best joint SET beats the always-on baseline (object_count + palette_histogram_shape
       alone) and specifically whether it captures transpose mis-votes the always-on baseline structurally
       cannot (per the provable transpose-invariance of those two families).
    5. Update `ops/verifier_gaps.md` GAP-1 with the result -- `filled` only if a genuine, non-degrading
       improvement is found; otherwise a precise honest null naming which candidate discriminators helped,
       hurt, or were neutral.

    REQUIRED ARTIFACT FIELDS:
      candidate_discriminators_authored:
        value: "list of {name, description, transpose_sensitive: bool}"
      best_subset_found:
        value: "list of discriminator names"
      pass_at_2_baseline_always_on_only:
        value: float
      pass_at_2_best_subset:
        value: float
      transpose_misvotes_captured:
        value: "int out of the known transpose-distractor count in the 239-task subset"
      verifier_is_oracle:
        value: false
      random_seed:
        value: int
      reproducibility_checksum:
        value: string
      inference_substrate:
        value: verifier_ensemble_against_cached_candidates
        principle: "This pilot evaluates cheap discriminators against a cached distractor pool -- no LLM
          call is made, unlike AutoPyVerifier's own LLM-synthesis step, which this pilot deliberately
          substitutes with hand-authored candidates for cost/determinism."
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_, and must state plainly whether
          the set-search approach beats the always-on baseline and the (already-refuted) single-invariant
          approach, or whether GAP-1 remains open under this attempt too -- either is a legitimate,
          reportable outcome."

    Do not push. Do not modify scripts/research_conductor.py.

