      ACCEPTANCE: honest_verdict starts with a terminal prefix; .379 activated; close-state recorded truthfully.

  - id: exp4099-trm-pool-verifier-discrimination-probe
    milestone: 2026.06.379
    title: "TRM-POOL VERIFIER-DISCRIMINATION PROBE (THE HEADLINE; THE GATE for TRM-RFT; OFFLINE, ZERO-GPU, fabrication-immune). Apply the .378 precision-rescue primitives (augmentation-invariance, k-of-n independent-induction agreement, graded min-Hamming, demo-fit consistency) as RERANKERS on the cached TRM pass@K pool. Does ANY verifier beat TRM-vote at selecting from the pool, capturing part of the ~13pp present-but-misvoted gap (oracle 0.61 vs vote 0.48)? This decides whether RFT-ing the TRM with the verifier can possibly help."
    priority: critical
    track: verifier-discrimination
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4099_trm_pool_verifier_discrimination_probe.json
    prior_failures:
      - experiment_id: arc3_trm_verifier_rerank_gap1
        verdict: "complete: trm_verifier_rerank captured_0.0 best_ranker=TRM_VOTE oracle_0.6129"
        addressed_by: "The prior rerank used the OLD verifier set and captured 0.0pp of the ~13pp present-but-misvoted gap. This probe applies the NEW .378 precision-rescue primitives (augmentation-invariance, k-of-n independent-induction agreement, graded min-Hamming) — which were NEVER applied to the TRM pool — as rerankers over the SAME cached pool. Different technique, same pool."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: Carnot's verifier-as-SELECTOR on TRM outputs has already failed once: arc3_trm_
      verifier_rerank_gap1 captured 0.0pp of the present-but-misvoted gap (best ranker = TRM_VOTE,
      oracle 0.6129 vs achieved 0.4839 pass@2, ~13pp uncaptured). BUT that used the old verifier.
      The .378 precision-rescue (exp4087) built NEW model-free primitives — augmentation-invariance
      (color-permutation + D4 symmetry of the demos), k-of-n independent-induction agreement,
      graded min-Hamming energy — that have NEVER been applied to the TRM pool. This probe tests
      whether any of them, as a reranker over the TRM pass@K pool, beats TRM's own vote. This is
      the GATE: if no verifier beats TRM-vote at inference, verifier-certified RFT (exp4100) cannot
      help, because RFT trains on the same labels.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE anything else):
           a. The cached TRM pass@K pool exists: `ls results/trm_verifier_rerank_opportunity.json
              results/arc3_trm_verifier_rerank_gap1.json` returns both (the cached pool is n=31).
              To regenerate/expand it you need the cached ArcPrize TRM weights
              (`ls ~/.cache/huggingface/hub/models--arcprize--trm_arc_prize_verification/` non-empty)
              + the harness (`ls scripts/experiments/trm_arc_eval_harness.py`) + CUDA
              (`python3 -c "import torch; assert torch.cuda.is_available()"`). If the cached pool is
              absent AND it cannot be regenerated, write honest_verdict `blocked_trm_pool_missing`
              and STOP.
           b. The rerank ITSELF is ZERO-codex, deterministic offline replay of TRM candidate grids
              (fabrication-immune). Pool generation/expansion via the harness uses the TRM on GPU —
              that is legitimate reproducible TRM inference, not codex.
        1. POWER — EXPAND THE POOL FIRST. n=31 with ~13pp headroom is too small for a
           CI95-excludes-0 verdict. Regenerate TRM pass@K candidates on additional ARC-eval tasks
           via trm_arc_eval_harness.py to reach pool_n_tasks >= 100 (cached 31 + ~70 new; the TRM is
           ~7M params so this is bounded GPU work). CHECKPOINT + PRINT-PROGRESS per task batch so
           codex's 1201s idle-timeout never fires. If GPU/weights are unavailable, proceed on the
           cached n=31 but set `underpowered: true` and report the directional estimate only.
        2. For each task in the pool, take the TRM's candidate grids (the pass@K samples). Compute,
           per candidate, each model-free signal: (i) demo-fit consistency (does the candidate's
           implied transform reproduce the demo pairs / is the TRM self-consistent across demo
           augmentations), (ii) augmentation-invariance (color-permutation + D4: does the candidate
           survive demo-preserving augmentations), (iii) k-of-n agreement (do >=k of the TRM's own
           samples agree on this grid), (iv) graded min-Hamming to the consensus grid.
        3. Build rerankers from each signal and from stacks of them. For each reranker measure
           held-out pass@1 and pass@2 over the pool. Baselines: TRM_VOTE (the incumbent) and the
           ORACLE ceiling.
        4. Bootstrap CI (>=1000 resamples) on the per-task selection. Report captured_pp =
           best_reranker_pass2 - trmvote_pass2 as BOTH the point estimate (directional) AND the
           CI95. The STRICT gate (verifier_beats_trm_vote) requires CI95 to exclude 0; the
           directional estimate is reported separately so a real-but-underpowered signal is not
           lost for the .380 decision.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed verdict. MUST start with complete:/success:/passed:/shipped:. An honest 'no verifier beats TRM-vote' is a COMPLETE verdict, NOT a failure to dress up."
        verifier_beats_trm_vote:
          principle: "THE load-bearing bare bool: True iff some reranker's pass@2 exceeds TRM_VOTE's with bootstrap CI95 excluding 0. Emit it BARE (not a {value,principle} dict) so the conductor gate can read it. This is the strict gate exp4100 reads."
        captured_pp_directional:
          principle: "The best reranker's captured_pp POINT estimate (vs TRM_VOTE), reported even when the CI95 includes 0; preserves a real-but-underpowered signal at n=31 for the .380 expand-and-retry decision, separate from the strict bool."
        pool_n_tasks:
          principle: "Actual pool size reranked (target >=100); paired with `underpowered` it tells a reader whether a False strict gate means 'no signal' or 'too few tasks to resolve one'."
        underpowered:
          principle: "Bare bool: True if the pool stayed at n<100 (regen unavailable); flags that a False verifier_beats_trm_vote is inconclusive, not a clean negative."
        per_reranker:
          principle: "pass@1, pass@2, captured_pp and CI per reranker and per stack — so a reader sees WHICH signal (if any) discriminates on TRM grids, not just an aggregate."
        oracle_ceiling:
          principle: "The pass@2 a perfect selector would reach; bounds how much headroom any verifier could ever capture (prevents over-reading a small gain)."
        n_tasks_scored:
          principle: "Selection claims are degenerate at tiny N; records the pool size so the captured_pp CI can be judged for power."
        random_seed:
          principle: "Determinism precondition for a third party to reproduce the rerank."
        reproducibility_checksum:
          principle: "Content hash of the TRM pool replayed; catches silent pool drift vs a future rerun."
      ACCEPTANCE GATE:
        - condition: "verifier_beats_trm_vote == True (best reranker pass@2 > TRM_VOTE pass@2, bootstrap CI95 excludes 0)"
          principle: "Guards against the 0.0-capture recurrence: only a CI-excludes-0 win over the incumbent vote counts as the verifier discriminating on TRM outputs. If False, the honest finding is that verifier discrimination on TRM GRIDS is the bottleneck (log a verifier_gap), and exp4100 must NOT run a full RFT — it runs the mechanism-smoke branch instead."

  - id: exp4100-trm-verifier-rft-conditional
    milestone: 2026.06.379
    title: "CONDITIONAL TRM VERIFIER-RFT via the NATIVE nano-trm trainer (NOT LoRA-on-LLM). DEFENSIVE READ of exp4099: IF a verifier beats TRM-vote, full-FT/RFT the TRM on verifier-certified samples and measure held-out pass@1/pass@2 vs (A) cold TRM and (B) vote-certified self-SFT (the de-confound: verifier-LABEL vs vote-LABEL, same TRM, same pool). IF NOT, run the TRM full-FT MECHANISM SMOKE (does the native trainer produce a checkpoint? — de-risk the trainer that LoRA-on-LLM never cleared) and report the verifier-grid-discrimination bottleneck honestly."
    priority: high
    track: verifier-as-reward
    max_turns: 120
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-12 operator directive (this session): pivot the verifier-as-reward TRAINING substrate from LoRA-on-1B-LLM to the cached ArcPrize TRM. Scope-matches the retired LoRA lineage (.378 corpus-build exp4088 = blocked_lora_smoke_checkpoints; .378 train exp4089 = RETIRED; .377 exp4077/exp4078). Forward difference = (a) TRM substrate (~7M, full-FT feasible, full-FT>LoRA for OOD) not LLM-LoRA; (b) nano-trm NATIVE trainer not trl/peft (which never produced a checkpoint across .377-.378); (c) DEFENSIVE-gated on exp4099's discrimination probe (only RFT if the verifier beats TRM-vote; else mechanism-smoke + honest bottleneck). This is a de-risked continuation, not a re-run of the failed approach."
    inference_substrate: gpu_trm_native_fullft_training
    deliverable: results/experiment_4100_trm_verifier_rft_conditional.json
    prompt: |
      CONTEXT: exp4099 decided whether any verifier beats TRM-vote at reranking the TRM pool. This
      task is the conditional training step. It is DEFENSIVE — it always produces a usable artifact
      and NEVER hard-gates (no gated_on; read exp4099's result file directly and branch).

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE anything else):
           a. TRM weights cached: `ls ~/.cache/huggingface/hub/models--arcprize--trm_arc_prize_
              verification/` returns non-empty. If absent -> honest_verdict
              `blocked_trm_weights_not_cached` and STOP.
           b. nano-trm present: `ls nano-trm/src/arc_evaluator.py nano-trm/src/baseline.py` returns
              both. NOTE: nano-trm is NOT pip-installed and `import nano_trm` does NOT exist — import
              via `sys.path.insert(0,'nano-trm/src')` (the trainer entrypoint lives there). If absent
              -> `blocked_trm_substrate_missing`.
           c. CUDA available: `python3 -c "import torch; assert torch.cuda.is_available()"`. If not
              -> `blocked_cuda_unavailable`.
           d. Read results/experiment_4099_*.json. If missing -> `blocked_exp4099_probe_missing`.
        1. BRANCH on exp4099's `verifier_beats_trm_vote`:
           IF True (verifier discriminates on TRM grids):
             - Build a verifier-certified training corpus from the TRM pool: keep samples the
               best exp4099 reranker certifies. Build the de-confound ablation corpus: same TRM
               samples, VOTE-certified (TRM's own majority), N-matched.
             - Full-FT (or GRPO-RFT) the TRM via the NATIVE nano-trm trainer (NOT trl/peft, NOT
               LoRA) — three arms over a disjoint train/held-out split:
                 A = verifier-certified RFT,   B = vote-certified self-SFT (the ablation),
                 cold = the unmodified TRM.
             - Measure held-out ARC pass@1 and pass@2 per arm. THE LOAD-BEARING CONTRAST is A vs B
               (does the verifier's LABEL beat the vote's label, bootstrap CI95 excluding 0). A vs
               cold = any lift at all.
           IF False (verifier does NOT beat TRM-vote):
             - Do NOT run a full RFT (it would train on label-free-equivalent signal). Instead run
               the TRM full-FT MECHANISM SMOKE: a minimal real training run (a few hundred steps on
               a tiny ARC subset) that MUST emit a saved checkpoint and reload it. This de-risks the
               native trainer independent of verifier signal — the exact step the LoRA-on-LLM path
               never cleared. Report `trm_native_trainer_checkpoint_ok` and the honest bottleneck:
               verifier discrimination on TRM GRIDS is the blocker; log/refresh the verifier_gap.
               The smoke is a REAL training run: record its measured wall-clock `duration_s` (a real
               train+checkpoint+reload exceeds 60s); do NOT pad it and do NOT emit live-model markers
               for a sub-60s run (avoids a DURATION_TOO_SHORT false flag on an honest fast smoke).
        2. CHECKPOINT + PRINT-PROGRESS per training step/epoch (so codex's 1201s idle-timeout never
           fires on a long run). No background, no detached launch — single synchronous run.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. MUST start with complete:/success:/passed:/shipped:. An honest null (A~=B, or smoke-only because the probe found no signal) is a COMPLETE verdict."
        branch_taken:
          principle: "Records whether the RFT arm or the mechanism-smoke arm ran (driven by exp4099) — so a reader is never misled that a full RFT happened when only the smoke did."
        rft_vs_ablation_delta:
          principle: "The de-confounded A-vs-B held-out delta with bootstrap CI: isolates the verifier's LABEL contribution from generic self-training. A~=B means the verifier adds nothing — report it plainly."
        trm_native_trainer_checkpoint_ok:
          principle: "Bare bool: did the native nano-trm trainer produce + reload a checkpoint. This de-risks the EXACT mechanism the trl/peft LoRA path never cleared, independent of the science."
        preconditions_checked:
          principle: "Records the TRM/CUDA/probe resources verified before training; pre-empts the silent-missing-resource fabrication mode that produced blocked_lora_smoke_checkpoints."
        random_seed:
          principle: "Determinism precondition for reproducing the training run."
        reproducibility_checksum:
          principle: "Content hash of the train/held-out split + certified corpus; catches silent corpus drift."
      ACCEPTANCE GATE:
        - condition: "branch_taken=='rft' AND rft_vs_ablation_delta CI95 excludes 0 (A>B)  ==>  verifier-as-reward on the TRM is REAL; OR branch_taken=='smoke' AND trm_native_trainer_checkpoint_ok==True ==> mechanism de-risked + honest bottleneck logged."
          principle: "Either outcome is a COMPLETE, decision-grade result: a clean A>B validates the pivot on the TRM; a clean smoke + honest 'no grid discrimination' bounds it. The only failure is producing neither (a fabricated or empty run)."

  - id: exp4101-eleventh-game-explore-first
    milestone: 2026.06.379
    title: "ELEVENTH ARC-AGI-3 game first-solve via the PROVEN explore-first method (raises games-solved 10->11, monotonic +1). Bounded active-exploration OBSERVES transitions -> induce mechanic + goal predicate from OBSERVED transitions -> GAP-4 verifier validates on held-out transitions -> act only if validated. Next-easiest non-spatial game from the win-condition survey not yet solved. REAL-ENV-CONFIRM any solve; STOP at the first level that fails."
    priority: high
    track: arc
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation): ARC-AGI-3 incremental +1 game-solve mandated by the ARC-AGI-3 Incremental-Progress Scoping discipline — false-positive scope-match vs prior Nth-game-solve attempts; forward difference = targets the next-unsolved game (eleventh), monotonic +1, honest no-solve is a COMPLETE verdict."
    inference_substrate: offline_arc_explore_induce_verify
    deliverable: results/experiment_4101_eleventh_game_explore_first.json
    prompt: |
      CONTEXT: Per the ARC-AGI-3 Incremental-Progress Scoping discipline, each milestone advances
      the solved-game/level count MONOTONICALLY by at least +1. .378 reached the tenth game. Target
      the next-easiest non-spatial game from results/arc3_win_condition_survey.json not yet solved
      (e.g. the R11L family or the next consensus pick), and solve its first level.

      CONCRETE STEPS:
        0. PRECONDITIONS: the offline ARC driver + win-condition survey exist
           (`ls results/arc3_win_condition_survey.json`); use the OFFLINE/air-gapped driver, not
           the stock online game-discovery. If the target game's offline fixtures are unavailable
           -> honest_verdict `blocked_arc_offline_fixtures_missing` and STOP.
        1. Bounded active-exploration: OBSERVE transitions; induce mechanic + goal predicate from
           the OBSERVED transitions only.
        2. GAP-4 verifier validates the induced model on HELD-OUT transitions before acting.
        3. Act only on validated steps; STOP at the first level that fails.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An honest no-solve is a COMPLETE verdict — do not fabricate a solve."
        total_games_solved:
          principle: "The monotonic progress metric; must be >= the prior milestone's count (no regress)."
        levels_completed:
          principle: "Real-env-confirmed level count for the targeted game; the falsifiable evidence of an actual solve, not a claimed one."
        real_env_confirmed:
          principle: "Distinguishes a live-environment solve from an offline simulation claim — only real-env solves raise the headline count."
      ACCEPTANCE GATE:
        - condition: "total_games_solved > prior milestone count (>=1 NEW level real_env_confirmed) OR an honest no-solve verdict"
          principle: "Progress-not-perfection: banking +1 real level is the win; a fabricated all-levels claim is the anti-pattern this discipline exists to prevent."

  - id: exp4102-sota-ingestion-trm-self-training
    milestone: 2026.06.379
    title: "SOTA-INGESTION SLOT (reserved; headline is a bleeding-edge track): ingest the SELF-TRAINING-WITH-VERIFIER literature mapped onto the .379 TRM verifier-RFT headline. V-STaR keep-rejected (2402.06457), STaR/ReST, RFT-on-recursive-reasoners, TTA-TRM full-FT>LoRA (2511.02886), reward-from-imperfect-verifier (2510.00915). Emit a SOTA->experiment mapping note; flag the strongest method for the .380 roadmap. Cite real arXiv IDs."
