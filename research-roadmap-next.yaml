milestone: 2026.06.380
milestone_title: "Reproduce a PUBLISHED TRM training baseline (nano-trm native trainer), then graft the Carnot verifier where it has executable teeth (Sudoku)"
milestone_doc: |
  Operator directive 2026-06-12 (this session): stop building our own trainer. The verifier-as-
  reward TRAINING substrate has died at the training MECHANISM for three milestones (.377 exp4077/
  4078, .378 exp4088 blocked_lora_smoke_checkpoints + exp4089 retired, .379 exp4100 -> smoke branch
  because exp4099 found the verifier ANTI-discriminates on TRM ARC grids: aug-invariance/demo-fit
  selected -23pp WORSE than TRM-vote). The fast path is to run nano-trm's OWN turnkey, published-
  reproducing recipe (uv run python src/nn/train.py experiment=...; reproduces Sudoku Extreme ~87%,
  Maze ~75%; trm_arc config exists), get a VALIDATED reproducing baseline + checkpoint, and only
  THEN graft the Carnot verifier on top.

  WHY SUDOKU, NOT ARC GRIDS (ties to .379 exp4099): the verifier discriminates only where it can
  EXECUTE. On raw TRM ARC grids there is nothing to execute and the consistency-proxies anti-
  discriminate. Sudoku constraints (row/col/box uniqueness) ARE an exact executable check, so the
  verifier provably has teeth there; reproducing TRM at ~87% leaves ~13pp headroom for verifier-
  reranking/RFT to attack — a sharp, decision-grade test on a reproducing baseline, in a domain
  where Carnot already has verifier infra.

  TERMINOLOGY: TRM's published results are SUPERVISED (deep recursion + deep supervision), NOT
  RL/RFT. nano-trm reproduces that supervised baseline. "Verifier-as-reward / RFT" is the INCREMENT
  we add on top of a reproducing baseline (the McGovern TTA paper arXiv:2511.02886 is the published
  test-time-RFT variant, layered on the same TRM).

  ACHIEVABLE DECISION-GRADE OUTCOMES (we do NOT promise "verifier-as-reward validated"): (a) the
  nano-trm trainer MECHANISM is de-risked end-to-end on our 3090 (real checkpoint + exact-accuracy,
  not the trivial q_halt metric the 2026-06-06 smoke runs produced); (b) a PUBLISHED Sudoku-Extreme
  ~87% baseline reproduced + persisted; (c) the Carnot Sudoku verifier graft either BEATS the vote-
  certified ablation (A>B, CI-excl-0) -> verifier-as-reward real on an executable domain, or ~= it
  -> honest null (the base is near-ceiling / the verifier adds nothing even where it discriminates).

  MECHANISM NOTE: the 2026-06-06 nano-trm runs saved no checkpoint (save_dir=/tmp/ml-experiments,
  ephemeral) and reported only val/q_halt_accuracy=1.0. Every training task below MUST override
  save_dir to a PERSISTENT path and assert a checkpoint file + a REAL exact-accuracy metric.

