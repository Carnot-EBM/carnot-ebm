      2. Cap retries per row and record every retry cause; do not loop until success without accounting.
      3. Run deterministic fixtures first, then a tiny live local SOTA smoke with at least one mandated GGUF model if available.
      4. Compare before/after schema validity, missing-row rate, exact-validator handoff, and confident-wrong/abstention separation.
