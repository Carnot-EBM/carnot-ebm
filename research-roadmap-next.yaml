- id: exp391-cikan-energy-implementation
  milestone: 2026.06.10
  deliverable: python/carnot/models/cikan_energy.py
  title: 'Exp 391: Fix RETRO-020 — CIKANEnergy proper Python implementation (2nd attempt)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-020 — python/carnot/models/cikan_energy.py\
    \ contains JSON artifact data, not\nPython code. Exp 378 was scheduled to fix this in milestone\
    \ 2026.06.03 but was interrupted\nbefore it ran. This is the SECOND consecutive milestone where\
    \ CIKANEnergy fails to be implemented.\nThis experiment must NOT be interrupted — it is CPU-only\
    \ and runs regardless of GPU state.\n\narXiv 2412.03710 (CIKAN): Extends KAN with hard constraint\
    \ priors baked into spline activations.\nInstead of learning arbitrary spline shapes, CIKAN seeds\
    \ each edge's spline with known constraint\nboundaries — regions that violate constraints have\
    \ infinite (or very large) energy.\n\narXiv 2602.07518 (Physical Analog KAN): KAN spline activations\
    \ can be implemented in silicon\nusing Reconfigurable Nonlinear-Processing Units (RNPUs). Each\
    \ ConstraintBoundary maps to one\nRNPU saturation voltage: crossing the boundary drives output\
    \ to saturation (very high energy).\nSystem-level result: ~250 pJ/inference, ~600 ns latency.\n\
    \nWHY THIS MATTERS: CIKAN is the first Carnot energy tier with a documented path from\nPython →\
    \ FPGA LUT saturation points → aKAN silicon RNPU. This is the Phase 2 hardware path.\n\nEXISTING\
    \ CODE TO READ FIRST:\n- python/carnot/models/kan.py — KANEnergy, KANSpline, KANLayer (base KAN\
    \ tier to inherit from)\n- python/carnot/verify/energy.py — ConstraintTerm protocol, ComposedEnergy\n\
    - python/carnot/models/__init__.py — model exports (add CIKANEnergy, ConstraintBoundary)\n- tests/python/test_kan.py\
    \ — KAN test patterns to follow\n- python/carnot/models/cikan_energy.py — CURRENT FILE (contains\
    \ JSON — completely rewrite this)\n\nTASK: Re-implement CIKANEnergy as a constrained KAN subclass.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-ENERGY-010 (CIKAN energy tier with constraint-seeded\
    \ splines),\n   REQ-ENERGY-011 (constraint boundaries produce high energy at boundary crossing),\n\
    \   REQ-ENERGY-012 (CIKANEnergy.energy() is always non-negative),\n   SCENARIO-ENERGY-015/016/017\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Write tests FIRST (100% coverage\
    \ required) for ALL of the following:\n   - ConstraintBoundary(variable_idx: int, boundary_value:\
    \ float,\n     boundary_type: Literal[\"lower_bound\", \"upper_bound\", \"equality\"])\n   - seed_spline_from_constraint(spline:\
    \ KANSpline, boundary: ConstraintBoundary) → KANSpline:\n     places a knot at boundary_value;\
    \ boundary crossing increases energy (penalty near boundary)\n   - CIKANEnergy(n_vars: int, n_hidden:\
    \ int, constraint_boundaries: list[ConstraintBoundary])\n   - CIKANEnergy inherits from or wraps\
    \ KANEnergy\n   - CIKANEnergy.energy(x: jnp.ndarray) → float: always >= 0\n   - CIKANEnergy._boundary_penalty(x:\
    \ jnp.ndarray) → float:\n     sum of penalties for each boundary crossing: penalty = crossing_amount^2\
    \ * 1e6\n   - CIKANEnergy.from_constraints(constraints: list[ConstraintTerm]) → CIKANEnergy:\n\
    \     extracts variable indices and boundary values from arithmetic constraints\n   - CIKANEnergy.energy_separation_ratio(satisfying:\
    \ list, violating: list) → float:\n     mean_energy(violating) / max(mean_energy(satisfying), 1e-6)\n\
    \   - CIKANEnergy.save(path) / CIKANEnergy.load(path) via safetensors\n   - Test: 1000 random\
    \ configs always produce energy >= 0\n   - Test: energy on violating configs > energy on satisfying\
    \ configs\n4. Implement python/carnot/models/cikan_energy.py (complete rewrite, no JSON content):\n\
    \   - ConstraintBoundary dataclass with validation (__post_init__ checks boundary_type is valid)\n\
    \   - seed_spline_from_constraint — modifies KANSpline knot placement\n   - CIKANEnergy class\
    \ with all methods above\n   - Verbose docstrings explaining WHY (not just what):\n     * WHY constraint\
    \ boundaries in splines prevent violations structurally\n     * WHY each ConstraintBoundary maps\
    \ to one RNPU saturation voltage (arXiv 2602.07518)\n     * WHY energy is guaranteed non-negative\
    \ (penalty is squared distance)\n5. Export CIKANEnergy, ConstraintBoundary from carnot.models.__init__.\n\
    6. Write scripts/experiment_391_cikan_energy.py using ExperimentTemplate(391):\n   a. Create arithmetic\
    \ constraint: x0 + x1 = x2 (carry-check style)\n   b. Instantiate CIKANEnergy.from_constraints([arithmetic_constraint])\n\
    \   c. Sample 100 satisfying configs (x0+x1 == x2) and 100 violating (x0+x1 != x2)\n   d. Compute\
    \ mean_energy_satisfying, mean_energy_violating, energy_separation_ratio\n   e. Instantiate standard\
    \ KANEnergy with same n_vars, n_hidden; compute its separation ratio\n   f. cikan_vs_kan_ratio\
    \ = cikan_separation / max(kan_separation, 1e-6)\n   g. Build artifact: schema=\"carnot.cikan_energy.v1\"\
    ,\n      n_satisfying=100, n_violating=100, mean_energy_satisfying, mean_energy_violating,\n  \
    \    energy_separation_ratio, cikan_vs_kan_ratio, n_constraint_boundaries_used,\n      hardware_path_note=\"\
    Each ConstraintBoundary → 1 RNPU saturation point (arXiv 2602.07518)\"\n   h. honest_verdict:\
    \ \"structural_prevention\" when separation_ratio > 5.0;\n      \"partial_separation\" when 1.0\
    \ < ratio <= 5.0; \"no_separation\" when ratio <= 1.0\n   i. Output: results/experiment_391_cikan_energy.json\n\
    7. Write tests/python/test_cikan_energy.py (100% coverage required).\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: update ops/conductor-log.md with CIKAN status\
    \ (RETRO-020 CLOSED if implementation\n   is proper Python), ops/changelog.md, ops/status.md,\n\
    \   _bmad/architecture.md (add CIKANEnergy row to Model Tiers table).\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp392-jitrl-constraint-memory
  milestone: 2026.06.10
  deliverable: python/carnot/pipeline/jitrl_memory.py
  title: 'Exp 392: JitRL constraint memory — non-parametric threshold modulation (was Exp 386, interrupted)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: This experiment was Exp 386 in milestone\
    \ 2026.06.03 but was never implemented\n(session interrupted before it ran). This is a CPU-only\
    \ experiment.\n\narXiv 2601.18510 (JitRL) introduces Just-In-Time Reinforcement Learning: continual\n\
    learning WITHOUT gradient updates. JitRL maintains a dynamic non-parametric memory of\n(state,\
    \ action, advantage) triples. At inference time, it retrieves the k most similar triples\nand uses\
    \ their advantages to modulate the output policy via KL-constrained logit adjustment.\nThis is\
    \ the closed-form solution to KL-constrained policy optimization.\n\nWHY THIS MATTERS FOR CARNOT:\
    \ Exp 134 proved that precision-based constraint REWEIGHTING does\nnot improve accuracy. JitRL\
    \ reveals the correct algorithm: instead of reweighting constraints,\nmaintain a memory of (question_type,\
    \ constraint_type, outcome) triples and MODULATE THE\nENERGY THRESHOLD at inference time. When\
    \ Carnot has seen that \"rate problems\" trigger\ncarry_check incorrectly 8/10 times, raise the\
    \ energy threshold for carry_check on rate-type\nquestions. This is threshold modulation, not\
    \ constraint reweighting.\n\nThe memory is instant-update (no training), sub-microsecond retrieval\
    \ (CPU k-NN over small\nstore), and provably optimal under KL constraints.\n\nEXISTING CODE TO\
    \ READ FIRST:\n- python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline (wire JitRL in\
    \ as optional param)\n- python/carnot/pipeline/case_memory.py — CaseMemory patterns (Exp 136)\n\
    - python/carnot/training/adaptive_weights.py — PerModelFPTracker (Exp 132/134 — the failed approach)\n\
    - python/carnot/pipeline/constraint_templates.py — ConstraintTemplateLibrary (Exp 343)\n- tests/python/test_adaptive_weights.py\
    \ — test patterns for self-learning components\n\nTASK: Implement JitRL-style constraint memory\
    \ with threshold modulation.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-LEARN-028 (JitRL\
    \ memory modulates verification threshold without gradient updates),\n   REQ-LEARN-029 (modulation\
    \ is the closed-form KL-constrained optimal policy update),\n   SCENARIO-LEARN-051/052/053 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write tests FIRST (100% coverage required) for ALL of the following:\n   - ConstraintTriple:\
    \ dataclass (question_type: str, constraint_type: str,\n     energy_value: float, repair_outcome:\
    \ Literal[\"fixed\", \"not_fixed\", \"false_positive\"],\n     question_embedding: list[float]\
    \ | None = None)\n   - JitRLConstraintMemory(k: int = 5, kl_budget: float = 0.1, max_size: int\
    \ = 1000)\n   - JitRLConstraintMemory.record(triple: ConstraintTriple) → None\n   - JitRLConstraintMemory.retrieve(question:\
    \ str, constraint_type: str, k=5)\n     → list[ConstraintTriple]: k most similar triples\n   \
    \  Similarity: exact match on constraint_type first; then bag-of-words cosine on question\n   -\
    \ JitRLConstraintMemory.compute_threshold_adjustment(triples) → float:\n     delta = kl_budget\
    \ * mean([1 if t.repair_outcome==\"false_positive\" else -1 for t in triples])\n   - JitRLConstraintMemory.get_adjusted_threshold(base_threshold,\
    \ question, constraint_type) → float\n   - JitRLConstraintMemory.save(path) / load(path): JSON\
    \ serialization\n   - Wire into VerifyRepairPipeline as optional jitrl_memory param (additive,\
    \ no breaking changes)\n   - Test: rate problem history → positive threshold adjustment\n   - Test:\
    \ arithmetic problem history → negative or neutral adjustment\n4. Implement python/carnot/pipeline/jitrl_memory.py:\n\
    \   Include verbose docstrings explaining:\n   * WHY JitRL works (KL-constrained policy optimization,\
    \ closed-form solution)\n   * WHY threshold modulation (not weight reweighting) is the correct\
    \ Tier 1 algorithm\n   * The hardware path: memory fits on CPU; retrieval is O(log n) with sorted\
    \ index\n5. Export JitRLConstraintMemory, ConstraintTriple from carnot.pipeline.__init__.\n6. Write\
    \ scripts/experiment_392_jitrl_memory.py using ExperimentTemplate(392):\n   a. Create JitRLConstraintMemory(k=5,\
    \ kl_budget=0.1)\n   b. Record 50 synthetic triples: 25 false_positive (carry_check on rate problems),\n\
    \      25 fixed (carry_check on arithmetic problems)\n   c. Query for \"rate problem\" with carry_check\
    \ → expect positive adjustment (threshold raised)\n   d. Query for \"arithmetic problem\" with\
    \ carry_check → expect negative/neutral adjustment\n   e. Run 100 simulated verify-repair decisions\
    \ with and without JitRL modulation:\n      measure simulated_baseline_fp_rate, simulated_jitrl_fp_rate,\
    \ fp_reduction_pct\n   f. Build artifact: schema=\"carnot.jitrl_memory.v1\",\n      n_triples_recorded,\
    \ mean_adjustment_rate_problems, mean_adjustment_arith_problems,\n      simulated_fp_reduction_pct,\
    \ threshold_modulation_works\n      (threshold_modulation_works = mean_adjustment_rate > mean_adjustment_arith)\n\
    \   g. Output: results/experiment_392_jitrl_memory.json\n7. Write tests/python/test_jitrl_memory.py\
    \ (100% coverage required).\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n9. Reconcile:\
    \ update ops/conductor-log.md, ops/changelog.md, ops/status.md,\n   _bmad/architecture.md (add\
    \ JitRL memory to self-learning stack description).\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp393-safety-kan-classifier
  milestone: 2026.06.10
  deliverable: python/carnot/models/safety_kan.py
  title: 'Exp 393: Safety/Jailbreak KAN Classifier — first Tier B product (was Exp 387, interrupted)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: This experiment was Exp 387 in milestone\
    \ 2026.06.03 but was never implemented\n(session interrupted before it ran). This is a CPU-only\
    \ experiment using hardcoded training data.\n\nresearch-program.md Product Roadmap Tier B: \"Safety/Jailbreak\
    \ Classifier — Low energy\n= safe, high energy = unsafe/jailbreak. Distill from gpt-oss-safeguard\
    \ into KAN (2000x smaller).\"\nThis is the first Tier B product and the first energy application\
    \ beyond math/code verification.\n\nWHY KAN FOR SAFETY: KAN energy functions are interpretable\
    \ — you can read which spline edges\nactivate on jailbreak patterns. This is an auditable energy\
    \ function where safety professionals\ncan inspect WHY a prompt scores high energy. Additionally,\
    \ arXiv 2601.10543 (SafeProbing)\nshowed that safety-awareness signals exist in model internals\
    \ during decoding. KAN can be\ntrained to capture these signals at a fraction of the cost of a\
    \ full model.\n\nENERGY INTERPRETATION: Low energy = safe configuration. High energy = jailbreak/unsafe.\n\
    Same sign convention as all Carnot energy tiers (low = valid, high = violated).\nThe energy function\
    \ encodes: 'how far is this text from the safe manifold?'\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/models/kan.py\
    \ — KANEnergy, KANLayer, KANSpline (base KAN to extend)\n- python/carnot/models/__init__.py —\
    \ model exports (add SafetyKANClassifier, SafetyExample)\n- tests/python/test_kan.py — KAN test\
    \ patterns to follow\n\nTASK: Implement SafetyKANClassifier as a KAN energy model.\n1. Read CLAUDE.md\
    \ spec-first workflow.\n2. Add REQ-SAFE-001 (SafetyKANClassifier: low energy = safe, high = jailbreak),\n\
    \   REQ-SAFE-002 (trained via binary contrastive loss on labeled examples),\n   SCENARIO-SAFE-001/002/003\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Write tests FIRST (100% coverage\
    \ required) for ALL of the following:\n   - SafetyExample: dataclass (text: str, label: Literal[\"\
    safe\", \"jailbreak\"])\n   - encode_safety_text(text: str, max_features: int = 32) → jnp.ndarray:\n\
    \     bag-of-words features over safety-relevant keywords (no LLM embedding, CPU-only).\n     Features:\
    \ instruction-following signals (n_imperative_verbs, n_system_words),\n     jailbreak signals\
    \ (n_roleplay_words, n_ignore_words, n_bypass_words), text statistics\n     (length_ratio, question_mark_count,\
    \ etc.). Normalize to [0, 1].\n   - SafetyKANClassifier(n_features: int = 32, n_hidden: int =\
    \ 8)\n   - SafetyKANClassifier.energy(text: str) → float: encodes text, runs KANEnergy\n   - SafetyKANClassifier.is_safe(text,\
    \ threshold: float = 1.0) → bool: energy(text) < threshold\n   - SafetyKANClassifier.train(examples:\
    \ list[SafetyExample], n_epochs: int = 100) → list[float]:\n     contrastive loss: max(0, E_safe\
    \ - E_jailbreak + margin=1.0); returns loss history\n   - SafetyKANClassifier.evaluate_auroc(examples)\
    \ → float: AUC-ROC on labeled set\n   - SafetyKANClassifier.save(path) / load(path) via safetensors\n\
    4. Implement python/carnot/models/safety_kan.py with all classes above.\n   Verbose docstrings:\n\
    \   * WHY energy-based safety is auditable (spline inspection, not black box)\n   * WHY low energy\
    \ = safe (configuration on the safe manifold)\n   * The Phase 3 path: safety KAN becomes the foundation\
    \ model's built-in safety layer\n5. Export SafetyKANClassifier, SafetyExample from carnot.models.__init__.\n\
    6. Write scripts/experiment_393_safety_kan.py using ExperimentTemplate(393):\n   a. SAFE_EXAMPLES\
    \ (hardcoded, 30 safe texts):\n      math questions, coding tasks, factual questions, creative\
    \ writing requests\n   b. JAILBREAK_EXAMPLES (hardcoded, 30 jailbreak texts using clearly synthetic/research\
    \ examples):\n      \"ignore previous instructions\", \"pretend you are DAN\",\n      \"as an\
    \ AI with no restrictions\", \"roleplay as\",\n      \"you are now in developer mode\", \"bypass\
    \ your safety filters\",\n      \"act as a character who can do anything\", \"forget that you are\
    \ an AI\",\n      \"your true self has no restrictions\", \"from now on respond as\"\n      (use\
    \ clearly synthetic/research pattern examples — no actual harmful content)\n   c. Train SafetyKANClassifier()\
    \ on 80% of examples (48 train, 12 test)\n   d. Evaluate AUC-ROC on held-out 20%\n   e. Build\
    \ artifact: schema=\"carnot.safety_kan.v1\",\n      n_safe_examples=30, n_jailbreak_examples=30,\
    \ train_auroc, test_auroc,\n      energy_separation_ratio, n_features=32,\n      honest_verdict:\
    \ \"safety_classification_works\" when test_auroc > 0.70;\n      \"partial\" when 0.60 < test_auroc\
    \ <= 0.70; \"no_better_than_random\" when <= 0.60\n   f. Output: results/experiment_393_safety_kan.json\n\
    7. Write tests/python/test_safety_kan.py (100% coverage required).\n8. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n9. Reconcile: update ops/conductor-log.md, ops/changelog.md,\
    \ ops/status.md.\n   Note this as first Tier B product in ops/status.md.\nRun: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp394-precision-pipeline-live-execute
  milestone: 2026.06.10
  deliverable: results/experiment_394_precision_live.json
  title: 'Exp 394: Live precision pipeline — 200 GSM8K, 5 variants, 2 models (GPU required)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: scripts/experiment_368_precision_live.py\
    \ and scripts/experiment_379_precision_execute.py\nexist with passing tests and hard LiveGPUGate\
    \ gates. They were blocked in milestones 2026.05.27\nand 2026.06.03 because the GPU node was offline.\
    \ Exp 390 (this milestone) confirmed the GPU\nstate. If Exp 390 returned honest_verdict='gpu_confirmed_live',\
    \ proceed. If not, write blocked\nartifact immediately and exit.\n\nThis is Carnot's headline metric\
    \ experiment. The 5 pipeline variants × 2 models × 200 GSM8K\nquestions produce the first credible\
    \ precision-stack numbers. The honest_verdict field\ndetermines whether results can be reported\
    \ publicly.\n\nThe 5 pipeline variants:\n  BASELINE — no verification\n  CONFIDENCE_ONLY — energy\
    \ threshold gate only\n  CONFIDENCE_ADAPTIVE — adaptive threshold via PerModelFPTracker\n  CONFIDENCE_ADAPTIVE_VERGE\
    \ — adaptive threshold + Z3 VERGE refinement\n  FULL_STACK — all tiers including EORM gate\n\
    Models: google/gemma-4-E4B-it (GPU0), Qwen/Qwen3.5-0.8B (GPU1).\n\nEXISTING CODE TO READ FIRST:\n\
    - scripts/experiment_379_precision_execute.py — existing execution script (READ CAREFULLY)\n- python/carnot/pipeline/precision_benchmark.py\
    \ — PipelineVariant, PrecisionStackResult (Exp 340)\n- python/carnot/pipeline/live_gpu_gate.py\
    \ — LiveGPUGate (Exp 377)\n- python/carnot/pipeline/llm_extractor.py — LLMExtractor (Exp 366)\n\
