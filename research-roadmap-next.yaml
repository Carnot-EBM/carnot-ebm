      - experiment_id: exp3071-dafny-feedback-ablation
        verdict: "complete_below_gate: guided_success_delta=0.0"
        addressed_by: "Moves from guided repair lift to proof-carrying coherence diagnostics and minimal-change contradiction localization."
        retire_if_same_verdict: true
