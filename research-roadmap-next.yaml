      - next_top_gap: str
      - cuda_recovery_unblocked_sota_receipt: bool (principle: records whether the reboot fix flowed through to a real receipt)
      - random_seed: int
      - reproducibility_checksum: str
      - duration_s: float
      - honest_verdict: str (principle: complete:/success:/passed:/shipped_ prefix)
