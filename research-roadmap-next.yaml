  - id: exp4712-a1
    milestone: 2026.06.434
    title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY 2026-06-25 "yes"; HEADLINE) -- PERCEPTION-GROUNDED
      STRUCTURAL-ALIGNMENT L2 GOAL: bank lp85 L1->L2. The .433 A1 diagnostic settled perception_is_the_wall=TRUE and
      built+persisted the object-centric representation (object_centric_representation_builder_operator). Convert that
      perception win into a banked MULTI-LEVEL solve: express lp85''s L2 is_level_complete as a STRUCTURAL ALIGNMENT
      predicate over DETECTED objects (each moveable piece aligned to its goal sprite), computed from ONE live frame
      (no L2-win exemplar needed), wired into the live level_up_reinduction path; plan to it and execute on the
      SCORED E3AgentPolicy. Gate: lp85 reaches L2 (reproduced_levels>=2), offline-reproduced, goal_predicate_
      satisfiable=True AND l2_plan_reaches_goal=True, the goal a piece->sprite alignment over detected objects (not a
      per-game hardcode). live_llm_inference. live_agent_self_discovery. verifier_is_oracle:false.
      retire_if_same_verdict.'
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4712_perception_grounded_l2_goal_lp85.json
    prior_failures:
      - experiment_id: exp4664-l2-goal
        verdict: 'complete: l2_goal_induction_no_deepening_residual_single_exemplar_goal_insufficient'
        addressed_by: 'exp4664 (.430) induced the L2 goal from a FLAT L1-completion EXEMPLAR grid, which CANNOT
          express an alignment goal -> goal_predicate_satisfiable=False, the induced is_level_complete stayed
          degenerate. THIS task is STRUCTURALLY DIFFERENT, exactly addressing that residual: it expresses L2 as a
          STRUCTURAL ALIGNMENT predicate over DETECTED objects (every moveable piece aligned to its goal sprite),
          computed from ONE live frame via the .433 A1 object-centric perception operator -- not a flat exemplar
          grid. The .430 satisfiability check + win-state plumbing already shipped (arc_llm_reinduction.py:441); this
          adds the perception-grounded GOAL EXPRESSION that was missing, so the check will now find it SATISFIABLE on
          >=1 reachable grid. If the structural alignment goal STILL yields goal_predicate_satisfiable=False /
          no_reachable_plan, the residual is documented (the object detector cannot resolve lp85 pieces/sprites, or
          alignment is under-determined) and this precise lever retires; the next fallback is the multi-exemplar
          variant (bank >=2 L1-completion exemplars), NOT the CNN driver.'
        retire_if_same_verdict: true
      - experiment_id: exp4537-reinduction
        verdict: 'complete: per_level_reinduction_no_new_level_offline_reproduced'
        addressed_by: 'exp4537 (.420) persisted the per-level reinduction operator (detect level-up, clear stale
          induction, re-induce the L_{n+1} predicate) but banked no new level because the re-induced predicate was
          not GROUNDED in detected objects -- it re-induced from the post-transition representation without a
          structural alignment expression. THIS task supplies the missing object-grounded goal expression (piece->
          sprite alignment over the .433 A1 object-centric detector) into that same reinduction path. Forward
          difference: a structural alignment predicate over DETECTED objects vs an ungrounded re-induced predicate. If
          it still banks no L2, the residual is logged as the .435 goal-grounding gap and this lever retires.'
        retire_if_same_verdict: true
    prompt: |
      CONTEXT ({date}, ARC sprint HEADLINE -- operator 2026-06-25 "yes" pre-stage). The .433 A1 diagnostic
      (exp4700) settled the 8-milestone perception-vs-search question: perception_is_the_wall=TRUE -- an
      object-centric/relational representation makes the winning L1 trajectory FULLY PROPOSABLE (coverage 1.0 vs
      order-1's 0.75). That object-centric representation is BUILT and PERSISTED as the
      object_centric_representation_builder_operator primitive (exp4704). This task converts that perception win into
      a banked MULTI-LEVEL solve. lp85 is the one game that reliably reaches L1; its L2 win condition is
      marker_pair_shape_alignment (registry): "align each moveable piece with its goal sprite", click-only. It is
      goal-DIRECTED and sparse (level-up only when ALL pieces align), so goal-free exploration can't stumble onto it
      and a flat exemplar grid (exp4664, .430) can't express it -- BUT the goal is OBSERVABLE in a single live frame
      (the goal sprites are visible). So the goal must be a PERCEPTION-GROUNDED STRUCTURAL predicate over detected
      objects, not an exemplar replay.

      CRITICAL DISCIPLINE (CLAUDE.md ARC Live-Path Reachability): the changes are in the LIVE modules
      (arc_competition_agent.py:_induce_and_plan / arc_llm_reinduction.py / arc_executable_world_model.py + the .433
      A1 object-centric perception operator) imported by E3AgentPolicy -- arc_orphan_solver_lint stays green;
      test_arc_submitted_agent_parity stays green. live_llm_inference: the reinduction path loads + runs the
      Qwen3.5-9B-MTP GGUF on the iGPU (NEVER the 3090s; free port + /props-verify). verifier_is_oracle:false (the
      alignment predicate is oracle-DISTINCT from the env's own level-up check). solve_provenance:
      live_agent_self_discovery -- a generic-agent L2 via the perception-grounded goal is self-discovery; a hand-built
      GameAdapter L2 is a development_proxy that does NOT prove the live fix. REGISTRY-PRECHECK: lp85 currently has
      levels_reproduced=5 in the registry via an ADAPTERED path -- but this task must reach L2 GENERICALLY via the
      live perception-grounded goal (live_agent_self_discovery), which the adapter does not prove; confirm the
      generic live path does not already self-discover L2 before claiming the bank (if it does, that IS the deliverable).

      NOTE the PORT-8919 CONFOUND: LocalGGUFProposer.port defaults to 8919 and a persistent gemma-4-12B-it
      llama-server squats 8919 -> any "Qwen" run silently talks to gemma. CONSTRUCT the proposer on a FREE port (e.g.
      8920) + verify via /props it served Qwen3.5-9B-MTP. On Kaggle (fresh env) this is moot; locally it confounds
      every generation measurement.

      EXISTING CODE TO READ FIRST:
        - {project_root}/ops/known-issues.md (the 2026-06-25 MANDATORY entry "PERCEPTION-GROUNDED STRUCTURAL-ALIGNMENT L2 GOAL" -- the full task spec, the two nulled levers NOT to re-propose, the falsifiable gate, the silent Go-Explore (1,64,64) bug note)
        - {project_root}/results/experiment_4700_object_centric_perception_proposal_live.json (the .433 A1 -- perception_is_the_wall=True; cite the module/operator the object-centric perception ships as) + {project_root}/results/experiment_4664_l2_goal_predicate_induction_live.json IF PRESENT (the single-exemplar null this fixes)
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (E3AgentPolicy + _induce_and_plan; the level_up_reinduction path) + {project_root}/python/carnot/agentic/arc_llm_reinduction.py (~L441 goal-satisfiability check -- it will now find the structural alignment goal SATISFIABLE) + {project_root}/python/carnot/agentic/arc_executable_world_model.py (plan_in_model)
        - {project_root}/python/carnot/agentic/arc_value_learner.py OR the module the .433 A1 object-centric operator ships in (the piece/sprite object detector) + {project_root}/ops/arc_solve_registry.yaml (lp85 row: L2 = marker_pair_shape_alignment)
        - {project_root}/python/carnot/agentic/arc_solver_kit.py (reproduce gate) + {project_root}/scripts/arc_orphan_solver_lint.py + {project_root}/tests/python/test_arc_submitted_agent_parity.py (MUST stay green)

      TASK: in the LIVE modules, (a) detect lp85's moveable pieces + their goal sprites via the .433 A1
      object-centric perception operator; (b) express is_level_complete(grid) := every detected piece is aligned to
      its goal sprite -- a STRUCTURAL predicate computed from ONE live frame (no L2-win exemplar); (c) wire it into
      the live level_up_reinduction path so the goal-satisfiability check (arc_llm_reinduction.py:441) finds it
      SATISFIABLE on >=1 reachable grid; (d) plan to it (plan_in_model) and execute on the SCORED E3AgentPolicy; (e)
      replay-verify via arc_solver_kit.reproduce. The WIN: lp85 reaches L2 (reproduced_levels>=2), offline-reproduced,
      goal_predicate_satisfiable=True AND l2_plan_reaches_goal=True, the goal a piece->sprite alignment over DETECTED
      objects. verifier_is_oracle:false.

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. The .433 A1 object-centric perception operator exists + is importable (cite the module + operator name); else honest_verdict blocked_a1_perception_operator_missing, EXIT.
           b. Qwen3.5-9B-MTP GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-MTP-GGUF/` non-empty; else blocked_model_not_cached_qwen, EXIT.
           c. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0 AND lp85 offline env present.
           d. LLM proposer on a FREE port + /props-verify Qwen (not gemma-8919); else blocked_qwen_proposer_port, EXIT.
           ANY missing -> populate preconditions_checked, EXIT (no fabrication). (--no-cov on focused pytest.)
        1. Build the structural alignment goal expression over detected objects; wire into level_up_reinduction. Confirm `.venv/bin/python scripts/arc_orphan_solver_lint.py` stays green.
        2. Run the live generic E3AgentPolicy on lp85 with the perception-grounded goal; plan_in_model -> execute. Replay-verify via arc_solver_kit.reproduce. POSITIVE CONTROL: lp85 reaches L1 reproducibly (the headroom exists).
        3. RUN test_arc_submitted_agent_parity.py -> green. If it nulls, log the residual (object_detector_cannot_resolve_lp85_pieces_sprites | alignment_under_determined | no_reachable_plan) as the .435 target; the next fallback is the multi-exemplar variant, NOT the CNN driver.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: perception_grounded_l2_goal_lp85_L2_offline_reproduced OR complete: l2_perception_goal_no_deepening_residual_<cause>."
        inference_substrate:
          principle: "live_llm_inference -- the reinduction path loads + runs the Qwen3.5-9B-MTP GGUF (60s floor); model_specs MUST name the GGUF (avoid METHODOLOGY_MISSING)."
        goal_predicate_satisfiable:
          principle: "the .430 gate checks DYNAMICS only; this records the L2 alignment goal is True on >=1 reachable grid -- the verification exemplar-replay never produced."
        goal_expression:
          principle: "MUST be a STRUCTURAL predicate over DETECTED objects (e.g. structural_piece_sprite_alignment_over_detected_objects), not a per-game hardcode or a flat exemplar grid."
        l2_plan_reaches_goal:
          principle: "plan_len=0 / no_reachable_plan was the measured failure; True means the plan reaches the satisfiable goal."
        reproduced_levels:
          principle: "the integer level reached; >=2 is the lp85 L2 bank (only reproduced levels count)."
        offline_reproduced:
          principle: "a reproduced L2 via arc_solver_kit.reproduce is the fix working; a live-only trajectory is provisional."
        solve_provenance:
          principle: "live_agent_self_discovery -- a generic-agent L2 via the perception-grounded goal is self-discovery; an adapter L2 is a dev proxy that does not prove the live fix."
        verifier_is_oracle:
          principle: "MUST be false -- the alignment predicate is oracle-distinct from the env's own level-up check."
        live_path_reachable:
          principle: "HARD gate -- the changed modules are in the E3AgentPolicy import closure; arc_orphan_solver_lint passes."
        registry_precheck_generic_l2:
          principle: "confirms the generic live path does not ALREADY self-discover lp85 L2 (vs the adaptered registry row) -- a duplicate of an already-banked GENERIC level is a CRITICAL adversarial flag."
        parity_test_green:
