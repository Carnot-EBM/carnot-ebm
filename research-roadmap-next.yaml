  - id: exp369-live-humaneval
    milestone: "2026.05.27"
    deliverable: results/experiment_369_humaneval_live.json
    title: "Exp 369: Live HumanEval code verification — 50 problems, CodeExtractor + PBT, Gemma4-E4B-it"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 341 built the live HumanEval code verification benchmark (50 problems,
      CodeExtractor + VerifyRepairPipeline + PBT). Like all live experiments in milestone
      2026.05.20, it ran in simulated mode. Exp 226 showed +3.0pp (19/164 → 24/164) on a
      prior live run. This experiment re-runs with CARNOT_FORCE_LIVE=1 to confirm that result
      and measure it with the current pipeline (including CoTCircuitVerifier and the full stack).

      Code verification is structurally different from math: it uses EXECUTION-based verification
      (run the code, check output) not regex extraction. This makes it our strongest result
      category — the CodeExtractor+PBT path should work on instruction-tuned models.

      IMPORTANT: CARNOT_FORCE_LIVE=1 must be set. Produce blocked artifact if GPU unavailable.

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_341_live_humaneval.py — prior script to re-use/extend
      - python/carnot/pipeline/extract.py — CodeExtractor
      - results/experiment_341_live_humaneval.json — prior simulated result (for schema)
      - python/carnot/pipeline/precision_benchmark.py — HumanEvalResult patterns (Exp 340/341)
      - python/carnot/inference/solver.py — LLM solver patterns

      TASK: Execute live HumanEval code verification benchmark.
      1. Read CLAUDE.md spec-first workflow.
      2. Add SCENARIO-BENCH-021 (live HumanEval pass@1 after verify-repair)
         to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for any NEW helper functions.
      4. Implement scripts/experiment_369_humaneval_live.py:
         a. ExperimentTemplate(369), setup_gpu([Gemma4-E4B-it GPU0])
         b. diagnose_live_gpu(["google/gemma-4-E4B-it"]) — raise RuntimeError if not live
         c. Load 50 HumanEval problems (official human_eval package → 50-problem manual fallback)
         d. Generate code solutions with Gemma4-E4B-it (BatchedInferenceRunner, batch_size=8)
         e. For each solution: run official test cases (subprocess with timeout=10s)
         f. For FAILED solutions: run CodeExtractor + VerifyRepairPipeline
         g. Re-run official test cases on repaired solutions
         h. Compute: pass@1_before, pass@1_after, headline_improvement (signed, no clamping)
         i. Also run PBT (pytest-hypothesis style) on solutions that pass official tests to
            catch unofficial bugs (Exp 224/227 pattern)
         j. Build artifact: schema="carnot.humaneval_benchmark.v2",
            inference_mode="live_gpu", n_problems, pass_at_1_before, pass_at_1_after,
            signed_improvement, pbt_bugs_found, honest_verdict:
            "code_verification_positive" only when inference_mode=="live_gpu" AND signed_improvement > 0
         k. Output: results/experiment_369_humaneval_live.json
      5. Write tests/python/test_experiment_369_humaneval_live.py (100% new-function coverage).
      6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      7. Reconcile: update ops/conductor-log.md, ops/changelog.md, ops/status.md.
      Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp370-live-adversarial-gsm8k
    milestone: "2026.05.27"
    deliverable: results/experiment_370_adversarial_live.json
    title: "Exp 370: Live adversarial GSM8K — Apple arXiv 2410.05229, first credibility result"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: THIS IS CARNOT'S HEADLINE CREDIBILITY EXPERIMENT. Exp 354 built the harness
      (harness_ready=True). Exp 355 was blocked_simulated because CARNOT_FORCE_LIVE was never
      set (RETRO-012). This experiment re-runs with Exp 365's conductor_gpu_env.sh fix.

      Apple researchers (arXiv 2410.05229) showed frontier LLMs drop up to 65% accuracy when
      one irrelevant sentence is appended to GSM8K math problems. Even o1-preview drops
      92.7% → 77.4%. Carnot's hypothesis: ArithmeticExtractor (and now LLMExtractor) parses
      arithmetic regardless of irrelevant context. Verify-repair should MAINTAIN accuracy on
      adversarial variants, showing improvement LARGER than on standard variants.

      The three conditions from Exp 354:
        standard: original GSM8K question
        adversarial: question + one irrelevant sentence (seeded from DISTRACTOR_SENTENCES pool)
        repaired_adversarial: adversarial + verify-repair

      IMPORTANT: CARNOT_FORCE_LIVE=1 must be set. This experiment MUST produce honest_verdict
      from the four-branch logic in Exp 355: {improvement_positive, degradation_positive,
      neutral, blocked_simulated}. Only blocked_simulated is unacceptable.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/adversarial_gsm8k.py — AdversarialGSMQuestion, harness (Exp 354)
      - scripts/experiment_355_adversarial_gsm8k_benchmark.py — benchmark script to re-use
