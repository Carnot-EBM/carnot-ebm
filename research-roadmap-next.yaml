milestone: "2026.05.275"
milestone_title: "Hardware Baselines + Code Hallucination Repair + Verifier-Grounded Self-Learning"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"

# Pre-staged 2026-05-23 by outer-loop per Pre-Staged Roadmap Convention.
# Theme: .274 reactivated physical hardware and produced the first KV260
# latency transcript, but left three hard gaps: no matched CPU baseline for
# hardware speedup claims, GateMate blocked by missing nextpnr-gatemate, and
# flagged SOTA code-generation methodology. .275 closes those gaps while adding
# verifier-grounded continuous self-learning.

