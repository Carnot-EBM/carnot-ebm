- id: exp635-adaptrack-constrained-gen
  milestone: 2026.04.48
  deliverable: results/experiment_635_adaptrack_backtrack.json
  title: 'Exp 635: AdapTrack Constrained Generation — Adaptive Backtrack on SymCodeVerifier Violation (arXiv 2510.17376)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: AdapTrack\
    \ (arXiv 2510.17376, Oct 2025) backtracks during constrained decoding when the\
    \ fraction of invalid next-token choices exceeds a threshold. Key mathematical\
    \ property: the output distribution is IDENTICAL to the model's own distribution\
    \ under constraints — no output distortion. Applied to Carnot: when SymCodeVerifier\
    \ detects an arithmetic violation at sentence k, backtrack to sentence k-1 and\
    \ regenerate with a correction hint injected into the prompt. The backtrack is\
    \ proportional to the SymCodeVerifier detection_score (high score = high confidence\
    \ violation = always backtrack; low score = ambiguous = sometimes backtrack).\
    \ This provides in-generation repair vs Carnot's current post-hoc VerifyRepairPipeline.\n\
    \nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/interwhen_monitor.py\
    \ — InterWhenMonitor.monitor_full_response() (Exp 627)\n- python/carnot/pipeline/symcode_verifier.py\
    \ — SymCodeVerifier.detection_score() → float\n- python/carnot/pipeline/verify_repair.py\
    \ — VerifyRepairPipeline (post-hoc repair baseline)\n- results/live_pairs_578.json\
    \ — live responses for simulation test\n\nTASK: Implement AdapTrack-style constrained\
    \ generation with SymCodeVerifier.\n1. Read CLAUDE.md spec-first workflow.\n2.\
    \ Add REQ-REPAIR-010 (AdapTrackRepairer: in-generation backtrack on SymCodeVerifier\
    \ violation), REQ-REPAIR-011 (AdapTrackRepairer: output distribution-preserving\
    \ per arXiv 2510.17376), SCENARIO-REPAIR-020/021/022 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Create python/carnot/pipeline/adaptrack_repairer.py:\n   a. BacktrackEvent dataclass:\
    \ sentence_index (int), detection_score (float), backtrack_triggered (bool),\
    \ correction_hint (str | None).\n   b. AdapTrackRepairer class:\n      __init__(self,\
    \ monitor: InterWhenMonitor, backtrack_threshold: float = 0.5):\n        self.monitor\
    \ = monitor\n        self.threshold = backtrack_threshold\n      should_backtrack(self,\
    \ detection_score: float) -> bool:\n        'Adaptive decision: backtrack probability\
    \ proportional to detection_score.'\n        import random\n        if detection_score\
    \ >= self.threshold: return True  # definite violation\n        p_backtrack =\
    \ detection_score / self.threshold  # proportional to violation confidence\n  \
    \      return random.random() < p_backtrack\n      generate_hint(self, violated_sentence:\
    \ str, violation: InterWhenViolation) -> str:\n        'Generate a correction hint\
    \ to inject before regeneration.'\n        if violation.step_results:\n       \
    \   worst = max(violation.step_results, key=lambda s: s.violation_detected)\n \
    \         return f'[Note: The arithmetic in the previous step was incorrect. Recalculate\
    \ carefully.]'\n        return '[Note: Recheck the previous calculation.]'\n  \
    \    simulate_repair(self, response: str) -> tuple[str, list[BacktrackEvent]]:\n\
    \        'Simulate AdapTrack repair on a completed response.'\n        sentences\
    \ = self.monitor.verifier.segment_steps(response)\n        repaired_sentences\
    \ = list(sentences)\n        events = []\n        for i, sent in enumerate(sentences):\n\
    \            partial = ' '.join(repaired_sentences[:i+1])\n            violation\
    \ = self.monitor.monitor_partial(partial)\n            if violation and self.should_backtrack(violation.detection_score):\n\
    \                hint = self.generate_hint(sent, violation)\n                repaired_sentences[i]\
    \ = hint + ' ' + sent  # inject hint in place\n                events.append(BacktrackEvent(i,\
    \ violation.detection_score, True, hint))\n            else:\n              events.append(BacktrackEvent(i,\
    \ violation.detection_score if violation else 0.0, False, None))\n        return\
