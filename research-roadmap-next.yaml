milestone: "2026.05.210"
milestone_title: "ALPS-based Generative Inference, KAN-CL Continuous Self-Learning, and ActFocus Energy Reweighting"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp2108-archive-and-activate
    title: "Phase 0: Archive .209 and activate .210"
    max_turns: 20
    prompt: |
      CONTEXT: Milestone 2026.05.209 has completed. We must prepare for 2026.05.210.
      EXISTING CODE TO READ FIRST: {project_root}/research-complete.yaml, {project_root}/research-roadmap.yaml
      TASK: Archive 2026.05.209 to research-complete.yaml and initialize the .210 milestone in ops/changelog.md.
      CONCRETE STEPS:
      1. Move all tasks from `research-roadmap.yaml` into `research-complete.yaml` under a new 2026.05.209 entry, setting completed date to {date}.
      2. Clear `research-roadmap.yaml` and copy the new milestone structure from `research-roadmap-next.yaml`.
      3. Add a "## {date} (Milestone 2026.05.210 Operational Retrospective)" stub in `ops/changelog.md`.
      4. Write deliverable to `results/experiment_2108_archive.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2109-alps-sampler-module
    title: "Phase 1: Annealed Langevin Posterior Sampling (ALPS) Module"
    max_turns: 50
    prompt: |
      CONTEXT: ALPS provides faster convergence for EBMs by annealing static posterior distributions, overcoming traditional MCMC delays.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/samplers/langevin.py
      TASK: Implement an ALPS sampler that composes directly with Carnot's core ContinuousEBM.
      CONCRETE STEPS:
      1. Create `python/carnot/samplers/alps.py` implementing the ALPS schedule.
      2. Write a unit test in `tests/python/test_alps.py` verifying ALPS convergence is significantly faster than standard Langevin on a multi-modal toy landscape.
      3. Save to `results/experiment_2109_alps_module.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2110-energy-guided-decoding
    title: "Phase 1: Energy-Guided Decoding with Hidden State Selection"
    max_turns: 50
    prompt: |
      CONTEXT: Energy-guided decoding dynamically selects hidden states from the layer with the minimal energy score to mitigate hallucination.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/llm_solver.py
      TASK: Extend the LLM solver to intercept internal representations and apply an energy minimization criteria during decoding.
      CONCRETE STEPS:
      1. Add `EnergyGuidedDecoder` in `python/carnot/inference/energy_decoding.py`.
      2. Ensure it supports extracting representations from the mandated SOTA models (`unsloth/Qwen3.6-35B-A3B-GGUF`, `unsloth/gemma-4-31B-it-GGUF`).
      3. Save to `results/experiment_2110_energy_decoding.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2111-kan-cl-regularization
    title: "Phase 2: KAN-CL Per-Knot Importance Regularization"
    max_turns: 50
    agent_type: "codex"
    prompt: |
      CONTEXT: KAN-CL provides per-knot importance regularization for Continuous Learning in Kolmogorov-Arnold Networks to stop catastrophic forgetting without uniform penalties.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/models/ising/kan_tier.py
      TASK: Implement the KAN-CL regularization loss term.
      CONCRETE STEPS:
      1. Update the KAN tier to calculate node-specific sensitivities (diagonal Fisher information matrix proxy).
      2. Apply the EWC-style per-knot penalty during training.
      3. Save to `results/experiment_2111_kan_cl.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2112-muon-ogd-projection
    title: "Phase 2: Muon-OGD Spectral Orthogonal Gradient Projection"
    max_turns: 50
    agent_type: "codex"
    prompt: |
      CONTEXT: Muon-OGD applies orthogonalized momentum updates using spectral-norm geometry to avoid interference with prior tasks during continuous LLM adaptation.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/training/csl_loop.py
      TASK: Implement Muon-OGD for the LLM policy update step.
      CONCRETE STEPS:
      1. Create `python/carnot/training/muon_ogd.py` implementing Newton-Schulz matrix-sign approximations.
      2. Hook it into the Continuous Self-Learning (CSL) loop.
      3. Save to `results/experiment_2112_muon_ogd.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2113-kan-cl-muon-eval
    title: "Phase 2: Continual Learning Catastrophic Forgetting Evaluation"
    max_turns: 50
    gated_on:
      - upstream: exp2111-kan-cl-regularization
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: We must verify KAN-CL and Muon-OGD actually prevent forgetting on a sequence of constraints.
      EXISTING CODE TO READ FIRST: {project_root}/tests/python/test_csl_loop.py
      TASK: Benchmark the new regularizations on the self-learning loop.
      CONCRETE STEPS:
      1. Create a sequential learning test where constraints A then B then C are taught iteratively.
      2. Verify constraint A is not forgotten (0% catastrophic forgetting) when C is learned.
      3. Save to `results/experiment_2113_cl_eval.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2114-actfocus-reweighting
    title: "Phase 3: ActFocus Token-Level Energy Reweighting"
    max_turns: 50
    prompt: |
      CONTEXT: ActFocus downweights reasoning tokens and upweights action tokens in the policy gradient based on an energy-redistribution mechanism, solving the action bottleneck.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/verifier.py
      TASK: Modify the reinforcement/energy feedback to apply ActFocus.
      CONCRETE STEPS:
      1. Inject a weighting function into the reward scalar calculation that isolates the 'action' token segment from 'CoT' segments.
      2. Downweight gradients on reasoning tokens and redistribute energy to action tokens.
      3. Save to `results/experiment_2114_actfocus.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2115-nexus-symbolic-grounding
    title: "Phase 3: NEXUS Symbolic Grounding for ActFocus"
    max_turns: 50
    prompt: |
      CONTEXT: NEXUS framework grounds probabilistic risk into deterministic constraints pre-action to establish a rigorous pre-action defense.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/pipeline/extract.py
      TASK: Bridge Carnot's symbolic verifiers (Z3) into the ActFocus reward trace.
      CONCRETE STEPS:
      1. Build `python/carnot/pipeline/nexus_grounding.py` to evaluate pre-action safety.
      2. Decouple physical feasibility from safety specifications during the CSL feedback loop.
      3. Save to `results/experiment_2115_nexus.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2116-actfocus-gsm8k-benchmark
    title: "Phase 3: ActFocus + ALPS Benchmark on GSM8K"
    max_turns: 50
    prompt: |
      CONTEXT: Must test the new ALPS sampler and ActFocus reweighting on a live SOTA model.
      EXISTING CODE TO READ FIRST: {project_root}/tests/integration/test_gsm8k.py
      TASK: Execute a live run using mandated SOTA GGUFs.
      CONCRETE STEPS:
      1. Run a 50-problem GSM8K slice using `unsloth/Qwen3.6-35B-A3B-GGUF`.
      2. Measure accuracy and token-efficiency against baseline without ActFocus/ALPS.
      3. Save to `results/experiment_2116_actfocus_benchmark.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2117-neuroring-topology-sim
    title: "Phase 4: NeuroRing Bidirectional Ring Topology Simulation"
    max_turns: 100
    model: "opus"
    prompt: |
      CONTEXT: NeuroRing scales constraint satisfaction on FPGAs via stream-dataflow. We must simulate this to advance hardware metrics.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/samplers/parallel_ising.py
      TASK: Simulate NeuroRing synchronization for the parallel Ising sampler.
      CONCRETE STEPS:
      1. Implement a bidirectional ring-topology communication pattern for distributed Ising nodes.
      2. Compute no-synthesis hardware accounting (latency, BOP) over Sudoku constraints.
      3. Save to `results/experiment_2117_neuroring.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2118-full-integration-e2e
    title: "Phase 4: Full E2E Benchmark (ALPS + ActFocus + KAN-CL + Muon-OGD)"
    max_turns: 50
    gated_on:
      - upstream: exp2116-actfocus-gsm8k-benchmark
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: The pinnacle of Milestone 210. Must prove CSL loops function flawlessly with the new capabilities.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/pipeline/verify_repair.py
      TASK: Run the entire integrated pipeline on a complex reasoning scenario.
      CONCRETE STEPS:
      1. Assemble ALPS, ActFocus, KAN-CL, and Muon-OGD into the VerifyRepairPipeline.
      2. Run the E2E verification test, observing catastrophic forgetting rates and energy bounds.
      3. Save to `results/experiment_2118_full_e2e.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2119-milestone-210-retro
    title: "Phase 4: Milestone 2026.05.210 Retrospective"
    max_turns: 20
    prompt: |
      CONTEXT: End of milestone analysis for .210.
      EXISTING CODE TO READ FIRST: {project_root}/ops/conductor-log.md
      TASK: Generate the retrospective analysis of the .210 milestone.
      CONCRETE STEPS:
      1. Read all experiment results from the 210X series.
      2. Synthesize findings into `results/experiment_2119_retro.json` and update `ops/status.md`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'