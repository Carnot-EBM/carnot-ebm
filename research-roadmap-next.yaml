  - id: exp3178-receipt-backed-authenticity-contract-v3
    milestone: "2026.05.295"
    deliverable: "results/experiment_3178_receipt_backed_authenticity_contract_v3.json"
    title: "Receipt-backed live authenticity contract v3"
    priority: critical
    max_turns: 100
    model: opus
    estimated_wall_time_min: 35
    track: "verification"
    inference_substrate: "aggregation_and_contract"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3164-duration-corrected-authenticity-contract-v2
        verdict: "complete: duration_corrected_authenticity_contract_v2_ready=true; old_fixed_duration_rule_retired_as_hard_gate=true"
        addressed_by: "Extends the v2 measured-work contract with explicit model/cache/CUDA/CPU substrate classification and proof-of-execution receipts."
        retire_if_same_verdict: true
      - experiment_id: exp3165-live-sota-authenticity-replay-v2
        verdict: "blocked_gpu_substrate: live_sota_authenticity_replay_v2_ready=true; preflight_passed=false; live_call_count=0"
        addressed_by: "Defines how a replay smoke can distinguish unavailable CUDA from missing model cache and bounded CPU fallback without unblocking headline claims."
        retire_if_same_verdict: true
      - experiment_id: exp3151-live-inference-authenticity-preflight
        verdict: "blocked_duration_too_short: preflight_passed=false; live_call_count=1; duration_s below fixed 60s floor"
        addressed_by: "Keeps the arbitrary duration floor retired and adds stronger receipt fields instead of reviving the old heuristic."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .294 produced a better duration-corrected contract but still blocked local SOTA replay because the substrate was unavailable. This task defines the v3 receipt contract before another live verifier attempt.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - research-references.md
      - results/experiment_3164_duration_corrected_authenticity_contract_v2.json
      - results/experiment_3165_live_sota_authenticity_replay_v2.json
      - results/experiment_3167_clean_live_sota_verifier_rerun_v9.json
      - results/experiment_3176_capstone_v294.json

      TASK
      Define receipt-backed live-inference authenticity contract v3 that separates HF cache availability, loader availability, CUDA availability, CPU fallback admissibility, transcript receipts, and headline eligibility.

      CONCRETE STEPS
      1. PRECONDITIONS: Do not make a live model call in this task. Read the listed artifacts and inspect the cached_sota_pair() guidance in scripts/experiment_template.py.
      2. Extract the v2 measured-work requirements and the exact .294 blocker reason from exp3165.
      3. Define v3 substrate classes: model_cache_missing, loader_missing, cuda_unavailable, cuda_available_unhealthy, cpu_fallback_receipt_only, and full_local_sota_receipt.
      4. Define required receipt fields: selected_model_id, model_path, model_file_hash when cheap, loader_name, substrate_used, prompt_hashes, transcript_hashes, token_counts, random_seed, wall_clock_s, command_hash, subprocess_return_code, stderr_tail, throughput_plausibility, and replay_count.
      5. Define headline policy: CPU fallback and one-prompt smoke may prove receipt wiring but cannot be a headline verifier benchmark; clean verifier rerun still needs exact-authority scoring and controlled invariance.
      6. Write the artifact for downstream exp3179 and exp3181.

      REQUIRED ARTIFACT FIELDS:
      - receipt_backed_authenticity_contract_v3_ready: bool (principle: live reruns need an explicit contract)
      - inherited_v2_contract_fields: list (principle: new contracts must preserve valid prior evidence rules)
      - substrate_classification_policy: dict (principle: blockers must distinguish cache, loader, CUDA, and CPU causes)
      - required_receipt_fields: list (principle: authenticity should be tied to replayable observed work)
      - cpu_fallback_policy: dict (principle: CPU smoke can prove wiring but not headline performance)
      - fake_evidence_rejection_criteria: list (principle: adversarial failure modes must stay explicit)
      - clean_rerun_unlock_requirements: list (principle: verifier repair must not bypass authenticity checks)
      - headline_claim_policy: dict (principle: smoke tests should not become headline evidence)
      - source_artifacts: list (principle: contract must trace to prior failures)
