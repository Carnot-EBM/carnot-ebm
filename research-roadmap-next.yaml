    operator_override: "2026-06-14 operator P0 MANDATORY-NEXT-MILESTONE directive (oracle-distinct frontier; the first-error localizer is the live oracle-distinct vehicle) + the .406 SOTA-ingestion exp4398 flagged_for_v407 = intervention_active_real_first_error_deconfounding_v407 (standing) auto-override class 3 (versioned-lineage continuation with a STATED forward difference): this BUILDS ON the exp4392/4393 SYNTHETIC localizer (quarantined as position bias) by changing the DATA SOURCE -- REAL verifier-checked intervention first-error labels (arXiv:2601.14209) with the position-only + template-family controls BUILT INTO the headline -- attacking the synthetic-template confound the .406 quarantine exposed -- false-positive scope-match vs the RETIRED cross-domain SELECTION line (exp4314, a DIFFERENT scope: select a better answer). This is step-error LOCALIZATION; NOT a selection rerun."
