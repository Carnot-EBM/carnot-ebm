      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6363_v548_terminal_handoff_and_queue_preflight.json through {project_root}/results/experiment_6366_repaired_live_factor_proposal_authenticity.json
      - {project_root}/ops/conductor-log.md, {project_root}/ops/status.md, and {project_root}/ops/changelog.md
      - {project_root}/research-complete.yaml, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/known-issues.md
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/exclusion_manifest_lint.py

      TASK
      Create a bounded V548-to-V549 handoff and a full queue preflight. Reconcile only Exp6363-Exp6366 as executed V548 tasks. Preserve blocked, null, clean, proposal-only, and missing states. Validate all 14 V549 tasks before activation. Do not modify the active roadmap or conductor.

      CONCRETE STEPS
      0. Hash the active roadmap, next roadmap, milestone document, conductor, exclusion manifest, and four expected V548 artifacts.
      1. Read each V548 artifact through scripts/summarize_artifact.py. Preserve conductor outcomes and adversarial flags separately from stamped fields.
      2. Record that Exp6367-Exp6376 were proposal-only. Do not count them as executed, blocked, or missing active tasks.
      3. Validate 14 unique V549 IDs and deliverables, execution order, structured gates, gate-field cross-references, required prior-failure subfields, and no references to retired upstream task IDs.
      4. Check each prompt for CONTEXT, EXISTING CODE TO READ FIRST, TASK, CONCRETE STEPS, {project_root}, {date}, a Run command, and the exact final prohibition line.
      5. Check every LLM task for MODEL_SPECS and at least one mandated local GGUF ID. Check embedded-tokenizer and no-AutoTokenizer rules. Check agent_type and model pairs.
      6. Add or update applicable REQ-* and SCENARIO-* entries before implementation. Write focused tests. Run schema, prior-failure, gate, exclusion, spec-coverage, adversarial, determination-preservation, and root-clutter checks.
      7. Write the artifact atomically. A repeated incomplete-queue verdict retires this handoff scope.

      Required deliverable: {project_root}/results/experiment_6377_v549_terminal_handoff_and_queue_preflight.json.
      REQUIRED ARTIFACT FIELDS:
      status, v548_active_roadmap_path_and_hash, v548_active_task_ids, v548_terminal_artifacts_by_task, v548_conductor_outcomes, v548_blocked_null_clean_and_proposal_only_states, exp6365_runtime_boundary, exp6366_transport_failure_boundary, v549_milestone_doc_and_queue_hashes, v549_task_ids, v549_id_and_deliverable_checks, v549_dependency_and_gate_checks, v549_gate_field_cross_reference_checks, v549_prior_failure_checks, v549_exclusion_manifest_checks, v549_agent_model_and_llm_policy_checks, prompt_contract_checks, active_roadmap_modified, conductor_modified, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
