- id: exp1507-autopyverifier-safe-dsl-induction-pack
  milestone: 2026.04.116
  deliverable: results/experiment_1507_autopyverifier_safe_dsl_induction_pack.json
  title: "AutoPyVerifier-Inspired Safe-DSL Induction Pack"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 90
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1494-constrainprompt-validator-compiler-audit
      verdict: bounded_safe_dsl_validator_compiler_ready
      addressed_by: "This task changes scope from one-pass bounded validator skeleton compilation to verifier-set induction/search over labeled rows, still inside the safe DSL and false-accept accounting."
      retire_if_same_verdict: false
    - experiment_id: exp1486-cctu-executable-constraint-microbenchmark
      verdict: cctu_validators_hand_authored_only
      addressed_by: "This task induces candidate verifiers from labeled CCTU/certificate rows instead of adding more hand-authored validators."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    AutoPyVerifier suggests using an LLM to synthesize candidate executable
    verifiers and then search for compact verifier sets. Carnot must keep the
    trust boundary stricter: candidate verifiers must compile through the
    existing safe DSL or be rejected, and headline claims depend on deterministic
    false-accept accounting. Use {project_root} as the project root and {date}
    as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE; primary verifier-induction model)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense; secondary verifier-induction model)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE; secondary verifier-induction model)
    Legacy small models are allowed only as CPU smoke-tests and must not be
    used for headline verifier-induction results.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - results/experiment_1493_trigger_token_certificate_export_v1.json
    - results/cctu_trigger_certificates_1493.jsonl
    - results/experiment_1494_constrainprompt_validator_compiler_audit.json
    - results/constrainprompt_validator_manifest_1494.jsonl
    - python/carnot/verify/
    - tests/python/

    TASK:
    Build a bounded AutoPyVerifier-inspired induction pack that proposes,
    compiles, searches, and scores safe-DSL verifier sets over .115 labeled
    CCTU/certificate rows.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - live_sota_model_inference_used
    - verifier_induction_ready
    - labeled_rows_loaded
    - candidate_verifiers_proposed
    - candidate_verifiers_compiled
    - verifier_compile_rate
    - verifier_set_size
    - verifier_coverage_rate
    - verifier_false_accept_rate
    - baseline_validator_coverage_rate
    - induction_manifest_path
    - models_used
    - gpu_probe
    - blockers
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1507_autopyverifier_safe_dsl_induction_pack.json immediately with status="in_progress".
    2. Load .115 certificate and validator manifests; if a required manifest is absent, write a terminal blocker with missing paths.
    3. Use cached_sota_pair() or the established local SOTA GGUF cache pattern from scripts/experiment_template.py.
    4. Run at least one mandated SOTA GGUF model for headline verifier proposals. If GPU/model loading fails, write a terminal artifact instead of falling back to a legacy small headline model.
    5. Ask the model for safe-DSL verifier skeletons only. Reject arbitrary Python, filesystem access, imports, eval/exec, network calls, and non-deterministic logic.
    6. Compile candidates through the existing safe validator compiler or a minimal safe-DSL helper. Record compile failures explicitly.
    7. Search for a compact verifier set that maximizes labeled-row coverage while preserving zero false accepts on the available labels.
    8. Write results/safe_dsl_verifier_induction_1507.jsonl with one row per candidate and a final selected-set summary.
    9. Add focused tests for any new safe-DSL parser/compiler/search helper.
    10. Set verifier_induction_ready=true only if at least one live SOTA model proposed candidates, at least one candidate compiled, and false_accept_rate is reported.
    11. Write all required artifact fields with status="complete" or an honest terminal blocker.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1507_autopyverifier_safe_dsl_induction_pack.json')); print(d.get('verifier_induction_ready'), d.get('candidate_verifiers_compiled'), d.get('verifier_false_accept_rate'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1508-trigger-grammar-certificate-decoder-audit
