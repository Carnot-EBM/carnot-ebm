      TASK: Write a `.148` activation contract that summarizes which `.147` evidence is ready, which gates remain blocked, and which operational speedups should be tracked. Do not modify `research-roadmap.yaml` or `scripts/research_conductor.py`.
      CONCRETE STEPS:
      1. Read the listed `.147` artifacts and conductor/status/changelog entries.
      2. Record the ready substrate fields for validator-tree compilation and BEAVER-lite bounds.
      3. Record the blocked fields for live SOTA cache/runtime, terminal telemetry, FR-11 ledger, and hardware accounting.
      4. Include the `.147` operational finding that same-title compute-bound terminal-state dedupe and GPU/model-count telemetry are expected to save about 11 percent wall time.
      5. Save `{project_root}/results/experiment_1890_147_completion_148_activation_contract.json` with standard result fields and the required gate fields below.
      REQUIRED ARTIFACT FIELDS:
      - status
      - honest_verdict
      - milestone_147_archived
      - validator_tree_ready
      - beaver_bounds_ready
      - live_sota_blocked_missing_models
      - telemetry_missing_terminal_artifact
      - fr11_ledger_missing_terminal_artifact
      - hardware_accounting_missing_terminal_artifact
      - same_title_compute_dedupe_required
      - next_gate_contract_ready
      - tests_run

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1891-sota-gguf-cache-runtime-preflight
    milestone: "2026.05.148"
    title: "Exp 1891: SOTA GGUF Cache and Runtime Preflight"
    deliverable: "results/experiment_1891_sota_gguf_cache_runtime_preflight.json"
    requires_gpu: true
    model: opus
    max_turns: 100
    gated_on:
      - upstream: exp1890-147-completion-148-activation-contract
        artifact_field: next_gate_contract_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp1880-sota-roce-validator-eval
        verdict: blocked_missing_mandated_sota_ggufs
        addressed_by: "The prior live evaluation combined cache readiness and evaluation, then blocked when two mandated GGUFs were unavailable. This task changes scope to a bounded cache/materialization/runtime preflight that writes a terminal artifact before any evaluation claim."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: Today is {date}. `.147` blocked live SOTA evaluation because the mandated local GGUF cache was incomplete. This task must separate cache/runtime readiness from evaluation so later tasks can skip without spending a synthesis call when models are missing.
      EXISTING CODE TO READ FIRST: CLAUDE.md, scripts/experiment_template.py, python/carnot/inference/sota_models.py, ops/status.md, ops/changelog.md, research-references.md, results/experiment_1880_sota_roce_validator_eval.json
      TASK: Run a bounded local cache and runtime preflight for the mandated SOTA GGUF models and save an honest terminal artifact. Do not modify `research-roadmap.yaml` or `scripts/research_conductor.py`.
      CONCRETE STEPS:
      1. Define MODEL_SPECS with `unsloth/Qwen3.6-35B-A3B-GGUF`, `unsloth/gemma-4-31B-it-GGUF`, and `unsloth/gemma-4-26B-A4B-it-GGUF`.
      2. Use the `cached_sota_pair()` pattern from `scripts/experiment_template.py` where applicable, then explicitly inspect whether each mandated GGUF is present in the local Hugging Face cache.
      3. If safe local configuration allows bounded materialization, attempt it; otherwise record the exact missing model identifiers and do not substitute legacy small models for headline readiness.
      4. Run the cheapest possible runtime smoke for any available mandated model and record GPU, runtime, model count, and parallel model count telemetry.
      5. Record fallback runtime candidates such as llama.cpp with llguidance, vLLM.rs, and llgtrt as candidates only, not as fulfilled mandated-model evidence.
      6. Save `{project_root}/results/experiment_1891_sota_gguf_cache_runtime_preflight.json`.
      REQUIRED ARTIFACT FIELDS:
      - status
      - honest_verdict
      - MODEL_SPECS
