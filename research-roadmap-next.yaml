      Implement a bounded default-off reward-machine hypothesis frontier over visible live events. Each candidate is a small automaton with source-linked transition evidence. Choose a legal probe only when candidate outcome predictions disagree. Feed observations back through the two-sided contract. Prove reachability from E3AgentPolicy and make_carnot_agent. Make no solve claim and do not update the solve registry.

