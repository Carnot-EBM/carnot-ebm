        verdict: "prior_budget_scope: FR-11 online verifier soundness/completeness budget required a larger nonforgetting follow-up"
        addressed_by: "This v5 task makes soundness/completeness deltas first-class artifact fields and pairs them with rollback and holdout gates."
        retire_if_same_verdict: true
      - experiment_id: exp1484-fr11-v9-query-time-memory-policy
        verdict: "prior_fr11_memory_scope: query-time memory policy did not close durable nonforgetting evidence"
        addressed_by: "This task updates memory from exact verifier outcomes and measures old-task retention plus false-positive guard deltas."
        retire_if_same_verdict: true
      - experiment_id: exp2003-tier2-constraint-memory-fr11
        verdict: "prior_fr11_constraint_memory_scope: Tier-2 constraint memory needed stronger rollback and holdout evidence"
        addressed_by: "This v5 task requires separate update/new/old/false-positive sets and explicit rollback_recovered_count."
        retire_if_same_verdict: true
      - experiment_id: exp3200-fr11-verify-trace-memory-controller-v1
        verdict: "prior_fr11_controller_scope: verify-trace memory controller remained pre-nonforgetting"
        addressed_by: "This task extends the controller path with nonforgetting, soundness/completeness, and rollback acceptance gates."
        retire_if_same_verdict: true
      - experiment_id: exp3255-fr11-lifelong-failure-memory-retention-audit-v1
        verdict: "prior_retention_scope: lifelong failure-memory retention audit needed online update evidence"
        addressed_by: "This task performs online updates from exact verifier outcomes rather than only auditing retained memory."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Work from {project_root} on {date}. research-program.md requires each milestone to include continuous self-learning. exp3334 showed a small online verifier-memory nonforgetting result. v5 must scale the evidence, add soundness/completeness cost accounting, and keep rollback explicit.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md, especially inference_substrate, artifact, and sample-size guidance
      - CODEX.md
      - research-program.md, section "Continuous Self-Learning"
      - _bmad/prd.md, FR-11 and FR-12
      - openspec/capabilities/self-learning/spec.md
      - openspec/capabilities/verifiable-reasoning/spec.md
      - results/experiment_3334_fr11_online_verifier_memory_nonforgetting_v4.json
      - research-references.md, FR-11 / online verifier learnability / KAN-CL section
      - carnot/
      - tests/

      TASK
      Run FR-11 online verifier-memory nonforgetting v5. This must be a real self-learning experiment: update memory/controller state from verifier outcomes, evaluate new-task improvement, evaluate old-task retention, account for soundness/completeness mistakes, and rollback harmful updates.

      CONCRETE STEPS
      1. Confirm the relevant self-learning and verifiable-reasoning specs have REQ-* requirements before implementation code changes.
      2. Build or reuse a cached verifier corpus with separate update, new-task holdout, old-task holdout, and false-positive guard sets. Target substantially larger sets than exp3334 where local data allows.
      3. Apply online updates from exact verifier outcomes only. Optional locality anchoring may be inspired by KAN-CL, but do not introduce a headline KAN replacement claim.
      4. Measure new_task_delta, old_task_delta, false_positive_delta, soundness_error_delta, completeness_error_delta, rollback_count, and rollback_recovered_count.
      5. Set fr11_nonforgetting_ready=true only if new-task performance improves or is preserved, old-task degradation stays within the planned bound, false positives do not materially increase, and rollback works on harmful updates.
      6. Write results/experiment_3345_fr11_online_memory_nonforgetting_v5.json with REQUIRED ARTIFACT FIELDS: honest_verdict with terminal prefix, inference_substrate, random_seed, reproducibility_checksum, duration_s, files_updated; FR-11 FIELDS (continuous self-learning): n_update, n_new_eval, n_old_eval, n_false_positive_guard, new_task_delta, old_task_delta, false_positive_delta, soundness_error_delta, completeness_error_delta, rollback_count, rollback_recovered_count, fr11_nonforgetting_ready, blocked_reasons.
      7. Run focused unit tests, JSON parse, and any available spec-coverage command for self-learning/verifiable-reasoning.

