    milestone: "2026.05.221"
    deliverable: "results/experiment_2233_wahkon.json"
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: Wahkon (arxiv:2605.14041) is a statistically principled deep RKHS superposition network that unifies Kolmogorov's principle with RKHS, offering finite-sample guarantees superior to KAN.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/models/kaem_energy.py
      TASK: Implement a Wahkon-style deep RKHS penalty layer as an alternative to Spline KAN.
      CONCRETE STEPS:
      1. Create `python/carnot/models/wahkon_rkhs.py`.
      2. Implement the exact MAP estimate logic under the hierarchical GP prior.
      3. Write deliverable to `results/experiment_2233_wahkon.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

