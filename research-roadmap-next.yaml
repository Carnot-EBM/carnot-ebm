        verdict: "blocked_llama_cpp_gpu_offload: cross-model typed memory usefulness was not measured."
        addressed_by: "This retry is structurally gated on exp5259.sota_runtime_ready=true, so it only runs after the runtime blocker is resolved."
        retire_if_same_verdict: true
      - experiment_id: exp5239-controlled-self-learning-memory-v479
        verdict: "complete: aligned typed memory beat shuffled and no-memory controls inside one controlled local stack with rollback and retention receipts."
        addressed_by: "This task tests cross-model transfer between mandated SOTA GGUF model families instead of repeating the same-stack controlled positive."
        retire_if_same_verdict: true
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 60
    prompt: |
      CONTEXT:
      Repo at {project_root}, run on or after {date}. This task runs only if exp5259 emitted sota_runtime_ready=true. .479 showed a controlled typed-memory positive in one stack; .480 failed to measure cross-model transfer because the SOTA GGUF runtime was blocked. This is the milestone's gated live local-LLM continuous self-learning experiment.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - CODEX.md
      - research-program.md
      - scripts/experiment_template.py
      - typed-memory, verifier-memory, or self-learning modules/tests currently in the repo
      - results/experiment_5239_controlled_self_learning_memory_v479.json
      - results/experiment_5249_cross_model_typed_memory_v480.json if present
      - results/experiment_5259_sota_gguf_gpu_offload_preflight_v481.json
      - ops/exclusion_manifest.yaml

      TASK:
      Measure whether typed verifier memories learned or promoted by one mandated local SOTA model improve another mandated local SOTA model on held-out constraint/verifier tasks, while preserving rollback and leakage controls.

      CONCRETE STEPS:
      1. Step 0 PRECONDITIONS: confirm exp5259.sota_runtime_ready=true, record GPU/runtime/model receipts, and record memory-store snapshot/checksum before mutation.
      2. MODEL_SPECS for headline results:
         - unsloth/Qwen3.6-35B-A3B-GGUF as source_or_target flagship_moe
         - unsloth/gemma-4-31B-it-GGUF as source_or_target flagship_dense
         - unsloth/gemma-4-26B-A4B-it-GGUF as middle_moe optional third-family check
         Tiny legacy models may be used only for CPU smoke tests and must not appear in headline metrics.
      3. Reuse the repo's typed-memory representation and promotion/rollback rules rather than inventing a new memory format.
      4. Build a small deterministic fixture set with aligned memory, shuffled memory, no-memory, and held-out tasks. Include prompt and completion checksums.
      5. Run at least one source-to-target direction across different model families, and a second direction if runtime permits. Measure accuracy/usefulness, unsafe false accepts, repeated-error rate, and rollback behavior.
      6. Prevent leakage: no target answer text in memory, no fixture labels in prompts, no post-hoc hand curation after seeing held-out results.
      7. Update ops/status.md and ops/changelog.md only if the result changes durable memory/self-learning state.
      8. Write results/experiment_5260_cross_model_typed_memory_retry_v481.json with REQUIRED ARTIFACT FIELDS:
         - honest_verdict: object with value/principle; value must start with complete: or blocked_ and state whether cross-model memory was useful, harmful, null, or unmeasured.
         - inference_substrate: object with value/principle; use live_llm_inference_local_gguf_sota.
         - preconditions_checked: object with value/principle.
         - MODEL_SPECS: object with model ids, roles, quantization/file receipts, and principle.
         - cross_model_memory_useful: bare bool plus cross_model_memory_useful_principle string.
         - delta_over_no_memory: object with numeric value/principle.
         - delta_over_shuffled_memory: object with numeric value/principle.
         - unsafe_false_accepts: object with integer value/principle.
         - rollback_exercised: object with bool value/principle.
         - leakage_controls: object with checksums and principle.
         - commands_run: list with command/outcome.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5261-typed-memory-interference-audit-v481
