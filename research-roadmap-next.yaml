    artifact_not_updated_past_bootstrap. The root cause: the retro agent reads 12+ artifacts,
    analyzes them, and tries to write a comprehensive JSON artifact — but the turn budget is
    exhausted before the final write completes.

    The fix from ops/known-issues.md (NEW 2026-05-03 13:55Z): Option D (recommended) —
