        retired. This task closes that gap with a precondition-gated,
        transcript-verified workload dispatch.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `ssh -o ConnectTimeout=5 -o BatchMode=yes polarfire 'true'`
              returns 0. If not, blocked_polarfire_ssh_unreachable.
           b. `ssh polarfire 'uname -m'` returns 'riscv64'. If not,
              blocked_polarfire_wrong_architecture.
           c. `ssh polarfire 'python3 --version'` returns Python >= 3.10.
              If not, blocked_polarfire_python_missing.
