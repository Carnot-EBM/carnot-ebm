        - research-references.md "2026-05-31 Post-.322 Planning Sweep" (2506.04596 QUBO-solver benchmark, 2510.19835 Sudoku-QUBO, SPE spe.70063, IRED 2406.11179)

      TASK: Starting from the VALIDATED encoding, run the REAL combinatorial-optimizer ladder on
      >=20 puzzles across difficulty tiers, reporting SOLVE-RATE (board verified valid / E==0 ON
      THE BOARD) by difficulty and by optimizer variant. An honest negative (the validated
      encoding still cannot be solved by any standard combinatorial optimizer) is a valid P0.1
      datapoint that retires the timing framing.

      PRECONDITIONS (step 0 — MANDATORY AND GATING):
        0a. RE-ASSERT ENCODING VALIDITY: encode a known-valid solved board and assert E==0
            (reuse exp3494's validated encoding). If it does NOT give E==0 -> honest_verdict
            complete: blocked_energy_encoding_invalid_regression with the residual breakdown; STOP.
        0b. (Removed as a HARD bail.) Easy-tier solvability is now a MEASURED OUTCOME of the
            real ladder, not a precondition that aborts the run. Run the ladder on easy boards
            FIRST and REPORT easy_tier_solve_rate; only if EVEN parallel tempering + restarts +
            the exact baseline cannot solve EASY boards do you conclude representational failure.

      CONCRETE STEPS:
        1. Re-assert Step 0a (E==0). Proceed regardless of the prior easy-tier number — this task
           exists to test better optimizers.
        2. Assemble >=20 puzzles across tiers (easy / medium / hard), labeled by a published
           difficulty metric (clue count + constraint-propagation depth). Document source + seed.
        3. OPTIMIZER LADDER (report solve-rate per variant): (i) vanilla descent/Glauber (the
           exp3494 baseline, for contrast); (ii) a PROPER geometric simulated-annealing schedule
           (tuned T0/cooling); (iii) K random restarts (K>=20); (iv) PARALLEL TEMPERING / replica
           exchange across a temperature ladder; (v) an EXACT QUBO / CP-SAT baseline (e.g.
           ortools CP-SAT or a small exact solver) on the SAME boards as the optimality reference;
           (vi) ADAPTIVE step count scaled to hardness (IRED/Kona). PRINT one progress line PER
           OPTIMIZER ITERATION SWEEP (or every few hundred sweeps), flushed — LOAD-BEARING: this
           defeats the 1201s idle-timeout that killed silent loops in .321/.322.
        4. SOLVE = final board satisfies ALL Sudoku constraints, VERIFIED ON THE BOARD. Report
           solve_rate overall + solve_rate_by_difficulty + solve_rate_by_optimizer_variant.
        5. PLATEAU CHARACTERIZATION: for unsolved instances, report n_violated_constraints at the
           best optimizer's plateau (a few cells = optimizer-fixable; pervasive = something else).
        6. HYBRID: if the best pure energy optimizer can't close the last violations, test the
           energy + constraint-propagation hybrid (energy proposes; Carnot's Z3/AST/arc-consistency
           verifiers clean up residuals); report hybrid_solve_rate SEPARATELY.
        7. ENERGY-vs-AR (solved subset only): for SOLVED puzzles, report time_to_solution vs an
           autoregressive baseline — a speedup claim is valid ONLY on the solved subset.
        8. HARD WALL-CLOCK BUDGET: at ~28 min, finalize whatever the ladder produced and EXIT
           CLEAN (code 0). Emit the artifact with clean methodology (real duration, seed, checksum).

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="Terminal verdict starts complete:/success:/passed:/shipped_."
        inference_substrate: value=ising_energy_optimization_cpu
        encoding_validity_E0_reasserted: principle="E of a known-valid solved board MUST still be 0 (regression check vs exp3494) — without this any solve-rate is meaningless."
        n_puzzles: principle=">=20 across tiers; solve_rate on n<20 is not headline-eligible (Sample-Size Rigor)."
        easy_tier_solve_rate: principle="MEASURED outcome of the real ladder on easy boards (NOT a precondition bail) — the direct test of whether a proper optimizer beats exp3494's descent 0.0."
        solve_rate: principle="fraction reaching a VALID solution (all constraints satisfied, verified ON THE BOARD) — the gate. Time is meaningless without it."
        solve_rate_by_difficulty: principle="per-tier so partial capability is visible."
        solve_rate_by_optimizer_variant: principle="which ladder rung solved what — the optimizer-power diagnosis (descent vs SA vs PT vs exact), auditable."
        exact_baseline_solve_rate: principle="the exact QUBO/CP-SAT optimality reference on the same boards — confirms the boards ARE solvable, isolating optimizer power."
        n_violated_constraints_at_plateau: principle="distinguishes 'almost solved' (optimizer-fixable) from pervasive infeasibility."
        hybrid_solve_rate: principle="energy + constraint-propagation solve-rate, reported separately so the claim is honest (energy replaces search vs energy is a global heuristic)."
        time_to_solution_solved_only: principle="timing ONLY for solved instances; any speedup-vs-AR claim is valid ONLY on the solved subset."
        ar_baseline_solve_rate: principle="the autoregressive control's solve-rate on the same puzzles — the P0.1 comparator."
        random_seed: principle="determinism precondition for reproducibility."
        reproducibility_checksum: principle="content hash of puzzle set + encoding + optimizer configs + seed."
        duration_s: principle="CPU global-opt over >=20 puzzles with a real optimizer ladder takes real wall time; honest value (not sub-second)."

      ACCEPTANCE GATES:
        - condition: "encoding_validity_E0_reasserted == true AND exact_baseline_solve_rate > 0.5"
          principle: "G0 CORRECTNESS-FIRST: the encoding is valid (regression check) AND the exact baseline confirms the boards are solvable — isolating any remaining failure to optimizer power, not representation."
        - condition: "solve_rate reported on >=20 puzzles AND any speedup claimed ONLY on the solved subset"
