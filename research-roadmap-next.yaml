- id: exp851-ice40-n16-bitstream
  milestone: 2026.04.65
  deliverable: results/experiment_851_ice40_n16_bitstream.json
  title: 'Exp 851: iCE40 N=16 Ising Bitstream (RETRO-ICE40-PNR-LUT-OVERFLOW, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 839 failed P&R at N=32 (3952 LUTs) because the iCE40 HX8K effective P&R budget
    is approximately 3500-4000 LUTs. Reducing to N=16 should reduce LUT count by approximately
    4x (coupling registers scale as N^2). Expected N=16 LUTs: ~1000-1500, well within budget.
    OSS-CAD-Suite is installed at ~/tools/oss-cad-suite/bin (confirmed Exp 807, still present).
    The synthesis toolchain works (Exp 839 yosys succeeded; only nextpnr-ice40 P&R failed).

    EXISTING CODE TO READ FIRST:
    - results/experiment_839_kv260_ice40_bitstream.json — P&R failure details, LUT budget analysis
    - hardware/kv260/ising_sampler_v3.v or similar — existing Verilog design (parameterized or N=32)
    - hardware/kv260/ directory — all existing RTL, TCL, and synthesis artifacts
    - research-hardware-wishlist.md — KV260 synthesis status and requirements

    TASK: Generate a working iCE40 N=16 bitstream: synthesize, P&R, pack to .bin.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_839_kv260_ice40_bitstream.json.
       Extract: lut_count_n32, pnr_failure_reason, synthesis_json_path.
    3. Verify OSS-CAD-Suite tools:
       import subprocess; result = subprocess.run(["~/tools/oss-cad-suite/bin/yosys", "--version"])
       or os.path.expanduser("~/tools/oss-cad-suite/bin/yosys"). Confirm present.
    4. Generate hardware/kv260/ising_sampler_n16.v:
       Write a compact N=16 Ising Gibbs sampler in Verilog:
         - Parameters: N=16, DATA_WIDTH=8 (for coupling coefficients).
         - Coupling matrix J[16][16] stored as registers (256 x 8-bit = 2048 bits = ~32 LUTs).
         - Bias vector h[16] (16 x 8-bit = 128 bits).
         - Gibbs sweep: one checkerboard step per clock — update all even spins in parallel,
           then all odd spins. Each spin update: compute E_i = sum_j J_ij * s_j + h_i,
           then s_i = (E_i > 0) ? +1 : -1 (deterministic for prototype; no stochastic yet).
         - Outputs: spin_state[16], energy (8-bit accumulated), done flag.
         - AXI-Lite interface stub: 4 registers (J_addr, J_data, h_data, control).
         This design is a deterministic (non-stochastic) prototype — sufficient for bitstream proof.
       Estimated LUT count: N^2 * 2 (for coupling) + N * 4 (for sweep logic) = ~576 LUTs.
    5. Synthesize with yosys (iCE40 target):
       yosys_cmd = [
           os.path.expanduser("~/tools/oss-cad-suite/bin/yosys"), "-p",
           "synth_ice40 -top ising_sampler -json output/ising_n16_synth.json",
           "hardware/kv260/ising_sampler_n16.v"
       ]
       Parse yosys output for LUT count (look for "Number of cells").
       Write synthesis output to output/ising_n16_synth.json.
    6. Place-and-route with nextpnr-ice40:
       pnr_cmd = [
           os.path.expanduser("~/tools/oss-cad-suite/bin/nextpnr-ice40"),
           "--hx8k", "--package", "ct256",
           "--json", "output/ising_n16_synth.json",
           "--asc", "output/ising_n16.asc"
       ]
       If P&R fails: record pnr_failure_reason and write blocked artifact.
    7. Pack to bitstream:
       icepack_cmd = [
           os.path.expanduser("~/tools/oss-cad-suite/bin/icepack"),
           "output/ising_n16.asc", "output/carnot_ising_n16.bin"
       ]
    8. Verify bitstream header: read first 4 bytes of output/carnot_ising_n16.bin.
       iCE40 bitstream magic: first byte is 0x7E (confirmed by icestorm docs).
       bitstream_valid_header = (bytes[0] == 0x7E)
    9. Record: lut_count_n16, fmax_mhz (from nextpnr timing report), bitstream_size_bytes.
       Update research-hardware-wishlist.md: add N=16 bitstream result.
    10. honest_verdict:
        - "bitstream_generated" if output/carnot_ising_n16.bin exists AND bitstream_valid_header
        - "pnr_failed_n16" if P&R fails even at N=16 (surprising; diagnose LUT count)
        - "synthesis_failed" if yosys fails
        - "tools_missing" if OSS-CAD-Suite not found
    11. Add spec entries: REQ-FPGA-005 (N=16 Ising bitstream), SCENARIO-FPGA-006.
    12. Write tests/python/test_experiment_851_ice40_n16.py with 100% coverage.
        Mock subprocess calls for tests (iCE40 tools not available in test environment).
