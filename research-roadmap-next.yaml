      CONTEXT:
        Project root: {project_root}. Run date: {date}.
        THRML import was repaired in exp2901, and exp2912 supplies the CPU
        matched basis. This task checks simulator portability against the same
        Ising problem family without making any Extropic hardware claim.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - results/experiment_2901_thrml_local_import_repair_v1.json
        - results/experiment_2912_kv260_same_basis_cpu_gibbs_baseline_v1.json
