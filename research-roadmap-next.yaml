          IMPLAUSIBLE_TIGHT_CI is the newest)
        - results/experiment_21*.json (.174 artifacts)
        - results/experiment_17[01][0-9]*.json (.175 artifacts)

      TASK: Run adversarial-verify on .174 + .175, classify flags,
