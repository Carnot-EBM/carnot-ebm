    prior_failures:
      - experiment_id: exp2624-fr11-ttt
        verdict: "complete: VerifierDrivenTTT class implemented, N=50 proof-of-concept"
        addressed_by: "exp2624 (.251) implemented VerifierDrivenTTT but left 'when to stop' as an open question (fixed N TTT iterations). arXiv:2604.01170 (ORCA) provides the answer: conformal stopping — stop when prediction set collapses to 1 answer with coverage guarantee. This extends exp2624's TTT loop with ORCA-style stopping criterion. Different deliverable: conformal_stopping_enabled (bool) + n_ttt_steps_saved (int)."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Paper arXiv:2604.01170 (ORCA) combines test-time training with conformal prediction for
      calibrated reasoning. The conformal stopping criterion: stop TTT when the prediction set
      (the set of candidate answers consistent with coverage guarantee) collapses to 1 answer.
      This gives principled early stopping vs fixed-N iterations in exp2624.

      Ensemble v11 is adversarially verified (exp2667) — this gates exp2679 because the conformal
      score function uses ensemble energy scores as the nonconformity measure.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/ttt_loop.py (VerifierDrivenTTT class from exp2624 — read carefully)
      - results/experiment_2624_fr11_ttt.json (VerifierDrivenTTT state: n_examples, improvement)
      - results/experiment_2667_ensemble_v11_adversarial_val.json (adversarially_verified=true gate)

      TASK: Extend VerifierDrivenTTT with ORCA-style conformal stopping.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Read results/experiment_2667_ensemble_v11_adversarial_val.json.
            Confirm adversarially_verified=true (gate enforced upstream).
            If False or absent: write honest_verdict 'blocked_ensemble_v11_not_verified' and exit.
         b. Check if python/carnot/pipeline/ttt_loop.py exists.
            If absent: write honest_verdict 'blocked_ttt_loop_missing' and exit.
         c. `.venv/bin/python -c "import sys; sys.path.insert(0, 'python'); import carnot.pipeline.ttt_loop"` — importable.
         Record: preconditions_checked.

      1. Read VerifierDrivenTTT: understand the iteration loop structure and stopping condition.

      2. Add method conformal_stopping_criterion(
             energy_scores: list[float],
             alpha: float = 0.1,
             min_iterations: int = 2
         ) -> tuple[bool, float]:
         - Takes energy scores from the last `alpha`-quantile of TTT iterations.
         - Computes prediction interval width = max(energy_scores) - min(energy_scores).
         - Returns (should_stop=True, interval_width) if width < alpha threshold AND
           min_iterations have run (prevents premature stopping).
         - This is a simplified conformal stopping proxy: narrow interval = calibrated = stop.
         Record: method_added (bool).

      3. Add method run_with_orca_stopping(
             examples: list[dict],
             k_max: int = 10,
             alpha: float = 0.1
         ) -> dict:
