    prompt: |
      CONTEXT: the .395 cross-family win (exp4271 +0.4038 held-out, CI95-excl-0) is hardened but on the recovered
      52-task manifest only. A skeptic: 'you generalized across families YOU carved from one pool.' ARC-GEN
      (arXiv:2511.00162; github.com/google/ARC-GEN, Moffitt/Google) is an INDEPENDENT mimetic procedural generator
      covering all 400 ARC-1 + 500 ARC-2 tasks, each with a native family id -- a 2nd, construction-disjoint family
      substrate. Replicating the win here closes the single-partition critique. ARC-GEN failure mode: generator data
      can become its own distribution -> report original-ARC / ARC-TGI / ARC-GEN lift SEPARATELY (Reliability Gap
      2606.03305). 'Paying Less Generalization Tax' (arXiv:2601.18217): a randomized family-rich stress split checks
      the lift is causal, not robustness-theater.

      EXISTING CODE TO READ FIRST:
        - results/experiment_4271_arc_cross_family_transfer_existing_pool.json (the .395 win + the family-disjoint gate protocol to mirror)
        - results/experiment_4270_arc_family_manifest.json (the recovered manifest schema: per-row family_id/fold/target_hash to match for ARC-GEN rows)
        - results/experiment_4244_arc_set_encoder_aggregator_build.json + _model.json (the set-encoder to retrain per family-split)
        - python/carnot/agentic/arc_agi3_world_model.py (the explore-induce-verify solver, if candidate generation is needed)
        - scripts/exp_verifier_detector_auroc.py, scripts/adversarial_verify.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "No embedded-repo gitlinks" (gitignore the clone), "Adversarial Artifact Verification + Sample-Size Rigor"

      TASK: build an ARC-GEN family-disjoint pool; run the cross-family beats-vote gate; report per-substrate lift.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any analysis):
           a. `git clone https://github.com/google/ARC-GEN` into a GITIGNORED path (e.g. external/ARC-GEN/ -- add
              to .gitignore FIRST so git add -A cannot swallow it as a mode-160000 gitlink). If the clone fails
              (network) AND no cached ARC-GEN exists -> honest_verdict `blocked_arcgen_unavailable` and STOP.
           b. The set-encoder + .395 manifest load. CPU sufficient; no GGUF/GPU.
        1. Generate a family-diverse candidate pool from ARC-GEN generators: each row carries a NATIVE family_id +
           exact target_hash + source_kind=arcgen. HARD-CAP families x tasks x candidates to fit the window; an
           honest partial pool with >=4 ARC-GEN families and >=~10 held-out tasks/fold is fine. Persist the pool + manifest.
        2. Train the set-encoder on train-families; on HELD-OUT ARC-GEN families compute set_encoder@1, vote@1,
