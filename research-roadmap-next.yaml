- id: exp947-driftprobe-v3-depth-recurrent
  milestone: 2026.04.73
  deliverable: results/experiment_947_driftprobe_v3_depth_recurrent.json
  max_turns: 50
  prior_failures:
    - experiment_id: exp923-driftprobe-ensemble
      verdict: tier0i_no_improvement
      addressed_by: "Exp 923 (DRIFTProbeEnsemble) used UNIFORM weights across 4 hidden layers — AUC delta was negative (uniform weights hurt OOD AUC). RETRO-DRIFT-ENSEMBLE-UNIFORM-WEIGHTS. arXiv 2604.17121 explains root cause: state is not localized in any single layer — it propagates to deeper layers as new inputs arrive. Uniform weights treat all layers equally when some layers carry far more relevant state. This experiment uses ATTENTION POOLING (learned per-layer weights) across ALL hidden layers rather than uniform weighting of 4 fixed layers."
      retire_if_same_verdict: false
    - experiment_id: exp911-driftprobe-tier0i
      verdict: tier0i_marginal
      addressed_by: "Exp 911 was DRIFTProbe Tier 0i using multi-layer hidden-state drift. Result: tier0i_marginal — only marginal improvement over single-layer. Root cause: even multi-layer with uniform weights doesn't localize state properly. The fix is learned attention pooling over the full layer stack (depth-recurrent)."
      retire_if_same_verdict: false
  title: 'Exp 947: DRIFTProbe v3 Depth-Recurrent — Learned Attention Pooling Over All Layers (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2604.17121 (Topological Trouble with Transformers, April 2026) proves
    that state in feedforward transformers is not localized — it propagates deeper as new
    inputs arrive. Single-layer probes (Exp 911: tier0i_marginal) and uniform-weighted
    multi-layer ensembles (Exp 923: tier0i_no_improvement, RETRO-DRIFT-ENSEMBLE-UNIFORM-WEIGHTS)
    both fail because they either read the wrong layer or weight all layers equally.
    The architecturally-aligned fix is DEPTH-RECURRENT probing: attend over the full layer
    stack with LEARNED per-layer weights (attention pooling), so the model can discover which
    layers contain drift-relevant state for this particular input.
    arXiv 2604.13386 (Multi-Layer Probe, April 2026) validates: multi-layer probe ensembling
    with learned weights consistently improves AUROC by 3-8% vs best single layer.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/drift_probe.py — existing DRIFTProbe implementation
    - results/experiment_911_drift_probe_tier0i.json — tier0i_marginal result
    - results/experiment_923_drift_probe_ensemble.json — tier0i_no_improvement, uniform weights
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Implement DRIFTProbe v3 with learned attention pooling over all hidden layers.
    Compare probe_auc to Exp 923 (uniform weights, tier0i_no_improvement baseline).
    Target: probe_auc > 0.50 (above random — prior result was degraded below 0.50).

    CONCRETE STEPS:
    1. Read CLAUDE.md.
    2. Write python/carnot/pipeline/drift_probe_v3.py:
       a. Class DRIFTProbeV3:
          - Accepts hidden_states: list of layer activations (list[np.ndarray], shape [seq, hidden])
          - Per-layer drift computation: mean cosine drift between adjacent token positions
            per layer (same as Exp 911/923 but now for ALL layers)
          - Attention pooling layer: small MLP (hidden_dim=32, 2 layers) that takes the
            N-dimensional per-layer drift vector and outputs scalar "drift score"
          - Alternatively: softmax attention over per-layer drift scalars (learned temperature)
          - fit(X_layers, y_labels): train attention weights on labeled (hidden_states, correct/incorrect) pairs
          - predict_proba(X_layers): return P(incorrect) via attention-pooled drift score
       b. Add spec entries: REQ-PROBE-010 (DRIFTProbe v3 depth-recurrent), SCENARIO-PROBE-015
          (attention pooling across layer stack).
    3. Write scripts/experiment_947_driftprobe_v3_depth_recurrent.py:
