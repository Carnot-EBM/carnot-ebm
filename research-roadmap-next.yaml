  - id: exp1983-carnot-cot2meta-routing-prototype
    title: "Exp 1983: Carnot CoT2-Meta routing prototype (extends ODAR with explicit fallback path)"
    deliverable: results/experiment_1983_cot2meta_routing.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1822-carnot-odar-routing-prototype
        verdict: planner_replaced_in_190
        addressed_by: "exp1822 (.190) was the ODAR-only routing prototype that the planner replaced. This task supersedes it by adopting CoT2-Meta's superset state-machine (expand/prune/repair/stop/fallback) — same authors as ODAR but more complete formalism. exp1811's Fast-Slow Variant + exp1909's adversarial-confirmation provide the pipeline this routing sits on top of."
        retire_if_same_verdict: false
      - experiment_id: exp1811-fast-slow-variant-prototype
        verdict: complete_3.1x_sample_eff_0.25x_kl_drift_no_forgetting
        addressed_by: "exp1811 (.189) shipped Fast-Slow Variant. CoT2-Meta routing layers on top: same fast-weight context buffer, with explicit state-machine over the iteration decision."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: arXiv:2603.28135 CoT2-Meta (Ma et al., Mar 30 2026,
      Score 320 surfaced 2026-05-16T04:35Z via routine citation-sweep)
      is a training-free metacognitive control framework integrating
      "expansion, pruning, repair, stopping, fallback decisions" for
      budgeted test-time reasoning. Same Ma/Gao/Liu author line as ODAR
      (Score 400). CoT2-Meta is the OPERATIONAL framework; ODAR is the
      routing-mechanism within it.

      Carnot's verify-repair loop currently has IMPLICIT versions of
      expand/prune/repair/stop but lacks an explicit fallback path.
      This task adds the explicit state machine.

      FALSIFIABLE HYPOTHESIS: A Carnot CoT2-Meta routing prototype on
      the same 90-example 3-task corpus from exp1811 (GSM8K + BBH +
      MATH) achieves AT LEAST a further 1.2x reduction in
      compute-overhead (iters-per-task) vs the pure Fast-Slow Variant
      baseline AND demonstrates non-trivial fallback-path usage
      (>= 5% of examples hit the fallback path) AND maintains
      exp1811's pass-rate within +/-3pp per task. If fallback usage
      is 0% across all 90 examples, the routing is structurally
      equivalent to Fast-Slow alone — disclose honestly.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1811_fast_slow_variant.json (the FS baseline)
        - results/experiment_1909_fast_slow_confirmation.json (the
          confirmation pair)
        - python/carnot/pipeline/fast_slow_variant.py (the FS impl)
        - python/carnot/pipeline/verify_repair.py (the verify-repair loop)
        - arXiv:2603.28135 abstract (cite as methodology origin)

      TASK: Implement CoT2-Meta state-machine on top of Fast-Slow.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "from carnot.pipeline.fast_slow_variant import
              fast_slow_variant"` succeeds — else
              `blocked_fast_slow_implementation_missing`.
           b. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              non-empty — else `blocked_model_not_cached`.
           c. `test -f results/experiment_1811_fast_slow_variant.json` —
              else `blocked_fs_baseline_missing`.
           Record preconditions_checked.
        1. Implement cot2meta_state_machine(state) with 5 actions:
             - expand: generate next iteration's candidate (default FS path)
             - prune: verifier rejection
             - repair: FS verifier-failure-summary appended to context
             - stop: ODAR-style risk-sensitive acceptance
             - fallback: escalate to k=16 ensemble disagreement check
               OR mark as "needs human review" (record but proceed)
        2. Wire the state machine into Fast-Slow Variant. Each iter:
           pick action via free-energy-principled fusion (ODAR rule):
           action = argmax over {{expand, prune, repair, stop, fallback}}
           with risk-sensitive weighting.
        3. Run on the same 90-example corpus as exp1811. Log per-example:
           action_sequence, total_iters, final_action, fallback_triggered.
        4. Compute: overall_iters_reduction vs exp1811 Fast-Slow baseline,
           fallback_usage_rate, per-task passrate drift.
        5. Acceptance: iters_reduction >= 1.2x AND fallback_usage_rate
           >= 0.05 AND max_passrate_drift_pp <= 0.03 across 3 tasks.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.cot2meta_routing.v1"
        - experiment: 1983
        - run_date: ISO-8601 UTC
        - duration_s: > 300s (90 examples × state-machine-routed FS)
        - random_seed: 173183 (NOT 1983 or 90)
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {{target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          baseline: "fast_slow_variant_v1 (exp1811)",
          state_machine: "cot2meta_v1 (expand/prune/repair/stop/fallback)",
          tasks: ["gsm8k_30", "bbh_30", "math_30"]}}
        - n_samples: 90
        - n_samples_justification: "30 per task × 3 tasks matching
          exp1811."
        - cot2meta_passrate_per_task: dict
        - fast_slow_baseline_passrate_per_task: dict (from exp1811)
        - cot2meta_iters_per_task_mean: dict
        - fast_slow_iters_per_task_mean: dict
        - overall_iters_reduction: float
        - fallback_usage_rate: float (fraction of 90 examples hitting
          fallback)
        - passrate_drift_per_task: dict
        - max_passrate_drift_pp: float
        - acceptance_gate_passed: bool (iters_reduction >= 1.2 AND
          fallback_usage >= 0.05 AND max_drift <= 0.03)
        - acceptance_gate_criteria: "1.2x iter reduction AND >=5%
          fallback usage AND <=3pp passrate drift."
        - methodology_note: "If iters_reduction > 3x without explicit
          methodology, treat as IMPLAUSIBLE_PERFECT. If fallback_usage
          == 0, state machine is structurally equivalent to FS alone —
          disclose honestly. Cite arXiv:2603.28135 as methodology origin."
        - optimization_direction: "maximize_iters_reduction_minimize_passrate_drift"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

