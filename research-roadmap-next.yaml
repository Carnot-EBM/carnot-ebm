        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      The planner already appended the V489 Planner Refresh to research-references.md. This task performs the execution-time delta check immediately before downstream experiments, looking only for sources that were missed or newly surfaced after planning.

      EXISTING CODE TO READ FIRST:
      - {project_root}/research-references.md
      - {project_root}/research-program.md
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/results/experiment_5362_capstone_v488.json

      TASK:
      Search current sources for a narrow execution-time SOTA delta relevant to .489. Add only actionable, non-duplicate findings to research-references.md, then write the artifact.

      CONCRETE STEPS:
      1. Search arXiv, OpenReview, HuggingFace Papers, Semantic Scholar, GitHub, Extropic writing, and Logical Intelligence for sources not already covered in the V489 Planner Refresh.
      2. Focus on grammar-budgeted constrained decoding, JSON completion slack, budget-curated memory, overwrite-capable solver guidance, p-bit boundary exchange, ARC live-path perception repair, and hardware receipt discipline.
      3. Do not promote external text scorers, CPU-only GGUF offload reruns, TSU/Kona execution claims, or retired ARC candidate-exploration-signal reruns.
