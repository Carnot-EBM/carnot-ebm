    1. PRECONDITIONS: Emit a flushed progress line immediately. Read the listed inputs and capability spec. Verify its REQ-* requirements before implementation. Paths in TASK are outputs to create, not missing prerequisites. Authenticate actual upstream values and original flags. Unchanged absent external inputs produce a terminal blocked verdict and gate_check_summary; independent audits continue their available branches.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Print completed units and monotonic elapsed INSIDE long loops at least every 60 seconds. Stream child output unbuffered and emit truthful pending-operation heartbeats every 60 seconds during blocking calls, authoring and validation. Keep every silence gap below 600 seconds. Silent work can die at 1200 seconds; sustained progress permits the 4800-second hard cap. Save completed-unit checkpoints and cancel only owned processes.
