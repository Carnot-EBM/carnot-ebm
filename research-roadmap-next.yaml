  - id: exp2228-archive-and-activate
    title: "Phase 0: Archive .220 and activate .221"
    milestone: "2026.05.221"
    deliverable: "results/experiment_2228_archive.json"
    max_turns: 20
    prompt: |
      CONTEXT: Milestone 2026.05.220 has completed. We must prepare for 2026.05.221.
      EXISTING CODE TO READ FIRST: {project_root}/research-complete.yaml, {project_root}/research-roadmap.yaml
      TASK: Archive 2026.05.220 to research-complete.yaml and initialize the .221 milestone in ops/changelog.md.
      CONCRETE STEPS:
      1. Move all tasks from `research-roadmap.yaml` into `research-complete.yaml` under a new 2026.05.220 entry, setting completed date to {date}.
      2. Clear `research-roadmap.yaml` and copy the new milestone structure from `research-roadmap-next.yaml`.
      3. Add a "## {date} (Milestone 2026.05.221 Operational Retrospective)" stub in `ops/changelog.md`.
      4. Write deliverable to `results/experiment_2228_archive.json`.
      
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "The honest_verdict field MUST start with one of the terminal prefixes: complete: / complete_ / success: / success_ / passed: / passed_ / shipped: / shipped_."
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2229-actfocus-reweighting-impl
    title: "Phase 1: ActFocus Token-Level Reweighting Implementation"
    milestone: "2026.05.221"
    deliverable: "results/experiment_2229_actfocus.json"
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: ActFocus (arxiv:2605.14558) addresses the action bottleneck by downweighting reasoning tokens and shifting focus to action tokens informed by token-level energy variance.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/pipeline/verify_repair.py, {project_root}/python/carnot/training/
      TASK: Implement ActFocus token reweighting logic for verify-repair pipelines.
      CONCRETE STEPS:
      1. Create `python/carnot/training/actfocus.py`.
      2. Implement the energy-variance calculation across rollouts.
      3. Create the token-weight gradient modifier.
      4. Write deliverable to `results/experiment_2229_actfocus.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

