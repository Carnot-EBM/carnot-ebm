  - id: exp2746
    milestone: "2026.05.260"
    deliverable: "results/experiment_2746_paraphrastic_consistency_verifier.json"
    title: "Paraphrastic Consistency Probing Verifier Tier 0w (arXiv:2602.11361)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 35
    track: verifier

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .260 — no prior failures for this specific scope.

      arXiv:2602.11361 "Finding the Cracks: Improving LLMs Reasoning with Paraphrastic Probing and
      Consistency Verification" (Feb 2026):
      Generates N paraphrastic perturbations of the input query. Models that are confident/correct
      produce consistent answers across paraphrases. Models that are hallucinating show high energy
      variance across paraphrastic probes.

      Carnot implementation (model-agnostic — no live LLM call required):
      - Paraphrases are pre-generated from FoVer corpus (many FoVer questions have multiple correct
        answers — use these as paraphrase proxies)
      - Consistency energy = std(verify(paraphrase_i, response)) across N paraphrase pairs
        If std is low: model is consistent (low energy). If std is high: inconsistent (high energy).

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (list all tier0* modules — add tier0w_paraphrase_consistency.py)
      - data/fover_corpus.jsonl (FoVer corpus — look for questions with multiple answer variants)
      - python/carnot/verify/__init__.py (export pattern)

      TASK: Implement Tier 0w Paraphrastic Consistency Verifier. Evaluate on FoVer.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; import sys; sys.path.insert(0,'python'); import carnot.pipeline"`
            Record: pipeline_importable (bool).
            If false: write honest_verdict 'blocked_carnot_not_importable' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            Record: fover_corpus_lines (int).
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Build paraphrase pairs from FoVer corpus:
         Load all (question, correct_answer, incorrect_answers) triples.
         Paraphrase proxy: find questions that have semantic similarity > 0.8 (TF-IDF cosine) —
         these are question paraphrases. For each paraphrase pair: (q1, a) and (q2, a) where
         q1 is semantically similar to q2.
         n_paraphrase_pairs = count of such pairs found.
         Record: n_paraphrase_pairs (int).
         If n_paraphrase_pairs < 10: use simple word-shuffle paraphrases (word-level reordering).

      2. Implement ParaphrasticConsistencyVerifier:
         For a (question, response) pair:
           a. Find N=3 semantic paraphrases of question (from FoVer or synthetic word-shuffle)
           b. Compute verify(question_i, response) for each paraphrase i in [1..N]
           c. Consistency energy = std(verify scores) across N paraphrases
              Low std = consistent = low energy. High std = inconsistent = high energy.
         Record: module_created (bool).

      3. Evaluate on FoVer eval split (80/20, random_seed=42):
         For correct answers: consistency_energy should be LOW (model's energy is stable across paraphrases)
         For incorrect answers: consistency_energy should be HIGH (model is confused)
         tier0w_auroc = roc_auc_score(labels, consistency_energies)
         tier0w_viable = tier0w_auroc >= 0.55 (modest bar — paraphrase quality may be limited)
         Record: tier0w_auroc (float), tier0w_viable (bool).

      4. Adversarial check: 3 synthetic examples:
         - Consistent pair (same math question, word-shuffled): energies should be similar (low std)
         - Inconsistent pair (different questions mapped to same answer): energies should differ (high std)
         Record: synthetic_consistency_energies (list of floats), paraphrase_consistency_plausible (bool).

      5. Create python/carnot/verify/tier0w_paraphrase_consistency.py.
         Update python/carnot/verify/__init__.py to export it.

