  - id: exp6544-external-structural-headroom
    milestone: "2026.08.566"
    deliverable: results/experiment_6544_external_structural_headroom.json
    title: "External exact structural-control headroom comparison"
    priority: high
    track: solver-guidance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 120
    gated_on:
      - upstream: exp6543-external-corpus-independent-audit-v2
        artifact_field: external_constraint_corpus_audited_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      V564 found held structural branch-ordering headroom on an internal procedural corpus. Before a learned router transfers to DRIFT, V566 must show that a non-learned structural control has charged held value under a family-blind external split. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V566 roadmap document
      - {project_root}/results/experiment_6543_external_corpus_independent_audit_v2.json
      - {project_root}/results/fixtures/v566_drift_bench_external_slice.jsonl
      - {project_root}/results/experiment_6518_structural_control_headroom_ab_v2.json and {project_root}/results/experiment_6519_structural_headroom_certificate.json
      - reusable exact branch, feature, control, timer, and row-reduction code under {project_root}/python/carnot/
      - relevant specs, tests, traceability, exclusions, and E2E plan

      TASK
      Run a matched external structural headroom comparison across native, random, analytical, bounded-refocus, and one-shot-enumeration controls. Charge every proposal and exact check.

      CONCRETE STEPS
      0. Evaluate the structured gate and record expected and observed values, input hashes, solver identity, resources, timeout, seeds, and protected-file hashes.
      1. Add REQ-* and SCENARIO anchors for matched controls, family-blind calibration, full candidate preservation, charged cost, exact equality, censoring, and row-first verdicts. Write tests first.
      2. Freeze unit, turn, family, effort, seed, budget, tie, timeout, and stop contracts before running any arm.
      3. Adapt only reusable structural features. Do not use entity names, source IDs, target assignments, held outcomes, or future turns.
      4. Run native, random, analytical, bounded-refocus, and one-shot-enumeration arms on identical candidate sets and budgets. Keep native exact fallback.
      5. Emit a row for each unit, turn, seed, and arm with exact answer equality, candidate order, checks, solver effort, proposals, wall time, timeout, and censoring.
      6. Report overall and family-stratified charged effects, paired uncertainty, headroom, no-headroom cells, and any Simpson reversal.
      7. Attack identity leakage, row-order leakage, unequal budgets, deleted candidates, warm-cache asymmetry, timer aliases, cherry-picked seeds, and aggregate-only claims.
      8. Set external_structural_headroom_ready_score=1.0 only when a preregistered non-learned control has positive held charged value beyond native and random with exact equality, multi-family support, and no shortcut failure.
      9. Run focused tests with full new-module coverage, lint, spec coverage, row lint, gate audit, adversarial verification, exact-solver E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6544_external_structural_headroom.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, upstream_gate_receipt, frozen_comparison_contract, control_definitions, family_and_effort_census, per_unit_rows, paired_effect_rows, family_effect_rows, charged_cost_recomputation, exact_equality_receipt, candidate_preservation_receipt, censoring_and_timeout_receipts, shortcut_attack_matrix, external_structural_headroom_ready_score, gate_check_summary, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Use verdict_class=positive only for charged held structural value with exact equality and no shortcut; use null for no benefit, partial for narrow support, blocked for a failed gate or precondition, or disqualified for leakage or invalid comparison. honest_verdict must name the charged result and support. Set inference_substrate=external_drift_exact_solver_structural_controls_no_llm. Set verifier_is_oracle=false because the compared structural controls do not supply ground truth; Z3 is separate evaluation authority. A blocked verdict must populate gate_check_summary with the failed check and observed value.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6544_external_structural_headroom --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6545-external-safety-net-router
    milestone: "2026.08.566"
    deliverable: results/experiment_6545_external_safety_net_router.json
    title: "External Safety-Net learned router, abstention, and exact-fallback comparison"
    priority: critical
    track: solver-guidance
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    gated_on:
      - upstream: exp6544-external-structural-headroom
        artifact_field: external_structural_headroom_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6520-safety-net-branch-router-ab
        verdict: "complete_safety_net_branch_router_ab_positive: compact routers beat certified structural headroom with exact fallback and no held table writes"
        addressed_by: "This is an external family-blind transfer after Exp6527 corrected the prior evidence boundary; it adds held abstention calibration, model and family shortcut attacks, an immutable train-only exception table, and a separate independent audit."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6520 found a positive Safety-Net router result on an internal bounded corpus, and Exp6527 made its corrected evidence boundary eligible. Exp6544 must first certify external structural headroom. V566 now tests whether the learned fast path transfers without losing exact fallback or learning held identities. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V566 roadmap document
      - {project_root}/results/experiment_6544_external_structural_headroom.json
      - {project_root}/results/experiment_6520_safety_net_branch_router_ab.json and {project_root}/results/experiment_6527_v565_evidence_eligibility_corrigendum.json
      - {project_root}/results/fixtures/v566_drift_bench_external_slice.jsonl
      - reusable router, branch-feature, exact fallback, exception-table, calibration, and artifact code under {project_root}/python/carnot/
      - relevant specs, tests, traceability, exclusions, and E2E plan

      TASK
      Train and evaluate a compact external Safety-Net router with held calibration, abstention, an immutable train-only exception table, and complete native exact fallback.

      CONCRETE STEPS
      0. Evaluate the structured gate and record expected and observed values, input hashes, GPU and CPU identity, seeds, budgets, timeouts, and protected-file hashes.
      1. Add REQ-* and SCENARIO anchors for train-only fitting, held calibration, abstention, exception-table immutability, full candidate preservation, exact fallback, shortcut attacks, and rollback. Write tests first.
      2. Freeze candidate models from the existing compact linear, MLP, and KAN router family. Do not add a broad architecture sweep. Freeze selection, calibration, and abstention rules before held outcomes.
      3. Train only on sealed train rows. Calibrate only on development rows. Hash and freeze the exception table before any held evaluation. Held writes are forbidden.
      4. Compare the Exp6544 certified structural control, each eligible compact router, router plus abstention, and router plus exception table and exact fallback on identical held candidate sets and budgets.
      5. Emit per-unit rows with routing score, uncertainty, chosen order, abstention, table hit, fallback, exact equality, proposals, checks, time, timeout, and charged total cost.
      6. Report overall, family, effort, and abstention-bin effects. Preserve every negative and no-headroom cell.
      7. Attack family identity, source ID, entity names, row order, solver effort leakage, held table writes, deleted candidates, fallback unreachability, calibration reuse, and timer fabrication.
      8. Set external_safety_net_ready_score=1.0 only when a frozen eligible router beats the certified structural control on held charged cost, preserves exact equality and full fallback, has calibrated abstention, and passes all shortcut attacks.
      9. Run focused tests with full new-module coverage, lint, spec coverage, row lint, gate audit, adversarial verification, exact-solver E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6545_external_safety_net_router.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, upstream_gate_receipt, frozen_router_contract, training_and_calibration_receipts, candidate_model_rows, exception_table_path_hash_and_freeze_receipt, abstention_calibration_rows, per_unit_rows, paired_effect_rows, family_and_effort_effect_rows, charged_cost_recomputation, exact_equality_and_fallback_receipt, shortcut_attack_matrix, rollback_receipt, external_safety_net_ready_score, gate_check_summary, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Use verdict_class=positive only for external held charged value with exact equality, calibrated abstention, and reachable fallback; use null for no value, partial for narrow support, blocked for a failed gate or precondition, or disqualified for leakage, held mutation, or invalid comparison. Set inference_substrate=local_compact_router_train_only_exception_table_and_external_exact_fallback_no_llm. Set verifier_is_oracle=false because the learned router is not ground truth; Z3 is separate evaluation authority. A blocked verdict must populate gate_check_summary with the failed check and observed value.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6545_external_safety_net_router --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6546-smt-cost-guard-sota
    milestone: "2026.08.566"
    deliverable: results/experiment_6546_smt_cost_guard_sota.json
    title: "SMT-conflict inference-cost stress and exact-tool guard on mandated SOTA GGUFs"
    priority: critical
    track: sota-local-inference
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 300
    gated_on:
      - upstream: exp6543-external-corpus-independent-audit-v2
        artifact_field: external_constraint_corpus_audited_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      SMTrap reports that SMT conflict count can identify CSP prompts that induce long reasoning traces and that tool routing reduces token use. Solver-Hard reports that solver hardness does not reliably predict LLM accuracy and that proof-preserving surfaces matter. V566 must test both claims under one frozen local protocol with current mandated models. Work at {project_root}. The planning date is {date}.

