  - id: "exp2040-kanele-fpga-synthesis"
    title: "Phase 4: Synthesize KANELÉ LUT-based Evaluation for KV260"
    prompt: |
      CONTEXT: Phase 4. We need to deploy the KAN constraints to the KV260 FPGA.
      EXISTING CODE TO READ FIRST: python/carnot/models/ising/symbolic_kan.py
      TASK: Synthesize the 1D splines into LUT configurations using oss-cad-suite.
      CONCRETE STEPS:
      1. Write an export script `python/carnot/hardware/export_kanele.py` converting splines to Verilog.
      2. Create a Yosys synthesis script targeting the KV260.
      3. Run synthesis and verify timing/area reports in `results/exp2040_synthesis.json`. Ensure `synthesis_success: true` is included in the output JSON.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.
    model: opus
    max_turns: 100

  - id: "exp2041-hardware-in-loop-test"
