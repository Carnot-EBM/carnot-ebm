  - id: exp2811
    milestone: "2026.05.266"
    deliverable: "results/experiment_2811_fover_memory_leakage_isolation.json"
    title: "FoVer Memory Leakage Isolation: AUROC With vs Without FR-11 Self-Learning State"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 60
    track: research
    continuous_self_learning_task: true

    gated_on:
      - upstream: exp2810
        artifact_field: pretest_cascade_fixed
        op: '=='
        value: true

    prior_failures:
      - experiment_id: exp2807a
        verdict: "complete: SKIP due to pre-test cascade — no artifact produced"
        addressed_by: "exp2810 pre-test cascade fix resolves the blocking condition; this
                       carry-forward from .265 is identical in scope to exp2807a which was
                       SKIP'd when the conductor could not run any tasks due to failing tests."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline" and
      "Adversarial Artifact Verification + Sample-Size Rigor".

      CONTEXT (operator hypothesis, 2026-05-21): "could it be that the
      self-learning has internalized the entire FoVer set having seen it
      repeatedly and used that between runs?" Multiple FR-11 self-learning
      state files persist FoVer-derived patterns across runs:
        - results/nexus_constraint_memory_v2.json (FoVer violation patterns)
        - data/constraint_templates_*.json (constraint templates)
        - data/fr11_ssd_training_v3.jsonl (FR-11 SSD training data)
        - data/fr11_zenil_distill_v2.jsonl (FR-11 Zenil distillation)
        - in-memory state via python/carnot/pipeline/{session_memory,
          cross_session_relay, self_learning_replay, query_time_memory_policy}.py
      The headline AUROC=0.9857 (exp2546) was measured with FR-11 state loaded.
      This experiment measures whether that state inflates the number.

      TASK: Run the verifier ensemble v7b against FoVer under TWO conditions:
        Condition A: WITH all FR-11 self-learning state loaded (production)
        Condition B: WITH all FR-11 state RESET (architecture-only)

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. `python3 -c "import torch; assert torch.cuda.is_available()"`
              — if false, blocked_cuda_not_available
           b. `test -f data/fover_corpus.jsonl` — if missing, try data/fover/*.jsonl
              — if corpus not found, blocked_fover_corpus_not_found
           c. `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/`
              or `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              — if neither cached, blocked_model_not_cached
           d. `ls results/nexus_constraint_memory_v2.json` — if missing,
              note in state_files that FR-11 state appears absent
           Record preconditions_checked.

        1. Identify ALL FR-11 state files; record path + SHA256 + byte size.
           State files include anything in results/ with nexus, constraint_memory,
           fr11, ssd_training, zenil_distill, session_memory in the name.

        2. Load FoVer test set (n=1000 random subset, seed=42). Document the
           exact FoVer file(s) used and SHA256 of each.

        3. CONDITION A — production config (with FR-11 state loaded):
           Run ensemble v7b on FoVer n=1000 with all FR-11 state available.
           Record per-verifier scores + ensemble AUROC.

        4. CONDITION B — memory reset:
           Move FR-11 state files to /tmp/fr11_state_backup_266/
           (NON-destructive — restore at end).
           Restart Python interpreter to clear in-memory state.
           Reload verifier ensemble; confirm import-time logs show NO
           NEXUS/constraint-template/session-memory loaded.
           Run on the SAME n=1000 FoVer subset, same input order, seed=42.
           Record per-verifier scores + ensemble AUROC.

        5. Restore FR-11 state files from backup. Verify SHA256 matches
           original for each file.

        6. Repeat steps 2-5 for 5 seeds (42, 137, 271, 314, 1729).

        7. Compute condition-A and condition-B mean ± std across seeds.
           leakage_delta = mean_A - mean_B.

        8. Per-verifier delta: for each verifier, compute A_auroc - B_auroc.
           Which verifiers degrade most without FR-11 state? Which are
           architecture-pure?

        9. Write artifact. If leakage_delta > 0.05: frame as "FR-11 provides
           substantial contribution as designed; paper-v6 must disclose both
           architecture-only (condition B) and production (condition A) numbers."
           If leakage_delta < 0.02: frame as "architecture carries the headline."
           If data couldn't be collected (FoVer not found, blocked): document
           honestly and recommend operator provide the corpus path.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:' / 'blocked_*'
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - condition_a_auroc_mean: float
          principle: "Production-config AUROC (FR-11 state loaded)."
        - condition_a_auroc_std: float
          principle: "Replication noise on production-config across 5 seeds."
        - condition_b_auroc_mean: float
          principle: "Architecture-only AUROC (FR-11 state RESET) — the naive baseline."
        - condition_b_auroc_std: float
          principle: "Replication noise on architecture-only."
        - leakage_delta: float
          principle: "Direct measurement of FR-11 self-learning contribution. > 0.05 = substantial;
                       < 0.02 = minimal. Naming is neutral — either result is honest science."
        - per_verifier_leakage_delta: dict[str, float]
          principle: "Which specific verifiers rely on FR-11 memory (memory-dependent) vs
                       architecture-pure. Critical for cross-corpus experiment design."
        - fr11_state_files: list[{path, sha256, n_bytes}]
          principle: "Names the persisted state that was reset — operator can verify."
        - state_reset_protocol: str
          principle: "Documents HOW memory was reset (move-to-/tmp + interpreter restart)."
        - state_files_restored_sha_match: bool
          principle: "True means FR-11 state was non-destructively restored to original SHAs."
        - n_examples: 1000
          principle: "Sample size for statistical claims."
        - n_seeds: 5
          principle: "Adversarial replication count."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism precondition for reproducibility."
        - reproducibility_checksum: str
          principle: "Catches corpus / model / state drift."
        - model_specs: dict
          principle: "Names the compute target."
        - duration_s: float
          principle: "Expected >= 3600s for 2 conditions x 5 seeds x N=1000 live inference.
                       Sleep-padding forbidden per CLAUDE.md Verifier Authenticity Discipline."
        - preconditions_checked: list[{resource, available, check}]
          principle: "Anti-fabrication guard."
        - methodology_note: str
          principle: "Honest interpretation of the delta. Key for paper-v6 §5 disclosure."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2812
    milestone: "2026.05.266"
    deliverable: "results/experiment_2812_mbpp_ensemble_eval.json"
    title: "MBPP Corpus — Both Memory Conditions (Architecture-Only + Production, N=100, 5 seeds)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 60
    track: corpus

    gated_on:
      - upstream: exp2810
        artifact_field: pretest_cascade_fixed
        op: '=='
        value: true

    prior_failures:
      - experiment_id: exp2802
        verdict: "complete: SKIP due to pre-test cascade — no artifact produced"
        addressed_by: "exp2810 pre-test cascade fix resolves the blocking condition; this
                       carry-forward from .265 reduces N from 500 to 100 (5000 inferences
                       for N=500 x 2 conditions x 5 seeds was impractical in a single run;
                       N=100 produces sufficient statistics while completing in < 8h)."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline"
      (no sleep-padding, no score-capping, no random-data evaluation)
      and "Adversarial Artifact Verification + Sample-Size Rigor".

      CONTEXT: per operator directive 2026-05-21, expand evaluation beyond FoVer.
      MBPP is industry-standard for Python code generation; execution-based
      ground-truth makes hallucination detection well-defined. N=100 (down from
      N=500 in exp2802) to make this feasible in a single conductor run.

      OPERATOR DIRECTIVE 2026-05-21: "we want to report both with and without
      learning so we know both how effective our naive answers are as well as
      what benefit the learning is affording our solution." Run TWICE:
      Condition A (production config — full FR-11 state) and Condition B
      (architecture-only — FR-11 state RESET).

      TASK: Run the verifier ensemble v7b against MBPP test split (100 problems)
      under two memory conditions, 5 seeds each.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. `python3 -c "import torch; assert torch.cuda.is_available()"`
              — if false, blocked_cuda_not_available
           b. `python3 -c "from datasets import load_dataset;
              load_dataset('mbpp', 'sanitized', split='test', trust_remote_code=True)"`
              — if HF unreachable, blocked_huggingface_mbpp_unreachable
           c. Check Qwen3.6-35B-A3B-GGUF or gemma-4-26B-A4B-it-GGUF cached
              — if neither cached, blocked_model_not_cached
           d. Check FR-11 state files present
           Record preconditions_checked.

        1. Load MBPP test split; sample 100 problems deterministically (seed=42).
           Record the problem IDs used.

        2. For each problem, run live-GPU inference (GGUF via llama.cpp) to
           generate a candidate solution.

        3. Execute each candidate against the test cases to get ground truth
           (pass/fail). Real execution; no static-analysis proxy.
           Use CARNOT_USE_SANDBOX=1 if available.

        4. CONDITION A — production config (full FR-11 state loaded):
           Score each (problem, candidate) with verifier ensemble v7b.
           Record per-verifier scores + ensemble AUROC vs ground-truth pass/fail.

        5. CONDITION B — architecture-only (FR-11 state RESET):
           Move all FR-11 state files to /tmp/fr11_mbpp_backup_<seed>/ NON-
           destructively. Restart Python interpreter. Reload ensemble; confirm
           no NEXUS/constraint-template/session-memory loaded. Score the SAME
           (problem, candidate) pairs. Record per-verifier scores + ensemble AUROC.

        6. Restore FR-11 state files; verify SHA256 match.

        7. Repeat steps 2-6 for 5 seeds (42, 137, 271, 314, 1729).
           For each seed: compute and record BOTH condition-A and condition-B AUROC.

        8. Compute headline for both conditions: mean ± std across 5 seeds.
           learning_contribution = mean_A - mean_B.

        9. Compare to MBPP peer baselines (vanilla model pass@1, any published
           verifier AUROC on MBPP if available).

        10. Write artifact with BOTH conditions reported as primary headline.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:' / 'blocked_*'
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - corpus: "MBPP-sanitized-test"
          principle: "Identifies which corpus was used."
        - n_problems: 100
          principle: "Reduced from N=500 in exp2802; sufficient for per-corpus AUROC estimate."
        - n_seeds: 5
          principle: "Adversarial replication seed count per 5-seed protocol."
        - condition_a_production_auroc_per_seed: list[float]
          principle: "Per-seed AUROC with full FR-11 self-learning state loaded."
        - condition_a_production_auroc_mean: float
          principle: "Production-config headline for MBPP."
        - condition_a_production_auroc_std: float
          principle: "Replication noise."
        - condition_b_architecture_only_auroc_per_seed: list[float]
          principle: "Per-seed AUROC with FR-11 state RESET — naive architecture baseline."
        - condition_b_architecture_only_auroc_mean: float
          principle: "Architecture-only headline for MBPP — what the ensemble achieves
                       without accumulated FoVer-derived learning."
        - condition_b_architecture_only_auroc_std: float
          principle: "Replication noise on architecture-only."
        - learning_contribution: float
          principle: "= A - B. Direct measurement of FR-11 contribution on code corpus."
        - per_verifier_condition_a_auroc: dict[str, list[float]]
          principle: "Per-verifier production-config AUROC per seed."
        - per_verifier_condition_b_auroc: dict[str, list[float]]
          principle: "Per-verifier architecture-only AUROC — identifies transfer patterns."
        - vanilla_model_pass_at_1: float
          principle: "Baseline for the model without Carnot."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism precondition for reproducibility."
        - reproducibility_checksum: str
          principle: "Catches corpus or model-version drift."
        - model_specs: dict
          principle: "Names the compute target."
        - duration_s: float
          principle: "Expected >= 1200s for 2 conditions x 5 seeds x N=100 live inference.
                       Sleep-padding forbidden per CLAUDE.md Verifier Authenticity Discipline."
        - preconditions_checked: list
          principle: "Anti-fabrication."
        - state_files_restored_sha_match: bool
          principle: "Proves FR-11 state was non-destructively reset and restored."
        - methodology_note: str
          principle: "Honest interpretation. Either AUROC value is publishable; what matters
                       is disclosing both numbers and the learning_contribution."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

