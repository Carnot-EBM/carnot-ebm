- id: exp2460-tier0n-internal-representation-conformal
  title: 'Phase 1: Tier 0n Internal Representation Conformal Verifier (arXiv:2604.16217) -- Layer-Wise Logit Scores'
  milestone: 2026.05.238
  deliverable: results/experiment_2460_tier0n_internal_conformal.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2338-semantic-energy-tier0g
    verdict: complete_semantic_energy_tier0g_auroc_0.810
    addressed_by: "exp2338 implemented SemanticEnergy (Tier 0g) using Boltzmann distributions on output
      logprobs (AUROC=0.810). exp2460 implements a DIFFERENT mechanism from arXiv:2604.16217:
      layer-wise information scores computed across ALL logit positions at multiple abstraction
      levels, not just the final output distribution. The nonconformity measure is the weighted
      information norm across token positions at layer L, compared against a calibration set.
      This is an internal-representation approach vs SemanticEnergy's output-logit approach."
    retire_if_same_verdict: false
  prompt: "CONTEXT: arXiv:2604.16217 (April 2026) 'Beyond Surface Statistics: Robust Conformal\n\
    Prediction for LLMs via Internal Representations' shows that using layer-wise information\n\
    scores (information norm at token position t, layer L) as nonconformity measures yields\n\
    significantly better conformal prediction coverage than output-logit-only approaches,\n\
    especially under distribution shift.\n\nKey insight: the nonconformity score for entry x is:\n\
    \  s(x) = || H_L(x) - mean_calib(H_L) || / std_calib(H_L)\nwhere H_L(x) is the sum of squared\
    \ token-logit magnitudes at layer L.\n\nCPU approximation using available logprob data:\n  H_approx(x)\
    \ = sum(-logprob_i^2 for i in token_positions)  (norm of logprob vector)\n  Nonconformity = (H_approx(x)\
    \ - mean_calib(H_approx)) / std_calib(H_approx)\n  High nonconformity = atypical logprob pattern\
    \ = potential hallucination\n\nBest current AUROC: 0.9167 (conformal ensemble v2). Target: push\
    \ past 0.9236 when fused.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py\
    \ (Tier 0g — logprob energy pattern)\n  {project_root}/python/carnot/verify/pcib_verifier.py (Tier\
    \ 0l — calibration pattern)\n  {project_root}/results/experiment_2436_pcib_tier0l.json (calibration\
    \ set pattern)\n\nTASK: Implement InternalRepresentationConformalVerifier (Tier 0n) and evaluate\
    \ on 36 entries.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. numpy importable: .venv/bin/python\
    \ -c \"import numpy; print(numpy.__version__)\"\n     b. sklearn importable: .venv/bin/python -c\
    \ \"import sklearn; print(sklearn.__version__)\"\n     c. Telemetry manifest present:\n        ls\
    \ {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n        If missing: write\
    \ honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Implement InternalRepresentationConformalVerifier\
    \ at python/carnot/verify/ir_conformal_verifier.py:\n     For each telemetry entry (logprobs list):\n\
    \       # CPU proxy for H_L (layer-wise information norm)\n       sq_logprobs = [lp**2 for lp in\
    \ logprobs]  # squared logprobs\n       h_norm = sum(sq_logprobs)                # information norm\
    \ proxy\n       h_variance = variance(sq_logprobs)        # variance of squared logprobs\n       #\
    \ Position-weighted version (middle tokens weight x2)\n       n = len(logprobs)\n       weights =\
    \ [1 if i < n//4 or i > 3*n//4 else 2 for i in range(n)]\n       h_weighted = sum(w*lp**2 for w,lp\
    \ in zip(weights, logprobs))\n       ir_score = h_weighted / (h_norm + 1e-8)  # normalized position\
    \ emphasis\n     Calibration (first 10 entries):\n       calib_scores = ir_scores[:10]\n       calib_mean\
    \ = mean(calib_scores)\n       calib_std = std(calib_scores) + 1e-8\n     Nonconformity:\n       nonconformity_i\
    \ = (ir_score_i - calib_mean) / calib_std  for i in test examples\n     ir_conformal_score = nonconformity\
    \ (higher = more anomalous = more likely hallucination)\n\n  2. Evaluate on 36 telemetry entries:\n\
    \     ir_conformal_auroc: AUROC on 36 examples (10 calibration + 26 test).\n     ir_vs_semantic_energy_delta:\
    \ ir_conformal_auroc - 0.810.\n     orthogonality_vs_pcib: Pearson r between ir_conformal_score\
    \ and pcib_score.\n     orthogonality_vs_halt: Pearson r between ir_conformal_score and halt_score\
    \ (if available).\n\n  3. Compute verifier_scores for conformal ensemble:\n     Write results/experiment_2460_tier0n_scores.json:\n\
    \     {\"verifier\": \"ir_conformal\", \"scores\": [{\"idx\": i, \"score\": s, \"label\": l} for\
    \ all 36]}\n\n  4. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/verify/\
    \ -k \"ir_conformal\" -v --no-cov 2>&1 | tail -15\n     Create test if none exists.\n\n  5. Write\
    \ deliverable. Validate JSON: json.loads(json.dumps(result)) before writing.\n\nREQUIRED ARTIFACT\
    \ FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with AUROC.\"\
    \n  - ir_conformal_auroc:\n      principle: \"Primary metric. Honest result regardless of sign vs\
    \ baseline.\"\n  - ir_vs_semantic_energy_delta:\n      principle: \"ir_conformal_auroc - 0.810.\
    \ Positive = improvement over SemanticEnergy.\"\n  - orthogonality_vs_pcib:\n      principle: \"\
    Pearson r with PCIB. If abs(r) < 0.5, IR-Conformal adds independent signal to ensemble.\"\n  - nonconformity_method:\n\
    \      principle: \"String describing the nonconformity score computation for reproducibility.\"\n\
    \  - n_calibration_examples:\n      principle: \"Must be 10. Documents calibration/test split.\"\
    \n  - n_eval_examples:\n      principle: \"Must be 36 total.\"\n  - random_seed:\n      principle:\
    \ \"Must be 42.\"\n  - duration_s:\n      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n\
    \      principle: \"Records numpy, sklearn, telemetry checks.\"\n\nACCEPTANCE GATES:\n  - condition:\
    \ \"ir_conformal_auroc != null AND n_eval_examples >= 30\"\n    principle: \"Must produce valid AUROC\
    \ on sufficient data — even below baseline is useful for ensemble diversity.\"\n\nDo NOT push. Do\
    \ NOT modify scripts/research_conductor.py."

- id: exp2461-conformal-ensemble-v3-stouffer
  title: 'Phase 1: Conformal Ensemble v3 -- Stouffer Z-Score + LaaB Meta (9th Verifier) + Quality-Weighted Breach Attempt'
  milestone: 2026.05.238
  deliverable: results/experiment_2461_conformal_ensemble_v3.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  prior_failures:
  - experiment_id: exp2448-conformal-ensemble-v2
    verdict: 'complete: with conformal_ensemble_auroc=0.916667'
    addressed_by: "exp2448 added PCIB as 8th verifier to Fisher's conformal method but got identical
      AUROC=0.9167 as v1. Root cause: Fisher's method treats all p-values equally and has
      a ceiling with the current verifier set. exp2461 switches to Stouffer's Z-score method
      (weights p-values by verifier quality, i.e., individual AUROC) AND adds LaaB meta scores
      (exp2450_laab_meta_scores.json, AUROC=0.854) as the 9th verifier. Different aggregation
      mechanism + new verifier source."
    retire_if_same_verdict: true
  - experiment_id: exp2438-conformal-ensemble-v1
    verdict: complete_with_conformal_ensemble_auroc_0.916667
    addressed_by: "exp2438 implemented Fisher's method with 7 verifiers and got AUROC=0.9167 (JSON malformed).
      exp2461 switches to Stouffer's Z-score (quality-weighted) and fuses 9 verifiers including
      LaaB meta (exp2450) and optionally Tier 0n (exp2460). Different: aggregation method changed."
    retire_if_same_verdict: false
  prompt: "CONTEXT: Conformal ensemble v1 (exp2438, 7 verifiers, Fisher's method): AUROC=0.9167.\n\
    Conformal ensemble v2 (exp2448, 8 verifiers + PCIB, Fisher's method): AUROC=0.9167 (identical).\n\
    The Fisher's method ceiling is confirmed: adding more verifiers with Fisher's method does not\n\
    help. Gap to HIVE peer: 0.9236 - 0.9167 = 0.0069.\n\nv3 Strategy:\n  1. Switch to Stouffer's\
    \ Z-score aggregation (quality-weighted by individual verifier AUROC):\n     z_i = (p_i - 0.5) /\
    \ sqrt(auroc_i * (1 - auroc_i) / n_i)  # per-verifier Z-score\n     z_combined = sum(auroc_i *\
    \ z_i) / sqrt(sum(auroc_i**2))         # quality-weighted\n     combined_score = z_combined (higher\
    \ = more likely hallucination)\n  2. Add LaaB meta scores from exp2450_laab_meta_scores.json as\
    \ 9th verifier (AUROC=0.854).\n  3. Add Tier 0n scores from exp2460_tier0n_scores.json if available\
    \ (may not exist yet).\n  4. Add Tier 0o scores from exp2462_tier0o_scores.json if available.\n\n\
    Also try learned ensemble (LogisticRegression) as a secondary method.\n\nEXISTING CODE TO READ FIRST:\n\
    \  {project_root}/python/carnot/verify/conformal_ensemble.py (from exp2448)\n  {project_root}/results/experiment_2448_conformal_ensemble_v2.json\
    \ (v2 result)\n  {project_root}/results/experiment_2450_laab_meta_scores.json (LaaB meta, 36 entries)\n\
    \  {project_root}/results/experiment_2436_tier0l_scores.json (PCIB, already in v2)\n\nTASK: Rebuild\
    \ conformal ensemble with Stouffer's Z-score aggregation + LaaB meta as 9th verifier.\n\nCONCRETE\
    \ STEPS:\n  0. PRECONDITIONS:\n     a. sklearn importable: .venv/bin/python -c \"import sklearn;\
    \ print(sklearn.__version__)\"\n     b. conformal_ensemble.py exists:\n        ls {project_root}/python/carnot/verify/conformal_ensemble.py\n\
    \        If missing: write honest_verdict blocked_conformal_module_missing and exit.\n     c. LaaB\
    \ meta scores file:\n        ls {project_root}/results/experiment_2450_laab_meta_scores.json\n  \
    \      Record laab_meta_available=True/False.\n     d. Telemetry manifest:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Load\
    \ all existing verifier score files (same 8 from exp2448 + LaaB meta):\n     Verifiers and their\
    \ individual AUROCs (from prior experiments):\n       semantic_energy: 0.810 (Tier 0g)\n       halt:\
    \ 0.8539 (Tier 0j)\n       laab: 0.8539 (Tier 0h, old version)\n       fregelogic: 0.8831 (Tier\
    \ 0i)\n       diffutruth: 0.588 (Tier 0k — LOW quality, low weight)\n       pcib: 0.802 (Tier 0l)\n\
    \       logcons_z3: 0.607 (Tier 0m proxy — LOW quality)\n       hierarchical_logcons: 0.8896 (Tier\
    \ 0 baseline)\n     9th verifier: laab_meta (exp2450, AUROC=0.854)\n     Optional 10th: ir_conformal\
    \ (exp2460) if file exists\n     Optional 11th: tier0o (exp2462) if file exists\n\n  2. Implement\
    \ Stouffer's Z-score method:\n     For each test example i:\n       For each verifier v:\n       \
    \  score_v_i = normalized score (mean-subtracted across calibration set)\n         z_v_i = score_v_i\
    \ / std_v_calib  # per-verifier Z-score\n       stouffer_combined_i = sum(auroc_v * z_v_i) / sqrt(sum(auroc_v**2))\
    \  # quality-weighted\n     stouffer_auroc: AUROC using stouffer_combined as predictor.\n\n  3. Also\
    \ try learned ensemble (LogisticRegression with C=1.0):\n     X = verifier scores matrix (n_examples\
    \ x n_verifiers)\n     y = hallucination labels\n     from sklearn.model_selection import StratifiedKFold\n\
    \     Use 5-fold stratified CV, report mean AUROC.\n     logistic_auroc: AUROC via LogReg ensemble.\n\
    \n  4. Best AUROC = max(stouffer_auroc, logistic_auroc, fisher_auroc_from_v2=0.9167).\n     ensemble_auroc_improved_v3\
    \ = best_auroc > 0.9167.\n     conformal_vs_hive_peer_delta_v3 = best_auroc - 0.9236.\n\n  5. Validate\
    \ JSON: json.loads(json.dumps(result)) before writing.\n  6. Write deliverable.\n\nREQUIRED ARTIFACT\
    \ FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with best AUROC.\"\
    \n  - stouffer_auroc:\n      principle: \"Primary method metric. Stouffer Z-score with quality weights.\"\
    \n  - logistic_auroc:\n      principle: \"Secondary method metric. LogReg ensemble on verifier scores.\"\
    \n  - best_auroc_v3:\n      principle: \"max(stouffer_auroc, logistic_auroc). The .238 ensemble result.\"\
    \n  - ensemble_auroc_improved_v3:\n      principle: \"best_auroc_v3 > 0.9167. Required for downstream\
    \ capstone gate.\"\n  - conformal_vs_hive_peer_delta_v3:\n      principle: \"best_auroc_v3 - 0.9236.\
    \ Negative = gap remains; positive = BREACHED.\"\n  - n_verifiers_fused:\n      principle: \"Must\
    \ be >= 9 (8 from v2 + LaaB meta). Documents ensemble composition.\"\n  - laab_meta_fused:\n    \
    \  principle: \"True if exp2450_laab_meta_scores.json was loaded and fused.\"\n  - aggregation_method_selected:\n\
    \      principle: \"'stouffer' or 'logistic' — which method achieved best_auroc_v3.\"\n  - json_validation_passed:\n\
    \      principle: \"json.loads(result_str) succeeded before write. Guards against repeat of exp2438\
    \ malformation.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n      principle:\
    \ \"Guards against fabrication.\"\n  - preconditions_checked:\n      principle: \"Records sklearn,\
    \ conformal module, LaaB meta scores, telemetry checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"\
    json_validation_passed == true\"\n    principle: \"JSON must be valid — no repeat of exp2438 Extra\
    \ data bug.\"\n  - condition: \"n_verifiers_fused >= 9\"\n    principle: \"Must add at least LaaB\
    \ meta to be v3 (not a repeat of v2).\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2462-qwen-suppressed-retrieval-nla-probe-tier0o
  title: 'Phase 1: Qwen Suppressed-Retrieval NLA Probe Tier 0o -- MANDATORY (2026-05-19 Operator Note)'
  milestone: 2026.05.238
  deliverable: results/experiment_2462_tier0o_nla_probe.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp1851-nla-probe
    verdict: complete_nla_probe_tpr1.0_fpr0.0_3.4s
    addressed_by: "exp1851 (.183) was adversarially flagged as FABRICATED: TPR=1.0 in 3.4s on a
      30B+ GGUF model is impossible (DURATION_TOO_SHORT + IMPLAUSIBLE_PERFECT). Root cause: no
      preconditions block; GGUF model not loaded; agent synthesized results. exp2462 uses a
      COMPLETELY DIFFERENT MECHANISM: no GGUF model required. It is a CPU-only logprob-based
      probe computing self-consistency under paraphrase, specifically targeting the Qwen
      censorship-circuit pattern (suppressed retrieval via routing layer). The detection
      mechanism uses available logprob data from telemetry manifest, not live GGUF inference."
    retire_if_same_verdict: true
  - experiment_id: exp1694-nla-prototype-v3
    verdict: complete_nla_prototype_v3_tpr0.73_fpr0.0_62s
    addressed_by: "exp1694 (.171) ran the NLA probe using Gemma-4-26B-A4B GGUF and got valid results
      (tpr=0.73, fpr=0.0, 62s real duration — passed adversarial verify). That was a GGUF-based
      approach. exp2462 is different: (a) no GGUF required (CPU-only, uses cached logprob data),
      (b) specifically targeting suppressed-retrieval hallucinations (Qwen censorship circuit
      pattern from 2026-05-19 research-references), (c) different verifier Tier (0o vs NLA probe),
      (d) output written as tier0o_scores.json for ensemble integration."
    retire_if_same_verdict: false
  prompt: "CONTEXT: 2026-05-19 operator-shared research finding (research-references.md):\nQwen3.5-9B\
    \ has a 3-axis localized circuit at layers 11-20 (d_prc, d_refuse, d_style) that gates\nPRC-specific\
    \ deflection. Crucially: factual knowledge EXISTS in pretraining but post-training added\na routing\
    \ layer that suppresses retrieval without erasing data. Key finding: this causes MEASURABLE\n\
    off-manifold hallucinations (Kosovo question → \"Kosovo is an integral part of China\").\n\nCarnot's\
    \ current verifiers (HALT, FregeLogic, LaaB, SemanticEnergy) operate DOWNSTREAM of the routing\n\
    decision and cannot detect suppressed retrieval distinctively. This Tier 0o probe detects\n\
    suppressed retrieval via self-consistency under paraphrase:\n\n  Suppression hypothesis: if the model\
    \ KNOWS the answer but routes away, paraphrase of the\n  same question should produce HIGH logprob\
    \ DIVERGENCE (different routing triggers different\n  responses to the same underlying query).\n\
    \  Normal knowledge: consistent logprob distributions across paraphrases.\n  Suppressed retrieval:\
    \ inconsistent distributions (some phrasings trigger suppression, others don't).\n\nThis is a CPU-only\
    \ probe using the telemetry manifest's logprob data. No GGUF required.\n\nEXISTING CODE TO READ\
    \ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py (logprob processing pattern)\n\
    \  {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl (first 3 lines — schema)\n\
    \nTASK: Implement SuppressedRetrievalProbe (Tier 0o) and evaluate on 36 telemetry entries.\n\n\
    CONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. numpy importable: .venv/bin/python -c \"import numpy;\
    \ print(numpy.__version__)\"\n     b. sklearn importable: .venv/bin/python -c \"import sklearn;\
    \ print(sklearn.__version__)\"\n     c. Telemetry manifest present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Implement\
    \ SuppressedRetrievalProbe at python/carnot/verify/suppressed_retrieval_probe.py:\n     For each\
    \ telemetry entry (logprobs list available):\n       # Proxy for self-consistency under paraphrase:\n\
    \       # Split the logprobs sequence into two halves (as if two paraphrase responses)\n       n =\
    \ len(logprobs)\n       half1 = logprobs[:n//2]\n       half2 = logprobs[n//2:]\n       # Normalize\
    \ each half\n       mean1, std1 = mean(half1), std(half1) + 1e-8\n       mean2, std2 = mean(half2),\
    \ std(half2) + 1e-8\n       norm1 = [(lp - mean1)/std1 for lp in half1]\n       norm2 = [(lp - mean2)/std2\
    \ for lp in half2[:len(half1)]]\n       # Divergence between halves (proxy for self-consistency\
    \ under paraphrase)\n       paraphrase_divergence = mean([(a - b)**2 for a,b in zip(norm1, norm2)])\n\
    \       # Entropy of logprob distribution\n       import math\n       exp_lps = [math.exp(min(lp,\
    \ 0)) for lp in logprobs]\n       total = sum(exp_lps) + 1e-8\n       probs = [e/total for e in\
    \ exp_lps]\n       entropy = -sum(p*math.log(p+1e-9) for p in probs)\n       # Combined score: high\
    \ divergence + high entropy = suppressed retrieval signature\n       suppression_score = paraphrase_divergence\
    \ * entropy\n     Output: suppression_score (higher = more likely suppressed retrieval = hallucination)\n\
    \n  2. Evaluate on 36 telemetry entries:\n     tier0o_auroc: AUROC on 36 examples.\n     tier0o_vs_semantic_energy_delta:\
