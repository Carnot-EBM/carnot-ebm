- id: exp1484-fr11-v9-query-time-memory-policy
  milestone: 2026.04.114
  deliverable: results/experiment_1484_fr11_v9_query_time_memory_policy.json
  title: "FR-11 v9 Query-Time Memory Policy Integration"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 80
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  continuous_self_learning_task: true
  prior_failures:
    - experiment_id: exp1471-fr11-v8-verified-memory-growth-pivot
      verdict: fr11_v8_positive_verified_memory_growth_persisted_without_forgetting
      addressed_by: "Exp1471 proved safe memory growth; this task changes the question to opt-in query-time utility and must preserve zero soundness mistakes."
      retire_if_same_verdict: false
    - experiment_id: exp1472-online-verifier-asymmetric-mistake-budget
      verdict: self_learning_claim_preserved_zero_soundness_mistakes
      addressed_by: "Exp1472 preserved the claim but exposed high completeness mistakes; this task measures task utility and keeps zero soundness as a hard gate."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    research-program.md requires continuous self-learning. Exp1471 and exp1472
    showed verified memory growth with zero soundness mistakes, but not
    query-time task benefit. This experiment integrates the memory policy as an
    opt-in verifier signal and measures whether it improves task outcomes
    without false accepts. Use {project_root} as the project root and {date} as
    the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (optional fresh-row generator if new LLM cases are needed)
    - unsloth/gemma-4-31B-it-GGUF (optional fresh-row generator)
    - unsloth/gemma-4-26B-A4B-it-GGUF (optional fresh-row generator)
    Prefer replaying existing verified rows. Any new headline LLM generation
    must use at least one mandated local SOTA GGUF model.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-program.md
    - results/experiment_1471_fr11_v8_verified_memory_growth_pivot.json
    - results/experiment_1472_online_verifier_asymmetric_mistake_budget.json
    - docs/research-notes/fr11_v8_asymmetric_mistake_budget.md
    - python/carnot/pipeline/session_memory.py
    - python/carnot/pipeline/
    - tests/python/

    TASK:
    Add or exercise a narrow opt-in query-time memory policy path and compare
    verifier outcomes with and without memory on a bounded replay set.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - policy_integration_ready
    - continuous_self_learning_task
    - replay_cases_evaluated
    - baseline_task_success_rate
    - memory_task_success_rate
    - task_success_delta
    - soundness_mistakes
    - completeness_mistakes
    - nonforgetting_rate
    - memory_policy_path
    - tests_run
    - promotion_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1484_fr11_v9_query_time_memory_policy.json immediately with status="in_progress".
    2. Read exp1471, exp1472, the FR-11 code, and the Continuous Self-Learning section of research-program.md.
    3. Use the existing verified memory entries and an opt-in policy flag; do not make memory global default behavior.
    4. Run a bounded replay comparison with memory disabled versus enabled on the same cases.
    5. Measure task success, false accepts, false rejects, and nonforgetting.
    6. Set promotion_allowed=true only if soundness_mistakes == 0 and task_success_delta is non-negative.
    7. Run focused tests for any edited memory or pipeline code.
    8. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1484_fr11_v9_query_time_memory_policy.json')); print(d.get('policy_integration_ready'), d.get('task_success_delta'), d.get('soundness_mistakes'), d.get('promotion_allowed'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1485-fr11-completeness-reduction-audit
  milestone: 2026.04.114
  deliverable: results/experiment_1485_fr11_completeness_reduction_audit.json
  title: "FR-11 Completeness Reduction Audit - Gated on Exp1484 Policy"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 45
  priority: high
  requires_gpu: false
  skip_pre_test: true
  gated_on:
    - upstream: exp1484-fr11-v9-query-time-memory-policy
      artifact_field: policy_integration_ready
      op: "=="
      value: true
  prior_failures:
    - experiment_id: exp1472-online-verifier-asymmetric-mistake-budget
      verdict: self_learning_claim_preserved_zero_soundness_mistakes
      addressed_by: "Exp1472 preserved soundness but reported 140 completeness mistakes; this audit targets threshold/routing changes that reduce false rejects without introducing false accepts."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp1472 found zero soundness mistakes but high completeness mistakes. After
    exp1484 integrates the policy for query-time replay, this audit searches
    for a conservative threshold or routing change that reduces overrejection
    while preserving zero false accepts. Use {project_root} as the project root
    and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - results/experiment_1484_fr11_v9_query_time_memory_policy.json
    - results/experiment_1472_online_verifier_asymmetric_mistake_budget.json
    - python/carnot/pipeline/session_memory.py
    - python/carnot/pipeline/
    - tests/python/

    TASK:
    Audit whether FR-11 query-time memory can reduce completeness mistakes on
    the replay set without increasing soundness mistakes.

    REQUIRED ARTIFACT FIELDS:
    - status
    - source_experiment
    - completeness_reduction_audit_complete
    - baseline_completeness_mistakes
    - candidate_completeness_mistakes
    - completeness_mistake_delta
    - baseline_soundness_mistakes
    - candidate_soundness_mistakes
    - candidate_policy
    - policy_change_allowed
    - tests_run
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1485_fr11_completeness_reduction_audit.json immediately with status="in_progress".
    2. Load exp1484's per-case replay ledger or recreate the bounded replay from the same inputs.
    3. Test conservative threshold/routing variants that could reduce false rejects.
