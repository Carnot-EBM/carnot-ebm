    - status
    - rejection_ledger_path
    - rejection_ledger_complete
    - cases_analyzed
    - top_rejection_reason
    - rejection_reason_counts
    - repair_v2_contract_ready
    - nonzero_repair_gate_required
    - honest_verdict

