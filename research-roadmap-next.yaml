    milestone: "2026.05.151"
    title: "Exp 1932: Energy-Guided Decoding Mitigation"
    deliverable: "results/experiment_1932_energy_guided_decoding.json"
    prompt: |
      CONTEXT: Today is {date}. Workspace is {project_root}. Based on arXiv:2507.07731, energy-guided decoding can mitigate hallucinations without retraining by selecting hidden states with minimal energy scores.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verify_repair.py and python/carnot/inference/model_loader.py
      TASK: Implement an Energy-Guided Decoding adapter over our local SOTA models.
      CONCRETE STEPS:
      1. Develop a decoding hook that penalizes high-energy hidden state proposals.
      2. Run generation on a 20-case dataset using `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF`.
      3. Compare semantic validity rates against static-constrained decoding.
      4. Write the results artifact with `acceptance_authority_unchanged=true`.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

