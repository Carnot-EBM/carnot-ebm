       - AUC_streaming = sklearn.metrics.roc_auc_score(labels, [-p for p in final_phas])
    8. Create scripts/experiment_861_streaming_cot_detector.py using ExperimentTemplate(861).
       tmpl = ExperimentTemplate(861, "StreamingCoT hallucination detector Tier 0g",
                                  "results/experiment_861_streaming_cot_detector.json",
                                  requires_gpu=False)
       tmpl.setup()
       Collect:
         - AUC_streaming: float (target > 0.65)
         - tier: "0g"
         - alpha: 0.3
         - threshold: 0.35
         - n_pairs: 50
         - certificate_field_added: True
       honest_verdict:
         - "tier_0g_viable" if AUC_streaming > 0.65
         - "tier_0g_marginal" if 0.55 < AUC_streaming <= 0.65
         - "tier_0g_fails" if AUC_streaming <= 0.55
       Build artifact and write results/experiment_861_streaming_cot_detector.json.
    9. Write tests/python/test_experiment_861_streaming_cot_detector.py with 100% coverage.
       Test process_step() EMA accumulation.
       Test is_streaming_unstable() threshold logic.
       Test AUC computation on synthetic data.
       Test VerificationCertificate has streaming_cot_unstable field.
       Traces to REQ-PROBE-040 (new), SCENARIO-PROBE-050 (Tier 0g AUC).
    10. Reconcile:
