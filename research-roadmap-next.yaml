- id: exp2338-semantic-energy-tier0g
  title: "Phase 1: Semantic Energy Hallucination Detector — Tier 0g Verifier\
    \ Prototype (arXiv:2508.14496)"
  milestone: 2026.05.229
  deliverable: results/experiment_2338_semantic_energy.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prompt: "CONTEXT: This task is UNGATED. It runs regardless of whether exp2337 (pre-test\
    \ fix) succeeds.\nThis structural change prevents another 0-experiment milestone.\n\
    \narXiv:2508.14496 introduces Semantic Energy: a Boltzmann-inspired energy function\n\
    computed from LLM penultimate layer logits (not post-softmax probabilities) combined\n\
    with semantic clustering. Achieves 13%+ AUROC improvement over Semantic Entropy\n\
    for hallucination detection across multiple benchmarks.\n\nThis is a natural Tier\
    \ 0g verifier for Carnot's cascade architecture:\n- Tier 0b: SpilledEnergy (token-logit\
    \ variance)\n- Tier 0f: Frequency-Aware Attention (arXiv:2602.18145, attention\
    \ pattern entropy)\n- Tier 0g: Semantic Energy (Boltzmann energy on penultimate\
    \ logits) [THIS TASK]\n\nThe task does NOT require: the pre-test suite to pass,\
    \ a GPU, or a cached GGUF model.\nIt uses a small synthetic logit simulation to\
    \ prototype the detector.\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/\n\
    \  {project_root}/python/carnot/models/substrate_kan.py\n  {project_root}/scripts/experiment_template.py\n\
    TASK: Implement a prototype Semantic Energy hallucination detector and evaluate\
    \ on synthetic data.\nCONCRETE STEPS:\n  1. Create python/carnot/verify/semantic_energy.py\
    \ implementing:\n     class SemanticEnergyDetector:\n       - compute_energy(logits:\
    \ np.ndarray, temperature: float = 1.0) -> float\n         Computes Boltzmann\
    \ energy: E = -temperature * log(sum(exp(logits / temperature)))\n         Equivalent\
    \ to the negative log-partition function (free energy).\n       - cluster_semantics(responses:\
    \ list[str]) -> dict[str, list[int]]\n         Groups responses by semantic equivalence\
    \ (simple string-hash clustering for prototype).\n       - detect(logits_per_response:\
    \ list[np.ndarray], responses: list[str]) -> dict\n         Returns: {{\n       \
    \    \"energy_mean\": float,\n           \"energy_std\": float,\n           \"\
    semantic_entropy_estimate\": float,\n           \"semantic_energy_score\": float,\n\
    \           \"is_hallucination_predicted\": bool\n         }}\n         where semantic_energy_score\
    \ = energy_std / (energy_mean + 1e-8)\n         and is_hallucination_predicted\
    \ = semantic_energy_score > threshold.\n  2. Write 3 focused unit tests in tests/python/verify/test_semantic_energy.py:\n\
    \     Test 1: compute_energy() returns scalar float for valid logit array.\n  \
    \   Test 2: detect() on high-variance logits (simulated hallucination) returns\n\
    \             is_hallucination_predicted=True.\n     Test 3: detect() on low-variance\
    \ logits (simulated confident correct) returns\n             is_hallucination_predicted=False.\n\
    \  3. Run unit tests. Record n_tests_passed.\n     NOTE: If the pre-test suite\
    \ is still broken (exp2337 failed), run these unit tests\n     with: .venv/bin/python\
    \ -m pytest tests/python/verify/test_semantic_energy.py -v --no-cov -p no:xdist\n\
    \  4. Synthesize an evaluation corpus:\n     - 50 correct-answer examples: logits\
    \ drawn from Normal(0, 0.5) [low variance = confident]\n     - 50 hallucination\
    \ examples: logits drawn from Normal(0, 2.0) [high variance = uncertain]\n   \
    \  Use random_seed=42.\n  5. Evaluate:\n     - semantic_energy_auroc: AUROC for\
    \ detecting hallucinations (correct label: is_hallucination)\n     - fpr_at_tpr80:\
    \ false positive rate at TPR=0.80\n     - mean_energy_correct vs mean_energy_hallucination\n\
    \  6. Set semantic_energy_validated: true if semantic_energy_auroc >= 0.60.\n\
    \  7. Write deliverable to results/experiment_2338_semantic_energy.json.\n\nREQUIRED\
    \ ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required.\
    \ complete: if implementation ran to completion (AUROC\n                 below\
    \ 0.60 is an honest finding for a prototype).\"\n  - semantic_energy_validated:\n\
    \      principle: \"Boolean. True when AUROC >= 0.60 on synthetic corpus. This\
    \ is a prototype\n                 gate; full validation requires real LLM logits\
    \ in a later milestone.\"\n  - semantic_energy_auroc:\n      principle: \"Primary\
    \ hallucination-detection quality metric. Baseline: 0.50 = random, 0.60\n    \
    \             = informative prototype, 0.75+ = paper-v6 claim territory.\"\n \
    \ - fpr_at_tpr80:\n      principle: \"False positive rate at TPR=0.80 guards against\
    \ over-rejection at inference\n                 time; FPR > 0.30 makes the verifier\
    \ unusable in production.\"\n  - mean_energy_correct:\n      principle: \"Must\
    \ be lower than mean_energy_hallucination; validates the Boltzmann energy\n  \
    \               direction (correct = lower energy = more certain).\"\n  - mean_energy_hallucination:\n\
    \      principle: \"Must be higher than mean_energy_correct; validates the energy\
    \ ordering.\"\n  - n_tests_passed:\n      principle: \"Unit tests must pass; confirms\
    \ the module is importable and functionally correct.\"\n  - module_path:\n    \
    \  principle: \"Records where SemanticEnergyDetector was written for integration\
    \ with the\n                 verifier cascade in future milestones.\"\n  - n_eval_examples:\n\
    \      principle: \"Must be 100 (50+50) to make AUROC estimates statistically\
    \ meaningful.\"\n  - random_seed:\n      principle: \"Must be 42 for reproducibility\
    \ of the synthetic logit corpus.\"\n\nRun command, 'Do NOT push. Do NOT modify\
    \ scripts/research_conductor.py.'\n"
  prior_failures:
  - experiment_id: exp772-semantic-energy-probe
    verdict: semantic_energy_below_baseline
    addressed_by: "exp772 (arXiv 2508.14496, Tier 0g candidate) used a TF-IDF proxy
      as a stand-in for real logits (AUC=0.455556, energy_threshold=5.0, probe_type=unsupervised_tfidf_proxy).
      The core method was never tested on actual Boltzmann energy from penultimate
      layer logits. exp2338 implements the correct formula: E=-T*log(sum(exp(logits/T)))
      on synthetic logit arrays with controlled variance (Normal(0,0.5) vs Normal(0,2.0)),
      making the method testable without a cached GGUF model. Gate lowered to AUROC>=0.60
      to be prototype-appropriate."
    retire_if_same_verdict: false
  - experiment_id: exp2103-semantic-energy-detection
    verdict: blocked_gate_check_failed
    addressed_by: "exp2103 was gated on an upstream artifact that was never set; the
      experiment never ran any Semantic Energy logic. exp2338 is UNGATED — it runs
      regardless of the pre-test cascade or any other gate. No model cache required."
    retire_if_same_verdict: false
