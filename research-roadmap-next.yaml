milestone: 2026.06.402
milestone_title: "CONVERT the PROVEN oracle-distinct verifier-moat into a generation GAIN (S3 stratified verifier-guided denoising search, arXiv:2604.06260, using the .401 leak-robust scorer) + drive the ARC north star DEEPER (E3 ka59 + sc25 L2+/ar25 L2/tn36 L7 + tr87/ft09) + PIVOT continuous self-learning to a learned ACTION-COST heuristic (cross-game value-transfer RETIRED 3rd-null). .401 PAID OFF the headline bet: the in-generation oracle-distinct moat REPLICATED leak-robust (exp4338 in_generation_moat_replicates=true, +0.358 vs best control, +0.321 vs self-reward SMC, CI95 [0.283,0.4375] excl 0, n=240, scorer_leak_recheck_passed=true, verifier_is_oracle=false) -> the DiffusionGemma gate is MET; the FIRST E3 ARC solves landed (ar25 L1 exp4339, sc25 L1 exp4341); ARC now 21 reproducible levels / 13 games; cross-game value transfer NULLED a 3rd time (exp4342) and RETIRED; paper_ready=True (FoVer 0.9131, G1-G4). .402 is DEPTH on the diagnosed forward question (north-star §1/§5): a proven moat is a MEASUREMENT; the win condition is UTILITY. (A) HEADLINE -- does putting the leak-robust scorer INSIDE the denoising loop (S3 stratified verifier-guided search) produce a better generation at FIXED compute vs best-of-K/unguided/self-reward-SMC? -> the moat graduates from 'exists' to 'useful' (Pareto-improves generation). (B) ARC NORTH STAR (operator MANDATORY 2026-06-17) -- E3 ka59 (closest still-partial), DEEPER on the cracked games (sc25 L2+ = +4 upside, ar25 L2, tn36 L7), tr87+ft09 breadth. (C) SELF-LEARNING -- learned A* ACTION-COST heuristic (north-star efficiency axis); cross-game value-transfer is RETIRED, do NOT re-attempt."
milestone_doc: openspec/change-proposals/research-roadmap-v402.md
milestone_overview: |
  .401 produced the project's FIRST leak-robust, replicated, oracle-distinct verifier-moat win (the DiffusionGemma
  gate, STILL-PENDING since 2026-06-13, is MET) AND the first two E3 ARC solves (ar25 L1, sc25 L1). .402 takes the
  natural next DEPTH step on each (north-star Depth-Over-Breadth):

    PHASE 0 -- TRANSITION: exp4347 archive .401 -> activate .402; record the TRUE .401 close-state.

    PHASE A -- HEADLINE (convert the proven moat into a generation GAIN):
      A1 (exp4348) S3 stratified verifier-guided denoising SEARCH (arXiv:2604.06260): put the .401 leak-robust scorer
        (exp4337 .pkl) INSIDE DiffusionGemma's denoising loop -- expand candidate partial states per step, score them
        oracle-distinctly, resample the promising ones preserving diversity. At FIXED NFE, does it beat best-of-K@NFE
        (compute-matched) + unguided + self-reward-SMC (intrinsic, the oracle-distinct must-beat)? Emit
        s3_guided_beats_control BARE bool. verifier_is_oracle=false. The moat graduates from 'exists' to 'useful'.
      A2 (exp4349, GATED on A1 s3_guided_beats_control==true) PAPO reward-state-alignment DIAGNOSTIC (arXiv:2606.08501):
        skeptic-proof the gain -- is it from rewards aligned to AUTHENTIC denoising states (not remasking/position
        artifacts)? The operator was twice-burned on DiffusionGemma; a gain that fails alignment is quarantined.

    PHASE B -- ARC NORTH STAR (operator MANDATORY 2026-06-17; incremental-progress, +1..+n per game):
      B1 (exp4350) E3 ka59 -> L1 (closest still-partial deep tail, 0.56) via explore-verify-plan.
      B2 (exp4351) E3 DEEPER on the cracked games: sc25 L2+ (reproduce the 5 live-recorded levels, +4 upside) +
        ar25 L2 + tn36 L7.
      B3 (exp4352) E3 tr87 + ft09 looped, +1 each (breadth).

    PHASE C -- CONTINUOUS SELF-LEARNING (mandated; PIVOT to the working+compounding mechanism):
      exp4353 a learned A* ACTION-COST heuristic trained on the 21 solved-level traces -> ACTION-MINIMAL plans (north-star
        EFFICIENCY axis: fewer env actions per solve / lower RHAE). Cross-game value-transfer is RETIRED (3 powered nulls
        exp4318/4331/4342, manifest) -- do NOT re-attempt it. verifier_is_oracle=false.

    PHASE E -- INFRA + HYGIENE + CAPSTONE: exp4354 SOTA-ingestion -> .403; exp4355 registry/gaps hygiene + GAP-4
      regression guard + fix the .401 capstone verifier_is_oracle stamp; exp4356 hardware continuity (KV260 opportunistic);
      exp4357 capstone .402 + the headline decision (did S3 convert the moat?) + ARC reproducible-total + G1-G4.

  HARD RULE (every task): the conductor stays STOOD-DOWN on TRM training -- NO task may launch TRM training, run
  pkill/kill against train.py, or WRITE results/trm_runs/. Qwen is FORBIDDEN as the TRAINED base (Spurious-Rewards
  confound); Qwen/Gemma GGUF as an off-policy JUDGE/GENERATOR is fine. SEPO + A2D2 (verifier-as-reward GENERATOR
  training, 2502.01384 / 2606.13565) are OUT-OF-BAND/operator-owned -- flagged in SOTA-ingestion, NOT auto-run in-loop;
  the S3 headline is a NO-TRAINING test-time search. Every LEARNED-verifier value task MUST declare verifier_is_oracle
  honestly (Circularity Discipline): an EXECUTABLE-oracle win (E3 solve) is execution_grounded (verifier_is_oracle=true,
  ARC progress, NOT a moat headline); the moat is the oracle-DISTINCT learned result with a matched control + CI95-excl-0.
  NO autonomous edits to docs/index.html / README / paper prose. Online ARC play stays operator-gated (NO leaderboard
  submission; only offline-reproduced levels count). DiffusionGemma MUST use the llama.cpp PR binary, NOT a standard GGUF
  loader (known-issues 2026-06-15). The cross-domain SELECTION scope (exp4314) and cross-game value TRANSFER (exp4342)
  are RETIRED -- do NOT re-propose either.

