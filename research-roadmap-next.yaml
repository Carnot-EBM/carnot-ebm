        retire_if_same_verdict: true
      - experiment_id: exp5249-cross-model-typed-memory-v480
        verdict: "blocked_llama_cpp_gpu_offload: cross-model typed memory usefulness was not measured."
        addressed_by: "This task is a deterministic memory-policy audit that remains executable even if live SOTA LLM inference is blocked."
        retire_if_same_verdict: true
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 45
    prompt: |
      CONTEXT:
      Repo at {project_root}, run on or after {date}. The research program requires continuous self-learning, and the V481 literature update highlights modular memory and memory-level stability-plasticity. This task must be runnable without live LLM inference so the milestone still advances self-learning if SOTA GGUF runtime remains blocked.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - CODEX.md
      - research-program.md
      - typed-memory, verifier-memory, rollback, or self-learning modules/tests currently in the repo
      - results/experiment_5239_controlled_self_learning_memory_v479.json
      - results/experiment_5249_cross_model_typed_memory_v480.json if present
      - research-references.md V481 memory section
      - ops/exclusion_manifest.yaml

      TASK:
      Audit typed verifier memory for retention, interference, promotion, eviction, and rollback safety using deterministic fixtures and cached artifacts. The output should define whether the current memory policy is safe enough to support future continuous self-learning experiments.

      CONCRETE STEPS:
      1. Identify the current typed-memory schema and write down the invariants it claims to preserve.
      2. Build or reuse deterministic fixtures that cover aligned memory, irrelevant memory, conflicting memory, stale memory, and shuffled memory.
      3. Measure retention of useful memories after distractor insertion, interference on unrelated tasks, eviction of stale/conflicting entries, promotion thresholds, and rollback after harmful memory.
      4. Do not call an LLM unless a cached fixture explicitly records prior outputs; label the run cached_fixture_replay_no_llm.
      5. Add focused tests for any memory-policy helper changed by the audit.
      6. Update ops/status.md and ops/changelog.md only if the memory policy becomes durable ready/blocked/retired.
      7. Write results/experiment_5261_typed_memory_interference_audit_v481.json with REQUIRED ARTIFACT FIELDS:
         - honest_verdict: object with value/principle; value must start with complete: or blocked_ and state whether the memory policy is ready, blocked, harmful, or needs redesign.
         - inference_substrate: object with value/principle; use cached_fixture_replay_no_llm.
         - memory_policy_ready: bare bool plus memory_policy_ready_principle string.
         - retention_rate: object with numeric value/principle.
         - interference_rate: object with numeric value/principle.
         - harmful_memory_rollback_passed: object with bool value/principle.
         - promotion_eviction_policy: object with value/principle.
         - fixture_checksums: object with value/principle.
         - tests_run: list with command/outcome.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

