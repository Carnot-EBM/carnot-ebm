- id: exp949-spilled-energy-tier0
  milestone: 2026.04.73
  deliverable: results/experiment_949_spilled_energy_tier0.json
  max_turns: 30
  prior_failures:
    - experiment_id: exp433-spilled-energy-detector
      verdict: not_run
      addressed_by: "Exp 433 added a SpilledEnergyDetector module to ThreeTierPipeline as Tier 0 pre-filter, but the result JSON was never written (RETRO-027: silent experiment drop). The module existence is uncertain. This experiment implements the TRAINING-FREE variant from arXiv 2602.18671 which uses chain-rule probability spill from logits — different from any prior detector module. No model training required."
      retire_if_same_verdict: false
    - experiment_id: exp787-s-star-energy-prefilter
      verdict: energy_prefilter_efficient
      addressed_by: "Exp 787 was S* energy pre-ranking for code candidate selection — used a trained scoring model to rank candidates. Different task: this experiment computes energy spill directly from LLM logits (training-free), not from a trained energy model. Spilled energy = sum of token log-probs that exceed the marginal chain-rule expectation."
      retire_if_same_verdict: false
  title: 'Exp 949: Spilled Energy Tier 0 — Training-Free Hallucination Detection via Logit Spill (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2602.18671 ("Spilled Energy in Large Language Models") proposes a training-free
    hallucination detector that works directly from LLM logits. Key insight: when an LLM generates
    a hallucination, it places probability mass on tokens beyond what the chain rule of probability
    would justify given the context. This "spilled energy" is computed as:
    spill(t) = max(0, log_prob(token_t | context) - expected_log_prob_from_context)
    High spill → likely hallucination. No training required — just a forward pass through the LLM.
    The paper reports good generalization across tasks and LLMs.

    For Carnot: use as a fast Tier 0 pre-filter. If spilled energy exceeds threshold, route to
    full Ising verification. If spilled energy is low, skip verification (fast path). This
    complements the ThinkProbe (Exp 444) which uses a generative LLM call — spilled energy
    uses only the existing logits from the generation step (zero additional cost).

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/think_probe.py — ThinkProbe (generative fast-path, Exp 444)
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline for Tier 0 integration
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Implement SpilledEnergyDetector (training-free). Measure AUROC on synthetic corpus
    with mock logits. Target: AUROC > 0.60 (low bar — this is a zero-training baseline).

    CONCRETE STEPS:
    1. Read CLAUDE.md.
    2. Write python/carnot/pipeline/spilled_energy_detector.py:
       a. Class SpilledEnergyDetector:
          - compute_spill(log_probs: list[float], context_entropy: float) -> float
            * For each token: spill_t = max(0, log_prob_t - (-context_entropy))
              (context_entropy approximates the expected log prob from context)
            * Total spill = sum(spill_t) / len(log_probs)
          - flag_response(spill_score: float, threshold: float = 0.5) -> bool
            * Returns True if should run full Ising verification
          - benchmark(responses_with_logits, labels) -> SpilledEnergyResult
            * Computes spill for each response, AUROC, optimal_threshold
       b. SpilledEnergyResult: auroc, optimal_threshold, skip_rate (fraction below threshold),
          fn_rate (fraction of errors missed by skip), honest_verdict.
       c. Add spec entries: REQ-PROBE-011 (SpilledEnergyDetector training-free Tier 0),
          SCENARIO-PROBE-016 (spill detection on correct vs hallucinated responses).
    3. Write scripts/experiment_949_spilled_energy_tier0.py:
       a. ExperimentTemplate(949, ...) — CPU, no GPU.
       b. Generate synthetic corpus of 200 responses with mock logits:
          Correct responses: smooth log_probs, mean -2.0, std 0.5 (consistent with context)
          Hallucinated responses: spiky log_probs with occasional high-prob tokens that
          contradict context (mean -1.5, std 2.0, with some values near 0)
       c. Compute spilled energy for all 200 responses.
       d. Evaluate AUROC (correct vs hallucinated), optimal threshold.
       e. honest_verdict:
