        addressed_by: "Candidate output is now a small executable policy DSL guarded by an independent exact contract and verified fallback. No natural-language ConstraintIR repair loop is reused."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6326 must first prove the restricted DSL, exact factor energy, and verified fallback. This task asks whether bounded exact-energy candidate search improves held task utility. SEVerA motivates contracts, rejection, and fallback. The exact guard is an oracle. The model produces candidates. It never supplies labels or final safety authority.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py cached_sota_pair() guidance
      - {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/research-references.md V545 SEVerA entry
      - {project_root}/results/experiment_6326_restricted_policy_contract_compiler.json
      - {project_root}/python/carnot/experiment_6274_asp_energy_semantic_compiler.py
      - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
      - {project_root}/ops/e2e-test-plan.md

      TASK
      Generate restricted policy programs with the three mandatory local GGUF models. MODEL_SPECS must come from cached_sota_pair(gpu_indices=(0, 1)) and include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Use the canonical llama.cpp path and each GGUF embedded tokenizer. Do not use AutoTokenizer. Legacy tiny models may run CPU smoke tests only. Compare four matched arms: one raw candidate, reject-only filtering, exact guard plus hash-pinned fallback, and bounded exact-factor-energy-guided candidate search plus fallback. Freeze calls, tokens, candidates, time, and fallback accounting. Report each model and contract family separately.

