- id: exp726-jepa-reasoner-probe
  milestone: 2026.04.55
  deliverable: results/experiment_726_jepa_reasoner_probe.json
  title: 'Exp 726: JEPAReasonerProbe — Pre-generative Latent Verification (arXiv 2512.19171)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2512.19171 "JEPA-Reasoner" shows that LLM hidden states at question-end
    (the token just before generation begins) contain predictive signal about whether the
    coming generation will satisfy constraints. Specifically, layer 16 hidden states in
    Qwen3.5-0.8B encode "willingness to follow constraint" as a linear subspace.

    This enables a radically cheaper verification path: instead of generating full steps
    and evaluating them (current JEPA approach), we extract the question-end hidden state
    BEFORE generation and run a lightweight 2-layer MLP probe (~1ms latency) to predict
    whether the generation will violate constraints.

    If AUC >= 0.75 and latency < 1ms: propose as Tier 2.1 (latency-optimized JEPA alternative).
    This path is independent of JEPA v18 (Exp 717) — even if v18 fails, Tier 2.1 could work.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_v18_lambdarank.py (from Exp 717) — hidden state extraction.
    - results/experiment_717_jepa_v18_lambdarank.json — v18 architecture details.
    - results/fover_v2_labeled.json (or equivalent) — FoVer v2 labeled pairs.
    - scripts/experiment_template.py — ExperimentTemplate with BatchedInferenceRunner.

    TASK: Extract question-end hidden states from Qwen3.5-0.8B (layer 16), train 2-layer
    MLP probe on FoVer v2, evaluate OOD AUC and inference latency.

    CONCRETE STEPS:
    1. Add REQ-VER-033 (JEPAReasonerProbe MUST extract hidden states at the question-end
       token BEFORE generation begins to enable pre-generative verification),
       REQ-VER-034 (JEPAReasonerProbe inference latency MUST be < 1ms excluding LLM
       forward pass, measured on CPU with MLP probe only),
       SCENARIO-VER-040/041 to openspec/capabilities/verification/spec.md.
    2. Implement python/carnot/samplers/jepa_reasoner_probe.py:
       a. Class JEPAReasonerProbe.
       b. hidden_state_extractor: run Qwen3.5-0.8B forward pass on question text only
          (no generation), extract layer 16 hidden state at last token position.
          Shape: (hidden_dim,) = (1024,) for Qwen3.5-0.8B.
       c. probe: nn.Linear(1024, 256) → ReLU → nn.Linear(256, 1) → sigmoid.
          Binary prediction: P(constraint_violation | question_hidden_state).
       d. Training: BCELoss, Adam lr=1e-3, 50 epochs on FoVer v2 pairs.
          Label: 1 if any step in question violates constraint, 0 otherwise.
       e. Latency: time probe.forward() only (not extraction) — must be < 1ms CPU.
    3. Create scripts/experiment_726_jepa_reasoner_probe.py:
       a. ExperimentTemplate(726, requires_gpu=True) + ExperimentTimeoutWatchdog.
       b. Extract hidden states for all FoVer v2 questions (GPU, batch=32).
       c. Train probe on extracted states (CPU after extraction).
       d. Evaluate OOD AUC on GSM8K 500-699.
       e. Measure probe inference latency (CPU, 1000 forward passes, p50/p99).
       f. honest_verdict:
          - "probe_tier21_candidate" if ood_auc >= 0.75 AND latency_p99_ms < 1.0
          - "probe_auc_pass_latency_fail" if ood_auc >= 0.75 AND latency_p99_ms >= 1.0
          - "probe_below_threshold" if ood_auc < 0.75
       g. If honest_verdict == "probe_tier21_candidate": write Tier 2.1 proposal to
          openspec/change-proposals/tier21-jepa-reasoner-probe.md.
       h. artifact: ood_auc, latency_p50_ms, latency_p99_ms, hidden_dim, probe_params,
          honest_verdict.
    4. Write tests/python/test_experiment_726_jepa_reasoner_probe.py with 100% coverage:
       - test hidden state shape is (hidden_dim,) at question-end token.
       - test probe latency < 1ms on CPU for single forward pass.
       - test Tier 2.1 proposal written when gate conditions met.
       Each test traces to REQ-VER-033/034.
    5. Reconcile ops/status.md and ops/changelog.md.
    6. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0 (hidden state extraction only).
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp727-vargran-gate
  milestone: 2026.04.55
  deliverable: results/experiment_727_vargran_gate.json
  title: 'Exp 727: Variable Granularity Verification Gate (arXiv 2505.11730, Ising skip rate)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2505.11730 "Variable Granularity Search" shows that applying verification
    at variable granularity — skip expensive checks when cheap tiers are highly confident —
    achieves near-identical accuracy at 40-60% lower compute. Tier 3 Ising sampling is the
    most expensive tier in the Carnot cascade. If EORM (Tier 0h) confidence > 0.92, Ising
    sampling is likely redundant — the cheap tier already made the right call.

    EORM (Efficiency-Optimized Ranking Model, Tier 0h) outputs a confidence score 0-1.
    Values near 1.0 mean EORM is highly confident the generation is correct. At these
    scores, running Tier 3 Ising adds latency without changing the verdict.

    EXISTING CODE TO READ FIRST:
    - python/carnot/inference/eorm_model.py — EORMModel with confidence output.
    - python/carnot/cascade/tier3_ising.py — Tier 3 Ising sampler.
    - python/carnot/cascade/cascade_router.py — cascade routing logic.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Implement EORM confidence gate before Tier 3 Ising. Measure skip rate and FN delta.

    CONCRETE STEPS:
    1. Add REQ-INFRA-044 (cascade router MUST support EORM confidence gate to skip Tier 3
       Ising when confidence > configurable threshold, default 0.92),
       REQ-INFRA-045 (EORM gate false-negative delta MUST be < 5% vs full cascade),
       SCENARIO-INFRA-053/054 to openspec/capabilities/pipeline/spec.md.
    2. Update python/carnot/cascade/cascade_router.py:
       a. Add eorm_ising_skip_threshold: float = 0.92 (configurable).
       b. Before routing to Tier 3 Ising: check if eorm_confidence > skip_threshold.
       c. If above threshold: mark result as "verified_fast" (skip Ising).
       d. If below threshold: run Tier 3 Ising as normal.
       e. Log: ising_skip (bool), eorm_confidence (float) per query.
    3. Create scripts/experiment_727_vargran_gate.py:
       a. ExperimentTemplate(727) + ExperimentTimeoutWatchdog(727, timeout_minutes=45).
       b. Run 200q test set through cascade.
          - Condition A: full cascade (no gate, baseline).
          - Condition B: EORM gate at threshold=0.92.
       c. Measure:
          - ising_skip_rate = fraction of queries where Ising was skipped.
          - fn_delta = false_negative_rate_B - false_negative_rate_A.
          - latency_reduction_pct = (latency_A - latency_B) / latency_A * 100.
       d. honest_verdict:
          - "vargran_gate_success" if ising_skip_rate > 0.50 AND fn_delta < 0.05
          - "vargran_gate_too_conservative" if ising_skip_rate <= 0.50
          - "vargran_gate_fn_too_high" if fn_delta >= 0.05
       e. artifact: ising_skip_rate, fn_delta, latency_reduction_pct, threshold_used,
          honest_verdict.
    4. Write tests/python/test_experiment_727_vargran_gate.py with 100% coverage:
       - test gate skips Ising when EORM confidence > 0.92.
       - test gate does NOT skip Ising when EORM confidence <= 0.92.
       - test fn_delta computed correctly vs full cascade baseline.
       Each test traces to REQ-INFRA-044/045.
    5. Reconcile ops/status.md and ops/changelog.md.
    6. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

