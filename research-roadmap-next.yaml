    estimated_wall_time_min: 10
    track: validation
    inference_substrate: synthetic
    requires_gpu: false
    deliverable: "results/experiment_3367_fix_gate_status.json"
    prompt: |
      CONTEXT: exp3355 and exp3357 failed downstream gates because they emitted status="complete" or omitted status entirely, whereas "success" was expected.
      TASK: Refactor those modules and their outputs to conform to strict gate status contracts.
      CONCRETE STEPS:
        1. Update `experiment_3355_vgb_repair_ladder.py` and `experiment_3357_fr11_logicvault.py`.
        2. Rerun both to overwrite artifacts.
        3. Assert "status": "success".
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3367_fix_gate_status.py.

