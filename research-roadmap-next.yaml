tasks:
- id: exp7159-v631-exact-contract-preflight
  title: V631 exact Markdown and YAML task-contract preflight
  track: infrastructure
  priority: critical
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 45
  per_unit_rows: true
  milestone: 2026.09.631
  deliverable: results/experiment_7159_v631_contract_preflight.json
  prior_failures:
    - experiment_id: exp7156-v630-exact-contract-preflight
      verdict: complete_disqualified_v630_markdown_yaml_contract_mismatch
      addressed_by: "V631 replaces the stale design with one exact 14-row contract, parses Markdown and active YAML independently, and leaves independent science ungated by this advisory check."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Milestone 2026.09.630 finished with three executable tasks while the stale
    design document still described fourteen V629 tasks. Exp7156 correctly
    disqualified that mismatch. V631 defines exactly fourteen tasks, exp7159
    through exp7172, in both this YAML and the new design document. The active
    execution authority is research-roadmap.yaml after activation.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7156_v630_contract_preflight.json
    - {project_root}/python/carnot/experiment_7156_v630_contract_preflight.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/validate_prior_failures.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_fit_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and run an independent Markdown-versus-active-YAML contract check for
    V631. Check exact count, order, full IDs, titles, deliverables, structured
    gates, producer fields, prior-failure entries, routing, model declarations,
    progress contracts, substrate classes, and prompt tails. Do not activate or
    rewrite a roadmap.

    CONCRETE STEPS:
    0. Print and flush a phase-start line. Create the schema-complete artifact
       before checks. Check the active YAML, design, schema, lint, spec, test,
       and output paths. On a missing input, finish once as blocked with
       inference_substrate_class=blocked_no_run and an exact
       gate_check_summary. Never leave status=running.
    1. At every numbered phase boundary, print a flushed progress line. Print
       flushed start and end lines immediately before and after every model
       load, generation, benchmark, or subprocess that can take minutes. Print
       a flushed heartbeat at least every 300 seconds inside long loops. Keep
       every stdout gap below 600 seconds.
    2. Add REQ-REPORT-7159 and focused RED tests before implementation. Test an
       omitted task, reordered ID, changed title, changed deliverable, malformed
       gate, missing producer field, missing progress clause, old model, and
       wrong prompt tail. Print and flush before and after each test subprocess.
    3. Parse the Markdown Exact task contract table and active
       research-roadmap.yaml separately. Never derive both views from one
       constant, fixture, parser result, or object.
    4. Require milestone 2026.09.631 and exactly fourteen full IDs in order,
       from exp7159-v631-exact-contract-preflight through
       exp7172-v631-independent-capstone.
    5. Compare exact titles, deliverables, task order, routes, substrate
       classes, and every structured gate. Normalize Markdown gate expressions
       to full IDs before comparison.
    6. For each gate, require an earlier producer in this roadmap and the exact
       bare top-level field in that producer's REQUIRED ARTIFACT FIELDS. Check
       all four prior_failures fields, operator overrides, per_unit_rows,
       verdict_class, MODEL_SPECS, and gate_check_summary.
    7. Check every prompt for CONTEXT, EXISTING CODE TO READ FIRST, TASK,
       CONCRETE STEPS, both placeholders, numbered flushed progress, periodic
       long-loop heartbeats, a run command, and the exact final prohibition.
    8. Print and flush before and after roadmap schema, prior-failure, gate,
       exclusion-manifest, harness-fit, artifact, adversarial,
       row-consistency, scoped spec-coverage, and root-clutter subprocesses.
       Record each command, elapsed time, and exit code.
    9. Set v631_task_contract_conforms_score=1 only if all fourteen independent
       rows agree. A readable mismatch is disqualified. A missing input is
       blocked. Neither outcome is partial. Print and flush before and after the
       final artifact-validation and write boundaries.
    10. REQUIRED ARTIFACT FIELDS:
       - field_principles: principle: "Each required field explains the evidence it protects."
       - status: principle: "A terminal lifecycle value prevents bootstrap artifacts from passing."
       - preconditions_checked: principle: "Named file and tool checks distinguish missing inputs from contract mismatches."
       - run_date: principle: "The date binds the receipt to the V631 files actually active."
       - inference_substrate: principle: "Use aggregation_from_active_contract for two independently parsed documents."
       - inference_substrate_class: principle: "Use aggregation, or blocked_no_run before comparison, so the duration floor matches the work."
       - execution_venue: principle: "Host records prevent model or board attribution."
       - duration_s: principle: "Measured wall time exposes truncated or fabricated checking."
       - source_artifact_hashes: principle: "Hashes bind the result to exact Markdown, YAML, schemas, and lints."
       - rows: principle: "One row per task and contract dimension makes every headline reconstructable."
       - markdown_task_rows: principle: "Independent Markdown rows expose a stale or aspirational design."
       - yaml_task_rows: principle: "Independent active-YAML rows expose truncation at activation."
       - task_contract_rows: principle: "Per-task comparisons preserve ID, title, deliverable, and order differences."
       - gate_contract_rows: principle: "Gate rows preserve upstream, field, operator, and value parity."
       - model_compliance_rows: principle: "Model rows require Qwen3.8 only on LLM-bearing tasks and reject superseded mandates."
       - progress_contract_rows: principle: "Progress rows verify that no prompt permits a 600-second silent gap."
       - expected_task_count: principle: "The literal value 14 is the load-bearing task-count contract."
       - observed_task_count: principle: "The independently observed count catches missing execution tasks."
       - expected_id_order: principle: "The full ordered IDs prevent partial roadmap activation."
       - observed_id_order: principle: "The active order makes drift visible."
       - v631_task_contract_conforms_score: principle: "One means all fourteen rows match; it makes no science claim."
       - random_seed: principle: "A fixed seed makes mutation ordering reproducible."
       - reproducibility_checksum: principle: "The checksum detects silent contract-input drift."
       - gate_check_summary: principle: "A blocked or disqualified verdict names the failed check and expected and observed values."
       - verifier_is_oracle: principle: "False records that this task checks contracts, not its own scientific correctness."
       - verdict_class: principle: "Use the closed enum positive | circular_positive | null | blocked | disqualified | partial for structural aggregation."
       - honest_verdict: principle: "Free text preserves the terminal reason while agreeing with verdict_class."

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7159_v631_contract_preflight.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7160-qwen38-lease-orphan-diagnosis
  title: Read-only Qwen3.8 lease and orphan-process diagnosis
  track: infrastructure
  priority: critical
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 30
  per_unit_rows: true
  milestone: 2026.09.631
  deliverable: results/experiment_7160_v631_qwen38_lease_diagnosis.json
  prior_failures:
    - experiment_id: exp7157-v630-qwen38-registry-runtime
      verdict: blocked_idle_rtx_3090
      addressed_by: "V631 separates a read-only PID, lease, age, ownership, cache, and runner diagnosis from model load; it neither waits for nor kills the known orphan and emits the same terminal block if operator state is unchanged."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7157 found the mandated Qwen3.8 Q4_K_M file but stopped because process
    233772, an orphaned llama-server, held about 11 GiB on each RTX 3090. The
    stop-authority marker was absent. The model experiment correctly refused to
    kill an unrelated process. V631 needs one short diagnosis before another
    load attempt. This task does not load or generate with an LLM.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/ops/known-issues.md
    - {project_root}/results/experiment_7157_v630_qwen38_runtime.json
    - {project_root}/python/carnot/experiment_7157_v630_qwen38_runtime.py
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/inference/llama_server_supervisor.py
    - {project_root}/scripts/gpu_monitor.py
    - {project_root}/ops/gpu_memory_state.json
    - {project_root}/openspec/capabilities/research-harnesses/spec.md

    TASK:
    Build and run a read-only Qwen3.8 runtime preflight. Resolve the exact cache
    and runner, inspect every GPU compute PID and lease receipt, classify the
    known server as owned, adoptable, or conflicting from evidence, and report
    whether a named RTX 3090 allocation is honestly available. Do not signal,
    stop, adopt, or start any process.

    CONCRETE STEPS:
    0. Print and flush a phase-start line. Create a schema-complete artifact.
       Check nvidia-smi, procfs, lease directories, cache resolver, CUDA runner,
       tests, spec, and output path. A missing diagnostic dependency finishes as
       blocked_no_run with an exact gate_check_summary.
    1. At every numbered phase boundary, print a flushed progress line. Print
       flushed start and end lines immediately before and after every model
       load, generation, benchmark, or subprocess that can take minutes. Print
       a flushed heartbeat at least every 300 seconds inside long loops. Keep
       every stdout gap below 600 seconds.
    2. Add REQ-HARNESS-7160 and focused RED tests for an idle GPU, an owned
       task lease, an unowned old server, a stale lease, a missing proc entry,
       and a missing cache. Prove with a mutation that deleting PID ownership
       evidence changes readiness. Print and flush around test subprocesses.
    3. Resolve only unsloth/Qwen3.8-27B-GGUF and
       Qwen3.8-27B-Q4_K_M.gguf through the canonical cache helper. Record
       revision, bytes, and sha256 metadata without opening model weights.
    4. Print and flush before and after each read-only nvidia-smi or procfs
       subprocess. Record GPU UUID, utilization, free and used memory, PID,
       parent PID, session, process start time, age, exact command, open port,
       lease ID, lease owner, and stop-authority state. Redact environment and
       secrets. Do not use ps e or dump process environments.
    5. Classify each compute process from recorded ownership evidence. A process
       is adoptable only when a current canonical lease names its exact PID,
       port, model hash, owner, and liveness. An old or unowned server is a
       conflict. Never infer ownership from the executable name alone.
    6. Check the CUDA llama.cpp or llama-server binary and its version/help
       without model load. Record whether task-owned process groups, bounded
       token generation, grammar/JSON output, and teardown can be requested.
    7. Set qwen38_runtime_preflight_ready_score=1 only if the exact cache and
       CUDA runner are valid and an identified RTX 3090 allocation is idle with
       no conflicting process. If the exp7157 condition remains, use the exact
       honest_verdict blocked_idle_rtx_3090, verdict_class=blocked, and name the
       observed PIDs and memory in gate_check_summary. Do not use partial.
    8. Print and flush before and after all focused tests, artifact validation,
       adversarial verification, row-consistency, scoped spec-coverage, and
       root-clutter subprocesses. Print and flush before and after the final
       artifact write.
    9. REQUIRED ARTIFACT FIELDS:
       - field_principles: principle: "Field reasons distinguish a real ownership receipt from a process-name guess."
       - status: principle: "A terminal value prevents repeated waiting on unchanged external state."
       - preconditions_checked: principle: "Named local tools and files make a diagnostic block actionable."
       - run_date: principle: "The date fixes the process and lease snapshot in time."
       - inference_substrate: principle: "Use read_only_gpu_process_and_cache_diagnosis because no model weights are opened."
       - inference_substrate_class: principle: "Use no_model_load, or blocked_no_run when even diagnosis cannot run, so no model-duration floor is implied."
       - execution_venue: principle: "Host plus GPU inventory identifies where the read-only checks ran."
       - duration_s: principle: "Measured duration proves the diagnostic ran rather than copying exp7157 prose."
       - source_artifact_hashes: principle: "Hashes bind the diagnosis to exp7157, registry, supervisor, and specs."
       - rows: principle: "One row per GPU, process, lease, cache item, and runner check makes readiness reconstructable."
       - gpu_process_rows: principle: "Per-process PID, age, command, GPU UUID, and memory expose the exact conflict."
       - lease_ownership_rows: principle: "Lease-to-PID evidence prevents unsafe adoption or teardown."
       - cache_identity_rows: principle: "Repository, filename, revision, bytes, and hash prevent model substitution."
       - runner_capability_rows: principle: "Runner checks show whether bounded structured generation is available without loading weights."
       - stop_authority_receipt: principle: "The marker state explains why the task did not clear an orphan."
       - qwen38_runtime_preflight_ready_score: principle: "One gates model load; zero is an honest external block, not a quality result."
       - random_seed: principle: "A fixed row-order seed makes tests reproducible even though diagnosis is deterministic."
       - reproducibility_checksum: principle: "The checksum detects altered process, lease, cache, or runner evidence."
       - gate_check_summary: principle: "A blocked result names the first failed check with expected and observed values."
       - verifier_is_oracle: principle: "False records that this task checks resources, not model correctness."
       - verdict_class: principle: "Use the closed enum positive | circular_positive | null | blocked | disqualified | partial for structural aggregation."
       - honest_verdict: principle: "The terminal text reports ready or the exact stable resource block."

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7160_v631_qwen38_lease_diagnosis.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7161-qwen38-bounded-structured-canary
  title: Bounded Qwen3.8 structured-output runtime canary
  track: infrastructure
  priority: critical
  model: opus
  requires_gpu: true
  max_turns: 100
  estimated_wall_time_min: 45
  per_unit_rows: true
  milestone: 2026.09.631
  deliverable: results/experiment_7161_v631_qwen38_structured_canary.json
  gated_on:
    - upstream: exp7160-qwen38-lease-orphan-diagnosis
      artifact_field: qwen38_runtime_preflight_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp7153-grounding-runtime-postfix-qualification
      verdict: positive_grounding_runtime_ready_no_verifier_value_claim
      addressed_by: "V631 declares the honest canary as model_bounded_generation with a 10-second floor instead of exp7153's false full-generation class."
      retire_if_same_verdict: true
    - experiment_id: exp7157-v630-qwen38-registry-runtime
      verdict: blocked_idle_rtx_3090
      addressed_by: "V631 runs only after exp7160 emits an exact ready field and then uses one task-owned process group, one fixed small generation, and verified teardown."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The current SOTA mandate and ARC generator both pin
    unsloth/Qwen3.8-27B-GGUF. Exp7153 produced an honest 26-second canary but
    was quarantined because it declared model_full_generation. Exp7157 then
    blocked before load on an occupied-GPU precondition. Exp7160 now supplies
    the exact same-roadmap readiness field. This task is a small canary, not a
    scientific generation run.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_7153_v629_grounding_runtime.json
    - {project_root}/results/experiment_7157_v630_qwen38_runtime.json
    - {project_root}/results/experiment_7160_v631_qwen38_lease_diagnosis.json
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/inference/llama_server_supervisor.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/openspec/capabilities/verification/spec.md
    - {project_root}/openspec/capabilities/research-harnesses/spec.md

    TASK:
    Produce one honest bounded structured-output receipt from the exact cached
    Qwen3.8 Q4_K_M model. Require a schema-valid JSON entity/relation record,
    record model and GPU identity, and prove teardown of only the task-owned
    process. Make no accuracy, energy, or verifier-value claim.

    CONCRETE STEPS:
    0. Print and flush a phase-start line. Create the schema-complete artifact.
       Recheck the gated readiness artifact, exact model cache, CUDA runner,
       selected GPU allocation, writable raw directory, tests, spec, and output
       path. Download nothing. A new stable failure finishes blocked with
       blocked_no_run and gate_check_summary; never substitute a small model.
    1. At every numbered phase boundary, print a flushed progress line. Print
       flushed start and end lines immediately before and after every model
       load, generation, benchmark, or subprocess that can take minutes. Print
       a flushed heartbeat at least every 300 seconds inside server waits and
       long loops. Keep every stdout gap below 600 seconds.
    2. Add REQ-VERIFY-7161 and focused RED tests for exact model identity,
       bounded token count, JSON parsing, task-owned lease, duration class,
       CUDA markers, and teardown. Mutate the model ID and substrate class and
       prove both mutations fail. Print and flush around test subprocesses.
    3. Set MODEL_SPECS to exactly one entry: hf_id
       unsloth/Qwen3.8-27B-GGUF, filename Qwen3.8-27B-Q4_K_M.gguf,
       quantization Q4_K_M, role headline_bounded_canary. Resolve it through
       the canonical cache helper. Use the embedded GGUF tokenizer and chat
       template. Do not call AutoTokenizer on the GGUF repository.
    4. Start a task-owned server or llama_cpp process group in try/finally on a
       task-owned port or allocation. Print and flush immediately before and
       after model load. Record sha256, binary/version, load command, CUDA
       offload markers, PID/process-group ownership, load time, and task-owned
       VRAM delta.
    5. Print and flush immediately before and after one deterministic canary
       generation with at most 48 new tokens. Ask for one JSON object with
       subject, relation, object, polarity, and supported fields. Preserve the
       prompt hash, raw bytes, parsed object, token counts, latency, and logs.
    6. Reject an empty, malformed, prose-wrapped, or schema-invalid response.
       Token log-probabilities may be recorded as transport telemetry if the
       runner returns them, but they are not a Spilled Energy result and do not
       affect readiness.
    7. In finally, print and flush before and after teardown. Stop only the
       task-owned process group. Prove its PID and VRAM allocation were
       released. Do not stop, signal, or adopt any unrelated process.
    8. Set qwen38_structured_canary_ready_score=1 only when exact identity,
       real bounded generation, schema validity, CUDA execution, honest
       duration, and teardown all pass. Use
       inference_substrate_class=model_bounded_generation, not full generation.
    9. Print and flush before and after focused tests, artifact validation,
       adversarial verification, row-consistency, scoped spec-coverage, and
       root-clutter subprocesses. Print and flush before and after the final
       artifact write.
    10. REQUIRED ARTIFACT FIELDS:
       - field_principles: principle: "Field reasons separate model transport from scientific value."
       - status: principle: "A terminal value prevents another abandoned live-model artifact."
       - preconditions_checked: principle: "Named readiness, cache, runner, GPU, and output checks prevent fallback execution."
       - run_date: principle: "The date binds the canary to the active Qwen3.8 mandate."
       - inference_substrate: principle: "Use live_qwen38_bounded_structured_generation for the real fixed-budget canary."
       - inference_substrate_class: principle: "Use model_bounded_generation, or blocked_no_run before invocation, because at most 48 tokens are generated."
       - execution_venue: principle: "Host and GPU UUIDs identify the local execution path."
       - duration_s: principle: "Measured wall time must satisfy the 10-second bounded-generation floor, not the 60-second full-run floor."
       - source_artifact_hashes: principle: "Hashes bind the canary to readiness, registry, runner, and specs."
       - rows: principle: "Load, generation, parse, telemetry, and teardown rows make readiness reconstructable."
       - MODEL_SPECS: principle: "The sole entry must name unsloth/Qwen3.8-27B-GGUF and Qwen3.8-27B-Q4_K_M.gguf."
       - model_identity_rows: principle: "Repository, filename, revision, size, hash, and tokenizer receipt prevent substitution."
       - model_load_receipts: principle: "PID, command, CUDA markers, load time, and VRAM delta prove actual weight loading."
       - generation_receipts: principle: "Raw and parsed output plus token count prove bounded generation occurred."
       - structured_output_rows: principle: "Schema checks show that later entity extraction has a viable transport."
       - gpu_telemetry_rows: principle: "Before, during, and after snapshots tie GPU work to the task PID."
       - server_lease_rows: principle: "Ownership and teardown evidence prevent unsafe cleanup."
       - qwen38_structured_canary_ready_score: principle: "One gates full experiments without asserting correctness."
       - random_seed: principle: "A fixed decode seed makes the one canary repeatable."
       - reproducibility_checksum: principle: "The checksum detects model, prompt, runner, or result drift."
       - gate_check_summary: principle: "A blocked result names the first failed readiness or runtime check and both values."
       - verifier_is_oracle: principle: "False records that this task verifies runtime transport only."
       - verdict_class: principle: "Use the closed enum positive | circular_positive | null | blocked | disqualified | partial for structural aggregation."
       - honest_verdict: principle: "The terminal text reports bounded runtime readiness without an energy or accuracy claim."

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7161_v631_qwen38_structured_canary.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7162-entity-evidence-alignment-ab
  title: Qwen3.8 counterfactual entity-evidence alignment comparison
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 75
  per_unit_rows: true
  milestone: 2026.09.631
  deliverable: results/experiment_7162_v631_entity_evidence_alignment_ab.json
  gated_on:
    - upstream: exp7161-qwen38-bounded-structured-canary
      artifact_field: qwen38_structured_canary_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp7139-three-family-symbolic-grounding-ab
      verdict: blocked_native_llama_server
      addressed_by: "V631 uses the repaired Qwen3.8 runtime gate, one mandated model, and V630's sealed 648-row entity-evidence fixture instead of the old unavailable three-family server path."
      retire_if_same_verdict: true
    - experiment_id: exp7154-qwen-dual-side-grounding-pilot
      verdict: partial_running_qwen_dual_side_pilot
      addressed_by: "V631 narrows to a preselected 96-row paired extraction comparison, creates a terminal artifact first, emits loop heartbeats, and tears down a task-owned server in finally."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7158 created a sealed 648-row exact entity-evidence fixture with factual
    and counterfactual source conditions, entity IDs, source spans, pair IDs,
    exact labels, and a frozen energy-term contract. EAEV arXiv:2609.08267
    motivates explicit entity/evidence alignment. Earlier symbolic grounding
    runs blocked or remained nonterminal. This experiment uses Qwen3.8 only to
    extract candidate structures and a direct answer. Exact fixture labels are
    the independent authority.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/results/experiment_7158_v630_entity_evidence_fixture.json
    - {project_root}/results/experiment_7139_v627_symbolic_grounding_ab.json
    - {project_root}/results/experiment_7154_v629_qwen_dual_side_grounding.json
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/inference/llama_server_supervisor.py
    - {project_root}/python/carnot/verify/constraint.py
    - {project_root}/openspec/capabilities/constraint-verification/spec.md

    TASK:
    Run a preregistered, paired Qwen3.8 comparison on a sealed 96-row subset of
    the exact fixture. Compare direct supported/unsupported judgment, a frozen
    symbolic alignment energy over Qwen-extracted structures, lexical overlap,
    and shuffled-energy controls. Measure whether source perturbations change
    the candidate energy and improve exact-label discrimination. Do not use a
    model judge or tune on evaluation labels.

    CONCRETE STEPS:
    0. Print and flush a phase-start line. Create the schema-complete terminal
       artifact shell and raw manifest before model work. Recheck the upstream
       canary, exp7158 hash and ready field, exact cache, CUDA runner, idle GPU
       allocation, raw storage, tests, spec, and output path. A stable failure
       finishes blocked_no_run with gate_check_summary. Never fall back to a
       small model or synthetic rows.
    1. At every numbered phase boundary, print a flushed progress line. Print
       flushed start and end lines immediately before and after every model
       load, generation, benchmark, or subprocess that can take minutes. Print
       a flushed heartbeat at least every 300 seconds and at least every four
       generation calls inside long loops. Keep every stdout gap below 600
       seconds.
    2. Add REQ-VERIFY-7162 and focused RED tests for sealed selection,
       pair-preserving rows, exact-label isolation, frozen energy terms, common
       prompt budgets, metric reconstruction, completion-versus-value fields,
       and teardown. Mutate one sealed label into a prompt feature and prove the
       test fails. Print and flush around test subprocesses.
    3. Before reading any model output, select exactly 96 evaluation rows with a
       fixed seed, balanced across supported/unsupported condition, source
