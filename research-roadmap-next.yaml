               model_id: HuggingFace-style "org/model-name" or just "model-name".
               quantization: quantization suffix, e.g. "Q4_K_M". Uses config default if None.
               Returns: absolute path to .gguf file.
               Raises: GGUFModelNotFoundError if file not found.
               """
               ...

           def is_cached(self, model_id: str, quantization: str = None) -> bool:
               """Return True if the resolved path exists, False otherwise."""
               ...

