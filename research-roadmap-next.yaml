  # -- Phase 84: Predictive Verifier Calibration --
  - id: exp262-predictive-calibration-corpus
    milestone: "2026.04.19"
    deliverable: data/research/predictive_calibration_corpus_262.jsonl
    title: "Exp 262: Live calibration corpus for PredictiveVerifier from GPU inference"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: Exp 256 showed the PredictiveVerifier gate routed ALL cases to FAST_PATH when
      deployed on live inference — it was never calibrated on the real GSM8K distribution.
      The 4/δ Bound paper (arXiv 2512.02080) provides a formal framework for multi-stage
      verifier calibration and identifies three operating zones. This experiment collects the
      ground-truth (partial_context, final_violation_label) pairs needed to fit the calibrated
      threshold. Use Qwen/Qwen3.5-0.8B on GPU (Exp 258 harness). Use {date} as the run date.

      EXISTING CODE TO READ FIRST:
      - results/experiment_256_results.json
      - python/carnot/pipeline/predictive_verifier.py
      - python/carnot/pipeline/formal_claim_verifier.py
      - results/experiment_260_results.json (if available, for Exp 260 case IDs)
      - scripts/experiment_258_dual_gpu_harness.py

      TASK: Create data/research/predictive_calibration_corpus_262.jsonl

      CONCRETE STEPS:
      1. Create scripts/experiment_262_calibration_corpus.py that runs 200 GSM8K questions
         through Qwen/Qwen3.5-0.8B on GPU and captures calibration data.
      2. For each question, capture the partial response at 25%, 50%, and 75% of final token
         length (three rows per case). Extract feature vectors from each prefix using the
         existing PredictiveVerifier feature extractor.
      3. For the final violation label, use FormalClaimVerifier to score the full response.
         Store: case_id, prefix_fraction, token_feature_vector (as list), n_tokens_in_prefix,
         token_pattern_features (digit_density, operator_count, equals_count, sentence_count),
         violation_label (bool), n_violations_final, provenance_exp (reference to Exp 260
         case_id if available, else standalone GSM8K index).
      4. Extract domain-specific token patterns: for each violation-positive case, identify
         which token patterns in the prefix predicted the final violation. Store pattern stats
         (frequency in positive cases vs negative cases) as a summary section in the artifact.
      5. Write or update tests first for schema shape, label distribution reporting, and
         provenance field presence. Tests must pass under CARNOT_FORCE_LIVE=0 mock mode.
      6. Write a summary artifact (results/experiment_262_summary.json) with: n_cases,
         violation_rate, prefix_fraction_feature_importance, token_pattern_stats.
      Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 .venv/bin/python scripts/experiment_262_calibration_corpus.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp263-predictive-verifier-calibration
    milestone: "2026.04.19"
    deliverable: results/experiment_263_results.json
    title: "Exp 263: Calibrate PredictiveVerifier and run calibrated self-learning A/B"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: The Exp 262 calibration corpus is now available. The PredictiveVerifier gate
      in Exp 256 routed 100% to FAST_PATH because it was uncalibrated (resulting in -1.7pp).
      The 4/δ Bound (arXiv 2512.02080) shows that a well-calibrated gate should achieve:
      fast-path rate ≥30%, detection rate ≥60%, FP rate ≤20%. This experiment fits a calibrated
      threshold using isotonic regression and then runs the full self-learning A/B benchmark.
      Use only Qwen/Qwen3.5-0.8B and google/gemma-4-E4B-it. Use {date} as the run date.

      EXISTING CODE TO READ FIRST:
      - data/research/predictive_calibration_corpus_262.jsonl
      - results/experiment_256_results.json
      - results/experiment_241_results.json
      - python/carnot/pipeline/predictive_verifier.py
      - python/carnot/pipeline/constraint_addition.py
      - scripts/experiment_255_self_learning_ab.py

      TASK: Create results/experiment_263_results.json

      CONCRETE STEPS:
      1. Load the Exp 262 calibration corpus. Split 80/20 train/hold-out by case_id (deterministic
         split, seed=263).
      2. Fit a calibrated threshold for the PredictiveVerifier using isotonic regression on the
         training split. The threshold maps from feature_vector → P(violation) → fast_path_decision.
         Report calibration curve, Brier score, and which operating zone (marginal / practical /
         high-performance per 4/δ bound) is achieved on the hold-out.
      3. Save the calibrated threshold parameters to python/carnot/pipeline/predictive_verifier.py
         (or a companion calibration file) so they persist across runs.
      4. Run the full self-learning A/B benchmark (same 5 strategies as Exp 256: no_learning,
         case_memory_plus_policy, constraint_addition, predictive_gate, combined) using the
         calibrated gate on the Exp 260 or Exp 241 cohort (whichever has fuller live coverage).
      5. Primary success condition: any strategy achieves positive held-out gain with ≤ Exp 241
         (8) false positives. State clearly if not met. Report secondary metrics: fast-path hit
         rate, verification spend, per-domain lift, per-model lift.
      6. Write or update tests first for calibration fitting, threshold persistence, and A/B
         strategy branching under the calibrated gate.
      Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 .venv/bin/python scripts/experiment_263_calibrated_ab.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  # -- Phase 85: Domain-Specific Constraint Templates and Tier 2 Self-Learning --
  - id: exp264-domain-constraint-templates
    milestone: "2026.04.19"
    deliverable: data/research/domain_constraint_templates_264.jsonl
    title: "Exp 264: Domain-specific constraint template extraction from live inference tokens"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: Exp 256 (results/experiment_256_results.json) showed constraint addition fired on
      description-text proxy strings, not real inference tokens — adding +4 FPs with 0 new gains.
      The Self-Play Info Gain paper (arXiv 2603.02218) diagnoses this as "no learnable information
      gain": templates that match proxy text never provide signal beyond what is already known.
      The Propose-Solve-Verify paper (arXiv 2512.18160) shows formal verification verdicts as a
      reliable training signal. This experiment mines real token patterns from the Exp 262
      calibration corpus and Exp 260 results, using FormalClaimVerifier verdicts as ground truth.
      Use {date} as the run date.

      EXISTING CODE TO READ FIRST:
      - results/experiment_256_results.json
      - data/research/predictive_calibration_corpus_262.jsonl
      - results/experiment_260_results.json (if available)
      - python/carnot/pipeline/formal_claim_verifier.py
      - python/carnot/pipeline/constraint_addition.py

      TASK: Create data/research/domain_constraint_templates_264.jsonl

      CONCRETE STEPS:
      1. Create scripts/experiment_264_domain_templates.py that mines the Exp 262 calibration
         corpus and Exp 260 results for token patterns correlated with FormalClaimVerifier
         violations.
      2. For arithmetic domain: extract digit sequences, arithmetic operators (+, -, *, /),
         equals signs (=), and their surrounding token context (window ±3 tokens). Compute
         per-pattern: precision = P(violation|pattern_present), recall = P(pattern|violation).
      3. For cardinality domain: extract count words (first, second, one, two, total, each, sum),
         quantity nouns, and numeric quantifiers.
      4. For set-membership domain: extract list-start tokens (e.g., ":", "including", "such as"),
         enumeration separators, and bracket patterns.
      5. Store each template as: domain, token_pattern_regex, associated_claim_route,
         corpus_precision, corpus_recall, model_specificity (Qwen / Gemma / both),
         n_positive_cases, n_negative_cases. Enforce minimum corpus_precision ≥ 0.50.
      6. Write a summary artifact (results/experiment_264_summary.json) reporting: template counts
         by domain, precision/recall distributions, and which models each template is specific to.
      7. Write or update tests first for template schema shape, precision threshold enforcement,
         and deterministic generation.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_264_domain_templates.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp265-constraint-addition-live
    milestone: "2026.04.19"
    deliverable: python/carnot/pipeline/constraint_addition.py
    title: "Exp 265: Constraint addition module wired to formal solver verdicts"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: The current constraint_addition.py (python/carnot/pipeline/constraint_addition.py)
      matches against description-text proxies. Exp 264 now provides domain-specific templates
      derived from real inference tokens. The Sol-Ver paper (arXiv 2502.14948) shows mutual
      verification gating prevents error propagation: a template is only promoted if it fires on
      known-violation cases AND avoids known-correct cases. The PSV paper (2512.18160) shows formal
      verification verdicts are the right signal. This experiment updates constraint_addition.py
      to use domain templates + formal verdicts + mutual verification gating. Use {date} as the run
      date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/constraint_addition.py
      - data/research/domain_constraint_templates_264.jsonl
      - python/carnot/pipeline/formal_claim_verifier.py
      - python/carnot/pipeline/case_memory.py
      - openspec/capabilities/verifiable-reasoning/spec.md

      TASK: Update python/carnot/pipeline/constraint_addition.py

      CONCRETE STEPS:
      1. Read the existing constraint_addition.py thoroughly. Identify where description-text
         proxy matching occurs and replace those call sites.
      2. Add a TemplateRegistry class that loads domain_constraint_templates_264.jsonl and
         exposes a match(partial_response_tokens, model_id) method returning matched templates.
         Templates are keyed by domain and model_specificity to avoid cross-model false matches.
      3. Update the constraint addition decision logic to: fire template candidates from
         TemplateRegistry; apply mutual verification gating (template fires on ≥3 positive cases
         AND fires on <20% of negative cases in the loaded calibration corpus); only then add the
         template as a new FormalClaimVerifier route extension.
      4. Wire the addition decision to FormalClaimVerifier verdict history from case_memory
         (already built in Exp 239): when case_memory reports recurring violation type for a
         (model, domain) pair with ≥3 occurrences, trigger template promotion.
      5. Update the spec (openspec/capabilities/verifiable-reasoning/spec.md) with any new REQ-*
         for domain-specific template promotion and mutual verification gating if not already
         covered.
      6. Write or update tests first for: TemplateRegistry load, match, model specificity gating;
         mutual verification gating; integration with VerifyRepairPipeline. Tests must achieve
         100% targeted module coverage.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_constraint_addition.py -q --no-cov -n0
      Do NOT push. Do NOT modify scripts/research_conductor.py.

