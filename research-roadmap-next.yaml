  - id: exp2848
    milestone: "2026.05.270"
    deliverable: "results/experiment_2848_sota_runtime_evidence_v2.json"
    title: "SOTA Runtime Evidence v2"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    estimated_wall_time_min: 90
    requires_gpu: true
    track: infrastructure
    prior_failures:
      - experiment_id: exp2836-sota-runtime-preflight
        verdict: "success: .venv CUDA torch available and at least one mandated SOTA GGUF load-smoked; adversarially flagged for too-short duration and missing methodology fields"
        addressed_by: "This retry requires real inference work, random_seed, reproducibility_checksum, usable response counts, and no sleep padding; sota_runtime_ready_v2 is true only if the live evidence is clean."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Exp 2836 established that .venv CUDA torch and at least one mandated
        SOTA GGUF cache entry exist, but the artifact is not cite-safe because
        it completed too quickly for a live-model claim. This task turns runtime
        preflight into evidence: load a mandated SOTA GGUF, run real inference,
        and record usable responses.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - scripts/experiment_template.py
        - python/carnot/inference/sota_models.py
        - results/experiment_2836_sota_runtime_preflight.json
        - scripts/adversarial_verify.py

      TASK:
        Produce a clean SOTA runtime evidence artifact. If any precondition is
        missing, stop immediately and write a blocked_* verdict. Do not sleep-pad
        duration_s. Do not claim live inference unless a model is actually loaded
        and used.

      MODEL_SPECS:
        Primary candidates, in priority order:
          - unsloth/Qwen3.6-35B-A3B-GGUF
          - unsloth/gemma-4-31B-it-GGUF
          - unsloth/gemma-4-26B-A4B-it-GGUF
        Legacy small models are CPU smoke-test only and must not set
        sota_runtime_ready_v2=true.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. cd {project_root}
           b. .venv/bin/python3 -c "import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.cuda.device_count())"
           c. .venv/bin/python3 -c "import llama_cpp; from llama_cpp import llama_cpp as low; assert low.llama_supports_gpu_offload()"
           d. .venv/bin/python3 -c "from carnot.inference.sota_models import cached_sota_pair; specs=cached_sota_pair(gpu_indices=(0,1)); assert specs; print(specs)"
           e. nvidia-smi --query-gpu=index,name,memory.total,memory.free --format=csv,noheader,nounits
           If any precondition fails, write honest_verdict blocked_<resource>
           with preconditions_checked and exit.
        1. Select the first cached mandated SOTA GGUF returned by
           cached_sota_pair(); prefer Qwen3.6, then Gemma4-31B, then
           Gemma4-26B.
        2. Run at least 10 short deterministic verification/reasoning prompts
           through the selected GGUF with a fixed random_seed. Capture prompt,
           response, token counts, latency, and whether the response is usable.
        3. Measure real wall time from just before model load through final
           response. If real inference duration is under 60 seconds, do not add
           delay; set sota_runtime_ready_v2=false and explain why the evidence
           remains smoke-only.
        4. Compute reproducibility_checksum from selected model SHA/path,
           prompts, responses, random_seed, and loader version.
        5. Run scripts/adversarial_verify.py on the artifact if available and
           include the summary fields.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: str
        - sota_runtime_ready_v2: bool
        - selected_model_hf_id: str
        - selected_model_path: str
        - model_specs: list[dict]
        - legacy_small_models_used_only_for_smoke: bool
        - random_seed: int
        - reproducibility_checksum: str
        - preconditions_checked: list[dict]
        - usable_response_count: int
        - total_prompt_count: int
        - total_tokens_generated: int
        - tokens_per_second: float
        - loader_name: str
        - cuda_device_count: int
        - duration_s: float
        - adversarial_verify_passed: bool
        - adversarial_verify_flags: list
        - run_date: "{date}"

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

