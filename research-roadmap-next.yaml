    2. Update ops/known-issues.md to mark that entry as RESOLVED in .94:
       - Add a line: "RESOLVED .94 (2026-05-03): exp1215 uses STEP 0 skeleton + opus/100 turns"
       - Keep the original text (do NOT remove it per CLAUDE.md no-pruning policy)
    3. Write results/experiment_1204_retro_template_step0_fix.json

    CONCRETE STEPS:
    - cat ops/known-issues.md | grep -n "Retro Task Boundary" | head -5 2>&1
    - [Read the relevant section]
    - [Add resolution note to known-issues.md]
    - Write results/experiment_1204_retro_template_step0_fix.json

    REQUIRED ARTIFACT FIELDS:
    - retro_boundary_issue_found: bool (True if the issue entry was found in known-issues.md)
    - resolution_note_added: bool (True if resolution note added)
    - known_issues_file_updated: bool
    - retro_template_updated: bool (True iff resolution_note_added)
    - honest_verdict: "template_updated" | "already_resolved" | "blocked"

