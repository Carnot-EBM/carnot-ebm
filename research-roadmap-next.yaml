  # ---- P0.1 v6: process-aware energy + optimal aggregation vs SC on HEADROOM ------
  - id: exp3472-p01-process-energy-vs-self-consistency-headroom-v6
    operator_override: "2026-05-29 operator directive (standing): P0.1 (exp3312) is the project's single most important test. .319 cleanly established that on a CEILING benchmark (GSM8K SC 0.908) a trained energy ties SC (exp3460, real exact tie flagged as tautology). This tests the DIFFERENT, never-asked question (arXiv:2602.11570 PRIME, arXiv:2510.13918): on a HEADROOM benchmark (SC ~0.4-0.7) does a PROCESS-AWARE (step-level) energy + OPTIMAL SC+energy aggregation BEAT SC at matched compute? New substrate (headroom hard-math + per-step process energy), new technique (step-level process reward + principled aggregation, not candidate-level argmin), tautology-clean BY CONSTRUCTION (flip-count primary metric — no two bit-identical accuracy fields). Supersedes exp3460/exp3449/exp3312."
    prior_failures:
      - experiment_id: exp3460-p01-trained-energy-reranker-vs-self-consistency-v5
        verdict: "complete: trained_energy_matches_but_does_not_beat_self_consistency_at_equal_compute (FLAGGED adversarial_verify CRITICAL: TAUTOLOGY)"
        addressed_by: "exp3460 tested a candidate-level trained energy on GSM8K (SC at ceiling 0.908) and tied SC EXACTLY (the bit-identical tautology flag). This task (1) uses a HEADROOM benchmark (SC ~0.4-0.7) where a selector can actually help, (2) uses a PROCESS-AWARE step-level energy (the FoVer 0.9131 step-error verifier applied per-step) + OPTIMAL SC+energy aggregation (arXiv:2510.13918) rather than candidate-level argmin, and (3) reports a FLIP-COUNT primary metric (problems where the energy choice differs from SC, and the net correctness change among flips) so it is tautology-clean BY CONSTRUCTION — when energy and SC agree it is reported once as flip_count with a methodology_note, never as two bit-identical accuracy fields."
        retire_if_same_verdict: true
      - experiment_id: exp3449-p01-energy-vote-vs-self-consistency-cached-scoring-v4
        verdict: "complete: energy_matches_but_does_not_beat_self_consistency_at_equal_compute (FLAGGED TAUTOLOGY)"
        addressed_by: "exp3449 used an untrained energy on GSM8K (ceiling). This task uses a trained PROCESS energy on a HEADROOM benchmark with a flip-count tautology-clean design."
        retire_if_same_verdict: true
    # NOT gated_on exp3471: the cached corpus may be partial/absent; this task handles a
    # small/absent corpus via its own PRECONDITIONS (clean 'complete: blocked_corpus_too_small'),
    # so a CUDA-blocked exp3471 cannot cascade-skip this crux. The gate chain depends on THIS
