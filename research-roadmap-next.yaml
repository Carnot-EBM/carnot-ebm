  prompt: "CONTEXT:\nWork in {project_root} on {date} for milestone 2026.10.691. V690 authority qualified, but its\
    \ capstone rejected honest upstream dates across midnight. Bind per-producer invocation dates and current authority\
    \ without recreating consumed staging; ingest the new calibration review.\n\nEXISTING CODE TO READ FIRST:\n\
    - {project_root}/CLAUDE.md\n- {project_root}/CODEX.md\n- {project_root}/research-program.md\n- {project_root}/ops/exclusion_manifest.yaml\n\
    - {project_root}/ops/e2e-test-plan.md\n- {project_root}/scripts/experiment_template.py\n- {project_root}/python/carnot/reporting/current_work_receipt.py\n\
    - {project_root}/python/carnot/reporting/primary_publication.py\n- {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py\n\
    - {project_root}/openspec/capabilities/research-reporting/spec.md\n- {project_root}/python/carnot/reporting/v690_authority.py\n\
    - {project_root}/python/carnot/reporting/v690_contract_methods.py\n- {project_root}/python/carnot/reporting/v690_capstone.py\n\
    - {project_root}/scripts/roadmap_schema.py\n- {project_root}/scripts/conductor_gates.py\n- {project_root}/research-references.md\n\
    - {project_root}/research-studying.md\n- {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md\n\
    - {project_root}/results/experiment_7953_v690_contract_methods.json\n- {project_root}/results/experiment_7965_v690_capstone.json\n\
    \nTASK:\nBind thirteen tasks across UTC rollover and freeze research methods.\nDeliverable: {project_root}/results/experiment_7966_v691_contract_methods.json.\n\
    Actual compute: aggregation_from_upstream_artifacts; inference_substrate_class=no_model_load; MODEL_SPECS=[];\
    \ execution_venue=host.\n\nCONCRETE STEPS:\n1. Print a flushed start line. Authenticate exact input paths, hashes\
    \ and gate operands. External missing, retired or gate-blocked prerequisites produce complete_blocked_* with\
    \ verdict_class=blocked and gate_check_summary, never partial. Readiness is measurement validity, not a positive\
    \ science result.\n2. Print a flushed progress line at every phase boundary and before and after every model\
    \ load, generation, benchmark and subprocess. Inside long loops print completed units and monotonic elapsed\
    \ time; supervise owned children with heartbeats at most 60 seconds apart. Keep every output gap below 600 seconds\
    \ and every tool wait at most 60 seconds. Silent work can die at 1200 seconds; continued progress allows the\
    \ 4800-second hard cap. Never pad duration.\n3. Write every file over about 200 lines in several tool calls,\
    \ at most 150 lines per call, with a progress message between calls. Bound analysis intervals as well as commands.\
    \ Put throwaway probes in /tmp and real experiment drivers in scripts/experiments/. Use code/config/input-bound\
    \ checkpoints.\n4. Add task-owned REQ-* and SCENARIO-* before implementation, then failing tests. Reuse callable\
    \ libraries through a small parameterized CLI. Freeze affected files, transitive consumers, command argv, expected\
    \ exits/reasons, deadlines and coverage includes before results. Keep assertions, protected historical determinations\
    \ and the artifact-write guard intact.\n5. Allocate pytest basetemp, child fixture outputs, coverage data and\
    \ mutable replay candidates in a unique TemporaryDirectory outside results/ and the checkout. Give each scenario\
    \ its own publication directory. After children exit, archive immutable logs and coverage receipts below the\
    \ task raw directory. Never use a protected results/raw path as pytest scratch; never disable the guard. Publish\
    \ exactly one experiment primary at the declared deliverable and keep validator sidecars below results/raw/.\n\
    6. Reuse v690_authority and its twelve contract mutations. Bind exactly 13 tasks, Exp7966 through Exp7978, the\
    \ V691_TASK_CONTRACT_START JSON, visible table and canonical full-task SHA-256. Matching staged/document bytes\
    \ mean planning readiness only; matching active/document bytes mean observed activation. Missing consumed staging\
    \ remains unknown custody. Conflicting observed or preserved bytes must fail. Do not activate or write either\
    \ roadmap.\n7. Freeze active and staged snapshots while available and retain V690 preserved design provenance.\
    \ Add fixtures with an upstream issued on September 30 and a consumer issued October 1. Validate each date against\
    \ its own frozen invocation receipt. Reject a changed producer date, wrong experiment ID, stale hash, changed\
    \ prompt and conflicting snapshot. Preserve legitimate empty prior history only when the existing lineage readers\
    \ find no match. Do not modify shared conductor or gate semantics.\n8. Freeze the 640-role source allocation,\
    \ the two independent scientific branches, all losses, seed sets, budgets, controls and gate fields in this\
    \ roadmap. Historical Exp7892 source custody and Exp7955/7958 response evidence are reusable only by exact primary/hash.\
    \ Keep historical failures visible. The contract audit is not a universal science pre-gate.\n9. Ingest the V691\
    \ review into research-studying.md with 3\u20135 method-to-task mappings: complete-pipeline calibration, sparse\
    \ spline control, delayed issued-state feedback and full-service hardware cost. Distinguish rechecked from new\
    \ sources and record the EBT HTTP 429 and incomplete citation index. No research fan-out. Use E2E-018 private\
    \ authority tests and E2E-015; do not run the historical publishing CLI against current authorities.\n10. Run\
    \ affected unit and transitive consumer tests with PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov.\
    \ Combine unit and actual CLI success, expected-failure, blocked, cold-replay and terminal-recheck coverage\
    \ with identical includes. Require nonempty coverage and 100 percent changed-module and CLI statements. Run\
    \ scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py on explicit affected test paths.\
    \ Preserve historical failed receipts; record repository health separately without relabeling it as a pass.\n\
    11. Run the task-specific E2Es above using private scratch. Historical Exp7868 fixture and replay commands both\
    \ use --date 20260929; historical Exp7943/7954 fixture commands retain 20260930. Current producer records {date},\
    \ start/end UTC and monotonic spans separately. Authenticate each upstream against its own frozen invocation\
    \ identity; do not require all tasks in a milestone to have the same run_date. Reject identity/hash drift, not\
    \ honest midnight rollover.\n12. Cold-reduce claims from primitive rows and checkpoints. Run scripts/adversarial_verify.py\
    \ --json and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate; inspect both\
    \ reports and recheck final bytes after verdict changes. Any failed owned required check means disqualified\
    \ and readiness zero. Verify conductor_gates.evaluate_gates and in_process_doc_reconcile select the checked\
    \ primary path/hash even after newer nested sidecars. Atomically publish only checked bytes; bind terminal sidecars\
    \ to the final hash.\n13. Use complete_* terminal verdicts and verdict_class from positive | circular_positive\
    \ | null | blocked | disqualified | partial. Only unfinished owned work that a retry can finish is partial.\
    \ Record valid underpowered or harmful results as null, external absence as blocked. Fixture agreement or predicting\
    \ the verifier itself is circular_positive. Preserve the September 28 oracle-distinct corrigendum and exposed-development\
    \ limits. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Record unchanged prior\
    \ verdicts for retirement. Keep generator weights, production defaults and external publication unchanged.\n\
    \nREQUIRED ARTIFACT FIELDS:\n- experiment_id, task_id, milestone, run_date, execution_date, started_at, finished_at:\
    \ Current producer identity and actual {date}. principle: A milestone may cross UTC days.\n- honest_verdict,\
    \ verdict_class: Closed enum positive | circular_positive | null | blocked | disqualified | partial. principle:\
    \ External incompleteness is terminal blocked.\n- flagged_adversarial, gate_check_summary: Final flag and, for\
    \ every blocked_* or complete_blocked_* verdict, upstream ID, path/hash, field, op, expected and observed value.\
    \ principle: Absent artifacts differ from failing thresholds.\n- rows, sample_size_budget: Per-unit metrics\
    \ plus intended, eligible, started, completed, failed, censored, excluded and independent counts with named\
    \ units. principle: Seeds, masks and timing repeats do not create independent sources.\n- acceptance_gate_results:\
    \ Separate validity, readiness, calibration, decision benefit, retention and efficiency. principle: Completion\
    \ is not improvement.\n- duration_s, phase_spans, random_seed, reproducibility_checksum: Actual monotonic work\
    \ plus code/config/data identity. principle: Declared model names are not execution evidence.\n- source_artifact_hashes,\
    \ cited_upstream_artifacts, preconditions_checked, resolved_imports: Paths, hashes, producer IDs, imported fields\
    \ and callable dependencies. principle: Historical evidence keeps its original identity.\n- validation_receipts,\
    \ validation_command_manifest_path, observed_child_commands, coverage_statement_counts, historical_required_failures,\
    \ repository_health: Commands, exits, deadlines, logs and actual measured files. principle: Owned failures cannot\
    \ be hidden by a global-health category.\n- primary_resolution_receipt, terminal_validation_sidecar_path, scratch_root_receipt:\
    \ Exact final primary/hash, terminal hash and private workspace location. principle: The conductor must consume\
    \ the checked record.\n- verifier_is_oracle, claim_scope: Explicit circularity and exposed_development for reused\
    \ data. principle: Human annotations are model-independent but fallible; they are not formal truth certificates.\n\
    - inference_substrate, inference_substrate_class, execution_venue: Actual compute and host venue; blocked_no_run\
    \ records planned class separately. principle: Actual work determines the duration floor.\n- MODEL_SPECS, model_specs,\
    \ target_model, model_invocation_counts, trained_head_specs: Invoked pretrained models or empty lists and zero\
    \ calls; fitted small heads separately. principle: Referenced generators are not current invocations.\n- field_principles:\
    \ Explain every task-specific field and gate. principle: The contract records why the measurement exists.\n\
    - contract_ready_score, planning_ready_score, activation_confirmed, observed_activation, staging_custody_status:\
    \ Separate observed states. principle: Staging is not activation.\n- contract_rows, mutation_rows, authority_snapshots,\
    \ canonical_tasks_sha256, lifecycle_task_count: Thirteen task rows and twelve mutations plus rollover cases.\
    \ principle: Queued work and design must agree.\n- producer_date_rows, literature_adoption_decisions, lineage_applicability_rows:\
    \ Actual invocation identities and source/retirement decisions. principle: New dates do not erase earlier evidence.\n\
    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python\
    \ -u scripts/experiments/experiment_7966_v691_contract_methods.py --date {date}\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"
  agent_type: claude
  model: opus
