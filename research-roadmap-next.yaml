      (reproduce), ops/arc_solve_registry.yaml (g50t is currently `unsolved`; ka59/s5i5/ft09 grounded
      win-rules to few-shot from), CLAUDE.md "Inference-Substrate Declaration Discipline".
      TASK: re-run the example-conditioned win-induction for HELD-OUT g50t and BANK L1, EMITTING
      inference_substrate correctly so the real solve is not falsely quarantined. INCREMENTAL: +1 level
      (g50t L1) -> registry 37/18 -> 38/19.
