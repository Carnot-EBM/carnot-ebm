           the per-problem SC distribution, the [0.40,0.70] filter, and the resulting n.
           Report the subset-level SC and confirm it lands in band.
        2. Split by PROBLEM id into TRAIN / HELD-OUT folds (never split samples of one problem
           across folds — leakage). Use k-fold CV if n is small; document split + seed. ALL
           accuracies are held-out only.
        3. PROCESS ENERGY: score each candidate's parsed STEPS with the FoVer 4-verifier
           step-error ensemble (per-step), aggregate to a candidate process-energy. If a
           corpus lacks step traces, fall back to a documented heuristic step segmentation.
        4. TRAINED ENERGY: train the EORM reranker on outcome labels (features = process-energy
           components + logprob + verifier signals); record param count.
        5. OPTIMAL AGGREGATION: fit a principled SC+energy combiner (arXiv:2510.13918) on TRAIN,
           apply on HELD-OUT.
        6. Score 7 conditions on held-out: (1) greedy AR floor; (2) self-consistency (PRIMARY
           control, majority vote); (3) self-certainty BoN (arXiv:2502.18581); (4) process-energy
           argmin; (5) trained-energy-weighted vote; (6) trained-energy x SC hybrid; (7) OPTIMAL
           SC+energy aggregation (the headline condition). MATCHED COMPUTE: conditions 2-7
           consume the SAME k cached generations; energy adds only scoring.
        7. PRIMARY FLIP-COUNT METRIC (tautology-clean by construction): per energy/aggregation
           condition vs SC: flip_count = problems where the selected answer differs from the
           SC majority; flips_correct; flips_incorrect; net_correctness_gain = flips_correct -
           flips_incorrect. When a condition agrees with SC, report flip_count=0 ONCE with a
           methodology_note — NEVER two conceptually-distinct accuracy fields bit-identical.
        8. Held-out accuracy per condition + the PRIMARY paired delta (optimal-aggregation
           minus SC) AND the process-energy/hybrid deltas, each with McNemar exact p + paired
           bootstrap CI95.
        9. Emit results with clean methodology (real duration, seed, checksum,
           inference_substrate=verifier_ensemble_against_cached_candidates).

