tasks:
- id: exp6861-v600-branch-retirement-evidence-contract
  title: V600 branch retirement and evidence contract
  track: infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.09.600
  deliverable: results/experiment_6861_v600_branch_retirement_evidence_contract.json
  prompt: |
    CONTEXT:
    V599 completed all tasks but advanced no scientific branch. Exact typed authority and all-three
    local GGUF scoring work. Raw fixed-sequence compatibility is not identifiable. The sealed memory
    audit found 100% abstention and 13 harmful writes. The live supervisor branch has zero headroom
    and is retired. The first-party tool-gap receipt contract is ready but has no authentic live
    chain. This task freezes those facts and defines the V600 changed-mechanism contract.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md and {project_root}/_bmad/prd.md, FR11 and FR12
    - {project_root}/research-references.md, V600 Planner Refresh
    - {project_root}/results/experiment_6849_typed_program_isomorphic_authority_audit.json
    - {project_root}/results/experiment_6851_three_family_isomorphic_compatibility_stream.json
    - {project_root}/results/experiment_6852_compatibility_shortcut_authority_audit.json
    - {project_root}/results/experiment_6856_sealed_risk_sensitive_learning_audit.json
    - {project_root}/results/experiment_6857_dynamic_live_arc_receipt_router.json
    - {project_root}/results/experiment_6859_first_party_tool_gap_receipt_wiring.json
    - {project_root}/results/experiment_6860_v599_independent_capstone.json
    - {project_root}/ops/conductor-log.md and {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build an immutable V600 evidence root. Recompute V599 dispositions with fresh code. Retire only
    the failed claim mechanisms, preserve reusable infrastructure, verify the promoted V600 research
    references, and define the exact split, gate, provenance, and claim fields consumed downstream.
    Do not rerun a V599 experiment and do not invoke an LLM.

    CONCRETE STEPS:
    0. PRECONDITIONS: require every V599 terminal artifact or an explicit conductor gate record,
       stable hashes for immutable inputs, and a complete missing-artifact inventory. On failure,
       write complete_blocked_v600_branch_retirement_evidence_contract with gate_check_summary.
    1. Add REQ-REPORT-6861 and testable scenarios before implementation. Cover a missing source,
       source drift, flagged upstream, procedural-positive capstone, and failed-mechanism reuse.
    2. Recompute the typed, compatibility, self-learning, supervisor, and tool-gap dispositions
       without importing Exp6860's reducer. Preserve null, blocked, disqualified, and partial states.
    3. Retire raw fixed-sequence margin claims, unchanged supervisor credit without headroom, and the
       degenerate V599 memory policy. Preserve typed exact authority, local scoring, transaction,
       rollback, and first-party receipt infrastructure.
    4. Define one provenance schema for source hashes, calibration and held split hashes, model and
       tokenizer identities, process ownership, exact authorities, live receipt identities, and
       conductor skips. Name every downstream gate field exactly.
    5. Verify arXiv:2606.10616, arXiv:2605.29556, arXiv:2604.09459, and arXiv:2608.15008 against
       primary pages. Record method delta, Carnot hook, and access boundary.
    6. Write docs/research-notes/v600-method-change-contract.md and the required JSON artifact.
    7. Run focused tests, ruff, OpenSpec coverage, adversarial verification, artifact convention
       audit, verdict-row consistency lint, exclusion-manifest lint, and root-clutter checks.
    8. REQUIRED ARTIFACT FIELDS: field_principles; preconditions_checked;
       inference_substrate (deterministic CPU evidence replay); duration_s; source_artifact_hashes;
       reproducibility_checksum; rows (one source, disposition, retirement, or reference);
       terminal_branch_manifest; conductor_skip_manifest; flagged_source_manifest;
       retired_mechanism_manifest; preserved_infrastructure_manifest; changed_mechanism_manifest;
       split_and_gate_contract; source_access_boundaries; reference_verification_rows;
       v600_evidence_contract_ready_score (exact field consumed by Exp6862, Exp6867, and Exp6870);
       gate_check_summary (failed check and observed value for any blocked verdict);
       verifier_is_oracle (false); verdict_class (positive | circular_positive | null | blocked |
       disqualified | partial); honest_verdict (terminal, row-supported, and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6861_v600_branch_retirement_evidence_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6860-v599-independent-capstone
      verdict: complete_partial_v599_dispositions_preserved_no_scientific_branch_advance
      addressed_by: 'This is not another V599 disposition. It freezes the controlling failures into explicit retirements, verifies new sources, and defines changed V600 evidence contracts before any new measurement.'
      retire_if_same_verdict: true

- id: exp6862-dual-side-semantic-contrast-bank
  title: Dual-side exact semantic contrast bank
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.09.600
  deliverable: results/experiment_6862_dual_side_semantic_contrast_bank.json
  gated_on:
    - upstream: exp6861-v600-branch-retirement-evidence-contract
      artifact_field: v600_evidence_contract_ready_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Exp6852 showed that raw sequence margins were not identifiable. Opt-Verifier
    (arXiv:2605.29556) checks both whether a formal structure represents the problem and whether the
    candidate solution satisfies it. This task builds a new exact semantic-contrast bank with those
    two authorities. It invokes no LLM and computes no model score.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V600 Planner Refresh
    - {project_root}/results/experiment_6849_typed_program_isomorphic_authority_audit.json
    - {project_root}/results/experiment_6852_compatibility_shortcut_authority_audit.json
    - {project_root}/results/experiment_6861_v600_branch_retirement_evidence_contract.json
    - {project_root}/python/carnot/constraint_obligation_automaton.py
    - {project_root}/openspec/capabilities/constraint-verification/spec.md
    - {project_root}/scripts/verdict_row_consistency_lint.py

    TASK:
    Build at least 96 exact semantic contrast groups from the typed obligation program. Each group
    needs one valid candidate, one minimally invalid candidate, and semantics-preserving nuisance
    controls. A fresh structure-side checker and an independent solution-side checker must agree.
    Reject ambiguous, colliding, or disagreement rows. Do not score or generate text with an LLM.

    CONCRETE STEPS:
    0. PRECONDITIONS: require v600_evidence_contract_ready_score=1, readable Exp6849 typed sources,
       and the Exp6852 failure witnesses. On failure, write
       complete_blocked_dual_side_semantic_contrast_bank with gate_check_summary.
    1. Add REQ-CONSTRAINT-6862 and testable scenarios before implementation. Cover identity
       collision, semantic alias, omitted atom, vacuous constraint, checker disagreement, and split
       mutation.
    2. Use a fresh reducer. Create at least 96 groups across exact energy, satisfaction predicate,
       memory guard, ARC guard, and diagnostic obligation families. Give every program, candidate,
       contrast, transform, and row a content-derived identity.
    3. Structure-side verification must prove the intended variable, obligation, and mutation map.
       Solution-side verification must independently prove the valid and invalid labels. Do not let
       one checker call or import the other.
    4. Add identifier renames, label swaps, row reorders, normalization variants, surface
       paraphrases, and semantics-preserving atom-order transforms. Add one-atom semantic mutations
       that must change the exact label.
    5. Reject duplicate semantic identities, ambiguous programs, collisions, checker disagreement,
       and rows that derive labels from names or order. Preserve all rejected witnesses.
    6. Freeze raw prompt and candidate sequence templates for Exp6863. Do not assign calibration or
       held groups yet and do not inspect a model tokenizer.
    7. Set dual_side_semantic_contrast_bank_ready_score to 1 only when at least 96 accepted groups
       pass both authorities and every negative control.
    8. Run focused tests, ruff, OpenSpec coverage, adversarial verification, mutation tests,
       artifact convention audit, verdict-row consistency lint, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles; preconditions_checked;
       inference_substrate (deterministic CPU dual-side exact checking); duration_s;
       source_artifact_hashes; random_seed; reproducibility_checksum; rows (one candidate,
       authority side, and transform); fresh_reducer_manifest; typed_family_manifest;
       semantic_contrast_group_manifest; structure_side_check_rows; solution_side_check_rows;
       authority_disagreement_witnesses; identity_collision_witnesses; rejected_group_manifest;
       nuisance_transform_manifest; semantic_mutation_rows; accepted_contrast_group_count;
       dual_side_semantic_contrast_bank_ready_score (exact field consumed by Exp6863);
       gate_check_summary (failed check and observed value for any blocked verdict);
       verifier_is_oracle (false, the two exact checkers supply external authority);
       verdict_class (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6862_dual_side_semantic_contrast_bank.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6852-compatibility-shortcut-authority-audit
      verdict: complete_null_model_compatibility_not_identifiable
      addressed_by: 'This task does not reuse raw model margins. It builds a new dual-side exact contrast bank with minimal semantic mutations and pre-model nuisance controls.'
      retire_if_same_verdict: true

- id: exp6863-tokenizer-aware-semantic-contrast-preregistration
  title: Tokenizer-aware nuisance and split preregistration
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.600
  deliverable: results/experiment_6863_tokenizer_aware_semantic_contrast_preregistration.json
  gated_on:
    - upstream: exp6862-dual-side-semantic-contrast-bank
      artifact_field: dual_side_semantic_contrast_bank_ready_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    V599 margins were confounded by token count, length, labels, order, normalization, model family,
    and scale. Exp6862 supplies exact semantic groups but has not inspected model tokenization. This
    task creates model-specific eligible cells and freezes calibration and held splits before any
    token likelihood is observed. It performs tokenizer calls only, not LLM inference.

    Work at {project_root}. The execution date is {date}.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE)

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6850_three_family_scoring_admission_canary.json
    - {project_root}/results/experiment_6852_compatibility_shortcut_authority_audit.json
    - {project_root}/results/experiment_6862_dual_side_semantic_contrast_bank.json
    - {project_root}/scripts/experiment_template.py, cached_sota_pair() pattern
    - {project_root}/python/carnot/inference/llama_cpp_process.py
    - {project_root}/openspec/capabilities/llm-ebm-inference/spec.md
    - {project_root}/openspec/capabilities/constraint-verification/spec.md

    TASK:
    Resolve every MODEL_SPEC through the canonical cache pattern. Tokenize the frozen sequences
    without inference. Freeze exact nuisance matches, group-disjoint calibration and held splits,
    effect definitions, confidence intervals, failure rules, and sealed hashes. Require at least 20
    calibration and 20 held contrast groups per model or emit an honest null readiness result.

    CONCRETE STEPS:
    0. PRECONDITIONS: call cached_sota_pair(); require all three exact GGUF files, embedded tokenizer
       metadata, stable hashes, Exp6862 readiness, and zero pre-existing model scores for the new
       group identities. On failure, write complete_blocked_tokenizer_aware_semantic_contrast_preregistration
       with gate_check_summary.
    1. Add REQ-INFERENCE-6863 and tests before implementation. Cover missing tokenizer metadata,
       cache substitution, unequal token counts, split overlap, group leakage, hash drift, and held
       label access.
    2. Invoke the native GGUF tokenizer path only. Record exact token ids, prompt token counts,
       candidate token counts, special tokens, chat template identity, and tokenizer hash for each
       model and contrast sequence. Record zero token likelihood calls.
    3. Keep model-specific cells only when the valid and invalid candidates have equal candidate
       token counts and the paired controls meet the declared prompt-length and label-position
       contract. Preserve all rejected cells with reasons.
    4. Freeze identifier, order, normalization, label-position, token-count, character-length, and
       surface-form controls. Pre-register the within-group paired contrast and the
       difference-in-differences nuisance statistics.
    5. Split by semantic group identity, never by row. Freeze disjoint calibration and held groups,
       exact hashes, random seed, minimum sample size, confidence method, missing-cell rule,
       family-agreement rule, and retirement threshold before scoring.
    6. Seal held labels and prove the calibration path cannot load them. Require at least 20
       calibration and 20 held accepted groups per model and both Qwen and Gemma families.
    7. Set semantic_contrast_preregistration_ready_score from tokenizer receipts, nuisance matching,
       split disjointness, sample floors, and sealing only. It is not a scientific result.
    8. Run focused tests, ruff, OpenSpec coverage, adversarial verification, artifact convention
       audit, verdict-row consistency lint, cache authenticity checks, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles; preconditions_checked;
       inference_substrate (native_gguf_tokenization_without_inference); duration_s;
       model_specs (all three exact MODEL_SPECS); models_used; model_artifact_hashes;
       tokenizer_receipts; token_likelihood_call_count (zero); rows (one model and contrast cell);
       accepted_cell_manifest; rejected_cell_manifest; nuisance_match_manifest;
       calibration_group_manifest; sealed_held_group_manifest; split_overlap_count (zero);
       held_label_access_count (zero); preregistered_statistic_manifest; sample_size_power_rows;
       reproducibility_checksum; semantic_contrast_preregistration_ready_score (exact field consumed
       by Exp6864); gate_check_summary (failed check and observed value for any blocked verdict);
       verifier_is_oracle (false); verdict_class (positive | circular_positive | null | blocked |
       disqualified | partial); honest_verdict (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6863_tokenizer_aware_semantic_contrast_preregistration.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6852-compatibility-shortcut-authority-audit
      verdict: complete_null_model_compatibility_not_identifiable
      addressed_by: 'This attempt freezes model-specific token equality, nuisance controls, group-disjoint splits, and the statistic before any score exists; V599 created controls after raw margins were already present.'
      retire_if_same_verdict: true

- id: exp6864-three-family-semantic-contrast-scoring-stream
  title: Three-family semantic contrast scoring stream
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 480
  per_unit_rows: true
  milestone: 2026.09.600
  deliverable: results/experiment_6864_three_family_semantic_contrast_scoring_stream.json
  gated_on:
    - upstream: exp6863-tokenizer-aware-semantic-contrast-preregistration
      artifact_field: semantic_contrast_preregistration_ready_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Exp6851 proved that all three required model families can emit fixed-sequence token scores, but
    Exp6852 found those raw margins non-identifiable. Exp6863 freezes a new dual-side exact,
    tokenizer-matched, nuisance-controlled contrast before scoring. This task produces the raw live
    score stream only. It does not make a semantic compatibility claim.

    Work at {project_root}. The execution date is {date}.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE)

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6850_three_family_scoring_admission_canary.json
    - {project_root}/results/experiment_6851_three_family_isomorphic_compatibility_stream.json
    - {project_root}/results/experiment_6852_compatibility_shortcut_authority_audit.json
    - {project_root}/results/experiment_6863_tokenizer_aware_semantic_contrast_preregistration.json
    - {project_root}/scripts/experiment_template.py, cached_sota_pair() pattern
    - {project_root}/python/carnot/inference/llama_cpp_process.py
    - {project_root}/openspec/capabilities/llm-ebm-inference/spec.md

    TASK:
    Run live local llama.cpp CUDA forced-sequence scoring for every eligible calibration and sealed
    held cell in every MODEL_SPEC. Preserve raw token receipts, checkpoints, process ownership, and
    nuisance group identities. Generate no answer and expose no label to the model process.

    CONCRETE STEPS:
    0. PRECONDITIONS: call cached_sota_pair(); require semantic_contrast_preregistration_ready_score=1,
       exact model and tokenizer hash matches, CUDA token scoring, sufficient disk, free task-owned
       ports, and a bounded GPU lease. Observe but never interrupt unrelated processes. On failure,
       write complete_blocked_three_family_semantic_contrast_scoring_stream with gate_check_summary.
    1. Add REQ-INFERENCE-6864 and tests before implementation. Cover lease loss, occupied port,
       stale PID, missing model, hash drift, label exposure, partial checkpoint, restart, NaN score,
       and owned-process teardown.
    2. Start one model at a time. Record command, PID, start time, ownership token, model hash,
       tokenizer hash, GPU UUID, visible devices, offload layers, port, and VRAM samples.
    3. Score the exact prompt-plus-candidate sequences from Exp6863. Store token ids, per-token log
       probabilities, normalized and unnormalized candidate sums, finite checks, latency, and raw
       sidecar hashes. Do not generate answers, repair outputs, or ask the model for a label.
    4. Keep calibration and held sidecars separately hashed. The scorer may write scores but must
       not load held semantic labels. Record held_label_access_count=0 and generated_answer_count=0.
    5. Checkpoint atomically after every model and contrast-group batch. On restart, verify all input
       and output hashes and rerun only incomplete cells.
    6. Tear down only task-owned processes. Confirm port release and process exit. Preserve failed
       or timeout cells instead of imputing them.
    7. Set semantic_contrast_stream_complete_score from all required model cells, raw receipts,
       checkpoint integrity, and teardown only. Emit no compatibility effect or positive class.
    8. Run focused tests, ruff, OpenSpec coverage, adversarial verification, artifact convention
       audit, verdict-row consistency lint, CUDA authenticity checks, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles; preconditions_checked;
       inference_substrate (live_local_llama_cpp_cuda_forced_sequence_scoring); duration_s;
       model_specs (all three exact MODEL_SPECS); models_used; missing_model_manifest;
       model_artifact_hashes; tokenizer_receipts; process_receipts; accelerator_samples;
       lease_receipts; rows (one model, group, sequence, and transform score); raw_token_sidecars;
       calibration_score_manifest; sealed_held_score_manifest; failed_cell_manifest;
       checkpoint_manifest; teardown_receipts; generated_answer_count (zero);
       held_label_access_count (zero); scientific_effect_claimed (false);
       reproducibility_checksum; semantic_contrast_stream_complete_score (exact field consumed by
       Exp6865 and Exp6866); gate_check_summary (failed check and observed value for any blocked
       verdict); verifier_is_oracle (false); verdict_class (positive | circular_positive | null |
       blocked | disqualified | partial); honest_verdict (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6864_three_family_semantic_contrast_scoring_stream.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6851-three-family-isomorphic-compatibility-stream
      verdict: complete_null_three_family_isomorphic_compatibility_stream
      addressed_by: 'The inference substrate is reused, but the scored objects are new dual-side exact, token-matched semantic contrast groups with frozen calibration and held splits.'
      retire_if_same_verdict: true
    - experiment_id: exp6852-compatibility-shortcut-authority-audit
      verdict: complete_null_model_compatibility_not_identifiable
      addressed_by: 'This attempt scores only preregistered matched contrasts and preserves every nuisance transform before any aggregate is computed.'
      retire_if_same_verdict: true
