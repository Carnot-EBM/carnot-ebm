    prompt: |
      CONTEXT: The self-learning thesis (PRD FR-11 / continuous self-learning) rests on alpha_t
      grounding — the verifier signal that keeps a self-correcting model from collapsing onto its
      own null space (Zenil alpha_t; Q12 Dark Room / Hypothesis-B). exp3498 (.322) fit an offline
      law beta_min = -0.300 + 1.846*lambda_min (r2=0.989), but exp3509 (.323) found this law DOES
      NOT generalize to fresh deployment configs (deployed_law_prevents_collapse=False); it
      recommended a conservative default beta. This task finds the rule that ACTUALLY deploys.
      Independent precedent: ER-PRM (arXiv:2412.11006) entropy regularization stabilizes PRM
      training. Cached traces + cached verifier scoring -> no live model -> no timeout. This is the
      milestone's mandatory continuous-self-learning experiment, fused with the P0.2 diversity keystone.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3509_fr11_closed_loop_beta_law_deployment_v1.json (the offline law fails to deploy; conservative default recommended)
        - scripts/experiment_3509_fr11_closed_loop_beta_law_deployment_v1.py (REUSE the lambda_min covariance + the 3-arm closed-loop harness; KEEP pass_rate/true_accuracy strictly distinct + the runtime assert)
