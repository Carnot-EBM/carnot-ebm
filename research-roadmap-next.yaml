    TASK: Wire VR violations into ConstraintTemplateLibrary and measure cross-session FP delta.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-SELF-020 (FR-11 relay: VR violations from each milestone are wired into
       ConstraintTemplateLibrary; cross_session_fp_rate_delta measured each relay),
       SCENARIO-SELF-025/026 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/constraint_template_library.py if absent:
       a. ConstraintTemplate dataclass: template_id (str), violation_pattern (str),
          violation_type (str), source_experiment (int), added_date (str),
          n_triggered (int = 0).
       b. ConstraintTemplateLibrary class:
          __init__(self, library_path: str = 'data/constraint_templates.json'):
            self.library_path = library_path
            self.templates: list[ConstraintTemplate] = []
            self._load()
          _load(self): load from JSON file if exists.
          _save(self): persist to JSON file.
          add_template(self, pattern: str, violation_type: str,
                       source_experiment: int) -> ConstraintTemplate:
            'Add new constraint template if not already present (deduplicate by pattern).'
            existing = [t for t in self.templates if t.violation_pattern == pattern]
            if existing: return existing[0]
            t = ConstraintTemplate(template_id=str(len(self.templates)),
                violation_pattern=pattern, violation_type=violation_type,
                source_experiment=source_experiment,
                added_date=datetime.now().isoformat())
            self.templates.append(t)
            self._save()
            return t
          get_fp_rate(self, responses: list[str]) -> float:
            'Measure false positive rate: fraction of responses that match any template.'
            if not self.templates or not responses: return 0.0
            fp_count = sum(
                1 for r in responses
                if any(t.violation_pattern in r for t in self.templates))
            return fp_count / len(responses)
