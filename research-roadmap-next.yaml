  - id: exp5351-trigger-constrain-structured-protocol-v488
    milestone: "2026.07.488"
    title: "Exp 5351: Trigger-then-constrain structured-output protocol corrigendum"
    priority: critical
    track: verification
    deliverable: results/experiment_5351_trigger_constrain_structured_protocol_v488.json
    requires_gpu: true
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 75
    prior_failures:
      - experiment_id: exp5338-structured-output-protocol-calibration-v487
        verdict: "flagged_DURATION_TOO_SHORT: structured_output_protocol_ready was quarantined; model_specs/target_model and methodology evidence were insufficient."
        addressed_by: "Different from Exp5338: this attempt uses trigger-then-constrain from arXiv:2601.07525, mandates duration/methodology evidence, and records selected_model_spec plus MODEL_SPECS."
        retire_if_same_verdict: true
      - experiment_id: exp5326-gated-sota-paraphrase-rewrite-smoke-v486
        verdict: "complete: bounded local SOTA paraphrase/rewrite smoke fixture-scored but parse/protocol failure kept quality unusable."
        addressed_by: "Different from Exp5326: this is protocol-only calibration before quality scoring and does not score semantic quality."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Run from {project_root} on {date}. `.487` proved runtime-clean local GGUF execution but the structured-output protocol was quarantined. Literature refresh promoted trigger-then-constrain: let the model think, then force a final constrained object with a sentinel and parser.

      EXISTING CODE TO READ FIRST:
      - CODEX.md
      - CLAUDE.md
      - scripts/experiment_template.py
      - research-references.md
      - results/experiment_5337_sota_runtime_corrigendum_multimodel_v487.json
      - results/experiment_5338_structured_output_protocol_calibration_v487.json
      - results/experiment_5326_gated_sota_paraphrase_rewrite_smoke_v486.json
      - tests/python
      - python/carnot

      TASK:
      Re-run structured local SOTA protocol calibration using trigger-then-constrain, with clean methodology and sufficient wall-clock evidence. Do not measure broad quality.

      Deliverable: `results/experiment_5351_trigger_constrain_structured_protocol_v488.json`.

      CONCRETE STEPS:
      0. PRECONDITIONS: record GPU visibility, `nvidia-smi`, llama.cpp command/version, model file presence, free VRAM, and the `.487` clean runtime receipt.
      1. Define MODEL_SPECS in the artifact:
         - unsloth/Qwen3.6-35B-A3B-GGUF
         - unsloth/gemma-4-31B-it-GGUF
         - unsloth/gemma-4-26B-A4B-it-GGUF
      2. Use at least one mandated SOTA model from MODEL_SPECS; prefer the model with the clean `.487` runtime receipt.
      3. Test trigger-then-constrain variants: free reasoning trigger token, final JSON sentinel, final-only extraction, stop sequence if supported, and strict schema validation.
      4. Use 4-6 deterministic prompts and record parse success, schema success, final-only extraction, unsafe false accepts, token counts, command lines, and `methodology_duration_s`.
      5. Set `structured_protocol_clean` true only if every calibration prompt produces parseable schema-valid final JSON, unsafe false accepts are zero, no AutoTokenizer is used, and live-run methodology is clean.

      REQUIRED ARTIFACT FIELDS:
      - experiment_id: principle: Stable id ties the artifact to this roadmap task.
      - milestone: principle: Prevents `.487` flagged protocol evidence from being reused as `.488` evidence.
      - status: principle: Lets gates distinguish completed calibration from blocked runtime.
      - honest_verdict: principle: Terminal prefix `complete:` or `blocked_` prevents ambiguous downstream quality gates.
      - inference_substrate: principle: Expected value is live_llm_inference when a GGUF model generated outputs.
      - MODEL_SPECS: principle: Confirms every LLM task includes the mandated local SOTA GGUF model ids.
      - preconditions_checked: principle: Records GPU/backend/model checks before inference.
      - selected_model_spec: principle: Identifies which mandated model actually supplied the receipt.
      - protocol_variants: principle: Shows which trigger/constrain mechanisms were tested.
      - prompt_count: principle: Bare integer bounds the calibration scope.
      - parse_success_rate: principle: Bare numeric parse metric separates syntax from semantic quality.
      - schema_success_rate: principle: Bare numeric schema metric catches valid-looking but incomplete JSON.
      - final_json_extraction_rate: principle: Bare numeric extraction metric addresses thinking-transcript spillover.
      - unsafe_false_accepts: principle: Bare integer prevents parser false accepts from being hidden by aggregate success.
      - methodology_duration_s: principle: Bare numeric duration prevents another DURATION_TOO_SHORT quarantine.
      - structured_protocol_clean: principle: Bare boolean is the downstream gate for quality/tax work.
      - no_quality_claim: principle: Bare boolean must be true because this task calibrates protocol only.
      - no_autotokenizer_used: principle: Bare boolean enforces GGUF loading discipline.
      - tests_run: principle: Lists local checks that validated parser/schema behavior.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5352-gated-constraint-tax-tool-action-panel-v488
    milestone: "2026.07.488"
    title: "Exp 5352: Gated constraint-tax and tool/action reachability panel"
    priority: high
    track: verification
    deliverable: results/experiment_5352_constraint_tax_tool_action_panel_v488.json
    requires_gpu: true
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 80
    gated_on:
      - upstream: exp5351-trigger-constrain-structured-protocol-v488
        artifact_field: structured_protocol_clean
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp5339-gated-sota-claim-rewrite-panel-v487
        verdict: "blocked_sota_claim_rewrite_panel_not_ready: structured output protocol was not clean enough for quality scoring."
        addressed_by: "Different from Exp5339: this task is gated on a clean trigger-then-constrain protocol and scores constraint-tax categories rather than a single broad quality number."
        retire_if_same_verdict: true
      - experiment_id: exp5326-gated-sota-paraphrase-rewrite-smoke-v486
        verdict: "complete: bounded local SOTA paraphrase/rewrite smoke fixture-scored with zero usable parse-quality outcome."
        addressed_by: "Different from Exp5326: this panel separates schema validity, semantic correctness, wrong-valid-output rate, and tool/action reachability."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Run from {project_root} on {date}. This task runs only if Exp5351 proves a clean structured protocol. Constraint-tax and tool-calling-suppression papers warn that valid-looking constrained outputs can be semantically wrong or suppress action/tool selection.

      EXISTING CODE TO READ FIRST:
      - CODEX.md
      - CLAUDE.md
      - scripts/experiment_template.py
      - research-references.md
      - results/experiment_5351_trigger_constrain_structured_protocol_v488.json
      - results/experiment_5325_theoria_rewrite_state_fixture_v486.json
      - results/experiment_5326_gated_sota_paraphrase_rewrite_smoke_v486.json
      - python/carnot
      - tests/python

      TASK:
      Run a bounded local SOTA panel that measures constraint tax and tool/action reachability separately from parse success. This is not a headline SOTA quality benchmark.

      Deliverable: `results/experiment_5352_constraint_tax_tool_action_panel_v488.json`.

      CONCRETE STEPS:
      0. PRECONDITIONS: confirm Exp5351 `structured_protocol_clean`, selected model/backend, GPU visibility, model cache, and deterministic fixtures.
      1. Define MODEL_SPECS in the artifact:
         - unsloth/Qwen3.6-35B-A3B-GGUF
         - unsloth/gemma-4-31B-it-GGUF
         - unsloth/gemma-4-26B-A4B-it-GGUF
      2. Use the Exp5351 protocol on 8-12 fixed prompts covering schema-only traps, semantically wrong but valid JSON, invalid premise preservation, citation/provenance preservation, and tool/action choice.
      3. Score parse validity, schema validity, semantic correctness, wrong-valid-output rate, tool/action reachability, and two-pass repair deltas with deterministic fixtures.
      4. Record parse failures separately from semantic failures. Set `constraint_tax_panel_ready` true only if all planned rows ran and were scored.
      5. Keep `headline_quality_claim` false regardless of scores.

      REQUIRED ARTIFACT FIELDS:
      - experiment_id: principle: Stable id ties the artifact to this roadmap task.
      - milestone: principle: Prevents protocol-clean evidence from being mixed with older flagged runs.
      - status: principle: Lets gates distinguish completed panel from blocked protocol.
      - honest_verdict: principle: Terminal prefix `complete:` or `blocked_` prevents ambiguous downstream capstone synthesis.
      - inference_substrate: principle: Expected value is live_llm_inference for local GGUF generation.
      - MODEL_SPECS: principle: Confirms the mandated local SOTA GGUF models were in scope.
      - preconditions_checked: principle: Records runtime/model/fixture checks before inference.
      - selected_model_spec: principle: Identifies which mandated model produced outputs.
      - prompt_count: principle: Bare integer makes the bounded scope explicit.
      - parse_success_rate: principle: Bare numeric syntax metric prevents conflating parse with correctness.
      - schema_validity_rate: principle: Bare numeric schema metric catches malformed constrained output.
      - semantic_correctness_rate: principle: Bare numeric correctness metric captures the real verifier target.
      - wrong_valid_output_rate: principle: Bare numeric metric is the core constraint-tax failure mode.
      - tool_action_reachability_rate: principle: Bare numeric metric detects suppressed tool/action choices.
      - two_pass_repair_delta: principle: Bare numeric metric tests whether repair mitigates the tax.
      - unsafe_false_accepts: principle: Bare integer prevents invalid outputs from being counted as wins.
      - headline_quality_claim: principle: Bare boolean must be false because this is a bounded diagnostic.
      - constraint_tax_panel_ready: principle: Bare boolean gates capstone interpretation.
      - tests_run: principle: Lists deterministic scoring checks.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5353-tokenprob-feature-audit-corrigendum-v488
    milestone: "2026.07.488"
