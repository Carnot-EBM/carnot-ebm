    prompt: |
      CONTEXT:
      FR-11 requires continuous self-learning. Exp5382 satisfied the .490 requirement on a real dependency/drift verifier workflow, but it did not yet expose a controller that routes verifier budget by influence and uncertainty.

      EXISTING CODE TO READ FIRST:
