      - {project_root}/python/carnot/experiment_5853_paired_embedding_integrity_audit.py
      - {project_root}/openspec/capabilities/constraint-verification/spec.md
      - {project_root}/openspec/capabilities/phase3-kona/spec.md

      TASK
      Fit a Universal Activation Bus on the immutable Exp5852 corpus. MODEL_SPECS must preserve all three mandated model identities: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Use one linear encoder-decoder pair per model, a fixed shared dimension, unlabeled matched-row alignment, and preregistered task-family, perturbation-family, and template folds. Do not load an LLM, generate text, use exact labels for representation fitting, or train an energy head.

