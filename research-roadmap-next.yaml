  - id: exp5259-sota-gguf-gpu-offload-preflight-v481
    milestone: "2026.07.481"
    title: "PHASE 0 runtime unblock -- mandated SOTA GGUF llama.cpp GPU-offload preflight"
    priority: critical
    track: infrastructure
    deliverable: results/experiment_5259_sota_gguf_gpu_offload_preflight_v481.json
    prior_failures:
      - experiment_id: exp5249-cross-model-typed-memory-v480
        verdict: "blocked_llama_cpp_gpu_offload: cross-model typed memory usefulness was not measured because the mandated local SOTA GGUF runtime did not reach a valid GPU-offload inference path."
        addressed_by: "This task isolates the runtime/GGUF/offload blocker before any memory-quality claim is attempted."
        retire_if_same_verdict: true
      - experiment_id: exp2848-llama-cpp-gpu-offload-precondition
        verdict: "blocked_llama_cpp_gpu_offload: cached SOTA pair setup failed before headline inference could run."
        addressed_by: "This task uses the current mandated model set, explicit GGUF/llama.cpp receipts, and a preflight-only no-quality-claim artifact."
        retire_if_same_verdict: true
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 45
    prompt: |
      CONTEXT:
      Repo at {project_root}, run on or after {date}. .480 exp5249 and exp5250 were blocked by local SOTA GGUF runtime/GPU-offload issues, so no cross-model typed-memory or verifier-dose claim was measurable. This task is a runtime preflight only: it must not claim model quality, memory usefulness, or verification uplift.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - scripts/conductor_gates.py
      - tests touching cached_sota_pair, GGUF loading, or local inference helpers
      - results/experiment_5249_cross_model_typed_memory_v480.json if present
      - results/experiment_5250_verifier_dose_scheduler_v480.json if present
      - research-hardware-wishlist.md
      - ops/status.md
      - ops/exclusion_manifest.yaml

      TASK:
      Build and run a strict preflight for the mandated local SOTA GGUF inference path. The goal is to decide whether .481 LLM-dependent tasks may run with headline SOTA models or must be skipped through structured gates.

      CONCRETE STEPS:
      1. Step 0 PRECONDITIONS: record GPU visibility, driver/CUDA/runtime receipts, llama.cpp or llama-cpp-python version, GGUF cache paths, free disk, and whether each mandated model is locally resolvable without using AutoTokenizer on a GGUF repo.
      2. MODEL_SPECS for preflight:
         - unsloth/Qwen3.6-35B-A3B-GGUF as flagship_moe
         - unsloth/gemma-4-31B-it-GGUF as flagship_dense
         - unsloth/gemma-4-26B-A4B-it-GGUF as middle_moe
         Tiny legacy models may be used only as CPU smoke tests and must be labeled smoke_test_not_headline.
      3. Prefer the repo's cached_sota_pair() or current local helper pattern. If helper code needs a small fix outside scripts/research_conductor.py, make the minimal change and add focused tests.
      4. For each available mandated model, test GGUF file discovery, metadata read, vocab/tokenization path, minimal prompt construction, and a tiny deterministic generation or dry-run load when safe. Record n_gpu_layers/offload settings and any failure traceback.
      5. Do not fall back to transformers AutoTokenizer for GGUF repositories. Do not convert GGUF models. Do not download excessive artifacts without checking local cache conventions.
      6. Emit sota_runtime_ready=true only if at least one mandated SOTA model completes a reproducible local inference/load path suitable for downstream headline experiments. Otherwise emit sota_runtime_ready=false with the exact blocker.
      7. Run focused unit or smoke tests for any changed runtime helper.
      8. Write results/experiment_5259_sota_gguf_gpu_offload_preflight_v481.json with REQUIRED ARTIFACT FIELDS:
         - honest_verdict: object with value/principle; value must start with complete: or blocked_ and state whether SOTA runtime is ready.
         - inference_substrate: object with value/principle; use llama_cpp_runtime_preflight_no_quality_claim.
         - preconditions_checked: object with value/principle.
         - sota_runtime_ready: bare bool gate field for exp5260/exp5262/exp5263.
         - sota_runtime_ready_principle: string explaining the gate.
         - model_receipts: object with per-model status, path/checksum where available, command/config, outcome, and principle.
         - gpu_offload_receipts: object with driver/device/offload settings and principle.
         - no_quality_claim: object with value=true and principle.
         - tests_run: list with command/outcome.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5260-cross-model-typed-memory-retry-v481
