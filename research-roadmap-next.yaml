  per_unit_rows: true
  milestone: 2026.09.675
  deliverable: results/experiment_7753_v675_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  agent_type: claude
  model: opus
  prior_failures:
  - experiment_id: exp7726-contract-methods
    verdict: complete_disqualified_v673_contract_validation
    addressed_by: Use the completed V674 contract implementation and new independent fourteen-row contract;
