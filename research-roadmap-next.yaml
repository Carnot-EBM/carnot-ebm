  # ---- P0.1: THE single most important experiment in the project -----------
  - id: exp3312-energy-descent-vs-autoregressive-premise-v1
    operator_override: "2026-05-29 operator directive (standing): P0.1 is the hand-authored Phase-3 de-risking experiment in ops/known-issues.md; scope-match vs exp1222/exp1210/exp1165 is the intended supersession (toy predecessors -> real-task head-to-head), not a doomed rerun."
    prior_failures:
      - experiment_id: exp1222-phase5a-insitu-prototype
        verdict: "complete: toy 5x5 synthetic puzzle prototype; stability gates passed"
        addressed_by: "exp1222 ran energy-descent on toy 5x5 synthetic puzzles and only measured stability, never head-to-head accuracy vs an autoregressive baseline on a REAL task. This task runs the head-to-head on a real reasoning benchmark (GSM8K subset >=200) — the only test of the premise the Phase-3 endgame rests on."
        retire_if_same_verdict: false
      - experiment_id: exp1210-phase4-bfs-intractable-puzzles-v2
        verdict: "complete: BFS tie (downgraded); synthetic advantage only on BFS-intractable puzzles"
        addressed_by: "exp1210 produced a BFS tie on synthetic puzzles. This task uses a REAL reasoning task with an apples-to-apples AR baseline of comparable parameter count, paired per-problem, with a falsifiable superiority/non-inferiority gate."
        retire_if_same_verdict: true
      - experiment_id: exp1165-phase4-active-inference-pilot-v1
        verdict: "complete: ARC-AGI-3-CLASS result on 5x5 synthetic (74.7% action reduction)"
        addressed_by: "exp1165 was a synthetic 5x5 toy, not a real benchmark and not vs an AR baseline. This task is real-task, AR-compared, paired-significance."
        retire_if_same_verdict: true
    milestone: "2026.05.315"
    title: "Energy-Descent Reasoning vs Autoregressive Baseline — the Kona premise test (P0.1)"
    priority: critical
    max_turns: 100
    model: opus
    agent_type: claude
    requires_claude: true   # (1) gemini has never trained the energy-descent substrate to beat AR (toy predecessors stalled); (2) 5+ files: boltzmann_gpt.py + continuous_ebm.py + verifier energy + corpus loader + AR baseline + paired stats; (3) open-ended judgment on refinement schedule + compute parity that no deterministic gate substitutes for.
    estimated_wall_time_min: 120
    track: evidence
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: "results/experiment_3312_energy_descent_vs_autoregressive_premise_v1.json"
    prompt: |
      CONTEXT: The entire Phase-3 / Kona endgame assumes energy-descent reasoning
      on continuous latents is BETTER than autoregressive (AR) token sampling.
      That premise has NEVER been tested on a real task vs a real AR baseline —
      only toy 5x5 puzzles (exp1222) and a downgraded BFS tie (exp1210). This is
      P0.1: the single most important experiment in the project. Either outcome is
      high-value — validation greenlights Phase 3; refutation honestly retires the
      foundation-model endgame and saves years. CUDA recovered 2026-05-28, so the
      compute blocker that justified deferring this is gone.

      EXISTING CODE TO READ FIRST:
        - python/carnot/phase3/boltzmann_gpt.py (continuous-latent refinement substrate)
        - python/carnot/phase3/continuous_ebm.py (latent EBM)
        - python/carnot/phase3/active_inference_pilot.py (exp1165 toy predecessor)
        - scripts/experiment_template.py (cached_sota_pair, BatchedInferenceRunner)
        - data/ for a GSM8K subset; ops/known-issues.md exp3312 spec (authoritative)

      TASK: Run a paired head-to-head: energy-descent reasoning vs an AR baseline
      of comparable parameter count, on a REAL reasoning benchmark, with a
      falsifiable significance gate.

      PRECONDITIONS (step 0, before any inference — emit blocked_* and STOP if any fail):
        a. CUDA available: python -c "import torch; assert torch.cuda.is_available()".
           If not -> honest_verdict blocked_cuda_unavailable.
        b. The continuous-latent refinement substrate (boltzmann_gpt / continuous_ebm)
           is trainable. If not -> blocked_energy_descent_substrate_unavailable.
        c. A real reasoning corpus with ground-truth labels (GSM8K subset >=200,
           or ARC-AGI-1 train). If not -> blocked_real_task_corpus_missing.
        d. An AR baseline of comparable parameter count runnable on the same corpus.
           If not -> blocked_ar_baseline_unavailable.

      CONCRETE STEPS:
        1. Pick a real reasoning task with binary pass/fail (recommend a GSM8K
           subset, n>=200, held-out). Document the exact split + seed.
        2. AR condition: the base model answers each problem autoregressively
           (greedy or fixed-temp). Record per-problem pass/fail. Use
           MODEL_SPECS = ["unsloth/Qwen3.6-35B-A3B-GGUF"] for the AR baseline.
        3. Energy-descent condition: the continuous-latent refinement substrate
           solves each problem via bounded-depth iterative refinement on the latent
           guided by the verifier energy (REQ-KONA-001/002 reasoning mode),
           decoding to an answer only at the coda. SAME problems (paired),
           comparable compute.
        4. Compute accuracy for each condition + the paired delta with a
           significance test (McNemar or paired bootstrap CI).
        5. Emit results with all REQUIRED ARTIFACT FIELDS.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="Terminal verdict must start with complete:/success:/passed:/shipped_."
        inference_substrate: value=live_llm_inference
        task_name: principle="name the real benchmark + split; toy/synthetic is NOT acceptable for this test."
        n_problems: principle=">=200 for a CLT-valid accuracy delta."
        ar_baseline_accuracy: principle="the autoregressive control; same problems, comparable compute."
        energy_descent_accuracy: principle="the non-AR condition; the premise under test."
        accuracy_delta: principle="energy_descent minus AR — the headline."
        paired_significance: principle="McNemar/bootstrap p-value or CI; an unpaired or n<200 delta is gameable."
        compute_parity_note: principle="state the param-count + inference-compute of each condition so the comparison is apples-to-apples, not a bigger-model win."
        random_seed: principle="determinism precondition for reproducibility."
        reproducibility_checksum: principle="content hash of corpus+substrate+seed."
        duration_s: principle="real training+inference takes wall time; 60s floor."

      ACCEPTANCE GATES:
        - condition: "energy_descent_accuracy >= ar_baseline_accuracy AND paired_significance favors non-inferiority"
          principle: "G1 PREMISE-VIABLE: energy-descent at least matches AR on a real task."
        - condition: "accuracy_delta > 0 with paired p < 0.05"
          principle: "G2 PREMISE-VALIDATED: energy-descent SIGNIFICANTLY beats AR — the justification for the entire foundation-model endgame."

      TERMINAL VERDICTS (all start with complete:):
        - G2 passes -> "complete: energy_descent_beats_ar_premise_validated"
        - G1 passes, G2 fails -> "complete: energy_descent_viable_not_superior_at_scale"
        - G1 fails -> "complete: energy_descent_below_ar_premise_unsupported_at_scale"
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3312_energy_descent_vs_autoregressive_premise_v1.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  # ---- P0.2: the alpha_t grounding keystone (self-learning depth) ----------
  - id: exp3313-verifier-ensemble-lambda-min-diversity-audit-v1
    operator_override: "2026-05-29 operator directive (standing): P0.2 is the hand-authored alpha_t-grounding keystone audit in ops/known-issues.md; scope-match vs exp1224 is the intended supersession (k=3 collapse -> deliberately disjoint-kernel larger-k audit), not a doomed rerun."
    prior_failures:
      - experiment_id: exp1224-phase5c-adversarial-probe
        verdict: "complete: k=3 ensemble pairwise_max_correlation=1.0 — effective ensemble collapsed k=3 -> k=1"
        addressed_by: "exp1224 showed a k=3 ensemble collapsed to effective k=1 (verifiers perfectly correlated via the shared decoder). This task measures lambda_min(Sigma) + participation-ratio effective-k on a DELIBERATELY disjoint-kernel suite (structural / empirical / semantic / anti-vacuity / memory classes) at larger k, to test whether real diversity is recoverable or the collapse is intrinsic. The FoVer headline (exp2837) corroborates the risk: 3 of its 4 verifiers showed ZERO learning contribution."
        retire_if_same_verdict: true
    milestone: "2026.05.315"
    title: "Verifier-Ensemble Joint-Null-Space / lambda_min(Sigma) Diversity Audit (P0.2)"
    priority: critical
    max_turns: 40
    agent_type: gemini
    model: gemini-3.1-pro-preview
    estimated_wall_time_min: 45
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: true
    deliverable: "results/experiment_3313_verifier_ensemble_lambda_min_diversity_audit_v1.json"
    prompt: |
      CONTEXT: alpha_t grounding — the keystone that lets a self-correcting model
      avoid self-distillation collapse — only holds if the verifier ensemble has
      real diversity (a small joint null space). exp1224 showed k=3 collapsing to
      effective k=1, and the FoVer headline (exp2837) showed 3 of its 4 verifiers
      contributing zero. If a deliberately disjoint-kernel suite ALSO collapses,
      the grounding precondition of the entire self-improvement thesis fails. This
      is cheap (verifier scoring, reuses the FoVer corpus) and directly tests the
      keystone — it is the milestone's continuous-self-learning depth experiment.

      EXISTING CODE TO READ FIRST:
        - python/carnot/verify/ (the verifier suite; label each by kernel class)
        - data/fover_corpus.jsonl (the cached candidate corpus)
        - results/experiment_2837_fover_memory_leakage_v3.json (the 3-of-4-zero pattern)
        - ops/known-issues.md exp3313 spec (authoritative)

      TASK: Measure lambda_min(Sigma), effective-k (participation ratio), and
      per-verifier drop-one-out contribution on the broadest disjoint-kernel
      verifier suite, on FoVer + an adversarial/OOD slice.

      PRECONDITIONS (step 0):
        a. FoVer corpus present (data/fover_corpus.jsonl) + an adversarial/OOD
           slice. If not -> blocked_corpus_missing.
        b. The verifier suite is callable in batch over cached candidates with a
           configurable verifier set. If not -> blocked_verifier_suite_uncallable.
        c. CUDA available for any model-based verifiers. If not, run CPU-only
           verifiers and record which were skipped (do NOT silently drop them).

      CONCRETE STEPS:
        1. Assemble the broadest available verifier set, labeled by kernel class
           (structural: Z3/AST; empirical: PBT/execution; semantic: ThinkPRM/
           semantic-cosine; anti-vacuity: liveness/coverage; memory: fr11).
        2. Score every verifier on FoVer + the adversarial slice; build the k x k
           verifier-DECISION covariance matrix Sigma.
        3. Compute: lambda_min(Sigma); the full pairwise-correlation matrix;
           effective-k via participation ratio (sum(lambda)^2 / sum(lambda^2));
           per-verifier marginal contribution (drop-one-out AUROC delta).
        4. Identify which verifiers share a null space (high pairwise correlation,
           zero drop-one-out contribution — the exp2837 "3-of-4 contribute zero").
        5. Emit results with all REQUIRED ARTIFACT FIELDS.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="complete:/success:/passed:/shipped_ prefix."
        inference_substrate: value=verifier_ensemble_against_cached_candidates
        k_verifiers: principle="how many verifiers in the audited suite."
        lambda_min_sigma: principle="smallest eigenvalue of the decision covariance; the joint-null-space proxy. Zenil-stack threshold is >0.1."
        pairwise_max_correlation: principle="the exp1224 collapse signature; near-1.0 means redundancy."
        effective_k_participation_ratio: principle="how many verifiers ACTUALLY contribute independent signal vs nominal k."
        per_verifier_dropout_contribution: principle="drop-one-out AUROC delta per verifier; zero means that verifier is null."
        n_examples: principle=">=1000 for a stable covariance estimate."
        random_seed: principle="determinism."
        reproducibility_checksum: principle="content hash."
        duration_s: principle="verifier scoring; 1s floor."

      ACCEPTANCE GATES:
        - condition: "lambda_min_sigma > 0.1 AND effective_k_participation_ratio >= 3"
          principle: "G1 GROUNDING-HOLDS: the ensemble has real diversity, so the alpha_t grounding signal that prevents self-distillation collapse survives at production k."

      TERMINAL VERDICTS (all start with complete:):
        - G1 passes -> "complete: verifier_ensemble_diversity_sufficient_grounding_holds"
        - G1 fails -> "complete: verifier_ensemble_null_space_collapse_confirmed_grounding_at_risk"
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3313_verifier_ensemble_lambda_min_diversity_audit_v1.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  # ---- Kona solve-rate correctness gate (concrete instance of P0.1) --------
  - id: exp3417-kona-global-opt-correctness-gate-v1
    prior_failures:
      - experiment_id: exp3408-kona-global-opt
        verdict: "SUCCESS but solved_sudoku=False (energy plateaued at 10, not 0)"
        addressed_by: "Re-gated on SOLVE-RATE not time. STEP 0a (encoding validity: a known-valid solved board MUST give E==0) and STEP 0b (easy-tier sanity) are mandatory and gating BEFORE any optimization. Diagnoses the energy~10 plateau as local-minimum vs representational and tests an optimizer ladder (annealing, random restarts, parallel tempering, constraint-aware block moves, Lagrangian penalties). Forbids the fast-but-wrong timing framing exp3408 invited."
        retire_if_same_verdict: true
      - experiment_id: exp3394-kona-style-global-optimization
        verdict: "unspecified (no solve-rate gate; timing-only framing)"
        addressed_by: "Same correctness-first re-gating as above; the prior task measured time without ever verifying a valid solution on the board."
        retire_if_same_verdict: true
    milestone: "2026.05.315"
    title: "Kona global-optimization solve-rate gate (correctness-first)"
    priority: critical
    max_turns: 60
    agent_type: gemini
    model: gemini-3.1-pro-preview
    estimated_wall_time_min: 60
    track: evidence
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: "results/experiment_3417_kona_global_opt_correctness_v1.json"
    prompt: |
      CONTEXT: exp3408 ran Kona-style global optimization on hard Sudoku:
      initial_energy=2104 -> final_energy=10.05 over 50,000 steps,
      time_to_solution=14.1s vs autoregressive 212.2s — but solved_sudoku=False
      (final energy 10, not 0 = constraints still violated). The implied ~15x
      "speedup over autoregressive" is fast-but-wrong-vs-slow: meaningless. A
      speedup claim is invalid until the method actually SOLVES. This is the
      cleanest concrete testbed for P0.1: if Carnot's Ising energy can't solve
      hard Sudoku via global optimization, that is load-bearing evidence about the
      non-AR-reasoning endgame.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3408_kona_global_opt.json (the plateau-at-10 result)
        - python/carnot/samplers/adaptive_ising.py (parallel tempering / replica exchange)
        - python/carnot/phase3/scrambled_grid_puzzle.py + snap_validity.py
        - ops/known-issues.md exp34NN Kona correctness-gate spec (authoritative)

      TASK: Re-gate Kona global-opt on SOLVE-RATE (valid board, final_energy==0
      verified on the BOARD), not time. STEP 0 is mandatory and gating.

      CONCRETE STEPS (STEP 0 IS MANDATORY AND GATING — run BEFORE any optimization):
        0a. ENCODING VALIDITY (hard precondition): encode a KNOWN-VALID solved
            Sudoku board into the Ising energy and assert E == 0 (within float eps).
            If a correct solution does NOT give E==0, the energy formulation is
            wrong (missing constraint / unbalanced penalty weights) — STOP, write
            honest_verdict: blocked_energy_encoding_invalid with the per-constraint
            residual-energy breakdown, and do NOT run any optimization.
        0b. EASY-TIER SANITY: before any HARD puzzle, confirm the current optimizer
            solves EASY boards (many clues, near-fully-constrained). If it cannot
            solve easy, the failure is REPRESENTATIONAL (energy/encoding), not
            optimizer power — report that and do NOT climb the optimizer ladder.
        1. Only if 0a passes (E==0 on a valid board) AND 0b solves easy: run the
           optimizer ladder (slower annealing -> random restarts (K parallel inits)
           -> parallel tempering / replica exchange (adaptive_ising.py) ->
           constraint-aware block moves -> adaptive penalty weights / Lagrangian),
           reporting solve_rate by difficulty AND by optimizer_variant. Use
           MODEL_SPECS = ["unsloth/gemma-4-26B-A4B-it-GGUF"] only if an LLM proposal
           step is part of the hybrid; the core optimizer is the Ising sampler.
        2. Characterize the energy~10 plateau: report n_violated_constraints at the
           plateau (a few cells = 'almost solved', optimizer-fixable; pervasive =
           representational).
        3. If pure energy descent still can't close the last violations, test the
           energy-guided + constraint-propagation hybrid (energy proposes; Carnot's
           Z3/AST/arc-consistency verifiers clean up residual violations) and report
           its solve_rate separately — narrows the claim honestly from
           'energy replaces search' to 'energy is a global heuristic' if only the
           hybrid solves.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        encoding_validity_E0: principle="E of a known-valid solved board MUST be 0 (Step 0a); if not, energy is mis-specified — gating precondition; report per-constraint residual when it fails."
        easy_tier_solve_rate: principle="must solve EASY boards (Step 0b) before any hard-board claim; near-0 means representational failure, not optimizer power."
        n_violated_constraints_at_plateau: principle="distinguishes 'almost solved' (a few cells) from pervasive infeasibility; exp3408 plateaued at energy 10.05."
        hybrid_solve_rate: principle="solve_rate of the energy-guided + constraint-propagation path (Step 3), reported separately so the claim is honest."
        solve_rate: principle="fraction of puzzles reaching a VALID solution (final_energy==0 verified on the BOARD). This is the gate; time is meaningless without it."
        n_puzzles: principle=">=20 puzzles across difficulty tiers; solve_rate on n<20 is not headline-eligible."
        solve_rate_by_difficulty: principle="report per-tier so partial capability is visible."
        time_to_solution_solved_only: principle="timing reported ONLY for solved instances; any speedup-vs-AR claim is valid ONLY on the solved subset."
        optimizer_variant: principle="which fix was applied (vanilla/annealed/restarts/tempering) so the plateau diagnosis is auditable."
        honest_verdict: principle="Terminal verdict must start with complete:/success:/passed:/shipped_."

      ACCEPTANCE GATES:
        - condition: "STEP 0a passes (a known-valid solved board gives E==0) BEFORE any optimization solve-rate is reported"
          principle: "an optimization solve-rate against a mis-specified energy is meaningless; forks the strategy (fix encoding vs fix optimizer)."
        - condition: "solve_rate reported on >=20 puzzles; speedup claimed ONLY on solved subset"
          principle: "kills the fast-but-wrong framing exp3408 invited."
        - condition: "if solve_rate ~0 even with optimizer fixes -> honest verdict that the current Ising energy formulation cannot do hard-Sudoku global reasoning yet; retire the 'global-opt beats AR' timing claim"
          principle: "an honest negative here is a real P0.1 datapoint, not a failure."

      TERMINAL VERDICTS (all start with complete:):
        - 0a fails -> "complete: blocked_energy_encoding_invalid_per_constraint_residual_reported" (treated as honest finding)
        - solves hard tier -> "complete: kona_global_opt_solves_hard_sudoku_solve_rate_reported"
        - only hybrid solves -> "complete: energy_is_global_heuristic_hybrid_solves_pure_descent_does_not"
        - solve_rate ~0 -> "complete: ising_energy_cannot_do_hard_sudoku_global_reasoning_yet"
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3417_kona_global_opt_correctness_v1.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  # ---- Ensemble vs adaptive prompt-injection (architecturally-honest test) -
  - id: exp3418-verifier-ensemble-vs-adaptive-injection-corpus-v1
    operator_override: "2026-05-28 operator directive (known-issues.md NEW 2026-05-28): architecturally-honest ensemble test on the exp3273 held-out corpus; scope-match vs exp3273 is the intended supersession (single KAN sidecar -> full k=15 cross-mechanism ensemble), not a doomed rerun."
    prior_failures:
      - experiment_id: exp3273-prompt-injection-kan-full-corpus-delong-eval-v1
        verdict: "complete: full_corpus_auroc=0.475326; delong_noninferiority_passed=false; retire_from_prompt_injection_headline"
        addressed_by: "exp3273 tested a SINGLE distilled KAN sidecar, which collapsed to random (0.475) on the adaptive corpus. This task tests the FULL k=15 cross-mechanism verifier ensemble (AND-composition + energy-rank scoring) on the SAME held-out corpus — a structurally different approach (ensemble vs lone sidecar) per CLAUDE.md Spera/Welch joint-null-space theory. Hypothesis: cross-mechanism diversity covers the surface-feature null space a single KAN falls into. If the ensemble also lands ~0.475, the single-axis stall extends to the ensemble on the injection domain and the ensemble-replacement path retires too."
        retire_if_same_verdict: true
    milestone: "2026.05.315"
    title: "Verifier-Ensemble vs Adaptive Prompt-Injection Corpus v1"
    priority: high
    max_turns: 50
    agent_type: gemini
    model: gemini-3.1-pro-preview
    estimated_wall_time_min: 60
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: true
    deliverable: "results/experiment_3418_verifier_ensemble_vs_adaptive_injection_corpus_v1.json"
    prompt: |
      CONTEXT: A SINGLE distilled 16-knot KAN sidecar collapsed to AUROC 0.475
      (random) on the full 15k adaptive prompt-injection corpus (exp3273), DeLong
      non-inferiority rejected, leakage audit passed -> genuine capability ceiling.
      But the sidecar was never Carnot's thesis — the thesis is the k=15
      cross-mechanism verifier ensemble where AND-composition shrinks the joint
      null space exponentially (Spera Theorem 9.2 / Welch-ceiling). The open
      question: does the full ensemble beat a single verifier on the SAME adaptive
      corpus, where any one mechanism fails? This reuses the exp3273 held-out
      corpus + DeLong harness — no new corpus assembly or teacher labeling needed.

      EXISTING CODE TO READ FIRST:
