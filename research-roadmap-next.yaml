    Produce results/experiment_7409_v650_evidence_custody.json. Create scripts/experiments/experiment_7409_v650_evidence_custody.py as a thin entrypoint. Put reusable behavior in python/carnot/experiment_7409_v650_evidence_custody.py or the explicitly named shared module. Add tests/python/test_experiment_7409_v650_evidence_custody.py and affected shared-module tests. These new paths are deliverables to create.
    Structured prerequisites:
    No whole-task structured gate. Authenticate branch inputs locally; unavailable branches cannot promote science.

    CONCRETE STEPS:
    1. Emit a flushed progress line immediately, at EVERY phase boundary, and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Print completed units and monotonic elapsed INSIDE every long loop at least every 60 seconds. Stream child output unbuffered. Emit truthful pending-operation heartbeats every 60 seconds during blocking calls, authoring and validation. Keep every silence gap below 600 seconds: silent work can die at 1200 seconds; progress permits the 4800-second hard cap. Checkpoint completed units and cancel only owned processes. Never sleep to satisfy a duration floor.
    2. PRECONDITIONS: Read the relevant capability spec and confirm REQ-* requirements. Extend the spec and add meaningful failing spec-linked tests before implementation. Authenticate input identities and eligibility. New deliverables named below are outputs to create, not missing preconditions. Read future task artifacts only after those tasks execute. Reuse narrow shipped helpers; never copy an entire old experiment launcher.
