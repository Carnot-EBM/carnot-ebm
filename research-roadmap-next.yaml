    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.680. V679 has nine artifacts: two circular-positive, four disqualified and three blocked; five science outputs are absent. Queue completion is not scientific acceptance.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
