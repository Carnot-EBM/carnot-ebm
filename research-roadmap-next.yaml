    2. Add REQ-LEARN-051 (PSV real self-play: K=2 parallel chains, 10 iterations each,
       live GPU, FP rate trend non-increasing), REQ-LEARN-052 (parallel chain merge:
       constraint updates from both chains are merged without conflict),
       SCENARIO-LEARN-084/085/086 to spec.md.
    3. Extend python/carnot/training/psv_selfplay.py:
       a. PSVParallelChains class:
          __init__(self, n_chains: int, n_iterations: int, n_questions_per_iter: int,
                   constraint_memory: JitRLConstraintMemory):
          run_parallel(self, question_pool: list[str], inference_fn, verify_fn) -> dict:
            Split question_pool into n_chains subsets.
            Use ThreadPoolExecutor(max_workers=n_chains):
              For each chain: PSVSelfPlayLoop(n_iterations, n_questions_per_iter,
                              constraint_memory).run_iteration() x n_iterations.
            Merge: aggregate all violation pairs from both chains into shared memory.
            Return: {"chain_results": list, "merged_constraint_updates": int,
