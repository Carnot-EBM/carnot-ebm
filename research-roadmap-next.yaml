  - id: exp380-humaneval-live-execute
    milestone: "2026.06.03"
    deliverable: results/experiment_380_humaneval_execute.json
    title: "Exp 380: Live HumanEval code verification execution — 50 problems, CodeExtractor + PBT"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: scripts/experiment_369_humaneval_live.py is a complete, tested benchmark script
      (69 tests pass) for HumanEval code verification with CodeExtractor + PBT. It was blocked
      in milestone 2026.05.27 because CARNOT_FORCE_LIVE was never set. Exp 226 showed +3.0pp
      (19/164 → 24/164) on a prior live run. Code verification uses EXECUTION not regex — it
      should work on instruction-tuned models (unlike arithmetic extraction).

      This is Carnot's most reliable result domain: CodeExtractor verifies via execution, not
      pattern matching. The PBT pass catches bugs that official tests miss.

      EXISTING CODE TO READ FIRST:
      - scripts/experiment_369_humaneval_live.py — the existing benchmark script (READ CAREFULLY)
      - python/carnot/pipeline/extract.py — CodeExtractor
      - python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate (Exp 377)
      - scripts/experiment_template.py — ExperimentTemplate.setup_gpu()
      - results/experiment_369_humaneval_live.json — prior blocked result (for schema reference)

      TASK: Execute live HumanEval code verification benchmark.
      1. Read CLAUDE.md spec-first workflow.
      2. No new spec changes needed (SCENARIO-BENCH-021 from Exp 369 covers this).
      3. Write tests FIRST (100% coverage) for any NEW helper functions only.
      4. Implement scripts/experiment_380_humaneval_execute.py:
         a. ExperimentTemplate(380, "Live HumanEval code verification",
            "results/experiment_380_humaneval_execute.json", requires_gpu=True)
         b. tmpl.setup()
         c. blocked = LiveGPUGate.require_live_or_blocked(tmpl, ["google/gemma-4-E4B-it"])
