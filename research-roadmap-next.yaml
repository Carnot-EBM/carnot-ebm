milestone: "2026.08.574"
milestone_title: "Audited Constraint-First Learning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6588-v574-bounded-cfr-launch-root
    milestone: "2026.08.574"
    deliverable: results/experiment_6588_v574_bounded_cfr_launch_root.json
    title: "V574 bounded CFR launch root"
    priority: critical
    track: evidence-infrastructure
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 60
    operator_override: "2026-05-29 operator directive (standing): versioned lineage continuation — false-positive scope-match vs earlier launch and method contracts; V574 replays terminal V573 receipts and owns a new same-roadmap gate map without repeating model inference."
    prompt: |
      CONTEXT
      Milestone 573 ended with a complete bounded-execution contract, a blocked isolated-suite receipt, and a complete Constraint-First Reasoning method contract. No V573 flagship CFR stream ran. V574 must replay those terminal facts and create one same-roadmap launch root before either model task starts. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V574 roadmap document
      - {project_root}/results/experiment_6585_v573_terminal_recovery_and_execution_contract.json
      - {project_root}/results/experiment_6586_isolated_full_suite_truth_baseline.json and its adversarial verification artifact
      - {project_root}/results/experiment_6587_v573_constraint_first_method_contract.json
      - {project_root}/scripts/experiment_template.py, roadmap gate helpers, GGUF cache-resolution helpers, GPU ownership helpers, atomic artifact helpers, and their tests
      - relevant evidence, exact-verification, model-ingestion, and continual-learning capability specs; traceability; status; changelog; and {project_root}/ops/e2e-test-plan.md

      TASK
      Build the V574 bounded CFR launch root. Replay the V573 source, method, budget, cleanup, model-cache, exact-authority, and protected-file contracts. Treat the Exp6586 block as an infrastructure fact, not as a scientific launch gate. Perform no LLM inference.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected-file hashes, dirty-worktree status, all three V573 artifact paths and hashes, current roadmap hash, CPU, RAM, disk, local GGUF cache paths, visible GPU ownership, and the no-LLM substrate.
      1. Add or confirm REQ-* and SCENARIO-* anchors for V574 launch replay, same-roadmap gates, one-model residency, periodic checkpoints, timeout cleanup, exact authority, and atomic terminal output. Write focused tests first.
      2. Recompute Exp6585 readiness and Exp6587 method readiness from their raw fields. Preserve Exp6586 honest_verdict, verdict_class, gate_check_summary, and adversarial disposition without converting it to null or GREEN.
      3. Resolve content-derived local GGUF identities for unsloth/Qwen3.6-35B-A3B-GGUF and unsloth/gemma-4-31B-it-GGUF. Do not load either model and do not download during this task.
      4. Freeze one-model residency, runtime-selected idle RTX 3090 ownership, checkpoint interval, hard timeout, child-process cleanup, unload, failure-row, and terminal-artifact rules for Exp6590 and Exp6591.
      5. Freeze the exact same-roadmap gate map. Exp6590 and Exp6591 read only v574_cfr_launch_ready_score from this artifact. Downstream fields must be spelled exactly as written in the owning task's REQUIRED ARTIFACT FIELDS.
      6. Attack an invented V573 science result, a suite-GREEN launch requirement, missing source hashes, two-model residency, legacy smoke models as headline evidence, GGUF AutoTokenizer use, external download during measurement, incomplete terminal rows, and gate-field drift.
      7. Set v574_cfr_launch_ready_score=1.0 only when both V573 contracts replay, both cached model identities resolve, budgets and cleanup close, all gates cross-reference, and protected files remain unchanged.
      8. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, artifact convention checks, adversarial verification, applicable evidence E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6588_v574_bounded_cfr_launch_root.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The launch root is terminal and cannot pose bootstrap work as readiness."
        honest_verdict:
          principle: "The verdict reports bounded V574 launch readiness without creating a science result."
        verdict_class:
          principle: "Use only positive, circular_positive, null, blocked, disqualified, or partial; launch readiness is null infrastructure."
        gate_check_summary:
          principle: "Any blocked outcome names the failed source, cache, budget, gate, or protection check and its value."
        v573_terminal_replay_rows:
          principle: "Exp6585 through Exp6587 retain their actual terminal states and source hashes."
        model_cache_identity_rows:
          principle: "Both mandated flagship caches resolve by content without a model load or download."
        execution_budget_contract:
          principle: "One-model residency, checkpoints, timeout, cleanup, unload, and terminal output are frozen."
        current_roadmap_gate_contract_rows:
          principle: "Every downstream gate names an upstream task and exact field in this roadmap."
        attack_rows:
          principle: "Invented science, suite gating, model substitution, cache drift, and gate drift fail closed."
        v574_cfr_launch_ready_score:
          principle: "This exact binary field gates both flagship CFR stream tasks."
        preconditions_checked:
          principle: "Artifacts, hashes, caches, resources, ownership, and protected files are explicit."
        protected_files_unchanged:
          principle: "research-roadmap.yaml and scripts/research_conductor.py retain their original hashes."
        inference_substrate:
          principle: "The task declares terminal receipt and contract replay with no LLM."
        verifier_is_oracle:
          principle: "Exact receipt replay owns launch readiness but cannot create positive research science."
        field_provenance:
          principle: "Every field names source artifacts, rows, hashes, and reducer code."
        duration_s:
          principle: "Monotonic duration exposes a source-only shortcut."
        tests_run:
          principle: "Named commands, exits, and durations make contract validation reproducible."
        reproducibility_checksum:
          principle: "A final content hash detects terminal mutation."
      Set inference_substrate=v573_terminal_and_contract_replay_no_llm and verifier_is_oracle=true. A ready launch root uses verdict_class=null. Use a terminal honest_verdict prefix complete:, success:, passed:, or shipped: for completed work. A genuine precondition block may use a blocked_* verdict and must populate gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6588_v574_bounded_cfr_launch_root --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6589-isolated-pytest-receipt-remediation
    milestone: "2026.08.574"
    deliverable: results/experiment_6589_isolated_pytest_receipt_remediation.json
    title: "Isolated pytest receipt remediation"
    priority: critical
    track: evidence-infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 90
    model: opus
    prior_failures:
      - experiment_id: exp6586-isolated-full-suite-truth-baseline
        verdict: "blocked_isolated_environment: pytest_receipt"
        addressed_by: "Exp6589 narrows the scope to the malformed receipt contract, writes focused receipt fixtures first, validates the disposable environment before any suite run, and treats a RED suite as measured evidence rather than a block."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6586 attempted an isolated repo-wide suite baseline but ended blocked_isolated_environment: pytest_receipt. Adversarial verification found a nonterminal declared artifact and zero per-test rows. This task repairs that evidence contract without turning suite success into a model launch gate. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V574 roadmap document, and Exp6586's artifact and adversarial report
      - {project_root}/pytest.ini, {project_root}/pyproject.toml, {project_root}/tests/python/conftest.py, and collection configuration
      - {project_root}/scripts/test_suite_mutation_check.py, disposable-worktree helpers, subprocess receipt helpers, process cleanup, atomic output, and their tests
      - relevant test-integrity and evidence capability specs, traceability, status, changelog, and {project_root}/ops/e2e-test-plan.md

      TASK
      Repair and validate the isolated pytest receipt path. Run focused receipt fixtures first. Only after the isolated environment validates, run one bounded disposable-suite measurement. Preserve RED, timeout, mutation, and collection evidence honestly. Never run the full suite in the active worktree.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected hashes, active dirty state, Exp6586 hash and exact failed receipt fields, git revision, Python and pytest versions, plugin set, CPU, RAM, disk, timeout, safe temporary root, and process ownership.
      1. Add or update REQ-* and SCENARIO-* anchors for complete pytest receipts, disposable execution, active-tree non-mutation, RED-as-measured, timeout cleanup, and atomic terminal output. Write focused failing tests before implementation.
      2. Reproduce the malformed Exp6586 receipt with the smallest fixture. Fix command, cwd, environment hash, exit, duration, stdout, stderr, collection, timeout, cleanup, and mutation serialization without changing scientific code.
      3. Build a validated disposable checkout under a resolved temporary directory. Preserve the user's active changes. Never stage, discard, or overwrite them.
      4. Run the focused receipt and mutation fixtures. If they fail, write a terminal blocked artifact with the exact check and observed value; do not launch the full suite.
      5. If isolation validates, run `.venv/bin/python -m pytest tests/python --no-cov -o addopts= -n 0` once in the disposable checkout with a bounded timeout. Preserve one row per failed, errored, skipped, or timed-out test plus collection and family summaries.
      6. Recompute active and disposable tracked hashes. Name every attempted write and leaked child process. A RED exit is a complete measured baseline, not blocked.
      7. Attack active-root execution, omitted dirty content, missing stdout or stderr, fabricated collection, a RED run called GREEN, a timeout called complete, leaked processes, zero rows with a measured claim, and active-tree drift.
      8. Set pytest_receipt_remediation_ready_score=1.0 only when the focused contract passes and any launched suite has a complete terminal receipt. Write atomically and run focused tests, lint, spec coverage, artifact convention checks, adversarial verification, applicable E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6589_isolated_pytest_receipt_remediation.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The task ends as repaired measurement, focused-fixture failure, timeout, or isolated-environment block."
        honest_verdict:
          principle: "The verdict separates receipt repair from the suite's GREEN or RED state."
        verdict_class:
          principle: "Use only positive, circular_positive, null, blocked, disqualified, or partial; receipt repair is null infrastructure."
        gate_check_summary:
          principle: "Any block names the exact isolation or receipt check and observed value."
        rows:
          principle: "Every failed, errored, skipped, or timed-out test remains individually recheckable."
        exp6586_failure_replay:
          principle: "The original malformed receipt and adversarial disposition remain source bound."
        focused_receipt_fixture_rows:
          principle: "Each required receipt field has a positive and negative fixture."
        suite_command_receipt:
          principle: "Command, cwd, environment, exit, duration, stdout, stderr, collection, timeout, and cleanup bind the run."
        disposable_checkout_receipt:
          principle: "Revision, dirty-content patch hash, and validated temporary path prove isolation."
        mutation_rows:
          principle: "Each attempted tracked write has before and after hashes."
        active_worktree_unchanged:
          principle: "The user's tracked hashes and pre-existing dirty state survive unchanged."
        suite_truth_baseline:
          principle: "GREEN, RED, timeout, or not-run follows from raw receipts without affecting science launch."
        pytest_receipt_remediation_ready_score:
          principle: "This binary field states whether the broken receipt contract was repaired."
        attack_rows:
          principle: "Partial, mutating, leaked, zero-row, and falsely green runs fail closed."
        preconditions_checked:
          principle: "Versions, resources, dirty state, process ownership, and safe paths are explicit."
        protected_files_unchanged:
          principle: "Both protected orchestration files retain their original hashes."
        inference_substrate:
          principle: "The task declares isolated deterministic test execution with no LLM."
        verifier_is_oracle:
          principle: "Pytest owns suite state but not positive research science."
        field_provenance:
          principle: "Every field points to raw command, fixture, process, or hash rows."
        duration_s:
          principle: "Monotonic duration exposes collection-only or truncated execution."
        tests_run:
          principle: "Focused validation commands are distinct from the measured full-suite command."
        reproducibility_checksum:
          principle: "A final hash protects the repaired receipt."
      Set inference_substrate=isolated_pytest_receipt_repair_no_llm and verifier_is_oracle=true. A repaired focused contract and honest GREEN or RED measurement use verdict_class=null. A genuine isolation block may use a blocked_* verdict and must populate gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6589_isolated_pytest_receipt_remediation --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6590-qwen36-constraint-first-stream
    milestone: "2026.08.574"
    deliverable: results/experiment_6590_qwen36_constraint_first_stream.json
    title: "Qwen3.6 bounded constraint-first stream"
    priority: critical
    track: constraint-first-model-evidence
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    gated_on:
      - upstream: exp6588-v574-bounded-cfr-launch-root
        artifact_field: v574_cfr_launch_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6581-qwen36-flagship-source-shard
        verdict: "blocked_precondition_failed_without_quality_claim"
        addressed_by: "Exp6590 removes the repo-wide suite from launch checks, runs the already-frozen Exp6587 CFR method instead of the V572 source-shard shape, and writes periodic per-unit checkpoints before any aggregate."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6587 froze direct, always-on CFR, and routed CFR arms over at least 16 exact-checkable units. Exp6581 previously blocked before Qwen quality evidence because a repo-wide suite was used as a precondition. Exp6588 now owns the bounded V574 launch gate. This task generates one immutable Qwen stream and makes no cross-arm headline claim. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, the V574 roadmap document, and {project_root}/scripts/experiment_template.py docstring
      - {project_root}/results/experiment_6587_v573_constraint_first_method_contract.json and {project_root}/results/experiment_6588_v574_bounded_cfr_launch_root.json
      - {project_root}/results/experiment_6581_qwen36_flagship_source_shard.json
      - llama.cpp GGUF runner, cached_sota_pair() pattern, GPU ownership, raw-stage preservation, source binding, exact checker dispatch, token accounting, checkpoint, cleanup, and atomic-output helpers plus tests
      - relevant extraction, exact-verification, model-ingestion, evidence, and continual-learning specs; traceability; status; changelog; and E2E plan

      TASK
      Run the frozen CFR method with unsloth/Qwen3.6-35B-A3B-GGUF in one fresh llama.cpp process. Preserve every direct, Stage 1, Stage 2, exact-check, failure, cost, checkpoint, model, and GPU receipt. Do not tune prompts or sources and do not make a headline comparison.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected hashes, upstream gate value, method and source hashes, exact registry hash, resolved Qwen GGUF identity, llama.cpp version, runtime-selected idle RTX 3090 ownership, VRAM, CPU, RAM, disk, seeds, and budgets. Do not require the repo-wide suite to be GREEN.
      1. Use MODEL_SPECS containing unsloth/Qwen3.6-35B-A3B-GGUF as the headline model. Follow the cached_sota_pair() pattern. Legacy small models may run a CPU smoke only and cannot satisfy readiness.
      2. Add or confirm REQ-* and SCENARIO-* anchors for one-family CFR execution, raw two-stage preservation, exact authority, checkpoints, failure rows, cost, process cleanup, and atomic output. Write focused tests first.
      3. Verify the byte hashes for source units, prompts, router, decoding, seeds, order, budgets, and checkers against Exp6587. Any drift blocks before inference.
      4. Launch one fresh llama.cpp process using the GGUF-embedded tokenizer. Never call AutoTokenizer on the GGUF repository. Record content-derived model identity and actual offload.
      5. For every unit, run matched direct, always-on CFR, and routed CFR arms in the frozen order. Persist raw direct output, raw Stage 1 constraints, raw Stage 2 output, parsed proposals, source spans, exact results, abstention, tokens, latency, and failure before the next unit.
      6. Preserve timeouts, malformed output, contradictions, unsupported constraints, and exact rejection as rows. Never repair output with generated ConstraintIR or a hidden model call.
      7. Checkpoint after every unit. Sample GPU process, memory, and utilization before load, during inference, and after unload. Kill only owned child processes and prove clean unload.
      8. Attack prompt drift, post-outcome unit loss, stage overwrite, answer leakage, uncharged Stage 1 tokens, family-label substitution, legacy-model substitution, aggregate-only output, and a ready score with missing rows.
      9. Set qwen_cfr_rows_ready_score=1.0 only when every expected row and receipt is complete and independently recheckable. Write atomically and run focused tests, lint, spec coverage, artifact convention checks, adversarial verification, applicable model E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6590_qwen36_constraint_first_stream.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The stream ends as complete rows, bounded partial rows, or a named precondition block."
        honest_verdict:
          principle: "The verdict reports Qwen row completeness without claiming CFR benefit."
        verdict_class:
          principle: "Use only positive, circular_positive, null, blocked, disqualified, or partial; a complete source stream is null evidence infrastructure."
        gate_check_summary:
          principle: "Any blocked outcome names the exact gate, cache, resource, drift, or runtime check and value."
        per_unit_rows:
          principle: "Every source unit and arm carries raw stages, exact results, failures, tokens, and latency."
        model_spec_and_identity:
          principle: "The mandated Qwen GGUF spec and content-derived local file identity bind inference."
        prompt_source_router_hashes:
          principle: "The Exp6587 byte-frozen method cannot drift by family or outcome."
        raw_stage_receipts:
          principle: "Direct, Stage 1, and Stage 2 bytes remain separate and immutable."
        exact_checker_receipts:
          principle: "Whitelisted executable checks, not the model, decide validity."
        checkpoint_receipts:
          principle: "Each completed unit survives later timeout or process failure."
        gpu_process_receipts:
          principle: "Ownership, offload, memory, utilization, and clean unload bind the local run."
        failure_rows:
          principle: "Timeouts, parse failures, unsupported constraints, contradictions, and exact rejection remain evidence."
        qwen_cfr_rows_ready_score:
          principle: "This exact binary field gates the independent comparison."
        attack_rows:
          principle: "Drift, leakage, substitution, dropped failures, and aggregate-only claims fail closed."
        preconditions_checked:
          principle: "Gates, hashes, cache, resources, ownership, budgets, and protected files are explicit."
        protected_files_unchanged:
          principle: "Both protected orchestration files retain their original hashes."
        inference_substrate:
          principle: "The task declares fresh local Qwen GGUF inference through llama.cpp."
        verifier_is_oracle:
          principle: "Exact checks define row validity, so later exact wins are circular-positive."
        field_provenance:
          principle: "Every field names source rows, raw bytes, process receipts, and reducer code."
        duration_s:
          principle: "Monotonic duration exposes smoke-only or truncated execution."
        tests_run:
          principle: "Named commands, exits, durations, and focused scope make validation reproducible."
        reproducibility_checksum:
          principle: "A final content hash protects the immutable stream."
      Set inference_substrate=fresh_local_qwen36_gguf_cfr_inference and verifier_is_oracle=true. A complete stream without a quality claim uses verdict_class=null. A bounded incomplete run uses partial or blocked as warranted and must populate gate_check_summary for blocked_* verdicts.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6590_qwen36_constraint_first_stream --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

