  - id: exp375-cikan-energy-tier
    milestone: "2026.05.27"
    deliverable: python/carnot/models/cikan_energy.py
    title: "Exp 375: CIKAN constraint-informed KAN energy tier — hard constraint priors in splines"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: arXiv 2412.03710 (CIKAN) extends KAN with hard physics/constraint priors
      baked directly into spline activations. Instead of learning arbitrary spline shapes,
      CIKAN seeds each edge's spline with known constraint boundaries — regions that
      violate constraints have infinite energy, making them topologically unreachable.

      For Carnot: constraint boundaries from ArithConstraints (carry-check, range-check) can
      seed the KAN spline knot placement. A carry-check constraint has a boundary at the exact
      arithmetic result; splines that cross this boundary get an infinite energy penalty.
      This transforms post-hoc verification (check after generation) into structural prevention
      (model cannot generate configurations that cross constraint boundaries).

      This is the Tier 4 "Adaptive Structure" mechanism from research-program.md — and it has
      a hardware path: FPGA spline LUTs can encode constraint boundaries as hard-wired
      saturation points, making CIKAN the first energy tier designed for FPGA-native execution.

      EXISTING CODE TO READ FIRST:
      - python/carnot/models/kan.py — KANEnergy, KANSpline, KANLayer (existing KAN tier)
      - python/carnot/verify/energy.py — ConstraintTerm protocol, ComposedEnergy
      - python/carnot/models/__init__.py — model exports
      - tests/python/test_kan.py — KAN test patterns to follow

      TASK: Implement CIKANEnergy as a constrained subclass of KANEnergy.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-ENERGY-010 (CIKAN energy tier with constraint-seeded splines),
         REQ-ENERGY-011 (constraint boundaries produce infinite energy barrier),
         SCENARIO-ENERGY-015/016/017 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - ConstraintBoundary: dataclass (variable_idx, boundary_value, boundary_type)
           where boundary_type is "lower_bound" | "upper_bound" | "equality"
         - seed_spline_from_constraint(spline, boundary) → KANSpline:
           places a knot at boundary_value; adjusts spline coefficients so that energy
           approaches inf as activation crosses boundary (saturation behavior)
         - CIKANEnergy(n_vars, n_hidden, constraint_boundaries: list[ConstraintBoundary])
         - CIKANEnergy.energy(x) → float: same as KANEnergy but with constraint-seeded splines
         - CIKANEnergy.from_constraints(constraints: list[ConstraintTerm]) → CIKANEnergy:
           classmethod that extracts boundaries from constraint terms and seeds splines
         - CIKANEnergy._boundary_penalty(x): returns large positive value when x crosses any boundary
         - CIKANEnergy.energy never returns negative values (energy is non-negative by design)
         - HARDWARE NOTE in docstrings: each ConstraintBoundary corresponds to one FPGA LUT
           saturation point; CIKAN is the first energy tier designed for FPGA-native compilation
      4. Implement python/carnot/models/cikan_energy.py:
         - ConstraintBoundary dataclass
         - seed_spline_from_constraint(spline, boundary) → modified spline
         - CIKANEnergy class extending KANEnergy (or wrapping it)
         - from_constraints(constraints) classmethod
         - _boundary_penalty(x) private method
         - energy(x) method with constraint boundary penalties
         - save(path) / load(path) via safetensors
         - Verbose docstrings explaining WHY constraint boundaries are baked into splines
           and what the FPGA compilation path looks like
      5. Export CIKANEnergy, ConstraintBoundary from carnot.models.__init__.
      6. Write scripts/experiment_375_cikan_energy.py using ExperimentTemplate(375):
         a. Create simple 4-variable arithmetic constraint: x1 + x2 = x3 (carry-check style)
         b. Instantiate CIKANEnergy.from_constraints([arithmetic_constraint])
         c. Sample 100 configurations: 50 satisfying constraints, 50 violating
         d. Measure: mean energy for satisfying vs violating; energy separation ratio
         e. Compare vs standard KANEnergy energy separation on same data
         f. Build artifact: schema="carnot.cikan_energy.v1",
            n_satisfying, n_violating, mean_energy_satisfying, mean_energy_violating,
            energy_separation_ratio, cikan_vs_kan_ratio, n_constraint_boundaries_used
         g. Output: results/experiment_375_cikan_energy.json
      7. Write tests/python/test_cikan_energy.py (100% coverage required).
      8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      9. Reconcile: update ops/conductor-log.md, ops/changelog.md, ops/status.md,
         _bmad/architecture.md (add CIKANEnergy to model tiers table).
      Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      Do NOT push. Do NOT modify scripts/research_conductor.py.

