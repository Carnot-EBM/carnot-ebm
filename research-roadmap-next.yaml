    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4430_capstone_409.json
    prompt: |
      Aggregate the .409 milestone. HEADLINE questions: (1) the NEW reproducible_total_levels (>34?) and
      how many NEW levels/games across exp4421-4424; (2) did config-rule SOLVE on an UNSEEN game reproduce
      a level (exp4421)? (3) did the glyph-rewrite verifier ground + solve (exp4422)? (4) did the generic
