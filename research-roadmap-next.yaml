# detector stays code-blind (exp3683: reweighting math verifiers leaves code AUROC 0.5) -- the fix is a
# code-NATIVE signal, not a reweight. .338 PRIORITIES: re-emit the re-freeze package CLEAN + add a published
# external comparator; redo the selection diagnosis PROPERLY with genuinely-new methods (pessimistic LCB BoN
# arXiv:2604.04648 + bootstrapping arXiv:2511.18630 + real per-question calibration + self-certainty
# arXiv:2502.18581); build a code-NATIVE verifier for the code-blind detector; continue FR-11 + hardware.
# INVARIANTS: paper_ready=true (G1-G4 closed 2026-05-31; do NOT regress); frozen FoVer 0.9131 stays frozen
# (a dependency-aware win is a CANDIDATE for a future operator re-freeze, not a silent swap; north-star sec-1 is
# operator-curated -- the agent prepares the package only, never edits north-star.md or triggers the CI run).
# facts-generalization RETIRED (exp3670 same-verdict on REAL RAGTruth). trained-judge-OOD RETIRED (exp3659).
# P0.1 stays honest-negative. The selection earned-negative (exp3672) stands as the baseline; exp3694 is the
# PROPER diagnosis with retire_if_same_verdict: true if no non-degenerate fix beats SC.
# HYGIENE FIX (the .337 DURATION_TOO_SHORT false-flags): every aggregation/verifier-scoring task sets
# inference_substrate correctly AND carries NO GGUF/CUDA/live-model marker in model_specs, then runs
# adversarial_verify and CONFIRMS clean before finishing. Every gated_on is a BARE scalar
