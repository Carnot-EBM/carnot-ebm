    \ signal)\n\nTASK: Implement ODAR-style free-energy routing in VerifyRepairPipeline.\n\nCONCRETE STEPS:\n\
    \  0. PRECONDITIONS:\n     a. verify_repair.py exists:\n        ls {project_root}/python/carnot/pipeline/verify_repair.py\n\
    \        If missing: write honest_verdict blocked_pipeline_module_missing and exit.\n     b. numpy importable:\
    \ .venv/bin/python -c \"import numpy; print(numpy.__version__)\"\n\n  1. Implement OdarRouter class at python/carnot/pipeline/odar_router.py:\n\
    \     Inputs: current_energy (float), prior_energy (float), iteration (int), max_iterations (int)\n     Free-energy\
    \ estimate:\n       delta_E = prior_energy - current_energy  # energy reduction this iteration\n       expected_reduction\
    \ = delta_E * exp(-0.5 * iteration)  # exponential decay of expected gain\n       complexity = abs(delta_E)\
    \ / (iteration + 1)  # per-iteration complexity cost\n       variational_free_energy = -expected_reduction\
    \ + 0.3 * complexity  # ODAR objective\n     Decision:\n       if variational_free_energy < 0: route_to_repair\
    \ = True (positive expected gain)\n       else: route_to_repair = False (expected gain doesn't justify\
    \ cost)\n     Output: route_to_repair (bool), variational_free_energy (float), expected_reduction (float)\n\
    \n  2. Add OdarRouter as optional routing mode to VerifyRepairPipeline:\n     - Add routing_mode='argmax'|'odar'\
    \ parameter to VerifyRepairPipeline.__init__\n     - When routing_mode='odar': use OdarRouter.route() instead\
    \ of argmax threshold check\n     - Ensure backward compatibility: existing routing_mode='argmax' unchanged\n\
    \n  3. Evaluate ODAR routing vs argmax on 20 telemetry entries:\n     Run pipeline with routing_mode='argmax'\
    \ and routing_mode='odar' on same entries.\n     Measure: n_iterations_argmax (avg), n_iterations_odar (avg),\n\
    \     odar_vs_argmax_iterations_delta (negative = fewer iterations with ODAR = more efficient),\n     energy_reduction_argmax,\
    \ energy_reduction_odar.\n\n  4. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/pipeline/\
    \ -k \"odar or routing\" \\\n       -v --no-cov 2>&1 | tail -15\n     Create test if none exists.\n\n  5.\
    \ Write deliverable. Validate JSON before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n  \
    \    principle: \"Terminal-prefix required.\"\n  - odar_routing_implemented:\n      principle: \"True if OdarRouter\
    \ was added to the pipeline. Core deliverable.\"\n  - odar_vs_argmax_iterations_delta:\n      principle:\
    \ \"Mean iteration count difference. Negative = ODAR is more efficient (fewer iterations). Positive\
    \ = ODAR uses more iterations.\"\n  - free_energy_routing_enabled:\n      principle: \"True if pipeline\
    \ supports routing_mode=odar. Documents Phase 4 operationalization.\"\n  - n_eval_examples:\n      principle:\
    \ \"Must be >= 20.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n      principle:\
    \ \"Guards against fabrication.\"\n  - preconditions_checked:\n      principle: \"Records verify_repair\
    \ module, numpy checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"odar_routing_implemented == true\"\n   \
    \ principle: \"OdarRouter must be in the codebase — not just described.\"\n\nDo NOT push. Do NOT modify\
