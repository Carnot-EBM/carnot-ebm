      EXISTING CODE TO READ FIRST: scripts/experiment_1736_kanele_synth.py
      TASK: Run a latency benchmark of the KANELÉ bitfile on the KV260 using PYNQ AXI interfaces.
      CONCRETE STEPS:
      1. Create `{project_root}/scripts/experiment_1737_kanele_board.py`.
      2. Load the synthesised bitfile into the KV260.
      3. Pass 1000 input states and measure the hardware latency in microseconds.
      4. Write results to `{project_root}/results/experiment_1737_kanele_board.json`.
