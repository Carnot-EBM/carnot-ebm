tasks:
- id: exp7192-source-contract
  title: V634 source ingestion and exact execution contract
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.634
  deliverable: results/experiment_7192_v634_source_contract.json
  agent_type: claude
  model: opus
  prior_failures:
  - experiment_id: exp7179-contract-receipt
    verdict: complete_disqualified_v633_markdown_yaml_contract_mismatch
    addressed_by: The planner now writes both files from one full thirteen-task record and verifies them
      before handoff; runtime selects the matching milestone.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V633 activated thirteen tasks against a V632 document. This plan ships both sources together. Audit them independently and ingest only post-planning source changes. This advisory task gates no science.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/conductor_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/validate_prior_failures.py
    - {project_root}/scripts/harness_consumer_checks.py
    - {project_root}/python/carnot/experiment_7179_v633_contract_receipt.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7192_v634_source_contract.json. Create scripts/experiments/experiment_7192_v634_source_contract.py as the executable entrypoint. Reuse shipped modules. New code requires the driving spec and meaningful failing tests before implementation.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print and flush before any check. Confirm the cited capability spec has REQ-* requirements. Check source bytes, exact upstream gate fields, upstream quarantine flags, tools and output directories. Reject quarantined upstream data before consuming it; structured field gates alone do not enforce this. A known failed upstream value must not be promoted. A missing external prerequisite requires a terminal blocked artifact with gate_check_summary. Checkpoints go under results/checkpoints/, never the terminal deliverable.
    1. Print a flushed progress line at every numbered phase boundary. Print and flush before and after every model load, generation, benchmark and subprocess that can take minutes. Inside long loops emit completed units and elapsed time at least every 60 seconds. Start an external heartbeat before blocking native calls. Stream child output unbuffered. Keep every output gap below 600 seconds: silent tasks can die at 1200 seconds despite the 4800-second hard cap. Bound each call and persist real progress; never fake activity or completion.
    2. This task invokes no LLM. Set MODEL_SPECS=[] and model_invoked=false. Use inference_substrate_class=aggregation for read-only analysis; use cpu_exact_solver_or_simulator for executed CPU algorithms. Record inference_substrate=aggregation_from_upstream_artifacts or verifier_ensemble_against_cached_candidates when accurate. Use blocked_no_run only if no qualifying computation occurred. Upstream Qwen provenance does not turn a CPU replay into live inference.
    3. Select the YAML whose milestone equals 2026.09.634. Before activation use research-roadmap-next.yaml; afterward use research-roadmap.yaml. Freeze its bytes and the design bytes. Independently parse the exact contract table. Compare thirteen IDs, order, titles, deliverables and gates. Do not compare the staged design against the still-active V633 YAML.
    4. Run schema, prior-failure, exclusion, invented-path, ARC-floor and gate-declaration checks. Confirm producer fields exist in each upstream REQUIRED ARTIFACT FIELDS block. Exercise the real conductor gate evaluator on temporary synthetic artifacts in /tmp. Label those fixtures as validation inputs; they are not research results. Check both field=1 and field=0, missing field and quarantined input. Record the current quarantine behavior separately: evaluate_gates currently evaluates fields and does not reject flagged_adversarial by itself. The experiment-level precondition must reject quarantined upstream data. Do not claim this pre-gate provides that protection or edit conductor/QA code.
    5. Read the V634 planning refresh in research-references.md. Check at most five primary papers through low-concurrency requests. Include arXiv:2606.11711, 2608.11560, 2609.05025 and 2609.07347. Record URL, version/date, access outcome, method boundary and target task. Check Extropic and Kona for a dated change. Record no delta when appropriate. Update references and research-studying.md only for real changes. Do not launch a research-agent fan-out.
    6. Emit source_contract_complete_score=1 only after both source mapping and structural checks complete. A readable mismatch is disqualified. An inaccessible external paper may be an explicit source-limit row if cached primary evidence suffices; do not invent its contents. Preserve the chosen contract under results/raw/experiment_7192/ for the capstone.
    7. Validate only the changed scope. Run focused unit tests, Ruff lint/format, changed-module mypy and scripts/check_spec_coverage.py with explicit changed-test paths. Use a private pytest basetemp. Do not run the entire Python suite as an experiment precondition. Run applicable E2E checks from ops/e2e-test-plan.md: E2E-009/010 for ARC seams, E2E-007 for memory updates, E2E-003/004 for bindings. For source grounding, run public input -> extraction -> execution -> independent label scoring. For planning, run file -> parser -> real gate evaluator on /tmp validation fixtures. Run adversarial_verify.py and verdict_row_consistency_lint.py on the final artifact where applicable. Record pre-existing failures separately. Reconcile specs, _bmad/traceability.md, ops/status.md and ops/changelog.md. Do not edit protected validation infrastructure to pass. Flush around validation calls and the final atomic write.

    8. REQUIRED ARTIFACT FIELDS:
       - field_principles: principle: "Echo each declared reason beside the actual evidence contract."
       - status: principle: "Terminal only after completion or a diagnosed external block."
       - run_date: principle: "Use {date}, never a historical date."
       - preconditions_checked: principle: "Record each required resource and its actual observed state."
       - inference_substrate: principle: "Describe executed computation, not the planned workload."
       - inference_substrate_class: principle: "Apply the duration floor for the work actually performed."
       - execution_venue: principle: "Host or device identity limits the scope of the evidence."
       - duration_s: principle: "Measure monotonic elapsed work; never pad time to pass a floor."
       - source_artifact_hashes: principle: "Bind code, inputs and frozen contracts to the result."
       - rows: principle: "Retain unit ID, arm, seed, metric, error and abstention for every comparison."
       - sample_size_budget: principle: "Record planned and completed counts, independent units and exclusions."
       - random_seed: principle: "Freeze all stochastic choices before reading held-out outcomes."
       - reproducibility_checksum: principle: "Hash inputs, code, seeds and raw rows."
       - gate_check_summary: principle: "Every blocked verdict names the failed check, upstream, field, expected and observed value."
       - verifier_is_oracle: principle: "True when verification uses the same correctness authority; separate implementations alone do not remove circularity."
       - verdict_class: principle: "Use positive | circular_positive | null | blocked | disqualified | partial. Only incomplete own work can be partial."
       - honest_verdict: principle: "Use complete_ or complete: for completed findings, including nulls; blocked_* for external blocks. Never promote infrastructure readiness as scientific benefit."
       - source_contract_complete_score: principle: "A complete advisory receipt is not scientific progress."
       - contract_rows: principle: "Each of the thirteen task rows must match both independently parsed sources."
       - source_method_rows: principle: "Real URLs and access outcomes distinguish ingestion from invented novelty."
       - activation_validation_rows: principle: "The real parser and gate evaluator must accept the staged file."
       - MODEL_SPECS: principle: "Empty because this task invokes no LLM."
       - model_invoked: principle: "False; upstream inference is cited, not repeated."

    Run command: cd {project_root} && PYTHONUNBUFFERED=1 PYTHONPATH=python JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_7192_v634_source_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
