        - preconditions_checked: list
        - model_specs: {target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          n_test: 60, k_baseline: 15, k_with_nla: 16,
          probe_weights_from: "exp1694"}
        - n_samples: 60
        - n_samples_justification: "60 held-out test examples gives Wilson
          95% CI of width ~0.20 on per-k pass rate; lift CI width ~0.28.
          Sufficient for 3pp threshold detection at reasonable power."
        - k15_baseline_agreement_rate: float
        - k16_with_nla_agreement_rate: float
        - lift: float
        - lift_wilson_95_ci: [lower, upper]
        - per_verifier_pass_rate: dict verifier_name -> rate
        - acceptance_gate_passed: bool (lift >= 0.03 AND
