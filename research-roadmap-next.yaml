      Set verifier_is_oracle=true only for exact task checkers. State that output transport, parsing, and model proposals are not oracles.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6380_three_family_canonical_factor_transport_canary --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6381-verified-frontier-live-factor-proposal-ab
    milestone: "2026.08.549"
    deliverable: results/experiment_6381_verified_frontier_live_factor_proposal_ab.json
    title: "Gated on Exp6380 readiness: verified-frontier live factor proposal A/B"
