      addressed_by: "This is not a blind rerun of reweighting. It uses certificate artifacts and measures replay delta, plus optional skill-graph emission from verifiable trajectories."
      retire_if_same_verdict: false
    - experiment_id: exp1200-online-constraint-reweighting-v2-addition
      verdict: completed_or_unclear_delta
      addressed_by: "Prior work focused on constraint addition. This task measures future-case replay improvement from certificate memory."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Every milestone must advance continuous self-learning. This task turns verified
    certificates or FoVer labels into a replayable case memory, then measures whether
    memory improves future verification/routing decisions.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - research-program.md section "Continuous Self-Learning"
    - python/carnot/pipeline/verify_repair.py
    - python/carnot/pipeline/fover_annotator.py
    - results/experiment_1271_triggered_certificate_extraction_sota_gguf.json if it exists
    - results/fover_corpus_v5.json

    TASK:
    Implement or run a lightweight certificate-memory replay evaluation. Produce a measured
