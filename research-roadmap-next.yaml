- id: exp907-svamp-root-cause-v2
  milestone: 2026.04.70
  deliverable: results/experiment_907_svamp_root_cause_v2.json
  max_turns: 30
  title: 'Exp 907: SVAMP Root Cause v2 — Confirm FoVer Labeling Mismatch (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-SVAMP-ZERO-AUC has been open since Exp 872 (svamp_auc=0.125). The
    .69 zero-run meant Exp 893 (SVAMP root cause) never ran. The hypothesis: SVAMP
    questions are single-step word problems with no multi-step CoT chains. FoVer
    labeling assumes intermediate reasoning steps exist — for SVAMP they don't, so
    all labels are noise. This experiment confirms that hypothesis with evidence.

    EXISTING CODE TO READ FIRST:
    - results/experiment_883_vjepa_v2_expanded_corpus.json — svamp_auc=0.125, ood_auc=0.9211
    - python/carnot/verify/fover_labeler.py — FoVer step-labeling pipeline
    - python/carnot/pipeline/vjepa_predictor.py — VariationalJEPAPredictor
    - openspec/change-proposals/research-roadmap-v70.md — .70 Phase 2 design

    TASK: Confirm FoVer labeling is inapplicable to SVAMP single-step word problems.
    Measure CoT depth distribution, label noise rate, AUC comparison.
    Gate Exp 908 on labeling_mismatch_confirmed=True.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Load 20 SVAMP questions (from tests/data/ or construct representative ones).
    3. Run Qwen3.5-0.8B (CPU, llama.cpp) on all 20 SVAMP questions. Collect responses.
    4. Run FoVer labeling on each (question, response) pair. Collect per pair:
       - n_cot_steps: int
       - labeling_successful: bool
       - label_confidence: float or null
    5. Run same pipeline on 20 GSM8K questions (multi-step, for comparison).
    6. Compute for each cohort:
