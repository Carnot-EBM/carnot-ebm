- id: exp885-spectral-attention-probe
  milestone: 2026.04.68
  deliverable: results/experiment_885_spectral_attention_probe.json
  title: 'Exp 885: SpectralAttentionProbe — Tier 0h Advisory (arXiv 2502.17598) (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2502.17598 shows that eigenvalues of graph Laplacians of attention maps
    predict hallucinations (F1 > 0.82, < 0.5ms overhead). The intuition: hallucinatory
    passages have more diffuse, uniform attention distributions (flatter eigenvalue spectra)
    than factually correct passages where attention concentrates on relevant tokens.
    We implement a CPU-only approximation using token co-occurrence bigrams as an attention
    proxy (the same pattern used in NUP Probe v4, Exp 523, AUC=1.0).

    This adds Tier 0h as an advisory signal in the verification cascade — it does NOT
    short-circuit Ising, it only adds is_spectrally_diffuse to VerificationCertificate.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.verify()
    - python/carnot/pipeline/verification_certificate.py — VerificationCertificate
