        addressed_by: "exp2316 was blocked by pretest_fixed=false. exp2323 addresses all 3 remaining failures. Scope identical to exp2316."
    prompt: |
      CONTEXT: arXiv:2605.05387 proves that projected-Langevin dynamics under linear equality
      constraints Ax=b achieves Langevin mixing while guaranteeing exact constraint satisfaction
      throughout the trajectory. This is an alternative to CASAL's primal-dual augmented approach.
      This is the FIRST actual run — exp2290, exp2300, exp2316 were all blocked before executing.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/python/carnot/samplers/parallel_ising.py
        {project_root}/scripts/experiment_template.py
      TASK: Implement projected-Langevin sampler and compare against CASAL baseline.
      CONCRETE STEPS:
        1. Create python/carnot/samplers/projected_langevin.py implementing:
           class ProjectedLangevinSampler:
             - sample(x0, energy_fn, A, b, n_steps, step_size, noise_scale, random_seed)
             - Each step: x = x - step_size * grad_E(x) + sqrt(2*step_size)*noise, then project
             - Projection: x = x - A.T @ solve(A @ A.T, A @ x - b)
        2. Write 2 focused unit tests in tests/python/samplers/test_projected_langevin.py.
        3. Run unit tests; record n_tests_passed.
        4. Define 3 test problems (n=32 variables, random linear constraints Ax=b):
           Problem 1: single equality constraint
           Problem 2: 3 equality constraints
           Problem 3: 5 equality constraints
