    arXiv 2604.16430 (HalluSAE) shows that feeding sparse AE features as input to a
    downstream classifier improves AUC by 5-10pp over raw hidden states. Applied to JEPA v16:
    instead of using raw text embeddings as input, use the sparse AE feature vector (dim=512,
    sparse). This should improve OOD AUC because sparse AE features are more semantically
    stable across different question distributions than raw token features.

    GATE: Read results/experiment_698_jepa_v16.json (v16 weights must exist).
    Read results/experiment_687_hallusat_sparse_ae.json (sparse AE weights must exist).
    If either is missing: emit "blocked_on_upstream_{exp}" and exit 0.

    EXISTING CODE TO READ FIRST:
    - results/experiment_698_jepa_v16.json — v16 baseline AUC and weights path.
    - results/experiment_687_hallusat_sparse_ae.json — sparse AE top-10 features.
    - python/carnot/models/hallusal_sparse_ae.py — SparseAutoEncoder (Exp 687).
    - python/carnot/models/jepa_predictor.py — JEPAv16 class (from Exp 698).
    - results/fover_labeled_formal_v1.json — training data.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - scripts/experiment_template.py — ExperimentTemplate.

    TASK: Retrain JEPAv16 with HalluSAE sparse features as input; compare OOD AUC
    to v16 baseline (raw text features).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-LEARN-055 (HalluSAE + JEPA v16: OOD AUC >= v16_baseline + 0.03 using
       sparse AE features), SCENARIO-LEARN-090/091 to spec.md.
    3. Create python/carnot/models/jepa_hallusae_v16.py:
       a. JEPAHalluSAEv16 (extends JEPAv16):
          __init__(self, sae: SparseAutoEncoder, **kwargs):
            self.sae = sae  # frozen sparse AE
          encode(self, text: str) -> jnp.ndarray:
            text_features = extract_text_features(text)  # from hallusal_sparse_ae.py
            sae_features, sae_sparse = self.sae(text_features)
            return sae_sparse  # use sparse code as JEPA input
    4. Create scripts/experiment_699_hallusae_jepa_v16.py:
       a. ExperimentTimeoutWatchdog(699, timeout_minutes=60).
       b. Load Exp 698 and Exp 687 results (gates above).
       c. Load SparseAutoEncoder weights from Exp 687 results (if weights saved; else
          retrain SAE from scratch on fover_labeled_formal_v1.json using Exp 687 code).
       d. Freeze SAE weights (no gradient updates to SAE during JEPA training).
       e. Train JEPAHalluSAEv16 on FoVer formal v1 data with SAE-encoded inputs:
          200 epochs, Adam 1e-3.
          Save to results/jepa_hallusae_v16.safetensors.
       f. Evaluate on OOD set (GSM8K 500-699):
          Compute hallusae_v16_ood_auc.
       g. v16_baseline_auc = read from Exp 698 result (jepa_v16.json).
          delta_auc = hallusae_v16_ood_auc - v16_baseline_auc.
       h. honest_verdict:
          - "hallusae_integration_improved" if delta_auc >= 0.03
          - "hallusae_integration_marginal" if 0 < delta_auc < 0.03
          - "hallusae_integration_no_improvement" if delta_auc <= 0
          - "blocked_on_upstream_exp698" or "blocked_on_upstream_exp687" if gates fail
       i. artifact: v16_baseline_auc, hallusae_v16_ood_auc, delta_auc,
          sae_features_dim, sae_sparsity_rate, honest_verdict.
    5. Write tests/python/test_jepa_hallusae_v16.py with 100% module coverage.
    6. Reconcile:
       - ops/status.md: update "JEPA v16 + HalluSAE: {honest_verdict}, delta_auc={delta_auc}".
       - ops/changelog.md: one-line with honest_verdict and delta_auc.
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

