  - id: exp3150-adversarial-verifier-evidence-corrigendum
    milestone: "2026.05.293"
    deliverable: "results/experiment_3150_adversarial_verifier_evidence_corrigendum_v1.json"
    title: "Adversarial verifier evidence corrigendum"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 55
    track: "verification"
    inference_substrate: "aggregation_and_lint"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3139-live-sota-verifier-rerun-v7
        verdict: "flagged_adversarial: live verifier source reported false_accept_rate=0.0 but artifact failed duration, tautology, and methodology checks"
        addressed_by: "Adds an explicit evidence-quality corrigendum before any rerun can unlock repair."
        retire_if_same_verdict: true
      - experiment_id: exp3147-cross-corpus-matrix-v26
        verdict: "complete_flagged: matrix_v26_ready=true; publication_blocker_count=55; artifact flagged for duration/methodology issues"
        addressed_by: "Audits the matrix source artifacts for inherited adversarial flags instead of using the aggregate as proof of recovery."
        retire_if_same_verdict: true
      - experiment_id: exp3136-false-accept-root-cause-autopsy
        verdict: "complete_flagged: false_accept_autopsy_v1_ready=true; source_false_accept_rate=0.5; tautology warning on recomputed metric"
        addressed_by: "Separates metric recomputation from non-tautological evidence and marks which fields are allowed to gate downstream work."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .292 blocked the known false-accept rows, but its live verifier rerun and aggregate matrix were flagged for evidence quality. Recent hallucination-detection work recommends sanity checks that catch benchmark artifacts and superficial detector success.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-references.md
      - scripts/verifier_authenticity_lint.py
      - scripts/harness_fit_lint.py
      - results/experiment_3136_false_accept_root_cause_autopsy_v1.json
      - results/experiment_3137_exact_safe_accept_abstain_contract_v1.json
      - results/experiment_3138_canonical_answer_vericot_grounding_pilot_v1.json
      - results/experiment_3139_live_sota_verifier_rerun_v7.json
      - results/experiment_3140_repair_gate_unlock_decision_v1.json
      - results/experiment_3147_cross_corpus_matrix_v26.json
      - results/experiment_3148_capstone_v292.json

      TASK
      Produce an adversarial verifier-evidence corrigendum that distinguishes exact false-accept recovery from untrusted live-inference evidence.

      CONCRETE STEPS
      1. Load the .292 verifier, repair-gate, matrix, and capstone artifacts.
      2. Identify all adversarial flags, including tautology, too-short duration, missing seed/checksum, missing transcript evidence, inconsistent model-load evidence, and aggregate artifacts inheriting flagged source data.
      3. Build a sanity-check table inspired by long-form hallucination detector sanity checks: field provenance, non-tautological recomputation, adversarial regression rows, and methodology completeness.
      4. Decide which fields are safe to use as downstream gates and which must be treated as blocked pending a clean rerun.
      5. Write a corrigendum artifact with explicit repair-gate implications.

      REQUIRED ARTIFACT FIELDS:
      - adversarial_corrigendum_v1_ready: bool (principle: evidence quality must gate repair)
      - audited_artifacts: list (principle: inherited flags must be traceable)
      - flagged_artifact_count: int (principle: aggregate trust requires source trust)
      - adversarial_flag_counts: dict (principle: failure classes must be separable)
      - safe_downstream_fields: list (principle: gates need explicit trusted fields)
      - blocked_downstream_fields: list (principle: untrusted fields must not unlock repair)
      - known_false_accept_recovery_preserved: bool (principle: exact replay success should not be discarded)
      - live_verifier_evidence_trusted: bool (principle: live claims require authenticity evidence)
      - repair_gate_implication: str (principle: repair unlock must be machine-readable)
      - methodology_requirements_for_rerun: list (principle: the next live task needs concrete requirements)
      - source_artifacts: list (principle: claims must trace to files)
      - inference_substrate: dict (principle: aggregation/lint work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3151-live-inference-authenticity-preflight
    milestone: "2026.05.293"
    deliverable: "results/experiment_3151_live_inference_authenticity_preflight_v1.json"
    title: "Live SOTA inference authenticity preflight"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 75
    track: "verification"
    inference_substrate: "local_sota_preflight_or_blocked"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3139-live-sota-verifier-rerun-v7
        verdict: "flagged_adversarial: preflight said no model loaded while artifact claimed six live calls"
        addressed_by: "Creates a separate authenticity preflight contract with model-load evidence before the clean rerun can run."
        retire_if_same_verdict: true
      - experiment_id: exp3123-sota-cache-preconditions-manifest-v2
        verdict: "complete: cache manifest ready; only unsloth/gemma-4-26B-A4B-it-GGUF locally present among mandated SOTA models"
        addressed_by: "Refreshes the preflight around authenticity and transcript requirements instead of cache presence alone."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .292 exposed a mismatch between claimed live calls and model-load evidence. This task does not need to score a verifier panel; it must make live inference authenticity auditable.

      PRECONDITIONS
      0. If no mandated local SOTA GGUF is usable, write a complete blocked artifact with preflight_passed=false, live_call_count=0, and headline_claim_allowed=false.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
      - unsloth/gemma-4-31B-it-GGUF (flagship dense)
      - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE)
      Legacy small models may be recorded only as CPU smoke-tests and must not headline results.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3123_sota_cache_preconditions_manifest_v2.json
      - results/experiment_3139_live_sota_verifier_rerun_v7.json
      - ops/status.md
      - ops/changelog.md

      TASK
      Define and test the authenticity preflight required before any clean live SOTA verifier rerun.

      CONCRETE STEPS
      1. Inspect the local SOTA cache/precondition manifest and any available GGUF paths without downloading new models.
      2. Define required evidence: selected model IDs, path existence, load command, load wall time, GPU/CPU substrate, transcript hashes, token counts, random_seed, reproducibility_checksum, and minimum plausible duration.
      3. If safe and locally supported, run a one-prompt smoke call on one mandated model and record transcript/hash evidence; otherwise record the exact blocker.
      4. Produce a reusable preflight contract for exp3152.
      5. Do not score the verifier panel in this task.

      REQUIRED ARTIFACT FIELDS:
      - live_inference_authenticity_preflight_ready: bool (principle: live verifier reruns need a preflight artifact)
      - model_specs: list (principle: mandated local model policy must be visible)
      - locally_usable_model_ids: list (principle: actual model availability must be auditable)
      - selected_model_ids: list (principle: any smoke call must identify the selected model)
      - preflight_passed: bool (principle: downstream gates need one conservative field)
      - live_call_count: int (principle: live evidence must not be inferred)
      - model_load_evidence: dict (principle: claimed inference requires load evidence)
      - transcript_hashes: list (principle: outputs must be replay-identifiable without copying long text)
      - minimum_duration_requirement_s: float (principle: duration sanity must be explicit)
      - headline_claim_allowed: bool (principle: smoke tests do not create headline evidence)
      - blocked_reason: str (principle: blocked preflights must be actionable)
      - source_artifacts: list (principle: preflight must trace to files)
      - inference_substrate: dict (principle: GPU/model/live status must be explicit)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3152-clean-live-sota-verifier-rerun-v8
    milestone: "2026.05.293"
    deliverable: "results/experiment_3152_clean_live_sota_verifier_rerun_v8.json"
    title: "Clean live SOTA verifier rerun v8"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 120
    track: "verification"
    inference_substrate: "local_sota_or_gated_skip"
    requires_gpu: true
    gated_on:
      - upstream: exp3150-adversarial-verifier-evidence-corrigendum
        artifact_field: adversarial_corrigendum_v1_ready
        op: "=="
        value: true
      - upstream: exp3151-live-inference-authenticity-preflight
        artifact_field: preflight_passed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3139-live-sota-verifier-rerun-v7
        verdict: "flagged_adversarial: false_accept_rate=0.0 but live evidence failed authenticity/methodology checks"
        addressed_by: "Reruns only after adversarial corrigendum and authenticity preflight, with mandatory transcript hashes and methodology fields."
        retire_if_same_verdict: true
      - experiment_id: exp3124-difficulty-stratified-live-sota-verifier-panel-v6
        verdict: "complete_blocked_false_accept: false_accept_rate=0.5; live_call_count=6; headline_claim_allowed=false"
        addressed_by: "Keeps the known false-accept rows as mandatory regression rows under the exact-safe contract."
        retire_if_same_verdict: true
      - experiment_id: exp3113-diagnostic-local-sota-verifier-calibration-v5
        verdict: "complete: diagnostic_local_sota_verifier_calibration_v5_ready=true; diagnostic_only=true"
        addressed_by: "Moves from diagnostic calibration to clean live evidence with authenticity and exact-label gates."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. This is the clean rerun of the local SOTA verifier panel after the evidence corrigendum and authenticity preflight. Success requires clean evidence and low false accepts.

      PRECONDITIONS
      0. Read exp3150 and exp3151 artifacts first. If preflight_passed is false or no mandated model is usable, write a complete gated-skip artifact with live_call_count=0, flagged_adversarial=false, false_accept_gate_passed=false, and headline_claim_allowed=false.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
      - unsloth/gemma-4-31B-it-GGUF (flagship dense)
      - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE)
      Legacy small models may be recorded only as CPU smoke-tests and must not headline results.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - results/experiment_3150_adversarial_verifier_evidence_corrigendum_v1.json
      - results/experiment_3151_live_inference_authenticity_preflight_v1.json
      - results/experiment_3136_false_accept_root_cause_autopsy_v1.json
      - results/experiment_3137_exact_safe_accept_abstain_contract_v1.json
      - results/experiment_3138_canonical_answer_vericot_grounding_pilot_v1.json
      - results/experiment_3139_live_sota_verifier_rerun_v7.json
      - python/carnot/verify if present
      - tests if verifier tests exist

      TASK
      Rerun the difficulty-stratified local SOTA verifier panel with exact-safe contract, canonical grounding, and full live-inference authenticity evidence.

      CONCRETE STEPS
      1. Build the rerun set from .291/.292 known false-accept regression rows plus balanced exact fixtures across contradiction, satisfiable drift, arithmetic, SMT, and fragment-code families.
      2. Use only mandated local SOTA GGUF models for headline evidence; record selected model IDs and any unavailable mandated models.
      3. Run bounded live calls only if authenticity preflight passed; record prompt hashes, transcript hashes, token counts, model-load evidence, duration, random_seed, and reproducibility_checksum.
      4. Apply the exact-safe contract and canonical grounding to compute false_accept_rate, false_reject_rate, abstention_rate, verifier_gain_delta, and false_accept_gate_passed.
      5. Run verifier authenticity and metric sanity checks before setting headline_claim_allowed.

      REQUIRED ARTIFACT FIELDS:
      - clean_live_verifier_rerun_v8_ready: bool (principle: repair gate needs clean rerun readiness)
      - model_specs: list (principle: mandated local model policy must be visible)
      - selected_model_ids: list (principle: actual model use must be auditable)
      - unavailable_model_ids: list (principle: comparative gaps must stay visible)
      - live_call_count: int (principle: live evidence must not be inferred)
      - model_load_evidence: dict (principle: claimed inference requires load evidence)
      - transcript_hashes: list (principle: outputs must be replay-identifiable)
      - random_seed: int (principle: methodology completeness must be explicit)
      - reproducibility_checksum: str (principle: rerun provenance must be checkable)
      - exact_ground_truth_count: int (principle: verifier scores need exact labels)
      - regression_rows_included: bool (principle: known failures must be retested)
      - false_accept_rate: float (principle: false accepts are the central blocker)
      - false_reject_rate: float (principle: over-rejection can erase utility)
      - abstention_rate: float (principle: safety/coverage tradeoff must be visible)
      - verifier_gain_delta: float (principle: lift must be measured against exact baselines)
      - false_accept_gate_passed: bool (principle: downstream gate must be machine-readable)
      - flagged_adversarial: bool (principle: downstream gate must reject tainted evidence)
      - headline_claim_allowed: bool (principle: live claims require all evidence gates)
      - tests_run: list (principle: metric aggregation and authenticity checks must be run)
      - source_artifacts: list (principle: claims must trace to concrete files)
      - inference_substrate: dict (principle: GPU/model/live inference status must be explicit)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

