  - id: exp4103-verifier-registry-gaps-hygiene
    milestone: 2026.06.379
    title: "VERIFIER-REGISTRY + GAPS HYGIENE (reserved infra slot; regression guard). Bit-exact OFFLINE re-eval reproducing the canonical GAP-4 ARC-1 numbers from cached candidates (zero codex/GGUF). RECORD the .379 outcomes: the NEW GAP-TRM-GRID-DISCRIMINATION entry (did any verifier beat TRM-vote at rerank, exp4099?) and the TRM-RFT outcome (exp4100). Keep ops/verifier_registry.yaml + ops/verifier_gaps.md the honest source of truth."
    priority: medium
    track: infra
    max_turns: 60
