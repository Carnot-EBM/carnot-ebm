milestone_title: "POST-CONVERGENCE -- RETRY THE LAST OPEN QUESTION + HARDEN THE BANKED PRODUCT. The project is CONVERGED on its one surviving positive (FoVer 0.9131 verifier, paper_ready=TRUE) and BOTH energy-foundation routes are bounded (selector P0.1 + generator Thesis-A); the verifier-moat thread is CLOSED. .346 landed 10/11 -- the SINGLE un-landed task was exp3777 (P1 discrete-search v3), which BLOCKED on no-free-GPU. .347 does FIVE things and re-grinds NOTHING bounded: (A) RETRY the LAST open energy-existential question -- the P1 discrete-search adjudication v3 (artifact-vs-fundamental for energy-as-generator), with a GPU-FREE precondition + a clean blocked-fallback (never queue, never fabricate); the harness root-cause was already fixed (n_train 20000->40000). (B) HARDEN the banked verifier product -- a CLI+batch surface for the abstention mode, a CPU gaming-resistance characterization, and a G4 provenance-confirmation that can RESTORE the demoted product headline (exp1999 +18pp / exp2090 +15pp). (C) CONTINUE self-learning -- FR-11 v19 Tier-3 predictive verification (distinct tier from v18's Tier-2 memory). (D) VALIDATE the .346 Anomaly-Escalation classifier against the historical retro corpus (recommend-only; never auto-relaxes verification). (E) SCAFFOLD the operator's EDLM seed further -- a NO-TRAIN preflight GO/NO-GO readiness check that lowers the seed cost to one command without committing the loop. Plus record/continuity (external refresh, KV260 opportunistic, capstone). INVARIANTS: paper_ready stays TRUE (G1-G4); FoVer 0.9131 frozen; both energy routes stay bounded (P1 v3 sharpens the MECHANISM only, never reopens the strategic conclusion or seeds a paradigm); the next-Phase-3-thesis decision stays an operator-seeding surface. The agent never edits operator-curated docs, never triggers CI, never publishes, never pushes."
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md

# OUTER-LOOP / OPERATOR PRE-STAGED ROADMAP (2026-06-04, Claude Opus 4.8). PROVENANCE:
# .346 landed 10/11. Banked: verifier product (exp3779 abstention mode wired into the verify API,
# default-OFF, E2E + MCP surface confirmed); FR-11 v18 Tier-2 constraint-memory (exp3778, AUROC under
# consolidation 0.9097 within the frozen CI, memory contribution preserved); P3 Anomaly-Escalation
# classifier prototyped (exp3780); EDLM next-thesis feasibility brief scaffolded (exp3781); G4 technical-
# report correction prepped (exp3782, operator proposal). paper_ready=TRUE (G1-G4). The SINGLE un-landed
# task was exp3777 (P1 discrete-search v3), BLOCKED on no-free-GPU (capstone p1_adjudication=
# blocked_missing_upstream_artifact). The harness root-cause was already diagnosed + fixed in .346
# (scripts/thesis_a_p1_discrete_search_v2.py n_train 20000->40000, the regime where the AR positive
# control reaches 0.84).
#
# .347 is a LEAN, NON-CHURN milestone (north-star sec-1). With both energy routes bounded and the moat
# closed, the loop's legitimate forward surface narrows to exactly: (1) the one open P1 mechanism question
# (RETRY the GPU adjudication), (2) hardening the banked verifier product toward deployability + restoring
# the demoted product headline via provenance confirmation (north-star sec-1's OWN definition of a
# headline-ADVANCING milestone -- the opposite of noise), (3) mandated continuous self-learning (Tier-3).
# .347 does exactly these + the operator-seed scaffold (EDLM no-train preflight) + record hygiene, and runs
# NO scissor-plot/moat sweep (the moat thread is CLOSED -- re-running it would re-grind a closed thread).
#
# OPERATOR FLAG (north-star sec-1): the project is CONVERGED. The substantive next move -- SEED a new
# Phase-3 thesis (EDLM is the top candidate) or FREEZE the loop into a product-maintenance cadence -- is the
# OPERATOR's to make; the loop CANNOT self-seed a paradigm (the P3 Verification Trap). .347 lowers the EDLM
# seed cost to one command (the preflight) and otherwise spends only on the three legitimate surfaces.
# Continued milestones WITHOUT an operator seed will increasingly approach the churn boundary.
#
# ROUTING: gemini CRASHES real GPU workloads + has wiped milestones via 429 (incident_333), so the cheap-
# default is CODEX (requires_codex). The ONE GPU task (exp3787) is CLAUDE+opus+max_turns:100 (GPU/bootstrap
# + open-ended adjudication -> opus per the hardware-integration routing rule; C+E escalation is claude-only).
# The ONE judgment task is exp3793 (EDLM no-train preflight synthesis) -> claude. Everything else is codex
# (mechanical/aggregation/verifier-scoring).
#
# INTERPRETER DISCIPLINE (incident_ebt_training_venv_python_cuda): EVERY Run command pins .venv/bin/python --
# bare `python` is /usr/bin/python3 with NO torch/yaml/sklearn. Even CPU tasks need project deps for
# scripts/adversarial_verify.py + scripts/summarize_artifact.py + verifier scoring.
#
# ANTI-POISON-TEST (the .344 ROOT CAUSE): any shipped test MUST assert against the script's REAL behavior and
# any new research-complete.yaml value containing a colon MUST be quoted. A failing shipped test -- or a stray
# unquoted colon -- poisons the conductor pre-test gate and SKIPs the whole milestone.
#
# GATING: NO hard gated_on this milestone (the .340 proven-safe pattern). Every task reads upstream with a
# graceful disk-presence fallback -- never crash on a missing field, never label un-run work as a negative.
# INVARIANTS re-asserted at capstone: paper_ready TRUE; FoVer 0.9131 frozen; both energy routes bounded.

