      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. This is the .291 capstone. Do not modify research-roadmap.yaml and do not modify scripts/research_conductor.py. The capstone must summarize evidence, blockers, and the natural next milestone without overclaiming.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
