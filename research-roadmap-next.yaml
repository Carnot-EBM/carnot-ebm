    max_turns: 55
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # anti-wipeout codex routing for .338
    estimated_wall_time_min: 22
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3693_external_comparator_dependency_vs_deentangled.json
    prompt: |
      CONTEXT: exp3667/exp3680 showed the label-conditional dependency-aware weighting (arXiv:1903.05844) beats
      CARNOT-CURRENT on FoVer. A re-freeze candidate is far more credible if it ALSO beats a PUBLISHED external
      weak-supervision reweighting method on the same corpus + protocol, not just the internal prior. Implement a
      published de-entangled / class-information-guided (CIG-style) reweighting baseline (cite arXiv:2604.07650 as
      the recipe; the implementation is self-contained on the cached FoVer verifier outputs -- do NOT block on
      fetching the paper, implement the documented de-entangled-reweighting technique) and compare it head-to-head
      with Carnot's dependency-aware weighting. NULL DISCIPLINE: if the candidate ties or loses to the external
      baseline, that is an HONEST narrowing of the re-freeze (the candidate is still > frozen 0.9131, but is not
      uniquely best) -- report it, do not bury it.
      EXISTING CODE TO READ FIRST: results/experiment_3680 (dependency-aware G1 candidate) and results/experiment_3667
      (the clean dependency-aware weighting + structure) and results/experiment_2837 (FoVer corpus + the 4 scoring
      verifiers) and results/experiment_3644 (the Weaver-style weak-verifier baseline at 0.872) via
      scripts/summarize_artifact.py; research-references.md "Weaver (arXiv:2506.18203)" + "Learning Dependency
      Structures (arXiv:1903.05844)" + "Dependency Structure Misspecification (arXiv:2106.10302)" entries.
      PRECONDITIONS (step 0): the FoVer corpus + the 4 verifier per-candidate outputs loadable; the exp3667/3680
      dependency-aware weighting reproducible. If not -> "complete: blocked_fover_corpus_or_weightings_unavailable".
      INFERENCE-SUBSTRATE HYGIENE: verifier_ensemble_against_cached_candidates; NO GGUF/CUDA marker in model_specs;
      run adversarial_verify and confirm clean before finishing.
      DE-TAUTOLOGY (MANDATORY): store each conceptually-distinct AUROC under exactly ONE field name; the external
      baseline AUROC and the dependency-aware AUROC are DISTINCT measurements -- if they come out bit-identical
      that is a bug (a copied array), not a tie.
      CONCRETE STEPS:
        1. Implement the de-entangled / CIG-style reweighting baseline on the FoVer verifier outputs; report its
           AUROC + CI under the SAME pooled protocol used for the dependency-aware number.
        2. Head-to-head on the SAME splits: dependency-aware (exp3680) vs external-baseline vs Carnot-current vs the
           Weaver-style baseline (exp3644). Paired delta + bootstrap CI + DeLong p for dependency-aware vs the
           external baseline.
        3. Honest verdict: does the dependency-aware candidate beat the published external baseline with the delta
           CI excluding 0? Record candidate_beats_external_comparator (bare bool).
      ANTI-POISON TEST DISCIPLINE (MANDATORY): parametrize any pytest over the honest outcomes
