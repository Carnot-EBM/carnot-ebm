milestone: "2026.05.278"
milestone_title: "Structured Code Repair + Utility-Gated Self-Learning + GateMate Materialization"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"

# Pre-staged 2026-05-23 by outer-loop per Pre-Staged Roadmap Convention.
#
# Centerpiece: .277 proved the paper can proceed only with narrow claims:
# KV260 is not currently a Boltzmann/speedup headline, while code-corpus AUPRC
# is strong and SOTA code generation remains weak. .278 therefore turns verifier
# signal into structured repair, tests a real FR-11 utility gate, and finishes
# the most actionable open hardware materialization path: GateMate.

tasks:
  - id: exp2949
    milestone: "2026.05.278"
    deliverable: "results/experiment_2949_archive_v277_activate_v278.json"
    title: "Archive .277 + Activate .278"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 20
    estimated_wall_time_min: 10
    track: admin
    inference_substrate: aggregation_from_upstream_artifacts
    prior_failures:
      - experiment_id: exp2937
        verdict: "complete: archive_ready=true; archived_milestone=2026.05.276; activated_milestone=2026.05.277"
        addressed_by: "Recurring archive/activation task with new source milestone .277 and target milestone .278."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Run from {project_root} on {date}. Milestone 2026.05.277 has completed.
        Its terminal capstone is results/experiment_2948_capstone_v277.json.
        This task performs the standard archive/activation bookkeeping for
        2026.05.278 without modifying research-roadmap.yaml.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - CODEX.md
        - research-roadmap.yaml
        - research-roadmap-next.yaml
        - results/experiment_2948_capstone_v277.json
        - research-complete.yaml
        - ops/status.md
        - ops/changelog.md

      TASK:
        Archive .277 into research-complete.yaml if it is not already archived,
        confirm the next-roadmap milestone is 2026.05.278, and write the
        activation artifact.

      CONCRETE STEPS:
        0. PRECONDITIONS: results/experiment_2948_capstone_v277.json exists and
           research-roadmap-next.yaml milestone equals 2026.05.278.
        1. Read the .277 capstone and summarize paper_ready, headline_outcome,
           clean/flagged/blocked/missing counts, and next gaps.
        2. Append .277 completion metadata to research-complete.yaml only if
           missing; do not duplicate an existing .277 milestone entry.
        3. Verify research-roadmap.yaml remains untouched and current.
        4. Write the deliverable JSON.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        archived_milestone: "2026.05.277"
        activated_milestone: "2026.05.278"
        capstone_source: "results/experiment_2948_capstone_v277.json"
        paper_ready_from_capstone: bool
