      - experiment_id: exp5348-capstone-v487
        verdict: "complete: .487 synthesized with runtime_clean=True, structured_output_protocol_ready=False, bounded_sota_quality_usable=False, utility_memory_ready=True, bounded_compressor_ready=True, self_learning_scaleup_ready=False, qstr_solver_kan_clean=True, internal_energy_corrigendum_clean=False, hardware_speedup_claim=false"
        addressed_by: "Recurring milestone transition scope, but this task archives .487 truth and activates .488 rather than synthesizing .487."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Run from {project_root} on {date}. The user has declared all tasks in milestone 2026.07.487 complete. This task records the transition to 2026.07.488 and must not overwrite the active roadmap by hand.

      EXISTING CODE TO READ FIRST:
      - CODEX.md
      - CLAUDE.md
      - research-roadmap.yaml
      - research-roadmap-next.yaml
      - openspec/change-proposals/research-roadmap-vNEXT.md
      - ops/status.md
      - ops/changelog.md
      - ops/conductor-log.md
      - results/experiment_5348_capstone_v487.json

      TASK:
      Produce the transition artifact for moving from .487 to .488. Confirm the .487 capstone truth, confirm the .488 pre-staged roadmap files exist, and record that this task did not edit the active roadmap or conductor.

      Deliverable: `results/experiment_5349_archive_487_activate_488.json`.

      CONCRETE STEPS:
      1. Read the .487 capstone artifact and summarize only what it actually proves.
      2. Verify `openspec/change-proposals/research-roadmap-vNEXT.md` and `research-roadmap-next.yaml` exist and name milestone 2026.07.488.
      3. Confirm `research-roadmap.yaml` and `scripts/research_conductor.py` were not modified by this task.
      4. Write the deliverable JSON at `results/experiment_5349_archive_487_activate_488.json`.

      REQUIRED ARTIFACT FIELDS:
      - experiment_id: principle: Stable id ties the artifact to this roadmap task.
      - milestone: principle: Prevents cross-milestone evidence laundering.
      - status: principle: Lets the conductor distinguish completed, blocked, and partial work.
      - honest_verdict: principle: Terminal prefix `complete:` or `blocked_` prevents ambiguous reconciliation.
      - inference_substrate: principle: This is aggregation from upstream artifacts, not fresh inference.
      - archived_milestone: principle: Records the source milestone being closed.
      - activated_milestone: principle: Records the destination milestone being staged.
      - v487_capstone_verdict: principle: Carries forward the actual capstone truth.
      - roadmap_next_present: principle: Bare boolean guard against activation without a pre-staged roadmap.
      - milestone_doc_present: principle: Bare boolean guard against roadmap/doc drift.
      - active_roadmap_modified: principle: Bare boolean must remain false because activation is conductor-owned.
      - conductor_modified: principle: Bare boolean must remain false by operator instruction.
      - cited_upstream_artifacts: principle: Makes the transition auditable without re-running experiments.
      - preconditions_checked: principle: Records which files/resources existed before writing the artifact.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5350-sota-source-delta-v488
