- id: exp866-kan-hardware-analysis
  milestone: 2026.04.66
  deliverable: results/experiment_866_kan_hardware_analysis.json
  title: 'Exp 866: KAN Hardware Complexity Analysis — arXiv 2604.03345 LUT Estimates (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2604.03345 (Hardware-Oriented KAN Inference Complexity) provides
    per-knot LUT estimates for piecewise-linear KAN (Kolmogorov-Arnold Network) layers.
    Each piecewise-linear segment requires 2 comparators + 1 multiplier + 1 adder =
    approximately 8-12 LUTs per segment. For KAEMEnergy (Carnot's KAN-based energy model)
    with 8 knots per activation:
      LUT estimate = n_inputs × n_hidden × n_knots × luts_per_segment
    The question: is KAN feasible on iCE40 HX8K (7680 LUTs) for N=8 energy function,
    or should we prioritize Ising over KAN for KV260 synthesis?

    KAEMEnergy architecture (from carnot-kan crate): input=N spin values, hidden=16,
    knots=8, output=1 (energy). Total activations: N×16 + 16×1 = N×16 + 16.
    For N=8: (8×16 + 16) × 8 knots × 10 LUTs each = 1440 LUTs (within budget!).

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/kan.py — KAEMEnergy model (find layer sizes, n_knots)
    - crates/carnot-kan/src/ — Rust KAN implementation (find layer dimensions)
    - research-references.md — arXiv 2604.03345 entry
    - results/experiment_859_ice40_n8_combinational.json — Ising LUT count (baseline)
    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc Phase 4 section

    TASK: Compute per-layer LUT estimates for KAEMEnergy using arXiv 2604.03345 formula.
    Compare vs Ising N=8 LUT count from Exp 859. Determine synthesis priority.
    Produce artifact with kan_fpga_roadmap_clear=True and priority_determined.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/models/kan.py. Find:
       - n_inputs (should be N, flexible)
       - n_hidden (likely 16 or 32)
       - n_knots (likely 8 or 16)
       - activation function type (piecewise-linear or spline)
    3. Read crates/carnot-kan/src/ for the same parameters (cross-validate Python vs Rust).
    4. Implement python/carnot/analysis/kan_hw_analysis.py:
       class KANHardwareAnalyzer:
         def __init__(self, n_inputs: int, n_hidden: int, n_knots: int,
                      luts_per_segment: int = 10):
           self.n_inputs = n_inputs
           self.n_hidden = n_hidden
           self.n_knots = n_knots
           self.luts_per_segment = luts_per_segment

         def lut_estimate_layer(self, fan_in: int, fan_out: int) -> int:
           # per arXiv 2604.03345 formula
           return fan_in * fan_out * self.n_knots * self.luts_per_segment

         def total_lut_estimate(self) -> dict:
           layer1 = self.lut_estimate_layer(self.n_inputs, self.n_hidden)
           layer2 = self.lut_estimate_layer(self.n_hidden, 1)
           total = layer1 + layer2
           return {
             "layer1_luts": layer1,
             "layer2_luts": layer2,
             "total_luts": total,
             "ice40_hx8k_budget": 7680,
             "within_budget": total < 7680
           }

         def synthesis_priority(self, ising_lut_count: int) -> str:
           kan_luts = self.total_lut_estimate()["total_luts"]
           if kan_luts < ising_lut_count and kan_luts < 7680:
             return "KAN_PRIORITY"
           elif ising_lut_count < kan_luts and ising_lut_count < 7680:
             return "ISING_PRIORITY"
           else:
             return "BOTH_FEASIBLE"
    5. Read results/experiment_859_ice40_n8_combinational.json.
       Extract ising_lut_count (from pnr_lut_count field). If Exp 859 failed or
       lut_count unavailable, use 144 as the theoretical estimate.
    6. Instantiate KANHardwareAnalyzer with actual KAEMEnergy parameters from step 2.
       Compute for N=8: total_lut_estimate().
       Compute synthesis_priority(ising_lut_count).
    7. Also compute for N=4 and N=16 as sensitivity analysis.
    8. Create scripts/experiment_866_kan_hardware_analysis.py using ExperimentTemplate(866).
       tmpl = ExperimentTemplate(866, "KAN hardware complexity analysis",
                                  "results/experiment_866_kan_hardware_analysis.json",
                                  requires_gpu=False)
       tmpl.setup()
       Collect:
         - kan_lut_estimate_n8: int
         - ising_lut_count: int (from Exp 859 or 144 theoretical)
         - synthesis_priority: str (KAN_PRIORITY / ISING_PRIORITY / BOTH_FEASIBLE)
         - within_ice40_budget: bool
         - kan_fpga_roadmap_clear: True if within_ice40_budget=True AND priority_determined
         - priority_determined: True
         - sensitivity: {n4: int, n8: int, n16: int}
       honest_verdict:
         - "kan_fpga_roadmap_clear" if within_ice40_budget=True
         - "kan_over_budget" if within_ice40_budget=False
         - "analysis_complete" always (analysis is always complete even if over budget)
    9. Add spec update: openspec/capabilities/kan-model/spec.md — add REQ-KAN-020
       "KAEMEnergy MUST be analyzable for FPGA LUT budget using arXiv 2604.03345
       per-knot estimates. Target: N=8, within iCE40 HX8K 7680 LUT budget."
    10. Write tests/python/test_experiment_866_kan_hardware_analysis.py with 100% coverage.
        Test lut_estimate_layer() formula.
        Test total_lut_estimate() structure.
        Test synthesis_priority() logic for all three branches.
        Test sensitivity analysis dict.
        Traces to REQ-KAN-020 (new), SCENARIO-KAN-030 (LUT estimate).
    11. Reconcile:
        - ops/changelog.md: one-line entry
        - ops/status.md: "Exp 866: KAN hardware analysis. kan_lut_estimate_n8={result}.
          synthesis_priority={result}. within_budget={result}."
    12. tmpl.assert_deliverable_written() as final line.

