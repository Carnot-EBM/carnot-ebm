    - {project_root}/results/experiment_6122_arc_primitive_reachability_loo.json
    - {project_root}/scripts/experiment_template.py cached_sota_pair pattern
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and run a strict adapter-withheld preflight for the live E3 path.
    Demonstrate actual candidate generation, valid action execution, an exact
    environment transition, and a simulation-to-action ledger without game-
    specific adapters, source, registry trajectories, or solution recipes.

    CONCRETE STEPS:
    0. PRECONDITIONS: require two idle RTX 3090 leases, CUDA llama.cpp, the
       exact cached GGUF files, offline ARC, a readable registry, and writable
       raw and aggregate paths. MODEL_SPECS must contain and execute
       `unsloth/Qwen3.8-27B-GGUF` as the pinned live-generator arm and
       `unsloth/Qwen3.6-35B-A3B-GGUF` as a mandatory SOTA headline control.
       Never download or substitute. On failure write terminal `blocked`,
       `inference_substrate_class=blocked_no_run`, and exact
       gate_check_summary.
    1. Registry-precheck before choosing games. Exclude any game and level for
       which the same adapter-withheld live mechanism already has a credited
       self-discovery receipt. Freeze at least four public games, stratified by
       mechanic and registry depth, before model outcomes are visible.
    2. Add REQ-ARC-7099 and RED tests before implementation. Test forbidden
       imports and file reads, adapter lookup, game-source access, registry-
       trajectory access, advice-only output, invalid action output, model-ID
       substitution, trace tampering, and a real valid-action transition.
    3. Start isolated worker processes with adapters, game source, known action
       recipes, registry trajectories, per-game checkpoints, and hand-built
       solvers unavailable to the policy. Keep only ordinary observations,
       generic action schema, the public runtime API, and the live E3 route.
    4. Run at least one bounded action cell per model on at least two frozen
       games. Use `E3AgentPolicy` through `make_carnot_agent`; do not use the
       old non-adapter advice branch in arc_loop_solve.py.
    5. Persist raw attempt traces outside `results/` before aggregation. For
       each decision record observation hash, candidate actions, simulation
       invocation, returned forecast, interpretation, forecast-consuming
       selected action, exact transition, level before and after, latency,
       model ID, GPU, seed, and budget.
    6. Set adapter_withheld_live_path_ready_score=1 only if both required model
       arms emit a valid action, produce an exact transition, pass the forbidden-
       path receipts, and have a complete forecast-to-action ledger. Do not
       require a level advance. Advice text or an unreachable offline solver
       scores zero.
    7. Claim no game-level solve. Use solve_provenance=development_proxy,
       arc_registry_delta=0, and offline_reproduced=true only for exact
       transitions replayed in a fresh environment.
    8. Run focused tests, real GPU telemetry and cleanup checks, artifact
       validation, ARC provenance and level-up lints, adversarial verification,
       row-consistency lint, scoped spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (live E3 local-GGUF action generation plus exact ARC
       transitions); inference_substrate_class (model_full_generation, or
       blocked_no_run on a blocked precondition); execution_venue (host);
       duration_s; source_artifact_hashes; MODEL_SPECS; models_used;
       model_path_receipts; gpu_telemetry_rows; frozen_game_ids;
       registry_precheck_rows; isolation_rows; forbidden_import_rows;
       forbidden_read_rows; per_game_results; rows; action_rows;
       simulation_invocation_rows; forecast_rows; forecast_consumption_rows;
       exact_transition_rows; advice_only_row_count; valid_action_row_count;
       raw_trace_paths; raw_trace_hashes; solve_provenance
       (development_proxy); offline_reproduced; arc_registry_delta (0);
       adapter_withheld_live_path_ready_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
