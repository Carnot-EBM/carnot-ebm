      5. Write any fixture JSONL under `data/research/context_cot_clbench_parametric_shortcut_v1.jsonl` if the directory exists or can be safely created.
      6. Write `results/experiment_3210_context_cot_clbench_parametric_shortcut_fixtures_v1.json`.

