    - {project_root}/results/experiment_7476_v655_option_qualification.json
    - {project_root}/research-references.md

    TASK:
    Produce results/experiment_7491_v656_window_protocol.json. Create scripts/experiments/experiment_7491_v656_window_protocol.py as the thin entrypoint and reuse or add small logic in python/carnot/experiment_7491_v656_window_protocol.py. Add tests/python/test_experiment_7491_v656_window_protocol.py for new behavior. These are new output paths, not existing prerequisites. Earlier V656 task deliverables are resolved from this roadmap, never guessed. Every acceptance gate and artifact field must include a one-line principle explaining the failure it prevents.

    CONCRETE STEPS:
    1. Emit a flushed progress line immediately. Read the listed sources and relevant existing REQ-* capability before changing code. Authenticate preconditions and original flags. New TASK paths are outputs to create; earlier V656 artifacts are inputs only after their producers run.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed at least every 60 seconds. Stream child stdout unbuffered; emit truthful pending-operation heartbeats every 60 seconds during blocking calls, authoring and validation. Keep EVERY gap below 600 seconds: silence can kill at 1200 seconds, while continuous progress permits the 4800second hard cap. Checkpoint completed units and terminate only owned processes.
    3. Ensure the relevant openspec/capabilities/*/spec.md contains REQ-* requirements, extend it and SCENARIO-* first for new behavior, then add meaningful failing tests and implement only the affected helper plus thin entrypoint. Reuse existing qualified helpers; never copy an old experiment main, stale constants or full-suite validation manifest.
    4. Declare inference_substrate_class=no_model_load, execution_venue=host, MODEL_SPECS=[], model_specs=[], model_invoked=false and zero current LLM calls. Name the actual CPU numeric/fixture/protocol work in inference_substrate; attach measured small_ebm_training receipts when fitting. Archived model evidence is not current inference.
    5. Preserve the existing 180 training and 60 calibration source-group roster; seal NEW 120 test and 160 online groups from the pinned RAGTruth source. Exclude all source hashes and group aliases used by previous evaluation/online captures and their manifests across milestones, and exclude fit groups. Record the search scope and inaccessible archives. Do not declare freshness if provenance is incomplete; return a diagnosed blocked gate.
