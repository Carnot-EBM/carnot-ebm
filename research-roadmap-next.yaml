- id: exp8083-contract-custody
  title: Bind fourteen tasks and preserve the terminal V699 evidence
  phase: 1
  track: science
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 30
  per_unit_rows: true
  milestone: 2026.10.700
  deliverable: results/experiment_8083_v700_contract_custody.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prior_failures:
  - experiment_id: exp7992-contract-methods
    verdict: complete_blocked_authority
    addressed_by: Reuse the repaired parameterized immutable authority reader; cover private failure and activation
      routes for fourteen current tasks.
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V699 completed its schedule. H1 gained 0.005263 over 95 sources with one beneficial change; H2 gained zero. All three PRD gaps remain open.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py; python/carnot/reporting/primary_publication.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/v685_authority_lifecycle.py; scripts/experiments/experiment_8070_v699_contract_custody.py; results/experiment_8082_v699_capstone.json; results/experiment_8071_v699_process_isolation_diagnostic.json
    TASK:
    Bind fourteen tasks and preserve the terminal V699 evidence. Deliver results/experiment_8083_v700_contract_custody.json, immutable primitive evidence under results/raw/experiment_8083_v700_contract_custody/ and thin runnable scripts/experiments/experiment_8083_v700_contract_custody.py.
    CONCRETE STEPS:
    0. PRECONDITIONS: print a flushed start line. Check exact input paths, primary hashes, terminal sidecars, tools and environment with bounded calls. Record preconditions_checked with each actual observation. Missing external inputs end complete_blocked_<resource>, verdict_class=blocked, with exact failed operands in gate_check_summary. Never fabricate inputs.
    1. Emit a flushed progress line at every phase boundary and before and after model load, generation, a benchmark or any subprocess. Use PYTHONUNBUFFERED=1 and print(..., flush=True). Report actual completed and pending units inside long loops and while children run at least every 60 seconds. Keep every silence gap below 600 seconds. Bound each tool call. Write any file over about 200 lines in several tool calls of at most about 150 lines. Send a progress message between those calls. Never pad time or invent progress.
    2. Read the V700 design and named sources. Add applicable REQ-* and SCENARIO-* specifications before code. Write failing tests before implementation. Keep test and fixture outputs in private temporary directories. Reuse qualified helpers. Preserve existing assertions, historical primary bytes and failed receipts.
    3. Bind the visible table, complete executable JSON, ordered fourteen tasks and canonical digest to immutable V700 staged/design snapshots. At activation accept only a byte-matching active snapshot. Never require the current staged pathname to survive activation. Exercise E2E-018 private authority mutations.
    4. Preserve all thirteen V699 dispositions, exact primaries and validation sidecars. Exp8071 completed 64 forwards: two current-context duplicates failed tolerance, while fresh-process pairs passed. Its publication failed PRECONDITIONS_UNDECLARED. Preserve that disqualified status; do not retrofit provenance or rerun its model calls.
    5. Authenticate qualified V699 heads, source manifests, historical exposure inventories and board receipts as separate inputs. Export historical_inputs_ready_score separately from contract_ready_score. Historical evidence supplies controls only, not fresh outcomes. No branch may need a positive V699 scientific verdict.
    6. Freeze required validation commands before measurement. Run focused unit and consumer tests, Ruff check and format, strict mypy, 100% changed-code statement coverage and scoped spec coverage. Exercise the named private real CLI success, blocked, mutation and cold-replay routes from outside the checkout. Record argv, duration, normal exit and log hash. Native edits also require cargo test, fmt, clippy and a loaded-binding test. Preserve existing global health failures as separate diagnostics.
    7. Save primitive rows and input, code, config, model and checkpoint hashes. Independently rebuild reductions. Run scripts/adversarial_verify.py and strict scripts/verdict_row_consistency_lint.py. Publish through primary_publication only after normal process exit and passing owned validation. Owned validation failure sets readiness=0 and verdict_class=disqualified. Unchanged external blocks are blocked, not partial. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md without deleting history.
    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: terminal complete_* string; principle: finished negative science must not trigger retries.
    - verdict_class: positive | circular_positive | null | blocked | disqualified | partial; principle: partial denotes unfinished owned work; external missing, retired or blocked inputs are terminal blocked.
    - verifier_is_oracle, claim_scope; principle: oracle or fixture success cannot establish independent verification benefit.
    - flagged_adversarial, required_checks_passed, validation_receipts, terminal_validation_sidecar_path; principle: readiness requires authenticated current checks.
    - preconditions_checked, gate_check_summary: check/upstream/path/hash/field/op/expected/observed; principle: every blocked_* verdict names the failed check and actual value.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, trained_head_specs; principle: current model work and historical model provenance remain distinct.
    - rows: source/unit/arm/condition, primitive metric, numerator, denominator, status and exclusion_reason; principle: every comparison is independently recomputable.
    - intended_count, eligible_count, independent_count, completed_count, excluded_count, censored_count, failed_count, sample_size_budget; principle: repetitions do not create independent source groups.
    - random_seed, reproducibility_checksum, source_artifact_hashes, raw_shard_hashes, code_config_hashes, phase_spans; principle: each observation binds to exact inputs and execution.
    - exposure_scope, generalized_learning_benefit_score: 0; principle: recorded-history separation is not proof of unknown prior exposure or general lifelong benefit.
    - field_principles: explanations for additional fields; principle: metrics must state which incorrect inference they prevent.
    - contract_ready_score, historical_inputs_ready_score: 0|1; principle: authority validity and source availability are separate.
    - canonical_tasks_sha256, authority_snapshots, historical_dispositions, named_input_resolution; principle: actual task bodies and failed historical evidence remain auditable.
    - substrate_declaration: aggregation_from_upstream_artifacts or verifier_ensemble_against_cached_candidates as executed, no_model_load, MODEL_SPECS=[]; principle: cached evidence and small numerical heads do not imply a current LLM call.
    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8083_v700_contract_custody.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  agent_type: claude
  model: opus
  operator_override: '2026-05-29 standing operator directive: routine milestone transition; the repaired immutable
