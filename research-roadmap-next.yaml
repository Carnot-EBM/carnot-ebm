    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1748-phase1-huggingface-retry-3rd
        verdict: blocked_huggingface_credentials_unavailable
        addressed_by: "Carry forward from .182. Honest blocked verdict is acceptable if credentials missing."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: Final retry for HF mirror.

      EXISTING CODE TO READ FIRST:
        - scripts/publish_huggingface.py

      TASK: Upload one minimal checkpoint to HuggingFace or emit honest blocked verdict.

      CONCRETE STEPS:
        0. PRECONDITIONS: Check huggingface-cli whoami and python HfApi.
        1. If credentials pass, upload smallest model in models/ with no-emoji model card.
        2. If blocked, emit honest blocked_credentials.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

