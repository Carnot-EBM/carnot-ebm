    retire_if_same_verdict: true
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.669. V668 has ten producer artifacts and four missing producers after backend failures or dependency skips. All fourteen tasks were handled, but unrun science is not a null. The archive currently lags at V667. This accounting task gates no science.

