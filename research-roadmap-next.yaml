    1. Read CLAUDE.md spec-first workflow.
    2. GATE CHECK: Read results/experiment_855_preflight_v15.json.
       If live_env_fixed != True: write artifact with status="blocked",
       blocked_by="exp855_live_env_not_fixed" and exit.
       Read results/experiment_856_dualgpu_production.json.
       If dual_gpu_deployed != True: write artifact with status="blocked",
