milestone: 2026.06.404
milestone_title: "ELEVATE the proven oracle-distinct EFFICIENCY moat with a STRONGER learned-heuristic class (LLM-generated Python action-cost heuristics, arXiv:2503.18809, BUILDING ON the clean .403 compounding win exp4364) as the .404 HEADLINE; drive the ARC north-star ACCURACY DEEPER (33 -> ? reproducible levels: deep-tail high-headroom + named hidden-rule gaps, operator MANDATORY 2026-06-17); REPAIR-OR-RETIRE the THRICE-blocked DiffusionGemma in-generation conversion with a scorer-INDEPENDENT control (CoDiLA arXiv:2603.20216) + corpus-specific leak requalification; probe the oracle-distinct ACCURACY frontier with a cheap verifier-as-DETECTOR measurement (2026-06-14 P0). .403 PROVED the efficiency moat compounds + deploys (exp4364 25->16 held-out env-actions, verifier_is_oracle=false) but the DiffusionGemma HEADLINE blocked a 3rd time (exp4359 scorer_leaky_in_search_corpus -- the .401 leak-robust scorer is corpus-specific). The SOTA-ingestion's discover->ingest->plan flagged_for_v404 = llm_generated_action_heuristics_compounding_v404: BUILD ON THE WIN. ARC 26->33 reproducible levels / 17 games. paper_ready=True (FoVer 0.9131, G1-G4)."
milestone_doc: openspec/change-proposals/research-roadmap-v404.md
milestone_overview: |
  .403 left a clean scorecard (exp4368 capstone): the in-generation DiffusionGemma moat->generation
  conversion is STILL OPEN -- blocked a 3rd consecutive time (.399 degenerate-controls -> .402 MCQ-harness-bug
  -> .403 scorer-leak), this time because the .401 leak-robust scorer LEAKED on the NEW free-form generation
  corpus (leak-robustness is corpus-specific). MEANWHILE the EFFICIENCY moat landed a clean, oracle-distinct,
  DEPLOYED, COMPOUNDING win (exp4364, learned A* action-cost heuristic, held-out env-actions 25->16). The
  SOTA-ingestion's own flagged_for_v404 points the .404 headline at BUILDING ON THE WIN, not re-hammering the
  blocked path (north-star Depth-Over-Breadth). .404 takes the natural depth step on each axis:

    PHASE 0 -- TRANSITION: exp4369 archive .403 -> activate .404; record the TRUE .403 close-state.

    PHASE A -- HEADLINE (oracle-distinct EFFICIENCY moat, STRONGER function class; verifier_is_oracle=false):
      A1 (exp4370) LLM-generated action-cost heuristics (arXiv:2503.18809): the codex proposer writes several
        DOMAIN-DEPENDENT Python heuristic programs per ARC game, selects the strongest by greedy-best-first-search
        on TRAINING levels, then evaluates on FRESH HELD-OUT levels vs the DEPLOYED linear heuristic (exp4364),
        with static-leakage analysis + reproduction gates. Emit llm_heuristic_beats_linear BARE bool.
      A2 (exp4371, GATED on A1 llm_heuristic_beats_linear==true) contamination/leakage skeptic-proofing -- the
        twice-burned-operator gate: is the win from a genuinely-stronger heuristic, or public-ARC-layout
        memorization / game-specific shortcuts / single-held-out-split overfit?

    PHASE B -- ARC NORTH STAR (operator MANDATORY 2026-06-17; incremental +1..+n per game; verifier_is_oracle=true):
      B1 (exp4372) E3 DEEPER high-headroom: tn36 L8 + tr87 L7 + lp85 L5 + tu93 L5 + sc25 L2 (+4 ceiling).
      B2 (exp4373) E3 BLOCKED-mechanic next-levels: ar25 L2 (action7 undo-stack) + ka59 L2 (step-counter HUD) + ft09 L2.

    PHASE C -- IN-GENERATION ACCURACY moat (REPAIR-OR-RETIRE; verifier_is_oracle=false):
      C1 (exp4374) requalify the .401 scorer's leak-robustness ON the generation corpus + add a scorer-INDEPENDENT
        CoDiLA local-coherence control (arXiv:2603.20216) + PAPO diagnostic (2606.08501), THEN the fixed-NFE Prism
        search OR a clean RETIREMENT (4th scorer-leak/degenerate-control block = falsifiable retirement gate).

    PHASE D -- ORACLE-DISTINCT ACCURACY complementary measurement (2026-06-14 P0; verifier_is_oracle=false):
      D1 (exp4375) verifier-as-DETECTOR AUROC where SELECTION headroom is ~0 (cheap, cached, infra-independent).

    PHASE E -- INFRA + HYGIENE + CAPSTONE: exp4376 SOTA-ingestion -> .405; exp4377 registry/gaps hygiene + GAP-4
      regression guard; exp4378 hardware continuity (KV260 opportunistic); exp4379 capstone .404 + the headline
      decision (did the stronger learned-heuristic class deepen the efficiency moat? did the DiffusionGemma repair
      convert or retire? ARC reproducible-total + G1-G4).

  HARD RULE (every task): the conductor stays STOOD-DOWN on TRM training -- NO task may launch TRM training, run
  pkill/kill against train.py, or WRITE results/trm_runs/. Qwen is FORBIDDEN as the TRAINED base (Spurious-Rewards
  confound); Qwen/Gemma GGUF as an off-policy JUDGE/GENERATOR is fine. SEPO + A2D2 (verifier-as-reward GENERATOR
  training, 2502.01384 / 2606.13565) are OUT-OF-BAND/operator-owned -- flagged in SOTA-ingestion, NOT auto-run
  in-loop. Every LEARNED-verifier value task MUST declare verifier_is_oracle honestly (Circularity Discipline): an
  EXECUTABLE-oracle win (E3 solve) is execution_grounded (verifier_is_oracle=true, ARC progress, NOT a moat
  headline); the moat is the oracle-DISTINCT learned result with a matched control + CI95-excl-0. NO autonomous
  edits to docs/index.html / README / paper prose. Online ARC play stays operator-gated (NO leaderboard
  submission; only offline-reproduced levels count). DiffusionGemma MUST use the llama.cpp PR binary, NOT a
  standard GGUF loader (known-issues 2026-06-15). Cross-game value TRANSFER (exp4342) and cross-domain SELECTION
  (exp4314) are RETIRED -- do NOT re-propose either.

