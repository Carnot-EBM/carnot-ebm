    python/carnot/models/kan/*.{npz,pkl,json,pt}\n     d. Try: results/experiment_*_kan*.{npz,json} (sorted newest-first)\n
    \    e. If found: record kan_model_found_at path.\n     f. If NOT found: retrain_needed=True.\n\n  2. Load or initialize
    KAN model:\n     If found: load model weights.\n     If not found: initialize 2-layer KAN with 8 knots per spline, input_dim=len(verifier_scores),
    output_dim=1.\n\n  3. Load telemetry corpus (36 examples). Prepare (verifier_scores, label) pairs.\n\n  4. Apply LipNeXt
    training with λ=0.1, target_lip=5.0:\n     For each training step:\n       loss = BCE(predictions, labels) + 0.1 *
    max(0, local_lip - 5.0)**2\n       local_lip = max_singular_value(jacobian(model, input_batch))\n     Train for min(200,
    N_steps_to_convergence) steps.\n\n  5. Evaluate:\n     new_kan_auroc = roc_auc_score(labels, model(verifier_scores_test))\n
