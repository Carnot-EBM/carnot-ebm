  - id: exp2745
    milestone: "2026.05.260"
    deliverable: "results/experiment_2745_weak_strong_verification_policy.json"
    title: "Weak-Strong Verification Policy (arXiv:2602.17633): Optimal Two-Threshold Routing"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 35
    track: pipeline

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .260 — no prior failures for this specific scope.

      arXiv:2602.17633 "When to Trust the Cheap Check: Weak and Strong Verification for Reasoning":
      Formalizes two-threshold routing policy:
        - Below t_low: weak verifier sufficient, accept (low verification cost)
        - Above t_high: strong verifier needed, invoke full ensemble (high accuracy)
        - Between: uncertain, apply threshold-adaptive verification cost

      Carnot context: OTV probe failed (exp2728, probe_auroc=0.25), but the two-tier ODAR routing
      achieved 65% savings. The weak-strong policy formalizes this empirical result with a principled
      threshold derivation:
        - Weak verifier: ODAR free-energy score (fast, model-free)
        - Strong verifier: full Tier 0-0v ensemble (accurate, expensive)
        - Threshold calibration: what ODAR score threshold minimizes verification cost while maintaining
          a target false-negative rate?

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (odar_route() from exp2720, route() from exp2728)
      - data/fover_corpus.jsonl (FoVer corpus for threshold calibration)

      TASK: Implement optimal two-threshold weak-strong routing policy. Calibrate thresholds on FoVer.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; import sys; sys.path.insert(0,'python'); import carnot.pipeline"`
            Record: pipeline_importable (bool).
            If false: write honest_verdict 'blocked_carnot_not_importable' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Calibrate thresholds on FoVer eval split (random_seed=42, 80/20 split):
         For each example: compute weak_score = odar_free_energy_score (or proxy: TF-IDF confidence),
         compute ground_truth_label = correct (0) or incorrect (1).
         Use Platt calibration or isotonic regression to find thresholds t_low, t_high such that:
         - FNR (false-negative rate) at t_low <= 0.05 (accept errors < 5%)
         - FPR (false-positive rate) at t_high <= 0.10 (over-verification < 10%)
         Record: t_low (float), t_high (float), calibration_method (str).

      2. Implement WeakStrongRouter:
         route(prompt, response, weak_score=None) -> RoutingDecision:
           If weak_score is None: compute weak_score from odar or TF-IDF proxy.
           If weak_score < t_low: return RoutingDecision(path='accept', verifier='none')
           If weak_score > t_high: return RoutingDecision(path='full_ensemble', verifier='tier0_all')
           Else: return RoutingDecision(path='tier0f_only', verifier='semantic_calibration')
         Add to VerifyRepairPipeline.
