    - experiment_id, task_id, milestone, schema, run_date={date}, claim_scope: principle: bind the claim to this invocation and its actual evidence boundary.
    - honest_verdict: terminal complete_* string; verdict_class: positive | circular_positive | null | blocked | disqualified | partial. principle: only incomplete owned work is partial; unchanged external blocks are terminal and oracle controls are circular_positive.
    - gate_check_summary: list of upstream ID, path, sha256, check_name, artifact_field, expected, observed and passed. principle: every blocked verdict names the failed operand; missing fields are contract errors, never measured zeros.
    - rows or per_game_results, sample_size_budget, intended_count, eligible_count, completed_count, excluded_count, failed_count, censored_count, independent_count: principle: emit each source/arm/seed/condition metric and exclusion with its numerator and denominator; duplicate calls and seeds do not enlarge independent n.
    - random_seed, reproducibility_checksum, cited_upstream_artifacts, code_config_hashes, raw_shard_hashes, checkpoint_references: principle: reproducibility binds original bytes rather than mutable summaries.
    - acceptance_gate_results, verifier_is_oracle, genuine_headroom, positive_control_results, generalized_learning_benefit_score=0: principle: empirical controls and exposed development evidence cannot certify deployment correctness.
    - validation_receipts, coverage_statement_counts, terminal_validation_sidecar_path, flagged_adversarial, field_principles: principle: the final artifact and process exits must qualify, with the purpose of every added field recorded.
    - preconditions_checked, inference_substrate, inference_substrate_class, MODEL_SPECS, model_specs, model_invocation_counts, trained_head_specs, duration_s, phase_spans: principle: report actual present work separately from imported historical measurements.
    - contract_ready_score: integer 0 or 1. principle: readiness requires qualified measurement and all owned checks; it does not require a scientific win.
    - contract_rows, canonical_tasks_sha256, authority_snapshots, historical_disposition_rows, method_source_map, activation_observation: principle: full prompt authority and authentic historical failures travel with later decisions.
    - substrate_declaration: aggregation_from_upstream_artifacts for reduction, verifier_scoring for CPU numerical work; no_model_load; MODEL_SPECS=[]; zero pretrained model calls. principle: cached features and small-head training do not constitute a new LLM invocation.
