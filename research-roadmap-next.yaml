  - id: exp4443-bank-g50t-example-conditioned-win
    milestone: 2026.06.411
    title: "PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY) -- BANK the .410-quarantined example-conditioned win-induction solve (g50t L1) CLEANLY: EMIT inference_substrate correctly so the REAL solve is not DURATION_TOO_SHORT-quarantined; +1 reproducible game/level."
