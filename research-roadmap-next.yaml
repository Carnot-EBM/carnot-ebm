    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; ops/exclusion_manifest.yaml; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/v712_capstone.py; python/carnot/reporting/v712_capstone_evidence.py; python/carnot/reporting/roadmap_contract.py; results/experiment_8247_v712_capstone.json; results/experiment_8248_v713_evidence_intervention_methods.json; scripts/publication_gate.py; ops/verifier_gaps.md; research-references.md
    TASK:
    Reconcile fourteen outcomes and decide whether evidence or learning improved. Deliver results/experiment_8261_v713_capstone.json. Create the thin runner scripts/experiments/experiment_8261_v713_capstone.py. Store primitive evidence under results/raw/experiment_8261_v713_capstone/. Keep execution readiness separate from scientific benefit.
    CONCRETE STEPS:
    0. PRECONDITIONS: Emit a flushed start line. Authenticate required inputs and qualified terminal sidecars. Check private scratch and required tools before measurement. Missing external resources produce complete_blocked_<operand>, verdict_class=blocked. Record failed operands in gate_check_summary. Do not invent data or replace missing units.
    1. Emit a flushed progress line at every phase boundary. Emit one before and after every model load, generation, benchmark and subprocess. Print completed/pending counts inside long loops. Print a heartbeat at least every 60 seconds while children run. Keep every output gap below 600 seconds. Use unbuffered output, bounded deadlines and process-group cleanup. Write any file over about 200 lines in several tool calls of at most about 150 lines. Send a progress message between calls. Split work into resumable batches; no single huge tool call. Do not pad runtime.
    2. Add relevant REQ-* and SCENARIO-* before implementation. Write focused failing tests first. Preserve existing tests and assertions. Reuse qualified modules through small adapters. Freeze owned validation commands before measurement. Use private fixtures outside results/ and scratch outside the repository root. Do not update generator weights or publish externally.
    3. Declare no_model_load, MODEL_SPECS=[] and zero current LLM calls. Use aggregation_from_upstream_artifacts for reductions or verifier_ensemble_against_cached_candidates for small-head fitting/scoring. Record trained_head_specs separately. Reading the embedded vocabulary without neural weights is tokenizer-only work, not a model inference call.
    4. Run unconditionally. Enumerate Exp8248 through Exp8261 exactly: thirteen upstream tasks and this capstone. Resolve declared outputs first. Resolve conductor gate artifacts by exact task_id and experiment_id when paths differ, retaining actual paths and hashes. Record missing files, failed fields and measured zeros as different dispositions.
    5. Check full task equality among design JSON, visible table and activation snapshot. Reuse the canonical digest. Freeze each branch audit command with its own entrypoint and input schema; never reuse a producer CLI as its audit replay. V712 had an audit_specific_cold_replay_exit=1 operand. Retain that historical failure and test both valid and tampered current replay commands.
    6. Recompute eligible H1/H2 from source primitives and registered .025 per-hypothesis thresholds. Separate source-information gain, energy-specific gain, later constraint use and retention. Preserve zero independent/generalized scores on exposed development. A valid all-null milestone is terminal. Do not choose a new comparator or replace a failed cohort after seeing results.
    7. Account for every live Qwen load and generation from capture ledgers. Reconcile complete acquisition costs, compatible-kernel bounds, ARC new-outcome support, PolarFire real device evidence and GateMate physical evidence. Record all three PRD gaps separately. Successful infrastructure or a passed transport canary cannot close a scientific gap.
    8. Apply retire_if_same_verdict for scope-matched predecessors. Retire exact current science mechanisms that repeat an informative registered null with sufficient support, a passing learnable control and available oracle action headroom; reopening needs changed evidence or mechanism. Carry required hardware and ARC anti-churn obligations without re-running blocked probes. External missing operands mean blocked. Failed owned checks mean disqualified. Neither means partial.
    9. Run scripts/publication_gate.py --json and retain g1, g2, g3, g4, paper_ready and unmet_gates. V712 recorded paper_ready=true; that historical publication gate does not establish V713 benefit. Write docs/research-notes/v713-outcomes.md with numbers linked to primitive artifacts and one next evidence condition per branch. Do not publish externally.
    10. Run applicable private E2E-018/021 checks from ops/e2e-test-plan.md. Run relevant unit and consumer tests. Measure 100 percent changed-code statement coverage, including real CLI and child statements. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Preserve actual argv, exits, clocks and stdout/stderr hashes. Keep bounded repository-health diagnostics separate; known failures do not establish a global pass.
    11. Cold-replay primitive evidence in a fresh process. Include negative and rehashed-tamper cases. Validate a private candidate with unchanged primary_publication terminal checks, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Publish atomically after normal exit and required checks. Preserve historical primary bytes and honest failure artifacts. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. Do not modify research-roadmap.yaml.
    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Identify the actual invocation.
    honest_verdict, verdict_class: principle: Use complete_* terminal verdicts and one of positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished owned work. Unchanged external failures mean blocked.
    gate_check_summary: principle: Each block names the upstream, actual path/hash, exact field, operator, expected value and observed value. Missing evidence differs from a measured zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts: principle: Record actual current calls separately from historical model provenance.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count: principle: Preserve every source, condition and arm, including missing units. Record metric numerators and denominators. Repeats and seeds do not add independent sources.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle-defined success is circular_positive. All reused sources are exposed development. Both generalization scores remain zero in this milestone.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path: principle: Failed owned checks disqualify the result and set readiness to zero. Readiness does not imply benefit.
    preconditions_checked, duration_s, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes, phase_spans: principle: Bind real work to replayable primitive evidence and actual code/configuration bytes.
    cited_upstream_artifacts, field_principles: principle: Name each imported field and hash. Explain the evidentiary purpose of each added field.
    capstone_execution_ready_score, science_ready_score, h1_development_signal_score, h2_development_signal_score: principle: A complete execution contract does not imply scientific success.
    task_dispositions, three_prd_gaps, board_obligations, retirements, g1, g2, g3, g4, paper_ready, unmet_gates: principle: Account for every task and preserve the fixed publication target.
