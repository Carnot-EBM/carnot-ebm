        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Project root: {project_root}. Run date: {date}.
        exp2919 proved ConstraintBench-style direct optimization is feasible to
        run locally, but the artifact is flagged because syntax_valid_rate and
        feasibility_rate were identical, duration was too short for a live-model
        headline row, and reproducibility_checksum was missing.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (SOTA Local Models; Failed-Experiment Rerun Discipline)
        - scripts/experiment_template.py (cached_sota_pair() docstring)
        - python/carnot/inference/sota_models.py
        - results/experiment_2919_constraintbench_mini_direct_optimization_v1.json
        - research-references.md (ConstraintBench, llguidance, BEAVER entries)

      TASK:
        Rerun a bounded ConstraintBench mini experiment with constrained
        structured output and exact verifiers. Produce either a clean corrected
        row or an honest blocked artifact.

      CONCRETE STEPS:
        0. MODEL_SPECS:
           a. Use cached_sota_pair(gpu_indices=(0, 1)) first.
           b. The live headline path must include at least one of:
              - unsloth/Qwen3.6-35B-A3B-GGUF
              - unsloth/gemma-4-31B-it-GGUF
              - unsloth/gemma-4-26B-A4B-it-GGUF
           c. Legacy tiny models are allowed only for CPU smoke-tests. If only
              legacy models are available, write blocked_sota_gguf_cache_missing.
        1. Set random_seed = 2926.
        2. Use n_tasks >= 30 and record task ids, objective functions,
           constraints, and exact solver/reference answers where available.
        3. Prefer llguidance or another local JSON-schema/CFG path if already
           installed. If not installed, use prompt-level schema plus deterministic
           parser repair, and record constrained_decoder_available: false.
        4. Generate local GGUF answers with raw response capture, model path,
           prompt hash, GPU index, and per-task seed.
        5. Compute syntax_valid_rate over all outputs.
        6. Compute feasibility_rate_overall over all outputs and
           feasibility_rate_given_syntax over only syntax-valid outputs.
        7. Compute optimality_rate_given_feasible over feasible outputs and do
           not use feasibility as a synonym for syntax validity.
        8. Ensure live_inference_duration_s >= 60 unless the task honestly
           writes blocked_duration_gate_failed.
        9. Compute reproducibility_checksum over task manifest, prompts, model
           specs, raw outputs, parsed outputs, and verifier results.
        10. Write the deliverable JSON.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        constraintbench_corrigendum_ready: bool
        flagged_adversarial: bool
        random_seed: 2926
        reproducibility_checksum: str
        model_specs: list
        models_used: list
