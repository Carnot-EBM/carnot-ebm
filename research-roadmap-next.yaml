        verdict: "complete: loo_component_interaction_audit_no_heldout_gain_no_causal_interactions"
        addressed_by: "This is a single-mechanism same-game A/B with direct fire and quality receipts, not another leave-one-component interaction model."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The operator-authorized object-relative trajectory-transfer primitive is wired before expensive LLM reinduction and remains default off. It has unit coverage but no causal A/B. Measure within-game level-to-level transfer only; this is distinct from the retired cross-game learned value-transfer line.

      EXISTING CODE TO READ FIRST
