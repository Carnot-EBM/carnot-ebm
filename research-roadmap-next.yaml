        - honest_verdict:
            principle: "Terminal-prefix required (complete:/success:) so conductor classifies this as a closed task, not a partial."
        - archive_ready:
            principle: "Boolean gate confirming .224 was appended to research-complete.yaml before roadmap swap. Downstream tasks depend on this."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2281-pypi-escalation-fix
    title: "Phase 0: Fix carnot.pypi_escalation Missing Symbols (New Cascade Root Cause)"
    milestone: "2026.05.225"
    deliverable: "results/experiment_2281_pypi_escalation_fix.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    prior_failures:
      - experiment_id: exp2267-dualgpu-import-fix
        verdict: "blocked_full_pretest_import_error"
        addressed_by: "exp2267 fixed the DualGPU ImportError (added 4 symbols to carnot.inference.__init__) but discovered a DIFFERENT pre-test blocker: tests/python/test_pypi_escalation.py imports check_pypi_escalation and run_escalation from carnot.pypi_escalation, but python/carnot/pypi_escalation.py only defines generate_escalation_report and main. These two missing functions are the NEW cascade root cause. This task adds the missing symbols."
    prompt: |
      CONTEXT: The pre-test cascade in .224 was partially fixed by exp2267 (DualGPU exports), but
      a NEW pre-test blocker remains: tests/python/test_pypi_escalation.py imports
      check_pypi_escalation and run_escalation from carnot.pypi_escalation, but
      python/carnot/pypi_escalation.py only defines generate_escalation_report and main.
      This ImportError causes the conductor's pre-test check to fail, labeling ALL tasks as
      SKIP or blocked_gate_check_failed — even tasks with no structured gate.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pypi_escalation.py
        {project_root}/tests/python/test_pypi_escalation.py
      TASK: Add the missing check_pypi_escalation and run_escalation functions to
      python/carnot/pypi_escalation.py and verify the full pre-test suite passes.
      CONCRETE STEPS:
        1. Read tests/python/test_pypi_escalation.py to understand what signature
           check_pypi_escalation and run_escalation must have (what arguments they accept,
           what they return).
        2. Add check_pypi_escalation(experiment_id: int, ...) to python/carnot/pypi_escalation.py.
           The function must accept the arguments that test_pypi_escalation.py passes to it
           and return a dict matching the test's assertions.
        3. Add run_escalation(...) to python/carnot/pypi_escalation.py following the same
           approach — match what the tests expect.
        4. Run: cd {project_root} && .venv/bin/python -m pytest tests/python/test_pypi_escalation.py
           -x -q --no-cov -p no:cacheprovider 2>&1 | tail -10
           Record: pypi_test_errors, pypi_test_failures.
        5. Run the full pre-test check: cd {project_root} && .venv/bin/python -m pytest tests/python
           -x -q --no-cov -p no:cacheprovider 2>&1 | tail -5
           Record: full_pretest_errors, full_pretest_failures.
        6. Set pretest_fixed: true if full_pretest_errors == 0 AND full_pretest_failures == 0.
        7. Write deliverable to results/experiment_2281_pypi_escalation_fix.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if pretest_fixed is true."
        - pretest_fixed:
            principle: "Primary gate for ALL Phase 1 and Phase 2 tasks. True only when the full pytest suite has zero errors and zero failures — not just the pypi_escalation test file alone."
        - pypi_test_errors:
            principle: "Records pypi_escalation-specific errors to confirm the new symbols fix the ImportError."
        - pypi_test_failures:
            principle: "Records pypi_escalation test failures to confirm the added functions satisfy the test assertions."
        - full_pretest_errors:
            principle: "Records full-suite error count post-fix; must be 0 for pretest_fixed=true."
        - full_pretest_failures:
            principle: "Records full-suite failure count post-fix; must be 0 for pretest_fixed=true."
        - symbols_added:
            principle: "Lists the function names added to pypi_escalation.py so reviewers can verify completeness."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2282-fst-real-scale-live-gen
    title: "Phase 1: FST+ODAR+CASAL Real-Scale Live Generation Benchmark"
    milestone: "2026.05.225"
    deliverable: "results/experiment_2282_fst_live_gen.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 50
    gated_on:
      - upstream: exp2281-pypi-escalation-fix
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2268-fst-real-scale-live-gen
        verdict: blocked_gate_check_failed
        addressed_by: "exp2268 had blocked_gate_check_failed because exp2267.pretest_fixed=false. The root cause was a NEW pre-test blocker: carnot.pypi_escalation missing check_pypi_escalation and run_escalation. exp2281 fixes that missing-symbol error. This attempt is identical in scope to exp2268 and runs only when exp2281.pretest_fixed=true."
    prompt: |
      CONTEXT: The .224 capstone (exp2251) demonstrated FST+ODAR+CASAL interoperate, but live
      hardware evidence was limited to a one-token GGUF probe on GPU 0, not full live answer
      generation. exp2268 was blocked by the pre-test cascade root cause. Now that exp2281 has
      fixed that root cause, this task runs the benchmark with FULL ANSWER GENERATION
      (minimum 50 tokens per answer, not a single-token probe).
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/python/carnot/pipeline/odar_router.py
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/scripts/experiment_template.py
      TASK: Run 20 full generate+verify passes on a cached SOTA GGUF, generating complete answers.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. python/carnot/pipeline/odar_router.py imports without error — else blocked_odar_missing.
           b. python/carnot/training/fast_slow.py imports without error — else blocked_fst_missing.
           c. python/carnot/samplers/casal.py imports without error — else blocked_casal_missing.
           d. ls ~/.cache/huggingface/hub/ | grep -i "gemma-4-26B\|Qwen3.6-35B\|gemma-4-31B" returns
              non-empty — else blocked_model_not_cached. Do NOT fabricate GPU inference.
        1. MODEL_SPECS must include at least one of:
           - unsloth/Qwen3.6-35B-A3B-GGUF
           - unsloth/gemma-4-31B-it-GGUF
           - unsloth/gemma-4-26B-A4B-it-GGUF
        2. Construct 20 math/reasoning prompts (multi-step arithmetic, simple logic).
        3. For each prompt: generate a FULL ANSWER (minimum 50 tokens, not just next-token).
           Record the full generated text.
        4. For each answer: run ODAR routing; if deliberative, run FST context prep +
           CASAL constraint enforcement.
        5. Measure:
           - n_violations_found: count of answers where a constraint violation was detected
           - n_violations_repaired: count where repair reduced energy
           - mean_answer_length_tokens: must be >= 50 (not a one-token probe)
           - odar_fast_path_fraction: fraction routed to fast path
        6. Set fst_live_validated: true if n_violations_found >= 1 AND
           mean_answer_length_tokens >= 50.
        7. Write deliverable to results/experiment_2282_fst_live_gen.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if fst_live_validated is true."
        - fst_live_validated:
            principle: "Primary gate for exp2283 and exp2292. True only when violations were found in FULL answers (not token probes). Load-bearing anti-fabrication gate."
        - mean_answer_length_tokens:
            principle: "Must be >= 50 to distinguish from single-token probes. Value < 50 indicates the benchmark did not test full generation."
        - n_violations_found:
            principle: "At least 1 required to demonstrate the pipeline actually runs verification, not just pass-through generation."
        - n_violations_repaired:
            principle: "Records repair effectiveness; 0 is acceptable as an honest finding."
        - models_used:
            principle: "Records which SOTA GGUF ran so claims are model-specific and not hallucinated."
        - preconditions_checked:
            principle: "Lists which resources were verified before inference; pre-empts fabrication mode."
        - duration_s:
            principle: "Real compute with a 26B model takes minutes; < 60s for 20 problems flags fabrication."
        - random_seed:
            principle: "Reproducibility for the 20-example corpus."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2283-fr11-fst-multidomain
    title: "Phase 1: FR-11 FST Multi-Domain Retention Validation"
    milestone: "2026.05.225"
    deliverable: "results/experiment_2283_fr11_multidomain.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2282-fst-real-scale-live-gen
        artifact_field: fst_live_validated
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2269-fr11-fst-multidomain
        verdict: blocked_gate_check_failed
        addressed_by: "exp2269 was blocked because its upstream exp2268 (fst_live_validated) was itself blocked by the pre-test cascade. exp2281 fixes the cascade root cause. exp2282 now runs first. This attempt is identical in scope to exp2269 and runs only when exp2282.fst_live_validated=true."
    prompt: |
      CONTEXT: FR-11 continuous self-learning mandate. exp2241 (.222) proved FST achieves 4x
      sample efficiency on a single-domain synthetic corpus. This task validates that FST
      fast-weight updates generalize across domains: fast weights learned on math problems
      should partially help with code and logic problems.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/training/fast_slow.py
        {project_root}/python/carnot/pipeline/verify_repair.py
        {project_root}/scripts/experiment_template.py
        {project_root}/results/experiment_2282_fst_live_gen.json
      TASK: Validate FST fast-weight retention across 3 reasoning domains.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/training/fast_slow.py imports without error — else blocked_fst_missing.
        1. Create 3 domain corpora (10 examples each, synthetic, no external LLM calls):
           Domain A: arithmetic (a + b = c style)
           Domain B: code constraints (loop bounds, array indices)
           Domain C: logic propositions (if P then Q style)
        2. Run FST learning in sequence: Domain A -> Domain B -> Domain C.
        3. After Domain C training, evaluate fast-weight performance on held-out Domain A examples.
        4. Measure:
           - cross_domain_retention_rate: accuracy on Domain A after Domain C / accuracy after Domain A
           - per_domain_utility_delta: energy reduction per domain
        5. Set fr11_multidomain_passed: true if cross_domain_retention_rate >= 0.75.
        6. Write deliverable with continuous_self_learning_task: true.
        7. Write deliverable to results/experiment_2283_fr11_multidomain.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if fr11_multidomain_passed is true."
        - continuous_self_learning_task:
            principle: "Must be true — FR-11 mandate requires at least one CSL task per milestone."
        - fr11_multidomain_passed:
            principle: "Boolean gate. True only when cross-domain retention >= 0.75; below means FST overfits per-domain."
        - cross_domain_retention_rate:
            principle: "Primary FR-11 multi-domain gate; computed as accuracy-on-A-after-C / accuracy-on-A-after-A."
        - per_domain_utility_delta:
            principle: "Per-domain energy reduction records whether FST helps each domain independently."
        - n_corpus_per_domain:
            principle: "Must be >= 10 per domain for the retention claim to be statistically non-trivial."
        - preconditions_checked:
            principle: "Lists FST module availability check; pre-empts fabrication on missing module."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2284-kancl-n256-clean
    title: "Phase 1: KAN-CL n=256 Per-Knot Regularization Clean Re-attempt"
    milestone: "2026.05.225"
    deliverable: "results/experiment_2284_kancl_n256.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2281-pypi-escalation-fix
        artifact_field: pretest_fixed
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2270-kancl-n256-clean-reattempt
        verdict: blocked_gate_check_failed
        addressed_by: "exp2270 had blocked_gate_check_failed because exp2267.pretest_fixed=false. Root cause: carnot.pypi_escalation missing check_pypi_escalation and run_escalation. exp2281 fixes that root cause. This attempt is identical in scope to exp2270 and runs only when exp2281.pretest_fixed=true."
    prompt: |
      CONTEXT: KAN-CL per-knot importance regularization was proven at small n in .221 (exp2231).
      Attempts at n=256 in .222 (exp2247, blocked by THRML contamination), .223 (exp2258,
      blocked by DualGPU ImportError), and .224 (exp2270, blocked by pypi_escalation cascade)
      have all failed for exogenous reasons. COOL (Springer 2026) demonstrated 20us update
      latency with KANs on n=256-class tasks. This task is a CLEAN re-attempt with NO THRML
      parity, NO bounded_kl metric — purely per-knot importance regularization and retention
      across sequential constraint domains at n=256 spin Ising scale.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/models/substrate_kan.py
        {project_root}/python/carnot/samplers/parallel_ising.py
        {project_root}/scripts/experiment_template.py
      TASK: Validate KAN-CL per-knot importance at n=256 without THRML parity measurement.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/models/substrate_kan.py imports without error — else blocked_kan_missing.
        1. Construct an Ising model with n=256 spins (random J and h, random_seed=42).
        2. Define 3 sequential constraint domains:
           Domain 1: ferromagnetic coupling (J_ij = +1 for nearest neighbors)
           Domain 2: antiferromagnetic coupling (J_ij = -1 for nearest neighbors)
           Domain 3: random sparse coupling (random J, 20% non-zero)
        3. Train KAN-CL with per-knot importance enabled for each domain in sequence.
        4. After Domain 3 training, evaluate accuracy on held-out Domain 1 test instances.
        5. Measure:
           - n256_retention_rate: accuracy on Domain 1 after Domain 3 / accuracy after Domain 1
           - per_knot_update_latency_us: mean update time per step in microseconds
           - n_active_knots: count of importance-weighted active knots after Domain 3
        6. Set kancl_n256_validated: true if n256_retention_rate >= 0.85.
        7. Write deliverable to results/experiment_2284_kancl_n256.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if n256_retention_rate >= 0.85."
        - kancl_n256_validated:
            principle: "Boolean gate for exp2285 and exp2292. True only if retention >= 0.85 at n=256 scale."
        - n256_retention_rate:
            principle: "Primary COOL-parity gate; >= 0.85 means per-knot importance prevents catastrophic forgetting at this scale."
        - per_knot_update_latency_us:
            principle: "Records whether COOL's 20us budget is achievable; informs hardware feasibility story."
        - n_active_knots:
            principle: "Sparsity metric; fewer active knots = more efficient; records importance mask effectiveness."
        - n_spins:
            principle: "Must be 256 to confirm this is the n=256 scale experiment, not a smaller surrogate."
        - random_seed:
            principle: "Must be 42 for reproducibility of the sequential domain training."
        - preconditions_checked:
            principle: "Lists KAN module availability check."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2285-kancl-casal-joint
    title: "Phase 1: KAN-CL n=256 + CASAL Joint Constraint Enforcement"
    milestone: "2026.05.225"
    deliverable: "results/experiment_2285_kancl_casal_joint.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    gated_on:
      - upstream: exp2284-kancl-n256-clean
        artifact_field: kancl_n256_validated
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2271-kancl-casal-joint
        verdict: blocked_gate_check_failed
        addressed_by: "exp2271 was blocked because its upstream exp2270 (kancl_n256_validated) was blocked by the pre-test cascade. exp2281 fixes the root cause; exp2284 now runs the n=256 validation first. This attempt is identical in scope to exp2271 and runs only when exp2284.kancl_n256_validated=true."
    prompt: |
      CONTEXT: KAN-CL (exp2284) provides per-knot importance regularization at n=256. CASAL
      (.222 exp2245) provides primal-dual hard-constraint sampling. Integrating them: when a
      constraint equality is violated in the energy landscape, CASAL enforces hard satisfaction
      while KAN-CL importance weights determine which spline knots are updated to remember
      this constraint pattern.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/models/substrate_kan.py
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/scripts/experiment_template.py
      TASK: Evaluate KAN-CL importance weighting + CASAL hard-constraint sampling jointly.
      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. python/carnot/samplers/casal.py imports without error — else blocked_casal_missing.
           b. python/carnot/models/substrate_kan.py imports without error — else blocked_kan_missing.
        1. Define 2D continuous EBM with n=256 binary variables and 3 hard equality constraints.
        2. Run joint training loop (10 iterations):
           - CASAL sampler generates constraint-satisfying samples
           - KAN-CL importance weights updated based on which knots activated on violations
        3. Measure:
           - joint_constraint_satisfaction_rate: fraction of samples satisfying all 3 constraints
           - importance_weight_coverage: fraction of violated-constraint knots with high importance
        4. Set kancl_casal_joint_validated: true if joint_constraint_satisfaction_rate >= 0.90.
        5. Write deliverable to results/experiment_2285_kancl_casal_joint.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if joint_constraint_satisfaction_rate >= 0.90."
        - kancl_casal_joint_validated:
            principle: "Boolean gate. True when >= 90% of samples satisfy all hard constraints."
        - joint_constraint_satisfaction_rate:
            principle: "Primary integration gate; CASAL must enforce hard constraints even as KAN-CL updates importance weights."
        - importance_weight_coverage:
            principle: "Validates importance weighting targets the right knots (those activated by violations)."
        - preconditions_checked:
            principle: "Lists CASAL and KAN module availability checks."
        - random_seed:
            principle: "Reproducibility for the joint training loop."

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

