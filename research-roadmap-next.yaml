  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 50
  per_unit_rows: true
  milestone: 2026.10.725
  deliverable: results/experiment_8416_v725_contract_methods.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  model: opus
  prior_failures:
  - experiment_id: exp8402-historical-consumer-roots
    verdict: complete_blocked_historical_consumer_roots
    addressed_by: V724 now has a complete preserved design and qualified family receipts. Bind V725 directly; missing
      V722 authority remains a historical branch, not a fabricated universal prerequisite.
    retire_if_same_verdict: true
  - experiment_id: exp8410-cuda-reader-qualification
    verdict: complete_blocked_cuda_reader_qualification
    addressed_by: Eliminate repeated runtime inventory. Read only a newly supplied causal repair receipt; absence
      zeros the optional canary gate without device commands.
    retire_if_same_verdict: true
  operator_override: '2026-05-29 operator directive (standing): routine milestone transition versus exp7992/exp8318;
    complete V725 authority and a new frozen human-label/admission protocol, without repeating missing-history reconstruction.'
  prompt: |
    CONTEXT:
    Work in {project_root} on {date}. V724 executed twelve producers and wrote two pre-gate receipts. Direct durable state, real coefficient updates and complete Python costs qualified. Native parity was disqualified by an unresolved informational perfect-error finding. The board reader missed five coverage statements and one historical consumer assertion. Released labels cover 900 answers in 300 question clusters; all labels are exposed and older overlap remains unknown. The retrospective criterion contrast was 0.46793587174348694. Frozen V717 H1=-0.00390625 and H2=0 stay closed. CUDA has no causal repair receipt. Preserve all old artifacts and protocols. V725 tests a new, explicitly retrospective human-label calibration target and a bounded feedback-admission mechanism. It cannot establish independent current-Qwen factuality or hidden-game generalization.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; ops/exclusion_manifest.yaml; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; openspec/change-proposals/research-roadmap-vNEXT.md; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/historical_consumer_roots_8402.py; results/experiment_8402_v724_historical_consumer_roots.json; results/experiment_8410_v724_cuda_reader_qualification.json; results/experiment_8415_v724_capstone.json; research-references.md; ops/known-issues.md
    TASK:
    Bind thirteen tasks and seal retrospective criteria and feedback admission. Deliver results/experiment_8416_v725_contract_methods.json. Create thin runner scripts/experiments/experiment_8416_v725_contract_methods.py. Store primitive evidence in results/raw/experiment_8416_v725_contract_methods/. Paths from earlier V725 tasks are future dependencies, not existing files.
    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Authenticate the task and complete V725 design against activated authority. Check actual inputs, their hashes, disk-backed private scratch, tools, memory and deadlines. Keep absent external inputs distinct from zero. Record the failed check in gate_check_summary. Never invent observations.
    2. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess. Print completed/pending counts inside long loops. Poll owned children every 60 seconds or less. Keep every output gap below 600 seconds, including synthesis. Use unbuffered output. Bound each child and reserve validation time within the 4800-second cap. Write any file over about 200 lines in several tool calls of at most about 150 lines. Send a progress message between calls. Do not use one huge write or pad duration.
    3. Spec first: add relevant REQ-* and SCENARIO-* before changing implementation. Write focused failing tests first. Preserve original assertions, thresholds and historical bytes. Reuse shipped modules through small explicit adapters. Put runners in scripts/experiments/, tests in tests/python/, and scratch in /tmp or private disk-backed cache. Accept {date} in the new runner. Do not modify research-roadmap.yaml. No generator weight updates or external publication.
    4. Declare inference_substrate_class=no_model_load and MODEL_SPECS=[]. Record zero current LLM loads and generations. Use aggregation_from_upstream_artifacts for readers, verifier_ensemble_against_cached_candidates for numeric heads, or the named no-LLM live ARC substrate. Imported judge/model names belong in historical_model_provenance. Cached outputs are not new Qwen results.
    5. Bind exactly thirteen complete task objects, Exp8416 through Exp8428, to the visible table and canonical digest. Preserve the V724 design at its immutable archive path. Use authenticated historical roots only when a specific consumer needs them. Do not reconstruct absent V722 authority or make it a gate on unrelated V725 science.
    6. Publish openspec/change-proposals/v725-methods-protocol.json and docs/research-notes/v725-methods.md before analysis. Ingest the Labeling Problem, Detectability Gap, Online KAN and delayed-capacity papers from the dated reference scan. Freeze their method-to-task mapping and limits. Keep V717/V721/V724 protocols unchanged. Record scope_reduction_compliance: the old .111 directive was completed; its retired GRPO, puzzle and generator tracks remain closed.
    7. Freeze the exact V725 partition, features, arms, loss, support floors, bootstrap units and stop rules stated in the design. The whole question is the unit. The released-label study is retrospective even after fitting excludes test questions. Reserve a separate unchanged independent-evaluation gate requiring 80 unexposed clusters and eight per class; V725 cannot satisfy it by relabeling public rows.
    8. Freeze five 20-question delayed-feedback blocks from the 100-question test partition. Freeze capacities8/16, seeds17/29/43/71/101, uniform without replacement and FIFO admission, three sibling predictions before release, equal update budgets, later-block evaluation and retention probes. Freeze a seven-cell subset of the existing V724 cost protocol, keeping every per-cell operation and durability rule unchanged. The subset is defined in Exp8423.
    9. Inspect only an explicitly supplied ops/cuda-runtime-repair-receipt.json for at most30 seconds. Do not scan devices or repeat the unchanged CUDA inventory. Authenticate causal driver/library/namespace change, same execution context and a successful bounded context/copy/free transcript using the shipped reader. Emit runtime_repair_ready_score=1 only for that evidence; absent receipt gives0 with exact gate diagnostics. Contract readiness is independent of that external absence.
    10. Run private E2E-018 and full-object mutations for dropped/reordered tasks, prompt, model, gate, prior retirement flag and routing. Treat the staged YAML as private activation bytes during planning. Never modify the actual active roadmap to pass a test.
    11. Run scoped unit tests and real private CLI/consumer checks. Run Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Require 100 percent newly owned statements, including real child and failure paths. Use pytest -n 0 -o addopts= --no-cov with genuine Coverage.py child shards and private disk-backed scratch. Run the named applicable E2E checks. Record commands, exits, duration and log hashes. Keep global health separate; do not launch the full repository suite.
    12. Cold-replay primitive rows in a fresh bounded process. Test missing input, changed operands, deliberate errors and self-consistently rehashed tampering. Use unchanged primary_publication, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Retain every finding. Resolve informational findings only through an existing typed consumer with independently recomputed operands and a negative control. Unknown, warning or critical findings block readiness. Do not alter validators or exemptions. Publish checked terminal bytes atomically. Owned validation failure is disqualified. Unchanged external absence is blocked. Reserve partial for retryable unfinished owned work; do not publish it through the terminal-only publisher. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md.
    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Bind evidence to this invocation and its authority.
    honest_verdict, verdict_class: principle: Use a complete_ terminal verdict and one closed class: positive | circular_positive | null | blocked | disqualified | partial. External absence is blocked, not partial.
    gate_check_summary: principle: For blocked_* or complete_blocked_* name check, upstream, path/hash, field, operator, expected and observed values. Missing is not zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, historical_model_provenance: principle: Distinguish current inference, imported scores and small numeric training.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count, sample_size_budget: principle: Emit every intended unit/arm with its metric or missing reason. Seeds, three answers per question and timing repeats do not increase independent questions.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle checks use circular_positive. All V725 exposed-development and feasibility results keep both generalization scores zero.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path, adversarial_findings: principle: Qualification is separate from scientific benefit. No failed required check permits a positive class.
    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes: principle: Bind claims to replayable operands and measured work.
    cited_upstream_artifacts, field_principles: principle: Name imported fields with producer hashes. Explain every additional field.
    current_contract_ready_score, methods_ready_score, canonical_tasks_sha256, methods_protocol_path, methods_protocol_sha256: principle: Full current authority and frozen methods gate numerical work.
    runtime_repair_ready_score, runtime_repair_receipt, current_device_probe_count: principle: Only supplied causal runtime evidence can admit the canary; no unchanged hardware scan.
    independent_eval_ready_score, exposure_obligations, scope_reduction_compliance, literature_mapping: principle: Preserve unclosed independence and retired research boundaries.
    Run command: cd {project_root} && PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8416_v725_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
