  - id: exp1822-carnot-odar-routing-prototype
    title: "Exp 1822: Carnot ODAR-style routing prototype (arXiv:2602.23681, Score 400 surfaced 21:30Z)"
    deliverable: results/experiment_1822_carnot_odar_routing.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1811-fast-slow-variant-prototype
        verdict: complete_3.1x_sample_eff_0.25x_kl_drift_no_forgetting
        addressed_by: "exp1811 (.189) shipped Fast-Slow Variant. This task layers ODAR's free-energy-principled risk-sensitive fusion on top of the working FS pipeline — measures whether the routing mechanism stacks with FS's 3.1x lift or saturates."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: arXiv:2602.23681 ODAR (Ma et al., Feb 2026, Score 400
      surfaced 2026-05-15T21:30Z via sweep_semscholar). Uses a
      free-energy-principled, risk-sensitive fusion mechanism to route
      LLM reasoning between fast and deliberative agents across 23
      benchmarks with reduced computational overhead vs uniform
      sampling.

      Carnot's Fast-Slow Variant (exp1811) is FAST-WEIGHT-CONTEXT-DRIVEN
      iteration; ODAR is FREE-ENERGY-PRINCIPLED ROUTING between agents.
      These are complementary mechanisms — ODAR can sit on top of FS to
      decide WHEN to issue another verify-repair iteration vs accept the
      current answer (replacing the current uniform-iteration argmax).

      FALSIFIABLE HYPOTHESIS: Adding ODAR-style risk-sensitive fusion to
      the exp1811 Fast-Slow Variant pipeline yields AT LEAST a
      further 1.3x reduction in compute-overhead (iters-per-task) on the
      same 90-example 3-task corpus AND maintains exp1811's pass-rate
      (GSM8K 0.95 / BBH 0.90 / MATH 0.85) within +/-3pp. If overhead
      reduction <= 1.1x OR pass-rate drops > 3pp, ODAR doesn't compose
      with Fast-Slow on Carnot's substrate — disclose honestly.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1811_fast_slow_variant.json (the FS baseline)
        - python/carnot/pipeline/verify_repair.py (the verify-repair loop
          to add ODAR routing into)
        - Memory entry: feedback_nla_class_16th_verifier_committed (the
          k=16 ensemble that produces the verifier-output signal ODAR
          uses for free-energy estimation)
        - arXiv:2602.23681 abstract (cite in artifact methodology_note)

      TASK: Implement ODAR-style routing on top of Fast-Slow Variant.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "from carnot.pipeline.verify_repair import
              VerifyRepairPipeline"` succeeds — else
              `blocked_verify_repair_pipeline_missing`.
           b. `test -f results/experiment_1811_fast_slow_variant.json` —
              else `blocked_fast_slow_baseline_missing`.
           c. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              non-empty — else `blocked_model_not_cached`.
           Record preconditions_checked.
        1. Implement odar_route(pipeline_state, free_energy_estimate)
           that decides: continue iterating (deliberative path) OR
           accept current answer (fast path). The decision uses ODAR's
           risk-sensitive fusion: select_action = argmax over
           p(answer | state) - lambda * H[answer | state] where
           free_energy estimate H comes from the k=16 ensemble's
           verifier-disagreement signal.
        2. Wire odar_route into the exp1811 Fast-Slow Variant pipeline
           (replace the uniform max_iters=10 with the ODAR-routed early-
           exit).
        3. Run on the same 90-example corpus (GSM8K + BBH + MATH).
        4. Record per-task: passrate, mean iters-to-accept, mean
           iters-to-pass for cases that DID continue iterating.
        5. Acceptance: (a) overall_iters_reduction >= 1.3x relative to
           exp1811's iter count; (b) per-task passrate drift within
           +/-3pp of exp1811. Both required.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.odar_routing.v1"
        - experiment: 1822
        - run_date: ISO-8601 UTC
        - duration_s: > 300s (90 examples × ODAR-routed FS iterations)
        - random_seed: 173022 (NOT 1822 or 90)
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          baseline: "fast_slow_variant_v1 (exp1811)",
          routing_method: "odar_risk_sensitive_fusion_v1",
          tasks: ["gsm8k_30", "bbh_30", "math_30"]}
        - n_samples: 90
        - n_samples_justification: "30 per task × 3 tasks (matches
          exp1811 corpus exactly for apples-to-apples comparison)."
        - odar_passrate_per_task: dict
        - odar_iters_per_task_mean: dict
        - fast_slow_baseline_passrate_per_task: dict (from exp1811)
        - fast_slow_baseline_iters_per_task_mean: dict (from exp1811;
          or recompute)
        - overall_iters_reduction: float (FS_total_iters / ODAR_total_iters)
        - passrate_drift_per_task: dict
        - max_passrate_drift_pp: float (absolute max across 3 tasks)
        - acceptance_gate_passed: bool (overall_iters_reduction >= 1.3
          AND max_passrate_drift_pp <= 0.03)
        - acceptance_gate_criteria: "1.3x iter reduction AND <=3pp
          passrate drift per task."
        - methodology_note: "ODAR-routed Fast-Slow paper-comparison: if
          overall_iters_reduction > 3x without methodology note, treat as
          IMPLAUSIBLE_PERFECT (ODAR's paper claim is 'reduced overhead vs
          uniform sampling' — Carnot's baseline is already Fast-Slow,
          not uniform, so >3x stacking is a fabrication signal). Cite
          arXiv:2602.23681 as methodology origin."
        - optimization_direction: "maximize_iters_reduction_minimize_passrate_drift"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

