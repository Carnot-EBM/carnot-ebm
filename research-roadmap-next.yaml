- id: exp706-gemma4-vr-diagnostic
  milestone: 2026.04.54
  deliverable: results/experiment_706_gemma4_vr_diagnostic.json
  title: 'Exp 706: Gemma4-E4B-it VR Diagnostic — Trace Pipeline Failure to Exact Step (GPU REQUIRED)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 694 revealed that VR helps Qwen3.5-0.8B (signed_improvement=1.0) but HURTS
    Gemma4-E4B-it (signed_improvement=-0.8, cross_model_delta=-1.8). The root cause is unknown.
    Three hypotheses:
    1. Extraction FP: SymCodeVerifier fires on Gemma's correct outputs (FP rate too high).
       Gemma writes arithmetic in a different format than Qwen, and SymCodeVerifier was
       calibrated on Qwen. Gemma's "natural language arithmetic" triggers false violations.
    2. Repair regression: The repair step (replace violated segment) degrades Gemma's
       otherwise-correct response by overwriting valid reasoning.
    3. Threshold miscalibration: The violation threshold (minimum energy for triggering repair)
       is too low for Gemma's more accurate outputs, causing over-repair.

    This experiment runs VR in instrument mode on 25 known-correct and 25 known-incorrect
    Gemma4-E4B-it responses, logging per-step decisions for each case.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.
    - python/carnot/pipeline/extract.py — ConstraintExtractor (ArithmeticExtractor, SymCodeVerifier).
    - results/experiment_694_vr_cross_model.json — cross-model diagnostic hints.
    - python/carnot/inference/sota_models.py — resolve_cached_gguf for Gemma4-E4B-it.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Run VR in instrument mode on 50 Gemma4-E4B-it responses (25 correct, 25 incorrect).
    Log per-step: extractor_fired, constraint_violated, repair_applied, answer_changed,
    final_correct. Identify failure_mode.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-144 (VR pipeline instrument mode: log per-step decisions per response),
       REQ-VERIFY-145 (model-specific failure mode identification from instrument logs),
       SCENARIO-VERIFY-144/145 to spec.md.
    3. Create scripts/experiment_706_gemma4_diagnostic.py:
       a. ExperimentTemplate(706) + ExperimentTimeoutWatchdog(706, timeout_minutes=90).
       b. Load Gemma4-E4B-it via llama.cpp or transformers (CARNOT_FORCE_LIVE=1).
          Model: google/gemma-4-E4B-it or cached GGUF equivalent.
       c. Run 25 GSM8K questions from known-correct set (questions where Gemma4 baseline
          produces correct answer, from Exp 694 data or fresh 25-question sample indices 0-24).
       d. Run 25 GSM8K questions from known-incorrect set (indices 25-49 or similar).
       e. For each response: call VerifyRepairPipeline in instrument mode.
          Log per response:
            - extractor_fired: bool (did any extractor flag a violation?)
            - constraint_type: str (which extractor type fired)
            - is_violation_real: bool (manual check: was the flagged violation actually wrong?)
            - repair_applied: bool (was repair triggered?)
            - answer_changed: bool (did repair change the final answer?)
            - final_correct: bool (is the final post-repair answer correct?)
       f. Compute aggregate metrics:
            - fp_rate_on_correct: (extractor_fired AND original_correct) / n_correct
            - repair_regression_rate: (repair_applied AND was_correct AND final_wrong) / n_repaired
            - threshold_miss_rate: (not extractor_fired AND was_incorrect) / n_incorrect
       g. Identify failure_mode (primary):
            - "extraction_fp" if fp_rate_on_correct > 0.20
            - "repair_regression" if repair_regression_rate > 0.20
            - "threshold_too_high" if threshold_miss_rate > 0.50
            - "combined" if multiple exceed threshold
            - "no_clear_failure" if none exceed
       h. honest_verdict:
            - "failure_mode_identified" if failure_mode != "no_clear_failure"
            - "failure_mode_ambiguous" otherwise
       i. artifact: fp_rate_on_correct, repair_regression_rate, threshold_miss_rate,
          failure_mode, n_correct_tested, n_incorrect_tested, honest_verdict.
    4. Write tests/python/test_experiment_706_gemma4_diagnostic.py with 100% coverage:
       - test instrument mode logging captures all required fields.
       - test failure_mode classification logic for each case.
       Each test traces to REQ-VERIFY-144/145.
    5. Reconcile:
       - ops/status.md: add Gemma4 VR failure_mode finding.
       - ops/changelog.md: one-line with failure_mode and honest_verdict.
    6. tmpl.assert_deliverable_written() as final line.

    Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp707-model-adaptive-thresholds
  milestone: 2026.04.54
  deliverable: results/experiment_707_adaptive_thresholds.json
  title: 'Exp 707: Model-Adaptive Constraint Thresholds — Per-Model FP Gating via Tier 1 Self-Learning'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 706 identified the failure_mode causing VR to hurt Gemma4-E4B-it.
    This experiment implements the fix: ModelAdaptiveThresholdGate, a Tier 1 self-learning
    component that suppresses constraint types with FP rate > TP rate per model.

    Per research-program.md Tier 1 self-learning: "Upweight constraints that catch real errors,
    downweight noisy ones. Running average of per-constraint precision, updated after each cycle."
    The extension here is per-MODEL tracking, not just per-constraint-type globally.

    Architecture: For each (model_id, constraint_type) pair, maintain:
      - tp_count: true positives (extractor fired AND violation was real)
      - fp_count: false positives (extractor fired AND original response was correct)
      - precision: tp_count / (tp_count + fp_count)
    Gate: if precision < 0.5 for (model_id, constraint_type), suppress that constraint
    type for that model. This is the per-model extension of the existing precision tracker.

    EXISTING CODE TO READ FIRST:
    - results/experiment_706_gemma4_vr_diagnostic.json — failure_mode and FP rates.
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.
    - python/carnot/pipeline/extract.py — ConstraintExtractor hierarchy.
    - python/carnot/verify/self_learning.py (or similar) — existing Tier 1 tracker.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement ModelAdaptiveThresholdGate. Initialize with Exp 706 FP rate data for Gemma4.
    Verify it gates the constraint types that caused FP harm.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-146 (ModelAdaptiveThresholdGate: suppress constraint types with
       precision < 0.5 per model_id), REQ-VERIFY-147 (gate persists across sessions via
       JSON state file), SCENARIO-VERIFY-146/147 to spec.md.
    3. Create python/carnot/pipeline/adaptive_gate.py:
       a. class ModelAdaptiveThresholdGate:
            state_file: Path = Path("results/adaptive_gate_state.json")
            state: dict[str, dict[str, dict]] = {} # {model_id: {constraint_type: {tp, fp}}}
            def update(self, model_id: str, constraint_type: str,
                       was_tp: bool) -> None:
              # Increment tp_count or fp_count; save state.
            def is_suppressed(self, model_id: str, constraint_type: str) -> bool:
              # Return True if precision < 0.5 for this (model_id, constraint_type).
              # Return False if no data yet (default: allow).
            def precision(self, model_id: str, constraint_type: str) -> float:
              # Compute tp / (tp + fp); return 0.5 if no data.
            def save(self) -> None:
              # Atomically write state to state_file.
            def load(self) -> None:
              # Load state from state_file if exists.
       b. Integrate into VerifyRepairPipeline:
            Add optional adaptive_gate: ModelAdaptiveThresholdGate = None parameter.
            If gate is not None and gate.is_suppressed(model_id, constraint_type):
              skip that constraint type for this request.
    4. Create scripts/experiment_707_adaptive_thresholds.py:
       a. ExperimentTemplate(707) + ExperimentTimeoutWatchdog(707, timeout_minutes=30).
       b. Load Exp 706 diagnostic data (fp_rate_on_correct, failure_mode).
       c. Initialize ModelAdaptiveThresholdGate.
       d. Seed gate with Exp 706 data:
            If failure_mode involves "extraction_fp":
              For SymCodeVerifier on Gemma4: add 10 synthetic FP events (fp_count += 10).
              This simulates 10 FP observations, bringing precision below 0.5.
       e. Verify: gate.is_suppressed("google/gemma-4-E4B-it", "SymCodeVerifier") == True.
       f. Verify: gate.is_suppressed("Qwen/Qwen3.5-0.8B", "SymCodeVerifier") == False (default).
       g. Test save/load cycle: save state, reload, verify suppression preserved.
       h. honest_verdict:
            - "adaptive_thresholds_implemented" if suppression verified for Gemma4
            - "adaptive_thresholds_partial" if only some constraints suppressed
       i. artifact: failure_mode_from_706, constraints_suppressed_gemma4 (list),
          gate_state_file, honest_verdict.
    5. Write tests/python/test_experiment_707_adaptive_thresholds.py with 100% coverage:
       - test update increments correct counter.
       - test is_suppressed returns True when precision < 0.5.
       - test is_suppressed returns False when no data (default allow).
       - test save/load round-trip.
       Each test traces to REQ-VERIFY-146/147.
    6. Reconcile:
       - ops/status.md: add "ModelAdaptiveThresholdGate implemented (Exp 707)".
       - ops/changelog.md: one-line with honest_verdict.
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
