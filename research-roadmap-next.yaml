- id: exp980-kan-milp-violation-fix
  milestone: 2026.04.76
  deliverable: results/experiment_980_kan_milp_violation_fix.json
  title: "KAN MILP Violation Fix — Repair 11 Monotonicity and Boundary Violations in KAEMEnergy"
  prompt: |
    CONTEXT:
    Exp 972 (KAN MILP Formal Verification, .75) found 11 violations in KAEMEnergy:
    n_violations_found=11, n_properties_verified=3 (some properties violated).
    The violations are in monotonicity and boundary conditions of the KAN splines.
    Until these are fixed, the energy scores from KAEMEnergy cannot be trusted for
    production verification — a subtle spline could assign low energy to a violating response.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/kaem_energy.py (KAEMEnergy, UnivariateKAEMLayer — fix target)
    - results/experiment_972_kan_milp_formal_verification.json (violations_detail list)
    - scripts/experiment_972_kan_milp_formal_verification.py (MILP verification code)

    TASK:
    1. Read results/experiment_972_kan_milp_formal_verification.json carefully.
       Extract violations_detail: each violation identifies WHICH spline and WHAT property fails.
    2. For monotonicity violations: add a monotone spline constraint to the affected
       UnivariateKAEMLayer. Technique: re-order the B-spline control points to be non-decreasing
       (isotonic regression on the knot values). This preserves learned information while
       enforcing the monotone property.
    3. For boundary condition violations: clamp the output range of the spline to [-N_spins, N_spins]
       using a final linear projection. This prevents energy runaway on extreme inputs.
    4. After fixing: re-run the MILP verification from Exp 972. Target: n_violations_found == 0.
    5. Run the existing KAEMEnergy unit tests to confirm no regression.
    6. Run cargo test --workspace --exclude carnot-python to confirm no Rust regression.

    JAX_PLATFORMS=cpu for reproducibility.

    Write results/experiment_980_kan_milp_violation_fix.json with fields:
      violations_before: int
      violations_after: int
      properties_violated_before: list[str]
      properties_violated_after: list[str]
      fix_applied_monotonicity: bool
      fix_applied_boundary: bool
      unit_tests_pass: bool
      honest_verdict: str

    honest_verdict = "kan_violations_fixed" if violations_after == 0.
    honest_verdict = "kan_violations_reduced" if violations_after < violations_before.
    honest_verdict = "kan_violations_unfixable" if violations_after == violations_before.

    Run: python scripts/experiment_980_kan_milp_violation_fix.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: high
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 60
  prior_failures:
  - experiment_id: exp972-kan-milp-formal-verification
    verdict: kan_violations_found
    addressed_by: "Exp 972 identified 11 violations. Exp 980 is the repair step: apply isotonic regression for monotonicity violations and output clamping for boundary violations."
    retire_if_same_verdict: false
