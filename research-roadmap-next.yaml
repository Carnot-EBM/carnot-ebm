      and failed execution remain unchanged.
    retire_if_same_verdict: true
  agent_type: claude
  model: opus
  prompt: |
    CONTEXT:
    Work in {project_root} on {date}. V741 completed thirteen scheduling slots; seven producers ran. Learning never ran because input readiness required the failed Exp8616 qualification that its successor was meant to repair. Streaming fixtures passed numerical parity but lost original coverage custody. The installed prototype qualified; compatibility failed the original node union after resident_protocol.py changed. Exp8637 recorded sixteen censored redirects and exact observer action parity, with no complete horizon or promotion. Preserve all historical nulls and quarantines. V742 contains exactly thirteen tasks, Exp8640 through Exp8652.

