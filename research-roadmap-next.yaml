milestone: 2026.06.415
milestone_title: 'TURN THE 2026-06-20 STRATEGY INTO EXECUTION: lead with the HUMAN-REPLAY frame-change
  predictor + action prior (A1 -- the #1 score lever; the 14,672-example action-effect corpus is CONFIRMED
  ready; the leaderboard leader''s core technique; attacks action efficiency, the scoring metric we have
  NONE of at 0.08), the world-model TRUST ENERGY for hidden-state games (A2 -- the oracle-distinct moat),
  the ENERGY-AUGMENTATION GATE (A3 -- does energy over the v3 structural features now transfer cross-game,
  LOO>0.6? the load-bearing test of the whole differentiator), and re-scoped goal/HUD deepen + an adapter
  deepen (A4/A5 -- the level-up guarantee). Reserved: human-replay corpus staging + submitted-agent scoreboard
  (infra), hardware continuity, SOTA imitation-learning ingestion, capstone. ALL experiments codex/gpt-5.5;
  planner/retro stay Claude Opus 4.8. reproducible_total_levels is NOT the headline -- generic held-out
  solve-rate + action efficiency are. Live generator Qwen3.5-9B-MTP, never the 3090s. NO leaderboard submission
  in-loop (operator-only).'
milestone_doc: openspec/change-proposals/research-roadmap-v415.md
milestone_overview: '.414 closed the public-25 (re86+bp35+lf52 first-contacted -> 25/25) + wired the stronger
  generic stack into the submitted agent (A1 integration, parity-gated) + built features v3 + the discriminative
  head. .415 executes the score-drivers the session validated: the human replays are a CONFIRMED ready
  supervised corpus (14,672 examples; humans change the frame 97% of actions) -> bootstrap the frame-change
  predictor (A1, the leaderboard''s proven action-efficiency technique); the trust energy is the oracle-distinct
  moat (A2); the energy-augmentation thesis lives or dies on whether energy over structural features transfers
  (A3 LOO gate). The wall is GENERALIZATION (human 100% is first-contact; ours is not) -- every task is
  measured by held-out solve-rate + variant transfer, not banked levels.'
