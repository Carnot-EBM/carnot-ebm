  - id: exp341-live-humaneval-code-verification
    milestone: "2026.05.13"
    deliverable: results/experiment_341_live_humaneval.json
    title: "Exp 341: Live HumanEval code verification — CodeExtractor + execution on RTX 3090"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
