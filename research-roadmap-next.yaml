- id: exp1480-live-sota-balanced-telemetry-v2
  milestone: 2026.04.114
  deliverable: results/experiment_1480_live_sota_balanced_telemetry_v2.json
  title: "Live SOTA Telemetry v2 - Balanced Labels + Superficial Baselines"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 100
  priority: critical
  requires_gpu: true
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1473-live-telemetry-adversarial-validity-audit
      verdict: telemetry_claim_blocked_adversarial_audit
      addressed_by: "This task changes the setup by building balanced correct/incorrect labels up front and recording superficial baselines before any telemetry claim is evaluated."
      retire_if_same_verdict: true
    - experiment_id: exp1468-live-sota-logprob-telemetry-preflight
      verdict: live_sota_topk_telemetry_ready
      addressed_by: "Exp1468 proved raw telemetry availability; this task is the v2 validity/calibration dataset, not another runtime preflight."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Exp1468 proved live local SOTA telemetry with top-k logprobs and logits,
    but exp1473 blocked the headline claim because the signal could be
    superficial or mechanically gated. The next step is an adversarially
    balanced telemetry manifest with explicit confound baselines. Use
    {project_root} as the project root and {date} as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE; primary telemetry model)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense; secondary telemetry model)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE; secondary telemetry model)
    Legacy small models are allowed only as CPU smoke-tests and must not be
    used for headline telemetry.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - research-references.md
    - results/experiment_1468_live_sota_logprob_telemetry_preflight.json
    - results/live_sota_telemetry_manifest_1468.jsonl
    - results/experiment_1473_live_telemetry_adversarial_validity_audit.json
    - python/carnot/reporting/live_sota_repair_runtime_preflight.py
    - python/carnot/verify/
    - tests/python/

    TASK:
    Build a balanced live local SOTA telemetry v2 manifest with correct and
    incorrect examples, top-k/logit capture where available, and superficial
    baselines recorded before any diagnostic is scored.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - live_sota_model_inference_used
    - telemetry_cases_requested
    - telemetry_cases_completed
    - balanced_label_counts
    - topk_logprobs_available
    - logits_available
    - superficial_baselines_recorded
    - telemetry_manifest_path
    - models_used
    - gpu_probe
    - blockers
    - claim_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1480_live_sota_balanced_telemetry_v2.json immediately with status="in_progress".
    2. Use cached_sota_pair() or the exp1468/exp1463 model path pattern; do not hardcode legacy small models for headline rows.
    3. Build a 30-40 case bounded prompt set with known verifier/correctness labels and a deliberate mix of correct, incorrect, format-valid, and format-invalid outcomes.
    4. Generate or reuse live local SOTA rows from at least one mandated GGUF model and attempt to capture token text, token logprob, top-k alternatives, final logits, and response text.
    5. Record superficial baselines for every row: response length, token count, JSON/schema validity, prompt family, answer lexical overlap, and model family.
    6. Write results/live_sota_balanced_telemetry_manifest_1480.jsonl with one row per case.
    7. Set claim_allowed=false by default unless the manifest contains balanced labels, real local SOTA rows, and enough telemetry for downstream adversarial audits.
    8. Run focused tests for any added telemetry helpers.
    9. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1480_live_sota_balanced_telemetry_v2.json')); print(d.get('live_sota_model_inference_used'), d.get('logits_available'), d.get('superficial_baselines_recorded'), d.get('telemetry_cases_completed'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1481-semantic-energy-feasibility-audit
  milestone: 2026.04.114
  deliverable: results/experiment_1481_semantic_energy_feasibility_audit.json
  title: "Semantic Energy Feasibility Audit - Gated on Exp1480 Logits"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 55
  priority: high
  requires_gpu: false
  skip_pre_test: true
  gated_on:
    - upstream: exp1480-live-sota-balanced-telemetry-v2
      artifact_field: logits_available
      op: "=="
      value: true
  prior_failures:
    - experiment_id: exp1469-halt-spilled-energy-telemetry-diagnostic
      verdict: retired_non_headline_telemetry_flat_or_confounded
      addressed_by: "This audit uses Semantic Energy-style semantic/logit structure on a balanced v2 manifest and must retire the line if it is again explained by superficial baselines."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The post-.113 research sweep added Semantic Energy as the most relevant
    follow-up to the retired HALT/spilled telemetry path. This task runs only
    if exp1480 captured logits, and it must compare against superficial
    baselines before allowing any telemetry claim. Use {project_root} as the
    project root and {date} as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (source telemetry model)
    - unsloth/gemma-4-31B-it-GGUF (source telemetry model if present)
    - unsloth/gemma-4-26B-A4B-it-GGUF (source telemetry model if present)
    Prefer reusing exp1480 telemetry rows. If new samples are unavoidable, use
    at least one mandated local SOTA GGUF.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - results/experiment_1480_live_sota_balanced_telemetry_v2.json
    - results/live_sota_balanced_telemetry_manifest_1480.jsonl
    - results/experiment_1469_halt_spilled_energy_telemetry_diagnostic.json
    - results/experiment_1473_live_telemetry_adversarial_validity_audit.json
    - python/carnot/verify/
    - tests/python/

    TASK:
    Compute a bounded Semantic Energy-style feasibility diagnostic from the
    exp1480 manifest and decide whether it survives adversarial superficial
    baselines.

    REQUIRED ARTIFACT FIELDS:
    - status
    - model_specs
    - telemetry_rows_loaded
    - semantic_energy_features_computed
    - baseline_features_computed
    - semantic_energy_audit_complete
    - best_semantic_signal
    - best_superficial_baseline
    - signal_beats_superficial_baselines
    - diagnostic_path
    - claim_allowed
    - diagnostic_lineage_retired
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1481_semantic_energy_feasibility_audit.json immediately with status="in_progress".
    2. Read the Semantic Energy entry in research-references.md and the exp1480 manifest.
    3. Implement a small deterministic feature extractor if needed: final-logit entropy, top-k semantic-cluster proxy, answer-choice energy gap, and per-case uncertainty spread.
    4. Compute the same rank/accuracy metrics for superficial baselines recorded by exp1480.
    5. Set signal_beats_superficial_baselines=true only if the semantic-energy proxy beats all superficial baselines on the same labels.
    6. Write results/semantic_energy_features_1481.json with per-case features and baseline scores.
    7. If the signal is flat or confounded, set diagnostic_lineage_retired=true for headline telemetry claims.
    8. Run focused tests for any added helper code.
    9. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1481_semantic_energy_feasibility_audit.json')); print(d.get('semantic_energy_audit_complete'), d.get('signal_beats_superficial_baselines'), d.get('claim_allowed'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1482-beaver-lite-live-prefix-bound-calibration
  milestone: 2026.04.114
  deliverable: results/experiment_1482_beaver_lite_live_prefix_bound_calibration.json
  title: "BEAVER-Lite Live Prefix Bound Calibration v2"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 50
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1470-beaver-lite-deterministic-bound-smoke
      verdict: sound_bound_live_exp1468
      addressed_by: "Exp1470 proved soundness on a tiny live-logprob smoke; this task expands only calibration/tightness over bounded prefix constraints and must block claims on any bound violation."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Exp1470 produced a sound BEAVER-lite deterministic-bound smoke using live
    exp1468 logprobs. The next step is a bounded calibration run that measures
    tightness and violations across more prefix-closed constraints without
    implementing a broad external benchmark runner. Use {project_root} as the
    project root and {date} as the run date.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF (preferred live logprob source from exp1480 or exp1468)
    - unsloth/gemma-4-31B-it-GGUF (optional live logprob source)
    - unsloth/gemma-4-26B-A4B-it-GGUF (optional live logprob source)
    No new LLM generation is required. If live logprobs are used, they must
    come from mandated SOTA GGUF telemetry rows; otherwise label the run
    mock_logprobs.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - results/experiment_1470_beaver_lite_deterministic_bound_smoke.json
    - results/experiment_1480_live_sota_balanced_telemetry_v2.json
    - python/carnot/verify/beaver_lite.py
    - tests/python/test_beaver_lite.py
    - tests/python/test_beaver_lite_live_logprobs.py

    TASK:
    Run BEAVER-lite over a bounded set of live-prefix constraints and report
    soundness, calibration tightness, and live/mock lineage.

    REQUIRED ARTIFACT FIELDS:
    - status
    - benchmark_family
    - model_specs
    - constraints_evaluated
    - prefix_closed_constraints
    - unsafe_mass_bounds
    - empirical_violation_rates
    - bound_is_sound
    - bound_violations
    - calibration_tightness_summary
    - mock_or_live_logprobs
    - broad_benchmark_deferred
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1482_beaver_lite_live_prefix_bound_calibration.json immediately with status="in_progress".
    2. Read exp1470, the BEAVER-lite implementation, and available live telemetry manifests from exp1468/exp1480.
    3. Select 12-20 deterministic prefix-closed arithmetic, code-token, or certificate constraints.
    4. Use compatible live SOTA logprob rows when available; otherwise use the mock path and label it explicitly.
    5. Assert every unsafe mass bound is in [0, 1] and no empirical violation rate exceeds its bound.
    6. Report tightness as bound minus empirical rate and summarize p50/p90/max slack.
    7. Do not implement VNN-COMP, VNNLIB, or broad external verifier runners.
    8. Run focused BEAVER-lite tests.
    9. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1482_beaver_lite_live_prefix_bound_calibration.json')); print(d.get('bound_is_sound'), d.get('bound_violations'), d.get('mock_or_live_logprobs'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

