          principle: "Verifiers carried primarily by FR-11 state — must be disclosed §5.1."
        - corpus_specific_verifiers: list[str]
          principle: "One-corpus workhorses (e.g. Tier 0s on arithmetic)."
        - low_signal_verifiers: list[str]
          principle: "Retirement candidates — AUROC < 0.60 across all cells."
        - diversity_gap_on_non_fover: bool
          principle: "True if fewer than 3 architecture-transfer verifiers cover each
                       non-FoVer corpus — signals need for new diverse verifiers."
        - corpora_available: list[str]
          principle: "Records which corpora had non-blocked data for the matrix."
        - duration_s: float
