  - id: exp4146-sudoku-accumulate-pass1-epochfix
    milestone: 2026.06.384
    title: "ACCUMULATE pass 1 — DIAGNOSE + FIX the max_epochs cap, then resume-train from the intact 0.278 checkpoint. Raise max_epochs above the checkpoint's current epoch so trainer.fit() continues (instead of the 7s instant-return that no-op'd .383); resume via ckpt_path; bound <=60 min via max_time; ANTI-NO-OP guard (duration>120s AND epoch advanced AND real val read)."
    priority: critical
    track: trm-baseline
    max_turns: 90
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-13 operator directive: fix the max_epochs-cap no-op that stalled .383's accumulation — false-positive scope-match vs exp4127/.383 passes; forward difference = raises the epoch ceiling so resumed training actually CONTINUES (the .383 passes instant-returned at the cap) + anti-no-op guard."
    inference_substrate: gpu_nanotrm_native_training
    deliverable: results/experiment_4146_sudoku_accumulate_pass1_epochfix.json
    prompt: |
      CONTEXT: .383 exp4135 ran 6.99s, return_code 0, stdout stopped at "Creating TRM ...", val=null,
      and the stable checkpoint was never updated. Diagnosis: a 7s CLEAN exit on a resumed checkpoint
      means the checkpoint reached the config's `max_epochs` cap so `trainer.fit()` returned at once.
      The intact checkpoint (results/trm_runs/sudoku_extreme_baseline/last.ckpt, ~0.278 val) is the
      seed. exp4116/exp4127 mechanics WORKED (reached 0.278) — mirror them + add the epoch-ceiling raise.

      CONCRETE STEPS:
        0. PRECONDITIONS: `command -v uv`; `ls nano-trm/src/nn/train.py`; CUDA available; the stable
           checkpoint exists and torch.load()s. Else -> `blocked_<resource>`.
        1. DIAGNOSE the cap: torch.load the stable checkpoint, read its current `epoch` (or
           global_step / trainer state). Read the trm_sudoku_extreme config's `max_epochs`. Confirm
           current_epoch >= (or ~=) max_epochs (the instant-return cause).
        2. TRAIN bounded + UNCAPPED-enough: from the nano-trm dir, run
           `uv run python src/nn/train.py experiment=trm_sudoku_extreme_1k_aug_1k logger=csv
            ckpt_path=<repo>/results/trm_runs/sudoku_extreme_baseline/last.ckpt
            +trainer.max_epochs=<current_epoch + ~3000>
            +trainer.max_time="00:01:00:00"
            <hydra overrides so the ModelCheckpoint writes last.ckpt back into the SAME stable dir>`.
           CHECKPOINT + PRINT-PROGRESS per val interval so codex's 1201s idle-timeout never fires.
        3. ANTI-NO-OP GUARD (the .383 failure mode): assert ALL of — duration_s > 120; the saved
           checkpoint's epoch is GREATER than the seed epoch; a real `val_exact_accuracy` was read
           from the metrics CSV. If any fails -> honest_verdict `blocked_noop_<reason>` (NOT complete)
           with the diagnosed cause; do not claim a pass that did not train.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A `blocked_noop_*` (real training did not happen) is honest; a fake `complete` on a 7s no-op is the .383 anti-pattern."
        max_epochs_cap_confirmed:
          principle: "Bare bool: was the .383 no-op caused by the checkpoint hitting max_epochs? Confirms the root cause + that the ceiling-raise addresses it."
        seed_epoch:
          principle: "The checkpoint's epoch BEFORE this pass; paired with the post-pass epoch it proves training actually advanced (the anti-no-op evidence)."
        post_epoch:
          principle: "The checkpoint's epoch AFTER this pass; must exceed seed_epoch or the pass no-op'd."
        val_exact_accuracy:
          principle: "Real val after the pass (should climb from 0.278); a null val = the pass did not eval = no-op."
        stable_checkpoint_path:
          principle: "The shared path pass 2 resumes from."
        duration_s:
          principle: "A real bounded pass is minutes of GPU; <120s = the no-op signal that stalled .383."
        random_seed:
          principle: "Determinism precondition."
      ACCEPTANCE GATE:
        - condition: "duration_s > 120 AND post_epoch > seed_epoch AND val_exact_accuracy is a real number (the pass ACTUALLY trained), OR an honest blocked_noop_* with the diagnosed cause"
          principle: "Pass 1 succeeds only if it provably trained (epoch advanced, real val) — the anti-no-op guard that the .383 passes lacked. A 7s instant-return is caught and reported, never dressed as progress."

