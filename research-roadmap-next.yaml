    HalluGuard frames hallucination mitigation as formal risk decomposition
    rather than a scalar telemetry score. Carnot has BEAVER-lite bounds, live
    telemetry, FoVer-style labels, and verifier outcomes, but it does not have
    full HalluGuard NTK/certification assumptions. Use {project_root} as the
