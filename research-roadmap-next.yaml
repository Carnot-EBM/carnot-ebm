    deliverable: "results/experiment_3366_gatemate_axi_uio.json"
    prompt: |
      CONTEXT: exp3351 was blocked because GateMate n=16 RTL lacks a host communication interface.
      TASK: Add a basic AXI or UIO compatible interface to the GateMate RTL.
      CONCRETE STEPS:
        1. Modify the RTL to include memory-mapped registers.
        2. Verify synthesis and write a mock driver.
        3. Emit artifact with synthesis status.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3366_gatemate_axi_uio.py.

