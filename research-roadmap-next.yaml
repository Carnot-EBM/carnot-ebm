      CONCRETE STEPS
      0. PRECONDITIONS: freeze prior-artifact hashes, current validator hashes, git status, and protected-file hashes.
      1. Add REQ-INFRA-6298 and scenarios before implementation. Update traceability.
      2. Implement the smallest reusable module under python/carnot/ and a thin CLI outside the conductor.
      3. Encode the current substrate duration table and fail closed on unknown compute-bound substrates, missing methodology, or impossible timing.
