    inference_substrate: synthetic
    requires_gpu: false
    deliverable: "results/experiment_3387_kanele_quantization.json"
    prompt: |
      CONTEXT: KANELÉ (arXiv:2512.12850) shows 2700x speedup by mapping KAN splines to FPGA LUTs via quantization.
      EXISTING CODE TO READ FIRST: scripts/experiment_3374_ebt_kan_integration.py
      TASK: Implement a quantization aware training (QAT) simulation for the KAN energy sidecar built in exp3374.
      CONCRETE STEPS:
        1. Take the KAN sidecar from exp3374.
        2. Apply 8-bit quantization to the spline coefficients and activations.
        3. Evaluate performance degradation vs full precision.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3387_kanele_quantization.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

