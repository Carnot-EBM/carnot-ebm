        delta_trained_vs_untrained_hybrid: principle="trained_hybrid minus untrained_hybrid solve-rate — does a calibrated energy strengthen the Kona hybrid?"
        delta_significance: principle="paired significance of the hybrid solve-rate delta."
        random_seed: principle="determinism."
        reproducibility_checksum: principle="content hash."
        duration_s: principle="cached/CPU global-opt; 1s floor."

      ACCEPTANCE GATES:
        - condition: "trained_hybrid_solve_rate > untrained_hybrid_solve_rate AND delta_significance favors the treatment"
          principle: "G1 TRAINED-ENERGY-STRENGTHENS-HYBRID: a calibrated energy improves the Kona global-opt hybrid — actionable for the Phase-3 endgame."
        - condition: "trained_hybrid_solve_rate <= untrained_hybrid_solve_rate"
          principle: "G1' NO-LIFT: a trained energy does not strengthen the hybrid on this benchmark — an honest negative consistent with exp3461 if the energy AUROC stayed low."

