      CONCRETE STEPS
      1. Add REQ-ARC-WMTE-6215 and scenarios before implementation and trace focused tests.
      2. Hash the registry and freeze level-boundary cells, seeds, minimum transfer opportunities, primary avoided-induction metric, quality guard, and safety gate before running.
      3. Use only the canonical live agent. Capture successful same-game prior-level traces from agent-visible actions/observations in both arms.
