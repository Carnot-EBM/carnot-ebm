    prior_failures:
      - experiment_id: exp5513-sota-hard-soft-structured-panel
        verdict: "blocked: sota_hard_soft_structured_panel_not_ready_exact_validator_mismatch_missing_candidate_rows_parse_failures_preference_suboptimal_or_missing_schema_invalid_or_missing_rows."
        addressed_by: "This task does not rerun the full panel; it isolates the live schema failure cause before any downstream quality claim."
        retire_if_same_verdict: true
      - experiment_id: exp5512-structured-output-positive-control
        verdict: "complete: deterministic fixtures were schema-valid, but the live Qwen3.6 smoke row was schema-invalid."
        addressed_by: "This attempt specifically targets the gap between deterministic fixture validity and live SOTA output validity."
        retire_if_same_verdict: true
      - experiment_id: exp5500-sota-concept-claim-panel-v499
        verdict: "complete: live_sota_claim_panel_measured_accuracy_0.333333 with all candidate rows missing or abstained."
        addressed_by: "This attempt records prompt, grammar, truncation, extraction, and validator mismatch causes instead of treating missing rows as model evidence."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5512 proved deterministic schema validity, but Exp5513 showed the live SOTA GGUF path still produced missing or schema-invalid rows. Diagnose the interface before running another headline SOTA panel.

      MODEL_SPECS for any LLM call in this experiment:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Legacy small GGUFs may be used only as CPU smoke tests. Use cached_sota_pair() or the repository's current local-GGUF helper pattern if available. Never call AutoTokenizer.from_pretrained on a GGUF repository.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/research-references.md
      - {project_root}/results/experiment_5512_structured_output_positive_control.json
      - {project_root}/results/experiment_5513_sota_hard_soft_structured_panel.json
      - {project_root}/python/carnot
      - {project_root}/tests/python

      TASK:
      Emit results/experiment_5525_sota_schema_failure_taxonomy.json with a reproducible taxonomy of why live SOTA structured rows fail.

      CONCRETE STEPS:
      1. Reuse the Exp5512 schema and fixtures; do not invent a new scoring target unless the schema itself is demonstrably wrong.
      2. Run deterministic fixture rows through the same parser/extractor path and verify they still parse.
      3. Run a tiny live sample with at least one mandated local SOTA GGUF model if the model and GPU path are available.
      4. For each row, classify the first failure among: prompt_contract_miss, grammar_runtime_unavailable, grammar_mask_not_applied, max_tokens_truncation, json_extraction_failure, json_schema_invalid, required_field_missing, exact_validator_mismatch, semantic_candidate_absent, or runtime_unavailable.
      5. Record prompt-prefix hash, max_tokens, stop strings, output byte length, truncation marker, grammar backend, parser backend, GPU offload receipt, and exact-validator target.
      6. Add focused tests if you introduce taxonomy or parser code.
      7. Emit the deliverable JSON with REQUIRED ARTIFACT FIELDS:
         - model_specs: list
         - smoke_models_used: list
         - fixture_rows_checked: int
         - live_rows_checked: int
         - failure_taxonomy_counts: mapping
         - prompt_prefix_hashes: list
         - grammar_runtime_available: bool
         - grammar_mask_applied: bool
         - truncation_detected: bool
         - json_extraction_success_rate: float
         - schema_validity_rate: float
         - exact_validator_handoff_ready: bool
         - gpu_offload_evidence: mapping
         - sota_schema_failure_taxonomy_ready: bool
         - tests_added_or_reused: list
         - field_principles: mapping with one-line principle annotations for each headline and gate field
         - inference_substrate: structured_output_fixture_plus_live_llm_smoke
         - honest_verdict: string
