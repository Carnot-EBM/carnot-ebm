milestone: "2026.05.213"
milestone_title: "Process-Reward Energy, Ising Constraints, and Test-Time Compute"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp2143-archive-and-activate
    title: "Phase 0: Archive .212 and activate .213"
    max_turns: 20
    prompt: |
      CONTEXT: Milestone 2026.05.212 has completed. We must prepare for 2026.05.213.
      EXISTING CODE TO READ FIRST: {project_root}/research-complete.yaml, {project_root}/research-roadmap.yaml
      TASK: Archive 2026.05.212 to research-complete.yaml and initialize the .213 milestone in ops/changelog.md.
      CONCRETE STEPS:
      1. Move all tasks from `research-roadmap.yaml` into `research-complete.yaml` under a new 2026.05.212 entry, setting completed date to {date}.
      2. Clear `research-roadmap.yaml` and copy the new milestone structure from `research-roadmap-next.yaml`.
      3. Add a "## {date} (Milestone 2026.05.213 Operational Retrospective)" stub in `ops/changelog.md`.
      4. Write deliverable to `results/experiment_2143_archive.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2144-prem-architecture
    title: "Phase 1: Process-Reward Energy Model Architecture"
    max_turns: 50
    prompt: |
      CONTEXT: True O1-style reasoning requires step-level energy evaluations, rather than just final outcome rewards.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/models/boltzmann.py, {project_root}/python/carnot/models/gibbs.py
      TASK: Implement the Process-Reward Energy Model (PREM) base architecture.
      CONCRETE STEPS:
      1. Create `python/carnot/models/prem.py`.
      2. Design a step-wise energy evaluation module that subclasses our standard EBMs.
      3. Save to `results/experiment_2144_prem_arch.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2145-prem-training-pipeline
    title: "Phase 1: PREM Training Pipeline"
    max_turns: 50
    gated_on:
      - upstream: exp2144-prem-architecture
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: The PREM needs a custom training loop to learn step-level energy landscapes from reasoning trajectories.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/training/trainer.py
      TASK: Implement the PREM training pipeline using step-wise contrastive divergence.
      CONCRETE STEPS:
      1. Create `python/carnot/training/prem_trainer.py`.
      2. Implement trajectory-based training loops.
      3. Save to `results/experiment_2145_prem_train.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2146-prem-gsm8k-eval
    title: "Phase 1: PREM Evaluation on GSM8K"
    max_turns: 50
    gated_on:
      - upstream: exp2145-prem-training-pipeline
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: We must validate that PREM effectively guides decoding step-by-step.
      EXISTING CODE TO READ FIRST: {project_root}/tests/integration/test_gsm8k.py
      TASK: Run GSM8K using `unsloth/Qwen3.6-35B-A3B-GGUF` guided by PREM.
      CONCRETE STEPS:
      1. Execute a benchmark over 50 GSM8K problems with step-level PREM guidance.
      2. Record energy descent at each reasoning step.
      3. Save to `results/experiment_2146_prem_eval.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2147-ising-translation-module
    title: "Phase 2: Discrete-to-Ising Translation Module"
    max_turns: 50
    agent_type: "codex"
    prompt: |
      CONTEXT: To fully utilize thermodynamic sampling, we must map discrete logical constraints into continuous Ising spin Hamiltonians.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/verifier.py
      TASK: Implement a translator from SAT/SMT constraints to Ising models.
      CONCRETE STEPS:
      1. Create `python/carnot/inference/ising_translator.py`.
      2. Map basic AND/OR/NOT clauses to quadratic energy penalties.
      3. Save to `results/experiment_2147_ising_translation.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2148-ising-alps-sampling
    title: "Phase 2: Ising Hamiltonian Sampling via ALPS"
    max_turns: 50
    gated_on:
      - upstream: exp2147-ising-translation-module
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: The translated Ising Hamiltonians must be sampled efficiently using our Annealed Langevin Posterior Sampling (ALPS) module.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/sampler.py, {project_root}/python/carnot/inference/ising_translator.py
      TASK: Integrate Ising energy functions into the ALPS sampler.
      CONCRETE STEPS:
      1. Connect `ising_translator.py` output to the ALPS energy function interface.
      2. Test thermodynamic relaxation on a basic constraint set.
      3. Save to `results/experiment_2148_ising_alps.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2149-ising-constraint-benchmark
    title: "Phase 2: Ising Constraint Satisfaction Benchmark"
    max_turns: 50
    gated_on:
      - upstream: exp2148-ising-alps-sampling
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: We must measure the speedup of ALPS-based Ising sampling compared to discrete Z3.
      EXISTING CODE TO READ FIRST: {project_root}/tests/integration/test_constraints.py
      TASK: Benchmark ALPS Ising sampling on constraint satisfaction tasks.
      CONCRETE STEPS:
      1. Run a 100-problem constraint set.
      2. Compare satisfaction rate and wall-clock time against the Z3 baseline.
      3. Save to `results/experiment_2149_ising_benchmark.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2150-dynamic-ttc-controller
    title: "Phase 3: Dynamic Test-Time Compute (TTC) Controller"
    max_turns: 50
    prompt: |
      CONTEXT: Test-time compute should scale dynamically based on the local energy landscape variance (uncertainty).
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/dab.py
      TASK: Implement a dynamic budget controller for generative decoding.
      CONCRETE STEPS:
      1. Create `python/carnot/inference/ttc_controller.py`.
      2. Monitor PREM energy variance and dynamically expand beam/MCMC search budgets.
      3. Save to `results/experiment_2150_ttc_controller.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2151-ttc-prem-integration
    title: "Phase 3: TTC Integration with PREM and DAB"
    max_turns: 50
    gated_on:
      - upstream: exp2150-dynamic-ttc-controller
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: The TTC Controller must modulate the Discrete Auto-Regressive Biasing (DAB) steps based on PREM feedback.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/inference/ttc_controller.py, {project_root}/python/carnot/inference/hw_dab.py
      TASK: Wire the TTC controller into the DAB guided decoding pipeline.
      CONCRETE STEPS:
      1. Inject TTC dynamic budgeting into `hw_dab.py` decoding loop.
      2. Ensure budget scales properly during high-uncertainty steps.
      3. Save to `results/experiment_2151_ttc_integration.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2152-csl-intrinsic-prem
    title: "Phase 3: Continuous Self-Learning with PREM Intrinsic Motivation"
    max_turns: 50
    prompt: |
      CONTEXT: CSL needs a dense reward signal to avoid mode collapse; we will use PREM energy improvements as intrinsic motivation.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/training/csl_loop.py
      TASK: Integrate PREM feedback as an intrinsic reward in the CSL loop.
      CONCRETE STEPS:
      1. Modify `csl_loop.py` to accept PREM intrinsic rewards.
      2. Run a small CSL iteration demonstrating stable exploration.
      3. Save to `results/experiment_2152_csl_intrinsic.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2153-full-e2e-benchmark
    title: "Phase 4: Full E2E Benchmark (PREM + Ising + TTC)"
    max_turns: 50
    gated_on:
      - upstream: exp2151-ttc-prem-integration
        artifact_field: result
        op: "contains"
        value: "OK"
    prompt: |
      CONTEXT: Final validation of Milestone 213.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/pipeline/verify_repair.py
      TASK: Run the full execution pipeline using `unsloth/gemma-4-31B-it-GGUF`.
      CONCRETE STEPS:
      1. Combine PREM guidance, Ising constraints, and TTC.
      2. Evaluate overall reasoning accuracy and execution efficiency.
      3. Save to `results/experiment_2153_e2e.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2154-milestone-213-retro
    title: "Phase 4: Milestone 2026.05.213 Retrospective"
    max_turns: 20
    prompt: |
      CONTEXT: End of milestone analysis for .213.
      EXISTING CODE TO READ FIRST: {project_root}/ops/conductor-log.md
      TASK: Generate the retrospective analysis of the .213 milestone.
      CONCRETE STEPS:
      1. Read all experiment results from the 214X and 215X series.
      2. Synthesize findings into `results/experiment_2154_retro.json` and update `ops/status.md`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'