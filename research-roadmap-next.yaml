- id: exp975-env-propagation-guard
  milestone: 2026.04.76
  deliverable: results/experiment_975_env_propagation_guard.json
  title: "EnvPropagationGuard Fix — Subprocess CARNOT_ Env Var Inheritance"
  prompt: |
    CONTEXT:
    The .75 retro (results/experiment_973_milestone_retro_75.json) identified EnvPropagationGuard
    as the P0 infrastructure failure blocking ALL live GPU experiments. CARNOT_ env vars
    (CARNOT_FORCE_LIVE, CARNOT_N_SPINS, CARNOT_MAX_DEGREE, etc.) are not propagating to
    subprocesses when the conductor launches experiments. This explains why Exp 964 (Fast-Path
    Probe Live GPU) produced no result file — the live GPU was never triggered because
    CARNOT_FORCE_LIVE never reached the subprocess.

    This is the same class of failure as RETRO-015 (CARNOT_FORCE_LIVE not propagated) which
    recurred in Exp 853 and has been open since 2026.04.43. The fix is mechanical: ensure all
    CARNOT_ env vars are passed explicitly when subprocesses are spawned.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py (how VerifyRepairPipeline reads env vars)
    - scripts/experiment_template.py (ExperimentTemplate.setup() — where env vars are read)
    - python/carnot/pipeline/experiment_watchdog.py (ExperimentTimeoutWatchdog)

    TASK:
    Implement EnvPropagationGuard:
    1. In scripts/experiment_template.py, add a class method:
       EnvPropagationGuard.propagate() that:
       a. Reads all os.environ keys matching CARNOT_* or ROCM_* or HSA_*
       b. Calls os.environ.update({...}) to ensure these are set in the current process
       c. Logs which vars were found missing and added
    2. Call EnvPropagationGuard.propagate() at the top of ExperimentTemplate.setup()
       (before any model loading or pipeline initialization)
    3. Also fix: in VerifyRepairPipeline.__init__, force-read CARNOT_FORCE_LIVE from os.environ
       at call time (not at import time). Import-time env var capture is the common failure mode.
    4. Write an integration test: verify that a subprocess spawned via subprocess.run()
       with env=os.environ inherits CARNOT_FORCE_LIVE=1
    5. Write a unit test: EnvPropagationGuard.propagate() sets CARNOT_TEST_VAR in a fresh env

    CONCRETE STEPS:
    - Read scripts/experiment_template.py carefully
    - Identify all os.getenv() and os.environ.get() calls for CARNOT_ vars
    - Implement EnvPropagationGuard class (no more than 30 lines)
    - Add call to setup()
    - Write tests in tests/python/test_experiment_975_env_guard.py (100% coverage required)
    - Write results/experiment_975_env_propagation_guard.json with fields:
        guard_implemented: bool
        carnot_vars_propagated: list[str]
        integration_test_passed: bool
        unit_test_passed: bool
        honest_verdict: "env_propagation_fixed" | "env_propagation_partial" | "env_propagation_failed"

    Run: python scripts/experiment_975_env_propagation_guard.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

  priority: critical
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 45
  prior_failures:
  - experiment_id: exp853-live-env-propagation
    verdict: carnot_force_live_not_propagated
