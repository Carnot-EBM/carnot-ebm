  deliverable: results/experiment_852_semantic_energy_tier0f.json
  title: 'Exp 852: Semantic Energy Probe Tier 0f (arXiv 2508.14496, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
