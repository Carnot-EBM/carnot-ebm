    1. Print a flushed start line. Authenticate exact input paths, hashes and gate operands. External missing, retired or gate-blocked prerequisites produce complete_blocked_* with verdict_class=blocked and gate_check_summary, never partial. Readiness is measurement validity, not a positive science result.
    2. Print a flushed progress line at every phase boundary and before and after every model load, generation, benchmark and subprocess. Inside long loops print completed units and monotonic elapsed time; supervise owned children with heartbeats at most 60 seconds apart. Keep every output gap below 600 seconds and every tool wait at most 60 seconds. Silent work can die at 1200 seconds; continued progress allows the 4800-second hard cap. Never pad duration.
    3. Write every file over about 200 lines in several tool calls, at most 150 lines per call, with a progress message between calls. Bound analysis intervals as well as commands. Put throwaway probes in /tmp and real experiment drivers in scripts/experiments/. Use code/config/input-bound checkpoints.
    4. Add task-owned REQ-* and SCENARIO-* before implementation, then failing tests. Reuse callable libraries through a small parameterized CLI. Freeze affected files, transitive consumers, command argv, expected exits/reasons, deadlines and coverage includes before results. Keep assertions, protected historical determinations and the artifact-write guard intact.
    5. Allocate pytest basetemp, child fixture outputs, coverage data and mutable replay candidates in a unique TemporaryDirectory outside results/ and the checkout. Give each scenario its own publication directory. After children exit, archive immutable logs and coverage receipts below the task raw directory. Never use a protected results/raw path as pytest scratch; never disable the guard. Publish exactly one experiment primary at the declared deliverable and keep validator sidecars below results/raw/.
    6. Use only current Exp7970 eligible checkpoints and primitive rows. Define unsupported probability p and label y. Expected losses are accept=5p, reject=1-p, escalate=.25; actual losses are 5y, 1-y and .25. Ties escalate. These costs remain fixed before evaluation. Preserve all intended slots and separately report completed-probability and intended-action denominators.
    7. Compare constrained_set with augmented_set, constrained_mlp and local_logistic. Average seeds within family, then aggregate repeated source-cluster members before 10000 paired cluster bootstrap draws and paired randomization. Holm-correct six primary cost/Brier tests. Require >=32 eligible independent evaluation clusters with >=8 per class for comparative inference. Development benefit requires cost gain >=.02, CI95 lower>0 for cost and Brier against all three controls, adjusted p<.05, automated coverage>=.20 and no added false accepts. Low headroom, harm and insufficient power are explicit terminal null outcomes.
    8. Freeze expected-loss, margin and hash-random abstention thresholds on policy_design at target retained coverage .50. If observed coverage differs by >.05 across arms, the equal-coverage claim is invalid; do not retune on evaluation. Include fit-prevalence, length, source-erasure and length-matched source-permutation controls. Positive controls must expose real selectable headroom and arm changes before interpreting a null as method failure.
    9. Cold-reduce every decision and metric. Test all-null predictions, identical arms, zero accepted cases, unknown labels and wrong probability signs. Use E2E-015 and a private reducer CLI/replay. Update verifier_gaps only with exposed-development evidence and retain the September 28 correction; no independent moat or production-default claim follows.
    10. Run affected unit and transitive consumer tests with PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov. Combine unit and actual CLI success, expected-failure, blocked, cold-replay and terminal-recheck coverage with identical includes. Require nonempty coverage and 100 percent changed-module and CLI statements. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py on explicit affected test paths. Preserve historical failed receipts; record repository health separately without relabeling it as a pass.
    11. Run the task-specific E2Es above using private scratch. Historical Exp7868 fixture and replay commands both use --date 20260929; historical Exp7943/7954 fixture commands retain 20260930. Current producer records {date}, start/end UTC and monotonic spans separately. Authenticate each upstream against its own frozen invocation identity; do not require all tasks in a milestone to have the same run_date. Reject identity/hash drift, not honest midnight rollover.
    12. Cold-reduce claims from primitive rows and checkpoints. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate; inspect both reports and recheck final bytes after verdict changes. Any failed owned required check means disqualified and readiness zero. Verify conductor_gates.evaluate_gates and in_process_doc_reconcile select the checked primary path/hash even after newer nested sidecars. Atomically publish only checked bytes; bind terminal sidecars to the final hash.
    13. Use complete_* terminal verdicts and verdict_class from positive | circular_positive | null | blocked | disqualified | partial. Only unfinished owned work that a retry can finish is partial. Record valid underpowered or harmful results as null, external absence as blocked. Fixture agreement or predicting the verifier itself is circular_positive. Preserve the September 28 oracle-distinct corrigendum and exposed-development limits. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Record unchanged prior verdicts for retirement. Keep generator weights, production defaults and external publication unchanged.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date, execution_date, started_at, finished_at: Current producer identity and actual {date}. principle: A milestone may cross UTC days.
    - honest_verdict, verdict_class: Closed enum positive | circular_positive | null | blocked | disqualified | partial. principle: External incompleteness is terminal blocked.
    - flagged_adversarial, gate_check_summary: Final flag and, for every blocked_* or complete_blocked_* verdict, upstream ID, path/hash, field, op, expected and observed value. principle: Absent artifacts differ from failing thresholds.
    - rows, sample_size_budget: Per-unit metrics plus intended, eligible, started, completed, failed, censored, excluded and independent counts with named units. principle: Seeds, masks and timing repeats do not create independent sources.
    - acceptance_gate_results: Separate validity, readiness, calibration, decision benefit, retention and efficiency. principle: Completion is not improvement.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Actual monotonic work plus code/config/data identity. principle: Declared model names are not execution evidence.
    - source_artifact_hashes, cited_upstream_artifacts, preconditions_checked, resolved_imports: Paths, hashes, producer IDs, imported fields and callable dependencies. principle: Historical evidence keeps its original identity.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, coverage_statement_counts, historical_required_failures, repository_health: Commands, exits, deadlines, logs and actual measured files. principle: Owned failures cannot be hidden by a global-health category.
    - primary_resolution_receipt, terminal_validation_sidecar_path, scratch_root_receipt: Exact final primary/hash, terminal hash and private workspace location. principle: The conductor must consume the checked record.
    - verifier_is_oracle, claim_scope: Explicit circularity and exposed_development for reused data. principle: Human annotations are model-independent but fallible; they are not formal truth certificates.
    - inference_substrate, inference_substrate_class, execution_venue: Actual compute and host venue; blocked_no_run records planned class separately. principle: Actual work determines the duration floor.
    - MODEL_SPECS, model_specs, target_model, model_invocation_counts, trained_head_specs: Invoked pretrained models or empty lists and zero calls; fitted small heads separately. principle: Referenced generators are not current invocations.
    - field_principles: Explain every task-specific field and gate. principle: The contract records why the measurement exists.
    - decision_measurement_ready_score, decision_benefit_score: Separate valid measurement and registered benefit. principle: Qualified nulls do not close a PRD gap.
    - decision_rows, confidence_intervals, raw_p_values, adjusted_p_values, control_headroom, false_accept_counts, automation_coverage, equal_coverage_valid: Source-cluster inference and both denominators. principle: Escalating everything is not useful verification.
    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7971_v691_decision_abstention.py --date {date}
