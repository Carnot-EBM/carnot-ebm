    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1821-fast-slow-codification-paperv6
        verdict: planner_replaced_in_190
        addressed_by: "exp1821 (.190) was in my outer-loop draft but the planner replaced .190 with KAN-CL / Muon-OGD / Mpemba / etc. scope. The codification deferred to .191 (still didn't happen) and now .192. This time we GATE on adversarial confirmation (exp1837) first per the new discipline."
