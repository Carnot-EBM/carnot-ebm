  - id: exp2309-pretest-fix-completion
    title: "Phase 0: Fix 2 Remaining Pre-Test Failures (7th Attempt — Targeted)"
    milestone: "2026.05.227"
    deliverable: "results/experiment_2309_pretest_fix.json"
    requires_claude: true
    max_turns: 40
    prior_failures:
      - experiment_id: exp2295-pypi-escalation-fix-claude
        verdict: "complete: partial_fix — pypi_escalation ImportError resolved, full suite has 2 pre-existing unrelated failures"
        addressed_by: "exp2295 succeeded in adding check_pypi_escalation and run_escalation to python/carnot/pypi_escalation.py (import_error_resolved: true, 4/4 pypi tests pass). The 2 REMAINING failures are now known by exact name: (1) test_req_sample_041_probe_reports_direct_import_success_without_version in tests/python/test_experiment_1347_thrml_compatibility_parity_audit.py and (2) test_issue_14_soskan_aurocs_have_corpus_and_n in tests/python/test_experiment_1182_paper_v5_medium_low_issues_11_18.py. This task targets EXACTLY those 2 tests — a well-scoped debugging task vs the prior open-ended fix. Meets all 3 requires_claude criteria: (1) codex demonstrably failed x6 on pre-test cascade; (2) requires multi-file investigation (test files + source modules); (3) root cause may require judgment calls about whether to fix the test or fix the implementation."
    prompt: |
      CONTEXT: After 6 consecutive blocked milestones, exp2295 (.226) made decisive progress:
      the pypi_escalation ImportError is FIXED (import_error_resolved: true). However,
      pretest_fixed: false because 2 pre-existing test failures remain in the full suite.

      THE EXACT 2 FAILING TESTS (from exp2295 artifact):
        1. tests/python/test_experiment_1347_thrml_compatibility_parity_audit.py
           ::test_req_sample_041_probe_reports_direct_import_success_without_version
        2. tests/python/test_experiment_1182_paper_v5_medium_low_issues_11_18.py
           ::TestIssue11ThroughIssue15::test_issue_14_soskan_aurocs_have_corpus_and_n

      These are pre-existing failures that were masked by the ImportError cascade.
      This task fixes them so the full pre-test passes (errors=0, failures=0).

      EXISTING CODE TO READ FIRST:
        {project_root}/results/experiment_2295_pypi_escalation_fix.json
        {project_root}/tests/python/test_experiment_1347_thrml_compatibility_parity_audit.py
        {project_root}/tests/python/test_experiment_1182_paper_v5_medium_low_issues_11_18.py
      TASK: Fix the 2 named failing tests and confirm the full pre-test suite passes.
      CONCRETE STEPS:
        1. Run the 2 failing tests individually to get exact error messages:
           cd {project_root} && .venv/bin/python -m pytest \
             "tests/python/test_experiment_1347_thrml_compatibility_parity_audit.py::test_req_sample_041_probe_reports_direct_import_success_without_version" \
             "tests/python/test_experiment_1182_paper_v5_medium_low_issues_11_18.py::TestIssue11ThroughIssue15::test_issue_14_soskan_aurocs_have_corpus_and_n" \
             -x -v --no-cov -p no:cacheprovider 2>&1 | tail -40
           Record: test1_error, test2_error.
        2. For test 1 (thrml/REQ-SAMPLE-041):
           a. Read the test definition to understand what it asserts.
           b. Read the source module it tests (likely python/carnot/hardware/transpiler/ or
              python/carnot/samplers/backend.py or a THRML compatibility module).
           c. Diagnose: is the failure a missing field, wrong assertion value, or stale content?
           d. Fix: either update the implementation to match what the test expects,
              OR if the test is demonstrably wrong (tests a removed feature), update the test.
              Document the choice and reason in fix_rationale_1.
        3. For test 2 (SOS-KAN AUROC / REQ-PUBLISH-008):
           a. Read the test definition to understand what check_issue_14_soskan_auroc asserts.
           b. Read the module it calls (likely scripts/experiment_1182_*.py or a verify module).
           c. Read the content it checks (likely docs/main.tex or a results artifact).
           d. Diagnose: is the failure because the LaTeX content is missing required fields,
              or because the checking function has a bug, or because a result file changed?
           e. Fix: update the content or the check function. Document in fix_rationale_2.
        4. Re-run the 2 failing tests and confirm both pass.
        5. Run the FULL pre-test check:
           cd {project_root} && .venv/bin/python -m pytest tests/python \
             -x -q --no-cov -p no:cacheprovider 2>&1 | tail -10
           Record: full_pretest_errors, full_pretest_failures.
        6. Set pretest_fixed: true ONLY if full_pretest_errors == 0 AND full_pretest_failures == 0.
        7. Write deliverable to results/experiment_2309_pretest_fix.json.
           CRITICAL: Write the file even if tests still fail — honest partial fix is better
           than no deliverable.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if pretest_fixed is true. complete: partial_fix if only 1 of 2 tests is fixed. NEVER omit the file — an absent deliverable is worse than an honest blocked verdict."
        - pretest_fixed:
            principle: "Primary gate for ALL Phase 1–3 tasks. True only when the full pytest suite has zero errors AND zero failures. The 2 named tests must pass; no other tests must break."
        - full_pretest_errors:
            principle: "Must be 0 for pretest_fixed=true. Records whether any import errors remain."
        - full_pretest_failures:
            principle: "Must be 0 for pretest_fixed=true. Records whether any test assertions fail."
        - fix_rationale_1:
            principle: "Documents whether the THRML test was fixed by updating code or test; explains the root cause found. Informs future test maintenance decisions."
        - fix_rationale_2:
            principle: "Documents whether the SOS-KAN test was fixed by updating content or check function; explains the root cause. Informs paper-v6 integrity audit scope."
        - tests_fixed:
            principle: "Lists test names that now pass; confirms both named failures are resolved."
        - iterations_required:
            principle: "Records how many fix-test cycles were needed; calibrates future estimates."

