         For each entry, simulate token-level MH acceptance:
           energy_before = IsingEnergy(response[:t])
           energy_after  = IsingEnergy(response[:t+1])
           acceptance_rate = fraction of tokens accepted under MH rule
         Compute: mean_acceptance_rate, mean_energy_reduction_ratio.

