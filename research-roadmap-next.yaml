       levels_reached_without_adapter, attempted actions, valid actions,
       resets, simulation calls, consumed forecasts, budget used, termination,
       GPU telemetry, and raw-trace hash.
    6. Read registry `levels_reproduced` only after the live rows are sealed.
       Join it for comparison, never for policy input. Set
       adapter_withheld_loo_complete_score=1 when every frozen cell and
       provenance check finishes, even if every levels-reached value is zero.
       Set adapter_withheld_any_level_score independently from the rows.
    7. Freshly replay every claimed transition and level. A counted outcome
       requires offline_reproduced=true. Use
       solve_provenance=development_proxy and arc_registry_delta=0. Do not edit
       the registry or describe a development-proxy level as a new solve.
