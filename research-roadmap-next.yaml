- id: exp1323-sota-gguf-token-health-prompt-runtime-diagnostic
  milestone: 2026.04.103
  deliverable: results/experiment_1323_sota_gguf_token_health_prompt_runtime_diagnostic.json
  title: "SOTA GGUF Token-Health + Prompt/Runtime Diagnostic - Empty Output Root Cause"
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  estimated_wall_time_min: 60
  priority: critical
  requires_gpu: true
  prior_failures:
    - experiment_id: exp1311-sota-constraintbench-satquest-answer-stability
      verdict: answer_stability_high_but_many_empty_or_one_token_outputs
      addressed_by: "Measure token-health, generation settings, prompt variants, and logprob/entropy availability before rerunning certificate extraction."
      retire_if_same_verdict: true
    - experiment_id: exp1312-triggered-certificate-extraction-dccd-gbnf
      verdict: certificate_parse_rate_0_71223_below_0_75_gate
      addressed_by: "Diagnose whether the parse miss is caused by runtime undergeneration, prompt shape, or parser coverage before changing the certificate branch."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Milestone .102 proved the local SOTA GGUF pair can load, but exp1311 showed
    many empty or one-token raw outputs and exp1312 reached only
    certificate_parse_rate=0.71223. This task diagnoses generation health before
    any downstream certificate task spends more SOTA model time. Use
    {project_root} as the project root and {date} as the run date in artifact
    metadata.

    MODEL_SPECS:
    Use cached_sota_pair(gpu_indices=(0, 1)) from python/carnot/inference/sota_models.py.
    Headline probes must include at least one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models may only be CPU smoke tests with headline_result_allowed=false.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - results/experiment_1309_sota_gguf_pair_resolver_repair.json
    - results/experiment_1310_sota_gguf_llamacpp_smoke_load.json
    - results/experiment_1311_sota_constraintbench_satquest_answer_stability.json
    - results/experiment_1312_triggered_certificate_extraction_dccd_gbnf.json
    - research-references.md
    - openspec/capabilities/pipeline/spec.md

    TASK:
    Build and run a token-health diagnostic for the mandated local SOTA GGUF
    pair. Identify whether empty/one-token outputs are caused by max-token
    settings, stop strings, chat template issues, grammar settings, prompt
    shape, llama.cpp runtime configuration, or model-family behavior. Do not
    modify research-roadmap.yaml.

    REQUIRED ARTIFACT FIELDS:
    - status
    - models_used
    - prompt_variants_tested
    - generation_settings
    - empty_or_one_token_rate
    - min_tokens_recovered
    - topk_logprob_available
    - entropy_production_rate_available
    - certificate_parse_delta_with_probe_gate
    - recommended_certificate_runtime_settings
    - headline_result_allowed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1323_sota_gguf_token_health_prompt_runtime_diagnostic.json immediately with status="in_progress".
    2. Load exp1310, exp1311, and exp1312 artifacts and extract the model IDs, prompt shapes, token budgets, stop settings, and observed raw-output lengths.
    3. Resolve MODEL_SPECS through cached_sota_pair(gpu_indices=(0, 1)) and record the exact mandated models used.
    4. Run a tiny deterministic diagnostic grid: baseline prompt, chat-template prompt, no-stop-string prompt, larger max-token budget, and certificate-shaped prompt. Keep the number of generations small.
    5. If the runtime exposes token logprobs or top-k probabilities, compute a minimal token-health summary and a token-level entropy production proxy; otherwise record topk_logprob_available=false and entropy_production_rate_available=false with the missing API reason.
    6. For each prompt variant, record raw-output length, parsed certificate skeleton availability if applicable, empty_or_one_token flag, and runtime errors.
    7. Write recommended_certificate_runtime_settings and set min_tokens_recovered=true only if at least one SOTA model reliably produces multi-token outputs on the certificate-shaped prompt.
    8. Write all required fields, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1323_sota_gguf_token_health_prompt_runtime_diagnostic.json')); print(d.get('empty_or_one_token_rate'), d.get('min_tokens_recovered'), d.get('topk_logprob_available'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1324-certificate-failure-taxonomy-formalizer-reality-check
  milestone: 2026.04.103
  deliverable: results/experiment_1324_certificate_failure_taxonomy_formalizer_reality_check.json
  title: "Certificate Failure Taxonomy + Formalizer Reality Check on Exp1312"
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  estimated_wall_time_min: 30
  priority: high
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1312-triggered-certificate-extraction-dccd-gbnf
      verdict: parse_rate_below_gate_and_truthfulness_under_0_70
      addressed_by: "Classify failure modes before changing extraction prompts or validators."
      retire_if_same_verdict: false
    - experiment_id: exp1313-constrainprompt-nsvif-semantic-validator-mus-repair
      verdict: blocked_gate_certificate_parse_rate_actual_0_71223_lt_0_75
      addressed_by: "Name the minimum parse and semantic repairs needed before rerunning validator work."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The post-.102 literature sweep added the 2025 Reality Check paper on LLM
    formalizers for CSPs, SatIR, and orthographic constraint satisfaction. These
    sources warn that answer stability and parseability are not enough. Use
    {project_root} as the project root and {date} as the run date in artifact
    metadata.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - results/experiment_1311_sota_constraintbench_satquest_answer_stability.json
    - results/experiment_1312_triggered_certificate_extraction_dccd_gbnf.json
    - results/experiment_1313_constrainprompt_nsvif_semantic_validator_mus_repair.json
    - docs/research-notes/literature-priority-audit.md
    - openspec/capabilities/pipeline/spec.md

    TASK:
    Produce a failure taxonomy for .102 certificate extraction and map each
    failure class to the smallest repair needed in .103. This is a diagnostic
    artifact, not a fresh SOTA generation run. Do not modify research-roadmap.yaml.

    REQUIRED ARTIFACT FIELDS:
    - status
    - formalizer_failure_modes
    - parser_failure_count
    - semantic_failure_count
    - undergeneration_failure_count
    - hardcoded_solution_leakage_rate
    - solver_vs_certificate_delta
    - reasoning_token_overhead
    - parse_recovery_recommendation
    - minimum_gate_delta_needed
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1324_certificate_failure_taxonomy_formalizer_reality_check.json immediately with status="in_progress".
    2. Read exp1311 and exp1312 artifacts and separate failures into undergeneration, parser/schema mismatch, semantic invalidity, solver disagreement, unknown-state mishandling, and possible hardcoded-solution leakage.
    3. Use the new research-references.md section to summarize why CSP formalization failures must be evaluated with solver-backed certificates rather than answer agreement.
    4. If exp1312 saved per-case records, audit them directly. If only aggregate records are available, record that limitation explicitly and compute counts from available data only.
    5. Estimate minimum_gate_delta_needed as max(0, 0.75 - exp1312.certificate_parse_rate).
    6. Recommend which fixes should feed exp1325: runtime settings, prompt schema, grammar coverage, DCCD compact encoding, or parser repair.
    7. Write all required fields, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1324_certificate_failure_taxonomy_formalizer_reality_check.json')); print(d.get('minimum_gate_delta_needed'), d.get('parse_recovery_recommendation'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

