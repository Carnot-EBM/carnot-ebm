        test_bitstream_header_check, test_lut_count_parsed.
        Traces to REQ-FPGA-005, SCENARIO-FPGA-006.
    13. Reconcile:
        - ops/changelog.md: one-line entry
        - ops/status.md: "Exp 851: iCE40 N=16. bitstream_generated=<bool>. lut_count=<n>."
    14. tmpl.assert_deliverable_written() as final line.

