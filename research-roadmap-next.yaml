    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.675. Compute raw response risk per view first. Average A/B risks for two-view arms, then apply one response-level temperature to the mean risk logit, then choose one typed decision. Tune selection uses uncalibrated deployed response NLL; temperature fits the same aggregated tune risk. Canonical arms use A; logistic averages features before its shared head. Never average losses as a substitute for this deployment rule. Exp7750 never ran; Exp7751 supplied a dated continuity inventory only. No full-service measurement or new board acceleration was established.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
