- id: exp716-preflight-v7-incremental
  milestone: 2026.04.55
  deliverable: results/experiment_716_preflight_v7.json
  title: 'Exp 716: Pre-flight v7 + Incremental Test Selection (MANDATORY FIRST — reduce overhead from 562 min)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The pre-flight test suite now consumes 562 min = 14.6% wall time — the LARGEST
    recoverable overhead in the project, exceeding the 322 min freed by the slowest-5
    governance win in Exp 703. This has been unaddressed for 14 consecutive milestones.
    Additionally, Exp 527 (Live 100q Precision v8) entered the slowest-5 at 52 min in .54
    — first appearance, same anti-pattern as retired Exps 308/309. It must be fixed now
    before it compounds.

    ROOT CAUSE: Pre-flight runs the ENTIRE test suite every cycle, even when only 1-2 modules
    changed. A git-diff-based incremental selector runs only tests for changed modules,
    reducing overhead proportionally to the fraction of code touched per cycle (typically
    10-20% of modules).

    EXISTING CODE TO READ FIRST:
    - scripts/conductor_pre_flight.py — current pre-flight runner.
    - scripts/conductor_exclusion_manifest.json — manifest with retired experiments.
    - python/carnot/pipeline/exclusion_manifest.py — ExclusionManifest class.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.
    - results/experiment_703_preflight_v6.json — v6 baseline metrics.
    - results/experiment_527_live_100q_precision_v8.json (if exists) — slowest-5 entry.

    TASK: Implement incremental test selection in pre-flight. Apply BatchedInferenceRunner
    to Exp 527 if it re-enters slowest-5.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-INFRA-041 (pre-flight MUST use git-diff-based incremental test selection;
       full suite runs only on weekly cadence or when diff > 20 files),
       REQ-INFRA-042 (any experiment exceeding 45 min MUST be refactored with
       BatchedInferenceRunner before next milestone),
       SCENARIO-INFRA-050/051 to openspec/capabilities/pipeline/spec.md.
    3. Implement scripts/incremental_test_selector.py:
       a. Run `git diff --name-only HEAD~1` to get changed files.
       b. Map changed Python module paths → dependent test files via import graph.
       c. If diff > 20 files OR any crate/ file changed: return None (run full suite).
       d. Return list of test file paths to run.
       e. Cache the mapping in .preflight_test_cache.json.
    4. Update scripts/conductor_pre_flight.py:
       a. Call IncrementalTestSelector.select() before running pytest.
       b. If select() returns None: run full suite (existing behavior).
       c. If select() returns list: run `pytest {files}` only.
       d. Log: incremental_mode (bool), tests_selected (int), tests_total (int),
          selection_ratio (float).
    5. Check if results/experiment_527_live_100q_precision_v8.json exists.
       If Exp 527 is still in slowest-5 (duration_minutes > 45):
       a. Read the existing Exp 527 script.
       b. Wrap its inference loop with BatchedInferenceRunner (8q batches).
       c. Update the script in place. Write tests.
    6. Create scripts/experiment_716_preflight_v7.py:
       a. ExperimentTemplate(716) + ExperimentTimeoutWatchdog(716, timeout_minutes=30).
       b. Run incremental test selector on current diff.
       c. Run pre-flight with incremental selection.
       d. Measure: tests_selected, tests_total, wall_time_minutes.
       e. honest_verdict:
          - "preflight_v7_complete" if incremental_mode=True AND wall_time_minutes < 200
          - "preflight_v7_full_suite" if incremental_mode=False (large diff, expected)
          - "preflight_v7_overhead_unchanged" if wall_time_minutes >= 562
       f. artifact: incremental_mode, tests_selected, tests_total, selection_ratio,
          wall_time_minutes, exp527_batched (bool), honest_verdict.
    7. Write tests/python/test_experiment_716_preflight_v7.py with 100% coverage:
       - test incremental selector maps changed files to correct test files.
       - test full-suite fallback triggers when diff > 20 files.
       - test artifact has all required fields.
       Each test traces to REQ-INFRA-041/042.
