      2. Use PyVerilator or equivalent to simulate the synthesized Verilog.
      3. Compare the output to the Python Symbolic-KAN implementation.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.
    model: opus
    max_turns: 100

