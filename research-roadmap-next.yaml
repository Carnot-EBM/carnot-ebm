  - id: exp6328-blind-guard-integrity-audit
    milestone: "2026.08.545"
    deliverable: results/experiment_6328_blind_guard_integrity_audit.json
    title: "Independent blind-obligation guard integrity audit"
    priority: critical
    track: safety
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6327-three-family-guarded-policy-synthesis
    prompt: |
      CONTEXT
      MARCH motivates an information-asymmetric checker. Carnot uses only the architectural principle. The audit receives the canonical contract, normalized candidate semantics, and exact evidence. It must not receive the solver narrative, generated rationale, claimed verdict, or arm label. The exact checker remains an oracle. Safety-only success cannot promote utility.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md V545 MARCH entry
      - {project_root}/results/experiment_6326_restricted_policy_contract_compiler.json
      - {project_root}/results/experiment_6327_three_family_guarded_policy_synthesis.json
      - {project_root}/scripts/adversarial_verify.py
      - {project_root}/python/carnot/experiment_6320_online_self_evolution_safety_audit.py
      - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md and {project_root}/ops/e2e-test-plan.md

      TASK
