      - {project_root}/research-references.md
      - {project_root}/results/experiment_5430_structured_tautology_corrigendum_v494.json
      - {project_root}/results/experiment_5431_structured_constraint_taxonomy_replication_v494.json
      - {project_root}/python/carnot
      - {project_root}/tests/python

      TASK:
      Build a deterministic verifier-potential fixture that scores partial structured outputs, records reward-evaluation cost, and proves exact final checks remain authoritative.

      CONCRETE STEPS:
      1. Create or extend a small experiment module under an appropriate existing scripts or python/carnot path; do not write scratch files to the repo root.
      2. Define fixture families for schema-only traps, semantic contradictions, unreachable tool actions, arithmetic/finite-domain constraints, ontology/triple updates, API-call witnesses, and benign rows.
