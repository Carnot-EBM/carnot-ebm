milestone: 2026.05.137
milestone_title: "Phase-14: Continuous Latent Optimization, HILED Hardware Bring-up, and Multi-Session Memory"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1771-continuous-latent-modeling
    title: "Exp 1771: Continuous Latent Constraint Modeling"
    prompt: >
      CONTEXT: We must optimize elicited constraints in a continuous latent space using Langevin dynamics during generation (arXiv:2605.18210).
      EXISTING CODE TO READ FIRST: `python/carnot/models/hrm_verifier.py`, `python/carnot/pipeline/roce_extractor.py`.
      TASK: Implement the continuous latent constraint optimizer.
      CONCRETE STEPS:
      1. Create `python/carnot/models/latent_optimizer.py`.
      2. Implement Langevin dynamics for continuous constraint relaxation and optimization over HRM outputs.
      3. Add unit tests for energy descent.
      4. Write `{project_root}/results/experiment_1771_latent_optimizer.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1772-differentiable-elicitation
    title: "Exp 1772: gated on Exp 1771 honest_verdict in success: Differentiable Constraint Elicitation"
    gated_on:
      - upstream: exp1771-continuous-latent-modeling
        artifact_field: honest_verdict
        op: in
        value: ["success", "complete"]
    prompt: >
      CONTEXT: ROCE must be integrated with the continuous latent optimizer so elicited constraints can be differentiated.
      EXISTING CODE TO READ FIRST: `python/carnot/models/latent_optimizer.py`, `python/carnot/pipeline/roce_extractor.py`.
      TASK: Integrate ROCE with the latent optimizer.
      CONCRETE STEPS:
      1. Modify `python/carnot/pipeline/roce_extractor.py` or create a wrapper `python/carnot/pipeline/differentiable_roce.py`.
      2. Ensure constraint outputs support gradient flow for the latent optimizer.
      3. Write `{project_root}/results/experiment_1772_diff_roce.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1773-latent-benchmark
    title: "Exp 1773: Multi-modal constraint benchmark evaluation"
    prompt: >
      CONTEXT: Evaluate the continuous latent constraint modeling on our multi-modal constraint benchmark.
      EXISTING CODE TO READ FIRST: `python/carnot/models/latent_optimizer.py`.
      TASK: Run the continuous benchmark.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1773_latent_benchmark.py`.
      2. Use `unsloth/gemma-4-31B-it-GGUF` in MODEL_SPECS.
      3. Record energy convergence and validity rates.
      4. Write `{project_root}/results/experiment_1773_latent_benchmark.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1774-differentiable-memory-bank
    title: "Exp 1774: Differentiable Constraint Memory Bank"
    prompt: >
      CONTEXT: Multi-session continual learning requires a differentiable memory bank (arXiv:2605.09332) to persist structured constraints without forgetting.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/continual_memory.py`.
      TASK: Implement the differentiable constraint memory bank.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/differentiable_memory.py`.
      2. Implement the memory bank operations (read, write, update) using differentiable attention mechanisms.
      3. Write `{project_root}/results/experiment_1774_diff_memory.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1775-cross-session-retrieval
    title: "Exp 1775: Cross-session semantic retrieval mechanism"
    prompt: >
      CONTEXT: We need to retrieve constraints across different sessions robustly using semantic keys.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/differentiable_memory.py`.
      TASK: Build the cross-session retrieval mechanism.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/cross_session_retrieval.py`.
      2. Integrate it with the differentiable memory bank.
      3. Write `{project_root}/results/experiment_1775_cross_session.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1776-multi-session-forgetting
    title: "Exp 1776: Multi-session forgetting rate evaluation"
    prompt: >
      CONTEXT: Test the multi-session memory bank to ensure catastrophic forgetting is mitigated.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/cross_session_retrieval.py`.
      TASK: Evaluate multi-session forgetting rates.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1776_forgetting_eval.py`.
      2. Simulate 3 sequential sessions and measure constraint retention using `unsloth/gemma-4-26B-A4B-it-GGUF`.
      3. Write `{project_root}/results/experiment_1776_forgetting_eval.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1777-ltlzinc-scaleup
    title: "Exp 1777: Self-learning pipeline scale-up on LTLZinc"
    prompt: >
      CONTEXT: Scale up the continual learning on the LTLZinc benchmark using the new memory architecture.
      EXISTING CODE TO READ FIRST: `scripts/experiment_1776_forgetting_eval.py`.
