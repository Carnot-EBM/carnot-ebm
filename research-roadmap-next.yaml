  goal_predicate_satisfiable={lp85:false,sc25:false}, bare_control_passed=false (sc25 reached only L0 generically),
  retire_if_same_verdict FIRED (the precise L2-goal-induction fix is RETIRED). A2 (exp4665) DAgger-lite distribution-shift
  value-routing corrected the shift score 0.699->0.0 mechanically but gave first_win_rate_delta=0.0, solve_rate_delta=0.0,
  residual missing_verifier_gap_live_frontier_not_separated. THE DECISIVE NEW INPUT: A2's honest fixed-harness measurement
  shows the GENERIC E3AgentPolicy reaches first-win on only 1 of 25 public games (lp85) -- first_win_rate=0.04, NOT the ~0.59
  the .430 roadmap assumed; the corrected and baseline value heads BOTH score 0.04 because the agent fails to reach L1 on
