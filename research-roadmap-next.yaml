  - id: exp3383-ebm-cot-trajectory-monitor
    operator_override: "2026-05-29 operator directive (outer-loop, 'override both'): authorized. Legit lineage continuation — new Interwhen-style step-wise trajectory verifier w/ SOTA GGUFs, builds on the .309 interwhen-monitor line; false-positive scope-match vs retired EBM-CoT exps (exp1293/1416/1803/1810/2009). Stated new technique, not a rerun."
    milestone: "2026.05.312"
    title: "EBM-CoT Trajectory Monitor with SOTA Models"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 25
    track: live-model
    inference_substrate: live_generation
    requires_gpu: true
    deliverable: "results/experiment_3383_ebm_cot_trajectory.json"
    prompt: |
      CONTEXT: Recent 2025/2026 literature highlights EBM-CoT, where scalar energy functions calibrate reasoning traces. Hallucinations represent premature commitment failures.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/three_tier_pipeline.py
      TASK: Implement an Interwhen-style verifier monitor that scores intermediate trajectory steps using SOTA GGUF models.
      CONCRETE STEPS:
        1. Setup inference pipeline for `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF` (use cached_sota_pair()).
        2. Implement a step-wise exact verifier that scores reasoning partials.
        3. Reject paths where verifier confidence drops (energy spike) before completion.
        4. Emit artifact comparing final answer accuracy vs. early-commitment detection.
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3383_ebm_cot_trajectory.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3384-parallel-energy-minimization
    milestone: "2026.05.312"
    title: "Parallel Energy Minimization for Constraint Composition"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 20
    track: validation
    inference_substrate: synthetic
    requires_gpu: true
    deliverable: "results/experiment_3384_pem_composition.json"
    prompt: |
      CONTEXT: The 2025 Oarga & Du paper demonstrated Parallel Energy Minimization (PEM) over composed subproblems.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/three_tier_pipeline.py
      TASK: Decompose a constraint satisfaction problem into local energy landscapes and solve via PEM.
      CONCRETE STEPS:
        1. Create a synthetic modular constraint problem (e.g. graph coloring).
        2. Define local energy models for sub-graphs.
        3. Run PEM inference combining local models.
        4. Use `unsloth/gemma-4-26B-A4B-it-GGUF` as a baseline reference solver for the same problem.
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3384_pem_composition.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3385-caffnet-differentiable-layer
    milestone: "2026.05.312"
    title: "CAffNet Differentiable Constraint Layer Prototype"
    priority: normal
    max_turns: 50
    agent_type: codex
    estimated_wall_time_min: 15
    track: research
    inference_substrate: synthetic
    requires_gpu: false
    deliverable: "results/experiment_3385_caffnet_layer.json"
    prompt: |
      CONTEXT: 2026 research like CAffNet introduces differentiable layers that strictly guarantee affine constraints.
      EXISTING CODE TO READ FIRST: scripts/experiment_template.py
      TASK: Implement a toy differentiable constraint layer using JAX for Tier-1 EBM filtering.
      CONCRETE STEPS:
        1. Write a JAX layer that projects unconstrained logits onto a constrained affine subspace.
        2. Train a small network to map inputs to outputs satisfying linear inequalities.
        3. Assert 100% hard constraint satisfaction at inference time.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3385_caffnet_layer.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3386-fr11-locality-aware-memory
    operator_override: "2026-05-29 operator directive (outer-loop, 'override both'): authorized. Legit lineage continuation — KAN-CL locality anchoring on FR-11 memory, builds on exp3372 (passed in .311); false-positive scope-match vs retired fr11-memory exps (exp1484/3200/3255). New mechanism on a fresh successful baseline, not a rerun."
    milestone: "2026.05.312"
    title: "FR-11 Locality-Aware Nonforgetting Memory"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 20
    track: self-learning
    inference_substrate: synthetic
    requires_gpu: false
    deliverable: "results/experiment_3386_fr11_nonforgetting.json"
    prompt: |
      CONTEXT: KAN-CL (2026) emphasizes per-knot locality to avoid catastrophic forgetting. FR-11 must not forget old constraints.
      EXISTING CODE TO READ FIRST: data/test_fr11_tier2_memory.db
      TASK: Add locality anchoring or holdout-bounds to the FR-11 constraint memory updates.
      CONCRETE STEPS:
        1. Load `exp3372` artifacts as baseline memory.
        2. Introduce new constraint conflicts, and apply localized memory updates.
        3. Evaluate on a holdout set to measure nonforgetting (zero regression on past cases).
        4. If regression > 0, implement a rollback mechanism.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3386_fr11_nonforgetting.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

