      TASK: 4-cell random-verifier-injection ablation at n=32 substrate.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `python -c "from python.carnot.phase4 import alpha_t"` succeeds
              OR the alpha_t function is locatable via grep — if not, emit
              `blocked_phase4_alpha_t_implementation_missing` and exit.
           b. `python -c "import numpy as np; import scipy; print(scipy.__version__)"`
              succeeds — if not, emit `blocked_scipy_missing`.
           Record preconditions_checked.
        1-6. Per the original exp1699 spec. random_fraction grid
           [0, 1/3, 2/3, 1], 30 seeds each, n=32 substrate, 100 MLD steps,
           report delta_alpha + bootstrap CI per cell + monotonic_decay_observed
           + artifact_detected flags.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase4_alpha_t_audit.v1"
        - experiment: 1710
        - run_date: ISO-8601 UTC
        - duration_s: must be > 60s (4 cells * 30 seeds at n=32 in real
          measurement)
        - random_seed: 171510 (NOT 1710 or 32)
        - reproducibility_checksum: sha256 of (verifier ensemble fingerprint
          + random_verifier_seed + alpha_t implementation git_rev)
        - preconditions_checked: list
        - model_specs: {n_spins: 32, ensemble_k_total: 6,
          random_fraction_grid: [0, 0.333, 0.667, 1.0], mld_steps: 100,
          n_seeds: 30, n_cells: 4}
        - n_samples: 12000
        - n_samples_justification: "30 seeds × 100 MLD × 4 cells. n_seeds=30
          chosen for CLT bootstrap CI validity. n=32 chosen to eliminate
          substrate-size confound from prior n=8/16/32/64 measurements."
        - random_fraction_grid_results: list of {random_fraction, inf_t_alpha_k6,
          inf_t_alpha_k1, delta_alpha, delta_alpha_bootstrap_ci_95}
        - monotonic_decay_observed: bool
        - artifact_detected: bool
        - acceptance_gate_passed: true (falsification task; both outcomes
          are findings — confirmation of n-dependence OR artifact detection)
        - acceptance_gate_criteria: "4-cell ablation reported with bootstrap
          CIs; monotonicity and artifact-detection flags set per actual data."
        - methodology_note: "If delta_alpha stays at ~0.15 across all four
          cells, this is a structural finding. The new IMPLAUSIBLE_TIGHT_CI
          adversarial-verify rule will flag any CI tighter than sigma/sqrt(N)
          — disclose intentional invariance honestly in this field."
        - optimization_direction: "neither — falsification audit"
        - honest_verdict: MUST start with terminal prefix.

