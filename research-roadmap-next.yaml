            - experiment_scope: "iCE40 PIMI research (hardware/kv260/ising_pimi_*.v + python/carnot/samplers/*pimi*.py)"
              reason: "retire_if_same_verdict triggered by Exp 914: all three strategies
                       (EMA, parallel, sparse adjacency) failed to reach 5x sweep reduction.
                       Maximum achieved: 4.33x. PIMI approach is architecturally limited."
              retired_milestone: "2026.04.70"
         b. Mark RETRO-INERTIA-SWEEPS-TARGET-MISSED as RETIRED in MILESTONE_PREREQS.md.
         c. Set retro_closed_as_retired=True in artifact.
    6. Write tests. Traces to existing PIMI REQ entries.
    7. Write results/experiment_914_pimi_sparse_adjacency_final.json.
    8. Update ops/changelog.md: one-line entry.
    9. tmpl.assert_deliverable_written() as final line.

