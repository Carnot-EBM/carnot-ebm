  - id: exp2741
    milestone: "2026.05.260"
    deliverable: "results/experiment_2741_tier0g_live_gpu_rerun.json"
    title: "Tier 0g Semantic Energy Live GPU Re-run + Upstream GGUF Logit Diagnosis"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 50
    track: verifier

    prior_failures:
      - experiment_id: exp2731-semantic-energy-tier0g
        verdict: "complete: tier0g_non_degenerate=true (synthetic); tier0g_auroc=0.288; BUT gguf_non_degenerate=false (all 3 GGUF inputs = 9.085), flagged_adversarial=DURATION_TOO_SHORT (3.3s)"
        addressed_by: "exp2731 (.259) showed Tier 0g is non-degenerate on synthetic (energies 8.4-9.1, 6584 clusters) but gguf_non_degenerate=false (identical energy 9.085 across all 3 GGUF inputs). exp2731 was adversarial-flagged (3.3s for GGUF eval). This exp2741 ADDS: explicit GGUF load (Qwen3.6-35B, RTX 3090), N=30 live examples (not N=3), upstream logit diagnosis (do all GGUF inputs produce the same TF-IDF feature vector?). Different: exp2731 used 3 examples with GGUF; exp2741 uses 30 examples + traces whether the collapse is in TF-IDF feature space (GGUF markdown formatting collapses TF-IDF) or in the GGUF logit space (model returns identical token probs)."
        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      exp2731 (.259) implemented Tier 0g Semantic Energy (arXiv:2508.14496). Non-degenerate on synthetic
      responses (energies 8.4-9.1, std > 0.01). BUT on live GGUF: all 3 inputs produced identical energy
      9.085, gguf_non_degenerate=false. Two root cause hypotheses:

      H1: TF-IDF collapse — GGUF responses in markdown format produce nearly identical TF-IDF vectors
          (markdown tokens dominate; actual content tokens underweighted). The k-NN search returns the
          same cluster for all GGUF inputs.

      H2: GGUF content collapse — Qwen3.6-35B-A3B produces semantically very similar responses for
          diverse prompts (all with similar markdown structure), so TF-IDF correctly assigns them to
          one cluster.

      Diagnosis approach: compute TF-IDF vectors for 30 live GGUF responses and measure pairwise
      cosine similarity. If mean similarity > 0.95: H1 (TF-IDF collapse). If < 0.8: H2 (content
      collapse). If GGUF responses are genuinely diverse (content), then the verifier needs a different
      feature extractor (sentence embeddings, not TF-IDF).

      MODEL_SPECS (mandatory per CLAUDE.md SOTA GGUF requirement):
        - name: Qwen3.6-35B-A3B-GGUF
          hf_id: unsloth/Qwen3.6-35B-A3B-GGUF
          role: live_tier0g_diagnostic
        - name: gemma-4-26B-A4B-it-GGUF (fallback if Qwen GGUF unavailable)
          hf_id: unsloth/gemma-4-26B-A4B-it-GGUF
          role: fallback_live_diagnostic

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/tier0g_semantic_energy.py (SemanticEnergyVerifier from exp2731)
      - results/experiment_2731_semantic_energy_tier0g.json (tier0g_auroc, cluster settings, gguf_non_degenerate)
      - data/fover_corpus.jsonl (FoVer corpus)

      TASK: Re-run Tier 0g on RTX 3090 with 30 live GGUF examples. Diagnose why GGUF inputs collapse.
      Fix if H1 (TF-IDF collapse). Document if H2 (content collapse — different fix needed in .261).

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null`
            Record: cuda_available (bool), gpu_names (list).
            If cuda_available=false: write honest_verdict 'blocked_cuda_not_available' and exit.
         b. `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/ 2>/dev/null | head -3`
            Record: qwen_gguf_cached (bool).
            If qwen_gguf_cached=false:
