- id: exp7028-v616-active-contract-preflight
  title: V616 active-roadmap and design-document contract preflight
  track: infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 90
  per_unit_rows: true
  milestone: 2026.09.616
  deliverable: results/experiment_7028_v616_active_contract_preflight.json
  prior_failures:
    - experiment_id: exp7016-v615-source-contract-preflight
      verdict: blocked_v615_contract_preflight
      addressed_by: "Exp7028 reads research-roadmap.yaml after activation instead of the staging-only research-roadmap-next.yaml path that caused Exp7016's FileNotFoundError, and it tests that distinction explicitly."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V615's Markdown and YAML described the same 12 tasks, but Exp7016 still
    blocked because its execution-time code tried to open the staging file
    `research-roadmap-next.yaml` after activation. The active contract at task
    execution is `research-roadmap.yaml`. V616 has exactly 10 tasks, exp7028
    through exp7037, in this document and the active YAML. This task is
    advisory and must not gate the science chain.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md section "V616 Planner Refresh"
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7016_v615_source_contract_preflight.json
    - {project_root}/results/experiment_7027_v615_capstone.json
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/scripts/conductor_gates.py
    - {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and run an exact V616 active-YAML versus Markdown contract preflight.
    Check count, order, IDs, titles, deliverables, structured gates, producer
    fields, prior-failure entries, model declarations, required artifact
    fields, legal substrate declarations, and prompt tails. Do not activate a
    roadmap and do not repair any mismatch silently.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable nonempty `research-roadmap.yaml`, the
       V616 Markdown document, V615 evidence, the exclusion manifest, the
       reporting spec, and a writable artifact path. Explicitly prove the
       parser does not require `research-roadmap-next.yaml` at execution time.
       On failure write a terminal blocked artifact and put the failed check,
       expected value, and observed value in gate_check_summary.
    1. Add REQ-REPORT-7028 to the relevant capability spec and add RED tests
       before implementation. Cover a missing staging file with a readable
       active file, exactly 10 tasks, ordered IDs exp7028-exp7037, and an
       intentionally missing active file.
    2. Parse Markdown and active YAML independently. Do not derive expected and
       observed rows from one shared task object.
    3. Require exact task ID, title, deliverable, order, milestone, and gate
       parity. Require every gated_on producer to appear earlier in this YAML
       and to declare the exact bare top-level artifact field named by its gate.
    4. Require all four prior_failures sub-fields, no retired ID reuse, no
       retired upstream, no undocumented operator override, and an ungated
       capstone.
    5. Require verdict_class, field_principles, reproducibility fields,
       gate_check_summary, and per_unit_rows on every comparative task. Require
       every live-LLM task to name at least one mandated SOTA GGUF and forbid a
       legacy-small headline path.
    6. Require every planned inference_substrate to be one of the six legal
       CLAUDE.md values exactly. Do not widen an allowlist.
    7. Set v616_task_contract_conforms_score=1 only when all 10 contract rows
       agree. A mismatch is verdict_class disqualified; a missing execution
       prerequisite is verdict_class blocked; neither is partial.
    8. Run focused tests, YAML parsing, the exclusion-manifest pre-emit lint,
       artifact validation, adversarial verification, row-consistency lint,
       spec coverage, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (aggregation_from_upstream_artifacts); duration_s;
       source_artifact_hashes; rows; markdown_task_rows; yaml_task_rows;
       task_contract_rows; title_parity_rows; deliverable_parity_rows;
       gate_contract_rows; gate_producer_rows; prior_failure_rows;
       retired_id_rows; model_compliance_rows; substrate_compliance_rows;
       artifact_field_rows; prompt_tail_rows; command_receipt_rows;
       expected_task_count (10); observed_task_count; expected_id_order;
       observed_id_order; active_roadmap_path;
       staging_file_required_at_execution (false);
       v616_task_contract_conforms_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7028_v616_active_contract_preflight.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7029-v616-sota-scope-audit
  title: V616 post-marker source delta and experiment-scope audit
  track: research
  priority: high
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 60
  per_unit_rows: true
  milestone: 2026.09.616
  deliverable: results/experiment_7029_v616_sota_scope_audit.json
  prompt: |
    CONTEXT:
    The planning sweep selected environment-grounded auditing, selective
    verification allocation, verifier-grounded no-preference abstention, and
    asymmetric online-verifier costs. V616 must preserve a current source
    receipt without turning paper abstracts, citation counts, GitHub activity,
    Extropic estimates, or Kona product prose into implementation evidence.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md section "V616 Planner Refresh"
    - {project_root}/_bmad/architecture.md
    - {project_root}/results/experiment_7018_v615_sota_ingestion.json
    - {project_root}/results/experiment_7027_v615_capstone.json
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Recheck the requested primary and secondary sources against the frozen
    V616 planning marker. Append only genuinely new, primary-source-verified
    findings to research-references.md and classify every candidate as build,
    test, watch, duplicate, or reject. Audit that no source result silently
    broadens the 10-task V616 scope or reopens a retired technique.

    CONCRETE STEPS:
    0. PRECONDITIONS: require the V616 reference marker, readable V615/V616
       evidence, network access, and a writable artifact path. Record every
       blocked or rate-limited endpoint. If all requested source families are
       unavailable, write a terminal blocked verdict with gate_check_summary.
    1. Add REQ-REPORT-7029 and RED tests for marker handling, URL/date
       receipts, same-day uncertainty, rate limits, duplicate suppression,
       classification, and scope-expansion rejection.
    2. Search arXiv for 2025-2026 EBM reasoning, neural constraints, Ising,
       hallucination mitigation, KAN, energy-guided decoding, hardware
       sampling, and continual or online learning.
    3. Check OpenReview, Hugging Face Papers, Semantic Scholar citation routes
       for EBT 2507.02092 and ARM-EBM 2512.15605, GitHub discovery, Extropic
       writing, and Logical Intelligence. Record query, URL, date, and access
       outcome per source family.
    4. Open primary paper or first-party product pages before classification.
       A search snippet, citation count, benchmark table, or repository README
       alone cannot establish local readiness.
    5. Append only post-marker or previously missed findings. Keep same-day
       ordering uncertainty explicit. Do not modify the V616 task count,
       reorder tasks, or reopen pair-centered latent scoring, external text
       scorers, KAN compression, grammar, or generated-answer search.
    6. Set v616_sota_scope_complete_score=1 when every requested source family
       has a terminal row and every reference append has a verified source and
       an explicit scope disposition. A zero-delta sweep can be positive as a
       completed source audit, but it cannot claim a scientific improvement.
    7. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, spec coverage, and root-clutter checks.
    8. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (aggregation_from_upstream_artifacts); duration_s;
       source_artifact_hashes; source_query_rows; primary_source_rows;
       secondary_source_rows; semantic_scholar_rows; github_rows;
       extropic_rows; logical_intelligence_rows; post_marker_delta_rows;
       duplicate_rows; classification_rows; scope_audit_rows;
       reference_append_rows; rows;
       cutoff_rate_limit_and_same_day_uncertainty_receipts;
       v616_sota_scope_complete_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7029_v616_sota_scope_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7030-arc-gguf-model-identity-bridge
  title: ARC GGUF snapshot-to-blob model identity bridge
  track: arc-infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 150
  per_unit_rows: true
  milestone: 2026.09.616
  deliverable: results/experiment_7030_arc_gguf_model_identity_bridge.json
  prior_failures:
    - experiment_id: exp7025-belief-shadow-live-trace
      verdict: "blocked_belief_shadow_live_trace:live_trace_execution"
      addressed_by: "Exp7030 changes the provenance mechanism by carrying the requested snapshot .gguf identity and the server-observed resolved blob identity as separate hash-joined fields instead of forcing the blob basename through the .gguf filename validator."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7025 reached a healthy owned CUDA llama.cpp server and observed the
    expected cached Qwen model. The server exposed the resolved Hugging Face
    blob path, whose basename is a content hash without `.gguf`. The ARC
    provenance builder then raised `model_filename must be one GGUF filename`.
    The fix must preserve the strict requested `.gguf` receipt while recording
    the server's resolved path honestly. It must not accept arbitrary aliases.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_7025_belief_shadow_live_trace.json
    - {project_root}/results/experiment_7027_v615_capstone.json
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/python/carnot/agentic/arc_belief_shadow_live_trace.py
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/tests/python/test_arc_eval_provenance.py
    - {project_root}/tests/python/test_arc_belief_shadow_live_trace.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Implement one shared ARC model-identity receipt that distinguishes the
    requested Hugging Face snapshot `.gguf` path from the server-observed
    resolved blob path and joins them by exact content hash, hub ID, revision,
    and requested filename. Wire it into the canonical provenance builder and
    the live belief trace. Do not weaken existing malformed-provenance checks.

    CONCRETE STEPS:
    0. PRECONDITIONS: require the Exp7025 artifact, its named cached model path,
       the provenance and proposer modules, relevant specs/tests, and writable
       code/test/artifact paths. This task uses temporary GGUF-shaped files and
       symlinks; no physical GPU is required. On missing source evidence write
       a terminal blocked artifact with gate_check_summary.
    1. Add REQ-ARC-7030 and RED tests before implementation. Reproduce the
       exact snapshot-symlink to extensionless-blob topology from Exp7025.
    2. Extend the existing provenance schema rather than create a parallel
       receipt. Preserve requested_model_path, requested_model_filename,
       requested_hf_id, requested_revision, observed_server_model_path,
       resolved_model_path, and model_file_hash as distinct fields.
    3. Accept the server observation only when the requested path exists, its
       requested filename ends in `.gguf`, its resolved target equals the
       observed canonical path or both canonical files have the same content
       hash, and hub ID plus revision match the selected model spec.
    4. Reject wrong hash, wrong hub, wrong revision, missing requested file,
       broken symlink, directory path, misleading `.gguf` basename, and an
       observed blob not reachable from the selected snapshot. Never infer
       identity from basename or file size alone.
    5. Keep old complete provenance rows readable through an explicit schema
       version path. Do not rewrite historical artifacts.
    6. Wire the bridge into build_arc_eval_provenance and the belief shadow
       runner. Prove the canonical submitted path consumes the shared receipt.
    7. Set arc_model_identity_bridge_ready_score=1 only when the Exp7025-shaped
       positive fixture passes, every negative fixture fails closed, legacy
       valid rows remain readable, and the live runner uses the shared bridge.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, ARC floor lint, spec coverage, and applicable E2E
       checks from ops/e2e-test-plan.md.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (aggregation_from_upstream_artifacts); duration_s;
       source_artifact_hashes; rows; identity_schema_version;
       exp7025_reproduction_rows; requested_identity_rows;
       observed_identity_rows; hash_join_rows; hub_revision_rows;
       positive_fixture_rows; negative_fixture_rows; legacy_compatibility_rows;
       producer_wiring_rows; consumer_wiring_rows; command_receipt_rows;
       requested_model_path; requested_model_filename; requested_hf_id;
       requested_revision; observed_server_model_path; resolved_model_path;
       model_file_hash; arc_model_identity_bridge_ready_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7030_arc_gguf_model_identity_bridge.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7031-arc-model-identity-cold-audit
  title: Fresh-process ARC model identity and alias-confusion audit
  track: arc-infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 90
  per_unit_rows: true
  milestone: 2026.09.616
  deliverable: results/experiment_7031_arc_model_identity_cold_audit.json
  gated_on:
    - upstream: exp7030-arc-gguf-model-identity-bridge
      artifact_field: arc_model_identity_bridge_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp7025-belief-shadow-live-trace
      verdict: "blocked_belief_shadow_live_trace:live_trace_execution"
      addressed_by: "Exp7031 is a new independent fresh-process mutation audit of the hash-bound bridge shipped by Exp7030; it verifies the prior filename failure is fixed without accepting alias confusion."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7030 changes a security- and evidence-sensitive identity boundary. A
    unit test written beside the implementation is not sufficient evidence
    that the live provenance contract still rejects confused or stale model
    identities. This task independently audits the shared bridge from a fresh
    restricted process before any GPU run is allowed.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_7030_arc_gguf_model_identity_bridge.json
    - {project_root}/results/experiment_7025_belief_shadow_live_trace.json
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/python/carnot/agentic/arc_belief_shadow_live_trace.py
    - {project_root}/tests/python/test_arc_eval_provenance.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and run an independent mutation audit of the ARC model identity
    bridge. Use fresh-process fixtures not imported from Exp7030's test data.
    Confirm the valid snapshot-to-blob case passes and every identity-confusion
    case fails before a live model can receive credit.

    CONCRETE STEPS:
    0. PRECONDITIONS: require a clean readable Exp7030 artifact with
       arc_model_identity_bridge_ready_score=1, the exact source hashes it
       cites, importable shared code, and writable temporary/artifact paths.
       On failure write blocked_arc_model_identity_cold_audit with exact
       gate_check_summary. An upstream block is terminal, not partial.
    1. Add REQ-ARC-7031 and RED tests first. Generate fresh temporary snapshot,
       blob, symlink, hard-link, and content files independently of Exp7030.
    2. Recompute Exp7030's source and artifact hashes. Fail closed on drift.
    3. Test a valid requested `.gguf` symlink whose server observation is its
       extensionless resolved blob. Require the full receipt to round trip.
    4. Mutate one factor per row: content hash, repository, revision, requested
       filename, observed path, broken link, path type, stale server identity,
       same-size different bytes, and ambiguous hard link. Record exact reject
       reasons rather than only a count.
    5. Include a regression fixture for a direct non-symlink `.gguf` path and
       a legacy valid provenance row. Both must remain accepted.
    6. Run the audit in a fresh restricted process and prove the live belief
       consumer imports the audited shared validator rather than a local copy.
    7. Set arc_model_identity_audit_ready_score=1 only when all positive rows
       pass, all mutations fail closed, source hashes agree, and consumer
       reachability is proven.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, ARC floor lint, spec coverage, and root-clutter
       checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (aggregation_from_upstream_artifacts); duration_s;
       source_artifact_hashes; cited_upstream_artifacts; upstream_gate_rows;
       rows; positive_identity_rows; alias_mutation_rows; hash_mutation_rows;
       hub_revision_mutation_rows; path_type_rows; stale_server_rows;
       legacy_regression_rows; fresh_process_rows; consumer_reachability_rows;
       command_receipt_rows; arc_model_identity_audit_ready_score;
       random_seed; reproducibility_checksum; gate_check_summary with failed
       check, expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7031_arc_model_identity_cold_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7032-repaired-belief-shadow-live-trace
  title: Repaired provenance-complete live belief shadow trace
  track: arc-generalization
  priority: critical
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 210
  per_unit_rows: true
  milestone: 2026.09.616
  deliverable: results/experiment_7032_repaired_belief_shadow_live_trace.json
  gated_on:
    - upstream: exp7030-arc-gguf-model-identity-bridge
      artifact_field: arc_model_identity_bridge_ready_score
      op: ==
      value: 1
    - upstream: exp7031-arc-model-identity-cold-audit
      artifact_field: arc_model_identity_audit_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp7025-belief-shadow-live-trace
      verdict: "blocked_belief_shadow_live_trace:live_trace_execution"
      addressed_by: "Exp7032 reruns only the failed shadow cell after Exp7030 ships and Exp7031 independently audits the snapshot-to-blob identity bridge; all other V615 prerequisites remain frozen."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7025 passed every live compute and access precondition but failed before
    its first credited action because the server-reported blob path could not
    satisfy the requested `.gguf` filename schema. Exp7030 and Exp7031 repair
    and independently audit that boundary. This task reruns only the failed
    shadow cell. Belief may be queried and logged but must not change actions.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/scripts/experiment_template.py cached_sota_pair() pattern
    - {project_root}/results/experiment_7017_task_linked_compute_receipts.json
    - {project_root}/results/experiment_7024_belief_aware_e3_selector.json
    - {project_root}/results/experiment_7025_belief_shadow_live_trace.json
    - {project_root}/results/experiment_7030_arc_gguf_model_identity_bridge.json
    - {project_root}/results/experiment_7031_arc_model_identity_cold_audit.json
    - {project_root}/ops/arc_solve_registry.yaml
    - {project_root}/python/carnot/agentic/arc_belief_shadow_live_trace.py
    - {project_root}/python/carnot/agentic/arc_competition_agent.py
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md

    TASK:
    Run one bounded official-live ARC shadow trace through the canonical
    make_carnot_agent and E3AgentPolicy path using the repaired model identity
    receipt. Prove that belief query telemetry fires, action output remains
    identical to flag-off control, and every compute/provenance receipt is
    complete. Make no game-level solve claim.

    CONCRETE STEPS:
    0. PRECONDITIONS: before starting a model, require clean Exp7030 and
       Exp7031 artifacts and unchanged cited hashes; readable Exp7017/Exp7024;
       an eligible registry-prechecked live episode; official ARC access; an
       idle supported RTX 3090 with sufficient free VRAM; owned GPU and port
       leases; a CUDA llama.cpp server binary/library; writable result and
       checkpoint paths; and clean stop authority. On any failure write a
       terminal blocked artifact with gate_check_summary and do not fall back.
    1. Add REQ-ARC-7032 and RED tests before implementation. Cover identity
       propagation, flag-off/shadow action parity, query telemetry, cleanup,
       and a server path that resolves to an extensionless blob.
    2. MODEL_SPECS must resolve through cached_sota_pair() and include
       `unsloth/Qwen3.6-35B-A3B-GGUF` as the executed model. Record exact
       snapshot path, requested filename, hub ID, revision, hash, quantization,
       server command, PID, port, context, and GPU UUID. No AutoTokenizer and
       no legacy-small or CPU headline fallback are allowed.
    3. Start one owned server and verify observed CUDA layer offload and the
       observed server model through the shared identity bridge before acting.
    4. Freeze one eligible episode and a bounded action budget before opening
       outcomes. Run paired flag-off and belief-shadow decisions from the same
       pre-action states. Shadow mode may query but must return the flag-off
       action byte-for-byte.
    5. Record per-decision prompt hashes, belief evidence IDs, query result,
       base and shadow rankings, selected actions, observations, progress,
       model calls/tokens, phase timing, GPU samples, and cleanup.
    6. Registry-precheck before execution. If an incidental level completion
       occurs, record solve_provenance=live_agent_self_discovery and keep it
       outside the headline. Never inspect game source, offline BFS, or a
       per-game adapter.
    7. Set belief_shadow_trace_ready_score=1 only when identity, CUDA, live
       path, action parity, nonempty query telemetry, task-linked compute, and
       cleanup gates all pass. A second identity failure uses the exact prior
       verdict so retire_if_same_verdict can act.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, ARC floor lint, spec coverage, and the live-path
       E2E checks from ops/e2e-test-plan.md.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (live_llm_inference); duration_s;
       source_artifact_hashes; cited_upstream_artifacts; upstream_gate_rows;
       MODEL_SPECS; model_specs; models_used; requested_model_path;
       requested_model_filename; requested_hf_id; requested_revision;
       observed_server_model_path; resolved_model_path; model_file_hashes;
       quantization; tokenizer_receipt; no_autotokenizer_used (true);
       server_process_rows; port_lease_rows; gpu_lease_rows; gpu_sample_rows;
       cuda_layer_offload_confirmed (true); context_receipt_rows;
