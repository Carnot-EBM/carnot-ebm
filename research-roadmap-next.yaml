tasks:
  - id: exp1709-thrml-critical-fluctuation-retry
    title: "Exp 1709: THRML+Carnot near-critical sampler failure investigation (retry — .172 exp1698 was SKIPPED)"
    deliverable: results/experiment_1709_thrml_critical_fluctuation.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1698-thrml-critical-fluctuation-investigation
        verdict: skipped_pretest_failing_in_172
        addressed_by: "exp1698 (.172) was SKIPPED 3 retries between 01:33-01:42Z due to a transient pretest failure (2 failed/79 passed). Pretest now passes (81/81 verified 02:42Z). The original task scope is unchanged and still high-value (top MANDATORY THRML corrigendum per ops/known-issues.md). Re-launching with identical methodology + PRECONDITIONS block per the new CLAUDE.md Pre-Launch Preconditions Discipline."
        retire_if_same_verdict: false
      - experiment_id: exp1692-thrml-curie-weiss-ground-truth
        verdict: complete_gate_failed_both_samplers_miss_ground_truth_near_critical
        addressed_by: "exp1692 (.171) showed Carnot and THRML BOTH miss analytic Curie-Weiss ground truth at beta=1.05 and 1.20 by 0.11-0.24, but BOTH match at beta=1.50. This is the canonical symptom of inadequate symmetry-breaking burn-in. The 54-cell ablation in this task (burn-in × h-schedule × sampler × beta) is the right bisection."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: exp1698 (.172) was the original spec for this task; it was
      SKIPPED due to a transient pretest failure (now resolved). The full
      task spec is preserved in the .172 milestone YAML in git history
      (commit bd40545cc) and the deliverable was results/experiment_1698_
      thrml_critical_fluctuation.json with schema carnot.thrml_critical_
      fluctuation.v1.

      FALSIFIABLE HYPOTHESIS: The exp1692 ground-truth gap is caused by
      inadequate symmetry-breaking burn-in (NOT a fundamental sampler bug).
      Either (a) running with 50,000 burn-in steps closes the gap at
      beta=1.20, OR (b) running with h=1e-3 symmetry-breaking field closes
      the gap, OR (c) neither helps and the gap is a fundamental
      sampler limitation that affects Z1 hardware-mapping (paper-v6 §6
      disclosure).

      EXISTING CODE TO READ FIRST:
        - results/experiment_1692_thrml_curie_weiss_ground_truth.json
        - results/experiment_1686_thrml_bias_fix.json
        - python/carnot/samplers/parallel_ising.py
        - The exp1698 spec in git: `git show bd40545cc:research-roadmap-next.yaml`
          contains the full original CONCRETE STEPS.

      TASK: Run a 3x3x2 ablation (burn-in × h_schedule × sampler) at 3 beta
      points = 54 sampler runs at 10k samples each, comparing empirical
      magnetization vs analytic Curie-Weiss ground truth.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step, per CLAUDE.md
           Pre-Launch Preconditions Discipline):
           a. `python -c "import thrml; print(thrml.__version__)"` succeeds
              — if not, emit `blocked_thrml_not_installed` and exit.
           b. `python -c "from python.carnot.samplers.parallel_ising import
              corrected_magnetization_mean"` succeeds (exp1686 bias correction
              shipped) — if not, emit `blocked_parallel_ising_correction_missing`
              and exit.
           c. `python -c "import scipy.optimize"` succeeds — if not, emit
              `blocked_scipy_missing`.
           Record preconditions_checked in artifact.
        1-7. Per the original exp1698 spec (54-cell ablation; 10k samples
           per cell; report empirical mean vs ground truth; identify
           smallest gap-closing intervention or declare fundamental limit).

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.thrml_critical_fluctuation.v1"
        - experiment: 1709
        - run_date: ISO-8601 UTC
        - duration_s: actual wall time (MUST be > 300s for 54 cells * 10k
          samples; if completes faster, the ablation grid was likely
          short-circuited — disclose honestly)
        - random_seed: 171509 (NOT 1709 or 128 — avoid TAUTOLOGY)
        - reproducibility_checksum: sha256 of (substrate params + ablation
          grid spec + sampler library versions + git_rev)
        - preconditions_checked: list of {resource, available, check_command}
        - model_specs: {n_spins: 128, J: "1/127 all-to-all Curie-Weiss",
          beta_points: [1.05, 1.20, 1.50], burn_in_grid: [500, 5000, 50000],
          h_schedule_grid: 3, n_samples_per_cell: 10000, ablation_cells: 54}
        - n_samples: 540000
        - n_samples_justification: "10k per cell × 54 cells. See exp1698
          spec for full rationale."
        - analytic_ground_truth_mean: dict beta -> m_star (must match
          exp1692 values within 0.001: 0.685/0.829/0.929)
        - ablation_results: list of {sampler, beta, burn_in, h_schedule,
          empirical_mean, delta_m}
        - smallest_intervention_closing_gap: dict beta -> intervention or null
        - bimodal_distribution_observed: dict beta -> bool
        - acceptance_gate_passed: true (measurement task; gate is
          completion of all 54 cells with reported delta_m)
        - acceptance_gate_criteria: "54-cell ablation completed; each cell
          reports empirical mean + delta_m vs ground truth."
        - methodology_note: "Low-beta empirical_mean near 0.5 is the
          symmetric-phase behavior, not a fabrication. Record histogram
          shape to distinguish bimodal-symmetry-breaking-failure from
          unimodal-disorder."
        - optimization_direction: "minimize_delta_m_subject_to_ablation_completion"
        - honest_verdict: MUST start with terminal prefix (`complete:` etc.)
          per CLAUDE.md Verdict Terminal-Prefix Discipline.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

