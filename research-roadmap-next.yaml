    Today's date: {date}.

    CONTEXT: The verification cascade has 8 tiers (0a-0h, 1, 2, 2.1, 2.5, 2.6, 2.7, 3, 3.5).
    arXiv 2508.14496 ("Semantic Energy: Detecting LLM Hallucination Beyond Entropy") proposes
    a Boltzmann-inspired pairwise semantic energy over sentence clusters — sentences that are
    semantically coherent have low energy; incoherent/hallucinated sentences have high energy.
    This is orthogonal to all existing tiers (logit-based: 0b; latent-space: 0c, 0d; thermodynamic:
    0e; symbolic: 2.5, 2.7). Adding it as Tier 0f provides a diverse advisory signal.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline cascade tier structure
    - python/carnot/pipeline/extract.py — how existing tiers are wired (SpilledEnergyDetector,
      HalluField, etc.)
    - openspec/capabilities/pipeline/spec.md — REQ-VERIFY entries for existing tiers
    - _bmad/architecture.md — Tier 0e HalluField advisory pattern (model for Tier 0f)

    TASK: Implement SemanticEnergyProbe (Tier 0f) and wire as advisory signal.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read _bmad/architecture.md Tier 0e HalluField section to understand the advisory
       signal pattern: returns is_unstable flag, recorded in certificate, NO short-circuit.
    3. Implement python/carnot/pipeline/semantic_energy_probe.py:

       @dataclass
       class SemanticEnergyResult:
           energy: float           # Boltzmann-inspired pairwise semantic energy
           is_unstable: bool       # True if energy > threshold (high = incoherent)
           sentence_count: int     # Number of declarative sentences extracted
           cluster_entropy: float  # Entropy of sentence similarity distribution
           threshold: float        # The decision threshold used

       class SemanticEnergyProbe:
           """
           Tier 0f advisory probe: detects semantic incoherence via pairwise energy.

           Why this works: hallucinated sentences tend to be semantically distant from
           each other and from the question. Coherent correct responses form a tight
           semantic cluster. We compute pairwise semantic energy between sentences using
           a Boltzmann-inspired formula: E = -sum_ij exp(-||e_i - e_j||^2 / sigma^2)
           where sigma is a bandwidth parameter. Negative sign: coherent clusters have
           low (negative) energy; incoherent responses have near-zero energy (pairs are
           far apart, exponential terms → 0).
           """
           def __init__(self, sigma: float = 1.0, threshold: float = -0.5,
                        embedding_dim: int = 64):
               ...

           def score(self, response: str) -> SemanticEnergyResult:
               """
               Compute semantic energy of the response.
               1. Extract declarative sentences (split on '. ' and '? ').
               2. Embed each sentence: use simple TF-IDF vectors (no GPU needed)
                  truncated to embedding_dim dimensions via random projection.
               3. L2-normalize embeddings.
               4. Compute pairwise Gaussian kernel: k_ij = exp(-||e_i-e_j||^2 / sigma^2).
               5. Energy = -mean_over_pairs(k_ij) (excluding diagonal).
                  More coherent → higher kernel values → more negative energy.
               6. is_unstable = (energy > threshold).
               7. cluster_entropy: entropy of the row-normalized kernel matrix.
               """
               ...

    4. Wire as Tier 0f in VerifyRepairPipeline:
       After Tier 0e (HalluField), before Tier 0h (JailbreakDetection).
       Call semantic_probe.score(response). Add is_unstable to VerificationCertificate.
       No short-circuit (advisory signal only, like Tier 0e).
    5. Benchmark on 50 synthetic pairs (CPU):
       a. 25 "correct" responses: factual, internally consistent sentences on a topic.
       b. 25 "hallucinated" responses: mix of correct and contradictory sentences.
          Construct by inserting one sentence that contradicts the others.
       c. Compute AUC (AUROC) of energy score for hallucinated vs correct classification.
       d. Target: AUC_synthetic > 0.70.
    6. Add to openspec/capabilities/pipeline/spec.md:
       REQ-VERIFY-155: SemanticEnergyProbe MUST compute pairwise Boltzmann semantic energy
         over sentence clusters. High energy (> threshold) → is_unstable=True in certificate.
       SCENARIO-VERIFY-180: Correct coherent response; semantic energy < threshold; is_unstable=False.
       SCENARIO-VERIFY-181: Hallucinated response with contradictory sentence; energy > threshold;
         is_unstable=True.
    7. honest_verdict:
       - "probe_viable" if AUC_synthetic > 0.70
       - "probe_marginal" if 0.60 <= AUC_synthetic <= 0.70
       - "probe_below_threshold" if AUC_synthetic < 0.60
    8. Write tests/python/test_semantic_energy_probe.py with 100% coverage.
       Include: test_coherent_response_low_energy, test_hallucinated_response_high_energy,
       test_single_sentence_returns_zero_energy, test_l2_normalization_applied,
       test_tier0f_wired_in_pipeline, test_advisory_no_short_circuit.
       Traces to REQ-VERIFY-155, SCENARIO-VERIFY-180, SCENARIO-VERIFY-181.
