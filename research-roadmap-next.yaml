milestone: 2026.06.428
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-23). .427 CROSSED the offline->live bridge for the FIRST time
  (capstone `bridge_crossed_live_efficiency_up_1`): A2's self-supervised CNN action-effect/frame-change predictor
  (the StochasticGoose leaderboard-leader steal) raised live first-win-rate 0.407->0.591 (+0.18) and halved
  median actions-to-first-levelup (2->1, efficiency-term 1.0), solve-rate preserved, live-path-reachable, parity
  green, and TRANSFERRED (A5: cd82 first-win +0.5). A1's dense curiosity loop NULLED on solve-rate a THIRD
  consecutive time (0.04==0.04) but raised +2 coverage. A3 banked ls20 L2 (55->56). So the decisive, now
  triply-confirmed lesson is settled: GENERATION levers (the action-effect predictor) cross the live bridge;
  RERANKING levers (value heads, curiosity-for-solve-rate) do not -- the wall is make-a-winner-appear, not
  select-the-winner. The REMAINING wall: the agent reaches the FIRST level-up at 0.59 live but LIVE SOLVE-RATE
  (>=2 levels) is still 0.04, and the live submission is 33 vs 56 offline. .428 takes the operator's EXPLICIT
  cheapest-first generation lever that has been UNWIRED for three milestones (memory project_arc_energy_config_space,
  2026-06-22: "work energy judgement into the live agent ... energy DRIVES generation"): A1 (HEADLINE) wires
  exp4020's graded is_goal (held-out precision 1.0) as a LIVE goal-ENERGY heuristic in graph_explore_solve_v2
  (a convex combination with arc_goal_distance; emit a plan only when the predicate fires) -- the per-game energy
  well the rollout descends, oracle-distinct, on top of the .427-proven action-effect predictor, closing
  GAP-ARCH-GOAL-NOT-VERIFIED and instantiating "the energy function is ground truth" as the LIVE generation
  driver; A2 deepens the .427 winner from a candidate RANKER to a search EXPANSION PRIOR (SOTA-D #3
  clickability_action_effect_expansion_prior, arXiv:2601.10904+2603.24621) to convert the +0.18 first-win into a
  deeper live solve. Both on the SCORED E3AgentPolicy vs matched controls + a uniform-energy ablation control,
  both live-path-reachable (arc_orphan_solver_lint), both verifier_is_oracle: false. A3 banks +1 via self-play
  (rotate to a clean game NOT deepened in .422-.427; 56->57+). Package operator-resubmit-ready above 33 (A4).
  Submission stays operator-only. ARC Prize Milestone #1 deadline is 2026-06-30 (7 days).
milestone_title: 'ENERGY DRIVES GENERATION -- .427 crossed the offline->live bridge on EFFICIENCY via a GENERATION lever (the action-effect predictor: first-win 0.407->0.591, actions 2->1), confirming a THIRD time that generation levers cross and rerankers do not (the wall is make-a-winner-appear, not select). .428 takes the operator''s explicit cheapest-first energy lever, unwired for three milestones: A1 (HEADLINE) wires exp4020''s graded is_goal (precision 1.0) as a LIVE goal-ENERGY heuristic in graph_explore_solve_v2 (the per-game well the rollout descends; oracle-distinct; closes GAP-ARCH-GOAL-NOT-VERIFIED; energy IS ground truth as the live generation driver) on top of the proven action-effect predictor; A2 deepens that predictor from a candidate RANKER to a search EXPANSION PRIOR (SOTA-D #3) to convert the +0.18 first-win into a deeper live solve. Both on the SCORED agent vs matched controls + a uniform-energy ablation, both live-path-reachable, both verifier_is_oracle: false. A3 banks +1 (56->57+); package operator-resubmit-ready above 33 (A4). Plus self-learning persist+transfer (A5), SUBMITTED_AGENT_CONFIG integration (A6), 2 infra (B1 live_multi_level_solve_rate co-headline metric / B2 GOAL-ENERGY-WITHOUT-ABLATION guard), 1 hardware (C), 1 SOTA-ingestion (D), capstone (E). 7 days to the ARC Prize Milestone #1 deadline (2026-06-30).'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  .427 PROVED it: a GENERATION lever (the self-supervised action-effect/frame-change predictor) crossed the
  offline->live bridge -- live first-win-rate 0.407->0.591, median actions-to-first-levelup 2->1 -- while a THIRD
  reranking lever (the dense curiosity loop) nulled on solve-rate. The wall is make-a-winner-appear, not select.
  The remaining wall: first-win is 0.59 live but multi-level SOLVE-RATE is 0.04, and the live submission is 33 vs
  56 offline. .428 PUSHES GENERATION with the operator's explicit cheapest-first energy lever, unwired for three
  milestones (energy DRIVES generation, project_arc_energy_config_space). A1 (HEADLINE; closes
  GAP-ARCH-GOAL-NOT-VERIFIED) wires exp4020's graded is_goal (held-out precision 1.0) as a LIVE goal-ENERGY term
  in the graph_explore_solve_v2 search heuristic -- a convex combination with arc_goal_distance, emit a plan only
  when the predicate fires -- the per-game energy well the rollout descends, oracle-distinct (predicts win from
  visible state, never reads the env counter), on top of the .427-proven action-effect predictor; it instantiates
  "the energy function is ground truth" as the LIVE generation driver on the SCORED E3AgentPolicy. A2 deepens the
  .427 winner from a candidate RANKER to a search EXPANSION PRIOR (SOTA-D #3 clickability_action_effect_expansion_prior,
  arXiv:2601.10904+2603.24621) -- predicted frame-change prioritizes which BRANCHES the best-first search expands,
  directing generation toward effective action SEQUENCES -- to convert the +0.18 first-win into a deeper live solve
  (a 2nd live level-up). Both measured on the SCORED agent vs matched controls + a uniform-energy ablation control,
  both live-path-reachable (arc_orphan_solver_lint), both verifier_is_oracle: false (oracle-distinct generation
  signals, north-star §5). CAPABILITY (A3): self-play banks +1 NEW reproducible level (rotate to a clean game NOT
  deepened in .422-.427; 56->57+) + trains the learned verifier. SCORE (A4): keep the package operator-resubmit-ready
  (beat 33). Plus self-learning persist+transfer (A5), integration into SUBMITTED_AGENT_CONFIG (A6), 2 infra (B1
  live_multi_level_solve_rate co-headline metric / B2 adversarial_verify hardening = GOAL-ENERGY-WITHOUT-ABLATION
  overclaim guard), 1 hardware (C), 1 SOTA-ingestion (D), capstone (E). verifier_is_oracle: false on every value
  claim. Submission stays operator-only. 7 days to the ARC Prize Milestone #1 deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC; >=1 level-up
  attempt that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A3); 2 reserved infra (B1/B2); 1
  per-board hardware (C); 1 SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus.
  7 days to the ARC Prize Milestone #1 deadline ($25K). The frozen live generator is Qwen3.5-9B-MTP on the iGPU
  (NEVER the 3090s); any LLM arm declares live_llm_inference for that arm only."

