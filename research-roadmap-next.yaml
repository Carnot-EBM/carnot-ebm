  - id: exp6264-energy-familiarity-memory-gate
    milestone: "2026.08.540"
    deliverable: results/experiment_6264_energy_familiarity_memory_gate.json
    title: "Gated on Exp6263 clean replay: task-conditional energy-familiarity memory admission"
    priority: critical
    track: continuous_learning
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 90
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6263-clean-sota-event-replay-bridge
    gated_on:
      - upstream: exp6263-clean-sota-event-replay-bridge
        artifact_field: event_replay_bridge_ready_score
        op: '=='
        value: 1
    prior_failures:
      - experiment_id: exp6206-live-strategy-seed-v2
        verdict: "blocked_gate_check_failed: the live strategy seed depended on retired generated-answer transport readiness"
        addressed_by: "The new mechanism uses exact cached events and task-conditional energy familiarity to gate advice; it does not generate strategy text or depend on the retired answer-transport chain."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Energy-Based Transfer for Reinforcement Learning uses EBM energy as a familiarity proxy and withholds advice in likely OOD states. Carnot needs the analogous control for constraint memory: remembered advice may help familiar tasks and harm shifted ones. Exp6263 provides a sealed offline stream, so this experiment measures the mechanism without claiming on-policy density.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md V540 Energy-Based Transfer entry
      - {project_root}/results/experiment_6263_clean_sota_event_replay_bridge.json
      - {project_root}/python/carnot/experiment_6219_two_timescale_constraint_csl.py
      - {project_root}/python/carnot/learn/constraint_memory.py
      - {project_root}/python/carnot/pipeline/verifier_memory.py
      - {project_root}/openspec/capabilities/self-learning/spec.md

      TASK
      Implement and evaluate task-conditional energy-familiarity admission on the sealed chronological prefix. Compare no memory, unconditional advice, a single global threshold, and task-conditional thresholds. Tune only on training data. Measure familiar coverage, shifted-family unsafe advice, calibration, abstention, utility, and negative transfer on held partitions. Include an inactive-gate control and an OOD positive control. Do not load an LLM or mutate weights.

      Required deliverable: {project_root}/results/experiment_6264_energy_familiarity_memory_gate.json.
      REQUIRED ARTIFACT FIELDS: status, upstream_bridge_path_and_hash, source_model_provenance, chronological_split_hashes, energy_definition_and_direction, no_memory_unconditional_global_and_task_conditional_arm_configs, threshold_fit_partition_and_receipts, treatment_fire_counts, known_family_coverage_by_arm, shifted_family_unsafe_advice_by_arm, abstention_by_arm, calibration_by_arm, exact_utility_by_arm, negative_transfer_by_arm, paired_intervals_and_sample_sizes, inactive_gate_control, ood_positive_control, off_policy_limitation, source_mutation_count, weight_mutation_count, familiarity_gate_ready_score, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. source_mutation_count and weight_mutation_count must be bare 0. familiarity_gate_ready_score must require nondegenerate treatment fire and lower unsafe shifted-family advice than unconditional memory without a preregistered known-family regression.

      CONCRETE STEPS
      0. PRECONDITIONS: verify the exact bridge hash, partition non-overlap, sample sizes, energy direction, and protected hashes.
      1. Add REQ-LEARN-6264 and scenarios before implementation and update traceability.
      2. Implement a small reusable familiarity gate over existing exact energy fields. Do not add a learned LLM judge or refit held partitions.
      3. Freeze thresholds from the training prefix. Evaluate known, shifted, and quarantined strata separately; quarantined rows cannot enter headline metrics.
      4. Run the four matched arms with identical event order and decision snapshots. Prove each treatment fires where expected.
      5. Compute paired intervals with reported n, unsafe-advice counts, calibration, abstention, and negative transfer. State the offline and off-policy limits.
      6. Add tests for energy-sign reversal, empty task strata, unseen tasks, inactive thresholds, poisoned events, and deterministic replay.
      7. Run focused tests and applicable e2e checks, record git status after tests, update spec/ops evidence, and adversarial-verify the artifact.

      Run command: .venv/bin/python -m carnot.experiment_6264_energy_familiarity_memory_gate --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6265-chronological-two-timescale-csl-ab
    milestone: "2026.08.540"
    deliverable: results/experiment_6265_chronological_two_timescale_csl_ab.json
    title: "Gated on Exp6264 familiarity: chronological two-timescale continuous self-learning A/B"
    priority: critical
    track: continuous_learning
    continuous_self_learning_task: true
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6264-energy-familiarity-memory-gate
    gated_on:
      - upstream: exp6264-energy-familiarity-memory-gate
        artifact_field: familiarity_gate_ready_score
        op: '=='
        value: 1
    prior_failures:
      - experiment_id: exp6235-prospective-two-timescale-live-csl
        verdict: "missing: exact deliverable absent because the fresh flagship stream prerequisite did not become ready"
        addressed_by: "This run uses the clean Exp6263 immutable SOTA replay bridge, the active Exp6264 familiarity gate, and the already-shipped Exp6219 transactional two-timescale mechanism; it has no fresh-generation prerequisite."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6219 proved safe immediate post-outcome and slow block-end constraint memory on a deterministic exact stream. V539 never extended it to flagship events. Exp6263 now supplies clean immutable SOTA rows, and Exp6264 supplies an active task-conditional familiarity gate. This is the milestone's required continuous self-learning experiment.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md continuous-learning rules
      - {project_root}/research-program.md Continuous Self-Learning section
      - {project_root}/results/experiment_6219_two_timescale_constraint_csl.json
      - {project_root}/python/carnot/experiment_6219_two_timescale_constraint_csl.py and tests
      - {project_root}/results/experiment_6263_clean_sota_event_replay_bridge.json
      - {project_root}/results/experiment_6264_energy_familiarity_memory_gate.json
      - {project_root}/python/carnot/learn/constraint_memory.py
      - {project_root}/openspec/capabilities/self-learning/spec.md

      TASK
