milestone: 2026.06.409
milestone_title: >-
  ACCELERATE the GENERIC ARC-AGI-3 SOLVER pipeline toward live submission: turn the validated
  config-rule inducer + first-contact solver + glyph perception into MULTI-LEVEL, UNSEEN-GAME
  reproducible progress (monotonically grow reproducible_total_levels above 34). Operator
  direction 2026-06-19: offload the pipeline work to the CODEX conductor loop (Claude quota
  conserve -- 26% weekly used since 06-18 noon); EVERY experiment agent_type=codex/gpt-5.5; the
  Claude planner is SKIPPED via this pre-staged roadmap. The live generator is now Qwen3.5-9B-MTP
  ([[project_arc_live_generator]]); the Kaggle CUDA-12.8 binary build is in flight. Each ARC SOLVE
  task targets +1..+n NEW reproducible levels on ONE game (ARC-AGI-3 Incremental-Progress Scoping),
  reproduction-gated (arc_solver_kit.reproduce -> only reproduced levels count), and feeds reusable
  scaffolding back into arc_solver_kit + ops/arc_solve_registry.yaml so the LIVE solver applies it to
  games it has never seen. paper_ready=True (FoVer 0.9131, G1-G4) is the FROZEN headline.
milestone_overview: |
  .408 pivoted to verifier-grounded config-rule induction; .409 ACCELERATES the generic pipeline so
  every milestone monotonically adds reproducible levels the live (unseen-game) solver can use.
  ALL experiments run on CODEX (operator quota-conserve 2026-06-19). Reserved: 2 infra slots, 1 per
  attached FPGA board (Hardware-Task Continuity), 1 SOTA-ingestion slot.

    PHASE 0 -- TRANSITION: exp4420 archive .408 -> activate .409; record the TRUE close-state.

    PHASE A -- GENERIC SOLVER, MULTI-LEVEL, UNSEEN-GAME (operator MANDATORY; the acceleration core):
      A1 (exp4421) first-contact CONFIG-RULE SOLVE on UNSEEN games. A2 (exp4422) GLYPH-substitution
      rewrite perception. A3 (exp4423) generic first-contact solver breadth + transfer-routing.
      A4 (exp4424) DEEPER: +1 level on an already-solved game (multi-level).
    PHASE B -- TRANSFER: exp4425 config-rule VOCABULARY from solved games -> held-out games.
    PHASE C -- RESERVED INFRA (2 slots): exp4426 + exp4427.
    PHASE D -- HARDWARE CONTINUITY (1 per attached board): exp4428.
    PHASE E -- SOTA-INGESTION (.409 bleeding-edge track): exp4429.
    PHASE F -- CAPSTONE: exp4430.

tasks:
  - id: exp4420-archive-408-activate-409
    milestone: 2026.06.409
    title: "PHASE 0 (TRANSITION) -- archive .408 -> activate .409; assert YAML parses + smart-subset pre-test gate green; RECORD the TRUE .408 close-state."
    priority: critical
    track: infra
    max_turns: 60
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing): routine milestone-transition task -- false-positive scope-match vs prior archive-v* tasks; mechanical archive+activate, never a doomed rerun."
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4420_archive_408_activate_409.json
    prompt: |
      Archive .408 into research-complete.yaml and activate .409. Assert research-complete.yaml +
      ops/exclusion_manifest.yaml parse under yaml.safe_load; run the smart-subset pre-test gate green.
      RECORD the TRUE .408 close-state truthfully from the .408 capstone (config-rule SOLVE outcome,
      reproducible_total_levels, any new levels, Agent2World adaptive-repair outcome, the hidden-state
      localizer falsification verdict, GAP-4-with-local-generator, config-rule-vocabulary transfer,
      SteerConf calibration). SKIP any flagged_adversarial artifact; HONOR verifier_is_oracle (a
      circular/execution-grounded ARC solve is NOT a moat). REQUIRED ARTIFACT FIELDS:
        honest_verdict: {principle: "terminal-prefixed self-declared state lets the reconciler classify without re-running"}
      honest_verdict MUST start with complete:/complete_/success:/success_/passed:/passed_/shipped:/shipped_.
      verifier_is_oracle=true (execution-grounded). NO TRM training; NO leaderboard submission.

  - id: exp4421-config-rule-solve-unseen
    milestone: 2026.06.409
    title: "PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY) -- first-contact CONFIG-RULE SOLVE on UNSEEN config games (+1 reproducible level), verifier_is_oracle=true."
    priority: critical
    track: arc-north-star
    max_turns: 120
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-19 operator direction: accelerate the generic config-rule solver toward live submission; reuse the validated scaffolded inducer; versioned continuation with a STATED forward difference (Qwen3.5-9B-MTP generator + glyph/structured digest) over .408 exp4414."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4421_config_rule_solve_unseen.json
    prior_failures:
      - experiment_id: exp4414
        verdict: config-rule-grounded-but-no-new-reproducible-level
        addressed_by: "This attempt drives the GROUNDED predicate as the OfflineSolver verifier to reach +1 REAL reproducible level (arc_solver_kit.reproduce), not just grounding; uses the stronger Qwen3.5-9B-MTP generator + the structured (values+counts, component) digest validated 2026-06-18."
        retire_if_same_verdict: true
    prompt: |
      GOAL: take ONE UNSEEN config/toggle game (bp35/dc22/g50t/lf52/s5i5/cd82/wa30) from 0 -> +1
      reproducible level via verifier-grounded win-RULE induction. PRECONDITIONS (check first; on any
      miss write honest_verdict blocked_<resource> and STOP, no fabrication): the live generator GGUF is
      cached (ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-MTP-GGUF/), the iGPU llama-server
      binary exists (build-hip), the offline arc env loads the target game.
      METHOD: reuse scripts/experiments/arc3_config_layerb_scaffolded.py (object-centric structured digest
      -> generator proposes is_win -> verifier GROUNDS it on win/non-win configs). Generator =
      Qwen3.5-9B-MTP on the iGPU (NEVER the 3090s) with /no_think + n_predict>=2048; fall back to
      gemma-4-12B if uncached. Wire the GROUNDED predicate as the solver's win-check to drive +1 level;
      run arc_solver_kit.reproduce on the OFFLINE env -- ONLY reproduced levels count. Persist the
      win-condition + solver to ops/arc_solve_registry.yaml; add any new general gotcha to arc_solver_kit.
      REQUIRED ARTIFACT FIELDS:
        offline_reproduced: {type: bool, principle: "a solve not reproducible offline is wasted effort; only reproduced levels count toward total_levels"}
        reproduced_levels: {type: int, principle: "monotonic ARC progress is the milestone metric"}
        verifier_is_oracle: {type: bool, principle: "true=execution-grounded (the win-check IS the oracle); a circular win is NOT a learned-verifier moat"}
        missing_verifier_gaps: {principle: "unselectable residual failures are the verifier-build backlog (ops/verifier_gaps.md)"}
        random_seed: {principle: "determinism precondition for third-party reproduction"}
        reproducibility_checksum: {principle: "content hash catches silent corpus/model drift"}
        honest_verdict: {principle: "terminal-prefixed self-declared state"}
      honest_verdict MUST start with a terminal prefix. ACCEPTANCE GATE: >=1 NEW level offline_reproduced=true
      beyond the prior best for that game (principle: incremental monotonic progress; a grounded-but-0-new
      attempt with the SAME verdict retires this scope). verifier_is_oracle=true.

  - id: exp4422-glyph-rewrite-perception
    milestone: 2026.06.409
    title: "PHASE A2 (ARC NORTH STAR) -- from-PIXELS glyph-substitution perception to SOLVE a rewrite-class game (+1 level); the tr87 class the count digest cannot reach."
    priority: high
    track: arc-north-star
    max_turns: 120
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-18 operator Layer-B direction (the glyph-rewrite class is the remaining config sub-class); versioned continuation of the proven glyph-segmentation primitive with a STATED forward difference (tolerant glyph classifier + target-region localization + the greedy sequence-rewrite engine)."
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4422_glyph_rewrite_perception.json
    prior_failures:
      - experiment_id: arc3_config_layerb_glyph_tr87
        verdict: complete_glyph_pixel_decode_partial_not_grounded
        addressed_by: "Segmentation + rule-prototype decode are solved; this adds the 3 remaining steps named in docs/research-notes/arc-config-layerb-scaffolded-2026-06-18.md: a tolerant (Hamming/learned) glyph-value classifier, target-region localization, and the greedy multi-glyph sequence-rewrite check -> a from-pixels is_win that GROUNDS, then drives +1 reproducible level."
        retire_if_same_verdict: true
    prompt: |
      Build the from-PIXELS glyph-substitution win-verifier for tr87 (and any rewrite-class config game):
      reuse the proven segment_glyphs primitive (scripts/experiments/arc3_config_layerb_glyph_tr87.py),
      add (1) a TOLERANT glyph-value matcher (Hamming-nearest or a tiny learned 7-way classifier; exact
      bitmap over-splits across regions), (2) target-region localization, (3) the greedy multi-glyph
      sequence-rewrite check. GROUND it (fires on the banked win, not non-wins), then drive +1 reproducible
      level via arc_solver_kit.reproduce. PRECONDITIONS: offline tr87 env loads; no LLM needed (pure
      perception). REQUIRED ARTIFACT FIELDS: offline_reproduced (bool; principle: only reproduced levels
      count), reproduced_levels (int), verifier_is_oracle (bool; principle: execution-grounded glyph check),
      honest_verdict (terminal-prefixed). ACCEPTANCE GATE: the from-pixels verifier GROUNDS (fires_on_win,
      0 FP) AND drives >=1 new reproducible level; same partial verdict retires the scope. verifier_is_oracle=true.

  - id: exp4423-generic-first-contact-breadth
    milestone: 2026.06.409
    title: "PHASE A3 (ARC NORTH STAR) -- generic FIRST-CONTACT solver breadth + transfer-routing across UNSEEN games (+1 new game), the live-solver capability."
    priority: high
    track: arc-north-star
    max_turns: 120
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-19 operator direction: the generic solver for UNSEEN games is the live-submission asset; versioned continuation of arc_loop_solve.py + the first-contact pipeline with a STATED forward difference (transfer-routing recommend_approach + the new config/glyph verifiers wired in)."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4423_generic_first_contact_breadth.json
    prompt: |
      Run the STANDING generic solve loop (.venv/bin/python scripts/arc_loop_solve.py --auto, OR
      --game <target>) across the UNSEEN / FAIL_EXPLORATION game set, FIRST calling
      arc_solve_learning.recommend_approach(game) to route each new game to the closest SOLVED game's
      recipe (reverse-engineer only the DELTA). Target +1 reproducible level on >=1 game NOT in the
      current registry, via verifier-routed best-first search over the offline env. Wire the .409 config
      (exp4421) + glyph (exp4422) verifiers in as routing options. Record DEAD-ENDS in the registry so the
      next attempt skips them. PRECONDITIONS: offline arc env + arc_solver_kit import. REQUIRED ARTIFACT
      FIELDS: offline_reproduced (bool), reproduced_levels (int), missing_verifier_gaps (the
      unselectable-failure backlog), verifier_is_oracle (bool), honest_verdict (terminal-prefixed).
      ACCEPTANCE GATE: +1 reproducible level on a NEW game OR a routed-and-flagged delta with the precise
      missing-verifier gap logged (honest partial = progress per Incremental-Progress Scoping).

  - id: exp4424-deeper-solved-game
    milestone: 2026.06.409
    title: "PHASE A4 (ARC NORTH STAR; MULTI-LEVEL) -- take an ALREADY-SOLVED game +1 deeper level (incremental, monotonic), per-mechanic executable unit tests on the lookahead blocker."
    priority: high
    track: arc-north-star
    max_turns: 120
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-19 operator direction: multi-level deepening is part of the acceleration; versioned continuation with a STATED forward difference (per-mechanic unit-test-driven engine repair on the specific mismatched transition, not aggregate fidelity)."
    inference_substrate: aggregation_from_upstream_artifacts
    deliverable: results/experiment_4424_deeper_solved_game.json
    prompt: |
      Pick ONE solved game with deep-level headroom (lp85 L6 / tu93 L5 / tn36 L8 / sc25 next) at its prior
      reproduced best per ops/arc_solve_registry.yaml. DECOMPOSE the lookahead-fidelity blocker into
      per-mechanic EXECUTABLE UNIT TESTS: run the world-model K-step rollout vs the env, identify the
      SPECIFIC mismatched transition(s), write an executable test asserting the correct transition, FIX the
      engine to pass it (targeted intervention), THEN re-check fidelity + plan +1 deeper level. Report
      per-mechanic test pass/fail SEPARATELY from the solve claim. REQUIRED ARTIFACT FIELDS:
      offline_reproduced (bool), reproduced_levels (int), verifier_is_oracle (bool; execution-grounded),
      honest_verdict (terminal-prefixed). ACCEPTANCE GATE: +1 deeper reproducible level beyond the prior
      best (arc_solver_kit.reproduce); an honest partial = the now-passing per-mechanic tests + the residual
      failing-mechanic test as the gap class.

  - id: exp4425-config-rule-vocabulary-transfer
    milestone: 2026.06.409
    title: "PHASE B (TRANSFER) -- config-rule VOCABULARY from solved games raises the grounding rate on HELD-OUT config games (the operator's 'derive config-rules from previously-seen games'), verifier_is_oracle=false."
    priority: high
    track: arc-self-learning
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-18 operator Layer-B direction ('derive config-rules from previously-seen games'); continuation of .408 exp4418 with a STATED forward difference (measure HELD-OUT grounding-rate lift with the Qwen3.5-9B-MTP generator across seeds, not single-shot)."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4425_config_rule_vocabulary_transfer.json
    prompt: |
      Build a VOCABULARY of relational win-rule primitives from the SOLVED config games (e.g.
      editable_count==reference_count, match-reference, progress-fill, glyph-rewrite) and seed the
      scaffolded inducer's prompt with it. Measure: does vocabulary-seeding raise the GROUNDING RATE
      (4-seed, per arc3_layerb_repeat_bench.py) on HELD-OUT config games vs cold-start? Generator =
      Qwen3.5-9B-MTP (iGPU, /no_think). REQUIRED ARTIFACT FIELDS: config_rule_vocabulary_transfers
      (BARE bool := held-out grounding-rate lift CI-excl-0; principle: a transferable vocabulary is the
      self-learning compounding signal), verifier_is_oracle (false; the verifier grounds, does not define
      correctness), random_seed, honest_verdict (terminal-prefixed). NOT gated. A null is LOGGED as a gap.

