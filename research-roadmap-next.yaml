    5. Exercise the unchanged adversarial classifier on small isolated current-invocation receipts plus separate historical-source sidecars. Include genuine CPU aggregation, bounded generation, full generation and load-only shapes, and contradictory mutations. Use the V636 quarantines as regression counterexamples, not accepted evidence. Record an unresolved classifier problem without changing it.
    6. Read the V637 source refresh and recheck up to three primary records if their execution-time versions changed. Log access failures and no-delta results. source_contract_complete_score=1 means the structural receipt completed; it is not science.
    7. Validate the changed scope with focused pytest, required scoped coverage, Ruff check/format, changed-module mypy, and scripts/check_spec_coverage.py on explicit affected test paths with a private --basetemp. Planning E2E is selected YAML plus Markdown -> independent parser -> real evaluate_gates on temporary files. Run unchanged scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py on the completed artifact. Record exact command receipts and unrelated baseline failures. Do not weaken tests, suppress flags or modify QA/conductor machinery. Reconcile the driving spec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Print and flush before/after final validation and atomic terminal write. No production default change, publication, upload or submission.

