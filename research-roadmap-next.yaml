- id: exp7397-delayed-adapter
  title: Prototype a bounded energy-offset learner with delayed feedback
  phase: 1
  track: continuous-learning
  priority: high
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 35
  per_unit_rows: true
  milestone: 2026.09.649
  deliverable: results/experiment_7397_v649_delayed_adapter.json
  agent_type: codex
  model: gpt-5.6-sol
  prior_failures:
  - experiment_id: exp7386-online-decisions
    verdict: complete_disqualified_required_validation_or_safety_failure
    addressed_by: Replace full-head streaming updates with a frozen representation plus a bounded affine energy
      adapter, and derive required checks from the scoped plan without the appended broad suite.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The V648 full-head online study was disqualified by its actual validation contract. Test a different, bounded mechanism: freeze the trained Gibbs representation and learn only a two-scalar affine calibration of its energy from past verified feedback. ORCA motivates cheap adaptive calibration; Memoir motivates separating read and commit. No ORCA theorem is inherited.
    Work at {project_root}. Execution date {date}. Milestone 2026.09.649, phase 1.

