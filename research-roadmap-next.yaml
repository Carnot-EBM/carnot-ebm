  title: Bind fourteen tasks and freeze the decision-preserving deployment protocol
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 45
  per_unit_rows: true
  milestone: 2026.10.721
  deliverable: results/experiment_8360_v721_contract_methods.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prior_failures:
  - experiment_id: exp8318-contract-replay
    verdict: complete_disqualified_contract_replay
    addressed_by: Reuse qualified Exp8346 direct-input custody; new contract freezes deployment fidelity rather
      than repeating failed history replay.
    retire_if_same_verdict: true
  model: opus
  prompt: |-
    CONTEXT:
    Work in {project_root} on {date}. V720 completed thirteen producer tasks and one pre-gated canary. Exp8347 qualified local arithmetic and recovery; Exp8348 sealed a real delayed-learning trajectory. Exp8350/8351 each missed one replay rejection statement and remain disqualified; descriptive H1 gain is -0.00390625 and H2 gain is zero. Exp8352 qualified tables but its selected 65-int16-linear candidate flips three boundary actions. Exp8356 qualifies CPU arithmetic only. Runtime readers, GateMate history and final replay still fail. Preserve all original outcomes and V717 protocol bytes. Cached observations are exposed development, not current LLM inference.
    EXISTING CODE TO READ FIRST:
    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; ops/exclusion_manifest.yaml; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; openspec/change-proposals/research-roadmap-vNEXT.md; openspec/change-proposals/research-roadmap-v720-preserved-20261009.md; openspec/change-proposals/v717-local-learning-protocol.json; python/carnot/reporting/roadmap_contract.py; python/carnot/reporting/v685_authority_lifecycle.py; research-references.md; research-studying.md; results/experiment_8346_v720_frozen_input_contract.json; results/experiment_8347_v720_local_consumer_qualification.json; results/experiment_8348_v720_continuous_local_learning.json; results/experiment_8352_v720_spline_table_fidelity.json; results/experiment_8356_v720_kv260_workload_cost.json; results/experiment_8359_v720_capstone.json
    TASK:
    Bind fourteen tasks and freeze the decision-preserving deployment protocol. Deliver results/experiment_8360_v721_contract_methods.json. Create thin runner scripts/experiments/experiment_8360_v721_contract_methods.py; keep primitive evidence in results/raw/experiment_8360_v721_contract_methods/. Future task outputs are dependencies, not pre-existing files.
    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed start line. Authenticate authority, input hashes and terminal sidecars. Check private scratch, required tools and bounded resources. Record missing external inputs in gate_check_summary. Never replace natural evidence with fixtures.
    2. Emit a flushed progress line at every phase boundary and before and after each model load, generation, benchmark and subprocess. Emit completed/pending counts inside long loops; poll owned children at least every 60 seconds. Keep every silence gap below 600 seconds. Use unbuffered output and per-child deadlines inside a 4800-second task cap. Write any file over about 200 lines in several tool calls of at most about 150 lines, with a progress message between calls. Do not make one huge tool call or pad elapsed time.
    3. Spec first: add relevant REQ-* and SCENARIO-* before implementation. Write focused failing tests first. Preserve existing assertions, guard thresholds and historical artifacts. Use small adapters to existing modules. Keep throwaway probes in /tmp and experiment runners in scripts/experiments/. Do not modify research-roadmap.yaml. Freeze the validation command manifest before measurement.
    4. Declare no_model_load, MODEL_SPECS=[] and zero current LLM calls. Use aggregation_from_upstream_artifacts for readers, or verifier_ensemble_against_cached_candidates for numeric cached-head work. Small numeric training is not an LLM load. Bind imported model provenance separately.
    5. Compare all fourteen visible task rows, full JSON objects and staged YAML, including prompt and lineage hashes. Bind activated authority only after activation. Preserve V720 snapshots; do not activate a roadmap. Authenticate successful Exp8334 heads, Exp8335 seals, Exp8347 kernel and Exp8348 trajectory directly. Separate head, trajectory and contract readiness; unrelated historical failures cannot gate valid inputs.
    6. Ingest the dated V721 scan before implementation. Read full KANELE 2512.12850v3 and online KAN 2602.02056v4 methods. Record assumptions, versions, URLs, hashes and adoption/defer decisions in docs/research-notes/v721-method-ingestion.md and research-studying.md. OpenHalDet is a deferred external-evaluation lead; no new dataset, generator training or new scheduler sweep.
    7. Write openspec/change-proposals/v721-deployment-protocol.json. Freeze the existing 34-coefficient spline head, temperature, knots, actions p<.25 accept/p>.75 reject/otherwise escalate, and 65-point signed-int16 table with 11 fractional bits. Freeze direct float64 reference and exactly equivalent sigmoid control. Keep V717 H1/H2, data roles and thresholds immutable; both targets are already exposed.
    8. Freeze 4096 seeded label-free vectors plus every knot and both action boundaries, with nextafter neighbors. Freeze seeds11/22/33 for constructed update/fault panels, natural stream96 including22 missing slots, retention windows0/32/64/96, and later-source67 support. Freeze batches1/8/32, predictions per update1/8/64, one warmup plus five paired repeats; timings are descriptive.
    9. Freeze complete transaction scope: input validation, direct or guarded scoring, delayed feedback, coefficient update, table/bound refresh, serialization, durable commit and response. Local service excludes LLM acquisition explicitly. Freeze primary engineering gates: zero unsafe interval escapes, zero action disagreements, exact same-version state, zero stale/mixed reads and exact crash resume. Speed is measured, never a readiness prerequisite.
    10. Run private E2E-018 matching, mutation, deletion and reorder controls. Seal execution/input manifests before any new measurements. Record all thirteen V720 primaries and the pre-gate receipt, preserving disqualified audit outcomes.
    11. Run relevant unit and consumer tests, scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Require 100 percent newly owned statements including CLI, real children and failure branches. Use pytest -n 0 -o addopts= with private disk-backed scratch. Record argv, exits, timings and log hashes. Run the applicable private E2E checks named above; do not run the full repository suite inside this experiment.
    12. Cold-replay primitive evidence in a fresh process. Run valid, negative and self-consistently rehashed tamper controls. Use unchanged primary_publication checks, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>. Keep every finding. Only the existing typed finding consumer may resolve independently recomputed informational findings with deliberate-error controls; unknown, warning and critical findings block readiness. Do not edit validators or exemptions. Publish a terminal primary atomically after checks. Owned failures are disqualified; unchanged external blocks are blocked, never partial. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. No generator weight updates or external publication.
    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Bind this invocation to exact task authority.
    honest_verdict, verdict_class: principle: Use a complete_ terminal prefix. Class is positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished retryable owned work only.
    gate_check_summary: principle: Every block names upstream, path/hash, field, operator, expected and observed values; missing differs from zero, including every blocked_* verdict.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, historical_model_provenance: principle: Distinguish current model calls from imported observations.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count, sample_size_budget: principle: Keep metrics for every intended unit and arm. Repeated timing rows are not independent examples.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Reference-oracle positives use circular_positive. Both generalization scores stay zero on exposed or constructed data.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path, adversarial_findings: principle: Qualification and scientific benefit are separate.
    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes: principle: Bind every claim to replayable measured evidence.
    cited_upstream_artifacts, field_principles: principle: Identify imported fields and hashes; explain each added artifact field.
    current_contract_ready_score, frozen_heads_ready_score, frozen_trajectory_ready_score, canonical_tasks_sha256: principle: Qualify authority and reusable inputs separately.
    protocol_path, protocol_sha256, methods_manifest, execution_manifest, historical_dispositions: principle: Freeze adaptations before measurement; do not rewrite V717 science.
    Run command: cd {project_root} && PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8360_v721_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
