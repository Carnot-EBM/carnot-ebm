  - id: exp5368-v489-budget-curated-memory-governance
    milestone: "2026.07.489"
    title: "Budget-curated memory governance for dependency-safe self-learning"
    priority: critical
    track: self-learning
    deliverable: "results/experiment_5368_budget_curated_memory_governance_v489.json"
    agent_type: codex
    model: gpt-5.5
    max_turns: 45
    estimated_wall_time_min: 45
    prior_failures:
      - experiment_id: exp5357-v488-dependency-drift-self-learning-scaleup
        verdict: "complete: self_learning_scaleup_ready=true"
        addressed_by: "This extends the clean .488 self-learning lane with budget-curated value-minus-harm-per-byte governance, not a duplicate dependency/drift scale-up."
        retire_if_same_verdict: true
      - experiment_id: exp5356-v488-memory-tool-drift-harness
        verdict: "complete: memory_tool_drift_ready=true"
        addressed_by: "The new task keeps drift controls but adds KEEP/SHARE/TRUST decisions, stale/poison labels, and resource budgets."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      The research program requires continuous self-learning every milestone. Exp5355, Exp5356, and Exp5357 produced clean no-weight-mutation self-learning artifacts. The next gap is budget-curated governance: useful memory should be retained only when value exceeds cost and harm risk.

      EXISTING CODE TO READ FIRST:
      - {project_root}/research-program.md
      - {project_root}/results/experiment_5355_dependency_provenance_self_learning_v488.json
      - {project_root}/results/experiment_5356_memory_tool_drift_harness_v488.json
      - {project_root}/results/experiment_5357_dependency_drift_self_learning_scaleup_v488.json
      - {project_root}/research-references.md
      - {project_root}/python/carnot/
      - {project_root}/tests/python/

      TASK:
      Add or exercise a deterministic budget-curated memory governance fixture for self-learning. The fixture must score memory items by value-minus-harm per byte and make KEEP/SHARE/TRUST decisions under resource budgets without mutating model weights.

      CONCRETE STEPS:
      1. Reuse the existing dependency-provenance and memory-drift fixtures where possible.
      2. Add memory item fields for provenance, byte cost, estimated verifier value, stale risk, poison risk, sharing risk, and trust label.
      3. Implement or exercise deterministic decision rules for KEEP, DROP, SHARE, QUARANTINE, and TRUST/UNTRUST.
      4. Include stale and poisoned memory cases plus clean useful cases.
      5. Add focused tests if source code changes are required.
      6. Write {project_root}/results/experiment_5368_budget_curated_memory_governance_v489.json.

      REQUIRED ARTIFACT FIELDS:
      - status: principle: complete only if the budget governance fixture runs.
      - budget_curated_memory_ready: principle: boolean gate for scale-up; true only when value, cost, harm, and trust decisions are all measured.
      - memory_item_count: principle: number of memory records evaluated.
      - budget_bytes: principle: memory byte budget used by the fixture.
      - retained_bytes: principle: bytes retained after curation.
      - value_minus_harm_per_byte_mean: principle: mean value-minus-harm score normalized by byte cost.
      - keep_precision: principle: fraction of kept items that are useful and non-harmful.
      - stale_memory_deflection_rate: principle: fraction of stale items not trusted or not used.
      - poison_memory_deflection_rate: principle: fraction of poisoned items not trusted or not used.
      - share_decision_precision: principle: fraction of shared items that pass provenance/trust constraints.
      - trust_decision_precision: principle: fraction of trusted items that are clean useful items.
      - rollback_recovery_rate: principle: recovery rate after bad memory is detected.
      - unsafe_false_accepts: principle: count of harmful memory items accepted as trusted useful memory.
      - no_weight_mutation: principle: must be true.
      - tests_run: principle: list of commands run or no-code-change explanation.
      - honest_verdict: principle: one-line ready/block verdict.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5369-v489-budgeted-continuous-self-learning-scaleup
    milestone: "2026.07.489"
    title: "Gated budgeted continuous self-learning scale-up"
    priority: high
    track: self-learning
    deliverable: "results/experiment_5369_budgeted_continuous_self_learning_scaleup_v489.json"
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    estimated_wall_time_min: 55
    gated_on:
      - upstream: exp5368-v489-budget-curated-memory-governance
        artifact_field: budget_curated_memory_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp5357-v488-dependency-drift-self-learning-scaleup
        verdict: "complete: self_learning_scaleup_ready=true"
        addressed_by: "This scale-up adds resource-budgeted memory curation, attack/stale pressure, and larger multi-session traces beyond the clean .488 dependency/drift result."
        retire_if_same_verdict: true
      - experiment_id: exp5342-v487-self-learning-scaleup
        verdict: "flagged_adversarial: TAUTOLOGY"
        addressed_by: "The .489 task inherits the .488 dependency-provenance repair and adds explicit budget and harm controls instead of aggregate duplicate deltas."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      This is the milestone's explicit continuous self-learning experiment. It runs only if Exp5368 reports budget_curated_memory_ready=true. The goal is larger-scale, budget-governed, verifier-controlled learning from traces without weight mutation.

      EXISTING CODE TO READ FIRST:
      - {project_root}/research-program.md
      - {project_root}/results/experiment_5368_budget_curated_memory_governance_v489.json
      - {project_root}/results/experiment_5357_dependency_drift_self_learning_scaleup_v488.json
      - {project_root}/python/carnot/
      - {project_root}/tests/python/

      TASK:
      Scale the dependency/drift self-learning loop with budget-curated memory. The loop must improve or preserve quality while reducing context/verifier cost and rejecting stale/poisoned memory.

      CONCRETE STEPS:
      1. Verify Exp5368 budget_curated_memory_ready=true.
      2. Build or run at least 12 multi-session traces and at least 30 checked events unless a smaller existing fixture is the maximum available; if smaller, state the limitation honestly.
