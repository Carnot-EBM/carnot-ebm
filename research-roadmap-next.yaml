tasks:
  - id: exp1785-ebft-pipeline
    title: "Exp 1785: Energy-Based Fine-Tuning (EBFT) Pipeline setup"
    prompt: >
      CONTEXT: We must integrate Energy-Based Fine-Tuning (EBFT) (Jiang et al., 2026) to provide dense semantic feedback to our continuous self-learning loop.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/differentiable_memory.py`, `python/carnot/models/latent_optimizer.py`.
      TASK: Implement the EBFT loss functions and training harness.
      CONCRETE STEPS:
      1. Create `python/carnot/training/ebft_trainer.py`.
      2. Implement sequence-level energy loss and alignment logic.
      3. Write `{project_root}/results/experiment_1785_ebft_pipeline.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1786-ebft-training
    title: "Exp 1786: gated on Exp 1785 honest_verdict in success: Run EBFT on continuous latent traces"
    gated_on:
      - upstream: exp1785-ebft-pipeline
        artifact_field: honest_verdict
        op: in
        value: ["success", "complete"]
    prompt: >
      CONTEXT: Execute the EBFT loop using the multi-session traces from .137.
      EXISTING CODE TO READ FIRST: `python/carnot/training/ebft_trainer.py`.
      TASK: Train with EBFT using `unsloth/gemma-4-31B-it-GGUF`.
      CONCRETE STEPS:
      1. Create `scripts/experiment_1786_run_ebft.py`.
      2. Record validation energy metrics and sequence alignment scores.
      3. Write `{project_root}/results/experiment_1786_ebft_training.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

