tasks:
  - id: exp6391-v550-terminal-handoff-and-queue-preflight
    milestone: "2026.08.550"
    deliverable: results/experiment_6391_v550_terminal_handoff_and_queue_preflight.json
    title: "V549 terminal evidence handoff and V550 queue preflight"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 100
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6377-v549-terminal-handoff-and-queue-preflight
        verdict: "complete_v549_queue_preflight_passed: V548 evidence is bounded and the fourteen-task V549 queue validates"
        addressed_by: "This handoff reconciles the terminal V549 artifacts with the conductor quarantine separately and derives duration from per-task execution receipts instead of one aggregate timer."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 2026.08.549 is terminal. Exp6379 made the deterministic factor transport contract ready. Exp6380 returned complete_null because the global three-model transport gate failed, although both Gemma families crossed the source-bound exact-check boundary at computed capacity. Exp6383 proved selective rollback as a control. Exp6386 through Exp6388 advanced two-sided active ARC goal evidence. Exp6389 was blocked because a numeric gate field was stored as a mapping. The conductor quarantined Exp6377 and Exp6385 for duration even though their artifacts reported completion. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6377_v549_terminal_handoff_and_queue_preflight.json through {project_root}/results/experiment_6390_v549_adversarial_capstone.json
      - {project_root}/ops/conductor-log.md, {project_root}/ops/status.md, and {project_root}/ops/changelog.md
      - {project_root}/research-complete.yaml, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/known-issues.md
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/exclusion_manifest_lint.py

      TASK
      Create the exact V549-to-V550 evidence handoff and preflight the complete 13-task V550 queue. Preserve artifact verdicts, conductor outcomes, and adversarial flags as separate facts. Validate the new capability-license and ARC metric gates before activation. Do not alter the active roadmap or the conductor.

      CONCRETE STEPS
      0. Hash the active roadmap, next roadmap, milestone document, conductor, exclusion manifest, known issues, and all expected V549 terminal artifacts.
      1. Summarize Exp6377 through Exp6390 with scripts/summarize_artifact.py. Preserve complete, positive, null, blocked, skipped, absent, flagged, and retired states without filling gaps.
      2. Reconcile artifact honest_verdict values with ops/conductor-log.md outcomes. Derive each duration from the terminal task receipt. Do not use one aggregate milestone duration as a task duration.
      3. Record the exact factor boundary: Exp6379 ready, Exp6380 global null, two qualified Gemma observations, Qwen invalid, Exp6381 and Exp6382 blocked, Exp6383 positive control, and Exp6384 blocked.
      4. Record the exact ARC boundary: Exp6386 through Exp6388 ready, Exp6388 scalar detail nested, and Exp6389 blocked_gate_check_failed.
      5. Validate 13 unique V550 IDs and deliverables, execution order, structured gates, required gate fields, prior-failure subfields, no retired-ID reuse, and no retired requires chain.
      6. Check every prompt for CONTEXT, EXISTING CODE TO READ FIRST, TASK, CONCRETE STEPS, {project_root}, {date}, a Run command, and the exact final prohibition line.
      7. Check every LLM task for MODEL_SPECS, cached_sota_pair(), at least one mandated GGUF ID, embedded tokenizers, no AutoTokenizer, and no legacy headline cell. Check every task for agent_type=codex and model=gpt-5.5.
      8. Add or update applicable REQ-* and SCENARIO-* entries before implementation. Write focused tests. Run schema, prior-failure, gate, exclusion, spec-coverage, adversarial, determination-preservation, and root-clutter checks.
      9. Write the artifact atomically. A repeated unresolved artifact-versus-conductor mismatch retires this handoff scope.

      Required deliverable: {project_root}/results/experiment_6391_v550_terminal_handoff_and_queue_preflight.json.
      REQUIRED ARTIFACT FIELDS:
      status, v549_active_roadmap_path_and_hash, v549_task_ids, v549_terminal_artifacts_by_task, v549_artifact_verdicts, v549_conductor_outcomes, v549_adversarial_flags, v549_duration_receipts_by_task, v549_factor_boundary, v549_arc_boundary, v550_milestone_doc_and_queue_hashes, v550_task_ids, v550_id_and_deliverable_checks, v550_dependency_and_gate_checks, v550_gate_field_cross_reference_checks, v550_prior_failure_checks, v550_exclusion_manifest_checks, v550_agent_model_and_llm_policy_checks, prompt_contract_checks, active_roadmap_modified, conductor_modified, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      field_principles must map every required field and every gate to its purpose. field_provenance must classify every field as measured, derived, constant, or upstream. Set verifier_is_oracle=false.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6391_v550_terminal_handoff_and_queue_preflight --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6392-v550-post-marker-source-scope-freeze
    milestone: "2026.08.550"
    deliverable: results/experiment_6392_v550_post_marker_source_scope_freeze.json
    title: "V550 dated source delta and executable scope freeze"
    priority: high
    track: infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 45
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6378-v549-post-marker-source-scope-freeze
        verdict: "complete_no_scope_change: no strict post-marker source changed V549 executable scope"
        addressed_by: "The V550 marker contains new August 12 harness, retry-switch-abstain, transactional activation, and online-evaluation methods that change the factor-learning mechanism."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The V550 planner marker in research-references.md promotes arXiv:2608.12307 for test-time harness construction, arXiv:2608.11977 for retry-switch-abstain control, arXiv:2608.11632 for transactional activation, and arXiv:2608.11560 for separate alignment and learnability checks. It keeps grammar decoding, parser/JIT repair, hidden-state scoring, external-text scoring, KAN training, EBT pretraining, unchanged boards, TSU execution, and Kona execution closed. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/research-references.md, and {project_root}/research-hardware-wishlist.md
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md and {project_root}/research-roadmap-next.yaml
      - {project_root}/results/experiment_6391_v550_terminal_handoff_and_queue_preflight.json
      - {project_root}/results/experiment_6378_v549_post_marker_source_scope_freeze.json
      - {project_root}/results/experiment_6390_v549_adversarial_capstone.json
      - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/known-issues.md

      TASK
      Validate the dated V550 source marker and freeze the executable scope. Recheck direct metadata and public availability. Separate executable methods, controls, deferred ideas, closed scopes, product status, and unavailable sources. Do not reopen a retired mechanism because a source uses related terms.

      CONCRETE STEPS
      0. Check network reachability. Record unavailable endpoints and rate limits without inventing content.
      1. Hash the V550 marker. Validate titles, dates, identifiers, and URLs for all promoted sources.
      2. Recheck arXiv, OpenReview, Hugging Face Papers, Semantic Scholar EBT and ARM-EBM citations, GitHub, Extropic first-party pages, and Logical Intelligence first-party pages.
      3. Classify each finding as executable now, measurement control, deferred, retired scope, product status, or unavailable.
      4. Freeze held model-family transport licensing, capability-qualified verified-frontier learning, predecessor-bound continuous self-learning, and live default-off active-goal evidence as the active lanes.
      5. Freeze grammar and parser retries, JSON repair, external text scoring, hidden-state scoring, KAN training, EBT pretraining, offline ARC solvers, per-game adapters, unchanged board probes, TSU execution, and Kona execution as closed or deferred.
      6. Confirm that no new hardware or product receipt changes the V550 task list. Record any real strict post-marker finding without silently editing the roadmap.
      7. Add or update applicable REQ-* and SCENARIO-* entries. Write focused tests for marker detection, source classes, and closed-scope preservation. Run focused tests, coverage, spec coverage, adversarial verification, and root-clutter sweep.
      8. Write an atomic artifact. A no-change result is valid and must not expand scope.

      Required deliverable: {project_root}/results/experiment_6392_v550_post_marker_source_scope_freeze.json.
      REQUIRED ARTIFACT FIELDS:
      status, planner_marker_path_and_hash, source_window_start_and_end_utc, direct_arxiv_source_receipts, openreview_receipts, huggingface_papers_receipts, semantic_scholar_ebt_and_arm_ebm_receipts, github_discovery_receipts, extropic_first_party_receipt, logical_intelligence_first_party_receipt, new_actionable_findings, post_marker_findings_count, executable_scope_change_required, active_lane_freeze, control_only_findings, closed_and_deferred_scope_freeze, unavailable_or_rate_limited_sources, retired_scope_reopened, hardware_state_change_found, source_claim_boundaries, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=false. Map every field to a principle and measured, derived, constant, or upstream provenance.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6392_v550_post_marker_source_scope_freeze --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6393-arc-scalar-gate-metric-contract
    milestone: "2026.08.550"
    deliverable: results/experiment_6393_arc_scalar_gate_metric_contract.json
    title: "ARC scalar gate-metric producer contract and V549 replay"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6389-arc-default-off-active-goal-shadow
        verdict: "blocked_gate_check_failed"
        addressed_by: "This task repairs the producer contract by emitting bare scalar gate fields plus separate detail fields before any new shadow is dispatched."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6388 completed with arc_evidence_calibration_ready_score=1.0. Each model improved admission precision by 0.75 and the pooled false-accept count fell by nine. The artifact stored delta_admission_precision as a mapping with by_model and pooled_unrounded members. The conductor requires a bare numeric value for the greater-than gate, so Exp6389 was correctly blocked. This task changes the producer field contract. It does not change the conductor or rewrite historical artifacts. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6388_arc_goal_evidence_response_calibration.json
      - {project_root}/results/experiment_6389_arc_default_off_active_goal_shadow.json
      - {project_root}/results/experiment_6390_v549_adversarial_capstone.json
      - {project_root}/python/carnot/experiment_6388_arc_goal_evidence_response_calibration.py and its focused test
      - {project_root}/scripts/conductor_gates.py, {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/roadmap_schema.py
      - {project_root}/openspec/capabilities/arc-agi/spec.md and {project_root}/openspec/capabilities/research-harnesses/spec.md

      TASK
      Build a producer-side ARC gate-metric contract. Replay the immutable Exp6388 evidence into bare scalar gate fields and separate detail fields. Prove that the conductor comparison surface receives only finite numbers. Do not invoke an LLM, run ARC, modify Exp6388 or Exp6389, or modify conductor code.

      CONCRETE STEPS
      0. Hash Exp6388, Exp6389, the calibration producer, gate checker, active roadmap, and conductor before changes.
      1. Recompute pooled admission precision, delta admission precision, false-accept count, and delta false-accept count from frozen row-level counts. Do not trust the nested aggregate alone.
      2. Define a producer contract with delta_admission_precision_scalar and delta_false_accept_count_scalar as finite bare numbers. Preserve by-model values in distinct detail fields.
      3. Add fail-closed validation for mapping values, lists, strings, bools, NaN, infinity, rounded sign changes, missing model rows, duplicated rows, stale hashes, and model-order swaps.
      4. Run the same structured conditions planned for Exp6400 against the new artifact. Record the exact comparison operands and results.
      5. Add or update REQ-* and SCENARIO-* entries before implementation. Write focused tests with 100% focused coverage for the new contract. Run schema, gate audit, focused tests, spec coverage, adversarial verification, determination preservation, and root-clutter sweep.
      6. Set arc_gate_metric_contract_ready_score=1.0 only when immutable row counts reproduce the V549 result, all scalar fields are finite bare numbers, every coercion attack fails closed, and protected files are unchanged.
      7. Write the artifact atomically. Make no claim about live route utility or a solve.

      Required deliverable: {project_root}/results/experiment_6393_arc_scalar_gate_metric_contract.json.
      REQUIRED ARTIFACT FIELDS:
      status, upstream_exp6388_path_hash_and_terminal_class, upstream_exp6389_path_hash_and_terminal_class, immutable_row_count_receipts, metric_producer_path_hash_and_version, pooled_admission_precision_scalar, delta_admission_precision_scalar, false_accept_count_scalar, delta_false_accept_count_scalar, admission_precision_by_model_detail, false_accept_count_by_model_detail, scalar_type_and_finiteness_checks, recomputation_equations_and_operands, structured_gate_replay_results, coercion_rounding_missing_duplicate_and_order_attack_matrix, historical_artifacts_modified, conductor_modified, arc_gate_metric_contract_ready_score, no_live_route_or_solve_claim, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      field_principles must map arc_gate_metric_contract_ready_score, delta_admission_precision_scalar, and delta_false_accept_count_scalar to their downstream gate purposes. Set verifier_is_oracle=false.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6393_arc_scalar_gate_metric_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6394-model-family-factor-harness-freeze
    milestone: "2026.08.550"
    deliverable: results/experiment_6394_model_family_factor_harness_freeze.json
    title: "Model-family factor harness development and held-split freeze"
    priority: critical
    track: self-learning
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 210
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6380-three-family-canonical-factor-transport-canary
        verdict: "complete_null: live calls ran but three-family canonical transport gates did not all pass"
        addressed_by: "This attempt replaces one universal prompt with a bounded development-only harness selection per model family, freezes it before held events, and permits explicit abstention."
        retire_if_same_verdict: true
      - experiment_id: exp6366-repaired-live-factor-proposal-authenticity
        verdict: "complete_null: repaired live calls ran but authenticity gates did not all pass"
        addressed_by: "The observable runtime and canonical transport now exist; the new method tests family-specific response scaffolds and deterministic routing rather than another raw prompt retry."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6379 proved one canonical schema and tokenizer-derived capacity contract. Exp6380 showed that the computed canonical arm worked for both Gemma families but not Qwen3.6. The global gate hid this partial capability. arXiv:2608.12307 reports that deterministic harness code, routing, and strict answer-format enforcement can transfer capability at test time without target-model training. V550 tests a bounded version on development events only. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6379_canonical_factor_edit_transport_contract.json
      - {project_root}/results/experiment_6380_three_family_canonical_factor_transport_canary.json and its raw sidecars
      - {project_root}/python/carnot/experiment_6379_canonical_factor_edit_transport_contract.py
      - {project_root}/python/carnot/experiment_6380_three_family_canonical_factor_transport_canary.py
      - {project_root}/python/carnot/experiment_6365_gguf_child_failure_forensics_and_runtime_contract.py
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/research-references.md entries for arXiv:2608.12307 and arXiv:2608.11977
      - {project_root}/openspec/capabilities/continuous-learning/spec.md and {project_root}/openspec/capabilities/research-harnesses/spec.md

      TASK
      Build and freeze one bounded factor-edit harness per mandated model family on a sealed development split. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF from cached_sota_pair(). Use embedded GGUF tokenizers only. Never call AutoTokenizer. If the mandated cache is absent, legacy models may run smoke tests but every measured cell must be blocked. Do not use grammar decoding, parser/JIT repair, post-hoc JSON repair, hidden states, external scorers, fine-tuning, or a token increase as the only change.

      CONCRETE STEPS
      0. Revalidate both RTX 3090 GPUs, model file hashes, quantizations, embedded tokenizers, llama.cpp offload, free disk, Exp6379 schema hash, and Exp6380 raw receipts.
      1. Seal disjoint development and held event manifests before any model call. Use at least 18 licensed development events across at least three executable constraint families. Balance structure and surface labels. Do not read held content or outcomes during selection.
      2. Preregister at most four harness variants. They may vary prompt-role placement, response prefix, a bounded isolated packaging call, or deterministic field routing. The dense flagship may propose candidate surface text from the canonical schema and development failure labels only. It cannot inspect held data or act as an oracle.
      3. Match development event order, seeds, sampling controls, total target-model calls, output capacity, and exact-check budget within each family. Preserve every raw output before one parse attempt.
      4. Measure nonempty output, thinking leakage, repetition, truncation, parse validity, source binding, exact checker calls, exact pass or fail, abstention, latency, and verification cost by family and variant.
      5. Select one harness per family using a preregistered exact development rule. Freeze its code, prompt, response prefix, capacity, call count, seeds, and schema hash. Freeze an explicit abstention policy for any failed cell.
      6. Prove that no held event, held outcome, protected replay row, generated label, same-step write, or model weight change affected selection.
      7. Add or update REQ-* and SCENARIO-* entries before implementation. Write focused tests. Run focused coverage, spec coverage, local inference E2E checks, adversarial verification, determination preservation, and root-clutter sweep.
      8. Set model_family_harness_freeze_ready_score=1.0 only when all three family selections are frozen before held access, development work is matched, raw receipts are complete, and every prohibited mechanism count is zero. Readiness does not grant a held license.

      Required deliverable: {project_root}/results/experiment_6394_model_family_factor_harness_freeze.json.
      REQUIRED ARTIFACT FIELDS:
      status, MODEL_SPECS, models_used, cached_sota_pair_receipts, model_file_hashes_revisions_quantizations_and_tokenizers, embedded_gguf_tokenizer_receipts, autotokenizer_usage_count, cuda_offload_and_runtime_receipts_by_model, development_and_held_manifest_paths_hashes_licenses_and_disjointness, development_balance_receipt, preregistered_harness_variants, builder_model_role_and_non_oracle_boundary, matched_development_work_receipts, raw_output_before_parse_paths_hashes_and_counts, per_family_variant_transport_source_binding_exact_and_cost_results, selected_harness_by_model_family, frozen_harness_paths_hashes_and_controls, explicit_abstention_policy, held_access_during_selection_count, protected_leakage_and_same_step_write_counts, model_weight_change_count, grammar_parser_jit_json_repair_hidden_state_and_external_scorer_usage_counts, model_family_harness_freeze_ready_score, held_license_not_implied, harm_underpowered_missing_and_flagged_cells, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=true only for exact task checkers. State that the builder, harness selector, parser, and model text are not oracles. field_principles must map model_family_harness_freeze_ready_score to the Exp6395 gate.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6394_model_family_factor_harness_freeze --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6395-held-factor-transport-license-matrix
    milestone: "2026.08.550"
    deliverable: results/experiment_6395_held_factor_transport_license_matrix.json
    title: "Gated on Exp6394 freeze: held factor-transport capability license matrix"
    priority: critical
    track: self-learning
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 270
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6394-model-family-factor-harness-freeze
        artifact_field: model_family_harness_freeze_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6380-three-family-canonical-factor-transport-canary
        verdict: "complete_null: live calls ran but three-family canonical transport gates did not all pass"
        addressed_by: "This held test uses frozen family-specific harnesses and issues per-model per-constraint licenses or abstentions instead of repeating an all-family readiness gate."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6394 must freeze every harness before held access. This task replaces the V549 universal gate with a capability matrix. A license is narrow. It applies only to one exact model file, one frozen harness hash, one canonical schema hash, and one constraint family. An unlicensed cell must abstain. It cannot silently use a different model or inherit another family's result. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6394_model_family_factor_harness_freeze.json and frozen harness sidecars
      - {project_root}/results/experiment_6380_three_family_canonical_factor_transport_canary.json
      - {project_root}/python/carnot/experiment_6394_model_family_factor_harness_freeze.py and its focused test
      - {project_root}/python/carnot/experiment_6383_dependency_guided_factor_rollback_stress.py
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/research-references.md entry for arXiv:2608.11977
      - {project_root}/openspec/capabilities/continuous-learning/spec.md and {project_root}/openspec/capabilities/research-harnesses/spec.md

      TASK
      Evaluate the frozen harnesses on held events and issue exact capability licenses by model and constraint family. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF from cached_sota_pair(). Use embedded tokenizers only. Never call AutoTokenizer. A missing mandated model blocks only its cells and prevents it from counting as licensed. Legacy models cannot populate the matrix.

      CONCRETE STEPS
      0. Revalidate the Exp6394 gate, frozen harness hashes, held manifest seal, model files, GPU offload, canonical schema, exact checkers, and absence of held access before freeze.
      1. Use at least 18 held events with at least six events from each of three executable constraint families. Run every mandated model on every applicable held event with its frozen harness and controls.
      2. Preserve raw output before one parse. Use no retry, repair, harness reselection, held tuning, family substitution, or silent fallback.
      3. Report nonempty, syntax, structure, source binding, exact-check calls, exact pass or fail, abstention, timeout, latency, and verification cost for each model-family cell.
      4. Preregister the license rule. A cell needs at least six held trials, at least four source-bound exact-evaluable proposals, zero false accepts, zero protected leakage, complete runtime receipts, and no prohibited mechanism. Otherwise issue rejected or abstain with a reason.
      5. Bind each license to model file hash, quantization, embedded tokenizer hash, harness hash, schema hash, constraint family, event-manifest hash, and expiration rule.
      6. Attack model-row swaps, family-label swaps, harness drift, stale schema, source substitution, missing rows, fallback laundering, abstention suppression, repeated output, and exact-fail promotion.
      7. Add or update REQ-* and SCENARIO-* entries before implementation. Write focused tests. Run focused coverage, spec coverage, inference E2E checks, adversarial verification, determination preservation, and root-clutter sweep.
      8. Emit licensed_model_count and licensed_constraint_family_count as bare integers. Set held_factor_transport_license_ready_score=1.0 only when at least two mandated models and at least two constraint families have at least one valid license, every other cell has an explicit terminal disposition, and universal support is not claimed.

