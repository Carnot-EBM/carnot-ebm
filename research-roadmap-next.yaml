      CONTEXT: P0.1 (does energy-based global inference actually SOLVE, not just descend fast?)
      is the project's single most important test. exp3494 (.322) VALIDATED the Sudoku-Ising
      ENCODING — `encoding_validity_E0` = {total_energy: 0.0, is_valid: True, residual
