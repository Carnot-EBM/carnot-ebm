      EXISTING CODE TO READ FIRST: python/carnot/inference/samplers.py
      TASK: Implement FAR (Fast Autoregressive) continuous latent constraint sampler.
      MODEL_SPECS: unsloth/gemma-4-31B-it-GGUF
      CONCRETE STEPS:
      1. Design a continuous latent sampler.
      2. Compare sampling speed to traditional discrete MCMC methods.
      3. Record latency distributions.
      4. Write the results artifact.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

