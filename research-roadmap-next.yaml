  milestone: 2026.04.73
  deliverable: results/experiment_944_sc_energy_set_consistency_v2.json
  max_turns: 50
  prior_failures:
    - experiment_id: exp939-sc-energy-set-consistency
      verdict: blocked_gate_check_failed
      addressed_by: "Exp 939 was blocked because the YAML task lacked prior_failures for 7 prior SC-energy experiments (506, 509, 533, 711, 725, 772, 787). This version documents all 8 prior experiments (adding Exp 939 itself). The SC-Energy algorithm from arXiv 2503.10695 has never actually run — this must be the run that executes."
      retire_if_same_verdict: false
    - experiment_id: exp711-sc-energy-setconsistency
      verdict: tier_29_below_threshold
      addressed_by: "Exp 711 was SC-Energy SetConsistencyVerifier Tier 2.9 — AUC below threshold on that corpus. This experiment uses the arXiv 2503.10695 architecture (set-level contrastive energy, permutation-invariant pooling), which is different from Exp 711's implementation. The contrastive loss trains E(coherent_set) << E(contradictory_set) explicitly."
      retire_if_same_verdict: false
    - experiment_id: exp725-sc-energy-v2-fover
      verdict: sc_energy_v2_below_threshold
      addressed_by: "Exp 725 was SC-Energy v2 with FoVer v2 dual labels (Z3 + PDDL). This experiment uses a simpler, cleaner contrastive corpus: coherent_set from single GSM8K solution steps, contradictory_set from mixed solutions (guaranteed contradiction). Simpler training signal should give cleaner gradient."
      retire_if_same_verdict: false
    - experiment_id: exp506-semantic-energy-tier0d
      verdict: semantic_energy_no_improvement
      addressed_by: "Exp 506 was Semantic Energy Tier 0d — a single-statement semantic energy scorer. Different architecture: SC-Energy scores SETS of statements for internal consistency. The set-level contrastive approach is structurally distinct from per-statement energy."
      retire_if_same_verdict: false
    - experiment_id: exp509-ppsebm-energy-magnitude-replay
      verdict: energy_magnitude_wins
      addressed_by: "Exp 509 was PPSEBM Energy Magnitude Replay — per-position sequence EBM, not set consistency. Adjacent domain only. SC-Energy's contrastive set-level loss is architecturally distinct."
      retire_if_same_verdict: false
    - experiment_id: exp533-cold-decoding-energy-guidance
      verdict: no_violation_reduction
      addressed_by: "Exp 533 was COLD Decoding Energy Guidance — energy-guided token generation, not set consistency verification. Different task and architecture. SC-Energy verifies whether a completed set of statements is coherent."
      retire_if_same_verdict: false
    - experiment_id: exp772-semantic-energy-probe
      verdict: semantic_energy_below_baseline
      addressed_by: "Exp 772 was SemanticEnergyProbe Tier 0g — arXiv 2508.14496 approach (per-token semantic energy from logits). Different from SC-Energy: SC-Energy uses set-level contrastive training on (coherent, contradictory) pairs, not per-token logit energy."
      retire_if_same_verdict: false
    - experiment_id: exp787-s-star-energy-prefilter
      verdict: energy_prefilter_efficient
      addressed_by: "Exp 787 was S* Energy Pre-Ranking for code candidate selection. Adjacent domain (energy-based ranking). SC-Energy's task is set-level coherence verification, not candidate ranking. These are complementary, not redundant."
      retire_if_same_verdict: false
  title: 'Exp 944: SC-Energy Set Consistency v2 — All 8 Prior Failures Documented, Must Actually Run (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2503.10695 (SC-Energy) proposes energy functions that score whether a SET
    of statements (s1,...,sn) is internally consistent. Contrastive loss:
    E(coherent_set) << E(contradictory_set). Achieves AUROC=0.89 on multi-statement consistency
    benchmarks. Exp 939 was blocked for the SECOND consecutive milestone by gate-discipline
    failure — YAML lacked prior_failures for 7 prior SC-energy experiments. This version
    documents all 8 prior experiments and MUST ACTUALLY RUN. The SC-Energy algorithm has
    never executed in this project — the block was a planner error, not an algorithm failure.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/ising.py — Ising EBM reference architecture
    - python/carnot/pipeline/global_consistency_checker.py — rule-based baseline (100% detection)
    - python/carnot/models/kan.py — KAN energy architecture
    - scripts/experiment_template.py — ExperimentTemplate
    - results/experiment_711_sc_energy_setconsistency.json — prior attempt verdict
    - results/experiment_939_sc_energy_set_consistency.json — blocked_gate_check_failed

    TASK: Implement SC-Energy set consistency verifier. Train on synthetic contradictory sets.
    Measure AUC vs rule-based baseline. Target: AUC > 0.70.

    CONCRETE STEPS:
    1. Read CLAUDE.md.
    2. Write python/carnot/models/sc_energy.py (or extend if it exists from Exp 939 scaffold):
       a. Class SCEnergyModel with set-level energy function:
          Input: list[str] of statements from a reasoning chain.
          Architecture: embed each statement via TF-IDF or sentence-transformers BGE-small,
          aggregate with mean pooling (permutation-invariant), pass through 2-layer MLP to
          produce scalar energy.
       b. Training: contrastive loss on (coherent_set, contradictory_set) pairs.
          coherent_set: consecutive steps from a correct GSM8K solution.
          contradictory_set: mix steps from two different GSM8K problems (guaranteed contradiction
          because they reference different quantities).
       c. If python/carnot/models/sc_energy.py already exists with a working implementation,
          re-use it — do NOT rewrite. Read it first.
       d. Add spec entries if not present: REQ-MODEL-031 (SCEnergyModel set-level energy),
          SCENARIO-MODEL-016 (coherent vs contradictory set discrimination).
    3. Write scripts/experiment_944_sc_energy_set_consistency_v2.py:
       a. ExperimentTemplate(944, "SC-Energy Set Consistency v2",
              "results/experiment_944_sc_energy_set_consistency_v2.json", requires_gpu=False)
          tmpl.setup()
       b. Generate 200 coherent sets + 200 contradictory sets from GSM8K step data.
          Coherent: 3-5 consecutive steps from a single GSM8K solution.
          Contradictory: randomly mix steps from 2 different GSM8K problems.
       c. Train SCEnergyModel on 320 pairs (80/20 split), 50 epochs.
       d. Evaluate: AUROC on held-out 80 pairs.
       e. Compare to rule-based global consistency checker (Exp 172: 100% on synthetic —
          but rule-based can only check arithmetic equality, not semantic contradiction).
       f. honest_verdict:
          'sc_energy_viable' if auroc > 0.70
          'sc_energy_marginal' if 0.60 < auroc <= 0.70
          'sc_energy_no_improvement' if auroc <= 0.60
    4. Write tests in tests/python/test_experiment_944_sc_energy_v2.py (100% coverage).
       100% spec coverage: all tests reference REQ-MODEL-031 or SCENARIO-MODEL-016.
    5. Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_944_sc_energy_set_consistency_v2.py
    6. Update research-references.md: confirm SC-Energy entry (arXiv 2503.10695) exists.
    7. Update ops/changelog.md.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_944_sc_energy_set_consistency_v2.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp945-thinkprm-tier29
  milestone: 2026.04.73
  deliverable: results/experiment_945_thinkprm_tier29.json
  max_turns: 50
  prior_failures:
    - experiment_id: exp924-rprm-step-reward-tier29
      verdict: tier_29_below_threshold
      addressed_by: "Exp 924 (R-PRM Tier 2.9) used HEURISTIC rule-based explanations before scoring. AUC delta=0 because rules provide no gradient signal. arXiv 2504.16828 (ThinkPRM) proves model-generated CoT explanations are required — the model must reason about WHY a step is wrong before scoring it, not just apply rules. This experiment implements ThinkPRM: pass each step to the LLM with 'verify this step and explain why' before scoring."
      retire_if_same_verdict: false
  title: 'Exp 945: ThinkPRM Tier 2.9 — Generative CoT Step Verification (arXiv 2504.16828) (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 924 (R-PRM Tier 2.9) produced AUC delta=0 because it used HEURISTIC
    rule-based explanations ("arithmetic error", "unit mismatch") before scoring each step.
