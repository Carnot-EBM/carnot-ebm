    B. STEP 0 = write artifact skeleton FIRST before any analysis.
    Both are combined in milestone .94's retro (exp1215).

    This experiment documents the fix pattern in ops/known-issues.md and verifies the
    retro prompt template used in exp1215 follows the STEP 0 pattern.

