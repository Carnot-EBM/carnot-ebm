    CLAUDE.md; CODEX.md; ops/e2e-test-plan.md; ops/exclusion_manifest.yaml; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; scripts/experiment_template.py; python/carnot/reporting/primary_publication.py; openspec/change-proposals/research-roadmap-vNEXT.md; research-references.md; python/carnot/reporting/v741_contract_inputs.py; python/carnot/reporting/v741_contract_methods.py; python/carnot/reporting/roadmap_contract.py; openspec/change-proposals/v741-methods-protocol.json; results/experiment_8627_v741_contract_methods.json; results/experiment_8639_v741_capstone.json; python/carnot/verify/cuda_reader_8410.py; research-studying.md

    TASK:
    Bind thirteen tasks and separate research operands from execution qualification. Deliver results/experiment_8640_v742_contract_methods.json. Create thin runner scripts/experiments/experiment_8640_v742_contract_methods.py. Retain immutable primitives under results/raw/experiment_8640_v742_contract_methods/ and notes in docs/research-notes/v742-contract-methods.md. Same-roadmap outputs are future dependencies.

    CONCRETE STEPS:
    1. PRECONDITIONS: Print a flushed start line. Authenticate branch inputs, exact upstream paths, tools, free memory and writable disk-backed scratch. Record missing inputs and observed zeros separately in gate_check_summary. Optional GPU or board absence cannot block independent CPU branches.

    2. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess that can take minutes. Use unbuffered output. Print completed and pending counts inside long loops; supervise children with a flushed line at least every 60 seconds. Keep every silence gap under 600 seconds. Write any file over about 200 lines in several tool calls of at most 150 lines, with a progress message between calls. Poll work in calls of at most 60 seconds. Stop measurements by 3600 seconds and reserve at least 900 seconds for validation within the 4800-second hard cap. Never pad measured duration.

    3. Spec first: confirm driving REQ-* and SCENARIO-* before implementation. Write focused failing tests first for changed behavior. Preserve original assertions, scientific thresholds and historical verdicts. Accept --date {date}; use scripts/experiments/ for runners, tests/python/ for tests and /var/tmp for scratch. Do not change research-roadmap.yaml, shared validators, generator weights or external services.

    4. Declare inference_substrate_class=no_model_load and MODEL_SPECS=[]. Record zero current language-model calls. Keep imported generator identities in historical_model_provenance. Authenticate actual small-head numerical inference and checkpoint separately; no_model_load does not mean no numerical work.

    5. Bind exactly thirteen complete dictionaries, Exp8640 through Exp8652. Compare the independently parsed visible table, full JSON, canonical_tasks_sha256, end marker and staged or genuinely activated V742 YAML. Reject count, order, ID, title, phase, deliverable, prompt, model, substrate, gate and retirement mutations. Test staged-V742/active-V741 and authentically activated-V742. Preserve original V741 authority; never treat current vNEXT as a historical document.

    6. Create openspec/change-proposals/v742-methods-protocol.json before measurements. Inherit objective_updates, objective_audit, streaming_extraction_protocol, installed_entry_2x2 and evidence_canary by value and hash from original V741. Register explicit new producer references; retain original historical readers. Ingest the V742 research scan and map decomposition, delayed capacity, proper-loss controls and sparse updates to the studies. Record CORTEX and Enoki use/defer decisions with source versions; mark ingestion in research-studying.md.

    7. Reproduce the circular input gate using original Exp8627: learning_inputs_ready_score=0 because Exp8616.required_checks_passed=false. Implement a NEW current operand adapter; preserve that historical judgment. learning_operands_ready_score requires authenticated Exp8431 head, Exp8580 validator, Exp8581 accounting, original data/labels, sealed objective and original test-source inventory. It MUST NOT require Exp8616 or a future execution qualification to pass. Keep learning_execution_ready_score absent here; Exp8641 alone owns it. Test that valid research operands plus failed historical execution permit qualification to run, while missing head/data/hash still block. Both operand and execution gates remain required for actual training.

    8. Authenticate Exp8617 release custody and Exp8620 roster: 190 responses in 128 exposed question groups. Preserve streaming resource bounds, original eight features, answer cap 16 and chunk sizes 1/32/128; no p2 confidence imputation. Emit extraction_inputs_ready_score independently. Authenticate Exp8633 installed prototype and Exp8621/8622 baseline methods independently of failed Exp8634 compatibility; emit deployment_inputs_ready_score without claiming compatibility.

    9. Register the unchanged installed/private by Python/native 2x2 cost matrix: original 64 requests, session lengths 1/4/16, batch 1, ten paired repeats, 120 cells. Primary installed_native/private_native at L16 requires throughput lower95>=0.95, p95 ratio<=1.05 and exact decisions. Keep seed 7418635 and 10000 paired-index draws. Native/Python lower95>=10 alone meets NFR-01. Inherit source-study seed 7418632 and fixed causal audit seeds; no tuning after test outcomes.

    10. Authenticate Exp8637 real redirect ledger and Exp8624 observer. Register reset provenance qualification plus a fresh four-game/two-seed off/on panel, 16 episodes, max512 actions and120 seconds each, horizon120, original games/seeds and capability masking ON. New instrumentation records the actual reset request origin and termination reason. It changes no action, priority, reset timing or budget. Classify unknown provenance explicitly. This tests diagnostic transfer, not supervisor efficacy; emit arc_inputs_ready_score.

    11. Use the existing reader once on supplied CUDA change evidence, without a device command. runtime_repair_ready_score=1 requires causal library/environment repair hashes and actual context/copy success. canary_inputs_ready_score separately requires current validator custody. Missing optional evidence pre-skips Exp8648 without vetoing CPU branches. Emit methods_ready_score only after complete contract and authority controls; each branch readiness has its own exact input checks.

    12. Run scoped unit tests, private CLI checks, Ruff check/format, strict mypy and scripts/check_spec_coverage.py --files <owned-test-files>. Run applicable ops/e2e-test-plan.md checks, including private E2E-018/021 for authority and publication readers. Require 100 percent newly owned statement coverage including actual child and rejection paths. Collect the original node IDs once and run bounded disjoint children with -n 0 -o addopts= --no-cov under their immutable original authority. Preserve raw child coverage before combining copies. A killed child fails validation. Do not run the whole repository suite or nested historical controllers. Retain actual commands, exit codes, durations and hashed logs.

    13. Cold-replay immutable primitives in a fresh bounded process. Reject missing inputs and self-consistently rehashed tampering. Run primary_publication, scripts/adversarial_verify.py --json <private-candidate> and scripts/verdict_row_consistency_lint.py --strict <private-candidate>; preserve actual severity and findings. Validate final bytes before atomic publication. Failed owned checks are disqualified. Unchanged external incompleteness is blocked, never partial. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md without rewriting history.

    REQUIRED ARTIFACT FIELDS:
    experiment_id, task_id, milestone, run_date: principle: Bind evidence to this invocation.
    honest_verdict, verdict_class: principle: Use a complete_ terminal prefix. verdict_class is exactly positive | circular_positive | null | blocked | disqualified | partial. Partial permits retry only for unfinished owned work; external unchanged failures are blocked.
    gate_check_summary: principle: Every blocked_* or complete_blocked_* verdict names the failed check, upstream, path/hash, field, operator, expected and observed value. Missing differs from zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts, historical_model_provenance, target_model: principle: Separate current execution from imported generator identities. Authenticate any small energy head and actual checkpoint.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count, sample_size_budget: principle: Preserve each unit, arm, metric and missing reason. Seeds and sibling responses are not independent questions.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle-dependent positives use circular_positive. Exposed data, compatibility and timing cannot establish independent generalization.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path, adversarial_findings: principle: Qualification differs from scientific benefit. Failed acceptance gates forbid a positive class.
    preconditions_checked, duration_s, phase_spans, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes: principle: Preserve real clocks and immutable operands.
    cited_upstream_artifacts, field_principles: principle: Name original producers and explain every added metric or gate.
    methods_ready_score, current_contract_ready_score, learning_operands_ready_score, extraction_inputs_ready_score, deployment_inputs_ready_score, arc_inputs_ready_score, canary_inputs_ready_score, runtime_repair_ready_score: principle: Separate available operands from execution certification and optional runtime.
    methods_protocol_reference, inherited_operand_checks, circular_gate_regression_rows, historical_quarantines, gate_field_map, literature_method_rows, canonical_tasks_sha256, authority_mutation_rows: principle: Preserve original authority and register every gate before measurement.

    branch_gate_values: principle: Every readiness field named above is a top-level numeric 0/1 value. Qualification and scientific benefit are separate.

