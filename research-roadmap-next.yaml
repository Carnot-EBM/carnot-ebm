  - id: exp366-llm-extractor
    milestone: "2026.05.27"
    deliverable: python/carnot/pipeline/llm_extractor.py
    title: "Exp 366: LLMExtractor — use a small LLM call to extract verifiable claims from IT model responses"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: RETRO-013 — the ArithmeticExtractor regex (`a + b = c`) finds ZERO violations
      on Gemma4-E4B-it (0/20 questions, including 4 wrong answers). Instruction-tuned models
      write "the total is 47" not "19 + 28 = 47". The LLMExtractor fix: use a second small LLM
      call (Qwen3.5-0.8B or Gemma4-E4B-it) to extract verifiable claims from the response in
      a structured JSON format that ArithmeticExtractor can parse. This is the "LLM-as-extractor"
      approach from research-program.md Goal #1b and MathAgent (arXiv 2604.11188) "Legislator" pattern.

      The structured claim format:
        [{"lhs": "47", "rhs": "28+19", "op": "+",
          "claim_text": "the total is 47 (28+19)", "confidence": 0.9}]
      Each claim becomes one IsingConstraint: lhs value == arithmetic(rhs).

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/extract.py — ArithmeticExtractor, ConstraintExtractor base class
      - python/carnot/pipeline/llm_z3_formalizer.py — LLMz3Formalizer patterns (Exp 357)
      - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline extractor param
      - scripts/experiment_357_llm_z3_formalizer.py — reference for LLM call patterns
      - results/experiment_358_extraction_benchmark.json — if exists; else Exp 358 spec

      TASK: Implement LLMExtractor as a ConstraintExtractor subclass.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-EXTRACT-021 (LLMExtractor must detect violations in IT format responses),
         REQ-EXTRACT-022 (structured claim JSON must parse into IsingConstraint),
         SCENARIO-EXTRACT-044/045/046 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - ExtractedClaim: dataclass (lhs, rhs, op, claim_text, confidence)
         - build_llm_extraction_prompt(question, response) → str: structured prompt
         - parse_claim_json(llm_output) → list[ExtractedClaim]: parses JSON array; robust to
           malformed output (returns [] on parse error), not raising
         - LLMExtractor(llm_caller=None, model_id=None, max_claims=10, confidence_threshold=0.7)
         - LLMExtractor.extract(response, question="") → list[ConstraintTerm]:
           - CI-safe: when llm_caller=None, returns [] (no claims extracted, no inference)
           - Live: calls llm_caller(build_llm_extraction_prompt(question, response)),
             parses claims, converts high-confidence claims to ArithConstraint terms
         - LLMExtractor.extract is additive with existing ArithmeticExtractor (can be chained)
      4. Implement python/carnot/pipeline/llm_extractor.py:
         - ExtractedClaim dataclass with __post_init__ validation
         - build_llm_extraction_prompt(question, response) → str:
           Prompt instructs the LLM to output ONLY a JSON array of claims, no prose.
           Each claim: {"lhs": "...", "rhs": "...", "op": "+" or "-" or "*" or "/",
                        "claim_text": "...", "confidence": 0.0-1.0}
           Include 3 few-shot examples in the prompt.
         - parse_claim_json(llm_output) → list[ExtractedClaim]: robust JSON extraction
         - _claim_to_constraint(claim) → ConstraintTerm | None: converts claim to IsingConstraint
         - LLMExtractor class (ConstraintExtractor subclass or standalone)
         - Export: LLMExtractor, ExtractedClaim, build_llm_extraction_prompt, parse_claim_json
      5. Wire LLMExtractor into AutoExtractor (python/carnot/pipeline/extract.py):
         - AutoExtractor should try LLMExtractor first if llm_caller is provided, fall back
           to ArithmeticExtractor if LLMExtractor returns []. Additive, no breaking changes.
      6. Export LLMExtractor from carnot.pipeline.__init__.
      7. Write scripts/experiment_366_llm_extractor.py using ExperimentTemplate(366):
         a. 20 hardcoded IT-format responses with known arithmetic (mix of correct and wrong)
         b. Run ArithmeticExtractor and LLMExtractor (CI-stub: llm_caller=None) on same responses
         c. Measure: n_claims_extracted (LLM stub=0 in CI), would_detect_violation_rate
         d. Build artifact: schema="carnot.llm_extractor.v1", extraction_mode="ci_stub",
            n_responses, n_claims_extracted, honest_verdict="live_gpu_required"
         e. Output: results/experiment_366_llm_extractor.json
      8. Write tests/python/test_llm_extractor.py (100% coverage required).
      9. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      10. Reconcile: update ops/conductor-log.md, ops/changelog.md, ops/status.md.
      Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp367-live-extraction-benchmark
    milestone: "2026.05.27"
    deliverable: results/experiment_367_extraction_live.json
    title: "Exp 367: Live extraction benchmark — LLMExtractor vs ArithmeticExtractor vs LLMz3Formalizer on Gemma4-E4B-it"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CLAUDE.md for code style requirements.
      Today's date: {date}.

      CONTEXT: Exp 366 implemented LLMExtractor. Now compare all three extractors on LIVE
      Gemma4-E4B-it output. Questions where the model is WRONG are ground truth for violation
      detection (TP when extractor fires). Questions where the model is CORRECT are ground truth
      for false positive rate (FP when extractor fires). This is the first live test of whether
      any extractor can detect real violations in real instruction-tuned model output.

      The experiment from Exp 358 (ExtractionBenchmarkResult) is already implemented. This
      experiment re-runs it with live GPU inference and the new LLMExtractor.

      IMPORTANT: Source scripts/conductor_gpu_env.sh before this experiment (Exp 365 created it).
      This experiment MUST run with CARNOT_FORCE_LIVE=1 to produce a credible result.
      If live GPU is unavailable (is_live_capable=False), produce blocked artifact and stop.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/llm_extractor.py — LLMExtractor (Exp 366)
      - python/carnot/pipeline/extraction_benchmark.py — ExtractionBenchmarkResult (Exp 358)
      - python/carnot/pipeline/llm_z3_formalizer.py — LLMz3Formalizer (Exp 357)
      - scripts/experiment_358_extraction_benchmark.py — prior benchmark script
      - python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu() (Exp 352)
      - scripts/experiment_template.py — ExperimentTemplate.setup_gpu()

      TASK: Run live extraction comparison.
      1. Read CLAUDE.md spec-first workflow.
      2. Add REQ-EXTRACT-023 (live extraction benchmark must use inference_mode=live_gpu),
         SCENARIO-EXTRACT-047/048 to openspec/capabilities/verifiable-reasoning/spec.md.
      3. Write tests FIRST (100% coverage required) for:
         - ExtractorComparisonResult: dataclass (extractor_name, n_questions, n_correct_questions,
           n_wrong_questions, n_true_positives, n_false_positives, detection_rate, fp_rate,
           inference_mode)
         - build_extractor_comparison_artifact(results: list[ExtractorComparisonResult]) → dict:
           schema="carnot.extraction_comparison.v1"; winner by detection_rate with fp_rate tiebreak;
           honest_verdict: "live_gpu_winner" only when inference_mode=="live_gpu" for all results;
           "simulated_no_verdict" when any result is simulated
         - run_extractor_comparison(questions, ground_truth, extractors, inference_fn, pipeline)
      4. Implement scripts/experiment_367_extraction_live.py:
         a. ExperimentTemplate(367), setup_gpu([Gemma4-E4B-it GPU0, Qwen3.5-0.8B GPU1])
         b. If not CARNOT_FORCE_LIVE=1: build blocked artifact, write JSON, exit.
         c. Load 30 GSM8K questions (HuggingFace gsm8k test split → synthetic fallback)
         d. Run live inference with Gemma4-E4B-it (BatchedInferenceRunner, batch_size=8)
         e. Label each response (is_correct, ground_truth_answer)
         f. For each extractor [ArithmeticExtractor, LLMExtractor(llm_caller=live_qwen),
            LLMz3Formalizer(llm_caller=live_qwen)]:
            - Run extractor on each response
            - Measure: TP (extractor fires on wrong answer), FP (extractor fires on correct answer)
            - Compute detection_rate = TP/(TP+FN), fp_rate = FP/(FP+TN)
         g. Run VerifyRepairPipeline with each extractor on wrong-answer responses
         h. Build ExtractorComparisonResult per extractor
         i. Build artifact: schema="carnot.extraction_comparison.v1", per_extractor_results,
            winner_extractor, honest_verdict, inference_mode
         j. Output: results/experiment_367_extraction_live.json
      5. Write tests/python/test_experiment_367_extraction_live.py (100% coverage required).
      6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      7. Reconcile: update ops/conductor-log.md, ops/changelog.md, ops/status.md.
         If honest_verdict=live_gpu_winner, document which extractor won and by how much.
      Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp368-live-precision-pipeline
