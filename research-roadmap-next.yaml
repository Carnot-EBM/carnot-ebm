- id: exp1296-prior-failures-activation-audit
  milestone: 2026.04.101
  deliverable: results/experiment_1296_prior_failures_activation_audit.json
  title: "Prior-Failures Activation Audit - Prevent Milestone .100 DOOMED_RERUN_BLOCK Waste"
  agent_type: codex
  model: gpt-5.5
  max_turns: 20
  estimated_wall_time_min: 15
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1230-roadmap-prior-failure-linter
      verdict: incomplete_prior_coverage_historical
      addressed_by: "Run the existing prior-failure and gate-audit scripts against the .101 roadmap before any SOTA task activates."
      retire_if_same_verdict: true
    - experiment_id: exp1282-sota-gguf-cache-provenance-preflight
      verdict: blocked_gate_check_failed
      addressed_by: "This audit emits terminal prior_failures_coverage_ok and current-milestone proxy fields for .100 artifacts before the cache preflight reruns."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Milestone .100 wasted multiple conductor attempts because carry-forward tasks
    omitted prior_failures metadata and hit DOOMED_RERUN_BLOCK before science ran.
    This task is the activation gate for .101. Use {project_root} as the project
    root and {date} as the run date in artifact metadata.

    EXISTING CODE TO READ FIRST:
    - scripts/validate_prior_failures.py
    - scripts/audit_roadmap_gates.py
    - scripts/conductor_priors_autofill.py
    - scripts/roadmap_schema.py
    - research-roadmap-next.yaml
    - results/experiment_1283_certificate_grammar_backend_bakeoff.json
    - results/experiment_1288_interwhen_dvi_verifier_feedback_replay.json
    - results/experiment_1295_milestone_retro_100.json

    TASK:
    Write a terminal activation-audit artifact for the .101 roadmap. Do not edit
    scripts/research_conductor.py and do not modify research-roadmap.yaml.

    REQUIRED ARTIFACT FIELDS:
    - status
    - prior_failures_coverage_ok
    - roadmap_gate_audit_passed
    - exp1283_grammar_backend_available
    - exp1288_memory_update_written
    - n_prior_failures_missing
    - n_gate_upstream_failures
    - n_gate_field_cross_ref_failures
    - activation_blockers
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1296_prior_failures_activation_audit.json immediately with status="in_progress".
    2. Run or import scripts/validate_prior_failures.py against research-roadmap-next.yaml and capture its schema and prior-failure findings.
    3. Run or import scripts/audit_roadmap_gates.py against research-roadmap-next.yaml and capture gate upstream and field cross-reference findings.
    4. Read the .100 artifacts for exp1283 and exp1288. Emit exp1283_grammar_backend_available=true only if exp1283 says the grammar backend is available; emit exp1288_memory_update_written=true only if exp1288 wrote memory.
    5. If either audit fails, write activation_blockers with exact task IDs and fields. If both audits pass, write prior_failures_coverage_ok=true and roadmap_gate_audit_passed=true.
    6. Finish with status="complete" and honest_verdict set to activation_audit_passed or activation_audit_blocked.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1296_prior_failures_activation_audit.json')); print(d.get('prior_failures_coverage_ok'), d.get('roadmap_gate_audit_passed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1297-sota-gguf-cache-provenance-preflight-v2
  milestone: 2026.04.101
  deliverable: results/experiment_1297_sota_gguf_cache_provenance_preflight_v2.json
  title: "SOTA GGUF Cache + Provenance Preflight v2 - Prior-Failure Metadata Complete"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 20
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  gated_on:
    - upstream: exp1296-prior-failures-activation-audit
      artifact_field: prior_failures_coverage_ok
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1282-sota-gguf-cache-provenance-preflight
      verdict: blocked_gate_check_failed
      addressed_by: "The .101 activation audit now checks prior_failures before this preflight activates."
      retire_if_same_verdict: true
    - experiment_id: exp1271-triggered-certificate-extraction-sota-gguf
      verdict: blocked_gate_check_failed
      addressed_by: "This task only checks local cache/provenance and records missing models before any extraction rerun."
      retire_if_same_verdict: true
    - experiment_id: exp785-sota-model-load
      verdict: blocked_model_load_failed
      addressed_by: "Use cached_sota_pair() and record load blockers instead of retrying the same failed load path silently."
      retire_if_same_verdict: true
    - experiment_id: exp811-sota-model-load
      verdict: blocked_model_load_failed
      addressed_by: "Use the current SOTA registry and make all missing/cache states explicit."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    The .100 SOTA cache preflight never ran because prior-failure metadata was
    incomplete. This v2 preflight must prove whether the mandated SOTA GGUF cache
    path is ready before downstream SOTA tasks spend GPU time. Use {project_root}
    as the project root and {date} as the run date in artifact metadata.

    Required local headline models:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - results/experiment_1296_prior_failures_activation_audit.json
    - results/experiment_1282_sota_gguf_cache_provenance_preflight.json

    TASK:
    Write a cache/provenance readiness artifact for mandated SOTA GGUF inference.
    Do not download models unless the existing resolver already performs a safe
    cache lookup.

    REQUIRED ARTIFACT FIELDS:
    - status
    - cached_sota_ready
    - headline_result_possible
    - models_used
    - missing_models
    - model_specs_preview
    - provenance_ok
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1297_sota_gguf_cache_provenance_preflight_v2.json immediately with status="in_progress".
    2. Import or inspect python/carnot/inference/sota_models.py and call cached_sota_pair(gpu_indices=(0, 1)) if import is safe.
    3. Record all three mandated model IDs, which ones are cached, model_path values, quantization suffixes, and whether cached_sota_pair() returns two loadable MODEL_SPECS.
    4. Write cached_sota_ready=true only if at least one mandated SOTA GGUF is cached and cached_sota_pair() returns non-null specs. Otherwise write cached_sota_ready=false and missing_models.
    5. Include prior-failure coverage from exp1296, provenance_ok, headline_result_possible, models_used, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1297_sota_gguf_cache_provenance_preflight_v2.json')); print(d.get('cached_sota_ready'), d.get('headline_result_possible'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

