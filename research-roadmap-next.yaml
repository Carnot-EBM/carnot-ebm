        verdict: "blocked_insufficient_token_probability_energy_features_and_flagged_TAUTOLOGY: methodology duration duplicated another field and token-probability rows were insufficient."
        addressed_by: "Different from Exp5345: this task is a feature audit first, reports exact missing rows, forbids copied duration fields, and only gates downstream diagnostics if real rows exist."
        retire_if_same_verdict: true
      - experiment_id: exp5331-gated-internal-energy-receipt-harness-v486
        verdict: "complete: token_probability_receipt_ready but no logits/attention/hidden-state proxies and methodology remained flagged."
        addressed_by: "Different from Exp5331: this corrigendum focuses on backend feature sufficiency and clean methodology rather than broad internal-energy readiness."
        retire_if_same_verdict: true
      - experiment_id: exp5163-mmlu-pro-verifier-rescale-v473
        verdict: "complete_mmlu_pro_fewshot_verifier_vs_cheap_delta_+0.025_CI95_[-0.125,0.175]_CI_includes_0"
        addressed_by: "Different from Exp5163: this task does not train, rescale, or evaluate an external generated-text/logprob scorer; it audits internal token-probability features only."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Run from {project_root} on {date}. Token-probability energy remains blocked. The only acceptable next step is a clean feature audit and tiny internal-signal receipt, not another external text scorer.

      EXISTING CODE TO READ FIRST:
      - CODEX.md
      - CLAUDE.md
      - ops/exclusion_manifest.yaml
      - scripts/experiment_template.py
      - research-references.md
      - results/experiment_5345_tokenprob_energy_corrigendum_v487.json
      - results/experiment_5331_internal_energy_receipt_harness_v486.json
      - results/experiment_5331_internal_energy_receipt_schema_v486.json
      - results/experiment_5337_sota_runtime_corrigendum_multimodel_v487.json

      TASK:
      Produce a methodology-clean token-probability feature audit. If real token-probability rows are available, emit a tiny receipt; otherwise write a blocked artifact naming the missing backend features.

      Deliverable: `results/experiment_5353_tokenprob_feature_audit_corrigendum_v488.json`.

      CONCRETE STEPS:
      0. PRECONDITIONS: record GPU visibility, selected backend, selected model path, token-probability API availability, and retired-scope check.
      1. Define MODEL_SPECS in the artifact:
         - unsloth/Qwen3.6-35B-A3B-GGUF
         - unsloth/gemma-4-31B-it-GGUF
         - unsloth/gemma-4-26B-A4B-it-GGUF
