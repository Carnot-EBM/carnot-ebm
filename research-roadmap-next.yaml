    title: "Repair de-tautology protocol"
    priority: critical
    max_turns: 40
    estimated_wall_time_min: 35
    track: "code_repair"
    inference_substrate: "aggregation"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3028-sota-repair-clean-methodology-rerun-v2
