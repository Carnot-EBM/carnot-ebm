  residual missing_verifier_gap_live_frontier_not_separated; (2) the registry transfer_dead_ends, verbatim on >=5 persisted
  primitives -- "candidate generation remains the residual bottleneck"; (3) the 2026-06-23 re-diagnosis
  (arc-representation-not-the-bottleneck-2026-06-23.md, SUPERSEDES the perception memory) ruling out representation (v3
  LOO-AUROC 0.725), compute-cost (fixed .429), and distribution-shift (fixed .430) -- all fixed, STILL no live lift. The
  operator named it 2026-06-22 (energy-config-space): the wall is MAKE-A-WINNER-APPEAR, NOT SELECT. .431 STOPS adding
  selection levers and attacks GENERATION via the SOTA-flagged structural methods (the .429/.430 D ingestion +
  structural-deepening-sota-ingestion-2026-06-24.md flagged these for .431): A1 (HEADLINE) hierarchical subgoal search over
  the live E3 frontier (arXiv:2604.03208/2506.07255/2504.04366/2605.12913/1011.0686) reusing .430 A1 goal-induction as a
  subgoal PROPOSER + .430 A2 value head as a within-subgoal TIE-BREAKER, gated on a STEP-1 decisive diagnostic that resolves
  0.04-vs-0.59 and pinpoints L1-first-contact vs L2-deepening (offline-null-may-be-a-harness-artifact discipline); A2 (second
  independent generation mechanism) PoE-World factored-executable subgoal planner (arXiv:2505.10819/2605.05138). A3 banks +1
  (59->60+) + trains the verifier; A4 keeps the package operator-resubmit-ready (>33). Plus persist+transfer (A5),
  SUBMITTED_AGENT_CONFIG integration (A6), 2 infra (B1 generation-coverage CI-metric + honest first-win floor / B2
  adversarial_verify subgoal-decomposition + coverage-baseline guards), 1 hardware (C), 1 SOTA-ingestion (D, directed-exploration
  fallback for .432), capstone (E). Submission operator-only. verifier_is_oracle:false on every value claim. ARC Prize Milestone
  #1 deadline 2026-06-30 (6 days).
milestone_title: 'CANDIDATE GENERATION ("make-a-winner-appear"), NOT SELECTION -- six milestones (.425-.430) of verifier/selection
  levers all NULLED on live solve-rate. .430 grew capability 58->59 (A3 dc22 L2) but BOTH headline mechanisms nulled: A1
  L2-goal-induction RETIRED (single_exemplar_goal_insufficient, control-failed), A2 DAgger-lite corrected the distribution-shift
  0.699->0.0 but gave ZERO live lift (missing_verifier_gap_live_frontier_not_separated). The honest fixed-harness generic
  first-win is 0.04 (1/25 games, only lp85), NOT 0.59 -- the wall is UPSTREAM of selection. The convergent residual (A2
  live-frontier-not-separated + the registry "candidate generation remains the residual bottleneck" + the operator''s 2026-06-22
  make-a-winner-appear steer) relocates the wall to GENERATION; the representation is done (v3 LOO-AUROC 0.725), compute-cost +
  distribution-shift are fixed. .431 PIVOTS to the SOTA-flagged structural generation methods: A1 (HEADLINE) hierarchical
  subgoal search over the live E3 frontier reusing the .430 levers as COMPONENTS (goal-induction->subgoal proposer; value
  head->within-subgoal tie-breaker), gated on a STEP-1 decisive diagnostic (resolve 0.04-vs-0.59; L1-first-contact vs
  L2-deepening); A2 (second mechanism) PoE-World factored-executable subgoal planner. A3 banks +1 (59->60+) + trains the
  verifier; A4 keeps the package >33. Plus persist+transfer (A5), integration (A6), 2 infra (B1/B2), 1 hardware (C), 1
  SOTA-ingestion (D), capstone (E). 6 days to the ARC Prize Milestone #1 deadline (2026-06-30).'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  The 6th consecutive bridge_crossed_for_solve=FALSE proved the wall is CANDIDATE GENERATION, not SELECTION. .430 A1
  L2-goal-induction nulled+retired (single_exemplar_goal_insufficient, sc25 reached only L0 generically); .430 A2 DAgger-lite
  corrected the distribution-shift 0.699->0.0 but gave ZERO live lift (missing_verifier_gap_live_frontier_not_separated). A2's
  honest measurement shows the generic agent reaches first-win on only 1/25 games (lp85; first_win_rate=0.04 NOT 0.59) -- the
  value head changes nothing because the winner is not in the candidate pool. The representation is done (v3 0.725),
  compute-cost+distribution-shift are fixed. The operator named the wall 2026-06-22: make-a-winner-appear, not select. .431
  attacks GENERATION from TWO independent SOTA-flagged structural mechanisms on the SCORED E3AgentPolicy, both
  verifier_is_oracle:false, both live-path-reachable. A1 (HEADLINE) is hierarchical subgoal search over the live E3 frontier:
  STEP 1 a decisive diagnostic (resolve 0.04-vs-0.59; pinpoint L1-first-contact vs L2-deepening -- the
  offline-null-may-be-a-harness-artifact discipline), STEP 2 a bounded subgoal-search prototype targeting the CONFIRMED wall
  (mine subgoals from failed search trees + .430 A1 goal-induction as the subgoal PROPOSER; bounded low-level search per
  subgoal with .430 A2 value head as the within-subgoal TIE-BREAKER; live E3 replay-verifies). Gate: the GENERIC agent reaches
  a NEW level where flat search fails, offline-reproduced, with a no-subgoal AND a random-subgoal ablation that do NOT. A2 is
  the PoE-World factored-executable subgoal planner (programmatic object-experts weighted by held-out transition trust; product
  model; subgoal-conditioned plan) -- the strongest answer to A2's no-winner residual because a factored feasibility model is
  what the .429 energy-fitness QD lacked. Gate: candidate-generation COVERAGE up (the winner now appears in the pool where the
  matched flat baseline did not generate it) AND a live first-win/solve lift (CI excludes baseline), offline-reproduced.
  CAPABILITY (A3): self-play banks +1 reproducible level (59->60+) + trains the learned verifier. SCORE (A4): keep the package
  operator-resubmit-ready (>33). Plus persist+transfer (A5), integration (A6), 2 infra (B1/B2), 1 hardware (C), 1
  SOTA-ingestion (D), capstone (E). verifier_is_oracle:false on every value claim; solve_provenance on every ARC solve;
  submission operator-only. RETIRED (do NOT re-propose): the precise .430 A1 L2-goal-induction single-global-predicate fix
  (single_exemplar_goal_insufficient); the .429 flat energy-fitness QD (no_winner). 6 days to the ARC Prize Milestone #1
  deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC (A1-A6); >=1 level-up attempt
  that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A3); self-play loop EVERY milestone (A3 trains+checkpoints
  the verifier); 2 reserved infra (B1/B2); 1 per-board hardware (C); 1 SOTA-ingestion (D). All experiments codex/gpt-5.5;
  planner/retro stay Claude Opus. 6 days to the ARC Prize Milestone #1 deadline ($25K). The frozen live generator is
