# Carnot Research Roadmap - Milestone 2026.04.19
# "GPU-Accelerated Inference, Calibrated Verification, and Live Benchmark Completion"
#
# CONTEXT: Milestone 2026.04.18 established that:
# - FormalClaimVerifier infrastructure is solid but live benchmark blocked at 21s/case on CPU
# - PredictiveVerifier gate routed ALL cases to FAST_PATH when uncalibrated on live data (-1.7pp)
# - Constraint addition matched description-text proxies, not real inference tokens (+4 FP, 0 gains)
# - CUDA ORT blocked by wrong pip wheel (onnxruntime vs onnxruntime-gpu): one pip install away
# - AMD XDNA NPU blocked (Python 3.14 / VitisAI EP): Python 3.12 venv + .so already present
# - DualGPURunner built in Exp 224b but never wired to benchmark harness
# - 3 HuggingFace publishing "NOW" priorities deferred since milestone 2026.04.4
#
# This milestone completes the solver-routed benchmark with GPU inference,
# calibrates the PredictiveVerifier on live GSM8K data, fixes constraint addition
# to use domain-specific live inference tokens, and publishes to HuggingFace.

milestone: "2026.04.19"
milestone_title: "GPU-Accelerated Inference, Calibrated Verification, and Live Benchmark Completion"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"

tasks:
  # -- Phase 83: GPU Inference Pipeline and Benchmark Completion --
  - id: exp258-dual-gpu-harness
    milestone: "2026.04.19"
    deliverable: scripts/experiment_258_dual_gpu_harness.py
    title: "Exp 258: Wire DualGPURunner to live benchmark harness with batched inference"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: The Exp 2026.04.18 operational retrospective (results/operational_retro_2026_04_18.json)
      identified sequential dual-model GPU loading as the #1 bottleneck (+15% estimated wall time)
      and missing inference batching as #2 (+10%). DualGPURunner was built in Exp 224b
      (python/carnot/inference/dual_gpu.py) and the warm model server in Exp 224a
      (python/carnot/inference/model_server.py), but neither is wired to the benchmark harness
      that all live experiments use. Exp 247 (the solver-routed semantic benchmark) was blocked
      after only 18/200 cases at 21s/case on CPU — with GPU + batching the target is ≤3s/case.
      Use {date} as the run date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - python/carnot/inference/dual_gpu.py
      - python/carnot/inference/model_server.py
      - scripts/experiment_218_live_dual_model_suite.py
      - python/carnot/pipeline/verify_repair.py
      - openspec/capabilities/verifiable-reasoning/spec.md

      TASK: Create scripts/experiment_258_dual_gpu_harness.py

      CONCRETE STEPS:
      1. Read dual_gpu.py and model_server.py to understand the existing DualGPURunner and
         warm model server interfaces. Identify what changes are needed to wire them to the
         shared benchmark harness.
      2. Create a DualGPUBenchmarkHarness class in the script that:
         - assigns Qwen/Qwen3.5-0.8B to GPU 0 and google/gemma-4-E4B-it to GPU 1 via DualGPURunner
         - supports inference batching at batch_size configurable from environment (default 8)
         - adds automatic GPU memory cleanup (torch.cuda.empty_cache()) between benchmark runs
         - wraps the experiment_218_live_dual_model_suite.py interface so existing runners opt in
           without full rewrites (same function signatures, same checkpoint schema)
      3. Add a throughput measurement helper that reports cases/sec per model and flags if the
         ≤3s/case target is not met.
      4. Add a GPU assignment verification step at startup: confirm both GPUs have >20GB free
         VRAM and correct model is assigned to correct device.
      5. Write tests first for GPU assignment, batching, memory cleanup, and harness interface
         compatibility with experiment_218. Tests must achieve 100% coverage on the new module.
         Use CARNOT_FORCE_LIVE=0 mock mode for unit tests.
      6. Add a brief results artifact (experiment_258_harness_report.json) documenting throughput
         achieved in harness validation pass and whether the 3s/case target was met.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_258_dual_gpu_harness.py -q --no-cov -n0
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp259-onnxruntime-gpu
    milestone: "2026.04.19"
    deliverable: results/experiment_259_results.json
    title: "Exp 259: onnxruntime-gpu CUDA EP unlock and PredictiveVerifier benchmark"
    prompt: |
      You are working on the Carnot EBM framework in {project_root}.
      Read CODEX.md and CLAUDE.md for workflow, project context, and code style requirements.

      CONTEXT: Exp 257 (results/experiment_257_results.json) showed that the CUDA ORT path for
      PredictiveVerifier is blocked by a simple missing pip wheel: the default `onnxruntime`
      package does not include CUDAExecutionProvider. The fix is `pip install onnxruntime-gpu`.
      The CPU ORT baseline is 5.8 µs/call (171K calls/s). GPU ORT is expected to be 10-100×
      faster. The PredictiveVerifier ONNX model may already exist at results/jepa_predictor_146.onnx.
      Use {date} as the run date for any new artifact metadata.

      EXISTING CODE TO READ FIRST:
      - results/experiment_257_results.json
      - python/carnot/pipeline/predictive_verifier.py
      - scripts/experiment_257_predictive_verifier_hardware.py

      TASK: Create results/experiment_259_results.json

      CONCRETE STEPS:
      1. Install onnxruntime-gpu in the project venv. Use the CUDA 12 build:
         pip install onnxruntime-gpu (this replaces the existing onnxruntime package).
         Verify that ort.get_available_providers() includes 'CUDAExecutionProvider' after install.
      2. Check if results/jepa_predictor_146.onnx exists and is loadable. If not, export the
         PredictiveVerifier from python/carnot/pipeline/predictive_verifier.py to ONNX.
      3. Benchmark CUDA ORT vs CPU ORT (match the methodology from Exp 257: 5000 timed calls,
         warm-up 100 calls, same feature vector shape).
      4. Record: hardware_path (onnx_cuda), latency_us, throughput_calls_per_sec, gpu_memory_mb,
         ort_version, providers_used, speedup_vs_cpu_ort, speedup_vs_cpu_numpy.
      5. If CUDA ORT install fails or model export fails, emit an honest blocker artifact with the
         exact error and next action. Do not fabricate GPU numbers.
      6. Write or update tests first for the CUDA EP detection, model load, and benchmark artifact
         schema. Tests must pass under CARNOT_FORCE_LIVE=0 mock paths where GPU is unavailable.
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_259_onnxruntime_gpu.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

