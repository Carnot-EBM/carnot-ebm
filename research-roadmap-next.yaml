      CONCRETE STEPS:
      1. Implement software simulation of TSU continuous categorical sampling.
      2. Verify parity between LDSB software outputs and TSU simulator outputs.
      3. CRITICAL: write artifact FIRST. Record parity deviation to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2076-e2e-self-learning-kan
    title: "Exp 2076: E2E Test for Self-Learning + KAN"
    deliverable: results/experiment_2076_e2e.json
    max_turns: 50
    prompt: |
