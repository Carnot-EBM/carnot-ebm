      2. Generate or reuse multiple reasoning/candidate paths per case. If live LLM inference runs, use cached_sota_pair() or the nearest available mandated SOTA model from the manifest and record exact MODEL_SPECS.
      3. Construct contrastive assertions for each path and compute logic-consistency diagnostics: negation consistency, intra-group consistency, inter-group consistency, and agreement with exact labels.
      4. Compare the pilot against exp3099 abstention/confidence decisions and report false-positive and false-negative movement separately.
      5. Add a deterministic smoke test or fixture-level assertion for the logic-consistency scoring path.
      6. Write the deliverable artifact.

