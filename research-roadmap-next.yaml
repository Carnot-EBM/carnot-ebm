      - {project_root}/CODEX.md
      - {project_root}/research-references.md
      - {project_root}/results/experiment_5608_kan_longitudinal_self_learning.json
      - {project_root}/results/experiment_5616_exact_nonstationary_constraint_stream.json
      - {project_root}/python/carnot
      - {project_root}/tests/python
      - {project_root}/openspec/capabilities

      TASK:
      Measure the active-spline KAN retention/adaptation boundary across exact drift durations and emit results/experiment_5617_kan_critical_task_duration_map.json.

      CONCRETE STEPS:
      1. Enforce the structured gates before loading the fixture. Freeze the Exp5616 splits, duration cells, metrics, and promotion rules before inspecting outcomes.
      2. Compare at least four arms: frozen/no-update, retain with exact replay, reset/adapt, and loss-smoothed adaptation. Reuse Exp5608's active-spline update and exact gate without causal-memory, PACE, LLM-weight, or external-teacher components.
      3. Run at least five independent seeds and at least 32 held-out stream instances per duration/shift condition. Keep sample order, optimization budgets, and exact-validation calls matched across arms.
      4. Compute Average Lifelong Error, inherited instability, transient relearning error, backward retention, forward transfer, time-to-valid-adaptation, update/rollback counts, and unsafe false accepts separately by space shift, temporal drift, conflict class, and duration.
      5. Estimate the empirical arm crossing and confidence interval without using future held-out labels for selection. Report a fit score and at least two nondegenerate switch cases before declaring a Critical Task Duration. A no-crossing null is valid.
      6. Run update-substitution and frozen-spline controls so a bypassed learner receives no adaptation credit. Preserve checkpoints and an immutable per-update ledger.
