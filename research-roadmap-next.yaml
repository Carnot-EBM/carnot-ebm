        principle: "Terminal prefix required."
      - nexus_session3_improvement: bool — True if session 3 improves detection vs session 1
        principle: "FR-11 Tier 2 primary gate: cross-session learning benefit demonstrated."
      - session_1_detection_rate: float
        principle: "Cold-start baseline: no cross-session memory."
      - session_3_detection_rate: float
        principle: "With memory: should be >= session_1 for Tier 2 to be viable."
      - session_1_violation_rate: float (false positive proxy)
        principle: "Baseline false positive rate."
      - session_3_violation_rate: float
        principle: "Memory should not substantially increase false positives."
      - n_constraint_templates: int — templates synthesized by session 3
        principle: "Quantifies how many patterns NEXUS learned from 2 sessions of experience."
      - module_created: str — path to nexus_constraint_memory.py
        principle: "Deliverable is code artifact."
      - n_examples_per_session: int — must be >= 30 per session
        principle: "Statistical minimum per CLAUDE.md: N >= 30 for rate claims."
      - random_seed: 42
