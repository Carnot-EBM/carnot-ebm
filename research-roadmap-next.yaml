  - id: exp3086-dafny-z3-formal-feedback-pilot
    milestone: "2026.05.288"
    deliverable: "results/experiment_3086_dafny_z3_formal_feedback_pilot_v1.json"
    title: "Dafny/Z3 formal feedback and vacuity pilot"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 120
    track: "verification"
    inference_substrate: "local_sota_gguf_plus_formal_solver"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3071-verge-mcs-smt-correction-pilot
        verdict: "complete: mcs_feedback_ready=true; guided_success_count=5; solver_only_success_count=5"
        addressed_by: "Changes the feedback channel to structural Dafny/Z3 diagnostics and vacuity checks instead of MCS-style feedback alone."
        retire_if_same_verdict: true
      - experiment_id: exp3058-aquaforte-style-llm-guided-smt-pilot
        verdict: "complete: llm_guided_smt_pilot_ready=true; guided_success_count=6; solver_only_success_count=6"
        addressed_by: "Requires measured formal-feedback delta against solver-only and explicit vacuity guards."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Dafny-feedback and uDebug-style work suggests structural verifier feedback and vacuity checks can improve verified-code repair loops. Carnot must preserve exact solver authority.

      MODEL_SPECS
      Headline SOTA local GGUF candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Use at least one of these for live candidate correction if formal tooling is available. Legacy small models are allowed only as legacy_smoke_only=true CPU smoke tests and cannot satisfy formal_feedback_ready.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - research-references.md
      - results/experiment_3071_verge_mcs_smt_correction_pilot_v1.json
      - results/experiment_3083_verifier_hardness_autopsy_protocol_v1.json
      - results/experiment_3084_resyn_exact_fixture_bank_generator_v1.json

      TASK
      Run a tiny formal-feedback pilot using Dafny when available and Z3/execution fallback when Dafny is unavailable.

      CONCRETE STEPS
      0. PRECONDITIONS: check command -v dafny, command -v z3, CUDA/GPU/model cache, and at least one mandated GGUF. If no formal checker is available, write blocked_formal_toolchain_missing and stop. If Dafny is absent but Z3 is present, run Z3-only and set dafny_available=false.
      1. Select 4-8 small fixtures with invalid, vacuous, and repairable specifications.
      2. Generate formal diagnostics, including vacuity or weak-postcondition checks where possible.
      3. Ask a mandated GGUF for corrected candidates using only diagnostics that a verifier loop would expose.
      4. Validate corrected candidates exactly and compare to solver-only or diagnostic-only baselines.
      5. Set formal_feedback_ready=true only if feedback is non-vacuous and exactly validated.

      REQUIRED ARTIFACT FIELDS:
      - formal_feedback_ready: bool (principle: verifier calibration needs a usable formal-feedback artifact)
      - formal_feedback_delta: float (principle: formal feedback must improve over baseline before it gates calibration)
      - dafny_available: bool (principle: toolchain boundaries must be explicit)
      - z3_available: bool (principle: exact fallback availability must be explicit)
      - vacuity_guard_passed: bool (principle: verified-code success must not be vacuous)
      - guided_success_count: int (principle: guided correction benefit must be measured)
      - solver_only_success_count: int (principle: exact baseline must be measured)
      - exact_ground_truth_count: int (principle: formal-feedback claims require exact labels)
      - models_used: list (principle: mandated GGUF use must be auditable)
      - model_specs: list (principle: live LLM evidence must name exact model IDs and cache/runtime paths)
      - legacy_smoke_only_used: bool (principle: tiny models cannot become headline evidence)
      - preconditions_checked: dict (principle: compute and formal-tool assumptions must be explicit)
      - prompt_hashes: list (principle: inputs must be auditable without embedding full prompts)
      - inference_substrate: dict (principle: local GGUF plus formal solver evidence must declare both runtimes)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

