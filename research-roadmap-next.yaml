- id: exp5194-poison-test-cascade-triage-module-v476
  milestone: 2026.07.476
  title: PHASE INFRA-CRITICAL 1/2 -- build a standalone pretest-triage module that detects the
    "agent-shipped-test-references-not-yet-produced-artifact" pattern (4th occurrence this milestone) and
    prepares a scoped, auditable xfail remediation
  priority: critical
  track: infrastructure
  deliverable: results/experiment_5194_poison_test_cascade_triage_module_v476.json
  agent_type: claude
  model: opus
  requires_claude_verified: true
  max_turns: 100
  estimated_wall_time_min: 70
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. Four times now (exp3521/.325, exp3544/.326,
    exp3612/.332, and exp5182/.475), a task's OWN test suite addition references a `results/*.json` path
    that a SIBLING module in the SAME task's `main()` would produce -- but the task hits a wall-clock
    timeout or otherwise fails BEFORE `main()` runs, leaving the test red with no deliverable to satisfy
    it. Because the conductor's pretest gate is SHARED across all subsequent tasks in a milestone (not
    scoped per-task), this single red test then SKIPs or GATE_BLOCKs every remaining task in the milestone
    -- `.475` lost 10 of 12 tasks to exactly this pattern (see `ops/conductor-log.md` 2026-07-03 08:39-09:42
    UTC: "Pre-tests failing, self-heal failed: 1 failed, 116 passed, 15 warnings" repeated ~19 times).

    This is the SAME class of problem `scripts/retro_timing_fallback.py` was built to solve for a
    different symptom (false-zero retro timing): a NEW STANDALONE MODULE the conductor's pretest step can
    import, since no task -- including this one -- may edit `scripts/research_conductor.py` directly.

    EXISTING CODE TO READ FIRST:
    - scripts/retro_timing_fallback.py (the precedent pattern for a standalone module the conductor
      imports without a direct research_conductor.py edit -- read its structure, its docstring's
      "in research_conductor.py, replace X with Y" wiring-instructions convention, and its own test file).
    - scripts/research_conductor.py's pretest-execution function (search for "self-heal" / "Pre-tests
      failing" / wherever the conductor runs `pytest` before launching a task -- read the exact current
      logic to know precisely what a triage module needs to hook into).
    - ops/conductor-log.md 2026-07-03 08:39-09:42 UTC (the exact failure signature this milestone: which
      test failed, what its assertion was, which sibling module's `main()` would have produced the missing
      file).
    - `incident_agent_shipped_test_cascade` (project memory) -- the 4-occurrence incident class this task
      formally closes with tooling instead of manual triage each time.

    CONCRETE STEPS:
    0. PRECONDITIONS: read the CURRENT pretest-execution code path in `scripts/research_conductor.py` in
       full (line numbers may have drifted since any prior description) before designing the hook.
    1. Design the detection signature precisely: a test failure whose assertion error message or traceback
       references a `results/*.json` (or similar deliverable) path, cross-referenced against
       `research-roadmap.yaml`'s current task list to find whether that EXACT path is a DECLARED
       `deliverable` of a task that has not yet completed (vs. a genuinely broken, unrelated test -- do
       not xfail everything red, only this specific, narrow signature).
    2. Build the module (e.g. `scripts/pretest_triage.py`) with a function the conductor's pretest step can
       call: given the pytest failure output + the current roadmap, return whether this specific signature
       matches, and if so, which test(s) to scope an `xfail` marker to (never a blanket `skip` -- per
       CLAUDE.md's Tests Must Run and Assert, every test must still run and assert; `xfail` runs the test
       and records the expected failure, it does not silently vanish it).
    3. The `xfail` remediation must be TIME-BOXED / self-expiring: attach a tracking note (e.g. a comment
       referencing the specific task id whose artifact the test is waiting on) and a condition under which
       it should be removed (the referenced deliverable now exists on disk -- at that point the test should
       naturally pass and the xfail marker becomes a visible "unexpectedly passed" signal, which is itself
       useful telemetry, not a silent no-op).
    4. Write the documented wiring instructions in this module's own docstring, mirroring
       `retro_timing_fallback.py`'s exact convention ("In `scripts/research_conductor.py`, at line X,
       replace/wrap Y with Z").
    5. Write a regression test suite for the triage module itself (this module's own logic needs tests,
       matching the project's 100%-coverage requirement) using `.475`'s actual failure signature as the
       primary test fixture (the exact test name + assertion that failed 19 times in `.475`, reconstructed
       from `ops/conductor-log.md` and the pretest suite's current state).
    6. Confirm this task itself did not modify `scripts/research_conductor.py`.

    REQUIRED ARTIFACT FIELDS:
      triage_module_path:
        value: string
      detection_signature_precision:
        value: "description of what narrowly matches vs. what correctly does NOT match (a genuinely
          broken unrelated test must not be auto-xfailed)"
        principle: "An over-broad triage rule would silently mask real regressions -- exactly the failure
          mode Tests-Must-Run-And-Assert exists to prevent. Precision here is the safety property."
      historical_incidents_matched:
        value: "list of {experiment_id, milestone} -- exp3521/.325, exp3544/.326, exp3612/.332,
          exp5182/.475 -- confirm the detector would have caught all 4 retrospectively"
      wiring_instructions_documented:
        value: bool
      regression_tests_added:
        value: int
      research_conductor_py_untouched_confirmed:
        value: bool
      inference_substrate:
        value: aggregation_from_upstream_artifacts
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_. Must NOT claim the conductor's
          pretest gate is actually patched -- only that a ready, tested triage module + wiring
          instructions now exist, same limitation class as retro_timing_fallback.py's own patch-prep
          precedent."

    Do not push. Do not modify scripts/research_conductor.py.

- id: exp5195-retro-timing-real-fix-known-issues-dedup-v476
  milestone: 2026.07.476
  title: PHASE INFRA-CRITICAL 2/2 -- MANDATORY overdue priority (pending since .469, escalated across 5+
    diagnosis events) -- the retro-timing wiring landed but the false-zero recurred anyway; find the
    deeper cause. Also fix the unrelated known-issues.md 187-copy duplication bug.
  priority: critical
  track: infrastructure
  deliverable: results/experiment_5195_retro_timing_real_fix_known_issues_dedup_v476.json
  agent_type: claude
  model: opus
  requires_claude_verified: true
  max_turns: 100
  estimated_wall_time_min: 80
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. `scripts/retro_timing_fallback.py` (built in `.473`'s
    exp5164) IS confirmed imported and called inside `scripts/research_conductor.py::_run_operational_
    retrospective` -- verify directly: `grep -n retro_timing_fallback scripts/research_conductor.py`
    shows the import at approximately line 2876, inside an `if not experiment_times:` block starting
    around line 2874. This wiring is NOT missing. Yet `results/operational_retro_2026_07_475.json`
    (generated by that same, already-patched code) shows `experiments_completed=0`,
    `total_wall_time_minutes=0`, `reconstructed_from_disk_mtime=False` -- the exact false-zero pattern the
    fix was supposed to eliminate. This is a DEEPER bug than "not wired," and this task's job is to find
    it, not to re-wire something already wired.

    THE PRECISE CODE PATH TO INSPECT (read `scripts/research_conductor.py` lines ~2768-2996 in full before
    forming a theory): the primary git-log path fails BY DESIGN for `.475` (documented in the code's own
    comment: current commit subjects use lowercase `expNNNN` phrasing, never matching the old `"Exp " in
    msg` predicate) -- this is the ALREADY-DIAGNOSED, ALREADY-INTENDED-TO-BE-ROUTED-AROUND failure. The
    call then falls to `build_retro_timing_fallback(current, repo_root=PROJECT_ROOT)` inside a bare
    `except Exception: logger.warning(..., exc_info=True)` block. Given BOTH `reconstructed_from_disk_
    mtime=False` AND `experiments_completed=0`, the most likely explanation is that `build_retro_timing_
    fallback` itself either raised internally for `.475` specifically, or returned an empty
    `experiment_times` list -- and `.475`'s own execution history is genuinely unusual (only 2 of 12 tasks
    produced artifacts; one of those, exp5182, was produced by a direct outer-loop script invocation
    OUTSIDE the conductor's normal task-commit flow, which may not match whatever commit-message or
    activation-boundary pattern `scripts/retro_timing_fallback.py:_activation_bound()` expects when
    resolving the milestone's activation commit).

    CONCRETE STEPS (in this order -- the first two are fast, targeted tests of the leading hypothesis
    before any broader investigation):
    1. Call `scripts.retro_timing_fallback.build_retro_timing_fallback('2026.07.475', repo_root=<repo
       root>)` directly in a throwaway script or REPL and record: does it raise? What does it return?
       Cross-check against `_activation_bound()`'s logic specifically -- does it correctly resolve `.475`'s
       activation point given the milestone was hand-activated via a "PHASE 0 transition" commit rather
       than a generic "[conductor] Activate milestone 2026.07.475" commit? (Note: `git log --grep`
       shows an EARLIER commit `1dbcc55e1 [conductor] Activate milestone 2026.07.475` that predates the
       "PHASE 0 transition" commits -- confirm whether `_activation_bound` finds this earlier commit, and
       whether that produces a time window that incorrectly excludes exp5181/exp5182's later, real work
       via `excluded_pre_activation` filtering.)
    2. Search `journalctl --user -u carnot-conductor --no-pager` (or the daemon's log file if not run via
       systemd) around 2026-07-03 10:46 EDT (the `.475` retro's actual run time, per its artifact's
       timestamp) for the swallowed-exception warning line ("retro_timing_fallback reconstruction also
       failed for %s"). If present, this directly confirms an internal exception and gives you the
       traceback to root-cause from.
    3. Based on steps 1-2's findings, fix the actual root cause. This may be in
       `scripts/retro_timing_fallback.py` itself (a module this task MAY edit, unlike
       `research_conductor.py`) -- e.g. a fix to `_activation_bound()`'s commit-matching pattern to also
       recognize non-generic activation commits, or a fix to whatever specific exception step 2 surfaces.
       If the true fix requires an edit to `scripts/research_conductor.py`'s call site itself (e.g. the
       bare `except Exception` swallowing needs a narrower catch + explicit surfacing), produce a
       ready-to-apply patch file exactly as exp5190 (`.475`, never activated due to the poison-test
       cascade but the underlying design is sound) specified -- verified via `git apply --check`, never
       applied directly to the tracked file.
    4. Add a regression test using `.475`'s ACTUAL conditions as the fixture (2 real artifacts, one
       produced via an atypical commit path, `research-roadmap.yaml` reflecting the `.475` task set) that
       currently reproduces the false-zero bug and is documented to pass once your fix (from step 3) is
       applied.
    5. Run `python3 scripts/retro_timing_fallback.py`'s existing test suite (6 tests per `.473`'s exp5164)
       plus your new regression test; confirm both pass.
    6. If the true root cause turns out to be the LLM retro-writing agent failing to transcribe correct
       Python-side data into its final JSON (a genuinely different bug class from anything above), report
       this honestly and narrow the finding precisely rather than declaring the wiring bug "fixed" when a
       different bug was found -- this investigation has now survived one full "fix" cycle (the wiring
       landed) without resolving the user-visible symptom, so precision in what is and is not actually
       fixed this time is the load-bearing property of this task's artifact.
    7. SEPARATELY (bundled, unrelated bug of comparable size): fix
       `scripts/experiments/run_experiment_1911.py` lines ~62-68, which unconditionally
       `open(path, "a").write(...)` the same fixed `### NEW Phase 4 Canonical Metric MANDATORY` string
       into `ops/known-issues.md` with no idempotency check (187 duplicate copies confirmed on disk, in
       the file's final ~450 lines). Add an idempotency guard (check if the exact section already exists
       before appending), and deduplicate `ops/known-issues.md` down to ONE copy of that section --
       content-preserving cleanup (keep the content, remove the 186 redundant repeats), consistent with
       Documentation Update Rules ("never remove existing content" means substantive content, not
       byte-identical duplicate spam from a bug).
    8. Update `ops/known-issues.md` with a dated note on this task's actual finding (fixed / narrowed /
       still open) for the retro-timing bug specifically.

    REQUIRED ARTIFACT FIELDS:
      retro_timing_root_cause_found:
        value: string
        principle: "State precisely what was actually wrong -- do not conflate 'the wiring exists' with
          'the bug is fixed'; this task exists because those two things came apart once already."
      build_retro_timing_fallback_direct_call_result:
        value: "{raised: bool, exception_if_any: string, returned_experiment_times_count: int}"
      journalctl_exception_found:
        value: bool
      fix_applied_to:
        value: "retro_timing_fallback.py (directly editable) | patch file for research_conductor.py
          (git apply --check verified, not applied) | neither (bug narrowed but not fixed this task)"
      regression_test_reproduces_475_conditions:
        value: bool
      regression_test_passes_after_fix:
        value: bool
      known_issues_md_duplicate_count_before:
        value: int
      known_issues_md_duplicate_count_after:
        value: int
        principle: "Must be 1, not 0 -- this is content-preserving deduplication, not deletion of the
          section itself."
      run_experiment_1911_idempotency_guard_added:
        value: bool
      research_conductor_py_untouched_confirmed:
        value: bool
      inference_substrate:
        value: aggregation_from_upstream_artifacts
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_, and must precisely distinguish
          'root cause found and fixed' from 'root cause narrowed, not yet fully fixed' -- do not declare
          victory on a partial diagnosis a second time."

    Do not push. Do not modify scripts/research_conductor.py.

- id: exp5196-diffusiongemma-vllm-native-retry-v476
  milestone: 2026.07.476
  title: PHASE A1 DiffusionGemma unblock attempt 3 -- vLLM native-support retry (genuinely untried path),
    then HF custom device_map + CPU-offload fallback, then retire the loading thread if both fail
  priority: critical
  track: verification
  deliverable: results/experiment_5196_diffusiongemma_vllm_native_retry_v476.json
  prior_failures:
  - experiment_id: exp5182-diffusiongemma-meta-tensor-rootcause-fix-v475
    verdict: blocked_diffusiongemma_meta_tensor_bug_unresolved_v475
    addressed_by: "exp5182 exhausted 4 device-placement variants within the HF transformers+accelerate
      stack (single-GPU 4-bit NF4 OOM at ~22.6+ GiB despite a 12.864 GiB nominal footprint; auto-balance
      with corrected _no_split_modules reproduced the meta-tensor bug; single-GPU low_cpu_mem_usage=False
      OOM; single-GPU int8 OOM). This task tries two genuinely different, never-attempted paths: (1) vLLM,
      which shipped NATIVE DiffusionGemma support the same day the model released (vllm.ai blog,
      2026-06-10) via a new model-runner-v2 ModelState abstraction -- the project's own `.474` vLLM probe
      (results/diffusiongemma_energy_prior_vllm.log) fell back to the generic Transformers backend inside
      vLLM ('TransformersMultiModalMoEForCausalLM has no vLLM implementation, falling back to Transformers
      implementation'), meaning the native path was never actually exercised; (2) if vLLM-native also
      fails to fit the 2x24GB budget (plausible -- the vLLM blog only demonstrates H100/H200), the
      huggingface/transformers#22018 pattern: a manually pre-configured device_map dict (not \"auto\")
      that explicitly co-locates the tied encoder+decoder modules on GPU 0 while offloading other named,
      non-tied modules to CPU with llm_int8_enable_fp32_cpu_offload=True -- qualitatively different from
      all 4 of exp5182's mitigations, which were either fully-auto or fully-single-device with no partial
      CPU-offload option."
    retire_if_same_verdict: true
  agent_type: claude
  model: opus
  requires_claude_verified: true
  max_turns: 100
  estimated_wall_time_min: 90
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. DiffusionGemma is "the decisive verifier-moat pilot"
    the `.379-.475` verifier-moat arc has been building toward (per
    docs/research-notes/diffusiongemma-energy-guided-diffusion-spec.md). Three attempts have now failed at
    the LOADING stage (never reaching the actual guided-vs-unguided-vs-AR measurement): `.474`'s exp5173
    (5 device_map="auto" variants) and `.475`'s exp5182 (4 more variants, all within the HF
    transformers+accelerate stack). Root cause is now precisely diagnosed (exp5182): DiffusionGemma's
    encoder is a weight-tied mirror of its decoder; multi-GPU auto-balancing breaks the tie (meta-tensor
    failure at forward), while single-GPU placement fixes the tie but needs more memory than either 24GB
    RTX 3090 has alone (OOM'd past 22.6 GiB despite a 12.864 GiB nominal 4-bit weight footprint -- this gap
    is itself worth measuring precisely in this task, since it suggests activation/KV-buffer memory for a
    block-diffusion denoising step may dominate over weight memory in a way autoregressive-generation
    intuitions do not predict).

    This is a HARD requires_claude_verified task (dual-GPU / cross-serving-stack device-placement
