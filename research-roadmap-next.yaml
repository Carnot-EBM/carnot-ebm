          files_edited: ["paper-v6 §3", "research-references.md",
          "ops/known-issues.md"], word_count_added: int}}
        - n_samples: 2 (the original + the confirmation; explicit pair)
        - n_samples_justification: "Codification gated on confirmation;
          n=2 represents both runs that informed the codified numbers."
        - paper_v6_section_3_word_count_added: int
        - both_runs_cited_in_paperv6: bool
        - has_emojis_in_paper_v6: false (CLAUDE.md compliance)
        - acceptance_gate_passed: bool (codification done AND both runs
          cited AND emoji-free AND known-issues MANDATORY appended)
        - acceptance_gate_criteria: "Both runs cited; paper-v6 §3 updated;
          known-issues MANDATORY appended; emoji-free."
        - methodology_note: "If exp1837 confirmation FAILED, this task
          emits honest blocked verdict and does NOT codify. Codification
          locked behind adversarial-confirmation gate per the new
          discipline."
        - optimization_direction: "neither — codification task"
        - honest_verdict: MUST start with terminal prefix OR
          `blocked_confirmation_failed_preliminary_flag`.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp1839-phase4-canonical-decision-gated
