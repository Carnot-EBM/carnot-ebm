- id: exp942-math-repair-sota-v2
  milestone: 2026.04.73
  deliverable: results/experiment_942_math_repair_sota_v2.json
  max_turns: 50
  prior_failures:
    - experiment_id: exp930-math-iterative-self-repair-v1
      verdict: math_repair_zero
      addressed_by: "Exp 930 used gemma-4-E4B-it which has a 12% GSM8K baseline — no room for repair signal. signed_improvement=0.0. Algorithm is correct; model is wrong. This experiment uses a SOTA GGUF model (Qwen3.6-35B-A3B-GGUF or gemma-4-31B-it-GGUF) with ~75% GSM8K baseline, giving repair 63+ percentage points of room."
      retire_if_same_verdict: false
    - experiment_id: exp919-math-iterative-self-repair
      verdict: blocked_gate_check_failed
      addressed_by: "Exp 919 was blocked only because the YAML task lacked prior_failures entries. There was no algorithm failure. This version includes all required prior_failures."
      retire_if_same_verdict: false
    - experiment_id: exp759-iterative-code-repair-live
      verdict: code_repair_zero
      addressed_by: "Exp 759 failed because Qwen3.5-0.8B (0.8B params) was too small. This experiment uses a SOTA model with >70% GSM8K baseline."
      retire_if_same_verdict: true
  title: 'Exp 942: Math Iterative Self-Repair v2 — SOTA GGUF Model (Qwen3.6-35B or Gemma4-31B), 25 GSM8K (GPU, CARNOT_FORCE_LIVE=1)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 905 proved IterativeSelfRepair works for HumanEval code: 4% → 72% (+68pp)
    with Gemma4-E4B-it via GemmaTransformersLoader (live GPU). Exp 930 extended to GSM8K math
    but got zero improvement: baseline=12%, repair=12%, signed_improvement=0.0. Root cause:
    E4B model capability ceiling — 12% baseline leaves no room for improvement signal.
    arXiv 2604.17121 additionally explains that internal state feedback (retry without external
    grounding) cannot work for math because computed state propagates into deep layers and is
    not retrievable in the next forward pass. This experiment uses a SOTA GGUF model
    (Qwen3.6-35B-A3B-GGUF or gemma-4-31B-it-GGUF) with ~70-80% GSM8K baseline, giving
    repair substantial room to improve.

    MANDATORY: Experiment must use at least one SOTA model from CLAUDE.md:
    - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
    - unsloth/gemma-4-31B-it-GGUF (flagship dense)
    - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE)
    Do NOT use gemma-4-E4B-it (proven too small in Exp 930, RETRO-MATH-REPAIR-MODEL-CEILING).

    EXISTING CODE TO READ FIRST:
    - results/experiment_941_preflight_v22.json — sota_model_path (use this if set)
    - scripts/experiment_930_math_iterative_self_repair_v1.py — math repair implementation to extend
    - results/experiment_930_math_iterative_self_repair_v1.json — baseline 12%, repair 12%, signed=0
    - scripts/experiment_905_iterative_self_repair_v1.py — working code repair (for structure)
    - python/carnot/pipeline/gemma_loader.py — GemmaTransformersLoader
    - scripts/experiment_template.py — ExperimentTemplate with setup_gpu()
    - python/carnot/models/ising.py — IsingEBM for energy scoring

    TASK: Implement math iterative self-repair with a SOTA GGUF model on 25 GSM8K questions.
    Report: baseline_accuracy, repair_accuracy, signed_improvement.

    CONCRETE STEPS:
    1. Read CLAUDE.md.
    2. Read results/experiment_941_preflight_v22.json for sota_model_path.
    3. Write scripts/experiment_942_math_repair_sota_v2.py:
       a. ExperimentTemplate(942, "Math Repair SOTA v2",
              "results/experiment_942_math_repair_sota_v2.json", requires_gpu=True)
          tmpl.setup()
       b. Determine model to use (priority order):
          1. sota_model_path from Exp 941 preflight (if set and file exists)
          2. resolve_cached_gguf("unsloth/gemma-4-26B-A4B-it-GGUF") — smallest SOTA
          3. resolve_cached_gguf("unsloth/gemma-4-31B-it-GGUF")
          4. resolve_cached_gguf("unsloth/Qwen3.6-35B-A3B-GGUF")
          If no SOTA model found: write artifact with honest_verdict='sota_model_not_found',
          model_checked=[...], and exit. Do NOT fall back to E4B.
       c. Load model via llama.cpp (for GGUF) with n_gpu_layers=-1 (all layers on GPU).
          Use ExperimentTemplate.setup_gpu() for GPU health check first.
       d. Load first 25 GSM8K test questions (datasets library or hardcoded list).
       e. For each question:
          - Round 0: generate response, extract final numeric answer with regex
          - Check if baseline_answer == ground_truth
          - Record baseline result
          - If wrong (up to 3 repair rounds):
            Build repair prompt: "Your previous answer to this question was [prev_answer].
            Please solve again carefully, showing all arithmetic steps explicitly."
            Generate new response, extract answer, check against ground truth.
          - Use IsingEBM to score all responses (including baseline), select lowest-energy
            as the final answer (energy_selection_step)
          - Record: baseline_passed, repair_passed, final_passed, n_retries, best_energy
       f. Compute: baseline_accuracy, repair_accuracy, final_accuracy (energy-selected),
          signed_improvement = final_accuracy - baseline_accuracy
       g. honest_verdict:
          'math_repair_significant' if signed_improvement > 0.10
          'math_repair_marginal' if 0 < signed_improvement <= 0.10
          'math_repair_zero' if signed_improvement == 0
          'math_repair_negative' if signed_improvement < 0
          'sota_model_not_found' if no SOTA model available
       h. Include: inference_mode='live_gpu', model_id (actual model used), baseline_accuracy,
          repair_accuracy, final_accuracy, signed_improvement.
    4. Write tests in tests/python/test_experiment_942_math_repair_sota.py (100% coverage).
       Mock the GGUF loader and IsingEBM. Test: answer extraction, repair loop, energy selection,
       honest_verdict assignment, sota_model_not_found path.
    5. Add spec entries: REQ-VER-030 (SOTA math repair), SCENARIO-VER-030 (GSM8K SOTA repair loop)
       to openspec/capabilities/verify/spec.md.
    6. Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_942_math_repair_sota_v2.py
    7. Update ops/changelog.md.
    8. Verify results/experiment_942_math_repair_sota_v2.json contains inference_mode and signed_improvement.

    Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_942_math_repair_sota_v2.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp943-math-repair-external-scratchpad
  milestone: 2026.04.73
  deliverable: results/experiment_943_math_repair_external_scratchpad.json
  max_turns: 30
  gated_on:
    - upstream: exp942-math-repair-sota-v2
      artifact_field: signed_improvement
      op: '>'
      value: 0.0
  prior_failures:
    - experiment_id: exp942-math-repair-sota-v2
      verdict: pending
      addressed_by: "Exp 942 is the upstream prerequisite. This experiment is GATED on Exp 942 signed_improvement > 0. If Exp 942 shows no improvement, this experiment does not run."
      retire_if_same_verdict: false
    - experiment_id: exp930-math-iterative-self-repair-v1
      verdict: math_repair_zero
      addressed_by: "Exp 930 failed because E4B model has 12% baseline and because internal state feedback does not work for math (arXiv 2604.17121). This experiment addresses the second root cause: external scratchpad that re-feeds prior error text at the input layer, grounding the next attempt externally."
      retire_if_same_verdict: false
  title: 'Exp 943: Math Repair + External Scratchpad — Re-feed Prior Errors as Input (CPU/GPU, GATED on Exp 942 signed_improvement > 0)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2604.17121 (Topological Trouble with Transformers) explains WHY code repair
    works (+68pp, Exp 905) but math repair with internal retry does not (Exp 930 = 0pp):
    execution tracebacks provide EXTERNAL state feedback that re-enters the model at the input
    layer. Math retry without external grounding loses the error state into deep layers.
    The architecturally-aligned fix for math is an EXTERNAL SCRATCHPAD: after each wrong
    attempt, extract the erroneous reasoning steps, include them verbatim in the next prompt
    as "Previous attempt contained these errors: [errors]". This mirrors the code repair
    execution traceback path exactly — external state re-fed at the input layer.

    GATE: This experiment is GATED on Exp 942 signed_improvement > 0. If Exp 942 found no
    improvement with the SOTA model, this experiment outputs honest_verdict='gated_upstream_no_improvement'.

    EXISTING CODE TO READ FIRST:
    - results/experiment_942_math_repair_sota_v2.json — upstream gate: signed_improvement field
    - scripts/experiment_942_math_repair_sota_v2.py — base implementation to extend
    - python/carnot/models/ising.py — IsingEBM for energy scoring

    TASK: Extend Exp 942 with external scratchpad: extract wrong reasoning steps after each
    failed attempt and feed them back as input context. Compare: scratchpad_accuracy vs
    Exp 942 repair_accuracy.

    CONCRETE STEPS:
    1. Read CLAUDE.md.
    2. Check results/experiment_942_math_repair_sota_v2.json:
       - If signed_improvement <= 0 OR honest_verdict == 'sota_model_not_found':
         Write artifact with honest_verdict='gated_upstream_no_improvement' and exit.
    3. Write scripts/experiment_943_math_repair_external_scratchpad.py:
       a. Load same 25 GSM8K questions as Exp 942. Load same SOTA model.
       b. For each question:
          - Round 0: generate response, extract answer
          - If wrong: extract erroneous steps: use regex to find arithmetic expressions in
            the response that compute to wrong values (e.g., "47+28=76" when 47+28=75)
          - Round 1: prompt = "Previous attempt (included for context):\n[prev_response]\n
            The answer [prev_answer] was wrong. The above reasoning contained errors.
            Solve the problem again from scratch using only correct arithmetic steps."
          - Round 2: prompt includes Round 0 AND Round 1 errors as scratchpad context.
          - Repeat for up to 3 rounds.
          - Use IsingEBM to select lowest-energy attempt as final answer.
          - Record: scratchpad_passed, n_retries, scratchpad_accuracy
       c. Compare: scratchpad_accuracy vs repair_accuracy (from Exp 942 result JSON).
       d. honest_verdict:
          'scratchpad_improves' if scratchpad_accuracy > repair_accuracy_942
          'scratchpad_comparable' if |delta| < 0.05
          'scratchpad_worse' if scratchpad_accuracy < repair_accuracy_942
          'gated_upstream_no_improvement' if gate failed
    4. Write tests (100% coverage). Mock model and scratchpad extraction.
    5. Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_943_math_repair_external_scratchpad.py
    6. Update ops/changelog.md.

    Run: CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_943_math_repair_external_scratchpad.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

