    - {project_root}/scripts/harness_fit_lint.py
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/openspec/capabilities/research-harnesses/spec.md

    TASK:
    Build and run an independent active-YAML versus Markdown contract check.
    Check exact count, order, IDs, titles, deliverables, gates, producer fields,
    prior failures, model rules, routing, existing-path claims, prompt tails,
    and capstone status. Do not activate or rewrite either roadmap.

    CONCRETE STEPS:
    0. Check readable active YAML, the V626 design document, the exclusion
       manifest, and a writable artifact path. Do not require the staging YAML
       at execution. On failure, write terminal blocked evidence with
       inference_substrate_class=blocked_no_run and exact gate_check_summary.
    1. Add REQ-REPORT-7124 and focused RED tests before implementation. Cover
       missing, extra, reordered, duplicated, renamed, and malformed task rows.
    2. Parse Markdown and YAML independently. Do not derive both views from one
       object, constant, parser result, or fixture.
    3. Require milestone 2026.09.626 and exactly 12 full IDs from
       exp7124-v626-contract-preflight through exp7135-v626-capstone.
    4. Normalize Markdown gates to full upstream IDs. Require every structured
       gate producer to occur earlier. Require artifact_field to match a bare
       top-level field in that producer's REQUIRED ARTIFACT FIELDS.
    5. Require all four prior_failures fields, per-unit rows for comparisons,
       run_date, field principles, allowed substrate classes, host venue,
       bounded wall times, explicit Codex routing, verdict_class, blocked
       diagnostics, and the exact two-line prompt tail.
    6. Require paths listed under EXISTING CODE TO READ FIRST to exist at plan
       time. Do not apply that test to forward deliverables or run commands.
    7. Require each local-LLM task to declare MODEL_SPECS and execute at least
       one mandated model in a headline cell. Require ARC level rows to declare
       solve_provenance. Require Exp7127 to have no gate and no requires chain.
    8. Set v626_task_contract_conforms_score=1 only when all 12 rows agree.
       Mismatch is disqualified. A missing prerequisite is blocked. Neither is
       partial.
    9. Run focused tests, YAML parsing, roadmap schema, gate audit, exclusion
       lint, harness-fit lint, artifact validation, adversarial verification,
       row consistency, scoped spec coverage, and root-clutter checks.
    10. REQUIRED ARTIFACT FIELDS: field_principles for every field below;
       preconditions_checked; run_date; inference_substrate
       (aggregation_from_upstream_artifacts: independent Markdown and YAML
       contract parsing); inference_substrate_class (aggregation or
       blocked_no_run); execution_venue (host); duration_s;
       source_artifact_hashes; rows; markdown_task_rows; yaml_task_rows;
       task_contract_rows; title_parity_rows; deliverable_parity_rows;
       gate_contract_rows; gate_producer_rows; prior_failure_rows;
       model_compliance_rows; agent_routing_rows; existing_path_rows;
       wall_time_rows; artifact_field_rows; prompt_tail_rows;
       expected_task_count (12); observed_task_count; expected_id_order;
       observed_id_order; active_roadmap_path;
       staging_file_required_at_execution (false);
       v626_task_contract_conforms_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value whenever honest_verdict starts
       blocked_; verifier_is_oracle (false); verdict_class (positive |
       circular_positive | null | blocked | disqualified | partial);
       honest_verdict consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7124_v626_contract_preflight.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

