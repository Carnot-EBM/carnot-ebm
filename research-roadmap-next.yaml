    prompt: |
      CONTEXT: The Kona endgame asks whether Carnot's energy can drive global optimization
      (non-autoregressive, self-correcting reasoning). exp3440 (.317) found
      energy_is_global_heuristic_hybrid_solves_pure_descent_does_not: pure energy descent
      does NOT solve, but a HYBRID (energy proposes, neural/symbolic refines the residual)
      does — using an UNTRAINED energy. This converges with the .318 P0.1 finding (the
      untrained energy is uninformative, AUROC 0.516). The never-asked question: does the
      TRAINED energy reranker from exp3460 — if it cleared the AUROC 0.55 bar — lift the
      Kona global-opt HYBRID solve-rate above the untrained-energy hybrid? Cached/CPU, no
      live model -> no timeout.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3440_kona_global_opt_correctness_v3.json (the untrained-energy hybrid baseline)
        - scripts/experiment_3440_kona_global_opt_correctness_v3.py (the global-opt harness — reuse/adapt)
        - results/experiment_3460_p01_trained_energy_reranker_vs_self_consistency_v5.json (the trained reranker + its calibration)
        - results/experiment_3461_energy_correctness_calibration_trained_vs_untrained_v2.json (the trained-energy AUROC)
        - reference_dr3_consensus_and_dual_svid + project_dbae_ebm_phase3 (memory) — the Kona/transpilation theory

      TASK: Re-run the Kona global-opt hybrid with the TRAINED energy reranker as the
      proposal heuristic and compare its solve-rate to the untrained-energy hybrid baseline
      (exp3440). If exp3460's trained energy did NOT clear AUROC 0.55, report that the
      hybrid cannot improve and explain why (an uninformative proposal heuristic cannot
      help the hybrid) — an honest negative, not a failure.

      PRECONDITIONS (step 0):
        a. The Kona global-opt harness + benchmark instances present. If not ->
           complete: blocked_kona_harness_unavailable.
        b. The trained reranker from exp3460 loadable. If not -> complete: blocked_trained_energy_unavailable.

      CONCRETE STEPS:
        1. Load the SAME Kona global-opt benchmark instances exp3440 used.
        2. BASELINE: the untrained-energy hybrid solve-rate from exp3440 (carry forward).
        3. TREATMENT: the hybrid with the TRAINED energy reranker as the proposal heuristic
           (energy proposes candidate moves, neural/symbolic verifier refines the residual).
        4. Report solve-rate per arm + the paired delta (trained-hybrid minus untrained-hybrid)
           with significance, and the pure-trained-energy-descent solve-rate (does training
           alone now let pure descent solve, or is the hybrid still required?).
        5. Emit the artifact with clean methodology. Ensure no two conceptually-distinct
           metrics share a bit-identical value (the tautology guard).

