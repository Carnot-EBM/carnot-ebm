    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md
    - {project_root}/python/carnot/experiment_7657_v668_contract_methods.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/publication_gate.py
    - {project_root}/research-references.md
    - {project_root}/openspec/change-proposals/research-roadmap-v668-preserved-20260925.md

    TASK:
    Produce results/experiment_7671_v669_contract_methods.json. Add REQ-REPORT-7671 and the relevant capability requirement before code. Write a thin CLI at scripts/experiments/experiment_7671_v669_contract_methods.py; orchestration belongs in python/carnot/experiment_7671_v669_contract_methods.py and reusable behavior in its capability module. Tests: tests/python/test_experiment_7671_v669_contract_methods.py.
    Execution: inference_substrate_class=aggregation; MODEL_SPECS=[].

    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed progress line immediately. Resolve {project_root} absolutely, authenticate input bytes, and record actual resources. External absence is complete_blocked_<reason>, verdict_class=blocked, with gate_check_summary; partial is only unfinished owned work. Authentication failure is not a scientific null. Never repair credentials or stop foreign processes.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Print completed units and elapsed time inside long loops at least every 60 seconds; stream child output with an owned heartbeat during waits. Keep EVERY silence gap below 600 seconds for the 4800-second hard cap; a silent task can die at 1200 seconds. Checkpoint each completed unit.

    3. Bound EVERY tool call. Write any file over about 200 lines in several calls of about 100-150 lines, with a progress message BETWEEN calls. Split large reads and validation commands. Use /tmp for scratch, scripts/experiments for real entrypoints, and tests/python for tests.

    4. Before implementation add the task REQ-* and SCENARIO-* to the affected capability spec and write meaningful failing tests. Reuse capability modules with a thin CLI, not a copied experiment harness. Freeze affected validation scope and measurement configuration before opening evaluation labels. Preserve existing artifacts and unrelated edits.

    5. Resolve staged authority only if research-roadmap-next.yaml says 2026.09.669; otherwise select the activated roadmap with that milestone. Compare all fourteen ordered tasks Exp7671-Exp7684 against both the design table and machine block, including titles, phases, deliverables, models, substrates and structured gates. Consumed staging is optional. Preserve the V668 design and never activate.

    6. Write docs/research-notes/v669-method-map.md. Account separately for all fourteen V668 task dispositions using original artifacts, logs and pre-gate receipts. Preserve the measured coverage 66/248, prior exposure of all 248 groups, null decision and learning results, and zero exact-supported Qwen proposals. Missing producers have no honest_verdict: label log custody, not invented scientific verdicts. Do not assert authentication was fixed.

    7. Ingest the dated V669 literature review into research-studying.md with relevance, novelty, feasibility and urgency. Adopt argument/modifier/polarity bindings and delayed bounded constraint acquisition, not an Enoki reproduction or inherited regret theorem. Defer KAN/sampling changes and unqualified hardware. Preserve the FoVer 0.9131 anchor and G1-G4 claim boundary.

    8. E2E: cold-read staged and activated-only authority in a private directory; reject deleted/reordered task, wrong gate field, stale milestone, missing Qwen and self-input mutations. Run schema, prior-failure, exclusion, gate, harness-fit, prompt-path, ARC and overdue-priority readers. Contract readiness only records validity.

    9. Run scoped pytest with -n 0 -o addopts=, pinned PYTHONPATH, private COVERAGE_FILE and an existing parent for private --basetemp. Require 100 percent changed-behavior coverage, affected-test spec coverage, scoped Ruff check/format and changed-module mypy; Rust changes also need scoped cargo tests, fmt and clippy. Record unrelated full-suite debt separately; do not add it to acceptance gates after measurement. Run the task E2E and relevant numbered checks from ops/e2e-test-plan.md.

    10. Cold-reduce raw rows independently in a fresh process. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict against the exact terminal candidate; retain exits and log hashes before atomic publication. Failed required checks disqualify the result and zero readiness scores. Exact fixture success is circular_positive; readiness alone is null. Request the CLAUDE.md adversarial review for non-trivial changes.

    11. Reconcile openspec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Apply declared same-verdict retirement to the mechanism, distinguishing resource absence from science. No activation, research-roadmap.yaml edit, generator-weight training, production default promotion, publication, submission or hardware purchase.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: Terminal complete_ prefix; completion is distinct from scientific benefit.
    - verdict_class: Exactly positive | circular_positive | null | blocked | disqualified | partial. Unchanged absent upstream evidence is blocked, never partial.
    - flagged_adversarial: Boolean terminal reader result; flagged evidence cannot open a gate.
    - gate_check_summary: Every blocked result names check, upstream, path, exact field, operator, expected and observed values.
    - acceptance_gate_results: Separate validity, readiness, coverage, freshness, probability, decision utility, retention and efficiency, with measured operands.
    - rows: One record per independent unit and arm with raw metrics, counts, exclusions, censoring and provenance; seeds and views do not enlarge n.
    - sample_size_budget: Intended, observed, eligible, excluded and censored independent groups; prior exposure, effective blocks and limits.
    - inference_substrate: Actual current work in the established vocabulary; inherited model provenance is separate.
    - inference_substrate_class: Actual class plus planned_inference_substrate_class; full generation floor 60s, bounded generation 10s, load-only 2s. Never pad time.
    - MODEL_SPECS: Actual identities plus planned_MODEL_SPECS; every current LLM uses unsloth/Qwen3.8-27B-GGUF, CPU uses []. Also emit reader-compatible model_specs with explicit no-model declaration when needed.
    - model_invoked: Current invocation flag and invocation_counts for loads, forwards, generations and tokens, including attempts/cancellations.
    - execution_venue: host | kv260 | polarfire | gatemate; execution_venue_details holds authenticated host, GPU UUID and owned PID.
    - phase_spans: Disjoint monotonic timings, heartbeat timestamps, completed units and checkpoints; duration_s measures current work.
    - random_seed: Seeds and purposes; reproducibility_checksum binds immutable input bytes, configuration and reducer code.
    - source_artifact_hashes: Distinguish producers, pre-gate receipts and missing evidence; planned outputs are not their own immutable inputs.
    - preconditions_checked: Actual checks; no requirement that planned outputs already exist.
    - validation_receipts: Frozen affected scope, actual commands, exits, log hashes, cold reduction and terminal readers.
    - verifier_is_oracle: True for exact fixture truth; that evidence cannot establish learned-verifier advantage.
    - field_principles: Governing principle beside each measured field and gate.
    - contract_ready_score: 1 only for exact contract equality and required validation; no scientific gate depends on it.
    - prior_dispositions: Exactly fourteen V668 tasks with producer hashes or honest missing-producer custody and no inferred results.
    - method_map_path: docs/research-notes/v669-method-map.md
    - publication_gates: Stable G1-G4 results, unchanged headline and explicit missing evidence.

    Run command: cd {project_root} && JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7671_v669_contract_methods.py --date {date} --output results/experiment_7671_v669_contract_methods.json
    Do NOT push. Do NOT modify scripts/research_conductor.py.
