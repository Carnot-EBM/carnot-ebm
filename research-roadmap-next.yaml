- id: exp2415-dikin-langevin-polytope
  title: 'Phase 3: Dikin-Langevin Polytope Sampler (arXiv:2510.04582) — Formal Convergence'
  milestone: 2026.05.234
  deliverable: results/experiment_2415_dikin_langevin.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prior_failures:
  - experiment_id: exp983-langevin-sb-boltzmann-sampler
    verdict: complete_langevin_sb_validated
    addressed_by: "exp983 implemented a Langevin-Boltzmann sampler. Dikin-Langevin
      (arXiv:2510.04582) is a distinct algorithm: uses the Dikin ellipsoid local geometry
      for near-optimal mixing on polytope-constrained distributions with formal polynomial
      convergence guarantees — distinct theoretical basis from overdamped Langevin."
    retire_if_same_verdict: false
  - experiment_id: exp1011-almc-ode-annealed-sampler
    verdict: complete_almc_ode_validated
    addressed_by: "exp1011 implemented ALMC ODE annealed sampler (annealing-based).
      Dikin-Langevin uses polytope-aware Dikin metric instead of annealing — different
      algorithm class with formal convergence on constrained convex domains (arXiv:2510.04582)."
    retire_if_same_verdict: false
  prompt: |-
    CONTEXT: Dikin-Langevin (arXiv:2510.04582, Oct 2025) applies Dikin-walk Langevin
    dynamics to sampling from distributions constrained to convex polytopes, using the
    Dikin ellipsoid's local geometry for near-optimal mixing. The Dikin step is:
      q_new = q + dt * (-grad_V(q) + sqrt(2) * noise) where noise uses Dikin metric
      Dikin metric M(q) = (1/delta(q)^2) * I, delta(q) = distance to polytope boundary.

    This is the third constrained sampler method (after Projected-Langevin exp2355,
    Kinetic Langevin exp2414) with formal polynomial sample-complexity guarantees.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/samplers/projected_langevin.py (reference architecture)
      {project_root}/results/experiment_2355_projected_langevin.json (PL KL delta +0.333)

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. scipy: .venv/bin/python -c "import scipy; print(scipy.__version__)"
         b. numpy: .venv/bin/python -c "import numpy; print(numpy.__version__)"
         c. CPU only.

      1. Implement DikinLangevinSampler at python/carnot/samplers/dikin_langevin.py:
         For box-constrained Ising [-1, +1]^N (the natural Carnot constraint):
           boundary distance delta(q_i) = min(q_i - (-1), 1 - q_i)
           Dikin metric M(q) = diag(1/delta(q_i)^2)
           Step: q += dt * (-grad_V + sqrt(2/dt) * M(q)^{-1/2} * noise)
           Project back to box if violated.
         Parameters: dt=0.01, n_steps=1000, random_seed=42.

