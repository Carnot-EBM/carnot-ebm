           not True, the mechanism is unproven -> run a SHORTER reproduction attempt and report
           honestly (do NOT hard-block). uv + CUDA + persistent save_dir as in exp4107.
        1. Generate the Sudoku-Extreme dataset if absent:
           `uv run python scripts/data/build_sudoku_extreme_dataset.py --output-dir ./data/sudoku_extreme_1k_aug_1k --subsample-size 1000 --num-aug 1000 --eval-ratio 0.01`
