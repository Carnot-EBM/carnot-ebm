        addressed_by: "This task converts the audit's blocking flags into explicit rerun requirements for .306."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      The .305 matrix and capstone blocked promotion because exp3300 had dataflip_gate_passed=false plus critical TAUTOLOGY and DURATION_TOO_SHORT flags, while the repair row had DURATION_TOO_SHORT and substrate/provenance blockers. This task must not launch a new model run; it is a root-cause audit for the next reruns.

