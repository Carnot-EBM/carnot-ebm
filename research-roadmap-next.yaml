        - scripts/experiment_template.py, scripts/adversarial_verify.py (DEGENERATE_CONTROLS + TAUTOLOGY), scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Pre-Launch Preconditions", "Inference-Substrate Declaration", "GGUF tokenizer rule", "Adversarial Artifact Verification + Sample-Size Rigor", "Failed-Experiment Rerun Discipline"

      TASK: requalify the scorer's leak-robustness on the generation corpus + add the CoDiLA scorer-independent control; run the fixed-NFE Prism search vs differentiated controls; report a generation gain, a clean null, or a retirement.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any inference):
           a. PR binary: `ls ~/.cache/llama.cpp-master/build/bin/llama-diffusion-gemma-eval` non-empty.
           b. DiffusionGemma GGUF cached: `ls ~/.cache/huggingface/hub/models--unsloth--diffusiongemma-26B-A4B-it-GGUF/` non-empty. 1x RTX 3090 fits the Q4_K_M (16GB).
           c. The leak-robust scorer loads: `python3 -c "import pickle; pickle.load(open('results/dina_lrm_partial_state_scorer_exp4337.pkl','rb'))"` succeeds. If absent -> honest_verdict `blocked_leak_robust_scorer_unavailable` and STOP.
           d. Conductor stood-down on TRM training; this task does NO training of any kind (test-time search + a small CoDiLA local AR verifier / penalty, NOT generator training).
