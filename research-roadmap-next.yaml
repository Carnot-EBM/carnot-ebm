      verdict: DOOMED_RERUN_BLOCK
      addressed_by: "exp1200 was DOOMED_RERUN_BLOCK because the YAML had no prior_failures field and the failure ledger found 5 scope-overlapping priors. Those priors are the reweighting baseline (which this task supersedes) and infrastructure tasks. This is a NEW mechanism (constraint addition), not a rerun of reweighting."
