  - id: exp2713
    milestone: "2026.05.258"
    deliverable: "results/experiment_2713_pretest_cascade_fix_v1.json"
    title: "Pre-Test Cascade Fix v1: Torch CPU Install + Test Patch + Cache Clear"
    agent_type: codex
    model: gpt-5.5
    max_turns: 25
    track: infrastructure

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .258 — no prior failures for this specific scope.

      exp2700 identified the root cause of 51 consecutive zero-execution milestones:
      tests/python/inference/test_hw_dab.py imports torch as a top-level statement.
      Torch is NOT installed in .venv. When the conductor's smart-subset pre-test includes
      this file, pytest collection fails -> run_tests() returns False -> every task SKIPs.
      Amplifier: MAX_HEAL_ATTEMPTS=0 (intentional operator emergency 2026-05-03; cannot modify
      scripts/research_conductor.py from experiment prompts per CLAUDE.md).

      Recovery commands documented in results/experiment_2700_conductor_postmortem_v2.json.

      EXISTING CODE TO READ FIRST:
      - results/experiment_2700_conductor_postmortem_v2.json (recovery_commands, root_causes_identified)
      - tests/python/inference/test_hw_dab.py (current import statement)
      - ops/.pretest-cache.json (if exists — check current fingerprint)

      TASK: Fix the pre-test cascade. Produce pretest_cascade_fixed: bool as the gate for all
      downstream Phase B-D experiments.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `ls tests/python/inference/test_hw_dab.py 2>/dev/null && echo exists || echo missing`
            Record: test_file_exists (bool).
         b. `ls .venv/bin/pip 2>/dev/null && echo exists || echo missing`
            Record: pip_available (bool).
         c. `ls .venv/bin/pytest 2>/dev/null && echo exists || echo missing`
            Record: pytest_available (bool).
         If test_file_exists=false: write honest_verdict 'blocked_test_file_missing' and exit.
         If pip_available=false: write honest_verdict 'blocked_pip_missing' and exit.
         Record: preconditions_checked.

      1. FIX A — Install torch CPU wheel:
         `.venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch 2>&1 | tail -3`
         Record: torch_install_exit_code (int), torch_install_success (bool).

      2. FIX B — Patch test file for graceful import (safe long-term fix):
         Read tests/python/inference/test_hw_dab.py. Find the line `import torch`.
         If the line exists and is NOT already using importorskip:
           Replace `import torch` with the two-line form:
             `import pytest`
             `torch = pytest.importorskip("torch")`
           Write the patched file back.
           Record: test_patched (bool), patch_was_needed (bool).
         Else: Record: test_patched=false, patch_was_needed=false.

      3. VERIFY — run smart subset:
         `.venv/bin/pytest tests/python/test_pipeline_extract.py tests/python/test_docs.py tests/python/inference/test_hw_dab.py -q --no-cov -o addopts= 2>&1 | tail -5`
         Record: smart_subset_passes (bool), smart_subset_output (str — last 3 lines).
         Also run full collection check:
         `.venv/bin/pytest tests/python/ --co -q 2>&1 | tail -5`
         Record: full_collection_clean (bool).

      4. CLEAR CACHE — invalidate stale pretest cache:
         `rm -f ops/.pretest-cache.json && echo cleared || echo not_found`
         Record: cache_cleared (bool).

      5. GATE FIELD: pretest_cascade_fixed = (torch_install_success OR test_patched) AND smart_subset_passes
         Record: pretest_cascade_fixed (bool).

      6. Operator note (add to artifact):
         "MAX_HEAL_ATTEMPTS=0 remains at 0 per 2026-05-03 operator emergency. Operator should
         review whether to set MAX_HEAL_ATTEMPTS=1 in scripts/research_conductor.py now that the
         cascade root cause is fixed. See results/experiment_2700_conductor_postmortem_v2.json
         recovery_commands Step 9 for rationale."
         Record: max_heal_attempts_note (str).

      7. Write results/experiment_2713_pretest_cascade_fix_v1.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix; blocked_pip_missing or blocked_test_file_missing if preconditions fail."
      - pretest_cascade_fixed: bool
        principle: "GATE FIELD for all Phase B-D experiments in .258. True only if smart_subset_passes."
      - torch_install_success: bool
        principle: "Documents whether pip install torch succeeded; alternative is patch-only fix."
      - test_patched: bool
        principle: "Documents whether importorskip patch was applied; long-term safe fix."
      - smart_subset_passes: bool
        principle: "Primary fix verification: conductor's own pre-test path confirmed green."
      - full_collection_clean: bool
        principle: "Confirms no OTHER collection errors lurk that could cause future cascades."
      - cache_cleared: bool
        principle: "Stale cache must be cleared for conductor to re-evaluate next iteration."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records test_hw_dab.py + pip + pytest existence."
      - duration_s: float
        principle: "pip install + test run: expected >= 30s; < 5s suspicious."

      Do NOT modify scripts/research_conductor.py.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


