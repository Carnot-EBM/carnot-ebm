      3. Extract all three Exp6323 wall-clock failures from the conductor log. Record no invented honest_verdict.
      4. Search the conductor queue and archive for Exp6330-Exp6336. Record their proposal-only state.
      5. Validate the 13 V546 tasks with the repository schema, prior-failure linter, gate audit, exclusion lint, and deterministic custom checks.
      6. Add tests for missing artifacts, ghost IDs, duplicate IDs, bad gates, missing model obligations, and malformed prompt endings.
