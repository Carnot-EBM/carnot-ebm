    - {project_root}/ops/conductor-log.md
    - {project_root}/research-roadmap-next.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/openspec/change-proposals/research-roadmap-v679-preserved-20260928.md
    - {project_root}/python/carnot/experiment_7809_v679_contract_methods.py
    - {project_root}/results/experiment_7822_v679_capstone.json
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py

    TASK:
    Bind this design and YAML, preserve V679 authority and write docs/research-notes/v680-method-map.md. Use existing readers without adding another contract framework.
    Deliverable: {project_root}/results/experiment_7823_v680_contract_methods.json.

    CONCRETE STEPS:
    0. PRECONDITIONS: Print a flushed start line. Check explicit input paths, hashes, schemas, exact gate operands and resources before compute. Distinguish science producers from conductor pre-gate receipts. Missing external inputs produce complete_blocked_* with verdict_class=blocked and gate_check_summary; never substitute old or simulated results.
    1. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess call. Include elapsed seconds and completed units. Emit status within long loops and while supervising children at least every 60 seconds, keeping every gap below 600 seconds. Poll tools at most 60 seconds apart; stop only owned children at their deadline. Never pad runtime.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines, with a progress message between calls. Keep each tool call bounded, including file creation. Save completed independent units so work can resume without duplicating measurements.
    3. Before implementation, add task-owned REQ-* and SCENARIO-* requirements to the applicable capability spec. Freeze the complete affected module/test closure and exact required validation commands prospectively. Write meaningful failing tests first. Preserve assertions and historical evidence; do not skip, xfail, weaken guards or relabel failed required checks diagnostic.
    4. Reuse existing low-level functions and explicit-path readers. Do not invoke a historical experiment main or copy a large runner solely to stamp a new experiment number. A thin current entrypoint must inherit all obligations of reused behavior, including affected consumers. Test the real CLI dispatcher against the frozen command names, argv and required/diagnostic classes; reject undeclared children. Keep validation logs in unique attempt paths. Create pytest parents first, wait for child exit and closed handles, then seal completed log bytes once at durable content-addressed paths. Cold-check hashes after sealing and test a later retry plus byte mutation.
    5. CHANGE FROM PRIOR FAILURE: Exp7809 failed formatting of its CLI, not table agreement. Reuse pure readers, repair that named formatting obligation if inherited, and bind new immutable V680 authority with preregistered shortcut/abstention controls.
    6. Compare the literal task table, embedded V680 JSON and matching staged/active YAML: exactly fourteen ordered tasks Exp7823 through Exp7836. Compare titles, phases, deliverables, model lists, substrate classes and all gates. Snapshot exact bytes and hashes under docs/research-notes/v680-authority-snapshots/. No science task depends on this administrative readiness.
    7. Use unchanged schema, exclusion/prior-failure, gate, harness-fit, ARC-floor and priority readers. Reject private missing/reordered task, stale-document, missing retirement flag, wrong model and misspelled upstream-field mutations. If reusing the Exp7809 CLI behavior, first fix its named formatting defect and retain its required command roster.
    8. Register all protocols before science: distributional-EBM-inspired shortcut/abstention tests, observed-label masking, CCHD controls, CoEV deletion, delayed memory and hardware bandwidth. Preserve the oracle-distinct corrigendum and label all 640 families exposed development data. No new literature search is needed unless a cited input changed.
    9. Record V679 failure operands and the exact current task that addresses each. Do not rerun source qualification or the unchanged organic ARC panel. A disqualified old result may diagnose a defect but cannot provide benefit evidence.
    10. Run the frozen affected tests and require 100% statement coverage of every new/changed module and CLI path. Combine explicitly named completed coverage files with identical branch settings; verify shard exits before combining. Use PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov for non-coverage runs. Run scoped Ruff check and format, mypy, and scripts/check_spec_coverage.py on explicit test files. Fix owned formatting and coverage defects before expensive measurement; do not change a frozen command list after seeing failure.
    11. Run the task-specific real-entrypoint E2E and applicable ops/e2e-test-plan.md checks. Reduce raw rows in a fresh process and run scripts/adversarial_verify.py plus scripts/verdict_row_consistency_lint.py --strict on the exact candidate. Keep censored, fallback, null and unstarted units. Where a check is inapplicable, register and justify that before execution. Broad repository health is a separately declared 180-second diagnostic with serial pytest and a heartbeat, never a full-suite pass. Historical full-suite obligations remain failed; they cannot be removed by invoking a renamed wrapper.
    12. Write the exact deliverable atomically after owned validation. Failed required checks disqualify and zero readiness; scientific nulls remain valid terminal results. External absent/retired/blocked inputs use blocked, not partial. Partial is only unfinished owned work that another attempt can complete. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Apply retire_if_same_verdict to the listed scope. Do not activate, publish, change production defaults, alter old artifacts, or modify guards.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, milestone, run_date: Bind the current task, 2026.09.680 and {date}; each result has one owner. principle: Preserve the stated evidence boundary.
    - honest_verdict: Terminal complete_* string, including complete_blocked_* for unchanged external absence; do not invent a scientific verdict from a queue skip. principle: Preserve the stated evidence boundary.
    - verdict_class: One of positive | circular_positive | null | blocked | disqualified | partial. Partial is retryable incomplete owned work only; claim strength travels with the result. principle: Preserve the stated evidence boundary.
    - flagged_adversarial: Actual terminal-reader boolean; quarantined evidence cannot open readiness gates. principle: Preserve the stated evidence boundary.
    - gate_check_summary: [] or failed check records with upstream id, path/hash, field, op, expected and observed value. Required for every blocked verdict; a missing field is a contract defect. principle: Preserve the stated evidence boundary.
    - rows: Per-family/seed/arm or per-check records, raw paths and metrics; every comparative claim must be recomputable from its independent units. principle: Preserve the stated evidence boundary.
    - acceptance_gate_results: Separate validity, readiness, probability_quality, decision_benefit, retention and efficiency; unmeasured values are null. principle: Preserve the stated evidence boundary.
    - duration_s, phase_spans: Measured monotonic timings, without padding; planned and actual work must be distinguishable. principle: Preserve the stated evidence boundary.
    - random_seed, reproducibility_checksum: Code, input, configuration and seed hashes; replay requires exact provenance. principle: Preserve the stated evidence boundary.
    - sample_size_budget: Intended, eligible, started, completed, excluded, censored and independent N; views and seeds do not create independent families. principle: Preserve the stated evidence boundary.
    - source_artifact_hashes: Exact input paths, digests, dates, roles and eligibility; never hash the task output as its own input. principle: Preserve the stated evidence boundary.
    - preconditions_checked: Actual checks before compute; cheap prerequisite failures precede expensive work. principle: Preserve the stated evidence boundary.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, repository_health: Exact argv, classifications, exits, durable log hashes, changed-code coverage, E2E and cold replay; scoped success is not repository-wide health. principle: Preserve the stated evidence boundary.
    - verifier_is_oracle, claim_scope: Fixtures/exact-label checks use circular_positive, never an oracle-distinct win. All existing 640 source families are exposed development data. principle: Preserve the stated evidence boundary.
    - field_principles: Record the reason for each field and gate; the evidence contract must remain understandable. principle: Preserve the stated evidence boundary.
    - inference_substrate, inference_substrate_class: aggregation_from_upstream_artifacts, aggregation. Record planned versus actual class if blocked before compute. principle: Preserve the stated evidence boundary.
    - MODEL_SPECS, model_specs, model_invocation_counts: []; record actual calls/tokens/file hashes. Empty arrays and zero calls when no LLM is used. principle: Preserve the stated evidence boundary.
    - contract_ready_score: 1 only after unchanged readers and literal table/JSON/YAML equality pass; administrative agreement grants no science readiness. principle: Preserve the stated evidence boundary.
    - authority_snapshot_paths, method_map_path: Immutable authority and methods with hashes; future rollover cannot invalidate this record. principle: Preserve the stated evidence boundary.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7823_v680_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
