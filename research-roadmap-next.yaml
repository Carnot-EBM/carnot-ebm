milestone: 2026.05.141
milestone_title: "Phase-18: KAN-Guided EBM Generation, Dual-GPU Scaling, and MoE Distillation"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1814-dual-gpu-profiling
    title: "Exp 1814: Dual RTX 3090 GPU Setup and VRAM Profiling"
    prompt: |
      CONTEXT: The previous milestone identified the lack of a Dual RTX 3090 GPU Baseline as a critical gap.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`
      TASK: Implement a basic profiler to measure load time, VRAM usage, and throughput for Dual RTX 3090 setups.
      CONCRETE STEPS:
      1. Create `python/carnot/pipeline/dual_gpu_profiler.py`.
      2. Measure dummy tensor allocation across both GPUs using JAX.
      3. Generate the artifact `{project_root}/results/experiment_1814_gpu_profile.json` with the metrics.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
    model: opus
    max_turns: 100

  - id: exp1815-sota-inference-pipeline
    title: "Exp 1815: 3B SOTA Model Inference Pipeline"
    gated_on:
      - upstream: exp1814-dual-gpu-profiling
        artifact_field: success
        op: "=="
        value: true
    prompt: |
      CONTEXT: We need to scale our experiments to the mandated SOTA local GGUF models.
      EXISTING CODE TO READ FIRST: `python/carnot/models/`
      TASK: Create an inference pipeline capable of loading `unsloth/Qwen3.6-35B-A3B-GGUF`, `unsloth/gemma-4-31B-it-GGUF`, and `unsloth/gemma-4-26B-A4B-it-GGUF`.
      CONCRETE STEPS:
      1. Create `python/carnot/models/sota_pipeline.py` with `MODEL_SPECS = ["unsloth/Qwen3.6-35B-A3B-GGUF", "unsloth/gemma-4-31B-it-GGUF", "unsloth/gemma-4-26B-A4B-it-GGUF"]`.
      2. Ensure it leverages JAX bindings or a GGUF backend to load these models.
      3. Generate `{project_root}/results/experiment_1815_sota_load.json` indicating load success.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1816-gsm8k-baseline
    title: "Exp 1816: GSM8K Baseline using 3B Models on Dual GPUs"
    gated_on:
      - upstream: exp1815-sota-inference-pipeline
        artifact_field: success
        op: "=="
        value: true
    prompt: |
      CONTEXT: We must establish definitive GSM8K benchmark numbers using real GPU inference on RTX 3090.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/sota_pipeline.py`
      TASK: Run a subset of GSM8K using the new SOTA pipeline.
      CONCRETE STEPS:
      1. Create `python/carnot/eval/gsm8k_sota_eval.py` setting `MODEL_SPECS = ["unsloth/Qwen3.6-35B-A3B-GGUF"]`.
      2. Run generation on 50 GSM8K problems and measure baseline accuracy without verification.
      3. Save results to `{project_root}/results/experiment_1816_gsm8k_baseline.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1817-kan-verifier
    title: "Exp 1817: Implement Continuous KAN Verifier"
    prompt: |
      CONTEXT: Following arXiv:2602.04567, KANs can act as high-efficiency verifiers.
      EXISTING CODE TO READ FIRST: `python/carnot/kan/`
      TASK: Implement a Continuous Kolmogorov-Arnold Network to verify intermediate LLM decoding steps.
      CONCRETE STEPS:
      1. Add continuous verification mode to `python/carnot/kan/cikan_core.py`.
      2. Write a unit test verifying constraint satisfaction on a dummy token sequence.
      3. Generate `{project_root}/results/experiment_1817_kan_verifier.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
    agent_type: codex
    model: gpt-5.5

  - id: exp1818-verify-repair-scaling
    title: "Exp 1818: Verify-Repair Scaling on GSM8K using 3B Models"
    prompt: |
      CONTEXT: We need to test if Verify-Repair helps at 3B scale.
      EXISTING CODE TO READ FIRST: `python/carnot/eval/gsm8k_sota_eval.py`
      TASK: Run verify-repair loop on GSM8K using the new verifier pipeline.
      CONCRETE STEPS:
      1. Wrap the SOTA pipeline with the verifier using `MODEL_SPECS = ["unsloth/gemma-4-26B-A4B-it-GGUF"]`.
      2. Evaluate on the same 50 GSM8K problems.
      3. Save accuracy difference to `{project_root}/results/experiment_1818_vr_scaling.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1819-kan-latency-eval
    title: "Exp 1819: Evaluate KAN Decoding Latency vs Accuracy"
    prompt: |
      CONTEXT: Verify the efficiency claims of KAN-based verifiers.
      EXISTING CODE TO READ FIRST: `python/carnot/kan/cikan_core.py`
      TASK: Benchmark the latency overhead of the KAN verifier on the 3B model pipeline.
      CONCRETE STEPS:
      1. Measure token-per-second with and without the KAN verifier active using `MODEL_SPECS = ["unsloth/gemma-4-31B-it-GGUF"]`.
      2. Generate `{project_root}/results/experiment_1819_kan_latency.json` with the performance delta.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1820-moe-online-distillation
    title: "Exp 1820: Continuous Online Distillation for MoE Routers"
    prompt: |
      CONTEXT: Implement continuous self-learning via online distillation (arXiv:2604.08912).
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/sota_pipeline.py`
      TASK: Build a continuous learning loop that distills successful EBM constraints into the router.
      CONCRETE STEPS:
      1. Create `python/carnot/training/moe_distill.py` using `MODEL_SPECS = ["unsloth/Qwen3.6-35B-A3B-GGUF"]`.
      2. Setup an online replay buffer that fine-tunes the router logits during inference.
      3. Log the distillation loss to `{project_root}/results/experiment_1820_moe_distill.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1821-thermo-gradients-bbim
    title: "Exp 1821: Map Thermodynamic Gradients to BBIM"
    prompt: |
      CONTEXT: Inspired by arXiv:2509.11234, mapping discrete constraints to continuous energy landscapes for hardware.
      EXISTING CODE TO READ FIRST: `crates/carnot-gpu/src/`
      TASK: Implement gradient mapping in Rust for the Bounce-Bind Ising Machine.
      CONCRETE STEPS:
      1. Modify BBIM modules to accept continuous energy gradient constraints.
      2. Write a Rust unit test validating the gradient descent flow.
      3. Export test results to `{project_root}/results/experiment_1821_thermo_bbim.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
    agent_type: codex
    model: gpt-5.5

  - id: exp1822-bbim-rtl-synth
    title: "Exp 1822: FPGA Bitstream Synthesis for Continuous EBM Constraints"
    prompt: |
      CONTEXT: We need to synthesize the updated BBIM with thermodynamic mappings for the KV260.
      EXISTING CODE TO READ FIRST: `rtl/`
      TASK: Run Yosys/NextPNR synthesis for the new BBIM RTL.
      CONCRETE STEPS:
      1. Update the Makefile to synthesize the new constraints module.
      2. Run the synthesis flow.
      3. Record utilization and timing in `{project_root}/results/experiment_1822_rtl_synth.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
    model: opus
    max_turns: 100

  - id: exp1823-final-gsm8k-eval
    title: "Exp 1823: EBM-CoT GSM8K Final Evaluation with Continuous Self-Learning Loop"
    prompt: |
      CONTEXT: Combine all Phase 18 advances into a final evaluation run.
      EXISTING CODE TO READ FIRST: `python/carnot/eval/gsm8k_sota_eval.py`, `python/carnot/training/moe_distill.py`
      TASK: Run the complete system on 100 GSM8K problems.
      CONCRETE STEPS:
      1. Execute the MoE-distilled model with the KAN verifier active using `MODEL_SPECS = ["unsloth/Qwen3.6-35B-A3B-GGUF", "unsloth/gemma-4-31B-it-GGUF"]`.
      2. Record final accuracy, latency, and self-learning delta.
      3. Write to `{project_root}/results/experiment_1823_final_eval.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1824-retro
    title: "Exp 1824: Milestone 2026.05.141 Retrospective"
    prompt: |
      CONTEXT: The milestone has concluded.
      EXISTING CODE TO READ FIRST: `ops/conductor-log.md`
      TASK: Summarize findings, hardware integration results, and online distillation metrics.
      CONCRETE STEPS:
      1. Analyze all JSON artifacts generated in Phase 18.
      2. Identify top 3 gaps for the next phase.
      3. Write to `{project_root}/results/experiment_1824_retro.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
    max_turns: 20
