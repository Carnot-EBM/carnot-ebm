  prompt: "CONTEXT: FR-11 (continuous self-learning) is a MANDATORY program requirement.\narXiv:2603.03538 (Online\
    \ Learnability of CoT Verifiers, March 2026) introduces Littlestone-dimension\nbounds for soundness vs completeness\
