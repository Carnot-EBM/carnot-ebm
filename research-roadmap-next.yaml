    operator_override: "2026-05-29 operator directive (standing): P0.1 (exp3312) is the project's single most important test, and it has NEVER run on an in-band corpus — every attempt was degenerate (GSM8K ceiling 0.908, MATH-L5 floor 0.265, or corpus-too-small). This finally runs the decisive energy-vs-SC comparison on the DIFFICULTY-MATCHED corpus (SC in [0.40,0.70]) using a PROCESS-AWARE step-level energy + OPTIMAL SC+energy aggregation, tautology-clean BY CONSTRUCTION (flip-count primary metric). New (in-band) substrate + the never-executed comparison = the first real verdict, not a doomed rerun. Supersedes exp3472/exp3460/exp3449/exp3312."
