    prompt: |
      CONTEXT: This is THE decisive P0.1 test for .321, and the first time the energy-vs-SC
      comparison runs on an IN-BAND corpus. .319 established GSM8K is at ceiling (SC 0.908,
      trained energy ties SC); .320 found MATH-L5 is at floor (SC 0.265) so exp3472 BLOCKED
      and the comparison never ran. exp3483 builds a DIFFICULTY-MATCHED corpus (MATH-500
      levels 3-4, SC in [0.40,0.70]) where a majority vote carries signal AND a selector has
      room to help. The literature says the win appears WITH HEADROOM from PROCESS-level
      verification: arXiv:2602.11570 (PRIME, +8-9% on AIME from process-aware verification);
      arXiv:2510.13918 (optimal SC+PRM aggregation); arXiv:2502.18581 (self-certainty BoN, the
      cheap baseline to beat); arXiv:2509.23152 (Mirror-Critique: a verifier CAN beat SC by
      recovering minority-yet-correct answers). The never-executed question: on an in-band
      corpus does a PROCESS-AWARE step-level energy + OPTIMAL aggregation BEAT SC at matched
      compute? It invokes NO live model (scores exp3483's cached corpus) so it completes in
      seconds and CANNOT time out.

      EXISTING CODE TO READ FIRST:
        - data/p01_difficulty_matched_generations.jsonl (the IN-BAND corpus from exp3483 — each
          candidate has raw text, extracted answer, correctness label, mean-token logprob, AND a
          parsed step list)
        - scripts/experiment_3472_p01_process_energy_vs_self_consistency_headroom_v6.py (the v6
          scorer — reuse the flip-count + held-out + 7-condition + optimal-aggregation recipe;
          the ONLY change is a corpus that satisfies the headroom precondition)
        - results/experiment_3472_p01_process_energy_vs_self_consistency_headroom_v6.json (the blocked predecessor)
        - python/carnot/verify/ (the FoVer 4-verifier step-error ensemble: fr11_session_memory,
          tier0r_curry_howard, tier0s_arithmetic_gap, tier0u_logical_consistency — applied PER STEP)
        - python/carnot/ (the EORM / energy-reranker module from Exp 443)
        - research-references.md "2026-05-30 Post-.320 Planning Sweep" (PRIME + optimal-agg + Mirror-Critique refs)

      TASK: On the IN-BAND corpus, train a process-aware energy (the FoVer step-error verifier
      scored PER STEP + the trained EORM reranker) with a documented held-out split, fit an
      OPTIMAL SC+energy aggregation, and compare to a VERIFIED-NON-DEGENERATE self-consistency
      baseline at matched compute. PRIMARY metric: the FLIP-COUNT (problems where the energy/
      aggregation choice differs from the SC majority answer) and the net correctness change
      among flips — tautology-clean by construction.

      PRECONDITIONS (step 0, before any comparison is reported):
        a. data/p01_difficulty_matched_generations.jsonl present with >=40 problems, each with a
           greedy + k>=5 sampled generations + per-step traces + correctness labels + logprobs. If
           absent or n<40 -> honest_verdict complete: blocked_p01_corpus_too_small_n=NN (a clean
           complete: so downstream gate-synth/capstone are NOT cascade-blocked).
        b. The FoVer step-error ensemble + EORM/reranker substrate loadable. If not ->
           complete: blocked_energy_substrate_unavailable.
        c. HEADROOM GATE: SC (majority-vote) accuracy over the full corpus in [0.40, 0.78]. If SC
           > 0.78 -> complete: blocked_corpus_at_ceiling_no_headroom_sc=SS; if SC < 0.40 ->
           complete: blocked_corpus_at_floor_no_majority_signal_sc=SS. Report no energy comparison.

      CONCRETE STEPS:
        1. Split by PROBLEM id into TRAIN / HELD-OUT folds (never split samples of one problem
           across folds — leakage). Use k-fold CV if n is small; document split + seed. ALL
           accuracies are held-out only.
        2. PROCESS ENERGY: score each candidate's PARSED STEPS with the FoVer 4-verifier
           step-error ensemble (per-step), aggregate to a candidate process-energy.
        3. TRAINED ENERGY: train the EORM reranker on outcome labels (features = process-energy
           components + logprob + verifier signals); record param count.
        4. OPTIMAL AGGREGATION: fit a principled SC+energy combiner (arXiv:2510.13918) on TRAIN,
           apply on HELD-OUT.
        5. Score 7 conditions on held-out: (1) greedy AR floor; (2) self-consistency (PRIMARY
           control, majority vote); (3) self-certainty BoN (arXiv:2502.18581); (4) process-energy
           argmin; (5) trained-energy-weighted vote; (6) trained-energy x SC hybrid; (7) OPTIMAL
           SC+energy aggregation (the headline condition).
        6. MATCHED COMPUTE: conditions 2-7 consume the SAME k cached generations; energy adds only
           scoring. Report per-condition generation budget + reranker/aggregator param count.
        7. PRIMARY FLIP-COUNT METRIC (tautology-clean by construction): for each energy/aggregation
           condition vs SC, compute (i) flip_count = problems where the condition's selected answer
           differs from the SC majority answer, (ii) flips_correct = flips now CORRECT, (iii)
