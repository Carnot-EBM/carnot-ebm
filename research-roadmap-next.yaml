milestone: "2026.08.559"
milestone_title: "Prospective Latent Energy and Guarded Harness Learning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6483-v559-latent-energy-sota-ingestion
    milestone: "2026.08.559"
    deliverable: results/experiment_6483_v559_latent_energy_sota_ingestion.json
    title: "V559 latent-energy SOTA ingestion and method mapping"
    priority: high
    track: research-infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 45
    prior_failures:
      - experiment_id: exp6461-v556-sota-source-and-benchmark-delta
        verdict: "blocked_primary_source_receipt: primary pages are source receipts only; no product, hardware, model, or ARC execution oracle was invoked."
        addressed_by: "This task defines success as a citation-backed method-to-experiment mapping and a study-ledger update. It states that no product execution occurred, but it does not mislabel that expected boundary as a blocked result."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V559 opens a new non-generation latent-energy track after the finite-ID generated-answer lane retired. The 2026-08-21 planner refresh added anytime-valid sequential evidence, value-of-information routing, atomic skill reuse, actual memory-action audits, and conservative local-to-global energy composition. This task is the required SOTA-ingestion slot. It creates a source-to-method map for the active track. It does not run a model, product, board, or ARC environment. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/research-references.md, and {project_root}/research-studying.md
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/docs/research-notes/search-layer-literature-2026-06-11.md
      - {project_root}/scripts/sweep_clusters.py and {project_root}/scripts/sweep_semscholar.py
      - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/e2e-test-plan.md

      TASK
      Ingest recent primary work for prospective latent energy, exact verification routing, and guarded harness learning. Produce a cited SOTA-to-experiment mapping. Update the study ledger and a V559 research note. Do not use the high-concurrency deep-research harness.

      CONCRETE STEPS
      0. Record repository state, source cutoff time, query terms, and network method. Confirm that the task has no product-execution oracle.
      1. Add or confirm REQ-INFRA-6483 and SCENARIO entries for source identity, citation validity, method mapping, and no-execution boundaries. Write focused tests first.
      2. Read the current reference and study ledgers before searching. Use the low-concurrency arXiv and Semantic Scholar helpers. Use sequential web reads for the top five to eight primary sources.
      3. Cover EBM verification, neural constraints, Ising or probabilistic hardware, hallucination detection, KAN, energy-guided decisions, and continual constraint learning.
      4. Recheck citations to EBT 2507.02092 and ARM-EBM 2512.15605. Recheck OpenReview, Hugging Face Papers, Extropic, GitHub, and Logical Intelligence.
      5. Select three to five methods. For each method, record the exact source, required current Carnot surface, expected test, failure boundary, retired-scope risk, and candidate next task.
      6. Create {project_root}/docs/research-notes/v559-latent-energy-sota-ingestion.md. Update research-studying.md to mark ingested items. Update research-references.md only for a genuine source delta.
      7. Emit one source row per checked primary record and one mapping row per selected method. Do not fabricate a citation, count, product capability, or execution result.
      8. Run focused tests, spec coverage, citation checks, adversarial verification, and applicable documentation checks from ops/e2e-test-plan.md. Inspect git status after tests.

      Required deliverable: {project_root}/results/experiment_6483_v559_latent_energy_sota_ingestion.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal source-ingestion state."
        source_cutoff_utc: "The exact search cutoff."
        query_receipts: "Queries and helper commands."
        primary_source_rows: "One row per checked primary source with URL, date, and claim boundary."
        secondary_source_rows: "One row per requested secondary source."
        method_mapping_rows: "Three to five source-to-current-stack mappings."
        retired_scope_collision_rows: "Explicit checks against the exclusion manifest."
        research_note_path: "The V559 method note."
        study_ledger_updates: "Items marked ingested or deferred."
        no_execution_claim: "True because the task runs no model, product, hardware, or ARC oracle."
        per_unit_rows: "Source and mapping rows make the synthesis checkable."
        aggregate_row_recomputation: "Counts recomputed from rows."
        gate_check_summary: "Required for any blocked_* verdict."
        preconditions_checked: "Required files and search helpers."
        inference_substrate: "primary_source_ingestion_no_product_execution."
        verifier_is_oracle: "False for paper claims."
        field_principles: "Reason for every evidence field."
        field_provenance: "URLs, file paths, and reducer sources."
        random_seed: "Fixed ordering seed."
        duration_s: "Measured task wall time."
        tests_run: "Executed validation commands and exit codes."
        reproducibility_checksum: "Hash over source identities and mapping rows."
        honest_verdict: "States whether a cited actionable mapping was completed."
      ACCEPTANCE GATES:
        - condition: "At least five primary source rows have resolvable URLs and at least three methods map to current code with a falsifiable test."
        - condition: "No product, model, hardware, or ARC execution result is claimed."
      Set inference_substrate=primary_source_ingestion_no_product_execution. Set verifier_is_oracle=false.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6483_v559_latent_energy_sota_ingestion --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6484-non-generation-representation-receipt-contract
    milestone: "2026.08.559"
    deliverable: results/experiment_6484_non_generation_representation_receipt_contract.json
    title: "Non-generation representation receipt contract"
    priority: critical
    track: infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 60
    model: opus
    prior_failures:
      - experiment_id: exp5853-paired-embedding-integrity-audit
        verdict: "disqualified: claim_flip_direction_cell_failure,disaggregated_cell_failure,label_or_pair_permutation_survives,norm_only_or_length_control_failure,raw_model_dimension_identity_shortcut"
        addressed_by: "This task builds a pre-execution contract that keeps model families separate, freezes candidates before model access, persists raw vectors once, and rejects norm, length, label, pair, and native-dimension shortcuts before science runs."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The exclusion manifest preserves paired final-layer representations but closes generated-answer transport. Exp5852 created a three-family representation corpus. Exp5853 disqualified its claim path because several shortcut attacks survived. V559 needs a reusable non-generation receipt contract before it loads the mandated GGUF models. This is reserved infrastructure slot one. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_5852_three_family_paired_embeddings.json
      - {project_root}/results/experiment_5853_paired_embedding_integrity_audit.json
      - {project_root}/python/carnot/experiment_5852_three_family_paired_embeddings.py and its focused tests
      - {project_root}/python/carnot/task_runtime_receipts.py and {project_root}/scripts/experiment_template.py
      - {project_root}/ops/exclusion_manifest.yaml, relevant OpenSpec capability files, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build and validate a reusable receipt contract for fixed prompt-candidate representation passes. The contract must prove that no generation method ran, every candidate was frozen before model access, raw vectors were persisted once, and each model family stayed separate. Use deterministic fixtures and attacks. Do not load a large model.

      CONCRETE STEPS
      0. Record repository state. Confirm the generated-answer and finite-ID patterns are retired. Confirm the paired representation surface is preserved.
      1. Add REQ-INFRA-6484 and SCENARIO entries. Write focused tests first.
      2. Define a receipt schema for prompt hash, candidate hash, pre-model commitment time, model ID, model hash, family, native dimension, vector hash, write count, phase intervals, and no-generation witness.
      3. Build deterministic fixture vectors for at least three different native dimensions. Never pool or concatenate raw dimensions across families.
      4. Add attacks for a generation API call, post-load candidate edit, duplicate vector write, label read before persistence, pooled family vectors, dimension identity, norm-only signal, length-only signal, pair permutation, and claim flip.
      5. Require one durable raw record before any transform. Bind derived features to raw hashes and a frozen transform manifest.
      6. Emit one row per fixture, family, phase, and attack. Set non_generation_surface_contract_ready_score=1.0 only when every invariant passes and every attack fails closed.
      7. Run focused tests, 100% task-module coverage, spec coverage, row lint, adversarial verification, and applicable infrastructure checks. Inspect git status after tests.

      Required deliverable: {project_root}/results/experiment_6484_non_generation_representation_receipt_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal contract state."
        receipt_schema: "Versioned non-generation representation receipt schema."
        fixture_manifest: "Deterministic multi-dimension fixtures."
        candidate_commitment_rows: "Proof that candidate bytes predate model access."
        raw_vector_persistence_rows: "One durable write per raw vector."
        no_generation_receipts: "Proof that no generation API was called."
        family_separation_receipts: "Proof that native dimensions were not pooled."
        transform_manifest: "Frozen transforms bound to raw hashes."
        attack_matrix: "All shortcut and lifecycle attacks."
        non_generation_surface_contract_ready_score: "Same-roadmap downstream gate field."
        per_unit_rows: "Fixture, phase, and attack rows."
        aggregate_row_recomputation: "Ready score recomputed from rows."
        protected_files_unchanged: "Active roadmap and conductor unchanged."
        gate_check_summary: "Required for any blocked_* verdict."
        preconditions_checked: "Retirement and fixture prechecks."
        inference_substrate: "deterministic_representation_contract_no_llm."
        verifier_is_oracle: "True only for deterministic receipt validation."
        field_principles: "Reason for each field."
        field_provenance: "Source paths, hashes, and reducers."
        random_seed: "Fixed attack ordering seed."
        duration_s: "Measured wall time."
        tests_run: "Executed commands and exit codes."
        reproducibility_checksum: "Hash over schema, fixtures, and attacks."
        honest_verdict: "States contract readiness without a model-quality claim."
      ACCEPTANCE GATES:
        - condition: "non_generation_surface_contract_ready_score == 1.0."
        - condition: "Every generation, post-hoc candidate, pooling, identity, norm, length, permutation, and duplicate-write attack fails closed."
      Set inference_substrate=deterministic_representation_contract_no_llm. Set verifier_is_oracle=true only for deterministic receipt validation.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6484_non_generation_representation_receipt_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6485-online-cache-transition-eprocess-contract
    milestone: "2026.08.559"
    deliverable: results/experiment_6485_online_cache_transition_eprocess_contract.json
    title: "Online cache transition and anytime-valid evidence contract"
    priority: critical
    track: infrastructure
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 75
    model: opus
    prior_failures:
      - experiment_id: exp6420-csl-authenticity-safety-audit
        verdict: "complete_null: V552 CSL chain audit completed; reported metrics do not recompute from rows or critical attacks remain open"
        addressed_by: "This task defines lifecycle and sequential-evidence contracts before a learning run. It requires row-derived transitions, actual durable action receipts, duplicate rejection, adaptive-peeking charges, rollback, tombstones, and restart non-resurrection."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Carnot has a default-off factor-cache adapter and positive bounded CSL replays. Independent audits have also found row mismatches, duplicate event paths, and unresolved lifecycle attacks. Recent work on martingales and random times shows that repeated adaptive inspection needs an anytime-valid evidence process. This task creates the reusable contract before V559 runs chronological learning. This is reserved infrastructure slot two. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md and the Continuous Self-Learning section
      - {project_root}/results/experiment_6479_verify_repair_factor_cache_shadow_adapter.json
      - {project_root}/results/experiment_6420_csl_authenticity_safety_audit.json
      - {project_root}/results/experiment_6433_csl_row_recomputation_safety_audit.json
      - factor-cache, rollback, and persistence code under {project_root}/python/carnot/
      - relevant learning OpenSpec files, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build a deterministic contract for chronological cache events, actual persistent actions, and anytime-valid promotion evidence. Validate it with fixtures and attacks. Do not claim learning benefit.

      CONCRETE STEPS
      0. Record repository state and Exp6479 readiness. Confirm this task does not reuse the retired Exp5895 exact-slot requalification.
      1. Add REQ-INFRA-6485 and SCENARIO entries. Write focused tests first.
      2. Define immutable event IDs and monotonic receipts for observe, verify, propose, quarantine, admit, promote, evict, tombstone, rollback, restart, and no-write.
      3. Define an anytime-valid evidence process with a fixed null, update rule, promotion boundary, stopping boundary, and geometric mixture over allowed factor hypotheses.
      4. Charge every adaptive peek. Distinguish a fixed-horizon comparison from an adaptive decision. Never use held events to tune the null or threshold.
      5. Add attacks for duplicate events, backdated writes, stated-write-without-action, action-without-exact-admission, threshold editing, repeated peeking, missing null, rollback omission, tombstone resurrection, and restart drift.
      6. Emit one row per event, action, evidence update, state transition, restart, and attack. Set online_transition_contract_ready_score=1.0 only when all invariants pass.
      7. Run focused tests, 100% task-module coverage, spec coverage, row lint, adversarial verification, and applicable persistence E2E checks. Inspect git status after tests.

      Required deliverable: {project_root}/results/experiment_6485_online_cache_transition_eprocess_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal transition-contract state."
        event_schema: "Immutable chronological event schema."
        action_receipt_schema: "Actual durable action schema."
        evidence_process_spec: "Null, update, mixture, promotion, and stopping rules."
        frozen_null_receipt: "Proof that the null predates adaptive events."
        event_rows: "One row per fixture event."
        action_rows: "One row per durable action or explicit no-action."
        evidence_process_rows: "One row per sequential update and peek charge."
        lifecycle_rows: "Admission, eviction, tombstone, rollback, and restart states."
        attack_matrix: "Duplicate, peeking, authority, and resurrection attacks."
        online_transition_contract_ready_score: "Same-roadmap downstream gate field."
        per_unit_rows: "Event, action, update, and attack rows."
        aggregate_row_recomputation: "Ready score recomputed from rows."
        protected_files_unchanged: "Active roadmap and conductor unchanged."
        gate_check_summary: "Required for any blocked_* verdict."
        preconditions_checked: "Adapter and fixture prechecks."
        inference_substrate: "deterministic_transition_contract_no_llm."
        verifier_is_oracle: "True for exact fixture and receipt validation only."
        field_principles: "Reason for every field."
        field_provenance: "Source paths, hashes, and reducers."
        random_seed: "Fixed fixture and attack seed."
        duration_s: "Measured wall time."
        tests_run: "Executed checks and exit codes."
        reproducibility_checksum: "Hash over schemas, null, rows, and attacks."
        honest_verdict: "States contract readiness without claiming a learning gain."
      ACCEPTANCE GATES:
        - condition: "online_transition_contract_ready_score == 1.0."
        - condition: "Adaptive peeking, duplicate events, missing authority, rollback omission, and resurrection all fail closed."
      Set inference_substrate=deterministic_transition_contract_no_llm. Set verifier_is_oracle=true only for exact fixture and receipt validation.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6485_online_cache_transition_eprocess_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6486-three-family-forced-candidate-representations
    milestone: "2026.08.559"
    deliverable: results/experiment_6486_three_family_forced_candidate_representations.json
    title: "Three-family forced-candidate representation stream"
    priority: critical
    track: verification
    requires_gpu: true
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 240
    model: opus
    prior_failures:
      - experiment_id: exp5853-paired-embedding-integrity-audit
        verdict: "disqualified: claim_flip_direction_cell_failure,disaggregated_cell_failure,label_or_pair_permutation_survives,norm_only_or_length_control_failure,raw_model_dimension_identity_shortcut"
        addressed_by: "This run uses the new Exp6482 prospective exact stream, fixed candidate bytes committed before model load, raw once-only vector persistence, separate model-family cells, and the Exp6484 contract. It does not reuse Exp5852 rows."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6484-non-generation-representation-receipt-contract
        artifact_field: non_generation_surface_contract_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Exp6482 sealed a prospective exact finite-domain stream before model access. Exp6484 defines the non-generation representation receipt contract. The generated-answer path is retired. This task creates new local-SOTA representation evidence by forcing exact-labeled candidate text through a forward or embedding interface. It must not call model generation. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6482_immutable_prospective_constraint_stream_commitment.json
      - {project_root}/results/experiment_6484_non_generation_representation_receipt_contract.json
      - {project_root}/results/experiment_5852_three_family_paired_embeddings.json and its implementation
      - {project_root}/results/experiment_5853_paired_embedding_integrity_audit.json
      - {project_root}/scripts/experiment_template.py and the cached_sota_pair() docstring
      - relevant verification OpenSpec files, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build a new prospective representation stream from fixed correct and controlled-wrong candidates. Run all three mandated local GGUF families with authenticated GPU receipts. Persist raw vectors once before transforms. Keep model families separate. Do not generate an answer.

      CONCRETE STEPS
      0. Before model load, confirm Exp6482 prospective_contract_ready_score=1.0, the Exp6482 hashes match, Exp6484 gate passed, both RTX 3090 devices are visible, required cache paths exist, embedded tokenizers load, disk space is adequate, and no retired generated-answer code path is selected. Emit blocked_precondition with gate_check_summary if any check fails.
      1. Add REQ-VERIFY-6486 and SCENARIO entries. Write focused tests first.
      2. Define MODEL_SPECS by calling cached_sota_pair(). Include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. A legacy model may run only as a labeled CPU smoke control.
      3. Construct at least one exact correct and two controlled-wrong candidates per unit from the committed finite-domain witness and protected clauses. Freeze all candidate bytes and hashes before the first model load.
      4. Use only the runner's embedding or fixed-sequence final-layer interface. Add a call guard that fails if generate, completion, chat completion, grammar decoding, or parser retry code runs.
      5. Persist each raw vector once before normalization. Record native dimension, norm, token length, candidate length, family, model hash, prompt hash, candidate hash, split, seed, device, and monotonic phase receipts.
      6. Keep development and held storage separate. Do not inspect held labels or vectors while defining transforms.
      7. Emit one row per unit, candidate, family, seed, and split. Set prospective_representation_stream_ready_score=1.0 only when all three headline families have complete unique raw rows, contract checks pass, held isolation passes, and no generation call occurred.
      8. Run focused tests, 100% task-module coverage, spec coverage, row lint, adversarial verification, GPU receipt checks, and applicable local-model E2E checks. Inspect git status after tests.

      Required deliverable: {project_root}/results/experiment_6486_three_family_forced_candidate_representations.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal representation-stream state."
        MODEL_SPECS: "All three mandated headline GGUF definitions."
        model_execution_receipts: "Authenticated model, device, load, and forward-pass receipts."
        candidate_commitment_manifest: "Candidate bytes and hashes fixed before model access."
        upstream_commitment_hashes: "Exp6482 and Exp6484 hashes."
        raw_vector_manifest: "Once-only raw vector paths and hashes."
        no_generation_receipts: "Call-guard proof that no generation path ran."
        family_separation_receipts: "Native dimensions and separate family cells."
        held_isolation_receipt: "No held use during transform design."
        phase_concurrency_receipts: "Task-local resource and monotonic phase receipts."
        prospective_representation_stream_ready_score: "Same-roadmap downstream gate field."
        per_unit_rows: "Unit, candidate, family, seed, and split rows."
        aggregate_row_recomputation: "Coverage and readiness recomputed from rows."
        protected_files_unchanged: "Active roadmap and conductor unchanged."
        gate_check_summary: "Required for blocked_precondition or blocked_* verdicts."
        preconditions_checked: "GPU, cache, tokenizer, disk, contract, and commitment checks."
        inference_substrate: "live_local_sota_gguf_fixed_sequence_representation."
        verifier_is_oracle: "False for the model representation; exact labels remain authority."
        field_principles: "Reason for every field."
        field_provenance: "Paths, hashes, devices, and reducers."
        random_seed: "Fixed candidate and execution seed."
        duration_s: "Measured full wall time."
        tests_run: "Executed validation and E2E commands."
        reproducibility_checksum: "Hash over models, candidates, raw rows, and code."
        honest_verdict: "States stream completeness without claiming representation quality."
      ACCEPTANCE GATES:
        - condition: "prospective_representation_stream_ready_score == 1.0."
        - condition: "Every headline family has complete unique rows and zero generation calls."
      Set inference_substrate=live_local_sota_gguf_fixed_sequence_representation. Set verifier_is_oracle=false for model representations.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6486_three_family_forced_candidate_representations --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6487-representation-integrity-audit
    milestone: "2026.08.559"
    deliverable: results/experiment_6487_representation_integrity_audit.json
    title: "Independent representation integrity and shortcut audit"
    priority: critical
    track: verification
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 75
    prior_failures:
      - experiment_id: exp5853-paired-embedding-integrity-audit
        verdict: "disqualified: claim_flip_direction_cell_failure,disaggregated_cell_failure,label_or_pair_permutation_survives,norm_only_or_length_control_failure,raw_model_dimension_identity_shortcut"
        addressed_by: "This audit uses a new prospective stream and an independent reducer. It requires within-family cells and attacks every defect named by Exp5853 before it can emit a readiness field."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6486-three-family-forced-candidate-representations
        artifact_field: prospective_representation_stream_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Exp6486 creates the new forced-candidate representation stream. Exp5853 showed that an apparently complete paired corpus can still be invalid because labels, pairs, norm, length, dimension, or family identity explain the result. This task is an independent audit. It must not trust Exp6486 aggregates or reducers. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6486_three_family_forced_candidate_representations.json and raw row paths
      - {project_root}/results/experiment_5853_paired_embedding_integrity_audit.json
      - {project_root}/python/carnot/experiment_5853_paired_embedding_integrity_audit.py and its focused tests
      - {project_root}/scripts/verdict_row_consistency_lint.py and {project_root}/scripts/adversarial_verify.py
      - relevant verification OpenSpec files, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/e2e-test-plan.md

      TASK
      Reconstruct the Exp6486 stream from raw vector hashes with an independent reducer. Run shortcut, permutation, provenance, and disaggregated-cell attacks. Emit readiness only when no shortcut supports a latent-energy claim.

      CONCRETE STEPS
      0. Confirm the structured gate field exists and equals 1.0. Record Exp6486 artifact and raw-row hashes before reading aggregates.
      1. Add REQ-VERIFY-6487 and SCENARIO entries. Write focused tests first.
      2. Rebuild family, split, pair, label, length, norm, native dimension, prompt, candidate, and duplicate counts from raw rows.
      3. Run label permutation, pair permutation, claim flip, evaluator swap, sign flip, row duplication, split move, and raw-vector mutation attacks.
      4. Fit shortcut-only controls for vector norm, token length, candidate length, prompt identity, candidate identity, row order, model family, and native dimension.
      5. Report every model family separately. Never compare or concatenate raw dimensions across families.
      6. Require all disaggregated family-by-task-family cells to have nonzero correct and wrong support. Mark no-headroom and unsupported cells explicitly.
      7. Emit one row per raw record, recomputed pair, shortcut control, disaggregated cell, and attack. Set representation_integrity_ready_score=1.0 only when all checks pass.
      8. Run focused tests, 100% task-module coverage, spec coverage, row lint, adversarial verification, and applicable audit E2E checks. Inspect git status after tests.

      Required deliverable: {project_root}/results/experiment_6487_representation_integrity_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status: "Terminal independent audit state."
        upstream_hash_receipts: "Exp6486 artifact and raw-row hashes."
        independent_reducer_receipt: "Reducer source and independence proof."
