  - id: exp3083-verifier-hardness-autopsy-protocol
    milestone: "2026.05.288"
    deliverable: "results/experiment_3083_verifier_hardness_autopsy_protocol_v1.json"
    title: "Verifier-as-harder-than-solving autopsy protocol"
    priority: critical
    max_turns: 40
    estimated_wall_time_min: 35
    track: "verification"
    inference_substrate: "aggregation"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3057-local-sota-solution-verifier-gain-panel
        verdict: "complete: solution_verifier_calibration_ready=true; verifier_gain_delta=-0.125; false_negative_rate=1.0"
        addressed_by: "Adds a verifier-hardness and perturbation protocol before another calibration attempt."
        retire_if_same_verdict: true
      - experiment_id: exp3070-first-token-abstention-sota-panel
        verdict: "complete: first_token_panel_ready=true; abstention_precision=0.5; rejection_recall=0.25"
        addressed_by: "Diagnoses why abstention precision missed the gate and defines I-CALM/task-abstention changes before rerun."
        retire_if_same_verdict: true
      - experiment_id: exp3071-verge-mcs-smt-correction-pilot
        verdict: "complete: mcs_feedback_ready=true; guided_success_count=5; solver_only_success_count=5"
        addressed_by: "Requires formal feedback to show lift or vacuity-resistant utility before it can gate repair."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. Recent work warns that LLM verification can be harder than solving. Carnot's local verifier evidence matches that risk: negative verifier gain, low abstention precision, and no formal-feedback lift.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-references.md
      - results/experiment_3057_local_sota_solution_verifier_gain_panel_v1.json
      - results/experiment_3070_first_token_abstention_sota_panel_v1.json
      - results/experiment_3071_verge_mcs_smt_correction_pilot_v1.json
      - results/experiment_3080_capstone_v287.json

      TASK
      Produce a verifier-hardness autopsy and recovery protocol for .288 exact-fixture, abstention, and formal-feedback experiments.

      CONCRETE STEPS
      1. Compare the prior verifier failures to the research-reference findings on verifier hardness, I-CALM, task abstention, self-verification, and formal feedback.
      2. Define perturbation categories that separate solving, verifying, abstaining, and repairing.
      3. Specify non-vacuous acceptance, rejection, abstention, and formal-feedback metrics for exp3084-exp3089.
      4. Define disqualifiers: label leakage, solver-only parity without lift, tautological repair, syntax-only success, and tiny-model headline substitution.
      5. Write a protocol artifact that later tasks must cite.

      REQUIRED ARTIFACT FIELDS:
      - verifier_hardness_protocol_ready: bool (principle: verifier reruns need a failure-aware protocol)
      - prior_failure_modes: list (principle: new experiments must address known negative results)
      - perturbation_categories: list (principle: solving and verification must be separated)
      - abstention_metrics_required: list (principle: reject/accept/abstain must be measured separately)
      - formal_feedback_disqualifiers: list (principle: formal feedback must not be vacuous)
      - repair_disqualifiers: list (principle: repair cannot be syntax-only or tautological)
      - source_artifacts: list (principle: protocol must trace to concrete evidence)
      - inference_substrate: dict (principle: aggregation work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3084-resyn-exact-fixture-bank-generator
    milestone: "2026.05.288"
    deliverable: "results/experiment_3084_resyn_exact_fixture_bank_generator_v1.json"
    title: "ReSyn-style exact fixture bank generator"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 60
    track: "datasets"
    inference_substrate: "exact_solver_and_execution"
    requires_gpu: false
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp3070-first-token-abstention-sota-panel
        verdict: "complete: first_token_panel_ready=true; exact_ground_truth_count=8; abstention_precision=0.5"
        addressed_by: "Builds a larger exact fixture bank before rerunning abstention calibration."
        retire_if_same_verdict: true
      - experiment_id: exp3072-gated-local-sota-verifier-calibration-v2
        verdict: "blocked: gate_failed exp3070.abstention_precision=0.5 < 0.7"
        addressed_by: "Provides enough exact labels and perturbation families to support a non-vacuous v3 gate."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. ReSyn-style work suggests using synthetic environments with verifiers. Carnot needs a larger exact fixture bank before another abstention/verifier/FR-11 attempt.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-references.md
      - results/experiment_3070_first_token_abstention_sota_panel_v1.json
      - results/experiment_3083_verifier_hardness_autopsy_protocol_v1.json
      - python/carnot if relevant
      - tests/python if relevant
      - scripts/experiment_template.py

      TASK
      Implement or assemble a small exact fixture generator and produce a fixture-bank artifact for later .288 tasks.

      CONCRETE STEPS
      0. PRECONDITIONS: confirm the repo has a viable exact-label path through existing validators, Z3, execution tests, or a small self-contained generator. If not, write blocked_exact_label_tooling_missing and stop.
      1. Create or reuse a generator for at least 64 fixtures across at least three families such as SAT/SMT constraints, arithmetic/code assertions, and repairable invalid candidates.
      2. For every fixture, store an exact label, label source, perturbation family, and leakage-safe prompt payload or hash.
      3. Add minimal tests or a validation script if new generator code is created.
      4. Write a manifest path for downstream tasks and summarize family counts.
      5. Do not use an LLM for labels.

      REQUIRED ARTIFACT FIELDS:
      - resyn_fixture_bank_ready: bool (principle: downstream verifier tasks need exact fixtures)
      - exact_fixture_count: int (principle: label volume must be auditable)
      - family_count: int (principle: calibration must not be single-family)
      - fixture_manifest_path: str (principle: downstream tasks need a concrete deliverable path)
      - exact_label_sources: list (principle: labels must trace to exact authority)
      - perturbation_families: list (principle: solving, verification, abstention, and repair cases must be separable)
      - tests_added_or_reused: list (principle: generated fixtures need validation)
      - preconditions_checked: dict (principle: exact-label preconditions must be recorded)
      - source_artifacts: list (principle: fixture generation must trace to prior protocol)
      - inference_substrate: dict (principle: exact-label work must declare no live LLM inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3085-icalm-task-abstention-sota-panel
    milestone: "2026.05.288"
    deliverable: "results/experiment_3085_icalm_task_abstention_sota_panel_v2.json"
    title: "I-CALM and task-abstention SOTA panel v2"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 120
    track: "verification"
    inference_substrate: "local_sota_gguf_plus_exact_fixtures"
    requires_gpu: true
    gated_on:
      - upstream: exp3084-resyn-exact-fixture-bank-generator
        artifact_field: resyn_fixture_bank_ready
        op: "=="
        value: true
      - upstream: exp3084-resyn-exact-fixture-bank-generator
        artifact_field: exact_fixture_count
        op: ">="
        value: 64
    prior_failures:
      - experiment_id: exp3070-first-token-abstention-sota-panel
        verdict: "complete: first_token_panel_ready=true; abstention_precision=0.5; rejection_recall=0.25"
        addressed_by: "Changes the prompt/control design using I-CALM and task-abstention ideas and runs on a larger exact fixture bank."
        retire_if_same_verdict: true
      - experiment_id: exp3057-local-sota-solution-verifier-gain-panel
        verdict: "complete: solution_verifier_calibration_ready=true; verifier_gain_delta=-0.125"
        addressed_by: "Measures abstention before verifier selection and requires exact labels for accept/reject/abstain outcomes."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. The previous first-token panel had exact labels but failed the abstention precision gate. This task reruns abstention with a larger exact fixture bank and I-CALM/task-abstention controls.

      MODEL_SPECS
      Headline SOTA local GGUF candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Use at least one of these for headline evidence. Legacy small models are allowed only as legacy_smoke_only=true CPU smoke tests and cannot satisfy abstention_panel_v2_ready.

