      1. Confirm results/experiment_3108_capstone_v289.json exists and reports capstone_ready=true.
      2. Summarize .289 status: paper_ready, publication_blocker_count, verifier_gain_status, repair_claim_status, fr11_self_learning_status, ebt_arm_status, sampler_hardware_status, gatemate_status, ssqa_status, source_artifacts, missing artifacts, and headline_model_spec_gaps.
      3. Confirm research-roadmap-next.yaml targets milestone 2026.05.290 and points to openspec/change-proposals/research-roadmap-vNEXT.md.
      4. Record carry-forward blockers: 36 publication blockers, local SOTA metadata/cache gap, formal_feedback_v2_ready=false, gated verifier calibration, missing repair micro-panel, FR-11 completeness/retention promotion block, EBT/ARM projection-only, cLUT CPU diagnostic only, and GateMate/SSQA missing operator evidence.
