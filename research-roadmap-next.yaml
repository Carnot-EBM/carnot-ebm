    prompt: |
      CONTEXT
      The planner added the V545 literature refresh before this roadmap was designed. This task checks only work published or materially updated after the V545 marker. It converts the planner source set into an immutable execution contract. Zero accepted findings is a valid terminal result. Source claims remain hypotheses until local artifacts reproduce them.

      EXISTING CODE TO READ FIRST
