      CONTEXT:
      FR-11 Tier 4: empirical validation of continuous self-learning — does multi-cycle ORCA-NEXUS
      learning produce measurable accuracy improvement?

      exp2733 (.259) validated the ORCA-NEXUS single-cycle integration (17 rules from 30 violations).
      This experiment runs 3 sequential learning cycles and measures whether the verifier ensemble
      AUROC improves cycle-over-cycle on a held-out FoVer test set.

      Design:
      - Cycle 1: baseline verifier ensemble AUROC on test set
      - Cycle 1 learning: run ORCA-NEXUS on 20 FoVer violations → synthesize rules → update ensemble
      - Cycle 2: measure verifier AUROC on same test set (should improve if learning works)
      - Cycle 2 learning: run ORCA-NEXUS on 20 additional violations → synthesize rules → update ensemble
      - Cycle 3: measure verifier AUROC on same test set (should continue improving)
      - learning_loop_closed = (auroc_cycle3 > auroc_cycle1) — positive learning signal

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/ttt_loop.py (VerifierDrivenTTT from exp2719/exp2733)
      - python/carnot/verify/nexus_constraint_memory.py (NexusConstraintMemory from exp2695/exp2733)
      - python/carnot/pipeline/verify_repair.py (verify() method)
      - data/fover_corpus.jsonl (FoVer corpus — split into learning and test sets)
      - results/experiment_2733_orca_nexus_integration_v1.json (n_rules_synthesized=17 baseline)

      TASK: Run 3-cycle ORCA-NEXUS self-learning loop. Measure AUROC improvement per cycle.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; import sys; sys.path.insert(0,'python'); import carnot.pipeline"`
