  - id: exp2654
    milestone: "2026.05.253"
    deliverable: "results/experiment_2654_odar_free_energy_routing.json"
    title: "ODAR Free-Energy Routing: Phase 4 Active Inference Gate (arXiv:2602.23681)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    track: pipeline

    prior_failures:
      - experiment_id: exp2639-ttt-scaleup
        verdict: "complete: TTT scale-up N=100; fr11_tier3_headline_closed bool"
        addressed_by: "exp2639 scaled the JEPA/TTT context-adaptation loop (Tier 3). ODAR is fundamentally different: it implements Phase 4 (active inference) by using KL divergence between ensemble prior and posterior as a FREE-ENERGY GATE that decides WHETHER to run verification at all. ODAR doesn't adapt the context — it adaptively skips or triggers verification based on uncertainty. arXiv:2602.23681 vs. exp2639's ANCORA manifold anchoring: different paper, different mechanism."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      arXiv:2602.23681 (ODAR) implements adaptive routing for LLM reasoning via active inference
      principles. Key insight: free energy = KL(posterior || prior); when a fast agent's output has
      LOW free energy (ensemble is confident), skip the slow verification path. When free energy is
      HIGH (ensemble is uncertain), trigger the full deliberative verification path.

      For Carnot: the "prior" is the initial ensemble score on the raw claim; the "posterior" is the
      ensemble score after one repair iteration. KL divergence between these two distributions (pre-
      and post-repair) measures how much the ensemble CHANGED ITS MIND about the claim's energy.

      High KL (ensemble changed a lot) → full repair loop (slow path).
      Low KL (ensemble barely changed) → fast-path skip further iterations.

      This is Phase 4 (active inference hypothesis): the verifier IS the free-energy term α_t × μ_P
      in the active inference loop. ODAR makes this operational.

      Target: odar_overhead_reduction_pct >= 20% (verification calls reduced by >= 20%) while
      maintaining odar_accuracy_retention >= 0.95 (relative to full-verification AUROC).

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline — add ODAR gating here)
      - python/carnot/verify/ (ensemble scoring interface)
      - data/fover_corpus.jsonl (evaluation corpus)

      TASK: Implement ODAR free-energy gating in VerifyRepairPipeline and evaluate overhead reduction.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import numpy; import sklearn"` succeeds.
         b. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         c. python/carnot/pipeline/verify_repair.py exists.
         d. FoVer corpus: {project_root}/data/fover_corpus.jsonl (n_lines >= 200).
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Add ODAR gating to VerifyRepairPipeline:
         def odar_gate(self, context: str, claim: str, kl_threshold: float = 0.05) -> dict:
             """ODAR free-energy gating for VerifyRepairPipeline.
             Per arXiv:2602.23681: the KL divergence between the ensemble's pre-repair and post-repair
             score distributions measures variational free energy. High KL = high uncertainty = run full
             repair loop. Low KL = ensemble confident = fast-path skip.

             Why this implements Phase 4 (active inference): the ensemble score IS the free-energy
             functional F = E - H (energy minus entropy). KL divergence between pre/post is the
             information gain from the verification step — which is exactly alpha_t in the
             active inference free-energy principle (research-program.md Phase 4 track)."""
             score_prior = self.score(context, claim)    # initial ensemble score (prior)
             # Simulate repair: minor semantic perturbation as repair proxy
             repaired = claim.strip() + '.'  # minimal repair for prototype
             score_posterior = self.score(context, repaired)  # post-repair score
             kl_approx = abs(score_posterior - score_prior)   # KL proxy for binary distributions
             fast_path = (kl_approx < kl_threshold)
             return {
                 'score_prior': score_prior,
                 'score_posterior': score_posterior,
                 'kl_approx': kl_approx,
                 'fast_path': fast_path,
                 'verification_skipped': fast_path,
             }

      2. Evaluate ODAR gating on 100 FoVer examples (random_seed=42):
         For each (context, claim, label):
           result = pipeline.odar_gate(context, claim, kl_threshold=0.05)
           Record: fast_path (bool), kl_approx, score_prior, label.

      3. Tune kl_threshold via grid search {0.02, 0.05, 0.10, 0.15, 0.20}:
         For each threshold:
           n_fast_path = count(kl_approx < threshold)
           # AUROC using score_prior for fast-path examples, score_posterior for slow-path
           combined_scores = [r.score_prior if r.fast_path else r.score_posterior for r in results]
           auroc_threshold = roc_auc_score(labels, combined_scores)
           overhead_reduction_pct = (n_fast_path / n_examples) * 100
         Select optimal_threshold = highest threshold where auroc >= 0.95 * full_auroc.

      4. Record final metrics at optimal_threshold:
         odar_overhead_reduction_pct = overhead_reduction at optimal_threshold
         odar_accuracy_retention = auroc_with_odar / full_auroc (fraction retained)
         phase4_active_inference_validated = (odar_overhead_reduction_pct >= 20) AND (odar_accuracy_retention >= 0.95)

      5. Write results/experiment_2654_odar_free_energy_routing.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'complete_'
        principle: "Terminal prefix required."
      - odar_overhead_reduction_pct: float — percentage of verification calls skipped by fast path
        principle: "Primary ODAR metric: >= 20% reduction is the viability threshold."
      - odar_accuracy_retention: float — fraction of full-verification AUROC retained with ODAR
        principle: "Accuracy cost: >= 0.95 retention means ODAR doesn't degrade quality."
      - phase4_active_inference_validated: bool — True iff both targets met
        principle: "Phase 4 gate: ODAR implements active inference; True = Phase 4 hypothesis supported."
      - optimal_kl_threshold: float — best threshold from grid search
        principle: "Operational parameter for production deployment."
      - full_auroc: float — AUROC with full verification (no fast path)
        principle: "Reference for odar_accuracy_retention denominator."
      - auroc_with_odar: float — AUROC with ODAR gating at optimal threshold
        principle: "Primary comparison: should be >= 0.95 * full_auroc."
      - threshold_sweep: list of {threshold, overhead_reduction_pct, auroc}
        principle: "Full sweep documents the accuracy-overhead trade-off."
      - n_evaluated: int
        principle: "Statistical minimum: N >= 30 for rate claims."
      - random_seed: 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Grid search over 5 thresholds × 100 examples takes >= 1s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication record."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2655
