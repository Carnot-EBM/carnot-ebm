        addressed_by: "This task builds on the runtime preflight by checking which logits, hidden states, attention fields, and duration receipts are actually accessible."
        retire_if_same_verdict: true
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 60
    prompt: |
      CONTEXT:
      Repo at {project_root}, run on or after {date}. .481 proved local SOTA GGUF runtime readiness but quarantined the internal hallucination probe because the substrate/duration receipts were not strong enough. This task is a receipts-first telemetry harness and must not claim hallucination-detection quality.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - carnot/inference/sota_models.py or the current cached_sota_pair implementation
      - local GGUF/llama.cpp inference helpers and tests
      - results/experiment_5259_sota_gguf_gpu_offload_preflight_v481.json
      - results/experiment_5263_internal_energy_hallucination_probe_v481.json
      - ops/exclusion_manifest.yaml

      TASK:
      Build and run a strict local SOTA GGUF telemetry harness that records whether logits, token logprobs, hidden states, attention summaries, timing, prompt checksums, output checksums, and GPU/offload receipts are available for downstream internal-verifier experiments.

      CONCRETE STEPS:
      1. Step 0 PRECONDITIONS: confirm GPU visibility, llama.cpp or llama-cpp-python version, model cache paths, free disk, and that at least one mandated SOTA GGUF model is locally resolvable without using AutoTokenizer on a GGUF repo.
      2. MODEL_SPECS for headline telemetry:
         - unsloth/Qwen3.6-35B-A3B-GGUF as flagship_moe
         - unsloth/gemma-4-31B-it-GGUF as flagship_dense
         - unsloth/gemma-4-26B-A4B-it-GGUF as middle_moe
         Tiny legacy models may be used only for CPU smoke tests and must be labeled smoke_test_not_headline.
      3. Use cached_sota_pair() or the repo's current SOTA helper; load GGUFs through local GGUF paths and llama.cpp-backed APIs only.
      4. For each available mandated model, run a tiny deterministic prompt and record accessible telemetry fields. If hidden states or attention are unavailable, record that as capability_absent rather than falling back to text scoring.
      5. Enforce a real duration receipt appropriate to live local GGUF telemetry; do not emit a sub-second artifact for a live-model claim.
      6. Add focused tests for any helper changed by the harness. Do not modify scripts/research_conductor.py.
      7. Write results/experiment_5271_sota_telemetry_receipt_harness_v482.json with REQUIRED ARTIFACT FIELDS:
         - honest_verdict: object with value/principle; value must start with complete: or blocked_ and state whether telemetry receipts are ready.
         - inference_substrate: object with value/principle; use live_llm_internal_telemetry_local_gguf_sota.
         - preconditions_checked: object with value/principle.
         - MODEL_SPECS: object with model ids, roles, quantization/file receipts, and principle.
         - telemetry_harness_ready: bare bool gate field for exp5272 and exp5276.
         - telemetry_harness_ready_principle: string explaining the gate.
         - exposed_telemetry_fields: object with per-model logits/logprobs/hidden/attention availability and principle.
         - duration_receipts: object with per-model wall-clock and principle.
         - gpu_offload_receipts: object with driver/device/offload settings and principle.
         - no_quality_claim: object with value=true and principle.
         - tests_run: list with command/outcome.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

