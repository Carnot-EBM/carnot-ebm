      - scripts/experiment_368_precision_live.py — the existing pipeline script (READ CAREFULLY)
      - python/carnot/pipeline/precision_benchmark.py — PrecisionStackResult, PipelineVariant
      - python/carnot/pipeline/live_gpu_gate.py — LiveGPUGate (from Exp 377)
      - python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu()
      - scripts/experiment_template.py — ExperimentTemplate.setup_gpu()
      - results/experiment_377_gpu_session_fix.json — confirms env fix status

