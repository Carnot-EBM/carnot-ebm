  - id: exp2723
    milestone: "2026.05.258"
    deliverable: "results/experiment_2723_behavioral_entanglement_reweighting.json"
    title: "Behavioral Entanglement Reweighting for Verifier Ensemble (arXiv:2604.07650)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: verifier

    gated_on:
      - upstream: exp2713-pretest-cascade-fix-v1
        artifact_field: pretest_cascade_fixed
        op: '=='
        value: true

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .258 — directly motivated by exp2704 result.

      arXiv:2604.07650 "Behavioral Entanglement and Reweighting Verifier Ensembles" (Apr 2026):
      uniform-weight AND-composition of LLM verifiers is suboptimal due to correlated failure
      patterns ("behavioral entanglement"). De-entangled reweighting using diversity-weighted
      ensemble yielded up to 4.5% accuracy lift.

      exp2704 (.257) showed saturation_k=2, saturation_auroc=0.993, total_lift=-0.003.
      The NEGATIVE total_lift (adding verifiers reduced overall AUROC) is a behavioral entanglement
      signal — the additional verifiers are correlated with the first. De-entangled reweighting
      could restore the expected positive lift.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (list all tier0* verifier modules — need pairwise correlation matrix)
      - data/fover_corpus.jsonl (FoVer corpus)
      - results/experiment_2704_multi_agent_scaling_audit.json (k_auroc_pairs, components_by_auroc)

      TASK: Measure pairwise behavioral entanglement. Apply de-entangled reweighting. Measure AUROC lift.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0` — FoVer corpus.
            If 0 or missing: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         c. `ls python/carnot/verify/tier0*.py 2>/dev/null | wc -l` — count available modules.
            Record: n_components_available (int).
            If n_components_available < 2: write honest_verdict 'blocked_insufficient_verifiers' and exit.
         Record: preconditions_checked.

      1. Load FoVer corpus (80/20 split, random_seed=42). Compute individual verifier scores on
         eval split for each available tier0* module (TF-IDF proxy).
         Record: component_scores (dict: name -> list of scores).

      2. Compute pairwise Pearson correlation matrix of verifier scores.
         Record: correlation_matrix (dict: name_pair -> correlation), mean_pairwise_correlation (float).
         high_entanglement = mean_pairwise_correlation > 0.7 (threshold from arXiv:2604.07650 paper).

      3. Compute de-entangled weights:
         weight_i = 1 - (sum of |corr(i,j)| for j != i) / (n_components - 1)
         Normalize weights to sum to 1.
         Record: diversity_weights (dict: name -> weight).

      4. Evaluate uniform ensemble vs de-entangled ensemble on eval split:
         uniform_auroc: mean of individual scores -> roc_auc
         reweighted_auroc: weighted mean of individual scores -> roc_auc
         auroc_lift = reweighted_auroc - uniform_auroc
         Record: uniform_auroc (float), reweighted_auroc (float), auroc_lift (float).
         reweighting_viable = reweighted_auroc > uniform_auroc AND auroc_lift > 0.001.

      5. Create python/carnot/verify/deentangled_ensemble.py with DeentangledEnsemble:
         - fit(verifier_scores_matrix, labels) -> self (compute weights)
         - predict(verifier_scores_matrix) -> weighted ensemble scores
         Update python/carnot/verify/__init__.py to export it.
         Record: module_created (bool).

      6. Write results/experiment_2723_behavioral_entanglement_reweighting.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - uniform_auroc: float
        principle: "Baseline ensemble AUROC (comparable to exp2704 saturation_auroc=0.993)."
      - reweighted_auroc: float
        principle: "Primary result: AUROC after de-entangled reweighting."
      - auroc_lift: float
        principle: "arXiv:2604.07650 headline: positive lift expected from reweighting."
      - mean_pairwise_correlation: float
        principle: "Behavioral entanglement measure; > 0.7 validates the reweighting motivation."
      - high_entanglement: bool
        principle: "Confirms whether the saturation_k=2 exp2704 result was due to entanglement."
      - reweighting_viable: bool
        principle: "Gate for ensemble v12: True if reweighting provides meaningful lift."
      - module_created: bool
        principle: "DeentangledEnsemble module exists in python/carnot/verify/ after this task."
      - n_components_available: int
        principle: "Confirms how many verifiers participated in correlation analysis."
      - random_seed: int — 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Correlation matrix + reweighting + eval: expected 5-30s; < 1s suspicious."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records sklearn check + FoVer corpus check + verifier count."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


