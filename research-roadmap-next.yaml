  - id: exp6477-backend-neutral-exact-constraint-record
    milestone: "2026.08.557"
    deliverable: results/experiment_6477_backend_neutral_exact_constraint_record.json
    title: "Backend-neutral finite-domain exact constraint record"
    priority: critical
    track: exact-constraints
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    prompt: |
      CONTEXT
      Carnot has many domain-specific exact checkers but no small backend-neutral finite-domain record with replayed semantic parity. arXiv:2608.15143 shows a modular transformation waterfall and identifies negation, auxiliary variables, and nonlinear linearization as translation risks. V557 needs a local exact control before it tests scalar constraint energy. This task is independent of the failed Exp6463 corpus. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/_bmad/prd.md, and the V557 roadmap document
      - the arXiv:2608.15143 entry in {project_root}/research-references.md
      - {project_root}/python/carnot/verify/sat.py, {project_root}/python/carnot/verify/z3_math.py, {project_root}/python/carnot/verify/nco_constraint.py, and {project_root}/python/carnot/verify/ising.py
      - existing typed constraint and energy records under {project_root}/python/carnot
      - relevant verification and verifiable-reasoning OpenSpec files
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, and {project_root}/ops/e2e-test-plan.md

      TASK
      Define a small typed finite-domain constraint record and translate it to Z3 plus an exhaustive exact reference backend. Prove semantic parity on immutable satisfiable and unsatisfiable cases. Derive a scalar violation energy from the same record without granting that scalar release authority.

      CONCRETE STEPS
      0. Record the installed exact backends, versions, solver settings, code hashes, and available CPU budget. Add no required dependency when the existing stack is sufficient.
      1. Add exact-record REQ-* and SCENARIO-* entries. Write focused tests first.
      2. Define a versioned record for finite integer domains, Boolean composition, negation, equality and inequalities, linear arithmetic, all-different, protected constraints, and explicit objective terms.
      3. Reject unsupported nonlinear or ambiguous operations before translation. Preserve source constraint IDs through every backend.
      4. Implement a Z3 translation and a bounded exhaustive reference evaluator for small domains. Do not use one backend's result to construct the other's expected answer.
      5. Seal immutable cases for satisfiable, unsatisfiable, negated, auxiliary-variable, protected-clause, and boundary-value conditions. Include at least five random seeds.
      6. For every case compare satisfiability, witness validity, exact violated constraint IDs, protected violations, objective value, and scalar violation energy.
      7. Attack dropped negation, domain widening, integer-to-Boolean coercion, auxiliary-variable leakage, overflow, duplicate constraint IDs, objective-sign reversal, and matching totals with different violation sets.
      8. Emit one row per case, seed, backend, and attack. Recompute parity and energy aggregates from rows.
      9. Run focused tests, 100% task-module coverage, spec coverage, row lint, adversarial verification, and applicable E2E checks. Inspect git status after tests.
      10. Set exact_constraint_record_ready_score=1.0 only when both exact backends agree on semantics, every witness rechecks, unsupported cases fail closed, and all critical attacks are caught.

      Required deliverable: {project_root}/results/experiment_6477_backend_neutral_exact_constraint_record.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal status distinguishes complete backend parity from a partially implemented translator."
        constraint_record_schema_and_hash:
          principle: "A versioned schema binds every backend and energy computation to the same semantics."
        backend_versions_and_settings:
          principle: "Pinned solver identities and settings prevent backend drift from masquerading as semantic change."
        immutable_case_manifest:
          principle: "Sealed cases prevent result-dependent fixture edits after a disagreement appears."
        translation_receipts:
          principle: "Constraint-ID-preserving receipts expose dropped, rewritten, or invented semantics."
        per_unit_rows:
          principle: "Case, seed, backend, and attack rows make parity independently recomputable."
        satisfiability_parity:
          principle: "Matching satisfiability is the first exact semantic invariant across backends."
        witness_validity_parity:
          principle: "Independent witness replay catches solvers that agree on status but return invalid assignments."
        violation_set_parity:
          principle: "Exact constraint-ID parity prevents matching scalar totals from hiding different failures."
        scalar_violation_energy_rows:
          principle: "Energy rows bind the proposal score to the same exact record without making it an oracle."
        unsupported_operation_rows:
          principle: "Explicit rejection prevents silent approximation of operations outside the record's scope."
        aggregate_row_recomputation:
          principle: "Row-derived parity catches favorable summaries that omit a failing case."
        attack_matrix:
          principle: "Translation attacks test the known negation, domain, auxiliary, and objective-sign failure modes."
        exact_constraint_record_ready_score:
          principle: "A conjunctive gate blocks held energy experiments until exact record semantics are stable."
        protected_files_unchanged:
          principle: "The new record cannot gain parity by altering protected evaluators or conductor logic."
        gate_check_summary:
          principle: "A blocked result must name the backend, case, expected invariant, and observed mismatch."
        preconditions_checked:
          principle: "Backend and version receipts prove exact dependencies existed before cases ran."
        inference_substrate:
          principle: "Declaring exact_solver_replay_no_llm prevents deterministic solver work from being presented as model reasoning."
        verifier_is_oracle:
          principle: "Exact backends are authoritative only within the declared finite-domain record."
        field_principles:
          principle: "A principle map preserves the semantic reason for every parity field."
        field_provenance:
          principle: "Case hashes, backend receipts, and reducers make each field traceable."
        random_seed:
          principle: "Declared seeds reproduce generated small-domain cases and attack ordering."
        duration_s:
          principle: "Wall time detects skipped exhaustive enumeration or backend execution."
        tests_run:
          principle: "Executed tests prove the translator, evaluator, attacks, and reducers ran."
        reproducibility_checksum:
          principle: "The checksum binds schema, cases, backend settings, code, and result."
        honest_verdict:
          principle: "The verdict states exact parity, bounded failure, or unsupported scope without overclaiming global solver equivalence."
      ACCEPTANCE GATES:
        - condition: "exact_constraint_record_ready_score == 1.0"
          principle: "Held scalar-energy work is invalid if the underlying exact record changes meaning across backends."
        - condition: "Violation IDs and witness validity match, not only satisfiability or scalar energy totals."
          principle: "Coarse agreement can hide semantic drift that later changes protected decisions."
      Set inference_substrate=exact_solver_replay_no_llm. Set verifier_is_oracle=true only within the declared record. A blocked_* verdict requires gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6477_backend_neutral_exact_constraint_record --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6478-identifiable-held-exact-energy-selection
    milestone: "2026.08.557"
    deliverable: results/experiment_6478_identifiable_held_exact_energy_selection.json
    title: "Gated on Exp6474 identifiability and Exp6477 parity: held exact-energy final-selection A/B"
    priority: critical
    track: energy
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6474-protocol-identifiability-and-receipt-preflight
        artifact_field: protocol_identifying_score
        op: "=="
        value: 1.0
      - upstream: exp6477-backend-neutral-exact-constraint-record
        artifact_field: exact_constraint_record_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6467-held-exact-constraint-energy-selection-v2
        verdict: "no_honest_verdict: task was preemptively skipped after the V556 corpus and objective gate cascade"
        addressed_by: "This task removes the failed corpus dependency. It uses a same-milestone backend-neutral exact record, a zero-inference identifiability prerequisite, immutable solver-grounded candidates, and an untouched held manifest."
        retire_if_same_verdict: true
      - experiment_id: exp6454-held-exact-constraint-energy-selection-ab
        verdict: "no_honest_verdict: artifact missing after upstream gate cascade"
        addressed_by: "The prior task never ran. This attempt has independent exact-record and protocol-identifiability gates instead of the failed LLM corpus chain."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V555 and V556 never executed their held exact-energy selection tasks because the LLM corpus chain failed. Exp6474 now supplies a structural identifiability gate and Exp6477 supplies backend-neutral exact semantics. This task tests the narrower architectural claim that a frozen scalar violation energy can improve final selection on untouched solver-grounded units. Energy is proposal logic only. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6474_protocol_identifiability_and_receipt_preflight.json and source
      - {project_root}/results/experiment_6477_backend_neutral_exact_constraint_record.json and source
      - prior selection tasks and exclusion entries named in prior_failures
      - candidate-selection, exact-checker, bootstrap, and row-reducer helpers under {project_root}/python/carnot
      - relevant energy and verification OpenSpec files
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, and {project_root}/ops/e2e-test-plan.md

      TASK
      Freeze a solver-grounded candidate corpus and compare final selection by first candidate, deterministic random, shuffled energy, unweighted violation count, and the Exp6477 scalar exact-constraint energy. Use untouched held units and exact final validation. Make no LLM or learned-verifier claim.

      CONCRETE STEPS
      0. Pre-gate on protocol_identifying_score==1.0 and exact_constraint_record_ready_score==1.0. On failure emit blocked_gate_check_failed with gate_check_summary and stop.
      1. Add held-energy REQ-* and SCENARIO-* entries. Write focused tests first.
      2. Seal development and held finite-domain units, candidate bytes, exact labels, seeds, scalar energy formula, protected weights, tie rules, arms, and analysis before opening held results.
      3. Construct matched candidate sets from deterministic valid-solution perturbations. Keep at least one unit for each protected-clause, negation, and objective-conflict pattern.
      4. Confirm with the Exp6474 API that the actual observation support and target estimand remain identifying after the manifest is frozen.
      5. Tune nothing on held units. Use development only for fixed protected weights if the predeclared formula needs them.
      6. Run first, deterministic-random, shuffled-energy, violation-count, and exact-energy arms on identical candidates and total work.
      7. Validate the selected candidate with an exact backend. Report exact success, harmful flips, recovered failures, protected-clause success, ties, no-headroom rows, and work.
      8. Emit one row per unit, seed, arm, and candidate needed to recompute each selected outcome.
      9. Attack held leakage, result-dependent weights, shuffled labels, tie manipulation, energy-sign reversal, matched totals with different protected violations, and aggregate mismatch.
      10. Run focused tests, row lint, adversarial verification, spec coverage, and applicable E2E checks. Inspect git status after tests.
      11. Set held_exact_energy_selection_ready_score=1.0 only if the exact-energy arm improves paired held exact success over first and shuffled controls with a confidence interval excluding zero, does not increase harmful flips or protected violations, and all gates remain clean.

      Required deliverable: {project_root}/results/experiment_6478_identifiable_held_exact_energy_selection.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal status distinguishes a completed held comparison from a gate-only artifact."
        upstream_identifiability_hash:
          principle: "The hash binds the causal claim to the exact protocol proof that authorized evaluation."
        upstream_constraint_record_hash:
          principle: "The hash binds energy and exact validation to the same backend-neutral semantics."
        development_and_held_precommitment:
          principle: "A sealed split prevents result-dependent tuning or candidate replacement."
        frozen_energy_formula_and_tie_rules:
          principle: "Precommitted scoring and ties prevent favorable held decisions after labels open."
        protocol_recheck_receipt:
          principle: "Rechecking the actual manifest catches drift from the policy class audited upstream."
        per_unit_rows:
          principle: "Unit, seed, arm, and candidate rows make every selection and paired effect reproducible."
        exact_success_by_arm:
          principle: "Final exact outcome, not energy or format validity, is the headline decision metric."
        harmful_flips_and_recovered_failures:
          principle: "Both directions prevent net gains from hiding damage to previously correct selections."
        protected_clause_results:
          principle: "Protected outcomes ensure scalar energy does not trade away load-bearing constraints."
        paired_effects_and_intervals:
          principle: "Paired intervals distinguish stable held effects from a few favorable units."
        no_headroom_and_tie_rows:
          principle: "Explicit no-headroom and tie accounting prevents impossible wins from entering the headline."
        aggregate_row_recomputation:
          principle: "Independent row reduction catches selected-candidate or headline inconsistencies."
        attack_matrix:
          principle: "Leakage, sign, tie, and protected-violation attacks test the main ways an energy result can be gamed."
        held_exact_energy_selection_ready_score:
          principle: "A conjunctive score promotes only a positive, protected, identifying held exact-decision gain."
        protected_files_unchanged:
          principle: "The comparison cannot improve by rewriting exact checkers, manifests, or conductor logic."
        gate_check_summary:
          principle: "A blocked task must name the upstream field, operator, expected value, observed value, and path."
        preconditions_checked:
          principle: "Gate, split, backend, and candidate receipts prove the experiment was safe to start."
        inference_substrate:
          principle: "Declaring exact_solver_held_candidate_selection_no_llm prevents solver candidates from being described as LLM outputs."
        verifier_is_oracle:
          principle: "Only exact backend validation determines final correctness; energy remains a selector."
        field_principles:
          principle: "A principle map carries the causal and authority boundaries into the artifact."
        field_provenance:
          principle: "Hashes, row IDs, and reducer receipts make every result field traceable."
        random_seed:
          principle: "Declared seeds reproduce candidate perturbations and deterministic-random controls."
        duration_s:
          principle: "Wall time catches comparisons that skipped exact backend or attack execution."
        tests_run:
          principle: "Executed commands prove the held reducer and adversarial controls ran."
        reproducibility_checksum:
          principle: "The checksum binds upstream gates, manifests, formula, candidates, code, and result."
        honest_verdict:
          principle: "The verdict states positive, null, negative, or blocked evidence without promoting selector energy as authority."
      ACCEPTANCE GATES:
        - condition: "protocol_identifying_score == 1.0"
          principle: "A held effect is uninterpretable when the observation support cannot separate policies with different target effects."
        - condition: "exact_constraint_record_ready_score == 1.0"
          principle: "Energy selection cannot be trusted when exact record semantics drift across backends."
        - condition: "Exact-energy paired held gain is positive with interval excluding zero and no protected regression."
          principle: "The joint condition rules out sampling luck, harmful flips, and wins purchased by violating protected clauses."
      Set inference_substrate=exact_solver_held_candidate_selection_no_llm. Set verifier_is_oracle=true only for exact backend and row arithmetic. A blocked_* verdict requires gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6478_identifiable_held_exact_energy_selection --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6479-verify-repair-factor-cache-shadow-adapter
    milestone: "2026.08.557"
    deliverable: results/experiment_6479_verify_repair_factor_cache_shadow_adapter.json
    title: "Default-off VerifyRepairPipeline factor-cache shadow adapter"
    priority: critical
    track: continuous-learning
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 180
    agent_type: codex
    model: gpt-5.5
    prompt: |
      CONTEXT
      Exp6468 through Exp6470 proved an eligible unique-event verifier-bounded factor learner in an experiment harness. FR-11 requires the observe-update-reuse loop to exist on Carnot's production verification surface. V557 first adds a default-off shadow adapter. The adapter may observe exact outcomes, propose cache writes, rank, or abstain. It may not release an answer or admit a write without the exact checker. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6468_unique_event_verifier_bounded_csl.json through {project_root}/results/experiment_6470_independent_unique_event_csl_audit.json and their source
      - {project_root}/python/carnot/pipeline/verify_repair.py, {project_root}/python/carnot/pipeline/memory.py, and existing pipeline integration tests
      - constraint memory and exact-veto requirements in continuous-learning, pipeline, autoresearch, and verifiable-reasoning OpenSpec files
      - {project_root}/python/carnot/task_runtime_receipts.py
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, and {project_root}/ops/e2e-test-plan.md

      TASK
      Integrate the eligible V556 unique-event factor update rule as an additive, default-off `VerifyRepairPipeline` shadow adapter. Preserve disabled behavior. In enabled shadow mode, record proposed cache writes and rank changes while keeping exact validation as release and write authority.

      CONCRETE STEPS
      0. Record current `VerifyRepairPipeline` API, default outputs, import closure, exact checker path, memory options, focused test baseline, and protected file hashes.
      1. Add pipeline and continuous-learning REQ-* and SCENARIO-* entries. Write focused and integration tests first.
      2. Define a small versioned adapter interface for observe, exact-admit, propose-rank, tombstone, rollback, save, load, and close.
      3. Add an explicit default-off constructor or method option. Do not change existing call-site behavior when absent or false.
      4. In shadow mode, compute and record the proposed rank or abstention. Return the baseline pipeline decision unless a later experiment explicitly uses the opt-in decision path.
      5. Require unique event ID, raw hash, unit binding, checker hash, exact outcome, and chronology before write admission. Reject self-signed or duplicate events.
      6. Persist cache, tombstone, quarantine, and rollback state atomically. Preserve non-resurrection across load and close.
      7. Emit matched disabled, no-adapter, enabled-shadow, and forged-adapter rows. Check byte-for-byte or structured-equivalent compatibility for all public outputs.
      8. Attack release bypass, write-before-check, duplicate raw event, wrong unit, forged pass, stale cache, tombstone eviction, adapter exception, and default-on environment leakage.
      9. Run focused tests, pipeline integration tests, spec coverage, row lint, adversarial verification, package import E2E, and applicable verification E2E checks. Inspect git status after every test tier.
      10. Set factor_cache_shadow_adapter_ready_score=1.0 only if default-off compatibility is exact, shadow receipts are complete, exact write admission cannot be bypassed, state survives restart, and critical attacks fail closed.

      Required deliverable: {project_root}/results/experiment_6479_verify_repair_factor_cache_shadow_adapter.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal status distinguishes shipped integration from a partial adapter scaffold."
        adapter_api_and_schema_hash:
          principle: "A versioned interface prevents later cache implementations from silently changing lifecycle semantics."
        baseline_import_and_output_receipts:
          principle: "Pre-change receipts define the compatibility target for default-off behavior."
        default_off_compatibility_rows:
          principle: "Matched rows prove existing callers retain the same decisions and public outputs."
        shadow_decision_rows:
          principle: "Shadow rows show proposed influence without confusing it with executed release behavior."
        exact_write_admission_rows:
          principle: "Event and checker receipts prove every admitted write followed exact validation."
        persistence_rollback_and_tombstone_receipts:
          principle: "Lifecycle receipts prevent restart or eviction from resurrecting revoked factors."
        per_unit_rows:
          principle: "One row per fixture, mode, and attack makes compatibility and authority checks reproducible."
        aggregate_row_recomputation:
          principle: "Row reduction catches a ready summary with a hidden compatibility or admission failure."
        attack_matrix:
          principle: "Release, admission, identity, restart, and default-on attacks test the production boundary."
        factor_cache_shadow_adapter_ready_score:
          principle: "A conjunctive gate blocks live self-learning until default-off and exact-authority contracts hold."
        protected_files_unchanged:
          principle: "Integration must not modify the conductor, public ARC registry, or unrelated protected records."
        gate_check_summary:
          principle: "A blocked integration must name the failed API, compatibility, lifecycle, or authority check."
        preconditions_checked:
          principle: "API, import, test, and exact-checker receipts prove the live surface was understood before editing."
        inference_substrate:
          principle: "Declaring deterministic_pipeline_integration_no_llm prevents fixtures from being reported as local model inference."
        verifier_is_oracle:
          principle: "Only existing exact checkers authorize release and cache writes; the adapter never does."
        field_principles:
          principle: "A principle map preserves backward-compatibility and authority intent."
        field_provenance:
          principle: "Code hashes, fixture IDs, event receipts, and test outputs make every field traceable."
        random_seed:
          principle: "A fixed seed reproduces fixture order and cache attack sequences."
        duration_s:
          principle: "Wall time catches adapter artifacts emitted without integration and lifecycle tests."
        tests_run:
          principle: "Recorded commands prove unit, integration, and E2E compatibility checks ran."
        reproducibility_checksum:
          principle: "The checksum binds adapter code, baseline receipts, fixtures, tests, and result."
        honest_verdict:
          principle: "The verdict states whether default-off shadow integration shipped without implying a future-yield gain."
      ACCEPTANCE GATES:
        - condition: "factor_cache_shadow_adapter_ready_score == 1.0"
          principle: "Live chronological learning must not start until the production surface preserves baseline behavior and exact authority."
        - condition: "Default-off public decisions and outputs match the frozen baseline."
          principle: "An optional research adapter cannot silently alter existing production callers."
        - condition: "Every cache write has a unique event receipt and a prior exact-check receipt."
          principle: "Write admission is the safety boundary that prevents self-signed or replayed errors from becoming memory."
      Set inference_substrate=deterministic_pipeline_integration_no_llm. Set verifier_is_oracle=true only for existing exact checkers and deterministic compatibility reducers. A blocked_* verdict requires gate_check_summary.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6479_verify_repair_factor_cache_shadow_adapter --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.
