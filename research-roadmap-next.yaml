      CONTEXT
      Recent energy-guided decoding/test-time scaling work is promising, but Carnot must treat energy as a proposal/ranking signal and exact verifiers as the authority. This task tests that pattern on local SOTA GGUFs without claiming model training progress.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md, especially SOTA Local Models and live inference artifact rules
      - CODEX.md
      - scripts/experiment_template.py
      - carnot/inference/sota_models.py
      - openspec/capabilities/llm-ebm-inference/spec.md
      - openspec/capabilities/verifiable-reasoning/spec.md
      - research-references.md, energy-guided decoding and hallucination commitment sections
      - results/experiment_3328_energy_descent_vs_ar_sota_panel_v2.json if present
      - results/experiment_3329_verifier_ensemble_diversity_audit_v2.json if present

      TASK
      Run a live SOTA ablation where the local GGUF model proposes multiple candidates, an energy score ranks or filters them, and exact verifiers decide correctness. Compare against simple majority/best-of-n baselines.

      CONCRETE STEPS
      1. Define MODEL_SPECS using cached_sota_pair(gpu_indices=(0, 1)); include at least one mandated SOTA GGUF in the artifact: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, or unsloth/gemma-4-26B-A4B-it-GGUF.
