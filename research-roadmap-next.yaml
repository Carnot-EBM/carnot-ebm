        verdict: graft_deferred_baseline_below_0.85
        addressed_by: "exp4159 deferred because Phase-0 failed on grids (base 0.501, 0 demo-perfect coverage). This collects the de-confounded A-vs-B on CODE where the execution verifier certifies at 0.96 (exp4093); the A-vs-B gate (certified vs same-generator random-label) is the spurious-reward de-confound exp4159 never reached."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: THE decision-grade answer to the operator's pivot. A2 launched the de-confounded 3-arm
      on-policy LoRA-RFT on code. The LOAD-BEARING GATE is A vs B: does the verifier's LABEL carry training
