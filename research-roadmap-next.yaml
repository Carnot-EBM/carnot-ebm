        addressed_by: "The rerun is now gated on a root-cause audit and must use an abstention-calibrated policy with exact-row coverage targets, not the abstain-all v14 settings."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      Run this only after exp3286 identifies an actionable abstention root cause. The goal is a clean verifier rerun that keeps false accepts at zero while achieving non-trivial coverage on exact-checkable rows.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF

      EXISTING CODE TO READ FIRST
