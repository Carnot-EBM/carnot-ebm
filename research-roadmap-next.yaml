  - id: exp3206-cuda-env-forensics-ledger-v1
    milestone: "2026.05.297"
    deliverable: "results/experiment_3206_cuda_env_forensics_ledger_v1.json"
    title: "CUDA environment forensics ledger for selected Python and llama.cpp"
    priority: critical
    model: opus
    max_turns: 100
    estimated_wall_time_min: 35
    track: "runtime"
    inference_substrate: "cuda_environment_forensics"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3193-llama-cpp-cuda-offload-health-probe-v1
        verdict: "blocked_cuda_unavailable"
        addressed_by: "This attempt does not rerun generation; it captures a clean environment ledger, import order, shared-library origins, CUDA env vars, and subprocess probes to isolate the root cause."
        retire_if_same_verdict: true
      - experiment_id: exp3179-local-sota-receipt-smoke-v1
        verdict: "cpu_fallback_receipt_only"
        addressed_by: "The new artifact must distinguish CPU fallback, partial offload, and full CUDA readiness before any receipt can unlock verifier work."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      `.296` found `nvidia-smi` and an RTX 3090, but the selected Python path reported `torch.cuda.is_available() == false` and `llama_cpp` stderr included `ggml_cuda_init: failed to initialize CUDA: unknown error`. You are working in {project_root} on {date}. This task is an environment-forensics experiment, not a model-quality experiment.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3193_llama_cpp_cuda_offload_health_probe_v1.json
      - scripts/experiment_template.py
      - scripts/conductor_gates.py
      - research-hardware-wishlist.md
      - research-references.md

      TASK
      Produce a reproducible CUDA environment ledger that explains whether the selected Python, PyTorch, llama.cpp, and llama_cpp paths can initialize CUDA in a clean subprocess.

      CONCRETE STEPS
      1. Capture `nvidia-smi`, `nvcc --version` if present, driver version, visible devices, and memory state.
      2. Capture the exact selected Python executable, virtualenv, `sys.path`, `pip show torch`, `pip show llama-cpp-python`, and the filesystem origin of `llama_cpp`.
      3. Run a clean subprocess that imports `torch` before any project imports and records CUDA availability, device count, device name, CUDA version, and initialization warnings.
      4. Run a clean subprocess that imports `llama_cpp`, records build metadata if available, probes GPU offload support without loading a large model when possible, and captures stderr.
      5. Capture `CUDA_VISIBLE_DEVICES`, `LD_LIBRARY_PATH`, `PATH`, `CMAKE_ARGS`, `FORCE_CMAKE`, and any llama.cpp/ggml CUDA-related env vars.
      6. Decide whether the next task is allowed to try a rebuild or full receipt by setting `cuda_env_diagnosed`, `cuda_init_clean`, and `recommended_next_action`.
      7. Write `results/experiment_3206_cuda_env_forensics_ledger_v1.json`.

      REQUIRED ARTIFACT FIELDS:
      - schema_version: string
      - experiment_id: string
      - milestone: string
      - selected_python: string
      - virtualenv: string|null
      - nvidia_smi_available: bool
      - gpu_count_nvidia_smi: int|null
      - torch_version: string|null
      - torch_cuda_version: string|null
      - torch_cuda_available_clean_subprocess: bool
      - torch_cuda_device_count_clean_subprocess: int
      - llama_cpp_version: string|null
      - llama_cpp_origin: string|null
      - llama_cpp_cuda_build_detected: bool
      - clean_subprocess_stderr_tail: list
      - cuda_env_vars: object
      - cuda_env_diagnosed: bool
      - cuda_init_clean: bool
      - recommended_next_action: string
      - conductor_file_modified: bool
      - active_roadmap_modified: bool
      - honest_verdict: string

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3207-llama-cpp-cuda-rebuild-clean-subprocess-v1
    milestone: "2026.05.297"
