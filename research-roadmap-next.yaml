      - {project_root}/research-program.md
      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6322_v544_adversarial_capstone.json
      - {project_root}/results/experiment_6312_model_local_representation_surface_preflight.json
      - {project_root}/results/experiment_6318_versioned_factor_local_online_initializer.json
      - {project_root}/results/experiment_6319_feedback_directed_online_update_search.json
      - {project_root}/results/experiment_6321_arc_target_licensed_route_live_shadow_ab.json
      - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md, and {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/exclusion_manifest_lint.py

      TASK
      Create an exact V544-to-V545 handoff. Classify every V544 artifact under current terminal rules. Validate the staged V545 IDs, deliverables, dependencies, structured gates, prior-failure entries, Codex routing, model policy, prompt contracts, and protected files. Confirm that the roadmap contains 14 tasks in Exp6323-Exp6336 order. Confirm that no task depends on a retired experiment. Do not activate research-roadmap-next.yaml. Do not edit research-roadmap.yaml.

      Required deliverable: {project_root}/results/experiment_6323_v545_terminal_transition.json.
      REQUIRED ARTIFACT FIELDS: status, v544_roadmap_path_and_hash, v544_task_terminal_matrix, v544_capstone_path_hash_and_summary, v544_validation_failure_receipts, missing_nonterminal_blocked_skipped_null_flagged_retired_ready_and_positive_counts, v545_roadmap_path_and_hash, v545_task_ids_and_deliverables, task_count, phase_counts, dependency_validation, gated_on_validation, prior_failure_validation, retired_dependency_count, id_collision_count, agent_routing_validation, model_policy_validation, prompt_contract_validation, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. task_count must be bare 14. retired_dependency_count and id_collision_count must be bare 0. honest_verdict must begin with a terminal prefix. field_principles must cover every required field.

      CONCRETE STEPS
      0. Record git status, input hashes, staged-roadmap identity, reserved-ID scan, active-roadmap hash, protected-file hashes, disk, RAM, and command availability in preconditions_checked.
      1. Add REQ-INFRA-6323 and scenarios to openspec/capabilities/research-harnesses/spec.md before implementation. Update _bmad/traceability.md.
      2. Classify all V544 deliverables with python/carnot/terminal_artifacts.py. Preserve exact missing, failed-command, null, skipped, blocked, safety-only, shadow-only, ready, and positive states.
      3. Validate all 14 tasks, deliverable paths, same-milestone dependencies, structured gates, and all four prior_failures subfields.
      4. Prove that hidden/model-local state, external text scoring, KAN, cross-family transfer, public ARC re-solves, and unapproved hardware work are not scheduled.
      5. Validate agent_type=codex and model=gpt-5.5 for every task. Validate the required GGUF identities in every prompt that needs an LLM.
      6. Run schema, gate, exclusion, prompt-ending, collision, protected-file, and root-clutter checks. Record focused and broad validation separately.
      7. Adversarial-verify the artifact. Preserve honest failures. Do not rewrite the staged or active roadmap.

      Run command: .venv/bin/python -m carnot.experiment_6323_v545_terminal_transition --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6324-v545-post-marker-source-scope-freeze
    milestone: "2026.08.545"
    deliverable: results/experiment_6324_v545_post_marker_source_scope_freeze.json
