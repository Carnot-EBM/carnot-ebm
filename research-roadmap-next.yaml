    0. PRECONDITIONS: Print and flush immediately. Read the listed existing paths. Verify driving capability REQ-* requirements, imports, resources and writable raw/checkpoint paths. Authenticate exact upstream paths and hashes; reject quarantined evidence even if a numeric gate passes. Unwrap only dictionaries containing both principle and value. Do not run the whole repository test suite as a prerequisite. Spec first, meaningful failing tests, then implementation. Reuse existing modules and keep the new entrypoint thin. Write provisional work to results/checkpoints/, never a terminal deliverable.
    1. Print and flush a progress line at EVERY numbered phase boundary. Print and flush BEFORE AND AFTER every model load, generation, benchmark and subprocess that can take minutes. Inside long loops, emit completed units and monotonic elapsed time at least every 60 seconds. Use unbuffered streamed output and a truthful external heartbeat for blocking native calls and child processes. Keep EVERY output gap below 600 seconds, including authoring and tests. A silent task can die at 1200 seconds; regular observed status output preserves access to the 4800-second hard cap. Never invent progress.
    2. No LLM invocation: MODEL_SPECS=[], model_invoked=false. Planned inference_substrate_class=aggregation; inference_substrate=aggregation_from_upstream_artifacts. Keep current invocation counters zero. Store historical source details and synthetic negative receipts in referenced sidecars, not under current runner_receipt or model invocation fields. Do not drop evidence: retain paths and hashes. If new CPU execution replaces aggregation, use cpu_exact_solver_or_simulator for both fields. If nothing runs because an external prerequisite is absent, use blocked_no_run. execution_venue=host; measure actual timing without sleeps.
    3. Select the next or active YAML ONLY by milestone == 2026.09.637. Freeze it and its V637 design under results/raw/experiment_7233/. Independently parse the Markdown contract table. Require exactly 13 IDs, exp7233 through exp7245, with identical order, titles, deliverables and gates.
