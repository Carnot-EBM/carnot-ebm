  - id: exp1721-phase4-alpha-t-replacement-derivation
    title: "Exp 1721: Phase 4 alpha_t replacement derivation from maximum-caliber FEP↔IIT bridge"
    deliverable: results/experiment_1721_alpha_t_replacement.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1715-phase4-alpha-t-audit-retry-v3
        verdict: complete_bijection_invariance_artifact_confirmed
        addressed_by: "exp1715 falsified the current alpha_t computation as bijection-invariant. arXiv:2605.12536 (Kearney, IIT↔FEP maximum-caliber bridge) is the candidate replacement framing. This task derives + prototypes a NEW alpha_t' that is provably NOT bijection-invariant under arXiv:2512.15605, then re-runs the random-verifier-injection ablation to confirm monotonic decay (artifact_detected=false in the new metric)."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: exp1715 (.176) confirmed the Phase 4 alpha_t metric is
      bijection-invariant — random-verifier injection did NOT degrade
      delta_alpha across 4 ablation cells. arXiv:2605.12536 (Kearney,
      May 3 2026) bridges FEP and IIT via maximum-caliber variational;
      this paper's framework yields information measures via prediction
      error under predictive coding, which is NOT obviously bijection-
      invariant.

      FALSIFIABLE HYPOTHESIS: A maximum-caliber-derived alpha_t' (based
      on Kearney's prediction-error formulation) produces monotonically
      decaying delta_alpha across the random-verifier injection ablation
      (random_fraction in [0, 1/3, 2/3, 1] → delta_alpha' should drop
      from ~0.15 toward ~0). If alpha_t' is also bijection-invariant,
      Phase 4 active-inference is fundamentally not measurable from
      ensemble-level information — the hypothesis becomes inaccessible.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1715_phase4_alpha_t_audit.json (the
          falsification + 4-cell ablation results)
        - python/carnot/phase4/ (current alpha_t implementation)
        - arXiv:2605.12536 (cite only; abstract sufficient for derivation
          starting point — outer-loop notes that the maximum-caliber
          variational form is alpha_t' = -ln Z + sum_i E[A_i log p(s_t|s_{t-1})])

      TASK: Implement alpha_t' replacement + re-run the ablation.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `test -f results/experiment_1715_phase4_alpha_t_audit.json` —
              else `blocked_exp1715_baseline_missing`.
           b. `python -c "from carnot.phase4 import alpha_t"` succeeds OR
              grep-locatable — else `blocked_phase4_module_not_found`.
           c. scipy + numpy importable — else
              `blocked_scipy_numpy_missing`.
           Record preconditions_checked.
        1. Read exp1715's ablation: 4 cells × 30 seeds × 100 MLD steps.
           Re-use the substrate seeds and verifier ensembles so the
           comparison is apples-to-apples.
        2. Derive alpha_t' from maximum-caliber: alpha_t' should depend
           explicitly on the prediction-error term E[A log p(s|history)]
           where A_i are the verifier-output indicator variables. The
           AR-LM↔EBM bijection (arXiv:2512.15605) acts on the marginal
           p(s) — alpha_t' depends on the CONDITIONAL p(s|history,A),
           which under the bijection is NOT preserved. This is the
           non-invariance.
        3. Implement alpha_t' as a separate function (do NOT modify the
           current alpha_t — adversarial-verify's no-pruning policy).
           Add file python/carnot/phase4/alpha_t_max_caliber.py.
        4. Re-run the exp1715 ablation with alpha_t': 4 cells, same
           seeds, same verifier ensembles, same MLD steps. Record
           random_fraction_grid_results_alpha_t_prime.
        5. Compute monotonic_decay_observed_alpha_t_prime AND
           artifact_detected_alpha_t_prime per the exp1715 pattern.
        6. Acceptance: monotonic_decay_observed_alpha_t_prime = true
           AND artifact_detected_alpha_t_prime = false. If both flip
           the right way, alpha_t' is a successful replacement.
           If neither does, the maximum-caliber derivation needs more
           work — emit verdict honestly.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.alpha_t_replacement.v1"
        - experiment: 1721
        - run_date: ISO-8601 UTC
        - duration_s: > 120s (derivation + implementation + ablation)
        - random_seed: 171821 (NOT 1721 or 4)
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {n_spins: 32, ensemble_k_total: 6,
          random_fraction_grid: [0, 0.333, 0.667, 1.0], mld_steps: 100,
          n_seeds: 30, n_cells: 4,
          alpha_t_variant: "max_caliber_v1"}
        - n_samples: 12000
        - n_samples_justification: "30 seeds × 100 MLD × 4 cells. Same
          as exp1715 for apples-to-apples comparison."
        - random_fraction_grid_results_alpha_t_prime: list of {random_fraction,
          inf_t_alpha_k6_prime, inf_t_alpha_k1_prime, delta_alpha_prime,
          delta_alpha_prime_bootstrap_ci_95}
        - monotonic_decay_observed_alpha_t_prime: bool
        - artifact_detected_alpha_t_prime: bool
        - alpha_t_prime_implementation_file: "python/carnot/phase4/alpha_t_max_caliber.py"
        - acceptance_gate_passed: bool (monotonic_decay AND NOT artifact_detected)
        - acceptance_gate_criteria: "alpha_t' shows monotonic decay
          across random_fraction grid AND no artifact-detection flag."
        - methodology_note: "If both alpha_t (exp1715) AND alpha_t'
          (this task) are bijection-invariant, Phase 4 information
          becomes inaccessible from ensemble-level metrics. Disclose
          honestly; recommend escalating Phase 4 program scope review."
        - optimization_direction: "maximize_monotonic_decay (separation
          across random_fraction cells)"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push to git. Do NOT modify
      scripts/research_conductor.py.

