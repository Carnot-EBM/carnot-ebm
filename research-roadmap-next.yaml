    13. REQUIRED ARTIFACT FIELDS:
       - schema: principle: "Use a versioned top-level schema and exact experiment_id, milestone and terminal status."
       - run_date: principle: "Use {date}; retain actual UTC start/end and monotonic duration with boot/segment identity."
       - preconditions_checked: principle: "Name the actual source paths, resources, identity and observed gate values before dependent work."
       - MODEL_SPECS: principle: "Name unsloth/Qwen3.8-27B-GGUF for any planned current LLM task; use [] for tasks with no LLM work."
       - model_invoked: principle: "Attempted current model work is distinct from archived or scripted model-shaped events."
       - invocation_counts: principle: "Balance loads, forwards and generations: attempted, completed, failed, cancelled and in-flight."
       - inference_substrate: principle: "Use a truthful string; keep model/device details and historical evidence in typed sidecars."
       - inference_substrate_class: principle: "Declare actual current work. Bounded generation uses 10s, embedding/load only 2s, real full generation 60s; blocked_no_run carries no simulated execution."
       - execution_venue: principle: "host; keep CPU/CUDA identity separate from compute class and archived external-device evidence."
       - duration_s: principle: "Measure real current work; separate load/forward/generation, numeric computation and validation. Never pad time."
       - phase_spans: principle: "Bind phase timings, progress events, checkpoints and clock segments."
       - random_seed: principle: "Freeze fit, projection, stream and resampling seeds; explain a null when randomness is absent."
       - reproducibility_checksum: principle: "Bind code, protocol, immutable inputs, row shards and exact validation scope."
       - source_artifact_hashes: principle: "Preserve exact upstream bytes, original classes and flags; never rehabilitate history."
       - rows: principle: "Per-unit metrics for every arm/group/seed/condition, including failures, censoring and unstarted units."
       - sample_size_budget: principle: "Separate planned, attempted, completed, failed, censored and unstarted independent units with a fixed stop rule."
       - acceptance_gate_results: principle: "Each row names check, validity-or-benefit category, op, expected, observed, passed and principle."
       - gate_check_summary: principle: "Every blocked_* names upstream, exact path, check, field, expected and observed; missing, None and zero are different causes."
       - verifier_is_oracle: principle: "True if the deployed verifier supplies the scoring authority; exact/synthetic oracle success is circular_positive."
       - honest_verdict: principle: "Completed findings start complete_; unchanged external absence uses blocked_* with a specific reason. Preserve prior failure strings when the same condition recurs."
       - verdict_class: principle: "Closed enum: positive | circular_positive | null | blocked | disqualified | partial. partial means unfinished OWN retryable work only."
       - flagged_adversarial: principle: "Preserve actual critical findings. Flagged/disqualified science cannot supply readiness."
       - validation_receipts: principle: "Record actual scoped argv/environment, exit codes, duration and log hashes, including both terminal readers."
       - field_principles: principle: "Explain field intent here; gate fields themselves remain bare scalars, never value/principle wrappers."
       - promotion_score: principle: "Always zero. This milestone authorizes experiments, not rollout, generator-weight changes or external publication."
       - contract_ready_score: principle: "One only if the exact fourteen-task contract and current required checks pass; advisory only."
       - method_rows: principle: "Tie each selected method to its primary URL, evidence boundary and task."
       - unresolved_obligations: principle: "Keep deferred and user-forbidden work visible."

