      - results/experiment_3124_difficulty_stratified_live_sota_verifier_panel_v6.json
      - results/experiment_3126_fragment_time_monitor_satisfiable_drift_audit_v1.json
      - python/carnot/verify if present
      - tests if repair/verifier tests exist

      TASK
      Run a bounded multi-turn repair ladder on the exact repair micro-panel, using local mandated SOTA candidates when available and exact monitors/tests as authority.

      CONCRETE STEPS
      1. Select failing repair rows from the .290 micro-panel and fragment monitor outputs.
      2. For each row, run up to a small fixed number of repair turns: propose candidate, check syntax/format, run monitor, run exact test/Z3, then feed only tool/test feedback into the next turn.
      3. Add bidirectional ledger checks: premise-to-answer and answer-back-to-premises.
      4. Record repair success, false repair acceptance, intent preservation, drift reduction, test pass count, and live model metadata.
      5. Do not promote repair as headline evidence unless exact authority accepts and positive delta is nonzero.

      REQUIRED ARTIFACT FIELDS:
      - multi_turn_monitored_repair_ladder_v1_ready: bool (principle: repair artifact must be complete even when gated)
      - model_specs: list (principle: mandated local model policy must be visible)
      - selected_model_ids: list (principle: actual model use must be auditable)
      - live_call_count: int (principle: live repair evidence must not be inferred)
      - repair_attempt_count: int (principle: repair denominator must be explicit)
      - repair_success_count: int (principle: success must be counted under exact authority)
      - repair_success_delta: float (principle: repair claims need measured lift)
      - false_repair_accept_rate: float (principle: repair must not introduce silent false accepts)
