         - "tier_0i_marginal" if 0.55 < AUC_geometric <= 0.65
         - "tier_0i_fails" if AUC_geometric <= 0.55
       Build artifact and write results/experiment_863_hallusae_geometric_probe.json.
    9. Add spec update: openspec/capabilities/verify-repair/spec.md — add REQ-PROBE-050
       "HalluSAEGeometricProbe (Tier 0i) MUST compute mean L2 distance from grounded
       reasoning manifold centroid in SAE feature space (or TF-IDF proxy) and emit
       geometric_energy and hallusae_anomalous in VerificationCertificate."
    10. Write tests/python/test_experiment_863_hallusae_geometric_probe.py with 100% coverage.
