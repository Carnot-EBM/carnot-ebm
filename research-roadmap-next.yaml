milestone: "2026.05.160"
milestone_title: "Continuous Latent Equilibrium Matching, AIA Hardware Simulation, and Self-Improving Latent Verification"
milestone_doc: "openspec/change-proposals/research-roadmap-v160.md"

tasks:
  - id: exp2040-far-latent-smoke
    title: "Exp 2040: FAR Continuous Latent Generation Smoke Test"
    deliverable: results/experiment_2040_far_latent_smoke.json
    max_turns: 50
    prompt: |
      CONTEXT: We need to transition from discrete token generation to continuous latent spaces for faster, verifiable generation (FAR - Fast Autoregressive models).
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`, `ops/status.md`.
      TASK: Implement a CPU-only smoke test simulating FAR continuous latent steps using mandated SOTA GGUF models.
      CONCRETE STEPS:
      1. Create a minimal Fast Autoregressive (FAR) continuous latent simulation script.
      2. Use `cached_sota_pair()`: `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF`.
      3. Evaluate generation latency and energy coherence.
      4. Save results to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2041-eqm-gradient-landscape
    title: "Exp 2041: Equilibrium Matching (EqM) Gradient Probing"
    deliverable: results/experiment_2041_eqm_gradients.json
    max_turns: 50
    prompt: |
      CONTEXT: Equilibrium Matching (EqM) provides a framework to learn the equilibrium gradient of implicit energy landscapes for optimization-driven inference.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Prototype an EqM gradient extraction step on top of the FAR continuous space.
      CONCRETE STEPS:
      1. Build a script to map hidden states from `unsloth/gemma-4-26B-A4B-it-GGUF` to an energy landscape gradient.
      2. Test optimization-driven refinement on 10 toy constraints.
      3. Save validation results.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2042-arm-ebm-bijection-telemetry
    title: "Exp 2042: ARM-EBM Bijection Telemetry Bounds"
    deliverable: results/experiment_2042_arm_ebm_bijection.json
    max_turns: 30
    prompt: |
      CONTEXT: The Blondel et al. paper establishes a mathematical bijection between ARMs and EBMs. We will use this to convert logprobs to energy bounds.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`, telemetry artifacts from `.159`.
      TASK: Create a telemetry adapter mapping top-k logprobs to EBM bounds.
      CONCRETE STEPS:
      1. Extract logprobs from `unsloth/Qwen3.6-35B-A3B-GGUF` on 5 prompts.
      2. Apply the ARM-EBM bijection to estimate partition function bounds and local energy.
      3. Save telemetry data to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2043-aia-knuth-yao-sim
    title: "Exp 2043: AIA Knuth-Yao Hardware Simulator"
    deliverable: results/experiment_2043_aia_knuth_yao.json
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    prompt: |
      CONTEXT: Approximate Inference Accelerator (AIA) designs use Knuth-Yao samplers to reduce RNG consumption in probabilistic hardware.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Write a software simulator for Knuth-Yao sampling in Carnot's sampler abstractions.
      CONCRETE STEPS:
      1. Implement `KnuthYaoSampler` in Python.
      2. Test parity against standard RNG for 10,000 samples on a discrete distribution.
      3. Save statistical parity test results.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2044-gumbel-sampler-sim
    title: "Exp 2044: AIA Gumbel Sampler Simulator"
    deliverable: results/experiment_2044_aia_gumbel.json
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    prompt: |
      CONTEXT: AIA architectures utilize Gumbel samplers for continuous categorical constraints.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Implement a Gumbel sampler simulator for continuous energy landscapes.
      CONCRETE STEPS:
      1. Implement `ContinuousGumbelSampler` in Python.
      2. Apply it to the EqM gradient landscape from Exp 2041.
      3. Evaluate convergence speed vs Metropolis-Hastings.
      4. Save simulation results.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2045-hardware-accounting-aia
    title: "Exp 2045: AIA Hardware Resource Accounting (No Synthesis)"
    deliverable: results/experiment_2045_aia_accounting.json
    max_turns: 20
    model: opus
    prompt: |
      CONTEXT: We need hardware complexity metrics (BOP/NABS) for the AIA Knuth-Yao and Gumbel samplers before any future FPGA deployment.
      EXISTING CODE TO READ FIRST: `ops/status.md`, hardware accounting artifacts from `.159`.
      TASK: Compute Bit Operations (BOP) and Number of Additions/Bit-Shifts (NABS) for the samplers.
      CONCRETE STEPS:
      1. Calculate BOP and NABS bounds analytically based on the simulator logic.
      2. Output the metrics with `hardware_execution_claim=false`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2046-clara-latent-compression
    title: "Exp 2046: CLaRa Semantic Compression Prototype"
    deliverable: results/experiment_2046_clara_compression.json
    max_turns: 50
    prompt: |
      CONTEXT: CLaRa uses Semantic Compression with Paraphrasing (SCP) to build a dense continuous latent space for retrieval and generation.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Prototype SCP on a small constraint rulebook using local SOTA models.
      CONCRETE STEPS:
      1. Use `unsloth/Qwen3.6-35B-A3B-GGUF` to paraphrase and compress 50 CCTU constraints into dense vector embeddings.
      2. Evaluate reconstruction/retrieval accuracy.
      3. Save the compression metrics.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2047-continuous-verifier-integration
    title: "Exp 2047: Continuous Latent Verifier Integration"
    deliverable: results/experiment_2047_continuous_verifier.json
    max_turns: 50
    gated_on:
      - upstream: exp2041-eqm-gradient-landscape
        artifact_field: convergence_success
        op: '=='
        value: true
    prompt: |
      CONTEXT: Integrate the EqM gradients and CLaRa latent compression into a single continuous verifier.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Build a verifier that evaluates FAR-generated continuous latents against CLaRa-compressed constraints.
      CONCRETE STEPS:
      1. Connect the FAR latent outputs to the EqM landscape structured by the SCP vectors.
      2. Score 20 reasoning traces in the continuous domain.
      3. Save the verification accuracy compared to discrete token evaluation.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2048-inex-introspection
    title: "Exp 2048: InEx-style Continuous Introspection"
    deliverable: results/experiment_2048_inex_introspection.json
    max_turns: 50
    prompt: |
      CONTEXT: InEx mitigates hallucinations through introspection before final output. We apply this to our continuous verifier.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Implement an introspection gate that rejects high-energy FAR latent steps before decoding to tokens.
      CONCRETE STEPS:
      1. Set an energy threshold using the continuous verifier.
      2. Generate responses with `unsloth/gemma-4-31B-it-GGUF`.
      3. If a continuous step exceeds the threshold, resample using the Gumbel simulator.
      4. Save false accept/reject rates.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2049-self-learning-latent-loop
    title: "Exp 2049: Autonomous Self-Learning Latent Loop (FR-11)"
    deliverable: results/experiment_2049_self_learning_loop.json
    max_turns: 50
    prompt: |
      CONTEXT: The PRD requires autonomous self-learning without forgetting (FR-11).
      EXISTING CODE TO READ FIRST: `ops/status.md`.
      TASK: Run a self-learning loop using EqM and Gumbel sampling, measuring soundness vs completeness.
      CONCRETE STEPS:
      1. Initialize a baseline verifier policy.
      2. Run 10 iterations of policy updates driven by continuous energy gradients.
      3. Measure `soundness_mistakes`, `completeness_mistakes`, and `utility_delta`.
      4. Save the learning trajectory.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2050-self-learning-validation
    title: "Exp 2050: Gated on Exp 2049 Utility > 0 - CCTU Validation"
    deliverable: results/experiment_2050_cctu_validation.json
    max_turns: 50
    gated_on:
      - upstream: exp2049-self-learning-latent-loop
        artifact_field: utility_delta
        op: '>'
        value: 0.0
    prompt: |
      CONTEXT: Validate the self-learned verifier policy on the 20-case CCTU tool-use benchmark.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Run the CCTU benchmark with the updated policy.
      CONCRETE STEPS:
      1. Execute the 20-case CCTU suite.
      2. Record execution validity, zero false accepts, and semantic correctness.
      3. Ensure `soundness_mistakes` is 0.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2051-milestone-160-audit
    title: "Exp 2051: Architectural Coherence Audit for Continuous Execution"
    deliverable: results/experiment_2051_architecture_audit.json
    max_turns: 30
    agent_type: gemini
    model: gemini-3.1-pro-preview
    prompt: |
      CONTEXT: We must ensure our new continuous latent architecture aligns with PRD FR-12 (Verifiable Reasoning) and Phase-3 logic.
      EXISTING CODE TO READ FIRST: `_bmad/architecture.md`, `_bmad/prd.md`.
      TASK: Audit the continuous execution results for architectural divergence.
      CONCRETE STEPS:
      1. Analyze results from the preceding 11 tasks.
      2. Document any conflicts between EqM continuous constraints and the discrete verification mandate.
      3. Output an audit JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2052-milestone-160-retro
    title: "Exp 2052: Milestone 160 Retro and Completion"
    deliverable: results/experiment_2052_milestone_160_retro.json
    max_turns: 20
    prompt: |
      CONTEXT: Close out the milestone by synthesizing the results.
      EXISTING CODE TO READ FIRST: `scripts/experiment_template.py`.
      TASK: Write the final JSON artifact for the milestone retro.
      CONCRETE STEPS:
      1. Summarize the FAR latent transition, AIA hardware metrics, and FR-11 self-learning utility.
      2. Format as `experiment_2052_milestone_160_retro.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
