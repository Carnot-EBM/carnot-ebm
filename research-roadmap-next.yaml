    ` imports. Else blocked_structural_features_missing, EXIT. (No GPU/LLM.)\n  1. For each banked game:\
    \ fit an induced engine on a prefix, run it on HELD-OUT transitions to produce\n     induced predictions\
    \ s_hat. Label each by whether s_hat == real s' (correct) or != (wrong/near-miss).\n     Build the\
    \ dataset = {(features over (s, s_hat), correct?)}. ENSURE both classes are present per game (if\n\
    \     a game's engine is 0% or 100% accurate on held-out, it contributes only one class -- pool across\
