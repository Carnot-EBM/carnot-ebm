    1. Read CLAUDE.md spec-first workflow.
    2. Add to openspec/capabilities/verifiable-reasoning/spec.md:
       - REQ-HW-035: Open-source synthesis of Ising sampler MUST use yosys with synth_ice40
         target (iCE40 HX8K, ~7.7K LUTs). N=32 is the minimum viable target.
       - SCENARIO-HW-033: yosys synthesizes ising_sampler_v3.v at N=32; lut_count < 5000;
         no synthesis errors; honest_verdict=synthesis_clean.
    3. Create scripts/experiment_804_kv260_synthesis_attempt.py:
