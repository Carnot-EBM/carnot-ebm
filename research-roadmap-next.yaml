    prompt: |
      CONTEXT: exp1811 (.189) shipped Fast-Slow Variant. exp1837 (THIS
      milestone, runs BEFORE this task) is the adversarial confirmation.
      If exp1837's acceptance_gate_passed=true, this task codifies the
      paper-v6 §3 architecture-validation prose with the verbatim numbers.
      If exp1837 flagged_preliminary=true, this task emits
      `blocked_confirmation_failed_preliminary_flag` honestly and does
      NOT codify — codification waits for a 3rd replication.

      FALSIFIABLE HYPOTHESIS: With exp1837 confirmation in-range across
      all 4 conditions (efficiency, KL drift, FR-11 forgetting reproduces,
      FS holds threshold), the Fast-Slow Variant result is paper-v6-citable
      and the architecture-validation prose can lock in the numbers.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1811_fast_slow_variant.json (original)
        - results/experiment_1837_fast_slow_confirmation.json (replication;
          run BEFORE this task)
        - openspec/papers/paper-v6/section-3-architecture.md (or
          docs/technical-report.md)
        - research-references.md
        - ops/known-issues.md
        - feedback_adversarial_confirmation_protocol memory entry

      TASK: Three-document codification, gated on confirmation.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `test -f results/experiment_1837_fast_slow_confirmation.json` —
              else `blocked_confirmation_artifact_missing` (can't codify
              without confirmation).
           b. Read exp1837. If exp1837.flagged_preliminary == true OR
              exp1837.acceptance_gate_passed == false: emit
              `blocked_confirmation_failed_preliminary_flag` and exit.
              DO NOT codify a result that didn't replicate.
           c. paper-v6 §3 locatable via grep — else
              `blocked_paperv6_section3_not_locatable`.
           Record preconditions_checked.
        1. Read both exp1811 and exp1837 artifacts. Extract verbatim:
             - exp1811: sample_efficiency_ratio (3.1), kl_drift_ratio (0.25),
               passrates per task, catastrophic_forgetting flags
             - exp1837: confirmation_sample_efficiency_ratio,
               confirmation_kl_drift_ratio, FR-11-forgetting-reproduced
               status, rotation-versus-exp1811 metadata
        2. Draft paper-v6 §3 corrigendum (4 paragraphs):
             - A: state the result with verbatim numbers FROM BOTH RUNS
               (original + replication; "x.x x measured with seed Y,
               x.x x reproduced with seed Z on rotated corpus")
             - B: contextualize against arXiv:2605.12484 paper baseline
             - C: triangulation with 4 peer anchors (bijection 2512.15605,
               Fast-Slow 2605.12484, ODAR 2602.23681, planning 2602.02991)
             - D: limitation — saturation regime on GSM8K; rotation-
               window evidence still small-N
        3. Update research-references.md with the citation chain.
        4. NEW MANDATORY-NEXT-MILESTONE entry in ops/known-issues.md:
           "Fast-Slow Variant CONFIRMED — paper-v6 §3 citation locked
           (.192+ MANDATORY: planner SHOULD use Fast-Slow Variant as
           default verify-repair selection; FR-11 parameter-update RL
           is now contraindicated for new continual-learning work)."

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.fast_slow_codification.v2"
        - experiment: 1838
        - run_date: ISO-8601 UTC
        - duration_s: > 60s (prose + 3 file edits + diff review)
        - random_seed: 173038
