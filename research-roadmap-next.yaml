- id: exp865-constraint-memory-compression
  milestone: 2026.04.66
  deliverable: results/experiment_865_constraint_memory_compression.json
  title: 'Exp 865: Constraint Memory Bank Compression — arXiv 2601.00756 K=32 Centroids (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2601.00756 (Memory Bank Compression for Continual Adaptation) proposes
    online k-means clustering of a memory bank to compress it while preserving retrieval
    quality. Applied to EmbeddingConstraintStore: after 10 sessions of accumulation, the
    store may have thousands of constraint embeddings. K=32 centroid compression reduces
    storage by ~100x while aiming to preserve retrieval AUROC.

    Current EmbeddingConstraintStore (from .65 history) has a known L2-norm bug in
    retrieval (RETRO-CONSTRAINT-ZERO-DELTA). This experiment may or may not fix that bug
    (the bug is in the query path, not the storage path). The compression experiment
    focuses on storage efficiency.

    EXISTING CODE TO READ FIRST:
    - python/carnot/stores/embedding_constraint_store.py — EmbeddingConstraintStore
      (find add_constraint(), retrieve(), embedding format)
    - results/experiment_847_constraint_retrieval_v3.json — retrieval delta=0 diagnosis
    - results/experiment_848_constraint_retrieval_v4.json — L2-norm fix attempt result
    - research-references.md — arXiv 2601.00756 entry
    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc Phase 4 section

    TASK: Implement MemoryBankCompressor using online k-means (K=32). Compress a
    synthetic 10-session EmbeddingConstraintStore. Compare retrieval AUROC before/after
    compression. Report memory_compression_viable.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/stores/embedding_constraint_store.py.
       Find: how embeddings are stored (likely numpy array or list), retrieve() method,
       any L2 normalization. Note line numbers.
    3. Also check: does retrieve() use L2-normalized dot product? If not, this is the
       RETRO-CONSTRAINT-ZERO-DELTA root cause. Note it but do NOT fix in this experiment
       (separate concern from compression).
    4. Implement python/carnot/stores/memory_bank_compressor.py:
       from sklearn.cluster import MiniBatchKMeans
       import numpy as np

       class MemoryBankCompressor:
         def __init__(self, k: int = 32):
           self.k = k
           self.kmeans = MiniBatchKMeans(n_clusters=k, random_state=42)

         def compress(self, embeddings: np.ndarray,
                      labels: list) -> tuple[np.ndarray, list]:
           # embeddings: (N, D) array; labels: N constraint labels
           # Returns: (k, D) centroid array and k majority-vote labels
           if len(embeddings) <= self.k:
             return embeddings, labels  # no compression needed
           self.kmeans.fit(embeddings)
           centroids = self.kmeans.cluster_centers_
           cluster_labels = []
           for c in range(self.k):
             mask = self.kmeans.labels_ == c
             cluster_label_vals = [labels[i] for i in range(len(labels)) if mask[i]]
             # majority vote
             from collections import Counter
             majority = Counter(cluster_label_vals).most_common(1)[0][0]
             cluster_labels.append(majority)
           return centroids, cluster_labels

         def compression_ratio(self, original_n: int) -> float:
           return original_n / self.k
    5. Wire into EmbeddingConstraintStore: add method compress(k=32) that calls
       MemoryBankCompressor.compress() on stored embeddings.
    6. Build synthetic benchmark:
       - Generate 10-session constraint store: 100 constraints per session × 10 sessions = 1000.
       - Embeddings: random unit vectors in R^64 with 5 semantic clusters (by construction).
       - Labels: binary (constraint_satisfied or not).
       - Measure retrieval AUROC before compression (cosine similarity retrieval).
       - Compress to K=32 centroids.
       - Measure retrieval AUROC after compression.
    7. Compute AUROC using sklearn.metrics.roc_auc_score:
       For each query embedding (from a held-out set of 50):
         - Retrieve top-5 neighbors by cosine similarity.
         - Score = max similarity of top-5.
       Labels: held-out constraint correctness.
    8. Create scripts/experiment_865_constraint_memory_compression.py using ExperimentTemplate(865).
       tmpl = ExperimentTemplate(865, "Constraint memory bank compression K=32",
                                  "results/experiment_865_constraint_memory_compression.json",
                                  requires_gpu=False)
