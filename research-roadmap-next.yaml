      verdict: "complete_null: no_supported_solver_kit_primitive_with_direct_causal_heldout_receipts_no_solve_claim"
      addressed_by: "Exp7099 uses the current E3AgentPolicy and make_carnot_agent path, requires actual valid action execution, and records simulation-to-action causal receipts for two current local GGUFs."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    ARC is the operator's priority. Adapter-backed registry replay covers 183
    of 183 known levels but does not show what the live reusable mechanism can
    do when a game's adapter and trajectory recipe are withheld. Earlier LOO
    work lacked direct causal receipts. This task proves only that the intended
    path can act under isolation; it does not claim a solve.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md Continuous Self-Learning and ARC sections
    - {project_root}/ops/known-issues.md adapter-withheld ARC directive
