  # ---- P0.1 v2: THE crux — does energy beat self-consistency at equal compute?
  - id: exp3426-energy-descent-vs-ar-vs-self-consistency-premise-v2
    operator_override: "2026-05-29 operator directive (standing): P0.1 is the hand-authored Phase-3 de-risking experiment in ops/known-issues.md. exp3312 (.315) landed flagged_adversarial AND lost to equal-compute self-consistency; this v2 is the intended clean supersession that adds the matched-compute SC control as the PRIMARY comparison, not a doomed rerun."
    prior_failures:
      - experiment_id: exp3312-energy-descent-vs-autoregressive-premise-v1
        verdict: "complete: energy_descent_beats_ar_premise_validated (but flagged_adversarial; energy-selection 0.840 LOST to equal-compute self-consistency 0.895, delta -0.055)"
        addressed_by: "exp3312 compared energy-selection only to GREEDY AR and was quarantined (flagged_adversarial). This v2 clears the flag with clean methodology (random_seed + reproducibility_checksum + plausible duration), and makes the matched-compute SELF-CONSISTENCY majority vote the PRIMARY control. It adds two conditions exp3312 lacked: a self-certainty Best-of-N selector (arXiv:2502.18581) and an ENERGY-WEIGHTED vote / latent energy-descent calibration (EBM-CoT arXiv:2511.07124). The headline becomes energy-vote minus majority-vote SC at matched k — the only honest test of whether energy adds value over sampling."
        retire_if_same_verdict: true
    milestone: "2026.05.316"
    title: "P0.1 v2 — Energy-Descent vs AR vs Self-Consistency vs Self-Certainty BoN (matched compute)"
    priority: critical
    max_turns: 100
    model: opus
    agent_type: claude
    requires_claude: true   # (1) gemini's prior energy-descent attempts stalled and exp3312 was flagged; (2) 5+ files: boltzmann_gpt.py + continuous_ebm.py + verifier energy + GSM8K loader + AR/SC/self-certainty/energy-vote conditions + paired stats; (3) open-ended judgment on matched-compute accounting + energy-weighting scheme that no deterministic gate substitutes for.
    estimated_wall_time_min: 130
    track: evidence
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: "results/experiment_3426_energy_descent_vs_ar_vs_self_consistency_premise_v2.json"
    prompt: |
      CONTEXT: P0.1 is the single most important test in the project — does
      energy-descent reasoning on continuous latents BEAT token sampling? exp3312
      (.315) found energy-selection (0.840) beat GREEDY AR (0.750, +0.090,
      McNemar p=0.033) but LOST to equal-compute self-consistency (majority vote
      over the same 3 samples, 0.895, delta -0.055) — and the artifact was
      flagged_adversarial, so it is quarantined and NOT headline-eligible. The
      honest, load-bearing question is therefore: does energy add ANYTHING beyond
      plain majority vote at the same compute budget? Recent work frames this:
      EBM-CoT (arXiv:2511.07124) calibrates latent CoT toward low-energy/high-
      consistency regions (the mechanism to mirror); self-certainty BoN
      (arXiv:2502.18581) is the strongest cheap selector energy must beat;
      generative verifiers (arXiv:2408.15240) show BoN+majority nearly matches an
      oracle. Either outcome is high value: if energy beats SC, that is the FIRST
      real justification for the Phase-3 endgame; if not (and flagged again), the
      energy-descent-superiority framing retires.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3312_energy_descent_vs_autoregressive_premise_v1.json
          (the contested predecessor — read its design, do NOT copy its flagged numbers)
        - python/carnot/phase3/boltzmann_gpt.py (continuous-latent refinement substrate)
        - python/carnot/phase3/continuous_ebm.py (latent EBM)
        - scripts/experiment_template.py (cached_sota_pair, BatchedInferenceRunner)
        - research-references.md ".316 Post-.315" section (EBM-CoT + the baseline ladder)
        - ops/known-issues.md exp3312 spec (authoritative)

      TASK: Paired head-to-head on a REAL reasoning benchmark across FOUR conditions
      at MATCHED compute, clean methodology, with a falsifiable significance gate.
      The PRIMARY comparison is energy-weighted vote vs majority-vote self-consistency.

      PRECONDITIONS (step 0, before any inference — emit blocked_* and STOP if any fail):
        a. CUDA available: python -c "import torch; assert torch.cuda.is_available()".
           If not -> honest_verdict blocked_cuda_unavailable.
        b. The continuous-latent refinement substrate (boltzmann_gpt / continuous_ebm)
           is trainable/loadable. If not -> blocked_energy_descent_substrate_unavailable.
        c. A real reasoning corpus with ground-truth labels (GSM8K subset >=200,
           held-out; the exp281 GSM8K corpus is acceptable). If not ->
           blocked_real_task_corpus_missing.
        d. The SOTA GGUF loads via the GGUF path (NOT AutoTokenizer on a -GGUF repo
           id — embedded tokenizer, per the 2026-05-29 GGUF tokenizer rule):
           llama_cpp.Llama(model_path=..., vocab_only=True).tokenize(b"x") succeeds.
           If not -> blocked_sota_gguf_tokenizer_unavailable.

      CONCRETE STEPS:
        1. Fix the GSM8K split: n>=200, held-out, documented seed. Same paired
           problems across ALL conditions. MODEL_SPECS = ["unsloth/Qwen3.6-35B-A3B-GGUF"].
        2. CONDITION 1 (greedy AR control): 1 greedy generation/problem. Record
           per-problem pass/fail. This is the SAME control exp3312 reported.
        3. CONDITION 2 (self-consistency, the PRIMARY control): draw k samples
           (k>=5, temp ~0.8); answer = majority vote over the k extracted answers.
        4. CONDITION 3 (self-certainty BoN, arXiv:2502.18581): over the SAME k
           samples, select by self-certainty (mean token confidence); report its
           accuracy. The strongest cheap selector energy must beat.
        5. CONDITION 4 (ENERGY — the premise): over the SAME k samples, compute the
           verifier/Boltzmann-GPT energy per candidate and (a) energy-argmin select
           AND (b) energy-WEIGHTED vote (softmax(-E/T) over answers), mirroring
           EBM-CoT latent calibration. Report both. This is the condition under test.
        6. MATCHED COMPUTE: conditions 2-4 all consume the SAME k generations; only
           the selection/aggregation differs. Greedy AR (condition 1) is the 1-sample
           floor. State the exact generation budget per condition so the comparison
           is apples-to-apples (energy must not get extra samples).
        7. Compute accuracy per condition + the PRIMARY paired delta (energy-vote
           minus majority-vote SC) with McNemar exact + paired bootstrap CI95. Also
           report energy-vote minus greedy AR (the exp3312 framing) for continuity.
        8. Emit results with all REQUIRED ARTIFACT FIELDS and clean methodology so
           adversarial_verify.py does NOT flag it (real duration >=60s, seed, checksum,
           model_specs, inference_substrate).

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="Terminal verdict must start with complete:/success:/passed:/shipped_."
        inference_substrate: value=live_llm_inference
        task_name: principle="name the real benchmark + split; toy/synthetic is NOT acceptable."
        n_problems: principle=">=200 for a CLT-valid accuracy delta."
        k_samples: principle="generations per problem for conditions 2-4; the matched-compute budget."
        ar_greedy_accuracy: principle="1-sample greedy control (the exp3312 baseline)."
        self_consistency_accuracy: principle="majority vote over k samples — the PRIMARY control energy must beat."
        self_certainty_bon_accuracy: principle="self-certainty Best-of-N (arXiv:2502.18581) — the strongest cheap selector."
        energy_argmin_accuracy: principle="energy-argmin selection over the same k samples."
        energy_weighted_vote_accuracy: principle="energy-weighted vote (EBM-CoT) — the premise under test; the headline condition."
        delta_energy_vs_self_consistency: principle="energy_weighted_vote minus self_consistency at MATCHED compute — THE headline; does energy add value over majority vote?"
        delta_energy_vs_greedy_ar: principle="energy minus greedy AR — reported for continuity with exp3312."
        paired_significance: principle="McNemar exact p + paired bootstrap CI95 for the PRIMARY (energy vs SC) delta; an unpaired or n<200 delta is gameable."
        compute_parity_note: principle="state per-condition generation budget + param count so energy does not win by spending more compute."
        random_seed: principle="determinism precondition for reproducibility."
        reproducibility_checksum: principle="content hash of corpus+substrate+seed."
        duration_s: principle="real live 35B inference over 200 problems x k samples takes minutes; 60s floor — a sub-60s duration is the fabrication signal that flagged exp3312-class artifacts."

      ACCEPTANCE GATES:
        - condition: "energy_weighted_vote_accuracy >= self_consistency_accuracy AND paired_significance favors non-inferiority"
          principle: "G1 ENERGY-NON-INFERIOR: energy at least matches plain majority vote at equal compute. Below this, energy adds nothing over sampling and the premise is unsupported."
        - condition: "delta_energy_vs_self_consistency > 0 with paired p < 0.05"
          principle: "G2 ENERGY-ADDS-VALUE: energy SIGNIFICANTLY beats majority vote at matched compute — the FIRST real justification for the Phase-3 foundation-model endgame."

      TERMINAL VERDICTS (all start with complete:):
        - G2 passes -> "complete: energy_beats_self_consistency_premise_validated"
        - G1 passes, G2 fails -> "complete: energy_matches_but_does_not_beat_self_consistency_at_equal_compute"
        - G1 fails -> "complete: energy_below_self_consistency_premise_unsupported_retire_superiority_framing"
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3426_energy_descent_vs_ar_vs_self_consistency_premise_v2.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  # ---- P0.2: the alpha_t grounding keystone (continuous-self-learning depth) ----
  - id: exp3427-verifier-ensemble-lambda-min-diversity-audit-v2
    operator_override: "2026-05-29 operator directive (standing): P0.2 is the hand-authored alpha_t-grounding keystone audit in ops/known-issues.md; it was DISPLACED in .315 (exp3313 became a repair autopsy) and never ran. scope-match vs exp1224 (k=3 collapse) is the intended supersession to a deliberately disjoint-kernel larger-k audit, not a doomed rerun."
    prior_failures:
      - experiment_id: exp1224-phase5c-adversarial-probe
        verdict: "complete: k=3 ensemble pairwise_max_correlation=1.0 — effective ensemble collapsed k=3 -> k=1"
        addressed_by: "exp1224 showed a k=3 ensemble collapsed to effective k=1 (verifiers perfectly correlated via the shared decoder). This task measures lambda_min(Sigma) + participation-ratio effective-k on a DELIBERATELY disjoint-kernel suite (structural / empirical / semantic / anti-vacuity / memory classes) at larger k, to test whether real diversity is recoverable or the collapse is intrinsic. The FoVer headline (exp2837) corroborates the risk: 3 of its 4 verifiers showed ZERO learning contribution."
        retire_if_same_verdict: true
      - experiment_id: exp3313-verifier-ensemble-lambda-min-diversity-audit-v1
        verdict: "displaced — deliverable became a repair-substrate autopsy; the diversity audit never ran"
        addressed_by: "The .315 P0.2 slot produced a different artifact (repair-substrate autopsy) and never measured lambda_min(Sigma). This v2 actually runs the diversity audit per the authoritative ops/known-issues.md spec."
        retire_if_same_verdict: true
    milestone: "2026.05.316"
    title: "P0.2 v2 — Verifier-Ensemble Joint-Null-Space / lambda_min(Sigma) Diversity Audit"
    priority: critical
    max_turns: 40
    agent_type: gemini
    model: gemini-3.1-pro-preview
    estimated_wall_time_min: 45
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: true
    deliverable: "results/experiment_3427_verifier_ensemble_lambda_min_diversity_audit_v2.json"
    prompt: |
      CONTEXT: alpha_t grounding — the keystone that lets a self-correcting model
      avoid self-distillation collapse (PRD FR-11 / continuous self-learning) —
      only holds if the verifier ensemble has real diversity (a small joint null
      space). exp1224 showed k=3 collapsing to effective k=1, and the FoVer
      headline (exp2837) showed 3 of its 4 verifiers contributing zero. This audit
      was DISPLACED in .315 and never ran. It is cheap (verifier scoring over
      cached candidates, reuses the FoVer corpus) and is THE milestone's
      continuous-self-learning depth experiment.

      EXISTING CODE TO READ FIRST:
        - python/carnot/verify/ (the verifier suite, 173 modules; label each by kernel class)
        - data/fover_corpus.jsonl (the cached candidate corpus, 8829 rows)
        - results/experiment_2837_fover_memory_leakage_v3.json (the 3-of-4-zero pattern)
        - ops/known-issues.md exp3313 spec (authoritative)

      TASK: Measure lambda_min(Sigma), effective-k (participation ratio), and
      per-verifier drop-one-out contribution on the broadest disjoint-kernel
      verifier suite, on FoVer + an adversarial/OOD slice.

      PRECONDITIONS (step 0):
        a. FoVer corpus present (data/fover_corpus.jsonl) + an adversarial/OOD slice.
           If not -> blocked_corpus_missing.
        b. The verifier suite is callable in batch over cached candidates with a
           configurable verifier set. If not -> blocked_verifier_suite_uncallable.
        c. CUDA available for any model-based verifiers. If not, run CPU-only
           verifiers and record which were skipped (do NOT silently drop them).

      CONCRETE STEPS:
        1. Assemble the broadest available verifier set, labeled by kernel class
           (structural: Z3/AST; empirical: PBT/execution; semantic: ThinkPRM/
           semantic-cosine; anti-vacuity: liveness/coverage; memory: fr11).
        2. Score every verifier on FoVer + the adversarial slice; build the k x k
           verifier-DECISION covariance matrix Sigma.
        3. Compute: lambda_min(Sigma); the full pairwise-correlation matrix;
           effective-k via participation ratio (sum(lambda)^2 / sum(lambda^2));
           per-verifier marginal contribution (drop-one-out AUROC delta).
        4. Identify which verifiers share a null space (high pairwise correlation,
           zero drop-one-out contribution — the exp2837 "3-of-4 contribute zero").
        5. Emit results with all REQUIRED ARTIFACT FIELDS.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="complete:/success:/passed:/shipped_ prefix."
        inference_substrate: value=verifier_ensemble_against_cached_candidates
        k_verifiers: principle="how many verifiers in the audited suite."
        lambda_min_sigma: principle="smallest eigenvalue of the decision covariance; the joint-null-space proxy. Zenil-stack threshold is >0.1."
        pairwise_max_correlation: principle="the exp1224 collapse signature; near-1.0 means redundancy."
        effective_k_participation_ratio: principle="how many verifiers ACTUALLY contribute independent signal vs nominal k."
        per_verifier_dropout_contribution: principle="drop-one-out AUROC delta per verifier; zero means that verifier is null."
        n_examples: principle=">=1000 for a stable covariance estimate."
        random_seed: principle="determinism."
        reproducibility_checksum: principle="content hash."
        duration_s: principle="verifier scoring; 1s floor."

      ACCEPTANCE GATES:
        - condition: "lambda_min_sigma > 0.1 AND effective_k_participation_ratio >= 3"
          principle: "G1 GROUNDING-HOLDS: the ensemble has real diversity, so the alpha_t grounding signal that prevents self-distillation collapse survives at production k — the keystone precondition of the self-improvement thesis."

      TERMINAL VERDICTS (all start with complete:):
        - G1 passes -> "complete: verifier_ensemble_diversity_sufficient_grounding_holds"
        - G1 fails -> "complete: verifier_ensemble_null_space_collapse_confirmed_grounding_at_risk"
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3427_verifier_ensemble_lambda_min_diversity_audit_v2.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  # ---- Kona solve-rate correctness gate (concrete instance of P0.1) --------
  - id: exp3428-kona-global-opt-correctness-gate-v2
    operator_override: "2026-05-30 operator directive (ops/known-issues.md NEW 2026-05-30 Kona correctness-first gate): re-gate Kona global-opt on solve-rate. The .315 instance (exp3417) produced NO artifact; this re-attempt is the intended continuation, not a doomed rerun."
    prior_failures:
      - experiment_id: exp3408-kona-global-opt
        verdict: "SUCCESS but solved_sudoku=False (energy plateaued at 10, not 0)"
        addressed_by: "Re-gated on SOLVE-RATE not time. STEP 0a (encoding validity: a known-valid solved board MUST give E==0) and STEP 0b (easy-tier sanity) are mandatory and gating BEFORE any optimization. Diagnoses the energy~10 plateau as local-minimum vs representational and tests an optimizer ladder (annealing, random restarts, parallel tempering, constraint-aware block moves, Lagrangian penalties). Forbids the fast-but-wrong timing framing exp3408 invited."
        retire_if_same_verdict: true
      - experiment_id: exp3417-kona-global-opt-correctness-gate-v1
        verdict: "no artifact produced (never ran in .315)"
        addressed_by: "The .315 Kona solve-rate slot never produced an artifact. This re-attempt runs the same correctness-first spec per the authoritative ops/known-issues.md entry."
        retire_if_same_verdict: true
    milestone: "2026.05.316"
    title: "Kona global-optimization solve-rate gate (correctness-first)"
    priority: critical
    max_turns: 60
    agent_type: gemini
    model: gemini-3.1-pro-preview
    estimated_wall_time_min: 60
    track: evidence
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: "results/experiment_3428_kona_global_opt_correctness_v2.json"
    prompt: |
      CONTEXT: exp3408 ran Kona-style global optimization on hard Sudoku:
      initial_energy=2104 -> final_energy=10.05 over 50,000 steps,
      time_to_solution=14.1s vs autoregressive 212.2s — but solved_sudoku=False
      (final energy 10, not 0 = constraints still violated). The implied ~15x
      "speedup over autoregressive" is fast-but-wrong-vs-slow: meaningless. A
      speedup claim is invalid until the method actually SOLVES. This is the
      cleanest concrete testbed for P0.1: if Carnot's Ising energy can't solve
      hard Sudoku via global optimization, that is load-bearing evidence about the
      non-AR-reasoning endgame. The .315 slot (exp3417) never produced an artifact.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3408_kona_global_opt.json (the plateau-at-10 result)
        - python/carnot/samplers/adaptive_ising.py (parallel tempering / replica exchange)
        - python/carnot/phase3/scrambled_grid_puzzle.py + snap_validity.py (if present)
        - ops/known-issues.md NEW 2026-05-30 Kona correctness-gate spec (authoritative)

      TASK: Re-gate Kona global-opt on SOLVE-RATE (valid board, final_energy==0
      verified on the BOARD), not time. STEP 0 is mandatory and gating.

      CONCRETE STEPS (STEP 0 IS MANDATORY AND GATING — run BEFORE any optimization):
        0a. ENCODING VALIDITY (hard precondition): encode a KNOWN-VALID solved
            Sudoku board into the Ising energy and assert E == 0 (within float eps).
            If a correct solution does NOT give E==0, the energy formulation is
            wrong (missing constraint / unbalanced penalty weights) — STOP, write
            honest_verdict: complete: blocked_energy_encoding_invalid_per_constraint_residual_reported
            with the per-constraint residual-energy breakdown, and do NOT run any
            optimization.
        0b. EASY-TIER SANITY: before any HARD puzzle, confirm the current optimizer
            solves EASY boards (many clues, near-fully-constrained). If it cannot
            solve easy, the failure is REPRESENTATIONAL (energy/encoding), not
            optimizer power — report that and do NOT climb the optimizer ladder.
        1. Only if 0a passes (E==0 on a valid board) AND 0b solves easy: run the
           optimizer ladder (slower annealing -> random restarts (K parallel inits)
           -> parallel tempering / replica exchange (adaptive_ising.py) ->
           constraint-aware block moves -> adaptive penalty weights / Lagrangian),
           reporting solve_rate by difficulty AND by optimizer_variant. Use
           MODEL_SPECS = ["unsloth/gemma-4-26B-A4B-it-GGUF"] only if an LLM proposal
           step is part of the hybrid; the core optimizer is the Ising sampler.
        2. Characterize the energy~10 plateau: report n_violated_constraints at the
           plateau (a few cells = 'almost solved', optimizer-fixable; pervasive =
           representational).
        3. If pure energy descent still can't close the last violations, test the
           energy-guided + constraint-propagation hybrid (energy proposes; Carnot's
           Z3/AST/arc-consistency verifiers clean up residual violations) and report
           its solve_rate separately — narrows the claim honestly from
           'energy replaces search' to 'energy is a global heuristic' if only the
           hybrid solves.

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        encoding_validity_E0: principle="E of a known-valid solved board MUST be 0 (Step 0a); if not, energy is mis-specified — gating precondition; report per-constraint residual when it fails."
        easy_tier_solve_rate: principle="must solve EASY boards (Step 0b) before any hard-board claim; near-0 means representational failure, not optimizer power."
        n_violated_constraints_at_plateau: principle="distinguishes 'almost solved' (a few cells) from pervasive infeasibility; exp3408 plateaued at energy 10.05."
        hybrid_solve_rate: principle="solve_rate of the energy-guided + constraint-propagation path (Step 3), reported separately so the claim is honest."
        solve_rate: principle="fraction of puzzles reaching a VALID solution (final_energy==0 verified on the BOARD). This is the gate; time is meaningless without it."
        n_puzzles: principle=">=20 puzzles across difficulty tiers; solve_rate on n<20 is not headline-eligible."
