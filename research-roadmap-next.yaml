    TASK:
    Bind the staged V677 design to its YAML. Write docs/research-notes/v677-method-map.md. This administrative task never gates science.
    Deliverable: {project_root}/results/experiment_7781_v677_contract_methods.json.

    CONCRETE STEPS:
    1. Print a flushed progress line at every phase boundary. Print before and after every model load, generation call, benchmark and subprocess. Include phase, elapsed seconds and completed units. Inside long loops, emit progress or supervised-child status at least every 60 seconds. Keep every silence gap below 600 seconds. Poll children and terminate only owned processes at their declared timeout. Never pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Keep each tool call bounded. Poll commands at intervals of at most 60 seconds. File-writing silence also triggers the stall rule.
    3. Check input paths, schemas, hashes, resources and exact upstream fields before expensive work. Distinguish declared science producers from conductor pre-gate receipts. An absent or disqualified external prerequisite is terminal blocked, never partial. Record each failed check and observed value.
    4. Add this task's REQ-* and SCENARIO-* to the relevant capability spec before implementation. Write meaningful failing tests first. Freeze changed modules, direct tests, transitive consumers and validation commands before editing. Keep fixtures, pytest basetemp and coverage files outside results/. Create every basetemp parent before subprocess launch.
    5. Preserve historical specs, artifacts and verdicts. Current requirements apply prospectively to current work. Do not weaken an inherited requirement, omit an affected test, add skip/xfail, or change an assertion to green a gate. Historical tests must use authentic immutable fixtures, not the current mutable roadmap. Report broad repository collection separately from the complete affected suite. If an old entrypoint requires the full suite, that requirement still applies when invoking that entrypoint.
    6. Reuse the contract reader with V677 constants. Compare literal design table, embedded JSON contract and YAML: exactly fourteen tasks Exp7781 through Exp7794. Accept only matching staged V677 or matching active V677. Snapshot both authorities with hashes for future historical tests. Preserve the V676 document at openspec/change-proposals/research-roadmap-v676-preserved-20260927.md.
    7. Read the V677 reference review and adopted primary methods: CCHD 2606.08158v1, structural/semantic decoding 2609.23742v1, Memoir 2607.20792v1, delayed feedback 2606.11711v1, and corrected confidence 2608.10008v3. Record transfer assumptions and excluded theorem claims. No remote research-agent fan-out is needed.
    8. Run unchanged roadmap schema, failure-lineage, exclusion, gate, harness-fit, ARC-floor and overdue-priority readers. In private copies reject a missing/reordered task, title drift, an unknown upstream, a gate-field typo, wrong model/substrate and each missing prior subfield.
    9. Account for V676 producers and separate pre-gate receipts. Preserve source-test, coverage-timeout, full-suite and ARC traceability failures. Confirm every declared existing input and every producer gate field. Cold-replay the contract after replacing the current-roadmap fixture with a private later milestone; the immutable historical snapshot must still validate.
    10. Run all frozen affected unit tests. Require 100% statement coverage for every new or changed implementation module, including thin CLI behavior. Use private coverage shards if needed; combine all shards and require every exit to pass. Keep the complete assertion set. Use PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov. Run scoped Ruff check/format, mypy and scripts/check_spec_coverage.py with explicit test paths. Fix owned defects before scientific capture. Record unrelated debt without claiming repository-wide health.
    11. Run applicable ops/e2e-test-plan.md checks and the real entrypoint E2E stated above. Reduce raw rows in a fresh process. Run scripts/adversarial_verify.py on the exact candidate and scripts/verdict_row_consistency_lint.py in its supported strict mode. Save argv, exits, durable logs and hashes. A failed required validation disqualifies the candidate and sets every readiness score to 0.
    12. Write the exact deliverable atomically after validation. Retain per-unit rows for null, rejected, censored and unstarted units. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Keep historical results unchanged. Retire the matched scope if a listed prior verdict recurs. Do not activate, publish, change production defaults, or edit conductor/guards.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, milestone, run_date: Bind this task, 2026.09.677 and {date}. principle: Each record needs a unique owner.
    - honest_verdict: Use a terminal complete_* string, including complete_blocked_* for external blocks. principle: Unchanged external inputs must not consume retries.
    - verdict_class: One of positive | circular_positive | null | blocked | disqualified | partial. Partial means only incomplete owned work. principle: Claim strength travels with the result.
    - flagged_adversarial: Actual boolean from the terminal reader. principle: Invalid evidence cannot open a downstream gate.
    - gate_check_summary: List failed checks with upstream id, path/hash, field, operator, expected and observed values. Use [] only when none fail. principle: A missing producer differs from a scientific null.
    - rows: Per-family/game/seed/arm or per-check records with metrics and raw provenance. principle: A headline must be reproducible from individual units.
    - acceptance_gate_results: Separate validity, readiness, probability_quality, decision_benefit, retention and efficiency; unmeasured values are null. principle: Working fixtures do not establish benefit.
    - duration_s, phase_spans: Measured monotonic total and phase times, including validation and cold replay. principle: Real elapsed work determines substrate authenticity.
    - random_seed, reproducibility_checksum: Hash exact code, data, roles, parameters and seeds. principle: Another process must recover the same inputs.
    - sample_size_budget: Intended, eligible, started, completed, excluded, censored and independent N. principle: Views and repeated seeds do not create independent families.
    - source_artifact_hashes: Exact paths, digests, dates, imported fields and eligibility. principle: A convenient old file cannot replace a missing current producer.
    - preconditions_checked: Actual input, custody, backend and resource observations. principle: Cheap failures should precede expensive work.
    - validation_receipts: Frozen affected scope, argv, exits, log hashes, coverage, real E2E, cold replay and terminal readers. principle: Every registered requirement must pass before readiness.
    - verifier_is_oracle, claim_scope: Fixtures and exact-authority success use circular_positive. Natural data remain exposed development evidence. principle: Deterministic fixture truth is not independent semantic accuracy.
    - field_principles: Echo the rationale for every field and gate. principle: Readers need to know what each check protects.
    - inference_substrate, inference_substrate_class: Declare aggregation_from_upstream_artifacts and aggregation. Record planned and actual classes separately if blocked before compute. principle: Duration floors follow invoked work, not names cited in a report.
    - MODEL_SPECS, model_specs, model_invocation_counts: []; record actual model calls, loaded-file hashes and tokens. principle: Only current invocations belong in model metadata.
    - contract_ready_score: 1 only after exact contract and unchanged-reader success. principle: Administrative correctness does not prove a scientific effect.
    - method_map_path, authority_snapshot_paths: Durable methods note and hashed YAML/design snapshots. principle: Later milestones must not invalidate historical tests.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7781_v677_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
