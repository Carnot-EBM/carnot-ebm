- id: exp1269-paper-v6-critical-fixes-v2
  milestone: 2026.04.99
  deliverable: results/experiment_1269_paper_v6_critical_fixes_v2.json
  title: "Paper-v6 Critical Fixes v2 - Measured Claims Only"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 45
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  prior_failures:
    - experiment_id: exp1257-paper-v6-critical-issues-fix
      verdict: in_progress
      addressed_by: "exp1257 stale skeleton. This retry narrows to five named claims, requires artifact updates after each claim, and cites measured .98 artifacts."
      retire_if_same_verdict: true
    - experiment_id: exp1245-figure-integrity-audit-fig3-fix
      verdict: in_progress
      addressed_by: "exp1245 stale skeleton. This task does not rewrite the whole paper; it edits only unsupported measured-claim text."
      retire_if_same_verdict: false
    - experiment_id: exp1205-paper-v5-critical-issues-retry-v3
      verdict: in_progress
      addressed_by: "Earlier paper-fix attempts exceeded budget or skipped pre-tests. This task uses skip_pre_test and a surgical checklist."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    The .98 retro says paper critical fixes remain the publication blocker.
    The verifier orthogonality, Q11 TSS, DiffuTruth, and QuantKAN measurements now exist.
    The paper must cite measured artifacts and remove unsupported speedup/provenance claims.

    Use {project_root} as the project root and {date} as the run date in any artifact metadata.

    EXISTING CODE TO READ FIRST:
    - docs/arxiv-paper/main.tex
    - openspec/change-proposals/paper-v5-integrity-remediation.md
    - results/experiment_1256_verifier_orthogonality_audit_v3.json
    - results/experiment_1264_q11_tss_instrumentation_v2.json
    - results/experiment_1265_diffutruth_vs_carnot_baseline.json
    - results/experiment_1266_quantkan_3bit_lut_kan.json

    TASK:
    Fix the five critical paper integrity issues with minimal edits and write a terminal
    artifact reporting exactly which issues were fixed. Do not create new headline claims.

    CONCRETE STEPS:
    1. Create results/experiment_1269_paper_v6_critical_fixes_v2.json with status="in_progress".
    2. In docs/arxiv-paper/main.tex, search for the five critical claim classes:
       estimated CPU/FPGA speedups, KL measurement provenance, hand-typed CPU constants,
       apples-to-oranges HumanEval latency, and SOS-KAN AUROC ambiguity.
    3. Replace each with measured or explicitly caveated text. Use exp1256/1264/1265/1266
       for measured values where relevant.
    4. Run a narrow text audit command that greps for the old unsupported strings.
    5. Write the final artifact with critical_issues_fixed, issues_fixed_list,
       measured_artifacts_cited, old_claims_remaining, status="complete", honest_verdict.

    Run: python3 -c "import json; d=json.load(open('results/experiment_1269_paper_v6_critical_fixes_v2.json')); print(d.get('critical_issues_fixed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

