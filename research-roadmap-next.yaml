      This task MUST document what comparison is feasible given available resources.

      EXISTING CODE TO READ FIRST:
      - results/experiment_2653_ensemble_v11_adversarial_val.json (ensemble_v11_auroc_mean)
      - results/experiment_2635_gguf_fullscale_benchmark.json (GGUF benchmark results from .252)
      - results/experiment_2623_halluscan_parallax.json (HalluScan OOD benchmark from .251)
      - python/carnot/pipeline/verify_repair.py (pipeline for evaluation)

      TASK: Compare Carnot ensemble v11 against EORM benchmark results; document leaderboard position.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         b. Read results/experiment_2653_ensemble_v11_adversarial_val.json.
            If absent or adversarially_verified != true: use ensemble_v11_auroc from available artifact.
         c. Check for cached SOTA models (for live benchmark fallback):
            `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/` or similar.
            Record: live_inference_available (bool).

      1. Compile EORM reference numbers from arXiv:2505.14999 (use documented numbers, not live access):
         eorm_gsm8k_coverage = 0.907  # 90.7% from paper
         eorm_model_size = 55e6       # 55M parameters
         Record as reference values (not measured by this experiment).

      2. If live_inference_available (SOTA GGUF cached):
         Run 30 GSM8k-style math problems (from a public test set or synthesized):
         For each problem + model response:
           score = ensemble_v11.score(problem, response)
           Record (score, is_correct_by_golden_answer).
         Compute carnot_gsm8k_precision = precision at score > 0.5 threshold.
         Note: this is a PROXY for EORM's coverage metric, not direct equivalence.

