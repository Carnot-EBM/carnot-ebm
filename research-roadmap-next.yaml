  - id: exp3787-p1-discrete-search-adjudication-v3-retry
    milestone: "2026.06.347"
    title: "P1 discrete-search adjudication v3 RETRY (the LAST open energy-existential question): the .346 exp3777 v3 BLOCKED on no-free-GPU. Re-run the discrete-search EBT decode with a VALID positive control (n_train=40000, the regime where from-scratch AR reaches 0.84) and an ar_best>=0.3 gate, to settle artifact-vs-fundamental for energy-as-generator on discrete text. The harness root-cause (starved AR control at n_train=20000) was already diagnosed + fixed in .346. PRECONDITION: a FREE GPU (>=10GB) -- if the rig is busy, exit cleanly to blocked_no_free_gpu (never queue, never fabricate). Outcome: EBT discrete-search acc >0% with AR>=0.3 -> decode-ARTIFACT-bounded (narrow reopen finding for the operator); 0% with AR>=0.3 -> Causal-Inductive-Bias-Gap FUNDAMENTAL (closing-theorem support). energy-as-generator stays BOUNDED from part-b regardless -- this sharpens the MECHANISM, not the strategic conclusion."
    priority: critical
    max_turns: 100
    agent_type: claude
    model: opus
    requires_claude: true   # GPU from-scratch training + bootstrap risk + open-ended mechanistic adjudication (artifact-vs-fundamental) is exactly the hardware-integration + multi-step-reasoning class that routes to claude/opus; gemini crashes GPU, codex risks bailing mid-train
    requires_gpu: true
    estimated_wall_time_min: 110
    track: phase3
    inference_substrate: live_llm_inference
    prior_failures:
      - experiment_id: thesis_a_p1_discrete_search
        verdict: "complete: thesis_a_p1_v1_INCONCLUSIVE_positive_control_failed_ar_0.000_superseded_by_v2_see_corrigendum"
        addressed_by: "v1 reused the SMALL matched-compute model at 3-digit, so the from-scratch AR positive control collapsed to 0.0. v3 uses the SCALED harness (n_train=40000) where AR reaches 0.84, giving a valid positive control."
        retire_if_same_verdict: true
      - experiment_id: thesis_a_p1_discrete_search_v2
        verdict: "complete: thesis_a_p1_v2_INCONCLUSIVE_positive_control_failed_ar_best_0.000_below_0.3_cannot_adjudicate_artifact_vs_fundamental_rerun_with_stronger_ar"
        addressed_by: "v2 used n_train=min(20000,...) which starved AR (ar_best=0.0); the ar_best<0.3 guard correctly returned INCONCLUSIVE. Root cause diagnosed + harness fixed to min(40000,...). v3 reruns the corrected harness."
        retire_if_same_verdict: true
      - experiment_id: 3777
        verdict: "blocked_missing_upstream_artifact (no-free-GPU; the v3 run never produced an artifact)"
        addressed_by: "exp3777 was a RESOURCE block (no free GPU), not a scientific failure -- the harness is already fixed (n_train=40000). This retry adds a strict GPU-FREE precondition that exits cleanly to blocked_no_free_gpu if the rig is busy, so it never half-runs and never queues; otherwise it runs the same corrected adjudication."
        retire_if_same_verdict: true
    deliverable: results/experiment_3787_p1_discrete_search_adjudication_v3_retry.json
    prompt: |
      CONTEXT: This is the ONE genuinely-open energy-existential question and the SINGLE un-landed .346 task
      (exp3777 blocked on no-free-GPU). Both energy-foundation routes are already empirically BOUNDED -- this task
      does NOT reopen that conclusion; it sharpens the MECHANISM behind the energy-as-generator bound: is it an
      ARTIFACT of the decode method (Langevin + a learned emb->token decoder descend off-manifold into the void
      between valid token embeddings) or FUNDAMENTAL (a global symmetric energy E(y_1..y_T) cannot enforce AR's
      step-by-step causal factorization -- the "Causal Inductive Bias Gap")? The decisive cheap test: discard
      Langevin + the learned decoder; decode by PURE DISCRETE SEARCH over VALID-token embeddings ONLY (beam /
      discrete-MCMC). The test ran TWICE in .346 (v1/v2) and was INCONCLUSIVE -- NOT because the energy side
      failed, but because the from-scratch AR POSITIVE CONTROL collapsed to 0.0 (v1 too-small model; v2
      n_train=20000 starves AR on 3-digit MSD-first addition). The ar_best<0.3 guard CORRECTLY returned
      INCONCLUSIVE rather than falsely claiming FUNDAMENTAL (a starved control is FALSE_NEGATIVE_RISK per
      CLAUDE.md). Root cause diagnosed; the harness n_train was fixed to 40000 (the regime where AR reaches 0.84)
      and a post-train checkpoint added. exp3777 (the v3 first attempt) then BLOCKED on no-free-GPU. This retry
      reruns the corrected harness with a VALID positive control -- IF and only if a GPU is free. energy-as-
      generator stays BOUNDED from part-b REGARDLESS of the outcome; the strategic conclusion does not move.
      EXISTING CODE TO READ FIRST (read via scripts/summarize_artifact.py where useful):
      scripts/thesis_a_p1_discrete_search_v2.py (the harness -- CONFIRM n_train is fixed to 40000; if it still
      reads min(20000,...) FIX it to min(40000,...) before running, since that is the diagnosed root cause);
      results/thesis_a_p1_discrete_search_v2.json (the v2 INCONCLUSIVE artifact + its root_cause_diagnosis block);
      results/thesis_a_p1_discrete_search.json (the v1 corrigendum); results/thesis_a_part_b_scaled_seed1.json
      (the part-b bounded run where AR=0.84 -- the regime to match); scripts/thesis_a_part_b_scaled.py (the
      n_train=40000 reference harness); results/experiment_3785_capstone_v346.json (records exp3777 blocked);
      CLAUDE.md "Adversarial Artifact Verification" FALSE_NEGATIVE_RISK (the positive-control discipline).
      PRECONDITIONS (check BEFORE training; if ANY missing -> honest_verdict blocked_<resource>, EXIT, no fabrication):
        a. INTERPRETER: run under .venv/bin/python; `import torch` succeeds and torch.cuda.is_available() is True
           with >=1 device. If torch missing or no CUDA -> blocked_cuda_unavailable.
        b. GPU FREE: a CUDA device is not already saturated by a competing job (check nvidia-smi free memory >=
           ~10GB on at least one device). If no free GPU -> blocked_no_free_gpu (the operator will run the
           corrected harness directly -- the exp3777 / v1 / v2 pattern). Do NOT queue behind another GPU job.
           HANDOFF RAMP (repeated-block retirement): exp3777 ALREADY blocked once on no-free-GPU. If THIS retry
           ALSO exits blocked_no_free_gpu, set handoff_to_operator=true and record in the verdict that the
           in-loop discrete-search adjudication is HANDED TO THE OPERATOR to run directly -- do NOT re-queue this
           task in .348+ (a second consecutive resource-block means the rig is not autonomously free for a
           ~100-min train; re-queuing would just burn another planner slot). The harness is already corrected, so
           the operator only needs to run scripts/thesis_a_p1_discrete_search_v2.py with a free GPU.
        c. DELETE any stale checkpoint from a prior run before training, so v3 trains fresh in the corrected
           n_train=40000 regime.
      CONCRETE STEPS:
        1. Confirm/fix n_train=40000 in the harness (the diagnosed root cause). Train the from-scratch tiny EBT
           AND the matched-compute AR baseline in the SCALED regime (dim=768/4L, ~12000 steps + the learned-
           decoder phase), n_eval>=100, with the post-train checkpoint.
        2. POSITIVE-CONTROL GATE (load-bearing): compute ar_best = max(ar_greedy_acc, ar_selfconsistency_acc).
           If ar_best < 0.3 -> the positive control is STILL starved -> honest_verdict
           "complete: thesis_a_p1_v3_INCONCLUSIVE_positive_control_failed_ar_best_<x>_below_0.3" and STOP (do NOT
           claim artifact-or-fundamental). Set positive_control_passed=false. (Per retire_if_same_verdict, a third
           substantive INCONCLUSIVE retires the in-loop discrete-search approach -> hand to operator.)
        3. ONLY IF ar_best>=0.3: read the EBT discrete-search accuracy (ebt_beam_search_acc / ebt_energy_argmin_acc).
           ebt_best = max over the discrete-search decodes. ADJUDICATE:
             - ebt_best > 0.0  -> "decode-ARTIFACT-bounded": discrete search beats Langevin+learned-decoder ->
               the bound was (partly) a decode artifact -> a NARROW reopen of energy-as-generator decode is
               warranted (record as a finding for the operator; this is NOT a paradigm seed, NOT a re-grind).
             - ebt_best == 0.0 -> "FUNDAMENTAL (Causal-Inductive-Bias-Gap)": even pure on-manifold discrete
               search cannot generate -> supports the closing theorem that a symmetric energy cannot enforce
               causal factorization on discrete text. Record the theorem-support finding.
        4. Report per-method accuracies, sample outputs, training_diverged, n_train used, seeds. Be HONEST: a
           starved control or a divergence is a blocked/inconclusive result, never a fabricated 'FUNDAMENTAL'.
        5. If you ship a test it MUST assert against the script's real behavior (anti-poison-test, the .344 root
           cause).
      INFERENCE-SUBSTRATE HYGIENE: live_llm_inference (from-scratch training + decode); full methodology
      (random_seed, reproducibility_checksum, model_specs naming the EBT + matched AR + n_train). A ~100-min GPU
      run has a large real duration (no DURATION_TOO_SHORT risk). Run `.venv/bin/python
      scripts/adversarial_verify.py <artifact>`; confirm no critical flag (watch FALSE_NEGATIVE_RISK -- a null
      'FUNDAMENTAL' claim is INVALID unless positive_control_passed=true).
      REQUIRED ARTIFACT FIELDS (principle documents WHY; store the bare VALUE):
        honest_verdict:
          principle: "Terminal prefix; blocked_<resource> if a precondition failed; INCONCLUSIVE if the positive control failed."
        inference_substrate: "live_llm_inference (principle: from-scratch EBT+AR training and decode on GPU)."
        positive_control_passed:
          principle: "BARE bool -- ar_best>=0.3. The LOAD-BEARING gate: a null 'FUNDAMENTAL' claim is only valid if the AR positive control reached non-trivial accuracy (else it is FALSE_NEGATIVE_RISK, the v1/v2 failure)."
        ar_best:
          principle: "max(ar_greedy, ar_selfconsistency) -- the positive-control accuracy; must be >=0.3 (and ideally ~0.84, the part-b regime) to adjudicate."
        ebt_best:
          principle: "max EBT accuracy over the discrete-search decodes (beam / energy-argmin) -- the energy-as-generator signal under on-manifold discrete search."
        adjudication:
          principle: "BARE string in {{decode_artifact_bounded, fundamental_causal_inductive_bias_gap, inconclusive_positive_control_failed}} -- the milestone-defining mechanistic verdict."
        n_train:
          principle: "BARE int -- MUST be 40000 (the diagnosed-fixed value); records that the starved-control root cause was addressed."
        per_method_accuracies:
          principle: "ar_greedy/ar_selfconsistency/ebt_argmin/ebt_beam -- the full table, so a reviewer can audit the adjudication."
        training_diverged:
          principle: "BARE bool -- a divergence invalidates the run (report as blocked/inconclusive, not a finding)."
        energy_as_generator_still_bounded:
          principle: "BARE bool, MUST be true -- this task sharpens the MECHANISM only; the part-b strategic bound stands regardless of the v3 outcome."
        preconditions_checked:
          principle: "CUDA + free-GPU + stale-ckpt-deleted verified before training; the anti-fabrication gate."
        handoff_to_operator:
          principle: "BARE bool -- true ONLY if this retry ALSO blocked on no-free-GPU (the 2nd consecutive resource-block); signals the in-loop adjudication is handed to the operator to run directly and must NOT be re-queued in .348+ (the repeated-block retirement ramp)."
        model_specs:
          principle: "Names the from-scratch EBT + matched AR + n_train -- honest substrate."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Content hash catches drift vs the v2 run."
        duration_s:
          principle: "Wall-clock plausibility floor; a ~100-min GPU train is expected (a blocked_no_free_gpu exit is fast and honest)."
      TERMINAL VERDICT examples:
        "complete: thesis_a_p1_v3_decode_artifact_bounded_ar_best_<x>_ebt_best_<y>_positive_control_passed_energy_as_generator_still_bounded"
        "complete: thesis_a_p1_v3_FUNDAMENTAL_causal_inductive_bias_gap_ar_best_<x>_ebt_best_0.000_positive_control_passed"
        "complete: thesis_a_p1_v3_INCONCLUSIVE_positive_control_failed_ar_best_<x>_below_0.3"
        "blocked_no_free_gpu"
      Run: cd {project_root} && .venv/bin/python scripts/experiment_3787_p1_discrete_search_adjudication_v3_retry.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3788-fr11-self-learning-v19-tier3-predictive
    operator_override: "2026-05-29 operator directive (standing): versioned lineage continuation (FR-11 vN+1). STATED forward difference: v17 (.345) was Tier-1 online per-verifier PRECISION tracking; v18 (.346) was Tier-2 CONSTRAINT-MEMORY consolidation; v19 is Tier-3 PREDICTIVE verification (python/carnot/fr11/tier3_jepa.py FR11ExtendedJEPA) -- a DIFFERENT self-learning tier that predicts step-error from a partial/early signal, not a tracker or a memory. False-positive scope-match vs prior FR-11 / continuous_self_learning exps."
    milestone: "2026.06.347"
    title: "FR-11 continuous self-learning v19 -- Tier-3 PREDICTIVE verification on the LIVE verifier (distinct from v17's Tier-1 precision tracker and v18's Tier-2 constraint-memory): train the FR11ExtendedJEPA predictor on the FoVer corpus to PREDICT step-error labels from the verifier feature signal, measure predictive AUROC, and CONFIRM the predictive head does not regress the banked discriminator (the +0.0185 memory contribution is preserved and the headline 0.9131 ensemble is untouched -- Tier-3 is a NEW predictive head, NOT a replacement of the scoring ensemble). CPU JAX (the Tier-3 hardware path: small predictor model on GPU/NPU, here CPU-validated). The self-learning experiment mandated by research-program.md."
    priority: high
    max_turns: 40
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # a CPU JAX predictor train over cached verifier features using the existing FR11ExtendedJEPA API -- formulaic; codex is the standing cheap-default
    estimated_wall_time_min: 16
    track: self-learning
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    deliverable: results/experiment_3788_fr11_self_learning_v19_tier3_predictive.json
    prompt: |
      CONTEXT: research-program.md mandates one continuous-self-learning experiment per milestone (Tiers 1-4).
      v17 (.345) was Tier-1 (online per-verifier precision tracker); v18 (.346) was Tier-2 (constraint-memory
      consolidation). v19 advances to TIER-3 (predictive verification): train a small predictor to PREDICT step-
      error from the verifier feature signal, so a future deployment can fast-path-skip full scoring when the
      predictor is confident (the Tier-3 hardware path: small predictor on GPU/NPU; here CPU-validated). This is a
      genuine forward step, not a re-run of v17/v18. CRITICAL: Tier-3 adds a PREDICTIVE HEAD; it does NOT replace
      or modify the frozen 0.9131 scoring ensemble -- the headline stays untouched.
