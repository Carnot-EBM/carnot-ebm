tasks:
  - id: exp1588-nsvif-dsl
    title: "Exp 1588: Build bounded instruction-to-constraint DSL (NSVIF/RvLLM hook)"
    deliverable: results/experiment_1588_nsvif_dsl.json
    max_turns: 30
    agent_type: codex
    prompt: |
      CONTEXT: The product gap is extracting semantic constraints from instructions.
      EXISTING CODE TO READ FIRST: python/carnot/verifiers/
      TASK: Build a bounded instruction-to-constraint pack that parses NL instructions into a small Carnot DSL and compiles to Python validators.
      CONCRETE STEPS:
      1. Define DSL schema in {project_root}/python/carnot/verifiers/dsl.py.
      2. Write compiler to PySAT/Python verifiers.
      3. Save artifact to results/experiment_1588_nsvif_dsl.json.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

