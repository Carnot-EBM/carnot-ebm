milestone: "2026.08.566"
milestone_title: "External Constraint Transfer and Reversible Self-Learning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6541-v566-direct-source-contract
    milestone: "2026.08.566"
    deliverable: results/experiment_6541_v566_direct_source_contract.json
    title: "V566 direct-source, model-cache, and dependency contract"
    priority: critical
    track: infrastructure-governance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 90
    model: opus
    prior_failures:
      - experiment_id: exp6528-v565-source-model-method-contract
        verdict: "blocked_v565_source_model_method_contract: unavailable_required_channels=openreview"
        addressed_by: "This contract makes only the primary source consumed by a downstream experiment mandatory; DRIFT commit, license, schema, Z3 replay, and GGUF cache identity are hard checks, while OpenReview and other discovery channels are advisory rows."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V565 stopped before external intake because Exp6528 required an unavailable OpenReview metadata channel. The DRIFT-Bench repository is independently reachable at commit d24cda4f59a6ee06bafe886f4724899a7ec94f1c, is MIT licensed, contains 1,020 problem files, and includes local Z3 replay code. V566 needs a direct source contract that cannot be blocked by an unrelated discovery service. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6527_v565_evidence_eligibility_corrigendum.json
      - {project_root}/results/experiment_6528_v565_source_model_method_contract.json
      - {project_root}/results/experiment_6530_external_constraint_corpus_audit.json
      - {project_root}/research-references.md, {project_root}/research-complete.yaml, and {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/scripts/experiment_template.py, {project_root}/python/carnot/inference/sota_models.py, {project_root}/scripts/conductor_gates.py, and {project_root}/scripts/roadmap_schema.py
      - relevant capability specs, {project_root}/_bmad/traceability.md, and {project_root}/ops/e2e-test-plan.md

      TASK
      Build the V566 direct-source, model-cache, split, and dependency contract. Import eligible V564 evidence by immutable path and hash. Make a source channel mandatory only when a downstream task consumes its content.

      CONCRETE STEPS
      0. Record git status, network state, source-query timestamps, tool versions, CPU/RAM/disk, cache roots without secrets, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for direct-source sufficiency, advisory discovery channels, immutable revision and license checks, model-cache identity, exact field spelling, retired-ID isolation, and atomic terminal output. Write focused tests first.
      2. Recheck the DRIFT repository URL, exact commit, commit date, MIT license, problem-file census, schema, Z3 code, and upstream corrupted-SQLite warning. Record file or tree hashes.
      3. Verify that arXiv, OpenReview, Semantic Scholar, Hugging Face, GitHub discovery, Extropic, and Logical Intelligence are advisory unless a named V566 task consumes their data. Unavailability of an advisory row cannot set the readiness score to zero.
      4. Resolve cached_sota_pair(gpu_indices=(0, 1)) without loading weights. Record exact hub IDs, GGUF filenames, hashes, and load plans for all three mandated models.
      5. Freeze the external family and chronology split, structural controls, cost-guard strata, router calibration and abstention, transactional memory boundary, reversible-memory thresholds, support metrics, ARC no-firing rule, and GateMate changed-state rule before outcomes exist.
      6. Confirm that every structured V566 gate names a task in the V566 roadmap and a field declared verbatim in that upstream task. No requires or gated_on edge may name Exp6528, Exp6529, or another retired task.
      7. Attack unavailable advisory channels, moving branches, license ambiguity, missing source files, GGUF repo-ID tokenizer misuse, renamed readiness fields, retired-ID dependencies, and status-only success.
      8. Set v566_direct_source_ready_score=1.0 only when the direct DRIFT source, local replay, split, model-cache, field, and dependency contracts are implementable. Do not require advisory channel availability.
      9. Write one terminal artifact atomically. Run focused tests with full new-module coverage, lint, spec coverage, gate audit, exclusion-manifest lint, adversarial verification, applicable E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6541_v566_direct_source_contract.json.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, v565_boundary_receipts, immutable_evidence_receipts, direct_source_rows, advisory_discovery_rows, drift_revision_license_schema_contract, source_tree_hashes, upstream_corruption_boundary, model_cache_resolution_rows, gguf_load_contract, frozen_external_split_contract, frozen_structural_contract, frozen_cost_guard_contract, frozen_router_contract, frozen_reversible_memory_contract, frozen_arc_contract, hardware_stop_contract, dependency_and_gate_rows, v566_direct_source_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Use verdict_class=null for a clean governance contract, partial for a usable subset, blocked for a missing direct prerequisite, or disqualified for false provenance. honest_verdict must begin complete_, partial_, blocked_, or disqualified_. Set inference_substrate=direct_primary_source_cache_and_dependency_preflight_no_llm. Set verifier_is_oracle=true only for source, hash, schema, and dependency checks; do not declare a positive scientific class. A blocked verdict must populate gate_check_summary with the failed check and observed value.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6541_v566_direct_source_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6542-drift-bench-external-intake-v2
    milestone: "2026.08.566"
    deliverable: results/experiment_6542_drift_bench_external_intake_v2.json
    title: "Content-pinned DRIFT-Bench external intake v2"
    priority: critical
    track: data-and-evidence
    requires_gpu: false
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6541-v566-direct-source-contract
        artifact_field: v566_direct_source_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6529-drift-bench-external-intake
        verdict: "blocked_gate_check_failed: exp6528-v565-source-model-method-contract.v565_method_contract_ready_score was 0.0, expected 1.0; no intake artifact or fixture was produced"
        addressed_by: "This attempt gates on the new direct-source readiness field, pins the public repository commit directly, and does not depend on the retired OpenReview-sensitive source contract."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6529 never executed because its V565 gate failed. Exp6541 replaces that chain with a direct DRIFT source contract. V566 needs a bounded chronological fixture whose labels and receipts are regenerated locally rather than inherited from the paper. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V566 roadmap document
      - {project_root}/results/experiment_6541_v566_direct_source_contract.json
      - {project_root}/results/experiment_6514_atomic_shard_artifact_transaction.json and its reusable transaction code
      - exact constraint, Z3, checkpoint, artifact, and branch-feature code under {project_root}/python/carnot/
      - the pinned DRIFT README, data README, JSON schema, prompts, and z3_checker.py named by Exp6541
      - relevant specs, tests, traceability, exclusions, and E2E plan

      TASK
      Create a content-pinned, bounded DRIFT-Bench fixture. Preserve base-problem chronology, regenerate every exact receipt locally, seal family-blind splits, and finalize through the shipped atomic transaction.

      CONCRETE STEPS
      0. Evaluate the structured gate and record its expected and observed values, artifact hash, source commit, license, solver versions, resources, fixture bound, and protected-file hashes.
      1. Add REQ-* and SCENARIO anchors for source-to-local identity, chronological preservation, exact replay, lineage sealing, planned-unit accounting, resumable shards, censoring, and atomic finalization. Write tests first.
      2. Fetch or reuse only commit d24cda4f59a6ee06bafe886f4724899a7ec94f1c. Verify the tree and file hashes before transformation.
      3. Freeze a balanced slice across seating, scheduling, and logic-grid domains, multiple sizes, turn positions, and exact effort strata. Freeze the sample before downstream labels or costs are inspected.
      4. Preserve immutable source IDs and assign separate local unit IDs. Keep every cumulative constraint state in chronological order. No turn from a base problem may cross splits.
      5. Replay each admitted turn with the installed Z3 path. Record assignment validity, satisfiability, conflict or MUS evidence when available, solver effort, timeout, censoring, code hash, and terminal status.
      6. Create {project_root}/results/fixtures/v566_drift_bench_external_slice.jsonl through content-addressed shards and an atomic final replace. Do not import upstream result databases or paper aggregates.
      7. Attack duplicate turns, chronology gaps, family aliases, entity-name and row-order leakage, source hash mismatch, solver-version drift, corrupt resume, missing terminal units, and inherited aggregates.
      8. Set external_constraint_corpus_ready_score=1.0 only when every planned unit is terminal, all admitted rows have exact and source receipts, lineage floors hold, hashes close, and the fixture round-trips.
      9. Run focused tests with full new-module coverage, lint, spec coverage, row lint, gate audit, adversarial verification, exact-solver E2E checks, fixture checksum verification, and git status.

      Required deliverables: {project_root}/results/experiment_6542_drift_bench_external_intake_v2.json and {project_root}/results/fixtures/v566_drift_bench_external_slice.jsonl.
      REQUIRED ARTIFACT FIELDS:
        status, honest_verdict, verdict_class, upstream_gate_receipt, source_revision_and_license_receipt, source_tree_and_file_hashes, upstream_corruption_boundary, intake_commitment, family_turn_and_effort_census, source_to_local_identity_rows, exact_replay_rows, solver_receipts, split_commitment, shard_manifest, planned_and_terminal_unit_counts, fixture_path_and_hash, leakage_attack_matrix, external_constraint_corpus_ready_score, gate_check_summary, per_unit_rows, aggregate_row_recomputation, preconditions_checked, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum.
      Use verdict_class=null for a complete data contract, partial for a bounded usable corpus below the readiness floor, blocked for a failed gate or direct precondition, or disqualified for provenance or leakage failure. honest_verdict must begin complete_, partial_, blocked_, or disqualified_. Set inference_substrate=content_pinned_drift_intake_and_local_z3_replay_no_llm. Set verifier_is_oracle=true for exact labels and validity only; do not declare a positive scientific class. A blocked verdict must populate gate_check_summary with the failed check and observed value.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6542_drift_bench_external_intake_v2 --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6543-external-corpus-independent-audit-v2
    milestone: "2026.08.566"
    deliverable: results/experiment_6543_external_corpus_independent_audit_v2.json
    title: "Independent DRIFT corpus provenance, chronology, and replay audit v2"
    priority: critical
    track: infrastructure-audit
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 75
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6530-external-constraint-corpus-audit
        verdict: "blocked_external_constraint_corpus_audit: failed_checks=exp6529_artifact_exists,fixture_exists,pinned_source_root_exists,revision_is_immutable,license_verified,schema_verified,corruption_boundary_text_verified"
        addressed_by: "This audit targets the new V566 intake artifact and fixture built from a directly pinned repository root, and it always emits the readiness field for missing, partial, corrupt, or valid states."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6530 correctly found that V565 had no intake artifact, fixture, or pinned source root. Exp6543 must independently audit the new V566 intake without trusting source aggregates, intake aggregates, or source IDs as proof of split independence. It must always run. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V566 roadmap document
      - {project_root}/results/experiment_6541_v566_direct_source_contract.json if present
      - {project_root}/results/experiment_6542_drift_bench_external_intake_v2.json if present
      - {project_root}/results/fixtures/v566_drift_bench_external_slice.jsonl if present
      - {project_root}/results/experiment_6530_external_constraint_corpus_audit.json
      - the pinned DRIFT source tree, independent Z3 replay path, transaction helper, specs, tests, traceability, exclusions, and E2E plan

      TASK
      Run an independent provenance, chronology, split, transaction, and exact-replay audit. Always write external_constraint_corpus_audited_ready_score with the exact spelling below.

      CONCRETE STEPS
      0. Record artifact and fixture existence, paths and hashes, direct source availability, solver versions, resources, random sample seed, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for independent source hashing, row recomputation, exact replay, chronology, lineage isolation, transaction closure, missing-input disposition, and atomic output. Write tests first.
      2. Resolve the direct source commit independently of Exp6542. Verify revision, license, schema, file census, and corruption warning.
      3. Recompute source-to-local identity and detect duplicates, omissions, source drift, modified constraints, chronology gaps, and turn reordering.
