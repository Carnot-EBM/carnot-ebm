      Project root placeholder: {project_root}. Run date placeholder: {date}.
      This task runs only after exp3282 proves Garak is runnable. Its goal is a small local smoke, not a headline benchmark. If the mandated SOTA GGUF target is unavailable, write a blocked artifact with exact missing-model evidence.

