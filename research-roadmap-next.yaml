  - id: exp5365-v489-grammar-budget-protocol-preflight
    milestone: "2026.07.489"
    title: "Grammar-budgeted structured-output protocol preflight"
    priority: critical
    track: structured-sota
    deliverable: "results/experiment_5365_grammar_budget_protocol_preflight_v489.json"
    agent_type: codex
    model: gpt-5.5
    max_turns: 40
    estimated_wall_time_min: 35
    prior_failures:
      - experiment_id: exp5351-v488-trigger-constrain-structured-protocol
        verdict: "blocked_structured_protocol_clean_false"
        addressed_by: "This task does not rerun live generation; it adds a deterministic grammar/token-budget and completion-slack preflight before the next live GGUF attempt."
        retire_if_same_verdict: true
      - experiment_id: exp5338-v487-trigger-constrain-structured-sota
        verdict: "blocked_structured_sota_protocol_methodology"
        addressed_by: "The methodology gap is addressed by explicit parser/schema/truncation fixtures and minimum artifact fields before any live model call."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5351 proved the local SOTA structured protocol is not clean enough: parse_success_rate=0.75, schema_success_rate=0.25, final_json_extraction_rate=0.75, unsafe_false_accepts=0. The next step is a deterministic preflight inspired by CFGzip and TruncProof, not another live-model prompt first.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/results/experiment_5351_trigger_constrain_structured_protocol_v488.json
      - {project_root}/research-references.md
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/tests/python/
      - {project_root}/python/carnot/

      TASK:
      Build or locate a deterministic structured-output preflight fixture that checks schema reachability, JSON completion slack, truncation-vs-schema failure separation, and tool/action token reachability before any live local GGUF generation.

      CONCRETE STEPS:
      1. Inspect existing structured-output utilities and tests before adding code.
      2. Implement the smallest reusable preflight needed for .489: schema grammar summary, required-field reachability, max-token completion slack, and failure classification for parse/schema/truncation.
      3. Use .488 failed output shapes as regression fixtures where possible.
      4. Add focused tests if code changes are required.
      5. Write {project_root}/results/experiment_5365_grammar_budget_protocol_preflight_v489.json.

      REQUIRED ARTIFACT FIELDS:
      - status: principle: complete only if the deterministic preflight runs and reports all required metrics.
