         answer_space_and_enumerated_chance_floors principle: chance is enumerated from each exact answer space, not estimated from observed model accuracy.
         solver_hardness_model_surface_and_semantic_strata principle: solver conflicts remain diagnostic and are not called model difficulty.
         proof_preserving_relabel_paraphrase_and_inverse_receipts principle: every transform has auditable meaning and inverse behavior.
         shortcut_salience_and_method_validity_manifest principle: final-answer correctness is kept separate from the intended reasoning path.
