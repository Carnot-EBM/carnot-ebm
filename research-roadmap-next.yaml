    \ Discipline\"\n- results/experiment_4245_arc_set_encoder_beats_vote.json + its .py companion\n- results/experiment_4243_arc_candidate_pool_grow_pool.json.gz\
    \ (the candidate pool exp4245 scored)\n- ops/verifier_gaps.md GAP-4 entry's \"Forward protocol (before\
    \ status: filled)\" -- reuse this\n  protocol shape (sandboxed no-filesystem-bypass, genuinely held-out\
    \ tasks, cluster bootstrap +\n  exact tests requiring >=6 discordant wins for two-sided p<0.05, hardened\
    \ exec sandbox with\n  timeout blocking np.load/np.save/np.fromfile/type) as the template for THIS\
    \ hardening, adapted\n  to the set-encoder-vs-vote claim instead of GAP-4's same-shape-rule claim.\n\
    - python/carnot/agentic/arc_solver_kit.py (reproduction gate conventions)\n\nPRECONDITIONS (check\
    \ BEFORE any subsequent step):\n  a. exp4245's artifact and candidate pool exist and load cleanly\
    \ -- if not, honest_verdict\n     blocked_upstream_artifact_missing, stop.\n  b. Confirm the held-out\
    \ split's 52 tasks have zero row-level overlap with whatever process\n     built the 28,443-candidate\
    \ pool (a genuine leak-audit, not an assumption).\n  c. Check whether the candidate pool's rows carry\
    \ a recoverable ARC game_id (the exact blocker\n     that stopped exp4258's cross-game-transfer attempt,\
    \ blocked_arc_game_ids_unrecoverable). If\n     still unrecoverable, skip step 3 (cross-game check)\
    \ with that same honest blocked_* reason\n     for JUST that sub-claim, but still complete steps 1-2\
    \ (multiseed, leak-audit) -- do not let\n     one unavailable precondition block the whole task.\n\
    \nCONCRETE STEPS:\n1. Re-run the set-encoder-vs-vote comparison with >=5 independent seeds (varying\
    \ model init /\n   data order, not re-deriving the candidate pool), report per-seed AUROC/delta and\
    \ a pooled\n   CI95.\n2. Leak-audit: verify no held-out task's gold answer, candidate text, or task_id\
    \ appears in the\n   set-encoder's training signal.\n3. Cross-game check: does the win replicate on\
    \ a SECOND, disjoint ARC pool (not gap3_stage2)?\n4. Cluster-bootstrap + exact test per GAP-4's protocol\
    \ shape (adapt the >=6-discordant-wins\n   two-sided test).\n5. Report HONESTLY either way -- if the\
    \ win doesn't survive multiseed/leak-audit/cross-game, that\n   is the valuable, decisive finding\
    \ this task exists to produce (closes exp5152's dependency\n   cleanly either way).\n\nREQUIRED ARTIFACT\
    \ FIELDS:\n  multiseed_delta_ci95:\n    value: [float, float]\n    principle: \"A single-seed CI is\
    \ not a real interval; multiseed pooling is the minimum bar\n      before this result can inform a\
    \ scaling decision (DiffusionGemma, exp5152).\"\n  leak_audit_passed:\n    value: bool\n    principle:\
    \ \"An unaudited held-out split cannot distinguish a real win from a leaked one.\"\n  cross_game_replication_delta:\n\
    \    value: \"float or null\"\n    principle: \"A win on one pool that vanishes on a second is a corpus\
    \ artifact, not a general finding.\"\n  verifier_is_oracle:\n    value: false\n    principle: \"Must\
    \ stay oracle-distinct (per the Circularity Discipline) to count toward the moat thesis.\"\n  solve_provenance:\n\
    \    value: development_proxy\n    principle: \"This is offline pool-scoring on already-generated\
