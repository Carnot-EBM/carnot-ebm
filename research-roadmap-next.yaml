  - id: exp2898
    milestone: "2026.05.274"
    deliverable: "results/experiment_2898_kv260_ising_sampler_hardware_latency_benchmark_v1.json"
    title: "KV260 Ising Sampler Hardware Latency Benchmark v1"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 60
    estimated_wall_time_min: 90
    track: hardware
    inference_substrate: hardware_smoke
    prior_failures:
      - experiment_id: exp2477
        verdict: "kv260_bitstream_flashed: carnot_ising_v4 written to /lib/firmware/xilinx/"
        addressed_by: "exp2477 produced and flashed the bitstream but did not measure board-level latency. This task closes that gap: SSH to kria, load the overlay, map /dev/uio*, write spins/biases, read energy, time the per-sample loop on real hardware."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT:
        The KV260 board is alive: booted Ubuntu Xilinx 2026-05-20, reachable
        via `ssh kria`, and has the carnot_ising_v4 XDC-constrained bitstream
        flashed to /lib/firmware/xilinx/carnot_ising_v4/ (also exposed under
        the carnot_ising_v2_n64 overlay alias). /dev/uio0 through /dev/uio4
        are exposed when the overlay is loaded. The wishlist retirement
        language that previously kept this work blocked has been lifted as
        of 2026-05-22; the reopen condition is now "produce a board-command
        transcript that records real wall-clock per-sample time."

        This task closes that reopen condition. It must NOT modify the
        bitstream, MUST NOT redo synthesis, MUST NOT touch host-side SD
        card devices (per KV260 SSH-Not-SD-Card Discipline in CLAUDE.md).

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (search for KV260 SSH-Not-SD-Card Discipline,
          Inference-Substrate Declaration Discipline, Pre-Launch
          Preconditions Discipline, Hardware-Task Continuity Discipline)
        - hardware/kv260/discrete_sb_256.v
        - research-hardware-wishlist.md (the 2026-05-22 KV260
          reactivation entry)
        - results/experiment_2477_kv260_bitstream_flash.json (prior
          flash artifact)
        - python/carnot/pipeline/verify_stream.py (for how /dev/uio
          register access is wrapped elsewhere if applicable)

      TASK:
        Produce a board-command transcript on the KV260 that:
        (a) loads the carnot_ising_v4 / carnot_ising_v2_n64 overlay,
        (b) writes a small Ising problem (n=64 spins, random J, h=0) into
            the fabric via /dev/uio* register-mapped memory,
        (c) triggers the sampler, reads energy back, and times the
            per-sample wall-clock,
        (d) repeats for n_samples in {{100, 1000, 10000}} with three
            independent random seeds,
        (e) writes results with full provenance.

        DO NOT claim a speedup over CPU. This task is establishing the
        first honest board-level latency number. Comparison-to-CPU is
        downstream work for a later milestone once the board-side
        measurement is anchored.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. `ssh -o ConnectTimeout=5 -o BatchMode=yes kria 'true'`
              returns 0. If non-zero, write
              honest_verdict: blocked_kv260_ssh_unreachable and exit.
           b. `ssh kria 'sudo xmutil listapps 2>&1 | head'` returns
              entries including 'carnot_ising_v4' OR
              'carnot_ising_v2_n64'. If absent, write
              honest_verdict: blocked_kv260_overlay_missing and exit.
           c. `ssh kria 'ls /dev/uio0 2>/dev/null && echo ok'` echoes
              'ok' AFTER the overlay loads. If still absent after
              loadapp, write
              honest_verdict: blocked_kv260_uio_devices_absent and exit.
           If ANY precondition fails, do NOT proceed to step 1.
        1. Load the overlay if not already loaded:
           `ssh kria 'sudo xmutil unloadapp 2>/dev/null;
                       sudo xmutil loadapp carnot_ising_v2_n64'`
        2. Generate the n=64 Ising problem locally (Python, scripts/
           experiment_2898_kv260_latency.py). Random J ~ N(0, 1/sqrt(n)),
           h = 0. Three independent seeds: 42, 137, 271.
        3. SCP the problem JSON to the board.
        4. Run a Python harness on the board (over SSH) that:
           - opens /dev/uio0 with mmap,
           - writes J and h into the register-mapped memory at offsets
             defined by the bitstream's address map,
           - writes the trigger register,
           - polls the done bit (with a sane timeout),
           - reads back the final spin vector and energy,
           - records wall-clock time per sample.
        5. Repeat for n_samples in {{100, 1000, 10000}} per seed.
        6. Pull the transcript back to the host. Compute median + p95
           per-sample wall-clock time. Record per-seed reproducibility
           checksum (SHA256 of inputs).
        7. Write the deliverable JSON.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Must start with complete:/success: prefix. If a
                      precondition fails, prefix with blocked_<resource>
                      and exit without measuring."
        inference_substrate:
          principle: "Distinguishes hardware_smoke from live_llm_inference
                      so the linter applies the right duration floor."
          value: "hardware_smoke"
        preconditions_checked:
          principle: "Records WHICH board resources were verified before
                      launching. Pre-empts fabrication."
          shape: "list of {{resource: str, available: bool, detail: str}}"
        kv260_ssh_uptime_at_run: str
        kv260_overlay_loaded: str
        kv260_overlay_load_command: str
        kv260_uio_devices_present: list[str]
        bitstream_sha256:
          principle: "Anchors which bitstream produced these numbers."
        ising_problem_spec:
          principle: "Reproducibility — the J matrix, h vector, and
                      seed must be recorded so a third party can
                      regenerate the same input."
          shape: "{{n_spins: int, j_matrix_sha256: str, h_vector_sha256: str, random_seed: int}}"
        per_seed_results:
          principle: "Per-seed measurement is what makes the median + p95
                      meaningful; single-run timings on real hardware are
                      noise."
          shape: "list of {{seed: int, n_samples: int, per_sample_wall_clock_us_median: float, per_sample_wall_clock_us_p95: float, final_energy: float}}"
        random_seeds_used:
          principle: "Recognized by adversarial_verify's plural-form check."
          value: [42, 137, 271]
        reproducibility_checksum:
          principle: "SHA256 over (J, h, seeds, board overlay name,
                      bitstream sha256). Lets a third party verify the
                      run was actually executed on this specific
                      configuration."
        board_transcript_path:
          principle: "Captures the literal SSH stdout for human audit."
          value: "results/experiment_2898_kv260_transcript.log"
        duration_s:
          principle: "Real wall-clock of the host-side task. Hardware
                      runs are slow because of SSH + register-mmap +
                      polling; expect at least 30s. DURATION_TOO_SHORT
                      will fire if below floor."
        run_date: "{date}"

      ACCEPTANCE GATES:
        - condition: "kv260_overlay_loaded is one of carnot_ising_v4 /
                      carnot_ising_v2_n64"
          principle: "Verifies the right bitstream was active. Prevents
                      claiming KV260 results from an unrelated overlay."
        - condition: "len(per_seed_results) == 3 AND all per_seed_results
                      entries have positive per_sample_wall_clock_us_median"
          principle: "Three seeds are the floor for 'this happened more
                      than once'. Single-seed hardware timings are not
                      defensible."
        - condition: "duration_s >= 30"
          principle: "Real SSH + overlay + per-sample loop on n=64 Ising
                      cannot finish in less than 30s. A shorter duration
                      signals fabrication or skip."
        - condition: "bitstream_sha256 matches the sha256 of the file at
                      /lib/firmware/xilinx/carnot_ising_v4/*.bit on the
                      board"
          principle: "Anchors the measurement to a specific bitstream
                      version. Prevents accidental drift across future
                      bitstream updates."

      Do NOT push. Do NOT modify scripts/research_conductor.py. Do NOT
      modify the bitstream. Do NOT claim a speedup vs CPU in this task.

  - id: exp2899
    milestone: "2026.05.274"
    deliverable: "results/experiment_2899_gatemate_a1_n16_ising_tile_bitstream_build_v1.json"
    title: "GateMate A1 yosys/nextpnr LUT Mapping Workaround + n=16 Ising Tile Bitstream Build v1"
    priority: high
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 40
    estimated_wall_time_min: 60
    track: hardware
    inference_substrate: hardware_smoke
    prior_failures:
      - experiment_id: exp1460
        verdict: "GateMate added to portfolio; no bitstream attempt"
        addressed_by: "First actual build attempt for the GateMate A1-EVB-2M now that the board is USB-attached (DirtyJTAG 1209:c0ca confirmed via openFPGALoader --scan-usb 2026-05-22)."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT:
        The Cologne Chip GateMate A1-EVB-2M is USB-attached as of
        2026-05-22 (DirtyJTAG MCU enumerated at 1209:c0ca on bus 3).
        openFPGALoader recognizes it. This task attempts the n=16 Ising
        tile bitstream build using yosys + nextpnr-gatemate. Known
        blocker per the hardware portfolio: yosys/nextpnr LUT mapping
        for the GateMate's 8-input cell behaves differently from the
        4-input mapping used in the KV260 Verilog source. A workaround
        or constraint adjustment is expected.

        This task may succeed or fail honestly; if it fails, the
        artifact must record the specific LUT mapping error so the
        next iteration has a clear root-cause.

      EXISTING CODE TO READ FIRST:
        - hardware/kv260/discrete_sb_256.v (source we are adapting)
        - docs/jtag-wiring-gatemate-dirtyjtag.md (external-DirtyJTAG
          reference; the on-board DirtyJTAG MCU is the canonical path)
        - research-hardware-wishlist.md (the GateMate row in Active
          tracks)

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `command -v yosys && command -v nextpnr-gatemate` both
              succeed. If not, write
              honest_verdict: blocked_gatemate_toolchain_missing.
           b. `openFPGALoader --scan-usb 2>&1 | grep 1209:0xc0ca`
              returns a hit. If not,
              honest_verdict: blocked_gatemate_usb_not_attached.
        1. Adapt hardware/kv260/discrete_sb_256.v to n=16 spins (the
           full-scale n=64 doesn't fit). Save as
           hardware/gatemate/ising_n16_gatemate.v.
        2. Run yosys with -p "synth_gatemate -top ising_n16_gatemate
           -json out.json".
        3. Run nextpnr-gatemate --device CCGM1A1 --json out.json
           --bit out.cfg.bit.
        4. If either step errors, capture the FULL stderr to the
           artifact's lut_mapping_error_log field.
        5. If both succeed: do NOT auto-flash. Record the bitstream
           sha256 and stage flashing for operator review in a follow-on
           task.
        6. Write the deliverable JSON.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        inference_substrate: "hardware_smoke"
        preconditions_checked: list
        yosys_version: str
        nextpnr_gatemate_version: str
        synth_succeeded: bool
        place_and_route_succeeded: bool
        lut_mapping_error_log: str
        bitstream_path: str | null
        bitstream_sha256: str | null
        duration_s: float

      Do NOT flash the bitstream. Do NOT push.

