tasks:
  - id: exp1909-fast-slow-adversarial-confirmation
    title: "Exp 1909: Fast-Slow Variant adversarial confirmation (5th carry-forward attempt; seed + corpus + baseline rotation)"
    deliverable: results/experiment_1909_fast_slow_confirmation.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1837-fast-slow-variant-adversarial-confirmation
        verdict: planner_replaced_in_192
        addressed_by: "exp1837 was in my .192 outer-loop draft; the planner replaced .192 with KAN-MILP scope and exp1837 never ran. Same task spec, NO upstream gate, direct preconditions step 0. retire_if_same_verdict=true to break any silent-replacement cycle."
        retire_if_same_verdict: true
      - experiment_id: exp1811-fast-slow-variant-prototype
        verdict: complete_3.1x_sample_eff_0.25x_kl_drift_no_forgetting
        addressed_by: "exp1811 (.189) shipped FS Variant with paper-matching numbers on a single seed/corpus/baseline configuration. Per the new adversarial-confirmation discipline (memory entry feedback_adversarial_confirmation_protocol), Score-400 findings require independent replication BEFORE paper-v6 citation. This task is the explicit replication."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: exp1811 (.189) shipped Carnot Fast-Slow Variant on the
      4th attempt with paper-matching numbers (sample_efficiency_ratio
      = 3.1x; kl_drift_ratio = 0.25; FR-11 baseline catastrophic forgetting
      on BBH 0.45 + MATH 0.35 while FS held 0.90 + 0.85; 350s real run).

      Operator approved 2026-05-16 ~00:00Z that paper-v6 citation requires
      adversarial confirmation — a second independent run with rotated
      seed + rotated corpus + audited baseline. The new memory entry
      `feedback_adversarial_confirmation_protocol.md` codifies the
      discipline. This task is the FIFTH attempt to ship it (prior 4
      were all silently replaced by planner-drafted scope).

      FALSIFIABLE HYPOTHESIS: An independent re-run of exp1811 with
      (a) seed bumped from 172911 to 192737, (b) DIFFERENT 30-example
      slices for GSM8K/BBH/MATH (not the exact examples used in exp1811),
      and (c) baseline-implementation audit confirming FR-11 path is
      canonical produces sample_efficiency_ratio in [2.6, 3.6] AND
      kl_drift_ratio in [0.15, 0.35] AND FR-11 catastrophic forgetting
      reproduces (passrate < 0.55 on rotated BBH+MATH) AND Fast-Slow
      holds > 0.80 on rotated BBH+MATH.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1811_fast_slow_variant.json (original)
        - python/carnot/pipeline/fast_slow_variant.py (implementation;
          DO NOT MODIFY)
        - python/carnot/pipeline/ebft_autoresearch_loop.py (or
          wherever the FR-11 baseline lives — audit for canonical-ness)
        - feedback_adversarial_confirmation_protocol memory entry

      TASK: Re-run exp1811 with the three rotations.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md; NO gated_on):
           a. `python -c "from carnot.pipeline.fast_slow_variant import
              fast_slow_variant"` succeeds — else
              `blocked_fast_slow_implementation_missing`.
           b. `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/`
              non-empty — else `blocked_model_not_cached`.
           c. `test -f results/experiment_1811_fast_slow_variant.json`
              — else `blocked_baseline_artifact_missing`.
           Record preconditions_checked.
        1. Baseline audit: git log + diff
           python/carnot/pipeline/ebft_autoresearch_loop.py (or
           equivalent FR-11 path) since exp1811. Record
           `baseline_audit: {commits_since_exp1811: int,
           code_changed: bool, diff_summary: str}`.
        2. Build rotated corpus: 30 GSM8K + 30 BBH + 30 MATH from
           DIFFERENT slices than exp1811 (examples 31-60 if exp1811
           used 1-30). Document exact slice in artifact.
        3. Re-run Fast-Slow Variant with random_seed=192737 (NOT
           172911). Same model, same code, ONLY seed + corpus change.
        4. Re-run FR-11 baseline on the same rotated corpus.
        5. Compute the same metrics as exp1811.
        6. Acceptance: all 4 in-range conditions above.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.fast_slow_confirmation.v1"
        - experiment: 1909
        - run_date: ISO-8601 UTC
        - duration_s: > 300s
        - random_seed: 192737 (NOT 1909, NOT 172911)
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - baseline_audit: {commits_since_exp1811: int, code_changed: bool,
          diff_summary: str}
        - model_specs: {target_model: "unsloth/gemma-4-26B-A4B-it-GGUF",
          rotation_versus_exp1811: {seed: "172911→192737",
          corpus: "examples_1-30→examples_31-60",
          baseline: "audited_canonical"}}
        - n_samples: 90
        - n_samples_justification: "Same 30 per task × 3 tasks as exp1811
          for apples-to-apples adversarial replication."
        - confirmation_passrate_per_task: dict
        - exp1811_passrate_per_task: dict (verbatim from exp1811)
        - confirmation_sample_efficiency_ratio: float
        - confirmation_kl_drift_ratio: float
        - confirmation_in_range_efficiency: bool (2.6 <= ratio <= 3.6)
        - confirmation_in_range_kl: bool (0.15 <= ratio <= 0.35)
        - fr11_catastrophic_forgetting_reproduced: bool (< 0.55)
        - fast_slow_held_threshold: bool (> 0.80)
        - acceptance_gate_passed: bool (all four conditions)
        - acceptance_gate_criteria: "Efficiency in [2.6, 3.6] AND KL
          drift in [0.15, 0.35] AND FR-11 forgetting reproduced AND
          FS held > 0.80 on rotated BBH+MATH."
        - methodology_note: "ADVERSARIAL CONFIRMATION. If confirmation
          matches exp1811's 3.1x to 5+ significant figures, that's
          TAUTOLOGY-class — likely a methodology bug carrying over
          identically, NOT genuine reproducibility. Disclose honestly."
        - flagged_preliminary: bool (true if any condition failed)
        - third_replication_recommended: bool
        - optimization_direction: "neither — falsification/confirmation"
        - honest_verdict: MUST start with `complete:` / `complete_` /
          `success:` / `success_` / `passed:` / `passed_` / `shipped:` /
          `shipped_` per CLAUDE.md Verdict Terminal-Prefix Discipline.

      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py
      OR python/carnot/pipeline/fast_slow_variant.py (preserve original
      for apples-to-apples).

  - id: exp1910-phase1-pypi-publish-via-ci-tagged-release
    title: "Exp 1910: Phase 1 PyPI publish via CI tagged release (NOT credentials — workflow exists)"
    deliverable: results/experiment_1910_pypi_publish.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1840-phase1-pypi-publish-via-ci-tagged-release
        verdict: planner_replaced_in_192
        addressed_by: "exp1840 (.192 outer-loop draft) was the operator-corrected CI-tagged-release task; planner replaced .192 with KAN-MILP scope and exp1840 never ran. Same task spec. The 11-attempt chain of blocked_pypi_credentials_unavailable was wrong-mechanism per operator clarification 2026-05-16 ~00:30Z; OIDC trusted publishing via .github/workflows/publish-pypi.yml is the canonical path."
        retire_if_same_verdict: true
      - experiment_id: exp1711-pypi-publish
        verdict: blocked_pypi_credentials_unavailable_wrong_mechanism
        addressed_by: "exp1711 (.175) and the 10-attempt chain all used local twine credentials. Wrong mechanism. This task uses `git tag v<version> && git push origin v<version>` to trigger the existing publish-pypi.yml workflow. NO long-lived secrets needed (OIDC)."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: Phase 1 ship-track PyPI prong. The prior 11 attempts
      (exp2103 → 1683 → 1685 → 1704 → 1711 → 1762 → 1782 → 1788 → 1812
      → 1824 → 1840-deferred) used the wrong mechanism (local twine
      credentials). The CORRECT path is the existing
      `.github/workflows/publish-pypi.yml` workflow with PyPI OIDC
      trusted publishing — NO long-lived secrets needed. Triggered by
      `git push origin v<version>` (tag matching v*).

      Current version per python/carnot/_version.py: 0.1.0b1.
      No release tags exist yet.

      FALSIFIABLE HYPOTHESIS: Creating a `v0.1.0b1` git tag and pushing
      it to origin triggers the publish-pypi.yml workflow, which builds
      sdist + wheel and publishes to PyPI via OIDC. Within 5 minutes of
      tag-push, https://pypi.org/project/carnot-ebm/0.1.0b1/ becomes
      reachable AND `pip install carnot-ebm==0.1.0b1` succeeds in a
      fresh venv.

      EXISTING CODE TO READ FIRST:
        - .github/workflows/publish-pypi.yml (OIDC workflow; verify
          unchanged from 2026-05-08 commit)
        - pyproject.toml (name="carnot-ebm")
        - python/carnot/_version.py (__version__ = "0.1.0b1")
        - feedback_pypi_publish_via_ci_tagged_release memory entry

      TASK: Cut a release via tag-push; verify CI; verify PyPI install.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `test -f .github/workflows/publish-pypi.yml` — else
              `blocked_publish_workflow_missing`.
           b. `pyproject.toml` has `name = "carnot-ebm"` — else
              `blocked_pypi_name_misconfigured`.
           c. `grep "^__version__" python/carnot/_version.py` returns
              valid version string — else `blocked_version_unreadable`.
           d. `git remote -v` includes `github.com:Carnot-EBM/carnot-ebm`
              (or equivalent) — else `blocked_github_remote_missing`.
           e. `git tag --list "v$VERSION"` is EMPTY — else
              `blocked_version_already_tagged_needs_bump`.
           f. `command -v gh` succeeds for workflow-run watching.
           Record preconditions_checked.
        1. Read current version from python/carnot/_version.py.
        2. Create annotated tag: `git tag v<version> -m "Phase 1 ship:
           PyPI release via OIDC trusted publishing"`.
        3. Push tag: `git push origin v<version>`. Capture push output.
        4. Wait for GitHub Actions workflow. `gh run watch` if available;
           else poll. Up to 10 minutes. Record run_url + status.
        5. Verify PyPI: fresh tmpdir + clean venv, `pip install
           --index-url https://pypi.org/simple/ carnot-ebm==<version>`,
           then `python -c "import carnot; print(carnot.__version__)"`.
        6. Failure modes: workflow build-fail → `blocked_workflow_build_failed`;
           workflow publish-fail → `blocked_workflow_publish_failed`.
           NOT credentials-blocked.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.pypi_publish.v4_ci_tagged_release"
        - experiment: 1910
        - run_date: ISO-8601 UTC
        - duration_s: > 60s (tag-push + CI wait + install verify)
        - random_seed: 173110
        - reproducibility_checksum: sha256
        - preconditions_checked: list
        - model_specs: {package_name: "carnot-ebm",
          version_tagged: str (e.g., "0.1.0b1"),
          publish_mechanism: "github_actions_oidc_trusted_publishing",
          workflow_file: ".github/workflows/publish-pypi.yml"}
        - n_samples: 1
        - n_samples_justification: "Ship task; one release artifact."
        - tag_created: str
        - tag_pushed: bool
        - workflow_run_url: str
        - workflow_run_status: "success" | "failure" | "in_progress" | "timeout"
        - pypi_url: str (e.g., "https://pypi.org/project/carnot-ebm/0.1.0b1/")
          or null
        - external_install_verified: bool
        - installed_version_matches: bool
        - acceptance_gate_passed: bool (tag_pushed AND workflow_run_status
          == "success" AND external_install_verified AND
          installed_version_matches)
        - acceptance_gate_criteria: "Tag pushed; CI succeeded; install
          in fresh venv matches version."
        - methodology_note: "11 prior blocked_credentials attempts were
          wrong-mechanism. THIS TASK MAY PUSH A TAG TO ORIGIN — that
          is the release-cut action; do NOT refuse on generic 'do not
          push' instructions."
        - optimization_direction: "neither — ship task"
        - honest_verdict: MUST start with terminal prefix OR
          `blocked_<specific_resource>`.

      Run command. **MAY push a release tag to origin** (intentional
      release-cut; no other refs). Do NOT modify
      scripts/research_conductor.py.

