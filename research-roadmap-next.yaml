milestone: "2026.05.207"
milestone_title: "NeSy-EBM Integration, Continuous Latent Reasoning, and Thermodynamic Benchmarks"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: "exp2070-archive-and-activate"
    title: "Phase 0: Archive .206 and activate .207"
    max_turns: 20
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: We are beginning milestone 2026.05.207. We must archive the previous milestone and update the tracking docs.
      
      EXISTING CODE TO READ FIRST:
      - ops/status.md
      - ops/changelog.md
      - openspec/change-proposals/research-roadmap-vNEXT.md
      
      TASK: Rename the vNEXT roadmap doc to match the current milestone and record the activation in ops/status.md and ops/changelog.md.
      
      CONCRETE STEPS:
      1. Move openspec/change-proposals/research-roadmap-vNEXT.md to openspec/change-proposals/research-roadmap-v2026.05.207.md
      2. Update ops/changelog.md to log the start of milestone 2026.05.207.
      3. Update ops/status.md to reflect the new active milestone and Phase 0 completion.
      4. Write the terminal deliverable artifact results/experiment_2070_activation.json with honest_verdict="activation_complete".
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2071-lagrangian-energy-landscape"
    title: "Phase 1: Kona-Style Lagrangian Energy Landscape"
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: Kona treats reasoning as a continuous global Lagrangian optimization problem to find state valleys satisfying all constraints.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/phase3/continuous_ebm.py
      
      TASK: Implement a global Lagrangian energy function that sums local symbolic constraint potentials for a latent space reasoning optimizer.
      
      CONCRETE STEPS:
      1. Create python/carnot/phase3/lagrangian_optimizer.py.
      2. Implement a JAX-based continuous space optimizer using a Lagrangian formulation that enforces hard bounds as high-energy penalties.
      3. Ensure test coverage in tests/python/phase3/test_lagrangian_optimizer.py.
      4. Save to results/experiment_2071_lagrangian_optimizer.json with lagrangian_ready=true.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2072-kona-sudoku-solver"
    title: "Phase 1: Kona-Parity Sudoku Latent Solver"
    gated_on:
      - upstream: "exp2071-lagrangian-energy-landscape"
        artifact_field: "lagrangian_ready"
        op: "=="
        value: true
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: To replicate Kona's 96.2% success rate, we need to bypass autoregressive guessing on hard Sudoku.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/phase3/lagrangian_optimizer.py
      
      TASK: Apply the Phase 1 Lagrangian optimizer to solve hard Sudoku constraints entirely in the continuous domain.
      
      CONCRETE STEPS:
      1. Create scripts/experiment_2072_kona_sudoku.py.
      2. Model the Sudoku rules as differentiable energy penalties.
      3. Optimize the continuous grid state until energy is minimized and map back to digits.
      4. Save results to results/experiment_2072_kona_sudoku.json including solved_sudoku=true.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2073-continuous-trajectory-decoding"
    title: "Phase 1: Continuous Trajectory Decoding via LLM"
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: After optimizing the latent thought trajectory via EBMs, we must route it back into SOTA language models for sequence decoding.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/inference/ebm_cot_adapter.py
      
      TASK: Implement an adapter that translates the optimized continuous thought trajectory back to token probabilities.
      
      CONCRETE STEPS:
      1. Create python/carnot/inference/trajectory_decoder.py.
      2. In MODEL_SPECS, include 'unsloth/Qwen3.6-35B-A3B-GGUF' and 'unsloth/gemma-4-31B-it-GGUF'.
      3. Implement a decoding loop that uses the continuous thought state as conditioning.
      4. Save results to results/experiment_2073_trajectory_decoder.json.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: "exp2074-nesy-symbolic-encoder"
    title: "Phase 2: NeSy Symbolic Encoder"
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: Neuro-Symbolic Energy-Based Models (NeSy-EBMs) encode symbolic logic directly into the neural architecture.
      
      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/kan_symbolizer.py
      
      TASK: Create a symbolic encoder module that maps deterministic constraints (like SMT rules) into differentiable energy penalty tensors.
      
      CONCRETE STEPS:
      1. Create python/carnot/embeddings/nesy_encoder.py.
      2. Implement a system to parse basic logic predicates and compile them to JAX tensors.
      3. Provide full unit test coverage.
      4. Save to results/experiment_2074_nesy_encoder.json with nesy_encoder_ready=true.
      
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

