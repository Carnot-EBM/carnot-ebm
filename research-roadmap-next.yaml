      2. Build deterministic group-aware folds before fitting. Keep matched row IDs together and hold out whole task/template groups.
      3. Implement the smallest per-model linear encoder/decoder and shared alignment objective under python/carnot/. Fit with no outcome labels.
      4. Compare raw zero-padding and random projections. Report reconstruction, paired retrieval, neighborhoods, and model-ID leakage per fold and model pair.
      5. Save adapter weights and fold manifests atomically with hashes. Prove no GGUF or source embedding mutation.
      6. Add unit, permutation, fold-leakage, serialization, and 100% module coverage tests. Run focused and applicable e2e checks.
