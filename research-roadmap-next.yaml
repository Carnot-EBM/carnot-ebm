      CONTEXT:
      arXiv:2604.01170 (ORCA): conformal stopping — stop TTT when the energy interval width
      collapses below alpha (principled early stopping). arXiv:2605.14175 (Grounded Continuation):
      dependency-graph stopping — stop when the evidence-claim graph has no unverified leaf nodes
      (structural complement to ORCA's energy-based criterion). Combining both gives dual stopping
      signals for VerifierDrivenTTT.

      FR-11 Tier 2 (NEXUS v2) was COMPLETED in .256 (exp2695: 100 real FoVer violations,
      5 synthesized rules, persistence_verified=true). FR-11 Tier 3 (ORCA conformal stopping)
      remains open.

