       c. Read both gate files. Emit blocked artifact if either fails.
       d. GPU gate: CARNOT_FORCE_LIVE=1 required. If missing: emit blocked artifact.
       e. setup_gpu([{"name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0}]).
       f. Load 200 GSM8K questions (indices 400-599, same pool as Exp 688 for comparability).
       g. inference_fn = lambda q: generate_with_qwen(q, structured_equation_forcer).
          verify_fn = lambda r: SymCodeVerifier.verify(r).is_correct.
       h. PSVParallelChains(n_chains=2, n_iterations=10, n_questions_per_iter=10,
                            constraint_memory=JitRLConstraintMemory()).
          Run parallel self-play.
       i. Compute fp_rate_per_iteration from merged results.
          Compute fp_rate_trend_slope (linear regression, same as Exp 688).
          Compute parallel_speedup: time(parallel) vs estimated time(sequential=K*parallel_chain_time).
       j. Compare to Exp 688 synthetic baseline:
          exp688_fp_rate = load from Exp 688 result if available.
          real_vs_synthetic_delta = final_fp_rate - exp688_final_fp_rate.
       k. honest_verdict:
          - "psv_real_fp_improving" if fp_rate_trend_slope < 0 AND inference_mode=="live_gpu"
          - "psv_real_fp_stable" if fp_rate_trend_slope == 0 AND inference_mode=="live_gpu"
          - "psv_real_fp_degrading" if fp_rate_trend_slope > 0
          - "psv_real_blocked_gate_vr" if VR gate failed
          - "psv_real_blocked_gate_fr11" if FR-11 gate failed
          - "psv_real_blocked_no_gpu" if no live GPU
       l. artifact: n_chains=2, n_iterations=10, fp_rate_per_iteration,
          fp_rate_trend_slope, parallel_speedup_factor, real_vs_synthetic_delta,
          inference_mode, honest_verdict.
    5. Write tests/python/test_psv_parallel_chains.py with 100% module coverage.
    6. Reconcile:
       - ops/status.md: update "FR-11 self-learning: PSV real self-play result (Exp 697)".
