      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3179-local-sota-receipt-smoke-v3
    milestone: "2026.05.295"
    deliverable: "results/experiment_3179_local_sota_receipt_smoke_v3.json"
    title: "Local SOTA GGUF receipt smoke v3"
    priority: critical
    max_turns: 100
    model: opus
    estimated_wall_time_min: 75
    track: "verification"
    inference_substrate: "live_llm_inference_or_blocked_preflight"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3165-live-sota-authenticity-replay-v2
        verdict: "blocked_gpu_substrate: preflight_passed=false; live_call_count=0; local_usable_model_ids=[unsloth/gemma-4-26B-A4B-it-GGUF]"
        addressed_by: "Runs the v3 receipt smoke with explicit cache/CUDA/CPU classification and may use CPU fallback only as receipt wiring, not headline evidence."
        retire_if_same_verdict: true
      - experiment_id: exp3151-live-inference-authenticity-preflight
        verdict: "blocked_duration_too_short: preflight_passed=false; live_call_count=1; selected_model_id=unsloth/gemma-4-26B-A4B-it-GGUF"
        addressed_by: "Uses token/work receipts and repeated calls instead of the retired fixed-duration floor."
        retire_if_same_verdict: true
      - experiment_id: exp3139-live-sota-verifier-rerun-v7
        verdict: "flagged_adversarial: preflight said no model loaded while artifact claimed six live calls"
        addressed_by: "Makes model-load and transcript receipts load-bearing before any downstream clean verifier rerun can unlock repair."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. This is the first .295 task that may touch a mandated local SOTA GGUF. It must produce a real receipt if possible and a classified blocked artifact otherwise.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Legacy small models may be used only as loud CPU smoke fallbacks and must never populate headline model fields.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - carnot/inference/sota_models.py
      - results/experiment_3178_receipt_backed_authenticity_contract_v3.json
      - results/experiment_3165_live_sota_authenticity_replay_v2.json
      - results/experiment_3167_clean_live_sota_verifier_rerun_v9.json

      TASK
      Attempt a minimal local SOTA GGUF receipt smoke under the v3 contract. If preconditions fail, write a complete blocked artifact that classifies the exact failure without claiming live verifier evidence.

      CONCRETE STEPS
      1. PRECONDITIONS: Check cached_sota_pair() and the HF cache for all three mandated GGUFs. Check llama_cpp/import loader availability. Check torch CUDA availability if torch is present. Do not assume GPU availability. Do not edit scripts/research_conductor.py.
      2. Load the v3 contract and choose the strongest available mandated model. Prefer a CUDA path if healthy; otherwise allow a CPU fallback only for receipt wiring and label it clearly as non-headline.
      3. If no mandated model can be located or loaded, write the artifact with preflight_passed=false, live_call_count=0, substrate_classification, and honest blocked verdict.
      4. If a mandated model can run, execute at least two tiny deterministic prompts with fixed seed/temperature where supported. Capture prompt hashes, transcript hashes, token counts, wall-clock evidence, command/worker hash, return codes, and stderr tail.
      5. Validate throughput plausibility under v3. Reject stale or reused transcript hashes. Keep exact rows untouched here; this task is only receipt proof.
      6. Write the artifact and state whether exp3181 is allowed to attempt a clean verifier rerun.

      REQUIRED ARTIFACT FIELDS:
      - local_sota_receipt_smoke_v3_ready: bool (principle: downstream gates need a materialized artifact)
      - preflight_passed: bool (principle: live reruns require explicit preflight status)
      - live_call_count: int (principle: no-call blocked artifacts must not look like live evidence)
      - mandated_model_inventory: list (principle: model availability must be auditable)
      - selected_model_ids: list (principle: local SOTA policy must be machine-readable)
      - substrate_classification: str (principle: blockers must distinguish cache, loader, CUDA, and CPU causes)
      - cpu_fallback_used: bool (principle: CPU smoke must not be mistaken for headline performance)
      - proof_receipts: list (principle: authenticity must trace to prompt and transcript hashes)
      - throughput_plausibility_passed: bool (principle: impossible speed claims must be rejected)
      - headline_claim_allowed: bool (principle: smoke tests should not become headline evidence)
      - clean_rerun_allowed: bool (principle: verifier tasks need explicit unlock signal)
      - inference_substrate: dict (principle: live or blocked preflight substrate must be declared)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

