- id: exp5168-archive-473-activate-474
  milestone: 2026.07.474
  title: PHASE 0 transition -- archive .473 truth (one real win, two hardened nulls, one blocked gate), activate .474
  priority: critical
  track: planning
  deliverable: results/experiment_5168_archive_473_activate_474.json
  operator_override: '2026-05-29 operator directive (standing): routine milestone-transition task -- false-positive
    scope-match vs prior archive-vN-activate-vN+1 tasks; this is the structurally-required .473->.474
    handoff, never a doomed rerun.'
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 25
  prompt: |
    CONTEXT:
    Standard milestone transition. .473 executed 12 tasks under the operator's fresh 2026-07-02 "multi-level
    capable live agent" directive. Precision matters here because .473 mixed a real, hardened win with two
    honest nulls and one blocked task -- get the characterization right so .474's tasks build on accurate
    ground truth, not a rounded-up or rounded-down summary.

    .473's actual outcomes (verify each against its own artifact before writing the archive summary --
    do not trust this paraphrase alone):
      - exp5157 (ReDRAW-style warm-start replay ablation): GATE FAILED, honest null,
        warmstart_vs_cold_delta_median=0.0 across 32 transitions / 21 games.
      - exp5158 (DynaMITE-RL-style goal-energy ranker replay): GATE FAILED, improved only 1 of 3 target
        games (lp85/sc25/tr87).
      - exp5159 (live level-up attempt): blocked_gate_check_failed -- never ran, because its upstream gate
        (exp5157.gate_passed==true) was false. Zero new levels banked; reproducible_total_levels stayed
        flat at 69 (24 games) for the 3rd+ consecutive milestone.
      - exp5160 (oracle-distinct cross-corpus closure): PASSED. Confirmed the "game_id" field in the
        exp4243 candidate pool is a misnomer (the pool is disjoint static ARC-1/ARC-2 puzzles with no
        game-grouping concept, not ARC-AGI-3 interactive games) and re-scoped the axis to cross-corpus
        replication. 5-seed replication on a disjoint pool: cross_corpus_delta=+0.5, CI95=[0.5,0.5],
        leak-audit passed. diffusiongemma_gate_updated_recommendation: ungate_now. CAVEAT: held_out_task_n=24
        is below CLAUDE.md's CLT floor (N>=30 for any percentage-point delta claim) -- real win, not yet at
        the project's own rigor bar.
      - exp5161 (GAP-4 forward-protocol pilot, n=60 bounded scale): direction replicated (4 discordant
        wins, 0 losses) but exact_test_passes_min6_rule=false (p=0.125, two-sided) -- not yet statistically
        significant. gap4_status_recommendation: scale_up_recommended. NOTE: this artifact was briefly
        mis-flagged flagged_adversarial=true (a substrate-declaration parsing bug in adversarial_verify.py
        that broke on {{principle,value}}-wrapped fields) and has since been un-quarantined same-day via
        commits ca5a24945/487ee1533 (_normalize_principle_wrapped_fields()) -- confirm flagged_adversarial
        is now false on the live artifact before citing it as clean.
      - exp5163 (off-ARC MMLU-Pro verifier-vs-cheap-baseline, 5-shot pool): still underpowered,
        delta=+0.025, CI95=[-0.125,0.175] includes 0. ALSO carries a live CRITICAL TAUTOLOGY flag
        (fewshot_oracle_at_k == oracle_at_k_ceiling to >5 significant figures, found by a corpus-wide
        backfill scan) -- do NOT cite its numbers as a clean headline in the archive summary.
      - exp5164 (retro-timing false-zero fix): built, tested (6 tests), validated against milestone .450's
        known-good ground truth (214.6 wall-minutes, 4 compute-bound arms) plus 3 more milestones.
        research_conductor.py correctly left untouched -- wiring is a future outer-loop/operator action.
      - exp5165 (generation-axis retirement hygiene): retired the first-contact exploration-signal scope
        (exp4688/exp4689/exp5154, 3rd consecutive null) into ops/exclusion_manifest.yaml with a working
        synthetic self-test proving the lint is load-bearing.
      - exp5166 (hardware continuity): KV260 reachable (SSH+hash-verified workload), PolarFire reachable
        (SSH+hash-verified workload), GateMate blocked_gatemate_dirtyjtag_idcode (DirtyJTAG detects the
        programmer but cannot read the GM1Ax IDCODE 0x20000001). boards_reachable_count=2/3.
      - exp5167 (capstone): "v473 reconciled with DiffusionGemma ungated for future scaling, GAP-4 scale-up
        not filled, zero new ARC levels banked, and exp5161 excluded as flagged_adversarial" -- the last
        clause is now stale (exp5161 was un-quarantined same-day AFTER the capstone ran); note this
        explicitly in the archive summary so .474 doesn't inherit a stale exclusion.

    EXISTING CODE TO READ FIRST:
    - results/experiment_5156_archive_472_activate_473.json through
      results/experiment_5167_capstone_v473.json (all 12 .473 artifacts -- verify the paraphrase above
      against the live files, do not just copy it forward)
    - research-roadmap.yaml (the .473 task definitions, for the archive's task-list snapshot)
    - openspec/change-proposals/research-roadmap-vNEXT.md (the already-drafted .474 plan this milestone
      executes)

    CONCRETE STEPS:
    1. Follow the standard archive-vN-activate-vN+1 pattern: snapshot .473's final state into the milestone
       archive, using the corrected characterization above (verified against live artifacts, not copied
       blind).
    2. Verify .473's runtime is clean (no orphaned processes, no dirty git state) before activation.
    3. Do NOT touch the currently-running conductor process or its active task.
    4. Emit v473_runtime_clean: true/false as the gate field downstream .474 tasks may reference.
    5. Explicitly record exp5161's un-quarantine (flagged_adversarial now false, corrected same-day after
       the .473 capstone ran) so .474 tasks reading the capstone summary don't inherit the stale exclusion.
    6. Confirm ops/arc_solve_registry.yaml's reproducible_total_levels/reproducible_total_games (69/24) and
       ops/verifier_gaps.md's GAP-4 status line match what exp5167's capstone recorded -- flag any drift.

    REQUIRED ARTIFACT FIELDS:
      v473_runtime_clean:
        value: bool
        principle: "Downstream .474 tasks may gate on this; a dirty handoff should block, not silently proceed."
      exp5161_unquarantine_noted:
