      it reported `easy_tier_solve_rate=0.0` and bailed at the Step-0b easy-tier sanity check
      because its optimizer was vanilla/gradient descent, which cannot escape local minima — it
      NEVER reached its own SA/parallel-tempering/restart ladder. With the encoding now PROVEN
      correct, the failure is unambiguously the OPTIMIZER, not the representation. Kona 1.0
      solves hard Sudoku at 96.2% (~313ms) via test-time optimization, so a proper combinatorial
      optimizer on this validated encoding SHOULD solve easy boards and climb to hard. The
      literature gives the tools: arXiv:2506.04596 benchmarks SA / parallel tempering / D-Wave
      Neal / simulated bifurcation / Gurobi on QUBO under a uniform runtime budget;
      arXiv:2510.19835 is a quantum-inspired (classical) Sudoku-QUBO solver; Wang et al. 2026
      (SPE spe.70063) is a resource-efficient Ising Sudoku solver; arXiv:2406.11179 (IRED) runs
      an ADAPTIVE step count scaled to hardness.

      EXISTING CODE TO READ FIRST:
        - scripts/experiment_3494_p01_sudoku_correctness_first_solve_rate_gate_v1.py (REUSE its VALIDATED encoding + Step-0a QUBO cross-validation; REPLACE its optimizer with the real ladder)
