    scorer construction class (LoRA-EBM/uPRM/EBRM -- verifiers that score candidates from their GENERATED
    TEXT or LOGPROBS) after seven milestones of null/marginal results. This task tests a GENUINELY
    DIFFERENT mechanism class: a small, cheap verifier that reads the GENERATOR's OWN HIDDEN STATES
    directly, per TrajSelector (arXiv:2510.16449, Yu et al.) -- a 0.6B-parameter verifier trained
    end-to-end on internal representations, reporting +4.61% over majority voting and +4.31-12.21% over
    existing text-based PRMs at lower inference cost than a generative judge, on Best-of-32.

