          result = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout_s)
          If returncode == 0: verify file exists, return {"success": True, "path": path, "size_mb": size}
          Else: return {"success": False, "error": result.stderr[:500]}
       b. Add resolve_with_cli_fallback(hf_repo, filename, dest_dir) -> Path:
          Try resolve() first (cache lookup). If not found, try cli_download().
          If still not found, raise FileNotFoundError with diagnostic.
