      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2231-kancl-per-knot-regularization
    title: "Phase 2: KAN-CL Per-Knot Importance Regularization"
    milestone: "2026.05.221"
    deliverable: "results/experiment_2231_kancl.json"
    agent_type: "codex"
    model: "gpt-5.5"
    prompt: |
      CONTEXT: FR-11 continuous self-learning requires avoiding catastrophic forgetting. KAN-CL (arxiv:2605.12306) uses per-knot importance regularization without massive semantic buffers.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/models/substrate_kan.py
      TASK: Implement per-knot importance tracking and regularization for the KAN tiers.
      CONCRETE STEPS:
      1. Add importance weight accumulators (similar to EWC) to the KAN splines.
      2. Apply the per-knot penalty during continuous constraint updates.
      3. Write deliverable to `results/experiment_2231_kancl.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

