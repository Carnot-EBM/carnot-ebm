      CONCRETE STEPS
      0. Before any hardware command, verify the receipt date and target, hash protected files, confirm the exact binary path, record USB state, disk, permissions, timeout, and the one-command budget in preconditions_checked. If the receipt or target is ambiguous, write a blocked artifact and run zero hardware commands.
      1. Add REQ-HW-6325 and fail-closed scenarios before implementation. Update traceability.
      2. Reuse the Exp6121 state-gate parser. Prove that the new receipt is newer than both failed attempts.
      3. Record the openFPGALoader version without addressing a board.
      4. Run exactly one openFPGALoader -c dirtyJtag --detect with a bounded timeout. Do not retry on timeout, failure, or an empty chain.
      5. Record post-command read-only USB state. Assert every forbidden command count is zero.
      6. Add tests with mocked success, empty-chain, timeout, stale-receipt, wrong-target, and second-command refusal paths.
      7. Run focused non-hardware tests and adversarial verification. Preserve the raw detection outcome.

      Run command: .venv/bin/python -m carnot.experiment_6325_gatemate_dated_receipt_single_detect --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6326-restricted-policy-contract-compiler
    milestone: "2026.08.545"
    deliverable: results/experiment_6326_restricted_policy_contract_compiler.json
    title: "Restricted policy DSL and exact behavioral contract compiler"
    priority: critical
    track: energy_reasoning
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 150
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6324-v545-post-marker-source-scope-freeze
    prior_failures:
      - experiment_id: exp5923-sota-schema-supported-constraintir-ab
        verdict: "retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates"
        addressed_by: "This task builds a bounded executable policy DSL with a separate canonical contract, exhaustive exact semantics, and a hash-pinned fallback. It does not reprompt natural-language ConstraintIR."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The V544 model-local state lane is closed. V545 moves correctness energy to an observable bounded policy program. SEVerA motivates exact output contracts and verified fallback. Carnot needs a small local substrate before any LLM generation. The exact checker is an oracle. It can establish safety but cannot count as a learned-verifier result.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-references.md V545 SEVerA and MARCH entries
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/openspec/capabilities/verifiable-reasoning/spec.md
      - {project_root}/openspec/capabilities/constraint-verification/spec.md
      - {project_root}/python/carnot/experiment_6274_asp_energy_semantic_compiler.py
      - {project_root}/python/carnot/experiment_6287_asp_continuous_relaxation.py
      - {project_root}/results/experiment_6313_exact_code_safety_pair_fixture.json
      - {project_root}/ops/exclusion_manifest.yaml and {project_root}/ops/e2e-test-plan.md

      TASK
      Design and implement a bounded typed DSL for finite state-action policies. Use canonical parsing and normalized semantics. Define independent first-order or finite-domain behavioral contracts. Compile each contract into exact local factors. Define energy as the weighted count of unsatisfied factors. Check the complete finite domain by enumeration or Z3. Ship a hash-pinned verified fallback for every fixture family. Include held contract families and adversarial fixtures. Do not use natural-language ConstraintIR, a generated-text scorer, hidden model state, a KAN, or model-generated labels.

      Required deliverable: {project_root}/results/experiment_6326_restricted_policy_contract_compiler.json.
      REQUIRED ARTIFACT FIELDS: status, source_claim_boundary, dsl_grammar_path_and_hash, type_system_and_bounds, parser_and_normalizer_path_and_hash, canonical_semantics_path_and_hash, contract_schema_path_and_hash, factor_compiler_path_and_hash, exact_energy_definition, finite_domain_or_z3_checker_path_and_hash, fixture_manifest_path_and_hash, contract_family_splits, fallback_programs_paths_and_hashes, exhaustive_contract_results_by_family, factor_energy_exactness_results, parser_rejection_and_totality_results, vacuous_contract_parser_default_validator_mutation_test_deletion_fallback_laundering_and_hash_swap_results, exact_oracle_claim_boundary, generated_label_count, hidden_state_access_count, external_text_scorer_count, contract_guard_ready_score, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, random_seeds, reproducibility_checksum, honest_verdict. generated_label_count, hidden_state_access_count, and external_text_scorer_count must be bare 0. verifier_is_oracle must be true. Readiness is 1.0 only if normalization is deterministic, factor energy equals exact violations, all fallbacks satisfy their contracts, and all attacks fail closed. field_principles must cover every required field.

      CONCRETE STEPS
      0. Freeze the grammar, finite bounds, contract families, split rules, fallback hashes, exact checker, seeds, resource limits, and protected hashes in preconditions_checked.
      1. Add REQ-KONA-6326 and scenarios before implementation. Update traceability.
      2. Implement the smallest typed DSL that can express bounded deterministic policies. Reject unknown syntax and out-of-bound values.
      3. Normalize programs and compile contracts into named local factors. Prove exact energy equality by exhaustive checks.
      4. Build development and held-family fixtures without LLM labels. Build and hash one verified fallback per family.
      5. Attack vacuity, defaults, mutations, deleted tests, fallback laundering, collisions, and nondeterministic normalization.
      6. Add property tests for parser totality, semantic equivalence, factor locality, checker parity, and fallback identity.
      7. Run focused tests, spec coverage, applicable e2e checks, and adversarial verification.

      Run command: .venv/bin/python -m carnot.experiment_6326_restricted_policy_contract_compiler --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6327-three-family-guarded-policy-synthesis
    milestone: "2026.08.545"
    deliverable: results/experiment_6327_three_family_guarded_policy_synthesis.json
    title: "Three-family guarded policy synthesis gated on Exp6326 readiness=1"
    priority: critical
    track: energy_reasoning
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 300
    agent_type: codex
    model: gpt-5.5
    requires:
      - exp6326-restricted-policy-contract-compiler
    gated_on:
      - upstream: exp6326-restricted-policy-contract-compiler
        artifact_field: contract_guard_ready_score
        op: '=='
        value: 1.0
