  - id: exp6365-gguf-child-failure-forensics-runtime-contract
    milestone: "2026.08.548"
    deliverable: results/experiment_6365_gguf_child_failure_forensics_and_runtime_contract.json
    title: "Three-model GGUF child failure forensics and observable runtime contract"
    priority: critical
    track: infrastructure
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 90
    agent_type: claude
    model: opus
    prior_failures:
      - experiment_id: exp6352-live-factor-proposal-authenticity-preflight
        verdict: "complete_null: live generation ran but authenticity readiness gates did not all pass"
        addressed_by: "This attempt changes the deliverable from proposal-quality preflight to child-process forensics, retains stderr and source snapshots, proves context capacity, adds task-linked GPU and dispatcher receipts, and requires minimal nonempty output from each model before readiness."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6352 passed model, tokenizer, CUDA, VRAM, and disk preconditions. Its Qwen child ran 34.75 seconds and both Gemma children ran about nine seconds, but all returned code 1 before any token. Raw files were empty. The artifact retained no stderr, so the cause is unknown. Its process receipts record n_ctx=512 while the committed source declares 2048. The V547 operational retro also lacks task-linked GPU samples, model-count receipts, phase timing, and dispatcher choice. This is a changed diagnostic scope. It must make no factor-quality claim.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/python/carnot/experiment_6352_live_factor_proposal_authenticity_preflight.py
      - {project_root}/tests/python/test_experiment_6352_live_factor_proposal_authenticity_preflight.py
      - {project_root}/results/experiment_6352_live_factor_proposal_authenticity_preflight.json
      - {project_root}/results/operational_retro_2026_08_547.json
      - {project_root}/openspec/capabilities/research-harnesses/spec.md and {project_root}/openspec/capabilities/continuous-learning/spec.md
      - {project_root}/ops/e2e-test-plan.md and {project_root}/ops/known-issues.md

      TASK
      Diagnose the V547 child failures and implement a reusable observable llama.cpp child-process contract. Use cached_sota_pair() and exactly these MODEL_SPECS in the measured matrix: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Use the embedded GGUF tokenizer only. Never call AutoTokenizer. Preserve a bounded stderr excerpt in the artifact and full stdout/stderr sidecars by hash. Bind every child call to the exact source revision, command, prompt, tokenizer count, context capacity, dispatcher, GPU samples, and phase timings. End with one minimal nonempty autoregressive completion from each model. Make no proposal, accuracy, or utility claim.

      CONCRETE STEPS
      0. Run preconditions before model work: verify both RTX 3090 GPUs, required GGUF paths, embedded tokenizers, llama.cpp GPU-offload support with llama_supports_gpu_offload(), disk and RAM, no protected training process, and enough free VRAM for sequential loading. Load one model and prove VRAM rises before accepting CUDA readiness.
      1. Reconstruct Exp6352's recorded command, sampling arguments, prompt hash, source hash, and environment from the artifact and git. Do not rerun the full failed matrix until diagnostics are retained.
      2. Add an observable child runner that records argv without secrets, PID, dispatcher, environment allowlist hash, source hash, stdout and stderr paths and hashes, return code, signal, timeout, phase timestamps, prompt token count, requested output tokens, n_ctx, and capacity margin.
      3. Use the embedded GGUF tokenizer in vocab-only mode to count each exact prompt. Fail before model load when prompt_tokens + max_tokens exceeds n_ctx. Record any source-versus-artifact sampling drift.
      4. Add task-linked GPU samples before load, after load, during generation, after unload, and after cleanup. Record GPU index, memory, utilization, process identity, and sampling timestamps. Prove memory release.
      5. Run deterministic failure injections for nonzero exit, timeout, empty stdout, malformed usage receipt, context overflow, source drift, and missing GPU sample. Each must fail closed and preserve diagnostics.
      6. Run a minimal bounded completion on each mandatory model sequentially. Require return code zero, nonempty raw bytes before parsing, positive prompt and completion token counts, authenticated offload, and no timeout. Do not score semantic quality.
      7. Add REQ-* and SCENARIO-* entries before implementation. Write focused tests for all injected failures and success normalization. Run focused tests, 100% focused coverage for new code, relevant inference tests, spec coverage, applicable E2E checks, adversarial_verify, determination-preservation lint, and root-clutter sweep.
      8. Write the artifact atomically. Set gguf_runtime_observability_ready_score=1.0 only when all three model rows meet every contract. Otherwise emit a blocked_ or complete_null terminal verdict and list exact blockers.

      Required deliverable: {project_root}/results/experiment_6365_gguf_child_failure_forensics_and_runtime_contract.json.
      REQUIRED ARTIFACT FIELDS:
      - status
      - upstream_exp6352_path_hash_and_terminal_class
      - reconstructed_exp6352_command_and_source_receipt
      - exp6352_source_artifact_sampling_drift
      - MODEL_SPECS
      - models_used
      - cached_sota_pair_receipts
      - model_file_hashes_revisions_quantizations_and_tokenizers
      - embedded_gguf_tokenizer_receipts
      - autotokenizer_usage_count
      - llama_cpp_gpu_offload_support_receipt
      - task_linked_gpu_samples_by_model_and_phase
      - dispatcher_and_process_identity_receipts
      - source_command_prompt_and_environment_hashes_by_call
      - prompt_token_context_capacity_receipts_by_model
      - stdout_stderr_sidecar_paths_hashes_and_bounded_excerpts
      - child_exit_signal_timeout_and_usage_receipts_by_model
      - load_prompt_generate_unload_cleanup_timings_by_model
      - raw_output_paths_hashes_and_byte_counts
      - live_autoregressive_generation_invoked_by_model
      - failure_injection_matrix
      - vram_rise_and_release_receipts_by_model
      - gguf_runtime_observability_ready_score
      - no_proposal_quality_or_utility_claim
      - protected_files_unchanged
      - preconditions_checked
