    Work in {project_root} on {date} for milestone 2026.09.659. This is the first registered V659 held-out efficacy test, on injected tool-output errors. Every source-intervention and energy advantage must survive equal-information controls and source-group uncertainty.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/experiment_7358_v646_validation_contract.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/python/carnot/experiment_7507_v657_static_evaluation.py
    - {project_root}/python/carnot/experiment_7508_v657_static_audit.py
    - {project_root}/results/experiment_7533_v659_tool_protocol.json
    - {project_root}/results/experiment_7537_v659_eval_capture.json
    - {project_root}/results/experiment_7538_v659_energy_fit.json
    - {project_root}/openspec/capabilities/verification/spec.md

    TASK:
    Produce results/experiment_7539_v659_static_evaluation.json. Create scripts/experiments/experiment_7539_v659_static_evaluation.py as a thin entrypoint, reusable behavior in python/carnot/experiment_7539_v659_static_evaluation.py, and tests in tests/python/test_experiment_7539_v659_static_evaluation.py. These output paths are to create, not existing prerequisites.

    CONCRETE STEPS:
    1. PRECONDITIONS: print a flushed progress line immediately. Check named input paths, relevant REQ-* specifications and required resources before measurement. Read same-milestone outputs only after their producers run. Missing external prerequisites yield complete_blocked_<reason>, verdict_class=blocked, and gate_check_summary naming upstream, field/path, expected and observed values; no fabricated fallback.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER EVERY model load, generation, benchmark or subprocess that can take minutes. Print completed units and monotonic elapsed INSIDE long loops at least every 60 seconds. Stream child stdout unbuffered and emit truthful pending-operation heartbeats every 60 seconds. Keep EVERY gap below 600 seconds: silence can kill work at 1200 seconds; continuing progress permits the 4800-second hard cap. Checkpoint and stop only owned processes.
    3. Keep every tool call bounded. Write ANY file over about 200 lines in several tool calls of about 100-150 lines, with a progress message between calls. Split source, tests, reads and validation into separate bounded calls. Never compose a whole large module and test suite in one call; a child heartbeat cannot expose progress while the agent composes that call.
    4. Before implementation extend the relevant OpenSpec REQ-* and SCENARIO-* items and write meaningful failing tests. Reuse established readers, numerical helpers and runners; keep the new entrypoint thin. Preserve existing tests, assertions and historical artifacts. Put scratch files in /tmp, reusable code under python/carnot, and tests under tests/python.
    5. Declare inference_substrate_class=no_model_load, inference_substrate=verifier_ensemble_against_cached_candidates, MODEL_SPECS=[], model_specs=[], model_invoked=false. Historical Qwen forward receipts are inputs, not current LLM calls.
    6. Authenticate the three producer artifacts and frozen checkpoints. Produce and hash every test prediction, source-view feature, action and comparator output before the evaluator opens any of the 80 test labels. Preserve an independent label-access receipt. No refitting, source replacement, threshold selection or corruption relabeling is permitted.
    7. Emit per-component/arm probabilities, binary labels, Brier, log loss, typed action and realized cost: accept costs 5*y, reject costs 1-y, escalate costs 0.2. Also record accepted count, false accepts, coverage, selective risk, AUROC when defined, and tool-type slices. Keep original-source labels as the target; absent/mismatched readouts are features and diagnostics, never labeled automatically incorrect. No span-localization or organic-hallucination claim.
    8. The registered primary benefit requires at least 64 complete independent groups, at least 12 of each label, zero role leakage, and absolute Brier improvement >=0.01 versus EACH of the preselected strongest comparator, original-only energy and unconstrained equal-capacity energy. Use paired source-component bootstrap with 2000 replicates, seed 659039 and Holm-corrected one-sided comparisons at family alpha=0.05; each adjusted upper difference bound must be below zero. Log-loss deterioration and primary decision-cost deterioration upper95 bounds must each be <=0.01 versus the selected comparator. Failure of support or benefit is a completed valid null, not partial.
    9. Report decision-cost improvements and the nine secondary cost cells as secondary diagnostics with paired intervals, coverage and denominators. Show raw original versus absent/mismatched score sensitivity, label-shuffle and constant-feature controls to expose shortcuts; favorable sensitivity alone cannot open the primary benefit gate. Do not call an accept/reject policy a successful repair or low learned energy a deterministic proof.
    10. Compute comparison rows using absolute per-arm costs, not signed deltas as headroom fields. Preserve honest no_headroom explanations where an arm or stratum cannot improve. static_measurement_complete_score depends on complete authenticated reduction, including a valid null; static_benefit_score depends only on the registered primary conjunction.
    11. Freeze the affected-file validation manifest and verify imports resolve to this worktree. Run scoped pytest -n 0 -o addopts= --no-cov with a private --basetemp, then separately require 100 percent changed-module coverage with command-local COVERAGE_FILE. Run scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Use Exp7358/Exp7303 helpers; record unrelated repository debt separately. Never gate a model load on the unscoped repository suite.
    12. Run the declared entrypoint and fresh-process cold replay as capability E2E. For numerical learning run the real predict-release-update-persist-reload path; shared training/sampler changes also require E2E-001/002. Binding/serialization changes require E2E-003/004. ARC policy/transport work requires E2E-009/010, telemetry E2E-011/012/013 as applicable, plus the private LLM-off real-environment smoke from ops/e2e-test-plan.md. Reporting-only work has no applicable numbered runtime E2E. Record actual commands and outputs, not planned passes.
    13. Independently reduce comparative rows and run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Retain absolute arm metrics and honest no_headroom/positive_claim=false annotations when supported; never weaken a guard. Required validation failure is disqualified; completed valid lack of benefit is null; unchanged external absence is blocked. partial is only retryable unfinished OWN work. Publish atomically only after required checks, with checkpoints outside the terminal path.
    14. Reconcile affected OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md to actual evidence. Keep artifacts below 20 MiB using hash-bound sidecars. Preserve generator weights and production defaults. Do not activate a roadmap, change research-roadmap.yaml, submit a scored kernel, publish externally or contact anyone.

    ACCEPTANCE GATES:
    - Validity: required scoped checks and independent cold replay pass. principle: invalid evidence cannot support science.
    - Readiness: named ready/complete fields are bare numeric 0/1, independent of benefit. principle: valid nulls remain auditable.
    - Benefit: use only the registered task-specific effect, support and uncertainty checks above. principle: insufficient support never becomes positive.

    REQUIRED ARTIFACT FIELDS:
    - schema: principle: "Bind experiment_id, milestone, version and run_date={date} to the terminal contract."
    - preconditions_checked: principle: "Record exact resource observations and input hashes before claiming readiness."
    - MODEL_SPECS: principle: "Also emit model_specs; fresh LLM work names unsloth/Qwen3.8-27B-GGUF with resolved path/hash/quantization/runtime; no-load work uses []."
    - model_invoked: principle: "Record current invocation_counts for loads, forwards, generations, failures and cancellations; historical calls are separate."
    - inference_substrate_class: principle: "Declare actual work: model_full_generation floor 60s, model_bounded_generation 10s, model_load_no_generation 2s; never pad duration."
    - inference_substrate: principle: "Aggregation is exactly aggregation_from_upstream_artifacts; native option forwards use live_llm_embedding_extraction with readout_kind=option_logits and zero generated tokens."
    - execution_venue: principle: "CPU, real CUDA, historical board CPU and FPGA fabric are distinct evidence classes."
    - duration_s: principle: "Measure current monotonic work with phase_spans and process identity; separate authoring, validation and historical durations."
    - random_seed: principle: "Freeze sampling, fitting, arrival and bootstrap seeds before outcomes."
    - reproducibility_checksum: principle: "Bind code, settings, roles, source_artifact_hashes, model identity when used and raw rows."
    - rows: principle: "Every compared source/event/game/arm has its metric and disposition; missing is not zero and aggregates must reduce from rows."
    - sample_size_budget: principle: "Report planned, attempted, complete, excluded, failed, censored and unstarted independent units, not just row count."
    - acceptance_gate_results: principle: "Each validity/support/benefit gate stores condition, expected, observed, op, passed and principle; readiness is not benefit."
    - gate_check_summary: principle: "Every blocked result identifies the failed check, exact upstream and path/field, expected and observed value including absent/null."
    - honest_verdict: principle: "Use complete_ terminal prefixes, including complete_blocked_; preserve literal historical verdicts."
    - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. External absence is blocked, never partial."
    - verifier_is_oracle: principle: "Oracle-defined fixtures cannot exceed circular_positive; injected corpus labels do not establish natural factuality or formal correctness."
    - flagged_adversarial: principle: "Keep actual flags and appended corrections; never clear a determination to open a gate."
    - validation_receipts: principle: "Record exact required commands, exit codes, output hashes, cold replay and independent reductions."
    - field_principles: principle: "Every emitted field and acceptance gate states the failure it prevents."
    - static_measurement_complete_score: principle: "Bare 0/1 for complete custody and reduction independent of whether the head wins."
    - static_benefit_score: principle: "Bare 0/1 for all registered support, effect and uncertainty conditions together."
    - prediction_freeze_receipt: principle: "Prediction hashes precede test-label access and prevent test tuning."
    - primary_comparison_rows: principle: "Per-group absolute losses and costs support paired independent reduction."
    - source_sensitivity_rows: principle: "Diagnostic changed-source effects never fabricate negative labels or factuality guarantees."
    - claim_scope: principle: "Only the selected official-test subset of injected tool errors is measured; natural errors and formal correctness remain open."

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} .venv/bin/python -u scripts/experiments/experiment_7539_v659_static_evaluation.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
