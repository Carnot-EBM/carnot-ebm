  prior_failures:
    - experiment_id: exp6968-arc-post-refit-induction-audit
      verdict: blocked_arc_post_refit_induction_audit
      addressed_by: "Exp7010 repairs the producer-consumer schema before evaluation, adds deterministic acceptance and rejection fixtures, and does not depend on the absent post-refit artifact that blocked Exp6968."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V613 found that recent ARC evaluation artifacts omit some combination of
    GPU identity, model hash, n_ctx, server binary, lease, completion counters,
    and solve provenance. Existing helper code captures part of the contract,
    but producers and consumers do not require one complete top-level schema.
    V614 must fix that forward contract before its live A/B.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/python/carnot/agentic/arc_producer_evidence.py
    - {project_root}/scripts/arc_leaderboard_eval.py
    - {project_root}/python/carnot/agentic/arc_live_runner_capability_lease.py
    - {project_root}/python/carnot/agentic/arc_live_runner_execution_binding.py
    - {project_root}/results/experiment_6993_arc_producer_evidence_contract.json
    - {project_root}/results/experiment_7005_arc_live_envelope_audit.json
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Define and wire one forward ARC evaluation provenance contract used by
    producers, persisted rows, and consumers. Require complete hardware,
    model, context, server, lease, completion, policy, factory, and solve
    provenance. Add deterministic fixtures and rejection tests without
    rewriting historical artifacts.

    CONCRETE STEPS:
    0. PRECONDITIONS: require the current provenance helper, leaderboard
       producer, live lease/binding modules, relevant specs, and writable code,
       tests, and artifact paths. On failure write blocked_arc_eval_provenance_contract
       with gate_check_summary.
    1. Add REQ-ARC-7010 and RED tests before implementation. Cover absent,
       null, malformed, aliased, and contradictory fields; CPU/no-LLM rows;
       CUDA rows; partial requests; port reuse; stale leases; and all three
       solve_provenance enum values.
    2. Define one typed builder and validator. For every live evaluation row
       require GPU UUID/model, CUDA device, model repository/filename/hash,
       n_ctx, server binary/command hash, endpoint/port, lease identity,
       request/completion/error counters, policy/factory hashes, git commit,
       and solve_provenance.
    3. Wire the builder at the producer boundary and validation at artifact
       consumption. Do not infer missing values from filenames or backfill old
       results. Missing required live fields must reject headline eligibility.
    4. Preserve legal no-LLM evaluation rows with explicit not_applicable
       values and a no-LLM substrate. Never attach a GGUF or CUDA claim to a
       path that did not invoke it.
    5. Emit one accepted deterministic live-shaped fixture and rejection
       fixtures for every required field. Prove producer-consumer key parity
       and stable hashes in a fresh process.
    6. Set arc_eval_provenance_contract_ready_score=1 only when both producer
       and consumer use the same schema, all rejection fixtures fail closed,
       the accepted fixture round-trips, and solve_provenance is present on
       every evaluation row.
    7. Run focused tests, Ruff, artifact validation, adversarial verification,
       row-consistency lint, OpenSpec coverage, worktree-import guard, harness
       integrity lint, and applicable ARC E2E checks. Reconcile specs and ops
       docs for the code changed.
    8. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below and the bare field
       arc_eval_provenance_contract_ready_score; preconditions_checked;
       inference_substrate (deterministic_arc_provenance_contract_no_llm);
       duration_s; source_artifact_hashes; schema_version; required_key_rows;
       producer_wiring_rows; consumer_wiring_rows; rows; accepted_fixture_rows;
       rejected_fixture_rows; gpu_identity_rows; model_provenance_rows;
       context_rows; server_rows; lease_rows; completion_counter_rows;
       policy_factory_rows; solve_provenance_rows; missing_field_rows;
       alias_rejection_rows; historical_artifacts_modified (false);
       command_receipt_rows; arc_eval_provenance_contract_ready_score;
       random_seed; reproducibility_checksum; gate_check_summary with failed
       check, expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7010_arc_eval_provenance_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

