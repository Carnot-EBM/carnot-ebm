milestone: 2026.06.435
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-25). .434 was the 10th consecutive
  bridge_crossed_for_solve=FALSE milestone. Its DECISIVE new input was negative-and-clarifying: the A2
  surfacing experiment (exp4713) proved the winning L1 candidate -- now PRESENT in the object-centric pool
  (coverage 1.0, the .433 perception win) at rank ~59 -- is NOT separable from same-depth distractors by ANY
  static oracle-distinct feature (precision_at_k_delta=0.0; ranks even worsened [59,161,12,77]->[87,102,74,36]).
  Three more levers nulled the same way: A1 perception-grounded L2 alignment goal (alignment_under_determined);
  A4 the leader's online driver (all 3 arms EXACTLY 0.04 = TAUTOLOGY/no-op signature, flagged_adversarial --
  almost certainly tested DEAD CODE again, like the .433 Go-Explore (1,64,64) + CNN dict-candidate bugs); A3
  banked bp35 L2 but via a development_proxy adapter, not self-discovery. PLUS a poison pre-test SKIPPED the
  operator-MANDATORY B1 (silent-bug audit) + B2 (guard) + A6 persist + A7 integration + C KV260 (no artifacts).
  DIAGNOSIS: STATIC SELECTION OF A FROZEN POOL IS EXHAUSTED. .435 PIVOTS to ACTING, not selecting -- two
  genuinely-independent "make the winner appear/separable by ACTING" levers, both never validly tested: A1
  (HEADLINE) the leader's goal-free ONLINE ACTION-LEARNING DRIVER, tested VALIDLY for the FIRST time (gated on
  PROVEN per-arm non-degeneracy before any lift claim -- the .433/.434 attempts ran dead code); A2 hypothesis-
  driven ACTIVE PROBING (the agent ACTS to disambiguate goal/dynamics so the present-but-unseparable winner is
  distinguishable by CONSEQUENCE, not a static feature -- the .434 capstone + SOTA hand-off, arXiv:2506.01876 +
  2309.08477). A3 self-play banks +1 (63->64) + trains the verifier. CARRIED FORWARD (skipped in .434): B1 the
  operator-MANDATORY silent-bug audit (runs EARLY, adjudicates the .434 A4 TAUTOLOGY -> reopen list), B2 the
  exercise-evidence guard, A5 persist, A6 integration, C KV260. D SOTA-ingestion (the .436 fallback: epistemic
  MCTS + factored causal probe). E capstone. verifier_is_oracle:false on every value claim; solve_provenance on
  every solve; submission operator-only; FoVer 0.9131 / G1-G4 paper_ready frozen. 5 days to the ARC Prize
  Milestone #1 deadline (2026-06-30).
