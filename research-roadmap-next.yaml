        retire_if_same_verdict: true
      - experiment_id: exp5380-v490-constraint-tax-tool-action-panel-v3
        verdict: "complete: constraint-tax panel ready with deterministic state/tool evidence"
        addressed_by: "This task expands fixture count and model coverage beyond the small .490 panel while preserving deterministic final authority."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      .490 proved structured_protocol_clean=true and constraint_tax_panel_ready=true on a small local SOTA panel. .491 must show whether the constraint tax still pays for itself at larger fixture count, with wrong-valid and tool/action reachability evidence.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/results/experiment_5379_live_structured_clean_gate_rerun_v490.json
      - {project_root}/results/experiment_5380_constraint_tax_tool_action_panel_v3_v490.json
      - {project_root}/python/carnot/
      - {project_root}/tests/python/

      TASK:
      Implement and run a larger local SOTA constraint-tax panel. Compare constrained structured generation against unconstrained generation on deterministic fixtures where initial state, final state, and tool/action reachability can be checked without external text scoring.

      CONCRETE STEPS:
      0. PRECONDITIONS: Confirm one or more mandated local SOTA GGUF models are cached and GPU offload is available. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF. Use scripts/experiment_template.py and the cached_sota_pair() pattern where applicable. If CUDA/offload is unavailable, write an honest blocked artifact rather than using CPU-only legacy models as headline evidence.
      1. Build at least 24 deterministic fixtures spanning schema validity, budget arithmetic, temporal ordering, tool/action reachability, contradiction repair, and wrong-valid traps.
      2. For each fixture, record constrained and unconstrained outputs, parse validity, schema validity, semantic validity, deterministic final-state check, wrong-valid status, latency, and token count.
      3. Use deterministic validators or solvers as final authority; do not use generated text as a verifier.
      4. Compute constraint-tax deltas: semantic-validity delta, wrong-valid reduction, unsafe-false-accept reduction, latency ratio, and token ratio.
      5. Write {project_root}/results/experiment_5391_constraint_tax_scaleup_fixtures_v491.json.

      REQUIRED ARTIFACT FIELDS:
      - status: principle: complete if the scale-up ran or blocked if preconditions failed.
      - milestone: principle: must equal 2026.07.491.
      - model_specs: principle: include the mandated SOTA GGUF model names and which model(s) actually ran.
      - gpu_offload_receipt: principle: command, backend, offload layers, and proof this was not CPU-only headline evidence.
      - fixture_count: principle: total deterministic fixtures, target >=24.
      - constrained_semantic_validity_rate: principle: deterministic semantic pass rate.
      - unconstrained_semantic_validity_rate: principle: deterministic semantic pass rate.
      - wrong_valid_count_constrained: principle: wrong-valid accepts under constrained generation.
      - wrong_valid_count_unconstrained: principle: wrong-valid accepts under unconstrained generation.
      - unsafe_false_accept_count: principle: count across all constrained checks.
      - tool_action_reachability_rate: principle: deterministic reachability pass rate.
      - latency_ratio_constrained_vs_unconstrained: principle: measured overhead ratio.
      - token_ratio_constrained_vs_unconstrained: principle: measured token overhead ratio.
      - constraint_tax_scaleup_ready: principle: true only if constrained generation improves deterministic validity without unsafe false accepts.
      - honest_verdict: principle: one-line summary starting with complete: or blocked:.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

