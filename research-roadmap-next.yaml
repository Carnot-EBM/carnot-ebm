    TASK:
    Qualify primary-only publication through the real gate readers.
    Deliverable: {project_root}/results/experiment_7928_v688_primary_publication.json.
    Actual compute: aggregation_from_upstream_artifacts; inference_substrate_class=no_model_load; MODEL_SPECS=[]; execution_venue=host.

    CONCRETE STEPS:
    1. Print a flushed start line. Resolve exact input paths, hashes, roles and gate operands. External missing or failed prerequisites end as complete_blocked_* with verdict_class=blocked and gate_check_summary.
    2. Print a flushed progress line at each phase boundary and before and after every model load, generation, benchmark and subprocess. Print completed units and elapsed time inside long loops. Supervise owned children with heartbeats at most 60 seconds apart. Keep every output gap below 600 seconds. Keep each tool wait at most 60 seconds. Silence can end a task at 1200 seconds; continuous progress permits the 4800-second cap. Never pad duration.
    3. Write any file over about 200 lines in several tool calls, each at most 150 lines. Emit a progress message between calls. Bound analysis intervals and tool calls. Store throwaway probes in /tmp and real experiments in scripts/experiments/. Save checkpoints by code, config and input hashes.
    4. Add task-owned REQ-* and SCENARIO-* requirements before implementation. Write failing tests first. Freeze affected dependencies, exact argv, expected exits, failure reasons, deadlines and coverage includes before results. Preserve historical assertions and required failures.
    5. Reuse existing callable libraries through a small parameterized CLI. Keep fixture outputs, coverage files and pytest basetemp in private /tmp directories. Seal child logs only after exit. Publish exactly one top-level experiment_7928_*.json primary. Store validator reports, attempts and rows under results/raw/experiment_7928_v688_primary_publication/. Never name a top-level validator experiment_7928_*.json. Verify actual conductor_gates.evaluate_gates and in_process_doc_reconcile readers select the primary path and hash even after sidecars receive newer mtimes. Do not depend on a running conductor reloading Python modules. Preserve historical files.
    6. Freeze actual primary/sidecar hashes and mtimes for Exp7904 and Exp7916. Reproduce the selected path through _find_artifact_by_task_id and evaluate_gates. Read the same IDs through the document reconciler. Record the missing fields without changing old verdicts. Do not claim the current primary was consumed during historical dispatch.
    7. Build a small shared publication-layout helper under python/carnot/reporting/. It must allow one top-level primary per new experiment and store validator reports, attempts, manifests and row shards only under results/raw/. Refuse conflicting primary identities. Validate before atomic replacement. Keep sidecars bound to primary hashes. Do not rename or delete historical artifacts. Do not patch the conductor or require a service restart.
    8. Write private fixtures for valid primary plus newer nested sidecar, legacy top-level sidecar shadowing, missing primary, two conflicting primaries, stale hashes, malformed primary, disqualified primary, absent field, concurrent replacement and terminal revalidation. The legacy layout must reproduce the failure as an expected negative. The new layout must pass through the UNMODIFIED consumer functions. A subprocess must cold-read the final fixture.
    9. Publish artifact_resolution_ready_score=1 only after the new layout has passed real gate and document-reader checks. Other tasks must apply the layout even if this receipt is unavailable. Their historical source checks use exact primary paths. No science depends on changing an already-imported module inside a running conductor.
    10. Run focused conductor-gate, document-reconciliation and current-work-receipt consumers. Run E2E-015/016. Record the new publication helper path and callable for subsequent agents. Keep this task mechanical; no model call or benchmark result is produced.
    11. Run affected unit and consumer tests with PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov. Combine unit and real CLI success, expected-failure, cold-replay and terminal-recheck coverage using identical includes. Require nonempty data and 100 percent statements for changed modules and CLIs. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py with explicit affected test filenames. Record repository-wide debt separately. Never remove an existing required failure to obtain readiness.
    12. Run the task-specific E2Es named above. Use --date 20260929 on BOTH fixture and replay calls to the historical Exp7868 E2E-016 CLI. Record current {date} separately. Use private paths and unchanged assertions. Do not run historical publishing CLIs against new authorities. Seal primitive rows, counts and nonoverlapping phase spans. Keep raw shards below 50 MiB and tracked files below 90 MB.
    13. Cold-reduce each claim from primitive rows. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Inspect both reports. Required owned failures imply disqualified and readiness zero. Recheck final bytes after verdict changes. Bind validator sidecars to the candidate hash and atomically publish only checked bytes. Fixture or model-self agreement is circular_positive, never independent scientific benefit.
    14. Use complete_* for terminal outcomes. verdict_class is positive | circular_positive | null | blocked | disqualified | partial. partial_* is only unfinished owned work that another attempt can finish. External incompleteness is blocked. A valid null can open readiness gates. Reconcile OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md. Retire unchanged prior verdicts under retire_if_same_verdict. Do not activate a roadmap, change production defaults or publish externally.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date: Exact producer identity, 2026.09.688 and {date}. Principle: Evidence belongs to its executing producer.
    - honest_verdict, verdict_class: Closed enum positive | circular_positive | null | blocked | disqualified | partial. Principle: External incompleteness is terminal blocked, not retriable partial.
    - flagged_adversarial: Actual terminal validator result. Principle: Flagged evidence cannot open a gate.
    - gate_check_summary: Every blocked_* or complete_blocked_* names upstream ID, path/hash, field, op, expected and observed values. Principle: Missing inputs differ from failed thresholds.
    - rows, sample_size_budget: Unit/arm/seed values plus intended, eligible, started, completed, failed, censored, excluded and independent counts. Principle: Every comparison must be recomputable.
    - acceptance_gate_results: Separate validity, readiness, calibration, decision benefit, retention and efficiency. Principle: Successful execution does not establish scientific benefit.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: Monotonic spans and real code/config/data hashes. Principle: Never infer execution from model names.
    - source_artifact_hashes, preconditions_checked, resolved_imports: Exact paths, transitive hashes and exposure roles. Principle: Prior qualification requires current custody.
    - validation_receipts, validation_command_manifest_path, observed_child_commands, coverage_statement_counts, historical_required_failures, repository_health: Actual argv/exits/deadlines/logs and affected files. Principle: Historical failures stay visible.
    - primary_resolution_receipt, terminal_validation_sidecar_path: Primary path/hash returned by actual readers; sidecars under results/raw/. Principle: A valid artifact must be the artifact the runtime reads.
    - verifier_is_oracle, claim_scope: Explicit circularity and exposed_development status. Principle: A reused development cohort cannot prove independent generalization.
    - inference_substrate, inference_substrate_class, execution_venue: Actual task compute and host venue. Principle: Workload determines the duration floor; a blocked no-run records the planned class separately.
    - MODEL_SPECS, model_specs, target_model, model_invocation_counts, trained_head_specs: Invoked pretrained models or empty lists and zero calls; fitted heads separately. Principle: Referenced models are not invoked models.
    - field_principles: Explain each task-owned field and gate. Principle: Fields preserve their scientific purpose.
    - artifact_resolution_ready_score: 1 only after real reader identity and all owned checks pass. Principle: Publish evidence where the current consumer will find it.
    - resolution_rows, layout_mutation_rows, publication_helper_path: Actual selected paths/hashes and expected negative outcomes. Principle: Test consumers, not a replacement resolver invented for the test.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7928_v688_primary_publication.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
