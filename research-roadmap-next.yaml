        addressed_by: "Runs after solver-certified feedback v3 readiness and records pilot evidence separately from calibration."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. LOVER (arXiv:2605.05893) uses logic regularization over multiple reasoning paths: negation consistency, intra-answer-group consistency, and inter-answer-group consistency. Carnot needs a small exact-fixture pilot before claiming verifier recovery.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
      - unsloth/gemma-4-31B-it-GGUF (flagship dense)
