      CONDUCTOR reconciler treats as a non-terminal retry token -> 3-fail-SKIP. Apply the atomic 5-point
      fix documented in ops/known-issues.md (2026-06-19 entry): (1) emission
      python/carnot/experiment_4423_generic_first_contact_breadth.py:454 -> "complete:
      generic_first_contact_<game>_routed_no_new_level_gap_logged"; (2) _terminal_prefixed (line ~360)
      accept "complete:"; (3) artifact_schema_errors partial-branch (~421) updated; (4) the
      hard-asserting test tests/python/test_experiment_4423_generic_first_contact_breadth.py:185 and the
      partial-requires-gap assertions (~229-234) updated to the new vocabulary; (5) run
      `.venv/bin/pytest tests/python/test_experiment_4423_generic_first_contact_breadth.py` GREEN before
      proceeding -- ALL in ONE commit so the pre-test gate never sees a half-edited contract (the
      2026-06-10 poison-test cascade pattern). GOAL part 2 (SOLVE): then run the generic first-contact
      solver on ONE UNSEEN game, route it (recommend_approach), and drive an ACTUAL solve to +1
      reproducible level (arc_solver_kit.reproduce) -- not just routing. If the routed game still cannot
      be solved generically, that is a complete: routed_no_new_level result WITH the residual mechanic
      logged as a gap (honest, terminal).
      PRECONDITIONS (check FIRST; on any miss honest_verdict blocked_<resource>, STOP): offline env files
      exist; the pytest above is GREEN after the fix; live generator GGUF cached if LLM induction needed.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict: {{principle: "terminal-prefixed complete:/success: -- the whole point of this task is to stop emitting the conductor-rejected partial:"}}
        verdict_contract_fixed: {{principle: "bare bool: the 5-point atomic fix landed AND the test is green (the pre-test gate will not poison)"}}
        reproduced_levels: {{principle: "bare int; reproduction-gated; a routed game that actually SOLVES banks a real level"}}
        offline_reproduced: {{principle: "the gate"}}
        random_seed: {{principle: "determinism"}}
        reproducibility_checksum: {{principle: "content hash for reproducibility"}}
      honest_verdict MUST start with complete:/success:/passed:/shipped:. verifier_is_oracle=true. NO 3090
      inference; NO leaderboard submission.

  - id: exp4436-deepen-plus-primitive-consolidation
    milestone: 2026.06.410
    title: "PHASE A5 (ARC NORTH STAR; MULTI-LEVEL) -- take an already-solved game +1 DEEPER level AND consolidate the per-game solver primitives into composable generic operators in arc_solver_kit."
    priority: high
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-06-19 operator direction: extract what the per-game solvers share into reusable generic operators so the live solver composes them on unseen games. Versioned continuation of the .409 A4 multi-level + the standing arc_solver_kit consolidation with a STATED forward difference: primitive EXTRACTION into composable operators, not just a deeper solve."
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4436_deepen_plus_primitive_consolidation.json
    prompt: |
      GOAL part 1 (DEEPEN): take ONE already-solved game +1 deeper reproducible level (monotonic,
      Incremental-Progress-scoped), reproduction-gated. GOAL part 2 (CONSOLIDATE): identify the solver
      PRIMITIVES that recur across the per-game solvers (the tr87 glyph/rewrite matcher, the config-rule
      grounding inducer, the graph-explore A* + learned action-cost heuristic, the object-centric digest,
      active-data collection) and refactor them into clearly-named, composable generic operators in
      python/carnot/agentic/arc_solver_kit.py that the standing loop selects among -- ADDITIVE and
      backward-compatible (existing per-game solves must still reproduce). Document each consolidated
      primitive + which games it derives from in ops/arc_solve_registry.yaml general_gotchas.
      PRECONDITIONS (check FIRST; on any miss honest_verdict blocked_<resource>, STOP): offline env files
      exist; `.venv/bin/pytest -k arc_solver_kit` GREEN after the refactor (backward-compat proof).
      FALSIFIABLE GATE: reproduced_levels>=1 on the deepened game AND every PRE-EXISTING reproducible
      solve still passes arc_solver_kit.reproduce after the consolidation (no regression).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict: {{principle: "terminal-prefixed"}}
        reproduced_levels: {{principle: "bare int; the +1 deeper level, reproduction-gated"}}
        offline_reproduced: {{principle: "the gate"}}
        primitives_consolidated: {principle: "list of {{operator, derived_from_games}} -- the reusable generic operators the live solver now composes"}
        no_regression: {{principle: "bare bool: every prior reproducible solve still reproduces after the refactor -- additive-only guarantee"}}
        random_seed: {{principle: "determinism"}}
        reproducibility_checksum: {{principle: "content hash"}}
      honest_verdict MUST start with complete:/success:/passed:/shipped:. verifier_is_oracle=true. NO 3090
      inference; NO leaderboard submission.

