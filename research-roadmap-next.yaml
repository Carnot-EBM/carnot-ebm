- id: exp633-hermes-verifier-adapter
  milestone: 2026.04.48
  deliverable: results/experiment_633_hermes_adapter.json
  title: 'Exp 633: HERMES Tool-Augmented Verification Adapter — Step-by-Step Formal Verification (arXiv 2511.18760)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: HERMES (arXiv\
    \ 2511.18760, Nov 2025) achieves 67% accuracy improvement on AIME'25 using four\
    \ modules: LLM generates step → translator formalizes → prover verifies → feedback\
    \ injected before next step. Key insight: verification runs ASYNCHRONOUSLY at\
    \ step boundaries, not every token. The prover in HERMES is Lean (formal logic);\
    \ for Carnot we substitute SymCodeVerifier (executable Python) as the prover —\
    \ lower overhead, no formal logic dependency, already AUC=0.804. The translator\
    \ becomes LLMAsExtractorV1 (extract arithmetic claims). This experiment implements\
    \ HermesVerifierAdapter as a CPU prototype testing the step-boundary feedback\
    \ loop.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/symcode_verifier.py\
    \ — SymCodeVerifier.verify_step() → CoTStep\n- python/carnot/extraction/llm_extractor_v1.py\
    \ — LLMAsExtractorV1.extract() → list[ArithmeticClaim]\n- python/carnot/pipeline/interwhen_monitor.py\
    \ — InterWhenMonitor (Exp 627; examine structure)\n- results/live_pairs_578.json\
    \ — live responses for testing\n\nTASK: Implement HermesVerifierAdapter CPU prototype.\n\
    1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-VERIFY-136 (HermesVerifierAdapter:\
    \ async step-boundary verification with SymCodeVerifier prover), SCENARIO-VERIFY-178/179\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Create python/carnot/pipeline/hermes_adapter.py:\n\
    \   a. HermesVerificationStep dataclass: step_index (int), step_text (str),\n\
    \      translated_claims (list[ArithmeticClaim]), prover_verdict (str): 'correct'\
    \ | 'violated' | 'unknown',\n      feedback_injected (bool), feedback_text (str\
    \ | None).\n   b. HermesVerifierAdapter class:\n      __init__(self, extractor:\
    \ LLMAsExtractorV1, verifier: SymCodeVerifier):\n        self.extractor = extractor\n\
    \        self.verifier = verifier\n      translate(self, step: str) -> list[ArithmeticClaim]:\n\
    \        'Extractor module: extract arithmetic claims from step.'\n        return\
    \ self.extractor.extract(step)\n      prove(self, step: str) -> str:\n        'Prover\
    \ module: SymCodeVerifier verdict.'\n        results = self.verifier.verify_response(step)\n\
    \        violated = any(r.violation_detected for r in results)\n        return\
    \ 'violated' if violated else 'correct'\n      generate_feedback(self, step:\
    \ str, claims: list[ArithmeticClaim]) -> str:\n        'Feedback module: if violated,\
    \ return a correction hint.'\n        violated_claims = [c for c in claims if\
    \ c.confidence < 0.5 or c.lhs_expr is None]\n        if not violated_claims:\
    \ return ''\n        return f'Re-check the calculation: {violated_claims[0].claim_text}'\n\
    \      process_step(self, step_text: str, step_index: int) -> HermesVerificationStep:\n\
    \        'Full HERMES pipeline for one step.'\n        claims = self.translate(step_text)\n\
    \        verdict = self.prove(step_text)\n        feedback = self.generate_feedback(step_text,\
    \ claims) if verdict == 'violated' else None\n        return HermesVerificationStep(step_index,\
    \ step_text, claims, verdict,\n            bool(feedback), feedback)\n      process_response(self,\
    \ response: str) -> list[HermesVerificationStep]:\n        'Process all steps\
    \ in a response.'\n        from python.carnot.pipeline.interwhen_monitor import\
    \ InterWhenMonitor\n        sentences = InterWhenMonitor(self.verifier).split_at_boundaries(response)\n\
    \        return [self.process_step(s, i) for i, s in enumerate(sentences)]\n \
    \  c. Export HermesVerifierAdapter, HermesVerificationStep from carnot.pipeline.\n\
    4. Write scripts/experiment_633_hermes_adapter.py:\n   a. apply_env_autofix() FIRST.\n\
    \   b. ExperimentTimeoutWatchdog(633, timeout_minutes=30).\n   c. ExperimentTemplate(633,\
    \ 'HERMES Verifier Adapter',\n      'results/experiment_633_hermes_adapter.json',\
    \ requires_gpu=False).\n   d. llm_caller = Qwen3.5-0.8B CPU if CARNOT_FORCE_LIVE=1,\
    \ else None.\n   e. adapter = HermesVerifierAdapter(LLMAsExtractorV1(llm_caller),\
    \ SymCodeVerifier(llm_caller)).\n   f. Load 25 incorrect + 10 correct from live_pairs_578.json.\n\
    \   g. For each response: steps = adapter.process_response(response).\n      hermes_violation\
    \ = any(s.prover_verdict=='violated' for s in steps)\n      hermes_feedback =\
    \ [s for s in steps if s.feedback_injected]\n   h. hermes_tp = sum(hermes_violation\
    \ for r in incorrect)\n      hermes_fp = sum(hermes_violation for r in correct)\n\
    \      hermes_recall = hermes_tp / 25. hermes_fp_rate = hermes_fp / 10.\n   i.\
    \ Build artifact: schema='carnot.hermes_adapter.v1',\n      n_incorrect=25, n_correct=10,\n\
    \      hermes_tp=<int>, hermes_fp=<int>,\n      hermes_recall=<float>, hermes_fp_rate=<float>,\n\
    \      v1_baseline_recall=0.04,\n      hermes_improvement=(hermes_recall > 0.04),\n\
    \      honest_verdict='hermes_improved' if hermes_recall>0.04 else 'hermes_no_improvement'.\n\
    \   j. tmpl.assert_deliverable_written() as FINAL LINE.\n5. Write tests/python/test_hermes_adapter.py\
    \ (100% coverage).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n\
    7. Reconcile: _bmad/architecture.md (add HermesVerifierAdapter as Tier 2.6 candidate),\
    \ ops/conductor-log.md, ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
