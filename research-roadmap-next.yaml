  - id: exp1982-phase1-independent-reproducer-github-actions
    title: "Exp 1982: Phase 1 Independent Reproducer via GitHub Actions (final ship criterion)"
    deliverable: results/experiment_1982_independent_reproducer.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures: []
    prompt: |
      CONTEXT: Phase 1 ship-track 4th prong: at least one independent
      reproducer of the verify-and-repair flow from outside the
      operator's immediate dev environment. Per CLAUDE.md Project
      Vision + ops/known-issues.md ".121+ MANDATORY", this is the
      Phase 1 final ship criterion. Operator confirmed earlier that
      a CI run on a fresh GitHub Actions runner counts as "independent".

      FALSIFIABLE HYPOTHESIS: A `.github/workflows/phase1-reproducer.yml`
      workflow runs on a fresh ubuntu-latest runner, clones
      Carnot-EBM/carnot-ebm, installs the published carnot-ebm package
      (or `pip install -e .` if PyPI still pending approval), and
      executes one verify call producing the expected output — all
      within 15 minutes of workflow start. The artifact is the public
      workflow-run log + the reproducer-doc entry at
      ops/phase-1-reproducers.md.

      EXISTING CODE TO READ FIRST:
        - .github/workflows/ (current CI structure; ci.yml + publish-pypi.yml)
        - README.md + docs/integrator-guide.md (from exp1981; the docs
          this reproducer follows)
        - python/carnot/__init__.py (the verify entry point)
        - ops/phase-1-reproducers.md (if exists; CLAUDE.md no-pruning:
          APPEND, do not delete)

      TASK: Ship a .github/workflows/phase1-reproducer.yml workflow + log
      the reproducer.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `.github/workflows/` directory exists — else
              `blocked_no_github_workflows_dir`.
           b. `git remote -v` includes github.com:Carnot-EBM/carnot-ebm
              — else `blocked_no_github_remote`.
           c. `command -v gh` succeeds for workflow_dispatch trigger —
              else continue but mark `gh_unavailable_run_pending: true`.
           Record preconditions_checked.
        1. Draft .github/workflows/phase1-reproducer.yml:
             - on: workflow_dispatch (manual trigger) + schedule (weekly
               cron 0 6 * * 1, Monday 06:00 UTC)
             - runs-on: ubuntu-latest
             - python-version: 3.11
             - steps:
               * checkout
               * setup-python
               * `pip install carnot-ebm` if PyPI 0.1.0b1 is reachable;
                 else `pip install -e .` from clone
               * One verify call: `carnot verify --code 'def add(a, b):
                 return a - b' --func add --test "(2,3):5"` — should
                 detect the bug (the function returns a-b instead of a+b)
               * Upload result as artifact
        2. If gh available: trigger via `gh workflow run
           phase1-reproducer.yml --repo Carnot-EBM/carnot-ebm`. Wait
           up to 10 minutes for first run completion. Capture run_url
           + conclusion.
        3. Update ops/phase-1-reproducers.md (CLAUDE.md no-pruning:
           APPEND a new entry, do NOT delete prior content):
           - Date / runner / Python version / package source (PyPI or
             clone) / verify-call result / wall-clock time / workflow URL
        4. Acceptance: workflow_drafted AND
           (workflow_run_triggered OR gh_unavailable_run_pending) AND
           reproducer_doc_updated.

      REQUIRED ARTIFACT FIELDS:
