      addressed_by: "Exp7009 audits a frozen 14-task contract after the reference delta and validates every producer field, model rule, prompt tail, and exclusion entry before activation."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V613 completed all 13 slots with an honest terminal null. Its pointwise
    feature bank was disqualified because mutation metadata alone reached
    AUROC 0.9537. V614 contains exactly 14 tasks, exp7009 through exp7022, and
    changes the evidence unit to exact intervention pairs plus a separate ARC
    belief-state branch. This advisory infrastructure task freezes the source
    delta and independently checks the executable contract.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/_bmad/prd.md
    - {project_root}/_bmad/architecture.md
    - {project_root}/research-references.md V614 Planner Refresh
    - {project_root}/research-roadmap-next.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7008_v613_capstone.json
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/scripts/conductor_gates.py
    - {project_root}/scripts/verdict_row_consistency_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Run a bounded post-planner source delta and build an independent V614
    Markdown-YAML preflight. Verify exact task count and order, titles,
    deliverables, gates and producers, model declarations, prior-failure
    discipline, comparative rows, artifact fields, and prompt tails. Report
    findings without activating a roadmap or editing the conductor.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable V614 Markdown and YAML, the V613
       capstone, reference marker, exclusion manifest, network access, and a
       writable artifact path. On failure write blocked_v614_contract_preflight
       with gate_check_summary; an external block is terminal, not partial.
    1. Add REQ-REPORT-7009 and RED tests before implementation. Cover exact
       count 14, ordered IDs exp7009-exp7022, title and deliverable parity,
       gate parity, producer spelling, prior-failure schema, MODEL_SPECS,
       verdict_class, per-unit declarations, and prompt-tail requirements.
    2. Recheck arXiv, OpenReview, Hugging Face Papers, Semantic Scholar routes
       for EBT 2507.02092 and ARM-EBM 2512.15605, Extropic writing, GitHub, and
       Logical Intelligence. Preserve query, URL, publication/update date, and
       access outcome. Append only genuinely new post-marker evidence.
    3. Parse the Markdown task table and YAML independently. Require milestone
       2026.09.614, exactly 14 tasks, and exact ordered IDs exp7009-exp7022.
       Compare every exact title, deliverable, and structured gate.
    4. Prove every gated_on upstream occurs earlier in this roadmap and names
       a bare top-level field required by that upstream prompt with identical
       spelling. Reject cross-milestone or missing producers.
    5. Check every task for verdict_class, blocked gate_check_summary,
       field_principles, reproducibility fields, legal inference_substrate,
       and per_unit_rows=true for every comparative claim.
    6. Check that every matching failed scope has all four prior_failures
       fields, no retired ID is reused, no task requires a retired task, and
       the capstone is structurally ungated.
    7. Check every LLM task includes a mandated SOTA GGUF. Confirm Exp7013
       declares all three required families and Exp7021 declares at least
       Qwen3.6-35B-A3B. Legacy small models must be smoke-only.
    8. Set v614_source_delta_complete_score=1 when every requested source route
       has a terminal row. Set v614_task_contract_conforms_score=1 only when
       all 14 contract rows agree and every producer resolves. A mismatch is
       disqualified and must not be repaired silently by this task.
    9. Run focused tests, YAML parsing, artifact validation, adversarial
       verification, row-consistency lint, OpenSpec coverage, and root-clutter
       checks. Reconcile the requirement and reporting docs you change.
    10. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
        principle for every field below; preconditions_checked;
        inference_substrate (deterministic_source_contract_audit_no_llm);
        duration_s; source_artifact_hashes; source_query_rows;
        primary_source_rows; secondary_source_rows; semantic_scholar_rows;
        post_marker_delta_rows; reference_append_rows; rows;
        markdown_task_rows; yaml_task_rows; task_contract_rows;
        title_parity_rows; deliverable_parity_rows; gate_contract_rows;
        gate_producer_rows; prior_failure_rows; retired_id_rows;
        model_compliance_rows; artifact_field_rows; prompt_tail_rows;
        command_receipt_rows; expected_task_count (14); observed_task_count;
        expected_id_order; observed_id_order;
        v614_source_delta_complete_score;
        v614_task_contract_conforms_score; random_seed;
        reproducibility_checksum; gate_check_summary with failed check,
