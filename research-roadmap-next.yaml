        2. Train a SMALL energy reranker (EORM-style: features per candidate = energy
           components / logprob / verifier signals; target = outcome correctness label).
           Keep it lightweight; record its parameter count.
        3. CONDITION 1 (greedy AR floor): stored greedy generation per held-out problem.
        4. CONDITION 2 (self-consistency, PRIMARY control): majority vote over k samples.
        5. CONDITION 3 (self-certainty BoN, arXiv:2502.18581): highest mean-token-confidence sample.
