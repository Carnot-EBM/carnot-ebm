        random_seed:
          principle: "Determinism precondition for the denoising + search + requalification + bootstrap."
        reproducibility_checksum:
          principle: "Hash of the generation corpus + the requalified scorer + the CoDiLA config + the Prism config + the controls + PR-binary inputs; lets a third party re-run."
        model_specs:
          principle: "DiffusionGemma GGUF + PR binary + the requalified scorer + the CoDiLA control + the Prism/HTS config + the best-of-N/intrinsic-SVF baselines + the NFE budget + n + seeds; required methodology."
      ACCEPTANCE GATE:
        - condition: "s3_guided_beats_control + scorer_requalified_leak_clean + codila_control_differentiates + s3_minus_best_of_n_delta + s3_gain_ci95 + controls_differentiated + nfe_budget reported with verifier_is_oracle=false and preconditions_checked and adversarial_verify CLEAN, OR an honest blocked_leak_robust_scorer_unavailable / clean-powered-null / retired_in_generation_conversion_unmeasurable verdict"
          principle: "Repairing the measurement (corpus-specific scorer requalification + a scorer-INDEPENDENT CoDiLA control) gives the thrice-blocked in-generation conversion ONE disciplined attempt with a falsifiable retirement gate; a fixed-NFE generation gain converts the moat 'exists'->'useful', a clean null retires the scale-up, and a 4th unmeasurable block retires the direction -- all decision-grade."

