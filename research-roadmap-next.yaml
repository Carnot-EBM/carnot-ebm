tasks:
  - id: exp1704-phase1-pypi-publish-with-preconditions
    title: "Exp 1704: PyPI publish (Phase 1 ship) — explicit prior_failures + preconditions"
    deliverable: results/experiment_1704_pypi_publish.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1685-pypi-publish-actual
        verdict: blocked_gate_check_failed
        addressed_by: "exp1685 (.170) was doomed-rerun-blocked because the prior failure scope match had no addressed_by note. This task explicitly addresses by (a) checking PyPI credentials BEFORE any twine call (preconditions block per CLAUDE.md Pre-Launch Preconditions Discipline), (b) shipping to TestPyPI first if production credentials are absent, (c) reporting blocked_pypi_credentials honestly rather than fabricating a publish."
        retire_if_same_verdict: true
      - experiment_id: exp1683-pypi-publish-dry-run
        verdict: doomed_rerun_blocked_failure_ledger_match
        addressed_by: "exp1683 (.169) was blocked because the prior failure (exp2103) had no prior_failures cite. This task adds the chain explicitly: exp2103 → exp1683 → exp1685 → exp1704. retire_if_same_verdict=true ensures we don't loop on this fourth attempt without root-cause progress."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: Phase 1 ship-track has been blocked on the PyPI prong for
      4 milestones running (exp2103, exp1683, exp1685, and now exp1704
      attempting the unblock). The structural blocker is the doomed-rerun
      ledger requiring explicit prior_failures with addressed_by notes.
      This task ships THE actual PyPI artifact (or honestly emits
      blocked_pypi_credentials if the operator's PyPI token is not
      configured in this environment).

      FALSIFIABLE HYPOTHESIS: With (a) explicit PyPI credentials precondition,
      (b) TestPyPI as fallback when production credentials are absent,
      (c) twine upload as the publish mechanism, the Carnot Python
      package can be either uploaded to PyPI (success path) or honestly
      reported as blocked (failure path). Fabrication is not a valid
      outcome.

      EXISTING CODE TO READ FIRST:
        - pyproject.toml (current package metadata; verify name="carnot-ebm"
          per CLAUDE.md feedback_pypi_package_name_carnot_ebm)
        - results/experiment_1685_pypi_publish_actual.json (the .170
          blocked attempt — read for context, don't repeat the same path)
        - .github/workflows/publish-pypi.yml if exists

      TASK: Publish carnot-ebm to PyPI (production) or TestPyPI (fallback).

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. `pyproject.toml` exists with `name = "carnot-ebm"` — if name
              differs, emit `blocked_pypi_name_misconfigured` and exit.
           b. `python -m build --version` succeeds (or `pip install build`
              succeeds in a tmp venv) — if not, emit
              `blocked_pypi_build_toolchain_missing` and exit.
           c. `twine --version` succeeds — if not, emit
              `blocked_pypi_twine_missing` and exit.
           d. PyPI credentials available via ONE of: (i) env
              `TWINE_PASSWORD` set with the PyPI API token, (ii) keyring
              `keyring get https://upload.pypi.org/legacy/ __token__`
              returns non-empty, (iii) `~/.pypirc` contains a `[pypi]`
              section with username = `__token__`. If NONE available,
              attempt TestPyPI credentials similarly; if also absent,
              emit `blocked_pypi_credentials_unavailable` and exit.
           Record preconditions_checked in artifact regardless.
        1. Run `python -m build` to create sdist + wheel artifacts under
           `dist/`. Capture wheel filename + sdist filename.
        2. Compute SHA-256 of both artifacts. Record in artifact.
        3. `twine check dist/*` — must succeed. If twine check finds
           README rendering issues, fix the README and rebuild before
           attempting upload.
        4. If production PyPI credentials available: `twine upload
           dist/*` to https://upload.pypi.org/legacy/. Capture full
           response including the PyPI URL of the new release.
        5. If only TestPyPI available: `twine upload --repository-url
           https://test.pypi.org/legacy/ dist/*`. Capture URL.
        6. Verify the upload in a fresh subprocess: `pip install
           --index-url <appropriate index> carnot-ebm==<version> -t
           /tmp/carnot_verify` then `python -c "import sys;
           sys.path.insert(0, '/tmp/carnot_verify'); import carnot;
           print(carnot.__version__)"` — must succeed.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.pypi_publish.v2"
        - experiment: 1704
        - run_date: ISO-8601 UTC
        - duration_s: actual wall time. MUST be > 30s (real PyPI upload
          + post-publish install + verify takes >30s).
        - random_seed: 171304 (no random sampling; methodology field)
        - reproducibility_checksum: sha256 of (pyproject.toml + wheel
          filename + git_rev)
        - preconditions_checked: list of {resource, available: bool,
          check_command, check_output}
        - model_specs: {package_name: "carnot-ebm", version: str,
          publish_target: "pypi" | "testpypi" | "blocked",
          wheel_filename: str, sdist_filename: str,
          wheel_sha256: str, sdist_sha256: str}
        - n_samples: 1 (ship task)
        - n_samples_justification: "Ship task. n is the artifact count."
        - pypi_url: str or null
        - external_install_verified: bool
        - acceptance_gate_passed: bool (pypi_url is non-null AND
          external_install_verified is true)
        - acceptance_gate_criteria: "Real PyPI/TestPyPI upload + verified
          install from fresh subprocess."
        - methodology_note: "Per CLAUDE.md Pre-Launch Preconditions
          Discipline, if any precondition is missing the verdict is
          blocked_<resource> — NOT a fabricated success. If
          duration_s < 30s with acceptance_gate_passed=true, the
          IMPLAUSIBLE_TIGHT_CI / GATE_PASSED_WITHOUT_DATA / DURATION_TOO_SHORT
          adversarial-verify rules will flag — emit blocked instead."
        - optimization_direction: "neither — ship task"
        - honest_verdict: MUST start with `complete:` / `complete_` /
          `success:` / `success_` / `passed:` / `passed_` / `shipped:` /
          `shipped_` per CLAUDE.md Verdict Terminal-Prefix Discipline.

      Run command. Do NOT push to git (twine handles PyPI). Do NOT
      modify scripts/research_conductor.py.

  - id: exp1705-phase1-huggingface-retry
    title: "Exp 1705: HuggingFace mirror retry (Phase 1 ship) — preconditions-guarded"
    deliverable: results/experiment_1705_huggingface_retry.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: critical
    prior_failures:
      - experiment_id: exp1695-phase1-huggingface-publication
        verdict: pending_or_blocked_at_pre_stage_of_172
        addressed_by: "exp1695 (.171) was pre-staged with HF credentials precondition but its outcome was not yet known when .173 was drafted. This retry runs explicitly with the CLAUDE.md preconditions discipline AND a smaller initial scope (one minimal-viable model artifact, NOT all production models) to maximize the chance of at least one ship-artifact landing. If exp1695 has already shipped successfully by the time this fires, the conductor will mark exp1705 as superseded and skip."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT: Phase 1 ship-track HuggingFace prong. exp1695 (.171) was
      the first attempt; outcome was pending at the time .173 was
      drafted. This task retries with a minimal-viable-scope first
      strategy to ensure SOMETHING lands at huggingface.co/Carnot-EBM.

      FALSIFIABLE HYPOTHESIS: At least one Carnot trained EBM artifact
      can be uploaded to huggingface.co/Carnot-EBM with a complete
      model card (no emojis per CLAUDE.md) and verified to be
      loadable via huggingface_hub.hf_hub_download from a fresh
      Python subprocess.

      EXISTING CODE TO READ FIRST:
        - results/experiment_1695_huggingface_publication.json (if exists;
          read for context; if it already shipped successfully, exit
          with verdict `shipped_already_in_171_no_op` honestly)
        - scripts/publish_huggingface.py (if exists from exp1695)
        - python/carnot/verify/ for trained EBM checkpoints

      TASK: Upload one minimal-viable model artifact + model card.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. `huggingface-cli whoami` returns non-anonymous user with
              write access to `Carnot-EBM` org — if not, emit
              `blocked_huggingface_credentials_unavailable` and exit.
           b. `python -c "from huggingface_hub import HfApi; api=HfApi();
              api.list_repo_files('Carnot-EBM/carnot-ebm', repo_type=
              'model')"` succeeds OR fails with 404 (404 means repo
              doesn't exist yet and we create it; auth error means
              blocked).
           c. `git rev-parse HEAD` succeeds (for the model card git_rev).
           d. At least one checkpoint exists in python/carnot/verify/ or
              models/ — if none, emit `blocked_no_checkpoint_available`
              and exit.
           Record preconditions_checked in artifact.
        1. Check for exp1695 result. If exp1695 already shipped (gate
           passed + hf_url populated + external_load_verified=true),
           emit honest_verdict `shipped_already_in_171_no_op` and
           exit cleanly — no fabrication, no duplicate work.
        2. If exp1695 did NOT ship: pick smallest available checkpoint
           (prefer < 100MB to keep upload time bounded). Document the
           choice in artifact `chosen_artifact_path` field.
        3. Write the model card (NO emojis per CLAUDE.md; verbose layman
           explanations per CLAUDE.md):
             - model description (1 paragraph plain-English)
             - intended use cases
             - training data summary
             - evaluation metrics with N values
             - one HONEST limitation cited from paper-v6 §6 (e.g.,
               THRML+Carnot near-critical-beta blind spot from exp1692,
               OR Phase 4 alpha_t bijection-invariance hypothesis from
               exp1693)
             - Apache-2.0 license header
             - BibTeX citation (use ian@blenke.com per memory entry)
        4. `huggingface_hub.create_repo` + `upload_folder` to push.
        5. From a fresh clean Python subprocess in /tmp/, run
           `from huggingface_hub import hf_hub_download; path =
           hf_hub_download(repo_id="Carnot-EBM/<repo>",
           filename="<the_file>"); print(path)` — must succeed.

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.huggingface_retry.v1"
        - experiment: 1705
        - run_date: ISO-8601 UTC
        - duration_s: actual wall time. MUST be > 30s for a real upload.
        - random_seed: 171305
        - reproducibility_checksum: sha256 of (chosen_artifact_path +
          model_card_text + huggingface_hub_version + git_rev)
        - preconditions_checked: list of {resource, available: bool,
          check_command, check_output}
        - model_specs: {hf_org: "Carnot-EBM", hf_repo: str,
          chosen_artifact_path: str, artifact_size_bytes: int,
          model_card_word_count: int}
        - n_samples: 1
        - n_samples_justification: "Ship task. n is the artifact count."
        - hf_upload_succeeded: bool
        - hf_url: str or null
        - external_load_verified: bool
        - model_card_has_emojis: false (explicit CLAUDE.md compliance)
        - model_card_has_apache_license: true
        - acceptance_gate_passed: bool (hf_upload_succeeded AND
          external_load_verified AND NOT model_card_has_emojis)
        - acceptance_gate_criteria: "HF upload + external load + emoji-free"
        - methodology_note: "If exp1695 already shipped, this is a no-op
          with honest verdict; not a fabrication. duration_s of a no-op
          may be < 30s — record honestly."
        - optimization_direction: "neither — ship task"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push to git. Do NOT modify
      scripts/research_conductor.py.

  - id: exp1706-phase1-independent-reproducer
    title: "Exp 1706: Phase 1 independent reproducer engagement (final ship criterion)"
    deliverable: results/experiment_1706_independent_reproducer.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures: []
    prompt: |
      CONTEXT: Phase 1 ship gate's final criterion (per CLAUDE.md
      Project Vision + ops/known-issues.md ".121+ MANDATORY") is at
      least one INDEPENDENT reproducer of the verify-and-repair flow
      from outside the operator's immediate dev environment. This task
      sets up the GitHub Actions CI path as the easiest first
      reproducer — a fresh ubuntu-latest runner counts as
      "independent" per the operator-stated criteria.

      FALSIFIABLE HYPOTHESIS: A GitHub Actions workflow on
      ubuntu-latest can clone Carnot-EBM/carnot-ebm, install via
      `pip install carnot-ebm` (or `pip install .` if exp1704 PyPI
      ship has not completed), and run one verify call producing
      the expected output — all within 15 minutes of workflow start.

      EXISTING CODE TO READ FIRST:
        - .github/workflows/ (current CI structure)
        - README.md and docs/integrator-guide.md (the docs from
          .172 exp1701 if completed)
        - python/carnot/__init__.py + the verify entry point

      TASK: Add or update a `.github/workflows/phase1-reproducer.yml`
      that runs the integrator-onboarding walkthrough on a fresh
      runner, captures the output, and produces a public reproducer
      log artifact.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. `.github/workflows/` directory exists (or repo is a git
              repo so we can create it) — if neither, emit
              `blocked_not_a_git_repo` and exit.
           b. `gh --version` succeeds (for triggering the workflow
              run after writing the file) — if not, document the
              workflow file but mark `gh_cli_unavailable_run_pending`.
           c. `git remote -v` includes a github.com remote OR a
              gitea.noblehunt.org remote with github mirror — if not,
              emit `blocked_no_github_remote` and exit.
        1. Draft `.github/workflows/phase1-reproducer.yml`:
             - on: workflow_dispatch + schedule (weekly)
             - runs-on: ubuntu-latest
             - steps: checkout, setup-python@3.11, pip install (PyPI if
               exp1704 shipped, else `pip install .`), run a verify
               smoke-test call, upload the output as an artifact
        2. If gh available, trigger the workflow_dispatch and capture
           the run ID + URL. Wait up to 10 minutes for completion.
        3. If gh unavailable, document the workflow file as the
           reproducer artifact and emit verdict
           `complete_workflow_drafted_run_pending` honestly.
        4. Update ops/phase-1-reproducers.md with the result (CLAUDE.md
           Documentation Update Rules: ADD a new entry, do NOT remove
           existing content).

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase1_reproducer.v1"
        - experiment: 1706
        - run_date: ISO-8601 UTC
        - duration_s: actual wall time
        - random_seed: 171306
        - reproducibility_checksum: sha256 of (workflow file content +
          git_rev)
        - preconditions_checked: list
        - model_specs: {workflow_file: ".github/workflows/phase1-reproducer.yml",
          runner: "ubuntu-latest", target_python: "3.11"}
        - n_samples: 1
        - n_samples_justification: "Ship task. n is the workflow run count."
        - workflow_drafted: bool
        - workflow_run_triggered: bool
        - workflow_run_url: str or null
        - workflow_run_succeeded: bool or null (null if pending)
        - reproducer_doc_updated: bool
        - acceptance_gate_passed: bool (workflow_drafted AND
          (workflow_run_succeeded OR workflow_run_url is non-null))
        - acceptance_gate_criteria: "Workflow file written + run triggered
          (with success preferred). A workflow drafted but not yet run
          counts as partial — emit honest verdict."
        - methodology_note: "An ubuntu-latest runner is a legitimate
          'independent reproducer' per operator-stated Phase 1
          criteria. Not the same as engaging an external human reproducer,
          but the operator accepted CI runs explicitly."
        - optimization_direction: "neither — ship task"
        - honest_verdict: MUST start with terminal prefix.

      Run command. Do NOT push (let the operator push the workflow file
