  - id: exp2700
    milestone: "2026.05.257"
    deliverable: "results/experiment_2700_conductor_postmortem_v2.json"
    title: "Conductor Postmortem v2 — Multi-File Read-Only Root Cause Analysis"
    agent_type: claude
    model: opus
    max_turns: 60
    requires_claude: true
    track: infrastructure

    prior_failures:
      - experiment_id: exp2687-conductor-zero-execution-diagnosis
        verdict: "zero_execution_no_artifact_produced"
        addressed_by: "exp2687 was a .256 task that never ran — making it the most self-referentially broken experiment in the series (the conductor diagnosis task was itself stalled by the conductor). This .257 attempt uses claude/opus with requires_claude: true because diagnosing a complex Python conductor system requires multi-file cross-reference (scripts/research_conductor.py + ops/conductor-log.md + ops/conductor-state.json + ops/known-issues.md + research-roadmap.yaml = 5+ files) AND open-ended multi-step judgment about which code path drops tasks. Not a mechanical or numerical task — meets all 3 positive criteria for requires_claude per CLAUDE.md."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Milestones 2026.05.206 through 2026.05.256 ALL completed with 0 conductor-dispatched
      experiments (51 consecutive zero-execution milestones). The conductor has been activated,
      roadmaps written, but no agent subprocesses have been dispatched to completion.

      3 tasks DID execute in .256 (exp2695, exp2696, exp2697) — these appear to have been
      run directly in the outer-loop planning session (Claude Code), not via the conductor.

      Per CLAUDE.md: "Never modify scripts/research_conductor.py from within experiment prompts."
      This task reads and analyzes ONLY. It produces a structured operator action list.

      EXISTING CODE TO READ FIRST:
      - scripts/research_conductor.py (full file — task dispatch, agent invocation, state management)
      - ops/conductor-log.md (last 60 lines — find last successful dispatch)
      - ops/conductor-state.json (if exists — current state, milestone, task queue)
      - ops/known-issues.md (OPERATOR CONSTRAINTS section)
      - research-roadmap.yaml (current active roadmap — should be 2026.05.257 after exp2699)

      TASK: Identify the exact mechanism that drops tasks between conductor activation and
      agent subprocess completion. Produce an operator action list with copy-pasteable commands.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `ls scripts/research_conductor.py` — record: conductor_exists (bool).
         b. `ls ops/conductor-log.md 2>/dev/null && echo exists || echo missing`
            Record: conductor_log_exists (bool).
         c. `ls ops/conductor-state.json 2>/dev/null && echo exists || echo missing`
            Record: conductor_state_exists (bool).
         d. `ls .venv/bin/pytest 2>/dev/null && echo exists || echo missing`
            Record: venv_pytest_exists (bool).
         d. `ls .venv/bin/python 2>/dev/null && echo exists || echo missing`
            Record: venv_python_exists (bool).
         Record: preconditions_checked.

      1. Read scripts/research_conductor.py. Map these specific points:
         a. How does the conductor SELECT the next task? (function name + line range)
         b. How does it BUILD the agent command? (what CLI invoked for codex/claude)
         c. What PRE-TESTS run before each task? (function + what they check)
         d. What SKIP or GATE conditions prevent task dispatch?
         e. How does it WRITE to ops/conductor-log.md after dispatch?
         Record: task_selection_function (str), agent_command_builder (str),
         pretest_function (str), skip_conditions (list of str),
         log_write_function (str).

      2. Read ops/conductor-log.md (last 60 lines). Find:
         a. Last line with "OK" status — date, experiment, milestone.
         b. After that: do SKIP or FAIL entries appear? Pattern?
         Record: last_ok_experiment (str), last_ok_date (str), last_ok_milestone (str),
         post_ok_pattern (str — describe the failure pattern).

      3. Read ops/conductor-state.json if it exists:
         Record: conductor_state_keys (list), current_task_in_state (str or null),
         milestone_in_state (str or null).

      4. Root cause analysis — map from readings to most likely causes:
         A. "pre_test_cascade": .venv/bin/pytest fails → all tasks SKIP (the .253 bug)
            Diagnosis check: `ls .venv/bin/pytest && .venv/bin/pytest --co -q tests/python/ 2>&1 | tail -3`
         B. "conductor_not_invoked": no process is running research_conductor.py at all
            Diagnosis check: `ps aux | grep research_conductor | grep -v grep` (no match = conductor not running)
         C. "agent_spawn_failure": codex/claude CLI not found or produces zero output
            Diagnosis check: `which codex 2>/dev/null || echo missing` and `which claude 2>/dev/null || echo missing`
         D. "roadmap_mismatch": research-roadmap.yaml milestone doesn't match what conductor expects
            Diagnosis check: compare milestone field in research-roadmap.yaml to conductor-state.json
         E. "pre_test_known_failure": specific test file fail blocks all dispatch
            Diagnosis check: `.venv/bin/pytest tests/python/ -x --tb=short 2>&1 | tail -20`
         Run each diagnosis check. Record: diagnosis_checks (list of {check, result}).
         Record: root_causes_identified (list of str), most_likely_cause (str).

      5. Recovery plan — produce SPECIFIC copy-pasteable shell commands for the operator:
         Based on root_causes_identified, produce a numbered list of commands like:
         "1. cd {project_root}"
         "2. .venv/bin/python -m ensurepip && .venv/bin/pip install pytest"  # if pre_test_cascade
         "3. python scripts/research_conductor.py --once  # if conductor_not_invoked"
         etc.
         Record: recovery_commands (list of str — copy-pasteable).

      6. Write results/experiment_2700_conductor_postmortem_v2.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:'
        principle: "Terminal prefix; postmortem analysis always produces a terminal artifact."
      - most_likely_cause: str
        principle: "Prioritized single root cause; operator focuses here first."
      - root_causes_identified: list of str
        principle: "Structured list allows systematic addressing of each cause."
      - recovery_commands: list of str — copy-pasteable shell commands
        principle: "Operator pastes these directly; no interpretation needed."
      - last_ok_experiment: str
        principle: "Timeline anchor: when did conductor last successfully dispatch?"
      - last_ok_milestone: str
        principle: "Identifies which milestone was the inflection point."
      - diagnosis_checks: list of {check: str, result: str}
        principle: "Evidence base for root_causes_identified; prevents speculation."
      - conductor_state_exists: bool
        principle: "State file presence indicates conductor has persisted state at all."
      - venv_pytest_exists: bool
        principle: "Pre-test cascade diagnosis: if false, entire task dispatch is blocked."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records which files were actually read."
      - duration_s: float
        principle: "File read + diagnosis checks: expected 10-60s."

      Do NOT modify scripts/research_conductor.py.
      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2701
