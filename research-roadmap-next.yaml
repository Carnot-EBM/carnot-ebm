      - {project_root}/ops/known-issues.md 2026-08-07 trajectory-transfer progress entry
      - {project_root}/ops/arc_solve_registry.yaml
      - {project_root}/openspec/capabilities/arc-world-model-trust-energy/spec.md REQ-ARC-WMTE-TRAJ-TRANSFER-1
      - {project_root}/python/carnot/agentic/arc_solver_kit.py object_relative_trajectory_transfer
      - {project_root}/python/carnot/agentic/arc_competition_agent.py and trajectory-transfer tests

      TASK
      Registry-precheck first. Freeze matched within-game level-boundary cells on already-cleared fixtures, then compare trajectory transfer disabled/enabled through the canonical live agent. Match objects and centroid displacement only from agent-visible prior/current observations. Measure treatment fire, verifier acceptance, displacement validity, avoided induction calls, actions, score, and per-game losses. Do not use another game's trace, source, BFS, adapters, hidden state, or registry trajectories as live inputs.

      MODEL_SPECS:
      - hf_id: unsloth/gemma-4-31B-it-GGUF; role: matched fallback world-model inducer in both arms; preferred_quant: Q4_K_M
      Use the exact Exp6212-qualified runtime if the fallback fires. Record file/build/CUDA/process identity. Legacy models contribute zero rows.

      Required deliverable: {project_root}/results/experiment_6215_arc_object_relative_trajectory_transfer_ab.json.
