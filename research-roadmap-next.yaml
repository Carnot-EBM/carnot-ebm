tasks:
- id: exp7489-contract-methods
  title: Bind the V656 contract and disposition terminal V655 evidence
  phase: 1
  track: reporting
  priority: high
  requires_gpu: false
  max_turns: 20
  estimated_wall_time_min: 20
  per_unit_rows: true
  milestone: 2026.09.656
  deliverable: results/experiment_7489_v656_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  prior_failures:
  - experiment_id: exp7475-contract-methods
    verdict: complete_disqualified_v655_contract_or_validation
    addressed_by: Explicitly inspect the resolved circuit-breaker and misassociated timing-fallback priority;
      keep the contract advisory and independently checked.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.656. V655 has thirteen producer artifacts for fourteen scheduled tasks. Exp7475 failed a required overdue-priority receipt; Exp7484 used a noncanonical aggregation substrate in its terminal artifact, although current source already contains the canonical spelling. Exp7486 panel B is absent; Exp7488 is disqualified. These are not fourteen successful scientific measurements.
    Hypothesis: An exact, advisory contract and dated methods map can prevent the previous reporting defects from contaminating independent measurements.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/experiment_7358_v646_validation_contract.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/results/experiment_7475_v655_contract_methods.json
    - {project_root}/results/experiment_7488_v655_capstone.json
    - {project_root}/research-references.md
    - {project_root}/research-studying.md
    - {project_root}/ops/known-issues.md
    - {project_root}/scripts/overdue_priority_lint.py
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/retro_timing_fallback.py
    - {project_root}/scripts/autoresearch_conductor_round.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7489_v656_contract_methods.json. Create scripts/experiments/experiment_7489_v656_contract_methods.py as the thin entrypoint and reuse or add small logic in python/carnot/experiment_7489_v656_contract_methods.py. Add tests/python/test_experiment_7489_v656_contract_methods.py for new behavior. These are new output paths, not existing prerequisites. Earlier V656 task deliverables are resolved from this roadmap, never guessed. Every acceptance gate and artifact field must include a one-line principle explaining the failure it prevents.

    CONCRETE STEPS:
    1. Emit a flushed progress line immediately. Read the listed sources and relevant existing REQ-* capability before changing code. Authenticate preconditions and original flags. New TASK paths are outputs to create; earlier V656 artifacts are inputs only after their producers run.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed at least every 60 seconds. Stream child stdout unbuffered; emit truthful pending-operation heartbeats every 60 seconds during blocking calls, authoring and validation. Keep EVERY gap below 600 seconds: silence can kill at 1200 seconds, while continuous progress permits the 4800second hard cap. Checkpoint completed units and terminate only owned processes.
    3. Ensure the relevant openspec/capabilities/*/spec.md contains REQ-* requirements, extend it and SCENARIO-* first for new behavior, then add meaningful failing tests and implement only the affected helper plus thin entrypoint. Reuse existing qualified helpers; never copy an old experiment main, stale constants or full-suite validation manifest.
    4. Declare inference_substrate_class=aggregation and inference_substrate=aggregation_from_upstream_artifacts EXACTLY, execution_venue=host, MODEL_SPECS=[], model_specs=[], model_invoked=false and zero current LLM calls. Referenced model evidence stays hash-bound historical provenance, never current inference.
    5. Compare the YAML bearing milestone 2026.09.656 (next before activation, active afterward) with the markdown contract: exactly fourteen ordered tasks exp7489 through exp7502, including titles, phases, paths, substrates and full gate triples. Exercise changed ID, order, count, path, gate field and milestone in private fixtures; each must fail.
    6. Authenticate fourteen V655 dispositions using exact producer or pre-gate paths and hashes. Record Exp7486 as absent, not an invented null or completed panel. Retain the disqualified capstone, failed receipts, historical flags and absence. Do not require the lagging research-complete archive to have caught up.
    7. Ingest at most six primary methods from the V656 references review into docs/research-notes/v656-method-ingestion.md and research-studying.md: response granularity, evidence alignment, corpus leakage controls, budgeted feedback, KAN support limits and on-chip locality. Record paper revision, reusable component, limitation and task mapping. No paper result becomes a Carnot measurement.
    8. Disposition the overdue-priority parse against actual headings and Exp7435 evidence. The NEW circuit-breaker entry is already marked addressed; the parser associates the later RESOLVED retro_timing_fallback_wiring slug with it. Inspect the timing-fallback obligation separately and record the actual unresolved callsite and user-forbidden conductor modification. Do not claim that naming a slug or a green lint completes that wiring. Preserve enforcement semantics; no conductor edit or manufactured implementation task.
    9. Run schema, gate, exclusion, ARC-floor and overdue-priority checks unchanged. Publish contract_ready_score=1 only if the exact current contract and all required checks pass. This is advisory: no independent science task gates on Exp7489. Record unresolved operator obligations with explicit scope and evidence.
    10. Freeze the affected-file validation manifest before running checks and verify imports resolve to this worktree. Run scoped pytest -n 0 -o addopts= --no-cov with a private --basetemp; separately require 100 percent changed-module coverage using a command-local COVERAGE_FILE, scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Reuse Exp7358/Exp7303 scope helpers; do not run full_python_suite or unscoped pytest tests/python, weaken checks or suppress unrelated baseline failures.
    11. Run the entrypoint and fresh-process cold replay as capability E2E. No numbered runtime E2E applies to pure reporting. Shared sampler/training/binding changes require applicable E2E-001/002/003/004 from ops/e2e-test-plan.md; shared ARC policy/transport changes require E2E-009/010 and telemetry changes E2E-011 plus the private real-environment smoke. Affected Rust changes require cargo tests, fmt and clippy.
    12. Independently reduce the per-unit rows, then run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict against the exact terminal candidate. Save actual outputs; fix producer defects without changing guard semantics. Failed required validation is disqualified, an observed failed benefit gate is null, and unchanged external absence is blocked. Publish terminal JSON atomically only after measured work and validation; checkpoints never occupy the deliverable path.
    13. Keep each committed artifact below 20 MiB with hash-bound sidecars and external data caches. Put scratch work in /tmp. Reconcile affected OpenSpec, _bmad/traceability.md, ops/status.md and ops/changelog.md with actual evidence. Preserve historical artifacts, production defaults, generator weights and research-roadmap.yaml. No external publication, scored submission or activation.

    ACCEPTANCE GATES:
    - Validity: all required scoped checks, identity/accounting and independent replay pass. principle: a favorable metric cannot excuse invalid evidence.
    - Readiness: only the exact task-specific observed ready/complete checks can set their bare 0/1 fields. principle: a valid scientific null must not block independent measurements.
    - Benefit: preserve the task-specific support, effect, retention and multiplicity thresholds. principle: a favorable seed, fixture or low-support result cannot replace held-out value.

    REQUIRED ARTIFACT FIELDS:
    - schema: principle: "Versioned schema, exact experiment_id, milestone and terminal status prevent reader drift."
    - run_date: principle: "Use {date}; retain measured UTC and monotonic clock/process identity."
    - preconditions_checked: principle: "Record exact resource paths, observed values, ownership and input validity."
    - MODEL_SPECS: principle: "Current LLM tasks must include unsloth/Qwen3.8-27B-GGUF with resolved file, hash, quantization and runtime; numeric/aggregation tasks use []. Also emit lowercase model_specs."
    - model_invoked: principle: "Attempted live loads/forwards/generations differ from historical and scripted model events."
    - invocation_counts: principle: "Reconcile attempted, completed, failed, cancelled and in-flight loads, forwards and generations."
    - inference_substrate: principle: "Aggregation uses exactly aggregation_from_upstream_artifacts; other tasks name actual executed native readout or CPU numerical work."
    - inference_substrate_class: principle: "Use the declared class: model_load_no_generation=2s, model_bounded_generation=10s, no_model_load or aggregation. Blocked no-run evidence must disclose no execution. Never pad durations."
    - execution_venue: principle: "Host CPU and owned CUDA identity remain distinct from archived board evidence."
    - duration_s: principle: "Measure actual work and separate inference, optimization and validation; no synthetic time floor."
    - phase_spans: principle: "Flushed progress and real checkpoints expose unfinished operations and stalls."
    - random_seed: principle: "Freeze role, optimizer, audit, order and interval seeds; explain deterministic null seeds."
    - reproducibility_checksum: principle: "Bind code, model identity, prompts, data roles, raw shards and validation scope."
    - source_artifact_hashes: principle: "Preserve original upstream bytes, verdicts and flags without laundering."
    - rows: principle: "Per-unit groups/games/arms/events with failures and censoring permit independent headline reduction; shards carry path and SHA256."
    - sample_size_budget: principle: "Separate planned, attempted, complete, failed, excluded, censored and unstarted independent units."
    - acceptance_gate_results: principle: "Every check names validity/support/benefit, expected, observed, op, passed and principle. A positive class requires all gates for its explicitly named claim."
    - gate_check_summary: principle: "For every blocked verdict name check, upstream, exact field/path, expected and observed value, including missing or null."
    - honest_verdict: principle: "Use an honest complete_* terminal finding; preserve actual blocked_* conductor records as received."
    - verdict_class: principle: "Closed enum positive | circular_positive | null | blocked | disqualified | partial. partial is retryable OWN unfinished work only; unchanged external absence is blocked."
    - verifier_is_oracle: principle: "If the verifier is the evaluation oracle, positive is forbidden; analytic fixture benefits are circular_positive."
    - flagged_adversarial: principle: "Retain actual reader flags and failures; never clear a flag to open a gate."
    - validation_receipts: principle: "Exact commands, required versus unrelated-baseline scope, exit codes and hashed output make checks reviewable."
    - field_principles: principle: "Every emitted field and acceptance gate carries its purpose and prevented failure mode."
    - contract_ready_score: principle: "Bare 0/1 for exact contract plus required checks; not scientific benefit."
    - v655_dispositions: principle: "Fourteen rows include thirteen producers and the absent panel B."
    - method_rows: principle: "Source revisions and limitations map to new methods."
    - unresolved_obligations: principle: "A parser false association or a forbidden callsite edit remains visible."

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 PYTHONUNBUFFERED=1 PYTHONPATH={project_root}/python:{project_root} .venv/bin/python -u scripts/experiments/experiment_7489_v656_contract_methods.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
