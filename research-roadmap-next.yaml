  - id: exp5249-cross-model-typed-memory-transfer-v480
    milestone: "2026.07.480"
    title: "PHASE 2 Continuous Self-Learning -- cross-model typed memory transfer with local SOTA GGUFs"
    priority: critical
    track: self-learning
    deliverable: results/experiment_5249_cross_model_typed_memory_transfer_v480.json
    requires_gpu: true
    prior_failures:
      - experiment_id: exp5227-continuous-self-learning-multihead-memory-v478
        verdict: "complete: typed memory consumer-ready for exp5228 with 4 heads, promotions_2_rollbacks_4, retention_passed_True, verified_typed_memory_no_model_training"
        addressed_by: "This task tests transfer across distinct mandated local SOTA models instead of only building a same-pipeline memory registry."
        retire_if_same_verdict: true
      - experiment_id: exp5239-continuous-self-learning-controlled-memory-ablation-v479
        verdict: "complete: typed memory shows controlled useful reuse; aligned_vs_shuffled_delta=1.000000, aligned_vs_no_memory_delta=0.666667, degradation_detected=true, retention_passed=true, rollback_exercised=true, no_model_training"
        addressed_by: "This task keeps the controlled arms but adds cross-model producer/consumer splits and leakage checks inspired by MemCollab."
        retire_if_same_verdict: true
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    estimated_wall_time_min: 90
    prompt: |
      CONTEXT:
      Repo at {project_root}, run on or after {date}. Continuous self-learning is a PRD requirement. Milestone .479 proved a controlled aligned-memory benefit inside one setup. MemCollab (arXiv 2603.23234) motivates testing whether useful memory transfers across different model families without leakage or hidden training.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - CODEX.md
      - research-program.md, especially Continuous Self-Learning
      - scripts/experiment_template.py and its cached_sota_pair() pattern
      - results/experiment_5227_continuous_self_learning_multihead_memory_v478.json
      - results/experiment_5239_continuous_self_learning_controlled_memory_ablation_v479.json
      - existing typed-memory/self-learning code and tests
      - ops/exclusion_manifest.yaml

      TASK:
      Run a small but real cross-model typed-memory transfer experiment. One mandated local SOTA GGUF model must produce typed memories from solved/verified traces, and a different mandated local SOTA GGUF model must consume them on held-out verifier tasks. Include aligned, shuffled, no-memory, stale-memory, and rollback arms.

      CONCRETE STEPS:
      1. PRECONDITIONS: Verify local GPU and llama.cpp/llama-server access. If a mandated model cannot be run, write an honest blocked_precondition artifact; do not fall back to tiny headline models.
      2. MODEL_SPECS for headline results must include at least two of:
         - unsloth/Qwen3.6-35B-A3B-GGUF
         - unsloth/gemma-4-31B-it-GGUF
         - unsloth/gemma-4-26B-A4B-it-GGUF
         Tiny models may appear only under tiny_smoke_tests.
      3. Select a bounded held-out verifier task set from existing fixtures where labels/provenance are deterministic and no training is performed.
      4. Build typed memories with explicit heads: constraints, provenance, failure modes, and skill/rubric hints. Record producer model, consumer model, prompts, seeds, checksums, and wall-clock receipts.
      5. Compare aligned transfer, shuffled transfer, no memory, stale memory, and rollback-triggered memory. Predeclare the pass condition before inspecting results.
      6. Run leakage checks: held-out split check, prompt checksum check, label visibility check, and rollback-on-degradation check.
      7. Run relevant unit/integration tests.
      8. Write results/experiment_5249_cross_model_typed_memory_transfer_v480.json with REQUIRED ARTIFACT FIELDS:
         - honest_verdict: object with value/principle; value must start with complete: or blocked_ and state whether cross-model memory is useful.
         - inference_substrate: object with value/principle; use live_llm_inference_local_gguf_sota if model calls ran.
         - model_specs: object with headline models, quantization, runtime command, seeds, prompt checksums, and principle.
         - cross_model_memory_eligible: bare bool gate field for exp5250.
         - cross_model_memory_eligible_principle: string explaining the gate.
         - producer_model: object with value/principle.
         - consumer_model: object with value/principle.
         - aligned_vs_shuffled_delta: object with numeric value/principle.
         - aligned_vs_no_memory_delta: object with numeric value/principle.
         - stale_memory_delta: object with numeric value/principle.
         - rollback_exercised: object with bool value/principle.
         - retention_check_passed: object with bool value/principle.
         - no_model_training: object with bool value/principle.
         - leakage_checks: object with value/principle.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

