         a. Run score_candidates(K candidates) on each test example.
         b. Check if select_best_candidate() returns the "correct" candidate (for examples where one is clearly correct).
         c. Record: k_selection_accuracy (fraction of clearly-correct examples where K-best was selected).
         d. Record: k_compute_cost = K (proxy for inference calls required).
         Record: k_efficiency_curve = [{k, selection_accuracy, compute_cost}].

