      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1738-live-telemetry-streamer
    title: "Exp 1738: Live Telemetry Streamer for Continual Learning"
    deliverable: results/experiment_1738_telemetry.json
    max_turns: 50
    prompt: |
      CONTEXT: Phase 2 Continual Self-Learning. To enable continuous updates, we need a mechanism to stream violation feedback from active inference sessions.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verification_loop.py
      TASK: Implement an asynchronous telemetry streamer.
      CONCRETE STEPS:
      1. Create `{project_root}/python/carnot/training/telemetry_streamer.py`.
      2. Implement a non-blocking queue that records `VerificationResult` instances (both successes and failures).
      3. Create `{project_root}/scripts/experiment_1738_telemetry.py` to simulate a load test of the streamer.
      4. Write results to `{project_root}/results/experiment_1738_telemetry.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp1739-online-eorm-update
    title: "Exp 1739: Tier 3 EORM Live Updates"
    deliverable: results/experiment_1739_eorm_update.json
    gated_on:
      - upstream: exp1738-live-telemetry-streamer
        artifact_field: status
        op: ==
        value: "success"
    max_turns: 50
    prompt: |
      CONTEXT: Phase 2 Continual Self-Learning. Using the telemetry stream, perform micro-batch gradient updates to the Energy-based Reward Model (EORM) and JEPA predictor.
      EXISTING CODE TO READ FIRST: python/carnot/training/telemetry_streamer.py
      TASK: Implement the continuous fine-tuning loop.
      CONCRETE STEPS:
      1. Create `{project_root}/python/carnot/training/continuous_finetuner.py`.
      2. Pull from the telemetry stream and run an AdamW update step every N samples.
      3. Create `{project_root}/scripts/experiment_1739_eorm_update.py` to evaluate the adaptation rate over a synthetic distribution shift.
      4. Write results to `{project_root}/results/experiment_1739_eorm_update.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

