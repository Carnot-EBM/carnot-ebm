- id: exp1203-pre-test-diagnostics-fix
  milestone: 2026.04.94
  deliverable: results/experiment_1203_pre_test_diagnostics_fix.json
  title: "Pre-Test Suite Diagnostics + Fix — Unblock 9 SKIP Retirements per Milestone"
  agent_type: claude
  model: opus
  max_turns: 50
  estimated_wall_time_min: 30
  priority: critical
  requires_gpu: false
  prompt: |
    CONTEXT:
    In milestone 2026.04.93, three experiments (exp1192, exp1193, exp1197) were RETIRED with
    MISSING artifacts because the conductor's pre-test self-heal ran 'pytest tests/python'
    and it kept failing. After 3 SKIP attempts per experiment, the conductor retired each task.
    This wasted 9 task-slots and blocked the entire downstream cascade.

    The test suite has been broken since milestone .92, when exp1178 (PytestMemoryWatchdog)
    wired a new plugin into conftest.py. exp1191 then added RLIMIT_AS=8GB via resource.setrlimit.
    One or both of these changes is causing a test to fail. Until this is fixed, every experiment
    that goes through the standard pre-test gate will SKIP 3x and retire.

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write this to results/experiment_1203_pre_test_diagnostics_fix.json NOW before any diagnosis:
    {
      "experiment": "1203_pre_test_diagnostics_fix",
      "status": "in_progress",
      "run_date": "{date}",
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - tests/python/conftest.py (contains PytestMemoryWatchdog wire-in AND resource.setrlimit)
    - python/carnot/testing/pytest_memory_watchdog.py (watchdog plugin from exp1178)
    - results/experiment_1191_prlimit_memory_cap_conftest.json (confirms RLIMIT_AS=8GB added)

    TASK:
    1. Immediately write the skeleton artifact (STEP 0 above).

    2. Run the test suite to find the first failure:
       cd {project_root}
       python3 -m pytest tests/python -x --no-cov -q 2>&1 | head -60

    3. Diagnose the failure:
       a. If RLIMIT_AS-related (OSError, MemoryError, SIGKILL during model load):
          - Increase the cap in conftest.py from 8GB to 32GB
          - The 8GB cap was too restrictive; the test suite needs >8GB virtual address space
          - Only apply RLIMIT_AS if the environment doesn't already have a lower limit
       b. If watchdog-related (watchdog plugin assertion or threshold issue):
          - Check what RSS delta the watchdog is measuring
          - Either increase the threshold or fix the test fixture that triggers it
       c. If import error (module not found, conftest syntax):
          - Fix the import and verify conftest.py syntax

    4. Apply the fix to conftest.py (or the failing test file).

    5. Re-run the test suite to verify the fix:
       python3 -m pytest tests/python --no-cov -q 2>&1 | tail -10
       Record: n_tests_pass, n_tests_fail, n_tests_warn

    6. If still failing after one round of fixes, apply a targeted skip for the specific
       test that is failing (mark it xfail with a comment explaining why) — do NOT leave
       the suite in a broken state.

    7. Update the artifact with final results.

    CONCRETE STEPS:
    - Write skeleton to results/experiment_1203_pre_test_diagnostics_fix.json
    - cat tests/python/conftest.py 2>&1
    - python3 -m pytest tests/python -x --no-cov -q 2>&1 | head -60
    - [Diagnose root cause]
    - [Apply fix to conftest.py or failing test]
    - python3 -m pytest tests/python --no-cov -q 2>&1 | tail -15
    - Update results/experiment_1203_pre_test_diagnostics_fix.json

    REQUIRED ARTIFACT FIELDS:
    - root_cause: str (what was causing the pre-test failures)
    - fix_applied: str (description of the fix)
    - rlimit_as_before: str (what RLIMIT_AS was before fix)
    - rlimit_as_after: str (what RLIMIT_AS is after fix)
    - n_tests_pass: int (must be >= 400)
    - n_tests_fail: int (must be 0)
    - test_suite_state: str ("passing" | "partial" | "still_failing")
    - pre_test_suite_passing: bool (True iff n_tests_fail == 0 AND n_tests_pass >= 400)
    - honest_verdict: "pre_test_fixed" | "pre_test_partial_fix" | "pre_test_still_broken"

    Run: python3 -m pytest tests/python --no-cov -q 2>&1 | tail -10
    Do NOT push. Do NOT modify scripts/research_conductor.py.

