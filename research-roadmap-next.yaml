    prompt: |
      CONTEXT: Weaver (arXiv:2506.18203) is Carnot's closest peer -- a weighted weak-verifier ensemble (15
      verifiers; weighted beats unweighted by up to 11.2 pts; +8.5% over single best; 87.7% avg beating
      o3-mini). It has TWO documented gaps Carnot can claim as differentiation: (a) NO correlation validation
      -- Weaver ASSUMES conditional independence of verifiers given the label and never measures the
      inter-verifier correlation matrix; (b) NO online weighting (fixed weights fit once). This task measures
      (a) on Carnot's ensemble and reproduces a Weaver-style weighting baseline for apples-to-apples
      positioning. ((b) is exp3618.)
      EXISTING CODE TO READ FIRST: results/experiment_2837_fover_memory_leakage_v3.json (the FoVer corpus +
      the 4 scoring verifiers) and the verifier inventory under python/carnot/verify/ via
      scripts/summarize_artifact.py; any existing ensemble-weighting code in python/carnot/verify/ or
      python/carnot/pipeline/. project_orthogonality_stall / project_pathological_joint_null_space memories
      are the conceptual backdrop (joint null space).
      PRECONDITIONS (step 0): the FoVer corpus + the scoring verifiers loadable. If not ->
      "complete: blocked_fover_corpus_or_verifiers_unavailable".
      CONCRETE STEPS:
        1. On the FoVer corpus, compute per-verifier scores; build the inter-verifier CORRELATION matrix
           (Pearson + conditional correlation given the label). Report mean off-diagonal correlation and the
           most-redundant verifier pair -- the quantity Weaver assumes is ~0.
