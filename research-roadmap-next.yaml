- id: exp844-jepa-v24b-svamp
  milestone: 2026.04.65
  deliverable: results/experiment_844_jepa_v24b_svamp.json
  title: 'Exp 844: JEPA v24b SVAMP-Balanced Domain Training (RETRO-SVAMP-ZERO-AUC, CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 834 (JEPA v24 DG-PRM) lifted ARC AUC from 0.04 to 0.72 but SVAMP collapsed
    to 0.0 because the training corpus had zero SVAMP examples. DreamPRM per-domain reweighting
    cannot improve a domain with zero training signal. This is the 11th consecutive JEPA retrain
    attempt. The root cause is now definitively understood: corpus must cover ALL target domains
    before reweighting helps. The fix is purely a data coverage issue: add 20 SVAMP triplets.

    EXISTING CODE TO READ FIRST:
    - results/experiment_834_jepa_v24_dg_prm.json — checkpoint path, per-domain AUC results,
      corpus paths, training config
    - results/experiment_825_jepa_v23_eval_fr11_tier3.json — per-domain AUC baseline (v23)
    - python/carnot/pipeline/jepa_predictor.py or similar — JEPAPredictor class and training loop
    - python/carnot/pipeline/eorm_model.py — EORMModel for feature extraction
    - openspec/capabilities/autoresearch/spec.md — REQ-LEARN entries

    TASK: Add 20 SVAMP triplets to the corpus, assert all domains covered, retrain as JEPA v24b.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_834_jepa_v24_dg_prm.json:
       a. Extract checkpoint_path (JEPA v24 weights).
       b. Extract training corpus paths (fover_labeled_steps, cpmi_triples, arc_pairs).
       c. Extract per-domain AUC: note auc_svamp=0.0, auc_arc, auc_humaneval, auc_gsm8k.
    3. Generate 20 SVAMP triplets (CPU, no GPU needed):
       a. For each of 20 SVAMP-style word problems (write them directly):
          - anchor: a partial correct reasoning step ("We need to find X. Y + Z = W, so X = W.")
          - positive: a correct continuation ("Therefore the answer is W.")
          - negative: an incorrect continuation with arithmetic error ("Therefore the answer is W+1.")
       b. Symbolic verification: for each triplet, verify the anchor + positive is arithmetically
          consistent (W = Y+Z) and anchor + negative is not. Use exec() for arithmetic eval.
       c. Write results/jepa_v24b_svamp_triplets.json with 20 validated triplets.
    4. Build corpus v24b:
       a. Load existing GSM8K/HumanEval/ARC training pairs from Exp 834 corpus.
       b. Add the 20 SVAMP triplets from step 3.
       c. Assert ALL domains covered at startup:
          assert n_svamp_pairs >= 15, f"SVAMP coverage insufficient: {n_svamp_pairs}"
          assert n_arc_pairs >= 15, f"ARC coverage insufficient: {n_arc_pairs}"
          assert n_humaneval_pairs >= 15, f"HumanEval coverage insufficient: {n_humaneval_pairs}"
          assert n_gsm8k_pairs >= 15, f"GSM8K coverage insufficient: {n_gsm8k_pairs}"
    5. DreamPRM per-domain loss weighting (arXiv 2505.20241):
       - Compute weights from Exp 834 per-domain validation loss:
         SVAMP weight = 8.0 (auc=0.0, maximum deficit)
         ARC weight = 1.3 (auc=0.72 in v24, moderate)
         HumanEval weight = 1.2 (auc~0.76)
         GSM8K weight = 1.0 (baseline)
       - Per-domain weight is applied as a scalar multiplier on the triplet loss for each
         domain's training examples before the optimizer step.
    6. Train JEPA v24b: 250 epochs, same architecture as v24, triplet loss + domain weights.
       Save checkpoint to results/jepa_v24b_checkpoint/.
    7. Evaluate per-domain AUC on held-out test set (10 pairs per domain, CPU):
       Compute: auc_gsm8k, auc_humaneval, auc_arc, auc_svamp, overall_ood_auc.
       overall_ood_auc = mean([auc_humaneval, auc_arc, auc_svamp])
         (GSM8K is in-distribution, excluded from OOD average).
    8. Record in result artifact:
       min_domain_auc = min(auc_gsm8k, auc_humaneval, auc_arc, auc_svamp)
       all_domains_coverage = True (assertion passed)
       checkpoint_path = "results/jepa_v24b_checkpoint/"
    9. honest_verdict:
       - "jepa_v24b_all_domains_viable" if min_domain_auc >= 0.50 AND overall_ood_auc >= 0.65
       - "jepa_v24b_svamp_fixed" if auc_svamp >= 0.40 but min_domain_auc < 0.50
       - "jepa_v24b_svamp_still_collapsed" if auc_svamp < 0.40
    10. Write tests/python/test_experiment_844_jepa_v24b_svamp.py with 100% coverage.
        Include: test_svamp_assertion_fires_if_zero_triplets, test_domain_weights_applied,
        test_all_domains_covered, test_honest_verdict_logic.
        Traces to REQ-LEARN-010, SCENARIO-LEARN-015 (existing JEPA training specs).
        Add: REQ-LEARN-020: JEPA training MUST assert coverage >= 15 pairs per domain.
        SCENARIO-LEARN-020: Training with 0 SVAMP pairs; assertion fires with diagnostic message.
    11. Update openspec/capabilities/autoresearch/spec.md with REQ-LEARN-020, SCENARIO-LEARN-020.
    12. Reconcile:
        - ops/changelog.md: one-line entry
        - ops/status.md: "Exp 844: JEPA v24b trained. svamp_fixed=<bool>. min_domain_auc=<val>."
    13. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_844_jepa_v24b_svamp.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

