tasks:
- id: exp6885-v603-executable-manifest-branch-contract
  title: V603 executable manifest and branch isolation contract
  track: infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 120
  per_unit_rows: true
  milestone: 2026.09.603
  deliverable: results/experiment_6885_v603_executable_manifest_branch_contract.json
  prompt: |
    CONTEXT:
    V602's design document listed 11 tasks, but the activated YAML listed four. Exp6874 detected
    the mismatch and every remaining executable science task then stopped through one root chain.
    V603 has 13 tasks, two independent science roots, an ungated independent audit, and an ungated
    capstone. This task validates the execution contract. Its readiness field is advisory. No
    science task may gate on it.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md and {project_root}/_bmad/prd.md
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/ops/conductor-log.md and {project_root}/ops/known-issues.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/results/experiment_6874_v602_evidence_substrate_manifest_contract.json
    - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/conductor_gates.py,
      {project_root}/scripts/validate_prior_failures.py, and {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build an append-only V603 executable-manifest and branch-isolation receipt. Compare the active
    design and roadmap from primary files. Require the exact 13-task sequence, unique deliverables,
    valid gates, complete prior-failure blocks, current IDs, and exact prompt endings. Prove that
    Exp6886, Exp6892, Exp6896, and Exp6897 do not depend on this task or another global root. Do not
    change the roadmap, exclusion manifest, conductor, or old artifacts.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable V603 design and active roadmap, the V602 terminal artifacts,
       the current exclusion manifest, and the current gate and schema code. On failure, write
       complete_blocked_v603_executable_manifest_branch_contract with gate_check_summary.
    1. Add REQ-REPORT-6885 and focused tests before implementation. Cover document/YAML count,
       order, ID, deliverable, milestone, prompt ending, gate-field, missing-upstream, retired-ID,
       prior-failure, root-fanout, and ungated-tail mismatches.
    2. Parse the design and active roadmap. Require `2026.09.603`, 13 tasks, IDs Exp6885-Exp6897 in
       conductor order, unique JSON deliverables, and the four required prompt sections.
    3. Require every prompt to end with its Run command and the exact sentence `Do NOT push. Do NOT
       modify scripts/research_conductor.py.`
    4. Validate every `gated_on` operator, upstream task, top-level producer field, and value. Check
       all four prior-failure subfields and require `retire_if_same_verdict=true`.
    5. Prove that no task gates on Exp6885. Prove that Exp6886 and Exp6892 are independent science
       roots and that Exp6896 and Exp6897 are ungated terminal tasks.
    6. Check retired IDs and retired upstreams against the exclusion manifest. Preserve warnings and
       hard failures separately.
    7. Set `v603_manifest_contract_ready_score=1` only when every contract check passes. Do not use
       this field to approve any scientific claim.
    8. Run focused tests, Ruff, OpenSpec coverage, YAML parsing, roadmap schema validation,
       prior-failure validation, gate audit, adversarial verification, artifact-convention audit,
       verdict-row consistency lint, docs audit, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one principle per required field and
       `v603_manifest_contract_ready_score`; preconditions_checked; inference_substrate
       (deterministic_manifest_contract_no_llm); duration_s; source_artifact_hashes; rows (one task
       and contract check per row); document_task_rows; yaml_task_rows; document_yaml_parity_rows;
       gate_contract_rows; prior_failure_contract_rows; prompt_ending_rows; retired_id_rows;
       retired_upstream_rows; branch_root_rows; ungated_tail_rows; task_count; experiment_range;
       random_seed; reproducibility_checksum; v603_manifest_contract_ready_score;
       gate_check_summary with failed check, expected value, and observed value for any blocked
       verdict; verifier_is_oracle (false); verdict_class (positive | circular_positive | null |
       blocked | disqualified | partial); honest_verdict (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6885_v603_executable_manifest_branch_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6874-v602-evidence-substrate-manifest-contract
      verdict: complete_blocked_v602_evidence_substrate_manifest_contract
      addressed_by: 'The V603 document and executable file now declare the same 13 tasks, while this check is advisory and no science branch gates on its readiness field.'
      retire_if_same_verdict: true

- id: exp6886-enoki-exact-relation-fixture
  title: Enoki asset admission and exact relation fixture
  track: infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 360
  per_unit_rows: true
  milestone: 2026.09.603
  deliverable: results/experiment_6886_enoki_exact_relation_fixture.json
  prompt: |
    CONTEXT:
    V602's text-anchored fixture never ran because it was placed behind the failed manifest root.
    Enoki now publishes `s-nlp/enoki-openie-encoder` and `s-nlp/EnokiQA`. Carnot already has a
    bounded ASP energy compiler with independent solver parity from Exp6274. This task makes the
    fixture an independent root, admits pinned Enoki assets, and performs no GGUF inference.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V603 Planner Refresh
    - {project_root}/results/experiment_6274_asp_energy_semantic_compiler.json
    - {project_root}/results/experiment_6275_flagship_asp_constraint_verification_benchmark.json
    - {project_root}/results/experiment_6875_text_anchored_relation_asp_fixture.json
    - {project_root}/python/carnot/asp_energy_semantic_compiler.py
    - {project_root}/tests/python/test_asp_energy_semantic_compiler_6274.py
    - {project_root}/openspec/capabilities/constraint-verification/spec.md
    - {project_root}/openspec/capabilities/constraint-store/spec.md

    TASK:
    Admit exact revisions of the Enoki encoder and a bounded EnokiQA shard. Define a source-anchored
    relation record and a closed map to Carnot's supported bounded ASP atoms. Build calibration and
    sealed-held fixtures over graph coloring, scheduling, non-monotonic defaults, contradictions,
    and cardinality constraints. Prove relation-to-atom and atom-to-energy parity with an independent
    solver. Do not run an LLM, claim Enoki accuracy, or read a held label from a future prompt path.

    CONCRETE STEPS:
    0. PRECONDITIONS: require the qualified Exp6274 compiler, working independent ASP solver, exact
       Enoki asset revisions or an authenticated bounded download path, sufficient disk, and no
       target IDs already in an incompatible cache. On failure, write
       complete_blocked_enoki_exact_relation_fixture with gate_check_summary.
    1. Add REQ-CONSTRAINT-6886 and tests first. Cover cache hash drift, unavailable assets, invalid
       spans, UTF-8 offsets, unknown entities, unsupported predicates, duplicates, polarity,
       negation, cardinality, atom collision, sidecar leakage, solver timeout, and disagreement.
    2. Pin and cache only the encoder files and a bounded, deterministic EnokiQA shard. Record source
       URLs, revisions, licenses, file hashes, row hashes, and cache paths. Do not vendor model data.
    3. Define `anchored_relation_v1` with record ID, source text hash, source and evidence spans,
       subject, predicate, object, polarity, normalized tuple, ASP atom, and provenance hash.
    4. Use a closed vocabulary derived from the supported Exp6274 subset. Reject any record without
       an injective map and exact source evidence.
    5. Build at least 150 balanced fixtures with valid, omitted, contradictory, malformed, and
       abstain cases across the five families. Freeze group-disjoint calibration and held manifests.
    6. Seal labels, ASP programs, answer sets, and solver receipts outside every future prompt view.
       Add mechanical nonexposure tests for each hidden field and sidecar.
    7. Compile each accepted relation set. Require the zero-energy states to equal the independent
       solver answer sets and preserve local rule-violation receipts per row.
    8. Set `relation_fixture_ready_score=1` only when asset hashes, schema checks, family floors,
       split isolation, sidecar sealing, injective mapping, and exact parity pass.
    9. Run focused tests, Ruff, OpenSpec coverage, E2E-006, independent solver parity, adversarial
       verification, artifact-convention audit, verdict-row consistency lint, and root-clutter checks.
    10. REQUIRED ARTIFACT FIELDS: field_principles with one principle per required field and
       `relation_fixture_ready_score`; preconditions_checked; inference_substrate
       (deterministic_enoki_asset_and_exact_asp_fixture_no_llm); duration_s; source_artifact_hashes;
       enoki_asset_receipts; asset_revision_rows; asset_license_rows; relation_schema_version;
       closed_vocabulary_manifest; rows (one asset, fixture, relation, and exact check per row);
       fixture_family_counts; calibration_group_manifest; sealed_held_group_manifest;
       split_overlap_count (zero); relation_to_atom_rows; atom_collision_rows; unsupported_rows;
       solver_parity_rows; rule_violation_receipts; prompt_nonexposure_results;
       independent_solver_receipts; random_seed; reproducibility_checksum;
       relation_fixture_ready_score (exact field consumed by Exp6887); gate_check_summary with failed
       check, expected value, and observed value for any blocked verdict; verifier_is_oracle (true);
       verdict_class (circular_positive | null | blocked | disqualified | partial; never positive);
       honest_verdict (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6886_enoki_exact_relation_fixture.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp6875-text-anchored-relation-asp-fixture
      verdict: blocked_gate_check_failed
      addressed_by: 'Exp6886 is an ungated branch root, adds pinned public Enoki assets, and evaluates its own fixture and exact solver contract instead of inheriting the failed V602 manifest gate.'
      retire_if_same_verdict: true

- id: exp6887-three-family-relation-proposal-corpus
  title: Three family anchored relation proposal corpus
  track: verification
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 960
  per_unit_rows: true
  milestone: 2026.09.603
  deliverable: results/experiment_6887_three_family_relation_proposal_corpus.json
  gated_on:
    - upstream: exp6886-enoki-exact-relation-fixture
      artifact_field: relation_fixture_ready_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Exp5786 failed its free constraint-response parser threshold. Exp5923 retired schema-supported
    ConstraintIR repair after zero exact semantic success. Exp6886 changes the interface to one
    source-anchored relation schema with a qualified ASP map. This task compares raw proposal arms.
    It does not use constrained decoding, repair reprompts, a model judge, or external text scoring.

    Work at {project_root}. The execution date is {date}.

    MODEL_SPECS:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V603 Planner Refresh
    - {project_root}/ops/exclusion_manifest.yaml, Exp5923 retirement entry
    - {project_root}/results/experiment_5786_sota_constraint_stream.json
    - {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
    - {project_root}/results/experiment_6274_asp_energy_semantic_compiler.json
    - {project_root}/results/experiment_6886_enoki_exact_relation_fixture.json
    - {project_root}/scripts/experiment_template.py, cached_sota_pair() pattern
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/python/carnot/inference/llama_cpp_process.py
    - {project_root}/openspec/capabilities/llm-ebm-inference/spec.md
    - {project_root}/openspec/capabilities/constraint-verification/spec.md

    TASK:
    Run all three MODEL_SPECS, the pinned Enoki encoder, and a deterministic rule arm on identical
    frozen source records. Ask GGUFs for a small plain-text relation-line protocol. Preserve every
    raw output, empty cell, span, tuple, parser failure, abstention, timeout, and truncation. Parse
    surface form only. Keep held labels, ASP programs, answer sets, and solver receipts sealed.

    CONCRETE STEPS:
    0. PRECONDITIONS: call cached_sota_pair(); require `relation_fixture_ready_score=1`, all three
       exact GGUF paths, pinned Enoki assets, native tokenizer receipts, task-owned GPU leases, and
       zero held-sidecar access. On failure, write complete_blocked_three_family_relation_corpus
       with gate_check_summary.
    1. Add REQ-INFERENCE-6887 and tests first. Cover missing caches, revision drift, tokenizer
       substitution, CPU headline fallback, GPU offload absence, prompt leakage, malformed protocol,
       invalid spans, duplicates, timeout, truncation, partial resume, and server teardown.
    2. Resolve GGUFs through cached_sota_pair() and the dense extension. Use native llama.cpp
       tokenization. Never pass a GGUF repository to AutoTokenizer.from_pretrained().
    3. Freeze one prompt and plain line protocol. Do not use a grammar, JSON schema, exact generated
       answer, model judge, repair prompt, or external text scorer.
    4. Run at least 90 group-balanced source records per proposal arm, with at least 18 records from
       each fixture family. Match task identity, seed matrix, output budget, and stop policy.
    5. Record prompt and raw-output hashes, native token counts, latency, stop reason, GPU UUID,
       offload layers, server PID, VRAM, encoder identity, rule version, and teardown per cell.
    6. Parse source spans and tuple fields only. Preserve malformed, unsupported, duplicate, abstain,
       and empty rows so all arm-family denominators remain visible.
    7. Set `relation_corpus_complete_score=1` only from authentic acquisition, minimum arm-family
       counts, raw-row integrity, and sealed-label nonaccess. Do not make readiness depend on quality.
    8. Run focused tests, Ruff, OpenSpec coverage, E2E-006, cache and GPU authenticity checks,
       adversarial verification, artifact-convention audit, verdict-row consistency lint, and
       root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one principle per required field and the
       incoming and outgoing gate fields; preconditions_checked; inference_substrate
       (live_local_sota_gguf_cuda_plus_pinned_enoki_encoder); duration_s; source_artifact_hashes;
       model_specs (all three exact MODEL_SPECS); models_used; model_artifact_hashes;
       tokenizer_receipts; llama_cpp_receipts; gpu_lease_rows; enoki_asset_receipts;
       deterministic_rule_receipts; prompt_manifest; held_sidecar_access_count (zero); rows (one
       arm, source record, relation, or empty cell); raw_output_manifest; parse_failure_rows;
       abstention_rows; truncation_rows; timeout_rows; per_arm_family_counts; server_lifecycle_rows;
       model_weight_mutation_count (zero); external_text_scorer_call_count (zero);
       constrained_schema_decode_count (zero); random_seed; reproducibility_checksum;
       relation_corpus_complete_score (exact field consumed by Exp6888); gate_check_summary with
       failed check, expected value, and observed value for any blocked verdict; verifier_is_oracle
       (false); verdict_class (positive | circular_positive | null | blocked | disqualified |
       partial); honest_verdict (terminal and prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6887_three_family_relation_proposal_corpus.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp5786-sota-constraint-stream
      verdict: 'complete: sota_constraint_response_stream_collected_not_ready:parser_failure_threshold'
      addressed_by: 'This attempt uses a frozen source-anchored relation line protocol, closed predicates, exact span offsets, and a prequalified atom map instead of the free constraint-response parser.'
      retire_if_same_verdict: true
    - experiment_id: exp5923-sota-schema-supported-constraintir-ab
      verdict: 'retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates'
      addressed_by: 'This attempt uses no schema-constrained decoding or repair reprompt; it preserves raw relation proposals and defers semantic authority to a sealed independent reducer.'
      retire_if_same_verdict: true

- id: exp6888-independent-relation-qualification
  title: Independent held anchored relation qualification
  track: verification
  priority: critical
  agent_type: claude
  model: sonnet
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 240
  per_unit_rows: true
  milestone: 2026.09.603
  deliverable: results/experiment_6888_independent_relation_qualification.json
  gated_on:
    - upstream: exp6887-three-family-relation-proposal-corpus
      artifact_field: relation_corpus_complete_score
      op: '=='
      value: 1
  prompt: |
    CONTEXT:
    Exp6887 owns acquisition only. Exp5909 found no exact benefit from structured synthesis prompts,
    and Exp5923 retired schema-supported ConstraintIR repair. This task tests a different object:
    source-grounded relation proposals from rule, encoder, and three local GGUF arms. The held labels
    and exact solver are opened only in a fresh reducer. No proposal arm certifies itself.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md, V603 Planner Refresh
    - {project_root}/results/experiment_5909_sota_constraint_synthesis_ab.json
    - {project_root}/results/experiment_5923_sota_schema_supported_constraintir_ab.json
    - {project_root}/results/experiment_6274_asp_energy_semantic_compiler.json
    - {project_root}/results/experiment_6886_enoki_exact_relation_fixture.json
    - {project_root}/results/experiment_6887_three_family_relation_proposal_corpus.json
    - {project_root}/python/carnot/asp_energy_semantic_compiler.py
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/constraint-verification/spec.md

    TASK:
    In a fresh process, open the sealed held sidecar and independently score every proposal arm.
    Recompute source-span grounding, tuple precision and recall, abstention, ASP compilation, exact
    answer-set parity, contradiction detection, and perturbation robustness. Preserve every null and
    failed family cell. Do not run new model inference or repair an output.

    CONCRETE STEPS:
    0. PRECONDITIONS: require `relation_corpus_complete_score=1`, exact artifact hashes, complete raw
       rows, sealed held labels, the qualified compiler, and an independent ASP solver. On failure,
       write complete_blocked_independent_relation_qualification with gate_check_summary.
    1. Add REQ-VERIFY-6888 and tests first. Cover artifact drift, held leakage, missing cells,
       offset mismatch, duplicate credit, abstention denominators, unsupported atoms, solver timeout,
       family pooling, arm identity, and aggregate-versus-row disagreement.
    2. Freeze acceptance thresholds from calibration only: minimum span F1, tuple precision and
       recall, parse coverage, family floor, perturbation floor, and exact semantic parity.
    3. Open the held sidecar once in a fresh reducer. Match rows by frozen record and arm IDs. Reject
       any prompt or raw artifact that contains a held label, answer set, or solver receipt.
    4. Emit one row per arm, record, relation, family, and perturbation. Keep false positives, false
       negatives, malformed output, abstention, timeout, and no-headroom cases explicit.
    5. Independently compile accepted tuples and compare zero-energy states with exact answer sets.
       Report proposal quality separately from exact semantic validity.
    6. Set `relation_qualification_ready_score=1` only when at least one proposal arm passes all
       frozen held thresholds. Count its exact-admitted future events in
       `qualified_relation_event_count`; require at least 90 only in the downstream gate.
    7. Because the exact verifier is oracle authority, use `verdict_class=circular_positive` for a
       pass. Never use `positive` in this task.
    8. Run focused tests, Ruff, OpenSpec coverage, E2E-006, independent solver parity, adversarial
       verification, artifact-convention audit, verdict-row consistency lint, and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one principle per required field and every
       gate field; preconditions_checked; inference_substrate
       (sealed_reduction_of_frozen_relation_outputs_no_llm); duration_s; source_artifact_hashes;
       sealed_sidecar_hashes; frozen_thresholds; rows (one arm, record, relation, family, and
       perturbation); span_metric_rows; tuple_metric_rows; parse_coverage_rows; abstention_rows;
       family_rows; perturbation_rows; asp_compilation_rows; solver_parity_rows;
       reported_vs_recomputed_metrics; independent_solver_receipts; held_leakage_count (zero);
       eligible_arm_rows; qualified_relation_event_count (exact field consumed by Exp6889);
       relation_qualification_ready_score (exact field consumed by Exp6889); random_seed;
       reproducibility_checksum; gate_check_summary with failed check, expected value, and observed
       value for any blocked verdict; verifier_is_oracle (true); verdict_class (circular_positive |
       null | blocked | disqualified | partial; never positive); honest_verdict (terminal and
       prefixed complete_).

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_6888_independent_relation_qualification.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
  prior_failures:
    - experiment_id: exp5909-sota-constraint-synthesis-ab
      verdict: 'complete_null: structured prompt arms did not improve exact synthesis'
      addressed_by: 'This task evaluates source-grounded relation extraction from raw frozen outputs with span evidence and exact atom compilation, not structured-prompt answer synthesis.'
      retire_if_same_verdict: true
    - experiment_id: exp5923-sota-schema-supported-constraintir-ab
      verdict: 'retired: schema-supported ConstraintIR decoding failed exact-semantic retirement gates'
      addressed_by: 'The reducer performs no schema-guided generation or repair and uses an independent held exact solver after acquisition has frozen.'
      retire_if_same_verdict: true
