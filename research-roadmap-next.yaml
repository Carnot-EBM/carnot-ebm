  - id: exp2887
    milestone: "2026.05.273"
    deliverable: "results/experiment_2887_fr11_fast_slow_memory_corrigendum_v2.json"
    title: "FR-11 Fast/Slow Memory Corrigendum v2"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 50
    estimated_wall_time_min: 75
    track: self-learning
    prior_failures:
      - experiment_id: exp2882
        verdict: "complete: RecMem-triggered replay matched eager replay with lower token cost and no forgetting, but capstone flagged it for zero correctness/AUROC deltas, zero forgetting, and implausibly short runtime"
        addressed_by: "This task adds a Memini-style fast/slow memory comparator, non-tautological eager-vs-triggered metrics, duration/provenance gates, and explicit drift/forgetting checks."
        retire_if_same_verdict: true
      - experiment_id: exp2869
        verdict: "complete: offline verifier-feedback replay lowered energy with no forgetting, but correctness_delta=0.0 and n_examples=9"
        addressed_by: "The rerun uses at least the .272 50-example replay set and compares three memory policies instead of reporting energy-only replay."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        FR-11 continuous self-learning is central to the PRD. `.272` proved a
        clean RecMem trigger, but the scale-up artifact was flagged. The new
        Memini paper suggests a fast/slow external-memory comparator: fast
        episodic associations, slow consolidated edges, and selective forgetting.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - CODEX.md
        - research-program.md
        - research-references.md
        - results/experiment_2869_fr11_continuous_self_learning_replay_v3.json
        - results/experiment_2881_fr11_recmem_recurrence_trigger_v1.json
        - results/experiment_2882_fr11_recmem_replay_scaleup_v1.json
        - python/carnot/eval/fr11_recmem_recurrence_trigger_v1.py
        - python/carnot/eval/fr11_recmem_replay_scaleup_v1.py
        - python/carnot/memory/
        - python/carnot/pipeline/
        - tests/python/test_experiment_2881_fr11_recmem_recurrence_trigger_v1.py
        - tests/python/test_experiment_2882_fr11_recmem_replay_scaleup_v1.py

      TASK:
        Implement and evaluate a bounded FR-11 fast/slow memory corrigendum.
        Compare eager replay, RecMem recurrence-triggered replay, and a
        Memini-style fast/slow memory baseline using identical local examples.
        This is the mandatory continuous self-learning task for milestone
        2026.05.273.

      CONCRETE STEPS:
        1. cd {project_root}
        2. Confirm the relevant OpenSpec capability spec exists before editing
           memory or pipeline implementation code.
        3. Load Exp 2869, Exp 2881, and Exp 2882. Identify exactly why Exp 2882
           was flagged by the capstone.
        4. Select a local labeled replay set, target at least 50 examples, and
           record checksums. If fewer examples are available, record why.
        5. Run three policies with identical examples and seeds: eager replay,
           RecMem-triggered replay, and fast/slow memory dynamics. Do not mutate
           model weights and do not call a live LLM.
        6. Measure energy_delta_mean, correctness_delta, auroc_delta where
           valid, token_reduction_pct, duplicate_rate, contradiction_rate,
           memory_drift_score, and forgetting_regression_count.
        7. Add focused tests for the fast/slow update rule and metric
           separation.
        8. Write the deliverable JSON. Set fr11_scaleup_clean=true only if the
           metrics are non-tautological and adversarially clean.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: str
        - continuous_self_learning_task: true
        - fr11_scaleup_clean: bool
        - source_artifacts: list
        - n_examples: int
        - target_examples_met: bool
        - policies_compared: list
        - energy_delta_by_policy: dict
        - correctness_delta_by_policy: dict
        - auroc_delta_by_policy: dict
        - token_reduction_by_policy: dict
        - memory_drift_by_policy: dict
        - duplicate_rate_by_policy: dict
        - contradiction_rate_by_policy: dict
        - forgetting_regression_count_by_policy: dict
        - best_policy: str
        - model_weights_mutated: false
        - live_llm_called: false
        - random_seed: int
        - reproducibility_checksum: str
        - tests_run: list
        - field_principles: dict
        - run_date: "{date}"
        - duration_s: float

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

