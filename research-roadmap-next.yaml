      Required deliverable: {project_root}/results/experiment_6558_arc_live_redirect_ledger_reachability.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state lets no-firing and missing-receipt outcomes satisfy the standing ARC slot honestly."
        honest_verdict:
          principle: "The verdict must state live reachability, firing support, and policy disposition with a terminal prefix."
        verdict_class:
