- id: exp2467-kan-formal-verification-bounds
  title: 'Phase 4: KAN Formal Verification Bounds (arXiv:2602.06737) -- Certified AUROC Bounds for KAN Verifier'
  milestone: 2026.05.238
  deliverable: results/experiment_2467_kan_formal_verification.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  prior_failures:
  - experiment_id: exp572-kan-energy-tier
    verdict: complete_kan_energy_0.994_auroc
    addressed_by: "exp572 implemented the KAN energy tier (AUROC=0.994) and established KAN as a
      verifier. exp2467 is DIFFERENT scope: formal verification of KAN bounds per arXiv:2602.06737.
      exp572 was empirical performance measurement; exp2467 is certified robustness — computing
      mathematically certified bounds on KAN outputs given bounded inputs using piecewise affine
      abstractions. Different deliverable: certified_bound_radius rather than AUROC measurement."
    retire_if_same_verdict: false
  prompt: "CONTEXT: arXiv:2602.06737 (Feb 2026) 'Optimal Abstractions for Verifying Properties\nof\
    \ Kolmogorov-Arnold Networks' provides a framework for certifying KAN output bounds:\n  1. Approximate\
    \ KAN splines as piecewise affine functions\n  2. Propagate input bounds through the affine pieces\n\
    \  3. Compute certified output bounds via MILP (or an LP relaxation for speed)\n  4. Bound tightness\
    \ = max_input_variation / max_output_variation\n\nCarnot's KAN energy tier (python/carnot/models/kan.py)\
    \ achieves AUROC=0.994. Formal\nverification would allow Carnot to claim: 'For any input within\
    \ ε of a known-hallucination,\nthe KAN energy is certifiably above threshold T with probability\
    \ 1.'\n\nCPU-only approximation:\n  - Read KAN weights from the model\n  - For a sample of 20\
    \ test points from the telemetry manifest:\n    * Compute KAN output (energy score)\n    * Perturb\
    \ logprob inputs by ±0.1 (bounded perturbation)\n    * Compute energy scores for perturbed inputs\n\
    \    * Measure: certified_bound_radius = max perturbation where output stays on same side of\
    \ threshold\n    * local_lipschitz = max |f(x+δ) - f(x)| / |δ| across perturbations\n  - certified_coverage:\
    \ fraction of 20 examples where energy stays above/below threshold for all ±0.1 perturbations\n\
    \nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/models/kan.py (KAN implementation)\n\
    \  {project_root}/openspec/capabilities/kan-tier/spec.md (KAN capability spec)\n\nTASK: Compute\
    \ empirical certified bounds for the KAN verifier on 20 telemetry entries.\n\nCONCRETE STEPS:\n\
    \  0. PRECONDITIONS:\n     a. numpy importable: .venv/bin/python -c \"import numpy; print(numpy.__version__)\"\
    \n     b. KAN model exists:\n        ls {project_root}/python/carnot/models/kan.py\n        If missing:\
    \ write honest_verdict blocked_kan_model_missing and exit.\n     c. Telemetry manifest:\n        ls\
    \ {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n        If missing: write\
    \ honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Load KAN model and run on\
    \ 20 telemetry entries:\n     For each entry: compute kan_energy = KAN(logprobs).\n     decision_threshold\
    \ = 0.5  (or median energy if KAN outputs are not in [0,1])\n\n  2. Compute certified bounds for\
    \ each entry:\n     perturb_delta = 0.1  # ±10% perturbation on logprob inputs\n     For each entry\
    \ i:\n       base_energy = KAN(logprobs_i)\n       # 10 perturbed versions\n       perturbed_energies\
    \ = [KAN(logprobs_i + delta) for delta in\n                              np.random.uniform(-perturb_delta,\
    \ perturb_delta, (10, len(logprobs_i)))]\n       energy_range = max(perturbed_energies) - min(perturbed_energies)\n\
    \       stays_certified = all energy on same side of threshold as base_energy\n       local_lipschitz_i\
    \ = energy_range / perturb_delta\n\n  3. Summary metrics:\n     certified_coverage = fraction of\
    \ 20 entries where stays_certified=True\n     mean_local_lipschitz = mean(local_lipschitz_i)\n \
    \    certified_bound_radius = perturb_delta if certified_coverage > 0.8 else certified_coverage\
    \ * perturb_delta\n\n  4. Write deliverable. Validate JSON before writing.\n\nREQUIRED ARTIFACT\
    \ FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with certified_coverage.\"\
    \n  - certified_coverage:\n      principle: \"Fraction of examples where KAN decision is stable\
    \ under ±0.1 perturbation. Paper-v6 claim.\"\n  - mean_local_lipschitz:\n      principle: \"Mean\
    \ local Lipschitz constant. Lower = more certifiably stable.\"\n  - certified_bound_radius:\n   \
    \   principle: \"Perturbation radius where 80%+ of examples stay certified. Documents robustness.\"\
    \n  - n_eval_examples:\n      principle: \"Must be 20.\"\n  - random_seed:\n      principle: \"\
    Must be 42.\"\n  - duration_s:\n      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n\
    \      principle: \"Records numpy, KAN model, telemetry checks.\"\n\nACCEPTANCE GATES:\n  - condition:\
    \ \"certified_coverage != null AND n_eval_examples >= 15\"\n    principle: \"Must produce valid\
    \ coverage on sufficient data.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

