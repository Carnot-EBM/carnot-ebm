  - id: exp3125-prefix-closed-deterministic-verifier-bound-pilot
    milestone: "2026.05.291"
    deliverable: "results/experiment_3125_prefix_closed_deterministic_verifier_bound_pilot_v1.json"
    title: "Prefix-closed deterministic verifier bound pilot"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 60
    track: "verification"
    inference_substrate: "solver_bounds"
    requires_gpu: false
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp3124-difficulty-stratified-live-sota-verifier-panel-v6
        artifact_field: difficulty_stratified_live_sota_panel_v6_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3111-certified-coherence-z3-mcs-feedback-v3
        verdict: "complete: certified_coherence_feedback_v3_ready=true; certificate_count=72; unsat_core_count=40; formal_feedback_delta=-0.333333"
        addressed_by: "Changes from certificate localization to BEAVER-style prefix-closed probability/coverage bounds over bounded fixtures."
        retire_if_same_verdict: true
      - experiment_id: exp2858-prefix-bound-epr-proxy
        verdict: "complete: bounded_prefix_epr_proxy_ready=true; proxy_only=true"
        addressed_by: "Uses exact fixture semantics and concrete frontier accounting instead of a proxy-only bound."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. BEAVER shows that prefix-closed semantic constraints can support deterministic probability bounds. Carnot needs a bounded local pilot before using such bounds in verifier or repair claims.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-references.md
      - results/experiment_3111_certified_coherence_z3_mcs_feedback_v3.json
      - results/experiment_3124_difficulty_stratified_live_sota_verifier_panel_v6.json
      - python/carnot/verify if present
      - tests if verifier tests exist

      TASK
      Implement or script a small prefix-closed deterministic verifier bound pilot over exact constraints. Report explored frontier, bound width, and semantic coverage; do not claim full LLM correctness beyond the explored frontier.

      CONCRETE STEPS
      1. Select a small exact fixture subset with prefix-closed semantic constraints, such as JSON-like answer shape, bounded code-fragment invariants, or simple logic constraints.
      2. Build a deterministic token/prefix frontier abstraction or equivalent bounded enumeration with exact semantic checks.
      3. Measure lower/upper satisfaction bounds, frontier size, pruned-prefix count, explored mass if probabilities are available, and coverage limitations.
      4. Add deterministic tests for prefix acceptance/rejection, monotonicity of prefix-closed constraints, and bound aggregation.
      5. Write the artifact with no live-model headline claim.

      REQUIRED ARTIFACT FIELDS:
      - prefix_closed_bound_pilot_ready: bool (principle: downstream repair must know whether deterministic bounds exist)
      - constraint_families: list (principle: semantic scope must be explicit)
      - fixture_count: int (principle: scale must be reported)
      - explored_prefix_count: int (principle: bound evidence depends on explored frontier)
      - pruned_prefix_count: int (principle: verifier work must be auditable)
      - lower_bound: float (principle: probability/risk bounds must expose lower side)
      - upper_bound: float (principle: probability/risk bounds must expose upper side)
      - bound_width: float (principle: loose bounds must not be overclaimed)
      - semantic_coverage: dict (principle: syntax and semantic coverage differ)
      - limitations: list (principle: bounded pilots must declare what they do not prove)
      - tests_run: list (principle: verifier implementation must be checked)
      - source_artifacts: list (principle: claims must trace to concrete files)
      - inference_substrate: dict (principle: no live inference should be implicit)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

