milestone_doc: openspec/change-proposals/research-roadmap-v403.md
milestone_overview: |
  .402 left a sharp, honest scorecard: the in-generation oracle-distinct verifier-moat is PROVEN (leak-robust,
  replicated, .401) but its UTILITY is UNTESTED -- the .402 S3 conversion instrument failed as a HARNESS (it framed
  the arms as MCQ selection, so the controls collapsed and adversarial_verify fired TAUTOLOGY). .403 takes the
  natural next DEPTH step on each axis (north-star Depth-Over-Breadth):

    PHASE 0 -- TRANSITION: exp4358 archive .402 -> activate .403; record the TRUE .402 close-state.

    PHASE A -- HEADLINE (convert the proven moat into a generation GAIN, FIXED harness):
      A1 (exp4359) Prism-hardened verifier-guided DENOISING SEARCH (arXiv:2602.01842): a REAL token-by-token
        denoising-generation loop (NOT MCQ selection -- the .402 bug), Hierarchical Trajectory Search + local
        branching with partial remasking, the .401 leak-robust scorer (exp4337 .pkl) as the EXTERNAL in-loop guide,
        at FIXED NFE vs DIFFERENTIATED controls: unguided, best-of-N@matched-NFE, and Prism intrinsic Self-Verified
        Feedback / self-reward SMC (the sharpest oracle-distinct must-beat). With the no-op DEGENERATE_CONTROLS guard,
        a metric-TAUTOLOGY guard, an independent scorer leak re-check, branch-diversity receipts, and
        scorer-disagreement rows. Emit s3_guided_beats_control BARE bool, n>=80, >=3 seeds. verifier_is_oracle=false.
      A2 (exp4360, GATED on A1 s3_guided_beats_control==true) PAPO reward-state-alignment diagnostic
        (arXiv:2606.08501): skeptic-proof a win -- is it from rewards aligned to AUTHENTIC denoising states (not
        remasking/position artifacts)? The operator was twice-burned on DiffusionGemma over-claims.

    PHASE B -- ARC NORTH STAR (operator MANDATORY 2026-06-17; incremental +1..+n per game; verifier_is_oracle=true):
      B1 (exp4361) E3 DEEPER on the high-headroom cracked games: sc25 L2 (+4 upside toward its 5 live-recorded levels)
        + tu93 L4 + lp85 L5 + tn36 L8 via explore-verify-plan.
      B2 (exp4362) E3 the BLOCKED-mechanic next-levels: ar25 L2 (action7 undo-stack gap) + ka59 L2.
      B3 (exp4363) E3 the MECHANIC-LIMITED tails tr87 + ft09 (world-model accuracy ~0) with active-data collection
        (the M2-v4 disambiguation lever) on top of explore-verify-plan.

    PHASE C -- CONTINUOUS SELF-LEARNING (mandated; BUILD ON the .402 win; verifier_is_oracle=false):
      exp4364 deploy the learned action-cost heuristic into arc_solver_kit as the standing A* cost + PROVE it
        COMPOUNDS (held-out env-actions-to-solve vs solved-trace-corpus size), with an LLM-generated-heuristic
        stronger-arm probe (arXiv:2503.18809). NOT cross-game value transfer (RETIRED, exp4342).

    PHASE E -- INFRA + HYGIENE + CAPSTONE: exp4365 SOTA-ingestion -> .404; exp4366 registry/gaps hygiene + GAP-4
      regression guard; exp4367 hardware continuity (KV260 opportunistic); exp4368 capstone .403 + the headline
      decision (did Prism-hardened search convert the moat?) + ARC reproducible-total + G1-G4.

  HARD RULE (every task): the conductor stays STOOD-DOWN on TRM training -- NO task may launch TRM training, run
  pkill/kill against train.py, or WRITE results/trm_runs/. Qwen is FORBIDDEN as the TRAINED base (Spurious-Rewards
  confound); Qwen/Gemma GGUF as an off-policy JUDGE/GENERATOR is fine. SEPO + A2D2 (verifier-as-reward GENERATOR
  training, 2502.01384 / 2606.13565) are OUT-OF-BAND/operator-owned -- flagged in SOTA-ingestion, NOT auto-run
  in-loop; the .403 headline is a NO-TRAINING test-time search. Every LEARNED-verifier value task MUST declare
  verifier_is_oracle honestly (Circularity Discipline): an EXECUTABLE-oracle win (E3 solve) is execution_grounded
  (verifier_is_oracle=true, ARC progress, NOT a moat headline); the moat is the oracle-DISTINCT learned result with a
  matched control + CI95-excl-0. NO autonomous edits to docs/index.html / README / paper prose. Online ARC play stays
  operator-gated (NO leaderboard submission; only offline-reproduced levels count). DiffusionGemma MUST use the
  llama.cpp PR binary, NOT a standard GGUF loader (known-issues 2026-06-15). Cross-game value TRANSFER (exp4342) and
  cross-domain SELECTION (exp4314) are RETIRED -- do NOT re-propose either.

