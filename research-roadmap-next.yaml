        addressed_by: "exp2733 (.259) validated the ORCA-NEXUS integration end-to-end (FR-11 Tier 3+). This exp2747 has EXPANDED scope: FR-11 Tier 4 — does running MULTIPLE cycles of ORCA-NEXUS learning improve verifier accuracy? exp2733 ran one cycle; exp2747 runs 3 cycles and measures whether cycle N+1 is more accurate than cycle N. Different deliverable: learning_loop_closed=true if accuracy_cycle3 > accuracy_cycle1 (measurable improvement across cycles)."
