      5. Replay a deterministic stratified sample and every timeout, contradiction, or unusual-effort row through an independent Z3 construction. Compare exact outcomes and receipts.
      6. Audit planned versus terminal units, shard hashes, journal closure, resume receipts, fixture hash, and atomic finalization.
