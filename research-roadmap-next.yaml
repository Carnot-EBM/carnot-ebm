- id: exp793-manifest-full-scope-audit
  milestone: 2026.04.61
  deliverable: results/experiment_793_manifest_full_scope_audit.json
  title: 'Exp 793: Manifest Full-Scope Enforcement Audit (RETRO-MANIFEST-FULL-SCOPE)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Milestone .60 retro confirmed Exp 527 ran from unguarded queue for the 7th+
    post-retirement appearance. RETRO-MANIFEST-FULL-SCOPE is OPEN: the manifest exclusion
    check is only applied at the conductor managed path, not at ALL dequeue call sites in
    scripts/research_conductor.py. This experiment audits the conductor for unguarded dequeue
    sites and writes a structured patch spec as a JSON artifact so a human can apply the fix.
    We CANNOT modify scripts/research_conductor.py in experiment code — the patch spec documents
    exactly what must change and where.

    EXISTING CODE TO READ FIRST:
    - scripts/research_conductor.py — read (do NOT modify) to identify all dequeue call sites
    - results/operational_retro_2026_04_60.json — RETRO-MANIFEST-FULL-SCOPE details
    - results/manifest_fix_patch.txt — existing patch from Exp 731 (if present)
    - openspec/capabilities/pipeline/spec.md — look for existing REQ-INFRA entries

    TASK: Audit all dequeue sites in scripts/research_conductor.py, write a structured
    patch spec as results/experiment_793_manifest_full_scope_audit.json, and add spec
    requirements for manifest enforcement.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read scripts/research_conductor.py in full. Identify every location where a task is
       dequeued, popped, or selected for execution. For each site, note:
       a. Line number
       b. Code pattern (e.g., task_queue.pop(), next(tasks), random.choice(...))
       c. Whether ExclusionManifest.check() is called before dequeue
       d. Whether the dequeue is inside the managed conductor cycle or outside it
    3. Add to openspec/capabilities/pipeline/spec.md:
       - REQ-INFRA-057: ExclusionManifest.check() MUST be called at ALL dequeue sites
         in the research conductor before any experiment task is dispatched. A dequeue
         site is any location where a task_id is selected for execution from any queue
         or list data structure.
       - REQ-INFRA-058: When ExclusionManifest.check(task_id) returns True (excluded),
         the task MUST be logged at WARNING level with the reason and skipped without
         execution.
       - SCENARIO-INFRA-066: Conductor dequeues Exp 527 from unmanaged queue; manifest
         check fires; Exp 527 is skipped; conductor log shows EXCLUDED WARNING.
       - SCENARIO-INFRA-067: Conductor dequeues Exp 793 (not in manifest); manifest
         check passes; Exp 793 runs normally.
    4. Build audit artifact:
       a. Read the manifest file (results/manifest_excluded_experiments.json or similar).
       b. For each dequeue site found, create a patch_site record:
          {line_number, code_snippet, is_manifest_checked, patch_required,
           recommended_patch_code}
       c. Count: n_dequeue_sites_total, n_dequeue_sites_unguarded, n_dequeue_sites_guarded
       d. estimated_waste_min_per_milestone: n_unguarded_sites * avg_retired_exp_duration_min
    5. Create scripts/experiment_793_manifest_audit.py:
       a. ExperimentTemplate(793) + ExperimentTimeoutWatchdog(793, timeout_minutes=30).
       b. apply_env_autofix() FIRST.
       c. Read scripts/research_conductor.py as a text string.
       d. Scan for patterns: task_queue, .pop(), .popleft(), next(iter(...)),
          random.choice, queue.get(), for task in tasks.
       e. For each match, record {line_number, snippet, context_lines}.
       f. Check if "manifest" appears within 5 lines of the dequeue pattern.
       g. Build artifact with patch_sites list and summary fields.
       h. honest_verdict:
          - "all_dequeue_sites_guarded" if n_unguarded == 0
          - "N_unguarded_sites_found" where N = n_unguarded_sites
          - "conductor_not_readable" if research_conductor.py missing
    6. Write tests/python/test_experiment_793_manifest_audit.py with 100% coverage:
       - test scan finds dequeue patterns in synthetic conductor text
       - test guards detection correctly classifies guarded vs unguarded
       - test artifact fields are all present and typed correctly
       Each test traces to REQ-INFRA-057/058.
    7. Reconcile:
       - ops/changelog.md: one-line entry with honest_verdict.
       - ops/status.md: "Exp 793: Manifest full-scope audit. N unguarded sites found.
         Patch spec written to results/experiment_793_manifest_full_scope_audit.json."
    8. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

