      - rebuild_attempted: bool
      - rebuild_command_summary: list
      - rebuild_log_tail: list
      - torch_cuda_available_after: bool
      - llama_cpp_cuda_build_detected_after: bool
      - clean_subprocess_gpu_offload_probe_passed: bool
      - cpu_fallback_only: bool
      - cuda_receipt_ready: bool
      - clean_rerun_allowed_candidate: bool
      - blocker: string|null
      - conductor_file_modified: bool
      - active_roadmap_modified: bool
      - honest_verdict: string

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

