milestone: "2026.06.335"
milestone_title: "Make the FACTS row REAL — build a model-based NLI atomic-claim grounding verifier (Span-Level DeBERTa-NLI arXiv:2504.18639 / FinGround arXiv:2604.23588) and re-measure whether factual hallucination grounding generalizes, since .334 only tested it with a weak text-statistical proxy (AUROC 0.6495 < confidence 0.7446). Harden the now-defensible math+code cross-domain scope (replicate code on a second balanced corpus) and the second-pair-of-eyes product detector (fused AUROC 0.822 vs confidence 0.536). Diagnose the correlation-aware weighting paradox (.334 corr-aware 0.635 << Carnot 0.919) with proper dependency-aware weak supervision (arXiv:1903.05844). Retry the trained-EBM-judge OOD test with a real model substrate. Continue FR-11 self-learning + hardware continuity. paper_ready must stay TRUE (G1-G4); P0.1 stays honest-negative."
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md

# OUTER-LOOP / OPERATOR PRE-STAGED ROADMAP (2026-06-01, Claude Opus 4.8). RATIONALE:
# .334 FINALLY ran the cross-domain de-contamination science on codex (all 14 tasks landed real
# artifacts). It proved the .329 "math-only" was a CONTAMINATION ARTIFACT: verifier value generalizes to
# CODE (math->code PRM transfer, exp3641/3642) but NOT to FACTS -- HOWEVER the facts row used a
# text-statistical PROXY (AUROC 0.6495), not a real NLI model. The literature recipe (DeBERTa-NLI atomic
# decomposition, arXiv:2504.18639 / FinGround arXiv:2604.23588) was never tried. That is the #1 gap and
# the .335 centerpiece: make facts REAL. Also: harden code generalization (second corpus), build the
# deployable second-pair-of-eyes detector (exp3643 fused 0.822 vs confidence 0.536 is real product
# value), diagnose why correlation-aware weighting HURT (exp3644 -0.236) with dependency-aware weak
# supervision (arXiv:1903.05844), and retry the trained-judge OOD with a real substrate (exp3646 was
# CPU-only tiny and lost to confidence OOD). INVARIANTS: paper_ready=true (G1-G4 closed 2026-05-31; do
# NOT regress). P0.1 stays honest-negative (do NOT re-test Route-1/2; Depth-Over-Breadth retired). Every
# gated_on is a BARE scalar (feedback_gated_fields_must_be_bare). NO poison tests (.325/.326/.332
# cascade) -- parametrize over honest verdicts on realistic synthetic fixtures; never hard-assert one
# success string against a real corpus; never use Q\d+/R\d+/H\d+ placeholder tokens. BACKEND: gemini
# quota was exhausted through .333 (wipeout); .334 ran on codex+requires_codex successfully -- keep that
# routing (Gemini-Default requires_codex positive criterion #3) until exp3653 confirms gemini recovery.

