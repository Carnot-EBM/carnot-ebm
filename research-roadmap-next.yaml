        honest_verdict: {{principle: "terminal-prefixed; a measured no-generalize result is complete (negative-but-real), never partial:"}}
        inference_substrate: {{principle: "THE .410/.411 LESSON -- EMIT it; never None"}}
        tr87_resolved_generically: {{principle: "bare bool: tr87 re-solved by the GENERIC operator without tr87's own recipe -- the GAP-4432-LOO-TR87 closure, the core A2 hypothesis"}}
