      - schema_reachability_cases: principle: integer count of schema cases checked.
      - required_field_reachability_rate: principle: fraction of required fields reachable by the compiled/derived grammar.
      - completion_slack_min_tokens: principle: minimum estimated tokens needed to complete a valid JSON response across fixtures.
      - truncation_failure_count: principle: count of cases classified as truncation risks.
      - schema_failure_count: principle: count of cases classified as schema risks independent of truncation.
      - tool_action_token_reachability_rate: principle: fraction of tool/action markers reachable under the protocol fixture.
      - methodology_duration_s: principle: wall-clock duration for the preflight, not including planning prose.
      - tests_run: principle: list of commands run for changed code or an explicit no-code-change explanation.
      - active_roadmap_modified: principle: must be false.
      - conductor_modified: principle: must be false.
      - honest_verdict: principle: one-line summary of readiness or blocking reason.

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp5366-v489-live-grammar-budgeted-sota-protocol
    milestone: "2026.07.489"
    title: "Gated live grammar-budgeted SOTA structured protocol"
    priority: critical
    track: structured-sota
    deliverable: "results/experiment_5366_live_grammar_budgeted_sota_protocol_v489.json"
    requires_gpu: true
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    estimated_wall_time_min: 75
    gated_on:
      - upstream: exp5365-v489-grammar-budget-protocol-preflight
