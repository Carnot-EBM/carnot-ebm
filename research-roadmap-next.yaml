        addressed_by: "This task materializes explicit context-shortcut rows rather than only scheduling verification granularity."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The post-.296 research sweep identified Context-CoT and CL-Bench as a useful gap: models can ignore supplied context and rely on pretrained priors. You are working in {project_root} on {date}. This task builds exact fixture artifacts; it does not require GPU.

