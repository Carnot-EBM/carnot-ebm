milestone: "2026.05.302"
milestone_title: "CUDA-Recovered SOTA Receipt + v4 Teacher-Label Shard + Capstone"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
milestone_provenance: "Pre-staged 2026-05-28 by outer-loop session per CLAUDE.md Pre-Staged Roadmap Convention + Failed-Experiment Rerun Discipline. The .296-.301 CUDA chain (selected-Python smoke, llama.cpp receipt, SOTA GGUF receipt) failed repeatedly with cudaErrorUnknown(999) because the host CUDA stack was broken. Operator rebooted 2026-05-28; both RTX 3090s now enumerate and torch.cuda.is_available()=True. The .301 CUDA tasks (exp3247-3253) hit the 3-fail-skip threshold WHILE CUDA was broken and will not retry within .301. This pre-stage re-proposes the chain for .302 with prior_failures blocks documenting the now-fixed root cause — the canonical justified rerun (named prior failure + named root cause + named what is different)."

operator_override:
  authorization: "Operator directive 2026-05-28 (conversation: chose Option B): pre-stage .302 to re-run the CUDA chain now that the reboot recovered CUDA, since the .301 chain is skip-exhausted and will not self-retry."
  cuda_recovery_evidence:
    diagnosed_pre_reboot: "cudaErrorUnknown(999); torch.cuda.is_available()=False while nvidia-smi worked; only 1 of 2 RTX 3090s enumerated (GPU 1 off the PCIe bus); driver 595.71.05 version-consistent (kernel module == userspace == libcuda), so not a driver-reinstall issue — stale nvidia_uvm / GPU-off-bus signature."
    confirmed_post_reboot: "both RTX 3090s enumerate (index 0 and 1, 24576 MiB each); torch.cuda.is_available()=True; device_count()=2; both get_device_name() succeed."
  deferred_priorities:
    - slug: prompt_injection_kan_distill_v4_15k
      rationale: "The monolithic prompt_injection_kan_distill_v4_15k task (exp3222, .299) failed on the codex 10-min echo-bail and was superseded by the conductor's own split-run decomposition (teacher-label shard + train/eval shard). This .302 carries the shard approach forward (exp3264 teacher-label + exp3265 train/eval) gated on the recovered SOTA receipt. The monolith slug is intentionally not re-run; the shard slugs supersede it."
    - slug: verifier_ensemble_multi_axis_composition_v1
      rationale: "Depends on verifier-eval harness -> SOTA receipts -> CUDA. .302 re-establishes the SOTA receipt; this graduates to .303+ once receipts land."
    - slug: verifier_ensemble_multi_violation_degradation_curve_v1
      rationale: "Sibling of multi-axis composition; same dependency chain."
    - slug: gatemate_n16_flash_timing_smoke_v3
      rationale: "Operator-side hardware action (board reattach + flash)."
    - slug: aquaforte_beaver_pipeline_honest_substrate_corrigendum_v1
      rationale: "Paper-prep corrigendum; queued behind the CUDA-recovery critical path."
    - slug: kv260_mmd_vs_cpu_sequential_gibbs_v1
      rationale: "Operator-side KV260 board measurement prerequisite."
    - slug: gatemate_a1_n16_ising_tile_bitstream_build_v2
      rationale: "Operator-side gatemate toolchain action."

tasks:

  - id: exp3260-archive-v301-activate-v302
    milestone: "2026.05.302"
    deliverable: "results/experiment_3260_archive_v301_activate_v302.json"
    title: "Archive .301 closeout and activate .302 planning authority"
    priority: critical
    max_turns: 20
    estimated_wall_time_min: 10
    track: "ops"
    inference_substrate: "artifact_aggregation_only"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3246-archive-v300-activate-v301
        verdict: "complete: archive_v300_activate_v301_ready=true"
        addressed_by: "Standard recurring milestone-boundary handoff. The matched prior 'failures' are previous archive cycles, all of which completed successfully. Not a retry of a failure; the next iteration of the standard transition."
        retire_if_same_verdict: false
      - experiment_id: exp3219-archive-v297-activate-v298
        verdict: "complete: archive_v297_activate_v298_ready=true"
        addressed_by: "Same — standard operational task."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      Standard milestone-boundary handoff: archive .301's completed artifacts
      into research-complete.yaml and emit the .302 activation manifest.

      CONCRETE STEPS
      1. Read .301's capstone and operational retrospective.
      2. Append .301's task summary to research-complete.yaml.
      3. Emit the activation manifest artifact.

      REQUIRED ARTIFACT FIELDS:
      - archive_v301_activate_v302_ready: bool (principle: milestone handoff must be machine-readable)
      - prior_paper_ready: bool (principle: carry the .301 publication-readiness signal)
      - prior_publication_blocker_count: int (principle: track blocker count over time)
      - random_seed: int
      - reproducibility_checksum: str
      - duration_s: float
      - honest_verdict: str (principle: must start with complete:/complete_/success:/success_/passed:/passed_/shipped_)

  - id: exp3261-cuda-recovery-confirmation-smoke-v1
    milestone: "2026.05.302"
    deliverable: "results/experiment_3261_cuda_recovery_confirmation_smoke_v1.json"
    title: "CUDA recovery confirmation smoke — post-reboot GPU verification"
    priority: critical
    max_turns: 30
    estimated_wall_time_min: 15
    track: "hardware"
    inference_substrate: "hardware_smoke"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3247-selected-python-cuda-root-cause-surgery-v1
        verdict: "complete: root-cause-surgery ledger; cuda_receipt_ready_candidate=false (CUDA broken pre-reboot)"
        addressed_by: "Prior CUDA-chain root-cause work ran while the host CUDA stack was broken (cudaErrorUnknown 999, GPU 1 off the bus). Operator rebooted 2026-05-28; both RTX 3090s now enumerate and torch.cuda.is_available()=True. The root cause this surgery was diagnosing is now resolved at the system level; this task confirms recovery rather than re-diagnosing."
        retire_if_same_verdict: true
      - experiment_id: exp3248-isolated-cuda-selected-python-smoke-v2
        verdict: "gate_block / retired: cuda_python_smoke_passed=false while CUDA broken"
        addressed_by: "Same root cause (broken CUDA stack) now fixed by reboot. This smoke re-runs the selected-Python CUDA check that previously could not pass because the GPU stack was down."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      The operator rebooted 2026-05-28 to recover the CUDA stack. Pre-reboot:
      cudaErrorUnknown(999), torch.cuda.is_available()=False, only 1 of 2 RTX
      3090s enumerated. Post-reboot: both 3090s enumerate, is_available()=True.
      This task confirms CUDA works end-to-end in the selected Python before
      the chain proceeds.

      PRECONDITIONS
      0. Check BEFORE proceeding:
         a. nvidia-smi enumerates >= 1 RTX 3090. If not, blocked_no_gpu.
         b. python -c "import torch; assert torch.cuda.is_available()" exit 0.
            If not, blocked_cuda_unavailable.

      CONCRETE STEPS
      1. Record nvidia-smi device list + driver version.
      2. In the selected Python (the conductor venv), run a real GPU op:
         allocate a tensor on cuda:0, do a matmul, copy back, verify result.
      3. If 2 GPUs present, repeat on cuda:1.
      4. Emit next_smoke_allowed and cuda_python_smoke_passed.

      REQUIRED ARTIFACT FIELDS:
      - cuda_recovery_confirmation_smoke_v1_ready: bool
      - next_smoke_allowed: bool (principle: gates the downstream llama.cpp receipt smoke)
      - cuda_python_smoke_passed: bool (principle: confirms a real GPU op succeeded, not just is_available())
      - gpu_count: int
      - gpu_names: list
      - driver_version: str
      - matmul_verified: bool
      - random_seed: int
      - reproducibility_checksum: str
      - duration_s: float
      - honest_verdict: str (principle: complete:/success:/passed:/shipped_ prefix)

  - id: exp3262-llama-cpp-cuda-receipt-smoke-v4
    milestone: "2026.05.302"
    deliverable: "results/experiment_3262_llama_cpp_cuda_receipt_smoke_v4.json"
    title: "llama.cpp CUDA receipt smoke v4 gated on CUDA recovery"
    priority: critical
    max_turns: 40
    estimated_wall_time_min: 40
    track: "evidence"
    inference_substrate: "live_llm_inference"
    requires_gpu: true
    gate:
      - upstream: "exp3261-cuda-recovery-confirmation-smoke-v1"
        artifact_field: "cuda_python_smoke_passed"
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3249-llama-cpp-cuda-receipt-smoke-v3
        verdict: "gate_block / retired: llama_cpp_cuda_receipt_ready=false while CUDA broken"
        addressed_by: "exp3249 could not produce a llama.cpp CUDA receipt because the host CUDA stack was down (cudaErrorUnknown 999). Reboot 2026-05-28 recovered both 3090s; this v4 re-runs the llama.cpp CUDA offload smoke now that GPU inference works. Gated on exp3261 confirming the selected-Python CUDA op passed first."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      Gated on exp3261 confirming CUDA recovery. Load a small GGUF via
      llama.cpp with CUDA offload and confirm a real generation completes
      on the GPU.

      PRECONDITIONS
      0. Read exp3261. If cuda_python_smoke_passed != true, write a complete
         gated-skip artifact with llama_cpp_cuda_receipt_ready=false.
      1. Confirm llama.cpp is built with CUDA (LLAMA_CUDA / ggml-cuda) and a
         small GGUF is cached. If not, blocked_llama_cpp_cuda_missing.

      CONCRETE STEPS
      1. Load a small cached GGUF with n_gpu_layers > 0.
      2. Run a short generation; confirm GPU memory was used (nvidia-smi
         memory.used > baseline during the call) and output is non-empty.
      3. Emit llama_cpp_cuda_receipt_ready + gpu_layers_offloaded + tokens.

      REQUIRED ARTIFACT FIELDS:
      - llama_cpp_cuda_receipt_smoke_v4_ready: bool
      - llama_cpp_cuda_receipt_ready: bool (principle: gates the SOTA receipt)
      - gpu_layers_offloaded: int
      - gpu_mem_used_during_call_mib: int (principle: proves real GPU offload, not CPU fallback)
      - tokens_generated: int
      - model_specs: dict
      - random_seed: int
      - reproducibility_checksum: str
      - duration_s: float
      - honest_verdict: str (principle: complete:/success:/passed:/shipped_ prefix)

  - id: exp3263-sota-gguf-receipt-v9
    milestone: "2026.05.302"
    deliverable: "results/experiment_3263_sota_gguf_receipt_v9.json"
    title: "Mandated SOTA GGUF receipt v9 gated on llama.cpp CUDA recovery"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 60
    track: "evidence"
    inference_substrate: "live_llm_inference"
    requires_gpu: true
    gate:
      - upstream: "exp3262-llama-cpp-cuda-receipt-smoke-v4"
        artifact_field: "llama_cpp_cuda_receipt_ready"
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3250-sota-gguf-receipt-v8
        verdict: "gate_block / retired: sota_gguf_receipt_ready=false while CUDA broken (the .296-.301 master blocker)"
        addressed_by: "exp3250 (and v5/v6/v7 before it) could not load the mandated SOTA GGUFs because CUDA was down. This is the master blocker of the .296-.301 window. Reboot 2026-05-28 recovered CUDA; v9 generates the real receipt for the three mandated GGUFs now that GPU inference works. Gated on exp3262's llama.cpp CUDA receipt."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      Generate the mandated SOTA GGUF receipt for the three flagship models
      now that CUDA works. This receipt is the upstream the entire frozen
      critical path (.296-.301) was blocked on.

      MODEL_SPECS (mandated, at least one as headline):
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF

      PRECONDITIONS
      0. Read exp3262. If llama_cpp_cuda_receipt_ready != true, write a
         complete gated-skip with sota_gguf_receipt_ready=false.
      1. Confirm at least one mandated GGUF is cached. If none, write
         blocked_sota_gguf_not_cached with the missing model IDs.

      CONCRETE STEPS
      1. For each cached mandated GGUF, load with CUDA offload and run a
         short verification generation.
      2. Record model-load evidence, GPU memory used, tokens, durations.
      3. Emit sota_gguf_receipt_ready + per-model receipts.

      REQUIRED ARTIFACT FIELDS:
      - sota_gguf_receipt_v9_ready: bool
      - sota_gguf_receipt_ready: bool (principle: gates the v4 teacher-label shard)
      - model_specs: dict (principle: mandated SOTA models must be named)
      - per_model_receipts: list (principle: each model's load + gen evidence)
      - gpu_mem_used_mib: int
      - random_seed: int
      - reproducibility_checksum: str
      - duration_s: float
      - honest_verdict: str (principle: complete:/success:/passed:/shipped_ prefix)

  - id: exp3264-prompt-injection-teacher-label-shard-v3
    milestone: "2026.05.302"
    deliverable: "results/experiment_3264_prompt_injection_teacher_label_shard_v3.json"
    title: "Prompt-injection v4 teacher-label shard v3 gated on SOTA receipt"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 60
    track: "evidence"
    inference_substrate: "live_llm_inference"
    requires_gpu: true
    gate:
      - upstream: "exp3263-sota-gguf-receipt-v9"
        artifact_field: "sota_gguf_receipt_ready"
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3252-prompt-injection-teacher-label-shard-v2
        verdict: "gate_block / retired: upstream SOTA receipt (exp3250) retired while CUDA broken"
        addressed_by: "exp3252 could never run because its upstream SOTA receipt was CUDA-blocked. This v3 is gated on the recovered exp3263 SOTA receipt v9. The split-run shard approach itself is unchanged; only the upstream CUDA dependency is now satisfiable."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      Teacher-label shard for the v4 prompt-injection KAN, using
      gpt-oss-safeguard-20b (or the mandated SOTA receipt model) now that
      CUDA works. This is the split-run successor to the failed v4 monolith.

      PRECONDITIONS
      0. Read exp3263. If sota_gguf_receipt_ready != true, write a complete
         gated-skip with teacher_label_shard_ready=false.
      1. Confirm the constraint-tax manifest (exp3251) is present.

      CONCRETE STEPS
      1. Label one corpus shard (~2-3k examples) with the teacher model.
      2. Record per-example labels + label provenance.
      3. Emit teacher_label_shard_ready + shard size + label counts.

      REQUIRED ARTIFACT FIELDS:
      - teacher_label_shard_v3_ready: bool
      - teacher_label_shard_ready: bool (principle: gates the train/eval shard)
      - shard_size: int
      - label_counts: dict
      - model_specs: dict
      - random_seed: int
      - reproducibility_checksum: str
      - duration_s: float
      - honest_verdict: str (principle: complete:/success:/passed:/shipped_ prefix)

  - id: exp3265-prompt-injection-kan-train-eval-shard-v3
    milestone: "2026.05.302"
    deliverable: "results/experiment_3265_prompt_injection_kan_train_eval_shard_v3.json"
    title: "Prompt-injection KAN train/eval shard v3 gated on teacher-label shard"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 45
    track: "evidence"
    inference_substrate: "verifier_ensemble_against_cached_candidates"
    requires_gpu: true
    gate:
      - upstream: "exp3264-prompt-injection-teacher-label-shard-v3"
        artifact_field: "teacher_label_shard_ready"
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3253-prompt-injection-kan-train-eval-shard-v2
        verdict: "gate_block / retired: upstream teacher-label shard retired while CUDA broken"
        addressed_by: "exp3253 could never run because its upstream teacher-label shard was CUDA-blocked. This v3 is gated on the recovered exp3264 shard. Trains the 16-knot KAN on the labeled shard and reports AUROC with the non-headline guardrail (single-shard result is not a replacement-grade claim; that needs the full 15k corpus across shards)."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      Train + eval the v4 KAN on the labeled shard from exp3264. Non-headline
      guardrail: a single-shard AUROC is a viability check, NOT the
      replacement-grade claim (which requires the full multi-shard 15k corpus
      + DeLong non-inferiority + Garak, per the original v4 acceptance gates).

      PRECONDITIONS
      0. Read exp3264. If teacher_label_shard_ready != true, write a complete
         gated-skip with kan_train_eval_shard_ready=false.

      CONCRETE STEPS
      1. Train a 16-knot KAN on the labeled shard.
      2. Eval on a held-out slice; report shard AUROC.
      3. Emit kan_train_eval_shard_ready + shard_auroc + non_headline_note.

      REQUIRED ARTIFACT FIELDS:
      - kan_train_eval_shard_v3_ready: bool
      - shard_auroc: float
      - non_headline_note: str (principle: single-shard result is not replacement-grade)
      - n_train: int
      - n_eval: int
      - random_seed: int
      - reproducibility_checksum: str
      - duration_s: float
      - honest_verdict: str (principle: complete:/success:/passed:/shipped_ prefix)

  - id: exp3266-capstone-v302
    milestone: "2026.05.302"
    deliverable: "results/experiment_3266_capstone_v302.json"
    title: "Capstone .302 — CUDA recovery + SOTA receipt + v4 shard readout"
    priority: critical
    max_turns: 30
    estimated_wall_time_min: 15
    track: "ops"
    inference_substrate: "aggregation_from_upstream_artifacts"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3258-capstone-v301
        verdict: "complete: capstone_v301_ready=true"
        addressed_by: "Standard recurring milestone-close rollup. The matched prior 'failures' are previous capstones, all completed successfully. Next iteration of the standard close, not a retry."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}.
      Aggregate .302 results. The headline question: did CUDA recovery unblock
