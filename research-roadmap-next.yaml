  - id: exp2322-archive-and-activate
    title: "Phase 0: Archive .227 and activate .228"
    milestone: "2026.05.228"
    deliverable: "results/experiment_2322_archive.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 20
    prior_failures:
      - experiment_id: exp2308-archive-and-activate
        verdict: "complete: archive_ready"
        addressed_by: "exp2308 succeeded in .227. This is a fresh archive task for .227→.228 transition. Precondition corrected: check for milestone '2026.05.227', which is what research-roadmap.yaml now contains."
    prompt: |
      CONTEXT: Milestone 2026.05.227 has completed. We must archive it and activate 2026.05.228.
      Key .227 finding: exp2309 (pre-test fix) fixed 2 named tests but timed out before clearing
      the full suite — 3 more pre-existing failures remain. All 10 Phase 1-3 tasks gate-blocked.
      EXISTING CODE TO READ FIRST: {project_root}/research-complete.yaml, {project_root}/research-roadmap.yaml
      TASK: Archive 2026.05.227 to research-complete.yaml and initialize the .228 milestone.
      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. Verify {project_root}/research-roadmap.yaml exists and contains milestone: "2026.05.227".
              If the file is missing or does NOT contain "2026.05.227", write honest_verdict
