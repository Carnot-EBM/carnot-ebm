    deliverable: results/experiment_4381_biprm_detector_localization_abstention.json
    prompt: |
      CONTEXT: north-star §0 (the oracle-distinct frontier is THE open claim) + §5 (the verifier is Carnot's entire
      value-add) + the verifier-as-detector spec (docs/research-notes/verifier-as-detector-measurement-spec.md: detection
      AUROC + precision@recall + the abstention curve). .404 closed the EFFICIENCY vehicle (settled) and the in-generation
      vehicle (retired); DETECTION is the ONE alive oracle-distinct vehicle (exp4375 AUROC 0.918). The .405 headline makes
      it ACTIONABLE per the SOTA-ingestion flagged_for_v405: arXiv:2508.01682 (BiPRM) -- a bidirectional L2R/R2L process
      reward model that LOCALIZES the earliest step-error better than a unidirectional pass; plus the selective-prediction
      operating point. Cheap, cached, CPU -- deliberately NOT hostage to GPU/GGUF/PR-binary infra (which blocked the
      retired in-generation path 4x).

      EXISTING CODE TO READ FIRST:
        - results/experiment_4375_verifier_as_detector_measurement.json (the .404 detector WIN: AUROC 0.918, selection_headroom=0.0, the cached FoVer corpus + the verifier ensemble it scored, verifier_is_oracle=false) + its experiment script
        - docs/research-notes/verifier-as-detector-measurement-spec.md (THE SPEC -- detection AUROC, precision@recall, the accuracy-vs-coverage abstention curve, the positive/negative controls, the degenerate-detector trap)
        - results/experiment_2850_fover_dual_condition_integrity_v4.json (the FoVer step-error corpus + the per-step error labels for localization) + ops/verifier_registry.yaml (the verifier ensemble) + python/carnot/verify/ (the verifier implementations: fr11_session_memory, tier0r_curry_howard, tier0s_arithmetic_gap, tier0u_logical_consistency)
        - research-references.md (.405 sweep: arXiv:2508.01682 BiPRM bidirectional process reward / step-error localization) + results/experiment_4376_sota_ingestion_v405.json (the BiPRM mapping + the R2L-future-context failure mode)
        - scripts/experiment_template.py, scripts/adversarial_verify.py (FALSE_NEGATIVE_RISK aware), scripts/summarize_artifact.py
        - CLAUDE.md "Circularity / Oracle-Distinctness Discipline", "Adversarial Artifact Verification + Sample-Size Rigor", "Missing-Verifier Gap Logging", "Reading-Results Discipline", "Inference-Substrate Declaration"

      TASK: run bidirectional (L2R + R2L) step-error localization over the cached step-labeled FoVer corpus, fuse, measure first-error localization vs a unidirectional L2R baseline; report the selective-prediction abstention operating point; keep the online-causal number separate from the offline-bidirectional one.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any scoring):
           a. The cached step-labeled FoVer corpus + the verifier ensemble load (the exp4375 corpus + ensemble). If absent -> honest_verdict `blocked_cached_step_labeled_corpus_unavailable` and STOP.
           b. The corpus carries per-STEP error labels (a first-error step index per trace), not just a trace-level is_correct -- localization needs step positions. If the corpus has only trace-level labels, derive the first-error step from the step labels; if NO step labels exist -> honest_verdict `blocked_no_step_labels_for_localization` and STOP.
           c. Conductor stood-down on TRM training; this is verifier SCORING against cached candidates, NOT training.
           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate.
        1. LOCALIZATION (BiPRM, 2508.01682): for each trace, score every step L2R (causal, prefix-only) AND R2L (suffix-aware); FUSE (e.g. min / mean / learned weight) into a bidirectional per-step error score. The predicted first-error step = argmax error-score (or first step above threshold). Measure first-error localization accuracy/F1 for (a) the unidirectional L2R baseline and (b) the bidirectional fusion. n>=1000 traces (sample-size rigor); bootstrap CI95 (>=2000 resamples) on the localization delta.
        2. ABSTENTION (selective prediction): from the detection score (trace-level = the most-suspicious step score, or the BiPRM aggregate), report the accuracy-vs-coverage / risk-coverage curve (reject the lowest-scored k%, plot retained-accuracy vs coverage), precision@recall=0.9, and the selective risk at a useful coverage. Report the base rate (fraction correct) + a random-score AUROC~0.5 control (the spec's positive/negative control).
        3. ONLINE-ACTOR HONESTY: the R2L pass uses FUTURE context unavailable to an in-loop actor. Report the bidirectional localization as an OFFLINE post-hoc detector, and the CAUSAL/L2R-only localization as the online-actionable number, in SEPARATE fields. Never claim the bidirectional number is online-achievable.
        4. Emit detector_localization_actionable BARE bool := (bidirectional first-error localization > unidirectional L2R with the delta CI95 excluding 0 AND the risk-coverage curve yields a useful selective operating point, e.g. retained-accuracy rises meaningfully at >=50% coverage). Log any error CLASS the detector cannot localize as a missing-verifier gap (ops/verifier_gaps.md). Run adversarial_verify.py (clean; FALSE_NEGATIVE_RISK -- a null with the unidirectional baseline as the positive control is informative). Declare random_seed/random_seeds_used + reproducibility_checksum + model_specs (the verifier ensemble + the corpus + n + the fusion method).
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A win (bidirectional fusion localizes the earliest error better than unidirectional AND the detection score enables a useful abstention operating point -- the detector graduates 'beats chance'->'actionable') and a CLEAN null (unidirectional is already as good / abstention gives no useful point) are BOTH decision-grade."
        detector_localization_actionable:
          principle: "BARE bool: the A2 gate + the capstone read this (gated-fields-must-be-bare); true iff bidirectional fusion improves first-error localization over unidirectional L2R (CI95-excl-0) AND the risk-coverage curve yields a useful selective-prediction operating point -- the oracle-distinct detector graduating from 'beats chance' to 'localizes + abstains usefully'."
        localization_f1_by_direction:
          principle: "dict {{unidirectional_l2r, bidirectional_fusion, causal_online}} -> first-error-step localization accuracy/F1 -- the head-to-head; the causal_online number is the in-loop-achievable one (R2L-free)."
        localization_delta_ci95:
          principle: "Bootstrap CI95 (>=2000 resamples) of (bidirectional - unidirectional) first-error localization -- excluding 0 is the decision-grade gain."
        abstention_curve:
          principle: "The accuracy-vs-coverage / risk-coverage points (retained accuracy at coverage levels) + precision@recall=0.9 + the selective risk -- the 'I don't know' operating point that makes detection actionable."
        online_vs_offline_separated:
          principle: "BARE bool=true -- the bidirectional (R2L, future-context) localization is reported as OFFLINE post-hoc and the causal/L2R-only as the ONLINE-actionable number, in separate fields (the SOTA failure-mode honesty); never conflated."
        n_traces:
          principle: "BARE int: scored trace count -- MUST be >= 1000 for the localization/detection claim (sample-size rigor)."
        verifier_is_oracle:
          principle: "BARE bool=false -- a learned/energy detection signal scored against cached candidates; the executable label defines correctness, the detector estimates it -- oracle-DISTINCT."
        preconditions_checked:
          principle: "Records the cached-step-labeled-corpus + ensemble + step-labels + TRM-stand-down verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for the (stochastic) ensemble scoring + the fusion + the bootstrap."
        reproducibility_checksum:
          principle: "Hash of the corpus + the ensemble config + the fusion method + the localization/abstention computation; lets a third party re-run."
        model_specs:
          principle: "The verifier ensemble + the cached step-labeled FoVer corpus + the BiPRM fusion config + the unidirectional baseline + n; required methodology + the oracle-distinct declaration."
      ACCEPTANCE GATE:
        - condition: "detector_localization_actionable + localization_f1_by_direction + localization_delta_ci95 + abstention_curve + online_vs_offline_separated + n_traces (>=1000) reported with verifier_is_oracle=false and preconditions_checked and adversarial_verify CLEAN, OR an honest blocked_cached_step_labeled_corpus_unavailable / blocked_no_step_labels_for_localization / clean-powered-null verdict"
          principle: "Turning the positive detector (exp4375 AUROC 0.918) into an ACTIONABLE capability -- bidirectional first-error localization + a useful selective-prediction abstention operating point -- graduates the one ALIVE oracle-distinct vehicle from 'beats chance' to a defensible second-headline-class Carnot capability ('I don't know' / precision filtering), the north-star §0 oracle-distinct frontier realized cheaply and infra-independently."

      Run: `python3 {project_root}/results/experiment_4381_biprm_detector_localization_abstention.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

