- id: exp1298-sota-answer-stability-falcon-audit
  milestone: 2026.04.101
  deliverable: results/experiment_1298_sota_answer_stability_falcon_audit.json
  title: "SOTA Answer Stability + FALCON Feasibility Audit"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 45
  priority: critical
  requires_gpu: true
  gated_on:
    - upstream: exp1297-sota-gguf-cache-provenance-preflight-v2
      artifact_field: cached_sota_ready
      op: '=='
      value: true
  prior_failures:
    - experiment_id: exp1284-ars-uqlm-answer-stability-sota-audit
      verdict: gated_missing_sota_cache
      addressed_by: "exp1297 must prove cached_sota_ready before this task activates."
      retire_if_same_verdict: true
    - experiment_id: exp1271-triggered-certificate-extraction-sota-gguf
      verdict: blocked_gate_check_failed
      addressed_by: "This task is a small audited SOTA run with cache gate and explicit MODEL_SPECS before extraction."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Carnot still lacks a headline-eligible answer-stability audit on the mandated
    local SOTA GGUF models. FALCON adds a useful split: syntactic validity,
    semantic feasibility repair opportunity, and adaptive sampling budget. Use
    {project_root} as the project root and {date} as the run date in artifact metadata.

    MODEL_SPECS:
    Use python/carnot/inference/sota_models.py cached_sota_pair(gpu_indices=(0, 1))
    as the first choice. Headline models must be drawn from:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models may only be CPU smoke tests with headline_result_allowed=false.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - research-references.md
    - results/experiment_1297_sota_gguf_cache_provenance_preflight_v2.json
    - results/experiment_1283_certificate_grammar_backend_bakeoff.json

    TASK:
    Run a small SOTA answer-stability and feasibility audit that prepares the
    certificate extraction gate.

    REQUIRED ARTIFACT FIELDS:
    - status
    - answer_stability_score
    - cross_model_disagreement_rate
    - falcon_repair_opportunity_rate
    - infeasible_or_unknown_rate
    - headline_result_allowed
    - models_used
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1298_sota_answer_stability_falcon_audit.json immediately with status="in_progress".
    2. Resolve MODEL_SPECS via cached_sota_pair(). Abort to a terminal non-headline blocker if no mandated SOTA pair is available.
    3. Build a tiny deterministic benchmark from existing verifier/certificate examples: include feasible, infeasible, and unknown/abstain cases.
    4. For each prompt, collect two perturbations and compare final answers, claim sets, and feasibility labels across the available SOTA pair.
    5. Estimate falcon_repair_opportunity_rate as the fraction of syntactically parseable but semantically repairable outputs.
    6. Write answer_stability_score in [0, 1], cross_model_disagreement_rate, infeasible_or_unknown_rate, models_used, headline_result_allowed, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1298_sota_answer_stability_falcon_audit.json')); print(d.get('answer_stability_score'), d.get('headline_result_allowed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1299-triggered-certificate-extraction-v3
  milestone: 2026.04.101
  deliverable: results/experiment_1299_triggered_certificate_extraction_v3.json
  title: "Triggered Certificate Extraction v3 - GBNF + FALCON Repair + Adaptive Best-of-N"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 60
  priority: critical
  requires_gpu: true
  gated_on:
    - upstream: exp1297-sota-gguf-cache-provenance-preflight-v2
      artifact_field: cached_sota_ready
      op: '=='
      value: true
    - upstream: exp1296-prior-failures-activation-audit
      artifact_field: exp1283_grammar_backend_available
      op: '=='
      value: true
    - upstream: exp1298-sota-answer-stability-falcon-audit
      artifact_field: answer_stability_score
      op: '>='
      value: 0.6
  prior_failures:
    - experiment_id: exp1285-triggered-certificate-extraction-v2
      verdict: gated_missing_sota_cache_and_answer_stability
      addressed_by: "This v3 extraction is gated on current cache readiness, .100 grammar availability, and a SOTA answer-stability score."
      retire_if_same_verdict: true
    - experiment_id: exp1271-triggered-certificate-extraction-sota-gguf
      verdict: blocked_gate_check_failed
      addressed_by: "Complete prior metadata and Phase 0 gate audit prevent the same activation failure."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    .100 selected llama.cpp GBNF but never measured SOTA certificate extraction.
    The .101 extraction must separate parse validity from truthful/verifiable
    certificates and add FALCON-style semantic repair plus adaptive Best-of-N.
    Use {project_root} as the project root and {date} as the run date in artifact metadata.

    MODEL_SPECS:
    Use cached_sota_pair(gpu_indices=(0, 1)) first. Headline models must include
    at least one of:
    - unsloth/Qwen3.6-35B-A3B-GGUF
    - unsloth/gemma-4-31B-it-GGUF
    - unsloth/gemma-4-26B-A4B-it-GGUF
    Legacy small models are smoke-only and must set headline_result_allowed=false.

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_template.py
    - python/carnot/inference/sota_models.py
    - results/experiment_1283_certificate_grammar_backend_bakeoff.json
    - results/experiment_1298_sota_answer_stability_falcon_audit.json
    - research-references.md

    TASK:
    Run triggered <CARNOT_CERT> extraction under the selected local grammar backend
    and measure parse rate, truthfulness, repair, and grammar cost.

    REQUIRED ARTIFACT FIELDS:
    - status
    - certificate_parse_rate
    - certificate_truthfulness_rate
    - repair_success_rate
    - adaptive_best_of_n_used
    - grammar_state_count
    - structural_ambiguity_cost_proxy
    - tokens_per_second_delta
    - headline_result_allowed
    - models_used
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1299_triggered_certificate_extraction_v3.json immediately with status="in_progress".
    2. Load the selected grammar backend details from exp1283 and resolve MODEL_SPECS via cached_sota_pair().
    3. Build a small fixed benchmark from existing certificate/verifier examples with feasible, infeasible, and unknown cases.
    4. Compare at least these paths: raw trigger, GBNF-constrained trigger, FALCON-style repaired certificate, and adaptive Best-of-N when budget allows.
    5. Verify certificate claims against existing deterministic verifiers; do not count parse-valid but verifier-false certificates as truthful.
    6. Record grammar_state_count, structural_ambiguity_cost_proxy, tokens_per_second_delta, repair_success_rate, adaptive_best_of_n_used, certificate_parse_rate, certificate_truthfulness_rate, headline_result_allowed, models_used, status="complete", and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1299_triggered_certificate_extraction_v3.json')); print(d.get('certificate_parse_rate'), d.get('certificate_truthfulness_rate'), d.get('headline_result_allowed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1300-semantic-routing-v2
  milestone: 2026.04.101
  deliverable: results/experiment_1300_semantic_routing_v2.json
  title: "Semantic Routing v2 - Verifier Features + Infeasible/Unknown States"
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 40
  priority: high
  requires_gpu: false
  gated_on:
    - upstream: exp1299-triggered-certificate-extraction-v3
      artifact_field: certificate_parse_rate
      op: '>='
      value: 0.8
  prior_failures:
    - experiment_id: exp1286-grad-beaver-nsvif-semantic-routing
      verdict: blocked_gate_check_failed
      addressed_by: "This v2 task is gated on the current v3 certificate parse rate instead of the missing .100 artifact."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Semantic routing was gate-blocked in .100 because no certificate parse-rate
    artifact existed. .101 should route parsed claims using syntax, verifier
    features, infeasible/unknown states, and correction diagnostics. Use
    {project_root} as the project root and {date} as the run date in artifact metadata.

    EXISTING CODE TO READ FIRST:
    - results/experiment_1299_triggered_certificate_extraction_v3.json
    - research-references.md
    - python/carnot/
    - tests/

    TASK:
    Produce a semantic routing artifact from parsed certificates to available
    deterministic verifiers and repair/abstention decisions.

    REQUIRED ARTIFACT FIELDS:
    - status
    - semantic_routing_coverage
    - semantic_violation_reduction
    - infeasible_certificate_detected
    - unknown_or_abstain_rate
    - minimal_correction_cases
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1300_semantic_routing_v2.json immediately with status="in_progress".
    2. Load parsed certificates from exp1299 or the artifact's saved examples. If examples are absent, synthesize a tiny deterministic fixture from existing verifier tests and mark fixture_used=true.
    3. Route each claim to syntax-only, semantic verifier-feature, infeasible, unknown/abstain, or minimal-correction handling.
    4. Compare routing coverage and violation reduction against a syntax-only baseline.
    5. Include minimal_correction_cases and any infeasible certificate detection from the new arXiv infeasibility-aware LLM reference.
    6. Finish with status="complete" and honest_verdict.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1300_semantic_routing_v2.json')); print(d.get('semantic_routing_coverage'), d.get('semantic_violation_reduction'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1301-safe-prefix-cactus-acceptance-v3
  milestone: 2026.04.101
  deliverable: results/experiment_1301_safe_prefix_cactus_acceptance_v3.json
  title: "Safe-Prefix Cactus Acceptance v3 - HoVer/Token-Guard Low-Risk Gate"
  agent_type: codex
  model: gpt-5.5
  max_turns: 45
  estimated_wall_time_min: 50
  priority: high
  requires_gpu: true
  gated_on:
    - upstream: exp1299-triggered-certificate-extraction-v3
      artifact_field: certificate_parse_rate
      op: '>='
      value: 0.8
    - upstream: exp1300-semantic-routing-v2
      artifact_field: semantic_routing_coverage
      op: '>='
      value: 0.5
