    verdict: complete_fr11_nsvif_online_passed
    addressed_by: "exp2425 (.235) PASSED (fr11_nsvif_online_passed=true, cross_domain_retention_rate=1.0). This
      v5 EXTENDS exp2425 with explicit soundness/completeness asymmetric tracking per arXiv:2603.03538.
      The mechanism: soundness_mistakes (false negatives on real violations) and completeness_mistakes
