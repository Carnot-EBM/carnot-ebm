  - id: exp2709
    milestone: "2026.05.257"
    deliverable: "results/experiment_2709_linear_probe_calibration.json"
    title: "Linear Probe Calibration for Tier 0e EORM: 10x Speed vs Multi-Generation (arXiv:2512.22245)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 30
    track: verifier

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .257 (no prior failures).

      arXiv:2512.22245 "Calibrating LLM Judges: Linear Probes for Fast and Reliable Uncertainty
      Estimation" (Dec 2025): uses interpretability-based linear probes on frozen embeddings for
      calibrated uncertainty estimation. 10x faster than multi-generation methods. Better ECE
      than ensemble temperature scaling. Key: linear probe on the SAME TF-IDF vectors already
      computed in Tier 0e — no additional generation needed.

      Carnot's Tier 0e EORM uses TF-IDF margin-ranking logistic. The calibration improvement
      means: for the same TF-IDF feature vector, a linear probe can estimate the RELIABILITY
      of the AUROC score (confidence interval) without running multiple inference passes.
      This is directly applicable to the fast_path_rate metric in the GGUF live eval (exp2702).

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/tier0e_eorm.py (if exists — EORMVerifier class)
      - python/carnot/verify/tier0f_semantic_calibration.py (if exists — SemanticCalibratedVerifier)
      - data/fover_corpus.jsonl (corpus)

      TASK: Implement LinearProbeCalibrator on Tier 0e TF-IDF features. Measure ECE improvement.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0` — FoVer corpus.
            If 0 or missing: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         c. Check tier0e: `ls python/carnot/verify/tier0e_eorm.py 2>/dev/null && echo exists || echo missing`
            Record: tier0e_exists (bool).
         Record: preconditions_checked.

      1. Load FoVer corpus. Compute TF-IDF features (random_seed=42) on all (question, response) pairs.
         Label: 1 for (question, correct), 0 for (question, incorrect).
         Train/eval split: 80/20.
         Record: n_corpus_pairs (int).

      2. Baseline: if tier0e_exists: load existing EORMVerifier and evaluate ECE on eval split.
         Else: train simple logistic on TF-IDF. Record: baseline_ece (float), baseline_auroc (float).

      3. LinearProbeCalibrator: fit sklearn CalibratedClassifierCV(cv=5, method='isotonic') on
         the logistic's uncalibrated probabilities.
         probe_ece = calibration_curve_based ECE (10 bins).
         probe_auroc = roc_auc_score on calibrated probabilities.
         Record: probe_ece (float), probe_auroc (float).

      4. Speed comparison:
         multi_generation_simulated_time_s = n_eval_examples * 2.0  # 2s per generation, simulated
         linear_probe_time_s = measured time for probe.predict_proba on eval set
         speedup_factor = multi_generation_simulated_time_s / max(linear_probe_time_s, 0.001)
         Record: speedup_factor (float), linear_probe_time_s (float).

      5. Create python/carnot/verify/linear_probe_calibrator.py with LinearProbeCalibrator class:
         - fit(features, labels) -> self
         - calibrate(features) -> probabilities
         - ece(predictions, labels, n_bins=10) -> float
         Update python/carnot/verify/__init__.py to export it.
         Record: module_created (bool).

      6. probe_viable = probe_ece < baseline_ece AND probe_auroc >= baseline_auroc - 0.05.

      7. Write results/experiment_2709_linear_probe_calibration.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - probe_ece: float
        principle: "Primary calibration metric; arXiv:2512.22245 claims ECE < baseline."
      - probe_auroc: float
        principle: "AUROC under calibration — must not degrade significantly from baseline."
      - baseline_ece: float
        principle: "Pre-calibration reference ECE; delta = baseline_ece - probe_ece."
      - speedup_factor: float
        principle: "arXiv:2512.22245 headline: 10x faster than multi-generation; validate claim."
      - probe_viable: bool
        principle: "Gate for future ensemble integration of calibrated Tier 0e."
      - module_created: bool
        principle: "LinearProbeCalibrator module exists in python/carnot/verify/ after this task."
      - random_seed: int — 42
        principle: "Reproducibility: same TF-IDF + train/eval split as Tier 0e."
      - duration_s: float
        principle: "Fitting logistic + calibration on FoVer: expected 2-30s; < 1s suspicious."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records sklearn check + FoVer corpus check + tier0e check."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


