        verdict: "complete: energy_matches_but_does_not_beat_self_consistency_at_equal_compute (DEGENERATE: every k-sample condition = 0.0 accuracy vs greedy AR 0.75 — broken multi-sample harness, not a real measurement)"
        addressed_by: "exp3426's k-sample path silently produced 0.0 for SC, self-certainty BoN, energy-argmin, AND energy-vote (only greedy AR worked). This v3 adds a MANDATORY precondition that the self-consistency baseline is NON-DEGENERATE (SC accuracy >= greedy AR on GSM8K — the textbook result) BEFORE reporting any energy comparison, so a 0.0 harness cannot ship as a verdict. It fixes the per-sample answer extraction (regex + numeric normalization on each of the k generations, not just greedy) and the majority/weighted vote aggregation. Same matched-compute design; the headline stays energy-weighted-vote minus majority-vote SC."
        retire_if_same_verdict: true
      - experiment_id: exp3312-energy-descent-vs-autoregressive-premise-v1
        verdict: "complete: energy_descent_beats_ar_premise_validated (but flagged_adversarial; energy 0.840 LOST to equal-compute self-consistency 0.895)"
        addressed_by: "exp3312 was flagged_adversarial and compared only to greedy AR. v3 clears the flag with clean methodology and makes matched-compute SC the PRIMARY control, with a verified-non-degenerate SC baseline."
        retire_if_same_verdict: true
    milestone: "2026.05.317"
    title: "P0.1 v3 — Energy-Weighted Vote vs Self-Consistency (REAL multi-sample harness, matched compute)"
    priority: critical
    max_turns: 100
    model: opus
    agent_type: claude
    requires_claude: true   # (1) gemini-cli is DOWN (exp3427/3428/3429 crashed 3x in .315 AND .316) and gemini's prior energy-descent attempts stalled; (2) 5+ files: boltzmann_gpt.py + continuous_ebm.py + verifier energy + GSM8K loader + AR/SC/self-certainty/energy-vote conditions + per-sample extraction + paired stats; (3) open-ended judgment on the non-degenerate-SC precondition + matched-compute accounting + energy-weighting scheme no deterministic gate substitutes for.
    estimated_wall_time_min: 140
    track: evidence
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: "results/experiment_3437_energy_vote_vs_self_consistency_real_harness_premise_v3.json"
    prompt: |
      CONTEXT: P0.1 is the single most important test in the project — does
      energy-based selection/voting on continuous latents BEAT plain token-sampling
      self-consistency at the SAME compute? Two prior attempts failed to answer it:
      exp3312 (.315) was flagged_adversarial and lost to SC; exp3426 (.316) ran
      clean wall-time (642 s) but its multi-sample harness BROKE — every k-sample
      condition (SC, self-certainty BoN, energy-argmin, energy-vote) returned 0.0
      accuracy while greedy AR scored 0.75. The "energy matches SC" verdict was a
      degenerate 0.0-vs-0.0 tie, NOT a measurement. This v3 FIXES the harness and
      makes the comparison real. The sharpened bar (arXiv:2410.12608, "Not All
      Votes Count"): a program-verifier already beats SC on math, so the honest
      target is "energy beats SC," not merely "energy beats greedy AR." Mechanism
      references: EBM-CoT (arXiv:2511.07124, latent energy calibration toward
      low-energy/high-consistency regions); self-certainty BoN (arXiv:2502.18581,
      the strongest cheap selector). Either outcome is high value: beats SC -> the
      FIRST real justification for the Phase-3 endgame; doesn't -> retire the
      energy-superiority framing honestly.

      EXISTING CODE TO READ FIRST:
        - results/experiment_3426_energy_descent_vs_ar_vs_self_consistency_premise_v2.json
          (the broken-harness predecessor — read its design AND find why the k-sample
          conditions returned 0.0; do NOT copy its numbers)
        - scripts/experiment_3426_energy_descent_vs_ar_vs_self_consistency_premise_v2.py
          (the harness to repair — the 0.0 bug is in per-sample extraction or vote aggregation)
        - python/carnot/phase3/boltzmann_gpt.py (continuous-latent refinement substrate)
        - python/carnot/phase3/continuous_ebm.py (latent EBM)
        - scripts/experiment_template.py (cached_sota_pair, BatchedInferenceRunner)
        - research-references.md "2026-05-30 Post-.316 Planning Sweep" (the SC-vs-verifier references)
        - ops/known-issues.md exp3312 spec (authoritative P0.1 spec)

      TASK: Paired head-to-head on GSM8K across FOUR conditions at MATCHED compute,
      with a VERIFIED-NON-DEGENERATE self-consistency baseline as a hard gate, clean
      methodology, and a falsifiable significance gate. PRIMARY comparison:
      energy-weighted vote vs majority-vote self-consistency.

      PRECONDITIONS (step 0, before any comparison is reported — emit blocked_* and STOP if a/b/c/d fail):
        a. CUDA available: python -c "import torch; assert torch.cuda.is_available()".
           If not -> honest_verdict blocked_cuda_unavailable.
        b. The continuous-latent refinement substrate (boltzmann_gpt / continuous_ebm)
           is trainable/loadable. If not -> blocked_energy_descent_substrate_unavailable.
        c. GSM8K subset >=200 held-out with ground-truth labels (exp281 corpus acceptable).
           If not -> blocked_real_task_corpus_missing.
        d. The SOTA GGUF loads via the GGUF path (NOT AutoTokenizer on a -GGUF repo id;
           embedded tokenizer per the 2026-05-29 GGUF tokenizer rule):
           llama_cpp.Llama(model_path=..., vocab_only=True).tokenize(b"x") succeeds.
           If not -> blocked_sota_gguf_tokenizer_unavailable.
        e. NON-DEGENERATE-SC GATE (the exp3426 fix): after sampling k generations for a
           small warm-up batch (>=20 problems), assert the SELF-CONSISTENCY accuracy is
           NON-DEGENERATE: self_consistency_accuracy >= ar_greedy_accuracy AND > 0.30.
           If SC is 0.0 or below greedy, the per-sample answer extraction / vote
           aggregation is BROKEN — STOP, write honest_verdict
           complete: blocked_self_consistency_harness_degenerate_per_sample_extraction_broken
           with the raw per-sample extracted answers for 3 example problems so the bug
           is diagnosable. Do NOT report any energy comparison against a broken SC.

      CONCRETE STEPS:
        1. Fix the GSM8K split: n>=200, held-out, documented seed; same paired problems
           across ALL conditions. MODEL_SPECS = ["unsloth/Qwen3.6-35B-A3B-GGUF"].
        2. Implement per-sample answer extraction that works on EACH of the k sampled
           generations (numeric answer regex + normalization), not just the greedy one
           — this is the exp3426 bug. Unit-check it on the warm-up batch (step 0e).
        3. CONDITION 1 (greedy AR floor): 1 greedy generation/problem; per-problem pass/fail.
        4. CONDITION 2 (self-consistency, PRIMARY control): k samples (k>=5, temp ~0.8);
           answer = majority vote over the k extracted answers.
        5. CONDITION 3 (self-certainty BoN, arXiv:2502.18581): over the SAME k samples,
           select by mean token confidence; report accuracy.
        6. CONDITION 4 (ENERGY — the premise): over the SAME k samples, compute the
           verifier/Boltzmann-GPT energy per candidate and report (a) energy-argmin
           select AND (b) energy-WEIGHTED vote = softmax(-E/T) over answers (EBM-CoT).
        7. MATCHED COMPUTE: conditions 2-4 all consume the SAME k generations; energy
           gets NO extra samples (only the 16-dim latent gradient steps). State the exact
           per-condition generation budget so the comparison is apples-to-apples.
        8. Compute accuracy per condition + the PRIMARY paired delta (energy-vote minus
           majority-vote SC) with McNemar exact + paired bootstrap CI95. Also report
           energy-vote minus greedy AR for continuity.
        9. Emit results with all REQUIRED ARTIFACT FIELDS and clean methodology so
           adversarial_verify.py does NOT flag it (real duration >=60s, seed, checksum,
           model_specs, inference_substrate).

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="Terminal verdict must start with complete:/success:/passed:/shipped_."
        inference_substrate: value=live_llm_inference
        task_name: principle="name the real benchmark + split; toy/synthetic is NOT acceptable."
        n_problems: principle=">=200 for a CLT-valid accuracy delta."
        k_samples: principle="generations per problem for conditions 2-4; the matched-compute budget."
        self_consistency_non_degenerate: principle="boolean from step 0e: SC accuracy >= greedy AND > 0.30 on the warm-up batch — the gate that makes the exp3426 0.0-tie impossible to ship."
        ar_greedy_accuracy: principle="1-sample greedy control (the exp3312/exp3426 baseline)."
        self_consistency_accuracy: principle="majority vote over k samples — the PRIMARY control energy must beat; MUST be non-degenerate per step 0e."
        self_certainty_bon_accuracy: principle="self-certainty Best-of-N (arXiv:2502.18581) — the strongest cheap selector."
        energy_argmin_accuracy: principle="energy-argmin selection over the same k samples."
        energy_weighted_vote_accuracy: principle="energy-weighted vote (EBM-CoT) — the premise under test; the headline condition."
        delta_energy_vs_self_consistency: principle="energy_weighted_vote minus self_consistency at MATCHED compute — THE headline; does energy add value over majority vote?"
        delta_energy_vs_greedy_ar: principle="energy minus greedy AR — reported for continuity with exp3312/exp3426."
        paired_significance: principle="McNemar exact p + paired bootstrap CI95 for the PRIMARY (energy vs SC) delta; an unpaired or n<200 delta is gameable."
        compute_parity_note: principle="state per-condition generation budget + param count so energy does not win by spending more compute."
        random_seed: principle="determinism precondition for reproducibility."
        reproducibility_checksum: principle="content hash of corpus+substrate+seed."
        duration_s: principle="real live 35B inference over 200 problems x k samples takes minutes; 60s floor — a sub-60s duration is the fabrication signal."

      ACCEPTANCE GATES:
        - condition: "self_consistency_non_degenerate == true (step 0e passed) BEFORE any energy comparison is reported"
          principle: "G0 NON-DEGENERATE-SC: a 0.0-vs-0.0 tie (exp3426) is a broken harness, not a result; the comparison is meaningless until SC beats greedy as it textbook-should."
        - condition: "energy_weighted_vote_accuracy >= self_consistency_accuracy AND paired_significance favors non-inferiority"
          principle: "G1 ENERGY-NON-INFERIOR: energy at least matches plain majority vote at equal compute. Below this, energy adds nothing over sampling and the premise is unsupported."
        - condition: "delta_energy_vs_self_consistency > 0 with paired p < 0.05"
          principle: "G2 ENERGY-ADDS-VALUE: energy SIGNIFICANTLY beats majority vote at matched compute — the FIRST real justification for the Phase-3 foundation-model endgame; clears the arXiv:2410.12608 'a verifier can beat SC' bar."

      TERMINAL VERDICTS (all start with complete:):
        - step 0e fails -> "complete: blocked_self_consistency_harness_degenerate_per_sample_extraction_broken" (honest finding — the harness still needs repair)
        - G2 passes -> "complete: energy_beats_self_consistency_premise_validated"
        - G1 passes, G2 fails -> "complete: energy_matches_but_does_not_beat_self_consistency_at_equal_compute"
        - G1 fails -> "complete: energy_below_self_consistency_premise_unsupported_retire_superiority_framing"
      Run command: cd {project_root} && .venv/bin/python scripts/experiment_3437_energy_vote_vs_self_consistency_real_harness_premise_v3.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

