- id: exp1548-thrml-carnot-parity-independent-rng-audit
  milestone: 2026.04.119
  deliverable: results/experiment_1548_thrml_carnot_parity_independent_rng_audit.json
  title: "THRML/Carnot Parity Independent-RNG Audit - Gated on Exp1547 THRML Carry-Forward"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 70
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  gated_on:
    - upstream: exp1547-118-completion-archive-119-activation
      artifact_field: prior_thrml_n256_ready
      op: "=="
      value: true
    - upstream: exp1547-118-completion-archive-119-activation
      artifact_field: thrml_independent_rng_required
      op: "=="
      value: true
  prior_failures:
    - experiment_id: exp1526-1531
      verdict: tautological_byte_identical_histograms
      addressed_by: "Re-run n=32/64/128 with provably independent RNG and code paths, require non-zero stochastic deltas within statistical tolerance, and fail the test as rng_path_not_independent if byte-identical distributions recur."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    ops/known-issues.md flags a mandatory .119 audit: earlier THRML/Carnot
    parity artifacts reported byte-identical histograms and lag-1
    autocorrelations across large stochastic runs. Independent samplers should
    match distributions, not sample summaries byte for byte. The good news is
    that THRML imports and runs locally; the missing evidence is independence.
    Use {project_root} as the project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - ops/known-issues.md
    - research-hardware-wishlist.md
    - results/experiment_1530_thrml_carnot_parity_n128.json
    - results/experiment_1531_thrml_diverse_topology_parity_n32.json
    - results/experiment_1543_thrml_carnot_parity_n256_schedule_stress.json
    - results/experiment_1544_thrml_diverse_topology_parity_n64.json
    - results/experiment_1547_118_completion_archive_119_activation.json
    - python/carnot/thrml/
    - python/carnot/energy/
    - scripts/
    - tests/python/

    TASK:
    Audit and re-run Carnot-vs-THRML software parity with independent RNG and
    code paths. The correct success shape is bounded distribution agreement
    with non-identical stochastic summaries, not exact equality. Do not claim
    Z1, XTR-0, TSU, FPGA, or other hardware execution.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - independent_rng_audit_ready
    - rng_path_independent
    - code_path_independent
    - rng_seed_manifest_path
    - n_values_tested
    - topologies_tested
    - sample_path_hashes
    - byte_identical_pairs
    - nonzero_stochastic_delta_observed
    - per_case_results
    - max_mean_energy_delta_abs
    - max_kl_divergence
    - min_ks_p_value
    - bounded_kl_passed
    - ks_test_passed
    - rng_path_not_independent
    - simulator_only
    - no_tsu_hardware_claim
    - focused_tests_passed
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1548_thrml_carnot_parity_independent_rng_audit.json immediately with status="in_progress".
    2. Inspect the existing THRML parity harness and confirm whether the Carnot path imports or calls the THRML sampler. Record code_path_independent=false if it does.
    3. Create a seed manifest with disjoint root seeds and separate PRNG lineages for Carnot and THRML. Do not split both samplers from the same key object.
    4. Re-run or prototype parity checks at n=32, n=64, and n=128 across at least complete, sparse_random, lattice, and scale_free or the closest existing topologies.
    5. For each pair, record sample-path hashes, histogram counts, mean energy delta, KL divergence, and a KS-style distribution check where appropriate.
    6. Treat byte-identical stochastic summaries as failure: set rng_path_not_independent=true and independent_rng_audit_ready=false unless you can prove deterministic enumeration was intentionally used.
    7. Treat success as nonzero stochastic deltas that remain within tolerance, bounded nonzero KL, and KS pass. Preserve simulator_only=true and no_tsu_hardware_claim=true.
    8. Add or run focused tests for seed-manifest validation, hash inequality detection, and metric computation.
    9. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1548_thrml_carnot_parity_independent_rng_audit.json')); print(d.get('independent_rng_audit_ready'), d.get('rng_path_independent'), d.get('byte_identical_pairs'), d.get('bounded_kl_passed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1549-satquest-oracle-false-accept-repair
  milestone: 2026.04.119
  deliverable: results/experiment_1549_satquest_oracle_false_accept_repair.json
  title: "SATQuest Solver-Oracle False-Accept Repair - Gated on Exp1547 False Accepts"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 75
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  gated_on:
    - upstream: exp1547-118-completion-archive-119-activation
      artifact_field: prior_satquest_solver_oracle_false_accepts
      op: ">"
      value: 0
  prior_failures:
    - experiment_id: exp1536-satquest-cnf-verifier-benchmark
      verdict: solver_oracle_false_accepts_3
      addressed_by: "Repair the SATQuest oracle and require assignment or unsat/proof witnesses plus perturbation checks before any downstream acceptance use."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    .118 built a SATQuest-style CNF benchmark but the retro recorded 3
    solver-oracle false accepts. SATQuest cannot become acceptance authority
    until the oracle produces proof or witness evidence and reports zero false
    accepts on the known failing rows. Use {project_root} as the project root
    and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - research-references.md
    - results/experiment_1536_satquest_cnf_verifier_benchmark.json
    - results/experiment_1546_milestone_118_retro.json
    - results/experiment_1547_118_completion_archive_119_activation.json
    - python/carnot/verify/
    - python/carnot/grammar/
    - scripts/
    - tests/python/

    TASK:
    Repair the SATQuest solver oracle, add proof/witness evidence, and produce
    a zero-false-accept gate for downstream SATQuest and unified-contract work.
    Do not modify research-roadmap.yaml or scripts/research_conductor.py.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - satquest_oracle_repair_ready
    - satquest_zero_false_accepts
    - false_accepts_before
    - solver_oracle_false_accepts_after
    - failing_case_ids_rechecked
    - pysat_available
    - exact_fallback_available
    - assignment_witnesses_checked
    - unsat_certificates_checked
    - perturbation_checks_passed
    - oracle_module_path
    - repaired_case_manifest_path
    - focused_tests_passed
    - honest_verdict (MUST start with complete:, complete_, success:, success_, passed:, passed_, shipped:, or shipped_)

    CONCRETE STEPS:
    1. Create results/experiment_1549_satquest_oracle_false_accept_repair.json immediately with status="in_progress".
    2. Load the exp1536 artifact and identify the false-accept rows, formats, expected labels, and solver path used.
    3. Inspect the CNF parser, exact fallback, and any PySAT integration. Prefer PySAT when available, but keep an exact local fallback for small cases.
    4. Add assignment witnesses for SAT cases and unsat/proof or exhaustive contradiction evidence for UNSAT cases. The oracle must reject malformed or witness-less success.
    5. Re-run the known failing rows and a bounded regression pack with format variations and perturbation checks.
    6. Add focused tests covering the 3 false-accept shapes, malformed CNF handling, assignment checking, and unsat fallback behavior.
    7. Set satquest_zero_false_accepts=true only if solver_oracle_false_accepts_after=0 across the regression pack.
    8. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1549_satquest_oracle_false_accept_repair.json')); print(d.get('satquest_oracle_repair_ready'), d.get('satquest_zero_false_accepts'), d.get('solver_oracle_false_accepts_after'), d.get('focused_tests_passed'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

