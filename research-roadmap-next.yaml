  - id: exp2748
    milestone: "2026.05.260"
    deliverable: "results/experiment_2748_phase4_fep_factor_graph.json"
    title: "Phase 4 Active Inference: FEP Factor Graph over Verifier Ensemble (arXiv:2603.20927)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 40
    track: research

    prior_failures: []

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      NEW EXPERIMENT for .260 — Phase 4 active inference empirical validation step.

      arXiv:2603.20927 "Active Inference for Physical AI Agents — An Engineering Perspective" (Mar 2026):
      Develops Free Energy Principle (FEP) agent principles via message passing on factor graphs.
      Provides an engineering blueprint for agents that minimize variational free energy as a unified
      objective for action, perception, and learning.

      Carnot Phase 4 hypothesis (from feedback_active_inference_phase4_committed.md):
      "The verifier ensemble IS the alpha_t * mu_P term in the variational free energy equation.
       Each verifier is a factor node; the joint free energy is the routing signal."

      This experiment implements a factor graph over Carnot's k=15 Tier 0 verifiers:
      - Each verifier V_i is a factor node: F_i(q, r) = verifier_energy_i(q, r)
      - Joint variational free energy: F(q, r) = sum_i w_i * F_i(q, r) - log P_prior(r)
        where P_prior is a uniform prior (or learned from FoVer correct-answer distribution)
      - The ODAR free-energy score is a heuristic approximation of this joint F.
      - This experiment computes the EXACT factor-graph F and compares to ODAR heuristic.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (list all tier0* modules — enumerate k verifiers)
      - python/carnot/pipeline/verify_repair.py (odar_route() from exp2720)
      - data/fover_corpus.jsonl (FoVer corpus for evaluation)

      TASK: Implement Phase 4 FEP factor graph. Compare to ODAR heuristic. Validate alpha_t signal.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; import numpy; import sys; sys.path.insert(0,'python'); import carnot.verify"`
            Record: carnot_verify_importable (bool).
            If false: write honest_verdict 'blocked_carnot_verify_not_importable' and exit.
         b. `wc -l data/fover_corpus.jsonl 2>/dev/null || echo 0`
            Record: fover_corpus_lines (int).
            If 0: write honest_verdict 'blocked_fover_corpus_missing' and exit.
         Record: preconditions_checked.

      1. Enumerate available verifier modules (all tier0* in python/carnot/verify/):
         `ls python/carnot/verify/tier0*.py 2>/dev/null`
         Record: n_verifiers (int), verifier_ids (list of str).

      2. Implement FEP factor graph:
         For each example (q, r):
           factor_energies = [verifier_i.compute_energy(q, r) for verifier_i in verifiers]
           # Equal weights initially (to compare against ODAR which has learned weights)
           joint_fep_energy = sum(factor_energies) / n_verifiers
           # Log-prior term (uniform: log P_prior = 0)
           variational_free_energy = joint_fep_energy  # simplified: no KL term with uniform prior

         Record: fep_factor_graph_computed (bool = True if loop runs without error).

      3. Compare FEP vs ODAR on FoVer eval split (N=50, random_seed=42):
         For each example: compute fep_energy and odar_score.
         fep_auroc = roc_auc_score(labels, fep_energies)
         odar_auroc = roc_auc_score(labels, odar_scores)
         fep_vs_odar_delta = fep_auroc - odar_auroc
         Record: fep_auroc (float), odar_auroc (float), fep_vs_odar_delta (float).
         fep_viable = fep_auroc >= 0.60.

      4. Alpha_t signal validation:
         alpha_t is the verifier's "contribution weight" to the variational free energy.
         For each verifier: compute alpha_i = Cov(verifier_i_energy, correct_label) / Var(verifier_i_energy)
         Record: alpha_values (list of float — one per verifier), alpha_t_nonzero (bool = any alpha > 0.1).
         alpha_t_mean = mean(alpha_values).

      5. Write results/experiment_2748_phase4_fep_factor_graph.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - fep_factor_graph_computed: bool
        principle: "Phase 4 primary deliverable: FEP factor graph over k verifiers implemented."
      - fep_auroc: float
        principle: "FEP routing accuracy: compared against ODAR heuristic."
      - fep_viable: bool
        principle: "Gate: True if fep_auroc >= 0.60 (better than majority of baseline heuristics)."
      - fep_vs_odar_delta: float
        principle: "Comparison: positive = FEP outperforms ODAR; negative = ODAR heuristic is better."
      - alpha_t_nonzero: bool
        principle: "Phase 4 alpha_t hypothesis: verifiers must have non-zero contribution to free energy."
      - alpha_t_mean: float
        principle: "Mean verifier contribution weight — low = all verifiers equally informative."
      - n_verifiers: int
        principle: "Confirms factor graph uses all available Tier 0 verifiers."
      - random_seed: int — 42
        principle: "Reproducibility."
      - duration_s: float
        principle: "Factor graph compute + AUROC eval: expected 5-30s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records carnot.verify import + FoVer corpus."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


