    addressed_by: Use the shipped direct run_game path and the successful Exp7193 runtime; no invented
      runner is required.
    retire_if_same_verdict: true
  operator_override: '2026-09-11 operator directive in ops/known-issues.md: accumulate separate selfparse
    sessions after Exp7193; each new seed contributes unique induction evidence under its own wall cap.'
  prompt: |
    CONTEXT:
    The 2026-09-11 MANDATORY-NEXT-MILESTONE entry explicitly requests additional separately bounded selfparse sessions. Exp7193 made one authentic induction and six calls, but no missing-tool request. Three authentic inductions were known at planning. This is cumulative live generalization measurement, not a new public-game solve or a retry of the retired missing-tool explanation.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/ops/known-issues.md
