  - id: exp3192-receipt-adversarial-contract-v4
    milestone: "2026.05.296"
    deliverable: "results/experiment_3192_receipt_adversarial_contract_v4.json"
    title: "Receipt and adversarial contract v4 with dual clean-rerun thresholds"
    priority: critical
    max_turns: 100
    model: opus
    estimated_wall_time_min: 25
    track: "verification"
    inference_substrate: "contract_artifact_only"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3178-receipt-adversarial-contract-v3
        verdict: "complete: contract_v3_materialized_cpu_fallback_receipts_non_headline"
        addressed_by: "v4 adds dual proof-vs-clean thresholds and aggregation methodology fields observed missing in v29."
        retire_if_same_verdict: true
      - experiment_id: exp3179-local-sota-receipt-smoke-v3
        verdict: "complete: cpu_fallback_receipt_only_clean_rerun_allowed_false"
        addressed_by: "This task formalizes why CPU fallback receipts do not unlock clean reruns; it does not retry model execution."
        retire_if_same_verdict: true
      - experiment_id: exp3189-cross-corpus-matrix-v29
        verdict: "complete: matrix_ready_publication_blockers_80_methodology_flags_remain"
        addressed_by: "v4 requires explicit duration/methodology fields for aggregate and gated-skip artifacts to avoid false methodology flags."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      `.295` produced real `llama_cpp` local GGUF receipts, but only as `cpu_fallback_receipt_only`. Matrix v29 still carried methodology/adversarial flags for some aggregate artifacts. `.296` needs a stricter receipt contract before the CUDA/offload probe and clean verifier rerun.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - scripts/experiment_template.py
      - scripts/conductor_gates.py
      - results/experiment_3178_receipt_adversarial_contract_v3.json
      - results/experiment_3179_local_sota_receipt_smoke_v3.json
      - results/experiment_3189_cross_corpus_matrix_v29.json
      - research-references.md

      TASK
      Materialize receipt/adversarial contract v4 as a JSON artifact. It must define two separate thresholds: proof-of-execution sufficiency and clean-rerun eligibility. It must also define required fields for aggregate and gated-skip artifacts so later matrix runs can avoid false methodology flags.

      CONCRETE STEPS
      1. Compare v3 contract output with the receipt smoke and matrix v29 findings.
      2. Define `proof_execution_sufficient` conditions that CPU fallback can satisfy.
      3. Define `clean_rerun_allowed` conditions that require full local SOTA substrate evidence.
      4. Define mandatory adversarial/methodology fields for live, gated-skip, aggregate, and diagnostic-only artifacts.
      5. Add explicit terminal verdict prefix rules and blocked-precondition verdict allowances.
      6. Write the deliverable JSON without modifying conductor code.

      REQUIRED ARTIFACT FIELDS:
      - schema_version: string (principle: schema-versioned artifacts)
      - experiment_id: string (principle: stable experiment identity)
      - contract_version: string (principle: versioned evidence contract)
      - proof_execution_required_fields: list (principle: reproducible receipt evidence)
      - clean_rerun_required_fields: list (principle: no CPU fallback headline claim)
      - aggregate_required_fields: list (principle: methodology completeness)
      - gated_skip_required_fields: list (principle: skip artifacts remain auditable)
      - accepted_substrate_classes: list (principle: explicit inference substrate)
      - rejected_headline_substrate_classes: list (principle: no false headline claim)
      - terminal_verdict_prefixes: list (principle: conductor verdict discipline)
      - blocked_verdict_prefixes: list (principle: honest precondition failure)
      - downstream_unlock_fields: dict (principle: machine-readable gates)
      - honest_verdict: string (principle: terminal truthful verdict; must start with `complete:`)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp3193-llama-cpp-cuda-offload-health-probe-v1
    milestone: "2026.05.296"
    deliverable: "results/experiment_3193_llama_cpp_cuda_offload_health_probe_v1.json"
    title: "llama.cpp CUDA/offload health probe for mandated local SOTA GGUF receipts"
    priority: critical
    max_turns: 100
    model: opus
    estimated_wall_time_min: 45
    track: "local_sota"
    inference_substrate: "local_llama_cpp_cuda_or_blocked"
    requires_gpu: true
    prior_failures:
      - experiment_id: exp3179-local-sota-receipt-smoke-v3
        verdict: "complete: cpu_fallback_receipt_only_clean_rerun_allowed_false"
        addressed_by: "This run tests CUDA/offload health and records exact blocker classes instead of accepting CPU fallback as clean."
        retire_if_same_verdict: true
      - experiment_id: exp3165-local-sota-receipt-smoke-v2
        verdict: "blocked_gpu_substrate_or_cache_precondition"
        addressed_by: "The probe now records backend flags, n_gpu_layers, stderr tails, and cache state before attempting receipts."
        retire_if_same_verdict: true
      - experiment_id: exp3151-clean-sota-gguf-replay
        verdict: "blocked_or_flagged_duration_too_short_methodology_incomplete"
        addressed_by: "The v1 health probe separates loader health from verifier scoring and uses contract v4 fields."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The current top gap is full local SOTA receipt evidence. `.295` proved `llama_cpp` can load `unsloth/gemma-4-26B-A4B-it-GGUF`, but only through CPU fallback. This task must either produce clean CUDA/offload-backed receipts or a precise blocked substrate classification.

      MODEL_SPECS
      Use the mandated local SOTA GGUF set as candidates:
      - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
      - unsloth/gemma-4-31B-it-GGUF (flagship dense)
      - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE; `.295` CPU receipt proven)
      Legacy small models may be used only as loud CPU smoke controls and must not set headline fields.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - scripts/experiment_template.py
      - scripts/conductor_gates.py
      - results/experiment_3192_receipt_adversarial_contract_v4.json
      - results/experiment_3179_local_sota_receipt_smoke_v3.json
      - research-hardware-wishlist.md

      TASK
      Probe local CUDA/offload health for `llama_cpp` and the mandated GGUF cache. If a compliant path is available, run a tiny deterministic receipt panel and mark `clean_rerun_allowed=true`. If not, write a blocked artifact with exact blocker reasons and keep CPU fallback non-headline.

      CONCRETE STEPS
      1. Check `nvidia-smi`, CUDA visibility, Python CUDA availability where relevant, and `llama_cpp` backend/build metadata.
      2. Inspect the local Hugging Face cache for all three mandated GGUF model families and record available quant files without downloading large files unless existing project helpers already do so.
      3. Attempt the smallest safe live receipt on the best available mandated GGUF with explicit `n_gpu_layers` and backend settings.
      4. Record wall-clock, token counts, prompt hash, response hash, model-file hash, stderr/backend tail, GPU memory observations, and whether GPU layers were actually used.
      5. If CUDA/offload is unavailable, set `honest_verdict` to a blocked precondition state and do not claim clean verifier eligibility.
      6. Write `results/experiment_3193_llama_cpp_cuda_offload_health_probe_v1.json`.

      REQUIRED ARTIFACT FIELDS:
      - schema_version: string (principle: schema-versioned artifacts)
      - experiment_id: string (principle: stable experiment identity)
      - model_specs: list (principle: mandated SOTA GGUF compliance)
      - preconditions_checked: dict (principle: pre-launch resource discipline)
      - cache_inventory: list (principle: reproducible local model selection)
      - selected_model: string (principle: explicit model identity)
      - selected_model_file_hash: string|null (principle: receipt reproducibility)
      - llama_cpp_backend_metadata: dict (principle: substrate transparency)
      - n_gpu_layers_requested: int|null (principle: offload intent)
      - n_gpu_layers_effective: int|null (principle: offload evidence)
      - gpu_observations: dict (principle: hardware evidence)
      - receipt_count: int (principle: live-call accounting)
      - receipts: list (principle: proof-of-execution evidence)
      - substrate_classification: string (principle: no hidden CPU fallback)
      - clean_rerun_allowed: bool (principle: downstream gate safety)
      - headline_claim_allowed: bool (principle: no false headline claim)
      - blocker_reasons: list (principle: precise blocked precondition)
      - honest_verdict: string (principle: terminal truthful verdict; must start with `complete:` or `blocked_`)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

