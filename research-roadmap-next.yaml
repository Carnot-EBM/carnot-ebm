      TASK
      Define an executable live-runtime provenance contract for .306 SOTA GGUF evidence. Prefer a small checker or schema file if the repo has an obvious place for it; otherwise emit the contract inside the artifact with enough detail for downstream tasks to implement the checks.

      CONCRETE STEPS
      1. Specify required fields for model identity, cache path, model size, load timing, wall-clock duration, generated token count, command, CUDA visibility, GPU memory, and exact checker versions.
      2. Define duration floors and exceptions for CPU smoke tests versus headline live evidence.
      3. Define TAUTOLOGY guards for metrics that should be independently computed.
      4. Define repair substrate consistency rules shared by the repair panel and audit.
      5. Record the checker path if you create code; otherwise record the contract version and downstream implementation steps.

      REQUIRED ARTIFACT FIELDS:
