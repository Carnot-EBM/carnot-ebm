- id: exp7601-contract-methods
  title: Bind fourteen tasks and ingest qualified evidence methods
  phase: 1
  track: infrastructure
  priority: high
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 30
  per_unit_rows: true
  milestone: 2026.09.664
  deliverable: results/experiment_7601_v664_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  agent_type: codex
  model: gpt-5.6-sol
  prior_failures:
  - experiment_id: exp7600-capstone
    verdict: complete_blocked_required_v663_external_evidence
    addressed_by: New contract accounts for all absent producers and does not retry an aggregate benefit claim.
    retire_if_same_verdict: true
  operator_override: '2026-05-29 operator directive (standing): routine milestone transition vs exp7600; bind fourteen
    new dispositions without retrying missing V663 science.'
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.664. V663 has fourteen terminal dispositions, eight producer artifacts and a conductor pre-gate artifact. Evidence and guarded learning were unmeasured, ARC history support was insufficient, and Rust consumer speed failed its aggregate gate. The completed archive can lag; preserve the capstone and conductor evidence.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/python/carnot/reporting/experiment_7303_validation_scope.py
    - {project_root}/research-roadmap.yaml
    - {project_root}/research-complete.yaml
    - {project_root}/research-references.md
    - {project_root}/results/experiment_7600_v663_capstone.json
    - {project_root}/python/carnot/experiment_7587_v663_contract_methods.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/publication_gate.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7601_v664_contract_methods.json. Use scripts/experiments/experiment_7601_v664_contract_methods.py as a thin CLI over reusable behavior in python/carnot/experiment_7601_v664_contract_methods.py; add tests/python/test_experiment_7601_v664_contract_methods.py only for new behavior. Reuse existing receipt/reduction helpers.

    CONCRETE STEPS:
    1. Immediately emit a flushed progress line. Resolve {project_root} absolutely and authenticate the named inputs. Missing external inputs yield complete_blocked_<reason>, verdict_class=blocked and gate_check_summary with upstream, path, field, operator, expected and observed values; never partial for an unchanged external blocker.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER every model load, generation, benchmark and subprocess that can take minutes. Inside long loops print completed units and monotonic elapsed time every 60 seconds. Stream subprocess output and emit truthful pending-operation heartbeats every 60 seconds, including during model calls. Keep every gap below 600 seconds: silent work can die at 1200 seconds despite the 4800-second hard cap. Checkpoint completed units and terminate only owned processes.
    3. Bound every tool call. Write ANY file over about 200 lines in several tool calls of about 100-150 lines, with a progress message BETWEEN calls. Split source, tests, reads and validation into bounded calls. Put throwaway probes in /tmp, real CLIs in scripts/experiments and tests in tests/python. Reuse shipped modules; do not clone their full reporting and validation boilerplate.
    4. Before implementation, add the named REQ-* and meaningful SCENARIO-* items to the existing capability spec, write failing tests, then implement. Preserve historical artifacts, scientific determinations, production defaults and unrelated work. New output files are deliverables, never preconditions.
    5. Declare aggregation and MODEL_SPECS=[]. Add REQ-REPORT-7601. Select the staged or active authority whose milestone equals 2026.09.664. Compare exactly fourteen ordered IDs exp7601 through exp7614, titles, phases, deliverables, substrates and complete gates to the design table. Exercise removed-row, reordered-row, changed-path, misspelled-field and consumed-staging mutations. Do not activate or rewrite any roadmap.
    6. Preserve all fourteen V663 dispositions, including five absent producers, the Exp7590 pre-gate record and the blocked protocol. Record the planning selector check as a hypothesis about changed executable readiness, not a corrected historical artifact. Keep the eight actual producers separate from planned tasks.
    7. Read the V664 reference review and primary EAEV sections 3.3-3.6, KAN local-update method and the proper-loss papers. Write docs/research-notes/v664-method-map.md and update research-studying.md with method limits. Distinguish a guarded delayed learner from published U-Calibration; keep the spintronic and sparse-transformer repositories as future leads.
    8. Run schema, exclusion, prior-failure, gate, harness-fit, ARC-floor and overdue-priority guards on the selected authority. Preserve E0 as operator-blocked and E6 as resolved. Report fixed publication G1-G4 using scripts/publication_gate.py --json. This administrative task gates no scientific branch; numbered runtime E2E checks are not applicable.
    9. Freeze an affected-file validation manifest. Run scoped pytest -n 0 -o addopts= --no-cov, 100 percent changed-module coverage with a command-local COVERAGE_FILE, scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Pin PYTHONPATH to this worktree and create private /tmp parents before subprocesses. Never put test scratch output under protected results/. Never run an unscoped full suite or weaken an assertion to open readiness; report unrelated repository debt separately.
    10. Run the declared entrypoint and fresh-process cold replay. Run the task-specific E2E checks below; document non-applicability for read-only reporting. Save commands, exit codes, worktree and log hashes. Independently reduce all comparative rows, then run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Persist terminal reader outcomes and atomically publish the validated artifact. Readiness is null; oracle-defined fixture positives are circular_positive; empirical benefit needs its own passing gate.
    11. Reconcile changed specs, _bmad/traceability.md, ops/status.md and ops/changelog.md. Record exact scope retirement if the named prior verdict repeats; resource blocks do not retire the scientific hypothesis. No publication, submission, purchase, generator-weight change or default promotion. Do not modify the active research-roadmap.yaml.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: principle: Use a complete_ terminal prefix; completion alone is not scientific benefit.
    - verdict_class: principle: Exactly positive | circular_positive | null | blocked | disqualified | partial; partial means only unfinished work owned by this task.
    - flagged_adversarial: principle: Persist the terminal reader result; flagged evidence never opens readiness.
    - gate_check_summary: principle: Every blocked verdict names failed check, upstream, artifact path, exact field, operator, expected and observed value.
    - acceptance_gate_results: principle: Give each validity, readiness, benefit, retention and freshness gate a separate principle and result.
    - rows: principle: One row per independent unit and arm with absolute metrics, numerator, denominator, seed, direction, censoring and provenance; never aggregates alone.
    - sample_size_budget: principle: Record intended, observed, excluded and censored independent units; repeated seeds or windows never multiply groups or games.
    - inference_substrate: principle: Describe actual current execution; historical GPU evidence is not a current model call.
    - inference_substrate_class: principle: Record planned and actual class separately; blocked_no_run means no model work. Never pad a duration to satisfy a floor.
    - MODEL_SPECS: principle: Every current LLM call includes unsloth/Qwen3.8-27B-GGUF; no-model tasks use [] and name historical identity separately.
    - invocation_counts: principle: Count current loads, forward calls, generation calls and input/output tokens separately from history.
    - duration_s: principle: Measure current monotonic elapsed time and phase spans; no inherited or invented work.
    - random_seed: principle: Persist every stochastic stage seed.
    - reproducibility_checksum: principle: Bind configuration, immutable raw evidence and reduction.
    - source_artifact_hashes: principle: Distinguish producer artifacts, conductor pre-gate records and missing producers.
    - validation_receipts: principle: Bind actual commands, exits, log hashes and terminal independent readers.
    - verifier_is_oracle: principle: Exact fixtures cannot establish learned semantic correctness or an oracle-distinct gain.
    - field_principles: principle: Carry the one-line principles into the artifact beside the governed fields.
    - contract_ready_score: principle: 1 only for exact fourteen-row agreement and passing mutation/guard checks.
    - v663_dispositions: principle: Fourteen rows distinguish actual producer, pre-gate artifact and absent producer.
    - method_map_path: principle: Bind methods actually read to new work and deferred leads.
    - publication_gates: principle: Use stable G1-G4, paper_ready and unmet_gates without redefining them.

    Run command: cd {project_root} && PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7601_v664_contract_methods.py --root {project_root} --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
