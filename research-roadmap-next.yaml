- id: exp855-preflight-v15
  milestone: 2026.04.66
  deliverable: results/experiment_855_preflight_v15.json
  title: 'Exp 855: Pre-flight v15 — Permanent LIVE-ENV Fix + RETRO Audit (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Milestone 2026.04.65 completed (Exps 843-854). 4 of 13 success criteria met.
    Key outcomes: RETRO-ARBITER-FLAT-ENERGY CLOSED (Exp 846, accuracy_standard=1.0).
    RETRO-GGUF-CACHE-IMPORT CLOSED (Exp 849, GGUFCacheResolver implemented).
    BUT: RETRO-LIVE-ENV-NOT-PROPAGATED opened (Exp 853, RETRO-015 sixth recurrence).
    RETRO-ICE40-N16-UNEXPECTED-EXPANSION opened (Exp 851, 12258 LCs at P&R vs 2 at synthesis).
    RETRO-SOTA-MODEL-DOWNLOAD opened (Exp 850, resolver exists but download not implemented).
    Wall-time REGRESSION SIXTH CONSECUTIVE (+78 min). Experiment count 772, 72 over cap.
    manifest_fix_patch.txt unapplied SEVEN consecutive milestones. DualGPURunner STILL
    never deployed in production path. 10 open RETROs going into .66.

    The LIVE-ENV root cause: apply_env_autofix() sets env in the current process but
    'claude -p' creates a NEW process tree that does not inherit the outer shell's
    environment. The permanent fix requires writing CARNOT_FORCE_LIVE=1 to a session
    file (~/.carnot_session_env) that every experiment sources at startup via
    ExperimentTemplate.__init__. A hard assert blocks GPU experiments if CARNOT_FORCE_LIVE
    is not set when GPU is detected.

    EXISTING CODE TO READ FIRST:
    - results/operational_retro_2026_04_65.json — full .65 retro, open_retros, wall_time
    - results/experiment_854_milestone_retro.json — if retro artifact has different name
    - results/experiment_849_gguf_cache.json — GGUFCacheResolver implementation details
    - results/experiment_853_live_benchmark_v4.json — LIVE-ENV failure root cause
    - MILESTONE_PREREQS.md — current prereqs doc (update for .66)
    - python/carnot/experiment_template.py — ExperimentTemplate.apply_env_autofix()
    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc

    TASK: Implement EnvPropagationGuard permanently into ExperimentTemplate. Audit all 10
    open RETROs. Update MILESTONE_PREREQS.md for .66. Produce pre-flight artifact with
    live_env_fixed=True gating downstream GPU experiments.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/operational_retro_2026_04_65.json (or experiment_854 equivalent).
       Extract: open_retros (10), retros_closed (RETRO-ARBITER-FLAT-ENERGY, RETRO-GGUF-CACHE-IMPORT),
       wall_time_minutes, experiment_count.
    3. Read python/carnot/experiment_template.py. Find apply_env_autofix().
       Note current implementation — it likely sets os.environ but doesn't write to disk.
    4. Implement EnvPropagationGuard in python/carnot/experiment_template.py:
       a. Add method EnvPropagationGuard.write_session_env(vars: dict) that writes
          key=value lines to ~/.carnot_session_env.
       b. Add method EnvPropagationGuard.load_session_env() that reads ~/.carnot_session_env
          and applies each key=value to os.environ (only if not already set).
       c. In ExperimentTemplate.__init__, call EnvPropagationGuard.load_session_env()
          as the FIRST action (before any other setup).
       d. In apply_env_autofix(), after setting os.environ["CARNOT_FORCE_LIVE"]="1",
          also call EnvPropagationGuard.write_session_env({"CARNOT_FORCE_LIVE": "1"}).
       e. Add method ExperimentTemplate.assert_live_env_if_gpu() that:
          - Checks if requires_gpu=True for this experiment
          - If GPU required AND CARNOT_FORCE_LIVE not in os.environ:
            raise RuntimeError("LIVE-ENV not propagated: EnvPropagationGuard failed")
          - Call this from setup() before setup_gpu().
    5. Write spec update: openspec/capabilities/verify-repair/spec.md — add REQ-INFRA-070
       "ExperimentTemplate MUST load ~/.carnot_session_env at __init__ to propagate
       CARNOT_FORCE_LIVE across claude -p subprocess boundaries."
       Add SCENARIO-INFRA-080: "Given a GPU experiment launched via claude -p, CARNOT_FORCE_LIVE
       must be present in os.environ after __init__ completes."
    6. Read or create MILESTONE_PREREQS.md. Add section "## Milestone 2026.04.66 Pre-flight":
       - Open RETROs (10): RETRO-MANIFEST-FULL-SCOPE, RETRO-JEPA-OOD, RETRO-CONSTRAINT-ZERO-DELTA,
         RETRO-XILINX-TOOLS-UNAVAILABLE, RETRO-ISING-INJECTION-NO-DISCRIMINATION,
         RETRO-SVAMP-ZERO-AUC, RETRO-ICE40-PNR-LUT-OVERFLOW, RETRO-SOTA-MODEL-DOWNLOAD,
         RETRO-ICE40-N16-UNEXPECTED-EXPANSION, RETRO-LIVE-ENV-NOT-PROPAGATED.
       - Closed in .65: RETRO-ARBITER-FLAT-ENERGY (Exp 846), RETRO-GGUF-CACHE-IMPORT (Exp 849).
       - Key assertions for .66 experiments:
         * EnvPropagationGuard.load_session_env() called at ExperimentTemplate.__init__
         * assert CARNOT_FORCE_LIVE in os.environ (GPU experiments only: 857, 858)
         * assert gguf_cache_resolver.can_download == True (Exp 857)
         * assert n_svamp_pairs >= 15 (JEPA training if any)
       - IMMEDIATE actions before .66 experiments run (human):
         * Apply manifest_fix_patch.txt to research_conductor.py (SEVENTH request)
         * Retire Exp 786, 527, 627-old per retirement_plan.md
       - Experiment cap: .66 cycle = 13 new experiments only (855-867).
    7. Create scripts/experiment_855_preflight_v15.py using ExperimentTemplate(855).
       tmpl = ExperimentTemplate(855, "Pre-flight v15 LIVE-ENV fix",
                                  "results/experiment_855_preflight_v15.json",
                                  requires_gpu=False)
       tmpl.setup()
       Collect:
         - live_env_fixed: True if EnvPropagationGuard.write_session_env and
           load_session_env both implemented and ~/.carnot_session_env written
         - open_retros_count: 10
         - retros_confirmed_closed: ["RETRO-ARBITER-FLAT-ENERGY", "RETRO-GGUF-CACHE-IMPORT"]
         - prereqs_updated: True if MILESTONE_PREREQS.md updated
         - env_guard_deployed: True if ExperimentTemplate.__init__ sources session env
       honest_verdict:
         - "governance_ready" if live_env_fixed=True AND env_guard_deployed=True
           AND prereqs_updated=True
         - "governance_partial" otherwise (describe what's missing)
       Build artifact and write results/experiment_855_preflight_v15.json.
    8. Write tests/python/test_experiment_855_preflight_v15.py with 100% coverage.
       Test EnvPropagationGuard.write_session_env() writes correct format.
       Test EnvPropagationGuard.load_session_env() reads and applies to os.environ.
       Test assert_live_env_if_gpu() raises RuntimeError when env not set.
       Traces to REQ-INFRA-070 (new), SCENARIO-INFRA-080 (new).
    9. Reconcile:
       - ops/changelog.md: one-line entry
       - ops/status.md: "Exp 855: EnvPropagationGuard deployed. live_env_fixed=True.
         ~/.carnot_session_env wired into ExperimentTemplate.__init__. 10 RETROs open."
    10. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_855_preflight_v15.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp856-dualgpu-production
  milestone: 2026.04.66
  deliverable: results/experiment_856_dualgpu_production.json
  title: 'Exp 856: DualGPURunner Production Deployment — Wire into VerifyRepair + ThreeTier (CPU+GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Exp 685 validated DualGPURunner at 1.96x throughput. Every milestone since .57
    has noted "DualGPURunner NEVER deployed in production path" in the retro. This is the
    single highest-impact unimplemented improvement. Exp 856 wires DualGPURunner into
    VerifyRepairPipeline.verify() and ThreeTierPipeline so downstream GPU experiments
    (857, 858) can use parallel GPU inference. This experiment runs CPU for the wiring
    work; GPU validation synthetic benchmark runs if hardware is available (non-blocking).

    EXISTING CODE TO READ FIRST:
    - results/experiment_685_dualgpu_runner.json — DualGPURunner validation (1.96x throughput)
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline.verify() — find serial GPU calls
    - python/carnot/pipeline/three_tier.py — ThreeTierPipeline — find serial GPU calls
    - python/carnot/gpu/dual_runner.py — DualGPURunner implementation (or closest equivalent)
    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc Gap 2 section

    TASK: Wire DualGPURunner into VerifyRepairPipeline and ThreeTierPipeline. Add
    DUAL_GPU_ENABLED flag. Run a 25-question synthetic validation if GPU available.
    Produce artifact with dual_gpu_deployed=True gating Exps 857-858.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_685_dualgpu_runner.json.
       Extract: throughput_ratio (expected 1.96x), which models were parallelized,
       what the API surface is (likely DualGPURunner.run_parallel(questions, models)).
    3. Read python/carnot/pipeline/verify_repair.py.
       Find the section where GPU inference runs (likely a call to a model loader or
       LLM inference function). Note line numbers.
    4. Read python/carnot/pipeline/three_tier.py similarly.
    5. Implement wiring in VerifyRepairPipeline:
       a. Add class attribute: DUAL_GPU_ENABLED = os.getenv("CARNOT_DUAL_GPU", "0") == "1"
       b. In verify(): if DUAL_GPU_ENABLED and self.has_second_model():
            results = DualGPURunner(gpu_ids=[0,1]).run_parallel(questions, models)
          else:
            results = self._serial_verify(questions)
       c. Add has_second_model() helper that returns True if two model configs are loaded.
    6. Implement wiring in ThreeTierPipeline analogously.
    7. Add spec update: openspec/capabilities/verify-repair/spec.md — add REQ-GPU-010
       "VerifyRepairPipeline MUST support CARNOT_DUAL_GPU=1 to route GPU inference through
       DualGPURunner when two model configs are loaded."
       Add SCENARIO-GPU-020: "Given CARNOT_DUAL_GPU=1 and two RTX 3090s, pipeline must
       achieve throughput_ratio >= 1.5x vs serial baseline."
    8. Create scripts/experiment_856_dualgpu_production.py using ExperimentTemplate(856).
       tmpl = ExperimentTemplate(856, "DualGPURunner production deployment",
                                  "results/experiment_856_dualgpu_production.json",
                                  requires_gpu=False)
       tmpl.setup()
       Wiring validation (CPU, always runs):
         - Import DualGPURunner; confirm it's importable and has run_parallel().
         - Import VerifyRepairPipeline; confirm DUAL_GPU_ENABLED attribute exists.
         - Import ThreeTierPipeline; confirm DUAL_GPU_ENABLED attribute exists.
         - dual_gpu_wired = True if all three assertions pass.
       GPU throughput validation (optional, if torch.cuda.device_count() >= 2):
         - Run 25 synthetic yes/no questions with CARNOT_DUAL_GPU=1.
         - Measure parallel_time_s vs serial_time_s.
         - throughput_ratio = serial_time_s / parallel_time_s.
         - gpu_validated = throughput_ratio >= 1.5 (or "no_gpu" if skipped).
       Collect:
         - dual_gpu_deployed: True if dual_gpu_wired=True
         - throughput_ratio: float or "no_gpu"
         - verify_repair_wired: True/False
         - three_tier_wired: True/False
       honest_verdict:
         - "deployed" if dual_gpu_wired=True
         - "wired_no_gpu" if wired but GPU unavailable for validation
         - "partial" otherwise
       Build artifact and write results/experiment_856_dualgpu_production.json.
    9. Write tests/python/test_experiment_856_dualgpu_production.py with 100% coverage.
       Mock DualGPURunner.run_parallel() to avoid needing real GPUs.
       Test DUAL_GPU_ENABLED flag respected.
       Test has_second_model() returns correct value.
       Traces to REQ-GPU-010 (new), SCENARIO-GPU-020 (new).
    10. Reconcile:
        - ops/changelog.md: one-line entry
        - ops/status.md: "Exp 856: DualGPURunner wired into VerifyRepairPipeline and
          ThreeTierPipeline. CARNOT_DUAL_GPU=1 flag live. throughput_ratio={result}."
    11. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_856_dualgpu_production.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp857-sota-code-repair-v6
