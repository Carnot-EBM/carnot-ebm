# false-positive (a 25s verifier-scoring artifact that still declared GGUF/CUDA model_specs) -- so the operator
# has no clean package to act on; the same hygiene bug flagged the exp3689 capstone. (2) the discrimination-vs-
# selection diagnosis (exp3682) was DEGENERATE: TAUTOLOGY-flagged, per_candidate_auroc collapsed to 0.555, all
