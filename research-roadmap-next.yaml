      ACCEPTANCE GATE:
        - condition: "a reproducing checkpoint exists AND reproduced_exact_accuracy is reported (matches_published_087 True is the target; an honest below-target number is still COMPLETE)"
          principle: "A persisted reproducing baseline is the deliverable; faithfulness to 0.87 is the target but an honest partial reproduction still gives exp4109 something real to build on."

  - id: exp4109-carnot-verifier-graft-sudoku
    milestone: 2026.06.380
    title: "GRAFT the Carnot Sudoku verifier onto the reproducing baseline (the payoff). DEFENSIVE read of exp4108: on the reproducing TRM checkpoint, use the EXECUTABLE Sudoku verifier (row/col/box validity) as (A) a reranker over the TRM's candidate solutions and (B) a reward for verifier-certified RFT/SFT, with the A-vs-B de-confound (A=verifier-certified vs B=vote-certified, same TRM, same pool, N-matched). Measure held-out exact-accuracy lift vs cold baseline and vs the ablation. This is verifier-as-reward tested where the verifier provably DISCRIMINATES (unlike .379's ARC grids)."
    priority: high
    track: verifier-as-reward
    max_turns: 120
    agent_type: codex
    model: gpt-5.5
    operator_override: "2026-05-29 operator directive (standing) auto-override class 3 (versioned-lineage continuation) + 2026-06-12 operator directive (this session): graft the Carnot verifier-as-reward onto a reproducing TRM baseline — false-positive scope-match vs retired exp4089/exp4100 (TRM-RFT); forward difference = (a) built on a REPRODUCING nano-trm baseline (not a broken trainer), (b) on SUDOKU where the verifier is an exact executable check, addressing exp4099's finding that the verifier anti-discriminates on ARC grids, (c) A-vs-B de-confound isolates the verifier label."
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4109_carnot_verifier_graft_sudoku.json
    prompt: |
      CONTEXT: exp4099 showed the verifier anti-discriminates on non-executable TRM ARC grids. On
      Sudoku the verifier is an EXACT executable check (a candidate is a valid solution or not), so
      it should discriminate. exp4108 gives a reproducing TRM baseline at ~0.87 (some headroom).
      Test whether the verifier IMPROVES the baseline.

      CONCRETE STEPS:
        0. PRECONDITIONS: read results/experiment_4108_*.json for the checkpoint_path. If no
           reproducing checkpoint exists, fall back to exp4107's smoke checkpoint and report the
           limitation honestly (do NOT hard-block). CUDA available.
        1. RERANK arm: sample K candidate solutions per held-out puzzle from the TRM; rerank by the
           executable Sudoku verifier (constraint-satisfaction count / exact-validity). Measure
           pass@1 lift vs TRM-vote and vs the oracle ceiling, bootstrap CI.
        2. RFT/SFT arm (the de-confound): build A = verifier-certified corpus (keep verifier-valid
           samples) and B = vote-certified corpus (TRM majority), N-matched, same TRM. Full-FT/RFT
           the TRM via nano-trm's native trainer on each; measure held-out exact-accuracy. THE
           LOAD-BEARING CONTRAST is A vs B (verifier LABEL vs vote LABEL), bootstrap CI95 excl 0.
           CHECKPOINT + PRINT-PROGRESS.
        3. Report rerank lift, A-vs-B delta, and A-vs-cold lift.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. An honest A~=B (verifier adds nothing even where it discriminates, e.g. base near ceiling) is a COMPLETE, decision-grade verdict."
        rerank_lift_vs_vote:
          principle: "pass@1 lift from verifier-reranking vs TRM-vote with CI; confirms the executable verifier discriminates on Sudoku (the contrast to .379's ARC-grid anti-discrimination)."
        rft_vs_ablation_delta:
          principle: "The de-confounded A-vs-B held-out delta with CI: isolates the verifier LABEL's training contribution from generic self-training."
        verifier_value_added:
          principle: "Bare bool: did the verifier graft beat the vote ablation (A>B, CI-excl-0)? The milestone's headline answer on whether verifier-as-reward is real on an executable domain."
        preconditions_checked:
          principle: "Records the checkpoint + CUDA verified; pre-empts the silent-missing-resource fabrication mode."
        random_seed:
          principle: "Determinism precondition for reproducing the graft."
        reproducibility_checksum:
          principle: "Hash of the corpus + split; catches silent drift."
      ACCEPTANCE GATE:
        - condition: "rerank_lift_vs_vote reported (CI) AND rft_vs_ablation_delta reported (CI); verifier_value_added True (A>B) validates verifier-as-reward on an executable domain, A~=B is an honest null"
          principle: "Either a clean A>B (verifier label carries training signal where the verifier discriminates) or a clean A~=B (it does not, even with a perfect executable verifier — likely near-ceiling) is decision-grade. The only failure is producing neither."

