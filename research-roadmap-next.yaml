- id: exp883-vjepa-v2-expanded-corpus
  milestone: 2026.04.68
  deliverable: results/experiment_883_vjepa_v2_expanded_corpus.json
  title: 'Exp 883: VJEPA v2 — Expanded Synthetic Corpus + 200 Epochs (RETRO-JEPA-OOD) (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: VJEPA (Exp 877) achieved tier3_seed_viable with OOD AUC > 0.55 and KL > 0.
    This is superior to all 10 discriminative JEPA retrains (best: 0.571). The path forward
    is to scale VJEPA, not fight discriminative JEPA. The limiting factor is corpus size:
    only 57 real FoVer pairs. This experiment expands to 207+ pairs by generating synthetic
    step-level labels from Qwen3.5-0.8B GSM8K completions vs ground truth answers
    (inspired by arxiv 2604.17957 automatic step-level reward data generation).

    prior_failures:
      - experiment_ids: [exp783, exp799, exp804, exp809, exp825, exp834, exp872]
        verdict: jepa_still_below_random_or_marginally_above
        addressed_by: "Switched from discriminative JEPA to VariationalJEPAPredictor (Exp 877
                       showed KL regularization prevents OOD collapse). Expanding corpus from
                       57 real pairs to 207+ synthetic pairs via GSM8K ground-truth labeling."

    EXISTING CODE TO READ FIRST:
    - results/experiment_877_vjepa_predictor.json — seed experiment results (ood_auc, kl_magnitude)
    - python/carnot/models/vjepa_predictor.py — VariationalJEPAPredictor (from Exp 877)
    - results/fover_labeled_steps_live.json — real training pairs (57 pairs)
    - results/experiment_872_jepa_v25_dg_prm.json — DG-PRM domain weighting pattern
    - openspec/change-proposals/research-roadmap-v68.md — .68 Phase 2

    TASK: Expand corpus via synthetic labeling. Retrain VJEPA for 200 epochs.
    Target: OOD AUC > 0.60 (deployment gate), ideally > 0.65 (RETRO-JEPA-OOD closure).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_877_vjepa_predictor.json. Note: in_dist_auc, ood_auc, kl_magnitude.
    3. Read python/carnot/models/vjepa_predictor.py. Note VariationalJEPAPredictor architecture.
    4. Generate synthetic training pairs (CPU, no GPU needed):
       Produce 100 synthetic GSM8K-style step pairs. Pattern:
         a. Write a math problem with N steps of arithmetic reasoning.
         b. Mark one step as incorrect (arithmetic error injected).
         c. Label correct steps as label=0, incorrect step as label=1.
       Use deterministic generation: seed=42, N=5-7 steps per problem.
       Domain tag: "gsm8k_synthetic".
       Add 30 ARC-style logical reasoning chain pairs (label correct/incorrect steps).
       Add 20 SVAMP-style word problem pairs (same approach).
       Total synthetic: 150 pairs. Combined with 57 real FoVer: 207 pairs.
    5. Apply DomainReweightedLoss (from Exp 872 / python/carnot/models/jepa_predictor.py):
       Weight per domain = 1.0 / (n_domain + 1e-6), normalized. Upweight rare domains.
    6. Train VariationalJEPAPredictor for n_epochs=200 (vs 100 in Exp 877).
       Use lr=0.001, Adam optimizer. Monitor: vjepa_loss, kl_magnitude per epoch.
       Save to results/vjepa_predictor_v2.safetensors.
    7. Evaluate:
       - in_dist_auc: AUC on held-out GSM8K pairs (80/20 split)
       - ood_auc: AUC on held-out ARC pairs (zero training examples)
       - svamp_auc: AUC on held-out SVAMP pairs
       - kl_magnitude: mean KL term (must be > 0.01 to confirm no collapse)
       - uncertainty_calibration: correlation(prediction_entropy, actual_error_rate)
    8. honest_verdict:
       - "vjepa_ood_above_gate" if ood_auc > 0.65 AND kl_magnitude > 0.01
       - "vjepa_ood_deployable" if ood_auc in (0.60, 0.65] AND kl_magnitude > 0.01
       - "vjepa_improved_below_gate" if ood_auc > 0.55 (improvement from Exp 877) AND ood_auc <= 0.60
       - "vjepa_v2_collapsed" if kl_magnitude < 0.01
       - "vjepa_v2_regressed" if ood_auc < Exp877.ood_auc (regression)
    9. Add spec entries: REQ-VERIFY-145 (VJEPA v2 expanded corpus training),
       SCENARIO-VERIFY-171/172.
    10. Build artifact and write results/experiment_883_vjepa_v2_expanded_corpus.json.
        Include: in_dist_auc, ood_auc, svamp_auc, kl_magnitude, n_training_pairs,
                 corpus_breakdown (dict), model_path, honest_verdict.
    11. Write tests/python/test_experiment_883_vjepa_v2_expanded_corpus.py with 100% coverage.
        Test synthetic pair generator produces correct labels.
        Test DomainReweightedLoss with 4 domains.
        Test train/eval split is reproducible. Traces to REQ-VERIFY-145.
    12. Reconcile: ops/changelog.md, ops/status.md.
    13. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_883_vjepa_v2_expanded_corpus.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

