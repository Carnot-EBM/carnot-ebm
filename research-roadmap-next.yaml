      - {project_root}/python/carnot
      - {project_root}/tests/python
      - {project_root}/openspec/capabilities

      TASK:
      Implement and evaluate a two-timescale exact-gated controller and emit results/experiment_5584_two_timescale_exact_self_learning.json.

      CONCRETE STEPS:
      1. Reuse the shipped causal-memory and active-spline components; do not introduce LLM inference or model-weight training.
