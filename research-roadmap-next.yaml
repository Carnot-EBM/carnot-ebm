  - id: exp4582-a3
    milestone: 2026.06.423
    title: 'PHASE A3 (ARC NORTH STAR; operator MANDATORY; FRONTIER -- THE SEEN->HIDDEN TRANSFER) -- the
      feature-ROUTER: classify a game''s MECHANIC from EARLY-PLAY features (keyboard-avatar-moves? clicks-connect-
      cells? hidden-carry-state? config-toggle?) and ROUTE to the matching general approach already in the toolkit
      (diversity-on-stall [shipped], systematic BFS, goal-distance A*, LLM-reasoner). Extend
      arc_solve_learning.recommend_approach with the early-play classifier; learn it from the self-play loop''s
      pos/neg traces. Measure generic_transfer over variants WITH router vs WITHOUT (baseline 0.04) + ACTION cost,
      vs a random-route control. verifier_is_oracle: false. retire_if_same_verdict.'
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4582_feature_router_transfer.json
    prior_failures:
      - experiment_id: exp4569-a2
        verdict: 'complete: verifier_guided_expansion_no_value_honest_null_generation_gap_sharpened'
        addressed_by: 'exp4569 (.422 A2) wired the learned verifier as the best-first EXPANSION priority and got
          transfer_delta=-0.04 (WORSE) with a BROKEN positive control (positive_control_passed=None) -- and the
          2026-06-21 outer-loop separately found value-head best-first expansion REGRESSED (2/11 vs the diversity
          floor 4/11, paying a reset-replay navigation tax). This task changes the MECHANISM entirely: NOT a
          value-head search-priority, but a FEATURE-ROUTER that classifies a game''s mechanic from early-play
          features and selects WHICH general approach (diversity/BFS/A*/toolkit) to run -- the seen->hidden
          transfer per-game recipes cannot do (SkillRouter arXiv:2603.22455). It measures ACTION cost (not just
