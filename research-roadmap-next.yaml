  - id: exp4197-verifier-reward-phase0-headroom-harness-build
    milestone: 2026.06.389
    title: "PHASE A1 (BUILD) -- Verifier-as-reward Phase-0 gate + Youden-J + training-headroom + gen-suitability precheck on CODE, and BUILD the on-policy 3-corpus LoRA-RFT harness. On a code corpus (MBPP/HumanEval/EvalPlus/LiveCodeBench-lite, all cached) with a NON-Qwen trainable base (gemma-4-12B-it or gemma-4-E4B-it; MiniCPM5-1B fallback -- Qwen is FORBIDDEN as the trained base per the Spurious-Rewards confound arXiv:2506.10947), MEASURE: (a) Phase-0 certification precision P(hidden-pass|visible-perfect) BARE (>=0.85); (b) Youden J=TPR-FPR BARE (>0, arXiv:2601.04411); (c) training_headroom_present BARE bool (base hidden-pass < ~0.6); (d) gen-suitability (base emits enough visible-perfect own-traces + truncation<5%). Pick the (base,corpus) operating point where ALL hold (or honest decision-grade block). WRITE + smoke + commit the on-policy 3-arm runner. NO TRM."
    priority: high
    track: verifier-reward
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    inference_substrate: live_llm_inference
    deliverable: results/experiment_4197_verifier_reward_phase0_headroom_harness_build.json
    prior_failures:
      - experiment_id: exp4159-decisive-verifier-reward-graft
        verdict: graft_deferred_baseline_below_0.85
        addressed_by: "exp4159 ran on the GRID/Sudoku domain where Phase-0 failed (base 0.501 < 0.85, ZERO demo-perfect coverage). This attempt runs on CODE, where the SAME shared execution verifier certifies at precision 0.96 (exp4093) and has Youden J>>0 (exact output-match) -- the precondition the noisy grid content-EBM lacked. The precheck MEASURES Phase-0 + J + headroom and honestly blocks if no code operating point clears."
        retire_if_same_verdict: true
      - experiment_id: exp4100-trm-verifier-rft-conditional
        verdict: trm_native_trainer_checkpoint_ok_smoke_only_no_verifier_grid_discrimination
        addressed_by: "exp4100 found no verifier discrimination on the TRM GRID latent. This attempt does NOT touch TRM or grids -- it trains a separate small code base on an EXECUTION-verified code corpus where the verifier's discrimination (visible-perfect predicts hidden-pass) is measured at 0.96, not chance."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: The operator's 2026-06-11 TOP-PRIORITY PIVOT is verifier-as-REWARD (train a model), not
      -as-SELECTOR. It kept BLOCKING on the Phase-0 precision gate on GRIDS (exp4159: base 0.501 < 0.85, 0
      demo-perfect coverage; exp4100: no grid discrimination). It is executable on CODE: the SAME shared
      execution primitive certifies code at precision 0.96 (exp4093) -- an EXACT, un-hallucinating signal with
      Youden J=TPR-FPR>>0, the arXiv:2601.04411 precondition. The 2026 literature makes the de-confounded
      A-vs-B the OPEN question (arXiv:2506.10947 Spurious-Rewards: random labels recover ~74% of RLVR gains ON
      QWEN, failing on Llama/OLMo -> a NON-Qwen base + same-generator random-label ablation is MANDATORY). This
      A1 task establishes the operating point and BUILDS the harness; A2 runs it.

      EXISTING CODE TO READ FIRST:
        - python/carnot/verify/sandbox.py (restricted exec) + python/carnot/agentic/arc_gap4_execution_verifier.py (the shared demo-fit/content-hash execution verifier -- REUSE, do NOT write a code-specific verifier)
        - results/experiment_4093_offarc_demofit_precision_transfer.json (exec-verifier precision 0.96 on code)
        - results/experiment_1999_code_verification_humaneval.json (a code pool with headroom: base 0.66)
        - scripts/experiments/process_reward_weighted_sft_onpolicy_draft.py (the on-policy RFT harness to adapt -- LoRA, truncation-instrumented)
        - scripts/experiment_template.py (cached_sota_pair() -> SOTA GGUF .gguf path; CLAUDE.md GGUF tokenizer rule -- load via .gguf, NOT AutoTokenizer)
        - research-references.md ".389 planning sweep" (arXiv:2506.10947, 2601.04411, 2509.20837, 2410.02089, 2601.12186)
        - ops/known-issues.md TRUNCATION GUARD + GENERATION-SUITABILITY PRECHECK + GOLD-CONTROL GATE disciplines

      TASK: measure the Phase-0 / Youden-J / headroom / gen-suitability operating point on CODE + a NON-Qwen
      base, and BUILD (write+smoke+commit) the on-policy 3-arm LoRA-RFT runner.

      CONCRETE STEPS:
        0. PRECONDITIONS (check BEFORE any subsequent step):
           a. A NON-Qwen trainable base is cached: `ls ~/.cache/huggingface/hub/models--google--gemma-4-12B-it/`
              (or gemma-4-E4B-it, or openbmb/MiniCPM5-1B). If NONE cached -> honest_verdict
              `blocked_no_nonqwen_base_cached` and STOP. (Qwen bases are FORBIDDEN as the TRAINED base per the
              spurious-reward confound; Qwen GGUF as an off-policy teacher arm is fine.)
           b. CUDA available: `python3 -c "import torch; assert torch.cuda.is_available()"`. Else -> `blocked_cuda_unavailable`, STOP.
           c. A code corpus loadable (cached: MBPP, HumanEval, EvalPlus, LiveCodeBench-lite) AND the restricted-exec sandbox importable. Else -> `blocked_code_corpus_or_sandbox_missing`, STOP.
        1. Phase-0 + Youden-J: on a labeled held-out code slice, run the base's K candidates per task through
           the EXECUTION verifier on VISIBLE example tests; for the visible-perfect (certified) candidates
           measure P(hidden-test-pass | visible-perfect) = certification precision, and TPR/FPR of the verifier
           vs hidden-pass ground truth. Emit phase0_precision BARE (plain float) and youden_j BARE (plain
           float). Per CLAUDE.md gated-fields-must-be-bare: NOT {{value,principle}} dicts.
        2. Training-headroom + gen-suitability: report the base's greedy hidden-test pass rate on the EVAL
           split (training_headroom_present BARE bool := base_passrate < ~0.6 with non-trivial >0), the
           own-sample visible-perfect rate (enough to bootstrap a corpus), the gen truncation_rate (<5%) and
           no_answer_rate. Pick the (base, corpus, K, max_new_tokens) operating point where Phase-0>=0.85 AND
           J>0 AND headroom AND gen-suitable. If NO point clears -> honest_verdict
           `complete_verifier_reward_no_code_operating_point_<reason>` (a decision-grade bound) and set
           harness_ready=false.
        3. BUILD the on-policy 3-arm runner (adapt process_reward_weighted_sft_onpolicy_draft.py): per task the
           base generates K traces -> execution verifier labels visible-perfect (Arm A certified) / non-perfect
           or randomly-relabeled same-generator traces (Arm B = the spurious-reward control, |B|=|A|) /
           hidden-test-gold (Arm C) -> identical-config LoRA-SFT each arm + Arm D cold base. Held-out
           hidden-test eval with the truncation guard. SMOKE on 2 tasks (no full train), commit the runner,
           set harness_ready=true.
      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Terminal-prefixed. A clean operating point + a built harness is COMPLETE; an honest 'no code point clears Phase-0/headroom' is ALSO COMPLETE and decision-grade (bounds the pivot)."
        phase0_precision:
          principle: "BARE float P(hidden-pass|visible-perfect) -- A2's gate compares this raw value; a principle-dict would break the gate (gated-fields-must-be-bare). >=0.85 = the verifier's label is clean enough to train on."
        youden_j:
          principle: "BARE float TPR-FPR of the execution verifier vs hidden-pass -- the arXiv:2601.04411 precondition (J>0 -> noise only rescales convergence; J<=0 -> anti-learning). An exact execution verifier should show J>>0, the property the noisy grid content-EBMs lacked."
        training_headroom_present:
          principle: "BARE bool: base hidden-pass < ~0.6 (room for RFT to lift) -- without headroom no method can lift, the null is uninformative (FALSE_NEGATIVE_RISK)."
        harness_ready:
          principle: "BARE bool: the on-policy 3-arm runner is written, smoke-passed, and committed; A2 needs it to launch the decisive training."
        operating_point:
          principle: "{{base, corpus, K, max_new_tokens, base_passrate, own_visible_perfect_rate, truncation_rate}} -- the reproducible config A2 trains on; truncation_rate<5% required (the silent-corruptor guard)."
        model_specs:
          principle: "The NON-Qwen trainable base + any SOTA GGUF certification reference; required methodology for a live-LLM artifact."
        random_seed:
          principle: "Determinism precondition; torch generation seeded so the corpus build is reproducible."
        reproducibility_checksum:
          principle: "Content hash of the corpus + base + config; catches silent corpus/model drift before A2 trains on it."
      ACCEPTANCE GATE:
        - condition: "phase0_precision emitted BARE AND youden_j emitted BARE AND harness_ready true with training_headroom_present true, OR an honest no-operating-point / blocked_* verdict"
          principle: "A2's decisive A-vs-B test needs a clean label (Phase-0>=0.85), a learnable signal (J>0), room to lift (headroom), and a working harness; absent any, honestly block rather than train on a poisoned/saturated corpus."

      Run: `python3 results/experiment_4197_verifier_reward_phase0_headroom_harness_build.py`
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4198-verifier-reward-3arm-rft-launch
    milestone: 2026.06.389
    title: "PHASE A2 (LAUNCH, gated_on A1 phase0_precision>=0.85 AND harness_ready) -- launch the de-confounded 3-arm on-policy LoRA-RFT on the A1 operating point, BACKGROUNDED (resume-not-restart, setsid-detach, per-arm checkpoint, ~75-min window). Arm A = verifier-certified (visible-test-perfect own-traces); Arm B = SAME-generator random-label / non-certified traces |B|=|A| (the Spurious-Rewards arXiv:2506.10947 control); Arm C = hidden-test-gold (oracle SFT); Arm D = cold base. Identical LoRA config; held-out hidden-test eval with the truncation guard (<5%). Do NOT hold the agent past the 80-min cap -- launch + checkpoint, A3 collects. NO TRM."
