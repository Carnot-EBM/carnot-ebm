- id: exp1209-grpo-vps-step-level-supervision
  milestone: 2026.04.94
  deliverable: results/experiment_1209_grpo_vps_step_level_supervision.json
  title: "GRPO-VPS Step-Level Process Supervision via CausalReasoning + Z3Math Verifiers"
  agent_type: claude
  model: sonnet
  max_turns: 40
  estimated_wall_time_min: 30
  priority: high
  requires_gpu: false
  prior_failures:
    - experiment_id: exp1196-grpo-vps-step-level-supervision
      verdict: DOOMED_RERUN_BLOCK
      addressed_by: "exp1196 was DOOMED_RERUN_BLOCK because the YAML had no prior_failures field and the failure ledger found 1 scope-overlapping prior. The prior (exp1129 GRPO reflection reward v3) was a successful upstream, not a failure. This task is explicitly a new implementation of GRPO-VPS using CausalReasoningVerifier + Z3MathVerifier as per-step rewards — distinct from exp1129's outcome-only reward approach."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    arXiv 2604.20659 (GRPO-VPS) extends GRPO with step-level process supervision: per-step
    rewards computed as change in model's belief in the correct answer at each step boundary.
    Reports up to 2.6pp improvement and 13.7% shorter reasoning chains.

    Carnot already has step-level verifiers: CausalReasoningVerifier (Tier 2.7) and
    Z3MathVerifier (Tier 3). These produce step-level signals that GRPO-VPS needs.

    STEP 0 — WRITE SKELETON ARTIFACT IMMEDIATELY:
    Write to results/experiment_1209_grpo_vps_step_level_supervision.json:
    {
      "experiment": "1209_grpo_vps_step_level_supervision",
      "status": "in_progress",
      "grpo_vps_step_delta_measured": false,
      "honest_verdict": "in_progress"
    }

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/extract.py (CausalReasoningVerifier Tier 2.7, Z3MathVerifier)
    - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline)
    - results/experiment_1159_grpo_v4_structural_warmup.json (v4 baseline: +10pp)

    TASK:
    1. Write skeleton artifact (STEP 0).
    2. Read CausalReasoningVerifier and Z3MathVerifier API.
    3. Implement GRPO-VPS segment_reward(step_text, step_index, prior_step):
       causal_score = 1.0 - CausalReasoningVerifier().verify_step(step_text, prior_step)
       z3_score = 1.0 - Z3MathVerifier().verify_step(step_text)
       return 0.5*causal_score + 0.5*z3_score
    4. Generate 50 GSM8K responses via llama.cpp CPU (Qwen3.6-35B or gemma-4-31B GGUF).
    5. Split each into CoT steps; compute per-step rewards; aggregate with decay.
    6. Compare vs outcome-only baseline on same 50 questions.
    7. Measure: per-step reward distribution, step-correctness correlation, grpo_vps_delta_pp.
    8. Update artifact with results.

    CONCRETE STEPS:
    - Write skeleton artifact (STEP 0)
    - python3 -c "from carnot.pipeline.extract import CausalReasoningVerifier, Z3MathVerifier; print('ok')" 2>&1
    - find /home -name "*.gguf" 2>/dev/null | grep -iE "qwen3.6|gemma.4.31|gemma.4.26" | head -3 2>&1
