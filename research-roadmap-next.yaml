      1. Read CLAUDE.md spec-first workflow.
      2. No new spec changes needed (REQ-BENCH-003, SCENARIO-BENCH-007/008/009 from Exp 340
         cover this; SCENARIO-BENCH-020 from Exp 368 covers the live_gpu_confirmed criterion).
      3. Write tests FIRST (100% coverage required) for any NEW helper functions in this script.
