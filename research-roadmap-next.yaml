    prior_failures:
      - experiment_id: exp4700-object-centric-perception-proposal-live
        verdict: "complete: object_centric_perception_no_new_level_residual_offpath_calibration_insufficient"
        addressed_by: "The operator-authorized mechanism now changes the canonical induction input with transition deltas, identity tracking, and HUD rejection; it is not an off-path proposal or level-solve attempt."
        retire_if_same_verdict: true
      - experiment_id: exp4841-object-identity-perception-probe
        verdict: "complete_object_identity_unrecoverable_from_rendered_grid_deeper_finding"
        addressed_by: "The new representation uses consecutive agent-visible frames and action-conditioned component matching rather than inferring persistent identity from one rendered grid."
        retire_if_same_verdict: true
      - experiment_id: exp5831-object-perception-induction-ab
        verdict: "complete_object_perception_ab_mean_delta_None_new_trust_0_gate_clears_False"
        addressed_by: "This task first proves nondecorative live closure, mutation sensitivity, and transition-level object receipts before any new A/B is allowed."
        retire_if_same_verdict: true
      - experiment_id: exp6018-object-perception-heldout-ab
        verdict: "complete_object_perception_heldout_ab_unmeasurable_instrument_floor_primary_zero_both_arms_no_test_possible_zero_discordant_pairs_n_support_games_14"
        addressed_by: "The representation and next A/B use per-transition change fidelity and executable-engine outcomes with a treatment-fire gate, not the prior zero-support instrument."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The 2026-08-07 operator directive requires object-level segmentation, translation-invariant relations, and HUD-strip rejection. Existing object perception is default on and previously improved change fidelity, but per-transition object diffs, persistent matching, and HUD rejection remain unbuilt. Add those missing generic features behind a separate default-off flag before measuring them.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md, especially ARC live-path and generalization rules
      - {project_root}/ops/known-issues.md 2026-08-07 directive and object-perception progress entry
      - {project_root}/openspec/capabilities/arc-world-model-trust-energy/spec.md around the object-perception requirements
      - {project_root}/python/carnot/agentic/arc_competition_agent.py, {project_root}/python/carnot/agentic/arc_executable_world_model.py, and {project_root}/python/carnot/agentic/arc_solver_kit.py
      - Existing object-component/HUD helpers and tests, plus Exp4700, Exp4841, Exp5831, and Exp6018 artifacts

      TASK
      Add a generic transition-aware object table containing 4-connected components, action-conditioned before/after deltas, translation-invariant identity matches and relations, and conservative HUD-strip rejection. Wire it into the canonical world-model induction input behind a new default-off flag. Prove live reachability, determinism, fail-open fallback, and mutation sensitivity. Make no ARC score or solve claim.

      Required deliverable: {project_root}/results/experiment_6213_arc_object_delta_perception_wiring.json.
      REQUIRED ARTIFACT FIELDS: status, spec_refs, flag_name_and_default, implementation_paths_and_hashes, canonical_live_entrypoint_receipt, component_schema, transition_delta_schema, translation_invariant_match_receipts, hud_rejection_rules_and_receipts, ambiguous_match_fail_open_receipts, prompt_insertion_receipt, treatment_fire_count_in_fixture, fallback_exactness, mutation_commands_and_kills, source_bfs_adapter_registry_hidden_state_access_counts, solve_claimed, registry_hash_before_after, object_delta_wiring_ready_score, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. solve_claimed must be false and all forbidden-access counts must be bare 0.

      CONCRETE STEPS
      1. Add a new REQ-ARC-WMTE-6213 requirement and scenarios before implementation; update traceability for focused tests.
      2. Define a versioned object/delta schema using only consecutive agent-visible grids and the chosen action. Do not use game source, hidden state, adapters, BFS, or registry trajectories.
      3. Implement component extraction, conservative HUD-strip admission, centroid/shape/color signatures, and translation-invariant before/after matching. Ambiguous matches must fail open.
      4. Wire the table into the canonical induction prompt under a new default-off flag without changing existing default-on static object perception.
      5. Add unit and property tests for translations, splits/merges, HUD motion, stable objects, ambiguous matches, serialization order, fallback, and live-closure reachability.
      6. Mutation-test deletion of the prompt hook, identity normalization, HUD rejection, and ambiguity guard. Restore sources byte-identically.
      7. Run applicable ARC e2e and orphan-solver checks, assert registry nonmutation, and adversarial-verify the no-solve artifact.

      Run command: .venv/bin/python -m carnot.experiment_6213_arc_object_delta_perception_wiring --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6214-arc-object-delta-heldout-ab
    milestone: "2026.08.538"
    deliverable: results/experiment_6214_arc_object_delta_heldout_ab.json
    title: "Held-out canonical live-path A/B for transition-aware object input"
    priority: critical
    track: arc
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 150
    requires:
      - exp6213-arc-object-delta-perception-wiring
    gated_on:
      - upstream: exp6213-arc-object-delta-perception-wiring
        artifact_field: object_delta_wiring_ready_score
        op: '=='
        value: 1
    prior_failures:
      - experiment_id: exp5831-object-perception-induction-ab
        verdict: "complete_object_perception_ab_mean_delta_None_new_trust_0_gate_clears_False"
        addressed_by: "Exp6213 supplies mutation-proven canonical wiring and transition-level features; this A/B requires treatment fire and measures executable fidelity rather than trust alone."
        retire_if_same_verdict: true
      - experiment_id: exp6018-object-perception-heldout-ab
        verdict: "complete_object_perception_heldout_ab_unmeasurable_instrument_floor_primary_zero_both_arms_no_test_possible_zero_discordant_pairs_n_support_games_14"
        addressed_by: "The preregistered primary is per-transition change fidelity on support-bearing held-out cells, with an explicit support floor and structured instrument-failure outcome."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6213 must make transition-aware object input reachable and mutation-proven. Measure its causal value on held-out public games used only as evaluation fixtures. The task improves the live discovery process; it does not target or claim a level solve.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md ARC rules
      - {project_root}/ops/known-issues.md 2026-08-07 directive
      - {project_root}/ops/arc_solve_registry.yaml
      - {project_root}/openspec/capabilities/arc-world-model-trust-energy/spec.md REQ-ARC-WMTE-6213
      - {project_root}/python/carnot/experiment_6213_arc_object_delta_perception_wiring.py and focused tests
      - Prior Exp6018 harness/artifact and current canonical make_carnot_agent/E3AgentPolicy entrypoint

      TASK
      Registry-precheck first. Freeze a held-out game/seed/support matrix before generation. Compare the canonical static object input with the same input plus Exp6213 transition deltas. Hold model, prompt outside the object section, sampling, budget, observations, and replay verifier fixed. Require treatment fire and report every game independently. Keep live defaults and the solve registry unchanged.

      MODEL_SPECS:
      - hf_id: unsloth/gemma-4-31B-it-GGUF; role: sole canonical ARC world-model inducer; preferred_quant: Q4_K_M
      Use the exact Exp6212-qualified cached file and runtime envelope. Record hash, revision, quantization, embedded template, context, sampling, budget, llama.cpp build, CUDA layers, GPU intervals, and process lifetime. Legacy models contribute zero rows.

      Required deliverable: {project_root}/results/experiment_6214_arc_object_delta_heldout_ab.json.
      REQUIRED ARTIFACT FIELDS: status, registry_precheck_and_hash_before_after, duplicate_solve_target_count, preregistered_game_seed_support_matrix, model_specs, gguf_cuda_and_process_receipts, canonical_live_entrypoint_receipts, matched_arm_configuration, treatment_fire_counts, raw_induction_paths_and_hashes, executable_engine_yield_by_arm_game, change_and_goal_fidelity_by_arm_game, action_and_wall_cost_by_arm_game, paired_clustered_intervals, discordant_game_sign_test, harmful_regression_count_and_games, aa_control, source_bfs_adapter_registry_hidden_state_access_counts, solve_claimed, level_credit_delta, registry_update_count, ab_complete_score, object_delta_promotion_ready_score, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. All solve/credit/update/forbidden-access fields must be false or bare 0. Do not include solve_provenance because no solve is claimed.

      CONCRETE STEPS
      1. Add REQ-ARC-WMTE-6214 and scenarios before implementation and trace focused tests.
      2. Hash the registry, select only already-cleared evaluation fixtures, and freeze support criteria, game/seed cells, primary change-fidelity metric, cost metrics, and safety gate before model load.
      3. Enter only through make_carnot_agent/E3AgentPolicy. Run matched A/A, control, and treatment arms with identical non-object inputs and budgets.
      4. Persist raw prompts, object tables, outputs, engine sources, model/process receipts, and replay evaluations before aggregation.
      5. Require nonzero treatment fire and the predeclared support floor. If either fails, classify instrument failure rather than a scientific null.
      6. Report per-game and clustered paired effects, discordant-game sign test, action/time costs, and harmful regressions. Do not hide any losing game.
      7. Assert defaults and registry hash unchanged, all forbidden accesses zero, solve_claimed=false, and level_credit_delta=0.
      8. Run focused tests, applicable ARC e2e checks, and adversarial verification.

      Run command: .venv/bin/python -m carnot.experiment_6214_arc_object_delta_heldout_ab --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6215-arc-trajectory-transfer-ab
    milestone: "2026.08.538"
    deliverable: results/experiment_6215_arc_object_relative_trajectory_transfer_ab.json
    title: "Within-game object-relative trajectory-transfer causal A/B"
    priority: critical
    track: arc
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 140
    requires:
      - exp6211-v538-post-marker-source-scope-prereg
    prior_failures:
      - experiment_id: exp4258-arc-oracle-distinct-cross-game-transfer
        verdict: "blocked_arc_game_ids_unrecoverable"
        addressed_by: "This task uses recoverable same-game level boundaries and transfers one agent-owned trace only within its game; it makes no cross-game or oracle-distinct claim."
        retire_if_same_verdict: true
      - experiment_id: exp4272-arc-cross-family-transfer-fresh-tgi-pool
        verdict: "blocked_gate_check_failed"
