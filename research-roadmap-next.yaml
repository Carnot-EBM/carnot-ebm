tasks:
- id: exp7050-v618-active-contract-preflight
  title: V618 active-roadmap and design-document contract preflight
  track: infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 90
  per_unit_rows: true
  milestone: 2026.09.618
  deliverable: results/experiment_7050_v618_active_contract_preflight.json
  prior_failures:
    - experiment_id: exp7038-v617-active-contract-preflight
      verdict: complete_blocked_v617_active_contract_preflight_prerequisite_missing
      addressed_by: "V618 creates the design document before the staged YAML and checks 13 independent Markdown and YAML rows without gating any science task."
      retire_if_same_verdict: true
    - experiment_id: exp7028-v616-active-contract-preflight
      verdict: complete_disqualified_v616_markdown_yaml_contract_mismatch
      addressed_by: "V618 uses one frozen 13-row task contract in both files and verifies title, deliverable, order, gate, and producer-field parity."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V617 lost its contract task because the design document did not exist.
    Earlier milestones also activated Markdown and YAML task lists with
    different lengths. V618 defines exactly 13 tasks, exp7050 through exp7062,
    in one order in the active YAML and design document. This task is advisory.
    No science task gates on it.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/research-references.md section "V618 Planner Refresh"
    - {project_root}/research-roadmap.yaml
    - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
    - {project_root}/results/experiment_7038_v617_active_contract_preflight.json
    - {project_root}/results/experiment_7028_v616_active_contract_preflight.json
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/scripts/roadmap_schema.py
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/exclusion_manifest_lint.py
    - {project_root}/scripts/harness_fit_lint.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and run an independent active-YAML versus Markdown contract
    preflight for V618. Check the exact count, order, full IDs, titles,
    deliverables, structured gates, gate producer fields, prior-failure
    records, model declarations, prompt tails, and ungated capstone. Do not
    activate or rewrite either roadmap.

    CONCRETE STEPS:
    0. PRECONDITIONS: require readable active `research-roadmap.yaml`, the V618
       design document, the exclusion manifest, and a writable artifact path.
       The execution parser must not require `research-roadmap-next.yaml`. On
       failure write terminal `blocked` with gate_check_summary naming the
       failed check, expected value, and observed value.
    1. Add REQ-REPORT-7050 to the research-reporting capability spec. Add RED
       tests before implementation. Cover exactly 13 ordered IDs, a missing
       row, reordered row, changed title, changed deliverable, missing gate
       producer field, malformed prior failure, missing prompt tail, and a
       gated capstone.
    2. Parse Markdown and active YAML independently. Do not create both views
       from one shared task object or one generated constant.
    3. Require the exact milestone, task count, order, full ID, title,
       deliverable, and structured gate parity for exp7050-exp7062. Confirm
       that every ID is unique and absent from completed and retired ID sets.
    4. Require every gate producer to occur earlier in this milestone. Require
       the exact bare top-level artifact field in the producer's own REQUIRED
       ARTIFACT FIELDS block.
    5. Require all four prior_failures sub-fields. Require per_unit_rows on
       every comparison. Require the closed verdict_class enum,
       gate_check_summary, legal inference substrates, model policy, and the
       final ungated capstone.
    6. Require every live-model task to name a mandated SOTA GGUF through the
       cached_sota_pair() pattern. Reject a legacy-small headline fallback.
    7. Set v618_task_contract_conforms_score=1 only when all 13 independent
       rows agree. A mismatch is `disqualified`. A missing execution
       prerequisite is `blocked`. Neither class is `partial`.
    8. Run focused tests, YAML parsing, roadmap schema validation, gate audit,
       exclusion-manifest lint, harness-fit lint, artifact validation,
       adversarial verification, row-consistency lint, scoped spec coverage,
       and root-clutter checks.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (aggregation_from_upstream_artifacts); duration_s;
       source_artifact_hashes; rows; markdown_task_rows; yaml_task_rows;
       task_contract_rows; title_parity_rows; deliverable_parity_rows;
       gate_contract_rows; gate_producer_rows; prior_failure_rows;
       model_compliance_rows; artifact_field_rows; prompt_tail_rows;
       expected_task_count (13); observed_task_count; expected_id_order;
       observed_id_order; active_roadmap_path;
       staging_file_required_at_execution (false);
       v618_task_contract_conforms_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7050_v618_active_contract_preflight.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7051-model-report-evidence-requalification
  title: Official-live model report evidence requalification
  track: inference-infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: true
  max_turns: 100
  estimated_wall_time_min: 150
  per_unit_rows: true
  milestone: 2026.09.618
  deliverable: results/experiment_7051_v618_model_report_requalification.json
  prior_failures:
    - experiment_id: exp7039-live-model-report-channel-forensics
      verdict: complete_positive_arc_report_channel_forensics_ready
      addressed_by: "Exp7051 keeps the measured report schema but enforces at least 75 seconds of owned live runtime and uses the canonical final-artifact checksum contract that Exp7039 failed."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7039 captured the official Qwen launch path and llama.cpp `/props`
    report. Its evidence was quarantined because duration_s was 46.97 seconds
    under a 60-second live-inference floor. Exp7040 also found a reproducibility
    checksum mismatch. The report shape itself is already known. This task
    requalifies the evidence. It does not open an ARC game or take an action.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md section "V618 Planner Refresh"
    - {project_root}/results/experiment_7039_v617_model_report_forensics.json
    - {project_root}/results/experiment_7040_v617_typed_identity_bridge.json
    - {project_root}/python/carnot/experiment_7039_v617_model_report_forensics.py
    - {project_root}/scripts/experiments/experiment_7039_v617_model_report_forensics.py
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/python/carnot/inference/sota_models.py
    - {project_root}/scripts/experiment_template.py cached_sota_pair() pattern
    - {project_root}/scripts/adversarial_verify.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Re-run the measured official-live model report capture with a valid
    duration and checksum. Preserve the selected snapshot, exact launch
    argument, full raw `/props` payload, raw identity candidates, resolved
    paths, file hashes, and owned process evidence. Do not change the shared
    production identity validator in this task.

    CONCRETE STEPS:
    0. PRECONDITIONS: require a supported idle RTX 3090, enough free VRAM,
       owned GPU and port leases, CUDA llama.cpp binary and library, clean
       stop authority, the cached mandated GGUF, readable Exp7039 and Exp7040
       evidence, and writable result and checkpoint paths. If another server
       is unattributed, block. Do not kill it. On any failure write terminal
       `blocked` with exact gate_check_summary. Do not use CPU or a legacy
       small-model fallback.
    1. Add REQ-ARC-7051 and RED tests before implementation. Reproduce the
       Exp7039 duration and checksum failures. Test terminal payload hashing,
       post-hash mutation rejection, cleanup, and blocked preconditions.
    2. MODEL_SPECS must resolve through cached_sota_pair() and execute
       `unsloth/Qwen3.6-35B-A3B-GGUF`. Record the hub ID, revision, snapshot
       filename, quantization, exact file hash, GPU UUID, and server build.
    3. Start one owned CUDA llama.cpp server with the selected snapshot path.
       Send fixed diagnostic requests that produce genuine tokens. Keep the
       owned live interval at or above 75 seconds. Record monotonic start,
       first-token, last-token, and shutdown timestamps. Do not open or act in
       an ARC game.
    4. Preserve the full raw `/props` JSON and the process command line.
       Record `model_path`, `model`, `model_alias`, and launch `-m` as separate
       raw fields. Resolve paths only into derived fields.
    5. Hash every reachable model file. Compare each hash with the selected
       model hash. Preserve missing and conflicting observations as unknown or
       contradicted. Do not normalize a raw field in place.
    6. Build the complete terminal payload before computing
       reproducibility_checksum. Use the repository canonical checksum
       helper and its declared excluded fields. Recompute the checksum in a
       clean reader before setting model_report_evidence_ready_score=1.
    7. Set that readiness field to one only when ownership, CUDA offload,
       identity capture, duration, checksum, and cleanup all pass. It describes
       evidence validity, not model quality or belief value.
    8. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, ARC floor lint, scoped spec coverage, and the
       applicable live-path checks from ops/e2e-test-plan.md.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below; preconditions_checked;
       inference_substrate (live_llm_inference); duration_s;
       source_artifact_hashes; rows; MODEL_SPECS; model_specs; models_used;
       selected_model_spec; requested_model_path; requested_model_filename;
       requested_hf_id; requested_revision; launch_model_argument;
       process_command_rows; raw_server_props; raw_identity_field_rows;
       resolved_identity_field_rows; file_hash_rows; consistency_rows;
       diagnostic_request_rows; server_process_rows; port_lease_rows;
       gpu_lease_rows; gpu_sample_rows; phase_clock_rows;
       cuda_layer_offload_confirmed (true); owned_live_interval_s;
       minimum_owned_live_interval_s (75); cleanup_rows;
       generation_request_count; arc_action_count (0);
       game_level_solve_claim (false); checksum_contract;
       checksum_recomputation_rows; model_report_evidence_ready_score;
       random_seed; reproducibility_checksum; gate_check_summary with failed
       check, expected value, and observed value for any blocked verdict;
       verifier_is_oracle (false); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7051_v618_model_report_requalification.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7052-typed-identity-bridge-attack-audit
  title: Typed model identity bridge and fresh-process attack audit
  track: inference-infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 210
  per_unit_rows: true
  milestone: 2026.09.618
  deliverable: results/experiment_7052_v618_typed_identity_attack_audit.json
  gated_on:
    - upstream: exp7051-model-report-evidence-requalification
      artifact_field: model_report_evidence_ready_score
      op: ==
      value: 1
  prior_failures:
    - experiment_id: exp7040-typed-model-identity-report-bridge
      verdict: blocked_exp7039_artifact_invalid
      addressed_by: "Exp7052 consumes the duration- and checksum-valid Exp7051 artifact and implements the typed bridge only after that upstream validity gate passes."
      retire_if_same_verdict: true
    - experiment_id: exp7041-identity-report-channel-cold-audit
      verdict: blocked_gate_check_failed
      addressed_by: "Exp7052 combines implementation and an independent subprocess attack suite, so no new task depends on the retired Exp7041 audit or its failed upstream gate."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7040 correctly refused invalid Exp7039 evidence. Exp7041 then retired
    after three gate failures. Exp7051 supplies the same measured report shape
    under a valid duration and checksum contract. This task implements the
    typed raw-report bridge and audits it in a separate process. It must not
    weaken hub, revision, hash, or path reachability checks.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/research-references.md section "V618 Planner Refresh"
    - {project_root}/results/experiment_7051_v618_model_report_requalification.json
    - {project_root}/results/experiment_7040_v617_typed_identity_bridge.json
    - {project_root}/results/experiment_7041_identity_report_channel_cold_audit.json
    - {project_root}/results/experiment_7030_arc_gguf_model_identity_bridge.json
    - {project_root}/results/experiment_7031_arc_model_identity_cold_audit.json
    - {project_root}/python/carnot/agentic/arc_eval_provenance.py
    - {project_root}/python/carnot/agentic/arc_executable_world_model.py
    - {project_root}/tests/python/test_arc_eval_provenance_contract_20260905.py
    - {project_root}/tests/python/test_arc_model_identity_bridge_20260905.py
    - {project_root}/openspec/capabilities/arc-agi/spec.md

    TASK:
    Extend the shared model identity receipt with typed raw observations,
    separate canonical resolutions, and supported, contradicted, or unknown
    obligations. Wire it into all current ARC identity consumers. Then audit
    the implementation from a fresh subprocess with one-factor attacks.

    CONCRETE STEPS:
    0. PRECONDITIONS: require a valid Exp7051 artifact with
       model_report_evidence_ready_score=1, an independently recomputed source
       hash, importable production modules, and writable code, test, and
       artifact paths. On failure write terminal `blocked` with
       gate_check_summary. Do not report `partial` for an upstream block.
    1. Add REQ-ARC-7052 and RED tests before implementation. Freeze the exact
       Exp7051 raw report shape into deterministic temporary-file fixtures.
       Do not read mutable artifact values during test execution.
    2. Keep requested_model_path, requested_model_filename, requested_hf_id,
       requested_revision, launch_model_argument,
       observed_server_model_path, observed_server_resolved_path,
       resolved_model_path, and model_file_hash as distinct fields.
    3. Emit typed obligations for absolute raw report, path resolution,
       selected snapshot relation, launch/report agreement, content hash, hub,
       revision, requested filename, unique file identity, and source
       provenance. Each row carries its evidence source and one of supported,
       contradicted, or unknown.
    4. Accept a snapshot alias only when it resolves to the selected blob and
       every required obligation is supported. Keep explicit branches for a
       canonical blob and a direct regular GGUF file.
    5. Fail closed on relative aliases, broken links, wrong snapshots,
       same-size different content, changed hub or revision, conflicting
       `/props` fields, hard-link ambiguity, symlink swaps, missing evidence,
       and artifact checksum changes.
    6. Wire the shared builder and validator into the submitted ARC evaluator,
       reusable-server check, and belief-shadow consumer. Keep an explicit
       reader for complete legacy rows. Do not rewrite old artifacts.
    7. Launch a fresh subprocess with no imported parent state. Recompute the
       positive fixture and all attacks. Require byte-identical positive
       obligations and fail-closed negative results.
    8. Set typed_identity_attack_audit_ready_score=1 only when the positive
       paths pass, every attack fails closed, the fresh process agrees, legacy
       handling is explicit, and all consumers use the shared code.
    9. Run focused tests, artifact validation, adversarial verification,
       row-consistency lint, ARC floor lint, scoped spec coverage, and the
       applicable checks from ops/e2e-test-plan.md.
    10. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
        principle for every field below; preconditions_checked;
        inference_substrate (aggregation_from_upstream_artifacts); duration_s;
        source_artifact_hashes; cited_upstream_artifacts; upstream_gate_rows;
        rows; identity_schema_version; raw_report_reproduction_rows;
        identity_obligation_rows; positive_fixture_rows; attack_rows;
        unknown_evidence_rows; legacy_compatibility_rows;
        producer_wiring_rows; consumer_wiring_rows; subprocess_rows;
        requested_model_path; requested_model_filename; requested_hf_id;
        requested_revision; launch_model_argument;
        observed_server_model_path; observed_server_resolved_path;
        resolved_model_path; model_file_hash;
        typed_identity_attack_audit_ready_score; random_seed;
        reproducibility_checksum; gate_check_summary with failed check,
        expected value, and observed value for any blocked verdict;
        verifier_is_oracle (false); verdict_class
        (positive | circular_positive | null | blocked | disqualified | partial);
        honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7052_v618_typed_identity_attack_audit.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
