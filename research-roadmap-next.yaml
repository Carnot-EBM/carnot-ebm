  - id: exp3195-adaptive-verification-granularity-policy-v1
    milestone: "2026.05.296"
    deliverable: "results/experiment_3195_adaptive_verification_granularity_policy_v1.json"
    title: "Adaptive verification granularity policy over exact rows and repair contexts"
    priority: high
    max_turns: 50
    estimated_wall_time_min: 35
    track: "verification"
    inference_substrate: "exact_artifact_analysis_only"
    requires_gpu: false
    prior_failures:
      - experiment_id: exp3180-controlled-invariance-executor-v2
        verdict: "complete: controlled_invariance_passed_exact_authority_only"
        addressed_by: "This task uses the passed invariance rows to learn a scheduling policy rather than retesting invariance."
        retire_if_same_verdict: true
      - experiment_id: exp3182-distributional-ebm-sidecar-boundary-v1
        verdict: "complete: diagnostic_only_sidecar_no_verifier_promotion"
        addressed_by: "This task is a deterministic policy over exact labels and receipts, not a promoted sidecar verifier."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Recent VG-Search work argues that verification granularity should be adaptive. `.295` now has exact rows, controlled-invariance evidence, receipt-backed transcripts, and false-accept families. `.296` needs a policy that chooses final-answer, chunk, or counterexample-fragment verification without making EBMs or LLMs the authority.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - research-references.md
      - results/experiment_3180_controlled_invariance_executor_v2.json
      - results/experiment_3183_certificate_expansion_v1.json
      - results/experiment_3189_cross_corpus_matrix_v29.json
      - carnot/

      TASK
      Build a deterministic adaptive verification granularity policy artifact. It should map row/risk features to a verification schedule and estimate compute/coverage effects from existing artifacts only.

      CONCRETE STEPS
      1. Identify available exact rows, false-accept families, counterexample certificates, and receipt-backed transcripts.
      2. Define policy inputs such as row family, known false-accept risk, certificate depth, answer ambiguity, and prior verification outcome.
      3. Define actions: final-answer-only, step-chunk, counterexample-fragment, abstain/escalate, and skip redundant recheck.
      4. Simulate the policy on existing rows without calling an LLM.
      5. Record expected verifier-call changes and any risk tradeoffs.
      6. Write `results/experiment_3195_adaptive_verification_granularity_policy_v1.json`.

      REQUIRED ARTIFACT FIELDS:
      - schema_version: string (principle: schema-versioned artifacts)
      - experiment_id: string (principle: stable experiment identity)
      - policy_version: string (principle: versioned controller policy)
      - source_artifacts: list (principle: artifact lineage)
      - exact_rows_used: int (principle: exact authority coverage)
      - policy_features: list (principle: interpretable routing)
      - policy_actions: list (principle: explicit action space)
      - simulated_rows: int (principle: measured scope)
      - estimated_verifier_call_delta: number|null (principle: compute accounting)
      - false_accept_risk_increase: number|null (principle: risk accountability)
      - redundant_recheck_suppression_rule: dict (principle: experience-driven verification suppression)
      - promotion_allowed: bool (principle: no sidecar authority promotion without evidence)
      - honest_verdict: string (principle: terminal truthful verdict; must start with `complete:`)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

