    9. Run affected unit and consumer tests with PYTHONPATH=python:. and pytest -n 0 -o addopts= --no-cov. Combine unit and real CLI success, expected-failure, cold-replay and terminal-recheck coverage using identical includes. Require nonempty data and 100 percent statements for changed modules and CLIs. Run scoped Ruff check/format, strict mypy and scripts/check_spec_coverage.py with explicit affected test filenames. Record repository-wide debt separately. Never remove an existing required failure to obtain readiness.
