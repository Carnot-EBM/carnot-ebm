      TASK:
      Implement or validate a governed decision-history memory substrate for verifier/self-learning decisions. It should preserve evidence, rejected revisions, scope, provenance, outcome, conflict status, and rollback metadata using deterministic cached fixtures.

      CONCRETE STEPS:
      1. Identify the existing memory schema and the smallest compatible extension for decision-history rows. Avoid broad refactors.
      2. Add fields for source artifact, task scope, evidence checksum, promoted decision, rejected alternatives, verifier outcome, conflict status, poisoning/scope flags, and rollback status.
      3. Build cached fixtures that exercise promotion, stale conflict eviction, out-of-scope memory rejection, poisoning-like instruction rejection, and rollback.
      4. Use aggregation_from_upstream_artifacts unless you truly invoke a local LLM. Do not add LoRA, GRPO, or parameter training.
      5. Add focused tests for schema compatibility, migration/default behavior, and rollback.
      6. Write results/experiment_5275_governed_decision_history_memory_v482.json with REQUIRED ARTIFACT FIELDS:
         - honest_verdict: object with value/principle; value must start with complete: or blocked_ and state whether decision-history memory is ready.
