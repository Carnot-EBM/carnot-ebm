        clean_artifacts_from_capstone: list
        flagged_artifacts_from_capstone: list
        blocked_artifacts_from_capstone: list
        missing_artifacts_from_capstone: list
        archive_ready: bool
        inference_substrate: "aggregation_from_upstream_artifacts"
        duration_s: float
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2950
    milestone: "2026.05.278"
    deliverable: "results/experiment_2950_code_taxonomy_repair_prompt_manifest_v1.json"
    title: "SOTA Code Failure Taxonomy Repair Prompt Manifest v1"
    priority: critical
    requires_gpu: true
    max_turns: 40
    estimated_wall_time_min: 45
    track: code_generation
    inference_substrate: aggregation_from_upstream_artifacts
    prior_failures:
      - experiment_id: exp2946
        verdict: "complete: retain continuation executed with n_tasks=50, pass@1=0.0600, pass@k=0.1600"
        addressed_by: "This task does not rerun blind generation; it designs a taxonomy-guided repair manifest from the .277 failure set and mandates SOTA local GGUF models for the downstream repair evaluation."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Run from {project_root} on {date}. .277 retained a strong code-corpus
        verifier AUPRC row but exposed weak SOTA code generation:
        pass@1=0.0600 and pass@k=0.1600. The next step is not another blind
        generation run; it is a repair manifest that turns deterministic failure
        categories into targeted repair prompts for local SOTA GGUFs.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (SOTA Local Models; Failed-Experiment Rerun Discipline)
        - scripts/experiment_template.py (cached_sota_pair docstring)
        - results/experiment_2946_sota_code_generation_continuation_v1.json
        - results/experiment_2940_verifier_ensemble_auprc_code_corpora_v1.json
        - results/experiment_2943_cross_corpus_matrix_v11.json
        - research-references.md (post-.277 TruncProof / llguidance / MAZE sweep)

      TASK:
        Build a repair-prompt manifest for failed code candidates, grouped by
        failure taxonomy and mapped to deterministic checks. This task prepares
        the downstream live evaluation and may not claim a pass-rate improvement.

      CONCRETE STEPS:
        0. PRECONDITIONS: .277 artifacts for exp2940, exp2943, and exp2946 exist.
        1. Extract the failed/low-scoring candidate categories available from
           exp2946 and the code-corpus verifier artifacts.
        2. Define repair prompt templates for syntax errors, missing symbols,
           wrong return type, failed tests, unsafe imports, and unsupported API
           hallucinations.
        3. Define deterministic post-repair checks: parser, tests where present,
           static import/name checks, and the exp2940 verifier threshold.
        4. Include MODEL_SPECS for downstream live use:
           - unsloth/Qwen3.6-35B-A3B-GGUF
           - unsloth/gemma-4-31B-it-GGUF
           - unsloth/gemma-4-26B-A4B-it-GGUF
           Legacy small models may appear only as CPU smoke tests.
        5. Write a manifest artifact with sample IDs, taxonomy labels, prompt
           templates, deterministic checks, and acceptance criteria.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        repair_prompt_manifest_ready: bool
        source_artifacts: list
        model_specs: list
        legacy_models_only_for_smoke: bool
        taxonomy_labels: list
        repair_prompt_templates: object
        deterministic_checks: list
        downstream_eval_plan: object
        inference_substrate: "aggregation_from_upstream_artifacts"
        duration_s: float
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2951
    milestone: "2026.05.278"
    deliverable: "results/experiment_2951_structured_candidate_manifest_adapter_v1.json"
    title: "Structured Candidate Manifest Adapter v1"
    priority: high
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 35
    estimated_wall_time_min: 40
    track: code_generation
    inference_substrate: deterministic_wiring
    prior_failures:
      - experiment_id: exp2926
        verdict: "complete: constraintbench_corrigendum_ready=true"
        addressed_by: "This task generalizes the structured-output correction into a reusable code-candidate manifest adapter rather than rerunning ConstraintBench directly."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Run from {project_root} on {date}. TruncProof, llguidance, and MAZE all
        point to the same implementation lesson: syntax and manifest structure
        should be constrained before verification, not repaired after arbitrary
        prose output. This task creates a local-first structured candidate
        adapter for the .278 code-repair evaluation.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - scripts/experiment_template.py
        - research-references.md (post-.277 structured decoding entries)
        - results/experiment_2946_sota_code_generation_continuation_v1.json
        - any existing code-generation result parsing utilities under scripts/

      TASK:
        Implement or document a reusable structured candidate manifest adapter.
        Prefer an installed local grammar backend such as llguidance or
        llama.cpp grammar support when available; otherwise provide a
        deterministic schema-validation fallback. Do not require a live LLM call.

      CONCRETE STEPS:
        0. PRECONDITIONS: check for Python JSON schema support and optional
           local grammar backends without installing new packages.
        1. Define the candidate manifest schema: task_id, prompt_id, model_id,
           raw_completion_ref, repaired_code, failure_taxonomy, parser_status,
           test_status, verifier_score, and provenance checksums.
        2. Add a small deterministic fixture or script if a suitable local
           utilities location exists; otherwise write the schema and fixture
           into the result artifact.
        3. Validate at least three synthetic candidate records against the
           schema, including one valid, one syntax failure, and one unsupported
           import/API hallucination.
        4. Record which structured-output backends are available locally.
        5. Include MODEL_SPECS that downstream live tasks must use if they call
           an LLM: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF,
           and unsloth/gemma-4-26B-A4B-it-GGUF.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        structured_decode_manifest_ready: bool
        schema_version: str
        schema_fields: list
        local_backends_checked: list
        llguidance_available: bool
        llama_cpp_grammar_available: bool
        validation_fixture_count: int
        validation_fixture_passed: bool
        model_specs_for_downstream_live_use: list
        inference_substrate: "deterministic_wiring"
        duration_s: float
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2952
    milestone: "2026.05.278"
    deliverable: "results/experiment_2952_sota_taxonomy_guided_code_repair_eval_v1.json"
    title: "Gated SOTA Taxonomy-Guided Code Repair Evaluation v1"
    priority: critical
    requires_gpu: true
    max_turns: 60
    estimated_wall_time_min: 180
    track: code_generation
    inference_substrate: live_llm_inference
    gated_on:
      - upstream: exp2950
        artifact_field: repair_prompt_manifest_ready
        op: "=="
        value: true
      - upstream: exp2951
        artifact_field: structured_decode_manifest_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2946
        verdict: "complete: retain continuation executed with n_tasks=50, pass@1=0.0600, pass@k=0.1600"
        addressed_by: "The evaluation now repairs known failed candidates using taxonomy prompts and structured manifests instead of repeating blind generation."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Run from {project_root} on {date}. This is the headline live-model code
        task for .278. It is gated on exp2950 and exp2951 so it only runs when
        the repair manifest and structured candidate adapter exist. It must use
        mandated local SOTA GGUF models for any headline result.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (SOTA Local Models; Inference Substrate)
        - scripts/experiment_template.py (cached_sota_pair pattern)
        - results/experiment_2950_code_taxonomy_repair_prompt_manifest_v1.json
        - results/experiment_2951_structured_candidate_manifest_adapter_v1.json
        - results/experiment_2946_sota_code_generation_continuation_v1.json
        - results/experiment_2940_verifier_ensemble_auprc_code_corpora_v1.json

      TASK:
        Run a bounded taxonomy-guided repair evaluation on failed .277 code
        candidates and measure whether repair improves pass@1/pass@k or reduces
        syntax/schema failures without increasing false verifier accepts.

      CONCRETE STEPS:
        0. PRECONDITIONS: dual RTX 3090 host available, local GGUF runtime works,
           exp2950 and exp2951 artifacts are present, and cached_sota_pair()
           resolves at least one mandated headline GGUF.
        1. Select a bounded repair set from exp2946 failures, preserving task IDs
           and original failure categories.
        2. Run baseline no-taxonomy repair and taxonomy-guided repair under the
           same sample budget.
        3. MODEL_SPECS must include at least one headline model and should use:
           - unsloth/Qwen3.6-35B-A3B-GGUF
           - unsloth/gemma-4-31B-it-GGUF
           - unsloth/gemma-4-26B-A4B-it-GGUF
           Legacy small models are allowed only for CPU smoke-test plumbing.
        4. Validate every candidate through the structured manifest schema,
           parser/static checks, available tests, and the code verifier threshold.
        5. Report pass@1, pass@k, syntax failure rate, schema failure rate,
           verifier acceptance rate, and false-accept audit notes.
        6. Set taxonomy_repair_delta_pass=true only if pass@1_delta > 0 or
           syntax_failure_rate_delta < 0 while false_accept_delta <= 0.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        inference_substrate: "live_llm_inference"
        preconditions_checked: list
        model_specs: list
        headline_models_used: list
        legacy_models_only_for_smoke: bool
        n_tasks: int
        baseline_pass_at_1: float
        repair_pass_at_1: float
        pass_at_1_delta: float
        baseline_pass_at_k: float
        repair_pass_at_k: float
        pass_at_k_delta: float
        syntax_failure_rate_delta: float
        schema_failure_rate_delta: float
        false_accept_delta: float
        taxonomy_repair_delta_pass: bool
        candidate_manifest_sha256: str
        reproducibility_checksum: str
        duration_s: float
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

