milestone: "2026.08.548"
milestone_title: "Observable Proposals, Certified Rollback, and Falsifiable Goals"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp6363-v548-terminal-handoff-and-queue-preflight
    milestone: "2026.08.548"
    deliverable: results/experiment_6363_v548_terminal_handoff_and_queue_preflight.json
    title: "V547 terminal evidence handoff and V548 queue preflight"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 45
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6350-v547-bounded-terminal-handoff
        verdict: "complete_with_flagged_boundaries: V546 evidence preserved Exp6337 as flagged, Exp6341 as gate-blocked, factor learning as replay-qualified, and ARC as no-solve"
        addressed_by: "This handoff reads the seven active V547 tasks from primary artifacts, preserves the Exp6350 quarantine, and validates the new V548 queue instead of claiming the flagged prior handoff was clean."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 2026.08.547 is terminal. Its active roadmap contained seven tasks, Exp6350 through Exp6356. Exp6350 was quarantined by the conductor for DURATION_TOO_SHORT and missing method evidence. Exp6352 resolved all three mandatory GGUF files, embedded tokenizers, both RTX 3090 GPUs, and disk capacity, but every generation child returned code 1, produced zero raw bytes and zero tokens, left models_used empty, and set live_autoregressive_generation_invoked false. Exp6352 preserved no stderr in its terminal artifact. It recorded n_ctx=512 while the committed source now declares n_ctx=2048. Exp6353 gate-blocked three times. Exp6354 was pre-emptively skipped because Exp6353 retired. Exp6355 gate-blocked on the absent Exp6354 deliverable. Exp6356 ended complete_null. This task establishes the exact V548 evidence boundary and checks the staged queue before research begins.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md, {project_root}/research-roadmap.yaml, and {project_root}/research-roadmap-next.yaml
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/ops/conductor-log.md, {project_root}/ops/status.md, and {project_root}/ops/changelog.md
      - {project_root}/results/experiment_6350_v547_bounded_terminal_handoff.json through {project_root}/results/experiment_6356_live_certified_learning_safety_audit.json when present
      - {project_root}/python/carnot/experiment_6352_live_factor_proposal_authenticity_preflight.py
      - {project_root}/research-complete.yaml, {project_root}/ops/exclusion_manifest.yaml, and {project_root}/ops/known-issues.md
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/validate_prior_failures.py, {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/exclusion_manifest_lint.py

      TASK
      Create a bounded V547-to-V548 terminal handoff and queue preflight. Reconcile only the seven tasks in the active V547 roadmap. Preserve flagged, blocked, missing, retired-upstream, and null states. Do not count the proposal-only Exp6357-Exp6362 identities as executed tasks. Validate all 14 V548 task IDs, deliverables, structured gates, gate-field cross-references, prior-failure entries, agent/model pairings, mandatory GGUF policy, and exact prompt endings. Confirm that the active roadmap and conductor are unchanged.

      CONCRETE STEPS
      0. Run read-only preconditions: resolve the repository root, hash the active and next roadmaps, hash the conductor, load the exclusion manifest, and verify that every expected V547 artifact path is classified as present, absent, blocked, or flagged.
      1. Read every V547 artifact through scripts/summarize_artifact.py before importing a field. Preserve live adversarial findings separately from stamped fields.
      2. Reconcile the conductor outcomes for Exp6350-Exp6356. Record all three Exp6353 gate failures, all three Exp6354 pre-emptive skips, all three Exp6355 gate failures, and the terminal Exp6356 audit.
      3. Compare Exp6352 source constants with its terminal process receipts. Record the n_ctx mismatch, empty outputs, missing stderr, missing top-level random seed, and prose-versus-boolean generation contradiction without guessing a root cause.
      4. Parse research-roadmap-next.yaml. Check the milestone, 14 unique task IDs, unique deliverables, dependency order, structured gates, and every gated field against the upstream REQUIRED ARTIFACT FIELDS block.
      5. Check every prior_failures entry for experiment_id, verdict, addressed_by, and retire_if_same_verdict=true. Run the roadmap schema, prior-failure, gate, and exclusion-manifest linters.
      6. Check every prompt for CONTEXT, EXISTING CODE TO READ FIRST, TASK, CONCRETE STEPS, {project_root}, {date}, a Run command, and the exact final prohibition line.
      7. Write tests for the new handoff experiment. Add or update the applicable REQ-* and SCENARIO-* entries before implementation. Run focused tests, focused coverage, spec coverage, the applicable read-only E2E checks, adversarial_verify, determination-preservation lint, and root-clutter sweep.
      8. Write the terminal artifact atomically. Use a complete_, passed_, success_, shipped_, or blocked_ honest_verdict prefix. Never convert a flagged or blocked upstream into clean evidence.

      Required deliverable: {project_root}/results/experiment_6363_v548_terminal_handoff_and_queue_preflight.json.
      REQUIRED ARTIFACT FIELDS:
      - status
      - v547_active_roadmap_path_and_hash
      - v547_active_task_ids
      - v547_terminal_artifacts_by_task
      - v547_conductor_outcomes_and_attempt_counts
      - v547_flagged_blocked_missing_and_null_states
      - exp6352_generation_failure_receipt
      - exp6352_source_artifact_drift_receipt
      - proposal_only_v547_ids_not_executed
      - v548_milestone_doc_and_queue_hashes
      - v548_task_ids
      - v548_id_collision_check
      - v548_deliverable_checks
      - v548_dependency_and_structured_gate_checks
      - v548_gate_field_cross_reference_checks
      - v548_prior_failure_checks
      - v548_agent_model_and_llm_policy_checks
      - prompt_contract_checks
      - active_roadmap_modified
      - conductor_modified
      - protected_files_unchanged
      - preconditions_checked
      - inference_substrate
      - verifier_is_oracle
      - field_principles
      - field_provenance
      - random_seed
      - duration_s
      - tests_run
      - reproducibility_checksum
      - honest_verdict
      field_principles must map every required field and every structured gate expression to one short sentence that explains why the field exists. field_provenance must identify a measured, derived, constant, or upstream source for every required field. Set verifier_is_oracle=false because this task reconciles evidence and does not judge scientific correctness.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6363_v548_terminal_handoff_and_queue_preflight --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6364-v548-post-marker-source-scope-freeze
    milestone: "2026.08.548"
    deliverable: results/experiment_6364_v548_post_marker_source_scope_freeze.json
    title: "V548 dated source delta and three-lane scope freeze"
    priority: high
    track: infrastructure
    requires_gpu: false
    max_turns: 30
    estimated_wall_time_min: 45
    agent_type: codex
    model: gpt-5.5
    prior_failures:
      - experiment_id: exp6351-v547-post-marker-source-scope-freeze
        verdict: "complete_null: no strict post-marker source changed V547 scope"
        addressed_by: "The new window starts after the V548 planner marker and includes newly indexed verifier-guided induction and dependency-rollback work, so it freezes a changed three-lane scope instead of repeating the V547 query."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      The V548 planner refresh is already appended to research-references.md. It promotes Hypothesis Frontier (arXiv:2608.10843), Dependency-Guided Rollback Repair (arXiv:2608.10502), ReTree (arXiv:2608.10676), Decomposition-Induced Context-Memory Conflict (arXiv:2608.10627), and Optimal Stopping of Self-Refining Foundation Models (arXiv:2608.10729). It preserves Active Reward Machine Inference and Zero-Shot Goal Recognition for the ARC lane. Semantic Scholar returned 33 EBT citations and eight ARM-EBM citations in the dated query. Extropic and Kona still expose no authenticated local runtime. The active scientific lanes are observable GGUF proposals, certified factor learning with dependency rollback, and falsifiable live ARC goals.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/research-program.md and {project_root}/research-references.md
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md and {project_root}/research-roadmap-next.yaml
      - {project_root}/results/experiment_6363_v548_terminal_handoff_and_queue_preflight.json
      - {project_root}/results/experiment_6351_v547_post_marker_source_scope_freeze.json
      - {project_root}/ops/exclusion_manifest.yaml, {project_root}/ops/known-issues.md, and {project_root}/research-hardware-wishlist.md
      - {project_root}/python/carnot/experiment_6351_v547_post_marker_source_scope_freeze.py

      TASK
      Validate the dated V548 research marker and freeze the executable scope. Recheck direct source metadata and public availability without fabricating access. Record whether any strict post-marker source changes the plan. Freeze the three active lanes and the explicit no-claim boundaries. Do not reopen a retired mechanism based on topical similarity.

      CONCRETE STEPS
      0. Confirm network reachability before any live source request. If a source is unavailable, record the failure and use the already dated planner receipt without inventing content.
      1. Locate the V548 planner marker and hash the full section. Validate arXiv IDs, submission dates, titles, and direct URLs for each promoted paper.
      2. Recheck OpenReview, Hugging Face Papers, Semantic Scholar records for EBT and ARM-EBM, GitHub discovery, Extropic writing, and Logical Intelligence. Record dated endpoint outcomes and rate limits.
      3. Classify each finding as executable now, control only, deferred, retired-scope, or unavailable. Explain each classification in one sentence.
      4. Freeze the active lanes: observable local GGUF proposal generation, verified-frontier certified factor learning with dependency rollback, and live-path ARC two-sided goal evidence.
      5. Freeze closed scopes: parser/JIT decoding, finite-ID or parser-only generated-answer transport, external generated-text or logprob scoring, hidden-state scoring, KAN training, EBT pretraining, unchanged local-board probes, TSU execution, and Kona execution. Mention closed patterns only as exclusions.
      6. Write tests for marker detection, source classification, unavailable-source handling, and closed-scope preservation. Add or update the applicable research-reporting REQ-* and SCENARIO-* entries first.
      7. Run focused tests, focused coverage, spec coverage, adversarial_verify, and root-clutter sweep. Write an atomic terminal artifact with no broad literature claim.

      Required deliverable: {project_root}/results/experiment_6364_v548_post_marker_source_scope_freeze.json.
