  - id: exp2910
    milestone: "2026.05.275"
    deliverable: "results/experiment_2910_sota_code_generation_corrigendum_v2.json"
    title: "SOTA Code Generation Corrigendum v2: Fixed Seeds + n>=20"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 120
    track: local_sota
    inference_substrate: live_llm_inference
    prior_failures:
      - experiment_id: exp2905
        verdict: "complete: bounded-budget k=8 live SOTA code generation executed with pass@1=0.5000 and pass@k=0.5000"
        addressed_by: "This retry fixes the flagged methodology: top-level random_seed required, n_tasks_per_corpus >= 20, pass@1/pass@k implementation audited, and headline rows forbidden if the tautology persists."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Project root: {project_root}. Run date: {date}.
        The .274 code-generation expansion (exp2905) is adversarial-flagged:
        pass@1 and pass@k are identical on only two tasks per corpus and the
        artifact lacks a top-level random_seed. This task reruns the row with a
        defensible bounded sample size and explicit methodology checks.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (SOTA Local Models; Failed-Experiment Rerun Discipline)
        - scripts/experiment_template.py (cached_sota_pair() docstring)
        - python/carnot/inference/sota_models.py
        - results/experiment_2905_sota_code_generation_bounded_budget_expansion_v1.json
        - research-references.md (Delulu and llguidance entries from 2026-05-23)

      TASK:
        Produce a corrected SOTA code-generation artifact using the mandated
        local GGUF path. Use MBPP and HumanEval-style tasks already available
        locally; do not fetch private data. The output must be either a clean
        corrected row or an honest blocked artifact.

      CONCRETE STEPS:
        0. MODEL_SPECS:
           a. Use cached_sota_pair(gpu_indices=(0, 1)) first.
           b. The live headline path must include at least one of:
              - unsloth/Qwen3.6-35B-A3B-GGUF
              - unsloth/gemma-4-31B-it-GGUF
              - unsloth/gemma-4-26B-A4B-it-GGUF
           c. Legacy tiny models are allowed only for CPU smoke-tests. If only
              legacy models are available, write blocked_sota_gguf_cache_missing
              and do not produce headline pass rates.
        1. Set top-level random_seed = 2910 and record all per-task candidate
           seeds.
        2. Select n_tasks_per_corpus >= 20 for MBPP and HumanEval-style tasks.
        3. Generate k_candidates_per_task = 8 bounded candidates with timeouts,
           raw response capture, model path, GPU index, and prompt hash.
        4. Extract code robustly. If extraction fails, classify the failure and
           keep the raw response.
        5. Execute candidates in the existing local sandbox/test harness. Record
           pass@1, pass@k, extraction success, syntax success, runtime success,
           and per-task pass vectors.
        6. Add a methodology_note explaining why pass@1 and pass@k are distinct
           metrics and fail the task if they still match exactly without a
           per-task explanation.
        7. Write the deliverable JSON.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        codegen_corrigendum_ready: bool
        flagged_adversarial: bool
        methodology_note: str
        random_seed: 2910
        random_seeds_used: list
        model_specs: list
        models_used: list
        cached_sota_pair_used: bool
        legacy_smoke_only: bool
        n_tasks_per_corpus: int
        k_candidates_per_task: 8
        aggregate_pass_at_1: float
        aggregate_pass_at_k: float
        pass_at_k_exceeds_pass_at_1: bool
        per_task_results: list
        raw_response_dir: str
        inference_substrate: "live_llm_inference"
        duration_s: float
        run_date: "{date}"

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2911
    milestone: "2026.05.275"
    deliverable: "results/experiment_2911_code_hallucination_taxonomy_verifier_v1.json"
    title: "Delulu-Style Code Hallucination Taxonomy Verifier v1 (gated on Exp2910)"
    priority: high
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 40
    estimated_wall_time_min: 60
    track: code_verification
    inference_substrate: deterministic_verifier
    gated_on:
      - upstream: exp2910
        artifact_field: codegen_corrigendum_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp2905
        verdict: "complete: bounded-budget k=8 live SOTA code generation executed with pass@1=0.5000 and pass@k=0.5000"
        addressed_by: "Instead of reusing pass@k as the only signal, this task classifies generated-code hallucinations with deterministic static/runtime checks over exp2910 outputs."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Project root: {project_root}. Run date: {date}.
        The corrected code-generation row needs more than pass/fail. Recent
        Delulu code-hallucination work separates invented imports, undefined
        names, invented methods/attributes, and invalid arguments. This task
        applies those categories to local generated-code outputs.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md
        - results/experiment_2910_sota_code_generation_corrigendum_v2.json
        - results/experiment_2905_sota_code_generation_bounded_budget_expansion_v1.json
        - python/carnot/pipeline/verify_stream.py
        - tests/python (search for existing code-generation/sandbox tests)

      TASK:
        Build a deterministic taxonomy verifier for exp2910 code candidates and
        report which failures are true test failures versus code hallucination
        categories.

      CONCRETE STEPS:
        0. PRECONDITION: if exp2910 artifact is absent or codegen_corrigendum_ready
           is false, write blocked_codegen_corrigendum_missing and exit.
        1. Load exp2910 per_task_results and raw responses.
        2. Implement or reuse static AST checks for:
           - invented or unavailable imports,
           - undefined names,
           - invented attributes or methods,
           - invalid argument count or incompatible call signatures.
        3. Run candidates through syntax parse, static checks, and existing task
           tests. Keep all categories orthogonal; a candidate can have multiple
           failure labels.
        4. Summarize failure rates by model, corpus, task, and pass/fail status.
        5. Write the deliverable JSON and any small helper script or test needed
           for the verifier.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        code_hallucination_verifier_ready: bool
        upstream_codegen_artifact: "results/experiment_2910_sota_code_generation_corrigendum_v2.json"
        taxonomy_categories: list
        per_candidate_labels: list
        invented_import_rate: float
        undefined_name_rate: float
        invented_attribute_or_method_rate: float
        invalid_argument_rate: float
        syntax_error_rate: float
        runtime_error_rate: float
        pass_rate_after_taxonomy_filter: float
        verifier_source_paths: list
        inference_substrate: "deterministic_verifier"
        duration_s: float
        run_date: "{date}"

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2912
    milestone: "2026.05.275"
    deliverable: "results/experiment_2912_kv260_same_basis_cpu_gibbs_baseline_v1.json"
    title: "KV260 Same-Basis CPU Gibbs Baseline v1"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 40
    estimated_wall_time_min: 75
    track: hardware
    inference_substrate: cpu_sampler
    prior_failures:
      - experiment_id: exp2898
        verdict: "complete: kv260_hardware_latency_transcript_recorded"
        addressed_by: "exp2898 measured KV260 board latency only. This task uses the same tensors, sparse topology, seeds, and sample counts to create the missing CPU Gibbs baseline required before any speedup claim."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Project root: {project_root}. Run date: {date}.
        exp2898 recorded a real KV260 Ising sampler latency transcript but made
        no speedup claim. The next required artifact is a same-basis CPU Gibbs
        baseline using the exact n=64 problem basis from exp2898.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (Hardware-Task Continuity Discipline)
        - results/experiment_2898_kv260_ising_sampler_hardware_latency_benchmark_v1.json
        - results/experiment_2898_kv260_transcript.log
        - hardware/kv260/discrete_sb_256.v
        - python/carnot/pipeline/verify_stream.py
        - scripts (search for Ising/Gibbs sampler helpers)

      TASK:
        Reconstruct the exact exp2898 n=64 sparse Ising problem basis and run a
        CPU Gibbs sampler with matched seeds and sample counts. This is a CPU
        baseline only; do not claim hardware speedup in this task.

      CONCRETE STEPS:
        0. PRECONDITION: if exp2898 artifact is absent, write
           blocked_kv260_latency_artifact_missing and exit.
        1. Load exp2898. Extract n_spins, uploaded sparse topology, coupling
           checksum(s), field checksum(s), random_seeds_used, and sample_count_sweep.
        2. If exact tensors are not recoverable from exp2898 artifacts, write
           blocked_kv260_problem_basis_unrecoverable and explain which field is
           missing. Do not synthesize a different problem silently.
        3. Implement or reuse a CPU Gibbs sampler with the same update schedule
           and sample counts: 100, 1000, and 10000 per seed.
        4. Record median and p95 per-sample CPU wall-clock latency, final energy,
           energy trace checksum, and reproducibility checksum per seed.
        5. Write the deliverable JSON.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        same_basis_cpu_baseline_ready: bool
        upstream_kv260_artifact: "results/experiment_2898_kv260_ising_sampler_hardware_latency_benchmark_v1.json"
        n_spins: 64
        matched_sparse_topology: bool
        matched_coupling_tensor: bool
        matched_field_tensor: bool
        random_seeds_used: list
        sample_count_sweep: list
        cpu_per_seed_results: list
        cpu_latency_us_median_by_sample_count: dict
        cpu_latency_us_p95_by_sample_count: dict
        reproducibility_checksum: str
        speedup_claim_made: false
        inference_substrate: "cpu_sampler"
        duration_s: float
        run_date: "{date}"

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

