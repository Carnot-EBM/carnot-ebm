  - id: exp5580-parser-forensics-positive-control
    milestone: "2026.07.505"
    title: "Cached local-SOTA parser forensics, repair, and positive control"
    priority: critical
    track: verification
    deliverable: results/experiment_5580_parser_forensics_positive_control.json
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 40
    estimated_wall_time_min: 70
    prior_failures:
      - experiment_id: exp5567-local-sota-solve-vs-verify-asymmetry
        verdict: "complete: authenticated paired local SOTA panel ran, but parser_failure_count=648 collapsed every solve and verifier cell to zero."
        addressed_by: "This no-LLM task isolates cached response formats, builds a deterministic parser cascade, and requires synthetic plus hand-checked positive controls before remeasurement."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5567 authenticated Qwen3.6 and Gemma-4 GPU inference but failed to parse all 648 candidate outputs. Model accuracy and verifier asymmetry are therefore unknown. Repair the instrument on cached responses before any new inference.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/results/experiment_5566_exact_asp_fsm_near_miss_corpus.json
      - {project_root}/results/experiment_5567_local_sota_solve_verify_asymmetry.json
      - {project_root}/python/carnot
      - {project_root}/tests/python
      - {project_root}/openspec/capabilities

      TASK:
      Diagnose cached parser failures, implement a bounded deterministic parser cascade with tests, and emit results/experiment_5580_parser_forensics_positive_control.json. Do not call an LLM.

      CONCRETE STEPS:
      1. Check for an existing relevant `REQ-*`; update the capability spec and tests first if behavior changes.
      2. Enumerate all 648 failures by exact cause: wrapper text, fenced JSON, field alias, numeric/list shape, truncation, semantic invalidity, or other.
      3. Implement the narrowest reusable parser cascade: strict schema first, then deterministic fence/object extraction and documented aliases. Never repair semantic content.
      4. Test valid synthetic forms, malformed negatives, adversarial nested braces, truncation, and at least 30 hand-checked cached samples per model family.
      5. Require parsed_positive_control_rate>=0.95, semantic_false_accept_count=0, and parser_repair_ready=true; otherwise block remeasurement.
      6. REQUIRED ARTIFACT FIELDS with `field_principles`: `cached_rows_audited` — principle: diagnosis covers the failed denominator; `failure_taxonomy` — principle: fixes target observed causes; `parser_stage_counts` — principle: permissive fallbacks stay visible; `parsed_positive_control_rate` — principle: a parser needs known-valid recall; `semantic_false_accept_count` — principle: syntax repair cannot invent correctness; `per_model_cached_parse_rate` — principle: one family cannot mask another; `tests_run` — principle: behavior is reproducible; `parser_repair_ready` — principle: downstream inference runs only after controlled readiness; `inference_substrate=cached_exp5567_responses_no_llm` — principle: no new model evidence is claimed; `honest_verdict` — principle: terminal status names readiness or block.
      7. Run targeted unit tests and relevant spec coverage.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

