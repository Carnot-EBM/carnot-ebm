      AND ideally run a real SOTA GGUF LLM on the SAME puzzles for an in-house comparator. The
      optimizer references: arXiv:2506.04596 (QUBO solver benchmark — SA/PT/SB/Gurobi under a
      uniform budget; how to tune + budget-match PT), arXiv:2510.19835 (Sudoku-QUBO), arXiv:2406.11179 (IRED adaptive steps).

