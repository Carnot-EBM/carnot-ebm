  prompt: |
    CONTEXT
    Work in {project_root} on {date}. Milestone 2026.10.692. The hardware wishlist retains KV260, PolarFire and GateMate obligations. Extropic Z1T and sparse spline learning motivate whole-service accounting, but neither supplies a local executable accelerator for this fitted head.

    EXISTING CODE TO READ FIRST
    CLAUDE.md; CODEX.md; research-program.md; ops/exclusion_manifest.yaml; scripts/experiment_template.py; python/carnot/reporting/current_work_receipt.py; openspec/capabilities/research-reporting/spec.md; openspec/capabilities/verification/spec.md; ops/e2e-test-plan.md; python/carnot/reporting/experiment_7977_v691_hardware_evidence.py; results/experiment_7977_v691_hardware_evidence.json; research-hardware-wishlist.md; _bmad/architecture.md; research-references.md

    TASK
    Preserve board evidence and bound acceleration of the measured service. Deliver results/experiment_7990_v692_hardware_evidence.json. Implement the bounded entrypoint scripts/experiments/experiment_7990_v692_hardware_evidence.py. MODEL_SPECS: []. SUBSTRATE CLASS: no_model_load. Use verifier_ensemble_against_cached_candidates for numerical scoring, or aggregation_from_upstream_artifacts for a pure audit. Zero current pretrained-model loads/calls. Small fitted heads are separate trained_head_specs.

    CONCRETE STEPS
    1. Print a flushed progress line at each phase boundary and before and after every model load, generation call, benchmark, and subprocess. Print inside long loops and from a supervising thread while an owned child is silent, at most 60 seconds apart. Keep every output gap below 600 seconds. Use tool waits of at most 60 seconds. Silence can end a run near 1200 seconds; progress permits the 4800-second hard cap. Report measured work; never pad duration.
    2. Write any file over about 200 lines in several tool calls of at most 150 lines. Send a progress message between calls. Keep each edit and tool call small. Put temporary scripts and mutable test files in private /tmp directories outside the checkout. Keep the pytest artifact guard enabled. Archive immutable receipts only after children exit.
    3. Authenticate the exact input paths, hashes, roles, producer invocation dates, and readiness fields below. A historical date need not equal {date}. Missing inputs or failed external gates yield verdict_class=blocked and exact gate_check_summary operands. Do not retry unchanged external blocks as partial. Preserve historical failures and all source artifacts.
    4. Before implementation, append task-specific REQ-REPORT and, where applicable, REQ-VERIFY requirements and scenarios. Write tests first. Reuse qualified components below; implement only the stated difference. Freeze the required validation command manifest before running science. Keep unrelated repository health separate; never remove a failed owned check or weaken an assertion to qualify.
    5. Authenticate and preserve the latest KV260, PolarFire and GateMate receipt paths and hashes through Exp7977. This is evidence continuity, not a new availability probe. KV260 qualified fabric remains quadratic Ising with k_max<=5; PolarFire is Linux CPU-only; GateMate retains the unchanged0xffffffff physical/JTAG blocker. NPU and TSU remain unqualified.
    6. If Exp7989 service_measurement_ready_score=1, map each measured operation to an authenticated capability. Account for sparse spline coefficient touches and propose a future fixed-point/LUT feasibility boundary without claiming the existing KV260 overlay executes it. If timing is unavailable, retain blocked mapping while completing board custody.
    7. For compatible fraction f, record the ideal ceiling1/(1-f) and the modeled100x-kernel bound1/((1-f)+f/100+transfer_time/total_time). If transfer is unknown, label zero-transfer output an optimistic estimate, not a measurement. Include final readout, host work and persistence; Extropic headline exclusions cannot define Carnot service cost.
    8. Emit one per-board row with current evidence age, execution class, exact blocker, required external change and compatible workload. No repeated unchanged GateMate detection, flash, purchase, SSH reprobe, or TSU access request. Recommend acquisition only after a measured compatible bottleneck justifies it.
    9. Keep a valid complete continuity/mapping result terminal null when no kernel can be accelerated. Do not promote hardware custody or a hypothetical100x kernel to a measured speed result. Update the wishlist only with new evidence-bound conclusions.
    10. Run affected unit and consumer tests, nonempty 100% changed-statement coverage including real private CLI routes, scoped Ruff check/format, strict mypy, and scripts/check_spec_coverage.py on the actual test paths. Run applicable E2Es listed below with private outputs. Cold-replay the primary from outside the checkout without PYTHONPATH. Run scripts/adversarial_verify.py --json and scripts/verdict_row_consistency_lint.py --strict on the final primary. Check both conductor_gates.evaluate_gates and in_process_doc_reconcile.find_artifact resolve that primary. Failed owned required validation means disqualified and readiness zero. Use one atomic declared primary and nested sidecars. Reconcile specs, _bmad/traceability.md, ops/status.md, and ops/changelog.md. Keep generator weights and production defaults fixed. Applicable end-to-end checks: Private board-custody fixture and hash-tamper cold replay; no physical board E2E is applicable.
    REQUIRED ARTIFACT FIELDS
    - experiment_id, task_id, milestone, run_date, execution_date: principle: Bind identity to this invocation, not an inherited producer.
    - honest_verdict: principle: Use complete_positive_*, complete_null_*, complete_blocked_*, complete_disqualified_*, or complete_circular_positive_* with an accurate reason.
    - verdict_class: principle: Choose exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished OWN work that a retry can finish; other classes are terminal.
    - gate_check_summary: principle: Every blocked disposition names upstream, path/hash, field, operator, expected value and actual value. Distinguish missing from zero.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, model_specs, model_invocation_counts: principle: Declare actual compute and zero calls for cached scoring. Separate planned models from actual blocked invocations.
    - duration_s, phase_spans, random_seed, reproducibility_checksum: principle: Make timing, progress and reconstruction checkable.
    - cited_upstream_artifacts, code_config_hashes, raw_shard_hashes: principle: Bind imported fields and current computations to their source bytes.
    - preconditions_checked, validation_command_manifest_path, validation_receipts, coverage_statement_counts: principle: Required checks need observed exit codes and logs, not a claimed green status.
    - rows, sample_size_budget: principle: Keep one primitive row per source/arm/seed or check. Include intended, eligible, started, completed, failed, censored, excluded and independent counts. Seeds do not multiply independent sources.
    - verifier_is_oracle, claim_scope, acceptance_gate_results: principle: Keep circular fixtures separate from independent natural-data evidence. A failed benefit gate forbids a positive class.
    - flagged_adversarial, terminal_validation_sidecar_path: principle: Final-byte checks must travel with the primary; never self-certify a failed verifier.
    - hardware_evidence_ready_score, board_rows, workload_placement_rows: principle: Preserve distinct physical, CPU and fabric evidence per board.
    - modeled_100x_bound, ideal_amdahl_bound, transfer_assumptions: principle: Keep estimates distinct from actual end-to-end speed measurements.
    - hardware_evidence_ready_score: principle: Exact downstream readiness field. Set 1 only after complete valid measurement and owned checks; a scientific null can still be ready. Set 0 on blocked/disqualified work.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_7990_v692_hardware_evidence.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
