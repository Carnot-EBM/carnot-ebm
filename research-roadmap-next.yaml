  - id: exp5583-causal-memory-metric-corrigendum
    milestone: "2026.07.505"
    title: "Causal-memory tournament metric independence corrigendum"
    priority: critical
    track: self-learning
    deliverable: results/experiment_5583_causal_memory_metric_corrigendum.json
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 40
    estimated_wall_time_min: 70
    prior_failures:
      - experiment_id: exp5569-causal-memory-policy-tournament
        verdict: "complete: policy_ready=true, but adversarial verification flagged a TAUTOLOGY because backward_retention_delta equaled forward_transfer_delta at 0.3333333334."
        addressed_by: "The corrigendum recomputes independent row-level estimands and includes a permutation test that must separate forward transfer from backward retention."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5569's policy tournament cannot gate self-learning because its two headline deltas were algebraically identical. Preserve raw outcomes, correct the estimands, and positively test metric independence without new model calls.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/results/experiment_5558_causal_csl_write_manage_read_memory.json
      - {project_root}/results/experiment_5569_causal_memory_policy_tournament.json
      - {project_root}/scripts/adversarial_verify.py
      - {project_root}/python/carnot
      - {project_root}/tests/python

      TASK:
      Recompute independent causal-memory policy metrics with permutation controls and emit results/experiment_5583_causal_memory_metric_corrigendum.json.

      CONCRETE STEPS:
      1. Locate row-level outcomes and reconstruct arm/session/family membership; block rather than invent missing rows.
      2. Define forward transfer on later-family first exposure, backward retention on earlier-family delayed replay, forgetting as within-family delayed loss, and policy cost independently.
      3. Add a label/session permutation control that destroys causal order and a unit test in which forward transfer changes while backward retention is fixed.
      4. Re-run no-memory, shuffled, static-causal, always-full, and optimized-causal comparisons from cached rows.
      5. REQUIRED ARTIFACT FIELDS with `field_principles`: `rows_reconstructed` — principle: metrics trace to observations; `estimand_definitions` — principle: forward and backward questions are distinct; `forward_transfer_delta` — principle: later-family adaptation is isolated; `backward_retention_delta` — principle: earlier-family durability is isolated; `forgetting_delta` — principle: retention loss stays visible; `permutation_control_passed` — principle: causal order must matter; `metric_independence_positive_control` — principle: formulas cannot be aliases; `flagged_adversarial=false` — principle: downstream use requires a clean audit; `policy_ready` — principle: controls and policy benefit must both pass; `inference_substrate=cached_row_level_memory_outcomes` — principle: no new inference; `honest_verdict` — principle: repeated tautology retires the policy lane.
      6. Run targeted tests and adversarial verification.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

