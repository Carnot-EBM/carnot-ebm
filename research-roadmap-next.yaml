- id: exp704-jepa-v17-ranknet
  milestone: 2026.04.54
  deliverable: results/experiment_704_jepa_v17_ranknet.json
  title: 'Exp 704: JEPA v17 Architecture — RankNet Pairwise Ranking Loss with Hard Negative Mining (RETRO-CRITICAL)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA v15 and v16 both have OOD AUC below random (0.4751 and 0.4759).
    Root cause (Exp 693): pure_loss_anti_correlation. Both BCE and InfoNCE allow the model
    to hedge all outputs to P≈0.5 globally, satisfying the loss without learning any
    step-level discrimination. This is confirmed by the two consecutive failed retrains.

    The fix: RankNet pairwise ranking loss. For each (correct_step, incorrect_step) pair
    from the same question, apply:
      L_ranknet = -log(sigmoid(score(incorrect) - score(correct)))
    This REQUIRES score(incorrect) > score(correct) for every pair. Hedging to P=0.5 gives
    loss = log(2) per pair; correct ranking gives loss → 0. The model CANNOT hedge.

    Hard negative mining: for each correct step in the batch, select the most similar
    incorrect step (highest cosine similarity in embedding space) as the hard negative.
    This prevents the model from learning trivially-separable pairs.

    Training data: results/fover_labeled_formal_v1.json (FoVer formal v1, 200 Z3-labeled
    pairs from Exp 686). These are confirmed-correct Z3 labels.

    EXISTING CODE TO READ FIRST:
    - python/carnot/inference/eorm_model.py — EORMModel architecture (base for JEPA).
    - python/carnot/samplers/jepa_predictor.py (or similar) — JEPAPredictor current impl.
    - results/experiment_686_fover_formal_v1.json — FoVer v1 corpus metadata.
    - results/fover_labeled_formal_v1.json — FoVer v1 training pairs.
    - results/experiment_693_jepa_v15_root_cause.json — root cause analysis.
    - results/experiment_698_jepa_v16.json — v16 InfoNCE failure.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement JEPARankNetV17 with RankNet loss + hard negative mining. Train on FoVer
    formal v1. Evaluate OOD AUC on GSM8K 500-699.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VERIFY-140 (JEPA v17 RankNet: OOD AUC >= 0.75 on GSM8K 500-699),
       REQ-VERIFY-141 (RankNet loss enforces strict partial order: score(incorrect) > score(correct)),
       REQ-VERIFY-142 (hard negative mining: select most similar incorrect step per correct anchor),
       SCENARIO-VERIFY-140/141/142 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/inference/jepa_v17_ranknet.py:
       a. class JEPARankNetV17(nn.Module):
          - Same architecture as JEPAPredictor (step encoder → MLP → scalar score)
          - forward(step_text: str) → float (energy score; high = likely incorrect)
       b. def ranknet_loss(scores_incorrect: jnp.ndarray, scores_correct: jnp.ndarray) -> float:
          L = -jnp.mean(jnp.log(jax.nn.sigmoid(scores_incorrect - scores_correct)))
          return L
          (Using JAX: import jax, jax.nn, jnp = jax.numpy)
       c. def hard_negative_mining(correct_embeddings, incorrect_embeddings):
          Compute cosine similarity matrix between all correct and incorrect embeddings.
          For each correct embedding, select the incorrect with highest similarity.
          Return indices of hard negatives.
       d. def train_jepa_v17(fover_pairs: list, n_epochs: int = 50,
                              lr: float = 1e-3) -> JEPARankNetV17:
          Build (correct_step, hard_negative_step) pairs.
          Train with RankNet loss using optax (adam optimizer).
          Return trained model.
       e. def evaluate_ood_auc(model: JEPARankNetV17,
                               gsm8k_indices: range = range(500, 700)) -> float:
          Load GSM8K questions 500-699 (never in training).
          For each question: get correct final answer + one plausible incorrect step.
          Score both; compute AUROC.
          Return ood_auc.
    4. Create scripts/experiment_704_jepa_v17_ranknet.py:
       a. ExperimentTemplate(704) + ExperimentTimeoutWatchdog(704, timeout_minutes=60).
       b. Load fover_labeled_formal_v1.json. Verify n_pairs >= 100.
       c. train_jepa_v17(fover_pairs) — track train_loss per epoch.
       d. Evaluate OOD AUC on GSM8K 500-699.
       e. Gate evaluation: cascade_gate_open = (ood_auc >= 0.75).
       f. If cascade_gate_open: save model to results/jepa_v17_ranknet.pt.
          Else: emit v18 architecture recommendation in artifact.
       g. honest_verdict:
          - "jepa_v17_cascade_unblocked" if ood_auc >= 0.75
          - "jepa_v17_improved_below_threshold" if 0.5 <= ood_auc < 0.75
          - "jepa_v17_still_below_random" if ood_auc < 0.5
       h. v18_recommendation (str): if gate fails, state next approach:
          "listwise_lambdarank" (rank all steps simultaneously, not just pairs)
       i. artifact: v17_ood_auc, v17_train_loss_final, n_training_pairs,
          cascade_gate_open, model_saved_path, honest_verdict, v18_recommendation.
    5. Write tests/python/test_experiment_704_jepa_v17_ranknet.py with 100% coverage:
       - test ranknet_loss returns 0 when incorrect score > correct score by large margin.
       - test ranknet_loss returns log(2) when scores are equal (hedging case).
       - test hard_negative_mining selects most similar pair.
       - test train_jepa_v17 reduces loss over epochs on synthetic data.
       Each test traces to REQ-VERIFY-140/141/142.
    6. Reconcile:
       - ops/status.md: add JEPA v17 RankNet result (ood_auc, cascade_gate_open).
       - ops/changelog.md: one-line with honest_verdict.
    7. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

