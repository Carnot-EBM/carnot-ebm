  - id: exp2944
    milestone: "2026.05.277"
    deliverable: "results/experiment_2944_paper_v6_narrowing_audit_v1.json"
    title: "Paper-v6 Narrowing Discipline Mechanical Audit v1"
    priority: high
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 25
    estimated_wall_time_min: 20
    track: paper
    inference_substrate: aggregation_from_upstream_artifacts
    prior_failures:
      - experiment_id: exp2935
        verdict: "(pending - .276 task)"
        addressed_by: "This is the first mechanical audit of whether autonomous-loop output respects CLAUDE.md 'Paper-v6 Narrowing Discipline'. Scans docs/arxiv-paper/main.tex, docs/technical-report.md, and recent capstone artifacts for the 7 retracted phrasings."
        retire_if_same_verdict: false
    prompt: |
      CONTEXT:
        CLAUDE.md "Paper-v6 Narrowing Discipline" (Deep Think 2026-05-23)
        forbids autonomous-loop output from re-asserting 7 retracted
        claims. This task is the first mechanical audit of compliance.

      CONCRETE STEPS:
        1. Read CLAUDE.md section "Paper-v6 Narrowing Discipline".
        2. Extract the seven forbidden phrasings into a regex list.
        3. Scan docs/arxiv-paper/main.tex, docs/technical-report.md,
           docs/technical-report.html, docs/index.html, and the
           ten most recent `results/experiment_*capstone*.json` files
           for matches.
        4. For each hit, record: file, line, matched phrase, the
           retracted claim it corresponds to, and a suggested fix.
        5. Do NOT auto-rewrite operator-curated docs (per Public
           Documentation Discipline). Auto-rewrite is permitted for
