  - id: exp6379-canonical-factor-edit-transport-contract
    milestone: "2026.08.549"
    deliverable: results/experiment_6379_canonical_factor_edit_transport_contract.json
    title: "Canonical factor-edit instruction and capacity transport contract"
    priority: critical
    track: infrastructure
    requires_gpu: false
    max_turns: 100
    estimated_wall_time_min: 60
    agent_type: claude
    model: opus
    prior_failures:
      - experiment_id: exp6366-repaired-live-factor-proposal-authenticity
        verdict: "complete_null: repaired live calls ran but authenticity gates did not all pass"
        addressed_by: "This task does not rerun generation. It replays the frozen raw failures and replaces duplicated prompt/schema instructions with one hashed source that also computes tokenizer-specific output capacity."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6366 authenticated all three model calls but produced zero parse-valid objects. Qwen used the 192-token budget for analysis, dense Gemma repeated one token, and MoE Gemma truncated inside the JSON object. The prompt printed a compact target and then printed a larger payload that contained the same target again. arXiv:2608.08254 says schema descriptions and prompts form one model-dependent instruction surface. This task is deterministic transport infrastructure. It is not another grammar, parser, or generation retry. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/python/carnot/experiment_6366_repaired_live_factor_proposal_authenticity.py and its focused test
      - {project_root}/results/experiment_6366_repaired_live_factor_proposal_authenticity.json and its raw stdout sidecars
      - {project_root}/python/carnot/experiment_6344_counterexample_factor_proposal_calibration.py
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/research-references.md V549 marker
      - {project_root}/openspec/capabilities/continuous-learning/spec.md and {project_root}/openspec/capabilities/research-harnesses/spec.md

      TASK
      Build a single-source factor-edit transport contract. One canonical object must generate the schema description, output example, validator, prompt fragment, source-binding rules, and output-token lower bound. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF for embedded-tokenizer capacity checks. Do not call AutoTokenizer. Do not invoke autoregressive generation. Do not add grammar decoding, parser retry, or post-hoc repair.

      CONCRETE STEPS
      0. Freeze and hash the Exp6366 artifact, prompt payload, schema sidecar, and three raw outputs before classification.
      1. Label each frozen failure as thinking leakage, repetition collapse, truncation, syntax failure, structural failure, semantic failure, or unknown. Preserve overlapping labels.
      2. Define one canonical bounded factor-edit object. Generate the prompt instruction, compact example, validator field list, and source-binding checks from it. Reject hand-written duplicates and hash drift.
      3. Include a short bounded evidence_summary field inside the JSON object as one preregistered variant. It may cite visible evidence. It must not request hidden chain of thought.
      4. Count the exact minimal serialized output with each model's embedded GGUF tokenizer in vocab-only mode. Compute old-budget margin, required completion lower bound, fixed headroom, n_ctx margin, and truncation risk separately.
      5. Define a bounded repetition policy before live execution. Treat a repeated-token threshold breach as abstention. Do not let a larger token budget alone qualify the contract.
      6. Add mutation tests for prompt-schema conflict, stale examples, missing fixed fields, reordered fields, thinking prefixes, markdown, repeated tokens, mid-object truncation, unsupported source spans, and parse-valid semantic corruption.
      7. Add or update REQ-* and SCENARIO-* entries before implementation. Run focused tests, 100% focused coverage for new code, spec coverage, adversarial verification, determination preservation, and root-clutter sweep.
      8. Set canonical_factor_transport_contract_ready_score=1.0 only when all deterministic generators agree, all drift attacks fail closed, all three tokenizer capacity receipts exist, and no retired decoding mechanism is present.

      Required deliverable: {project_root}/results/experiment_6379_canonical_factor_edit_transport_contract.json.
      REQUIRED ARTIFACT FIELDS:
      status, upstream_exp6366_path_hash_and_terminal_class, frozen_raw_failure_paths_hashes_and_labels, MODEL_SPECS, embedded_gguf_tokenizer_receipts, autotokenizer_usage_count, live_autoregressive_generation_invoked, canonical_schema_path_hash_and_version, canonical_schema_generated_surfaces, prompt_schema_drift_checks, bounded_evidence_summary_variant, per_model_minimum_output_tokens_and_capacity_margins, repetition_policy_and_failure_thresholds, deterministic_transport_mutation_matrix, syntax_structure_source_binding_and_semantic_boundaries, retired_decoding_mechanism_usage_count, canonical_factor_transport_contract_ready_score, no_model_quality_or_utility_claim, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_principles, field_provenance, random_seed, duration_s, tests_run, reproducibility_checksum, honest_verdict.
      Set verifier_is_oracle=false. The schema validator checks transport only. Exact task checkers remain the later semantic oracle.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6379_canonical_factor_edit_transport_contract --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6380-three-family-canonical-factor-transport-canary
    milestone: "2026.08.549"
    deliverable: results/experiment_6380_three_family_canonical_factor_transport_canary.json
    title: "Gated on Exp6379 readiness: three-family canonical factor transport canary"
    priority: critical
    track: self-learning
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 150
    agent_type: claude
    model: opus
    gated_on:
      - upstream: exp6379-canonical-factor-edit-transport-contract
        artifact_field: canonical_factor_transport_contract_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6366-repaired-live-factor-proposal-authenticity
        verdict: "complete_null: repaired live calls ran but authenticity gates did not all pass"
        addressed_by: "This retry uses one hashed instruction surface, tokenizer-derived output capacity, a preregistered repetition policy, and a three-arm control that separates instruction change from added headroom."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6379 must establish the deterministic transport contract before this task runs. Exp6366 proved live execution but returned one invalid output from every mandated family and zero exact-checker calls. This retry changes the mechanism. It uses a canonical schema source, a capacity allowance derived from the exact target under each embedded tokenizer, and a fixed repetition control. It includes the old prompt and old token allowance as controls. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6379_canonical_factor_edit_transport_contract.json
      - {project_root}/python/carnot/experiment_6379_canonical_factor_edit_transport_contract.py and its focused test
      - {project_root}/python/carnot/experiment_6366_repaired_live_factor_proposal_authenticity.py and its raw sidecars
      - {project_root}/python/carnot/experiment_6365_gguf_child_failure_forensics_and_runtime_contract.py
      - {project_root}/scripts/experiment_template.py and {project_root}/python/carnot/inference/sota_models.py
      - {project_root}/openspec/capabilities/continuous-learning/spec.md

      TASK
      Run a bounded three-arm factor-edit transport canary on all three mandated local models. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF from cached_sota_pair(). Use embedded GGUF tokenizers only. Never call AutoTokenizer. Preserve raw output before parsing. Use no grammar, parser retry, JSON repair, hidden states, or external scorer. Exact checkers are the only correctness oracle.

      CONCRETE STEPS
      0. Revalidate the Exp6379 gate, both RTX 3090 GPUs, model hashes, embedded tokenizers, llama.cpp offload, disk, source hashes, and event-manifest hashes.
      1. Seal at least 12 fresh licensed executable events across at least three constraint families. Balance executable structure and surface relabeling.
      2. Preregister three matched arms: frozen Exp6366 prompt at 192 tokens, canonical prompt at 192 tokens, and canonical prompt at the computed per-model allowance with the fixed repetition policy. Change no other sampling input.
      3. Run each model sequentially through the Exp6365 observable child contract. Record task-linked GPU, timing, capacity, raw stdout/stderr, token usage, return, and cleanup receipts.
      4. Freeze raw outputs before classification. Report thinking leakage, repetition, truncation, syntax, structural, source-binding, semantic, timeout, and abstention counts by model and arm.
      5. Parse once with the canonical validator. Do not retry or repair. For parse-valid objects, freeze source alignment and then call the exact checker. Keep exact pass or fail separate from transport readiness.
      6. Prove read-only same-step isolation. Count model-weight changes, hidden-state access, generated labels, and protected-validation reads.
      7. Add REQ-* and SCENARIO-* entries and focused tests. Run focused tests and coverage, spec coverage, relevant inference E2E checks, adversarial verification, determination preservation, and root-clutter sweep.
      8. Set three_family_factor_transport_ready_score=1.0 only when every family has at least one nonempty source-bound parse-valid canonical-arm object, at least one exact-checker call, zero protected leakage, zero same-step writes, and complete runtime receipts. If the same all-invalid verdict recurs, retire this retry scope.

