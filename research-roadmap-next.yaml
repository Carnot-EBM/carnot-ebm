  - id: exp1814-phase4-method-decision-attempt-3
    title: "Exp 1814: Phase 4 method decision — 3rd attempt (.184/.186/.187 all SKIPPED/blocked)"
    deliverable: results/experiment_1814_phase4_method_decision.json
    max_turns: 100
    agent_type: codex
    model: gpt-5.5
    priority: high
    prior_failures:
      - experiment_id: exp1784-phase4-method-comparison-decision
        verdict: skipped_pretest_failing_in_186
        addressed_by: "exp1784 (.186) SKIPPED."
        retire_if_same_verdict: false
      - experiment_id: exp1793-phase4-method-comparison-decision
        verdict: blocked_gate_check_failed_or_planner_replaced_in_187
        addressed_by: "exp1793 (.187) did not produce a clean decision artifact. This 3rd attempt has NO upstream gate; runs honestly even if Fast-Slow (exp1811) hasn't shipped yet — emits blocked_no_fast_slow_artifact in that case."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: Phase 4 has 3 candidate metric methods:
      (a) ensemble-alpha-original (falsified across exp1715/1721/1741/1745),
      (b) thermodynamic-metric (planner-drafted in .183 exp1754/1755 + .185),
      (c) Fast-Slow Variant (this milestone exp1811).
      This task issues the canonical-method decision for .190+ planner.

      FALSIFIABLE HYPOTHESIS: Exactly one method shows substrate-
      discriminability AND sample-efficiency-lift. If none, Phase 4 needs
      operator escalation via known-issues MANDATORY.

      EXISTING CODE TO READ FIRST:
        - results/experiment_175[4-5]*.json (thermodynamic candidates if
          they shipped in .183)
        - results/experiment_1811_fast_slow_variant.json (run BEFORE this)
        - results/experiment_1745_phase4_per_step_alpha.json (failure baseline)

      TASK: 3-method comparison + decision artifact.

      CONCRETE STEPS:
        0. PRECONDITIONS (per CLAUDE.md):
           a. `test -f results/experiment_1811_fast_slow_variant.json` —
              else `blocked_fast_slow_artifact_not_ready` and exit
              (this task is a downstream comparison; if upstream is
              missing, honest blocked is correct).
           b. At least one of exp1754/1755 readable — if neither AND
              no thermodynamic alternative exists, emit
              `blocked_thermodynamic_artifacts_missing`.
           Record preconditions_checked.
        1. Tabulate 3 methods on substrate-discriminability /
           sample-efficiency / KL drift / implementation cost.
        2. Pass/fail per criterion.
        3. Decision: canonical method for .190+ planner.
        4. Append to ops/known-issues.md MANDATORY "Phase 4 Canonical
           Metric Decision (.189+ MANDATORY)".

      REQUIRED ARTIFACT FIELDS:
        - schema: "carnot.phase4_method_decision.v1"
        - experiment: 1814
        - run_date: ISO-8601 UTC
        - duration_s: > 30s
        - random_seed: 172914
        - reproducibility_checksum: sha256
