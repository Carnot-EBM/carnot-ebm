- id: exp2448-conformal-ensemble-v2
  title: 'Phase 1: Conformal P-Value Ensemble v2 -- Fix JSON Malformation + Add PCIB (Tier 0l) + Breach 0.9236'
  milestone: 2026.05.237
  deliverable: results/experiment_2448_conformal_ensemble_v2.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2438-conformal-ensemble-v1
    verdict: complete_with_conformal_ensemble_auroc_0.916667
    addressed_by: "exp2438 achieved AUROC=0.9167 (ensemble_auroc_improved=true) but JSON had Extra data at char
      1999 (line 75 column 2) — a duplicate trailing JSON object or malformed final field prevented
      json.load(). Root cause: agent wrote two JSON objects or left a trailing dict literal. Fix: explicit
      json.dumps() + single write; validate with json.loads() before writing. Also adds PCIB scores from
      experiment_2436_tier0l_scores.json (not included in v1's 7 verifiers) to attempt AUROC >= 0.9236."
    retire_if_same_verdict: false
  prompt: "CONTEXT: exp2438 (Conformal P-Value Ensemble v1, .236) achieved conformal_ensemble_auroc=0.9167\n\
    (7 verifiers fused, ensemble_auroc_improved=true) BUT the JSON artifact had Extra data at char 1999\n(line\
    \ 75 column 2), preventing json.load() and blocking the downstream capstone gate. The AUROC\nvalue was confirmed\
    \ via regex: conformal_ensemble_auroc=0.9166666666666666.\n\nThe gap to HIVE peer target is only 0.0069 (0.9236\
    \ - 0.9167). This v2 fixes the JSON\nmalformation AND adds PCIB scores (Tier 0l, AUROC=0.802 from exp2436)\
    \ which were computed\nbut never fused into the ensemble. Adding one more orthogonal verifier (PCIB Pearson\n\
    r with existing verifiers likely < 0.5) may push the ensemble past 0.9236.\n\nEXISTING CODE TO READ FIRST:\n\
    \  {project_root}/python/carnot/verify/conformal_ensemble.py (from exp2438)\n  {project_root}/results/experiment_2438_conformal_ensemble_v1.json\
    \ (first 60 lines — key fields)\n  {project_root}/results/experiment_2436_tier0l_scores.json (PCIB scores\
    \ to fuse)\n  {project_root}/results/experiment_2435_tier0k_scores.json (DiffuTruth scores)\n  {project_root}/results/experiment_2437_logcons_z3_scores.json\
    \ (LogCons Z3 scores)\n\nTASK: Rebuild conformal ensemble with JSON-safe output, fuse PCIB (8th verifier).\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. sklearn importable: .venv/bin/python -c \"import sklearn;\
    \ print(sklearn.__version__)\"\n     b. conformal_ensemble.py exists:\n        ls {project_root}/python/carnot/verify/conformal_ensemble.py\n\
    \        If missing: write honest_verdict blocked_conformal_module_missing and exit.\n     c. PCIB scores file\
    \ present:\n        ls {project_root}/results/experiment_2436_tier0l_scores.json\n        If missing: run without\
    \ PCIB (7-verifier mode) and note pcib_fused=false.\n     d. Telemetry manifest present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Read conformal_ensemble.py.\
    \ Identify the code path that generates the final artifact.\n     Find where json.dump() or file write occurs.\
    \ Confirm it uses a single json.dumps(result_dict)\n     and writes once. If multiple write calls exist:\
    \ consolidate to one.\n\n  2. Load existing score files for all verifiers:\n     From experiment_2438, load\
    \ verifier scores for the 7 already-computed verifiers.\n     Load experiment_2436_tier0l_scores.json (PCIB,\
    \ 36 entries).\n     Load experiment_2435_tier0k_scores.json (DiffuTruth, 36 entries).\n     Ensure all score\
    \ lists have 36 entries with matching idx order.\n\n  3. Rebuild conformal ensemble with 8 verifiers (7 from\
    \ v1 + PCIB):\n     - Use 10 calibration examples (same as v1: first 10 entries).\n     - Compute p-values\
    \ for remaining 26 test examples.\n     - Aggregate via Fisher's method (same as v1).\n     - Compute conformal_ensemble_auroc\
    \ on the 26 test examples.\n     - Compute ensemble_auroc_improved: conformal_ensemble_auroc > 0.8864 (HIVE\
    \ v4 baseline).\n     - Compute conformal_vs_hive_peer_delta: conformal_ensemble_auroc - 0.9236.\n\n  4. Validate\
    \ JSON output before writing:\n     result_str = json.dumps(result_dict, indent=2)\n     json.loads(result_str)\
    \ # Raises if malformed\n     Write result_str to deliverable with a single open(path, 'w').write(result_str)\
    \ call.\n     DO NOT write multiple JSON objects to the same file.\n\n  5. Unit test:\n     PYTEST_ADDOPTS=\"\"\
    \ .venv/bin/python -m pytest tests/python/verify/ -k \"conformal\" -v --no-cov 2>&1 | tail -15\n\nREQUIRED\
    \ ARTIFACT FIELDS:\n  - honest_verdict:\n      principle: \"Terminal-prefix required. complete: with AUROC\
    \ value.\"\n  - conformal_ensemble_auroc:\n      principle: \"Primary metric. Must be from conformal ensemble,\
    \ not individual verifier.\"\n  - ensemble_auroc_improved:\n      principle: \"conformal_ensemble_auroc > 0.8864\
    \ (HIVE v4). Required for downstream capstone gate.\"\n  - conformal_vs_hive_peer_delta:\n      principle:\
    \ \"conformal_ensemble_auroc - 0.9236. Negative means gap remains; positive means breach.\"\n  - n_verifiers_fused:\n\
    \      principle: \"Must be 8 (7 from v1 + PCIB). Documents ensemble composition.\"\n  - pcib_fused:\n    \
    \  principle: \"Boolean. True if PCIB scores were successfully loaded and fused.\"\n  - n_calibration_examples:\n\
    \      principle: \"Must be 10 (same as v1 for comparability).\"\n  - n_eval_examples:\n      principle: \"Must\
    \ be 26 (36 total - 10 calibration).\"\n  - json_validation_passed:\n      principle: \"json.loads(result_str)\
    \ succeeded before write. Guards against repeat of exp2438 malformation.\"\n  - random_seed:\n      principle:\
    \ \"Must be 42.\"\n  - duration_s:\n      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n\
    \      principle: \"Records sklearn, conformal module, PCIB scores, telemetry checks.\"\n\nACCEPTANCE GATES:\n\
    \  - condition: \"ensemble_auroc_improved == true\"\n    principle: \"Ensemble must beat HIVE v4 (0.8864) to\
    \ be useful. This gates the capstone.\"\n  - condition: \"json_validation_passed == true\"\n    principle:\
    \ \"JSON must be valid — no repeat of exp2438 Extra data bug.\"\n  - condition: \"n_eval_examples >= 20\"\n\
    \    principle: \"Sufficient holdout set for AUROC reliability.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2449-hallufield-tier0m
  title: 'Phase 1: HalluField Tier 0m Verifier (arXiv:2509.10753) -- Field-Theoretic Token-Path Energy'
  milestone: 2026.05.237
  deliverable: results/experiment_2449_hallufield_tier0m.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp571-hallufield-tier0e
    verdict: tier_0e_viable
    addressed_by: "exp571 implemented HalluField (arXiv:2509.10753) as a contextual Tier 0e check and SUCCEEDED
      (tier_0e_viable). exp2449 is different scope: implementing HalluField as a standalone Tier 0m
      verifier with proper 36-entry evaluation against the live_sota_balanced_telemetry_manifest_1480.jsonl,
      computing verifier scores for conformal ensemble integration (experiment_2449_tier0m_scores.json),
      and measuring orthogonality vs existing verifiers. exp571 was a viability check; exp2449 is
      production implementation for ensemble integration."
    retire_if_same_verdict: false
  prompt: "CONTEXT: HalluField (arXiv:2509.10753, Sep 2025) models LLM responses as discrete\nlikelihood\
    \ token paths with associated energy and entropy under varying temperature.\nHallucinations show shifted\
    \ energy/entropy distributions across token paths — CLAIMED SOTA\nacross multiple models and datasets. Does\
    \ NOT require auxiliary LLMs.\n\nPrior exp571 validated HalluField as viable (Tier 0e). This task implements\
    \ it as\na standalone Tier 0m verifier for ensemble integration. Token-path energy under temperature\n\
    variation provides a signal orthogonal to PCIB (Tier 0l), DiffuTruth (Tier 0k), and HALT\n(logit-space\
    \ probe). If orthogonal, it improves the conformal ensemble.\n\nBest current AUROC: 0.9167 (exp2438 conformal,\
    \ 7 verifiers). Target: 0.9236.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/semantic_energy.py\
    \ (Tier 0g — energy score pattern to follow)\n  {project_root}/python/carnot/verify/pcib_verifier.py (Tier\
    \ 0l — similar feature extraction)\n  {project_root}/results/experiment_2436_pcib_tier0l.json (Tier 0l:\
    \ AUROC=0.802)\n\nTASK: Implement HalluFieldVerifier (Tier 0m) and evaluate on 36 telemetry entries.\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. numpy importable: .venv/bin/python -c \"import numpy; print(numpy.__version__)\"\
    \n     b. scipy importable: .venv/bin/python -c \"import scipy; print(scipy.__version__)\"\n        If missing:\
    \ .venv/bin/pip install scipy -q\n     c. sklearn importable: .venv/bin/python -c \"import sklearn; print(sklearn.__version__)\"\
    \n     d. Telemetry manifest present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n\
    \        If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Implement HalluFieldVerifier\
    \ at python/carnot/verify/hallufield_verifier.py:\n     CPU approximation of field-theoretic token-path energy:\n\
    \       For each telemetry entry (logprobs list available):\n         temp_grid = [0.5, 0.8, 1.0, 1.2, 2.0]\
    \ (5 temperature values)\n         For each temperature T:\n           scaled_logprobs = logprobs / T\n       \
    \    path_energy = -mean(scaled_logprobs)  # energy at temp T\n           path_entropy = -sum(p * log(p))\
    \ where p = softmax(scaled_logprobs)\n         energy_variation = std([path_energy at each T])  # how much\
    \ energy shifts\n         entropy_variation = std([path_entropy at each T])  # how much entropy shifts\n  \
    \       hallufield_score = energy_variation * entropy_variation  # higher = more hallucination-like\n     Output:\
    \ hallufield_score (higher = more likely hallucination), temperature_grid_used.\n\n  2. Evaluate on 36 telemetry\
    \ entries:\n     hallufield_auroc: AUROC on 36 examples.\n     hallufield_vs_semantic_energy_delta: hallufield_auroc\
    \ - 0.810 (SemanticEnergy Tier 0g baseline).\n     orthogonality_vs_pcib: Pearson r between hallufield_score\
    \ and pcib_score across 36.\n     orthogonality_vs_halt: Pearson r between hallufield_score and halt_probe_score.\n\
    \n  3. Compute verifier_scores for conformal ensemble:\n     Write results/experiment_2449_tier0m_scores.json\
    \ format:\n     {{\"verifier\": \"hallufield\", \"scores\": [{{\"idx\": i, \"score\": s, \"label\": l}} for all 36]}}\n\
    \n  4. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/verify/ -k \"hallufield\"\
    \ -v --no-cov 2>&1 | tail -15\n     Create test if none exists.\n\n  5. Write deliverable. Validate JSON:\
    \ json.loads(json.dumps(result)) before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n     \
    \ principle: \"Terminal-prefix required. complete: with AUROC.\"\n  - hallufield_auroc:\n      principle:\
    \ \"Primary metric. Honest result regardless of sign vs baseline.\"\n  - hallufield_vs_semantic_energy_delta:\n\
    \      principle: \"hallufield_auroc - 0.810. Positive = improvement over SemanticEnergy.\"\n  - orthogonality_vs_pcib:\n\
    \      principle: \"Pearson r with PCIB. If abs(r) < 0.5, HalluField adds independent signal.\"\n  - temperature_grid_used:\n\
    \      principle: \"Documents which temperatures were used — reproducibility.\"\n  - n_eval_examples:\n   \
    \   principle: \"Must be 36.\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n     \
    \ principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n      principle: \"Records numpy,\
    \ scipy, sklearn, telemetry checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"hallufield_auroc != null AND\
    \ n_eval_examples >= 30\"\n    principle: \"Must produce valid AUROC on sufficient data — even below baseline\
    \ is a useful finding.\"\n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2450-laab-meta-judgment-v2
  title: 'Phase 1: LaaB ACL 2026 Full Meta-Judgment Bridge v2 (arXiv:2605.03971) -- Label Constraint Modeling'
  milestone: 2026.05.237
  deliverable: results/experiment_2450_laab_meta_judgment_v2.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 35
  prior_failures:
  - experiment_id: exp2380-hive-4verifier-ensemble-v1
    verdict: complete_hive_auroc_0.8539
    addressed_by: "exp2380 implemented the HIVE 4-verifier ensemble including an initial LaaB verifier (Tier 0h).
      The LaaB verifier was a basic logical consistency score. The LaaB ACL 2026 paper (arXiv:2605.03971)
      introduces a full meta-judgment bridge: the logical constraint that response labels and meta-judgment
      labels are either same or opposite based on self-judgment semantics. This v2 updates
      python/carnot/verify/laab_verifier.py to use the full meta-judgment bridge, re-evaluates on 36
      telemetry entries, and produces ensemble-compatible scores. Different scope: full ACL 2026
      mechanism vs initial basic implementation."
    retire_if_same_verdict: false
  prompt: "CONTEXT: LaaB ACL 2026 (arXiv:2605.03971, May 2026) bridges micro-level neural uncertainty\nand\
    \ macro-level self-judgment via a meta-judgment processing mechanism. Key insight:\nthe response label and\
    \ meta-judgment label are LOGICALLY CONSTRAINED to be either the same\nor opposite based on self-judgment\
    \ semantics (\"I think this is correct\" → same polarity;\n\"I'm not sure\" → potentially different polarity).\
    \ This constraint-based consistency check is\northogonal to NLI and energy probes.\n\nThe existing laab_verifier.py\
    \ (in the codebase from exp2380) implements a basic LaaB check.\nThis v2 updates it with the full ACL 2026\
    \ meta-judgment bridge. The laab_verifier was included\nin exp2438's 7-verifier conformal ensemble (laab_verifier:\
    \ true in verifier_imports). Updating\nit should improve its standalone AUROC and potentially improve the\
    \ conformal ensemble further.\n\nBest current AUROC: 0.9167 (conformal ensemble, 7 verifiers). Target: 0.9236.\n\
    \nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/laab_verifier.py (current implementation)\n\
    \  {project_root}/python/carnot/verify/fregelogic_hybrid.py (Z3 verifier pattern for comparison)\n  {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\
    \ (first 3 lines — schema)\n\nTASK: Update LaaB verifier with full meta-judgment bridge; evaluate on 36 entries.\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. sklearn importable: .venv/bin/python -c \"import sklearn;\
    \ print(sklearn.__version__)\"\n     b. laab_verifier.py exists:\n        ls {project_root}/python/carnot/verify/laab_verifier.py\n\
    \        If missing: create from scratch following fregelogic_hybrid.py structure.\n     c. Telemetry manifest\
    \ present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n        If\
    \ missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Read current laab_verifier.py.\
    \ Identify where the consistency score is computed.\n     Add meta-judgment bridge logic:\n       A. Extract\
    \ self-judgment polarity from response (if response contains \"I think\"/\"I believe\"\n          → positive\
    \ polarity; \"I'm not sure\"/\"uncertain\" → negative polarity; else neutral)\n       B. Extract response\
    \ label polarity (positive if factual claim, negative if uncertainty marker)\n       C. Apply label constraint:\
    \ if self-judgment polarity is definite (positive/negative):\n            expected_response_polarity = self_judgment_polarity\n\
    \            meta_judgment_consistency = int(response_polarity == expected_response_polarity)\n          else:\n\
    \            meta_judgment_consistency = 0.5  # neutral\n       D. laab_meta_score = alpha * original_laab_score\
    \ + (1-alpha) * meta_judgment_consistency\n          (alpha=0.7 gives 70% weight to original logical consistency\
    \ + 30% meta-judgment)\n     Output: laab_meta_score, meta_judgment_applied (bool), self_judgment_polarity.\n\
    \n  2. Evaluate updated verifier on 36 telemetry entries:\n     laab_meta_auroc: AUROC on 36 examples.\n \
    \    laab_meta_vs_v1_delta: laab_meta_auroc - original_laab_auroc (compute both).\n     meta_judgment_applied_rate:\
    \ fraction of 36 examples where meta_judgment was applied.\n\n  3. Compute verifier_scores for conformal ensemble:\n\
    \     Write results/experiment_2450_laab_meta_scores.json:\n     {{\"verifier\": \"laab_meta\", \"scores\": [{{\"idx\"\
    : i, \"score\": s, \"label\": l}} for all 36]}}\n\n  4. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python\
    \ -m pytest tests/python/verify/ -k \"laab\" -v --no-cov 2>&1 | tail -15\n\n  5. Write deliverable. Validate\
    \ JSON: json.loads(json.dumps(result)) before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n\
    \      principle: \"Terminal-prefix required.\"\n  - laab_meta_auroc:\n      principle: \"Primary metric.\
    \ AUROC with meta-judgment bridge active.\"\n  - laab_meta_vs_v1_delta:\n      principle: \"laab_meta_auroc\
    \ - original_laab_auroc. Positive = meta-judgment improved the verifier.\"\n  - meta_judgment_applied_rate:\n\
    \      principle: \"Fraction of examples where meta-judgment polarity was definite. Documents coverage.\"\n\
    \  - n_eval_examples:\n      principle: \"Must be 36.\"\n  - random_seed:\n      principle: \"Must be 42.\"\
    \n  - duration_s:\n      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n      principle:\
    \ \"Records sklearn, laab module, telemetry checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"laab_meta_auroc\
    \ != null AND n_eval_examples >= 30\"\n    principle: \"Must produce valid AUROC on sufficient data.\"\n\n\
    Do NOT push. Do NOT modify scripts/research_conductor.py."

