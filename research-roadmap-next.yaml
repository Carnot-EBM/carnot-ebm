         calibration_policy_and_test_secrecy principle: no held-test label can affect generation settings or inclusion.
         phase_d_ladder_fixture_ready_score principle: readiness requires all exact, diversity, power, leakage, and tamper gates.
         duration_s/inference_substrate/field_provenance/test_commands/test_exit_codes/reproducibility_checksum principle: use measured `deterministic_exact_fixture_generation_no_llm`.
         verifier_is_oracle/missing_verifier_gaps principle: exact Python/Z3 validators are oracle and any uncovered method semantics are explicit gaps.
         honest_verdict principle: use `complete_ready:`, `complete_partial:`, or `blocked:`.
      8. Run focused unit/spec coverage, deterministic replay, Python/Z3 parity, split leakage, transform inverse, chance-floor, duplicate/order, tamper, schema, adversarial-verify, applicable E2E, protected-file, and root-clutter checks.
