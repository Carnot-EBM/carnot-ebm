- id: exp5126-distributional-energy-ranker-v470
  milestone: 2026.07.470
  title: PHASE A2 structured energy -- Distributional-EBM ranker/abstainer versus cheap baselines
  priority: high
  track: verification
  deliverable: results/experiment_5126_distributional_energy_ranker_v470.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 90
  gated_on:
  - upstream: exp5125-structured-reasoning-pool-v470
    artifact_field: structured_pool_ready
    op: "=="
    value: true
  prior_failures:
  - experiment_id: exp5112-fover-in-domain-selector-v469
    verdict: blocked_gate_check_failed
    addressed_by: "This task uses a new non-FoVer structured pool with exact deterministic validators and compares against cheap baselines rather than self-consistency on a retracted FoVer premise."
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V470's structured-energy test follows arXiv:2605.18871 at small local scale: decompose energy into deterministic constraint penalties plus a learned or calibrated quality score, and use ensemble/uncertainty for abstention. Do not use FoVer data or an LLM judge as the correctness oracle.

    EXISTING CODE TO READ FIRST:
    - CLAUDE.md
    - results/experiment_5125_structured_reasoning_pool_v470.json
    - data/research/
    - python/carnot/verify/
    - python/carnot/models/
    - python/carnot/pipeline/
    - openspec/capabilities/pipeline/spec.md
    - openspec/capabilities/llm-ebm-inference/spec.md
    - openspec/capabilities/research-harnesses/spec.md

    TASK:
    Evaluate a Distributional-EBM-style ranker/abstainer over the structured pool and compare it to cheap non-learned baselines. The learned score may be simple, but deterministic constraints must remain the ground truth.

    CONCRETE STEPS:
    1. Load the structured pool and hard-block if structured_pool_ready is not true.
    2. Split by task family and item id to prevent duplicate leakage.
    3. Implement or reuse a decomposed energy: deterministic constraint penalties + quality score + uncertainty/abstention term.
    4. Compare against cheap baselines such as length/features, parse validity, constraint-count-only, and random among valid candidates.
    5. Report accuracy@1, violation rate, abstention rate, AUROC/ranking metrics where applicable, and CI95 for delta versus the strongest cheap baseline.
    6. Run label-shuffle, family-holdout, duplicate, and model-identity shortcut controls.
    7. Set distributional_energy_delta to the headline delta over the strongest cheap baseline; set ranker_ready_for_audit=true only when CI95 excludes zero and controls pass.

    REQUIRED ARTIFACT FIELDS:
