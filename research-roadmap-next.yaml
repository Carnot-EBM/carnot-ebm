    max_turns: 40
    agent_type: claude
    requires_claude: true   # positioning a discriminative verifier against the generative-PRM frontier requires cross-paper synthesis + honest judgment about where the product does and does NOT lead -- not a mechanical aggregation; the positive criterion for claude
    estimated_wall_time_min: 18
    track: product
    inference_substrate: aggregation_from_upstream_artifacts
    requires_gpu: false
    deliverable: results/experiment_3773_verifier_product_prm_positioning.json
    prompt: |
      CONTEXT: The banked positive is a DISCRIMINATIVE step-error verifier (FoVer AUROC 0.9131, 4-verifier
      ensemble). The 2025-2026 PRM frontier has moved toward GENERATIVE verifiers (verification-CoT) and
      LABEL-FREE training, which generalize better OOD. Carnot must position its product HONESTLY: its edge is
      NOT raw F1 -- it is cheap (CPU, ~16s, no GPU/35B model), objective (energy-grounded, not LLM-as-judge),
      and now CERTIFIABLE (the exp3771 abstention operating point). This is a one-time POSITIONING analysis, NOT
      a verifier-generalization re-test (verifier-domain-boundedness is SETTLED -- see verifier-domain-bound
      memory; do NOT re-run a cross-domain eval).
      EXISTING CODE TO READ FIRST: research-references.md '.344 additions' Front-1 (GenPRM arXiv:2504.00891,
      ThinkPRM arXiv:2504.16828, uPRM arXiv:2605.10158, ProcessBench SOTA anchor) + Front-3 (VerifyBench
      arXiv:2507.09884, multi-domain RM arXiv:2510.00492) + '.345 additions'; ops/north-star.md sec-1 (the
      headline + the demoted product claims -- do NOT resurrect 8%->80%); the project_verifier_domain_bound
      memory (the settled domain-bound finding to cite, not re-test).
      TASK:
        1. Build a structured comparison TABLE: for each peer (GenPRM, ThinkPRM, uPRM, ProcessBench reasoning
           verifiers) record its as-reported metric + corpus + compute class, and Carnot's 0.9131 + corpus +
           compute class. Every peer number is AS-REPORTED BY THE SOURCE (not independently re-derived) -- label
           it as such (adversarial-verify discipline: do not present a peer's claim as a Carnot measurement).
        2. State PLAINLY, in a 'where_carnot_leads' / 'where_carnot_does_not_lead' split: leads on
           cost/objectivity/certifiability; does NOT lead on raw F1 vs large reasoning verifiers or on OOD
           generalization (settled domain-bound). No spin.
        3. Derive the honest product value proposition: a cheap, objective, energy-grounded step-error verifier
           with a CERTIFIED abstention operating point -- a complement to (not a replacement for) generative PRMs.
        4. Do NOT emit any number as a Carnot result that is not in a Carnot artifact (G4 discipline). Do NOT
           run any LLM or cross-domain eval.
      INFERENCE-SUBSTRATE HYGIENE: aggregation/synthesis; NO GGUF/CUDA markers. Run `.venv/bin/python
      scripts/adversarial_verify.py <artifact>`; confirm no critical flag.
      REQUIRED ARTIFACT FIELDS (principle documents WHY; store the bare VALUE):
        honest_verdict:
          principle: "Terminal prefix; the positioning outcome."
        inference_substrate: "aggregation_from_upstream_artifacts (principle: a literature/product synthesis, no live model)."
        comparison_table:
          principle: "The structured Carnot-vs-PRM-SOTA table -- the core deliverable; every peer number labeled as-reported."
        where_carnot_leads:
          principle: "The honest leads (cost, objectivity, energy-grounding, certified abstention) -- the defensible value proposition."
        where_carnot_does_not_lead:
          principle: "The honest non-leads (raw F1 vs large reasoning verifiers, OOD generalization) -- prevents over-claiming; cites the settled domain-bound finding."
        product_value_proposition:
          principle: "The one-paragraph honest positioning: a cheap, objective, CERTIFIABLE complement to generative PRMs."
        peer_numbers_are_as_reported_not_re_derived:
          principle: "BARE bool, true -- the anti-fabrication label: peer metrics are source-reported, not Carnot measurements."
        no_generalization_retest_run:
          principle: "BARE bool, true -- confirms no cross-domain eval was run (domain-boundedness is settled; re-testing would be churn)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Content hash catches drift."
        duration_s:
          principle: "Wall-clock plausibility floor."
      TERMINAL VERDICT example: "complete: verifier_product_positioned_vs_prm_sota_leads_cost_objectivity_certifiability_does_not_lead_f1_or_ood_no_generalization_retest"
      Run: cd {project_root} && .venv/bin/python scripts/experiment_3773_verifier_product_prm_positioning.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

