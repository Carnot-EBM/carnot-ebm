      2. Create `{project_root}/hardware/kv260/kanele_top.v` as the top-level Verilog wrapper.
      3. Create `{project_root}/scripts/experiment_1729_kanele.py` to run a simulation check.
      4. Write results to `{project_root}/results/experiment_1729_kanele.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
