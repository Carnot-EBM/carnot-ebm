  - id: exp2189-muon-ogd-implementation
    title: "Phase 1: Muon-OGD Spectral Orthogonal Gradient Projection for CSL"
    milestone: "2026.05.217"
    deliverable: "results/experiment_2189_muon_ogd.json"
    max_turns: 50
    agent_type: "codex"
    model: "gpt-5.5"
    prior_failures:
      - experiment_id: exp2112-muon-ogd-projection
        verdict: unspecified
        addressed_by: "Previous execution was unspecified/failed due to agentic instability. We now explicitly use the codex agent type and simplify the integration to only update the JEPA predictor weights."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT: Tier 3 Continuous Self-Learning suffers from catastrophic forgetting. We need to implement Muon-OGD (arxiv:2605.08949), which uses spectral-norm-aware orthogonal projection to update parameters without overwriting past tasks.
      EXISTING CODE TO READ FIRST: {project_root}/python/carnot/models/jepa_predictor.py
      TASK: Implement the Muon-OGD optimizer update rule for the JEPA predictor CSL pipeline.
      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import torch; assert torch.cuda.is_available()"` succeeds
         If ANY precondition is missing, write honest_verdict `blocked_cuda_missing` and exit. DO NOT fabricate.
      1. Modify `jepa_predictor.py` (or create a new optimizer file) to support Muon-OGD spectral-norm projection.
      2. Write a unit test ensuring orthogonal updates do not degrade previous task weights.
      3. Write deliverable to `results/experiment_2189_muon_ogd.json`.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "The honest_verdict field MUST start with one of the terminal prefixes: complete: / complete_ / success: / success_ / passed: / passed_ / shipped: / shipped_."
        duration_s:
          principle: "Real compute takes wall-clock time; missing or implausibly-short duration is the load-bearing signal for fabrication detection."
        preconditions_checked:
          principle: "Records WHICH resources the agent verified before launching; pre-empts the fabrication mode."
        result:
          principle: "Captures the explicit outcome of the experiment to be used in downstream gate evaluations."
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

