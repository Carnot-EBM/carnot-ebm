- id: exp5169-adversarial-verify-qd-citation-scope-fix-v474
  milestone: 2026.07.474
  title: PHASE 0 infrastructure -- fix adversarial_verify.py's QD-citation false-positive and audit flagged_adversarial severity handling
  priority: high
  track: infrastructure
  deliverable: results/experiment_5169_adversarial_verify_qd_citation_scope_fix_v474.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  estimated_wall_time_min: 60
  prompt: |
    CONTEXT:
    Reserved infrastructure slot 1 of 2 (CLAUDE.md "Overdue-Priority Forcing Function": every milestone
    with >=10 tasks reserves >=2 infra slots). exp5156 (.473's own transition task,
    results/experiment_5156_archive_472_activate_473.json) is still flagged_adversarial=true as of .474's
    start -- verified live, NOT covered by the 2026-07-02 _normalize_principle_wrapped_fields() fix that
    un-quarantined exp5161 (that was a different bug class: bare-value vs {{principle,value}}-wrapped
    field parsing). exp5156's flag is severity=warn, from
    scripts/adversarial_verify.py's `qd-random-mutation-ablation-omitted` check, which fires because
    exp5156's archive summary CITES/REPORTS exp5154's retired QD (quality-diversity / energy-as-fitness)
    finding as part of characterizing .472's close-out -- not because exp5156 makes any fresh QD claim of
    its own. The check needs to distinguish "this artifact reports on a QD finding made elsewhere" from
    "this artifact itself makes an unaudited QD claim."

    EXISTING CODE TO READ FIRST:
    - scripts/adversarial_verify.py (locate the `qd-random-mutation-ablation-omitted` / QD-related check
      function; read its exact trigger condition -- likely a keyword/field match against the artifact's
      own top-level content without distinguishing citation from claim)
    - results/experiment_5156_archive_472_activate_473.json (the live false-positive case -- confirm its
      flagged_adversarial/severity fields and the specific text/field that trips the check)
    - results/experiment_5161_gap4_protocol_execution_pilot_v473.json (the ALREADY-FIXED sibling case, for
      contrast -- read the 2026-07-02 corrigendum commits ca5a24945 and 487ee1533's diffs via
      `git show ca5a24945` / `git show 487ee1533` to understand the _normalize_principle_wrapped_fields()
      fix pattern and confirm this is a genuinely DIFFERENT bug, not the same one)
    - ops/known-issues.md (search "qd-random-mutation-ablation-omitted" and "exp5156" for any existing
      corrigendum notes)

    CONCRETE STEPS:
    1. Confirm exp5156 is still live-flagged (re-run the check against the current artifact) and identify
       the exact trigger: does the check scope to "artifact makes its own QD/energy-fitness claim" or does
       it over-broadly match any artifact that mentions/cites a QD-related experiment id or finding?
    2. Fix the check to scope to artifacts making their OWN QD/energy-fitness claim (e.g. a fresh
       `winning_trajectory_surfaced` / `qd_arm_result` / equivalent first-party field), not any artifact
       that cites or summarizes a prior QD result as part of a broader narrative (transition/capstone
       summaries are the common false-positive case).
    3. Also audit: does any milestone-transition-class module (archive/activate tasks) set
       flagged_adversarial from `exit_code != 0` rather than from the check's own `max_severity`? A
       WARN-only flag should not read identically to a CRITICAL one downstream (e.g. in capstone
       aggregation logic that excludes flagged artifacts from headline claims). Report what you find,
       fix it if it is a real bug, and report honestly if the severity handling is already correct.
    4. Add/update unit tests in tests/python/ covering: the fixed QD-citation-scope check (both the
       false-positive case it now avoids and a genuine QD-claim case it should still catch), and the
       severity-handling audit finding.
    5. Re-run the corrected check against exp5156's live artifact and confirm flagged_adversarial resolves
       to false (or, if the artifact genuinely does make a first-party QD claim you did not expect,
       report that honestly instead of forcing a false negative).
    6. Run a corpus-wide dry-run of the corrected check (matching the pattern of the 2026-07-02
       `--backfill` dry-run mentioned in ops/known-issues.md) to confirm the fix does not silently
       unflag any artifact that SHOULD stay flagged.
    7. Append a dated corrigendum to ops/known-issues.md documenting this fix, per the Documentation
       Update Rules (add, never delete).

    REQUIRED ARTIFACT FIELDS:
      root_cause_confirmed:
        value: string
        principle: "The precise trigger condition this task exists to establish before fixing it."
      severity_handling_audit_result:
        value: "clean or bug_found_and_fixed, with detail"
      exp5156_resolved:
        value: bool
        principle: "The concrete, verifiable outcome -- does the fixed check clear the known live
          false-positive case?"
      backfill_dry_run_summary:
        value: "dict with artifacts_still_flagged_count, artifacts_newly_unflagged_count,
          any_unexpected_unflag: bool"
        principle: "A fix that silently unflags genuine violations is worse than the false positive it
          fixes -- this field is the safety check."
      tests_added:
        value: int
      tests_passing:
        value: bool
      known_issues_md_updated:
        value: bool
      inference_substrate:
        value: aggregation_from_upstream_artifacts
      random_seed:
        value: int
      reproducibility_checksum:
        value: string
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_ AND state plainly whether
          exp5156 resolves clean."

    Do not push. Do not modify scripts/research_conductor.py.
