  - id: exp2675
    milestone: "2026.05.255"
    deliverable: "results/experiment_2675_sota_gguf_live_eval.json"
    title: "SOTA GGUF Live Pipeline Validation: Ensemble v11 on N=50 Qwen3.6-35B + Gemma-4-31B"
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    track: evaluation

    prior_failures:
      - experiment_id: exp2630-gguf-pipeline-smoke
        verdict: "complete: N=20 smoke, pipeline_auroc_vs_fover reported"
        addressed_by: "exp2630 (.251) ran a 20-example GGUF smoke test. This task scales to N=50, uses ensemble v11 (not v9 from .251), and runs both Qwen3.6-35B-A3B-GGUF and Gemma-4-31B-it-GGUF (vs single model in smoke). Target: full pipeline validation with PRECONDITIONS gate on GGUF cached."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Both RTX 3090s (48 GB VRAM total) have been idle since the .254 activation. Ensemble v11
      was validated on the FoVer corpus (exp2667) but has NOT been tested on actual GGUF model
      outputs. This experiment runs the full VerifyRepairPipeline on N=50 live-generated responses
      from two SOTA GGUF models to produce the first genuine live-inference validation of ensemble v11.

      MODEL_SPECS (mandatory per CLAUDE.md — must use at least one SOTA GGUF):
        - name: Qwen3.6-35B-A3B-GGUF
          hf_id: unsloth/Qwen3.6-35B-A3B-GGUF
          role: primary_inference
        - name: gemma-4-31B-it-GGUF
          hf_id: unsloth/gemma-4-31B-it-GGUF
          role: secondary_inference

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline — verify(), should_verify(), score_candidates())
      - results/experiment_2667_ensemble_v11_adversarial_val.json (ensemble_v11_auroc_mean, weights path)
      - results/experiment_2668_odar_free_energy_routing.json (odar_viable, routing_threshold)
      - scripts/experiment_template.py (ExperimentTemplate and cached_sota_pair() pattern)

      TASK: Run VerifyRepairPipeline with ensemble v11 on N=50 live GGUF outputs. Measure
      pipeline performance (energy score distribution, ODAR fast/slow split, repair delta).

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any inference):
         a. Check Qwen3.6-35B-A3B-GGUF cached:
            `ls ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/ 2>/dev/null | head -3`
            Record: qwen_cached (bool).
         b. Check gemma-4-31B-it-GGUF cached:
            `ls ~/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF/ 2>/dev/null | head -3`
            Record: gemma31b_cached (bool).
         c. Check CUDA available:
            `.venv/bin/python -c "import torch; print(torch.cuda.is_available(), torch.cuda.device_count())"` OR
            `nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>/dev/null`
            Record: cuda_available (bool), n_gpus (int).
         d. Check ensemble v11 weights exist:
            `ls results/ensemble_v11_weights.json 2>/dev/null`
            Record: ensemble_v11_weights_exist (bool).
         If both GGUF models absent AND cuda_available=False: write honest_verdict
         'blocked_gguf_not_cached_and_no_cuda' and exit. DO NOT fabricate inference.
         If at least one GGUF cached AND cuda_available: proceed using whichever model(s) are cached.
         If no GGUF cached but cuda_available: try smaller fallback (gemma-4-E4B-it as CPU smoke only,
         record n_examples=10, flag as smoke_only=true in artifact).

      1. Prepare N=50 evaluation prompts:
         Use 50 factual questions from FoVer corpus (data/fover_corpus.jsonl).
         Select first 50 entries with field 'question' or equivalent. If field not available,
         use 50 short arithmetic questions ("What is 15+27?", "What is 83-46?", etc.).
         Record: n_prompts_prepared (int), prompt_source (str).

      2. Run inference for each prompt through the available GGUF model(s):
         Use llama.cpp or transformers backend (whichever is available).
         For each prompt: generate response, then pass through VerifyRepairPipeline.verify().
         Record per-example: {prompt_idx, energy_score, should_verify (bool), inference_time_s}.
         Use batch_size=5, timeout per batch = 300s.
         Record: inference_mode='live_gpu', n_examples_run (int), mean_inference_time_s (float).

      3. Compute pipeline metrics:
         a. energy_score_distribution: {mean, std, min, max, p25, p75} across all 50 examples.
         b. odar_fast_path_rate: fraction of examples where should_verify() returned False.
         c. If repair was attempted on any: record n_repair_attempts, n_repair_successful.
         Record: all metrics above.

      4. Compare vs FoVer corpus baseline (from exp2667):
         ensemble_v11_auroc_fover = from results/experiment_2667_ensemble_v11_adversarial_val.json.
         Note: FoVer-based AUROC and live-inference energy scores are not directly comparable
         (different data distributions). Document clearly as apples-to-oranges comparison.
         Record: fover_auroc_reference (float), live_eval_energy_mean (float).

      5. Write results/experiment_2675_sota_gguf_live_eval.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required; 'blocked_' is honest if no GGUF cached and no CUDA."
      - inference_mode: str — 'live_gpu', 'live_cpu', or 'smoke_only'
        principle: "Distinguishes real GPU run from CPU fallback; paper-v6 claims require live_gpu."
      - n_examples_run: int — expected 50 (or 10 for smoke_only)
        principle: "Sample size determines statistical validity of energy distribution estimates."
      - energy_score_distribution: dict — {mean, std, min, max, p25, p75}
        principle: "Primary pipeline validation output: energy scores on live GGUF data vs FoVer."
      - odar_fast_path_rate: float — fraction of examples skipping verification
        principle: "ODAR Phase 4 metric: high rate = verification overhead reduced significantly."
      - models_used: list of str — which GGUF model(s) actually ran
        principle: "Traceability: confirms which SOTA model(s) generated the evaluated outputs."
      - qwen_cached: bool
        principle: "Precondition record: Qwen3.6-35B cache state documented."
      - gemma31b_cached: bool
        principle: "Precondition record: Gemma-4-31B cache state documented."
      - cuda_available: bool
        principle: "Hardware availability; False → CPU fallback path taken."
      - random_seed: int — 42
        principle: "Reproducibility: same 50 prompts on any re-run."
      - reproducibility_checksum: str — sha256 of first 50 FoVer entries used
        principle: "Content-addressed prompt selection prevents corpus drift."
      - duration_s: float
        principle: "Live GGUF inference on 50 examples: expected >= 120s; < 30s = suspicious."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records GGUF cache check, CUDA check, ensemble weights check."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2676
    milestone: "2026.05.255"
    deliverable: "results/experiment_2676_tier0f_semantic_calibration.json"
    title: "Tier 0f: Semantic Reward Calibration for Tier 0e EORM (arXiv:2605.15588)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: verifier

    prior_failures:
      - experiment_id: exp2663-tier0e-eorm
        verdict: "complete: tier0e_auroc >= 0.65, model saved"
        addressed_by: "exp2663 (.254) built Tier 0e as a TF-IDF margin-ranking logistic. This task EXTENDS Tier 0e with semantic-level calibration (arXiv:2605.15588), addressing the known false-positive issue on paraphrase pairs. New module python/carnot/verify/tier0f_semantic_calibration.py. Not a retry — a calibration layer on top of the existing model."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Paper arXiv:2605.15588 shows that energy-based reward models trained on token-level (correct,
      incorrect) pair objectives have ~40% higher calibration error (ECE) on semantically-equivalent
      paraphrases. The fix: cluster FoVer responses by semantic equivalence (TF-IDF cosine >= 0.9
      threshold), then assign shared reward labels within each cluster. This reduces false positives
      on paraphrase pairs.

      Tier 0e (exp2663) uses TF-IDF margin-ranking logistic — the exact setup that arXiv:2605.15588
      identifies as miscalibrated on paraphrases. Tier 0f adds the semantic clustering calibration
      layer on top of Tier 0e.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/tier0e_eorm.py (EORMVerifier class — load, verify interface)
      - results/experiment_2663_tier0e_eorm.json (tier0e_auroc, model_path, n_pairs_loaded)
      - data/fover_corpus.jsonl (corpus format — {question, correct, incorrect} fields)
      - python/carnot/verify/ (existing verifier module patterns)

      TASK: Implement Tier 0f semantic calibration layer on top of Tier 0e.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn available.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. Read results/experiment_2663_tier0e_eorm.json. Confirm tier0e_auroc exists and >= 0.60.
            If absent or auroc < 0.60: write honest_verdict 'blocked_tier0e_not_viable' and exit.
         c. `ls {project_root}/python/carnot/verify/tier0e_eorm.py` — Tier 0e module exists.
            If absent: write honest_verdict 'blocked_tier0e_module_missing' and exit.
         Record: preconditions_checked.

      1. Load FoVer corpus. For each (correct, incorrect) pair:
         a. Compute TF-IDF vectors for correct and incorrect texts.
         b. Find all pairs where cosine_similarity(correct_i, correct_j) >= 0.9 (semantic duplicates).
         c. Assign them to the same cluster and give the cluster a shared label.
         Record: n_paraphrase_clusters (int), n_pairs_in_clusters (int).

      2. Re-split dataset with cluster-aware train/eval split:
         Ensure all members of a cluster are in the SAME split (no cluster leakage).
         Record: cluster_aware_split_done (bool), train_size (int), eval_size (int).

      3. Re-train Tier 0e logistic on cluster-calibrated labels (same features as Tier 0e).
         Save calibrated model to results/tier0f_semantic_calibrated_logistic.pkl.
         Record: model_path (str).

      4. Evaluate Tier 0f on cluster-aware eval split:
         a. AUROC (sklearn roc_auc_score).
         b. ECE (Expected Calibration Error) — use 10-bin calibration:
            from sklearn.calibration import calibration_curve; compute mean abs bin error.
         c. Paraphrase pair FPR: fraction of (correct, paraphrase_of_correct) pairs where
            Tier 0f mistakenly scores the paraphrase as high-energy (incorrect).
         Record: tier0f_auroc (float), tier0f_ece (float), paraphrase_fpr (float).

      5. Compare vs Tier 0e:
         tier0e_auroc = from results/experiment_2663_tier0e_eorm.json.
         auroc_delta = tier0f_auroc - tier0e_auroc.
         ece_improvement = tier0e_ece - tier0f_ece (positive = better calibration).
         tier0f_viable = tier0f_auroc >= 0.63 AND ece_improvement > 0.
         Record: auroc_delta, ece_improvement, tier0f_viable.

      6. Create python/carnot/verify/tier0f_semantic_calibration.py with SemanticCalibratedVerifier class:
         - Same interface as EORMVerifier (verify(text) -> float energy score)
         - Loads cluster-calibrated model
         - __init__.py export
         Record: module_created (bool).

      7. Write results/experiment_2676_tier0f_semantic_calibration.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - tier0f_auroc: float
        principle: "Primary performance metric; must be comparable to tier0e_auroc from exp2663."
      - tier0f_ece: float
        principle: "Calibration error; arXiv:2605.15588's primary improvement metric."
      - paraphrase_fpr: float
        principle: "Direct measure of the false-positive problem Tier 0f is designed to fix."
      - auroc_delta: float — tier0f minus tier0e
        principle: "Confirms calibration did not degrade AUROC (acceptable: delta >= -0.05)."
      - ece_improvement: float — positive = better
        principle: "If ece_improvement <= 0, semantic calibration did not help; record honestly."
      - tier0f_viable: bool — auroc >= 0.63 AND ece_improvement > 0
        principle: "Gate for ensemble v12 inclusion in future milestone."
      - n_paraphrase_clusters: int
        principle: "Confirms paraphrase clusters were actually found (expected >= 10 in FoVer)."
      - random_seed: int — 42
        principle: "Reproducibility: cluster-aware split must be deterministic."
      - duration_s: float
        principle: "Clustering + logistic re-train: expected 5-60s; < 2s is suspicious."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records Tier 0e module check and corpus availability."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


  - id: exp2677
    milestone: "2026.05.255"
    deliverable: "results/experiment_2677_property_guided_repair_loop.json"
    title: "Property-Guided Counterexample Repair Loop: VegAS → Iterative Repair (arXiv:2605.16142)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: pipeline

    prior_failures:
      - experiment_id: exp2665-vegas-candidate-selection
        verdict: "complete: vegas_viable=true, K=3 implemented"
        addressed_by: "exp2665 (.254) implemented VegAS K=3 static candidate generation. arXiv:2605.16142 (property-guided synthesis) shows that using the verifier FAILURE as feedback to guide the NEXT generation reduces candidate count 7x vs static K. This task extends VegAS from 'generate K then score' to 'generate until verifier accepts (up to K_max=5 iterations)', using verifier failure message as context."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Paper arXiv:2605.16142 shows that counterexample-guided feedback (using the VERIFIER FAILURE
      as a structured signal to the LLM generator) reduces candidate programs generated per domain
      by 7x vs static K-candidate sampling. The loop: generate candidate → verify → if FAIL, pass
      failure message back to LLM for refinement → repeat up to K_max iterations.

      VegAS K=3 (exp2665) generates K candidates in parallel and scores all. Property-guided repair
      generates candidates SEQUENTIALLY, stopping as soon as one passes the verifier gate.

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (score_candidates, select_best_candidate methods added in exp2665)
      - results/experiment_2665_vegas_candidate_selection.json (vegas_viable, vegas_delta_vs_argmax)

      TASK: Add property-guided iterative repair to VerifyRepairPipeline.

      CONCRETE STEPS:
