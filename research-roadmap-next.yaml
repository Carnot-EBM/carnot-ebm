      - results/experiment_3292_evidence_matrix_v36.json
      - research-references.md
      - ops/e2e-test-plan.md

      TASK
      Produce a Garak failure-mode autopsy that identifies exactly which attack families, target strings, model behaviors, and gate clauses caused the .304 failure. Do not run a new model or new Garak eval in this task.

      CONCRETE STEPS
      1. Read exp3285 and exp3284 artifacts, including per-slice metrics, response previews, model specs, and blocked reasons.
      2. Classify failures by PromptInject, jailbreak/encoding, aligned-benign, DataFlip, empty/error, refusal, and repetition/degeneration behavior.
      3. Extract the exact target phrases and target-prefix patterns that a prefix-closed guard can monitor.
      4. Define the minimum evidence needed for exp3297, exp3298, exp3299, and exp3300 to claim progress.
      5. Emit a root-cause artifact with a ranked action list and no headline benchmark claim.

      REQUIRED ARTIFACT FIELDS:
      - garak_failure_autopsy_ready: bool (principle: downstream gates need a machine-readable root cause)
      - source_artifacts: list (principle: autopsy must trace to measured .304 evidence)
      - prior_attack_success_rate: float (principle: preserve the failed gate value)
      - prior_garak_attack_success_gate: float (principle: preserve the threshold)
      - failed_probe_families: list (principle: defense must be family-aware)
      - target_phrase_inventory: list (principle: prefix guard needs exact strings)
      - target_prefix_inventory: list (principle: BEAVER-style guard needs prefix-closed targets)
      - refusal_rate_by_family: dict (principle: distinguish safety refusal from target compliance)
      - repetition_or_degenerate_output_summary: dict (principle: response pathology may be independent of attack compliance)
      - gate_failure_clauses: list (principle: rerun must know which gate failed)
      - recommended_defense_axes: list (principle: ablation must be pre-specified)
      - downstream_gate_requirements: dict (principle: later tasks need falsifiable targets)
      - inference_substrate: str (principle: autopsy is aggregation-only)
      - random_seed: int (principle: reproducibility)
      - reproducibility_checksum: str (principle: artifact integrity)
      - duration_s: float (principle: timing evidence)
      - honest_verdict: str (principle: must start with complete:/success:/passed:/shipped:)
