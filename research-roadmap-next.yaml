        verdict: "blocked_cuda_unavailable"
        addressed_by: "This attempt is allowed to repair the llama.cpp/llama-cpp-python CUDA build path after exp3206 records the environment root cause."
        retire_if_same_verdict: true
      - experiment_id: exp3179-local-sota-receipt-smoke-v1
        verdict: "cpu_fallback_receipt_only"
        addressed_by: "The rebuild smoke must require CUDA/offload metadata and cannot mark CPU fallback as receipt-ready."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      `.296` blocked on CUDA/offload initialization even though an RTX 3090 was visible. You are working in {project_root} on {date}. This task may attempt a CUDA-capable llama.cpp or llama-cpp-python rebuild only after reading the environment ledger. Do not treat CPU fallback as success.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - results/experiment_3206_cuda_env_forensics_ledger_v1.json
      - results/experiment_3193_llama_cpp_cuda_offload_health_probe_v1.json
      - scripts/experiment_template.py
      - research-hardware-wishlist.md
      - research-references.md

      TASK
      Attempt the minimum safe CUDA rebuild or alternate binary path needed to make llama.cpp GPU offload available in a clean subprocess, then emit a gated smoke artifact for the full local SOTA receipt task.

      CONCRETE STEPS
      1. Read exp3206 and identify the recommended next action.
      2. If CUDA initialization is impossible at the driver/PyTorch level, do not rebuild blindly; write a blocked artifact with the exact blocker.
      3. If a rebuild is justified, use the local repo's normal dependency-management pattern and llama.cpp CUDA build guidance such as `-DGGML_CUDA=ON` or the equivalent llama-cpp-python CMake setting.
      4. Run a clean subprocess smoke that verifies the loaded library is CUDA-capable and can attempt GPU layers without immediately producing `ggml_cuda_init` failure.
      5. Do not run a long model evaluation here. This task prepares the runtime gate only.
      6. Write `results/experiment_3207_llama_cpp_cuda_rebuild_clean_subprocess_v1.json`.

      REQUIRED ARTIFACT FIELDS:
      - schema_version: string
      - experiment_id: string
