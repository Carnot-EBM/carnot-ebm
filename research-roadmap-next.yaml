      - CLAUDE.md
      - CODEX.md
      - research-references.md
      - results/experiment_3097_exact_fixture_eval_protocol_audit_v1.json
      - results/experiment_3085_icalm_task_abstention_sota_panel_v2.json
      - results/experiment_3087_gated_local_sota_verifier_calibration_v3.json
      - results/experiment_3094_capstone_v288.json

      TASK
      Define a MaxSAT-style abstention routing policy for .289 SOTA verifier and repair experiments.

      CONCRETE STEPS
      1. Translate Carnot's accept/reject/abstain decisions into hard constraints and weighted soft constraints.
      2. Include constraints for exact-label disagreement, model cache availability, formal-feedback lift, syntax/schema validity, repair intent preservation, and no-tiny-panel disqualification.
      3. Define a deterministic fallback if no MaxSAT solver package is installed locally; the artifact can be a policy spec plus a reference evaluator.
      4. Write or point to a small policy JSON/YAML spec if useful, but keep the required deliverable as the authority artifact.
      5. Record how exp3099, exp3101, and exp3102 must consume the policy.

      REQUIRED ARTIFACT FIELDS:
      - maxsat_policy_ready: bool (principle: routing policy must be available before reruns)
      - routing_policy_path: str (principle: downstream tasks need a concrete policy reference)
      - hard_constraints: list (principle: safety and exact-label constraints must be non-negotiable)
      - soft_constraints: list (principle: routing tradeoffs must be auditable)
      - objective_terms: dict (principle: optimization target must be explicit)
      - fallback_evaluator: dict (principle: missing MaxSAT packages must not silently fail open)
      - downstream_usage: dict (principle: SOTA tasks must consume the same policy)
      - source_artifacts: list (principle: policy must trace to prior failures and references)
      - inference_substrate: dict (principle: policy design must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

