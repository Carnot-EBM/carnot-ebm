  - id: exp3727-matched-compute-eval-harness
    milestone: "2026.06.341"
    title: "Build + UNIT-TEST the matched-COMPUTE evaluation harness: held-out reasoning accuracy of energy-descent generation vs AR generation at EQUAL total inference FLOPs (count EBT descent forward passes; give the AR baseline an equal-FLOP best-of-N budget). The measurement instrument for the .342 decisive comparison -- built + tested BEFORE the real run. THESIS-A bring-up step 3."
    priority: critical
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # building a measurement harness with a deterministic FLOP-accounting correctness criterion -- mechanical
    estimated_wall_time_min: 25
    track: phase3
    inference_substrate: aggregation_from_upstream_artifacts
    requires_gpu: false
    deliverable: results/experiment_3727_matched_compute_eval_harness.json
    prompt: |
      CONTEXT: Thesis-A bring-up. The CRITICAL P0.1 lesson: energy descent runs N forward passes per
      prediction, so a 'matched-params' win can be pure extra inference FLOPs (the exact P0.1 trap). The
      .342 decisive comparison MUST be matched-COMPUTE. This task builds + unit-tests that harness NOW so
      the .342 run cannot quietly cheat on compute accounting.
      CONCRETE STEPS:
        1. Implement a FLOP-accounting function: given an EBT generation (K energy-descent steps over a
           sequence) compute its total inference FLOPs; given an AR generation (best-of-M sampling) compute
           its total inference FLOPs. Use a transparent, documented FLOP model (params x tokens x passes).
        2. Implement the matched-compute comparison driver: for a held-out reasoning set, generate with the
           EBT (energy descent) and with the AR baseline GIVEN AN EQUAL TOTAL-FLOP BUDGET (tune AR best-of-M
           so its FLOPs ~= the EBT's), score held-out accuracy on BOTH, and report accuracy AT EQUAL FLOPs.
        3. UNIT-TEST the harness (tests/python/test_matched_compute_eval_harness.py) with at least: (i) the
           FLOP accounting is symmetric/correct on a hand-computed toy case, (ii) the budget-matcher actually
           equalizes FLOPs within a tolerance, (iii) a synthetic case where EBT and AR have known accuracy so
           the driver returns the expected matched-compute verdict. Every test asserts (no skips). Run the
           tests and report pass/fail HONESTLY.
      This task does NOT run the real models -- it builds + validates the instrument (aggregation/harness).
      INFERENCE-SUBSTRATE HYGIENE: no live-model markers. Run `python scripts/adversarial_verify.py <artifact>`;
      confirm no critical flag.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; store the bare VALUE):
        honest_verdict:
          principle: "Terminal prefix; this is a build+test task, terminal on tests passing."
        inference_substrate: "aggregation_from_upstream_artifacts (principle: builds an instrument, runs no live model)."
        flop_model_description:
          principle: "A transparent documented FLOP model is what makes 'matched compute' auditable rather than hand-wavy -- the load-bearing anti-P0.1-trap mechanism."
        unit_tests_added:
          principle: "Names the test file; tests-must-run-and-assert."
        unit_tests_passed:
          principle: "Honest pass count; a harness whose own tests fail cannot be trusted to judge .342."
        budget_matcher_tolerance:
          principle: "Records how tightly AR FLOPs are equalized to EBT FLOPs -- defines what 'equal compute' means quantitatively."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Content hash catches drift."
        duration_s:
          principle: "Wall-clock plausibility floor."
      TERMINAL VERDICT on success: "complete: matched_compute_eval_harness_built_flop_accounting_documented_unit_tests_<P>_of_<T>_pass"
      Run: cd {project_root} && python scripts/experiment_3727_matched_compute_eval_harness.py
