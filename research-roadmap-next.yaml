milestone: 2026.06.423
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-22) -- the .422 capstone (exp4578) is the FIFTH near-total
  honest null in a row: A1 clickability predictor-as-RANKER actions_delta=0.0 (2nd null after .416); A2
  verifier-guided EXPANSION transfer_delta=-0.04 with a BROKEN positive control (positive_control_passed=None,
  false-negative-risk OPEN -- not a clean null); A5 integration no_lever_raises_a_metric. The ONE real win:
  A3 banked cn04 L2 (reproducible_total_levels 52->53). The diagnosis is now triply-confirmed (.421 A6 -> .422
  A1 -> .422 A6): the bottleneck is candidate GENERATION, not ranking -- a re-ranker adds 0 value because the
  winning candidate is never generated. .423 PIVOTS the headline to the highest-confidence, most under-exploited
  score lever (GAP-LIVE-INTEGRATION, operator 2026-06-19 #1): we have 53 REPRODUCIBLE levels but the 2026-06-21
  live scorecard submitted only 33. The gap is mechanical -- a STALE package (sc25 L5 / tu93 L5 / lp85 L5 /
  cn04+cd82+sp80+su15+m0r0 L2 banked since the submission are not in it), 9 graph-explore/config-rule solves
  with NO banked replayable trajectory (dc22/ft09/g50t/s5i5/sb26/vc33/re86/bp35/lf52), and sc25 live
  version-drift (env_match=false). Closing it is "integration, not modeling". Flank with the operator's freshest
  2026-06-21 frontier (the feature-ROUTER for seen->hidden transfer + diversity-floor transfer + self-play every
  milestone) and HONOR the weekend HEADS-UP: do NOT re-run value-head best-first expansion (it regressed
  2/11 vs the diversity floor's 4/11).
milestone_title: 'CLOSE THE LIVE-SUBMISSION GAP (33->53) -- bank replayable trajectories + refresh the validated package + env-adaptive re-solve for version-drift (the highest-confidence score lever), flanked by the feature-ROUTER for seen->hidden transfer'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  THE SUBMITTED SCORE LAGS THE BANKED CAPABILITY. We have 53 reproducible levels and submitted 33 -- the largest
  under-exploited score lever in the sprint. .423 HEADLINE (A1): close the 33->53 live-submission gap -- refresh
  the validated package to current banked depth, BANK a replayable action trajectory for every offline-reproduced
  level that lacks one (extract the winning sequence reproduce() already replays), and make the submit replay
  ENV-ADAPTIVE (discover-from-env re-solve, not flat-replay) for version-drift games (sc25 env_match=false).
  Submission stays operator-only. FRONTIER (A3): the feature-ROUTER -- classify a game's mechanic from EARLY-PLAY
  features -> route to a general approach (diversity/BFS/A*/toolkit), the seen->hidden transfer per-game recipes
  cannot do (SkillRouter arXiv:2603.22455). Plus the level-up GUARANTEE via the self-play loop (A2, grows
  reproducible_total_levels), diversity-floor transfer (A4), self-learning persist+reuse (A5), integration (A6),
  2 infra (B1 live-submittable co-headline metric / B2 offline-arc-substrate METHODOLOGY guard), 1 hardware (C),
  1 SOTA-ingestion (D), capstone (E). verifier_is_oracle:false on every value claim.
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC; >=1 level-up
  attempt (ARC Level-Up Attempt Guarantee, A2); 2 reserved infra (B1/B2); 1 per-board hardware (C); 1
  SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus."

