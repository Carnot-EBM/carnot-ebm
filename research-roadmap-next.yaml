    \ energy gate MUST stay in the E3AgentPolicy import closure\n(arc_orphan_solver_lint passes).\n\n\
    THE TIGHTENED GATE (adversarial_verify.check_engine_selection_candidate_diversity): required effective\
    \ =\nmax(10, ceil(0.6 * max(n_games_attempted, n_available_games))). For a 25-game corpus that is\
    \ ~15. You CANNOT\ndodge this by declaring a small min_heldout_games or under-declaring n_available_games\
    \ (the floor of 10 and\nthe max() prevent it). The .443 B1 audit verifies n_available_games against\
    \ the real `ls environment_files/`.\n\nEXISTING CODE TO READ FIRST:\n  - {project_root}/results/experiment_4801_structural_energy_s2v2_diverse_trust_gate.json\
    \ (the under-covered S2-v2 to extend corpus-wide)\n  - {project_root}/python/carnot/experiment_4801_structural_energy_s2v2_diverse_trust_gate.py\
    \ (the S2-v2 code)\n  - {project_root}/python/carnot/agentic/arc_executable_world_model.py (WorldModelVerifier\
    \ + induction/refinement rounds for generating diverse candidate engines)\n  - {project_root}/scripts/adversarial_verify.py\
    \ (check_engine_selection_candidate_diversity -- your artifact must satisfy effective >= max(10, ceil(0.6*corpus)))\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS (BEFORE any other step):\n     a. `.venv/bin/python -c \"from\
    \ carnot.agentic import arc_solver_kit as k; k.offline_arcade()\"` exits 0. Else blocked_offline_arcade_missing,\
    \ EXIT.\n     b. `ls environment_files/ | wc -l` returns the corpus size (>= 20). Else blocked_offline_corpus_missing,\
    \ EXIT.\n  1. For EACH available game, actively generate K>=3 diverse candidate engines; compute each\
    \ candidate's held-out off-path cell_recall + structural energy.\n  2. Mark a game EFFECTIVE iff candidate\
    \ off-path cell_recall spread > 1e-3. Record per-game diversity-achievable.\n  3. Require effective\
    \ >= max(10, ceil(0.6*n_available)). If fewer (diverse pools only formable for a few games), return\
    \ INCONCLUSIVE (below).\n  4. On effective games: energy-ranking vs binary-accuracy selection; bootstrap\
    \ the delta. LOG per-game. WRITE the artifact.\n\nFALSIFIABLE GATE:\n  PASS (-> S3 generation lift,\
    \ .444) iff effective >= max(10, ceil(0.6*n_available)) AND the energy-selected\n  off-path cell_recall\
    \ MINUS accuracy-selected > 0 with bootstrap CI95 EXCLUDING 0. BOUNDED iff that many\n  effective\
    \ AND CI95 includes 0 (a GENUINE corpus-wide null -> energy does not beat cheap accuracy at engine\n\
    \  selection; pivot the energy to S3 generation). retire_if_same_verdict: true -- if a corpus-wide\
    \ attempt\n  yields < the required effective games, return\n  complete_structural_energy_s2v3_inconclusive_insufficient_corpus_diversity\
    \ (the induction produces\n  near-identical engines corpus-wide) and RETIRE the off-path-trust-gate\
    \ framing; the energy's next test is S3.\n\nREQUIRED ARTIFACT FIELDS (principle-annotated):\n  honest_verdict:\n\
    \    principle: \"terminal prefix; a corpus-wide trust win is success_structural_energy_s2v3_trust_gate_authorizes_s3,\
