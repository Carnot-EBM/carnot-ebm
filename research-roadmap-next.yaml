    prompt: |
      CONTEXT: P0.1 (does energy-based global inference actually SOLVE, not just descend
      fast?) is the project's single most important test and has been LOST TO INFRA for
      three milestones (.319/.320/.321) on the live-LLM route. This is the INFRA-BULLETPROOF
      route: the Sudoku/Kona correctness-first solve-rate gate (ops/known-issues.md 'KONA
      GLOBAL-OPT CORRECTNESS-FIRST GATE'). CPU-only, NO GGUF, NO CUDA, NO live generation ->
      immune to the thinking-400 / tokenizer / CUDA failures. The operator filed this as the
      cleanest concrete P0.1 testbed: "if Carnot's Ising energy formulation can't solve hard
      Sudoku via global optimization, that's load-bearing evidence about the non-AR-reasoning
      endgame." exp3408 plateaued at final_energy=10.05 (never 0) and claimed a meaningless
      ~15x speedup over a slow AR baseline — fast-but-wrong. Kona 1.0 solves hard Sudoku at
      96.2% (~313ms) and frontier LLMs at ~2%, so the plateau is a Carnot-encoding/optimizer
      issue, NOT a fundamental limit. The literature gives the tools: arXiv:2403.04816 is a
      VERIFIED-CORRECT QUBO Sudoku energy (a valid board is the unique global minimum, E==0);
      arXiv:2406.11179 (IRED) and Kona run an ADAPTIVE number of optimization steps scaled to
      hardness to solve harder-than-training instances.

      EXISTING CODE TO READ FIRST:
        - scripts/experiment_3408_kona_global_opt.py (the energy~10 plateau — the bug to diagnose)
        - scripts/experiment_3440_kona_global_opt_correctness_v3.py (a prior correctness attempt)
        - scripts/experiment_3475_kona_process_energy_harder_instances_v5.py (the saturated block; reuse the harness)
        - scripts/experiment_2072_kona_sudoku.py + scripts/experiment_2085_pem_sudoku_eval.py (existing Sudoku-Ising harnesses)
        - python/carnot/ (the Ising energy / sampler modules; the SamplerBackend + adaptive_ising.py if present)
        - ops/known-issues.md "NEW 2026-05-30: KONA GLOBAL-OPT CORRECTNESS-FIRST GATE" (the mandatory Step-0 protocol + required fields)
        - research-references.md "2026-05-31 Post-.321 Planning Sweep" (QUBO-Sudoku 2403.04816, IRED 2406.11179, Enso, Kona datapoint)

      TASK: Validate the Sudoku-Ising energy encoding against the published QUBO (Step 0a),
      confirm easy-tier solvability (Step 0b), then climb the optimizer ladder on >=20
      puzzles across difficulty tiers, reporting SOLVE-RATE (final board valid / E==0 verified
      ON THE BOARD) by difficulty and by optimizer variant. An honest negative is a valid
      P0.1 datapoint.

      PRECONDITIONS (step 0 — MANDATORY AND GATING, run BEFORE any optimization):
        0a. ENCODING VALIDITY: encode a KNOWN-VALID solved Sudoku board into the Ising/QUBO
            energy and assert E == 0 (within float eps). Cross-validate the constraint set
            against arXiv:2403.04816 (row/col/box one-hot + cell one-hot penalties). If a
            valid solution does NOT give E==0 -> honest_verdict complete: blocked_energy_encoding_invalid
            with the per-constraint residual-energy breakdown; STOP. No optimizer can solve a
            mis-specified energy.
        0b. EASY-TIER SANITY: confirm the optimizer solves EASY (many-clue) boards. If it
            cannot -> complete: blocked_kona_failure_is_representational_not_optimizer (easy
            solve-rate ~0 means the failure is encoding, not optimizer power).

      CONCRETE STEPS:
        1. Run Step 0a/0b. Only if BOTH pass, proceed.
        2. Assemble >=20 puzzles across difficulty tiers (easy / medium / hard), labeled by a
           published difficulty metric (clue count + constraint-propagation depth). Document
           the source + seed.
        3. OPTIMIZER LADDER (report solve-rate per variant): (i) vanilla descent/Glauber;
           (ii) slower simulated-annealing schedule; (iii) K random restarts; (iv) parallel
           tempering / replica exchange (adaptive_ising.py if present); (v) ADAPTIVE step
           count scaled to hardness (IRED/Kona). PRINT one progress line per puzzle AND per
           ladder rung (LOAD-BEARING — defeats the 1201s idle-timeout).
        4. SOLVE = final board satisfies ALL Sudoku constraints, VERIFIED ON THE BOARD (not
           just an energy threshold). Report solve_rate overall + solve_rate_by_difficulty +
           by optimizer_variant.
        5. PLATEAU CHARACTERIZATION: for unsolved instances, report n_violated_constraints at
           the plateau (a few cells = optimizer-fixable; pervasive = representational).
        6. HYBRID: if pure energy descent can't close the last violations, test the energy +
           constraint-propagation hybrid (energy proposes; Carnot's Z3/AST/arc-consistency
           verifiers clean up residuals) and report its solve_rate SEPARATELY — narrows the
           claim honestly from "energy replaces search" to "energy is a global heuristic".
        7. ENERGY-vs-AR (solved subset only): for SOLVED puzzles, report time_to_solution vs
           an autoregressive baseline — a speedup claim is valid ONLY on the solved subset.
        8. Emit the artifact with clean methodology (real duration, seed, checksum).

      REQUIRED ARTIFACT FIELDS (each carries a principle per CLAUDE.md):
        honest_verdict: principle="Terminal verdict must start with complete:/success:/passed:/shipped_."
        inference_substrate: value=aggregation_from_upstream_artifacts
        encoding_validity_E0: principle="E of a known-valid solved board MUST be 0 (Step 0a), cross-validated vs arXiv:2403.04816 — gating; a solve-rate against a mis-specified energy is meaningless."
        qubo_crossvalidation_note: principle="how Carnot's constraint set maps to the published QUBO (row/col/box/cell one-hot) — the audit trail for Step 0a."
        easy_tier_solve_rate: principle="optimizer must solve EASY boards (Step 0b) before any hard claim; ~0 means the failure is representational."
        n_puzzles: principle=">=20 across tiers; solve_rate on n<20 is not headline-eligible (Sample-Size Rigor)."
        solve_rate: principle="fraction reaching a VALID solution (all constraints satisfied, verified ON THE BOARD) — the gate. Time is meaningless without it."
        solve_rate_by_difficulty: principle="per-tier so partial capability is visible."
        solve_rate_by_optimizer_variant: principle="which ladder rung solved what — the plateau diagnosis, auditable."
        n_violated_constraints_at_plateau: principle="distinguishes 'almost solved' (optimizer-fixable) from pervasive infeasibility (representational)."
        hybrid_solve_rate: principle="energy + constraint-propagation solve-rate, reported separately so the claim is honest (energy replaces search vs energy is a global heuristic)."
        time_to_solution_solved_only: principle="timing ONLY for solved instances; any speedup-vs-AR claim is valid ONLY on the solved subset."
        ar_baseline_solve_rate: principle="the autoregressive control's solve-rate on the same puzzles — the P0.1 comparator."
        random_seed: principle="determinism precondition for reproducibility."
        reproducibility_checksum: principle="content hash of puzzle set + encoding + optimizer config + seed."
        duration_s: principle="CPU global-opt over >=20 puzzles takes real wall time; honest value (not sub-second)."

      ACCEPTANCE GATES:
        - condition: "encoding_validity_E0 == true AND easy_tier_solve_rate > 0.5 BEFORE any hard solve-rate is reported"
          principle: "G0 CORRECTNESS-FIRST: the energy is valid (E==0 on a solved board, QUBO-cross-validated) and the optimizer solves easy boards — without this a hard solve-rate is meaningless (the known-issues KONA gate)."
        - condition: "solve_rate reported on >=20 puzzles AND any speedup claimed ONLY on the solved subset"
          principle: "G1 HONEST-SOLVE-RATE: kills the exp3408 fast-but-wrong framing; solve-rate is the gate, time is conditional on solving."
        - condition: "solve_rate > ar_baseline_solve_rate OR hybrid_solve_rate > ar_baseline_solve_rate"
          principle: "G2 P0.1-DATAPOINT: energy (or the energy+propagation hybrid) global inference solves at least as well as AR on a real CSP — the first clean P0.1 evidence on an infra-robust testbed; an honest negative here equally retires the timing framing."

      TERMINAL VERDICTS (all start with complete:):
        - encoding invalid -> "complete: blocked_energy_encoding_invalid_fix_encoding_not_optimizer"
        - representational failure -> "complete: blocked_kona_failure_is_representational_not_optimizer"
        - energy/hybrid solves competitively -> "complete: energy_global_inference_solves_sudoku_p01_datapoint_positive"
        - energy plateaus, only hybrid solves -> "complete: energy_is_global_heuristic_hybrid_solves_pure_descent_plateaus"
        - neither solves with the ladder -> "complete: ising_energy_cannot_solve_hard_sudoku_yet_p01_negative_retire_timing_framing"
      Run command: cd {project_root} && JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_3494_p01_sudoku_correctness_first_solve_rate_gate_v1.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

