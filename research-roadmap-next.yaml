    priority: critical
    track: continuous_learning
    requires_gpu: false
    max_turns: 50
    estimated_wall_time_min: 120
    requires:
      - exp6273-v541-post-marker-source-scope-freeze
    prior_failures:
      - experiment_id: exp6264-energy-familiarity-memory-gate
        verdict: "complete_null: energy familiarity mechanics passed, but a recorded test command failed so the readiness conjunction stayed closed"
        addressed_by: "This attempt changes the mechanism to dual positive and negative caches with entropy, diversity, frozen-reserve, and impurity-slope gates. It also separates focused scientific readiness from unrelated broad-suite status."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6264 found that one global energy threshold gave useful coverage and no unsafe shifted advice. Its task-conditioned threshold abstained on all 160 shifted test rows. EB-CaP suggests separate positive and negative caches with entropy and diversity gates. arXiv:2607.21673 provides an impurity reproduction-number test and a frozen-reserve admission certificate. This is a changed mechanism, not a threshold rerun.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md self-learning rules
      - {project_root}/research-references.md V541 certified-memory entries
      - {project_root}/results/experiment_6263_clean_sota_event_replay_bridge.json
      - {project_root}/results/experiment_6264_energy_familiarity_memory_gate.json
      - {project_root}/python/carnot/experiment_6264_energy_familiarity_memory_gate.py
      - {project_root}/python/carnot/experiment_5967_delayed_commit_memory_fixture.py
      - {project_root}/python/carnot/learn/constraint_memory.py
      - {project_root}/python/carnot/training/certificate_memory_replay.py
      - {project_root}/openspec/capabilities/self-learning/spec.md

      TASK
      Implement and evaluate certified dual-cache admission on the sealed Exp6263 bridge. Keep separate positive and negative caches. Admit only after entropy, diversity, and frozen-reserve checks. Estimate the adaptive-memory impurity reproduction number and an upper confidence bound. Compare no cache, unconditional cache, the Exp6264 global threshold, and the certified dual cache. Tune only on the chronological training prefix. Keep exact labels sealed for heldout evaluation.

      Required deliverable: {project_root}/results/experiment_6276_certified_dual_cache_admission.json.
      REQUIRED ARTIFACT FIELDS: status, upstream_bridge_path_hash_and_terminal_class, exp6264_control_path_hash_and_summary, paper_mechanism_receipts_and_claim_boundary, frozen_train_validation_test_partitions, frozen_reserve_manifest_path_and_hash, arm_definitions, positive_and_negative_cache_schema, entropy_gate_definition_and_fit_receipt, diversity_gate_definition_and_fit_receipt, impurity_admission_kernel_fit, admission_kernel_r_squared, impurity_reproduction_number, impurity_reproduction_number_upper_confidence_bound, coverage_by_arm_partition_model_task_family, unsafe_advice_by_arm_partition_model_task_family, calibration_and_abstention_by_arm, cache_purity_and_redundancy_by_arm, utility_and_negative_transfer_by_arm, poison_controls, drift_controls, rollback_identity_receipt, paired_intervals_and_sample_sizes, focused_scientific_test_result, broad_suite_result_and_disposition, certified_admission_ready_score, weight_mutation_count, source_mutation_count, protected_files_unchanged, preconditions_checked, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, random_seed, reproducibility_checksum, honest_verdict. Readiness requires the impurity upper bound below 1, useful heldout coverage, zero unsafe shifted advice, clean poison controls, and exact rollback. weight_mutation_count and source_mutation_count must be bare 0. field_principles must give one short principle for every required field.

      CONCRETE STEPS
      0. PRECONDITIONS: verify the Exp6263 bridge, freeze partitions, reserve rows, arms, thresholds, confidence method, safety gate, seed, and protected hashes.
      1. Add REQ-LEARN-6276 and scenarios to openspec/capabilities/self-learning/spec.md before implementation. Update traceability.
      2. Reproduce the Exp6264 global-threshold control exactly. Do not reuse its task-conditioned threshold as the treatment.
      3. Implement separate positive and negative caches. Use entropy and diversity admission. Calibrate only from the frozen reserve and training prefix.
      4. Estimate the admission-kernel slope and its uncertainty. Fail closed when the upper confidence bound is at least one or cannot be estimated.
      5. Evaluate held chronological, shifted-family, poison, and drift rows. Report every stratum before pooling.
      6. Prove byte-identical rollback and zero GGUF weight mutation. Declare aggregation_from_upstream_artifacts.
      7. Run focused tests and applicable e2e checks. Record broad-suite status separately. Record git status after tests. Adversarial-verify the artifact.

