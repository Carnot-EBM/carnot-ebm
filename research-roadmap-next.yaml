  - id: exp4556-a1
    milestone: 2026.06.421
    title: 'PHASE A1 (ARC NORTH STAR; PRIMARY; operator MANDATORY; HEADLINE) -- OPERATIONALIZE THE
      VERIFIER WIN: wire the .420-A2 cross-game DiscriminativeVerifier (LOO-AUROC 0.674 > chance,
      oracle-distinct) into the LIVE generic solver as a candidate ROUTER/ranker in rich_action_candidates
      / graph_explore_solve_v2; measure generic_transfer_rate_over_variants (baseline 0.04) + first-contact
      median actions WITH vs WITHOUT the verifier on held-out mechanic-preserving variants. Gate:
      generic_transfer STRICTLY > 0.04 with CI excluding the baseline OR a measured no-value
      characterization + positive control. verifier_is_oracle: false.'
    priority: critical
    track: arc-north-star
    max_turns: 150
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4556_verifier_router_generic_transfer.json
    operator_override: '2026-06-19 operator directive (GAP-ARCH-FEATURES / GAP-LIVE-INTEGRATION,
      ops/known-issues.md MANDATORY-NEXT-MILESTONE, "all three" step-back audit): the verifier-features
      work is the "highest-leverage verifier research item" and the submitted agent is the real ceiling.
      .420 A2 (exp4545) WON LOO-AUROC 0.674; this task OPERATIONALIZES that SUCCESS by wiring the
      discriminative verifier into the live solver as a router. Versioned-lineage continuation; the
      forward difference is "wire the SUCCESSFUL discriminative verifier as a LIVE candidate router and
      measure value-add on generic_transfer" -- distinct from the RETIRED cross-game learned-VALUE
      transfer (exp4318/4331/4342, value-function regression); different technique, falsifiable gate,
      operator-authorized. Not a doomed rerun.'
    prompt: |
      CONTEXT ({date}, ARC sprint HEADLINE). The ONE win of .420 was A2 (exp4545): the cross-game
      DiscriminativeVerifier beat LEAVE-ONE-GAME-OUT chance (LOO-AUROC 0.674, CI [0.606,0.745] excludes
      0.5; in-sample 0.871) -- the FIRST oracle-distinct verifier-moat result (north-star section 5's OPEN
      claim). But it is still a BENCH result: it has never been wired into the LIVE solver to prove it adds
      VALUE. The honest leaderboard ceiling is generic_transfer_rate_over_variants=0.04 (.420 B1), and the
      ARC-AGI-3 leaderboard metric is first-contact action efficiency on UNSEEN environments
      (arXiv:2603.24621). THIS TASK turns the moat win into a live first-contact capability.

      THE FIX (operationalize the verifier as a LIVE candidate ROUTER -- the hybrid: generator/solver
      proposes candidate actions, the oracle-distinct energy verifier ROUTES/prunes them):
        1. Load the trained cross-game DiscriminativeVerifier (arc_value_learner.py:497, features
           cross_game_features_v3 ~:394) and wire it into rich_action_candidates / graph_explore_solve_v2
           so candidate actions/states are RANKED by the learned cross-game discrimination signal (NOT by
           running the executable win-check -- verifier_is_oracle: false).
        2. Measure on held-out mechanic-preserving VARIANTS (arc_leaderboard_eval.py --variant N /
           --reflect; VariantEnv keeps the REAL win-logic): generic_transfer_rate_over_variants +
           first-contact median actions, WITH the verifier-router vs WITHOUT (the bare solver, the .420
           B1 0.04 baseline), measured the SAME way.
      The WIN: generic_transfer_rate_over_variants STRICTLY > 0.04 with a bootstrap CI excluding the
      baseline, AND solve-rate not dropped. The verifier runs on CPU (no LLM load).

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_value_learner.py (DiscriminativeVerifier ~497, cross_game_features ~27, cross_game_features_v2 ~50, cross_game_features_v3 ~394)
        - {project_root}/python/carnot/agentic/arc_graph_explore.py (graph_explore_solve_v2 ~216 -- the adapter-free generic solver where the router wires in)
        - {project_root}/python/carnot/agentic/arc_competition_agent.py (rich_action_candidates -- the candidate generator; SUBMITTED_AGENT_CONFIG ~1450; value_weight)
        - {project_root}/scripts/arc_leaderboard_eval.py (run_game --variant/--reflect ~108; VariantEnv)
        - {project_root}/python/carnot/experiment_4550_honest_sprint_metric.py (measure_generic_transfer_over_variants ~190 -- the baseline 0.04 harness; reuse it)
        - {project_root}/results/experiment_4545_cross_game_discrimination_v3.json (.420 A2: the trained verifier + LOO-AUROC 0.674 -- the win to operationalize)

      TASK: wire the above-chance DiscriminativeVerifier into the live generic solver as a candidate
      router; measure generic_transfer_rate_over_variants + first-contact median actions WITH vs WITHOUT,
      on held-out variants; verifier_is_oracle: false. Honest null if no value-add.

      CONCRETE STEPS:
        0. PRECONDITIONS (BEFORE any other step):
           a. `.venv/bin/python -c "from carnot.agentic import arc_solver_kit as k; k.offline_arcade()"` exits 0.
           b. `.venv/bin/python -c "from carnot.agentic.arc_value_learner import DiscriminativeVerifier"` exits 0 AND the trained verifier / cross-game corpus is loadable.
           ANY missing -> honest_verdict blocked_<resource>, populate preconditions_checked, EXIT (no fabrication). (--no-cov on any focused pytest.)
        1. Wire the DiscriminativeVerifier as a candidate router in rich_action_candidates / graph_explore_solve_v2 (rank candidates by the learned cross-game signal; keep the bare ordering as the no-regression fallback). Do NOT run the executable win-check as the ranking signal (that would be circular -- verifier_is_oracle would be true).
        2. Measure WITH-verifier vs WITHOUT on the 25 public games x N variants (reuse measure_generic_transfer_over_variants): generic_transfer_rate_over_variants, first-contact median actions, solve-rate. Report a bootstrap CI on the transfer-rate delta. The WIN: generic_transfer STRICTLY > 0.04 with the CI excluding the baseline AND solve-rate not dropped.
        3. POSITIVE CONTROL + FALSE_NEGATIVE_RISK: the verifier-router must beat a RANDOM-router control on the SAME variant set (proves the routing signal is load-bearing, not noise); a no-value null is valid only if this control passed. If generic_transfer does not rise, report the HONEST NULL + which feature family the router weights most (the actionable refinement for .422).
        4. METRIC DISCIPLINE: emit generic_transfer_delta explicitly with a null_delta_methodology_note when 0.0 (so a genuine null is not lost to a control==best TAUTOLOGY false-positive). Offline-reproduce any newly-solved variant via arc_solver_kit.reproduce.

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: verifier_router_generic_transfer_<n>_above_0.04 OR complete: verifier_router_no_value_added_honest_null_gap_sharpened."
        inference_substrate:
          principle: "verifier_ensemble_against_cached_candidates -- the discriminative verifier scores cached candidate features over offline variant envs, no LLM load (1s floor)."
        verifier_is_oracle:
          principle: "MUST be false -- the DiscriminativeVerifier ranks by a LEARNED cross-game signal, oracle-DISTINCT from the executable win-check; a circular win does not count (Circularity / Oracle-Distinctness Discipline)."
        generic_transfer_rate_with_verifier:
          principle: "the HEADLINE -- held-out variant transfer rate WITH the verifier-router; > 0.04 with CI-excl-baseline is the only non-circular live-value evidence."
        generic_transfer_rate_baseline:
          principle: "0.04 -- the .420 B1 bare-solver baseline, measured the SAME way (the apples-to-apples control)."
        generic_transfer_delta:
          principle: "with_verifier - baseline, emitted explicitly so a null (delta 0.0) is annotated, not a control==best TAUTOLOGY false-positive."
        generic_transfer_ci:
          principle: "bootstrap CI on the transfer-rate delta; a claim above baseline requires the CI to exclude the baseline (FALSE_NEGATIVE_RISK guard against a small-sample artifact)."
        first_contact_median_actions_with_verifier:
          principle: "the second leaderboard-relevant signal -- first-contact action efficiency on held-out variants with the router."
        solve_rate_preserved:
          principle: "HARD gate -- the routing win must NOT drop solve-rate (a router that prunes the winning action is worse)."
        random_router_control_passed:
          principle: "the POSITIVE CONTROL -- the verifier-router must beat a random-router on the SAME variants; guards a no-op/broken router; a null is valid only if this passed."
        false_negative_risk_checked:
          principle: "a no-value null is valid only if the random-router positive control passed."
        null_delta_methodology_note:
          principle: "present when generic_transfer_delta==0.0 -- states the equality is an honest no-value null, not a measurement bug."
        chosen_submitted_config:
          principle: "what (if anything) is recommended for SUBMITTED_AGENT_CONFIG (enable the verifier-router) -- the A5 input; 'unchanged' if null."
        missing_verifier_gaps:
          principle: "if no value-add, the sharpened discriminator still missing (Missing-Verifier Gap Logging) -- the verifier-build backlog input."
        offline_reproduced:
          principle: "any newly-solved variant must offline-reproduce to count."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "content-addressed hash catches silent corpus/verifier drift on replay."
        preconditions_checked:
          principle: "records resources verified (offline arcade, DiscriminativeVerifier loadable); pre-empts missing-resource fabrication."

      Run: cd {project_root} && .venv/bin/python python/carnot/experiment_4556_verifier_router_generic_transfer.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp4557-a2
    milestone: 2026.06.421
    title: 'PHASE A2 (ARC NORTH STAR; operator MANDATORY; THE 4th-AND-FINAL RE-INDUCTION ATTEMPT) --
