  verification
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
- id: exp7587-contract-methods
  title: Bind fourteen tasks and ingest evidence-alignment methods
  phase: 1
  track: reporting
  priority: high
  requires_gpu: false
  max_turns: 30
  estimated_wall_time_min: 30
  per_unit_rows: true
  milestone: 2026.09.663
  deliverable: results/experiment_7587_v663_contract_methods.json
  inference_substrate_class: aggregation
  MODEL_SPECS: []
  agent_type: codex
  model: gpt-5.6-sol
  prior_failures:
  - experiment_id: exp7586-capstone
    verdict: complete_blocked_required_v662_external_evidence
    addressed_by: New milestone accounting retains all blocked branches; it does not retry absent V662 panels.
    retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Work in {project_root} on {date} for milestone 2026.09.663. V662 has fourteen terminal dispositions, twelve producer artifacts and two absent panel producers. Its static and online proper-loss constructions stopped for lack of benefit; online retention failed. Its Rust process has a measured host-service positive. Archive lag is not missing science.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md
    - {project_root}/CODEX.md
    - {project_root}/research-program.md
    - {project_root}/ops/exclusion_manifest.yaml
    - {project_root}/ops/e2e-test-plan.md
    - {project_root}/scripts/experiment_template.py
    - {project_root}/python/carnot/reporting/current_work_receipt.py
    - {project_root}/research-roadmap.yaml
    - {project_root}/research-complete.yaml
    - {project_root}/research-references.md
    - {project_root}/python/carnot/experiment_7573_v662_contract_methods.py
    - {project_root}/results/experiment_7586_v662_capstone.json
    - {project_root}/scripts/audit_roadmap_gates.py
    - {project_root}/scripts/publication_gate.py
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Produce results/experiment_7587_v663_contract_methods.json. Create scripts/experiments/experiment_7587_v663_contract_methods.py as a thin CLI, reusable behavior in python/carnot/experiment_7587_v663_contract_methods.py and tests/python/test_experiment_7587_v663_contract_methods.py only where new behavior requires them. New output paths are not prerequisites.

    CONCRETE STEPS:
    1. Immediately print a flushed progress line. Resolve {project_root} absolutely; check source custody, capability REQ-* requirements and resource ownership before work. Missing external prerequisites produce complete_blocked_<reason>, verdict_class=blocked and gate_check_summary naming upstream, path, field, expected and observed values.
    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER each model load, generation, benchmark or subprocess that can take minutes. Inside long loops emit completed units and monotonic elapsed time every 60 seconds. Stream subprocess output and emit truthful pending-operation heartbeats every 60 seconds. Keep every silence gap below 600 seconds: silence can kill at 1200 seconds even though the hard cap is 4800 seconds. Checkpoint completed units and terminate only owned processes.
    3. Bound every tool call. Write ANY file over about 200 lines in several tool calls of about 100-150 lines, with a progress message BETWEEN calls. Split reads, source, tests and validation across calls. Put throwaway scripts in /tmp, durable experiment CLIs in scripts/experiments, and tests in tests/python. Do not compose a large source file and its tests in one call.
    4. Before changing implementation, append the named REQ-* and meaningful SCENARIO-* items to the existing capability spec, write failing tests, then implement. Reuse shipped components and thin CLIs. Preserve historical artifacts, production defaults, the active research-roadmap.yaml and unrelated work.
    5. Declare aggregation and MODEL_SPECS=[]. Select the staged authority only when its milestone is 2026.09.663; after activation use the matching active authority. Reuse the existing contract reader, changing only its data contract. Compare fourteen exact IDs exp7587 through exp7600, ordered titles, phases, deliverables, substrate and all gates against the V663 table. Test count/order/path/field mutations and consumed-staging operation.
    6. Authenticate V662 verdicts, flags, per-unit losses and service ratios. Retain the 80-group static null (Brier 0.146249673 versus raw 0.145635636), failed online retention, pre-inference ARC output-path rejection and host-only Rust result. Record all fourteen dispositions, including missing panel producers. Do not reactivate or rewrite previous tasks.
    7. Read EAEV sections 3.3-3.6, RT4CHART verification method, U-Calibration Algorithm 1 and on-chip KAN locality sections. Write docs/research-notes/v663-method-map.md and add ranked applicable/ deferred findings to research-studying.md. State that evidence-link adaptation is not an EAEV replication and delayed guarded SGD is not the U-Calibration algorithm.
    8. Run schema, prior-failure, exclusion, gate, harness-fit, ARC-floor and overdue-priority guards. Preserve E0 operator-blocked and E6 resolved; no submission is authorized. Compute stable G1-G4 with scripts/publication_gate.py --json. This administrative task never gates independent science.
    9. Freeze the affected-file validation scope. Use this worktree PYTHONPATH and private temporary directories under /tmp, NEVER under results/; create their parents before subprocesses. Run scoped pytest -n 0 -o addopts= --no-cov, 100 percent changed-module coverage with a command-local COVERAGE_FILE, scoped Ruff check/format, changed-module mypy and scripts/check_spec_coverage.py on affected tests. Keep existing repository debt separate. Never launch an unscoped full suite or relax an assertion to open readiness.
    10. Run the declared entrypoint plus a fresh-process cold replay. For learning exercise predict-release-update-persist-reload and duplicate rejection. For ARC run applicable E2E-009/010/011/012/013 and the real LLM-off private-output smoke; preserve immutable-evidence path rejection. Bindings require E2E-003/004; a subprocess service requires its complete request-update-durable-ack-restart integration. Read-only reporting has no numbered runtime E2E. Save actual commands, exits and log hashes.
    11. Independently reduce comparative rows; run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact candidate artifact. Record signs, counts, censoring and source hashes. Publish the validated artifact atomically. Readiness alone is null; oracle-defined positive controls are circular_positive. External missing or gate-blocked inputs are blocked, never partial. partial is only for unfinished work owned by this task.
    12. Reconcile changed capability specs, _bmad/traceability.md, ops/status.md and ops/changelog.md. Keep learned probabilities separate from exact truth; retain original nulls and flags. No external publication, submission, purchase, generator-weight change or default promotion is authorized. If the literal prior verdict repeats, record its narrow retirement disposition with retire_if_same_verdict=true; unchanged missing resources do not retire the scientific hypothesis.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: principle: Use a complete_ terminal prefix; execution completion does not prove benefit.
    - verdict_class: principle: Exactly positive | circular_positive | null | blocked | disqualified | partial; only own unfinished work retries as partial.
    - flagged_adversarial: principle: Persist the exact terminal reader outcome; flagged evidence cannot open a gate.
    - gate_check_summary: principle: Every blocked verdict names failed check, upstream, path, field, op, expected and observed values.
    - acceptance_gate_results: principle: Separate validity, readiness, benefit, retention and freshness, with a principle for every gate.
    - rows: principle: One auditable row per unit and arm, including absolute metrics, numerator/denominator, seed, direction, missingness and provenance.
    - sample_size_budget: principle: Record intended, observed, excluded and censored independent units; seeds and windows do not multiply source groups.
    - inference_substrate: principle: State the real execution mode; inherited GPU evidence is not current inference.
    - inference_substrate_class: principle: Record actual and planned classes separately; blocked_no_run means zero model work.
    - MODEL_SPECS: principle: Every current LLM call includes unsloth/Qwen3.8-27B-GGUF; cached-only tasks declare [] and historical identity separately.
    - invocation_counts: principle: Count current loads, forwards, generations and tokens independently from history.
    - duration_s: principle: Measure monotonic current work with phase spans; never pad time or inherit elapsed time.
    - random_seed: principle: Record explicit seeds for every stochastic stage.
    - reproducibility_checksum: principle: Bind immutable raw evidence, configuration and terminal reduction.
    - source_artifact_hashes: principle: Distinguish authenticated producer, missing producer and conductor pre-gate artifact.
    - validation_receipts: principle: Bind command, worktree, exit code and raw log hash; persist terminal readers.
    - verifier_is_oracle: principle: Exact labels and hand-built controls cannot support an oracle-distinct claim.
    - field_principles: principle: Carry each one-line field principle into the emitted artifact.
    - contract_ready_score: principle: 1 only for exact fourteen-row agreement, clean guards and mutation checks.
    - v662_dispositions: principle: One immutable evidence disposition for each prior planned task.
    - method_map_path: principle: Tie chosen mechanisms and exclusions to primary sections actually read.
    - publication_gates: principle: Use fixed G1-G4, paper_ready and unmet_gates without redefining them.

    Run command: cd {project_root} && PYTHONPATH={project_root}/python:{project_root} {project_root}/.venv/bin/python -u scripts/experiments/experiment_7587_v663_contract_methods.py --root {project_root} --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
