      CONTEXT: This is THE decisive P0.1 test. .318 cleanly established that the
      UNTRAINED energy (IsingVerifier arithmetic-violation + EbmCotCalibrator
      adjacent-contradiction heuristics, weight 1.0, T=1.0) does NOT beat
