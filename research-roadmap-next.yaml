         - false_rejects: object with integer value/principle.
         - full_verifier_calls_avoided: object with integer value/principle.
         - deterministic_failures_overridden: object with integer value/principle; must be 0.
         - no_speedup_claim: object with bool value/principle; wall-clock is exploratory only.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

