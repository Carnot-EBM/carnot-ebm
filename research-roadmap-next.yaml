    - {project_root}/scripts/sweep_semscholar.py

    TASK:
    Produce results/experiment_7421_v651_contract_ingestion.json. Create scripts/experiments/experiment_7421_v651_contract_ingestion.py as a thin entrypoint, reusable experiment code in python/carnot/experiment_7421_v651_contract_ingestion.py, and tests/python/test_experiment_7421_v651_contract_ingestion.py plus affected shared-module tests. These new paths are outputs to create. For a pure audit, reuse shipped readers and add code only for the independent reduction.
    Structured prerequisites: None.
    No whole-task structured gate. Authenticate branch-local inputs; unavailable science never promotes.

    CONCRETE STEPS:
    1. Emit a flushed progress line immediately, at EVERY phase boundary, and BEFORE AND AFTER every model load, generation, benchmark or subprocess that can take minutes. Print completed units and monotonic elapsed INSIDE every long loop at least every 60 seconds. Stream child output unbuffered and emit truthful pending-operation heartbeats every 60 seconds during blocking calls, authoring and validation. Keep every silence gap below 600 seconds: silent work can die at 1200 seconds; continued progress permits the 4800-second hard cap. Checkpoint completed units and cancel only owned processes. Never sleep to satisfy a duration floor.
    2. PRECONDITIONS: Read the relevant capability spec and confirm REQ-* requirements. Extend the spec and write meaningful failing spec-linked tests before implementation. Check real source paths before imports. New paths named in TASK are outputs to create, not missing prerequisites. Reuse narrow shipped helpers and keep the wrapper thin; do not clone an old launcher or blindly inherit its validation plan. Preserve frozen historical evidence.
    3. Declare inference_substrate_class=aggregation and execution_venue=host. Set MODEL_SPECS=[], model_invoked=false and all current LLM counts to zero. Small energy-head training has explicit small_ebm_training receipts. Archived and scripted model events remain typed hash-bound sidecars, never current invocation counts.
    4. Compare the single Exact Task Contract against the YAML whose milestone is 2026.09.651. Require exactly thirteen tasks exp7421 through exp7433 in order, with equal titles, paths, phases, substrates and structured gates. Reuse generic parsers; do not import an old main or its hard-coded task count. Mutate count, order, milestone, missing producer fields and quarantine status in private fixtures.
    5. Read all V650 terminal artifacts and the Exp7417 conductor pre-gate record. Bind hashes and original classes. Report the five negative labels among 149 online groups, the zero-call GPU dictionary-equality block, and the Exp7411 typed invocation conflict. The completion archive currently ends at V649; record ledger lag without changing research-roadmap.yaml or re-running completed work.
    6. Read the selected primary papers in the 2026-09-19 V651 source review. Use the sweep helpers or low-concurrency direct requests for a fresh check of at most eight sources. Record access failures, including Semantic Scholar citation access. Map spline-locality, partial feedback and claim attribution to this exact plan. Update research-studying.md as ingested; do not claim new discovery of previously indexed papers.
