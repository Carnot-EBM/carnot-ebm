    - results/experiment_5197_gap4_scaleup_real_checkpoint_v476.json.
    - results/experiment_5161_gap4_protocol_execution_pilot_v473.json.
    - python/carnot/experiment_5161_gap4_protocol_execution_pilot_v473.py and exp5177/exp5197 lineage.
