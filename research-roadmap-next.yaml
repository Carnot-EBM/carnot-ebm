- id: exp660-lsebmcl-constraint-memory
  milestone: 2026.04.50
  deliverable: results/experiment_660_lsebmcl_memory.json
  title: 'Exp 660: LSEBMCL Constraint Memory — EBM Replay to Prevent Catastrophic Forgetting (arXiv 2501.05495)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2501.05495 (January 2026) introduces LSEBMCL: Latent Space EBM for
    Continual Learning. The key mechanism: an EBM trained on task T1 generates replay
    samples for task T1 while training on task T2, preventing catastrophic forgetting.
    Applied to Carnot: the ConstraintTemplateLibrary (Exp 659) accumulates constraint
    templates across sessions. Without replay, training on session N constraint templates
    will overwrite session N-1 knowledge. LSEBMCL provides the replay buffer.
    Success criterion: forgetting_rate < 0.05 across 3 simulated sessions.

    EXISTING CODE TO READ FIRST:
    - python/carnot/pipeline/constraint_template_library.py — ConstraintTemplateLibrary (Exp 659)
    - python/carnot/models/kan.py — KAN model (replay generator base)
    - python/carnot/models/kaem_energy.py — KAEMEnergy (energy scoring for replay samples)
    - python/carnot/pipeline/env_autofix.py — apply_env_autofix()
    - scripts/experiment_template.py — ExperimentTemplate

    TASK: Implement LSEBMCL replay buffer for ConstraintTemplateLibrary.
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-SELF-021 (LSEBMCLReplayBuffer: generate replay samples from prior session
       EBM state to prevent forgetting; forgetting_rate < 0.05 across 3 sessions),
       SCENARIO-SELF-027/028 to openspec/capabilities/verifiable-reasoning/spec.md.
    3. Create python/carnot/pipeline/lsebmcl_replay.py:
       a. ReplaySession dataclass: session_id (int), n_templates (int),
          template_patterns (list[str]), ebm_energy_mean (float).
       b. LSEBMCLReplayBuffer class:
          __init__(self, energy_fn: Callable[[str], float],
                   max_replay_per_session: int = 10):
            self.energy_fn = energy_fn
            self.max_replay = max_replay_per_session
            self.sessions: list[ReplaySession] = []
          add_session(self, session_id: int, patterns: list[str]) -> ReplaySession:
            'Register a new session worth of constraint patterns.'
            energies = [self.energy_fn(p) for p in patterns]
            mean_energy = sum(energies) / max(len(energies), 1)
            session = ReplaySession(session_id=session_id,
                n_templates=len(patterns), template_patterns=patterns[:self.max_replay],
                ebm_energy_mean=mean_energy)
            self.sessions.append(session)
            return session
          generate_replay(self, current_session_id: int) -> list[str]:
            'Generate replay samples from all prior sessions (not current).'
            replay = []
            for session in self.sessions:
              if session.session_id < current_session_id:
                replay.extend(session.template_patterns[:self.max_replay])
            return replay
          compute_forgetting_rate(self, session_patterns: list[list[str]]) -> float:
            'Simulate continual learning and measure forgetting rate.'
            If len(session_patterns) < 2: return 0.0
            n_forgotten = 0
            n_total = 0
            for i in range(1, len(session_patterns)):
              prior_patterns = set(session_patterns[i-1])
              replay = set(self.generate_replay(i))
              still_remembered = prior_patterns.intersection(replay)
              n_forgotten += len(prior_patterns) - len(still_remembered)
              n_total += len(prior_patterns)
            return n_forgotten / max(n_total, 1)
       c. Export LSEBMCLReplayBuffer, ReplaySession from carnot.pipeline.
    4. Write scripts/experiment_660_lsebmcl_memory.py:
       a. apply_env_autofix() FIRST.
       b. ExperimentTimeoutWatchdog(660, timeout_minutes=30).
       c. ExperimentTemplate(660, 'LSEBMCL Constraint Memory',
          'results/experiment_660_lsebmcl_memory.json', requires_gpu=False).
       d. Simulate 3 sessions of constraint templates:
          session_1_patterns = ['COMPUTE: 47 + 28 = 76', 'total is 80', 'result is 15']
          session_2_patterns = ['COMPUTE: 100 / 5 = 18', 'therefore 25 apples', 'sum is 90']
          session_3_patterns = ['COMPUTE: 3 * 12 = 37', 'balance is 50', 'so 7 items']
       e. energy_fn = lambda p: float(len(p)) / 100.0  (toy EBM energy proxy)
          replay_buffer = LSEBMCLReplayBuffer(energy_fn=energy_fn, max_replay_per_session=5)
          For session_id, patterns in enumerate([s1, s2, s3], 1):
            replay_buffer.add_session(session_id, patterns)
       f. forgetting_rate = replay_buffer.compute_forgetting_rate([s1, s2, s3])
          lsebmcl_no_forgetting = (forgetting_rate < 0.05)
       g. Build artifact: schema='carnot.lsebmcl_memory.v1',
          n_sessions=3,
          forgetting_rate=<float>, lsebmcl_no_forgetting=<bool>,
          arxiv_ref='2501.05495',
          honest_verdict='lsebmcl_forgetting_controlled' if lsebmcl_no_forgetting
            else 'lsebmcl_forgetting_above_threshold'.
       h. tmpl.assert_deliverable_written() as FINAL LINE.
    5. Write tests/python/test_lsebmcl_replay.py (100% coverage on lsebmcl_replay.py).
       Tests trace to REQ-SELF-021.
    6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    7. Reconcile: ops/changelog.md, _bmad/traceability.md (FR-11 LSEBMCL row).
