      - results/experiment_3107_cross_corpus_matrix_v23.json
      - results/experiment_3108_capstone_v289.json

      TASK
      Write a local SOTA model-spec/cache manifest corrigendum that records mandated headline model IDs, cache status, selected usable model(s), missing models, and how solver-only tasks should proceed when cached_sota_pair_available=false.

      CONCRETE STEPS
      1. Inspect the .289 SOTA and formal-feedback artifacts for model_specs, cache status, selected model IDs, and matrix-reported gaps.
      2. Inspect scripts/experiment_template.py for the cached_sota_pair() pattern and current expected metadata fields.
      3. Build a manifest that always includes mandatory_headline_model_ids with all three mandated IDs, present_model_ids, missing_model_ids, cached_sota_pair_available, selected_headline_model_ids, smoke_test_model_ids, and headline_claim_allowed.
      4. Define downstream rules: solver-only tasks may run without cached_sota_pair_available; live LLM headline tasks must either use at least one mandated cached model or report headline_claim_allowed=false.
      5. Write only the deliverable artifact.

      REQUIRED ARTIFACT FIELDS:
      - sota_model_manifest_ready: bool (principle: downstream model tasks need a machine-readable cache authority)
      - mandatory_headline_model_ids: list (principle: SOTA policy must be explicit)
