- id: exp637-lowrank-kaem-sparse-redesign
  milestone: 2026.04.48
  deliverable: results/experiment_637_lowrank_kaem_sparse.json
  title: 'Exp 637: LowRankKAEM Full-Rank + Sparse Redesign — RETRO-057 Closure Attempt'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-057:\
    \ LowRankKAEM energy accuracy is outside 5% tolerance (carry count >= 4). The\
    \ calibration layer approach was exhausted (Exp 532 result). New approach: instead\
    \ of projecting KAEMEnergy to a low-rank approximation via SVD, redesign as a\
    \ FULL-RANK model with a sparse coupling graph. The intuition: low-rank compression\
    \ loses information because the energy landscape has many small eigenvalues that\
    \ collectively matter. Sparse coupling (keep only the top-K interactions by coupling\
    \ strength, zero out the rest) loses fewer significant terms while achieving similar\
    \ parameter reduction. With MultilevelKAEMTrainer from Exp 634, the sparse model\
    \ can be trained from coarse-to-fine for better accuracy.\n\nEXISTING CODE TO\
    \ READ FIRST:\n- python/carnot/models/kaem_energy.py — KAEMEnergy, UnivariateKAEMLayer\n\
    - python/carnot/pipeline/ — look for LowRankKAEMEnergy or similar from Exp 532\n\
    - results/experiment_532_low_rank_kaem.json (or similar) — prior LowRankKAEM result,\
    \ accuracy gap\n- python/carnot/training/multilevel_kan_trainer.py — MultilevelKAEMTrainer\
    \ (Exp 634)\n\nTASK: Implement SparseKAEMEnergy as a full-rank + sparse coupling\
    \ alternative to LowRankKAEM.\n1. Read CLAUDE.md spec-first workflow.\n2. Add\
    \ REQ-SAMPLE-021 (SparseKAEMEnergy: full-rank energy with top-K sparse coupling\
    \ graph), REQ-SAMPLE-022 (SparseKAEMEnergy: energy accuracy within 5% vs dense\
    \ baseline), SCENARIO-SAMPLE-035/036 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Create python/carnot/models/sparse_kaem_energy.py:\n   a. SparseKAEMEnergy\
    \ class:\n      __init__(self, n_vars: int, n_knots: int = 64, top_k_fraction:\
    \ float = 0.1):\n        self.n_vars = n_vars; self.n_knots = n_knots\n       \
    \ self.top_k = max(1, int(n_vars * top_k_fraction))  # top K interactions per\
    \ variable\n        self.layers = [UnivariateKAEMLayer(n_knots) for _ in range(n_vars)]\n\
    \        self.coupling_mask = jnp.ones((n_vars, n_vars)) - jnp.eye(n_vars)  # start\
    \ dense\n      sparsify(self, couplings: jnp.ndarray) -> jnp.ndarray:\n       \
    \ 'Zero out all but top-K coupling interactions per variable.'\n        k = self.top_k\n\
    \        abs_couplings = jnp.abs(couplings)\n        threshold = jnp.sort(abs_couplings,\
    \ axis=-1)[:, -k:-k+1]  # kth largest per row\n        return jnp.where(abs_couplings\
    \ >= threshold, couplings, 0.0)\n      energy(self, x: jnp.ndarray) -> float:\n\
    \        'Sum of univariate energies plus sparse pairwise interactions.'\n    \
    \    univariate_e = sum(layer.energy(x[i]) for i, layer in enumerate(self.layers))\n\
    \        # Use coupling_mask for sparse pairwise term (quadratic Ising-style)\n\
    \        coupling = self.sparsify(self.coupling_matrix)\n        pairwise_e = 0.5\
    \ * x @ coupling @ x\n        return univariate_e + pairwise_e\n   b. Export\
    \ SparseKAEMEnergy from carnot.models.\n4. Write scripts/experiment_637_lowrank_kaem_sparse.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. ExperimentTimeoutWatchdog(637, timeout_minutes=35).\n\
    \   c. ExperimentTemplate(637, 'LowRankKAEM Sparse Redesign',\n      'results/experiment_637_lowrank_kaem_sparse.json',\
    \ requires_gpu=False).\n   d. Generate synthetic energy landscape (same as Exp\
    \ 634: 20 vars, known ground-truth).\n   e. Dense KAEMEnergy baseline (K=64):\
    \ train with MultilevelKAEMTrainer. Record energy_accuracy_dense.\n   f. SparseKAEMEnergy\
    \ (K=64, top_k_fraction=0.1): train same epochs. Record energy_accuracy_sparse.\n\
    \   g. Vary top_k_fraction in [0.05, 0.10, 0.20, 0.50]:\n      For each: train\
    \ and measure accuracy. Find max fraction where accuracy_error < 5%.\n   h. LowRankKAEM\
    \ baseline (from Exp 532 result): load lowrank_energy_error if available.\n  \
    \ i. Compare: sparse_vs_dense_error = abs(energy_accuracy_sparse - energy_accuracy_dense)\n\
    \      retro_057_resolved = sparse_vs_dense_error < 0.05\n   j. Build artifact:\
    \ schema='carnot.lowrank_kaem_sparse.v1',\n      energy_accuracy_dense=<float>,\
    \ energy_accuracy_sparse=<float>,\n      sparse_vs_dense_error=<float>,\n     \
    \ best_top_k_fraction=<float>,\n      retro_057_resolved=<bool>,\n      lowrank_baseline_error=<float\
    \ | None>,\n      honest_verdict='sparse_resolves_retro_057' if retro_057_resolved\n\
    \        else 'sparse_improved_not_resolved' if sparse_vs_dense_error < 0.10\n\
    \        else 'sparse_no_improvement'.\n   k. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_sparse_kaem_energy.py (100% coverage\
    \ on sparse_kaem_energy.py).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\n7. Reconcile: ops/conductor-log.md (RETRO-057 status), ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT\
    \ modify scripts/research_conductor.py.\n"

