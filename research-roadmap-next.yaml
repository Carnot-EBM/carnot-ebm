        addressed_by: "exp2901 repaired import and n=16 parity. This task consumes the matched KV260/CPU basis and stays simulator-only with explicit no-TSU claim."
        retire_if_same_verdict: true
      - experiment_id: exp2898
        verdict: "complete: kv260_hardware_latency_transcript_recorded"
        addressed_by: "This task compares sampler output distributions on the existing KV260 problem basis rather than rerunning board latency."
