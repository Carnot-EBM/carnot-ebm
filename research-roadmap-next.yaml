       SCENARIO-VER-085 (SVAMP answer in plausible arithmetic range => verified).
    10. honest_verdict:
        "mismatch_confirmed_gate_open" if labeling_mismatch_confirmed=True
        "mismatch_unconfirmed_investigate_further" otherwise
