  - id: exp1832-mpemba-thermo-init
    title: "Exp 1832: Implement Mpemba-inspired Hybrid Digital-Thermodynamic Initialization"
    deliverable: "python/carnot/samplers/thermo_init.py"
    agent_type: codex
    prompt: |
      CONTEXT: Sampler latency is a bottleneck. arXiv 2605.13883 proposes digitally optimized initializations for thermodynamic computing inspired by the Mpemba effect (systems cooling faster from specific hot states).
      EXISTING CODE TO READ FIRST: python/carnot/samplers/backend.py
      TASK: Implement Mpemba initialization for our Gibbs/Langevin samplers.
      CONCRETE STEPS:
      1. Create python/carnot/samplers/thermo_init.py.
      2. Implement a function to generate non-equilibrium initial states that accelerate convergence to the target Boltzmann distribution.
      3. Add tests verifying convergence speedup on a toy 2D energy landscape.
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

