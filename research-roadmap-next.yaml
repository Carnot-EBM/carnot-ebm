  - id: exp2938
    milestone: "2026.05.277"
    deliverable: "results/experiment_2938_kv260_mmd_vs_cpu_sequential_gibbs_v1.json"
    title: "KV260 MMD vs CPU Sequential Gibbs (Deep Think FATAL #1 Rescue)"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 40
    estimated_wall_time_min: 60
    track: hardware
    inference_substrate: hardware_smoke
    prior_failures:
      - experiment_id: exp2898
        verdict: "complete: kv260_hardware_latency_transcript_recorded"
        addressed_by: "exp2898 anchored 24 µs/sample but did not check whether the FPGA's synchronous Glauber produces Boltzmann samples or a Non-Equilibrium Steady State. Deep Think 2026-05-23 FATAL #1 flagged that the chain may converge to a NESS / limit cycle rather than the target distribution. This task closes that gap by computing Maximum Mean Discrepancy (MMD) between exact CPU sequential Gibbs energies and KV260 synchronous parallel Glauber energies on identical Ising problems."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        The 2026-05-23 Phase-3 Empirical-Readiness Deep Think round
        flagged a FATAL ambiguity in exp2898's 24 µs/sample anchor:
        synchronous parallel Glauber on frustrated bipartite Ising
        graphs violates detailed balance and converges to a Non-
        Equilibrium Steady State (NESS) or 2-cycle, NOT the target
        Boltzmann distribution. The audit cannot distinguish "anchored
        to wall-clock" from "physically meaningful sample" without a
        comparison against an exact Boltzmann sampler.

        This task computes Maximum Mean Discrepancy (MMD) between the
        exact CPU sequential Gibbs energy distribution and the KV260
        synchronous parallel Glauber energy distribution on identical
        n=64 Ising problems (the same problems used by exp2898).

        Outcome determines whether the paper-v6 "exact sampling on
        FPGA" claim survives or is retracted per the Paper-v6
        Narrowing Discipline.

      EXISTING CODE TO READ FIRST:
        - CLAUDE.md (search for "Paper-v6 Narrowing Discipline" and
          "KV260 SSH-Not-SD-Card Discipline")
        - docs/research-notes/phase3-empirical-readiness-deep-think-results.md
        - results/experiment_2898_kv260_ising_sampler_hardware_latency_benchmark_v1.json
        - results/experiment_2912_same_basis_cpu_gibbs_baseline_v1.json
          (the existing sequential Gibbs baseline)

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. ssh kria reachable (precondition pattern from exp2898).
           b. exp2898 artifact present + bitstream_sha256 readable.
           c. exp2898's three seeds [42, 137, 271] reproducible
              (J matrix sha256 + h vector sha256 recorded).
        1. Regenerate the same n=64 Ising problems exp2898 used.
        2. Run exact CPU sequential Gibbs to convergence on each
           problem: random spin order, single-spin updates,
           10,000 post-burn-in samples per seed.
        3. Run KV260 synchronous parallel Glauber on each problem at
           exp2898's exact fixed-sweep schedule. Capture 10,000
           per-sample energies.
        4. For each seed, compute MMD^2 with RBF kernel between the
           CPU and KV260 energy distributions. Use bandwidth = median
           pairwise distance (standard practice).
        5. Compute a permutation-test p-value for MMD^2 significance
           (n_permutations=1000).
        6. As a second-opinion divergence measure, compute the
           Kolmogorov-Smirnov statistic + p-value per seed.
        7. Write the verdict:
           - If all three seeds have mmd_pvalue >= 0.01 AND ks_pvalue
             >= 0.01 → distributions indistinguishable; paper-v6 can
             retain narrow "approximately Boltzmann" claim.
           - If any seed has mmd_pvalue < 0.01 OR ks_pvalue < 0.01 →
             distributions distinguishable; paper-v6 must retract the
             "exact sampling on FPGA" claim and re-frame KV260
             outputs as "fixed-schedule heuristic samples."

      REQUIRED ARTIFACT FIELDS:
        honest_verdict:
          principle: "Must start with complete:/success: per Verdict Terminal-Prefix Discipline. If a precondition fails, blocked_<resource>."
        inference_substrate:
          value: "hardware_smoke"
          principle: "KV260 fabric is exercised; CPU baseline runs locally without LLM inference."
        preconditions_checked: list
        cpu_sequential_gibbs_energies_sha256: str
        kv260_synchronous_glauber_energies_sha256: str
        bitstream_sha256_cited: str
        per_seed_mmd_squared: list[float]
        per_seed_mmd_pvalue: list[float]
        per_seed_ks_statistic: list[float]
        per_seed_ks_pvalue: list[float]
        distributions_distinguishable:
          principle: "Single bit summarizing the three-seed comparison. True if any seed shows distinguishable distributions at p<0.01."
        paper_v6_recommendation:
          principle: "Concrete textual recommendation: retain | narrow | retract for the 'exact sampling on FPGA' claim."
        random_seeds_used:
          value: [42, 137, 271]
          principle: "Same seeds as exp2898 anchor."
        reproducibility_checksum: str
        methodology_note: str
        duration_s: float

      ACCEPTANCE GATES:
        - condition: "len(per_seed_mmd_squared) == 3 AND len(per_seed_mmd_pvalue) == 3"
          principle: "Three-seed replication is the floor for distinguishable / indistinguishable claim."
        - condition: "duration_s >= 60"
          principle: "Real CPU sequential Gibbs to convergence + KV260 retrieval + MMD + KS tests cannot finish in under a minute."
        - condition: "bitstream_sha256_cited matches the sha256 of the active KV260 bitstream"
          principle: "Anchors the comparison to the exact bitstream exp2898 used."

      Do NOT push. Do NOT modify the KV260 bitstream.

  - id: exp2939
    milestone: "2026.05.277"
    deliverable: "results/experiment_2939_cpu_synchronous_parallel_same_schedule_baseline_v1.json"
    title: "CPU Synchronous-Parallel Same-Schedule Baseline (Deep Think FATAL #4 Rescue)"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 30
    estimated_wall_time_min: 30
    track: hardware
    inference_substrate: live_llm_inference
    prior_failures:
      - experiment_id: exp2912
        verdict: "complete: same_basis_cpu_gibbs_baseline_ready_no_speedup_claim"
        addressed_by: "exp2912 ran CPU sequential Gibbs (detailed-balance preserving). Deep Think 2026-05-23 FATAL #4 flagged that comparing this to KV260 synchronous parallel Glauber (NOT detailed-balance preserving) is apples-to-oranges — measuring CPU-correct-sampler against FPGA-non-equilibrium-blinker. This task adds the apples-to-apples comparator: CPU executing the SAME synchronous parallel update schedule as the FPGA, so the speedup measurement is valid."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Deep Think FATAL #4: the exp2913 KV260-vs-CPU speedup-claim
        eligibility is invalid because the CPU baseline (exp2912) used
        sequential Gibbs (detailed-balance preserving) while KV260 uses
        synchronous parallel Glauber (NOT detailed-balance preserving).
        For an honest speedup measurement, both substrates must execute
        the same algorithm.

        This task implements CPU synchronous parallel Glauber with the
        same bipartite checkerboard schedule as KV260, runs it on the
        same n=64 problems, and computes the apples-to-apples speedup
        (which may show KV260 SLOWER than CPU at n=64 — per Deep Think
        FATAL #3 sub-scale crossover, this is the expected result).

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. exp2898 artifact present + reproducible seeds.
           b. exp2912 artifact present (the existing sequential-Gibbs
              baseline) so the comparison can also show the
              algorithm-shape difference.
        1. Implement a CPU synchronous-parallel Glauber updater
           (NOT sequential Gibbs) using the same bipartite checkerboard
           schedule as KV260. Single-thread Python / NumPy is sufficient.
        2. Run on the same n=64 Ising problems used by exp2898 with the
           same fixed-sweep budget (no early termination).
        3. Time per-sample wall-clock with high-precision timer.
        4. Compute the speedup-or-slowdown vs KV260's 24.0 µs/sample.
        5. As a cross-check, compare the CPU synchronous-parallel
           energy distribution against the KV260 synchronous-parallel
           energy distribution (they should be statistically identical
           — both are sampling the same NESS, not the Boltzmann).
        6. Write the verdict:
           - kv260_speedup_vs_same_schedule_cpu = (cpu_us / kv260_us).
           - If < 1.0: KV260 is SLOWER than CPU at n=64 (expected per
             Deep Think FATAL #3 crossover analysis). Paper-v6 must
             retract the speedup claim at current d.
           - If >= 1.0: KV260 is faster; paper-v6 can keep a narrow
             speedup claim with explicit "at n=64 only" scoping.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        inference_substrate: "live_llm_inference"
        preconditions_checked: list
        cpu_synchronous_parallel_per_sample_us_median: float
        cpu_synchronous_parallel_per_sample_us_p95: float
        kv260_per_sample_us_cited: float
        kv260_speedup_vs_same_schedule_cpu:
          principle: "The apples-to-apples speedup measurement. < 1.0 means KV260 is slower at this n; >= 1.0 means faster."
        energy_distribution_equivalence_test:
          principle: "Cross-check that the same broken sampler produces statistically-equivalent distributions on both substrates."
          shape: "{{ks_pvalue: float, mmd_squared: float}}"
        random_seed: int
        random_seeds_used: list[int]
        reproducibility_checksum: str
        paper_v6_recommendation: str
        methodology_note: str
        duration_s: float

      ACCEPTANCE GATES:
        - condition: "cpu_synchronous_parallel_per_sample_us_median > 0"
          principle: "Real timing was recorded."
        - condition: "energy_distribution_equivalence_test.ks_pvalue >= 0.01"
          principle: "Same algorithm on both substrates should give statistically-equivalent energies. Failure here suggests an implementation bug, not a hardware finding."
        - condition: "duration_s >= 20"
          principle: "Real n=64 synchronous Glauber on CPU for 10k samples × 3 seeds + KS test."

      Do NOT push.

  - id: exp2940
    milestone: "2026.05.277"
    deliverable: "results/experiment_2940_verifier_ensemble_auprc_code_corpora_v1.json"
    title: "Verifier Ensemble AUPRC on Code Corpora at 92.5% Negative Base Rate (Deep Think FATAL #5 Rescue)"
    priority: critical
    agent_type: codex
    model: gpt-5.5
    requires_codex: true
    max_turns: 25
    estimated_wall_time_min: 25
    track: evidence
    inference_substrate: aggregation_from_upstream_artifacts
    prior_failures:
      - experiment_id: exp2910
        verdict: "complete: SOTA code-generation corrigendum executed with pass@1=0.0750 and pass@k=0.1750"
        addressed_by: "exp2910 measured the base rate (7.5% correct, 92.5% errors) on code corpora. Deep Think 2026-05-23 FATAL #5 flagged that at this base rate, the verifier ensemble's 0.91 AUROC implies PPV < 42% — when the verifier approves code, it is more likely wrong than right (hallucination multiplier). This task computes AUPRC instead of AUROC at the empirical negative base rate, plus PPV / recall / F1 across thresholds."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
        Deep Think FATAL #5: AUROC is misleading at extreme class
        imbalance. With base model pass@1 = 0.075 on code corpora and
        verifier AUROC = 0.91, the verifier's positive predictive
        value can be below 50% — i.e., when the verifier approves
        generated code, it's more likely wrong than right. The paper-
        v6 draft cites AUROC as evidence of code-corpus capability;
        this is statistically misleading.

        This task recomputes the operating characteristic at the
        EMPIRICAL negative base rate using AUPRC (not AUROC) plus
        per-threshold precision/recall/F1.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. exp2910 artifact present.
           b. exp2837 artifact present (FoVer per-verifier energies +
              labels) for comparison baseline.
        1. Load the verifier ensemble's per-candidate energy scores
           from exp2910's k=8 candidate generations across all tasks.
        2. Load the per-candidate pass/fail labels.
        3. Compute the precision-recall curve. Report AUPRC.
        4. Compute PPV, recall, F1 at three operating points:
           - Max-F1 threshold (the "balanced" operating point)
           - PPV=0.5 threshold (where verifier-approval has at least
             50/50 odds of being correct)
           - Recall=0.8 threshold (where verifier accepts 80% of
             correct candidates)
        5. Compute the random-baseline AUPRC for context (= positive
           base rate = 0.075). If observed AUPRC ≤ random_baseline,
           the verifier provides NO information on this corpus.
        6. Recompute AUPRC on FoVer (from exp2837) using the same
           code so the corpus gap is visible.
        7. Write the verdict:
           - If code_corpus_auprc > 2 * baseline_random_auprc AND
             max_f1_operating_point.f1 > 0.30: verifier provides
             meaningful information on code corpora. Paper-v6 can
             retain code-corpus active-inference claims with explicit
             AUPRC + base-rate framing.
           - Otherwise: retract code-corpus active-inference claims;
             pin as Limitation per Paper-v6 Narrowing Discipline.

      REQUIRED ARTIFACT FIELDS:
        honest_verdict: str
        inference_substrate: "aggregation_from_upstream_artifacts"
        preconditions_checked: list
        code_corpus_auprc: float
        code_corpus_baseline_random_auprc:
          value: 0.075
          principle: "Equal to the positive base rate; any verifier with AUPRC at or below this value provides no information on this corpus."
        fover_corpus_auprc:
          principle: "Recomputed from exp2837 for the apples-to-apples comparison the paper needs."
        max_f1_operating_point:
          shape: "{{threshold: float, ppv: float, recall: float, f1: float}}"
        ppv_50_operating_point:
          shape: "{{threshold: float, ppv: float, recall: float, f1: float}}"
          principle: "The threshold where verifier-approval has at least 50/50 odds of being correct. If unreachable, verifier is a hallucination multiplier on this corpus."
        recall_80_operating_point:
          shape: "{{threshold: float, ppv: float, recall: float, f1: float}}"
        paper_v6_recommendation:
          principle: "retain | narrow | retract for the code-corpus active-inference claim."
        cited_upstream_artifacts:
          shape: "list of {{experiment_id, fields_imported, sha256}}"
        methodology_note: str
        duration_s: float

      ACCEPTANCE GATES:
        - condition: "0 <= code_corpus_auprc <= 1"
          principle: "AUPRC is a probability."
        - condition: "code_corpus_auprc != 0.5"
          principle: "Exact 0.5 is suspicious (TAUTOLOGY-shape); real AUPRC values rarely hit exactly 0.5."
        - condition: "len(cited_upstream_artifacts) >= 2"
          principle: "At minimum cites exp2910 (code candidates + labels) and exp2837 (FoVer comparison baseline)."

      Do NOT push.

