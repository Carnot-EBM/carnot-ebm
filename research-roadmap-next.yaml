theme: >-
  .434 settled the surfacing question with a clarifying NEGATIVE: the winning L1 candidate is PRESENT in the
  object-centric proposal pool (coverage 1.0) but NOT separable from same-depth distractors by ANY static
  oracle-distinct feature (exp4713 A2: precision_at_k_delta=0.0, ranks worsened). Ten milestones of
  selection/perception/goal levers have not moved generic first-win off 0.04 (1/25 games). STATIC SELECTION OF A
  FROZEN POOL IS EXHAUSTED. The only untested directions ACT to change the situation rather than rank a frozen
  pool. .435 pursues the two that the project has never validly tested, both on the SCORED E3AgentPolicy, both
  verifier_is_oracle:false, both live-path-reachable: A1 (HEADLINE) the leader's goal-free ONLINE
  ACTION-LEARNING DRIVER (online frame-change CNN + coordinate head that PROPOSES clicks, per-level reset to the
  cross-game PRIOR, free self-supervised labels, deepens multi-level for free) tested VALIDLY for the FIRST time
  -- the .433 (exp4710) and .434 (exp4715) attempts BOTH ran degenerate/dead code (all-arms-identical 0.04
  TAUTOLOGY), so this gates on PROVEN per-arm non-degeneracy (distinct action distributions + non-zero online
  train-steps) BEFORE any lift claim; (operator 2026-06-24 "the highest-leverage ARC lever for the deadline;
  build it"). A2 hypothesis-driven ACTIVE PROBING -- E3AgentPolicy keeps a posterior over candidate
  goal/dynamics hypotheses and takes information-gain actions that SPLIT it, so the present-but-unseparable
  winner becomes distinguishable by its observed CONSEQUENCE; the energy verifier scores which probe best
  splits the posterior (oracle-distinct); the no-probe ablation must FAIL (arXiv:2506.01876 + 2309.08477, the
  capstone/SOTA hand-off). A3 banks +1 (63->64) via the self-play loop + trains the verifier (Level-Up
  Guarantee + self-play-every-milestone). A4 the held-out first-win readiness lane. A5 persist+transfer. A6
  SUBMITTED_AGENT_CONFIG integration. INFRA (both operator-MANDATORY 2026-06-25, both SKIPPED in .434 by a
  poison pre-test, both carried forward): B1 the SILENT-BUG AUDIT of the .428-.434 generation-lever nulls (runs
  EARLY; formally adjudicates whether the .434 A4 TAUTOLOGY was a no-op that must REOPEN), B2 the
  adversarial_verify lever-exercise-evidence guard that mechanizes the dead-code catch. C KV260 hardware
  continuity. D SOTA-ingestion (the .436 fallback: epistemic-object-model MCTS probe planner + factored causal
  probe bank). E capstone. RETIRED (do NOT re-propose): the .434 A2 STATIC present-winner ranker AS-BUILT
  (present_winner_not_separable -- A2 changes the mechanism to active probing); the .434 A1 single-frame
  structural-alignment L2 goal (alignment_under_determined); the .433 single-exemplar/reinduction L2-goal fixes;
  goal-free Go-Explore as a standalone L2 solver; re-running the .433/.434 online-driver attempts VERBATIM (they
  ran dead code -- A1 is the first VALID test). 5 days to the ARC Prize Milestone #1 deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC (A1-A6);
  >=1 level-up attempt that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee -- A3 self-play bank
  + A1 L2 probe + A2 new level); self-play EVERY milestone (A3 trains+checkpoints the verifier); 2 reserved
  infra (B1/B2, both operator-MANDATORY + carried forward); 1 per-board hardware (C); 1 SOTA-ingestion (D). All
  experiments codex/gpt-5.5; planner/retro stay Claude Opus. 5 days to the ARC Prize Milestone #1 deadline
  ($25K). The frozen live generator is Qwen3.5-9B-MTP on the iGPU (NEVER the 3090s); A1/A2 arms that
  induce/strategize via the LLM declare live_llm_inference for that arm only and construct the proposer on a
  FREE port + /props-verify Qwen (the port-8919 gemma-squat confound)."

