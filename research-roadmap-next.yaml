    \ passed FR-11 with cross_domain_retention_rate=1.0. exp2439 (.236) tried to audit\nonline learnability\
    \ but emitted a non-standard verdict (\"Terminal-prefix required...\"). This\nv5 implements proper soundness/completeness\
    \ tracking.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/verify/nsvif_z3_extractor.py\
    \ (NSVIF extractor — online learning\n    target)\n  {project_root}/python/carnot/pipeline/verify_repair.py\
    \ (learning pipeline context)\n  {project_root}/results/experiment_2425_fr11_nsvif_online_v4.json (prior\
    \ passing FR-11)\n\nTASK: Implement soundness/completeness asymmetric tracking in NSVIF online learner.\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. nsvif_z3_extractor.py exists:\n        ls {project_root}/python/carnot/verify/nsvif_z3_extractor.py\n\
    \        If missing: write honest_verdict blocked_nsvif_module_missing and exit.\n     b. Telemetry manifest\
    \ present:\n        ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n        If\
    \ missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n     c. z3-solver importable:\
    \ .venv/bin/python -c \"import z3; print(z3.get_version_string())\"\n        If missing: .venv/bin/pip install\
    \ z3-solver -q\n\n  1. Add SoundnessCompletenessTracker class to python/carnot/verify/nsvif_z3_extractor.py\
    \ (or a new\n     file python/carnot/learn/soundness_tracker.py):\n       - soundness_mistakes: count of missed\
    \ violations (prediction=safe, label=violation)\n       - completeness_mistakes: count of false alarms (prediction=violation,\
    \ label=safe)\n       - update(prediction, label): updates the appropriate counter\n       - soundness_rate():\
    \ soundness_mistakes / n_total (fraction missed)\n       - completeness_rate(): completeness_mistakes / n_total\
    \ (fraction of false alarms)\n       - littlestone_soundness_bound(): sqrt(2 * soundness_mistakes * log(n_features))\n\
    \         (Littlestone-dimension upper bound per arXiv:2603.03538 Theorem 1)\n\n  2. Run online learning loop\
    \ over first 50 entries from telemetry manifest:\n     - For each entry: extract NSVIF features, predict\
