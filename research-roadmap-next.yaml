        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. This is the authoritative capstone for milestone 2026.05.287. It must use matrix v21 as the source of truth and must not promote repair, verifier, FR-11, or hardware claims unless the matrix rows are clean.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-program.md
      - _bmad/prd.md
      - _bmad/architecture.md
      - results/experiment_3079_cross_corpus_matrix_v21.json
      - results/experiment_3066_capstone_v286.json
      - ops/status.md
      - ops/changelog.md
      - research-references.md

      TASK
      Write the .287 capstone that states what the milestone proved, what remains blocked, whether paper_ready can be true, and what the next milestone should do.

      CONCRETE STEPS
      1. Confirm exp3079 matrix_v21_ready=true and load all row statuses.
      2. Summarize verifier-gain recovery, repair status, FR-11 soundness-bounded self-learning, EBT/ARM-EBM feasibility, GateMate/SSQA boundary, and publication blocker count.
      3. Set paper_ready=true only if matrix v21 has zero publication blockers and no required claim is flagged, bounded, blocked, missing, or gated-skipped.
      4. Identify the next milestone recommendation as a concrete blocker-reduction path, not a broad wishlist.
      5. Write the capstone artifact and cite source artifacts; do not edit research-roadmap.yaml or scripts/research_conductor.py.

      REQUIRED ARTIFACT FIELDS:
      - capstone_ready: bool (principle: milestone must end with an authority artifact)
      - paper_ready: bool (principle: paper readiness must be an evidence-based gate)
      - verifier_gain_status: str (principle: verifier recovery must be summarized honestly)
      - repair_claim_status: str (principle: repair remains clean/bounded/blocked/gated explicitly)
      - fr11_self_learning_status: str (principle: controller-only and stronger claims must be separated)
      - ebt_arm_status: str (principle: theory feasibility must not imply implementation)
      - gatemate_status: str (principle: hardware execution claims need host-visible evidence)
      - ssqa_status: str (principle: SSQA remains gated without smoke)
      - publication_blocker_count: int (principle: blocker burden must be numeric)
      - publication_blockers: list (principle: unresolved blockers must be visible)
      - next_milestone_recommendation: str (principle: follow-on work must be concrete)
      - source_artifacts: list (principle: capstone claims must trace to matrix/results)
      - inference_substrate: dict (principle: aggregation work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
