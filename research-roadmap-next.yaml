      - python/carnot/pipeline/ (check if ttt_loop.py exists)
      - python/carnot/pipeline/verify_repair.py (pipeline base)

      TASK: Implement VerifierDrivenTTT with ORCA + Grounded Continuation dual stopping.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sys; sys.path.insert(0, 'python'); import carnot.pipeline"` — importable.
            If fails: write honest_verdict 'blocked_carnot_pipeline_not_importable' and exit.
