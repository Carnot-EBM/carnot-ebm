      - tests/
      - scripts/

      TASK
      Execute controlled-invariance checks over exact verifier rows and any available receipt-backed transcripts, producing a machine-readable pass/fail artifact for exp3181 and exp3184.

      CONCRETE STEPS
      1. PRECONDITIONS: Do not make live model calls. Use exact rows, cached candidates, and exp3179 receipts if present.
      2. Load the .294 control definitions: force-answer, remove-answer, shuffled-trace, answer-only, trace-only, transcript-hash, and token-suspicion triage.
      3. Run controls against exact-authority rows and known false-accept regression rows. Exact/canonical answers remain the only authority.
