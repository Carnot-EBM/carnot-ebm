  # ──────────────────────────────────────────────────────────────────────────
  # Phase B — Multi-Corpus Dual-Condition Expansion (CARRY-FORWARD)
  # ──────────────────────────────────────────────────────────────────────────

  - id: exp2820
    milestone: "2026.05.267"
    deliverable: "results/experiment_2820_fover_memory_leakage_isolation.json"
    title: "FoVer Memory-Leakage Isolation: AUROC With vs Without FR-11 Self-Learning State"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 50
    track: research

    prior_failures:
      - experiment_id: exp2811
        verdict: "GATE_BLOCK / upstream retired (exp2810 cascade fix)"
        addressed_by: "exp2811 (.266) GATE_BLOCK'd because exp2810 (cascade fix) was retired by the cascade itself. The cascade is now broken (outer-loop commit e22525a93 at 15:35Z 2026-05-21: smart-subset 81 passed). This task carries forward unchanged from the .266 design."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline" and
      "Adversarial Artifact Verification + Sample-Size Rigor".

      CONTEXT: operator hypothesis 2026-05-21 — "could it be that the
      self-learning has internalized the entire FoVer set having seen
      it repeatedly and used that between runs?" Investigation
      confirmed multiple FR-11 self-learning state files persist
      FoVer-derived patterns across runs:
        - results/nexus_constraint_memory_v2.json (FoVer violation patterns)
        - data/constraint_templates_*.json
        - data/fr11_ssd_training_v3.jsonl
        - data/fr11_zenil_distill_v2.jsonl
        - in-memory state via python/carnot/pipeline/{session_memory,
          cross_session_relay, self_learning_replay,
          query_time_memory_policy}.py

      TASK: Run the production verifier ensemble v7b against FoVer
      (n=1000 random subset, seed=42) under TWO memory conditions:
        Condition A: WITH full FR-11 self-learning state loaded
        Condition B: WITH all FR-11 self-learning state RESET
                     (non-destructive move to /tmp + Python restart)
      Compute AUROC for each condition under 5-seed adversarial
      replication. learning_contribution = A_mean - B_mean.

      CONCRETE STEPS:
        0. PRECONDITIONS:
           a. `python3 -c "import torch; assert torch.cuda.is_available()"`
           b. `test -f data/fover_corpus.jsonl`
           c. `test -f results/nexus_constraint_memory_v2.json`
           d. Qwen3.6-35B-A3B-GGUF cached
           Record preconditions_checked.

        1. Identify all FR-11 state files; document SHA256 + byte size.

        2. Condition A — production: load FoVer 1000 subset (seed=42),
           score with verifier ensemble v7b (full FR-11 state).

        3. Condition B — architecture-only: move FR-11 state files to
           /tmp/fr11_state_backup_<seed>/ non-destructively, restart
           Python, reload ensemble (confirm via logs that no NEXUS
           / constraint-template / session-memory loaded), score the
           same FoVer subset.

        4. Restore FR-11 state files; verify SHA256 match.

        5. Repeat 2-4 with 5 seeds (42, 137, 271, 314, 1729).

        6. Compute condition-A and condition-B AUROC mean ± std.
           Compute learning_contribution = mean_A - mean_B.

        7. Per-verifier learning contribution.

        8. Write artifact. Honest framing — substantial learning
           contribution is the intended design, but must be disclosed.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:' (or 'blocked_<resource>')
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - condition_a_production_auroc_mean: float
          principle: "Production-config AUROC (full FR-11 state)."
        - condition_a_production_auroc_std: float
          principle: "Replication noise on production-config."
        - condition_b_architecture_only_auroc_mean: float
          principle: "Memory-reset AUROC — the architecture's actual generalization."
        - condition_b_architecture_only_auroc_std: float
          principle: "Replication noise on architecture-only."
        - learning_contribution: float
          principle: "= A - B. Direct measurement of FR-11 self-learning contribution. > 0.05 = substantial; 0.02-0.05 = moderate; < 0.02 = minimal."
        - per_verifier_learning_contribution: dict[str, float]
          principle: "Which specific verifiers degrade most without FR-11 memory."
        - fr11_state_files: list[{path, sha256, n_bytes}]
          principle: "Names the persisted state that was reset."
        - state_files_restored_sha_match: true
          principle: "Proves FR-11 state was restored to original SHAs (non-destructive)."
        - n_examples: 1000
          principle: "Sample size."
        - n_seeds: 5
          principle: "Adversarial replication."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism precondition for reproducibility."
        - reproducibility_checksum: str
          principle: "Catches corpus / model / state drift."
        - model_specs: {name: "Qwen3.6-35B-A3B-GGUF", quant: "...", revision_sha: "..."}
          principle: "Names compute target."
        - duration_s: float
          principle: "Expected >= 3600s for 2 conditions x 5 seeds x N=1000 live inference. Sleep-padding forbidden per CLAUDE.md Verifier Authenticity Discipline."
        - preconditions_checked: list
          principle: "Anti-fabrication."
        - methodology_note: str
          principle: "Honest interpretation of the delta."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2821
    milestone: "2026.05.267"
    deliverable: "results/experiment_2821_mbpp_ensemble_eval.json"
    title: "MBPP Corpus — Both Memory Conditions (Architecture-Only + Production, N=100, 5 seeds each)"
    agent_type: gemini
    model: gemini-3.1-pro-preview
    max_turns: 60
    track: corpus

    prior_failures:
      - experiment_id: exp2812
        verdict: "GATE_BLOCK / upstream retired (exp2810 cascade fix)"
        addressed_by: "exp2812 (.266) GATE_BLOCK'd due to cascade. Cascade broken at 15:35Z; carry-forward unchanged."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline" and
      "Adversarial Artifact Verification + Sample-Size Rigor".

      OPERATOR DIRECTIVE 2026-05-21: run BOTH memory conditions —
      architecture-only AND production. Report both AUROCs +
      learning_contribution delta. N reduced to 100 (was 500) so
      the dual-condition run fits in the milestone wall-clock budget.

      TASK: Run the verifier ensemble v7b against MBPP test split (100
      problems) under TWO memory conditions, 5 seeds each.

      CONCRETE STEPS:
        0. PRECONDITIONS: CUDA available; HF mbpp accessible;
           Qwen3.6-35B-A3B-GGUF cached; FR-11 state files present.
           Record preconditions_checked.

        1. Load MBPP test split (100 problems, seed=42 for sampling).

        2. For each problem: live-GPU Qwen3.6-35B inference → candidate
           solution → execute against test cases → ground-truth label.

        3. Condition A (production): score with ensemble v7b (full FR-11).
        4. Condition B (architecture-only): FR-11 state moved to /tmp;
           Python restart; score same (problem, candidate) pairs.
        5. Restore FR-11 state; verify SHA256.
        6. Repeat 2-5 with 5 seeds (42, 137, 271, 314, 1729).
        7. Compute both conditions' mean ± std; learning_contribution.
        8. Per-verifier breakdown for both conditions.
        9. Write artifact.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' / 'success:'
          principle: "Terminal prefix."
        - corpus: "MBPP-sanitized-test"
          principle: "Identifies corpus."
        - n_problems: 100
          principle: "Sample size."
        - n_seeds: 5
          principle: "Adversarial replication."
        - condition_a_production_auroc_mean: float
          principle: "Production-config headline."
        - condition_a_production_auroc_std: float
          principle: "Replication noise."
        - condition_b_architecture_only_auroc_mean: float
          principle: "Architecture-only baseline."
        - condition_b_architecture_only_auroc_std: float
          principle: "Replication noise on architecture-only."
        - learning_contribution: float
          principle: "= A - B."
        - per_verifier_condition_a_auroc: dict[str, list[float]]
          principle: "Per-verifier production AUROC."
        - per_verifier_condition_b_auroc: dict[str, list[float]]
          principle: "Per-verifier architecture-only AUROC."
        - vanilla_qwen36_pass_at_1: float
          principle: "Baseline for the model without Carnot."
        - random_seeds_used: [42, 137, 271, 314, 1729]
          principle: "Determinism."
        - reproducibility_checksum: str
          principle: "Catches drift."
        - model_specs: {name: "Qwen3.6-35B-A3B-GGUF", quant: "...", revision_sha: "..."}
          principle: "Names compute target."
        - duration_s: float
          principle: "Expected >= 1800s. Sleep-padding forbidden."
        - preconditions_checked: list
          principle: "Anti-fabrication."
        - fr11_state_files: list[{path, sha256, n_bytes}]
          principle: "Names state reset for condition B."
        - state_files_restored_sha_match: true
          principle: "Non-destructive proof."
        - methodology_note: str
          principle: "Honest interpretation of the delta."

      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp2822
    milestone: "2026.05.267"
    deliverable: "results/experiment_2822_humaneval_full_ensemble_eval.json"
