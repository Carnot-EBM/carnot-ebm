    4. Snapshot original V696 authority and final primary/terminal sidecar bytes; record prior intermediate verdicts separately. Preserve the real Exp8034 skip path and absent Exp8035–8037 artifacts. Never create retrospective results.
    5. Freeze the exact validation manifest before running checks; reproduce all twelve authority mutations with private fixtures, including altered prompt, gate field, model, date, digest and consumed staging. No scientific task gates on this administrative reader alone.
    6. Map GASP, LILAC+ and FedProTIP to the concrete code steps in this roadmap; list non-transferring assumptions and deferred EBT/ETS/hardware directions. Verify all failure entries against current primaries or actual skip receipts; record absent evidence rather than inventing a verdict.
