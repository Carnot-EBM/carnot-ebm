  - id: exp4403-real-intervention-localizer-deconfound
    milestone: 2026.06.407
    title: "PHASE A1 (HEADLINE; oracle-distinct LOCALIZER, DECONFOUNDED; verifier_is_oracle=false) -- REAL INTERVENTION first-error data + a contrastive earliest-error localizer with the deconfounding controls BUILT IN (arXiv:2601.14209 'InT self-proposed interventions for first-error credit assignment', the .406 SOTA-ingestion flagged_for_v407). .406 (exp4392) trained a localizer on SYNTHETIC template-injected first-error data and reported a 'win' (FoVer F1 1.0 vs the 0.096 ensemble baseline), but exp4393's skeptic-proof QUARANTINED it as PURE POSITION BIAS: beats_position_only_baseline=false, template_ablation_drop=0.0 (the localizer learned nothing real -- the F1=1.0 is the IMPLAUSIBLE_PERFECT tell). ROOT CAUSE: synthetic template-injected data does not carry the REAL first-error distribution. THE FIX (arXiv:2601.14209): use REAL verifier-checked intervention first-error labels -- (1) take REAL failed reasoning traces (the cached FoVer step-labeled corpus + the GAP-4 ARC pool), (2) for each, identify via a single-step INTERVENTION (replace step k with a verifier-checked correct step, recompute the suffix) the EARLIEST step whose correction redirects the trajectory to success = the ground-truth first-error index, (3) STRATIFY the resulting labels by first-error POSITION and template/problem FAMILY, (4) train a CONTRASTIVE earliest-error localizer, (5) evaluate on a HELD-OUT-FAMILY REAL split with the deconfounding controls BUILT INTO THE HEADLINE (a content-blind POSITION-ONLY baseline from the empirical first-error-step distribution + a TEMPLATE-FAMILY HOLDOUT: train on some families, test on held-out families). Emit localizer_genuinely_beats_position_only BARE bool := (the real-intervention localizer's held-out-family first-error F1 EXCEEDS the content-blind position-only baseline, delta CI95-excl-0, AND degrades materially under template-family holdout -- i.e. it depends on CONTENT, not just position). verifier_is_oracle=false (a learned localizer; the executable/reference prefix-check defines correctness, the localizer estimates WHICH step). A win = the oracle-distinct localizer GENUINELY localizes (the controls .406 FAILED now pass); a clean null (it still ties position-only) RETIRES the localizer-as-headline + logs a sharper missing-verifier gap. Cached + CPU; the intervention check is symbolic/reference, no live training. NO TRM training; interventions are OFFLINE labels ONLY (no generator SFT/RL)."
    priority: critical
    track: localizer-headline
    max_turns: 100
    agent_type: codex
