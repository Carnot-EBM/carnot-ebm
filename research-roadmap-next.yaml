- id: exp912-draft-conditioned-tier28
  milestone: 2026.04.70
  deliverable: results/experiment_912_draft_conditioned_tier28.json
  max_turns: 40
  title: 'Exp 912: DraftConditioned Verifier Tier 2.8 — Structural Constraint Injection (GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: The pipeline currently runs: Tier 0 probes -> Tier 1 (Lagrange) -> Tier 2
    (VJEPA) -> Tier 3 (Ising). Tier 2.8 is a new intermediate stage: generate a cheap
    draft answer first (e.g., 50-token Qwen3.5-0.8B), extract structural constraints
    from that draft (not via ArithmeticExtractor, but via structural pattern matching:
    "contains_equals_sign", "final_number_extracted", "reasoning_steps_present"),
    then inject those constraints into the Tier 3 Ising energy function before the full
    Ising solve. This is inspired by arXiv 2603.03305 (Draft-Conditioned Constrained
    Decoding). The draft does not need to be correct; it scaffolds the constraint structure.

    EXISTING CODE TO READ FIRST:
    - results/experiment_884_vjepa_cascade_deploy.json — Tier 2 deployment
    - python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline
    - python/carnot/samplers/ising_sampler.py — IsingConstraintSampler
    - python/carnot/verify/arithmetic_extractor.py — the BROKEN extractor (do NOT use)
    - openspec/change-proposals/research-roadmap-v70.md — .70 Phase 4 design

    TASK: Implement DraftConditionedVerifier (Tier 2.8). Run on 25 GSM8K questions.
    Measure Tier 3 Ising solve quality improvement with draft-injected constraints.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Create python/carnot/pipeline/draft_conditioned_verifier.py:
       class DraftConditionedVerifier:
         __init__(self, draft_runner, ising_sampler, max_draft_tokens: int = 50):
           self.draft_runner = draft_runner  # cheap/small model
           self.ising = ising_sampler
         extract_structural_constraints(self, draft_text: str) -> list[dict]:
           Extract WITHOUT ArithmeticExtractor. Use structural patterns only:
           - "has_equals_sign": "=" in draft_text
           - "has_numeric_answer": re.search(r'\b\d+\b', draft_text[-100:]) is not None
           - "has_reasoning_steps": len(draft_text.split('\n')) > 3
           - "final_number": int(re.findall(r'\b\d+\b', draft_text)[-1]) if digits else None
           Return: [("type": constraint_type, "value": value), ...]
         verify_with_draft(self, question: str, full_response: str) -> VerificationResult:
           1. Generate draft: draft_text = draft_runner.generate(question, max_tokens=50)
           2. constraints = extract_structural_constraints(draft_text)
           3. energy = ising_sampler.score_with_constraints(full_response, constraints)
           4. Return VerificationResult(energy=energy, draft_used=True, n_constraints=len(constraints))
    3. Add spec entries: REQ-TIER28-001 (draft-conditioned constraint injection),
       SCENARIO-TIER28-001 (draft structural constraints improve Ising solve quality).
    4. Create scripts/experiment_912_draft_conditioned_tier28.py:
       a. tmpl = ExperimentTemplate(912, ..., requires_gpu=True). tmpl.setup().
       b. MODEL_SPECS = [("name": "Qwen3.5-0.8B", ..., "gpu": 0)] (draft model)
       c. Load 25 GSM8K questions. Generate full responses with Qwen3.5-0.8B.
       d. Baseline: score each response with Ising (no draft constraints).
       e. Tier 2.8: score each response with DraftConditionedVerifier.
       f. Measure: mean_constraints_injected, energy_score_with_draft,
                   energy_score_baseline, signed_energy_improvement.
       g. Compute rank correlation: does draft-constrained energy rank correct answers higher?
          auc_with_draft, auc_baseline.
       h. honest_verdict:
          "tier28_viable" if auc_with_draft > auc_baseline
          "tier28_no_improvement" otherwise
    5. Write tests. Traces to REQ-TIER28-001.
    6. Write results/experiment_912_draft_conditioned_tier28.json.
    7. Update ops/changelog.md: one-line entry.
    8. tmpl.assert_deliverable_written() as final line.

    Run: .venv/bin/python scripts/experiment_912_draft_conditioned_tier28.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

