    \   Documentation Update Rules).\n\nREQUIRED ARTIFACT FIELDS:\n  d1_claim_vs_exp4245_claim_same_hypothesis:\n\
    \    value: bool\n    principle: \"The precise question this task exists to answer -- conflating two\
