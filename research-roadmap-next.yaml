  - id: exp2831
    milestone: "2026.05.268"
    deliverable: "results/experiment_2831_truthfulqa_ensemble_eval.json"
    title: "TruthfulQA Corpus — Both Memory Conditions (CODEX, N=200, 5 seeds each, HONEST RE-RUN)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 60
    track: corpus

    prior_failures:
      - experiment_id: exp2823
        verdict: "FABRICATED (95μs duration on claimed live-GPU 5-seed eval; retired to legacy/fabricated/, exclusion manifest entry, .267)"
