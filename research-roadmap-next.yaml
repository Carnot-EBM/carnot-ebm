  - id: exp2290-projected-langevin-baseline
    title: "Phase 3: Projected-Langevin Equality Constraint Baseline (arXiv:2605.05387)"
    milestone: "2026.05.225"
    deliverable: "results/experiment_2290_projected_langevin.json"
    agent_type: "codex"
    model: "gpt-5.5"
    max_turns: 30
    prior_failures:
      - experiment_id: exp2276-projected-langevin-baseline
        verdict: not_run
        addressed_by: "exp2276 never ran — no artifact file in .224 because the milestone collapsed before reaching Phase 3. This is the first actual attempt. Scope is identical to exp2276."
    prompt: |
      CONTEXT: arXiv:2605.05387 proves that projected-Langevin dynamics under linear equality
      constraints Ax=b achieves Langevin mixing while guaranteeing exact constraint satisfaction
      throughout the trajectory (not just at convergence). The approach: at each step, after
      the Langevin update, project back onto the constraint manifold using a closed-form
      projection operator (P = I - A^T(AA^T)^-1 A). This is an alternative to CASAL's
      primal-dual split augmented approach.
      Landing-based samplers (arXiv:2510.22044, arXiv:2604.17838) and kinetic Langevin
      splitting (arXiv:2603.23397) are also relevant complementary approaches — note these in
      the artifact for future comparison.
      EXISTING CODE TO READ FIRST:
        {project_root}/python/carnot/samplers/casal.py
        {project_root}/python/carnot/samplers/parallel_ising.py
        {project_root}/scripts/experiment_template.py
      TASK: Implement projected-Langevin sampler and compare against CASAL baseline.
      CONCRETE STEPS:
        1. Create python/carnot/samplers/projected_langevin.py implementing:
           class ProjectedLangevinSampler:
             - sample(x0, energy_fn, A, b, n_steps, step_size, noise_scale, random_seed)
             - Each step: x = x - step_size * grad_E(x) + sqrt(2*step_size)*noise, then project
             - Projection: x = x - A.T @ solve(A @ A.T, A @ x - b)
        2. Write 2 focused unit tests in tests/python/samplers/test_projected_langevin.py
           (one: projection maps to constraint manifold; two: samples stay near manifold).
        3. Run unit tests; record n_tests_passed.
        4. Define 3 test problems (n=32 variables, random linear constraints Ax=b):
           Problem 1: single equality constraint (1D manifold slice)
           Problem 2: 3 equality constraints (co-dimension 3)
           Problem 3: 5 equality constraints (heavily constrained)
        5. For each problem: run 500 steps of projected-Langevin AND 500 steps of CASAL.
           Measure: mean_feasibility_residual (||Ax-b||_2), sample_diversity (std of samples),
           wall_time_ms.
        6. Set projected_langevin_competitive: true if projected-Langevin achieves
           mean_feasibility_residual <= 2x CASAL residual on at least 2 of 3 problems.
        7. Write deliverable to results/experiment_2290_projected_langevin.json.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict:
            principle: "Terminal-prefix required. complete: if sampler ran to completion (a loss to CASAL is an honest research finding)."
        - projected_langevin_competitive:
            principle: "Boolean. True when residual <= 2x CASAL on 2/3 problems; 2x ceiling is generous since projected-Langevin's theoretical guarantee is exact constraint satisfaction."
        - mean_feasibility_residual_by_problem:
            principle: "Per-problem residual records where projected-Langevin wins or loses against CASAL."
        - sample_diversity_by_problem:
            principle: "Diversity records whether projection collapses samples to a single point (mode collapse)."
        - n_tests_passed:
            principle: "Unit tests must pass for implementation quality claims."
        - module_path:
            principle: "Records where the sampler was written for integration planning."
        - random_seed:
            principle: "Reproducibility for all 3 problems."

