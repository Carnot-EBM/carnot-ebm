- id: exp2408-hive-full-4verifier-v3
  title: 'Phase 1: Full HIVE 4-Verifier Ensemble v3 (Tier 0f+0g+0h+0j) — Target AUROC > 0.90'
  milestone: 2026.05.234
  deliverable: results/experiment_2408_hive_full_v3.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2398-hive-4verifier-ensemble-v2
    verdict: complete_only_3_verifiers_fused
    addressed_by: "exp2398 in .233 fused 3 verifiers (Tier 0g semantic energy, 0h LaaB,
      0j HALT) at AUROC=0.8539, below HIVE peer 0.9236. Root cause: Freq-Aware Attn
      (Tier 0f, exp2397) artifact was not read before ensemble construction. This attempt
      explicitly reads exp2397 artifact and fuses all 4 Tier 0 verifiers (0f, 0g, 0h, 0j)
      with calibrated abstention from HALT-RAG (arXiv:2509.07475) for precision improvement."
    retire_if_same_verdict: false
  - experiment_id: exp2380-hive-4verifier-ensemble
    verdict: codex_cli_error_failed
    addressed_by: "exp2380 failed 3 times with Codex CLI error in .232. Codex CLI
      confirmed healthy by exp2393 in .233. Infrastructure failure resolved."
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT: HIVE (arXiv:2604.26139) achieves AUROC=0.9236 via 4-verifier soft-voting.
    .233's HIVE ensemble (exp2398) achieved 0.8539 using only 3 verifiers — Tier 0f
    (FreqAwareAttn, exp2397) was available but NOT included. This task correctly fuses
    ALL 4 Tier 0 verifiers AND applies calibrated abstention from HALT-RAG (arXiv:2509.07475)
    to improve precision on uncertain examples.

    Available .233 verifier artifacts:
      Tier 0f: results/experiment_2397_freq_aware_attn.json (freq_attn_auroc=0.7045)
      Tier 0g: results/experiment_2351_semantic_energy_real.json (AUROC=0.6852)
      Tier 0h: results/experiment_2368_laab_k17.json (LaaB logical consistency)
      Tier 0j: results/experiment_2394_halt_tier0j.json (halt_k19j_auroc=0.8539)

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/hive_ensemble.py (from exp2398 if present)
      {project_root}/python/carnot/verify/freq_aware_attention.py (Tier 0f)
      {project_root}/python/carnot/verify/halt_probe.py (Tier 0j)
      {project_root}/python/carnot/verify/semantic_energy.py (Tier 0g)
      {project_root}/python/carnot/verify/laab_verifier.py (Tier 0h)
      {project_root}/results/experiment_2397_freq_aware_attn.json (Tier 0f scores)
      {project_root}/results/experiment_2394_halt_tier0j.json (Tier 0j scores)
      {project_root}/results/experiment_2398_hive_ensemble.json (.233 ensemble baseline)

    TASK: Implement HiveEnsembleV3 fusing all 4 Tier 0 verifiers with calibrated abstention.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. sklearn importable: .venv/bin/python -c "import sklearn; print(sklearn.__version__)"
            If missing: .venv/bin/pip install scikit-learn -q
         b. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         c. Count available Tier 0 verifier modules:
            .venv/bin/python -c "
            count = 0
            for mod in ['carnot.verify.freq_aware_attention', 'carnot.verify.semantic_energy',
                        'carnot.verify.laab_verifier', 'carnot.verify.halt_probe']:
                try: __import__(mod); count += 1; print(f'OK: {{mod}}')
                except Exception as e: print(f'MISSING: {{mod}}: {{e}}')
            print(f'{{count}} verifiers available')
            "
            If count < 3: write honest_verdict blocked_insufficient_verifiers_count={{count}} and exit.

      1. Load verifier scores for all 36 telemetry entries used in exp2351:
         a. For each of the 4 Tier 0 verifiers, call verify(entry) to get a score.
         b. Build a feature matrix X (n=36, d=n_verifiers) and label vector y from
            ground truth (use same labels as exp2351 for direct AUROC comparison).

      2. Implement HiveEnsembleV3 at python/carnot/verify/hive_ensemble_v3.py:
         a. Learn soft-vote weights via LogisticRegression with 5-fold cross-validation
            (CalibratedClassifierCV for probability calibration — the HALT-RAG abstention
            pattern from arXiv:2509.07475).
         b. Apply calibrated abstention: when ensemble confidence < 0.6 (neither P(halluc)
            nor P(clean) exceeds 0.6), set verdict = "uncertain" and score = 0.5.
         c. AUROC computed on ALL 36 examples including uncertain ones (abstention does
            not remove examples from the AUROC calculation).

      3. Compute:
         - hive_v3_auroc: AUROC of ensemble on 36 examples
         - hive_v3_vs_v2_delta: hive_v3_auroc - 0.8539 (.233 HIVE v2 baseline)
         - abstention_rate: fraction of examples flagged "uncertain"
         - n_verifiers_fused: must be 4
         - verifier_weights: soft-vote weights per verifier

      4. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "hive_v3 or hive_ensemble_v3" -v --no-cov 2>&1 | tail -15
         Create test if none exists.

      5. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with ensemble AUROC."
      - hive_v3_auroc:
          principle: "Primary metric. Target > 0.9236 (HIVE peer). Honest result."
      - hive_v3_vs_v2_delta:
          principle: "hive_v3_auroc - 0.8539. Positive = improvement over .233 ensemble."
      - ensemble_auroc_improved:
          principle: "True if hive_v3_auroc > 0.8539 (.233 HIVE v2 baseline)."
      - n_verifiers_fused:
          principle: "Must be 4 — all Tier 0 verifiers included."
      - verifier_weights:
          principle: "Soft-vote weights per verifier — reproducibility."
      - abstention_rate:
          principle: "Fraction of uncertain examples. HALT-RAG calibration signal."
      - n_eval_examples:
          principle: "Must be 36."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records verifier count, sklearn, telemetry checks."

    ACCEPTANCE GATES:
      - condition: "ensemble_auroc_improved == true"
        principle: "v3 must beat v2 baseline 0.8539 — 4-verifier fusion should improve over 3-verifier."
      - condition: "n_verifiers_fused == 4"
        principle: "All 4 Tier 0 verifiers must be fused — that is the key change vs .233."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2409-hierarchical-logcons
  title: 'Phase 1: Hierarchical Alignment LogCons (arXiv:2604.09075) — Z3 Instruction Hierarchy'
  milestone: 2026.05.234
  deliverable: results/experiment_2409_hierarchical_logcons.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prompt: |-
    CONTEXT: Hierarchical Alignment via Logical Consistency (arXiv:2604.09075, April 2026)
    enforces hierarchical instruction compliance (system → user → tool instructions with
    proper precedence) via a formal logical consistency checker using Z3. Achieves 91%
    adherence in nested instruction scenarios vs 67% baseline. The checker models instruction
    hierarchy as a partial order and uses Z3 to detect priority conflicts.

    Key insight: this extends FregeLogic (arXiv:2604.18328, AUROC=0.8831 in exp2395) by
    adding instruction-hierarchy awareness to the Z3 tiebreaker. If instruction hierarchies
    are present in the telemetry, this should improve AUROC by detecting category of
    hallucinations that involve instructions being followed in the wrong priority order.

    This is a NEW scope — no prior HierarchicalLogCons implementation exists in the codebase.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/fregelogic_hybrid.py (architecture reference)
      {project_root}/python/carnot/verify/nsvif_z3_extractor.py (Z3 encoding reference)
      {project_root}/results/experiment_2395_fregelogic.json (AUROC=0.8831 baseline)

    TASK: Implement HierarchicalLogConsVerifier and evaluate on 36 telemetry entries.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. z3-solver importable: .venv/bin/python -c "import z3; print(z3.get_version_string())"
            If missing: .venv/bin/pip install z3-solver -q
         b. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         c. Inspect telemetry for instruction fields:
            .venv/bin/python -c "
            import json
            with open('{project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl') as f:
                row = json.loads(f.readline())
            instr_fields = [k for k in row.keys() if any(x in k.lower() for x in
                            ['instruction', 'prompt', 'system', 'task', 'question'])]
            print('instruction-like fields:', instr_fields)
            "

      1. Implement HierarchicalLogConsVerifier at python/carnot/verify/hierarchical_logcons.py:
         Priority model:
           Level 0 (highest): system-level constraints (safety, format)
           Level 1: user-level instructions
           Level 2: task-level requirements
         Consistency check via Z3:
           For each response, extract: claimed_level (which instruction level is followed)
           Z3 assertion: claimed_level >= required_level (higher priority first)
           If UNSAT: hierarchy_violation=True → hallucination signal
         Fallback (when instruction hierarchy not detectable from telemetry):
           Use FregeLogic's existing Z3 verification and add a priority_consistency_bonus
           based on sentence-level logical flow consistency.
         Output: logcons_score, hierarchy_violation, priority_level_used

      2. Evaluate on 36 entries (same split as exp2351):
         Compute: logcons_auroc, logcons_vs_fregelogic_delta (baseline 0.8831),
         hierarchy_violation_rate.

      3. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "logcons" -v --no-cov 2>&1 | tail -15
         Create test if none exists.

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with LogCons AUROC."
      - logcons_auroc:
          principle: "Primary metric. Compare with FregeLogic baseline 0.8831. Honest result."
      - logcons_vs_fregelogic_delta:
          principle: "LogCons - FregeLogic delta. Positive = improvement over current best."
      - hierarchy_violation_rate:
          principle: "Fraction of examples with detected hierarchy violations."
      - instruction_fields_found:
          principle: "Which telemetry fields contained instruction/prompt content."
      - z3_encoding_used:
          principle: "Whether Z3 partial-order model was used or fallback."
      - n_eval_examples:
          principle: "Must be 36."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records z3, telemetry, instruction-field checks."

    ACCEPTANCE GATES:
      - condition: "logcons_auroc != null AND n_eval_examples >= 30"
        principle: "Must produce a valid AUROC on sufficient data — even if below baseline."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2410-halt-rag-nli-ensemble
  title: 'Phase 1: HALT-RAG Calibrated NLI Ensemble (arXiv:2509.07475) — Precision via Abstention'
  milestone: 2026.05.234
  deliverable: results/experiment_2410_halt_rag_nli.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  prompt: |-
    CONTEXT: HALT-RAG (arXiv:2509.07475, Sep 2025) combines frozen NLI model ensembles
    with feature-based abstention for RAG hallucination detection. Key mechanism: when the
    ensemble confidence is low (neither P(halluc) nor P(clean) exceeds threshold), the system
    abstains rather than making a low-confidence prediction. This selective abstention reduces
    false positives and improves calibration, effectively improving AUROC by removing the
    lowest-confidence (highest-noise) examples from the scored set.

    This is NEW scope — no HALT-RAG NLI implementation exists in the codebase.
    Note: we do not have a pretrained NLI model accessible directly. Use a proxy approach:
    apply NLI-style entailment scoring using the NSVIF Z3 extractor's logical consistency
    check as a proxy for NLI entailment. The abstention mechanism is the novel contribution.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/verify/nsvif_z3_extractor.py (logical consistency)
      {project_root}/python/carnot/verify/semantic_energy.py (logit-based score)
      {project_root}/results/experiment_2395_fregelogic.json (AUROC=0.8831 baseline)

    TASK: Implement HaltRagNliDetector with calibrated abstention and evaluate on 36 entries.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. Telemetry manifest present:
            ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl
            If missing: write honest_verdict blocked_telemetry_manifest_missing and exit.
         b. sklearn importable: .venv/bin/python -c "import sklearn; print(sklearn.__version__)"
         c. scipy importable: .venv/bin/python -c "import scipy; print(scipy.__version__)"

      1. Implement HaltRagNliDetector at python/carnot/verify/halt_rag_nli.py:
         NLI proxy (without a pretrained NLI model):
           Use 3 proxy signals as NLI ensemble members:
             Signal 1: SemanticEnergy score (logit variance proxy)
             Signal 2: FreqAwareAttn score (stopword-frequency proxy)
             Signal 3: HALT probe score (logprob kurtosis proxy)
           Ensemble via CalibratedClassifierCV (sklearn) for probability calibration.
         Abstention threshold: if max(P(halluc), P(clean)) < 0.65, abstain.
         Output: halt_rag_score, abstained (bool), confidence, nli_signals_used.

      2. Evaluate on 36 entries (same split as exp2351):
         Compute on non-abstained examples:
           halt_rag_auroc_full: AUROC including abstained examples (score=0.5)
           halt_rag_auroc_confident: AUROC on non-abstained examples only
           abstention_rate: fraction abstained
           halt_rag_vs_fregelogic_delta: halt_rag_auroc_full - 0.8831

      3. Run unit test:
         PYTEST_ADDOPTS="" .venv/bin/python -m pytest tests/python/verify/ -k "halt_rag" -v --no-cov 2>&1 | tail -15

      4. Write deliverable.

    REQUIRED ARTIFACT FIELDS:
      - honest_verdict:
          principle: "Terminal-prefix required. complete: with HALT-RAG AUROC."
      - halt_rag_auroc_full:
          principle: "AUROC on all 36 examples. Primary paper-v6 metric — honest result."
      - halt_rag_auroc_confident:
          principle: "AUROC on non-abstained examples only — shows calibration benefit."
      - halt_rag_vs_fregelogic_delta:
          principle: "halt_rag_auroc_full - 0.8831. Positive = improvement over current best."
      - abstention_rate:
          principle: "Fraction of uncertain examples. Core HALT-RAG mechanism signal."
      - n_verifiers_fused:
          principle: "Number of NLI proxy signals used (should be 3)."
      - n_eval_examples:
          principle: "Must be 36."
      - random_seed:
          principle: "Must be 42."
      - duration_s:
          principle: "Guards against fabrication."
      - preconditions_checked:
          principle: "Records telemetry, sklearn, scipy checks."

    ACCEPTANCE GATES:
      - condition: "halt_rag_auroc_full != null AND n_eval_examples >= 30"
        principle: "Must produce valid AUROC — even below FregeLogic is a finding."

    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp2411-fr11-nsvif-online-v3
  title: 'Phase 2: FR-11 NSVIF Online Self-Learning v3 — MANDATORY Continuous Self-Learning Task'
  milestone: 2026.05.234
  deliverable: results/experiment_2411_fr11_nsvif_online_v3.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  continuous_self_learning_task: true
  prior_failures:
  - experiment_id: exp2400-fr11-nsvif-online-v2
    verdict: no_artifact_session_ended
    addressed_by: "exp2400 produced no artifact because the .233 session ended before
      reaching that task (5 tasks preceded it ran over time budget). Root cause: session
      timeout, not a scope failure. The NSVIF Z3 extractor is confirmed working (exp2352,
      exp2366, exp2395). All blocking infrastructure issues resolved. This v3 attempt
      places the task earlier in the .234 queue with no downstream dependencies."
    retire_if_same_verdict: false
  - experiment_id: exp2383-fr11-nsvif-online
    verdict: codex_cli_error_failed
    addressed_by: "exp2383 failed 3 times with Codex CLI error in .232 (transient OpenAI
      backend failure). Codex CLI confirmed healthy by exp2393. Infrastructure failure
      resolved."
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT: FR-11 (Autonomous Self-Learning Loop) is a MANDATORY functional requirement.
    Every milestone must include at least one continuous_self_learning_task experiment.

    NSVIF Online Learning closes the verify→feedback→update loop:
      1. Run NSVIF Z3 verification on 20 telemetry entries
      2. For each UNSAT verdict: extract the failing constraint; add a "confidence-hedged"
         pattern to constraint_patterns.json
      3. Re-verify the same 20 entries with updated constraint patterns
      4. Measure: did the updated patterns retain previously-SAT entries (retention rate)?

    This mechanism is distinct from prior FR-11 implementations (FR-11 via FST fast/slow
    weight partitioning in .231, FR-11 via multi-domain retention in .229).

