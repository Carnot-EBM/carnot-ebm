  - id: exp3338-sota-gguf-tokenizer-runtime-receipt-v1
    milestone: "2026.05.309"
    title: "SOTA GGUF tokenizer and runtime receipt for live inference recovery"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 45
    track: live-sota-runtime
    inference_substrate: live_llm_inference_preflight
    requires_gpu: true
    deliverable: "results/experiment_3338_sota_gguf_tokenizer_runtime_receipt_v1.json"
    prior_failures:
      - experiment_id: exp3327-energy-descent-substrate-bootstrap-v1
        verdict: "blocked_gpu_setup: unsloth/Qwen3.6-35B-A3B-GGUF failed to instantiate backend tokenizer; sentencepiece or tiktoken dependency required"
        addressed_by: "This task isolates tokenizer/runtime loading before any science panel, checks the mandated SOTA GGUF cache paths, and emits a runtime receipt or precise blocked root cause."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Work from {project_root} on {date}. The .308 live SOTA bootstrap reached cached GGUF paths but blocked when Qwen3.6 could not instantiate the backend tokenizer. Before rerunning energy descent, Carnot needs a standalone runtime receipt.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md, especially SOTA Local Models, inference_substrate, precondition checks, and duration rules
      - CODEX.md
      - scripts/experiment_template.py
      - carnot/inference/sota_models.py
      - openspec/capabilities/llm-ebm-inference/spec.md
      - openspec/capabilities/phase3-kona/spec.md
      - results/experiment_3327_energy_descent_substrate_bootstrap_v1.json
      - research-references.md, section "2026-05-29 Post-.308 Planning Sweep"

      TASK
      Implement and run a SOTA GGUF tokenizer/runtime receipt. This is a preflight artifact, not a science panel. It must either prove clean local loading for at least one mandated GGUF or produce a precise blocked artifact.

      CONCRETE STEPS
      1. If implementation code changes are required, first confirm the relevant OpenSpec capability spec exists and has REQ-* requirements; add only the smallest spec delta needed.
      2. Define MODEL_SPECS using the cached_sota_pair(gpu_indices=(0, 1)) pattern where possible. Include all three mandated model identifiers in the receipt: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, unsloth/gemma-4-26B-A4B-it-GGUF.
      3. Check local cache paths, file sizes/checksums when available, tokenizer dependencies, llama-cpp/loader imports, and GPU visibility through torch.cuda or existing repo helpers. Do not rely only on nvidia-smi.
      4. Attempt the smallest possible load/tokenize/generate smoke for each available mandated model. If a model cannot load, record the exact exception and continue to the next model.
      5. Legacy small models may be used only as CPU loader smoke controls; they must be labeled non-headline and excluded from runtime_receipt_clean.
      6. Write results/experiment_3338_sota_gguf_tokenizer_runtime_receipt_v1.json with REQUIRED ARTIFACT FIELDS: honest_verdict with terminal prefix, inference_substrate, random_seed, reproducibility_checksum, duration_s, files_updated; RUNTIME FIELDS (Phase-3 precondition): model_specs, cache_status, tokenizer_status, loader_status, gpu_status, smoke_generation_status, runtime_receipt_clean, blocked_reasons.
      7. Run focused tests for any touched runtime helper and JSON parse for the artifact.

      Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 .venv/bin/python scripts/experiment_3338_sota_gguf_tokenizer_runtime_receipt_v1.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3339-energy-descent-bootstrap-v2-runtime-clean
    milestone: "2026.05.309"
    title: "Energy-descent bootstrap v2 gated on clean SOTA GGUF runtime"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 60
    track: phase3-kona
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: "results/experiment_3339_energy_descent_bootstrap_v2_runtime_clean.json"
    gated_on:
      - upstream: exp3338-sota-gguf-tokenizer-runtime-receipt-v1
        artifact_field: runtime_receipt_clean
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3327-energy-descent-substrate-bootstrap-v1
        verdict: "blocked_gpu_setup: SOTA GGUF bootstrap blocked by tokenizer/runtime setup before valid live telemetry"
        addressed_by: "This v2 bootstrap is gated on an explicit runtime receipt and uses the verified loader path before collecting any energy-descent telemetry."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Work from {project_root} on {date}. exp3338 must prove a clean SOTA GGUF runtime before this task runs. This task is a small bootstrap that verifies live inference telemetry and exact-verifier scoring before the full panel.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md, especially SOTA Local Models, DURATION_TOO_SHORT, inference_substrate, and precondition guidance
      - CODEX.md
      - scripts/experiment_template.py
      - carnot/inference/sota_models.py
      - openspec/capabilities/phase3-kona/spec.md
      - openspec/capabilities/llm-ebm-inference/spec.md
      - results/experiment_3338_sota_gguf_tokenizer_runtime_receipt_v1.json
      - research-references.md, section "2026-05-29 Post-.308 Planning Sweep"

      TASK
      Run a tiny, deterministic live SOTA energy-descent bootstrap. This is not a headline delta experiment. Its only downstream decision is whether the full panel may run.

      CONCRETE STEPS
      1. Confirm the structured gate artifact has runtime_receipt_clean=true.
      2. Define MODEL_SPECS using cached_sota_pair(gpu_indices=(0, 1)) and include at least one mandated model in live rows: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, or unsloth/gemma-4-26B-A4B-it-GGUF.
      3. Use 8-16 deterministic arithmetic/constraint prompts and compare baseline autoregressive candidates to a bounded energy-guided refinement or reranking loop.
      4. Score every candidate with exact verifiers. Energy may propose or rank; exact verifiers decide correctness.
      5. Record energy trajectories, verifier score trajectories, candidate fingerprints, model_specs, GPU status, and wall-clock timing. Mark duration/provenance flags explicitly.
      6. Set energy_descent_bootstrap_ready=true only if live inference, telemetry, exact-verifier scoring, and duration/provenance are clean.
      7. Write results/experiment_3339_energy_descent_bootstrap_v2_runtime_clean.json with REQUIRED ARTIFACT FIELDS: honest_verdict with terminal prefix, inference_substrate, random_seed, reproducibility_checksum, duration_s, files_updated; BOOTSTRAP FIELDS (Phase-3 gate): model_specs, gpu_status, n_prompts, energy_descent_bootstrap_ready, smoke_improvement_count, trajectory_summary, duration_flagged, blocked_reasons.
      8. Run JSON parse and focused tests for touched code.

      Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 .venv/bin/python scripts/experiment_3339_energy_descent_bootstrap_v2_runtime_clean.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3340-energy-descent-vs-ar-sota-panel-v3
    milestone: "2026.05.309"
    title: "Energy-descent versus autoregressive SOTA panel v3 gated on bootstrap"
    priority: critical
    max_turns: 50
    estimated_wall_time_min: 150
    track: phase3-kona
    inference_substrate: live_llm_inference
    requires_gpu: true
    deliverable: "results/experiment_3340_energy_descent_vs_ar_panel_v3.json"
    gated_on:
      - upstream: exp3339-energy-descent-bootstrap-v2-runtime-clean
        artifact_field: energy_descent_bootstrap_ready
        op: "=="
        value: true
    prior_failures:
      - experiment_id: exp3328-energy-descent-vs-ar-sota-panel-v2
        verdict: "gate_blocked: upstream exp3327 bootstrap was retired/blocked, so the live SOTA panel did not run"
        addressed_by: "This v3 panel is gated on a clean v2 bootstrap and uses the runtime receipt rather than the blocked .308 loader path."
        retire_if_same_verdict: true
      - experiment_id: exp3322-energy-descent-vs-autoregressive-premise-v1
        verdict: "failed_operationally: Codex CLI error before artifact creation; no scientific verdict"
        addressed_by: "This task narrows the original monolithic premise test to a gated, duration-clean SOTA panel with explicit exact-verifier authority."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Work from {project_root} on {date}. This is the recovered Phase-3 premise panel. The question is narrow: with local mandated SOTA GGUF inference, does energy-guided refinement improve exact verifier outcomes over baseline autoregressive generation on the same prompts and models?

      EXISTING CODE TO READ FIRST
      - CLAUDE.md, especially SOTA Local Models, sample-size rigor, duration rules, and exact-verifier authority
      - CODEX.md
      - scripts/experiment_template.py
      - carnot/inference/sota_models.py
      - openspec/capabilities/phase3-kona/spec.md
      - openspec/capabilities/verifiable-reasoning/spec.md
      - openspec/capabilities/llm-ebm-inference/spec.md
      - results/experiment_3338_sota_gguf_tokenizer_runtime_receipt_v1.json
      - results/experiment_3339_energy_descent_bootstrap_v2_runtime_clean.json
      - research-references.md, especially EBT, ARM-as-EBM, LoopUS, CEM, and ETS notes

      TASK
      Run the SOTA energy-descent-vs-autoregressive panel v3. The result may be positive, negative, or blocked. Do not overclaim from small n, duration-flagged rows, or legacy smoke models.

      CONCRETE STEPS
      1. Confirm the structured gate artifact has energy_descent_bootstrap_ready=true.
      2. Define MODEL_SPECS using cached_sota_pair(gpu_indices=(0, 1)); include at least one mandated model in headline rows: unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, or unsloth/gemma-4-26B-A4B-it-GGUF.
      3. Build a panel with n>=30 for diagnostic claims. Only call a result headline-ready if n>=200, duration/provenance is clean, and exact-verifier confidence intervals support it.
      4. For each prompt, collect baseline autoregressive output and energy-guided refinement/reranking output under the same model and decoding budget where feasible.
      5. Score every output with exact verifiers and log commitment/provenance telemetry: energy trajectory, verifier disagreement, abstention/repair events, unsupported-claim flags when applicable.
      6. Compute paired deltas, confidence intervals, duration flags, and model-by-model breakdowns. Label blocked or partial rows honestly.
      7. Write results/experiment_3340_energy_descent_vs_ar_panel_v3.json with REQUIRED ARTIFACT FIELDS: honest_verdict with terminal prefix, inference_substrate, random_seed, reproducibility_checksum, duration_s, files_updated; PANEL FIELDS (Phase-3 evidence): model_specs, n_cases, n_headline_eligible, delta_overall, ci95_delta, exact_verifier_accept_rate_baseline, exact_verifier_accept_rate_energy, commitment_telemetry_summary, duration_flagged, headline_ready, blocked_reasons.
      8. Run focused tests, JSON parse, and any relevant spec-coverage command used by nearby experiment scripts.

      Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 .venv/bin/python scripts/experiment_3340_energy_descent_vs_ar_panel_v3.py. Do NOT push. Do NOT modify scripts/research_conductor.py.

