        verdict: "complete: typed-memory policy passed deterministic retention, interference, stale-conflict eviction, and harmful-memory rollback checks."
        addressed_by: "This task converts the policy into a persistent decision-history substrate for continuous self-learning rather than rerunning the same cached audit."
        retire_if_same_verdict: true
    agent_type: codex
    model: "gpt-5.5"
    max_turns: 50
    estimated_wall_time_min: 50
    prompt: |
      CONTEXT:
      Repo at {project_root}, run on or after {date}. The research program requires at least one continuous self-learning advance per milestone. .481 found a cross-model memory null but a positive cached memory-policy audit. V482 literature emphasizes memory governance, poisoning resistance, provenance, scoped disclosure, and persistent decision history.

