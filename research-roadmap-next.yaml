      CONCRETE STEPS
      0. Hash the V545 marker, roadmap, references, exclusion manifest, known-issues receipt, and protected files. Record UTC bounds, disk, network status, and required command availability in preconditions_checked.
      1. Add REQ-INFRA-6324 and scenarios before implementation. Update traceability.
      2. Search every required channel. Store direct URLs, query times, publication or update dates, and disposition reasons.
      3. Deduplicate against all earlier planner markers. Reject a repeated title or a source without a local executable consequence.
      4. Freeze every branch contract. Name all retired or deferred mechanisms explicitly.
      5. Add genuinely new promising findings to research-references.md. Preserve a zero accepted delta honestly.
      6. Add deterministic tests for marker parsing, time windows, deduplication, zero-delta terminality, and scope hashes.
