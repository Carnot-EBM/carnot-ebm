  - id: exp2652
    milestone: "2026.05.253"
    deliverable: "results/experiment_2652_nexus_tier2_constraint_memory.json"
    title: "FR-11 Tier 2: NEXUS Symbolic Constraint Memory (arXiv:2605.09387)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 45
    track: self_learning
    continuous_self_learning_task: true

    prior_failures:
      - experiment_id: exp2639-ttt-scaleup
        verdict: "complete: Verifier-Driven TTT N=100; fr11_tier3_headline_closed bool"
        addressed_by: "exp2639 (.252) scaled FR-11 Tier 3 (JEPA/TTT context adaptation). This task advances FR-11 Tier 2 (Constraint Memory): cross-session symbolic constraint accumulation via NEXUS pattern (arXiv:2605.09387). Different tier (Tier 2 vs. Tier 3), different mechanism (persistent symbolic rules across sessions vs. in-context few-shot selection), different deliverable (constraint memory module vs. TTT evaluation artifact)."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      FR-11 Tier 2 (research-program.md): "Cache verified facts across sessions. Learn per-user and
      per-domain error patterns. ConstraintStateMachine (Exp 125) persists across sessions.
      Consolidate learned patterns into reusable constraint templates."

      arXiv:2605.09387 (NEXUS): continual learning of symbolic constraints from violation patterns.
      Four-step cycle:
        1. DETECT: accumulate violation events (which constraints fired, which passed)
        2. SYNTHESIZE: from repeated violation patterns, generate symbolic rule templates
        3. CONSOLIDATE: merge redundant templates
        4. AUTO-ADD: prepend synthesized constraints to future sessions for the same domain

      Key evaluation: after 3 simulated sessions with the same repeating error pattern, does session 3
      benefit from memory (fewer repeat violations) compared to session 1 (cold start)?

      EXISTING CODE TO READ FIRST:
      - python/carnot/pipeline/verify_repair.py (VerifyRepairPipeline — where constraints apply)
      - python/carnot/verify/ (constraint modules — identify any ConstraintStateMachine if present)
      - data/fover_corpus.jsonl (FoVer corpus for simulated sessions)

      TASK: Implement NEXUS-style symbolic constraint memory and demonstrate Tier 2 cross-session improvement.

      CONCRETE STEPS:
      0. PRECONDITIONS (check BEFORE any subsequent step):
         a. `python -c "import sys; sys.path.insert(0, '{project_root}/python'); import carnot"` succeeds.
         b. FoVer corpus: {project_root}/data/fover_corpus.jsonl (n_lines >= 300 for 3 sessions × 100).
         If ANY precondition fails: write honest_verdict blocked_<resource> and exit.

      1. Implement NexusConstraintMemory in python/carnot/learn/nexus_constraint_memory.py:

         class NexusConstraintMemory:
             """NEXUS-style symbolic constraint memory for FR-11 Tier 2.
             Accumulates violation events across sessions, synthesizes symbolic rule templates,
             and auto-adds learned constraints to future sessions.

             Per arXiv:2605.09387: symbolic constraints are more compact and transferable than
             neural weights. After 3 sessions with the same error pattern, session 3 should
             see fewer repeat violations because the memory has learned which constraints to
             apply proactively. This is Tier 2 of Carnot's self-learning architecture:
             cross-session pattern learning, not within-session adaptation."""

             def __init__(self):
                 self.violation_log = []     # list of {session_id, verifier_id, score, label}
                 self.constraint_templates = {}  # pattern -> symbolic constraint template
                 self.session_id = 0

             def record_violation(self, context, claim, verifier_scores, label):
                 """Record which verifiers fired (score > 0.5) for this (context, claim, label)."""
                 fired = [v for v, s in verifier_scores.items() if s > 0.5]
                 self.violation_log.append({
                     'session_id': self.session_id,
                     'fired_verifiers': fired,
                     'was_hallucination': (label == 1),
                 })

             def synthesize_templates(self, min_frequency=3):
                 """Synthesize constraint templates from violation patterns.
                 A 'pattern' = frozenset of verifiers that co-fired on hallucinations.
                 Templates are created for patterns that occur >= min_frequency times."""
                 from collections import Counter
                 hallucination_patterns = [
                     frozenset(e['fired_verifiers'])
                     for e in self.violation_log
                     if e['was_hallucination'] and e['fired_verifiers']
                 ]
                 pattern_counts = Counter(hallucination_patterns)
                 self.constraint_templates = {
                     str(sorted(pattern)): count
                     for pattern, count in pattern_counts.items()
                     if count >= min_frequency
                 }
                 return self.constraint_templates

             def get_active_constraints(self):
                 """Return symbolic constraint templates to apply in next session."""
                 return list(self.constraint_templates.keys())

             def advance_session(self):
                 self.session_id += 1

      2. Simulate 3 sessions on FoVer corpus (100 examples each, random_seed=42):
         Session 1 (cold start): evaluate ensemble v10 on 100 examples, record all violations.
         Session 2: synthesize templates from session 1 violations; evaluate ensemble with templates.
         Session 3: synthesize templates from sessions 1+2; evaluate ensemble with templates.
         For each session:
           - violation_rate = fraction of correct examples flagged (false positive rate proxy)
           - detection_rate = fraction of hallucinations detected (true positive rate)
         Compare: session_3_improvement = (session_3_detection_rate - session_1_detection_rate)
                  session_3_fp_change = session_3_violation_rate - session_1_violation_rate

      3. Determine nexus_session3_improvement:
         True if session_3_detection_rate > session_1_detection_rate AND session_3_violation_rate <= session_1_violation_rate + 0.05
         (Session 3 detects more hallucinations without substantially more false positives)

      4. Write results/experiment_2652_nexus_tier2_constraint_memory.json.

