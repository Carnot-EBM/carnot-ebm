    TASK:
    Bind fourteen tasks and preserve V704 terminal evidence. Deliver results/experiment_8150_v705_contract_custody.json, primitive evidence under results/raw/experiment_8150_v705_contract_custody/, and runnable scripts/experiments/experiment_8150_v705_contract_custody.py.
    CONCRETE STEPS:
    1. Emit a flushed progress line at each phase boundary and before and after every model load, generation, benchmark, and subprocess. Use PYTHONUNBUFFERED=1 and print(..., flush=True). Inside long loops and child waits, print actual completed/pending counts at least every 60 seconds. Keep every silence gap below 600 seconds. Poll in tool calls of at most 60 seconds. Write files over about 200 lines in several tool calls of at most about 150 lines. Send a progress message between writes. Never pad duration or invent activity.
    2. Check input files, hashes, runtime and gate operands before work. Read cited results with scripts/summarize_artifact.py, then inspect primitive rows. Preserve failed historical primaries. An unchanged external block is terminal complete_blocked_<check>, verdict_class=blocked, with the exact failed operand in gate_check_summary. Never use partial for missing, retired or gate-blocked upstream work.
    3. Extend the relevant REQ-* and SCENARIO-* before implementation. Write failing tests first. Reuse qualified modules through a thin CLI. Put private tests and mutations outside results/. Keep original assertions. Exercise script-path execution outside the checkout without PYTHONPATH. Bind historical methods to immutable versioned files; never parse old methods from mutable vNEXT.
    4. Load no LLM. Set MODEL_SPECS=[] and inference_substrate_class=no_model_load. Use aggregation_from_upstream_artifacts for reductions or verifier_ensemble_against_cached_candidates for CPU head evaluation. Store historical model provenance separately from current call counts. Declare small trained heads in trained_head_specs.
    5. Reuse the qualified authority reader. Bind exactly 14 tasks Exp8150 through Exp8163 in visible table, full machine JSON, canonical digest and activated authority. Do not gate all science on this administrative task.
    6. Snapshot V704 dispositions, primaries and raw validation sidecars. Report current primary and earlier logged verdict separately for Exp8149. Keep four absent source primaries as gate-skipped, not measured nulls.
    7. Run E2E-018 in a private copied authority tree: matching candidate, changed title/prompt/gate/ID/count, stale active milestone and cold replay. Verify the literal Exact task contract heading and complete task digest. Do not activate the milestone from this task.
    8. Freeze owned validation argv before measurement. Run scoped pytest, 100% changed-code statement coverage, Ruff check and format, strict mypy, and explicit-path spec coverage. Run the applicable private E2E success, block, tamper and cold-replay checks. Save command, expected/actual exit, duration and log hash. All required commands must exit normally. Keep unrelated repository-health failures separate. If Rust changes, also run cargo test, fmt, clippy and actual loaded-binding parity.
    9. Save primitive rows and source/code/config hashes. Recompute headlines independently. Run unmodified adversarial_verify.py and strict verdict_row_consistency_lint.py with progress while waiting. Publish through primary_publication only after owned checks pass. An owned failure sets readiness to 0 and verdict_class=disqualified. Reconcile openspec/, _bmad/traceability.md, ops/status.md and ops/changelog.md. Preserve history and operator-curated publication pages. No external publication.
    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: complete_*; verdict_class: positive | circular_positive | null | blocked | disqualified | partial. Principle: only unfinished owned work is retryable partial.
    - verifier_is_oracle, claim_scope, exposure_scope, independent_generalization_score: 0, generalized_learning_benefit_score: 0. Principle: fixtures are circular_positive; exposed development is not independent generalization.
    - required_checks_passed, flagged_adversarial, validation_receipts, terminal_validation_sidecar_path, preconditions_checked. Principle: readiness requires normal owned validation.
    - gate_check_summary: check/upstream/path/hash/artifact_field/op/expected/observed/passed. Principle: blocked results name the actual failed check and value.
    - inference_substrate, inference_substrate_class, MODEL_SPECS, trained_head_specs, model_invocation_counts, call_ledger. Principle: current execution and imported provenance are distinct.
    - rows: unit_id/source_cluster_id/arm/condition/metric/numerator/denominator/status/exclusion_reason. Principle: every comparison is reconstructable per unit.
    - intended_count, eligible_count, independent_count, completed_count, excluded_count, censored_count, failed_count, sample_size_budget. Principle: repeats do not create independent sources.
    - run_date, duration_s, random_seed, reproducibility_checksum, source_artifact_hashes, raw_shard_hashes, code_config_hashes, phase_spans, acceptance_gates, field_principles. Principle: claims bind to measured work and declared thresholds.
    - contract_ready_score: 0|1, task_dispositions, authority_snapshots, canonical_tasks_sha256. Principle: administrative completion grants no scientific credit.
    Run command: cd {project_root} && PYTHONUNBUFFERED=1 JAX_PLATFORMS=cpu .venv/bin/python -u scripts/experiments/experiment_8150_v705_contract_custody.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
