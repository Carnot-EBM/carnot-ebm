- id: exp1275-fsnet-feasibility-step-continuous-ebm
  milestone: 2026.04.99
  deliverable: results/experiment_1275_fsnet_feasibility_step_continuous_ebm.json
  title: "FSNet Feasibility Step for Continuous EBM - Raw Langevin vs Feasibility Seeking"
