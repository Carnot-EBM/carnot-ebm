      - provisional_or_sidecar_metrics: list (principle: useful evidence can be bounded instead of discarded)
      - downstream_usage_rules: dict (principle: later tasks need precise constraints)
      - random_seed: int (principle: reproducibility)
      - reproducibility_checksum: str (principle: artifact integrity)
      - duration_s: float (principle: timing evidence)
      - honest_verdict: str (principle: must start with complete:/success:/passed:/shipped:)
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

