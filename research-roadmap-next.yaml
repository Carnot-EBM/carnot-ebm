  - id: exp1727
    title: "Empirical δ Calculation for Verify-Repair Convergence (arXiv:2512.02080)"
    agent_type: codex
    model: gpt-5.5
    priority: high
    max_turns: 30
    prompt: |
      CONTEXT: The 4/δ Bound theory (arXiv:2512.02080) models LLM-verifier loops as absorbing Markov chains, predicting termination in E[n] ≤ 4/δ iterations.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/repair_executor.py`.
      TASK: Compute Carnot's empirical δ from recent verify-repair runs to ground our convergence claims.
      CONCRETE STEPS:
      1. Analyze logs/artifacts from recent verify-repair runs to compute the single-step absorption probability (δ).
      2. Compare the empirical iteration count against the 4/δ bound.
      3. Write a summary to `docs/research-notes/empirical_delta_bound.md` and propose a short update for paper-v6.
      REQUIRED ARTIFACT FIELDS:
      - status: "complete"
      - empirical_delta: float
      The honest_verdict field MUST start with one of these terminal prefixes:
        complete:    or  complete_
        success:     or  success_
        passed:      or  passed_
        shipped:     or  shipped_
      Run command. Do NOT push. Do NOT modify scripts/research_conductor.py.

