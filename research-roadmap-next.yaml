           verifier DECISION covariance Sigma; compute lambda_min(Sigma) + effective_k (participation ratio).
        2. Run the FR-11 loop to N>=200 under the FOUR arms, tracking DISTINCT metrics (output
           entropy, top-mode mass, verifier-PASS rate, TRUE ground-truth accuracy — ASSERT pass_rate
           and true_accuracy are not the same array). collapse_detected = entropy below threshold /
           top-mode mass above threshold. For Arm A, RE-MEASURE lambda_min online and adapt beta.
