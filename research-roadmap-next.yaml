# honest verdicts on realistic synthetic fixtures; never hard-assert one success string against a real corpus;
# never use Q/R/H-number placeholders.
# BACKEND: gemini probed OK on a 3rd consecutive probe (exp3679) BUT the .337-close PLANNER call CRASHED on
