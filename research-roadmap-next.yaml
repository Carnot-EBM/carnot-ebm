    op: >
    value: 0

- id: exp981-ppsebm-live-gpu-relay
  milestone: 2026.04.76
  deliverable: results/experiment_981_ppsebm_live_gpu_relay.json
  title: "PPSEBM Live GPU Relay — Cross-Session Memory on Real GPU-Inferred Violations"
  prompt: |
    CONTEXT:
    Exp 970 (PPSEBM Tier 2 Cross-Session Memory, .75) proved plateau_broken=True on CPU
    synthetic data: sessions_with_new_templates >= 3 (target met). But PPSEBM's value is in
    learning from REAL constraint violations, not synthetic ones. The FR-11 relay (Exp 443)
    established that real-data training matters: JEPA AUC improved 0.457→0.571 only when
    trained on real data, not synthetic.

    This experiment validates PPSEBM on real live GPU-inferred violations:
    1. Run Gemma4-31B on 50 GSM8K questions (CARNOT_FORCE_LIVE=1)
    2. Collect violations: questions where model's arithmetic is wrong (verifiable by Z3/Python eval)
    3. Feed violations into PPSEBM cross-session memory across 5 sessions
    4. Track: does PPSEBM still add new constraint templates on real violations?
       (CPU synthetic plateau was broken; real data may or may not match)

    EXISTING CODE TO READ FIRST:
    - scripts/experiment_970_ppsebm_tier2_crosssession_memory.py (PPSEBM implementation)
