  estimated_wall_time_min: 45
  per_unit_rows: true
  milestone: 2026.11.766
  deliverable: results/experiment_8957_v766_branch_contract.json
  inference_substrate_class: no_model_load
  MODEL_SPECS: []
  gated_on: []
  prior_failures:
  - experiment_id: exp8944-branch-contract
    verdict: complete_null_v765_branch_contract
    addressed_by: Bind a new fourteen-task authority and the restored ARC directive; qualify a changed event
      frontier only, preserving quarantined evidence.
    retire_if_same_verdict: true
  prompt: |-
    CONTEXT:
    V765 has thirteen terminal producers; Exp8945 is quarantined. research-complete.yaml lags at V764. Original primaries and conductor receipts establish V765 outcomes. The November 7 suspension lift restores one opportunistic ARC slot; the oracle-distinct verifier remains the north star.

    EXISTING CODE TO READ FIRST:
    - CLAUDE.md
    - CODEX.md
    - research-program.md
    - ops/north-star.md
    - openspec/capabilities/research-reporting/spec.md
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - scripts/experiment_template.py
    - python/carnot/reporting/current_work_receipt.py
    - python/carnot/reporting/primary_publication.py
    - ops/e2e-test-plan.md
    - python/carnot/reporting/v765_branch_contract.py
    - python/carnot/reporting/arc_supervisor_frontier_8720.py
    - python/carnot/agentic/arc_supervisor_refinement.py
    - results/experiment_8956_v765_capstone.json
    - ops/exclusion_manifest.yaml
    - research-complete.yaml
    - ops/conductor-log.md

    TASK:
    Bind fourteen tasks and qualify only new ARC evidence. Deliver results/experiment_8957_v766_branch_contract.json for 2026.11.766.

    CONCRETE STEPS:
    1. Read the sources and REQ-REPORT-8957 / SCENARIO-REPORT-8957-CONTRACT. Work in {project_root} on {date}. Authenticate inputs before costly work. Historical tasks are retained inputs, never runtime requires on retired IDs.
    2. Emit a flushed progress line at each phase boundary and before and after every model load, generation, benchmark or subprocess that can take minutes. Use python -u and print(..., flush=True); forward child output. In long loops and subprocess supervision emit completed/pending counts at least every 60 seconds. Keep every silence gap below 600 seconds, including between tool calls. Target completion below 4200 seconds, including checks, within the 4800-second hard cap.
    3. Bound every tool call. Write any file over about 200 lines in several tool calls of at most 150-200 lines, with a progress message between them. Put real scripts in scripts/experiments/, tests in tests/python/, and scratch in /tmp; never write scratch scripts to the repository root.
    4. Bind exactly fourteen full task objects Exp8957-Exp8970, titles, deliverables, order and all gate fields to immutable execution authority. Verify the visible table and embedded JSON against staged/activated YAML. Preserve the original V765 design and queue snapshots; a document-only task list is insufficient. Do not activate a queue or edit the exclusion manifest.
    5. Keep Exp8945 flagged and excluded; record its illegal substrate/class and venue as a historical diagnosis, not a newly qualified science result. Authenticate the usable V765 graph corpus directly from Exp8946/8948/8949/8950/8951, independent of the rejected diagnostic and blocked capstone.
    6. Use the qualified ARC producer locator/frontier to inspect only new live selected/applied supervisor receipts beyond the last qualified frontier. Set arc_new_outcomes_ready_score=1 only for at least 30 newly authenticated uncensored episodes, three game families and both compared arms with held-family support. Missing authority or zero new qualifying outcomes yields score0 with exact diagnostics. No games, model loads or unchanged panel reruns occur here.
    7. Set contract_ready_score solely from complete authority and mutation checks. It is not a global science gate. Independent methods tasks validate their own retained inputs. Store all baseline frontiers and hashes for the ARC task; compare actual receipt identity, not modification time.
    8. Before implementation, extend the named REQ/SCENARIO and write failing tests. Reuse existing helpers. Run scoped pytest with measured 100-percent newly owned unit/child statement coverage and zero exclusions, Ruff check and format --check, strict mypy, and scripts/check_spec_coverage.py with positional test paths. Exercise applicable private E2E-018/021 CLI publication, cold replay and rehashed-tamper refusal; keep tests in private scratch. Record global debt separately and never waive failed owned checks. Reconcile specs, _bmad/traceability.md, ops/status.md and ops/changelog.md from actual outcomes.
    9. Publish the final artifact through primary_publication only after owned checks pass. Preserve original producers and quarantines. Missing external evidence is terminal blocked with gate_check_summary naming upstream, check, exact field, expected and observed value. Failed owned controls are disqualified. partial means unfinished owned work that another attempt can finish, never unchanged external absence. Preserve prior honest_verdict on an unchanged rerun failure so retirement can compare it. Never fabricate measurements or sleep to satisfy a duration floor.

    REQUIRED ARTIFACT FIELDS:
    - experiment_id, task_id, milestone, run_date, random_seed, reproducibility_checksum. principle: Bind the result to the scheduled task, input bytes and reproducible randomness.
    - honest_verdict: terminal complete_ prefix followed by actual disposition and scope. principle: An honest terminal outcome avoids wasted retries and preserves exact rerun retirement.
    - verdict_class: positive | circular_positive | null | blocked | disqualified | partial. principle: This closed class carries claim strength; verifier_is_oracle=true and any failed acceptance gate forbid positive.
    - inference_substrate, inference_substrate_class, execution_venue. principle: Use the actual legal substrate and venue; host is valid, host_cpu is not. no_model_load never claims a new GGUF run.
    - MODEL_SPECS, model_specs, model_invocation_counts, numerical_training_calls. principle: Distinguish small-head training, retained model outputs and actual generator calls; count each separately.
    - duration_s, phase_spans, preconditions_checked. principle: Actual clocks and resource receipts prevent fabricated execution and duration padding.
    - verifier_is_oracle, exposure_scope, independent_generalization_score. principle: Separate exact labels from learned inference; graph-domain success does not establish the no-cheap-oracle north star.
    - intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count. principle: Retain every scheduled unit and identify the independent denominator.
    - rows: per-unit metric/value/numerator/denominator, arm, condition, cluster_id, status and censor_reason. principle: Comparative headlines must recompute from typed rows; repeated seeds or perturbations do not enlarge independent sample size.
    - gate_check_summary: upstream, path/hash, check, artifact_field, expected, observed. principle: Distinguish missing_file, missing_field, observed_zero and rejected_producer; blocked_* always records the failed check.
    - source_artifact_hashes, code_config_hashes, raw_shard_hashes, field_principles. principle: Retain content custody and echo these principles so a later reader can verify why fields exist.
    - acceptance_gates, required_checks_passed, owned_statement_coverage, validation_receipts, global_test_debt. principle: Record each gate with its principle; readiness is separate from scientific benefit and failed owned checks disqualify.
    - contract_ready_score: integer 0 or 1. principle: Full-task equality prevents a promised task from disappearing.
    - arc_new_outcomes_ready_score: integer 0 or 1. principle: Skip a costly ARC analysis when new supported live outcomes do not exist.
    - full_task_objects, full_task_digest, visible_task_table, gate_edge_rows, prior_scope_rows, arc_frontier, arc_support_rows. principle: Freeze authority and the exact evidence frontier before downstream reads.

    Run command: cd {project_root} && PYTHONPATH=python .venv/bin/python -u scripts/experiments/experiment_8957_v766_branch_contract.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.
