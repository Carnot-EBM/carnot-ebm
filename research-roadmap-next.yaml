        verdict: "complete: unsupported repair headline wording retired; explicit rerun gates required"
        addressed_by: "Keeps repair bounded and explicitly forbids headline wording promotion on zero or unverified delta."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. .290 finally executed the repair micro-panel but found zero repair delta. ReVeal and AgentV-RL both point to multi-turn generation-verification loops, but Carnot must keep tests/Z3 as the final authority and must avoid retired repair-headline wording.

      PRECONDITIONS
      0. Read results/experiment_3124_difficulty_stratified_live_sota_verifier_panel_v6.json and results/experiment_3126_fragment_time_monitor_satisfiable_drift_audit_v1.json first. If repair_gate_state is not unblocked or no mandated model is usable, write a complete gated-skip artifact with live_call_count=0.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF (flagship MoE)
      - unsloth/gemma-4-31B-it-GGUF (flagship dense)
      - unsloth/gemma-4-26B-A4B-it-GGUF (middle MoE)
