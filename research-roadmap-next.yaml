        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      Exp5608 proved bounded active-spline KAN adaptation but had zero forward transfer and no controlled nonstationarity. The V507 literature refresh separates domain-space change from temporal drift and requires duration-aware evaluation. Build the exact fixture before fitting a policy. Today is {date}.

      EXISTING CODE TO READ FIRST:
      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/research-program.md
      - {project_root}/research-references.md
      - {project_root}/results/experiment_5608_kan_longitudinal_self_learning.json
      - {project_root}/python/carnot
      - {project_root}/tests/python
      - {project_root}/openspec/capabilities

      TASK:
      Specify and generate a deterministic exact nonstationary constraint-stream benchmark, then emit results/experiment_5616_exact_nonstationary_constraint_stream.json and its referenced dataset under data/research/.

      CONCRETE STEPS:
      1. Add or extend the relevant OpenSpec REQ-* requirement before implementation. Define two independent axes: constraint-family/domain-space shifts and temporal predicate drift within a fixed family.
      2. Generate shared-rule, conflicting-rule, no-drift, reversible-drift, and persistent-drift cases at preregistered durations such as 1,2,4,8,16,32. Include at least 32 independent stream instances per condition with deterministic seeds and disjoint train/calibration/held-out splits.
      3. Label every state and update with an exact validator. Include explicit old-rule, current-rule, and future-rule labels so retention, adaptation, and leakage can be measured without circular model labels.
      4. Add corruption controls for wrong predicate, wrong variable/entity binding, delayed label, and poison update. Prove the exact validator rejects each injected violation and accepts every known-valid control.
      5. Publish a stable schema, stream ordering, seed list, family/duration counts, content hashes, and a replay loader. Do not run an LLM or claim self-learning benefit in this fixture task.
      6. REQUIRED ARTIFACT FIELDS: with `field_principles`, `dataset_path` — the fixture is durable; `schema_version` — rows have a stable contract; `space_shift_families` — domain changes are explicit; `temporal_drift_types` — time changes are explicit; `task_durations` — the duration axis is preregistered; `instances_per_condition` — denominators meet the evidence floor; `split_receipts` — leakage is excluded; `exact_oracle_label_count` — authority is deterministic; `oracle_label_error_count` — corrupted and valid controls are exact; `corruption_controls` — unsafe cases are represented; `fixture_ready_score` — exactly 1.0 only when schema, counts, splits, oracle, and replay pass; `inference_substrate=deterministic_verifier` — no LLM participated; `random_seeds` and `reproducibility_checksum` — generation replays exactly; `honest_verdict` — a deficient fixture blocks learners.
      7. Run targeted unit, spec-coverage, schema, replay, and adversarial artifact tests.
