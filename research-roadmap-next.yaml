  - id: exp2810
    milestone: "2026.05.266"
    deliverable: "results/experiment_2810_pretest_cascade_fix_v4.json"
    title: "Pre-Test Cascade Fix v4: PySAT Mock + Hardware Stub + Docs Fix"
    agent_type: claude
    model: opus
    max_turns: 100
    track: infrastructure
    requires_claude: true
    # Justification for requires_claude: multi-file infrastructure fix requiring:
    # (1) identify which tests are in the conductor pre-test collection
    # (2) fix PySAT dependency via unittest.mock.patch in test file
    # (3) create stub hardware/kv260/discrete_sb_256_tb.v
    # (4) diagnose and fix test_docs.py assertion
    # (5) run full test suite to confirm 0 failures
    # Multi-file Edit+Read+Bash across 4+ files = meets all 3 positive criteria.
    prompt: |
      Read CLAUDE.md for project context, especially:
      - "Tests Must Run and Assert (MANDATORY)" — never skip tests
      - "Never stash — always commit-first"

      CONTEXT: Milestone .265 produced ZERO experiments — all tasks SKIPPED
      with "Pre-tests failing, self-heal failed: 1 failed, 80 passed in 2.14s".
      Outer-loop analysis of the full test suite identified THREE failing tests:

        1. tests/python/test_experiment_1504_thrml_carnot_simulator_parity_v3.py
           RuntimeError: PySAT is required for InterwhenTokenMonitor.
           Install it with: pip install python-sat

        2. tests/python/test_exp1441_discrete_sb_rtl_source.py
           FileNotFoundError: hardware/kv260/discrete_sb_256_tb.v not found

        3. tests/python/test_docs.py::test_public_docs_cover_latest_pbt_and_fpga_reporting
           AssertionError: assert None

      These three (or a subset) are the "1 failed" blocking the conductor.

      TASK: Fix all three failing tests so the full test suite passes.
      Per CLAUDE.md "Tests Must Run and Assert": DO NOT use pytest.mark.skip,
      pytest.mark.skipif, or any skip decorator. Fix the tests to pass.

      CONCRETE STEPS:
        1. Run `pytest tests/python/ -x -q 2>&1 | head -80` to confirm the
           current failure(s). Record the exact output.

        2. FIX (1) — PySAT:
           Read `tests/python/test_experiment_1504_thrml_carnot_simulator_parity_v3.py`.
           Find the test that triggers the PySAT RuntimeError. Fix by mocking
           the pysat dependency using `unittest.mock.patch` so the test runs
           without the real library. The test logic (energy parity check)
           should still execute; only the PySAT-specific code path should be
           mocked. Do NOT add pytest.importorskip (that skips).

        3. FIX (2) — Missing hardware file:
           Check `ls hardware/kv260/` to see what files exist.
           Read `tests/python/test_exp1441_discrete_sb_rtl_source.py` to
           understand what it requires of discrete_sb_256_tb.v.
           Create `hardware/kv260/discrete_sb_256_tb.v` as a minimal valid
           Verilog stub (e.g. empty module declaration) so the file-existence
           check passes. The KV260 graduated in .260 (terminal state per
           CLAUDE.md Hardware-Task Continuity Discipline) so the real bitstream
           file is not needed; the test just needs the file to exist.

        4. FIX (3) — Docs assertion:
           Read `tests/python/test_docs.py::test_public_docs_cover_latest_pbt_and_fpga_reporting`
           to understand what assertion is failing. The assertion likely checks
           for content in docs that no longer exists. Update the test assertion
           to reflect current documentation state (update the expected strings,
           not skip the test). If the assertion was checking for a specific
           section that has been moved, update it to the current location.

        5. Run `pytest tests/python/ -q 2>&1 | tail -10` to confirm 0 failures.
           If new failures appear, fix those too before writing the artifact.

        6. Run the conductor's pre-test subset to confirm the cascade is resolved.
           The conductor runs `pytest tests/python/ ...` — the full suite passing
           means the pre-test subset will also pass.

        7. Write deliverable artifact.

      REQUIRED ARTIFACT FIELDS:
        - honest_verdict: MUST start with 'complete:' or 'complete_'
          principle: "Terminal prefix per Verdict Terminal-Prefix Discipline."
        - pretest_cascade_fixed: true
          principle: "Load-bearing gating field — ALL downstream Phase C/D/E tasks
                       gate on this. True means full test suite passes."
        - tests_before_fix: {failed: int, passed: int, errors: int}
          principle: "Baseline state before fix — documents severity of cascade."
        - tests_after_fix: {failed: int, passed: int, errors: int}
