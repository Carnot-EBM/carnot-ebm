- id: exp401-semantic-energy-scorer
  milestone: 2026.06.10
  deliverable: python/carnot/pipeline/semantic_energy_scorer.py
  title: 'Exp 401: Semantic Energy hallucination scorer — logit-space Boltzmann gating (arXiv 2508.14496)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2508.14496 (Semantic Energy, 2025-08,\
    \ updated 2025-12):\n\"Detecting LLM Hallucination Beyond Entropy\"\nKey idea: operate on PENULTIMATE-LAYER\
    \ LOGITS (pre-softmax) instead of post-softmax probabilities.\nPost-softmax normalization loses\
    \ the INTENSITY information of logits — a token with logit 100\nvs logit 10 both normalize to\
    \ high probability, but they represent very different confidence levels.\nSemantic Energy restores\
    \ this: cluster semantically equivalent responses, then compute\nBoltzmann-style energy E = -log(sum(exp(logits)))\
    \ over the cluster. Higher energy = more\nhallucination-prone. Consistently outperforms semantic\
    \ entropy.\n\nWHY THIS MATTERS FOR CARNOT: This complements our Ising constraint verification.\n\
    Ising checks structural correctness AFTER generation. Semantic Energy provides a FAST pre-filter\n\
    DURING generation — if the energy is high, trigger full Ising verification; if low, skip.\nThis\
    \ is the same architecture as SinkProbe (Exp 348) but using logit-space energy instead of\nattention\
    \ sink concentration. Two different fast-path signals to compare.\n\nNote: Full Semantic Energy\
    \ requires model internals (logits). CI-safe mode uses simulated\nlogits. Live mode needs GPU model\
    \ loaded with output_scores=True or output_logits=True.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/sink_probe.py\
    \ — SinkProbe (Exp 348) — fast-path pattern to follow\n- python/carnot/pipeline/live_gpu_gate.py\
    \ — LiveGPUGate (Exp 377)\n- python/carnot/pipeline/three_tier_pipeline.py — ThreeTierPipeline\
    \ (Exp 360) — integration point\n- python/carnot/pipeline/live_gpu_diagnostic.py — diagnose_live_gpu()\
    \ for CI-safe mode\n\nTASK: Implement SemanticEnergyScorer and benchmark vs SinkProbe.\n1. Read\
    \ CLAUDE.md spec-first workflow.\n2. Add REQ-VERIFY-090 (SemanticEnergyScorer detects hallucinations\
    \ from logit-space energy),\n   REQ-VERIFY-091 (CI-safe mode with simulated logits),\n   SCENARIO-VERIFY-120/121/122\
    \ to openspec/capabilities/verifiable-reasoning/spec.md.\n3. Write tests FIRST (100% coverage\
    \ required) for ALL of the following:\n   - SemanticCluster: dataclass (response_texts: list[str],\
    \ logit_matrix: jnp.ndarray | None)\n   - compute_boltzmann_energy(logits: jnp.ndarray, temperature:\
    \ float = 1.0) → float:\n     E = -log(sum(exp(logits / temperature))). Returns scalar.\n   -\
    \ SemanticEnergyResult: dataclass (energy: float, is_uncertain: bool, should_verify: bool,\n  \
    \   n_tokens_scored: int, inference_mode: str)\n   - SemanticEnergyScorer(threshold: float = 2.0,\
    \ temperature: float = 1.0)\n   - SemanticEnergyScorer.score(response: str, logits: jnp.ndarray\
    \ | None = None) → SemanticEnergyResult:\n     If logits is None: CI-safe mode — returns synthetic\
    \ energy via deterministic hash of response.\n     If logits provided: compute Boltzmann energy\
    \ over last-token logit vector.\n     is_uncertain = energy > threshold. should_verify = is_uncertain.\n\
    \   - SemanticEnergyScorer.benchmark(responses: list[str], logits: list | None,\n     correctness_labels:\
    \ list[bool]) → dict:\n     Compute AUROC of energy as hallucination predictor. Return skip_rate\
    \ and fn_rate.\n   - Test: logits with high variance (spread) → higher energy than uniform logits\n\
    \   - Test: CI-safe mode (None logits) never raises, returns SemanticEnergyResult with\n     inference_mode=\"\
    ci_synthetic\"\n4. Implement python/carnot/pipeline/semantic_energy_scorer.py:\n   Verbose docstrings\
    \ explaining:\n   * WHY pre-softmax logits preserve information lost in normalization (arXiv 2508.14496)\n\
    \   * WHY Boltzmann energy maps to uncertainty (high spread = low energy = confident)\n   * HOW\
    \ this complements Ising: fast logit-space pre-filter + structural Ising verification\n   * The\
    \ hardware path: logit energy computed on GPU during generation; Ising on CPU/FPGA\n5. Export SemanticEnergyScorer,\
    \ SemanticEnergyResult, compute_boltzmann_energy from carnot.pipeline.__init__.\n6. Write scripts/experiment_401_semantic_energy.py\
    \ using ExperimentTemplate(401):\n   a. In CI-safe mode (no GPU): generate 50 synthetic responses;\n\
    \      score with simulated logits (no model needed)\n   b. Compute: mean_energy_correct vs mean_energy_wrong\
    \ on synthetic data\n   c. Benchmark vs SinkProbe on same synthetic data (load SinkProbe from Exp\
    \ 348):\n      compare skip_rate and fn_rate of both fast-path methods\n   d. If CARNOT_FORCE_LIVE=1\
    \ and GPU available: run with real Gemma4-E4B-it logits (30 GSM8K)\n   e. Build artifact: schema=\"\
    carnot.semantic_energy.v1\",\n      inference_mode, mean_energy_correct, mean_energy_wrong, energy_separation,\n\
    \      auroc_semantic_energy, skip_rate_semantic, fn_rate_semantic,\n      skip_rate_sinkprobe,\
    \ fn_rate_sinkprobe, winner (\"semantic_energy\" / \"sinkprobe\" / \"tie\"),\n      honest_verdict:\
    \ \"viable_fast_path\" when auroc > 0.70; \"marginal\" when 0.60-0.70;\n      \"no_better_than_random\"\
    \ when <= 0.60\n   f. Output: results/experiment_401_semantic_energy.json\n7. Write tests/python/test_semantic_energy_scorer.py\
    \ (100% coverage required).\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n9. Reconcile:\
    \ update ops/conductor-log.md, ops/changelog.md, ops/status.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp402-crane-extraction-gate
  milestone: 2026.06.10
  deliverable: python/carnot/pipeline/crane_extractor.py
  title: 'Exp 402: CRANE extraction gate — alternating free + constrained extraction (arXiv 2502.09061)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md for code\
    \ style requirements.\nToday's date: {date}.\n\nCONTEXT: arXiv 2502.09061 (CRANE, ICLR 2026 accepted):\n\
    \"Reasoning with Constrained LLM Generation\"\nCore insight: strict grammar constraints during\
    \ generation HURT reasoning because they prevent\nfree-form thinking. The fix: let the model REASON\
    \ FREELY until a trigger token, then SWITCH to\nconstrained generation for the final answer/claim.\
    \ Up to +10pp improvement on symbolic reasoning benchmarks.\n\nWHY THIS MATTERS FOR CARNOT:\n\
    The root cause of ArithmeticExtractor's 0% detection on Gemma4-E4B-it is that instruction-tuned\n\
    models reason in natural language, not regex-parseable equations. LLMExtractor (Exp 366) uses\n\
    a second LLM call to extract claims — expensive (2 LLM calls per question). CRANE suggests a\n\
    cheaper approach: add a structured suffix to the MODEL PROMPT itself. Include a trigger like\n\"\
    VERIFIED CLAIMS:\" at the end of the system prompt; the model reasons freely, then produces a\n\
    structured CLAIM block. This requires ONE LLM call instead of TWO.\n\nDifference from LLMExtractor:\
    \ CRANE modifies the PROMPT to elicit structured output;\nLLMExtractor makes a SECOND LLM CALL\
    \ to extract claims from free-form output.\nCRANE is cheaper (1x inference cost) but requires\
    \ prompt cooperation from the model.\nLLMExtractor is more robust (works on any output format)\
    \ but costs 2x inference.\n\nCRANEExtractionGate is prompt-side: append a structured suffix to\
    \ elicit constrained output.\nCompare vs ArithmeticExtractor and LLMExtractor on detection rate\
    \ and fp_rate.\n\nEXISTING CODE TO READ FIRST:\n- python/carnot/pipeline/extract.py — ArithmeticExtractor,\
    \ ConstraintExtractor protocol (Exp 74)\n- python/carnot/pipeline/llm_extractor.py — LLMExtractor\
    \ (Exp 366) — to compare against\n- python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline\
    \ integration point\n- tests/python/test_extractor.py — extractor test patterns\n\nTASK: Implement\
    \ CRANEExtractionGate as a prompt-side constrained extraction strategy.\n1. Read CLAUDE.md spec-first\
    \ workflow.\n2. Add REQ-EXTRACT-024 (CRANEExtractionGate elicits structured claims via prompt\
    \ suffix),\n   REQ-EXTRACT-025 (alternating-grammar approach: free reasoning + constrained claim\
    \ block),\n   SCENARIO-EXTRACT-049/050/051 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Write tests FIRST (100% coverage required) for ALL of the following:\n   - CRANEClaimBlock:\
    \ dataclass (raw_text: str, claim_lines: list[str], parsed_claims: list[str])\n   - CRANE_CLAIM_SUFFIX:\
    \ str constant — the structured suffix to append to prompts:\n     \"\\n\\nVERIFIED CLAIMS (one\
    \ per line, format: CLAIM: [quantity] [op] [quantity] = [result]):\\n\"\n   - build_crane_prompt(original_prompt:\
    \ str) → str: appends CRANE_CLAIM_SUFFIX\n   - parse_crane_output(response: str) → CRANEClaimBlock:\n\
    \     Splits on \"VERIFIED CLAIMS:\"; extracts CLAIM: lines from structured block;\n     falls\
    \ back to empty list if no structured block found (graceful degradation)\n   - CRANEExtractionGate(llm_caller:\
    \ Callable | None = None) — implements ConstraintExtractor protocol\n   - CRANEExtractionGate.extract(response:\
    \ str, question: str) → list[ConstraintTerm]:\n     Parses VERIFIED CLAIMS block if present in\
    \ response;\n     If llm_caller is provided and no CRANE block found: retry with CRANE prompt\n\
    \     Returns list of ConstraintTerms from parsed claims\n   - CRANEExtractionGate.wrap_prompt(question:\
    \ str) → str: builds CRANE-augmented question\n   - Comparison benchmark function: run all three\
    \ extractors on same responses, compute TP/FP/FN/TN\n4. Implement python/carnot/pipeline/crane_extractor.py:\n\
    \   Verbose docstrings explaining:\n   * WHY CRANE works: free reasoning prevents constraint clash\
    \ (arXiv 2502.09061 insight)\n   * WHY prompt-side is cheaper than LLMExtractor (1x vs 2x inference)\n\
    \   * HOW to combine: use CRANE for primary extraction, LLMExtractor as fallback\n   * The limitation:\
    \ requires model cooperation (IT models follow instructions, base models don't)\n5. Export CRANEExtractionGate,\
    \ CRANEClaimBlock from carnot.pipeline.__init__.\n6. Write scripts/experiment_402_crane_extractor.py\
    \ using ExperimentTemplate(402):\n   a. Load or create 30 synthetic IT-format responses with known\
    \ correctness labels\n   b. Run three extractors: ArithmeticExtractor, CRANEExtractionGate (no\
    \ LLM, prompt-only mode),\n      LLMExtractor (CI-stub llm_caller=None, which returns empty claims)\n\
    \   c. Count TP/FP/FN/TN per extractor; compute detection_rate and fp_rate\n   d. If CARNOT_FORCE_LIVE=1:\
    \ use live Qwen3.5-0.8B as llm_caller for LLMExtractor;\n      wrap prompts with build_crane_prompt()\
    \ before sending to live model\n   e. Build artifact: schema=\"carnot.crane_extractor.v1\",\n \
    \     n_questions, inference_mode, per_extractor_results,\n      crane_detection_rate, arithmetic_detection_rate,\
    \ llm_detection_rate,\n      crane_fp_rate, arithmetic_fp_rate, llm_fp_rate,\n      honest_verdict:\
    \ \"crane_wins\" when crane_detection_rate > arithmetic_detection_rate AND crane_fp_rate <= llm_fp_rate;\n\
    \      \"crane_viable\" when crane_detection_rate > arithmetic_detection_rate;\n      \"no_improvement\"\
    \ otherwise\n   f. Output: results/experiment_402_crane_extractor.json\n7. Write tests/python/test_crane_extractor.py\
    \ (100% coverage required).\n8. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\n9. Reconcile:\
    \ update ops/conductor-log.md, ops/changelog.md, ops/status.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

