- id: exp914-pimi-sparse-adjacency-final
  milestone: 2026.04.70
  deliverable: results/experiment_914_pimi_sparse_adjacency_final.json
  max_turns: 40
  prior_failures:
    - experiment_id: exp889-ice40-pimi-v3-parallel
      verdict: pimi_improved_below_5x
      addressed_by: >
        Exp 889 achieved 4.33x sweep reduction using parallel update (EMA-weighted
        inertia). The 5x target was not met. The new approach: sparse adjacency matrix
        where only the top-20% strongest couplings are active per sweep. This reduces
        per-sweep compute and may allow larger effective N. Root cause of 4.33x plateau:
        full adjacency means each sweep visits all N^2 couplings; sparse adjacency
        reduces effective work per sweep allowing the 5x reduction at same N.
      retire_if_same_verdict: true
  title: 'Exp 914: PIMI Sparse Adjacency Final — 5x Sweep Reduction Target (CPU/FPGA-Sim)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: RETRO-INERTIA-SWEEPS-TARGET-MISSED (PIMI < 5x). Exp 889 achieved 4.33x
    using parallel update + EMA inertia weighting. The final technique to attempt:
    sparse adjacency matrix (top-20% couplings only) which reduces per-sweep work.
    Root cause of 4.33x plateau: full N^2 coupling matrix makes each sweep expensive;
    sparse coupling may unlock 5x by reducing effective sweep cost.

    IMPORTANT: retire_if_same_verdict=True. If this experiment also produces
    pimi_below_target, the PIMI research scope is RETIRED to ops/exclusion_manifest.yaml
    and RETRO-INERTIA-SWEEPS-TARGET-MISSED is closed as RETIRED.

    EXISTING CODE TO READ FIRST:
    - results/experiment_889_ice40_pimi_v3_parallel.json — 4.33x result, parallel config
    - hardware/kv260/ising_pimi_v3.v — PIMI Verilog (reference; FPGA sim target)
    - python/carnot/samplers/ising_pimi_sampler.py — PIMI Python sampler
    - ops/exclusion_manifest.yaml — retirement record (update if retiring)
    - openspec/change-proposals/research-roadmap-v70.md — .70 Phase 5 design

    TASK: Implement sparse adjacency PIMI variant. Target 5x sweep reduction.
    If failed again: retire scope.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read results/experiment_889_ice40_pimi_v3_parallel.json. Confirm 4.33x.
    3. Implement python/carnot/samplers/ising_pimi_sparse_sampler.py:
       class PIMMISparseAdjacency:
         __init__(self, n_spins: int, sparsity: float = 0.2, inertia_alpha: float = 0.85):
           self.n = n_spins
           self.sparsity = sparsity  # keep only top-sparsity fraction of couplings
           self.alpha = inertia_alpha
         build_sparse_J(self, J_full: np.ndarray) -> sp.csr_matrix:
           threshold = np.percentile(np.abs(J_full), (1 - self.sparsity) * 100)
           J_sparse = J_full.copy()
           J_sparse[np.abs(J_sparse) < threshold] = 0
           return sp.csr_matrix(J_sparse)
         sweep_sparse(self, spins, J_sparse, h) -> tuple[np.ndarray, int]:
           Only visit non-zero coupling pairs (sparse.nonzero()).
           Return updated spins, n_flips.
         run(self, n_sweeps: int, J_full, h) -> dict:
           J_sparse = self.build_sparse_J(J_full)
           Record effective_sweep_cost = J_sparse.nnz / (self.n ** 2)
           Run n_sweeps. Return results with sweeps_reduction vs dense baseline.
    4. Create scripts/experiment_914_pimi_sparse_adjacency_final.py:
       a. tmpl = ExperimentTemplate(914, ..., requires_gpu=False). tmpl.setup().
       b. Test at N=64 (matches KV260 capacity from ops/status.md).
       c. Baseline: dense PIMI (Exp 889 config), measure sweeps to convergence.
       d. Sparse: PIMMISparseAdjacency(sparsity=0.2), measure sweeps to convergence.
       e. Compute: sweeps_reduction = baseline_sweeps / sparse_sweeps.
       f. honest_verdict:
