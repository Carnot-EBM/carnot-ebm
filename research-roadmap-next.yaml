      - CODEX.md
      - results/experiment_3097_exact_fixture_eval_protocol_audit_v1.json
      - results/experiment_3100_z3_oracle_feedback_v2.json
      - results/experiment_3111_certified_coherence_z3_mcs_feedback_v3.json
      - python/carnot if verifier or repair modules exist
      - tests if verifier or repair tests exist

      TASK
      Build a small offline fragment-level code/constraint verification pilot that localizes candidate failures into repairable fragments or constraint clauses without invoking live LLMs.

      CONCRETE STEPS
      1. Select exact fixtures that have repairable invalid candidates or code/assertion-style constraints.
      2. Split each candidate into fragments or constraint clauses using structured parsing where available.
      3. Run exact checks per fragment/constraint and label each as pass, fail, unknown, or non-applicable.
      4. Emit a repair target manifest with fixture_id, fragment_id, failing_constraint, expected_direction, and solver evidence.
      5. Add focused tests or deterministic self-checks for the parser/checker path.
      6. Write the deliverable artifact.

      REQUIRED ARTIFACT FIELDS:
      - fragment_verification_pilot_ready: bool (principle: localized verifier evidence must be explicit)
      - exact_fixture_count: int (principle: scale must be counted)
      - fragment_count: int (principle: localization granularity must be counted)
      - failing_fragment_count: int (principle: repair targets must be visible)
      - unknown_fragment_count: int (principle: parser/checker limits must be honest)
