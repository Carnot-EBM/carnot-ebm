- id: exp910-kan-tier4-seed
  milestone: 2026.04.70
  deliverable: results/experiment_910_kan_tier4_seed.json
  max_turns: 50
  title: 'Exp 910: KAN Tier 4 Seed — AutoKnots Adaptive Spline Grid Refinement (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: FR-11 Self-Learning Loop Tier 4 (KAN adaptive structure) has NOT STARTED.
    The current KAN model (carnot-kan) uses fixed spline grids. The AutoKnots technique
    (arXiv 2412.13423) enables adaptive grid refinement: add knots to high-activation
    splines (refine where needed), halve knot count for low-activation splines (prune
    dormant structure). This is the "structural self-improvement" tier of the self-learning
    loop. This experiment seeds Tier 4: implements AutoKnots grid refinement and measures
    whether it improves KAN energy discrimination on the verification task.

    EXISTING CODE TO READ FIRST:
    - crates/carnot-kan/src/lib.rs — KAN model (Rust implementation)
    - python/carnot/models/kan.py — Python KAN wrapper (carnot.models.kan)
    - python/carnot/pipeline/three_tier_pipeline.py — Tier 3 integration point
    - openspec/capabilities/self_learning/spec.md — FR-11 Tier 4 requirements
    - openspec/change-proposals/research-roadmap-v70.md — .70 Phase 3 design

    TASK: Implement AutoKnots adaptive spline grid refinement for the Python KAN model.
    Run refinement on 50 GSM8K verification examples. Measure AUC change before/after
    refinement.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/models/kan.py fully. Identify:
       - spline grid structure (knots, control points)
       - forward pass activation magnitudes
       - how to add/remove knots
    3. Implement python/carnot/models/kan_autoknots.py:
       class AutoKnotsRefiner:
         __init__(self, kan_model, high_activation_threshold: float = 0.8,
                  low_activation_threshold: float = 0.1, max_knots_per_spline: int = 32,
                  min_knots_per_spline: int = 4):
           self.model = kan_model
           self.high_thresh = high_activation_threshold
           self.low_thresh = low_activation_threshold
         refine_once(self, activation_batch: np.ndarray) -> RefinementResult:
           For each spline in kan_model:
             1. Compute mean activation magnitude for this spline across batch
             2. If mean > high_thresh AND n_knots < max_knots_per_spline:
                Insert knot at midpoint between most-activated adjacent knots
             3. If mean < low_thresh AND n_knots > min_knots_per_spline:
                Remove the least-activated knot
           Return RefinementResult(n_added=int, n_removed=int, splines_modified=list)
         multi_round_refine(self, activation_batch, rounds: int = 3) -> list[RefinementResult]
    4. Add spec entries: REQ-SELF-008 (KAN AutoKnots structural adaptation),
       SCENARIO-SELF-008 (refinement adds knots to high-activation paths, removes from dormant).
    5. Create scripts/experiment_910_kan_tier4_seed.py:
       a. tmpl = ExperimentTemplate(910, ..., requires_gpu=False). tmpl.setup().
       b. Load KAN model. Collect 50 GSM8K (question, response) embeddings.
       c. Measure baseline AUC: run KAN on all 50, compute AUC.
       d. Run AutoKnotsRefiner.multi_round_refine(activations, rounds=3).
       e. Re-run KAN after refinement. Measure post_refinement_auc.
       f. Compute: n_knots_added, n_knots_removed, signed_auc_improvement.
       g. honest_verdict:
          "tier4_seed_viable" if post_refinement_auc > baseline_auc
          "tier4_seed_no_improvement" otherwise
    6. Write tests. Traces to REQ-SELF-008.
    7. Write results/experiment_910_kan_tier4_seed.json.
    8. Update ops/changelog.md: one-line entry.
    9. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/python scripts/experiment_910_kan_tier4_seed.py
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp911-drift-probe-tier0i
  milestone: 2026.04.70
  deliverable: results/experiment_911_drift_probe_tier0i.json
  max_turns: 40
  title: 'Exp 911: DRIFTProbe Tier 0i — Multi-Layer Hidden-State Hallucination Probe (GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Tier 0 probes operate in < 50ms using cheap signal extraction. Tier 0h
    (SinkProbe) was confirmed viable in Exp 885. The next Tier 0 probe is DRIFTProbe:
    extract hidden-state activations from multiple transformer layers, compute drift
    signature (how much each layer's representation changes between factual and
    hallucinated tokens), and train a linear probe to classify hallucination.
    This is inspired by arXiv 2604.13386 (Multi-Layer Probe Ensembling) which showed
    that probing layer N+1 vs N captures drift signal invisible to single-layer probes.

    EXISTING CODE TO READ FIRST:
    - results/experiment_885_tier0h_sinkprobe_gpu.json — Tier 0h viable, probe_auc
    - python/carnot/verify/sink_probe.py — SinkProbe (Tier 0h reference pattern)
    - python/carnot/pipeline/three_tier_pipeline.py — Tier 0 integration point
    - openspec/change-proposals/research-roadmap-v70.md — .70 Phase 4 design

    TASK: Implement DRIFTProbe using multi-layer hidden-state drift signatures.
    Train linear probe on 100 GSM8K examples. Measure hallucination detection AUC.
    Target: ood_auc_drift > 0.65 for tier0i_viable verdict.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Create python/carnot/verify/drift_probe.py:
       class DRIFTProbe:
         __init__(self, model_runner, layers: list[int] = None, n_drift_pairs: int = 3):
           layers default to last 4 layers of model
         extract_drift_signature(self, hidden_states: dict[int, np.ndarray]) -> np.ndarray:
           For each adjacent layer pair (L, L+1): compute cosine drift = 1 - cosine_sim(h_L, h_(L+1))
           Concatenate: drift vector of shape [n_drift_pairs]
           Return drift_signature
         fit(self, correct_examples, hallucinated_examples) -> None:
           Extract drift signatures for all examples.
           Train sklearn LogisticRegression on (signature, label) pairs.
         predict_violation_prob(self, hidden_states) -> float:
           Return probe.predict_proba(drift_signature)[hallucinated_class]
    3. Add spec entries: REQ-TIER0-005 (DRIFTProbe multi-layer hallucination detection),
       SCENARIO-TIER0-005 (drift probe AUC > 0.65 on GSM8K hallucination pairs).
    4. Create scripts/experiment_911_drift_probe_tier0i.py:
       a. tmpl = ExperimentTemplate(911, ..., requires_gpu=True). tmpl.setup().
       b. MODEL_SPECS = [("name": "Qwen3.5-0.8B", "hf_id": "Qwen/Qwen3.5-0.8B", "gpu": 0)]
          (small model for hidden state extraction; full SOTA for expensive experiments)
       c. Generate 100 GSM8K (question, correct_response, hallucinated_response) triples.
          Hallucinated: inject wrong numerical answer while preserving reasoning style.
       d. Extract hidden states at layers [-4, -3, -2, -1] for each response.
       e. Fit DRIFTProbe on 80 training examples. Evaluate on 20 held-out.
       f. Compute ood_auc_drift using sklearn roc_auc_score.
       g. honest_verdict:
          "tier0i_viable" if ood_auc_drift > 0.65
          "tier0i_marginal" if ood_auc_drift > 0.55
          "tier0i_not_viable" otherwise
    5. Write tests. Traces to REQ-TIER0-005.
    6. Write results/experiment_911_drift_probe_tier0i.json.
    7. Update ops/changelog.md: one-line entry.
    8. tmpl.assert_deliverable_written() as final line.

    Run: .venv/bin/python scripts/experiment_911_drift_probe_tier0i.py
