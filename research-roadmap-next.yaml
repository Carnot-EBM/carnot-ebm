        addressed_by: "Closes .290 from matrix v24 and checks whether certified feedback, explicit repair artifact, and FR-11 retention changed paper readiness."
        retire_if_same_verdict: true
      - experiment_id: exp3094-capstone-v288
        verdict: "complete: capstone_ready=true; paper_ready=false; publication_blocker_count=36"
        addressed_by: "Maintains capstone lineage while using .290 artifact fields, not earlier planning intent."
        retire_if_same_verdict: true
      - experiment_id: exp3080-capstone-v287
        verdict: "complete: capstone_ready=true; paper_ready=false"
        addressed_by: "Keeps publication readiness strict and blocker-derived."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Project root placeholder: {project_root}. Run date placeholder: {date}. This is the .290 capstone. It must close the milestone from matrix v24 and concrete artifacts, not from planned intent.

      EXISTING CODE TO READ FIRST
      - CLAUDE.md
      - CODEX.md
      - research-program.md
      - _bmad/prd.md
      - _bmad/architecture.md
      - results/experiment_3120_cross_corpus_matrix_v24.json
      - results/experiment_3108_capstone_v289.json
      - ops/status.md
      - ops/changelog.md
      - ops/conductor-log.md
      - research-complete.yaml
      - research-roadmap.yaml

      TASK
      Write the .290 capstone artifact, determine paper readiness, summarize what the milestone actually proved, and recommend the next milestone from matrix v24 evidence.

      CONCRETE STEPS
      1. Load matrix v24 as the primary authority.
      2. Summarize whether the model-spec gap, formal-feedback readiness, calibration gate, repair artifact, FR-11 promotion, sidecar/cLUT boundaries, and GateMate/SSQA blockers changed from .289.
      3. Set paper_ready only if matrix v24 supports it with zero or explicitly downgraded publication blockers.
      4. Produce next_recommendation with the top 3 gaps that remain after .290.
      5. Update ops/status.md, ops/changelog.md, research-complete.yaml, and _bmad/traceability.md only if repository policy and the artifact evidence clearly require it; otherwise state why the capstone artifact alone is the deliverable.
      6. Write the deliverable artifact.

      REQUIRED ARTIFACT FIELDS:
      - capstone_ready: bool (principle: milestone closeout must be explicit)
      - paper_ready: bool (principle: publication readiness must be evidence-derived)
      - publication_blocker_count: int (principle: blocker count must match matrix authority)
      - blocker_delta_from_v23: int (principle: progress must be measured)
      - verifier_gain_status: str (principle: verifier claims must be bounded)
      - formal_feedback_status: str (principle: certified feedback readiness must be summarized)
      - repair_claim_status: str (principle: repair must not be promoted if blocked)
      - fr11_self_learning_status: str (principle: continuous self-learning boundary must be explicit)
      - ebt_arm_status: str (principle: sidecar integration status must be explicit)
      - sampler_hardware_status: str (principle: cLUT and hardware claims must be bounded)
      - gatemate_status: str (principle: GateMate status must be evidence-derived)
      - ssqa_status: str (principle: SSQA status must be evidence-derived)
      - next_recommendation: str (principle: next milestone should follow evidence)
      - source_artifacts: list (principle: capstone must trace to concrete files)
      - inference_substrate: dict (principle: aggregation work must declare no live model inference)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
