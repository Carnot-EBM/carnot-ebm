- id: exp881-code-repair-v8-gemma4
  milestone: 2026.04.68
  deliverable: results/experiment_881_code_repair_v8_gemma4.json
  title: 'Exp 881: Code Repair v8 — Gemma4-E4B-it Live HumanEval (GPU, transformers loader)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: 11 prior code repair attempts all failed, mostly due to GGUF download failures.
    STRATEGY CHANGE: Use google/gemma-4-E4B-it via HuggingFace transformers (NOT llama.cpp/GGUF).
    This model is available locally and loads reliably with transformers.AutoModelForCausalLM.
    The EnvPropagationGuard (Exp 855) and DualGPU runner (Exp 856) are ready.
    Getting ANY positive live code repair result on a real IT model is the priority.

    prior_failures:
      - experiment_id: exp870
        verdict: blocked
        addressed_by: "Using google/gemma-4-E4B-it via transformers instead of GGUF download.
                       GGUF download has failed 11 times; transformers path already works."

    EXISTING CODE TO READ FIRST:
    - results/experiment_855_preflight_v15.json — live_env_fixed gate
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
    - python/carnot/pipeline/extract.py — CodeExtractor
    - python/carnot/inference/loaders.py — GemmaTransformersLoader (from Exp 450)
    - openspec/change-proposals/research-roadmap-v68.md — .68 Phase 1

    TASK: Run 25 HumanEval problems with Gemma4-E4B-it (transformers). Apply CodeExtractor
    + VerifyRepairPipeline. Report signed_improvement and inference_mode=live_gpu.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Gate check: read results/experiment_855_preflight_v15.json. If live_env_fixed != True:
       write blocked artifact, exit. Assert CARNOT_FORCE_LIVE in os.environ.
    3. ExperimentTemplate(881, "Code repair v8 Gemma4 live HumanEval",
                           "results/experiment_881_code_repair_v8_gemma4.json",
                           requires_gpu=True).setup()
    4. Load google/gemma-4-E4B-it using GemmaTransformersLoader or
       transformers.AutoModelForCausalLM.from_pretrained("google/gemma-4-E4B-it",
       device_map="auto", torch_dtype=torch.bfloat16).
       If load fails: write blocked artifact with error, exit.
    5. Warmup with one synthetic code prompt before starting benchmark.
    6. Load 25 HumanEval problems (problems 0-24 from human_eval package or local copy).
       If human_eval not installed: pip install human-eval first, or use local cache in data/.
    7. For each of 25 problems:
       a. Generate Python code solution with Gemma4-E4B-it (inference_mode must be live_gpu)
       b. Apply CodeExtractor on the generated code
       c. If constraints found: run VerifyRepairPipeline.verify_and_repair()
       d. Execute against HumanEval test suite
       e. Record: problem_id, passed_baseline, passed_repaired, n_constraints_found
    8. Compute:
       - baseline_pass_rate: fraction passing without repair
       - carnot_pass_rate: fraction passing with repair
       - signed_improvement: carnot_pass_rate - baseline_pass_rate
       - n_problems: 25, inference_mode: "live_gpu"
       - n_constraints_extracted: total across all problems
    9. honest_verdict:
       - "positive_repair" if signed_improvement > 0 AND inference_mode=live_gpu
       - "live_no_improvement" if inference_mode=live_gpu AND signed_improvement <= 0
       - "zero_constraints" if n_constraints_extracted == 0 (extraction issue)
       - "simulation_fallback" if inference_mode != live_gpu
       - "blocked" if gate failed or model load failed
    10. Build artifact and write results/experiment_881_code_repair_v8_gemma4.json.
    11. Write tests/python/test_experiment_881_code_repair_v8_gemma4.py with 100% coverage.
        Mock GemmaTransformersLoader and VerifyRepairPipeline.
        Test gate check, signed_improvement computation, honest_verdict mapping.
        Traces to REQ-VR-020 (verify-repair live), SCENARIO-VR-030 (HumanEval live).
    12. Reconcile: ops/changelog.md, ops/status.md with result.
    13. tmpl.assert_deliverable_written() as final line.

    Run: CARNOT_FORCE_LIVE=1 .venv/bin/python scripts/experiment_881_code_repair_v8_gemma4.py
    For tests: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_881_code_repair_v8_gemma4.py -v
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp882-live-cascade-v7-gemma4
  milestone: 2026.04.68
  deliverable: results/experiment_882_live_cascade_v7_gemma4.json
  title: 'Exp 882: Live Cascade v7 — Gemma4-E4B-it + 50 GSM8K + Full Tier 0-3 (GPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: Prior live cascade benchmarks (Exps 871, 858) produced simulation_fallback
    or were blocked. This experiment uses Gemma4-E4B-it (transformers, not GGUF) which
    already works (GemmaTransformersLoader, Exp 450+). The cascade is complete:
    Tiers 0a/0b/0c/0d/0e/0g (StreamingCoT, Exp 874) all implemented and advisory.
    Tier 2.5 (SymCodeVerifier AUC=0.804 live), Tier 2.7 (CausalReasoningVerifier) wired.
    This is the first cascade benchmark expected to run on real GPU output.

    EXISTING CODE TO READ FIRST:
    - results/experiment_882_live_cascade_v7_gemma4.json — if exists, check status
    - results/experiment_855_preflight_v15.json — live_env_fixed
    - results/experiment_856_dualgpu_production.json — dual_gpu_deployed
    - python/carnot/pipeline/three_tier.py — ThreeTierPipeline
    - python/carnot/pipeline/verify_repair.py — VerifyRepairPipeline
    - openspec/change-proposals/research-roadmap-v68.md — .68 Phase 1

    TASK: Run 50 GSM8K questions with Gemma4-E4B-it + full cascade (Tiers 0-3).
    Report cascade_skip_rate, baseline_accuracy, carnot_accuracy, inference_mode.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Gate checks:
       a. Read results/experiment_855_preflight_v15.json. live_env_fixed must be True.
       b. Assert CARNOT_FORCE_LIVE in os.environ.
    3. ExperimentTemplate(882, "Live cascade v7 Gemma4 50q GSM8K",
                           "results/experiment_882_live_cascade_v7_gemma4.json",
                           requires_gpu=True).setup()
    4. Load Gemma4-E4B-it (google/gemma-4-E4B-it, transformers, device_map="auto",
       torch_dtype=torch.bfloat16). Warmup with one prompt.
    5. Load 50 GSM8K test questions (questions 0-49 from gsm8k test split, or local cache).
    6. Load ThreeTierPipeline (Tier 0-2 cascade). JEPA model: use latest available
       (v25 from Exp 872 if exists, else prior version). StreamingCoT enabled if
       CARNOT_STREAMING_COT=1 is in env.
    7. For each of 50 GSM8K questions:
       a. Generate CoT response with Gemma4 (live GPU, CARNOT_FORCE_LIVE=1)
       b. Run ThreeTierPipeline on response (Tiers 0-2, early-exit on clear)
       c. If not cleared: run VerifyRepairPipeline (Tier 3 Ising)
       d. Evaluate correctness against GSM8K ground truth (extract final answer)
       e. Record: tier_exited_at, was_correct_baseline, was_correct_carnot
    8. Compute:
       - baseline_accuracy: correct count (no repair) / 50
       - carnot_accuracy: correct count (with repair) / 50
       - signed_improvement: carnot_accuracy - baseline_accuracy
       - cascade_skip_rate: fraction where cascade cleared before Tier 3
       - cascade_tiers_active: distinct tiers that fired
       - inference_mode: "live_gpu" (verified by CARNOT_FORCE_LIVE)
    9. honest_verdict:
       - "positive_improvement" if signed_improvement > 0 AND inference_mode=live_gpu
       - "live_no_improvement" if inference_mode=live_gpu AND signed_improvement <= 0
       - "cascade_running" if inference_mode=live_gpu AND cascade_tiers_active >= 3
       - "simulation_fallback" if inference_mode != live_gpu
       - "blocked" if gate or model load failed
    10. Build artifact and write results/experiment_882_live_cascade_v7_gemma4.json.
    11. Write tests/python/test_experiment_882_live_cascade_v7_gemma4.py with 100% coverage.
        Mock Gemma4 loader, ThreeTierPipeline, VerifyRepairPipeline.
        Test gate logic. Test accuracy computation. Traces to REQ-BENCH-015.
    12. Reconcile: ops/changelog.md, ops/status.md.
    13. tmpl.assert_deliverable_written() as final line.

    Run: CARNOT_FORCE_LIVE=1 CARNOT_STREAMING_COT=1 .venv/bin/python scripts/experiment_882_live_cascade_v7_gemma4.py
    For tests: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_882_live_cascade_v7_gemma4.py -v
