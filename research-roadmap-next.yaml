- id: exp7010-arc-eval-provenance-contract
  title: ARC evaluation hardware and context provenance contract
  track: infrastructure
  priority: critical
  agent_type: claude
  model: opus
  requires_gpu: false
  max_turns: 100
  estimated_wall_time_min: 180
  per_unit_rows: true
