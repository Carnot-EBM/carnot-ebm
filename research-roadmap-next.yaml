      - {project_root}/research-roadmap.yaml and {project_root}/research-roadmap-next.yaml
      - {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6296_v542_adversarial_capstone.json
      - {project_root}/results/operational_retro_2026_08_542.json
      - {project_root}/results/experiment_6287_asp_continuous_relaxation.json
      - {project_root}/results/experiment_6288_partial_atom_evidence_adapter.json
      - {project_root}/results/experiment_6289_flagship_exact_state_refinement_benchmark.json
      - {project_root}/results/experiment_6290_revocable_atomic_repair_memory.json
      - {project_root}/results/experiment_6294_arc_mechanic_router_causal_canary.json
      - {project_root}/research-complete.yaml, {project_root}/ops/conductor-log.md, and {project_root}/ops/exclusion_manifest.yaml
      - {project_root}/scripts/roadmap_schema.py, {project_root}/scripts/audit_roadmap_gates.py, and {project_root}/scripts/exclusion_manifest_lint.py

      TASK
      Create an exact V542-to-V543 handoff. Classify every V542 declared artifact under current terminal and adversarial rules. Validate the staged V543 IDs, paths, dependencies, structured gates, prior-failure entries, direct agent routing, model policy, prompt contracts, and protected files. Do not activate research-roadmap-next.yaml and do not edit research-roadmap.yaml.

