         | EORM (arXiv:2505.14999) | GSM8k coverage | 90.7% | 55M params, ranking objective |
         | Carnot v11 | FoVer AUROC | {ensemble_v11_auroc_mean} | N={n_corpus}, 5-seed avg |
         | Carnot v11 | GSM8k proxy | {carnot_gsm8k_precision or 'N/A — no live inference'} | if live |
         Record: comparison_table (list of dict rows).

      5. Determine leaderboard_position_claim:
         A conservative claim the paper can make: "Carnot's ensemble approach (FoVer AUROC {v11_auroc})
         is architecturally consistent with EORM's energy-ranking principle; direct GSM8k comparison
         pending live GGUF availability."

