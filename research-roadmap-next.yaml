    TASK:
    Run the mandatory adapter-withheld leave-one-game-out ARC measurement on a
    frozen multi-game, multi-seed matrix. Compare levels reached without an
    adapter with the registry's adapter-backed levels while preserving live-
    path, model, and exact-reproduction provenance.

    CONCRETE STEPS:
    0. PRECONDITIONS: read the top-level
       adapter_withheld_live_path_ready_score from Exp7099 and require value 1.
       Also require its immutable raw traces, two idle RTX 3090 leases, CUDA
       llama.cpp, offline ARC, and both exact cached models. MODEL_SPECS must
       contain and execute `unsloth/Qwen3.8-27B-GGUF` as the pinned primary arm
       and `unsloth/Qwen3.6-35B-A3B-GGUF` as the mandatory SOTA headline
       control. Never download or substitute. On failure write terminal
       `blocked`, `inference_substrate_class=blocked_no_run`, and a
       gate_check_summary naming the exact check, expected value, and observed
       value.
    1. Add REQ-ARC-7100 and RED tests before implementation. Test all-zero
       completion, missing matrix cells, seed mismatch, model substitution,
       adapter or source leakage, registry-recipe leakage, unreachable action
       paths, outcome replay failure, duplicate game rows, and false registry
       promotion.
    2. Reuse Exp7099's frozen games. Require at least four games selected before
       outcomes, at least three fixed seeds per game, and both required models.
       Freeze the ordinary observation budget, action budget, context, decoding
       settings, stop rules, and level metric for all matched cells.
    3. Treat each selected game as one LOO fold. Any generic threshold or
       reusable calibration for that fold may use only the other games and must
       list their IDs. Target-game data, rules, outcomes, and registry recipes
