- id: exp2463-fr11-constraint-memory-tier2
  title: 'Phase 2: FR-11 Constraint Memory Tier 2 -- Cross-Session Fact Caching (MANDATORY Self-Learning)'
  milestone: 2026.05.238
  deliverable: results/experiment_2463_fr11_constraint_memory_tier2.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  continuous_self_learning_task: true
  prior_failures:
  - experiment_id: exp2451-fr11-soundness-completeness-v5
    verdict: 'complete: soundness_bound=0.000'
    addressed_by: "exp2451 (.237) implemented soundness/completeness asymmetric tracking (Tier 1 online
      learning, Littlestone bounds). exp2463 implements TIER 2 constraint memory: cross-session
      fact caching where verified facts persist across sessions as a queryable constraint template
      library. This is structurally different: Tier 1 updates weights online within a session;
      Tier 2 stores verified facts to a SQLite database for retrieval in future sessions.
      Different scope per research-program.md 'Tier 2: Constraint Memory / Trace2Skill'."
    retire_if_same_verdict: false
  prompt: "CONTEXT: FR-11 (continuous self-learning) is a MANDATORY program requirement.\nresearch-program.md\
    \ defines 4 learning tiers:\n  Tier 1: Online weight updates (done — exp2451 soundness/completeness\
    \ tracking)\n  Tier 2: Constraint memory / Trace2Skill — cross-session fact caching\n  Tier 3: JEPA\
    \ predictive verification\n  Tier 4: Adaptive energy landscapes\n\nThis task implements Tier 2:\
    \ a per-session fact cache that persists verified facts\nacross sessions. When the verifier finds\
    \ a violation (real error), the fact that was violated\nis stored in a SQLite database tagged by\
    \ domain. Future sessions query the cache to:\n  (a) auto-add constraint templates for known error\
    \ patterns\n  (b) learn per-domain error rates\n  (c) build a reusable constraint template library\n\
    \nThis directly addresses research-program.md Tier 2: 'Cache verified facts across sessions,\n\
    not just within a chain. Learn per-user and per-domain error patterns.'\n\nEXISTING CODE TO READ\
    \ FIRST:\n  {project_root}/python/carnot/verify/nsvif_z3_extractor.py (constraint extractor)\n  {project_root}/python/carnot/pipeline/verify_repair.py\
    \ (learning pipeline context)\n  {project_root}/results/experiment_2451_fr11_soundness_completeness_v5.json\
    \ (Tier 1 prior)\n\nTASK: Implement Tier 2 constraint memory cache and evaluate cross-session retention.\n\
    \nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. sqlite3 importable: .venv/bin/python -c \"import\
    \ sqlite3; print(sqlite3.sqlite_version)\"\n     b. nsvif_z3_extractor.py exists:\n        ls {project_root}/python/carnot/verify/nsvif_z3_extractor.py\n\
    \        If missing: write honest_verdict blocked_nsvif_module_missing and exit.\n     c. Telemetry\
    \ manifest: ls {project_root}/results/live_sota_balanced_telemetry_manifest_1480.jsonl\n        If\
    \ missing: write honest_verdict blocked_telemetry_manifest_missing and exit.\n\n  1. Create ConstraintMemoryCache\
    \ class at python/carnot/learn/constraint_memory.py:\n     Database: SQLite at {project_root}/data/constraint_memory.db\n\
    \     Tables:\n       verified_facts (id, domain, fact_text, violation_count, precision_rate, created_at)\n\
    \       constraint_templates (id, domain, template_pattern, success_rate, created_at)\n     Methods:\n\
    \       store_violation(domain, fact_text, was_real_error): insert into verified_facts\n       query_templates(domain):\
    \ return top-5 templates by success_rate for domain\n       update_precision(fact_id, was_correct):\
    \ update precision_rate\n\n  2. Run cross-session simulation on 50 telemetry entries:\n     Session\
    \ 1 (entries 1-25): process violations, store to cache.\n     Session 2 (entries 26-50): load cache,\
    \ apply templates, process violations.\n     Measure:\n       n_facts_cached: number of unique facts\
    \ stored after session 1\n       n_patterns_cached: number of constraint templates generated\n    \
    \   cross_session_retention_rate: fraction of session-1 violations found in session-2 domain\n  \
    \       (non-zero = cross-session learning is happening)\n       n_violations_processed: total violations\
    \ across both sessions\n\n  3. Gate check: cross_session_retention_rate >= 0.50 (50% of prior-session\
    \ violation patterns found in new session).\n\n  4. Unit test:\n     PYTEST_ADDOPTS=\"\" .venv/bin/python\
    \ -m pytest tests/python/ -k \"constraint_memory or tier2\" -v --no-cov 2>&1 | tail -15\n     Create\
    \ tests for ConstraintMemoryCache.store_violation() and .query_templates().\n\n  5. Write deliverable.\
    \ Validate JSON before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle:\
    \ \"Terminal-prefix required. Must start with complete: — FR-11 Tier 2 implementation.\"\n  - constraint_memory_implemented:\n\
    \      principle: \"True if ConstraintMemoryCache was created and runs. Core Tier 2 deliverable.\"\
    \n  - n_facts_cached:\n      principle: \"Number of unique facts stored in session 1. Non-zero proves\
    \ cache write works.\"\n  - n_patterns_cached:\n      principle: \"Number of constraint templates\
    \ generated. Documents Tier 2 learning.\"\n  - cross_session_retention_rate:\n      principle: \"\
    Fraction of session-1 patterns found in session-2 domain. Must be >= 0.50 for acceptance.\"\n  -\
    \ n_violations_processed:\n      principle: \"Total violations across both sessions. Must be >= 10\
    \ for meaningful cache.\"\n  - tier2_learning_enabled:\n      principle: \"True if cross-session\
    \ cache was loaded in session 2. Proves bidirectional flow.\"\n  - random_seed:\n      principle:\
    \ \"Must be 42.\"\n  - duration_s:\n      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n\
    \      principle: \"Records sqlite3, nsvif module, telemetry checks.\"\n\nACCEPTANCE GATES:\n  -\
    \ condition: \"constraint_memory_implemented == true\"\n    principle: \"Cache must be implemented\
    \ and running — not just described.\"\n  - condition: \"cross_session_retention_rate >= 0.50\"\n\
    \    principle: \"50% retention demonstrates meaningful cross-session learning (FR-11 Tier 2 gate).\"\
    \n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

- id: exp2464-crane-balanced-constraint-integration
  title: 'Phase 2: CRANE Balanced Constraint Integration (arXiv:2502.09061, ICML 2025) -- FST PATH A Balance Ratio'
  milestone: 2026.05.238
  deliverable: results/experiment_2464_crane_balanced_constraint.json
  agent_type: codex
  model: gpt-5.5
  max_turns: 40
  prior_failures:
  - experiment_id: exp2442-fst-mcmc-energy-fix-v3
    verdict: complete_fst_mcmc_energy_fixed=True
    addressed_by: "exp2442 (.237) fixed the FST MCMC energy computation (fst_mcmc_energy_fixed=True).
      exp2464 is DIFFERENT scope: CRANE (arXiv:2502.09061) introduces a balance_ratio parameter
      between constrained and unconstrained decoding. exp2442 was a bug fix for MCMC energy;
      exp2464 adds a new parameter to the pipeline that balances constrained/unconstrained generation
      to avoid the constraint-induced reasoning degradation that CRANE's ICML 2025 paper identifies.
      Different mechanism (balance_ratio vs energy fix) and different deliverable."
    retire_if_same_verdict: false
  prompt: "CONTEXT: CRANE (arXiv:2502.09061, ICML 2025) 'Reasoning with Constrained LLM Generation'\nshows\
    \ that PURE constraint enforcement degrades reasoning quality — the model loses fluency\nbecause\
    \ it can't explore the unconstrained space. CRANE balances constrained and unconstrained\n\
    generation by introducing a balance_ratio (fraction of tokens constrained vs free). At\nbalance_ratio=0.7\
    \ (70% constrained, 30% free), CRANE achieves +10pp on symbolic benchmarks\nvs 100% constrained.\n\
    \nCarnot's FST PATH A pipeline currently runs pure constrained sampling (balance_ratio=1.0).\nThis\
    \ task adds balance_ratio as a parameter and benchmarks:\n  balance_ratio=1.0 (current: pure constrained)\n\
    \  balance_ratio=0.7 (CRANE recommendation)\n  balance_ratio=0.5 (equal mix)\n\nThe ODAR router\
    \ (exp2455, odar_routing_implemented=True) already implements free-energy-based\niteration selection.\
    \ CRANE's balance_ratio is orthogonal — it operates at the token level within\neach iteration, not\
    \ at the iteration-selection level.\n\nEXISTING CODE TO READ FIRST:\n  {project_root}/python/carnot/pipeline/verify_repair.py\
    \ (current FST PATH A pipeline)\n  {project_root}/python/carnot/pipeline/odar_router.py (ODAR routing,\
    \ from exp2455)\n  {project_root}/results/experiment_2442_fst_mcmc_energy_fix_v3.json (energy fix\
    \ result)\n\nTASK: Add balance_ratio parameter to FST pipeline; benchmark 3 ratios on 20 telemetry\
    \ entries.\n\nCONCRETE STEPS:\n  0. PRECONDITIONS:\n     a. verify_repair.py exists:\n        ls\
    \ {project_root}/python/carnot/pipeline/verify_repair.py\n        If missing: write honest_verdict\
    \ blocked_pipeline_module_missing and exit.\n     b. numpy importable: .venv/bin/python -c \"import\
    \ numpy; print(numpy.__version__)\"\n\n  1. Add balance_ratio parameter to VerifyRepairPipeline:\n\
    \     Add __init__ parameter: balance_ratio: float = 1.0 (default = pure constrained, backward compat)\n\
    \     Add get_balance_ratio() method: returns self.balance_ratio\n     When balance_ratio < 1.0:\
    \ randomly skip constraint check with probability (1 - balance_ratio)\n       i.e., for each verification\
    \ call: if random.random() > balance_ratio: return baseline_score\n     When balance_ratio == 1.0:\
    \ always apply constraint (original behavior)\n\n  2. Benchmark 3 ratios on 20 telemetry entries:\n\
    \     For each ratio in [1.0, 0.7, 0.5]:\n       Run pipeline with that ratio on 20 entries from\
    \ telemetry manifest.\n       Measure:\n         constraint_satisfaction_rate: fraction of entries\
    \ where constraint was applied\n         energy_mean: mean energy score across 20 entries\n       \
    \  verdict_confidence: mean |score - 0.5| (higher = more confident predictions)\n\n  3. Select best\
    \ balance_ratio:\n     best_balance_ratio: the ratio with highest verdict_confidence (most discriminative)\n\
    \     crane_improvement: verdict_confidence[best] > verdict_confidence[1.0]\n\n  4. Unit test:\n\
    \     PYTEST_ADDOPTS=\"\" .venv/bin/python -m pytest tests/python/pipeline/ -k \"balance_ratio or\
    \ crane\" -v --no-cov 2>&1 | tail -15\n     Create test if none exists.\n\n  5. Write deliverable.\
    \ Validate JSON before writing.\n\nREQUIRED ARTIFACT FIELDS:\n  - honest_verdict:\n      principle:\
    \ \"Terminal-prefix required.\"\n  - balance_ratio_implemented:\n      principle: \"True if balance_ratio\
    \ parameter was added to VerifyRepairPipeline. Core deliverable.\"\n  - best_balance_ratio:\n    \
    \  principle: \"The ratio (1.0, 0.7, or 0.5) with highest verdict_confidence. Documents CRANE\
    \ effect.\"\n  - crane_improvement:\n      principle: \"True if best_balance_ratio < 1.0 achieves\
    \ higher verdict_confidence than 1.0 (pure constrained).\"\n  - n_eval_examples:\n      principle:\
    \ \"Must be 20 per ratio (60 total).\"\n  - random_seed:\n      principle: \"Must be 42.\"\n  - duration_s:\n\
    \      principle: \"Guards against fabrication.\"\n  - preconditions_checked:\n      principle: \"\
    Records verify_repair module, numpy checks.\"\n\nACCEPTANCE GATES:\n  - condition: \"balance_ratio_implemented\
    \ == true\"\n    principle: \"balance_ratio must be in the pipeline codebase — not just described.\"\
    \n\nDo NOT push. Do NOT modify scripts/research_conductor.py."

