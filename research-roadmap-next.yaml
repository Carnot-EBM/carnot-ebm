milestone: 2026.06.434
planned_by: >-
  outer-loop (Claude Opus 4.8 planner, 2026-06-24). .433 was the 9th consecutive
  bridge_crossed_for_solve=FALSE milestone (A3 banked +1, 61->62; first-win FLAT at 0.04 across every arm), BUT its
  A1 perception diagnostic (exp4700) produced the most decisive new input in months:
  perception_is_the_wall=TRUE -- an object-centric/relational representation makes the winning L1 trajectory FULLY
  PROPOSABLE (object_centric_coverage=1.0 vs order1_coverage=0.75, delta +0.25), where eight prior milestones of
  levers (all conditioning on order-1 perception at LOO=0.503=chance) could not. The winner is now PRESENT in the
  pool. BUT the deployable arm still banked no level (generic_agent_reached_level=0) because the winner sits at
  rank 59,161 of 186 -- residual offpath_calibration_insufficient. The L1 wall has SPLIT in two: LAYER-1 perception
  / proposability (SOLVED -- the object-centric primitive object_centric_representation_builder_operator ships it)
  and LAYER-2 surfacing / ranking (OPEN -- the winner is present but buried). .434 attacks LAYER-2 (A2: an
  off-path-calibrated ORACLE-DISTINCT verifier/value ranker over the object-centric coverage-1.0 pool surfaces the
  present winner from rank 59 -> actionable top-k -- the verifier earns its place per north-star) and BANKS the
  perception win as a multi-level solve (A1 HEADLINE: lp85 L1->L2 via a PERCEPTION-GROUNDED STRUCTURAL-ALIGNMENT
  GOAL over detected objects -- operator 2026-06-25 "yes" pre-stage). Plus A4 the CORRECTED goal-free
  online-action-learning DRIVER (coordinate-head-proposes-clicks, bug-fixed Go-Explore + CNN -- operator 2026-06-24
  leader-gap; the .433 attempt tested DEAD CODE), A3 self-play banks +1 (62->63) + trains the verifier, A5 held-out
  first-win readiness, A6 persist, A7 integration, 2 infra (B1 SILENT-BUG AUDIT of the .428-.433 nulls -- operator
  2026-06-25 mandate, two .433 nulls tested dead code; B2 adversarial_verify lever-exercise-evidence guard), 1
  hardware (C KV260), 1 SOTA-ingestion (D, the .435 fallback), capstone (E). verifier_is_oracle:false on every
  value claim; solve_provenance on every ARC solve; submission operator-only. ARC Prize Milestone #1 deadline
  2026-06-30 (6 days).
milestone_title: 'THE L1 WALL SPLIT IN TWO -- perception SOLVED (winner proposable at coverage 1.0), SURFACING is
  the new bottleneck (winner present at rank 59 but unselectable). .433 was the 9th-consecutive bridge-not-crossed
  milestone but its A1 diagnostic settled the 8-milestone perception-vs-search question: perception_is_the_wall=TRUE.
  .434 (A2) SURFACES the present-but-buried winner via an off-path-calibrated ORACLE-DISTINCT verifier/value ranker
  over the object-centric coverage-1.0 pool (the verifier earns its place), and (A1 HEADLINE) BANKS the perception
  win as lp85 L1->L2 via a PERCEPTION-GROUNDED STRUCTURAL-ALIGNMENT goal over detected objects (operator 2026-06-25
  "yes"). Plus A4 the CORRECTED goal-free online-action-learning DRIVER (operator 2026-06-24 leader-gap; the .433
  attempt tested DEAD CODE), A3 self-play +1 (62->63) + verifier train, A5 held-out readiness, A6 persist, A7
  integration, 2 infra (B1 SILENT-BUG AUDIT of the .428-.433 nulls + B2 lever-exercise-evidence guard), 1 hardware
  (C KV260), 1 SOTA-ingestion (D), capstone (E). 6 days to the ARC Prize Milestone #1 deadline (2026-06-30).'
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
theme: >-
  The .433 A1 perception diagnostic (exp4700) settled the 8-milestone perception-vs-search ambiguity:
  perception_is_the_wall=TRUE. An object-centric/relational representation makes the winning L1 trajectory FULLY
  PROPOSABLE (coverage 1.0 vs order-1's 0.75) where every prior lever -- all conditioning on order-1 perception at
  LOO=chance -- could not. The winning candidates are now PRESENT in the proposal pool. But the .433 deployable arm
  still reached level 0: the winner sits at rank 59,161 of 186 and the explorer's value calibration cannot surface
  it (residual offpath_calibration_insufficient). The L1 first-contact wall has decomposed into TWO layers --
  perception/proposability (SOLVED in principle) and surfacing/ranking (the new, verifier-shaped bottleneck). .434
  attacks both halves with three genuinely independent ARC levers, all on the SCORED E3AgentPolicy, all
  verifier_is_oracle:false, all live-path-reachable: A1 (HEADLINE) converts the perception win into a banked
  multi-level SOLVE -- lp85's L2 is_level_complete expressed as a STRUCTURAL ALIGNMENT predicate over DETECTED
  objects (the .433 A1 representation) computed from ONE live frame, wired into level_up_reinduction (operator
  2026-06-25 "yes"); A2 SURFACES the present-but-buried winner -- an off-path-calibrated ORACLE-DISTINCT
  verifier/value ranker over the object-centric coverage-1.0 proposal pool lifts the rank-59 winner to actionable
  top-k (the north-star verifier-as-router earning its place; the prior selection nulls were on the order-1 pool
  where the winner was ABSENT); A4 runs the CORRECTED goal-free online-action-learning DRIVER (coordinate-head-
  proposes-clicks + bug-fixed Go-Explore archive + bug-fixed CNN; A/B {frozen, online-scratch, online-warm} --
  operator 2026-06-24 leader-gap; the .433 attempt nulled on DEAD CODE). A3 banks +1 (62->63) + trains the verifier
  (Level-Up Guarantee + self-play-every-milestone). A5 the held-out first-win readiness lane. A6 persist+transfer.
  A7 SUBMITTED_AGENT_CONFIG integration. INFRA: B1 the operator-mandated SILENT-BUG AUDIT of the .428-.433
  generation-lever nulls (two tested dead code -- the Go-Explore (1,64,64) archive + the exp4710 CNN dict-candidate
  bug; some "closed" nulls may need reopening), B2 an adversarial_verify lever-exercise-evidence guard that
  mechanizes the silent-dead-code catch + the perception-overclaim guard. C KV260 hardware continuity. D
  SOTA-ingestion (the .435 fallback: active-probe/hypothesis-driven world-model induction). E capstone. RETIRED (do
  NOT re-propose): the .433 A1 deployable object-centric arm AS-BUILT (offpath_calibration_insufficient -- A2
  changes the mechanism to a dedicated off-path-calibrated verifier/ranker); the .430 single-exemplar L2-goal-fix
  (single_exemplar_goal_insufficient -- A1 uses a STRUCTURAL predicate over detected objects); goal-free Go-Explore
  as a standalone L2 solver; any A5 readiness claim that cites the replay-package level count as "the leaderboard
  score"; re-running the .433 amortized-exploration / online-action-learning nulls VERBATIM (they tested dead code).
  6 days to the ARC Prize Milestone #1 deadline (2026-06-30).
sprint_forcing_function: "ARC-AGI-3 submission sprint through 2026-06-30 (CLAUDE.md). Majority ARC (A1-A7); >=1
  level-up attempt that BANKS a new reproducible level (ARC Level-Up Attempt Guarantee, A1 lp85 L2 + A3 rotated
  game); self-play EVERY milestone (A3 trains+checkpoints the verifier); 2 reserved infra (B1/B2); 1 per-board
  hardware (C); 1 SOTA-ingestion (D). All experiments codex/gpt-5.5; planner/retro stay Claude Opus. 6 days to the
  ARC Prize Milestone #1 deadline ($25K). The frozen live generator is Qwen3.5-9B-MTP on the iGPU (NEVER the
  3090s); A1/A2/A4 arms that induce/strategize via the LLM declare live_llm_inference for that arm only and
  construct the proposer on a FREE port + /props-verify Qwen (the port-8919 gemma-squat confound)."

