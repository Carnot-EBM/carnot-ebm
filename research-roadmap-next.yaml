- id: exp1453-112-scope-reduction-activation-manifest
  milestone: 2026.04.112
  deliverable: results/experiment_1453_112_scope_reduction_activation_manifest.json
  title: ".112 Scope-Reduction Activation Manifest — Convert .111 Retro + Known-Issues Directive into Execution Rules"
  agent_type: codex
  model: gpt-5.5
  max_turns: 20
  estimated_wall_time_min: 20
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  scope_reduction_task: true
  prior_failures:
    - experiment_id: exp1452-milestone-111-retrospective
      verdict: milestone_111_10_of_14_criteria_met_threshold_not_met_live_sota_runtime_gate_blocked_repair_scale_carry_forward
      addressed_by: "This task converts the .111 terminal retro and active scope-reduction known issue into a concrete .112 execution manifest before implementation begins."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Milestone .111 completed below threshold with 10 of 14 criteria met. The
    active ops/known-issues.md scope-reduction directive requires the next
    milestone to allocate at least 8 tasks to reducing scope rather than adding
    new lineages. Use {project_root} as the project root and {date} as the run
    date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - ops/known-issues.md
    - results/experiment_1452_milestone_111_retro.json
    - openspec/change-proposals/research-roadmap-vNEXT.md
    - research-roadmap-next.yaml
    - ops/exclusion_manifest.yaml

    TASK:
    Write a .112 scope-reduction activation manifest and terminal artifact that
    maps every mandatory scope-reduction requirement to a concrete .112 task,
    records live-SOTA runtime carry-forward rules, and forbids exact noise-line
    expansion.

    REQUIRED ARTIFACT FIELDS:
    - status
    - milestone
    - prior_milestone
    - scope_reduction_required
    - required_scope_reduction_task_count
    - planned_scope_reduction_task_count
    - scope_reduction_manifest_path
    - planned_scope_task_ids
    - carryforward_from_111
    - forbidden_exact_expansions
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1453_112_scope_reduction_activation_manifest.json immediately with status="in_progress".
    2. Read exp1452 and the scope-reduction known-issues entry; extract every mandatory scope item and live-SOTA repair carry-forward blocker.
    3. Write ops/milestone_112_scope_reduction_manifest.md with requirement, mapped task id, deliverable path, acceptance field, and retire/block rule.
    4. Explicitly forbid new GRPO v15, new WOPR puzzle cartridges, new HardNet++/DSP variants, and broad new comparator/hardware branches during .112.
    5. Confirm research-roadmap.yaml and scripts/research_conductor.py are unchanged.
    6. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1453_112_scope_reduction_activation_manifest.json')); print(d.get('scope_reduction_required'), d.get('planned_scope_reduction_task_count'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1454-experiment-artifact-signal-noise-classifier
  milestone: 2026.04.112
  deliverable: results/experiment_1454_experiment_artifact_signal_noise_classifier.json
  title: "Experiment Artifact Signal/Noise Classifier — Classify 1,400+ Results and Top-50 Noise Candidates"
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 75
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  scope_reduction_task: true
  prior_failures:
    - experiment_id: ops-known-issues-2026-05-06-scope-reduction
      verdict: active_scope_reduction_directive_not_satisfied_by_milestone_111
      addressed_by: "This task implements mandatory scope item A by classifying all result artifacts before more lineages are proposed."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    Carnot has accumulated more than 1,400 experiment artifacts. The .112
    milestone needs a concrete SIGNAL / NOISE / AMBIGUOUS ledger before
    deciding what to preserve, retire, or escalate. Use {project_root} as the
    project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - ops/milestone_112_scope_reduction_manifest.md
    - research-complete.yaml
    - results/experiment_1452_milestone_111_retro.json
    - ops/exclusion_manifest.yaml
    - results/

    TASK:
    Walk all results/experiment_*.json artifacts and produce a reproducible
    classification table that labels each artifact SIGNAL, NOISE, or AMBIGUOUS
    using transparent heuristics based on verdicts, headline eligibility,
    gates, retirements, and artifact fields.

    REQUIRED ARTIFACT FIELDS:
    - status
    - artifacts_scanned
    - classification_table_path
    - summary_path
    - signal_count
    - noise_count
    - ambiguous_count
    - top_50_noise_candidates
    - heuristic_version
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1454_experiment_artifact_signal_noise_classifier.json immediately with status="in_progress".
    2. Build a small deterministic scanner under scripts/ or use an inline one-off command if no persistent helper is needed; do not modify scripts/research_conductor.py.
    3. Scan every results/experiment_*.json file and extract experiment id, title if available, honest_verdict, status, headline flags, gate/retirement fields, and key metric fields.
    4. Write ops/experiment_signal_noise_classification.csv with one row per artifact and a reason column.
    5. Write ops/experiment_signal_noise_summary.md with counts, top-50 noise candidates, top signal candidates, and ambiguous operator-decision items.
    6. Keep the heuristic conservative: never classify missing-tool or environmental blockers as scientific NOISE without a reason.
    7. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1454_experiment_artifact_signal_noise_classifier.json')); print(d.get('artifacts_scanned'), d.get('signal_count'), d.get('noise_count'), d.get('ambiguous_count'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp1455-known-issues-mandatory-priority-audit
  milestone: 2026.04.112
  deliverable: results/experiment_1455_known_issues_mandatory_priority_audit.json
  title: "Known-Issues Mandatory Priority Audit — Trim Active Priority List to 10 or Fewer"
  agent_type: codex
  model: gpt-5.5
  max_turns: 30
  estimated_wall_time_min: 45
  priority: critical
  requires_gpu: false
  skip_pre_test: true
  scope_reduction_task: true
  prior_failures:
    - experiment_id: ops-known-issues-2026-05-06-scope-reduction
      verdict: active_priority_list_contains_26_plus_entries_and_preempts_new_lineages
      addressed_by: "This task implements mandatory scope item D by auditing active priority entries and creating a short current-priority index without deleting historical context."
      retire_if_same_verdict: false
  prompt: |
    CONTEXT:
    ops/known-issues.md has accumulated many mandatory-priority entries. The
    scope-reduction directive requires a clean active priority list with 10 or
    fewer entries and at least a 40% reduction. Use {project_root} as the
    project root and {date} as the run date.

    EXISTING CODE TO READ FIRST:
    - CODEX.md
    - CLAUDE.md
    - ops/known-issues.md
    - ops/milestone_112_scope_reduction_manifest.md
    - ops/experiment_signal_noise_summary.md
    - openspec/change-proposals/research-roadmap-vNEXT.md

    TASK:
    Audit mandatory known-issues priorities, decide which remain active,
    superseded, consolidated, parked, or retired, and write a concise active
    priority index. Preserve historical entries; do not silently delete audit
    history.

    REQUIRED ARTIFACT FIELDS:
    - status
    - initial_priority_count
    - active_priority_count
    - trim_fraction
    - priority_audit_path
    - known_issues_updated
    - active_priorities_index_path
    - retired_or_consolidated_priorities
    - honest_verdict

    CONCRETE STEPS:
    1. Create results/experiment_1455_known_issues_mandatory_priority_audit.json immediately with status="in_progress".
    2. Count all active NEW/MANDATORY priority entries in ops/known-issues.md and record the initial count.
    3. Write ops/mandatory_priority_audit.md with one row per active priority and status: keep, consolidate, superseded, parked, or retire.
    4. Add or update a short current-active-priorities section in ops/known-issues.md or ops/active-priorities.md with 10 or fewer active items.
    5. Do not remove historical text unless it is clearly duplicate generated noise; prefer marking superseded and linking to the audit.
    6. Verify the active count is <= 10 and trim_fraction >= 0.40.
    7. Write all required artifact fields with status="complete".

    Run command: python3 -c "import json; d=json.load(open('results/experiment_1455_known_issues_mandatory_priority_audit.json')); print(d.get('initial_priority_count'), d.get('active_priority_count'), d.get('trim_fraction'), d.get('honest_verdict'))"
    Do NOT push. Do NOT modify scripts/research_conductor.py.

