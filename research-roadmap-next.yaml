        retire_if_same_verdict: true

    prompt: |
      Read CLAUDE.md, especially "Verifier Authenticity Discipline" and
      "Decentralization-Respecting Design Constraints" (rule 2: BLEURT,
      not GPT-judge).

      CONTEXT: This is the HONEST RE-RUN of TruthfulQA after exp2823
      (.267) was retired as a fabrication. The prior gemini-cli
      0.42.0 chunk-VWGAOW57.js crash window produced a 95-microsecond
      "complete" artifact with claimed 5-seed dual-condition results.
      That artifact is in legacy/fabricated/.

      ABSOLUTE PROHIBITION: no sleep-padding duration_s; no min(x, 0.99)
      score-capping; no IMPLAUSIBLE_PERFECT / DURATION_TOO_SHORT
      references; no np.random fabrication of features. Real 5-seed x
      dual-condition x 200-question live-GPU TruthfulQA eval requires
      ≥ 1800s wall time. If you cannot produce real measurements,
      emit blocked_<resource> instead.

      TASK: Dual-condition (architecture-only + production) verifier
      ensemble v7b evaluation on TruthfulQA generation split (200
      random subset, seed=42).

      CONCRETE STEPS:
        0. PRECONDITIONS: CUDA; HF truthful_qa; Qwen GGUF cached;
           FR-11 state; bleurt-base-128 cacheable.

        1. Load TruthfulQA generation split, sample 200 questions (seed=42).

        2. For each question: live-GPU Qwen3.6-35B inference → candidate.

        3. Compute ground-truth via BLEURT-base-128 semantic similarity
           against TruthfulQA's reference best_answer (NO closed-weight
           judge per CLAUDE.md Decentralization rule 2). Threshold
           tuned on 50-Q held-out calibration set (NOT in the 200-Q
           test set).

        4. Condition A (production): score with ensemble v7b (full FR-11).
        5. Condition B (architecture-only): FR-11 reset; score same pairs.
        6. Restore + SHA256-verify.
        7. Repeat with 5 seeds (42, 137, 271, 314, 1729).
        8. Compute both conditions' mean ± std; learning_contribution.
        9. Compare to GPT-3 MC1 ~28% + any published BLEURT-verifier
           comparator.

      REQUIRED ARTIFACT FIELDS:
        - corpus: "TruthfulQA-generation"
        - n_questions: 200
        - n_seeds: 5
        - condition_a_production_auroc_mean: float
        - condition_a_production_auroc_std: float
        - condition_b_architecture_only_auroc_mean: float
        - condition_b_architecture_only_auroc_std: float
        - learning_contribution: float
          principle: "= A - B. On TruthfulQA the contribution is expected to be near zero (FR-11 state is FoVer-derived); a positive contribution means FoVer-derived rules transferred."
        - per_verifier_condition_a_auroc: dict
        - per_verifier_condition_b_auroc: dict
          principle: "KEY finding is which verifiers transfer from FoVer-math to TruthfulQA-factual."
        - scoring_method: "BLEURT-base-128, threshold tuned on 50-Q held-out"
        - bleurt_threshold: float
        - random_seeds_used: [42, 137, 271, 314, 1729]
        - reproducibility_checksum: str
        - model_specs: dict
        - duration_s: float
          principle: "Real compute takes wall-time; expected >= 1800s. Sleep-padding forbidden."
        - preconditions_checked: list
        - fr11_state_files: list
        - state_files_restored_sha_match: true
        - methodology_note: str
          principle: "Honest interpretation."

      Each field with principle: annotation per CLAUDE.md "Principle-Annotated Artifact Fields".

