  - id: exp4545-a2
    milestone: 2026.06.420
    title: 'PHASE A2 (ARC NORTH STAR; operator MANDATORY; ORACLE-DISTINCT MOAT) -- richer cross-game
      verifier features (relational / Δframe / action-conditioned / predicate-distance) -> re-run the
      DiscriminativeVerifier LOO-AUROC gate (currently in-sample 0.726 but LOO 0.503 == chance). Gate:
      LOO-AUROC STRICTLY > 0.5 with CI excluding 0.5 + positive control + FALSE_NEGATIVE_RISK.
      verifier_is_oracle: false.'
    priority: high
    track: arc-north-star
    max_turns: 130
    agent_type: codex
    model: gpt-5.5
    inference_substrate: verifier_ensemble_against_cached_candidates
    deliverable: results/experiment_4545_cross_game_discrimination_v3.json
    operator_override: '2026-06-19 operator directive (GAP-ARCH-FEATURES, ops/known-issues.md
      MANDATORY-NEXT-MILESTONE, "all three" step-back audit): explicitly mandated -- add relational/
      Δframe/action-conditioned/predicate-distance features (cross_game_features_v3) and re-run the
      --discriminative LOO-AUROC gate; "highest-leverage verifier research item." False-positive
      fuzzy-token scope-match vs the RETIRED cross-game VALUE-transfer exps (exp4318/4331/4342) -- this is
      cross-game DISCRIMINATION (LOO-AUROC of a verifier), NOT learned value-function transfer; different
      technique, falsifiable gate, operator-authorized. Not a doomed rerun.'
    prompt: |
      CONTEXT ({date}, ARC sprint; the ORACLE-DISTINCT verifier moat -- north-star §5's OPEN claim). The
      cross-game DiscriminativeVerifier is in-sample 0.726 but LOO-AUROC 0.503 == chance: frame-only
      order-1 features do NOT transfer (GAP-ARCH-FEATURES, 2026-06-19 operator audit, "highest-leverage
      verifier research item"). The verifier's whole value-add is whether it can discriminate good from
      bad on a game it NEVER saw -- the oracle-distinct claim (vs a circular execution oracle).

      EXISTING CODE TO READ FIRST:
        - {project_root}/python/carnot/agentic/arc_value_learner.py (cross_game_features ~27, cross_game_features_v2 ~50, cross_game_features_v3 ~394, DiscriminativeVerifier ~497)
        - {project_root}/python/carnot/agentic/arc_cross_game_verifier_train.py (the --discriminative LOO-AUROC harness)
        - {project_root}/ops/verifier_gaps.md (GAP-ARCH-FEATURES backlog entry)
        - {project_root}/ops/verifier_registry.yaml (the verifiers we HAVE; a filled gap moves here)

      TASK: add relational / Δframe (frame-to-frame delta) / action-conditioned / predicate-distance
      features to cross_game_features_v3 (extend it; do NOT delete v1/v2), retrain the DiscriminativeVerifier,
      and re-run the LEAVE-ONE-GAME-OUT AUROC gate. The verifier is oracle-DISTINCT (verifier_is_oracle:
      false): it ranks candidates by a learned signal, NOT by running the executable win-check.

      CONCRETE STEPS:
        0. PRECONDITIONS: `.venv/bin/python -c "from carnot.agentic import arc_value_learner"` exits 0 AND the cached cross-game candidate corpus is present (the harness's training data). Missing -> blocked_<resource>, EXIT. (--no-cov on focused pytest.)
        1. Implement the richer features (relational/Δframe/action-conditioned/predicate-distance) in cross_game_features_v3. Retrain the DiscriminativeVerifier on the cached cross-game corpus.
        2. Run the LOO-AUROC gate (arc_cross_game_verifier_train.py --discriminative): hold out each game, train on the rest, score AUROC on the held-out game; report mean LOO-AUROC + a bootstrap CI. The WIN: mean LOO-AUROC STRICTLY > 0.5 with the CI excluding 0.5.
        3. POSITIVE CONTROL + FALSE_NEGATIVE_RISK: an in-sample AUROC (train==test) must be clearly > 0.5 (proves the features + labels carry signal at all); a LOO null is valid ONLY if this in-sample control passed (else the harness is silently broken, not the features). If LOO stays at chance, report the HONEST NULL + which feature family moved in-sample-but-not-LOO (the actionable refinement).
        4. If a NEW verifier capability is demonstrated (LOO > chance), log it as a filled entry candidate in ops/verifier_gaps.md (GAP-ARCH-FEATURES) + note in ops/verifier_registry.yaml. If it stays at chance, append a sharpened missing_verifier_gap (what discriminator is still missing).

      REQUIRED ARTIFACT FIELDS (principle-annotated):
        honest_verdict:
          principle: "terminal prefix; success: cross_game_discrimination_loo_auroc_<n>_above_chance OR complete: cross_game_discrimination_still_chance_gap_sharpened_honest_null."
        inference_substrate:
          principle: "verifier_ensemble_against_cached_candidates -- scores cached candidate features, no LLM load (1s floor)."
        verifier_is_oracle:
          principle: "MUST be false -- the DiscriminativeVerifier ranks by a LEARNED signal, oracle-DISTINCT from the executable win-check; a circular win does not count (Circularity / Oracle-Distinctness Discipline)."
        loo_auroc_mean:
          principle: "the HEADLINE -- mean leave-one-game-out AUROC; > 0.5 with CI-excl-0.5 is the only non-circular cross-game discrimination evidence."
        loo_auroc_ci:
          principle: "bootstrap CI on the LOO AUROC; a claim above chance requires the CI to exclude 0.5 (the .419-class FALSE_NEGATIVE_RISK guard against a small-sample artifact)."
        in_sample_auroc:
          principle: "the POSITIVE CONTROL -- train==test AUROC; must be > 0.5 or the harness is broken and a LOO null is uninformative."
        feature_families_added:
          principle: "the relational/Δframe/action-conditioned/predicate-distance families added to v3 -- traceable to the GAP-ARCH-FEATURES spec."
        positive_control_passed:
          principle: "in-sample AUROC > 0.5; guards a silently-broken harness."
        false_negative_risk_checked:
          principle: "a LOO null is valid only if the in-sample positive control passed."
        missing_verifier_gaps:
          principle: "if LOO stays at chance, the sharpened discriminator still missing (Missing-Verifier Gap Logging) -- the input to the verifier-build backlog."
        random_seed:
          principle: "determinism precondition for reproducibility."
        reproducibility_checksum:
          principle: "catches silent corpus drift on replay."
        preconditions_checked:
          principle: "records resources verified; pre-empts missing-resource fabrication."

      Run: cd {project_root} && .venv/bin/python python/carnot/experiment_4545_cross_game_discrimination_v3.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

