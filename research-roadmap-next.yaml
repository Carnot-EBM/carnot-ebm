      GATE_PASSED_WITHOUT_DATA). Plus .175 has exp1715/1716 in-flight at
      time of audit; may have new artifacts to classify.

      FALSIFIABLE HYPOTHESIS: Of the ~19 audited artifacts, each flag
      is either REAL_BUG, FALSE_POSITIVE, or NEEDS_REVISION. Classify
      each, append corrigenda fields (CLAUDE.md no-pruning: ADD don't
      modify original), and surface any REAL_BUG findings as .177+
      task proposals in known-issues.

