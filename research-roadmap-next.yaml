      - results/experiment_340_live_precision_benchmark.json — live responses to use (if present)
      - results/experiment_331_fp_autopsy.json — FP taxonomy (VALID_INTERMEDIATE, CORRECT_STEP, etc.)
      - results/experiment_311_extractor_benchmark.json — Exp 311 synthetic results for comparison

