    encode each arithmetic step as a state-action-state PDDL transition, verify that each
    transition is a valid plan step using a PDDL planner. This generates ~1M labels
    automatically without human annotation.

    For GSM8K word problems, PDDL encoding is:
    - State: {quantity_name: value} dict for all named quantities in the problem
    - Action: an arithmetic operation that updates one quantity (e.g., "add 3 apples")
