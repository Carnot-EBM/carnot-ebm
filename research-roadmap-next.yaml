          inherit a fabrication exclusion that was already corrected same-day."
      inference_substrate:
        value: aggregation_from_upstream_artifacts
        principle: "This task reads/reconciles upstream JSON; it does not invoke an LLM or run new compute."
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_ per Verdict Terminal-Prefix Discipline."

