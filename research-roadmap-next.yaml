      and is fragile to subsumption by a strong reasoner. The moat survives iff Carnot's ensemble
      catches step-errors that a strong reasoner's OWN self-verification misses (high residual catch
      rate), NOT merely if it matches AUROC. THIS TASK runs that scissor-plot test:
      take a strong SOTA reasoner as the "subsumer", get its self-verification verdicts on a
      step-labeled corpus, and measure the residual errors Carnot catches. Framing:
      [[reference_deep_think_post_bounded_2026_06]] (P2 scissor-plot), Hard2Verify (arXiv:2510.13744)
      for a contamination-resistant harder corpus if FoVer is too easy.

      MODEL_SPECS (CLAUDE.md SOTA-model mandate): use `unsloth/Qwen3.6-35B-A3B-GGUF` (flagship MoE)
      as the strong-reasoner subsumer. Load via the .gguf PATH using the llama.cpp loader
      (Gemma4QuantizedLoader/llama_cpp Llama(model_path=...)) — do NOT call AutoTokenizer on the GGUF
      repo id (the GGUF tokenizer rule; the embedded tokenizer is read by llama.cpp).

      EXISTING CODE TO READ FIRST:
        - python/carnot/verify/ (the ensemble whose residual catch is measured)
        - results/experiment_2837* / the frozen FoVer step-labeled corpus
        - scripts/experiment_template.py (cached_sota_pair, setup_gpu prewarm, BatchedInferenceRunner)
        - research-references.md (.351: 2510.13744 Hard2Verify)

