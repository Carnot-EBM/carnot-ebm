milestone: 2026.05.133
milestone_title: "Phase-10 Continuous Self-Learning, EqM System-2 Sampling, and KANELÉ Hardware"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"
tasks:
  - id: exp1722-fouriercsp
    title: "Exp 1722: FourierCSP Extractor Prototype"
    deliverable: results/experiment_1722_fouriercsp.json
    max_turns: 50
    prompt: |
      CONTEXT: Milestone .133 Phase 1. We are incorporating FourierCSP (continuous optimization for CSPs via generalized Walsh-Fourier transform) to replace our legacy discrete constraint extractor.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/constraint_extractor.py
      TASK: Implement `FourierCSPExtractor` that maps natural language constraints to a multilinear polynomial representation.
      CONCRETE STEPS:
      1. Create `{project_root}/python/carnot/pipeline/fouriercsp_extractor.py`.
      2. Implement the mathematical mapping described in FourierCSP.
      3. Create `{project_root}/scripts/experiment_1722_fouriercsp.py` to evaluate it on a small sample of constraint templates.
      4. Use at least one of the mandated SOTA GGUF models (`unsloth/Qwen3.6-35B-A3B-GGUF`, etc.) for generating initial NL constraints to parse.
      5. Write results to `{project_root}/results/experiment_1722_fouriercsp.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1723-cikan-init
    title: "Exp 1723: Constraint-Informed KAN (CIKAN) Initialization"
    deliverable: results/experiment_1723_cikan.json
    agent_type: codex
    max_turns: 50
    prompt: |
      CONTEXT: Integrating Constraint-Informed KANs (CIKAN) to structurally enforce physical and logical constraints directly within the network architecture.
      EXISTING CODE TO READ FIRST: python/carnot/models/kan_verifier.py
      TASK: Implement the CIKAN architecture.
      CONCRETE STEPS:
      1. Create `{project_root}/python/carnot/models/cikan_verifier.py`.
      2. Implement the CIKAN class, allowing constraints from FourierCSP to act as fixed architectural boundaries.
      3. Create `{project_root}/scripts/experiment_1723_cikan.py` to train it on a toy dataset.
      4. Write results to `{project_root}/results/experiment_1723_cikan.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1724-continuous-updater
    title: "Exp 1724: Continuous Online Updater Prototype"
    deliverable: results/experiment_1724_online_updater.json
    max_turns: 50
    prompt: |
      CONTEXT: Fulfilling the PRD requirement for continuous self-learning. We need to route violation feedback into real-time fine-tuning of the CIKAN models.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/verification_loop.py
      TASK: Implement an online SGD/AdamW updater that adjusts the CIKAN based on verified failures.
      CONCRETE STEPS:
      1. Create `{project_root}/python/carnot/training/online_updater.py`.
      2. Integrate it with `VerificationLoop` to trigger a fine-tuning step whenever a `Violation` occurs.
      3. Create `{project_root}/scripts/experiment_1724_online_updater.py` to test it with a synthetic stream of errors.
      4. Write results to `{project_root}/results/experiment_1724_online_updater.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1725-e2e-fouriercsp-cikan
    title: "Exp 1725: E2E FourierCSP + CIKAN with Feedback"
    deliverable: results/experiment_1725_e2e_cikan.json
    prompt: |
      CONTEXT: Tying together Phase 1 components.
      EXISTING CODE TO READ FIRST: scripts/experiment_1724_online_updater.py
      TASK: Run a live E2E pipeline that generates constraints via SOTA LLMs, parses via FourierCSP, verifies via CIKAN, and self-corrects via the Online Updater.
      CONCRETE STEPS:
      1. Create `{project_root}/scripts/experiment_1725_e2e_cikan.py`.
      2. Instantiate the SOTA model (`unsloth/Qwen3.6-35B-A3B-GGUF` or `unsloth/gemma-4-31B-it-GGUF`).
      3. Execute a 50-problem stream, measuring the adaptation rate.
      4. Write results to `{project_root}/results/experiment_1725_e2e_cikan.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1726-ebt-bridge
    title: "Exp 1726: Energy-Based Transformer (EBT) Bridge"
    deliverable: results/experiment_1726_ebt.json
    prompt: |
      CONTEXT: Phase 2. Bridging our autoregressive LLMs to an Energy-Based Transformer formulation to enable System-2 gradient refinement at inference time.
      EXISTING CODE TO READ FIRST: python/carnot/pipeline/energy_guided_decoder.py
      TASK: Implement an EBT abstraction layer.
      CONCRETE STEPS:
      1. Create `{project_root}/python/carnot/models/ebt_bridge.py`.
      2. Create `{project_root}/scripts/experiment_1726_ebt.py` to wrap the SOTA GGUF models with the EBT abstraction to calculate sequence energy.
      3. Write results to `{project_root}/results/experiment_1726_ebt.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
  - id: exp1727-eqm-sampler
    title: "Exp 1727: Equilibrium Matching (EqM) Gradient Sampler"
    deliverable: results/experiment_1727_eqm.json
    agent_type: codex
    prompt: |
      CONTEXT: Implementing Equilibrium Matching (EqM) to replace standard diffusion/Langevin dynamics for finding optimal constraint-satisfying states.
      EXISTING CODE TO READ FIRST: python/carnot/samplers/langevin.py
      TASK: Implement an EqM sampler.
      CONCRETE STEPS:
      1. Create `{project_root}/python/carnot/samplers/equilibrium_matching.py`.
      2. Implement the equilibrium gradient learning logic.
      3. Create `{project_root}/scripts/experiment_1727_eqm.py` to compare its convergence speed against our standard Langevin sampler.
      4. Write results to `{project_root}/results/experiment_1727_eqm.json`.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'
