milestone: "2026.05.162"
milestone_title: "Continuous Self-Learning, KAN Verification, and Energy-Guided Sampling"
milestone_doc: "openspec/change-proposals/research-roadmap-vNEXT.md"

tasks:
  - id: exp2066-continuous-self-learning-framework
    title: "Exp 2066: Continuous Self-Learning Framework Scaffold"
    deliverable: results/experiment_2066_self_learning.json
    max_turns: 50
    prompt: |
      CONTEXT: The PRD mandates continuous self-learning. We need a framework to orchestrate closed-loop verifier updates.
      EXISTING CODE TO READ FIRST: `_bmad/prd.md`, `python/carnot/pipeline/`.
      TASK: Scaffold the Continuous Self-Learning framework for the EBM verifier.
      CONCRETE STEPS:
      1. Create a `ContinuousLearner` class in `python/carnot/pipeline/`.
      2. Set up the training loop using `unsloth/gemma-4-31B-it-GGUF` for generating trace pairs.
      3. Evaluate the initialization overhead and log to the deliverable JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2067-nested-learning-distillation
    title: "Exp 2067: Nested Learning via Self-Distillation"
    deliverable: results/experiment_2067_nested_distillation.json
    max_turns: 50
    gated_on:
      - upstream: exp2066-continuous-self-learning-framework
        artifact_field: success
        op: "=="
        value: true
    prompt: |
      CONTEXT: Self-distillation over reasoning traces allows continuous improvement.
      EXISTING CODE TO READ FIRST: `python/carnot/models/`.
      TASK: Implement nested learning distillation over failed and successful traces.
      CONCRETE STEPS:
      1. Write the distillation loss function.
      2. Use `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF` via `cached_sota_pair()` to generate 5 trajectory comparisons.
      3. Update verifier weights and measure energy delta. Save to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2068-continuous-verifier-updates
    title: "Exp 2068: Continuous Verifier Updates from Self-Play"
    deliverable: results/experiment_2068_verifier_updates.json
    max_turns: 50
    prompt: |
      CONTEXT: Verifiers must be updated online during self-play generation without catastrophic forgetting.
      EXISTING CODE TO READ FIRST: `python/carnot/models/`.
      TASK: Implement online updates to the Brain EBM verifier during generation.
      CONCRETE STEPS:
      1. Integrate the `ContinuousLearner` into the `Brain` component.
      2. Run 10 steps of self-play generation and verification.
      3. Measure the change in acceptance rate and record to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2069-kan-architecture-scaffold
    title: "Exp 2069: KAN Architecture Scaffold"
    deliverable: results/experiment_2069_kan_scaffold.json
    max_turns: 50
    agent_type: codex
    prompt: |
      CONTEXT: Kolmogorov-Arnold Networks (KANs) use B-splines and offer inherent verifiable structures.
      EXISTING CODE TO READ FIRST: `python/carnot/models/`.
      TASK: Scaffold the base KAN architecture for Carnot.
      CONCRETE STEPS:
      1. Implement a basic `CarnotKAN` module using B-splines in JAX/Flax.
      2. Write a unit test ensuring proper gradient flow.
      3. Save test results and performance metrics to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2070-glorokan-robustness-verification
    title: "Exp 2070: GloroKAN Robustness Verification"
    deliverable: results/experiment_2070_glorokan.json
    max_turns: 50
    prompt: |
      CONTEXT: GloroKAN (Mar 2025) leverages algebraic geometry of B-splines to verify KAN robustness.
      EXISTING CODE TO READ FIRST: `python/carnot/models/`.
      TASK: Implement robustness verification on the `CarnotKAN` using algebraic geometry principles.
      CONCRETE STEPS:
      1. Implement local Lipschitz constant approximation via B-splines.
      2. Verify the robustness of a small synthetic constraint system.
      3. Record the verification bounds to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2071-symbolickan-discrete-embedding
    title: "Exp 2071: Symbolic-KAN Discrete Embedding"
    deliverable: results/experiment_2071_symbolic_kan.json
    max_turns: 50
    prompt: |
      CONTEXT: Symbolic-KAN (Mar 2026) embeds discrete symbolic structures into KANs for interpretable learning.
      EXISTING CODE TO READ FIRST: `python/carnot/models/`.
      TASK: Add discrete symbolic embedding capabilities to `CarnotKAN`.
      CONCRETE STEPS:
      1. Implement hierarchical gating for symbolic primitive discovery.
      2. Train on a simple logic task (e.g., AND/XOR constraints).
      3. Measure the accuracy of discovered symbols and save to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2072-ldsb-diffusion-path-optimization
    title: "Exp 2072: LDSB Diffusion Path Optimization via KAN"
    deliverable: results/experiment_2072_ldsb.json
    max_turns: 50
    agent_type: codex
    prompt: |
      CONTEXT: LDSB (2025/2026) uses KANs to optimize diffusion paths, reducing sampling steps drastically.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/`.
      TASK: Integrate KAN-driven optimization into Carnot's energy sampling process.
      CONCRETE STEPS:
      1. Replace standard sampling steps with an LDSB-inspired continuous path optimizer.
      2. Compare sampling steps required to reach convergence vs baseline.
      3. Log reduction metrics to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2073-fast-autoregressive-latent-generation
    title: "Exp 2073: Fast Autoregressive Latent Generation"
    deliverable: results/experiment_2073_far.json
    max_turns: 50
    prompt: |
      CONTEXT: Constrained generation requires fast latent proposals to feed the energy verifier.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/`.
      TASK: Implement FAR (Fast Autoregressive) generation for latent proposals.
      CONCRETE STEPS:
      1. Implement the FAR generation loop using SOTA models `unsloth/Qwen3.6-35B-A3B-GGUF` and `unsloth/gemma-4-31B-it-GGUF`.
      2. Evaluate latency on 5 reasoning queries.
      3. Record latency improvements to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2074-energy-guided-decoding-scaling
    title: "Exp 2074: Energy-Guided Decoding Scaling"
    deliverable: results/experiment_2074_decoding_scaling.json
    max_turns: 50
    prompt: |
      CONTEXT: We must scale up the energy-guided decoding to complex multi-step reasoning.
      EXISTING CODE TO READ FIRST: `python/carnot/pipeline/`.
      TASK: Scale up the continuous verifier guided decoding to larger constraint problems.
      CONCRETE STEPS:
      1. Apply the LDSB sampling + FAR proposals to a 20-step reasoning problem.
      2. Measure end-to-end decoding time and acceptance rate.
      3. Save metrics to JSON.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

  - id: exp2075-tsu-hardware-sampling-parity
    title: "Exp 2075: TSU Hardware Sampling Parity"
    deliverable: results/experiment_2075_tsu_parity.json
