milestone: 2026.06.414
milestone_title: 'LEAD with the SCORE-DRIVERS the 2026-06-19 step-back gap audit found, not metric-banking:
  (A1) WIRE the stronger generic stack (arc_strategy_router + world-model-DSL) into the SUBMITTED agent
  (today bare BFS, 8/32 in-dist / ~0 OOD) + raise target_levels + forward-edge nav -- the #1 lever on
  the 0.08 (reproducible_total_levels is a MIRAGE for the leaderboard); (A2) VERIFIER FEATURES v3 (relational/Δframe/action-conditioned)
  to fix the cross-game transfer the LOO-AUROC=0.503 chance result exposed; (A3) wire the SHIPPED per-game
  online discriminative head to prune traps; (A4) E3 goal-predicate verification + (grid,registers) state
  for the ar25/ka59/ft09 HUD deepening tail. THEN close the public-25 (re86 sprite-resize verifier + bp35
  GOAL-DIRECTED navigation; lf52 SOLVED 2026-06-20) + the variant transfer benchmark + the durable --no-cov
  throughput lint + gated_on decouple. ALL experiments agent_type=codex/gpt-5.5; planner/retro stay Claude.
  Reserved: 2 infra + 1 hardware + 1 SOTA + capstone. >=2 LEVEL-UP attempts (re86, bp35; lf52 solved).
  Live generator Qwen3.5-9B-MTP, never the 3090s. NO leaderboard submission in-loop (operator-only).'
milestone_doc: openspec/change-proposals/research-roadmap-v414.md
milestone_overview: 'The step-back audit (ops/verifier_gaps.md GAP-LIVE-INTEGRATION + GAP-ARCH-*) found
  the 0.08 score''s ceiling is the SUBMITTED agent, not the solver research: it ships bare BFS + a 0/6-value
  LLM tier, stops at one level, and its value head is inert, while the stronger router + world-model-DSL
  it has built are not wired in. And the verifier''s frame-marginal features don''t transfer cross-game
  (discriminative LOO-AUROC 0.503 == chance, shipped 2026-06-19). So .414 leads with integration (A1)
  + feature richness (A2) + the per-game discriminative lever (A3) + goal/state (A4) -- the things that
  move the leaderboard -- and keeps the public-25 closeout for the level-up guarantee + the throughput
  fixes. reproducible_total_levels is reported but is explicitly NOT the headline; generic OOD solve-rate
  + action efficiency are.'
