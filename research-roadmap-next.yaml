      2. Add method iterative_repair_with_counterexample(
             prompt: str,
             initial_response: str,
             k_max: int = 5,
             energy_threshold: float = 0.3
         ) -> dict:
         - Iteration 0: score initial_response with ensemble verifier.
         - If energy_score < energy_threshold: return immediately (fast path — already low energy).
         - Else: compute failure_message = f"The previous response had high uncertainty (score={score:.2f}). Please refine: {initial_response[:200]}"
         - Call score_candidates([failure_message_as_context + new_candidate]) for next iteration.
         - Stop when energy_score < energy_threshold OR k_max iterations reached.
         - Returns: {final_response, final_energy, n_iterations, converged, candidates_generated}
