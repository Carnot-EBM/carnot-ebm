    - typed_blocker_rows, required_custody_valid, operation_map_validity: Invalid board evidence produces explicit unknown placement. principle: A missing scope is not an accelerator capability.

    - cited_upstream_artifacts: List of experiment_id, fields_imported, path and sha256. principle: Inherited facts keep their original evidence identity.
