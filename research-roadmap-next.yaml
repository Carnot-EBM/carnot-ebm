    V625 completed three activated tasks while its design document promised 13.
    Exp7121 correctly disqualified the mismatch. V626 defines exactly 12 tasks,
    exp7124 through exp7135, in one order. This check is advisory. No science
    task gates on it, and the capstone remains ungated.

