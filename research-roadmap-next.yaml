    verdict: complete_refuted_directional_adjacency_degraded_hybrid_pass2_0.452_to_0.419_captured_0_of_2
    addressed_by: "This task does not re-test the single directional-adjacency invariant; it hardens exp5205's compact set-search result across grouped held-out splits and compares against both the always-on and refuted-single-invariant baselines."
    retire_if_same_verdict: true
  agent_type: codex
  model: gpt-5.5
  max_turns: 50
  estimated_wall_time_min: 45
  prompt: |
    CONTEXT:
    Repo at {project_root}, run on or after {date}. GAP-1 transpose/orientation discrimination was
    refuted as a single hand-invariant on 2026-06-09, but exp5205 found a structurally different positive:
    a compact set-search subset [border_ordered_profile, color_centroid_orientation,
    row_column_run_profile] with pass@2 0.221757 versus always-on 0.087866 and the refuted
    directional-adjacency baseline 0.150628. Before promotion, harden it against split luck and leakage.

    EXISTING CODE TO READ FIRST:
    - results/experiment_5205_autopyverifier_gap1_pilot_v476.json.
    - ops/verifier_gaps.md GAP-1 section.
    - results/arc_grid_verifier_invariants_v2.json.
    - Any python/carnot verifier module or experiment script authored by exp5205.

    TASK:
    Re-evaluate the exp5205 set-search method with repeated grouped splits, leakage checks, and explicit
    baselines. Produce bare top-level gate fields for exp5210.

    CONCRETE STEPS:
    1. Reconstruct the exact exp5205 candidate/discriminator matrix from existing artifacts. Do not add
       LLM-generated candidates in this task.
    2. Run at least 20 grouped train/held-out splits by task id, preserving the rule that subset selection
       is fit only on train groups and final metrics are reported only on held-out groups.
    3. Compare held-out pass@2 and transpose-capture metrics against always-on object_count +
       palette_histogram_shape and the refuted directional_adjacency_refuted_20260609 baseline.
    4. Run a leakage audit: no test gold, no test-output-derived features, no selecting subsets on held-out
       rows, no duplicate task ids across train/eval in a split.
    5. Update ops/verifier_gaps.md GAP-1 only with the hardening result. Do not promote to registry here.

    REQUIRED ARTIFACT FIELDS: gap1_hardened_positive
      gap1_hardened_positive:
        value: bool
        principle: "BARE top-level boolean used by exp5210 gate. True only if held-out mean pass@2 beats both baselines and the paired delta CI excludes harmful regression."
      heldout_pass_at_2_mean:
        value: float
      baseline_always_on_pass_at_2_mean:
        value: float
      single_refuted_directional_pass_at_2_mean:
        value: float
      delta_over_always_on:
        value: float
      delta_over_single_refuted:
        value: float
      paired_delta_ci95:
        value: "[lo, hi]"
      n_grouped_splits:
        value: int
      leakage_audit_passed:
        value: bool
      best_subset_stable:
        value: bool
      ops_verifier_gaps_updated:
        value: bool
      inference_substrate:
        value: verifier_ensemble_against_cached_candidates
      honest_verdict:
        principle: "Must start with complete:/complete_/success:/success_ and say whether GAP-1 set-search remains positive after hardening."

    Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

