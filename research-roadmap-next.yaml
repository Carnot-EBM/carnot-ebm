  - id: exp6212-three-family-gguf-runtime-recovery
    milestone: "2026.08.538"
    deliverable: results/experiment_6212_three_family_gguf_runtime_recovery.json
    title: "Three-family GGUF load, CUDA admission, and lifecycle recovery"
    priority: critical
    track: infrastructure
    requires_gpu: true
    max_turns: 100
    estimated_wall_time_min: 120
    model: opus
    requires:
      - exp6211-v538-post-marker-source-scope-prereg
    prior_failures:
      - experiment_id: exp6200-three-family-raw-code-transport-canary
        verdict: "complete_partial: Exp6200 coverage=18/18 cells; ready_families=[]"
        addressed_by: "This task isolates model-file, loader, VRAM-admission, CUDA-offload, and process-lifecycle failure before generation; it runs one deterministic token canary per family instead of repeating the 18-cell code envelope."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6200 completed all 18 planned cells but every family failed before generation with ValueError/backend_exception. GPU 1 was occupied during the run, while the artifacts did not establish whether the root cause was file integrity, loader compatibility, VRAM admission, CUDA placement, or process lifecycle. Repair this shared blocker before any ARC think A/B or code canary.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md, especially pre-launch preconditions and GGUF rules
      - {project_root}/openspec/capabilities/code-verification/spec.md REQ-CODE-6200
      - {project_root}/python/carnot/experiment_6200_three_family_raw_code_transport_canary.py and its tests
      - {project_root}/python/carnot/inference/sota_models.py, {project_root}/scripts/experiment_template.py, and the local GGUF proposer/server wrappers
      - {project_root}/results/experiment_6200_three_family_raw_code_transport_canary.json and raw lifecycle logs
      - {project_root}/ops/e2e-test-plan.md and current process/GPU ownership rules

      TASK
      Reproduce one failed model load per mandated family under a read-only preflight, localize the exact failure layer, and make the smallest task-owned fix outside scripts/research_conductor.py. Prove readiness only with an owned process, real CUDA layer offload, and at least one persisted deterministic output token per family. Never kill an unrelated process, rewrite a GGUF, or call a path present when no model loaded.

      MODEL_SPECS:
      - hf_id: unsloth/Qwen3.6-35B-A3B-GGUF; role: flagship MoE runtime; preferred_quant: Q4_K_M
      - hf_id: unsloth/gemma-4-31B-it-GGUF; role: flagship dense ARC and Phase-D runtime; preferred_quant: Q4_K_M
      - hf_id: unsloth/gemma-4-26B-A4B-it-GGUF; role: middle MoE runtime; preferred_quant: Q4_K_M
      Resolve exact cached files with cached_sota_pair()/the local resolver. Never pass a GGUF directory to AutoTokenizer. Record embedded chat templates and exact llama.cpp build identity.

      Required deliverable: {project_root}/results/experiment_6212_three_family_gguf_runtime_recovery.json.
      REQUIRED ARTIFACT FIELDS: status, upstream_exp6200_path_and_hash, preconditions_checked, gpu_owner_pid_memory_and_utilization_before_after, model_specs, exact_gguf_paths_sizes_hashes_revisions_quantizations, embedded_chat_template_receipts, loader_and_llama_cpp_build_receipts, minimal_failure_reproductions, root_cause_classification, task_owned_fix_paths_and_hashes, per_family_server_command_pid_lifetime_stderr_and_exit, per_family_cuda_layer_offload, per_family_first_token_bytes_hash_and_latency, gemma_4_31b_runtime_ready_score, three_family_runtime_ready_score, unrelated_process_kill_count, gguf_mutation_count, protected_files_unchanged, inference_substrate, verifier_is_oracle, field_provenance, field_principles, test_commands, test_exit_codes, duration_s, reproducibility_checksum, honest_verdict. unrelated_process_kill_count and gguf_mutation_count must be bare 0.

      CONCRETE STEPS
      1. Add REQ-INFRA-6212 and scenarios to the relevant runtime/code-verification spec before implementation and trace focused tests.
      2. Preflight both GPUs and enumerate owner/PID/command/VRAM. If safe admission is unavailable, write an honest blocked artifact without starting or killing a model process.
      3. Verify each exact GGUF file's size, hash, revision, quantization, metadata, and embedded template. Keep cache files read-only.
      4. Reproduce one Exp6200 load failure at a time with full stderr and process lifetime. Distinguish corrupt file, incompatible build, wrong loader, insufficient VRAM, bad flags, and external termination.
      5. Apply the smallest task-owned runtime fix and add regression tests. Do not change prompts, output budgets, scientific tasks, or the conductor.
      6. Start one owned canary server per family, confirm actual CUDA layers, request deterministic minimal output, and atomically persist the first raw token before teardown.
      7. Require all three independent receipts for three_family_runtime_ready_score=1; require dense readiness separately for gemma_4_31b_runtime_ready_score.
      8. Run focused runtime tests and applicable e2e checks, classify every nonzero result, and adversarial-verify timing and CUDA receipts.

      Run command: .venv/bin/python -m carnot.experiment_6212_three_family_gguf_runtime_recovery --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6213-arc-object-delta-perception-wiring
    milestone: "2026.08.538"
    deliverable: results/experiment_6213_arc_object_delta_perception_wiring.json
