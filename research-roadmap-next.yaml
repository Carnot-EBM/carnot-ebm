        - acceptance_gate_criteria: "All flagged classified; cascade
          diagnosed if observed; corrigenda appended."
        - methodology_note: "Audit; <10s on >5 artifacts = shortcut."
        - optimization_direction: "neither — audit task"
        - honest_verdict: MUST start with `complete:` / `complete_` /
          `success:` / `success_` / `passed:` / `passed_` / `shipped:` /
          `shipped_` per CLAUDE.md Verdict Terminal-Prefix Discipline.

