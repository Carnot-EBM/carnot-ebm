- id: exp717-jepa-v18-lambdarank
  milestone: 2026.04.55
  deliverable: results/experiment_717_jepa_v18_lambdarank.json
  title: 'Exp 717: JEPA v18 LambdaRank Listwise Loss on FoVer v2 (RETRO-CRITICAL — 4th attempt)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: JEPA v17 (RankNet pairwise, Exp 704) achieved OOD AUC=0.4819 — the THIRD
    consecutive milestone of below-random performance (v15=0.4751, v16=0.4759, v17=0.4819).
    This is RETRO-CRITICAL status. The project cannot advance FR-11 until JEPA works.

    ROOT CAUSE OF v17 FAILURE: Pairwise RankNet compares two steps at a time. When pairs
    are drawn from a pool with limited diversity (FoVer v1 had only 200 examples), many
    pairs have near-identical quality scores. Near-identical pairs produce near-zero
    gradients. The model learns nothing discriminative despite satisfying the RankNet loss.

    FIX — LambdaRank listwise loss:
    LambdaRank optimizes NDCG directly by computing lambdas = delta_NDCG * |sigmoid difference|
    for ALL pairs within a query group simultaneously. Unlike pairwise methods, LambdaRank's
    gradients are dominated by the pairs that most impact NDCG — forcing the model to rank
    the full step sequence correctly, not just beat one comparison at a time.

    KEY ADVANTAGE: FoVer v2 (Exp 712) provides 1000+ step-level labeled pairs with 5+ steps
    per question (median). This is the minimum needed for non-trivial listwise ranking.
    v17 used FoVer v1 (200 pairs, ~2 steps/question) — too few for LambdaRank to work.

    ADDITIONAL IMPROVEMENT — ActPRM uncertainty weighting (arXiv 2504.10559):
    FoVer v2 pairs have both Z3 labels and PDDL labels. When Z3 and PDDL disagree, the
    step is ambiguously correct/incorrect. ActPRM weights training examples by disagreement:
      weight = 1.0 - agreement_score  (high weight = uncertain = hard example)
    This focuses training on the genuinely difficult cases.

    EXISTING CODE TO READ FIRST:
    - python/carnot/samplers/jepa_predictor.py (or similar) — JEPAPredictor v17 impl.
    - results/experiment_704_jepa_v17_ranknet.json — v17 architecture and failure analysis.
    - results/experiment_712_fover_v2.json — FoVer v2 corpus metadata.
    - results/fover_v2_labeled.json (or equivalent) — FoVer v2 labeled pairs.
    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement JEPALambdaRankV18 with listwise LambdaRank loss + ActPRM uncertainty
    weighting. Train on FoVer v2. Evaluate OOD AUC on GSM8K 500-699.

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Add REQ-VER-028 (JEPA v18 MUST use LambdaRank listwise loss with NDCG surrogate
       gradient computed over all steps per query group),
       REQ-VER-029 (JEPA v18 training MUST use ActPRM uncertainty weighting based on
       Z3/PDDL label agreement score),
       SCENARIO-VER-035/036 to openspec/capabilities/verification/spec.md.
    3. Implement python/carnot/samplers/jepa_v18_lambdarank.py:
       a. Class JEPALambdaRankV18(nn.Module).
       b. Encoder: same as v17 (Qwen3.5-0.8B hidden states, layer 16, frozen).
       c. Ranking head: 2-layer MLP → scalar energy score.
       d. LambdaRank loss:
          - Group steps by question (query group).
          - For each group: compute all pairwise score differences.
          - Compute delta_NDCG for each swap (swapping ranks of two steps).
          - lambda_ij = delta_NDCG_ij * |sigmoid(score_i - score_j)|
          - Gradient: sum of lambdas over all pairs in group.
       e. ActPRM weighting:
          - Load Z3 labels and PDDL labels for each step.
          - agreement_score = float(z3_label == pddl_label)
          - example_weight = 1.0 - agreement_score + 0.1  (floor at 0.1)
          - Scale lambda gradients by example_weight.
       f. Training: Adam lr=1e-4, 50 epochs, batch=all steps per question.
       g. Evaluation: OOD AUC on GSM8K 500-699 (held out from FoVer v2).
    4. Create scripts/experiment_717_jepa_v18_lambdarank.py:
       a. ExperimentTemplate(717, requires_gpu=True) + ExperimentTimeoutWatchdog.
       b. Load FoVer v2 pairs, group by question.
       c. Train JEPALambdaRankV18 for 50 epochs, log loss per epoch.
       d. Evaluate OOD AUC on GSM8K 500-699.
       e. honest_verdict:
          - "jepa_v18_breakthrough" if ood_auc >= 0.75
          - "jepa_v18_above_random" if ood_auc >= 0.50
          - "jepa_v18_below_random" if ood_auc < 0.50 (4th consecutive failure)
       f. Gate signal: write results/jepa_v18_gate.json with {"gate": "pass"/"fail",
          "ood_auc": float} — downstream Exp 718 reads this.
       g. artifact: ood_auc, train_loss_final, epochs_trained, fover_v2_pairs_used,
          uncertainty_weights_applied (bool), honest_verdict.
    5. Write tests/python/test_experiment_717_jepa_v18_lambdarank.py with 100% coverage:
       - test LambdaRank loss is zero when ranking is perfect.
       - test LambdaRank loss > 0 when ranking is inverted.
       - test ActPRM weighting reduces weight for high-agreement pairs.
       - test gate file written with correct schema.
       Each test traces to REQ-VER-028/029.
    6. Reconcile:
       - ops/status.md: add JEPA v18 result with ood_auc.
       - ops/changelog.md: one-line with honest_verdict.
    7. tmpl.assert_deliverable_written() as final line.

    GPU SETUP: RTX 3090 GPU 0. Run setup_gpu() before inference.
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q
    Do NOT push. Do NOT modify scripts/research_conductor.py.

