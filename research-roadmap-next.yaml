       Collect:
         - retrieval_auroc_before: float
         - retrieval_auroc_after: float
         - compression_ratio: float (1000/32 = 31.25x)
         - k: 32
         - n_sessions_simulated: 10
         - memory_compression_viable: retrieval_auroc_after > 0.75
       honest_verdict:
         - "compression_viable" if retrieval_auroc_after > 0.75
         - "compression_degrades" if retrieval_auroc_after <= retrieval_auroc_before * 0.9
         - "compression_marginal" otherwise
    9. Write tests/python/test_experiment_865_constraint_memory_compression.py with 100% coverage.
       Test MemoryBankCompressor.compress() returns shape (k, D).
       Test compression_ratio().
       Test AUROC computation.
       Test no-op when N <= k.
       Traces to REQ-STORE-020 (new), SCENARIO-STORE-030 (memory compression AUROC).
    10. Add spec update: openspec/capabilities/constraint-store/spec.md — add REQ-STORE-020
        "EmbeddingConstraintStore MUST support K=32 centroid compression via MemoryBankCompressor
        after 10+ sessions of accumulation, preserving retrieval AUROC > 0.75."
    11. Reconcile:
        - ops/changelog.md: one-line entry
        - ops/status.md: "Exp 865: Memory compression K=32. retrieval_auroc_before={result},
          after={result}. compression_ratio={result}x."
    12. tmpl.assert_deliverable_written() as final line.

    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python/test_experiment_865_constraint_memory_compression.py -v
