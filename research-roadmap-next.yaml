    addressed_by: "exp2439 (.236) ran the learnability audit but emitted a non-standard verdict (missing terminal
      prefix — the verdict itself says 'Terminal-prefix required' which is NOT a proper terminal verdict).
      This v5 corrects: (a) uses proper terminal prefix 'complete:', (b) extends with asymmetric
      soundness/completeness tracking per arXiv:2603.03538 Littlestone-dimension bounds, (c) uses the
      NSVIF extractor to process real violations from live_sota_balanced_telemetry_manifest_1480.jsonl,
      tracking soundness mistakes (missed violations) and completeness mistakes (false alarms) separately."
