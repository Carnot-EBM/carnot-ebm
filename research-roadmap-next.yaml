  - id: exp2684
    milestone: "2026.05.255"
    deliverable: "results/experiment_2684_adaptive_conformal_gate.json"
    title: "Adaptive Conformal Factuality Gate: Prompt-Dependent Calibration (arXiv:2604.13991)"
    agent_type: codex
    model: gpt-5.5
    max_turns: 35
    track: verifier

    prior_failures:
      - experiment_id: exp2627-bb-ucp-conformal-calibration
        verdict: "complete: conformal calibration applied to ensemble v9"
        addressed_by: "exp2627 (.251) implemented BB-UCP conformal with fixed calibration set. arXiv:2604.13991 shows that ADAPTIVE (prompt-dependent) calibration achieves 15% better factuality vs fixed calibration by adjusting the nonconformity threshold per prompt type. This implements a new conformal gate as a separate Tier 0 verifier — not a modification of BB-UCP. Different deliverable shape: PromptAdaptiveConformalGate class, prompt_type_calibration_map."
        retire_if_same_verdict: false

    prompt: |
      Read CLAUDE.md for project context and code style requirements.

      CONTEXT:
      Paper arXiv:2604.13991 proposes adaptive conformal prediction where the calibration set is
      PROMPT-SPECIFIC: different prompt types (arithmetic, factual recall, open-ended generation)
      get different nonconformity thresholds. Standard conformal uses one threshold for all prompts,
      leading to over-rejection on easy prompts and under-rejection on hard ones. Adaptive calibration
      achieves 90% marginal coverage with 15% better factuality on TruthfulQA by adjusting thresholds.

      EXISTING CODE TO READ FIRST:
      - python/carnot/verify/ (existing verifier module patterns — follow tier0* naming)
      - data/fover_corpus.jsonl (FoVer corpus — source of calibration set, {question, correct, incorrect})
      - results/experiment_2678_multi_agent_scaling_audit.json (if exists — AUROC vs k curve for context)

      TASK: Implement PromptAdaptiveConformalGate as python/carnot/verify/tier0c_conformal_gate.py.

      CONCRETE STEPS:
      0. PRECONDITIONS:
         a. `.venv/bin/python -c "import sklearn; print(sklearn.__version__)"` — scikit-learn available.
            If absent: write honest_verdict 'blocked_sklearn_missing' and exit.
         b. `python -c "import json; lines=open('data/fover_corpus.jsonl').readlines(); print(len(lines))"` — FoVer corpus non-empty.
         Record: preconditions_checked.

      1. Load FoVer corpus. Classify each entry by prompt type:
         - "arithmetic": question contains digit strings or math operators
         - "factual": question starts with Who/What/When/Where/Why/How
         - "code": question contains def/class/function or code snippets
         - "other": everything else
         Record: prompt_type_distribution (dict: type -> count).

      2. For each prompt type: compute a separate calibration threshold.
         threshold = 90th percentile of (1 - TF-IDF cosine similarity between correct and incorrect).
         This is the nonconformity score for the adaptive gate.
         Record: prompt_type_thresholds (dict: type -> float).

      3. Implement PromptAdaptiveConformalGate class in python/carnot/verify/tier0c_conformal_gate.py:
         - classify_prompt(prompt: str) -> str (returns prompt type)
         - compute_nonconformity(text: str, context: str) -> float
         - gate(text: str, context: str) -> bool (True = likely hallucination)
         - verify(text: str) -> float (0.0-1.0 energy score; 1.0 = high hallucination risk)
         Record: module_created (bool).

      4. Evaluate gate on FoVer eval split (20% holdout, random_seed=42):
         a. AUROC vs fixed-threshold baseline (single global threshold).
         b. Coverage rate: fraction of eval examples where gate(text) == correct label.
         Record: tier0c_auroc (float), coverage_rate (float), tier0c_viable (bool = tier0c_auroc >= 0.60).

      5. Write results/experiment_2684_adaptive_conformal_gate.json.

      REQUIRED ARTIFACT FIELDS:
      - honest_verdict: MUST start with 'complete:' or 'blocked_'
        principle: "Terminal prefix required."
      - tier0c_auroc: float
        principle: "Primary metric; adaptive conformal gate AUROC on FoVer eval split."
      - coverage_rate: float
        principle: "arXiv:2604.13991's primary metric: 90%+ coverage while maintaining factuality."
      - tier0c_viable: bool — auroc >= 0.60
        principle: "Gate for ensemble v12 inclusion in future milestone."
      - prompt_type_thresholds: dict
        principle: "Adaptive calibration deliverable: different thresholds per prompt type."
      - prompt_type_distribution: dict
        principle: "Confirms prompt type classification ran on FoVer (expected: all 4 types present)."
      - random_seed: int — 42
        principle: "Reproducibility: same eval split as exp2667."
      - duration_s: float
        principle: "Corpus classification + threshold computation + eval: expected 5-30s."
      - preconditions_checked: list of {resource, available, check}
        principle: "Anti-fabrication: records sklearn check + corpus availability check."

      Do NOT push. Do NOT modify scripts/research_conductor.py.


