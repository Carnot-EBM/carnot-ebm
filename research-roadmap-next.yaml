    - scripts/experiment_template.py — ExperimentTemplate.
    - python/carnot/pipeline/experiment_watchdog.py — ExperimentTimeoutWatchdog.

    TASK: Implement PSV-PaCoRe K=2 parallel chains using DualGPU. Run 10 iterations.
    Target: fp_rate_trend_slope < 0 (restoring improvement direction).

