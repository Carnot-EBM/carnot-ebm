milestone: 2026.06.413
milestone_title: >-
  EXECUTE the counterexample-guided induction .412 DESIGNED BUT COULD NOT RUN: fix the
  pytest-precondition infra bug that BLOCKED dc22 (it ran `pytest -k` which trips the global
  --cov-fail-under=99 gate -> exit 1 -> the agent bailed; .411's successful solve exp4446 used
  --no-cov), BANK sc25's 4 PROVISIONAL live-recorded levels (L2-L5 -- the single biggest
  reproduced-level opportunity, provisional_total_levels=5; .412 exp4457 produced NO artifact,
  over-scoped), and finally GROW reproducible_total_levels off the 39 that .412 left FLAT (the
  sprint's only headline metric did not move all milestone). .412 closed generic_solver_gap_state=PARTIAL:
  it CLOSED GAP-4432-LOO-TR87 (tr87 re-solves generically, exp4456) and raised generic_loo_solve_count
  5->6 (exp4459) and shipped a 39-level submission package (exp4460) -- but banked ZERO new reproduced
  levels because the two level-up attempts FAILED OPERATIONALLY (dc22 blocked, sc25 no-artifact), not on
  the research. .413 turns that diagnosis into banked progress + ships the durable --no-cov precondition
  fix so the dc22-class block never recurs. PLUS the operator-MANDATED (2026-06-19) MANUFACTURED-variant
  generic-transfer benchmark (25 games x N variants). THE .410/.411 LESSON, ENFORCED: inference_substrate
  is a REQUIRED ARTIFACT FIELD the agent must EMIT on EVERY ARC solve/scoring task. ALL experiments
  agent_type=codex/gpt-5.5 (operator quota-conserve 2026-06-19 sprint; the Claude planner is SKIPPED via
  this pre-staged roadmap; planner/retro stay Claude). The live generator is Qwen3.5-9B-MTP
  ([[project_arc_live_generator]]); NEVER the 3090s. paper_ready=True (FoVer 0.9131, G1-G4) is the FROZEN
  headline. NO leaderboard submission in-loop (operator-only; A7 PREPARES a refreshed package).
milestone_doc: openspec/change-proposals/research-roadmap-v413.md
milestone_overview: |
  .412 designed the right approach (counterexample-guided induction to close the generic-solver gaps and
  bank levels) but banked ZERO new reproduced levels: dc22 was BLOCKED by a brittle precondition (its
  `pytest -k "config_rule or arc_solver_kit"` smoke check inherits the global --cov-fail-under=99 from
  pyproject addopts; a -k subset = 26.71% coverage = exit 1, and the codex agent treated exit-1 as a hard
  block -- the CEGIS solve never ran), sc25's deeper-bank produced NO artifact (over-scoped: it bundled
  "generalize a generic operator" + "bank 4 levels" in one 150-turn task), and sb26 was an honest negative
  (missing color-match-slot-sequence verifier). .413 EXECUTES what .412 designed: (A1) actually run the
  dc22 CEGIS solve with the corrected --no-cov precondition; (A2) bank sc25's already-live-recorded L2-L5
  via sc25's OWN cast-grid world model (split from the generic-operator generalization, which is A3);
  (A4) build the specific missing sb26 operator; (A5) first-contact a NEW rotated game; (A6) the
  operator-mandated 25-games x N-variants transfer benchmark; (A7) refresh the submission package. Every
  ARC SOLVE task is reproduction-gated (arc_solver_kit.reproduce -> only reproduced levels count),
  Incremental-Progress-scoped (+1..+n on ONE game; never "solve them all"), EMITS inference_substrate as a
  REQUIRED ARTIFACT FIELD, uses a TERMINAL-prefixed honest_verdict, and (the .413 fix) uses `--no-cov` in
  its pytest precondition. Reserved: 2 infra slots (one carrying the durable --no-cov lint), 1 per attached
  FPGA board (Hardware-Task Continuity), 1 SOTA-ingestion slot. The ARC submission sprint forcing function
  (CLAUDE.md, through 2026-06-30) mandates the MAJORITY on ARC live-solving -- here 7 of 7 discretionary
  slots (A1-A7).

    PHASE 0 -- TRANSITION: exp4466 archive .412 -> activate .413; record the TRUE .412 close-state.

    PHASE A -- GENERIC LIVE SOLVING (operator MANDATORY; the headline; majority):
      A1 (exp4467) SOLVE dc22 L1 with the CORRECTED --no-cov precondition + counterexample-guided
        config-rule grounding (re-induce from the rejecting execution-state) -> +1 game/level (39/20 ->
        40/21); closes GAP-4423-DC22. The .412 attempt was BLOCKED never run; this one runs.
      A2 (exp4468) BANK sc25 provisional L2-L5 by driving sc25's OWN cast-grid world model deeper through
        the reproduction gate (provisional -> reproduced) -> +1..+4 levels. The biggest opportunity.
      A3 (exp4469) GENERIC cast-grid phase-FSM world-model operator -> sc25 re-solves L1 WITHOUT its hand
        recipe; closes GAP-4432-LOO-SC25 (raises generic_loo_solve_count).
      A4 (exp4470) BUILD the color_match_slot_sequence_verifier operator the .412 sb26 negative identified
        + SOLVE sb26 L1 -> +1 game/level if banked, else terminal complete: with the residual.
      A5 (exp4471) FIRST-CONTACT a NEW never-attempted ROTATED game (bp35/lf52/re86) via the full generic
        stack -> +1 game/level or a terminal complete: with the residual logged.
      A6 (exp4472) MANUFACTURED-variant generic-transfer benchmark v4 (operator-MANDATED 2026-06-19): score
        the generic solver on 25 games x N variants + re-measure generic_loo_solve_count_v4 (v3 was 6).
      A7 (exp4473) SUBMISSION PACKAGE PREP refresh (operator-only submit) -- re-validate + refresh the
        env-matched replay package after the new levels bank; does NOT submit.
    PHASE B -- RESERVED INFRA (2 slots): exp4474 (registry/gaps hygiene + GAP-4 regression guard +
      reconcile .413), exp4475 (the DURABLE FIX: a shared --no-cov ARC precondition smoke helper + a lint
      that FLAGS any ARC pytest precondition missing --no-cov, so the dc22-class block never recurs;
      + extend the count-integrity lint for the sc25 provisional->reproduced transition).
    PHASE C -- HARDWARE CONTINUITY (1 per attached board): exp4476 (KV260 SSH + GateMate + PolarFire).
    PHASE D -- SOTA-INGESTION (.413 bleeding-edge track -- executing CEGIS induction at scale + the
      program-induction precision/agreement frontier): exp4477 (map the strongest methods onto .414).
    PHASE E -- CAPSTONE: exp4478 (the .413 scorecard + the DECISION: did reproducible_total_levels finally
      GROW off 39? dc22 + sc25-deeper banked? generic_loo_solve_count rise? variant-transfer rate?).

