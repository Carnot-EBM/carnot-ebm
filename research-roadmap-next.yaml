- id: exp861-streaming-cot-detector
  milestone: 2026.04.66
  deliverable: results/experiment_861_streaming_cot_detector.json
  title: 'Exp 861: StreamingCoTHalluDetector — Tier 0g PHaS Prefix Signal (CPU)'
  prompt: |
    You are working on the Carnot EBM framework in {project_root}.
    Read CLAUDE.md for code style requirements.
    Today's date: {date}.

    CONTEXT: arXiv 2601.02170 (Streaming Hallucination Detection in Long CoT) proposes
    detecting hallucinations in chain-of-thought reasoning by tracking a per-prefix
    cumulative PHaS (Predictive Hallucination Score) signal. The key insight: hallucinations
    in long CoT are predictable from prefix-level EORM (energy reward model) scores before
    the incorrect step occurs. The signal accumulates as:
      phas_t = alpha * eorm_score_t + (1-alpha) * phas_{t-1}
    When phas_t drops below a threshold (e.g., 0.3), flag is_streaming_unstable=True.
    This is advisory (does not block repair) and targets Tier 0g in the cascade.

    EORM is already deployed (Tier 2, 55M params). The streaming detector wraps EORM
    to compute rolling prefix scores over CoT steps.

    EXISTING CODE TO READ FIRST:
    - python/carnot/models/eorm.py — EORM energy reward model (find score() method)
    - python/carnot/pipeline/verify_repair.py — VerificationCertificate structure
    - python/carnot/probes/ — existing probe implementations (Tier 0a-0f)
    - research-references.md — arXiv 2601.02170 entry
    - openspec/change-proposals/research-roadmap-vNEXT.md — .66 design doc Phase 3 section

    TASK: Implement StreamingCoTHalluDetector (Tier 0g). Compute rolling PHaS over CoT
    steps. Add is_streaming_unstable flag to VerificationCertificate. Benchmark AUC on
    50 synthetic CoT pairs (25 correct, 25 with injected errors).

    CONCRETE STEPS:
    1. Read CLAUDE.md spec-first workflow.
    2. Read python/carnot/models/eorm.py. Find score() or forward() method.
       Understand: takes a reasoning step string, returns a float score (higher = more correct).
    3. Implement python/carnot/probes/streaming_cot_detector.py:
       class StreamingCoTHalluDetector:
         def __init__(self, eorm_model, alpha: float = 0.3, threshold: float = 0.35):
           self.eorm = eorm_model
           self.alpha = alpha          # EMA decay for PHaS
           self.threshold = threshold  # below this -> unstable flag
           self.phas_history: list[float] = []

         def process_step(self, cot_step: str) -> dict:
           score = self.eorm.score(cot_step)
           if self.phas_history:
             phas_t = self.alpha * score + (1 - self.alpha) * self.phas_history[-1]
           else:
             phas_t = score
           self.phas_history.append(phas_t)
           is_unstable = phas_t < self.threshold
           return {"phas_t": phas_t, "eorm_score": score, "is_unstable": is_unstable}

         def is_streaming_unstable(self) -> bool:
           if not self.phas_history:
             return False
           return self.phas_history[-1] < self.threshold

         def reset(self):
           self.phas_history = []
    4. Extend VerificationCertificate in python/carnot/pipeline/verify_repair.py:
       Add field: streaming_cot_unstable: bool = False
       Populate from StreamingCoTHalluDetector.is_streaming_unstable() in verify().
    5. Add spec update: openspec/capabilities/verify-repair/spec.md — add REQ-PROBE-040
