- id: exp627-interwhen-monitor
  milestone: 2026.04.48
  deliverable: results/experiment_627_interwhen_monitor.json
  title: 'Exp 627: interwhen Mid-Generation Monitor — SymCodeVerifier at Sentence Boundaries (arXiv 2602.11202)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: RETRO-070 CRITICAL.\
    \ 15 consecutive VR attempts at 0% improvement. Root cause confirmed: post-hoc\
    \ extraction of completed responses finds 0-4% of violations because IT models\
    \ bury arithmetic in natural language prose. The fix is MID-GENERATION monitoring:\
    \ arXiv 2602.11202 (interwhen) showed +15pp accuracy by checking intermediate\
    \ solutions DURING generation. SymCodeVerifier (Exp 619, AUC=0.804) provides the\
    \ executable verifier. This experiment implements InterWhenMonitor — a wrapper\
    \ around Qwen3.5-0.8B generation that calls SymCodeVerifier at every sentence boundary\
    \ and records mid-generation violation signals.\n\nEXISTING CODE TO READ FIRST:\n\
    - python/carnot/pipeline/symcode_verifier.py — SymCodeVerifier (Exp 619): segment_steps(),\
    \ verify_step(), detection_score()\n- results/experiment_619_dsvd_symcode.json\
    \ — symcode_live_auc=0.804, architecture details\n- results/live_pairs_578.json\
    \ — live pairs corpus (READ ALL is_correct=False responses; note how each sentence\
    \ ends — these are the sentence boundaries where we intercept)\n- python/carnot/pipeline/env_autofix.py\
    \ — apply_env_autofix()\n- scripts/experiment_template.py — ExperimentTemplate,\
    \ BatchedInferenceRunner\n\nTASK: Implement InterWhenMonitor and benchmark mid-generation\
    \ recall.\n1. Read CLAUDE.md spec-first workflow.\n2. Add REQ-VERIFY-130 (InterWhenMonitor:\
    \ invoke SymCodeVerifier at sentence boundaries during generation), REQ-VERIFY-131\
    \ (InterWhenMonitor: mid-generation recall >= post-hoc recall on same responses),\
    \ SCENARIO-VERIFY-168/169/170 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Create python/carnot/pipeline/interwhen_monitor.py:\n   a. InterWhenViolation\
    \ dataclass: sentence_index (int), sentence_text (str), violation_detected (bool),\
    \ detection_score (float), step_results (list[CoTStep]).\n   b. InterWhenMonitor\
    \ class:\n      __init__(self, verifier: SymCodeVerifier, sentence_boundary_chars:\
    \ str = '.!?\\n'):\n        self.verifier = verifier\n        self.boundary_chars\
    \ = sentence_boundary_chars\n        self.violations_detected: list[InterWhenViolation]\
    \ = []\n      split_at_boundaries(self, text: str) -> list[str]:\n        'Split\
    \ text at sentence boundaries. Return non-empty sentences.'\n        Split on\
    \ self.boundary_chars, strip, filter empty.\n      monitor_partial(self, partial_text:\
    \ str) -> InterWhenViolation | None:\n        'Given partial generation text ending\
    \ at a sentence boundary, run SymCodeVerifier on the last sentence. Return violation\
    \ if detected, else None.'\n        sentences = self.split_at_boundaries(partial_text)\n\
    \        if not sentences: return None\n        last = sentences[-1]\n        step_results\
    \ = self.verifier.verify_response(last)\n        score = self.verifier.detection_score(last)\n\
    \        violated = score > 0.0\n        v = InterWhenViolation(len(sentences)-1,\
    \ last, violated, score, step_results)\n        if violated: self.violations_detected.append(v)\n\
    \        return v if violated else None\n      monitor_full_response(self, response:\
    \ str) -> list[InterWhenViolation]:\n        'Simulate mid-generation monitoring\
    \ by iterating sentence-by-sentence through a completed response.'\n        sentences\
    \ = self.split_at_boundaries(response)\n        violations = []\n        for i,\
    \ sent in enumerate(sentences):\n            partial = ' '.join(sentences[:i+1])\n\
    \            v = self.monitor_partial(partial)\n            if v: violations.append(v)\n\
    \        return violations\n      any_violation(self, response: str) -> bool:\n\
    \        return len(self.monitor_full_response(response)) > 0\n   c. Export InterWhenMonitor,\
    \ InterWhenViolation from carnot.pipeline.\n4. Write scripts/experiment_627_interwhen_monitor.py:\n\
    \   a. apply_env_autofix() FIRST.\n   b. from python.carnot.pipeline.live_assertion\
    \ import assert_live_or_ci_skip; assert_live_or_ci_skip().\n   c. ExperimentTimeoutWatchdog(627,\
    \ timeout_minutes=35).\n   d. ExperimentTemplate(627, 'InterWhenMonitor Mid-Generation',\n\
    \      'results/experiment_627_interwhen_monitor.json', requires_gpu=False).\n \
    \  e. llm_caller: Qwen3.5-0.8B CPU if CARNOT_FORCE_LIVE=1, else None.\n   f. monitor\
    \ = InterWhenMonitor(SymCodeVerifier(llm_caller=llm_caller)).\n   g. Load 25 incorrect\
    \ + 10 correct responses from results/live_pairs_578.json.\n      For each response:\n\
    \        violations = monitor.monitor_full_response(response)\n        violation_detected\
    \ = len(violations) > 0\n   h. Compute:\n      interwhen_tp = sum(any_violation\
    \ for incorrect). interwhen_fp = sum(any_violation for correct).\n      interwhen_recall\
    \ = interwhen_tp / 25. interwhen_fp_rate = interwhen_fp / 10.\n      postcog_recall\
    \ = symcode_post_hoc_recall from Exp 619 (0.804 * 25 / 25 as baseline).\n     \
    \ NOTE: symcode_post_hoc ran on COMPLETED responses. interwhen runs sentence-by-sentence.\n\
    \      early_detection_rate: fraction of violations detected BEFORE the last sentence.\n\
    \   i. gate_open = interwhen_recall >= 0.20.\n   j. Build artifact: schema='carnot.interwhen_monitor.v1',\n\
    \      n_incorrect=25, n_correct=10,\n      interwhen_tp=<int>, interwhen_fp=<int>,\n\
    \      interwhen_recall=<float>, interwhen_fp_rate=<float>,\n      postcog_recall_baseline=0.804,\n\
    \      early_detection_rate=<float>, avg_sentences_before_detection=<float>,\n \
    \     gate_open=<bool>,\n      retro_070_partial=(interwhen_recall > 0.04),\n  \
    \    honest_verdict='interwhen_breakthrough' if interwhen_recall>=0.20\n       \
    \ else 'interwhen_improved' if interwhen_recall>0.04\n        else 'interwhen_no_improvement'.\n\
    \   k. tmpl.assert_deliverable_written() as FINAL LINE.\n5. Write tests/python/test_interwhen_monitor.py\
    \ (100% coverage on interwhen_monitor.py including all methods).\n6. Run: JAX_PLATFORMS=cpu\
    \ .venv/bin/pytest tests/python -q\n7. Reconcile: ops/conductor-log.md (RETRO-070\
    \ interwhen attempt), ops/changelog.md.\nRun: JAX_PLATFORMS=cpu .venv/bin/pytest\
    \ tests/python -q\nDo NOT push. Do NOT modify scripts/research_conductor.py.\n"

- id: exp628-oracle-fover-v5
  milestone: 2026.04.48
  deliverable: results/experiment_628_oracle_fover_v5.json
  title: 'Exp 628: ORACLE FOVER v5 Corpus — Constraint-Led Step-Level Training Data (arXiv 2603.21140)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: JEPA v13 ECE=0.207\
    \ (target <0.10) because all training data came from synthetic violations or\
    \ binary correct/incorrect labels — not step-level constraint labels matching\
    \ live LLM output style. ORACLE (arXiv 2603.21140, AAAI 2026) generates multi-step\
    \ reasoning data where EACH STEP has a symbolic verification label: syllogistic\
    \ prompting produces a step context, symbolic engine verifies each step. The result\
    \ is a corpus where the training labels match the live generation distribution\
    \ because they were produced by the SAME model that will be verified. This closes\
    \ RETRO-066 (offline/live distribution gap) for JEPA v14 training.\n\nEXISTING\
    \ CODE TO READ FIRST:\n- results/fover_corpus_v5.json — existing FOVER corpus (if\
    \ available; check if file exists, read schema: question_id, question, response,\
    \ is_correct, model_id, inference_mode)\n- results/live_pairs_578.json — 100 live\
    \ pairs from Qwen3.5-0.8B, is_correct labels\n- python/carnot/pipeline/symcode_verifier.py\
    \ — SymCodeVerifier.verify_response() → list[CoTStep] with violation_detected per step\n\
    - python/carnot/extraction/llm_extractor_v1.py — LLMAsExtractorV1 (use as generator\
    \ for step-level context prompts)\n- results/experiment_619_dsvd_symcode.json —\
    \ SymCodeVerifier architecture\n\nTASK: Build ORACLE-style step-level labeled corpus\
    \ (fover_corpus_v5_oracle.json).\n1. Read CLAUDE.md spec-first workflow.\n2. Add\
    \ REQ-DATA-012 (ORACLE corpus: step-level constraint labels derived from live LLM\
    \ output + SymCodeVerifier), REQ-DATA-013 (ORACLE corpus: >= 200 labeled reasoning\
    \ chains), SCENARIO-DATA-019/020 to openspec/capabilities/verifiable-reasoning/spec.md.\n\
    3. Create python/carnot/pipeline/oracle_corpus_builder.py:\n   a. StepLabel dataclass:\
    \ step_index (int), step_text (str), violation_detected (bool), executed_result\
    \ (float | None), stated_result (float | None), label (str): 'correct' | 'violated'\
    \ | 'unknown'.\n   b. OracleChain dataclass: question_id (str), question (str),\
    \ model_response (str), is_correct (bool), model_id (str), inference_mode (str),\
    \ step_labels (list[StepLabel]), has_violation (bool), n_violated_steps (int).\n\
    \   c. OracleCorpusBuilder class:\n      __init__(self, verifier: SymCodeVerifier):\n\
    \        self.verifier = verifier\n      label_chain(self, chain: dict) -> OracleChain:\n\
    \        'Label each reasoning step in a live response using SymCodeVerifier.'\n\
    \        response = chain['response']\n        step_results = self.verifier.verify_response(response)\n\
    \        step_labels = [StepLabel(i, s.text, s.violation_detected,\n          \
    \  s.executed_result, s.stated_result,\n            'violated' if s.violation_detected\
    \ else 'correct')\n          for i, s in enumerate(step_results)]\n        return\
    \ OracleChain(\n            question_id=chain.get('question_id', str(hash(chain['question']))),\n\
    \            question=chain['question'], model_response=response,\n            is_correct=chain['is_correct'],\
    \ model_id=chain['model_id'],\n            inference_mode=chain.get('inference_mode',\
    \ 'live_gpu'),\n            step_labels=step_labels,\n            has_violation=any(s.violation_detected\
    \ for s in step_results),\n            n_violated_steps=sum(1 for s in step_results\
    \ if s.violation_detected))\n      build_corpus(self, live_pairs: list[dict])\
    \ -> list[OracleChain]:\n        return [self.label_chain(p) for p in live_pairs]\n\
    \   d. Export OracleCorpusBuilder, OracleChain, StepLabel from carnot.pipeline.\n\
    4. Write scripts/experiment_628_oracle_fover_v5.py:\n   a. apply_env_autofix() FIRST.\n\
    \   b. ExperimentTimeoutWatchdog(628, timeout_minutes=45).\n   c. ExperimentTemplate(628,\
    \ 'ORACLE FOVER v5 Corpus Builder',\n      'results/experiment_628_oracle_fover_v5.json',\
    \ requires_gpu=False).\n   d. llm_caller = Qwen3.5-0.8B CPU if CARNOT_FORCE_LIVE=1,\
    \ else None.\n   e. Load all available live pairs:\n      sources = ['results/live_pairs_578.json',\
    \ 'results/fover_corpus_v5.json']\n      For each source: load if file exists.\
    \ Deduplicate by question_id. Total target: >= 200 chains.\n   f. verifier = SymCodeVerifier(llm_caller=llm_caller).\n\
    \   g. builder = OracleCorpusBuilder(verifier).\n      chains = builder.build_corpus(live_pairs)\n\
    \   h. Statistics:\n      n_chains = len(chains)\n      n_with_violation = sum(c.has_violation\
    \ for c in chains)\n      n_without_violation = n_chains - n_with_violation\n \
    \     n_total_steps = sum(len(c.step_labels) for c in chains)\n      n_violated_steps\
    \ = sum(c.n_violated_steps for c in chains)\n      step_violation_rate = n_violated_steps\
    \ / max(n_total_steps, 1)\n   i. Serialize: chains_dicts = [dataclasses.asdict(c)\
    \ for c in chains].\n      Write results/fover_corpus_v5_oracle.json with chains_dicts.\n\
    \   j. Build artifact: schema='carnot.oracle_fover_v5.v1',\n      n_chains=<int>,\
    \ n_with_violation=<int>, n_without_violation=<int>,\n      n_total_steps=<int>,\
    \ n_violated_steps=<int>, step_violation_rate=<float>,\n      oracle_corpus_path='results/fover_corpus_v5_oracle.json',\n\
    \      corpus_ready=(n_chains >= 100),\n      honest_verdict='oracle_corpus_ready'\
    \ if n_chains>=100 else 'oracle_corpus_partial'.\n   k. tmpl.assert_deliverable_written()\
    \ as FINAL LINE.\n5. Write tests/python/test_oracle_corpus_builder.py (100% coverage\
    \ on oracle_corpus_builder.py).\n6. Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python\
    \ -q\n7. Reconcile: ops/conductor-log.md (RETRO-066 ORACLE corpus), ops/changelog.md.\n\
    Run: JAX_PLATFORMS=cpu .venv/bin/pytest tests/python -q\nDo NOT push. Do NOT modify\
    \ scripts/research_conductor.py.\n"

- id: exp629-interwhen-diagnostic-gate
  milestone: 2026.04.48
  deliverable: results/experiment_629_interwhen_diagnostic.json
  title: 'Exp 629: interwhen Diagnostic — Gate Check for VR #16 (recall >= 0.20 required)'
  prompt: "You are working on the Carnot EBM framework in {project_root}.\nRead CLAUDE.md\
    \ for code style requirements.\nToday's date: {date}.\n\nCONTEXT: Exp 627 implemented\
