  - id: exp3654-real-nli-atomic-claim-grounding-verifier
    prior_failures:
      - experiment_id: exp3587-retrieval-nli-grounding-verifier
        verdict: leak_auroc_1p0_h_token_substring_shortcut
        addressed_by: "exp3587's verifier leaked (AUROC=1.0 by checking whether the answer string contained the char 'H', a label-correlate in the toy corpus). Its substring/'H'-token logic was DELETED in .334. This task builds a genuinely DIFFERENT verifier: a real model-based NLI (DeBERTa/MiniLM-NLI) atomic-claim grounding verifier per arXiv:2504.18639 that scores (model_answer, evidence) ONLY -- never the gold answer/label -- with an explicit AUROC>=0.99 RED-FLAG leak guard."
        retire_if_same_verdict: false
      - experiment_id: exp3642-corrected-cross-domain-remeasurement-v4
        verdict: complete_verifier_value_generalizes_to_code_not_facts_partial_scope
        addressed_by: "exp3642's facts row used a text-statistical PROXY (nli_substrate=disclosed_text_statistical_proxy, AUROC 0.6495). This task is a DIFFERENT method: a real model-based NLI checkpoint + atomic-claim decomposition. The negative facts result was never tested with the literature's actual recipe, so this is new science, not a rerun."
        retire_if_same_verdict: false
    milestone: "2026.06.335"
    title: "Build a REAL model-based NLI atomic-claim grounding verifier (DeBERTa/MiniLM-NLI + SRL/atomic decomposition, arXiv:2504.18639 / FinGround arXiv:2604.23588) — replaces the .334 text-statistical proxy; leak-guarded; standalone AUROC on the v3 facts corpus"
    priority: critical
    max_turns: 70
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # gemini quota exhausted; multi-file verifier build; codex 0.135.0 verified working; requires_codex bypasses GEMINI_FORCE
    estimated_wall_time_min: 30
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: true
    deliverable: results/experiment_3654_real_nli_atomic_claim_grounding_verifier.json
    prompt: |
      CONTEXT: .334 (exp3642) found facts does NOT generalize, but ONLY tested a text-statistical proxy
      (AUROC 0.6495 < confidence 0.7446). The literature recipe -- decompose the MODEL'S answer into atomic
      claims, score each claim's entailment against the corpus evidence with a real DeBERTa/MiniLM-NLI model
      (arXiv:2504.18639 Span-Level; arXiv:2604.23588 FinGround type-routed) -- was never tried. This task builds
      that REAL grounding verifier. Until it is measured, "facts does not generalize" is NOT an earned conclusion.
      VERIFIER AUTHENTICITY (CLAUDE.md -- MANDATORY): the docstring must match the implementation. If you invoke
      a real NLI checkpoint via transformers, say so; if a real checkpoint is unavailable, you MUST carry the
      explicit pcib_probe.py-style disclosure ("we approximate entailment with ... because no NLI checkpoint is
      cached") -- do NOT name it model-based if it is a heuristic.
      LEAK GUARDS (MANDATORY): the verifier scores (model_answer, evidence_passage) ONLY -- it must NEVER read
      the corpus `answer` (gold) field or the `is_hallucination` label. An AUROC >= 0.99 on n>=200 is a RED-FLAG
      leak (the exp3587 'H'-token failure mode), not a win -- if you see it, diagnose the leak and report the
      honest lower number. It is EXPECTED and not a leak that a correct answer is entailed by its evidence while a
      hallucinated answer is not -- that is what grounding measures.
      EXISTING CODE TO READ FIRST: results/experiment_3640 (the v3 facts corpus path + confidence baseline 0.7446)
      and results/experiment_3642 (the proxy facts row, AUROC 0.6495) via scripts/summarize_artifact.py;
      python/carnot/verify/pcib_probe.py (the honest-disclosure exemplar); python/carnot/verify/ for the existing
      verifier interface; research-references.md "Span-Level Hallucination Detection (arXiv:2504.18639)" entry.
      PRECONDITIONS (step 0, check BEFORE building):
        a. The v3 facts corpus (data/realistic_factual_corpus_v3.jsonl, from exp3640) present with the
           {question, answer, is_hallucination, evidence_passage, model_confidence} schema. If absent ->
           "complete: blocked_no_v3_facts_corpus".
        b. An NLI checkpoint loadable (a DeBERTa-MNLI / MiniLM-NLI via transformers, GPU if available). If none ->
           build the DISCLOSED text-statistical entailment proxy and set nli_substrate accordingly (do NOT
           silently call a heuristic "model-based").
      CONCRETE STEPS:
        1. Implement python/carnot/verify/nli_atomic_claim_grounding_verifier.py: decompose model_answer into
           atomic claims (sentence/SRL split), score each claim's entailment against evidence_passage with the
           NLI checkpoint, energy = fraction of unentailed/contradicted claims. Docstring discloses the substrate.
        2. Score the verifier on the v3 corpus. Report standalone grounding AUROC + >=3 seeds + bootstrap CI.
        3. LEAK CHECK: assert evidence excludes the gold answer; assert AUROC < 0.99; assert the score never reads
           the label. If AUROC >= 0.99, report grounding_leak_free=false and the diagnosed leak path.
        4. Compare to the .334 proxy (0.6495) and the confidence baseline (0.7446): does the real NLI verifier
           beat the proxy? does it beat confidence?
      ANTI-POISON TEST DISCIPLINE (MANDATORY): any pytest you ship MUST parametrize over the script's honest
      outcomes (built_model_based / built_proxy_disclosed / leak_detected / blocked) on REAL factual-looking
      synthetic fixtures (NOT Q1/R1/H1 placeholder tokens); NEVER hard-assert one success string against the real
      on-disk corpus. A test that fails against your own script poisons the milestone pre-test gate (the .332
      cascade). Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; nli_grounding_built MUST be a BARE top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores the cached v3 facts corpus with an NLI checkpoint; no FoVer LLM load)."
        nli_substrate:
          principle: "Declares real model-based NLI (named checkpoint) vs disclosed text-statistical proxy -- verifier-authenticity honesty."
        nli_grounding_built:
          principle: "BARE bool. True iff the verifier module was implemented and scored the corpus (model-based OR honestly-disclosed proxy). STORE AS BARE true/false -- gates exp3655."
        grounding_auroc:
          principle: "The real NLI grounding signal on the v3 corpus + CI -- the core facts-row number."
        grounding_auroc_vs_proxy_delta:
          principle: "Signed improvement over the .334 text-statistical proxy (0.6495) -- did a real model help?"
        confidence_baseline_auroc:
          principle: "The v3 confidence baseline (0.7446) -- the bar the grounding verifier must beat to add facts value."
        grounding_beats_confidence:
          principle: "True iff grounding AUROC materially > confidence baseline -- the facts-value signal."
        grounding_leak_free:
          principle: "True iff evidence excludes the gold answer AND AUROC < 0.99 AND the score never reads the label -- the exp3587 leak guard."
        evidence_excludes_gold_answer_assert:
          principle: "Asserts the retrieved evidence never contains the gold answer -- the explicit leak guard."
        n_examples:
          principle: "Sample-size rigor (>=200 for a percentage-point AUROC claim)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor (a real NLI scoring pass takes seconds-to-minutes, not microseconds)."
      ACCEPTANCE GATE:
        - condition: "nli_grounding_built == true AND grounding_leak_free == true AND grounding_auroc present"
          principle: "A trustworthy facts verifier requires it actually ran, was leak-free, and produced a real AUROC -- a leak (AUROC>=0.99) or an unbuilt verifier is not evidence."
      TERMINAL VERDICTS: "complete: real_nli_grounding_verifier_built_beats_proxy_and_confidence_facts_value_found" /
      "complete: real_nli_grounding_verifier_built_beats_proxy_not_confidence_facts_still_hard" /
      "complete: real_nli_grounding_verifier_built_proxy_disclosed_no_checkpoint" /
      "complete: blocked_no_v3_facts_corpus"
      Run: cd {project_root} && python scripts/experiment_3654_real_nli_atomic_claim_grounding_verifier.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp3655-facts-row-remeasurement-real-nli-v5
    prior_failures:
      - experiment_id: exp3642-corrected-cross-domain-remeasurement-v4
        verdict: complete_verifier_value_generalizes_to_code_not_facts_partial_scope
        addressed_by: "exp3642 measured the facts row with a text-statistical proxy (0.6495). This task re-measures it with the REAL model-based NLI grounding verifier from exp3654 -- a different verifier substrate, gated on exp3654 actually building it. Math (0.9131 frozen) and code (generalizes) are not re-run; only the facts row changes, so this is new science on the one untested method."
        retire_if_same_verdict: true
    milestone: "2026.06.335"
    title: "Re-measure the FACTS row with the REAL NLI grounding verifier (exp3654) vs the strong confidence baseline — does factual hallucination grounding generalize once a real model is used? (the core-mission answer)"
    priority: critical
    max_turns: 50
    agent_type: codex
    model: gpt-5.5
    requires_codex: true   # gemini quota exhausted; codex 0.135.0 verified working; requires_codex bypasses GEMINI_FORCE
    estimated_wall_time_min: 20
    track: evidence
    inference_substrate: verifier_ensemble_against_cached_candidates
    requires_gpu: false
    gated_on:
      - upstream: exp3654-real-nli-atomic-claim-grounding-verifier
        artifact_field: nli_grounding_built
        op: '=='
        value: true
    deliverable: results/experiment_3655_facts_row_remeasurement_real_nli_v5.json
    prompt: |
      CONTEXT: the facts row is the original escape-LLM-hallucinations mission. .334 (exp3642) found it does not
      generalize, but only with a proxy. exp3654 built the real model-based NLI grounding verifier. This task
      re-measures the facts row fairly: real NLI grounding verifier vs confidence baseline, leak-free, with a
      VALID positive control (the row actually RAN with headroom). NULL DISCIPLINE (FALSE_NEGATIVE_RISK): a
      "facts does not generalize" verdict is only trustworthy if the verifier fired on a headroom-bearing corpus
      (confidence baseline materially < 1.0) AND was leak-free.
      EXISTING CODE TO READ FIRST: results/experiment_3654 (nli_grounding_built, grounding_auroc, grounding_leak_free)
      and results/experiment_3640 (the v3 corpus + confidence baseline) via scripts/summarize_artifact.py;
      results/experiment_3642 (the proxy facts row, for the before/after delta).
      PRECONDITIONS (step 0): exp3654 nli_grounding_built==true AND grounding_leak_free==true. If not ->
      "complete: blocked_nli_grounding_verifier_unavailable_or_leaky".
      CONCRETE STEPS:
        1. Score the real NLI grounding verifier on the v3 facts corpus; grounding AUROC + >=3 seeds + bootstrap
           CI; confidence-baseline AUROC + CI; grounding-minus-confidence delta + paired CI.
        2. At a fixed confidence FPR, compute the conditional catch-rate (errors the grounding verifier catches
           that confidence misses) + McNemar paired test -- the facts second-pair-of-eyes signal.
        3. Honest per-row verdict vs the .334 proxy result: generalizes (grounding materially > 0.5 AND >=
           confidence) / domain-bound (grounding ~0.5 OR < confidence). Compare to the 0.6495 proxy: did using a
           real model change the answer?
      ANTI-POISON TEST DISCIPLINE (MANDATORY): parametrize any pytest over the honest outcomes
      (generalizes / domain-bound / blocked) on realistic synthetic fixtures; NEVER hard-assert one success
      string against the real corpus. Run your own test green BEFORE finishing.
      REQUIRED ARTIFACT FIELDS (principle: documents WHY; facts_generalize_real_nli MUST be a BARE top-level bool):
        honest_verdict:
          principle: "Terminal prefix for reconciler classification."
        inference_substrate: "verifier_ensemble_against_cached_candidates (principle: scores the cached v3 corpus; no LLM load)."
        grounding_auroc_real_nli:
          principle: "The real NLI grounding signal on facts + CI -- the corrected facts-row number."
        confidence_baseline_auroc:
          principle: "The bar to beat (0.7446) -- facts value requires beating confidence."
        grounding_minus_confidence_delta:
          principle: "Signed paired delta + CI -- the additive facts value over confidence alone."
        facts_conditional_catch_rate:
          principle: "Errors the grounding verifier catches that confidence misses -- the facts second-pair-of-eyes signal."
        mcnemar_p_facts:
          principle: "Paired significance of the grounding-vs-confidence disagreement (not just a point estimate)."
        facts_generalize_real_nli:
          principle: "BARE bool. True iff the real NLI grounding verifier materially beats 0.5 AND >= confidence baseline, leak-free -- the corrected core-mission answer. STORE AS BARE true/false."
        real_nli_vs_proxy_delta:
          principle: "Did using a real model change the .334 proxy answer (0.6495)? -- the methodological correction."
        positive_control_valid:
          principle: "True iff the verifier fired on a headroom-bearing corpus (confidence < 0.95) leak-free -- a null without this is uninformative."
        n_examples:
          principle: "Sample-size rigor (>=200)."
        random_seed:
          principle: "Determinism precondition."
        reproducibility_checksum:
          principle: "Drift detection."
        duration_s:
          principle: "Plausibility floor."
      ACCEPTANCE GATE:
        - condition: "grounding_auroc_real_nli present AND confidence_baseline_auroc present AND positive_control_valid == true"
          principle: "A corrected facts verdict requires the real verifier fired on a headroom-bearing leak-free corpus vs a measured confidence baseline -- otherwise it repeats the .334 proxy limitation."
      TERMINAL VERDICTS: "complete: facts_generalize_with_real_nli_334_proxy_understated_facts_value" /
      "complete: facts_domain_bound_even_with_real_nli_334_negative_confirmed_earned" /
      "complete: blocked_nli_grounding_verifier_unavailable_or_leaky"
      Run: cd {project_root} && python scripts/experiment_3655_facts_row_remeasurement_real_nli_v5.py
      Do NOT push. Do NOT modify scripts/research_conductor.py.

