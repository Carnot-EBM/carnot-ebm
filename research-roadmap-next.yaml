    experiment_id, task_id, milestone, run_date: principle: Identify the actual invocation.
    honest_verdict, verdict_class: principle: Use complete_* terminal verdicts and exactly positive | circular_positive | null | blocked | disqualified | partial. Partial means unfinished owned work; unchanged external failures mean blocked.
    gate_check_summary: principle: Every blocked result names upstream/path/hash, exact field, operator, expected and observed value. Missing evidence differs from measured zero.
    inference_substrate, inference_substrate_class, MODEL_SPECS, model_invocation_counts: principle: Record actual current calls; cached provenance does not imply a model load.
    rows, intended_count, completed_count, failed_count, censored_count, excluded_count, independent_count: principle: Retain every unit/arm/condition, metric numerator/denominator and missing status. Seeds and repeats do not add independent sources.
    verifier_is_oracle, exposure_scope, independent_generalization_score, generalized_learning_benefit_score: principle: Oracle-defined success is circular_positive. Reused development sources cannot establish independent generalization; both generalization scores remain zero here.
    required_checks_passed, flagged_adversarial, acceptance_gates, validation_receipts, terminal_validation_sidecar_path: principle: Failed owned checks disqualify and set readiness to zero. Readiness is separate from scientific benefit.
    preconditions_checked, duration_s, random_seed, reproducibility_checksum, source_artifact_hashes, code_config_hashes, raw_shard_hashes, phase_spans: principle: Bind actual work, code and input bytes to independently replayable evidence.
    cited_upstream_artifacts, field_principles: principle: Name imported fields and hashes, and explain each added field.
    current_contract_ready_score, margin_protocol_ready_score: principle: Expose separate administrative and science-method readiness.
    protocol_path, protocol_sha256, objective_equations, frozen_roles, current_code_snapshots, canonical_tasks_sha256: principle: Fix training and selection before evaluation.
    Run command: cd {project_root} && PYTHONPATH=python:. PYTHONUNBUFFERED=1 .venv/bin/python -u scripts/experiments/experiment_8234_v712_decision_margin_methods.py --date {date}
