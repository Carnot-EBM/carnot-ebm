  - id: exp6366-repaired-live-factor-proposal-authenticity
    milestone: "2026.08.548"
    deliverable: results/experiment_6366_repaired_live_factor_proposal_authenticity.json
    title: "Gated repaired three-model live factor proposal authenticity canary"
    priority: critical
    track: self-learning
    requires_gpu: true
    max_turns: 50
    estimated_wall_time_min: 120
    agent_type: codex
    model: gpt-5.5
    gated_on:
      - upstream: exp6365-gguf-child-failure-forensics-runtime-contract
        artifact_field: gguf_runtime_observability_ready_score
        op: "=="
        value: 1.0
    prior_failures:
      - experiment_id: exp6352-live-factor-proposal-authenticity-preflight
        verdict: "complete_null: live generation ran but authenticity readiness gates did not all pass"
        addressed_by: "This canary runs only after the new observable runtime proves nonempty completions for all models, uses source-bound obligation parsing, and rejects source-artifact drift and decomposition substitution."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6352 attempted this scientific boundary but no model produced a token. Exp6365 is a materially changed prerequisite that retains child diagnostics and must report gguf_runtime_observability_ready_score=1.0 before this task is dispatched. The purpose here is authenticity, not utility: prove that fresh executable failure events cause real local models to emit bounded factor-edit proposals that are preserved raw, parsed without source substitution, and judged only by exact checkers.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md and {project_root}/CLAUDE.md
      - {project_root}/results/experiment_6365_gguf_child_failure_forensics_and_runtime_contract.json
      - {project_root}/python/carnot/experiment_6352_live_factor_proposal_authenticity_preflight.py and its focused test
      - {project_root}/python/carnot/experiment_6344_counterexample_factor_proposal_calibration.py
      - {project_root}/results/experiment_6342_anytime_evalue_release_ledger.json through {project_root}/results/experiment_6346_certified_factor_evolution_safety_audit.json
      - {project_root}/openspec/capabilities/continuous-learning/spec.md and {project_root}/openspec/capabilities/self-learning/spec.md
      - {project_root}/research-references.md V548 marker, especially arXiv:2608.10627

      TASK
      Run a small repaired authenticity canary with all three mandatory local GGUF families. MODEL_SPECS must include unsloth/Qwen3.6-35B-A3B-GGUF, unsloth/gemma-4-31B-it-GGUF, and unsloth/gemma-4-26B-A4B-it-GGUF from cached_sota_pair(). Use only embedded GGUF tokenizers. Generate fresh executable events from licensed local generators. Preserve raw outputs before parsing. Bind every parsed obligation and factor edit to exact source spans so a decomposer cannot replace event content with its model prior. Keep the released factor snapshot read-only throughout each proposal call. Exact checkers are the only correctness oracle.

      CONCRETE STEPS
      0. Revalidate the structured gate and Exp6365 artifact through scripts/summarize_artifact.py. Recheck model files, embedded tokenizers, GPU offload, VRAM rise, disk, context capacity, and output sidecar paths before generation.
      1. Seal a balanced canary manifest before model calls. Include at least 12 fresh events across at least three executable constraint families, balanced by structure and surface relabeling. Record generator licenses and hashes.
      2. Freeze the active factor snapshot. Give each model the same source event, exact minimized counterexample, bounded edit schema, and read-only snapshot at matched temperature and token budget.
      3. Use the Exp6365 child contract. Preserve nonempty raw bytes before any parser. Record stdout, stderr, exit, token, timing, GPU, source, command, prompt, and dispatcher receipts.
      4. Parse only the bounded factor-edit schema. For every obligation and proposed edit, record source-span alignment. Count context-memory substitutions, unsupported obligations, invalid edits, timeouts, and abstentions as failures, never as proposals.
      5. Prove same-step isolation by mutation tests. A proposal must not read its own pending write or modify the released snapshot, exact checker, event manifest, or protected validation set.
      6. Run exact outcome checks after the raw proposal and parse are frozen. Record valid, invalid, exact-pass, exact-fail, and abstain counts by model. Make no comparative utility claim.
      7. Add REQ-* and SCENARIO-* entries first. Write focused tests for raw-before-parse, source binding, isolation, empty output, child failure, and oracle separation. Run focused tests and coverage, spec coverage, applicable E2E checks, adversarial_verify, determination-preservation lint, and root-clutter sweep.
      8. Set repaired_live_factor_proposal_authenticity_ready_score=1.0 only if all three families have authenticated nonempty calls, at least one source-bound parse-valid proposal, zero source substitutions, zero same-step writes, and complete exact-check receipts. Otherwise finish honestly.

      Required deliverable: {project_root}/results/experiment_6366_repaired_live_factor_proposal_authenticity.json.
