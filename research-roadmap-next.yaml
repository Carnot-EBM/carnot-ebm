milestone: "2026.08.571"
milestone_title: "Auditable Proof Graphs and Poison-Resistant Self-Learning"
milestone_doc: openspec/change-proposals/research-roadmap-vNEXT.md
tasks:
  - id: exp6575-v571-clean-evidence-and-flagship-qualification
    milestone: "2026.08.571"
    deliverable: results/experiment_6575_v571_clean_evidence_and_flagship_qualification.json
    title: "V571 clean evidence and flagship qualification replay"
    priority: critical
    track: evidence-and-model-runtime
    requires_gpu: true
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 240
    model: opus
    prior_failures:
      - experiment_id: exp6571-v570-evidence-gate-and-retirement-root
        verdict: "complete_v570_evidence_gate_and_retirement_root_ready: V569 eligibility includes blocked and missing scopes honestly; the hash-only GGUF cause, V570 gates, changed mechanisms, retirement rules, model, ARC, hardware, Rust, attacks, and protected files close without claiming extraction or graph-Potts utility ran"
        addressed_by: "Exp6575 does not import Exp6571 as eligible evidence. It creates fresh model, method-replay, evidence-link, duration, and live-verifier rows in one terminal V571 qualification artifact."
        retire_if_same_verdict: true
      - experiment_id: exp6572-content-derived-gguf-metadata-resolver
        verdict: "complete_content_derived_gguf_metadata_ready: all three hash-only flagship blobs passed bounded content and independent cache provenance checks; every negative fixture failed closed; no LLM was loaded"
        addressed_by: "Exp6575 reuses the shipped resolver code but executes fresh positive and negative checks inside a substantive all-family qualification workload; it does not cite the duration-flagged Exp6572 aggregate."
        retire_if_same_verdict: true
      - experiment_id: exp6573-sequential-flagship-gguf-admission-v2
        verdict: "complete: admitted=['unsloth/Qwen3.6-35B-A3B-GGUF', 'unsloth/gemma-4-31B-it-GGUF', 'unsloth/gemma-4-26B-A4B-it-GGUF']; blocked=[]; all three families passed runtime admission; no model-quality claim is made"
        addressed_by: "Exp6573 ended at 52.068 seconds and was structurally flagged. Exp6575 preregisters a larger evidence workload with fresh content checks, negative fixtures, repeated live telemetry, unload recovery, method replay, link-by-link provenance, and terminal live verification."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Milestone 2026.08.570 completed four tasks. Exp6572 fixed hash-only GGUF identity, Exp6573 produced actual sequential receipts for all three mandated families, and Exp6574 froze joint sufficiency. Exp6571, Exp6572, and Exp6573 later received DURATION_TOO_SHORT findings; Exp6573's declared live-inference task lasted 52.068 seconds against a 60-second floor. Flagged aggregates are not valid downstream inputs even when their honest verdict says complete. V571 needs a fresh qualifying evidence root. Do not edit or relabel any V570 artifact. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and {project_root}/openspec/change-proposals/research-roadmap-vNEXT.md
      - {project_root}/results/experiment_6571_v570_evidence_gate_and_retirement_root.json through {project_root}/results/experiment_6574_joint_sufficiency_method_contract.json
      - {project_root}/ops/conductor-log.md, {project_root}/research-complete.yaml, {project_root}/ops/exclusion_manifest.yaml, {project_root}/ops/known-issues.md, and the current adversarial verifier reports
      - cached_sota_pair(), resolve_cached_gguf(), the content-derived GGUF resolver, embedded-tokenizer launch, CUDA offload, process/GPU telemetry, unload, recovery, duration, and atomic-artifact helpers plus their tests
      - {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/artifact_convention_audit.py, {project_root}/scripts/roadmap_schema.py, and {project_root}/scripts/exclusion_manifest_lint.py
      - relevant capability specs, {project_root}/_bmad/architecture.md, {project_root}/_bmad/traceability.md, {project_root}/ops/status.md, {project_root}/ops/changelog.md, and {project_root}/ops/e2e-test-plan.md

      TASK
      Create a fresh V571 qualification artifact that establishes clean runtime evidence for all three mandated flagship GGUF families and replays the clean Exp6574 joint-sufficiency fixtures. Generate new receipts. Do not treat a structurally flagged V570 aggregate as valid evidence.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Legacy Qwen3.5-0.8B and gemma-4-E4B-it may run CPU smoke only. They cannot satisfy qualification.

      CONCRETE STEPS
      0. PRECONDITIONS: record protected-file hashes, V570 artifact hashes and structural findings, Exp6574 eligibility, CPU, RAM, disk, CUDA llama.cpp support, per-GPU free memory and active processes, cache provenance, exact model order, timeout policy, and the expected inference substrate. Do not kill unrelated GPU work.
      1. Add or confirm REQ-* and SCENARIO anchors for fresh-evidence qualification, flagged-input exclusion, all-family runtime receipts, bounded GGUF inspection, embedded tokenizers, CUDA offload, one-model residency, clean unload, method replay, link provenance, terminal duration, and atomic output. Write focused tests first for changed logic.
      2. Reproduce the three V570 structural dispositions as context rows. Mark them ineligible. Never copy their readiness fields into a V571 readiness reducer.
      3. Run fresh bounded positive metadata checks for all three cached model blobs and fresh negative fixtures for non-GGUF, truncated, tokenizer-only, repository-mismatch, and malformed metadata cases. Bind repository, revision, local blob hash, architecture, quantization, and embedded tokenizer.
      4. Freeze model order. Load exactly one mandated family at a time through llama.cpp. Produce a bounded nonempty generation. Record PID, command digest, model hash, CUDA device, layer offload, load and token timing, repeated GPU memory/utilization samples, raw output hash, stop reason, exit, stderr hash, and unload recovery. Preserve other GPU processes.
      5. Replay Exp6574's single-hop, valid multi-hop, missing-hop, wrong-span, and cyclic-graph fixtures with the shipped exact reducer. Hash every fixture and result. Do not change acceptance after observing outputs.
      6. Emit a link-by-link evidence graph from each top-level field to raw receipt hashes and its exact reducer. Attack stale PIDs, reused output, zero-layer offload, tokenizer-only loads, family substitution, symlink aliases, missing unload, aggregate readiness with one failed family, missing method fixtures, duration field spoofing, and V570 evidence laundering.
      7. Set top-level v571_flagship_evidence_ready_score=1.0 only when every fresh family row, metadata fixture, unload check, method replay, protected-file check, evidence link, and live structural verification passes. Set top-level joint_sufficiency_method_replay_ready_score=1.0 only from fresh fixture rows.
      8. If this new task receives the same structural disposition as the V570 evidence chain, keep readiness at 0.0, use an honest blocked or disqualified verdict, and activate the repeat-retirement rule. Do not pad time with sleep; complete the substantive preregistered work.
      9. Write one terminal artifact atomically. Run focused unit tests, lint, spec coverage, row consistency, artifact convention audit, adversarial verification, applicable model-runtime E2E checks, and final git status.

      Required deliverable: {project_root}/results/experiment_6575_v571_clean_evidence_and_flagship_qualification.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state prevents a bootstrap artifact from posing as clean qualification."
        honest_verdict:
          principle: "The verdict names qualified and failed families and the method-replay disposition."
        verdict_class:
          principle: "A closed class keeps runtime readiness separate from positive science."
        gate_check_summary:
          principle: "Any blocked verdict names the failed precondition and observed value."
        v570_ineligible_context_rows:
          principle: "Flagged prior artifacts remain visible without entering the V571 readiness reducer."
        rows:
          principle: "Each model, metadata fixture, method fixture, unload check, and attack remains independently recheckable."
        model_specs:
          principle: "The artifact identifies every mandated family and excludes smoke substitutions."
        model_revision_and_hash_receipts:
          principle: "Repository, revision, GGUF content, and embedded-tokenizer identity bind each runtime row."
        process_and_gpu_receipts:
          principle: "Live process and repeated CUDA samples prove actual model execution and isolation."
        raw_generation_receipts:
          principle: "New output bytes and stop receipts distinguish execution from filename prediction."
        unload_and_recovery_rows:
          principle: "One family cannot contaminate the next family's admission evidence."
        joint_sufficiency_method_replay_rows:
          principle: "Fresh exact fixture replay keeps the clean method contract reachable."
        evidence_link_rows:
          principle: "Every headline field traces through raw hashes and an explicit reducer."
        v571_flagship_evidence_ready_score:
          principle: "This exact top-level binary field gates the immutable source stream."
        joint_sufficiency_method_replay_ready_score:
          principle: "This exact top-level binary field gates live joint-proof extraction."
        aggregate_row_recomputation:
          principle: "Readiness scores derive only from emitted fresh rows."
        preconditions_checked:
          principle: "Resource and protected-file receipts separate environment blocks from runtime failure."
        protected_files_unchanged:
          principle: "The task preserves research-roadmap.yaml and scripts/research_conductor.py."
        inference_substrate:
          principle: "The declared live llama.cpp substrate selects the correct structural checks."
        verifier_is_oracle:
          principle: "Exact runtime qualification is infrastructure authority and cannot create positive science."
        field_provenance:
          principle: "Each field names its source rows, hashes, and reducer."
        duration_s:
          principle: "Monotonic duration supports the fresh evidence receipt and structural sanity check."
        tests_run:
          principle: "Named commands, exits, and durations make qualification reproducible."
        reproducibility_checksum:
          principle: "A final content hash detects terminal artifact mutation."
      Set inference_substrate=live_llm_inference, verifier_is_oracle=true, and seeds explicitly. A ready qualification uses verdict_class=null; use partial, blocked, or disqualified when warranted. Never use positive for this task.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6575_v571_clean_evidence_and_flagship_qualification --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6576-immutable-flagship-source-span-stream-v3
    milestone: "2026.08.571"
    deliverable: results/experiment_6576_immutable_flagship_source_span_stream_v3.json
    title: "Immutable all-family source-span claim stream v3"
    priority: critical
    track: flagship-evidence-stream
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 300
    prior_failures:
      - experiment_id: exp6568-immutable-flagship-source-span-claim-stream
        verdict: "blocked_gate_check_failed"
        addressed_by: "Exp6568 saw all_mandated_models_loaded_score=0. V571 gates on a new clean all-family execution artifact, writes raw rows before extraction, and preserves failures instead of depending on the V569 blocked admission field."
        retire_if_same_verdict: true
    gated_on:
      - upstream: exp6575-v571-clean-evidence-and-flagship-qualification
        artifact_field: v571_flagship_evidence_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      Exp6575 is the only V571 authority for clean flagship runtime evidence. This task creates the immutable live source stream needed by proof extraction and continuous learning. It measures source and response provenance, not proof quality. Every family and every failure must remain visible. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V571 roadmap document
      - {project_root}/results/experiment_6575_v571_clean_evidence_and_flagship_qualification.json and the clean {project_root}/results/experiment_6574_joint_sufficiency_method_contract.json
      - the pinned DRIFT or current exact-constraint corpus intake, source-byte binding, prompt freezing, raw-response, launch-receipt, cost, and atomic-output helpers plus their tests
      - cached_sota_pair(), resolve_cached_gguf(), embedded-tokenizer llama.cpp launch, sequential GPU isolation, timeout, cleanup, and telemetry helpers
      - relevant extraction, model-ingestion, artifact, and evidence specs; exclusions; architecture; traceability; status; changelog; and E2E plan

      TASK
      Generate one content-pinned all-family source-span claim stream. Freeze sources, prompts, seeds, family order, budgets, and stop rules before inference. Store raw rows before any proof extraction or quality filtering.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Legacy small models may smoke-test CPU plumbing only and cannot satisfy family coverage.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate the structured gate and record its expected and observed value, upstream path and hash, corpus commit and license, source-file hashes, split, sample count, CPU, RAM, disk, CUDA state, per-GPU processes, model receipts, seeds, budgets, and protected-file hashes. Stop closed when the gate fails.
      1. Add or confirm REQ-* and SCENARIO anchors for immutable source intake, frozen prompts, all-family local inference, raw-before-derived writes, failure retention, model lineage, cost accounting, sequential unload, and atomic output. Write focused tests first.
      2. Select a bounded, content-pinned corpus slice with exact source bytes and enough multi-hop and constraint-bearing examples to test joint sufficiency. Freeze inclusion before inference. Do not choose rows from model outcomes.
      3. Freeze one prompt template and exact generation budget. For each source unit and mandated family, record source hash, prompt hash, seed, repository/revision/GGUF hash, process command digest, GPU samples, raw response bytes or byte hash plus recoverable path, token counts, latency, stop reason, exit, and stderr hash.
      4. Write each raw row before parsing. Preserve timeouts, malformed outputs, refusal, empty output, no-claim output, and process failure. Do not retry selectively or drop an inconvenient family.
      5. Run only bounded, preregistered segmentation needed to identify candidate claim spans. Store diagnostics as derived fields. Do not compile exact obligations, tune prompts, or release claims in this task.
      6. Recompute charged cost and family coverage from rows. Attack source aliasing, corpus drift, prompt changes, seed changes, duplicate raw output, hidden retries, family substitution, failure filtering, output-path loss, cross-model residency, and aggregate readiness with one family absent.
      7. Set top-level immutable_claim_stream_ready_score=1.0 only when all three families have qualified rows, raw lineage is complete, at least one claim-bearing row exists per family, failures remain represented, costs recompute, and protected files are unchanged. Poor claim quality is an honest stream result, not a readiness block.
      8. If the structured gate fails, write a terminal blocked artifact with gate_check_summary naming v571_flagship_evidence_ready_score and the observed value. If the same upstream-evidence block as Exp6568 repeats, activate retirement.
      9. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, row consistency, artifact convention audit, adversarial verification, applicable live-model E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6576_immutable_flagship_source_span_stream_v3.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The source stream closes terminally even when the gate or one family fails."
        honest_verdict:
          principle: "The verdict states stream completeness without claiming extraction quality."
        verdict_class:
          principle: "Stream readiness remains null, partial, blocked, or disqualified evidence."
        gate_check_summary:
          principle: "A block names the exact upstream field and observed value."
        corpus_receipt:
          principle: "Commit, license, split, source hashes, and inclusion rules prevent benchmark drift."
        model_specs:
          principle: "All three mandated families are explicit and smoke substitutions are excluded."
        model_revision_and_hash_receipts:
          principle: "Every response binds to repository, revision, GGUF bytes, and embedded tokenizer."
        rows:
          principle: "Each source-family unit carries raw, process, token, timing, cost, and failure metrics."
        raw_response_receipts:
          principle: "Immutable output bytes precede parsing and preserve failures."
        process_and_gpu_receipts:
          principle: "Actual sequential CUDA execution is recheckable per family."
        parser_diagnostic_rows:
          principle: "Segmentation failures remain diagnostics and cannot silently filter the stream."
        immutable_claim_stream_ready_score:
          principle: "This exact top-level binary field gates proof extraction."
        aggregate_row_recomputation:
          principle: "Coverage, counts, latency, and cost derive only from emitted rows."
        preconditions_checked:
          principle: "Gate, data, resource, and model receipts distinguish blocks from stream outcomes."
        protected_files_unchanged:
          principle: "The task preserves both protected orchestration files."
        inference_substrate:
          principle: "The live local llama.cpp path is explicit for structural verification."
        verifier_is_oracle:
          principle: "This task creates evidence and makes no verifier-backed utility claim."
        field_provenance:
          principle: "Every aggregate names raw rows, hashes, and reducer code."
        duration_s:
          principle: "Monotonic runtime reveals truncated model or corpus work."
        tests_run:
          principle: "Named tests, exits, and durations establish reproducibility."
        reproducibility_checksum:
          principle: "A final hash protects the terminal stream manifest."
      Set inference_substrate=live_llm_inference, verifier_is_oracle=false, and explicit seeds. A complete immutable stream uses verdict_class=null; it does not use positive.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6576_immutable_flagship_source_span_stream_v3 --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6577-flagship-source-stream-independent-audit
    milestone: "2026.08.571"
    deliverable: results/experiment_6577_flagship_source_stream_independent_audit.json
    title: "Independent immutable flagship source-stream audit"
    priority: high
    track: independent-audit
    requires_gpu: false
    per_unit_rows: true
    max_turns: 30
    estimated_wall_time_min: 60
    agent_type: codex
    model: gpt-5.6-sol
    prompt: |
      CONTEXT
      Exp6576 should contain immutable source and response rows from all three mandated families. This audit always runs. It must diagnose a missing or blocked upstream artifact without consuming a model and must not trust upstream aggregate fields. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, and the V571 roadmap document
      - {project_root}/results/experiment_6575_v571_clean_evidence_and_flagship_qualification.json and the expected {project_root}/results/experiment_6576_immutable_flagship_source_span_stream_v3.json
      - source-byte, raw-response, model-lineage, process-receipt, cost, checksum, duplicate, and row-reducer audit helpers plus tests
      - {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/artifact_convention_audit.py, and relevant evidence specs and E2E checks

      TASK
      Independently replay the immutable source-stream contract. Recompute every coverage and cost claim from raw rows. Detect hidden filtering, duplicates, prompt drift, model substitution, and missing failure rows. Emit the exact top-level gate field required by Exp6578.

      CONCRETE STEPS
      0. PRECONDITIONS: record expected artifact paths, existence, hashes, schema versions, disk, Python, audit-tool versions, protected-file hashes, and whether raw response bytes or recoverable content-addressed paths are present. Do not synthesize missing rows.
      1. Add or confirm REQ-* and SCENARIO anchors for independent stream replay, missing-input diagnosis, all-family coverage, failure retention, duplicate detection, aggregate recomputation, and atomic output. Write focused tests first.
      2. Recompute corpus commit, source hashes, prompt hashes, model repository/revision/GGUF hashes, family coverage, seeds, order, raw-response hashes, stop reasons, process exits, token totals, latency, and charged cost without importing Exp6576 aggregates.
      3. Verify raw rows were recorded before parser-derived fields where receipts permit. Confirm every timeout, malformed output, refusal, empty output, and process failure remains in denominators.
      4. Attack source aliases, duplicate units, copied responses across models, selective retries, hidden row drops, legacy-model substitution, inconsistent family labels, post-outcome prompt changes, null-only rows, missing content paths, and aggregate/row contradictions.
      5. Emit one audit row per expected source-family unit and one attack row per invariant. Set top-level claim_stream_audit_ready_score=1.0 only when all eligible rows replay, all families are present, failures remain visible, and upstream readiness recomputes.
      6. If Exp6576 is missing or blocked, write honest_verdict beginning blocked_ and gate_check_summary with the missing path or exact failed field and observed value. Do not call missing science null.
      7. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, row consistency, artifact convention audit, adversarial verification, applicable evidence E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6577_flagship_source_stream_independent_audit.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "The independent audit terminates even when upstream evidence is absent."
        honest_verdict:
          principle: "The verdict states whether lineage and coverage independently replay."
        verdict_class:
          principle: "The audit uses only null, partial, blocked, or disqualified classes."
        gate_check_summary:
          principle: "A block names the exact missing artifact or failed field and observed value."
        upstream_artifact_receipt:
          principle: "Path, hash, status, and schema bind the object under audit."
        rows:
          principle: "Every expected source-family unit carries independently recomputed metrics."
        failure_retention_rows:
          principle: "Failure classes cannot vanish from an aggregate denominator."
        duplicate_and_drift_attack_rows:
          principle: "Aliases, copied output, prompt drift, and selective retries are tested explicitly."
        claim_stream_audit_ready_score:
          principle: "This exact top-level binary field gates semantic-block extraction."
        aggregate_row_recomputation:
          principle: "Every audit headline derives from emitted rows."
        preconditions_checked:
          principle: "Input and tool receipts distinguish a block from a failed replay."
        protected_files_unchanged:
          principle: "The audit preserves both protected orchestration files."
        inference_substrate:
          principle: "This is immutable artifact replay with no new LLM inference."
        verifier_is_oracle:
          principle: "The audit is evidence authority and therefore cannot create positive science."
        field_provenance:
          principle: "Each field identifies raw rows, hashes, and independent reducer code."
        duration_s:
          principle: "Monotonic duration exposes skipped replay or attack work."
        tests_run:
          principle: "Named commands and exits make the audit reproducible."
        reproducibility_checksum:
          principle: "A final hash detects audit mutation."
      Set inference_substrate=immutable_source_stream_independent_replay_no_llm and verifier_is_oracle=true. A clean audit uses verdict_class=null, never positive.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6577_flagship_source_stream_independent_audit --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6578-semantic-block-joint-proof-extractor-v3
    milestone: "2026.08.571"
    deliverable: results/experiment_6578_semantic_block_joint_proof_extractor_v3.json
    title: "Semantic-block joint proof extractor v3"
    priority: critical
    track: exact-verification
    requires_gpu: true
    per_unit_rows: true
    max_turns: 50
    estimated_wall_time_min: 240
    gated_on:
      - upstream: exp6575-v571-clean-evidence-and-flagship-qualification
        artifact_field: joint_sufficiency_method_replay_ready_score
        op: "=="
        value: 1.0
      - upstream: exp6576-immutable-flagship-source-span-stream-v3
        artifact_field: immutable_claim_stream_ready_score
        op: "=="
        value: 1.0
      - upstream: exp6577-flagship-source-stream-independent-audit
        artifact_field: claim_stream_audit_ready_score
        op: "=="
        value: 1.0
    prompt: |
      CONTEXT
      V570 froze source-byte obligation nodes, dependency edges, exact releases, and attacks. V571 adds four semantic-block well-formedness conditions from arXiv:2608.19475: acyclicity, single rule ownership, constraint domination, and totality or ambiguity-stop. The task compares release arms on one immutable all-family stream. Generated nodes and spans are proposals; only existing whitelisted exact checkers may release a claim. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, and the V571 roadmap document
      - {project_root}/results/experiment_6574_joint_sufficiency_method_contract.json through {project_root}/results/experiment_6577_flagship_source_stream_independent_audit.json
      - source-span binding, obligation node/edge schema, exact compiler registry, joint-sufficiency reducer, abstention, cost, and attack helpers plus tests
      - current exact verifier, Z3, constraint graph, model-launch, raw-row, artifact, and row-reducer modules
      - relevant capability specs, exclusion entries for generated ConstraintIR and answer transport, architecture, traceability, status, changelog, and E2E plan

      TASK
      Implement and evaluate semantic-block joint proof extraction on the immutable flagship stream. Compare no filter, atomic-span-only support, and hop-conditioned joint graph support under matched rows and budgets. Enforce the four well-formedness conditions before release.

      MODEL_SPECS
      - unsloth/Qwen3.6-35B-A3B-GGUF
      - unsloth/gemma-4-31B-it-GGUF
      - unsloth/gemma-4-26B-A4B-it-GGUF
      Use these local families for bounded proposal extraction on their own immutable responses. A smoke model cannot carry a result.

      CONCRETE STEPS
      0. PRECONDITIONS: evaluate all structured gates and record expected and observed values, upstream paths and hashes, compiler registry hash, frozen method hash, corpus and raw-row hashes, CPU, RAM, disk, CUDA state, model receipts, seeds, arm budgets, and protected-file hashes. Stop closed if any gate fails.
      1. Add or confirm REQ-* and SCENARIO anchors for semantic blocks, dependency edges, source ownership, acyclicity, single rule ownership, constraint domination, totality or ambiguity-stop, exact compiler ownership, matched arms, abstention, and atomic output. Write tests first.
      2. Freeze the three arms and split before proposal inference. Use the same source-family units and budgets. The no-filter arm releases its candidate, the atomic arm requires independently supported atomic nodes, and the graph arm additionally requires all needed hops and all four well-formedness conditions.
      3. Produce bounded proposed blocks, source spans, edges, rules, decisions, and explicit open questions from each mandated local family. Preserve raw proposal bytes and parsing failures. Do not generate or repair full ConstraintIR.
      4. Bind each node to immutable source bytes. Dispatch only to a frozen whitelisted exact compiler/checker. Record verifier_is_oracle, checker version, obligation hash, result, ownership, and release reducer input. Unsupported semantics abstain.
      5. Require graph acyclicity, one owner per exact rule, a governing constraint on every released decision path, and total coverage or explicit ambiguity-stop. Missing nodes, edges, sources, rules, or checks must abstain.
      6. Emit matched per-unit results for precision, exact-certified composed-claim coverage, unsafe release, abstention, graph validity, hop coverage, parser failure, latency, token use, and charged cost. Use paired uncertainty or exact paired counts where valid.
      7. Attack wrong spans, missing hops, cycles, duplicate rule ownership, undominated decisions, hidden open questions, unsupported checker dispatch, source aliasing, model self-certification, family leakage, post-outcome graph edits, and aggregate claims contradicted by rows.
