           If ANY precondition fails -> honest_verdict `blocked_<resource>` and STOP. DO NOT fabricate.
        1. SYNTHESIS (2605.02395): build a verifiable first-error corpus -- construct/borrow a correct symbolic chain, inject a template-aware error at a KNOWN step k, recompute steps >k under the corrupted state, and VERIFY step k is NOT derivable from its prefix (prefix-invalid) while the suffix stays trajectory-consistent. Keep the source-domain label. n>=1000 synthetic traces with ground-truth first-error index.
