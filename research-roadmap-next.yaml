- id: exp7012-exact-intervention-pair-fixture
  title: Exact minimal constraint-intervention pair fixture
  track: infrastructure
  priority: critical
  agent_type: codex
  model: gpt-5.6-sol
  requires_gpu: false
  max_turns: 50
  estimated_wall_time_min: 180
  per_unit_rows: true
  milestone: 2026.09.614
  deliverable: results/experiment_7012_exact_intervention_pair_fixture.json
  prior_failures:
    - experiment_id: exp6999-blinded-feature-cold-audit
      verdict: complete_disqualified_blinded_feature_shortcut_gate
      addressed_by: "Exp7012 changes the causal unit from absolute candidate rows to exact minimal intervention blocks whose mutation, serialization, length, and source metadata are balanced within each block and excluded from learner input."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    V613's absolute feature bank remained shortcut-predictive even after an
    authority sidecar. V614 adopts exact minimal interventions as matched
    causal units. Every block must hold nuisance variables fixed and preserve
    exact authority labels outside the learner view before any model scoring.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/results/experiment_6984_exact_contrast_fixture.json
    - {project_root}/results/experiment_6997_authority_sidecar_rebuild.json
    - {project_root}/results/experiment_6999_blinded_feature_cold_audit.json
    - {project_root}/scripts/experiments/experiment_6984_exact_contrast_fixture.py
    - {project_root}/python/carnot/experiment_6984_exact_contrast_fixture.py
    - {project_root}/python/carnot/verifiers
    - {project_root}/openspec/capabilities/constraint-verification/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Build and freeze at least 48 exact minimal constraint-intervention pairs
    across at least four source families. Balance mutation, serialization,
    length, source bookkeeping, and label prevalence within matched blocks.
    Emit a feature-free learner fixture and hashed authority sidecar.

    CONCRETE STEPS:
    0. PRECONDITIONS: require at least four executable authority families,
       deterministic mutation and isomorphism support, and writable immutable
       fixture paths. On failure write blocked_intervention_pair_fixture with
       gate_check_summary.
    1. Add REQ-VERIFY-7012 and RED tests before implementation. Cover no-op and
       multi-edit mutations, ambiguous authority outcomes, nonminimal repairs,
       invalid isomorphisms, duplicate semantic keys, label imbalance, length
       mismatch, metadata aliases, row reordering, and sidecar leakage.
    2. For each source family build matched blocks with a clean candidate, one
       single-edit exact violation or repair, and an isomorphic surface variant.
       Prove minimality by edit distance and exact authority witnesses.
    3. Freeze at least 48 primary intervention pairs and source-group train,
       calibration, held-source, and sealed-headroom partitions before scoring.
       Do not split rows from one block across partitions.
    4. Balance mutation kind, serialization template, token/character length,
       source bookkeeping, candidate order, and label prevalence inside blocks.
       Preserve every rejected or unbalanced block as a row.
    5. Emit learner prompts keyed only by semantic content and neutral block
       position. Put exact labels, source family, split, mutation kind,
       witnesses, and authority records in a separately hashed sidecar.
    6. Replay every authority and isomorphism in a network-disabled fresh
       process. Require byte-stable learner prompts under sidecar permutation,
       replacement, deletion, and alpha-renaming.
    7. Set intervention_pair_fixture_ready_score=1 only when counts and family
       coverage pass, every accepted intervention is exact and minimal,
       nuisance balance passes, and no prohibited field reaches learner input.
       Because exact authorities define the fixture, a ready verdict is
       circular_positive, not positive.
    8. Run focused tests, Ruff, artifact validation, adversarial verification,
       row-consistency lint, OpenSpec coverage, and root-clutter checks.
       Reconcile the requirement and reporting docs you change.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below and the bare field
       intervention_pair_fixture_ready_score; preconditions_checked;
       inference_substrate (deterministic_exact_pair_fixture_no_llm);
       duration_s; source_artifact_hashes; authority_family_rows; rows;
       pair_rows; block_rows; rejected_block_rows; intervention_rows;
       minimality_rows; authority_witness_rows; isomorphism_rows;
       nuisance_balance_rows; label_balance_rows; length_balance_rows;
       serialization_balance_rows; group_split_rows; learner_prompt_path;
       learner_prompt_hash; authority_sidecar_path; authority_sidecar_hash;
       sidecar_intervention_rows; prohibited_feature_rows;
       expected_pair_count (48); observed_pair_count;
       expected_family_count (4); observed_family_count;
       intervention_pair_fixture_ready_score; random_seed;
       reproducibility_checksum; gate_check_summary with failed check,
       expected value, and observed value for any blocked verdict;
       verifier_is_oracle (true); verdict_class
       (positive | circular_positive | null | blocked | disqualified | partial);
       honest_verdict with a terminal prefix consistent with verdict_class.

    Run command: cd {project_root} && .venv/bin/python scripts/experiments/experiment_7012_exact_intervention_pair_fixture.py --date {date}
    Do NOT push. Do NOT modify scripts/research_conductor.py.

- id: exp7013-three-family-intervention-surface
  title: Three-family exact intervention response surface
  track: inference
  priority: critical
  agent_type: claude
  model: sonnet
  requires_gpu: true
  max_turns: 50
  estimated_wall_time_min: 360
  per_unit_rows: true
  milestone: 2026.09.614
  deliverable: results/experiment_7013_three_family_intervention_surface.json
  gated_on:
    - upstream: exp7012-exact-intervention-pair-fixture
      artifact_field: intervention_pair_fixture_ready_score
      op: '=='
      value: 1
  prior_failures:
    - experiment_id: exp6998-three-family-commitment-controls
      verdict: complete_null_shortcut_commitment_not_detected
      addressed_by: "Exp7013 discards self-commitment timing and instead measures teacher-forced signed responses to exact minimal violations, repairs, and isomorphic controls at matched token positions."
      retire_if_same_verdict: true
  prompt: |
    CONTEXT:
    Exp7012 freezes exact, metadata-balanced intervention pairs. V613 found no
    useful self-commitment effect across the required SOTA families. This task
    changes the measured signal to the signed teacher-forced response caused by
    one exact constraint intervention. Labels remain sealed until responses
    and checksums are frozen.

    Work at {project_root}. The execution date is {date}.

    EXISTING CODE TO READ FIRST:
    - {project_root}/CLAUDE.md and {project_root}/CODEX.md
    - {project_root}/scripts/experiment_template.py cached_sota_pair docstring
    - {project_root}/results/experiment_7012_exact_intervention_pair_fixture.json
    - {project_root}/results/experiment_6998_three_family_commitment_controls.json
    - {project_root}/results/experiment_6986_three_family_contrast_features.json
    - {project_root}/scripts/experiments/experiment_6998_three_family_commitment_controls.py
    - {project_root}/python/carnot/llm_runtime.py
    - {project_root}/openspec/capabilities/energy-verification/spec.md
    - {project_root}/openspec/capabilities/research-reporting/spec.md

    TASK:
    Score every frozen intervention block with all three mandated local GGUF
    families. Measure signed teacher-forced response changes for clean,
    minimal-violation, minimal-repair, and isomorphic conditions using matched
    prompts and positions. Freeze model outputs before opening labels.

    CONCRETE STEPS:
    0. PRECONDITIONS: require Exp7012 readiness, all frozen prompt/sidecar
       hashes, cached mandated GGUF files, CUDA llama.cpp health, one owned GPU
       lease, enough VRAM, and writable output paths. On failure write
       blocked_intervention_surface with gate_check_summary.
    1. Add REQ-ENERGY-7013 and RED tests before implementation. Cover missing
       family, CPU fallback, stale server, non-owned process, prompt mismatch,
       token-position drift, label access before freeze, duplicate rows, null
       logits, teardown failure, and implausible duration.
    2. MODEL_SPECS must include all three headline families:
       unsloth/Qwen3.6-35B-A3B-GGUF,
       unsloth/gemma-4-31B-it-GGUF, and
       unsloth/gemma-4-26B-A4B-it-GGUF. Legacy models are prohibited except an
       explicitly non-headline CPU smoke that cannot populate result rows.
    3. Acquire the conductor GPU lease and run one family at a time. Record
       model repository, filename, quantization, file hash, llama binary and
       command hash, GPU UUID/device, n_ctx, port, PID ownership, request and
       completion counters, timing, teardown, and foreign-process snapshots.
    4. Use identical semantic prompts and aligned scoring positions within
       each block. Record teacher-forced sequence log-likelihood and normalized
       signed clean-to-violation, clean-to-repair, and isomorphic deltas.
    5. Prohibit commitment timing, rationales, self-grades, source IDs,
       mutation kind, split, authority witnesses, and labels from response
       features. The task may open the sidecar only after all raw response
       rows and a freeze manifest are hashed.
    6. Report every pair and family, including failures and ties. Recompute
       direction by family and held source group with paired intervals; do not
       pool away a family reversal.
    7. Set intervention_surface_complete_score=1 when every expected
       pair-family-condition cell has a terminal row, all three families have
       authentic CUDA receipts, prompts/positions match, and the label-open
       timestamp follows the response freeze. Scientific direction may be null.
    8. Run focused tests, Ruff, artifact validation, adversarial verification,
       row-consistency lint, OpenSpec coverage, GPU cleanup checks, and
       root-clutter checks. Reconcile specs and ops docs changed.
    9. REQUIRED ARTIFACT FIELDS: field_principles with one scientific
       principle for every field below and the bare field
       intervention_surface_complete_score; preconditions_checked;
       inference_substrate (live_llm_inference); duration_s; MODEL_SPECS;
       model_rows; model_file_hashes; llama_binary_hash; command_hash;
       gpu_identity_rows; gpu_lease_rows; server_rows; request_counter_rows;
       completion_counter_rows; teardown_rows; source_artifact_hashes;
       prompt_freeze_hash; response_freeze_hash; label_opened_at;
       response_frozen_at; rows; per_pair_results; condition_rows;
       token_position_rows; signed_response_rows; family_effect_rows;
       held_source_effect_rows; tie_rows; failed_cell_rows;
