  prompt: |-
    CONTEXT: Constrained Sampling for LLMs via MCMC Perspective (arXiv:2506.05754, June 2026)
    proposes treating any LLM constraint set (grammar, SMT formula, semantic filter) as an
    energy function and applying Metropolis-Hastings acceptance/rejection. Each constraint-
    checking verifier contributes to the MH acceptance step.

    FST (Functional Symbolic Tree) live PATH A GGUF inference was validated in .233 (exp2399,
    live_path_used=A_gguf). The next step is to apply MH-constrained generation: each
    proposed token is accepted or rejected based on whether it violates Carnot's energy
    constraints (Ising energy or NSVIF Z3 verdict). This bridges Carnot's sampler
    infrastructure to LLM constrained generation.

    EXISTING CODE TO READ FIRST:
      {project_root}/python/carnot/pipeline/fst_pipeline.py (FST pipeline)
      {project_root}/python/carnot/samplers/casal_sampler.py (MH acceptance pattern)
      {project_root}/results/experiment_2399_fst_live_path_ab.json (PATH A baseline)
      {project_root}/python/carnot/verify/nsvif_z3_extractor.py (constraint checker)

    TASK: Implement constrained MH sampling in the FST pipeline. Use PATH C cached telemetry
    as baseline (no live GGUF needed for implementation). Validate the MH acceptance mechanism.

    CONCRETE STEPS:
      0. PRECONDITIONS:
         a. FST pipeline importable:
            .venv/bin/python -c "from carnot.pipeline.fst_pipeline import FSTpipeline; print('OK')" 2>/dev/null ||
            .venv/bin/python -c "import carnot.pipeline; print(dir(carnot.pipeline))"
