      - {project_root}/CLAUDE.md
      - {project_root}/CODEX.md
      - {project_root}/ops/known-issues.md
      - {project_root}/ops/e2e-test-plan.md
      - {project_root}/scripts/experiment_template.py
      - {project_root}/python/carnot/pipeline/deliverable_guard.py
      - {project_root}/scripts/determination_preservation_lint.py
      - {project_root}/scripts/root_clutter_sweep.py
      - {project_root}/tests/python
      - {project_root}/results
      - {project_root}/openspec/capabilities/research-reporting/spec.md

      TASK:
      Implement a spec-anchored, repository-wide-compatible artifact-output redirect for experiment tests; migrate representative direct writers to the shared resolver; force tests to use task-owned temporary paths; detect any attempted tracked-results write; preserve adversarial/quarantine fields; and write results/experiment_6143_test_artifact_isolation.json.

      CONCRETE STEPS:
      0. PRECONDITIONS: snapshot git status, hashes and quarantine fields for every currently modified or sentinel result, the known 45-file list, direct writer call sites, output-environment names, and protected files. Preserve all pre-existing user changes.
      1. Update the research-reporting OpenSpec with REQ-* redirectable-output-root, production-default, pytest-temp-root, direct-writer compatibility, attempted-write detection, quarantine preservation, atomic write, and unchanged-tracked-evidence scenarios. Write focused failing tests first.
      2. Add one canonical resolver whose production default remains `{project_root}/results`, but whose explicit test override resolves only inside a validated temporary directory. Reject repository root, workspace root, `results/`, symlink escapes, and empty/broad paths.
      3. Wire ExperimentTemplate/DeliverableGuard and the smallest necessary shared direct-write surfaces through the resolver. Add a pytest fixture or equivalent test harness that sets the override before experiment modules execute and restores it afterward.
      4. Build positive and negative controls: a simulated legacy writer must be caught; a redirected writer must land under tmp_path; atomic replacement must work; malicious traversal/symlink targets must fail; all quarantine fields and sentinel hashes must survive.
      5. Run a focused mutation-reproducer subset, not the destructive full suite. Compare pre/post git status and tracked-result hashes, then run determination_preservation_lint.py. If any pre-existing result changed, restore nothing automatically; record the exact path and block.
      6. REQUIRED ARTIFACT FIELDS: status, preconditions_checked, known_mutation_inventory, output_root_resolver_and_fixture_paths, production_default_and_test_override_receipts, migrated_writer_inventory, attempted_tracked_write_detection, traversal_symlink_and_broad_target_controls, atomic_write_receipts, quarantine_field_before_after_matrix, tracked_result_hash_before_after_matrix, preexisting_worktree_changes_preserved, determination_preservation_lint_receipt, remaining_unredirected_writer_census, protected_files_unchanged, duration_s, inference_substrate, field_provenance, test_commands, test_exit_codes, reproducibility_checksum, honest_verdict.
         tracked_result_hash_before_after_matrix principle: every pre-existing tracked result is byte-identical across the focused test run.
         attempted_tracked_write_detection principle: the negative control must prove the guard observes a real forbidden attempt rather than passing vacuously.
