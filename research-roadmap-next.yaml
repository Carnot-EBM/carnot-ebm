        retire_if_same_verdict: true
    prompt: |
      CONTEXT:
      This task must run only if Exp5366 reports structured_protocol_clean=true. Exp5352 was correctly blocked in .488. The .488 execution refresh promoted Vera-style deterministic initial/final state and tool-call predicates for reachability evidence.

