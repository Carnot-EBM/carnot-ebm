  - id: exp6559-gatemate-changed-state-continuity
    milestone: "2026.08.567"
    deliverable: results/experiment_6559_gatemate_changed_state_continuity.json
    title: "GateMate changed-physical-state continuity with one-action stop"
    priority: high
    track: hardware
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 90
    model: opus
    prior_failures:
      - experiment_id: exp6525-gatemate-changed-state-continuity
        verdict: "blocked_missing_new_physical_receipt: no operator-authored dated GateMate physical-state receipt newer than Exp6325 exists; zero hardware commands run and Exp3866 remains excluded"
        addressed_by: "This continuation requires a dated operator-authored physical-state receipt newer than Exp6525, not merely newer than the older Exp6325 boundary. Without that changed state it runs zero hardware commands; the same blocked verdict retires this attempt."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      Exp6525 preserved the GateMate hardware track and correctly issued zero commands because no new operator-authored physical-state receipt existed. V567 may act only if cable, port, board power, or another physical condition changed after Exp6525. This is continuity work, not a speed, energy, or availability claim. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md hardware continuity and pre-launch rules, and the V567 roadmap document
      - {project_root}/results/experiment_6525_gatemate_changed_state_continuity.json
      - {project_root}/ops/hardware-bringup-prep.md, {project_root}/ops/known-issues.md, {project_root}/research-hardware-wishlist.md, and operator-authored hardware receipts
      - GateMate RTL, constraints, build files, prior detect and flash transcripts, safe target validation, and hardware tests
      - relevant capability specs, traceability, exclusions including Exp3866, and E2E plan

      TASK
      Search for a dated operator-authored GateMate physical-state receipt newer than Exp6525. Run zero hardware commands without it. With it, run one authorized detect or flash action and stop at the first terminal result.

      CONCRETE STEPS
      0. PRECONDITIONS: record git status, current UTC time, receipt search roots, Exp6525 artifact and hash, USB enumeration from existing receipts only, tool and bitstream identities without touching hardware, CPU/RAM/disk, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for changed-state authorization, receipt provenance, safe target validation, one-action budget, zero-command block, terminal stop, hash capture, and no performance claim. Write focused tests first.
      2. Search only durable operator-authored records for a dated GateMate physical-state change after Exp6525. An agent-written plan, stale USB enumeration, or repeated command output is not authorization.
      3. If no valid receipt exists, issue zero openFPGALoader, JTAG, flash, reset, USB, or board commands. Write the exact failed check, latest receipt date, and zero-command proof. Stop.
      4. If a valid receipt exists, validate its allowed action and explicit board target. Confirm tool, cable, bitstream, expected device, and stop conditions before hardware access.
      5. Run only one authorized action: either a bounded DirtyJTAG GM1Ax detect or a validated flash. Capture command, monotonic time, exit status, stdout and stderr hashes, detected IDCODE or flash receipt, USB identity, and board target. Stop after the first terminal result.
      6. Preserve Exp3866 and all prior exclusion boundaries. Do not retry at multiple clock rates, change RTL, synthesize a new design, infer availability from USB enumeration, or claim latency, speedup, energy, or sampling quality.
      7. Attack stale or agent-authored receipts, ambiguous board targets, mismatched bitstreams, multiple-command execution, status-only success, missing terminal output, and claims beyond the one receipt.
      8. Set gatemate_changed_state_slot_complete_score=1.0 for either a compliant zero-command blocked closure or one terminal authorized action. Set gatemate_hardware_advanced_score=1.0 only for a valid new detect or flash receipt. A repeated no-receipt verdict triggers retirement through prior_failures.
      9. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, row lint, exclusion-manifest lint, adversarial verification, applicable hardware E2E checks, and git status.

      Required deliverable: {project_root}/results/experiment_6559_gatemate_changed_state_continuity.json.
      REQUIRED ARTIFACT FIELDS:
        status:
          principle: "A terminal state distinguishes a safe zero-command closure from incomplete hardware setup."
        honest_verdict:
          principle: "The verdict must name receipt validity, command count, and terminal result with a terminal prefix."
        verdict_class:
          principle: "A closed class prevents a continuity receipt from becoming a performance claim."
        prior_failure_receipt:
          principle: "The artifact must identify Exp6525 and the stricter newer-than boundary."
        operator_physical_state_receipt:
          principle: "Only a dated operator-authored physical change can authorize a new board command."
        safe_target_validation_receipt:
          principle: "Board, cable, tool, action, and bitstream identity must close before hardware access."
        hardware_action_rows:
          principle: "Zero or one action rows make the bounded command budget mechanically recheckable."
        terminal_command_receipt:
          principle: "A real detect or flash result needs command, timing, exit, stream hashes, and device identity."
        zero_command_block_receipt:
          principle: "A missing physical receipt must prove that no hardware command ran."
        exp3866_exclusion_preserved:
          principle: "The known retired path cannot be reopened by a continuity task."
        claim_boundary:
          principle: "The artifact must disclaim latency, speed, energy, quality, and general availability."
        attack_matrix:
          principle: "Receipt, target, command-count, output, and overclaim attacks test hardware integrity."
        gatemate_changed_state_slot_complete_score:
          principle: "The standing hardware slot can close safely without manufacturing activity."
        gatemate_hardware_advanced_score:
          principle: "Only a new valid detect or flash receipt records physical advancement."
        per_unit_rows:
          principle: "Every receipt candidate and any hardware action needs a separate row."
        aggregate_row_recomputation:
          principle: "Command count and advancement must derive from the emitted rows."
        gate_check_summary:
          principle: "A blocked verdict must name the missing receipt check and observed latest date."
        preconditions_checked:
          principle: "Receipt, tool, target, resource, and hash checks separate blocked work from board failure."
        protected_files_unchanged:
          principle: "The hardware task must preserve the active roadmap and conductor."
        inference_substrate:
          principle: "The substrate distinguishes a zero-command receipt audit from an authenticated hardware smoke."
        verifier_is_oracle:
          principle: "The hardware transcript is direct evidence for one action only, not a model verifier."
        field_provenance:
          principle: "Every continuity field must point to receipt paths, command rows, and hashes."
        duration_s:
          principle: "Monotonic time exposes repeated or omitted hardware actions."
        tests_run:
          principle: "Named unit, lint, and hardware E2E receipts show the stop authority was checked."
        reproducibility_checksum:
          principle: "A final hash protects the hardware determination trail."
      Use inference_substrate=dated_hardware_receipt_audit_no_command_no_llm when no valid change exists, or inference_substrate=hardware_smoke for one authorized board action. Set verifier_is_oracle=false. Use verdict_class=blocked for the safe zero-command closure, null for one valid terminal continuity action without a performance claim, partial for incomplete authenticated output, or disqualified for unauthorized commands, target ambiguity, false provenance, or overclaim.

      Run command: cd {project_root} && .venv/bin/python -m carnot.experiment_6559_gatemate_changed_state_continuity --date {date}
      Do NOT push. Do NOT modify scripts/research_conductor.py.

  - id: exp6560-v567-independent-capstone
    milestone: "2026.08.567"
    deliverable: results/experiment_6560_v567_independent_capstone.json
    title: "Independent V567 capstone, adoption boundary, and V568 handoff"
    priority: critical
    track: infrastructure-governance
    requires_gpu: false
    per_unit_rows: true
    max_turns: 100
    estimated_wall_time_min: 150
    model: opus
    operator_override: "2026-05-29 operator directive (standing): routine milestone transition — false-positive scope-match versus prior capstones; V567 aggregates new Exp6548-Exp6559 evidence and does not rerun a prior experiment."
    prior_failures:
      - experiment_id: exp6526-v564-independent-capstone
        verdict: "complete_partial_v564_evidence_graph: row-supported structural, router, CSL, and adaptive validation claims coexist with blocked ARC and GateMate lineages"
        addressed_by: "Exp6526 adjudicated V564 artifacts and closed partial because its ARC and GateMate lanes were blocked. This routine capstone adjudicates a new Exp6548-Exp6559 evidence graph, uses always-run V567 audits, and preserves new blocked lanes instead of repeating V564 measurements."
        retire_if_same_verdict: true
    prompt: |
      CONTEXT
      V567 contains production integration, reversible continuous self-learning, constraint-saturation, ARC generalization, and GateMate continuity lanes. This capstone always runs. It must preserve missing and negative evidence, recompute every comparative headline from rows, and reconcile only changes that actually shipped. Work at {project_root}. The planning date is {date}.

      EXISTING CODE TO READ FIRST
      - {project_root}/CODEX.md, {project_root}/CLAUDE.md, {project_root}/research-program.md, {project_root}/_bmad/prd.md, {project_root}/_bmad/architecture.md, and the V567 roadmap document
      - {project_root}/results/experiment_6548_v567_evidence_eligibility_contract.json through {project_root}/results/experiment_6559_gatemate_changed_state_continuity.json if present
      - all raw receipt, fixture, checkpoint, journal, Rust build, GGUF, exact-checker, ARC, and hardware paths cited by those artifacts
      - {project_root}/scripts/adversarial_verify.py, {project_root}/scripts/verdict_row_consistency_lint.py, {project_root}/scripts/exclusion_manifest_lint.py, {project_root}/scripts/publication_gate.py, and relevant roadmap and ARC lints
      - relevant capability specs, {project_root}/_bmad/traceability.md, {project_root}/ops/status.md, {project_root}/ops/changelog.md, {project_root}/ops/north-star.md, and {project_root}/ops/e2e-test-plan.md

      TASK
      Produce an independent V567 claim ledger and adoption boundary. Recompute production, continuous-learning, saturation, ARC, and hardware dispositions from terminal artifacts and rows. Reconcile specs and operations documents only for work that shipped.

      CONCRETE STEPS
      0. PRECONDITIONS: record git status, expected task and deliverable inventory, artifact and raw-receipt existence and hashes, verifier and lint versions, architecture freshness, CPU/RAM/disk, and protected-file hashes.
      1. Add or confirm REQ-* and SCENARIO anchors for complete task inventory, immutable evidence import, closed verdict classes, row recomputation, circularity, claim boundaries, missing-input disposition, adoption decisions, document reconciliation, and atomic output. Write focused tests first.
      2. Inventory Exp6548 through Exp6559. Distinguish missing artifacts, blocked prerequisites, partial implementation, null science, disqualified evidence, circular positive results, and clean positive results. Never convert missing evidence into a null.
      3. Run live adversarial verification and row-consistency checks on every artifact. Validate protected-file, model, Rust build, exact-checker, fixture, checkpoint, ARC, and hardware receipts as applicable. Quarantine any stamped or live CRITICAL artifact.
      4. Independently recompute disabled adapter identity, Python/Rust parity, fallback reachability, exact output equality, CSL current value, retained-family value, future support, unsafe actions, restart, rollback, constraint phase curves, intervention effects, harmful interventions, charged cost, ARC receipt reachability, and GateMate command count from rows.
      5. Apply the closed verdict enum. A verifier_is_oracle=true comparison cannot receive positive. A failed self-reported acceptance gate cannot receive positive. A production path that changes exact accepted outputs is disqualified.
      6. Write an adoption matrix for production adapter state, Rust/PyO3 state, reversible-memory controller, CSL policy, constraint-saturation policy, ARC supervisor selection, and GateMate hardware. State enabled, default-off, experiment-only, blocked, retired, or rejected with exact evidence.
      7. Recompute the stable G1-G4 publication gate with scripts/publication_gate.py --json. Do not redefine the gate or imply that a V567 integration result closes the independent-reproducer requirement.
      8. Reconcile relevant OpenSpec capability status, _bmad/traceability.md, _bmad/architecture.md, ops/status.md, and ops/changelog.md additively. Document only code and evidence that actually shipped. Do not edit research-roadmap.yaml or the conductor.
      9. Write a V568 handoff with the three remaining largest PRD gaps, retired or excluded directions, clean reusable assets, exact blockers, and any safe next experiment. Do not pre-author or activate another roadmap.
      10. Write one terminal artifact atomically. Run focused tests, lint, spec coverage, row lint, exclusion-manifest lint, ARC floor and orphan lints, adversarial verification, publication gate, applicable E2E checks, reconciliation validation, and git status.

      Required deliverable: {project_root}/results/experiment_6560_v567_independent_capstone.json.
