milestone: 2026.06.389
milestone_title: "RUN THE VERIFIER-AS-REWARD TEST THE LITERATURE LEAVES OPEN — the de-confounded A-vs-B on CODE, where the execution verifier's Youden J=TPR-FPR>>0 clears the training-reward precondition the grid/noisy content-EBMs failed"
milestone_doc: openspec/change-proposals/research-roadmap-v389.md
milestone_overview: |
  .388 closed three honest states: (1) the EFFICIENCY moat is "won" but SEMI-CIRCULAR (exp4186: verifier
  0.84 vs LLM-judge 0.66 at ~free vs 5270 tok/48s -- but on CODE the verifier == the unit-test oracle, so
  it does NOT show a NON-trivial verifier adds value); (2) the GAP-4 graded execution gate is production-safe
  (exp4187 holds +4/-0, guard blocked 25094a63, graded relaxation adds nothing beyond exact-match); (3) the
  sovereign LOCAL generator UNDER-induces (exp4188 0.2258 vs codex 0.9355, self-distill corpus only 7).
  DiffusionGemma BLOCKED (no weights, exp4189). ARC=15 levels/13 games (exp4190); LIVE env reachable
  (exp4191). The operator's 2026-06-11 TOP-PRIORITY PIVOT is verifier-as-REWARD (train a model), not
  -as-SELECTOR (filter at inference). Every attempt at it BLOCKED on the Phase-0 precision gate on GRIDS
  (exp4159 base 0.501 / 0 demo-perfect coverage; exp4100 no grid discrimination). Two facts make it
  executable on CODE: the SAME shared execution primitive certifies code at precision 0.96 (exp4093) -- an
  EXACT, un-hallucinating signal with Youden J>>0 (the arXiv:2601.04411 precondition the noisy content-EBMs
  lacked); and the 2026 literature makes the de-confounded ablation the LOAD-BEARING open question
  (arXiv:2506.10947 Spurious-Rewards: random labels recover ~74% of RLVR gains on Qwen, failing on
  Llama/OLMo). So .389:
    PHASE A -- THE VERIFIER-AS-REWARD HEADLINE (de-confounded A-vs-B on code, finally executable): A1 BUILD
      -- Phase-0 precision + Youden-J + training-headroom + gen-suitability precheck on a code corpus with a
      NON-Qwen base + build the on-policy 3-corpus RFT harness; A2 LAUNCH (gated_on A1 phase0>=0.85) -- 3-arm
      on-policy LoRA-RFT backgrounded (A=verifier-certified, B=same-generator random-label [the spurious
      control], C=gold-SFT, D=cold base); A3 COLLECT (gated_on A2) -- the decisive A-vs-B verdict: does the
      verifier's LABEL carry training signal beyond distillation/spurious-reward?
    PHASE B -- VERIFIER-AS-REWARD FOR THE NORTH STAR: B (exp4200) scale the GAP-4-certified ARC program
      corpus (codex induces 0.94 -> certify -> a bigger corpus than exp4188's 7) + the cheap Invisible-Leash
      in-context-distillation lift test (does seeding the local base with certified exemplars raise its
      induction above the 0.23 ceiling?).
    PHASE C -- ARC NORTH-STAR PROGRESS: C1 (exp4201) monotonic ARC +1 via the hardened GAP-4 stack; C2
      (exp4202) the LIVE ARC-AGI-3 env Carnot-solver-vs-random/greedy-floor probe (NO leaderboard submission).
    PHASE D -- reserved slots: D1 SOTA-ingestion (verifier-as-reward/RLVR-confound track), D2 registry+gaps
      hygiene, D3 hardware continuity, D4 capstone.
  DiffusionGemma stays GATED (gate STILL-PENDING per the .388 correction + weights not cached). GAP-3 trained
  content energies stay RETIRED (operator-authorization required); CEM (arXiv:2510.20607) re-flagged to
  operator only, not auto-run.

  HARD RULE (every task): the TRM Sudoku checkpoint is DONE (val 0.8227, SIGTERM'd) and the conductor stays
  stood-down. NO task may launch TRM training, run pkill/kill against train.py, or WRITE
  results/trm_runs/sudoku_extreme_baseline/. Phase A trains a SEPARATE small code base via LoRA on the RTX
  3090 rig -- it does NOT touch the TRM checkpoint.

