  - id: exp5247-slot-artifact-normalizer-v480
    milestone: "2026.07.480"
    title: "PHASE 1 evidence integrity -- SLOT-style artifact schema and receipt normalizer"
    priority: critical
    track: infrastructure
    deliverable: results/experiment_5247_slot_artifact_normalizer_v480.json
    prior_failures:
      - experiment_id: exp5235-adversarial-qa-null-tautology-calibration-v479
        verdict: "complete: QA calibration passed; Exp 5224/5225 structured null equalities are ready for clean GAP-4 reclassification while Exp 5226 remains blocked by compute-bound duration/methodology checks."
        addressed_by: "This task moves from post-hoc QA calibration to producer-side schema/receipt normalization without weakening methodology checks."
        retire_if_same_verdict: true
      - experiment_id: exp5241-arc-gated-live-patch-attempt-v479
        verdict: "complete: level_delta=0 provenance=live_agent_self_discovery; no level banked under the gated live patch path (no_level_banked)."
        addressed_by: "This task addresses the artifact/receipt shape that caused the ARC result to be quarantined, before any clean ARC rerun is attempted."
        retire_if_same_verdict: true
    agent_type: codex
    model: gpt-5.5
    max_turns: 50
    estimated_wall_time_min: 45
    prompt: |
      CONTEXT:
      Repo at {project_root}, run on or after {date}. Recent milestones repeatedly hit artifact-shape and receipt problems: missing top-level gate booleans, DURATION_TOO_SHORT flags, structured-null/tautology ambiguity, and methodology receipts that were hard to audit. SLOT (arXiv 2505.04016) suggests a model-agnostic structured-output repair layer, but Carnot needs strict repair that never turns bad evidence into good evidence.

      EXISTING CODE TO READ FIRST:
      - CLAUDE.md
      - CODEX.md
      - scripts/experiment_template.py
      - scripts/conductor_gates.py
      - scripts/adversarial_verify.py or the current adversarial verification entry point
      - tests touching artifact validation, conductor gates, or result schemas
      - results/experiment_5235_adversarial_qa_null_tautology_calibration_v479.json
      - results/experiment_5236_gap4_clean_status_after_qa_calibration_v479.json
      - results/experiment_5241_arc_gated_live_patch_attempt_v479.json
      - ops/exclusion_manifest.yaml

      TASK:
      Implement or prototype a strict artifact schema/receipt normalizer outside scripts/research_conductor.py. It may add missing explicit nulls, normalize field wrappers, and surface gate booleans when the source artifact already unambiguously contains the value. It must never synthesize methodology evidence, duration, model receipts, solve provenance, or performance wins.

      CONCRETE STEPS:
      1. Identify the existing result artifact schema patterns and the adversarial verification checks that flagged exp5235/exp5236/exp5241.
      2. Add the smallest repo-native normalizer/helper and tests in the existing Python package or scripts area, not in scripts/research_conductor.py.
      3. Define strict rules: safe normalization, unsafe missing-evidence rejection, gate-field extraction, inference_substrate labeling, duration receipt validation, and principle-field presence checks.
      4. Run the normalizer on representative .479 artifacts and record before/after classifications. Do not alter historical result artifacts unless an existing ops process explicitly expects it.
      5. Run focused unit tests and any spec/coverage checks relevant to the changed files.
      6. Write results/experiment_5247_slot_artifact_normalizer_v480.json with REQUIRED ARTIFACT FIELDS:
         - honest_verdict: object with value/principle; value must start with complete: or blocked_ and state whether the normalizer is ready for gated consumers.
         - inference_substrate: object with value/principle; use cached_fixture_replay_no_llm.
         - artifact_normalizer_ready: bare bool gate field for exp5248.
         - artifact_normalizer_ready_principle: string explaining the gate.
         - safe_repairs_supported: object with list value/principle.
         - unsafe_repairs_rejected: object with list value/principle.
         - duration_policy_preserved: object with bool value/principle.
         - conductor_modified: object with bool value/principle; must be false for scripts/research_conductor.py.
         - tests_run: list with command/outcome.
      Run command, 'Do NOT push. Do NOT modify scripts/research_conductor.py.'

