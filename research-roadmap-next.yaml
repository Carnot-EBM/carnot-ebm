    CONCRETE STEPS:
    1. PRECONDITIONS: Emit a flushed progress line immediately. Resolve {project_root} absolutely; authenticate input bytes, exact schema and resources. Missing or unchanged external inputs produce complete_blocked_<reason>, verdict_class=blocked and exact gate_check_summary. Do not edit credentials, stop foreign processes or invent operator overrides. Record actual effective execution backend; requested routing is not proof of runtime routing.

    2. Emit a flushed progress line at EVERY phase boundary and BEFORE AND AFTER EVERY potentially minutes-long model load, generation, benchmark and subprocess. Print elapsed time and completed units INSIDE long loops at least every 60 seconds. Stream subprocess output and maintain an owned heartbeat while waiting. Keep EVERY silence gap under 600 seconds: a silent run may die at 1200 seconds despite the 4800-second hard cap. Checkpoint completed units; progress lines are not artificial duration padding.

    3. Bound EVERY tool call. Write any file over about 200 lines in several tool calls of roughly 100-150 lines, with a progress message BETWEEN calls. Split long reads and checks too. Put throwaway probes in /tmp, experiment entrypoints in scripts/experiments and tests in tests/python. Do not spend minutes composing one giant write call.

    4. Before implementation, update the relevant capability spec and write meaningful failing tests. Freeze affected files and required validation scope before measuring. Preserve unrelated edits, historical artifacts and operator-curated documents. Use complete original source bytes and label-free predictive inputs. Do not lower gates after seeing results.

    5. Compare the matching staged or activated V672 authority with the independent design table and JSON contract: exactly thirteen tasks Exp7713-Exp7725, including titles, phases, paths, models, substrates and gates. This administrative task gates no science.

    6. Write docs/research-notes/v672-method-map.md from the dated reference review: finite latent-evidence normalization, HallDetect factor-isolated chunking, neutral/missing-evidence distinctions, bounded delayed feedback, and complete hardware cost. Recheck focused arXiv/Semantic Scholar deltas; record access failures and applicability limits in research-studying.md. Preserve all V671 terminal verdicts and raw custody; classify the archive lag explicitly.

    7. In private copies test staged authority and activated-only authority. Reject task deletion, reorder, stale milestone, wrong producer field and absent mandated model. Run schema, exclusion, prior-failure, gate, prompt-path, harness-fit, ARC and overdue readers. Record the effective backend, not just YAML routing; do not change routing or launch another coding agent.

    8. Run scoped pytest with -n 0 -o addopts=, pinned PYTHONPATH, private COVERAGE_FILE and private --basetemp. Require 100 percent changed-module coverage, affected-test spec coverage, scoped Ruff check/format and changed-module mypy. For Rust edits run affected cargo tests, fmt and clippy. Run the task E2E above and applicable checks in ops/e2e-test-plan.md. Record full-suite debt separately; failed required checks disqualify and zero readiness.

    9. Independently cold-reduce raw rows in a fresh process. Run scripts/adversarial_verify.py and scripts/verdict_row_consistency_lint.py --strict on the exact terminal candidate. Record commands, exits and log hashes before atomic result publication. Fixture-oracle evidence is circular_positive; administrative readiness is null. A valid null may open measurement readiness; missing or invalid data may not.

    10. Reconcile openspec, _bmad/traceability.md, ops/status.md and ops/changelog.md from actual evidence. Apply each same-verdict retirement to its actual scope. not_emitted prior markers are conductor custody, not invented honest verdicts. Keep generators frozen and defaults opt-in; do not activate, edit research-roadmap.yaml, publish, submit, purchase hardware or change conductor settings.

    REQUIRED ARTIFACT FIELDS:
    - honest_verdict: Use a terminal complete_ prefix; completion is not evidence of benefit.; principle: Terminal custody prevents retries of unchanged external blocks.
    - verdict_class: Exactly positive | circular_positive | null | blocked | disqualified | partial. External absent/retired/blocked inputs are blocked. partial only means unfinished owned work that a retry can finish.; principle: Claim eligibility travels with the result.
    - flagged_adversarial: Actual final-reader boolean. Flagged evidence must not open readiness gates.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - gate_check_summary: Every blocked result lists check, upstream ID, artifact path, exact field, operator, expected and observed values. Also use this field for complete_blocked_* verdicts.; principle: Exact operands distinguish scientific failure from a broken interface.
    - acceptance_gate_results: Separate measured validity, readiness, probability, utility, coverage, source dependence, retention and efficiency operands; use null for genuinely unmeasured gates.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - rows: Per independent unit/arm, raw metrics, denominators, exclusions, censoring and provenance. Also retain per_game_results on ARC and event/block rows where relevant.; principle: Every comparison must be reproducible without rerunning the experiment.
    - sample_size_budget: Intended/observed/eligible/excluded/censored families, roles, exposure and effective blocks. Seeds/windows/arms are not independent families.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - inference_substrate: Actual current computation in established vocabulary, separate from historical model provenance.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - inference_substrate_class: Actual and planned class: model_full_generation 60s only for real generative workloads; model_bounded_generation 10s for fixed-budget probes; model_load_no_generation 2s for embeddings/load-only. No padding. Before-load blocks report actual no_model_load.; principle: Duration floors must match real computation.
    - MODEL_SPECS: Actual and planned_MODEL_SPECS plus reader-compatible model_specs. Any current LLM uses unsloth/Qwen3.8-27B-GGUF; CPU-only tasks use [] and explicit no-model declaration.; principle: Experimental model identity must match actual invocation.
    - model_invoked: Actual flag plus invocation_counts for loads, forwards, generations, tokens, failures and cancellations.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - execution_venue: host | kv260 | polarfire | gatemate, with execution_venue_details holding host/PID and GPU UUID when used.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - phase_spans: Nonoverlapping monotonic spans, duration_s, heartbeat timestamps, completed units and checkpoints.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - random_seed: Seeds and purposes; reproducibility_checksum binds source bytes, configuration and reducer code.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - source_artifact_hashes: Separate valid producers, flagged historical evidence, pre-gate receipts and missing custody. Never use a planned own result as input.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - preconditions_checked: Measured existence, schema, eligibility and resource checks; no requirement that planned outputs already exist.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - validation_receipts: Predeclared affected scope, actual commands, exits and log hashes, E2E checks and independent cold replay; global debt recorded separately.; principle: Required checks must pass before a result opens downstream execution.
    - verifier_is_oracle: True for exact fixture-truth qualification; forbids positive. Independent human labels are unavailable to the predictive path.; principle: Fixture correctness does not prove an independent learned advantage.
    - field_principles: Echo each required field and acceptance gate with the principle it enforces; do not replace values with vague prose.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - contract_ready_score: 1 only when ordered table, machine contract, YAML and all contract readers agree; administrative null.; principle: Measured evidence bounds the claim and prevents invalid downstream use.
    - method_map_path: docs/research-notes/v672-method-map.md with sources and limits.; principle: Measured evidence bounds the claim and prevents invalid downstream use.

    Run command: cd {project_root} && CARNOT_FORCE_LIVE=1 JAX_PLATFORMS=cpu PYTHONPATH=python:. .venv/bin/python -u scripts/experiments/experiment_7713_v672_contract_methods.py --date {date}
