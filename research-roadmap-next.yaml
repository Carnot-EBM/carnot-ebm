      - exact_ground_truth_count: int (principle: verifier scores need exact labels)
      - false_accept_rate: float (principle: false accepts are the central blocker)
      - false_reject_rate: float (principle: over-rejection can erase utility)
      - abstention_rate: float (principle: safety/coverage tradeoff must be visible)
      - verifier_gain_delta: float (principle: lift must be measured against exact baselines)
      - repair_gate_candidate_state: str (principle: repair gate depends on verifier evidence)
      - false_accept_gate_passed: bool (principle: downstream gate must be machine-readable)
      - tests_run: list (principle: metric aggregation must be checked)
      - source_artifacts: list (principle: claims must trace to concrete files)
      - inference_substrate: dict (principle: GPU/model/live inference status must be explicit)
      - honest_verdict: str (principle: terminal verdict must start with complete:/complete_/success:/success_/passed:/passed_/shipped_ unless a precondition is honestly blocked)

