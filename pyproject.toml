    "I001",
    "N801", "N802", "N803", "N806", "N813", "N814", "N815", "N816", "N817", "N818", "N999",
    "B007", "B009", "B011", "B017", "B018", "B023", "B026", "B027", "B028", "B030", "B904", "B905",
    "TC001", "TC002", "TC003", "TC004", "TC006",
    "UP006", "UP007", "UP024", "UP028", "UP031", "UP032", "UP034", "UP035", "UP037", "UP038", "UP040", "UP043", "UP045",
    "SIM102", "SIM103", "SIM105", "SIM108", "SIM110", "SIM112", "SIM113", "SIM115", "SIM116", "SIM117", "SIM118", "SIM201", "SIM202", "SIM222", "SIM223", "SIM300", "SIM401",
    "BLE001",
    "W605", "W291", "W293",
    "A002", "A003", "A005",
    "PERF",
    "ARG001", "ARG002", "ARG004", "ARG005",
]
# Archived test files preserved for historical reference. Same ignore
# tier as tests/python/.
"tests/archive/*" = [
    "E501", "E402", "E731", "E741", "E702", "E712",
    "F401", "F811", "F841", "F541", "F821",
    "I001",
    "N801", "N802", "N803", "N806", "N811", "N813", "N814", "N817",
    "B007", "B018", "B023", "B905", "B904",
