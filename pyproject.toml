[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carnot-ebm"
dynamic = ["version"]
description = "Open-source Energy Based Model framework for verifying and repairing LLM outputs (Rust + JAX)"
readme = "README.md"
license = {text = "MIT-0"}
authors = [{name = "Ian Blenke", email = "ian@blenke.com"}]
maintainers = [{name = "Ian Blenke", email = "ian@blenke.com"}]
keywords = [
    "energy-based-models",
    "ebm",
    "llm-verification",
    "llm-repair",
    "constraint-satisfaction",
    "ising",
    "sampling",
    "machine-learning",
    "jax",
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11.2",
    "flax>=0.10",
    "jaxtyping>=0.2.23",
    "optax>=0.2",
    "hypothesis>=6.0",
    "numpy>=1.26",
    "safetensors>=0.4",
    "z3-solver>=4.16",
    # datasets — required by multi-corpus eval tasks (MBPP, HumanEval,
    # TruthfulQA via huggingface load_dataset). 2026-05-21 incident:
    # .venv lost this dep, codex emitted blocked_<corpus>_dataset for
    # three .269 corpus tasks because preconditions check failed with
    # ModuleNotFoundError. Pinning so the same regression can't recur.
    "datasets>=3.0",
    # scikit-learn — required at IMPORT time by carnot.verify.__init__, which
    # eagerly imports tier0g_semantic_energy (TfidfVectorizer) plus many
    # models/samplers/verify modules. 2026-05-30 G2 clean-room incident
    # (exp3430): a fresh `pip install -e .` venv lacked sklearn, so importing
    # ANY carnot.verify.* submodule raised `ModuleNotFoundError: No module
    # named 'sklearn'`. That made the FoVer headline reproducer return
    # condition_a=None in a clean room while it passed in the operator's
    # working venv (which happened to have sklearn installed). Declaring it
    # here is the load-bearing fix that lets a fresh clone reproduce G2.
    "scikit-learn>=1.4",
    # python-sat — required by InterwhenTokenMonitor's CNF satisfiability
    # checks. Keep this in core deps because carnot.pipeline imports the
    # monitor in normal package use and tests exercise the live PySAT path.
    "python-sat>=1.8.dev0",
    # MCP is part of the Phase-1 software ship surface. `python -m carnot.mcp`
    # must speak real stdio JSON-RPC after a plain package install, not only
    # after an optional extra.
    "mcp>=1.0",
]

[project.scripts]
carnot = "carnot.cli:main"

[project.urls]
Homepage = "https://github.com/Carnot-EBM/carnot-ebm"
Repository = "https://github.com/Carnot-EBM/carnot-ebm"
Documentation = "https://carnot-ebm.org"
Issues = "https://github.com/Carnot-EBM/carnot-ebm/issues"
"Model Hub" = "https://huggingface.co/Carnot-EBM"
Changelog = "https://github.com/Carnot-EBM/carnot-ebm/blob/main/ops/changelog.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
cuda = [
    "jax[cuda12]>=0.4.30",
    "tensorrt-llm",
]
llm = [
    "openai>=1.0",
]
dwave = [
    "dwave-ocean-sdk>=6.0",
]
mcp = [
    "mcp>=1.0",
]
rust = [
    "maturin>=1.7,<2.0",
]
all = [
    "carnot[llm,mcp,rust,dwave]",
]

# ----------------------------------------------------------------------
# uv index pin for PyTorch CUDA wheel (added 2026-05-21).
#
# Why this exists:
#   On 2026-05-21 the .venv's torch was found to be 2.12.0+cpu (default
#   PyPI wheel without CUDA). 4 dual-condition GPU tasks in .268 emitted
#   blocked_cuda_unavailable as a result. The CPU-only wheel had been
#   silently substituted by an earlier `pip install` operation that
#   resolved torch from pypi.org instead of download.pytorch.org/whl/cu128.
#
# What this does:
#   When `uv pip install` (or `uv sync`) resolves torch / torchvision /
#   torchaudio, it pulls from the pytorch-cu128 index instead of PyPI.
#   This makes "+cu128" the structural default on this project.
#
# What this DOESN'T do:
#   Plain `pip install` (without uv) ignores [tool.uv.*] sections. For
#   that case, scripts/check_torch_cuda.py runs at pre-commit time and
#   refuses any commit if torch.version.cuda is None. The conductor's
#   pre-test gate ALSO indirectly catches this via the smart-subset
#   tests that exercise GPU paths.
#
# To override (if CUDA gets bumped):
#   Update the URL below to whatever stable cu1NN matches the deployed
#   CUDA runtime, then run:
#     uv pip install --reinstall --upgrade torch torchvision torchaudio
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"carnot.schemas" = ["*.json"]
"carnot.sampling._vendored_thrml" = ["LICENSE", "py.typed"]

[tool.setuptools.dynamic]
version = {attr = "carnot._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/integration"]
# scripts/experiments/ added to pythonpath 2026-05-21 — root-level
# experiment_*.py / run_experiment_*.py / train_kan.py were moved
# from repo root to scripts/experiments/ for a presentable repo
# layout. Tests still `from experiment_2740 import ...` etc., so the
# directory must be on sys.path during test collection. The same
# directory works for any direct python invocation that goes through
# pytest's rootdir setup.
pythonpath = ["scripts/experiments"]
# tmpfs inode-exhaustion fix (2026-06-03): the conductor runs pytest on every
# task, so pytest's per-run temp dirs (/tmp/pytest-of-USER/pytest-N/) accumulate
# on the 1M-inode /tmp tmpfs and eventually exhaust inodes, breaking ALL /tmp
# writes. Keep temp dirs ONLY for failed tests, and only the most recent run, so
# green runs leave nothing behind. (Belt-and-suspenders with the 30-min reaper in
# ~/.carnot/orphan-cleanup.sh.)
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
# tests/archive/ contains tests for completed experiments and deprecated
# modules (activation-based EBMs). Run explicitly: pytest tests/archive/
addopts = [
    "--cov=python/carnot",
    "--cov-report=term-missing",
    "--cov-fail-under=99",
    "--ignore=tests/archive",
    # Schema-drifted tests blocking codex pre-test self-heal in .92.
    # Each test file targets an artifact schema that NEVER materialised
    # (verified back to commit 618c7a5f). See ops/known-issues.md
    # entry 2026-05-03 00:55Z for the rebuild-vs-delete remediation
    # plan. .92 (or .93) MANDATORY-NEXT-MILESTONE pickup.
    "--ignore=tests/python/test_experiment_337_retro.py",
    "--ignore=tests/python/test_experiment_355_adversarial_benchmark.py",
    "--ignore=tests/python/test_experiment_1033_thinkprm_v4.py",
    "--ignore=tests/python/test_boltzmann_repair.py",
    "--ignore=tests/python/test_experiment_368_precision_live.py",
    "--ignore=tests/python/test_experiment_692_preflight_v5.py",
    "-v",
    "-n", "4",
]
markers = [
    "memory_watchdog_skip: skip the per-test RSS leak failure for known high-RSS compiler/cache smoke tests",
]

[tool.coverage.run]
omit = [
    # Deprecated Phase 1 activation modules (proven not to work)
    "python/carnot/embeddings/activation_extractor.py",
    "python/carnot/embeddings/activation_steering.py",
    "python/carnot/embeddings/concept_vectors.py",
    "python/carnot/embeddings/hallucination_direction.py",
    "python/carnot/embeddings/layer_ebm.py",
    "python/carnot/embeddings/layer_navigator.py",
    "python/carnot/embeddings/weight_steering.py",
    "python/carnot/embeddings/jepa_energy.py",
    "python/carnot/embeddings/layer_probing.py",
    # Completed experiment modules (tests archived to tests/archive/)
    "python/carnot/pipeline/spilled_energy.py",
    "python/carnot/pipeline/factual_extractor.py",
    "python/carnot/pipeline/jepa_predictor.py",
    "python/carnot/samplers/npu_backend.py",
    "python/carnot/inference/constraint_models.py",
    "python/carnot/inference/guided_decoding.py",
    "python/carnot/models/lagoon.py",
    "python/carnot/pipeline/knowledge_base.py",
    "python/carnot/pipeline/lookahead_energy.py",
    "python/carnot/sampling/_vendored_thrml/*",
    "python/carnot/sampling/_vendored_thrml/models/*",
    # Other untested scripts (not core product code)
    "scripts/*.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# scripts/research_conductor.py predates the strict pre-commit ruff hook
# (the hook was activated 2026-04-26 after the file was already 2,800+
# lines of conductor logic). Four pre-existing patterns are intentional
# enough that retrofitting them would create churn without value:
#   - N806: STALL_TIMEOUT / WALL_CLOCK_TIMEOUT / OPUS_FIX_ENABLED etc. are
#     constant-style configuration values that happen to be declared
#     inside the main() / research_step() bodies for scope. Renaming to
#     lower-case loses the "this is a tuned knob, not a working variable"
#     reading distinction.
#   - SIM105: try/except/pass on subprocess.wait(timeout=) is the canonical
#     pattern in this file's process-supervision code; contextlib.suppress
#     would change the local style for two call sites only.
#   - E501: a small number of CLI-arg list lines and verbose log messages
#     run past 100 chars; wrapping them adds noise without aiding readers.
#   - E402: the `import re` block at line ~902 is co-located with the
#     lazy exclusion-manifest cache that uses it; moving it to the top of
#     the file would split the cache implementation across two locations.
# Genuinely-new lint violations on edited regions still surface — ruff
# enforces the rest of the suite, just not these four codes for this file.
"scripts/research_conductor.py" = ["N806", "SIM105", "E501", "E402", "UP038"]
# tests/python/ predates the pre-commit ruff hook activation. Years of
# test-code accumulated 3,000+ stylistic ruff violations (long lines in
# parametrize tables, sys.path-then-import patterns for scripts/, uppercase
# locals as fixtures, ambiguous `l` in math tests, etc.). The codes silenced
# below are pure-style; substantive codes (B-series correctness, F-series
# unused names, plus genuine bug-likely patterns) are still enforced.
# Test code authored AFTER 2026-04-26 should still pass strict ruff on the
# substantive codes — only the listed style codes get a pass.
"tests/python/*" = [
    "E501", "E402", "E731", "E741",  # style: line length, import order, lambdas, ambiguous names
    "F401", "F811", "F841", "F541",  # unused imports/redefs/vars/empty-fstrings (tests use these as fixture side-effects)
    "I001",                          # unsorted imports
    "N801", "N802", "N803", "N806", "N814", "N817",  # naming conventions (test fixtures, helpers)
    "B007", "B023", "B905",          # loop-control & zip-strict (intentional in test patterns)
    "TC002", "TC003",                # typing-only imports (tests don't need this hygiene)
    "UP006", "UP031", "UP035", "UP037", "UP038",  # type-syntax modernization
    "SIM102", "SIM108", "SIM115", "SIM117", "SIM118", "SIM201", "SIM202", "SIM222", "SIM300",  # readability suggestions
    "W605",                          # invalid escape (intentional in regex tests)
    "A002",                          # arg shadowing builtin (test fakes mirror real signatures intentionally)
    "N813",                          # camelcase imported as lowercase (test alias patterns)
]
# Core package python/carnot/ predates the strict pre-commit ruff hook.
# Same kind of accumulated style-debt as tests/python/ — long lines in
# physics-inspired identifiers, uppercase locals for tuned constants,
# blanket-except patterns in numerical fallbacks, etc. The codes silenced
# below are pure-style or project-pattern; bug-prone codes (B-series for
# correctness, F8xx for unused names + undefined refs, A-series for
# builtin shadowing) remain enforced.
#
# Genuinely-new violations on edited regions still surface — only the
# pre-existing pattern codes are silenced. The "make pre-commit chain
# green" follow-up should address F821 (undefined names — typically
