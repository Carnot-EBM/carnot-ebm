# remaining substantive cleanup.
"python/carnot/**" = [
    "E501", "E402", "E731", "E741", "E702", "E712", "E722",
    "F401", "F811", "F841", "F541", "F403", "F405", "F402", "F601", "F821",
    "I001",
    "N801", "N802", "N803", "N806", "N814", "N815", "N816", "N817", "N818",
    "B007", "B023", "B904", "B905", "B027", "B026", "B009", "B011", "B015", "B017", "B018", "B028",
    "TC001", "TC002", "TC003", "TC004", "TC006",
    "UP006", "UP007", "UP024", "UP028", "UP031", "UP032", "UP034", "UP035", "UP037", "UP038", "UP040", "UP043", "UP045",
    "SIM102", "SIM103", "SIM105", "SIM108", "SIM110", "SIM112", "SIM113", "SIM115", "SIM116", "SIM117", "SIM118", "SIM201", "SIM202", "SIM222", "SIM223", "SIM300", "SIM401",
    "BLE001",
    "W605", "W291", "W293",
    "A002", "A003", "A005",
    "PERF",
    "ARG001", "ARG002", "ARG004", "ARG005",
]

# Conductor-generated experiment scripts (auto-written by Sonnet during
